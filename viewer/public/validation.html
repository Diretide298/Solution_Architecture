<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // The saved day/night choice, before the stylesheets resolve. `theme.js`
      // owns this key; this is only here because a module cannot run early
      // enough to beat the first paint.
      try {
        if (localStorage.getItem('ticvai-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch { /* storage can be denied outright; day is a fine fallback */ }
    </script>
    <title>Atlas — sign-off</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/layers.css" />
    <link rel="icon" href="/brand/atlas-mark.png" />
  </head>
  <body class="admin-page">
    <header class="admin-bar">
      <!-- The same lockup the viewer chrome carries, so a reader who
           followed a link off the main view lands somewhere that looks
           like where they came from. Two cuts because this bar is a light
           surface in day and a dark one at night, and the white-ink lockup
           is invisible on the first. -->
      <div class="brand">
        <img class="brand-lockup brand-lockup-day" src="/brand/atlast_blackfont.png" alt="Atlas" />
        <img class="brand-lockup brand-lockup-night" src="/brand/atlas-lockup.png" alt="" aria-hidden="true" />
        <span class="brand-sub">sign-off</span>
      </div>
      <div class="admin-bar-right">
        <span id="whoami" class="admin-who"></span>
        <a class="chip" href="/">Back to the viewer</a>
      </div>
    </header>

    <main class="admin-main">
      <!-- The four kinds are the four things a verdict can be about, and the
           order is the order somebody reviewing a delivery goes in: what the
           API offers, what it stores, what a person sees, what it was drawn
           as. -->
      <section class="admin-panel">
        <h1 class="admin-heading">What has been signed off</h1>
        <p class="auth-note" id="overall">Reading…</p>
        <div class="signoff-grid" id="totals"></div>
      </section>

      <section class="admin-panel">
        <div class="signoff-controls">
          <div class="seg" id="kind-tabs"></div>
          <input id="filter" class="auth-input signoff-filter" type="text"
                 placeholder="filter by name, reviewer or note" />
          <label class="signoff-toggle">
            <input type="checkbox" id="only-open" />
            <span>only what still needs a verdict</span>
          </label>
        </div>
        <p class="auth-error" id="error" hidden></p>
        <div id="rows"></div>
        <p class="pane-note" id="listing-note"></p>
      </section>
    </main>

    <script type="module" src="/signoff.js"></script>
  </body>
</html>
