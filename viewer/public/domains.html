<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // The saved day/night choice, before the stylesheets resolve. `theme.js`
      // owns this key; this is only here because a module cannot run early
      // enough to beat the first paint.
      try {
        if ((localStorage.getItem('ticvai-theme') ?? 'dark') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch { /* storage can be denied outright; day is a fine fallback */ }
    </script>
    <title>Adam — domains</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/layers.css" />
    <link rel="stylesheet" href="/domains.css" />
    <link rel="icon" href="/brand/adam-mark.png" />
    <script>
      // The curtain's dead man's switch. A wrong loading screen is a bad page;
      // one that never lifts is no page, so this fires whatever else breaks.
      // `loader.js` sets `claimed` on import, which is how a page with a script
      // of its own says it will lower the curtain at the right moment instead.
      window.__adamLoader = { claimed: false };
      (function () {
        var down = function () {
          var box = document.getElementById('adam-loader');
          if (box) { box.classList.add('is-done'); setTimeout(function () { box.remove(); }, 700); }
        };
        window.__adamLoader.timer = setTimeout(down, 12000);
        window.addEventListener('load', function () {
          // A page with no script of its own has nothing to say when it is
          // ready, so `load` is as good as it gets. One that imported loader.js
          // is left alone: on the viewer, `load` fires long before the index
          // has been read.
          setTimeout(function () { if (!window.__adamLoader.claimed) down(); }, 300);
        });
      })();
    </script>
  </head>
  <!-- No sign-in gate. Every other standalone page reads verdicts, which are
       personal and belong to an account; this one reads only the package, so
       putting a door in front of it would cost a reader something and protect
       nothing. -->
  <body class="admin-page domains-page">
    <!-- The loading curtain. Inline, and first in the body, so it is
         painted by the first frame — a loader that arrives with the
         JavaScript misses the module fetch, which is the part of the
         wait it exists to cover. `loader.js` takes it down; the guard in
         the head above is what happens if nothing ever does. -->

" x2="71.0" y2="79.0"/><line class="al-link" style="--i:19" x1="71.0" y1="79.0" x2="89.0" y2="123.0"/><line class="al-link" style="--i:5" x1="143.0" y1="75.0" x2="127.0" y2="115.0"/><line class="al-link" style="--i:14" x1="59.0" y1="135.0" x2="107.0" y2="161.0"/><line class="al-link" style="--i:8" x1="149.0" y1="139.0" x2="127.0" y2="115.0"/><line class="al-link" style="--i:13" x1="89.0" y1="123.0" x2="107.0" y2="161.0"/></g><path class="al-glyph" d="M105,28 C110,64 124,116 151,161 C134,150 119,136 105,127 C91,136 76,150 59,161 C86,116 100,64 105,28 Z"/><path class="al-stand" d="M105,128 L105,176 M105,158 L90,171 M105,158 L120,171"/><g class="al-nodes"><circle class="al-node" style="--i:0" cx="105.0" cy="18.5" r="6.6"/><circle class="al-node" style="--i:2" cx="148.9" cy="28.9" r="6.1"/><circle class="al-node" style="--i:4" cx="177.6" cy="63.1" r="5.5"/><circle class="al-node" style="--i:6" cx="192.9" cy="105.0" r="6.5"/><circle class="al-node" style="--i:8" cx="180.1" cy="148.4" r="5.4"/><circle class="al-node" style="--i:10" cx="148.6" cy="180.5" r="5.6"/><circle class="al-node" style="--i:12" cx="105.0" cy="192.3" r="6.3"/><circle class="al-node" style="--i:14" cx="62.1" cy="179.3" r="5.3"/><circle class="al-node" style="--i:16" cx="32.5" cy="146.8" r="6.6"/><circle class="al-node" style="--i:18" cx="18.1" cy="105.0" r="6.7"/><circle class="al-node" style="--i:20" cx="32.9" cy="63.4" r="5.2"/><circle class="al-node" style="--i:22" cx="62.9" cy="32.1" r="5.4"/><circle class="al-node" style="--i:20" cx="71.0" cy="79.0" r="4.6"/><circle class="al-node" style="--i:3" cx="143.0" cy="75.0" r="5.2"/><circle class="al-node" style="--i:16" cx="59.0" cy="135.0" r="4.4"/><circle class="al-node" style="--i:9" cx="149.0" cy="139.0" r="4.8"/><circle class="al-node" style="--i:12" cx="107.0" cy="161.0" r="4.2"/><circle class="al-node" style="--i:15" cx="89.0" cy="123.0" r="3.6"/><circle class="al-node" style="--i:8" cx="127.0" cy="115.0" r="3.4"/></g></svg>
      <p class="al-text">Reading the domain lenses…</p>
    </div>
    <header class="admin-bar">
      <!-- The same lockup the viewer chrome carries, so a reader who
           followed a link off the main view lands somewhere that looks
           like where they came from. Two cuts because this bar is a light
           surface in day and a dark one at night, and the white-ink lockup
           is invisible on the first. -->
      <div class="brand">
        <a class="brand-home" href="/" aria-label="Adam — back to the viewer">
          <img class="brand-lockup brand-lockup-day" src="/brand/adam-lockup-day.png" alt="Adam" />
          <img class="brand-lockup brand-lockup-night" src="/brand/adam-lockup-night.png" alt="" aria-hidden="true" />
        </a>
        <span class="brand-sub">domains</span>
      </div>
      <div class="admin-bar-right">
        <a class="chip" href="/validation.html">Sign-off</a>
        <a class="chip" href="/?layer=uiux">UI/UX</a>
        <a class="chip" href="/reviews.html">Review activity</a>
        <a class="chip" href="/">Back to the viewer</a>
      </div>
    </header>

    <main class="admin-main domains-main">
      <!-- What the lens is and where it starts. The seed and the docs are
           stated up front because a derived view that will not say what it
           derived from is asking to be trusted rather than checked. -->
      <section class="admin-panel lens-head">
        <div class="seg lens-tabs" id="lens-tabs" hidden></div>
        <h1 class="lens-title" id="lens-title">Reading the package…</h1>
        <p class="lens-blurb" id="lens-blurb"></p>
        <div class="lens-meta" id="lens-meta"></div>
      </section>

      <p class="auth-error" id="error" hidden></p>

      <section class="stat-strip" id="headline"></section>

      <!-- The finding, above the panes and outside the tabs. It is the reason
           to open the page, and a reader who has to pick the right tab before
           they see it will not see it. -->
      <section class="finding-panel" id="finding" hidden></section>

      <nav class="seg pane-tabs" id="pane-tabs"></nav>

      <section class="admin-panel" id="pane-reach" hidden>
        <h2 class="admin-heading">
          Who can invoke it, what it touches, who can stop it
          <span class="admin-count" id="reach-note"></span>
        </h2>
        <p class="pane-note" id="reach-lead"></p>
        <div class="signoff-controls">
          <div class="seg" id="reach-filter"></div>
        <div class="side-filter-row subsearch-row">
          <input id="subsearch" class="auth-input subsearch-input" type="search"
                 placeholder="Filter this lens…" autocomplete="off" />
          <span class="pane-count" id="subsearch-count"></span>
        </div>

        </div>
        <div class="reach-legend" id="reach-legend"></div>
        <div id="reach"></div>
      </section>

      <section class="admin-panel" id="pane-members" hidden>
        <h2 class="admin-heading">
          Everything the lens gathered
          <span class="admin-count" id="members-note"></span>
        </h2>
        <p class="pane-note" id="members-lead"></p>
        <div id="members"></div>
      </section>

      <section class="admin-panel" id="pane-gaps" hidden>
        <h2 class="admin-heading">
          Where the graph and the tags disagree
          <span class="admin-count" id="gaps-note"></span>
        </h2>
        <p class="pane-note" id="gaps-lead"></p>
        <div id="gaps"></div>
      </section>
    </main>

    <script type="module" src="/domains.js"></script>
  </body>
</html>
