<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas — review activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/layers.css" />
    <link rel="icon" href="/brand/atlas-mark.png" />
  </head>
  <body class="admin-page">
    <header class="admin-bar">
      <div class="brand">
        <img class="brand-mark brand-mark-day" src="/brand/atlas-mark-light.svg" alt="" />
        <img class="brand-mark brand-mark-night" src="/brand/atlas-mark-night.svg" alt="" aria-hidden="true" />
        <span class="brand-name">Atlas</span>
        <span class="brand-sub">review activity</span>
      </div>
      <div class="admin-bar-right">
        <span id="whoami" class="admin-who"></span>
        <a class="chip" href="/validation.html">Sign-off</a>
        <a class="chip" href="/">Back to the viewer</a>
      </div>
    </header>

    <main class="admin-main reviews-main">
      <!-- Above the numbers, because it is addressed to you personally and
           everything below it is about everybody. Absent entirely when nobody
           has named you, rather than an empty box saying so. -->
      <section class="admin-panel mentions-panel" id="mentions-panel" hidden>
        <h2 class="admin-heading">
          Where you were named <span class="admin-count" id="mentions-note"></span>
          <button class="chip mentions-read" id="mentions-seen" type="button">
            Mark all read
          </button>
        </h2>
        <div id="mentions"></div>
      </section>

      <!-- The four numbers worth knowing before any filter is touched. -->
      <section class="stat-strip" id="headline"></section>

      <section class="admin-panel">
        <h2 class="admin-heading">Pace <span class="admin-count" id="pace-note"></span></h2>
        <div id="pace"></div>
      </section>

      <!-- Disagreement is the reason this page exists rather than a list. Two
           people reaching different verdicts on the same thing is the single
           most useful signal a review produces, and a summary of current
           verdicts has already discarded it. -->
      <section class="admin-panel" id="contested-panel" hidden>
        <h2 class="admin-heading">
          Disagreement <span class="admin-count" id="contested-note"></span>
        </h2>
        <div id="contested"></div>
      </section>

      <section class="admin-panel">
        <h2 class="admin-heading">Reviewers <span class="admin-count" id="people-note"></span></h2>
        <div id="people"></div>
      </section>

      <section class="admin-panel">
        <h2 class="admin-heading">Every response <span class="admin-count" id="rows-note"></span></h2>
        <div class="signoff-controls reviews-filters">
          <div class="seg" id="f-kind"></div>
          <div class="seg" id="f-layer"></div>
          <!-- Which side has to act, and whether anybody has. These two are the
               reason the list is a table: they are the columns a delivery
               meeting sorts by. -->
          <!-- Whose review: the team's or the client's. Two reviews of one
               package, kept apart so a count says approved by whom. -->
          <div class="seg" id="f-audience"></div>
          <div class="seg" id="f-tag"></div>
          <div class="seg" id="f-done"></div>
          <div class="seg" id="f-verdict"></div>
          <select class="scope-select" id="f-person"></select>
          <select class="scope-select" id="f-window"></select>
          <input id="f-text" class="auth-input signoff-filter" type="text"
                 placeholder="search notes, artefacts, people" />
          <button class="chip" id="f-clear" type="button">Clear</button>
          <button class="chip" id="f-export" type="button"
                  title="Exports exactly the rows shown — every filter above applies">Export CSV</button>
        </div>
        <p class="auth-error" id="error" hidden></p>
        <div id="rows"></div>
      </section>
    </main>

    <script type="module" src="/reviews.js"></script>
  </body>
</html>
