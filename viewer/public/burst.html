<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adam — burst scope</title>
    <!--
      The flash sale was a standalone page. It is a view of the CI/CD layer now,
      and this address is kept only so that a link somebody sent, a bookmark or
      the chrome button in an older cache still lands somewhere real.

      Same shape as `uiux.html`, and for the same reason: it carries the project
      through, and it *replaces* rather than pushes a history entry — a redirect
      you can press Back into is a redirect you cannot press Back out of.
    -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var to = new URLSearchParams();
        if (q.get('project')) to.set('project', q.get('project'));
        to.set('layer', 'cicd');
        to.set('mode', 'cicd-burst');
        location.replace('/?' + to.toString());
      })();
    </script>
  </head>
  <body></body>
</html>
