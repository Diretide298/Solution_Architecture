<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adrov — UI/UX</title>
    <!--
      UI/UX was three standalone pages. It is a layer of the viewer now, so this
      address is kept only so that a link somebody sent, a bookmark or an old
      deep link still lands somewhere real. It carries the project through, and
      it replaces rather than pushes a history entry — a redirect you can press
      Back into is a redirect you cannot press Back *out* of.
    -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var to = new URLSearchParams();
        if (q.get('project')) to.set('project', q.get('project'));
        to.set('layer', 'uiux');
        to.set('mode', 'uiux-screens');
        // `?platform=` on the old canvas address is read by the canvas itself,
        // so it has to survive the hop.
        if (q.get('platform')) to.set('platform', q.get('platform'));
        location.replace('/?' + to.toString());
      })();
    </script>
  </head>
  <body></body>
</html>
