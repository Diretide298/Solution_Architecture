# F03 — Partner books on credit
#
# Validated against _schema.yaml by tools/check-flows.py.

id: F03
name: Partner books on credit
actor: partner
capability: C34
wave: 2
frequency: daily
criticality: revenue
platforms:
- P10 Partner & Reseller Portal
offlineBehaviour: Cannot start. Credit position must be read from the primary.
trigger:
  description: A reseller booking against an agreed credit line rather than paying up front.
  entryScreen: PTR-002
steps:
- step: 1
  screen: PTR-002
  action: Reviews credit position
  operations:
  - getB2bCredit
  outcome: Sees available credit before building an order, not after
- step: 2
  screen: PTR-007
  action: Searches availability
  operations:
  - getAvailability
  outcome: Sees the allocation reserved for the B2B channel, not the total
- step: 3
  screen: PTR-008
  action: Creates the booking
  operations:
  - createOrder
  outcome: Order raised against the partner account
- step: 4
  screen: PTR-016
  action: Downloads vouchers
  operations:
  - reprintOrder
  outcome: Tickets issued for onward distribution
branches:
- at: 3
  condition: The order exceeds available credit
  severity: requiresStaff
  behaviour: Refused, with the shortfall stated. A supervisor may authorise a single-order override,
    which records who authorised it and expires — a partner past their limit is a decision someone owns.
  resolvedBy: overrideCreditLimit
- at: 3
  condition: The partner account is suspended
  severity: requiresStaff
  behaviour: Refused with the reason. Suspension is commercial and must not read as a system fault.
  resolvedBy: Duty manager
- at: 2
  condition: The B2B channel allocation is exhausted
  severity: recoverable
  behaviour: Shows sold out for this channel while other channels may still have capacity. Correct under
    channel allocation, and worth saying plainly in the portal.
  resolvedBy: Automatic
exitStates:
- state: completed
  description: Order raised on credit, vouchers issued
- state: escalated
  description: Awaiting a credit override decision
