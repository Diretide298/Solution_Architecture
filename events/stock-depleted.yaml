# stock.depleted v1 — published by inventory
# Checked by tools/check-states.py against states/ and the contracts.

name: stock.depleted
version: 1
publisher: inventory
description: Stock left a location — sold, wasted, transferred or counted out.
aggregate: inventoryItem
emittedWhen: Any movement posted to the ledger
payload:
- field: movementId
  type: string
- field: itemId
  type: uuid
- field: locationId
  type: uuid
- field: venueId
  type: uuid
- field: quantity
  type: number
  notes: Signed. Negative is out
- field: reason
  type: string
  notes: sale, waste, transfer, count, prizeRedemption
- field: sourceId
  type: string
  notes: The order, transfer or count that caused it
- field: recordedAt
  type: timestamp
consumers:
- context: ledger
  purpose: Post cost of sales or a waste write-off
  idempotencyKey: movementId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Stock position
  idempotencyKey: movementId
  onFailure: retry
  isCritical: false
- context: marketing
  purpose: Trigger a low-stock alert where configured
  idempotencyKey: movementId
  onFailure: ignore
  isCritical: false
retention: 30 days after publication
notes: One event for every reason a movement happens. A separate event per reason would mean the ledger
  subscribing to six things to answer one question.
