        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Supervisor verification
      description: >
        Where the category requires it, a second person confirms the work. The verifier may
        not be the technician who did it — the point is a second pair of eyes, and enforcing
        that is cheaper than discovering it was skipped.
