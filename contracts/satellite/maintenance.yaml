      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [wrongSkill, notOnShift, wrongVenue, alreadyInHand, unsafe, other]
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Returned to the pool
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{workOrderId}/start:
