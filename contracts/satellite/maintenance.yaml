openapi: 3.1.0
info:
  title: TICVAI Maintenance & Safety
  version: 0.1.0
  x-ticvai-screen-count: 35
  x-ticvai-tier: satellite
  x-ticvai-module: "15 — Maintenance & Safety Management"
  x-ticvai-requirements: 50
  x-ticvai-capabilities: [C11, C12, C94]
  x-ticvai-platforms:
    - "P06 Staff Ops App"
    - "P08 Venue Back Office"
  description: >
    ## What this contract covers

    **Assets, work orders, inspections and incidents. Photo-first, offline-capable.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 15 — Maintenance & Safety Management |
    | **Requirements** | ~50 |
    | **Capabilities** | C11, C12, C94 |
    | **Consumed by** | P06 Staff Ops App · P08 Venue Back Office |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Assets, work orders, planned maintenance, safety inspections and incident reporting.
    Domain 15 — 50 requirements.

    Positions this encodes:

    - **Photo-first capture** (10 Aug §5.3). A technician in a plant room documents with a
      camera, not a keyboard. Attachments are first-class on work orders, inspections and
      incidents rather than an afterthought.
    - **Every operation a field technician performs is offline-capable.** Plant rooms, roof
      spaces and back-of-house corridors have no signal, and a maintenance app that stops
      working there is a maintenance app nobody uses.
    - **An asset out of service closes the loop into operations.** A ride flagged unsafe
      appears on the venue map, blocks its access point, and stops its product selling. A
      maintenance system that only tells maintenance is half a system.
    - **Incidents are not work orders.** An incident is something that happened to a person
      or a place and carries regulatory weight; a work order is something to be fixed. An
      incident may raise a work order, never the reverse.
    - Compliance inspections are retained for seven years alongside the financial trail.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: asset
  - name: workOrder
  - name: planned
  - name: inspection
  - name: incident

paths:
  # ---------------------------------------------------------------- assets
  /assets:
    get:
      operationId: listAssets
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      x-ticvai-read-routing: replica
      summary: List assets
      tags: [asset]
      x-ticvai-permission: ASSET_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssetStatus' }
        - name: maintenanceDue
          in: query
          description: Assets with a planned task due or overdue.
          schema: { type: boolean }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Assets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Asset' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createAsset
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      summary: Register an asset
      description: >
        Rides, plant, vehicles, IT equipment, furniture. Where the asset backs a sellable
        product or an access point, that link is recorded here and is what allows a fault to
        stop a sale.
      tags: [asset]
      x-ticvai-permission: ASSET_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssetRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '409':
          description: Asset tag already in use
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAsset
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      x-ticvai-read-routing: replica
      summary: Read an asset with history and documents
      description: >
        What a technician sees after scanning a tag — specification, service history, open
        work orders, attached procedures and manuals, warranty position.
      tags: [asset]
      x-ticvai-permission: ASSET_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateAsset
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      summary: Amend an asset
      tags: [asset]
      x-ticvai-permission: ASSET_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                locationDescription: { type: string, maxLength: 500 }
                categoryId: { type: string, format: uuid }
                warrantyExpiresAt: { type: string, format: date }
                supplierId: { type: string, format: uuid }
                documentRefs:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }

  /assets/lookup:
    get:
      operationId: lookupAsset
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      x-ticvai-read-routing: replica
      summary: Find an asset by tag or QR
      description: >
        The scanner path, and the first thing a technician does on arriving at a fault.
        Offline-capable, because plant rooms have no signal.
      tags: [asset]
      x-ticvai-permission: ASSET_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: assetTag
          in: query
          schema: { type: string }
        - name: serialNumber
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /assets/{assetId}/status:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setAssetStatus
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      summary: Take an asset out of service or return it
      description: >
        **This closes the loop into operations.** Taking a ride out of service marks it on the
        venue map, blocks its access point, and stops its product selling — a maintenance
        system that only tells maintenance is half a system.

        Returning to service requires a completed inspection where the asset's category
        demands one. A technician cannot simply declare a ride safe.
      tags: [asset]
      x-ticvai-permission: ASSET_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAssetStatusRequest' }
      responses:
        '200':
          description: Status set, with downstream effects reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetStatusResult' }
        '409':
          description: >
            Return to service attempted without the inspection this asset category requires.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /assets/{assetId}/history:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAssetHistory
      x-ticvai-consumed-by:
        - "P08 BO-031 Access Point Configuration"
        - "P08 BO-069 Asset Register"
        - "P13 CMS-004 Logo & Assets"
      x-ticvai-read-routing: analytical
      summary: Service history
      description: >
        Every work order, inspection, incident and status change, in sequence. What an
        insurer or a regulator asks for after something goes wrong.
      tags: [asset]
      x-ticvai-permission: ASSET_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AssetHistoryEntry' }

  # ---------------------------------------------------------------- work orders
  /work-orders:
    get:
      operationId: listWorkOrders
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      x-ticvai-read-routing: replica
      summary: List work orders
      description: >
        A technician's queue. Defaults to their own assignments; a supervisor sees the venue.
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: assignedToPrincipalId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkOrderStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/WorkOrderPriority' }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: overdueOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Work orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WorkOrder' }

    post:
      operationId: createWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Raise a work order
      description: >
        Raised by anyone — a technician, a duty supervisor, a cashier who noticed a broken
        turnstile, or automatically from a planned task or a failed inspection.

        **Photo-first.** Attachments are expected at creation, not added later from memory.

        Offline-capable: a fault found in a plant room is recorded there, not remembered
        until the technician finds signal.
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkOrderRequest' }
      responses:
        '201':
          description: Raised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }

  /work-orders/{workOrderId}:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      x-ticvai-read-routing: replica
      summary: Read a work order
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Work order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Assign, reprioritise or amend
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                assignedToPrincipalId: { type: string, format: uuid }
                priority: { $ref: '#/components/schemas/WorkOrderPriority' }
                dueAt: { type: string, format: date-time }
                description: { type: string, maxLength: 5000 }
                categoryId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{workOrderId}/time:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: recordWorkOrderTime
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Start, pause or stop work
      description: >
        The timer. Labour time drives cost and is the ground truth for how long jobs actually
        take, which is what makes planned maintenance intervals meaningful rather than
        guessed.

        Offline-capable, so a technician records against the job in front of them rather than
        reconstructing the day afterwards.
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, action, recordedAt]
              properties:
                id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                action:
                  type: string
                  enum: [start, pause, resume, stop]
                pauseReason:
                  type: string
                  enum: [awaitingParts, awaitingAccess, awaitingApproval, endOfShift, reassigned, other]
                note: { type: string, maxLength: 500 }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '409':
          description: Action inconsistent with the current timer state
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /work-orders/{workOrderId}/parts:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: recordWorkOrderParts
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Record parts consumed
      description: >
        Issues stock through the inventory movement ledger — one ledger, not a second parts
        count maintained by maintenance.

        **Not offline-capable**, for the same reason retail is not: stock depletes in real
        time. Parts used offline are recorded on reconnect and may fail if stock has gone.
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [inventoryItemId, quantity]
                    properties:
                      inventoryItemId: { type: string, format: uuid }
                      quantity: { type: number, minimum: 0 }
                      locationId: { type: string, format: uuid }
      responses:
        '200':
          description: Recorded and stock issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDetail' }
        '409':
          description: Insufficient stock
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /work-orders/{workOrderId}/cancel:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Cancel a work order
      description: >
        Raised in error, duplicated, or superseded by a larger job.

        **Refused once work has started** — a job with recorded time and parts is completed or
        abandoned, not cancelled, and the distinction matters when the asset's history is read
        after an incident.
      tags: [work]
      x-ticvai-permission: WORK_ORDER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [raisedInError, duplicate, superseded, noLongerRequired]
                note: { type: string, maxLength: 300 }
                supersededByWorkOrderId: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '409':
          description: Work has started. Complete or abandon it instead
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /work-orders/{workOrderId}/complete:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: completeWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Complete a work order
      description: >
        Requires a resolution note and, where the category demands it, completion photographs.
        A safety-critical job closed with "fixed" and no evidence is not closed.

        Where the work order took an asset out of service, completion does **not** return it —
        that is a separate, deliberate act.
      tags: [workOrder]
      x-ticvai-permission: WORK_ORDER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, recordedAt]
              properties:
                resolution: { type: string, minLength: 3, maxLength: 5000 }
                resolutionCode: { $ref: '#/components/schemas/ResolutionCode' }
                attachmentRefs:
                  type: array
                  items: { type: string }
                followUpRequired: { type: boolean, default: false }
                followUpNote: { type: string, maxLength: 1000 }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '400':
          description: Completion photographs required for this category and none supplied
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /work-orders/{workOrderId}/verify:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
