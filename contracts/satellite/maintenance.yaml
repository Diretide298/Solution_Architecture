            schema:
              type: object
              properties:
                startedAt:
                  type: string
                  format: date-time
                  description: Device time where the job began offline. The server records both.
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{workOrderId}/pause:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pauseWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Stopped, and why
      description: >
        18.2.5. **The reason decides the state.** Waiting for a part moves to `awaitingParts`
        and is chased by ordering something; waiting for a person, a permit or an outage window
        moves to `paused` and is chased by asking someone.

        Collapsing the two is how a job waits three weeks for a part nobody ordered.
      tags: [maintenance]
      x-ticvai-permission: MAINTENANCE_EXECUTE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriteWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [awaitingParts, awaitingPermit, awaitingOutageWindow, awaitingSpecialist,
                         endOfShift, safetyConcern, other]
                note: { type: string, maxLength: 300 }
                requisitionId:
                  type: string
                  format: uuid
                  description: Where a part was ordered, so the two are linked.
      responses:
        '200':
          description: Paused, in the state the reason implies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{workOrderId}/resume:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resumeWorkOrder
