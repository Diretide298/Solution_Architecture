        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Back to work
      description: 18.2.4 again, from the other side. Returns to `inProgress` from either paused state.
      tags: [maintenance]
      x-ticvai-permission: MAINTENANCE_EXECUTE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriteWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{workOrderId}/close:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Administratively closed
      description: >
        18.2.7. **Not the same as completing or verifying it.** Completion is the technician
        saying the work is done; verification is someone else agreeing; closing is the
        supervisor deciding the record needs no further action.

        Used where a job was completed and verified, and equally where it was overtaken by
        events — the asset was replaced, the fault did not recur, the venue closed the area.
        **A work order that can only end by being completed is one that stays open forever when
        the answer is "never mind".**
      tags: [maintenance]
      x-ticvai-permission: MAINTENANCE_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
