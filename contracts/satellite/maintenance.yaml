  # ---------------------------------------------------------------- planned
  /work-orders/{workOrderId}/accept:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acceptWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: The assignee takes the job
      description: >
        18.2.2. **Distinct from being assigned.** A supervisor assigns; a technician accepts,
        and the gap between the two is where a job sits unread on a phone in a locker.

        Acceptance is what makes the assignment real — until it happens, the work order is a
        request rather than a commitment, and the queue should show it differently.
      tags: [maintenance]
      x-ticvai-permission: MAINTENANCE_EXECUTE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriteWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '409':
          description: Not assigned to this principal, or already accepted
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /work-orders/{workOrderId}/reject:
    parameters:
      - name: workOrderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectWorkOrder
      x-ticvai-consumed-by:
        - "P06 EMP-004 Task list"
        - "P06 EMP-005 Task detail"
        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: The assignee declines, with a reason
      description: >
        18.2.3. Wrong skill, wrong shift, wrong venue, or already being done by somebody else.

        **Returns the work order to `open` rather than cancelling it** — the job still needs
        doing and somebody else must pick it up. A rejection that cancelled the work would lose
        it silently.
      tags: [maintenance]
      x-ticvai-permission: MAINTENANCE_EXECUTE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriteWins
