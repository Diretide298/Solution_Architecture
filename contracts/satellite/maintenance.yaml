        - "P06 EMP-050 Post-incident restore"
        - "P08 BO-072 Incident Log"
      summary: Investigate, escalate or close an incident
      description: >
        Closure requires findings and, where a corrective action was identified, a linked
        work order. An incident closed without either is a lesson nobody learned.

        **The original report is never edited.** Investigation adds to the record.
      tags: [incident]
      x-ticvai-permission: INCIDENT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/IncidentStatus' }
                severity: { $ref: '#/components/schemas/IncidentSeverity' }
                assignedToPrincipalId: { type: string, format: uuid }
                investigationNote: { type: string, maxLength: 10000 }
                rootCause: { type: string, maxLength: 2000 }
                correctiveActions: { type: string, maxLength: 5000 }
                correctiveWorkOrderId: { type: string }
                attachmentRefs:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400':
          description: Closure attempted without findings or a corrective action
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /incidents/{incidentId}/notify-authority:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: recordAuthorityNotification
      x-ticvai-consumed-by:
        - "P06 EMP-003 Home — on duty"
        - "P06 EMP-026 Incident report"
        - "P06 EMP-027 Incident detail"
        - "P06 EMP-029 Guest assistance"
        - "P06 EMP-050 Post-incident restore"
        - "P08 BO-072 Incident Log"
      summary: Record notification to an external authority
      description: >
        Some incidents must be reported externally within a statutory window. This records
        that it happened, when, to whom, and with what reference — the evidence that the
        obligation was met.
      tags: [incident]
      x-ticvai-permission: INCIDENT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authority, notifiedAt]
              properties:
                authority: { type: string, maxLength: 200 }
                reference: { type: string, maxLength: 128 }
                notifiedAt: { type: string, format: date-time }
                notifiedByPrincipalId: { type: string, format: uuid }
                attachmentRefs:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }

components:
  schemas:
    AssetStatus:
      type: string
      enum: [inService, outOfService, underMaintenance, awaitingParts, retired, disposed]

    AssetCriticality:
      type: string
      enum: [safetyCritical, revenueCritical, standard, low]

    CreateAssetRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [assetTag, name, venueId, criticality]
      properties:
        assetTag: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        locationDescription: { type: string, maxLength: 500 }
        criticality: { $ref: '#/components/schemas/AssetCriticality' }
        manufacturer: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 200 }
        serialNumber: { type: string, maxLength: 128 }
        commissionedAt: { type: string, format: date }
        warrantyExpiresAt: { type: string, format: date }
        supplierId: { type: string, format: uuid }
        linkedProductIds:
          type: array
          description: >
            Products this asset delivers. A fault here can stop them selling.
          items: { type: string, format: uuid }
        linkedAccessPointId:
          type: string
          format: uuid
          nullable: true
          description: Access point this asset controls. Out of service blocks it.
        requiresInspectionToReturn:
          type: boolean
          default: false
          description: >
            True means a completed inspection is required before return to service. A
            technician cannot simply declare a ride safe.
        documentRefs:
          type: array
          items: { type: string }

    Asset:
      x-ticvai-persistence: "maintenance.asset"
      allOf:
        - $ref: '#/components/schemas/CreateAssetRequest'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/AssetStatus' }
            statusReason: { type: string, nullable: true }
            openWorkOrderCount: { type: integer }
            nextMaintenanceDueAt: { type: string, format: date-time, nullable: true }
            isMaintenanceOverdue: { type: boolean }
            lastInspectionAt: { type: string, format: date-time, nullable: true }
            usageCounter:
              type: number
              nullable: true
              description: Cycles, hours or kilometres. Drives usage-based maintenance.

    AssetDetail:
      x-ticvai-persistence: "maintenance.asset"
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            openWorkOrders:
              type: array
              items: { $ref: '#/components/schemas/WorkOrder' }
            maintenancePlans:
              type: array
              items: { $ref: '#/components/schemas/MaintenancePlan' }
            documents:
              type: array
              description: Manuals, procedures, certificates. What a technician needs on site.
              items:
                type: object
                properties:
                  ref: { type: string }
                  name: { type: string }
                  kind:
                    type: string
                    enum: [manual, sop, certificate, warranty, drawing, riskAssessment]

    SetAssetStatusRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [status, reason, recordedAt]
      properties:
        status: { $ref: '#/components/schemas/AssetStatus' }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        inspectionId:
          type: string
          nullable: true
          description: Required for return to service where the asset demands it.
        raiseWorkOrder: { type: boolean, default: false }
        recordedAt: { type: string, format: date-time }

    AssetStatusResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [asset, downstreamEffects]
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        downstreamEffects:
          type: object
          description: >
            What else changed. Surfaced so the person taking a ride out of service sees the
            commercial consequence at the moment they do it.
          properties:
            productsSuspended:
              type: array
              items: { type: string, format: uuid }
            accessPointBlocked: { type: boolean }
            performancesAffected: { type: integer }
            workOrderId: { type: string, nullable: true }

    AssetHistoryEntry:
      x-ticvai-persistence: "none — union view over work orders, inspections and incidents"
      type: object
      required: [kind, occurredAt, summary]
      properties:
        kind:
          type: string
          enum: [workOrder, inspection, incident, statusChange, partReplaced, planCompleted]
        referenceId: { type: string, nullable: true }
        summary: { type: string }
        principalId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }

    WorkOrderStatus:
      type: string
      enum: [open, assigned, inProgress, paused, awaitingParts, completed, verified, closed, cancelled]

    WorkOrderPriority:
      type: string
      enum: [low, normal, high, urgent, emergency]

    WorkOrderKind:
      type: string
      enum: [corrective, planned, inspectionFollowUp, incidentCorrective, improvement]

    ResolutionCode:
      type: string
      enum: [repaired, partReplaced, adjusted, cleaned, noFaultFound, referredExternal, replaced, deferred]

    CreateWorkOrderRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, title, venueId, priority, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        locationDescription: { type: string, maxLength: 500 }
        kind:
          allOf:
            - $ref: '#/components/schemas/WorkOrderKind'
          default: corrective
        priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        categoryId: { type: string, format: uuid }
        assignedToPrincipalId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        attachmentRefs:
          type: array
          description: Photo-first. Expected at creation, not added later from memory.
          items: { type: string }
        takeAssetOutOfService:
          type: boolean
          default: false
          description: >
            Raise and immediately suspend the asset. For a fault found on a live ride, the
            two are one action.
        recordedAt: { type: string, format: date-time }

    WorkOrderAttachment:
      type: object
      x-ticvai-persistence: "maintenance.work_order_attachment"
      required: [id, workOrderId, kind, capturedAt]
      properties:
        id: { type: string, format: uuid }
        workOrderId: { type: string, format: uuid }
        kind: { type: string, enum: [photo, video, document, note, signature] }
        assetRef: { type: string, format: uuid, nullable: true }
        text: { type: string, nullable: true }
        stage: { type: string, enum: [before, during, after, signOff], nullable: true }
        capturedByPrincipalId: { type: string, format: uuid }
        capturedAt:
          type: string
          format: date-time
          description: >
            Device time. **Distinct from when it synced** — a photo taken at 09:14 in a basement
            and uploaded at 11:40 is evidence of the first, not the second.
        syncedAt: { type: string, format: date-time, nullable: true }

    WorkOrder:
      x-ticvai-persistence: "maintenance.work_order"
      type: object
      required: [id, workOrderNumber, title, venueId, status, priority, kind, createdAt]
      properties:
        id: { type: string }
        workOrderNumber: { type: string }
        title: { type: string }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        assetName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        kind: { $ref: '#/components/schemas/WorkOrderKind' }
        assignedToPrincipalId: { type: string, format: uuid, nullable: true }
        raisedByPrincipalId: { type: string, format: uuid }
        elapsedMinutes: { type: integer }
        isTimerRunning: { type: boolean }
        dueAt: { type: string, format: date-time, nullable: true }
        isOverdue: { type: boolean }
        requiresVerification: { type: boolean }
        sourcePlanId: { type: string, format: uuid, nullable: true }
        sourceInspectionId: { type: string, nullable: true }
        sourceIncidentId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }

    WorkOrderDetail:
      x-ticvai-persistence: "maintenance.work_order"
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
        - type: object
          properties:
            description: { type: string, nullable: true }
            resolution: { type: string, nullable: true }
            resolutionCode: { $ref: '#/components/schemas/ResolutionCode' }
            attachmentRefs:
              type: array
              items: { type: string }
            timeEntries:
              type: array
              items:
                type: object
                properties:
                  action: { type: string }
                  principalId: { type: string, format: uuid }
                  pauseReason: { type: string, nullable: true }
                  recordedAt: { type: string, format: date-time }
            parts:
              type: array
              items:
                type: object
                properties:
                  inventoryItemId: { type: string, format: uuid }
                  itemName: { type: string }
                  quantity: { type: number }
                  cost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            labourCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            partsCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            totalCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            verifiedByPrincipalId: { type: string, format: uuid, nullable: true }

    MaintenancePlan:
      x-ticvai-persistence: "maintenance.maintenance_plan"
      type: object
      required: [id, name, assetId, taskTemplate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        assetId: { type: string, format: uuid }
        assetCategoryId:
          type: string
          format: uuid
          nullable: true
          description: Applies to every asset in the category rather than one.
        intervalDays:
          type: integer
          nullable: true
          description: Elapsed-time trigger.
        usageInterval:
          type: number
          nullable: true
          description: >
            Usage trigger — cycles, hours, kilometres. **Whichever comes first** when both are
            set. A ride serviced every three months or ten thousand cycles is one plan.
        leadTimeDays:
          type: integer
          default: 7
          description: >
            How far ahead the work order is generated, so parts can be ordered before the job
            is already late.
        taskTemplate:
          type: object
          required: [title, priority]
          properties:
            title: { type: string }
            description: { type: string }
            priority: { $ref: '#/components/schemas/WorkOrderPriority' }
            estimatedMinutes: { type: integer }
            inspectionTemplateId: { type: string, format: uuid }
            requiredPartIds:
              type: array
              items: { type: string, format: uuid }
        lastCompletedAt: { type: string, format: date-time, nullable: true }
        nextDueAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }

    DueMaintenanceTask:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [planId, assetId, assetName, dueAt, isOverdue, criticality]
      properties:
        planId: { type: string, format: uuid }
        planName: { type: string }
        assetId: { type: string, format: uuid }
        assetName: { type: string }
        criticality: { $ref: '#/components/schemas/AssetCriticality' }
        dueAt: { type: string, format: date-time }
        isOverdue: { type: boolean }
        daysOverdue: { type: integer }
        triggeredBy:
          type: string
          enum: [interval, usage]
        workOrderId: { type: string, nullable: true }

    InspectionItemKind:
      type: string
      enum: [passFail, yesNo, numeric, text, photo, signature]

    InspectionTemplate:
      x-ticvai-persistence: "maintenance.inspection_template + maintenance.inspection_template_item"
      type: object
      required: [id, code, name, items]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid, nullable: true }
        appliesToAssetCategoryId: { type: string, format: uuid, nullable: true }
        frequency:
          type: string
          enum: [preOpening, postClosing, daily, weekly, monthly, annual, adHoc]
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, label, kind, isRequired]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { $ref: '#/components/schemas/InspectionItemKind' }
              isRequired: { type: boolean }
              isSafetyCritical:
                type: boolean
                default: false
                description: >
                  A failed safety-critical item **blocks the inspection from passing** and
                  cannot be overridden by completing the rest.
              requiresPhotoOnFail: { type: boolean, default: true }
              minValue: { type: number, nullable: true }
              maxValue: { type: number, nullable: true }
              guidance: { type: string, nullable: true }
        retentionYears:
          type: integer
          default: 7
          description: Compliance inspections are retained alongside the financial trail.
        isActive: { type: boolean }

    InspectionOutcome:
      type: string
      enum: [passed, passedWithObservations, failed]

    SubmitInspectionRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, templateId, venueId, responses, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        templateId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        responses:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: {}
              passed: { type: boolean, nullable: true }
              note: { type: string, maxLength: 1000 }
              attachmentRefs:
                type: array
                items: { type: string }
        signatureRef: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }

    Inspection:
      x-ticvai-persistence: "maintenance.inspection + maintenance.inspection_response"
      type: object
      required: [id, templateId, venueId, outcome, performedByPrincipalId, performedAt]
      properties:
        id: { type: string }
        templateId: { type: string, format: uuid }
        templateName: { type: string }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        outcome: { $ref: '#/components/schemas/InspectionOutcome' }
        failedItemCount: { type: integer }
        failedSafetyCriticalCount: { type: integer }
        performedByPrincipalId:
          type: string
          format: uuid
          description: An inspection nobody signed is not an inspection.
        performedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }
        retainUntil: { type: string, format: date, nullable: true }

    InspectionResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [inspection, consequences]
      properties:
        inspection: { $ref: '#/components/schemas/Inspection' }
        consequences:
          type: object
          description: >
            What the submission triggered. A failed safety-critical item takes the asset out
            of service without waiting for anyone to decide.
          properties:
            assetTakenOutOfService: { type: boolean }
            workOrdersRaised:
              type: array
              items: { type: string }
            productsSuspended:
              type: array
              items: { type: string, format: uuid }
            escalatedToPrincipalId: { type: string, format: uuid, nullable: true }

    IncidentSeverity:
      type: string
      enum: [nearMiss, minor, moderate, major, critical]

    IncidentStatus:
      type: string
      enum: [reported, underInvestigation, actionRequired, closed]

    IncidentKind:
      type: string
      enum:
        - guestInjury
        - staffInjury
        - nearMiss
        - propertyDamage
        - equipmentFailure
        - securityIncident
        - fireOrEvacuation
        - foodSafety
        - environmental
        - other

    ReportIncidentRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, kind, severity, venueId, description, occurredAt, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        kind: { $ref: '#/components/schemas/IncidentKind' }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        locationDescription: { type: string, maxLength: 500 }
        description: { type: string, minLength: 3, maxLength: 10000 }
        involvedSubjectIds:
          type: array
          description: >
            Opaque references. Personal details live in the erasable store, so the incident
            record survives an erasure request intact.
          items: { type: string, format: uuid }
        involvedStaffPrincipalIds:
          type: array
          items: { type: string, format: uuid }
        witnessCount: { type: integer }
        firstAidGiven: { type: boolean, default: false }
        emergencyServicesCalled: { type: boolean, default: false }
        attachmentRefs:
          type: array
          items: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    Incident:
      x-ticvai-persistence: "maintenance.incident"
      type: object
      required: [id, incidentNumber, kind, severity, status, venueId, occurredAt, reportedByPrincipalId]
      properties:
        id: { type: string }
        incidentNumber: { type: string }
        kind: { $ref: '#/components/schemas/IncidentKind' }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        locationDescription: { type: string, nullable: true }
        isReportable:
          type: boolean
          description: Requires notification to an external authority within a statutory window.
        notificationDueAt: { type: string, format: date-time, nullable: true }
        notifiedAt: { type: string, format: date-time, nullable: true }
        assignedToPrincipalId: { type: string, format: uuid, nullable: true }
        reportedByPrincipalId: { type: string, format: uuid }
        correctiveWorkOrderId: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }

    IncidentDetail:
      x-ticvai-persistence: "maintenance.incident"
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          properties:
            description:
              type: string
              description: The original report. Never edited — investigation adds to the record.
            investigationNote: { type: string, nullable: true }
            rootCause: { type: string, nullable: true }
            correctiveActions: { type: string, nullable: true }
            firstAidGiven: { type: boolean }
            emergencyServicesCalled: { type: boolean }
            witnessCount: { type: integer }
            attachmentRefs:
              type: array
              items: { type: string }
            authorityNotifications:
              type: array
              items:
                type: object
                properties:
                  authority: { type: string }
                  reference: { type: string, nullable: true }
                  notifiedAt: { type: string, format: date-time }
                  notifiedByPrincipalId: { type: string, format: uuid }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
