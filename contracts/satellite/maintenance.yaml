        - "P06 EMP-006 Raise a task"
        - "P08 BO-030 Access Point Directory"
      summary: Work has begun
      description: >
        18.2.4. **Starts the clock**, which is what makes `recordWorkOrderTime` meaningful and
        what the maintenance analytics measure against.

        Offline-capable and timestamped on the device. A technician in a plant room starts a job
        with no signal, and the start time must be when they started rather than when they
        surfaced.
      tags: [maintenance]
      x-ticvai-permission: MAINTENANCE_EXECUTE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriteWins
