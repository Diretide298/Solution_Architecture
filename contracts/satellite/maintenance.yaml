              properties:
                outcome:
                  type: string
                  enum: [verified, rejected]
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Verified or returned to the technician
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '403':
