openapi: 3.1.0
info:
  title: TICVAI Inventory & Procurement
  version: 0.1.0
  x-ticvai-screen-count: 0
  x-ticvai-tier: satellite
  x-ticvai-module: "13 — Inventory Management"
  x-ticvai-requirements: 98
  x-ticvai-capabilities: [C13, C14]
  x-ticvai-platforms:
    - "P06 Staff Ops App"
    - "P08 Venue Back Office"
  description: >
    ## What this contract covers

    **Stock is a ledger, not a number. Every change is a movement with a reason.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 13 — Inventory Management |
    | **Requirements** | ~98 |
    | **Capabilities** | C13, C14 |
    | **Consumed by** | P06 Staff Ops App · P08 Venue Back Office |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Stock items, movements, counts, transfers, requisitions, purchase orders and goods
    receipt. Domain 13 — 98 requirements, plus the stock and waste surfaces that F&B recipes
    depend on.

    Positions this encodes:

    - **Stock is a ledger, not a number.** Every change is a movement with a reason, a
      principal and a timestamp. The on-hand figure is derived from movements, never edited
      directly — an adjustable quantity field is where shrinkage goes to hide.
    - **The procurement chain is fixed** (10 Aug §5.4): requisition → departmental approval →
      purchase order with quotation comparison → goods receipt → issue. Each step has an
      owner and none is skippable.
    - **Counts are blind by default.** A counter who can see the expected figure will
      reconcile to it rather than to the shelf.
    - **Costing method is set per item and immutable once movements exist.** Switching from
      weighted average to FIFO mid-life makes historic cost of goods meaningless.
    - Stock lookups are offline-capable; **movements that deplete are not**. Real-time
      depletion is why retail and recipe-linked F&B items are blocked offline.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: item
  - name: stock
  - name: movement
  - name: count
  - name: transfer
  - name: requisition
  - name: purchaseOrder
  - name: receipt
  - name: supplier

paths:
  # ---------------------------------------------------------------- items
  /inventory-items:
    get:
      operationId: listInventoryItems
      x-ticvai-read-routing: replica
      summary: List inventory items
      tags: [item]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: belowReorderPoint
          in: query
          description: The working set for a storekeeper starting a shift.
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InventoryItem' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createInventoryItem
      summary: Create an inventory item
      description: >
        `costingMethod` is fixed at creation and cannot change once movements exist. Changing
        it mid-life makes historic cost of goods incomparable and the ledger is append-only.
      tags: [item]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInventoryItemRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: SKU already in use in this venue
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /inventory-items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getInventoryItem
      x-ticvai-read-routing: replica
      summary: Read an item with stock position
      tags: [item]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateInventoryItem
      summary: Amend an item
      tags: [item]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                categoryId: { type: string, format: uuid }
                reorderPoint: { type: number, minimum: 0 }
                reorderQuantity: { type: number, minimum: 0 }
                parLevel: { type: number, minimum: 0 }
                preferredSupplierId: { type: string, format: uuid }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '409':
          description: Attempt to change costing method or base unit after movements exist
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /inventory-items/lookup:
    get:
      operationId: lookupInventoryItem
      x-ticvai-read-routing: replica
      summary: Look up by barcode or SKU
      description: >
        The scanner path. Offline-capable so a storekeeper can identify an item in a stock
        room with no signal.
      tags: [item]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: barcode
          in: query
          schema: { type: string }
        - name: sku
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '400':
          description: Neither barcode nor SKU supplied
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- stock
  /stock:
    get:
      operationId: getStockPositions
      x-ticvai-read-routing: primary
      summary: Stock on hand by item and location
      tags: [stock]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: includeZero
          in: query
          schema: { type: boolean, default: false }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockPosition' }

  /stock-locations:
    get:
      operationId: listStockLocations
      x-ticvai-read-routing: replica
      summary: List stock locations
      description: Stores, bars, kitchens, retail floors, cellars.
      tags: [stock]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockLocation' }

    post:
      operationId: createStockLocation
      summary: Create a stock location
      tags: [stock]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, venueId, kind]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 200 }
                venueId: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/LocationKind' }
                parentLocationId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLocation' }

  /stock/valuation:
    get:
      operationId: getStockValuation
      x-ticvai-read-routing: analytical
      summary: Stock value by location and category
      description: >
        Valued by each item's own costing method. Feeds the balance sheet, so it is served
        from the reporting replica.
      tags: [stock]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: asAt
          in: query
          schema: { type: string, format: date }
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Valuation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockValuation' }

  # ---------------------------------------------------------------- movements
  /stock-movements:
    get:
      operationId: listStockMovements
      x-ticvai-read-routing: replica
      summary: The movement ledger
      description: >
        Every change to stock, with reason and principal. On-hand is derived from this — it
        is not a field anyone edits.
      tags: [movement]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/MovementKind' }
        - name: recordedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: recordedTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Movements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockMovement' }

    post:
      operationId: createStockMovement
      summary: Record an issue, return or adjustment
      description: >
        Depletion is real-time and therefore **not offline-capable**. An issue recorded
        against stock that has already gone is a discrepancy discovered at count, which is
        exactly what this module exists to prevent.

        Adjustments require a reason and are surfaced separately in reporting. Frequent
        adjustments on one item is the signal shrinkage produces.
      tags: [movement]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStockMovementRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: Insufficient stock, and the item does not permit negative balances
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- counts
  /stock-counts:
    get:
      operationId: listStockCounts
      x-ticvai-read-routing: replica
      summary: List stock counts
      tags: [count]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CountStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockCount' }

    post:
      operationId: startStockCount
      summary: Start a stock count
      description: >
        **Blind by default.** The expected figure is not returned to the counting device — a
        counter who can see it will reconcile to the number rather than to the shelf.

        Full or cycle. A cycle count targets a category or location on rotation, which is how
        a large store stays accurate without closing.
      tags: [count]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStockCountRequest' }
      responses:
        '201':
          description: Started. Expected quantities are withheld when blind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '409':
          description: A count is already open for this location
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /stock-counts/{countId}/lines:
    parameters:
      - name: countId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: submitCountLines
      summary: Submit counted quantities
      description: >
        Offline-capable and batched. A storekeeper counts a cellar with no signal and
        submits on return.

        Recounting an item replaces the prior figure for that count and is recorded — a line
        counted three times is itself a finding.
      tags: [count]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [itemId, countedQuantity, recordedAt]
                    properties:
                      itemId: { type: string, format: uuid }
                      countedQuantity: { type: number, minimum: 0 }
                      unit: { type: string }
                      note: { type: string, maxLength: 200 }
                      recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  recounted: { type: integer }

  /stock-counts/{countId}/variance:
    parameters:
      - name: countId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getCountVariance
      x-ticvai-read-routing: analytical
      summary: Variance between counted and expected
      description: >
        Revealed only after counting closes. Lines beyond the configured tolerance are
        flagged for review rather than posted silently.
      tags: [count]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Variance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountVariance' }
        '409':
          description: Count is still open. Variance is not available during counting
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /stock-counts/{countId}/post:
    parameters:
      - name: countId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: postStockCount
      summary: Post a count and adjust stock
      description: >
        Generates adjustment movements for every variance and posts the value to the stock
        loss or gain account. Requires approval where variance exceeds the venue's threshold.
      tags: [count]
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '409':
          description: Unreviewed variance lines remain, or approval is required
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- transfers
  /stock-transfers:
    get:
      operationId: listStockTransfers
      x-ticvai-read-routing: replica
      summary: List transfers
      tags: [transfer]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransferStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Transfers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockTransfer' }

    post:
      operationId: createStockTransfer
      summary: Send stock to another location
      description: >
        Two-phase. Dispatch decrements the source and puts the quantity in transit; receipt
        increments the destination. Stock in transit belongs to neither location and is
        visible in valuation — a single-phase transfer loses a pallet somewhere between two
        stores.
      tags: [transfer]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStockTransferRequest' }
      responses:
        '201':
          description: Dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }
        '409':
          description: Insufficient stock at the source
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /stock-transfers/{transferId}/receive:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: receiveStockTransfer
      summary: Receive a transfer
      description: >
        Received quantities may differ from dispatched. The difference is a transit
        discrepancy, recorded against both locations rather than silently absorbed by one.
      tags: [transfer]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, receivedQuantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      receivedQuantity: { type: number, minimum: 0 }
                      discrepancyReason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfer' }

  # ---------------------------------------------------------------- requisitions
  /requisitions:
    get:
      operationId: listRequisitions
      x-ticvai-read-routing: replica
      summary: List requisitions
      tags: [requisition]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RequisitionStatus' }
        - name: raisedByPrincipalId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Requisitions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Requisition' }

    post:
      operationId: createRequisition
      summary: Raise a requisition
      description: >
        Step one of the chain. Raised by a department, approved by its head, then converted
        to a purchase order (10 Aug §5.4).
      tags: [requisition]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequisitionRequest' }
      responses:
        '201':
          description: Raised, awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }

  /requisitions/suggested:
    get:
      operationId: getSuggestedRequisitions
      x-ticvai-read-routing: replica
      summary: Draft requisitions from reorder points
      description: >
        Items below their reorder point, with suggested quantities from par level and recent
        consumption. A draft for a storekeeper to review — **never raised automatically**,
        because an automatic order against a miscounted item compounds the error.
      tags: [requisition]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/RequisitionSuggestion' }

  /requisitions/{requisitionId}/approve:
    parameters:
      - name: requisitionId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: approveRequisition
      summary: Approve or reject a requisition
      description: >
        Departmental approval. The approver may amend quantities downward but not upward —
        raising a quantity at approval bypasses the request that justified it.
      tags: [requisition]
      x-ticvai-permission: APPROVAL_ACT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected, returnedForInfo]
                note: { type: string, maxLength: 1000 }
                amendedLines:
                  type: array
                  items:
                    type: object
                    properties:
                      lineId: { type: string }
                      approvedQuantity: { type: number, minimum: 0 }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '400':
          description: An amended quantity exceeds the requested quantity
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- suppliers
  /suppliers:
    get:
      operationId: listSuppliers
      x-ticvai-read-routing: replica
      summary: List suppliers
      tags: [supplier]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Supplier' }

    post:
      operationId: createSupplier
      summary: Create a supplier
      tags: [supplier]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Supplier' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }

  /suppliers/{supplierId}/quotations:
    parameters:
      - name: supplierId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordQuotation
      summary: Record a supplier quotation
      description: >
        Quotations are compared before a purchase order is raised (10 Aug §5.4). Recording
        them is what makes the comparison auditable — a decision without the alternatives on
        record is not a comparison.
      tags: [supplier]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuotationRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quotation' }

  /requisitions/{requisitionId}/quotations:
    parameters:
      - name: requisitionId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: compareQuotations
      x-ticvai-read-routing: replica
      summary: Compare quotations for a requisition
      description: >
        Side by side across suppliers, per line, with lead time and total. The comparison a
        buyer defends afterwards.
      tags: [supplier]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Comparison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotationComparison' }

  # ---------------------------------------------------------------- purchase orders
  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      x-ticvai-read-routing: replica
      summary: List purchase orders
      tags: [purchaseOrder]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Purchase orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PurchaseOrder' }

    post:
      operationId: createPurchaseOrder
      summary: Raise a purchase order
      description: >
        Requires an approved requisition and a selected quotation. Raising one without either
        is refused — that is the control the chain exists to enforce.
      tags: [purchaseOrder]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePurchaseOrderRequest' }
      responses:
        '201':
          description: Raised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '409':
          description: Requisition is not approved, or the quotation does not match it
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /purchase-orders/{purchaseOrderId}:
    parameters:
      - name: purchaseOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getPurchaseOrder
      x-ticvai-read-routing: replica
      summary: Read a purchase order with receipt progress
      tags: [purchaseOrder]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Purchase order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /purchase-orders/{purchaseOrderId}/cancel:
    parameters:
      - name: purchaseOrderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: cancelPurchaseOrder
      summary: Cancel a purchase order
      description: Partially received orders are closed short rather than cancelled.
      tags: [purchaseOrder]
      x-ticvai-permission: ORDER_CANCEL
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Cancelled or closed short
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }

  # ---------------------------------------------------------------- receipts
  /goods-receipts:
    get:
      operationId: listGoodsReceipts
      x-ticvai-read-routing: replica
      summary: List goods receipts
      tags: [receipt]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: purchaseOrderId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Receipts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GoodsReceipt' }

    post:
      operationId: createGoodsReceipt
      summary: Receive goods against a purchase order
      description: >
        Partial receipts are normal and expected. Over-receipt beyond the configured
        tolerance is refused — a delivery larger than the order is a supplier error, not a
        windfall.

        Receipt increments stock and creates the accrual the invoice will later match
        against.
      tags: [receipt]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGoodsReceiptRequest' }
      responses:
        '201':
          description: Received; stock incremented
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '409':
          description: Over-receipt beyond tolerance, or the purchase order is closed
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /goods-receipts/{receiptId}/reject:
    parameters:
      - name: receiptId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: rejectReceivedGoods
      summary: Reject received goods
      description: >
        Quality failure, damage, wrong item, expiry too near. Reverses the stock increment
        and creates a supplier return.
      tags: [receipt]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines, reason]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number, minimum: 0 }
                reason:
                  type: string
                  enum: [damaged, wrongItem, qualityFailure, shortDated, overDelivery, other]
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Rejected; stock reversed and a return raised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }

components:
  schemas:
    CostingMethod:
      type: string
      description: Fixed at item creation. Immutable once movements exist.
      enum: [weightedAverage, fifo, standardCost, lastPurchasePrice]

    LocationKind:
      type: string
      enum: [mainStore, subStore, kitchen, bar, retailFloor, cellar, transit]

    CreateInventoryItemRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [sku, name, venueId, baseUnit, costingMethod]
      properties:
        sku: { type: string, maxLength: 64 }
        barcode: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        baseUnit:
          type: string
          description: The unit stock is held in. Immutable once movements exist.
        purchaseUnit:
          type: string
          description: How the supplier sells it — a case of 24 against a base unit of one.
        purchaseUnitFactor: { type: number, minimum: 0, default: 1 }
        costingMethod: { $ref: '#/components/schemas/CostingMethod' }
        reorderPoint: { type: number, minimum: 0 }
        reorderQuantity: { type: number, minimum: 0 }
        parLevel: { type: number, minimum: 0 }
        preferredSupplierId: { type: string, format: uuid }
        allowNegativeStock:
          type: boolean
          default: false
          description: >
            True permits issue beyond on-hand. Occasionally needed at a bar mid-service;
            dangerous everywhere else.
        isPerishable: { type: boolean, default: false }
        shelfLifeDays: { type: integer, nullable: true }

    InventoryItem:
      x-ticvai-persistence: "inventory.item"
      allOf:
        - $ref: '#/components/schemas/CreateInventoryItemRequest'
        - type: object
          required: [id, onHand, isActive]
          properties:
            id: { type: string, format: uuid }
            onHand:
              type: number
              description: Derived from movements. Not directly editable.
            onOrder: { type: number }
            inTransit: { type: number }
            available: { type: number }
            averageCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            lastPurchasePrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            isBelowReorderPoint: { type: boolean }
            hasMovements:
              type: boolean
              description: True locks costing method and base unit.
            isActive: { type: boolean }

    StockLocation:
      x-ticvai-persistence: "inventory.location"
      type: object
      required: [id, code, name, venueId, kind]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/LocationKind' }
        parentLocationId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }

    StockPosition:
      x-ticvai-persistence: "none — derived from movements"
      type: object
      required: [itemId, locationId, onHand, unit]
      properties:
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        sku: { type: string }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        onHand: { type: number }
        allocated:
          type: number
          description: Committed to a transfer or open requisition.
        available: { type: number }
        unit: { type: string }
        value: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        lastCountedAt: { type: string, format: date-time, nullable: true }
        lastMovementAt: { type: string, format: date-time, nullable: true }

    StockValuation:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [asAt, total, byLocation]
      properties:
        asAt: { type: string, format: date }
        total: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        byLocation:
          type: array
          items:
            type: object
            properties:
              locationId: { type: string, format: uuid }
              locationName: { type: string }
              value: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              itemCount: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string, format: uuid }
              categoryName: { type: string }
              value: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    MovementKind:
      type: string
      enum:
        - receipt
        - issue
        - saleDepletion      # generated by a recipe-linked sale
        - waste
        - adjustment
        - transferOut
        - transferIn
        - countAdjustment
        - supplierReturn
        - production

    CreateStockMovementRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, itemId, locationId, kind, quantity, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MovementKind' }
        quantity:
          type: number
          description: Positive increases stock, negative decreases it.
        unit: { type: string }
        reason:
          type: string
          maxLength: 500
          description: Required for adjustments, which are reported separately.
        costCenterId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }

    StockMovement:
      x-ticvai-persistence: "inventory.movement"
      allOf:
        - $ref: '#/components/schemas/CreateStockMovementRequest'
        - type: object
          required: [balanceAfter, principalId, createdAt]
          properties:
            balanceAfter: { type: number }
            unitCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            totalCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            principalId: { type: string, format: uuid }
            sourceType:
              type: string
              nullable: true
              description: What generated it — an order, a count, a transfer.
            sourceId: { type: string, nullable: true }
            journalEntryId: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }

    CountStatus:
      type: string
      enum: [open, counting, closed, variancePending, posted, cancelled]

    StartStockCountRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, locationId, kind]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        locationId: { type: string, format: uuid }
        kind:
          type: string
          enum: [full, cycle, spot]
        categoryIds:
          type: array
          items: { type: string, format: uuid }
          description: For cycle counts — restrict to these categories.
        isBlind:
          type: boolean
          default: true
          description: >
            Expected quantities withheld from the counting device. Defaults true because a
            counter who can see the figure reconciles to it rather than to the shelf.

    StockCount:
      x-ticvai-persistence: "inventory.count + inventory.count_line"
      type: object
      required: [id, locationId, kind, status, isBlind, lineCount, countedCount, startedAt]
      properties:
        id: { type: string }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        kind: { type: string }
        status: { $ref: '#/components/schemas/CountStatus' }
        isBlind: { type: boolean }
        lineCount: { type: integer }
        countedCount: { type: integer }
        varianceLineCount: { type: integer }
        varianceValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        startedByPrincipalId: { type: string, format: uuid }
        postedByPrincipalId: { type: string, format: uuid, nullable: true }
        journalEntryId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }

    CountVariance:
      x-ticvai-persistence: "none — computed at close"
      type: object
      required: [countId, totalVarianceValue, lines]
      properties:
        countId: { type: string }
        totalVarianceValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        exceptionCount:
          type: integer
          description: Lines beyond tolerance, requiring review before posting.
        lines:
          type: array
          items:
            type: object
            required: [itemId, expectedQuantity, countedQuantity, variance, isException]
            properties:
              itemId: { type: string, format: uuid }
              itemName: { type: string }
              sku: { type: string }
              expectedQuantity: { type: number }
              countedQuantity: { type: number }
              variance: { type: number }
              variancePercentage: { type: number }
              varianceValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              isException: { type: boolean }
              recountCount:
                type: integer
                description: A line counted several times is itself a finding.
              note: { type: string, nullable: true }

    TransferStatus:
      type: string
      enum: [dispatched, inTransit, received, partiallyReceived, cancelled]

    CreateStockTransferRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, fromLocationId, toLocationId, lines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        fromLocationId: { type: string, format: uuid }
        toLocationId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { type: number, minimum: 0 }
              unit: { type: string }
        note: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    StockTransfer:
      x-ticvai-persistence: "inventory.transfer + inventory.transfer_line"
      type: object
      required: [id, fromLocationId, toLocationId, status, lines, dispatchedAt]
      properties:
        id: { type: string }
        transferNumber: { type: string }
        fromLocationId: { type: string, format: uuid }
