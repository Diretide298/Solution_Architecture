        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid, nullable: true }
        pointsLiabilityAccountId:
          type: string
          format: uuid
          description: >
            Points post here on accrual. They are a liability from the moment they are
            earned, not from the moment they are spent.
        earnRules:
          type: array
          items:
            type: object
            required: [trigger, points]
            properties:
              trigger:
                type: string
                enum: [perCurrencyUnit, perVisit, perProduct, onSignup, onBirthday, onReview]
              points: { type: number }
              productKinds:
                type: array
                items: { type: string }
              multiplier: { type: number }
        tiers:
          type: array
          items:
            type: object
            required: [code, name, thresholdPoints]
            properties:
              code: { type: string }
              name: { type: string }
              thresholdPoints: { type: integer }
              benefits:
                type: array
                items: { type: string }
              earnMultiplier: { type: number }
        pointsExpireAfterMonths: { type: integer, nullable: true }
        isActive: { type: boolean }

    LoyaltyPosition:
      x-ticvai-persistence: "marketing.loyalty_position"
      type: object
      required: [subjectId, programmeId, pointsBalance, tierCode]
      properties:
        subjectId: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        pointsBalance: { type: integer }
        lifetimePoints: { type: integer }
        tierCode: { type: string }
        tierName: { type: string }
        pointsToNextTier: { type: integer, nullable: true }
        nextExpiryPoints: { type: integer, nullable: true }
        nextExpiryAt: { type: string, format: date-time, nullable: true }

    SubmitReviewRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, rating, venueId, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        subjectId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        relatedOrderId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 5000 }
        aspects:
          type: array
          description: Aspect chips — exhibitions, staff, cleanliness, food, value.
          items: { type: string }
        recordedAt: { type: string, format: date-time }

    Review:
      x-ticvai-persistence: "marketing.review"
      allOf:
        - $ref: '#/components/schemas/SubmitReviewRequest'
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [pendingModeration, published, hidden, rejected]
            response: { type: string, nullable: true }
            responseIsPublic: { type: boolean }
            respondedByPrincipalId: { type: string, format: uuid, nullable: true }
            openedCaseId:
              type: string
              nullable: true
              description: >
                Case raised automatically where the rating fell below the venue's threshold.
                Feedback that goes nowhere is worse than no feedback mechanism.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
