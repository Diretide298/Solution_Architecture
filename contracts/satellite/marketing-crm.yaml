                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MessageTemplate' }

    post:
      operationId: createMessageTemplate
      x-ticvai-consumed-by:
        - "P12 SUP-007 Canned Response Management"
      x-ticvai-audience: [staff]
      x-ticvai-config-scope: tenant
      summary: Create a message template
      description: >
        Per-language bodies with named merge fields. A template missing a version in an
        enabled language is flagged rather than silently falling back — a guest receiving
        English when they chose Arabic is a defect, not a graceful degradation.
      tags: [message]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
