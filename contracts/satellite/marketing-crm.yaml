components:
  schemas:
    MessageChannel:
      type: string
      enum: [email, sms, whatsapp, push, inApp, post]

    InvitationCampaign:
      type: object
      x-ticvai-persistence: "marketing.invitation_campaign"
      description: >
        BL-150. **An invitation is not a campaign and not a comp**, and CF-74's issuance half needed
        it too.

        A campaign broadcasts; an invitation is addressed, quota-bounded and expects a response.
        **A press night, a sponsor allocation, a members' preview** — all three need to know who was
        asked, who accepted, and how many places are left.
      required: [id, name, quota, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        eventId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid, nullable: true }
        quota:
          type: integer
          description: >
            **Places held, not invitations sent.** Over-inviting against a known acceptance rate is
            normal and deliberate; **over-issuing against the quota is not**, and the two must not be
            the same number.
        overInvitePercent:
          type: number
          default: 0
          description: >
            How many more may be invited than there are places. **A press night invites 150 for 100
            seats because 60% come**, and a system that refuses the 101st invitation makes the venue
            do that arithmetic by hand.
        issuedCount: { type: integer, readOnly: true }
        acceptedCount: { type: integer, readOnly: true }
        respondByAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [draft, open, closed, cancelled] }

    Invitation:
      type: object
      x-ticvai-persistence: "marketing.invitation"
      description: >
        **Addressed and tokenised.** A guest accepting an invitation is claiming a specific place,
        not buying one.
      required: [id, campaignId, token, status]
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        recipientEmail: { type: string, format: email, nullable: true }
        token:
          type: string
          description: >
            **Single-use and unguessable.** An invitation link forwarded to a group chat is the
            failure mode, and a token that survives its first use is one that ends up there.
        plusOnes: { type: integer, default: 0 }
        status: { type: string, enum: [issued, viewed, accepted, declined, expired, revoked] }
        entitlementIds:
          type: array
          items: { type: string, format: uuid }
        respondedAt: { type: string, format: date-time, nullable: true }

    PrivacyIncident:
      type: object
      x-ticvai-persistence: "marketing.privacy_incident"
      description: >
        BL-176. **A personal-data breach has a regulator clock**, and UAE PDPL gives 72 hours from
        discovery. Nothing in the package recorded one.

        **Modelled on the maintenance incident pattern**, because the shape is the same — discovery,
        assessment, containment, notification, closure — and **the field that matters is the one
        that starts the clock.**
      required: [id, discoveredAt, severity, status]
      properties:
        id: { type: string, format: uuid }
        discoveredAt:
          type: string
          format: date-time
          description: >
            **The clock starts here, not at occurrence.** 72 hours runs from discovery, which is why
            this is separate from `occurredAt` and why a discovery nobody recorded is a deadline
            nobody is counting.
        occurredAt: { type: string, format: date-time, nullable: true }
        severity: { type: string, enum: [low, medium, high, critical] }
        affectedSubjectCount: { type: integer, nullable: true }
        dataCategories:
          type: array
          items: { type: string, enum: [contact, identity, financial, biometric, health, location, behavioural, credentials] }
        containedAt: { type: string, format: date-time, nullable: true }
        regulatorNotifiedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **Or a recorded reason for not notifying.** Deciding a breach is not notifiable is a
            legitimate decision and an undocumented one is indistinguishable from having missed it.
        subjectsNotifiedAt: { type: string, format: date-time, nullable: true }
        notNotifiedRationale: { type: string, nullable: true }
        status: { type: string, enum: [open, assessing, contained, notified, closed] }


    FormDefinition:
      type: object
      x-ticvai-persistence: "marketing.form_definition"
      description: >
        CF-129, CL-04. **A waiver, a survey and a data-capture form are one mechanism.**

        A waiver is this form with a signature. A survey is this form with a scale. A demographic
        capture is this form at the point of sale. They were raised as three separate gaps and share
        every part: field configuration, conditional display, versioning, an acceptance record and a
        stored artefact.

        **Three implementations would drift on the version rule first.** A waiver signed against
        version 3 must stay bound to version 3, and that is the same requirement a survey has when
        question wording changes mid-campaign — **an NPS score means nothing if you cannot say which
        question produced it.**
      required: [id, name, kind, version, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [waiver, survey, dataCapture, consentForm, incidentReport, registration] }
        version:
          type: integer
          description: >
            **Immutable once anything is submitted against it.** A change creates a new version, and
            the old one stays readable forever — 2.15.13 requires the exact accepted version
            retained, which is legal evidence rather than a nicety.
        fields:
          type: array
          items: { $ref: '#/components/schemas/FormField' }
        requiresSignature:
          type: boolean
          default: false
          description: >
            **What makes it a waiver.** And 2.15.9 makes ticket issuance conditional on one, which
            puts this in the purchase path rather than beside it.
        signatureKind: { type: string, enum: [drawn, typed, checkbox, none], default: none }
        scoreScale:
          type: string
          nullable: true
          enum: [nps, csat, ces, likert5, likert7, stars]
          description: >
            **What makes it a survey.** Named rather than free-form because a score whose scale is
            unknown cannot be compared to last quarter's.
        appliesToProductIds:
          type: array
          items: { type: string, format: uuid }
        validForMonths:
          type: integer
          nullable: true
          description: >
            **How long an acceptance lasts.** A waiver signed last summer may or may not still hold,
            and 2.15.x asks for a returning participant not to sign again — which only works if the
            expiry is stated.
        minimumAge: { type: integer, nullable: true }
        requiresGuardianForMinors:
          type: boolean
          default: true
          description: >
            **A minor cannot waive their own rights.** A guardian signs, and the record has to name
            them — an unsigned or self-signed minor waiver is worth nothing at the moment it matters.
        status: { type: string, enum: [draft, published, superseded, retired] }
        legalReviewedBy: { type: string, nullable: true }
        legalReviewedAt: { type: string, format: date-time, nullable: true }

    FormField:
      type: object
      description: >
        One field. **Conditional display is the shared requirement** — a survey branching on an
        answer and a waiver revealing a medical question on a yes are the same mechanism.
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        labelLocalised:
          type: object
          additionalProperties: { type: string }
        type: { type: string, enum: [text, longText, number, date, select, multiSelect, boolean, scale, signature, file, phone, email] }
        options: { type: array, items: { type: string } }
        isRequired: { type: boolean, default: false }
        isPersonalData:
          type: boolean
          default: false
          description: >
            **Marked at the field, because retention is decided at the field.** A survey answer and a
            medical condition on the same form have different lifetimes, and a form-level flag makes
            the whole thing as sensitive as its most sensitive field.
        consentPurposeId: { type: string, format: uuid, nullable: true }
        showWhen:
          type: object
          nullable: true
          properties:
            field: { type: string }
            equals: { type: string }

    FormSubmission:
      type: object
      x-ticvai-persistence: "marketing.form_submission"
      description: >
        **The acceptance record, and it is evidence.** Bound to the exact version accepted, with who
        accepted it and when.
      required: [id, formId, formVersion, subjectId, submittedAt]
      properties:
        id: { type: string, format: uuid }
        formId: { type: string, format: uuid }
        formVersion:
          type: integer
          description: >
            **The version, not the form.** 2.15.13 requires the exact accepted version retained, and
            a submission pointing at a form that has since changed is a submission proving nothing.
        subjectId: { type: string, format: uuid }
        onBehalfOfSubjectId:
          type: string
          format: uuid
          nullable: true
          description: A guardian signing for a minor, or a group leader for an attendee.
        answers:
          type: object
          additionalProperties: true
        signatureAssetId: { type: string, format: uuid, nullable: true }
        submittedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            From `validForMonths`. **A returning participant with a live acceptance does not sign
            again**, which is the whole point of holding it against the guest.
        capturedAtChannel: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
        ipAddress: { type: string, nullable: true }

    GuestDocument:
      type: object
      x-ticvai-persistence: "marketing.guest_document"
      description: >
        BL-133. **No store for guest photos, avatars, IDs or signed documents anywhere.**

        Deliberately separate from `assets`, which holds a tenant's media library. **A guest's
        passport scan is not a marketing asset** — it has a different retention clock, a different
        access rule and a different reason to exist, and putting it in the same store means one
        careless query returns both.
      required: [id, subjectId, kind, storageRef]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        kind: { type: string, enum: [avatar, idDocument, visa, signedWaiver, medicalNote, accessibilityEvidence, photo, other] }
        storageRef: { type: string }
        contentType: { type: string }
        consentPurposeId: { type: string, format: uuid }
        retainUntil:
          type: string
          format: date
          description: >
            **Required, not optional.** A guest document with no deletion date is a guest document
            kept forever, and the retention question is the one CF-64 is open on.
        uploadedAt: { type: string, format: date-time }
        uploadedByPrincipalId: { type: string, format: uuid, nullable: true }


    Challenge:
      type: object
      x-ticvai-persistence: "marketing.challenge"
      description: >
        BL-022, CF-137. **Section 22.6 is twenty requirements and 19.2.73–75 three more** — checked
        against the matrix on 18 August rather than assumed. It is asked for explicitly.

        **Gamification is not loyalty.** Loyalty pays for spend; a challenge pays for behaviour the
        venue wants and spend does not produce — a second visit, a quiet Tuesday, a ride nobody
        rides. **A challenge that only rewards spending is a loyalty programme with worse
        arithmetic.**
      required: [id, name, kind, goal, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [visit, spend, ride, collection, streak, referral, survey, social, milestone]
        scope:
          type: string
          enum: [individual, family, group, team]
          default: individual
          description: >
            22.6.7 and 22.6.8. **A family challenge is not a per-person challenge counted twice** —
            members contribute toward one shared goal, and a school competing against another school
            is a group scoring against a group.

            **This is the field that needs the portfolio work** (CF-132): a family challenge without
            a family is an individual challenge with a label.
        goal:
          type: object
          description: What completes it.
          properties:
            metric: { type: string }
            target: { type: number }
            withinDays: { type: integer, nullable: true }
        eventId: { type: string, format: uuid, nullable: true }
        rewardKind:
          type: string
          enum: [badge, loyaltyPoints, walletCredit, voucher, entitlement, none]
          description: >
            22.6.13. **A reward that issues wallet credit is money**, and it goes through the same
            stored-value mechanism as everything else rather than a parallel one.
        rewardValue: { type: number, nullable: true }
        badgeAssetId: { type: string, format: uuid, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [draft, active, paused, ended, archived] }

    ChallengeProgress:
      type: object
      x-ticvai-persistence: "marketing.challenge_progress"
      description: >
        22.6.15. **Progress is shown, not just the outcome.** A guest two visits from a reward
        behaves differently from one who does not know how close they are, which is the entire
        mechanism.
      required: [id, challengeId, subjectId, current, target]
      properties:
        id: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        portfolioId:
          type: string
          format: uuid
          nullable: true
          description: For a family or group challenge — where the shared progress accrues.
        current: { type: number }
        target: { type: number }
        streakCount: { type: integer, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        rewardIssuedAt: { type: string, format: date-time, nullable: true }

    SeoMetadata:
      type: object
      x-ticvai-persistence: "control.seo_metadata"
      description: >
        22.11.1 to 22.11.12, CF-137. **Twelve requirements, checked against the matrix.**

        **SEO is not a marketing nicety for a venue selling online** — an attraction that does not
        appear in search sells through OTAs at OTA commission, which is the cost this avoids.
      required: [id, entityKind, entityId]
      properties:
        id: { type: string, format: uuid }
        entityKind: { type: string, enum: [contentPage, product, event, performance, membership, promotion, venue] }
        entityId: { type: string, format: uuid }
        locale: { type: string }
        title: { type: string, nullable: true }
        metaDescription: { type: string, nullable: true }
        keywords: { type: array, items: { type: string } }
        canonicalUrl: { type: string, nullable: true }
        slug:
          type: string
          nullable: true
          description: >
            22.11.6. **Human-readable, and changing one is a redirect rather than an edit** — a slug
            that changes without a 301 is a page that was ranking and now is not.
        hreflang:
          type: object
          additionalProperties: { type: string }
          description: >
            22.11.11. **Which URL serves which language**, and getting this wrong on a bilingual
            venue site splits its own ranking between two versions of the same page.
        schemaOrgType: { type: string, nullable: true }
        openGraph:
          type: object
          additionalProperties: { type: string }
        isAutoGenerated:
          type: boolean
          default: true
          description: >
            22.11.2. **Generated by default and overridable.** A venue with 400 products will not
            write 400 meta descriptions, and one with an important landing page will not accept a
            generated one.
        noIndex: { type: boolean, default: false }

    UrlRedirect:
      type: object
      x-ticvai-persistence: "control.url_redirect"
      description: >
        22.11.7. **Retired pages, expired campaigns and migrated content**, which is most of a
        website's history.

        **A redirect chain is the failure mode.** A → B → C loses ranking at every hop, so a new
        redirect whose target is itself a redirect is collapsed rather than appended.
      required: [id, fromPath, toPath, statusCode]
      properties:
        id: { type: string, format: uuid }
        fromPath: { type: string }
        toPath: { type: string }
        statusCode: { type: integer, enum: [301, 302, 307, 308] }
        reason: { type: string, enum: [contentMigrated, pageRetired, campaignExpired, restructure, slugChanged] }
        hitCount: { type: integer, readOnly: true }
        isActive: { type: boolean, default: true }


    AttributionTouch:
      type: object
      x-ticvai-persistence: "marketing.attribution_touch"
      description: >
        BL-177. **`CampaignPerformance.attributedOrders` models single-touch — one campaign, one
        order.** 22.14.17 asks for multi-touch and cross-channel.

        **The model is the touches, not the model.** Recording every touch lets first-touch,
        last-touch, linear and time-decay all be computed from one dataset — **and a platform that
        stores only its chosen attribution model cannot answer a question asked in a different
        one.**
      required: [id, subjectId, campaignId, touchedAt, channel]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        journeyId: { type: string, format: uuid, nullable: true }
        touchedAt: { type: string, format: date-time }
        channel: { type: string, enum: [email, sms, whatsapp, push, web, app, paidSearch, paidSocial, organic, referral, direct] }
        interaction: { type: string, enum: [delivered, opened, clicked, viewed, converted] }
        orderId:
          type: string
          format: uuid
          nullable: true
          description: Set on the converting touch. **Every touch before it is still recorded**, which is the whole point.

    LostItem:
      type: object
      x-ticvai-persistence: "marketing.lost_item"
      description: >
        BL-021. **Screens existed on three platforms and `lostAndFound` is a `ModuleKey`, and there
        was no item, no claim and no match between them** — which is the whole capability.

        Generic case management holds a conversation about a lost bag. **It cannot tell you that the
        bag somebody handed in on Tuesday is the one somebody asked about on Monday**, and that
        match is the only thing the module is for.
      required: [id, kind, foundOrLost, venueId, reportedAt]
      properties:
        id: { type: string, format: uuid }
        foundOrLost:
          type: string
          enum: [lost, found]
          description: >
            **One entity, two directions.** A guest reports a loss and a steward reports a find, and
            modelling them separately means matching across two tables that drift.
        kind: { type: string, enum: [bag, phone, wallet, keys, clothing, jewellery, documents, toy, buggy, other] }
        description: { type: string }
        colour: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        venueId: { type: string, format: uuid }
        lastSeenPointId:
          type: string
          format: uuid
          nullable: true
          description: >
            A point on the venue map. **Where a guest thinks they lost it is the strongest signal for
            a match**, and it is also the thing they are least sure about.
        reportedAt: { type: string, format: date-time }
        reportedBySubjectId: { type: string, format: uuid, nullable: true }
        storageLocation: { type: string, nullable: true }
        status: { type: string, enum: [open, matched, claimed, disposed, returned] }
        photoAssetIds:
          type: array
          items: { type: string, format: uuid }
        disposeAfter:
          type: string
          format: date
          nullable: true
          description: >
            **A retention date, because unclaimed property has one.** A storeroom with no disposal
            date is a storeroom that fills, and the date is a venue policy rather than a default.

    LostItemMatch:
      type: object
      description: >
        **The point of the module.** A found item and a lost report, proposed as the same thing.
      properties:
        lostItemId: { type: string, format: uuid }
        foundItemId: { type: string, format: uuid }
        score: { type: number }
        matchedOn:
          type: array
          description: What agreed — kind, colour, brand, location, date.
          items: { type: string }

    Referral:
      type: object
      x-ticvai-persistence: "marketing.referral"
      description: >
        BL-034. **No referrer, no reward, nothing anywhere.**

        **The reward fires on the referee's qualifying act, not on the sign-up**, because a referral
        that pays on registration pays for accounts rather than for guests.
      required: [id, referrerSubjectId, code, status]
      properties:
        id: { type: string, format: uuid }
        referrerSubjectId: { type: string, format: uuid }
        refereeSubjectId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        status: { type: string, enum: [issued, registered, qualified, rewarded, expired, void] }
        qualifyingAction: { type: string, enum: [firstPurchase, firstVisit, membershipPurchase] }
        referrerRewardId: { type: string, format: uuid, nullable: true }
        refereeRewardId: { type: string, format: uuid, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    CallDisposition:
      type: object
      description: >
        BL-082. **A conversation could be closed and nothing recorded why it ended** — information,
        no sale, sale successful. **That is the measure a contact centre runs on**, and its absence
        makes every conversation look identical in a report.
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [information, resolved, noSale, saleCompleted, callbackScheduled, escalated,
                 wrongNumber, abandoned, unreachable]
        callbackAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **An agent could not schedule a callback with the case attached**, so a promise to ring
            back lived in somebody's notebook.
        callbackAssignedToPrincipalId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }


    TouchPoint:
      type: object
      x-ticvai-persistence: "marketing.touch_point"
      description: >
        22.14.17, 22.14.18, BL-177. **`CampaignPerformance.attributedOrders` models single-touch —
        one campaign, one order.**

        A guest sees an email, ignores it, sees a social post, searches, and buys. **Single-touch
        credits whichever one the model happened to pick**, and a marketing team optimising on that
        optimises the wrong channel.

        **The platform records touches and does not pick a model.** Which attribution rule applies
        is a reporting question, and hard-coding one here would make every other one unanswerable.
      required: [id, subjectId, channel, occurredAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid, nullable: true }
        journeyId: { type: string, format: uuid, nullable: true }
        channel: { type: string }
        kind: { type: string, enum: [impression, open, click, visit, conversion] }
        occurredAt: { type: string, format: date-time }
        orderId:
          type: string
          format: uuid
          nullable: true
          description: Set on the conversion touch. **The chain before it is what makes attribution possible.**


    Journey:
      type: object
      x-ticvai-persistence: "marketing.journey"
      description: >
        22.3.1b to 22.3.10b, CF-137. **A journey is a sequence with branches; a `MessageTrigger` is
        one step of it.** The trigger already handles *"send this when that happens"* — a journey is
        what you need when the next message depends on what the guest did about the last one.

        Five of the ten requirements are named lifecycles — abandoned cart, membership, loyalty,
        wallet, birthday. **They are not five features.** Each is a journey with a different entry
        event and a different set of steps, which is why this is one entity and a template library
        rather than five contracts.

        **Consent is checked at every send, not at entry.** A guest who opts out mid-journey stops
        receiving, and the journey does not need to know — the same rule `MessageTrigger` follows
        and the one PDPL Article 17(1) makes unconditional.
      required: [id, name, entryEvent, status, steps]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        templateKind:
          type: string
          nullable: true
          enum: [abandonedCart, membershipLifecycle, loyaltyLifecycle, walletLifecycle, birthday, onboarding, winBack, custom]
          description: >
            Which named lifecycle this implements. **Set for reporting and for the library**, not
            for behaviour — the steps decide what happens.
        entryEvent:
          type: string
          description: >
            22.3.2b. From the event catalogue, so a journey cannot enter on something nothing
            publishes.
        entryConditions:
          type: object
          nullable: true
          description: >
            Narrows entry — a segment, a tier, a venue. **Evaluated once at entry**, unlike step
            conditions.
        steps:
          type: array
          description: >
            22.3.1b. What the builder produces. **The visual builder is a frontend over this** — the
            contract holds the graph and the canvas is a rendering of it.
          items: { $ref: '#/components/schemas/JourneyStep' }
        status: { type: string, enum: [draft, active, paused, archived] }
        maxDurationDays:
          type: integer
          default: 30
          description: >
            **A journey with no end is a guest who never leaves it.** After this, entrants exit
            wherever they are.
        reentryPolicy:
          type: string
          enum: [never, afterCompletion, always]
          default: afterCompletion
          description: >
            22.3.6b. **Abandoned cart is the case that needs this.** A guest who abandons three
            carts in an hour should not get three recovery sequences, and `never` is wrong too —
            they may genuinely abandon one next month.

    JourneyStep:
      type: object
      description: >
        One node. **A step either sends, waits, or branches** — three kinds rather than a general
        graph, because a marketing user drawing an arbitrary graph draws a loop.
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [send, wait, branch, exit, goal] }
        templateId:
          type: string
          format: uuid
          nullable: true
          description: For `send`. Channel is resolved from the guest's preference at the moment of sending.
        channelPreference:
          type: array
          nullable: true
          description: >
            22.3.3b. Ordered fallback — email, then SMS, then push. **A guest with no email address
            does not get an email step**, and the step does not fail, it moves down the list.
          items: { type: string, enum: [email, sms, whatsapp, push, inApp] }
        waitMinutes: { type: integer, nullable: true }
        waitUntil:
          type: object
          nullable: true
          description: >
            22.3.5b. **Business hours, time zone and blackout windows** — a wallet low-balance alert
            at 3am is a complaint, and the venue's quiet hours are venue configuration rather than a
            property of this step.
          properties:
            businessHoursOnly: { type: boolean, default: false }
            timezone: { type: string, nullable: true }
            respectQuietHours: { type: boolean, default: true }
            notBefore: { type: string, nullable: true }
        condition:
          type: object
          nullable: true
          description: >
            22.3.4b. IF/THEN over guest profile, behaviour and prior steps. **The most common
            condition is whether the previous message worked** — a recovery sequence must stop when
            the guest buys.
          properties:
            field: { type: string }
            operator: { type: string, enum: [eq, neq, gt, lt, contains, exists, notExists] }
            value: { type: string, nullable: true }
        onTrue: { type: string, nullable: true, description: Next step id. }
        onFalse: { type: string, nullable: true }
        next: { type: string, nullable: true }
        goalEvent:
          type: string
          nullable: true
          description: >
            For `goal`. **The event that means this journey worked and the guest should leave it** —
            a purchase for abandoned cart, a renewal for membership. **Reaching a goal exits
            immediately**, which is what stops a recovered cart from being chased.


    MessageTrigger:
      type: object
      x-ticvai-persistence: "marketing.message_trigger"
      description: >
        **What fires a message.** Before, during and after a visit are one mechanism with a
        different sign on the offset.
      required: [id, event, templateId, isActive]
      properties:
        id: { type: string, format: uuid }
        event:
          type: string
          description: >
            The platform event that fires it — `order.completed`, `access.validated`,
            `queue.turnApproaching`. **Named from the event catalogue**, so a trigger cannot bind to
            something nothing publishes.
        templateId: { type: string, format: uuid }
        offsetMinutes:
          type: integer
          default: 0
          description: >
            Negative fires before the anchor, positive after. **A reminder the day before a visit is
            -1440 against the performance**, not a separate concept.
        anchor:
          type: string
          enum: [eventTime, performanceStart, visitEnd]
          default: eventTime
        priority:
          type: string
          enum: [operational, transactional, marketing]
          default: transactional
          description: >
            **A queue-turn alert and a monthly newsletter are not the same urgency and were the same
            dispatch.** `operational` bypasses batching and quiet hours; `marketing` never does.
        isActive: { type: boolean, default: true }


    GuestIdentification:
      type: object
      description: >
        **The answer to "who is this" at a till**, resolved from any identifier. One call rather
        than three, because a cashier holding a wristband should not have to know which operation
        matches which token kind.
      required: [subjectId, matchedOn]
      properties:
        subjectId: { type: string, format: uuid }
        displayName: { type: string }
        matchedOn:
          type: string
          enum: [qr, rfid, nfc, membershipCard, walletPass, phone, email, appDeviceId, plate]
          description: >
            **Which identifier resolved.** Recorded because a guest found by phone number is a
            weaker match than one found by wristband, and the operator should see which they have.
        confidence:
          type: string
          enum: [exact, probable]
          description: >
            `probable` where the match was on a shared identifier. **A phone number is not a
            person** — households share them.
        entitlements:
          type: array
          description: Live entitlements, so a gate or a till does not make a second call.
          items:
            type: object
            properties:
              entitlementId: { type: string, format: uuid }
              productName: { type: string }
              status: { type: string }
              validTo: { type: string, format: date }
        loyalty: { $ref: '#/components/schemas/LoyaltyPosition' }
        isBarred:
          type: boolean
          description: >
            BL-134. **A subject-level bar, distinct from the media blacklist.** `access.BlacklistEntry`
            blacklists a code, and a guest barred from the venue who presents a different wristband
            walks in.


    ConversationChannel:
      type: string
      enum: [webChat, inAppChat, whatsapp, sms, email, kiosk, voice]

    ConversationState:
      type: string
      description: >
        **`withAssistant` and `queued` are different, and the second has a person waiting.** Merging
        them makes the service level unmeasurable, because time with a bot is not time in a queue.
      enum: [withAssistant, queued, withAgent, waitingOnGuest, resolved, abandoned, timedOut]

    ConversationMessage:
      type: object
      x-ticvai-persistence: "marketing.conversation_message"
      required: [id, sender, body, sentAt]
      properties:
        id: { type: string, format: uuid }
        sender:
          type: string
          enum: [guest, agent, assistant, system]
          description: >
            **Resolved, never declared.** The assistant is labelled as one — a guest talking to a
            bot that presents as a person is a complaint waiting for the moment they find out.
        senderPrincipalId: { type: string, format: uuid, nullable: true }
        body: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              assetId: { type: string, format: uuid }
              kind: { type: string, enum: [image, video, document, ticket, qr, paymentLink] }
        aiInteractionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the assistant sent it. **Links the message to its tokens and cost**, so a
            conversation's spend is attributable (CF-14).
        sentAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }

    Conversation:
      type: object
      x-ticvai-persistence: "marketing.conversation"
      description: >
        22.8. **A conversation is not a case.** A case is a ticket measured in hours; a conversation
        is a live session measured in seconds, with somebody waiting. A conversation may create a
        case; it is not one.
      required: [id, channel, state]
      properties:
        id: { type: string, format: uuid }
        telephony:
          type: object
          nullable: true
          description: >
            BL-083. **`ConversationChannel` included `voice` with nothing behind it** — the model
            anticipated telephony and stopped at the enum.

            **Not an integration, a binding.** Genesys, Avaya, Amazon Connect, Teams and 3CX all do
            call control themselves; what the platform needs is the call bound to the guest and the
            case, so **an agent who answers already knows who is calling and what about.**
          properties:
            providerCallId: { type: string }
            direction: { type: string, enum: [inbound, outbound, transferred] }
            fromNumberMasked:
              type: string
              nullable: true
              description: >
                **Masked, and it is still personal data.** A phone number identifies a person more
                reliably than a name does.
            recordingRef:
              type: string
              nullable: true
              description: >
                Held by the provider, referenced here. **Recording consent is jurisdictional and
                the platform does not assume it** — a reference with no consent record is a
                recording nobody may play.
            agentState: { type: string, enum: [available, onCall, wrapUp, away, offline], nullable: true }
        assistSessionId:
          type: string
          format: uuid
          nullable: true
          description: >
            BL-094. **`startKioskAssist` recorded a staff member helping a guest and `createCase`
            recorded a service interaction, and neither referenced the other** — so the
            traceability 2.13.20 asks for had no link to follow.

            **The link is here rather than on the assist session**, because a case may span several
            assists and an assist belongs to at most one case.
        channel: { $ref: '#/components/schemas/ConversationChannel' }
        state: { $ref: '#/components/schemas/ConversationState' }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            22.8.3. Resolved from phone, email, membership number or a signed-in session.
            **A conversation with none of those stays anonymous rather than being guessed at.**
        venueId: { type: string, format: uuid, nullable: true }
        assignedPrincipalId: { type: string, format: uuid, nullable: true }
        queueId: { type: string, format: uuid, nullable: true }
        queuePosition: { type: integer, nullable: true, readOnly: true }
        estimatedWaitSeconds: { type: integer, nullable: true, readOnly: true }
        handoverReason:
          type: string
          nullable: true
          enum: [guestRequested, assistantRefused, assistantFailed, outOfScope, negativeSentiment, complexIntent, paymentIssue]
        handoverSummary:
          type: string
          nullable: true
          description: >
            **The assistant's own account of what the guest wants**, so an agent opens with context
            rather than reading a transcript while somebody waits.
        sentiment:
          type: string
          nullable: true
          enum: [positive, neutral, negative, escalating]
          description: 22.8.16. **`escalating` is a routing signal**, not a report line.
        intent:
          type: string
          nullable: true
          description: 22.8.13. What the guest appears to want, used for routing.
        locale: { type: string }
        caseId:
          type: string
          format: uuid
          nullable: true
          description: 22.8.12. Where the conversation raised one.
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
        firstResponseSeconds: { type: integer, nullable: true, readOnly: true }
        startedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        outcome:
          type: string
          nullable: true
          enum: [resolved, caseRaised, abandonedByGuest, timedOut, spam]

    KioskAssistSession:
      type: object
      x-ticvai-persistence: "marketing.kiosk_assist_session"
      description: >
        2.1.25. A staff member acting on a kiosk session remotely. **The guest can always see it and
        always end it** — remote assistance a guest cannot see or stop is surveillance.
      required: [id, deviceId, staffPrincipalId, startedAt]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        staffPrincipalId: { type: string, format: uuid }
        staffDisplayName:
          type: string
          description: >
            **Shown on the kiosk.** A guest being helped should know by whom.
        cartId: { type: string, format: uuid, nullable: true }
        reason: { type: string, enum: [guestCalled, healthAlert, stuckSession, paymentIssue, proactive] }
        endedBy: { type: string, nullable: true, enum: [staff, guest, timeout] }
        actionsTaken:
          type: array
          description: >
            **Every action recorded as the staff member's**, not the kiosk's. A cashier completing a
            guest's checkout remotely is a staff action on a guest cart.
          items:
            type: object
            properties:
              operationId: { type: string }
              at: { type: string, format: date-time }
