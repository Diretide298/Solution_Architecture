          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }

  # ---------------------------------------------------------------- loyalty
  /loyalty/programmes:
    get:
      operationId: listLoyaltyProgrammes
      x-ticvai-consumed-by:
        - "P02 GST-036 Loyalty & Rewards"
        - "P02 GST-064 Loyalty & Rewards"
      x-ticvai-audience: [staff, guest]
      x-ticvai-read-routing: replica
      summary: List loyalty programmes
      tags: [loyalty]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoyaltyProgramme' }

    post:
      operationId: createLoyaltyProgramme
      x-ticvai-audience: [staff]
      x-ticvai-config-scope: tenant
      summary: Create a loyalty programme
      description: >
        Earn rules, tiers and redemption options. **Points are a liability** and post to the
        ledger on accrual, not on redemption — the obligation exists the moment they are
        earned.
      tags: [loyalty]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyProgramme' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyProgramme' }

  /guests/{subjectId}/loyalty:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGuestLoyalty
      x-ticvai-consumed-by:
        - "P06 EMP-043 Device settings"
        - "P08 BO-036 Device Registry"
        - "P13 CMS-018 Consent & Legal"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: A guest's loyalty position
      tags: [loyalty]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyPosition' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /guests/{subjectId}/loyalty/adjust:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: adjustLoyaltyPoints
      x-ticvai-consumed-by:
        - "P06 EMP-043 Device settings"
        - "P08 BO-036 Device Registry"
        - "P13 CMS-018 Consent & Legal"
      x-ticvai-audience: [staff]
      summary: Manually adjust points
      description: >
        Goodwill, correction, or reversal. Requires a reason and is reported separately —
        manual point adjustments are the loyalty equivalent of a wallet adjustment and get
        the same scrutiny.
      tags: [loyalty]
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, reason]
              properties:
                points: { type: integer }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyPosition' }

  # ---------------------------------------------------------------- feedback
  /reviews:
    get:
      operationId: listReviews
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List guest reviews and ratings
      tags: [feedback]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: minRating
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: hasResponse
          in: query
          schema: { type: boolean }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }

    post:
      operationId: submitReview
      x-ticvai-consumed-by:
        - "P01 WEB-026 Survey & Feedback"
        - "P02 GST-035 Feedback & Ratings"
      x-ticvai-audience: [guest]
      security:
        - guestAuth: []
      x-ticvai-self-scoped: subject
      summary: Submit a review
      description: >
        Guest-facing. A low rating may open a service case automatically where the venue
        configures it — feedback that goes nowhere is worse than no feedback mechanism.
      tags: [feedback]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitReviewRequest' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }

  /reviews/{reviewId}/respond:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: respondToReview
      x-ticvai-audience: [staff]
      summary: Respond to a review
      tags: [feedback]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, isPublic]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
                isPublic: { type: boolean }
      responses:
        '200':
          description: Responded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }

components:
  schemas:
    MessageChannel:
      type: string
      enum: [email, sms, whatsapp, push, inApp, post]

    ConversationChannel:
      type: string
      enum: [webChat, inAppChat, whatsapp, sms, email, kiosk, voice]

    ConversationState:
      type: string
      description: >
        **`withAssistant` and `queued` are different, and the second has a person waiting.** Merging
        them makes the service level unmeasurable, because time with a bot is not time in a queue.
      enum: [withAssistant, queued, withAgent, waitingOnGuest, resolved, abandoned, timedOut]

    ConversationMessage:
      type: object
      x-ticvai-persistence: "marketing.conversation_message"
      required: [id, sender, body, sentAt]
      properties:
        id: { type: string, format: uuid }
        sender:
          type: string
          enum: [guest, agent, assistant, system]
          description: >
            **Resolved, never declared.** The assistant is labelled as one — a guest talking to a
            bot that presents as a person is a complaint waiting for the moment they find out.
        senderPrincipalId: { type: string, format: uuid, nullable: true }
        body: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              assetId: { type: string, format: uuid }
              kind: { type: string, enum: [image, video, document, ticket, qr, paymentLink] }
        aiInteractionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the assistant sent it. **Links the message to its tokens and cost**, so a
            conversation's spend is attributable (CF-14).
        sentAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }

    Conversation:
      type: object
      x-ticvai-persistence: "marketing.conversation"
      description: >
        22.8. **A conversation is not a case.** A case is a ticket measured in hours; a conversation
        is a live session measured in seconds, with somebody waiting. A conversation may create a
        case; it is not one.
      required: [id, channel, state]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/ConversationChannel' }
        state: { $ref: '#/components/schemas/ConversationState' }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            22.8.3. Resolved from phone, email, membership number or a signed-in session.
            **A conversation with none of those stays anonymous rather than being guessed at.**
        venueId: { type: string, format: uuid, nullable: true }
        assignedPrincipalId: { type: string, format: uuid, nullable: true }
        queueId: { type: string, format: uuid, nullable: true }
        queuePosition: { type: integer, nullable: true, readOnly: true }
        estimatedWaitSeconds: { type: integer, nullable: true, readOnly: true }
        handoverReason:
          type: string
          nullable: true
          enum: [guestRequested, assistantRefused, assistantFailed, outOfScope, negativeSentiment, complexIntent, paymentIssue]
        handoverSummary:
          type: string
          nullable: true
          description: >
            **The assistant's own account of what the guest wants**, so an agent opens with context
            rather than reading a transcript while somebody waits.
        sentiment:
          type: string
          nullable: true
          enum: [positive, neutral, negative, escalating]
          description: 22.8.16. **`escalating` is a routing signal**, not a report line.
        intent:
          type: string
          nullable: true
          description: 22.8.13. What the guest appears to want, used for routing.
        locale: { type: string }
        caseId:
          type: string
          format: uuid
          nullable: true
          description: 22.8.12. Where the conversation raised one.
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConversationMessage' }
        firstResponseSeconds: { type: integer, nullable: true, readOnly: true }
        startedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        outcome:
          type: string
          nullable: true
          enum: [resolved, caseRaised, abandonedByGuest, timedOut, spam]

    KioskAssistSession:
      type: object
      x-ticvai-persistence: "marketing.kiosk_assist_session"
      description: >
        2.1.25. A staff member acting on a kiosk session remotely. **The guest can always see it and
        always end it** — remote assistance a guest cannot see or stop is surveillance.
      required: [id, deviceId, staffPrincipalId, startedAt]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        staffPrincipalId: { type: string, format: uuid }
        staffDisplayName:
          type: string
          description: >
            **Shown on the kiosk.** A guest being helped should know by whom.
        cartId: { type: string, format: uuid, nullable: true }
        reason: { type: string, enum: [guestCalled, healthAlert, stuckSession, paymentIssue, proactive] }
        endedBy: { type: string, nullable: true, enum: [staff, guest, timeout] }
        actionsTaken:
          type: array
          description: >
            **Every action recorded as the staff member's**, not the kiosk's. A cashier completing a
            guest's checkout remotely is a staff action on a guest cart.
          items:
            type: object
            properties:
              operationId: { type: string }
              at: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }

    ConsentPurpose:
      type: string
      enum:
        - marketing
        - personalisation
        - profiling
        - thirdPartySharing
        - aiProcessing
        - transactional

    ConsentDecision:
      type: string
      enum: [granted, withdrawn, notAsked]

    ConsentSource:
      type: string
      enum: [guestApp, website, kiosk, pos, callCentre, import, agentRecorded]

    GuestProfile:
      x-ticvai-persistence: "marketing.guest_profile"
      type: object
      required: [subjectId, isActive]
      properties:
        subjectId:
          type: string
          format: uuid
          description: >
            Opaque reference. Personal data lives in the separately erasable store, which is
            what makes erasure possible against an append-only ledger.
        displayName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        preferredLanguage: { type: string, nullable: true }
        preferredChannel: { $ref: '#/components/schemas/MessageChannel' }
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells. Marketing acts locally.
        tags:
          type: array
          items: { type: string }
        lifetimeValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        visitCount: { type: integer }
        lastVisitAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }

    GuestProfileDetail:
      x-ticvai-persistence: "marketing.guest_profile"
      allOf:
        - $ref: '#/components/schemas/GuestProfile'
        - type: object
          properties:
            consents: { $ref: '#/components/schemas/ConsentState' }
            loyalty: { $ref: '#/components/schemas/LoyaltyPosition' }
            openCaseCount: { type: integer }
            recentOrderIds:
              type: array
              items: { type: string }
            membershipIds:
              type: array
              items: { type: string, format: uuid }
            notes: { type: string, nullable: true }

    MergeResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [survivingSubjectId, absorbedSubjectId, transferred]
      properties:
        survivingSubjectId: { type: string, format: uuid }
        absorbedSubjectId: { type: string, format: uuid }
        transferred:
          type: object
          properties:
            orders: { type: integer }
            cases: { type: integer }
            loyaltyPoints: { type: integer }
        consentOutcome:
          type: array
          description: >
            Per purpose, the resulting position. Where the two profiles disagreed, the more
            restrictive position won.
          items:
            type: object
            properties:
              purpose: { $ref: '#/components/schemas/ConsentPurpose' }
              result: { $ref: '#/components/schemas/ConsentDecision' }
              wasRestricted: { type: boolean }

    Wishlist:
      type: object
      required: [subjectId, items]
      x-ticvai-persistence: "none — wrapper. The items are the table, keyed by subject"
      properties:
        subjectId: { type: string, format: uuid }
        items:
          type: array
          x-ticvai-persistence: "marketing.wishlist_item"
          items:
            type: object
            required: [id, variantId, addedAt, isAvailable]
            properties:
              id: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              productName: { type: string }
              performanceId: { type: string, format: uuid, nullable: true }
              performanceStartsAt: { type: string, format: date-time, nullable: true }
              price: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              imageAssetRef: { type: string, nullable: true }
              isAvailable:
                type: boolean
                description: >
                  False where the product has been withdrawn or the performance has passed.
                  Returned rather than dropped — a guest who saved something and finds it
                  silently gone assumes the feature is broken.
              unavailableReason: { type: string, nullable: true }
              note: { type: string, nullable: true }
              addedAt: { type: string, format: date-time }

    GuestDevice:
      type: object
      x-ticvai-persistence: "marketing.guest_device"
      required: [id, subjectId, platform, status, registeredAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        platform:
          type: string
          enum: [ios, android, web]
        tokenFingerprint:
          type: string
          description: >
            Hash of the token, not the token. The token itself is write-only — returning it
            would put a push credential in every response a support agent can read.
        appVersion: { type: string, nullable: true }
        osVersion: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        locale: { type: string, nullable: true }
        status:
          type: string
          enum: [active, revoked, failed]
        failureCount:
          type: integer
          description: >
            Consecutive delivery failures. Past the threshold the device is marked failed and
            stops being targeted — a dead token retried forever is wasted quota and a
            misleading delivery rate.
        registeredAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }

    ConsentPurposeConfig:
      x-ticvai-persistence: "marketing.consent_purpose"
      type: object
      required: [purpose, channels, noticeVersion, isRequiredForService]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        displayName: { type: string }
        description: { type: string }
        channels:
          type: array
          items: { $ref: '#/components/schemas/MessageChannel' }
        noticeVersion:
          type: string
          description: >
            Current version of the notice. A consent against a superseded version is reported
            as requiring renewal rather than silently honoured.
        isRequiredForService:
          type: boolean
          description: >
            True for transactional. Withdrawing it means the service cannot be delivered, so
            it is presented differently.
        expiresAfterMonths: { type: integer, nullable: true }

    RecordConsentRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [purpose, decision, noticeVersion, source, recordedAt]
      properties:
        purpose: { $ref: '#/components/schemas/ConsentPurpose' }
        decision: { $ref: '#/components/schemas/ConsentDecision' }
        channels:
          type: array
          description: Omit to apply to every channel the purpose covers.
          items: { $ref: '#/components/schemas/MessageChannel' }
        noticeVersion: { type: string }
        source: { $ref: '#/components/schemas/ConsentSource' }
        recordedAt: { type: string, format: date-time }

    ConsentRecord:
      x-ticvai-persistence: "marketing.consent_record"
      allOf:
        - $ref: '#/components/schemas/RecordConsentRequest'
        - type: object
          required: [id, subjectId]
          properties:
            id: { type: string }
            subjectId: { type: string, format: uuid }
            recordedByPrincipalId: { type: string, format: uuid, nullable: true }
            supersededAt: { type: string, format: date-time, nullable: true }

    ConsentState:
      x-ticvai-persistence: "none — projection over consent_record"
      type: object
      required: [subjectId, purposes]
      properties:
        subjectId: { type: string, format: uuid }
        purposes:
          type: array
          items:
            type: object
            required: [purpose, decision, requiresRenewal]
            properties:
              purpose: { $ref: '#/components/schemas/ConsentPurpose' }
              decision: { $ref: '#/components/schemas/ConsentDecision' }
              channels:
                type: array
                items: { $ref: '#/components/schemas/MessageChannel' }
              noticeVersion: { type: string, nullable: true }
              requiresRenewal:
                type: boolean
                description: True where the notice has been superseded since consent was given.
              decidedAt: { type: string, format: date-time, nullable: true }

    Suppression:
      x-ticvai-persistence: "marketing.suppression"
      type: object
      required: [channel, address, reason, suppressedAt]
      properties:
        channel: { $ref: '#/components/schemas/MessageChannel' }
        address: { type: string }
        reason: { type: string }
        suppressedAt: { type: string, format: date-time }
        suppressedByPrincipalId: { type: string, format: uuid, nullable: true }

    SegmentCriterion:
      x-ticvai-persistence: "marketing.segment_criterion"
      type: object
      required: [attribute, operator]
      properties:
        attribute:
          type: string
          description: >
            Behavioural or profile attribute — visit count, last visit, lifetime value,
            product purchased, membership tier, venue visited, language.
        operator:
          type: string
          enum: [equals, notEquals, greaterThan, lessThan, between, in, notIn, exists, notExists, withinDays]
        value: {}
        values:
          type: array
          items: {}

    CreateSegmentRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [name, criteria]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        venueId: { type: string, format: uuid }
        match:
          type: string
          enum: [all, any]
          default: all
        criteria:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SegmentCriterion' }
        excludeSegmentIds:
          type: array
          items: { type: string, format: uuid }

    Segment:
      x-ticvai-persistence: "marketing.segment + marketing.segment_criterion"
      allOf:
        - $ref: '#/components/schemas/CreateSegmentRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            lastEvaluatedSize: { type: integer, nullable: true }
            lastEvaluatedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }

    SegmentPreview:
      x-ticvai-persistence: "none — evaluated live"
      type: object
      required: [segmentId, matchingCount, reachable]
      properties:
        segmentId: { type: string, format: uuid }
        matchingCount: { type: integer }
        reachable:
          type: array
          description: >
            Per channel, after consent and suppression. A segment of 50,000 with 3,000 email
            consents is a 3,000-person campaign.
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/MessageChannel' }
              reachableCount: { type: integer }
              excludedNoConsent: { type: integer }
              excludedSuppressed: { type: integer }
              excludedNoAddress: { type: integer }
        evaluatedAt: { type: string, format: date-time }

    CampaignStatus:
      type: string
      enum: [draft, scheduled, sending, paused, completed, stopped, failed]

    CampaignKind:
      type: string
      enum: [oneOff, scheduled, triggered, recurring]

    CampaignTrigger:
      x-ticvai-persistence: "none — embedded in campaign"
      type: object
      properties:
        event:
          type: string
          enum: [bookingConfirmed, visitCompleted, membershipExpiring, birthday, abandonedCart, firstVisit, inactivity]
        delayHours: { type: integer }
        conditions:
          type: array
          items: { $ref: '#/components/schemas/SegmentCriterion' }

    CampaignContent:
      x-ticvai-persistence: "none — embedded in campaign"
      type: object
      required: [templateId]
      properties:
        templateId: { type: string, format: uuid }
        subjectOverride: { type: object, additionalProperties: { type: string } }
        mergeDefaults:
          type: object
          additionalProperties: true
        promotionId:
          type: string
          format: uuid
          nullable: true
          description: Offer carried by the campaign. Coupon codes are issued from it.

    CreateCampaignRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [name, kind, channel, segmentId, content]
      properties:
        name: { type: string, maxLength: 200 }
        kind: { $ref: '#/components/schemas/CampaignKind' }
        channel: { $ref: '#/components/schemas/MessageChannel' }
        venueId: { type: string, format: uuid }
        segmentId: { type: string, format: uuid }
        content: { $ref: '#/components/schemas/CampaignContent' }
        trigger: { $ref: '#/components/schemas/CampaignTrigger' }
        scheduledFor: { type: string, format: date-time }
        consentPurpose:
          allOf:
            - $ref: '#/components/schemas/ConsentPurpose'
          default: marketing
        sendWindow:
          type: object
          description: >
            Hours during which sending is permitted. A promotional message at 3am is a
            complaint waiting to happen.
          properties:
            startTime: { type: string }
            endTime: { type: string }
            timeZone: { type: string }

    Campaign:
      x-ticvai-persistence: "marketing.campaign"
      allOf:
        - $ref: '#/components/schemas/CreateCampaignRequest'
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/CampaignStatus' }
            isPaused: { type: boolean }
            createdByPrincipalId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            launchedAt: { type: string, format: date-time, nullable: true }
            completedAt: { type: string, format: date-time, nullable: true }

    CampaignDetail:
      x-ticvai-persistence: "marketing.campaign"
      allOf:
        - $ref: '#/components/schemas/Campaign'
        - type: object
          properties:
            performance: { $ref: '#/components/schemas/CampaignPerformance' }

    LaunchResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [campaignId, audienceSize, queuedCount, excluded]
      properties:
        campaignId: { type: string, format: uuid }
        audienceSize: { type: integer }
        queuedCount: { type: integer }
        excluded:
          type: array
          description: Why each excluded guest was excluded, in aggregate.
          items:
            type: object
            properties:
              reason:
                type: string
                enum: [noConsent, consentRequiresRenewal, suppressed, noAddress, frequencyCap, outsideSendWindow]
              count: { type: integer }
        scheduledFor: { type: string, format: date-time, nullable: true }

    CampaignPerformance:
      x-ticvai-persistence: "none — aggregated from dispatch"
      type: object
      required: [campaignId, sent, delivered]
      properties:
        campaignId: { type: string, format: uuid }
        sent: { type: integer }
        delivered: { type: integer }
        opened: { type: integer }
        clicked: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        unsubscribed: { type: integer }
        attributedOrders: { type: integer }
        attributedRevenue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        attributionWindowDays: { type: integer }

    MessageTemplate:
      x-ticvai-persistence: "marketing.message_template"
      type: object
      required: [id, code, name, channel, bodies]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        channel: { $ref: '#/components/schemas/MessageChannel' }
        subjects:
          type: object
          description: Per language. Email only.
          additionalProperties: { type: string }
        bodies:
          type: object
          description: Per language, keyed by ISO 639-1 code.
          additionalProperties: { type: string }
        mergeFields:
          type: array
          items: { type: string }
        missingLanguages:
          type: array
          readOnly: true
          description: >
            Enabled languages without a body. Flagged rather than silently falling back — a
            guest receiving English when they chose Arabic is a defect.
          items: { type: string }
        providerTemplateId:
          type: string
          nullable: true
          description: Required for WhatsApp, where templates are pre-approved by the provider.

    MessageDispatch:
      x-ticvai-persistence: "marketing.message_dispatch"
      type: object
      required: [id, subjectId, channel, status, queuedAt]
      properties:
        id: { type: string }
        subjectId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid, nullable: true }
        channel: { $ref: '#/components/schemas/MessageChannel' }
        templateId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, sent, delivered, opened, clicked, bounced, failed, suppressed]
        failureReason: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        queuedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }

    CaseStatus:
      type: string
      enum: [open, inProgress, awaitingGuest, escalated, resolved, closed]

    CasePriority:
      type: string
      enum: [low, normal, high, urgent]

    CreateCaseRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, subject, description, channel, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        subjectId: { type: string, format: uuid }
        subject: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        categoryId: { type: string, format: uuid }
        priority:
          allOf:
            - $ref: '#/components/schemas/CasePriority'
          default: normal
        channel: { $ref: '#/components/schemas/MessageChannel' }
        venueId: { type: string, format: uuid }
        relatedOrderId: { type: string }
        attachmentRefs:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }

    Case:
      x-ticvai-persistence: "marketing.case"
      type: object
      required: [id, caseNumber, subject, status, priority, createdAt]
      properties:
        id: { type: string }
        caseNumber: { type: string }
        subjectId: { type: string, format: uuid, nullable: true }
        guestName: { type: string, nullable: true }
        subject: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/CaseStatus' }
        priority: { $ref: '#/components/schemas/CasePriority' }
        assignedToPrincipalId: { type: string, format: uuid, nullable: true }
        venueId: { type: string, format: uuid, nullable: true }
        relatedOrderId: { type: string, nullable: true }
        slaDueAt: { type: string, format: date-time, nullable: true }
        isSlaBreached: { type: boolean }
        slaPausedSeconds:
          type: integer
          description: >
            Accrued only while awaiting the guest. Waiting on an internal team does not pause
            the clock.
        escalationCount: { type: integer }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    CaseDetail:
      x-ticvai-persistence: "marketing.case"
      allOf:
        - $ref: '#/components/schemas/Case'
        - type: object
          properties:
            description: { type: string }
            resolutionNote: { type: string, nullable: true }
            messages:
              type: array
              items: { $ref: '#/components/schemas/CaseMessage' }

    CaseMessage:
      x-ticvai-persistence: "marketing.case_message"
      type: object
      required: [id, body, isInternal, authorKind, recordedAt]
      properties:
        id: { type: string }
        body: { type: string }
        isInternal: { type: boolean }
        authorKind:
          type: string
          enum: [agent, guest, system, ai]
        authorPrincipalId: { type: string, format: uuid, nullable: true }
        channel: { $ref: '#/components/schemas/MessageChannel' }
        attachmentRefs:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }

    LoyaltyProgramme:
      x-ticvai-persistence: "marketing.loyalty_programme + marketing.loyalty_tier"
      type: object
      required: [id, code, name, earnRules, tiers]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid, nullable: true }
        pointsLiabilityAccountId:
          type: string
          format: uuid
          description: >
            Points post here on accrual. They are a liability from the moment they are
            earned, not from the moment they are spent.
        earnRules:
          type: array
          items:
            type: object
            required: [trigger, points]
            properties:
              trigger:
                type: string
                enum: [perCurrencyUnit, perVisit, perProduct, onSignup, onBirthday, onReview]
              points: { type: number }
              productKinds:
                type: array
                items: { type: string }
              multiplier: { type: number }
        tiers:
          type: array
          items:
            type: object
            required: [code, name, thresholdPoints]
            properties:
              code: { type: string }
              name: { type: string }
              thresholdPoints: { type: integer }
              benefits:
                type: array
                items: { type: string }
              earnMultiplier: { type: number }
        pointsExpireAfterMonths: { type: integer, nullable: true }
        isActive: { type: boolean }

    LoyaltyPosition:
      x-ticvai-persistence: "marketing.loyalty_position"
      type: object
      required: [subjectId, programmeId, pointsBalance, tierCode]
      properties:
        subjectId: { type: string, format: uuid }
        programmeId: { type: string, format: uuid }
        pointsBalance: { type: integer }
        lifetimePoints: { type: integer }
        tierCode: { type: string }
        tierName: { type: string }
        pointsToNextTier: { type: integer, nullable: true }
        nextExpiryPoints: { type: integer, nullable: true }
        nextExpiryAt: { type: string, format: date-time, nullable: true }

    SubmitReviewRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, rating, venueId, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        subjectId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        relatedOrderId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 5000 }
        aspects:
          type: array
          description: Aspect chips — exhibitions, staff, cleanliness, food, value.
          items: { type: string }
        recordedAt: { type: string, format: date-time }

    Review:
      x-ticvai-persistence: "marketing.review"
      allOf:
        - $ref: '#/components/schemas/SubmitReviewRequest'
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [pendingModeration, published, hidden, rejected]
            response: { type: string, nullable: true }
            responseIsPublic: { type: boolean }
            respondedByPrincipalId: { type: string, format: uuid, nullable: true }
            openedCaseId:
              type: string
              nullable: true
              description: >
                Case raised automatically where the rating fell below the venue's threshold.
                Feedback that goes nowhere is worse than no feedback mechanism.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
