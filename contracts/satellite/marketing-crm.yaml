        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [ios, android, web]
                token: { type: string, maxLength: 512 }
                appVersion: { type: string }
                osVersion: { type: string }
                deviceModel: { type: string }
                locale: { type: string }
      responses:
        '200':
          description: Registered, or an existing registration refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestDevice' }

  /guests/{subjectId}/devices/{deviceId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeGuestDevice
      x-ticvai-consumed-by:
        - "P01 WEB-011 Guest Details & Attendee Forms"
        - "P01 WEB-017 My Account Dashboard"
        - "P01 WEB-024 Loyalty & Rewards"
        - "P01 WEB-027 Newsletter Subscription"
      x-ticvai-audience: [guest]
      summary: Revoke a device registration
      description: >
        Sign-out, uninstall, or a guest removing a device they no longer have. Revoked rather
        than deleted — a token that starts failing needs a record explaining why, or the same
        dead token gets retried indefinitely.
      tags: [guest]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      security:
        - guestAuth: []
      responses:
        '204': { description: Revoked }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- segments
  /segments:
    get:
      operationId: listSegments
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List segments
      tags: [segment]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Segments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Segment' }

    post:
      operationId: createSegment
      x-ticvai-audience: [staff]
      summary: Create a segment
      description: >
        **A definition, not a list.** Evaluated when used, so it cannot go stale. A
        materialised audience list is out of date the moment a guest transacts, which is how
        people receive offers for things they have already bought.
      tags: [segment]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSegmentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Segment' }
        '400':
          description: Criteria are contradictory or reference unknown attributes
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /segments/{segmentId}/preview:
    parameters:
      - name: segmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: previewSegment
      x-ticvai-audience: [staff]
      summary: Estimate segment size and reachability
      description: >
        Returns the matching count, and separately the **reachable** count per channel after
        consent and suppression are applied. A segment of 50,000 with 3,000 email consents is
        a 3,000-person campaign, and knowing that before sending avoids a very awkward
        report.
      tags: [segment]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentPreview' }

  /segments/{segmentId}/members:
    parameters:
      - name: segmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSegmentMembers
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List guests currently matching a segment
      description: Evaluated live. Useful for spot-checking a definition before use.
      tags: [segment]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GuestProfile' }

  # ---------------------------------------------------------------- campaigns
  /campaigns:
    get:
      operationId: listCampaigns
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List campaigns
      tags: [campaign]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CampaignStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Campaign' }

    post:
      operationId: createCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Create a campaign
      description: >
        Created in draft. One-off, scheduled, or triggered by an event such as a booking, a
        visit or a birthday.
      tags: [campaign]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCampaignRequest' }
      responses:
        '201':
          description: Created in draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }

  /campaigns/{campaignId}:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read a campaign with performance
      tags: [campaign]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Amend, pause or resume a campaign
      description: >
        Content and audience are editable only in draft. A live campaign may be paused,
        rescheduled or stopped — nothing else. Changing the audience mid-send produces a
        campaign nobody can report on afterwards.
      tags: [campaign]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                isPaused: { type: boolean }
                scheduledFor: { type: string, format: date-time }
                content: { $ref: '#/components/schemas/CampaignContent' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '409':
          description: Content or audience amended on a live campaign
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /campaigns/{campaignId}/test-send:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: testSendCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Send a test to named recipients
      description: >
        Renders with sample personalisation. Bypasses consent because the recipients are
        staff, and is recorded as a test so it never appears in campaign metrics.
      tags: [campaign]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string }
                sampleSubjectId:
                  type: string
                  format: uuid
                  description: Personalise using this guest's data. Otherwise placeholders are used.
      responses:
        '202':
          description: Test queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentCount: { type: integer }

  /campaigns/{campaignId}/launch:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: launchCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Launch or schedule a campaign
      description: >
        Evaluates the segment, applies consent and suppression, and queues the send. The
        response reports how many were excluded and why, before anything goes out.

        **Consent is checked at send time, not at segment build time** — a guest may withdraw
        between the two, and the later check is the one that matters.
      tags: [campaign]
      x-ticvai-permission: MARKETING_SEND
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledFor: { type: string, format: date-time }
                confirmAudienceSize:
                  type: integer
                  description: >
                    Guard against a segment that has grown unexpectedly. When supplied and
                    the evaluated size differs beyond tolerance, the launch is refused.
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchResult' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            Already launched, audience size differs beyond tolerance, or every recipient was
            excluded.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /campaigns/{campaignId}/pause:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: pauseCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Pause a campaign mid-send
      description: >
        Halts sending. **Recipients already sent to are not unsent** — pausing stops the next message, not the last one.

        Resuming continues from where it stopped rather than from the start, which is why `paused` cannot return to `scheduled`.
      tags: [campaign]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /campaigns/{campaignId}/unschedule:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: unscheduleCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Pull a scheduled campaign before it sends
      description: >
        Returns it to draft. Distinct from stopping: nothing has been sent, so there is no partial audience to reason about.
      tags: [campaign]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /campaigns/{campaignId}/stop:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: stopCampaign
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      summary: Stop a campaign mid-send
      description: >
        Halts remaining sends immediately. Messages already dispatched cannot be recalled,
        and the response reports how many went out.
      tags: [campaign]
      x-ticvai-permission: MARKETING_SEND
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }

  /campaigns/{campaignId}/performance:
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCampaignPerformance
      x-ticvai-consumed-by:
        - "P08 BO-005 Queue Monitor"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: analytical
      summary: Delivery and engagement
      description: >
        Sent, delivered, opened, clicked, bounced, complained, unsubscribed — and attributed
        revenue where a booking followed within the attribution window.
      tags: [campaign]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Performance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPerformance' }

  # ---------------------------------------------------------------- messages
  /message-templates:
    get:
      operationId: listMessageTemplates
      x-ticvai-consumed-by:
        - "P12 SUP-007 Canned Response Management"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
