      x-ticvai-persistence: "marketing.segment_criterion"
      type: object
      required: [attribute, operator]
      properties:
        attribute:
          type: string
          description: >
            Behavioural or profile attribute — visit count, last visit, lifetime value,
            product purchased, membership tier, venue visited, language.

            **Free-form rather than an enum, which is why 22.14.8, 5.3.19 and 5.5.17b were readable
            as gaps and are not.** `walletBalance`, `engagementTier` and `portfolioScope` are
            expressible today; what was missing was anybody saying so.

            **Three that need saying, because the naive reading is wrong:**

            `walletBalance` should segment on **`cash` credit only**. A guest with 200 dirhams of
            promotional credit expiring Friday is a different campaign from one with 200 of their
            own money, and treating them alike sends a spend-it-now message to somebody who was
            given it.

            `walletBalance.expiringWithinDays` is the segment that earns the attribute — **credit
            about to expire unspent is a guest about to be disappointed and a venue about to book
            breakage**, and only one of those is worth a message.

            `portfolioScope` aggregates across a `Grant` delegation (CF-132) and **must not message
            every member about a household total** — that is how a venue tells a teenager what
            their parent spends.
        operator:
          type: string
          enum: [equals, notEquals, greaterThan, lessThan, between, in, notIn, exists, notExists, withinDays]
        value: {}
        values:
          type: array
          items: {}

