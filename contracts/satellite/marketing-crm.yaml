        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageTemplate' }
        '400':
          description: Unknown merge field, or a required language is missing
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /messages:
