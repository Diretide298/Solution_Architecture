      security:
        - serviceAuth: []
        - bearerAuth: []
      summary: Send a transactional message
      description: >
        Booking confirmations, reminders, service updates. **Transactional messages are not
        marketing** and are sent under contract performance rather than marketing consent —
        but they still respect the suppression list, because a hard bounce is a hard bounce.
      tags: [message]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
