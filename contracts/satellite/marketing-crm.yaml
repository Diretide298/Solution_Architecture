      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, templateId, channel]
              properties:
                subjectId: { type: string, format: uuid }
                templateId: { type: string, format: uuid }
                channel: { $ref: '#/components/schemas/MessageChannel' }
                mergeValues:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDispatch' }
        '409':
