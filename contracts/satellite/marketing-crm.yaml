openapi: 3.1.0
info:
  title: TICVAI Marketing & CRM
  version: 0.1.0
  x-ticvai-screen-count: 49
  x-ticvai-tier: satellite
  x-ticvai-module: "20 — Marketing & CRM"
  x-ticvai-requirements: 319
  x-ticvai-capabilities: [C32, C33, C59, C60, C61, C62, C63, C64, C65, C66, C93]
  x-ticvai-platforms:
    - "P08 Venue Back Office"
    - "P12 Support Console"
    - "P02 Guest App"
  description: >
    ## What this contract covers

    **Consent gates everything. A segment is a definition, not a list.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 20 — Marketing & CRM |
    | **Requirements** | ~319 |
    | **Capabilities** | C32, C33, C59, C60, C61, C62, C63, C64, C65, C66, C93 |
    | **Consumed by** | P08 Venue Back Office · P12 Support Console · P02 Guest App |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Guest profiles, segmentation, campaigns, consent, service cases, loyalty and feedback.
    Domain 20 — 319 requirements.

    Positions this encodes:

    - **Consent gates everything.** No campaign sends to a guest without a current, recorded
      consent for that channel and purpose. Consent is checked at send time, not at segment
      build time, because a guest may withdraw between the two.
    - **Consent management is Wave 1**, ahead of the rest of this context. It is the
      precondition for AI-66 and for any outbound message at all.
    - **A segment is a definition, not a list.** It is evaluated when used. A materialised
      list goes stale the moment a guest transacts, and stale audience lists are how people
      receive offers for things they already bought.
    - **Guest identity is separate from entitlement.** A profile here references a Subject by
      opaque ID; the personal data lives in the erasable store, which is what makes erasure
      possible against an append-only ledger.
    - Where a guest is linked across cells, marketing operates on the **local** subject.
      Cross-cell aggregation happens in the warehouse, never by querying another cell.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: guest
  - name: consent
  - name: segment
  - name: campaign
  - name: message
  - name: case
  - name: loyalty
  - name: feedback

paths:
  # ---------------------------------------------------------------- guests
  /conversations:
    get:
      operationId: listConversations
      x-ticvai-consumed-by:
        - "P12 SUP-002 Agent Dashboard"
        - "P12 SUP-004 Conversation Queue"
        - "P12 SUP-008 Agent Performance & SLA View"
      x-ticvai-audience: [staff]
      summary: The omnichannel inbox
      description: >
        22.8.1. WhatsApp, web chat, in-app, email and SMS in one queue.

        **A conversation is not a case.** A case is a ticket — created, assigned, resolved,
        closed, measured in hours. A conversation is a live session with somebody waiting, and its
        service level is measured in seconds. The support screens were wired to `listCases` until
        17 August, which made every message a case update and left the queue, the routing and the
        agent state with nowhere to live.

        A conversation may *create* a case (22.8.12). It is not one.
      tags: [marketing]
      x-ticvai-permission: CASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ConversationState' }
        - name: assignedToMe
          in: query
          schema: { type: boolean }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/ConversationChannel' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getConversation
      x-ticvai-consumed-by:
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff]
      summary: One conversation and everything before it
      description: >
        22.8.2 and 22.8.3. **The whole history, across channels and sessions** — a guest who asked
        on WhatsApp last week and is now in the app is one person with one thread.

        Identity resolves from phone, email, membership number or a signed-in session, and a
        conversation with none of those is anonymous and stays that way rather than being guessed
        at.
      tags: [marketing]
      x-ticvai-permission: CASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Conversation with its messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendConversationMessage
      x-ticvai-consumed-by:
        - "P02 GST-032 AI Concierge – Chat"
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff, guest]
      summary: Say something, as a guest or an agent
      description: >
        22.8.20. Text, images, PDFs, QR codes and tickets.

        **The sender is resolved, not declared.** A guest session sends as the guest; an agent
        session sends as that agent; the assistant sends as the assistant and is labelled as one —
        **a guest talking to a bot that presents as a person is a complaint waiting for the moment
        they find out.**
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      assetId: { type: string, format: uuid }
                      kind: { type: string, enum: [image, video, document, ticket, qr, paymentLink] }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }

  /conversations/{conversationId}/handover:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: handoverToAgent
      x-ticvai-consumed-by:
        - "P02 GST-032 AI Concierge – Chat"
        - "P05 KSK-015 Assistant"
      x-ticvai-audience: [guest]
      summary: Pass an assistant conversation to a person
      description: >
        22.8.5. **The requirement that turns the concierge into a support channel** — somebody has
        to be on the other end.

        **The whole thread goes with it, and the guest does not repeat themselves.** A handover
        that loses context is worse than no assistant at all, because the guest has already spent
        the effort once.

        Triggered by the guest asking, by the assistant refusing or failing, by sentiment
        (22.8.16), or by a capability outside `guestCapabilityScope` — **an assistant bounded to
        ticket selection and checkout will meet questions it may not answer, and this is where
        those go.**

        **Where no agent is available it says so** and offers a case instead. Queuing a guest for
        a person who is not there is the failure this operation exists to avoid.
      tags: [marketing]
      x-ticvai-permission: null   # the guest may ask for a person; the assistant may hand over
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [guestRequested, assistantRefused, assistantFailed, outOfScope, negativeSentiment, complexIntent, paymentIssue]
                summary:
                  type: string
                  description: >
                    **The assistant's own summary of what the guest wants**, so the agent opens
                    with context rather than reading a transcript while somebody waits.
                preferredQueueId: { type: string, format: uuid }
      responses:
        '200':
          description: Queued for an agent, with a position and a wait estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '409':
          description: >
            **No agent available.** Returns the reason and offers a case, rather than queuing a
            guest for somebody who is not there.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /conversations/{conversationId}/claim:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: claimConversation
      x-ticvai-consumed-by:
        - "P12 SUP-004 Conversation Queue"
      x-ticvai-audience: [staff]
      summary: An agent takes it
      description: >
        22.8.17, 22.8.18. **Claiming is what stops two agents answering the same guest**, which
        happens on a busy queue and reads as chaos from the guest's side.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '409':
          description: Already claimed by another agent
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /conversations/{conversationId}/transfer:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transferConversation
      x-ticvai-consumed-by:
        - "P12 SUP-004 Conversation Queue"
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff]
      summary: Pass it to another agent or queue
      description: >
        22.8.17. **The context travels again** — a guest transferred twice should still not have
        repeated themselves.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toPrincipalId: { type: string, format: uuid }
                toQueueId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}/close:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeConversation
      x-ticvai-consumed-by:
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff]
      summary: End it
      description: >
        Resolved, abandoned by the guest, or timed out. **Abandoned and resolved are different
        numbers** and a service-level report that merges them is measuring nothing.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [resolved, caseRaised, abandonedByGuest, timedOut, spam] }
                caseId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /agent-availability:
    put:
      operationId: setAgentAvailability
      x-ticvai-consumed-by:
        - "P12 SUP-002 Agent Dashboard"
        - "P12 SUP-003 Availability & Routing Settings"
      x-ticvai-audience: [staff]
      summary: An agent goes available, away or offline
      description: >
        22.8.18. **Routing depends on this and `SUP-003` had no operation behind it** until
        17 August.

        An agent who forgets to go offline is an agent conversations queue for. **Availability
        expires** rather than persisting through a closed laptop.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [available, busy, away, offline] }
                maxConcurrent:
                  type: integer
                  description: How many conversations this agent takes at once. **Three is not three times one.**
                queueIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /kiosk-assists:
    post:
      operationId: startKioskAssist
      x-ticvai-audience: [staff]
      summary: A staff member helps a guest at a kiosk, remotely
      description: >
        2.1.25. *"Authorized staff shall be able to remotely assist guests using self-service
        kiosks, troubleshoot issues, and support checkout completion."*

        **The other half of `KSK-013 Call staff`**, which was a button that called nothing.

        The staff member acts **on the kiosk's session, under their own permission** — a cashier
        completing a guest's checkout is a staff action on a guest cart, and it is recorded as
        theirs. The guest sees who is helping and can end it; **remote assistance a guest cannot
        see or stop is surveillance.**
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, format: uuid }
                cartId: { type: string, format: uuid, nullable: true }
                reason: { type: string, enum: [guestCalled, healthAlert, stuckSession, paymentIssue, proactive] }
      responses:
        '201':
          description: Session started, and visible on the kiosk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KioskAssistSession' }

  /kiosk-assists/{sessionId}/end:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: endKioskAssist
      x-ticvai-consumed-by:
        - "P05 KSK-013 Call staff"
      x-ticvai-audience: [device]
      summary: Stop assisting
      description: >
        Ended by the staff member, by the guest, or by a timeout. **The guest can always end it**,
        and the record says who did.
      tags: [marketing]
      x-ticvai-permission: null   # the guest at the kiosk may end it too
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KioskAssistSession' }

  /loyalty/position:
    get:
      operationId: getLoyaltyPosition
      x-ticvai-consumed-by:
        - "P02 GST-036 Loyalty & Rewards"
        - "P02 GST-064 Loyalty & Rewards"
      x-ticvai-audience: [guest]
      summary: A guest's points, tier and what is within reach
      description: >
        158 loyalty requirements, eleven naming the app, and **no operation returned a guest
        their own balance**.

        Returns the points, the tier, and **how far from the next one** — the last is what makes
        a loyalty scheme change behaviour, and a screen showing only a number does not.
      tags: [marketing]
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Position
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjectId: { type: string, format: uuid }
                  programmeId: { type: string, format: uuid }
                  pointsBalance: { type: integer }
                  pointsPending:
                    type: integer
                    description: Earned and not yet cleared — a purchase inside the refund window.
                  tier: { type: string }
                  nextTier: { type: string, nullable: true }
                  pointsToNextTier: { type: integer, nullable: true }
                  expiringPoints: { type: integer }
                  expiringAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: >
                      **Points that lapse unannounced are a complaint.** The date is returned so
                      the interface can warn before it happens.

  /guests:
    get:
      operationId: searchGuests
      x-ticvai-consumed-by:
        - "P06 EMP-043 Device settings"
        - "P08 BO-036 Device Registry"
        - "P13 CMS-018 Consent & Legal"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Search guest profiles
      description: >
        Returns profiles the caller's scope permits. Personal fields are returned only to
        principals holding `GUEST_VIEW_PII`; everyone else sees the opaque subject reference
        and behavioural attributes.
      tags: [guest]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: search
          in: query
          description: Name, email, phone or membership number. Requires GUEST_VIEW_PII.
          schema: { type: string }
        - name: segmentId
          in: query
          schema: { type: string, format: uuid }
        - name: hasConsentFor
          in: query
          schema: { $ref: '#/components/schemas/ConsentPurpose' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Guests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GuestProfile' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /guests/{subjectId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGuestProfile
      x-ticvai-consumed-by:
        - "P01 WEB-011 Guest Details & Attendee Forms"
        - "P06 EMP-043 Device settings"
        - "P08 BO-036 Device Registry"
        - "P13 CMS-018 Consent & Legal"
      x-ticvai-audience: [staff, guest]
      x-ticvai-read-routing: replica
      summary: Read a guest profile
      description: >
        The single-guest view a service agent works from — profile, consent state, recent
        orders, open cases, loyalty position.
      tags: [guest]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-permission-escalated: GUEST_VIEW_PII   # where the response includes a document or biometric
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestProfileDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateGuestProfile
      x-ticvai-consumed-by:
        - "P06 EMP-043 Device settings"
        - "P08 BO-036 Device Registry"
        - "P13 CMS-018 Consent & Legal"
      x-ticvai-audience: [staff]
      summary: Amend a guest profile
      tags: [guest]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, maxLength: 200 }
                preferredLanguage: { type: string, pattern: '^[a-z]{2}$' }
                preferredChannel: { $ref: '#/components/schemas/MessageChannel' }
                tags:
                  type: array
                  items: { type: string }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestProfileDetail' }

  /guests/{subjectId}/merge:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: mergeGuestProfiles
      x-ticvai-consumed-by:
        - "P06 EMP-043 Device settings"
        - "P08 BO-036 Device Registry"
        - "P13 CMS-018 Consent & Legal"
      x-ticvai-audience: [staff]
      summary: Merge a duplicate profile into this one
      description: >
        Orders, cases, loyalty and consent transfer to the surviving profile. **Consent does
        not combine permissively** — where the two profiles disagree, the more restrictive
        position wins, because merging must never widen what a guest agreed to.

        The absorbed profile is retained as a redirect rather than deleted; historic
        references must continue to resolve.
      tags: [guest]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
