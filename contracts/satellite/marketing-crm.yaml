openapi: 3.1.0
info:
  title: TICVAI Marketing & CRM
  version: 0.1.0
  x-ticvai-screen-count: 50
  x-ticvai-tier: satellite
  x-ticvai-module: "22 — Marketing & CRM"
  x-ticvai-requirements: 319
  x-ticvai-capabilities: [C32, C33, C59, C60, C61, C62, C63, C64, C65, C66, C93]
  x-ticvai-platforms:
    - "P08 Venue Management"
    - "P12 Venue Support"
    - "P02 Guest App"
  description: >
    ## What this contract covers

    **Consent gates everything. A segment is a definition, not a list.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 22 — Marketing & CRM |
    | **Requirements** | ~319 |
    | **Capabilities** | C32, C33, C59, C60, C61, C62, C63, C64, C65, C66, C93 |
    | **Consumed by** | P08 Venue Management · P12 Venue Support · P02 Guest App |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Guest profiles, segmentation, campaigns, consent, service cases, loyalty and feedback.
    Domain 20 — 319 requirements.

    Positions this encodes:

    - **Consent gates everything.** No campaign sends to a guest without a current, recorded
      consent for that channel and purpose. Consent is checked at send time, not at segment
      build time, because a guest may withdraw between the two.
    - **Consent management is Wave 1**, ahead of the rest of this context. It is the
      precondition for AI-66 and for any outbound message at all.
    - **A segment is a definition, not a list.** It is evaluated when used. A materialised
      list goes stale the moment a guest transacts, and stale audience lists are how people
      receive offers for things they already bought.
    - **Guest identity is separate from entitlement.** A profile here references a Subject by
      opaque ID; the personal data lives in the erasable store, which is what makes erasure
      possible against an append-only ledger.
    - Where a guest is linked across cells, marketing operates on the **local** subject.
      Cross-cell aggregation happens in the warehouse, never by querying another cell.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: guest
  - name: consent
  - name: segment
  - name: campaign
  - name: message
  - name: case
  - name: loyalty
  - name: feedback

paths:
  # ---------------------------------------------------------------- guests
  /invitation-campaigns:
    post:
      operationId: createInvitationCampaign
      summary: A quota-bounded, addressed invitation
      description: >
        BL-150 and CF-74's issuance half. **A campaign broadcasts; an invitation is addressed and
        expects a response.**

        **`quota` is places and `overInvitePercent` is invitations** — a press night invites 150 for
        100 seats because 60% come, and a system that refuses the 101st makes the venue do that
        arithmetic by hand.
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCampaign' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCampaign' }

  /invitations/{token}/respond:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: respondToInvitation
      summary: Accept or decline
      description: >
        **The token is single-use.** An invitation link forwarded to a group chat is the failure
        mode, and a token that survives its first use ends up there.

        **Accepting issues the entitlement**, which is why this is not a marketing operation with a
        follow-up.
      tags: [marketing]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest, public]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [accept, decline] }
                plusOnes: { type: integer, default: 0 }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }

  /privacy-incidents:
    post:
      operationId: recordPrivacyIncident
      summary: Log a personal-data breach and start the clock
      description: >
        BL-176. **UAE PDPL gives 72 hours from discovery**, and nothing recorded one.

        **`discoveredAt` starts the clock, not `occurredAt`** — and a discovery nobody recorded is a
        deadline nobody is counting.

        **A decision not to notify is recorded with its reason.** Deciding a breach is not notifiable
        is legitimate; an undocumented decision is indistinguishable from having missed it.
      tags: [marketing]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyIncident' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyIncident' }

  /forms:
    post:
      operationId: createForm
      summary: Define a waiver, survey or capture form
      description: >
        CF-129. **One mechanism, three uses.** A waiver is this with a signature, a survey is this
        with a scale, a capture is this at the point of sale.

        Published as a version. **A change creates a new version and the old one stays readable
        forever** — 2.15.13 requires the exact accepted version retained.
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinition' }
      responses:
        '201':
          description: Created as a draft version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinition' }

  /form-submissions:
    post:
      operationId: submitForm
      summary: Sign a waiver, answer a survey, capture details
      description: >
        **Bound to the version accepted, not to the form.** A submission pointing at a form that has
        since changed is a submission proving nothing.

        **A guardian may sign for a minor** — `onBehalfOfSubjectId` names them, because an unsigned
        or self-signed minor waiver is worth nothing at the moment it matters.

        Where the form has an expiry, a live acceptance means **a returning participant does not sign
        again.**
      tags: [marketing]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormSubmission' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormSubmission' }

  /guests/{subjectId}/waiver-status:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWaiverStatus
      summary: Whether this guest may be issued a ticket that requires a waiver
      description: >
        2.15.9. **Ticket issuance is conditional on waiver acceptance**, which puts this in the
        purchase path rather than beside it — and means it must answer fast and offline.

        **Returns which waiver is missing, not just that one is.** A guest at a counter told *"you
        need to sign something"* is a guest asking which, and the operator should not have to guess.
      tags: [marketing]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest, device]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: productId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSatisfied: { type: boolean }
                  missingFormIds: { type: array, items: { type: string, format: uuid } }
                  expiringWithinDays: { type: integer, nullable: true }

  /guest-documents:
    post:
      operationId: uploadGuestDocument
      summary: Store a guest photo, ID or signed document
      description: >
        BL-133. **Deliberately not `assets`.** A guest's passport scan is not a marketing asset — it
        has a different retention clock, a different access rule and a different reason to exist,
        and **one careless query against a shared store returns both.**

        `retainUntil` is required. **A guest document with no deletion date is a guest document kept
        forever.**
      tags: [marketing]
      x-ticvai-permission: GUEST_VIEW_PII
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestDocument' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestDocument' }

  /challenges:
    post:
      operationId: createChallenge
      summary: Define a challenge, mission or streak
      description: >
        22.6.1. **Gamification is not loyalty** — loyalty pays for spend, and a challenge pays for
        behaviour the venue wants that spend does not produce: a second visit, a quiet Tuesday, a
        ride nobody rides.

        **A challenge that only rewards spending is a loyalty programme with worse arithmetic.**
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Challenge' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }

  /guests/me/challenges:
    get:
      operationId: getMyChallenges
      summary: Active challenges and how far along I am
      description: >
        22.6.14 and 22.6.15. **Progress is shown, not just the outcome.** A guest two visits from a
        reward behaves differently from one who does not know how close they are — **which is the
        entire mechanism.**
      tags: [marketing]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Challenges with progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChallengeProgress' }

  /seo-metadata:
    put:
      operationId: setSeoMetadata
      summary: Titles, descriptions, canonicals and hreflang
      description: >
        22.11.1 and 22.11.11. **SEO is not a marketing nicety for a venue selling online** — an
        attraction that does not appear in search sells through OTAs at OTA commission.

        **Generated by default and overridable**: a venue with 400 products will not write 400 meta
        descriptions, and one with an important landing page will not accept a generated one.
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeoMetadata' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeoMetadata' }

  /seo-redirects:
    post:
      operationId: createUrlRedirect
      summary: 301, 302 and custom redirects
      description: >
        22.11.7. **A redirect chain is the failure mode.** A to B to C loses ranking at every hop,
        so a new redirect whose target is itself a redirect is **collapsed rather than appended.**
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UrlRedirect' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlRedirect' }

  /lost-items:
    get:
      operationId: listLostItems
      summary: Reported and found, with suggested matches
      description: >
        BL-021. **The match is the capability.** A guest reports a lost phone and a cleaner hands
        one in — without both sides modelled, somebody searches a case list by hand.
      tags: [marketing]
      x-ticvai-permission: CASE_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LostItem' }
    post:
      operationId: recordLostItem
      summary: Report something lost, or hand something in
      description: >
        **One operation for both sides**, distinguished by `kind`. A guest reports; a cleaner hands
        in. **Modelling them separately would mean matching across two shapes**, which is how a
        match gets missed.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostItem' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }

  /lost-items/{itemId}/matches:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getLostItemMatches
      summary: Candidate matches, scored
      description: >
        **The point of the module.** Generic case management holds a conversation about a lost bag
        and cannot tell you the bag handed in on Tuesday is the one asked about on Monday.

        Scored, never auto-claimed. **Returning the wrong phone to the wrong person is worse than
        returning none**, and the last step is a human looking at both.
      tags: [marketing]
      x-ticvai-permission: CASE_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LostItemMatch' }

  /referrals:
    post:
      operationId: createReferral
      summary: Issue a referral code
      description: >
        BL-034. **The reward fires on the referee's qualifying act, not on the sign-up** — a
        referral that pays on registration pays for accounts rather than for guests.
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Referral' }
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }

  /conversations/{conversationId}/disposition:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setCallDisposition
      summary: Why the conversation ended, and any callback
      description: >
        BL-082. **A conversation could be closed and nothing recorded why**, so every one looked
        identical in a report — and a promise to ring back lived in somebody's notebook.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallDisposition' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDisposition' }

  /lost-items/{itemId}/match:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: matchLostItem
      summary: Tie a report to a found item, or hand it back
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [match, unmatch, claim, return, dispose] }
                otherItemId: { type: string, format: uuid, nullable: true }
                claimantSubjectId: { type: string, format: uuid, nullable: true }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostItem' }

  /attribution/touches:
    post:
      operationId: recordTouchPoint
      summary: Record a marketing touch
      description: >
        22.14.17, BL-177. **The platform records touches and does not pick an attribution model.**

        A guest sees an email, ignores it, sees a social post, searches, and buys. **Single-touch
        credits whichever one the model happened to pick**, and a team optimising on that optimises
        the wrong channel. Which rule applies — first, last, linear, time-decay — is a reporting
        question, and **hard-coding one here would make every other one unanswerable.**
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [service]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TouchPoint' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TouchPoint' }

  /journeys:
    get:
      operationId: listJourneys
      summary: Automated journeys
      tags: [marketing]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Journeys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Journey' }
    post:
      operationId: createJourney
      summary: Define an automated journey
      description: >
        22.3.1b. **The visual builder is a frontend over this.** The contract holds the graph; the
        canvas renders it.

        Created as a draft. **Activation is a separate act** because a half-drawn journey that
        starts sending is worse than one that never starts.
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Journey' }
      responses:
        '201':
          description: Created as a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journey' }
        '422':
          description: >
            **The graph does not terminate, or a step points at nothing.** Refused at creation
            rather than discovered by a guest stuck in a loop.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /journeys/{journeyId}/activate:
    parameters:
      - name: journeyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: activateJourney
      summary: Start it, or stop it
      description: >
        **Guests already in a paused journey stay where they are.** Pausing does not evict them,
        because a half-finished recovery sequence that restarts from the top sends the first
        message twice.
      tags: [marketing]
      x-ticvai-permission: MARKETING_SEND
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, archived] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journey' }

  /journeys/{journeyId}/performance:
    parameters:
      - name: journeyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJourneyPerformance
      summary: Entrants, completions, goals reached
      description: >
        **The goal rate is the number that matters, not the open rate.** An abandoned-cart journey
        with a 60% open rate and a 2% purchase rate is a journey annoying people.
      tags: [marketing]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: analytical
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Performance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /message-triggers:
    get:
      operationId: listMessageTriggers
      summary: What fires a message, and when
      tags: [marketing]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Triggers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MessageTrigger' }
    post:
      operationId: setMessageTrigger
      summary: Fire a message from a platform event
      description: >
        **`sendTransactionalMessage` sends and nothing fired it.** A booking confirmation, a
        reminder the day before, a thank-you after — all of them needed somebody to call the send.

        Binds a platform event to a template with an offset. **Before, during and after a visit are
        the same mechanism with a different sign on the offset**, which is why this is one entity
        rather than three.

        **Suppression and consent are checked at send, not here.** A trigger that fires against a
        guest who opted out must not send, and putting that check on the trigger would mean
        rechecking every trigger when consent changes.
      tags: [marketing]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageTrigger' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageTrigger' }

  /message-dispatches/{dispatchId}/retry:
    parameters:
      - name: dispatchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryMessageDispatch
      summary: Send it again, or by another channel
      description: >
        **`MessageDispatch` recorded `status`, `failureReason` and `providerReference`, so a failed
        send was known and nothing acted on it.** No retry, no fallback.

        **An undelivered ticket confirmation is a guest at a gate with nothing to scan**, which is
        why this is not a nicety.

        Failover is to the guest's next available channel, not to a fixed order — a guest with no
        email address does not get an email retry.
      tags: [marketing]
      x-ticvai-permission: MARKETING_SEND
      x-ticvai-audience: [staff, service]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  nullable: true
                  enum: [email, sms, whatsapp, push]
                  description: Absent means the same channel. Present means failover.
      responses:
        '200':
          description: Requeued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDispatch' }

  /guests/identify:
    post:
      operationId: identifyGuest
      summary: Resolve any identifier to a guest
      description: >
        **A resolver over identifiers, not new data.** `searchGuests` finds by name and contact and
        `lookupTicket` resolves a ticket, so a cashier handed a wristband had to know which
        operation to call — and which one depends on what the guest is carrying.

        Takes a token of any kind: a QR payload, an RFID or NFC serial, a membership card number, a
        wallet pass, a phone number, an email or an app device id. **Returns the guest, their live
        entitlements and their loyalty position in one call**, because that is the shape of the
        question at a till.

        **Ambiguity is returned, not resolved.** Two guests sharing a phone number is a real case,
        and picking one silently is how a sale lands on the wrong account.
      tags: [marketing]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-audience: [staff, device]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                tokenKind:
                  type: string
                  nullable: true
                  enum: [qr, rfid, nfc, membershipCard, walletPass, phone, email, appDeviceId, plate]
                  description: >
                    **Optional.** Where absent the platform infers from the token's shape, which is
                    what a scanner gives you — a serial with no label.
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestIdentification' }
        '409':
          description: >
            **More than one guest matches.** Returned with the candidates rather than a guess.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guests/me/profile:
    patch:
      operationId: updateMyProfile
      x-ticvai-consumed-by:
        - "P01 WEB-020 Profile & Preferences"
      summary: A guest correcting their own details
      description: >
        **`updateGuestProfile` is staff-only, and the three screens calling it are the staff app,
        the back office and the CMS** — so to correct a phone number a guest had to ask somebody.

        CF-96 fixed this class for 28 guest screens and the underlying pattern was never swept.

        **A narrower field set than the staff operation.** A guest may correct their name, contact
        details, language and channel preference. They may not set their own tags, lifetime value or
        loyalty tier.
      tags: [marketing]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                preferredLanguage: { type: string }
                preferredChannel: { type: string, enum: [email, sms, whatsapp, push, none] }
                dietary:
                  type: array
                  description: >
                    **Health-adjacent personal data, kept structured rather than as a tag**
                    (BL-134). `GuestProfile.tags` carries VIP-style markers adequately and is the
                    wrong home for a nut allergy — this needs its own consent purpose and its own
                    retention.
                  items: { type: string }
                accessibility:
                  type: array
                  description: Same treatment, same reason.
                  items: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestProfile' }

  /loyalty/accruals:
    post:
      operationId: accrueLoyaltyPoints
      summary: Award points for a completed order
      description: >
        **`games` awards points on play and ticketing did not**, so a guest earned for an arcade
        game and not for the ticket that got them in.

        `adjustLoyaltyPoints` exists and is staff-only under `LEDGER_POST` — **a manual correction,
        not an accrual.** This is the accrual.

        Fired by order completion rather than called by a screen. **Idempotent on the order**,
        because an order that completes twice through a retry must not pay twice.
      tags: [marketing]
      x-ticvai-permission: LOYALTY_ACCRUE
      x-ticvai-audience: [service]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, orderId, programmeId]
              properties:
                subjectId: { type: string, format: uuid }
                orderId: { type: string, format: uuid }
                programmeId: { type: string, format: uuid }
                overridePoints:
                  type: integer
                  nullable: true
                  description: >
                    Where a promotion multiplies the accrual. **Absent means the programme's own
                    rate**, which is the normal case.
      responses:
        '200':
          description: Accrued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyPosition' }

  /loyalty/redemptions:
    post:
      operationId: redeemLoyaltyPoints
      summary: Spend points
      description: >
        BL-018. **A guest could see a balance and not spend it, and there was no rewards
        catalogue** — points that accrue and never redeem are a liability with no exit.

        Holds against the balance through `authoriseStoredValue` rather than deducting directly, so
        a redemption that fails at fulfilment returns the points. **The same two-phase spend every
        other stored value now has** (CF-126).
      tags: [marketing]
      x-ticvai-permission: LOYALTY_REDEEM
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, programmeId, points]
              properties:
                subjectId: { type: string, format: uuid }
                programmeId: { type: string, format: uuid }
                points: { type: integer }
                rewardId: { type: string, format: uuid, nullable: true }
                orderId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Where points are being used against a sale rather than for a catalogue reward.
      responses:
        '200':
          description: Redeemed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyPosition' }

  /conversations:
    get:
      operationId: listConversations
      x-ticvai-consumed-by:
        - "P12 SUP-002 Agent Dashboard"
        - "P12 SUP-004 Conversation Queue"
        - "P12 SUP-008 Agent Performance & SLA View"
      x-ticvai-audience: [staff]
      summary: The omnichannel inbox
      description: >
        22.8.1. WhatsApp, web chat, in-app, email and SMS in one queue.

        **A conversation is not a case.** A case is a ticket — created, assigned, resolved,
        closed, measured in hours. A conversation is a live session with somebody waiting, and its
        service level is measured in seconds. The support screens were wired to `listCases` until
        17 August, which made every message a case update and left the queue, the routing and the
        agent state with nowhere to live.

        A conversation may *create* a case (22.8.12). It is not one.
      tags: [marketing]
      x-ticvai-permission: CASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ConversationState' }
        - name: assignedToMe
          in: query
          schema: { type: boolean }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/ConversationChannel' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getConversation
      x-ticvai-consumed-by:
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff]
      summary: One conversation and everything before it
      description: >
        22.8.2 and 22.8.3. **The whole history, across channels and sessions** — a guest who asked
        on WhatsApp last week and is now in the app is one person with one thread.

        Identity resolves from phone, email, membership number or a signed-in session, and a
        conversation with none of those is anonymous and stays that way rather than being guessed
        at.
      tags: [marketing]
      x-ticvai-permission: CASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Conversation with its messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendConversationMessage
      x-ticvai-consumed-by:
        - "P02 GST-032 AI Concierge – Chat"
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff, guest]
      summary: Say something, as a guest or an agent
      description: >
        22.8.20. Text, images, PDFs, QR codes and tickets.

        **The sender is resolved, not declared.** A guest session sends as the guest; an agent
        session sends as that agent; the assistant sends as the assistant and is labelled as one —
        **a guest talking to a bot that presents as a person is a complaint waiting for the moment
        they find out.**
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      assetId: { type: string, format: uuid }
                      kind: { type: string, enum: [image, video, document, ticket, qr, paymentLink] }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }

  /conversations/{conversationId}/handover:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: handoverToAgent
      x-ticvai-consumed-by:
        - "P02 GST-032 AI Concierge – Chat"
        - "P05 KSK-015 Assistant"
      x-ticvai-audience: [guest]
      summary: Pass an assistant conversation to a person
      description: >
        22.8.5. **The requirement that turns the concierge into a support channel** — somebody has
        to be on the other end.

        **The whole thread goes with it, and the guest does not repeat themselves.** A handover
        that loses context is worse than no assistant at all, because the guest has already spent
        the effort once.

        Triggered by the guest asking, by the assistant refusing or failing, by sentiment
        (22.8.16), or by a capability outside `guestCapabilityScope` — **an assistant bounded to
        ticket selection and checkout will meet questions it may not answer, and this is where
        those go.**

        **Where no agent is available it says so** and offers a case instead. Queuing a guest for
        a person who is not there is the failure this operation exists to avoid.
      tags: [marketing]
      x-ticvai-permission: null   # the guest may ask for a person; the assistant may hand over
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [guestRequested, assistantRefused, assistantFailed, outOfScope, negativeSentiment, complexIntent, paymentIssue]
                summary:
                  type: string
                  description: >
                    **The assistant's own summary of what the guest wants**, so the agent opens
                    with context rather than reading a transcript while somebody waits.
                preferredQueueId: { type: string, format: uuid }
      responses:
        '200':
          description: Queued for an agent, with a position and a wait estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '409':
          description: >
            **No agent available.** Returns the reason and offers a case, rather than queuing a
            guest for somebody who is not there.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /conversations/{conversationId}/claim:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: claimConversation
      x-ticvai-consumed-by:
        - "P12 SUP-004 Conversation Queue"
      x-ticvai-audience: [staff]
      summary: An agent takes it
      description: >
        22.8.17, 22.8.18. **Claiming is what stops two agents answering the same guest**, which
        happens on a busy queue and reads as chaos from the guest's side.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '409':
          description: Already claimed by another agent
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /conversations/{conversationId}/transfer:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transferConversation
      x-ticvai-consumed-by:
        - "P12 SUP-004 Conversation Queue"
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff]
      summary: Pass it to another agent or queue
      description: >
        22.8.17. **The context travels again** — a guest transferred twice should still not have
        repeated themselves.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                toPrincipalId: { type: string, format: uuid }
                toQueueId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /conversations/{conversationId}/close:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeConversation
      x-ticvai-consumed-by:
        - "P12 SUP-005 Live Chat Workspace"
      x-ticvai-audience: [staff]
      summary: End it
      description: >
        Resolved, abandoned by the guest, or timed out. **Abandoned and resolved are different
        numbers** and a service-level report that merges them is measuring nothing.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [resolved, caseRaised, abandonedByGuest, timedOut, spam] }
                caseId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }

  /agent-availability:
    put:
      operationId: setAgentAvailability
      x-ticvai-consumed-by:
        - "P12 SUP-002 Agent Dashboard"
        - "P12 SUP-003 Availability & Routing Settings"
      x-ticvai-audience: [staff]
      summary: An agent goes available, away or offline
      description: >
        22.8.18. **Routing depends on this and `SUP-003` had no operation behind it** until
        17 August.

        An agent who forgets to go offline is an agent conversations queue for. **Availability
        expires** rather than persisting through a closed laptop.
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [available, busy, away, offline] }
                maxConcurrent:
                  type: integer
                  description: How many conversations this agent takes at once. **Three is not three times one.**
                queueIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /kiosk-assists:
    post:
      operationId: startKioskAssist
      x-ticvai-audience: [staff]
      summary: A staff member helps a guest at a kiosk, remotely
      description: >
        2.1.25. *"Authorized staff shall be able to remotely assist guests using self-service
        kiosks, troubleshoot issues, and support checkout completion."*

        **The other half of `KSK-013 Call staff`**, which was a button that called nothing.

        The staff member acts **on the kiosk's session, under their own permission** — a cashier
        completing a guest's checkout is a staff action on a guest cart, and it is recorded as
        theirs. The guest sees who is helping and can end it; **remote assistance a guest cannot
        see or stop is surveillance.**
      tags: [marketing]
      x-ticvai-permission: CASE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
