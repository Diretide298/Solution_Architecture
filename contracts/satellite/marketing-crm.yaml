openapi: 3.1.0
info:
  title: TICVAI Marketing & CRM
  version: 0.1.0
  x-ticvai-screen-count: 17
  x-ticvai-tier: satellite
  x-ticvai-module: "20 — Marketing & CRM"
  x-ticvai-requirements: 319
  x-ticvai-capabilities: [C32, C33, C59, C60, C61, C62, C63, C64, C65, C66, C93]
  x-ticvai-platforms:
    - "P08 Venue Back Office"
    - "P12 Support Console"
    - "P02 Guest App"
  description: >
    ## What this contract covers

    **Consent gates everything. A segment is a definition, not a list.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 20 — Marketing & CRM |
    | **Requirements** | ~319 |
    | **Capabilities** | C32, C33, C59, C60, C61, C62, C63, C64, C65, C66, C93 |
    | **Consumed by** | P08 Venue Back Office · P12 Support Console · P02 Guest App |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Guest profiles, segmentation, campaigns, consent, service cases, loyalty and feedback.
    Domain 20 — 319 requirements.

    Positions this encodes:

    - **Consent gates everything.** No campaign sends to a guest without a current, recorded
      consent for that channel and purpose. Consent is checked at send time, not at segment
      build time, because a guest may withdraw between the two.
    - **Consent management is Wave 1**, ahead of the rest of this context. It is the
      precondition for AI-66 and for any outbound message at all.
    - **A segment is a definition, not a list.** It is evaluated when used. A materialised
      list goes stale the moment a guest transacts, and stale audience lists are how people
      receive offers for things they already bought.
    - **Guest identity is separate from entitlement.** A profile here references a Subject by
      opaque ID; the personal data lives in the erasable store, which is what makes erasure
      possible against an append-only ledger.
    - Where a guest is linked across cells, marketing operates on the **local** subject.
      Cross-cell aggregation happens in the warehouse, never by querying another cell.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: guest
  - name: consent
  - name: segment
  - name: campaign
  - name: message
  - name: case
  - name: loyalty
  - name: feedback

paths:
  # ---------------------------------------------------------------- guests
  /guests:
    get:
      operationId: searchGuests
      x-ticvai-read-routing: replica
      summary: Search guest profiles
      description: >
        Returns profiles the caller's scope permits. Personal fields are returned only to
        principals holding `GUEST_VIEW_PII`; everyone else sees the opaque subject reference
        and behavioural attributes.
      tags: [guest]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: search
          in: query
          description: Name, email, phone or membership number. Requires GUEST_VIEW_PII.
          schema: { type: string }
        - name: segmentId
          in: query
          schema: { type: string, format: uuid }
        - name: hasConsentFor
          in: query
          schema: { $ref: '#/components/schemas/ConsentPurpose' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Guests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GuestProfile' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /guests/{subjectId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGuestProfile
      x-ticvai-consumed-by:
        - "P01 WEB-011 Guest Details & Attendee Forms"
        - "P01 WEB-017 My Account Dashboard"
      x-ticvai-read-routing: replica
      summary: Read a guest profile
      description: >
        The single-guest view a service agent works from — profile, consent state, recent
        orders, open cases, loyalty position.
      tags: [guest]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestProfileDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateGuestProfile
      x-ticvai-consumed-by:
        - "P01 WEB-020 Profile & Preferences"
      summary: Amend a guest profile
      tags: [guest]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, maxLength: 200 }
                preferredLanguage: { type: string, pattern: '^[a-z]{2}$' }
                preferredChannel: { $ref: '#/components/schemas/MessageChannel' }
                tags:
                  type: array
                  items: { type: string }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestProfileDetail' }

  /guests/{subjectId}/merge:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: mergeGuestProfiles
      summary: Merge a duplicate profile into this one
      description: >
        Orders, cases, loyalty and consent transfer to the surviving profile. **Consent does
        not combine permissively** — where the two profiles disagree, the more restrictive
        position wins, because merging must never widen what a guest agreed to.

        The absorbed profile is retained as a redirect rather than deleted; historic
        references must continue to resolve.
      tags: [guest]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicateSubjectId, reason]
              properties:
                duplicateSubjectId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResult' }
        '409':
          description: Either profile is already merged, or they are the same profile
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- consent
  /guests/{subjectId}/consents:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGuestConsents
      x-ticvai-read-routing: primary   # sending against a withdrawn consent is a compliance failure
      summary: Read a guest's consent state
      description: >
        Current position per purpose and channel, with the version of the notice consented
        to and when. A consent whose notice version has since been superseded is reported as
        requiring renewal.
      tags: [consent]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Consent state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    post:
      operationId: recordConsent
      x-ticvai-consumed-by:
        - "P01 WEB-020 Profile & Preferences"
        - "P01 WEB-027 Newsletter Subscription"
      security:
        - guestAuth: []
        - bearerAuth: []
      x-ticvai-self-scoped: subject
      summary: Record a consent decision
      description: >
        **Append-only.** A change of mind is a new record, never an edit — the history of
        what a guest agreed to and when is the evidence that matters if it is ever
        questioned.

        Every record captures the notice version, the channel, the purpose, the source and
        the timestamp.

        **Two callers, two rules.** A guest recording their own consent uses a guest token
        and may only act on their own subject. An agent recording on a guest's behalf uses a
        staff token, requires `GUEST_MANAGE`, and the resulting record names them in
        `recordedByPrincipalId` — consent captured by proxy has to be attributable.
      tags: [consent]
      x-ticvai-permission: null   # guest self-scoped, or GUEST_MANAGE when agent-recorded
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordConsentRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentState' }
        '400':
          description: Notice version unknown, or the purpose is not configured
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guests/{subjectId}/consents/history:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getConsentHistory
      x-ticvai-read-routing: analytical
      summary: Full consent history
      description: Every decision in sequence. This is what a regulator asks to see.
      tags: [consent]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ConsentRecord' }

  /consent-purposes:
    get:
      operationId: listConsentPurposes
      x-ticvai-consumed-by:
        - "P01 WEB-011 Guest Details & Attendee Forms"
      x-ticvai-read-routing: replica
      summary: Configured consent purposes
      tags: [consent]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Purposes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentPurposeConfig' }

    put:
      operationId: setConsentPurposes
      summary: Configure consent purposes
      description: >
        Each purpose names the channels it covers, whether it is required for service, and
        the notice version currently in force. Adding a purpose does not grant it for
        existing guests — they are asked.
      tags: [consent]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purposes]
              properties:
                purposes:
                  type: array
                  items: { $ref: '#/components/schemas/ConsentPurposeConfig' }
      responses:
        '200':
          description: Configured
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentPurposeConfig' }

  /consent/suppression-list:
    get:
      operationId: getSuppressionList
      x-ticvai-read-routing: primary   # a complaint that has not replicated results in another send
      summary: Addresses suppressed from all sending
      description: >
        Hard bounces, complaints, explicit global opt-outs and unsubscribes. Checked at send
        time regardless of segment or consent — a complaint outranks a consent record.
      tags: [consent]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Suppressions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Suppression' }

    post:
      operationId: addSuppression
      summary: Suppress an address
      tags: [consent]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, address, reason]
              properties:
                channel: { $ref: '#/components/schemas/MessageChannel' }
                address: { type: string }
                reason:
                  type: string
                  enum: [hardBounce, complaint, globalOptOut, unsubscribe, invalid, manual]
      responses:
        '201':
          description: Suppressed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suppression' }

  /guests/{subjectId}/wishlist:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWishlist
      x-ticvai-consumed-by:
        - "P01 WEB-009 Wishlist"
      x-ticvai-read-routing: replica
      summary: Read a guest's saved items
      description: >
        Deliberately here rather than in the catalogue. A wishlist is a record of a person's
        intent, not a property of a product — and it is the same shape as every other
        behavioural signal segmentation already reads.

        Items whose product has been withdrawn are returned with `isAvailable: false` rather
        than dropped. A guest who saved something and finds it silently gone assumes the
        feature is broken.
      tags: [guest]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    post:
      operationId: addToWishlist
      x-ticvai-consumed-by:
        - "P01 WEB-009 Wishlist"
      summary: Save an item
      description: >
        Idempotent on the variant — saving twice is one entry, not two. The count matters to
        the guest and to demand signals, so a double tap must not inflate it.
      tags: [guest]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId]
              properties:
                variantId: { type: string, format: uuid }
                performanceId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Saving a specific date rather than the product generally.
                note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Saved, or already present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '404':
          description: Variant not found or not sellable in this venue
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guests/{subjectId}/wishlist/{itemId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeFromWishlist
      x-ticvai-consumed-by:
        - "P01 WEB-009 Wishlist"
      summary: Remove a saved item
      tags: [guest]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      responses:
        '204': { description: Removed }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /guests/{subjectId}/devices:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listGuestDevices
      summary: A guest's registered devices
      description: >
        Here rather than in tenancy. `platform.device` is staff hardware bound to a
        workstation — printers, readers, turnstiles. A guest's phone is neither owned by the
        venue nor bound to anything, and it is registered for one reason: to be sent to.
        That makes it guest engagement.
      tags: [guest]
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GuestDevice' }

    post:
      operationId: registerGuestDevice
      summary: Register a device for push
      description: >
        Called on install and again whenever the provider rotates the token — which happens
        without warning and without an uninstall. Idempotent on the token, so re-registration
        updates rather than duplicates.

        **A registered device is not consent to send.** Push still requires a current consent
        for the purpose; this only records where a message could go.
      tags: [guest]
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [ios, android, web]
                token: { type: string, maxLength: 512 }
                appVersion: { type: string }
                osVersion: { type: string }
                deviceModel: { type: string }
                locale: { type: string }
      responses:
        '200':
          description: Registered, or an existing registration refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestDevice' }

  /guests/{subjectId}/devices/{deviceId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeGuestDevice
      summary: Revoke a device registration
      description: >
        Sign-out, uninstall, or a guest removing a device they no longer have. Revoked rather
        than deleted — a token that starts failing needs a record explaining why, or the same
        dead token gets retried indefinitely.
      tags: [guest]
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      responses:
        '204': { description: Revoked }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- segments
  /segments:
    get:
      operationId: listSegments
      x-ticvai-read-routing: replica
      summary: List segments
      tags: [segment]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Segments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Segment' }

    post:
      operationId: createSegment
      summary: Create a segment
      description: >
        **A definition, not a list.** Evaluated when used, so it cannot go stale. A
        materialised audience list is out of date the moment a guest transacts, which is how
        people receive offers for things they have already bought.
      tags: [segment]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSegmentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Segment' }
        '400':
          description: Criteria are contradictory or reference unknown attributes
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /segments/{segmentId}/preview:
    parameters:
      - name: segmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: previewSegment
      summary: Estimate segment size and reachability
      description: >
        Returns the matching count, and separately the **reachable** count per channel after
        consent and suppression are applied. A segment of 50,000 with 3,000 email consents is
        a 3,000-person campaign, and knowing that before sending avoids a very awkward
        report.
      tags: [segment]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentPreview' }

  /segments/{segmentId}/members:
    parameters:
      - name: segmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSegmentMembers
      x-ticvai-read-routing: replica
      summary: List guests currently matching a segment
      description: Evaluated live. Useful for spot-checking a definition before use.
      tags: [segment]
      x-ticvai-permission: MARKETING_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
