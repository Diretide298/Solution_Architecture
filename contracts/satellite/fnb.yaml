        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        kitchenTicketId: { type: string, nullable: true }
        estimatedReadyAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }

    TableStatus:
