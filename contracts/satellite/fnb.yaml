          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- orders
  /fnb-orders:
    get:
      operationId: listFnbOrders
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List F&B orders
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: outletId
          in: query
          schema: { type: string, format: uuid }
        - name: tableVisitId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FnbOrderStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FnbOrder' }

    post:
      operationId: createFnbOrder
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
      x-ticvai-audience: [staff]
      summary: Place an F&B order
      description: >
        Quick service pays immediately; table service attaches to a visit and pays at close.

        Offline behaviour depends on the items: an order containing only untracked items
        queues normally, while one containing a recipe-linked item is refused offline because
        stock depletes in real time.
      tags: [order]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFnbOrderRequest' }
      responses:
        '201':
          description: Created and sent to the kitchen where a KDS is configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FnbOrder' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: >
            An item is unavailable, modifier constraints are unmet, or a tracked item was
            ordered offline.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fnb-orders/{orderId}/accept:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: acceptFnbOrder
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
      x-ticvai-audience: [staff]
      summary: The outlet takes the order
      description: >
        4.6.35 names `accepted` as a state and there was no way to reach it. An outlet may
        refuse — past last orders, out of a key ingredient, or simply too far behind — and a
        guest whose order sat unacknowledged for ten minutes before rejection has a worse
        experience than one refused immediately.

        May be automatic where the outlet is configured for it. The state still exists, because
        the kitchen ticket is only created on acceptance.
      tags: [service]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                estimatedReadyAt: { type: string, format: date-time }
                stationId: { type: string, format: uuid }
      responses:
        '200':
          description: Accepted. The kitchen ticket now exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FnbOrder' }
        '409':
          description: Already accepted, cancelled, or the outlet has stopped taking orders
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fnb-orders/{orderId}/cancel:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: cancelFnbOrder
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
      x-ticvai-audience: [staff]
      summary: Cancel an order
      description: >
        Before acceptance this is a refusal and needs no approval. **After acceptance the
        kitchen may have started**, so waste is recorded separately and the cancellation needs
        the same authority as a void.
      tags: [service]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [outletRefused, guestCancelled, itemUnavailable, tooLong, error]
                note: { type: string, maxLength: 300 }
                recordWaste:
                  type: boolean
                  description: >
                    Where preparation had started. Raises a waste movement rather than silently
                    losing the cost.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FnbOrder' }
        '409':
          description: Already served, collected or delivered — cancel is no longer the operation
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fnb-orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getFnbOrder
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read an F&B order
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FnbOrder' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: amendFnbOrder
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
      x-ticvai-audience: [staff]
      summary: Amend an order before it is prepared
      description: >
        Once a line is `preparing`, amendment is refused — the kitchen has started. Removing
        it becomes a void with a reason, which is a different and auditable action.
      tags: [order]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addLines:
                  type: array
                  items: { $ref: '#/components/schemas/CreateFnbOrderLine' }
                removeLineIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Amended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FnbOrder' }
        '409':
          description: A targeted line is already preparing or served
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

