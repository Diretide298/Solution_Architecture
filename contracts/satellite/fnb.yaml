              name: { type: string }
              priceDelta: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              isDefault: { type: boolean }
              isAvailable: { type: boolean }

    FnbOrderStatus:
      type: string
      description: >
        The full lifecycle from 4.6.35. Nine states, not six — the earlier enum collapsed
        `accepted` into `placed` and had no `collected` or `delivered` at all, which made
        collection and delivery indistinguishable from a server putting a plate down.

        `accepted` matters because an outlet may refuse: past last orders, out of a key
        ingredient, or simply too far behind. A guest whose order sat in `placed` for ten
        minutes and was then rejected has a worse experience than one refused immediately.
      enum:
        - ordered        # guest or cashier placed it
        - accepted       # the outlet took it. May be automatic, or a human decision
        - inPreparation  # the kitchen started
        - ready          # ready to hand over
        - served         # given to a guest at a table by a server
        - collected      # guest picked it up from a counter
        - delivered      # a runner took it to a seat, cabana or named location
        - cancelled
        - refunded

    ServiceMode:
      type: string
      enum: [quickService, tableService, roomService, collection, delivery]

    CreateFnbOrderLine:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, menuItemId, quantity]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        menuItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        modifierOptionIds:
          type: array
          items: { type: string, format: uuid }
        note:
          type: string
          maxLength: 200
          description: Free text to the kitchen. Allergy notes belong here and are surfaced prominently.
        seatNumber:
          type: integer
          nullable: true
          description: Which cover ordered it. Drives split-by-covers accurately.
        course:
          type: integer
          nullable: true
          description: Course grouping, so the kitchen fires in sequence.

    CreateFnbOrderRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, outletId, serviceMode, lines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        outletId: { type: string, format: uuid }
        serviceMode: { $ref: '#/components/schemas/ServiceMode' }
        tableVisitId:
          type: string
          nullable: true
          description: Required for table service. Absent for quick service.
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateFnbOrderLine' }
        recordedAt: { type: string, format: date-time }

    FnbOrder:
