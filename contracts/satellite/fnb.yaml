openapi: 3.1.0
info:
  title: TICVAI Food & Beverage
  version: 0.1.0
  x-ticvai-screen-count: 28
  x-ticvai-tier: satellite
  x-ticvai-module: "7 — F&B POS  ·  5 — F&B & Guest Management (service)"
  x-ticvai-requirements: 151
  x-ticvai-capabilities: [C05, C06, C07, C08, C27, C36, C90]
  x-ticvai-platforms:
    - "P04 POS"
    - "P02 Guest App"
    - "KDS integration"
  description: >
    ## What this contract covers

    **Menus, table service and kitchen handoff. KDS is an integration point, not a build.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 7 — F&B POS  ·  5 — F&B & Guest Management (service) |
    | **Requirements** | ~151 |
    | **Capabilities** | C05, C06, C07, C08, C27, C36, C90 |
    | **Consumed by** | P04 POS · P02 Guest App · KDS integration |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Menus, modifiers, quick-service ordering, table service, bill splitting and kitchen
    handoff. Domains 4 and 7 — roughly 190 requirements.

    Positions this encodes:

    - **KDS is an integration point, not a build** (31 Jul §11). This contract sends tickets
      to whatever kitchen display the venue already runs and receives status back. It does
      not implement a kitchen display.
    - **Menus read from the local bundle** at point of sale, like the rest of the catalogue
      (ADR-0013). The endpoints here that a terminal calls on the transaction path are order
      submission and table state — not menu retrieval.
    - **A table visit is not an order.** A guest sits, orders, orders again, then pays. The
      visit accumulates; orders attach to it; the bill closes it.
    - **Splitting happens at close, not at order time.** By amount, by covers, or by
      category — 03 Aug §5. A split computed at order time falls apart the moment someone
      orders another drink.
    - Stock depletion for recipe-linked items is real-time, so **F&B is blocked offline
      where inventory is tracked**, and available offline where it is not.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: guestOrdering
  - name: menu
  - name: modifier
  - name: order
  - name: table
  - name: bill
  - name: kitchen
  - name: production

paths:
  # ---------------------------------------------------------------- guest ordering
  #
  # Everything below is guest-facing. The rest of this contract is staff-operated —
  # a cashier at a till, a server on a floor — and none of it was reachable with a
  # guest token. `diningAndFnb` is a module a tenant can switch on in the White Label
  # Builder, and until now there was nothing behind it.

  /table-visits/{visitId}/request-bill:
    parameters:
      - name: visitId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestBill
      x-ticvai-audience: [staff]
      summary: The party asked to pay
      description: >
        **The kitchen stops accepting additions**, and the bill is prepared.

        Reversible. A party that asks for the bill and then orders another round is normal, and a
        system that refuses is one staff route around by opening a second visit.
      tags: [fnb]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Bill requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableVisit' }

  /table-reservations:
    get:
      operationId: listTableReservations
      x-ticvai-audience: [staff]
      summary: Bookings for a service period
      description: >
        5.1.1. **Live table state alongside the bookings**, because a host needs to know what is
        booked and what is actually free, and those differ all evening.
      tags: [fnb]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
        - name: outletId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TableReservation' }

    post:
      operationId: createTableReservation
      x-ticvai-audience: [guest]
      summary: Book a table in advance
      description: >
        4.9.13. **Distinct from `claimTableSession`**, which identifies a table a guest is
        already sitting at. This is a booking with a time, a party size and nobody present.

        **Does not name a specific table by default.** A host seats a party on the night, and
        committing table 7 at booking time means every later booking is refused against a
        constraint that did not need to exist. A table may be named where a guest asked for one.
      tags: [fnb]
      x-ticvai-permission: null   # a guest may book their own; staff book with FNB_OPERATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TableReservation' }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableReservation' }
        '409':
          description: >
            No cover available for that party size at that time. **The reason names the
            constraint** — a party of eight refused when a party of two would fit is a different
            answer from the outlet being full.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /table-reservations/{reservationId}:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTableReservation
      x-ticvai-audience: [guest]
      summary: Change or cancel a booking
      description: >
        Party size, time, or cancelled. **A reduced party size releases cover immediately** —
        four seats returned at 18:00 can be sold for the same evening.
      tags: [fnb]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TableReservation' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableReservation' }

  /table-reservations/{reservationId}/seat:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: seatTableReservation
      x-ticvai-audience: [staff]
      summary: The party arrived and has been sat down
      description: >
        **Where the booking becomes a visit.** The host names the actual table now, and a table
        session opens against it — which is the moment `claimTableSession` and this contract meet.

        A party seated at a different size from the booking is recorded as such. A booking for
        six that arrives as four is a cover a restaurant could have sold.
      tags: [fnb]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableIds]
              properties:
                tableIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                actualPartySize: { type: integer }
      responses:
        '200':
          description: Seated, and a table visit opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableReservation' }

  /venues/{venueId}/dining:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listDiningOutlets
      x-ticvai-consumed-by:
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-029 Venue Info & Services"
        - "P06 EMP-030 Venue map"
        - "P08 BO-003 Queue Integration Setup"
        - "P08 BO-062 Venue Profile"
        - "P08 BO-065 Venue Configuration"
      x-ticvai-audience: [guest]
      summary: Where a guest can eat, right now
      description: >
        The dining list in the guest app. Returns outlets that are **open now**, not every
        outlet configured — a guest shown a restaurant that closed an hour ago walks there.

        Ordering method is stated per outlet, because it varies within one venue: a table
        service restaurant, a counter that takes app orders for collection, and a bar that
        does neither are all normal.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - name: openNow
          in: query
          schema: { type: boolean, default: true }
        - name: orderingMethod
          in: query
          schema: { $ref: '#/components/schemas/GuestOrderingMethod' }
      responses:
        '200':
          description: Dining outlets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DiningOutlet' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /outlets/{outletId}/guest-menu:
    parameters:
      - name: outletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGuestMenu
      x-ticvai-consumed-by:
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-031 AI Concierge – Home"
        - "P02 GST-061 Menu Item Detail"
        - "P08 BO-044 F&B Outlets"
      x-ticvai-audience: [guest]
      summary: The menu a guest sees
      description: >
        The menu in force **at this moment** — breakfast at nine, lunch at one. The staff
        endpoint returns every menu with its availability window; this returns the one that
        applies, because a guest does not want to work out which.

        Unavailable items are returned marked, not removed. A guest who saw a dish yesterday
        and cannot find it today assumes the app is broken; "sold out" is an answer.

        Allergens are always present. Omitting them is not an option a tenant gets to choose.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - name: at
          in: query
          description: Evaluate menu availability at this time rather than now.
          schema: { type: string, format: date-time }
        - name: language
          in: query
          schema: { type: string, pattern: '^[a-z]{2}$' }
      responses:
        '200':
          description: The menu in force
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestMenu' }
        '404':
          description: No menu in force at that time. The response says when the next one starts
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /venues/{venueId}/delivery-locations:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listDeliveryLocations
      x-ticvai-consumed-by:
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-029 Venue Info & Services"
        - "P06 EMP-030 Venue map"
        - "P08 BO-003 Queue Integration Setup"
        - "P08 BO-062 Venue Profile"
        - "P08 BO-065 Venue Configuration"
      x-ticvai-audience: [guest]
      summary: Where an order can be delivered
      description: >
        4.6.26 — tables, seats, cabanas or designated locations. A venue runs several kinds at
        once: a restaurant with tables, a poolside with cabanas and sunbeds, an auditorium
        where the seat number is the address, and a set of named collection points.

        They are one concept because a runner needs one instruction, and a guest needs one
        way to say where they are.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/DeliveryLocationKind' }
        - name: servingOutletId
          in: query
          description: Only locations this outlet delivers to.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeliveryLocation' }

  /location-sessions:
    post:
      operationId: claimLocationSession
      x-ticvai-consumed-by:
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-030 In-Venue Notifications"
      x-ticvai-audience: [guest]
      summary: Tell the platform where the guest is
      description: >
        Scanning the code on a table, a cabana, a sunbed, or entering a seat number. One
        operation for all of them — a guest at a poolside and a guest in an auditorium are
        doing the same thing, and a separate endpoint per furniture type would be four ways
        to say the same sentence.

        **A claim is not a booking.** It attaches the guest to a location so an order can be
        routed there. Where a table visit is already open the guest joins it rather than
        starting a second, and both order onto one bill.

        Codes rotate. A static code photographed once lets someone order to a cabana they are
        not at, from outside the venue.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locationCode:
                  type: string
                  description: From the QR or NFC tag. Rotates; a stale code is refused.
                seatReference:
                  type: object
                  description: >
                    For seated venues where the seat is the address and there is no code to
                    scan. Validated against the performance's seat map.
                  properties:
                    performanceId: { type: string, format: uuid }
                    seatId: { type: string }
                partySize: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Attached, joining an open visit where one exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationSession' }
        '400':
          description: Neither a location code nor a seat reference supplied
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: >
            Code expired or unknown, the location is out of service, or no outlet currently
            delivers to it — a cabana is useless as an address if nothing serves it.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guest-orders/{orderId}/delivery:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: recordOrderHandover
      x-ticvai-consumed-by:
        - "P08 BO-021 Order Search"
      x-ticvai-audience: [staff]
      summary: Record that an order reached the guest
      description: >
        The closing state, and it differs by fulfilment: a server marks `served`, a counter
        marks `collected`, a runner marks `delivered`. 4.6.35 distinguishes all three, and so
        does this — "the guest has it" is not one event when the dispute is about which.

        Offline-capable. A runner crossing a venue loses signal, and an order that cannot be
        closed until they return is an order that reads as undelivered for ten minutes.
      tags: [guestOrdering]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, recordedAt]
              properties:
                outcome:
                  type: string
                  enum: [served, collected, delivered, guestNotFound, refused]
                deliveredToLocationId: { type: string, format: uuid }
                runnerPrincipalId: { type: string, format: uuid }
                note:
                  type: string
                  maxLength: 500
                  description: Required for guestNotFound and refused.
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestOrderStatus' }
        '409':
          description: Order is not ready, or already closed
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /table-sessions:
    post:
      operationId: claimTableSession
      x-ticvai-consumed-by:
        - "P02 GST-025 F&B – Order Tracking"
      x-ticvai-audience: [guest]
      summary: Identify which table a guest is sitting at
      description: >
        Scanning the QR code on a table. This is the step that makes ordering to a table
        possible without a server — the guest tells the platform where they are.

        **A claim is not a booking.** It attaches the guest to a table so an order can be
        routed there. Where a visit is already open — a server seated them — the guest joins
        it rather than starting a second one, and both order onto the same bill.

        The code is short-lived and rotates. A static table code photographed once lets
        someone order to a table they are not at, from outside the venue.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableCode]
              properties:
                tableCode:
                  type: string
                  description: From the table QR. Rotates; a stale code is refused.
                partySize: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Attached to the table, joining an open visit where one exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableSession' }
        '409':
          description: >
            Code expired or unknown, the outlet is closed, or the table is out of service.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guest-orders:
    post:
      operationId: createGuestFnbOrder
      x-ticvai-consumed-by:
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-032 AI Concierge – Chat"
      x-ticvai-audience: [guest]
      summary: A guest orders food
      description: >
        Order to a table, or for collection from a counter.

        **Distinct from `createFnbOrder`, which is staff-operated.** A server placing an order
        is trusted with an outlet, a table and a price. A guest is trusted with none of those:
        the outlet comes from the table session, the price is recomputed server-side and the
        quoted total is checked against it.

        Payment is required before the kitchen sees it, unless the outlet runs a tab — a
        kitchen that cooks on an unpaid guest order is a kitchen giving food away.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGuestOrderRequest' }
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestOrderResult' }
        '409':
          description: >
            An item became unavailable, the quoted total no longer matches, the table session
            expired, or the outlet stopped taking orders. The response names which.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/GuestOrderProblem' }
        '402':
          description: Payment required or declined
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guest-orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getGuestOrderStatus
      x-ticvai-consumed-by:
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-025 F&B – Order Tracking"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-034 Lost & Found"
        - "P08 BO-021 Order Search"
      x-ticvai-audience: [guest]
      summary: Track an order
      description: >
        Received, preparing, ready, served. Fed by the kitchen ticket status the KDS already
        reports, so the guest sees what the kitchen sees rather than a timer counting down
        against nothing.

        **Read from the primary.** A guest refreshing to see whether their food is ready is
        the wrong place for replica lag.
      tags: [guestOrdering]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      responses:
