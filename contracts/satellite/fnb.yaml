    post:
      operationId: createModifierGroup
      x-ticvai-audience: [staff]
      summary: Create a modifier group
      description: >
        Groups carry selection constraints — minimum, maximum, required. A burger that must
        have exactly one cooking temperature and may have up to three extras is two groups
        with different constraints, not free-text.
      tags: [modifier]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
