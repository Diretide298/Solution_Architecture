      description: >
        Every line across every order in the visit, with tax and service charge. Presentation
        only until it is split or settled.
      tags: [bill]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /table-visits/{visitId}/bill/split:
    parameters:
      - name: visitId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: splitBill
      x-ticvai-audience: [staff]
      summary: Split a bill
      description: >
        By amount, by covers, or by category (03 Aug §5). Splitting happens **at close, not
        at order time** — a split computed while the party is still ordering falls apart the
        moment someone orders another drink.

        Remainders are distributed to the minor unit. A split that does not sum to the total
        is rejected rather than rounded away.
      tags: [bill]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SplitBillRequest' }
      responses:
        '200':
          description: Split into sub-bills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillSplit' }
        '400':
          description: Split does not sum to the bill total, or a line is assigned twice
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: Visit already settled
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /table-visits/{visitId}/close:
    parameters:
      - name: visitId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: closeTableVisit
      x-ticvai-audience: [staff]
      summary: Settle and close a visit
      description: >
        Converts the visit into one or more sales orders and posts to the ledger. The table
        moves to `needsClearing`, not `free` — clearing is a separate act by a separate
        person.
      tags: [bill]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payments]
              properties:
                payments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [subBillId, tender, amount]
                    properties:
                      subBillId: { type: string }
                      tender: { type: string }
                      amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                gratuity: { $ref: '../shared/common.yaml#/components/schemas/Money' }
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema:
                type: object
                required: [visit, orderIds]
                properties:
                  visit: { $ref: '#/components/schemas/TableVisit' }
                  orderIds:
                    type: array
                    items: { type: string }
        '409':
          description: Payments do not cover the bill, or lines remain unserved
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /tables/{tableId}/clear:
    parameters:
      - name: tableId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: clearTable
      x-ticvai-audience: [staff]
      summary: Mark a table cleared and free
      tags: [table]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableState' }

  # ---------------------------------------------------------------- kitchen
  /kitchen/tickets:
    get:
      operationId: listKitchenTickets
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
        - "P08 BO-046 Kitchen Display"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Kitchen ticket queue
      description: >
        Read by the venue's KDS, or by a fallback screen where none is configured. TICVAI
        does not implement a kitchen display — this is the integration surface.
      tags: [kitchen]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: stationId
          in: query
          description: Route to a preparation station — grill, cold, bar.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/KitchenTicketStatus' }
      responses:
        '200':
          description: Tickets, priority order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KitchenTicket' }

  /kitchen/tickets/{ticketId}/status:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    put:
      operationId: setKitchenTicketStatus
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
        - "P08 BO-046 Kitchen Display"
      x-ticvai-audience: [staff]
      summary: Advance a kitchen ticket
      description: >
        Called by the KDS or a fallback screen. Status flows back to the guest app order
        tracker — received, preparing, ready, completed.
      tags: [kitchen]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, recordedAt]
              properties:
                status: { $ref: '#/components/schemas/KitchenTicketStatus' }
                lineIds:
                  type: array
                  items: { type: string }
                  description: Advance specific lines. Omit for the whole ticket.
                stationId: { type: string, format: uuid }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitchenTicket' }

  /kitchen/tickets/{ticketId}/prioritise:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: prioritiseKitchenTicket
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
        - "P08 BO-046 Kitchen Display"
      x-ticvai-audience: [staff]
      summary: Move a ticket up the queue
      description: >
        Supervisor override, and the mechanism behind Fast Pass order prioritisation
        (4.6.34). Recorded against the authorising principal — jumping the queue is an act
        someone should own.
      tags: [kitchen]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                priority: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Prioritised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitchenTicket' }

  /kitchen/stations:
    get:
      operationId: listKitchenStations
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
        - "P08 BO-046 Kitchen Display"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List preparation stations and their routing
      tags: [kitchen]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Stations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KitchenStation' }
    put:
      operationId: setKitchenStations
      x-ticvai-consumed-by:
        - "P08 BO-020 Timed Entry Rules"
        - "P08 BO-046 Kitchen Display"
      x-ticvai-audience: [staff]
      summary: Configure stations and item routing
      tags: [kitchen]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stations]
              properties:
                stations:
                  type: array
                  items: { $ref: '#/components/schemas/KitchenStation' }
      responses:
        '200':
          description: Configured
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KitchenStation' }

  # ---------------------------------------------------------------- production
  /recipes:
    get:
      operationId: listRecipes
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List recipes
      description: >
        Links menu items to inventory. A recipe is what makes stock deplete when a dish is
        sold, and what makes an item unavailable when an ingredient runs out.
      tags: [production]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Recipes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Recipe' }

    put:
      operationId: setRecipe
      x-ticvai-audience: [staff]
      summary: Define a recipe for a menu item
      tags: [production]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Recipe' }
      responses:
        '200':
          description: Set. The item becomes stock-tracked and therefore unavailable offline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recipe' }

  /outlets/{outletId}/waste:
    parameters:
      - name: outletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordWaste
      x-ticvai-consumed-by:
        - "P08 BO-044 F&B Outlets"
      x-ticvai-audience: [staff]
      summary: Record waste
      description: >
        Depletes stock without a sale. Also the ground truth for waste prediction, so the
        reason code matters more than it appears to.
      tags: [production]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, lines, reason, recordedAt]
              properties:
                id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string, format: uuid }
                      quantity: { type: number, minimum: 0 }
                      unit: { type: string }
                reason:
                  type: string
                  enum: [spoilage, preparationError, customerReturn, breakage, overProduction, expired]
                note: { type: string, maxLength: 500 }
                recordedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  totalCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }

components:
  schemas:
    TableReservationStatus:
      type: string
      enum: [booked, confirmed, seated, completed, cancelled, noShow]

    TableReservation:
      type: object
      x-ticvai-persistence: "fnb.table_reservation"
      required: [outletId, startsAt, partySize]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        outletId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        guestName: { type: string }
        contactPoint: { type: string }
        partySize: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        durationMinutes:
          type: integer
          description: >
            **How long the cover is held.** An outlet turning tables twice an evening needs this
            to be real, or the second sitting cannot be booked.
        tableIds:
          type: array
          description: >
            Usually empty until seating. **Committing a specific table at booking time refuses
            later bookings against a constraint that did not need to exist.**
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TableReservationStatus' }
        groupId:
          type: string
          format: uuid
          nullable: true
          description: 5.1.2. Several bookings managed as one party across adjacent tables.
        notes: { type: string, description: Allergies, occasion, accessibility. }
        actualPartySize: { type: integer, nullable: true, readOnly: true }
        tableVisitId: { type: string, format: uuid, nullable: true, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }

    GuestOrderingMethod:
      x-ticvai-persistence: "none — enum"
      type: string
      description: >
        How a guest may order at this outlet. Varies within one venue, so it is per outlet
        rather than a venue setting.
      enum: [tableService, appToTable, appToCollect, counterOnly, notAvailable]

    DiningOutlet:
      type: object
      x-ticvai-persistence: "none — projection over outlet, menu and table state"
      required: [outletId, name, kind, isOpenNow, orderingMethod]
      properties:
        outletId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        zone: { type: string, nullable: true }
        cuisine:
          type: array
          items: { type: string }
        isOpenNow: { type: boolean }
        opensAt: { type: string, format: date-time, nullable: true }
        closesAt: { type: string, format: date-time, nullable: true }
        orderingMethod: { $ref: '#/components/schemas/GuestOrderingMethod' }
        estimatedWaitMinutes:
          type: integer
          nullable: true
          description: >
            From current kitchen ticket volume, not a fixed figure. Null where the outlet has
            no KDS reporting — an invented wait time is worse than none.
        imageAssetRef: { type: string, nullable: true }
        menuId: { type: string, format: uuid, nullable: true }

    GuestMenu:
      type: object
      x-ticvai-persistence: "none — projection over menu, item and availability"
      required: [outletId, menuId, name, inForceUntil, sections]
      properties:
        outletId: { type: string, format: uuid }
        menuId: { type: string, format: uuid }
        name: { type: string }
        inForceUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            When this menu stops applying. The client shows it, because a guest browsing
            breakfast at 10:55 should know.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer }
        sections:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              sortOrder: { type: integer }
              items:
                type: array
                items:
                  type: object
                  required: [menuItemId, name, price, isAvailable, allergens]
                  properties:
                    menuItemId: { type: string, format: uuid }
                    name: { type: string }
                    description: { type: string, nullable: true }
                    price: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                    imageAssetRef: { type: string, nullable: true }
                    isAvailable:
                      type: boolean
                      description: >
                        Marked, not removed. A guest who saw a dish yesterday and cannot find
                        it today assumes the app is broken; "sold out" is an answer.
                    unavailableReason: { type: string, nullable: true }
                    allergens:
                      type: array
                      description: Always present. Not a field a tenant may choose to omit.
                      items: { type: string }
                    preparationMinutes: { type: integer, nullable: true }
                    modifierGroups:
                      type: array
                      items: { $ref: '#/components/schemas/ModifierGroup' }

    DeliveryLocationKind:
      type: string
      description: 4.6.26. One concept, because a runner needs one instruction.
      enum: [table, seat, cabana, sunbed, poolside, box, suite, lawn, collectionPoint, namedLocation]

    DeliveryLocation:
      type: object
      x-ticvai-persistence: "fnb.delivery_location"
      required: [id, venueId, kind, label, isServiceable]
      properties:
        id: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DeliveryLocationKind' }
        label:
          type: string
          description: What a runner is told. "Cabana 12", "Row H Seat 4", "Lawn — north gate".
        zone: { type: string, nullable: true }
        tableId:
          type: string
          format: uuid
          nullable: true
          description: Set where the location is a restaurant table, so it shares table state.
        seatId:
          type: string
          nullable: true
          description: Set where the seat is the address. References the seat map.
        servingOutletIds:
          type: array
          description: >
            Which outlets deliver here. A cabana served by the pool bar and not the
            restaurant is normal, and a location nothing serves is not an address.
          items: { type: string, format: uuid }
        isServiceable:
          type: boolean
          description: >
            False where the location exists but is not currently taking delivery — closed
            section, weather, no runner on shift.
        unserviceableReason: { type: string, nullable: true }
        walkTimeMinutes:
          type: integer
          nullable: true
          description: >
            From the serving outlet. Feeds the guest's estimate — a cabana eight minutes away
            is not the same promise as a table by the kitchen.

    LocationSession:
      type: object
      x-ticvai-persistence: "fnb.location_session"
      required: [id, locationId, kind, label, expiresAt]
      properties:
        id: { type: string }
        locationId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DeliveryLocationKind' }
        label: { type: string }
        outletId:
          type: string
          format: uuid
          nullable: true
          description: >
            The outlet serving this location. Where several serve it, the guest chooses and
            this is set on the first order.
        visitId:
          type: string
          nullable: true
          description: >
            The table visit this session orders onto, where the location is a table. Absent
            for a cabana or a seat, which have no visit concept — the order stands alone.
        joinedExistingVisit: { type: boolean }
        subjectId: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: >
            Sessions expire so a guest who leaves cannot order to a lounger now occupied by
            someone else.

    TableSession:
      type: object
      x-ticvai-persistence: "fnb.table_session"
      required: [id, outletId, tableId, tableLabel, visitId, expiresAt]
      properties:
        id: { type: string }
        outletId: { type: string, format: uuid }
        outletName: { type: string }
        tableId: { type: string, format: uuid }
        tableLabel: { type: string }
        visitId:
          type: string
          description: >
            The table visit this session orders onto. An existing open visit is joined rather
            than duplicated — a guest seated by a server and then ordering by app is one
            party, one bill.
        joinedExistingVisit: { type: boolean }
        subjectId: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: >
            Sessions expire so a guest who leaves cannot order to a table now occupied by
            someone else.

    CreateGuestOrderLine:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, menuItemId, quantity]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        menuItemId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        modifierOptionIds:
          type: array
          items: { type: string, format: uuid }
        note:
          type: string
          maxLength: 200
          description: >
            Free text to the kitchen. Allergy notes belong here and are surfaced prominently
            on the ticket.

    CreateGuestOrderRequest:
      type: object
      required: [id, lines, quotedTotal, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        locationSessionId:
          type: string
          nullable: true
          description: >
            Where the order is going. Required for delivery to a table, seat, cabana or named
            location. Absent for collection, where the outlet is named instead.
        outletId:
          type: string
          format: uuid
          nullable: true
          description: Required for collection. Ignored where a table session is supplied.
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateGuestOrderLine' }
        quotedTotal:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            What the guest was shown. Checked against the server's recomputation — a guest is
            never trusted with a price, and a mismatch is refused rather than silently
            corrected in either direction.
        paymentMethod:
          type: string
          enum: [card, wallet, roomCharge, addToTab]
        recordedAt: { type: string, format: date-time }

    GuestOrderResult:
      type: object
      x-ticvai-persistence: "none — projection over fnb_order"
      required: [orderId, orderNumber, status, total]
      properties:
        orderId: { type: string }
        orderNumber:
          type: string
          description: Short and readable. It gets called out across a counter.
        fulfilment:
          type: string
          enum: [collect, deliverToLocation, tableService]
        deliveryLabel:
          type: string
          nullable: true
          description: Where it is going, as a runner would read it.
        status: { $ref: '#/components/schemas/FnbOrderStatus' }
        total: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        estimatedReadyAt: { type: string, format: date-time, nullable: true }
        collectionPoint: { type: string, nullable: true }
        tableLabel: { type: string, nullable: true }

    GuestOrderStatus:
      type: object
      x-ticvai-persistence: "none — projection over kitchen_ticket"
      required: [orderId, status, lines]
      properties:
        orderId: { type: string }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/FnbOrderStatus' }
        estimatedReadyAt: { type: string, format: date-time, nullable: true }
        isReadyForCollection: { type: boolean }
        lines:
          type: array
          description: Per-line status. A guest waiting on one dish should see which.
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: integer }
              status: { $ref: '#/components/schemas/KitchenTicketStatus' }

    GuestOrderProblem:
      allOf:
