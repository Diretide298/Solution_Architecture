        isSchemaBehind: { type: boolean }
        databaseStatus: { type: string }
        replicationLagSeconds: { type: number, nullable: true }
        lastBackupAt: { type: string, format: date-time, nullable: true }
        lastRestoreDrillAt: { type: string, format: date-time, nullable: true }
        checkedAt: { type: string, format: date-time }

    CellJob:
      x-ticvai-persistence: "control.cell_job"
      type: object
      required: [id, cellId, kind, status, createdAt]
      properties:
