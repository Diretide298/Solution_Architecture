          items:
            type: object
            required: [moduleKey, source]
            properties:
              moduleKey: { type: string }
              displayName: { type: string }
              source:
                type: string
                enum: [plan, addOn]
              validTo: { type: string, format: date, nullable: true }
        limits:
          type: array
          items: { $ref: '#/components/schemas/EntitlementLimit' }

    UsageMetric:
      type: string
      enum:
        - venues
        - workstations
        - activeUsers
        - devices
        - brandedApps
        - aiTokens
        - apiCalls
        - storageGb
        - transactions
        - guestProfiles

    EntitlementUsage:
      x-ticvai-persistence: "none — aggregated from usage_record"
      type: object
      required: [tenantId, metrics]
      properties:
        tenantId: { type: string, format: uuid }
        metrics:
          type: array
          items:
            type: object
            required: [metric, current, isNearLimit]
            properties:
              metric: { $ref: '#/components/schemas/UsageMetric' }
              current: { type: integer }
              limit: { type: integer, nullable: true }
              percentUsed: { type: number, nullable: true }
              isNearLimit:
                type: boolean
                description: >
                  Approaching a limit is an account conversation. Hitting one silently at a
                  gate is an incident.
              isExceeded: { type: boolean }
        asAt: { type: string, format: date-time }

    ProvisionCellRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [regionId, countryCode, tier]
      properties:
        regionId: { type: string, format: uuid }
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: >
            Determines the jurisdiction. Placement must be within it — this is enforced, not
            trusted.
        tier: { $ref: '#/components/schemas/CellTier' }
        cloudProvider: { type: string }
        cloudRegion: { type: string }
        clientHostedEndpoint:
          type: string
          nullable: true
          description: Required for `clientHosted`, where no in-region cloud exists.

    Cell:
      x-ticvai-persistence: "control.cell"
      type: object
      required: [id, name, tenantId, regionId, countryCode, tier, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: >
            Null on a shared cell, which holds many. Nullable since the ADR-0014 amendment of
            14 August — it was required when a cell meant one tenant.
        kind: { $ref: '#/components/schemas/CellKind' }
        clusterId: { type: string, format: uuid, nullable: true }
        isReachable:
          type: boolean
          default: true
          description: >
            False for `onPremise`. The Control Plane holds the record for licensing and support
            and **cannot reach the installation** — it may sit behind a firewall with no inbound
            route. Every operation assuming reachability must handle absence rather than timing
            out, and a cell that has not called home for a month is not necessarily broken.
        lastContactAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the site last called out. The only liveness signal for an unreachable cell,
            and the number a support engineer asks for first.
        licenceExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            On-premise only. Licensing cannot be enforced by a Control Plane the site cannot
            reach, so a signed licence file is verified locally. **An expired licence degrades
            rather than stops** — a venue whose gates refuse entry because a licence lapsed
            over a weekend is worse than one running unlicensed until Monday.
        participatesInCrossCell:
          type: boolean
          default: true
          description: >
            False by default for `onPremise`. Redeeming a pass issued elsewhere requires
            reaching the issuing cell at that moment, and an on-premise site may not be able
            to. Exclusion is the honest default; local-then-reconcile carries a
            double-redemption risk that needs a decision rather than an assumption.
        regionId: { type: string, format: uuid }
        regionName: { type: string }
        countryCode: { type: string }
        tier: { $ref: '#/components/schemas/CellTier' }
        status: { $ref: '#/components/schemas/CellStatus' }
        cloudProvider: { type: string, nullable: true }
        cloudRegion: { type: string, nullable: true }
        apiEndpoint: { type: string, nullable: true }
        venueCount: { type: integer }
        provisionedAt: { type: string, format: date-time, nullable: true }

    CellDetail:
      x-ticvai-persistence: "control.cell"
      allOf:
        - $ref: '#/components/schemas/Cell'
