      required: [tenantId, planId, planVersion, status, startsAt]
      properties:
        tenantId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        planName: { type: string }
        planVersion: { type: string }
        status:
          type: string
          enum: [trial, active, pastDue, cancelled, expired]
        startsAt: { type: string, format: date }
        renewsAt: { type: string, format: date, nullable: true }
        cancelledAt: { type: string, format: date, nullable: true }
        currentPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        billingPeriod: { type: string }

    DowngradeConflictProblem:
      x-ticvai-persistence: "none — error shape"
