      required: [canApply, priceChange]
      properties:
        canApply: { type: boolean }
        priceChange: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        proratedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        modulesGained:
          type: array
          items: { type: string }
        modulesLost:
          type: array
          items: { type: string }
        conflicts: { $ref: '#/components/schemas/DowngradeConflictProblem' }
        cellTierChange:
          type: object
          nullable: true
          properties:
            from: { $ref: '#/components/schemas/CellTier' }
            to: { $ref: '#/components/schemas/CellTier' }
