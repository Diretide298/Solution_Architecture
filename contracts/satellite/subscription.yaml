          properties:
            health: { $ref: '#/components/schemas/CellHealth' }
            activeJobs:
              type: array
              items: { $ref: '#/components/schemas/CellJob' }

    CellKind:
      type: string
      description: >
        Four deployment models (ADR-0017). `shared` is the default; the others exist because a
        client asked or a law requires it.
      enum:
        - shared       # TICVAI infrastructure, UAE. Many tenants, isolated by RLS. The default
        - dedicated    # TICVAI infrastructure, own database and cluster. What the extra cost buys
        - onPremise    # the venue's own hardware. Nothing leaves the site, and TICVAI cannot reach it
        - controlPlane

    CellCapacity:
      type: object
      x-ticvai-persistence: "none — measured, not stored"
      required: [cellId, isConstrained, dimensions, measuredAt]
      properties:
        cellId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CellKind' }
        tenantCount:
          type: integer
          description: >
            Reported, and **deliberately not the sizing signal.** Forty quiet tenants may load
            a cell less than three busy ones.
        isConstrained: { type: boolean }
        constrainedDimension: { type: string, nullable: true }
        dimensions:
          type: array
          description: >
            Per dimension, because the response differs. Short of connections and long on
            storage is a different problem from short of both.
          items:
            type: object
            required: [dimension, used, headroom]
            properties:
              dimension:
                type: string
                enum:
                  - concurrentUsers
                  - transactionsPerSecond
                  - scansPerSecond
                  - databaseConnections
                  - storageGb
                  - replicationLag
                  - cpu
              used: { type: number }
              limit: { type: number }
              headroom:
                type: number
                description: Fraction remaining. Negative means already over.
              peakAt: { type: string, format: date-time, nullable: true }
        forecastBreachAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the constrained dimension is projected to run out at the current trend. Null
            where there is no trend to project — an honest null beats an invented date.
        measuredAt: { type: string, format: date-time }

    CellCluster:
      type: object
      x-ticvai-persistence: "control.cell_cluster"
      required: [id, regionId, kind, cellIds, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        regionId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/CellKind' }
        cellIds:
          type: array
          items: { type: string, format: uuid }
        schemaVersion:
          type: string
          description: >
            Every cell in a cluster runs the same version. A cluster at mixed versions is not
            capacity, it is two things to maintain.
        modelledOnCellId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [provisioning, active, draining, retired]
        acceptingNewTenants:
          type: boolean
          description: >
            False on a cluster being drained, or one held back as headroom for a known event.
        tenantCount: { type: integer }
        provisionedAt: { type: string, format: date-time }

    TenantMigrationStatus:
      type: string
      enum: [planned, copying, verifying, awaitingCutover, cuttingOver, complete, failed, rolledBack]

    TenantMigrationPlan:
      type: object
      x-ticvai-persistence: "control.tenant_migration_plan"
      required: [id, tenantId, fromCellId, toCellId, canProceed, computedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        fromCellId: { type: string, format: uuid }
        toCellId: { type: string, format: uuid }
        fromKind: { $ref: '#/components/schemas/CellKind' }
        toKind: { $ref: '#/components/schemas/CellKind' }
        canProceed: { type: boolean }
        blockers:
          type: array
          items:
            type: object
            properties:
              blocker:
                type: string
                enum:
                  - regionMismatch
                  - schemaVersionMismatch
                  - openShifts
                  - migrationInFlight
                  - targetNotAcceptingTenants
                  - crossCellLinksUnresolvable
              detail: { type: string }
        rowCounts:
          type: object
          additionalProperties: { type: integer }
        estimatedCopyMinutes: { type: integer }
        estimatedCutoverSeconds:
          type: integer
          description: >
            How long the tenant is unavailable. The number the client asks about, and the only
            one they will remember.
        crossCellLinksToRepoint:
          type: integer
          description: >
            Entitlements redeemable in another region hold a link that must be re-pointed
            rather than copied. Copying leaves two cells claiming the same guest.
        computedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    TenantMigration:
      type: object
      x-ticvai-persistence: "control.tenant_migration"
      required: [id, planId, tenantId, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        fromCellId: { type: string, format: uuid }
        toCellId: { type: string, format: uuid }
        reason: { type: string }
        status: { $ref: '#/components/schemas/TenantMigrationStatus' }
        rowsCopied: { type: integer }
        rowsExpected: { type: integer }
        verificationPassed: { type: boolean, nullable: true }
        cutoverAt: { type: string, format: date-time, nullable: true }
        sourceRetainedUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            The source is retained, not dropped. A cutover that goes wrong needs somewhere to
