openapi: 3.1.0
info:
  title: TICVAI Catalogue & Entitlement
  version: 0.1.0
  x-ticvai-screen-count: 8
  x-ticvai-tier: spine
  x-ticvai-module: "1 — Ticketing Catalogue"
  x-ticvai-requirements: 312
  x-ticvai-capabilities: [C20, C79, C80, C81, C84, C85, C102, C103, C104]
  x-ticvai-platforms:
    - "P08 Venue Back Office"
    - "P04 POS"
    - "P01 Guest Web"
    - "P02 Guest App"
    - "P03 Kiosk"
    - "P10 Partner Portal"
  description: >
    ## What this contract covers

    **Defines what can be sold and what it grants.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 1 — Ticketing Catalogue |
    | **Requirements** | ~312 |
    | **Capabilities** | C20, C79, C80, C81, C84, C85, C102, C103, C104 |
    | **Consumed by** | P08 Venue Back Office · P04 POS · P01 Guest Web · P02 Guest App · P03 Kiosk · P10 Partner Portal |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Products, pricing, events, capacity — and the two mechanisms local-first point of sale
    depends on: signed catalogue bundles and inventory leases.

    Positions this encodes:

    - Point of sale reads the catalogue from a local bundle, always (ADR-0013). The
      endpoints here that a terminal calls are bundle pull and lease acquisition. It does
      NOT call product or price endpoints on the transaction path.
    - Contended inventory uses leases, not replication. A terminal holds N units for a TTL
      and refuses the sale on exhaustion rather than overselling.
    - Seated inventory is blocked offline. A seat map is not a count.
    - Adding an attribute value generates sellable variants. The variant table is
      materialised, not computed at read time.
    - Identity and entitlement are separate. Ticket ID and Media Code are different things.

    DEFERRED from this version: product lifecycle and approval (C79), ticket resale
    marketplace (C80, no MoM coverage), portfolio management (C81), alternative codes for
    third-party systems.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: product
  - name: entitlement
  - name: pricing
  - name: event
  - name: capacity
  - name: bundle
  - name: lease
  - name: entitlement

paths:
  # ---------------------------------------------------------------- products
  /products:
    get:
      operationId: listProducts
      x-ticvai-consumed-by:
        - "P01 WEB-001 Home / Landing"
        - "P01 WEB-002 Event & Attraction Listing"
        - "P10 PTR-006 Product Catalog (B2B Pricing)"
      x-ticvai-read-routing: replica
      summary: List products
      description: >
        Back-office use. **A terminal does not call this** — it reads the local bundle.
      tags: [product]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ProductKind' }
        - name: isSellable
          in: query
          schema: { type: boolean }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createProduct
      summary: Create a product
      tags: [product]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Created. Not sellable until published in a bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getProduct
      x-ticvai-consumed-by:
        - "P01 WEB-004 Event / Attraction Detail"
      x-ticvai-read-routing: replica
      summary: Read a product
      tags: [product]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateProduct
      summary: Update a product
      tags: [product]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200':
          description: Updated. Terminals see it after the next bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /products/{productId}/attributes:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setProductAttributes
      summary: Set the attribute axes for a product
      description: >
        Attributes are axes that generate sellable variants. Changing them triggers variant
        regeneration; the response reports how many variants result.

        Variants are **materialised**, not computed at read time — a static product table
        cannot express the combinations, and runtime expansion makes pricing queries
        unusable at catalogue scale.
      tags: [product]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [axes]
              properties:
                axes:
                  type: array
                  items: { $ref: '#/components/schemas/AttributeAxis' }
      responses:
        '200':
          description: Axes set, variants regenerated
          content:
            application/json:
              schema:
                type: object
                required: [variantCount, addedCount, retiredCount]
                properties:
                  variantCount: { type: integer }
                  addedCount: { type: integer }
                  retiredCount:
                    type: integer
                    description: >
                      Variants no longer reachable. Retired, never deleted — historic orders
                      reference them.
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            Regeneration would exceed the configured variant ceiling for this product.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /products/{productId}/variants:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProductVariants
      x-ticvai-consumed-by:
        - "P01 WEB-005 Ticket Type Selection"
      x-ticvai-read-routing: replica
      summary: List generated variants
      tags: [product]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Variants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductVariant' }

  # ---------------------------------------------------------------- pricing
  /price-lists:
    get:
      operationId: listPriceLists
      x-ticvai-read-routing: replica
      summary: List price lists
      tags: [pricing]
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/Channel' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Price lists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PriceList' }
    post:
      operationId: createPriceList
      summary: Create a price list
      tags: [pricing]
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePriceListRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }

  /price-lists/{priceListId}/prices:
    parameters:
      - name: priceListId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPrices
      x-ticvai-read-routing: replica
      summary: List prices in a list
      tags: [pricing]
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Prices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Price' }
    put:
      operationId: setPrices
      summary: Set prices in bulk
      description: >
        Currency must match the region's currency and scale. A price in a currency the
        region does not use is rejected — money carries its scale, and a mismatched scale
        silently truncates.
      tags: [pricing]
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/SetPriceRequest' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer }
        '400':
          description: Currency or scale mismatch against the region
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- events
  /events:
    get:
      operationId: listEvents
      x-ticvai-consumed-by:
        - "P01 WEB-002 Event & Attraction Listing"
      x-ticvai-read-routing: replica
      summary: List events
      tags: [event]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Event' }
    post:
      operationId: createEvent
      summary: Create an event
      tags: [event]
      x-ticvai-permission: EVENT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /events/{eventId}/performances:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPerformances
      x-ticvai-consumed-by:
        - "P01 WEB-004 Event / Attraction Detail"
      x-ticvai-read-routing: replica
      summary: List performances of an event
      tags: [event]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Performances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Performance' }
    post:
      operationId: createPerformances
      summary: Create performances, singly or by schedule
      tags: [event]
      x-ticvai-permission: PERFORMANCE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePerformancesRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  performances:
                    type: array
                    items: { $ref: '#/components/schemas/Performance' }

  # ---------------------------------------------------------------- capacity
  /envelopes:
    get:
      operationId: listEnvelopes
      x-ticvai-read-routing: replica
      summary: List capacity envelopes
      tags: [capacity]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: performanceId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Envelopes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Envelope' }
    post:
      operationId: createEnvelope
      summary: Create a capacity envelope
      tags: [capacity]
      x-ticvai-permission: CAPACITY_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnvelopeRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /envelopes/{envelopeId}/channel-allocations:
    parameters:
      - name: envelopeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getChannelAllocations
      x-ticvai-consumed-by:
        - "P10 PTR-005 Inventory & Allocation View"
      x-ticvai-read-routing: primary
      summary: Capacity allocated to each channel
      description: >
        How much of an envelope each selling channel may take. Revenue management sets this;
        a lease draws from it.

        Allocation is the commercial concern, a lease is the technical one, and they compose:
        a lease is granted against a channel's remaining allocation rather than against raw
        envelope capacity. Web cannot consume the counter's allocation, and an offline
        terminal cannot oversell a channel it was never given.
      tags: [capacity]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Allocations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelAllocationSet' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    put:
      operationId: setChannelAllocations
      summary: Allocate envelope capacity across channels
      description: >
        Allocations may not exceed envelope capacity in total. An unallocated remainder forms
        a general pool any channel may draw from once its own allocation is exhausted.

        Reducing an allocation below what a channel has already sold is refused — the seats
        are gone.
      tags: [capacity]
      x-ticvai-permission: CAPACITY_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocations]
              properties:
                allocations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ChannelAllocation' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelAllocationSet' }
        '400':
          description: Allocations exceed envelope capacity
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: An allocation is below what that channel has already sold
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /envelopes/{envelopeId}/channel-allocations/release:
    parameters:
      - name: envelopeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: releaseChannelAllocation
      summary: Return unsold channel allocation to the general pool
      description: >
        The standard mechanism for freeing distribution holds close to a performance. May be
        scheduled on the allocation itself, or triggered manually.
      tags: [capacity]
      x-ticvai-permission: CAPACITY_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Channel' }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Released to the general pool
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelAllocationSet' }

  # ---------------------------------------------------------------- bundles
  /catalogue/bundles:
    get:
      operationId: listCatalogueBundles
      x-ticvai-read-routing: replica
      summary: List published bundles
      tags: [bundle]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Bundles, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BundleSummary' }
    post:
      operationId: publishBundle
      summary: Compute, sign and publish a catalogue bundle
      description: >
        Snapshots current catalogue state for a venue, signs it, and publishes it for
        terminals to pull.

        Publishing is the act that makes a configuration change visible at point of sale.
        Until a bundle is published, an edited price exists only in the back office.
      tags: [bundle]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId]
              properties:
                venueId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
                staleAfterHours:
                  type: integer
                  minimum: 1
                  description: >
                    How long a terminal may trade on this bundle before refusing. Defaults
                    to the venue's configured bound. A terminal offline for a week must not
                    sell last month's prices.
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BundleSummary' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: A publish is already in progress for this venue
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /catalogue/bundles/latest:
    get:
      operationId: getLatestBundle
      x-ticvai-read-routing: replica
      summary: Pull the current bundle for this workstation's venue
      description: >
        The primary terminal-facing endpoint. Returns the full bundle, or 304 when the
        supplied ETag matches.

        Use `since` to request a delta instead of a full bundle — a terminal on a slow link
        should not re-download an unchanged catalogue.
      tags: [bundle]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: since
          in: query
          description: Applied bundle version. When supplied and a delta exists, a delta is returned.
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Full bundle or delta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueBundle' }
          headers:
            ETag:
              schema: { type: string }
        '304':
          description: Unchanged
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /catalogue/bundles/{version}/applied:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: reportBundleApplied
      summary: Report that a workstation applied a bundle
      description: >
        Lets the back office see which terminals are current and which are drifting toward
        their staleness bound. A terminal that stops reporting is a terminal about to refuse
        to trade.
      tags: [bundle]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appliedAt, outcome]
              properties:
                appliedAt: { type: string, format: date-time }
                outcome:
                  type: string
                  enum: [applied, rolledBack, signatureInvalid]
                error: { type: string }
      responses:
        '204': { description: Recorded }

  # ---------------------------------------------------------------- leases
  /leases:
    get:
      operationId: listLeases
      x-ticvai-read-routing: primary   # a stale lease list oversells contended capacity
      summary: List leases
      description: >
        Back-office monitoring. Surfaces stranded leases — capacity held by a terminal that
        died and will not return it until TTL expiry. At a gate during peak that is visible
        to a queue.
      tags: [lease]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: envelopeId
          in: query
          schema: { type: string, format: uuid }
        - name: holderWorkstationId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeaseStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Leases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Lease' }

    post:
      operationId: acquireLease
      summary: Acquire an inventory lease
      description: >
        Grants the caller N units of a capacity envelope for a TTL. The holder may sell
        against them without further server contact, including offline.

        Unsold units return automatically on expiry. Requesting more than remains returns a
        partial grant — the caller decides whether that is enough.

        A `venueEdge` workstation acquires through its edge node, which holds the venue
        lease and sub-leases to terminals.
      tags: [lease]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquireLeaseRequest' }
      responses:
        '201':
          description: >
            Granted, wholly or partially. Always check `grantedUnits` against `requestedUnits`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            No units remain, or the envelope is seated — seated inventory cannot be leased
            because a seat map is not a count.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /leases/{leaseId}:
    parameters:
      - name: leaseId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    delete:
      operationId: releaseLease
      summary: Return unsold units
      description: >
        Consumed units are reported and retained; the remainder returns to the pool
        immediately rather than waiting for TTL expiry.
      tags: [lease]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumedUnits]
              properties:
                consumedUnits: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /leases/{leaseId}/renew:
    parameters:
      - name: leaseId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: renewLease
      summary: Extend a lease TTL
      description: >
        Reports consumption so far and extends the hold. A holder renews while the link is
        up; if the link drops, the lease expires naturally and the units return.
      tags: [lease]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumedUnits]
              properties:
                consumedUnits: { type: integer, minimum: 0 }
                additionalUnits:
                  type: integer
                  minimum: 0
                  description: Request more on top of the existing hold.
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '409':
          description: Lease already expired. Acquire a new one.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /leases/{leaseId}/force-release:
    parameters:
      - name: leaseId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: forceReleaseLease
      summary: Reclaim a stranded lease
      description: >
        Supervisor action for a lease held by a terminal that has died. Reported consumption
        is honoured; the remainder returns immediately.

        Exists because TTL expiry alone can strand capacity for minutes in front of a queue.
      tags: [lease]
      x-ticvai-permission: CAPACITY_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Reclaimed and audited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- availability
  /availability:
    get:
      operationId: getAvailability
      x-ticvai-consumed-by:
        - "P01 WEB-006 Date & Session Selection"
        - "P10 PTR-007 Availability Search"
      x-ticvai-read-routing: primary
      summary: Live remaining capacity
      description: >
        Display only. A terminal shows this to a guest but does not decide a sale on it —
        that is what leases are for. Under load this value is already stale by the time it
        renders.
      tags: [capacity]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: performanceId
          in: query
          schema: { type: string, format: uuid }
        - name: envelopeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [envelopeId, capacity, sold, leased, remaining]
                  properties:
                    envelopeId: { type: string, format: uuid }
                    capacity: { type: integer }
                    sold: { type: integer }
                    leased:
                      type: integer
                      description: Held by terminals but not yet sold.
                    remaining: { type: integer }
                    byChannel:
                      type: array
                      description: >
                        Per-channel position. A guest seeing sold out online while units
                        remain at the counter is correct behaviour, not a defect.
                      items:
                        type: object
                        properties:
                          channel: { $ref: '#/components/schemas/Channel' }
                          allocated: { type: integer }
                          sold: { type: integer }
                          remaining: { type: integer }

  /products/{productId}/lifecycle:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transitionProductLifecycle
      summary: Move a product through its lifecycle
      description: >
        Draft → review → approved → live → withdrawn → archived.

        **Approval is separate from publication.** An approved product is not sellable until
        a bundle carries it, which is why the two are different acts with different
        permissions — a product manager approves, an operator publishes.

        Withdrawal stops new sales and leaves existing entitlements intact. Archiving is
        refused while entitlements remain unexpired.
      tags: [product]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transition, reason]
              properties:
                transition:
                  type: string
                  enum: [submitForReview, approve, reject, publish, withdraw, archive, restore]
                reason: { type: string, minLength: 3, maxLength: 500 }
                effectiveAt: { type: string, format: date-time }
      responses:
        '200':
          description: Transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403':
          description: >
            Approval attempted by the principal who submitted it. Segregation applies here as
            it does to journals.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: >
            Transition not valid from the current state, or archiving attempted while
            unexpired entitlements exist.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /products/{productId}/alternative-codes:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAlternativeCodes
      x-ticvai-read-routing: replica
      summary: External identifiers for a product
      description: >
        Partners and distributors use their own SKUs. Mapping them here means an inbound
        order can be matched without asking a partner to change their catalogue.
      tags: [product]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Codes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlternativeCode' }

    put:
      operationId: setAlternativeCodes
      summary: Set external identifiers
      tags: [product]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes:
                  type: array
                  items: { $ref: '#/components/schemas/AlternativeCode' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlternativeCode' }
        '409':
          description: Code already mapped to a different product for that partner
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /products/resolve:
    get:
      operationId: resolveProductByCode
      x-ticvai-read-routing: replica
      summary: Resolve a partner code to a product
      description: >
        Called on inbound distribution orders. Accepts a partner's own SKU and returns the
        variant it maps to.
      tags: [product]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: partnerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductVariant' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /price-lists/{priceListId}:
    parameters:
      - name: priceListId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPriceList
      x-ticvai-consumed-by:
        - "P10 PTR-006 Product Catalog (B2B Pricing)"
      x-ticvai-read-routing: replica
      summary: Read a price list
      tags: [pricing]
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Price list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updatePriceList
      summary: Amend a price list
      description: >
        Currency and scale are immutable once prices exist. Changing them would silently
        reinterpret every price in the list.
      tags: [pricing]
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                validFrom: { type: string, format: date-time }
                validTo: { type: string, format: date-time }
                priority: { type: integer }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '409':
          description: Currency or scale change attempted after prices exist
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /price-lists/{priceListId}/copy:
    parameters:
      - name: priceListId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: copyPriceList
      summary: Copy a price list, optionally with an adjustment
      description: >
        Next season's prices from this season's, uplifted by a percentage. The alternative is
        editing thousands of prices by hand, which is how a decimal point goes missing.
      tags: [pricing]
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 200 }
                adjustmentPercent:
                  type: number
                  description: Applied to every copied price. Negative reduces.
                roundTo:
                  type: number
                  description: Round adjusted prices to this increment, e.g. 0.5 or 5.
                validFrom: { type: string, format: date-time }
                validTo: { type: string, format: date-time }
      responses:
        '201':
          description: Copied
          content:
            application/json:
              schema:
                type: object
                properties:
                  priceList: { $ref: '#/components/schemas/PriceList' }
                  copiedPriceCount: { type: integer }

  /events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEvent
      x-ticvai-read-routing: replica
      summary: Read an event
      tags: [event]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateEvent
      summary: Amend an event
      tags: [event]
      x-ticvai-permission: EVENT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                parentEventId: { type: string, format: uuid, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /performances/{performanceId}:
    parameters:
      - name: performanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPerformance
      x-ticvai-read-routing: replica
      summary: Read a performance
      tags: [event]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Performance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updatePerformance
      summary: Amend a performance
      description: >
        Moving a performance that has sold tickets is refused. Use cancellation, which
        notifies holders and refunds them — silently relocating a guest's booking is not a
        change, it is a surprise.
      tags: [event]
      x-ticvai-permission: PERFORMANCE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                status: { type: string, enum: [scheduled, onSale, suspended] }
                admissionProfileId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
        '409':
          description: Timing change attempted on a performance with sold tickets
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /performances/{performanceId}/cancel:
    parameters:
      - name: performanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelPerformance
      summary: Cancel a performance
      description: >
        Stops sales, notifies every holder, and queues a bulk refund for approval. The refund
        is **not** issued automatically — a cancellation of any size is a financial event
        someone signs off.

        Returns the exposure before committing so the person cancelling sees what it costs.
      tags: [event]
      x-ticvai-permission: PERFORMANCE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 1000 }
                guestMessage:
                  type: object
                  additionalProperties: { type: string }
                refundPercentage: { type: number, minimum: 0, maximum: 100, default: 100 }
                offerAlternativePerformanceId: { type: string, format: uuid }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: Cancelled, or exposure reported when dry run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceCancellationResult' }

  /envelopes/{envelopeId}:
    parameters:
      - name: envelopeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateEnvelope
      summary: Amend an envelope
      description: >
        Capacity may be increased freely. Reducing it below what has already sold is refused —
        the seats are gone, and pretending otherwise oversells the next guest.
      tags: [capacity]
      x-ticvai-permission: CAPACITY_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                capacity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: Capacity reduced below units already sold
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /entitlement-templates:
    get:
      operationId: listEntitlementTemplates
      x-ticvai-read-routing: replica
      summary: List entitlement templates
      description: >
        What a product grants — validity window, entry count, re-entry, admission profile,
        transferability. Separate from the product, because several products may grant the
        same right at different prices.
      tags: [entitlement]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntitlementTemplate' }

    post:
      operationId: createEntitlementTemplate
      summary: Create an entitlement template
      tags: [entitlement]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntitlementTemplate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementTemplate' }

  /entitlements/{entitlementId}/suspend:
    parameters:
      - name: entitlementId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: suspendEntitlement
      summary: Suspend or reinstate an entitlement
      description: >
        Fraud, a chargeback, a behavioural ban. Denies at the gate with a stated reason rather
        than a generic failure, so an operator facing the guest knows what to say.

        Suspension is reversible; it does not revoke.
      tags: [entitlement]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isSuspended, reason]
              properties:
                isSuspended: { type: boolean }
                reason: { type: string, minLength: 3, maxLength: 500 }
                denyMessage:
                  type: string
                  maxLength: 200
                  description: Shown to the operator at the gate.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlementId: { type: string }
                  isSuspended: { type: boolean }
                  propagatedToCells:
                    type: array
                    description: Cross-cell rights revoked alongside (ADR-0010).
                    items: { type: string }

components:
  schemas:
    ProductLifecycleState:
      type: string
      enum: [draft, inReview, approved, live, withdrawn, archived]

    AlternativeCode:
      x-ticvai-persistence: "catalogue.alternative_code"
      type: object
      required: [code, partnerId]
      properties:
        code: { type: string, maxLength: 128 }
        partnerId: { type: string, format: uuid }
        partnerName: { type: string }
        variantId: { type: string, format: uuid }
        note: { type: string, maxLength: 200 }

    PerformanceCancellationResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [performanceId, dryRun, affectedOrders, refundExposure]
      properties:
        performanceId: { type: string, format: uuid }
        dryRun: { type: boolean }
        affectedOrders: { type: integer }
        affectedGuests: { type: integer }
        refundExposure:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            What the cancellation costs. Returned before committing, so the person cancelling
            sees the number at the moment they decide.
        bulkRefundBatchId:
          type: string
          nullable: true
          description: Queued for approval. Refunds are not issued automatically.
        notificationsQueued: { type: integer }

    EntitlementTemplate:
      x-ticvai-persistence: "catalogue.entitlement_template"
      type: object
      required: [id, code, name, validityKind]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        validityKind:
          type: string
          enum: [singleUse, dated, dateRange, rolling, unlimited, countLimited]
        validFromOffsetDays: { type: integer, nullable: true }
        validForDays: { type: integer, nullable: true }
        entriesAllowed:
          type: integer
          nullable: true
          description: Null means unlimited. The Fast Pass consumption counter lives here.
        reentryAllowed: { type: boolean, default: false }
        admissionProfileId: { type: string, format: uuid, nullable: true }
        isTransferable: { type: boolean, default: true }
        isNameBound:
          type: boolean
          default: false
          description: >
            True requires a holder name at sale. Most entitlements carry none — identity and
            entitlement are separate concerns.
        crossesCells:
          type: boolean
          default: false
          description: >
            True propagates a redemption right to other cells on issue (ADR-0010).
        isActive: { type: boolean }

    ProductKind:
      type: string
      enum: [admission, timedAdmission, datedAdmission, seated, membership, bundle, fnb, retail, rental, addOn, giftCard]

    Channel:
      type: string
      enum: [pos, kiosk, web, mobile, b2b, ota, callCentre]

    Product:
      x-ticvai-persistence: "catalogue.product"
      type: object
      required: [id, code, name, kind, venueId, scopePath, isSellable, hasVariants]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        lifecycleState: { $ref: '#/components/schemas/ProductLifecycleState' }
        isSellable:
          type: boolean
          description: >
            True only when live **and** carried by a published bundle. Approval and
            publication are different acts.
        hasVariants: { type: boolean }
        variantCount: { type: integer }
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        entitlementTemplateId:
          type: string
          format: uuid
          nullable: true
          description: >
            What the buyer receives. Null for products that grant nothing — F&B and retail.
            Identity and entitlement are separate concerns.
        blockedOffline:
          type: boolean
          description: >
            True for seated and retail. Seated because a seat map is not a count; retail
            because stock depletes in real time.
        dataMaskValues:
          type: object
          additionalProperties: true
          description: Custom fields. JSONB-backed, defined by the venue's data mask.

    CreateProductRequest:
      type: object
      required: [code, name, kind, venueId]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        kind: { $ref: '#/components/schemas/ProductKind' }
        venueId: { type: string, format: uuid }
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        entitlementTemplateId: { type: string, format: uuid }
        dataMaskValues:
          type: object
          additionalProperties: true

    UpdateProductRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        isSellable: { type: boolean }
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        dataMaskValues:
          type: object
          additionalProperties: true

    AttributeAxis:
      x-ticvai-persistence: "catalogue.attribute_axis"
      type: object
      required: [code, name, values]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        values:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string, maxLength: 64 }
              label: { type: string, maxLength: 200 }
              priceDelta: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    ProductVariant:
      x-ticvai-persistence: "catalogue.variant"
      type: object
      required: [id, productId, sku, axisValues, isActive]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        sku: { type: string }
        axisValues:
          type: object
          additionalProperties: { type: string }
        isActive:
          type: boolean
          description: False when retired. Retired variants are never deleted — orders reference them.

    PriceList:
      x-ticvai-persistence: "catalogue.price_list"
      type: object
      required: [id, code, name, venueId, currency, currencyScale, channels]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer, minimum: 0, maximum: 4 }
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        priority:
          type: integer
          description: Where lists overlap, higher priority wins.

    CreatePriceListRequest:
      type: object
      required: [code, name, venueId, channels]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        channels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Channel' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        priority: { type: integer, default: 0 }

    Price:
      x-ticvai-persistence: "catalogue.price"
      type: object
      required: [priceListId, variantId, amount]
      properties:
        priceListId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxCodeId: { type: string, format: uuid, nullable: true }

    SetPriceRequest:
      type: object
      required: [variantId, amount]
      properties:
        variantId: { type: string, format: uuid }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxCodeId: { type: string, format: uuid }

    Event:
      x-ticvai-persistence: "catalogue.event"
      type: object
      required: [id, code, name, venueId, scopePath]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        parentEventId:
          type: string
          format: uuid
          nullable: true
          description: For grouped events.
        performanceCount: { type: integer }
        isActive: { type: boolean }

    CreateEventRequest:
      type: object
      required: [code, name, venueId]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        parentEventId: { type: string, format: uuid }

    Performance:
      x-ticvai-persistence: "catalogue.performance"
      type: object
      required: [id, eventId, startsAt, endsAt, status]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, onSale, soldOut, suspended, cancelled, completed]
        admissionProfileId: { type: string, format: uuid, nullable: true }
        seatMapId: { type: string, format: uuid, nullable: true }

    CreatePerformancesRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        admissionProfileId: { type: string, format: uuid }
        seatMapId: { type: string, format: uuid }
        recurrence:
          type: object
          description: Generate a series rather than a single performance.
          properties:
            intervalMinutes: { type: integer, minimum: 1 }
            until: { type: string, format: date-time }
            daysOfWeek:
              type: array
              items: { type: integer, minimum: 0, maximum: 6 }

    Envelope:
      x-ticvai-persistence: "catalogue.envelope"
      type: object
      required: [id, performanceId, capacity, sold, leased, remaining, isSeated]
      properties:
        id: { type: string, format: uuid }
        performanceId: { type: string, format: uuid }
        name: { type: string }
        seatCategoryId: { type: string, format: uuid, nullable: true }
        capacity: { type: integer, minimum: 0 }
        sold: { type: integer }
        leased: { type: integer }
        remaining: { type: integer }
        hasChannelAllocations:
          type: boolean
          description: >
            True where capacity is divided across channels. Leases then draw from a channel
            allocation rather than from raw capacity.
        isSeated:
          type: boolean
          description: >
            Seated envelopes cannot be leased and are blocked offline. A seat map is not a
            count.

    CreateEnvelopeRequest:
      type: object
      required: [performanceId, name, capacity]
      properties:
        performanceId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        seatCategoryId: { type: string, format: uuid }
        capacity: { type: integer, minimum: 0 }

    ChannelAllocation:
      x-ticvai-persistence: "catalogue.channel_allocation"
      type: object
      required: [channel, allocatedUnits]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        allocatedUnits: { type: integer, minimum: 0 }
        soldUnits: { type: integer, readOnly: true }
        leasedUnits:
          type: integer
          readOnly: true
          description: Held by terminals on this channel but not yet sold.
        remainingUnits: { type: integer, readOnly: true }
        releaseAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Unsold units return to the general pool at this time. How distribution holds are
            freed close to a performance without someone remembering to do it.

    ChannelAllocationSet:
      x-ticvai-persistence: "none — projection"
      type: object
      required: [envelopeId, capacity, allocations, generalPoolUnits]
      properties:
        envelopeId: { type: string, format: uuid }
        capacity: { type: integer }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/ChannelAllocation' }
        generalPoolUnits:
          type: integer
          description: >
            Unallocated remainder. Any channel may draw from it once its own allocation is
            exhausted.
        totalSold: { type: integer }
        totalRemaining: { type: integer }

    BundleSummary:
      x-ticvai-persistence: "none — projection over bundle"
      type: object
      required: [version, venueId, publishedAt, publishedBy, contentHash, staleAfter, sizeBytes]
      properties:
        version: { type: string }
        venueId: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string, format: uuid }
        contentHash: { type: string }
        signatureKeyId:
          type: string
          description: >
            Key that signed this bundle. A terminal offline across a key rotation needs a
            grace window, or it cannot verify the next bundle.
        staleAfter: { type: string, format: date-time }
        sizeBytes: { type: integer }
        note: { type: string }
        appliedByWorkstations: { type: integer }

    CatalogueBundle:
      x-ticvai-persistence: "catalogue.published_bundle"
      type: object
      required: [version, venueId, isDelta, signature, signatureKeyId, contentHash, staleAfter, payload]
      properties:
        version: { type: string }
        venueId: { type: string, format: uuid }
        isDelta: { type: boolean }
        baseVersion:
          type: string
          nullable: true
          description: Present when `isDelta`. The version this delta applies to.
        signature:
          type: string
          description: >
            Detached signature over `contentHash`. The terminal verifies before applying and
            rolls back on failure — a half-applied catalogue is never traded against.
        signatureKeyId: { type: string }
        contentHash: { type: string }
        staleAfter: { type: string, format: date-time }
        payload:
          type: object
          description: >
            Products, variants, price lists, prices, tax codes, events, performances,
            envelope definitions and data mask field definitions. Shape is versioned with
            the bundle format, not with this API.
          additionalProperties: true

    LeaseStatus:
      type: string
      enum: [active, expired, released, forceReleased]

    AcquireLeaseRequest:
      type: object
      required: [id, envelopeId, requestedUnits, ttlSeconds]
      properties:
        channel:
          allOf:
            - $ref: '#/components/schemas/Channel'
          description: >
            Which channel's allocation to draw from. Defaults to the session's channel.
            A lease is granted against a channel allocation, not against raw capacity.
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Client-generated ULID. Also the idempotency key.
        envelopeId: { type: string, format: uuid }
        requestedUnits: { type: integer, minimum: 1 }
        ttlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: >
            Short TTLs limit stranding when a terminal dies; long TTLs survive longer
            outages. The venue's default balances the two.

    Lease:
      x-ticvai-persistence: "catalogue.inventory_lease"
      type: object
      required: [id, envelopeId, holderWorkstationId, grantedUnits, consumedUnits, status, acquiredAt, expiresAt]
      properties:
        id: { type: string }
        envelopeId: { type: string, format: uuid }
        holderWorkstationId: { type: string, format: uuid }
        parentLeaseId:
          type: string
          nullable: true
          description: Present when sub-leased from a venue edge node.
        requestedUnits: { type: integer }
        channel:
          allOf:
            - $ref: '#/components/schemas/Channel'
          description: Allocation this lease draws from.
        grantedUnits:
          type: integer
          description: >
            May be less than requested — a partial grant is not an error. Constrained by the
            channel's remaining allocation plus the general pool, never by raw capacity.
        consumedUnits: { type: integer }
        status: { $ref: '#/components/schemas/LeaseStatus' }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        releasedAt: { type: string, format: date-time, nullable: true }
        forceReleasedByPrincipalId: { type: string, format: uuid, nullable: true }
        forceReleaseReason: { type: string, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
