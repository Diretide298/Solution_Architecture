                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Settlement' }

    post:
      operationId: ingestSettlementFile
      x-ticvai-consumed-by:
        - "P08 BO-025 Chargebacks & Disputes"
        - "P08 BO-043 Daily Reconciliation"
        - "P10 PTR-014 Settlement & Payment History"
      x-ticvai-audience: [staff, partner]
      summary: Ingest a provider settlement file
      description: >
        Step one of five: ingest, parse, match, classify, auto-resolve. Monthly and
        file-based, not per-transaction API comparison (12 Aug §17).
      tags: [settlement]
      x-ticvai-permission: SETTLEMENT_RECONCILE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerName, periodStart, periodEnd, fileReference]
              properties:
                providerName: { type: string }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                fileReference:
                  type: string
                  description: Object storage reference. The file itself is not posted through this API.
                format:
                  type: string
                  enum: [csv, fixedWidth, xml, json]
      responses:
        '202':
          description: Accepted; parsing and matching proceed asynchronously
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }

  /settlements/{settlementId}:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSettlement
      x-ticvai-consumed-by:
        - "P08 BO-025 Chargebacks & Disputes"
        - "P08 BO-043 Daily Reconciliation"
        - "P10 PTR-014 Settlement & Payment History"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: analytical
      summary: Settlement detail with match results
      tags: [settlement]
      x-ticvai-permission: SETTLEMENT_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /settlements/{settlementId}/exceptions:
    parameters:
      - name: settlementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSettlementExceptions
      x-ticvai-consumed-by:
        - "P08 BO-025 Chargebacks & Disputes"
        - "P08 BO-043 Daily Reconciliation"
        - "P10 PTR-014 Settlement & Payment History"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: analytical
      summary: Unmatched or mismatched settlement lines
      description: >
        What auto-resolution could not classify. This is the only part of settlement a human
        should ever see — everything else matched.
      tags: [settlement]
      x-ticvai-permission: SETTLEMENT_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Exceptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SettlementException' }

    post:
      operationId: resolveSettlementException
      x-ticvai-consumed-by:
        - "P08 BO-025 Chargebacks & Disputes"
        - "P08 BO-043 Daily Reconciliation"
        - "P10 PTR-014 Settlement & Payment History"
      x-ticvai-audience: [staff, partner]
      summary: Resolve a settlement exception
      tags: [settlement]
      x-ticvai-permission: SETTLEMENT_RECONCILE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exceptionId, resolution, note]
              properties:
                exceptionId: { type: string }
                resolution:
                  type: string
                  enum: [matchedManually, writeOff, disputeRaised, providerError, timingDifference]
                matchedPaymentId: { type: string }
                note: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementException' }

  # ---------------------------------------------------------------- fiscal
  /legal-entities:
    get:
      operationId: listLegalEntities
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List legal entities
      description: >
        One per country of operation. Carries the country, currency, tax registration and
        fiscal calendar (12 Aug §14).
      tags: [fiscal]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Entities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LegalEntity' }
    post:
      operationId: createLegalEntity
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      summary: Create a legal entity
      tags: [fiscal]
      x-ticvai-permission: ACCOUNT_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalEntity' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalEntity' }

  /fiscal-periods:
    get:
      operationId: listFiscalPeriods
      x-ticvai-consumed-by:
        - "P08 BO-090 Period Close"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List fiscal periods
      tags: [fiscal]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: legalEntityId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PeriodStatus' }
      responses:
        '200':
          description: Periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FiscalPeriod' }

  /fiscal-periods/{periodId}/begin-close:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: beginPeriodClose
      x-ticvai-consumed-by:
        - "P08 BO-090 Period Close"
      x-ticvai-audience: [staff]
      summary: Begin closing a period
      description: >
        **Postings to the period stop here**, before reconciliation starts. Without this step the balance moves while it is being counted, and the two never agree.
      tags: [ledger]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fiscal-periods/{periodId}/abandon-close:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: abandonPeriodClose
      x-ticvai-consumed-by:
        - "P08 BO-090 Period Close"
      x-ticvai-audience: [staff]
      summary: Abandon a close in progress
      description: >
        An exception was found that needs the period open again. Postings resume.
      tags: [ledger]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fiscal-periods/{periodId}/reopen:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: reopenPeriod
      x-ticvai-consumed-by:
        - "P08 BO-090 Period Close"
      x-ticvai-audience: [staff]
      summary: Reopen a closed period
      description: >
        **Rare and heavily controlled.** Reopening restates figures somebody has already reported, so it requires an approver who is not the requester and records why.
      tags: [ledger]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                approverPrincipalId: { type: string }
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fiscal-periods/{periodId}/close:
    parameters:
      - name: periodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeFiscalPeriod
      x-ticvai-consumed-by:
        - "P08 BO-090 Period Close"
      x-ticvai-audience: [staff]
      summary: Close a period and lock postings
      description: >
        Runs the close checks and, if they pass, locks the period. Nothing may post to a
        closed period; corrections go to the current open one as reversals.

        **FX revaluation of open cross-currency balances is part of close and is not yet
        implemented** — it depends on CF-37.
      tags: [fiscal]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: false
                  description: Run the checks and report without locking.
      responses:
        '200':
          description: Closed, or checks reported when dry run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodCloseResult' }
        '409':
          description: >
            Close checks failed — unapproved journals, unreconciled settlements, open
            shifts, or a prior period still open.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- reporting
  /reports/financial:
    get:
      operationId: getFinancialReport
      x-ticvai-consumed-by:
        - "P04 POS-008 Reports"
        - "P08 BO-029 Report Builder"
        - "P08 BO-058 Reporting Home"
        - "P08 BO-059 Sales Reports"
        - "P08 BO-060 Attendance & Footfall"
        - "P08 BO-061 Scheduled Reports"
        - "P10 PTR-018 Reports & Sales Performance"
        - "P12 SUP-008 Agent Performance & SLA View"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: analytical
      summary: P&L, balance sheet or cash flow
      description: >
        Served from the reporting replica, never the primary. A month-end report running
        against the transactional database during a venue spike is the single most likely
        cause of an outage.
      tags: [reporting]
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [profitAndLoss, balanceSheet, cashFlow, revenueByVenue, revenueByProduct, taxSummary]
        - name: fiscalPeriodId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: legalEntityId
          in: query
          schema: { type: string, format: uuid }
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: costCenterId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialReport' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

components:
  schemas:
    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]

    Account:
      x-ticvai-persistence: "ledger.account"
      type: object
      required: [id, code, name, type, legalEntityId, isPostable, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        externalCode:
          type: string
          nullable: true
          description: Code in the client's own chart. Used on export so their team sees their codes.
        name: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/AccountType' }
        parentId: { type: string, format: uuid, nullable: true }
        legalEntityId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        isPostable:
          type: boolean
          description: False for parent accounts, which aggregate only.
        isActive: { type: boolean }
        balance: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    CreateAccountRequest:
      type: object
      required: [code, name, type, legalEntityId]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        externalCode: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        type: { $ref: '#/components/schemas/AccountType' }
        parentId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        isPostable: { type: boolean, default: true }

    PostingEventType:
      type: string
      description: Every event that generates a ledger posting.
      enum:
        - ticketRevenue
        - fnbRevenue
        - retailRevenue
        - rentalRevenue
        - taxPayable
        - cashReceived
        - cardReceived
        - walletReceived
        - refundIssued
        - voidReversal
        - deferredRevenue
        - recognisedRevenue
        - breakageRevenue
        - priceVariance
        - cashOverShort
        - settlementFee
        - settlementClearing

    AccountMapping:
      x-ticvai-persistence: "ledger.account_mapping"
      type: object
      required: [eventType, debitAccountId, creditAccountId]
      properties:
        eventType: { $ref: '#/components/schemas/PostingEventType' }
        debitAccountId: { type: string, format: uuid }
        creditAccountId: { type: string, format: uuid }
        venueId:
          type: string
          format: uuid
          nullable: true
          description: Null applies the mapping to every venue in the region.

    CostCenter:
      x-ticvai-persistence: "ledger.cost_center"
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        venueId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }

    TaxCode:
      x-ticvai-persistence: "ledger.tax_code"
      type: object
      required: [id, code, name, countryCode, rate, effectiveFrom, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        rate: { type: number, minimum: 0, maximum: 100 }
        compoundOnTaxCodeId:
          type: string
          format: uuid
          nullable: true
          description: >
            When set, this tax applies to the base **plus** the referenced tax, not to the
            base alone. Ordering is explicit rather than implied.
        isInclusive:
          type: boolean
          description: True when the displayed price already contains this tax.
        accountId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        isActive: { type: boolean }

    CreateTaxCodeRequest:
      type: object
      required: [code, name, countryCode, rate, effectiveFrom, accountId]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        rate: { type: number, minimum: 0, maximum: 100 }
        compoundOnTaxCodeId: { type: string, format: uuid }
        isInclusive: { type: boolean, default: false }
        accountId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }

    TaxExemption:
      x-ticvai-persistence: "ledger.tax_exemption"
      type: object
      required: [id, scope, taxCodeId, reason]
      properties:
        id: { type: string, format: uuid }
        scope:
          type: string
          enum: [account, productKind, channel, legalEntity]
        scopeRef:
          type: string
          description: Identifier of the exempt subject, matching `scope`.
        taxCodeId: { type: string, format: uuid }
        reason: { type: string, maxLength: 500 }
        certificateReference: { type: string, nullable: true }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }

    CalculateTaxRequest:
      type: object
      required: [venueId, lines]
      properties:
        venueId: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          nullable: true
          description: For exemption evaluation.
        discountsAreTaxInclusive:
          type: boolean
          default: true
          description: >
            True reduces the taxable base by the discount. False applies tax to the
            undiscounted amount. Venue policy.
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, netAmount, taxCodeIds]
            properties:
              lineId: { type: string }
              netAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              discountAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              taxCodeIds:
                type: array
                items: { type: string, format: uuid }

    TaxCalculation:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [lines, totalTax]
      properties:
        totalTax: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            required: [lineId, taxableBase, appliedTaxes, lineTax]
            properties:
              lineId: { type: string }
              taxableBase: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              appliedTaxes:
                type: array
                description: In application order, so a compound calculation can be traced.
                items:
                  type: object
                  required: [taxCodeId, rate, base, amount, isCompound]
                  properties:
                    taxCodeId: { type: string, format: uuid }
                    rate: { type: number }
                    base: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                    amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                    isCompound: { type: boolean }
                    exemptionApplied: { type: boolean }
              lineTax: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    RecognitionMethod:
      type: string
      enum:
        - immediate          # POS sale of goods
        - onRedemption       # gift cards, multi-venue passes
        - straightLine       # annual passes over their term
        - perVisit           # annual passes by usage
        - onExpiry           # breakage

    RecognitionSchedule:
      x-ticvai-persistence: "ledger.recognition_schedule"
      type: object
      required: [id, name, method, productKinds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        method: { $ref: '#/components/schemas/RecognitionMethod' }
        productKinds:
          type: array
          items: { type: string }
        deferredAccountId: { type: string, format: uuid }
        recognisedAccountId: { type: string, format: uuid }
        breakageAccountId: { type: string, format: uuid, nullable: true }
        breakageAfterDays:
          type: integer
          nullable: true
          description: Days after expiry at which unredeemed value becomes breakage.
        isActive: { type: boolean }

    DeferredRevenueReport:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [asAt, total, buckets]
      properties:
        asAt: { type: string, format: date }
        total: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        buckets:
          type: array
          items:
            type: object
            required: [label, amount, itemCount]
            properties:
              label:
                type: string
                description: Ageing band by expected recognition date.
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              itemCount: { type: integer }
              method: { $ref: '#/components/schemas/RecognitionMethod' }

    RecognitionRunResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [fiscalPeriodId, dryRun, recognisedTotal, breakageTotal, entryCount]
      properties:
        fiscalPeriodId: { type: string, format: uuid }
        dryRun: { type: boolean }
        recognisedTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        breakageTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        entryCount: { type: integer }
        byMethod:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/RecognitionMethod' }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              itemCount: { type: integer }
        journalEntryIds:
          type: array
          items: { type: string }

    JournalStatus:
      type: string
      enum: [draft, pendingApproval, posted, reversed]

    JournalSource:
      type: string
      enum: [manual, order, refund, void, shift, recognition, settlement, variance, reversal]

    JournalLine:
      type: object
      required: [accountId, debit, credit]
      properties:
        accountId: { type: string, format: uuid }
        debit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        credit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        venueId: { type: string, format: uuid, nullable: true }
        costCenterId: { type: string, format: uuid, nullable: true }
        description: { type: string, maxLength: 500 }

    CreateJournalEntryRequest:
      type: object
      required: [id, fiscalPeriodId, description, lines]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        fiscalPeriodId: { type: string, format: uuid }
        postingDate: { type: string, format: date }
        description: { type: string, minLength: 3, maxLength: 500 }
        reference: { type: string, maxLength: 128 }
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLine' }

    JournalEntry:
      x-ticvai-persistence: "ledger.journal_entry + ledger.journal_line"
      type: object
      required: [id, entryNumber, fiscalPeriodId, status, source, description, lines, totalDebit, totalCredit, createdAt]
      properties:
        id: { type: string }
        entryNumber: { type: string }
        fiscalPeriodId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JournalStatus' }
        source: { $ref: '#/components/schemas/JournalSource' }
        sourceId:
          type: string
          nullable: true
          description: The order, refund or run that generated this entry.
        description: { type: string }
        reference: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/JournalLine' }
        totalDebit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        totalCredit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        postedByPrincipalId: { type: string, format: uuid, nullable: true }
        approvedByPrincipalId: { type: string, format: uuid, nullable: true }
        reversalOfEntryId: { type: string, nullable: true }
        reversedByEntryId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time, nullable: true }

    LedgerEntry:
      x-ticvai-persistence: "ledger.entry"
      type: object
      required: [id, journalEntryId, accountId, debit, credit, postedAt]
      properties:
        id: { type: string }
        journalEntryId: { type: string }
        accountId: { type: string, format: uuid }
        accountCode: { type: string }
        debit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        credit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        venueId: { type: string, format: uuid, nullable: true }
        costCenterId: { type: string, format: uuid, nullable: true }
        source: { $ref: '#/components/schemas/JournalSource' }
        sourceId: { type: string, nullable: true }
        description: { type: string }
        postedAt: { type: string, format: date-time }

    TrialBalance:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [fiscalPeriodId, isBalanced, totalDebit, totalCredit, accounts]
      properties:
        fiscalPeriodId: { type: string, format: uuid }
        isBalanced:
          type: boolean
          description: >
            False indicates a defect, not a business condition. Double-entry cannot be
            unbalanced by legitimate activity.
        totalDebit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        totalCredit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        accounts:
          type: array
          items:
            type: object
            required: [accountId, accountCode, accountName, debit, credit, balance]
            properties:
              accountId: { type: string, format: uuid }
              accountCode: { type: string }
              accountName: { type: string }
              type: { $ref: '#/components/schemas/AccountType' }
              debit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              credit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              balance: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    VarianceReviewStatus:
      type: string
      enum: [notRequired, pendingReview, reviewed]

    PriceVariance:
      x-ticvai-persistence: "ledger.price_variance"
      type: object
      required: [id, orderId, orderLineId, venueId, quotedPrice, serverPrice, variance, isException, occurredAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        orderLineId: { type: string }
        venueId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        quotedPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        serverPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        variance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        catalogueBundleVersion:
          type: string
          nullable: true
          description: >
            The bundle the terminal priced from. Turns "the price was wrong" into "the
            terminal was two bundles behind", which is actionable.
        isException:
          type: boolean
          description: Above the venue's configured variance threshold.
        reviewStatus: { $ref: '#/components/schemas/VarianceReviewStatus' }
        reviewOutcome: { type: string, nullable: true }
        reviewedByPrincipalId: { type: string, format: uuid, nullable: true }
        journalEntryId: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    FxRatePurpose:
      type: string
      description: >
        A venue does not accept dollars at the rate it books an intercompany balance at.
        Separating them is what stops a spread on the counter appearing as a loss in the
        accounts.
      enum:
        - tender          # what the counter accepts foreign cash at. Carries a spread
        - interEntity     # obligations between legal entities
        - reporting       # consolidation into a presentation currency
        - revaluation     # period close

    FxRate:
      type: object
      x-ticvai-persistence: "ledger.fx_rate"
      required: [fromCurrency, toCurrency, rate, purpose, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        fromCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        toCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        rate:
          type: number
          description: >
            Units of `toCurrency` per one `fromCurrency`. Six decimal places — a two-place
            rate on a three-place currency loses money on every transaction, quietly.
        purpose: { $ref: '#/components/schemas/FxRatePurpose' }
        source:
          type: string
          enum: [manual, centralBank, provider]
          description: >
            Configured, not fetched live. A market rate moving mid-shift means two guests pay
            different dirham amounts for the same product minutes apart.
        effectiveFrom: { type: string, format: date-time }
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: >
            A rate change is a new row. The old one is never edited — a transaction posted last
            Tuesday must still reconcile at last Tuesday's rate.
        setByPrincipalId: { type: string, format: uuid, readOnly: true }

    ForeignTenderReport:
      type: object
      x-ticvai-persistence: "none — aggregated from payment"
      required: [lines, asAt]
      properties:
        asAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            properties:
              shiftId: { type: string }
              principalId: { type: string, format: uuid }
              principalName: { type: string }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              foreignAmount:
                type: number
                description: What was physically taken. The cashier counts this in the drawer.
              rateApplied: { type: number }
              baseAmount:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Money'
                description: What the ledger holds. The only figure that reconciles.
              transactionCount: { type: integer }

    InterEntityObligation:
      type: object
      x-ticvai-persistence: "ledger.inter_entity_obligation"
      required: [id, fromLegalEntityId, toLegalEntityId, arisingAmount, arisingAt, status]
      properties:
        id: { type: string }
        fromLegalEntityId:
          type: string
          format: uuid
          description: The selling entity. Holds the liability, and therefore the FX exposure.
        toLegalEntityId:
          type: string
          format: uuid
          description: The consuming entity, which provided the service at redemption.
        entitlementId: { type: string }
        orderId: { type: string }
        arisingAmount:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            In the **consuming** entity's base currency, at the rate in force on the redemption
            date. Neither entity ever holds a balance in a currency that is not its own.
        rateApplied: { type: number }
        arisingAt:
          type: string
          format: date-time
          description: Redemption. Not sale — the obligation exists when the service is given.
        status:
          type: string
          enum: [outstanding, settled, disputed]
        settledAt: { type: string, format: date-time, nullable: true }
        settlementRate: { type: number, nullable: true }
        fxMovement:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Rate movement between arising and settling. Posts to FX gain and loss on the
            selling entity, which carried the balance.

    FxRevaluationResult:
      type: object
      x-ticvai-persistence: "none — computed, posts a journal"
      required: [fiscalPeriodId, obligationsRevalued, netMovement, isDryRun]
      properties:
        fiscalPeriodId: { type: string, format: uuid }
        isDryRun: { type: boolean }
        obligationsRevalued: { type: integer }
        netMovement: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        journalEntryId: { type: string, nullable: true }
        byEntity:
          type: array
          items:
            type: object
            properties:
              legalEntityId: { type: string, format: uuid }
              openBalance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              movement: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    SettlementStatus:
      type: string
      enum: [ingesting, parsing, matching, matched, hasExceptions, resolved, failed]

    Settlement:
      x-ticvai-persistence: "ledger.settlement"
      type: object
      required: [id, providerName, periodStart, periodEnd, status, ingestedAt]
      properties:
        id: { type: string, format: uuid }
        providerName: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        status: { $ref: '#/components/schemas/SettlementStatus' }
        lineCount: { type: integer }
        matchedCount: { type: integer }
        exceptionCount: { type: integer }
        providerGross: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        providerFees: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        providerNet: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        ledgerGross: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        difference: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        ingestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    SettlementException:
      x-ticvai-persistence: "ledger.settlement_exception"
      type: object
      required: [id, settlementId, kind, providerReference, amount]
      properties:
        id: { type: string }
        settlementId: { type: string, format: uuid }
        kind:
          type: string
          enum: [unmatchedInProvider, unmatchedInLedger, amountMismatch, duplicateInProvider, feeUnexplained]
        providerReference: { type: string, nullable: true }
        paymentId: { type: string, nullable: true }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        expectedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        resolution: { type: string, nullable: true }
        resolvedByPrincipalId: { type: string, format: uuid, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }

    LegalEntity:
      x-ticvai-persistence: "ledger.legal_entity"
      type: object
      required: [id, code, name, countryCode, currency, currencyScale, fiscalYearStartMonth]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer, minimum: 0, maximum: 4 }
        taxRegistrationNumber: { type: string, nullable: true }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        regionIds:
          type: array
          items: { type: string, format: uuid }
        isActive: { type: boolean }

    PeriodStatus:
      type: string
      enum: [open, closing, closed]

    FiscalPeriod:
      x-ticvai-persistence: "ledger.fiscal_period"
      type: object
      required: [id, legalEntityId, name, startDate, endDate, status]
      properties:
        id: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/PeriodStatus' }
        closedByPrincipalId: { type: string, format: uuid, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }

    PeriodCloseResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [fiscalPeriodId, dryRun, passed, checks]
      properties:
        fiscalPeriodId: { type: string, format: uuid }
        dryRun: { type: boolean }
        passed: { type: boolean }
        checks:
          type: array
          items:
            type: object
            required: [check, passed]
            properties:
              check:
                type: string
                enum:
                  - trialBalanceBalances
                  - noUnapprovedJournals
                  - noOpenShifts
                  - settlementsReconciled
                  - recognitionRunComplete
                  - priorPeriodClosed
                  - varianceExceptionsReviewed
              passed: { type: boolean }
              detail: { type: string }
              blockingCount: { type: integer }

    FinancialReport:
      x-ticvai-persistence: "none — computed from replica"
      type: object
      required: [report, fiscalPeriodId, currency, generatedAt, sections]
      properties:
        report: { type: string }
        fiscalPeriodId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid, nullable: true }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer }
        generatedAt: { type: string, format: date-time }
        sections:
          type: array
          items:
            type: object
            required: [name, lines, total]
            properties:
              name: { type: string }
              lines:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    accountCode: { type: string, nullable: true }
                    amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                    priorPeriodAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              total: { $ref: '../shared/common.yaml#/components/schemas/Money' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
