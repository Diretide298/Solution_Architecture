          description: Foreign tender
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForeignTenderReport' }

  /fx/inter-entity:
    get:
      operationId: listInterEntityObligations
      x-ticvai-consumed-by:
        - "P08 BO-008 Product Detail & Variants"
      x-ticvai-audience: [staff]
      summary: What one entity owes another
      description: >
        A pass sold by the UAE entity and redeemed at a Qatari venue creates an obligation
        between two legal entities holding two base currencies.

        **The rule follows from the policy rather than extending it.** The sale was stored in
        the selling entity's base currency, because that is where it was transacted. The
        obligation arises **at redemption**, because that is when the consuming entity provides
        the service, and it is denominated in the consuming entity's base currency at the rate
        in force on that date.

        Between the obligation arising and being settled, the rate moves. That movement is an
        FX gain or loss on the **selling** entity's books — it holds the liability, so it
        carries the exposure. Revalued at period close alongside every other monetary balance.

        Neither entity ever holds a balance in a currency that is not its own. That is the
        whole of the policy, applied twice.
      tags: [ledger]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: analytical
      parameters:
        - name: fromLegalEntityId
          in: query
          schema: { type: string, format: uuid }
        - name: toLegalEntityId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [outstanding, settled, disputed]
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Obligations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/InterEntityObligation' }

  /fx/revaluation:
    post:
      operationId: runFxRevaluation
      x-ticvai-consumed-by:
        - "P08 BO-008 Product Detail & Variants"
      x-ticvai-audience: [staff]
      summary: Revalue monetary balances at close
      description: >
        Restates open inter-entity obligations and any foreign-denominated balance at the
        closing rate, posting the movement to FX gain and loss.

        Part of period close and refused outside one — revaluing mid-period produces a figure
        that disagrees with itself the next day.
      tags: [ledger]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
