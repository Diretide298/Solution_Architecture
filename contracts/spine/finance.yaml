      responses:
        '200':
          description: Revaluation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRevaluationResult' }
        '409':
          description: Period is not closing, or is already closed
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

