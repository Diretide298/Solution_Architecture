openapi: 3.1.0
info:
  title: TICVAI Finance & Ledger
  version: 0.1.0
  x-ticvai-screen-count: 45
  x-ticvai-tier: spine
  x-ticvai-module: "5 — F&B & Guest Management (accounting and revenue recognition)"
  x-ticvai-requirements: 327
  x-ticvai-capabilities: [C41, C42, C43, C44, C45, C46, C47, C48, C49, C50]
  x-ticvai-platforms:
    - "P08 Venue Back Office"
  description: >
    ## What this contract covers

    **The append-only record of everything. Corrections are entries, never edits.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 5 — F&B & Guest Management (accounting and revenue recognition) |
    | **Requirements** | ~327 |
    | **Capabilities** | C41, C42, C43, C44, C45, C46, C47, C48, C49, C50 |
    | **Consumed by** | P08 Venue Back Office |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Chart of accounts, tax, revenue recognition, journals, settlement and financial
    reporting. Settled by the 12 August finance deep-dive.

    Positions this encodes:

    - **The ledger is append-only.** Nothing is deleted or edited; corrections are new
      entries. Every endpoint here obeys that, and the absence of DELETE is deliberate.
    - **Dual ledger.** Transaction-level entries for reconciliation, journal entries for
      trial balance, P&L and balance sheet.
    - **Tax is computed per line item, not on the basket total**, with compound tax support
      and per-country structures.
    - **Multi-venue passes recognise on redemption**, not at sale. Gift cards recognise on
      redemption, annual passes straight-line or per visit, unredeemed value as breakage on
      expiry.
    - **Price variance is a first-class posting** (CF-38). The server re-prices on ingest;
      where it disagrees with the quoted price the quote is honoured and the difference
      posted. Above the venue's threshold it becomes an exception requiring review.

    DEFERRED pending CF-37 (FX policy): cross-currency allocation splits, inter-company
    settlement, FX revaluation at period close, and consolidated multi-currency reporting.
    Those endpoints are listed in the repository README and are not in this version.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: accounts
  - name: tax
  - name: recognition
  - name: journal
  - name: ledger
  - name: settlement
  - name: variance
  - name: reporting
  - name: fiscal

paths:
  # ---------------------------------------------------------------- accounts
  /inter-entity-obligations/{obligationId}/settle:
    parameters:
      - name: obligationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordSettlement
      x-ticvai-audience: [staff]
      summary: One entity paid another
      description: >
        **The operation that closes an obligation, and it did not exist.** `listInterEntityObligations`
        could show what was owed between entities and nothing could mark it paid.

        Settled in base currency at the rate carried on the obligation, **not today's rate**
        (CF-37). An obligation raised in March and settled in August settles at March's rate,
        because the amount owed was fixed when the guest redeemed.
      tags: [finance]
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settledAmount, settledAt]
              properties:
                settledAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                settledAt: { type: string, format: date-time }
                reference: { type: string }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Settled, and the journal posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterEntityObligation' }

  /inter-entity-obligations/{obligationId}/dispute:
    parameters:
      - name: obligationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: disputeObligation
      x-ticvai-audience: [staff]
      summary: One entity disagrees with the amount
      description: >
        **Disputing does not cancel the debt.** The obligation stays outstanding and stays on
        both balance sheets; what changes is that it is flagged and excluded from an automatic
        settlement run.
      tags: [finance]
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [amountDisputed, notRedeemed, rateDisputed, duplicated, other] }
                claimedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Disputed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterEntityObligation' }

  /inter-entity-obligations/{obligationId}/resolve:
    parameters:
      - name: obligationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resolveObligationDispute
      x-ticvai-audience: [staff]
      summary: Agree what is actually owed
      description: >
        Returns the obligation to `outstanding`, possibly at a different figure. **The original
        amount is retained** — an obligation that quietly becomes a smaller number is one nobody
        can audit.
      tags: [finance]
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreedAmount]
              properties:
                agreedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterEntityObligation' }

  /accounts:
    get:
      operationId: listAccounts
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List the chart of accounts
      tags: [accounts]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: legalEntityId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AccountType' }
        - name: isPostable
          in: query
          description: Leaf accounts only. Parent accounts aggregate and cannot be posted to.
          schema: { type: boolean }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createAccount
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      summary: Create an account
      description: >
        Accounts may be created natively or mapped to a chart maintained externally in the
        client's ERP. Where `externalCode` is set, exports use it — the client's finance
        team continues to see their own codes.
      tags: [accounts]
      x-ticvai-permission: ACCOUNT_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: Code already in use within this legal entity
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAccount
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read an account
      tags: [accounts]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateAccount
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      summary: Rename, remap or deactivate an account
      description: >
        The code is immutable once entries exist. Deactivation prevents new postings and
        leaves history intact.
      tags: [accounts]
      x-ticvai-permission: ACCOUNT_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                externalCode: { type: string, maxLength: 64 }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409':
          description: Attempt to change an immutable field after entries exist
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /account-mappings:
    get:
      operationId: listAccountMappings
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Which account each transaction type posts to
      description: >
        Maps revenue, tax, payment, refund, variance and breakage events to accounts. This
        is the table that makes posting deterministic rather than hard-coded.
      tags: [accounts]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountMapping' }
    put:
      operationId: setAccountMappings
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      x-ticvai-config-scope: region
      summary: Set posting mappings
      tags: [accounts]
      x-ticvai-permission: ACCOUNT_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings]
              properties:
                mappings:
                  type: array
                  items: { $ref: '#/components/schemas/AccountMapping' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountMapping' }
        '400':
          description: A required event type has no mapping, or maps to a non-postable account
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /cost-centers:
    get:
      operationId: listCostCenters
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List cost centres
      tags: [accounts]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Cost centres
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CostCenter' }
    post:
      operationId: createCostCenter
      x-ticvai-consumed-by:
        - "P08 BO-074 Chart of Accounts"
      x-ticvai-audience: [staff]
      summary: Create a cost centre
      tags: [accounts]
      x-ticvai-permission: ACCOUNT_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 200 }
                parentId: { type: string, format: uuid }
                venueId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostCenter' }

  # ---------------------------------------------------------------- tax
  /tax-codes:
    get:
      operationId: listTaxCodes
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List tax codes
      tags: [tax]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: countryCode
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Tax codes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TaxCode' }
    post:
      operationId: createTaxCode
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      summary: Create a tax code
      description: >
        Supports compound tax — a code may apply on top of another code's result rather than
        on the net amount. Order matters, and `compoundOnTaxCodeId` makes it explicit rather
        than implied by sequence.
      tags: [tax]
      x-ticvai-permission: TAX_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaxCodeRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCode' }
        '400':
          description: Compound reference is circular or crosses countries
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /tax-codes/{taxCodeId}:
    parameters:
      - name: taxCodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTaxCode
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      summary: Amend a tax code
      description: >
        Rate changes are versioned with an effective date, never applied retrospectively.
        Historic entries keep the rate that was in force when they were posted.
      tags: [tax]
      x-ticvai-permission: TAX_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                rate: { type: number, minimum: 0, maximum: 100 }
                effectiveFrom: { type: string, format: date }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCode' }

  /tax-exemptions:
    get:
      operationId: listTaxExemptions
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List tax exemptions
      description: Exemption by account, product class or channel — diplomatic, export, B2B.
      tags: [tax]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Exemptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxExemption' }
    post:
      operationId: createTaxExemption
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience: [staff]
      summary: Grant a tax exemption
      tags: [tax]
      x-ticvai-permission: TAX_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxExemption' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxExemption' }

  /tax/calculate:
    post:
      operationId: calculateTax
      x-ticvai-audience: [staff]
      summary: Compute tax for a set of lines
      description: >
        Per line item, not on the basket total. Returns the full computation — base, each
        applied code in order, and whether it compounded — so a variance can be explained
        rather than merely observed.

        Discount treatment is explicit: `discountsAreTaxInclusive` determines whether a
        discount reduces the taxable base or is applied after tax.
      tags: [tax]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculateTaxRequest' }
      responses:
        '200':
          description: Computation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalculation' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- recognition
  /recognition-schedules:
    get:
      operationId: listRecognitionSchedules
      x-ticvai-consumed-by:
        - "P08 BO-076 Revenue Recognition"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List revenue recognition schedules
      tags: [recognition]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RecognitionSchedule' }
    post:
      operationId: createRecognitionSchedule
      x-ticvai-consumed-by:
        - "P08 BO-076 Revenue Recognition"
      x-ticvai-audience: [staff]
      summary: Define how a product class recognises revenue
      tags: [recognition]
      x-ticvai-permission: ACCOUNT_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
