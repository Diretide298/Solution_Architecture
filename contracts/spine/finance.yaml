  # ---------------------------------------------------------------- ledger
  /fx-rates:
    get:
      operationId: listFxRates
      x-ticvai-consumed-by:
        - "P01 WEB-035 Multi-Currency & Pricing"
        - "P02 GST-044 Multi-Currency & Pricing"
        - "P08 BO-077 FX Rates & Variances"
      x-ticvai-audience: [staff, guest]
      summary: The rates in force
      description: >
        **Policy, settled 14 August: every transaction is stored in the base currency of the
        region it was transacted in.**

        A guest paying USD 100 in a UAE venue has the dirham equivalent stored at the
        configured rate. The foreign amount is retained for the cashier's declaration and for
        the foreign-tender report — it is never what the ledger holds.

        The consequence is that most of the questions FX usually raises do not arise. There is
        no rate to lock at redemption, none at expiry, and none at refund, because the stored
        amount was never in a foreign currency. Allam: *"the value of the currency doesn't
        matter whether it goes high or down. They are purchasing a product equivalent to that
        currency… at the end they are paying that base currency value, and they get a refund
        for the base currency value."*
      tags: [ledger]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - name: asAt
          in: query
          description: Rates in force at this instant. Defaults to now.
          schema: { type: string, format: date-time }
        - name: purpose
          in: query
          schema: { $ref: '#/components/schemas/FxRatePurpose' }
      responses:
        '200':
          description: Rates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FxRate' }

    put:
      operationId: setFxRate
      x-ticvai-consumed-by:
        - "P08 BO-077 FX Rates & Variances"
      x-ticvai-audience: [staff]
      x-ticvai-config-scope: region
      summary: Set a rate
      description: >
        Rates are **configured, not fetched live**. A published market rate moving mid-shift
        would mean two guests paying different dirham amounts for the same product minutes
        apart, and a cashier unable to explain either.

        A rate change is a new row with its own effective window; the old one is never edited.
        A transaction posted last Tuesday must still reconcile at last Tuesday's rate.

        **Tender rates carry a spread.** The rate a venue accepts dollars at is not the
        interbank rate, and pretending otherwise makes every foreign-tender sale look like a
        small loss.
      tags: [ledger]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxRate' }
      responses:
        '201':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRate' }
        '409':
          description: Effective window overlaps an existing rate for the same pair and purpose
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /fx/foreign-tender:
    get:
      operationId: getForeignTenderReport
      x-ticvai-consumed-by:
        - "P08 BO-008 Product Detail & Variants"
      x-ticvai-audience: [staff]
      summary: What was taken in which currency
      description: >
        Per cashier, per shift, per currency: the foreign amount taken, the rate applied, and
        the base-currency equivalent posted.

        Named explicitly on 14 August — *"a clear reporting that says foreign currency
        transactions report, it will show you that this cashier has taken 100 dollars, 200
        Qatari riyal."* A cashier declaring a drawer holding three currencies needs this to
        reconcile, and without it the variance is unexplainable.
      tags: [reporting]
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
