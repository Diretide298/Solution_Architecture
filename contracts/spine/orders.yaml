  /payments/{paymentId}/tip:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: addTip
      x-ticvai-consumed-by:
        - "P04 POS-005 Payment"
        - "P06 EMP-035 Payment on device"
        - "P08 BO-024 Payment Exceptions"
        - "P10 PTR-012 Checkout / Credit Purchase"
      x-ticvai-audience: [staff, partner]
      summary: Record a tip against a payment
      description: >
        A separate operation rather than a line on the order, because a tip is not revenue —
        it is money held for staff and posts to a liability, not to sales. Treating it as a
        line inflates takings and understates what is owed.

        Where the terminal captured the tip, this records what it reported. Where the guest
        wrote it on a slip, a cashier enters it, and that path needs the same attribution as
        a manual discount.
      tags: [payment]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, source, recordedAt]
              properties:
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                source:
                  type: string
                  enum: [terminalPrompt, cashierEntered, guestApp, serviceCharge]
                  description: >
                    `serviceCharge` is not a tip and is separated deliberately — it is revenue
                    in most jurisdictions, and pooling it with tips is how a payroll dispute
                    starts.
                allocateToPrincipalId:
                  type: string
                  format: uuid
                  description: Where the venue allocates rather than pools.
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409':
          description: Payment not settled, or a tip is already recorded against it
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

