openapi: 3.1.0
info:
  title: TICVAI Order & Payment
  version: 0.1.0
  x-ticvai-screen-count: 43
  x-ticvai-tier: spine
  x-ticvai-module: "2 — Ticketing Sales"
  x-ticvai-requirements: 343
  x-ticvai-capabilities: [C02, C03, C04, C34, C47]
  x-ticvai-platforms:
    - "P04 POS"
    - "P01 Guest Web"
    - "P02 Guest App"
    - "P05 Kiosk"
    - "P10 Partner Portal"
    - "P12 Support Console"
  description: >
    ## What this contract covers

    **Money moves here. One atomic transaction with entitlement and ledger.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 2 — Ticketing Sales |
    | **Requirements** | ~343 |
    | **Capabilities** | C02, C03, C04, C34, C47 |
    | **Consumed by** | P04 POS · P01 Guest Web · P02 Guest App · P05 Kiosk · P10 Partner Portal · P12 Support Console |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Orders, payments, refunds, voids and reservations. Shift and till are separate
    (`shift.yaml`).

    Positions this encodes:

    - **The server re-prices every line on ingest** (ADR-0013). The local price is the
      guest's answer; the server is authoritative for the ledger. Where they disagree the
      quoted price is honoured and a variance is posted — the guest has already paid and
      left, so the ledger records what happened rather than what should have.
    - **Refund thresholds are venue policy, not permission scope** (CF-36). `ORDER_REFUND`
      is binary. How much a holder may refund without a second authoriser is configured per
      venue, because venues run different policies.
    - **Dual-authorisation, not escalation** (2.12.3). Above threshold a second user — cashier
      or supervisor — names themselves as audit control. That is a different mechanism from
      escalating to a higher permission.
    - **Orders never span cells** (ADR-0010). The selling cell owns the order; redemption
      rights propagate.
    - Payment recovery matters more than the happy path. A terminal that charged a card and
      never received a response is the normal failure, not the exotic one.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: order
  - name: b2b
  - name: payment
  - name: refund
  - name: reservation
  - name: policy
  - name: sync

paths:
  /carts:
    post:
      operationId: createCart
      x-ticvai-audience: [guest]
      summary: Start a cart
      description: >
        **A cart holds leases; an order holds money.** Different lifetimes, different failure
        modes, and merging them is why this contract did not exist until 17 August — `createOrder`
        takes a whole basket at once, which is correct for a till and cannot be resumed on
        another device.

        Created against a guest subject where one is known, or an anonymous token where it is
        not. **The token is what lets a guest browse before signing in** and keep their cart when
        they do (2.1.31).

        **POS does not use this.** A till builds its sale locally and submits atomically, because
        it works offline and does not need a resumable cart. Same order contract, different
        channel.
      tags: [cart]
      x-ticvai-permission: null   # a guest session, or anonymous before one exists
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, channel]
              properties:
                venueId: { type: string, format: uuid }
                channel: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
                subjectId: { type: string, format: uuid, nullable: true }
                locale: { type: string }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /carts/{cartId}:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P01 WEB-014 Payment Link Landing"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-041 Checkout Entry"
        - "P02 GST-053 Build Your Own Itinerary"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: The cart, priced and checked, right now
      description: >
        2.9.2. **Re-prices and re-checks on every read**, because a cart is a claim about the
        future and the future moves. Availability, promotions and lease expiry are all live.

        Returns the conflicts (2.9.5) and the leases with their remaining time, so the interface
        can say *"your seats are held for 6 minutes"* rather than discovering it at checkout.
      tags: [cart]
      x-ticvai-permission: null   # the cart's own token or the guest who owns it
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: The cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '410':
          description: >
            Expired. **Distinct from not found** — a guest returning to a link needs to know
            their cart existed and lapsed, not that it never was.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    delete:
      operationId: abandonCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
      x-ticvai-audience: [guest]
      summary: Empty it deliberately
      description: >
        **Releases every lease immediately** rather than waiting for expiry. A guest who has
        decided not to buy should not hold capacity for another twenty minutes.

        Distinct from expiry: this is a decision, and the recovery campaign must not chase
        someone who said no (22.3.6).
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Abandoned and leases released

  /carts/{cartId}/lines:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addCartLine
      x-ticvai-consumed-by:
        - "P01 WEB-008 Add-ons & Upsell"
        - "P01 WEB-010 Shopping Cart"
        - "P01 WEB-033 Shop"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-048 Upsell / Cross-Sell"
        - "P02 GST-050 Resource Booking – Cabana"
        - "P02 GST-053 Build Your Own Itinerary"
        - "P02 GST-056 Bundle Package"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Add something
      description: >
        2.9.4. **Acquiring the lease is the whole reason this is a server operation.** A
        capacity-bound product added to a cart reserves capacity for a configured window, and a
        cart held in a browser cannot reserve anything.

        **Refused rather than added where capacity has gone.** A line added optimistically and
        removed at checkout is a guest who thinks they bought something.

        Returns the cart with any conflicts the addition created (2.9.5) — golf at 13:00 already
        in the cart and karting at 13:00 being added is a prompt, not a refusal, because a party
        of four may legitimately split.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartLineRequest' }
      responses:
        '200':
          description: Added, and the cart re-priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: >
            No capacity, or the product is not sellable on this channel. **The reason is
            specific** — sold out for this session reads differently from sold out for the day.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /carts/{cartId}/lines/{lineId}:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: lineId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCartLine
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Change a quantity
      description: >
        Increasing extends the lease and may fail on capacity; decreasing releases part of it.
        **Releasing immediately matters** — a guest reducing from six to two should return four
        seats to sale now, not in twenty minutes.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Not enough capacity to increase
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    delete:
      operationId: removeCartLine
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Take something out
      description: Releases its lease immediately.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed, and the cart re-priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /carts/{cartId}/extend:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: extendCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
      x-ticvai-audience: [guest]
      summary: Give the guest more time
      description: >
        Extends every lease in the cart. **Capped, and the cap is configuration** — an
        indefinitely extendable hold is capacity permanently removed from sale by someone who
        left the tab open.

        Offered once, typically, and the interface should say it is the last extension rather
        than letting a guest discover the cap by hitting it.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Extended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Extension cap reached, or a lease could not be extended because the capacity has gone
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /carts/{cartId}/claim:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: claimCart
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
      x-ticvai-audience: [guest]
      summary: Attach an anonymous cart to a guest
      description: >
        2.1.31. **The operation that makes cross-channel work.** A guest who built a cart
        anonymously and then signs in keeps it; a guest who signs in on a laptop finds the cart
        they started on their phone.

        Where the guest already has a cart, the two **merge rather than one replacing the
        other** — losing a cart at the moment of signing in is the worst possible time to lose
        one. Lines that cannot be re-leased are reported rather than dropped silently.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed, and merged where the guest already had one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMergeResult' }

  /carts/{cartId}/checkout:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: checkoutCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P01 WEB-014 Payment Link Landing"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-041 Checkout Entry"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Turn the cart into an order
      description: >
        **Transfers the leases to the order rather than releasing and re-acquiring them.**
        Releasing first would let another guest take the capacity between the two calls, which
        is the failure that makes a checkout feel unreliable at exactly the wrong moment.

        The cart is retained, not deleted — a checkout that fails at payment must be resumable,
        and a guest whose card was declined should still have their seats.

        **One cart, one order, one receipt** across ticketing, F&B and retail (14 August).
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectId: { type: string, format: uuid }
                attendees:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '201':
          description: An order, pending payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: >
            A lease expired between the last read and checkout. **Names which line**, so the
            guest loses one thing rather than the cart.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /carts/abandoned:
    get:
      operationId: listAbandonedCarts
      x-ticvai-audience: [staff]
      summary: Carts that lapsed without checking out
      description: >
        22.3.6 and 2.6.45. Feeds recovery campaigns.

        **Excludes carts abandoned deliberately.** A guest who emptied their cart said no, and
        chasing them is the difference between a reminder and a nuisance.
      tags: [cart]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: analytical
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: minValue
          in: query
          description: Recovery is worth more on a large cart than a small one.
          schema: { type: number }
      responses:
        '200':
          description: Abandoned carts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AbandonedCart' }

  /payments/{paymentId}/void:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: voidPayment
      x-ticvai-audience: [staff]
      summary: Release an authorisation before it is captured
      description: >
        **Cheaper and cleaner than a refund, and the guest never sees a charge.** An authorisation
        released the same day usually leaves no trace on a statement; a capture followed by a
        refund leaves two lines and a phone call.

        Only valid before capture. **A captured payment is refunded, not voided** — the money has
        moved and pretending otherwise loses the audit trail.
      tags: [orders]
      x-ticvai-permission: PAYMENT_VOID
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [guestAbandoned, cashierError, priceCorrection, duplicateAuthorisation, systemError]
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409':
          description: >
            Already captured. **The response says so rather than failing generically**, because
            the correct next action is a refund and the cashier needs to know that.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders:
    get:
      operationId: listOrders
      x-ticvai-consumed-by:
        - "P01 WEB-030 Ticket Transfer"
        - "P02 GST-018 Add to Calendar / Reminders"
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-006 Held Orders"
        - "P06 EMP-014 Ticket lookup"
        - "P06 EMP-034 Walk-up sale"
        - "P08 BO-003 Queue Integration Setup"
        - "P08 BO-022 Order Detail"
        - "P08 BO-023 Refunds & Exchanges"
        - "P08 BO-026 Group Bookings"
        - "P08 BO-047 F&B Order Management"
        - "P08 BO-051 Purchase Orders"
        - "P08 BO-070 Work Orders"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-005 Inventory & Allocation View"
        - "P10 PTR-008 Booking Creation"
        - "P10 PTR-015 Order History"
        - "P10 PTR-016 Voucher / Ticket Download"
      x-ticvai-audience: [staff, guest, partner]
      x-ticvai-read-routing: replica
      summary: List orders
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-permission-escalated: ORDER_VIEW_OTHER   # where the orders are not the caller's own
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: principalId
          in: query
          description: Requires ORDER_VIEW_OTHER when not the caller.
          schema: { type: string, format: uuid }
        - name: shiftId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createOrder
      x-ticvai-consumed-by:
        - "P01 WEB-012 Checkout — Payment"
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-004 Sell — Seat Map"
        - "P04 POS-005 Payment"
        - "P04 POS-006 Held Orders"
        - "P06 EMP-014 Ticket lookup"
        - "P06 EMP-034 Walk-up sale"
        - "P08 BO-003 Queue Integration Setup"
        - "P08 BO-022 Order Detail"
        - "P08 BO-023 Refunds & Exchanges"
        - "P08 BO-026 Group Bookings"
        - "P08 BO-047 F&B Order Management"
        - "P08 BO-051 Purchase Orders"
        - "P08 BO-070 Work Orders"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-005 Inventory & Allocation View"
        - "P10 PTR-008 Booking Creation"
        - "P10 PTR-015 Order History"
        - "P10 PTR-016 Voucher / Ticket Download"
      x-ticvai-audience: [staff, guest, partner]
      summary: Create an order
      description: >
        The client submits lines with the prices it quoted from its local bundle. **The
        server re-prices every line** and returns both figures.

        Where they differ the order is still accepted at the quoted price and
        `priceVariance` is populated. The client shows nothing; the variance is a finance
        concern, not a cashier concern.

        Offline-capable. The client writes to its local journal, acknowledges the cashier,
        and replays through `/sync/orders` on reconnect.
      tags: [order]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
          headers:
            X-Consistency-Token:
              schema: { type: string }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
