  # ---------------------------------------------------------------- sync
  /sync/orders:
    post:
      operationId: syncOrders
      x-ticvai-consumed-by:
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-014 Sync & reconciliation"
      x-ticvai-audience: [staff]
      summary: Replay orders recorded offline
      description: >
        Ordered batch, processed in `sequence` order, stopping at the first entry that
        cannot be accepted. A void must never be evaluated before the sale it voids.

        Every line is re-priced on ingest. Variances are returned per order and posted to
        the variance account; the client surfaces nothing to the cashier.
      tags: [sync]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
