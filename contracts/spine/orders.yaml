openapi: 3.1.0
info:
  title: TICVAI Order & Payment
  version: 0.1.0
  x-ticvai-screen-count: 20
  x-ticvai-tier: spine
  x-ticvai-module: "2 — Ticketing Sales"
  x-ticvai-requirements: 343
  x-ticvai-capabilities: [C02, C03, C04, C34, C47]
  x-ticvai-platforms:
    - "P04 POS"
    - "P01 Guest Web"
    - "P02 Guest App"
    - "P03 Kiosk"
    - "P10 Partner Portal"
    - "P12 Support Console"
  description: >
    ## What this contract covers

    **Money moves here. One atomic transaction with entitlement and ledger.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 2 — Ticketing Sales |
    | **Requirements** | ~343 |
    | **Capabilities** | C02, C03, C04, C34, C47 |
    | **Consumed by** | P04 POS · P01 Guest Web · P02 Guest App · P03 Kiosk · P10 Partner Portal · P12 Support Console |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Orders, payments, refunds, voids and reservations. Shift and till are separate
    (`shift.yaml`).

    Positions this encodes:

    - **The server re-prices every line on ingest** (ADR-0013). The local price is the
      guest's answer; the server is authoritative for the ledger. Where they disagree the
      quoted price is honoured and a variance is posted — the guest has already paid and
      left, so the ledger records what happened rather than what should have.
    - **Refund thresholds are venue policy, not permission scope** (CF-36). `ORDER_REFUND`
      is binary. How much a holder may refund without a second authoriser is configured per
      venue, because venues run different policies.
    - **Dual-authorisation, not escalation** (2.12.3). Above threshold a second user — cashier
      or supervisor — names themselves as audit control. That is a different mechanism from
      escalating to a higher permission.
    - **Orders never span cells** (ADR-0010). The selling cell owns the order; redemption
      rights propagate.
    - Payment recovery matters more than the happy path. A terminal that charged a card and
      never received a response is the normal failure, not the exotic one.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: order
  - name: b2b
  - name: payment
  - name: refund
  - name: reservation
  - name: policy
  - name: sync

paths:
  /orders:
    get:
      operationId: listOrders
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P01 WEB-019 Order History"
        - "P02 GST-019 Order History (Wallet)"
        - "P04 POS-006 Held Orders"
        - "P08 BO-003 Queue Integration Setup"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-008 Booking Creation"
        - "P10 PTR-015 Order History"
      x-ticvai-read-routing: replica
      summary: List orders
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: principalId
          in: query
          description: Requires ORDER_VIEW_OTHER when not the caller.
          schema: { type: string, format: uuid }
        - name: shiftId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrderSummary' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createOrder
      x-ticvai-consumed-by:
        - "P01 WEB-012 Checkout — Payment"
        - "P02 GST-009 Review & Payment"
        - "P10 PTR-005 Inventory & Allocation View"
        - "P10 PTR-008 Booking Creation"
      summary: Create an order
      description: >
        The client submits lines with the prices it quoted from its local bundle. **The
        server re-prices every line** and returns both figures.

        Where they differ the order is still accepted at the quoted price and
        `priceVariance` is populated. The client shows nothing; the variance is a finance
        concern, not a cashier concern.

        Offline-capable. The client writes to its local journal, acknowledges the cashier,
        and replays through `/sync/orders` on reconnect.
      tags: [order]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
          headers:
            X-Consistency-Token:
              schema: { type: string }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            A lease covering a line has expired, capacity is exhausted, or the catalogue
            bundle the client priced from is beyond its staleness bound.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getOrder
      x-ticvai-consumed-by:
        - "P01 WEB-013 Order Confirmation"
        - "P02 GST-010 Booking Confirmation"
        - "P05 KSK-009 Ticket issued"
        - "P05 KSK-012 Booking found"
      x-ticvai-read-routing: primary
      summary: Read an order
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/hold:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: holdOrder
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
      summary: Park a sale and free the till
      description: >
        The guest has gone to fetch a wallet, or wants to add something after checking with
        someone. The cashier parks the sale and serves the next person.

        **Not a reservation.** Nothing is held against inventory — a parked sale that reserved
        capacity would let a queue of parked sales exhaust a session. Prices are re-evaluated
        on resume, and a price that moved is surfaced rather than silently applied.

        Held orders expire. A till that accumulates parked sales across a shift cannot be
        closed, and the cashier who parked them has gone home.
      tags: [order]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordedAt]
              properties:
                label:
                  type: string
                  maxLength: 60
                  description: >
                    How the cashier will find it again — a name, a description, a party size.
                    A list of unlabelled parked sales is unusable at a busy counter.
                holdUntil: { type: string, format: date-time }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Held
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Order is already paid, voided, or contains a seat hold about to expire
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/resume:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: resumeOrder
      x-ticvai-consumed-by:
        - "P04 POS-006 Held Orders"
      summary: Bring a parked sale back to a till
      description: >
        Any till, not only the one that parked it — the cashier who took it may be on a break.

        Prices are re-evaluated. Where a price, a promotion or an availability has moved since
        the hold, the response says so and the cashier decides. Silently charging the old price
        loses money; silently charging the new one loses the guest.
      tags: [order]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resumed, with any change since the hold reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResumeResult' }
        '409':
          description: Held order expired, or already resumed at another till
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/discounts:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: applyManualDiscount
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
      summary: Apply a discount a cashier chose
      description: >
        Distinct from a promotion, which is a rule the platform evaluates. This is a person
        deciding — service recovery, a damaged item, a manager's judgement.

        **Always requires a reason, and above the venue threshold an approver who is not the
        requester.** Manual discount is the most common internal fraud in retail, and the
        control is that every one is attributable and reviewable rather than that they are
        forbidden.

        Posts to a discount account, never as a price change. A line sold at a reduced price
        and a line discounted are different facts, and margin reporting needs both.
      tags: [order]
      x-ticvai-permission: ORDER_DISCOUNT
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualDiscountRequest' }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403':
          description: >
            Above the cashier's limit and no approver supplied, or the approver is the
            requester.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/voids:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: voidOrder
      summary: Void an order
      description: >
        Only before settlement and only within the same shift. After that it is a refund —
        the money has moved.
      tags: [order]
      x-ticvai-permission: ORDER_VOID
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, reason, recordedAt]
              properties:
                id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                reason: { type: string, minLength: 3, maxLength: 500 }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Settled, or from a closed shift. Use a refund.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/refunds:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: listOrderRefunds
      x-ticvai-read-routing: replica
      summary: List refunds against an order
      tags: [refund]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Refunds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }

    post:
      operationId: createRefund
      summary: Refund an order, wholly or in part
      description: >
        **Not offline-capable.** A refund touches the gateway and the ledger; both need the
        network.

        The venue's refund policy determines whether a second authoriser is required. Call
        `/venues/{venueId}/refund-policy` first, or submit without `secondaryAuthorisation`
        and handle the 409 that names the threshold.

        Sequencing is ledger-first: the ledger entry is written, then the gateway is called,
        then the outcome is reconciled. A gateway call that succeeds against an unwritten
        ledger entry is money that left with no record.
      tags: [refund]
      x-ticvai-permission: ORDER_REFUND
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
      responses:
        '202':
          description: >
            Accepted. May be `pendingApproval` where policy requires an approver, or
            `pendingGateway` while the provider is called.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            Second authorisation required and absent, refund window closed, or the amount
            exceeds what remains refundable. The problem detail names the threshold and the
            policy that set it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RefundPolicyProblem' }

  /refunds/{refundId}/approve:
    parameters:
      - name: refundId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: approveRefund
      summary: Approve a refund held for approval
      tags: [refund]
      x-ticvai-permission: ORDER_REFUND_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
                overridePercentage:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: >
                    Approver may override the time-banded refund percentage. Recorded
                    against the approving principal.
      responses:
        '200':
          description: Approved; gateway call proceeds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /refunds/bulk:
    post:
      operationId: createBulkRefund
      x-ticvai-consumed-by:
        - "P08 BO-004 Manual Wait Time Entry"
      summary: Refund every order against an event, performance or date
      description: >
        Cancellation handling. Always requires approval regardless of individual thresholds —
        the aggregate is what matters, not each line.
      tags: [refund]
      x-ticvai-permission: ORDER_REFUND_BULK
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: object
                  properties:
                    performanceId: { type: string, format: uuid }
                    eventId: { type: string, format: uuid }
                    venueId: { type: string, format: uuid }
                    dateFrom: { type: string, format: date }
                    dateTo: { type: string, format: date }
                percentage:
                  type: number
                  minimum: 0
                  maximum: 100
                  default: 100
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '202':
          description: Queued for approval
          content:
            application/json:
              schema:
                type: object
                required: [batchId, affectedOrders, estimatedTotal, status]
                properties:
                  batchId: { type: string }
                  affectedOrders: { type: integer }
                  estimatedTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                  status:
                    type: string
                    enum: [pendingApproval, processing, completed, failed]

  /refund-requests:
    post:
      operationId: createRefundRequest
      security:
        - guestAuth: []
      x-ticvai-self-scoped: subject
      summary: Guest-initiated refund request
      description: >
        Raised from the guest app. Enters the operations approval queue rather than
        refunding directly — a guest cannot self-serve money out of the ledger.

        **The order must belong to the authenticated subject.** A request against another
        guest's order is rejected with 403, not queued for someone to notice later.
      tags: [refund]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, reason]
              properties:
                orderId: { type: string }
                lineIds:
                  type: array
                  items: { type: string }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '403':
          description: Order does not belong to the authenticated subject
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '202':
          description: Submitted to the approval queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status:
                    type: string
                    enum: [submitted, moreInfoRequested, approved, declined]

  /venues/{venueId}/refund-policy:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRefundPolicy
      x-ticvai-consumed-by:
        - "P08 BO-003 Queue Integration Setup"
      x-ticvai-read-routing: replica
      summary: Read a venue's refund policy
      description: >
        Thresholds and time bands are venue configuration, not permission scope (CF-36).
        Cached locally so a terminal can present the right prompt before it calls.
      tags: [policy]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPolicy' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
    put:
      operationId: setRefundPolicy
      x-ticvai-config-scope: venue
      summary: Set a venue's refund policy
      tags: [policy]
      x-ticvai-permission: REGION_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPolicy' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPolicy' }

  # ---------------------------------------------------------------- payment
  /payments:
    post:
      operationId: createPayment
      x-ticvai-consumed-by:
        - "P01 WEB-012 Checkout — Payment"
        - "P01 WEB-014 Payment Link Landing"
        - "P02 GST-033 AI Concierge – Contextual Help"
        - "P04 POS-005 Payment"
        - "P05 KSK-007 Payment"
        - "P10 PTR-012 Checkout / Credit Purchase"
      summary: Take a payment against an order
      description: >
        Cash is offline-capable. Card, wallet and voucher are not — they need the gateway.

        A card payment returns `pendingConfirmation` when the terminal has been instructed
        but no result has arrived. **Do not assume failure.** Poll `/payments/{id}/inquiry`.
      tags: [payment]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '402':
          description: Declined by the provider
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: Tender unavailable offline, or amount exceeds the balance due
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /payments/{paymentId}/inquiry:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: inquirePaymentStatus
      x-ticvai-consumed-by:
        - "P01 WEB-012 Checkout — Payment"
        - "P04 POS-005 Payment"
        - "P05 KSK-008 Payment unresolved"
      summary: Ask the provider what actually happened
      description: >
        The recovery path (12 Aug §12). A terminal charged the card and the response never
        arrived — the guest has been charged and the order shows unpaid.

        This queries the provider directly and reconciles. A background reconciler runs the
        same operation for payments left unconfirmed past a threshold, so recovery does not
        depend on an operator noticing.
      tags: [payment]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Reconciled against the provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '503':
          description: Provider unreachable. Retry; do not assume an outcome.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /payments/{paymentId}/tip:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: addTip
      x-ticvai-consumed-by:
        - "P04 POS-005 Payment"
      summary: Record a tip against a payment
      description: >
        A separate operation rather than a line on the order, because a tip is not revenue —
        it is money held for staff and posts to a liability, not to sales. Treating it as a
        line inflates takings and understates what is owed.

        Where the terminal captured the tip, this records what it reported. Where the guest
        wrote it on a slip, a cashier enters it, and that path needs the same attribution as
        a manual discount.
      tags: [payment]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, source, recordedAt]
              properties:
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                source:
                  type: string
                  enum: [terminalPrompt, cashierEntered, guestApp, serviceCharge]
                  description: >
                    `serviceCharge` is not a tip and is separated deliberately — it is revenue
                    in most jurisdictions, and pooling it with tips is how a payroll dispute
                    starts.
                allocateToPrincipalId:
                  type: string
                  format: uuid
                  description: Where the venue allocates rather than pools.
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409':
          description: Payment not settled, or a tip is already recorded against it
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /payments/{paymentId}/capture:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: capturePayment
      summary: Capture a previously authorised payment
      tags: [payment]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }

  # ---------------------------------------------------------------- reservations
  /reservations/{reservationId}/convert:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: convertReservation
      summary: Convert a reservation into an order
      tags: [reservation]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Converted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Expired or already converted
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- sync
  /sync/orders:
    post:
      operationId: syncOrders
      summary: Replay orders recorded offline
      description: >
        Ordered batch, processed in `sequence` order, stopping at the first entry that
        cannot be accepted. A void must never be evaluated before the sale it voids.

        Every line is re-priced on ingest. Variances are returned per order and posted to
        the variance account; the client surfaces nothing to the cashier.
      tags: [sync]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, orders]
              properties:
                deviceId: { type: string, format: uuid }
                orders:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/OfflineOrder' }
      responses:
        '200':
          description: Batch processed, wholly or up to the first rejection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderSyncResult' }

  /sync/rejections:
    get:
      operationId: listSyncRejections
      x-ticvai-consumed-by:
        - "P07 SCN-014 Sync & reconciliation"
      x-ticvai-read-routing: replica
      summary: Entries the server refused
      description: >
        Needs operator attention. These will not retry — surfacing them is the difference
        between a reconciliation task and silent data loss behind an "all synced" indicator.
      tags: [sync]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: workstationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Rejections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SyncRejection' }

  /orders/{orderId}/modify:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: modifyOrder
      x-ticvai-consumed-by:
        - "P01 WEB-023 Membership Management"
      summary: Add or remove lines on an existing order
      description: >
        Adding a line charges the difference; removing one refunds it under the venue's refund
        policy. **A modification is not a void and re-sale** — the order number, the guest's
        booking reference and the entitlements already issued all survive.

        Lines whose entitlement has been redeemed cannot be removed. The guest has used it.
      tags: [order]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyOrderRequest' }
      responses:
        '200':
          description: Modified, with the balance to settle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderModificationResult' }
        '409':
          description: >
            A targeted line's entitlement has been redeemed, or the order is voided.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /media/{mediaCode}/entitlements:
    parameters:
      - name: mediaCode
        in: path
        required: true
        schema: { type: string }
        description: The QR, wristband or card the guest is already carrying.
    get:
      operationId: getMediaEntitlements
      x-ticvai-consumed-by:
        - "P04 POS-010 Add to Existing Ticket"
      summary: What is already on this media
      description: >
        Scanned at a counter before adding something. Shows what the guest holds so a cashier
        does not sell a locker to someone who already has one.
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: What the media carries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaEntitlements' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    post:
      operationId: appendEntitlementToMedia
      x-ticvai-consumed-by:
        - "P04 POS-010 Add to Existing Ticket"
      summary: Add something to a ticket the guest already holds
      description: >
        A guest arrives, buys admission, and an hour later wants a locker. They scan the QR
        they are already carrying and the locker attaches to it. **No second QR.**

        Named as important on 14 August: *"I don't need to give another QR code for the locker.
        I will use the same QR code and I can go and scan it in the locker."*

        This creates a **new order** that issues entitlements onto **existing media**. The
        original order is untouched — it was paid, receipted and possibly reported on, and
        editing it to add a later purchase would make yesterday's revenue move.

        The media is the join, not the order. That is why this operation is keyed on
        `mediaCode` rather than on an order id: the guest has the wristband in their hand and
        may not know which order issued it.
      tags: [order]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendEntitlementRequest' }
      responses:
        '201':
          description: >
            Appended. Returns the new order and the media's full entitlement set, so the
            cashier can tell the guest what their QR now does.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppendEntitlementResult' }
        '409':
          description: >
            Media expired, blocked, already surrendered at exit, or the entitlement cannot
            share media — a single-entry ticket surrendered at the gate is not a claim token
            for anything bought afterwards.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AppendRefusedProblem' }
        '404':
          description: Media not recognised at this venue
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/exchanges:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: exchangeOrderLines
      summary: Exchange lines for different products or dates
      description: >
        A date change, a tier upgrade, a different performance. **Settles only the
        difference** — modelled as separate refund and sale, a guest exchanging a date can end
        up refunded and then unable to rebook when the new date turns out to be full.

        The replacement is held before the original is released, never the other way round.
      tags: [order]
      x-ticvai-permission: ORDER_EXCHANGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeOrderRequest' }
      responses:
        '200':
          description: Exchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderExchangeResult' }
        '409':
          description: >
            Replacement unavailable, outside the exchange window, or the original is redeemed.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/reschedule:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: rescheduleOrder
      summary: Move an order to another performance
      description: >
        The common case of an exchange, and worth its own operation because it is what a call
        centre agent does forty times a day. Same product, different date or time.

        Where the new performance is priced differently, the balance settles as for an
        exchange. Where the venue charges a rescheduling fee, it appears as a line.
      tags: [order]
      x-ticvai-permission: ORDER_RESCHEDULE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPerformanceId, recordedAt]
              properties:
                targetPerformanceId: { type: string, format: uuid }
                lineIds:
                  type: array
                  description: Omit to move the whole order.
                  items: { type: string }
                waiveFee: { type: boolean, default: false }
                reason: { type: string, maxLength: 500 }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Rescheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderExchangeResult' }
        '409':
          description: Target performance is unavailable or outside the reschedule window
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/reprints:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: reprintOrder
      x-ticvai-consumed-by:
        - "P01 WEB-013 Order Confirmation"
        - "P05 KSK-010 Print failure"
        - "P10 PTR-016 Voucher / Ticket Download"
      summary: Reprint or resend tickets
      description: >
        Reprint count is recorded per line. Repeated reprints on one order is a signal worth
        surfacing — usually a printer fault, occasionally something else.
      tags: [order]
      x-ticvai-permission: ORDER_REPRINT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery]
              properties:
                delivery:
                  type: string
                  enum: [print, email, sms, whatsapp, wallet]
                destination: { type: string }
                lineIds:
                  type: array
                  items: { type: string }
                reason:
                  type: string
                  enum: [printerFault, guestRequest, lostTicket, notReceived, other]
      responses:
        '200':
          description: Reissued
          content:
            application/json:
              schema:
                type: object
                properties:
                  reprintCount: { type: integer }
                  reissuedTicketIds:
                    type: array
                    items: { type: string }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }

  /orders/{orderId}/transfer:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: transferOrderTickets
      summary: Transfer tickets to another guest
      description: >
        Per-ticket, not whole-order — a family splitting tickets between two phones is the
        normal case.

        The recipient receives a claim link. **Ownership moves only when they claim it**, so a
        transfer to a mistyped address expires rather than stranding the ticket somewhere
        nobody can reach.
      tags: [order]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketIds, recipient]
              properties:
                ticketIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                recipient:
                  type: object
                  required: [channel, address]
                  properties:
                    channel:
                      type: string
                      enum: [email, sms, whatsapp]
                    address: { type: string }
                message: { type: string, maxLength: 500 }
      responses:
        '202':
          description: Transfer offered, pending claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTransfer' }
        '409':
          description: >
            Ticket already redeemed, already offered, or the product forbids transfer.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /ticket-transfers/{transferId}/claim:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: claimTicketTransfer
      summary: Claim transferred tickets
      tags: [order]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimToken]
              properties:
                claimToken: { type: string }
      responses:
        '200':
          description: Claimed. Ownership moves now, not at offer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTransfer' }
        '410':
          description: Offer expired or already claimed
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/statement:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getOrderStatement
      x-ticvai-consumed-by:
