          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/statement:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getOrderStatement
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-006 Held Orders"
        - "P06 EMP-014 Ticket lookup"
        - "P06 EMP-034 Walk-up sale"
        - "P08 BO-003 Queue Integration Setup"
        - "P08 BO-022 Order Detail"
        - "P08 BO-023 Refunds & Exchanges"
        - "P08 BO-026 Group Bookings"
        - "P08 BO-047 F&B Order Management"
        - "P08 BO-051 Purchase Orders"
        - "P08 BO-070 Work Orders"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-005 Inventory & Allocation View"
        - "P10 PTR-008 Booking Creation"
        - "P10 PTR-015 Order History"
        - "P10 PTR-016 Voucher / Ticket Download"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: primary
      summary: Full financial history of an order
      description: >
        Every payment, refund, void, modification and exchange in sequence, with the running
        balance. What a call centre agent reads to a guest asking why they were charged twice.
      tags: [order]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderStatement' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /reservations:
    get:
      operationId: listReservations
      x-ticvai-consumed-by:
        - "P01 WEB-031 My Reservations"
        - "P02 GST-016 My Reservations"
      x-ticvai-audience: [staff, guest]
      x-ticvai-read-routing: replica
      summary: List reservations
      tags: [reservation]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [held, converted, expired, cancelled] }
        - name: expiringWithinMinutes
          in: query
          schema: { type: integer }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Reservation' }

    post:
      operationId: createReservation
      x-ticvai-audience: [staff]
      summary: Hold without payment
      description: >
        A reservation is not an order. It holds capacity, expires, creates no entitlement
        and posts nothing to the ledger.
      tags: [reservation]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '201':
          description: Held
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '409':
          description: Capacity unavailable
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
  /reservations/{reservationId}:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getReservation
      x-ticvai-consumed-by:
        - "P01 WEB-031 My Reservations"
        - "P02 GST-016 My Reservations"
        - "P02 GST-017 Reservation Details"
      x-ticvai-audience: [staff, guest]
      x-ticvai-read-routing: primary
      summary: Read a reservation
      tags: [reservation]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    delete:
      operationId: cancelReservation
      x-ticvai-consumed-by:
        - "P01 WEB-031 My Reservations"
        - "P02 GST-016 My Reservations"
        - "P02 GST-017 Reservation Details"
      x-ticvai-audience: [staff, guest]
      summary: Cancel a reservation
      description: Releases held capacity immediately rather than waiting for expiry.
      tags: [reservation]
      x-ticvai-permission: ORDER_CANCEL
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Cancelled }
        '409':
          description: Already converted
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /reservations/{reservationId}/extend:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: extendReservation
      x-ticvai-audience: [staff]
      summary: Extend a reservation
      description: >
        Bounded by the venue's maximum, so a reservation cannot be renewed indefinitely
        against a busy performance.
      tags: [reservation]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Extended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '409':
          description: Expired, or the extension limit is reached
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /b2b-accounts/{accountId}/credit:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getB2bCredit
      x-ticvai-consumed-by:
        - "P10 PTR-001 Partner Login / MFA"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-013 Credit Limit & Balance"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: replica
      summary: Partner credit position
      description: >
        Limit, used, available, and orders outstanding. Checked before a partner order is
        accepted on credit terms.
      tags: [b2b]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Credit position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPosition' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    put:
      operationId: setB2bCreditLimit
      x-ticvai-consumed-by:
        - "P10 PTR-001 Partner Login / MFA"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-013 Credit Limit & Balance"
      x-ticvai-audience: [staff, partner]
      summary: Set a partner credit limit
      description: >
        Reducing a limit below the amount already used is permitted — it stops further
        drawdown without unwinding orders that exist. Refusing it would mean a partner in
        trouble keeps their full limit.
      tags: [b2b]
      x-ticvai-permission: CREDIT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditLimit, reason]
              properties:
                creditLimit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                paymentTermsDays: { type: integer, minimum: 0 }
                isSuspended: { type: boolean }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPosition' }

  /b2b-accounts/{accountId}/credit/override:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: overrideCreditLimit
      x-ticvai-consumed-by:
        - "P10 PTR-001 Partner Login / MFA"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-013 Credit Limit & Balance"
      x-ticvai-audience: [staff, partner]
      summary: Authorise an order beyond the credit limit
      description: >
        Supervisor override for a single order (2.7.39). Records the authorising principal,
        the amount and a reason — a partner allowed past their limit is a decision someone
        owns.
      tags: [b2b]
      x-ticvai-permission: CREDIT_OVERRIDE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, amount, reason]
              properties:
                orderId: { type: string }
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                reason: { type: string, minLength: 3, maxLength: 500 }
                expiresAt: { type: string, format: date-time }
      responses:
        '200':
          description: Override recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPosition' }

components:
  schemas:
    ModifyOrderRequest:
      type: object
      required: [id, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        addLines:
          type: array
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        removeLineIds:
          type: array
          items: { type: string }
        reason: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    OrderModificationResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [order, balanceDue]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        addedValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        removedValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        balanceDue:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Positive means the guest pays; negative means a refund is due.
        refundId: { type: string, nullable: true }
        revokedEntitlementIds:
          type: array
          items: { type: string }
        issuedEntitlementIds:
          type: array
          items: { type: string }

    ExchangeOrderRequest:
      type: object
      required: [id, outgoingLineIds, incomingLines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        outgoingLineIds:
          type: array
          minItems: 1
          items: { type: string }
        incomingLines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        waiveFee: { type: boolean, default: false }
        reason: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    OrderExchangeResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [orderId, outgoingValue, incomingValue, difference]
      properties:
        orderId: { type: string }
        outgoingValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        incomingValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        exchangeFee: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        difference:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Only the difference settles. The replacement is held before the original is
            released, never the other way round.
        newLineIds:
          type: array
          items: { type: string }
        revokedEntitlementIds:
          type: array
          items: { type: string }
        issuedEntitlementIds:
          type: array
          items: { type: string }

    TicketTransfer:
      x-ticvai-persistence: "orders.ticket_transfer"
      type: object
      required: [id, orderId, ticketIds, status, offeredAt, expiresAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        ticketIds:
          type: array
          items: { type: string }
        fromSubjectId: { type: string, format: uuid }
        toSubjectId:
          type: string
          format: uuid
          nullable: true
          description: Set only on claim. Ownership moves then, not at offer.
        recipientAddressMasked: { type: string }
        status:
          type: string
          enum: [offered, claimed, expired, cancelled]
        claimUrl: { type: string, nullable: true }
        offeredAt: { type: string, format: date-time }
        claimedAt: { type: string, format: date-time, nullable: true }
        expiresAt:
          type: string
          format: date-time
          description: >
            An unclaimed transfer expires and the tickets return. A transfer to a mistyped
            address must not strand a ticket somewhere nobody can reach.

    OrderStatement:
      x-ticvai-persistence: "none — computed from order, payment, refund and ledger"
      type: object
      required: [orderId, orderNumber, currency, entries, currentBalance]
      properties:
        orderId: { type: string }
        orderNumber: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer }
        entries:
          type: array
          description: Sequential. What an agent reads to a guest asking about a charge.
          items:
            type: object
            required: [kind, amount, runningBalance, occurredAt]
            properties:
              kind:
                type: string
                enum: [sale, payment, refund, void, modification, exchange, fee, variance, chargeback]
              description: { type: string }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              runningBalance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              referenceId: { type: string, nullable: true }
              principalId: { type: string, format: uuid, nullable: true }
              occurredAt: { type: string, format: date-time }
        totalPaid: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        totalRefunded: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        currentBalance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Positive means the guest owes; negative means a refund is outstanding.

    CreditPosition:
      x-ticvai-persistence: "orders.b2b_credit + orders.credit_override"
      type: object
      required: [accountId, creditLimit, used, available, isSuspended]
      properties:
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        creditLimit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        used: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        available: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        isOverLimit: { type: boolean }
        isSuspended: { type: boolean }
        paymentTermsDays: { type: integer }
        oldestUnpaidInvoiceAt: { type: string, format: date-time, nullable: true }
        daysOverdue: { type: integer }
        activeOverrides:
          type: array
          items:
            type: object
            properties:
              orderId: { type: string }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              authorisedByPrincipalId: { type: string, format: uuid }
              reason: { type: string }
              expiresAt: { type: string, format: date-time, nullable: true }

    EntitlementStatus:
      type: string
      description: >
        **What the storage layer holds, and what a guest is shown.** `MediaEntitlements` carried
        only `isValid` and a reason string — a boolean cannot distinguish a ticket that was used
        from one that expired, was refunded, or was transferred to somebody else, and those are
        four different conversations at a gate.

        Added 17 August. `states/entitlement.yaml` had modelled these six since 14 August and
        the contract had no enum behind it, which the state checker reported correctly for three
        days.
      enum:
        - issued
        - partiallyConsumed
        - fullyConsumed
        - expired
        - cancelled
        - surrendered

    EntitlementSummary:
      type: object
      x-ticvai-persistence: "catalogue.entitlement_template"
      description: >
        One entitlement on a piece of media, as a guest or a steward sees it.
      required: [entitlementId, status]
      properties:
        entitlementId: { type: string, format: uuid }
        productName: { type: string }
        status: { $ref: '#/components/schemas/EntitlementStatus' }
        entriesAllowed: { type: integer, nullable: true }
        entriesUsed: { type: integer }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        transferredToSubjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            Set where `surrendered`. **A guest whose ticket is gone should be told who has it**,
            not shown an invalid pass with no explanation.

    MediaEntitlements:
      type: object
      x-ticvai-persistence: "none — projection over entitlement and scan history"
      required: [mediaCode, isValid, entitlements]
      properties:
        mediaCode: { type: string }
        mediaKind:
          type: string
          enum: [qr, wristband, card, nfc, mobilePass]
        subjectId: { type: string, format: uuid, nullable: true }
        isValid: { type: boolean }
        invalidReason: { type: string, nullable: true }
        canAcceptMore:
          type: boolean
          description: >
            False where the media has been surrendered, expired or blocked. A cashier should
            know before taking money, not after.
        entitlements:
          type: array
          items:
            type: object
            properties:
              entitlementId: { type: string }
              name: { type: string }
              kind:
                type: string
                enum: [admission, locker, fnb, retail, parking, rental, experience, membership]
              orderId: { type: string }
              addedAt: { type: string, format: date-time }
              status:
                allOf:
                  - $ref: '#/components/schemas/EntitlementStatus'
                description: >
                  **Replaced `isRedeemed` on 17 August.** A boolean could not distinguish a
                  ticket that was used from one that expired, was refunded, or was transferred —
                  four different conversations at a gate, and the steward could see only "not
                  valid".
              entriesUsed: { type: integer }
              entriesAllowed: { type: integer, nullable: true }
              redeemedAt: { type: string, format: date-time, nullable: true }
              transferredToSubjectId:
                type: string
                format: uuid
                nullable: true
              validTo: { type: string, format: date-time, nullable: true }

    AppendEntitlementRequest:
      type: object
      x-ticvai-persistence: "none — request only"
      required: [id, lines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              performanceId: { type: string, format: uuid, nullable: true }
        paymentMethod:
          type: string
          enum: [card, cash, wallet, giftCard, chargeToAccount]
        note: { type: string, maxLength: 300 }
        recordedAt: { type: string, format: date-time }

    AppendEntitlementResult:
      type: object
      x-ticvai-persistence: "none — computed"
      required: [order, media]
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/Order'
          description: >
            A **new** order. The original is untouched — it was paid, receipted and possibly
            reported on, and editing it would move yesterday's revenue.
        media:
          allOf:
            - $ref: '#/components/schemas/MediaEntitlements'
          description: The full set now on the media, so the cashier can say what the QR does.
        addedEntitlementIds:
          type: array
          items: { type: string }

    AppendRefusedProblem:
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          x-ticvai-persistence: "none — error shape"
          properties:
            refusedReason:
              type: string
              enum:
                - mediaExpired
                - mediaBlocked
                - mediaSurrendered
                - entitlementCannotShareMedia
                - venueMismatch
                - guestAlreadyDeparted
            mediaCode: { type: string }
            detail: { type: string }

    OrderResumeResult:
      type: object
      x-ticvai-persistence: "none — computed"
      required: [order, hasChanged]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        hasChanged:
          type: boolean
          description: >
            True where anything moved while the sale was parked. The cashier decides — silently
            charging the old price loses money, silently charging the new one loses the guest.
        changes:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [priceChanged, promotionExpired, promotionNowApplies, soldOut, seatHoldExpired, productWithdrawn]
              lineId: { type: string }
              detail: { type: string }
              wasAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              nowAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    ManualDiscountRequest:
      type: object
      x-ticvai-persistence: "none — request only"
      required: [id, reason, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        lineId:
          type: string
          nullable: true
          description: Omit to discount the order rather than a line.
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        percentage: { type: number, minimum: 0, maximum: 100 }
        reason:
          type: string
          minLength: 3
          maxLength: 300
          description: >
            Required, and free text rather than a code list. A cashier forced to pick the
            nearest reason picks the first one, and the register stops meaning anything.
        reasonCode:
          type: string
          nullable: true
          description: Optional alongside the free text, where the venue maintains a list.
        approverPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: Required above the venue threshold. May not be the requester.
        recordedAt: { type: string, format: date-time }

    OrderChannel:
      type: string
      description: >
        Where the order originated. Added when guest self-ordering was contracted — an order a
        guest placed on their own phone is commercially and operationally different from one a
        cashier typed, and reporting that cannot separate them cannot answer whether
        self-ordering is working.
      enum: [pos, kiosk, guestApp, guestWeb, callCentre, partner, api, backOffice]

    OrderStatus:
      type: string
      enum: [pending, held, paid, partiallyPaid, completed, voided, refunded, partiallyRefunded, failed]
      description: >
        `held` is a parked sale — the cashier freed the till and the guest will return. It
        holds no inventory and expires, because a till that accumulates parked sales across a
        shift cannot be closed.

    Channel:
      type: string
      enum: [pos, kiosk, web, mobile, b2b, ota, callCentre]

    TenderKind:
      type: string
      enum: [cash, card, wallet, voucher, bankTransfer, hotelCharge, installment, giftCard, complimentary]

    CreateOrderRequest:
      type: object
      required: [id, venueId, channel, lines, recordedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Client-generated ULID. Also the idempotency key.
        venueId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        shiftId: { type: string }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: Null for an anonymous sale. Identity and entitlement are separate.
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells.
        catalogueBundleVersion:
          type: string
          description: >
            The bundle the client priced from. Lets the server explain a variance rather than
            merely report one.
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        recordedAt: { type: string, format: date-time }

    CreateOrderLine:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, variantId, quantity, quotedUnitPrice]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        variantId: { type: string, format: uuid }
        performanceId: { type: string, format: uuid }
        leaseId:
          type: string
          nullable: true
          description: Lease the units were drawn from. Absent for uncontended products.
        seatIds:
          type: array
          items: { type: string }
          description: Seated products only. Not available offline.
        quantity: { type: integer, minimum: 1 }
        quotedUnitPrice:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: What the client charged, from its local bundle.
        holderName: { type: string, nullable: true }
        dataMaskValues:
          type: object
          additionalProperties: true

    OrderLine:
      x-ticvai-persistence: "orders.order_line"
      allOf:
        - $ref: '#/components/schemas/CreateOrderLine'
        - type: object
          required: [serverUnitPrice, taxAmount, netAmount, grossAmount]
          properties:
            serverUnitPrice:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: What the server computed on ingest.
            priceVariance:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: >
                Server minus quoted. Non-zero means the quoted price was honoured and the
                difference posted to the variance account.
            taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            netAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            entitlementIds:
              type: array
              items: { type: string }
            crossCellRightIds:
              type: array
              items: { type: string }
              description: Redemption rights propagated to other cells for this line.

    CartStatus:
      type: string
      enum: [active, expiring, expired, abandoned, checkedOut]

    CartLine:
      type: object
      x-ticvai-persistence: "orders.cart_line"
      required: [id, variantId, quantity]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productName: { type: string, readOnly: true }
        quantity: { type: integer, minimum: 1 }
        performanceId: { type: string, format: uuid, nullable: true }
        seatIds:
          type: array
          items: { type: string, format: uuid }
        unitPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        lineTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        leaseId:
          type: string
          format: uuid
          nullable: true
          description: >
            The capacity held for this line. **Null for a product with no capacity** — a
            t-shirt needs stock, not a lease.
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Shown to the guest. *"Your seats are held for 6 minutes"* is better than discovering
            it at checkout.
        isAvailable:
          type: boolean
          readOnly: true
          description: >
            Re-checked on every read. **A line can become unavailable while the cart sits** —
            a lease expiring is not the same as the product selling out, and both land here.

    CartConflict:
      type: object
      x-ticvai-persistence: "none — computed on read"
      description: >
        2.9.5. Golf at 13:00 and karting at 13:00 for the same guest. **A prompt, not a
        refusal** — a party of four may legitimately split, and refusing would be wrong more
        often than right.
      properties:
        kind: { type: string, enum: [overlappingTime, sameSessionDifferentVenue, exceedsPartySize, requiresPrerequisite] }
        lineIds:
          type: array
          items: { type: string, format: uuid }
        message: { type: string }
        isBlocking:
          type: boolean
          description: >
            Most are not. `requiresPrerequisite` is — an add-on with no ticket to attach to
            cannot be sold.

    Cart:
      type: object
      x-ticvai-persistence: "orders.cart"
      required: [id, venueId, channel, status, lines]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          readOnly: true
          description: >
            **How an anonymous guest returns to their cart**, including from a recovery email.
            Rotated on claim, so a link shared before signing in does not reach the account
            after.
        venueId: { type: string, format: uuid }
        channel: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: Null while anonymous. Set by `claimCart`.
        status: { $ref: '#/components/schemas/CartStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/CartConflict' }
        subtotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        discountTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        total: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        appliedPromotionIds:
          type: array
          description: >
            **Re-evaluated on every read.** A promotion that expired while the cart sat must not
            still be applied at checkout, and a promotion that became applicable should be.
          items: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: The earliest lease expiry in the cart, or the cart's own window where it holds none.
        extensionsUsed: { type: integer, readOnly: true }
        maxExtensions: { type: integer, readOnly: true }
        locale: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddCartLineRequest:
      type: object
      x-ticvai-persistence: "none — request only"
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        performanceId: { type: string, format: uuid }
        seatIds:
          type: array
          items: { type: string, format: uuid }
        parentLineId:
          type: string
          format: uuid
          nullable: true
          description: >
            For an add-on attaching to a ticket already in the cart. **Removing the parent
            removes the child** — a locker with no admission is not a sale.
        attributes:
          type: object
          additionalProperties: true

    CartMergeResult:
      type: object
      x-ticvai-persistence: "none — computed"
      required: [cart]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        mergedLineCount: { type: integer }
        droppedLines:
          type: array
          description: >
            **Reported, never silent.** Lines that could not be re-leased on merge are named, so
            a guest signing in is told what they lost rather than discovering it at checkout.
          items:
            type: object
            properties:
              productName: { type: string }
              reason: { type: string, enum: [noCapacity, expired, notSellableOnChannel, duplicate] }

    AbandonedCart:
      type: object
      x-ticvai-persistence: "none — a projection of orders.cart"
      properties:
        cartId: { type: string, format: uuid }
        token: { type: string }
        subjectId: { type: string, format: uuid, nullable: true }
        hasContactPoint:
          type: boolean
          description: >
            **An anonymous cart with no email cannot be recovered.** Worth counting, because it
            sizes what a sign-in prompt earlier in the journey would be worth.
        venueId: { type: string, format: uuid }
        lineCount: { type: integer }
        value: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        topProductName: { type: string }
        abandonedAt: { type: string, format: date-time }
        remindersSent: { type: integer }

    Order:
      x-ticvai-persistence: "orders.sales_order + orders.order_line"
      type: object
      required: [id, venueId, scopePath, channel, status, currency, currencyScale, grossAmount, taxAmount, netAmount, lines, createdAt, recordedAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        channel:
          allOf:
            - $ref: '#/components/schemas/OrderChannel'
          description: >
            Where it came from. Drives revenue attribution, promotion eligibility and the
            self-service adoption figures the operator will ask for within a month of launch.
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer, minimum: 0, maximum: 4 }
        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        netAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        totalPriceVariance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Sum across lines. Zero on a normal order.
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        principalId: { type: string, format: uuid }
        workstationId: { type: string, format: uuid }
        shiftId: { type: string, nullable: true }
        subjectId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }

    OrderSummary:
      x-ticvai-persistence: "none — projection"
      type: object
      required: [id, orderNumber, status, grossAmount, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        channel: { $ref: '#/components/schemas/Channel' }
        lineCount: { type: integer }
        createdAt: { type: string, format: date-time }

    RefundPolicy:
      x-ticvai-persistence: "orders.refund_policy"
      type: object
      description: >
        Venue-configured. Thresholds are policy, not permission scope — venues run different
        policies and the permission model should not encode commercial rules.
      required: [venueId, selfAuthoriseLimit, requiresApprovalAbove]
      properties:
        venueId: { type: string, format: uuid }
        selfAuthoriseLimit:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Up to this, a holder of ORDER_REFUND refunds alone. Zero means every refund
            needs a second authoriser.
        requiresSecondUserAbove:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Above this, a second user — cashier OR supervisor — names themselves as audit
            control. Dual-authorisation, not escalation (2.12.3).
        requiresApprovalAbove:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Above this, an ORDER_REFUND_APPROVE holder must approve.
        timeBands:
          type: array
          description: >
            Refundable percentage by time before the performance. Evaluated most-specific
            first.
          items:
            type: object
            required: [hoursBefore, percentage]
            properties:
              hoursBefore: { type: integer, minimum: 0 }
              percentage: { type: number, minimum: 0, maximum: 100 }
        allowPartial: { type: boolean, default: true }
        refundWindowDays: { type: integer, nullable: true }
        varianceThreshold:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Price variance above this is an exception requiring review rather than a routine
            posting (CF-38). Venue-configured.

    RefundPolicyProblem:
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            requiredAuthorisation:
              type: string
              enum: [secondUser, approval]
            threshold: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            policyVenueId: { type: string, format: uuid }

    CreateRefundRequest:
      type: object
      required: [id, amount, reason, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        lineIds:
          type: array
          items: { type: string }
          description: Omit to refund the whole order.
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        reason: { type: string, minLength: 3, maxLength: 500 }
        secondaryAuthorisation:
          type: object
          description: >
            Required above the venue's `requiresSecondUserAbove`. A second user — cashier or
            supervisor — names themselves. This is dual-authorisation, not escalation.
          required: [principalId, credential]
          properties:
            principalId: { type: string, format: uuid }
            credential: { type: string, maxLength: 512 }
        refundToOriginalTender: { type: boolean, default: true }
        alternateTender: { $ref: '#/components/schemas/TenderKind' }
        recordedAt: { type: string, format: date-time }

    Refund:
      x-ticvai-persistence: "orders.refund"
      type: object
      required: [id, orderId, amount, status, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        appliedPercentage:
          type: number
          description: From the venue's time bands, or an approver override.
        status:
          type: string
          enum: [pendingApproval, pendingGateway, completed, declined, failed]
        reason: { type: string }
        requestedByPrincipalId: { type: string, format: uuid }
        secondaryPrincipalId: { type: string, format: uuid, nullable: true }
        approvedByPrincipalId: { type: string, format: uuid, nullable: true }
        ledgerEntryId:
          type: string
          nullable: true
          description: Written before the gateway is called.
        gatewayReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    CreatePaymentRequest:
      type: object
      required: [id, orderId, tender, amount, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        orderId: { type: string }
        tender: { $ref: '#/components/schemas/TenderKind' }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        tenderedAmount:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Cash only. Change is the difference.
        walletAuthorisationId:
          type: string
          nullable: true
          description: Cross-cell wallet hold, where the guest's home cell is elsewhere.
        deviceId: { type: string, format: uuid, nullable: true }
        recordedAt: { type: string, format: date-time }

    Payment:
      x-ticvai-persistence: "orders.payment"
      type: object
      required: [id, orderId, tender, amount, status, recordedAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        tender: { $ref: '#/components/schemas/TenderKind' }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        changeAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        status:
          type: string
          enum: [authorised, captured, pendingConfirmation, declined, failed, voided, refunded]
        providerName: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        lastInquiryAt: { type: string, format: date-time, nullable: true }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }

    CreateReservationRequest:
      type: object
      required: [id, venueId, lines, expiresAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        venueId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        expiresAt: { type: string, format: date-time }

    Reservation:
      x-ticvai-persistence: "orders.reservation"
      type: object
      required: [id, venueId, status, expiresAt, createdAt]
      properties:
        id: { type: string }
        venueId: { type: string, format: uuid }
        status:
          type: string
          enum: [held, converted, expired, cancelled]
        lines:
          type: array
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        convertedOrderId: { type: string, nullable: true }

    OfflineOrder:
      x-ticvai-persistence: "none — client-side journal, not server storage"
      allOf:
        - $ref: '#/components/schemas/CreateOrderRequest'
        - type: object
          required: [sequence, payments]
          properties:
            sequence:
              type: integer
              minimum: 1
              description: Monotonic per device. Processed in this order.
            payments:
              type: array
              items: { $ref: '#/components/schemas/CreatePaymentRequest' }

    OrderSyncResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [accepted, results]
      properties:
        accepted: { type: integer }
        stoppedAtSequence:
          type: integer
          nullable: true
          description: >
            First entry that could not be processed. Null when the batch succeeded. The
            client retries from here and never past it.
        results:
          type: array
          items:
            type: object
            required: [id, sequence, status]
            properties:
              id: { type: string }
              sequence: { type: integer }
              status:
                type: string
                enum: [accepted, duplicate, rejected]
              orderNumber: { type: string, nullable: true }
              priceVariance:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Money'
                description: Posted to the variance account. Not surfaced to the cashier.
              varianceExceedsThreshold:
                type: boolean
                description: True when review is required per the venue's variance threshold.
              error: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    SyncRejection:
      x-ticvai-persistence: "sync.rejection"
      type: object
      required: [id, workstationId, kind, rejectedAt, problem]
      properties:
        id: { type: string }
        workstationId: { type: string, format: uuid }
        kind:
          type: string
          enum: [order, payment, refund, void, scan]
        recordedAt: { type: string, format: date-time }
        rejectedAt: { type: string, format: date-time }
        problem: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        payload:
          type: object
          additionalProperties: true
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedByPrincipalId: { type: string, format: uuid, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
