  /orders/{orderId}/modify:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: modifyOrder
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-006 Held Orders"
        - "P06 EMP-014 Ticket lookup"
        - "P06 EMP-034 Walk-up sale"
        - "P08 BO-003 Queue Integration Setup"
        - "P08 BO-022 Order Detail"
        - "P08 BO-023 Refunds & Exchanges"
        - "P08 BO-026 Group Bookings"
        - "P08 BO-047 F&B Order Management"
        - "P08 BO-051 Purchase Orders"
        - "P08 BO-070 Work Orders"
        - "P10 PTR-002 Partner Dashboard"
        - "P10 PTR-005 Inventory & Allocation View"
        - "P10 PTR-008 Booking Creation"
        - "P10 PTR-015 Order History"
        - "P10 PTR-016 Voucher / Ticket Download"
      x-ticvai-audience: [staff, partner]
      summary: Add or remove lines on an existing order
      description: >
        Adding a line charges the difference; removing one refunds it under the venue's refund
        policy. **A modification is not a void and re-sale** — the order number, the guest's
        booking reference and the entitlements already issued all survive.

        Lines whose entitlement has been redeemed cannot be removed. The guest has used it.
      tags: [order]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
