  /auth/sso/{providerId}/callback:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeSsoAuthorization
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [anonymous]
      summary: Exchange an SSO code for a session
      description: >
        Group-to-role mapping is applied here. **A group with no mapping grants nothing** —
        an unmapped group must never fall back to a default role, or the identity provider
        becomes a way to mint access nobody configured.
      tags: [sso]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
                workstationId: { type: string, format: uuid }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: >
            Authenticated, but no group maps to a role in this tenant. The provider proved
            who they are; it did not grant them anything.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /tenants/sso-config:
    get:
      operationId: getSsoConfig
      x-ticvai-consumed-by:
