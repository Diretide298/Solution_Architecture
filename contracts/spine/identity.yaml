  # ---------------------------------------------------------------- MFA
  /auth/mfa/methods:
    get:
      operationId: listMfaMethods
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
        - "P06 EMP-001 Sign in"
        - "P06 EMP-002 Select venue & role"
        - "P06 EMP-042 Profile"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: replica
      summary: Enrolled MFA methods
      tags: [mfa]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: principal
      responses:
        '200':
          description: Methods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MfaMethod' }

    post:
      operationId: enrolMfaMethod
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      summary: Enrol an MFA method
      description: >
        Returns a secret or challenge to complete enrolment. **The method is not active until
        verified** — enrolling without verifying would lock the principal out of their own
        account.
      tags: [mfa]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: principal
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { $ref: '#/components/schemas/MfaKind' }
                target:
                  type: string
                  description: Phone or email for OTP methods.
      responses:
        '201':
          description: Enrolment started, pending verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrolment' }

  /auth/mfa/methods/{methodId}:
    parameters:
      - name: methodId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: verifyMfaEnrolment
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      summary: Complete enrolment
      tags: [mfa]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: principal
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Active. Recovery codes are returned once and never again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaMethod' }
        '401':
          description: Code invalid
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    delete:
      operationId: removeMfaMethod
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      summary: Remove an MFA method
      description: >
        Refused where it is the only active method and the principal's role requires MFA.
        Removing the last factor from an account that must have one is not a choice the
        account holder gets to make.
      tags: [mfa]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: principal
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Removed }
        '409':
          description: Last remaining method on a role that requires MFA
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /auth/mfa/challenge:
    post:
      operationId: createMfaChallenge
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      summary: Step-up authentication for a sensitive action
      description: >
        Issues a short-lived token proving a factor was presented just now. Consumed by
        operations that require it — high-value refunds, ledger approval, permission grants,
        tenant termination.

        A session that authenticated hours ago is not the same as a person present at the
        keyboard now, and for those actions the difference matters.
      tags: [mfa]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: principal
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  description: What the step-up is for. Recorded in the audit trail.
                methodId: { type: string, format: uuid }
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId: { type: string }
                  expiresAt: { type: string, format: date-time }

  /auth/mfa/challenge/{challengeId}/verify:
    parameters:
      - name: challengeId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: verifyMfaChallenge
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      summary: Complete a step-up challenge
      tags: [mfa]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: principal
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Verified. The step-up token is short-lived and single-purpose
          content:
            application/json:
              schema:
                type: object
                properties:
                  stepUpToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- sessions
  /auth/sessions:
    get:
      operationId: listActiveSessions
      x-ticvai-consumed-by:
        - "P06 EMP-001 Sign in"
        - "P06 EMP-002 Select venue & role"
        - "P06 EMP-042 Profile"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: primary
      summary: List active sessions
      description: >
        Who is logged in, on which workstation, since when. There was previously no way to
        see this — only to terminate a session someone already knew about.
      tags: [session]
      x-ticvai-permission: SESSION_FORCE_LOGOUT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ActiveSession' }

  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      x-ticvai-consumed-by:
        - "P06 EMP-001 Sign in"
        - "P06 EMP-002 Select venue & role"
        - "P06 EMP-042 Profile"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-audience: [staff, partner]
      summary: Revoke every session in scope
      description: >
        Incident response. Requires step-up authentication and a reason, and is recorded
        against the acting principal.

        **Open shifts are reported, not silently orphaned.** Revoking a cashier mid-shift
        leaves cash unreconciled, and whoever pulls this needs to know that before they do.
      tags: [session]
      x-ticvai-permission: SESSION_FORCE_LOGOUT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, stepUpToken]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                stepUpToken: { type: string }
                venueId: { type: string, format: uuid }
                excludeSelf: { type: boolean, default: true }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revokedCount: { type: integer }
                  openShiftsAffected:
                    type: array
                    description: Shifts left open. Cash is unreconciled until someone closes them.
                    items:
                      type: object
                      properties:
                        shiftId: { type: string }
                        workstationId: { type: string, format: uuid }
                        principalId: { type: string, format: uuid }
        '403':
          description: Step-up token missing, expired or issued for a different action
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

components:
  schemas:
    GuestSession:
      x-ticvai-persistence: "none — Redis session registry"
      type: object
      required: [subjectId, tokens, isVerified, expiresAt]
      properties:
        subjectId: { type: string, format: uuid }
        displayName: { type: string, nullable: true }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        isVerified:
          type: boolean
          description: >
            False until an OTP or a verified provider identity confirms ownership. An
            unverified account may browse but not transact.
        identityProviders:
          type: array
          description: Linked providers. Several may resolve to one account.
          items:
            type: string
            enum: [password, otp, apple, google, uaePass]
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells (ADR-0010).
        homeCellName: { type: string, nullable: true }
        preferredLanguage: { type: string, nullable: true }
        expiresAt:
          type: string
          format: date-time
          description: >
            Longer lived than a staff session. No single-session rule — a guest may be signed
            in on a phone and a laptop at once.

    PasswordPolicy:
      type: object
      x-ticvai-persistence: "identity.password_policy"
      description: >
        BL-144. **Settled-lane and never written.** No password policy, no lockout, no forced change
        at first logon anywhere in the package.

        **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition, and forced
        rotation on a schedule makes passwords worse — people increment a digit. Rotation is here
        because some tenants are contractually required to have it, **not because it helps.**
      required: [id, scopePath, minLength]
      properties:
        id: { type: string, format: uuid }
        scopePath: { type: string }
        minLength: { type: integer, default: 12 }
        requireBreachCheck:
          type: boolean
          default: true
          description: >
            **The single most effective rule.** Refusing a password known to be breached stops more
            account takeovers than every composition rule combined.
        maxAgeDays:
          type: integer
          nullable: true
          description: >
            **Null is the recommended value.** Forced rotation produces `Summer2026!` becoming
            `Summer2027!`, and it is offered because some tenants are contractually obliged to have
            it rather than because it works.
        recoveryMethods:
          type: array
          description: >
            BL-132. **A guest locked out had no path back** — lockout existed and recovery did not,
            which turns a forgotten password into a support call.

            **Ordered by strength, and the venue chooses which it offers.** Email is weakest and
            universal; a verified phone is stronger; an in-person check at a desk is strongest and
            only available to a guest who is already at the venue.
          items:
            type: string
            enum: [email, sms, securityQuestions, inPersonVerification, supportAssisted]
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: >
            BL-145. **Null, and that is the decision.** ADR-0004 makes a session a token with a
            validity window and no server-side registry, so counting concurrent sessions would mean
            adding one — **a stateful check on a deliberately stateless design.**

            The requirement asked for it configurable. **Configurable to null is still an answer**,
            and the contradiction is recorded rather than resolved by quietly building a session
            table.
        deviceRestriction:
          type: object
          nullable: true
          description: >
            BL-146. **Device, browser, IP and location restriction on access.** Applies to staff
            principals, not guests — a guest restricted to one device is a guest who cannot use
            their new phone.

            **Warn before block by default.** An IP restriction that blocks silently is a venue
            manager locked out on the day their ISP rotates an address.
          properties:
            allowedIpRanges: { type: array, items: { type: string } }
            allowedCountries: { type: array, items: { type: string } }
            requireRegisteredDevice: { type: boolean, default: false }
            onViolation: { type: string, enum: [warn, requireStepUp, block], default: requireStepUp }
        lockoutAfterAttempts: { type: integer, default: 10 }
        lockoutMinutes:
          type: integer
          default: 15
          description: >
            **A temporary lockout, not a permanent one.** Permanent lockout on failed attempts is a
            denial-of-service anybody can run against a known username.
        forceChangeOnFirstLogon: { type: boolean, default: true }
        reusePreventionCount: { type: integer, default: 5 }
        mfaRequiredForPermissions:
          type: array
          description: >
            **Step-up rather than blanket MFA.** Requiring it for a refund approval and not for
            reading a rota is what stops people sharing devices to avoid it.
          items: { type: string }

    SegregationRule:
      type: object
      x-ticvai-persistence: "identity.segregation_rule"
      description: >
        BL-147, 3.3.31 and 11.1.24. **The package enforced segregation of duties in exactly one
        place** — the product lifecycle guard requiring the approver not be the author — and there
        was no general rule.

        **A conflict is between two permissions held by one principal**, and the check runs at grant
        time rather than at use time: **discovering the conflict when somebody exercises it means
        the conflict already existed.**
      required: [id, permissionA, permissionB, severity]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        permissionA: { type: string }
        permissionB: { type: string }
        severity: { type: string, enum: [block, requireApproval, warn] }
        rationale:
          type: string
          description: >
            **Why these two conflict, in words an auditor reads.** A rule with no rationale is a rule
            somebody removes when it becomes inconvenient.
        allowWithCompensatingControl:
          type: boolean
          default: false
          description: >
            **A small venue cannot always separate duties**, and pretending otherwise means the rule
            gets disabled entirely. A named compensating control is better than no rule.


    RegisterGuestRequest:
      type: object
      required: [identifier, channel]
      properties:
        identifier:
          type: string
          maxLength: 256
          description: Email address or mobile number in E.164.
        channel:
          type: string
          enum: [email, sms, whatsapp]
        displayName: { type: string, maxLength: 200 }
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: Optional. OTP-only accounts are supported and are the default.
        preferredLanguage: { type: string, pattern: '^[a-z]{2}$' }
        consents:
          type: array
          description: Consent captured at registration, recorded with the notice version.
          items:
            type: object
            properties:
              purpose: { type: string }
              granted: { type: boolean }
              noticeVersion: { type: string }

    SsoProtocol:
      type: string
      enum: [oidc, saml2]

    SsoProvider:
      x-ticvai-persistence: "identity.sso_provider"
      type: object
      required: [id, displayName, protocol]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        protocol: { $ref: '#/components/schemas/SsoProtocol' }
        iconAssetRef: { type: string, nullable: true }
        isEnforced:
          type: boolean
          description: True disables password login for principals covered by this provider.

    SsoGroupMapping:
      x-ticvai-persistence: "identity.sso_group_mapping"
      type: object
      required: [externalGroup, roleId]
      properties:
        externalGroup: { type: string }
        roleId: { type: string, format: uuid }
        scopePath:
          type: string
          description: Scope the mapped role is granted at.

    SsoProviderConfig:
      x-ticvai-persistence: "identity.sso_provider"
      type: object
      required: [id, displayName, protocol, groupMappings]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        protocol: { $ref: '#/components/schemas/SsoProtocol' }
        metadataUrl: { type: string, nullable: true }
        issuer: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        clientSecretRef:
          type: string
          nullable: true
          description: Key vault reference. The secret itself is never returned.
        groupMappings:
          type: array
          minItems: 1
          description: >
            **A group with no mapping grants nothing.** No default role, ever — otherwise the
            identity provider becomes a way to mint access nobody configured.
          items: { $ref: '#/components/schemas/SsoGroupMapping' }
        autoProvisionPrincipals:
          type: boolean
          default: false
          description: Create a principal on first successful sign-in.
        isEnforced: { type: boolean, default: false }
        isActive: { type: boolean }

    MfaKind:
      type: string
      enum: [totp, smsOtp, emailOtp, biometric, hardwareToken]

    MfaMethod:
      x-ticvai-persistence: "identity.mfa_method"
      type: object
      required: [id, kind, isActive, enrolledAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MfaKind' }
        label: { type: string, nullable: true }
        maskedTarget:
          type: string
          nullable: true
          description: Partially masked destination, so a person can tell two methods apart.
        isActive: { type: boolean }
        isPrimary: { type: boolean }
        enrolledAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }

    MfaEnrolment:
      x-ticvai-persistence: "none — transient"
      type: object
      required: [methodId, kind]
      properties:
        methodId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MfaKind' }
        secret:
          type: string
          nullable: true
          description: TOTP shared secret. Returned once, at enrolment, and never again.
        qrCodeUri: { type: string, nullable: true }
        recoveryCodes:
          type: array
          description: Returned once on successful verification. Not retrievable afterwards.
          items: { type: string }
        expiresAt: { type: string, format: date-time }

    ActiveSession:
      x-ticvai-persistence: "none — Redis session registry"
      type: object
      required: [sessionId, principalId, startedAt, lastSeenAt]
      properties:
        sessionId: { type: string }
        principalId: { type: string, format: uuid }
        principalName: { type: string }
        roleId: { type: string, format: uuid, nullable: true }
        roleName: { type: string, nullable: true }
        workstationId: { type: string, format: uuid, nullable: true }
        workstationName: { type: string, nullable: true }
        venueId: { type: string, format: uuid, nullable: true }
        ipAddress: { type: string, nullable: true }
        deviceInfo: { type: string, nullable: true }
        hasOpenShift:
          type: boolean
          description: Revoking this session leaves cash unreconciled.
        mfaSatisfied: { type: boolean }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    Principal:
      x-ticvai-persistence: "identity.principal"
      type: object
      required: [id, username, displayName, isActive]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo:
          type: string
          format: date-time
          nullable: true
          description: Past this, resolution returns DENY regardless of grants.
        primaryRoleId:
          type: string
          format: uuid
          nullable: true
          description: >
            Determines the landing screen when the principal holds several roles and picks
            one at login.
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleSummary' }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    CreatePrincipalRequest:
      type: object
      required: [username, displayName]
      properties:
        username: { type: string, maxLength: 256 }
        displayName: { type: string, maxLength: 200 }
        initialCredential: { type: string, maxLength: 512 }
        mustChangeCredential: { type: boolean, default: true }
        validTo: { type: string, format: date-time }
        roleIds:
          type: array
          items: { type: string, format: uuid }

    Role:
      x-ticvai-persistence: "identity.role"
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          description: >
            **A role that grants no permissions is not a role.** `Role` carried a code, a name and
            two counts until 18 August, and `identity.role_permission` derived from it with exactly
            one column — `role_id`. **A join table that joins to nothing**, found by Hrushikant in
            review and missed by the schema audit that ran the same day.

            **The audit asked whether every table had columns, a relationship and an owner, and this
            table had all three.** What it did not ask is whether a table with one column can do the
            job its name claims.
          items:
            $ref: '../shared/permissions.yaml#/components/schemas/Permission'
        inheritsFromRoleId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Role composition, one level deep and no deeper.** A supervisor role that is a cashier
            plus three permissions is how venues actually describe them.

            **Cycles are refused and depth is capped at one**, because a permission set nobody can
            read off the screen is a permission set nobody audits.
        isSystem:
          type: boolean
          default: false
          description: >
            **Seeded roles ship and are editable; deleting one is refused.** A venue that removes
            `cashier` and rebuilds it has two roles with one name in the audit log.
        principalCount: { type: integer }
        grantCount: { type: integer }

    Grant:
      x-ticvai-persistence: "identity.grant"
      type: object
      required: [id, permission, scopePath, effect]
      properties:
        id: { type: string, format: uuid }
        principalId: { type: string, format: uuid, nullable: true }
        roleId: { type: string, format: uuid, nullable: true }
        permission:
          type: string
          description: From the permission enum. `*` permitted on DENY only.
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            CF-132, CL-05. **A grant held by a guest rather than a staff principal.**

            Section 5.5 asks for portfolios — a primary holder assigning entitlements, transfer
            between linked accounts, shared wallets with individual tracking — and it appears ten
            times across ten sections. **Every one of those reduces to the same question: who may
            act on whose behalf, over what, and until when.**

            **That is a grant, not a household table.** A primary holder assigning an entitlement is
            a grant. A group leader holding tickets for twelve is a grant. A corporate account
            enrolling members is a grant with a quota. **A shared wallet with individual tracking is
            a grant over a balance, and the transaction log already records who spent.**

            **A household table would answer one of those four.**
        overSubjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            Whose behalf. **Null for a staff grant, which is the existing behaviour** — every grant
            written before 18 August means exactly what it meant before.
        overObjectRef:
          type: string
          nullable: true
          description: >
            **Where the authority is over a thing rather than a scope** — a wallet, an entitlement,
            a booking. `scopePath` answers *where*; this answers *what*, and a guest's authority is
            almost always over a specific object rather than a branch of the tree.
        delegationKind:
          type: string
          nullable: true
          enum: [primaryHolder, familyMember, groupLeader, attendee, corporateAdmin, corporateMember, carer]
          description: >
            **What kind of relationship this expresses**, for display and for reporting. The
            mechanism does not branch on it — a family member and a group attendee are the same
            grant with different words around them, which is the point.
        quota:
          type: integer
          nullable: true
          description: >
            2.14.15 and 4.3.11. **How many the holder may assign.** A corporate account with fifty
            allocations and a family with four are the same structure with different numbers.
        isRevocableBySubject:
          type: boolean
          default: true
          description: >
            **Whether the person it is over can end it.** A guest who linked a family member should
            be able to unlink them; a corporate member should not be able to revoke their employer's
            oversight — and **a delegation nobody can end is a delegation somebody will regret.**
        scopePath: { type: string }
        effect:
          type: string
          enum: [ALLOW, DENY]
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        createdByPrincipalId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CreateGrantRequest:
      type: object
      required: [permission, scopePath, effect]
      properties:
        principalId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        permission: { type: string }
        scopePath: { type: string }
        effect:
          type: string
          enum: [ALLOW, DENY]
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [username, credential, workstationId]
      properties:
        username: { type: string, maxLength: 256 }
        credential:
          type: string
          description: Password, card token or RFID token depending on `method`.
          maxLength: 512
        method:
          type: string
          enum: [password, card, rfid, sso]
          default: password
        workstationId:
          type: string
          format: uuid
          description: >
            Identifies the device. Determines Sale Board, connected hardware,
            till identity and Access Point inheritance. NOT a permission source.
        deviceFingerprint: { type: string, maxLength: 256 }

    LoginResponse:
      x-ticvai-persistence: "none — computed"
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [requiresRoleSelection]
          properties:
            requiresRoleSelection: { type: boolean }
            availableRoles:
              type: array
              items: { $ref: '#/components/schemas/RoleSummary' }
            session: { $ref: '#/components/schemas/Session' }

    TokenPair:
      x-ticvai-persistence: "none — transient"
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT carrying `sid`, validated per request against the session registry.
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconds }

    RoleSummary:
      x-ticvai-persistence: "none — projection over role"
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isPrimary: { type: boolean }

    Session:
      type: object
      required: [sessionId, principalId, roleId, scope, effectivePermissions, saleBoardId]
      properties:
        sessionId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        displayName: { type: string }
        scope:
          type: array
          description: >
            Scope nodes this session may act within, resolved once at login from
            the ltree hierarchy with deny-overrides-allow. Clients filter navigation
            against this — they never compute it.
          items: { $ref: '../shared/common.yaml#/components/schemas/ScopeRef' }
        effectivePermissions:
          allOf:
            - $ref: '../shared/permissions.yaml#/components/schemas/PermissionSet'
          description: >
            Flattened set across all granted scopes, after deny resolution. Convenience for
            coarse checks. Anything scope-sensitive must use `permissionsByScope`.
        permissionsByScope:
          type: array
          description: >
            Permissions effective at each granted scope path. Clients filter navigation on
            this and never compute permissions themselves.
          items:
            $ref: '../shared/permissions.yaml#/components/schemas/ScopedPermissions'
        saleBoardId:
          type: string
          format: uuid
          description: >
            Landing surface, derived from the WORKSTATION, not the role
            (12 Aug 2026 §3). Ticketing, F&B or Retail board.
        workstation: { $ref: '#/components/schemas/WorkstationContext' }
        openedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    WorkstationContext:
      type: object
      required: [id, code, venueId, regionId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        venueId: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
        accessPointId:
          type: string
          format: uuid
          description: Inherited from the workstation, never selected by the operator.
        devices:
          type: array
          items:
            type: object
            required: [kind, driver]
            properties:
              kind:
                type: string
                enum: [receiptPrinter, ticketPrinter, cashDrawer, barcodeScanner, rfidReader, paymentTerminal, customerDisplay]
              driver: { type: string }
              identifier: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer, minimum: 0, maximum: 4 }
        timezone: { type: string }
        cellName:
          type: string
          description: >
            The cell serving this workstation's region. One cell per tenant per region
            (ADR-0014). A client uses this only for diagnostics and telemetry tagging —
            never for routing, which the Control Plane resolves.
        deploymentProfile:
          type: string
          enum: [terminalLocal, venueEdge, thin]
          description: >
            Whether this surface reads catalogue locally (ADR-0013). Determines which flows
            the client enables offline.
