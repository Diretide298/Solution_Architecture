      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider:
                  type: string
                  enum: [apple, google]
                idToken: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401':
          description: Provider token invalid or expired
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /auth/guest/uae-pass:
    post:
      operationId: guestUaePassLogin
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [anonymous]
      summary: Sign in with a national identity provider
      description: >
        OAuth authorisation-code exchange. Returns a verified identity, so an account created
        this way needs no further verification.

        Government onboarding has lead time and should be started before it becomes the
        critical path.
      tags: [guestAuth]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code: { type: string }
                redirectUri: { type: string }
                state: { type: string }
                deviceId: { type: string }
      responses:
        '200':
          description: Signed in with a verified identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }

  /auth/guest/session:
    get:
      operationId: getGuestSession
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
        - "P06 EMP-001 Sign in"
        - "P06 EMP-002 Select venue & role"
        - "P06 EMP-042 Profile"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-audience: [guest, partner]
      x-ticvai-read-routing: primary
      summary: Read the current guest session
      tags: [guestAuth]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }

    delete:
      operationId: guestLogout
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [guest]
      summary: End a guest session
      description: >
        Ends this device's session. `allDevices` revokes every session for the subject, which
        is what a guest reaching for "sign out everywhere" after losing a phone actually
        wants.
      tags: [guestAuth]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - name: allDevices
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Ended }

  /auth/guest/link-checkout:
    post:
      operationId: linkGuestCheckout
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [guest]
      summary: Attach a guest checkout to an account
      description: >
        A guest who bought without an account, then registered. Orders matching the verified
        contact detail are attached.

        **Only orders whose contact detail matches the now-verified identifier.** Attaching
        on an unverified claim would hand someone else's booking history to whoever asked for
        it.
      tags: [guestAuth]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderReference]
              properties:
                orderReference: { type: string }
                verificationCode:
                  type: string
                  description: From the booking confirmation. Proves possession of the booking.
      responses:
        '200':
          description: Attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachedOrderCount: { type: integer }
        '403':
          description: Contact detail on the order does not match the verified identifier
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /auth/guest/account:
    delete:
      operationId: deleteGuestAccount
      x-ticvai-audience: [guest]
      summary: Self-service account deletion
      description: >
        Raises an erasure request rather than deleting immediately. PII is removed from the
        erasable store; ledger entries keep their opaque subject reference and stay intact.

        Where the guest is linked across cells, the request fans out (ADR-0010).
      tags: [guestAuth]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Erasure request raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  estimatedCompletionAt: { type: string, format: date-time }
        '409':
          description: >
            Open orders or an unexpired entitlement exist. Deleting an account with a valid
            ticket in it strands the guest at a gate.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

