openapi: 3.1.0
info:
  title: TICVAI Identity & Authorisation
  version: 1.0.0
  x-ticvai-screen-count: 38
  x-ticvai-tier: spine
  x-ticvai-module: "19 — Guest Mobile App & Branding (auth) + cross-cutting staff auth"
  x-ticvai-requirements: 107
  x-ticvai-capabilities: [C35, C36, C56]
  x-ticvai-platforms:
    - "All platforms"
  description: >
    ## What this contract covers

    **Defines who is asking, and what they may do.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 19 — Guest Mobile App & Branding (auth) + cross-cutting staff auth |
    | **Requirements** | ~107 |
    | **Capabilities** | C35, C36, C56 |
    | **Consumed by** | All platforms |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Authentication, session lifecycle and effective-permission resolution.

    Two positions from the Project Direction shape this contract:

    - §3.1.1 Authorisation is user/role-driven. A user logs in from any device and
      carries their access. Workstation determines presentation, hardware binding,
      till identity and reporting dimension — never authorisation.
    - §3.1.3 Single session per user. A second login is REJECTED (409), not
      auto-terminating the first, because auto-terminate can orphan an open cart
      or an unclosed cash drawer.

    Clients never compute permissions locally. They consume `effectivePermissions`
    returned at login and refreshed on demand.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local
        description: Resolved per tenant from the Control Plane. Never hardcoded.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
        - "P06 EMP-001 Sign in"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-audience: [anonymous, partner]
      tags: [identity]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      summary: Authenticate and open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Authenticated. When the user holds exactly one role the response is
            complete. When the user holds several, `requiresRoleSelection` is true
            and `availableRoles` is populated — the caller must call
            /auth/select-role before the session becomes usable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }
        '409':
          description: >
            An active session already exists for this principal on another device.
            Per §3.1.3 the new login is refused. A supervisor with the
            SESSION_FORCE_LOGOUT permission may terminate the existing session.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429': { $ref: '../shared/common.yaml#/components/responses/TooManyRequests' }

  /auth/guest/verify-email:
    post:
      operationId: verifyGuestEmail
      x-ticvai-consumed-by:
        - "P01 WEB-020 Profile & Preferences"
      summary: Send a verification link, or consume one
      description: >
        **Raised in review by Deep.** `registerGuest` creates an account and nothing verifies the
        address on it — and **a guest account with an unverified email can receive somebody else's
        tickets**, because a transfer is offered to an address.

        Two modes on one operation: **`send` issues a single-use token; `confirm` consumes it.** One
        operation because they are one act with two halves, and splitting them invites a `confirm`
        that works without a `send`.

        **Unverified accounts still buy.** Blocking purchase on verification loses the sale and
        teaches nobody — what an unverified account cannot do is *receive a transfer* or *reset a
        password*, which are the two paths that matter.
      tags: [identity]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest, anonymous]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [send, confirm] }
                token:
                  type: string
                  nullable: true
                  description: >
                    For `confirm`. **Single use and short-lived** — a verification link that works
                    forever is a verification link in an old inbox.
      responses:
        '200':
          description: Sent, or verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVerified: { type: boolean }
                  expiresAt: { type: string, format: date-time, nullable: true }
        '410':
          description: >
            **The token expired or was already used.** Distinct from an invalid one — a guest who
            clicked an old link should be offered a new one rather than told they are wrong.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /password-policy:
    put:
      operationId: setPasswordPolicy
      summary: Length, breach check, lockout and step-up
      description: >
        BL-144. **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition, and
        `requireBreachCheck` stops more account takeovers than every composition rule combined.

        **`maxAgeDays` defaults to null on purpose** — forced rotation produces `Summer2026!`
        becoming `Summer2027!`. It exists because some tenants are contractually obliged to have it.
      tags: [identity]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordPolicy' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordPolicy' }

  /segregation-rules:
    put:
      operationId: setSegregationRules
      x-ticvai-config-scope: tenant
      summary: Which permissions may not be held together
      description: >
        BL-147, 3.3.31. **Checked at grant time, not at use time** — discovering the conflict when
        somebody exercises it means the conflict already existed.

        **`allowWithCompensatingControl` is there because a small venue cannot always separate
        duties**, and a rule that cannot be satisfied is a rule that gets disabled entirely.
      tags: [identity]
      x-ticvai-permission: ROLE_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items: { $ref: '#/components/schemas/SegregationRule' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SegregationRule' }

  /guests/{subjectId}/data-export:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: exportSubjectData
      summary: Everything the platform holds about one guest
      description: >
        BL-149. **A subject access request has a statutory clock**, and answering it by hand across
        twenty-seven contracts is how a venue misses it.

        **Assembled from the lineage, not from a hand-written list.** `api-data-lineage.json` already
        knows which tables hold subject data, so the export is derived rather than maintained — **a
        hand-maintained list of personal data is a list that drifts the first time somebody adds a
        column.**

        Includes what is held and where it came from. **Excludes another guest's data even where the
        two share a booking**, which is the case that makes this harder than a table dump.
      tags: [identity]
      x-ticvai-permission: GUEST_VIEW_PII
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [json, csv, pdf], default: json }
      responses:
        '202':
          description: Export started
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /guests/{subjectId}/delegations:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listDelegations
      x-ticvai-consumed-by:
        - "P02 GST-015 Memberships"
      summary: Who may act for this guest, and for whom they may act
      description: >
        CF-132. **Both directions, because a guest is usually in both.** A parent holds authority
        over two children and is a member of a corporate account — one screen, one question.
      tags: [identity]
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Grants held and grants over
          content:
            application/json:
              schema:
                type: object
                properties:
                  heldByThisGuest: { type: array, items: { $ref: '#/components/schemas/Grant' } }
                  heldOverThisGuest: { type: array, items: { $ref: '#/components/schemas/Grant' } }

    post:
      operationId: grantDelegation
      x-ticvai-consumed-by:
        - "P02 GST-015 Memberships"
      summary: Let one guest act for another
      description: >
        CF-132, CL-05. **A portfolio is delegated authority, not a household table.**

        Covers a primary holder assigning entitlements, a group leader holding tickets, a corporate
        account enrolling members and a shared wallet with individual tracking — **four requirements
        the matrix raises separately and one mechanism.**

        **It inherits the audit.** Who granted what to whom, when, and whether it has expired is
        already recorded for every grant, which a bespoke family structure would have needed built.

        **This does not make the work smaller** — extending grants to guest-held, object-scoped
        authority is real work touching `orders`, `access` and `retail`. **It makes it one piece of
        work rather than four.**
      tags: [identity]
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overSubjectId, delegationKind, permission]
              properties:
                overSubjectId: { type: string, format: uuid }
                delegationKind: { type: string, enum: [primaryHolder, familyMember, groupLeader, attendee, corporateAdmin, corporateMember, carer] }
                permission: { type: string }
                overObjectRef: { type: string, nullable: true }
                quota: { type: integer, nullable: true }
                validTo: { type: string, format: date-time, nullable: true }
                isRevocableBySubject: { type: boolean, default: true }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '409':
          description: >
            **A cycle, or a minor granting authority over an adult.** Both are refused — a delegation
            graph with a loop is one nobody can reason about, and the second is a safeguarding
            concern rather than a modelling one.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /auth/select-role:
    post:
      operationId: selectRole
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
        - "P06 EMP-002 Select venue & role"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      tags: [identity]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      summary: Choose a role for a multi-role session
      description: >
        Per 12 Aug 2026 §4 — a user with one role logs in directly; a user with
        several is prompted to choose. Resolves the effective permission set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: string, format: uuid }
      responses:
        '200':
          description: Role selected, session usable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /auth/refresh:
    post:
      operationId: refreshToken
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      tags: [identity]
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      summary: Rotate the access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
        - "P06 EMP-046 Sign out"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff]
      tags: [identity]
      security:
        - bearerAuth: []
      x-ticvai-self-scoped: principal
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      summary: Close the current session
      responses:
        '204': { description: Session closed }

  /auth/sessions/{sessionId}/force-logout:
    post:
      operationId: forceLogout
      x-ticvai-consumed-by:
        - "P06 EMP-001 Sign in"
        - "P06 EMP-002 Select venue & role"
        - "P06 EMP-042 Profile"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-audience: [staff, partner]
      tags: [identity]
      x-ticvai-permission: SESSION_FORCE_LOGOUT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      summary: Supervisor termination of an abandoned session
      description: >
        Requires SESSION_FORCE_LOGOUT. Exists because §3.1.3 rejects rather than
        displaces a second login — an operator who went home still logged in would
        otherwise be locked out until token expiry.
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '204': { description: Session terminated and audited }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /auth/session:
    get:
      operationId: getCurrentSession
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
        - "P06 EMP-001 Sign in"
        - "P06 EMP-002 Select venue & role"
        - "P06 EMP-042 Profile"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Agent Login"
      x-ticvai-self-service: true   # a principal acting on their own session, not on the platform
      x-ticvai-audience: [staff, partner]
      tags: [identity]
      x-ticvai-read-routing: primary
      security:
        - bearerAuth: []
      x-ticvai-self-scoped: principal
      x-ticvai-permission: null   # a staff session, before or without a role-scoped grant
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      summary: Current session and effective permissions
      responses:
        '200':
          description: Active session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }

  /principals:
    get:
      operationId: listPrincipals
      x-ticvai-consumed-by:
        - "P08 BO-053 Staff Directory"
        - "P08 BO-057 Training & Certification"
        - "P09 ADM-020 Platform User Directory"
        - "P10 PTR-003 Profile & Company Details"
        - "P13 CMS-019 User Access"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: replica
      summary: List principals
      tags: [administration]
      x-ticvai-permission: USER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: scopePath
          in: query
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: boolean }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Principals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Principal' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
    post:
      operationId: createPrincipal
      x-ticvai-consumed-by:
        - "P08 BO-053 Staff Directory"
        - "P09 ADM-020 Platform User Directory"
        - "P10 PTR-003 Profile & Company Details"
      x-ticvai-audience: [staff, partner]
      summary: Create a principal
      tags: [administration]
      x-ticvai-permission: USER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePrincipalRequest' }
      responses:
        '201':
          description: Created. Has no access until grants are assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: Username already in use within this cell
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /principals/{principalId}:
    parameters:
      - name: principalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPrincipal
      x-ticvai-consumed-by:
        - "P08 BO-053 Staff Directory"
        - "P09 ADM-020 Platform User Directory"
        - "P10 PTR-003 Profile & Company Details"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: replica
      summary: Read a principal
      tags: [administration]
      x-ticvai-permission: USER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
    patch:
      operationId: updatePrincipal
      x-ticvai-consumed-by:
        - "P08 BO-053 Staff Directory"
        - "P09 ADM-020 Platform User Directory"
        - "P10 PTR-003 Profile & Company Details"
      x-ticvai-audience: [staff, partner]
      summary: Update or deactivate a principal
      description: >
        Deactivation invalidates any live session immediately. Additive changes take effect
        at next login; revocations take effect at once.
      tags: [administration]
      x-ticvai-permission: USER_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName: { type: string, maxLength: 200 }
                isActive: { type: boolean }
                validTo: { type: string, format: date-time, nullable: true }
                primaryRoleId: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }

  /roles:
    get:
      operationId: listRoles
      x-ticvai-consumed-by:
        - "P06 EMP-002 Select venue & role"
        - "P08 BO-054 Role Assignment"
        - "P09 ADM-021 Platform Role Management"
        - "P13 CMS-019 User Access"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List roles
      description: >
        A role is a grouping for permission management — code, name, description. Nothing is
        predefined; privileges attach through grants.
      tags: [administration]
      x-ticvai-permission: ROLE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
    post:
      operationId: createRole
      x-ticvai-consumed-by:
        - "P06 EMP-002 Select venue & role"
        - "P08 BO-054 Role Assignment"
        - "P09 ADM-021 Platform Role Management"
      x-ticvai-audience: [staff]
      summary: Create a role
      tags: [administration]
      x-ticvai-permission: ROLE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }

  /grants:
    get:
      operationId: listGrants
      x-ticvai-consumed-by:
        - "P10 PTR-020 Sub-Agent Management"
      x-ticvai-audience: [staff, partner]
      x-ticvai-read-routing: replica
      summary: List grants for a principal or role
      tags: [administration]
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - name: roleId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Grant' }
    post:
      operationId: createGrant
      x-ticvai-consumed-by:
        - "P10 PTR-020 Sub-Agent Management"
      x-ticvai-audience: [staff, partner]
      summary: Assign a grant
      description: >
        Resolution is deny-overrides-allow. A DENY at any node suppresses the permission at
        that node and everything beneath it, and is never overridden by a more specific
        ALLOW — so a deny is a guarantee rather than a default.

        Wildcard is permitted on DENY only. A wildcard allow is an accident waiting to
        happen.
      tags: [administration]
      x-ticvai-permission: PERMISSION_GRANT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGrantRequest' }
      responses:
        '201':
          description: Granted. Takes effect at next login unless it is a revocation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        '400':
          description: Wildcard on an ALLOW, or scope outside the caller's own grants
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /grants/{grantId}:
    parameters:
      - name: grantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteGrant
      x-ticvai-consumed-by:
        - "P10 PTR-020 Sub-Agent Management"
      x-ticvai-audience: [staff, partner]
      summary: Remove a grant
      description: >
        Removing an ALLOW takes effect at next login. Removing it from a principal with a
        live session invalidates that session, because a revocation that takes effect
        eventually is not a revocation.
      tags: [administration]
      x-ticvai-permission: PERMISSION_GRANT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Removed }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /permissions/resolve:
    post:
      operationId: resolvePermissions
      x-ticvai-audience: [staff]
      summary: Simulate a principal's effective permissions
      description: >
        Runs the resolution algorithm without a login. Answers *what would this person
        actually be able to do* before a grant is saved — which is the only practical way to
        review a seven-level grant set.
      tags: [administration]
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId, roleId]
              properties:
                principalId: { type: string, format: uuid }
                roleId: { type: string, format: uuid }
                atScopePath:
                  type: string
                  description: >
                    Optional. When supplied, returns PERMIT or DENY per permission at that
                    node rather than the whole effective set.
      responses:
        '200':
          description: Effective set
          content:
            application/json:
              schema:
                type: object
                required: [permissionsByScope]
                properties:
                  permissionsByScope:
                    type: array
                    items:
                      $ref: '../shared/permissions.yaml#/components/schemas/ScopedPermissions'
                  suppressedByDeny:
                    type: array
                    description: >
                      Permissions that would have been allowed but for a deny, with the node
                      that suppressed them. The single most useful thing when a grant set
                      does not behave as expected.
                    items:
                      type: object
                      properties:
                        permission: { type: string }
                        deniedAtScopePath: { type: string }

  # ---------------------------------------------------------------- guest auth
  /auth/guest/register:
    post:
      operationId: registerGuest
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [anonymous]
      summary: Create a guest account
      description: >
        Email or mobile. Verification follows via OTP; the account exists but is unverified
        until then, and an unverified account may browse but not transact.
      tags: [guestAuth]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      security: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterGuestRequest' }
      responses:
        '201':
          description: Created, pending verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '409':
          description: >
            Identifier already registered. Deliberately indistinguishable in timing from
            success — a registration endpoint that reveals which addresses exist is an
            account enumeration tool.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /auth/guest/otp:
    post:
      operationId: requestGuestOtp
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [anonymous]
      summary: Request a one-time code
      description: >
        Delivered by WhatsApp, SMS or email. Rate-limited per identifier and per source
        address.

        **The response never reveals whether the identifier exists.** It is the same either
        way; only the message differs, and only the owner receives it.
      tags: [guestAuth]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, channel]
              properties:
                identifier: { type: string, maxLength: 256 }
                channel:
                  type: string
                  enum: [whatsapp, sms, email]
                purpose:
                  type: string
                  enum: [login, register, verify, passwordReset, stepUp]
                  default: login
      responses:
        '202':
          description: Sent if the identifier is deliverable
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresInSeconds: { type: integer }
                  resendAfterSeconds: { type: integer }
        '429': { $ref: '../shared/common.yaml#/components/responses/TooManyRequests' }

  /auth/guest/otp/verify:
    post:
      operationId: verifyGuestOtp
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [anonymous]
      summary: Verify a one-time code and issue a session
      tags: [guestAuth]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier: { type: string }
                code: { type: string, minLength: 4, maxLength: 10 }
                deviceId: { type: string }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestSession' }
        '401':
          description: >
            Code invalid or expired. Attempts are counted; the code is invalidated after the
            configured limit rather than allowing indefinite guessing.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /auth/guest/social:
    post:
      operationId: guestSocialLogin
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience: [anonymous]
      summary: Sign in with Apple or Google
      description: >
        Where the provider's verified email matches an existing account, the identities are
        linked rather than a duplicate created. Where it does not, a new account is created —
        an unverified email from a provider is not proof of ownership.
      tags: [guestAuth]
      x-ticvai-permission: null   # no session yet — this is how one is obtained
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
