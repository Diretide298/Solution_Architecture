        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaCode, reason]
              properties:
                mediaCode: { type: string, maxLength: 256 }
                reason: { type: string, minLength: 3, maxLength: 500 }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlacklistEntry' }

  /blacklist/{mediaCode}:
    parameters:
      - name: mediaCode
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeBlacklistEntry
      x-ticvai-consumed-by:
        - "P07 SCN-010 Blacklisted"
        - "P08 BO-033 Blacklist Management"
      summary: Remove a blacklist entry
      tags: [accessPoint]
      x-ticvai-permission: ACCESS_POINT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      responses:
        '204': { description: Removed }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /access/group-validate:
    post:
      operationId: validateGroupAccess
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      summary: Admit a group on one read
      description: >
        A school party or tour group entering on a single credential. Partial admission is
        normal — thirty booked, twenty-eight arrived — and the remainder stays available.

        Each admission decrements the group's counter, so a group cannot re-enter beyond its
        size by scanning repeatedly.
      tags: [validation]
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, mediaCode, admitCount, recordedAt]
              properties:
                id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                mediaCode: { type: string, maxLength: 256 }
                admitCount: { type: integer, minimum: 1 }
                direction: { $ref: '#/components/schemas/Direction' }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Group admission outcome
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationResult'
                  - type: object
                    properties:
                      groupSize: { type: integer }
                      totalAdmitted: { type: integer }
                      remainingAdmissions: { type: integer }
        '409':
          description: Requested count exceeds the remaining group allowance
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /access-points/{accessPointId}/geofence:
    parameters:
      - name: accessPointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setAccessPointGeofence
      x-ticvai-consumed-by:
        - "P07 SCN-002 Access point & direction"
        - "P07 SCN-016 Gate mode"
        - "P08 BO-064 Zones & Areas"
      summary: Set a geofence for handheld validation
      description: >
        Constrains where a handheld may validate for this access point. A roaming scanner used
        two hundred metres from the gate it claims to be at is either an error or something
        worse.

        Enforcement is configurable — warn, or deny — because GPS accuracy indoors is not a
        thing to build a hard block on without thought.
      tags: [accessPoint]
      x-ticvai-permission: ACCESS_POINT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enforcement]
              properties:
                latitude: { type: number }
                longitude: { type: number }
                radiusMetres: { type: integer, minimum: 5, maximum: 5000 }
                enforcement:
                  type: string
                  enum: [off, warn, deny]
                allowProximityBeacon:
                  type: boolean
                  description: Accept a BLE proximity assertion in place of GPS. Better indoors.
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessPoint' }

components:
  schemas:
    CreateAccessPointRequest:
      type: object
      required: [code, name, venueId, direction]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        direction: { $ref: '#/components/schemas/Direction' }
        antiPassbackEnabled: { type: boolean, default: false }
        requiresExitBeforeReentry: { type: boolean, default: false }
        driver: { type: string }

    ParkingIntegrationMode:
      type: string
      description: >
        CF-52, settled 14 August. **Not variations of one thing** — each decides what happens at
        sale and what a guest presents at the barrier.
      enum: [none, plateWhitelist, qrHandoff]

    ParkingFacility:
      type: object
      x-ticvai-persistence: "access.parking_facility"
      required: [name, venueId, mode]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        venueId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/ParkingIntegrationMode' }
        capacity: { type: integer, nullable: true }
        vendorName: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        credentialRef:
          type: string
          nullable: true
          description: A vault reference, never the credential.
        pushLeadMinutes:
          type: integer
          nullable: true
          description: >
            How far ahead of the visit a plate is pushed. **Too early and the whitelist fills
            with cars that will not arrive; too late and the guest is at the barrier.**
        accessPointIds:
          type: array
          description: Where the platform validates its own code, in `none` and `qrHandoff` modes.
          items: { type: string, format: uuid }
        isActive: { type: boolean }

    ParkingEntitlementStatus:
      type: string
      enum: [pending, pushed, pushFailed, active, used, expired, revoked]

    ParkingEntitlement:
      type: object
      x-ticvai-persistence: "access.parking_entitlement"
      required: [facilityId, orderId, validFrom, validTo]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        facilityId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        plateNumber:
          type: string
          nullable: true
          description: >
            Required in `plateWhitelist` mode, meaningless in the others. **Personal data** — a
            plate identifies a person, so it lives under the same rules as a contact point.
        plateCountry: { type: string, nullable: true }
        mediaCode:
          type: string
          nullable: true
          description: The code presented in `none` and `qrHandoff` modes.
        status: { $ref: '#/components/schemas/ParkingEntitlementStatus' }
        pushedAt: { type: string, format: date-time, nullable: true }
        pushFailureReason: { type: string, nullable: true }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }

    AdmissionProfile:
      x-ticvai-persistence: "access.admission_profile"
      type: object
      required: [id, code, name, openMinutesBefore, closeMinutesAfter]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        openMinutesBefore:
          type: integer
          description: How long before a performance validation opens.
        closeMinutesAfter: { type: integer }
        maxDurationMinutes: { type: integer, nullable: true }
        requiresExitBeforeReentry: { type: boolean, default: false }
        maxReentries: { type: integer, nullable: true }
        allowedAccessPointIds:
          type: array
          items: { type: string, format: uuid }
          description: Empty means any access point in the venue.

    BlacklistEntry:
      x-ticvai-persistence: "access.blacklist"
      type: object
      required: [mediaCode, reason, addedAt, addedByPrincipalId]
      properties:
        mediaCode: { type: string }
        reason: { type: string }
        addedAt: { type: string, format: date-time }
        addedByPrincipalId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time, nullable: true }

    MediaKind:
      type: string
      enum: [qr, barcode, rfid, nfc, magstripe, mobileWallet, biometric, manual]

    Direction:
      type: string
      enum: [entry, exit, reentry, crossover]

    TurnstileMode:
      type: string
      enum: [entry, reentry, crossover, exit, freeRotation, closed]

    ScanOutcome:
      type: string
      enum: [admitted, denied, overridden]

    DenyReason:
      type: string
      description: >
        Enumerated so the client can render an appropriate operator prompt. A gate operator
        facing a queue needs a reason and a next action, not a boolean.
      enum:
        - notFound
        - notYetValid
        - expired
        - alreadyUsed
        - reentryLimitReached
        - exitRequiredBeforeReentry       # anti-passback
        - wrongAccessPoint
        - wrongPerformance
        - outsideAdmissionWindow
        - entitlementSuspended
        - blacklisted
        - capacityReached
        - waiverRequired
        - accompanimentRequired
        - mediaDeactivated
        - unpaid
        - delegatedRightExhausted     # cross-cell right consumed elsewhere before sync
        - delegatedRightRevoked       # issuing cell revoked or guest link withdrawn

    ValidateRequest:
      type: object
      required: [id, mediaCode, mediaKind, direction, recordedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Client-generated ULID. Also the idempotency key and dedupe key.
        mediaCode:
          type: string
          maxLength: 256
          description: >
            What was read from the media. NOT the ticket id — media can be re-linked over a
            ticket's life.
        mediaKind: { $ref: '#/components/schemas/MediaKind' }
        direction: { $ref: '#/components/schemas/Direction' }
        groupSize:
          type: integer
          minimum: 1
          description: For group media admitting several holders on one read.
        proximityToken:
          type: string
          description: >
            BLE proximity assertion where the venue requires the operator to be physically
            at the gate. Absent where not configured.
        recordedAt:
          type: string
          format: date-time
          description: Device time of the read. Authoritative for ordering, not for validity.

    ValidationResult:
      x-ticvai-persistence: "none — computed, persisted as scan_event"
      type: object
      required: [scanId, outcome, accessPointId, recordedAt]
      properties:
        scanId: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        outcome: { $ref: '#/components/schemas/ScanOutcome' }
        denyReason: { $ref: '#/components/schemas/DenyReason' }
        denyDetail:
          type: string
          description: Human-readable, localised. For operator display, never for logic.
        accessPointId: { type: string, format: uuid }
        ticket: { $ref: '#/components/schemas/TicketStatus' }
        admittedCount:
          type: integer
          description: Holders admitted on this read. Differs from groupSize on partial admission.
        recordedAt: { type: string, format: date-time }
        serverEvaluatedAt: { type: string, format: date-time }

    TicketStatus:
      x-ticvai-persistence: "none — computed from entitlement and scans"
      type: object
      required: [ticketId, isValid]
      properties:
        ticketId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Stable for the life of the ticket, independent of the media carrying it.
        mediaCode: { type: string, nullable: true }
        productName: { type: string }
        holderName:
          type: string
          nullable: true
          description: >
            Present only where the entitlement is name-bound. Identity and entitlement are
            separate concerns; most entitlements carry no holder.
        isValid: { type: boolean }
        validFrom: { type: string, format: date-time, nullable: true }
        validTo: { type: string, format: date-time, nullable: true }
        performanceId: { type: string, format: uuid, nullable: true }
        entriesUsed: { type: integer }
        entriesAllowed: { type: integer, nullable: true, description: Null means unlimited. }
        reentryAllowed: { type: boolean }
        isInsideVenue:
          type: boolean
          description: Derived from the last scan. Drives anti-passback evaluation.
        issuingCellId:
          type: string
          nullable: true
          description: >
            Present when this entitlement was issued in a different cell and is being
            redeemed here as a delegated right (ADR-0010). Null for locally issued tickets.
        guestLinkId:
          type: string
          nullable: true
          description: >
            Pseudonymous cross-cell guest reference. Present only on delegated rights.
            Carries no personal data.
        admissionProfileId: { type: string, format: uuid }
        denyReason: { $ref: '#/components/schemas/DenyReason' }

    OfflineScan:
      x-ticvai-persistence: "none — client-side journal"
      allOf:
        - $ref: '#/components/schemas/ValidateRequest'
        - type: object
          required: [sequence, localOutcome]
          properties:
            sequence:
              type: integer
              minimum: 1
              description: Monotonic per device. The server processes in this order.
            localOutcome:
              allOf:
                - $ref: '#/components/schemas/ScanOutcome'
              description: >
                What the device decided offline. The server is authoritative and may
                disagree; disagreements are returned for reconciliation, not discarded.
            localDenyReason: { $ref: '#/components/schemas/DenyReason' }
            overriddenByPrincipalId:
              type: string
              format: uuid
              nullable: true
            overrideReason: { type: string, nullable: true }

    ScanSyncResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [accepted, results]
      properties:
        accepted:
          type: integer
          description: Entries processed before any stop.
        stoppedAtSequence:
          type: integer
          nullable: true
          description: >
            Sequence of the first entry that could not be processed. Null when the whole
            batch succeeded. The client retries from here — never past it.
        results:
          type: array
          items:
            type: object
            required: [id, sequence, status]
            properties:
              id: { type: string }
              sequence: { type: integer }
              status:
                type: string
                enum: [accepted, duplicate, reconciled, rejected]
              serverOutcome: { $ref: '#/components/schemas/ScanOutcome' }
              divergence:
                type: string
                nullable: true
                description: >
                  Present when `reconciled` — the device admitted and the server would have
                  denied, or vice versa. Surfaced to the operator, not swallowed.
              error: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    ScanEvent:
      x-ticvai-persistence: "access.scan_event"
      type: object
      required: [id, accessPointId, venueId, outcome, direction, recordedAt]
      properties:
        id: { type: string }
        accessPointId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        ticketId: { type: string, nullable: true }
        mediaCode: { type: string, nullable: true }
        outcome: { $ref: '#/components/schemas/ScanOutcome' }
        denyReason: { $ref: '#/components/schemas/DenyReason' }
        direction: { $ref: '#/components/schemas/Direction' }
        operatorPrincipalId: { type: string, format: uuid, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true }
        overriddenByPrincipalId: { type: string, format: uuid, nullable: true }
        overrideReason: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while pending. Differs from recordedAt for offline scans.

    AccessPoint:
      x-ticvai-persistence: "access.access_point"
      type: object
      required: [id, code, name, venueId, mode, isActive]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        mode: { $ref: '#/components/schemas/TurnstileMode' }
        direction: { $ref: '#/components/schemas/Direction' }
        antiPassbackEnabled: { type: boolean }
        isActive: { type: boolean }
        lastHeartbeatAt: { type: string, format: date-time, nullable: true }

    OfflinePackage:
      x-ticvai-persistence: "none — generated artefact in object storage"
      type: object
      required: [etag, generatedAt, validFrom, validTo, accessPointId, entitlements]
      properties:
        etag: { type: string }
        generatedAt: { type: string, format: date-time }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        accessPointId: { type: string, format: uuid }
        entitlements:
          type: array
          items:
            type: object
            required: [ticketId, mediaCodes, validFrom, validTo, entriesAllowed, reentryAllowed]
            properties:
              ticketId: { type: string }
              mediaCodes:
                type: array
                items: { type: string }
                description: A ticket may carry several media over its life.
              validFrom: { type: string, format: date-time }
              validTo: { type: string, format: date-time }
              performanceId: { type: string, format: uuid, nullable: true }
              entriesAllowed: { type: integer, nullable: true }
              entriesUsed: { type: integer }
              reentryAllowed: { type: boolean }
              admissionProfileId: { type: string, format: uuid }
        delegatedRights:
          type: array
          description: >
            Redemption rights issued by other cells and valid at this access point. Included
            in the package so a cross-cell entitlement still admits when the inter-cell link
            is down — the same reason locally issued entitlements are included.
          items:
            type: object
            required: [rightId, ticketId, issuingCellId, validFrom, validTo, entriesAllowed, entriesConsumed]
            properties:
              rightId: { type: string }
              ticketId: { type: string }
              issuingCellId: { type: string }
              guestLinkId: { type: string, nullable: true }
              mediaCodes:
                type: array
                items: { type: string }
              validFrom: { type: string, format: date-time }
              validTo: { type: string, format: date-time }
              entriesAllowed: { type: integer, nullable: true }
              entriesConsumed: { type: integer }
              admissionProfileId: { type: string, format: uuid }
        blacklist:
          type: array
          items: { type: string }
          description: Media codes to deny outright regardless of entitlement state.
        admissionProfiles:
          type: array
          items:
            type: object
            required: [id, openMinutesBefore, closeMinutesAfter]
            properties:
              id: { type: string, format: uuid }
              openMinutesBefore: { type: integer }
              closeMinutesAfter: { type: integer }
              maxDurationMinutes: { type: integer, nullable: true }
              requiresExitBeforeReentry: { type: boolean }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
