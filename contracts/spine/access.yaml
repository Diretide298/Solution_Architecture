openapi: 3.1.0
info:
  title: TICVAI Access Control
  version: 1.0.0
  x-ticvai-screen-count: 23
  x-ticvai-tier: spine
  x-ticvai-module: "3 — Admission and Access"
  x-ticvai-requirements: 201
  x-ticvai-capabilities: [C09, C10, C23, C25, C26, C29]
  x-ticvai-platforms:
    - "P07 Access Handheld"
    - "P04 POS"
    - "P06 Staff Ops App"
  description: >
    ## What this contract covers

    **The highest-frequency operation in a venue. Must work with no network.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 3 — Admission and Access |
    | **Requirements** | ~201 |
    | **Capabilities** | C09, C10, C23, C25, C26, C29 |
    | **Consumed by** | P07 Access Handheld · P04 POS · P06 Staff Ops App |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Entitlement validation at an access point, and the sync path for scans recorded offline.
    Capability C09.

    Settled positions this encodes:

    - Identity and entitlement are separate. Validation answers *does this media carry a
      valid entitlement for this access point right now*, not *who is this*.
    - Ticket ID and Media Code are different things. Media can be re-linked; the ticket ID
      does not change.
    - Validation reads the primary unconditionally. A ticket sold at the front gate and
      scanned twenty metres later must not be refused by a lagging replica.
    - Scans recorded offline are appended, never conflicting, deduplicated on the
      client-generated ULID.
    - Deny is always explained. A gate operator facing a queue needs a reason, not a
      boolean.

    Cross-cell (ADR-0014, ADR-0010): entitlements cross cells. A ticket issued in one cell
    is validated in another as a REDEMPTION RIGHT — a narrow projection carrying only what a
    gate needs, with no personal data. Redemption is authoritative in the consuming cell and
    reconciled back to the issuer, exactly as offline scans are authoritative on the device
    and reconciled to the server. The gate must work when the inter-cell link is down.

    NOT in this contract: turnstile hardware control. That is a driver concern, and the
    vendor SDK is outstanding. The API surface above is independent of it.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: validation
  - name: sync
  - name: accessPoint

paths:
  /access/validate:
    post:
      operationId: validateAccess
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      summary: Validate media at an access point and admit or deny
      description: >
        The access point is inherited from the session's workstation and is not a request
        parameter — an operator cannot validate against a gate they are not at.

        This operation is offline-capable. When executed offline the client evaluates the
        cached entitlement and deny rules locally, records the outcome, and replays through
        /access/scans on reconnect. The server is authoritative on replay and may downgrade
        a local `admitted` to `denied`; the client surfaces that as a reconciliation item
        rather than silently discarding it.
      tags: [validation]
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: >
            Validation completed. Check `outcome` — a denial is a successful validation,
            not an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404':
          description: Media not recognised in this cell
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /parking-facilities:
    get:
      operationId: listParkingFacilities
      x-ticvai-consumed-by:
        - "P08 BO-006 Parking Configuration"
      summary: Car parks at a venue, and how each integrates
      description: >
        3.2.30 and CF-52, settled 14 August. **Three integration modes**, and the mode decides
        what the platform must do at sale.
      tags: [access]
      x-ticvai-permission: ACCESS_POINT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Facilities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParkingFacility' }

    put:
      operationId: setParkingFacility
      x-ticvai-consumed-by:
        - "P08 BO-006 Parking Configuration"
      summary: Configure a car park and its integration
      description: >
        **The mode is the decision, and the three are not variations of one thing.**

        `none` — TICVAI issues its own QR and security verifies it by eye. No integration, and
        the guest experience depends on a person.

        `plateWhitelist` — the guest gives a plate at checkout and the platform pushes it to the
        parking system's whitelist. **The barrier opens without anything being presented**,
        which is the best experience and the only mode that needs a plate captured at sale.

        `qrHandoff` — TICVAI sends a code the barrier validates. No plate needed, and it fails
        the way any code fails: a dead phone at a barrier with a queue behind it.

        A fourth case is out of scope: pay-per-hour parking unrelated to a ticket runs on the
        parking system's own POS (14 August).
      tags: [access]
      x-ticvai-permission: PARKING_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParkingFacility' }
      responses:
        '200':
          description: Configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingFacility' }

  /parking-entitlements:
    post:
      operationId: createParkingEntitlement
      x-ticvai-consumed-by:
        - "P02 GST-027 Parking – Reserve & Pay"
      summary: A guest bought parking
      description: >
        **Pushes the plate to the parking system where the mode is `plateWhitelist`**, and that
        push is the operation that was missing — CF-52 settled the direction on 14 August and
        nothing implemented it.

        Where the push fails the entitlement is still valid. **The guest paid**, and a barrier
        that will not open is a staffed problem rather than a refund.
      tags: [access]
      x-ticvai-permission: null   # created by the order that bought it
      x-ticvai-auth: service
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParkingEntitlement' }
      responses:
        '201':
          description: Created, and pushed where the mode requires it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingEntitlement' }
        '502':
          description: >
            **The parking system rejected the push. The entitlement is still created** and
            flagged, because the guest has paid and the failure is ours to chase.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /parking-entitlements/{entitlementId}:
    parameters:
      - name: entitlementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateParkingEntitlement
      x-ticvai-consumed-by:
        - "P02 GST-027 Parking – Reserve & Pay"
      summary: Change the plate, or revoke
      description: >
        **A guest changing car is the common case** and it must work after purchase — someone
        who books parking a month ahead does not know which car they will bring.

        Revocation removes the plate from the whitelist. A refunded parking entitlement whose
        plate still opens the barrier is a car park giving away spaces.
      tags: [access]
      x-ticvai-permission: null
      x-ticvai-auth: guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParkingEntitlement' }
      responses:
        '200':
          description: Updated, and re-pushed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParkingEntitlement' }

  /access/override:
    post:
      operationId: overrideAccess
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      summary: Admit against a failed validation
      description: >
        Records the overriding principal, the original denial reason and a mandatory
        justification. Every override is auditable — this is the operation most likely to
        be examined after an incident.
      tags: [validation]
      x-ticvai-permission: ACCESS_OVERRIDE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, scanId, reason, recordedAt]
              properties:
                id:
                  type: string
                  pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
                scanId:
                  type: string
                  pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
                  description: The denied scan being overridden.
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Override recorded and entry admitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: The scan was not a denial, or has already been overridden
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /access/lookup:
    get:
      operationId: lookupTicket
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      x-ticvai-read-routing: replica
      summary: Read-only validity check without admitting
      description: >
        Support and guest-services use. Does not create a scan, does not decrement re-entry
        counts, does not admit. Distinct permission from ACCESS_VALIDATE.
      tags: [validation]
      x-ticvai-permission: TICKET_LOOKUP
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: mediaCode
          in: query
          schema: { type: string, maxLength: 256 }
        - name: ticketId
          in: query
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '200':
          description: Entitlement state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketStatus' }
        '400':
          description: Neither mediaCode nor ticketId supplied
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /access/scans:
    post:
      operationId: syncScans
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P06 EMP-049 Hand over the journal"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      summary: Replay scans recorded offline
      description: >
        Ordered batch. The server processes in `sequence` order and stops at the first
        entry it cannot accept, returning results for those processed — a scan that depends
        on a prior scan must not be evaluated out of order.

        Deduplication is on the scan's ULID. Replaying a batch after a crash is a no-op for
        entries already accepted.
      tags: [sync]
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, scans]
              properties:
                deviceId:
                  type: string
                  format: uuid
                  description: Sequence numbers are monotonic per device, not globally.
                scans:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/OfflineScan' }
      responses:
        '200':
          description: >
            Batch processed, wholly or up to the first rejection. Always inspect `results`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanSyncResult' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    get:
      operationId: listScans
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P06 EMP-049 Hand over the journal"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      x-ticvai-read-routing: replica
      summary: List scan events
      tags: [sync]
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: accessPointId
          in: query
          schema: { type: string, format: uuid }
        - name: ticketId
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/ScanOutcome' }
        - name: recordedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: recordedTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Scans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ScanEvent' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /access/offline-package:
    get:
      operationId: getOfflinePackage
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-011 Scan — admitted"
        - "P06 EMP-012 Scan — denied"
        - "P06 EMP-013 Override"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-016 Offline scanning"
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-004 Admitted"
        - "P07 SCN-005 Denied"
        - "P07 SCN-006 Override"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-012 Offline scanning"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      x-ticvai-read-routing: replica
      summary: Entitlement and rule set for offline validation
      description: >
        Pulled by scanners and venue edge nodes so validation continues through a WAN
        outage. Returns entitlements valid within the requested window for the session's
        access point, plus the deny rules needed to evaluate them.

        `etag` supports conditional refresh — a device on a slow link should not re-download
        an unchanged package.
      tags: [sync]
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: validFrom
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: validTo
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflinePackage' }
          headers:
            ETag:
              schema: { type: string }
        '304':
          description: Unchanged since the supplied ETag
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /access-points/{accessPointId}/mode:
    parameters:
      - name: accessPointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setTurnstileMode
      x-ticvai-consumed-by:
        - "P07 SCN-002 Access point & direction"
        - "P07 SCN-016 Gate mode"
        - "P08 BO-064 Zones & Areas"
      summary: Set the operating mode of an access point
      description: >
        Podium operation. Changes what the gate does, not who may pass it.
      tags: [accessPoint]
      x-ticvai-permission: TURNSTILE_MODE_SET
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/TurnstileMode' }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Mode set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessPoint' }
