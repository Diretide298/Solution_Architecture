  /blacklist:
    get:
      operationId: listBlacklist
      x-ticvai-consumed-by:
        - "P07 SCN-010 Blacklisted"
        - "P08 BO-033 Blacklist Management"
      x-ticvai-read-routing: primary   # a removed-too-late blacklist entry admits someone barred
      summary: List blacklisted media
      tags: [accessPoint]
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BlacklistEntry' }
    post:
      operationId: addBlacklistEntry
      x-ticvai-consumed-by:
        - "P07 SCN-010 Blacklisted"
        - "P08 BO-033 Blacklist Management"
      summary: Blacklist a media code
      description: >
        Denies outright regardless of entitlement state. Included in the offline package so
        it holds during an outage — a blacklist that only works online is not a blacklist.
      tags: [accessPoint]
      x-ticvai-permission: ACCESS_POINT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
