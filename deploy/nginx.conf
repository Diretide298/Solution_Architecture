# The only thing on this machine the internet can reach.
#
# Both application processes bind 127.0.0.1, so ports 4173 and 8787 do not
# exist from outside. Everything arrives here, on one address, which is what
# makes the two halves one origin: no CORS to configure, and one session cookie
# that both of them see.
#
# The route split is by path, and the two sets do not overlap. The accounts
# service owns anything to do with who you are and what you decided; the reader
# owns the delivery package and the pages.

upstream ticvai_api    { server 127.0.0.1:8787; keepalive 8; }
upstream ticvai_viewer { server 127.0.0.1:4173; keepalive 8; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # There is no certificate on this address yet. Say so honestly rather than
    # pretending: these headers cost nothing and are the only protection the
    # browser can give a page served over http.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The delivery package is megabytes of JSON. Compressing it is the single
    # biggest thing available here.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_proxied any;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # ── accounts, invites and verdicts ──────────────────────────────────
    # Named prefixes rather than a catch-all, so a new endpoint on the reader
    # cannot be swallowed by this block by accident.
    location ~ ^/(api/(auth|accounts|invites|validation|verdicts|health)|docs|openapi\.json) {
        proxy_pass http://ticvai_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── the live-reload stream ──────────────────────────────────────────
    # Server-sent events. Buffering this would hold every message until the
    # response ended, which for a stream is never.
    location = /api/events {
        proxy_pass http://ticvai_viewer;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ── the delivery package, and every page ────────────────────────────
    location / {
        proxy_pass http://ticvai_viewer;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }
}

# ── when there is a name and a certificate ──────────────────────────────
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d viewer.example.com
#
# certbot rewrites this file to listen on 443 and redirect 80. After that, set
# TICVAI_SECURE_COOKIE=1 in ticvai-api.service and restart it, so the session
# cookie stops being sent over plain http. Nothing else here has to change —
# that is what one origin buys.
