# **Scenario (c) - dedicated infrastructure for a flash sale.** CF-162, ADR-0035 (amended
# 3 September: `synchronous_commit` moved from the server to the session).
#
# **250,000 requests a day is 2.9 per second. Five thousand per second is 1,700 times that.**
# At peak the entire daily volume arrives in fifty seconds - this is not a bigger platform, it is
# the Bahrain shape, and it gets its own infrastructure for the duration.
#
# **Three services, not sixteen.** The burst path is 34 operations across Catalogue and Order plus
# authentication, touching 42 tables of 374. Marketing, Reporting, Inventory, F&B, Retail and
# Maintenance see no part of a ticket sale and are not deployed.
#
# **The replica numbers below are floors, and compose is why they look like fixed counts.**
# Compose has no autoscaler, so it can only be told one number - and the number it is told is the
# minimum, from tools/derive-burst-scope.py. **In a real deployment there is no maximum.**
#
# **A ceiling is a cap on absorbing a peak nobody predicted**, and the peak is the whole reason
# this environment exists: 60,000 seats over two hours is 1,045 RPS, and the same sale compressed
# into twenty minutes is 6,270. A ceiling set from the first fails the second, which is the Bahrain
# outage with a config value in front of it.
#
# For reference only, at 5,000 RPS against the ADR-0032 triggers - whose pooling half is amended by
# ADR-0038, and these are the trigger figures rather than the pooling ones: Catalogue 8, Order 5,
# Identity 3, and 640 client connections against pgbouncer's 5,000. **Those are what the arithmetic
# implies, not what the autoscaler is allowed.**
#
# **One database means one pool, and the 80 server connections are no longer split three ways.**
#
# **The real constraint is not a replica count.** acquireInventoryHold serialises - above some
# number more replicas are more waiters on one lock. Measure it with
# tools/bench.py --pattern hot-venue.
#
# **synchronous_commit stays ON at the server, and that reverses an earlier decision.**
#
# It was off here, server-wide. **At 15% of the statement ceiling it was buying headroom the
# environment already had, and paying for it with acknowledged-commit durability on the money
# path** - a guest whose payment is acknowledged and then lost by a crash is not a latency
# problem.
#
# **Turn it off per statement, not per server**, and only for telemetry and analytics writes:
#
#     SET LOCAL synchronous_commit = off;
#
# **SET LOCAL, never SET.** Under pgbouncer transaction pooling a session-level SET leaks onto
# whichever connection the pooler hands out next - the order path inherits a setting the analytics
# path chose, and nothing reports it. **This is the production footgun that makes the setting
# dangerous rather than the durability trade.** ADR-0032 — whose pooling half ADR-0038 amended,
# though this half stands — forbids session-scoped state for exactly
# this reason.
#
# **And turning it on tightens the wall, which is why sequencing matters.** An fsync adds 0.5-2ms
# per commit on SSD-backed WAL. If that fsync happens while the row lock is held, a 6ms lease
# becomes 7-8ms and the per-row ceiling falls with it.
#
# **Stripe first (variant C), then enable durability.** The other order tightens the wall before
# widening it.
#
# **Better still, commit outside the lock**: acquire hold, release, commit order. Whether the
# implementation does that is the difference between a 6ms lease and an 8ms one, and it is worth
# checking before either change.
#
# **The database topology, and it is the same in all seven configs** (ADR-0038, ADR-0039):
#
#     postgres instance  =  region  =  the cell
#       |
#       +-- control database          once per instance: cells, tenants, licences, rollouts
#       +-- database per tenant       25 schemas -> tables -> venue_id partitions
#
#     services   shared across tenants, scaled on need and traffic, and routed per request
#                to a tenant database by tenant id
#
# **One tenant and one event.** A burst cell is stood up for one on-sale, which is why
# ADR-0038 superseded ADR-0036 rather than amending it: with one tenant database there is
# nothing left for a per-service split to buy.
#
# **A service is not deployed per tenant.** It holds a small pool to the control database to
# resolve a tenant to its database name, then a pool per tenant database opened on that tenant's
# first request — so `PG_POOL_MIN/MAX` below are per tenant, which is exactly how ADR-0038
# amended ADR-0032's pooling: 20 connections across 25 concurrent tenants is
# `max_connections` in full.
#
# **Every service used to point at one `ticvai` database.** That was the arrangement ADR-0038
# replaced, and it was still here in all seven configs after the ADR was accepted.


# **One instance, one database** (ADR-0038, 3 September). A burst cell is one tenant and one
# event, so under one-database-per-tenant it is one database - and the three per-service databases
# that stood here are gone with the decision that argued for them.
#
# **ADR-0036 is superseded and this is the file it was written about.** It carved a bounded
# exception out of CF-161 for CellKind: burst - one instance, a database per service - on the
# grounds that a burst cell lives for one on-sale, so 'harder to split after two or three years'
# never reaches it. **CF-161 then closed the other way**: segregation per tenant, not per service.
# The exception's own reopening trigger named exactly this - *'CF-161 resolves toward... it must be
# restated against the new decision rather than inherited from this one'* - and restated against
# ADR-0038 it does not survive, because the thing it was an exception to no longer exists.
#
# **The costs it itemised go with it.** Three connection pools become one. The cross-service read
# inside the lease lock - acquireInventoryHold reading catalogue.performance and writing
# catalogue.inventory_hold - is a same-database transaction again, which is what ADR-0031 needs
# when it makes lease duration the ceiling. Provisioning is one CREATE DATABASE.

services:
  postgres-hot:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticvai
      POSTGRES_PASSWORD: ticvai
      # The burst tenant's database. Named from the tenant's stable code in
      # control.cell_tenant (ADR-0039); `ticvai` here is the placeholder a compose
      # file has to use, because compose has no tenant to substitute.
      POSTGRES_DB: control
      TICVAI_TENANTS: acme:11111111-1111-1111-1111-111111111111
    volumes:
    - ../backend/control:/docker-entrypoint-initdb.d:ro
    - ../backend/initdb-provision.sh:/docker-entrypoint-initdb.d/zzz-provision.sh:ro
    - ../backend:/opt/ticvai:ro
    command: postgres -c max_connections=800 -c shared_buffers=8GB
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres-hot
      DB_USER: ticvai
      DB_PASSWORD: ticvai
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '5000'
      DEFAULT_POOL_SIZE: '80'
    depends_on:
    - postgres-hot
  catalogueservice:
    build: ../services/CatalogueService
    environment:
      PG_CONTROL_DSN: postgres://ticvai:ticvai@pgbouncer:5432/control
      PG_TENANT_DSN_TEMPLATE: postgres://ticvai:ticvai@pgbouncer:5432/{database}
      TENANT_HEADER: x-ticvai-tenant
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '8'
      PG_POOL_MAX: '40'
    depends_on:
    - pgbouncer
    - redis
    deploy:
      replicas: 8
      resources:
        limits:
          cpus: '4'
          memory: 2G
  orderservice:
    build: ../services/OrderService
    environment:
      PG_CONTROL_DSN: postgres://ticvai:ticvai@pgbouncer:5432/control
      PG_TENANT_DSN_TEMPLATE: postgres://ticvai:ticvai@pgbouncer:5432/{database}
      TENANT_HEADER: x-ticvai-tenant
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '8'
      PG_POOL_MAX: '40'
    depends_on:
    - pgbouncer
    - redis
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '4'
          memory: 2G
  identityservice:
    build: ../services/IdentityService
    environment:
      PG_CONTROL_DSN: postgres://ticvai:ticvai@pgbouncer:5432/control
      PG_TENANT_DSN_TEMPLATE: postgres://ticvai:ticvai@pgbouncer:5432/{database}
      TENANT_HEADER: x-ticvai-tenant
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '8'
      PG_POOL_MAX: '40'
    depends_on:
    - pgbouncer
    - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 1G
