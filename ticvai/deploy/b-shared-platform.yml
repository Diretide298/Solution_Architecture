# **Scenario (b) — centralised platform for small-to-medium tenants.** CF-162.
#
# **The hybrid placement, sized for many tenants in one cell.** Shared services carry the
# request load; venue services sit at the venue because 123 of their operations work offline
# and a shared service cannot be locally available.
#
# **pgbouncer is not optional here.** 20 Catalogue replicas at 20 connections each is 400
# against a primary that will not want them — transaction pooling is what makes horizontal
# scaling of the shared tier possible at all.
#
# **Failure**: blast radius is the cell — every tenant in it. Mitigated by scope partitioning,
# not by isolation. **This is the trade and it should be stated to a tenant, not assumed.**
# **Scaling**: Catalogue and Order autoscale on RPS. Nothing else needs to.
#
# **Replica floors are survivability, not load** (ADR-0061, accepted 1 October 2026): one replica
# means a deploy or a crash is an outage, and with three zones two replicas of the sale path lose half
# of it to one zone. So the five `commerce` modules below run 3, one per zone, and everything else 2.
# The per-deployable floors are in `x-ticvai-replica-floors` below.
#
# **The load does not need more.** A medium cell at 2,265 RPS peak implies 2 Order replicas and
# 1 of everything else - the autoscaler covers the rest, and under normal operation it has all
# day to notice a busy afternoon. **That is the whole difference from a sale**, where warming
# happens before traffic and the opening seconds are the peak.
#
# **These were 4 / 4 / 3 on Catalogue, Order and Identity** - burst-shaped numbers carried into
# the normal config by hand. **And eleven services sat at 1**, below survivability: Platform, AI,
# Reporting, Ledger, CrossRegion and every venue-scoped service was a restart away from an
# outage.
#
# **No maximum.** tools/derive-sizing.py holds the arithmetic.
#
# **The database topology, and it is the same in all seven configs** (ADR-0038 — amended by
# ADR-0040, which lets a region hold more than one instance — and ADR-0039):
#
#     postgres instance  =  region  =  the cell
#       |
#       +-- control database          once per instance: cells, tenants, licences, rollouts
#       +-- database per tenant       25 schemas -> tables -> venue_id partitions
#
#     services   shared across tenants, scaled on need and traffic, and routed per request
#                to a tenant database by tenant id
#
# **Three tenants standing in for many.** Three is enough to make the pooling arithmetic
# real: PG_POOL_MAX of 20 per tenant per service is what ADR-0032's amendment is about.
#
# **A service is not deployed per tenant.** It holds a small pool to the control database to
# resolve a tenant to its database name, then a pool per tenant database opened on that tenant's
# first request — so `PG_POOL_MIN/MAX` below are per tenant, which is exactly ADR-0032's
# amendment: 20 connections across 25 concurrent tenants is `max_connections` in full.
#
# **Every service used to point at one `ticvai` database.** That was the arrangement ADR-0038
# replaced, and it was still here in all seven configs after the ADR was accepted.


# **Replica floors per deployable (ADR-0061, accepted 1 October 2026).** A floor is survivability:
# enough replicas to lose one zone and keep serving. It is set per unit of deployment (ADR-0055: the
# 17 modules ship as five units), not per module, and above it each unit autoscales on requests per
# second (ADR-0032). Compose runs each module as its own container, so the block below states what a
# cell is stood up at; the Terraform cell module carries the same numbers as `replica_floors` for the
# Helm values, and tools/derive-sizing.py as DEPLOYABLE_FLOORS. Change all three together.
x-ticvai-replica-floors:
  commerce: 3          # one per zone; identity, tenancy, catalogue, order, ledger, wallet
  access: 2            # cloud side only; the gate decides locally (ADR-0013)
  operations: 2        # back office and engagement
  workers: 2           # relay leases fail over (ADR-0058, amended 1 October); no container here yet
  ai-realtime: 2       # 3 in a large cell (AI design 4.3)
  ai-interactive: 1
  ai-batch: 0          # scales from zero on queue depth
  total-small-cell: 12

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticvai
      POSTGRES_PASSWORD: ticvai
      POSTGRES_DB: control
      TICVAI_TENANTS: acme:11111111-1111-1111-1111-111111111111,globex:22222222-2222-2222-2222-222222222222,initech:33333333-3333-3333-3333-333333333333
    volumes:
    - ../backend/control:/docker-entrypoint-initdb.d:ro
    - ../backend/initdb-provision.sh:/docker-entrypoint-initdb.d/zzz-provision.sh:ro
    - ../backend:/opt/ticvai:ro
    command: postgres -c max_connections=500 -c shared_buffers=4GB
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
  # **Vectors (ADR-0049):** in Azure, Qdrant self-hosted in UAE North as a 3-node HA cluster per cell
  # (TLS, JWT RBAC, per-collection snapshots to UAE storage), one collection per tenant with a
  # collection-scoped token. It is not a container in this file; the AI service reaches it by URL.
  # **The event broker (ADR-0057, proposed).** rabbitmq (local/venue-local); cloud broker: client's
  # choice. The client chooses RabbitMQ or Kafka for the cloud; development and the venue-local
  # profile run RabbitMQ either way (ADR-0046 needs it on-premise). Modules never talk to it
  # directly: a module enqueues through IOutbox, the relay in `workers` publishes through IBrokerPublisher, and
  # every consumer records what it handled in its tenant database's inbox (ADR-0058, amended 1 October).
  rabbitmq:
    image: rabbitmq:4-management-alpine
    labels:
      ticvai.broker: "rabbitmq (local/venue-local); cloud broker: client's choice"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ticvai
      DB_PASSWORD: ticvai
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '2000'
      DEFAULT_POOL_SIZE: '40'
    depends_on:
    - postgres
  catalogueservice:
    build: ../services/CatalogueService
    environment:
      PG_CONTROL_DSN: postgres://ticvai:ticvai@pgbouncer:5432/control
      PG_TENANT_DSN_TEMPLATE: postgres://ticvai:ticvai@pgbouncer:5432/{database}
      TENANT_HEADER: x-ticvai-tenant
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '4'
      PG_POOL_MAX: '20'
    depends_on:
    - pgbouncer
    - redis
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 1G
