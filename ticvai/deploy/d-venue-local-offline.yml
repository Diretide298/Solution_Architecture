# **Config 4' — shared burst tier, venue-local offline tier.** The inverse of putting the
# horizontal-scaling services at the venue.
#
# **Four services carry the burst and they are shared**: Catalogue, Order, Identity, Access. A
# flash sale for one event is a spike *in one venue* — per-venue, that venue's cell absorbs 5k RPS
# alone while every other sits idle. **Shared, it pools.**
#
# **Four services sit at the venue and they are the offline ones**: F&B, Inventory, Retail,
# VenueOps. **103 of their 286 operations work offline.** A venue with no network still cooks,
# still counts stock, still sells merchandise — that is the product, not a resilience feature.
#
# **The venue tier owns 80 tables and reads 100.** It reaches ten foreign schemas: 43 reads and 15
# writes across the boundary. That is the whole design constraint and it resolves two ways.
#
# **Foreign reads are cached, not fetched.** 12 into `platform`, 8 into `identity`, 6 into
# `catalogue` — the org tree, who a principal is, what a menu item is. All slow-changing, all
# already published to the till as a bundle (ADR-0013). **The same mechanism serves the venue
# cell.**
#
# **Foreign writes are journalled, not written.** 5 into `orders`, 4 into `marketing`, 4 into
# `catalogue`. A food order becomes an order; a guest note becomes a profile update. **Those go
# through `syncOrders` and its rejection path — the mechanism exists and is walked by F33.**
#
# 🔴 **What this costs.** A venue cell is a Postgres and a Redis per venue. At 200 tenants
# averaging three venues that is 600 small databases, and **CF-161 has to be settled before that
# is a sentence anybody can cost.**
#
# **What it buys.** A venue keeps trading through a regional outage, and the burst pools across
# venues instead of being trapped in one.
#
# **The database topology, and it is the same in all seven configs** (ADR-0038, ADR-0039):
#
#     postgres instance  =  region  =  the cell
#       |
#       +-- control database          once per instance: cells, tenants, licences, rollouts
#       +-- database per tenant       25 schemas -> tables -> venue_id partitions
#
#     services   shared across tenants, scaled on need and traffic, and routed per request
#                to a tenant database by tenant id
#
# **One tenant, at the venue.** The local instance holds the tenant whose venue it is in.
#
# **A service is not deployed per tenant.** It holds a small pool to the control database to
# resolve a tenant to its database name, then a pool per tenant database opened on that tenant's
# first request — so `PG_POOL_MIN/MAX` below are per tenant, which is exactly how ADR-0038
# amended ADR-0032's pooling: 20 connections across 25 concurrent tenants is
# `max_connections` in full.
#
# **Every service used to point at one `ticvai` database.** That was the arrangement ADR-0038
# replaced, and it was still here in all seven configs after the ADR was accepted.
#
# **The venue-local instances carry a control database too**, and that is the offline requirement
# rather than a copy-paste: a service resolves a tenant to a database name through
# `control.cell_tenant`, and a venue with no network still has to do that. This cell is what
# ADR-0017 calls `onPremise` — a placement table ADR-0038 amended to describe instances rather
# than cells — and the Control Plane may not be able to reach it, so the mapping it needs has
# to already be there. **A venue that cannot name its own database cannot serve the 103 offline
# operations that are the reason this tier exists.**


services:
  postgres:
    image: postgres:16-alpine
    environment: &id001
      POSTGRES_USER: ticvai
      POSTGRES_PASSWORD: ticvai
      POSTGRES_DB: control
      TICVAI_TENANTS: acme:11111111-1111-1111-1111-111111111111
    volumes: &id002
    - ../backend/control:/docker-entrypoint-initdb.d:ro
    - ../backend/initdb-provision.sh:/docker-entrypoint-initdb.d/zzz-provision.sh:ro
    - ../backend:/opt/ticvai:ro
    command: postgres -c max_connections=500 -c shared_buffers=4GB
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
  redis:
    image: redis:7-alpine
