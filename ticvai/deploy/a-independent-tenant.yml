# **Scenario (a) — independent tenant deployment.** CF-162, requested 24 August.
#
# One tenant, one database, one Redis, one of everything. **Isolation is total and so is the
# cost** — a tenant with three venues and 2.9 RPS steady state runs 18 containers.
#
# **Right for**: a tenant who requires it contractually, a tenant in a jurisdiction with no
# other tenant, or one large enough that its own load justifies the stack.
# **Wrong for**: everybody else, and 100-200 of them would be 3,000 containers.
#
# **Failure**: blast radius is one tenant. A cell failure takes them down and nobody else.
# **Scaling**: vertical first. Horizontal here means a second stack, which is scenario (b).
#
# **The database topology, and it is the same in all seven configs** (ADR-0038, ADR-0039):
#
#     postgres instance  =  region  =  the cell
#       |
#       +-- control database          once per instance: cells, tenants, licences, rollouts
#       +-- database per tenant       25 schemas -> tables -> venue_id partitions
#
#     services   shared across tenants, scaled on need and traffic, and routed per request
#                to a tenant database by tenant id
#
# **One tenant, and that is what `dedicated` means now.** ADR-0038: a dedicated cell is a
# regional instance holding one tenant database rather than a different kind of thing.
#
# **A service is not deployed per tenant.** It holds a small pool to the control database to
# resolve a tenant to its database name, then a pool per tenant database opened on that tenant's
# first request — so `PG_POOL_MIN/MAX` below are per tenant, which is exactly how ADR-0038
# amended ADR-0032's pooling: 20 connections across 25 concurrent tenants is
# `max_connections` in full.
#
# **Every service used to point at one `ticvai` database.** That was the arrangement ADR-0038
# replaced, and it was still here in all seven configs after the ADR was accepted.


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticvai
      POSTGRES_PASSWORD: ticvai
      POSTGRES_DB: control
      TICVAI_TENANTS: acme:11111111-1111-1111-1111-111111111111
    volumes:
    - ../backend/control:/docker-entrypoint-initdb.d:ro
    - ../backend/initdb-provision.sh:/docker-entrypoint-initdb.d/zzz-provision.sh:ro
    - ../backend:/opt/ticvai:ro
    command: postgres -c max_connections=200 -c shared_buffers=1GB
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  catalogueservice:
    build: ../services/CatalogueService
    environment:
      PG_CONTROL_DSN: postgres://ticvai:ticvai@postgres:5432/control
      PG_TENANT_DSN_TEMPLATE: postgres://ticvai:ticvai@postgres:5432/{database}
      TENANT_HEADER: x-ticvai-tenant
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '2'
      PG_POOL_MAX: '8'
    depends_on:
    - postgres
    - redis
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
  orderservice:
