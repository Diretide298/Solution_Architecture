id: CHG-FIN-012
date: '2026-10-14'
source: developer
kind: contract
summary: 'closeFiscalPeriod asks each module it depends on by a declared in-process query (Orders
  shift#unclosedShiftsInPeriod, Wallet wallet#periodCloseChecks, Approvals approvals#approvalRequirement) and raises its
  approval through Approvals'' in-process createApprovalRequest; recognitionRunComplete, the wallet-check mapping, the
  no-approval and repeat-call paths are defined; a failed wallet check is named in the 409; reopenPeriod takes the same
  approval route. The close is built after the owners'' queries: the resequencing is the lead''s.'
decision:
  what: 'contracts/spine/shift.yaml x-ticvai-queries unclosedShiftsInPeriod(scopePath, fromDate, toDate), served
    in-process and service: a shift blocks when its businessDate is in the period, its venue at or beneath the legal
    entity''s scope path, and its status open, suspended, pendingClosure or pendingVariance (not pendingApproval, which
    cannot transact); states block for E-STUCK with waitsOnActor for pendingVariance. contracts/satellite/wallet.yaml
    x-ticvai-queries periodCloseChecks(scopePath, periodStart, periodEnd), served in-process and service: Wallet''s six
    WalletPreCloseCheck codes mapped onto finance''s five walletChecks (subLedgerTiesToLedger and
    reconciliationSourcesMatched together are walletLiabilityMatchesLedger; warn passes), plus the roll-forward; empty
    when no wallet.balance exists in scope. contracts/spine/approvals.yaml x-ticvai-queries approvalRequirement (the
    evaluateApprovalRequirement answer), served in-process and service. finance closeFiscalPeriod: x-ticvai-read-via all
    three, route in-process (Ledger, Orders, Wallet and Approvals are all in commerce); the request is raised through
    the in-process createApprovalRequest (no x-ticvai-write-via: same deployable, as CHG-GDL-001); 200 with dryRun false
    when the matrix requires no approval; a call while approvalRequestId is pending answers 202 naming that request and
    raises no second one; recognitionRunComplete = runRecognition''s computation run dry moves nothing (blocking =
    entryCount), because ledger.recognition_schedule holds rules, not lines; PeriodCloseProblem gains
    failedWalletChecks (additive). reopenPeriod: read-via approvals#approvalRequirement, same in-process request.
    Lineage (tools/applied/r6-cr085-close-fiscal-period.py): closeFiscalPeriod reads ledger.legal_entity,
    orders.pos_shift, wallet.balance, approvals.rule and writes approvals.request; reopenPeriod reads approvals.rule and
    writes approvals.request.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-085 (ticket 28411, raised 14 October 2026 by Sanket Keluskar, blocking). Audit against r6-integrate
  594e51a2: the 202 path asks approvals.evaluateApprovalRequirement and raises createApprovalRequest
  (contracts/spine/finance.yaml:3268-3273, TRUE); noOpenShifts is "asked of orders.listShifts" (finance.yaml:7492-7493;
  listShifts is shift.yaml:162, OrderService, TRUE); settlementsReconciled and recognitionRunComplete read
  ledger.settlement(_exception) and ledger.recognition_schedule (finance.yaml:7494-7497, TRUE), but recognition_schedule
  is a rule table with no due lines (backend/tenant/010-ledger.sql:332-349), so the check had no definition;
  walletChecks need Wallet (finance.yaml:7516-7521) whose getWalletPreCloseChecks is in 30044, Block C
  (handoff/service-docs/tasks.csv:2446, TRUE) and whose six codes (wallet.yaml WalletPreCloseCheck) did not match
  finance''s five. Tenancy owns approvals (handoff/service-decomposition.json TenancyService), and Ledger, Orders,
  Wallet and Tenancy are all in commerce, so ADR-0055 rules 2 and 3 (amended 14 October, CHG-GEN-009) give in-process
  queries and calls, never a write of approvals.request by Ledger. The tables are PARTLY: VM-MIG-LEDGER (28264) builds
  fiscal_period_event, recognition_schedule, settlement and settlement_exception and is already in VM-LEDGER-FISCAL-1''s
  dependsOn (tasks.csv sequence 646, 797); SVC-ORDER-SHIFT-3 (28528) and SVC-TENANCY-REQUEST-1 (27813) are Block A phase 1
  but not in its dependsOn. The lineage listed none of the three modules (CHG-FXC-004 listed only ledger tables), so
  no check saw the dependency. Earlier: CHG-FXC-009 (the check definitions), CHG-CSP-040 (walletChecks), CHG-R6-032
  (Shift.businessDate), CHG-R4-019 (a variance within threshold needs a reason, which keeps a shift pendingClosure),
  CHG-RONEP-001 (closeFiscalPeriod pulled into Block A by docs/active/block-a-extra-tasks.json).'
