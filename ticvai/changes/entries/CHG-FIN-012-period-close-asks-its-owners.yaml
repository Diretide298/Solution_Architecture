notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".


  VERDICT: VALID as a blocker; its real cause is ordering plus undeclared dependencies. Claims 1-3 and 5 TRUE; claim 4
  (tables) PARTLY: the plan already orders VM-MIG-LEDGER before the close. Option C (not-evaluated checks) rejected,
  as the CR says.


  PREVENTION: check-cross-module-reads did not catch it (it reads only the lineage, and the lineage listed only ledger
  tables); check-error-sources did not either (it reads a 4xx''s own description, and closeFiscalPeriod''s 409 said
  only "the close checks failed": the shifts and wallet checks were defined in PeriodCloseResult). Extended:
  E-SCHEMA-READ-VIA follows the response schema''s $refs and the schema fields it points at in backticks
  (`PeriodCloseResult.checks`), one hop, and fails a refusal defined there by another module''s entity without problem
  types and a read-via; closeFiscalPeriod 409 is MUST_FIX (never baselined). Run with the parent''s contracts
  (594e51a2) it FAILS ("closeFiscalPeriod 409 is defined in its schema (PeriodCloseProblem, PeriodCloseResult.checks)
  by order/shift (OrderService), wallet (WalletService)"); on this branch it PASSES with 12 other pre-existing
  findings baselined (allocateResources, changeOwnCredential, claimTicketTransfer, createDashboard, createGuestFnbOrder
  x2, deleteMediaAsset, setApprovalMatrix, setStepUpPolicy, storePaymentToken, transferOrderTickets, updateMediaAsset).


  LEAD TO CONFIRM: (1) pendingApproval shifts do not block a close; (2) the wallet code mapping, warn passes; (3) "no
  wallet module" = no wallet.balance in scope; (4) 200 when no approval is required, and a repeat call reuses the
  pending request; (5) recognitionRunComplete via runRecognition''s dry run (runRecognition itself reads
  orders.sales_order raw, a baselined XR-UNCOVERED its own ticket must settle).


  RESEQUENCING (a plan change, kind plan, 24-hour cooling-off: for the lead, not made here). Split 28411 /
  VM-LEDGER-FISCAL-1 (28412): listFiscalPeriods ships now (needs only MIG-LEDGER 27672). closeFiscalPeriod moves to a
  delta task that dependsOn VM-MIG-LEDGER 28264, SVC-ORDER-SHIFT-3 28528 (+ child: Orders implements
  unclosedShiftsInPeriod), SVC-TENANCY-REQUEST-1 27813 (+ child: the in-process approvalRequirement and
  createApprovalRequest) and the Wallet query. The Wallet query is the real blocker: getWalletPreCloseChecks and
  getWalletMovementSummary are in 30044 (Block C, done by 16 Dec) while 28411 is due 10 Nov. Recommended: pull
  wallet#periodCloseChecks with those two operations into Block A as a WalletService task before the close, because
  topUpWallet, holds, disputes and expiry are all built in Block A (SVC-WALLET-WALLET-2/8/9, VM-WALLET-WALLET-1), so a
  close without wallet checks would close over an unchecked stored-value liability. Otherwise closeFiscalPeriod moves
  to Block C after 30044. Not done: build-service-docs does not yet turn x-ticvai-read-via into dependsOn.


  ID: the batch code FIN already held CHG-FIN-001..011 (2 October), so this entry is CHG-FIN-012, not CHG-FIN-001.


  [DB] none: no table or column changes; the 409''s failedWalletChecks and the queries are not persisted.'
