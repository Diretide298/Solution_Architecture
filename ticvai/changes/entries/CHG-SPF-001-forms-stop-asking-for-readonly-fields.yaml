id: CHG-SPF-001
date: '2026-10-03'
source: audit
kind: spec
summary: Forms no longer ask for a field the request schema marks readOnly; the form says the server sets it.
decision:
  what: Take every readOnly field out of the Required / Optional lists and discards of the generated forms (and
    any input bound to one), and stop the generator writing them.
  by: Chinmay
  date: '2026-10-03'
why: 'Block A audit on live r2, 3 October (CHG-AUD-001, finding batches judge-log, judge-a-mid, judge-d-mid): BO-094''s
  Save venue point form asked for `id` and `mapId`, which the server sets; the generator listed every body field,
  readOnly or not. Chinmay, 3 October: fix the specs now, refresh, cut r1 of a fresh start.'
