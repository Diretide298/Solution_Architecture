notes: 'B-HOSTED-MODEL fails on the plan of 3044d8b0 (AI-ENGINE-GATEWAY and AI-ENGINE-SCRUB-GUARD) and passes after it. Not
  changed, for Chinmay: AI-ENGINE-CONCIERGE embeds and reranks on CPU in the cell (BGE-M3 and a cross-encoder) and
  SETUP-QDRANT runs a 3-node Qdrant cluster (ADR-0049); both are CPU software in our cell, like Presidio, not a model served
  on a GPU, so the default keeps them. ADR-0009, ADR-0020 and docs/architecture/ai-system-design.md still describe the in-cell
  fallback and Qwen3Guard: the docs batch owns them.'
