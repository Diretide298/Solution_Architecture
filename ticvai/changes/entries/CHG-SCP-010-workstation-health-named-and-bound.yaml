id: CHG-SCP-010
date: '2026-10-14'
source: audit
kind: contract
summary: 'getWorkstationHealth answered an inline object, so POS-001''s Workstation health panel could not bind it (its
  own note said so); the response is now the named schema WorkstationHealth, same shape, and the panel binds it.'
decision:
  what: 'contracts/spine/tenancy.yaml: getWorkstationHealth''s 200 response is `$ref WorkstationHealth`, a new schema
    (x-ticvai-persistence none - computed) with exactly the properties the inline object had (score, status,
    contributors). Not a breaking change: the wire shape is unchanged. screens/P04-point-of-sale.yaml, POS-001: the
    Workstation health panel `bindsTo: WorkstationHealth`, and its note no longer says it cannot bind. With two
    bound panels the screen is no longer read as one list and its detail: the denomination table is the count grid
    and the shift panel is the shift being opened, which is what the approved screen shows.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding, Block A audit before r6 (audit/ticvai/runs/audit-1014/classes.json): check-screen-wiring
  S-PANEL-ENTITY (R256) had 1 member on P04 and P06 (POS-001: the table shows Denomination, the panel Shift), 0
  after. The ruling for the class (the lead, 14 October 2026) decided GST-073; for POS-001 the panel is right and the
  missing binding was the defect, recorded on the component since CHG-FXS-003.'
