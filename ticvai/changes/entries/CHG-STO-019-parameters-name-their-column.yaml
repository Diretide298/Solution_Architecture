id: CHG-STO-019
date: '2026-10-14'
source: audit
kind: contract
summary: 'An <x>Id parameter matches a column the operation''s lineage reads or writes: the parameter names it, the lineage
  reads the table that holds it, or the table gets the key it lacked.'
decision:
  what: 'tools/applied/sto-parameters-14-october.py: x-ticvai-column on 42 parameters (a column of another name, or a path
    id that is its row''s id) and none on 5 that select no row (a price simulation''s customer and membership, the customer
    a segment''s rules are evaluated for, the device a policy bundle is signed for, the length variant whose duration is
    the window); 24 same-module lineage reads or writes; new readOnly keys where a table had none (a rental damage assessment,
    equipment assignment and inspection name their booking; a rendition its media asset; each rental rule set its product,
    one per product; a resource venue assignment its resource; a guest link the local subject it resolves, which createGuestLink''s
    homeSubjectId now stores). tools/check-parameter-columns.py reads the parameter''s x-ticvai-column and a scope id with
    a role in front (effectiveForVenueId).'
  by: Chinmay
  date: '2026-10-14'
why: 'Block A audit before r6, class check-parameter-columns/P-PARAM-NO-COLUMN (102 at audit-base b93b5a87, 14 after: keeps),
  evidence docs/active/audit-runs/audit-1014/classes.json; triage ruling "An <x>Id parameter matches a column in the operation''s
  lineage." (Sprint 1-2 judging, CHG-FXC-003).'
