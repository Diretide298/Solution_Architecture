notes: 'Batch STO. Keeps (14), each a cross-module data path, an undecided store or a plan change, in the hand-back: getGuestMenu.outletId
  (its lineage omits fnb.menu, the outlet''s menu; naming it moves SVC-FNB-MENU-1 from AM-FOOD-BEVERAGE-P04 to AM-ORDERS-RESERVATIONS-P02,
  a plan change for the lead), getBillingStatement.statementId (no table holds a billing statement), listBookableVenueMaps.productId
  (the product''s variants are Catalogue''s), listCustomerSatisfactionFeedback eventId and productId, listEscalationCriticalCase.eventId,
  listServiceRootCause compareId, eventId and productId, listPrivacyCompliance.productId (each through the order''s lines,
  Orders'' tables), listPrivacyConsent.policyId (White label''s policies), listMembershipUpgradeDowngrade.bulkMigrationId
  (orders.membership_migration), reconcileBurstEnvironment.burstEnvironmentId (sync.rejection keys a workstation, CF-162),
  resolveProductByCode.partnerId (no partner SKU mapping is stored). A cross-module read needs the owner''s declared query
  (batch MOD, XR-UNCOVERED). Migration effect: the new keys are nullable ADD COLUMNs in V0104 (with their indexes and, for
  the rule sets, unique indexes).'
