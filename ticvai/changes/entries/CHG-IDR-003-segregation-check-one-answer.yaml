notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Batch
  IDR. New rule C-SEGREGATION-409 in check-contract-shapes (registered in run-checks.py already): a POST, PUT or PATCH
  whose description names `SegregationRule` must declare a 409 listing segregation-breach, and no response may carry
  that type at another status; reads that name the rule (listPermissionFindings) refuse nothing and are not asked.
  Run on the parent commit r5 (1eb1d063, its contracts with this check copied in): FAIL, 4 new
  (createRole 422 carries segregation-breach; createRole, setPrincipalModuleAccess and setRolePermissions have no 409
  listing it). On this branch: PASS, 0 found, no baseline. The lower() unique index on Role.code and every
  x-ticvai-unique text column is batch GEN''s derive-ddl rule; this batch only states the comparison on Role.code.
  Details chosen where the decision left them open: requireApproval does not route an approval (the decision says
  "accepted and surfaced"); a DENY grant is never refused; createPrincipal''s role grants run the check; a refused
  parent-role edit names the child role in detail. 27764 is started: comment plus linked delta (ticvai/CLAUDE.md
  rule 6).'
