id: CHG-R10GFP-002
date: '2026-10-26'
source: audit
kind: process
summary: 'derive-entrystate-params writes `requestId` optional on WEB-024 and GST-066: the screen gets it from
  exportSubjectData''s answer and polls getSubjectDataExport with it, so no inbound edge has to carry it. The rule that
  decides (screen_patterns.creates) took only writes with a make verb, and "export" is none.'
decision:
  what: 'tools/screen_patterns.py creates(): a POST on the screen whose answer carries the parameter itself (and does
    not take it in its path) makes it, whatever its verb; the make-verb test stays for the schema-name match. param_for
    then writes the parameter optional with the note "opened without it, the screen makes one with
    `exportSubjectData`", which derive-entrystate-params and generate-screens-from-contracts both use. The parameter
    is derived (derive-entrystate-params fills blanks), so the screens in git do not change.'
  by: Chinmay
  date: '2026-10-26'
why: 'The r10 integration gate of 26 October 2026 (run 20261026-135604-1087): check-screen-patterns P5 on WEB-024 and
  GST-066, "requires requestId (from navigation) and none of its inbound edge(s) carries it", after ADAM CR-101
  (CHG-R10ID-016) put getSubjectDataExport (onInterval, path {requestId}) on both. 41 findings against the 39 the
  baseline pins.'
keys_touched:
  screens: [WEB-024, GST-066]
  operations: [exportSubjectData, getSubjectDataExport]
  files:
  - tools/screen_patterns.py
  - tools/tests/test_screen_patterns_creates.py
root_class: 'a generator rule that recognises an id-making write by its verb, not by what it answers'
tickets:
  started: []
  unstarted: ['28812 (WEB-024) and 28822 (GST-066), New: requestId is optional, from exportSubjectData']
release_tag: r10
decision_owner: Chinmay
adam_cr: CR-101
triage: blocker
prevention:
  type: check
  ref: tools/tests/test_screen_patterns_creates.py
status: open
notes: 'Measured on the gate tree after the screen derive steps: check-screen-patterns 39 findings (NP 1, P8 29, READ 9),
  the count tools/refresh-safe-baseline.json pins; P5 0. P8, READ and NP are the r6 bundle''s Block A screens the
  baseline records (CHG-TKT-008), not an r10 change.'
