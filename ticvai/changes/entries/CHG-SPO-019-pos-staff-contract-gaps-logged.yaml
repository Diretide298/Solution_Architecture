id: CHG-SPO-019
date: '2026-10-02'
source: audit
kind: contract
summary: Twenty-five Block A design-note corrections on the till, kitchen display, staff app and scanner need an operation
  or field the contracts do not have; they are logged here, not invented.
decision:
  what: 'Logged, not built: POS-008 a cashier-tier foreign-tender read (getForeignTenderReport is LEDGER_VIEW); POS-026 a
    till-scoped read of FinTaxInvoiceTemplate.autoIssueOnPayment (listTaxInvoiceTemplates is tenant LEDGER_VIEW); POS-012
    delivery-partner reference, driver and fee on an order; POS-021 F&B fields on a cart line (options, note, course, seat,
    priced by the server) and the offline F&B rule following the outlet''s depletion setting; POS-022 how the sales order
    links after Charge, an "uncollected" write, guest name/mobile/pickup time/delivery location on createFnbOrder and a till
    write of the buzzer number; POS-028 closeTableVisit''s own payments list (one tender flow) and table size, rotation, hall
    dimensions and VIP tag; EMP-058 one operation per act (reassignServer duplicates transferTableVisit), a table activity
    log, the host-seat transition in states/table.yaml; EMP-065 user-defined rejection reasons; KIT-007 a pager dispatch;
    KIT-008 getHaccpStatus''s inline response; KIT-010 the kitchen performance, station performance, demand forecast and recommendation
    reads; EMP-004 an accepted work-order state; EMP-005 one pause vocabulary, no id in recordWorkOrderTime''s body, execution
    permission for complete/parts/time, an execution checklist; EMP-026 nearMiss as kind and severity, a hazard kind with
    risk level, the statutory clock fields; SCN-003 a customer photo on the validation result. Also: runReport and listReports
    declare REPORT_VIEW_VENUE although POS-008 now names the own and workstation tiers.'
  by: Chinmay
  date: '2026-10-02'
why: 'Design-notes corrections on Block A and B screens (fnb-retail, finance-insights, venue-operations); the Phase B brief:
  "If a correction needs an operation that doesn''t exist, mark it status: logged and add it to an open CHG entry (kind contract)
  listing the gap. Don''t invent operations." Same class as CHG-WIR-011 and CHG-WIR-004.'
