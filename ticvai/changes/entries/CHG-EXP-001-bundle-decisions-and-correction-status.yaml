id: CHG-EXP-001
date: '2026-10-02'
source: cr
kind: design-input
summary: Every screen block in a design BUNDLE now lists the decisions taken on the screen, and shows only open corrections as pending; fixed and logged ones are one line each with their change id.
decision:
  what: >-
    tools/design_spec.py renders each screen's design-notes `decisions` as a "Decided on this screen" sub-section
    (question, decision, decided by, date, the DEC and CHG ids, and a Reviewable flag on a default the lead may still
    overrule). Corrections are split by status: no status is "Known correction pending"; `logged` is "Contract gap
    logged" with its open change entry; `fixed` is a one-line "Fixed on main" list with the CHG id; `withdrawn` is
    left out. The acceptance checklist counts only open corrections and adds a line for the decisions.
  by: Chinmay
  date: '2026-10-02'
why: >-
  Phase B apply brief of 2 October (exporter row), after CHG-NOTE-001..009 moved 536 answered questions into
  `decisions` and marked 947 corrections fixed and 161 logged against the wiring, guest, door and finance entries
  (CHG-WIR-001, CHG-NOTE-009). The exporter rendered neither: decisions were invisible to a design session, and every
  correction, fixed or not, was listed as "pending (do not draw the wrong version)", so a session would redraw fixes
  the package already carries and draw the old defaults of questions Chinmay had answered.
keys_touched:
  files:
  - tools/design_spec.py
  - docs/active/claude-design-runbook.md
  - handoff/design-batches/README.md
  other:
  - BUNDLE.md screen blocks (every design batch, at the next release refresh)
root_class: 'new: open-question-decided'
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
prevention:
  type: generator-rule
  ref: tools/design_spec.py::render_notes_decisions
status: closed
closed_by_commit: 5ded35eb
notes: >-
  Tested with --out (scratch, nothing exported into the repo) on P01-booking-selection-01, P13-white-label-01,
  P04-not-in-v2-01, P08-food-beverage-01 and WS78 (a P08 workshop batch with a logged correction and nine reviewable
  decisions). The batch folders are regenerated by the release refresh (DEC-563 sequencing, CHG-EXP-006).
