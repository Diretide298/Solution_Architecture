id: CHG-R6-031
date: '2026-10-12'
source: mom
kind: contract
proposed: '2026-10-12'
summary: 'A partner, reseller or other sales channel, and a product, can issue its tickets without dynamic QR: a ticket
  credential format (platform signed QR by default, static signed QR, RFID card) on the channel and as a
  per-product override, resolved once by ticket issuing (MoM 2 Sep 2026 §4.7, MOM-0330).'
decision:
  what: 'contracts/spine/access.yaml: new schema TicketCredentialFormat (platformSignedQr default, staticQr,
    rfidCard); AccessVerificationMethodPolicy.credentialFormatOverride (per product, BO-177);
    Entitlement.credentialFormat (the format it was issued in); getEntitlementCredential returns
    credentialFormat and says what each format returns (staticQr: no rotation; rfidCard: the card serial);
    issueOrderEntitlements takes an optional channelProfileId and resolves product override, else channel, else
    platformSignedQr. contracts/spine/catalogue.yaml: SalesChannelProfile.ticketCredentialFormat and
    ChannelFeesPaymentFulfillmentConfigurationInput.ticketCredentialFormat (saved on catalogue.sales_channel).
    contracts/spine/orders.yaml: Order.channelProfileId (readOnly, server-set). events/order-paid.yaml: optional
    channelProfileId. screens/P08-venue-back-office.yaml: ADM-266 "Ticket credential" select bound to the
    channel field; BO-177''s policy form collects credentialFormatOverride.'
  by: Chinmay
  date: '2026-10-12'
why: 'MoM 2 Sep 2026 (sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx) §4.7, MOM-0330 in
  handoff/board-dashboard-data/extracted.jsonl: VIP invitations and B2B/reseller-issued tickets "may need to
  fall back to a standard QR code or RFID card", and "the platform should support a per-product override to
  disable dynamic QR for specific ticket types". Its verdict (verdicts-final.jsonl) was Partial: no row lets a
  named product opt out of dynamic QR. The lead asked on 12 October for it per partner or channel, with the
  platform''s signed QR the default.'
keys_touched:
  schemas:
  - 'access.TicketCredentialFormat'
  - 'access.AccessVerificationMethodPolicy'
  - 'access.Entitlement'
  - 'catalogue.SalesChannelProfile'
  - 'catalogue.ChannelFeesPaymentFulfillmentConfigurationInput'
  - 'orders.Order'
  operations:
  - 'issueOrderEntitlements'
  - 'getEntitlementCredential'
  - 'setChannelFeePayment'
  - 'setVerificationMethodPolicy'
  screens:
  - 'ADM-266'
  - 'BO-177'
  files:
  - 'events/order-paid.yaml'
  - 'tools/check-promises-kept.py'
root_class: 'new: decided-setting-without-reader'
tickets:
  started: []
  unstarted: []
release_tag: r4
client_signoff: pending
decision_owner: Chinmay
adam_cr: 'pending (the lead raises the ADAM CR for r4; MOM-0330, asked for by the lead on 12 October 2026)'
triage: fix-forward
waivers:
  cooling_off:
    by: Chinmay
    date: '2026-10-12'
    quote: 'lets finish these as well now'
prevention:
  type: check
  ref: 'tools/check-promises-kept.py'
status: open
notes: 'Batch R6, 12 October 2026. **Reading flagged for the lead:** MOM-0330 itself is per product (VIP invitations,
  B2B/reseller ticket types); the per-channel setting is the lead''s 12 October framing, so both are modelled
  and the product override wins. The values are the narrowest reading of the minutes: the platform''s signed QR
  (default), a static signed QR ("standard QR code") and an RFID card. A partner''s own barcode symbology is not
  issued by the platform; tickets a partner issues itself are imported and validated (BO-181), unchanged.
  client_signoff pending (a change from minutes). New columns (access.entitlement.credential_format,
  access.verification_method_policy.credential_format_override,
  catalogue.sales_channel.ticket_credential_format, orders.sales_order.channel_profile_id) come from
  derive-schema and derive-ddl at the release refresh; run here they go into the forward migration and
  check-contract-storage passes.'
