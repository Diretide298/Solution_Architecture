summary: 'PasswordPolicy.requireBreachCheck names the corpus (the Pwned Passwords SHA-1 range dataset: 00000.txt to FFFFF.txt
  of SUFFIX:COUNT lines at Identity:BreachCorpusPath), the adapter CheckPasswordBreachedAsync(prefix), the check (422 policy-not-met,
  errors[] naming requireBreachCheck, after the length check, never logged), the readiness failure when the corpus is missing,
  and the setup task that ships it; createPrincipal and resetPrincipalCredential answer the same 422.'
decision:
  what: 'Posted on #30719 (Chinmay, 3 November 2026), under the lead''s "Close the CRs and respond to devs" and "get the NEw
    CRs in the r13" (3 November 2026): "the breached-password corpus is the Pwned Passwords SHA-1 range dataset, read from
    a configured directory. This ticket builds the adapter and the check; a setup ticket ships the data ... When Identity:BreachCorpusPath
    is unset, or the directory does not hold 00000.txt and FFFFF.txt, Identity''s host fails its readiness check and does
    not start ... Put the same check in createPrincipal (#31235, initialCredential) and resetPrincipalCredential (#31238 ...)"'
  by: Chinmay
  date: '2026-11-03'
