summary: ADR-0028 records why F&B owns its own catalogue table (F&B prices migrated into F&B so ticketing scales in isolation); ADR-0055
  notes it.
decision:
  what: F&B prices are owned by F&B, in its own catalogue table; an outlet may set its own price; the central catalogue prices tickets
    and single-price booths (DEC-034).
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October, batch 1 corrected (BO-045, workbook Q34): ''the split was deliberate, so the ticketing service can scale on
  its own''. ADR-0028 and ADR-0055 carried the module map without this reason; the MenuItem text in the F&B contract was stale.'
