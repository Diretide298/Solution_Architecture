id: CHG-SHP-003
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every PUT/PATCH/DELETE has an address: 237 that replace the one record of a scope, parent or caller declare
  `x-ticvai-singleton: true` with an `x-ticvai-singleton-note` saying what they are one of; 123 that create or replace
  one item of a collection move to `<collection>/{key}` (breaking: BC-340..BC-363, one entry per contract with
  `operations`); 3 drafted decision workspaces are kept. check-screens counts a create-or-replace PUT''s key as the
  screen''s own when the body carries it. derive-lineage now re-reads an operation''s verb and path from the contract;
  check-contract-compat and derive-lineage read a breaking-change entry''s `operations` list.'
decision:
  what: 'contracts/*: x-ticvai-singleton + note on 237 operations (one per scope, the caller''s; one per parent the
    body names; one set per scope replaced whole; the caller''s own record). Path keys on 123: the item path reuses an
    existing `/{x}` sibling (7 ops), else the body''s own key (ruleId, profileId ...) or `{<entity>Id}` equal to the
    body''s `id`. Kept: approveDecision, approveExceptionServiceRecovery and approveGroupDiscountException, drafted
    decision workspaces whose bodies name no record to decide (which record each decides is a design question for the
    lead; a path key would be a new required input no screen can supply). A key is named for the table the lineage
    reaches where the entity name differs (communicationProviderId, providerId, prepaidMinutesId, retentionSettingId,
    credentialPolicyId, lifecycleActionId), so check-parameter-columns matches it. docs/active/breaking-changes.yaml
    BC-340..BC-363. tools/check-screens.py: the entry-parameter rule counts a create-or-replace PUT''s key carried in
    its body. tools/check-contract-compat.py entry_operations(); tools/derive-lineage.py verb/path refresh and
    approved_removals over `operations`.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026, class check-contract-shapes/C-NO-ADDRESS (evidence
  audit/ticvai/runs/audit-1014/classes.json): 363 members before, 3 after on this branch (CHG-SHP; ruling "go with
  your recommendation", Chinmay, 14 October 2026). R162, R103. Prefer-singleton ruling followed where the resource is
  one per scope or per parent (237); per-parent singletons name the body field that picks the parent. Breaking per op,
  grouped per contract (24 entries) because the block has 40 ids; ADAM''s release-diff reads `operation` only, so it
  sees the first op of a grouped entry (ADAM change, not made here). derive-lineage --apply on this branch re-read 140
  paths (123 moved here, 17 stale before).'
