  - '#30794 (CR-082/CR-083; a comment, never a rewrite)'
  unstarted:
  - VM-IDENTITY-SESSION-1 (#29043)
  - VM-BO-053 (#29045)
release_tag: r6
decision_owner: Chinmay
adam_cr: CR-083 (ADAM)
triage: blocker
