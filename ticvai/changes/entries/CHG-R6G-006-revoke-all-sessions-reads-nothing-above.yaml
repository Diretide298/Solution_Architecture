  ref: tools/check-cross-module-reads.py
status: open
notes: 'Batch R6G, 14 October 2026. Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release
  today as an exception". Contract impact additive: a removed vendor extension and a response field marked deprecated
  (check-contract-compat output identical to the gate''s). Verified in w609 after derive-lineage --apply and the applied
  script: check-cross-module-reads passes (944 known, 0 new), check-lineage, check-screens, check-screen-permissions,
  check-screen-wiring, check-audience-match (as at the gate) and check-binding-ratchet unchanged or passing.
  listShifts needs REPORT_VIEW_WORKSTATION; the table is absent for anyone without it, as BO-053''s session panel is for
  SESSION_FORCE_LOGOUT. The VM-IDENTITY-SESSION-1 and VM-BO-053 statuses were not read from OpenProject; listed as
  unstarted pointer bodies. Removing openShiftsAffected is for the next major version (tracker F26).'
