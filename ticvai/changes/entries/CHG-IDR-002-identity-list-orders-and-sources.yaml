notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Batch
  IDR. Prevention: check-contract-shapes C-PAGED-ORDER, with this batch''s nine fixed members taken out of
  handoff/audit-baseline.json (authored: only --update-baseline or a reviewed hand edit writes it, no deriver), so a
  regression on any of them fails; batch GEN tightens the rule to require a named field. The derived DDL loses
  identity.role.principal_count and grant_count at the next refresh (x-ticvai-persisted false); the forward migration
  is the gate''s. The x-ticvai-rls extensions that make "counted under RLS" mean venue counts are batch GEN''s.
  Details chosen where the decision left them open: the order field for each other list (as above, the field each
  consuming screen reads first, a stored or per-request-stable key, a computed item tied by its natural key);
  createPrincipal''s home scope (homeScopePath, an additive optional field, default the caller''s own, because the
  decision says roleIds land at the principal''s home scope and nothing set it); the first roleIds entry as
  primaryRoleId (CreatePrincipalRequest has no primaryRoleId and isPrimary needs one); createPrincipal runs the
  grant-time segregation check (CHG-IDR-003), since its grants are createDelegatedAccess grants;
  createPrincipal evicts the permissions resolution cache as createDelegatedAccess does (tools/resolution_cache.py).
  check-problem-types counts 704, below its ceiling of 707: the lead lowers CEILING at the merge (other batches name
  types too). 27764 is started: comment plus linked delta, per ticvai/CLAUDE.md rule 6.'
