id: CHG-IDR-002
date: '2026-10-14'
source: developer
kind: contract
summary: 'Every baselined Identity list names its order and id tiebreak; Principal.roles, isPrimary and Role.permissions
  say where they come from; principalCount and grantCount are computed under RLS, not stored; createPrincipal.roleIds
  become delegated_access grants at the principal''s home scope; the lineage of listPrincipals, getPrincipal, listRoles
  and createPrincipal lists what they read and write.'
decision:
  what: 'contracts/spine/identity.yaml, orders (each "Ordered by `<field>` ..., `id` as the tiebreak"):
    listOwnPlatformStaffGrants and listPlatformStaffGrants openedAt desc; listRoles name asc; listPrincipals
    displayName asc; listDelegatedAccess and listDelegations createdAt desc; listActiveSessions startedAt desc
    (sessionId tiebreak); listSegregationViolations detectedAt desc (ruleId, principalId tiebreak; detectedAt defined
    as the latest moment that made the pair); listPermissionFindings kind (conflicting, missing, excessive) then
    permission; listAuthorisationPolicyEffectiveness name asc (policyId tiebreak); suggestRoleAssignment
    peersHoldingPercent desc then roleCode. Sources: Principal.roles x-ticvai-persisted false, from live
    identity.delegated_access role grants (ALLOW, not revoked, inside the validity window) joined to identity.role;
    RoleSummary.isPrimary = role.id = principal.primary_role_id; Role.permissions = the role''s own is_active
    role_permission rows, inherited not merged; Role.principalCount and grantCount readOnly, x-ticvai-persisted false,
    computed from live grants under row-level security (a venue manager counts the venue''s holders).
    createPrincipal: a description, homeScopePath (optional, default the caller''s home scope, stored as
    identity.principal.home_scope_id), roleIds each written as one identity.delegated_access row at the home scope as
    createDelegatedAccess writes it (the first is primaryRoleId), 403 declared, 409 problem types username-taken and
    segregation-breach. Lineage (tools/applied/identity-roles-14-october.py, as CHG-FXC-004 did): listPrincipals and
    getPrincipal read + identity.delegated_access, identity.role, platform.scope; listRoles + identity.delegated_access;
    createPrincipal reads the roles, permissions, rules and scope and writes identity.delegated_access and
    cache:resolution. handoff/audit-baseline.json: the nine fixed C-PAGED-ORDER members and createPrincipal:409 /
    setPrincipalModuleAccess:409 / setRolePermissions:409 (C-ERROR-PROBLEM-TYPE) removed. BO-053''s create form lists
    homeScopePath.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-077 (ticket 27764), audited 14 October 2026: listRoles and listPrincipals stated no order and the platform
  grants said "most recent first" naming no column (identity.yaml:4273, 4641), while identity.platform_staff_grant has
  opened_at and expires_at and PageCursor gives only the id tiebreak (common.yaml:46-50); C-PAGED-ORDER caught them
  but they were baselined (R154). Principal.roles had no lineage behind it, principal_count and grant_count were
  stored columns nothing maintained, Role.permissions did not settle revoked or inherited rows, and
  createPrincipal.roleIds landed nowhere. The lead chose the CR''s Option A, the counts computed under RLS, the
  lineage widened, roleIds defined, and the same order fix for every other baselined Identity list.'
