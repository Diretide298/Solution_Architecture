notes: 'Beyond the posted words: checkoutCart''s refusal of a line with no price is 409 notSellableOnChannel naming the
  line (the posted text says only "refuses such a line, as it refuses a line whose units are gone"); getCart''s and
  applyCartPromoCode''s promotion reads stay declared, marked not asked until #28136 is built; checkoutCart''s 409 and
  422 and applyCartPromoCode''s 422 now name their problem types. CartLine.unitPrice and lineTotal become nullable
  (the columns already were).'
