id: CHG-CR550-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'One cart pricing rule, written on getCart and used by getCart, addCartLine, updateCartLine, removeCartLine,
  applyCartPromoCode and checkoutCart: the unit price from catalogue#variantPriceRecords on the cart''s channel mapped to
  the catalogue channel (with the transport, pass, deposit and override exceptions), tax from the tax step of
  Catalogue''s price calculation component, totals in the venue''s currency, discountTotal 0 until promotions
  evaluation (#28136). A line with no price: addCartLine 409 notSellableOnChannel, getCart isAvailable false with null
  unitPrice and lineTotal, checkoutCart 409 naming the line. applyCartPromoCode answers 422
  promotion-evaluation-unavailable meanwhile. The six operations declare both reads in process.'
decision:
  what: 'ADAM CR-550, posted on #30684: "Decided (Chinmay, 3 November 2026): one pricing rule for the cart, used by
    getCart, addCartLine, updateCartLine, removeCartLine, applyCartPromoCode and checkoutCart. Build now: (1) Line unit
    price: catalogue#variantPriceRecords in process ... (2) Tax: for each line amount, call the tax step of Catalogue''s
    one price calculation component ... (3) Totals ... discountTotal 0 and appliedPromotionIds empty until promotions
    evaluation (#28136) is built ... (4) No price: addCartLine refuses 409 notSellableOnChannel ... (5) Storage ... (6)
    applyCartPromoCode: ... answer 422 promotion-evaluation-unavailable ... (7) Declare catalogue#variantPriceRecords
    and finance#taxCodeRecords (in process) on all six operations. #30684, #31127, #31128 and #31129 are unblocked."
    The lead''s instruction, 3 November 2026: "Dont hold r13. approve them and rever tto the devs", and "start on
    1,2,3".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-550 (Pranay Shinde, #30684 getCart): getCart, addCartLine, applyCartPromoCode and checkoutCart re-price the
  cart but declared no price, tax or promotion read that exists, so the cart had no pricing rule.'
keys_touched:
  operations:
  - getCart
  - addCartLine
  - updateCartLine
