    promotion-evaluation-unavailable until promotions evaluation is built; show the line as unavailable and the promo
    refusal as the existing promo error.'
  - '31742 (WEB-022 Membership Plans build, Chitrangi Mestry, Ready for QA) and 31784 (GST-007 Select Date & Time build,
    Chitrangi Mestry, In progress): a cart line''s unitPrice and lineTotal may be null with isAvailable false.'
  unstarted:
  - '30684 (getCart), 31127 (addCartLine), 31128 (applyCartPromoCode), 31129 (checkoutCart), all On hold, Pranay Shinde:
    unblocked, built to the rule as posted.'
  - '28141 (removeCartLine, updateCartLine, Pranay Shinde): re-price by the same rule and write the line and cart
    totals.'
release_tag: pending
