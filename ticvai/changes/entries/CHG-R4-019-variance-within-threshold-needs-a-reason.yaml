notes: 'Batch R4, 6 October 2026. F-VARIANCE-REASON (check-finance-rules, already in run-checks.py) fails on the
  commit before this change with three findings (no pendingClosure -> closed operation with a required reason;
  ShiftCountReceipt and ShiftCloseResult lack varianceReasonRequired) and passes after it. check-contract-compat
  against r1: PASS, 0 unapproved breaking changes (a new operation, a new request schema, new response fields and
  description changes only; no response enum gained a value: the hold reuses pendingClosure and
  awaitingCloseApproval). check-states, check-screens, check-step-up, check-screen-wiring, check-navigation and
  check-contract-shapes pass; check-contract-storage and check-audience-match fail only on findings that predate
  this branch (CHG-R4-011/014 fields awaiting their derived migration; getGameCard and the approvals audience). The
  derive gives giveShiftVarianceReason its own backend ticket at the next release. SVC-ORDER-SHIFT-1 (closeShift)
  starts at day 9.91, -5 (submitShiftCount) at 29.03, -7 (approveShiftClose) at 9.86, APP-POS-POS-007 at 8.65,
  APP-STAFF-EMP-009 at 55.19, VM-BO-040 at 57.60 (handoff/service-docs/block-a-schedule.json; no status snapshot
  in git): none started. Wireframes that change: POS-007, EMP-009, BO-040. The client is asked on 7 October whether
  a second, manager-only tier is wanted; nothing here presumes it.'
