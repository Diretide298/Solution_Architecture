id: CHG-R4-019
date: '2026-10-06'
source: client-review
kind: contract
summary: A shift whose blind count differs within the variance threshold closes only with a reason, given after the
  count is locked (new operation giveShiftVarianceReason); above the threshold supervisor or manager acceptance is
  unchanged, and the close stays blind.
decision:
  what: 'Additive, contracts/spine/shift.yaml. New operation giveShiftVarianceReason (POST
    /shifts/{shiftId}/variance-reason; SHIFT_CLOSE, escalated SHIFT_CLOSE_OTHER for somebody else''s shift; venue
    scope; online only; body ShiftVarianceReasonRequest {reason: tillError | unrecordedRefund | miscount | other,
    required; note, required with other (422 reason-note-required)}; returns ShiftCountReceipt; 409
    variance-reason-not-required; 403 not-shift-operator). submitShiftCount and closeShift: a non-zero variance
    within shiftVarianceThreshold with no cashierReason in the body no longer closes the shift; it is held in
    pendingClosure (outcome awaitingCloseApproval, an existing value) with the new response fields
    ShiftCountReceipt.varianceReasonRequired and ShiftCloseResult.varianceReasonRequired true, and
    giveShiftVarianceReason records the reason in the existing cashierReason / cashierNote columns, writes the audit
    record and closes the shift (or leaves it for approveShiftClose where the venue supervises every close).
    approveShiftClose also releases such a shift, its required reason recorded as the variance reason, so a client
    built at r1 still has a way to close it. Shift.varianceReasonRequired is a new computed response field
    (x-ticvai-persisted false; no column, no migration). A reason given with the count, or an exact count, closes
    as before. Blind close (CHG-FIN-003) is kept: the reason is asked only after the count is locked, and nothing
    the cashier sees carries the amount or the direction. Above the threshold nothing changes: pendingVariance and
    acceptShiftVariance (OVERSHORT_ACCEPT, held by both the Supervisor and the Venue Manager presets,
    docs/active/seed-data-proposal.md 2.2-2.3: the client''s "supervisor/manager approval"); no second threshold
    tier (asked of the client on 7 October). states/shift.yaml gains the pendingClosure -> closed transition on
    giveShiftVarianceReason (emits shift.closed); events/shift-closed.yaml lists it as an emitter;
    tenancy.yaml shiftVarianceThreshold''s description and docs/active/configured-limits-proposal.md row 11 state
    the policy. Screens: POS-007 (P04) gains the reasonRequired machine state, a "Give the reason and close"
    action, its form and the API; EMP-009 (P06) the action, form, state and API; BO-040 (P08) shows
    varianceReasonRequired, cashierReason and cashierNote, and a supervisor''s "Give the variance reason" action
    (SHIFT_CLOSE_OTHER). The prevention: check-finance-rules gains F-VARIANCE-REASON.'
  by: Chinmay
  date: '2026-10-06'
why: 'The client''s tracker answer T10.1 of 6 October 2026 (sources/client/2026-10-06-tracker-answers.md, filed by
  CHG-R4-017): "The system should support configurable cash variance tolerance. Variances within the permitted
  threshold may be closed with mandatory reason capture. Variances exceeding the threshold should require
  supervisor/manager approval. All variances and approvals must be fully audited and reported." The package had the
  threshold (tenancy.yaml VenueSettings.shiftVarianceThreshold, audit R094) and the acceptance above it
  (acceptShiftVariance, required reason and PIN, audit R080 (e)) and reported it (reporting.yaml shiftSummary), but
  within the threshold the shift closed on the count alone (states/shift.yaml, pendingClosure -> closed by job) and
  CloseShiftRequest.cashierReason was optional (DI-803). Making that field required would break clients built at
  r1, so the reason is a new state of the receipt and a new operation.'
