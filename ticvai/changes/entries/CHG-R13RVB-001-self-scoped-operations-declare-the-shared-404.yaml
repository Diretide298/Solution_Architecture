id: CHG-R13RVB-001
date: '2026-11-03'
source: audit
kind: contract
summary: 'Every self-scoped operation addressed by a path id declares the shared NotFound (404), the answer the package
  rule gives another caller''s record "exactly as one that does not exist" (contracts/README.md, CHG-GCF-002). 24
  operations declared none: the cart (getCart, extendCart, abandonCart, addCartLine, applyCartPromoCode, checkoutCart,
  removeCartLine, updateCartLine), claimTicketTransfer, transferOrderTickets, cancelReservation, retryMyDunningPayment
  (the review''s 12), and leaveQueue, listCustomerBadges, listFulfilmentSlots, listGuestDevices, recordConsent,
  registerGuestDevice, removeMfaMethod, sendAiMessage, updateParkingEntitlement, updateTableReservation,
  verifyMfaChallenge, verifyMfaEnrolment, which the same rule covers.'
decision:
  what: 'The lead, 3 November 2026, on the r13 review of all 1,582 Block A tickets: "why are these coming back again and
    again?", "get going on those as well so we close it", "you get the rest sorted". Review finding class
    self-scoped-404-undeclared (findings batch 2): self-scoped guest operations addressed by a path id promise another
    subject''s record is refused exactly as one that does not exist, and declare no 404. Declared as the self-scoped
    reads already do; no new rule.'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 Block A ticket review, finding class self-scoped-404-undeclared (batch 2; tickets #27735, #27910, #27860,
  #27861, #28141, #28219, #28233). The rule is contracts/README.md "x-ticvai-self-scoped" (Chinmay, 3 October 2026,
  CHG-GCF-002) and common.yaml NotFound; check-contract-shapes had no rule that the answer is declared.'
