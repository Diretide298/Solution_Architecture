summary: 'redeemWaitingGuest takes an optional queueId (the scanner''s queue), describes body.id as the device''s UUIDv7,
  never stored, and states the check order: 400, 404, 400 above party_size, wrongQueue, the status mapping (expired and
  noShow outsideReturnWindow), a late called entry, then admit. A denial answers 200 with nulls and writes nothing; entitlementExhausted
  is never answered; the enum is unchanged.'
decision:
  what: 'ADAM CR-596, posted on #33059: "Decided (Chinmay, 3 November 2026): option A. Build now: in redeemWaitingGuest,
    add an optional queueId (uuid) to the body ... Describe body.id as the device''s client-generated UUIDv7 for this redemption,
    used for offline de-duplication alongside Idempotency-Key and never stored; no new column, no migration. Run the checks
    in this order and stop at the first that applies: (1) ... (7) ... A denial answers 200 with outcome denied ... Never
    answer entitlementExhausted from this operation ... Leave the enum as it is ..." The lead''s instructions, 3 November
    2026: "the new one dont go in r15, log them and we add to r14 only" and "check for new crs and get them going as well".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-596 (Surendra Loke, #33059 redeemWaitingGuest): no rule mapped an entry''s status to a denyReason, nothing
  in the request could produce wrongQueue, and the body''s required id had no meaning or column.'
