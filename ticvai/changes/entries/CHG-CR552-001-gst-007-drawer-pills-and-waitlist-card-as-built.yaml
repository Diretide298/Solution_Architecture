notes: '**Design change: GST-007''s eligibility drawer, pop-up pills and waitlist card as built in 614c7ee.** The screen
  record''s notes say it as posted; the eligibilityDeclaration overlay''s body draws the folding person cards and pills;
  a joinWaitlist overlay (Cancel / Join) and a You''re on the waitlist! banner bound to WaitlistEntry.position are added;
  prototype.differences names the build. docs/active/approved-ui-changes.yaml records the three changed fields
  (overlay:eligibilityDeclaration, overlay:joinWaitlist, region:collection) against ADAM CR-552. The frame stays the
  prototype capture until the redraw (LO-CR552-001). The tokens waitlistColors and waitlistCardGradient are the guest
  app''s, as the build added them; screens/_design-tokens.yaml is not changed. **Named beyond the posted words:** the
  pop-up''s Cancel discards "the party size and the contact choice", the pop-up being where the screen already collected
  them.'
