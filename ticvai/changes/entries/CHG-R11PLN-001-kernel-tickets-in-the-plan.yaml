id: CHG-R11PLN-001
date: '2026-10-29'
source: cr
kind: plan
proposed: '2026-10-29T00:30'
summary: The four kernel tickets the lead made in OpenProject on 29 October (field encryption, service sign-in, Redis,
  device sign-in) are plan tasks of Foundation - Platform kernel, and the plan orders the waits behind the 17 follows
  links he made by hand, so the full release keeps that order.
decision:
  what: 'docs/active/block-a-extra-tasks.json: four PLATFORM tasks in KERNEL-TENANT-LIMITS''s shape, Pranay Shinde
    building, each waiting on PLATFORM-KERNEL: KERNEL-FIELD-ENC (#37050, 5 points, ADR-0063 action 6),
    KERNEL-SERVICE-AUTH (#37051, 8 points, ADR-0073 to be written first), KERNEL-REDIS (#37052, 3 points) and
    KERNEL-DEVICE-AUTH (#37053, 5 points), their subjects and text from the tickets the lead made; their ids in
    handoff/service-docs/pms-map.json (tools/op-created-merge.py). New `operationWaits` (operation -> the plan tasks
    its task waits for), wired by tools/build-service-docs.py: registerGuestDevice, enrolMfaMethod,
    verifyMfaChallenge, verifyMfaEnrolment and recordStorefrontSessionEvents wait on KERNEL-FIELD-ENC;
    endGuestDeviceSessions, recordConsentIdentifier, updateGuestSubjectDetails, requeueDeadLetter, listCellEndpoints,
    setAnalyticsProvider and setMaintenanceMode on KERNEL-SERVICE-AUTH; startSsoAuthorization,
    completeSsoAuthorization and endGuestDeviceSessions on KERNEL-REDIS; recordDeviceHeartbeat on KERNEL-DEVICE-AUTH.
    Each operation''s task follows the kernel task at the release. TEST-AM-FOUNDATION-PLATFORM (the module test) now
    also follows the four kernel tasks, as it follows every task of its app-module.'
  by: Chinmay
  date: '2026-10-29T04:40'
why: 'ADAM CR-271 and CR-283 (field encryption, ADR-0063), CR-281 (service sign-in), CR-282 (Redis) and CR-284 (device
  sign-in): the lead''s decisions of 29 October 2026 made the four tickets under #27687 (#37050 to #37053, created in the OpenProject container;
  their ids are in handoff/service-docs/pms-map.json) and linked each operation''s ticket to the kernel ticket it waits for by hand; at
  04:40 he made r11 a full release, whose links phase keeps only the order the plan has, so the plan records the
  tickets and their waits.'
