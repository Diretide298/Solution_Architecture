notes: 'proposed is when the tickets were made (28 October 20:30 UTC, 29 October 00:30 in the UAE). The 17 hand-made
  links all run from an operation''s sub-task, which the apply''s links phase never removes (it prunes only links
  between two plan tasks, op-release.rb), so all 17 stay; the plan''s order is between the tasks that build those
  operations and the kernel tasks. Not ordered by the plan, for the lead: #30831 (recordDeviceHeartbeat) follows
  #28829, MIG-TENANCY-3, which creates tenancy.data_retention_setting only; tenancy.device_telemetry, which the
  heartbeat writes, is created by MIG-TENANCY (#27652), which its task SVC-TENANCY-WORKSTATION-3 already follows, and
  its r10 columns (CHG-R10TEN-007) come in V0116. The link stays (the apply does not touch it); the plan adds no wait
  the package does not show. The "Not in ADAM yet" paragraph and the Unblocks line of the tickets are not carried:
  the waits are links, and the pointer replaces the description on a New ticket.'
