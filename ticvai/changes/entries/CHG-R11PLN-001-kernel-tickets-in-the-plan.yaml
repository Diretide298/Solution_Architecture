  - KERNEL-FIELD-ENC (37050)
  - KERNEL-SERVICE-AUTH (37051)
  - KERNEL-REDIS (37052)
  - KERNEL-DEVICE-AUTH (37053)
  operations: [registerGuestDevice, enrolMfaMethod, verifyMfaChallenge, verifyMfaEnrolment,
