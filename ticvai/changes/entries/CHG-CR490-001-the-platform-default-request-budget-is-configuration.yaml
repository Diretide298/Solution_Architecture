  ref: tools/check-business-rules.py::BR-TENANT-LIMITS-DEFAULT
status: open
notes: 'Not touched (a plan file): docs/active/block-a-extra-tasks.json KERNEL-TENANT-LIMITS still says it asks
  subscription#tenantRequestLimits with no word of the configuration key; the integration''s plan pass carries the
  key and the GET route (CR-491) into its text. Beyond the posted words: an unknown tenant id is answered as a tenant
  with no current contract (CR-491''s words, stated on the rule too).'
