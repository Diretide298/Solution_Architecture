  unstarted:
  - '27693 (KERNEL-TENANT-LIMITS, Pranay Shinde, New): build to the posted comment; keep TODO(TICV-27693) pointing at
    RequestLimits:Tenant:PlatformDefault.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-490
triage: fix-forward
prevention:
