notes: 'BR-DELEGATION-READS fails on the r11 contract (6 findings) and passes now. **Not generated yet: the widened
  write check.** It is stated on DelegatedAccess (beside x-ticvai-rls scope-or-subject) and on grantDelegation, but
  the scope-or-subject policy is written by tools/derive-ddl.py''s generator logic, which the DDL lane owns, so this
  lane did not change it: the generator must add OR platform.subject_holds_household_grant_over(over_subject_id) to
  that write check (a STABLE plpgsql function, not SECURITY DEFINER, true when an identity.delegated_access row has
  subject_id = current_setting(''ticvai.subject_id''), over_subject_id = the argument, delegation_kind familyMember or
  primaryHolder, effect ALLOW, revoked_at null and now inside valid_from/valid_to), and 920-row-level-security.sql
  and the next forward migration carry it. Beyond the comment''s words: grantDelegation and listDelegations list 403
  (common Forbidden); subjectMinorStatus answers an id with no row by leaving it out. Seen, not settled here: no
  operation writes the first familyMember or primaryHolder link over a child (grantDelegation says GST-069 writes it;
  access enrolFacePass requires it to exist), for its own CR or the left-out list.'
