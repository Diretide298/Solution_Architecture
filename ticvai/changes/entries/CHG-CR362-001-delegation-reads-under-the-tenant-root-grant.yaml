id: CHG-CR362-001
date: '2026-10-30'
source: cr
kind: contract
summary: 'grantDelegation and listDelegations read beyond the guest''s row security the package''s way (CR-336): a new
  rule question identity#subjectMinorStatus (subjectIds in; displayName and minorStatus minor, adult or unknown out;
  one statement under ITenantRootGrant over pii.subject, no date of birth returned) and the tenant root''s scope from
  tenancy#scopeRecords (level tenant) under ITenantRootGrant, cacheable per process. The write check on
  identity.delegated_access also admits a guest whose subject holds an active ALLOW familyMember or primaryHolder grant
  over over_subject_id; the minor age is the region of the session''s venue, else the highest among the tenant''s
  regions, else 18; staff need GUEST_MANAGE (GUEST_VIEW) at the tenant root, a venue grant answers 403, and both
  operations are x-ticvai-scope-level tenant.'
decision:
  what: 'Chinmay, 30 October 2026, reviewing the day''s CRs ("for each one actually check if they hold and if not then
    find out the best way keeping in mind what client needs"), posted on #30672: "not as recommended: keep A''s
    outcome, but use the package''s settled pattern for the reads (CR-336), not a new SECURITY DEFINER function. (1)
    Add a rule question, identity#subjectMinorStatus ... under ITenantRootGrant over pii.subject ... (2) Read the
    tenant root''s scope id and path with tenancy#scopeRecords (level tenant) under ITenantRootGrant ... (3) The write
    check on identity.delegated_access also admits a guest session where the session''s subject holds an active ALLOW
    familyMember or primaryHolder grant over over_subject_id ... (4) The minor age is the minorAgeThreshold of the
    region of the venue the session is in. With no venue, it is the highest threshold among the tenant''s regions, and
    with no region settings it is 18. (5) Staff need GUEST_MANAGE (GUEST_VIEW for listDelegations) at the tenant root.
    A venue-scoped grant answers 403, and both operations become x-ticvai-scope-level tenant."'
  by: Chinmay
  date: '2026-10-30'
why: 'ADAM CR-362 (Hrushikant Patkar, #30672 grantDelegation, blocking): pii.subject''s subject row security hides
  another guest''s date of birth (every adult counted as a minor, 409), platform.scope''s policy hides the tenant root a
  guest-made grant is stored at, and delegated_access''s write check refused the linked adult''s grant over a minor the
  contract allows (audit R126). The read pattern is CHG-CR336-001''s.'
