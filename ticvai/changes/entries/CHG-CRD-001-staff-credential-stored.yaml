id: CHG-CRD-001
date: '2026-10-14'
source: developer
kind: contract
summary: identity.principal_credential gets its columns from a never-returned PrincipalCredential schema (one current password
  or PIN per principal, a PHC hash, lockout counters) with a history child table; mustChangeCredential is stored on Principal
  and returned in LoginResponse; changeOwnCredential and login name a problem type per refusal; single sign-on principals
  and staff lockout are defined.
decision:
  what: 'identity.yaml: PrincipalCredential (x-ticvai-persistence identity.principal_credential + identity.principal_credential_history;
    principalId required, method password|pin, credentialHash PHC string, setAt, failedAttempts, lockedUntil; x-ticvai-unique-together
    [principalId, method]; history[] of credentialHash, replacedAt, read by the reuse check). Principal.mustChangeCredential
    (set by createPrincipal and resetPrincipalCredential, cleared only by a successful changeOwnCredential) and Principal.ssoProviderId;
    LoginResponse.mustChangeCredential (required). changeOwnCredential: 422 current-credential-wrong (not 401, the session
    survives), policy-not-met, credential-reused; 409 credential-managed-by-sso for a password change by an SSO principal;
    429 credential-locked. login: 401 sso-sign-in-required, 429 credential-locked; lockout through failedAttempts/lockedUntil
    against PasswordPolicy.lockoutAfterAttempts. createPrincipal and resetPrincipalCredential say where the body lands (x-ticvai-stored-as
    on initialCredential, newCredential, temporaryCredential). GuestCredential no longer claims changeOwnCredential writes
    it (that operation is staff and partner only). handoff/schema-storage-only.md names the schema. Lineage via tools/applied/credentials-and-stubs-14-october.py
    (login, changeOwnCredential, resetPrincipalCredential, createPrincipal, forceLogout). derive-ddl: a child table derived
    from an array no longer takes its parent schema''s unique-together.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-078 (ticket 27750): identity.principal_credential held only id and a nullable principal_id (010-identity.sql:396-399)
  while identity.yaml:7628 said the credential is stored hashed there; the 422 of changeOwnCredential had two causes and
  no problem types (identity.yaml:1130-1139, baselined in audit-baseline.json:377); a wrong current credential had no response;
  mustChangeCredential defaulted true (identity.yaml:1098, 8542) and was stored nowhere. Pattern: CHG-FXC-003 GuestCredential
  (identity.yaml:7208-7222). Audit roots R126, R132; ADR-0004 (Identity issues the JWT; SSO optional).'
keys_touched:
  schemas:
  - PrincipalCredential
  - Principal
  - CreatePrincipalRequest
  - LoginResponse
  - LoginRequest
  - ChangeCredentialRequest
  - ResetCredentialRequest
  - GuestCredential
  - PasswordPolicy
  operations:
  - login
  - changeOwnCredential
  - resetPrincipalCredential
  - createPrincipal
  - forceLogout
  tables:
  - identity.principal_credential
  - identity.principal_credential_history
  - identity.principal
  files:
  - contracts/spine/identity.yaml
  - handoff/schema-storage-only.md
  - handoff/api-data-lineage.json
  - tools/applied/credentials-and-stubs-14-october.py
  - tools/derive-ddl.py
root_class: A15 STORAGE-GAP
tickets:
  started:
  - 27750
  unstarted: []
release_tag: r6
decision_owner: Chinmay
adam_cr: CR-078
triage: blocker
