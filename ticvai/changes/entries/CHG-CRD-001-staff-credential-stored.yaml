  changeOwnCredential) are additive for clients; check-contract-compat was run (see hand-back). Verified with derive-schema
  and derive-ddl --apply in the worktree (generated tables read in V0104 and handoff/migration-review.md, then restored):
  the new columns are additive in the next forward migration; NOT NULL on new columns and the nullability changes on existing
