notes: '**Design change: WEB-022 is the plan step of the membership booking flow, drawn as the client-verified frame
  draws it** (the lead''s own design decision; the frame is kept, the record follows it). The cards'' columns gain
  fromPrice, displayTags, isFeatured and compareAtPrice; the right panel''s two detail panels (getProduct,
  getMyMemberships) become the basket, and those two reads now drive the card selection and the held-plan mark.
  docs/active/approved-ui-changes.yaml records the changed fields against the client-verified frame and CR-482. The
  frame (wireframes/frames/web-022.html, the rev 3 capture) is unchanged. The page info (design-r1) is generated from
  screens/ and follows at the next design batch rebuild.'
