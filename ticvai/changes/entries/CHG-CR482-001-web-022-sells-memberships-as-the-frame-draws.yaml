id: CHG-CR482-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'WEB-022 Membership Plans keeps the client-verified frame, basket included, and binds the operations that
  already exist: cards from listProducts with fromPrice and the displayTags term line; What you get from
  getPlanBenefits (by entitlementTemplateId) and listMembershipBenefits, ticks and dashes; Choose <plan> through
  listProductVariants, createCart, addCartLine, updateCartLine and removeCartLine; the right panel Your membership is
  getCart (membership lines, subtotal, VAT from taxTotal, total), with Continue off until a membership line is in it;
  Continue goes on into the membership booking flow (getPublishedBookingFlow), WEB-011 a new exit; productId selects a
  card (getProduct); getMyMemberships marks a held plan. Product gains isFeatured (boolean, default false) and
  compareAtPrice (Money, nullable), stored as is_featured and compare_at_amount, set by createProduct and updateProduct,
  returned by listProducts and getProduct: the Most popular badge and the saving, shown only once built.'
decision:
  what: 'ADAM CR-482, posted on #31742: "Decided (Chinmay, 2 November 2026): not as recommended. The page keeps the
    client-verified frame, basket included, because the package does not change approved UI and every part of the frame
    except two already has an operation. Build now on #31742 ... The ''Most popular'' badge and the ''Saves ... vs paying
    per visit'' line have no field yet. They come from a new ticket: Product gains isFeatured (boolean, default false)
    and compareAtPrice (Money, nullable ...), stored on catalogue.product as is_featured and compare_at_amount, set by
    createProduct and updateProduct, and returned by listProducts and getProduct ... Until that ticket is built, the
    cards show neither, never a made-up value. WEB-022''s screen record, its approved-UI entry and its page info are
    brought in line with the frame at the next release." The lead''s "approve all as a recommended", 2 November 2026.'
  by: Chinmay
  date: '2026-11-02'
why: 'ADAM CR-482 (Chitrangi Mestry, #31742 WEB-022): the client-verified rev 3 frame (REV3, Summit Peaks, Annual pass /
  membership) draws a purchase page with a basket, and the screen record bound no cart operation, Product carried none
  of the badge or saving, and the cards did not bind fromPrice. The review found the purchase (the membership booking
  flow and the cart operations, as on WEB-005, WEB-006 and WEB-010), the benefits (getPlanBenefits,
  listMembershipBenefits), the term line (displayTags) and the price (CR-358) already in the package; only the badge and
  the saving need fields.'
keys_touched:
  screens: [WEB-022]
  operations: [listProducts, getProduct, getMyMemberships, getPlanBenefits, listMembershipBenefits, listProductVariants,
               createCart, addCartLine, updateCartLine, removeCartLine, getCart, getPublishedBookingFlow, createProduct,
               updateProduct]
  schemas: [Product, CreateProductRequest, UpdateProductRequest]
  tables: [catalogue.product]
  files:
