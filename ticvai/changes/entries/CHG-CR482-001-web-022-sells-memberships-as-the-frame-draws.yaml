    create and update, returned on the two reads.'
  - '31743, 31744 ([FE] WEB-022 connect to API, tests): the thirteen operations at their next pull.'
  - '31652 (createProduct), 30950 (updateProduct), 31009 (listProducts), 31727 (getProduct): the two optional fields at
    their next pull, by #37213.'
