  other: [approval.withdrawn, tenantRequestLimits, moduleListingRecords]
  files:
  - contracts/satellite/public-api.yaml
  - contracts/spine/approvals.yaml
  - contracts/satellite/subscription.yaml
  - contracts/satellite/white-label.yaml
  - events/approval-withdrawn.yaml
  - docs/adr/0064-per-tenant-limits.md
