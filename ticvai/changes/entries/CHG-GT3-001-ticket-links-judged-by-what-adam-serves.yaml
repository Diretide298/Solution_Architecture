kind: process
summary: ADAM's release export keeps ticvai-docs' setup guides, so the 18 setup and onboarding tickets that link them
  pull them, and check-ticket-links judges a file link by what the export keeps, from the same list ADAM uses.
decision:
  what: 'viewer/lib/export-keep.json (new) holds the export keep-list, read by viewer/lib/releases.mjs exportRule and by
    ticvai/tools/check-ticket-links.py: the folders kept in every repos/<repo>/ (.github, terraform, apps, openapi, as
    before) and, new, per repo: ticvai-docs keeps setup/. check-ticket-links.py: a `file` link resolves only if git
    tracks it AND the export keeps it (`exported`, with self-tests); without export-keep.json the check fails rather
    than guess. tools/adam-links.py SETUP_DOCS is unchanged: the package has no copy of the setup guides outside repos/
    (the project-bible copies are under repos/ too, emptied the same way, and differ in three files).'
  by: Chinmay
  date: '2026-10-15'
why: 'The r6 rehearsal pull of r6-candidate c56b9dc4 (the r6 rehearsal summary (lead workspace), lead workspace) failed its
  dead-link criterion (CHG-GRD-003): 36 links on 18 tickets could not be found, all to repos/ticvai-docs/setup/{README,
  quickstart,dependencies}.md, which git tracks (so check-ticket-links TL-DEAD-LINK, CHG-GRD-001, passed) but ADAM''s
  release export empties. Before: check-ticket-links on c56b9dc4 judged by the export, 36 TL-DEAD-LINK; after, 0.'
