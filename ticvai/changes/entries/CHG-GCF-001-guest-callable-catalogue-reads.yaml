id: CHG-GCF-001
date: '2026-10-03'
source: audit
kind: contract
summary: Twenty public catalogue reads the guest screens bind are guest-callable and serve a guest published data only; staff
  keep their permission and also see drafts.
decision:
  what: 'Mark the public catalogue reads x-ticvai-guest-callable: true and state in each description that a guest or visitor
    sees published data only (drafts, unpublished and withdrawn rows never; such a record by id answers as not found), while
    the staff permission stays for staff, who also see drafts.'
  by: Chinmay
  date: '2026-10-03'
why: 'Chinmay''s answers of 3 October 2026 to the Block A audit on live r2 (CHG-AUD-001, pattern 3: guest screens bind staff-only
  operations), section ''Pattern 4'', all as recommended. The zero-AI scan found 184 guest-screen bindings (P01, P02, P05)
  of 49 operations that carry a staff permission and declare neither x-ticvai-guest-callable nor x-ticvai-self-scoped, so
  nothing said what a guest, who holds no permission, may do (ADR-0025: audience and permission are orthogonal).'
