summary: 'Six foundation tickets say what the lead decided on 20 October. The Qdrant tenant token is issued by the
  workers host, read-write on the tenant''s own collection, 30 days, reissued weekly (ADR-0049, AI-ENGINE-QDRANT;
  FOUNDATION-AI-C10). Block A prints prep sheets, not kitchen tickets (POS-KDS-ROUTING; C15). PLATFORM-SAGA-PAID is
  done in the sandbox with the provider''s test payloads and a local secret until the client''s credentials arrive
  (C18). One tenant''s pool share is server connections against pool_size (ADR-0064, OBS-TENANT-POOL; C24). The
  first alerts have proposed thresholds, windows and severities (observability.md, PLATFORM-OBSERVE; C25). The
  pooler is Azure''s built-in PgBouncer, turned on in the cell module, and the per-tenant pool alert is one alert
  built by OBS-TENANT-POOL (ADR-0060, infra answers, Terraform; C53).'
