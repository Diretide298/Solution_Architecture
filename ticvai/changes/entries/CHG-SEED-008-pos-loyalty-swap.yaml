id: CHG-SEED-008
date: '2026-10-01'
source: audit
kind: spec
summary: POS-002 (the till) and BO-831 read getLoyaltyPosition, the caller's own loyalty, so the till would show
  the cashier's points; they should read getGuestLoyalty for the named guest.
decision:
  what: POS-002 and BO-831 read getGuestLoyalty for the named guest (the guest attached to the cart; the participant
    viewed), with GUEST_VIEW at venue scope, which the seeded Cashier role already holds; getLoyaltyPosition keeps
    its guest consumers (WEB-043, GST-036).
  by: Chinmay
  date: '2026-10-02'
why: 'Found by the POS v2 follow-up (commit 0d59727e): getLoyaltyPosition has no subject parameter and is guest-scoped.
  Council of 2 October: ''a loyalty read that would have returned the cashier''s own loyalty''; typed property ''acts
  on the caller or a named customer''.'
keys_touched:
  screens:
  - POS-002
  - BO-831
  operations:
  - getLoyaltyPosition
  - getGuestLoyalty
  flows:
  - F34
  - F58
root_class: 'new: wrong-subject'
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
prevention:
  type: check
  ref: tools/check-subject.py
status: closed
closed_by_commit: 23d49afe
notes: 'Landed on main in 23d49afe (00:22, 2 October), which also consumed the partial edit left in git stash at
  the usage limit. check-subject reports a staff screen naming a guest that binds an operation acting on the caller
  (it reported POS-002 here before the merge; check-audience-match reported POS-002 and BO-831). Both are report-only
  until the lead baselines them. Still open as a contract tidy-up: getLoyaltyPosition should declare x-ticvai-self-scoped:
  subject (contracts/README.md: a null permission must say why).'
