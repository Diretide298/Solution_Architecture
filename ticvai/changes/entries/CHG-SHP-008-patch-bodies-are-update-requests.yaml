summary: 'updateDonationCampaign, updatePartnerAgreement, updateRotaAssignment and updateTableReservation take an
  Update<X>Request (minProperties 1, no required, no defaults, request only), the CR-089 pattern.
  UpdateTableReservationRequest leaves out `groupId` (a party grouping is not changed by a PATCH, and the glossary
  bans the name).'
