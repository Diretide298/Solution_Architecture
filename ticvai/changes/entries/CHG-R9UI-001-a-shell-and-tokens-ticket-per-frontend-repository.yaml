proposed: '2026-10-21T18:00'
summary: 'One app shell and design-tokens ticket per frontend repository (SETUP-SHELL-GUEST-WEB, -GUEST-APP, -POS,
  -KIOSK, -EMPLOYEE-APP, -VENUE-MANAGEMENT, -WEB): the header, navigation, footer, progress bar, basket where the app has
  one, loader, status card, empty and offline patterns, and the theme taken from the app''s client-approved prototype
  CSS (guest web: handoff/design-tokens/guest-web.yaml, the prototype''s CSS variables, Archivo, --brand per venue,
  applied from getPublishedTenantConfig; guest app: handoff/design-tokens/guest-app.yaml; the till keeps
  screens/_design-tokens.yaml; an app with no approved design uses the shared tokens and its look is on the left-out
  list). Each starts at the first slot its owner has from 21 October 2026, is owned by the repository''s main builder,
  and every not-yet-started screen task of the repository follows it; a started one is told in its text.'
decision:
  what: 'docs/active/block-a-extra-tasks.json: the epic FRONTEND-FOUNDATION and seven SETUP-SHELL-* tasks (fields area,
    repo, ownerRule mainBuilder, notBefore 2026-10-21, blocksScreensOf, short, startedKnown). tools/build-service-docs.py:
    the extra-task fields (area: a frontend task; notBefore: scheduled from a date; ownerRule mainBuilder: the
    repository''s main builder among the frontend people, from the pinned owners, held tasks left out), and the pass
    that makes every not-started screen task of the repository follow its shell (started_plan_keys from
    adam-links.json statuses, the shell''s startedKnown) and says so in one carried sentence ("App shell and mock API:
    ..."); the frontend spec pages name each app''s tokens and shell. tools/derive-design-tokens.py writes
    handoff/design-tokens/guest-web.yaml and guest-app.yaml from the prototypes (a refresh step). tools/ticket_done.py:
    shell_key, CARRY. docs/active/left-out.yaml LO-R9UI-021 to -024: the four apps with no client-approved design.'
  by: Chinmay
  date: '2026-10-21'
waivers:
  cooling_off: {by: Chinmay, date: '2026-10-21', quote: 'I wanna get all of those changes out now..'}
  release_window: {by: Chinmay, date: '2026-10-21', quote: 'I wanna get all of those changes out now..'}
why: 'Finding of 21 October 2026, the WEB-007 seat page (#31848; sources/audit-21-october/web-007-ui-pull-findings.md,
  cause 6): no ticket built any frontend app''s shell or design system, so the seat page was built with no header,
  basket, loader or status card, and screens/_design-tokens.yaml, the only token file, is the till''s (Manrope),
  while the client-approved guest prototype sets Archivo and a --brand colour per venue. The lead, Chinmay, 21 October
  2026, on the four UI changes: "I wanna get all of those changes out now.." (the decision, and the waiver of the
  cooling-off and of the Tuesday/Friday release window).'
