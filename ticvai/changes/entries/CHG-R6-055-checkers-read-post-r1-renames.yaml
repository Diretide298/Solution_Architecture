proposed: '2026-10-12'
summary: 'check-ddl-conventions (D-MIG-TABLES) and check-migration-tickets (M-TABLE-ASSIGNED) read a table renamed after
  r1 under its new name, as build-service-docs.py already does (CHG-R6-054).'
decision:
  what: 'tools/check-ddl-conventions.py: a table the frozen r1 SQL creates under a name derive-schema-history.py RENAMES
    retires also counts as creating its new name, so MIGRATIONS.md may list the new one. tools/check-migration-tickets.py:
    the tables found in backend/ are mapped through the same post-r1 RENAMES before they are matched against the
    migration tickets and the "Tables no migration creates" list. No derived output changes.'
  by: Chinmay
  date: '2026-10-12'
why: 'The third r4 gate of 12 October 2026 (refresh-safe --parallel 4 on r4-cr-fixes c95afd4f) failed these two checkers
  with 15 findings each, one per table renamed at r4 (CHG-R6-010): MIGRATIONS.md and the MIG tickets name the new table,
  the frozen DDL and backend/ the old one. Both checkers read table names from the SQL and neither knew the renames.'
