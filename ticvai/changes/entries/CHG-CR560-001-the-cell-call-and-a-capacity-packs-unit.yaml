notes: 'STOPPED on point (2), left as CR-541 wrote it (the cell at Tenant.cellHost, the read of control.tenant): the
  posted rule finds the home cell as "the control.cell_tenant row for the tenant with status live whose control.cell
  is in the tenant''s home region" and says "Read control.cell_tenant, control.cell and control.cell_endpoint, not
  control.tenant", but the tenant''s home region is stored only in control.tenant.region_id (Tenant.regionId);
  control.cell_tenant has no home mark. And CR-568, posted the same day on #31281, lists control.tenant (cellHost)
  among the reads of the preview that runs this same check as one function. The lead''s follow-up decides point (2).
  Beyond the posted words: CapacityPack.unit as a UsageMetric makes derive-ddl give control.capacity_pack.unit the
  CHECK every contract enum gets (capacity_pack_unit_chk), in the release''s forward migration; BC-740 records the
  narrowed request field; addCapacityPack declares the shared 400. Second prevention: BR-CAPACITY-PACK-UNIT. New task
  for the plan pass: "[BE] Kernel: a cross-cell service client beside IServiceClient for the control plane to call a
  tenant''s cell (target cell and tenant, the address, the token and certificate from the control plane''s service
  identity; 503 when the cell does not answer); it replaces ITenantModuleEnablement''s default", parent #27687, owner
  the kernel owner. It and CR-555''s new task under #37051 are the two ends of one call: the plan pass may make them one
  ticket.'
