id: CHG-CR560-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'setSubscription states how the downgrade check calls the tenant''s cell: through the seam
  ITenantModuleEnablement, default cell unreachable (503); upgrades, first plans and reactivation never call it;
  serviceAuth issued to the control plane''s own cell identity (sub its cell, aud cell, tid the path''s tenant) over
  mutual TLS, X-Tenant-Id the same tenant, a mismatch refused; a 5-second timeout, a 5xx or a connection failure is 503
  with nothing written; the real client is kernel work on its own ticket. CapacityPack.unit is a UsageMetric;
  addCapacityPack refuses another unit 400 validation naming unit; a pack counts only toward its unit''s metric in
  targetLimit, unexpired by validFrom/validTo as posted, and a stored row with another unit counts toward no metric.
  Point (2) of the posted decision (how the home cell and its address are found) is not built: see notes.'
decision:
  what: 'Posted on #30841 (Chinmay, 3 November 2026), under the lead''s "Dont hold r13. approve them and rever tto the
    devs" (3 November 2026): "CR-541 stands. The downgrade check asks the tenant''s cell, and if the cell does not
    answer the call is 503 and nothing is written ... (1) Keep your seam (ITenantModuleEnablement) and its test
    double ... (3) The call uses serviceAuth as common.yaml defines it ... A timeout (5 seconds), any 5xx or a
    connection failure is 503 with nothing written. (4) The real client is kernel work on its own ticket ... (5)
    Capacity packs: CapacityPack.unit takes the UsageMetric values ... addCapacityPack refuses any other unit with 400
    validation naming the unit field ..."'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-560 (Sanket Keluskar, #30841 setSubscription): nothing said how the control plane calls a tenant''s cell
  for CR-541''s getModuleEnablement call (CHG-CR541-001), and CapacityPack.unit was free text.'
