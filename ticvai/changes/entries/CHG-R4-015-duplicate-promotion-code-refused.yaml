  - screens/P08-venue-back-office.yaml
  - tools/check-contract-shapes.py
  - handoff/audit-baseline.json
root_class: 'new: duplicate-code-unrefused'
tickets:
  started: []
  unstarted:
  - SVC-CATALOGUE-PROMOTION-1
  - APP-SETUP-BO-010
  - APP-SETUP-BO-010-REST
  - MIG-PROMOTIONS
prevention:
