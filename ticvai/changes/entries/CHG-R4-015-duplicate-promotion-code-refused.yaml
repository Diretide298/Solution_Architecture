  ref: tools/check-contract-shapes.py
notes: 'Batch R4, 6 October 2026. C-CODE-409 (a create/add/register/import POST whose body takes a `code` and that
  declares no 409) fails on the commit before this fix with createPromotion and passes after it. It also finds 40
  older creates with the same gap (createAccessPoint, createBundle, createEntitlementTemplate, createGame ...),
  recorded in handoff/audit-baseline.json for the lead to schedule; each is a business-rule decision (is the code
  unique, and where), not a mechanical fix. SVC-CATALOGUE-PROMOTION-1 starts at day 5.06, APP-SETUP-BO-010 at 4.05,
  MIG-PROMOTIONS at 4.55 (block-a-schedule.json): none started.'
