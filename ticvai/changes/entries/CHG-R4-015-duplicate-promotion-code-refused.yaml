id: CHG-R4-015
date: '2026-10-06'
source: audit
kind: contract
summary: createPromotion refuses a promotion code another promotion of the tenant already uses (409 duplicate-code),
  and the promotion code is unique per tenant.
decision:
  what: 'Additive. contracts/satellite/promotions.yaml: CreatePromotionRequest.code gains x-ticvai-unique tenant (and so
    Promotion.code, which composes it), and createPromotion gains 409 $ref common DuplicateCode (problem type
    duplicate-code, the package convention since audit R108). updatePromotion cannot change a code, so it needs no
    409. The operation''s partner audience is not touched: that question goes to the client on 7 October.
    screens/P08-venue-back-office.yaml BO-010''s create form says what a duplicate gets. check-contract-shapes gains
    C-CODE-409.'
  by: Chinmay
  date: '2026-10-06'
why: 'Comparison audit finding (defect 7 of the lead''s r2 fix list, 6 October 2026): createPromotion declared no 409,
  so a second promotion with the same code was not refused. Audit decision R108 (docs/registers/audit-decisions.md,
  28 September) makes configuration codes unique per tenant and adds the shared duplicate-code response; promotions
  were not on its list.'
keys_touched:
  screens:
  - BO-010
  operations:
  - createPromotion
  schemas:
  - CreatePromotionRequest
  - Promotion
  tables:
