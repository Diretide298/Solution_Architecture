id: CHG-CR344-001
date: '2026-10-30'
source: cr
kind: contract
summary: 'The two rota reads and the exclusion constraint CR-336 named were already in r11; the one addition: a live
  DENY of the role at or above the venue makes identity#principalHoldsRoleAtVenue false (deny-overrides-allow), and
  #32338 builds that query inside the Identity module. Both rota writes say a 23P01 on
  rota_assignment_principal_id_overlap_excl is the 409, with the per-person advisory lock until the constraint is on
  the databases.'
decision:
  what: 'The lead''s review, 30 October 2026: "for each one actually check if they hold and if not then find out the
    best way keeping in mind what client needs". Posted to #32338: "not as recommended. Nothing needs adding: r11
    already defines all three, so build to them as they stand. ... Build principalHoldsRoleAtVenue yourself in #32338,
    inside the Identity module behind its query interface; no other ticket builds it. One addition to its rule: a live
    DENY of that role at the venue or above it makes holds false (deny-overrides-allow, as createDelegatedAccess says).
    ... Map SQLSTATE 23P01 on that constraint to 409 rota-assignment-overlap now. Until the constraint is on the
    databases, keep your per-person advisory lock. In #32340, ask the same two queries with the assignment itself as
    exceptAssignmentId." contracts/spine/identity.yaml principalHoldsRoleAtVenue (rule and holds);
    contracts/satellite/workforce.yaml createRotaAssignment and updateRotaAssignment descriptions; CHG-CR336-001''s
    notes now name #32338 as the builder.'
  by: Chinmay
  date: '2026-10-30'
why: 'ADAM CR-344 (Pranay Shinde, #32338, blocking): the r11 follow-up (CHG-CR336-001) named
  rota_assignment_principal_id_overlap_excl and two yes/no reads that adam_search did not find. They are in r11
  (workforce.yaml x-ticvai-queries principalHasOverlappingAssignment, identity.yaml principalHoldsRoleAtVenue,
  RotaAssignment x-ticvai-exclude, handoff/migration-review.md "constraint added"); the review found one real gap:
  the role query counted ALLOW grants only, while identity.delegated_access holds role DENYs too.'
