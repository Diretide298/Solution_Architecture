    it, and it stays on CMS-010, CMS-062, CMS-073 and more. CMS-067 still declares it (held for the lead). Told through
    the lead''s comment; its text is not rewritten.'
  unstarted:
  - 'CMS-061''s screen ticket drops the declaration and the three carried assetIds at the next tag.'
release_tag: pending
