id: CHG-LIN-001
date: '2026-10-14'
source: developer
kind: spec
summary: 'Every read in the lineage now names the columns it reads (readColumns), derived from the response schemas,
  the parameters, the join keys and a small override file, so DB-READ-VIEWS can generate each view narrow. Every one
  of the 64 cross-module reads of pii.* has a list (42 derived, 22 from the override), and a new check fails a
  cross-module pii read without one. Outside pii, 2,913 of 6,904 reads (42%) and 122 of 957 cross-module reads (13%)
  have a list; the rest keep an all-column view until their contract shows the columns.'
decision:
  what: 'tools/derive-read-columns.py (run by refresh.sh after derive-schema.py) writes `readColumns: {table:
    [columns]}` on each handoff/api-data-lineage.json entry for the reads whose columns the package states: a 2xx
    response schema persisted to the table (each property on the column derive-schema gives it, kept only if the
    table has it); a projection or computed schema''s fields that name a column of a table it names; a field named
    for a read table and its column; for pii.* the personal-data field names (PII_FIELDS) and, where only an id is
    exposed or asked for (`subjectId`), the key alone; and docs/active/read-columns-override.yaml, 22 cross-module
    pii reads the contract cannot show (three guest messages, eleven list rows whose person field has no subjectId
    beside it, verifyIdentity''s two reads, six biometric reads by Access). Every list gets the row key, the columns
    the path and query parameters filter on (check-parameter-columns'' mapping) and the join keys between the
    operation''s read tables. The view a reader module gets over a table is the union of its operations'' lists; a
    read with no list keeps every column, except over pii.*, which is always narrow. tools/check-read-columns.py
    fails RC-PII-NO-COLUMNS (a cross-module pii read with no list), RC-STALE (readColumns not what the deriver
    derives: the lists are never hand-edited), RC-UNKNOWN and RC-OVERRIDE-STALE, and reports coverage.'
  by: Chinmay
  date: '2026-10-14'
  quote: 'fix it in r6'
why: 'ADAM CR-004 (Hrushikant Patkar, ticket #27654 DB-READ-VIEWS): the view shape exposes "only the columns the
  reader''s operations read", but handoff/api-data-lineage.json recorded reads as schema.table only, so the views
  were all-column and every pii view (pii.subject is read by Order, Access, Marketing, VenueOps, Wallet and F&B)
  exposed date_of_birth, nationality and the names. Decided 12 October as "Option C now, A later: build all-column
  views except over pii.*, which you narrow by hand ... The lineage gets per-read column lists in Block B; the views
  are then regenerated narrow from it." On 14 October the lead brought "A later" into r6. ADR-0023 keeps personal
  data in the erasable pii store; ADR-0055 rule 2 publishes reads through views.'
keys_touched:
  tables:
  - pii.subject
  - pii.subject_contact
  - pii.subject_biometric
  files:
  - tools/derive-read-columns.py
  - tools/check-read-columns.py
  - tools/refresh.sh
  - tools/run-checks.py
  - docs/active/read-columns-override.yaml
  - handoff/api-data-lineage.json
  tickets:
  - DB-READ-VIEWS
root_class: A22 LINEAGE
tickets:
  started:
  - DB-READ-VIEWS
  unstarted: []
release_tag: r6
decision_owner: Chinmay
adam_cr: CR-004
triage: fix-forward
prevention:
  type: check
  ref: tools/check-read-columns.py
status: open
notes: 'Batch LIN, 14 October 2026, branched from 2f2db2e0 (one viewer commit above r5 1eb1d063; nothing under
  ticvai/ differs). Released outside the Tue/Fri window by the lead''s waiver, 14 October 2026: "Release today as an
  exception." This completes the 12 October decision''s "A later". check-read-columns run on the parent commit (r5
  lineage, no readColumns): FAIL, 64 RC-PII-NO-COLUMNS and 2,073 RC-STALE; on this branch after
  derive-read-columns --apply: PASS, 0 findings (the lineage is derived, so the committed file is regenerated by the
  lead''s gate, not by this branch). No baseline. Not derivable today, and not faked: 835 cross-module reads (and
  3,991 reads in all) are recorded by the lineage and not carried by the response, mostly rule checks a write makes;
  under ADR-0055 as amended in r6 those become declared queries, not views, and a data read among them gets a list
  when its contract shows its fields or an override row says why. Found on the way and not changed here:
  marketing.guest_profile stores display_name, email, phone and preferred_language (GuestProfileDetail), personal
  data outside the pii store (ADR-0023); and the three guest-message operations read pii.subject but not
  pii.subject_contact, where the address is.'
