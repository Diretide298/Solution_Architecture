    reached on ADM-603 (the Customer/account picker) and ADM-608. The edge to ADM-603 still carries accountId, which
    createB2bCreditAccount returns (check-navigation N-CARRIES-HELD passes). The x-ticvai-consumed-by mirror in
    contracts/satellite/payments.yaml follows (link-screens-contracts).'
