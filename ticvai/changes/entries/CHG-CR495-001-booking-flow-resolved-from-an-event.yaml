notes: '**Named beyond the posted words:** to answer "an eventId that is not an event of the venue is 404" the operation
  asks catalogue#eventRecords (ids [eventId] where {venueId}) in process, recorded as XDR-110 (no new grant: XDR-033
  already gives the operations role SELECT on catalogue.event), and the eventRecords and productRecords rules name
  getPublishedBookingFlow. GST-007''s entry state gains an optional productId from GST-008, the value GST-008''s
  product-first edge already carries.'
