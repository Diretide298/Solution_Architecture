id: CHG-CR495-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'getPublishedBookingFlow (GET /venues/{venueId}/booking-flow) takes an optional eventId (uuid). With productId
  sent, eventId is ignored. With eventId and no productId, the venue''s published, on-sale products for that event
  (Product.eventId; catalogue#productRecords where {venueId, eventId}, in process) are taken in displayOrder then id,
  each through the existing rule (own flow, category''s, venue default by kind and tie rule); the first that resolves to
  an enabled flow wins; then flowTypeKey when sent; then 404. An eventId that is not an event of the venue is 404. The
  400 is for none of productId, productCategoryId, flowTypeKey and eventId. GST-007 sends { productId } when it has one,
  else { eventId }; on 404 it renders date, time, tickets with the defaults; a 400 is the error state.'
decision:
  what: 'ADAM CR-495, posted on #31784: "Decided (Chinmay, 3 November 2026): when GST-007 is opened from an event, the
    booking flow is resolved from the event''s id. Build now: (1) Backend, getPublishedBookingFlow ... add an optional
    query parameter eventId (uuid) ... These are read in process through catalogue#productRecords where {venueId,
    eventId} ... The first product that resolves to an enabled flow wins. If none resolves, try flowTypeKey when sent,
    then answer 404 not-found. An eventId that is not an event of the venue is 404 not-found. The 400 validation is now
    for none of productId, productCategoryId, flowTypeKey and eventId ... (2) GST-007 ... send { productId } when the
    screen has one ... else { eventId } from the entry. Never send an empty query. On 404, render the date, then time,
    then ticket order with the flow settings'' defaults ... A 400 is the error state. (3) Connecting to the real client on
    the connect-to-API ticket uses the same call." The lead''s "Close the CRs and respond to devs" and "get the NEw CRs in
    the r13", 3 November 2026.'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-495 (Chitrangi Mestry, #31784 GST-007): GST-007 opened from an event holds only eventId, and
  getPublishedBookingFlow answered 400 with none of productId, productCategoryId and flowTypeKey; an Event has no
  bookingFlowId, and the link runs from Product.eventId, which only the server can follow.'
