  failing on "''str'' object has no attribute ''name''" (CHG-R8GEN-016 changed how the deriver loads YAML).
  Finding: R8 blocker cause list (APPROVALS-TENANCY-C16, WHITE-C13), r8 integration check run of 20 October 2026.'
