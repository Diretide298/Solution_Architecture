    the copy lacks, the twin''s operations that admit no prospect) with self-tests run first (--self-test);
    tools/check-navigation.py: N-SIGNIN-RETURN with self-tests run first, and the deriver loaded without the YAML shim
    that broke when derive-carries-from-entrystate began handing yaml the text.'
  by: Chinmay
  date: '2026-10-20'
why: 'APPROVALS-TENANCY-C16 (answer B) made setSubscription staff-only, so the sign-up screens bind nothing and
  check-screens failed them as drifted copies; WHITE-C13 put the sign-in-and-return edge in a rule so approved
