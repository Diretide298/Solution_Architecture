summary: 'Two checks learn what the surface lane decided and could not teach them: a P17 sign-up copy may bind fewer
  operations than its P09 twin where the twin''s operation admits no prospect (SGN-019 and SGN-024 no longer
  "drift" from ADM-410 and ADM-417 after setSubscription became staff-only), and check-navigation reads the
  guestSignInReturn rule as the edge from each guest screen that offers sign-in and return to its app''s sign-in
  screen (N-SIGNIN-RETURN). check-navigation''s N-CARRIES-HELD, which reported the deriver unavailable since the
  generators lane''s fast-loader change, checks again.'
decision:
