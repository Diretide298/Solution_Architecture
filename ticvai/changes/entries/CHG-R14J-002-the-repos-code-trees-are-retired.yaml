id: CHG-R14J-002
date: '2026-11-03'
source: audit
kind: process
summary: 'repos/ keeps each repository''s project documents and no code. The hand-written code trees of
  repos/ticvai-backend (src, tests, tools/check-migrations.py, the solution and build settings, docker-compose),
  repos/ticvai-frontend (the six-app Nx workspace, its packages and settings) and repos/ticvai-ai (src, pyproject, CI),
  their AGENTS.md and the old update-bible.sh mirror script are removed. tools/derive-mirrors.py now writes what stays from what
  developers really get: the three repositories'' CLAUDE.md from ADAM''s starter CLAUDE.md
  (viewer/mcp/setup/starters/<role>/), every bible''s setup/ from the starter docs, every bible''s repos/ rules page
  (backend, frontend, ai from the starter CLAUDE.md; contracts, infra, docs from new authored sources in
  docs/repos/rules/, their stale lines corrected: UUIDv7 not ULID, a key vault per cell holding many tenants, the
  migration fan-out per tenant database), and it removes the bible folders that only shadowed a mirrored docs/ folder
  with an older partial copy (adr/ with 18 of 73 ADRs, architecture/, active/, registers/) and the August .synced-at
  stamp. Four starter docs (backend-patterns, config-and-secrets, dependencies, git-and-mrs) took the decided text the
  package''s ticvai-docs/setup copy had and the starter lacked (audit R038 and R057, GitLab CI, the environments), so
  developers'' project-bible/setup has it too. The contracts and infra repositories keep their own sources (publishing
  scripts; Terraform), and their AGENTS.md and CLAUDE.md read orders point at project-bible/docs/. The docs/repos/
  READMEs say where each repository''s code is.'
decision:
  what: 'The lead, 3 November 2026, on the r13 system review''s D-06: "Retire the code trees" (keep the project
    documents, generated from the starters), with "All four, one release". Closing with it, as findings about the
    package''s copies: D-01 (the copy did not compile), D-02 (the copy''s permission resolver), D-03 (the copy''s
    one-tenant-per-cell middleware and the AI copy''s vector store), D-04 (the rules page taught .NET 8, one tenant,
    ULIDs), D-05 (the copy''s offline outbox), D-07 (the copy''s architecture and integration tests), D-08 (the
    copy''s migration checker fork). The same defects in ADAM''s starters are lane g''s (G-01, G-03, G-04, D-07''s
    starter part); D-11''s code is the AI engineers''. ticvai-infra''s Terraform stays: it is the package''s only
    infrastructure source (the HLD sizes and check-terraform-pools read it) and has no starter to diverge from.'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 system review of 3 November 2026, finding D-06 (code scaffolds): the repos/ code trees were stale copies no
  tool kept in step with the starters developers get; every A-STARTER fix landed only in ADAM''s starters, and
  check-starter-fit never looked at repos/. D-04: project-bible/repos/backend.md had no source.'
