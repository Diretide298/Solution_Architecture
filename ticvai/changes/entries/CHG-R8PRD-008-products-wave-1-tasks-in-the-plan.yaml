notes: '**Decision date.** The people and the start of wave 1 are the lead''s ruling of 19 October; this cut into seven
  tasks is proposed now, so check-changelog reports the cooling-off until the lead records his decision of the cut at
  the r8 tag (a date at least 24 hours after `proposed`) or waives it in writing. **Sprint.** The inputs pin a person
  (`assignee`) but not a sprint: tools/derive-block-a-schedule.py places each task by its waits and its owner''s
  capacity, so Sprint 2 (19 to 30 October) is where they land only if Sanket''s and Surendra''s Sprint 2 capacity is
  free (their held back-office tasks stay in the plan). **Operations built twice.** The generator also forms a back-end
  task for every operation the package specifies and a forward migration for every new table (tools/build-service-docs.py),
  so at the refresh these 23 operations and seven tables get generated SVC-CATALOGUE, SVC-IDENTITY and MIG-CATALOGUE
  tasks beside the hand-written ones, owned by the load balancer; adding them to blockAOperations would put those
  duplicates in Block A. A hand-written task can claim operations only through `operations`, which the generator
  treats as served by the AI engine (its ticket text says so). The smallest fix is the generators lane''s: let a non-AI
  hand-written task claim its `operations` without the AI wording; then the operations move into each task''s
  `operations` and no duplicate is formed.'
