notes: '**Decision date.** The people and the start of wave 1 are the lead''s ruling of 19 October; this cut into seven
  tasks is proposed now, so check-changelog reports the cooling-off until the lead records his decision of the cut at
  the r8 tag (a date at least 24 hours after `proposed`) or waives it in writing. **Sprint.** The inputs pin a person
  (`assignee`) but not a sprint: tools/derive-block-a-schedule.py places each task by its waits and its owner''s
  capacity, so Sprint 2 (19 to 30 October) is where they land only if Sanket''s and Surendra''s Sprint 2 capacity is
  free (their held back-office tasks stay in the plan). **Operations claimed, not built twice** (coordinator''s ruling, 20 October): a hand-written task''s `operations` take
  them out of the generator''s back-end tasks; the storage-core lane changes tools/build-service-docs.py so the AI-gateway
  wording applies only to AI engine tasks. **The new tables.** Because only claimed operations reach them, the
  generator forms no forward migration for them beside PRD-W1-DB, but it lists them under "Tables no migration creates"
  as GAP, and check-migration-tickets (M-TABLE-ASSIGNED) fails at the refresh: a hand-written task is not a migration
  ticket (its track is Backend, its subject names no V-file). No input alone fixes it; see the products lane report. Until the release refresh
  regenerates the plan, check-plan-closure reports the claimed operations as C-DECIDED (decided, built by no task
  in the derived plan); the refresh builds them in their PRD-W1-* tasks.'
