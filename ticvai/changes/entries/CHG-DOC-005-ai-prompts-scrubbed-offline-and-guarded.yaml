why: 'Chinmay, 2 October: ''we may need to scrub personal info no matter what: an offline NLP-based scrubber or censorship''. Research
  T12 and T13: Azure Content Safety''s harm models are not trained on Arabic. Reinforces ADR-0020 (masking fails closed); ADR-0023 relates.'
