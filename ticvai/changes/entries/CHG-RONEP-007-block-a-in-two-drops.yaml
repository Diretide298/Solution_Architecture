notes: 'Does not fit, for Chinmay: A1 alone still runs past 24 November. Its developers'' work after the window opens is
  about 125 h (15.6 person-days; the AI engineers 13.8 more), against 58 h in the plan of 3044d8b0 and the 43 h accepted:
  the homes the A1 screens are reached through, the flow operations and the payment configuration are A1 core and added to
  it; the generator''s own measure (module tests included) is 172 h. No completion app whose work raised that went into
  A1. A2 at normal hours runs to 15 December (its test to 18 December) and Block B''s last work is 23 December, its test to
  28 December: both a few days past their sprint. C-UNTICKETED: 246 departures against old-r2 carry their reasons (most
  are writers lever B no longer pulls forward, and Block B is smaller). checks/baseline.json re-recorded: counts moved
  between blocks only, every app total unchanged. Before the section-home links C-REACH found 124 Block A screens
  reached only through a command centre; with them, none. C-BOUND checks a setup screen per wiring task (its slice in
  A1, its rest in its own drop).'
