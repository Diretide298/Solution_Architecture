notes: 'Batch GRD (audit/gate-guards), 14 October 2026. A pull cannot run inside the offline gate, so the gate holds
  the runbook text (as check-adam-latest-release LR-TAG-PUSH does for the tag push) and check-ticket-links holds the
  package side of the same four criteria (links present and resolvable). The connector script the rehearsal runs is
