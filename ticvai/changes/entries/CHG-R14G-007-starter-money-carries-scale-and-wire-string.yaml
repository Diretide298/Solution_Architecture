id: CHG-R14G-007
date: '2026-11-03'
source: audit
kind: spec
summary: The starter's Money had no scale (Round took it from the caller), serialised as {"Amount":1.235,"Currency":"OMR"}
  (a JSON number), accepted a 5-dp AED, and had no minor-units list and no allocation. Now Money is {Amount, Currency, Scale}
  (0 to 4); it refuses an amount with more places than its scale, combines only one currency at one scale, rounds back to
  its scale, and Allocate splits it by weight without losing a minor unit (largest remainder). MoneyJsonConverter writes and
  reads the contract's {"amount":"1.235","currency":"OMR","scale":3} and refuses a number, a missing field or too many places.
  CurrencyMinorUnits is the ISO 4217 list beside Money (CR-192), used by Money.InMinorUnits for a currency other than the
  trading one. Tests run on AED and OMR.
decision:
  what: 'Review finding G-07 (HIGH): add the scale and the kernel minor-units table, validate the amount against the scale,
    write a string JSON converter, add Allocate, and test AED and OMR. The lead, 3 November 2026, after reading the r13 system
    review triage: "All four, one release" (the starters, device/guest/token access, gate integrity, tenant setup and stale
    docs go into r14, released together).'
  by: Chinmay
  date: '2026-11-03'
why: r13 system review G-07 (findings/G-starters.md); ADR-0008; common.yaml Money (ADAM CR-192, CHG-R10ORD-018).
