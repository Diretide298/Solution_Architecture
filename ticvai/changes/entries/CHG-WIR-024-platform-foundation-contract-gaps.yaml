  not invented.'
decision:
  what: 'Log, do not invent: each wiring fix below needs an operation (or an audience) the contracts lack. The gap
    is recorded on the screen (gaps, operation: null) and here, open, for the contract owner.'
  by: Chinmay
  date: '2026-10-02'
  quote: 'Chinmay, 2 Oct 2026: fix the wrong wiring now'
