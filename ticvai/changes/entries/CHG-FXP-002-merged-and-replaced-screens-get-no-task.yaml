id: CHG-FXP-002
date: '2026-10-04'
source: audit
kind: plan
proposed: '2026-10-04'
summary: A screen merged into another, or listed as not built, gets no build task; its operations are built on the screen
  it renders inside; POS-003 and POS-004 are built as steps of the POS-002 drawer.
decision:
  what: 'ticket_done.screen_hold: a screen whose notes say "**Merged into X**" or that block-a-extra-tasks.json
    `screensNotBuilt` lists gets no task anywhere in the plan (46 merged screens, among them VM-BO-669, VM-BO-110 and
    APP-SETUP-ADM-243), and ticket_done.merge_bindings adds its bindings to its target in memory, so the target''s tickets
    build them (setApprovalMatrix, hosted on ADM-243, is set up on BO-087). op-retire.py closes a pushed ticket of a merged
    screen into its target''s ticket. Default taken (Needs Chinmay): POS-003 and POS-004 are built as steps two and three
    of the POS-002 sale drawer, not pages, and no full-screen tablet seat map is in Block A (screenNotes, carried by the
    pointer).'
  by: Chinmay
  date: '2026-10-04'
why: 'Sprint 1-2 judging of 4 October (finding kind merged-replaced): VM-BO-669 (merged into BO-666, CHG-WIR-001) and
  APP-POS-POS-004 were not buildable, VM-BO-110 (merged into BO-111, CHG-SBO-021) and APP-POS-POS-003 guessed. The plan
  read no merge note, so a screen "nothing on it is built separately" was planned in Sprint 2.'
keys_touched:
