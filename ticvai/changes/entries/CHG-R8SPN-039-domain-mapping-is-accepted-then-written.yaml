summary: 'setTenantDomainMapping is written to the architecture CR-002 decided: it mints the row id, writes
  tenantDomain.mapped v2 (the whole row, id as aggregateId) to the outbox and answers 202 with the TenantDomain row as
  it will be written (not yet routed); Platform''s consumer writes control.tenant_domain. tenantId is sent in the body
  and checked against the calling cell''s tenants. hostname-taken is a quick 409 here and final in the consumer under
  the unique index (tenantDomain.rejected for white-label). setPrimaryDomain maps one host per call and the consumer
  demotes the other primary; resolveTenantHost answers 404 for a detached host.'
