    white-label shows the domain live only after the consumer''s row exists). tenancy.yaml setTenantDomainMapping,
    TenantDomain.tenantId, resolveTenantHost. 200 -> 202 keeps the TenantDomain shape, so the answer stays compatible;
    tenantId newly sent may be called breaking under check-contract-compat; the entry is requested from the lead.
    events/tenantDomain-mapped.yaml v2, a new events/tenantDomain-rejected.yaml, white-label verifyCustomDomain,
    relinquishCustomDomain and setPrimaryDomain, platform-ops hostnameHeldByAnotherTenant and
    handoff/cross-deployable-writes.md are the surface lane''s part; the active-host partial unique index (C12) is
    storage''s.'
