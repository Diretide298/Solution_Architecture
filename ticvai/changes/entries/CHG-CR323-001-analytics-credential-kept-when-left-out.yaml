id: CHG-CR323-001
date: '2026-10-29'
source: cr
kind: contract
summary: 'setAnalyticsProvider: a PUT that leaves the write-only reportingCredentialRef out keeps the credential held,
  an explicit null clears it; the one row per venueId + provider is the unique index
  analytics_provider_venue_id_provider_uniq (NULLS NOT DISTINCT), already in the forward migration V0108 since r8, and
  its violation is 409 analytics-provider-exists.'
decision:
  what: 'ADAM CR-323, the recommended (1) and (2) (Chinmay, 29 October 2026: "As recommended, comment now", then
    "Include those in today as well"). contracts/satellite/white-label.yaml setAnalyticsProvider: a PUT that leaves
    reportingCredentialRef out keeps the held credential, an explicit null clears it (hasReportingCredential then
    false), a value replaces it; every other field is replaced as sent. The 409 analytics-provider-exists also covers a
    unique violation on analytics_provider_venue_id_provider_uniq. StorefrontAnalyticsProvider.reportingCredentialRef
    says the same. (1) needs no schema change: the contract has declared x-ticvai-unique-together [venueId, provider]
    with x-ticvai-unique-nulls not-distinct since r8 (CHG-R8STO-001), and derive-ddl wrote the index into
    backend/tenant/V0108__after_r1_20261020.sql (CREATE UNIQUE INDEX IF NOT EXISTS
    analytics_provider_venue_id_provider_uniq ON whitelabel.analytics_provider (venue_id, lower(provider)) NULLS NOT
    DISTINCT); backend/tenant/010-whitelabel.sql is the frozen r1 baseline, which is why the table shows no key.'
  by: Chinmay
  date: '2026-10-29'
why: 'ADAM CR-323 (Deep Khanvilkar, ticket #30765 setAnalyticsProvider): the table showed no (venueId, provider) key,
  and the contract did not say whether a PUT that leaves the write-only reportingCredentialRef out clears the held
  credential or keeps it, which a client cannot resend.'
keys_touched:
  operations: [setAnalyticsProvider]
  schemas: [StorefrontAnalyticsProvider]
  tables: [whitelabel.analytics_provider]
  files:
  - contracts/satellite/white-label.yaml
  - tools/check-business-rules.py
root_class: 'a write-only secret on a PUT that replaces the row, with no rule for a PUT that leaves it out'
tickets:
  started:
  - '30765 (setAnalyticsProvider, Ready for QA, Deep Khanvilkar): a PUT without reportingCredentialRef keeps the held
    reference and an explicit null clears it (the build follows "left out clears" until now, per the CR); map a unique
    violation on analytics_provider_venue_id_provider_uniq to 409 analytics-provider-exists (the advisory-lock check
    can stay for its own writes).'
  - '30249 and 27663 ([DB] whitelabel.analytics_provider and the V0016 whitelabel migration, Ready for QA, Hrushikant
    Patkar): per CR-323''s evidence the repository''s db/tenant files lack the index; add
    analytics_provider_venue_id_provider_uniq from backend/tenant/V0108__after_r1_20261020.sql. No new DDL.'
  unstarted:
  - '31117 (CMS-016 Site Settings: connect to API, New): leave reportingCredentialRef out of a save that does not
    change the credential.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-323
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py
status: open
notes: 'Rule BR-ANALYTICS-PROVIDER fails on the r10 contract (no rule for a left-out credential; a 409 that names no
  index) and passes now; check-ddl-conventions D-FWD-CARRIED holds the index in the forward migrations. A general rule
  over every write-only secret on a PUT was left out: it fails today on approvals setApprovalExternalProvider
  signingSecret and orders setPaymentProvider credentialRef, which state no rule for a PUT leaving them out either
  (setApprovalExternalProvider.outboundCredential does: "kept on a replace that omits it"); each is a decision of its
  own, and baselining is not allowed. The index is on (venue_id, lower(provider)): provider is a closed enum with no
  two values differing by case, so it is the key the CR asks for.'
