id: CHG-R8SPN-025
date: '2026-10-20'
source: audit
kind: contract
summary: 'Guest sign-in and the order confirmation have an answer for every case the approved screens show. The guest app
  starts Apple, Google and UAE Pass sign-in from a guestSignIn block of the published tenant config (public values
  only). An SSO sign-in by a principal who already holds a session, or onto an occupied device, is refused 409 as
  login is. listTicketTransfers is ordered by expiresAt ascending everywhere and never returns claimUrl to the sender.
  verifyGuestEmail carries no staff permission (ADR-0025). Add to wallet is reprintOrder delivery wallet. checkoutCart
  returns Order.orderAccessToken (24 hours, this order only, not stored), which getOrder accepts in
  X-Order-Access-Token in place of a session.'
decision:
  what: 'R8 blocker causes IDENTITY-C21, IDENTITY-C24, IDENTITY-C26, IDENTITY-C28, IDENTITY-C29 and IDENTITY-C52 (lead
    answers: take the recommendation, option A for each). identity.yaml guestSocialLogin, guestUaePassLogin,
    completeSsoAuthorization, verifyGuestEmail; orders.yaml listTicketTransfers, TicketTransfer.claimUrl,
    reprintOrder, getOrder, Order.orderAccessToken. White-label PublishedTenantConfig.guestSignIn and the WEB-012,
    WEB-013, WEB-014 screen changes are the surface lane''s part, requested in the core lane report.'
  by: Chinmay
  date: '2026-10-20'
why: 'Walk of the Sprint 1 and 2 tickets 27739, 27757, 27734 and 27737 (ADAM gaps 27739/0, 27757/4, 27734/0, 27734/1,
  27737/2, 27737/3, 27737/4, 27737/5). Finding: R8 blocker cause list, group identity.'
keys_touched:
  operations: [guestSocialLogin, guestUaePassLogin, completeSsoAuthorization, verifyGuestEmail, listTicketTransfers,
    reprintOrder, getOrder, checkoutCart]
  schemas: [TicketTransfer, Order, SessionHeldProblem]
  files:
  - contracts/spine/identity.yaml
  - contracts/spine/orders.yaml
root_class: 'screen-api gap: an approved guest screen has no operation or credential for what it shows'
