notes: 'check-design-notes now validates `decisions` (fields, date, a DEC id and an existing CHG id in source, questionSource
  resolved, no question left in both lists) and correction `status`/`by` (fixed, logged or withdrawn, by an existing change
  entry), and refuses any CHG id a source names that has no entry. Before this change the notes had no `decisions` key,
  so nothing recorded that a question was answered.


  Decisions by kind: {''answered'': 7, ''default accepted'': 11, ''default (non-critical, reviewable)'': 1}.


  Corrections by entry: CHG-GST-004 2 fixed; CHG-WIR-012 19 fixed; CHG-WIR-013 8 fixed; CHG-WIR-014 1 logged. Corrections
  with no status (142) are still open.


  Tickets: none started (Block A starts Monday 5 October 2026); the notes feed the design batches at the next refresh,
  not ticket text.


  Answers that change the drawn default:

  - DEC-001 (Q1) ADM-037: With BYOK, the AI engine maps each AI task to the client provider''s equivalent model from TICVAI''s
  curated range (tiers, not model names: research section 2.3); usage is billed to the client''s own key. Closes AI-D20
  (deferred to the AI workshop).

  - DEC-002 (Q2) ADM-037: A client cannot change the model per agent. TICVAI curates the model for each task; setAiProvider/setAiModel
  refuse a model outside the curated map for that task (new problem type, e.g. modelNotCurated). Overturns AI-D18''s ''warns,
  never blocks''.

  - DEC-003 (Q3) ADM-508: Forecast publication is approved by whoever holds that module''s AI publish permission; no default
  role. Uses the per-module permission checklist with presets (see the ADM-554 decision).

  - DEC-007 (Q7) ADM-554: Role builder: roles are preset permission configurations (All, Viewer, Mid-level and the like),
  not fixed default roles. Picking a preset fills the per-module permission checklist, which stays editable, and the role
  can be renamed. Each module carries its own "Publish AI model" permission; AI release promotion goes to whoever holds
  it (Pre-apply round, 2 October).

  - DEC-008 (Q8) BO-091: The AI spend ceiling is shown and set in the tenant''s selected currency (default USD), with
  tokens shown alongside.

  - DEC-009 (Q9) BO-919: The event forecast covers every requirement kind (staff, pos, kiosk, gates, fnb, retail, stock,
  resource, equipment, facility), filtered to what the venue configured. Action: a curated model per AI/ML task with 3-4
  alternatives (done as research; see the curated-range decision).

  - DEC-275 (Q275) BO-772: Guests who checked out without an account receive marketing only if they ticked the checkout
  opt-in (unticked by default, source checkout); nothing is sent without it. Replaces the drawn ''not targeted until the
  consent question is answered''.


  Rule edits:

  - ADM-037 patch inputs (DEC-001)

  - ADM-037 patch outputs (DEC-002)

  - ADM-037 add edgeCases (DEC-002)

  - ADM-508 add outputs (DEC-003)

  - ADM-554 patch actions (DEC-007)

  - BO-091 add outputs (DEC-008)

  - BO-919 add outputs (DEC-009)

  - BO-772 add edgeCases (DEC-275)'
