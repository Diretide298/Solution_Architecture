why: 'Chinmay''s answers of 2 October to the open-questions workbook (Q1-Q17, Q274-Q275): batches 1-6, the critical sets,
  and "show me only critical" for the non-critical defaults; the later rounds win (Door follow-ups, Pre-apply round: roles
  as preset permission configurations, darkMode deprecated, Powered by as a toggle default on, closeShift on POS-007 plus
  the daily reconciliation). The design notes still listed them as open, so a design session would draw the old default.
  The corrections'' status was read from the screens on main after the wiring (CHG-WIR-001..027), guest (CHG-GST-001..006),
  door (CHG-DOOR-001..006), finance (CHG-FIN-001..011) and loyalty (CHG-SEED-008) fixes.'
