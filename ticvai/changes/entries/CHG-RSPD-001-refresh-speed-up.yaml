id: CHG-RSPD-001
date: '2026-10-04'
source: developer
kind: process
summary: The refresh gate fails loudly, times every step, resumes a failed run, holds a release lock, refuses a
  stale base, runs the checks four at a time, and the three slowest checkers parse each file once.
decision:
  what: 'Implement the refresh speed-up the council of 3 October 23:30 decided (TODO "Refresh speed-up"):
    loud failure with a completion marker the judge requires, per-step timings, --resume, a release lock and a
    STALE BASE check, the checks in parallel (4 jobs, proven equal to sequential), a profile of the slow checks
    with only clear and safe fixes, a Defender runbook for Chinmay, and the refresh policy. No content-hash
    cache before Sprint 2.'
  by: Chinmay
  date: '2026-10-03'
why: 'The council of 3 October 23:30 (docs/active/council/council-report-2026-10-03-refresh.html, copied into git
  from the council folder, with its transcript; chairman verdict) found that reruns, not run length, were the cost: about 80 minutes paid six times on 3 October, and
  one run died silently at step 37 (build-service-docs) with nothing after the step banner. The gate is the
  safety net, so speed may not weaken it; every part below either makes a failure cheaper or is proven to give
  the same result.'
keys_touched:
  files:
  - tools/refresh-safe.sh
  - tools/refresh-manifest.py
  - tools/run-checks.py
  - tools/check-screens.py
  - tools/check-package.py
  - tools/check-wireframes.py
  - docs/active/refresh-runbook.md
  - docs/active/release-runbook.md
  - docs/active/council/council-report-2026-10-03-refresh.html
root_class: A00 TOOLING
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
triage: fix-forward
prevention:
  type: generator-rule
  ref: tools/refresh-manifest.py::__finish
status: closed
closed_by_commit: 8ca4cd23
notes: 'Decisions, each with its reason (4 October 2026, branch refresh-speedup):
  (1) The step wrapper lives in the script refresh-manifest.py emits, not in refresh.sh itself: refresh-safe
  runs the emitted copy, refresh.sh keeps its 65 commands readable, and a plain refresh.sh run (forbidden in
  the main tree by ticvai/CLAUDE.md rule 10) is unchanged.
  (2) Loud failure is set -e plus an EXIT trap that names the step ("FAILED at step N <name> -- exit rc after
  Xs"); a step that exits 0 but leaves an expected output missing, empty or unparseable also fails. Expected
  outputs are the manifest''s concrete writes for the step''s command that exist before the run (266 files over
  64 steps): matched by command, so the manifest traced on 2 October (64 steps) still covers 64 of today''s 65;
  a file that did not exist before is a conditional write and is not expected. JSON outputs must parse,
  .xlsx/.docx/.pptx must be readable zips; other files must be non-empty.
  (3) The marker "== refresh completed: all N selected steps of T" is printed last, only when every selected
  step completed, and the judge itself fails a run whose log lacks it -- so even a refresh killed with no trap
  (proved: run.sh SIGKILLed mid-step, rc 137) can never end in PASS.
  (4) Per-step timings go to <run>/steps.tsv (step, name, start, seconds, exit, status) with bash''s
  EPOCHREALTIME, no extra processes; the ten slowest steps and every phase (setup, derive, checks, merge,
  total; also <run>/phases.tsv) are printed at the end of every run, failed or not.
  (5) --resume reuses the failed run''s worktree and skips the steps its state.tsv lists. It is valid only if
  HEAD is the commit the failed run started on and the fingerprint of every step (its text, its tool, the
  local modules the tool imports, refresh.sh and the emitter) is unchanged; otherwise it is refused, the kept
  worktree is removed and a fresh run starts. A resumed run never merges: the release gate is always a
  fresh run. Only a failed or interrupted run (exit 1 or 130) keeps its worktree; a pass, a merge refusal or
  a stale base does not, and any non-resume run removes what was kept. Traced runs are not resumable.
  (6) The release lock is a directory (mkdir is atomic on Windows too) in the repository''s common git
  directory, so the main checkout and every worktree share one lock; it records pid, Windows pid, start,
  HEAD, tree and run. A lock whose holder is not running (kill -0, then tasklist for the Windows pid) is
  stale and removed. A second run while one holds it exits 6.
  (7) Before merging, HEAD must still be the commit the run started from: otherwise "STALE BASE", nothing
  merged, exit 5. With --no-merge it is reported and the verdict names the commit it is for.
  (8) run-checks.py --jobs N (refresh-safe passes 4, its --jobs flag changes it) runs N checkers at once and
  prints each row only when every row above it has printed; --jobs 1 is the original loop, kept. Each
  checker''s full output is kept in <run>/checks/<name>.txt (before, only its last line survived for 66 of
  the 68). check-package and check-authored-inputs still run alongside, as before.
  (9) Serial-only checkers: none. All 68 were read: every write is behind a flag run-checks never passes
  (--write, --csv, --json, --fix, --bless, --freeze, --update-baseline); check-contract-compat''s one
  unflagged write is a fresh mkdtemp per process; the git calls only read. SERIAL stays as a barrier for the
  first checker that ever needs it, with the rule written beside it.
  (10) The three checks over two minutes were profiled (cProfile, on 857986c1): check-screens (681 s),
  check-package (638 s, alongside) and check-wireframes (279 s) each spent 93-99.7% of their time in PyYAML,
  re-parsing the same 16 screens files and 35 contracts once per rule (490, 969 and 144 safe_load calls). In
  each, a text is now parsed once and every caller gets a fresh pickle copy of the result: the same parser,
  so the same result, and no rule sees another''s edits. Output byte-identical before and after for all
  three; check-screens 681 s to 36 s, check-package 638 s to about 121 s, check-wireframes 279 s to 33 s.
  check-package''s duplicate-key loader (rule 18) is not cached: it reports while it parses. The libyaml
  loader would be faster still and was not taken: it is a different parser (check-package rule 18b exists
  because it rejects what PyYAML accepts), and the gate''s results must not move. The checks between one and
  two minutes (check-flows, check-lineage, audit-links, check-flow-briefs, check-r1-additions) were left:
  the parallel run hides them.
  (11) Defender: no system setting was changed; the exclusion commands are in docs/active/refresh-runbook.md
  for Chinmay to run as administrator.
  (12) Policy (docs/active/refresh-runbook.md): scoped runs and single checkers while iterating, the full gate
  only at the Tuesday and Friday releases with CRs batched, never a gate with more than two agents running. No
  content-hash cache before Sprint 2, and only after the manifest rebuilds itself and three cold runs match
  cached runs byte for byte.
  (13) The task named the file CHG-RSPD-001.yaml; it is CHG-RSPD-001-refresh-speed-up.yaml because
  check-changelog requires <id>-<slug>.yaml.
  (14) Proof, 4 October. Unit level, in a throwaway repository with three fake steps and three fake checks
  (no hook left in the package): a forced failure in step 2 stops the run with "FAILED at step 2 ... exit 3",
  exit 1, the worktree kept; --resume then skips step 1 and passes without merging; --resume after step 3''s
  script changed (uncommitted) is refused ("the script of step(s) 3 changed") and a fresh run starts; after a
  commit, both reasons are given; a step that exits 0 leaving truncated JSON fails on its expected output; the
  refresh shell SIGKILLed mid-step ends "no FAILED line: the refresh process itself was killed", exit 1, no
  checks; an exit 0 inside a step is still FAILED; the judge alone refuses a log with no marker; a second run
  while the first holds the lock exits 6 naming the holder; a lock left by a SIGKILLed run is removed as stale;
  a commit during a run ends in STALE BASE, exit 5, nothing merged; a traced run still builds its manifest,
  the output check''s reads unrecorded. Equality: on the tree the end-to-end run derived, run-checks --jobs 1
  (808 s) and --jobs 4 (251 s), all 68 checkers, PYTHONHASHSEED=0: 68 outputs byte-identical, exit codes and
  the table identical apart from the seconds, the tree unchanged by either. Without the seed,
  audit-pack-citations orders tied packs differently on every run, sequential runs included (it sorts a set by
  page count alone): pre-existing, verdict unchanged, left for its owner (a tie-break by name). End to end:
  refresh-safe on e9a6661e, --no-merge --keep-worktree, started detached from PowerShell with Git Bash: PASS,
  the same verdict as the last PASS of 3 October (on 94179670, merged as 857986c1) against the same
  baseline -- every run-checks checker the same mark and exit code, check-package''s 2 and
  check-authored-inputs'' 7 known failures the same lines, the same 4 report-only non-zero. Times: setup 2m14s,
  derive 35m46s, checks 3m40s, merge (report only) 7s, total 41m47s, against 2.4, 47.9, 33.4 and 0.6 min (84.4)
  on 3 October. The derive steps are unchanged, so their gap is the machine''s load; the checks went from 33.4
  to 3.7 minutes.
  Closes when the branch is merged and a full gate has passed on it: closed_by_commit is that merge. Closed on the merge into r1-fix-merge (8ca4cd23), as asked for the release refresh; the full gate on the merged branch is the lead''s run after it.'
