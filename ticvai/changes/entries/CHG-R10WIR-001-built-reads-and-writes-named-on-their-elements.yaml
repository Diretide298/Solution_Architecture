id: CHG-R10WIR-001
date: '2026-10-26'
source: audit
kind: spec
summary: 'Seven approved screens name the operation on the element that already does the job (ADM-145, BO-065, BO-1063,
  BO-503, BO-1162, CMS-101), and derive-screen-wiring binds BO-1068''s one publish gate to deployConfigurationProfile;
  nothing visible changes.'
decision:
  what: 'Binding only (`operation`, an overlay''s `reads`; invisible to check-approved-ui). screens/P08: ADM-145 the
    panel "The selected promotion approval" reads listPromotions (its promotion columns are the promotion behind the
    request); BO-065 the "Guest two-step verification" toggle and "Actions that ask again" show getVenueSettings (the
    value or the inherited tenant default; "Save venue settings" and its form still send setVenueSettings); BO-1063 its
    six number fields show getVenueSettings, the Save button still sends setVenueSettings (as WEB-011''s fields show
    getMyProfile); BO-503 "Version history" and BO-1162 "Security Audit" call listAuditRecords (onAction). screens/P13
    CMS-101 formCreateGuidedChoice reads [listProducts, listProductCategories, listEvents, listBookingFlows], the
    answer-target pickers its body and the editor''s notes name (siblings: the last three were unreached too).
    tools/derive-screen-wiring.py: reached() now counts an overlay''s `reads` as the check does (it looked for another
    component to bind a form''s picker read to), and a screen''s one publishGate binds a deploy* operation as it binds
    publish*: BO-1068''s gate "Promotes this configuration to the target environment" is the confirm the call needs,
    and binding its derived button instead would only move the finding to S-BUTTON-FORM. On the refresh the deriver
    also binds BO-1162''s table "Every security governance audit" to listWalletConfigurationVersions (its one unshown
    onLoad read, the rule-4 slot).'
  by: Chinmay
  date: '2026-10-26'
why: 'The r10 integration gate of 26 October 2026 (run 20261026-153734-1986): check-screen-wiring S-OP-UNREACHED, built
  on by started tickets, which passed only because the allowance pattern matched the line for five findings r10 fixed
  (CHG-R10GFP-006, CHG-R10OPN-005). The lead''s instruction for r10: fix every gate finding at the source.'
