notes: 'Database change (tenant): five unique indexes; (control): one. **The class is wider than the review''s six**: on
  r12, 126 of the 127 operations with x-ticvai-body-key write a table with no unique index over their key (setFnbReservationPolicy,
  setWalletFundingRules, setSeatRules ...). A generator rule deriving one from every body key would add about a hundred
  indexes in one migration, and some keys are incomplete (setCaseInvestigationResolution''s ''per case and linked record''
  is keyed by caseId alone), so it is brought to the lead rather than done or baselined here.'
