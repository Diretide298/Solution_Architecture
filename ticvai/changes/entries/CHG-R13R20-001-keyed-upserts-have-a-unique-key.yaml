id: CHG-R13R20-001
date: '2026-11-02'
source: audit
kind: contract
summary: 'The six upserts the developer review named have a unique index behind their key: fnb.kitchen_routing_rule (outlet_id),
  fnb.course_rule (outlet_id), catalogue.dynamic_pricing_strategy (scope_path, lower(code)), catalogue.channel_connection
  (sales_channel_id, lower(connector_name), lower(environment)), catalogue.channel_sync (sales_channel_id, lower(domain))
  and control.module_listing (lower(module_code)), each an x-ticvai-unique-together on the contract schema; setChannelSyncSetting
  is keyed by [salesChannelId, domain], as its text says.'
decision:
  what: 'The lead, 2 November 2026, on the developer review''s root causes that r12 left unfixed: "lets see if we can do
    something in parallel", then "yes" to fixing the mechanical ones at their source beside the r13 build lanes. Only what
    needs no decision of the lead is done here; the rest is brought to the lead.'
  by: Chinmay
  date: '2026-11-02'
why: 'Developer review root R20 (findings 2.37066.3, 4.27808.4, 5.27943.2, 5.29713.2, 5.29760.2; tickets #37066, #27808,
  #27943, #29713, #29760): a keyed upsert with no unique key lets a race make two rows, and the one-row-per-X reads had
  no rule for them. Re-checked on r12 (e3e4082c): unchanged.'
