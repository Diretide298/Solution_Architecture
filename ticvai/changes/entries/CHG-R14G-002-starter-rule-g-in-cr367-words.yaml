summary: 'api-conventions rule g, copied into every backend, frontend and AI workspace, still said a permission holds "at
  the scope the operation acts on or an ancestor" (CR-189), the wording CR-367 replaced on 30 October because it permits what
  V07, V08 and V12 deny; the frontend CLAUDE.md, frontend-patterns 4.2 and the eslint message said clients "consume effectivePermissions".
  All now state spec 7.2/7.3 in CR-367''s words (the entry of the deepest listed path that contains the node; entries never
  combined; clients never apply a deny) and cite CR-367. check-starter-fit compares the starter docs with the authored package,
  not with the ticvai/repos/ mirror: SF-SPEC-CR fails a starter doc line citing a change request a later decision corrected
  without citing the later one, read from the change entries (CHG-CR367-001: "This corrects CR-189").'
