notes: 'Batch SWP, 14 October 2026. Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release
  today as an exception". Run on the parent commit 594e51a2 with the gate''s derived plan (w146): the two rules find
  704 findings, every one new, so the check fails there; on this branch the 700 are known and only the four strict
  #27741 findings fail, by design, until batch GAP''s fix merges. By app and block (S-FEATURE-OP-UNUSED): P01 A 145,
  P02 A 55, P04 A 79, P05 A 1, P06 A 17, P06 D 4, P07 B 19, P08 A 207, P08 B 55, P08 C 14, P08 D 16, P08/P13 A2 1,
  P09 A 40, P10 B 1, P13 A 38, P14 A 4, P15 A 1, P16 A 1; S-SCREEN-OP-UNBUILT: P05 A 1, B 2, C 2, D 1. When GAP''s
  composition rule regroups the backend tasks, a listed operation that moves to another feature and is still unused
  there is a new key: the lead re-runs the check after that merge and records the baseline only for what remains.'
