id: CHG-SWP-001
date: '2026-10-14'
source: audit
kind: process
summary: 'check-ticket-scope reads every feature ticket that builds screens against those screens, in every block: a
  feature that lists an operation none of its screens calls (S-FEATURE-OP-UNUSED), and a frontend ticket whose screen
  calls an operation in its scope that neither its feature nor any ticket it depends on builds (S-SCREEN-OP-UNBUILT).'
decision:
  what: 'tools/check-ticket-scope.py gains S-FEATURE-OP-UNUSED and S-SCREEN-OP-UNBUILT, read from
    handoff/service-docs/plan-tasks.csv through the new tools/ticket_features.py (a feature''s screens and operations
    from its tasks'' builds, a frontend task''s scope: the screen''s operations, its setup slice, or the rest after the
    sibling''s slice). The 700 findings on r6 (gate w146, HEAD 594e51a2) are baselined in handoff/audit-baseline.json;
    the feature AM-IDENTITY-SECURITY-P02 (#27741) is in ticket_features.UNBASELINED, so its four findings are strict
    and fail until batch GAP''s fix lands. The ticket-composition rule itself (build-service-docs.py) is batch GAP''s.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding on r6 (594e51a2, CHG-SWP sweep): a developer''s agent stopped on #27741 (AM-IDENTITY-SECURITY-P02, Identity & Security on the guest app): the
  feature listed addToWishlist, getWishlist, removeFromWishlist and searchGuests (SVC-MARKETING-GUEST-1 and -2), which
  none of GST-010, GST-042, GST-073 calls. Chinmay, 14 October 2026: "Once done can we check rest of the things for
  similar patterns?" The sweep (ticvai/CLAUDE.md rule 13, checks first) found the class in 80 of the 295 features
  that build screens: 694 listed operations no screen of the feature calls (260 called only by other apps, 228 by no
  screen at all, 210 by another feature of the same app) and 6 kiosk tickets calling getPublishedKioskConfig, built
  by APP-KIOSK-CONFIG and SVC-WHITELABEL-KIOSK-2, neither of which they depend on. A backend operations task is put
  under the first feature that needs any of its group''s operations, so the feature carries the whole group.'
keys_touched:
