    approvalRequestId. contracts/satellite/marketing-crm.yaml DataSubjectCustomerPrivacyRequestManagementView:
    approvalRequestId. tools/check-business-rules.py BR-PRIVACY-REQUEST. Database: marketing.privacy_request
