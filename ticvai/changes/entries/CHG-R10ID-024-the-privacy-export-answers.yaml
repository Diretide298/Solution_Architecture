summary: 'A guest''s data export with no matching approval rule runs at once (no Approvals request; the export''s own id
  is the request id); the file is kept 7 days and the row then becomes expired; the privacy case''s jurisdiction is the
  country of the venue the request is raised at, carried on identity.privacyRequestRaised; and the case carries the
  request id (marketing.privacy_request approval_request_id).'
