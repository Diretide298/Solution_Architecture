id: CHG-CR562-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'getCellHealth answers the last reading stored in control.cell.health, the value getCell returns as
  CellDetail.health; CellHealth no longer says "polled, not stored". It reads control.cell alone on the replica (not
  control.cell_instance), and answers 400 validation for a cellId that is not a uuid, 403 without PLATFORM_CELL_VIEW, and
  404 not-found for no row, a null reading, or a stored value missing isHealthy, schemaVersion or checkedAt (detail
  "This cell has no health reading yet."; a value is never filled in). The writer of control.cell.health is declared as
  the job subscription#cellHealthWriter, its own task.'
decision:
  what: 'Posted on #31364 (Chinmay, 3 November 2026), under the lead''s "Dont hold r13. approve them and rever tto the devs" of 3 November 2026: "option A. getCellHealth returns the last
    reading stored in control.cell.health, the same value getCell returns as CellDetail.health ... (1) PLATFORM_CELL_VIEW
    is required (403 otherwise). A cellId that is not a uuid is 400 validation ... No row is 404 not-found ... (2) If the
    row exists but health is null, answer 404 not-found with the detail ''This cell has no health reading yet.'' ... (3)
    If the stored value lacks isHealthy, schemaVersion or checkedAt, treat it as no reading ... never fill in a value
    ... (4) Do not read control.cell_instance ... The writer of control.cell.health is separate work on its own
    ticket."'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-562 (Narayan Gaonkar, #31364 getCellHealth): CellHealth said "polled, not stored" while
  control.cell.health stores it and getCell serves it, nothing defined the answer for a cell with no reading, and the
  operation declared no 400, 403 or 404.'
keys_touched:
  operations: [getCellHealth]
  schemas: [CellHealth]
  tables: [control.cell]
  files:
  - contracts/satellite/subscription.yaml
  - handoff/api-data-lineage-overrides.json
  - tools/check-business-rules.py
root_class: 'a read whose source, empty case and refusals the contract left undefined'
tickets:
  started:
  - '31364 (getCellHealth, Narayan Gaonkar, On hold): build to the posted comment; the operation''s tables are now
    control.cell alone (the carried lineage override that added control.cell_instance is removed).'
  unstarted:
  - 'New task JOB-SUBSCRIPTION-CELL-HEALTH-WRITER (tools/build-service-docs.py makes it from the declared job
    subscription#cellHealthWriter; parent: the PlatformService cell tasks): the writer of control.cell.health.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-562
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-CELL-HEALTH-STORED
status: open
notes: 'Beyond the posted words: the writer is declared in subscription''s x-ticvai-jobs (cellHealthWriter, workers,
  a timer, reading and writing control.cell) because check-jobs holds every described piece of background work to a
  declaration and a task; its schedule and what it reads from each cell are not decided here.'
