id: CHG-R6-040
date: '2026-10-12'
source: client-review
kind: spec
proposed: '2026-10-12'
summary: 'Venue Management gets two Block B screens the client found missing on 6 October: BO-1191 Organisation (the
  department, sub-department and outlet tree on the existing org units) and BO-1192 Entitlement Templates (the list, the
  products using each, and the template read, edited and archived). catalogue gains getEntitlementTemplate,
  updateEntitlementTemplate, archiveEntitlementTemplate and listProducts?entitlementTemplateId=, all additive.'
decision:
  what: 'contracts/spine/catalogue.yaml: GET and PATCH /entitlement-templates/{templateId} (getEntitlementTemplate,
    PRODUCT_VIEW; updateEntitlementTemplate, PRODUCT_CONFIGURE, config scope venue, body UpdateEntitlementTemplateRequest,
    409 template-archived), POST /entitlement-templates/{templateId}/archive (archiveEntitlementTemplate,
    PRODUCT_CONFIGURE, 409 template-in-use while a product that is not retired grants it), and the optional query
    parameter entitlementTemplateId on listProducts. screens/P08-venue-back-office.yaml: BO-1191 Organisation (Setup &
    Go-Live, wave 3, listDetail on listOrgUnits, getOrgUnit, createOrgUnit, updateOrgUnit; archive is isActive false) and
    BO-1192 Entitlement Templates (Sell, wave 3, listDetail on listEntitlementTemplates, getEntitlementTemplate,
    listProducts, createEntitlementTemplate, updateEntitlementTemplate, setEntitlementTemplateBlackoutDates,
    archiveEntitlementTemplate; the create form is the numbered steps). Linked from BO-100 and BO-064 (Organisation) and
    from BO-102 and BO-012 (Entitlement Templates). tools/derive-delivery-slice.py gains LATER_BLOCK_OPERATIONS and
    LATER_BLOCK_SCREENS so the two new writers are not Block A setup and the two screens host no setup operation:
    both screens plan into Block B (VM-BO-1191 under Tenancy & Venues, VM-BO-1192 under Ticketing).'
  by: Chinmay
  date: '2026-10-12'
why: 'The client''s feedback of 6 October 2026 before the UAE walkthrough ("some of the basic setup is not there such as
  Departments, Sub Departments, entitlement for the tickets, and it''s confusing"), filed verbatim in
  sources/client/2026-10-06-basic-setup-feedback.md. Venue Management had no organisation tree (departments only through
  BO-064''s Create org unit and the wave-3 BO-145; the tree is ADM-006 in the console) and no entitlement list (only
  BO-012 and the wave-3 BO-288/289); entitlement templates could be listed, created and given blackout dates
  (CHG-CSP-051) but never read alone, edited or retired. Chinmay placed both screens in Block B (N32).'
