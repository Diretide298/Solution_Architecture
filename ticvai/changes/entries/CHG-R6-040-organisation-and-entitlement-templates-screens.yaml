notes: 'Batch R6, 12 October 2026. **Started tickets:** APP-SETUP-BO-064, APP-SETUP-BO-012 and VM-BO-102 are Sprint 1
  tickets (handoff/service-docs/plan-tasks.csv), so they are taken as started and not rewritten: the only change to
  each is one navigation link (exitTo and a transition) to the new screen, which the release carries as a comment and a
  linked delta ticket. BO-064 keeps its Create org unit and BO-012 its Create entitlement template (both are their slice
  operations). VM-BO-100 is Sprint 2. **Block B checked** against a fresh tools/build-service-docs.py run of HEAD (both run in place and reverted): VM-BO-1191 lands in AM-TENANCY-VENUES-P08-3 and VM-BO-1192 in AM-TICKETING-P08-8, both Block B, Sprint 2; the three new operations join suspendEntitlement on SVC-CATALOGUE-ENTITLEMENT-3 (Block B, Sprint 2 -> 3); no started ticket and no Block A backend task changes. Two decisions keep it there: the screens are wave 3, because a wave-2 Venue Management screen is chunked with the VM epic''s operations and its template reads joined listEntitlementTemplates on SVC-CATALOGUE-ENTITLEMENT-2 (Block A, Sprint 1); and LATER_BLOCK_OPERATIONS, because the slice''s fixpoint otherwise takes the two new writers into SVC-CATALOGUE-ENTITLEMENT-1 (Sprint 1) and makes BO-1192 a Block A setup screen. **Side effects on later blocks, for the lead:** BO-1192 re-cuts Ticketing on Venue Management, so SVC-CATALOGUE-EVENTS-6 (pushed #29892, Block B, Sprint 5, unstarted; its one operation setSpace) merges into SVC-CATALOGUE-EVENTS-4, recorded in tools/op-retire.py OTHER so check-key-stability passes; the added Block B points move Rentals on the Staff App part 1 (23 tasks: APP-STAFF-EMP-071..087, SVC-VENUEOPS-RENTAL-3..5, MIG-RENTAL-3, TEST-AM-RENTALS-P06) from Block C to Block D, and shift 155 later tasks'' sprints. **Gates:**
  PRODUCT_VIEW and PRODUCT_CONFIGURE are in the permission vocabulary; updateEntitlementTemplate''s config scope is
  reached by check-config-scope (Template); archiveEntitlementTemplate declares no config scope, as archiveMediaTemplate
  (the archive verb is outside the checker''s reach and widening it fails archiveMediaTemplate, another owner''s); no
  new list read (getEntitlementTemplate reads one; listProducts is already paged). **Not in the contract, recorded as
  gaps on the screens:** moving an org unit (its code is the ltree segment, fixed once created), the outlet, staff and
  product counts under a unit (only childCount), template versions and a publish step, and the Entitlement step on
  the product screens (BO-007, BO-008, started). listEntitlementTemplates still returns a bare array with no paging (an
  r1 shape; paging it would break r1). check-screen-patterns DEC rows CHG-R6-040 fail if either screen drops the reads
  and writes it was made for; on the commit before this change they fail as "the screen is gone".'
