id: CHG-R14I-004
date: '2026-11-03'
source: audit
kind: process
summary: 'A clone without the release tags no longer passes the freeze checks or regenerates frozen migrations: when the
  package has been released (op-release.json names r1 or later, or pms-map.json holds a pushed ticket) a missing r1 tag
  stops check-migration-freeze, check-contract-compat and derive-ddl with the fetch to run, and build-service-docs refuses
  to number migrations from the working plan alone.'
decision:
  what: 'Review finding E-05: release_baseline.baseline_commit() raises MissingReleaseTag; build-service-docs'' prior_migration_files
    no longer swallows a missing tag or an unreadable last plan. Decided by the lead, 3 November 2026, on the r13 system
    review''s triage: "All four, one release" (the starters, device/guest/token access, gate integrity, tenant setup and
    stale docs go into r14, released together).'
  by: Chinmay
  date: '2026-11-03'
why: 'The r13 system review, finding E-05 (reproduced in a copy with no .git): every freeze check passed and derive-ddl
  --apply would rewrite the baseline migrations; prior_migration_files fell back to the renumbering CHG-R8WFM-002 fixed.'
keys_touched:
  files:
  - tools/release_baseline.py
  - tools/build-service-docs.py
root_class: 'A00 TOOLING: a missing input read as a pass'
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: 'none: the lead''s own decision of 3 November 2026 on the r13 system review'
triage: fix-forward
