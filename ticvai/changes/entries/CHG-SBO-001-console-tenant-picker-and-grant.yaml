kind: spec
summary: Every TICVAI Console screen that calls a tenant-permission operation carries the R098 tenant picker, the platform-staff
  grant panel, Open access grant with step-up and a grantRequired state (the ADM-412 pattern).
decision:
  what: Add the tenant picker and the platform-staff grant to the ~66 Block A/B console screens and every other console screen
    acting in a tenant (ADM-068 and ADM-619 included, the lead 2 October); a new gating check holds it.
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, pre-apply round of 2 October 2026 ("Console R098 (about 66 screens): add a tenant picker and grant"; answers
  log, cited copy docs/active/decisions/answers-2-october.md). Audit R098 (28 September): the Console runs outside every cell
  and a platform token carries no tenant permission until a time-boxed grant is open, so these calls were refused 403 as drawn
  (design-note corrections, platform-foundation and ai, "Calls tenant-permission operations with no tenant picker").'
