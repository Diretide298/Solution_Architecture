  ref: tools/check-ddl-conventions.py
status: closed
closed_by_commit: ee22b123
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  Verified on this branch: derive-ddl --apply wrote V0104 with DROP INDEX IF EXISTS promotions.promotion_code_uniq and
  CREATE UNIQUE INDEX IF NOT EXISTS promotion_code_uniq ON promotions.promotion (lower(code)), 25 such swaps in the
  tenant database and one in control (tenant_domain hostname), and migration-review.md had no "index changed" row
  left; check-ddl-conventions D-UNIQUE-CASE then reported its 28 baseline entries gone. Derived files restored before
  the commit. The swap is not destructive: it touches no row, and if two codes differ only in case the CREATE fails
  and the migration''s transaction rolls back, so dedupe first. createPromotion''s duplicate check and any ON CONFLICT
  compare lower(code).'
