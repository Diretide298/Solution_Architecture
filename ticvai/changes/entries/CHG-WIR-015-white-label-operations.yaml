  2026) found these screens wired by the 18 August bulk attach, by name resemblance or from the wrong contract,
  against the adopted audit decision R254 (re-derive each screen''s operations from its purpose and journeys) and
  R276 (duplicate screens). Each screen''s reason and source is below and on the screen itself (gaps with removed:
  true).'
