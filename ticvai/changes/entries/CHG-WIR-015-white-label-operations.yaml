notes: 'check-screen-wiring gains S-STAFF-AUDIENCE (a staff screen calling a guest-, device-, service- or partner-only
  operation) beside the existing S-DUP-SCREEN and S-CONSUMED-MIRROR rules, and check-screens keeps its R254 attachment
  warnings; check-flows rule 3 holds every repointed flow step to its screen. Tickets: none started (Block A starts
  Monday 5 October 2026); unstarted keys are every tasks.csv or pushed key naming a touched screen. Per screen and
  flow:

  - CMS-003: removed getTheme, setTheme — Typography also read and saved the Theme (getTheme, setTheme); the theme
  belongs to CMS-005, and two save points for one record drift. The entry parameters bannerId, pageId, policyKind
  and version were left from the 41-operation bulk attach (design-notes corrections white-label CMS-003).

  - CMS-006: removed diffConfigVersion, listConfigVersions, publishTenantConfig, restoreConfigVersion; declared
  getTheme, getFonts, getBrandIdentity, getBookingFlowConfig — The screen was wired to the version table and publish
  gate (listConfigVersions, diffConfigVersion, publishTenantConfig, restoreConfigVersion), which are CMS-015 and
  CMS-014; Component Preview needs the theme, fonts, brand and booking-flow reads and createPreview (design-notes
  correction white-label…

  - CMS-011: declared getTenantConfig, proposeTranslations — The screen declared only setLanguages and no read,
  so it could not show the current languages or the translation gaps it exists for (getTenantConfig); the translation
  workflow the client asked for (machine draft, then review) is proposeTranslations, wired only to BO-785 and BO-793
  (DI-081, DI-083;…

  - CMS-014: declared diffConfigVersion, createPreview — A review step needs a field-level diff (the contract''s
  own reason for diffConfigVersion) and the client asked for a Review and Publish step with a preview (DI-194);
  neither was declared (design-notes correction white-label CMS-014).

  - ADM-016: see the screen — The entry parameters bannerId, pageId and policyKind are left from the bulk attach;
  branding is per tenant (design-notes correction white-label ADM-016).

  - ADM-017: see the screen — The entry parameters bannerId, pageId, policyKind and version are bulk-attach leftovers;
  the tenant claims on CMS-017, ADM-017 is the support path (design-notes correction white-label ADM-017).

  - BO-599: removed getTenantConfig — The screen is navigation; a full configuration read (getTenantConfig) is not
  needed (design-notes correction white-label BO-599).

  - CMS-011: removed proposeTranslations — proposeTranslations answers 202 and nothing on the screen can follow
  the job (R288); the machine-translation step stays on BO-785 and BO-793 until a status read exists (logged as
  a contract gap).

  - F102: step 3 operations [''createPreview'', ''diffConfigVersion''] -> [''createPreview'']; step 4 screen ADM-016
  -> CMS-014; step 4 operations [''createPreview'', ''diffConfigVersion'', ''getAppIcons'', ''getBrandIdentity'',
  ''setAppIcons''] -> [''diffConfigVersion'', ''publishTenantConfig'']; step 4 note

  - F103: step 1 screen ADM-017 -> CMS-017; step 1 note'
