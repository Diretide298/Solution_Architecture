id: CHG-CR450-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'getDashboard answers 404 not-found for a dashboard whose module is not licensed or whose module permissions
  the caller does not hold, exactly as if it did not exist, matching listDashboards: it asks the three Subscription
  reads in process (subscription#contractRecords, licenceAddOnRecords, planRecords) by the rule on
  CreateDashboardRequest.module, which now names getDashboard.'
decision:
  what: 'Posted on #33107 (Chinmay, 1 November 2026), the lead''s "Approve all" of the same day: "as you recommended
    (A). getDashboard answers 404 not-found for a dashboard whose module is not licensed or whose module permissions
    the caller does not hold, exactly as if it did not exist, matching listDashboards."'
  by: Chinmay
  date: '2026-11-01'
why: 'ADAM CR-450 (Hrushikant Patkar, #33107): CR-373 hid such dashboards from listDashboards and getCommandCentre and
  refused them on create and update, but did not name getDashboard, so a hidden dashboard still opened by id or
  bookmark, showing a module the tenant has not licensed or the caller may not see.'
