notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  Verified with derive-schema and derive-ddl --apply (derived files restored): the forward migration adds
  platform.workstation.cashier_input_mode text DEFAULT ''hybrid'' with workstation_cashier_input_mode_chk and
  guest_display_content text[]. tools/check-request-fields-stored.py (CHG-TEN-005) fails on r5 with these four
  fields and passes here. handoff/contract-backlog.json is the authored source; docs/registers/contract-backlog.md is
  rebuilt from it at the refresh. The PUT-replaces statement is a clarification the contract never contradicted; a
  client that sent a partial body now has a stated outcome.'
