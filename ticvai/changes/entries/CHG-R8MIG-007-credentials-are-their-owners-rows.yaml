id: CHG-R8MIG-007
date: '2026-10-20'
source: audit
kind: contract
summary: 'Credentials and second factors are their owner''s rows, and the connection context is written once. A guest''s
  MFA method, challenge and recovery codes are stored like a principal''s (exactly one of principal and subject); an
  authenticator''s secret, an OTP method''s full destination and a pending enrolment''s expiry have columns (field-encrypted,
  never returned). Row-level security: the MFA tables are the owner''s own rows (own-row); a credential is the
  principal''s, a grant over its home scope''s or the tenant root''s (own-or-home-scope); a venue manager writes the
  principals homed in their venue (home-scope-write); a guest reads and updates its own pii.subject (subject-self).
  backend/MIGRATIONS.md and the request-kernel task say how a transaction is opened before a session, for a guest and
  for a service call.'
decision:
  what: 'R8 blocker causes IDENTITY-C12 and IDENTITY-C34 (no decision), IDENTITY-C37 (option A) and IDENTITY-C48 (option A),
    as the lead answered on 20 October 2026. contracts/spine/identity.yaml MfaMethod, MfaChallenge, MfaRecoveryCode,
    Principal, PrincipalCredential; tools/derive-ddl.py RLS_MARKS own-row, own-or-home-scope, home-scope-write,
    subject-self with platform.own_row and platform.apply_own_row_rls, SPLIT_CHILDREN for the credential history,
    TABLE_RLS pii.subject; docs/active/block-a-extra-tasks.json request-kernel task text (task text only, no plan change).
    The policies change through the next forward migration only.'
  by: Chinmay
  date: '2026-10-20'
why: 'Finding: R8 blocker cause list (r8b-storage-core), group identity; tickets 27728, 27729, 27730, 27731, 27746, 27759,
  27773, 27786, 27750, 27765, 27768, 27732, 27766, 35697 and their ADAM gaps: a guest''s second factor had nowhere to be
  stored, an authenticator''s secret had no column, and the tenant-root-only policies refused changeOwnCredential, a
  venue''s createPrincipal and updatePrincipal, and a guest reading its own record.'
keys_touched:
  operations: [enrolMfaMethod, verifyMfaEnrolment, createMfaChallenge, verifyMfaChallenge, changeOwnCredential,
    createPrincipal, updatePrincipal, resetPrincipalCredential, login]
  schemas: [MfaMethod, MfaChallenge, MfaRecoveryCode, Principal, PrincipalCredential]
  tables:
  - identity.mfa_method
  - identity.mfa_challenge
  - identity.mfa_recovery_code
  - identity.principal
  - identity.principal_credential
  - identity.principal_credential_history
  - pii.subject
  files:
  - contracts/spine/identity.yaml
  - tools/derive-ddl.py
  - backend/MIGRATIONS.md
  - docs/active/block-a-extra-tasks.json
root_class: 'storage gap: a row-level policy or column the operation''s caller cannot meet'
tickets:
  started: []
  unstarted:
  - '27728, 27729, 27730, 27731, 27746, 27759, 27773, 27786, 27750, 27765, 27768, 27732, 27766, 35697; MIG-IDENTITY and
    MIG-PII take the policy changes from the next forward migration.'
release_tag: r8
decision_owner: Chinmay
adam_cr: 'none: R8 blocker walk (r8b-storage-core causes)'
triage: blocker
prevention:
  type: generator-rule
  ref: tools/derive-ddl.py::RLS_MARKS
status: open
notes: 'derive-ddl prints a warning and keeps the base rule when a mark does not fit its table. The forward file was
  applied to PostgreSQL 16 by the lane (see the lane report). Not done here: the guest-session sign-in method
  (GUEST_SESSION) and the lineage readColumns of the MFA operations (the lineage file''s owner).'
