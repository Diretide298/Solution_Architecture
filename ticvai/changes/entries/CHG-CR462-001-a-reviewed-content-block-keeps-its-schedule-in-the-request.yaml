  - '30785 (publishContentBlock, Hrushikant, On hold): raise the request with attributes publishAt and expireAt as
    sent; the block keeps its status and schedule. Told through the lead''s comment; its text is not rewritten.'
  unstarted:
  - 'New task needed (from the plan lane): white-label''s content-block approval consumer of approval.granted,
    rejected, withdrawn and expired, as publishContentBlock states.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-462
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-CONTENT-BLOCK-APPROVAL
status: open
notes: 'CMS-007 is approved UI and shows nothing new (reviewStatus rejected already exists). Beyond the comment''s
  words: the rejected, withdrawn and expired consumers are new consumer entries on approval.withdrawn and
  approval.expired, which had no white-label consumer at all (white-label''s config_version consumer is still on
  granted and rejected only); and the r12 sentence "the block stays a draft" on a rejection is replaced by "keeps
  the status and schedule it had", as the decision''s point 3 says. The approval.rejected, withdrawn and expired
  payloads carry no subjectType, so those consumers find the block by subjectId.'
