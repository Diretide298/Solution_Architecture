notes: 'Batch R4, 6 October 2026. Validated offline only: both files parse with python-hcl2; terraform validate and plan
  were not run (no terraform binary here, and the client has no Terraform runs yet). Unvalidated: NV6ads A10 v5
  availability per zone in UAE North (zones = var.zones), node_count with zones on a pool of one, the provider schema
  (azurerm ~> 4.53) and quota. The CPU "ai" pool stays (additive); removing it, as CHG-R11-001''s target cell has no AI
  CPU pool, is a change for the bootstrap that moves the AI pods. check-terraform-pools fails on the commit before (the
  LLD''s AKS AI GPU pool is no node pool) and passes after.'
