kind: spec
summary: Inputs, pick lists and actions that bound no schema property, or asked for fields a request does not have,
  are bound to the request and response schemas.
decision:
  what: Bind every input to the request property it sends and every pick list to the operation that fills it; replace
    pack labels that have no property; add the fields a request requires (mode, code, parent, outputFormat); move
    a design's model to the one its operations use.
