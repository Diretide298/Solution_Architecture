id: CHG-GEN-002
date: '2026-10-14'
source: audit
kind: process
summary: 'check-contract-shapes C-PAGED-ORDER now asks a cursor-paged list''s order statement to name the field it sorts
  on ("most recent first" alone fails); the 25 lists that passed only on an order word are baselined, except the two
  Identity grant lists batch IDR fixes.'
decision:
  what: 'C-PAGED-ORDER passes a list with a sort parameter, or an order statement that names a field: after "sorted /
    ordered / keyset ... by|on", in "newest <field> first", before ascending/descending, or after "then"; the field is
    a property of the listed items (one word, or two or three run together), a backticked name, or a camelCase /
    snake_case identifier. 25 lists newly found are added to handoff/audit-baseline.json; 4 baseline members that now
    name a field leave it. listOwnPlatformStaffGrants and listPlatformStaffGrants are not baselined: CR-077 orders
    them by openedAt, and batch IDR writes that.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-077 (ticket 27764): identity.yaml:4273 and 4641 said "most recent first" and named no column, and the
  check''s regex accepted "most recent" without one (check-contract-shapes.py:197-200), so the rule meant to catch R154
  passed both. The audit of 14 October (CR-077 prevention) asked to tighten it to a named field.'
keys_touched:
  operations:
  - listOwnPlatformStaffGrants
  - listPlatformStaffGrants
  files:
  - tools/check-contract-shapes.py
  - handoff/audit-baseline.json
