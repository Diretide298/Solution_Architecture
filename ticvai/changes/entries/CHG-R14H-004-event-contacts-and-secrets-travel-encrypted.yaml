id: CHG-R14H-004
date: '2026-11-03'
source: audit
kind: contract
summary: 'Every event payload field that is a contact or a secret carries x-ticvai-secret: field-encrypted:
  identity.mfaCodeIssued destination and code (said so only in notes), order.ticketsResent destination (an email or
  phone in clear) and cart.abandoned token (the cart''s recovery credential in clear). One rule for every event, by
  field name, in check-contract-storage.'
decision:
  what: 'The lead (Chinmay), 3 November 2026, on the triage of the r13 system review: "All four, one release". Review
    findings B-10 (identity.mfaCodeIssued carries the MFA code and email without the marker its sibling event has) and
    C-16 (an event carries a guest''s contact in clear, and the marker is applied unevenly); the fix is the authored
    event files and a general rule, not one per event.'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 system review findings B-10 (MEDIUM) and C-16 (LOW): events/_schema.yaml defines x-ticvai-secret:
  field-encrypted as how a per-guest secret is flagged (ADR-0063 as amended 14 October 2026, ADAM CR-370), and only
  identity.guestCodeIssued carried it; check-business-rules BR-GUEST-CODE-DELIVERY checked that one event alone.
  ticketsResent came with CR-506, mfaCodeIssued with CR-522.'
keys_touched:
  files:
  - events/identity-mfaCodeIssued.yaml
  - events/order-ticketsResent.yaml
  - events/cart-abandoned.yaml
  - tools/check-contract-storage.py
  other:
  - 'events identity.mfaCodeIssued, order.ticketsResent, cart.abandoned'
root_class: a contact or a secret in an event payload with no encryption marker
tickets:
  started:
  - '#30662 createMfaChallenge (Ready for QA, Sanket) and #37050 field encryption in the kernel (In progress, Pranay):
    text not rewritten; destination and code are encrypted through IFieldEncryption before the outbox write (as the
    notes already said); nothing new if they are.'
  - '#30679 reprintOrder (In progress, Narayan): the ticketsResent destination is field-encrypted before the outbox
    write.'
  unstarted:
  - 'The cart expiry job that publishes cart.abandoned, and the access, marketing consumers: encrypt, and decrypt at use.'
release_tag: pending
decision_owner: Chinmay
triage: fix-forward
adam_cr: 'none: r13 system review findings B-10 and C-16, lane h of r14 (the lead''s "All four, one release")'
prevention:
  type: check
  ref: tools/check-contract-storage.py::ST-EVENT-SECRET
status: open
notes: 'cart.abandoned''s token is beyond the review''s two events: the same rule finds it, and the token opens the
  cart. paymentTokenRef and tokenId fields are references, not secrets, and are not named by the rule.'
