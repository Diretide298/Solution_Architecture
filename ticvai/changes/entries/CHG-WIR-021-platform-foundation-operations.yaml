  ADM-013).

  - ADM-033: removed cancelDecommission, decommissionCell, updateCellTier — Copied cell actions (decommission, tier)
  are not part of backup status; decommission stays on ADM-003 only (design-notes corrections platform-foundation
  ADM-033, ADM-013).

  - ADM-034: removed cancelDecommission, decommissionCell, updateCellTier — Copied cell actions are not part of
  archival; decommission stays on ADM-003 only (ADR-0047; design-notes corrections platform-foundation ADM-034,
  ADM-013).

  - ADM-019: removed createPlan, createPlanVersion, getPlan, listPlans — Plan creation (createPlan, createPlanVersion,
