notes: 'check-screen-wiring gains S-STAFF-AUDIENCE (a staff screen calling a guest-, device-, service- or partner-only
  operation) beside the existing S-DUP-SCREEN and S-CONSUMED-MIRROR rules, and check-screens keeps its R254 attachment
  warnings; check-flows rule 3 holds every repointed flow step to its screen. Tickets: none started (Block A starts
  Monday 5 October 2026); unstarted keys are every tasks.csv or pushed key naming a touched screen. Per screen and
  flow:

  - BO-036: removed recordDeviceHeartbeat — recordDeviceHeartbeat is a device-audience operation the device sends
  itself; a back-office browser is not the device (device operations on staff screens are wrong wiring; R254).

  - BO-124: removed recordDeviceHeartbeat — recordDeviceHeartbeat is a device-audience operation the device sends
  itself; a layout builder in the back office is not the device (R254).

  - BO-125: removed recordDeviceHeartbeat — recordDeviceHeartbeat is a device-audience operation the device sends
  itself; a button configuration screen in the back office is not the device (R254).

  - POS-016: removed recordDeviceHeartbeat — recordDeviceHeartbeat is device-audience only; the peripheral reports
  its own heartbeat and a cashier pressing the button is refused 403. The last heartbeat shows read-only on the
  device list (ADR-0025; design-notes correction platform-foundation POS-016).

  - POS-019: removed getVenueSettings, setVenueSettings — Venue-wide settings (setVenueSettings, TENANT_CONFIGURE)
  were edited and read from a till; venue configuration belongs in Venue Management (BO-1063), and a till is a device
  the venue configures, not a place to configure the venue (ADR-0018; design-notes correction platform-foundation
  POS-019).

  - BO-116: removed setRolePermissions, setVenueSettings — Save role permissions (setRolePermissions) and Save venue
  settings (setVenueSettings) were attached to a merchandising screen by board position; role permissions move to
  Role Assignment BO-054 (design-notes correction platform-foundation BO-116).

  - BO-126: removed runReport, startRollout — Start rollout (startRollout, PLATFORM_RELEASE_PROMOTE) is TICVAI''s
  platform release act that tenant staff cannot hold (ADM-029 keeps it), and Run report is unrelated to deploying
  a workstation configuration (design-notes correction platform-foundation BO-126).

  - BO-128: removed setOfflinePolicy — Save offline policy (setOfflinePolicy) on a live monitor; offline policy
  is configuration, set on BO-130 and BO-206, and the monitor links there (design-notes correction platform-foundation
  BO-128).

  - BO-129: removed configureWorkstation, setConnectivityThresholds — configureWorkstation and setConnectivityThresholds
  shared the firmware and profile screen; connectivity thresholds have their own screen (BO-131) and workstation
  configuration is done where the device is registered (BO-036, F79 step 1) or at the till (POS-016). F89 step 2
  moves to BO-131 (design-no…

  - BO-143: removed getVenueSettings, setVenueSettings; declared getReturnPolicy, setReturnPolicy — The only settings
  write was setVenueSettings (support and quiet hours); retail global settings such as returns are outlet configuration
  in retail, served by getReturnPolicy/setReturnPolicy (design-notes correction platform-foundation BO-143).

  - BO-732: declared listDevices, setDeviceAssignment — POS & Device Assignment read only listOutlets and nothing
  assigned a device; setDeviceAssignment exists, and the devices to assign come from listDevices (design-notes correction
  platform-foundation BO-732).

  - BO-054: declared setRolePermissions, updatePrincipal, resolvePermissions — The purpose is "Give somebody the
  permissions their job needs" and the screen only listed and created roles. setRolePermissions sets what a role
  may do (removed from BO-116), updatePrincipal grants roles (Principal.roles, primaryRoleId) and resolvePermissions,
  the permission simulator removed from…

  - CMS-019: declared updatePrincipal — The purpose is "Say who in the tenant may change what" and the screen declared
  only reads; updatePrincipal grants or removes a role (Principal.roles) (design-notes correction platform-foundation
  CMS-019).

  - BO-057: declared listTrainingRecords — The only operation was listPrincipals; nothing read training or certification,
  which the purpose ("Know who is allowed to do what") needs. listTrainingRecords exists (design-notes correction
  platform-foundation BO-057).

  - BO-068: removed resolvePermissions — Resolve permissions (a permission simulator) was a button on the audit
  log; it belongs to role management and is declared on BO-054 (design-notes correction platform-foundation BO-068).

  - BO-085: removed evaluateApprovalRequirement — evaluateApprovalRequirement answers "does this need approval,
  and from whom" for the raising screen (till, purchase order) before a request exists; it has no meaning for the
  approver of an existing request (design-notes correction platform-foundation BO-085).

  - BO-088: removed listIndexJobs — listIndexJobs (AI index jobs, AI_CONFIGURE) has nothing to do with approval
  analytics (design-notes correction platform-foundation BO-088).

  - BO-365: removed listApprovalRequests; merged into BO-084 — My Approval Inbox duplicated BO-084''s queue with
  its own unbound columns and the same single read; one inbox, and the board tile opens BO-084 (design-notes correction
  platform-foundation BO-365).

  - BO-368: removed evaluateApprovalRequirement; declared getApprovalRequestScore — AI Decision Support used evaluateApprovalRequirement
  (whether approval is required) where the AI context is the request''s score, getApprovalRequestScore (design-notes
  correction platform-foundation BO-368).

  - BO-385: removed listDelegations — listDelegations (GUEST_VIEW) lists who may act for a guest; approval delegation
  is listApprovalDelegations, already declared (design-notes correction platform-foundation BO-385).

  - SUP-001: removed forceLogout, listActiveSessions, revokeAllSessions; declared startSsoAuthorization, completeSsoAuthorization
  — The Venue Management door carried active-session management (listActiveSessions, forceLogout, revokeAllSessions);
  a person signing in has no session yet, and session management belongs to a signed-in security screen. SSO sign-in
  was missing though listSsoProviders is declared: startSsoAuthorization…

  - ADM-001: removed forceLogout, listActiveSessions, revokeAllSessions; declared startSsoAuthorization, completeSsoAuthorization
  — The Console sign-in carried tables of active sessions with Force logout and Revoke all sessions; a person signing
  in has no session and must see none of that. listSsoProviders was declared with no operation that signs in through
  a provider (design-notes correction platform-foundation ADM-001).

  - SCN-001: removed getCurrentShift, resolvePermissions — resolvePermissions (an administration simulator, PERMISSION_VIEW)
  and getCurrentShift (SHIFT_OPEN, a cash shift) were on the scanner sign-in; a steward never calls the first and
  a scanner has no cash shift, so the second showed a missing-permission state at sign-in (design-notes correction
  platform…

  - EMP-002: removed listMfaMethods, listRoles, listSsoProviders — Venue-and-role selection listed roles with listRoles
  (ROLE_MANAGE), which a steward never holds, and tables of MFA methods and SSO providers; the roles to choose from
  come from the login response (availableRoles) and selectRole takes the choice (design-notes correction platform-foundation
  EMP-002).

  - BO-067: removed createApiClient — createApiClient on the tenant''s integrations screen; production clients are
  issued by TICVAI on an approved request and sandbox clients belong to developers (DEV-003), so a tenant creating
  clients bypasses certification (DI-927; design-notes correction platform-foundation BO-067).

  - BO-1073: removed createApiClient — createApiClient on a tenant screen, as BO-067: clients are issued by TICVAI
  or created by developers (DI-927; design-notes correction platform-foundation BO-1073).

  - BO-1173: removed createApiClient, setApiClientStatus — createApiClient and setApiClientStatus on the tenant''s
  wallet integration screen, as BO-067: API clients are issued and suspended in the developer programme, not from
  a wallet screen (DI-927; design-notes correction platform-foundation BO-1173).

  - BO-1069: removed getWorkstationHealth — The only read was getWorkstationHealth, a till''s health score, labelled
  "Platform health"; API, cache and database health are TICVAI''s and a workstation score is not platform health
  (design-notes correction platform-foundation BO-1069). See the CHG-WIR-024 gap.

  - BO-483: removed certifyIntegration — certifyIntegration (DEVELOPER_ADMIN, a TICVAI permission) certifies an
  API integration listing; a tenant cannot hold it and reader-model certification is a different object (DEV-008
  keeps the operation; design-notes correction platform-foundation BO-483). See the CHG-WIR-024 gap.

  - CMS-010: removed appendEntitlementToMedia, getMediaEntitlements — getMediaEntitlements and appendEntitlementToMedia
  (orders) operate on ticket media, a wristband or card carrying entitlements, not on digital assets; the word "media"
  collided (design-notes correction platform-foundation CMS-010).

  - ANL-050: removed setApprovalRetentionPolicy — setApprovalRetentionPolicy on the analytics retention screen;
  approval decision records are not reports, and ADM-346 keeps the operation (design-notes correction platform-foundation
  ANL-050).

  - SGN-016: removed setModuleListing — setModuleListing edits TICVAI''s module catalogue and was offered to a prospect;
  ADM-404 keeps it (design-notes correction platform-foundation SGN-016).

  - SGN-018: removed setTrialConfiguration — setTrialConfiguration sets TICVAI''s trial rules (PLATFORM_PLAN_MANAGE);
  the prospect chooses, TICVAI configures trials on ADM-413 (design-notes correction platform-foundation SGN-018).
  See the CHG-WIR-024 gap.

  - ADM-002: removed getSsoConfig — getSsoConfig (USER_MANAGE) on the platform home; tenant SSO is not platform-home
  content and needs a tenant grant (R098; design-notes correction platform-foundation ADM-002).

  - ADM-003: removed getCrossRegionEntitlement, getWalletAllocation, propagateCrossRegionEntitlement, reconcileRedemptions,
  setWalletAllocationPolicy — propagateCrossRegionEntitlement and reconcileRedemptions are service-audience calls
  between cells (F19) that no operator makes, and getCrossRegionEntitlement, getWalletAllocation and setWalletAllocationPolicy
  (tenant permissions) put tenant data and a region money policy on platform cell health (R0…

  - ADM-006: removed getSsoConfig — getSsoConfig was bulk-attached to every tenant screen of the Console; tenant
  SSO is configured on the Tenant Directory (ADM-005, setSsoConfig) and is not part of the hierarchy (R098; design-notes
  corrections platform-foundation ADM-002, ADM-006).

  - ADM-007: removed getSsoConfig — getSsoConfig was bulk-attached to every tenant screen of the Console; module
  entitlement does not read SSO (R098; design-notes corrections platform-foundation ADM-002, ADM-007).

  - ADM-008: removed createPartnerAgreement, getSsoConfig, listPartnerAgreements, updatePartnerAgreement — Partner
  agreements (list, create, update, PARTNER_MANAGE) are the tenant''s B2B commercial terms and the tenant SSO config
  is tenant identity; neither belongs to TICVAI''s plan catalogue (R098; design-notes correction platform-foundation
  ADM-008).

  - ADM-009: removed getSsoConfig, listTenantCells — Cells and SSO were repeated from the tenant directory; tenant
  billing needs invoices, credit notes and the subscription only (design-notes correction platform-foundation ADM-009).

  - ADM-010: removed getSsoConfig — getSsoConfig was bulk-attached to every tenant screen of the Console; usage
  metering does not read SSO (R098; design-notes corrections platform-foundation ADM-002, ADM-010).

  - ADM-011: removed getSsoConfig — getSsoConfig was bulk-attached to every tenant screen of the Console; licences
  and seats do not read SSO (R098; design-notes corrections platform-foundation ADM-002, ADM-011).

  - ADM-012: removed getSsoConfig — getSsoConfig was bulk-attached to every tenant screen of the Console; cell placement
  does not read SSO (R098; design-notes corrections platform-foundation ADM-002, ADM-012).

  - ADM-015: removed getSsoConfig, listTenantCells — Cells and SSO tables were copied from the tenant directory;
