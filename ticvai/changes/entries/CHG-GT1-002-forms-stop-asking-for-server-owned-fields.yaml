source: audit
kind: spec
summary: '71 generated forms on 47 screens stop asking for a field their operation now marks readOnly (id, scopePath, a
  server-moved status): the field leaves the overlay''s Required/Optional lists and discards.'
decision:
  what: 'tools/applied/gt1-overlays-stop-asking-readonly-14-october.py --apply: each overlay''s generated body loses the
    field and says the server sets it (CHG-SHP-005), and dismiss.discards loses it; line edits, nothing visible (check-approved-ui
    does not compare an overlay''s generated body or discards, and finds 0).'
  by: Chinmay
  date: '2026-10-14'
why: 'Class check-screen-patterns/P1 (CHG-SPF-001): 71 new at the r6 release gate on r6-gate1 (23eb3d98, every r6 batch
  merged and fully derived) against the pinned ''11 finding(s): NP 1, P8 8, READ 2'', 0 after (evidence docs/active/audit-runs/audit-1014/classes.json).
  Caused by CHG-SHP-005 (server-owned fields readOnly on 97 declarations) landing while the screens batches could not edit
  the forms it affected; the 3 October fix (spec-screen-patterns-3-october.py fix_p1) is the pattern followed.'
