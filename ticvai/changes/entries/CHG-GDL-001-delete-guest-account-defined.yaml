status: open
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".


  PREVENTION: tools/check-error-sources.py (registered in run-checks.py) fails a 4xx response whose description names
  a record another module owns (order, entitlement, shift, variant, product, performance, payment, ... each mapped to its
  table; the owner read from handoff/service-decomposition.json) unless the response declares x-ticvai-problem-types
  (E-PROBLEM-TYPE) and the operation has an x-ticvai-read-via to a query that module declares (E-READ-VIA); E-QUERY
  fails a read-via naming an undeclared query or a route it does not serve. Run on the parent commit r5 (1eb1d063: the
  r5 identity, access and orders contracts and lineage restored over this branch) it FAILS with deleteGuestAccount 409
  in both rules ("names entitlement (AccessService), order (OrderService)"); on this branch it PASSES with 160 other
  pre-existing findings baselined in handoff/audit-baseline.json (65 E-PROBLEM-TYPE, 95 E-READ-VIA: among them
  configureWorkstation CR-083, createSaleBoard and updateSaleBoard CR-081, rescheduleOrder, transferOrderTickets,
  modifyOrder, addToWishlist, transitionProductLifecycle, planTenantMigration from the audit''s hidden-refusal list).
  deleteGuestAccount is not baselined. Batch GEN''s check-cross-module-reads covers the lineage side; the two share the
  x-ticvai-queries / x-ticvai-read-via shape of the r6 convention.


  DETAILS CHOSEN (the decision left them open): (1) order.lapsed is a new event (pending -> failed on createPayment,
  held -> voided on the hold timer; states/order.yaml emits it): those were the only ways out of an open order with no
  event, so without it a declined checkout would block the guest''s erasure for ever. Not order.cancelled, which the AI
  reads as a cashier''s void. (2) entitlement.issued gains an optional orderLineId (additive) so a partial refund''s
  lineIds reach only their entitlements. (3) Consumption is not projected (access.validated carries no status): a pass
  used up before its validTo counts as live until validTo, which errs towards refusing. (4) createDsarRequest is not
  declared as x-ticvai-write-via: platform.dsar_request is in the platform schema TenancyService owns in commerce, the
  same deployable as Identity, so check-cross-deployable-writes would call the route stale (X-STALE) and name the wrong
  owner (X-OPERATION); the call is stated in the description and the lineage fixNote. XDW-011 stays for createDsarRequest
  itself (CrossRegion in operations writing the platform schema), now a plain misplaced table; the Identity half is
  closed. (5) estimatedCompletionAt: the package''s response periods are marketing-crm setPrivacyRequestTypes
  deadlines[].responseDays (PrivacyRequest.dueAt); Identity does not read them, so it is always null for now.


  OPEN FOR THE LEAD (14 October, later: the lead decided (a), (b) and the subject_id index in CHG-GDL-003 and deferred
  (d)): (a) a pending order with no payment attempt never leaves pending (states/order.yaml has no
  timer out of pending), so an abandoned checkout blocks the guest''s erasure under the decided rule; (b)
  linkGuestCheckout attaches guest-checkout orders to the account without an event, so those orders and their
  entitlements reach the projection only through later order events; (c) exportSubjectData still reads four marketing.*
  tables (CHG-GDL-002); (d) createDsarRequest takes no requestId although platform.dsar_request.request_id references
  approvals.request: the Block B ticket should add it (additive); (e) check-problem-types now counts 706 (ceiling 707):
  lower CEILING at the merge, with the other batches'' reductions; (f) [DB] the forward migration (derive-ddl:
  identity.subject_holding, its unique index, apply_subject_rls) is written by the gate.


  TICKET SPLIT the lead should make in OpenProject (30654 is started: a comment plus linked delta tickets, never a
  rewrite): (1) now, after access.issueOrderEntitlements exists (it publishes entitlement.issued): the local path, the
  202 with the approvals.request, the 409 with both problem types read from identity.subject_holding, the projection
  consumers and the erasure job''s local tombstone and re-check; (2) Block B, with cross-region createDsarRequest and
  createGuestLink: the fan-out for a linked guest. MODULE TEST: deleteGuestAccount is built by SVC-IDENTITY-GUESTAUTH-1
  in AM-IDENTITY-SECURITY-P01, but its screens WEB-024 and GST-066 sit in AM-MARKETING-CRM-P01/P02, and
  tools/build-service-docs.py (CHG-FXP-006) lists in a module test only the operations its own screens call, so neither
  TEST-AM-IDENTITY-SECURITY-P01 (tasks.csv:118) nor the Marketing module tests list it. tasks.csv is generated, not
  authored, and changing that rule changes every module test: not done here. Recommendation: the delta ticket''s
  done-when names TEST-AM-MARKETING-CRM-P01 (WEB-024) as the module test that exercises deleteGuestAccount''s 202 and
  both 409s.'
