id: CHG-GDL-001
date: '2026-10-14'
source: developer
kind: contract
summary: 'deleteGuestAccount says what blocks it and where Identity reads it: open-orders-remain and live-entitlement-remains
  (409, problem types) answered from a new Identity projection identity.subject_holding fed by the order and entitlement
  events, with the rules declared by their owners (orders#openOrdersForSubject, access#liveEntitlementsForSubject,
  x-ticvai-read-via route projection); requestId is the approvals.request raised through createApprovalRequest; every
  guest is tombstoned locally and only a linked guest calls createDsarRequest. A new check fails a 4xx naming another
  module''s record without problem types and a read-via.'
decision:
  what: 'Part 1: an order blocks when its status is pending, held, partiallyPaid or paid; an entitlement blocks when its
    status is issued or partiallyConsumed and valid_to > now() (the enum values in states/order.yaml and
    states/entitlement-status.yaml / access.entitlement CHECK; unchanged from the decision). The 409 lists problem types
    open-orders-remain (the slug shift.yaml''s closeShift 409 already uses for its open orders) and
    live-entitlement-remains. Identity reads neither orders.sales_order nor access.entitlement: a new never-returned
    schema SubjectHolding persists to identity.subject_holding (subject_id, holding_kind order|entitlement, holding_id,
    order_id, order_line_id, status, valid_to, last_event_at, updated_at; unique (holding_kind, holding_id)), written
    by Identity consumers added to entitlement.issued, .voided, .transferred, .reissued, .statusChanged, order.created,
    .paid, .completed, .cancelled, .refunded and guest.merged, as entitlement.statusChanged already feeds
    identity.membership_history. The owners declare the rules in top-level x-ticvai-queries (access.yaml
    liveEntitlementsForSubject, orders.yaml openOrdersForSubject, served [projection]) and deleteGuestAccount names
    them in x-ticvai-read-via. The erasure job re-checks both conditions when it runs and erases nothing if one holds.
    Part 3: requestId (now required) is the approvals.request id, raised in-process through Approvals''
    createApprovalRequest (ADR-0055 rule 3); no mandatory human approval for the guest''s own request (ADR-0047 section
    7), the tenant matrix may add one; estimatedCompletionAt nullable, null until a response period reaches Identity.
    Part 2: the job tombstones pii.subject (is_erased, erased_at, erasure_request_id = requestId) for every guest and
    calls cross-region createDsarRequest (kind erasure, serviceAuth) only when GuestSession.guestLinkId is set; the
    lineage drops platform.dsar_request and adds identity.subject_holding (read) and approvals.request (write), so
    IdentityService.md (derived from the lineage) follows at the refresh; XDW-011 now names createDsarRequest as the
    only writer.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-084 (ticket 30654, settled at the r6 settlement on 14 October 2026). Evidence: the 409 at
  contracts/spine/identity.yaml (r5) 2601-2603 named no problem type and defined neither "open orders" nor "unexpired
  entitlement"; access.entitlement status and valid_to are 010-access.sql:835,838; order statuses
  states/order.yaml:11-16. Identity is Foundation and "reads nothing above" (ADR-0028:113); Access is another deployable
  (ADR-0055:60, rule 4); the lineage read only cache:idempotency and pii.subject, while ticket 30654''s done-when says
  "reads and writes only the tables its spec lists" (handoff/service-docs/tasks.csv:105). createDsarRequest requires
  guestLinkId (cross-region.yaml:856-859), platform.dsar_request.guest_link_id is NOT NULL, GuestSession.guestLinkId is
  nullable (identity.yaml:7592-7595) and "a guest who never transacts across regions never acquires a link"
  (cross-region.yaml:91), yet the lineage and IdentityService.md:549 listed platform.dsar_request as an unconditional
  write. The tombstone exists (010-pii.sql:28-30, ADR-0047:29-31,166-167) and pii.subject.erasure_request_id references
  approvals.request (910:2034). The projection precedent is events/entitlement-statusChanged.yaml:43,57-58.'
