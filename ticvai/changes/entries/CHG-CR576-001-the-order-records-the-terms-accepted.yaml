id: CHG-CR576-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'checkoutCart takes an optional termsAccepted {kind termsAndConditions, version max 40}; a version that is not
  the termsAndConditions policy in force (white-label#policyRecords, the version listPublishedPolicies returns) is 422
  termsVersionNotCurrent and keeps the cart; a matching one is stored on orders.sales_order (terms_version,
  terms_accepted_at; Order.termsVersion and termsAcceptedAt, read-only) and carried on order.created; omitted, nothing
  is recorded. The order''s termsAccepted chargeback evidence names the order and its terms_version. WEB-012 and GST-009
  send the tick; the Checkout buttons of WEB-010 and GST-041 move on without calling checkoutCart.'
decision:
  what: 'ADAM CR-576, posted on #31898: "Decided (Chinmay, 3 November 2026): option A, with the field optional in the
    contract. The order itself records which terms the guest accepted. Build now: (1) checkoutCart ... takes an optional
    body field termsAccepted: {kind: ''termsAndConditions'', version: string, max 40} ... (2) Storage: two new nullable
    columns on orders.sales_order, terms_version text (max 40) and terms_accepted_at timestamptz ... (3) order.created
    carries termsVersion when it is set (optional). (4) The order''s assembled chargeback evidence item of kind
    termsAccepted refers to the order and its terms_version. (5) WEB-012 and GST-009 ... (6) ... The Checkout buttons on
    WEB-010 and GST-041 move on to the next step without calling checkoutCart ... The buttons look and read the same."
    The lead''s instruction, 3 November 2026: "Dont hold r13. approve them and rever tto the devs", and "start on
    1,2,3".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-576 (Chinmay Patkar, #31898 WEB-012): WEB-012''s T&Cs tick records "the version the consent records", but
  no operation took or stored the accepted terms version.'
keys_touched:
  operations:
  - checkoutCart
  schemas:
  - Order
  - CartProblem
  - Chargeback
  tables:
  - orders.sales_order
  screens:
  - WEB-010
  - WEB-012
  - GST-009
  - GST-041
  other:
