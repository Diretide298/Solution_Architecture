  started:
  - '31893 and 31895 (WEB-010 Shopping Cart build and tests, Chinmay Patkar, Ready for QA): the Checkout button no
    longer calls checkoutCart; it moves on to the guest details (or straight to payment), and the order is made at Pay
    now on WEB-012. The button looks and reads the same.'
  unstarted:
  - '31898 (WEB-012 build, Chinmay Patkar, In progress): its own posted decision.'
  - '31129 (checkoutCart, On hold, Pranay Shinde): the optional termsAccepted field, the 422 and the two order columns.'
  - '28236 (GST-009) and 28238 (GST-041), Chitrangi Mestry, New: as posted.'
  - 'New migration task for the migration owner under the orders migration: orders.sales_order terms_version text
    (max 40) and terms_accepted_at timestamptz, both nullable.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-576
triage: fix-forward
prevention:
