status: open
notes: 'Beyond the posted words: the refusal''s refusedReason is termsVersionNotCurrent and its problem type the
  package''s kebab form terms-version-not-current; the policy in force is read through white-label#policyRecords on the
  service route; GST-041 no longer lists checkoutCart among its operations (its one binding was the Checkout button),
  while WEB-010 keeps it for the transfer journey''s transition (F55). Database change: two nullable columns on
  orders.sales_order (tenant); the release''s forward migration is written by the integration pass.'
