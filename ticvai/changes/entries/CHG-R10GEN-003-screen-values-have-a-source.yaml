  ref: tools/check-screen-value-sources.py
status: open
notes: 'Integration, after the CR lanes land (their screen and contract fixes for the five CRs clear those findings):
  python tools/check-screen-value-sources.py, then bring the remaining findings to the lead grouped by kind with the
  recommended rulings in the lane report. Wire it into tools/run-checks.py beside check-bindings.'
