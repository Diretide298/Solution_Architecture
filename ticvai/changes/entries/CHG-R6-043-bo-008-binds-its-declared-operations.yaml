summary: BO-008 Product Detail & Variants gives a control to the four operations it declared and nothing called
  (listProductVersions, restoreProductVersion, assessProductChange, cloneProduct).
decision:
  what: 'screens/P08-venue-back-office.yaml BO-008: actionBar gains Check the impact (assessProductChange), Clone
    product (cloneProduct) and Restore this version (restoreProductVersion); the second contextPanel gains Versions
    (listProductVersions: ProductVersion version, publishedAt, note, isCurrent) and Change impact
    (ProductChangeImpact entitlementsIssued, ordersAffected, futurePerformances, openCarts, blockedBy); overlays
    formCloneProduct (code, name, includeVariants) and formRestoreProductVersion (note). The apis list is unchanged.'
  by: Chinmay
  date: '2026-10-12'
why: 'N10 of the lead''s list of 12 October 2026, a finding: BO-008 declared the four operations of the VM close-out of
  29 September (versions, restore, change impact, clone) in its apis and no component, form or button called them, so
  a developer had a screen with four calls and no place to make them (the design batch counts them as unbound).'
keys_touched:
