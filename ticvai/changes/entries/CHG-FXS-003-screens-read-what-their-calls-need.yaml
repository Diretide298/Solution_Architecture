id: CHG-FXS-003
date: '2026-10-04'
source: audit
kind: spec
summary: Screens that needed an id or a record no bound operation supplied now bind the read that returns it (or
  the agreed one), and saves that replace a whole record read it first.
decision:
  what: Bind the read that returns the id or record (listMyEntitlements, listPaymentTokens, listProducts, getOrder,
    listShifts, checkoutCart on WEB-012 and others); a setVenueSettings save sends the row it read; guest screens
    read the published tenant config the app shell holds, never getTenantConfig; edges carry the parameter their
    target requires.
  by: Chinmay
  date: '2026-10-04'
why: 'Sprint 1-2 judging of 4 October 2026 (runs/fix-s12/screens.tsv, finding rows: 159 tickets, 73 not buildable;
  shared brief audit/ticvai/apply/FIX-S12-BRIEF.md). Chinmay, 4 October: fix all of it in one round, then one refresh,
  then r1. Operations and fields another agent adds are the names agreed in runs/fix-s12/LEDGER.md (contracts CHG-FXC-003,
  CHG-FXC-010; plan CHG-FXP-004).'
