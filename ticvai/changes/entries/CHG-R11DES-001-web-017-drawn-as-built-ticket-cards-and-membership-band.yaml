id: CHG-R11DES-001
date: '2026-10-29'
source: cr
kind: spec
summary: 'WEB-017 My Account Dashboard is drawn and specified as the guest-web build on #33271: the overview header''s All
  tickets link to My Tickets, upcoming bookings as ticket cards (date stub, venue and product, Shared pill, Date / Time /
  Guests, a tear-off stub with View ticket), a 72rem page, challenge cards (status pill, current of target, reward pill,
  progress bar, hint and end date) and a dark membership band joined to a light perks panel by a curved gold edge. Same
  operations, fields, bindings, errors and states.'
decision:
  what: 'ADAM CR-290 (a design change, settled 29 October 2026 as done, release false, comment false): "WEB-017''s wireframe,
    screen UI and page info are updated to match the build on #33271: the overview''s All tickets link, upcoming bookings as
    ticket cards, the 72rem container, challenge cards and the dark membership band with its perks panel. Nothing changes
    behind the screen, and nothing comes back to build." wireframes/frames/web-017.html: the frame redrawn from the build in
    the board''s format and the guest-web tokens (the prototype capture it held is replaced), with every state, the invitation
    overlay, the two-programme choice and the Arabic mirror. screens/P01 WEB-017: the Upcoming bookings tile is a card list
    with View ticket and All tickets controls, the Loyalty tile is the Membership rewards balance band, the challenge panel is
    a card list (its columns, operations and bindings unchanged); the WEB-018 edge''s trigger is View ticket and a second edge,
    All tickets, carries nothing; purpose, notes and wireframe.prototype (match partial: the look is the board frame since
    CR-290). docs/active/approved-ui-changes.yaml: WEB-017 navigation, region:collection and region:selection, logged as
    CR-290. tools/capture-plans/guest-web-v2.json: WEB-017 is not captured from the prototype, so the drawn frame is not
    overwritten.'
  by: Chinmay
  date: '2026-10-29'
why: 'ADAM CR-290 (Chitrangi Mestry, #33271 WEB-017, 28 October 2026; settlement audit/ticvai/r10/decisions-2026-10-29.json):
  the build differs from the frame and its prototype view (plain booking rows, no header link, plain challenge rows, a lighter
  membership band). The lead''s rule of 28 October 2026 (frontend starter, 28eb978d): a frontend developer changes a screen''s
  design on their own and logs it, and the lead updates the wireframe, the screen''s UI and its page info.'
keys_touched:
  screens:
  - WEB-017
  operations:
  - listMyEntitlements
  - getMyChallenges
  - getLoyaltyPosition
  files:
  - wireframes/frames/web-017.html
  - screens/P01-guest-web-storefront.yaml
  - docs/active/approved-ui-changes.yaml
  - tools/capture-plans/guest-web-v2.json
root_class: a frontend design change logged after the build, brought back into the package's frame and screen record
tickets:
  started:
  - '33271 (WEB-017): nothing comes back to build (CR-290 settled with no comment); its text follows at the next release.'
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-290
triage: fix-forward
prevention:
  type: check
  ref: tools/check-approved-ui.py
status: open
notes: 'Visible change to an approved screen, logged in ADAM as CR-290 (approved-ui-changes.yaml). The build reads the ticket
  cards'' fields (venueName, productName, validFrom, sharedWithSubjectIds) and the challenge cards'' progress (current, target,
  completedAt) from the same responses; the record still binds no columns for the cards and lists only the Challenge columns,
  as before: binding them is not a design change and is left to the lead.'
