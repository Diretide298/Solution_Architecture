id: CHG-CLN-001
date: '2026-10-02'
source: cr
kind: contract
summary: The 13 duplicate first-release setup operations the ADM-049 section merges kept are removed from the catalogue and
  promotions contracts in r2 (BC-008 to BC-020), unbound from their screens and board flows; the venue screens' typed writers
  carry the records.
decision:
  what: 'Retire setPriceListMaster, setRateStructure and createBulkProductCatalogue (catalogue) and setPromotionRule, setCouponPromoCode,
    setBuyGetBogo, setFixedPriceOffer, setGiftFreeProduct, setCrossCategoryPromotion, setEligibilityRule, setBundleDefinition,
    setBundleComponent and setGuestChoiceBuild (promotions) as approved breaking changes tagged r2. Each ADM section screen
    (ADM-049, 051, 121, 148, 159, 169, 172, 173, 174, 179, 180, 181, 199; ADM-210 also declared setPromotionRule) stays the
    anchor of its section and declares no writer; BO-009 (createPriceList, updatePriceList, setPrices), BO-010 (createPromotion,
    updatePromotion, createCouponCampaign, generateCouponCodes), BO-011 (createBundle, updateBundle) and BO-117 (importProductCatalogue,
    commitCatalogueImport) save the records. Additive with it: CreatePriceListRequest and updatePriceList take the price list
    master fields (DM3) setPriceListMaster held; PromotionConditions.eligibilityRuleIds is described as deprecated (nothing
    creates a library rule). The retired request and view schemas stay, marked x-ticvai-retired, because design notes cite
    them; board flows F143, F152, F155..F158 and F160 drop the operations from their steps; the design-note corrections the
    retirement made moot are fixed or withdrawn.'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026: "13 dupes would be gone in r2", answering the plan question CHG-MOV-008 logged (the section
  merges of CHG-MOV-002 kept duplicate writers beside the typed writers because the slice and 13 pushed tickets named them).
  Two writers for one record with two status vocabularies (design-note corrections on ADM-049, ADM-148, ADM-159, ADM-179;
  CHG-CSA-044).'
