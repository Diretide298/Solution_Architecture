  and the list ''Asked as questions instead of defaults''): ''Visit plan add-ons: updateVisitPlan gains addAddOn / removeAddOn
  change kinds; priced at booking.'' CHG-AUD-001 named updateVisitPlan change kinds against the GST-053 add-on.'
