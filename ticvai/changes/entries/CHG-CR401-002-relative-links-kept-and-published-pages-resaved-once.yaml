summary: 'The rich-text link rule keeps relative internal links (a path starting with a single /, never //); http: links
  are removed; https, mailto and tel stay. A one-off job, contentPageResanitise, re-saves every published page''s body through
  the sanitiser once, writing an audit row per page changed; after it, updateContentPage''s 409 published-page-locked on
  a differing cleaned body stands as built.'
decision:
  what: 'ADAM CR-401, the lead''s answer posted on #30923: "Decided (Chinmay, 3 November 2026), answering your question
    on this ticket. CR-401: (1) keep internal links: relative paths starting with a single / (never //) survive; http: links
    are still removed, https, mailto and tel stay. (2) Pages already holding unsafe markup: a one-off re-save cleans every
    published body once, writing an audit row per page changed; after that the 409 on a differing cleaned body stands as
    built." The lead''s answer to the developer''s question, 3 November 2026 ("Go yes"), posted on the ticket with mail
    off.'
  by: Chinmay
