id: CHG-CRD-002
date: '2026-10-14'
source: developer
kind: contract
summary: The PIN rule is the tenant's choice from three drop-downs in its password policy (pinLength 4/6/8, pinReusePrevention
  none/last3/last5, pinLockoutAfterAttempts 3/5/10); ADM-342 and ADM-422 render them as drop-downs, and the PIN keypads
  (POS-000, EMP-001, SCN-001, the supervisor step-up) take the length from the policy through WorkstationContext.pinLength.
decision:
  what: 'identity.yaml PasswordPolicy gains pinLength (integer enum [4, 6, 8], default 4), pinReusePrevention (enum [none,
    last3, last5], default last5) and pinLockoutAfterAttempts (integer enum [3, 5, 10], default 5); getPasswordPolicy and
    setPasswordPolicy carry them; the R126 floor rules apply to passwords only. WorkstationContext.pinLength carries the
    tenant''s length to a device; common.yaml SupervisorStepUp.credential says its length is the policy''s. Screens: P08
    ADM-342 and P09 ADM-422 get three selectField drop-downs bound to the new fields; POS-000 (and its New PIN step), POS-001''s
    open-shift precondition, EMP-001, SCN-001 take the length from the policy; the password doors (ADM-001, PTR-001, SUP-001)
    show the new credential step on LoginResponse.mustChangeCredential. derive-schema: an enum property carrying x-ticvai-persistence-column
    is typed by it (integer); derive-ddl: an integer enum gets its CHECK.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-078 (ticket 27750): PasswordPolicy.minLength default 12, floor 8 (identity.yaml:7702-7703; R126 (7)) while
  POS-000 draws a 4-digit keypad; R132 asked reuse prevention for passwords and the screens extended it to PINs (EMP-001,
  POS-000). Lead''s decision, Chinmay, 14 October 2026: "Give those as options that they select as a drop down. update the
  wireframe settings".'
