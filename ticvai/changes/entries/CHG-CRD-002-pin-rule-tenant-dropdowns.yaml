notes: 'Defaults chosen as the package''s most consistent options: pinLength 4 (the client-approved POS prototype), pinReusePrevention
  last5 (what the sign-in screens promised), pinLockoutAfterAttempts 5 (R126 (6) five wrong codes). Only the two new integer
  enums carry x-ticvai-persistence-column, so the older integer enums (UrlRedirect.statusCode, AdmissionRule.formatVersion)
  keep their text columns. The Claude Design sources (ticvai/design-r1, gitignored) were updated in the main checkout and
  are not committed. Verified with derive-schema and derive-ddl --apply in the worktree (generated tables read in V0104
  and handoff/migration-review.md, then restored): the new columns are additive in the next forward migration; NOT NULL
  on new columns and the nullability changes on existing ones are listed in migration-review.md for the lead''s gate. Released
  outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: ''Release today as an exception''.'
