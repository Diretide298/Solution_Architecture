id: CHG-MOD-001
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every lineage read of another module''s table goes through a query the owning module declares: 147 data-read
  queries (one per owned table, `<table>Records` in x-ticvai-queries) asked by 499 operations through
  x-ticvai-read-via, in process within one deployable and by the owner''s service route across deployables.'
decision:
  what: 'For each table another module reads raw, the owning module''s contract (the one that persists the table)
    declares one query in its top-level x-ticvai-queries: `<table>Records: {module, table, inputs: {ids, where},
    returns: the rows as the owner''s persisted schema, rule, served}`. Its rule says it is a data read, not a rule
    question: the owner returns its rows as stored and as the caller''s scope lets it see them, and decides nothing;
    a question with a rule of its own keeps (or gets) a query of its own. Each reading operation names the query in
    x-ticvai-read-via, one entry per table it reads, route `in-process` when reader and owner share a deployable
    (handoff/service-decomposition.json) and `service` across deployables; `served` lists exactly the routes its
    askers take. derive-lineage copies the routes into the lineage as readVia.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026 (audit/ticvai/runs/audit-1014/classes.json): class check-cross-module-reads/XR-UNCOVERED,
  921 findings touching 758 Block A tickets (341 due by 28 October). ADR-0055 rule 2 as amended 14 October
  (CHG-GEN-009): another module''s table is read through the owner''s declared query, or a view named for the reader
  within one deployable; across deployables never by shared SQL (rule 4). Default ruling (lead, 14 October: "go with
  your recommendation"): route each read through the owner''s declared query, grouped by owner module so one query
  serves many readers. Count before 921, after 6: 914 routed here; of the 7 Identity reads above the foundation tier
  (routed by CHG-MOD-002, not here) one is fixed and six are kept for the lead, listed in CHG-MOD-002.'
