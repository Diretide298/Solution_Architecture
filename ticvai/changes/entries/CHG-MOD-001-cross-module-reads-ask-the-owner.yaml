status: open
notes: 'Batch MOD, 14 October 2026. Detail the ruling left open, taken as the option most consistent with ADR-0055:
  one data-read query per owned table rather than per (reader, owner) pair, because a query belongs to its owner and
  one declaration then serves every reader of that table; the generated views (DB-READ-VIEWS) were not used for the
  in-deployable reads, because a view needs a lineage rewrite of the reads and gives the owner no say in what is
  read, while the query keeps the lineage read and adds the route. A data-read query states no rule: the refusals
  that rest on another module''s data keep their own rule queries (CHG-MOD-003). Verified: derive-lineage --apply
  gave 499 entries their readVia; check-cross-module-reads XR-UNCOVERED 921 -> 6 (0 new), XR-QUERY, XR-ROUTE and
  XR-LINEAGE 0; check-contract-shapes, check-contract-compat and check-lineage 0 new. Derived files restored before
  the commit.'
