notes: The decision makes option A conditional on the repository having been created on purpose, and builds nothing in P10
  until the lead confirms; the mapping is marked assumed and the confirmation is raised for the lead. Moving P10 out of
  ticvai-control moved 137 counted findings from that app to partner-web with nothing added; check-binding-ratchet read
  it as a rise, so it now follows each screen's app at the baseline (read from the baseline commit's platform files), as
  it follows blocks (CHG-GT1-006). The setup file ships in ADAM's setup zip.
