id: CHG-R10UI-010
date: '2026-10-25'
source: cr
kind: spec
summary: 'P10 Partner Web is its own app in the ticvai-partner-web repository: docs/active/frontend-repos.yaml maps it (assumed
  until the lead confirms), every P10 component path is src/routes/<area>/<Component>.tsx (apply-repo-layout), appStatus
  is scaffolded, targetApp is partner-web (overriding the shared TICVAI Control app of 10 September, which P09, P11, P14
  and P17 keep), and ADAM setup''s frontend table lists P10. check-binding-ratchet compares a screen whose platform changed
  app under the app it was counted in.'
decision:
  what: 'ADAM CR-153, accepted for the next release: "Option A is recommended if ticvai-partner-web was created on purpose:
    P10 is its own app there ... The next release gives P10 its repository entry. The ticket text then gives every P10 screen
    as src/routes/<area>/<Component>.tsx (the apps/partner-web/ prefix goes), the platform''s appStatus becomes scaffolded,
    and the frontend workspace''s table lists P10." docs/active/frontend-repos.yaml P10 (repo ticvai-partner-web, assumed:
    true, observed as relayed in the CR); screens/P10 platform (appStatus, targetApp) and its 43 component paths (tools/apply-repo-layout.py);
    screens/P09, P11, P14 and P17 targetApp siblings; viewer/mcp/setup/starters/frontend/CLAUDE.md (the platform table and
    the generated profile block); tools/check-binding-ratchet.py (apps followed).'
  by: Chinmay
  date: '2026-10-21'
why: ADAM CR-153 (Chitrangi Mestry, 16 October 2026, scaffolding ticvai-partner-web). All 43 P10 screens named the retired
  Nx path apps/partner-web/..., the platform said not scaffolded, targetApp said ticvai-control, and the setup table told
  developers to ask before building P10 anywhere.
