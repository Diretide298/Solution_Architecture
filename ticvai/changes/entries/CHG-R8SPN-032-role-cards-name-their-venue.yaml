summary: 'The venue is chosen with the role. RoleSummary gains grantId and scope, so a role held at two venues shows two
  cards each naming its venue; selectRole takes grantId (required, 422 grant-required, when the role is held at
  several venues; roleId alone still works for one) and sets the session''s venue from the grant''s scope;
  Session.availableRoles (not stored) lets EMP-002 list the cards on a cold open via getCurrentSession. Additive.'
