id: CHG-SPF-002
date: '2026-10-03'
source: audit
kind: spec
summary: 'Lists and panels show the fields the screen is about: at most five on a phone or handheld, plumbing and
  foreign ids out, generated dumps narrowed; the ''Columns are every field'' apisNote is gone.'
decision:
  what: 'Narrow every unfiltered list and panel with one rule (screen_patterns.pick_columns: names, states, money
    and dates first, a field the screen''s notes name kept, plumbing and foreign ids and, on guest screens, staff
    fields out), and make the generator use it.'
  by: Chinmay
  date: '2026-10-03'
why: 'Block A audit on live r2, 3 October (CHG-AUD-001, finding batches judge-log, judge-a-mid, judge-d-mid): EMP-026
  showed 12 columns of an incident on a phone and its panels 16 fields; the generator''s apisNote admitted ''Columns
  are every field the response schema declares''. Chinmay, 3 October: fix the specs now, refresh, cut r1 of a fresh
  start.'
