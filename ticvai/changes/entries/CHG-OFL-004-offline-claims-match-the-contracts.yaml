kind: contract
summary: 'Offline states promising queued writes now have an offline-capable write behind them: requestShiftSwap,
  acknowledgeAlert, createStockTransfer and receiveStockTransfer become offline-capable (with updateIncident and
  recordAuthorityNotification from CHG-OFL-002); two screens'' unapproved spec prose (EMP-041, EMP-070) is corrected;
  and S-OFFLINE-CLAIM reads a text that also refuses as a refusal.'
decision:
  what: 'Contract side first, as the lead ruled for the client-approved screens: the writes behind EMP-023 (Queues
    locally), EMP-061 and EMP-064 (Works from cache and queues what it records) become offline-capable, keeping their
    Idempotency-Key and conflict policy. EMP-041 and EMP-070 have offline text no approved frame shows, so it is
    rewritten to the contract. check-screen-wiring S-OFFLINE-CLAIM, like S-OFFLINE-QUEUED, no longer counts an
    offline state that refuses ("Nothing here is offered offline ... queued and never sent is worse") as a promise:
    WEB-024, GST-066, GST-067, GST-069 and GST-073 were refusals the keyword reading took for promises, and POS-000''s
    text carries "cannot open".'
  by: Chinmay
  date: '2026-10-14'
