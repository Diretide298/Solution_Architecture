id: CHG-R6G-001
date: '2026-10-14'
source: audit
kind: process
summary: 'A pushed forward migration every table of which the first release now needs keeps its key: approvals.escalation
  stays on VM-MIG-APPROVALS (#27826, V1005), moved into the first release, instead of joining MIG-APPROVALS and
  leaving the pushed ticket out of the plan; the key-stability self-tests judge only what their own edit causes.'
decision:
  what: 'tools/build-service-docs.py (fwd_kept, beside the first-release migrations): a pushed VM-MIG-<S> or MIG-<S>-<n>
    whose pushed tables are all now read or written by the first release, and none of them pushed under MIG-<S>, is
    one task under its pushed key in the MIG epic (phase 1, after MIG-<S> and the migrations its keys point into),
    keeps its planned file (V1005__approvals.sql) and is what the slice operations writing the table wait on. A pushed
    migration only part of whose tables are needed is left as before. tools/check-key-stability.py: the three
    "passes" self-tests subtract the findings today''s unedited plan already has, so a real finding is reported once,
    by the check, not again as three failed tests.'
  by: Chinmay
  date: '2026-10-14'
why: 'First full r6 gate (14 October 2026, run 20261014-144320-609): check-key-stability failed, "#27826 VM-MIG-APPROVALS
  left the plan, and its work approvals.escalation is now under MIG-APPROVALS: keep VM-MIG-APPROVALS for that work
  (moves are metadata)", and three self-tests failed with the same text. CHG-CRD-006 (ADAM CR-078) made
  ApprovalRequest.escalations[] persist to approvals.escalation, so createApprovalRequest, resubmitApprovalRequest and
  reopenApprovalRequest (first release) write it, and the first-release migration grouping put it into MIG-APPROVALS
  (V0010, the frozen r1 file). Lead''s decision: a pushed key is never renamed; keep VM-MIG-APPROVALS for that work.
  The self-tests compared check() on an edited plan with no errors at all, so any live finding failed them.'
