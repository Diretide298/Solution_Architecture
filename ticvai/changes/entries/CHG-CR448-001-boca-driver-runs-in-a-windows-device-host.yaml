summary: 'On Windows kiosks and tills a small .NET device host runs beside the BOCA printer, composing #35592''s driver
  (ticketPrinter port, FGL encoder, raw TCP 9100, status mapper); the kiosk and POS apps call it on localhost. Android waits
  on the client''s answer on how the printer connects. Recorded as an ADR-0015 amendment and in the integration register.'
decision:
  what: 'Posted on #35592 (Chinmay, 1 November 2026), under the lead''s "Approve all" (1 November 2026): "as you recommended.
    On Windows kiosks and tills a small .NET device host runs beside the printer, composing the existing driver (ticketPrinter
    port, FGL encoder, raw TCP 9100, status mapper); the kiosk and POS apps call it on localhost. Android is decided once
    the client answers how the printer connects (TCP, USB or serial) ... until then build and test the Windows host. #35592
    comes off hold for the Windows path."'
  by: Chinmay
  date: '2026-11-01'
why: 'ADAM CR-448 (Hrushikant Patkar, #35592, blocking): ''in the device app'' named no process, and the kiosk and POS apps
  are TypeScript and cannot load the .NET driver; ADR-0015.'
