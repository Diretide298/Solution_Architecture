notes: 'check-screen-wiring gains S-STAFF-AUDIENCE (a staff screen calling a guest-, device-, service- or partner-only
  operation) beside the existing S-DUP-SCREEN and S-CONSUMED-MIRROR rules, and check-screens keeps its R254 attachment
  warnings; check-flows rule 3 holds every repointed flow step to its screen. Tickets: none started (Block A starts
  Monday 5 October 2026); unstarted keys are every tasks.csv or pushed key naming a touched screen. Per screen and
  flow:

  - BO-062: removed listDeliveryLocations, listDiningOutlets — listDiningOutlets and listDeliveryLocations are guest-audience
  reads with no permission; a staff screen calling them bypasses the staff permission model, as corrected on BO-065
  and EMP-030 (design-notes corrections fnb-retail BO-065, EMP-030; R254).

  - BO-028: removed createRefundRequest; declared approveRefund — The Refund Approval Queue''s only operation was
  createRefundRequest, the guest''s own refund request (guest audience, no permission); a staff approval queue approves
  refunds held for approval (approveRefund, which came off BO-004 in CHG-WIR-001). Guest-only operations on staff
  screens are wrong wirin…

  - ADM-199: removed setResaleEligibilityRule — The promotion Eligibility Rule Builder also wrote setResaleEligibilityRule
  (which tickets may enter resale, ORDER_CREATE); resale eligibility is a different concept and is written on its
  own screen, ADM-279 Resale Eligibility Rule Configuration (design-notes correction ticketing-backoffice ADM-199).

  - ADM-279: removed setEligibilityRule — The Resale Eligibility Rule Configuration also wrote setEligibilityRule,
  the promotion eligibility rule; promotion eligibility is a different concept and is written on ADM-199 Eligibility
  Rule Builder (design-notes correction ticketing-backoffice ADM-279).

  - ADM-610: removed createRefundRequest; declared createRefund — The staff refund workspace raised refunds with
  createRefundRequest, the guest app''s own request (guest audience, no permission; the order must belong to the
  caller); staff refunds go through createRefund (ORDER_REFUND), which checks the refund policy the screen already
  reads (design-notes correctio…

  - ADM-157: removed setRuleTestRecommendation; declared evaluatePromotions, simulatePromotion — setRuleTestRecommendation
  was a PUT for a test that took its inputs as strings; evaluatePromotions already evaluates a basket and returns
  the working (which rules matched and why), and simulatePromotion replays a promotion against real history for
  the exposure and revenue the purpose asks for (desi…

  - ADM-141: declared publishPromotion, pausePromotion, endPromotion, unschedulePromotion — A status manager that
  could not change status: the lifecycle moves exist (publishPromotion, pausePromotion, endPromotion, unschedulePromotion)
  and were not declared (design-notes correction ticketing-backoffice ADM-141).

  - ADM-132: declared requestPricingRollback — The rollback screen listed rollbacks but could not start one; requestPricingRollback
  writes the rollback record and handles subject product as well as pricing (design-notes correction ticketing-backoffice
  ADM-132).

  - ADM-272: declared setChannelAllocations — Rebalancing had no write on the screen that exists to rebalance; setChannelAllocations
  is the allocation writer (BO-013 uses it) (design-notes correction ticketing-backoffice ADM-272).

  - ADM-160: declared generateCouponCodes, getCouponCodeBatch — A code generation and batch manager that only read;
  generateCouponCodes generates codes in bulk and getCouponCodeBatch reports a batch''s progress and export (design-notes
  correction ticketing-backoffice ADM-160).

  - ADM-226: declared setPromotionVariants — An A/B test manager that only read; setPromotionVariants splits traffic
  between two versions of a promotion (design-notes correction ticketing-backoffice ADM-226).

  - ADM-647: declared updateRecommendationStrategy — The recommendation policy screen read the strategies and could
  not change them; a strategy carries its guardrails and the AI authority over it, and updateRecommendationStrategy
  is its writer (design-notes correction ticketing-backoffice ADM-647).

  - ADM-670: declared updateRecommendationStrategy — The journey and touchpoint designer read the strategies and
  could not change them; placements are part of the strategy, and updateRecommendationStrategy is its writer (design-notes
  correction ticketing-backoffice ADM-670).

  - ADM-177: declared evaluatePromotions, simulatePromotion — The offer simulator was a GET list with no input,
  so a basket could not be sent; evaluatePromotions tests a basket and returns the working, simulatePromotion replays
  history (design-notes correction ticketing-backoffice ADM-177).

  - ADM-083: declared listApprovalMatrices — The screen declared only approvePricingWorkflowAuthority and opened
  as an empty form where a configuration exists (PR-9); listApprovalMatrices is the existing read of the same record
  (design-notes correction ticketing-backoffice ADM-083).

