id: CHG-WIR-025
date: '2026-10-02'
source: audit
kind: spec
summary: 'ticketing-backoffice: 223 screens rewired — 66 operations taken off screens they do not belong on (bulk-attached,
  another module''s, guest-, device- or service-only on staff screens, writes on read-only lists), 226 existing
  operations declared where the screen needed them; 8 flows repointed to match.'
decision:
  what: 'Fix the wrong wiring now: take each listed operation off the screen it does not belong on, declare the
    existing operation the screen needs instead, merge the duplicate screens into the one kept, and repoint the
    flow steps that called them.'
  by: Chinmay
  date: '2026-10-02'
  quote: 'Chinmay, 2 Oct 2026: fix the wrong wiring now'
why: 'Process-agent design-note corrections for ticketing-backoffice (handoff/design-notes/ticketing-backoffice.yaml,
  1-2 October 2026) found these screens wired by the 18 August bulk attach, by name resemblance or from the wrong
  contract, against the adopted audit decision R254 (re-derive each screen''s operations from its purpose and journeys)
  and R276 (duplicate screens). Each screen''s reason and source is below and on the screen itself (gaps with removed:
  true).'
