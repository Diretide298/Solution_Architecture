summary: 'approveRoleAuthorityDelegation: delegator, delegate, requiredRole and venue are uuids and requestKind an ApprovalKind
  (else the shared 400 validation naming the field, beside invalid-window and delegate-is-delegator); scope_path is always
  the caller''s venue path (scope, region and department display only); authorityAmount is in the venue''s currency and scale
  from platform.venue_settings; the 200 is filled from the row written, with the echoed and left-out fields named; the MFA
  step-up goes through Identity''s in-process step-up check (CR-509).'
decision:
  what: 'Posted on #30847 (Chinmay, 3 November 2026), under the lead''s "Close the CRs and respond to devs" and "get the NEw
    CRs in the r13" (3 November 2026): "option A for ids, kinds, money and the response; the delegation''s scope is always
    the caller''s venue ... venue is optional; when sent it must be that venue''s id ... requestKind must be an ApprovalKind
    value ... delegator, delegate and requiredRole must be uuids ... This 400 is the shared validation problem with errors[]
    and no refusedReason ... authorityAmount is in the venue''s money: read currencyCode and currencyScale from the venue''s
    settings row (platform.venue_settings) ... The MFA step-up is checked and consumed through Identity''s in-process step-up
    check decided on #30846"'
  by: Chinmay
  date: '2026-11-03'
