triage: blocker
prevention:
  type: check
  ref: tools/check-r1-additions.py
status: open
notes: 'R1-BLIND-CLOSE is general: across every flow, a step that submits a count says it is blind, a step that accepts,
  rejects, closes or reopens a shift names the supervisor, and no step or branch shows a cashier or a steward the expected
  figure. On the parent commit it finds 3 findings in F32 and R1-F32 finds 7; after, both pass. The witness PIN on a
  deposit-box withdrawal (CHG-RUL-019) stays: it is a cash control, not one of the four shift acts. check-flows reports two
  more navigation warnings (POS-007 to POS-000 and POS-025 to BO-024 are not edges yet); the refresh adopts flow steps as
  transitions (derive-transitions-from-flows).'
