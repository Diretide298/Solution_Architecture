source: cr
kind: contract
summary: 'createApiClient and revokeApiCredential follow public-api''s caller kinds (CR-536), never DEVELOPER_ADMIN:
  the member row is read again on every partner request (401 inactive, 403 readOnly, nothing written). createApiClient:
  TICVAI staff any account and environment (production issuedBy ticvai); a partner its own verified account, sandbox only,
  issuedBy partner, production 409 certification-required; tenant staff (BO-1177) sandbox only on a verified account,
  allowedTenantIds set to the caller''s tenant alone, issuedBy partner. revokeApiCredential: staff any client, a partner
  its own (another''s 404), tenant staff 403. Both declare the control.developer_member read and the 401 and 403.'
decision:
  what: 'Posted on #31295 (Chinmay, 3 November 2026), under the lead''s "Dont hold r13. approve them and rever tto the devs" of 3 November 2026: "createApiClient and revokeApiCredential follow the
    caller kinds already in public-api.yaml ... (1) Caller kind comes from the token, never from a permission ...
    DEVELOPER_ADMIN marks nothing here. (2) Every partner request reads the caller''s control.developer_member row again:
    if it is no longer active, answer 401; role readOnly is 403 on both operations ... (3) createApiClient ... Tenant
    staff (BO-1177): sandbox clients only ... allowedTenantIds is set to the caller''s tenant alone ... (4)
    revokeApiCredential ... Tenant staff: 403 ... (5) Declare the read of control.developer_member ... and add the 401
    and 403 responses."'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-569 (#31295 createApiClient): the partner rule keyed on a signed-in email no session carried and nothing
  told TICVAI staff from tenant staff; CR-536 (CHG-CR536-001) settled the caller kinds for four other operations, and
  BO-1177, a tenant screen, binds createApiClient.'
