id: CHG-R14G-004
date: '2026-11-03'
source: audit
kind: spec
summary: offline-core's outbox gave concurrent enqueues one sequence (an UPDATE then a SELECT outside a transaction, no UNIQUE),
  and after a transient failure stranded the rest of the batch inFlight while later entries (a void) overtook them, with the
  state still "online, no error". Now the sequence is allocated and the entry inserted in one exclusive transaction with UNIQUE(sequence);
  only the entry being sent is inFlight; a transient failure halts the drain with the rest pending behind it (mode halted,
  stoppedAtSequence); each drain first recovers what a crash left inFlight; the orchestrator reads conflictPolicy and calls
  an onServerWins hook so the client re-reads (ADR-0022); synced_at is the server's time from the answer (null when the answer
  has none), the device's time kept apart as device_acked_at. 15 new vitest tests (concurrent enqueue, the TEST2 order, no
  stranding, crash recovery, 408/429, permanent rejection, serverWins) fail against the old code; --passWithNoTests is gone
  from offline-core and api-client.
decision:
  what: 'Review findings G-04 (HIGH) = D-05 (HIGH): allocate and insert in one transaction with UNIQUE(sequence), mark only
    the entry being sent inFlight, and test both cases; D-05''s synced_at point. The lead, 3 November 2026, after reading
    the r13 system review triage: "All four, one release" (the starters, device/guest/token access, gate integrity, tenant
    setup and stale docs go into r14, released together).'
  by: Chinmay
  date: '2026-11-03'
why: r13 system review G-04 (findings/G-starters.md, G-work/offline/harness.ts) and D-05 (findings/D-code-scaffolds.md); ADR-0013;
  ADR-0022.
