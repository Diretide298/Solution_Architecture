    devs": "certifyIntegration keeps its words on the listing, certifying always sets an expiry, and the state model
    follows the contract ... 1. Storage: a forward migration adds control.integration_listing.review_notes text, at most
    1000 characters ... 3. reject without notes ... is 422 with problem type reason-required ... 4. certify without
    certifiedUntil ... is 422 with problem type certified-until-required ... The state model gains submitted to certified
    and submitted to rejected"; corrected by the lead''s "Go yes" of 3 November 2026, answering the developers'' questions: "notes over 1000 characters answer 400 validation (the shared type),
    not 422."'
  by: Chinmay
  date: '2026-11-03'
