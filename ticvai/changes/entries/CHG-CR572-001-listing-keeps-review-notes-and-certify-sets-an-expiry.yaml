kind: contract
summary: 'certifyIntegration keeps its words on the listing: control.integration_listing.review_notes (IntegrationListing.
  reviewNotes, nullable, readOnly, at most 1000) set by every decision to the notes sent or null; notes over 1000 are 400
  validation (the shared type). reject without notes is 422 reason-required; certify without a certifiedUntil after today
  is 422 certified-until-required; certify sets certified_until, reject and revoke leave it. certify and reject from
  submitted or inReview, never writing inReview; the state model gains submitted to certified and submitted to rejected.'
