status: open
notes: 'Batch R3 (branch r3-aws, from r2 = 9cce86a0), 4 October 2026. clouds_agree() stops the build if the AWS LLD
  loses a box or a line of the Azure one, a cost group is missing on any AWS sheet, an Azure service type is not
  mapped, an AWS line has no price and does not say why, or the AWS DR box stops saying open with no DR decision
  recorded. Resolves the AWS GPU price CHG-R11-001 and CHG-R11-003 left open. Open for Chinmay and the client: DR on
  AWS (A, B or C); g6 capacity per AZ; the prices to confirm in the AWS LLD. No Block A task builds an AWS Terraform
  cell module (a plan change if one is added). Close on the commit that merges it.'
