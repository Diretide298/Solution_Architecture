id: CHG-SHP-002
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every cursor-paged list states its order by a field of its items: a "**Order.**" paragraph appended to the
  description, createdAt descending then id where nothing else was said (the generator default of the ruling; the
  package has no list generator, so the default is written once by tools/applied/shp-contract-shapes-14-october/ and
  held by the check).'
decision:
  what: 'contracts/*: 403 list operations get "**Order.** ..." in their description. Field chosen in this order: a
    creation/occurrence time (createdAt first) descending; else a schedule/validity date ascending; else a sort key or
    name ascending; else the item key (a UUIDv7) descending; then the item key as tiebreak. 16 lists whose description
    already stated an order without a field (position order, oldest pending first, by expiry, by next due date ...)
    state that order with its field instead; 8 lists with no key or time got a field by hand.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026, class check-contract-shapes/C-PAGED-ORDER (evidence
  docs/active/audit-runs/audit-1014/classes.json): 403 members before, 0 after on this branch (CHG-SHP; ruling "go with
  your recommendation", Chinmay, 14 October 2026). R154. Where a description said "newest first" the field is the one
  the items carry. Lead to confirm the defaults on reports-style lists (117 had no time field and are ordered by their
  key).'
