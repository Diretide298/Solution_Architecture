notes: 'check-plan-closure C-BOUND fails on the plan of 3044d8b0 (215 bindings on 77 setup screens built later) and passes
  after it. checks/baseline.json re-recorded: the plan moved staff-app screens between Blocks C and D and design_spec now
  attributes VM, four-digit and rest-of-the-screen tasks to their blocks (CHG-RONEP-005); every app and kind total is
  unchanged (venue-management unbound-control 4,824, unknown-field 1; venue-staff-mobile 42). Levers for Chinmay, not
  applied: a read that does not pull its own service''s writers into Block A (as across services) would take about 370
  points out of Block A but move about 120 artefacts r2 built in Block A to later blocks; leaving the rest of the setup
  screens in their later blocks would take 254 front-end points out but leave Block A screens with buttons nobody wires.'
