notes: 'The plan has no task under a task or sub-task, so the ticket the verdict names is recorded in the task''s text;
  its OpenProject parent is the app-module the plan places it in. The table is new, so this task is its migration (a -DB
  key: its `table` build counts as created by it, CHG-R8MIG-016, and the plan plans no second migration for it). The table
  comes into the contracts with the CR''s build lane; until that merges, this tree''s check-ticket-builds cannot resolve
  its `table` build. Generator rule (tools/build-service-docs.py, the forward-migration waits): every later forward migration
  of a schema waited on the schema''s earlier migrations, a hand-written [DB] task''s included, so this task made every
  later catalogue forward migration, and the catalogue back end behind them, wait for it; Block A1''s overtime went from
  35 to 109 hours and the plan moved Venue Management''s completion work into A2 (check-plan-closure: 60 findings). A hand-written
  [DB] task with no ticket yet is now waited on by a forward migration only where a key of that migration points into its
  tables; a ticketed one (PRD-W1-DB) keeps its waits as pushed. CR379-GUEST-BROADCAST-DB (workforce) is under the same rule.'
