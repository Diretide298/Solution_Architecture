summary: 'login''s 401 unauthenticated carries attemptsRemaining on every answer, counted per submitted username whether
  or not a principal has it; the lock stays 429 credential-locked with Retry-After; login''s 409 says since when and on
  what (SessionHeldProblem); verifyMfaChallenge''s 422 carries attemptsRemaining. All additive; the client-approved
  PTR-001 is bound to the new fields and does not change.'
decision:
  what: 'ADAM CR-170, option D, decided by Chinmay Parab on 19 October 2026 with the client-approved PTR-001
    unchanged. contracts/spine/identity.yaml: LoginDeniedProblem (allOf Problem, attemptsRemaining) on login''s 401,
    SessionHeldProblem (allOf Problem, openedAt, deviceLabel) on its 409, MfaCodeInvalidProblem (allOf Problem,
    attemptsRemaining) on verifyMfaChallenge''s 422; the 401 and 429 texts say an unknown username has its own counter
    and lock, so nothing reveals which usernames exist. screens/P10-partner-reseller-portal.yaml PTR-001: the Sign in
    button''s notes and verifyMfaChallenge''s purpose bind the denied and sessionHeld states to the new fields (notes and
    purposes are not visible content).'
  by: Chinmay
  date: '2026-10-19'
why: 'ADAM CR-170 (Surendra, #27785, PTR-001 login), answered 19 October 2026: the approved denied and sessionHeld
  states promise attempts left and where and since when, and the contract carried neither.'
