  can be of kind reopen; the visit planner''s pace can be balanced; a link target can be a booking flow; the
  cabanaBySize booking flow type is gone. All move together at r8. DEV-001''s no-access wording, which the public API
  reads made untrue, is a known gate failure until the client approves its new text.'
