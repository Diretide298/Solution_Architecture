summary: The platform tasks CHG-R5-003 moved off Hrushikant Patkar go to Pranay Shinde; the setup tasks are split
  (Hrushikant keeps the infrastructure, Pranay takes auth, clients, database and seed); Hrushikant never tests a
  module, by rule; Pranay's load is rebalanced so Block A keeps its dates.
decision:
  what: 'docs/active/block-a-extra-tasks.json `ownerMoves`: ARCH-TESTS, OBS-TENANT-POOL, PLATFORM-IDEMPOTENCY,
    PLATFORM-KERNEL, KERNEL-ID, KERNEL-TENANT-LIMITS, PLATFORM-AUDIT, PLATFORM-MIGRATE, PLATFORM-OBSERVE and
    PLATFORM-OUTBOX go to Pranay Shinde (were Pallavi Sawant and Tanmay Dukhande in CHG-R5-003); SETUP-AUTH,
    SETUP-CLIENTS, SETUP-DB and SETUP-SEED move from Hrushikant to Pranay, and Hrushikant keeps SETUP-ENV, SETUP-CI,
    SETUP-HOSTS, SETUP-OBS and SETUP-QDRANT (the SETUP-ONBOARD-* tasks stay with each person). docs/active/team.json
    gains `neverTests: [Hrushikant Patkar]` (tools/sprint_plan.py never_testers): tools/build-service-docs.py gives a
    module test such a person holds, pushed or not, to a peer in its stack who is not its app-module''s main builder
    (CHG-R4-005), the one of its builders (else of its stack) with the fewest module-test points so far, and
    tools/derive-block-a-schedule.py drops that pin. Two kiosk tasks leave Pallavi Sawant, who carries most of
    CHG-R5-003''s moves, so Block A2 is not held: TEST-AM-WHITE-LABEL-KIOSK to Deep Khanvilkar and VM-FE-ADM-582-KIOSK
    to Chitrangi Mestry (front end, web). moduleTestPeers gains TEST-AM-FOUNDATION-PLATFORM (Pranay
    became the main builder of AM-FOUNDATION-PLATFORM). The rebalance (the same search as CHG-R5-003: fewest pushed
    tickets moved, nothing the r2 schedule started by 7 October, back end only, helpers within their caps) moves
    SVC-ORDER-ORDER-4 from Pranay to Tanmay Dukhande and re-picks the recipients of CHG-R5-003''s other moves (the
    full list, from and to, is `ownerMoves`). check-plan-owners gains O-NO-CHECKER (a module test owned by someone in
    neverTests, plan or schedule).'
  by: Chinmay
  date: '2026-10-07'
why: 'Chinmay, 7 October 2026, relayed by the lead after CHG-R5-003 (ce9c95a7): "No that should go to pranay." (the
