id: CHG-TBF-004
date: '2026-10-03'
source: audit
kind: spec
summary: Where the documents and ADAM show the tenant-root row-level policy (tenant_isolation) on a table with no
  tenant_id, they now say it is by design (one tenant per database); the DDL is unchanged.
decision:
  what: 'backend/MIGRATIONS.md gains "Tenant-level row-level security"; the generated MIGRATIONS.md and the first-release
    workbook show each table''s actual policy from 920-row-level-security.sql (scope_path, venue_id, subject, through
    its owner, tenant root) instead of "none" for the last three, with "tenant root (one tenant per database; no
    tenant_id by design)"; ADAM''s table view (viewer/lib/migrations.mjs, public/app.js) carries a note on every
    tenant_isolation policy saying the same.'
  by: Chinmay
  date: '2026-10-03'
why: 'Block A audit on live r2, pattern 5 in CHG-AUD-001 ("tenant_isolation RLS on tables with no tenant_id"; 167
  tables, 117 in Block A). Chinmay, 3 October (spec-fix brief): by design, one tenant per database and
  tenant_root_in_scope(); add a short note where ADAM or the docs label it, so the audit does not report it again, and
  do not change the DDL. ADR-0038 (a cell is a region with a database per tenant).'
