id: CHG-SHP-006
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every create taking a business `code` declares the shared DuplicateCode 409.'
decision:
  what: 'contracts/*: `''409'': $ref: ''../shared/common.yaml#/components/responses/DuplicateCode''` on 39 creates and
    on the 9 updates that take the same body (check-business-rules BR-PAIR-REFUSAL), and `x-ticvai-unique` on the
    `code` they take where it was missing (36 persisted schemas).'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026, class check-contract-shapes/C-CODE-409 (evidence
  docs/active/audit-runs/audit-1014/classes.json): 39 members before, 0 after on this branch (CHG-SHP; ruling "go with your
  recommendation", Chinmay, 14 October 2026). R108, CHG-R4-015. The 409 promises a unique code, so
  check-storage-promises SP-DUPLICATE-409 asks for the index: `x-ticvai-unique` added on the `code` of 36 persisted
  schemas (tenant, the 28 September rule for configuration codes; venue for things placed at a venue: access points,
  stock locations, queues, menus, modifier groups, resources, games). derive-ddl writes the unique indexes into the r6
  forward migration V0104 at the refresh. Batch STO also works on keys: a merge conflict on the same `code` lines is
  possible.'
