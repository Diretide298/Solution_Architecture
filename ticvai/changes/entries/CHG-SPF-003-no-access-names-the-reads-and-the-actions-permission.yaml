why: 'Block A audit on live r2, 3 October (CHG-AUD-001, finding batches judge-log, judge-a-mid, judge-d-mid): BO-094
  named VENUE_MAP_VIEW while every button needs VENUE_MAP_MANAGE or VENUE_MAP_PUBLISH; 42 screens named a permission
  none of their operations requires. Chinmay, 3 October: fix the specs now, refresh, cut r1 of a fresh start.'
