kind: spec
summary: The no-access state names the permission the screen's read needs and, where actions need more, each action's
  permission.
decision:
  what: Rewrite the generated no-access states from the operations (the read the screen loads with first, then each
    action's permission with its operations) and correct the hand-written ones that named a permission no operation
    requires.
