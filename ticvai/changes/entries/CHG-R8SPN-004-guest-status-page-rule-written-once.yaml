summary: 'The shared contract now says, once, when a guest app reads getTenantAppStatus (launch, resume, any 503), which
  page wins (forced upgrade, maintenance, closed, sold out, then the normal screen), what platform unavailable means
  (the status read answering 503 or timing out, shown with the last kept brand or a neutral default), where sold out
  leads (choose another day, no id carried) and that a status page with nothing wrong shows Home. Wording only.'
