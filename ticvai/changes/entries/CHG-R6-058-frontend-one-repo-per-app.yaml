id: CHG-R6-058
date: '2026-10-13'
source: developer
kind: process
proposed: '2026-10-13'
summary: 'The frontend standards (frontend-patterns, quickstart) say that each TICVAI app has its own repository in the
  GitLab group ticvai-frontend, cloned inside an ADAM workspace, rather than one Nx workspace of thirteen apps; the
  standards themselves are unchanged.'
decision:
  what: 'setup/frontend-patterns.md and setup/quickstart.md in the six repos/* mirrors (and their source, the ADAM
    starter docs) qualify the statements that held only for the old single workspace: the app code lives in its own
    repository (ticvai-guest-web, ticvai-guest-app, ticvai-pos, ticvai-employee-app, ticvai-venue-management,
    ticvai-kiosk), cloned inside the workspace ADAM setup creates, and build, test and lint commands come from that
    repository. check-starter-fit keeps the seven copies equal.'
  by: Chinmay
  date: '2026-10-13'
why: 'Lead decision of 13 October 2026 (after commit 66fc67a0), Chinmay: "lets let frontend guys pull we just setup the
  bible and rest", then "First we run adam setup run and than within that git clone". A frontend developer (Chitrangi
  Mestry) had cloned her repository and got no project bible from setup.'
