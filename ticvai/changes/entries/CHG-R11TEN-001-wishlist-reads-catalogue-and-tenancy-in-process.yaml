id: CHG-R11TEN-001
date: '2026-10-29'
source: cr
kind: contract
summary: 'addToWishlist and getWishlist (Marketing, operations) ask catalogue#variantsSellableAt,
  catalogue#variantListingFacts and tenancy#venueSettingsRecords in process, a read the lead granted across deployables
  as XDR-007 (operations SELECT on the seven catalogue tables the queries answer over and platform.venue_settings);
  variantListingFacts is declared as CR-270''s specification gives it.'
decision:
  what: 'ADAM CR-270, option A (Chinmay, 28 October 2026: grant the narrow read, as for CR-243 and CR-234), and
    CR-273, settled with it. docs/active/cross-deployable-writes.yaml: XDR-007. contracts/spine/catalogue.yaml:
    variantListingFacts re-declared (inputs venueId, channel web|mobile, variantIds[], performanceIds[] nullable per
    item; one item per asked variant with variantId, performanceId, productName, imageAssetRef, listPrice as the
    amount only, performanceStartsAt, isAvailable, unavailableReason; unknownVariant for an unknown variant or a
    performance not of its product; reads the seven tables; served in-process and service);
    variantsSellableAt''s rule names the granted read. contracts/satellite/marketing-crm.yaml: the two operations''
    catalogue read-vias move from service to in-process, and their text says so (404 unknown-variant and
    variant-not-sellable). Derived: handoff/cross-deployable-writes.md (--write) and the guarded GRANTs in the
    forward migration.'
  by: Chinmay
  date: '2026-10-28'
why: 'ADAM CR-270 (Deep Khanvilkar, #30705 addToWishlist) and CR-273 (#30706 getWishlist): both asked Catalogue over a
  service route nothing publishes, through serviceAuth nothing builds (CR-174, CR-241), and variantListingFacts had no
  declared shape the CR could build to. Settled by the lead on 28 October 2026.'
keys_touched:
  operations: [addToWishlist, getWishlist]
  tables: [catalogue.variant, catalogue.product, catalogue.product_media, catalogue.price, catalogue.price_assignment,
    catalogue.price_list, catalogue.performance, platform.venue_settings]
  files:
  - docs/active/cross-deployable-writes.yaml
  - contracts/spine/catalogue.yaml
  - contracts/satellite/marketing-crm.yaml
  - handoff/cross-deployable-writes.md
  other:
  - 'XDR-007 (granted read)'
  - 'catalogue#variantListingFacts (declared query)'
root_class: 'storage-route gap: a cross-deployable read on a route that is not built'
tickets:
  started: []
  unstarted:
  - '30705 (addToWishlist) and 30706 (getWishlist): build against Catalogue''s and Tenancy''s in-process query
    classes, through CR-270''s and CR-273''s comments.'
  - 'DB-ROLES: the guarded GRANTs reach a built database through the forward migration, as XDR-005''s did.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-270, CR-273
triage: fix-forward
prevention:
  type: check
  ref: tools/check-cross-module-reads.py
status: open
notes: 'XR-ROUTE fails an in-process read across deployables that is not in the reads list; check-cross-deployable-writes
  X-READ checks XDR-007''s fields. platform.venue_settings is also XDR-004''s; its grant is already in a forward
  migration, so only the catalogue grants are new.'
