  schemas: [AiPolicy, ProposedAction, TranslationJob, IndexSource, SearchResult, KnowledgeCollection, KnowledgeDocument,
    MediaAsset, MediaUsage, MediaAssetVersion, UploadRefusedProblem, FooterConfig, RetailSale, MerchandiseItem,
    CreateMerchandiseRequest, ShopAndDrop, StockReservationSourceType, CellJob]
  tables: [ai.policy, ai.translation_job, ai.proposed_action, ai.index_source, assets.media_asset,
    assets.asset_version, whitelabel.footer_config_column, whitelabel.footer_config_social_link, retail.sale,
    retail.sale_line, retail.merchandise, control.cell_job]
  files:
