id: CHG-R8STO-003
date: '2026-10-20'
source: audit
kind: contract
summary: 'What a satellite operation promised to store now has a column or table the DDL derives: the tenant''s
  translation glossary on the AI policy, a translation job table and the draft columns on ai.proposed_action, a
  search kind per index source, the extracted text of an uploaded document on the asset, the previous file of a
  replaced asset on its version row, footer column links and the order of footer columns and social links, a
  receipt barcode, cashier and override reason on a retail sale, a droppable flag on merchandise, the target tier of
  a cell job, and the node a knowledge collection or document is written at.'
decision:
  what: 'R8 blocker causes FOUNDATION-AI-C05 (answer A: glossary on ai.policy), FOUNDATION-AI-C40, ORDERS-MONEY-C37
    (answer A: membership and document dropped as search kinds), ORDERS-MONEY-C19 item 4, ORDERS-MONEY-C29,
    WHITE-C24 with IDENTITY-C60 (one answer: links as jsonb on the column row, sortOrder on columns and social links),
    APPROVALS-TENANCY-C34, APPROVALS-TENANCY-C19 (answer A, jurisdiction list from the client) and ORDERS-MONEY-C36,
    each as its cause proposes. Additive columns and two new tables (ai.translation_job, and with CHG-R8STO-004
    whitelabel.content_block); the operation text that states each rule is kept small (the surface lane''s part).
    Breaking and needing the lead''s entries: the search-kind enum (two values removed, SearchResult.kind closed),
    StockReservationSourceType gaining retailReservation, UploadRefusedProblem.refusedReason gaining
    assetNotReplaceable.'
  by: Chinmay
  date: '2026-10-20'
why: 'Finding: R8 blocker cause list (walk of the Sprint 1 and 2 tickets): FOUNDATION-AI-C05 and C40 (27713),
  ORDERS-MONEY-C37 and C36 (27841), ORDERS-MONEY-C19 (27841, 28231, 28355), ORDERS-MONEY-C29 (27836), WHITE-C24
  (27905), IDENTITY-C60 (27782), APPROVALS-TENANCY-C34 (27820, 27821, 27823, 27824), APPROVALS-TENANCY-C19 (27995).
  Each operation described data the derived database had no column or table for.'
