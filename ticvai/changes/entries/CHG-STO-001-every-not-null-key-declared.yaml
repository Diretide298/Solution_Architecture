id: CHG-STO-001
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every NOT NULL key into its own database that was a naming convention is a declared reference on its
  contract field (x-ticvai-references), so 900 has its foreign key and 920 scopes a child through its parent; the
  tables written below tenant that sat at the tenant root because of an undeclared key follow their parent, and
  FALLBACK_DEBT is empty.'
decision:
  what: 'x-ticvai-references on 394 contract fields (tools/applied/sto-keys-14-october.py, through
    tools/applied/sto_markers.py), the convention target kept where it names the table the field means and corrected
    where the name rule picked the wrong one (a media file is assets.media_asset, not maintenance.asset; a product a
    recommendation or relationship points at is catalogue.product, not the recommendation table; a plan''s tier is
    subscription.plan; an entitlement''s template is catalogue.entitlement_template; a waiver signature''s template is
    the waiver''s marketing.form_definition; an outbox or inbox event_id, a tenant_id in a tenant database (ADR-0038),
    an id held in another cell and a target product whose module targetService names are `none`). A key a
    contract field cannot carry is declared in tools/derive-schema.py STORAGE_REFERENCES. Where a table gained a second
    protected candidate, tools/derive-ddl.py ROW_OWNER names the row''s owner (a line, cell, point or option follows
    the table it is the rows of), so no table loses the parent policy it had. tools/check-storage-promises.py:
    FALLBACK_DEBT emptied (only shrinks).'
  by: Chinmay
  date: '2026-10-14'
why: 'Block A audit before r6, class check-storage-promises/SP-KEY-UNDECLARED (389 at audit-base b93b5a87, 0 after)
  and SP-KEY-TENANT-FALLBACK (45, 2 of them new on the base: pricing.dynamic_price_action and
  dynamic_price_condition, 0 after), evidence audit/ticvai/runs/audit-1014/classes.json; triage ruling "Every NOT
  NULL key into its own database is declared (x-ticvai-references), as CHG-DDL-004 did" and "A child table follows
  its parent''s scope by its declared key (the 21+2 tenant-root tables, class 1)" (tracker F29). Same class as ADAM
  CR-069 (CHG-DDL-004) and CR-090 (CHG-CNS-002).'
