summary: 'MediaEntitlements'' items get their sources: kind is the product''s kind read through catalogue#productRecords
  and mapped onto the eight values, addedAt is the new access.entitlement.media_linked_at written when the media code is
  set or rotated, and transferredToSubjectId is the subject of the entitlement that supersedes this one by transfer.'
decision:
  what: 'ADAM CR-226, option A: kind is the product''s kind, read through catalogue#productRecords (added to getMediaEntitlements''
    read-via), mapped onto the eight values; addedAt is a new access.entitlement.media_linked_at, written when the media
    code is set or rotated; transferredToSubjectId is the subject_id of the entitlement whose supersedes_entitlement_id
    names this one with issued_via = transfer. contracts/spine/orders.yaml getMediaEntitlements and MediaEntitlements; contracts/spine/access.yaml
    Entitlement.mediaLinkedAt.'
  by: Chinmay
  date: '2026-10-25'
why: 'ADAM CR-226 (Pranay Shinde, #30686 getMediaEntitlements, not blocking), settled by the lead on 25 October 2026 (the
  48 CRs settled without a release; the decision is the comment the developers'' agents already build to). kind, addedAt
  and transferredToSubjectId had no table or declared read behind them; #30686 omits them until settled.'
