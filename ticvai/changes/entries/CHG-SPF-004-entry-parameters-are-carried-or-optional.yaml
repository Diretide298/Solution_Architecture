id: CHG-SPF-004
date: '2026-10-03'
source: audit
kind: spec
summary: A required entry parameter that no inbound edge carries becomes optional where the screen lists, reads
  or makes the id or only an action takes it, comes from the session on a staff screen, or is carried by an inbound
  edge whose source holds it.
decision:
  what: Resolve each required parameter no edge carries by what the screen's operations show, add the carrying edge
    where the load needs it (five by hand on Block A), make a download an action, and have the generators write
    optional parameters by the same rule.
  by: Chinmay
  date: '2026-10-03'
why: 'Block A audit on live r2, 3 October (CHG-AUD-001, finding batches judge-log, judge-a-mid, judge-d-mid): WEB-044
  required a conversationId it creates itself; CMS-104 and GST-032 the same; 784 required parameters had no inbound
  edge carrying them. Chinmay, 3 October: fix the specs now, refresh, cut r1 of a fresh start.'
