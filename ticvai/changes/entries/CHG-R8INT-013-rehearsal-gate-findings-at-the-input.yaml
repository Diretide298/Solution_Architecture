  bands column was always jsonb (backend/tenant/010-catalogue.sql). The surface lane established that the 25
  S-INPUT-SOURCE findings are all among the 28 the rule gives on r7''s package (r8b surface report). Finding: refresh
  rehearsal of 20 October 2026 (check-storage-promises, check-contract-storage, check-cited-sources,
  check-screen-wiring).'
