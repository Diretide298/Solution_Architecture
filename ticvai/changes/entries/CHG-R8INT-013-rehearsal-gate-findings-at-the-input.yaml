    changes/entries CHG-R8LIN-001 and CHG-CRA-001 citations; handoff/audit-baseline.json check-screen-wiring
    S-INPUT-SOURCE (25 keys, with this entry as the reason).'
  by: Chinmay
  date: '2026-10-20'
why: 'The coordinator''s addendum to the r8 integration brief (20 October 2026), from the refresh rehearsal of the
  integration branch at 1fba7794: fix at the authored input or the check, never in derived files. setTableLayout''s
