summary: 'Findings the refresh rehearsal of the integration branch failed on, fixed at the authored input: a table
  layout''s items name their table by id (TableLayoutItem; SP-REPLACE-NO-KEY), a product tag''s 409 says the code is
  unique in the same venue (SP-DUPLICATE-409), the price ladder''s typed bands are the jsonb value they are stored as
  (ST-FIELD-NO-COLUMN), two change entries cite in-git sources instead of audit/ and an untracked path
  (check-cited-sources), and the 25 S-INPUT-SOURCE findings that predate r8 join the baseline (the rule is new in r8;
  every one is on r7''s package too).'
