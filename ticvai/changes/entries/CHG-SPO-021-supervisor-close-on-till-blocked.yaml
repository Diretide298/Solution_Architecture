id: CHG-SPO-021
date: '2026-10-02'
source: audit
kind: spec
summary: POS-007 declares closeShift for the supervisor (PIN, any till), POS-019 declares setTillShiftPolicy, and check-finance-rules
  F-BLIND-CLOSE admits closeShift on a till only from a supervisor's control.
decision:
  what: 'Bind closeShift on POS-007 behind SHIFT_CLOSE_OTHER with the supervisor''s PIN (button "Close shift for the cashier"
    and its form), and setTillShiftPolicy on POS-019 behind WORKSTATION_CONFIGURE. Amend F-BLIND-CLOSE: a P04 or P06 screen
    may declare closeShift only when every component calling it is permissioned SHIFT_CLOSE_OTHER or OVERSHORT_ACCEPT and
    every form calling it is triggered by such a component; otherwise it still fails.'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026, pre-apply round: "closeShift is declared on POS-007 (supervisor PIN, any till) and in the daily
  cash reconciliation" (DEC-059; CHG-CSP-012). check-finance-rules (CHG-FIN-003) predated the decision and refused closeShift
  on any till screen; the lead asked that POS-007 declare closeShift and POS-019 the till shift policy operations, which flows
  F74 step 1 and F73 step 2 (CHG-SOT-004) now expect (CHG-CSP-020).'
