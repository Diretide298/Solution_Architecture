  started:
  - 'TEST-AM-FOUNDATION-DATABASE (27686, On hold): measures against the package DDL; the review rows below are new'
  - 'SVC-TENANCY-WORKSTATION-1#configureWorkstation (30794, In progress): platform.device.status gains DEFAULT unknown'
  unstarted:
  - 'SVC-ORDER-PAYMENTS-17 (setPaymentRules), SVC-IDENTITY-ADMINISTRATION-8 (createDelegatedAccess), APP-PARTNER-PTR-020,
