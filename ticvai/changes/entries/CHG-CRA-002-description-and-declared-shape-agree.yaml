notes: 'Prevention: check-contract-storage ST-GRAPH-TARGET-GONE (a relationship-graph column whose target table the
  package no longer has) and ST-DEFAULT-DESCRIBED (a stored enum whose description names its starting value with no
  declared default); shown failing on r6 (1 + 3 new: control.release.plan_id; connectionStatus, OutboxRepublish.status,
  RegisteredDevice.status) and passing after. Generator rule: derive-ddl x-ticvai-exactly-one-of (pytest
  tools/tests/test_cr_answers_generator.py, failing on r6, passing after). Sibling query: both rules package-wide
  (63 graph-sourced columns, one gone; every stored enum''s description). Database (derived at the release; the
  derive of this branch, kept in D:\wt\fix-cr-answers-1018-derived\class11): migration-review rows for
  control.release.plan_id (dropped), payment_policy_id x4 (dropped), identity.delegated_access.permission (NOT NULL
  dropped) and delegated_access_permission_role_id_one_chk (constraint added: NOT VALID, then VALIDATE),
  partner_bundle_product.connection_status (DEFAULT available, NOT NULL: backfill nulls first),
  rental.booking deposit_authorisation_id key now to orders.payment, two DEFAULTs; no additive line, so no V0105 from
  this class. The retired columns'' first step (drop NOT NULL at once) is the migration-generator lane''s fix (class
  10, CR-157); until it lands the review row says "decide". Developers'' forward migrations may already carry these
  statements (the published answers allowed it); the package''s next release carries the same.'
