  - tools/applied/guest-devices-wishlist-14-october.py
  - handoff/api-data-lineage.json
  - tools/check-contract-storage.py
  - handoff/audit-baseline.json
  other:
  - ADR-0063 amendment (14 October 2026)
  - x-ticvai-secret
root_class: 'new: SECRET-STORAGE-FORM (a stored secret that does not say how it is stored)'
tickets:
