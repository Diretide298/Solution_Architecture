status: closed
closed_by_commit: ee22b123
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Batch
  MKT, branch cr/086-088-guest-devices from r6-integrate 594e51a2. Chosen where the CR left it to the owner (lead to
  confirm): the CR''s option A (installationId) and V2 (the token encrypted in the row), as ADR-0063 section 4 already
  decides; the fingerprint is keyed (HMAC-SHA-256, the section-4 blind index) rather than the CR''s plain SHA-256, so a
  token somebody holds cannot be checked against the table; installationId is optional so an app that predates it
  still registers. Instead of a partial unique index (WHERE status <> revoked, which derive-ddl cannot emit) a revoke
  clears the token, fingerprint and installation, so plain per-guest unique indexes hold and a revoked row is never
  matched. The shared-phone rule (the sender keeps the newest row per fingerprint across guests and revokes the rest)
  is the lead''s proposal. **KERNEL-FIELD-ENC (ADR-0063 action 6) is not a ticket yet**: registerGuestDevice cannot
  finish without it, so the lead creates it (a plan change) or the ticket stays On hold on it. Migration effect
  (MIG-MARKETING #27677, not started): a new column installation_id, two unique indexes, a CHECK on the fingerprint''s
  length and the rename token_ref -> token_ciphertext (derive-ddl writes the column and indexes into the next V01nn
  forward migration and lists the rename in handoff/migration-review.md). Prevention: ST-SECRET-FORM in
  check-contract-storage, run on the parent (594e51a2 contracts with this branch''s check: fails on
  marketing.guest_device.token_ref) and passing on this branch; the 17 other stored secrets that do not say their
  form are baselined, among them tenancy RegisteredDevice.pushToken (platform.device.push_token, plaintext: the same
  gap for staff phones, not fixed here, for the lead), approvals and webhook signing secrets, payment and transfer
  tokens.'
