id: CHG-MKT-001
date: '2026-10-14'
source: developer
kind: contract
summary: 'A guest device is one row per app install (installationId), or per token without one; the push token is stored
  encrypted by the application and found by an HMAC-SHA-256 blind index, never as a Key Vault secret per device; a
  re-registration says what it changes, a failed device is revived by it and a revoked one never is; ADR-0063 says
  which of four forms every stored secret takes, and check-contract-storage holds them to it.'
decision:
  what: 'contracts/satellite/marketing-crm.yaml: registerGuestDevice takes an optional installationId (a UUIDv7 made
    once per install, per browser profile for web) and its description says how a registration finds its row (the
    calling guest''s row with that installationId, else the one with this token''s fingerprint; a revoked row has
    neither), what a re-registration changes (token, fingerprint, platform, app/os/model/locale as sent, status
    active, failureCount 0, lastSeenAt now; registeredAt and id kept), that a failed row is made active again and a
    revoked one never is (a new row instead), and that the push sender sends a token only to the most recently
    registered or seen row across guests and revokes the others (a shared phone). GuestDevice gains installationId
    (writeOnly) and x-ticvai-unique-together [subjectId, installationId] and [subjectId, tokenFingerprint] (per guest,
    never tenant-wide: subject RLS); tokenFingerprint is HMAC-SHA-256 under the tenant''s blind-index key, 64
    lowercase hex (x-ticvai-secret blind-index, x-ticvai-unique-compare exact); tokenRef keeps its wire name and is
    stored as token_ciphertext, AES-256-GCM under the tenant''s data key (x-ticvai-secret field-encrypted); status and
    failureCount say what active, failed and revoked mean. revokeGuestDevice clears the token, fingerprint and
    installation and is 204 again on a revoked device. docs/adr/0063: amended 14 October 2026, a secret held per guest
    or device is field-encrypted under section 4 (Key Vault holds the key, never the value), a lookup on it is the
    section-4 blind index, a Key Vault secret is for the few credentials staff configure, a password or PIN is
    ADR-0071''s Argon2id; the kernel component is action 6, KERNEL-FIELD-ENC. tools/derive-schema-history.py
    COLUMN_RENAMES marketing.guest_device token_ref -> token_ciphertext. tools/applied/guest-devices-wishlist-14-october.py:
    revokeGuestDevice reads and writes marketing.guest_device (the lineage had it writing marketing.guest_profile).
    tools/check-contract-storage.py ST-SECRET-FORM.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-086 (ticket 30708, SVC-MARKETING-GUEST-1), audited 14 October 2026. TRUE: GuestDevice.tokenRef was "a vault
  reference to the push token ... the same pattern as PaymentProvider.credentialRef" (marketing-crm.yaml GuestDevice)
  with no secret-store abstraction in TICVAI.Application, and PaymentProvider holds a few provider credentials per
  tenant (orders.yaml PaymentProvider); tokenFingerprint was "Hash of the token" with no algorithm; the only index on
  marketing.guest_device was guest_device_subject_id_idx (backend/tenant/910-indexes.sql:3475), so "idempotent on the
  token" had nothing behind it; a rotated token is a different token and the request carried no install id; the
  table is apply_subject_rls (920-row-level-security.sql:1083), so a tenant-wide unique index fails on rows the caller
  cannot see; the re-registration fields and a revoked row''s fate were unstated. Missed by the CR: ADR-0063 section 4
  already decides field-level encryption (a per-tenant data key wrapped by an HSM-backed Key Vault key, and a keyed
  hash blind index for lookup) and says the encryption half "is ours and does not wait" on the client; ADR-0071
  (CHG-CRD-003) set Argon2id and a Key Vault pepper for PINs the same day; the staff twin tenancy
  RegisteredDevice.pushToken says "never in a row" (R164) while platform.device.push_token is a plaintext column
  (010-platform.sql:151); revokeGuestDevice''s path-inferred lineage wrote marketing.guest_profile. The lead''s
  instruction, 14 October: "pull all Crs and get them fixed".'
keys_touched:
