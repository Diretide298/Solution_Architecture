id: CHG-DOOR-003
date: '2026-10-02'
source: audit
kind: spec
summary: ADM-001, SUP-001, PTR-001, EMP-001 and SCN-001 are rebuilt as sign-in forms (credentials, then the code when
  a permission demands it, then the role prompt, then the landing); session management moves to the staff directory
  BO-053, and the credit, permission-simulation and shift operations leave the doors.
decision:
  what: 'Each staff and partner door declares only signing in: login, SSO (browser doors and EMP-001),
    createMfaChallenge and verifyMfaChallenge, the first enrolment (browser doors), selectRole (or the next screen''s,
    EMP-002), changeOwnCredential and getCurrentSession. Removed: listActiveSessions, forceLogout, revokeAllSessions,
    listMfaMethods, removeMfaMethod (all five doors); getB2bCredit, setB2bCreditLimit, overrideCreditLimit,
    listPartnerAgreements (PTR-001); resolvePermissions and getCurrentShift (SCN-001). listActiveSessions, forceLogout
    and revokeAllSessions (under step-up) are on BO-053 Staff Directory; MFA methods stay on WEB-024, GST-073 and
    EMP-042; POS-000 keeps its in-place till takeover (R184). Flows F06, F10, F61, F64, F104, F109 and F110 follow.
    (Chinmay, 2 Oct 2026, fix the Block A blockers now.)'
  by: Chinmay
  date: '2026-10-02'
why: 'Platform-foundation process finding (corrections on ADM-001, SUP-001, PTR-001, EMP-001 and SCN-001): the doors
  were generated as listDetail screens with session, MFA and SSO tables and Force logout on the sign-in screen ("a
  person signing in has no session yet and must see none of that"); PTR-001 carried credit operations ("setting or
  overriding a limit is the tenant''s act"); SCN-001 carried resolvePermissions ("an administration tool; a steward
  signing in never calls it") and a SHIFT_OPEN no-access state. Sequence per R135, R126, R184 and ADR-0003.'
keys_touched:
  screens:
  - ADM-001
  - SUP-001
  - PTR-001
  - EMP-001
  - SCN-001
  - BO-053
  operations:
