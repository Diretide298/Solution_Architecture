  - forceLogout
  - revokeAllSessions
  - listMfaMethods
  - removeMfaMethod
  - resolvePermissions
  - getB2bCredit
  - setB2bCreditLimit
  - overrideCreditLimit
  - listPartnerAgreements
  flows:
  - F06
  - F10
  - F61
  - F64
  - F104
  - F109
  - F110
root_class: A30
tickets:
  started: []
  unstarted:
  - APP-CONSOLE-ADM-001
  - APP-SUPPORT-SUP-001
  - APP-PARTNER-PTR-001
  - APP-STAFF-EMP-001
  - APP-SCANNER-SCN-001
  - 'APP-SETUP-BO-053 (#17798; the session operations are outside its slice part and join the rest of BO-053)'
release_tag: pending
decision_owner: Chinmay
prevention:
  type: check
  ref: tools/check-doors.py
  reason: D-DOOR-PATTERN, D-DOOR-FOREIGN-OP, D-DOOR-MFA and D-DOOR-ROLE fail on a door that is a list, declares an
    operation outside signing in, cannot ask for the code or has no role prompt.
status: closed
closed_by_commit: 6149ce92
notes: 'On the parent commit 12d3f888 check-doors finds D-DOOR-PATTERN 5, D-DOOR-FOREIGN-OP 21 and D-DOOR-ROLE 3; none
  on this branch. Not done here, for the lead: TICVAI platform operators have no signed-in screen of their own to
  remove an MFA method or end a session (ADM-342 is the policy screen); the doors'' implementation.component names
  still end in List.tsx (a frontend rename); the doors keep their names (Platform Login / MFA, Partner Login / MFA),
  which the glossary would write as Sign in.'
