id: CHG-R10ORD-018
date: '2026-10-25'
source: cr
kind: contract
summary: 'The scale of a currency other than the venue''s or region''s trading currency is its ISO 4217 minor units, one
  fixed list in the kernel beside Money: stated on common.yaml Money.scale and on the amounts in another currency (Payment.tenderAmount,
  Order.chargeTotal, Refund.tenderAmount, a deposit box''s foreign holdings).'
decision:
  what: 'ADAM CR-192, option A: the scale of any currency is its ISO 4217 minor units, held as one fixed list in the kernel
    (TICVAI.Domain, next to Money); the venue and region settings keep their own currency_scale for the trading currency.
    contracts/shared/common.yaml Money.scale; contracts/spine/orders.yaml Payment.tenderAmount, Order.chargeTotal, Refund.tenderAmount;
    contracts/spine/shift.yaml DepositBox.foreignHoldings.'
  by: Chinmay
  date: '2026-10-21'
why: 'ADAM CR-192 (Pranay Shinde, #30687 getOrder), accepted with option A on 21 October 2026: Money carries a scale, and
  nothing in the package gave the scale of a tourist''s tender currency or a guest-selected charge currency.'
