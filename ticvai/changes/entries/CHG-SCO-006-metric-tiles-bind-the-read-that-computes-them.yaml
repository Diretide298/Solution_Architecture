id: CHG-SCO-006
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every metric tile on P09, P10, P12, P13, P14, P15 and P16 names the read that computes it; the P09 commercial
  command centres, whose figures no operation read, get getCommercialMetrics (GET /commercial-metrics, subscription).'
decision:
  what: 'Bind the 410 metric tiles that named no operation to the read that computes them: the KPI read
    (getKpiValues) on the analytics dashboards, the usage, benchmark, forecast, action-plan, decision, alert and
    summary reads the screens already declare elsewhere, and listKitchenTickets for the kitchen displays'' station-load
    tile (KIT-009 declares it for that tile). The ten commercial command centres of P09 (ADM-369, ADM-372 to ADM-376,
    ADM-378, ADM-389, ADM-459, ADM-464) show recurring revenue, renewals, trials and guarantee figures no operation
    computed, so subscription.yaml gains getCommercialMetrics (PLATFORM_BILLING_VIEW, platform scope, read from the
    replica), shaped like reporting''s getKpiValues: one value per metric code, money as Money, for the portfolio or
    one customer. No tile is added, removed or relabelled.'
  by: Chinmay
  date: '2026-10-14'
why: 'Block A audit of 14 October 2026, class check-screen-wiring S-METRIC-NO-OP (R283; audit root class A30
  SCREEN-GENERATED), evidence the classes.json of the Block A audit run audit-1014. Ruling (triage, lead 14 October: "go with
  your recommendation"): a metric tile binds the read that computes it, or is removed. The approved UI is fixed
  (lead, 14 October), so no tile is removed: where the read did not exist, the contract gains it (AUDIT-FIX-RULES:
  a contract operation only where the approved UI needs one). On these platforms: 410 members before, 0 after.'
