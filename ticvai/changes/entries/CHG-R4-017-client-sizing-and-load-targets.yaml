notes: 'Batch R4, 6 October 2026. check-load-targets (registered in run-checks.py) fails on the commit before this
  change with nine findings (eight L-TARGET-MISSING and L-TARGET-BELOW on ADR-0066:121, "Load test at 30,000
  arrivals") and passes after it. **Not changed, by rule:** the ticket EDGE-WAITING-ROOM-LOAD (docs/active/
  block-a-extra-tasks.json, a plan input) still says "30,000 arrivals"; changing its text is a change of kind plan,
  which needs its 24-hour cooling-off (ticvai/CLAUDE.md rule 9), so it is proposed to the lead for the next release
  rather than made here. The ticket is unstarted (block-a-schedule.json day 28.67, block B1) and its pointer body
  reaches ADR-0066, whose amendment now says 50,000. EDGE-WAITING-ROOM starts at day 18.51 and the Block A tests at
  37.83: none started ("started" read from handoff/service-docs/block-a-schedule.json; no status snapshot is in git).
  No contract changes. The derived HLD (handoff/hld-lld/TICVAI-HLD.md) picks the sentence up at the refresh.'
