notes: 'Generator rules beside the check: derive-schema (x-ticvai-pii fields get no column; `personal` and `dataClass`
  in the schema reference), derive-ddl (the moved columns retired with their copy in migration-review.md, "personal data
  moved", judged by check-schema-drift as a retired column), derive-delivery-slice (a privacy part''s reads marked
  feedsSetup: false pull no writer into the slice, so the export''s reach moves no screen into Block A), derive-subject-data-register (keyed on any subject column, x-ticvai-pii and kept personal columns; `owners`
  by contract). Not settled here, for the lead: the control database''s people (B-02, ADR-0043: no pii schema and no
  PII permission there yet; fields marked, not moved, responses not gated) and the ledger''s tax-document buyer names
  (tax-law retention). Beyond the brief''s words: staff principals and sessions get a pii.subject (kind employee) to hold
  the verified email and session IP; a suppression keeps an address hash so it outlives the erasure; report
  recipients and supplier contacts kept in jsonb are erased by their module.'
