id: CHG-R14M-001
date: '2026-11-03'
source: audit
kind: contract
summary: 'A natural person''s identifier is kept in pii.*, never as a column of a module''s table: 52 columns on 24
  tenant tables (holders'', participants'', recipients'', contacts'', employees'' and applicants'' names, emails,
  phones, birth dates, nationality, ID numbers and IP addresses) are marked x-ticvai-pii {store, subject}; derive-schema
  gives them no column, each row gains (or names) its pii.subject id, and derive-ddl retires the columns and writes
  their copy into pii.* for the migration owner. Identity owns the write (recordSubjectDetails), the read
  (subjectDetails) and a new pii.subject_network_identifier. Every contract field named as a person''s identifier
  carries a data class (153: personal, or business for an organisation''s). 100 operations answering personal fields
  declare x-ticvai-personal-data (91 gated: null without GUEST_VIEW_PII; 9 self). Erasure and export reach every module:
  26 contracts gain a subjectDataPart job on identity.privacyRequestRaised, Marketing''s part covers all its tables and
  erases, Identity records every owner''s part (submitSubjectDataPart, identity.subject_erasure_part) and its erasure
  job empties every pii.* row and waits for every owner. ai.message gains the subject id, and eraseSubject reaches
  conversations, messages, activity prompts and answers, feedback, recommendations and the memory metadata.'
decision:
  what: 'The lead, 3 November 2026, on the r13 system review (findings B-01 and C-11): personal data, "Move the
    columns" into pii.* (in r14, with "All four, one release"). As the r14 brief puts it: the personal-data columns move
    into pii.* keyed by subject, the contract fields are marked personal, responses that return them need the PII
    permission, erasure and export reach every module, ai.conversation and the AI messages get a subject id erasure
    can find.'
  by: Chinmay
  date: '2026-11-03'
why: 'Finding B-01 of the r13 system review (3 November 2026, read at the r13 tag a8e06314): personal data outside pii.*,
  unmarked, served under non-PII permissions and not reached by erasure; ADR-0023''s invariant did not hold for module
  tables. Finding C-11: a guest''s erasure left their AI prompts, answers and messages. ADR-0023, ADR-0047, ADR-0055 rule
  4, ADR-0063 section 5, CR-141 (the guest profile''s data classes), CHG-R11FXC-005 (Marketing''s export part),
  CHG-R8ERA-002 (eraseSubject).'
keys_touched:
  operations: [recordSubjectDetails, submitSubjectDataPart, eraseSubject, writeSubjectDataExportPart,
    deleteGuestAccount, exportSubjectData, checkoutCart, and the 100 operations given x-ticvai-personal-data]
  tables: [access.entitlement, accreditation.holder, approvals.accreditation_badge, assets.share,
    catalogue.waitlist_entry, fnb.table_reservation, identity.principal, identity.session, inventory.supplier,
    marketing.booking_consent_record, marketing.form_submission, marketing.guest_profile, marketing.invitation,
    marketing.waiver_signature, marketing.suppression, orders.group_customer_organisation_contact,
    orders.group_participant, orders.invitation, orders.order_line, orders.reservation_line, rental.agreement_signature,
    rental.participant, seating.group_request, seating.hold_pool, workforce.employee, ai.message,
    pii.consent_identifier, pii.subject_network_identifier, identity.subject_erasure_part]
  schemas: [SubjectNetworkIdentifier, SubjectErasurePart, SubjectDetailsWrite, SubjectDetails, AiMessage,
    ConsentCaptureIdentifier, Suppression, and the 27 persisted schemas whose fields are kept in pii.*]
  files:
  - contracts/spine/access.yaml
  - contracts/spine/approvals.yaml
  - contracts/spine/catalogue.yaml
  - contracts/spine/finance.yaml
  - contracts/spine/identity.yaml
