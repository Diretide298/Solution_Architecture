  - contracts/satellite/reporting.yaml
  - contracts/satellite/seating.yaml
  - contracts/satellite/subscription.yaml
  - contracts/satellite/wallet.yaml
  - contracts/satellite/white-label.yaml
  - contracts/satellite/workforce.yaml
  - contracts/README.md
  - events/identity-privacyRequestRaised.yaml
  - docs/adr/0023-pii-separation.md
  - docs/architecture/data-model.md
  - docs/architecture/ai-system-design.md
