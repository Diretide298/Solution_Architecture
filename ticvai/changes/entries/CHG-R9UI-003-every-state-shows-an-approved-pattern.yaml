notes: 'Counts at this change: of the 936 states of the 158 client-verified screens, 646 show an approved pattern
  (P01 285 of 289, P02 277 of 444, P04 84 of 203) and 290 are design gaps, on 19 design-gap lines of the left-out list
  (LO-R9UI-001 to -004 and -006 to -020; LO-R9UI-005 is P01''s undrawn offline banner, the partial gap). The
  check was shown failing on a probe (WEB-007''s error with no view and no left-out line: SV-NO-VIEW) and passing on
  the tree (python3 tools/check-state-views.py --probe). wireframe.stateViews is invisible metadata: check-approved-ui
  passes (no visible field changed). P04-point-of-sale.yaml was out of the derivers'' form after a hand edit
  (CHG-R8RW-010) and is written back in it, the same data.'
