id: CHG-R9UI-003
date: '2026-10-21'
source: audit
kind: spec
summary: 'Every state of a client-verified screen names the look its client-approved prototype or board draws for it
  (wireframe.stateViews, written from screens/_state-patterns.yaml: guest web''s error is the WEB-029 status card,
  loading the turnstile loader, WEB-007''s waiting step the dashed "Choose ... to see the seats" note, and so on per
  platform), or is a design gap for the client on the one left-out list (docs/active/left-out.yaml); a check fails a
  state with neither. The generated layout and the generated frames under wireframes/incoming/ are labelled structure
  only, not the look, wherever they are handed out.'
decision:
  what: 'screens/_state-patterns.yaml (new, authored: the patterns of P01, P02 and P04, each proved by texts its
    prototype holds, and which pattern each state shows); tools/derive-state-views.py (new refresh step: writes
    wireframe.stateViews into the 158 client-verified screens, handoff/design-frames.json and
    wireframes/incoming/README.md); screens/_schema.yaml wireframe.stateViews; docs/active/left-out.yaml (new: the
    package''s copy of the one left-out list; LO-R9UI-001 to -020 are the design gaps of P01, P02 and P04);
    tools/check-state-views.py (new, registered in run-checks.py, strict); tools/check-regenerate-twice.py
    (derive-state-views in WRITE_BACK). The spec pages call the layout pattern "structure only, not the look".'
  by: Chinmay
  date: '2026-10-21'
why: 'Finding of 21 October 2026, the WEB-007 seat page (#31848; sources/audit-21-october/web-007-ui-pull-findings.md,
  causes 4 and 5): a screen''s states were one line of generator text (tools/generate-screens-from-contracts.py), so
  nothing mapped an error to the WEB-029 card, loading to the turnstile loader or the waiting step to the dashed note,
  and the page was built with a bare error page; a third, generated frame styled like the till was attached to the
  screen as if it were the design. The lead, Chinmay, 21 October 2026: "I wanna get all of those changes out now..".
  Standing rules: the client-approved UI is fixed (the lead, 14 October 2026) and a state the approved design does not
  draw is not invented: it goes to the client as a design gap, on the left-out list (the council of 20 October 2026).'
