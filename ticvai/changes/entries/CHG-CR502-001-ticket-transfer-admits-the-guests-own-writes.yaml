id: CHG-CR502-001
date: '2026-11-03'
source: cr
kind: contract
summary: orders.ticket_transfer's write gains the sender's branch (from_subject_id the session's subject and the parent order's
  subject_id the same), by a new derive-ddl mark x-ticvai-guest-writer; listTicketTransfers runs under the guest's session
  with the subject condition kept in the query; claimTicketTransfer updates its one row under ITenantRootGrant once the claim
  token is verified.
decision:
  what: 'Posted on the ticket (Chinmay, 3 November 2026), under the leads instruction ("Close the CRs and respond to devs",
    and "get the NEw CRs in the r13", 3 November 2026): "orders.ticket_transfer admits a guest''s own transfers by subject,
    as orders.cart and orders.sales_order already do. No wider grant, and no subject filter in code as the only safeguard
    ... Write: the current staff rule OR (from_subject_id = ticvai.subject_id AND the parent orders.sales_order''s subject_id
    = ticvai.subject_id) ... claimTicketTransfer ... updates that one row ... under the routed tenant''s root grant"'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-502 (Narayan Gaonkar, #30677): the table''s write admitted staff only, so a guest''s transfer could not be written;
  the read had been opened by r13 root R28 (CHG-R13R28-001), which found and left the write.'
