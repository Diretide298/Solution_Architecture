id: CHG-R14I-003
date: '2026-11-03'
source: audit
kind: process
summary: The change-entry commit rule is part of the gate (run-checks.py runs check-changelog --since, the latest r* tag)
  and the tag step refuses a release whose commits since the last tag fail it (check-adam-latest-release LR-COMMITS); every
  field a refresh step writes into an authored file is declared (tools/derived_fields.py), and check-derived-fields fails
  a refresh that changes an authored file outside them.
decision:
  what: 'Review finding E-03 and the lead''s r14 instruction "The derive must stop writing authored files, or declare exactly
    the derived fields it owns": declared, 29 rules over contracts/*.yaml (x-ticvai-consumed-by, x-ticvai-screen-count),
    screens/P*.yaml (the steps'' own edges, components, state views, blanks they fill) and flows/F*.yaml (created from boards
    only), and screens/_id-register.yaml whole. refresh-safe.sh passes the tree the refresh started from (REFRESH_SAFE_BASE).
    The rule applies from the r13 tag forward; history is not rewritten. Decided by the lead, 3 November 2026, on the r13
    system review''s triage: "All four, one release" (the starters, device/guest/token access, gate integrity, tenant setup
    and stale docs go into r14, released together).'
  by: Chinmay
  date: '2026-11-03'
why: 'The r13 system review, finding E-03: check-changelog --since r8 fails on ed7e975c0 (r10 integration, 31 contract files),
  289e89b1f (r10 derived) and a47956cb9 (r11 derived), which name no change id; --since r4 adds 13 more. r13''s derive commit
  a657374c rewrote screens/P14-developer-portal.yaml. check-derived-fields --commit passes a657374c2, 289e89b1f and a47956cb9
  (every change a declared derived field) and flags ed7e975c0 (189 hand edits to x-ticvai-read-via, 409 texts and queries
  in 33 contracts).'
keys_touched:
  files:
  - tools/run-checks.py
  - tools/check-adam-latest-release.py
  - tools/derived_fields.py
  - tools/check-derived-fields.py
  - tools/refresh-safe.sh
  - docs/active/release-runbook.md
root_class: 'A00 TOOLING: a gate rule left to a manual step'
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: 'none: the lead''s own decision of 3 November 2026 on the r13 system review'
triage: fix-forward
prevention:
  type: check
  ref: tools/check-derived-fields.py
status: open
notes: 'Weakest declared entries (to stop rather than declare, next): derive-screen-wiring rewrites boilerplate purpose
  text, apis[].trigger, region names and the "Drawn frame" note; derive-transitions-from-flows --adopt and derive-carries-from-entrystate
  add navigation.exitTo. A trigger renamed by hand on an edge step 22 owns is not caught. handoff/refresh-manifest.json
  (traced 2 October) misses derive-screen-wiring and derive-state-views; rebuilding it is a 40-minute trace left to the
  integration.'
