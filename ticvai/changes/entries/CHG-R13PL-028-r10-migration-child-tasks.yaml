notes: 'One task per affected MIG ticket, as the r10 decisions named the MIG ticket; the r12 plan lane''s one task per CR
  was for work applied nowhere yet, while this work is on live already and only the repository''s db/ folder lacks it. The
  plan has no task under a task or sub-task, so the ticket the work belongs to is named in the task''s text; its OpenProject
  parent is the app-module the plan places it in, and it follows the migration that creates its tables. A change-only [DB]
  task is `area: database` and its key does not end in -DB (a -DB task''s `table` builds count as created by it, CHG-R8MIG-016,
