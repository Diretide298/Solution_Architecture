  - identity.CapabilityTemplate
  - identity.SegregationRule
  - inventory.Supplier
  - promotions.UpsellRule
  files:
  - contracts/spine/identity.yaml
  - contracts/satellite/inventory.yaml
  - contracts/satellite/promotions.yaml
  - tools/derive-ddl.py
  - tools/check-migrations.py
root_class: A23 AUTH-SCOPE
