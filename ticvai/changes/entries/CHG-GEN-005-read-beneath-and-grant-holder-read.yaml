status: closed
closed_by_commit: ee22b123
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  Verified on this branch: derive-schema, then derive-ddl --apply wrote V0104 with the six helpers, the 16 policy
  swaps (six marked tables, role_permission, and the nine of CHG-GEN-004), upsell_rule.scope_path added nullable with
  its GiST index, and a "not null" review row for its backfill (each rule takes its region''s path, from regionId);
  the derived files were restored before the commit. Choices left open by the decision: (1) role_permission follows
  role by the parent rule in split form rather than by its own mark, because the plain parent rule''s WITH CHECK is
  "the parent is visible", which would have opened role_permission writes to every grant once role is readable;
  (2) a guest session (ticvai.subject_id set) is not a grant holder, since the decision says "any staff grant";
  (3) read-beneath on a table without scope_path is refused with a message, not widened. Operations are not touched
  (batch IDR moves createRole/updateRole to tenant). deleteUpsellRule is venue-level and a venue grant cannot write
  a region-owned rule; R183 decided ownership at region, so its scope level is for the lead to settle. Expected
  check: the RLS-fit check of this batch passes these tables.'
