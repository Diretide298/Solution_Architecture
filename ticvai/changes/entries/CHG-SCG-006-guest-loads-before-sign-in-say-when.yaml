    GST-077, KSK-015]
  operations: [listMyCases, listMyOrders, getForm, listMyTableReservations, getParkingEntitlement, listAiConversations,
    createAiConversation, getGuestConversation, requestSuggestion, getCart, getMyProfile, getGuestConsents,
    getTransportDeparture]
  files: [screens/P01-guest-web-storefront.yaml, screens/P02-guest-mobile-app.yaml, screens/P05-guest-kiosk.yaml,
