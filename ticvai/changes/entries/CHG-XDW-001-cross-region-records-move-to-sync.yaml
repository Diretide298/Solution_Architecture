id: CHG-XDW-001
date: '2026-10-14'
source: audit
kind: contract
summary: 'CrossRegionService''s four records, guest_link, dsar_request, cross_region_entitlement and
  wallet_authorisation, move from platform (TenancyService''s schema, in commerce) into sync, CrossRegionService''s
  own schema in operations. Every operation that reads or writes them is CrossRegionService''s, so their writes no
  longer cross a deployable and exceptions XDW-001 to XDW-011 are removed rather than extended.'
decision:
  what: 'contracts/spine/cross-region.yaml: x-ticvai-persistence of GuestLink, CrossRegionEntitlement, the two wallet
    authorisation schemas and DsarRequest is sync.<table>; the prose naming the tables in identity.yaml,
    marketing-crm.yaml, platform-ops.yaml, screens/P02-guest-mobile-app.yaml, ADR-0031 and ADR-0033 follows. The moves
    are declared renames in tools/derive-schema-history.py (RENAMES, 2026-10-14; the wallet_authorisation column
    rename is keyed by its new name), so derive-ddl lists them in handoff/migration-review.md as `ALTER TABLE
    platform.<t> SET SCHEMA sync` instead of a new table beside a dropped one: tools/ddl_forward.py gains move_sql (a
    rename into another schema is SET SCHEMA, then RENAME TO only if the name changes) and recognises a hand-written
    SET SCHEMA. tools/derive-schema.py (the mistargeted ticket_id reference) and tools/derive-table-notes.py are keyed
    by the new names. The lineage is renamed by tools/applied/xdw-routes-14-october.py (17 CrossRegionService
    entries, reads, writes and readColumns). docs/active/schema-merge-decision-log.md decision 10 is marked
    superseded. The 11 exception entries are deleted from docs/active/cross-deployable-writes.yaml.'
  by: Chinmay
  date: '2026-10-14'
why: 'r6 gate (w609, 14 October 2026): tools/check-cross-deployable-writes.py failed 17 X-EXPIRED, every exception
  CR-002 dated for removal at r5 (CHG-R6-020; docs/active/cross-deployable-writes.yaml XDW-001 to XDW-017), r5 being
  tagged. Chinmay asked "Remove them now ?" on 14 October 2026: remove them in r6 by routing, not extend them. These 11
  were kind misplaced-table: the writer is the real owner (schema-reference source cross-region.*) and the reason
  offered moving the table into sync or a table-level grant; the ADR-0055 amendment of 14 October (CHG-GEN-009) rules
  out the grant (across deployables only a service call or an event, never shared SQL), and routing CrossRegionService''s
  own writes through a TenancyService operation would put its logic (the guarded consume, the wallet handshake under
  its lock, ADR-0031) in a module that does not own it. The schema-merge decision of 20 September (decision 10) kept
  guest_link and dsar_request in platform because both were TenancyService''s and "either both go or neither does";
  both now belong to CrossRegionService and all four go together. CHG-GDL-001 (ADAM CR-084) had already closed the
  Identity half of XDW-011: deleteGuestAccount and exportSubjectData no longer write dsar_request and call
  createDsarRequest only for a linked guest; that call is a service call and needs no change.'
