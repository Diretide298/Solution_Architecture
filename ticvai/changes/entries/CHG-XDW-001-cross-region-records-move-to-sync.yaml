closed_by_commit: ee22b123
notes: 'Batch XDW, 14 October 2026. The lead''s words: asked "Remove them now ?" on 14 October 2026. Released outside
  the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Prevention is the check that
  already exists and found this: check-cross-deployable-writes fails X-EXPIRED on an exception whose removal release
  is tagged, X-UNROUTED on a cross-deployable write with no route, so these cannot come back unseen; no new check.
  Triage blocker because the gate fails without it. The move is DDL: derive-ddl lists the four tables in
  handoff/migration-review.md as "table renamed" with `ALTER TABLE platform.<t> SET SCHEMA sync` (and, for
  wallet_authorisation, the earlier RENAME COLUMN wallet_hold_id TO fund_reservation_id) plus the "after rename" rows,
  for the backend developer''s forward migration; their row-level security is re-applied under the new name.
  Verified in w609 (HEAD 8ece8f11 plus R6G and these authored files): derive-lineage, derive-schema (four renames
  applied), derive-read-columns, derive-service-counts (TenancyService 110 -> 106 tables), derive-relationships,
  derive-ddl, derive-table-notes, derive-schema-history (renames resolved), build-schema-workbook; then
  check-cross-deployable-writes (67 writes, 0 on the exception list), check-lineage, check-write-lineage,
  check-contract-compat, check-contract-shapes, check-cross-module-reads (21 baseline entries gone, the
  CrossRegionService reads of platform among them), check-read-columns and check-storage-promises pass. The one
  storage-promises baseline key naming platform.wallet_authorisation.authorisation_id is carried to its new name
  (pre-existing debt, not this fix). The 20 September decision 10 is superseded on its own condition; if the lead
  wants DSAR orchestration back in Tenancy, that is a contract move of createDsarRequest, not a table grant. ADAM CR
  ids are pending: CR-002 is Done.'
