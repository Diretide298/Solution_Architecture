summary: The 106 Block A and B corrections on the moved screens that need a contract change, an operation that does not exist
  or a plan decision are logged, not invented.
decision:
  what: 'No contract change in this batch. Logged on the design notes (status logged): 41 pack actions with no operation,
    36 lists returning a bare array instead of the paged envelope, and 29 shape and ownership faults (strings for ids, numbers,
    money and booleans; a currency per row against ADR-0018; duplicate writers beside the venue screen''s operation; a channel
    record against a channel enum; a list with no described schema; a second product-kind vocabulary).'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October (PHASE-B): "If a correction needs an operation that doesn''t exist, mark it status: logged and add
  it to an open CHG entry (kind contract) listing the gap. Don''t invent operations." The workshop-pack console gaps were
  deferred to the ADM-049 move (CHG-CSP-053, CHG-CSA-044); the design-notes corrections name each one.'
