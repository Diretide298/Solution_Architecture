notes: '**The plan question for the lead (the section merges, CHG-MOV-002):** the slice''s setup operations setPriceListMaster,
  setRateStructure, setPromotionRule, setBuyGetBogo, setFixedPriceOffer, setGiftFreeProduct, setCrossCategoryPromotion, setEligibilityRule,
  setCouponPromoCode, setBundleDefinition, setBundleComponent, setGuestChoiceBuild and createBulkProductCatalogue duplicate
  the typed writers the venue screens already call (createPriceList and setPrices, createPromotion with Discount and PromotionConditions,
  createCouponCampaign, createBundle with BundleComponent and BundleChoiceGroup, importProductCatalogue and commitCatalogueImport).
  Retiring them moves the work of 13 pushed APP-SETUP-ADM tickets, so it is a plan change (24-hour cooling-off) and a contract
  deprecation, not a screen edit. CHG-CSA-044 stays open until then: the builders survive the merge as sections. Bare arrays
  to paged envelopes break r1 and need breaking-changes.yaml or a new paged operation. Shape and ownership faults, per screen:
  ADM-584: The table''s columns are the workshop pack''s labels with no bound response field (0 of 4 labels bound).; ADM-049:
  setPriceListMaster takes a defaultCurrency, and creates price lists a second way beside createPriceList.; ADM-050: The list
  operation is venue-scoped (PRODUCT_VIEW) while the write is tenant-scoped (PRICE_CONFIGURE).; ADM-051: setRateStructure
  accepts a currency per rate.; ADM-051: Rates are written by setRateStructure here and by setPrices on BO-009, two writers
  for the price of one ticket type.; ADM-054: The node carries a base and a selling currency and an FX reference rate.; ADM-070:
  Product, category, venue, legal entity and customer type are strings.; ADM-089: Owner, market, venue, product and event
  are strings in the builder, while the strategy record carries ids.; ADM-109: The simulation is a PUT named setPricing with
  every scope field a string, and channel uses the catalogue Channel enum while other simulations use SalesChannel.; ADM-115:
  No read operation: the screen declares only createLiveDynamicPrice and nothing that returns the current configuration.;
  ADM-120: Configurable statuses contradict the fixed ProductLifecycleState enum that transitionProductLifecycle moves along.;
  ADM-120: The operation is named setLifecycleStatuWorkflow (typo).; ADM-121: createBulkProductCatalogue is a second catalogue-import
  operation beside importProductCatalogue and commitCatalogueImport.; ADM-148: setPromotionRule types promotion, owner, venue,
  freeProduct, freeTicket, nested groups and priority as strings, and duplicates createPromotion.; ADM-159: setCouponPromoCode
  duplicates createCouponCampaign and types campaign and eligibleProducts as plain strings.; ADM-164: The funnel counts generated,
  assigned, sent, delivered, viewed and redeemed are typed as strings.; ADM-169: Product, category, ticket type, segment,
  channel and venue are strings; sameProduct, differentProduct and free are strings.; ADM-172: The offer carries its own currency
  field; maximum repetitions and min/max values are strings.; ADM-173: basketValue is a string, and inventory, location and
  fulfilment point are free text.; ADM-174: The input is ten free-text fields, one per domain, with no qualifier, reward or
  link between them.; ADM-179: setBundleDefinition duplicates createBundle (which already carries category, owner, campaign,
  standalone and recommended flags), with effective dates, sales status and standalone as strings.; ADM-180: The component
  carries no product or variant reference and no bundle id; minimum and maximum are strings.; ADM-181: Minimum and maximum
  selections, required/optional and selection order are strings, and the group names no bundle.; ADM-199: Every criterion
  is a free string and nested groups are a string.; ADM-219: totalCampaignBudget is an integer, costCenter is typed Money,
  and the other budgets are strings.; ADM-259: Channels are records created here (salesChannelId) but a fixed enum (Channel,
  SalesChannel) everywhere sales, prices and promotions are recorded.; ADM-261: The assignment carries a currency.; ADM-570:
  listPaymentProviderConnections returns no described schema.; ADM-603: Instalment eligibility uses its own product-kind list
  (membership, annualPass, seasonPass, groupBooking, event), not the catalogue''s ProductKind..'
