    x-ticvai-consumed-by mirror in contracts/spine/tenancy.yaml follows (link-screens-contracts). The three
    operations stay declared on BO-129 Software, Configuration & Version Management, whose own unreached firmware
    reads are left for the lead (they need a visible element).'
