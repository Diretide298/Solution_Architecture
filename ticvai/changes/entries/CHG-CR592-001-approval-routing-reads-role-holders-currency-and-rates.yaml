id: CHG-CR592-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'createApprovalRequest, submitApprovalRequest and evaluateApprovalRequirement ask identity#delegatedAccessRecords,
  tenancy#venueSettingsRecords (and regionSettingsRecords when the venue currency is null) and finance#fxRateRecords in
  process: amounts compare in the venue currency at the reporting rate in force, no rate is 422 fx-rate-unavailable; approvers
  are the live ALLOW holders at or above the scope, no live DENY, active, not the requester, then delegations. A platform-rule
  request writes no request_approver rows and stores the rule''s permission and minimum in two new nullable columns (ApprovalRequestPlatformRule);
  decideApprovalRequest decides it by them. submitApprovalRequest reads the platform rule too.'
decision:
  what: 'ADAM CR-592, posted on #30848: "Decided (Chinmay, 3 November 2026): option A. Build now: createApprovalRequest
    (this ticket) adds three in-process reads to the ones it has: identity#delegatedAccessRecords, tenancy#venueSettingsRecords
    (and tenancy#regionSettingsRecords when the venue''s currencyCode is null) and finance#fxRateRecords. submitApprovalRequest
    (#27833) and evaluateApprovalRequirement (#30850) match rules the same way and add the same reads. submitApprovalRequest
    also reads platform-ops#platformApprovalRuleFor over the service route. Amounts: the request''s venue is the venue node
    of its scopePath. Its currency is that venue''s settings currencyCode, or its region''s currency when that is null.
    An amount in ..." The lead, 3 November 2026: "the new one dont go in r15, log them and we add to r14 only", then "Approve
    them".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-592 (#30848 createApprovalRequest): the approver chain and the amount comparison needed reads it did not declare,
  and the platform rule had no chain.'
