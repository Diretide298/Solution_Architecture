id: CHG-CLN-016
date: '2026-10-02'
source: audit
kind: spec
summary: Six screens declare the entry parameter their operations' paths need, which check-screens reports once the lineage
  is derived afresh; CMS-011 loses a duplicate entryState key and CMS-006 its stale edge to the console.
decision:
  what: 'GST-011 takes cardCode (deep link, as WEB-021), POS-012 dropId (picked on the screen, optional), POS-019 venueId (the
    till session), EMP-055 outletId (navigation), CMS-006 productId and CMS-011 jobId (picked or started on the screen, optional).
    CMS-011 declared entryState twice (the second, empty, silently replaced the first); the empty one goes. CMS-006 drops its
    flow-derived transition to ADM-016, which F102 no longer walks (CHG-WIR-015).'
  by: Chinmay
  date: '2026-10-02'
why: 'check-screens (entry parameters, audit R251) reads operation paths from the lineage; the derive of this branch (CHG-CLN-001)
  added the operations the committed lineage lacked, and check-screens then failed on these six (two from CHG-CLN-006, four
  already on main at e80beb7b and hidden by the stale lineage). The r2 refresh would have failed the same way.'
keys_touched:
  screens:
  - GST-011
  - POS-012
  - POS-019
  - EMP-055
  - CMS-006
  - CMS-011
root_class: A29 JOURNEY-CONTRACT
