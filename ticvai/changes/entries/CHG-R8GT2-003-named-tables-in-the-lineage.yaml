id: CHG-R8GT2-003
date: '2026-10-20'
source: audit
kind: contract
summary: 'Six r8 operations whose descriptions name a table they write or read now say so as contract facts, and the
  outcome call says which column its request id matches: reportBundleApplied writes catalogue.bundle_application,
  forceLogout writes identity.authz_audit, guestSocialLogin and guestUaePassLogin read and write pii.subject_identity,
  completeSsoAuthorization reads and writes identity.principal_external_identity, listCellEndpoints no longer names
  control.cell (it reads the endpoints only), and recordApprovedActionOutcome''s requestId is
  approved_action_execution.approval_request_id.'
decision:
  what: 'contracts/spine/catalogue.yaml reportBundleApplied, contracts/spine/identity.yaml guestSocialLogin,
    guestUaePassLogin, completeSsoAuthorization: `x-ticvai-writes` / `x-ticvai-reads` naming the table and what for.
    forceLogout: identity.authz_audit added to its lineage override in handoff/api-data-lineage-overrides.json, with
    the reason, because no schema persists to that table and derive-lineage takes x-ticvai-writes only for a table a
    schema persists to. contracts/spine/tenancy.yaml listCellEndpoints and PlatformCellEndpoint: "with
    `control.cell`" and "keyed to `control.cell`" reworded to the cell it serves. contracts/spine/approvals.yaml
    recordApprovedActionOutcome path parameter
    requestId: `x-ticvai-column: approvals.approved_action_execution.approval_request_id`.'
  by: Chinmay
  date: '2026-10-20'
why: 'Finding: check-parameter-columns P-NAMED-TABLE (6 new) and P-PARAM-NO-COLUMN (1 new) at the r8 release rehearsal
  on 5dc6fe1f. The tables are new in r8 (CHG-R8MIG-015, CHG-R8MIG-018) and the outcome call is CHG-R8DEC-002; the
  descriptions named them before the lineage did, which derive-lineage reads only from contract facts since
  CHG-R8GEN-001.'
keys_touched:
  operations: [reportBundleApplied, forceLogout, guestSocialLogin, guestUaePassLogin, completeSsoAuthorization,
    listCellEndpoints, recordApprovedActionOutcome]
  files:
  - contracts/spine/catalogue.yaml
  - contracts/spine/identity.yaml
  - contracts/spine/tenancy.yaml
  - contracts/spine/approvals.yaml
  - handoff/api-data-lineage-overrides.json
root_class: 'a write stated in words that no contract fact gives the lineage'
tickets:
  started: []
  unstarted: []
release_tag: r8
decision_owner: Chinmay
adam_cr: 'none: r8 gate, a release fix'
triage: blocker
prevention:
  type: check
  ref: tools/check-parameter-columns.py
status: open
