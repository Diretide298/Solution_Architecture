  - viewer/mcp/setup/starters/backend/tests/TICVAI.UnitTests/Security/PermissionVectorTests.cs
  - viewer/mcp/setup/starters/backend/tests/TICVAI.UnitTests/TICVAI.UnitTests.csproj
