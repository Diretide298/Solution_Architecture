id: CHG-LIN-002
date: '2026-10-14'
source: developer
kind: plan
proposed: '2026-10-14'
summary: 'DB-READ-VIEWS says how a view''s columns are chosen: the union of its readers'' readColumns from the
  lineage, every pii view a column list and never all columns.'
decision:
  what: 'docs/active/block-a-extra-tasks.json, DB-READ-VIEWS detail: after the view shape, "The columns are
    generated, not chosen": each lineage entry carries readColumns (derived by tools/derive-read-columns.py from the
    response schemas, the parameters, the join keys and docs/active/read-columns-override.yaml); a view''s columns
    are the union of readColumns[table] over the reader module''s operations that read the table; a read with no
    list keeps every column except over pii.*, where every cross-module read has a list (check-read-columns fails one
    without), so a pii view is always narrow. Done-when gains "each exposing exactly the union of its readers''
    readColumns (every pii view a column list, never all columns)".'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-004 (ticket #27654 DB-READ-VIEWS): the 12 October decision built all-column views except over pii.*,
  narrowed by hand, until the lineage carried per-read column lists; CHG-LIN-001 makes the lineage carry them in r6,
  so the task text names where the columns come from. ADR-0055 rule 2.'
