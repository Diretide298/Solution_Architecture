notes: 'check-screen-wiring S-DUP-SCREEN fails on two screens of one platform declaring the same operations, which is how
  the five full merges were found once the move put them on P08. **Flows the merge breaks (for the flows owner, screens-other;
  not a rename, so not edited here):** F147 step 18 (listRulePriorityConflict on ADM-097: the step moves to BO-441), F164
  step 8 (listApprovalMatrices and setApprovalMatrix on ADM-242: BO-086), F165 step 2 (listApprovalRequests and decideApprovalRequest
  on ADM-249: BO-084) and step 8 (listSlaEscalationBottleneck on ADM-252: BO-391); check-flows reports these six errors on
  this branch, and each board then needs its edge to the venue screen. **For the P08 owner:** BO-441 requires the games module
  and BO-528 resources, so a venue without them cannot reach rule priority or the strategy list from there; BO-009 labels
  price-list priority "Higher number wins" and shows the overlapping lists (DEC-101; ADM-049 is now its section). The section
  merges keep duplicate writers (setPriceListMaster beside createPriceList, setPromotionRule beside createPromotion, setBundleDefinition
  beside createBundle ...): retiring them is CHG-MOV-008. Design-note corrections on the five full anchors are withdrawn (the
  anchor is not built).'
