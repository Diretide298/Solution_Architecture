summary: 'Thirty-two moved screens that duplicate a venue screen are merged with it: five as full anchors with no operations
  of their own, twenty-seven as sections of the venue screen; ADM-088 stops changing a strategy''s state.'
decision:
  what: 'Full merges, the ids kept as anchors that route to the venue screen and declare nothing (as BO-031 and the M24-03
    merges): ADM-097 into BO-441, ADM-242 into BO-086, ADM-249 into BO-084, ADM-252 into BO-391, ADM-611 into BO-1146. Section
    merges, rendered inside the venue screen''s component under its route and keeping their own operations because the first-release
    slice and its pushed tickets name them: ADM-049 into BO-009, ADM-051 into BO-009, ADM-052 into BO-009, ADM-053 into BO-011,
    ADM-178 into BO-011, ADM-179 into BO-011, ADM-180 into BO-011, ADM-181 into BO-011, ADM-119 into BO-007, ADM-131 into
    BO-008, ADM-121 into BO-117, ADM-138 into BO-010, ADM-140 into BO-010, ADM-141 into BO-010, ADM-148 into BO-010, ADM-157
    into BO-010, ADM-158 into BO-010, ADM-159 into BO-010, ADM-169 into BO-010, ADM-172 into BO-010, ADM-173 into BO-010,
    ADM-174 into BO-010, ADM-199 into BO-010, ADM-210 into BO-010, ADM-145 into BO-084, ADM-243 into BO-087, ADM-244 into
    BO-388. ADM-088 lists strategies and ADM-089 changes their state (transitionDynamicPricingStrategy).'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026: DEC-100 (batch 1, ADM-049) "merge them with BO-008 to BO-011 ... so one surface edits each
  record", and the pre-apply round, "Duplicate screens: merge as proposed" (one screen per job, merged ids kept as anchors).
  The design-notes consistency entries name the pairs (ADM-049 and ADM-052 with BO-009; ADM-053, ADM-178, ADM-179 with BO-011;
  ADM-138, ADM-148, ADM-159 with BO-010; ADM-097 with BO-441; ADM-145 and ADM-249 with BO-084; ADM-119 with BO-007; ADM-121
  with BO-117; ADM-131 with BO-008; ADM-611 with BO-1146); CHG-CSA-044 names the promotion builders. On one platform the five
  full merges declared the same operations as the venue screen (check-screen-wiring S-DUP-SCREEN), as ADM-088 did with BO-528.'
