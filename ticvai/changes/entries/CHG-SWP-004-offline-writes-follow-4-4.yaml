id: CHG-SWP-004
date: '2026-10-14'
source: audit
kind: process
summary: 'check-screen-wiring reads every screen''s offline story against frontend-patterns 4.4: an offline app''s
  screen that refuses offline a write its contract marks offline-capable (S-OFFLINE-REFUSED), and a screen that
  promises to queue a write that is not offline-capable, or a web app''s screen that queues at all (S-OFFLINE-QUEUED).'
decision:
  what: 'tools/check-screen-wiring.py gains S-OFFLINE-REFUSED and S-OFFLINE-QUEUED beside S-OFFLINE-CLAIM (R257, which
    caught only a screen whose every write is online-only), with a narrower queue promise (QUEUE_PROMISE: not "queue"
    the noun) and the words of a refusal (OFFLINE_REFUSAL). The 48 findings on r6 are added to the check''s baseline;
    the check''s existing rules and their baseline are untouched.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding on r6 (594e51a2), the #27741 sweep, class C4 (Chinmay, 14 October 2026: "Once done can we check rest of the things for similar
  patterns?"). frontend-patterns 4.4 (viewer/mcp/setup/starters/docs/frontend-patterns.md): in an offline app a write
  marked x-ticvai-offline-capable true goes through the one offline store''s outbox; every other write is disabled
  offline with the reason on screen; a web app queues nothing. The screens and contracts contradict it: GST-070
  declares offline false while joinRestaurantWaitlist is offline-capable, POS-004 says "Not available offline" for
  createOrder and createPayment, both offline-capable, BO-097 (a web back office) says "Queued locally" for five
  writes, and EMP-006 says "Queues locally" for cancelWorkOrder, closeWorkOrder, recordWorkOrderParts and
  verifyWorkOrder, none offline-capable. Either the contract flag or the screen is wrong; a person decides which.'
keys_touched:
