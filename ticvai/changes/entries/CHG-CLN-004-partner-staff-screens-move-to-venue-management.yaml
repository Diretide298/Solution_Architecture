id: CHG-CLN-004
date: '2026-10-02'
source: cr
kind: spec
summary: The partner-portal screens that call staff-only writers (PTR-026, 029, 035, 036, 037, 039, 047, 048) move to Venue
  Management as staff screens; their list reads gain the staff audience.
decision:
  what: 'Move the eight screens from P10 to the end of P08 (ids kept; venue-management-web; audience staff; requiresModule
    partner), reached from Venue Home BO-100 since their board hubs PTR-022, PTR-032 and PTR-042 stay on the partner portal
    and lose the edges. The partner they edit comes from the row picked (entry parameter partnerId from navigation, optional),
    not the session; PTR-029, PTR-035 and PTR-036 draw the list as the table it is picked from. staff joins the audience
    of listTerritoryMarketDistribution, listPartnerAccessRole, listCommissionMarginIncentive, listCreditLimitExposure,
    listDepositGuaranteeFinancial, listCommercialAllocationQuota, listPartnerReconciliationException and listCommissionCalculationSettlement
    (additive). Flows: F131 and F132 drop the moved spokes; F110 drops the PTR-029 round trip and says where the profile
    is chosen now.'
  by: Chinmay
  date: '2026-10-02'
why: 'The lead''s call of 2 October 2026 (recommended, logged; audit TODO "the PTR staff-only screens move to Venue Management
  as staff screens"): each declares a writer whose audience is staff only (setPartnerDistributionRights, setPartnerCapabilityGrants,
  setPartnerCommissionRules, setPartnerCreditProfile, setPartnerSecurity, setPartnerAllocations, actOnPartnerReconciliationException,
  actOnPartnerCommissionLine, actOnPartnerSettlementBatch), so a partner could never save them (R254, check-audience-match).'
