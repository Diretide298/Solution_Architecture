id: CHG-CR571-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'ApiClient.clientId is the public half of the credential pair, made by the server on every create
  (tvc_live_ or tvc_test_ then 32 lowercase letters and digits from a secure source), never changed, NOT NULL in storage
  (x-ticvai-column-nullable: false) with a unique index (exact), one retry on a clash; the prefix decides nothing.
  decideProductionAccess names the production client after the sandbox client at the decision; issueApiToken finds the
  client by clientId; a replayed createApiClient answers 201 with the client and no clientSecret, which the idempotency
  record never holds.'
decision:
  what: 'Posted on #31296 (Chinmay, 3 November 2026), under the lead''s "Dont hold r13. approve them and rever tto the devs" of 3 November 2026: "1. Name of the production client ... name = the
    sandbox client''s name as it stands at the decision ... 2. What a client id is. ApiClient.clientId is the public half
    of the credential pair ... ''tvc_live_'' for a production client or ''tvc_test_'' for a sandbox client, then 32
    lowercase letters and digits ... Storage: a forward migration on control.api_client gives every existing row whose
    client_id is null a value made the same way, then makes client_id NOT NULL with a unique index ... 3. A replay never
    carries a secret ... What is written to platform.idempotency_record is that answer with clientSecret removed."'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-571 (#31296 decideProductionAccess): a new client''s name and clientId were unspecified (client_id
  nullable, no unique index, though issueApiToken needs it and DEV-003 shows it), and a replay returning the first
  answer contradicted "returned once and never again".'
keys_touched:
  operations: [createApiClient, decideProductionAccess, issueApiToken]
  schemas: [ApiClient]
  tables: [control.api_client]
  files:
  - contracts/satellite/public-api.yaml
  - tools/derive-schema.py
  - tools/check-business-rules.py
root_class: 'contract against storage: a value the server must make, with no rule for making it'
tickets:
  started:
  - '31296 (decideProductionAccess, Ready for QA): the name rule and the server-made clientId, as posted.'
  - '31295 (createApiClient, On hold): the clientId and the replay without the secret, with the two tests posted.'
  unstarted:
  - '29552 (SVC-PLATFORM-PUBLICAPI-5, issueApiToken, Sanket Keluskar): find the client by client_id, as posted.'
  - 'New [DB] child of MIG-CONTROL (#27647) for the migration owner: fill client_id on rows where it is null (the same
    tvc_live_/tvc_test_ rule by environment), then ALTER COLUMN client_id SET NOT NULL (handoff/migration-review.md lists
    it); the unique index comes from the release''s forward migration.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-571
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-API-CLIENT-ID
status: open
notes: 'Beyond the posted words: clientId carries the pattern ^tvc_(live|test)_[a-z0-9]{32}$; the NOT NULL is the same
  derive-schema rule as CR-566 (x-ticvai-column-nullable: false). Not changed: rotateApiCredential''s replay (the
  draft named it; the decision did not).'
