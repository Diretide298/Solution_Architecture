status: closed
closed_by_commit: 5735d15e
notes: 'check-design-notes now validates `decisions` (fields, date, a DEC id and an existing CHG id in source, questionSource
  resolved, no question left in both lists) and correction `status`/`by` (fixed, logged or withdrawn, by an existing change
  entry), and refuses any CHG id a source names that has no entry. Before this change the notes had no `decisions` key,
  so nothing recorded that a question was answered.


  Decisions by kind: {''answered'': 2, ''default accepted'': 8}.


  Corrections by entry: CHG-WIR-025 238 fixed; CHG-WIR-026 36 fixed; CHG-WIR-027 134 logged. Corrections with no status
  (519) are still open.


  Tickets: none started (Block A starts Monday 5 October 2026); the notes feed the design batches at the next refresh,
  not ticket text.


  Answers that change the drawn default:

  - DEC-100 (Q100) ADM-049: The 410 workshop-pack screens on the TICVAI Console (370 Commercial, 20 Catalogue lifecycle,
  20 Rules and workflow) are venue screens: move them to Venue Management (P08) and merge them with BO-008 product, BO-009
  price matrix, BO-010 promotions, BO-011 bundles and the rules/workflow screens, so one surface edits each record. TICVAI
  staff reach them only through a platform-staff grant (R098).

  - DEC-168 (Q168) ADM-122: Industry standard for production change: never merge or reverse-migrate production databases.
  Schema goes forward-only through versioned migrations (expand then contract). Configuration moves as a versioned package
  exported with stable keys, diffed against production, approved, applied as an idempotent upsert by key, and audited;
  rollback re-applies the previous package. Secrets and environment settings never travel in it.


  Rule edits:

  - ADM-049 add outputs (DEC-100)

  - ADM-122 add outputs (DEC-168)'
