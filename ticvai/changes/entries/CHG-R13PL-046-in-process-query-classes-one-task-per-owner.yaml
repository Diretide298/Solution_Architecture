notes: 'Query names confirmed on fix/r13-r''s contracts (accreditation.yaml, approvals.yaml, tenancy.yaml, workforce.yaml,
  catalogue.yaml, promotions.yaml, orders.yaml, payments.yaml, access.yaml). The plan has no task under a task or sub-task,
  so the ticket the work belongs to is named in the task''s text; its OpenProject parent is the app-module the plan places
  it in, and it follows the migration that creates its tables. A change-only [DB] task is `area: database` and its key does
  not end in -DB (a -DB task''s `table` builds count as created by it, CHG-R8MIG-016, CHG-R12PL-008).'
