notes: 'Batch R5, 7 October 2026. Chinmay waived the cooling-off for r3 ("Rebalance (Recommended)"; the migration move
  itself under "Can we do that now instead of friday", CHG-R5-001). Measured 7 October against the r2 plan regenerated
  on a clean tree: Block A last work 25 November as in r2, block test 25-27 November ending 30 November as in r2, and
  the A1 work past its window 7 developer-hours (r2 18; 43 accepted); A2 last work 7 December (r2 4 December, no
  overrun; the kiosk app-module, scheduled after Block B, waits for MIG-WHITELABEL-2 in Hrushikant''s queue); B 16
  December (r2 14), C 4 January, D 9 February, every block on its target sprint and none over its window. Hrushikant:
  296 tasks and 1,393 points in r2, 382 and 1,537 after (all 223 migrations); Sprints 1-3 and 5-7 full as in r2, Sprint
  4 7.2 of 10 days (r2 7.5), Sprint 8 6.2 (r2 0.5). Pushed owners that change: 47 moves, 18 VM-MIG tasks and the two
  module tests of CHG-R5-001; 536 pushed tasks change sprint (834 without the rebalance). check-plan-owners'' known
  self-tests fall from 26 to 22.'
