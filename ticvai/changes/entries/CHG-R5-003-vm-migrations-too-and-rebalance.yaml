id: CHG-R5-003
date: '2026-10-07'
source: cr
kind: plan
proposed: '2026-10-07'
summary: The Venue Management migrations (VM-MIG-*) are Hrushikant Patkar's too, and 47 of his other pushed tasks move
  to the people who lost migration work, so Block A keeps its r2 dates (A1 last work 25 November, block test 25-27
  November ending 30 November).
decision:
  what: 'docs/active/team.json `migrations.keys` becomes ^(VM-)?MIG- (CHG-R5-001''s rule, now 223 tasks; the lead
    reassigns the VM-MIG tickets in OpenProject). docs/active/block-a-extra-tasks.json gains `ownerMoves` {key: {from,
    to}}: 47 pushed tasks of Hrushikant Patkar move, Pallavi Sawant 27, Tanmay Dukhande 13, Pranay Shinde 3, Deep
    Khanvilkar 2, Sanket Keluskar 1, Chinmay Patkar 1 (all back-end or module tests in the back-end stack; a helper
    only within their backendHelpers cap; a module test never to its app-module''s main builder). The list is in the
    file; it was found by a search over the schedule that moved the fewest pushed tickets and changed the fewest
    pushed sprints, and left out every task the r2 schedule started by 7 October (SETUP-HOSTS, SETUP-QDRANT,
    DB-READ-VIEWS, DB-ROLES), which may be in progress. tools/sprint_plan.py owner_moves; tools/build-service-docs.py
    applies a move after the pins and the migration rule while `from` still holds the task; tools/derive-block-a-schedule.py
    drops the pin it leaves. check-plan-owners gains O-MOVE (a moved task not owned by `to`, plan or schedule).
    Hrushikant keeps every migration, his DevOps and setup tasks and the rest of his work.'
  by: Chinmay
  date: '2026-10-07'
why: 'Chinmay, 7 October 2026, relayed by the lead: "Rebalance (Recommended)", and the Venue Management migrations to
  Hrushikant as well. CHG-R5-001 measured the cost of one person holding every migration: Block A''s last work moved
  from 25 November to 7 December and the A1 work running past its block-test window from 18 to 194 developer-hours;
  with VM-MIG too, 14 December and 273 hours, and Block B ran into its window. Migrations are hard waits for every
  service, so the chain on one person held everyone else.'
