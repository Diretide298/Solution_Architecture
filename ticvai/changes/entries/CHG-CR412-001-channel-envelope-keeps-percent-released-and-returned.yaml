id: CHG-CR412-001
date: '2026-10-31'
source: cr
kind: contract
summary: 'catalogue.channel_envelope gains envelope_percent (the posted allocation_percent, named by naming-and-style 3),
  released_units and returned_units (ChannelAllocation
  allocationPercent, readOnly releasedUnits and returnedUnits, both default 0). setChannelAllocations requires
  allocationPercent for a percentage allocation (400 validation) and sizes allocated_units from it;
  relinquishChannelAllocation adds the units it frees to returned_units and the allocation release job to
  released_units. listInventoryCapacityChannel answers allocation, released and returned from the columns, filters a
  product by its event''s performances (an unknown product is an empty page), orders by channel, capacity pool, id, and
  answers aiInsights empty (LO-CR412-001).'
decision:
  what: 'ADAM CR-412, posted 31 October 2026: "Decided (Chinmay, 31 October 2026): as you recommended.
    catalogue.channel_envelope gains allocation_percent (0 to 100), released_units and returned_units (both default 0).
    setChannelAllocations takes allocationPercent for a percentage allocation; it is required there (400 validation on
    allocationPercent when missing) and sets allocated_units to the floor of capacity x percent / 100. In the same
    transaction as each release, relinquishChannelAllocation adds the units it frees to returned_units, and the
    allocation release job adds them to released_units ... The product filter keeps the pools of the performances of
    the product''s event ... Order by channel (sales_channel_id, nulls last), then capacityPool (channel_capacity_id),
    then id ... aiInsights is an empty list until an insight source is declared." The lead, 31 October 2026, on the
    settled CRs: "Include them in r12".'
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM CR-412 (Hrushikant Patkar, #35242 listInventoryCapacityChannel): catalogue.channel_envelope had no percent,
  released or returned column though envelope_type allows percentage, the product filter had no path to a pool, and the
  order''s second key sat inside replenishment_rule jsonb. Counters kept on the row in the release transaction follow
  how sold and leased are kept (SD-023); the order follows the r10 default ruling (CHG-R10GEN-004); pack p.10, MoM 31
  Aug 2026 section 4.11.'
keys_touched:
  screens: [ADM-262]
  operations: [setChannelAllocations, relinquishChannelAllocation, listInventoryCapacityChannel]
  schemas: [ChannelAllocation, InventoryCapacityChannelAllocationView]
  tables: [catalogue.channel_envelope]
  files:
  - contracts/spine/catalogue.yaml
  - docs/active/left-out.yaml
  - tools/check-business-rules.py
root_class: 'displayed counts (released, returned) and an allocation type''s size (percent) that no column holds and no
  writer keeps'
tickets:
  started:
  - '35242 (listInventoryCapacityChannel, Hrushikant Patkar): answer allocation, released and returned from the new
    columns; replace the product filter''s 400 with the event path; order by channel, capacity pool, id.'
  - '31628 (setChannelAllocations): take allocationPercent for percentage allocations and size allocated_units from it.'
  - '31627 (relinquishChannelAllocation): add the freed units to returned_units; the allocation release job adds them to
    released_units.'
  - '27671 (MIG-CATALOGUE, Hrushikant Patkar): the three columns as a [DB] child task (to be filed by the plan lane).'
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-412
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-CHANNEL-ALLOCATION-COUNTS
status: open
notes: 'Differs from the posted column name: the percent column is envelope_percent, not allocation_percent
  (naming-and-style 3 bans Allocation in DDL, Envelope is the term, as allocationType is envelope_type;
  check-ddl-conventions D-BANNED-NAME); the API field stays allocationPercent. As generated by the package''s column
  rules it is numeric(18,4) with the 0 to 100 range on the contract (the db note says numeric(5,2) with a CHECK), and released_units and returned_units are integer DEFAULT 0
  (readOnly, so not required in the request). The product read is declared in the contract (x-ticvai-reads
  catalogue.product). ADM-262 keeps the aiInsights member; LO-CR412-001 names it.'
