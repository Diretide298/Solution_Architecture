id: CHG-R4-014
date: '2026-10-06'
source: design-input
kind: contract
summary: A performance carries its "minutes on screen" (how long after its start it is still sold), and time-slot
  creation takes the slot length and the first and last start time of each day, as agreed in DI-167, DI-169 and
  DI-995; BO-015 binds them.
decision:
  what: 'Additive. contracts/spine/catalogue.yaml: Performance and CreatePerformancesRequest gain minutesOnScreen
    (integer 0-1440, default 0); updatePerformance''s body gains it too (not a timing change, so a sold performance
    accepts it). CreatePerformancesRequest gains slotLengthMinutes (optional; must agree with endsAt minus startsAt)
    and recurrence.firstStartTime and recurrence.lastStartTime (HH:MM on the region''s clock; omitted, the series
    behaves as before). createPerformances gains a 422 slot-window-invalid. The entry window stays with the admission
    rules (admissionRulesId). screens/P08-venue-back-office.yaml BO-015 shows minutesOnScreen in the calendar table and
    the performance panel, and its Create time slots notes and form name the new fields. check-contract-shapes gains
    C-SERIES-WINDOW.'
  by: Chinmay
  date: '2026-10-06'
why: 'Agreed with the client on 7 August (DI-167, DI-169: sources/mom/TICVAI_BackendDeepDive_MoM_07Aug2026.docx
  section 14) and 24 September (DI-995, M24-01), and promised by BO-015''s Create time slots notes and its design notes
  (handoff/design-notes/ticketing-backoffice.yaml BO-015 inputs), but the contract had no field for the minutes on
  screen and no way to stop a series at a last start time: a series every 30 minutes ran through the night. Defect 4 of
  the lead''s r2 fix list, 6 October 2026.'
keys_touched:
  screens:
  - BO-015
  operations:
  - createPerformances
  - updatePerformance
  - listPerformances
  - getPerformance
  schemas:
  - Performance
  - CreatePerformancesRequest
  tables:
