  - screens/P08-venue-back-office.yaml
  - tools/check-contract-shapes.py
root_class: 'new: decision-applied-in-part'
tickets:
  started:
  - APP-SETUP-BO-015
  - APP-SETUP-BO-015-REST
  unstarted:
  - SVC-CATALOGUE-EVENT-1
  - SVC-CATALOGUE-EVENT-3
  - MIG-CATALOGUE
prevention:
  type: check
  ref: tools/check-contract-shapes.py
notes: 'Batch R4, 6 October 2026. C-SERIES-WINDOW (a schema whose series repeats every intervalMinutes and has no last
  start time of the day) fails on the commit before this fix with catalogue.CreatePerformancesRequest.recurrence and
  passes after it. No check can see that an agreed design input names a field the contract lacks ("minutes on
  screen"); that part rests on the design notes the process agents write. **Started tickets:** APP-SETUP-BO-015
  (Pallavi Sawant) is scheduled from day 0.51 and APP-SETUP-BO-015-REST (Pradnya Yeram) from day 1.87 of Block A
  (handoff/service-docs/block-a-schedule.json; no status snapshot is in git), so both are taken as started: they are
  not rewritten, and the release gives each a comment and a linked delta ticket for the new fields. The lead confirms
  their state in ADAM. The additive fields leave what they started on valid.'
decision_owner: Chinmay
adam_cr: pending (the lead raises the ADAM CR for r2; the request is the lead's r2 fix list of 6 October 2026)
triage: fix-forward
