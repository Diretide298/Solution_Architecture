id: CHG-R6-020
date: '2026-10-12'
source: cr
kind: contract
proposed: '2026-10-12'
summary: 'Every write into a table another deployable owns now names the route ADR-0055 rule 4 gives it: an event the
  owning module consumes, or the owner''s published operation, stated as x-ticvai-write-via on the operation and
  copied into the lineage as writeVia. 78 cross-deployable writes by 69 operations: 29 by event, 32 by the owner''s
  operation, 17 on a dated exception list. The kernel grants are exactly the four agreed, and a new check fails on a
  write with neither a route nor an exception.'
decision:
  what: 'Option A, which ADR-0055 rule 4 already decides. Every cross-deployable write goes by event (ADR-0057,
    consumed by the owning module, which performs the write) or by a call to the owner''s published HTTP operation;
    within one deployable rule 3 stands. The route is `x-ticvai-write-via: [{table, event | operation}]` on the
    operation in its contract (52 operations in 15 contracts), and tools/derive-lineage.py copies it into
    handoff/api-data-lineage.json as `writeVia`. Nine events are added (entitlement.voided, entitlement.reissued,
    entitlement.shareChanged, invitation.issued, paymentToken.stored, biometric.enrolmentChanged, guest.merged,
    reporting.questionAnswered, tenantDomain.mapped) and eight extended additively (order.paid, order.created,
    entitlement.statusChanged, entitlement.transferred, approval.granted, approval.rejected, wallet.credited,
    reporting.definitionPublished): new emitters in emittedBy and consumers that name the owner''s tables under a new
    optional `writes` key (events/_schema.yaml). The kernel tables every role is granted directly are exactly
    platform.outbox INSERT, platform.scope SELECT, platform.audit_record INSERT and platform.idempotency_record
    SELECT/INSERT/UPDATE; they and the 17 writes that cannot route yet (each with its reason, added date and removal
    release r5) are docs/active/cross-deployable-writes.yaml. The readable table per write for the backend developer
    is handoff/cross-deployable-writes.md, written by the check with --write; ADR-0055 action item 8 points to both.'
  by: Chinmay
  date: '2026-10-12'
why: 'ADAM CR-002, raised by the backend developer on ticket #27655 (DB-ROLES): DB-ROLES grants each deployable''s
  role DML only on the schemas its own modules own (ADR-0055, handoff/service-decomposition.json), and the lineage
  still recorded 81 writes by 72 operations into another deployable''s tables as the caller''s own SQL, every one of
  which PostgreSQL refuses at runtime. Chinmay chose option A on 12 October 2026, the route ADR-0055 rule 4 already
  states. Three of the 81 were not real writes and are corrected in CHG-R6-021.'
