notes: 'Batch R6, 12 October 2026. The contract change is additive against r1 (a new x- extension, not one of
  check-contract-compat''s semantic keys); the events change additively (new events, new emitters, new consumers, a
  new optional consumer key). New emitters gain platform.outbox in the lineage through derive-lineage --apply
  (W-OUTBOX). The 17 exceptions are 15 misplaced tables (CrossRegion''s and platform-ops'' records in the platform
  schema, OrderService''s sync.rejection in CrossRegion''s sync schema), where the lead decides between moving the
  table and a table-level grant, and 2 personal-data writes (pii.consent_identifier, pii.subject from
  updateMyProfile) that wait for an Identity operation, because an event would copy the data into platform.outbox.
  The DB-ROLES ticket text is not rewritten here; the developer reads the routes from
  handoff/cross-deployable-writes.md, which ADR-0055 action item 8 names.'
