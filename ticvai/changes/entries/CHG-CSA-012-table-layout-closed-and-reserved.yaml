id: CHG-CSA-012
date: '2026-10-02'
source: cr
kind: contract
summary: Removing a table marks it out of service, a paid table shows a short Table closed state ended by Make available,
  and a table shows Reserved when named or N minutes before a pre-allocated booking.
decision:
  what: setTableLayout never deletes (Remove table = outOfService); states/table.yaml adds the setTableLayout transition,
    names needsClearing "Table closed" and its exit "Make available", and guards reserved by the outlet's FnbReservationPolicy.reservedLeadMinutes
    (new, null = named tables only).
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October, workbook Q67 (POS-024; DEC-067), Q201 (EMP-052; DEC-201, default) and Q202 (EMP-052; DEC-202):
  "Mark out of service"; "A short Table closed state, then Make available"; "Reserved when a booking names the table,
  or N minutes (venue-set) before a pre-allocated booking". DI-336, DI-689.'
keys_touched:
  operations:
  - setTableLayout
  - clearTable
  schemas:
  - TableStatus
  - FnbReservationPolicy
  screens:
