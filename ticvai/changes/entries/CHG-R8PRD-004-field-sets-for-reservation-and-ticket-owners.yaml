id: CHG-R8PRD-004
date: '2026-10-20'
source: mom
kind: contract
summary: 'Field sets (the existing system''s data masks) are configured per venue with text, drop-down, radio and
  check-box fields (listFieldSets, getFieldSet, setFieldSetDefinition), and a product links the set its sale asks the
  buyer (reservation owner) and, only where the ticket needs one, each ticket owner (getProductOwnerFieldSets,
  setProductOwnerFieldSets). Additive.'
decision:
  what: 'contracts/spine/catalogue.yaml, appended: GET /field-sets, GET and PUT /field-sets/{fieldSetId} (400
    validation for options and keys, 409 duplicate-code, field-key-retyped, field-set-in-use), GET and PUT
    /products/{productId}/owner-field-sets (422 unknown-field-set, inactive-field-set); schemas FieldSet
    (catalogue.field_set), FieldSetField (catalogue.field_set_field), FieldSetOption, ProductOwnerFieldSets
    (catalogue.product_owner_field_set). Captured values are stored under each field''s key in the dataMaskValues the
    order line already carries.'
  by: Chinmay
  date: '2026-10-20'
why: 'Minutes of 16 October 2026 (sources/mom/TICVAI_MoM_2026-10-16_TicketingConfig_Wireframes_Plan.md), 4.13: Allam
  asked for "a configurable field set (called a data mask in the existing system): create it in the configuration,
  design it with custom fields (text, drop-down, radio, check box), and link it to the product so the fields appear
  automatically at sale"; a ticket owner only for tickets such as memberships and seasonal passes; section 5:
  "Reservation owner and ticket owner fields come from a configurable field set linked to the product". The package
  named a "data mask" (Product.dataMaskValues, orders dataMaskValues, the bundle''s "data mask field definitions")
  with no operation that defines one.'
