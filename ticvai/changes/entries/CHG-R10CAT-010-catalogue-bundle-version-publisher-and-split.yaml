id: CHG-R10CAT-010
date: '2026-10-25'
source: cr
kind: contract
summary: 'publishBundle writes one catalogue.published_bundle row per publish, numbered per venue (unique on venue_id
  and version), keeping the note; staleAfterHours defaults to the venue''s offline policy maxOfflineHours through a new
  tenancy#offlinePolicyRecords query (24 where none is saved); an unknown venue is 404. updateBundle treats
  allocation_split and allocation_component as the record of the split and derives bundle.allocation; savingsAmount
  uses the list prices captured on allocation_component; an unknown bundle is 404.'
decision:
  what: 'ADAM CR-110, option 1 with option 2''s stale default, accepted 15 October 2026 (the DECISION line).
    contracts/spine/catalogue.yaml publishBundle (read-vias tenancy#scopeRecords and tenancy#offlinePolicyRecords, the
    rules, 404), CatalogueBundle (x-ticvai-unique-together [venueId, version], version described, note added);
    contracts/spine/tenancy.yaml offlinePolicyRecords (a data read of platform.offline_policy, in process and
    service); contracts/satellite/promotions.yaml updateBundle (the split, savingsAmount, 404, the allocation_split
    write), CreateBundleRequest.allocation and Bundle.savingsAmount described.'
  by: Chinmay
  date: '2026-10-15'
why: 'ADAM CR-110 (Deep Khanvilkar, #28023 publishBundle and updateBundle), accepted 15 October 2026 for the next
  release and moved to r10.'
keys_touched:
  operations: [publishBundle, updateBundle]
  schemas: [CatalogueBundle, BundleSummary, Bundle, CreateBundleRequest, OfflinePolicy]
  tables: [catalogue.published_bundle, platform.offline_policy, promotions.bundle, promotions.allocation_split,
    promotions.allocation_component]
  files:
  - contracts/spine/catalogue.yaml
  - contracts/spine/tenancy.yaml
  - contracts/satellite/promotions.yaml
root_class: 'storage gap: a response a table cannot store, and a default with no declared source'
tickets:
  started: []
  unstarted:
  - '28023: CR-110''s settlement; its pointer body picks the fix up at r10.'
  - 'MIG-CATALOGUE (catalogue.published_bundle): a child task for Hrushikant Patkar for the note column and the unique
    index; not applied while server databases are frozen.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-110
triage: blocker
prevention:
  type: generator-rule
  ref: tools/derive-ddl.py::x-ticvai-unique-together
status: open
notes: 'Already in r9: published_at and published_by (CHG-R8MIG-015), Ed25519 signing (CHG-R8SPN-022), the finance
  tax-code query (CHG-RTE-001). Database (generated): published_bundle.note text (500) and
  published_bundle_venue_id_version_uniq on (venue_id, version), exact (version is a decimal string). version stays a
  string on the wire, carrying the per-venue integer as its decimal digits, so no response type changes; changing it
  to integer would be a breaking change across getLatestBundle''s since and bundle_application, which the decision did
  not ask for.'
