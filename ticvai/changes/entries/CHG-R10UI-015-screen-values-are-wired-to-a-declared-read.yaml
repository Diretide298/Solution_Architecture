notes: 'Still failing, each for the lead: ACC-005 and ACC-008 (no guest or staff read answers the badge''s holder name,
  zones and expiry: a contract change), BO-305 and BO-355 (pack workspace views of 20 to 30 fields with no read; each
  field needs mapping to Order or Entitlement), POS-012 (no declared write takes the cart''s order type,
  FnbOrder.serviceMode), and ADM-097, ADM-252, ADM-611 (merged screens the check should not judge). BO-036 and BO-069''s
  picker reads are new S-OP-UNREACHED findings: a form''s picker cannot name the read that fills it.'
