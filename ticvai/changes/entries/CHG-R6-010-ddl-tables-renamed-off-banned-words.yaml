notes: 'Batch R6, 12 October 2026. The baseline is frozen at r1, so every rename is listed in handoff/migration-review.md
  for the developer ("table renamed", "column renamed", "after rename", "index after rename", "constraint after rename")
  and none is generated; V0102 gains nothing from it. check-ddl-conventions D-RENAME-APPLIED fails on a declared rename
  the schema reference does not show, and D-BANNED-NAME on a banned word the DDL takes after r1 (CHG-R6-012). Not
  renamed, because CR-011 did not list them: seating.hold_pool, seating.hold_type, marketing.legal_hold,
  orders.reservation_hold_policy and the hold_* time columns; r1 already has them, so D-BANNED-NAME does not fail on
  them. Started MIG tickets are not rewritten: the rename is a forward migration. Swept with the rename: the table names
  hardcoded as lookups in tools (check-package CURRENCY_OK, derive-burst-scope, derive-table-notes) and the burst model,
  the documents check-doc-tables --fix rewrote (renames-26-august.md exempted: a record of the August rename), and
  check-parameter-columns, which now lets a renamed table answer to the wire''s old name (getSeatHold keeps holdId).
  tools/derive-schema.py also reads a field''s x-ticvai-references itself, so one refresh with last run''s graph keeps
  every contract declaration (it used to take two).'
