id: CHG-R6-010
date: '2026-10-12'
source: cr
kind: contract
proposed: '2026-10-12'
summary: 'Eleven tables the derived DDL named with words naming-and-style bans in DDL are renamed at the generator:
  Hold becomes reservation, channel_allocation becomes channel_envelope, and the plural rule tables become singular. A
  declared rename now reaches migration-review.md as a rename, not as a new table beside the old one.'
decision:
  what: 'Rename at the generator, database names only (CR-011, option 1). seating.seat_hold -> seating.seat_reservation,
    seating.seat_hold_item -> seating.seat_reservation_item, wallet.hold -> wallet.fund_reservation,
    catalogue.inventory_hold -> catalogue.inventory_reservation, resources.resource_hold -> resources.resource_reservation,
    catalogue.channel_allocation -> catalogue.channel_envelope, seating.recommendation_rules -> seating.recommendation_rule,
    wallet.channel_rules/funding_rules/transfer_rules -> wallet.channel_rule/funding_rule/transfer_rule, wallet.risk_rules ->
    wallet.risk_rule_set. Declared in tools/derive-schema-history.py RENAMES; the x-ticvai-persistence and
    x-ticvai-references tags, the contract prose naming the tables and handoff/api-data-lineage.json repointed by
    tools/applied/ddl-names-12-october.py. Keys that name a renamed table follow it with x-ticvai-column
    (seat_reservation_id, inventory_reservation_id, resource_reservation_id, fund_reservation_id, risk_rule_set_id), and
    the new COLUMN_RENAMES list declares them. wallet.hold.wallet_hold_id was a second identity beside the surrogate id
    (the wire''s walletHoldId is the row''s id, /wallet-holds/{walletHoldId}) and is stored as id. Generator:
    tools/ddl_forward.py takes the declared renames (a "table renamed" or "column renamed" row with the ALTER ... RENAME,
    and an "after rename" row listing the generated names its indexes, constraints and policy take);
    tools/derive-schema.py reads a stale relationship graph under the new names. Contract wire names and enum values
    unchanged.'
  by: Chinmay
  date: '2026-10-12'
why: 'ADAM CR-011, raised by the backend developer: naming-and-style 3.3 says code, contracts and DDL never
  take a banned word unless a row allows it, and the generated tenant DDL carried Hold, Allocation and plural table names
  into every migration that copies it. Chinmay approved option 1 on 12 October 2026 (rename at the generator, x-ticvai-column
  where a field keeps its wire name). Without the rename-aware forward migration, frozen mode would have created each
  renamed table empty beside the old one.'
