id: CHG-R6G-009
date: '2026-10-14'
source: audit
kind: contract
summary: 'createPrincipal''s homeScopePath is resolved to identity.principal.home_scope_id and not kept: the request field
  is marked x-ticvai-persisted: false and says so.'
decision:
  what: 'contracts/spine/identity.yaml CreatePrincipalRequest.homeScopePath: x-ticvai-persisted: false; the description
    says the path is resolved to the platform.scope row at it, whose id is identity.principal.home_scope_id, and the
    path itself has no column. No column marker fits: x-ticvai-stored-as and x-ticvai-column name the column that holds
    the field''s own value, and home_scope_id holds the id the path resolves to.'
  by: Chinmay
  date: '2026-10-14'
why: 'First full r6 gate (14 October 2026): check-request-fields-stored RF-REQUEST-NOT-STORED and check-stored-request-
  fields SR-STORED-NO-COLUMN on createPrincipal.homeScopePath (added by CHG-IDR-002, ADAM CR-077), whose description said
  "stored as identity.principal.home_scope_id". Lead''s decision: mark it x-ticvai-persisted: false with that sentence,
  or map it with a column marker if one fits better.'
