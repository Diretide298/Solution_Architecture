summary: 'Contract gap (venue-operations): 82 wiring fixes need an operation the contracts do not have; logged,
  not invented.'
decision:
  what: 'Log, do not invent: each wiring fix below needs an operation (or an audience) the contracts lack. The gap
    is recorded on the screen (gaps, operation: null) and here, open, for the contract owner.'
  by: Chinmay
  date: '2026-10-02'
  quote: 'Chinmay, 2 Oct 2026: fix the wrong wiring now'
why: Design-note corrections for venue-operations (handoff/design-notes/venue-operations.yaml) name operations that
  do not exist; the brief for the wiring fixes (Chinmay, 2 October 2026) says to log such a gap as an open contract-gap
  change and not invent the operation.
