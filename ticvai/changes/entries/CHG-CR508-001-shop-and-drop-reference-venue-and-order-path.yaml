id: CHG-CR508-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'createShopAndDrop: one 409 problem type per reason (shop-and-drop-already-dropped, -item-not-droppable, -collection-point-closed);
  dropReference = the venue scope code (upper-cased, first 22 characters) + -SD- + a per-prefix number under a transaction-scoped
  lock; the collection point must be a collectionPoint of the drop''s venue (else 422 unknown-collection-point), its label
  copied; the drop''s venue from the sale''s outlet or the order''s venueId; the order path reads orders#salesOrderRecords,
  requires a non-empty lineIds (400 line-ids-required) and matches each line to one merchandise row; the point''s hours
  are local wall-clock with collectBy defaulting to closesAt or the next local midnight.'
decision:
  what: 'ADAM CR-508, posted on #30870: "Decided (Chinmay, 3 November 2026): createShopAndDrop is built on its existing
    ticket with these rules. Build now: 1. The 409 declares one problem type per reason, as collectShopAndDrop''s does:
    shop-and-drop-already-dropped, shop-and-drop-item-not-droppable (still never raised while no approved screen sets isDroppable)
    and shop-and-drop-collection-point-closed. refusedReason is unchanged. 2. dropReference = the venue''s code (platform.scope.code
    of the venue''s scope row, upper-cased, its first 22 characters) + "-SD-" + a number zero-padded to at least 6 digits,
    for example DXB1-SD-000123, never over 32 characters. In the insert''s transaction, take a transaction-scoped lock on
    that prefix, then use 1 + the highest number already issued under it in retail.shop_and_drop. Numbering is per prefix,
    so two venues that share a code never clash. The unique index on drop_reference stays as the ..." The lead''s instruction,
    3 November 2026: "Close the CRs and respond to devs" and "get the NEw CRs in the r13".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-508 (Deep Khanvilkar, #30870 createShopAndDrop): The 409s declared no problem types, dropReference had no
  generator, and the orderId path had no source for a line''s merchandise and name, the drop''s venue or subjectId.'
