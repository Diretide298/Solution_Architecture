  ref: tools/check-business-rules.py::BR-SHOP-DROP-RULES
status: open
notes: '**Differs from the posted words on one point, for a follow-up comment**: the decision says to read the order "through
  orders#salesOrderRecords on the same service route as orders#orderLineRecords" and that "a service read needs no table
  grant". In r13 orderLineRecords is asked in process from the operations host (CR-477, posted 2 November; XDR-071), the
  operations host asks every Orders query in process (CHG-R13INP-001, ADR-0055 as amended, check-cross-module-reads XR-INPROCESS-HOST
  refuses a service read), and XDR-075 already grants the operations role SELECT on orders.sales_order for salesOrderRecords.
  So the package declares salesOrderRecords in process, on the route orderLineRecords is asked on, and no new grant is needed.
  Also declared beyond the words: tenancy#scopeRecords (the venue code) and tenancy#outletRecords (the sale''s outlet, the
  venue''s outlets) and tenancy#regionSettingsRecords (the Region''s time zone the hours are read in), in process under
  XDR-004.'
