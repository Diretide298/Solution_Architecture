notes: 'tools/derive-design-tokens.py''s WEB_INPUTS write the three inputs, so handoff/design-tokens/guest-web.yaml
  says them on the next refresh (the "catch up later" of the decision, done now). The check also holds the rule to the
  prototype: every light preset carries surface #ffffff. **Not exact as posted (step 5):** the four light presets give
  the prototype''s surface (#ffffff) and Summit Peaks gives #fdfcff, but the three dark presets do not: mix(bg, #ffffff,
  0.04) gives #1d1f23, #1e1b22 and #1a1b1f where the prototype''s palettes carry #1d2027, #1e1a24 and #191c22 (no fg
