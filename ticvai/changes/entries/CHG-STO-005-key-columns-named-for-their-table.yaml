  - access.access_change
  - access.entry_rule_point
  - access.scan_event
  - ai.proposed_action
  - catalogue.channel_envelope
  - catalogue.performance_media
  - ledger.tax_exemption
  - marketing.conversation_message
  - marketing.waiver_signature
  - queue.queue
  - resources.selection_policy
  - retail.shop_and_drop
  - subscription.tier_allowance
  - subscription.tier_module
  - sync.cross_region_entitlement
  - venuemap.visit_plan
  schemas:
  - ChannelAllocation
  - VisitPlan
  - QueueDetail
  files:
  - contracts/
  - tools/applied/sto-children-and-names-14-october.py
  - tools/derive-schema-history.py
  - tools/check-ddl-conventions.py
root_class: A17 DDL-DERIVATION
