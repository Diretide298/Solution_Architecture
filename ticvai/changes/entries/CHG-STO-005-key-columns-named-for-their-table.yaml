notes: 'Batch STO. Contract impact: additive (x-ticvai extensions and one readOnly response field, ChannelAllocation.channelCapacityId).
  Migration effect: each is a "column renamed" row in handoff/migration-review.md (ALTER TABLE ... RENAME COLUMN, then the
