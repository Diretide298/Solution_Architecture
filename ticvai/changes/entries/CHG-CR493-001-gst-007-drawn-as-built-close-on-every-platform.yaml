notes: '**Design change: GST-007 restyled as built in 22143c6 (coach-mark cards, More dates and the month calendar, the
  one-question Yes / No consent pop-up), with the lead''s condition: a close (x) on every platform.** The screen
  record''s consentQuestions overlay now reads confirm Yes / No (recordConsentAnswers, after the last question) and
  dismiss Close (x) (discards the answers); a monthCalendar overlay (OK / Cancel) is added behind More dates; the quick
  tour overlay opens only when the flow''s quickTour is on. docs/active/approved-ui-changes.yaml records the three
  changed overlays against ADAM CR-493. The frame stays the prototype capture (wireframes/incoming/P02-mobile-v4/gst-007.html);
  the record and its prototype.differences name the build. The tokens calendarColors, calendarHeaderGradient and
  colors.consentIcon (#00BFFF) are the guest app''s, as the build added them; screens/_design-tokens.yaml is not
  changed. tools/check-approved-ui.py holds the changed overlays to the approval. **Named beyond the posted words:**
  the monthCalendar overlay''s OK calls listPerformances (its confirm operation) and its Cancel discards "the date
  picked in the calendar".'
