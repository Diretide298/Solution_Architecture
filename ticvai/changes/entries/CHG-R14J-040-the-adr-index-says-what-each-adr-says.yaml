  - docs/adr/README.md
  - docs/adr/0065-on-sale-availability-is-read-from-a-short-cache.md
  - deploy/variants/B-read-cache.yml
  - docs/active/left-out.yaml (LO-R14J-002, LO-R14J-003)
  - tools/check-adr-index.py
  - tools/run-checks.py
  - changes/schema.yaml (id_blocks R14J)
root_class: a hand-maintained index restating what its files say, with nothing comparing the two
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: 'none: the r13 system review of 3 November 2026, the lead''s decisions of that day'
triage: fix-forward
prevention:
