  ref: tools/check-adr-index.py
status: open
notes: 'For the lead: ADR-0057 asked for the client''s broker answer by 12 October and ADR-0060 for the 99.99% scope,
  per-tier SLO and HA cost; both are overdue and have no escalation date. The left-out entries say the lead escalates;
  the date is the lead''s to set.'
