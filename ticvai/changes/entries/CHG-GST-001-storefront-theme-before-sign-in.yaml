id: CHG-GST-001
date: '2026-10-02'
source: audit
kind: contract
summary: A public, cacheable read of the published guest-facing configuration, getPublishedTenantConfig (GET /storefront/tenant-config),
  replaces getTenantConfig on WEB-001, GST-001 and KSK-002.
decision:
