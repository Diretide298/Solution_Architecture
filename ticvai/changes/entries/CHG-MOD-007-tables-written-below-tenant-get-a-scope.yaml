notes: 'Batch MOD, 14 October 2026. Derive before check: derive-schema, derive-read-columns --apply and derive-ddl
  --apply write the 42 scope_path columns, their indexes, the new helper and 129 policy swaps into the next forward
  migration (V0105 on this branch; derived, not committed), with each backfill named in handoff/migration-review.md
  (check-ddl-conventions D-SCOPE-NOTNULL passes). Kept for the lead, not baselined: 35 writes by venue staff to rows a
  guest owns (marketing.message_dispatch, wallet.wallet, wallet.gift_card, marketing.consent_record, ledger.deposit,
  orders.membership_activation_action, payments.token, marketing.form_submission, marketing.guest_document,
  platform.audit_read): the subject policy lets only the guest or the tenant root write, and the ruling''s options do
  not fit a guest-owned row (a scope would hide it from the guest; running a till top-up at tenant needs a tenant
  grant), so the lead chooses between a staff-grant write rule for subject tables and writing under the tenant root
  after the venue check; 9 writes and reads of identity.principal, principal_credential and
  principal_credential_history (tracker F13, deferred to r7 by CHG-R6G-008); 2 reads of the append-only audit trails
  (platform.audit_record, identity.authz_audit) by listAuditRecords and its peer at venue, which CHG-R6-002 decided
  only the tenant root reads; fnb.delivery_location_outlet''s 2 writes (a join table with no schema of its own and a
  nullable outlet key: STO''s key class).'
