id: CHG-CRA-007
date: '2026-10-18'
source: cr
kind: contract
summary: 'Four rules nobody had decided are now in the contracts: which guest fields are personal and how searchGuests
  hides and orders them (CR-141); the host routing outcomes (CR-162); how a payment''s cash receipt finds its account
  mapping, names its source, finds an open period and numbers its entry (CR-168); and what convertInventoryHold does
  with seats, envelopes and a hold that lapsed after the capture (CR-169). Each has a business-rule check.'
decision:
  what: 'Published answers of 18 October 2026 (decisions-final.json): CR-141 option 1 now (option 3 as the lasting
    fix: GuestProfile''s properties marked x-ticvai-data-class personal or behavioural), CR-162 option A, CR-168 option
    A, CR-169 option A. marketing-crm.yaml: GuestProfile data classes (six personal), lifetimeValue left out until it
    has a currency (CR-094''s rule), searchGuests'' consent rule, null personal fields and id order without
    GUEST_VIEW_PII. tenancy.yaml: resolveTenantHost''s outcomes (308; terminated 404; live, suspended and draining
    databases opened; a platform subdomain verified at provisioning; the cell_tenant address; database_name
    informational). finance.yaml: JournalSource payment; AccountMapping.scopePath (read-beneath, a venue reads its
    region''s row; venue row, else region row, else refused); JournalEntry.legalEntityId and entry numbers unique per
    (legal entity, lower(number)) replacing the tenant-wide index; the fiscal-year label is the year the fiscal year
    starts in, a proposed default for the client''s finance team. orders.yaml: createPayment (and capturePayment, which
    posts the same receipt) declare tenancy#venueSettingsRecords and regionSettingsRecords in-process; the cash
    receipt''s source, next open period and "one posting" stated. catalogue.yaml convertInventoryHold: seats by
    inventoryReservationId to sold, envelope units leased to sold, the lapsed-hold rule (units retaken if free,
    else unitsGone for the reconciler, nothing refunded automatically). seating.yaml SeatHold:
    inventoryReservationId, status sold; states/seat-hold.yaml converted -> sold. Breaking: BC-371 (JournalSource),
    BC-372 (SeatHold.status), the response enum values the decisions add.'
  by: Chinmay
  date: '2026-10-18'
why: 'ADAM CR-141 (Sanket Keluskar, #30711), CR-162 (Hrushikant Patkar, PLATFORM-KERNEL #27692), CR-168 and CR-169
  (Hrushikant Patkar, PLATFORM-SAGA-PAID #27701), accepted 18 October 2026; class 9 of the 18 October triage ("rules
  nobody has decided yet"). Finding: each operation depended on a rule the package never stated.'
keys_touched:
  operations: [searchGuests, resolveTenantHost, createPayment, capturePayment, setAccountMappings, postOrderRevenue,
    convertInventoryHold]
  tables: [marketing.guest_profile, ledger.account_mapping, ledger.journal_entry, seating.seat_reservation,
    catalogue.channel_envelope]
  schemas: [GuestProfile, JournalSource, AccountMapping, JournalEntry, SeatHold]
  files:
  - contracts/satellite/marketing-crm.yaml
  - contracts/spine/tenancy.yaml
  - contracts/spine/finance.yaml
  - contracts/spine/orders.yaml
  - contracts/spine/catalogue.yaml
  - contracts/satellite/seating.yaml
  - states/seat-hold.yaml
  - docs/active/breaking-changes.yaml
  - tools/check-business-rules.py
  - docs/active/audit-runs/cr-answers-1018/impact-class9-decided-rules.tsv
  other:
  - 'BC-371, BC-372'
  - 'x-ticvai-data-class (new contract mark: personal | behavioural)'
root_class: 'A-UNDECIDED: rules nobody has decided yet (class 9 of the 18 October triage)'
tickets:
  started:
  - 'MIG-SEATING#seating.seat_hold (30356, On hold) and MIG-CATALOGUE#catalogue.channel_allocation (30386, On hold):
    the renamed tables gain a column and a status value'
  - 'TEST-AM-FOUNDATION-DATABASE (27686, On hold)'
  unstarted:
