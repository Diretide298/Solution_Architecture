    202 New in all (impact file).'
release_tag: r7
decision_owner: Chinmay
adam_cr: CR-141, CR-162, CR-168, CR-169
triage: blocker
prevention:
  type: check
  ref: tools/check-business-rules.py
status: open
notes: 'Prevention: check-business-rules, one rule per decision (BR-GUEST-PII, BR-HOST-ROUTING, BR-CASH-RECEIPT,
  BR-HOLD-LAPSE), shown failing on r6 (40 findings) and passing after. Sibling query: other guest reads of GuestProfile
  take the same marks from the schema (getGuestProfile and the list reads; their text is unchanged); capturePayment
  posts the same cash receipt and got the same two reads; no other operation posts to ledger.account_mapping''s
  lookup. Database (derived at the release; this branch''s derive in D:\wt\fix-cr-answers-1018-derived\class9): tenant
  V0105 adds account_mapping.scope_path (backfill each row''s path, then NOT NULL) with its read-beneath policy,
  journal_entry.legal_entity_id with its key, index and journal_entry_legal_entity_id_entry_number_uniq; the review
  drops journal_entry_entry_number_uniq and widens the source and seat_reservation status CHECKs; the seat reservation''s
  new column waits on the rename row of CR-011. Breaking: BC-371 and BC-372 record response enum values the decisions
  add; the lead confirms the label at merge. Not modelled: where the order''s unitsGone flag is stored for the
  reconciler (the answer names the reason, not the field); stated in convertInventoryHold''s text. Lane F (CR-161) may
  add the same createPayment reads; the merge keeps one copy. For the lead''s baseline: check-ddl-conventions
  D-SCOPE-NOTNULL on ledger.account_mapping.scope_path (added nullable; no backfill can be derived, because a
  region row records no region: a person writes it, venue rows from the venue''s path; no production rows exist).'
