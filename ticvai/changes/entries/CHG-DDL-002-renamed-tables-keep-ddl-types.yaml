status: open
notes: 'Batch DDL, 14 October 2026. Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release
  today as an exception". Contract impact: none. Migration effect: none (no DDL changes). Verified by loading ADAM''s
  buildBackend on this tree after derive-ddl --apply and build-schema-workbook: seat_reservation id uuid (DDL from
  seating.seat_hold), seat_reservation_item.seat_reservation_id uuid, inventory_item on_hand and reorder_point
  numeric(18,4), retail.merchandise.inventory_item_id -> inventory.inventory_item, Migration V0019/V0024 filled. The
  ADAM change ships with the viewer like any other viewer commit (it needs the ADAM build on the server updated).
  ddl-column-types.json is a new derived file written by derive-ddl (step 64 of refresh.sh) before
  build-schema-workbook (step 82) reads it; handoff/refresh-manifest.json does not list it until it is rebuilt.'
