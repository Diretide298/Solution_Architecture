id: CHG-CR496-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'submitForm, before anything is written, reads the published marketing.form_definition row for formId and
  formVersion and its marketing.waiver_version_control resign rule under the routed tenant''s root grant
  (ITenantRootGrant), each in one statement filtered to the caller''s scope paths (scope_path <@ ANY(paths) OR
  scope_path @> ANY(paths)), then returns to the caller''s grant (SET LOCAL back) for the live-acceptance check and the
  insert under CR-318''s grant-holder-write policy. No row is 404 form-version-not-found; no migration, no request or
  response change; the two tables'' row security is unchanged for every other operation.'
decision:
  what: 'ADAM CR-496, posted on #31165: "Decided (Chinmay, 3 November 2026): option A, as for the published privacy
    policies and the other tenant-root reads already in the package. Build now, in submitForm (#31165), before anything
    is written: 1. Take the caller''s scope paths ... 2. Under the tenant root grant (ITenantRootGrant), in one
    statement, read the marketing.form_definition row ... Keep it only when its scope_path is at or below one of the
    caller''s paths or at or above one of them ... 3. Under the same grant and the same scope filter, read
    marketing.waiver_version_control ... 4. Return to the caller''s own grant (SET LOCAL back) before touching
    marketing.form_submission ... 5. Read nothing else under the root grant ... No migration." The lead''s "Close the
    CRs and respond to devs" and "get the NEw CRs in the r13", 3 November 2026.'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-496 (Pranay Shinde, #31165 submitForm, On hold): form_definition and waiver_version_control have scope row
  security (a caller sees rows at or below its paths), so a form published at the tenant path was 404 for venue staff and
  for guests (a guest''s scope is its venue''s path). The tenant-root read precedent: identity.yaml (CR-362), workforce
  (CR-336), access (CR-396), the published privacy policies (CR-440).'
