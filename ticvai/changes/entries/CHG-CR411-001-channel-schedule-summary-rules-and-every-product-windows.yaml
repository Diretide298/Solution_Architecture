source: cr
kind: contract
summary: 'Each figure of listChannelSaleSchedule''s summary states its rule over every row the filters return (active
  salesWindow rules overlapping from..to, from defaulting to today, times local to the row''s or its channel''s zone,
  covered performances through catalogue.product_channel_assignment for a row with no product); blackouts are distinct
  (channel, date) pairs from blackoutDates; the event filter includes every-product windows of channels that sell one
  of the event''s products; aiInsights is an empty list until an insight source is declared (LO-CR411-001).'
decision:
  what: 'ADAM CR-411, posted 31 October 2026: "Decided (Chinmay, 31 October 2026): not as recommended: option A for the
    summary, with blackouts and dates corrected, and every-product windows counted under the event filter. The summary
    covers every row the filters return, not just the page ... blackouts counts distinct (channel, date) pairs from
    blackoutDates within the range; there is no separate blackout row ... aiInsights is always an empty list until an
    insight source is declared. Event filter: a row shows when its product belongs to the event, or when it has no
    product and its channel sells one of the event''s products, by the assignment above. Add
    catalogue.product_channel_assignment to the operation''s reads." The lead, 31 October 2026, on the settled CRs:
    "Include them in r12".'
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM CR-411 (Hrushikant Patkar, #35240 listChannelSaleSchedule): ChannelSalesScheduleAvailabilityWindowsSummary had
  six labelled integers and no rule, aiInsights no source, and the event filter did not say how a window with no product
  is treated. Blackouts are the blackout_dates array on each salesWindow row, and the product-to-channel assignment
  already exists in the module (pack p.11; MoM 31 Aug 2026 section 4.11).'
