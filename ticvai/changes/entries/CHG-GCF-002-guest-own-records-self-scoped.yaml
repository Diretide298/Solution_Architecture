id: CHG-GCF-002
date: '2026-10-03'
source: audit
kind: contract
summary: 'Fifteen reads and writes of a guest''s own records are self-scoped: a guest is answered for their own only, another
  guest''s is refused as not found; staff keep their permission to act for any guest.'
decision:
  what: 'Mark the guest''s own-record operations x-ticvai-self-scoped: subject (orders, reservations, wallet, gift card, consents,
    marketing subscription, FacePass, shop-and-drop, and listCustomerBadges) and say so in each description; the staff permission
    stays for staff acting for any guest.'
  by: Chinmay
  date: '2026-10-03'
why: 'Chinmay''s answers of 3 October 2026 to the Block A audit on live r2 (CHG-AUD-001, pattern 3: guest screens bind staff-only
  operations), section ''Pattern 4'', all as recommended. The zero-AI scan found 184 guest-screen bindings (P01, P02, P05)
  of 49 operations that carry a staff permission and declare neither x-ticvai-guest-callable nor x-ticvai-self-scoped, so
  nothing said what a guest, who holds no permission, may do (ADR-0025: audience and permission are orthogonal).'
keys_touched:
  operations:
  - getOrder
  - getReservation
  - listReservations
  - cancelReservation
  - getWallet
  - listWalletTransactions
  - getGiftCard
  - getGuestConsents
  - getMarketingSubscription
  - setMarketingSubscription
  - listCustomerBadges
  - getFacePassEnrolment
  - enrolFacePass
  - revokeFacePass
  - lookupShopAndDrop
  files:
  - tools/applied/guest-scoping-3-october.py
  - tools/check-audience-match.py
