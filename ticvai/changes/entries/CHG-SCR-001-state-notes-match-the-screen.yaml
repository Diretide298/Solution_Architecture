id: CHG-SCR-001
date: '2026-10-14'
source: audit
kind: spec
summary: 'A screen''s empty-state design notes promise only what the client-approved screen has: the pack
  generator''s "Carries the create action", "The filter narrowed it" and "Names the missing permission" are
  corrected, by a deriver on the refresh, wherever the screen has no create operation, no filter or no permissioned
  operation.'
decision:
  what: 'New tools/derive-screen-wiring.py (rule S-STATE-BOILERPLATE), run on the refresh after derive-components:
    emptyFirstRun "Carries the create action" on a screen with no create operation and no visible create control
    says it offers none (a configuration screen names the operation that saves the first one); emptyNoResults "The
    filter narrowed it" on a screen with no filter says it is never shown; emptyNoAccess "Names the missing
    permission" on a screen none of whose operations needs a permission says so, and names the permission again if
    an operation later needs one. tools/generate-screens-from-pack.py writes the same notes for a new screen. The
    notes are design notes, not copy; no visible component, label or copy changes (the client-approved UI rule,
    Chinmay, 14 October 2026). This branch commits the P08 screens; the refresh applies the rule to every platform.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding, Block A audit of 14 October 2026 (council plan; R250): check-screen-wiring/S-STATE-BOILERPLATE
  had 2,331 members (evidence audit/ticvai/runs/audit-1014/classes.json, 180 Block A tickets). Default ruling
  (triage.py, the lead''s "go with your recommendation"): "Empty-state text promises only what the screen has
  (generated from its operations)". After: 16 package-wide, every one a keep (a visible create control the
  client-approved UI shows with no create operation behind it: BO-317, BO-416, BO-1172, ADM-048, ADM-058, ADM-078,
  ADM-088, ADM-144, ADM-260, ADM-696, ADM-698, PTR-023, SUP-009, CMS-041, CMS-088, ANL-026).'
keys_touched:
  files:
  - tools/derive-screen-wiring.py
  - tools/generate-screens-from-pack.py
  - tools/refresh.sh
  - screens/P08-venue-back-office.yaml
  screens:
  - P08 (1,342 screens' state notes on this branch; P06 29, P09 60, P10 11, P12 18, P13 69, P16 47, P17 18 at the
    refresh)
  other:
  - S-STATE-BOILERPLATE
root_class: A30 SCREEN-GENERATED
tickets:
  started: []
  unstarted:
  - the Block A screen tickets in the batch's impact list (hand-back)
release_tag: r6
decision_owner: Chinmay
adam_cr: pending (raised at the r6 settlement)
triage: fix-forward
prevention:
  type: generator-rule
  ref: tools/derive-screen-wiring.py::fix_states
status: open
notes: 'Batch SCR, 14 October 2026. The 16 keeps are listed by the deriver on every run. check-screen-wiring holds the
  class: once the lead re-records the baseline, a new member fails.'
