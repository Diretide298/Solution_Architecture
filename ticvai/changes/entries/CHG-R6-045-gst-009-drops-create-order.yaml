id: CHG-R6-045
date: '2026-10-12'
source: audit
kind: spec
proposed: '2026-10-12'
summary: GST-009 Review & Payment no longer calls createOrder; checkoutCart is the one way a guest order is created, as
  on its web twin.
decision:
  what: 'screens/P02-guest-mobile-app.yaml GST-009: the Order banner reads the order number from checkoutCart; createOrder
    leaves apis and is recorded as a removed gap with the reason; the Pay note says checkoutCart creates the order.
    contracts/spine/orders.yaml createOrder no longer lists GST-009 in x-ticvai-consumed-by. tools/check-screen-patterns.py
    gains the DEC row (CHG-R6-045, GST-009, without createOrder).'
  by: Chinmay
  date: '2026-10-12'
why: 'N10 of the lead''s list of 12 October 2026, a finding: "WEB-012 binds no createOrder". The guest checkout pair
  (WEB-011, WEB-012, WEB-014 and GST-009) called different operations: GST-009 alone bound createOrder, kept as a
  banner by GFIX-3 on 2 October, while checkoutCart already turns the cart into the order (contracts/spine/orders.yaml)
  and flows F01, F02 and F50 use checkoutCart and createPayment only, so the app would have made two orders. Chinmay
  decided on 12 October 2026: "Drop it from GST-009 (Recommended)".'
