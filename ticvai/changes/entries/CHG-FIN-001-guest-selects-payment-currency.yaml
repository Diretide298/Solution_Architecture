id: CHG-FIN-001
date: '2026-10-02'
source: mom
kind: contract
summary: The guest selects the currency, the payment partner is asked in it, refunds go back in the currency paid;
  the ledger stays in base currency with the rate recorded per transaction.
decision:
  what: 'Reverse the display-only (AED-only) rule for card and wallet: chargeable currencies per venue, chargeCurrency
    at checkout, a locked rate and converted total on the order, the provider request in that currency, refunds
    in the currency paid at the sale rate; foreign cash at a till unchanged (DI-282).'
  by: Chinmay
  date: '2026-10-02'
why: Chinmay, 2 Oct 2026. The kickoff MoM of 10 Aug 2026 (sources/mom/TICVAI_Kickoff_MoM_2026-08-10.docx, 4.7) recorded
  two options, display-only conversion and full dynamic currency conversion at the gateway with records in base
  currency (DI-211); the package took only the first (CF-37, finance-insights notes "AED only"). The client prototype
  already switches the storefront currency (WEB-035 prototype difference). Refunding at the sale rate keeps the
  venue from refunding at today's rate (BL-087, CF-118). Reverses the 10 Aug quote in listFxRates ("refund for the
  base currency value").
