id: CHG-RSF-001
date: '2026-10-18'
source: cr
kind: contract
summary: 'Row security lets in the callers the contracts name: a child whose parent is in another deployable asks one
  SECURITY DEFINER function, platform.visible_parent_ids, for the parent rows the caller may see, so its host is
  answered under the parent''s own policy without a grant on the parent (CR-108); a venue reads the approval matrices
  it inherits and their rules, and the six tables with the same shape likewise (CR-095 A); a device bound to a
  workstation carries the workstation''s path, so its heartbeat passes the write check (CR-095 B).'
decision:
  what: 'Published answers of 15 October: CR-108 option 1 (one security-definer function, owned by the migration role;
    the parent tables force row security, so the check runs under the caller''s scope); CR-095 A1 (ApprovalMatrix
    read-beneath, approvals.rule following its matrix for reading and writing only under its own) and B1''s remainder
    (a bound device takes its workstation''s path, set on binding, moved on rebinding). Lead''s rulings of 18 October:
    the six sibling tables with a scope_level column are read-beneath too (access.policy_scope_assignment, ai.provider,
    catalogue.dynamic_pricing_control, catalogue.sales_channel, marketing.service_copilot_config, payments.provider);
    the function never refuses to answer at run time (D5); only a child whose parent is in another deployable asks it,
    every other parent policy keeps r6''s helper (D9). Controller''s ruling in fix round 1 (18 October): the function is
    set-based, platform.visible_parent_ids(parent regclass, for_write boolean) returning the visible parent ids, asked
    once per query (`<fk> IN (SELECT platform.visible_parent_ids(parent))`); its signature is internal to the policies,
    developers never call it. It keeps the allow-list (one static branch per parent, any other raises), the fixed search
    path with public, and no dynamic SQL from its arguments. platform.visible_parent_ids_setup gives it a dedicated
    owner, ticvai_parent_visible (no login, no superuser, no BYPASSRLS), with SELECT on every table up each parent''s
    chain, wherever its owner bypasses row security and the migration may create roles; where it may not, the migration
    refuses. EXECUTE is revoked from PUBLIC and granted to the DB-ROLES deployable roles that exist (commerce, access,
    operations, workers, ticvai_ai). Generated: derive-ddl writes the function, its setup and the two across helpers;
    ddl_forward writes a changed generated helper with its tables applied again, a renamed table''s across policy under
    its current name, and SCOPE_FOLLOWS for platform.device.'
  by: Chinmay
  date: '2026-10-18'
why: 'ADAM CR-095 (#27934) and CR-108 (#27686), accepted 15 October. Finding: check-rls-scope-fit judged inherited rows
  only when every writer ran at tenant, skipped device callers, never compared a write''s level with its row''s, and
  assumed a parent check could read the parent (DB-ROLES grants a deployable only its own schemas). Class query
  (check-rls-scope-fit --all) before: RF-PARENT-ACROSS 32, RF-INHERITED 85 (27 of them on the matrix and its rules),
  RF-DEVICE-ABOVE 1; after the derive: 0, 0, 0; RF-TENANT-ROOT 125 and RF-OWNED-ABOVE 4 unchanged.'
