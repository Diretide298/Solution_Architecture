notes: 'Measured on PostgreSQL 16 (as the migration role, 100,000 child rows, medians of five runs): a full scan of a
  child that asks parent_visible took 10,200 to 19,400 ms against 23 to 58 ms for the r6 check (340 to 440 times);
  a child one level below the crossing, which keeps r6''s EXISTS, took 180 to 192 ms against 132 to 145 ms (1.3
  times). Hence the ruling''s narrower form: only the 15 children whose parent is in another deployable ask the
  function. A point read by id costs about 4 ms either way. A set-based variant (the visible parent ids asked once
  per query) scanned the same 100,000 rows in 12 ms; it is a different signature from the published answer, so it is
  left to the lead. Verified: tools/tests/test_parent_visible_pg.py (8 tests, run, not skipped): the r6 check is
  refused to a role without the parent grant; the function shows the caller''s venue only; a venue reads inherited
  matrices and writes only its own; other parents are refused; the owner is the migration role in a production-like
  migration and ticvai_parent_visible when migrated as postgres, and a bypassing owner is replaced when a parent
  policy is applied again. The real tenant DDL with V0105 applied on PostgreSQL 16 as postgres and as a migration role
  without superuser, BYPASSRLS or CREATEROLE: V0105 applies in one transaction, and a host role with grants on fnb only
  reads fnb.menu and fnb.menu_item where before it got "permission denied for table outlet". Risk the lead keeps:
  DB-ROLES (#27655) must give the migration role neither superuser nor BYPASSRLS, or must let it create roles; where
  neither holds the migration warns and the function would show every child row. Started tickets: #27686 (On hold)
  takes the forward migration and un-holds; the [DB] tickets in Ready for QA get a comment that the policies change in
  V0105; #30794 (configureWorkstation, In progress, Pranay Shinde) gets a comment that binding moves the device''s
  scopePath; #32557 and #35134 (On hold) a comment (14 October rule). check-rls-scope-fit, check-migrations,
  check-migration-freeze, check-ddl-conventions, check-storage-promises, check-contract-shapes and
  check-contract-compat pass; derived files restored before the commit; the release derive writes V0105.'
