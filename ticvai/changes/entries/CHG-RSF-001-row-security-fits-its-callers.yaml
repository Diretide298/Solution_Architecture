notes: 'Sixteen children have a parent in another deployable: 8 fnb and 4 retail tables under platform.outlet,
  resources.performance_participant under catalogue.performance, sync.rejection under platform.workstation,
  pii.subject_biometric under access.entitlement, and sync.dsar_request under approvals.request. sync.dsar_request is
  still platform.dsar_request in the databases (its move to sync waits on the by-hand rename row); V0105 applies its
  across policy under that name by a generated statement, and the SET SCHEMA moves the policy with the table.
  Timings on PostgreSQL 16, 100,000 child rows, full count(*) scan, medians of five runs. Before (the per-row function
  of the first round): 10,200 to 19,400 ms against 23 to 58 ms for r6''s EXISTS (340 to 440 times). After (fix round
  1, set-based), on the real tenant DDL with V0105: retail.sale 14.6 ms as the migration role and 14.1 ms as the
  operations host role, against 28.9 ms for r6''s EXISTS as the migration role (as operations r6 is refused,
  "permission denied for table outlet"); fnb.kitchen_ticket 14.1 ms and 14.7 ms against 29.4 ms. One row by id about
  7 ms in a fresh session (the function''s first call). The set-based read reads every parent row the caller may see
  once per query, so a child of a large parent (pii.subject_biometric under access.entitlement) pays for that parent''s
  visible rows on each query. Verified: tools/tests/test_parent_visible_pg.py (13 tests, run, not skipped): the r6
  check is refused to a role without the parent grant; the function shows the caller''s venue only; a write under
  another venue is refused; a venue reads inherited matrices and writes only its own; a parent with a parent of its
  own (catalogue.performance -> catalogue.event) answers through its chain, also migrated as postgres; other parents
  are refused; a role outside DB-ROLES may not execute it; the owner is the migration role in a production-like
  migration and ticvai_parent_visible when migrated as postgres; a bypassing owner is replaced when a policy is
  applied again; a migration role with BYPASSRLS that may not create roles is refused. The real tenant DDL with V0105
  applies on PostgreSQL 16 as postgres and as a migration role without superuser, BYPASSRLS or CREATEROLE. Risk the
  lead keeps: DB-ROLES (#27655) must give the migration role neither superuser nor BYPASSRLS, or let it create roles;
  otherwise V0105 refuses to apply. DB-ROLES creates the five host roles in the baseline; a host role created after
  V0105 needs EXECUTE on platform.visible_parent_ids (or the next across policy applied grants it). Release steps:
  (1) apply V0105; (2) **move existing devices to their workstation''s path**, the by-hand step in
  handoff/migration-review.md: UPDATE platform.device x SET scope_path = p.scope_path FROM platform.workstation p
  WHERE p.id = x.workstation_id AND x.scope_path IS DISTINCT FROM p.scope_path (a bound device''s heartbeat fails the
  write check until it runs; the server sets the path on every binding from this release); (3) un-hold #27686.
  Started tickets: #27686 (On hold) takes the forward migration and un-holds; the [DB] tickets in Ready for QA get a
  comment that the policies change in V0105; #30794 (configureWorkstation, In progress, Pranay Shinde) gets a comment
  that binding moves the device''s scopePath; #32557 and #35134 (On hold) a comment (14 October rule).
  check-rls-scope-fit, check-migrations, check-migration-freeze, check-ddl-conventions, check-storage-promises,
  check-contract-shapes and check-contract-compat pass; derived files restored before the commit; the release derive
  writes V0105.'
