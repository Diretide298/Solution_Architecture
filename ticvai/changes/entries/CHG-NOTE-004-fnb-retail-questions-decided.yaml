notes: 'check-design-notes now validates `decisions` (fields, date, a DEC id and an existing CHG id in source, questionSource
  resolved, no question left in both lists) and correction `status`/`by` (fixed, logged or withdrawn, by an existing change
  entry), and refuses any CHG id a source names that has no entry. Before this change the notes had no `decisions` key,
  so nothing recorded that a question was answered.


  Decisions by kind: {''default accepted'': 53, ''answered'': 35, ''already applied on main'': 1, ''default (non-critical,
  reviewable)'': 20}.


  Corrections by entry: CHG-FIN-003 4 fixed; CHG-GST-004 2 fixed; CHG-WIR-008 115 fixed; CHG-WIR-009 8 fixed; CHG-WIR-010
  6 fixed. Corrections with no status (340) are still open.


  Tickets: none started (Block A starts Monday 5 October 2026); the notes feed the design batches at the next refresh,
  not ticket text.


  Answers that change the drawn default:

  - DEC-031 (Q31) BO-044: Outlet names: English, plus the local language where the country requires it.

  - DEC-034 (Q34) BO-045: F&B prices are owned by F&B: the F&B service has its own catalogue table (prices migrated into
  F&B so ticketing scales in isolation); an outlet may set its own price. The central catalogue prices tickets and single-price
  booths. Fix the stale MenuItem text (''pricing and tax come from the catalogue variant''); withdraw the F&B notes''
  correction asking to drop the menu''s own price; check BO-045 and the F&B screens read F&B''s catalogue.

  - DEC-049 (Q49) CMS-009: Three navigation editors (header, footer, tab bar), each saved on its own. The DNS/custom-domain
  and landing-page-template parts of this answer are separate decisions (see related).

  - DEC-052 (Q52) GST-024: A guest F&B order keeps its own payment step and its own receipt (DI-293''s one receipt does
  not apply to F&B).

  - DEC-059 (Q59) POS-007: A cashier may sign out with the variance pending; the shift shows "Under review" on the cashier''s
  view and never blocks the next cashier opening a shift on that till. A supervisor resolves it with closeShift on POS-007
  (supervisor PIN, any till) or in the daily cash reconciliation, which lists every shift and resolves them one by one
  (Pre-apply round, 2 October).

  - DEC-060 (Q60) POS-007: Blind close: the cashier sees only that a variance was recorded; the supervisor sees the amount.
  [already applied: CHG-FIN-003]

  - DEC-061 (Q61) POS-011: Store credit is a gift card issued at the refund amount (the drawn default).

  - DEC-064 (Q64) POS-021: Outlet setting ''Payment timing'': Pay first, or Send to kitchen first then pay. Refines R261
  per outlet.

  - DEC-067 (Q67) POS-024: ''Remove table'' marks the table Out of service (setTableLayout never deletes).

  - DEC-068 (Q68) POS-028: Change covers and change server on the till in Block A (updateTableVisit, transferTableVisit);
  table transfer to another table only after r2.

  - DEC-070 (Q70) WEB-036: Outlet property: ''Inside the venue (needs an admission ticket)'' or ''Standalone (no ticket)''.
  Inside-venue outlets need admission for guest ordering; a standalone restaurant sells takeaway/delivery without a ticket.

  - DEC-071 (Q71) WEB-036: The guest F&B order keeps its own payment step and receipt; DI-293''s one cart/one receipt
  does not apply to F&B.

  - DEC-173 (Q173) BO-040: As POS-007: the cashier signs out, the shift is pending (''Under review'') and the next cashier
  can start.

  - DEC-175 (Q175) BO-040: A supervisor can reject a variance so the cashier recounts and resubmits (DI-804).

  - DEC-176 (Q176) BO-040: Add a read for the closing count lines (denomination breakdown) for review.

  - DEC-178 (Q178) BO-042: The cashier signs as witness with a PIN on the same device (step-up).

  - DEC-179 (Q179) BO-042: Drawer limit setting: the till warns when the drawer is over the limit and offers a cash lift.

  - DEC-181 (Q181) BO-104: The F&B hub shows F&B takings; admissions are dropped from it.

  - DEC-183 (Q183) BO-109: Till layout per outlet, with a till override (Workstation.saleBoard).

  - DEC-185 (Q185) BO-112: Prep sheets print from a print template, to kitchen printers and the browser.

  - DEC-187 (Q187) BO-134: Kitchen printers are in release 1.

  - DEC-188 (Q188) BO-134: One kitchen serves several outlets through a producing outlet (one kitchen outlet produces
  for several).

  - DEC-189 (Q189) BO-135: Kitchen routing: item routing plus category rules plus a fallback station (DI-323).

  - DEC-192 (Q192) BO-139: A waste-approval policy the venue can switch on or off; when on, value bands and a photo above
  a value.

  - DEC-194 (Q194) BO-140: Daily counts (''6 left'') on menu items; an item goes sold out automatically at zero.

  - DEC-195 (Q195) BO-142: A discount or price-override limit is a percentage or an amount, chosen per limit by the venue.

  - DEC-196 (Q196) BO-729: Outlet type and department are fields on the outlet (DI-319).

  - DEC-197 (Q197) BO-731: A late-night window is one window past midnight, marked ''ends next day''.

  - DEC-199 (Q199) EMP-008: A server without a till gets a service summary: covers, tables, sales, tips.

  - DEC-200 (Q200) EMP-009: No cash on handhelds: a server''s handheld takes no cash payment; cash goes to a till. The
  server''s End shift has no cash count.

  - DEC-202 (Q202) EMP-052: A table shows Reserved when the booking names it, or N minutes (venue-set) before a pre-allocated
  booking.

  - DEC-204 (Q204) EMP-055: Seating preference and occasion are fields on a table booking.

  - DEC-205 (Q205) EMP-060: Turn time, no-show rate, covers and wait accuracy, all from reporting.

  - DEC-206 (Q206) KSK-016: Kiosks inside the venue need admission for F&B; F&B keeps its own receipt (from WEB-036).

  - DEC-304 (Q304) EMP-078: Rental card hold: pre-authorisation on the payment terminal; the reference is stored on the
  booking; check-out is blocked until it succeeds.

  - DEC-307 (Q307) EMP-098: Usage beyond the paid time is charged at the normal rate (DI-499).


