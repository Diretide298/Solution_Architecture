summary: 'check-screen-wiring S-WORKSTATION-OP accepts a workstation-scoped operation on a guest platform when the
  operation is guest-callable (x-ticvai-guest-callable: createPayment, inquirePaymentStatus): that is the guest
  variant the ruling asks for.'
decision:
  what: 'tools/check-screen-wiring.py: a workstation-scoped operation declaring `x-ticvai-guest-callable` (CHG-GCF-003)
    is not a finding on P01, P02 or P05. Strict for every other member: a workstation operation on the scanner, the
    partner portal or a console still fails until its screen takes a workstation from the session or calls another
    variant (those screens are the platform batches'').'
  by: Chinmay
