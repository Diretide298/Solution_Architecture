  storefront uses the guest variant"; the guest variant of createPayment and inquirePaymentStatus is the same
  operation, guest-callable since CHG-GCF-003 (rule asked by the guest-screens batch). After: 34 package-wide (7 guest
  members cleared): P07 scanner 19, P10 partner 13, P09/P12 getCurrentSession 2, none on P08.'
