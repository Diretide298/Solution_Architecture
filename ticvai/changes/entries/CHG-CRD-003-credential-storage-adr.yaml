id: CHG-CRD-003
date: '2026-10-14'
source: developer
kind: spec
summary: 'ADR-0071: passwords and PINs (guest and staff), recovery and one-time codes are stored as Argon2id PHC strings;
  a PIN also takes a per-tenant Key Vault pepper; the reuse check reads the history; lockout is per credential and temporary;
  credentials are never stored as sent.'
decision:
  what: 'docs/adr/0071-credentials-are-stored-as-argon2id-phc-strings.md (Accepted 14 October 2026) and its row in docs/adr/README.md.
    LoginRequest.credential and guestPasswordLogin.password are x-ticvai-persisted: false (compared, never kept); RegisterGuestRequest.password
    is x-ticvai-stored-as identity.guest_credential.password_hash.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-078: GuestCredential said "Argon2id, with its parameters" (identity.yaml:7218, CHG-FXC-003) with no ADR; the
  audit of 14 October asked for a credential ADR (Argon2id, self-describing PHC string, guests and staff, Key Vault pepper
  for PINs). ADR-0063 is encryption and biometrics, not authentication, so a new ADR rather than an amendment. A 4-digit
  PIN hash is brute-forceable offline without a pepper.'
