why: 'the live comparison of 30 October 2026 (live''s tenant and control schemas, PostgreSQL 17.6, compared with r11 object
  by object), section 3: record it, or the package''s row-security design is incomplete. The package''s generated rules
  already use the same per-statement predicate (derive-ddl STATEMENT_SCOPE, CHG-R9CR-003, CHG-R9CR-004).'
