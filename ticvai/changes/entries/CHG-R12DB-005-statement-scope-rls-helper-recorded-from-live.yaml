summary: 'platform.apply_statement_scope_rls(regclass), the developers'' row-security helper from migration 225 (hot tables),
  is recorded verbatim beside 920''s helpers. Nothing on live calls it as a function (no other function, no policy); it
  made one policy, access.scan_event''s scan_event_scope: the scope rule with the caller''s paths read once per statement.
  The package keeps apply_scope_rls on access.scan_event, which admits the same rows.'
