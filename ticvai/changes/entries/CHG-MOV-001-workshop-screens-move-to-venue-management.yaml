notes: 'Ids are kept so every pushed key keeps its ticket: the 25 APP-SETUP-ADM-* tickets stay in the plan under their keys
  (check-key-stability on a plan re-derived from this branch: no key of these screens renamed; the three renamed findings
  it shows, SVC-ACCESS-SYNC-1, SVC-VENUEOPS-FEED-1 and VM-ORDER-SYNC-1, appear identically when HEAD 2a05ef95 is re-derived,
  so they do not come from this move). Unpushed screen tasks of these screens re-home from the console app to Venue Management
  at the next refresh. ADM-068 and ADM-619 keep their console hubs; their detail screens (ADM-069..077, ADM-620..628) move,
  keep the edge to the console hub and are also entered from BO-100. BO-100 Venue Home gains 57 exits (navigation lines only).
  P09 ADM-002 and ADM-319 still exit to moved screens: the P09 owner (screens-p08-p09) drops those exits or routes them through
  the R098 grant. 1,129 links in 41 static workshop boards (wireframes/WS*.dc.html) are repointed to the P08 board; the P08
  and P09 boards are derived and regenerate at the refresh (check-wireframes passes on boards re-derived from this branch).
  Prevention: check-key-stability is the guard the move had to satisfy (moves are metadata, a renamed key blocks); no check
  yet refuses a venue-scoped write on a console screen without the grant, which the lead may add once the R098 work on the
  remaining console screens lands. Batch MOV (screens-move-adm049), 2 October 2026; tickets: none started (Block A starts
  Monday 5 October).'
