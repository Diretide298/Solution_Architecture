id: CHG-MOV-001
date: '2026-10-02'
source: cr
kind: spec
summary: The 408 workshop-pack console screens (ADM-048..ADM-317 and ADM-559..ADM-698, less ADM-068 and ADM-619) move from
  the TICVAI Console (P09) to the end of Venue Management (P08), keeping their ids.
decision:
  what: 'Move the workshop-pack screens to P08 under their own ids: implementation app venue-management-web, board anchors
    on the P08 board, the 39 board hubs entered from BO-100 Venue Home instead of the console dashboard ADM-002, and a note
    that TICVAI staff reach them only under a platform-staff grant (R098). ADM-068 and ADM-619 stay on the console. The flows
    that walk them name P08 (a platform rename) and the contracts'' x-ticvai-consumed-by lines name P08.'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026, batch 1, ADM-049 (DEC-100): "They are venue screens": move them to Venue Management and merge
  them with BO-008 to BO-011; TICVAI staff use them only under a grant (R098). The R098 corrections on these screens (design
  notes: "Calls tenant-permission operations with no tenant picker and no platform-staff grant ... or the screen belongs in
  Venue Management (P08)") close by the move. ADM-068 and ADM-619 stay because later answers of the same day (batch 6) give
  them to TICVAI staff: DEC-207, TICVAI staff maintain the country tax templates; DEC-211, a cross-tenant view of TICVAI''s
  payment operations, which no tenant cell can serve.'
