id: CHG-R9UI-005
date: '2026-10-21'
source: audit
kind: spec
summary: 'The 290 states of the client-verified screens that the approved prototypes never drew are drawn by the package
  in r9: one frame per platform and state class (P01 Guest Web 5, P02 Guest App 9, P04 POS 6; 20 frames) in each app''s
  approved look, on companion boards under wireframes/states/, each marked "drawn by the package from the approved
  design (r9), not yet seen by the client". Every state of the 158 client-verified screens now has a look (936 of
  936); the design-gap lines LO-R9UI-001 to -020 leave the left-out list, and showing the frames to the client is
  LO-R9UI-025.'
decision:
  what: 'tools/draw-state-frames.py (new; draws wireframes/states/P01 Guest Web states.dc.html, P02 Guest App
    states.dc.html and P04 Venue POS states.dc.html: self-contained, the prototypes'' CSS variables from
    handoff/design-tokens/ and the till''s root variables, the prototypes'' own components and copy reused, mascots
    embedded, logical properties for right to left; run by hand and excused in refresh.sh like render-screens).
    screens/_state-patterns.yaml: 20 patterns with `board`, `frame`, `status`, and the states pointed at them.
    tools/derive-state-views.py: a drawn frame''s board and status in handoff/design-frames.json (fields added, none
    changed). tools/check-state-views.py: a drawn frame proves itself on its board, names the approved prototype
    whose look it is in, and the board carries the status. tools/ticket_done.py: the ticket names a drawn look as
    drawn by the package, not yet seen by the client. docs/active/left-out.yaml: LO-R9UI-001 to -020 removed,
    LO-R9UI-025 added.'
  by: Chinmay
  date: '2026-10-21'
why: 'The lead, 21 October 2026, on the r9 UI lane''s report of 290 states the approved prototypes never drew (put on the
  left-out list as client questions by CHG-R9UI-003): "290 of them were ingested and never built we need to built them
  for r9." and "all if them get going". Finding behind it: the WEB-007 seat page (sources/audit-21-october/web-007-ui-pull-findings.md).
  The frames do not change any approved screen: they are states those screens never showed (check-approved-ui passes);
  the client still reviews them (LO-R9UI-025).'
keys_touched:
