id: CHG-R10ID-011
date: '2026-10-25'
source: cr
kind: contract
summary: 'Developer portal credentials can be built: each API client secret is a row of the new
  control.api_client_secret (keyed hash under a platform key, its own expiry, revoked_at); rotateApiCredential answers
  404 and 409 for a suspended or revoked client and never reactivates one; revocation is terminal in the api-client
  state model; a partner caller acts only for the developer account its member email belongs to; registerDeveloper is
  public with no permission, takes CreateDeveloperAccountRequest, refuses a second account for a contact email (unique
  on lower(contact_email)) and makes the contact the owner member; a new staff verifyDeveloper; setApiLicensing takes
  tenantId from staff and refuses overlapping licence periods per tenant.'
decision:
  what: 'ADAM CR-098, accepted for the next release (cr-34 decision line). contracts/satellite/public-api.yaml: the
    contract description states once who a partner caller acts for (its active developer_member email; another
    developer''s row is 404; readOnly members never write; TICVAI staff unrestricted; an unverified account is
    provisioned nothing, 409 developer-not-verified on createApiClient, createSandbox and requestProductionAccess).
    New persisted schema ApiClientSecret (control.api_client_secret: id, client_id, secret_hash x-ticvai-secret
    blind-index, hash_key_version, issued_at, expires_at, revoked_at). createApiClient writes the first row;
    rotateApiCredential inserts a row, cuts earlier rows to the overlap, renews the client''s expires_at, 404, 409
    api-client-suspended / api-client-revoked; revokeApiCredential sets revoked_at on every row, 404, 409
    api-client-revoked; issueApiToken reads the live rows and the one licence in force (401 on no match).
    registerDeveloper: x-ticvai-permission null, scope platform, body CreateDeveloperAccountRequest, owner
    developer_member written with the account, 409 developer-already-registered, DeveloperAccount
    x-ticvai-unique-together [contactEmail] (lower(contact_email)). New verifyDeveloper (POST
    /developers/{developerId}/verify, DEVELOPER_ADMIN, staff, 409 developer-not-pending). setApiLicensing:
    ApiLicence.tenantId writable by staff and a key to control.tenant, 409 api-licence-period-overlap, 422
    unknown-tenant. states/api-client.yaml: revokeApiCredential no longer suspends, rotateApiCredential no longer
    reactivates. states/developer-account.yaml: pending to verified by verifyDeveloper. docs/adr/0063: amendment of
    25 October 2026, a client secret is HMAC-SHA-256 under the platform''s client-secret key with its key version.
    docs/active/breaking-changes.yaml BC-464 and BC-465 (registerDeveloper''s request fields and permission).'
  by: Chinmay
  date: '2026-10-21'
why: 'ADAM CR-098 (Deep Khanvilkar, ticket 27976 rotateApiCredential; also 27979 createApiClient, 27986 module test),
  accepted 15 to 21 October 2026 for the next release and moved to r10 (PLAN-r10). control.api_client had nowhere to
  keep a client secret and ADR-0063 named no form for one; rotation had no 404 or 409 and the state model let rotation
  reactivate a suspended client and revocation suspend; nothing tied a partner caller to a developer, so any
  DEVELOPER_MANAGE partner could rotate any client; registerDeveloper was public yet declared a permission and tenant
  scope, required read-only fields, had no duplicate rule and no owner member, and no operation verified an account;
  setApiLicensing could not name the tenant and allowed overlapping licences. status_reason is already in r6
  (backend/control/V0104__after_r1_20261015.sql).'
keys_touched:
  operations: [registerDeveloper, verifyDeveloper, listApiClients, createApiClient, rotateApiCredential,
    revokeApiCredential, issueApiToken, createSandbox, requestProductionAccess, setApiLicensing]
  schemas: [ApiClientSecret, CreateDeveloperAccountRequest, DeveloperAccount, ApiLicence]
  tables: [control.api_client_secret, control.developer_account, control.developer_member, control.api_client,
    control.api_licence]
  files:
  - contracts/satellite/public-api.yaml
  - states/api-client.yaml
  - states/developer-account.yaml
  - docs/adr/0063-encryption-keys-and-biometric-templates.md
  - docs/active/breaking-changes.yaml
root_class: 'new: a credential the operations issue and verify with no stored form and no owner rule'
tickets:
  started:
  - '27976 (rotateApiCredential): through CR-098''s comment, as CHG-ADM-002 says; its text is not rewritten.'
  unstarted:
  - '27979 (createApiClient), 27986 (module test) and the registerDeveloper / setApiLicensing task
    (SVC-PLATFORM-PUBLICAPI-2): pick the change up at the r10 tag. The new table is migration work for the
    migrations owner, a child task of the affected MIG ticket.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-098
triage: blocker
prevention:
  type: check
  ref: tools/check-contract-storage.py
status: open
notes: 'The prevention is ST-SECRET-FORM: a stored write-only secret must say which of the forms ADR-0063 names it
  takes, so secret_hash declares blind-index, and the ADR amendment says what that form means for a control-plane
  secret. verifyDeveloper has no screen binding yet (DEV-008 would carry it); that is lane D''s. Open for the lead: the
  decision proposes the keyed hash under a platform key ("in the form the lead names"); this entry builds that
  proposal.'
