summary: Every ticket Tanmay Dukhande held at r5 is Narayan Gaonkar's after the r6 apply, the app-modules he led and the
  tickets the plan gives a hire who has no OpenProject account yet included; the one module test Narayan now builds
  most of goes to a peer, as decision 5 requires.
decision:
  what: 'tools/sprint_plan.py handed_leads: every pushed app-module (Feature) the last release (r5) gave someone who
    left goes to their successor (team.json successors); tools/build-service-docs.py applies it after the lead-of rule
    (not with --rebalance). tools/op-release.py writes the bundle''s `successors` (OpenProject names), and
    tools/op-release.rb, in the assign phase, gives a New ticket''s assignee or accountable that is still someone who
    left to the successor when the plan''s person has no OpenProject account yet (it used to leave the field as it
    was). Re-derived: 9 app-modules move to Narayan (2 in Block A: AM-SETUP-TICKETING-GUEST-COMMERCE-P08-REST #28081
    from Hrushikant Patkar, AM-MARKETING-CRM-P08-BLOCK-A #28827 from Pranay Shinde; 7 in Blocks B to D); nothing else in
    tasks.csv changes.'
  by: Chinmay
  date: '2026-10-15'
why: 'The r6 rehearsal pull of r6-candidate c56b9dc4 (the r6 rehearsal summary (lead workspace), lead workspace) moved 5 of
  Tanmay''s Block A tickets to people other than Narayan, against the lead''s words of CHG-PPL-001 ("tanmay is leaving so
  shift all tasks to narayan"): pinned_owners pins tasks only, so the app-modules he led were worked out again (whoever
  carries the most points); AM-TICKETING-P08-BLOCK-A #28171 and TEST-AM-TICKETING-P08-BLOCK-A #28196 are planned for
  New full-stack developer 2, who has no OpenProject account, so the apply leaves them on Tanmay (the stand-in
  OpenProject had made placeholder users and hid it); TEST-AM-SETUP-VENUE-OPERATIONS-P08 #28446 moved under decision 5
  (CHG-TKT-007). Counted over the live r5 state of 14 October with op-release.rb''s rules, whole project: before 2 open
  tickets left on Tanmay and 13 of his r5 tickets not Narayan''s; after 0 on Tanmay and 1 not Narayan''s (#28446, keep).'
