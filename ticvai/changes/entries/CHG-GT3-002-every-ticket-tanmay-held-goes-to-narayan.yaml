notes: 'Batch GT3 (r6 fix round 3). This completes CHG-PPL-001 (same decision, same waiver). Keep: TEST-AM-SETUP-VENUE-
  OPERATIONS-P08 #28446 goes to Pallavi Sawant, not Narayan: Narayan builds 24 of its points and the lead''s decision 5
  (14 October) says a module test is never its main builder''s (check-plan-owners O-SELF-TEST); with Tanmay it would
  have moved the same way. Tension, for the lead: in OpenProject #28196 (TEST-AM-TICKETING-P08-BLOCK-A) is held by
  Narayan, who builds most of that module, until New full-stack developer 2 has an account (the plan''s owner);
  the next apply after that moves it. op-release.rb could not be run here (no Ruby): the rule was counted with a
  simulation of the assign phase (scratchpad the batch count script (lead workspace)). The rehearsal tooling should treat
  placeholder names as having no account.'
