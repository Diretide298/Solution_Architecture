id: CHG-R8DEC-001
date: '2026-10-20'
source: cr
kind: contract
summary: '`attemptsRemaining` is carried on every wrong-credentials 401 of `login`, not on `sso-sign-in-required`
  (which checks no credential), and on `verifyMfaChallenge`''s wrong-code 422, not on its 401 (a missing or expired
  challenge session is not a wrong credential). The contract said "every 401" of both, the SSO answer included.'
decision:
  what: 'contracts/spine/identity.yaml: login''s 401 says every wrong-credentials 401 (`unauthenticated`) carries
    `attemptsRemaining` and `sso-sign-in-required` does not; verifyMfaChallenge''s 401 answers the shared Problem and says
    it does not carry the count (MfaCodeInvalidProblem stays on its 422); LoginDeniedProblem no longer lists `attemptsRemaining` as
    required (it serves both problem types) and says where the field is present and where it is absent.
    tools/check-business-rules.py BR-LOGIN-ATTEMPTS holds the narrowing in place of the `required` it checked.'
  by: Chinmay
  date: '2026-10-20'
why: 'The lead''s answer of 20 October 2026 (about 12:40 IST) to a sheet of four r8 items, whose item 3 recommended
  confirming the narrowing of ADAM CR-170 ("every 401" read as every wrong-credentials 401, never
  sso-sign-in-required): "Yes. to all decision. 1-4"; and his fix round of the same day: verifyMfaChallenge''s 401
  (a missing or expired challenge session) is not a wrong credential, so the count stays on its 422 (CR-170 option D)
  and leaves its 401. CHG-CRA-009 had written the 19 October reading as every 401.'
keys_touched:
  operations: [login, verifyMfaChallenge]
  schemas: [LoginDeniedProblem, MfaCodeInvalidProblem]
  files:
  - contracts/spine/identity.yaml
  - tools/check-business-rules.py
root_class: 'A-STORAGE-PROMISE: the contract promises more than its responses carry (class 8 of the 18 October triage)'
tickets:
  started: []
  unstarted:
  - 'PTR-001 (#27785, where CR-170 was raised) and the tickets that link login or verifyMfaChallenge, as CHG-CRA-009
    lists them; no screen changes (the denied state is the wrong-credentials 401; the SSO state shows no count).'
release_tag: r8
decision_owner: Chinmay
adam_cr: CR-170
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py
status: closed
closed_by_commit: 'f852ee8b'
notes: 'Additive for check-contract-compat: `attemptsRemaining` and the 401''s MfaCodeInvalidProblem are new since r1,
  so the field becoming optional on login and leaving verifyMfaChallenge''s 401 is not a breaking change against the r1
  baseline (its output is unchanged by this entry). A client built on r7 that read the count from verifyMfaChallenge''s
  401 reads it from the 422 only.'
