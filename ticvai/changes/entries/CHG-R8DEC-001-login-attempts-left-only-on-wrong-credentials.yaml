id: CHG-R8DEC-001
date: '2026-10-20'
source: cr
kind: contract
summary: '`attemptsRemaining` is carried on every wrong-credentials 401 of `login` and `verifyMfaChallenge`, and not on
  `sso-sign-in-required`, which checks no credential: the contract said "every 401" and had the SSO answer carry the
  count as it stands.'
decision:
  what: 'contracts/spine/identity.yaml: login''s 401 says every wrong-credentials 401 (`unauthenticated`) carries
    `attemptsRemaining` and `sso-sign-in-required` does not; verifyMfaChallenge''s 401 cites the same reading (its 401 is
    the session credential failing; it has no SSO answer); LoginDeniedProblem no longer lists `attemptsRemaining` as
    required (it serves both problem types) and says where the field is present and where it is absent.
    tools/check-business-rules.py BR-LOGIN-ATTEMPTS holds the narrowing in place of the `required` it checked.'
  by: Chinmay
  date: '2026-10-20'
why: 'The lead''s answer of 20 October 2026 (about 12:40 IST) to a sheet of four r8 items, whose item 3 recommended
  confirming the narrowing of ADAM CR-170 ("every 401" read as every wrong-credentials 401, never
  sso-sign-in-required): "Yes. to all decision. 1-4". CHG-CRA-009 had written the 19 October reading as every 401.'
keys_touched:
  operations: [login, verifyMfaChallenge]
  schemas: [LoginDeniedProblem]
  files:
  - contracts/spine/identity.yaml
  - tools/check-business-rules.py
root_class: 'A-STORAGE-PROMISE: the contract promises more than its responses carry (class 8 of the 18 October triage)'
tickets:
  started: []
  unstarted:
  - 'PTR-001 (#27785, where CR-170 was raised) and the tickets that link login or verifyMfaChallenge, as CHG-CRA-009
    lists them; no screen changes (the denied state is the wrong-credentials 401; the SSO state shows no count).'
release_tag: r8
decision_owner: Chinmay
adam_cr: CR-170
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py
status: open
notes: 'Additive for check-contract-compat: `attemptsRemaining` is new since r1, so it becoming optional is not a
  breaking change against the r1 baseline (its output is unchanged by this entry).'
