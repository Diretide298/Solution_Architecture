id: CHG-GRD-001
date: '2026-10-14'
source: audit
kind: process
summary: 'The gate holds what the Block A pull found: every Block A feature and task links something ADAM pulls, and
  every link ADAM loads (adam-links.json) resolves to an operation, table or declared read view, screen, ADR, tracked
  file or service the package has at HEAD; tools/check-ticket-links.py, gating and strict.'
decision:
  what: 'tools/check-ticket-links.py (audit_guard Guard, self-tests first): TL-NOTHING-LINKED, a Feature or Task under
    BLOCK-A (tasks.csv, and op-release.json''s Block A still in the plan) with an OpenProject id and no link adam_pull
    pulls (an `adr` link alone is nothing: adam_pull lists decisions and pulls no file); TL-DEAD-LINK, a row of
    handoff/service-docs/adam-links.json whose target HEAD lacks (contract#operationId in a contract, a table in
    handoff/schema-reference.json or a read view audit_guard.read_views finds in the lineage, a screen in screens/, an
    ADR with a docs/adr file, a `file` git tracks, a service in service-decomposition.json; any other kind fails).
    Every finding strict (never baselined); registered gating in tools/run-checks.py; empty baseline recorded.'
  by: Chinmay
  date: '2026-10-14'
why: 'Lead, 14 October 2026: "With the pattern of errors we need to get them updated": the gate must stop the audit''s
  error patterns coming back. Audit classes adam-pull/feature: nothing linked (123 Block A features), adam-pull/task:
  nothing linked (29 tasks) and adam-pull/links ADAM cannot resolve (55 tickets), docs/active/audit/audit-1014/classes.json;
  batch TKT fixed the generator (CHG-TKT-004, CHG-TKT-005, CHG-TKT-006) and nothing in the gate held it. Finding counts:
  on audit-base b93b5a87 the check finds 152 tickets with nothing linked (123 features, 29 tasks: the audit''s count
  exactly) and 66 dead links on 61 tickets (12 of them among the audit''s 1,406 Block A tickets, the rest their
  sub-tasks; lineage views now resolve as declared read views, CHG-GTE-001); on audit/gate-guards-base e7211da9 with
  build-service-docs.py and adam-links.py re-run, 0 and 0.'
