id: CHG-FIN-003
date: '2026-10-02'
source: mom
kind: contract
summary: 'Blind close: the cashier counts through submitShiftCount and never sees expected cash or the variance;
  the variance alerts the supervisor.'
decision:
  what: 'New operation submitShiftCount (receipt: closed, referred to supervisor or awaiting approval; no figures);
    Shift.expectedCash and variance null to the shift''s own cashier; closeShift becomes the supervisor and back-office
    path; cashier reason and note with every count; cashier screens never show sales, refunds, lifts, expected or
    variance.'
  by: Chinmay
  date: '2026-10-02'
why: 'MoM 12 Aug 2026 section 19 (DI-271: the cashier does not see the expected total; supervisor review) and MoM
  9 Sep 2026 4.18 (DI-803, DI-804, DI-806: "if a cashier knew they had a small surplus, they could pocket it").
  The package contradicted it: closeShift returned expectedCash and variance to the till, POS-007 showed the variance
  after submission, POS-001 carried expectedCash into the close and the client prototype shows EXPECTED live (POSV2-3,
  audit R080 (e)). Chinmay, 2 Oct 2026. Practice: docs/active/research-uae-vat-and-blind-close-2-october.md.'
