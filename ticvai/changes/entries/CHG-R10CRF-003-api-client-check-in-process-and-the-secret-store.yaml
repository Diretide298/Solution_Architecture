id: CHG-R10CRF-003
date: '2026-10-26'
source: cr
kind: contract
summary: 'setApprovalExternalProvider answers 422 api-client-not-active from Platform''s public-api#apiClientRecords asked
  in process over commerce''s control connection (the granted read XDR-006; served in-process as well as service), and
  writes outboundCredential and signingSecret through the Key Vault secret store (ISecretStore), the row keeping only the
  reference; the grant is written into the control database''s forward migration.'
decision:
  what: 'ADAM CR-243, option A, as recommended. docs/active/cross-deployable-writes.yaml XDR-006 (commerce SELECT
    control.api_client, query public-api#apiClientRecords, operation setApprovalExternalProvider).
    contracts/satellite/public-api.yaml apiClientRecords: served [in-process, service], its rule says commerce asks it in
    process and names the rows it may see (allowed_tenant_ids; control.api_client has no row security).
    contracts/spine/approvals.yaml setApprovalExternalProvider: x-ticvai-read-via route in-process, the description (the
    granted read, the 422''s three causes, the secret store and its test double until it lands). tools/derive-ddl.py
    deployable_read_grants: a control.* table''s grant goes to control/920-row-level-security.sql and the control forward
    migration, not the tenant''s. handoff/cross-deployable-writes.md rewritten (check-cross-deployable-writes --write).'
  by: Chinmay
  date: '2026-10-26'
why: 'ADAM CR-243 (Deep Khanvilkar, #31184 setApprovalExternalProvider), accepted by the lead on 26 October 2026. The
  only allowed route to control.api_client was Platform''s service route, which is not built (CR-174), and nothing builds
  a Key Vault store for the write-only secrets (CHG-R1S-020; ADR-0063 decides Key Vault but names no build).'
keys_touched:
  operations: [setApprovalExternalProvider]
  schemas: [ApprovalExternalProvider]
  tables: [control.api_client, approvals.external_provider]
  files:
  - docs/active/cross-deployable-writes.yaml
  - contracts/satellite/public-api.yaml
  - contracts/spine/approvals.yaml
  - tools/derive-ddl.py
  - handoff/cross-deployable-writes.md
root_class: 'a cross-deployable read with no route that is built (the CR-240 class), here into the control database'
tickets:
  started:
  - '31184 (setApprovalExternalProvider): through CR-243''s comment; its text is not rewritten.'
  unstarted:
  - 'The Key Vault secret store ticket (ISecretStore, the Azure Key Vault adapter and package), ordered before #31184,
    #30719 and #30721: a plan item the lead files after the r10 tag (LEAD-QUESTIONS-r10, plan items).'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-243
triage: blocker
prevention:
  type: check
  ref: tools/check-cross-module-reads.py
status: open
notes: 'Database: the control database''s forward migration grants commerce USAGE on schema control and SELECT on
  control.api_client, each guarded on the role and the object. Which role commerce''s routing connection to the control
  database uses is the repository''s (#27692); if it is not `commerce`, the guarded grant does nothing there and the
  migration owner names the role (an open question in the lane report).'
