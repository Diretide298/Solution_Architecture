summary: 'ADM-580 no longer declares listDevices and POS-026 no longer declares reprintOrder: no element on either
  approved screen reaches them, and both are reached on other screens; nothing visible changes.'
decision:
  what: 'ADAM CR-262, option A, the same ruling as CHG-R10OPN-005: screens/P08 ADM-580 drops the listDevices api ("The
    device register behind it"; the screen''s body has no component and its buttons are pack text), and screens/P04
    POS-026 drops reprintOrder ("Print the whole order again"; the screen''s one reprint control is "Reprint receipt",
    reprintReceipt). listDevices stays declared and reached on ANL-003, BO-036, BO-124, BO-405, BO-732, EMP-043,
    POS-016 and POS-025; reprintOrder on POS-002, POS-006, POS-030 and 17 more.'
  by: Chinmay
  date: '2026-10-26'
  quote: '"Yes, all six (Recommended)", then "actually get them build r10 thats fine"'
why: 'The r10 integration gate of 26 October 2026 (run 20261026-153734-1986): check-screen-wiring S-OP-UNREACHED on
  ADM-580 and POS-026, built on by started tickets, masked until now by the gate''s allowance pattern. The lead''s six
  decisions of 26 October 2026, item 5: a read the approved screen has no element for leaves it; if the screen later
  needs it, it comes back through a CR.'
