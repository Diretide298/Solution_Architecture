id: CHG-CR565-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'getDeveloperAccount follows public-api''s caller kinds (CR-536): TICVAI staff read any account; a partner caller
  (developer session, or a tenant session whose verified email is an active developer member) reads only its own, any
  other id 404; the member row is read again on every partner request (401 when no longer active); tenant staff 403. It
  is no longer x-ticvai-self-scoped to the principal, declares its reads (control.developer_account,
  control.developer_member), and adds 401; DEVELOPER_VIEW stays.'
decision:
  what: 'Posted on #31389 (Chinmay, 3 November 2026), under the lead''s "Dont hold r13. approve them and rever tto the devs" of 3 November 2026: "getDeveloperAccount follows the caller kinds
    already in public-api.yaml ... (1) Work out the caller kind from the token, never from a permission ... (2) A
    partner caller reads only its own account: a developerId naming any other account answers 404 not-found ... (3) ...
    if it is no longer active, answer 401 ... (4) Tenant staff get 403. (5) Declare the reads: control.developer_account
    ... and control.developer_member ... Add the 401 response, and describe the 403 as tenant staff. DEVELOPER_VIEW
    stays the permission."'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-565 (#31389 getDeveloperAccount): the operation was self-scoped to the principal and nothing linked a
  principal to a developer account; CR-536 (CHG-CR536-001) settled the caller kinds for four other operations only.'
