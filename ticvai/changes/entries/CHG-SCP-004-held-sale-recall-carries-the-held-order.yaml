summary: 'Recalling a held sale (POS-006 to POS-002) carried six fields of the prototype''s cart (cart, cartHoldExpiresAt,
  guest, discount, table, orderType) that POS-006 never holds; it now resumes the held order and carries its orderId
  and the guest''s subjectId, and POS-002 reads the rest with the order.'
decision:
  what: 'screens/P04-point-of-sale.yaml, POS-006 transition to POS-002 ("Recall this held sale"): `operation:
    resumeOrder` (already on the screen, behind its Resume order button) and `carries: [orderId, subjectId]`, in place
    of the six cart fields. The parked cart is the held order (CHG-SPO-015): its lines, discounts, hold clock
    (`heldUntil`), table and order type are fields of the Order that resumeOrder returns and POS-002 reads by
    `orderId`, so the hold clock still travels with the sale. The transition, its trigger and its control are
    unchanged; nothing on either screen changes.'
