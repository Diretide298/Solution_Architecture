id: CHG-NOTE-008
date: '2026-10-02'
source: audit
kind: design-input
summary: 'venue operations: the 243 open questions Chinmay decided on 2 October move to `decisions` (196 reviewable defaults);
  32 rule edits where a decision changes the drawing; 195 corrections marked fixed, 19 logged and 0 withdrawn against
  the change entries that acted on main.'
decision:
  what: Record each decided question of handoff/design-notes/venue-operations.yaml as a decision on its screen (question,
    decision, decidedBy Chinmay, date, the DEC ledger id and this entry; reviewable for a non-critical default), update
    the screen's inputs, outputs, actions, edge cases and sample data where the decision changes what is drawn, and mark
    each correction main has already acted on (status fixed / logged / withdrawn, by the change entry), so the open corrections
    are the ones without a status.
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay''s answers of 2 October to the open-questions workbook (Q125-Q143, Q225-Q239, Q241-Q273, Q362-Q458, Q460-Q538):
  batches 1-6, the critical sets, and "show me only critical" for the non-critical defaults; the later rounds win (Door
  follow-ups, Pre-apply round: roles as preset permission configurations, darkMode deprecated, Powered by as a toggle
  default on, closeShift on POS-007 plus the daily reconciliation). The design notes still listed them as open, so a design
  session would draw the old default. The corrections'' status was read from the screens on main after the wiring (CHG-WIR-001..027),
  guest (CHG-GST-001..006), door (CHG-DOOR-001..006), finance (CHG-FIN-001..011) and loyalty (CHG-SEED-008) fixes.'
