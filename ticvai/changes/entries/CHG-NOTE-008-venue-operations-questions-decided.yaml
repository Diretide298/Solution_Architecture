prevention:
  type: check
  ref: tools/check-design-notes.py
status: closed
closed_by_commit: 5735d15e
notes: 'check-design-notes now validates `decisions` (fields, date, a DEC id and an existing CHG id in source, questionSource
  resolved, no question left in both lists) and correction `status`/`by` (fixed, logged or withdrawn, by an existing change
  entry), and refuses any CHG id a source names that has no entry. Before this change the notes had no `decisions` key,
  so nothing recorded that a question was answered.


  Decisions by kind: {''default accepted'': 20, ''answered'': 27, ''default (non-critical, reviewable)'': 196}.


  Corrections by entry: CHG-WIR-001 175 fixed; CHG-WIR-002 13 fixed; CHG-WIR-003 7 fixed; CHG-WIR-004 19 logged. Corrections
  with no status (1184) are still open.


  Tickets: none started (Block A starts Monday 5 October 2026); the notes feed the design batches at the next refresh,
  not ticket text.


  Still open here (needs research, CHG-NOTE-010): BO-192 (1), BO-629 (1).


  Answers that change the drawn default:

  - DEC-128 (Q128) BO-188: Biometric capture and retention need the guest''s consent first, on the venue''s own consent
  form. Where TICVAI stores the data, the venue is warned that the guest must accept a consent form.

  - DEC-136 (Q136) GST-055: Dynamic QR rotation step: 30 seconds (the venue''s setting).

  - DEC-138 (Q138) GST-069: Superseded: children MAY be enrolled with guardian consent on the venue''s form; the minor
  age is per country and the venue can switch minors off (Critical set 1, BO-187). The batch-4 default (''not available
  for under-18s'') no longer applies.

  - DEC-225 (Q225) ANL-070: Add an analytics governance policy operation (masking, export restriction, retention, sharing,
  AI/API access).

  - DEC-227 (Q227) BO-146: Zone security classification levels: Public / Restricted / Secure / Critical (renamable).

  - DEC-228 (Q228) BO-147: An access point whose attraction is temporarily closed denies, shows the reopening time, and
  offers a virtual-queue return window where enabled.

  - DEC-229 (Q229) BO-152: Overlapping calendar entries: the venue sets a priority per entry.

  - DEC-230 (Q230) BO-153: Topology publication approval is a policy the venue switches on or off; when on, a second person
  approves.

  - DEC-231 (Q231) BO-157: Journey rules get an ''Applies to'' picker: venue-wide by default, or chosen products/admission
  profiles.

  - DEC-232 (Q232) BO-159: Time-bound product entitlements (validity from first scan, e.g. 60 minutes) belong to the access
  engine.

  - DEC-233 (Q233) BO-165: QR refresh: 30 s default; offer 15/30/45/60 and custom (5 s minimum).

  - DEC-236 (Q236) BO-186: Face Pass enrolment: the app, the staffed counters and a self-service kiosk (consent shown);
  not the turnstile.

  - DEC-237 (Q237) BO-187: Minors: enrolment with guardian consent on the venue''s form; the minor age is set per country;
  the venue can switch minors off. Supersedes the GST-069 default.

  - DEC-239 (Q239) BO-190: Face re-enrolment review: images behind ''View images (logged)'', needing a specific permission;
  score and references always visible.

  - DEC-241 (Q241) BO-196: Adding an access device needs a secure enrolment code and a pending-approval stage.

  - DEC-245 (Q245) BO-203: A device''s approver into production must differ from the person who tested it.

  - DEC-254 (Q254) BO-229: A second approver for permanent locks, whitelisting, and releasing identity/permanent locks;
  none for ''until end of day''.

  - DEC-255 (Q255) BO-230: A gate''s direction can be switched live (Entry to Exit) with a specific permission, and the
  switch is logged. R221 is amended.

  - DEC-260 (Q260) BO-247: Dual authorisation to release locks: as BO-229.

  - DEC-261 (Q261) BO-248: Security reviewer and face-change photos: as BO-190 (behind ''View images (logged)'', permission
  needed).

  - DEC-266 (Q266) BO-336: Map the pack''s 13 Virtual Ticket status names onto the entitlement model; add any missing
  states.

  - DEC-368 (Q368) ACC-006: One queue and one workspace component, used in both P11 (ACC-006, ACC-007) and P08 (BO-635,
  BO-636).

  - DEC-397 (Q397) BO-427: Whether an all-games pass covers games added after sale: the venue configures it; default yes
  (type-based passes cover new games).

  - DEC-426 (Q426) BO-471: The venue sets a maximum offline duration; readers then refuse offline taps.

  - DEC-457 (Q457) BO-627: UAE Pass and ICP verification integrated in release 1 (needs client access).

  - DEC-461 (Q461) BO-631: Face matching for accreditation duplicates only where the venue enables it, with applicant
  consent and the venue''s legal sign-off; off by default.

  - DEC-530 (Q530) EMP-027: Another supervisor must close a critical incident (the person who completed the corrective
  action cannot close it).


  Also changed:

  - VO-R15: "Powered by TICVAI" is a toggle on CMS-104, on by default

  - BO-493 branding rule: "Powered by TICVAI" no longer "fixed"

  - BO-335 openQuestions[1] was a correction filed as a question ("Write-only; no read of the current configuration");
  it moves to the screen''s corrections, still open


