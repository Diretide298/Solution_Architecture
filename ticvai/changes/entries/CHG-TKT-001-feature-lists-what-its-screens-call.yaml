id: CHG-TKT-001
date: '2026-10-14'
source: audit
kind: spec
summary: A feature ticket's Builds list is its screens and the operations those screens call; the operations its back-end
  tasks build are a sentence of their own, each called-elsewhere one with the screens and app-module tickets that call it.
decision:
  what: 'tools/build-service-docs.py (the app-module feature description) writes Builds from the feature''s screen tasks
    (either track: a Venue Management screen is on the backend track) and ticket_done.screen_calls (setup slices respected);
    tools/ticket_done.py builds_of reads a feature''s Builds; tools/ticket_features.py reads a feature''s operations from
    its own Builds (Feature.ops) and keeps what its tasks build apart (Feature.built). The back-end tasks stay where they
    are: a pushed task keeps its operations and parent (CHG-R6-052, CHG-R6-054).'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit class check-ticket-scope/S-FEATURE-OP-UNUSED (#27741 problem 1; CHG-SWP-001): 741 findings, 1080 tickets, 500
  due by 28 October (docs/active/audit-runs/audit-1014/classes.json); after the fix 0. Cause: a backend operations task is put
  under the first feature that needs any of its group''s operations, and the feature listed the whole group as its own.
  Regrouping the back-end tasks instead would have moved pushed sub-tasks (check-key-stability blocks it), so the list is
  fixed where the developer reads it. Reuses the unfinished GAP rule (27741-ticket-rule patch). Audit finding, Block A audit
  on audit-base b93b5a87.'
