id: CHG-CR418-001
date: '2026-10-31'
source: cr
kind: contract
summary: 'listLearningModelPerformance is built once the price outcome measure is specified: the AI engineers specify
  it now as a Block A task (the plan lane files it), ADM-117 stays in Block A, and nothing answers invented figures
  until then. No catalogue.model_scorecard table: the scorecard is assembled from that measurement, the AI module''s
  forecast accuracy and model stages (getForecastAccuracy, ai.capability_maturity) and Catalogue''s recommendation
  decisions (humanOverrideRate = modified decisions / all decisions).'
decision:
  what: 'ADAM CR-418, posted 31 October 2026 on #35225: "Decided (Chinmay, 31 October 2026): not as recommended: C now,
    and no catalogue.model_scorecard table. ADM-117 stays in Block A. A scorecard needs the actual outcome of each
    executed price: the revenue and demand after it, against its forecast, and nothing measures that yet. The AI
    engineers specify that measurement now, as a new Block A task (the price outcome measure); it serves this screen,
    the queue''s actual revenue result (CR-416) and the performance KPIs (CR-407). #35225 follows that task ... The
    scorecard is then assembled from three sources, not from a second store: that measurement; the AI module''s
    measured forecast accuracy and model stages (getForecastAccuracy, ai.capability_maturity); Catalogue''s own
    recommendation decisions (humanOverrideRate is modified decisions divided by all decisions)." The lead''s answer of
    31 October 2026: "the AI engineers specify the price outcome measure now; ADM-117 stays in Block A." Built into
    r12 on the lead''s instruction of 31 October 2026: "Include them in r12".'
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM CR-418 (Hrushikant Patkar, #35225, blocking): a row of listLearningModelPerformance is one model scorecard,
  but its four tables hold forecasts and recommendations, not outcomes, and no job writes a scorecard. Forecast
  accuracy and model stages already live in the AI module (ADR-0020 keeps AI its own deployable), so a Catalogue
  scorecard table would duplicate them; what nobody measures is the executed price''s outcome.'
