  ref: tools/check-landing-figures.py
status: open
notes: 'Lane i (E-03, the derive stops writing authored files): sync-counts still edits README.md, backend/README.md
  and services/README.md in place, between its phrase patterns; OVERVIEW.md is no longer one of them. Not changed here:
  OVERVIEW''s "Screens drawn on a board N of N" row is computed as the screen count against itself (always 100%).'
