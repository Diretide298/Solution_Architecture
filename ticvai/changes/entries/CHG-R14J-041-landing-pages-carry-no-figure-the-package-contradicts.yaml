id: CHG-R14J-041
date: '2026-11-03'
source: audit
kind: process
summary: 'The landing and orientation pages carry no figure the package contradicts. OVERVIEW.md is written whole by
  tools/derive-overview.py and nothing edits it afterwards: tools/sync-counts.py rewrote it in place with bare "<n>
  screens" and "<n> operations" patterns, which turned "2 screens cannot be reached" into "2453 screens cannot be
  reached" and "577 of 2,056 operations" into "577 of 2864 operations". derive-overview now counts authored journeys
  against the Flows metric''s target (98 of 120, beside 193 board-derived routes, not "98 of a target 60"), names the
  contracts with no operation in an authored journey instead of a typed "seventeen contracts", reads the build figure
  and the DDL tables from handoff/status.json instead of "Build is 0%, no migration has run", counts the checks from
  tools/run-checks.py and the derivers from tools/, and states blocking conflicts from status.json. sync-counts no longer
  touches OVERVIEW.md, COVERAGE.md or MANIFEST.md, refuses any page that says it is generated by a tool, and its count
  patterns start with a digit (`[\d,]+` matched a bare comma and wrote "registers738 indexes"). COVERAGE.md (17 August)
  and MANIFEST.md (the 10 September drop) are marked historical and point to OVERVIEW.md; docs/architecture/
  frontend-delivery.md says its figures are of 17 August; screens/README.md and frontend/README.md lose their typed
  counts and tables (the dated text kept under "History (17 August 2026)"), frontend/README.md no longer claims to be
  generated; rtl-and-theming.md says which platforms declare both directions (all but P14 and P15) instead of "the
  twelve platforms"; README.md loses its stale counts ("364 definitions", "10 app manifests", "23 user journeys", "22
  checkers", "92 raised"), its 17 August validation recipe and its "no SQL is written, no code is built".'
decision:
  what: 'r13 system review finding F-13 (landing and orientation pages contradict the package). The lead, 3 November
    2026: "All four, one release". The fix is at the generators (derive-overview.py, sync-counts.py) and in the
    hand-written pages; a page that was a dated record is marked historical rather than given new figures nobody
    derives. tools/check-landing-figures.py (LF-FIGURE, LF-COUNT-TABLE, LF-OVERVIEW, self-test), registered in
    run-checks, fails on a landing page stating "<n> <noun>" (digits or a number word) for a count status.json has
    otherwise, on a typed count table, and when OVERVIEW.md is not what derive-overview renders now; a page marked
    Historical in its first lines, a "History" section and code blocks are not read. On the r13 tree it reports 60
    findings (19 figures, 40 count-table rows, OVERVIEW.md); on the fixed tree none. The kiosk (P05) lines of
    frontend-delivery.md and frontend/README.md are left to F-11 (lane j, kiosk manifest).'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 system review of 3 November 2026, finding F-13 (screens and flows): the first pages a developer opens gave
  wrong numbers; the root causes were a later refresh step rewriting a generated page and hand-typed counts on pages no
  tool regenerates.'
keys_touched:
  files:
  - tools/derive-overview.py
  - tools/sync-counts.py
  - tools/check-landing-figures.py
  - tools/run-checks.py
  - OVERVIEW.md (regenerated by derive-overview)
  - README.md
  - COVERAGE.md
  - MANIFEST.md
  - screens/README.md
  - frontend/README.md
  - docs/architecture/frontend-delivery.md
  - docs/architecture/rtl-and-theming.md
  other:
  - 'refresh order: OVERVIEW.md is now written by derive-overview alone (refresh.sh step derive-overview); the
    refresh manifest''s trace still lists sync-counts as its writer until the next --trace run'
root_class: a generated page edited in place by a later step, and hand-typed counts on pages no tool regenerates
tickets:
  started: []
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: 'none: the r13 system review of 3 November 2026, the lead''s decisions of that day'
triage: fix-forward
prevention:
