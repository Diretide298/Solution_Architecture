summary: 'ADR-0063 records the biometric decisions of 2 October and becomes Accepted in part: consent on the venue''s form with a warning
  where TICVAI holds the data, enrolment at app, counters and kiosk (never the turnstile), minors with guardian consent (configurable),
  images behind a logged permissioned view, face dedupe only with consent.'
decision:
  what: 'Biometrics: consent first on the venue''s consent form (DEC-128); Face Pass enrolment at the app, counters and a self-service
    kiosk, not the turnstile (DEC-236); minors with guardian consent, the minor age per country, switchable (DEC-237, DEC-138, DEC-283);
    ''View images (logged)'' behind a permission (DEC-239, DEC-261); accreditation face matching only with consent and legal sign-off,
    off by default (DEC-461); the consent-form builder (DEC-549).'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October: batch 4 (BO-188, workbook Q128) and critical sets 1 and 3 (Q236, Q237, Q239, Q261, Q283, Q461). ADR-0063 listed
  under-18s as open for the DPO; R205 is amended in the audit register (CHG-DOC-016).'
