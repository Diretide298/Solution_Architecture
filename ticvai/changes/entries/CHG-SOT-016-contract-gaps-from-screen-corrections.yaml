id: CHG-SOT-016
date: '2026-10-02'
source: audit
kind: contract
summary: 'Open: the contract gaps that block 37 design-note corrections on P10, P14, P16 and P17 (prospect and partner audiences,
  missing update operations, unbound response shapes, a missing query on explanations), logged rather than invented.'
decision:
  what: 'Log, do not invent: (1) P17 sign-up screens call operations a prospect cannot call (scoreVsiAssessment, listModuleCatalogue,
    simulateCommercialPackage, listPlans, addCapacityPack, setSubscription, previewSubscriptionChange, setAgreementContractTerm)
    and submitOnboardingApplication requires TENANT_CONFIGURE while public; no operation amends a submitted onboarding application
    and no public upload exists for its documents; SGN-013/014/022/023 columns have no response fields. (2) Partner screens
    call staff-only operations (setPartnerDistributionRights, setPartnerCapabilityGrants, setPartnerCommissionRules, setPartnerCreditProfile,
    setPartnerSecurity, setPartnerAllocations, actOnPartnerReconciliationException, actOnPartnerCommissionLine, actOnPartnerSettlementBatch).
    (3) registerDeveloper requires DEVELOPER_VIEW while public; listProductionAccessRequests admits partners to TICVAI''s
    queue. (4) No dashboard draft, version, publish or rollback; no KPI update or retire; no certification, owner, glossary
    or lineage on the semantic model; AiMetricChangeExplanation carries no query. (5) listAiInsights is missing from the Block
    A slice for ANL-019.'
  by: Chinmay
  date: '2026-10-02'
why: 'Design-notes corrections (process-agent findings, 1-2 October 2026) on P10, P14, P16 and P17 that need an operation,
  an audience or a field the contracts do not have; phase B rule: "If a correction needs an operation that doesn''t exist,
  mark it logged and add it to an open CHG entry (kind contract)". ADR-0025 (audiences); ADR-0054; MATRIX 7.1.46.'
