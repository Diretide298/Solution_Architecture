id: CHG-R6-051
date: '2026-10-12'
source: developer
kind: process
proposed: '2026-10-12'
summary: 'A batch several agents work in at once is numbered in blocks (changes/schema.yaml id_blocks, R6 in tens), and
  check-changelog''s gap rule holds inside each block.'
decision:
  what: 'changes/schema.yaml gains id_blocks {R6: 10}; tools/check-changelog.py checks that each block a batch uses runs
    from its first id (001 for the first block, 050 for the block 050-059) without a gap, and keeps the old rule for
    every batch not listed. Three self-tests: an agent''s block beside the first passes, a gap inside a block fails, the
    same block without id_blocks fails.'
  by: Chinmay
  date: '2026-10-12'
why: 'The lead''s r4 tooling list, 12 October 2026, gave this agent CHG-R6-050 to CHG-R6-059 beside the lead''s
  CHG-R6-001 to CHG-R6-007 so parallel agents never collide; the gap rule (CHG-SEED, council of 2 October) refused any
  such block, so the instruction that check-changelog must pass could not hold.'
keys_touched:
  files:
  - changes/schema.yaml
  - tools/check-changelog.py
root_class: A00 TOOLING
tickets:
  started: []
  unstarted: []
release_tag: r4
