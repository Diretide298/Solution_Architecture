notes: 'check-design-notes now validates `decisions` (fields, date, a DEC id and an existing CHG id in source, questionSource
  resolved, no question left in both lists) and correction `status`/`by` (fixed, logged or withdrawn, by an existing change
  entry), and refuses any CHG id a source names that has no entry. Before this change the notes had no `decisions` key,
  so nothing recorded that a question was answered.


  Decisions by kind: {''default accepted'': 11, ''answered'': 2, ''default (non-critical, reviewable)'': 5}.


  Corrections by entry: CHG-GST-004 4 fixed; CHG-WIR-001 1 fixed; CHG-WIR-005 73 fixed; CHG-WIR-006 3 fixed; CHG-WIR-007
  1 logged. Corrections with no status (130) are still open.


  Tickets: none started (Block A starts Monday 5 October 2026); the notes feed the design batches at the next refresh,
  not ticket text.


  Answers that change the drawn default:

  - DEC-019 (Q19) CMS-025: Cookie scanner: buy a scanner API (hybrid). Our banner, runtime, registry and consent logs
  stay; a bought scanner API feeds recordCookieScan; the manual ''Upload scan report'' path stays.

  - DEC-283 (Q283) CMS-029: Children''s biometric data: as BO-187 (guardian consent, configurable).


  Rule edits:

