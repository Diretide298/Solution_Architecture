notes: 'Beyond the posted words: the Marketing read is named marketing-crm#bookingConsentRecords (input cartId, returns
  the current BookingConsentRecord rows), declared in marketing-crm.yaml x-ticvai-queries, served on the service route.
  CR-556 (lane d) says a line with an eligibilityDeclaration counts its rows; a cart line has no eligibility declaration
  (it is on CreateOrderLine only), so the two agree.'
