notes: 'Batch MOD, 14 October 2026. For the lead: read-beneath on ledger.legal_entity (read at region by
  closeFiscalPeriod, runFxRevaluation and getVatReturn and at venue by issueTaxInvoice) also opens, for reading, the
  tables that follow it by key (ledger.account, fiscal_period, fiscal_period_event, journal_entry), as CHG-GEN-005
  defines a split parent''s children; a grant beneath a legal entity can then read its ledger. The API still gates
  every read by permission (FINANCE_*); if RLS should keep a venue out of the ledger, those four operations run at
  tenant instead and the mark comes off. The same cascade applies to ai.knowledge_collection / knowledge_document
  (index sources, entries and jobs, chunk embeddings) and payments.terminal_certification (its level-3 rows).
  Verified: RF-OWNED-ABOVE 127 -> 4, 0 new.'
