id: CHG-MOD-008
date: '2026-10-14'
source: audit
kind: contract
summary: 'A scope_path table written only at the tenant and read below it is read beneath: 45 schemas gain
  x-ticvai-rls read-beneath, so a venue or region reads the tenant''s rows above it and still writes only its own.'
decision:
  what: '`x-ticvai-rls: read-beneath` on the schema persisting each table check-rls-scope-fit found (ai policies,
    tools, releases and knowledge, approval policies, catalogue pricing vocabularies, the legal entity, payment
    provider connections and certifications, reporting KPI definitions and models, resource vocabularies, wallet
    credit types and mappings, white-label pages and config versions, marketing privacy and suppression lists, and
    the rest the audit listed). derive-ddl swaps each to apply_read_beneath_rls in the next forward migration
    (CHG-GEN-004); a child that follows such a table by its key follows it for reading only (CHG-GEN-005).'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026 (audit/ticvai/runs/audit-1014/classes.json): class check-rls-scope-fit/RF-OWNED-ABOVE,
  127 findings touching 209 Block A tickets (66 due by 28 October); R183 ("owned above, read below") and ADAM
  CR-076. Default ruling (lead, 14 October): "A below-tenant read of a tenant-written table declares x-ticvai-rls:
  read-beneath." Count before 127, after 4: the four left read resources.venue_assignment and ai.byok_enablement,
  tables batch STO''s key declarations move, skipped as the brief says.'
