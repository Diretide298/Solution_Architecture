summary: claimCart reads and attaches the anonymous cart under ITenantRootGrant once its checks pass, for that one cart
  (CR-471's pattern), with the shared 404; retail.shop_and_drop is guest-reads-own (staff by venue, a guest reads its own
  drops); orders.ticket_transfer is read where its order is visible or by the guest from_subject_id or to_subject_id names
