id: CHG-CR453-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'setTemperatureCheckpoint reads the venue''s outlets in process (tenancy#outletRecords, XDR-004) and answers 400
  for an outletId not among them, for minCelsius above maxCelsius and for a check frequency of 0 or less. getSignageQueueCalls
  also answers leftCalled: the parties that left the called state since the cursor, each with its new state.'
decision:
  what: 'Posted on #37118 (Chinmay, 1 November 2026), under the lead''s "Approve all" (1 November 2026): "as you recommended
    (A). setTemperatureCheckpoint reads the venue''s outlets in process (Tenancy''s outletRecords) and answers 400 on outletId
    when it is not one of them, 400 when minCelsius is greater than maxCelsius, and 400 when the check frequency is 0 or
    less. getSignageQueueCalls also lists the parties that left the called state since the cursor, each with its new state,
    so the display drops a redeemed or expired party at once."'
  by: Chinmay
  date: '2026-11-01'
why: 'ADAM CR-453 (Hrushikant Patkar, #37118): the checkpoint write accepted any outlet and inverted or zero values, and
  the calls cursor never signalled a party leaving early.'
keys_touched:
  operations:
  - setTemperatureCheckpoint
  - getSignageQueueCalls
  schemas:
  - TemperatureCheckpoint
  files:
  - contracts/satellite/fnb.yaml
  - contracts/satellite/queue.yaml
  - docs/active/cross-deployable-writes.yaml
  - tools/check-business-rules.py
  other:
  - XDR-004 operations gain setTemperatureCheckpoint (no new grant)
root_class: a configuration write with no reference or value checks, and a delta read that misses leaving rows
tickets:
