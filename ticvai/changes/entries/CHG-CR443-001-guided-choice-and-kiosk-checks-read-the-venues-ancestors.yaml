id: CHG-CR443-001
date: '2026-11-02'
source: cr
kind: contract
summary: The guided choice checks (createGuidedChoice, proposeGuidedChoice, updateGuidedChoice, publishGuidedChoice) and
  the kiosk checks (getKioskConfigValidation, publishKioskConfigs) read catalogue.product_category, payments.method and
  assets.media_asset rows at the venue and at its ancestors (a media asset with venue_id null is the tenant's library),
  in process, for that check only; module enablement is read under the routed tenant's root grant, as built; every other
  read stays under the caller's grant. Stated on the operations and on the three queries' rules. The ancestor rows are read
  under the routed tenant's root grant, filtered to the venue's scope_path and its ancestors (the lead, 2 November 2026).
decision:
  what: 'Posted on #30932 (Chinmay, 1 November 2026), under the lead''s "Approve all" (1 November 2026): "as you recommended
    (A). The guided choice checks (CR-394) and the kiosk checks (CR-385) read rows at the venue and at its ancestors: catalogue.product_category,
    payments.method and assets.media_asset rows whose scope is the venue''s or an ancestor of it (for media assets, venue_id
    null counts as the tenant''s library), read in process for this check only. Module enablement is read under the routed
    tenant''s root grant, as you built and as getPublishedKioskConfig does: confirmed. Every other read stays under the
    caller''s grant." The lead, 2 November 2026, "yes for both", answering the lane''s two stops with their recommendations:
    the venue-and-ancestor reads are made under the routed tenant''s root grant, filtered to the venue''s scope_path and
    its ancestors, in process, for this check only, as CR-336 and CR-362 did; no read-beneath policy, no migration.'
  by: Chinmay
  date: '2026-11-01'
why: 'ADAM CR-443 (Hrushikant Patkar, #30932): under CR-394 and CR-385 the checks read under the caller''s row security,
  which hides a brand-level category, a tenant-wide payment method and a library asset from a venue grant (apply_scope_rls,
  apply_venue_rls), so venue staff got 400 target-not-in-venue and false kiosk errors.'
