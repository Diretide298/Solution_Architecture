id: CHG-R14H-005
date: '2026-11-03'
source: audit
kind: contract
summary: 'A credential that travels in a request path or header is marked x-ticvai-secret: bearer (the payment-link and
  invitation tokens, gift and game card codes, the order access token, the consent key, the admission token, the
  supervisor PIN header), and observability.md says what that means: logs and traces keep the route template, never
  the raw path; marked headers, Authorization and X-Api-Key are never logged; the edge scrubs the same; nothing is echoed
  in a problem. A payment link''s and an invitation''s token carry at least 128 bits of randomness.'
decision:
  what: 'The lead (Chinmay), 3 November 2026, on the triage of the r13 system review: "All four, one release". Review
    finding C-13: bearer secrets travel in URL paths and headers and no rule keeps them out of logs; add a redaction
    rule, a contract marker on path and header parameters with a check, and fix the token entropy. The review''s first
    remedy, moving the tokens out of the path, is not made here (notes).'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 system review finding C-13 (MEDIUM): getPaymentLink, payByLink, getGiftCard, loadGameCredits and
  respondToInvitation take their credential in the path, listActiveSessions takes the supervisor PIN in X-Supervisor-Pin,
  observability.md said "never PII" and nothing about paths or headers, and ADR-0071 point 7 says a credential is never
  logged; the payment-link token was only "long enough not to be guessed" (ADR-0027).'
keys_touched:
  operations:
  - getPaymentLink
  - payByLink
  - getGiftCard
  - blockGiftCard
  - getGameCard
  - adjustGameCard
  - loadGameCredits
  - transferGameCard
  - respondToInvitation
  - getOrder
  - reprintOrder
  - listActiveSessions
  - getDeviceConsentHistory
  - getCookieConsentRuntime
  schemas:
  - PaymentLink
  - CampaignInvitation
  files:
  - contracts/spine/orders.yaml
  - contracts/spine/identity.yaml
  - contracts/satellite/wallet.yaml
  - contracts/satellite/games.yaml
  - contracts/satellite/marketing-crm.yaml
  - contracts/shared/common.yaml
  - contracts/README.md
  - docs/architecture/observability.md
  - tools/check-contract-shapes.py
root_class: a credential in a request path or header that nothing keeps out of logs
tickets:
  started:
  - '#27692 request kernel (Ready for QA, Pranay): text not rewritten; the request logging and tracing record the route
    template for an operation with a bearer path parameter and log no header off the allow-list.'
  - '#30687 getOrder (Ready for QA, Pranay) and #30746 listActiveSessions (Ready for QA, Chinmay Patkar): never log or
    echo X-Order-Access-Token or X-Supervisor-Pin.'
  - '#32125 WEB-021 and #33271 WEB-017 (Ready for QA, Chitrangi): nothing on the wire changes; do not write a card code
    or invitation token to client logs or analytics.'
  unstarted:
  - '#27691 observability (New, Pranay): build the redaction to observability.md, including the edge.'
release_tag: pending
decision_owner: Chinmay
triage: fix-forward
adam_cr: 'none: r13 system review finding C-13, lane h of r14 (the lead''s "All four, one release")'
prevention:
  type: check
  ref: tools/check-contract-shapes.py::C-SECRET-PARAM
status: open
notes: 'Stopped on, for the lead: moving the tokens off the URL path (to a header or a POST body) is a route change on
  six operations, two with started frontend tickets (#32125, #33271) and one (getPaymentLink) changed by lane a''s CR-578
  in this release; the edge (Front Door) logs full request URIs unless scrubbed, which the Terraform does not configure
  yet. Recommendation: keep the paths in r14 with the redaction rule, add Front Door log scrubbing to the infra
  (new task), and move the payment-link and invitation tokens to a header in a later release if the scrubbing cannot
  cover the path.'
