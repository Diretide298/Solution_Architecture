summary: 'The setup tickets get what the lead decided on 20 October. Dev runs on laptops; staging is one shared
  pre-production environment in the Softlabs subscription, with its Terraform state there; the client hosts
  production later (FOUNDATION-AI-C23, C52 option B). The cell module is a region holding a database per tenant,
  not one tenant: tenant id and slug leave its inputs, the environment and the cell name every resource, and staging
  turns the heavy parts down with switches (C55). CI is GitLab CI in every repository and @ticvai/api-client is
  published to the group''s npm registry and pinned by exact version (ADR-0007 amendment; C37 option A). The Qdrant
  chart, ingress and cert-manager are installed by a second Terraform stage after the cell module (C22 option A).
  The second AI engineer is named in the roster as planned (C28).'
