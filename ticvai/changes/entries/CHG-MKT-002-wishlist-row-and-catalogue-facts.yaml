id: CHG-MKT-002
date: '2026-10-14'
source: developer
kind: contract
summary: 'A saved item is a WishlistItem schema of its own, so marketing.wishlist_item is derived from the contract
  (list_price numeric(18,4), not price text) with one row per variant and performance even with no performance; what
  Catalogue knows (name, picture, current price, availability, the performance start) is asked of Catalogue''s new
  declared query variantListingFacts by its service route, at the save and at every read; getWishlist is guests only.'
decision:
  what: 'contracts/satellite/marketing-crm.yaml: Wishlist.items is $ref WishlistItem, newest first (addedAt desc, id);
    WishlistItem carries x-ticvai-persistence marketing.wishlist_item (the tag used to sit on the items property, which
    derive-schema never reads), subjectId (readOnly), x-ticvai-unique-together [subjectId, variantId, performanceId]
    with x-ticvai-unique-nulls not-distinct, price as list_price Money (the amount, numeric(18,4), the currency from
    the variant''s venue, ADR-0018; the stored value is the price at the save, for segmentation and as the fallback),
    and descriptions saying each Catalogue field''s source. addToWishlist also asks variantListingFacts and stores its
    answer, its idempotency is the unique index (a racing save reads the row and answers 200). getWishlist asks
    variantListingFacts on every read (x-ticvai-read-via, service route), returns Catalogue''s current values and
    isAvailable/unavailableReason, writes nothing (replica), falls back to the stored values when Catalogue cannot be
    reached, and drops bearerAuth (BC-087). contracts/spine/catalogue.yaml x-ticvai-queries: variantListingFacts
    (variantIds, channel, performanceIds -> per variant known, venueId, productName, imageAssetRef, listPrice,
    sellable, reason; per performance startsAt, isCancelled, productId), served service, the price resolution the
    guest listing''s own, Catalogue owner to confirm. tools/derive-ddl.py: x-ticvai-unique-nulls: not-distinct makes a
    schema''s unique-together sets NULLS NOT DISTINCT. tools/derive-schema-history.py COLUMN_RENAMES
    marketing.wishlist_item price -> list_price (text -> numeric(18,4)). tools/applied/guest-devices-wishlist-14-october.py:
    addToWishlist and getWishlist read the Catalogue tables the query reads; removeFromWishlist reads and deletes
    marketing.wishlist_item (it was recorded writing marketing.guest_profile). docs/active/breaking-changes.yaml
    BC-087. tools/check-contract-storage.py ST-PROPERTY-PERSISTENCE and ST-STALE-COLUMN.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-087 (ticket 30705, with 30706; SVC-MARKETING-GUEST-1), audited 14 October 2026. TRUE: Wishlist.items[].price
  was x-ticvai-column list_price, $ref Money, citing naming-and-style 5.1 (marketing-crm.yaml Wishlist), while the
  schema reference and the frozen r1 DDL had price text (backend/tenant/010-marketing.sql:2318); no unique index backed
  "idempotent on the variant and performance" (910-indexes.sql:1747, 3561, 3563); the 404 and the saved row''s
  product_name, image_asset_ref, performance_starts_at, is_available and getWishlist''s current price are Catalogue''s
  data across deployables (ADR-0055 rule 4); catalogue.variant has no price (catalogue.price.list_price after
  CHG-R6-011). PARTLY: the "no source named" part was half settled the same morning by CHG-TEN-002 (addToWishlist asks
  variantsSellableAt by Catalogue''s service route), which answers the 404 only, not the row''s facts or getWishlist.
  Root cause the CR did not see: the persistence tag sat on the items property, which tools/derive-schema.py reads
  only on a schema (persistence_of), so the table was never re-derived and kept an older run''s columns, past the
  24 September money renames and CR-011/CR-014/CR-072 (CHG-R6-011, CHG-R6-018, CHG-DDL-006), and no check looked
  because the wrapper schema is "none" (check-contract-storage walked persisted schemas only). The lead''s
  instruction, 14 October: "pull all Crs and get them fixed".'
keys_touched:
