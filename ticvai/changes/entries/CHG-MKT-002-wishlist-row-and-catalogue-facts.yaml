  - contracts/spine/catalogue.yaml
  - tools/derive-ddl.py
  - tools/derive-schema-history.py
  - tools/applied/guest-devices-wishlist-14-october.py
  - handoff/api-data-lineage.json
  - docs/active/breaking-changes.yaml
  - tools/check-contract-storage.py
  - handoff/audit-baseline.json
  other:
  - catalogue#variantListingFacts
  - x-ticvai-unique-nulls
root_class: A16 STORAGE-SHAPE
tickets:
  started:
  - SVC-MARKETING-GUEST-1 (#30705 addToWishlist, #30706 getWishlist; a comment for the agent, never a rewrite)
  unstarted:
