status: closed
closed_by_commit: ee22b123
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Batch
  MKT, branch cr/086-088-guest-devices from r6-integrate 594e51a2. Chosen where the CR left it (lead to confirm): the
  table follows the contract (the CR''s A), with the amount alone as every Money column (no currency column: the
  package''s rule, derive-schema resolve_type), and the Catalogue read by a declared query on Catalogue''s service
  route (the CR''s B), because CHG-TEN-002 already routes addToWishlist''s check that way and no Catalogue event
  carries a variant''s name, picture or price for a projection (the CR''s A would need new events; the lead may move
  to it if getWishlist''s read rate makes the service call too dear). Catalogue''s published service operation for
  variantListingFacts is not written yet, as for variantsSellableAt (a follow-up of CHG-TEN-002, now two queries).
  The rule of the price (the guest listing''s own resolution) is the Catalogue owner''s to confirm. getWishlist
  bearerAuth removed as the developer proposed (BC-087, lead to confirm). Migration effect (MIG-MARKETING #27677, not
  started): price text -> list_price numeric(18,4) (a declared rename with a type change, listed in
  handoff/migration-review.md for a person) and the unique index (subject_id, variant_id, performance_id) NULLS NOT
  DISTINCT in the next V01nn forward migration (PostgreSQL 15+, the platform is on 16). Prevention:
  ST-PROPERTY-PERSISTENCE and ST-STALE-COLUMN in check-contract-storage, run on the parent (594e51a2 contract and
  schema reference with this branch''s check: fail on marketing-crm.Wishlist.items and on
  marketing.wishlist_item.price, name and type) and passing on this branch, nothing baselined; the generator rule is
  tools/derive-ddl.py::unique_nulls_not_distinct. The glossary entry marketing-crm.WishlistItem.variantId:variant is
  baselined like every other variantId (the wire name is unchanged; the field moved into a named schema).'
