summary: The guest concierge, contextual help, planner and kiosk assistant screens are conversations, not menus or forms,
  and the add-on steps bind the engine's recommendation slot.
decision:
  what: 'Apply the open AI design-note corrections on WEB-044, GST-031, GST-033, GST-048, WEB-008, GST-054 and KSK-015:
    the conversation is the content, earlier conversations as a short list, the conversation opened silently, suggestions
    only from the conversation (waitTime, upsell), one-tap handover, feedback on web and app, decideRecommendations maxItems
    3 instead of getUpsellSuggestions, listCatalogueBundles off the guest step, the sign-in edge after add-ons.'
