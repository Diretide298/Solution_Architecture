id: CHG-R13R11-001
date: '2026-11-02'
source: audit
kind: process
summary: ADAM's README stops telling the developer to build a generated wireframe frame exactly. For a generated frame
  it says to build from the screen record, which is the source of the regions, components and copy. The frame is a
  sketch that may leave parts out and draws placeholders the record does not declare. "Exactly" stays for a drawn or
  captured frame and for a client-approved prototype.
decision:
  what: 'The lead, 2 November 2026, on fixing the mechanical root causes of the Block A developer pull in parallel with
    the r13 build lanes: "lets see if we can do something in parallel", then "yes". viewer/mcp/tools.mjs lookSection():
    a generated frame gets "Build the page from the screen record, not from the frame" and no "exactly", and the line
    "build its regions and components in the order the frame shows" is gone. saveFrameFor and the adam_pull answer and
    description say the same. Drawn and captured frames keep their text unchanged.'
  by: Chinmay
  date: '2026-11-02'
why: 'r13 root R11 of the Block A developer pull (31 October 2026; finding 2.27985.8 and 24 more under root R10): the README said "Build the page to match the
  wireframe exactly" and "build its regions and components in the order the frame shows" for generated frames too, so
  the generator''s invented and missing parts (root R10) became build instructions. Seen on #27985 APP-SETUP-DEV-008,
  where the frame drew the partner portal''s nav and KPI tiles, and on the 24 other screen tickets of root R10.'
keys_touched:
  files:
  - viewer/mcp/tools.mjs
  - viewer/mcp/pull-files-check.mjs
root_class: a build instruction written for one kind of input (a drawn design) applied to every kind (a generated sketch)
tickets:
