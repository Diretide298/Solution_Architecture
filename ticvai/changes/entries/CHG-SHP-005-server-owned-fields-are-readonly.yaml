id: CHG-SHP-005
date: '2026-10-14'
source: audit
kind: contract
summary: 'Server-owned fields (id, scopePath, createdAt, version, tenantId, a server-moved status) of a persisted
  schema used as a write body are `readOnly: true`, so OpenAPI binds their `required` to the response only; 20
  `status` fields the caller sets are kept.'
decision:
  what: 'contracts/*: readOnly on 97 property declarations, including access.yaml''s shared `scopePath` anchor
    (&id001, used by 21 access schemas). Kept (the caller moves status): setChannelListing, setChannelProvider,
    setConfigurationProfile, setConfigurationTemplate, setContactAutomation, setCurrencyRoundingRule,
    setDataProcessingPurpose, setFeeDefinition, setJourneyProfile, setPackagePricingDefinition,
    setPriceCalculationPolicy, setPrivacyNoticePolicyGovernance, setPrivacyRequestTypes, setQualityEvaluation,
    setSenderIdentityDomain, setTenantDomainMapping, setTrackingTechnology, setWaiverAssociation, setWaiverException,
    setWaiverTriggerRule.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026, class check-contract-shapes/C-REQUEST-SERVER-FIELDS (evidence
  docs/active/audit-runs/audit-1014/classes.json): 96 members before, 20 after on this branch (CHG-SHP; ruling "go with
  your recommendation", Chinmay, 14 October 2026). R079. Additive for check-contract-compat (a readOnly field is not
  required of a request, CHG-R6G-002).'
