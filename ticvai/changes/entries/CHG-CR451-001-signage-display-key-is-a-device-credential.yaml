id: CHG-CR451-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'A display key is a tenancy.device_credential of the new kind apiKey (only its hash stored, in fingerprint), bound
  to one signageDisplay device and its venue, shown once at issue (DeviceCredential.key, not stored) and revoked per device.
  X-Api-Key opens a device session scoped to that venue: a venueId or queueId outside it is 403, a missing, wrong or revoked
  key 401. getSignageQueueBoard, getSignageQueueCalls and submitQueueReading say so; common.yaml''s apiKeyAuth states the
  device key.'
decision:
  what: 'Posted on #33061 (Chinmay, 1 November 2026), under the lead''s "Approve all" (1 November 2026): "as you recommended
    (A). A display key is a tenancy.device_credential of a new kind apiKey, holding only a hash of the key, bound to one
    signage display device and its venue; the key is shown once when issued and can be revoked per device. A request with
    X-Api-Key opens a device session scoped to that venue; a venueId or queueId outside it is 403, a missing, wrong or revoked
    key is 401. The sign-in is a new ticket ... #33061 stays On hold until it is built." The lead, 2 November 2026, "yes
    for both", answering the lane''s two stops with their recommendations: the device-key sign-in in the operations host
    reads Tenancy''s credential through an in-process query and an XDR grant.'
  by: Chinmay
  date: '2026-11-01'
why: 'ADAM CR-451 (Hrushikant Patkar, #33061, blocking): the signage operations named apiKeyAuth, but no key kind, storage,
  verification or venue binding existed (device_credential.kind had three values).'
keys_touched:
  operations:
  - getSignageQueueBoard
  - getSignageQueueCalls
  - submitQueueReading
  - issueDeviceCredential
  - revokeDeviceCredential
  schemas:
  - DeviceCredential
  tables:
  - tenancy.device_credential
  - platform.device
  files:
  - contracts/satellite/queue.yaml
  - contracts/spine/tenancy.yaml
  - contracts/shared/common.yaml
  - docs/active/breaking-changes.yaml
  - tools/check-business-rules.py
  - docs/active/cross-deployable-writes.yaml
  other:
  - BC-610 (issueDeviceCredential's kind gains apiKey)
  - 'forward migration: device_credential_kind_chk gains apiKey (written by derive-ddl, held for the integration refresh)'
  - query tenancy#deviceForApiKey (new)
  - XDR-068 (operations SELECT on tenancy.device_credential and platform.device, new)
root_class: an authentication scheme the operations name with no credential behind it
tickets:
  started:
  - '33061 (getSignageQueueBoard) and 33062 (getSignageQueueCalls), Hrushikant, On hold: wire the device-key sign-in once
    #37205 lands; 401 and 403 as stated.'
  unstarted:
  - '37205 (device-key sign-in, the child ticket made by hand): issue, hash and store, verify, revoke; the kind check gains
    apiKey.'
  - '33880 (issueDeviceCredential) and 33882 (revokeDeviceCredential): kind apiKey for a signageDisplay, key answered once.'
  - '33060 (submitQueueReading): the same sign-in.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-451
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-DEVICE-KEY
status: open
notes: 'Beyond the posted words: the hash is kept in DeviceCredential.fingerprint (no new column), and the key is answered
  once as DeviceCredential.key (x-ticvai-persisted false). The sign-in''s read across deployables, open at 5e8b43bf, is
  closed by the lead''s answer of 2 November 2026: the new rule question tenancy#deviceForApiKey (keyHash in; the device,
  its kind and its venue out), one statement under the routed tenant''s root grant because no session exists yet, asked
  in process by the sign-in; XDR-068 grants the operations role SELECT on tenancy.device_credential and platform.device.
  A read only: the sign-in writes nothing to Tenancy. The three queue operations declare it; other apiKeyAuth operations
  in the operations host use the same grant.'
