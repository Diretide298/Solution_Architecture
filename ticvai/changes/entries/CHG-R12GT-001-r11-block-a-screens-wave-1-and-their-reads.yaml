  - tools/check-screen-patterns.py
root_class: 'a plan change that brings a screen into Block A, judged only against the bundle the release cuts after
  its gate'
tickets:
  started:
  - '32301 ([BE] getMenu, Ready for QA, Sanket Keluskar) and 32302 ([BE] setMenuItemDailyCount, Ready for QA, Sanket
    Keluskar): they link BO-140, whose wave line alone moved; nothing to do.'
  unstarted:
  - 'The frontend tasks of BO-134, BO-140, BO-873, BO-881, CMS-021 and CMS-030 (created by r11, all New): the screens
    are wave 1; BO-134 shows the outlet''s ticket targets (getKitchenSla) and saves them through Save ticket targets
    (setKitchenSla); BO-881 opens its fields on getStaffingRules; CMS-030 lists the change sets (listPrivacyChangeSets)
    and its governance form picks the document version from listPrivacyNoticePolicy.'
  - 'New back-end work the next release plans: getStaffingRules (GET /staffing-rules, WORKFORCE_VIEW, 404 until the
    venue has set its rules) and listPrivacyChangeSets (GET /privacy-testing, GUEST_VIEW, brand level, cursor-paged).'
