  ref: tools/derive-ddl.py
status: open
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Batch
  IDR, branch cr/076-077-079-identity-roles. The prevention is batch GEN''s: the x-ticvai-rls rule in
  tools/derive-ddl.py (read-beneath / grant-holder-read) and its check joining an operation''s lineage scope level
  with the 920 policy class; the lead sets prevention.ref to that check''s file at the merge. This batch adds no
  x-ticvai-rls. check-contract-compat compares neither x-ticvai-scope-level nor 4xx codes, so it reports BC-076 and
  BC-077 as matching no breaking change; they are recorded so the producer and consumer tickets move together at r6.
  27764 is started, so its ticket text is not rewritten: the lead comments on it and links a delta (ticvai/CLAUDE.md
  rule 6). The other tickets are listed as unstarted from the lead''s brief, which names only 27764 as started.
  Details chosen where the decision left them open: a venue manager lists principals homed at or beneath the venue
  (the existing scopePath text: "every principal the caller''s USER_MANAGE scope reaches"); a principal outside it is
  404, as common.yaml not-found says.'
