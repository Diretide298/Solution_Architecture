summary: 'The sold-out waitlist can be joined: joinWaitlist and leaveWaitlist are bound on the guest booking screens
  WEB-006 and GST-007, where CHG-SGU-022 said they belong. The POS keeps no waitlist mode; POS-002 says so.'
decision:
  what: 'screens/P01-guest-web-storefront.yaml WEB-006 and screens/P02-guest-mobile-app.yaml GST-007: "Join the
    waitlist" (only on a sold-out time) and "Leave the waitlist" buttons and apis entries for joinWaitlist and
    leaveWaitlist. screens/P04-point-of-sale.yaml POS-002: the approved build''s waitlistMode is not built on
    the till; a counter waitlist is built only if the client asks. No contract change.'
  by: Chinmay
  date: '2026-10-12'
why: 'The Vivaticket comparison of 6 October: "the POS has a wait-list mode with nothing behind it". POS-002 already
  left the mode out (CHG-SPO-015), but joinWaitlist and leaveWaitlist were bound on no screen at all while
  BO-017 offers capacity to waitlist entries (offerWaitlistCapacity), and WEB-012''s note (CHG-SGU-022) sent the
  guest build''s "Join the waitlist" to booking screens that never took it.'
