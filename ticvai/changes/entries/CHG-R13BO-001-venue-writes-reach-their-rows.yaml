notes: 'check-rls-scope-fit now classes a split policy by its two checks (any grant, above, scope, subject, tenant; a branch
  EXISTS over a parent takes the parent''s read class). That read is lenient: own_row(...) alone reads as a scope check, so a
  staff write to a guest-only split table (pii.subject''s write) is not reported. Judged on this tree: 6 findings gone, 0 new.
  Database change: four policies re-applied, one ROW_OWNER pick, one column; in the integration''s forward migration.'
