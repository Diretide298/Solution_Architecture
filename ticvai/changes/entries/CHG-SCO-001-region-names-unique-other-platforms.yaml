summary: 'Every region name is unique on its screen on P09, P10, P11, P12, P13 and P16: of a repeated `contentBody`, the
  last keeps the name and each earlier one is named after its slot (`filters`, `headline`, `progress`, `state`, ...).'
decision:
  what: 'Rename the earlier of each repeated region on 48 screens of the other platforms (56 renames). The last region
    of the name keeps it, because tools/derive-wireframes.py keys regions by name and draws the last one today, so the
    boards draw exactly what they drew. Nothing is added, removed, moved or merged; region names are invisible.'
  by: Chinmay
  date: '2026-10-14'
why: 'Block A audit of 14 October 2026, class check-screen-wiring S-DUP-REGION (R253, audit root class A30
  SCREEN-GENERATED), evidence the classes.json of the Block A audit run audit-1014. Ruling (triage, lead 14 October: "go with
  your recommendation"): region names unique per screen, rename the second. A second `contentBody` is invisible to
  every reader that keys regions by name, which is how a generated table disappeared from a wireframe. The approved
  UI is fixed (lead, 14 October), so the regions are renamed rather than merged. On these platforms: 48 members
  before, 0 after.'
