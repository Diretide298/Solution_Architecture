id: CHG-CLN-003
date: '2026-10-02'
source: cr
kind: spec
summary: The approvals workflow and matrix screens (ADM-319..ADM-368) and the communication service screens (ADM-038..ADM-047)
  move from the TICVAI Console to Venue Management (P08); the console tenant picker and grant come off them; ADM-353 merges
  into BO-1074; the prospect twins ADM-379..ADM-417 stay on the Console, exempt from the R098 check.
decision:
  what: 'Move the 59 screens (ADM-321 does not exist) to the end of P08 as the ADM-049 move did: ids kept as anchors (their
    tickets keep their keys), venue-management-web as the app, the six board hubs (ADM-038, 319, 329, 339, 349, 359) reached
    from Venue Home BO-100 instead of the console dashboard ADM-002, flows F124, F125, F128, F129, F130 and F133 renamed
    to P08 with a venue manager as actor, x-ticvai-consumed-by renamed to P08. TICVAI staff reach them only under a platform-staff
    grant into the tenant (R098), so the console frame CHG-SBO-001 added (tenant picker, grant banner, Open access grant,
    its form, grantRequired, the tenantId entry parameter) is removed. ADM-353 declared exactly BO-1074 Webhook Configuration''s
    three operations (check-screen-wiring S-DUP-SCREEN) and becomes its anchor. ADM-379..ADM-417 stay on the Console and
    check-console-grant exempts them from C-GRANT by id (PROSPECT_TWINS).'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026: move the approvals workflow and matrix screens and the communication service screens to Venue
  Management, as with ADM-049 (DEC-100, CHG-MOV-001); the prospect twins stay on P09, exempt from the R098 check (accepted).
  Audit R098: the Console runs outside every cell, so a venue''s own configuration belongs in its own app; the pre-apply
  round "Duplicate screens: merge as proposed".'
