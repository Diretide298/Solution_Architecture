id: CHG-CR460-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'listProductApprovalWorkflows and approveWorkflow both use catalogue.approval_policy rows with subject product,
  with the member-to-column mapping stated; the list declares its read, returns the rows the caller''s row security
  shows ordered by name then id and paged; approveWorkflow upserts with subject product, the caller''s venue scope and
  is_active true, writes an audit_entry with domain product, and keeps the columns the view does not carry on a
  replace. Moving migration #31608 into Block A is the plan lane''s.'
decision:
  what: 'ADAM CR-460, posted 2 November 2026 on #31816: "Decided (Chinmay, 2 November 2026): As you recommended (A); the
    package already says so for the write. Build now: listProductApprovalWorkflows and approveWorkflow both use
    catalogue.approval_policy rows with subject product. The mapping: workflowId is id; workflowName is name;
    applicableProductTypes is product_kinds (empty means all) ... The list returns the subject product rows the
    caller''s row security shows, ordered by name then id, and paged. Declare its read of catalogue.approval_policy ...
    approveWorkflow upserts the row whose id is workflowId, with subject product, scope_path the caller''s venue and
    is_active true, and writes a catalogue.audit_entry with domain product. On a replace, the columns the view does not
    carry ... keep their stored values ... Hrushikant lands #31608 before #31816 and #34699 start, even though it is
    planned for Block B." The lead, 2 November 2026: "approve all as a recommended".'
  by: Chinmay
  date: '2026-11-02'
why: 'ADAM CR-460 (Hrushikant Patkar, #31816, blocking): listProductApprovalWorkflows declared no table; the write
  already named catalogue.approval_policy (CatalogueApprovalPolicy merges the product workflow and the pricing authority
  matrix), but the read did not, and its table''s migration (#31608) is planned for Block B.'
keys_touched:
