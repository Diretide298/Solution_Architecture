notes: 'Batch R6G, 14 October 2026. Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release
  today as an exception". Verified in w609 (derive-schema, derive-ddl --apply, V0104 regenerated with
  "SELECT platform.drop_rls_policies(''identity.password_policy''...); SELECT platform.apply_read_beneath_rls(...)"
