id: CHG-R6G-008
date: '2026-10-14'
source: audit
kind: contract
summary: 'The tenant''s password policy is read beneath the tenant (PasswordPolicy x-ticvai-rls: read-beneath), so a
  venue''s createPrincipal, forceLogout and resetPrincipalCredential read the rules they hold a PIN to; their three
  writes to tenant-root identity tables are baselined with F13, the principal-write decision deferred to r7.'
decision:
  what: 'contracts/spine/identity.yaml PasswordPolicy gains x-ticvai-rls: read-beneath; derive-ddl writes the swap from
    apply_scope_rls to apply_read_beneath_rls for identity.password_policy into the forward migration (CHG-GEN-004).
    check-rls-scope-fit --update-baseline takes in RF-TENANT-ROOT forceLogout -> identity.principal_credential,
    resetPrincipalCredential -> identity.principal and -> identity.principal_credential_history (and drops the 7 entries
    that were gone); only its section of handoff/audit-baseline.json changes.'
  by: Chinmay
  date: '2026-10-14'
why: 'First full r6 gate (14 October 2026): check-rls-scope-fit RF-OWNED-ABOVE, createPrincipal / forceLogout /
  resetPrincipalCredential (venue) read identity.password_policy, written only at tenant, so its rows sit above the
  reader; and RF-TENANT-ROOT for the three writes. The PIN length, lockout and reuse rules these operations apply come
  from the tenant''s policy (CHG-CRD-001, CHG-CRD-002, ADAM CR-078; ADR-0071). Lead''s decision: read-beneath for
  PasswordPolicy; the writes are the class of tracker F13 (principal writes at venue, CHG-GEN-010, ADAM CR-076),
  deferred to r7, so baseline them with the check''s --update-baseline and say so.'
keys_touched:
  schemas:
  - identity.PasswordPolicy
  tables:
  - identity.password_policy
  - identity.principal
  - identity.principal_credential
  - identity.principal_credential_history
  operations:
  - createPrincipal
  - forceLogout
  - resetPrincipalCredential
  files:
