notes: 'S-NOTES-STALE now also fails on a generated gap tools/screen_gaps.py judges overtaken (no write, no schema, the
  wrong operation count, "No read of X" or "(Y has no get)" beside that read, a 2 October contract gap its operation says
  was built for this screen) and on the board-import sentence beside components, states and operations. Left for the
  lead: BO-102''s "no staff preview that records nothing" (whether decideRecommendations with previewOnly writes nothing
  is not settled); GST-056''s pattern (listDetail, its patternReason naming listCatalogueBundles and getBundle, which it
