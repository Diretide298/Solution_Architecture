id: CHG-R13RVB-004
date: '2026-11-03'
source: audit
kind: spec
summary: 'Screen notes and gaps that contradicted their own record are corrected (tools/applied/r13-review-stale-screen-text.py,
  judged by tools/screen_gaps.py). "Components, states and operations still to be written" comes off the 85 screens that
  have all three (EMP-044 and EMP-045, which declare no operation, keep it). Generated gaps the record has overtaken are
  dropped: 93 "declares no operation that writes anything" beside a declared write, 212 "operations return no schema with
  described properties" beside an answer that has them, and nine 2 October contract gaps whose operation is now declared
  (BO-023 listMessageDispatches, BO-112 listProductionPlans, BO-186 getFacePassEnrollmentConfiguration, KIT-009 and
  POS-028 built in CHG-CSA-045, and by hand BO-008 previewProductTickets, BO-007 bulkUpdateCatalogueProducts, BO-065
  listDeliveryLocations, BO-454 getGameCard); 127 "the screen declares N operations" counts are corrected, the unserved
  pack actions kept. By hand: WEB-008''s notes no longer say listCatalogueBundles is still bound (neither it nor GST-056
  declares it), GST-030''s prototype difference says the feed is in the first release (CHG-SGU-017, as WEB-046 says), and
  POS-023''s offline state gives CHG-SPO-020''s recorded default (refuse offline) instead of "an open question". Twins
  (source.sameAs) are left to their copying tool.'
decision:
  what: 'The lead, 3 November 2026, on the r13 review of all 1,582 Block A tickets: "why are these coming back again and
    again?", "get going on those as well so we close it", "you get the rest sorted". Review finding classes
    stale-text-contradicts-record (batch 7), stale-screen-gap-notes (batch 8a) and stale-screen-gap (batch 8b): a record
    told the developer an operation or schema was missing that the same record declares, or that it was not ready.
    Text and gaps only: no component, state, binding or approved screen changes.'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 Block A ticket review, finding classes stale-text-contradicts-record (batch 7: #27755, #28168, #28652, #28657,
  #28659, #28662, #28706, #28617, #28816, #28858), stale-screen-gap-notes (batch 8a: #27935, #28050, #28085, #28055,
  #35643, #28273, #28339, #28429) and stale-screen-gap (batch 8b: #28475, #28765, #28793, #28727, #28919, #28926, #28978,
  #28990). The gaps were written by the 9 September pack regeneration and the 2 October wiring pass (CHG-WIR-004,
  CHG-WIR-011, CHG-WIR-027) and never re-judged; S-NOTES-STALE (R269) read only gaps that name the operation.'
