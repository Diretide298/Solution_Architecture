id: CHG-R11-002
date: '2026-10-04'
source: audit
kind: spec
summary: The overlay that links a guest checkout to an account on WEB-013 and GST-010 is "Create an account" (email,
  Send me a code, the code, Verify the code, then linkGuestCheckout) with no password field, no longer "Set a password".
decision:
  what: 'formLinkGuestCheckout on WEB-013 (P01) and GST-010 (P02): trigger and confirm "Create an account"; its body walks
    the passwordless flow the screens'' notes already describe: the email (the order''s, prefilled) -> "Send me a code"
    (registerGuest, channel email) -> the six-digit code -> "Verify the code" (verifyGuestEmail, mode code) ->
    linkGuestCheckout; no password field; dismissing discards the email and the code and links nothing. The
    linkGuestCheckout apis purpose on both screens says the same. check-screen-patterns DEC gains a passwordless rule:
    an overlay confirming linkGuestCheckout on WEB-013 or GST-010 may not ask for a password.'
  by: Chinmay
  date: '2026-10-04'
why: 'A leftover of CHG-FXS-003 (decided 4 October: guest accounts are passwordless, so "Set a password" is "Create an
  account"): that change rewired the screens'' buttons, notes and the verify form, but the overlay itself still read
  "Set a password" with "A password for the account", contradicting the notes on the same screens.'
keys_touched:
  screens:
  - WEB-013
  - GST-010
  operations:
  - linkGuestCheckout
  - registerGuest
  - verifyGuestEmail
  files:
  - screens/P01-guest-web-storefront.yaml
  - screens/P02-guest-mobile-app.yaml
  - tools/check-screen-patterns.py
root_class: 'new: decision-applied-in-part'
tickets:
  started: []
  unstarted:
  - APP-WEB-WEB-013
  - APP-MOB-GST-010
release_tag: r2
decision_owner: Chinmay
triage: fix-forward
prevention:
  type: check
  ref: tools/check-screen-patterns.py
status: open
notes: 'Batch R11 (r1.1, branch r11-ai-hosting), 4 October 2026. Tickets: none started (Sprint 1 starts Monday
  5 October); both pick the overlay up through their pointer bodies at the next tag. Close on the commit that merges it.
  The tags r2 (9cce86a0) and r3 (a67ca498) were renamed old-r2-ai-hosting and old-r3-aws on 6 October 2026 and never went live (OpenProject and ADAM are on r1); their changes ship in r2.'
