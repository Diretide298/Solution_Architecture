id: CHG-R10UI-011
date: '2026-10-25'
source: cr
kind: plan
proposed: 2026-10-21T00:00
summary: SETUP-CLIENTS is re-scoped to publish @ticvai/api-client as a versioned package, generated from ticvai-contracts
  at each release tag and published to the ticvai-frontend group's GitLab package registry; every app repository depends
  on it by exact version, ticvai-guest-web first. Every FE screen's "connect to API" sub-task uses that package and waits
  for it, with no hand-written client and no per-repository generator; frontend-patterns 4.5 states the rule.
decision:
  what: 'ADAM CR-195, option A, settled 25 October 2026. tools/build-service-docs.py: the SETUP-CLIENTS task (title "Publish
    @ticvai/api-client as a versioned package, generated from ticvai-contracts at each release tag", text and done-when).
    tools/push-openproject.py (read by tools/op-release.py): the FE "connect to API" sub-task text. viewer/mcp/setup/starters/docs/frontend-patterns.md
    4.5. For WEB-028 (#27888): getTenantAppStatus stays behind the contract''s types until the package is published, then
    #31060 and #31061 are finished.'
  by: Chinmay
  date: '2026-10-25'
why: 'ADAM CR-195 (Chinmay Patkar, #27888 WEB-028). SETUP-CLIENTS still generated "for the frontend workspace", the one-workspace
  layout retired on 13 October; no app repository depended on @ticvai/api-client, so every connect-to-API sub-task (#31060
  and #31061 first) stubbed its calls. The package route itself was set in r8 (CHG-R8RW-006, the ADR-0007 amendment).'
