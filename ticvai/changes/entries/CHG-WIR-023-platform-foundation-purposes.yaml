  naming a touched screen. Per screen and flow:

  - POS-016: purpose rewritten — The purpose was the pasted board placeholder "Till Configuration — from the client
  design board, 20 August"; the screen configures this workstation in place (F73 step 1; design-notes correction
  platform-foundation POS-016).

  - POS-019: purpose rewritten — The purpose was the pasted board placeholder "Shift Templates & Policies — from
  the client design board, 20 August" (DI-309).

  - BO-116: purpose rewritten — The purpose was the pasted board placeholder "Merchandising & Product Presentation
  — from the client design board, 20 August"; the job is arranging products on a board (design-notes correction
