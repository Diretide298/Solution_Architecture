  client design board, 20 August" (design-notes correction platform-foundation BO-122).

  - BO-123: purpose rewritten — The purpose was the pasted board placeholder "POS Profile Management — from the
  client design board, 20 August"; the screen defines the profiles workstations are assigned (ADR-0018; design-notes
  correction platform-foundation BO-123).

  - BO-124: purpose rewritten — The purpose was the pasted board placeholder "Layout & Journey Builder — from the
  client design board, 20 August"; DI-157 and DI-310 describe a visual designer per workstation type (design-notes
  correction platform-foundation BO-124).

  - BO-125: purpose rewritten — The purpose was the pasted board placeholder "Product & Category Button Configuration
  — from the client design board, 20 August".

