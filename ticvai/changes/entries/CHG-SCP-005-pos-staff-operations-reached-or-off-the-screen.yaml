id: CHG-SCP-005
date: '2026-10-14'
source: audit
kind: spec
summary: 'Thirteen operations declared on POS and staff-app screens that no component reached: reads now name the
  component they fill, calls the runtime makes say so in their trigger, and five the approved screens have no use
  for (and another screen calls) are taken off. The members that would need a new control are kept and listed.'
decision:
  what: 'screens/P04-point-of-sale.yaml: POS-025 Till Home binds listSaleBoards to the sale-board cards, listDevices
    to the peripheral-health cards and listAlerts to the alerts banner, and polls getWorkstationHealth (onInterval);
    POS-028 Table Service binds getTableMap to the floor and listTableReservations to the reservations due; POS-000
    reads getCurrentSession in the background after login. screens/P06-staff-app.yaml: EMP-030 polls getVenueMapLive
    (onInterval); EMP-010 no longer declares verifyAccreditationCredential (the scanner''s SCN-003 verifies an
    accreditation, and the employee app does no full scanning, DI-128); EMP-061 no longer declares
    getKpiValues, getDashboard, listAlerts and acknowledgeAlert (no tile, chart or alert list on it; EMP-060 reads
    the KPIs and EMP-070 works the alerts on the staff app). Nothing visible changes. Kept, because reaching them
    needs a control the client-approved screen does not have (the lead decides): EMP-020 recordAnswerFeedback
    (taking it off adds a check-screens warning); EMP-031 requestSuggestion;
    EMP-037 listStaffConversations, listStaffMessages, markStaffConversationRead, sendStaffMessage; EMP-053
    setSectionLayout; EMP-057 addGuestNote; POS-005 enrolFaceTag; POS-011 issueCreditMemo; POS-026 issueTaxInvoice,
    reprintOrder; POS-028 openTableVisit, seatTableReservation, closeTableVisit (each needs a body the screen does
    not collect); and POS-026 getTaxInvoice and getTaxDocumentRendition, which the Tax invoices table reaches by
    opening a row (a second operation on one component, which the record cannot say). EMP-071 to EMP-100 follow
    their P08 twins (batch SCR).'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding, Block A audit before r6 (docs/active/audit/audit-1014/classes.json): check-screen-wiring
  S-OP-UNREACHED (R273) had 62 members on P04 and P06: 13 fixed here, 17 kept (client-approved UI), 32 on the rental
  twins EMP-071 to EMP-100 (copies of BO-544 to BO-573, batch SCR). Ruling (the lead, 14 October 2026, "go with your
  recommendation"): wire onLoad reads to the load; otherwise remove the operation from the screen. The approved UI
  is fixed (the lead, 14 October 2026), so no control was added.'
