id: CHG-R14H-003
date: '2026-11-03'
source: audit
kind: contract
summary: 'Every operation a guest can call by a per-object path id says whose object it is: x-ticvai-object-owner
  [subject | share | delegation | session | token], or x-ticvai-self-scoped, and any other guest gets the shared 404 as
  for an id that does not exist. The 52 operations the review found declare it (getEntitlementCredential: the guest''s
  own, one shared with them, one delegated with ORDER_VIEW; the admission seed of anyone else''s is 404), 26 of them
  gain the 404 they lacked, and issueMyAccreditationWalletPass and renewAccreditation answer another holder with 404, not
  403. x-ticvai-guest-callable no longer stands for ownership. decideRecommendations ignores a subjectId from an
  anonymous caller, and the GuestVenue and guestAuth texts no longer say row-level security is the line of defence
  inside a venue.'
decision:
  what: 'The lead (Chinmay), 3 November 2026, on the triage of the r13 system review: "All four, one release". Review
    finding C-03: 52 guest operations that act on a guest''s own record declare no ownership rule and
    getEntitlementCredential returns the admission seed with no 404; split guest-callable''s two meanings, require
    self-scoped or an explicit object owner on every guest-reachable operation with a non-public path id, and stop
    AM-GUEST-PERMISSION accepting guest-callable for them. Finding C-06 where it falls out of that ownership rule: an
    anonymous caller''s subjectId, and the "line of defence" sentence.'
  by: Chinmay
  date: '2026-11-03'
why: 'r13 system review findings C-03 (HIGH) and C-06 (MEDIUM). The only machine rule was contracts/README.md (a guest
  naming another guest''s record gets 404, CHG-GCF-002), carried by x-ticvai-self-scoped alone, and C-SELF-404
  (CHG-R13RVB-001) applied only to self-scoped operations; check-audience-match accepted x-ticvai-guest-callable instead
  (ADR-0025 says it was removed; 174 remain). The ownership values follow what each operation''s text already said
  (holds and plans: "the same guest session or subject placed"; getEntitlement: "their own and one shared with them")
  and grantDelegation''s guest-delegable permissions (ORDER_VIEW, ORDER_CREATE, WALLET_VIEW, WALLET_OPERATE).'
