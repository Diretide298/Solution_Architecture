notes: 'Additive (new 404 responses and a marker). Generator rule: tools/op-descriptions.py wrote "another caller''s id
  gets 403 on self-scoped operations" in the Done-when of every self-scoped ticket, against the README rule; it now
  writes 404 for self-scoped and owned operations (the r13 review lane CHG-R13RVB-001 left this for the lead: it changes
  unstarted tickets'' Done-when text at the next release; started tickets are untouched). C-06''s own fix is not made
  here and needs the lead: a separate row-security context for anonymous reads (ticvai.audience public, policies only on
  published tables) or moving public reads to published read models, and per-audience response schemas
  (x-ticvai-response-by-audience) for the 54 operations staff and anonymous callers share.'
