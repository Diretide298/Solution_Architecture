id: CHG-CR428-001
date: '2026-10-31'
source: cr
kind: contract
summary: 'Each of the 15 types in BookingFlowType x-ticvai-system-catalogue gains name and description as {en, ar}
  (the English names CMS-103 shows), every step condition and commonConditions entry is {en, ar}, and
  listBookingFlowTypes serves them verbatim: a step with no condition of its own takes commonConditions[stepKey],
  defaultSortOrder is the step''s index from 0, defaultEnabled is true unless the catalogue says otherwise. The list
  answers in catalogue order (the type''s position, then key); "Sorted by name ascending" is dropped.'
decision:
  what: 'Posted on #31034 (Chinmay, 31 October 2026), after the lead''s review of 31 October 2026 ("for each one actually check if they hold and if not then find out the best way keeping in mind what client needs") and his instruction "Include them in r12": "not as recommended: the names go into the
    catalogue as you recommended, but the list keeps the catalogue''s own order. Each type in x-ticvai-system-catalogue
    gains name and description as {en, ar}. The English names are the ones CMS-103 shows: Dated day pass, Timed entry,
    Open-dated, Seated fixed performance, Seated date, time and seat map, Experience or workshop, Surf or session,
    Meeting room by the hour, Cabana on a map, Guided tour by language, Transport, Table reservation, Membership, Gift
    card, Several locations. Serve them verbatim. Every condition is served as {en, ar}, and a step with no condition of
    its own takes commonConditions[stepKey]. defaultSortOrder is the step''s index ... defaultEnabled is true unless the
    catalogue says otherwise. listBookingFlowTypes answers in catalogue order ... ''Sorted by name ascending'' is
    dropped. Until you pull r12, serve en only; the ar text comes with the package."'
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM CR-428 (Hrushikant Patkar, #31034 listBookingFlowTypes, blocking): BookingFlowType requires name, yet the
  catalogue gave its types none, conditions were plain English, and the list said both "in catalogue order" (its 200)
  and "Sorted by name ascending" (the generic order CHG-SHP-002 wrote). Sorting by name would not match CMS-103''s
  order.'
