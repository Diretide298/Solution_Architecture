id: CHG-CR551-001
date: '2026-11-03'
source: cr
kind: spec
summary: 'GST-007''s eligibility drawer reads getProductEligibilityRule for each product the screen knows and opens on
  leaving selection when any rule has a limit set; heightBandsCm are band edges, the chips are all those rules'' edges
  merged, sorted and deduplicated; checkBookingEligibility runs once per product with a rule (one productId, the whole
  party, its own Idempotency-Key) with heightBandIndex counted on that product''s own edges; a failing person is named
  with the product; party size starts at one; GST-007 adds no cart line, as built. No contract change. GST-008''s move
  to the waiting room on a refused addCartLine is a separate ticket (LO-CR551-001).'
decision:
  what: 'ADAM CR-551, posted on #31784: "Decided (Chinmay, 3 November 2026): your choices stand except how height bands
    are read and how products are named. Build now: (1) For each product the screen knows ..., call
    getProductEligibilityRule ... Open the drawer once, on leaving selection, when any rule has a limit set ... (2) The
    heightBandsCm entries are band edges, not band starts ... The chips are the bands made by the edges of all those
    rules merged, sorted, with duplicates dropped ... (3) Call checkBookingEligibility once per product with a rule ...
    heightBandIndex is the count of that product''s own edges at or below the lower bound of the chip the person chose
    ... No contract change. (4) Party size: one person to start ... (5) GST-007 calls no addCartLine, as built ... The
    move from a refused addCartLine to the waiting room happens on the tickets screen''s Continue; that is a separate
    ticket, so build nothing for it here." The lead, 3 November 2026: "Dont hold r13. approve them and rever tto the
    devs" and "start on 1,2,3".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-551 (#31784 GST-007): the screen could not see a product''s rule or its height bands, the result named no
  product, and addCartLine had no place on the screen; the build read heightBandsCm as band starts and took the first
  rule with bands.'
keys_touched:
  screens: [GST-007, GST-008]
  operations: [getProductEligibilityRule, checkBookingEligibility]
  files:
