notes: 'No table change: SeatAvailability is computed (x-ticvai-persistence none). Cross-lane: seating.yaml is lane B''s
  contract; the brief gives this field to lane D. createSeatHold names the same venue setting in words and declares no read-via:
  left to lane E''s read-routes sweep (XR-FACT), so one operation is not edited twice. GST-049 does not declare getSeatHold:
  it has no countdown element to reach it with, and a read a person sees is never background (the lead, 20 October); raised
  for the lead.'
