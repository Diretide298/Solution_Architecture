notes: 'Open until the next release refresh writes the forward migration and the review (derived files are not in
  this branch). Verified in the worktree with derive-schema, derive-relationships, derive-schema, derive-ddl --apply:
  the review went from 963 rows to 948, the tenant V0105 holds 7 statements (the three sale_board_tile CHECKs, NOT
  VALID then validated, and the guarded DROP NOT NULL of workstation.org_unit_id, venue_settings.org_unit_id,
  invitation.product_id and invitation.offered_by_principal_id), a second derive writes nothing, and every D-FWD rule
  passes but D-FWD-OWNER on retail.exchange (new_sale_id or sale_id), left to the row-security lane. Siblings the class
  rule reaches beyond the six requests: five more readOnly path keys become NOT NULL (marketing.campaign_variant,
  promotions.promotion_variant, queue.reading: "not null" rows; catalogue.group_package and
  catalogue.product_eligibility_rule: their type rows now include NOT NULL), and marketing.invitation''s five retired
  columns and wallet.fund_reservation.wallet_hold_id are worded as drops. access.access_change is not a two-key table
  (new_entitlement_id is nullable). ledger.inter_entity_obligation''s read path through to_legal_entity_id is CR-149''s
  and the row-security lane''s.'
