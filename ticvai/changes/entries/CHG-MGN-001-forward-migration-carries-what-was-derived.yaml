id: CHG-MGN-001
date: '2026-10-18'
source: cr
kind: process
summary: 'The forward migration and its review carry what the generator derived, whole: a declared key never turns
  a table''s partitioning off, a key the request path supplies is NOT NULL, review rows hold every statement in full,
  a new table CHECK reaches the forward migration and a new index on a renamed column is listed whole, a column the
  contract retires is a drop with its NOT NULL dropped at once, and two keys to one parent are listed for a decision.'
decision:
  what: 'tools/derive-ddl.py partition_plan refuses (exits 1) when a declared key points into an append-only table it
    partitions; UNENFORCED_KEYS keeps an index on a key left undeclared for that reason; table_marks lets a parent
    key never vote, so platform.sale_board_tile gets its unique-together and required-when marks; pick_owner lists a
    table with two keys to one parent ("owner undecided" in migration-review.md) and ROW_OWNER records the two the
    published answers decide; load_contract_props collects x-ticvai-retired-columns (RETIRED) for frozen mode.
    tools/derive-schema.py path_supplied_keys makes a readOnly declared key named by a path parameter of an operation
    carrying its schema NOT NULL. tools/ddl_forward.py writes every review statement whole, words a retired column as
    the four-step drop and writes its guarded DROP NOT NULL, writes a new table CHECK as DROP IF EXISTS, ADD ... NOT
    VALID, VALIDATE, and lists a new index on a renamed column whole. tools/ticket_done.py reads the guarded statement
    so the creating migration ticket cites the file. Contracts: MessageDispatchAttempt.messageDispatchId is
    x-ticvai-references none (format uuid); ChannelAllocation.required gains channelCapacityId.
    tools/check-ddl-conventions.py gains D-FWD-PARTITION, D-FWD-KEY-NULL, D-FWD-CUT, D-FWD-CARRIED, D-FWD-RETIRED
    and D-FWD-OWNER.'
  by: Chinmay
  date: '2026-10-18'
  quote: 'Published answers to CR-138, CR-139, CR-148, CR-149, CR-156 and CR-157 (audit/ticvai/cr-triage-1018/decisions-final.json,
    settled 18 October 2026): "the generator will fail rather than drop partitioning again", "the next release makes
    channelCapacityId required", "the next release writes every statement whole, and lists a table with two keys to
    one parent for a decision", "the next release fixes the generator and carries them", "the next release words a
    retired column as a drop, and its migration drops NOT NULL at once".'
why: 'ADAM CR-138, CR-139, CR-148, CR-149, CR-156 and CR-157 (Hrushikant Patkar, writing r6''s forward-migration child
  tasks; triage of 18 October, class 10). At r6 (86a3fa6f) handoff/migration-review.md asked him to un-partition
  marketing.message_dispatch (CHG-STO-001 declared the attempt''s key into it, ADR-0056), relaxed
  catalogue.channel_envelope.channel_capacity_id to nullable and dropped its parent policy to the tenant root, cut 19
  of the 26 policy statements in its "after rename" rows at 70 characters, never derived sale_board_tile''s unique
  (sale_board_page_id, position) and three required-when CHECKs (CHG-TEN-001), left 8 retired columns as "a rename
  or a drop: decide", and scoped two-key tables by the alphabet. Each was a generator defect, not a decision.'
