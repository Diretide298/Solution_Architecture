notes: 'Batch R6, 12 October 2026. Every rename is a "column renamed" row in handoff/migration-review.md (RENAME COLUMN by
  hand; the two deposit_box_limit_amount rows also change the type, text -> numeric(18,4), with no data to convert while
  the client has set no limit). Names chosen by the agent and open to correction: held_price -> gross_amount (the seat''s
  share of seat_reservation.gross_amount), the wallet *_amount names, allocation_type -> envelope_type (CR-011 named the
  table; Allocation is the banned synonym of Envelope). check-ddl-conventions D-BANNED-NAME fails on a bare money name a
  table takes after r1.'
