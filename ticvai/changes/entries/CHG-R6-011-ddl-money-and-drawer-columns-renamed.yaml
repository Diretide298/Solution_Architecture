id: CHG-R6-011
date: '2026-10-12'
source: cr
kind: contract
proposed: '2026-10-12'
summary: 'The bare money columns CR-011 lists take their naming-and-style 5.1 names (list_price for an entered price,
  *_amount otherwise), and cash_drawer_limit becomes deposit_box_limit_amount, typed numeric(18,4) as the Money it is.
  The contract fields keep their wire names.'
decision:
  what: 'x-ticvai-column on the contract fields, declared in tools/derive-schema-history.py COLUMN_RENAMES:
    catalogue.price.amount and seating.seat_price_band.amount -> list_price; seating.seat_reservation_item.held_price ->
    gross_amount; wallet.wallet.balance and wallet.gift_card.balance -> balance_amount; wallet.gift_card.face_value ->
    face_value_amount; wallet amounts -> transaction_amount (wallet_transaction), adjustment_amount (adjustment),
    disputed_amount (dispute), settled_amount (exit_settlement); wallet.fund_reservation.wallet_hold_amount ->
    reserved_amount and wallet_hold_status -> status; platform.workstation and platform.venue_settings cash_drawer_limit ->
    deposit_box_limit_amount; catalogue.channel_envelope.allocation_type -> envelope_type (its values, sharedPool among
    them, are wire values and stay). tools/derive-schema.py reads a one-member oneOf as its member, so cashDrawerLimit
    (oneOf: [Money]) is numeric(18,4) instead of text.'
  by: Chinmay
  date: '2026-10-12'
why: 'ADAM CR-011: naming-and-style 5.1 says never price, value or total alone, an entered price is list_price, and
  drawer is staff copy only (3.3); the derived DDL had amount, balance, face_value, held_price and cash_drawer_limit
  (text). Chinmay approved option 1 on 12 October 2026, with x-ticvai-column where the field keeps its wire name, the
  mechanism of the 27 money columns of 24 September (handoff/money-column-names.md).'
