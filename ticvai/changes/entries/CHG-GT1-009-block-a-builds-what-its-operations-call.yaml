summary: 'An operation a Block A operation calls or writes through is built in Block A: endGuestDeviceSessions, updateGuestSubjectDetails,
  recordConsentIdentifier, recordSyncRejection, recordSyncRejectionResolution and sendTransactionalMessage; a new rule,
  C-CALLS, holds it.'
decision:
  what: 'docs/active/block-a-extra-tasks.json blockAOperations: the six, each naming its Block A caller (revokeGuestDevice,
    updateMyProfile, recordDeviceConsent, syncOrders and syncScans, resolveSyncRejection, verifyGuestEmail). tools/check-plan-closure.py
    C-CALLS: an operation a Block A operation names in x-ticvai-calls or x-ticvai-write-via is built in the caller''s drop
    or an earlier one.'
  by: Chinmay
  date: '2026-10-14'
why: 'The lead''s brief for the r6 gate fix round (14 October 2026): new operations go in the plan ''Block A where their
  caller is Block A'' (identity endGuestDeviceSessions, CHG-MOD-009). Measured on the r6 release gate on r6-gate1 (23eb3d98,
  every r6 batch merged and fully derived): 7 such calls into Block B or D (the identity and cross-region owner writes of
  CHG-XDW-002, -004, -005 and CHG-MOD-009, and guest sign-up''s verification email); C-CALLS finds 7 on the gate''s plan
  and 0 after.'
