notes: 'New tasks (for the integration plan pass): [BE] Identity getOfflineStepUpPackage (deviceAuth) and the
  offline_pin_verifier / offline_step_up storage; [BE] Reporting consumer of identity.offlineStepUpRefused raising the
  managers'' alert; [FE] offline-core: fetch, store and replace the package, verify the PIN locally (Argon2id), attempt
