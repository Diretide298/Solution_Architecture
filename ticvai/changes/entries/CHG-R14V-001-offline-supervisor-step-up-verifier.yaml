id: CHG-R14V-001
date: '2026-11-03'
source: audit
kind: contract
summary: 'An offline-capable supervisor or witness PIN step-up (voidOrder, recordNoSale, withdrawFromDepositBox) is checked
  on the till against an offline verifier and re-checked by the server at sync. Identity keeps one verifier per signer and
  venue (identity.offline_pin_verifier: an Argon2id hash of the PIN with its own salt, field-encrypted, minted only by a
  correct pin sign-in, a correct online step-up or a new PIN; 30-day expiry; void once the PIN changes or locks); a
  registered device fetches its venue''s package under deviceAuth (getOfflineStepUpPackage: the local picker list, the
  attempt limit, a 24-hour expiry, replaced whole at each sync); the step-up carries offline evidence
  (SupervisorStepUp.offline); verifySupervisorStepUp re-checks it as at recordedAt and writes identity.offline_step_up;
  a refusal at sync never drops the act: the act is recorded, its success carries X-Ticvai-Step-Up-Verdict refusedAtSync,
  the till tells the operator and identity.offlineStepUpRefused raises the managers'' alert. ADR-0013, ADR-0022 and
  ADR-0071 amended; supervisorPinPrompt gets its offline state; SU-OFFLINE in check-step-up.'
decision:
  what: 'System review finding F-01 (r13 tag a8e06314: offline POS acts that need a supervisor PIN cannot be verified
    offline, and the package does not say what happens). The lead, Chinmay, 3 November 2026, after reading the triage:
    "Offline verifier" (the till keeps a verifier, re-checked at sync), in r14, released with the rest ("All four, one
    release"). Built as the r14 brief for lane v states it: the offline package carries a verifier per eligible
    supervisor and venue (a slow salted hash of the PIN, never the PIN; expiry; revoked at the next sync), a local picker
    list, a local attempt limit and lockout, every offline step-up recorded and re-verified at sync with a named
    rejection path and what the operator and supervisor then see; the supervisorPinPrompt component gets its offline
    state.'
  by: Chinmay
  date: '2026-11-03'
why: 'System review finding F-01 (3 November 2026, of the r13 tag a8e06314): voidOrder, recordNoSale and
  withdrawFromDepositBox are x-ticvai-offline-capable and x-ticvai-step-up pin, SupervisorStepUp was checked only by the
  server, listStepUpSupervisors is online only, and supervisorPinPrompt had no offline state, while POS-014 and POS-018
  promise the till keeps working offline. The contracts answered twice and differently: voidOrder and recordNoSale said
  "offline only a caller who holds the permission can do this", withdrawFromDepositBox queued the witness PIN unchecked
  ("Captured offline, it is verified when the withdrawal syncs") after the cash had left the box. ADR-0013 (local-first;
  C103''s accepted-and-flagged unitsGone is the precedent for an act replayed after its condition lapsed), ADR-0022
  (append), ADR-0071 (PIN hashing; CHG-R8SPN-027 named an ADR-0071 exception and a security review for an offline
  verifier). The two escalated operations the finding also lists (compItem, cancelFnbOrder) take the caller''s own
  escalated permission, resolved at sign-in and held by the till, and no supervisor: nothing changes for them.'
keys_touched:
