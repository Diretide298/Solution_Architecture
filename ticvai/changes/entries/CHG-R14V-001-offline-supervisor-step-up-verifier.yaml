  - voidOrder
  - recordNoSale
  - withdrawFromDepositBox
  - verifySupervisorStepUp
  - getOfflineStepUpPackage
  - login
  - changeOwnCredential
  schemas:
  - SupervisorStepUp
  - OfflineStepUpEvidence
  - SupervisorStepUpCheck
  - SupervisorStepUpVerdict
  - OfflineStepUpPackage
  - OfflineStepUpSigner
  - OfflinePinVerifier
  - OfflineStepUp
  tables:
  - identity.offline_pin_verifier
  - identity.offline_step_up
  screens:
  - POS-014
  - POS-018
  other:
  - 'event identity.offlineStepUpRefused (new)'
  - 'response header X-Ticvai-Step-Up-Verdict (common.yaml headers StepUpVerdict, new)'
  - 'contract extension x-ticvai-offline-step-up (verifier | refused, new)'
  - 'query identity#verifySupervisorStepUp inputs, returns and rule'
  - 'component supervisorPinPrompt: state offline'
  files:
  - contracts/shared/common.yaml
  - contracts/spine/identity.yaml
  - contracts/spine/orders.yaml
  - contracts/spine/shift.yaml
  - events/identity-offlineStepUpRefused.yaml
  - screens/_components.yaml
  - screens/P04-point-of-sale.yaml
  - docs/adr/0013-local-first-point-of-sale.md
  - docs/adr/0022-conflict-policy.md
  - docs/adr/0071-credentials-are-stored-as-argon2id-phc-strings.md
  - docs/active/approved-ui-changes.yaml
  - tools/check-step-up.py
root_class: an operation is offline-capable and demands a step-up only the server can check, and declares nothing about
  what happens offline
