    now also mints the principal''s offline step-up verifiers (identity.offline_pin_verifier) in the same transaction;
    the response does not change. A follow-up comment carries this to the developer.'
  unstarted:
  - '30981 ([BE] voidOrder), 30861 ([BE] recordNoSale), 32651 ([BE] withdrawFromDepositBox): pass offline evidence,
    operationId, actId, callerPrincipalId, workstationId and recordedAt to verifySupervisorStepUp; record the act on
    refusedAtSync and send X-Ticvai-Step-Up-Verdict; never 403 an offline step-up.'
  - '35730 / 35914 ([BE] verifySupervisorStepUp): the offline rule (as at recordedAt, history row, no attempt counted),
    the identity.offline_step_up row, the identity.offlineStepUpRefused event, and minting verifiers on a correct online
    PIN.'
  - '30719 ([BE] changeOwnCredential): a new PIN replaces the principal''s offline verifiers.'
  - 'POS-014 (28259, 32002-32004), POS-018 (28535, 32665-32667), POS-006 (28256, 31993-31994) and EMP-034 FE tickets:
    the supervisorPinPrompt offline state; the till fetches and stores the package and shows the refusedAtSync toast.'
release_tag: pending
