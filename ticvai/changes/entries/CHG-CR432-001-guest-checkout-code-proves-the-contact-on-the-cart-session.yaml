notes: 'The WEB-016 and GST-042 Code-field notes are page info only; nothing visible changes. Beyond the posted words:
  verifyGuestOtp''s summary ("... and issue a session") is kept, because the screens'' api purposes are written from it;
  its description says a purpose verify code issues none. The contract cites the cart''s anonymous session as the token
