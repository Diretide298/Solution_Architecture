  type: generator-rule
  ref: tools/build-service-docs.py
status: open
notes: 'The plan has no task under a task or sub-task (epics, app-module features, tasks, then the sub-tasks build-service-docs
  makes), so the ticket the brief names as parent is recorded in the task''s text; its OpenProject parent is the app-module
  the plan places it in, and it follows the migration that creates its table(s). The two tables are new, so this task is
  their migration (a -DB key, CHG-R8MIG-016). The two tables come into the contracts with the CR lane (CHG-CR339-001); until
  that merges, this tree''s check-ticket-builds cannot resolve `table platform.tenant_field_key` and `table platform.blind_index_rehash`.
  Generator rule (tools/build-service-docs.py, the forward-migration waits): every later forward migration of a schema waits
  on the schema''s earlier migrations, a hand-written [DB] task''s included, so this task made MIG-PLATFORM-4 (#29202, Ready
  for QA) follow it; a started forward migration is now never made to wait on a hand-written [DB] task the release has not
  ticketed yet (the started-ticket rule of CHG-R9UI-001), and a pushed one (PRD-W1-DB) keeps its waits.'
