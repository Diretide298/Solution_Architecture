notes: 'check-design-notes now validates `decisions` (fields, date, a DEC id and an existing CHG id in source, questionSource
  resolved, no question left in both lists) and correction `status`/`by` (fixed, logged or withdrawn, by an existing change
  entry), and refuses any CHG id a source names that has no entry. Before this change the notes had no `decisions` key,
  so nothing recorded that a question was answered.


  Decisions by kind: {''answered'': 9, ''default accepted'': 13}.


  Corrections by entry: CHG-GST-001 1 fixed; CHG-GST-002 2 fixed; CHG-GST-003 5 fixed; CHG-GST-004 4 fixed; CHG-WIR-015
  6 fixed; CHG-WIR-016 2 fixed; CHG-WIR-017 1 logged. Corrections with no status (61) are still open.


  Tickets: none started (Block A starts Monday 5 October 2026); the notes feed the design batches at the next refresh,
  not ticket text.


  Answers that change the drawn default:

  - DEC-144 (Q144) ADM-016: Hosted with TICVAI: platform staff may publish a tenant''s site under a grant. Self-hosted:
  the venue uses ''Generate site package'' (export).

  - DEC-145 (Q145) ADM-018: A tenant can add or select interface languages beyond English and Arabic.

  - DEC-150 (Q150) CMS-005: White label has no dark or light mode: the venue''s chosen theme is applied. Theme.darkMode
  is deprecated: kept in the contract for compatibility, ignored, never used or drawn; the guest app has no Light/Dark
  switch (Pre-apply round, 2 October).

  - DEC-151 (Q151) CMS-006: Previews of the PDF ticket and the Apple/Google Wallet pass are in Block A.

  - DEC-152 (Q152) CMS-007: Every customisation option in the approved wireframe/prototype, including the card count per
  section.

  - DEC-153 (Q153) CMS-007: Scroll animation (Rise, Scale, Slide, Blur, None) is a field on landing-page sections.

  - DEC-156 (Q156) CMS-014: Publishing: simulate (preview), then a single publish by a permission holder. An optional
  review/approval step the venue can switch on.

  - DEC-160 (Q160) CMS-104: "Powered by TICVAI" is a configuration toggle, default on: shown unless the venue''s licence
  allows switching it off (Pre-apply round, 2 October; DI-297 amended).

  - DEC-163 (Q163) WEB-001: The client-approved web and app wireframes are the layout; change them only where the spec
  breaks.


  Also changed:

  - processSummary text: the "Powered by TICVAI" credit is a toggle, on by default (was "fixed, the tenant cannot remove")

  - processSummary element "Dark variant" marked deprecated (ignored, never drawn)

  - processSummary element "Powered by TICVAI": configured on CMS-104, default on, runtime

  - vocabulary "Powered by TICVAI": a toggle, on by default


