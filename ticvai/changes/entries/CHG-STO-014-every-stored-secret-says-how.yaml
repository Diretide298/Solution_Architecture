id: CHG-STO-014
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every stored write-only token, secret, credential or password says how it is kept: a Key Vault reference, field-encrypted,
  a blind index or an Argon2id PHC string.'
decision:
  what: 'x-ticvai-secret on 17 fields (tools/applied/sto-storage-14-october.py SECRETS): provider credentials and signing
    secrets vault-reference; the guest''s and staff''s password hashes argon2id-phc; per-link tokens TICVAI only looks up
    (unsubscribe, payment link, ticket transfer claim, wallet pass authentication) blind-index; a stored card token and
    a device push token field-encrypted. tools/check-stored-request-fields.py SR-SECRET-UNHASHED accepts vault-reference:
    a credential TICVAI presents to a provider (setApprovalExternalProvider.outboundCredential) cannot be a hash.'
  by: Chinmay
  date: '2026-10-14'
why: 'Block A audit before r6, classes check-contract-storage/ST-SECRET-FORM (17 at audit-base b93b5a87, 0 after) and check-stored-request-fields/SR-SECRET-UNHASHED
  (1, 0 after), evidence audit/ticvai/runs/audit-1014/classes.json; triage rulings "A stored secret says how (x-ticvai-secret:
  encrypted, per ADR-0063)" and "A credential is compared-only or stored as *_hash (ADR-0071)"; ADR-0063 as amended 14 October
  2026 (CHG-MKT-001).'
keys_touched:
