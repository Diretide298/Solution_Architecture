adam_cr: pending (raised at the r6 settlement)
triage: blocker
prevention:
  type: check
  ref: tools/check-adam-cr-settlement.py
status: open
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  source is `cr`, the closest allowed value (the lead''s instruction). Details the decision left open, chosen here:
  (1) a rejection on a closed ticket gets a comment, not a ticket (nothing to build; ADAM''s ticket guard already
  refuses a rejected CR); (2) once a CR has its child task, later settlements tell that task; (3) the server routes
  tell the ticket as the person settling, with their own OpenProject token (as every other OpenProject write in ADAM
  is made), and without a token report it in `ticketFollowUp` and settle anyway; settle_changes.py sends
  tell_ticket false and tells the ticket itself so its dry run shows it, filing the child task through ADAM''s
  preview/apply as ADAM_EMAIL (that account needs OpenProject connected in ADAM); (4) the guard that refuses a
  ticket for a Done CR is kept, so the settle flow files the child first (the route tells the ticket before it
  writes the status; settle_changes.py settles as accepted, files the child, then marks done); (5) the MIG-* child
  task for migration work is the lead''s to file, not automated (one child per CR is ADAM''s guard). The new check
  tools/check-adam-cr-settlement.py (CS-OPEN-COMMENT, CS-CLOSED-CHILD, CS-REJECTED, CS-DRY-RUN, CS-ONCE, CS-ROUTE)
  runs settle_changes.py against stand-ins for ADAM and OpenProject; on the parent commit 1eb1d063 (r5): FAIL, 7
  new findings; on this branch: PASS. The live routes are covered by viewer/api/release-check.mjs (comment once on
  an open ticket, one child task under a closed one, none on a rejection, tell_ticket false, the README section).
  OpenProject is assumed to accept a child under a closed parent (it does on 10.x with default settings); if the
  live instance refuses, ticketFollowUp says so and the CR is still settled.'
