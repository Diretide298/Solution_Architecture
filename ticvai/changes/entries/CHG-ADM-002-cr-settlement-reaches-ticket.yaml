id: CHG-ADM-002
date: '2026-10-14'
source: cr
kind: process
summary: 'A settled change request reaches the ticket it was raised from: a ticket that is not closed gets one
  comment written for the AI agent that pulls it, a closed ticket gets one child task for the change (filed before
  the CR is marked Done), and adam_pull lists every CR on the ticket near the top of README.md.'
decision:
  what: 'When a CR is settled (accepted, done or rejected) through POST /api/changes/<n>/resolve, the CSV bulk
    settle or viewer/api/settle_changes.py, the ticket it came from (change_request.external_key, or its child task
    once it has one) is told, before the status is written: not closed in OpenProject (status isClosed false), one
    comment headed "ADAM CR-nnn · <status> — read before building" saying what was decided, which release carries
    it and what to do now, sent without mail; closed, a child task of it through the existing child-ticket
    machinery (_ticket_text with the decision and the release; change_request.child_key, at most one per CR) and
    the same comment on it. A rejection on a closed ticket gets the comment only. Never two tickets or two
    identical comments per CR; settle_changes.py stays a dry run unless --apply. A CR''s work is one child task of
    its source ticket; migration work a CR causes is a child task of the affected MIG-* ticket, assigned to the
    migration owner (docs/active/team.json migrations.owner), filed by the lead. adam_pull''s README.md gets
    "Change requests on this ticket" with each CR''s status, decision and release: follow settled decisions, wait on
    open ones. A started ticket''s OpenProject text is never rewritten. ticvai/CLAUDE.md rule 7 and release-runbook
    R3, R5 and section 6 say so.'
  by: Chinmay
  date: '2026-10-14'
why: 'Lead decision, Chinmay, 14 October 2026, in his words: "whenever we have a cr we should create new tickets if
  ticket is closed. if not then add comment for the AI agent when he pulls", and the same day: "we create child
  tasks for CR remember that". At 1eb1d063 (r5) settle_changes.py commented "ADAM CR-011 · accepted" with the
  resolution on every ticket, closed or not, the resolve route told no ticket at all, and a CR''s child ticket was
  filed only by hand from the Changes page (a closed ticket''s change was never scheduled); ticvai/CLAUDE.md rule 6
  said a fix to a started ticket is "a comment plus a linked delta ticket" (council of 2 October).'
