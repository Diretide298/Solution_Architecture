id: CHG-SHP-001
date: '2026-10-14'
source: audit
kind: contract
summary: 'Every inline 4xx/5xx error response names its problem types: 527 responses got `x-ticvai-problem-types`, one
  kebab-case slug per cause the response description names (reusing the shared catalogued types and the package''s
  existing slugs at the same status). check-problem-types CEILING lowered 707 -> 168.'
decision:
  what: 'contracts/*: `x-ticvai-problem-types: [...]` on 527 operation-specific error responses, slugs drafted from
    each response description (a backticked cause code kept in kebab case; a shared type only at its catalogued
    status: validation 400, not-found 404, forbidden 403, duplicate-code 409 ...). tools/check-problem-types.py
    CEILING 707 -> 168 (the ratchet falls to the count left).'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit of 14 October 2026, class check-contract-shapes/C-ERROR-PROBLEM-TYPE (evidence
  docs/active/audit-runs/audit-1014/classes.json): 569 members before, 42 after on this branch (CHG-SHP; ruling "go with
  your recommendation", Chinmay, 14 October 2026). R075, R133. The 42 left are the responses check-error-sources
  E-PROBLEM-TYPE / E-SCHEMA-READ-VIA holds (a refusal naming another module''s entity): batch MOD writes their types
  with the read-via, so the class reaches 0 when MOD merges. Slugs were drafted per response and are the part to
  review: a few judgement calls are listed in the hand-back (replacement-approval-required,
  waiver-approver-is-submitter on a 422, seat-selection-not-found on a 404, variant-not-of-product on both a 409 and a
  400).'
