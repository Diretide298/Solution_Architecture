summary: A shift's count lines, a deposit box's opening float and a seat block's seats follow the row that owns them again,
  so the till, the cash office and the seat map can reach them below the tenant root.
decision:
  what: 'tools/derive-ddl.py ROW_OWNER: orders.cash_count_line -> shift_id, orders.deposit_box_opening_denomination -> deposit_box_id,
    seating.seat_block_item -> block_id. r6''s forward migration V0104 (tenant) re-derived: the two orders tables keep their
    r1 parent policy (the tenant-root swap leaves V0104) and seat_block_item takes its block''s.'
  by: Chinmay
  date: '2026-10-14'
why: 'Class check-rls-scope-fit/RF-TENANT-ROOT, 23 new at the r6 release gate on r6-gate1 (23eb3d98, every r6 batch merged
  and fully derived), 0 after (evidence docs/active/audit-runs/audit-1014/classes.json). A merge interaction: CHG-STO-001
  declared the NOT NULL keys and CHG-MOD-007 scoped the tables they point into, so each table had two protected owners in
  one round and derive-ddl put it at the tenant root, which no venue or workstation operation passes (openShift, submitShiftCount,
  closeDepositBoxes, getSeatInventory and 11 more). The owner is the table the rows belong to, as at r1 and as ROW_OWNER
  already decides for 25 tables.'
