summary: 'The plan changed four times in one evening on 1 October: Block A to end Sprint 5 with overtime, then Block
  A as 40 working days ending Sprint 4 (it was 35), then the pace adoption (5 tasks a developer a day, ramping to
  2x), then the blocks re-cut to fixed targets (A Sprint 4, B 6, C 8, D 10; Sprints 11-13 buffer).'
