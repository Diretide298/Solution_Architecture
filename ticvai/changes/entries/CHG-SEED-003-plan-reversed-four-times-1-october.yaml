    in 40 working days to Sprint 4; blocks of similar size on fixed targets (A S4, B S6, C S8, D S10), Sprints 11-13
    buffer, planned overtime; 5 tasks a developer a day ramping to 2x.'
  by: Chinmay
  date: '2026-10-01'
why: 'Council of 2 October: ''Plan decisions were reversed several times in a day ... nothing stopped them''; the
