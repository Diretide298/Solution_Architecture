summary: 'CR-565 and CR-569 point 2, as corrected: getDeveloperAccount, createApiClient and revokeApiCredential read a
  tenant-session caller''s principal through identity#principalRecords in process (id, email and is_active only) to
  match its verified email to an active control.developer_member. The operations role''s narrow grant XDR-195 (CR-595''s
  id, is_active, valid_from, valid_to) gains email and these three operations, so the role holds one column list on
  identity.principal; derive-ddl writes the column-limited GRANT and USAGE on schema identity into r14''s tenant
  forward migration.'
decision:
  what: 'Decided overnight by the coordinator for lane c, under the lead''s instruction of 4 November 2026 ("take the
    recommended decision unless its very very important"), correction posted on #31389, #31295 and #31383 (mail off):
    "the operations role gets SELECT on identity.principal (id, email, is_active) only, as Access''s XDR-010"; lane l''s
    column-limited grant is the mechanism, one column list for the role (id, is_active, valid_from, valid_to, email).'
  by: Chinmay
  date: '2026-11-04'
why: 'CHG-CR569-002 stopped on the verified email read: the operations host is not in commerce and had no granted read
  of identity.principal, and a whole-table grant would have given it every column.'
