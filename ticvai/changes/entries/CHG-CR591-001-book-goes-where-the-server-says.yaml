  files:
  - contracts/spine/catalogue.yaml
  - contracts/satellite/white-label.yaml
  - screens/P02-guest-mobile-app.yaml
  - screens/P01-guest-web-storefront.yaml
  - tools/check-business-rules.py
root_class: a listing card cannot tell which booking screen Book opens
tickets:
