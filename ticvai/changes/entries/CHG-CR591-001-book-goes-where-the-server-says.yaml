  - '31033 (getPublishedBookingFlow, Ready for QA): its rule is exposed as the service query; built on a new task, not by
    rewriting it.'
  unstarted:
  - '33011 (GST-003, New): Book by bookingEntry and bundleId.'
  - '31009 (listProducts), 31004 (searchCatalogue), 31727 (getProduct), all New: the two fields.'
  - 'New task (white-label, under #31033''s parent): the publishedBookingFlowSteps service query.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-591
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-BOOKING-ENTRY
status: open
notes: 'Beyond the posted words: the bundle is read through promotions#bundleRecords in process (declared on the three reads);
  publishedBookingFlowSteps answers resolved false with the type the kind rule picks and its default order for a product
  with no flow, so Catalogue applies 2(c)''s fallback without copying the rule. GST-004''s Book to GST-049 (a fixture with
  one on-sale performance) and WEB-004''s to WEB-007 have no bookingEntry value of their own; their notes only say they
  use the same two fields.'
