notes: 'A ticket the lead made in OpenProject on 1-2 November is recorded as CHG-R11PLN-001 recorded the kernel tickets:
  a hand-written task of docs/active/block-a-extra-tasks.json whose text is the ticket''s text as made, and its id in handoff/service-docs/pms-map.json
  (tools/op-created-merge.py), so the r13 apply never makes it again. Its `made` record keeps the parent, assignee, accountable,
  sprint and title it was made with, and tools/op-release.py puts those, and its text as made as its pointer, on its bundle
  row (CHG-R13PL-003), so the apply neither moves it under the plan''s app-module nor reassigns, re-sprints, retitles or
  rewrites it. The plan still schedules it (notBefore the start of the sprint it was made in, or 2 November) and orders
  its waits.'
