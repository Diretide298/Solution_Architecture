prevention:
  type: check
  ref: tools/check-screen-wiring.py
status: closed
closed_by_commit: 16fd732e
notes: 'check-screen-wiring gains S-STAFF-AUDIENCE (a staff screen calling a guest-, device-, service- or partner-only
  operation) beside the existing S-DUP-SCREEN and S-CONSUMED-MIRROR rules, and check-screens keeps its R254 attachment
  warnings; check-flows rule 3 holds every repointed flow step to its screen. Tickets: none started (Block A starts
  Monday 5 October 2026); unstarted keys are every tasks.csv or pushed key naming a touched screen. Per screen and
  flow:

  - POS-001: removed acceptShiftVariance, adjustDepositBoxFloat, closeShift, createCashMovement, getShift, listCashMovements,
  listShifts, recordNoSale, reopenShift, suspendShift — Thirteen operations that belong to other screens were bulk-attached
  to Begin Shift: closing and variance acceptance are POS-007, cash in/out POS-017, safe drops POS-018, no-sale
  and suspend the till''s shift menu. Kept: openShift, getCurrentShift, resumeShift, approveShiftOpen, listDenominations,
  ge…

  - POS-007: removed adjustDepositBoxFloat, approveShiftOpen, closeDepositBoxes, createCashMovement, getShift, listShifts,
  openShift, recordNoSale, reopenShift, reprintReceipt, resumeShift, suspendShift — Close Shift carried fourteen
  bulk-attached operations; its purpose is to count the drawer and close. Kept: closeShift, acceptShiftVariance,
  getCurrentShift, listDenominations and listCashMovements for the supervisor''s review (R254, F87 step 4; design-notes
  correction fnb-retail POS-007).

  - POS-025: declared suspendShift, reopenShift — Suspend and reopen came off Begin Shift, Close Shift, the roster,
  the staff app and the back office, where they were bulk-attached; a suspend belongs on the till''s shift menu
  (design-notes correction fnb-retail POS-001), and a reopen is the supervisor''s reversal on the same till with
  a PIN step-up…

  - POS-009: removed acceptShiftVariance, approveShiftOpen, closeShift, createRotaAssignment, getCurrentShift, getShift,
  listAlerts, listCashMovements, listWorkstations, openShift, recordNoSale, reopenShift, resumeShift, suspendShift
  — A roster is a read plus attendance; twelve shift and money operations, the workstation and alert tables and
  rota planning (createRotaAssignment, a back-office workforce task) were bulk-attached (R254; design-notes corrections
  fnb-retail POS-009).

  - POS-011: removed adjustDepositBoxFloat, listDenominations, listOutlets — The cash count, denominations, outlets
  and the deposit-box float adjustment were attached by resemblance and serve no return (R254; design-notes correction
  fnb-retail POS-011).

  - POS-012: removed adjustDepositBoxFloat, listDenominations, openShift — Denominations, Adjust deposit box float
  and Open shift were bulk-attached; a collection counter needs the order list and the handover (R254; design-notes
  correction fnb-retail POS-012).

  - POS-013: removed adjustDepositBoxFloat, createCashMovement, getOfflinePackage, listCashMovements, listDenominations,
  withdrawFromDepositBox; declared listSyncRejections — Cash operations (movements, withdraw, float) and getOfflinePackage
  (a gate scanner''s package needing ACCESS_VALIDATE) are other screens''; the refused-on-replay list (listSyncRejections)
  is this screen''s job and was missing (MATRIX 2.3.1, R254; design-notes correction fnb-retail POS-013).

  - POS-018: removed createRotaAssignment, listPrincipals, listRotaAssignments; declared listDepositBoxes — listPrincipals
  (needs USER_MANAGE), the principal and rota tables and Create rota assignment are unrelated to a safe drop, which
  needs the open drawers (listDepositBoxes) and the withdrawal (R254; design-notes correction fnb-retail POS-018).

  - POS-021: removed listMenus, listModifierGroups — listMenus is a back-office read needing PRODUCT_VIEW ("A terminal
  reads its menu from the catalogue bundle"), and getGuestMenu already returns each item''s option groups, so listModifierGroups
  is not needed on the till (R254; design-notes correction fnb-retail POS-021).

  - POS-022: declared cancelFnbOrder — Send-then-charge (R261) makes an unpaid sent order an everyday case; F108
  resolves "guest walks away" with cancelFnbOrder, which the counter did not declare (design-notes correction fnb-retail
  POS-022).

  - POS-023: removed listMerchandise — listMerchandise was loaded although "a terminal does not call this"; the
  till reads its catalogue from the local bundle and checks stock with the barcode lookup (R254; design-notes correction
  fnb-retail POS-023).

  - POS-024: removed listMenus, listOutlets — The outlet is the till''s and the menu is not edited here (86 needs
  only the items); the outlet and menu tables were plumbing on a manager''s screen (R254; design-notes correction
  fnb-retail POS-024).

  - POS-028: declared getTableVisit, getBill, requestBill, splitBill — DI-106 puts bill splitting on POS-028, but
  reading the visit, the bill, splitting and requesting it existed only on the staff app''s EMP-059; without them
  the till cannot recall or settle a table (design-notes correction fnb-retail POS-028).

  - EMP-003: removed acceptShiftVariance, approveShiftOpen, closeShift, listCashMovements, listShifts, openShift,
  recordNoSale, reopenShift, resumeShift, suspendShift — Till and cash-shift writes on the staff-app home are bulk-attach
  residue; the screen''s own notes removed createCashMovement because a screen that does not handle money should
  not move it, and a variance is accepted on the till by a supervisor (R080(e)). F08 step 4 and F64 step 4 need
  only getCurren…

  - EMP-009: removed approveShiftOpen, createCashMovement, openShift, recordNoSale, reopenShift, resumeShift — An
  end-of-shift screen does not open a shift, approve an opening float or open the drawer; F72 step 3 needs closeShift,
  acceptShiftVariance and listCashMovements (R254; design-notes correction fnb-retail EMP-009).

  - EMP-008: removed suspendShift — F72 step 1 declares the shift summary read-only ("the person being reviewed
  could sign off their own review"); suspending is the break mechanism and belongs on the till (R254; design-notes
  correction fnb-retail EMP-008).

  - EMP-030: removed listDeliveryLocations, listDiningOutlets — listDiningOutlets and listDeliveryLocations are
  guest-audience operations with no permission; a staff screen calling them bypasses the staff permission model
  (design-notes correction fnb-retail EMP-030).

  - EMP-052: removed setTableLayout — "Save table layout" (setTableLayout, PRODUCT_CONFIGURE) is configuration on
  the live service map; layout editing is EMP-053, and F80 says configuration does not work offline while service
  does (F94 step 1, R254; design-notes correction fnb-retail EMP-052).

  - EMP-053: removed createTable, updateTable; declared setTableCombinations — Three ways to write the same table
  (setTableLayout for the whole outlet, createTable and updateTable for one) mean two conflict behaviours on one
  screen; the editor saves the whole layout. Table combinations are declared before service and saved with the layout,
  so setTableCombinations moves here f…

  - EMP-054: declared resolveBookingConflict — The double-booking read (resolveBookingConflict, "Board 4D") was
  consumed by no screen, though this screen is the client''s frame fnb-4d (design-notes correction fnb-retail EMP-054).

  - EMP-055: removed createTableReservation; declared getFnbReservationPolicy, sendBookingConfirmation — createTableReservation
  is a guest operation (guestAuth, self-scoped, no permission); a host booking for a caller is not the caller, so
  it comes off the staff app until a staff-audience create exists (open contract gap CHG-WIR-011). The confirmation
  ("Board 4E") and the default duration were not wir…

  - EMP-056: declared quoteWaitTime, notifyWaitlistParty — The quote and the call belong to the waitlist (F29 branch
  at 1); quoteWaitTime and notifyWaitlistParty were on EMP-058, not on the waitlist screen (design-notes correction
  fnb-retail EMP-056).

  - EMP-058: removed joinRestaurantWaitlist, notifyWaitlistParty, quoteWaitTime, setTableCombinations — Combinations
  are pre-service configuration (EMP-053) and the waitlist actions belong to EMP-056; R254 re-derives operations
  from purpose (F94 step 1, F29 step 1; design-notes correction fnb-retail EMP-058).

  - EMP-062: removed getHaccpStatus, logTemperature, setItemAvailability; declared getOutletStock, lookupMerchandise;
  set requiresModule=retail — The client defined this screen as retail store stock and availability; the HACCP status,
  Log temperature and the F&B 86 toggle are other processes attached through F28 and the F&B board. The shop-floor
  reads that exist for exactly this (getOutletStock, consumed only by BO-044, and lookupMerchandise…

  - EMP-067: declared getHaccpStatus — F28 step 1 read the food-safety checks due on EMP-062, a retail stock screen;
  the staff app''s food-safety section (log temperature, sign corrective action) is here, and needs the status read
  to show what is due (design-notes corrections fnb-retail EMP-062, EMP-067).

  - EMP-063: declared getSuggestedRequisitions, updateRequisitionLines — The smart replenishment half (suggestions
  from reorder points) and editing lines before approval were missing; both operations exist (DI-234; design-notes
  correction fnb-retail EMP-063).

  - EMP-064: declared listStockTransfers, getStockTransfer, receiveStockTransfer — The transfer screen could only
  create; it had no transfer list, no manifest and no Receive, though the operations exist (design-notes correction
  fnb-retail EMP-064).

  - EMP-065: declared listPurchaseOrders, receiveStockTransfer — A receipt needs a purchase order the handheld could
  not look up, and a transfer manifest could be read but not received; a transfer refused at the door is a received
  quantity lower than sent (receiveStockTransfer), not rejectReceivedGoods (F35 steps 2-3; design-notes corrections
  fnb-retail EMP-065).

  - EMP-066: removed getCountVariance, postStockCount, requestRecount; declared listStockCounts — In F30, variance
  review, recount requests and posting are the supervisor''s steps on BO-079 (steps 4, 5 and 7); a counter''s device
  showing variance weakens the blind count. Without the open-count list the counter cannot find the count (F30,
  R110; design-notes correction fnb-retail EMP-066).

  - EMP-068: declared collectMerchandiseReservation, cancelMerchandiseReservation — A hold that cannot be released
  or collected from the handheld is held until it expires; cancel and collect exist (design-notes correction fnb-retail
  EMP-068).

  - EMP-074: declared getRentalAvailability — The manual pick from available units (DI-760) had no operation; getRentalAvailability
  returns the available asset ids (design-notes correction fnb-retail EMP-074).

  - EMP-088: removed sendTransactionalMessage — sendTransactionalMessage declares the service and partner audiences,
  not staff, so a staff device cannot call it as declared (design-notes correction fnb-retail EMP-088).

  - EMP-099: declared listDepositActivity — The deposit history the purpose requires was not bound; payments already
  has the deposit movement history (listDepositActivity) (design-notes correction fnb-retail EMP-099).

  - EMP-100: removed setAssetStatus — setAssetStatus needs ASSET_MANAGE (a configure-tier grant on the staff app),
  offers six maintenance statuses and takes one asset per screen; the unit''s next state belongs to the return (DI-500;
  design-notes correction fnb-retail EMP-100).

  - BO-020: removed createFnbOrder, listKitchenStations, setKitchenStations — Station set-up and item routing are
  configuration owned by Kitchen & Preparation Stations, and the back office has no tender step, so a quick-service
  order created here is unpaid; F&B orders are sent to the kitchen and then charged on the till (R254, R261, POSV2-4,
  DI-323; design-notes corrections…

  - BO-021: removed getGuestOrderStatus; declared listFnbOrders, lookupRetailSale — Order Search bound only getGuestOrderStatus,
  a guest-audience read of one order by id, and had no search; a staff lookup is listFnbOrders (F&B) and lookupRetailSale
  (retail receipt) (R254; design-notes correction fnb-retail BO-021).

  - BO-039: removed acceptShiftVariance, approveShiftOpen, closeShift, createCashMovement, getCurrentShift, openShift,
  recordNoSale, reopenShift, resumeShift, suspendShift — Till acts were bound to the back-office directory, including
  getCurrentShift ("the shift on the session''s workstation", which a browser has not) and acceptShiftVariance,
  whose one path is a supervisor on the till with a PIN step-up (R080, POSV2-3); the directory''s purpose "See every
  till, open or c…

  - BO-040: removed acceptShiftVariance, approveShiftOpen, closeShift, createCashMovement, getCurrentShift, openShift,
  recordNoSale, reopenShift, resumeShift, suspendShift — acceptShiftVariance on BO-040 contradicts R080 (e) and
  the contract itself ("BO-040 lists the shifts waiting here; it does not approve them by another route"); the till
  and lifecycle operations were bulk-attached (R254, POSV2-3; design-notes corrections fnb-retail BO-040).

  - BO-041: removed recordNoSale — A no-sale is a drawer opening at a till (F32 step 5, POS-020); recorded from
  a browser it opens no drawer and fabricates an incident. Keep the log, drop the act (R254; design-notes correction
  fnb-retail BO-041).

  - BO-042: removed getShift, listCashMovements, listShifts — The box list is the queue; the "Waiting for a decision"
  cash-movement table and the "Every shift" table were bulk plumbing (R251; design-notes correction fnb-retail BO-042).

  - BO-044: removed getGuestMenu, getOutletStock, listFnbOrders, listMerchandise, recordWaste, reserveMerchandise
  — Reserve merchandise (a guest or till act), Record waste (a stock act), the F&B order and merchandise tables,
  and the outlet stock and guest menu panels were attached by resemblance; the outlet register''s purpose does not
  need them (R254, R236, R215; design-notes correction fnb-retail BO-044).

  - BO-045: declared getAllergenVerification, listMenuVersions, listMenuSchedules, listModifierGroups, createApprovalRequest
  — getAllergenVerification exists and names BO-045; rollback needs the version list and cancelling a schedule the
  pending list (both added 26 September for this); attaching an existing group needs listModifierGroups; and a repricing
  above threshold needs its approval (createApprovalRequest) before pub…

  - BO-046: removed listKitchenStations, setKitchenStations — Station configuration (the station table and Save
  kitchen stations) sat on a monitoring screen; configuration lives on BO-134 (R254; design-notes correction fnb-retail
  BO-046).

  - BO-048: removed lookupMerchandise — On a back-office product list search covers lookup and the primary act is
  adding an item; the price check (lookupMerchandise) belongs to the till and the handheld (design-notes correction
  fnb-retail BO-048).

  - BO-049: removed setItemAvailability — "Save item availability" (the F&B 86 operation) acts on a menu item, not
  a stock item, and has its own screen (BO-140) (R254, R110; design-notes correction fnb-retail BO-049).

  - BO-052: removed acknowledgePurchaseOrder, cancelPurchaseOrder, closePurchaseOrderShort, closeTransferShort,
  createPurchaseOrder, getStockTransfer, sendPurchaseOrder — The purchase-order lifecycle belongs to BO-051 and
  the transfer actions to BO-080; F76 step 5 and F92 step 5 attached them here before BO-051 existed in the chain.
  Kept receipt, rejection, the order list for picking and receipt history (R254; design-notes correction fnb-retail
  BO-052).

  - BO-065: removed listDeliveryLocations, listDiningOutlets — listDiningOutlets (a guest read of outlets open now)
  and listDeliveryLocations are guest-audience reads, not venue configuration; outlets are configured on BO-044
  (R254; design-notes correction fnb-retail BO-065).

  - BO-080: removed createGoodsReceipt — Transfers are received with Receive; a goods receipt needs a supplier purchase
  order and was attached by resemblance (R254; design-notes correction fnb-retail BO-080).

  - BO-082: removed createStockTransfer, listOrders — An "Every order" table (sales orders) and "Create stock transfer"
  sit on the movement ledger, attached through F35 step 7; sourcing belongs with transfers (BO-080) and the order
  screens (R254; design-notes correction fnb-retail BO-082).

  - BO-104: removed createMenu, getVenueSettings, listMenus — Menu management (the menu table and Start a menu)
  belongs to BO-045, and getVenueSettings carries no module enablement (R279), so "What is enabled here" cannot
  come from it (design-notes corrections fnb-retail BO-104).

  - BO-105: removed getVenueSettings, listInventoryItems, listPurchaseOrders — The hub bound an inventory-item table,
  a purchase-order table and a venue-settings panel, duplicating BO-081 and BO-051; a hub''s operations are the
  KPI read plus the add-item shortcut, and getVenueSettings carries no module enablement (R254, R283; design-notes
  corrections fnb-retail BO-105).

  - BO-109: declared createSaleBoard — An outlet with no board yet could not start from the builder; createSaleBoard
  exists (on BO-124) (design-notes correction fnb-retail BO-109).

  - BO-111: removed updateMenu; declared getAllergenVerification — "Save menu" (updateMenu: name, service period,
