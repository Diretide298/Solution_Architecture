  - contracts/satellite/rental.yaml
  - contracts/spine/finance.yaml
  - contracts/spine/orders.yaml
  - contracts/spine/shift.yaml
  - handoff/api-data-lineage.json
  - handoff/schema-reference.json
  - tools/derive-schema-history.py
  tickets:
  - MIG-INVENTORY
  - MIG-ORDERS
  - MIG-LEDGER
  - MIG-MARKETING
  - MIG-RENTAL
