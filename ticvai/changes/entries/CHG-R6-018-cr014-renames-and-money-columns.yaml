notes: 'Batch R6, 12 October 2026. All listed in migration-review.md as renames for a forward migration. Names chosen by
  the agent and open to correction: quoted_amount and server_amount (computed prices, not entered ones), unit_amount on the
  invoice line, movement_amount, payment_amount, last_purchase_cost_amount (a cost, before tax, as
  inventory.movement.net_cost_amount); deposit_box_foreign_holding.variance was added for one name per concept beside its
  own expected_amount and counted_amount. With inventory.item gone, the name rule now reads fnb.production_plan_line.item_id
  as fnb.menu_item (a convention index, no constraint); the inventory keys that relied on the name are declared
  (CHG-R6-015). D-BANNED-NAME holds terminal, serial, barcode, card and organization for what the DDL takes after r1.'
