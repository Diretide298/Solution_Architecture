id: CHG-R6-018
date: '2026-10-12'
source: cr
kind: contract
proposed: '2026-10-12'
summary: 'CR-014: inventory.item becomes inventory.inventory_item, inventory.stock_reservation becomes
  inventory.stock_earmark, orders.group_customer_organization takes the organisation spelling, and the bare money
  columns he lists take *_amount names. External-system terms are recorded exceptions (CHG-R6-012).'
decision:
  what: 'His option 2. Tables, declared in tools/derive-schema-history.py RENAMES: inventory.item ->
    inventory.inventory_item, inventory.stock_reservation -> inventory.stock_earmark, orders.group_customer_organization(
    _contact) -> orders.group_customer_organisation(_contact). Columns, x-ticvai-column on the contract field and
    COLUMN_RENAMES: ledger.account.balance -> balance_amount; ledger.price_variance quoted_price -> quoted_amount,
    server_price -> server_amount, variance -> variance_amount; ledger.tax_invoice_line.unit_price -> unit_amount;
    inventory.requisition.estimated_total -> estimated_amount; inventory.supplier.minimum_order_value ->
    minimum_order_amount; inventory.inventory_item.last_purchase_price -> last_purchase_cost_amount; orders.payment.amount
    -> payment_amount; orders.refund.amount -> refunded_amount; orders.cash_movement.amount -> movement_amount;
    orders.deposit_box variance -> variance_amount, withdrawn_total -> withdrawn_amount, expected_total ->
    expected_amount, counted_total -> counted_amount (and orders.deposit_box_foreign_holding.variance -> variance_amount);
    marketing.processing_purpose.data_controller_applicable_organization -> ..._organisation;
    rental.agreement_item.stock_reservation_id -> stock_earmark_id. Recorded, not renamed: payment terminal_id, the wallet
    pass serial_number, the GTIN barcode on inventory_item and catalogue.variant, and the value cardScheme.'
  by: Chinmay
  date: '2026-10-12'
why: 'ADAM CR-014, raised by the backend developer: Item alone is the bare word naming-and-style 3 bans for an Inventory
  Item, Reservation is a guest''s held, not-yet-paid commitment (3.1) and a stock earmark is not one, the package spells
  organisation, and 5.1 bans price, value and total alone. Chinmay approved his option 2 on 12 October 2026, consistent
  with CR-011.'
