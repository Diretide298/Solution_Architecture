  unstarted:
  - '27852, 28097, 28027, 28018: CR-111''s settlement; the pointer bodies pick the fix up at r10.'
  - 'MIG-CATALOGUE (alternative_code, group_package, product_eligibility_rule): a child task for Hrushikant Patkar for
    the three unique indexes; a database holding duplicates must be cleaned first. Not applied while server databases
    are frozen.'
