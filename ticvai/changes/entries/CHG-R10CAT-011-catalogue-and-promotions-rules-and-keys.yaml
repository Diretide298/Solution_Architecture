id: CHG-R10CAT-011
date: '2026-10-25'
source: cr
kind: contract
summary: 'The catalogue and promotions rules of CR-111: resolveProductByCode needs partnerId from staff and answers a
  product-level code with its default variant or 409; unique (partner_id, lower(code)) on alternative_code and
  product_id on group_package and product_eligibility_rule; relinquishChannelAllocation sets allocated to sold plus
  leased, 404, 409 for no or a frozen allocation, the reason audited, a job runs the scheduled release;
  createChannelCapacity derives isSeated and adds 400 and 404; publishPromotion 409 invalid state and window ended, 404;
  updatePromotion loses isPaused, locks terms in scheduled and paused too, 404, createPromotion''s 400s; listPromotions
  orders drafts by creation; getPerformance''s published follows the event''s lifecycle.'
decision:
  what: 'ADAM CR-111, option 1, accepted 15 October 2026 (the DECISION line). contracts/spine/catalogue.yaml
    resolveProductByCode, setAlternativeCodes and AlternativeCode, ProductEligibilityRule, GroupPackageDefinition,
    relinquishChannelAllocation, createChannelCapacity and ChannelCapacity.isSeated, getPerformance;
    contracts/satellite/promotions.yaml publishPromotion, updatePromotion, createPromotion (its 400 names its problem
    types), listPromotions; docs/active/breaking-changes.yaml BC-487 (isPaused removed from updatePromotion''s body).'
  by: Chinmay
  date: '2026-10-15'
why: 'ADAM CR-111 (Deep Khanvilkar, #27852, #28097, #28027, #28018), accepted 15 October 2026 for the next release
  and moved to r10.'
keys_touched:
  operations: [resolveProductByCode, setAlternativeCodes, setGroupPackageDefinition, setProductEligibilityRule,
    relinquishChannelAllocation, createChannelCapacity, publishPromotion, updatePromotion, createPromotion,
    listPromotions, getPerformance]
  schemas: [AlternativeCode, ProductEligibilityRule, GroupPackageDefinition, ChannelCapacity]
  tables: [catalogue.alternative_code, catalogue.group_package, catalogue.product_eligibility_rule,
    catalogue.channel_envelope, catalogue.audit_entry, promotions.promotion]
  files:
  - contracts/spine/catalogue.yaml
  - contracts/satellite/promotions.yaml
  - docs/active/breaking-changes.yaml
  other:
  - 'BC-487'
root_class: 'missing keys and undocumented refusals'
