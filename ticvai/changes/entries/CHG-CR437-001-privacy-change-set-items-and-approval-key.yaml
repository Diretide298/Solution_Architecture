id: CHG-CR437-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'marketing.privacy_change_set keeps items (jsonb, nullable), the change set''s contents exactly as
  PrivacyConfigurationTestingApprovalPublicationView.items returns them, written whole on each save (stated on the
  field), and approval_request_id becomes a declared foreign key to approvals.request(id)
  (PrivacyConfigurationTestingApprovalPublicationView.approvalRequestId x-ticvai-references approvals.request), as
  workforce.leave_request.approval_request_id is. The table''s DDL is then 9 columns plus the key; the release''s
  forward migration carries the key.'
decision:
  what: 'Posted on #37087 (Chinmay, 1 November 2026), the lead''s "Approve all" of the same day: "as you recommended
    (A). marketing.privacy_change_set gets items jsonb, nullable: the change set''s contents exactly as
    PrivacyConfigurationTestingApprovalPublicationView.items returns them, written whole on each save.
    approval_request_id gets a foreign key to approvals.request(id), as workforce.leave_request and
    platform.dsar_request already have. Write it as one guarded forward migration for #37087 (CREATE TABLE with the
    9 columns, then the foreign key, each applying twice cleanly)."'
  by: Chinmay
  date: '2026-11-01'
why: 'ADAM CR-437 (Hrushikant Patkar, #37087 [DB] marketing.privacy_change_set, blocking): the table record listed
  items while the r1 DDL (010-marketing.sql) created 8 columns (items arrives only in the after-r1 V0104), and
  approval_request_id was a naming convention, indexed but not a key, although the record says the table references
  approvals.request. A change set without its items cannot be tested, approved or published.'
