    why), and a description paragraph on how the AI index is erased from the tombstone. contracts/satellite/ai.yaml
    eraseSubject: its caller sentence says the same. No screen, field or response changes; no new operation, event or
    table.'
  by: Chinmay
  date: '2026-10-20'
why: 'Finding: check-plan-closure C-CALLS, deleteGuestAccount (Block A1) calls eraseSubject, which Block D builds
  (SVC-AI-RETRIEVAL-3); merge-intpass report, concern 4 (from CHG-R8MIG-025). The lead''s ruling for the gate residue:
  Block A ships no call to an operation Block D builds; it does its own work and records the erasure for Block D.
  ADR-0047 (the tombstone), ADR-0049 (erasure of the AI index).'
