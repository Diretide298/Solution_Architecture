summary: 'deleteGuestAccount (Block A) no longer calls ai.eraseSubject (built in a later block) synchronously: its
  tombstone (pii.subject is_erased, erased_at, erasure_request_id) is the record the AI erasure works from, and
  Identity''s erasure job calls eraseSubject from the release that builds it, for each tombstoned subject and once for
  every subject tombstoned before. The guest''s request and its 202 do not change.'
