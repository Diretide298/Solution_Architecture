notes: 'Measured with build-service-docs on this branch against the same run on its parent (plan-tasks.csv, not
  committed: the plan outputs are regenerated by the release refresh, and the committed tasks.csv already lags the 1
  October plan commits). The five doors move B to A, all into Sprint 1, each under a new "(Block A)" app-module
  (AM-IDENTITY-SECURITY-P06/P07/P09/P10/P12-BLOCK-A); SVC-IDENTITY-SSO-1 (now also listSsoProviders), MIG-IDENTITY-2,
  MIG-ORDERS-2 and VM-MIG-IDENTITY follow them into A. Block A grows from 1,059 to 1,077 rows and from 3,876 to 3,922
  task points (+1.2%); the block balancing moves 27 tasks of Block C into B. Forward-migration keys of the orders
  schema renumber by build order (MIG-ORDERS-3/5/8 leave A, 4/7 enter A); none is pushed, and check-key-stability
  passes on the regenerated tasks.csv. For Chinmay: ADM-001 and PTR-001 come in because ADM-003 (a flow step) and the
  developer portal setup screens DEV-002, DEV-003 and DEV-008 are Block A; if the developer portal should wait, its
  setup screens are the lever, not the door rule. Plan outputs (tasks.csv, plan-tasks.csv, block-a-schedule.json,
  the deck) are not committed here.'
