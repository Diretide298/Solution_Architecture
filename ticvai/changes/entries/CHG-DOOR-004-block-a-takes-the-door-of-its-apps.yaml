id: CHG-DOOR-004
date: '2026-10-02'
source: audit
kind: plan
summary: The plan's Block A closure (tools/build-service-docs.py) now takes the door of every app it puts a screen in,
  so SUP-001, the only door into Venue Management, moves from Block B to Block A (Sprint 1), with ADM-001, PTR-001,
  EMP-001 and SCN-001 by the same rule.
decision:
  what: 'Fix the cause in the generator, not by hand-placing: for every Block A screen (the flow closure and the setup
    screens the slice builds) the door of its own platform joins Block A, or, where its platform has none (P08, P13,
    P16, P14), every door of its shipped app (platform.targetApp.app). A door is a screen calling login,
    verifyGuestOtp, guestSocialLogin or guestUaePassLogin. team.json sprintPlan.blockAApps is unchanged. (Chinmay,
    2 Oct 2026, fix the Block A blockers now.)'
  by: Chinmay
  date: '2026-10-02'
why: 'Platform-foundation process finding (correction on SUP-001): "The door is planned in Block B (done by 24
  November) while Block A''s Venue Management screens (BO-084, BO-085, BO-124) need it to be tested ... Block A
  screens of an app cannot be tested end to end without its door." The closure (Chinmay, 1 October: Block A completes
  its apps, plus every screen and operation in a flow through them, commit f984dc7e) followed flow steps and slice
  operations only; no flow step and no slice operation names a door, so a door was never pulled in.'
