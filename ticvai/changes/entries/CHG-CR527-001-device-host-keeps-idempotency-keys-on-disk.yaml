  - '35592 (BOCA Windows device host, Hrushikant Patkar, On hold): replace the in-memory store with the file store, and the
    tests the decision names; the posted comment carries it.'
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-527
triage: fix-forward
