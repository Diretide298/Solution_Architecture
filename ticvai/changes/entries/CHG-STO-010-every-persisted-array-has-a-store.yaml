  unstarted: []
release_tag: r6
decision_owner: Chinmay
adam_cr: pending (raised at the r6 settlement)
triage: fix-forward
prevention:
  type: check
  ref: tools/check-storage-promises.py
status: open
notes: 'Batch STO. The stated reason is the valueObject kind (the form AiGovernanceRuleList and KitchenRoutingRules.categoryRules
  already use): nothing queries one element on its own, and a child table would be rows nobody addresses. A list a caller
  edits element by element or a report counts is a child table''s; none of these is. Contract impact: x-ticvai extensions
  only. Migration effect: each jsonb or numeric[] column is an ADD COLUMN in V0104 (additive, nullable); a persisted:false
  field that had a column on an r1 table is a "column dropped" row in handoff/migration-review.md.'
