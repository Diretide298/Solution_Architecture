  files:
  - contracts/spine/orders.yaml
  - tools/check-business-rules.py
  - contracts/spine/access.yaml
  - docs/active/cross-deployable-writes.yaml
  other:
  - query access#mediaTemplateRecords (new)
  - XDR-067 (commerce SELECT on access.media_template, new)
  tables:
  - access.media_template
root_class: a print path with no element model between the designer and the device
tickets:
  started:
  - '35592 (DEVICE-BOCA-FGL, Hrushikant): build the layout model and its translation to the FGL job under these names.'
  unstarted:
  - '30993 (updateTicketTemplate), 31680 (printTicketProof), Pranay: layoutRef names a stored TicketLayout; the proof renders
    it.'
  - '32276 (setPdfPrintablePos) and 32280 (BO-346): the designer screen saves the layout.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-447
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-TICKET-LAYOUT
status: open
notes: 'Where the stored layout lives, left open at 5e8b43bf, is settled by the lead''s answer of 2 November 2026: it is
  the `layout` of the design document BO-346 saves (access.media_template.design, designer pdfPrintablePos; PdfPrintablePosTicketDesignerInput
  and View gain `layout`, the canvas''s model, nothing shown changes), layoutRef is that template''s id, and printTicketProof
  asks the new access#mediaTemplateRecords in process under XDR-067 (SELECT on access.media_template for the commerce role,
  new). Beyond the posted words: the stock''s kind field is named kind (CR-463 gives no name); fontSize has no stated unit;
  layoutRef keeps type string; createTicketTemplate and updateTicketTemplate do not check that layoutRef names a pdfPrintablePos
  template.'
