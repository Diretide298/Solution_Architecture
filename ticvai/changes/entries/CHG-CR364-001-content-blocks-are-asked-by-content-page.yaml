id: CHG-CR364-001
date: '2026-10-30'
source: cr
kind: contract
summary: 'listContentBlocks'' pageKey is a content page''s id only (format uuid): a value that is not a uuid answers 400
  validation, an unknown page id an empty page. A homepage section''s blocks are those of the content page its
  contentPageId names, so CMS-007 sends that id; a section with no page gets one first (createContentPage, then
  setHomepageLayout), and createContentBlock''s pageId is always a content page id.'
decision:
  what: 'Chinmay, 30 October 2026, reviewing the day''s CRs ("for each one actually check if they hold and if not then
    find out the best way keeping in mind what client needs"), posted on #30784: "as you recommended. pageKey is a
    content page''s id only (format uuid). A value that is not a uuid answers 400 validation, not an empty page. An
    unknown page id answers an empty page. A homepage section''s blocks are the blocks of the content page its
    contentPageId names, so CMS-007 sends that id. A section with no page yet gets one first (createContentPage, then
    setHomepageLayout setting contentPageId), and createContentBlock''s pageId is always a content page id."'
  by: Chinmay
  date: '2026-10-30'
why: 'ADAM CR-364 (Hrushikant Patkar, #30784 listContentBlocks): pageKey was "a content page''s id or a homepage
  section key", but whitelabel.content_block names its page only by page_id (uuid); whitelabel.homepage_section
  already points a section at its content page (content_page_id).'
