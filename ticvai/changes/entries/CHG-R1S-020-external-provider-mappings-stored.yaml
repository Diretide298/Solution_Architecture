    and signingSecret descriptions: the column keeps the secret''s reference.'
  by: Chinmay
  date: '2026-10-03'
why: 'the r1 gate of 3 October 2026 (a judge finding on the Sprint 1 and baseline tickets), SVC-TENANCY-MATRIX-1
  (blocker): the table had no column for the mappings and stored the secrets as plain text. (The rule table''s subject_types
  and signature_methods are in the DDL once derived; the committed DDL was stale.)'
keys_touched:
