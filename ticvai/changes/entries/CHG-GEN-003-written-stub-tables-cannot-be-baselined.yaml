id: CHG-GEN-003
date: '2026-10-14'
source: audit
kind: process
summary: 'check-ddl-conventions D-STUB-TABLE fails on any table holding only keys that the lineage writes, and such a
  finding can never be baselined; the eight written stubs leave handoff/audit-baseline.json and fail until batches CRD
  and TEN give them their columns.'
decision:
  what: 'tools/audit_guard.py: Guard.add(..., strict=True) marks a finding that fails whether or not the baseline lists
    it and that --update-baseline never writes. check-ddl-conventions reads D-STUB-TABLE from the tables the databases
    will have (the frozen baseline plus every forward migration, through tools/ddl_forward.py, so a column added after
    r1 counts), and a stub (an id and one *_id) that an operation in handoff/api-data-lineage.json writes is strict.
    Removed from the baseline: ai.index_entry, approvals.escalation, games.credit_ledger, identity.mfa_challenge,
    identity.mfa_recovery_code, identity.otp_challenge, identity.principal_credential, platform.sale_board_tile. The
    four nothing writes (platform.tenant, marketing.message_delivery, orders.payment_tip, platform.device_heartbeat)
    stay baselined.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-078 (identity.principal_credential, ticket 27764) and ADAM CR-080 (platform.sale_board_tile, ticket
  30796): both were stub tables an operation writes, and both sat in the D-STUB-TABLE baseline
  (check-ddl-conventions.py:349-350, audit-baseline.json) with ten others, so the class check R087 was written for
  passed while createPrincipal and createSaleBoard had nowhere to store a field. Audit of 14 October, process
  findings: "written stubs can''t be baselined".'
keys_touched:
  tables:
  - ai.index_entry
  - approvals.escalation
  - games.credit_ledger
  - identity.mfa_challenge
  - identity.mfa_recovery_code
  - identity.otp_challenge
  - identity.principal_credential
  - platform.sale_board_tile
  files:
  - tools/audit_guard.py
  - tools/check-ddl-conventions.py
  - handoff/audit-baseline.json
root_class: A16 STORAGE-SHAPE
tickets:
  started:
  - '27764'
  - '30796'
  unstarted: []
release_tag: r6
decision_owner: Chinmay
adam_cr: CR-078 (ADAM); CR-080 (ADAM)
triage: blocker
prevention:
  type: check
  ref: tools/check-ddl-conventions.py
status: open
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  Intended to fail on this branch: D-STUB-TABLE reports the eight written stubs (marked NEW*) until batch CRD
  (cr/078-credentials-and-stubs: the credential, MFA, OTP, escalation, index-entry and credit-ledger tables) and
  batch TEN (cr/080-083-tenancy: sale_board_tile) land and the lead''s gate writes their columns into the forward
  migration. On the parent commit (r5, 1eb1d063) the rule passed with all twelve baselined, which is the failure this
  closes; with this change it fails there on the same eight.'
