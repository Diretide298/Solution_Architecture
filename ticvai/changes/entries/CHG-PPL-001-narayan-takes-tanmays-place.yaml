summary: 'Tanmay Dukhande has left the team, and Narayan Gaonkar takes his place at the same role (Back end), pools,
  pace (1.17) and position. Every task Tanmay owned, was accountable for, tested or reviewed moves to Narayan, and
  nothing else in the plan changes.'
decision:
  what: 'docs/active/team.json: Narayan Gaonkar (OpenProject user 79) replaces Tanmay Dukhande (OpenProject user 108)
    in areas.backend, onboard, pace and people, in the same positions, and a new `successors` map records
    {"Tanmay Dukhande": "Narayan Gaonkar"}. docs/active/block-a-extra-tasks.json: the two moduleTestPeers pins and the
    54 ownerMoves that named Tanmay now name Narayan, and each note gets a dated line. tools/sprint_plan.py:
    pinned_owners gives the successor every ticket the last release (r5) pinned to the leaver, the scheduler breaks
    ties as it did for the person replaced (people `sortAs`), and the default block-test pairs name Narayan.
    tools/build-service-docs.py: module-test peers break ties the same way, and Narayan is onboarded on the pushed key
    SETUP-ONBOARD-TANMAY-DUKHANDE (#27639, New), because a pushed key is never renamed. tools/op-descriptions.py
    reads the back-end reviewers from team.json and leaves out anyone who left. tools/push-openproject.py and
    tools/build-plan-deck.py name Narayan where they meant the current back-end developer.'
  by: Chinmay
  date: '2026-10-15'
why: 'Lead decision, Chinmay, 15 October 2026, 00:40: "tanmay is leaving so shift all tasks to narayan. Check in pms his
  exact name". The OpenProject (PMS) name is Narayan Gaonkar, user 79. Tanmay held a third of the back end, including
  the work moved to him from Pallavi Sawant (CHG-R6-056) at pace 1.17 (CHG-R6-057). The generators placed work by name, so the change
  had to make the load balancer see a different name and nothing else: the pins of release r5 still named Tanmay, and
  the scheduler and the module-test peer choice broke ties alphabetically. A hard-coded reviewer list
  (op-descriptions BE_CHECK) would also have kept him reviewing.'
