    28 October 2026. WEB-021''s wireframe, screen UI and page info are updated to match the build on #32125 ... Nothing
    changes behind the screen, and nothing comes back to build"), after the lead''s review of every CR ("for each one
    actually check if they hold and if not then find out the best way keeping in mind what client needs").
    wireframes/frames/web-021.html: the frame redrawn from the CR''s description of the build in the guest-web tokens
    (the prototype capture it held is replaced), with the signed-out, loading, partial error, first-run, unrecognised
    card, offline, Add a card and Move balance overlay and Arabic states. screens/P01 WEB-021: notes, the wallet, saved
    cards and Add a card notes and wireframe.prototype.differences (match stays partial).
    tools/capture-plans/guest-web-v2.json: WEB-021 is not captured from the prototype. No visible screen field changed,
    so docs/active/approved-ui-changes.yaml needs no entry.'
  by: Chinmay
