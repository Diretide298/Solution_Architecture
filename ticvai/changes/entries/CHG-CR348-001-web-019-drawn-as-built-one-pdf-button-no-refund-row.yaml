summary: 'WEB-019 Order History is drawn and specified as the guest-web build on #32306: one PDF button when an order is
  open (the tax invoice''s), outline buttons that fill with the brand colour on hover, no separate Request a refund row
  (each open order''s Ask for a refund, with lineIds, stays), a full-width page and capitalised statuses. Same
  operations, fields, errors and states.'
decision:
  what: 'ADAM CR-348 (Chinmay, 30 October 2026, posted: "as you recommended. Design change, logged under the rule of
    28 October 2026. WEB-019''s wireframe, screen UI and page info are updated to match the build on #32306 ... Nothing
    changes behind the screen, and nothing comes back to build"), after the lead''s review of every CR ("for each one
    actually check if they hold and if not then find out the best way keeping in mind what client needs").
    wireframes/frames/web-019.html: the frame redrawn from the CR''s description of the build in the guest-web tokens
    (the prototype capture it held is replaced), with the hover, signed-out, loading, error, first-run, no-results,
    offline, refund and tax-invoice overlay and Arabic states. screens/P01 WEB-019: notes, the PDF button''s note and
    wireframe.prototype.differences (match stays partial). tools/capture-plans/guest-web-v2.json: WEB-019 is not
    captured from the prototype, so the drawn frame is not overwritten. No visible screen field changed, so
    docs/active/approved-ui-changes.yaml needs no entry.'
  by: Chinmay
  date: '2026-10-30'
why: 'ADAM CR-348 (Chitrangi Mestry, #32306 WEB-019, 30 October 2026): the build differs from the frame in look only.
