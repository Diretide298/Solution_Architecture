    section 1a beside the UAE section, at scale 3 (1 rial = 1,000 baisa), with sort order and English and Arabic names,
    marked proposed and client to correct. Proposed set: coins 5, 10, 25 and 50 baisa; notes 100 baisa, half a rial,
    1, 5, 10, 20 and 50 rials. The fixture''s Muscat region seeds from it, labelled as the proposal (not client data);
    the client''s set replaces it when it arrives. contracts/spine/shift.yaml Denomination description names section
    1a. No contract shape changes.'
