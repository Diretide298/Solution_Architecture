summary: 'The seed proposal gains section 1a, Omani denominations (OMR, scale 3), proposed by us and marked as a proposal
  for the client to correct, so the reference fixture''s Muscat region has cash to count and shift counts and cash-ups
  run in OMR. Denomination''s description names it. A check now fails when a currency the reference fixture runs in
  has no denomination seed.'
decision:
