id: CHG-CR483-001
date: '2026-11-02'
source: cr
kind: contract
summary: identity.end_principal_sessions (tools/derive-ddl.py END_PRINCIPAL_SESSIONS_SQL) takes the tenant root from the
  caller's own tenant path under the root grant, else the first label of the principal's home scope path read in the same
  statement as the caller check, switches to it, confirms it is the tenant node and raises P0001 when no root is found;
  same signature, owner and SECURITY DEFINER, no policy or grant change. updatePrincipal says so.
decision:
  what: 'Posted on #30744 (Chinmay, 2 November 2026), under the lead''s "approve all as a recommended" (2 November 2026):
    "option A, with option C''s guard. Build now: a forward migration (new ticket below) replaces identity.end_principal_sessions
    ... with CREATE OR REPLACE FUNCTION, same signature, owner and SECURITY DEFINER, no policy or grant change: (1) Keep
    the caller check as it is. (2) Take the root from what the check proved visible ... (3) Switch ticvai.scope_paths to
    that path, then confirm it ... RAISE EXCEPTION with ERRCODE P0001 ... (4) Then the two UPDATEs as now ... Add one test
    to the migration"'
  by: Chinmay
  date: '2026-11-02'
why: 'ADAM CR-483 (Sanket Keluskar, #30744, blocking): the function read the tenant row of platform.scope, which forced
  row security hides from a venue grant, so a venue manager''s deactivation ended nothing and answered 200 (CHG-R10ID-006,
  CR-180, CR-377).'
