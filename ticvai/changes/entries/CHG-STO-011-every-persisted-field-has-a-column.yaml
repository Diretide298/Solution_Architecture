id: CHG-STO-011
date: '2026-10-14'
source: audit
kind: contract
summary: A persisted schema's every field has a column, a child table or a stated no-store; the campaign invitation no longer
  shares Orders' Invitation's name, and EntitlementSummary is a projection.
decision:
  what: 'marketing-crm Invitation renamed CampaignInvitation (its one $ref follows; the wire is unchanged), so derive-schema
    stops reading Orders'' complimentary Invitation into marketing.invitation; Orders'' graph keys left there are retired;
    states/invitation.yaml names the enum''s schema. orders.EntitlementSummary persistence ''none - projection of access.entitlement
    and its product'' (it named catalogue.entitlement_template). tools/check-contract-storage.py ST-FIELD-NO-COLUMN reads
    storage as derive-schema and SP-ARRAY-NOWHERE do: a child table built from the array (`<Schema>.<prop>[]` sources),
    items that are rows of a table of their own, or a $ref to a shape the contract says is computed. tools/ddl_forward.py
    SCOPE_FILL_FROM: orders.invitation''s new scope_path is backfilled from its product (it followed the product at r1).'
  by: Chinmay
  date: '2026-10-14'
why: 'Block A audit before r6, class check-contract-storage/ST-FIELD-NO-COLUMN (171 at audit-base b93b5a87, 0 after; most
  are the SP-ARRAY-NOWHERE arrays, CHG-STO-010), evidence docs/active/audit/audit-1014/classes.json; triage ruling "A persisted
  field gets a column, or x-ticvai-persisted: false." (R086 R099 R107 ... R248).'
keys_touched:
