status: open
notes: 'Batch STO. Contract impact: a component schema renamed (CampaignInvitation); every field and path is unchanged.
  Migration effect: marketing.invitation gains campaign_id, token, status, plus_ones, responded_at, subject_id (ADD COLUMN
