id: CHG-CR302-001
date: '2026-10-29'
source: cr
kind: contract
summary: 'listDeviceBindingSession reads each binding holder''s pii.subject.display_name through identity#subjectRecords
  in process from the access host (XDR-010, one column, the caller''s row security), and states its three readings:
  credential is the entitlement''s media_code, a deactivated binding is left out, the summary is the venue''s
  deviceBinding credential policy else the tenant''s.'
decision:
  what: 'ADAM CR-302, option A (Chinmay, 29 October 2026: "All as recommended"), recorded as a ruling the way CR-296
    was: docs/active/cross-deployable-writes.yaml XDR-010 (reader access, SELECT on pii.subject,
    identity#subjectRecords, for listDeviceBindingSession only); contracts/spine/access.yaml listDeviceBindingSession:
    the read-via moves from service to in-process, its description states the source of user (display_name only),
    credential (access.entitlement.media_code), the deactivated rule and the summary''s policy, and the two
    properties say the same; contracts/spine/identity.yaml subjectRecords'' rule names the access host''s read;
    ADR-0055''s 25 October amendment, item 3, names it. derive-ddl writes the guarded GRANT (and USAGE on pii) into the
    next forward migration.'
  by: Chinmay
  date: '2026-10-29'
why: 'ADAM CR-302 (Sanket Keluskar, #32458, blocking): DeviceBindingSessionSecurityView.user is Identity''s pii.subject,
  read over a service route nothing builds (CR-281, #37051) with no grant for the access role; the lead chose the
  narrow in-process read of XDR-001, XDR-003 and CR-296.'
