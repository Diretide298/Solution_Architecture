  - docs/active/block-a-extra-tasks.json
  - docs/active/held-tasks.yaml
  - tools/op-retire.py
root_class: 'a CR that changes which tables an operation reads or writes moves the slice''s setup closure, and the plan
  follows it with no one deciding'
tickets:
