id: CHG-SCR-002
date: '2026-10-14'
source: audit
kind: spec
summary: 'Every staff, partner and console screen whose operations need a permission declares the permission that
  gates it, derived from its operations by a deriver on the refresh: the one its no-access state already names, else
  the permission of the read it loads with, then of any read, then of its writes.'
decision:
  what: 'tools/derive-screen-wiring.py gains rule S-SCREEN-PERMISSION (fix_permission, using
    generate-screens-from-contracts.py::screen_permission). It fills `permission` only where the screen declares none,
    never on a guest surface (P01, P02, P05: a guest holds no permission, ADR-0025, CHG-CLN-007), and places it after
    `wave`. Permission metadata only; the client-approved UI does not change.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding, Block A audit of 14 October 2026 (R255): check-screen-wiring/S-SCREEN-PERMISSION had 2,202
  members (evidence docs/active/audit-runs/audit-1014/classes.json, 917 Block A tickets): operations needing a permission
  and a no-access state promising to name it, but no screen permission. Default ruling (triage.py): "A screen''s
  permission is derived from the permissions its operations need (generator)". After: 0 package-wide (2,207 screens
  gain a permission at the refresh: P04 30, P06 90, P07 10, P08 1,601, P09 202, P10 42, P11 7, P12 27, P13 103, P14
  8, P16 65, P17 22).'
