  - '31030 (createBookingFlowDefinition, Hrushikant): add the in-process consent question check and 400
    consent-question-not-active.'
  - '31036 (updateBookingFlowDefinition, Hrushikant): the same check; answer step-not-in-flow-type and
    duplicate-flow-step.'
  - '31035 (listBookingFlows): no change.'
  - '32183 (CMS-103 connect to API): handle one pair of slugs, step-not-in-flow-type and duplicate-flow-step, plus
    consent-question-not-active.'
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-429
