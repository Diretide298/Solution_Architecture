notes: 'The generator side: check-cross-module-reads XR-FACT read BookingFlowSettings.guestContactFields''s
  "GuestMatchPolicy" (reached through a schema the two writes name) as a read, and tools/fix-read-routes.py wrote the
  read-via from it. NOT_READ_FOR in tools/check-cross-module-reads.py now scopes that sentence away from the two
  writes, so neither the check nor the fixer re-adds it. No breaking-changes entry: check-contract-compat does not
  compare problem types, and the renamed slugs were never in r1 (the class is in the lane report).'
