id: CHG-CR304-001
date: '2026-10-29'
source: cr
kind: contract
summary: 'setStoreAccounts: one Pass Type ID per tenant (one Apple account records one), every checklist item has its
  done-rule and fixed English guidance, and a listing is checked against the working draft''s languages (the
  published set''s without a draft). No migration.'
decision:
  what: '"All as recommended": ADAM CR-304, option A (Chinmay, 29 October 2026). contracts/satellite/white-label.yaml:
    StoreAccount.passTypeIdentifier and passCertificateSecretRef one per tenant for all brands (one per brand needs a
    later change with brand modelling); setStoreAccounts names the languages a listing is checked against and states
    the one-per-tenant rule, and its 400 says which languages; StorePublishingChecklist states each item''s done-rule
    (the three accounts; storeListing: a store recorded and every recorded listing with appName and description in
    every tenant language and category, supportUrl and privacyPolicyUrl set; appIcons: the working draft''s
    app_icons; publishedConfiguration: a current ConfigVersion) and guidance the fixed copy per item;
    getStoreAccounts and setStoreAccounts declare x-ticvai-reads whitelabel.tenant_config and
    whitelabel.config_version (getStoreAccounts'' carried override removed from
    handoff/api-data-lineage-overrides.json). contracts/spine/orders.yaml issueWalletPass,
    events/whitelabel-passCertificateExpiring.yaml and the CMS-104 overlay body (not visible UI) say one per tenant.'
  by: Chinmay
  date: '2026-10-29'
why: 'ADAM CR-304 (Chinmay Patkar, #31029 setStoreAccounts, blocking): the Pass Type ID was one per brand with no
  brand on the row, three checklist items had no done-rule, guidance had no copy and the listing languages had no
  source. Settled by the lead on 29 October 2026.'
