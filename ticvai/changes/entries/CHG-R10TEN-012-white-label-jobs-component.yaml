source: cr
kind: contract
summary: The white-label jobs component on the workers host carries app builds, site packages and preview rendering, from
  three new events (appBuild.requested, sitePackage.requested, preview.requested); one app build per platform while queued
  or building; an unpublished version is refused 409 version-not-published; site packages are Assets media (packageAssetRef);
  the preview has a named route; setAppIcons asks Assets for renditions and returns them pending in the same shape, and
  media_asset records hasTransparency.
