id: CHG-R14J-020
date: '2026-11-03'
source: audit
kind: contract
summary: 'Every contract is served from its host''s one server definition (contracts/shared/common.yaml x-ticvai-servers:
  cell https://{cellHost}/api/v1, controlPlane https://{controlPlaneHost}/api/v1, ai https://{cellHost}/ai/v1), named in
  its info.x-ticvai-hosts. payments, wallet, rental, resources, venue-map and accreditation leave the global
  https://api.ticvai.com/v1 for the cell host; public-api leaves it for the Control Plane host; workforce and approvals drop
  their module name from the base (/workforce/v1, /approvals/v1 become /api/v1); ai keeps /ai/v1 on the cell host. Every
  info.version is the URL version, 1.0.0 (17 were 0.1.0). The payments provider-connection collection moves from
  /payment-providers to /payment-provider-connections, because on the shared base it collided with orders'' GET
  /payment-providers. ADR-0026 amended with the host rule, the gateway mapping and what info.version means;
  check-contract-compat now compares each operation''s full route, the server''s base path included.'
decision:
  what: 'The r13 system review, finding B-12 (contracts disagree on host and base path; a cell-resident module served from a
    global host; info.version with no rule). The lead, 3 November 2026, on the review''s fixes: "All four, one release".
    The host follows where the data lives (ADR-0038 as amended by ADR-0040; ADR-0039 and ADR-0043 for the Control Plane),
    one base per runtime (ADR-0055 deployables, ADR-0020 for the Python AI runtime), the existing {cellHost} and
    {controlPlaneHost} majority kept. Where the Control Plane runs is left to the control-plane placement decision.'
  by: Chinmay
  date: '2026-11-03'
why: 'Finding: r13 system review B-12 (audit/ticvai/review-2026-11-03, data-contracts reviewer): seven contracts on
  https://api.ticvai.com/v1, three on https://api.{region}.ticvai.com/<module>/v1, 22 on {cellHost} or {controlPlaneHost}
  under /api/v1; info.version 0.1.0 on 17 contracts and 1.0.0 on 18; no ADR named the gateway mapping. ADR-0026, ADR-0038.'
