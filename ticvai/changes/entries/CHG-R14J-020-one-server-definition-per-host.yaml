status: open
notes: 'check-contract-compat reads `contracts:` and `operations: all` (with a required `change`) on a breaking-changes
  entry, so BC-823 approves the base move of nine contracts and nothing else. ADAM''s release diff
  (viewer/lib/release-diff.mjs) reads an entry''s `contract` and `operation` only, so in a pull BC-823 is reported against
  payments listPaymentProviderConnections; the follow-up comments carry it to every started ticket. No table, column or
  migration changes.'
