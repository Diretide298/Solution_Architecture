id: CHG-RTE-001
date: '2026-10-18'
source: cr
kind: contract
summary: 'A fact another module owns, named in an operation''s text, is asked of its owner by a declared query: the
  fourteen Sprint 1 operations of ADAM CR-096, allocateDepositBox (CR-135) and publishBundle''s tax codes (CR-110)
  name their read routes, eight owner queries are declared, two existing ones are also served in process, and every
  other operation whose own text names one of the same facts is routed the same way (87 read routes on 78
  operations). allocateDepositBox refuses an opening float in another currency and foreign holdings on allocation
  (400).'
decision:
  what: 'Published answers of 15 October (decisions-r7-crs.json): CR-096 option A, CR-135 option A with the
    developer''s correction (currency from venue settings currency_code, not region settings), CR-110''s finance
    tax-code query. New queries: tenancy#activeVenues, orders#venueChargeCurrencies (the active payment providers
    at the nearest level that has any, ADR-0018), orders#ticketTemplateRecords, fnb#deliveryLocationRecords,
    promotions#liveEffectivePrice, finance#taxCodeRecords, platform-ops#hostnameHeldByAnotherTenant,
    subscription#cellRecords. Served in process too: assets#mediaAssetRecords, platform-ops#tenantDomainRecords;
    served by service too, for askers in another deployable: tenancy#venueSettingsRecords, finance#taxCodeRecords.
    The cell name (getCurrentSession''s WorkstationContext.cellName): the commerce host fills it from its own
    configuration, one cell per tenant per region (ADR-0014), and reads no table, so no query is declared (lead''s
    ruling, 18 October). exportSubjectData''s
    Marketing data arrives with CR-101''s export job (wave 3), not here. Siblings: every operation whose text names
    one of the same facts, routed by tools/applied/read-routes-18-october.py; a queue''s "qualify for a live
    promotion" asks promotions#promotionRecords, the promotion''s own row, not a price. Fix round 1 (task review, 18
    October): a read (GET) is swept only where its own words (summary, description, parameters, request body) name
    the fact, not a shared response schema''s write rule; the 28 routes that rule no longer justifies were removed by
    the same script, and a query served by service only for them (subscription#cellRecords) went back to in process.'
  by: Chinmay
  date: '2026-10-15'
why: 'ADAM CR-096 (#27941, Deep Khanvilkar) and CR-135, accepted 15 October; ADR-0055 rule 2 as amended 14 October
  (CHG-GEN-009). Finding: check-cross-module-reads read only the lineage, whose reads are the tables behind response
  schemas, so a rule stated in words was never judged; and it counted any query of the owner as covering all its
  tables (CR-135). Class query (check-cross-module-reads --list-facts) before: 975 facts in 530 operations (table
  453, field 265, fact 128, schema 129); after: 753 in 453 operations (table 336, field 263, schema 127, fact 27), the
  27 facts being reads whose own text does not name them (docs/active/audit-runs/read-routes-1018/facts-before.tsv,
  facts-after.tsv).'
