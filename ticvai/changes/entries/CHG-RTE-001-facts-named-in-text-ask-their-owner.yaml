notes: 'XR-FACT (text) and per-table coverage (0 new XR-UNCOVERED on r6). MUST_FIX_FACTS keeps the fourteen CR pairs
  from being baselined; on the unfixed package all fourteen failed as must-fix. The other 753 XR-FACT findings are for
  the lead to baseline at merge, and they fail when their ticket starts. The dry run was read line by line: phrases
  that name a fact without reading it went into NOT_READ, each naming its operations (another tenant''s data that is
  never used, a credential''s collection desk, a limit that moves with the exchange rate, a gift card''s denominations,
  and others; in fix round 1 the region''s own cell_name, a hostname built under its cell''s stem, and the
  stored-currency sentence repeated in five schemas, which alone gave 117 findings no route could fix). Not routed:
  none (no Identity operation named a fact above its tier). Not swept (fix round 1): 27 reads whose phrase sits only in
  a response schema (getTenantConfig, the queue reads, listDepositBoxes, the finance lists and others; they remain as
  fact findings for the lead''s baseline). Started ticket the sweep reaches: #28411 (In progress, Sanket Keluskar),
  for getUnifiedReconciliation''s read of the region''s time zone: a comment for its agent (14 October rule); #32336
  (listFiscalPeriods) is no longer reached. The impact list (docs/active/audit-runs/read-routes-1018/impact.tsv) holds
  578 tickets (577 New). Verified: derive-lineage --apply (78 entries given readVia); check-cross-module-reads (XR-FACT
  753, none must-fix; every other rule 0 new), check-error-sources, check-lineage, check-contract-shapes,
  check-contract-compat, check-problem-types, check-storage-promises 0 new; the script''s second run changes nothing;
  derived files restored before the commit.'
