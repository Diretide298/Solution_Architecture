notes: 'XR-FACT (text) and per-table coverage (0 new XR-UNCOVERED on r6). MUST_FIX_FACTS keeps the fourteen CR pairs
  from being baselined; on the unfixed package all fourteen failed as must-fix. The other 843 XR-FACT findings
  (table, field and schema detectors) are for the lead to baseline at merge, and they fail when their ticket starts.
  The dry run was read line by line: eight phrases that name a fact without reading it (another tenant''s data that
  is never used, a credential''s collection desk, a limit that moves with the exchange rate, a gift card''s
  denominations, and others) went into NOT_READ, each naming its operations. Not routed: none (no Identity operation
  named a fact above its tier). Started tickets the sweep reaches: #28411 (In progress) and #32336 (Ready for QA),
  both for listFiscalPeriods and getUnifiedReconciliation''s read of the region''s time zone: a comment for their
  agent (14 October rule). The impact list (docs/active/audit-runs/read-routes-1018/impact.tsv) holds 715 tickets
  (713 New), 215 of them on the CR-named operations; the 28 back-end tickets of those are listed above. Verified:
  derive-lineage --apply; check-cross-module-reads (XR-FACT 843, none must-fix; every other rule 0 new),
  check-error-sources, check-lineage, check-contract-shapes, check-contract-compat, check-problem-types,
  check-storage-promises 0 new; derived files restored before the commit.'
