id: CHG-R14G-003
date: '2026-11-03'
source: audit
kind: spec
summary: 'The backend starter had no authentication, no ITenantContext implementation, one Database:ConnectionString for the
  process (one database, against ADR-0038) and nothing setting ticvai.* per transaction; ITenantContext said "set on the connection".
  Now TenantResolutionMiddleware resolves the request''s host to its tenant (ITenantDirectory) before authentication, and
  no tenant header is read; JWT bearer authentication (RS256, the cell''s keys) applies TenantBinding to every validated token:
  a tenant claim (tid for serviceAuth) other than the host''s tenant, a missing or dead sid, or a session of another tenant
  is 401. TicvaiDbContext connects to that tenant''s database (Tenants:Entries, a database each); every transaction opens
  with set_config(ticvai.scope_paths / subject_id / principal_id, ..., true), which is SET LOCAL, from ScopeContextInterceptor,
  run through ITransactionRunner; ITenantContext.TenantId is a Guid, with the subject and principal; /health is 503 when a
  tenant database does not answer; every log line and span carries tenant_id, region_id and venue_id. Integration tests: a
  token of tenant B at tenant A''s host is 401, with or without a tenant header; a session of another tenant is 401; an unknown
  host 404; health 503. A PostgreSQL test (the pipeline''s service) proves a query without the context sees no rows and nothing
  leaks to the next user of a pooled connection.'
decision:
  what: 'Review findings G-03 (HIGH), the starter side of C-05 (HIGH) and G-11 (the TenantId string/Guid split, no log enricher,
    /health blind to the database): a tenant-routing data path keyed by the token''s tenant, a transaction interceptor issuing
    the three SET LOCALs, authentication in the pipeline, and a test that a query without the context sees no rows. Lane h
    states the contract rule (common.yaml bearerAuth/guestAuth, CHG-R14H-002); the starter implements it. The lead, 3 November
    2026, after reading the r13 system review triage: "All four, one release" (the starters, device/guest/token access, gate
    integrity, tenant setup and stale docs go into r14, released together).'
  by: Chinmay
  date: '2026-11-03'
why: r13 system review G-03, G-11 (findings/G-starters.md) and C-05 (findings/C-security-ai.md); ADR-0038; backend/MIGRATIONS.md
  "The connection context" (CHG-R8MIG-007); ADR-0056.
