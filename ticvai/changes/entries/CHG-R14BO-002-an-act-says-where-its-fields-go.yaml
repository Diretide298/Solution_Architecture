    where its operation''s decision says, or mark it not stored with the reason. Each mark states what the operation''s
    own text already says; certifyIntegration.notes is the one field the text says nothing about, and no column holds
    it, so it is marked not stored.'
  by: Chinmay
  date: '2026-11-03'
why: 'Finding: r14 lane gates of 3 November 2026 (lane d''s run 20261103-132023-2094), check-request-fields-stored
