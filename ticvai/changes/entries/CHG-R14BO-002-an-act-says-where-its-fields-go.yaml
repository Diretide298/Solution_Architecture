summary: 'Ten request fields of acts said nowhere where they go; each now says it on the field, from the operation''s own
  text: certifyIntegration.decision is stored as the listing''s status, decideProductionAccess.decision as the request''s
  status, topUpWallet.bonusAmount as the bonus lot''s issued_amount (x-ticvai-stored-as); acceptShiftVariance.supervisorStepUp
  (verified, never stored; the supervisor is the variance approval row, as on approveShiftOpen), claimOpenShift.openShiftId
  (names the row it updates), cloneProduct.includePrices and includeVariants (instructions to the call),
  testChannelConnection.tests (the results are lastTests), topUpWallet.tender (the receipt''s label) and
  certifyIntegration.notes are not stored (x-ticvai-persisted: false, with why).'
decision:
