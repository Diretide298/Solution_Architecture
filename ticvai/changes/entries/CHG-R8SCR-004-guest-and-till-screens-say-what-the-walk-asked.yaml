summary: 'Seven screen causes of the second r8 round, bindings and build notes only (no visible field changes).
  WEB-004 Book chooses its screen from the product''s published booking flow (getPublishedBookingFlow; each Book
  edge names its flow type). POS-003 takes no inventory hold of its own: the cart''s hold (addCartLine) is the only
  one, and its edge to the seat map carries the performance only (F58 step 2 follows). GST-052 Use this plan sends
  a party and dates (carried from GST-051, or today and one adult on the cold entry, proposed). BO-015''s calendar
  takes the day-start hour from the venue settings the app shell loads and its category options from
  listProductCategories; the rule is written once on calendarView. WEB-045 is WEB-025''s page at its own route,
  built once. A signed-out guest sent to sign-in from a no-access state is brought back (one rule in
  _patterns.yaml; returnTo and returnParams on GST-042 and WEB-016). Thirteen guest screens whose no-access text
  still names staff permissions carry a build note, and their corrected wording waits for the client.'
