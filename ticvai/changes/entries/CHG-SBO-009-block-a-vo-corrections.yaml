  - BO-186: decided DEC-236: app, staffed counters and self-service kiosk with consent; not the turnstile (contract aligned
  by CHG-CSP-021) | A selectField labelled "→" (an arrow from the pack''s journey) and booleans drawn as selectFields; Number
  of capture attempts as a textField

  - BO-188: A selectField labelled "→" and an empty table | Face Tag capture at the entry gate conflicts with enrolFacePass''s
  "never at a gate" rule

  - BO-189: Liveness, duplicate check, quality, timeout, retries and mask handling are all selectFields; the two thresholds
  are missing from the form

  - BO-201: All six controls are selectFields (reason, emergency code, automatic notification)

  - BO-230: decided DEC-255: live direction switch with setAccessPointDirection (CHG-CSP-032) | No Change mode action is drawn;
  only Cancel gate mode change | The pack''s modes Group, Fast Pass, Re-entry and Crossover

  - BO-395: Redemption drawn as a text field "Redemption Earn / Spend / N/A" | apisNote says cloneGame is "still owed by a
  contract change" | Activate/Deactivate from the pack actions is missing from the action bar

  - BO-857: The gap note says the screen declares no write | Cleaning window from/to are textFields; operational settings
  are selectFields | Resource.status (available, booked, checkedOut, maintenance, retired) and the lifecycle state are two
  different machines with overlapping words

  - BO-861: Every field (package code, name, description, effective dates, internal cost) is a selectField

  - BO-866: Twenty-five selectFields named after the pack bullets (including Time zone and the group headings "Availability
  Exceptions", "Inheritance") | A per-resource Time zone field

  - BO-870: Each block type is drawn as its own selectField

  - BO-877: Minimum / Preferred / Mandatory drawn as three action buttons; empty content region

  - BO-911: Result values used as action-bar buttons ("Passed with Observation", "Failed", "Evidence")


