notes: 'Batch OFL. Keeps (12, client-approved UI): BO-097 checkOutResource, checkInResource, authoriseStoredValue,
  relinquishStoredValue, captureStoredValue (a web back office whose approved copy says "Queued locally"; decision 2
  says a web app never queues, so only the approved copy can change); POS-012 reserveMerchandise, collectShopAndDrop
  (retail stays online, ADR-0013); POS-016 configureWorkstation, setDeviceAssignment (configuration; setDeviceAssignment
  also declares no x-ticvai-offline-capable at all); POS-021 addCartLine (the cart takes a capacity lease); POS-025
  reopenShift (needs the server total); POS-028 createTableReservationForGuest (a table held offline is held twice).
  The inline request bodies of the newly offline writes carry no recordedAt yet; their tables are not flagged by
  ST-OFFLINE-RECORDED-AT because the bodies are not persisted schemas.'
