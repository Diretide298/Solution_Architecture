id: CHG-OFL-002
date: '2026-10-14'
source: audit
kind: contract
summary: 'Thirteen writes the client-approved staff-app, till and kitchen screens say they queue offline become
  x-ticvai-offline-capable (work orders, incidents, cases, table close, kitchen notify and prioritise), and syncOrders
  is marked as the outbox''s own replay call (x-ticvai-outbox-replay).'
decision:
  what: 'Under decision 2 of 14 October and the lead''s rule that approved screens are not changed, a write an approved
    offline-app screen promises to queue is made offline-capable in its contract, keeping its Idempotency-Key and its
    declared conflict policy: closeTableVisit (POS-028, EMP-059), cancelWorkOrder, closeWorkOrder, verifyWorkOrder,
    recordWorkOrderParts (EMP-006), uploadIncidentMedia (EMP-026), escalateCase, reopenCase, updateCase (EMP-028,
    EMP-029), recordAuthorityNotification, updateIncident (EMP-027, EMP-029, EMP-050), notifyServer (KIT-002),
    prioritiseKitchenTicket (KIT-003). Writes that hold capacity, stock under a lease, configuration or a web app''s
    queue stay online-only and their screens are keeps. syncOrders gets x-ticvai-outbox-replay: true and
    check-screen-wiring stops asking a screen to call the replay disabled.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit class check-screen-wiring/S-OFFLINE-QUEUED, 29 members before, 12 after (docs/active/audit-runs/audit-1014/classes.json;
  CHG-SWP-004). Retail stays online (ADR-0013), so reserveMerchandise and collectShopAndDrop are not made offline.'
keys_touched:
  operations: [closeTableVisit, cancelWorkOrder, closeWorkOrder, verifyWorkOrder, recordWorkOrderParts,
    uploadIncidentMedia, escalateCase, reopenCase, updateCase, recordAuthorityNotification, updateIncident,
    notifyServer, prioritiseKitchenTicket, syncOrders]
  screens: [POS-013, POS-028, EMP-006, EMP-026, EMP-028, EMP-029, KIT-002, KIT-003]
  files: [contracts/satellite/fnb.yaml, contracts/satellite/maintenance.yaml, contracts/satellite/marketing-crm.yaml,
    contracts/spine/orders.yaml, tools/check-screen-wiring.py]
  other: [x-ticvai-outbox-replay, S-OFFLINE-QUEUED]
root_class: A34 SCREEN-CONTEXT
