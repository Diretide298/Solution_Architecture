summary: The design handoff shows "Powered by TICVAI" as a tenant toggle, on by default, instead of a fixed, never-editable credit.
decision:
  what: >-
    tools/build-white-label-map.py drops "Powered by TICVAI is fixed and never client-editable" from Never configurable,
    labels and explains brand.showPoweredBy (launch screen, foot of Account, web footer; off only with the licence
    add-on, 403 powered-by-locked) with an input-to-output example; design_spec.py's guest block says the credit is a
    toggle on by default.
  by: Chinmay
  date: '2026-10-02'
why: >-
  Chinmay, 2 October, workbook Q160 (DEC-160, CMS-104) and the pre-apply round: "Powered by: a toggle, default on ...
  shown unless the venue's licence allows switching it off"; consistent with DI-297. Contract: CHG-CSA-036. The map
  still said the opposite (MoM 3 Aug DI-111 wording), and every guest batch carried it.
