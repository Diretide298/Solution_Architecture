notes: 'Batch SCG (screens, guest apps), 14 October 2026. For the lead: the removals leave these guest capabilities with
  no approved surface, which check-screens now warns about ("a guest may call it and no guest screen does"): a
  tracking-consent prompt and preference centre (tracking stays off until one is designed), wallet exit settlement,
  membership instalments, removing a two-step method, guest identity verification. Each needs a client-approved
  design before it can come back. x-ticvai-consumed-by in the contracts is re-derived by link-screens-contracts at
  the refresh.'
