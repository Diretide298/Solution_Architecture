id: CHG-R12PL-034
date: '2026-10-31'
source: cr
kind: plan
proposed: '2026-10-31'
summary: 'Everything on the AI server is the AI engineers'': the AiService back end (its API), the ai schema''s migrations
  (its Postgres) and SETUP-QDRANT (its Qdrant), by a rule in team.json, with AiService reviewed by Kalpita Mejari.'
decision:
  what: 'The lead, 31 October 2026, on the 64 settled CRs (CR-372 to CR-435): "Include them in r12". docs/active/team.json:
    a new `aiServer` rule (pool ai; services AiService; tracks Backend and Database; keys SETUP-QDRANT) with the lead''s
    words; `migrations.exceptKeys` ^(VM-)?MIG-AI(-[0-9]+)?$, the ai schema''s exception to the migration owner; the AI server''s
    tasks reviewed by Kalpita Mejari, the first AI engineer (not through `serviceOwners`, which would move app-modules between
    blocks); the `ai` note no longer says the AI endpoints are the developers'' (the AI screens stay the frontend developers'').
    tools/sprint_plan.py (ai_server, the exception), tools/build-service-docs.py and tools/derive-block-a-schedule.py: an
    AI server task whose ticket has not started goes to the AI pool after the pins and is placed on whichever AI engineer
    can start it first; a started one keeps its owner; one not ticketed and past 2 April is created unassigned, as the AI
    engine''s are; each says "Built on the AI server: ..." (carried to its ticket, ticket_done.CARRY); one whose operations
    read or write Qdrant waits on SETUP-QDRANT and AI-ENGINE-QDRANT; the helper pass leaves them alone; an AI engine task
    with no named owner is the schedule''s to place. tools/check-plan-owners.py: O-AI-SERVER. docs/active/block-a-extra-tasks.json:
    SETUP-QDRANT names no owner; the AI-ENGINE epic''s text; the seven `ownerMoves` that gave AiService tasks to back-end
    developers (SVC-AI-AI-1, -FORECAST-1, -GOVERNANCE-1, -KNOWLEDGE-2, -MODELS-1, -MODELS-2, -MONITORING-1; CHG-R5-003,
    CHG-R6-056) are removed, superseded by the lead''s rule. tools/build-service-docs.py: the AI review''s back-end tasks
    (AI-BE-*) say a change an owning service needs is a change request on that service. '
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM: the lead, 31 October 2026, answering Hrushikant Patkar''s note that #27716 SVC-AI-FORECAST-2 and #27841 SVC-AI-RETRIEVAL-1
  belong to the AI team: "All to the AI engineers", then "The tasks that are for qdrant or postgre. And than api. From ai
  server that will be undertaken by AI engineer". AiService is the separate Python deployable ticvai-ai (ADR-0055, ADR-0020),
  kept out of every .NET host by the architecture tests, and #27841 also needs the Qdrant cluster. ADR-0055 rule 1 (a module
  owns its schemas and only the owner migrates them) makes the ai schema''s migrations the AI module''s.'
