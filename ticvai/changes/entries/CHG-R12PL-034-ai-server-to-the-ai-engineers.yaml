notes: 'Measured on this tree (handoff/service-docs/block-a-schedule.json, 130 working days to 2 April 2027 per AI engineer,
  26 weeks): before, Kalpita Mejari 21.9 weeks and the second AI engineer 22.6; after, 25.8 and 23.9 (84 and 21 of the 105
  tasks; the schedule places each on whichever can start it first). Nothing more lands past 2 April unassigned (the seven
  phase 2 units, 107.5 engineer-days, as before; no AI server task), but AI-ENGINE-MARKETING-AI''s module test now ends
  after 2 April (check AI phase 1 completion) and Block A''s last work moves from 1 to 15 December (two Block A AiService
  tasks, SVC-AI-INSIGHTS-4 and SVC-AI-MODELS-3, end 30 November). The move is applied after the pins, as the migration rule
  is: done before the balancing and the block passes it took three more Block A app-modules into A2, so AiService is not
  named in `serviceOwners` and its accountable comes from the AI server rule. The AI review''s 27 AI-BE-* back-end tasks
  are AiService''s too and move; their text named work in the owning services as well, now a change request on that service.
  AI-ENGINE-QDRANT (ADR-0049) still has the Qdrant token issuer and the collection, alias, snapshot and offboarding work
  run by the .NET workers host: that is an ADR''s placement, not changed here.'
