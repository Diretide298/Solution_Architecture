id: CHG-ADM-003
date: '2026-10-14'
source: cr
kind: process
summary: 'ADAM can record a CR child task that already exists in OpenProject (made on the server with
  tools/op-create.rb, "[CR-nnn] ..."), and its ticket apply links such a child instead of making a second one and
  survives a create whose answer is lost behind the proxy.'
decision:
  what: 'Add POST /api/changes/{n}/ticket/link {project_id, key}, admin only: records an existing work package as the
    CR''s child (child_key, child_at, child_by and the artefact link), refused when the CR already has one, was raised
    from no ticket, when the work package is another CR''s, or when its parent is not the CR''s external_key. The
    apply (and the settlement''s child task, CHG-ADM-002) first looks for a child of the source ticket whose subject
    starts "[CR-nnn]" (or is exactly the subject it would send) and links it; after a create that errors it looks
    again before reporting the failure. settle_changes.py --link-existing links such a child before it would file
    one, and comments on it once. The release runbook section 6 says how to use it.'
  by: Chinmay
  date: '2026-10-14'
why: 'The lead''s instruction through the coordinator, 14 October 2026: ADAM''s
  /api/changes/{n}/ticket/{proposal}/apply answered 502 for every CR that day (the preview worked; the create to
  OpenProject failed or timed out behind Cloudflare), so the lead is creating the nine CR child tasks on the
  OpenProject server with tools/op-create.rb, and ADAM would have no child_key for them. Follows CHG-ADM-002 (a CR''s
  work is one child task of its source ticket) on this branch at b3ea0ff9.'
