root_class: 'new: cr-settlement-misses-ticket'
tickets:
  started: []
  unstarted: []
release_tag: r6
decision_owner: Chinmay
adam_cr: pending (raised at the r6 settlement)
triage: blocker
prevention:
  type: check
  ref: tools/check-adam-cr-settlement.py
status: open
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  A separate entry rather than folded into CHG-ADM-002, because it is a separate failure (the proxy) with its own
  route. The prevention is the CS-LINK rule added to tools/check-adam-cr-settlement.py (settle_changes.py
  --link-existing against stand-ins; the admin link route; the apply looking for an existing child before and after
  a create): run on the previous commit b3ea0ff9 it fails with 3 findings, and passes here. viewer/api/cr-ticket-check.mjs
  gained 9 assertions (49 pass): only an admin links, not under another ticket, not another CR''s ticket, the link
  and its artefact link, no second link, nothing created; an apply with a "[CR-nnn]" child already there links it;
  a create whose answer is lost (the stand-in makes it and answers 502) is recovered. Children are read from the
  parent''s `children` links (titled with the subject), with a parent filter where an instance leaves them out. A
  child whose subject is exactly the CR''s title is also taken as its own, unless it is already another CR''s
  child.'
