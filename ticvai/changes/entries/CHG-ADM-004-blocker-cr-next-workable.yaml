id: CHG-ADM-004
date: '2026-10-14'
source: cr
kind: process
summary: 'A blocker is always a CR: when the package blocks a ticket the agent raises a blocking CR, proposes the
  ticket On hold naming it, never works around it, and takes the next ticket no open blocking CR affects, which ADAM
  now works out per ticket on the board and the pull.'
decision:
  what: 'Agent behaviour: one BLOCKER_RULE sentence in the connector (adam_board, adam_draft_change, adam_pull and
    adam_raise_change''s next step, the server''s instructions), the /ticket, /board, /cr and /done commands and both
    CLAUDE.md starters: raise a CR with blocking true (draft, the person says yes, file), propose the ticket On hold
    naming the CR (applied only after a yes), never work around it or build a guess, then take the next ticket no
    open blocking CR affects (adam_board with only "workable", first in board order, naming the CR that holds back
    each skipped ticket). Server: viewer/api/blockers.py works out the open blocking CRs that affect a ticket - a CR
    blocks while blocking and open, or accepted and not in a served release; it affects the ticket it was raised
    from (not its own child task), a ticket linked to one of its artefacts (target and artefact_ids; operations by
    operationId), and a ticket whose operation reads or writes a table it names, by the served tree''s
    handoff/api-data-lineage.json (cached by modification time; one query per board). /api/board/mine items carry
    blockedBy, with workable and blocked counts and ?only=workable|blocked; /api/work-packages/{key} carries
    blockedBy, which the pull shows as "Blocked by" above "Change requests on this ticket". ticvai/CLAUDE.md rule 18
    and the developer brief say the same.'
  by: Chinmay
  date: '2026-10-14'
why: 'Lead decision, Chinmay, 14 October 2026, in his words: "if there is blocker we log it as CR always. and than
  scour for next tasks that can be completed and if existing blockers effect it". At 602ce156 the starter CLAUDE.md
  said to "offer" On hold and "Build whatever the question does not touch", the developer brief said "Carry on with
  the rest of the ticket", and nothing told an agent which other tickets an open blocking CR affects, so finding the
  next workable ticket was a guess. Follows CHG-ADM-002 (a settled CR reaches its ticket).'
