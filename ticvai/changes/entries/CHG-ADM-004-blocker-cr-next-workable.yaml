notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".
  Choices where the instruction left a detail open: "accepted-not-yet-released" is an accepted CR whose resolved_ref
  is not a release tag at or below the one served (no ref counts as not released); the lineage expansion is one way
  (a ticket''s operations to the tables they read or write, matched against tables a CR names), because expanding
  both sides would make every pair of operations that read a shared table block each other; a screen is not expanded
  to the operations it calls; a CR does not block its own child task; ticvai/CLAUDE.md gets rule 18 (a new section)
  so rules 1-17 keep their numbers; changes/README.md is not about agent behaviour and is unchanged. The new check
  tools/check-adam-blocker-rule.py (BR-RULE, BR-WORKAROUND, BR-SERVER) was run on main at 602ce156: FAIL, 46 new
  findings; on this branch: PASS. The matching is covered by viewer/api/blockers-check.py (10 cases on stand-in data;
  the module does not exist on main) and viewer/api/release-check.mjs (94 pass, 9 new over HTTP: the board''s
  blockedBy through a screen and through the lineage, a non-blocking CR blocking nothing, the counts, adam_board only
  workable, the blocked column, the pull''s "Blocked by" section and next step, and a CR released or done blocking
  nothing).'
