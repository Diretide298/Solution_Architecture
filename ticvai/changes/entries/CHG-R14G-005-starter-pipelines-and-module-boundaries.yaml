id: CHG-R14G-005
date: '2026-11-03'
source: audit
kind: spec
summary: 'No pipeline ran the backend tests; the integration test project had none ("No test is available", exit 0); the frontend''s
  only CI was a GitHub Actions file in repositories on GitLab, on node 20, whose nx affected --base=origin/main is empty on
  main; the frontend failed its own lint (no scope:ui constraint); the architecture tests checked layers only. Now: a .gitlab-ci.yml
  per starter (backend: the build with warnings as errors, every test project against a PostgreSQL 16 service with TICVAI_REQUIRE_DATABASE=1,
  failing a project that ran no tests or a skipped test; frontend: node 22, corepack pnpm, nx affected against the merge request''s
  base, run-many on the default branch and tags); the GitHub workflow is gone; eslint has scope:ui, scope:offline-core and
  type:package constraints; ModuleBoundaryTests checks ADR-0055''s 16 .NET modules (modules.json) on the compiled IL, method
  bodies included: a module uses another only through its Features/<Module>/Public/ types, and across deployables only where
  cross-deployable-writes.yaml records the reader composing it; planted violations prove the rule fires. IntegrationTests
  has 8 real tests.'
decision:
  what: 'Review findings G-05 (HIGH) and the starter part of D-07 (module-boundary tests over all modules; IntegrationTests
    gets a real test). The lead, 3 November 2026, after reading the r13 system review triage: "All four, one release" (the
    starters, device/guest/token access, gate integrity, tenant setup and stale docs go into r14, released together).'
  by: Chinmay
  date: '2026-11-03'
why: r13 system review G-05 (findings/G-starters.md) and D-07 (findings/D-code-scaffolds.md); ADR-0055; quality-gates.md.
