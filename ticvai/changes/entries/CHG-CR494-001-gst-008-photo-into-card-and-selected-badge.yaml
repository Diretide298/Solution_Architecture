    top, 190 high and clipped to its frame, with a gradient (token photoIntoCardGradient) that is clear down to 40% of
    its height and solid white at its foot ... (2) Shut ticket: the ''N selected'' badge sits in the top row beside the
    ticket''s kind icon. The foot row holds only the from-price and the chevron. The badge shows whenever at least one
    of that ticket is chosen, whether ticketTags is on or off (it is not a tag), and it is hidden at zero ... (3) Draw
    both changes in every cardLayout ... and cardSize, and mirror them in Arabic. Same operations, fields, errors and
    permissions as before." The lead''s "Close the CRs and respond to devs" and "get the NEw CRs in the r13", 3
    November 2026.'
