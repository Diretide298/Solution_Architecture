id: CHG-R11FXD-002
date: '2026-10-29'
source: audit
kind: contract
summary: 'Job titles, leave types and shift patterns, which a venue configures (setJobTitle, setLeaveType,
  setShiftPattern, x-ticvai-config-scope venue), carry the scope that wrote them (a server-set scopePath) and are read
  beneath it (x-ticvai-rls read-beneath): a venue writes its own and reads its own and those of the region and tenant
  above it. A leave balance follows its leave type.'
decision:
  what: 'The lead, 29 October 2026 (r11 gate): "Accept", over moving the writes to tenant level. contracts/satellite/workforce.yaml WorkforceJobTitle, WorkforceLeaveType and WorkforceShift: scopePath
    (readOnly, required, set by the server from the caller''s scope, never taken from a request) and x-ticvai-rls
    read-beneath, the write rule of the lead''s default ruling of 14 October 2026 (CHG-MOD-007: "a table written below
    tenant gets a scope") with the read ADR-0018 asks of configuration (nearest ancestor wins, venue the floor; rule 3
    of tools/check-config-scope.py: a venue operation cannot set a tenant-wide value, which a grant-holder write on the
    unscoped table would have let it do). derive-ddl writes the three scope_path columns and their indexes into the
    forward migration and re-applies each policy as apply_read_beneath_rls; handoff/migration-review.md names the
    backfill (existing rows take the tenant''s path, then NOT NULL). WorkforceLeaveBalance gets no mark: with
    leave_type scoped, derive-ddl''s owner rule makes workforce.leave_balance follow its leave type (type_id) through
    the parent rule, split, so a balance is read where its leave type is read.'
  by: Chinmay
  date: '2026-10-29'
why: 'Finding: the r11 final gate, 29 October 2026, check-rls-scope-fit RF-TENANT-ROOT on started tickets #31220
  (setJobTitle reading and writing workforce.job_title, listJobTitles and getEmployee reading it), #33593 (setLeaveType
  and listLeaveTypes on workforce.leave_type), #31221 (setShiftPattern and listShiftPatterns on workforce.shift, and
  suggestWorkOrderAssignee reading it) and #33591 (getEmployee and listLeaveBalances reading workforce.leave_balance),
  all Ready for QA (Hrushikant Patkar): tenant-root tables under apply_tenant_rls, so a venue read none and wrote none.
  CR-076, CHG-GEN-010, CHG-MOD-007, ADR-0018.'
keys_touched:
  operations: [setJobTitle, listJobTitles, setLeaveType, listLeaveTypes, setShiftPattern, listShiftPatterns,
    suggestWorkOrderAssignee, getEmployee, listLeaveBalances]
  schemas: [WorkforceJobTitle, WorkforceLeaveType, WorkforceShift, WorkforceLeaveBalance]
  tables: [workforce.job_title, workforce.leave_type, workforce.shift, workforce.leave_balance]
  tickets: ['31220', '33593', '31221', '33591']
  files:
  - contracts/satellite/workforce.yaml
root_class: 'a table a venue configures, with no scope to own its rows'
tickets:
  started:
  - '31220, 33593, 31221: set scope_path on every row setJobTitle, setLeaveType and setShiftPattern write, from the
    caller''s scope (never from the body), and return scopePath. A PUT addressed to a row that sits above the caller''s
    scope (a tenant or region definition) is refused by the row policy: a venue that wants its own creates its own id.
    The lists return the caller''s rows and those above it, not a sibling venue''s.'
  - '33591: nothing to change in the build; a balance is read wherever its leave type is.'
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: 'none: r11 gate'
triage: fix-forward
prevention:
  type: check
  ref: tools/check-rls-scope-fit.py
status: open
