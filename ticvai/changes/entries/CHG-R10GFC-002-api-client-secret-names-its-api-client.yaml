id: CHG-R10GFC-002
date: '2026-10-26'
source: audit
kind: contract
summary: 'public-api ApiClientSecret.clientId is renamed apiClientId, as ApprovalExternalProvider and
  WalletIntegrationMapping name an API client, so the column is control.api_client_secret.api_client_id.'
decision:
  what: 'contracts/satellite/public-api.yaml: ApiClientSecret `clientId` becomes `apiClientId` (the required list and the
    property; still x-ticvai-references control.api_client), with a description. No operation returns the schema, so no
    wire shape changes; the `{clientId}` path parameters of the API client operations are older, baselined names and
    are not touched here.'
  by: Chinmay
  date: '2026-10-26'
why: 'The r10 integration gate of 26 October 2026 (run 20261026-135604-1087), check-glossary-terms G-BANNED-NAME:
  docs/glossary.md bans `client` in a name (it means Tenant). The field is new in r10 from ADAM CR-098
  (CHG-R10ID-011), and the package already names a reference to an API client `apiClientId` (approvals
  ApprovalExternalProvider, wallet WalletIntegrationMapping).'
keys_touched:
  schemas: [ApiClientSecret]
  tables: [control.api_client_secret]
  files:
  - contracts/satellite/public-api.yaml
root_class: 'a new field named with a word the glossary bans'
tickets:
  started: []
  unstarted:
  - 'createApiClient, rotateApiCredential, revokeApiClient and issueApiToken (#27976, #27979, #27984, #27986 and their
    screen tickets, all New on 22 October): they pick it up at the r10 tag.'
release_tag: r10
decision_owner: Chinmay
adam_cr: CR-098
triage: blocker
prevention:
  type: check
  ref: tools/check-glossary-terms.py
status: open
notes: 'The 204 known G-BANNED-NAME findings include the other public-api `clientId` fields and path parameters; they
  were baselined before r10, started tickets build some of them, and they are left to the lead.'
