  ref: tools/op-release.rb::rel_quietly
status: open
notes: 'Not run against OpenProject 10 before r5: the r5 dry run is its first test, and its "mail:" line says which
  way it went. r5 rewrites descriptions with update_all, which makes no journal and sends no mail; only the one
  comment on started tickets goes through a journal.'
