id: CHG-CR580-001
date: '2026-11-03'
source: cr
kind: contract
summary: 'bulkChangePrices writes one catalogue.audit_entry per changed price (domain pricing, entity_type price, field
  list_price, the old and new amount) in the run''s transaction, and no version rows: the declared write of
  catalogue.product_version (CR-544''s "versions") is removed, and no catalogue.price_list_version is written. A dry run,
  a skip, an unchanged amount and a refused run write no entry. setPrices follows the same rule. Covers CR-558, closed
  as superseded by CR-580: nothing is built from CR-558.'
decision:
  what: 'ADAM CR-580, posted on #30970: "Decided (Chinmay, 3 November 2026): a bulk price change is recorded in
    Catalogue''s audit, one entry per changed price, and writes no version rows. CR-558 is closed as superseded by this
    decision. Build now on #30970: (1) A real run that changes prices writes, in the same transaction as the
    catalogue.price updates, one catalogue.audit_entry per changed price through the shared AuditEntries.InsertAsync
    ... (2) Write no catalogue.product_version row ... (3) Write no catalogue.price_list_version row ... (4) A dry run,
    a skipped product, a price whose new amount equals the old one, and a refused run (400 or 403) write no audit
    entry. (5) setPrices (#28021) follows the same rule when built ... The contract''s writes entry naming
    catalogue.product_version for this operation is removed when the package catches up." ADAM CR-558, posted on
    #30970: "this request is closed as superseded by CR-580 ... Build now: nothing from this request ... Do not use the
    kernel''s IAuditTrail or platform.audit_record for this operation". The lead''s instruction, 3 November 2026: "Dont
    hold r13. approve them and rever tto the devs".'
  by: Chinmay
  date: '2026-11-03'
why: 'ADAM CR-580 and CR-558 (Narayan Gaonkar, #30970 bulkChangePrices): CHG-CR544-001 declared writes of
  catalogue.audit_entry and catalogue.product_version for "what setPrices writes: audit entry and versions", but
  setPrices declares neither, and nothing said what a version row holds for a price change. updateProduct already
  defines a product version (CR-214), and its hash leaves prices out.'
keys_touched:
  operations:
  - bulkChangePrices
  - setPrices
  tables:
  - catalogue.audit_entry
  - catalogue.product_version
  - catalogue.price_list_version
  files:
  - contracts/spine/catalogue.yaml
  - handoff/api-data-lineage-overrides.json
  - tools/check-business-rules.py
  other:
  - CR-558 closed as superseded by CR-580 (no change of its own)
  - the carried lineage override for bulkChangePrices drops catalogue.product_version, which kept the write in the
    lineage after the contract stopped declaring it
root_class: a write declared from a word ("versions") another operation does not define
tickets:
  started: []
  unstarted:
  - '30970 (bulkChangePrices, Narayan Gaonkar, On hold): one audit entry per changed price, no version rows, as posted.'
  - '31413 (setPrices, Narayan Gaonkar, New; parent #28021): the same rule when built, now declared on the operation.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-580, CR-558
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-BULK-PRICE-AUDIT
status: open
notes: 'Beyond the posted words, for a follow-up comment if wanted: setPrices now declares its write of
  catalogue.audit_entry (the posted (5) says it "follows the same rule when built"); its ticket is #31413 under the
  #28021 parent the comment names.'
