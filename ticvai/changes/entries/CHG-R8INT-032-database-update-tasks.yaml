notes: 'The local tasks apply the package files with psql, not SqlMigrationRunner: each file records itself in
  platform.schema_version, and setup/backend-patterns.md section 3.4 keeps the package files out of db/tenant. V0108
  alters tables a partial local database may not have; the task says to accept only "does not exist" errors there. The
  walk-fix report names two text columns; handoff/migration-review.md has three (deposit_box_limit_amount on
  platform.workstation and platform.venue_settings, marketing.wishlist_item.list_price): R8-DB-SHARED converts all three. The final refresh of cd646999 generated control V0110 (one index on control.onboarding_application); the
  tasks list it too (same decision and waiver). The upgrade test from r7 (20 October, 22:00) showed the tasks must list every
  migration file since r7: tenant V0103a, V0105a, V0107, V0108, V0109, V0110, V0111 and control V0107, V0108, V0109, V0110
  (V0107 was not in r7; V0110/V0111 came from the final refresh); they now list all eleven and say to apply any file
  platform.schema_version does not list yet, in name order.'
