id: CHG-R8INT-032
date: '2026-10-20'
source: plan
kind: plan
proposed: '2026-10-20T21:30'
summary: 'Eleven Block A tasks bring the databases to r8 in the sprint running now (Sprint 2): R8-DB-LOCAL-<name>, one
  per developer with a local database (1 point each: apply the r8 files V0103a, V0105a, V0108, V0109 to tenant and V0108,
  V0109 to control, check the renamed tables, or close it as not needed when the local database has none of the tables),
  and R8-DB-SHARED for Hrushikant Patkar (3 points: back up, apply the same files to the shared tenant and control
  databases, convert the three text money columns to numeric(18,4)). A hand-written task may now say it is `due` on a
  date: the schedule places it there, holding no slot, so it lands in that sprint and no other task moves.'
decision:
  what: 'docs/active/block-a-extra-tasks.json: R8-DB-LOCAL-PRANAY-SHINDE, -NARAYAN-GAONKAR, -DEEP-KHANVILKAR,
    -PALLAVI-SAWANT, -SANKET-KELUSKAR, -CHINMAY-PATKAR, -CHITRANGI-MESTRY, -PRADNYA-YERAM, -SURENDRA, -KALPITA-MEJARI and
    R8-DB-SHARED (epic PLATFORM, due 2026-10-21, `builds` the six migration files as `file` links); the `due` field in
    the note. tools/sprint_plan.py due_of and schedule (a due task sits at its date and holds no slot; pace_model leaves
    it out), tools/build-service-docs.py (no module test, no load) and tools/derive-block-a-schedule.py read it; test
    tools/tests/test_block_a_schedule_due.py.'
  by: Chinmay
  date: '2026-10-20'
waivers:
  cooling_off: {by: Chinmay, date: '2026-10-20', quote: 'waive the database tasks'}
why: 'The lead, 20 October 2026 evening: "Currently all the devs are runnning a local db version can we add them to the
  tickets to update them if not than they can close the ticket. hrusikant is also running the live version we can ask
  them in tickets to directly make updates to the db ?" r8 adds forward migrations (tenant V0103a, V0105a, V0108, V0109;
  control V0108, V0109: 19 tables renamed or moved, 20 column renames, new columns and widened CHECKs; CHG-R8WFM-001,
  5d82da84) that no developer database has. The schedule had no way to put a hand-written task in the sprint running now: it times every task from
  5 October in build order, so a new task landed wherever its owner was next free. Holding a slot on 21 October moved 613
  other tasks'' sprints (a ten-day task crossing it had to start after it); holding none moves 0.'
