source: audit
kind: spec
summary: 'Eleven operation purposes on POS and staff-app screens that were the operationId or the template "Add
  something" now say what the call is for on that screen.'
decision:
  what: 'screens/P04-point-of-sale.yaml (POS-001 getWorkstationHealth and listDenominations, POS-002, POS-021 and
    POS-023 addCartLine, POS-007 listDenominations, POS-011 listSerialisedItems) and screens/P06-staff-app.yaml
    (EMP-065 logColdChain, EMP-067 logTemperature and signCorrectiveAction, EMP-069 listSerialisedItems): `apis[].purpose`
    written from the contract summary and the screen''s use of it. Invisible metadata; nothing on the screen changes.'
  by: Chinmay
  date: '2026-10-14'
why: 'Audit finding, Block A audit before r6 (docs/active/audit/audit-1014/classes.json): check-screen-wiring
  S-PURPOSE-TEMPLATE (R260) had 11 members on P04 and P06, 0 after. Ruling (the lead, 14 October 2026, "go with
  your recommendation"): each api purpose says what the call is for (from the contract summary). addCartLine''s own
  contract summary is "Add something", so its three purposes say what each sale screen puts in the cart.'
