id: CHG-ADM-006
date: '2026-10-18'
source: audit
kind: process
summary: A pull lists the ticket's sub-tasks at every depth with status and holder and names a sub-task's parent; the
  board says when sub-tasks could not be read; /ticket with no number starts the first ticket the developer can
  finish or its first open sub-task of theirs; a frontend session opened in an app's folder is told to open the
  workspace folder.
decision:
  what: viewer/api/openproject.py descendants (a parent filter per level with every status, each ticket's children
    links when the filter is refused); /api/work-packages/{key} answers subtasks and partOf, read for the ticket and
    never from the held project read; /api/board/mine answers subtasksKnown and startHere; the connector's README.md
    has "Sub-tasks (n)" and "Part of", adam_board shows ? with a note and hands on startHere; /ticket, /board and both
    CLAUDE.md starters use startHere; the frontend CLAUDE.md says "open the workspace folder".
  by: Chinmay
  date: '2026-10-18'
why: 'Finding of the 18 October live pull on ADAM (items 1 and 17 of the 18 October list): pulling #27735 gave no list of
  its sub-tasks #30681-#30684, pulling #30681 did not name #27735, the board filled sub-tasks from the held project read
  and returned none when that read failed, /ticket with no number made agents ask for one, and frontend developers who
  opened Claude Code in an app clone had no ADAM tools. Builds on CHG-ADM-004 (the next workable ticket).'
keys_touched:
  files:
  - ../viewer/api/openproject.py
  - ../viewer/api/main.py
  - ../viewer/mcp/tools.mjs
  - ../viewer/mcp/server.mjs
  - ../viewer/mcp/setup/starters/backend/.claude/commands/ticket.md
  - ../viewer/mcp/setup/starters/frontend/.claude/commands/ticket.md
  - ../viewer/mcp/setup/starters/backend/.claude/commands/board.md
  - ../viewer/mcp/setup/starters/frontend/.claude/commands/board.md
  - ../viewer/mcp/setup/starters/backend/CLAUDE.md
  - ../viewer/mcp/setup/starters/frontend/CLAUDE.md
  - tools/check-adam-subtasks.py
root_class: A00 TOOLING
tickets:
  started: []
  unstarted: []
release_tag: r7
decision_owner: Chinmay
triage: fix-forward
prevention:
  type: check
  ref: check-adam-subtasks::ST-PULL
status: open
adam_cr: pending (raised at the next settlement)
notes: Takes effect on ADAM after its deploy and, for developers, after /update-adam and a restart of Claude Code.
  Existing workspaces keep their old /ticket, /board and CLAUDE.md until refreshed (lane A ship step); the
  connector's instructions and adam_pull's whole-board answer carry startHere meanwhile. The lead registers
  tools/check-adam-subtasks.py in run-checks.py after the merge and closes this entry on that commit.
