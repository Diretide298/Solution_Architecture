    recordConsentAnswers here.'
  - '28236 ([FE] GST-009 Review & Payment, Chitrangi Mestry, New): the consent pop-up on Pay''s 422 and
    recordConsentAnswers.'
  - '31899 ([FE] WEB-012 connect to API, Chinmay Patkar, New): recordConsentAnswers after the pop-up, then checkoutCart
    again.'
release_tag: pending
