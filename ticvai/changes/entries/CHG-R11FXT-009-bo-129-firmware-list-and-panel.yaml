    operations are unchanged and BO-129 now shows them (the list and the picked release). Told through the lead''s
    comment; their text is not rewritten.'
  unstarted:
  - 'VM-BO-129 and APP-SETUP-BO-129-REST, and createDeviceFirmware''s ticket, pick the list, panel and form up at the
    next tag.'
release_tag: pending
