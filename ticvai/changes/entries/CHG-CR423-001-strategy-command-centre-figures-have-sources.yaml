notes: 'STOPPED on one bullet, "automationMode is retired (CR-417). The row answers automationLevel from the most
  specific dynamic_pricing_control covering the strategy ..., or advisory where there is none. The filter is
  automationLevel.": the approved ADM-088 detail panel (handoff/approved-ui.json, region:selection) binds
  DynamicPricingStrategyCommandCenterView.automationMode, so retiring the member changes what an approved screen shows,
  which a package fix may not do. The view keeps automationMode and its filter as they were until the lead posts a
  follow-up (for example, approve the panel''s column change, or keep the member). Named beyond the posted words: the
  operationalAlerts codes are described as conditions (pricesAtMaximumGuardrail above 0, open conflicts, a strategy
  activating within 48 hours) only by their names; no enum is added to the response.'
