notes: 'The automationMode bullet was first stopped because the approved ADM-088 detail panel bound the member; the
  lead decided it on 31 October 2026 ("Panel shows the level"), recorded in docs/active/approved-ui-changes.yaml. The
  label "Automation level" is the bound member''s name as the screens render it. Named beyond the posted words: the
