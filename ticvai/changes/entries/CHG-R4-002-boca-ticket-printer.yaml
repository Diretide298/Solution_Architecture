notes: 'Batch R4, 5 October 2026. check-device-tiers starts with a baseline (handoff/audit-baseline.json) of the eight
  ADR-0015 Tier A classes no task builds yet: receipt printer, cash drawer, customer / line display, barcode scanner,
  magnetic stripe reader, POS peripheral abstraction, mobile printer, access reader to controller. Each leaves the
  baseline when a task names it (`deviceClasses`) or the lead records a deferral (`deviceClassesDeferred`); a new
