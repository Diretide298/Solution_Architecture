summary: 'Bound for WEB-048 and GST-075: the venue''s start-time step (VenueSettings.stepMinutes, which
  listProductStartTimes applies when the screen sends none) and the length saving (ProductVariant.referencePrice, set by
  updateProductVariant, and the server''s savingPercent; a tile shows Save n% only when it is set). Dropped from the
  client-approved frame, logged in approved-ui-changes.yaml: the per-date price dots and the pre-cart Subtotal / VAT /
  Total.'
decision:
  what: 'ADAM CR-253, option C, as recommended. contracts/spine/tenancy.yaml VenueSettings.stepMinutes;
    contracts/satellite/resources.yaml listProductStartTimes (the venue''s step when none is sent, read in process
    through tenancy#venueSettingsRecords; stepMinutes parameter text); contracts/spine/catalogue.yaml
    ProductVariant.referencePrice and savingPercent, updateProductVariant''s body and text;
    docs/active/cross-deployable-writes.yaml XDR-004 names listProductStartTimes; screens WEB-048 and GST-075 notes and
    purposes; docs/active/approved-ui-changes.yaml, one entry per screen for the dropped frame content.'
  by: Chinmay
  date: '2026-10-26'
why: 'ADAM CR-253 (Chinmay Patkar, #28149 WEB-048), accepted by the lead on 26 October 2026 ("Accept all
  (Recommended)", "Comment now + in r10"): the client frame showed four things no bound operation gave.'
