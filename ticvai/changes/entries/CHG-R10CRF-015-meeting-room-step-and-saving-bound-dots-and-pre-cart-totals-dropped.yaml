notes: 'Database: platform.venue_settings gains step_minutes integer (CHECK 15, 30 or 60; null inherits the tenant
  default) and catalogue.variant gains reference_price numeric(18,4) (forward migration; MIG tasks for tenancy and
  catalogue). One reading made: a guest has no read of venue settings (getVenueSettings is staff only), so the screens
  do not read stepMinutes themselves; listProductStartTimes applies it when stepMinutes is not sent. savingPercent is
  rounded down (proposed, client to correct). The screen records never drew the dots or the totals, so their approved
  fields are unchanged and check-approved-ui notes the two log entries as already held.'
