triage: blocker
prevention:
  type: check
  ref: tools/check-ticket-builds.py
status: open
notes: 'Prevention: check-ticket-builds B-KERNEL-STORAGE (KERNEL_NEEDS: each kernel ticket''s table, column, index,
  grant, contract field or file), read from the contracts as well as the schema reference so it holds before the
  release derive. Shown failing on r6 (8 new) and passing after. Also held: check-cross-deployable-writes X-KERNEL
  now requires the counter grant. Sibling query: the KERNEL_NEEDS list is the class; PLATFORM-MIGRATE''s resume is
  class 12 (CHG-CRA-006). Database (derived at the release; this branch''s derive in
  D:\wt\fix-cr-answers-1018-derived\class15, written then as V0105; r7 has since taken V0105, so the release derive
  numbers this branch''s forward migrations, V0106 at the round-2 derive and contested at merge): the control
  migration adds control.outbox and cell_tenant.root_scope_path (added nullable; the review row says backfill then SET
  NOT NULL); the tenant migration adds platform.outbox_sequence (scope policy), platform.outbox.occurred_at (added
  nullable; backfill from created_at, then NOT NULL) and
  outbox_aggregate_id_sequence_idx. provision-tenant.sh (derived) creates the root node. For the lead: register
  `python3 tools/derive-release-flags.py` in tools/refresh.sh after build-service-docs (lane C''s file; until then run
  it by hand after a plan change; --check says when it is stale), and the mirror copy to ticvai-backend
  tools/release-flags/. The existing provision-tenant.sh INSERT into control.cell_tenant names no instance_id, which
  CellTenant requires; not changed here. DB-ROLES'' ticket text is a started-ticket comment, not a rewrite.
  **Decided: option (a), by Chinmay Parab on 19 October 2026 (ADAM CR-172, answered the same day).** ADM-005, the
  client-approved Tenant Directory, had nothing that supplied an approvalRequestId, so the round-1 check would have
  refused every suspend and reactivate from it. Now suspendTenant and reactivateTenant take no approvalRequestId
  and never answer 409 approval-required: after their own refusals (tenant-already-suspended, tenant-not-active,
  tenant-terminated, tenant-not-suspended) each raises its approval request through createApprovalRequest
  (x-ticvai-write-via; kind configurationChange, subjectContract subscription, subjectType tenant, subjectId the
  tenant, attributes.action suspend or reactivate) and answers 202 with the request id (TenantChangeRequested);
  Subscription''s approval.granted consumer applies the change (and writes tenant.suspended to control.outbox), and
  approval.rejected leaves the tenant unchanged. ADM-005 is not changed. r7 never carried the round-1 check.

  **Fix round 3 (lane-H review 2; the lead''s rulings of 19 October 2026).** I-1, the grant made buildable the way
  publishTenantConfig''s review is: white-label''s consumer learns what to apply from the record the call wrote, named
  by the event (and a version that waits is validated again when it falls due). Here the one record the call writes
  is the approval request (I-2), so
  approvals keeps the attributes it is sent (ApprovalRequest.attributes, stored as given; the rules match on them,
  also when a draft is submitted later) and Subscription''s consumer reads them by the event''s requestId through
  approvals#requestRecords (route service, the declared query Subscription already uses for approvals.request). On
  arrival it re-checks the tenant: already in the target state is a recorded no-op; a state that no longer allows the
  change closes the request as not applied with the refusal''s reason (tenant-not-active, tenant-terminated,
  tenant-not-suspended); both are reported on the request''s approved-action execution. A second suspend or reactivate
  while one is open answers 409 open-request-exists with the fields createApprovalRequest''s own 409 declares
  (refusedReason openRequestExists, requestId, currentStatus; TenantChangeConflictProblem), documented on both
  operations. The approver is the tenant''s approval rules for configurationChange narrowed to subject type tenant, as
  publishTenantConfig''s request is routed by the rules for its subject; no role is named. I-2: the two calls''
  lineage writes are approvals.request and cache:idempotency only, and tools/applied/tenant-approval-19-october.py
  removes control.tenant, control.outbox and platform.outbox after a derive; states/tenant.yaml credits active ->
  suspended, suspended -> active and terminating -> active to the consumer (trigger externalEvent, no operation);
  events/tenant-suspended.yaml has no emittedBy (it names operations only, and no operation writes the event). I-3:
  ADM-005 does not change visibly; after the 202 the row keeps its current status until the grant applies, and no
  contract text promises a pending state. M-1: BC-373 records the 200 -> 202 (Chinmay Parab, 19 October 2026, CR-172
  option a). M-2: check-states rule 16 (no approvalRequestId, no approval-required, the createApprovalRequest route, a
  202 with the request id) with self-tests, and rule 15 forbids the two operations on any tenant edge; rule 16 finds 6
  on r7 and rule 15 finds 5 on 1c1af276, 0 after. Database: approvals.request gains attributes (jsonb, nullable) at
  the release derive (check-contract-storage ST-FIELD-NO-COLUMN until then). Not changed: states/cell.yaml''s two
  cascades still name suspendTenant and reactivateTenant (a check-states warning; outside the entries the review
  named, and another r8 lane edits the state models).'
