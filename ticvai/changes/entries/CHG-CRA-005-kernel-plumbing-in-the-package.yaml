prevention:
  type: check
  ref: tools/check-ticket-builds.py
status: open
notes: 'Prevention: check-ticket-builds B-KERNEL-STORAGE (KERNEL_NEEDS: each kernel ticket''s table, column, index,
  grant, contract field or file), read from the contracts as well as the schema reference so it holds before the
  release derive. Shown failing on r6 (8 new) and passing after. Also held: check-cross-deployable-writes X-KERNEL
  now requires the counter grant. Sibling query: the KERNEL_NEEDS list is the class; PLATFORM-MIGRATE''s resume is
  class 12 (CHG-CRA-006). Database (derived at the release; this branch''s derive in
  D:\wt\fix-cr-answers-1018-derived\class15, written then as V0105; r7 has since taken V0105, so the release derive
  numbers this branch''s forward migration, V0106 at the round-2 derive and contested at merge): the control
  migration adds control.outbox and cell_tenant.root_scope_path (added nullable; the review row says backfill then SET
  NOT NULL); the tenant migration adds platform.outbox_sequence (scope policy), platform.outbox.occurred_at (added nullable; backfill from created_at, then NOT NULL) and
  outbox_aggregate_id_sequence_idx. provision-tenant.sh (derived) creates the root node. For the lead: register
  `python3 tools/derive-release-flags.py` in tools/refresh.sh after build-service-docs (lane C''s file; until then run
  it by hand after a plan change; --check says when it is stale), and the mirror copy to ticvai-backend
  tools/release-flags/. The existing provision-tenant.sh INSERT into control.cell_tenant names no instance_id, which
  CellTenant requires; not changed here. DB-ROLES'' ticket text is a started-ticket comment, not a rewrite.
  **Decided: option (a), by Chinmay Parab on 19 October 2026 (ADAM CR-172, answered the same day).** ADM-005, the
  client-approved Tenant Directory, had nothing that supplied an approvalRequestId, so the round-1 check would have
  refused every suspend and reactivate from it. Now suspendTenant and reactivateTenant take no approvalRequestId
  and never answer 409 approval-required: after their own refusals (tenant-already-suspended, tenant-not-active,
  tenant-terminated, tenant-not-suspended) each raises its approval request through createApprovalRequest
  (x-ticvai-write-via; kind configurationChange, subjectContract subscription, subjectType tenant, subjectId the
  tenant, attributes.action suspend or reactivate) and answers 202 with the request id (TenantChangeRequested);
  Subscription''s approval.granted consumer applies the change (and writes tenant.suspended to control.outbox), and
  approval.rejected leaves the tenant unchanged. ADM-005 is not changed. r7 never carried the round-1 check.
  **Fix round 3 (lane-H review 2, the lead''s rulings of 19 October 2026).** I-1, the grant made buildable as
  publishTenantConfig''s is: the consumer acts on subjectContract subscription and subjectType tenant and learns what
  to apply from the record the call wrote. publishTenantConfig''s call writes its pending version and the consumer
  reads it from its own table; here the call writes only the approval request (I-2), so the request keeps its
  attributes (approvals ApprovalRequest.attributes, stored as sent: the rules match on them too, also when a draft is
  submitted later) and the consumer reads them back by requestId through approvals#requestRecords (route service, the
  declared query Subscription already uses). The consumer re-checks the tenant on arrival: already in the target
  state is a no-op, recorded; a state that no longer allows the change closes the request as not applied with the
  refusal''s reason; both reported on the request''s approved-action execution. A second suspend or reactivate while
  one is open answers 409 open-request-exists with the open approvalRequestId (TenantChangeConflictProblem), the
  createApprovalRequest refusal passed through, not the retired approval-required. The approver is the tenant''s
  approval rules for configurationChange narrowed to subject type tenant, at the tenant''s root scope path; no role is
  named. I-2: the two calls'' lineage writes are approvals.request and cache:idempotency only
  (tools/applied/tenant-approval-19-october.py removes control.tenant, control.outbox and platform.outbox after the
  derive); states/tenant.yaml credits active -> suspended, suspended -> active and terminating -> active to the
  consumer (trigger externalEvent, no operation), states/cell.yaml''s two cascades no longer name the operations, and
  events/tenant-suspended.yaml names no emitter (no operation writes it). I-3: ADM-005 does not change visibly; after
  the 202 the row keeps its current status until the grant applies, and no contract text promises a pending state.
  Database: approvals.request gains attributes (jsonb, nullable) at the release derive (check-contract-storage
  ST-FIELD-NO-COLUMN until then).'
