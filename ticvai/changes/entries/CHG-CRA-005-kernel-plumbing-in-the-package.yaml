  started:
  - 'TEST-AM-FOUNDATION-DATABASE (27686, On hold): new control.outbox, platform.outbox_sequence, columns'
  unstarted:
  - 'Finished (a child task each, for its owner): DB-ROLES (27655: the counter grant), MIG-CONTROL and
    MIG-CONTROL#control.cell_tenant (root_scope_path), MIG-PLATFORM and MIG-PLATFORM#platform.outbox (occurred_at, the
    index), MIG-PARTITIONS (the counter survives partitions). The kernel tickets PLATFORM-OUTBOX (27697),
    PLATFORM-KERNEL (27692), PLATFORM-FLAGS (27695) and the suspendTenant and reactivateTenant tickets are New in the
    r6 cache but their developers raised these CRs: the settlement comments reach their agents. 353 New in all.'
