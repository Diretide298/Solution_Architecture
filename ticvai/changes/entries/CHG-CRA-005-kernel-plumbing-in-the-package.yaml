id: CHG-CRA-005
date: '2026-10-18'
source: cr
kind: contract
summary: 'What the kernel tickets build now has its storage in the package: a control-database outbox for
  tenant.suspended; suspendTenant and reactivateTenant raise their own approval request, answer 202 with it and write
  nothing else, and Subscription''s approval.granted consumer re-checks the tenant and applies the change (CR-152,
  CR-172 option (a)); a timer for a future suspension and the full set of reactivate refusals (CR-152); control.cell_tenant.root_scope_path written at provisioning (CR-163);
  TenantAppStatus.darkAppModules and a generated app-module map, handoff/release-flags.json (CR-164); the outbox''s
  occurred_at, its (aggregate_id, sequence) index and a per-aggregate counter every host may use, with ADR-0057 and
  ADR-0058 amended (CR-166). A check now names each kernel ticket''s storage and fails when one goes missing.'
decision:
  what: 'Published answers of 18 October 2026 (decisions-final.json): CR-152 1a, 2a, 3a and 4; CR-163 option A; CR-164
    option A; CR-166 option A. platform-ops.yaml: OutboxEntry.occurredAt (required) and x-ticvai-index
    [[aggregateId, sequence]]; OutboxSequence -> platform.outbox_sequence (aggregate_id key, last_sequence bigint, the
    aggregate''s scope_path); ControlOutboxEntry -> control.outbox. subscription.yaml: suspendTenant and
    reactivateTenant raise their own approval request and answer 202 (CR-172, fix round 2), a future effectiveAt is pending and a
    workers job applies it, reactivate refuses tenant-not-suspended and cancels a pending suspension, terminating ->
    active described; CellTenant.rootScopePath. states/tenant.yaml: the timer transition. events/tenant-suspended.yaml:
    written to control.outbox, by the call or the job. white-label.yaml: TenantAppStatus.darkAppModules. New
    tools/derive-release-flags.py writes handoff/release-flags.json (306 app-modules, 2,550 operations, 1,388 bound by
    more than one, each screen''s operations included; corrected in fix round 1 from 2,544 and 1,099, when the
    generator read no screen). tools/derive-ddl.py: provision-tenant.sh creates the tenant''s root scope node and records its
    path in control.cell_tenant. docs/active/cross-deployable-writes.yaml and check-cross-deployable-writes: the
    counter is the fifth kernel grant (SELECT, INSERT, UPDATE), which DB-ROLES creates. ADR-0057 (dead letters written
    directly by the consumer wrapper; the counter) and ADR-0058 (the control outbox; the counter) amended.'
  by: Chinmay
  date: '2026-10-18'
why: 'ADAM CR-152 (Narayan Gaonkar, #27775), CR-163 (#27692), CR-164 (#27695) and CR-166 (#27697), Hrushikant Patkar
  for the last three, accepted 18 October 2026; class 15 of the 18 October triage ("platform plumbing the kernel needs
  is not in the package"). Finding: the kernel tickets named mechanisms (outbox, fan-out, release flags) and nothing
  checked that the package held the tables and fields they need.'
