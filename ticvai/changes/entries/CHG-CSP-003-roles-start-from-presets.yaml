source: client-review
kind: contract
summary: 'No fixed default roles: the seeded role sets become editable presets (per-module All, Viewer, Mid-level and five
  starting configurations); a role is created from presets, keeps an editable checklist and can be renamed.'
decision:
  what: createRole takes presetCodes and permissions (copied, never bound); Role.presetCode records the start; new updateRole
    renames a role; CapabilityTemplate gains module, presetLevel and isPreset; listCapabilityTemplates filters by module;
    listRoles, Role.isSystem and setRolePermissions describe roles as preset configurations. AI release promotion goes to
    the holder of the module permission.
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026, batch 1 (ADM-554, workbook Q7): "There are no default roles. When a role is created, the
  permissions are a checklist, with presets (all permissions, viewer, mid-level) but fully selectable", and the pre-apply
  round: "Default permission configs, so to speak ... they can still give that viewer more permissions and rename it." ADR-0051
  (AI-D16) for promotion; audit R229 for the five seeded sets. Decision ledger: DEC-007 (workbook Q7).'
