id: CHG-FIN-010
date: '2026-10-02'
source: mom
kind: contract
summary: 'Takings is defined as money taken less money paid back, by tender, VAT included: a cash-control measure,
  the hidden half of the blind count, never revenue.'
decision:
  what: Define the takings KPI and metric (captured payments less completed refunds in the period, by tender, workstation
    or shift); for a shift, float + cash takings + float entries - lifts is the expected drawer the cashier never
    sees; takings never feeds a revenue tile.
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 Oct 2026: takings is about cash-drawer integrity, the risk that a cashier who sees the expected
  amount pockets the surplus. The minutes confirm the meaning without using the word: MoM 9 Sep 2026 4.18 (Qossai:
  many venues never show the cashier the expected sales total; "if a cashier knew they had a small surplus, they
  could pocket it while still reconciling their own count as balanced"; DI-806, DI-802 to DI-804); MoM 12 Aug 2026
  section 19-20 (DI-271 blind cash-out; DI-275 expected AED 8,480 vs deposited AED 8,460). "Takings" itself is the
  package''s word, from audit R283 (hub tiles), whose definition contradicted itself ("gross value of payments"
  vs "payments less refunds"; BO-100 correction). No MoM uses "takings".'
