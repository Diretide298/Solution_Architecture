id: CHG-DDL-005
date: '2026-10-14'
source: developer
kind: contract
summary: 'orders.refund.tax_reversal_entry_id is a declared key to ledger.journal_entry, the entry reverseJournalEntry
  posts, not a convention index into queue.entry.'
decision:
  what: 'contracts/spine/orders.yaml Refund.taxReversalEntryId `x-ticvai-references: ledger.journal_entry`. 900 gains
    refund_tax_reversal_entry_id_fkey; the index stays (now "declared"); the lineage and relationship graph stop
    recording a refund-to-queue reference.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-070 (MIG-ORDERS, #27675). Audit: TRUE. 910-indexes.sql:1912-1913 "convention, not declared:
  orders.refund.tax_reversal_entry_id -> queue.entry": the name rule matched entry_id to queue.entry. The field''s own
  description (orders.yaml Refund.taxReversalEntryId) says the refund reverses the tax entry it created through
  reverseJournalEntry, which creates a ledger.journal_entry (finance.yaml reverseJournalEntry); its sibling
  refund.ledger_entry_id already points at ledger.journal_entry. Orders and Ledger are both in the commerce deployable
  (service-decomposition.json), as orders.invitation -> ledger.cost_center is already a declared key. Same class found:
  check-storage-promises SP-KEY-GUESSED lists ten more name-rule guesses into another module (e.g.
  rental.booking.deposit_authorisation_id -> games.authorisation, approvals.workflow_instance.current_node_id ->
  access.edge_node), baselined for their owners.'
