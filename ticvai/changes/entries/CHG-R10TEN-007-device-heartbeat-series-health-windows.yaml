  ref: tools/check-states.py
status: open
notes: 'Database: tenancy.device_telemetry gains sync_backlog integer and error_count integer (migration work for Hrushikant
  Patkar, MIG-TENANCY). The sync-backlog cap (100) and the 7-day unknown window are proposed defaults the client can correct.
  lastSeenLocation stays unset: the decision adds no location to the heartbeat.'
