id: CHG-RCR31-001
date: '2026-11-02'
source: audit
kind: spec
summary: 'The identity decisions reach the sign-in and role screens where they can without changing an approved
  screen. EMP-002''s role cards show the grant''s venue (RoleSummary.scope.name) and its Select role form sends the
  picked card''s roleId and grantId; POS-001''s Select role form sends grantId too (IDENTITY-C45, CHG-R8SPN-032).
  SCN-001''s PIN note says the PIN is the credential and a badge fills the username with method card or rfid
  (IDENTITY-C36). New check-screen-decisions holds both (SD-GRANT, SD-BADGE).'
decision:
  what: 'The lead, 2 November 2026, on the root-cause re-check: fix the mechanical roots in parallel with the r13 build
    lanes ("lets see if we can do something in parallel"; "yes"). Root R31. The card''s venue is the lead''s own
    decision of 20 October 2026 (IDENTITY-C45: "a role held at two venues shows two cards"; CHG-R8SPN-032: "the card
    gains the venue name"), logged in approved-ui-changes.yaml. Left for the lead: SCN-001''s role list, EMP-001''s
    Choose venue and role, and the offline sign-in texts of POS-000, EMP-001 and SCN-001 (visible text whose wording
    waits on the client, IDENTITY-C01).'
  by: Chinmay
  date: '2026-11-02'
why: 'Review root R31 of the Block A developer pull (findings 6.27755.1, 6.27761.1, 6.27761.3, 6.27758.1, 6.27758.3,
