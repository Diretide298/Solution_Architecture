  carried into the screens (CHG-R8SPN-032 left them to "the surface lane" and closed). Tickets: #27761
  APP-SCANNER-SCN-001 (blocked), #27755 APP-STAFF-EMP-002, #27758 APP-STAFF-EMP-001, #27767 APP-POS-POS-000.'
