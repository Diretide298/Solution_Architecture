id: CHG-CR419-001
date: '2026-10-31'
source: cr
kind: contract
summary: 'simulatePriceBreakdownCalculation states its rule: no singleton (it stores nothing; the Idempotency-Key
  stays); optional productVariantId (400 validation); the selected rate by searchCatalogue''s fromPrice resolution at date
  (422 no-selected-rate); the steps of the venue''s active default calculation profile in force (422
  no-calculation-profile; calculationVersion its code and version); membershipId a membership programme whose pricing
  rules choose the rate; customerId not read; the live dynamic price (CR-422) at the dynamic step; promotionCode to
  evaluatePromotions without orderId; tax through finance#taxCodeRecords; rounding with a rounding line; aiInsights
  empty (LO-CR419-001); channelComparison the same rule per channel. check-contract-shapes C-NO-ADDRESS no longer asks
  an operation the lineage marks pure.'
decision:
  what: 'ADAM CR-419, posted 31 October 2026 on #35288: "Decided (Chinmay, 31 October 2026): as you recommended, with
    each read named. Drop x-ticvai-singleton, because a simulation stores nothing. The Idempotency-Key stays. Add
    optional productVariantId ... Either failure is 400 validation on productVariantId. Selected rate: the price that
    searchCatalogue''s fromPrice resolution gives the variant at venueId on channel, taken at date (and timeslotId)
    instead of now. No such price is 422 no-selected-rate. Sequence: the steps, in sequence order, of the venue''s
    active isDefault calculation profile in force on date. No such profile is 422 no-calculation-profile. ... Tax: the
    tax_profile''s taxCodeId is read through finance#taxCodeRecords, in process (it exists since CR-110), with the tax
    base each catalogue.tax_rule sets. ... aiInsights answers an empty list until an AI producer exists.
    channelComparison runs the same rule for each channel asked." Built into r12 on the lead''s instruction of 31
    October 2026: "Include them in r12".'
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM CR-419 (Hrushikant Patkar, #35288, blocking): the simulation named inputs and a trace but no rule between
  them, took productId though prices are per variant, and carried x-ticvai-singleton beside "a simulation never
  creates an order". The tax read exists (finance#taxCodeRecords since CR-110), and the rest of the rule is already
  in the package (the fromPrice resolution of CR-270 and CR-358, the calculation profile''s steps, the membership
  pricing rules, evaluatePromotions without orderId).'
keys_touched:
