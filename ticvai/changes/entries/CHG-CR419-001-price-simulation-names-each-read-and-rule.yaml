notes: 'check-contract-shapes C-NO-ADDRESS required every PUT with no path key to be a singleton or body-keyed, which
  is why the simulation carried a false singleton flag. The rule now prints and does not ask an operation the lineage
  marks pure (it computes and writes no table); simulatePriceBreakdownCalculation is the only PUT so marked. A
