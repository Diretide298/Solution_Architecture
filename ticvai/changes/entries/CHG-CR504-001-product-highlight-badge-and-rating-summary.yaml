notes: '**Design change: none to the frame.** WEB-005 keeps the client-verified frame; its screen record gains a "Ticket
  cards" component on listProducts binding Product.highlightBadge and Product.rating, which the frame already draws, recorded
  in docs/active/approved-ui-changes.yaml against CR-504. Beyond the posted words: rating.average carries multipleOf 0.1
  for "one decimal". The rating''s source is still the lead''s question (the draft''s options a, b, c).'
