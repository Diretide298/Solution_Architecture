status: open
notes: 'Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception".


  PREVENTION: tools/check-error-sources.py (already registered in run-checks.py by CHG-GDL-001) gains two rules over any
  x-ticvai-queries entry that declares the states it counts and the projection that answers it:

  - E-STUCK: every blocking state has a timer or job exit, or waitsOnActor says why only a person may end it.

  - E-UNFED fails on three things. (a) A feed event is not catalogued, or has no consumer of the projecting context
  that writes the projection table. (b) A transition into or out of the blocking set does not emit a feed (directly or
  through its operation''s emittedBy) and is not listed in exitsWithoutEvent with a reason. (c) An operation writes the
  source table and touches pii.* (whose record it is) without emitting a feed.

  Both queries now carry those blocks: orders states/order.yaml blocking pending, held, partiallyPaid, paid; access
  states/entitlement-status.yaml blocking issued, partiallyConsumed, with five exits listed and their reasons.

  Run on the parent commit 2623c6d8 (CHG-GDL-001/002; states/order.yaml, identity.yaml and the lineage restored from
  it, order-linkedToGuest.yaml removed, the new check and query blocks kept), it FAILS three ways: E-STUCK on
  orders#openOrdersForSubject|pending; E-UNFED on the feed order.linkedToGuest not being catalogued; E-UNFED on writer
  linkGuestCheckout. On this branch it PASSES.

  Baselined, pre-existing: E-UNFED orders#openOrdersForSubject|writer|setCustomerGuestAccount. This is a drafted
  BO-309 operation whose lineage writes orders.sales_order and reads pii.subject. If it really reassigns an order''s
  customer it needs the same event. That is for whoever specifies it (its request schema says no table stores its
  fields).

  Why a check in check-error-sources, not check-states: a state with no timer exit is normal in most models (a draft
  waits for its author). It is a defect only when a refusal waits on it, and only the query knows which states it
  counts. A general "non-terminal state without an exit" rule already exists as check-states rule 3 (a state that
  cannot reach a terminal one), and pending passed it.


  The structured states/projection keys go beyond the r6 x-ticvai-queries shape (module, inputs, returns, rule,
  served). Batch GEN''s query validation must allow them, or the two must agree on a home for them at the merge.

  CONTRACT COMPATIBILITY: x-ticvai-emits on linkGuestCheckout was dropped because check-contract-compat counts a changed
  x-ticvai-emits as breaking. The emit is declared in the event''s emittedBy, which W-OUTBOX and E-UNFED read.
  SubjectHolding.subjectId becoming nullable touches only a never-returned schema added in r6.

  [DB] The forward migration derive-ddl writes at the gate now holds the foreign key and index on subject_id beside the
  table, the unique index and apply_subject_rls. A row with no subject is seen only by a tenant-root session, which is
  how the consumers run.

  TICKETS: the pending and held timers are run by the orders hold-expiry job, and holdOrder gains the heldUntil
  default. I did not check whether the tickets that build them (holdOrder, the hold-expiry job, linkGuestCheckout) have
  started. An unstarted ticket picks this up at r6 through its pointer body; a started one needs a comment and a linked
  delta (ticvai/CLAUDE.md rule 6).'
