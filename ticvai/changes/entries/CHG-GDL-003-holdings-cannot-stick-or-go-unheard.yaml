id: CHG-GDL-003
date: '2026-10-14'
source: developer
kind: contract
summary: 'Nothing a guest holds can block their erasure for ever or change hands unheard: a pending order lapses when its
  payment window passes and a parked sale without holdUntil lapses at the business-day cut-off (both emit order.lapsed),
  linkGuestCheckout announces every order it attaches as order.linkedToGuest, which Identity''s projection consumes,
  and identity.subject_holding.subject_id is a declared reference, so it is indexed. check-error-sources gains E-STUCK
  and E-UNFED for the class.'
decision:
  what: '(1) states/order.yaml gains pending -> voided (timer, emits order.lapsed) when the payment window passes. The
    window reuses what already holds the order''s capacity: the latest expiresAt of the holds checkout carried over
    (ReservationHoldPolicy where one matches, else VenueSettings.cartLeaseSeconds, default 900 s, audit R169), or
    createdAt + VenueSettings.cartLeaseSeconds for an order holding no capacity. An order with a live payment link
    lapses at PaymentLink.expiresAt instead. Nothing lapses while a payment is pendingConfirmation. held -> voided
    already had a timer: Order.heldUntil now falls back to the venue''s next business-day cut-off
    (VenueSettings.businessDayCutoff, CHG-R6-032) when holdOrder got no holdUntil. partiallyPaid stays without a timer,
    because the guest''s money was captured and only a person may end it (recorded as waitsOnActor). The two partial-refund
    transitions now emit order.refunded, which its emittedWhen already said. (2) linkGuestCheckout announces each
    attached order as the new event order.linkedToGuest (orderId, subjectId, status), declared in the event''s
    emittedBy, with platform.outbox added to its lineage. Identity''s consumer sets the subject on the order''s
    identity.subject_holding row and on the rows of the entitlements issued from it. order.created and
    entitlement.issued now record guest-checkout orders and their entitlements with no subject yet, so
    SubjectHolding.subjectId is nullable. (4) SubjectHolding.subjectId declares x-ticvai-references: pii.subject. The
    package has no x-ticvai-index; derive-ddl indexes every declared reference, so the forward migration gets
    subject_holding_subject_id_fkey and subject_holding_subject_id_idx. Gap (3), createDsarRequest taking no
    requestId, is deferred by the lead and unchanged.'
  by: Chinmay
  date: '2026-10-14'
why: 'ADAM CR-084, the lead''s follow-up decision of 14 October 2026 on CHG-GDL-001''s open items (a), (b) and the
  index. (a) states/order.yaml had no transition out of pending except createPayment and voidOrder, so an abandoned
  checkout blocked erasure for ever. holdOrder''s holdUntil is optional, so a parked sale could do the same. The
  existing windows are VenueSettings.cartLeaseSeconds (tenancy.yaml, audit R169), ReservationHoldPolicy
  (setReservationHoldPolicy, MoM 1 Sep 4.11: the hold is released when payment is not completed) and
  VenueSettings.businessDayCutoff (CHG-R6-032). (b) linkGuestCheckout wrote orders.sales_order and pii.subject with no
  event (handoff/api-data-lineage.json), so identity.subject_holding never learned that an attached order and its
  tickets belong to the guest. (4) deleteGuestAccount and exportSubjectData look holdings up by subject.'
