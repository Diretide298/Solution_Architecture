  - tools/check-list-order.py
  - tools/applied/order-and-refusals-r10.py
  - tools/tests/test_check_list_order.py
  - tools/tests/test_order_and_refusals_apply.py
root_class: 'a rule nobody wrote: a stated order that is not total (a nullable key, or no order at all)'
