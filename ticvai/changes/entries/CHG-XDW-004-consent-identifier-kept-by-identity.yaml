id: CHG-XDW-004
date: '2026-10-14'
source: audit
kind: contract
summary: 'recordDeviceConsent (Marketing, operations) no longer writes pii.consent_identifier itself: it calls the new
  serviceAuth operation identity recordConsentIdentifier, so Identity, the owner of pii in commerce, keeps the IP
  address and user agent a cookie decision was made from. Exception XDW-016 is removed.'
decision:
  what: 'contracts/spine/identity.yaml adds POST /internal/consent-identifiers recordConsentIdentifier (audience
    service, serviceAuth, x-ticvai-permission null; body ConsentIdentifierCapture: deviceConsentId, ipAddress,
    userAgent, capturedAt, persistence none, landing on pii.consent_identifier; 204, 400, 401). recordDeviceConsent
    in contracts/satellite/marketing-crm.yaml declares x-ticvai-write-via {table: pii.consent_identifier, operation:
    recordConsentIdentifier} and x-ticvai-calls, and its description says Identity writes the row. The table and its
    marketing-crm schema (ConsentCaptureIdentifier) are unchanged. Lineage: recordConsentIdentifier writes
    pii.consent_identifier (tools/applied/xdw-routes-14-october.py). The exception entry is deleted.'
  by: Chinmay
  date: '2026-10-14'
why: 'r6 gate (w609, 14 October 2026): check-cross-deployable-writes X-EXPIRED on XDW-016 (CHG-R6-020, ADAM CR-002,
  removal release r5, tagged), whose reason said it is removed "when Identity publishes that operation and
  recordDeviceConsent calls it". Chinmay asked "Remove them now ?" on 14 October 2026. An event would copy the IP
  address and user agent into platform.outbox, so the route is Identity''s service operation (ADR-0055 rule 4,
  amended 14 October, CHG-GEN-009; ADR-0023 keeps personal data in pii).'
keys_touched:
  operations:
  - recordConsentIdentifier
  - recordDeviceConsent
  tables:
  - pii.consent_identifier
  schemas:
  - ConsentIdentifierCapture
  files:
  - contracts/spine/identity.yaml
  - contracts/satellite/marketing-crm.yaml
  - docs/active/cross-deployable-writes.yaml
  - tools/applied/xdw-routes-14-october.py
  - handoff/api-data-lineage.json
  - handoff/cross-deployable-writes.md
  tickets:
  - DB-ROLES
  other:
  - XDW-016 (removed)
root_class: 'new: write-lineage-gaps'
tickets:
  started:
  - DB-ROLES (#27655, CR-002's ticket, built strict; a comment, never a rewrite)
  unstarted: []
release_tag: r6
decision_owner: Chinmay
adam_cr: pending (raised at the r6 settlement)
triage: blocker
prevention:
  type: check
  ref: tools/check-cross-deployable-writes.py
status: open
notes: 'Batch XDW, 14 October 2026. The lead''s words: asked "Remove them now ?" on 14 October 2026. Released outside
  the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release today as an exception". Prevention is the existing
  check-cross-deployable-writes (X-EXPIRED, X-UNROUTED, X-OPERATION); no new check. Triage blocker because the gate
  fails without it. recordDeviceConsent is anonymous: the call carries the workload''s token and the visitor''s
  Idempotency-Key, never a guest session. Additive against r1. Verified in w609 with the checks listed in
  CHG-XDW-001.'
