summary: '98 POST actions on an item declare a 409 for the wrong state, with a description naming the states it must
  be in and its problem types; 23 are kept (no wrong state exists).'
decision:
  what: 'contracts/*: a `409` with description, `x-ticvai-problem-types` and the shared Problem body on 98 operations,
    the states read from states/*.yaml where a model exists. Kept (legal in every state or answered elsewhere):
    cloneProduct, cloneResource, cloneSeatMap, cloneTicketTemplate, copyPriceList, assessProductChange,
    printTicketProof, replayAiDecision, acknowledgeAnnouncement, markStaffConversationRead, addToWishlist,
    reportBundleApplied, reprintReceipt, amendAttendance, recordSuggestionOutcome, recordWaste, replayDeadLetter,
    saveNaturalLanguageQuery, overrideAiDecision, redeemWaitingGuest, claimTicketTransfer, completeSsoAuthorization,
    recordDeviceHeartbeat.'
