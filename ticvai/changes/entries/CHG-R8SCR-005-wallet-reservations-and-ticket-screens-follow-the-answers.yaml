source: audit
kind: spec
summary: 'Guest wallet, reservation and ticket screens follow the lead''s answers of 20 October, bindings and build
  notes only. GST-011 is built to its definition (no Top up, no exit settlement), and its game card panel opens from
  a deep link with cardCode and cardKind, read on open, as WEB-021''s does (ORDERS-MONEY-C07, option A). WEB-031''s
  resource availability panel reads listProductStartTimes, since a guest never names a resource; Pay now waits for
  the client (ORDERS-MONEY-C08, option A). The navigation the walk found missing on GST-048, GST-045, GST-012, GST-001
  and GST-003, and the Scan a ticket button, are written as build notes and pending client changes; the scan-and-claim
  operation is requested of the core lane (ORDERS-MONEY-C05). WEB-019, WEB-030 and WEB-031 read the guest''s own
  refund requests, resale listings and group bookings in the background, joined onto the rows the approved screens
  already draw (the first round''s CHG-R8SPN-012 bindings were unreached).'
decision:
  what: 'screens/P02-guest-mobile-app.yaml GST-011 (getGameCard onLoad, cardKind entry parameter, purpose and notes),
    GST-001, GST-003, GST-012, GST-045, GST-048 (build notes); screens/P01-guest-web-storefront.yaml WEB-019, WEB-030,
    WEB-031 (listOwn* reads background; WEB-031 listProductStartTimes replaces getResourceAvailability; build note).
    Visible changes are in the lane''s pending list for the client (ORDERS-MONEY-C05, C07, C08).'
