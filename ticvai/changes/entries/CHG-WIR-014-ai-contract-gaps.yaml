  kind (staffing returns a headcount, not people); matching needs a workforce candidate operation.

  - ADM-558: gap: No governance review record. — No operation stores a governance review or its action plan.

  - ADM-556: gap: closeAiIncident lacks impact, control failure and lessons learned. — The post-incident fields
  (impact, control failure, lessons learned) have no field; closeAiIncident takes only rootCause and remediation.'
