summary: 'searchCatalogue: summary is catalogue.product.description, with nameLocalised and summaryLocalised; q matches
  name, description and every language of the two localised maps; the optional channel (as on listProducts) sets the on-sale
  scope and fromPrice; showInfoOnly from the tenant''s current published configuration (white-label#tenantLanguageRecords,
  service) with the venue override laid over, on when absent; the swim rule through marketing#consentQuestionRecords (service),
  once per page; fromPrice by the shared price-list function with declared reads of catalogue.price_list and catalogue.price.
  listProducts declares the same reads for showInfoOnly and the swim rule.'
decision:
  what: 'ADAM CR-533, posted on #31004: "Decided (Chinmay, 3 November 2026): option A, using the reads that already exist.
    Build now on searchCatalogue: (1) summary is the product''s description (catalogue.product.description). Each result
    also carries nameLocalised and summaryLocalised (catalogue.product.name_localised and description_localised); the screen
    shows the guest''s language and falls back to name and summary. q matches case-insensitively against name, description
    and every language value of name_localised and description_localised; every word must match somewhere in them. No summary
    column is added. (2) Add the optional channel query parameter exactly as on listProducts (catalogue Channel; a credential
    names it, a visitor sends web or mobile, absent with no credential web). It sets both the on-sale scope and fromPrice.
    (3) showInfoOnly: declare white-label#tenantLanguageRecords (service) for the tenant''s current ..." The lead''s instruction,
    3 November 2026: "Close the CRs and respond to devs" and "get the NEw CRs in the r13".'
  by: Chinmay
  date: '2026-11-03'
