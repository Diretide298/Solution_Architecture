  ref: tools/check-business-rules.py::BR-DELEGATION-KEY
status: open
notes: 'check-contract-shapes C-NO-ADDRESS and C-BODY-KEY pass with the body key (delegator and delegate are required
  body fields); neither had the operation baselined.'
