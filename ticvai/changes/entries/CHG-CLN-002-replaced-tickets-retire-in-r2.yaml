id: CHG-CLN-002
date: '2026-10-02'
source: cr
kind: plan
summary: The 13 pushed APP-SETUP-ADM tickets of the retired duplicate writers, and their 13 service sub-tasks, leave the plan
  at r2 and are closed with a "replaced by <key>" note naming the venue screen's ticket that builds the record.
decision:
  what: 'tools/op-retire.py gains REPLACED (APP-SETUP-ADM-049, 051 -> APP-SETUP-BO-009; ADM-121 -> APP-SETUP-BO-117; ADM-148,
    159, 169, 172, 173, 174, 199 -> APP-SETUP-BO-010; ADM-179, 180, 181 -> APP-SETUP-BO-011) and REPLACED_OPS (each retired
    operation''s SVC-CATALOGUE-DRAFTED-n sub-task -> the planned sub-task of its typed writer). Both are closed as merged (Rejected)
    with the note "Replaced by <key> (#id) (decided 2 October 2026, release r2)". check-key-stability counts REPLACED keys
    as retired, so retiring is never read as renaming. build-service-docs.py plans no task for the 13 section screens
    (replaced_screens: each renders inside its venue screen, whose ticket builds it) and counts REPLACED keys as closed,
    so no other work takes them. SVC-CATALOGUE-DRAFTED-3, three of whose four operations were retired, closes as replaced
    by SVC-CATALOGUE-DRAFTED-1, where its last operation (setDemandOccupancyAvailability) is now chunked.'
  by: Chinmay
  date: '2026-10-02'
why: 'Chinmay, 2 October 2026: "13 dupes would be gone in r2" (CHG-CLN-001). A pushed ticket whose work left the plan with
  no reason in op-retire.py is listed as unexplained and never touched; a "replaced by" note tells the developer where the
  work went (council of 1 October, C4: a pushed key is never renamed).'
