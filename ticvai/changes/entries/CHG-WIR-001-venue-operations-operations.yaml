prevention:
  type: check
  ref: tools/check-screen-wiring.py
status: closed
closed_by_commit: 16fd732e
notes: 'check-screen-wiring gains S-STAFF-AUDIENCE (a staff screen calling a guest-, device-, service- or partner-only
  operation) beside the existing S-DUP-SCREEN and S-CONSUMED-MIRROR rules, and check-screens keeps its R254 attachment
  warnings; check-flows rule 3 holds every repointed flow step to its screen. Tickets: none started (Block A starts
  Monday 5 October 2026); unstarted keys are every tasks.csv or pushed key naming a touched screen. Per screen and
  flow:

  - POS-029: removed getQueue, getQueueFeedHealth, listQueueEntries — Ride-queue and sensor-feed operations (listQueueEntries,
  getQueue, getQueueFeedHealth) sat on an F&B order board; an outlet''s order flow reads listFnbOrders (ADR-0012;
  design-notes correction venue-operations POS-029).

  - EMP-048: removed createInspectionTemplate — Template authoring (createInspectionTemplate, INSPECTION_MANAGE)
  is tenant-level management in the back office; the opening checklist only works today''s checks (design-notes
  correction venue-operations EMP-048).

  - EMP-010: removed getOfflinePackage, listScans, syncScans — Scan history, sync and offline-package panels on
  the scan screen; as on SCN-003 the scan screen is idle by design, history is SCN-009''s, sync EMP-017''s and the
  package EMP-018''s (F06 step 4; design-notes correction venue-operations EMP-010).

  - EMP-017: removed syncOrders — syncOrders replays till sales; a staff phone replays scans, and till order sync
  is POS work (design-notes correction venue-operations EMP-017).

  - EMP-032: removed listQueueEntries, listQueues — The waiting-guest table and queue list do not serve manual wait
  entry; only the chosen ride''s wait and its source are needed (design-notes correction venue-operations EMP-032).

  - SCN-002: removed setTurnstileMode — Setting the gate''s operating mode is the live podium act on SCN-016 Gate
  mode (R221); on SCN-002 the primary act is confirming the access point and starting the podium shift (design-notes
  corrections venue-operations SCN-002, BO-064).

  - SCN-003: removed getOfflinePackage, listBlacklist, listScans, syncScans — F06 step 4 says the ready screen calls
  nothing and is idle by design; the scan history (listScans needs the venue report permission) belongs to SCN-009,
  sync to SCN-014, the package to SCN-015, and the blacklist travels in the offline package (design-notes correction
  venue-operations SCN-003).

  - SCN-007: removed listScans, overrideAccess, syncScans, validateAccess; exits added SCN-014 — Scan history, sync,
  override and single-validate actions were generated from the scanner set; the group screen needs the group counter
  and the admit stepper (validateGroupAccess) (design-notes correction venue-operations SCN-007).

  - SCN-008: removed listScans, overrideAccess, syncScans, validateGroupAccess — Manual entry needs the reference
  field and the validate result only; the scan table, sync, override and group validation were generated from the
  scanner set (design-notes correction venue-operations SCN-008).

  - SCN-009: removed overrideAccess, syncScans, validateAccess, validateGroupAccess — Validate, group validate,
  sync and override contradict the screen''s own purpose ("Reads. Does not admit, does not decrement") and lookupTicket''s
  contract (design-notes correction venue-operations SCN-009).

  - SCN-013: removed listScans — The offline journal is local to the device and needs no server read; listScans
  returns server scans and needs the venue report permission (F63 step 2; design-notes correction venue-operations
  SCN-013).

  - SCN-014: removed syncOrders — A scanner replays scans; syncOrders replays till sales and belongs to the POS
  (design-notes correction venue-operations SCN-014).

  - SCN-015: removed listScans, overrideAccess, syncScans, validateAccess, validateGroupAccess — The package screen
  shows the package; the scan table, override, validate and sync actions were the generated scanner set (design-notes
  correction venue-operations SCN-015).

  - BO-001: removed createEvent, createPerformances, getEvent, listEvents, listPerformances, updateEvent — Event
  and performance operations were wired from flow F09 (event cancellation); events and performances are the ticketing
  back office (BO-015), not the ride queue directory (F09 step 1; design-notes correction venue-operations BO-001).

  - BO-002: removed cancelPerformance, getPerformance, getSeatAvailability, listQueueEntries, recommendSeats, updatePerformance;
  exits dropped BO-023 — Seat and performance operations (getSeatAvailability, recommendSeats, getPerformance, updatePerformance,
  cancelPerformance) were carried from a seat-board frame and flow F09 and have no place on ride queue configuration;
  the waiting-guest list belongs to the monitor BO-005 (F09 step 2; design-notes…

  - BO-004: removed approveRefund, createBulkRefund, createQueue, setQueueStatus, updateQueue; exits dropped BO-005;
  entries dropped BO-023 — Refund operations (createBulkRefund, approveRefund) and queue create/update/status were
  carried from flow F09 and BO-001; this screen sets waits (F09 step 4; design-notes correction venue-operations
  BO-004).

  - BO-005: removed createCampaign, getCampaign, getCampaignPerformance, launchCampaign, listCampaigns, pauseCampaign,
  stopCampaign, testSendCampaign, unscheduleCampaign, updateCampaign — A queue monitor does not run marketing campaigns;
  the queue''s guest notifications come from setQueueStatus and callNextParties and are transactional. The second
  primary button "Call next" (no operation) duplicated "Call next parties" (contracts/satellite/queue.yaml#setQueueStatus;
  F09 step 5; R254;…

  - BO-006: removed listAccessPoints, updateAccessPoint — Parking configuration needs only the facility read and
  write; editing access points belongs to BO-064, and the venue comes from the session (ADR-0030; design-notes correction
  venue-operations BO-006).

  - BO-030: removed acceptWorkOrder, attachWorkOrderEvidence, cancelWorkOrder, closeWorkOrder, completeWorkOrder,
  createWorkOrder; exits dropped BO-031; exits added BO-069 — The screen exists to verify or reject completed work;
  create, accept, complete, cancel, close and attach-evidence belong to BO-070 and the technician''s app (F12 step
  4; design-notes correction venue-operations BO-030). F12 step 5 now returns the asset to service on BO-069, the
  kept asset register.

  - BO-023: declared createBulkRefund — F09 step 4 authorised the bulk refund on BO-004 Manual Wait Time Entry,
  a queue screen; a refund is worked on the refunds screen (F09 step 3 note, 24 August), so createBulkRefund is
  declared here and the step moves with it (design-notes correction venue-operations BO-004).

  - BO-031: removed createAsset, getAsset, getAssetHistory, listAssets, lookupAsset, setAssetStatus, updateAsset;
  merged into BO-069 — BO-031 and BO-069 are the same asset register (same seven maintenance operations, near-identical
  layouts); keep BO-069 and retire BO-031 (DI-671, DI-987; design-notes corrections venue-operations BO-031, BO-069).

  - BO-069: removed listGames, recordGamePlay, syncGamePlays, updateGame — recordGamePlay and syncGamePlays are
  device-audience operations and game configuration belongs to the games boards (BO-395); keep only the asset register
  (design-notes correction venue-operations BO-069).

  - BO-034: removed getOfflinePackage, overrideAccess, syncScans, validateAccess, validateGroupAccess — Sync, validate,
  group-validate, override and the offline package are workstation-scoped scanner operations the contract refuses
  (403) for a back-office browser; back-office screens read through listScans (design-notes correction venue-operations
  BO-034).

  - BO-035: removed getOfflinePackage, overrideAccess, syncScans, validateAccess, validateGroupAccess — An audit
  screen performs none of override, validate, group-validate or sync; the scanner operations are refused for a back-office
  session, and overriding belongs at the gate (SCN-003) (F06 step 5; design-notes correction venue-operations BO-035).

  - BO-038: removed callNextParties, createQueue, getQueue, getWaitTimes, listQueueEntries, listQueues, setQueueStatus,
  setWaitTime, updateQueue; declared listSyncRejections, resolveSyncRejection; set requiresModule=access — Every
  operation bound was a ride virtual-queue operation while the purpose is scan reconciliation; the sync-rejection
  read and resolve action named by F06 step 6 replace them, and the screen leaves the queue module (design-notes
  corrections venue-operations BO-038).

  - BO-064: removed setTurnstileMode — The operating mode is a live podium action (R221) that belongs on BO-201
  and SCN-016; on this configuration screen it invites changing a gate''s live state from a setup form (design-notes
  correction venue-operations BO-064).

  - BO-066: removed acknowledgeAnnouncement — Acknowledging an announcement is the recipient''s act on the Staff
  App, not a back-office action (design-notes correction venue-operations BO-066).

  - BO-096: see the screen — Two primary buttons for one act ("Book" with no operation and "Book resource" on bookResource);
  one Book action (design-notes correction venue-operations BO-096).

  - BO-098: declared getResourceQualifications — A write-only screen (setResourceQualifications) with no read of
  the current qualifications; the list sorted by expiry needs getResourceQualifications, which exists (design-notes
  correction venue-operations BO-098).

  - BO-103: removed getVenueSettings — Venue settings are not access state and getVenueSettings carries no module
  enablement (R279); the hub''s "What is enabled here" panel cannot be filled from it (design-notes correction venue-operations
  BO-103).

  - BO-108: removed getVenueSettings — A hub shows state and links; the venue settings panel does not belong on
  it and getVenueSettings carries no module enablement (R279) (design-notes correction venue-operations BO-108).

  - BO-155: declared listAdmissionRules — No read was bound, so the builder could not open an existing rule; the
  rule lives in AdmissionRules.ruleConditions, read by listAdmissionRules (design-notes correction venue-operations
  BO-155).

  - BO-164: removed setDeviceBindingPolicy, setDynamicSecurityProfile — The command centre monitors; the device-binding
  and dynamic-profile writes belong to BO-167 and BO-165, which declare them (ADR-0041, DI-653; design-notes correction
  venue-operations BO-164).

  - BO-184: removed setBiometricVerificationProfile, setFacePassEnrollment — The command centre is a dashboard (VO-R02);
  the verification-profile and enrolment writes belong to BO-185 and BO-186, which declare them (ADR-0041; design-notes
  correction venue-operations BO-184).

  - BO-222: removed setContextTimeEvent — setContextTimeEvent is the context policy builder''s write (BO-237, which
  declares it); a context policy is a different object from a special-event admission (design-notes correction venue-operations
  BO-222).

  - BO-234: removed setVisualDynamicPolicy — A policy write on the command centre; writes belong to BO-236 and BO-237
  (VO-R02, ADR-0041; design-notes correction venue-operations BO-234).

  - BO-243: removed listPolicies — listPolicies reads the white-label legal policies (privacy, terms, refund, cookie),
  the wrong domain; access policies come from listDynamicAccessPolicy and listDynamicPolicyEffectiveness, both declared
  (design-notes correction venue-operations BO-243).

  - BO-863: removed createResource, updateResource — Creating and editing resources is BO-095 and BO-857; this screen
  governs the lifecycle (design-notes correction venue-operations BO-863).

  - BO-877: removed setResourceQualifications — Recording a person''s qualifications is BO-098 and BO-876; this
  screen defines requirements (design-notes correction venue-operations BO-877).

  - EMP-004: removed attachWorkOrderEvidence, cancelWorkOrder, closeWorkOrder, completeWorkOrder, pauseWorkOrder,
  recordWorkOrderParts, recordWorkOrderTime, resumeWorkOrder, startWorkOrder, updateWorkOrder, verifyWorkOrder —
  Bulk-attach residue: the task list carried the whole work-order lifecycle. The list needs Accept and Decline only;
  doing the work is EMP-005, and Verify (WORK_ORDER_VERIFY), Close (MAINTENANCE_APPROVE), Cancel and reassign are
  supervisor acts on BO-030 and BO-070 (F65 step 3; design-notes correctio…

  - EMP-005: removed cancelWorkOrder, closeWorkOrder, updateWorkOrder, verifyWorkOrder — Verify, Close, Cancel and
  Save (reassign, reprioritise) are supervisor acts (the verifier may not be the technician); they belong to BO-030
  and BO-070, not the technician''s task screen (F12 step 4; design-notes correction venue-operations EMP-005).

  - EMP-007: removed acknowledgeAnnouncement, getAnnouncementReach, listAnnouncements, publishAnnouncement; declared
  listWorkOrders — A handover is not a staff announcement: publishing needs ANNOUNCEMENT_PUBLISH, which a steward
  does not hold, and reaches the whole audience, not the next person on the post. F65 says the handover is generated
  from open tasks, so the carried items are read from listWorkOrders; the handover note its…

  - EMP-022: removed getCurrentShift — getCurrentShift reads the till session (SHIFT_OPEN, workstation scope); a
  rota assignment is not a cash shift and most positions never touch a till (design-notes correction venue-operations
  EMP-022).

  - EMP-024: removed amendAttendance — Amending attendance is a supervisor act (WORKFORCE_MANAGE); it was removed
  from EMP-025 for that reason and goes from the staff member''s own clock screen too (design-notes correction venue-operations
  EMP-024).

  - EMP-050: removed recordAuthorityNotification — Recording the authority notification is a step of following up
  the incident (EMP-027), not of restoring the venue; the screen''s own note says notification belongs where the
  incident is handled (F69 step 3; design-notes corrections venue-operations EMP-050, EMP-027).

  - EMP-027: declared recordAuthorityNotification — The supervisor following up the incident records the notification
  to the authorities; the operation sat on EMP-050 (F69 step 3; design-notes correction venue-operations EMP-027).

  - EMP-037: removed publishAnnouncement; declared listApprovalRequests — The inbox is where staff read; publishing
  belongs to EMP-038 (and BO-066 on the back office). F14 routes a manager''s mobile approval of a discount here
  and DI-229 asks for action-required items, so the approvals read is added; without it the Action required tab
  is empty except for acknowledgements…

  - EMP-038: removed acknowledgeAnnouncement — Acknowledging is the recipient''s act (EMP-039, EMP-037), not the
  sender''s (design-notes correction venue-operations EMP-038).

  - EMP-039: removed getAnnouncementReach, publishAnnouncement — Staff read here: publishing is EMP-038 and BO-066,
  and the reach roll call is for the publisher and supervisors, not for every reader (design-notes correction venue-operations
  EMP-039).

  - EMP-047: removed getAnnouncementReach, publishAnnouncement — Emergency mode is a full-screen takeover with one
  action (acknowledge); the generic announcements set put publish and the reach roll call on it. Declaring goes
  out from EMP-038 (F69 step 4 repointed) (F08 step 2; design-notes correction venue-operations EMP-047).

  - BO-071: removed setRolePermissions; declared updateMaintenancePlan — Bulk-attach residue: role permissions are
  tenant identity administration and have nothing to do with maintenance plans. Only createMaintenancePlan was bound;
  updateMaintenancePlan (PATCH, suspend) exists and a plan library that cannot change a plan is incomplete (design-notes
  correction venue-opera…

  - BO-144: removed createAccessPoint — The command centre monitors (VO-R02); creating an access point belongs on
  the Access Point Directory BO-148 (design-notes correction venue-operations BO-144).

