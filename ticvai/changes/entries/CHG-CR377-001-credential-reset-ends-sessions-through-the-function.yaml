id: CHG-CR377-001
date: '2026-10-31'
source: cr
kind: contract
summary: 'resetPrincipalCredential ends every session and refresh token of the principal by calling
  identity.end_principal_sessions(principalId, the caller''s principal id, ''credential-reset'') in its own
  transaction, as updatePrincipal does (CR-180); a refusal fails the whole reset. ActiveSession.endReason names
  credential-reset. identity.session''s policy is not widened.'
decision:
  what: 'The lead''s review, 31 October 2026: "for each one actually check if they hold and if not then find out the
    best way keeping in mind what client needs", then "Include them in r12". Posted on #31238 (Chinmay, 31 October
    2026), not as recommended: no change to identity.session''s policy. In the reset''s own transaction, call
    identity.end_principal_sessions(principalId, the caller''s principal id, ''credential-reset''), exactly as
    updatePrincipal does (ADAM CR-180). It checks the caller may update that principal, ends every active session of
    the principal at every venue with ended_at, ended_by_principal_id and end_reason credential-reset, and revokes
    every live refresh token. If it refuses, the whole reset fails and nothing is written.'
  by: Chinmay
  date: '2026-10-31'
why: 'ADAM CR-377 (Hrushikant Patkar, #31238 resetPrincipalCredential): a venue manager''s reset could not end the
  principal''s sessions at other venues under identity.session''s row security. The package already answers it since
  CR-180 (CHG-R10ID-006): identity.end_principal_sessions, a SECURITY DEFINER function in the r10 forward migration
  that any operation ending all of a principal''s sessions calls. Widening the policy would still leave refresh tokens
  unrevoked (own-row, CHG-R11FXV-002).'
keys_touched:
  operations: [resetPrincipalCredential]
  schemas: [ActiveSession]
  tables: [identity.session, identity.refresh_token]
  files:
  - contracts/spine/identity.yaml
  - tools/check-business-rules.py
root_class: 'an operation that must end all of a principal''s sessions and does not name the function that does'
tickets:
  started:
  - '31238 (resetPrincipalCredential): replace "end only the sessions my grant can see" with the function call. Told
    through the lead''s comment; its text is not rewritten.'
  unstarted: []
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-377
triage: fix-forward
prevention:
  type: check
  ref: tools/check-business-rules.py::BR-END-SESSIONS
status: open
notes: 'No database work: the function is in V0116. BR-END-SESSIONS now holds resetPrincipalCredential to the function
  and ActiveSession.endReason to credential-reset, beside updatePrincipal.'
