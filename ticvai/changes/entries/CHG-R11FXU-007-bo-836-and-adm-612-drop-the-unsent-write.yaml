id: CHG-R11FXU-007
date: '2026-10-29'
source: audit
kind: spec
summary: 'BO-836 Design System & Components and ADM-612 Refund Allocation & Original Tender Manager no longer
  declare setBrandIdentity and setWalletRefundPolicy, which nothing on them could send; their generated buttons go, and
  with no operation left each has no permission of its own and its no-access text says so.'
decision:
  what: 'screens/P08-venue-back-office.yaml. BO-836: setBrandIdentity is removed and recorded as a removed gap, with
    the generated Save brand identity and Cancel (no field on the screen); the screen permission TENANT_CONFIGURE,
    taken from that write, is dropped. ADM-612: setWalletRefundPolicy is removed and recorded, with the generated
    Cancel; its one pack action, Manual allocation with approval, stays, bound to nothing as before; the screen
    permission WALLET_CONFIGURE is dropped. On both, emptyNoAccess takes the text BO-602 took (CHG-R11FXT-004): "Not
    shown: nothing on this screen needs a permission of its own; the app''s sign-in decides access.", and the emptied
    contentBody region carries a note saying why it is empty. setBrandIdentity stays declared and reached on CMS-002,
    CMS-004, CMS-104 and ADM-016; setWalletRefundPolicy on BO-1146. The four visible changes are logged in
    docs/active/approved-ui-changes.yaml. The x-ticvai-consumed-by mirrors in contracts/satellite/white-label.yaml and
    contracts/satellite/wallet.yaml follow (link-screens-contracts).'
  by: Chinmay
  date: '2026-10-29'
  quote: '"Remove + log text" (the lead on the held screen findings of the r11 final gate, 29 October 2026, after
    "Fix them, then ship")'
why: 'The r11 final gate, 29 October 2026 (ticket statuses read 2026-10-29T12:46Z, handoff/service-docs/adam-links.json):
  check-screen-wiring S-OP-UNREACHED findings on BO-836 setBrandIdentity (#31041, Ready for QA, Deep Khanvilkar) and
  ADM-612 setWalletRefundPolicy (#30859, Ready for QA, Pranay Shinde). With the write gone and the text unchanged,
  S-STATE-BOILERPLATE would refuse a no-access text naming a permission no operation needs. The lead''s ruling of 26 October 2026 (CHG-R10WIR-002, item 5); the BO-602 treatment
  (CHG-R11FXT-004).'
keys_touched:
  screens: [BO-836, ADM-612]
  operations: [setBrandIdentity, setWalletRefundPolicy]
  files:
  - screens/P08-venue-back-office.yaml
  - contracts/satellite/white-label.yaml
  - contracts/satellite/wallet.yaml
  - docs/active/approved-ui-changes.yaml
root_class: 'an operation declared on a screen that does not do it'
tickets:
  started:
  - '31041 (setBrandIdentity, Ready for QA, Deep Khanvilkar) and 30859 (setWalletRefundPolicy, Ready for QA, Pranay
    Shinde): nothing to change in the operations; BO-836 and ADM-612 no longer consume them, and each stays on the
    screens that send it. Told through the lead''s comment; their text is not rewritten.'
  unstarted:
  - 'BO-836''s and ADM-612''s screen tickets drop the declaration, the generated buttons and the screen permission,
    and take the no-access text, at the next tag.'
release_tag: pending
decision_owner: Chinmay
adam_cr: 'none: r11 gate'
triage: fix-forward
prevention:
  type: check
  ref: tools/check-screen-wiring.py::S-OP-UNREACHED
status: open
notes: 'Four visible changes (a region and the no-access text on each), logged. No database change.'
