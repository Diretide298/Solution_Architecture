id: CHG-R13INT-011
date: '2026-11-02'
source: cr
kind: contract
proposed: '2026-11-02'
summary: 'tenancy#retentionJobs becomes one retention job in each module that holds personal data, each run every day by
  its retention setting (tenancy.data_retention_setting): identity#personalDataRetention (guestProfile, facePassBiometric,
  faceTagBiometric: the pii tables), marketing-crm#personalDataRetention (guestProfile: guest profiles, notes, documents,
  preferences, form submissions, consent records, conversation messages), orders#personalDataRetention (paymentRecord: orders.payment)
  and ai#personalDataRetention (aiPrompts, aiConversations, aiDecisionRecords, on the AI server).'
decision:
  what: 'The lead, 2 November 2026, answering build lane s''s open questions (CHG-R13JOB-001), each "(Recommended)": "tenancy#retentionJobs:
    one retention job in each module that holds personal data, run by that module''s retention setting (tenancy.data_retention_setting)."
    Plan change waived from the cooling-off by the lead ("1 waive", 2 November 2026).'
  by: Chinmay
  date: '2026-11-02'
why: 'Finding (lane s''s r13 job scan): Tenancy''s text says every retention job resolves its period from its settings and
  names no set, so the declaration was host undecided and no task built any (check-jobs OPEN).'
