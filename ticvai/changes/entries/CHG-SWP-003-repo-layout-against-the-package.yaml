notes: 'Batch SWP, 14 October 2026. Released outside the Tue/Fri window by the lead''s waiver, 14 Oct 2026: "Release
  today as an exception". Run on the parent commit 594e51a2: 1,941 findings, all new, exit 1; on this branch all
  known, exit 0. FR-OLD-PATH by platform: P01 50, P02 77, P04 32, P05 17, P06 96, P08 1,663 (every screen of the six
  platforms with a repository; the screens kept their authored path on 13 October and only the ticket text strips
  it, so ADAM''s screen still serves apps/<app>/). FR-LAYOUT-UNCONFIRMED: P01, P02, P04, P05, P06, P08. Tried with a
  temporary observed block on P02 (none, npm, src/, no packages; not committed): FR-LAYOUT-MISMATCH reports the four
  shared packages and the 77 apps/guest-app/ paths. Recording that observation (GAP or the lead) turns those on;
  they are new findings then, by design.'
