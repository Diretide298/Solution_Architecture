id: CHG-SWP-003
date: '2026-10-14'
source: audit
kind: process
summary: 'check-frontend-repos reads what the package says a frontend repository holds against what was seen in it:
  screens naming components under the old apps/<app>/ workspace (FR-OLD-PATH), repositories whose layout is still
  only assumed (FR-LAYOUT-UNCONFIRMED), and an observed layout that contradicts the package (FR-LAYOUT-MISMATCH).'
decision:
  what: 'tools/check-frontend-repos.py gains FR-OLD-PATH, FR-LAYOUT-UNCONFIRMED and FR-LAYOUT-MISMATCH. A repository''s
    real layout is recorded on its docs/active/frontend-repos.yaml entry as `observed: {by, date, workspace: none|nx,
    packageManager, srcRoot, packages: [...]}`; FR-LAYOUT-MISMATCH then compares the suggested locations
    (frontend_repos.relative_path) with srcRoot, the platform''s `packages` with the repository''s, and a non-Nx
    repository with screens still under apps/<app>/. No observation is recorded by this batch (batch GAP owns the
    #27741 case); the 1,941 findings on r6 are baselined.'
  by: Chinmay
  date: '2026-10-14'
why: 'On #27741 (AM-IDENTITY-SECURITY-P02) the developer''s agent found ticvai-guest-app a single React Native CLI
  app at the repository root, on npm, with src/, while ADAM''s screen GST-073 said
  apps/guest-app/src/routes/account/SecuritySignIn.tsx (the one Nx/pnpm workspace of CHG-R6-058) and the platform
  names the workspace packages design-tokens, ui, api-client and offline-core. check-frontend-repos (CHG-R6-059)
  checked only the platform-to-repository mapping and the setup table; frontend-repos.yaml says the inside of every
  repository is assumed. Chinmay, 14 October 2026: "Once done can we check rest of the things for similar patterns?"'
