date: '2026-11-03'
source: cr
kind: contract
summary: 'The 422 policy-not-met of changeOwnCredential, createPrincipal (initialCredential) and resetPrincipalCredential
  (a password temporaryCredential) answers the new identity schema CredentialPolicyNotMetProblem: the shared Problem plus
  one required member, rule (minLength, pinLength or requireBreachCheck, the first rule that failed: minLength, then
  requireBreachCheck; for a PIN pinLength), detail in words with no password, hash or prefix, and no errors[], which stays
  on the 400 validation answers. changeOwnCredential''s 422 is oneOf Problem (current-credential-wrong,
  credential-reused) or the new schema; PasswordPolicy.requireBreachCheck says the same.'
decision:
  what: 'Posted on #30719 (Chinmay, 3 November 2026), under the lead''s "Dont hold r13. approve them and rever tto the
    devs" (3 November 2026): "Build now: the 422 policy-not-met follows the rule set for setApprovalMatrix on 2
    November: errors[] stays on the 400 validation answers only, and a 422 carries its details as members. Nothing
    changes in the shared problem model or the request kernel''s problem mapper. (1) New body schema in identity,
    CredentialPolicyNotMetProblem: the shared Problem plus one required member, rule ... (2) rule is the first rule that
    failed ... (5) The same body and order apply wherever this check runs: changeOwnCredential ..., createPrincipal
    (initialCredential) and resetPrincipalCredential (a password temporaryCredential) ... (7) current-credential-wrong
    and credential-reused keep the plain Problem body. Screens that show this refusal display detail, as they do now,
    and do not change."'
  by: Chinmay
  date: '2026-11-03'
