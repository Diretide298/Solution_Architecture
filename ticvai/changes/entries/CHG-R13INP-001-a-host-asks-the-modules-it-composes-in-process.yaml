id: CHG-R13INP-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'The class of CR-475 to CR-478 fixed at its source: every x-ticvai-read-via that asked over the service route
    a query its host already asks in process is asked in process. 286 reads in 203 operations are re-routed (282 by
    tools/applied/inprocess-reads-2-november.py, the four of CR-475, CR-477 and CR-478 by hand), through the owner''s
    own query class under the caller''s row-level security: 121 on a query the lead had already granted the host, 5
    within one deployable, and 156 to a module the host composes (operations: Tenancy, Catalogue, Orders; access:
    Tenancy, Catalogue; commerce: Access), each with an additive read grant where the host''s role lacked one (XDR-071
    to XDR-078 in docs/active/cross-deployable-writes.yaml; 39 table grants). 16 queries served on the service route
    only are served in process too. ADR-0055 is amended (2 November 2026). check-cross-module-reads XR-INPROCESS-HOST
    refuses such a service read from now on, and contract_shapes.read_route drafts it in process. XDR-010 is marked
    narrow, so its pii.subject grant stays with listDeviceBindingSession. Left with the lead and not re-routed: 95
    reads in 44 Control Plane operations and the 12 Access reads of pii.subject.'
decision:
  what: 'The lead, settling CR-475 to CR-478 on 2 November 2026 ("approve all as a recommended"), each in process with
      an additive read grant for the host''s database role where it lacks one, as CR-296, CR-383, CR-385, CR-394,
      CR-426 and CR-427 had been settled case by case; and for r13 the whole class fixed at its source, once: an
      operation that declares a service route for a query whose owning module''s queries already run in its host (the
      host composes that module''s query classes) asks it in process. Posted on #30768 (CR-475): "diffConfigVersion
      asks catalogue#productRecords and catalogue#productCategoryRecords in process from the operations host. Use
      Catalogue''s own query classes ... call no service route." Posted on #30870 (CR-477): "asks
      orders#orderLineRecords with where {orderId} in process from the operations host. Use Orders'' query class,
      already composed there (CR-385) ... Database: Hrushikant adds a guarded grant".'
  by: Chinmay
  date: '2026-11-02'
why: 'ADAM CR-475 (#30768), CR-476 (#30767), CR-477 (#30870) and CR-478 (#30871), raised by Deep Khanvilkar on 2
    November 2026, each asked again for what CR-296, CR-383, CR-385, CR-394, CR-426 and CR-427 had decided: a read the
    host already asks in process, declared on the service route between deployables, which waits on the kernel''s
    service sign-in (#37051, CR-281) and runs at the tenant root (CR-196). The rule that drafted these routes
    (contract_shapes.read_route, CHG-R10GEN-007) knew only granted queries, not the modules a host composes, and no
    check refused a service read the host could ask in process, so every new read came back as a CR. ADR-0055 rules 2
    and 4 as amended 21 and 25 October 2026.'
