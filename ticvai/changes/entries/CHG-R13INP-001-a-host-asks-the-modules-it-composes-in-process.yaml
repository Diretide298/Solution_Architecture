status: open
notes: 'Covers the class beside CR-475 to CR-478 (their own entries CHG-CR475-001 to CHG-CR478-001); generator rule
    tools/contract_shapes.py read_route and composes_owner. [DB] work for the plan lane: XDR-071 and XDR-072 are
    #37210 and #37211; XDR-073 to XDR-078 need one new [DB] task, the grants listed in each entry (USAGE on schema
    accreditation, approvals, tenancy, workforce and seating for operations, approvals and tenancy for access; SELECT
    on the tables of XDR-073 to XDR-078 (36 grants; 39 with XDR-071 and XDR-072, on 37 tables). Not re-routed, for the
    lead: (1) 95 reads in 44 Control Plane operations (Platform''s partner, burst-environment, tenant-migration,
    subscription-preview, channel-listing and dead-letter operations, whose own rows are control.* or whose scope is
    platform), because the Control Plane runs outside every cell (ADR-0039, ADR-0048) and planTenantMigration says it
    asks Orders over the service route (CR-083); (2) the 12 Access reads of identity#subjectRecords other than
    listDeviceBindingSession, which XDR-010 and ADR-0055 keep on the service route; (3) every Identity read from
    operations or access (103 reads; no host composes Identity), and the operations host''s 25 reads of Access queries
    (only XDR-023''s one query is granted). The check holds (1) apart by the control.* or scope rule, so it never asks
    for them. Beyond the posted words: the access host is held to compose Tenancy''s and Catalogue''s query classes on
    XDR-003''s words, and commerce Access''s on XDR-001''s and the 21 October amendment''s; XDR-022''s and XDR-032''s
    lists of reads not covered by their decisions are now covered by this ruling and are not edited.'
