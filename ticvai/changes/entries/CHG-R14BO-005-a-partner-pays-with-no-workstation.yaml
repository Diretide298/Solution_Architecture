summary: 'createPayment and inquirePaymentStatus gain their partner variant, as they have a guest one: marked
  x-ticvai-partner-callable, a partner user on the partner portal (P10) calls them with no workstation, under the
  session''s venue grant (the order''s venue), and only on an order of the partner''s own channel. check-screen-wiring
  S-WORKSTATION-OP accepts a partner-callable operation on P10, as it accepts a guest-callable one on a guest platform.'
decision:
