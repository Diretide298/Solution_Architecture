    variant (venue-scoped, the partner''s own order and allocation; scope level venue for a partner caller, as
    guest-callable does for guests)", the decision CHG-SCO-009 left to the lead. The variant is the same operation,
    as the guest variant is (CHG-GCF-003, CHG-SCR-012): no new operation, path or permission.'
  by: Chinmay
  date: '2026-11-03'
why: 'Finding: check-screen-wiring S-WORKSTATION-OP (R100), PTR-012 createPayment and inquirePaymentStatus, known since
  CHG-SCO-009 and built on by started ticket #31898; the partner cart and order are already written under the
  session''s venue grant (ADAM CR-184).'
