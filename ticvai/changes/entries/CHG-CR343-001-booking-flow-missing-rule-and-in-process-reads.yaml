id: CHG-CR343-001
date: '2026-10-30'
source: cr
kind: contract
summary: 'bookingFlowMissing is reported once per active venue and ProductKind with a sellable, bookable catalogue
  product of a kind some BookingFlowType books and no enabled flow of that venue serving it (no tenant-wide flow;
  retail, addOn, bundle, walletTopUp, infoOnly and hidden never reported). validateTenantConfig and publishTenantConfig
  ask catalogue#productRecords (where {venueId}) and tenancy#activeVenues in process from the operations host (XDR-022);
  restoreConfigVersion, setAnalyticsProvider and setMaintenanceMode ask tenancy#activeVenues in process too.'
decision:
  what: 'ADAM CR-343 (Chinmay, 30 October 2026, posted: "not as recommended: A''s sellable rule and in-process read,
    narrowed, and with the venue read in process too"), after the lead''s review of every CR ("for each one actually
    check if they hold and if not then find out the best way keeping in mind what client needs").
    contracts/satellite/white-label.yaml: the ConfigFindingKind bookingFlowMissing row rewritten to the rule;
    validateTenantConfig''s description and its two read-vias, publishTenantConfig''s two, and the tenancy#activeVenues
    read-via of restoreConfigVersion, setAnalyticsProvider and setMaintenanceMode, route in-process.
    contracts/spine/tenancy.yaml activeVenues: served [in-process, service], the operations host asking it for those
    five operations (platform.scope is a kernel table, CR-002 and CR-296; no grant). contracts/spine/catalogue.yaml
    productRecords: its rule names validateTenantConfig and publishTenantConfig. docs/active/cross-deployable-writes.yaml
    XDR-022 (reader operations; catalogue.product and catalogue.product_media, granted by V0118; the two queries; the
    five operations); handoff/cross-deployable-writes.md regenerated by the check. tools/check-business-rules.py
    BR-BOOKING-FLOW-MISSING.'
  by: Chinmay
  date: '2026-10-30'
why: 'ADAM CR-343 (Narayan Gaonkar, #30778 validateTenantConfig, blocking): CR-320''s rule left an "active" product
  and the flows that serve a venue undefined, and both reads were on the service route, which is not built (CR-281,
  #37051). Every flow is created under its venue (createBookingFlowDefinition), and no flow type books retail, addOn,
  bundle or walletTopUp, so option A as written would have blocked every publish.'
keys_touched:
  operations: [validateTenantConfig, publishTenantConfig, restoreConfigVersion, setAnalyticsProvider,
    setMaintenanceMode]
  schemas: [ConfigFindingKind]
  tables: [catalogue.product, catalogue.product_media, platform.scope, whitelabel.booking_flow]
  files:
  - contracts/satellite/white-label.yaml
  - contracts/spine/tenancy.yaml
  - contracts/spine/catalogue.yaml
  - docs/active/cross-deployable-writes.yaml
  - tools/check-business-rules.py
  other:
  - 'XDR-022 (granted read; the grant is V0118''s)'
root_class: 'storage-route gap: a cross-deployable read on a route that is not built, and a finding rule that named
  no product state'
tickets:
  started:
  - '30778 (validateTenantConfig, Narayan Gaonkar): build bookingFlowMissing to the rule and the in-process reads; no
    longer blocked.'
  - '30774 (publishTenantConfig): the same rule and reads for its bookingFlowMissing check.'
  - '30765 (setAnalyticsProvider) and 30766 (setMaintenanceMode): tenancy#activeVenues is asked in process, so they no
    longer wait on #37051 for it (CR-281 said they waited for service sign-in; they waited only for this read).'
  unstarted:
  - '30775 (restoreConfigVersion): its tenancy#activeVenues read is in process.'
release_tag: pending
decision_owner: Chinmay
adam_cr: CR-343
triage: blocker
prevention:
  type: check
  ref: tools/check-business-rules.py
status: open
notes: 'tools/check-cross-module-reads.py XR-ROUTE holds the in-process reads to XDR-022. Not covered by this decision:
  publishTenantConfig and restoreConfigVersion still ask orders#venueChargeCurrencies over the service route, and
  getTenantConfig and setBookingFlowConfig still ask tenancy#activeVenues over it. The plan still has setAnalyticsProvider
  and setMaintenanceMode waiting on KERNEL-SERVICE-AUTH (docs/active/block-a-extra-tasks.json operationWaits); neither
  now asks anything over the service route, so that wait is a plan change for the lead. The operations role''s SELECT is
  V0118''s, which the live tenant database must have applied before the read works there.'
