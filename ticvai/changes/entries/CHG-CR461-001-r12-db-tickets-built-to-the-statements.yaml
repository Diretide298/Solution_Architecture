id: CHG-CR461-001
date: '2026-11-02'
source: cr
kind: contract
summary: 'The package''s r12 statements are what the nine [DB] tickets build, and the contract now says what each table
  leaves to its operation: ChannelAllocation''s 0 to 100 is setChannelAllocations'' 400 from the contract''s bounds and a
  reader takes a null released or returned count as 0; GuestBroadcast.scopePath is the venue''s path broadcastToGuests
  writes, under the scope policy. The exception: SeatMapTemplate''s structure and scope_path are NOT NULL, the migration
  that first creates the table creates both NOT NULL, a guarded forward migration fills scope_path from region_id and
  stops with the count of rows with no structure where it already ran, and source_seat_map_id''s key takes no ON DELETE
  action.'
decision:
  what: 'ADAM CR-461, posted on #27645: "Decided (Chinmay, 2 November 2026): A, with one exception. The package''s
    statements are what you build; the nine tickets were written from the decisions before the statements were derived,
    and their texts are corrected to the statements at the next release. Build now, ticket by ticket. #37163 ... #37177
    ... #37158 ... #37148 ... #37156 ... #37172 ... #37153 ... #37154 ... #37186 seating.seat_map_template is the
    exception. structure jsonb and scope_path ltree are NOT NULL, as the ticket says ... source_seat_map_id''s foreign key
    takes no ON DELETE action ..." The lead''s "approve all as a recommended", 2 November 2026.'
  by: Chinmay
  date: '2026-11-02'
why: 'ADAM CR-461 (Hrushikant Patkar, #27645 Foundation, database migrations): the r12 forward files (tenant V0120 to
  V0123) and nine r12 CR follow-up [DB] ticket texts disagreed; the [DB] check compares against the statements. The
  review confirmed all nine differences and found the one where the ticket was right: the contract requires
  SeatMapTemplate.structure and scopePath and handoff/migration-review.md lists the NOT NULL, which a derived forward
  file never adds.'
