# F01 — Guest buys a ticket online
#
# The flow the business runs on. Every screen in it is fully specified in
# screens/P01-guest-web-storefront.yaml, so this is validated end to end.
#
# Validated against _schema.yaml by tools/check-flows.py.

id: F01
name: Guest buys a ticket online
actor: guest
wave: 1
frequency: constant
criticality: revenue
platforms:
- P01 Guest Web Storefront
offlineBehaviour: 'Cannot start. The storefront is a web surface with no local bundle — availability
  and pricing are read live (browse availability from a one-second cache, ADR-0065), and selling from a cached catalogue to an anonymous browser would oversell
  within minutes. This is the deliberate opposite of the POS position (ADR-0013), and the difference
  is that a POS has a known workstation, a shift and a lease; a browser has none of those.

  '
trigger:
  description: 'A guest arrives wanting to visit. Most arrive on a product page from a search engine
    or a campaign link rather than the homepage, so the flow must work from any entry point.

    '
  entryScreen: WEB-001
  entryPoints:
  - Organic search to a product page
  - Campaign link with a promotion code
  - QR code in venue or on print
  - Direct to the homepage
steps:
- step: 1
  screen: WEB-001
  action: Lands and orients
  operations:
  - getPublishedTenantConfig
  - getTenantAppStatus
  - listProducts
  outcome: Sees what is on, in the tenant's branding
- step: 2
  screen: WEB-004
  action: Opens a product and decides
  operations:
  - getProduct
  - listPerformances
  outcome: Understands what is included and roughly when it is available
- step: 3
  screen: WEB-006
  action: Picks a date, then a time
  operations:
  - listPerformances
  - getAvailability
  outcome: 'Holds nothing yet: capacity is held when the tickets go into the cart (step 4, `addCartLine`,
    a 15-minute cart hold), not on a look. Availability is read from a one-second cache (ADR-0065, decided 1 October; the hold decides, not the look), in one call for every time of the event in the
    window (`eventId`, `from`, `to`). **Date first, then time, then tickets** (decided 29 September,
    rev 3 REV3-2): the times stay hidden until a date is picked, per the product''s published booking
    flow `settings.performanceReveal` (`getPublishedBookingFlow`, W12; default `dateTimeTicket`)'
  duration: Availability must return in under 400ms or guests reload and double-book
- step: 4
  screen: WEB-005
  action: Chooses ticket types and quantities
  operations:
  - listProductVariants
  - evaluatePromotions
  outcome: 'Sees a running total that already reflects any applicable promotion. The tickets appear once a
    time is picked and Continue stays off until both are chosen (decided 29 September, rev 3 REV3-2)'
- step: 5
  screen: WEB-010
  action: Reviews the cart and may enter a promotion code
  operations:
  - evaluatePromotions
  - getCouponCode
  outcome: Final price, with any rejected code explained rather than silently ignored
- step: 6
  screen: WEB-011
  action: Answers attendee forms and consent, only where the cart needs them
  operations:
  - getMyProfile
  - listConsentPurposes
  outcome: 'Marketing consent unticked by default. Transactional consent presented as required for service,
    not as a choice dressed up as one. **Skipped for a guest who proved the contact with the code, or is
    signed in, when the cart needs no attendee forms or consents** (decided 29 September, W1): code,
    then T&Cs, then pay; no second details form

    '
- step: 7
  screen: WEB-012
  action: Pays
  operations:
  - createOrder
  - createPayment
  outcome: 'Order created before payment, so an unknown payment outcome has an order to attach to. This
    ordering is the whole reason recovery is possible. **Payment converts the cart''s holds**: in the
    paying transaction catalogue `convertInventoryHold` turns each held unit into a sold one (SD-023), so
    a paid order can never find its capacity expired; a hold that lapsed before payment is re-acquired
    first, or the line is refused before the card is charged

    '
  duration: The guest is watching. Anything past 8 seconds reads as failure
- step: 8
  screen: WEB-013
  action: Receives confirmation and tickets
  operations:
  - getOrder
  - reprintOrder
  outcome: Order number visible immediately, tickets delivered by the chosen channel
branches:
- at: 3
  condition: The session sells out between loading the page and selecting it
  behaviour: 'Selection is refused with the next available session offered. Availability comes from a
    one-second cache (ADR-0065), and the hold is the guarded decrement, so this is caught here rather than at payment.

    '
  severity: recoverable
  resolvedBy: WEB-006
- at: 3
  condition: The venue attached consent questions to the flow or to a product in the cart
  behaviour: 'Asked once, right after the session or date is picked (e.g. *Are you able to swim?*), per
    person or once per booking as each question says, and recorded as consent records by
    `recordConsentAnswers`. A blocking answer marks the lines it blocks; `checkoutCart` refuses while a
    required question is unanswered (decided 29 September, rev 3 REV3-26).

    '
  severity: recoverable
  resolvedBy: recordConsentAnswers
- at: 4
  condition: The guest is not signed in and leaves the ticket step (or Add-ons, where the booking has one)
  behaviour: 'With the published flow''s `settings.signInAt` `afterAddOns` (the default; read with
    `getPublishedBookingFlow`, W12) the guest is asked to sign in,
    or for a guest code when guest checkout is on, before the cart; with `atPayment` the gate is at
    WEB-012. The basket is kept either way (decided 29 September, rev 3 REV3-3).

    '
  severity: recoverable
  resolvedBy: WEB-016
- at: 3
  condition: The session shows sold out online while counter allocation remains
  behaviour: 'Correct behaviour, not a defect. Availability is per channel under channel allocation
    — web has exhausted its share. Worth stating because it will be raised as a bug.

    '
  severity: recoverable
  resolvedBy: Automatic
- at: 5
  condition: A promotion code does not apply
  behaviour: 'The rejection names the condition that failed — expired, already used, wrong channel,
    membership required. "Invalid code" is what makes a guest call the venue.

    '
  severity: recoverable
  resolvedBy: WEB-010
- at: 7
  condition: Payment declined
  behaviour: 'Retry reuses the same idempotency key. The order persists in an unpaid state rather than
    being torn down, so a second attempt does not rebuild the cart.

    '
  severity: recoverable
  resolvedBy: WEB-012
- at: 7
  condition: 'Payment taken but no response received. The card is charged and the platform does not
    know it.

    '
  behaviour: '**The failure to build for.** The screen offers inquiry, never a retry — a retry double-charges
    and the guest is the one who discovers it. A background reconciler resolves any inquiry the guest
    abandons.

    '
  severity: requiresStaff
  resolvedBy: inquirePaymentStatus
- at: 8
  condition: Payment succeeded but confirmation fails to load
  behaviour: 'Shows the order number and a support route. Never implies the purchase failed — a guest
    told their payment did not work will pay twice.

    '
  severity: recoverable
  resolvedBy: WEB-013
- at: 4
  condition: The guest checks out as a guest (guest checkout on for the venue)
  behaviour: 'The pop-up asks only `BookingFlowSettings.guestContactFields` (email, and name or mobile
    where configured), then the six-digit code. After the code nothing is asked again: the cart goes
    to WEB-012, where the guest ticks the T&Cs (and may tick the unticked marketing opt-in, M18-15) and
    pays. The profile is created and completed later on WEB-020 (decided 29 September, W1).

    '
  severity: recoverable
  resolvedBy: WEB-016
- at: 2
  condition: The product's published booking flow orders the steps differently (e.g. a workshop is
    chosen before the date, or a seated event opens on the seat map)
  behaviour: 'Steps 3 and 4 follow the published flow (`getPublishedBookingFlow`, W12): a product-first
    flow (workshop, experience) picks the product on WEB-005 and then the date and time on WEB-006
    (W8); surf levels appear only after the time slot (W5).

    '
  severity: recoverable
  resolvedBy: Automatic
- at: 6
  condition: The guest abandons at the details form
  behaviour: '**The cart''s capacity holds lapse on their own.** `addCartLine` took a cart hold
    (catalogue `acquireInventoryHold`, holder kind `cart`, 15 minutes, extended while the guest is
    active); left alone, the expiry sweeper returns the units and publishes `inventoryHold.expired`
    (SD-023), so nothing needs releasing by hand. The abandoned cart is a marketing trigger only where
    consent already exists — an abandonment is not itself consent to be emailed.

    '
  severity: abandonsFlow
  resolvedBy: guest
exitStates:
- state: completed
  description: Order paid, entitlements issued, tickets delivered
- state: abandoned
  description: 'Guest left before payment. The cart''s capacity holds expire and the sweeper returns the
    units (SD-023), so nothing is reclaimed by hand

    '
- state: deferred
  description: 'Payment outcome unknown, inquiry pending. Resolves within minutes by reconciler or by
    the guest returning to the order

    '
openQuestions:
- 'Sandbox credentials for Stripe and Network International are outstanding. Steps 7 and the unknown-outcome
  branch cannot be tested without them, and that branch is the one most worth testing.

  '
primaryContract: catalogue
contracts:
- catalogue
- orders
- promotions
- white-label
- marketing-crm
