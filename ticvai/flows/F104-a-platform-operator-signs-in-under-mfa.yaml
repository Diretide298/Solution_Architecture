$schema: ./_schema.yaml
id: F104
name: A platform operator signs in under MFA
actor: platformAdmin
capability: A platform operator signs in under MFA
wave: 3
frequency: As needed.
criticality: safety
primaryContract: identity
contracts:
- identity
platforms:
- P09
- P10
- P12
trigger:
  description: Somebody with platform-wide authority signs in.
offlineBehaviour: '**Never offline.** A credential validated locally is a credential anybody can forge.'
steps:
- step: 1
  screen: ADM-001
  action: The operator signs in with username and password.
  operations:
  - login
  outcome: '**Signed in, not yet through.** Every platform operator holds a `PLATFORM_*` permission, and
    MFA is required by permission (decided 28 September, audit R135), so the session is not usable yet.'
- step: 2
  screen: ADM-001
  action: The second factor is asked for and given.
  operations:
  - createMfaChallenge
  - verifyMfaChallenge
  outcome: '**The authenticator code, or an emailed code as the fallback** (audit R126 (5)). `verifyMfaChallenge`
    completes the sign-in; five wrong codes lock step-up for the policy''s lockout minutes (audit R126
    (6)).'
- step: 3
  screen: ADM-001
  action: The session opens with its cross-tenant reach.
  operations:
  - getCurrentSession
  outcome: The operator sees their session and every other active one they may end.
  note: '**Repointed 2 October (CHG-WIR-021).** A sign-in door shows no active-session table; session management belongs to a signed-in security screen.'
- step: 4
  screen: PTR-001
  action: A partner user signs in through the same door.
  operations:
  - login
  - createMfaChallenge
  - verifyMfaChallenge
  outcome: '**The second factor only where a permission requires it** — a partner user holding none
    of the listed permissions signs in with the password alone (audit R135).'
  crossesDevice: true
- step: 5
  screen: SUP-001
  action: A back-office user signs in through the same door.
  operations:
  - login
  - createMfaChallenge
  - verifyMfaChallenge
  outcome: '**ROLE_MANAGE and LEDGER_APPROVE holders give a second factor; others do not** (audit R135).'
  crossesDevice: true
branches:
- at: 2
  condition: The operator has no MFA method enrolled yet.
  behaviour: '**Enrolled before they get in.** A platform operator cannot finish signing in without a
    method, so ADM-001 enrols an authenticator app (or email) with `enrolMfaMethod` and `verifyMfaEnrolment`
    first; staff may enrol only those two kinds (decided 28 September, audit R126 (5)).'
  severity: high
  resolvedBy: enrolMfaMethod
- at: 2
  condition: Five wrong codes.
  behaviour: '**Step-up locks for the policy''s lockout minutes, never permanently** (audit R126 (6)).
    The screen says so and when it lifts; a permanent lock is a denial of service anybody can run.'
  severity: medium
  resolvedBy: verifyMfaChallenge
- at: 1
  condition: The acting principal lacks the permission at this scope.
  behaviour: '**Refused at the first step, not the last.** ADR-0002 makes authorisation user-driven
    — a person who gets three steps in and then cannot finish has been told the wrong thing.'
  severity: medium
  resolvedBy: resolvePermissions
exitStates:
- state: completed
  description: The journey ran end to end.
- state: refused
  description: '**Stopped at a permission or a licence boundary**, with the reason named.'
notes: '**IdentityService at 32% and the platform, partner and support sign-ins all uncovered.** F56
  walks the guest front door; **this walks the one that matters more** — a platform admin session has
  cross-tenant reach.'
openQuestions: null
