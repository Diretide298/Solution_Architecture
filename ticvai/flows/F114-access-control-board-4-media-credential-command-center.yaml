id: F114
name: 'Access Control board 4: Media & Credential Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Access Control board 4. **This route is read from the screens'
    own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-174
  entryPoints:
  - Arrives at Media & Credential Command Center
steps:
- step: 1
  screen: BO-174
  action: Opens Media & Credential Command Center
  operations:
  - listMediaCredential
  outcome: Central management page for every media and verification technology supported by Access Control.
- step: 2
  screen: BO-175
  action: Works in Media Type & Technology Library
  operations:
  - listMediaTypeTechnology
  outcome: Define reusable media technologies. The matrix expects support for linear barcode, two-dimensional
    codes, magnetic strips, contact/proximity RFID, NFC and biometric readers.
- step: 3
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-176
  action: Works in Virtual Credential & Media Association
  operations:
  - listVirtualCredentialMedia
  outcome: Associate one virtual ticket identity with its permitted media representations.
- step: 5
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-177
  action: Works in Verification Method Selection & Locking
  operations:
  - listVerificationMethodSelection
  outcome: Control which verification method the guest chooses and when it becomes locked. The matrix
    specifies that although a ticket may technically support physical card, Dynamic QR, Face Pass and
    Face Tag, the customer should select one verification method. It may be changed before first successful
    verification, but after that the guest cannot change it; authorized venue operations may do so when
    necessary.
- step: 7
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-178
  action: Works in Media Issuance & Encoding Profile
  operations:
  - listMediaIssuanceEncoding
  outcome: Configure how ticket identity is written or encoded onto each medium. The source requires ticket
    IDs to be generated as 2D barcode, QR or RFID and requires randomized, always- unique identifiers
    to reduce fraud.
- step: 9
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-179
  action: Works in Media Swap & Replacement
  operations:
  - listMediaSwapReplacement
  outcome: Transfer a ticket from one medium to another without changing the underlying virtual ticket.
    This directly covers the matrix requirement to swap RFID to barcode/QR or vice versa while transferring
    the attached information.
- step: 11
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-180
  action: Works in RFID & NFC Configuration
  operations:
  - setRfidNfc
  outcome: Provide dedicated configuration for proximity credentials. The matrix requires RFID—including
    ISO 15693—and NFC, as well as multi-range RFID scanning at near, medium and far ranges.
- step: 13
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-181
  action: Works in External & Partner Credential Mapping
  operations:
  - listExternalPartnerCredential
  outcome: Allow TICVAI Access Control to understand credentials generated by other systems. The matrix
    explicitly requires reading reseller/external partner ticket formats and barcodes generated by other
    systems.
- step: 15
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-182
  action: Works in Hotel, Wallet & External Media Integration
  operations:
  - listHotelWalletExternal
  outcome: Configure specialized external credential ecosystems. The source specifically requires hotel
    room-card integration at access points and an interface to the hotel's property-management system
    for room billing.
- step: 17
  screen: BO-174
  action: Returns to the board's landing screen
  operations:
  - listMediaCredential
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-183
  action: Works in Media Compatibility, Testing & Publication
  operations:
  - publishMediaCompatibilityTesting
  outcome: Ensure that every configured medium works with the intended access-control hardware before
    deployment. This is particularly important because the matrix says the solution should operate with
    hardware selected by the venue, while hardware limitations must be highlighted and recommended equipment
    exposed for procurement decisions.
branches:
- at: 1
  condition: Nothing has been set up on Media & Credential Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Access Control board 4 visited
primaryContract: access
contracts:
- access
