$schema: ./_schema.yaml
id: F50
name: A guest arrives, parks, and gets in
actor: guest
capability: Arrival
wave: 3
frequency: Routine.
criticality: revenue
primaryContract: access
contracts:
- access
- orders
platforms:
- P02
trigger:
  description: A guest is driving to the venue with a ticket on their phone. **Every guest makes this
    journey and none of it was walked.**
offlineBehaviour: '**The ticket must work offline.** A car park with no signal is the ordinary case,
  and a QR that needs a network is a barrier that does not lift.'
steps:
- step: 1
  screen: GST-027
  action: They add parking to their cart on the way.
  operations:
  - addCartLine
  outcome: '**Parking is a product in the ordinary cart**, not a separate booking (decided 28 September,
    audit R166). **No live availability in the first release**: the line is accepted or refused against
    the facility''s capacity, never against a sensor count.'
- step: 2
  screen: GST-009
  action: They pay in the basket, and the parking entitlement is issued (R166; GFIX-3, 2 October).
  operations:
  - checkoutCart
  - createPayment
  outcome: '**Payment issues the parking entitlement, carrying the order id** (audit R166). It goes on
    the same media as the ticket, which is why a barrier and a gate read the same thing.'
- step: 3
  screen: GST-028
  action: It is confirmed with a facility.
  operations:
  - getOrder
  - listParkingFacilities
  outcome: '**Facility, not space.** Reserving a numbered bay is a promise a venue cannot keep on a busy
    Saturday.'
  crossesDevice: true
- step: 4
  screen: GST-012
  action: They open their tickets.
  operations:
  - listMyEntitlements
  - getEntitlement
  outcome: Everything they hold, for today and later.
  crossesDevice: true
- step: 5
  screen: GST-013
  action: They open the one for now.
  operations:
  - getEntitlementCredential
  - getEntitlementHistory
  outcome: '**The credential, not the ticket.** What a gate reads is a rotating credential — and the
    history is what answers *has this been used*.'
  crossesDevice: true
- step: 6
  screen: GST-055
  action: The QR rotates as they walk to the gate.
  operations:
  - getEntitlementCredential
  outcome: '**Dynamic because a screenshot is a ticket somebody can send.** A static code sold on twice
    is the fraud this prevents.'
  crossesDevice: true
exitStates:
- state: admitted
  description: Parked and inside.
- state: parkedOffsite
  description: Facility full, alternative taken.
- state: refusedAtGate
  description: '**Rare, and it needs a reason the guest can act on.**'
branches:
- at: 1
  condition: The car park is full.
  behaviour: '**`addCartLine` refuses the parking line `soldOutForDay`**: the entitlements issued for the
    day have reached the facility''s capacity (decided 28 September, audit R166). Told before they drive,
    not at the barrier. **A guest turned away at a full car park has already spent forty minutes.**'
  severity: high
  resolvedBy: addCartLine
- at: 6
  condition: The phone has no signal at the gate.
  behaviour: '**The credential is already on the device and rotates locally.** This is the case it was
    designed for.'
  severity: high
  resolvedBy: getEntitlementCredential
notes: '**Written 24 August.** The arrival journey — and `GST-055` dynamic QR had never appeared in
  a flow despite being the anti-fraud mechanism the whole ticketing model rests on.'
openQuestions: null
