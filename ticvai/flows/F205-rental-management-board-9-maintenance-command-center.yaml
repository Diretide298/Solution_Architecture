- step: 17
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-583
  action: Works in Maintenance Intelligence & Predictive AI
  operations: []
  outcome: Use AI to move TICVAI from reactive maintenance toward predictive maintenance. This is where
