steps:
- step: 1
  screen: BO-574
  action: Opens Maintenance Command Center
  operations: []
  outcome: Provide maintenance teams and rental management with a real-time view of rental asset health
    and maintenance workload.
- step: 2
  screen: BO-575
  action: Works in Maintenance Rule & Service Plan Configuration
  operations: []
  outcome: Define when different rental products/assets require preventive maintenance. This is important
    because maintenance should not depend only on staff manually noticing a problem.
- step: 3
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-576
  action: Works in Maintenance Calendar & Scheduling
  operations: []
  outcome: Plan preventive and corrective maintenance while understanding its effect on rental capacity.
    The original requirement specifically calls for scheduled maintenance periods.
- step: 5
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-577
  action: Works in Maintenance Work Order
  operations: []
  outcome: Create and manage the actual repair/service job.
- step: 7
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-578
  action: Works in Technician Repair Workspace
  operations: []
  outcome: Provide the technician with a focused operational screen for executing maintenance.
- step: 9
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-579
  action: Works in Parts, Cost & Maintenance Expense Tracking
  operations: []
  outcome: Capture the operational cost associated with maintaining rental equipment. This should integrate
    with the broader Inventory/Procurement and Finance modules rather than recreate them.
- step: 11
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-580
  action: Works in Asset Maintenance History & Lifecycle
  operations: []
  outcome: Provide the complete maintenance history of an individual serialized rental asset. The original
    requirement specifically requires maintenance history tracking.
- step: 13
  screen: BO-574
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-581
  action: Works in Return-to-Service Inspection & Approval
  operations: []
