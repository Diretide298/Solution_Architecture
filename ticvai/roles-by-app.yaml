$id: ticvai/roles-by-app.yaml
title: Permissions each shipped app requires
generatedBy: tools/derive-app-roles.py
generated: '2026-10-06'
description: '**Derived from what each app''s screens call, not decided here.** For every app, the permissions
  its operations declare in `x-ticvai-permission`, tiered by what the key permits. Role names, headcounts
  and the approval hierarchy are deliberately absent: who at a venue may configure pricing is the client''s
  decision and a plausible answer written here would be read as one they made.'
theTwoVocabularies:
  onOperations: 174
  inRolesYaml: 43
  shared: 0
  note: '**Zero shared keys.** The contracts carry 174 permission keys across 2627 operations; `roles.yaml`
    grants 43, all of them POS. `check-screens` validates a screen''s `guard` against `roles.yaml`, so
    the only guards anyone could write were POS ones — and that is what the package shows: venue-pos declares
    every guard in it and the other four apps declare none. **Joining these two is the work; this file
    is the evidence for what the join has to cover.**'
tiers:
  read: Sees it. The floor of any signed-in session, and the tier a read-only audit or a duty manager
    covering an unfamiliar area sits at.
  operate: Does the day's work. Everything a person on shift needs and nothing that changes how the venue
    is set up.
  configure: Changes how it works for everyone else. The tier that needs a named owner, because a change
    here outlives the shift that made it.
