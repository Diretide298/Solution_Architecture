id: DIAGRAMS
title: TICVAI — high level and low level, by layer
generatedBy: tools/derive-diagrams.py
about: '**Two levels, five subjects.** The high level is one file per subject and fits on a canvas;
  the low level is one file per thing and does not.


  **Every file is derived and none is authored.** A hand-maintained diagram in a package with nine validators
  is the one artefact that goes stale silently — nothing fails when it is wrong. `check-package` refuses
  a diagram older than the decomposition it is drawn from.'
howToRead: Start at `hld/00-platform.yaml` — actors, surfaces, services, stores, externals, regions.
  Every node carries a `ref` at the file below it.
notCovered:
  db: '**The DB layer already has both and they are computed** — the Galaxy view is the schema overview
    and the drill-down is the table detail. **A YAML restating a live view is a file that can disagree
    with it**, which is the failure this folder exists to avoid.'
  decisions: 29 ADRs and a conflict register. Prose, and it should stay prose.
