notes: '**A guest''s pick on a venue map, held while they pay** (decided 29 September, rev 3 REV3-15
  and GAP-C2, superseding audit R073 (c) for resources on an ingested map). The counterpart of the seat
  hold and modelled the same way: `extendResourceHold` moves `expiresAt` and not the state, and while
  a hold is `held` the resource shows as `held` in `getMapResourceAvailability` and is a conflict for
  `bookResource` and `allocateResources`.'
