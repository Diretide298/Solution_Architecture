- from: acknowledged
  to: resolved
  operation: decideAiGovernanceAlert
  trigger: operation
  guard: Resolved after acknowledgement
- from: open
  to: resolved
  operation: promoteAiRelease
  trigger: operation
  guard: A `promotionReady` alert is resolved when a person promotes the release it names (design 3.12).
    **Monitoring never switches a model** (AIC-252)
- from: acknowledged
  to: resolved
  operation: promoteAiRelease
  trigger: operation
  guard: A `promotionReady` alert, acknowledged, resolved by the promotion
- from: open
  to: incidentOpened
  operation: decideAiGovernanceAlert
  trigger: operation
  guard: Decision `openIncident`. Opens an AI incident, or adds the alert to the one named by `incidentId`
- from: acknowledged
