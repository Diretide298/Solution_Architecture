  operation: decideAiGovernanceAlert
  trigger: operation
  guard: Decision `dismiss`, with a note. A dismissed `promotionReady` alert leaves the model in shadow
- from: acknowledged
  to: dismissed
  operation: decideAiGovernanceAlert
  trigger: operation
  guard: Dismissed after acknowledgement, with a note
- from: open
  to: resolved
  operation: decideAiGovernanceAlert
  trigger: operation
