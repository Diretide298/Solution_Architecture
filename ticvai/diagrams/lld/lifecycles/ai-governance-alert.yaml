notes: '`dismissed`, `resolved` and `incidentOpened` are final; a closed alert is refused (`409 alert-not-open`).
  A condition that recurs raises a new alert. Where `openIncident` creates the incident, `ai.incidentOpened`
  is published by that creation (states/ai-incident.yaml), not by this alert.'
