description: '**A governance alert** (AI design 4.4, AIC-210..223; ADM-549..555), raised by monitoring,
  by a failed control test (`runAiControlTest`, `controlFailed`) or by a shadow model passing its gate
  (`promotionReady`, design 3.12). Kept separate from operational incidents (AIC-250).'
