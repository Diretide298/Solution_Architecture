id: LLD-TenancyService
title: TenancyService — 136 operations, 78 tables
generatedBy: tools/derive-diagrams.py
tier: foundation
index: diagrams/hld/02-services.yaml
why: '**`platform.org_unit` is reached by 304 of 379 tables** — the tenancy spine. Workforce and approvals
  are folded in because each is small, both read `org_unit` constantly and write it rarely, and splitting
  them means three services doing the same joins.


  **`shift` was folded in here on 24 August and moved to OrderService the same day.** The reasoning
  was that a shift owns no tables of its own — which is true — and the conclusion was wrong. **A service
  with no data belongs where its data is**, and a shift''s data is entirely in `orders`: `orders.shift`,
  `orders.deposit_box`, `orders.cash_movement`, `orders.cash_count_line`.


  **The coupling made it visible.** All 43 of Tenancy''s cross-service touches into `orders` were the
  `shift` contract — 19 writes and 24 reads, the heaviest coupling in the platform, created to solve
  a cosmetic problem.'
scale: Read-heavy and highly cacheable. Config changes are rare.
ifDown: Same as identity — nothing runs without a scope.
coverage:
  operations: 136
  inAFlow: 32
  percent: 62%
  note: '**Flow coverage is how much of this service a journey has walked.** A service under 40% is
    unwalked rather than under-documented.'
