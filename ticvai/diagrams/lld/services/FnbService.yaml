id: LLD-FnbService
title: FnbService — 99 operations, 34 tables
generatedBy: tools/derive-diagrams.py
tier: operations
index: diagrams/hld/02-services.yaml
why: '**96 operations and 34 tables — the largest single domain after marketing.** Its own service because
  a kitchen pass has a latency profile nothing else shares: a bump must land in under a second on a
  display that may be offline.'
scale: Write-heavy during service, idle between. **Two peaks a day, sharply.**
ifDown: Down means the kitchen falls back to paper. Offline-capable by design.
coverage:
  operations: 99
  inAFlow: 70
  percent: 73%
  note: '**Flow coverage is how much of this service a journey has walked.** A service under 40% is
    unwalked rather than under-documented.'
