why: Branding, content, navigation and the tenant's own app configuration. Separate because **it is
  the only service a tenant edits directly and publishes from** — its deploy cadence follows tenant
  appetite, not the platform's.
scale: Read-heavy and heavily cached. Published, not queried.
ifDown: Down freezes the current published config. Guests see the last good version.
