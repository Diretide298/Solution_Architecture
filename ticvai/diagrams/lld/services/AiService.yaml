- store: cache:answer
  kind: cache
  columns: 5
  backing: redis
  owned: false
  why: '**Not a table and not owned by a service.** Derived from something already read, losable without
    consequence — no migration, no backup, no owner.'
  key: '**question hash + scope_path + locale.** Scope is part of the key — a cache keyed on the question
    alone is a cross-venue leak'
  eviction:
  - 'expires_at: `AiPolicy.cacheTtlMinutes`. An upper bound on top of event invalidation, not instead
    of it'
  - 'invalidated_by: Which event dropped it, kept for a period so a stale answer can be traced'
  writtenBy:
  - semanticSearch
  - sendAiMessage
  readBy:
  - semanticSearch
  - sendAiMessage
- store: cache:embedding
  kind: cache
  columns: 4
  backing: redis
  owned: false
  why: '**Not a table and not owned by a service.** Derived from something already read, losable without
    consequence — no migration, no backup, no owner.'
  key: '**content hash + model.** The key changes when the content does, which is why invalidation is
    trivial'
  eviction: null
  writtenBy:
  - ingestKnowledgeDocument
  - reindexSource
  - removeIndexEntry
  readBy:
  - ingestKnowledgeDocument
