  bundleUpdate: on next idle
  hosting: in-cell, in-region
  storeReview: false
  deviceOwnership: venue-owned, wall-mounted, never moved
  networkAssumption: venue LAN, and it must survive losing it
  releaseCadence: '**Deployed when the kitchen is closed, never during service.** A display that restarts
    mid-service loses the rail a chef is reading.'
why: '**Its own platform, and the placement rule is what put it here.** Three questions decide where
  a board screen rests, and a kitchen display answers all three differently from a back office: it is
  used standing, it **must survive the network going down because the kitchen still has to send food
  out**, and no existing platform does it — P08 had a `Kitchen Display` screen among 143 back-office
  screens, which is a rail buried in a configuration tool.


  **Nobody logs in.** It is on when the kitchen is open and resolves its station from the device assignment,
  which is why every screen here is cold-entry and none of them has a sign-in.


  **Dark theme only.** A kitchen is lit for cooking, not for reading, and a white screen at head height
  in a service window is a light source.


  **Depends on `offline-core`.**  refused the platform without it, and correctly — **an app that queues
  writes without it does not queue them anywhere**, and every bump on this platform is a write that
  has to survive a dropped network.'
