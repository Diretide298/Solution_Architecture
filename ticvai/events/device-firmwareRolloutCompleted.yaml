# device.firmwareRolloutCompleted v1 — published by tenancy
# Checked by tools/check-states.py against states/ and the contracts.

name: device.firmwareRolloutCompleted
version: 1
publisher: tenancy
description: A firmware rollout finished — completed, halted on its failure threshold, or rolled back.
aggregate: deviceRollout
emittedWhen: DeviceFirmwareRollout.status reaches completed, halted or rolledBack
payload:
- field: rolloutId
  type: uuid
- field: firmwareId
  type: uuid
- field: version
  type: string
- field: outcome
  type: string
  notes: completed, halted or rolledBack
- field: succeededCount
  type: integer
- field: failedCount
  type: integer
- field: scopePath
  type: string
- field: finishedAt
  type: timestamp
consumers:
- context: public-api
  purpose: Deliver to webhook subscriptions taking device.firmwareRolloutCompleted (16.9.56)
  idempotencyKey: rolloutId + outcome
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Added 29 September (build pass, group RD).** No state model emits this yet: `DeviceFirmwareRollout.status` has no model, so the
  emit sits on the rollout job and on `rollbackDeviceFirmware`.'
