# assets.guestUploadChanged v1 — published by assets
# Added 29 October 2026 (r11 gate; CHG-R11FXV-001; the lead's r10 ruling on the ADR-0028 tiers, CHG-R10ID-018):
# Identity checks the uploads a guest submits for identity verification against its own projection of the guest's
# uploads, so the upload rows reach it by this event.

name: assets.guestUploadChanged
version: 1
publisher: assets
description: A guest's identity-document or selfie upload was completed, or deleted.
aggregate: guestUpload
emittedWhen: completeGuestUpload marks the upload uploaded, or the retention job deletes it
emittedBy:
- assets.completeGuestUpload
payload:
- field: uploadId
  type: uuid
- field: subjectId
  type: uuid
  notes: The guest who uploaded it (GuestUpload.subjectId)
- field: purpose
  type: string
  notes: GuestUpload.purpose (identityDocument, selfie)
- field: status
  type: string
  notes: GuestUpload.status after the change (uploaded, deleted)
- field: changedAt
  type: timestamp
consumers:
- context: identity
  purpose: Keep identity.guest_upload_ref, the guest's uploads as Identity knows them (assets#guestUploadsForIdentity),
    so submitGuestIdentityDocument checks documentAssetId and selfieAssetId without reading assets.guest_upload
    (ADR-0028)
  writes:
  - identity.guest_upload_ref
  idempotencyKey: uploadId + changedAt
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: No state model emits this. An older redelivery (changedAt before the row's) changes nothing.
