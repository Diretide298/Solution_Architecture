# tenant.provisioned v1 — published by subscription
# Added 20 October 2026 (r8 cause FOUNDATION-AI-C43): AI creates a new tenant's vector store when the tenant exists.

name: tenant.provisioned
version: 1
publisher: subscription
description: A tenant's database was provisioned on a cell and the tenant can be used.
aggregate: tenant
emittedWhen: 'TenantStatus onboarding to active: Subscription''s provisioning job (subscription#tenantProvisioning, a
  Control Plane job; the lead, 2 November 2026, CHG-R13INT-012), handed the tenant by createTenant or a verified
  onboarding application, writes it to control.outbox in the transaction that marks the tenant active once its cell
  is ready; drained by the workers relay. No operation emits it directly, as for tenant.suspended'
payload:
- field: tenantId
  type: uuid
- field: cellId
  type: uuid
- field: databaseName
  type: string
- field: provisionedAt
  type: timestamp
consumers:
- context: ai
  purpose: 'Create the tenant''s Qdrant collection and alias and record them, with the issued token''s expiry, on
    ai.vector_store (ADR-0049; the workers host holds the admin key and issues the token)'
  writes:
  - ai.vector_store
  idempotencyKey: tenantId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
