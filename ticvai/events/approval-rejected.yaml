# approval.rejected v1 — published by approvals
# Checked by tools/check-states.py.

name: approval.rejected
version: 1
publisher: approvals
description: An approval request was refused.
aggregate: approvalRequest
emittedWhen: ApprovalStatus pending or escalated to rejected
emittedBy:
- decideApprovalRequest
payload:
- field: requestId
  type: uuid
- field: kind
  type: string
- field: subjectContract
  type: string
- field: subjectId
  type: uuid
- field: reason
  type: string
  notes: '**Required.** The only signal to the requester and to the analytics'
- field: rejectedByPrincipalId
  type: uuid
- field: rejectedAt
  type: timestamp
consumers:
- context: orders
  purpose: Void the held action and tell the requester
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: marketing
  purpose: Notify the requester (11.1.19)
  idempotencyKey: requestId
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Close the action plan waiting on this approval, as rejected (AI system design section 3.2)
  idempotencyKey: requestId
  onFailure: retry
  isCritical: false
- context: subscription
  purpose: Apply the rejection to the partner record it was about (agreement, application, change request).
    decideApprovalRequest runs in commerce and the partner tables are in the control database, which
    PlatformService owns in operations (ADR-0055 rule 4, ADAM CR-002, CHG-R6-020). A rejected tenant
    suspension or reactivation (ADAM CR-172) changes nothing on the tenant
  writes:
  - control.partner_agreement
  - control.partner_application
  - control.partner_change_request
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: marketing
  purpose: Apply the rejection to the privacy-notice governance record it was about; the marketing schema is
    MarketingService's, in operations (ADR-0055 rule 4, ADAM CR-002, CHG-R6-020)
  writes:
  - marketing.privacy_notice_governance
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: white-label
  purpose: Mark the white-label version rejected (`reviewStatus` rejected); it never becomes current, when
    `subjectType` is `whiteLabelPublication` (ADAM CR-154, 18 October 2026; CHG-CRA-004)
  writes:
  - whitelabel.config_version
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: identity
  purpose: 'A guest''s privacy request rejected (`subjectContract` identity; ADAM CR-101, CHG-R10ID-016): a
    `subjectDataExport` request''s identity.subject_data_export row ends `rejected` with no file; a `subjectErasure`
    request closes unfulfilled and nothing is erased'
  writes:
  - identity.subject_data_export
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: catalogue
  purpose: '**Catalogue''s approval consumer, by `subjectType`** (the consumer ADAM CR-415 adds for `pricingRecommendation`).
    For `subjectType` `dynamicPricingControl` (ADAM CR-425, CHG-CR425-001): the rejected raise is dropped,
    `pending_automation_level` and `pending_approval_request_id` cleared on the row whose pending request is
    `requestId`, and `automation_level` keeps the current level; a row whose pending request is another, or none,
    changes nothing. For `subjectType` `rollbackAction` (ADAM CR-421): an outcome for a pricing rollback that is no
    longer `requested` or `scheduled` (cancelled with cancelPricingRollback, which cancels its request in process)
    changes nothing. For `subjectType` `pricingRecommendation` : (CHG-CR415-001; `subjectContract`
    catalogue, the request decidePricingRecommendation raised on `sendForApproval` for `subjectType`
    `pricingRecommendation`; ADAM CR-415, decided 31 October 2026). The recommendation is the one whose decision row''s
    approval_request_id is `requestId` (this payload carries no `subjectType`). A recommendation still `sentForApproval`
    moves to `rejected`; any other state changes nothing.'
  writes:
  - catalogue.dynamic_pricing_control
  - catalogue.pricing_recommendation
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: Retained with the request. This is an audit record, not an operational message
notes: Critical on the owning contract because **a rejected refund left in `pendingApproval` is a refund
  that neither happens nor fails**, and the guest is told nothing.
