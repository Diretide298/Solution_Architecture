# entitlement.statusChanged v1 — published by catalogue
# Checked by tools/check-states.py against states/ and the contracts.

name: entitlement.statusChanged
version: 1
publisher: catalogue
description: An entitlement was frozen, suspended, reinstated or had its validity moved by a renewal.
aggregate: entitlement
emittedWhen: freezeEntitlement, suspendEntitlement or reinstateEntitlement succeeds, or a membership renewal (orders renewMembership) extends the entitlement's validity
emittedBy:
- freezeEntitlement
- suspendEntitlement
- reinstateEntitlement
payload:
- field: entitlementId
  type: uuid
- field: change
  type: string
  notes: One of frozen, suspended, reinstated, validityExtended
- field: reason
  type: string
  required: false
- field: membershipId
  type: uuid
  required: false
  notes: Set when the entitlement belongs to a membership
- field: episodeStart
  type: timestamp
  required: false
- field: episodeEnd
  type: timestamp
  required: false
- field: validTo
  type: timestamp
  notes: The validity after the change
- field: approvalRequestId
  type: uuid
  required: false
- field: changedAt
  type: timestamp
consumers:
- context: identity
  purpose: Append the episode to identity.membership_history (freeze and suspension treatment, new expiry), and
    set the new validTo on the entitlement's identity.subject_holding row (ADAM CR-084, CHG-GDL-001)
  writes:
  - identity.membership_history
  - identity.subject_holding
  idempotencyKey: entitlementId + changedAt
  onFailure: retryThenDeadLetter
  isCritical: false
- context: access
  purpose: Set the frozen or suspended flag and the validity on access.entitlement, which Access owns, and refresh
    the offline validation bundle, so a frozen or suspended pass stops admitting at a gate without a network.
    Catalogue runs in commerce and cannot write the access schema (ADR-0055 rule 4, ADAM CR-002, CHG-R6-020)
  writes:
  - access.entitlement
  idempotencyKey: entitlementId + changedAt
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Added 29 September (writers pass) so membership history has a source.** `identity.membership_history`
  gained per-episode freeze and suspension columns and no API writes it: identity fills it from this event.

  No state model emits this: **suspended and frozen are flags on an issued entitlement, not states**
  (`states/entitlement-status.yaml`, the `issued -> issued` transition on `suspendEntitlement`), and a
  renewal moves validity, not status. So the emit sits on the operations named in `emittedWhen`.'
