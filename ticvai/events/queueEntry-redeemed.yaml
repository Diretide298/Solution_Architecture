# queueEntry.redeemed v1 — published by queue
# Checked by tools/check-states.py against states/ and the contracts.
# ADAM CR-238, option B (Chinmay, 25 October 2026; CHG-R10ORD-007): redeemWaitingGuest does not call Access.

name: queueEntry.redeemed
version: 1
publisher: queue
description: A party with a Fast Pass entitlement was admitted at the ride from its virtual queue entry, and the
  entitlement's use is Access's to take.
aggregate: queueEntry
emittedWhen: QueueEntryStatus to redeemed, by redeemWaitingGuest (from called) or overrideWaitingGuest (from called,
  expired or noShow; CHG-R10ORD-023), where the entry carries an entitlementId
emittedBy:
- queue.redeemWaitingGuest
- queue.overrideWaitingGuest
payload:
- field: entryId
  type: uuid
  notes: The queue entry (queue.entry.id); with the event id, what makes a redelivery a duplicate
- field: queueId
  type: uuid
- field: venueId
  type: uuid
- field: entitlementId
  type: uuid
  notes: The entry's Fast Pass entitlement (access.entitlement.id). The event is written only when the entry carries one
- field: accessPointId
  type: uuid
  required: false
  notes: The queue's access point (queue.queue.access_point_id); null where the queue names none
- field: admittedCount
  type: integer
  required: false
  notes: The party admitted, which may be fewer than its size
- field: recordedAt
  type: timestamp
  notes: When the device redeemed the entry. Differs from the time the server heard on an offline redemption
consumers:
- context: access
  purpose: Take the entitlement's use at the queue's access point, as validateAccess would have (entriesUsed up by
    one and the entitlement's status moved by states/entitlement-status.yaml), so a Fast Pass cannot be used twice.
    Access owns access.entitlement, so Queue never writes it (ADR-0055 rules 3 and 4; backend-patterns 3.5)
  operation: access.recordQueueRedemptionUse
  writes:
  - access.entitlement
  idempotencyKey: entryId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Why an event and not a call** (ADAM CR-238, option B, 25 October 2026). Queue runs in the operations
  deployable and Access in access (ADR-0055); redeemWaitingGuest used to call access.validateAccess, an undeclared
  call into another host with no service route and no serviceAuth built (CR-174, CR-196), and a write into Access''s
  entitlement from Queue would cross the module boundary. The redemption is recorded in queue.entry and this event
  is written through the outbox in the same transaction; Access consumes it. It works offline: a redemption made on
  a disconnected device writes the event when the device syncs. redeemWaitingGuest answers entitlementRemaining null.


  **Critical, because a lost event is a Fast Pass used without its use taken.** Dead-lettered, it is replayed.'
