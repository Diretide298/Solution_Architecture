# approval.withdrawn v1 — published by approvals
# Added 20 October 2026 (R8 blocker cause APPROVALS-TENANCY-C38, option A; the generators lane's request, applied at
# the r8 integration, CHG-R8INT-016): a withdrawn request held an action somewhere, and nothing told its holder.
# Checked by tools/check-states.py.

name: approval.withdrawn
version: 1
publisher: approvals
description: The requester took an approval request back before anyone decided it.
aggregate: approvalRequest
emittedWhen: ApprovalStatus pending or escalated to withdrawn
emittedBy:
- withdrawApprovalRequest
payload:
- field: requestId
  type: uuid
- field: kind
  type: string
- field: subjectContract
  type: string
- field: subjectId
  type: uuid
- field: withdrawnByPrincipalId
  type: uuid
- field: withdrawnAt
  type: timestamp
consumers:
- context: orders
  purpose: Void the held action, as for approval.rejected; nobody refused it, so the requester is not told it was refused
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Withdrawal analytics, kept apart from rejections (11.1.22)
  idempotencyKey: requestId
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Close the action plan waiting on this approval, as withdrawn (AI system design section 3.2)
  idempotencyKey: requestId
  onFailure: retry
  isCritical: false
- context: identity
  purpose: 'A guest''s privacy request withdrawn (`subjectContract` identity; ADAM CR-101, CHG-R10ID-016): a
    `subjectDataExport` request''s identity.subject_data_export row ends `rejected` with no file; a `subjectErasure`
    request closes unfulfilled and nothing is erased'
  writes:
  - identity.subject_data_export
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: catalogue
  purpose: '**Catalogue''s approval consumer, by `subjectType`** (the consumer ADAM CR-415 adds for `pricingRecommendation`).
    For `subjectType` `dynamicPricingControl` (ADAM CR-425, CHG-CR425-001): the withdrawn raise is dropped,
    `pending_automation_level` and `pending_approval_request_id` cleared on the row whose pending request is
    `requestId`, and `automation_level` keeps the current level; a row whose pending request is another, or none,
    changes nothing. For `subjectType` `rollbackAction` (ADAM CR-421): an outcome for a pricing rollback that is no
    longer `requested` or `scheduled` (cancelled with cancelPricingRollback, which cancels its request in process)
    changes nothing. For `subjectType` `pricingRecommendation` : (CHG-CR415-001; `subjectContract`
    catalogue, the request decidePricingRecommendation raised on `sendForApproval` for `subjectType`
    `pricingRecommendation`; ADAM CR-415, decided 31 October 2026). The recommendation is the one whose decision row''s
    approval_request_id is `requestId` (this payload carries no `subjectType`). A recommendation still `sentForApproval`
    moves to `rejected`; any other state changes nothing.'
  writes:
  - catalogue.dynamic_pricing_control
  - catalogue.pricing_recommendation
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
