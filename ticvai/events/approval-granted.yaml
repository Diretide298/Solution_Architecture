# approval.granted v1 — published by approvals
# Checked by tools/check-states.py.

name: approval.granted
version: 1
publisher: approvals
description: An approval request was granted at its final level.
aggregate: approvalRequest
emittedWhen: ApprovalStatus pending or escalated to approved
emittedBy:
- decideApprovalRequest
payload:
- field: requestId
  type: uuid
- field: kind
  type: string
- field: subjectContract
  type: string
  notes: '**Which contract must now act.** The consumer is the owner of the thing approved'
- field: subjectType
  type: string
- field: subjectId
  type: uuid
- field: scopePath
  type: string
- field: amount
  type: Money
- field: approvedByPrincipalId
  type: uuid
  notes: The final approver, who is also the principal the action executes under
- field: levels
  type: integer
- field: grantedAt
  type: timestamp
consumers:
- context: orders
  purpose: Release a held refund or discount
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: shift
  purpose: Accept a variance
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: platform-ops
  purpose: Promote a release
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: ai
  purpose: Mark a proposed action approved
  idempotencyKey: requestId
  onFailure: retry
  isCritical: false
- context: cache
  purpose: Drop cached answers under the affected scope. **The same event that invalidates the index
    invalidates the answer** — a cached answer that outlives a price change has misled a guest on the
    venue’s behalf, which is worse than a slow one
  idempotencyKey: scopePath+eventId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: subscription
  purpose: Apply the decision to the partner record it was about (agreement, application, change request).
    decideApprovalRequest runs in commerce and the partner tables are in the control database, which
    PlatformService owns in operations (ADR-0055 rule 4, ADAM CR-002, CHG-R6-020). **And to a tenant**
    (`subjectContract` subscription, `subjectType` tenant; ADAM CR-172, 19 October 2026, CHG-CRA-005; fix round
    3), the way white-label's consumer below applies a reviewed publishTenantConfig - it learns what to apply from
    the record the call wrote, named by the event (and a version that waits is validated again when it falls due).
    suspendTenant and reactivateTenant
    write only the approval request, and the payload names the tenant (`subjectId`) and not the change, so the
    consumer reads that request by `requestId` through approvals#requestRecords (route service, the declared query
    Subscription already reads approvals.request through) for its stored `attributes`
    (ApprovalRequest.attributes), and reads the tenant from control.tenant. It then re-checks the tenant and, in
    one transaction - `attributes.action` suspend applies the suspension suspendTenant raised (now, or pending
    until its effectiveAt) and writes tenant.suspended to control.outbox; reactivate moves the tenant to active or
    cancels its pending suspension. **Re-checked on arrival**, since the tenant may have moved while the request
    was open. Already in the target state (suspended, or active with a suspension granted and not yet in effect,
    which counts as suspended and keeps its time, mode and notice; or, for reactivate, active with nothing
    pending) changes nothing and is recorded as a no-op; a state that no longer allows the change (suspend -
    onboarding, terminating or terminated, tenant-not-active; reactivate - terminated, tenant-terminated, or
    onboarding, tenant-not-suspended) changes nothing, with that reason. The approved request itself never
    changes (approvals keeps it immutable); both outcomes are recorded on the request's approved-action
    execution, where approvals keeps whether an approved action ran (succeeded with a note; failed with
    failureReason the reason, and a Retry of it on BO-382 would be refused again by the same re-check, so it is
    closed with investigate and a note). The consumer is the only writer of the tenant row and of
    tenant.suspended on this path (lane H review 3 N-2, N-4; CHG-R8SPN-015)
  writes:
  - control.partner_agreement
  - control.partner_application
  - control.partner_change_request
  - control.tenant
  - control.outbox
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: marketing
  purpose: Apply the decision to the privacy-notice governance record it was about; the marketing schema is
    MarketingService's, in operations (ADR-0055 rule 4, ADAM CR-002, CHG-R6-020)
  writes:
  - marketing.privacy_notice_governance
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: white-label
  purpose: Make the approved white-label version current (`reviewStatus` approved, `isCurrent` true, the previous
    current version no longer current) and emit whitelabel.contentPublished, when `subjectType` is
    `whiteLabelPublication` (ADAM CR-154, 18 October 2026; CHG-CRA-004)
  writes:
  - whitelabel.config_version
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: white-label
  purpose: 'Publish or schedule a reviewed content block (`subjectType` `whiteLabelPublication`, `subjectId` a
    whitelabel.content_block row; ADAM CR-462, decided 2 November 2026; CHG-CR462-001), as publishContentBlock
    states. It reads the request by `requestId` through approvals#requestRecords (in process, CHG-R13INT-013) for the
    `publishAt` and `expireAt` the publish stored in its `attributes`, and the block from `subjectId`. A block no
    longer pending review, or now published or archived, changes nothing. Otherwise the stored schedule is applied
    by a direct publish''s rules at that moment (a missing, null or passed `publishAt` publishes now, a future one
    schedules, a missing `expireAt` keeps the stored one), with `reviewStatus` approved, in one transaction, and
    whitelabel.contentPublished is raised when the block publishes; an `expireAt` no longer after the moment it would
    go live publishes and schedules nothing and sets `reviewStatus` rejected'
  writes:
  - whitelabel.content_block
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: identity
  purpose: 'A guest''s privacy request (`subjectContract` identity; ADAM CR-101, CHG-R10ID-016). Subject type
    `subjectDataExport`: start the export job for the request''s identity.subject_data_export row (running, then ready
    or failed). Subject type `subjectErasure`: start the erasure job deleteGuestAccount raised, which waits for this
    decision where the tenant''s matrix adds an approval step'
  writes:
  - identity.subject_data_export
  - pii.subject
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: access
  purpose: 'Write a whitelist entry a second person approved (`subjectContract` access, `subjectType` whitelistEntry; ADAM
    CR-399, decided 31 October 2026; CHG-CR399-001), the way Subscription''s consumer applies a suspendTenant.
    addBlacklistEntry writes only the approval request, so the consumer reads it by `requestId` through
    approvals#requestRecords for its `attributes` (mediaCode, reason, expiresAt, disableScope) and writes the
    access.blacklist row with the request''s `subjectId` as its id, list_type whitelist, the attributes,
    added_by_principal_id the requester and added_at now, then records the outcome with approvals''
    recordApprovedActionOutcome (applied). A code listed while the request waited writes nothing and records notApplied
    duplicate-code; an expiresAt already passed writes nothing and records notApplied entry-expired'
  writes:
  - access.blacklist
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: catalogue
  purpose: '**Catalogue''s approval consumer, by `subjectType`** (the consumer ADAM CR-415 adds for `pricingRecommendation`).
    For `subjectType` `dynamicPricingControl` (ADAM CR-425, CHG-CR425-001): an automation raise
    setDynamicPricingGuardrailPolicy kept pending on the row whose `pending_approval_request_id` is `requestId` is
    applied, `automation_level` set to `pending_automation_level` and both pending columns cleared; a row whose pending
    request is another, or none, changes nothing. For `subjectType` `rollbackAction` (ADAM CR-421): an outcome for a
    pricing rollback that is no longer `requested` or `scheduled` (cancelled with cancelPricingRollback, which cancels
    its request in process) changes nothing. For `subjectType` `pricingRecommendation` :
    (CHG-CR415-001; `subjectContract` catalogue, `subjectType` `pricingRecommendation`; ADAM CR-415, decided 31 October 2026). The
    request is the one decidePricingRecommendation raised on `sendForApproval` (its decision row''s approval_request_id
    is `requestId`). A recommendation still `sentForApproval` moves to `accepted`; any other state changes nothing. No
    price changes here: createLiveDynamicPrice executes it, with this request as its approval reference.'
  writes:
  - catalogue.dynamic_pricing_control
  - catalogue.pricing_recommendation
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: Retained with the request. This is an audit record, not an operational message
notes: '**The event that replaces four bespoke callbacks.** Each owning contract consumed its own approval
  signal before this existed; now there is one, and adding a fifth approval kind means adding a consumer
  rather than a mechanism.


  Critical for the three that release money or ship code. A granted approval nobody acted on is a refund
  a guest was promised and never received.'
