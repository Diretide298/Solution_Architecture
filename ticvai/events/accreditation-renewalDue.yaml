# accreditation.renewalDue v1 — published by accreditation
# Checked by tools/check-states.py against states/ and the contracts.

name: accreditation.renewalDue
version: 1
publisher: accreditation
description: An accredited person's renewal window opened — their accreditation expires within the programme's renewalWindowDays.
aggregate: accreditationHolder
emittedWhen: The daily renewal run finds an active holder whose validTo is renewalWindowDays away (AccreditationValidity), once per holder per validity period
payload:
- field: holderId
  type: uuid
- field: accreditationNumber
  type: string
- field: programmeId
  type: uuid
- field: organisationId
  type: uuid
  required: false
- field: categoryCode
  type: string
  required: false
- field: validTo
  type: date
- field: renewalWindowOpensAt
  type: date
- field: renewalRequiresReverification
  type: boolean
- field: onExpiry
  type: string
  notes: One of revokeAccess, gracePeriod, autoRenew — what happens if nobody renews
- field: scopePath
  type: string
- field: raisedAt
  type: timestamp
consumers:
- context: marketing
  purpose: Send the renewalWindowOpen notification to the holder and their organisation (12.1.45), with the link to renewAccreditation
  idempotencyKey: holderId + validTo
  onFailure: retry
  isCritical: false
- context: public-api
  purpose: Deliver to webhook subscriptions taking accreditation.renewalDue (12.1.53)
  idempotencyKey: holderId + validTo
  onFailure: retryThenDeadLetter
  isCritical: false
- context: reporting
  purpose: Accreditation KPIs — renewals due against renewals made (12.1.50)
  idempotencyKey: holderId + validTo
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: '**Added 29 September (build pass, BL-180, 12.1.37 and 12.1.45).** Renewal opens a window rather than
  extending silently — the point of an expiry is that somebody looks again — and this is what tells them the
  window is open. **Keyed on holder and validTo**, so a renewal that moves validTo raises the next window
  once, and a rerun of the daily job raises nothing twice.


  No state model emits this: the window opening is a date passing, not a state change — the holder stays
  `active`. The daily run writes `platform.outbox` once per holder and validity period.'
