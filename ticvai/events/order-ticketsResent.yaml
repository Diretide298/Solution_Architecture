# order.ticketsResent v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.
# ADAM CR-506 (Chinmay, 3 November 2026; CHG-CR506-001): reprintOrder sends remote deliveries through Access.

name: order.ticketsResent
version: 1
publisher: orders
description: A guest or a member of staff asked for an order's tickets to be sent again by email, SMS or WhatsApp;
  Access delivers each credential.
aggregate: order
emittedWhen: reprintOrder with delivery email, sms or whatsapp, in the same transaction as its ticketsResent
  order_event row
emittedBy:
- orders.reprintOrder
payload:
- field: orderId
  type: uuid
- field: entitlementIds
  type: array
  notes: The tickets resent (the named lines' entitlements, or every line's)
- field: channel
  type: string
  notes: email, sms or whatsapp, as the request's delivery
- field: destination
  type: string
  required: false
  x-ticvai-secret: field-encrypted
  notes: Where to send; null means the recipient already on each credential (the order holds no plain contact),
    found by the consumer as its purpose states (ADAM CR-554). An email address or phone number, so field-encrypted
    through IFieldEncryption by the publisher and decrypted by the access consumer when it records the delivery,
    never in clear in the outbox or the broker (r13 system review C-16, CHG-R14H-004)
- field: subjectId
  type: uuid
  required: false
  notes: The order's orders.sales_order.subject_id, null when none, so Access can find the purchaser's contact
    (ADAM CR-554, CHG-CR554-001)
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: access
  purpose: 'Deliver each credential as deliverCredential does, one pending access.credential_delivery row per
    entitlement (sms is smsLink), so Orders sends nothing itself (ADAM CR-506). Settled on ADAM CR-554 (Chinmay, 3
    November 2026; CHG-CR554-001): each entitlementId is handled in one transaction per event. An entitlement whose
    status is cancelled, expired or surrendered is skipped with no row, as deliverCredential refuses those. Every other
    entitlement gets one row: id derived from the event id plus the entitlement id, so a redelivered event writes
    nothing new; entitlement_id; channel email, smsLink for sms, or whatsapp; recipient_role purchaser; attempt = 1 +
    the number of earlier rows for that entitlement on that channel; status pending; requested_at = the event''s at;
    venue_id and scope_path from the entitlement; requested_by_principal_id null. Destination: the event''s destination
    when it is given; when it is null, the destination of the most recent earlier row for that entitlement and channel;
    failing that, the order subject''s (subjectId) primary contact, read through Identity''s subjectContactRecords: the
    email kind for email, the phone kind for sms and whatsapp. If none is found, the row is still written pending with
    no destination, and the dispatch job moves it to failed with failure reason ''no recipient on file''.'
  writes:
  - access.credential_delivery
  idempotencyKey: eventId + entitlementId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Why an event** (ADAM CR-506, Chinmay, 3 November 2026; CHG-CR506-001). Access already sends and records
  credential deliveries (deliverCredential, access.credential_delivery), so a resend is handed to it rather than sent
  by Orders or by a second messaging path. Wallet passes are not sent: reprintOrder answers them.'
