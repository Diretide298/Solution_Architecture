- id: POS-024
  name: Outlet Setup
  module: Sell
  requiresModule: fnb
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/outlet-setup
    component: apps/venue-pos/src/routes/sell/OutletSetupBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    exitTo:
    - POS-002
    transitions:
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      provenance: derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId and POS-024
        holds none of them, so the edge carries nothing and POS-002 opens cold
  notes: '**Configuration on the till, gated by permission rather than by device.** P04 is *Terminal and Tablet*
    (`reactNativeTablet`) and ADR-0002 makes authorisation user-driven — **a manager signs into the same till a
    cashier uses and sees screens the cashier does not.**


    **A table layout is decided standing in the room.** A manager at a desk cannot see whether two four-tops push
    together, which is why `setTableLayout` and `setTableCombinations` belong within reach of the floor and not
    only in the back office.'
  density: touchLarge
  densityReason: '**A tablet on a POS platform is still a POS platform.**  refused comfortable and was right: the
    same person configuring the floor is the person who was selling on it ten minutes ago, and a screen that changes
    target size between those two is a screen they mis-tap.'
  pattern: listDetail
  purpose: A manager configures this outlet from the floor.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Venue id
        operation: listOutlets
        notes: Sends `?venueId=` to `listOutlets`.
        provenance: contract tenancy.yaml GET /outlets
      - kind: textField
        label: Kind
        operation: listOutlets
        notes: Sends `?kind=` to `listOutlets`.
        provenance: contract tenancy.yaml GET /outlets
      - kind: dataTable
        label: Every outlet
        bindsTo: Outlet
        columns:
        - Outlet.id
        - Outlet.code
        - Outlet.name
        - Outlet.venueId
        - Outlet.kind
        - Outlet.zone
        - Outlet.stockLocationId
        - Outlet.costCenterId
        - Outlet.openingHours
        - Outlet.isActive
        operation: listOutlets
        provenance: contract tenancy.yaml GET /outlets
      - kind: dataTable
        label: Every menu
        bindsTo: Menu
        columns:
        - Menu.id
        - Menu.code
        - Menu.name
        - Menu.outletId
        - Menu.availability
        - Menu.sections
        - Menu.isActive
        - Menu.publishedVersion
        - Menu.publishedAt
        operation: listMenus
        provenance: contract fnb.yaml GET /menus
      - kind: cardList
        bindsTo: TableDefinition[]
        label: Floor
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Combinations
        notes: '**Declared, not inferred.** Two adjacent tables do not always combine — a pillar, a step, a service
          run. A host knows which pairs work and a floor plan does not.'
        provenance: carried from the previous definition
      - kind: multiSelect
        label: 86 an item
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Apply
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected outlet
        bindsTo: Outlet
        columns:
        - Outlet.id
        - Outlet.code
        - Outlet.name
        - Outlet.venueId
        - Outlet.kind
        - Outlet.zone
        - Outlet.stockLocationId
        - Outlet.costCenterId
        - Outlet.openingHours
        - Outlet.isActive
        operation: listOutlets
        provenance: contract tenancy.yaml GET /outlets
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save table layout
        operation: setTableLayout
        provenance: contract fnb.yaml PUT /outlets/{outletId}/tables
      - kind: secondaryButton
        label: Save table combinations
        operation: setTableCombinations
        provenance: contract fnb.yaml PUT /outlets/{outletId}/table-combinations
      - kind: secondaryButton
        label: Save item availability
        operation: setItemAvailability
        provenance: contract fnb.yaml PUT /menu-items/{itemId}/availability
  states:
    loading: This outlet, its tables and its menu.
    error: Could not load configuration. **Selling is unaffected.**
    emptyFirstRun: '**A new outlet with no layout.** The one action that draws the first table.'
    emptyNoResults: Nothing matches.
    emptyNoAccess: '**You are signed in as a cashier.** Configuration needs a manager role — ADR-0002 makes that
      the person, not the device, so signing in again on this same till is the way through.'
    offline: '**Configuration is refused offline.** A table layout edited on two disconnected tablets is two layouts,
      and the room only has one.'
  apis:
  - operationId: listOutlets
    contract: tenancy
    purpose: List outlets
    trigger: onLoad
  - operationId: setTableLayout
    contract: fnb
    purpose: Configure the table layout
    trigger: onAction
    invalidates:
    - listOutlets
  - operationId: setTableCombinations
    contract: fnb
    purpose: Which tables can be pushed together, and to what capacity
    trigger: onAction
    invalidates:
    - listOutlets
  - operationId: setItemAvailability
    contract: fnb
    purpose: Mark an item available or eighty-sixed
    trigger: onAction
    invalidates:
    - listOutlets
  - operationId: listMenus
    contract: fnb
    purpose: List menus
    trigger: onLoad
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: itemId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till is signed into,
      not navigated to — and the outlet is a property of where the till is bolted down, not something a cashier
      picks.'
    preloaded:
    - Outlet.id
    - Outlet.code
    - Outlet.name
    - Outlet.venueId
    - Outlet.kind
  overlays:
  - id: formSetTableLayout
    component: modal
    trigger: Save table layout
    body: '**Collects what `setTableLayout` sends before it is called.** Required: `tables`. Dismissing sends nothing;
      the screen behind is unchanged.'
    confirm:
      label: Save table layout
      operation: setTableLayout
    dismiss:
      label: Cancel
      discards:
      - tables
    provenance: contract fnb.yaml PUT /outlets/{outletId}/tables
  - id: formSetTableCombinations
    component: modal
    trigger: Save table combinations
    body: '**Collects what `setTableCombinations` sends before it is called.** Required: `combinations`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save table combinations
      operation: setTableCombinations
    dismiss:
      label: Cancel
      discards:
      - combinations
    provenance: contract fnb.yaml PUT /outlets/{outletId}/table-combinations
  - id: formSetItemAvailability
    component: modal
    trigger: Save item availability
    body: '**Collects what `setItemAvailability` sends before it is called.** Required: `isAvailable`, `recordedAt`.
      Optional: `reason`, `restoreAt`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save item availability
      operation: setItemAvailability
    dismiss:
      label: Cancel
      discards:
      - isAvailable
      - recordedAt
      - reason
      - restoreAt
    provenance: contract fnb.yaml PUT /menu-items/{itemId}/availability
