screens:
- id: WEB-014
  name: Pay for a Booking
  module: Cart & Checkout
  requiresModule: ticketing
  wave: 1
  capability: C04
  implementation:
    app: guest-web
    route: /pay/:token
    component: apps/guest-web/src/routes/cart-and-checkout/PayByLinkForm.tsx
    status: notStarted
  navigation:
    exitTo:
    - WEB-013
    entryFrom:
    - WEB-013
    inferred: false
    notes: '**Reached from WEB-013** — an unpaid booking is paid from the confirmation that says it is unpaid. Stated
      on 4 September: this screen exited somewhere and nothing exited to it, so it was outside the navigation graph
      entirely.'
    transitions:
    - to: WEB-013
      trigger: Booking Confirmation
      carries:
      - orderId
      provenance: derived — WEB-013 declares entryState.params orderId and WEB-014 holds orderId, so an edge into
        it carries them
  notes: BL-072, rebuilt 20 August. **Declared `getCart` and `checkoutCart` until then, and `createPaymentLink`
    takes an `orderId`** — the screen was looking for a cart that was never created, and its entryState said `cartId`
    came from the session when **a guest arriving from an email has no session.** Wired by name-matching rather
    than by following the journey.
  density: compact
  pattern: statusTracker
  purpose: Pay for a booking somebody else took, without an account.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The payment link
        bindsTo: PaymentLink
        columns:
        - PaymentLink.id
        - PaymentLink.orderId
        - PaymentLink.reservationId
        - PaymentLink.token
        - PaymentLink.status
        - PaymentLink.channel
        - PaymentLink.sentTo
        - PaymentLink.expiresAt
        - PaymentLink.releaseHoldOnExpiry
        - PaymentLink.viewedAt
        - PaymentLink.paidAt
        - PaymentLink.resendCount
        - PaymentLink.issuedByPrincipalId
        - PaymentLink.scopePath
        operation: getPaymentLink
        provenance: contract orders.yaml GET /payment-links/{token}
      - kind: detailPanel
        bindsTo: PaymentLink
        notes: Venue, lines, total. **What they are paying for, before how to pay** — a guest who booked by phone
          may not recognise a reference number.
        provenance: carried from the previous definition
      - kind: banner
        notes: The deadline, counted in time remaining rather than as a timestamp. **Expires in 46 minutes** is
          actionable; **expires at 14:32** needs arithmetic.
        provenance: carried from the previous definition
      - kind: textField
        label: Email for your tickets (optional)
        notes: '**Optional, and only to send the ticket.** Requiring an account before taking money is how a paid
          booking becomes an abandoned one.'
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Pay now
        provenance: carried from the previous definition
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Pay by link
        operation: payByLink
        provenance: contract orders.yaml POST /payment-links/{token}/pay
  states:
    loading: The lines and the total, with the deadline counting down.
    error: Could not load the booking. **The hold is unaffected** — a failed page load must not release inventory.
    emptyFirstRun: '**Not reachable empty** — a link always names an order. An empty state here means the token
      did not resolve, which is the error state.'
    emptyNoAccess: '**The token is the credential, so there is no permission case** — either it resolves or it has
      gone.'
    offline: '**Not available, and the offline banner says why.** A payment needs the gateway, and pretending otherwise
      takes money nobody can confirm. What was typed stays on screen so nothing is entered twice.'
  apis:
  - operationId: getPaymentLink
    contract: orders
    purpose: What is owed and until when
    trigger: onLoad
  - operationId: payByLink
    contract: orders
    purpose: Take the money and convert the reservation
    trigger: onAction
  entryState:
    params:
    - name: token
      from: deepLink
    coldEntry: '**Cold is the only way in.** The guest arrives from an email, an SMS or a WhatsApp message with
      no session and quite possibly no account. **A link opened three days late is the ordinary case, not an edge**
      — the screen says the hold was released and offers to book again. Expired, already paid and superseded are
      three different messages, and **404 is never one of them**: telling somebody their booking does not exist
      when it expired is how a support call starts.'
  overlays:
  - id: formPayByLink
    component: modal
    trigger: Pay by link
    body: '**Collects what `payByLink` sends before it is called.** Required: `providerToken`. Optional: `email`.
      Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Pay by link
      operation: payByLink
    dismiss:
      label: Cancel
      discards:
      - providerToken
      - email
    provenance: contract orders.yaml POST /payment-links/{token}/pay
- id: POS-009
  name: Staff Roster
  module: Shift
  requiresModule: core
  wave: 2
  capability: C11
  implementation:
    app: venue-pos
    route: /sell/staff-roster
    component: apps/venue-pos/src/routes/sell/StaffRosterBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    - POS-008
    exitTo:
    - POS-001
    - POS-007
    uses:
    - posPrimaryRail
    transitions:
    - to: POS-001
      trigger: Begin Shift
      carries:
      - shiftId
      provenance: derived — POS-001 declares entryState.params shiftId and POS-009 holds shiftId, so an edge into
        it carries them
    - to: POS-007
      trigger: Close Shift
      provenance: derived — POS-007 declares entryState.params saleId and POS-009 holds none of them, so the edge
        carries nothing and POS-007 opens cold
  notes: 'Close counts each foreign currency separately (`foreignHoldings`). **A variance collapsed into a base-currency
    total cannot be attributed to the currency that caused it.** **createCashMovement removed 18 August** — attached
    by module resemblance, not by what this screen does. A screen that does not handle money should not be able
    to move it (CF-87''s class). **Improved 20 August against the client design board**, answering 2 board screen(s):
    Shift & Operator Dashboard; Operator & Workstation Assignment. **Owns POS board frame(s) POS-3A** (client pack,
    24 August). **Assigned by board purpose rather than by operation overlap** — three attempts at deriving that
    mapping produced plausible nonsense, and a reader who trusts a bad table is worse off than one who has none.'
  density: touchLarge
  pattern: approvalInbox
  purpose: See who is on duty and on which terminal.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: queue
      components:
      - kind: textField
        label: Workstation id
        operation: listShifts
        notes: Sends `?workstationId=` to `listShifts`.
        provenance: contract shift.yaml GET /shifts
      - kind: textField
        label: Status
        operation: listShifts
        notes: Sends `?status=` to `listShifts`.
        provenance: contract shift.yaml GET /shifts
      - kind: datePicker
        label: Opened from
        operation: listShifts
        notes: Sends `?openedFrom=` to `listShifts`.
        provenance: contract shift.yaml GET /shifts
      - kind: datePicker
        label: Opened to
        operation: listShifts
        notes: Sends `?openedTo=` to `listShifts`.
        provenance: contract shift.yaml GET /shifts
      - kind: dataTable
        label: Waiting for a decision
        bindsTo: Shift
        columns:
        - Shift.id
        - Shift.workstationId
        - Shift.venueId
        - Shift.scopePath
        - Shift.principalId
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        operation: listShifts
        provenance: contract shift.yaml GET /shifts
      - kind: dataTable
        label: Every cash movement
        bindsTo: CashMovement
        columns:
        - CashMovement.id
        - CashMovement.kind
        - CashMovement.amount
        - CashMovement.denominations
        - CashMovement.reference
        - CashMovement.reason
        - CashMovement.recordedAt
        - CashMovement.shiftId
        - CashMovement.depositBoxId
        - CashMovement.witnessPrincipalId
        - CashMovement.withdrawalReason
        - CashMovement.authorisedByPrincipalId
        operation: listCashMovements
        provenance: contract shift.yaml GET /shifts/{shiftId}/cash-movements
      - kind: dataTable
        label: Every rota assignment
        bindsTo: RotaAssignment
        columns:
        - RotaAssignment.overtimeMinutes
        - RotaAssignment.restPeriodBefore
        - RotaAssignment.breachesWorkingHourLimit
        - RotaAssignment.labourCost
        - RotaAssignment.id
        - RotaAssignment.principalId
        - RotaAssignment.displayName
        - RotaAssignment.venueId
        - RotaAssignment.departmentId
        - RotaAssignment.position
        - RotaAssignment.requiredRoleId
        - RotaAssignment.workstationId
        operation: listRotaAssignments
        provenance: contract workforce.yaml GET /rota-assignments
      - kind: dataTable
        label: Every workstation
        bindsTo: Workstation
        columns:
        - Workstation.id
        - Workstation.code
        - Workstation.name
        - Workstation.venueId
        - Workstation.regionId
        - Workstation.departmentId
        - Workstation.scopePath
        - Workstation.saleBoard
        - Workstation.accessPointId
        - Workstation.devices
        - Workstation.currency
        - Workstation.currencyScale
        operation: listWorkstations
        provenance: contract tenancy.yaml GET /workstations
      - kind: dataTable
        label: Every alert
        bindsTo: Alert
        columns:
        - Alert.id
        - Alert.ruleId
        - Alert.ruleName
        - Alert.metric
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.observedValue
        - Alert.threshold
        - Alert.scopePath
        - Alert.workstationId
        - Alert.shiftId
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
      - kind: dataTable
        notes: Staff, role and terminal, shift, sales, status — the columns in the design
        provenance: carried from the previous definition
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected shift
        bindsTo: Shift
        columns:
        - Shift.id
        - Shift.workstationId
        - Shift.venueId
        - Shift.scopePath
        - Shift.principalId
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        - Shift.openingFloat
        - Shift.salesTotal
        - Shift.refundsTotal
        - Shift.liftsTotal
        operation: getCurrentShift
        provenance: contract shift.yaml GET /shifts/current
      - kind: detailPanel
        label: The shift
        bindsTo: Shift
        columns:
        - Shift.id
        - Shift.workstationId
        - Shift.venueId
        - Shift.scopePath
        - Shift.principalId
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        - Shift.openingFloat
        - Shift.salesTotal
        - Shift.refundsTotal
        - Shift.liftsTotal
        operation: getShift
        provenance: contract shift.yaml GET /shifts/{shiftId}
    - name: actionBar
      slot: decision
      components:
      - kind: primaryButton
        label: Accept shift variance
        operation: acceptShiftVariance
        provenance: contract shift.yaml POST /shifts/{shiftId}/accept-variance
      - kind: secondaryButton
        label: Approve shift open
        operation: approveShiftOpen
        provenance: contract shift.yaml POST /shifts/{shiftId}/approve-open
      - kind: destructiveButton
        label: Close shift
        operation: closeShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/close
      - kind: secondaryButton
        label: Open shift
        operation: openShift
        provenance: contract shift.yaml POST /shifts
      - kind: secondaryButton
        label: Record no sale
        operation: recordNoSale
        provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
      - kind: secondaryButton
        label: Reopen shift
        operation: reopenShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/reopen
      - kind: secondaryButton
        label: Resume shift
        operation: resumeShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/resume
      - kind: destructiveButton
        label: Suspend shift
        operation: suspendShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/suspend
      - kind: secondaryButton
        label: Create rota assignment
        operation: createRotaAssignment
        provenance: contract workforce.yaml POST /rota-assignments
      - kind: secondaryButton
        label: Export roster
        provenance: carried from the previous definition
  overlays:
  - id: confirmCloseShift
    component: confirmDialog
    trigger: Close shift
    body: '**Names what `closeShift` changes and what it leaves alone**, in the consequence rather than the verb.
      A staff roster this affects should be identified in the dialog, not just counted. **Collects what `closeShift`
      sends before it is called.** Required: `countedCash`, `recordedAt`. Optional: `nonCashDeclared`, `notes`,
      `releaseHeldLeases`.'
    provenance: contract shift.yaml POST /shifts/{shiftId}/close
    confirm:
      label: Close the shift
      operation: closeShift
      carries:
      - shiftId
      - countedFloat
      - varianceReason
    dismiss:
      label: Not yet
      discards: []
    bindsTo: CloseShiftRequest
  - id: confirmSuspendShift
    component: confirmDialog
    trigger: Suspend shift
    body: '**Names what `suspendShift` changes and what it leaves alone**, in the consequence rather than the verb.
      A staff roster this affects should be identified in the dialog, not just counted. **Collects what `suspendShift`
      sends before it is called.** Required: `recordedAt`. Optional: `reason`.'
    provenance: contract shift.yaml POST /shifts/{shiftId}/suspend
    confirm:
      label: Suspend
      operation: suspendShift
      carries:
      - shiftId
    dismiss:
      label: Cancel
      discards: []
  - id: formAcceptShiftVariance
    component: modal
    trigger: Accept shift variance
    body: '**Collects what `acceptShiftVariance` sends before it is called.** Required: `reason`. Dismissing sends
      nothing; the screen behind is unchanged.'
    confirm:
      label: Accept shift variance
      operation: acceptShiftVariance
    dismiss:
      label: Cancel
      discards:
      - reason
    provenance: contract shift.yaml POST /shifts/{shiftId}/accept-variance
  - id: formApproveShiftOpen
    component: modal
    trigger: Approve shift open
    body: '**Collects what `approveShiftOpen` sends before it is called.** Required: `reason`. Dismissing sends
      nothing; the screen behind is unchanged.'
    confirm:
      label: Approve shift open
      operation: approveShiftOpen
    dismiss:
      label: Cancel
      discards:
      - reason
    provenance: contract shift.yaml POST /shifts/{shiftId}/approve-open
  - id: formOpenShift
    component: modal
    trigger: Open shift
    body: '**Collects what `openShift` sends before it is called.** Required: `workstationId`, `openingFloat`. Optional:
      `depositBoxCode`, `bagNumber`, `recordedAt`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: OpenShiftRequest
    confirm:
      label: Open shift
      operation: openShift
    dismiss:
      label: Cancel
      discards:
      - workstationId
      - openingFloat
      - depositBoxCode
      - bagNumber
      - recordedAt
    provenance: contract shift.yaml POST /shifts
  - id: formRecordNoSale
    component: modal
    trigger: Record no sale
    body: '**Collects what `recordNoSale` sends before it is called.** Required: `id`, `reason`, `recordedAt`. Optional:
      `note`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Record no sale
      operation: recordNoSale
    dismiss:
      label: Cancel
      discards:
      - id
      - reason
      - recordedAt
      - note
    provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
  - id: formReopenShift
    component: modal
    trigger: Reopen shift
    body: '**Collects what `reopenShift` sends before it is called.** Required: `reason`, `supervisorStepUp` {`principalId`,
      `credential`}: the supervisor enters their staff PIN on this device, and may not be the principal who closed
      the shift. Refused 403 `approver-is-closer` or `supervisor-step-up-refused` (decided 28 September, audit R144).
      Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Reopen shift
      operation: reopenShift
    dismiss:
      label: Cancel
      discards:
      - reason
      - supervisorStepUp
    provenance: contract shift.yaml POST /shifts/{shiftId}/reopen
  - id: formResumeShift
    component: modal
    trigger: Resume shift
    body: '**Collects what `resumeShift` sends before it is called.** Required: `recordedAt`. Dismissing sends nothing;
      the screen behind is unchanged.'
    confirm:
      label: Resume shift
      operation: resumeShift
    dismiss:
      label: Cancel
      discards:
      - recordedAt
    provenance: contract shift.yaml POST /shifts/{shiftId}/resume
  - id: formCreateRotaAssignment
    component: modal
    trigger: Create rota assignment
    body: '**Collects what `createRotaAssignment` sends before it is called.** Required: `principalId`, `venueId`,
      `position`, `startsAt`, `endsAt`. Optional: `overtimeMinutes`, `restPeriodBefore`, `breachesWorkingHourLimit`,
      `labourCost`, `id`, `displayName`, `departmentId`, `requiredRoleId`, `workstationId`, `status`, `breakMinutes`,
      `note`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: RotaAssignment
    confirm:
      label: Create rota assignment
      operation: createRotaAssignment
    dismiss:
      label: Cancel
      discards:
      - principalId
      - venueId
      - position
      - startsAt
      - endsAt
      - overtimeMinutes
      - restPeriodBefore
      - breachesWorkingHourLimit
      - labourCost
      - id
      - displayName
      - departmentId
      - requiredRoleId
      - workstationId
      - status
      - breakMinutes
      - note
    provenance: contract workforce.yaml POST /rota-assignments
  states:
    loading: The staff roster list.
    error: Could not load. Names which read failed and leaves the staff roster untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item has been
      decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: Nothing matches the filter on workstationId, status, openedFrom, openedTo and the staff roster
      are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `REPORT_VIEW_WORKSTATION`, which `listShifts` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.
    offline: Last known roster, with its age shown
  apis:
  - operationId: listShifts
    contract: shift
    purpose: Open shifts at this venue
    trigger: onLoad
  - operationId: acceptShiftVariance
    contract: shift
    purpose: Accept an over/short beyond the threshold
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: approveShiftOpen
    contract: shift
    purpose: Approve a shift opening outside tolerance
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: closeShift
    contract: shift
    purpose: Blind close-out
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: getCurrentShift
    contract: shift
    purpose: The open or suspended shift on the session's workstation
    trigger: onLoad
  - operationId: getShift
    contract: shift
    purpose: Read a shift
    trigger: onLoad
  - operationId: listCashMovements
    contract: shift
    purpose: Lifts, adds and the opening float
    trigger: onLoad
  - operationId: openShift
    contract: shift
    purpose: Open a shift
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: recordNoSale
    contract: shift
    purpose: Open the drawer without a sale
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: reopenShift
    contract: shift
    purpose: Reopen a shift closed in error
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: resumeShift
    contract: shift
    purpose: Resume a suspended shift
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: suspendShift
    contract: shift
    purpose: Suspend a shift so another user can log in
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: createRotaAssignment
    contract: workforce
    purpose: Put someone on the rota
    trigger: onAction
    invalidates:
    - listShifts
  - operationId: listRotaAssignments
    contract: workforce
    purpose: The rota
    trigger: onLoad
  - operationId: listWorkstations
    contract: tenancy
    purpose: List workstations
    trigger: onLoad
  - operationId: listAlerts
    contract: reporting
    purpose: What is currently raised
    trigger: onLoad
  entryState:
    params:
    - name: shiftId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - Shift.id
    - Shift.workstationId
    - Shift.venueId
    - Shift.scopePath
    - Shift.principalId
- id: POS-010
  name: Add to Existing Ticket
  module: Sell
  requiresModule: ticketing
  wave: 1
  capability: C01
  implementation:
    app: venue-pos
    route: /sell/add-to-existing-ticket
    component: apps/venue-pos/src/routes/sell/AddToExistingTicketDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    exitTo:
    - POS-002
    - POS-003
    - POS-004
    - POS-005
    - POS-011
    uses:
    - posSaleToPayment
    transitions:
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      carries:
      - orderId
      - promotionId
      provenance: derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId and POS-010
        holds orderId, promotionId, so an edge into it carries them
    - to: POS-003
      trigger: Sell — Timed Entry
      provenance: derived — POS-003 declares entryState.params inventoryHoldId, productId and POS-010 holds none
        of them, so the edge carries nothing and POS-003 opens cold
    - to: POS-004
      trigger: Sell — Seat Map
      carries:
      - performanceId
      provenance: derived — POS-004 declares entryState.params holdId, performanceId and POS-010 holds performanceId,
        so an edge into it carries them
    - to: POS-005
      trigger: Payment
      carries:
      - paymentId
      provenance: derived — POS-005 declares entryState.params paymentId, saleId and POS-010 holds paymentId, so
        an edge into it carries them
    - to: POS-011
      trigger: They change their mind about the locker
      provenance: flow F58 step 7→8
      carries:
      - orderId
  notes: 'CF-58, from the 14 August MoM. Not in the delivered mockups. **9 assets operations removed 18 August (CF-114).**
    The whole media contract was attached to this screen. **A till adding an item to a ticket does not manage a
    media library** — it reads the asset it needs and nothing else. Same shape as CF-87, one level up: that attached
    sibling operations, this attached a whole contract. **Wired 24 August from review**: getCart, exchangeOrderLines.
    **The operations existed and this screen could not call them** — reviewers reported them as missing APIs, which
    is what an unreachable operation looks like from a wireframe.'
  density: touchLarge
  pattern: statusTracker
  purpose: Sell something onto media the guest is already carrying.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The media entitlements
        bindsTo: MediaEntitlements
        columns:
        - MediaEntitlements.mediaCode
        - MediaEntitlements.mediaKind
        - MediaEntitlements.subjectId
        - MediaEntitlements.isValid
        - MediaEntitlements.invalidReason
        - MediaEntitlements.canAcceptMore
        - MediaEntitlements.entitlements
        operation: getMediaEntitlements
        provenance: contract orders.yaml GET /media/{mediaCode}/entitlements
      - kind: detailPanel
        label: The media asset
        bindsTo: MediaAssetDetail
        columns:
        - MediaAssetDetail.id
        - MediaAssetDetail.kind
        - MediaAssetDetail.status
        - MediaAssetDetail.filename
        - MediaAssetDetail.contentType
        - MediaAssetDetail.sizeBytes
        - MediaAssetDetail.title
        - MediaAssetDetail.description
        - MediaAssetDetail.altText
        - MediaAssetDetail.width
        - MediaAssetDetail.height
        - MediaAssetDetail.durationSeconds
        - MediaAssetDetail.customMetadata
        - MediaAssetDetail.sharedWithTenantIds
        - MediaAssetDetail.tags
        - MediaAssetDetail.venueId
        operation: getMediaAsset
        provenance: contract assets.yaml GET /media/{mediaId}
      - kind: detailPanel
        label: The cart
        bindsTo: Cart
        columns:
        - Cart.id
        - Cart.token
        - Cart.venueId
        - Cart.channel
        - Cart.subjectId
        - Cart.status
        - Cart.lines
        - Cart.conflicts
        - Cart.subtotal
        - Cart.discountTotal
        - Cart.taxTotal
        - Cart.total
        - Cart.appliedPromotionIds
        - Cart.expiresAt
        - Cart.extensionsUsed
        - Cart.maxExtensions
        operation: getCart
        provenance: contract orders.yaml GET /carts/{cartId}
      - kind: scanTarget
        notes: Scan the guest QR, wristband or card first. The media is the join, not the order
        provenance: carried from the previous definition
      - kind: detailPanel
        bindsTo: MediaEntitlements
        notes: What they already hold — so a cashier does not sell a locker to someone who has one
        provenance: carried from the previous definition
      - kind: banner
        bindsTo: MediaEntitlements.canAcceptMore
        notes: Surrendered, expired or blocked media is refused before money is taken, not after
        provenance: carried from the previous definition
      - kind: saleBoard
        notes: Only variants whose template allows canShareMedia
        provenance: carried from the previous definition
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Append entitlement to media
        operation: appendEntitlementToMedia
        provenance: contract orders.yaml POST /media/{mediaCode}/entitlements
      - kind: secondaryButton
        label: Exchange order lines
        operation: exchangeOrderLines
