# Queue entry — state model
# Contract: queue.QueueEntryStatus
# Checked by tools/check-states.py.

entity: Queue entry
contract: queue
enum: QueueEntryStatus
enumKind: named
enumSchema: QueueEntryStatus
owner: queue
initial:
- waiting
terminal:
- redeemed
- cancelled
- released
transitions:
- from: waiting
  to: called
  operation: callNextParties
  trigger: operation
  guard: Called forward. The redemption window opens here
- from: waiting
  to: cancelled
  operation: leaveQueue
  trigger: operation
  guard: Guest left the queue
- from: waiting
  to: released
  operation: setQueueStatus
  trigger: cascade
  guard: Queue closed or the attraction went out of service
- from: called
  to: redeemed
  operation: redeemWaitingGuest
  trigger: operation
  guard: Guest presented within the window. An entry with a Fast Pass entitlement writes queueEntry.redeemed, which
    Access consumes to take the entitlement's use (ADAM CR-238)
  emits:
  - queueEntry.redeemed
- from: called
  to: expired
  trigger: timer
  guard: Window passed. **Distinct from noShow** — expired is the clock, noShow is an operator saying
    they were called and did not come
- from: called
  to: noShow
  operation: resolveCalledWaitingGuest
  trigger: operation
  guard: Operator recorded a no-show (outcome noShow; ADAM CR-237 moved it out of overrideWaitingGuest)
- from: called
  to: waiting
  operation: resolveCalledWaitingGuest
  trigger: operation
  guard: Returned to the queue — called in error, or the guest asked for more time (outcome returnToQueue; ADAM
    CR-237)
  isReversal: true
- from: called
  to: redeemed
  operation: overrideWaitingGuest
  trigger: operation
  guard: Admitted against a failed redemption, with the override fields set (ADAM CR-237, option A)
- from: expired
  to: redeemed
  operation: overrideWaitingGuest
  trigger: operation
  guard: A late party admitted after its window passed, with the override fields set (ADAM CR-237)
- from: noShow
  to: redeemed
  operation: overrideWaitingGuest
  trigger: operation
  guard: A party recorded as a no-show admitted after all, with the override fields set (ADAM CR-237)
notes: '**expired and noShow are no longer terminal** (ADAM CR-237, 25 October 2026): an override admits from
  them, so each has one way out, to redeemed by overrideWaitingGuest.


  A guest in a virtual queue. **`called` expires rather than restoring their place** — unlike
  a waitlist, where being asleep is not declining, a called queue place lapses because the ride is running
  and the next party is waiting.


  `abandoned` and `expired` are distinct: one is a guest leaving, one is the queue closing under them,
  and only the second deserves an apology.'
