# Webhook replay — state model
# Contract: public-api.WebhookReplayJob.status
# Checked by tools/check-states.py.

entity: Webhook replay
contract: public-api
enum: WebhookReplayJob.status
enumKind: inline
enumSchema: WebhookReplayJob
enumProperty: status
owner: public-api
initial:
- queued
terminal:
- completed
- failed
transitions:
- from: queued
  to: running
  trigger: job
  guard: The replay dispatcher on the workers host takes the row (ADAM CR-140, 18 October 2026; CHG-CRA-004)
- from: running
  to: completed
  trigger: job
  guard: Every event of the window and types asked was re-delivered, each as a webhook delivery marked as a
    replay with this replay's id
- from: running
  to: failed
  trigger: job
  guard: The dispatcher stopped, for example a tenant database it could not read; `completedAt` records when
- from: queued
  to: failed
  trigger: job
  guard: '**Refused by the dispatcher, nothing replayed** (ADAM CR-201, 25 October 2026; CHG-R10ID-012): the window
    starts before the oldest attached outbox partition of the row''s tenant (`failureReason`
    `replay-window-beyond-retention`) or holds more than 10,000 events (`replay-window-too-large`)'
notes: '**`replayEvents` only queues.** It validates the window (to before from, at most 7 days), the event types and
  the caller''s tenant and inserts the row with that tenant; it reads no outbox, so retention and the 10,000-event cap
  are the dispatcher''s (ADAM CR-201). The dispatcher reads each tenant''s `platform.outbox` directly, as the relay
  on the same host does (ADAM CR-140). A failed replay is not resumed in place: a new `replayEvents` asks again.'
