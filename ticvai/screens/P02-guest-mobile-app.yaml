  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Cross-platform navigation
    removed 24 August**: BO-048, BO-069. **Buying to collect goes through the cart** (decided 28 September,
    audit R236) — `addCartLine`, `checkoutCart`, `createPayment`, and payment creates the shop-and-drop,
    as on the web''s WEB-033; `reserveMerchandise` stays only as an unpaid hold to pay at the shop. **A
    till does not navigate to a back office and a guest app does not navigate to either** — those are
    device handovers, and a flow declares them with `crossesDevice` rather than a screen pretending there
    is a link.


    **The unpaid hold stays secondary here, by decision (DEC-075, 2 October): paid only on the web (R236);
    the app''s hold is drawn as secondary until decided.** A sanctioned difference from WEB-042 (CHG-SGU-018).'
  density: comfortable
  pattern: listDetail
  patternReason: '`listMerchandise` reads the population and `getGameCard` reads one of them — list, select,
    act'
  purpose: Buy merchandise and collect it on the way out, or have it delivered home.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Shop
        operation: listMerchandise
        notes: Shops by name; sends `outletId`.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: GuestMerchandiseItem.outletId
      - kind: selectField
        label: Category
        operation: listMerchandise
        notes: Categories by name; sends `categoryId`.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: GuestMerchandiseItem.categoryId
      - kind: cardList
        label: Merchandise
        bindsTo: GuestMerchandiseItem
        columns:
        - GuestMerchandiseItem.name
        - GuestMerchandiseItem.description
        - GuestMerchandiseItem.price
        - GuestMerchandiseItem.isAvailable
        - GuestMerchandiseItem.imageAssetRef
        operation: listMerchandise
        notes: 'The guest projection: name, photo, price and whether it can be bought; sold-out items
          stay visible. No sku, barcode, variant, stock or inventory ids.'
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: toggle
        label: In stock only
        operation: listMerchandise
        notes: Sends `?inStockOnly=` to `listMerchandise`.
        provenance: contract retail.yaml GET /merchandise
      - kind: searchField
        label: Search
        operation: listMerchandise
        notes: Sends `?search=` to `listMerchandise`.
        provenance: contract retail.yaml GET /merchandise
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Scan an item in the shop
        operation: lookupMerchandise
        notes: Sends `?outletId=` — the outlet the guest is browsing — because the app has no workstation;
          price and stock are that outlet's, and an inactive item is not found (decided 28 September,
          audit R215 (1)).
        provenance: contract retail.yaml GET /merchandise/lookup
      - kind: primaryButton
        label: Add to basket
        operation: addCartLine
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Hold to pay at the shop
        operation: reserveMerchandise
        notes: An unpaid hold, not a purchase — the item is allocated and paid for at the outlet; buying
          to collect is the cart above (decided 28 September, audit R236).
        provenance: contract retail.yaml POST /outlets/{outletId}/reserve
  states:
    loading: The retail merchandise list.
    error: Could not load. Names which read failed and leaves the retail merchandise untouched.
    emptyFirstRun: No retail merchandise yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing matches the filter on outletId, categoryId, inStockOnly, search and the retail
      merchandise are still there. Names the active filter and offers to clear it.
    emptyNoAccess: '**There is no permission to name: a guest holds none** (ADR-0025). The shop is public;
      buying needs the guest''s cart.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: listMerchandise
    contract: retail
    purpose: List merchandise
    trigger: onLoad
  - operationId: lookupMerchandise
    contract: retail
    purpose: Find an item by code or scan
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Put the item in the cart, marked for collection on the way out (audit R236)
    trigger: onAction
    invalidates:
    - listMerchandise
  - operationId: reserveMerchandise
    contract: retail
    purpose: Hold it for collection
    trigger: onAction
  entryState:
    params:
    - name: cartId
      from: session
    - name: outletId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `cardCode`.'
    preloaded:
    - MerchandiseItem.description
    - MerchandiseItem.id
    - MerchandiseItem.sku
    - MerchandiseItem.barcode
    - MerchandiseItem.name
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-026
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: partial
      view: Account → All screens → Wave 2 → Retail / merchandise
      differences: Prototype only reserves for collection (reserveMerchandise). The YAML also declares
        addCartLine/checkoutCart/createPayment and getGameCard, and the prototype shows neither a buy-now
        path nor a game card.
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formReserveMerchandise
    component: modal
    trigger: Reserve merchandise
    body: The item and quantity, held to pay for at the shop until the end of the visit day (R169). No
      ids are asked.
    confirm:
      label: Reserve merchandise
      operation: reserveMerchandise
    dismiss:
      label: Cancel
      discards:
      - id
      - lines
      - expiresAt
      - subjectId
      - collectionNote
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
  - id: formAddCartLine
    component: modal
    trigger: Add to basket
    body: The item and quantity (a size switches between sibling items); collection point or home delivery
      is chosen at checkout. No variant, performance or seat ids are asked.
    bindsTo: AddCartLineRequest
    confirm:
      label: Add to basket
      operation: addCartLine
    dismiss:
      label: Cancel
      discards:
      - variantId
      - quantity
      - performanceId
      - seatIds
      - parentLineId
      - attributes
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
- id: GST-027
  name: Parking – Reserve & Pay
  module: In-venue Services
  requiresModule: access
  wave: 1
  capability: C23
  implementation:
    app: guest-app
    route: /general/parking-reserve-and-pay
    component: apps/guest-app/src/routes/general/ParkingReserveAndPayDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-001
    inferred: true
    exitTo:
    - GST-001
    - GST-002
    - GST-009
    - GST-028
    transitions:
    - to: GST-001
      trigger: Home – Default
      provenance: 'derived — GST-001 declares entryState.params  and GST-027 holds none of them. The edge
        carries nothing: GST-027 is opened from GST-001, so this edge is the way back and GST-001 keeps
        its own state'
    - to: GST-028
      trigger: It is confirmed with a facility
      provenance: flow F50 step 2→3
      carries:
      - orderId
    - to: GST-009
      trigger: They pay in the basket, and the parking entitlement is issued (R166;
      provenance: flow F50 step 1→2
      operation: addCartLine
      carries:
      - token
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **`createParkingEntitlement`
    is declared `service` audience and this is a guest screen.** Either the guest calls it — in which
    case the audience is wrong — or a guest-scoped operation is missing and the screen is drawing an act
    it cannot perform. **Recorded 24 August rather than guessed**: `updateParkingEntitlement` is already
    `guest`, which makes the asymmetry look like an omission rather than a design. **Cross-surface parity,
    31 August**: added listParkingFacilities. **The same screen on web and app was calling different operations**
    — one side could do something the other could not, and nothing recorded the difference as deliberate.
    **Rebound 28 September** (decided 28 September, audit R166): parking is sold through the normal cart
    and checkout (`addCartLine`, `checkoutCart`, `createPayment`), so the entitlement gets its `orderId`;
    the guest no longer calls `createParkingEntitlement`, which the order service issues at payment. No
    live availability; a full car park is the `soldOutForDay` refusal.


    **Rev 3 (decided 29 September).** The web and app waves of this capability differ; they are aligned
    to one wave once the client picks it (GAP-D2, open).'
  density: comfortable
  pattern: listDetail
  patternReason: '`listParkingFacilities` reads a population and nothing reads one of them; the detail
    is the row until a `get` exists'
  purpose: Choose a car park and add parking to the basket; change the plate on parking already bought.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Load the parking entitlement being changed
        operation: getParkingEntitlement
        bindsTo: ParkingEntitlement
        columns:
        - ParkingEntitlement.plateNumber
        - ParkingEntitlement.plateCountry
        - ParkingEntitlement.mediaCode
        - ParkingEntitlement.status
        - ParkingEntitlement.pushedAt
        provenance: r1 gate, 3 October 2026 (CHG-R1S-004)
      - kind: cardList
        label: Car parks
        bindsTo: ParkingFacility
        columns:
        - ParkingFacility.name
        operation: listParkingFacilities
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        notes: The venue's car parks by name; no live free-bay count in the first release. The venue is
          the one the guest picked on Home (`venueId` from the session, audit R267), never typed. Was
          the generated table 'Every parking facility'; staff and plumbing columns removed (decided by
          Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)).
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected parking facility
        bindsTo: ParkingFacility
        columns:
        - ParkingFacility.name
        operation: listParkingFacilities
        provenance: contract access.yaml GET /parking-facilities
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add parking to my cart
        operation: addCartLine
        notes: '**Parking is sold through the normal cart** (decided 28 September, audit R166): the car
          park''s parking product goes in as a cart line, then checkout and payment as for a ticket, and
          the parking entitlement is issued at payment carrying the order''s id — the guest never creates
          it. No live space count: a car park at capacity refuses the line with `soldOutForDay`.'
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Change plate
        operation: updateParkingEntitlement
        provenance: contract access.yaml PATCH /parking-entitlements/{entitlementId}
  states:
    loading: Terminal or gateway state, shown plainly
    error: '**Declined reads differently from unresolved.** An unresolved payment inquires rather than
      retries, and nothing is issued until it resolves'
    emptyFirstRun: —
    emptyNoResults: 'Never shown: the car parks are the venue''s, with no filter a guest sets.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** A reservation already confirmed stays on screen with its plate
      and car park. Reserving, paying and changing the plate need the connection.'
    soldOutForDay: '**The car park is full.** `addCartLine` refused the parking line with `soldOutForDay`:
      issued entitlements have reached the facility''s capacity for that day. Shown only then — there
      is no live space count in the first release, so the screen never promises spaces before the guest
      tries (decided 28 September, audit R166).'
  apis:
  - operationId: addCartLine
    contract: orders
    purpose: Put the car park's parking product in the cart; refused `soldOutForDay` when the car park
      is at capacity (decided 28 September, audit R166)
    trigger: onAction
  - operationId: updateParkingEntitlement
    contract: access
    purpose: Change the plate, or revoke
    trigger: onAction
    invalidates:
    - listParkingFacilities
  - operationId: listParkingFacilities
    contract: access
    purpose: Car parks at a venue, and how each integrates
    trigger: onLoad
  - operationId: getParkingEntitlement
    contract: access
    purpose: Load the parking entitlement being changed
    trigger: onLoad
    provenance: r1 gate, 3 October 2026 (CHG-R1S-004)
  entryState:
    params:
    - name: entitlementId
      from: deepLink
    - name: cartId
      from: session
    coldEntry: '**A ticket link opened after the event.** Shows the entitlement with its status — expired,
      used, transferred — because *not found* to somebody holding a ticket is the wrong answer.'
    preloaded:
    - ParkingFacility.id
    - ParkingFacility.name
    - ParkingFacility.venueId
    - ParkingFacility.mode
    - ParkingFacility.capacity
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-027
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: Account → All screens → Wave 3 → Parking – reserve & pay
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formAddCartLine
    component: modal
    trigger: Add parking to my cart
    body: '**Collects what `addCartLine` sends before it is called.** Required: `variantId` (the car park''s
      parking product), `quantity`. Optional: `performanceId`, `attributes` (the plate). A 409 `soldOutForDay`
      is shown as **the car park is full** for that day — capacity reached, not a live count (decided
      28 September, audit R166). Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Add to cart
      operation: addCartLine
    dismiss:
      label: Cancel
      discards:
      - variantId
      - quantity
      - performanceId
      - attributes
    provenance: client-verified
  - id: formUpdateParkingEntitlement
    component: modal
    trigger: Change plate
    body: '**The plate only.** `updateParkingEntitlement` with the new plate; a guest never sets a status.'
    bindsTo: UpdateParkingEntitlementRequest
    confirm:
      label: Save
      operation: updateParkingEntitlement
    dismiss:
      label: Cancel
      discards:
      - plate
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  gaps:
  - operation: checkoutCart
    removed: true
    why: Parking goes through the basket (R166); checkout is the basket's.
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  - operation: createPayment
    removed: true
    why: Payment is the basket's, after checkout (R166).
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
