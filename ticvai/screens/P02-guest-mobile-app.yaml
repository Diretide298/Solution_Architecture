- id: GST-046
  name: Branded Queue / Waiting Room
  module: High-Demand Access
  requiresModule: ticketing
  wave: 1
  capability: C98
  implementation:
    app: guest-app
    route: /general/branded-queue-waiting-room
    component: apps/guest-app/src/routes/general/BrandedQueueWaitingRoomDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-007
    exitTo:
    - GST-001
    - GST-002
    - GST-007
    transitions:
    - to: GST-007
      trigger: Continue to your tickets
      precondition: '`getWaitingRoomPosition` answers `admitted`. The app keeps `admission.token` and
        sends it as `X-Admission-Token` on `addCartLine` until `admission.expiresAt`'
      carries:
      - performanceId
      provenance: ADR-0066 (accepted 1 October 2026) and its 1 October amendment
  notes: '**The on-sale waiting room (Q2), not the ride queue (Q1). Re-pointed 1 October under ADR-0066**
    from `getWaitTimes`, `getWaitingGuest` and `joinQueue`, which are the ride queue and wrote a `queue.entry`
    row per arriving guest, the load the room exists to keep away. The ride queue stays on GST-023. Arrival
    is `enterWaitingRoom` (a Redis counter, no database write, no personal data); the screen polls `getWaitingRoomPosition`
    every `pollAfterSeconds`. Admitted, it holds a short-lived signed admission token that `addCartLine`
    needs for this performance while its room is on (online cart holds only: the 1 October amendment exempts
    tills, kiosks and venue workstations). **Reached from the sale, not the home screen:** GST-007 lands
    here when `addCartLine` refuses `403 admission-required`, and admission returns there. `notRequired`
    (the room is off) goes straight back. **A guest surface is one product with two renderings** (WEB-015):
    the same named screen on web and app calls the same guest-callable operations.'
  density: comfortable
  pattern: statusTracker
  patternReason: '`getWaitingRoomPosition` reads one guest''s place in one performance''s room, polled
    — the screen is about that one thing'
  purpose: The on-sale waiting room for one performance — the guest's place, the wait, and the way on
    to the sale once admitted.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: Your place in the waiting room
        bindsTo: WaitingRoomEntry
        columns:
        - WaitingRoomEntry.state
        - WaitingRoomEntry.position
        - WaitingRoomEntry.aheadOfYou
        - WaitingRoomEntry.estimatedWaitSeconds
        operation: getWaitingRoomPosition
        provenance: contract catalogue.yaml GET /performances/{performanceId}/waiting-room/entries/{waitingEntryId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Take my place
        operation: enterWaitingRoom
        notes: The one write on this screen, pressed rather than fired on load so a prefetch or a bot
          does not take a place. Hidden once the guest has one.
        provenance: contract catalogue.yaml POST /performances/{performanceId}/waiting-room/entries
      - kind: primaryButton
        label: Continue to your tickets
        provenance: ADR-0066; live when `getWaitingRoomPosition` answers `admitted`
  states:
    loading: Taking a place in the room. *Take my place* (`enterWaitingRoom`) answers with a position,
      or `notRequired` and the guest goes straight on to the sale
    error: '**Lost the place.** A retry sends the same `Idempotency-Key` and gets the same entry back,
      so the guest is not sent to the back, and the screen says so. `expired` (the admission was not used
      in time) offers to enter again; `closed` (the room was switched off or the performance stopped selling)
      says so and goes back to the event'
    emptyFirstRun: —
    offline: '**The offline banner shows.** The last known position stays on screen with its age, and
      polling resumes with the same entry when the connection is back. Admission needs the connection.'
  apis:
  - operationId: enterWaitingRoom
    contract: catalogue
    purpose: Take a place in the performance's on-sale waiting room (ADR-0066); `notRequired` when the
      room is off
    trigger: onAction
  - operationId: getWaitingRoomPosition
    contract: catalogue
    purpose: The guest's place, polled every `pollAfterSeconds`; admitted, it carries the admission token
      for `addCartLine`
    trigger: onInterval
  entryState:
    params:
    - name: performanceId
      from: GST-007
    - name: waitingEntryId
      from: GST-046
      optional: true
    coldEntry: '**Named, closed or expired — never a 404** (ADR-0030). Opened with no performance, or
      one no longer selling, the room says so and offers the event.'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-046
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: Account → All screens → Wave 1 → Branded queue / waiting room
  apisNote: Rebuilt 1 October 2026 on the two waiting-room operations (ADR-0066). Columns are the entry's
    guest-facing fields; `pollAfterSeconds` and `admission` are plumbing the screen acts on rather than
    shows.
