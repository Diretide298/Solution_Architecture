- id: GST-069
  name: Face Pass
  module: Account & Self-Service
  requiresModule: core
  wave: 1
  capability: read-write
  implementation:
    app: guest-app
    route: /account/face-pass
    component: apps/guest-app/src/routes/account/FacePass.tsx
    status: notStarted
  navigation:
    exitTo:
    - GST-039
    entryFrom:
    - GST-039
    inferred: false
    notes: '**Reached from GST-039** — enrolment is a setting on the profile. Stated on 4 September: this
      screen exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
    transitions:
    - to: GST-039
      trigger: Profile
      carries:
      - subjectId
      provenance: derived — GST-039 declares entryState.params subjectId and GST-069 holds subjectId,
        so an edge into it carries them
  notes: '🔴 **Biometric enrolment had no guest-facing consent step.** `enrolFacePass` was callable by
    a guest and reachable from nowhere, which means enrolment was happening at a desk with somebody else
    operating the screen.


    **`pii.subject_biometric` is separate from contact and document precisely so consent and erasure differ
    per kind.** Revocation sits beside enrolment for the same reason — a face a guest cannot withdraw
    is a face they did not really consent to.


    **Who is this for** (decided 28 September, audit R205): the signed-in adult enrols themselves or a
    linked child, and is recorded as guardian by the server. The age below which a subject is a minor
    is an open value client counsel sets.'
  density: comfortable
  offline: false
  pattern: statusTracker
  patternReason: '`getFacePassEnrolment` reads one record and nothing reads a population — the screen
    is about that one thing'
  purpose: Register or remove my face for gate entry on my pass, or a linked child's with my consent as
    guardian.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: selectField
        label: Who is this for
        bindsTo: DelegatedAccess
        columns:
        - DelegatedAccess.overSubjectId
        - DelegatedAccess.delegationKind
        operation: listDelegations
        notes: '**The first step of enrolment** (decided 28 September, audit R205): the signed-in guest,
          then each child linked to them — the `heldByThisGuest` grants whose `delegationKind` is `familyMember`
          or `primaryHolder`. The chosen person''s id is the `subjectId` that `enrolFacePass` sends. **No
          guardian field is collected**: the server records the caller as guardian. **Children may be
          enrolled with guardian consent on the venue''s consent form** (decided by Chinmay, 2 October
          2026; DEC-237, superseding the batch-4 "not available for under-18s" default, DEC-138): the
          minor age is set per country (`RegionSettings.minorAgeThreshold`) and the venue can switch minors
          off (`VenueSettings.biometrics.allowMinors`); a child is then listed as not available, and `enrolFacePass`
          answers 422 `minors-not-enrolled` (CHG-SGU-004).'
        provenance: contract identity.yaml GET /guests/{subjectId}/delegations
      - kind: detailPanel
        label: The face pass enrolment
        bindsTo: FacePassEnrolment
        columns:
        - FacePassEnrolment.source
        - FacePassEnrolment.capturedAt
        - FacePassEnrolment.consentGivenAt
        - FacePassEnrolment.isActive
        - FacePassEnrolment.expiresAt
        operation: getFacePassEnrolment
        provenance: contract access.yaml GET /face-pass/enrolments/{enrolmentId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Enrol face pass
        operation: enrolFacePass
        provenance: contract access.yaml POST /face-pass/enrolments
      - kind: destructiveButton
        label: Revoke face pass
        operation: revokeFacePass
        provenance: contract access.yaml DELETE /face-pass/enrolments/{enrolmentId}
  overlays:
  - id: confirmRevokeFacePass
    component: confirmDialog
    trigger: Revoke face pass
    body: '**Names what `revokeFacePass` changes and what it leaves alone**, in the consequence rather
      than the verb. A face pass this affects should be identified in the dialog, not just counted.'
    provenance: client-verified
  - id: formEnrolFacePass
    component: modal
    trigger: Enrol face pass
    body: '**Collects what `enrolFacePass` sends before it is called.** Required: `subjectId`, `entitlementId`,
      `template`, `capturedAt`, `source`, `consent`. `subjectId` is the person picked in **Who is this
      for** (the guest or a linked child), not typed; **no guardian is asked for** — the server sets `consent.guardianSubjectId`
      to the signed-in guest (decided 28 September, audit R205). Dismissing sends nothing; the screen
      behind is unchanged. **Consent is the venue''s own consent form** (`VenueSettings.biometrics.consentFormId`),
      shown before the camera opens; for a child the signed-in guest consents as guardian, and the form
      version is recorded with the enrolment (CHG-SGU-004). **Where:** in this app, at a ticket or annual-pass
      counter, or at a self-service kiosk with the consent shown (`enrolmentChannel` selfServiceKiosk);
      never at a turnstile (CHG-CSP-021) (CHG-SGU-021).'
    confirm:
      label: Enrol face pass
      operation: enrolFacePass
    dismiss:
      label: Cancel
      discards:
      - subjectId
      - entitlementId
      - template
      - capturedAt
      - source
      - consent
    provenance: client-verified
  states:
    loading: Content loads.
    error: Could not load. **Says what failed and offers one way onward**, never a bare failure.
    emptyFirstRun: '**Not enrolled.** What a face pass is for, where it works, and what withdrawing it
      does — **before** the camera opens.'
    emptyNoResults: '**Nothing here yet.** The scope is what narrowed it — naming the scope is what stops
      somebody concluding the record does not exist.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**Not available, and the offline banner says why.** Biometric enrolment never happens offline
      — a face captured and queued is a face the guest cannot withdraw until it uploads.'
    subjectNotLinked: '**Refused: that person is not linked to you** (403 `subject-not-linked`). A guest
      may enrol only themselves or a child linked to them by a family-member or primary-holder delegation;
      the screen says so and returns to **Who is this for**, which is refreshed in case the link was just
      removed (decided 28 September, audit R205).'
  apis:
  - operationId: listDelegations
    contract: identity
    purpose: Who this guest may enrol — themselves and the children linked to them (heldByThisGuest, familyMember
      or primaryHolder) (decided 28 September, audit R205)
    trigger: onLoad
  - operationId: enrolFacePass
    contract: access
    purpose: Register a facial profile against an entitlement
    trigger: onAction
  - operationId: getFacePassEnrolment
    contract: access
    purpose: Whether a pass has a face registered, and when
    trigger: onLoad
  - operationId: revokeFacePass
    contract: access
    purpose: Remove a facial profile
    trigger: onAction
  entryState:
    params:
    - name: enrolmentId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `enrolFacePass`;
        a link or an edge that holds one opens it instead.'
    - name: subjectId
      from: session
    coldEntry: '**Resolves from the session.** A guest arriving cold is asked to sign in and returned
      here afterwards — never a 404, and never a screen that silently shows somebody else''s data (ADR-0030).'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-069
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: Account → All screens → Wave 2 → Face Pass (also Account → Face Pass)
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
- id: GST-070
  name: Reserve a Table
  module: In-venue Services
  requiresModule: fnb
  wave: 1
  capability: read-write
  implementation:
    app: guest-app
    route: /reserve-table
    component: apps/guest-app/src/routes/ReserveTable.tsx
    status: notStarted
  navigation:
    exitTo:
    - GST-039
    - GST-041
    entryFrom:
    - GST-001
    inferred: false
    notes: '**Reached from GST-001** — a top-level section of the app. Stated on 4 September: this screen
      exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
    transitions:
    - to: GST-039
      trigger: Profile
      carries:
      - subjectId
      provenance: derived — GST-039 declares entryState.params subjectId and GST-070 holds subjectId,
        so an edge into it carries them
    - to: GST-041
      trigger: Pay the deposit (only when the venue requires one)
      operation: addCartLine
      carries:
      - cartId
      precondition: the reservation is awaitingDeposit
      provenance: 'decided 29 September, rev 3 REV3-8b: `createTableReservation` answered `awaitingDeposit`'
  notes: '**Staff could book a table and a guest could not.** Seven guest-callable operations with no
    guest surface — reservations, cabanas, and both waitlists. **Table-only since 28 September** (decided
    28 September, audit R073 (c)): the cabana wording, the `bookResource` button and `getResourceAvailability`
    left and the screen was renamed from *Reserve a Table or Cabana*. **R073 (c) is superseded on 29 September
    for resources on a venue map** (rev 3 REV3-15 and GAP-C2): guests pick a specific cabana, lounger
    or other spot — including non-dining tables placed on the map, sold like cabanas — on the map booking
    screen GST-074 and buy it. This screen stays the restaurant table reservation, the F&B flow. **Leave
    waitlist** is `leaveRestaurantWaitlist` (audit R073 (d)). **A table deposit is a venue option, off
    by default** (decided 29 September, rev 3 REV3-8b, superseding audit R077 (a)): with it off, no card
    is needed and cancelling is free; with it on, the venue''s `DepositPolicy.dining` sets the amount,
    the basis and the late-cancel and no-show terms.


    **Leaving a waitlist matters as much as joining one.** A guest who has given up and walked away still
    holds a place, and a queue full of people who left is a queue nobody trusts.


    **Rev 3 (decided 29 September).** **No basket without a deposit (REV3-8):** a table reservation and
    a waitlist place confirm straight after `createTableReservation` / `joinRestaurantWaitlist` with a
    *No card needed* confirmation; the prototype''s basket line is prototype-only. **Deposit (REV3-8b):**
    when the venue enabled one, `createTableReservation` answers `awaitingDeposit`; the screen shows `deposit.amount`
    and basis, adds it to the cart (`addCartLine` with `deposit.variantId` and `tableReservationId`),
    pays through checkout (GST-041), and shows `deposit.refundableUntil` and the late-cancel and no-show
    terms. Never a hard-coded amount. Leaving a waitlist is unchanged (audit R073 (d)).'
  density: comfortable
  offline: false
  pattern: form
  patternReason: A booking form (outlet, party size, time) and the restaurant waitlist, each one act;
    no guest-callable read of table availability exists, so `createTableReservation` is what says a time
    is full. Changed from `statusTracker` on 28 September when the cabana availability read left (audit
    R073 (c)); cabanas and other spots on a venue map are booked on GST-074 since 29 September (rev 3
    REV3-15).
  purpose: '**Book a restaurant table, or wait for one.** A guest reserves a table ahead, changes or cancels
    it, or joins and leaves a restaurant''s waitlist. Tables only: cabanas, loungers and other spots on
    a venue map are booked on GST-074 (decided 29 September, rev 3 REV3-15 and GAP-C2, superseding audit
    R073 (c)). A deposit only where the venue enabled one (rev 3 REV3-8b, superseding audit R077 (a)).'
  layout:
    template: form
    regions:
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Reserve
        operation: createTableReservation
        provenance: contract fnb.yaml POST /table-reservations
      - kind: secondaryButton
        label: Change or cancel
        operation: updateTableReservation
        provenance: contract fnb.yaml PATCH /table-reservations/{reservationId}
      - kind: secondaryButton
        label: Join the waitlist
        operation: joinRestaurantWaitlist
        provenance: contract fnb.yaml POST /waitlist
      - kind: destructiveButton
        label: Leave the waitlist
        operation: leaveRestaurantWaitlist
        notes: Leaves the guest's own entry (POST /waitlist/{entryId}/leave); the entry returns `cancelled`
          and the table goes to the next party (decided 28 September, audit R073 (d)).
        provenance: contract fnb.yaml POST /waitlist/{entryId}/leave
    - name: contentBody
      components:
      - kind: cardList
        label: Your reservations and waitlist places
        operation: listMyTableReservations
        notes: 'The guest''s own, upcoming first; each opens Change or cancel, or Leave the waitlist.
          Empty: *No reservations yet* with Reserve.'
        provenance: decided by Chinmay, 3 October 2026 (CHG-SPF-013)
      - kind: selectField
        label: Restaurant
        bindsTo: TableReservation.outletId
        operation: listBookableOutlets
        notes: Only the restaurants that take bookings, as published; the choice scopes Reserve and Join
          the waitlist.
        provenance: decided by Chinmay, 3 October 2026 (CHG-SPF-013)
  states:
    loading: Content loads.
    error: Could not load. **Says what failed and offers one way onward**, never a bare failure.
    emptyFirstRun: '**Nothing reserved.** The booking form is the screen: pick the restaurant, party size
      and time, and `createTableReservation` says if that time is full.'
    emptyNoResults: '**Nothing here yet.** The scope is what narrowed it — naming the scope is what stops
      somebody concluding the record does not exist.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025). A guest who is
      not signed in is offered sign-in and brought back here.'
    offline: '**The offline banner shows.** Availability already loaded stays with its age. **Booking
      is not offered** — a table held offline is a table two people think they have.'
  apis:
  - operationId: createTableReservation
    contract: fnb
    purpose: Book a table in advance
    trigger: onAction
  - operationId: updateTableReservation
    contract: fnb
    purpose: Change or cancel a booking
    trigger: onAction
  - operationId: joinRestaurantWaitlist
    contract: fnb
    purpose: Add a party to an outlet's waitlist
    trigger: onAction
    offline: false
  - operationId: leaveRestaurantWaitlist
    contract: fnb
    purpose: Leave the restaurant waitlist; the entry returns cancelled (decided 28 September, audit R073
      (d))
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Add the table deposit to the cart when the venue requires one
    trigger: onAction
  - operationId: listMyTableReservations
    contract: fnb
    purpose: The guest's own table reservations and waitlist places (self-scoped)
    trigger: onLoad
    provenance: decided by Chinmay, 3 October 2026 (CHG-SPF-013)
  - operationId: listBookableOutlets
    contract: fnb
    purpose: The restaurants that take bookings, published data
    trigger: onLoad
    provenance: decided by Chinmay, 3 October 2026 (CHG-SPF-013)
  entryState:
    params:
    - name: entryId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): the screen loads without it; `leaveRestaurantWaitlist`
        takes the id from the record the user acts on, and an edge or link that holds one only pre-selects
        it.'
    - name: reservationId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createTableReservation`;
        a link or an edge that holds one opens it instead.'
    - name: subjectId
      from: session
    - name: cartId
      from: session
      optional: true
    - name: venueId
      from: session
    coldEntry: '**Resolves from the session.** A guest arriving cold is asked to sign in and returned
      here afterwards — never a 404, and never a screen that silently shows somebody else''s data (ADR-0030).'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-070
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: partial
      view: Account → All screens → Wave 2 → Reserve a table or cabana; Rev 3 feedback → Book a table
        (fixed)
      differences: 'The YAML covers tables only (cabanas are staff-booked, R073c) and has no deposit (R077a).
        The prototype also reserves cabanas and shows a deposit on the reservation, and the Rev 3 web
        flow has a deposit-hold variant at AED 100 per guest. **Stale since 29 September: REV3-8b superseded
        R077 (a); the dining deposit is a venue option, off by default** (CHG-SGU-018).'
  apisNote: 'Rebuilt 9 September 2026 from the 7 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formCreateTableReservation
    component: modal
    trigger: Reserve
    body: Restaurant, date, time and party size on one screen; an optional note for allergies or requests;
      optional seating preference (`seatingPreference`) and occasion (`occasion`), fields on the booking
      since 2 October (DEC-204). Name and contact come from the profile. Nothing the server or staff set
      is asked (id, status, tables, group, actual party size, table visit).
    bindsTo: TableReservation
    confirm:
      label: Reserve
      operation: createTableReservation
    dismiss:
      label: Cancel
      discards:
      - outletId
      - partySize
      - startsAt
      - subjectId
      - guestName
      - contactPoint
      - durationMinutes
      - tables
      - status
      - groupId
      - notes
    provenance: corrected 2 October 2026 (CHG-SGU-002, decided by Chinmay 2 October 2026, DEC-204)
  - id: formUpdateTableReservation
    component: modal
    trigger: Change or cancel
    body: Party size and time only; the restaurant is fixed. With a per-guest deposit, the difference
      or the release is stated before saving.
    bindsTo: TableReservation
    confirm:
      label: Change or cancel
      operation: updateTableReservation
    dismiss:
      label: Cancel
      discards:
      - outletId
      - partySize
      - startsAt
      - subjectId
      - guestName
      - contactPoint
      - durationMinutes
      - tables
      - status
      - groupId
      - notes
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
  - id: formJoinRestaurantWaitlist
    component: modal
    trigger: Join the waitlist
    body: Party size and seating (Any, Indoor, Outdoor, Bar, Booth, High chair needed). Name and contact
      come from the profile; id, status and times are the server's.
    bindsTo: RestaurantWaitlist
    confirm:
      label: Join the waitlist
      operation: joinRestaurantWaitlist
    dismiss:
      label: Cancel
      discards:
      - id
      - outletId
      - partySize
      - status
      - recordedAt
      - subjectId
      - quotedWaitMinutes
      - seatingPreference
      - notifiedAt
      - holdExpiresAt
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
  - id: confirmLeaveRestaurantWaitlist
    component: confirmDialog
    trigger: Leave the waitlist
    body: '**Says the place is given up and the next party moves up**, naming the restaurant and the party
      size. Leaving cannot be undone; joining again goes to the back (audit R073 (d)).'
    provenance: client-verified
- id: GST-071
  name: Payment Methods
  module: Account & Self-Service
  requiresModule: core
  wave: 1
  capability: read-write
  implementation:
    app: guest-app
    route: /account/payment-methods
    component: apps/guest-app/src/routes/account/PaymentMethods.tsx
    status: notStarted
  navigation:
    exitTo:
    - GST-039
    entryFrom:
    - GST-039
    inferred: false
    notes: '**Reached from GST-039** — a payment method is a setting on the profile. Stated on 4 September:
      this screen exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
    transitions:
    - to: GST-039
      trigger: Profile
      carries:
      - subjectId
      provenance: derived — GST-039 declares entryState.params subjectId and GST-071 holds subjectId,
        so an edge into it carries them
  notes: '**A stored card a guest cannot see is a stored card they cannot remove.** `listPaymentTokens`
    and `storePaymentToken` were guest-callable with no guest screen.


    **Wallet transfer and loyalty redemption sit here** because to a guest they are all *how I pay*, whatever
    the contracts call them.'
  density: comfortable
  offline: false
  pattern: listDetail
  patternReason: '`listPaymentTokens` reads a population and nothing reads one of them; the detail is
    the row until a `get` exists'
  purpose: '**A stored card a guest cannot see is a stored card they cannot remove.** `listPaymentTokens`
    and `storePaymentToken` were guest-callable with no guest screen.'
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Saved cards
        bindsTo: PaymentToken
        columns:
        - PaymentToken.method
        - PaymentToken.maskedIdentifier
        - PaymentToken.expiresAt
        - PaymentToken.isDefault
        operation: listPaymentTokens
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        notes: Was the generated table 'Every payment token'; staff and plumbing columns removed (decided
          by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)).
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The gift card
        bindsTo: GiftCard
        columns:
        - GiftCard.cardCode
        - GiftCard.kind
        - GiftCard.faceValue
        - GiftCard.balance
        - GiftCard.status
        operation: getGiftCard
        provenance: contract wallet.yaml GET /gift-cards/{cardCode}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add a card
        operation: storePaymentToken
        provenance: contract orders.yaml POST /payment-tokens
      - kind: secondaryButton
        label: Transfer wallet balance
        operation: transferWalletBalance
        provenance: contract wallet.yaml POST /wallets/{walletId}/transfer
      - kind: secondaryButton
        label: Redeem loyalty points
        operation: redeemLoyaltyPoints
        provenance: contract marketing-crm.yaml POST /loyalty/redemptions
  states:
    loading: Content loads.
    error: Could not load. **Says what failed and offers one way onward**, never a bare failure.
    emptyFirstRun: '**No stored cards.** A guest arrives here after a first purchase, so the empty state
      is the common one.'
    emptyNoResults: '**Nothing here yet.** The scope is what narrowed it — naming the scope is what stops
      somebody concluding the record does not exist.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** Balances and stored cards already loaded stay visible with
      their age, cards masked. Storing a card and transferring value need the server.'
  apis:
  - operationId: listPaymentTokens
    contract: orders
    purpose: A guest's saved payment methods
    trigger: onLoad
  - operationId: storePaymentToken
    contract: orders
    purpose: Save a payment method for future use
    trigger: onAction
    invalidates:
    - listPaymentTokens
  - operationId: transferWalletBalance
    contract: wallet
    purpose: Send balance to another guest
    trigger: onAction
    invalidates:
    - listPaymentTokens
  - operationId: redeemLoyaltyPoints
    contract: marketing-crm
    purpose: Spend points
    trigger: onAction
    invalidates:
    - listPaymentTokens
  - operationId: getGiftCard
    contract: wallet
    purpose: Balance on a gift card
    trigger: onAction
  entryState:
    params:
    - name: subjectId
      from: session
    - name: walletId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): the screen loads without it; `transferWalletBalance`
        takes the id from the record the user acts on, and an edge or link that holds one only pre-selects
        it.'
    - name: cardCode
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): the screen loads without it; `getGiftCard` takes
        the id from the record the user acts on, and an edge or link that holds one only pre-selects it.'
    coldEntry: '**Resolves from the session.** A guest arriving cold is asked to sign in and returned
      here afterwards — never a 404, and never a screen that silently shows somebody else''s data (ADR-0030).'
    preloaded:
    - PaymentToken.id
    - PaymentToken.subjectId
    - PaymentToken.providerId
    - PaymentToken.token
    - PaymentToken.method
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-071
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: Account → All screens → Wave 2 → Payment methods
      differences: The Account → "Payment methods" row opens Engine settings instead of this screen. **The
        frame must open this screen** from Account → Payment methods; the prototype's link to Engine settings
        is a wiring slip (CHG-SGU-020).
  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formStorePaymentToken
    component: modal
    trigger: Add a card
    body: '**The gateway''s own card form**, hosted by the provider; it returns the token that `storePaymentToken`
      saves with the guest''s consent. No token, provider or consent id is ever a field.'
    confirm:
      label: Save card
      operation: storePaymentToken
    dismiss:
      label: Cancel
      discards: []
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  - id: formTransferWalletBalance
    component: modal
    trigger: Transfer wallet balance
    body: '**Collects what `transferWalletBalance` sends before it is called.** Required: `amount`. Optional:
      `toSubjectId`, `toWalletId`, `message`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Transfer wallet balance
      operation: transferWalletBalance
    dismiss:
      label: Cancel
      discards:
      - amount
      - toSubjectId
      - toWalletId
      - message
    provenance: client-verified
  - id: formRedeemLoyaltyPoints
    component: modal
    trigger: Redeem loyalty points
    body: The reward and the points to spend; the guest is the caller, so no subject or programme is asked.
    confirm:
      label: Redeem loyalty points
      operation: redeemLoyaltyPoints
    dismiss:
      label: Cancel
      discards:
      - points
      - rewardId
      - orderId
    provenance: corrected 2 October 2026 (CHG-SGU-020, design-notes correction)
- id: GST-072
