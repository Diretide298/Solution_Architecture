        bindsTo: Order
        columns:
        - Order.orderNumber
        - Order.status
        - Order.currency
        - Order.lines
        - Order.payments
        operation: getOrder
        provenance: contract orders.yaml GET /orders/{orderId}
        notes: 'The selected order: lines, totals, payments and status.'
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Get a tax invoice
        operation: issueTaxInvoice
        notes: Issues a full invoice and shows its number; if the order is already on an invoice, says
          so and shows it rather than an error.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction finance-insights GST-019)
  states:
