- id: GST-076
  name: Intercity Trip — Route & Schedule
  module: Transport
  requiresModule: transport
  wave: 1
  implementation:
    app: guest-app
    route: /transport/route-and-schedule
    component: apps/guest-app/src/routes/transport/RouteAndScheduleList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-001
    - GST-078
    - GST-079
    exitTo:
    - GST-001
    - GST-077
    - GST-078
    - GST-079
