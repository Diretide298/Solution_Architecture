  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Cross-platform navigation
    removed 24 August**: BO-005. **A till does not navigate to a back office and a guest app does not
    navigate to either** — those are device handovers, and a flow declares them with `crossesDevice` rather
    than a screen pretending there is a link. **Renamed 31 August** from *Attractions List*. **A guest
    surface is one product with two renderings** — a screen named differently on web and app is two screens
