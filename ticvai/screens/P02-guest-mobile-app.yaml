- id: GST-059
  name: Plan in Progress
  module: Engagement & Support
  requiresModule: ticketing
  wave: 1
  capability: C02
  implementation:
    app: guest-app
    route: /general/plan-my-day-in-progress
    component: apps/guest-app/src/routes/general/PlanMyDayInProgressDetail.tsx
    status: notStarted
  navigation:
    inferred: false
    entryFrom:
    - GST-022
    - GST-041
    - GST-053
    - GST-054
