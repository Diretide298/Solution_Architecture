    component: apps/guest-app/src/routes/general/SimpleRegistrationAndOtpDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-001
    - GST-041
    - GST-008
    - GST-077
    - GST-079
    inferred: true
    exitTo:
    - GST-001
    - GST-002
    - GST-041
    transitions:
    - to: GST-001
      trigger: Home – Default
      provenance: 'derived — GST-001 declares entryState.params  and GST-042 holds none of them. The edge
        carries nothing: GST-042 is opened from GST-001, so this edge is the way back and GST-001 keeps
        its own state'
    - to: GST-041
      trigger: Signed in and verified — back to the cart
      precondition: arrived from the cart
      carries:
      - cartId
      provenance: decided 17 September 2026 — no order against an unproven contact; rule on identity verifyGuestEmail,
        per-site guestCheckout off by default (matrix 2.6.28)
    - to: WEB-016
      trigger: A guest who checked out anonymously links their order
      provenance: flow F56 step 2→3
      crossesDevice: true
      back: false
      carries:
      - challengeId
      - subjectId
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Corrected 24 August**:
    removed getCurrentSession, logout, selectRole. **A guest surface has no roles to select and its own
    logout.** `selectRole` is ADR-0002 staff authorisation; `getCurrentSession` is the staff session.
    `guestLogout` and `getGuestSession` already existed — the screen was reaching into the staff identity
    surface because nothing checked that a guest platform only calls guest operations. **Rebuilt 28 September
    as a guest sign-in form** (decided 28 September, audit R167, R073 (a)): removed `login`, `startSsoAuthorization`,
    `completeSsoAuthorization`, `listSsoProviders` and the six MFA operations — guests have no enterprise
    SSO. **The second factor came back on 29 September, per venue** (see below). Password sign-in is `guestPasswordLogin`.


    **Rev 3 (decided 29 September).** **Guest two-step verification is per venue, off by default** (GAP-B1,
    `VenueSettings.identity.guestTwoStep`; supersedes the second part of audit R167; no enterprise SSO
    stands). The prompt appears only when signing in or acting at a venue that has it on; enrolment is
    on the guest''s account (GST-073). **Sign-in gate (REV3-3):** reached from GST-008 (after add-ons)
    or GST-041 (at payment), returning to the basket with it kept; guest checkout and matching unchanged
    (DG-1).


    **The venue in context is sent** (decided 29 September, rev 3 GAP-B1, per venue): `verifyGuestOtp`,
    `guestPasswordLogin`, `guestSocialLogin`, `guestUaePassLogin` and `createMfaChallenge` take an optional
    `venueId`, the venue the app or booking is in, so the second factor is asked only where that venue
    has guest two-step verification on.


    **29 September (W1).** The guest pop-up asks only `guestContactFields` (Email only / + name / + mobile),
    then the six-digit code (DG-1). After the code the guest is not asked for name, email or phone again:
    back to the basket and on to the T&Cs (GST-009).'
  density: comfortable
  pattern: form
  patternReason: '**A sign-in form, not a list.** Four ways in (a one-time code, a password, Apple or
    Google, UAE Pass) and a way to register; `getGuestSession` is the one piece of context. Rebuilt 28
    September: the screen had been generated as a list of MFA methods and SSO providers, neither of which
    a guest has (decided 28 September, audit R167, R073 (a)). The second-factor prompt is back as a step
    of sign-in, only at a venue that has guest two-step verification on (decided 29 September, rev 3 GAP-B1).'
  purpose: 'Get a guest into the app, fast, on a device that may be shared: a one-time code to the email
    or mobile, a password, Apple or Google, or UAE Pass, or register a new account. **No enterprise SSO
    for guests** (decided 28 September, audit R167, first part). **A second factor only where the venue
    enabled guest two-step verification** (decided 29 September, rev 3 GAP-B1, per venue, superseding
    the second part of R167).'
