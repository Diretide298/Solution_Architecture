    - to: GST-038
      trigger: Directions (At the Venue, Map)
      provenance: decided 29 September 2026, MOB-6
    - to: GST-001
      trigger: Home tab
      provenance: decided 29 September 2026, MOB-1
  notes: 'Minuted 10 Aug §4.9. **The in-visit half of GST-051** — one capability, two moments. ** wired
    24 August.** The board drew four bespoke AI endpoints for itinerary planning; **one operation with
    a kind answers all of them** (ADR-0028), and recording the outcome is what lets a model replace the
    heuristic later. **`recordSuggestionOutcome` removed from the guest surface.** `check-screens` refused
    it and was right: **a guest does not record an outcome — the platform observes what they did.** A
    guest app that self-reports whether it took the advice is a training label the guest could forge,
    and the observation belongs server-side where the plan and the visit can be compared. **Deferred on
    28 September (audit R187), and brought back the next day**: the itinerary planner was put in `wave:
    4` with a `deferred` block and kept rather than deleted; the 29 September re-plan below superseded
    that, and the screen is in Block A, wave 1 (3 October 2026, CHG-SPF-006). **Itinerary suggestion removed
    28 September** (decided 28 September, audit R209): the planner was deferred (R187) and `requestSuggestion`
    refuses a guest anything but prepPlan, upsell and waitTime, so this screen no longer asks for a day
    plan.


    **Rev 3 (decided 29 September).** Had stayed deferred (GAP-C3); superseded the same day by the re-plan
    below.


    **Brought into Block A on 29 September** (Chinmay, the 29 September re-plan, MOB-6): a rules-based
    planner with the AI planner agent on top. This supersedes audit R187, the deferral half of R209 and
    rev 3 GAP-C3; the `deferred` block is removed and the screen is wave 1.


    **Mobile v4 role (MOB-6): "Plan in Progress".** Today''s plan against live waits (`getWaitTimes`);
    rules-based, AI not required.'
  density: comfortable
  pattern: listDetail
  patternReason: '`listProducts` reads the population and `getWaitTimes` reads one of them — list, select,
    act'
  purpose: Today's plan while you are in the venue, re-ordered against live waits.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: timeline
        label: Today
        bindsTo: VisitPlanItem
        operation: getVisitPlan
        notes: Today's items with done, now and next; each ride with its live wait.
        provenance: decided 29 September 2026, MOB-6
      - kind: banner
        label: Waits changed
        operation: getWaitTimes
        notes: When a wait makes the next item late, proposes a re-order or a swap (`listVisitPlanAlternatives`);
          the guest decides.
        provenance: decided 29 September 2026, MOB-6
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Re-order my day
        operation: updateVisitPlan
        notes: Saves the proposed order as a new plan version.
        provenance: decided 29 September 2026, MOB-6
      - kind: secondaryButton
        label: Swap
        operation: listVisitPlanAlternatives
        notes: Candidates that suit everyone, nearest first.
        provenance: decided 29 September 2026, MOB-6
  states:
    loading: The plan builds in place; the inputs stay on screen.
    error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
    emptyFirstRun: 'No plan for today: offers to make one (GST-051).'
    emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s
      height): says so and offers to change the answers.'
    emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose
      it is; a signed-out guest can still build a plan and is asked to sign in only to save or book it.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: getWaitTimes
    contract: queue
    purpose: Wait times across a venue
    trigger: onLoad
  - operationId: getVisitPlan
    contract: venue-map
    purpose: 'The plan: days, timed items and add-on suggestions, at its current version Only when signed
      in (decided 2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onLoad
    provenance: decided 29 September 2026, MOB-6
  - operationId: updateVisitPlan
    contract: venue-map
    purpose: 'Swap, remove, add or undo: each change is a new version, so undo goes back one'
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  - operationId: listVisitPlanAlternatives
    contract: venue-map
    purpose: Swap candidates for one item that suit everyone in the party
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  entryState:
    params:
    - name: planId
      from: GST-053
    - name: venueId
      from: session
    - name: itemId
      from: navigation
      optional: true
    coldEntry: 'Opened from a reminder on the visit day: today''s plan, or an offer to make one when there
      is none. `itemId` is the plan item the guest taps Swap on, picked on this screen.'
  wireframe:
    status: notStarted
    provenance: designed
    board: wireframes/P02 Guest App.dc.html#gst-059
    prototype:
