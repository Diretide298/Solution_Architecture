  notes: 'Minuted 10 Aug §4.9. **The AI half came second in the 10 August minutes** — the manual planner
    must work without it (CF-41); since the 29 September re-plan (MOB-6) both are in Block A. **Guest
    concierge confirmed in Phase 1 on 17 August (CF-14), charged per token and bounded by `AiPolicy.guestCapabilityScope`.**
    Still degrades to the manual planner rather than to an error. ** wired 24 August.** The board drew
    four bespoke AI endpoints for itinerary planning; **one operation with a kind answers all of them**
    (ADR-0028), and recording the outcome is what lets a model replace the heuristic later. **`recordSuggestionOutcome`
    removed from the guest surface.** `check-screens` refused it and was right: **a guest does not record
    an outcome — the platform observes what they did.** A guest app that self-reports whether it took
    the advice is a training label the guest could forge, and the observation belongs server-side where
    the plan and the visit can be compared. **Deferred on 28 September (audit R187), and brought back
    the next day**: the itinerary planner was put in `wave: 4` with a `deferred` block and kept rather
    than deleted; the 29 September re-plan below superseded that, and the screen is in Block A, wave 1
    (3 October 2026, CHG-SPF-006). **Itinerary suggestion removed 28 September** (decided 28 September,
    audit R209): the planner was deferred (R187) and `requestSuggestion` refuses a guest anything but
    prepPlan, upsell and waitTime, so this screen no longer asks for a day plan.


    **Rev 3 (decided 29 September).** Had stayed deferred (GAP-C3); superseded the same day by the re-plan
    below.


    **Brought into Block A on 29 September** (Chinmay, the 29 September re-plan, MOB-6): a rules-based
    planner with the AI planner agent on top. This supersedes audit R187, the deferral half of R209 and
    rev 3 GAP-C3; the `deferred` block is removed and the screen is wave 1.


    **Mobile v4 role (MOB-6): "AI Planner".** The agent refines the rules plan by chat; its tools are
    the plan operations, and `requestSuggestion` gains the guest-allowed kind `itinerary` (what R209 said
    to add if the planner ships). AI writes only `ai.*` stores; the plan change itself is `updateVisitPlan`.
    **The rules plan never fails over to an error**: with AI off, not licensed or failing, the guest keeps
    the rules plan and the Plan tab works in full.


    **Grounding (client meeting 30 September, MoM 4.7, Allam).** The agent''s candidates are only the
    rides, dining and retail (shops and kiosks) of each day''s own park, as the plan operations return
    them; `updateVisitPlan` refuses a point from another park (`point-not-at-day-venue`) as the backstop.


    **A signed-out guest builds and changes a plan** (decided by Chinmay, 3 October 2026 (CHG-SPF-012)):
    the plan lives in an anonymous session; signing in is asked only to save, share or book, and the plan
    moves to the account on sign-in.'
  density: comfortable
