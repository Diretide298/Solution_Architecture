    31 August**: added listPerformances. **A guest does not know which surface they are on** — the same
    named screen on web and app now calls the same guest-callable operations.


    **Rev 3 (decided 29 September).** Ticket tags (23SEP-3) and the product''s own photo or video (23SEP-4);
    an info-only product shows its label and no Book (REV3-14). Book goes to the date and time (GST-007)
