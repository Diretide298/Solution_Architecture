    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  - operationId: requestSuggestion
    contract: ai
    purpose: 'A suggestion of kind `itinerary` (guest-allowed since 29 September): the planner agent''s
      proposal for the plan, applied through `updateVisitPlan`'
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  entryState:
    params:
    - name: planId
      from: GST-053
    - name: conversationId
      from: deepLink
      optional: true
    - name: venueId
      from: session
    coldEntry: 'A planner link from a notification: opens the plan and its conversation, or the plan alone
      if the conversation was closed.'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-054
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html
      rev: mobile v4 (30 September build)
