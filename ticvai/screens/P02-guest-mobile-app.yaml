    REV3-4), to the map booking for a spot on a venue map (GST-074, REV3-15), or to the space booking
    (GST-075, REV3-13). Help me choose sits on the booking step (GST-008), not here (REV3-11). The event
    banner lists dates only when `eventBannerDates` is on (23SEP-19).


    **Mobile v4 (decided 29 September, MOB-4).** GST-004 and GST-006 become one **Item Detail** screen
    for rides, shows, restaurants and shops: **one implementation, both ids kept** (as GAP-D3). Gallery,
    the 2D/3D map pin (`getVenueMap`) and a product card from `VenuePoint.featuredOffer` (product or bundle).
    *Buy meal combo* adds the required admission because the bundle carries it. **W3:** an info-only product
    shows Call sales / Email sales instead of Book.


    **Video plays directly (client meeting 30 September, MoM 4.8, Qossai; agreed by Chinmay).** On a ride
    or attraction the info button reveals the details and plays the video straight away; the loader that
    stood in front of it is removed. While the video buffers its poster frame shows; a video that cannot
    play leaves the poster and the details, never an error screen.'
  density: comfortable
