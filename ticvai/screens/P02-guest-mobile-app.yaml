    (CHG-SGU-021)'
  purpose: Show the live ticket code at the gate.
  gaps:
  - operation: getEntitlementCredential
    why: '**`getEntitlementCredential` declares its response inline**, so the component that shows it
      names fields but binds to no schema. The contract should name the shape.'
    source: contract access.yaml GET /entitlements/{entitlementId}/credential
  layout:
    template: form
    regions:
    - name: actionBar
      slot: publish
      components:
      - kind: secondaryButton
        label: Bind credential device
        operation: bindCredentialDevice
        notes: '**The guest app binds a mobile credential to the phone it is shown on** (P02 GST-055 Dynamic
          QR Ticket), before the dynamic QR is displayed.'
        provenance: contract access.yaml POST /my/credentials/{credentialId}/device-bindings
    - name: contentBody
      slot: carried
      components:
      - kind: dataTable
        label: Every entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        operation: listMyEntitlements
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: credentialDisplay
        label: Your code
        operation: getEntitlementCredential
        notes: '**The code rotates every 30 seconds by default, the venue''s setting** (decided by Chinmay,
          2 October 2026; DEC-136; `DynamicQrSecurityProfile.refreshIntervalSeconds`: 15, 30, 45, 60 or
          a custom value of at least 5 seconds, matching BO-165). A countdown shows the seconds to the
          next code; the seed''s time step is that one setting, never a value of its own (CHG-SGU-003).


          **Every 30 seconds** (decided by Chinmay, 3 October 2026 (CHG-SPF-012): GST-055''s admission
          QR rotates every 30 seconds; the answer named GST-069 and meant this screen): the default above,
          which the venue may change.'
        provenance: corrected 2 October 2026 (CHG-SGU-003, decided by Chinmay 2 October 2026, DEC-136)
      - kind: detailPanel
        label: The entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        - Entitlement.lastEntryAt
        operation: getEntitlement
        provenance: contract access.yaml GET /entitlements/{entitlementId}
  states:
    loading: Availability is live, never cached
    error: Availability unavailable. **Selection is blocked** — overselling is worse than waiting
    emptyFirstRun: '**Sold out is a real answer.** Offers the next available rather than a dead end'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** A ticket already loaded shows its rotating code, derived on
      the device from its seed, so it changes with no signal (decided 28 September, audit R230). Transferring
      a ticket needs the connection.'
  apis:
  - operationId: listMyEntitlements
    contract: access
    purpose: The guest's tickets and passes
    trigger: onLoad
  - operationId: getEntitlement
    contract: access
    purpose: The selected ticket
    trigger: onAction
  - operationId: getEntitlementCredential
    contract: access
    purpose: The QR code that gets scanned, refreshed — with the `rotation` seed the device derives the
      rotating code from (audit R230)
    trigger: onAction
  - operationId: bindCredentialDevice
    contract: access
    purpose: Bind my credential to this device
    trigger: onAction
    invalidates:
    - listMyEntitlements
  entryState:
    params:
    - name: subjectId
      from: session
    - name: orderId
      from: deepLink
