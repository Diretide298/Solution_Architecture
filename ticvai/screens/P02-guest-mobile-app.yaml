    inferred: false
    notes: '**Reached from GST-039** — sign-in security is a setting on the profile. Stated on 4 September:
      this screen exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
    transitions:
    - to: GST-039
      trigger: Profile
      carries:
      - subjectId
      provenance: derived — GST-039 declares entryState.params subjectId and GST-073 holds subjectId,
        so an edge into it carries them
  notes: '**A guest could enrol a second factor and not manage it.** Small screen, and it is the one a
    guest reaches after losing a phone. **Two-step verification, per venue** (decided 29 September, rev
    3 GAP-B1, per venue, superseding the second part of audit R167, which had removed it on 28 September):
    a guest may enrol a method on their account (`listMfaMethods`, `enrolMfaMethod`, `verifyMfaEnrolment`,
    `removeMfaMethod`; an authenticator, with an email code as fallback), **offered only when at least
    one venue of the tenant has `VenueSettings.identity.guestTwoStep.enabled` on** — when none has, the
    section is not shown. The code is then asked only when signing in or acting at a venue that has it
    on (step-up before that venue''s `guestTwoStep.stepUpActions`: `createMfaChallenge`, `verifyMfaChallenge`).
    No enterprise SSO for guests (R167, first part, stands). What the screen offers instead: the sign-in
    methods linked to the account (`GuestSession.identityProviders`), confirming the email that recovers
    it (`verifyGuestEmail`), the devices that hold its credentials and signing a lost one out (`listGuestDevices`,
    `revokeGuestDevice`), and signing out here (`guestLogout`). The contract has no guest operation that
    lists sessions, so "your sessions" is the device list.'
  density: comfortable
  offline: false
  pattern: configEditor
  patternReason: settings for the guest's own sign-in — the linked sign-in methods (`getGuestSession`)
    and the devices that hold the account (`listGuestDevices`), each with one act; not a list to browse
  purpose: '**How this guest signs in, and where.** The sign-in methods linked to the account, the email
    that recovers it, and the devices signed in, with a way to sign a lost phone out. Small screen, and
    it is the one a guest reaches after losing a phone. Two-step verification where a venue of the tenant
    enabled it (decided 29 September, rev 3 GAP-B1, per venue).'
  layout:
    template: form
    regions:
    - name: actionBar
      slot: publish
      components:
      - kind: secondaryButton
        label: Sign out on this device
        operation: guestLogout
        provenance: contract identity.yaml DELETE /auth/guest/session
      - kind: destructiveButton
        label: Stop notifications on this device
        operation: revokeGuestDevice
        provenance: contract marketing-crm.yaml DELETE /guests/{subjectId}/devices/{deviceId}
      - kind: secondaryButton
        label: Verify guest email
        operation: verifyGuestEmail
        provenance: contract identity.yaml POST /auth/guest/verify-email
      - kind: secondaryButton
        label: Set up two-step verification
        operation: enrolMfaMethod
        provenance: decided 29 September, rev 3 GAP-B1
    - name: contentBody
      components:
      - kind: dataTable
        label: My devices
        bindsTo: GuestDevice
        columns:
        - GuestDevice.platform
        - GuestDevice.status
        - GuestDevice.failureCount
        - GuestDevice.registeredAt
        operation: listGuestDevices
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
      - kind: detailPanel
        label: How you sign in
        bindsTo: GuestSession
        columns:
        - GuestSession.displayName
        - GuestSession.isVerified
        - GuestSession.identityProviders
        operation: getGuestSession
        notes: The sign-in methods linked to this account (code, password, Apple, Google, UAE Pass) and
          whether its contact is verified. A second factor is listed only when a venue of the tenant enabled
          guest two-step verification (decided 29 September, rev 3 GAP-B1, per venue).
        provenance: contract identity.yaml GET /auth/guest/session
      - kind: cardList
        label: Two-step verification
        notes: Enrol, verify, remove. **Shown only when a venue of the tenant has guest two-step verification
          on.**
        operation: listMfaMethods
        provenance: decided 29 September, rev 3 GAP-B1 (per venue)
  states:
    loading: Content loads.
    error: Could not load. **Says what failed and offers one way onward**, never a bare failure.
    emptyFirstRun: '**Only this device is signed in.** The device list holds one row, this one, and the
      screen says that signing in elsewhere will add a row here.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**Nothing here is offered offline, and the banner says so.** An erasure request or a device
      change queued and never sent is worse than one that could not be made — the legal clock starts when
      the platform receives it, and a device signed out offline is still signed in.'
  apis:
  - operationId: getGuestSession
    contract: identity
    purpose: The sign-in methods linked to the account and whether it is verified
    trigger: onLoad
  - operationId: guestLogout
    contract: identity
    purpose: Sign out on this device
    trigger: onAction
  - operationId: listGuestDevices
    contract: marketing-crm
    purpose: Which devices hold this guest's credentials
    trigger: onLoad
  - operationId: registerGuestDevice
    contract: marketing-crm
    purpose: The app registers its push token silently at launch; never a button or a typed token
    trigger: background
  - operationId: revokeGuestDevice
    contract: marketing-crm
    purpose: Sign a lost device out
    trigger: onAction
  - operationId: verifyGuestEmail
    contract: identity
    purpose: Confirm the address before it can recover an account
    trigger: onAction
  - operationId: listMfaMethods
    contract: identity
    purpose: The guest's enrolled methods
    trigger: onLoad
  - operationId: enrolMfaMethod
    contract: identity
    purpose: Enrol an authenticator (email code as fallback)
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: verifyMfaEnrolment
    contract: identity
    purpose: Confirm the enrolment with a first code
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: removeMfaMethod
    contract: identity
    purpose: Remove a method
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: createMfaChallenge
    contract: identity
    purpose: Step-up before a sensitive act at a venue that has it on
    trigger: onAction
  - operationId: verifyMfaChallenge
    contract: identity
    purpose: Check the step-up code
    trigger: onAction
  entryState:
    params:
    - name: subjectId
      from: session
    - name: deviceId
      from: session
    - name: challengeId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createMfaChallenge`;
        a link or an edge that holds one opens it instead.'
    - name: methodId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen lists them with `listMfaMethods`
        and the user picks one; an edge that holds one may still carry it to open on that record.'
    coldEntry: '**Resolves from the session.** A guest arriving cold is asked to sign in and returned
      here afterwards — never a 404, and never a screen that silently shows somebody else''s data (ADR-0030).'
  wireframe:
    status: notStarted
    provenance: designed
    board: wireframes/P02 Guest App.dc.html#gst-073
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html
      rev: Mobile App v4, 29 September 2026
      match: none
      note: 'Mobile App v4 has no view for this screen. Drawn by Claude Code on 30 September 2026 in the
        v4 look (the frame on this screen''s board, wireframes/frames/gst-073.html, and #GST-073 in handoff/design-batches/apps/1-guest-app/return/TICVAI
        Guest App.dc.html). NOT client-verified: awaiting the client''s design reviewer. Build the layout
        from that frame and this definition. Mobile v2 (28 September, superseded by v4) showed it at:
        Account → All screens → Wave 2 → Security & sign-in (partial). What v2 did differently: Prototype
        offers two-step verification and a trusted-device skip, but the YAML says guests have no second
        factor (R167). Either remove the toggle from the prototype or reopen the decision.'
    source: Claude Code, 30 September 2026, drawn in the Mobile App v4 look
    note: '**Drawn by Claude Code on 30 September 2026 in the Mobile App v4 look; not client-verified,
      awaiting the client''s design reviewer.** `provenance: designed` because the accepted vocabulary
      has no value for an agent-drawn frame; it is the value the eight Claude Design frames of 29 September
      carry. Gaps the operations leave are in handoff/design-batches/apps/1-guest-app/return/FINDINGS.md.'
  apisNote: 'Rebuilt 9 September 2026 from the 1 operation this screen declares, not from a workshop pack
    — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: confirmRevokeGuestDevice
    component: confirmDialog
    trigger: Stop notifications on this device
    body: '**Names what `revokeGuestDevice` changes and what it leaves alone**, in the consequence rather
      than the verb. A security sign-in this affects should be identified in the dialog, not just counted.'
    provenance: client-verified
  - id: formVerifyGuestEmail
    component: modal
    trigger: Verify guest email
    body: '**Collects what `verifyGuestEmail` sends before it is called.** Required: `mode`. Optional:
      `token`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Verify guest email
      operation: verifyGuestEmail
    dismiss:
      label: Cancel
      discards:
      - mode
      - token
    provenance: client-verified
  - id: formEnrolMfaMethod
    component: modal
    trigger: Set up two-step verification
    body: '**Collects what `enrolMfaMethod` sends**, then asks for the first code (`verifyMfaEnrolment`).
      The guest is told the code will be asked only at venues that turned it on. Dismissing enrols nothing.'
    confirm:
      label: Turn on
      operation: verifyMfaEnrolment
    dismiss:
      label: Cancel
      discards:
      - methodId
    provenance: client-verified
- id: GST-074
  name: Map Booking — Cabanas & Spots
  module: Booking & Selection
  requiresModule: resources
  wave: 1
  implementation:
    app: guest-app
    route: /general/map-booking
    component: apps/guest-app/src/routes/general/MapBookingCanvas.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-004
    - GST-058
    exitTo:
    - GST-004
    - GST-041
    - GST-016
    transitions:
    - to: GST-041
      trigger: Go to checkout
      operation: addCartLine
      carries:
      - cartId
      precondition: a spot is held and added
      provenance: decided 29 September, rev 3 REV3-15
    - to: GST-016
      trigger: See it in my reservations
      provenance: decided 29 September, rev 3 REV3-15; flow F52 step 2→3
    - to: GST-004
      trigger: Back to the product
      back: true
      provenance: decided 29 September, rev 3 REV3-15
      carries:
      - productId
  notes: '**New 29 September** (decided 29 September, rev 3 REV3-15 and GAP-C2). **Cabana maps work like
    the stadium seat map:** the venue''s map is ingested with its cabanas, loungers and other bookable
    spots (number, zone, capacity, price band), and the guest picks a specific one on the map and buys
    it. This supersedes audit R073 (c) (*cabanas stay staff-booked*) for resources placed on an ingested
    map. **Tables on the map are non-dining spots sold like cabanas** (decided 29 September by the user);
    a restaurant table stays the F&B reservation flow (WEB-036 / GST-070). The map comes from `getVenueMap`
    (its `resources`: label, kind, zone, capacity, price band, boundary) and the status of every spot
    for the chosen day from one `getMapResourceAvailability` call, joined on `resourceId`; held, booked
    and unavailable spots are greyed. Tapping a free spot calls `createResourceHold` and starts the *Remaining
    time* counter from the hold''s `expiresAt` (8 minutes, extendable to 30 in all, audit R169); Add to
    basket sends `addCartLine` with the spot''s price-band `variantId` and the `resourceHoldId`, e.g.
    *Cabana B09 · Large cabana · Beach, AED 1,855*. Picking another spot releases the first hold (`relinquishResourceHold`).


    **29 September (W6).** Map booking of cabanas stays **optional per flow**: the venue picks *Cabana:
    pick on map* (GST-074) or *Cabana: by size* (GST-050 / GST-058) as its booking flow (CMS-103), and
    the resource selection policy (`guestMayChoose`, REV3-15) decides whether the guest chooses the unit.
    Same venue-map back end as F&B and locations.'
  density: comfortable
  pattern: listDetail
  patternReason: '`getMapResourceAvailability` reads the population of spots and a tap holds one of them
    — list (as a map), select, act'
  purpose: Pick a specific cabana, lounger or other spot on the venue map and hold it while you book.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: datePicker
        label: Date
        notes: Sends `from`/`to` (the venue's opening for the day, or a slot) to `getMapResourceAvailability`.
        operation: getMapResourceAvailability
        provenance: decided 29 September, rev 3 REV3-15
      - kind: numberField
        label: Who is coming
        notes: '`partySize`; a spot smaller than the party is refused `422 party-exceeds-capacity`.'
        operation: createResourceHold
        provenance: decided 29 September, rev 3 REV3-15
      - kind: selectField
        label: Area
        bindsTo: PlacedResource.zone
        notes: Beach, Tower, Riverside, Splash zone… from the placed resources' zones.
        operation: getVenueMap
        provenance: decided 29 September, rev 3 REV3-15; prototype cabana map
      - kind: seatMap
        label: Venue map
        bindsTo: VenueMapDetail.resources
        notes: The ingested map with every placed spot drawn at its boundary and numbered (R01-R10, T01-T08,
          S01-S06, B01-B10 on Coastal Aqua). Free spots are tappable; held, booked and unavailable ones
          greyed.
        operation: getVenueMap
        provenance: decided 29 September, rev 3 REV3-15, GAP-C2
      - kind: cardList
        label: Spots
        bindsTo: MapResourceAvailability.resources
        notes: 'The same spots as a list for the chosen area: number, capacity, price band and price,
          status. The accessible alternative to the map.'
        operation: getMapResourceAvailability
        provenance: decided 29 September, rev 3 REV3-15
      - kind: selectField
        label: Map
        bindsTo: BookableVenueMaps.maps
        operation: listBookableVenueMaps
        notes: '**Which map to book on.** `listBookableVenueMaps(venueId, productId)` returns the venue''s
          published maps that carry bookable spots; with one map the screen opens it directly and this
          choice is not shown. The chosen map''s `mapId` is what `getVenueMap` (at its `publishedVersion`)
          and `getMapResourceAvailability` read (decided 29 September, rev 3 REV3-15).'
        provenance: contract venue-map.yaml GET /bookable-venue-maps
    - name: contextPanel
      slot: selection
      components:
      - kind: banner
        label: Remaining time
        bindsTo: ResourceHold.expiresAt
        notes: Counts down from the hold's `expiresAt`, always visible. At zero the spot is released and
          the guest is told.
        operation: getResourceHold
        provenance: decided 29 September, rev 3 REV3-15; audit R169
      - kind: detailPanel
        label: The spot you picked
        bindsTo: PlacedResource
        columns:
        - PlacedResource.label
        - PlacedResource.kind
        - PlacedResource.zone
        - PlacedResource.capacity
        - PlacedResource.priceBandCode
        operation: getVenueMap
        provenance: decided 29 September, rev 3 REV3-15
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add to basket
        notes: Sends `variantId` (the spot's price band) and `resourceHoldId`.
        operation: addCartLine
        provenance: decided 29 September, rev 3 REV3-15
      - kind: secondaryButton
        label: Keep it longer
        operation: extendResourceHold
        provenance: decided 29 September, rev 3 REV3-15
      - kind: secondaryButton
        label: Pick another
        notes: Releases the hold at once so the spot is free for others.
        operation: relinquishResourceHold
        provenance: decided 29 September, rev 3 REV3-15
  states:
    loading: The venue map and the status of every spot for the day, read together.
    error: Could not load the map or the spots. Names which read failed; nothing is held.
    emptyFirstRun: '**No bookable spots are placed on this map yet.** Says so and offers the venue''s
      other ways to book, rather than an empty map.'
    emptyNoResults: Every spot in this area is taken for the day. Names the area and offers another area
      or day.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** The map and the spots already loaded stay on screen with their
      age, never shown as free now. Holding a spot and adding it to the basket need the connection — a
      cabana held offline is a cabana two people think they have.'
  apis:
  - operationId: getVenueMap
    contract: venue-map
    purpose: The map with its placed spots (label, kind, zone, capacity, price band)
    trigger: onLoad
  - operationId: getMapResourceAvailability
    contract: resources
    purpose: Every spot's status for the day in one call
    trigger: onLoad
  - operationId: createResourceHold
    contract: resources
    purpose: Hold the tapped spot for the window
    trigger: onAction
    invalidates:
    - getMapResourceAvailability
  - operationId: getResourceHold
    contract: resources
    purpose: 'The hold''s countdown With the guest session the device already holds: signed in, or the
      anonymous cart session a visitor gets with the first line (ADR-0045) (decided 2 October 2026 by
      Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onInterval
  - operationId: extendResourceHold
    contract: resources
    purpose: Keep the hold longer while paying
    trigger: onAction
  - operationId: relinquishResourceHold
    contract: resources
    purpose: Release the hold
    trigger: onAction
    invalidates:
    - getMapResourceAvailability
  - operationId: addCartLine
    contract: orders
    purpose: Add the held spot to the basket (`variantId`, `resourceHoldId`)
    trigger: onAction
  - operationId: listBookableVenueMaps
    contract: venue-map
    purpose: Find the venue's published map with bookable spots (with productId when the product page
      opened it); getVenueMap then reads that map's published version (decided 29 September, rev 3 REV3-15)
    trigger: onLoad
  entryState:
    params:
    - name: mapId
      from: GST-004
      optional: true
    - name: productId
      from: GST-004
      optional: true
    - name: cartId
      from: session
    - name: venueId
      from: session
    - name: holdId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createResourceHold`;
        a link or an edge that holds one opens it instead.'
    coldEntry: '**A link to a map that is no longer published, or a day that has passed,** says which
      and offers today on the current map. Nothing is held on arrival.'
  wireframe:
    status: notStarted
    provenance: designed
    board: wireframes/P02 Guest App.dc.html#gst-074
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html
      rev: Mobile App v4, 29 September 2026
      match: none
      note: 'Mobile App v4 has no view for this screen. Drawn by Claude Code on 30 September 2026 in the
        v4 look (the frame on this screen''s board, wireframes/frames/gst-074.html, and #GST-074 in handoff/design-batches/apps/1-guest-app/return/TICVAI
        Guest App.dc.html). NOT client-verified: awaiting the client''s design reviewer. Build the layout
        from that frame and this definition. Mobile v2 (28 September, superseded by v4) showed it at:
        Account → All screens → Rev 3 feedback → Cabana map (r3cabmap) (exact).'
    source: Claude Code, 30 September 2026, drawn in the Mobile App v4 look
    note: '**Drawn by Claude Code on 30 September 2026 in the Mobile App v4 look; not client-verified,
      awaiting the client''s design reviewer.** `provenance: designed` because the accepted vocabulary
      has no value for an agent-drawn frame; it is the value the eight Claude Design frames of 29 September
      carry. Gaps the operations leave are in handoff/design-batches/apps/1-guest-app/return/FINDINGS.md.'
  apisNote: Authored 29 September 2026 from the rev 3 decisions and the client prototype view named in
    `wireframe.prototype`; every operation exists in the contracts (decided 29 September, rev 3).
  overlays:
  - id: confirmReleaseHold
    component: confirmDialog
    trigger: Pick another (or tapping a second spot)
    body: '**Release the spot you are holding?** It goes back on the map at once and someone else may
      take it.'
    confirm:
      label: Release it
      operation: relinquishResourceHold
    dismiss:
      label: Keep it
      carries:
      - holdId
    provenance: client-verified
- id: GST-075
  name: Book a Space by the Hour
  module: Booking & Selection
  requiresModule: resources
  wave: 1
  implementation:
    app: guest-app
    route: /general/space-by-the-hour
    component: apps/guest-app/src/routes/general/SpaceByTheHourWizard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-004
    exitTo:
    - GST-004
    - GST-041
    transitions:
    - to: GST-041
      trigger: Add to basket
      operation: addCartLine
      carries:
      - cartId
      precondition: date, start time, length and room type chosen
      provenance: decided 29 September, rev 3 REV3-13
    - to: GST-004
      trigger: Back to the product
      back: true
      provenance: decided 29 September, rev 3 REV3-13
      carries:
      - productId
  notes: '**New 29 September** (decided 29 September, rev 3 REV3-13: meeting rooms by the hour are in
    scope). A staged booking: date → start time → length (1 hour, 2 hours, half day, full day) → room
    type (focus pod, majlis, boardroom, auditorium) → attendees → add-ons (coffee break, working lunch,
    AV technician). **A room type is a product with `requiresTimeWindow`; a length is one of its variants**
    (the `length` axis, each value with `durationMinutes`), priced on its own, so the price is the variant''s
    — the room rate for that length. The guest never names a room: `addCartLine` carries `bookedWindow`
    {startsAt, endsAt}, `endsAt` being the start plus the length, and `allocateResources` picks the room
    at checkout (26 August minute). Add-ons are lines with `parentLineId`. `422 windowLengthMismatch`,
    `windowRequired` and `windowNotAllowed` are programming errors; `409 windowUnavailable` says the time
    filled and offers the next free start.


    **29 September (W9).** Availability is checked against date, start time and length together (`listProductStartTimes`
    with `variantId` = length); changing any of the three re-checks every room, and a busy room shows
    *free from*. Starts every 15 minutes where the venue sets `stepMinutes` 15.'
  density: comfortable
  pattern: multiStepForm
  patternReason: A staged booking — date, start time, length, room type, attendees, add-ons — ending in
    one `addCartLine`
  purpose: Book a meeting room or other space for a start time and a length; the price is the room rate
    for that length.
  layout:
    template: wizard
    regions:
    - name: contentBody
      slot: fields
      components:
      - kind: datePicker
        label: Select a date
        provenance: decided 29 September, rev 3 REV3-13
      - kind: selectField
        label: Start time
        bindsTo: ProductStartTime
        notes: The start times at which a room of the chosen type is free for the chosen length (`listProductStartTimes`
          with `productId`, `variantId` = the length, `date`; hourly, 08:00-20:00 in the prototype), each
          with how many rooms of the type are left. The chosen start and start + length go to `addCartLine`
          as `bookedWindow`.
        operation: listProductStartTimes
        provenance: decided 29 September, rev 3 REV3-13
      - kind: selectField
        label: How long
        bindsTo: ProductVariant
        notes: '1 hour, 2 hours, half day (4 h), full day (8 h): the room type''s `length` variants, each
          priced on its own (the prototype shows *Save 10%* and *Save 15%*).'
        operation: listProductVariants
        provenance: decided 29 September, rev 3 REV3-13
      - kind: cardList
        label: Choose a room
        bindsTo: Product
        notes: Room types (focus pod, majlis room, boardroom, auditorium) with capacity, description,
          badge and the price for the chosen length.
        operation: listProducts
        provenance: decided 29 September, rev 3 REV3-13
      - kind: numberField
        label: Attendees
        notes: For the visitor list at reception; a room type smaller than the party is not offered.
        provenance: decided 29 September, rev 3 REV3-13
      - kind: cardList
        label: Add to the booking
        bindsTo: Product
        notes: 'Coffee break, working lunch, AV technician: add-on lines with `parentLineId`.'
        operation: listProducts
        provenance: decided 29 September, rev 3 REV3-13
    - name: actionBar
      slot: submit
      components:
      - kind: primaryButton
        label: Add to basket
        notes: '`variantId` (the length), `bookedWindow` {startsAt, endsAt}, then the add-on lines.'
        operation: addCartLine
        provenance: decided 29 September, rev 3 REV3-13
  states:
    loading: The room types and their lengths for this venue.
    error: Could not load. Names which read failed; nothing is booked.
    emptyFirstRun: '**This venue sells no space by the hour yet.** Says so rather than an empty list.'
    emptyNoResults: No room of the type is free at that time for that length. Offers the next free start
      time.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** Rooms and times already loaded stay on screen with their age.
      Picking a start time and adding the booking need the connection — a room held offline is a room
      two people think they have.'
