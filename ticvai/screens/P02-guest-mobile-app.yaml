  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. Landing. **Declared
    only a health check.** Pranay asked for guest details and tickets; Chitrangi asked for search. All
    three existed and none were wired. **Rewired on the 20 August review.** **Venue selection added 28
    September** (decided 28 September, audit R267) — a venue picker on first open, remembered on the device,
    **Change venue**, and a visit-day suggestion from the guest''s ticket (`listMyEntitlements`). Nothing
    in `getTenantAppStatus.venues` supplies the options, the tenant''s active venues, public and cacheable.


    **Rev 3 (decided 29 September).** The in-venue notifications feed (GST-030) is back in the first release
    (GAP-C1, reversing audit R242). A transport venue''s home opens the trip search (GST-076, REV3-21).
    The venue picked here (audit R267) is the venue whose booking-flow settings apply; the booking screens''
    *Booking at* bar changes it (REV3-18). Every booking-flow setting named here is read from `getTenantConfig`
    `bookingFlow`, resolved for the venue the guest picked (audit R267): the tenant''s values with that
    venue''s `venueOverrides` entry laid over field by field (decided 29 September, rev 3 CFG-11).


    **Mobile v4 (decided 29 September, MOB-1, MOB-3, MOB-5).** Retitled **Home** and made the Home tab
    root: hero (carousel, video, poster or split), the venue overview (description, opening hours, info),
    type tiles and one or two highlights per type; tapping a highlight opens Item Detail (GST-004). GST-005
    What''s On and GST-029 Venue Info & Services stay and are linked from here. The optional intro video
    is a first-launch state of this screen, not a screen. The Plan tab (GST-051) is in Block A (29 September
    re-plan, superseding audit R187 and rev 3 GAP-C3), so its links no longer carry a later-release precondition.


    **The client-approved app wireframe is the layout** (decided by Chinmay, 2 October 2026; DEC-163);
    it changes only where the spec breaks. The card count per section is the venue''s choice (DEC-152)
    (CHG-SGU-005).'
  density: comfortable
  pattern: listDetail
  patternReason: '`listMyEntitlements` reads the population and `getTenantAppStatus` reads one of them
    — list, select, act'
  purpose: 'The Home tab: what this venue is, when it is open and what there is to do, with the highlights
    per type the venue chose, from which everything else is entered.'
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Your venue
        bindsTo: TenantAppStatus.venues
        operation: getTenantAppStatus
        notes: '**The guest picks a venue on first open** (decided 28 September, audit R267): shown before
          anything else when the device has no venue remembered, and remembered on the device after that.
          The chosen `venueId` is what every screen that declares `venueId` `from: session` reads. The
          options are `getTenantAppStatus.venues` (venue id, name, city, today''s opening hours), the
          tenant''s active venues, returned without a session.'
        provenance: contract white-label.yaml GET /tenant-config/status (TenantAppStatus.venues, audit
          R267)
      - kind: secondaryButton
        label: Change venue
        notes: Reopens the venue picker; the new choice replaces the remembered one on this device and
          every venue-scoped screen reloads for it (decided 28 September, audit R267).
        provenance: decided 28 September 2026, audit R267
      - kind: banner
        label: Visiting today?
        bindsTo: Entitlement
        columns:
        - Entitlement.venueId
        - Entitlement.validFrom
        - Entitlement.validTo
        operation: listMyEntitlements
        notes: '**On a visit day the app suggests the ticket''s venue** (decided 28 September, audit R267):
          for a signed-in guest, an entitlement from `listMyEntitlements` (`state=upcoming`) valid today
          at a venue other than the chosen one offers **Switch to that venue**; the guest decides, the
          app never switches by itself.'
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: banner
        label: Sold out or closed today
        bindsTo: TenantAppStatus.availabilityMessage
        operation: getTenantAppStatus
        notes: From `getTenantAppStatus.availability` (`open`, `soldOut`, `closed`) and `availabilityMessage`
          (decided 28 September, audit R073 (f)); nothing shows while it is `open`.
        provenance: contract white-label.yaml GET /tenant-config/status
      - kind: searchField
        label: Search the venue
        operation: searchCatalogue
        notes: Opens Explore search (GST-063) with what was typed.
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
      - kind: cardList
        label: Your upcoming tickets
        bindsTo: Entitlement
        columns:
        - Entitlement.validFrom
        - Entitlement.validTo
        - Entitlement.status
        - Entitlement.entriesUsed
        operation: listMyEntitlements
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        notes: 'Only when signed in: `listMyEntitlements` with `state=upcoming`, fixed by the screen.
          Was the generated table ''Every entitlement''; staff and plumbing columns removed (decided by
          Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)).'
      - kind: banner
        label: Hero
        bindsTo: PublishedTenantConfig.homepage
        operation: getPublishedTenantConfig
        notes: 'The venue hero in the style the venue set on the Home section (`heroStyle`: carousel,
          video, poster or split). Video heroes stream; a missing asset falls back to the poster image.'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
      - kind: detailPanel
        label: Venue overview
        bindsTo: TenantAppStatus.venues
        operation: getTenantAppStatus
        notes: '**Home is a venue overview** (MOB-3): the venue description, today''s opening hours (from
          `getTenantAppStatus.venues`), getting here and before-you-go info.'
        provenance: decided 29 September 2026, MOB-3
      - kind: cardList
        label: Type tiles
        operation: listProductCategories
        notes: Rides, dining, events and shops (the venue's own categories). A tile opens Explore (GST-002)
          on that type.
        provenance: decided 29 September 2026, MOB-3
      - kind: cardList
        label: Highlights per type
        operation: listProducts
        notes: The number of items per type the venue chose (`HomepageLayout.sections[].maxItems`, set
          on CMS-007; DEC-152); a highlight opens Item Detail.
