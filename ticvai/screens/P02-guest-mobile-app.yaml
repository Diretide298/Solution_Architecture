        rather than in front of the cart (matrix 2.6.1 §2.4)
      carries:
      - cartId
      returnsTo: GST-041
      provenance: ADR-0045, 18 September 2026, refining the 17 September rule — no order against an unproven
        contact; per-site guestCheckout off by default (matrix 2.6.28)
    - to: GST-001
      trigger: Home – Default
      provenance: 'derived — GST-001 declares entryState.params  and GST-041 holds none of them. The edge
        carries nothing: GST-041 is opened from GST-001, so this edge is the way back and GST-001 keeps
        its own state'
    - to: GST-059
      trigger: They follow it through the day
      provenance: flow F49 step 5→6
    - to: GST-009
      trigger: Checkout
      provenance: corrected 2 October 2026 (CHG-SGU-020, design-notes correction)
      carries:
      - orderId
      - paymentId
      - token
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Promo code added 28
    September** (decided 28 September, audit R073 (e)) — the web cart WEB-010 has the field, and the two
    shells are one product.


    **Rev 3 (decided 29 September).** **Sign-in (REV3-3):** with `signInAt` `afterAddOns` (default) the
    sign-in or guest-code choice is asked when the guest leaves the tickets and add-ons step (GST-008
    → GST-042); with `atPayment` it is asked here, on the way to payment. The basket is kept either way;
    guest checkout and matching are unchanged (DG-1). Visit date per line (23SEP-9). **On mobile the basket
    stays a bottom bar with the running total**; the floating icon and the cart side apply to the website
    (REV3-10). A spot held on the venue map counts down from its `ResourceHold.expiresAt` (REV3-15). `checkoutCart`
    `422 consentRequired` or `consentAnswerBlocks` sends the guest back to the consent questions (REV3-26).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getTenantConfig`
    `bookingFlow`.


    **29 September.** **W1:** after the guest code, or when signed in, the basket goes straight to payment
    (GST-009) with no details form. *Book this plan* (GST-053) and *Buy meal combo* (GST-004 → GST-056)
    land here.'
  density: comfortable
  pattern: statusTracker
  patternReason: '`getCart` reads one record and nothing reads a population — the screen is about that
    one thing'
  purpose: Take the money, and be unambiguous about whether it worked.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The cart
        bindsTo: Cart
        columns:
        - Cart.status
        - Cart.subtotal
        - Cart.discountTotal
        - Cart.total
        - Cart.expiresAt
        operation: getCart
        provenance: contract orders.yaml GET /carts/{cartId}
      - kind: cardList
        label: Visit date per line
        notes: 'Each line: the variant''s name (`listProductVariants`), its visit date (`Performance.startsAt`,
          the match date for a fixture), quantity and price.'
        operation: getPerformance
        provenance: decided 29 September, rev 3 23SEP-9
      - kind: progressIndicator
        label: Booking steps
        bindsTo: BookingFlow
        columns:
        - BookingFlow.steps
        operation: getPublishedBookingFlow
        notes: The steps of the published flow in their `sortOrder`, this one (basket) highlighted. A
          step the flow has turned off is not shown and is skipped by Continue and Back.
        provenance: decided 29 September 2026, W12; CMS-103 Booking Flows
      - kind: numberField
        label: Quantity
        operation: updateCartLine
        notes: A stepper on each line; each change saves at once (`updateCartLine`).
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
      - kind: cardList
        label: Lines
        operation: listProductVariants
        notes: One row per line with the variant's guest name and a stepper; inactive variants are never
          shown.
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
    - name: promoCode
      slot: fields
      components:
      - kind: textField
        label: Promo code
        bindsTo: ApplyCartPromoCodeRequest.code
        operation: applyCartPromoCode
        notes: '**Applied to the cart at once** with `applyCartPromoCode` (POST /carts/{cartId}/promo-codes,
          body `{code}`; decided 28 September, audit R073 (e)). The two refusals read differently: 422
          `promoCodeInvalid` says the code does not exist, was voided or is used up; 422 `promoCodeNotApplicable`
          says the code is real but nothing in this cart qualifies. A 410 `cartExpired` sends the guest
          back to rebuild the cart. Accepted codes are listed from `Cart.couponCodes` and re-priced on
          every read.'
        provenance: contract orders.yaml POST /carts/{cartId}/promo-codes
      - kind: secondaryButton
        label: Apply code
        operation: applyCartPromoCode
        provenance: contract orders.yaml POST /carts/{cartId}/promo-codes
    - name: actionBar
      slot: rowActions
      components:
      - kind: destructiveButton
        label: Empty cart
        operation: abandonCart
        provenance: contract orders.yaml DELETE /carts/{cartId}
      - kind: secondaryButton
        label: Claim cart
        operation: claimCart
        provenance: contract orders.yaml POST /carts/{cartId}/claim
      - kind: secondaryButton
        label: More time
        operation: extendCart
        provenance: contract orders.yaml POST /carts/{cartId}/extend
        notes: Beside the countdown (`Cart.expiresAt`, the one clock the guest sees); `extendCart` up
          to `maxExtensions` times.
      - kind: destructiveButton
        label: Remove
        operation: removeCartLine
        provenance: contract orders.yaml DELETE /carts/{cartId}/lines/{lineId}
      - kind: primaryButton
        label: Checkout
        operation: checkoutCart
        notes: Checks the cart out (`checkoutCart`) and moves on to Review & Payment.
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  states:
    loading: Terminal or gateway state, shown plainly
    error: '**Declined reads differently from unresolved.** An unresolved payment inquires rather than
      retries, and nothing is issued until it resolves'
    emptyFirstRun: —
    emptyNoResults: 'Never shown: the basket has no filter; an empty basket is the first-run state.'
    emptyNoAccess: '**This is the checkout page, and it is where identity is settled** (ADR-0045, 18 September
      2026). An unverified or anonymous guest is not turned away — they are offered sign-in or, where
      the site''s `guestCheckout` is on, the one-time code. The cart stays intact either way; `checkoutCart`
      is what refuses.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: applyCartPromoCode
    contract: orders
    purpose: Apply a promo code to the cart; refused 422 promoCodeInvalid or promoCodeNotApplicable, shown
      as different messages (decided 28 September, audit R073 (e))
    trigger: onAction
    invalidates:
    - getCart
  - operationId: getCart
    contract: orders
    purpose: 'The cart, priced and checked, right now With the guest session the device already holds:
      signed in, or the anonymous cart session a visitor gets with the first line (ADR-0045) (decided
      2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onLoad
  - operationId: checkoutCart
    contract: orders
    purpose: Turn the cart into an order
    trigger: onAction
  - operationId: abandonCart
    contract: orders
    purpose: Give the inventory back
    trigger: onAction
  - operationId: claimCart
    contract: orders
    purpose: Pick up a basket started on another device
    trigger: onAction
  - operationId: extendCart
    contract: orders
    purpose: Keep the hold alive while the guest decides
    trigger: onAction
  - operationId: listProductVariants
    contract: catalogue
    purpose: Which variant each line is
    trigger: onAction
  - operationId: removeCartLine
    contract: orders
    purpose: Take a line out of the basket
    trigger: onAction
  - operationId: updateCartLine
    contract: orders
    purpose: Change a quantity before paying
    trigger: onAction
  - operationId: getPerformance
    contract: catalogue
    purpose: The visit date of each line (`Performance.startsAt`)
    trigger: onLoad
  - operationId: getResourceHold
    contract: resources
    purpose: 'The countdown of a spot held on the venue map With the guest session the device already
      holds: signed in, or the anonymous cart session a visitor gets with the first line (ADR-0045) (decided
      2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onInterval
  - operationId: getPublishedBookingFlow
    contract: white-label
    purpose: 'The published booking flow for this product: which steps it has and in what order (W12)'
    trigger: onLoad
    provenance: decided 29 September 2026, W12
  entryState:
    params:
    - name: cartId
      from: session
    - name: lineId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): the screen loads without it; `removeCartLine`, `updateCartLine`
        take the id from the record the user acts on, and an edge or link that holds one only pre-selects
        it.'
    - name: productId
      from: navigation
    - name: performanceId
      from: navigation
      optional: true
    - name: holdId
      from: navigation
    - name: venueId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case. **A cold arrival without
      a verified sign-in is offered the fork here** — sign in, or prove the contact where the site's `guestCheckout`
      is on — and keeps the cart either way (ADR-0045).
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-041
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html
      rev: mobile v4 (30 September build)
      verified: '2026-10-01'
      match: partial
      view: Cart (header basket, after a booking is added to the cart)
      differences: Basket as a bottom bar on mobile.
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: confirmAbandonCart
    component: confirmDialog
