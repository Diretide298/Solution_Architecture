        label: Planner unavailable
        operation: getVisitPlan
        notes: '**The rules plan never fails over to an error**: with AI off, not licensed or failing,
          the guest keeps the rules plan and the Plan tab works in full. Shown when AI is off for the
          venue, the tenant has no AI licence, or the call fails or times out.'
        provenance: decided 29 September 2026, MOB-6
      - kind: detailPanel
        label: The wait time
        operation: getWaitTimes
        notes: Live waits the agent plans around.
        provenance: contract queue.yaml GET /queues/wait-times
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Apply this change
        operation: updateVisitPlan
        notes: Saves the agent's proposal as a new plan version.
        provenance: decided 29 September 2026, MOB-6
      - kind: secondaryButton
        label: Back to your plan
        notes: GST-053.
        provenance: decided 29 September 2026, MOB-6
  states:
    loading: The plan builds in place; the inputs stay on screen.
    error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
    emptyFirstRun: 'No conversation yet: the plan is shown with example requests.'
    emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s
      height): says so and offers to change the answers.'
    emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose
      it is; a signed-out guest can still build a plan and is asked to sign in only to save or book it.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
    aiUnavailable: '**Falls back to the rules plan, never to an error** (MOB-6): the plan from `getVisitPlan`
      stays on screen with a short note, and the guest carries on editing it on GST-053.'
  apis:
  - operationId: getWaitTimes
    contract: queue
    purpose: Wait times across a venue
