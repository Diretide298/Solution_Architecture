    - to: GST-052
      trigger: Take a ready-made plan
      provenance: decided 29 September 2026, MOB-6
    - to: GST-001
      trigger: Home tab
      provenance: decided 29 September 2026, MOB-1
  notes: 'Minuted 10 Aug §4.9. Benchmarked against Skidata. Tied to a ticket purchase and saved as a personal
    visit profile. **Deferred on 28 September (audit R187), and brought back the next day**: the itinerary
    planner was put in `wave: 4` with a `deferred` block and kept rather than deleted; the 29 September
    re-plan below superseded that, and the screen is in Block A, wave 1 (3 October 2026, CHG-SPF-006).


    **Rev 3 (decided 29 September).** Had stayed deferred (GAP-C3); superseded the same day by the re-plan
    below.


    **Brought into Block A on 29 September** (Chinmay, the 29 September re-plan, MOB-6): a rules-based
    planner with the AI planner agent on top. This supersedes audit R187, the deferral half of R209 and
    rev 3 GAP-C3; the `deferred` block is removed and the screen is wave 1.


    **Mobile v4 role (MOB-6): the Plan tab root, "Plan".** Inputs: party size, heights (or ages), dates,
    pace (packed, balanced or relaxed), interests and cuisine. The rules planner (`generateVisitPlan`)
    runs with no AI. The tab is hidden when the venue turns module `visitPlanner` off.


    **Multi-venue intelligence (client meeting 30 September, MoM 4.7, Allam; agreed by Chinmay).** In
    a multi-venue tenant each chosen day is at one park, and the planner uses **only the rides, dining
    and retail that exist at that park**: a cuisine or shop preference is checked against that park''s
    own points, never assumed of every park (only one park has the Indian restaurant, so *Indian* places
    lunch there on that park''s day and nowhere else). Retail and kiosk shops are now planner options
    alongside F&B (the gap a Softlabs teammate flagged). Contract: venue-map `generateVisitPlan` `dayVenues`,
    `retailTags`, `VisitPlan.unmatchedPreferences`.


    **In the first release (Block A, wave 1), stated plainly (CHG-SGU-021).** The R187 note that deferred
    the planner was superseded by rev 3 (29 September); the Plan tab is in the Block A slice.'
  density: comfortable
  pattern: multiStepForm
  patternReason: The v4 prototype asks six questions one at a time (who, heights, days, pace, likes, food)
    and ends on *Make my plan*
  purpose: 'The Plan tab: tell the venue who is coming, when, at what pace and what you like, and get
    a day-by-day plan.'
  layout:
    template: wizard
    regions:
    - name: progress
      slot: progress
      components:
      - kind: progressIndicator
        label: Plan your visit · n of 6
        notes: Six questions; Heights is skipped when no children are coming.
        provenance: decided 29 September 2026, MOB-6
    - name: fields
      slot: fields
      components:
      - kind: numberField
        label: Adults
        notes: Age 12 and over, at least 1, at most 8.
        provenance: decided 29 September 2026, MOB-6
      - kind: numberField
        label: Children
        notes: Age 3 to 11, 0-8.
        provenance: decided 29 September 2026, MOB-6
      - kind: selectField
        label: How tall are the children?
        operation: listProducts
        notes: 'Per child: under 1.0 m, 1.0-1.2 m, 1.2-1.4 m, 1.4 m and over (or an age where the venue
          sets age rules). Rides over a child''s limit are left out, from `ProductEligibilityRule`.'
        provenance: decided 29 September 2026, MOB-6
      - kind: multiSelect
        label: Which days are you visiting?
        notes: Up to three days; each day gets its own park at a multi-park venue.
        provenance: decided 29 September 2026, MOB-6
      - kind: selectField
        label: Which park each day?
        bindsTo: TenantAppStatus.venues
        operation: getTenantAppStatus
        notes: '**Only in a multi-venue tenant** (more than one entry in `getTenantAppStatus.venues`);
          hidden otherwise. One choice per chosen day, defaulting to the venue picked on Home; sent as
          `VisitPlanRequest.dayVenues`. **Each day is then planned from that park''s own rides, dining
          and shops only** (client meeting 30 September, MoM 4.7).'
        provenance: decided 30 September 2026, client meeting MoM 4.7 (Allam)
      - kind: selectField
        label: How busy should each day be?
        notes: Packed, Balanced or Relaxed.
        provenance: decided 29 September 2026, MOB-6
      - kind: multiSelect
        label: What are you most interested in?
        operation: listProducts
        notes: 'Interest tags from the venue''s points (`VenuePoint.interestTags`): thrill rides, family
          rides, shows, water, shopping.'
        provenance: decided 29 September 2026, MOB-6
      - kind: multiSelect
        label: Any shops you'd like to visit?
        notes: '**Shown when Shopping is chosen above** (client meeting 30 September, MoM 4.7: retail
          and kiosk shops join F&B in the planner). Options are the `retailTags` of the shops and retail
          kiosks of the chosen parks (souvenirs, toys, apparel ...); sent as `VisitPlanRequest.retailTags`.
          A shop stop is planned only at a shop or kiosk of that day''s park.'
        provenance: decided 30 September 2026, client meeting MoM 4.7 (Allam)
      - kind: selectField
        label: What would you like for lunch?
        notes: '**Cuisines from the dining points of the chosen parks only** (`VenuePoint.cuisineTags`
          of restaurants, cafes and food kiosks; client meeting 30 September, MoM 4.7). Lunch is planned
          at a restaurant **of that day''s park** that serves it, never another park''s. In a multi-venue
          plan each cuisine names the park(s) that serve it (*Indian · Summit Peaks only*), so the guest
          sees before planning that it will not be on every day.'
        provenance: decided 29 September 2026, MOB-6; decided 30 September 2026, client meeting MoM 4.7
          (Allam)
    - name: submit
      slot: submit
      components:
      - kind: primaryButton
        label: Make my plan
        operation: generateVisitPlan
        notes: 'Calls `generateVisitPlan`: the rules planner, no AI. Opens Your Plan (GST-053).'
        provenance: decided 29 September 2026, MOB-6
      - kind: secondaryButton
        label: Take a ready-made plan
        notes: Opens Suggested Itineraries (GST-052).
        provenance: decided 29 September 2026, MOB-6
  states:
    loading: The plan builds in place; the inputs stay on screen.
    error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
    emptyFirstRun: 'No plan yet: the first question is shown. Nothing is saved until *Make my plan*.'
    emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s
      height): says so and offers to change the answers.'
    preferenceNotAtVenue: '**A preference no chosen park can meet** (client meeting 30 September, MoM
      4.7): a cuisine or shop tag with no matching point at any park of the plan is marked on its chip
      (*Not at the parks you chose*) before *Make my plan*; the plan is still made without it, never with
      a restaurant or shop from a park the party is not visiting. Where another park of the tenant has
      it, the chip says which, and choosing that park for a day brings it in.'
    emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose
      it is; a signed-out guest can still build a plan and is asked to sign in only to save or book it.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
