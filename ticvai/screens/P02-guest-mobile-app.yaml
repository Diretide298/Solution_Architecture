- id: GST-007
  name: Select Date & Time
  module: Booking & Selection
  requiresModule: ticketing
  wave: 1
  capability: C02
  implementation:
    app: guest-app
    route: /general/select-date-and-time
    component: apps/guest-app/src/routes/general/SelectDateAndTimeDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-001
    - GST-004
    inferred: true
    exitTo:
    - GST-001
    - GST-002
    - GST-003
    - GST-008
    - GST-046
    - GST-049
    transitions:
    - to: GST-001
      trigger: Home – Default
      provenance: 'derived — GST-001 declares entryState.params  and GST-007 holds none of them. The edge
        carries nothing: GST-007 is opened from GST-001, so this edge is the way back and GST-001 keeps
        its own state'
    - to: GST-003
      trigger: Event & Attraction Listing
      carries:
      - eventId
      provenance: derived — GST-003 declares entryState.params eventId and GST-007 holds eventId, so an
        edge into it carries them
    - to: GST-008
      trigger: Picks a time; the tickets for it appear
      carries:
      - performanceId
      provenance: 'decided 29 September, rev 3 REV3-2: date → time → ticket'
    - to: GST-049
      trigger: Picks a time on a seated event (inline step)
      carries:
      - performanceId
      - eventId
      provenance: 'authored 3 October 2026 (CHG-SPF-004): GST-007 holds eventId and GST-049 cannot load
        without it, so the edge carries it; was: decided 29 September, rev 3 REV3-4 (`seatEventDateMode`
        `inlineStep`) and REV3-7'
    - to: GST-008
      trigger: Picks a date and time after choosing the workshop (product-first flow)
      carries:
      - performanceId
      provenance: decided 29 September 2026, W8
    - to: GST-046
      trigger: Adds tickets for a performance whose on-sale waiting room is on
      operation: addCartLine
      precondition: '`addCartLine` refused `403 admission-required`: this performance''s room is on and
        the app holds no admission token for it'
      carries:
      - performanceId
      returnsTo: GST-007
      provenance: ADR-0066 (accepted 1 October 2026) and its 1 October amendment
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement.


    **Rev 3 (decided 29 September).** **Date → time → ticket (REV3-2):** the time sits right after the
    date and stays hidden until a date is picked; tickets (GST-008) come after the time; Continue stays
    off until both are chosen (`performanceReveal`, default `dateTimeTicket`). **Times (REV3-1)** paged
    with part-of-day chips. **Seated events (REV3-4, REV3-7):** this step before the seat map, or a pop-up
    on it (`seatEventDateMode`); skipped when the event has one on-sale performance; may render with GST-049
    as one step. **Language (REV3-17), experience and level (REV3-19), Booking at (REV3-18), Quick tour
    (REV3-20).** **Consent questions (REV3-26)** pop up once after the session or date; the *Swim consent
    pop-up (on/off)* toggle is dropped. Per-guest eligibility is `checkBookingEligibility`, unchanged
    (DG-3). Guest copy may say *Session* (CFG-10); code keeps `Performance`. Every booking-flow setting
    named here is read from `getTenantConfig` `bookingFlow`, resolved for the venue the guest picked (audit
    R267): the tenant''s values with that venue''s `venueOverrides` entry laid over field by field (decided
    29 September, rev 3 CFG-11).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getTenantConfig`
    `bookingFlow`.


    **29 September (MOB-29SEP).** **M17-08:** seven-day date strip plus a calendar icon. **W8:** a product-first
    flow (workshop, experience) comes here after the product is chosen on GST-008; the date-first default
    no longer overrides it, because the order is the flow''s. **W5:** surf and session levels appear only
    after a time slot is chosen. **W11:** guided tours stay date → language → time slot, confirmed unchanged.

    **30 September (client feedback, CLIENT-RESPONSE-30SEP 3 and 4).** **Choosing a session adds nothing
    to the cart.** Once a session is chosen its tickets appear (for a surf session: Surfer at the session
    price, Junior surfer 10–15, Spectator) and a line reaches the cart (`addCartLine`) only when a quantity
