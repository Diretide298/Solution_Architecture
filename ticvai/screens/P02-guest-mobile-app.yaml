        - WaitTime.heightRequirementCm
        - WaitTime.zone
        operation: getWaitTimes
        provenance: contract queue.yaml GET /queues/wait-times
  states:
    loading: The interactive map list.
    error: Could not load. Names which read failed and leaves the interactive map untouched.
    emptyFirstRun: No interactive map yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: No point of that category on this map; the other categories stay.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** A map and route graph already loaded stay usable, so directions
      do not need a signal. Wait times show their last reading marked out of date, never as live — a queue
      length from an hour ago sends a guest to the wrong ride. With no map loaded yet, the screen asks
      the guest to reconnect.'
    map3dUnavailable: '**No 3D model for this map: the 2D map, same route** (ADR-0069; client meeting
      30 September, MoM 4.8). The venue has not published a GLB model for this map (the default for every
      venue until it supplies one), the phone fails the 3D capability check, or rendering drops below
      20 fps. The 2D map shows the same route from `getVenueMapGraph` and the same live position dot;
      the 2D/3D toggle is hidden and nothing else is said: no message, no error.'
    weakGps: '**Position approximate** (ADR-0069, section 4): reported GPS accuracy worse than 30 metres,
      or the route runs along an indoor path. The dot dims and an approximate-position ring is drawn round
      the last confident position, labelled *Position approximate*; the turn list and the remaining distance
      stay, and *I am at…* (tap a nearby location, or scan its QR sign) re-anchors. Routing does not stop,
      in 3D or in 2D.'
  apis:
