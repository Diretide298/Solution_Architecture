- id: GST-051
  name: Plan
  module: Engagement & Support
  requiresModule: ticketing
  wave: 1
  capability: AI-35
  implementation:
    app: guest-app
    route: /general/plan-your-adventure-start
    component: apps/guest-app/src/routes/general/PlanYourAdventureStartDetail.tsx
