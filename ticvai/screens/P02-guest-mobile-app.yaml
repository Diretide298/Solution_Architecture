  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  machine:
    key: plannerMode
    initial: rulesPlan
    provenance: 'decided 29 September 2026, MOB-6; BRIEF decision 1: the rules planner with the AI planner
      agent on top'
    states:
      rulesPlan:
        operation: getVisitPlan
        note: The rules plan is shown; the chat is open.
      refining:
        operation: sendAiMessage
        note: The agent is working on a request.
      proposed:
        operation: requestSuggestion
        note: A change is proposed, not yet saved.
      aiUnavailable:
        note: '**The rules plan never fails over to an error**: with AI off, not licensed or failing,
          the guest keeps the rules plan and the Plan tab works in full.'
        retryTo: rulesPlan
    transitions:
    - from: rulesPlan
      'on': Send
      to: refining
    - from: refining
      'on': proposal returned
      to: proposed
    - from: proposed
      'on': Apply this change
      to: rulesPlan
      note: updateVisitPlan saves a new version.
    - from: proposed
      'on': Discard
      to: rulesPlan
    - from: refining
      'on': AI off, refused or timed out
