- id: GST-009
  name: Review & Payment
  module: Cart & Checkout
  requiresModule: ticketing
  wave: 1
  capability: C47
  implementation:
    app: guest-app
    route: /general/review-and-payment
    component: apps/guest-app/src/routes/general/ReviewAndPaymentForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - GST-001
    - GST-027
    - GST-041
    inferred: true
    exitTo:
    - GST-001
    - GST-002
    - GST-010
    - GST-028
    fromFlows: true
    transitions:
    - to: GST-001
      trigger: Home – Default
      provenance: 'derived — GST-001 declares entryState.params  and GST-009 holds none of them. The edge
        carries nothing: GST-009 is opened from GST-001, so this edge is the way back and GST-001 keeps
        its own state'
    - to: GST-010
      trigger: 'Paid: the booking confirmation'
      provenance: corrected 2 October 2026 (CHG-SGU-020, design-notes correction)
      carries:
      - orderId
    - to: GST-028
      trigger: It is confirmed with a facility
      provenance: flow F50 step 2→3
      carries:
      - orderId
    - to: BO-020
      trigger: Kitchen accepts and prepares
      provenance: flow F11 step 4→5
      operation: createPayment
      crossesDevice: true
      back: false
      carries:
      - orderId
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **`createPayment` added
    18 August** — the guest app''s payment screen did not declare the operation that takes a payment,
    and F11 routed food payment through the AI concierge instead. **Card or wallet** (TenderKind `card`,
    `wallet`, as `createPayment` and flow F11 step 4 say; decided 28 September, audit R080 (a)), **both
    in base currency, so tender currency equals base currency**; a foreign card is converted by the guest''s
    own issuer at their rate, which is not ours and is not recorded as ours. **Navigation repointed to
    P15 on 20 August** — the F&B screens it linked to moved out of the back office when the client board
    was adopted. **Cross-platform navigation removed 24 August**: BO-020. **A till does not navigate to
    a back office and a guest app does not navigate to either** — those are device handovers, and a flow
    declares them with `crossesDevice` rather than a screen pretending there is a link. **No ''is this
    you?'' at checkout** (decided 28 September, audit R120 (b)): a verified contact that matches an existing
    profile attaches the order automatically inside `checkoutCart` (ADR-0045), so `checkGuestCheckoutMatch`
    and `decideGuestCheckoutMatch` were removed from this screen; only unverified matches go to staff
    review.


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getTenantConfig`
    `bookingFlow`.


    **29 September.** **W1:** a guest who proved the contact with the code arrives here with it; only
    the T&Cs tick (and the unticked marketing opt-in, M18-15) remains.


    **The guest selects the currency and pays in it** (decided 2 October 2026, Chinmay; CHG-FIN-001; reverses
    the display-only rule, CF-37 and "payment will be processed in AED", in favour of option (b) of MoM
    10 Aug 2026 4.7, DI-211). The venue lists the currencies a guest may pay in (`VenueSettings.chargeCurrencies`,
    a subset of the currencies it shows); `listFxRates` with `chargeable=true` returns them, each marked
    `chargeable`. The selected currency is sent at checkout (`checkoutCart.chargeCurrency`), the rate
    is locked on the order (`Order.chargeFxRate`, `chargeTotal`, until `chargeRateLockedUntil`), and the
    payment request goes to the payment partner in that currency. The ledger stays in the venue''s base
    currency, with the rate recorded on the order, the payment and any refund. **Refunds go back in the
    currency paid**, at the sale rate, so a full refund returns exactly what was charged. A currency the
    venue shows but does not charge is still an approximate price, marked "approx.", with "You pay in
    <base currency>" beside it.


    **F&B is paid on its own (decided by Chinmay, 2 October 2026; DEC-052, DEC-071).** When this step
    pays a guest F&B order (F11 step 4, after `createGuestFnbOrder`), it pays that order alone, with its
    own receipt; F&B lines never join the ticket cart''s one receipt (DI-293 does not apply to F&B) (CHG-SGU-001).'
  density: comfortable
  pattern: statusTracker
  patternReason: '`getCart` reads one record and nothing reads a population — the screen is about that
    one thing'
  purpose: Check what you are buying and pay for it.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The cart
        bindsTo: Cart
        columns:
        - Cart.status
        - Cart.lines
        - Cart.subtotal
        - Cart.discountTotal
        - Cart.taxTotal
        operation: getCart
        provenance: contract orders.yaml GET /carts/{cartId}
      - kind: banner
        label: You pay in
        bindsTo: Order.chargeTotal
        operation: checkoutCart
        notes: 'After checkout: the amount in the selected currency, the base amount and the rate, and
          how long the rate holds (`Order.chargeCurrency`, `chargeTotal`, `chargeFxRate`, `chargeRateLockedUntil`;
          CHG-FIN-001).'
        provenance: contract orders.yaml Order.chargeTotal (CHG-FIN-001, 2 October 2026)
      - kind: detailPanel
        label: The payment link
        bindsTo: PaymentLinkView
        columns:
        - PaymentLinkView.status
        - PaymentLinkView.expiresAt
        - PaymentLinkView.releaseHoldOnExpiry
        operation: getPaymentLink
        provenance: contract orders.yaml GET /payment-links/{token}
      - kind: progressIndicator
        label: Booking steps
        bindsTo: BookingFlow
        columns:
        - BookingFlow.steps
        operation: getPublishedBookingFlow
        notes: The steps of the published flow in their `sortOrder`, this one (review and payment) highlighted.
          A step the flow has turned off is not shown and is skipped by Continue and Back. Drawn in the
          venue's `BookingFlowSettings.stepIndicator` style; `embedMode` and `singleEventPage` come from
          the same published settings (CMS-016) (CHG-SGU-022).
        provenance: decided 29 September 2026, W12; CMS-103 Booking Flows
      - kind: consentBlock
        label: Terms and conditions
        operation: checkoutCart
        notes: '**After the code the guest goes straight to the T&Cs tick and completes** (W1): no second
          name, email or phone form. The profile is created by `checkoutCart` and completed later.'
        provenance: decided 29 September 2026, W1
      - kind: detailPanel
        label: Read the terms
        bindsTo: PublishedPolicy
        columns:
        - PublishedPolicy.title
        - PublishedPolicy.version
        - PublishedPolicy.body
        operation: listPublishedPolicies
        notes: '`kind=termsAndConditions`, opened from the T&Cs tick; the version shown is the version
          the consent records.'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-2)
      - kind: toggle
        label: Send me offers and news
        operation: checkoutCart
        notes: '**Marketing opt-in beside the T&Cs, never pre-ticked** (M18-15), sent as `marketingConsents[]`
          on `checkoutCart`, bound to the order and the verified contact and attached to the profile on
          match.'
        provenance: decided 29 September 2026, M18-15
      - kind: banner
        label: Order
        operation: createOrder
        notes: The order number once `createOrder` has answered, shown above the payment.
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
      - kind: banner
        label: Checking your payment
        operation: inquirePaymentStatus
        notes: 'Only in the unknown-outcome state: the app asks the provider by itself (`inquirePaymentStatus`)
          and never offers to pay again.'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
      - kind: banner
        label: Paying a link someone sent you
        operation: payByLink
        notes: 'Only when the app was opened from a payment link (`getPaymentLink`): Pay settles the link
          (`payByLink`) instead of a cart.'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
    - name: actionBar
      components:
      - kind: primaryButton
        label: Pay
        operation: createPayment
        notes: 'One Pay: checks the cart out (`checkoutCart`, with the T&Cs tick and the opt-in), creates
          the order (`createOrder`) and takes the payment (`createPayment`). The provider token comes
          from the gateway, never a form.'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  states:
    loading: The review payment, read by `getCart`.
    error: Could not load. Names which read failed and leaves the review payment untouched.
    emptyFirstRun: No review payment yet. Offers Create payment (`createPayment`).
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**Not available, and the offline banner says why.** A payment needs the gateway, and pretending
      otherwise takes money nobody can confirm. What was typed stays on screen so nothing is entered twice.'
  apis:
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  - operationId: inquirePaymentStatus
    contract: orders
    purpose: Ask the provider what actually happened
    trigger: onAction
  - operationId: checkoutCart
    contract: orders
    purpose: Turn the cart into an order
    trigger: onAction
  - operationId: getCart
    contract: orders
    purpose: 'The cart, priced and checked, right now With the guest session the device already holds:
      signed in, or the anonymous cart session a visitor gets with the first line (ADR-0045) (decided
      2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onLoad
  - operationId: createOrder
    contract: orders
    purpose: Turn the checked-out cart into an order
    trigger: onAction
  - operationId: getPaymentLink
    contract: orders
    purpose: Open a payment link sent to this guest
    trigger: onLoad
  - operationId: payByLink
    contract: orders
    purpose: Pay a booking somebody else made
    trigger: onAction
  - operationId: getPublishedBookingFlow
    contract: white-label
    purpose: 'The published booking flow for this product: which steps it has and in what order (W12)'
    trigger: onLoad
    provenance: decided 29 September 2026, W12
  - operationId: listPublishedPolicies
    contract: white-label
    purpose: The current terms and conditions the guest ticks, with their version, readable before sign-in
      (GFIX-2)
    trigger: onLoad
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-2)
  entryState:
    params:
    - name: cartId
      from: session
    - name: orderId
      from: deepLink
    - name: paymentId
      from: deepLink
    - name: token
      from: deepLink
    - name: venueId
      from: session
    coldEntry: '**A guest opening an order link weeks later.** Shows the order if it still resolves; if
      it was refunded or the performance passed, says which and offers the order list rather than an error.'
  wireframe:
    status: notStarted
    provenance: designed
    board: wireframes/P02 Guest App.dc.html#gst-009
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html
      rev: Mobile App v4, 29 September 2026
      match: none
      note: 'Mobile App v4 has no view for this screen. Drawn by Claude Code on 30 September 2026 in the
        v4 look (the frame on this screen''s board, wireframes/frames/gst-009.html, and #GST-009 in handoff/design-batches/apps/1-guest-app/return/TICVAI
        Guest App.dc.html). NOT client-verified: awaiting the client''s design reviewer. Build the layout
        from that frame and this definition. Mobile v2 (28 September, superseded by v4) showed it at:
        Account → All screens → Wave 1 → Review & payment; also the "Confirm and pay" sheet in the booking
        flow (exact). What v2 did differently: Prototype offers Tabby and wallet credit as payment methods;
        the YAML does not name them.'
    source: Claude Code, 30 September 2026, drawn in the Mobile App v4 look
    note: '**Drawn by Claude Code on 30 September 2026 in the Mobile App v4 look; not client-verified,
      awaiting the client''s design reviewer.** `provenance: designed` because the accepted vocabulary
      has no value for an agent-drawn frame; it is the value the eight Claude Design frames of 29 September
      carry. Gaps the operations leave are in handoff/design-batches/apps/1-guest-app/return/FINDINGS.md.'
  apisNote: 'Rebuilt 9 September 2026 from the 5 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  x-ticvai-make-or-break: 'M18-15: may a guest-checkout customer be sent marketing on an opt-in taken
    at checkout (law and the client''s marketing policy)? Until the client confirms, the opt-in is shown
    unticked and nothing is sent without it.'
  gaps:
  - operation: transferOrderTickets
    removed: true
    why: Transfer does not belong on a payment screen; it is GST-014's, after purchase.
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  - operation: addCartLine
    removed: true
    why: The hold was taken when the lines were added on the booking steps; nothing is added on the payment
      step.
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
