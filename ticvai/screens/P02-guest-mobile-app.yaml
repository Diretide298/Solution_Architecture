  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Wired to the venue
    map 18 August (CF-123).** The whole map arrives in one call and the client filters locally — which
    is also what makes it work with no signal in the middle of a park. **Routing happens on the device.**
    The platform guarantees the graph — connected, versioned, with step-free marked — and the client walks
    it, because a phone with the graph cached routes with no signal and a server round-trip per step does
    not. **The version is how a stale route is caught**: a guest holding a route across a path that closed
    this morning gets told, rather than walking into a barrier. **Drawn 26 August** — `Seat Board 4.dc.html`
    frame `seat-4b`. **The frame names this screen on its own face**, which is the first pack to do that:
    the earlier F&B, POS and Retail boards had to be hand-assigned by purpose after three derivation attempts
    produced nonsense. **A board that says what it draws removes the guess entirely.**


    **Mobile v4 (decided 29 September, MOB-1).** The **Map** view of GST-038 At the Venue: **one implementation
    with GST-038, the ids kept** (as GAP-D3).


    **3D navigation (client meeting 30 September, MoM 4.8): ADR-0069.** Where the venue map has a GLB
    model, this view renders it natively (react-three-fiber) and the walking-navigation mode follows the
    guest in 3D; the route still comes from `getVenueMapGraph`, snapped from live GPS, with no external
    mapping service. No model, a weak phone or failed rendering: the 2D map, same route.'
  density: comfortable
  boardFrames:
  - Seat Board 4.dc.html#seat-4b
  pattern: listDetail
  patternReason: '`listProducts` reads the population and `getWaitTimes` reads one of them — list, select,
    act'
  purpose: See where things are in relation to each other.
