          fix before Block A starts, 2 October 2026 (GFIX-3)).
      - kind: cardList
        label: Tax invoices
        operation: listTaxInvoices
        notes: The VAT receipt (simplified tax invoice) and any full tax invoice for the order, with its
          number.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction finance-insights GST-019)
      - kind: cardList
