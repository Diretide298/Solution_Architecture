platform:
  code: P02
  audience: guest
  formFactor: mobileApp
  shortName: Guest App
  name: Guest App — Mobile
  surface: guestFacing
  runtime: reactNative
  offlineCapable: true
  offlineBanner:
    kind: banner
    state: warning
    message: You're offline. Connect to the internet to book, pay, order or join a queue.
    shows: The moment the connection drops, on every screen, above the screen's own content.
    clears: By itself as soon as the connection is back, with a short "Back online" confirmation.
    never: Covers what is already on screen, or appears for a server error — that is the screen's own
      error state, and a guest told they are offline when the venue is down reconnects for nothing.
    provenance: Decided 12 September 2026 — guest web and guest app behave identically offline and say
      so with the same banner.
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 77
  app: guest-app
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: iOS / Android native
    distribution: App Store + Play, tenant developer account
    bundleUpdate: over-the-air for JS; store release for native
    hosting: n/a — installed
    storeReview: true
    deviceOwnership: guest device
    networkAssumption: mobile data, intermittent
    releaseCadence: fortnightly, gated by review
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: White Label Builder — the guest app is what the builder configures.
  operator: guest
  wireframeBoard: wireframes/P02 Guest App.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: guest
    name: TICVAI Guest
    shell: mobile
    siblings:
    - P01
    - P05
    note: '**One guest product in three shells.** Web, mobile and kiosk share 73–91% of their operations;
      the kiosk is the same product in a fixed frame with no keyboard, and is deliberately narrower rather
      than different.'
    decided: 10 September 2026
  navigationSets:
    appTabs:
      members:
      - GST-001
      - GST-002
      - GST-051
      - GST-012
      - GST-038
      destinations:
      - GST-001
      - GST-002
      - GST-003
      - GST-051
      - GST-012
      - GST-038
      provenance: 'decided 29 September 2026, MOB-1, MOB-2: default tabs Home, Explore, Plan and Tickets
        with the persistent Buy tickets button (GST-003); Map (GST-038 At the Venue) is an optional tab
        per venue. The tab set is venue configuration (NavigationConfig bottomNavigation, LinkTarget kind
        appSection).'
  appShell:
    tabs: 'Home (GST-001), Explore (GST-002), Plan (GST-051), Tickets (GST-012) by default, plus the Buy
      tickets button. The set, order, labels and icons are venue configuration (`NavigationConfig.bottomNavigation`
      items of `LinkTarget` kind `appSection`: home, explore, plan, tickets, map, account, buyTickets),
      edited on CMS-009. Map is optional (GST-038). The Plan tab is hidden when the venue turns module
      `visitPlanner` off. Account is the header icon (GST-039), not a tab.'
    buyButton: A persistent **Buy tickets** button on every screen, opening GST-003 Buy Tickets. Style
      from `NavigationConfig.buyButton.style` (raised centre button by default, floating, flat or hidden)
      and its label from `buyButton.label`. Hidden on the booking and checkout steps (GST-007, GST-008,
      GST-049, GST-050, GST-056, GST-058, GST-074 to GST-079, GST-041, GST-042, GST-009, GST-010), where
      it would abandon the booking. An app-shell component, not a screen.
    introVideo: 'A first-launch state of GST-001 (MOB-5): `BrandIdentity.introVideoAssetRef` played full
      screen per `BrandIdentity.introVideoMode` (off by default, firstLaunch or everyLaunch), streamed,
      with **Skip introduction** always shown.'
    provenance: decided 29 September 2026, MOB-1, MOB-2, MOB-5; mobile v4 prototype
