        carries nothing: GST-055 is opened from GST-001, so this edge is the way back and GST-001 keeps
        its own state'
  notes: States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement.
  density: comfortable
  pattern: credentialView
