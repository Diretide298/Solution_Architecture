$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ticvai/screens/_schema.yaml"
title: TICVAI screen definition

description: >
  ## What this is

  **The meta-schema for screen definitions.** One file per platform, validated against this.

  Screen definitions sit between the page inventory and the wireframes. The inventory answers
  *what screens exist*; these answer *what is on them* — regions, components, states,
  navigation and the permissions that gate each one.

  ## Why YAML rather than a design file

  A wireframe is authoritative for how a screen looks. It is a poor source for what a screen
  *does*: which endpoint fills each region, what happens when that endpoint returns empty,
  which permission hides a button, what the offline state is. Those answers live here, and a
  designer and an engineer reading the same file cannot drift.

  This is the contract a wireframe implements, in the same sense OpenAPI is the contract an
  endpoint implements.

  ## Segregation

  One file per platform. A team owns a platform, a platform owns a file, and two teams never
  edit the same one. Shared regions and components live in `_components.yaml`.

  ## The four states rule

  Every data-loading screen declares `loading`, `empty`, `error`, and `offline` where the
  platform is offline-capable. A screen with only a happy path gets built with only a happy
  path, and the empty state is the one that reaches production unconsidered.

type: object
required: [platform, screens]
properties:
  platform:
    type: object
    required: [code, name, surface, runtime]
    properties:
      code: { type: string, pattern: '^P[0-9]{2}$' }
      name: { type: string }
      surface: { type: string, enum: [guestFacing, staffFacing, platformAdmin, partner, public] }
      runtime: { type: string, enum: [reactWeb, reactNative, reactNativeTablet, electron, embedded] }
      offlineCapable:
        type: boolean
        default: false
        description: Drives whether screens must declare an `offline` state.
      offlineBanner:
        type: object
        description: >
          **What a person sees the moment the connection drops, on every screen of the platform.**
          Added 12 September 2026 for the guest product: web and app carry the same object, written
          from `screens/_guest-pairs.yaml`, and `check-screens` fails them for differing. Distinct
          from `offlineCapable` — the banner says the guest is offline; the flag says what the shell
          can still serve.
        properties:
          kind: { type: string }
          state: { type: string, enum: [info, warning, danger] }
          message: { type: string, description: The words on the banner. }
          shows: { type: string }
          clears: { type: string }
          never: { type: string }
          provenance: { type: string }
      themes: { type: array, items: { type: string, enum: [light, dark] } }
      directions:
        type: array
        items: { type: string, enum: [ltr, rtl] }
        description: >
          RTL is first-class, not a later localisation (CF-42). A platform listing `rtl` has
          every layout mirrored, not merely translated.
      breakpoints: { type: array, items: { type: string } }
      screenCount: { type: integer }
      navigationSets:
        type: object
        description: >
          **Named sets of destinations that several screens share.** `navigation.uses` names one;
          until 9 September nothing defined any, so 16 P04 screens pointed at `posPrimaryRail` and
          `posSaleToPayment` and neither existed anywhere in the package — a pointer to nothing,
          which reads like a fact.

          A set is defined from what its members actually do, not from what the name suggests.
          Where every member exits to the same destinations, those are the set and `provenance`
          says so. Where they share none, `unrealised` says that instead: **a set nobody
          implements is worth recording as unimplemented, and worth nothing at all if given a
          plausible membership to make it look finished.**
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            members: { type: array, items: { type: string } }
            destinations: { type: array, items: { type: string } }
            provenance: { type: string }
            unrealised: { type: string }

  screens:
    type: array
    items:
      type: object
      required: [id, name, module, wave, states]
      properties:
        # **Two or three letters, not three.** This read `{3}` until 8 September, which **all 363
        # `BO-` screens failed** — a third of the package outside its own schema, on the field
        # every other artefact keys on. Nothing validated it, which is the same reason the
        # `wireframe` block drifted: a schema nothing reads is a document, not a constraint.
        # Widened to describe the prefixes that exist rather than renaming 363 screens, because
        # the id is what `board-data.js`, the traceability map and every board anchor join on.
        # **Widened to four digits on 19 September, for the same reason as 8 September.** P08
        # passed 999 screens when 584 pack screens landed on it, and 199 ids from `BO-1000` up
        # failed a rule that had silently assumed no platform would ever hold a thousand.
        #
        # **Splitting P08 does not fix this**, which is worth recording because it was the first
        # answer tried: the over-999 ids are spread by allocation order, not by module — 102 sit
        # in `Orders & Money` and 97 in `Access & Venue` — so moving one group out leaves the
        # other failing. The ceiling is the pattern, and the split is a navigation decision that
        # stands on its own.
        #
        # Three-digit ids stay valid, so nothing is renumbered and no contract reference moves.
        id: { type: string, pattern: '^[A-Z]{2,3}-[0-9]{3,4}$' }
        name: { type: string }
        module: { type: string }
        requiresModule:
          type: string
          enum: [core, ticketing, access, fnb, retail, inventory, seating, membership, marketing,
                 resources, queue, games, maintenance, accreditation, partner, developerApi,
                 analytics, ai]
          description: >
            **Which licensed module this screen belongs to.** Declared 24 August, and it is the
            join that did not exist: `moduleKey` was a free string on the licence and `module` was
            prose on the screen — 38 distinct values, 124 of them literally `TODO` — so **a tenant
            without an F&B licence was still served every F&B screen.**

            **Distinct from `module`, which is a section name for navigation.** *Sell* is where a
            screen sits in the back office; `ticketing` is what a tenant bought. A venue can
            license ticketing and retail and see both under one section.

            **`core` means always on.** A value rather than an absence, because **an empty field
            and *always on* look identical and only one of them is a decision.**
        purpose:
          type: string
          description: One sentence. What the user came here to do.
        capability: { type: string }
        requirements: { type: array, items: { type: string } }
        wave: { type: integer, minimum: 1, maximum: 4 }
        permission:
          type: string
          description: >
            Required to reach the screen at all. Null means any authenticated principal, or
            public. Component-level gating is declared on the component.
        apis:
          type: array
          description: >
            Every operation this screen calls. Validated against the contracts in CI — a
            screen referencing an operation that does not exist fails the build, which is how
            a wireframe drawn against an imagined endpoint gets caught.
          items:
            type: object
            required: [operationId, purpose]
            properties:
              operationId: { type: string }
              purpose: { type: string }
              trigger: { type: string, enum: [onLoad, onAction, onInterval, onScan, background] }
              invalidates:
                type: array
                items: { type: string }
                description: >
                  **What has to be refetched after this operation succeeds.** The object a data
                  layer is configured from, and the reason a list still shows a row somebody just
                  deleted when nobody writes it down.
        layout:
          type: object
          properties:
            template:
              type: string
              enum: [list, detail, form, dashboard, wizard, split, canvas, modal, fullscreen,
                     board, calendar]
              description: >
                **`calendar` was added 9 September, after the enum started being enforced.**
                `BO-096 Resource Calendar` had declared it since August — the only one of 1,083
                templates outside this list — and passed every check, because until that day
                nothing read the enum. It is a real layout rather than a mistake: the screen
                renders a `timeline` of resource availability against `getResourceAvailability`,
                and none of the other ten express a scheduling grid. **Adding it was the choice
                between a vocabulary that describes the package and a screen that lies to satisfy
                the schema.**
            regions:
              type: array
              items:
                type: object
                required: [name, components]
                properties:
                  name: { type: string }
                  slot:
                    type: string
                    description: Which slot of the screen's `pattern` this region fills.
                  ref: { type: string, description: Shared region from `_components.yaml`. }
                  components:
                    type: array
                    items:
                      type: object
                      required: [kind]
                      properties:
                        kind:
                          type: string
                          description: >
                            From `_components.yaml`. Not free text — a component that does not
                            exist there either needs adding deliberately or is the wrong one.
                        label: { type: string }
                        bindsTo: { type: string }
                        permission:
                          type: string
                          description: >
                            Hides the component when absent. Hiding is the default; a disabled
                            control the user cannot explain is worse than one that is not there.
                        notes: { type: string }
                        # --- added 9 September, with the pattern layer -------------------
                        columns:
                          type: array
                          items: { type: string }
                          description: >
                            **Named schema paths, not a sentence.** *"Every record with its
                            status"* was the note on 315 `dataTable` components and is the reason
                            337 screens were indistinguishable from one another.
                        operation:
                          type: string
                          description: >
                            Which of the screen's declared operations fills this component. A
                            screen with three `onLoad` calls and three components says nothing
                            about which fills which without it.
                        provenance:
                          type: string
                          description: >
                            **Where this came from** — a frame, a pack page, a contract schema
                            path, a minute, or `authored`. A field that can cite nothing should not
                            have been written: *"Find a record"* cited nothing and appeared 335
                            times.
        states:
          type: object
          required: [loading, empty, error]
          properties:
            loading: { type: string }
            empty: { type: string }
            error: { type: string }
            offline:
              type: string
              description: >
                Required where the platform is offline-capable. Served from the local bundle,
                queued, or refused with a reason.
            denied: { type: string }
        machine:
          type: object
          # **The process vocabulary, which this package has never had.** `states` above is a
          # *rendering* vocabulary — `loading`, `empty`, `error`, `offline`, `denied` — and it is
          # correct as it stands. It cannot express the thing that actually breaks a till.
          #
          # **A cashier mid-payment is not "loading".** The terminal has charged a card and not
          # answered, and the only safe move is to inquire rather than retry, because a retry
          # takes the money twice. No value of `states` can say that, and until this block existed
          # the six machines already implemented in the POS prototype — `payStage`, `closeStep`,
          # `dstep`, `reversalStage`, `netStatus` and the top-level `screen` — lived only in
          # somebody's JavaScript.
          #
          # **These are transcribed, not invented.** Every state and edge below came off a working
          # prototype or a flow; `provenance` says which. A machine nobody has observed does not
          # belong here.
          #
          # It is also where `navigation.transitions[].onFailure` lands: an anchor like
          # `POS-005#paymentUnknown` names a state in this block, and `check-screens.py` reports
          # it as landing nowhere until the block declares it.
          additionalProperties: false
          required: [key, initial, states]
          properties:
            key:
              type: string
              description: >
                The variable a developer implements — `payStage`, `closeStep`. **One screen, one
                machine**: a screen needing two is usually two screens.
            initial:
              type: string
              description: >
                The state the screen holds on entry. Must be one of `states`.
            provenance:
              type: string
              description: >
                Where the machine was read from — a prototype, a flow, a minute. **Required in
                practice**: an unattributed machine is a guess about how a till behaves.
            states:
              type: object
              description: >
                Every state the key can hold. **A state nothing transitions into is unreachable**
                and the checker says so — that is usually a state somebody renamed halfway.
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  operation:
                    type: string
                    description: >
                      The operation in flight while the screen holds this state — one of the
                      screen's own `apis[]`.
                  note:
                    type: string
                    description: >
                      What is true of the world here, in the words that matter to whoever is
                      standing at the till. *"The terminal charged a card and never answered.
                      Inquiry, never retry."*
                  terminal:
                    type: boolean
                    description: The machine stops here; nothing leaves.
                  goes:
                    type: string
                    description: >
                      Where a terminal state sends the operator — a screen id or `id#anchor`.
                  retryTo:
                    type: string
                    description: The state a retry from here returns to.
            transitions:
              type: array
              description: >
                The edges. **`on` is the event as the operator or the gateway causes it** — the
                words on a control, or the name of what came back.
              items:
                type: object
                additionalProperties: false
                required: [from, "on", to]
                properties:
                  from: { type: string }
                  "on": { type: string }
                  to: { type: string }
                  note: { type: string }
        entryState:
          type: object
          description: >
            **What the screen arrives holding, and where it came from.** 280 screens call an operation
            with a path parameter and not one route declared it — `GST-013 Ticket Details` calls
            `getEntitlement(entitlementId)` on the route `/general/ticket-details`, so **the screen
            cannot know which ticket it is showing.**

            141 of those have no `entryFrom` either, so **nothing upstream can supply the id.** Raised
            on 20 August: screens start abruptly, and what is already loaded is unstated.

            A screen that needs a parameter must say so, and say what hands it over. **The alternative
            is a frontend team guessing, and guessing differently on each screen.**
          properties:
            params:
              type: array
              description: Path or query parameters the screen cannot render without.
              items:
                type: object
                required: [name, from]
                properties:
                  name:
                    type: string
                  from:
                    type: string
                    description: >
                      The screen id that supplies it, `session` where it comes from the signed-in
                      principal or the workstation, or `deepLink` where a guest may arrive cold from
                      an email or a QR code. **`deepLink` is the one that needs an unhappy path** —
                      a link opened three weeks late lands on something expired.
                  optional:
                    type: boolean
                    default: false
            preloaded:
              type: array
              description: >
                What the previous screen already has and hands over, so the screen renders before its
                own fetch returns. **The difference between a detail screen that flashes a skeleton and
                one that shows the row you just tapped.**
              items:
                type: string
            coldEntry:
              type: string
              description: >
                What happens when somebody arrives with no upstream screen — a bookmark, a deep link, a
                refresh. **Every screen taking a parameter can be reached cold**, and a screen with no
                answer here is one that renders empty and blames the network.
        navigation:
          type: object
          # **Six of this block's nine keys were undeclared while 1,091 screens used them.**
          # `inferred` (1,020 screens), `notes` (757), `fromFlows` (66), `uses` (16),
          # `transitions` (11) and `flowDerived` (7) were all written, read and rendered without
          # ever appearing here — the same drift that let `wireframe.status` carry a value outside
          # its own enum on every screen in the package. **The block is closed now**: a key not
          # listed is a typo, and the checker says so rather than the field going quietly nowhere.
          #
          # **`exitTo` is the graph and stays bare strings.** `check-screens`, `screen-index.json`,
          # `board-data.js` and the reachability check all join on it, and labelling it in place
          # was tried on 9 September and reverted — it broke eleven consumers that read the entry
          # as a string, none of which crashed. They compared a dict to a set of ids and reported
          # a dangling link to a screen named `{'to': 'POS-005'}`: loud enough to notice, quiet
          # enough to be mistaken for a data error.
          #
          # **`transitions` is that same edge with the answers attached**, alongside rather than
          # inside. An edge with no entry is unwritten, not illegal.
          additionalProperties: false
          properties:
            entryFrom: { type: array, items: { type: string } }
            exitTo: { type: array, items: { type: string } }
            isEntryPoint: { type: boolean }
            inferred:
              type: boolean
              description: >
                The edges were derived by a generator rather than read off a flow or a board.
                **Marking a block non-inferred turns a disagreement with the flows from a warning
                into a failure** — it is a claim that somebody stands behind these edges.
            fromFlows: { type: boolean }
            flowDerived: { type: boolean }
            notes: { type: string }
            uses:
              type: array
              items: { type: string }
              description: >
                Named shared navigation sets this screen joins. **Nothing defines these sets.**
                Sixteen P04 screens name `posPrimaryRail` and `posSaleToPayment`; neither exists
                in any file in the package, so the checker warns rather than resolving them.
                Either the sets get declared or the key goes — a pointer to nothing is worse than
                no pointer, because it reads like a fact.
            transitions:
              type: array
              description: >
                **What a frontend developer cannot guess**: which control makes the move, what
                gates it, what state travels with it, where cancel lands, and what a failure does.
              items:
                type: object
                additionalProperties: false
                required: [to, trigger, provenance]
                properties:
                  to:
                    type: string
                    description: >
                      A screen id, or `id#anchor` for a state or overlay within it.
                  trigger:
                    type: string
                    description: The words on the control, as the operator reads them.
                  control:
                    type: string
                    description: >
                      `kind#id` naming the component in `layout.regions` that makes the move —
                      `primaryButton#charge`, `drawer#drawerSeatSelection`. The kind alone is not
                      enough on a screen carrying four buttons.
                  operation:
                    type: string
                    description: One of this screen's own `apis[]` entries, by operationId.
                  precondition:
                    type: string
                    description: >
                      The condition on screen state that makes the control live —
                      `cart.lineCount > 0`. **Distinct from `guard`, which is about the principal
                      rather than the data.**
                  guard:
                    type: string
                    description: >
                      A permission key from `roles.yaml`. Absent means any principal who can reach
                      the screen can make the move. **A gated exit needs `states.denied`** — a
                      refusal with nowhere to land is a dead control.
                  escalatable:
                    type: boolean
                    description: >
                      A principal without `guard` can raise it to one who holds it, per
                      `roles.yaml` `escalation`, rather than being refused outright.
                  carries:
                    type: array
                    items: { type: string }
                    description: >
                      **The field this block exists for.** The state that travels with the move.
                      Without it a developer reads somebody's JavaScript to find out.
                  returnsTo:
                    type: string
                    description: >
                      Where closing or cancelling lands — for a drawer, usually the screen behind.
                  discards:
                    type: array
                    items: { type: string }
                    description: >
                      What `returnsTo` throws away. **A drawer that returns a seat selection to
                      the cart is a different thing from one that discards it**, and 199 overlays
                      in the package said which they were nowhere at all.
                  onFailure:
                    type: array
                    description: Where a failed attempt lands, per failure mode.
                    items:
                      type: object
                      additionalProperties: false
                      required: [when, to]
                      properties:
                        when: { type: string }
                        to: { type: string }
                        note: { type: string }
                  back:
                    type: boolean
                    description: Whether the operator can come back the way they came.
                  crossesDevice:
                    type: boolean
                    description: >
                      A handover to another device rather than a link (the 24 August rule). The
                      operator does not navigate; they pick the work up somewhere else.
                  provenance:
                    type: string
                    description: >
                      Where the transition was read from — a flow step, a board interaction, a
                      minute. **Required**: an unattributed transition is somebody's guess.
        accessibility:
          type: object
          properties:
            focusOrder: { type: string }
            announcements: { type: string }
            notes: { type: string }
        wireframe:
          type: object
          # **This block described four fields and carried seven.** Until 8 September `status`
          # was the only declared one with an enum, and **not one of the 1,091 screens held a
          # legal value** — 958 read `generated` and 133 `designed`, neither in the enum, and
          # nothing validated it. `board`, `workshopBoard`, `source`, `note`,
          # `generatedFallback` and `derivedFrom` were not declared at all.
          #
          # The defect underneath was **one field carrying intent and fact**. `generated` and
          # `designed` say how a frame came to exist; they are not places in a review workflow,
          # and putting them in `status` left four consumers reading four different numbers off
          # it — 0, 1091, 133 and a permanent 0.
          #
          # **`status` is intent. `provenance` is fact.** Neither is coverage: coverage is the
          # board join, and no field here should be read as a substitute for it.
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [notStarted, inProgress, review, approved]
              description: >
                **Where this screen has reached in the design workflow, and nothing else.**
                Hand-set. `notStarted` is the honest default and is not a claim that no frame
                exists — a generated frame is a frame nobody has reviewed.
            provenance:
              type: string
              enum: [generated, designed]
              description: >
                **How the frame came to exist.** `generated` is the tool's output from the
                screen's own name and operations; `designed` is a frame a person drew. A
                generated frame agreeing with the operation it was generated from is not
                corroboration.
            board:
              type: string
              description: The frame this screen renders as, as `<board file>#<anchor>`.
            workshopBoard:
              type: string
              description: The workshop frame this screen was drawn on, where one exists.
            generatedFallback:
              type: string
              description: >
                The generated frame kept alongside a drawn one, so a board that stops opening
                does not take the screen's only frame with it.
            derivedFrom:
              type: string
              description: The frame this screen's layout was taken from, where it reuses another.
            source: { type: string }
            note: { type: string }
            figmaNodeId: { type: string }
            owner: { type: string }
        notes: { type: string }
        openQuestions:
          type: array
          items: { type: string }
          description: >
            What has to be answered before this screen can be drawn. Preferable to drawing it
            and discovering the question at build.
        pattern:
          type: string
          description: >
            **Which pattern from `_patterns.yaml` this screen is an instance of.** The pattern owns
            the structure; the screen fills its slots. Added 9 September, and it is what turns 337
            identical `searchField + dataTable + detailPanel` screens into 337 configurations of
            one thing rather than 337 hand-written layouts.
        patternReason:
          type: string
          description: >
            **What in the source chose that pattern** — named sections of the workshop pack, a
            frame, or `authored`. Added 9 September with the P09 regeneration, because the first
            generation chose every screen's shape from its own title and nothing recorded that it
            had. A screen whose pack supports no pattern says so here rather than presenting a
            default as a decision: **72 of P09's 230 Commercial screens do exactly that**, and
            being able to count them is the point of the field.
        overlays:
          type: array
          description: >
            **Popups, drawers and sheets, declared apart from the layout because each renders as its
            own wireframe frame** — the screen behind it, dimmed, with the dialog over it. A
            reviewer cannot judge a flow from a list of dialog names, and no screen in the package
            declared a `modal` or a `toast` before this existed.
          items:
            type: object
            # **199 overlays declared what opens them and not one said what closing them does.**
            # A drawer that returns a seat selection to the cart is a different thing from one
            # that discards it, and a developer reading only `trigger` and `body` cannot tell
            # which — so they guess, and the guess is where the cart quietly loses the seats.
            additionalProperties: false
            required: [id, component]
            properties:
              id: { type: string }
              component: { type: string, description: From `_components.yaml`. }
              trigger: { type: string, description: The action or state that opens it. }
              body:
                type: string
                description: >
                  **The consequence, in the words the user reads.** *"Delete 3 assets in use on the
                  live homepage"* is a confirmation; *"Are you sure?"* is not.
              bindsTo: { type: string }
              confirm:
                type: object
                additionalProperties: false
                description: >
                  **What accepting it does.** The affirmative control, where it lands, and what it
                  hands forward.
                properties:
                  label:
                    type: string
                    description: The words on the control — `Recall`, not `OK`.
                  to:
                    type: string
                    description: Where it lands — a screen id or `id#anchor`.
                  carries:
                    type: array
                    items: { type: string }
                    description: The state that survives the close and travels on.
                  operation:
                    type: string
                    description: One of the screen's own `apis[]`, called on confirm.
              dismiss:
                type: object
                additionalProperties: false
                description: >
                  **What closing it does** — and closing is not always cancelling. A drawer
                  dismissed after a valid pick may still carry that pick back.
                properties:
                  label: { type: string }
                  to:
                    type: string
                    description: Where dismissing lands — usually the screen behind.
                  carries:
                    type: array
                    items: { type: string }
                    description: What survives the dismiss. Empty means nothing does.
                  discards:
                    type: array
                    items: { type: string }
                    description: >
                      What is thrown away, named explicitly. **The field that stops "close" being
                      ambiguous** — a reader should not have to infer loss from silence.
              provenance: { type: string }
        gaps:
          type: array
          description: >
            **What this screen needs and the package does not have.** An operation that should
            exist, or a field a component needs and no schema carries.

            Recorded on the screen rather than only in a register, because the screen is where
            somebody notices — and because a screen that names the operation it is missing has done
            the thinking the title-stamp rule demands, which is why that rule exempts it.
          items:
            type: object
            properties:
              operation: { type: string }
              field: { type: string }
              removed:
                type: boolean
                description: True where the entry records an operation taken *off* the screen.
              why: { type: string }
              source: { type: string }
        apisNote:
          type: string
          description: >
            Why the operation list is what it is — used where **zero operations is correct** and
            would otherwise read as an omission, as on a landing page that fetches nothing.
        purposeNote:
          type: string
          description: Why the purpose was rewritten, where it had been wrong rather than merely thin.
        resolvedQuestions:
          type: array
          items: { type: string }
          description: >
            **A question that has been answered, kept with its answer.** Added 9 September, when
            `openQuestions` was found to be holding three different things at once: 24 open
            questions, 41 pieces of pre-contract residue, and 9 answers that had been written
            into the question they resolved. **74 read as open and 24 were.**

            Answers move here rather than being deleted, because losing which minute settled a
            thing is how it gets asked again — `BO-006` waited three weeks on a question the
            14 August minute had already answered.

        # --- Declared 9 September ---------------------------------------------------------
        # **Ten keys were in use at screen level and none of them were declared here.** The same
        # defect as the `wireframe` block one level up: a schema that describes less than the
        # files hold is a schema nothing can be validated against. They are described now.
        #
        # **Closure is deliberately not set.** `additionalProperties: false` here would be a rule
        # `check-screens.py` does not read, and an unenforced rule is the thing this file has
        # already been caught doing three times — the `wireframe` block, the `id` pattern and the
        # `layout.template` enum. Close it in the same change that enforces it.
        source:
          type: object
          description: >
            **Where the screen came from, as a citation.** The client pack, the board within it
            and the frame number. On 590 screens. Structured because it is joined against
            `sources/packs/` by `tools/audit-pack-citations.py`.
          properties:
            pack: { type: string }
            board: { type: string }
            number: { type: string }
        sourceNote:
          type: string
          description: >
            **The prose form of `source`**, on 128 screens — *"client board, specified"*,
            *"MoM 10 August 2026 §4.8"*. Disjoint from `source`: no screen carries both.

            **Named `provenance` until 9 September**, which collided head-on with
            `wireframe.provenance` — prose against the enum `generated|designed`, on 128 screens
            that carried both. Third instance of one word doing two jobs, after `release` (a hold,
            and a publication) and `generatedPack` (the client drew it, against `generated`
            meaning nobody did).
        implementation:
          type: object
          description: >
            Where the screen lives in the codebase — app, route and component path. On all 1,091.
            Read by `check-frontend.py` and `derive-platform.py`.
          properties:
            app: { type: string }
            route: { type: string }
            component: { type: string }
        density:
          type: string
          enum: [compact, comfortable, touchLarge]
          description: >
            **How much the screen fits per square inch, and it is a hardware question.**
            `touchLarge` is a screen operated with a finger, often wet or gloved; `compact` is a
            desk with a mouse. 892 compact, 148 comfortable, 51 touchLarge.
        densityReason:
          type: string
          description: >
            Why this screen departs from its platform's default density. On 11 screens, and
            required only where the value is surprising — *"bumped by somebody with flour on their
            hands, read from two metres"*.
        statesDerived:
          type: boolean
          description: >
            True where the four states were written by `derive-empty-states.py` rather than by a
            person. On 401 screens. **A derived state is a placeholder that reads like a
            decision**, which is the distinction this flag exists to keep.
        boardFrames:
          type: array
          items: { type: string }
          description: >
            Every frame this screen appears on, as `<board file>#<anchor>`. On 145 screens.
            Distinct from `wireframe.board`, which names the one canonical frame.
        offline:
          type: boolean
          description: >
            An explicit *this screen does not work offline* on a platform that otherwise does.
            On 8 screens, all `false`. **A value rather than an absence**, because an unstated
            offline story and a deliberate refusal look identical and only one is a decision.
        audience:
          type: string
          enum: [guest, staff, device, partner, platform]
          description: >
            Overrides the platform's own audience for a single screen. On 2 screens. Checked
            against operation audiences by `check-screens.py`.
