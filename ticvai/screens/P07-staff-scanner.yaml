    contract: access
    purpose: List scan events
    trigger: onLoad
  - operationId: syncScans
    contract: access
    purpose: Replay scans recorded offline
    trigger: onAction
  - operationId: getOfflinePackage
    contract: access
    purpose: Entitlement and rule set for offline validation
    trigger: onLoad
  - operationId: lookupTicket
    contract: access
    purpose: Read-only validity check without admitting
    trigger: onLoad
  - operationId: overrideAccess
    contract: access
    purpose: Admit against a failed validation
    trigger: onAction
  - operationId: validateAccess
    contract: access
    purpose: Validate media at an access point and admit or deny
    trigger: onAction
  - operationId: validateGroupAccess
    contract: access
    purpose: Admit a group on one read
    trigger: onAction
  - operationId: consumeRedemptionRight
    contract: cross-cell
    purpose: Consume entries against a right, locally authoritative
    trigger: onAction
  - operationId: listBlacklist
    contract: access
    purpose: From the flow it appears in
    trigger: onLoad
  density: comfortable
  entryState:
    params:
    - name: mediaCode
      from: deepLink
    - name: rightId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No
      silent redirect — a supervisor following a link from an alert needs to know whether the record
      moved, closed or never existed, because those are three different next actions. **The scope is
      resolved from the session, never from the link**: a link cannot move somebody to a venue they
      do not hold. Arrives with `mediaCode`, `rightId`.'
  requiresModule: access
  statesDerived: true
