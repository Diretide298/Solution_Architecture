- id: KSK-004
  name: Choose tickets
  module: Sell
  requiresModule: ticketing
  wave: 2
  capability: C00
  implementation:
    app: guest-app
    route: /sell/choose-tickets
    component: apps/guest-app/src/routes/sell/ChooseTicketsDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - KSK-001
    - KSK-002
    - KSK-003
    - KSK-005
    - KSK-015
    inferred: true
    fromFlows: true
    transitions:
    - to: KSK-005
      trigger: Chooses a session
      provenance: flow F07 step 4→5
    - to: KSK-015
      trigger: Assistant
      provenance: 'derived — KSK-015 declares entryState.params conversationId, messageId and KSK-004
        holds none of them. The edge carries nothing: conversationId, messageId only pre-select (deep
        link or optional), and KSK-015 opens on its own'
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written.


    **Tickets first, then date and time (decided by Chinmay, 2 October 2026; DEC-170).** The kiosk differs
    from the web and the app, which pick the date and time first (REV3-2); REV3-2 is superseded for the
    kiosk only. The order is KSK-003, KSK-004 (tickets), KSK-005 (session), as F07 already walks it (CHG-SGU-015).'
  density: touchLarge
  boardFrames:
  - Kiosk Board 1.dc.html#KSK-004
  pattern: listDetail
  patternReason: '`listProductVariants` reads the population and `getAvailability` reads one of them —
    list, select, act'
  purpose: 'Choose the tickets first, then the date and time: quantities, with targets a gloved hand can
    hit.'
  gaps:
  - operation: getAvailability
    why: '**`getAvailability` declares its response inline**, so the component that shows it names fields
      but binds to no schema. The contract should name the shape.'
    source: contract catalogue.yaml GET /availability
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Tickets
        bindsTo: ProductVariant
        columns:
        - ProductVariant.name
        - ProductVariant.description
        operation: listProductVariants
        provenance: corrected 2 October 2026 (CHG-SGU-015, decided by Chinmay 2 October 2026, DEC-170)
        notes: Large counters per ticket type; inactive variants never shown. Was the generated table
          'Every product variant'; staff and plumbing columns removed (decided by Chinmay, fix before
          Block A starts, 2 October 2026 (GFIX-3)).
      - kind: dataTable
        label: Availability
        operation: getAvailability
        notes: Shows `channelCapacityId`, `performanceId`, `capacity`, `sold`, `leased`, `remaining`,
          `byChannel` from `getAvailability`'s inline response. **The response has no named schema**,
          so this cannot bind until the contract names one.
        provenance: contract catalogue.yaml GET /availability
  states:
    loading: The choose tickets list.
    error: Could not load. Names which read failed and leaves the choose tickets untouched.
    emptyFirstRun: No choose tickets yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: 'Never shown: `listProductVariants` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: '**A kiosk holds no permission and needs none** (decided by Chinmay, fix before Block
      A starts, 2 October 2026 (GFIX-4)): it sells to whoever is standing at it, and reads what the tenant
      has published like any visitor. A kiosk whose device registration is revoked goes out of service
      (KSK-014); it never shows a sign-in or names a permission.'
    offline: Not available
  apis:
  - operationId: getAvailability
    contract: catalogue
    purpose: Live remaining capacity
    trigger: onLoad
  - operationId: listProductVariants
    contract: catalogue
    purpose: List generated variants
    trigger: onLoad
  entryState:
    params:
    - name: productId
      from: deepLink
    coldEntry: '**A shared product link after the product retired.** Shows what replaced it where a successor
      exists, and the catalogue where none does.'
    preloaded: []
  wireframe:
    status: notStarted
    provenance: generated
