- id: KSK-016
  name: Order Food
  module: Sell
  requiresModule: fnb
  wave: 2
  implementation:
    app: guest-app
    route: /sell/order-food
    component: apps/guest-app/src/routes/sell/OrderFoodList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - KSK-003
    exitTo:
    - KSK-017
    - KSK-007
    transitions:
    - to: KSK-017
      trigger: Shop
      carries:
      - outletId
      provenance: derived — KSK-017 declares entryState.params outletId and KSK-016 holds outletId, so
        an edge into it carries them
    - to: KSK-007
      trigger: Pays for the food order
      carries:
      - orderId
      provenance: design cross-check, 3 October 2026 (CHG-R1S-022)
  notes: "BL-066. **Every operation existed and no screen called them** — `getGuestMenu` and `createGuestFnbOrder`\
    \ are contracted and guest-callable, and P05 had fifteen screens selling neither food nor merchandise.\n\
    \ \n**Where the outlet is (decided by Chinmay, 2 October 2026; DEC-070, DEC-206).** An outlet is *Inside\
    \ the venue (needs an admission ticket)* or *Standalone (no ticket)* (`Outlet.admissionContext`).\
    \ Ordering from an inside-the-venue outlet needs admission: a ticket, or a location claimed inside\
    \ the venue; `createGuestFnbOrder` refuses 403 `entry-ticket-required` otherwise, and the screen says\
    \ so and offers the tickets. A standalone restaurant sells takeaway and delivery without a ticket.\
    \ **F&B keeps its own payment step and its own receipt** (DEC-071, DEC-052): DI-293's one cart and\
    \ one receipt does not apply to F&B, so the food order is paid on its own pay step and its receipt\
    \ does not join the guest's ticket receipt (CHG-SGU-001). **At a kiosk (DEC-206):** a kiosk inside\
    \ the venue sells food to admitted guests; food and tickets bought together at a kiosk are two payments\
    \ and two receipts, not one."
  density: touchLarge
  boardFrames:
  - Kiosk Board 2.dc.html#KSK-016
  pattern: statusTracker
  patternReason: '`getGuestMenu` reads one record and nothing reads a population — the screen is about
    that one thing'
  purpose: Order food from the kiosk and collect it.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The guest menu
        bindsTo: GuestMenu
        columns:
        - GuestMenu.outletId
        - GuestMenu.menuId
        - GuestMenu.name
        - GuestMenu.inForceUntil
        - GuestMenu.currency
        - GuestMenu.currencyScale
        - GuestMenu.sections
        operation: getGuestMenu
        provenance: contract fnb.yaml GET /outlets/{outletId}/guest-menu
      - kind: cardList
        bindsTo: GuestMenu.sections
        notes: Photographs, because **a guest at a kiosk with a queue behind them is not reading descriptions**
        provenance: corrected 2 October 2026 (CHG-SGU-001, decided by Chinmay 2 October 2026, DEC-070/071/052/206)
        operation: getGuestMenu
        label: Menu
      - kind: banner
        notes: Says *contains* and *may contain* apart, from each item's `allergenDetail` (`Allergen.contains`,
          `Allergen.mayContain`) (CHG-R1S-022).
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Add to order
        provenance: carried from the previous definition
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Pay
        operation: createGuestFnbOrder
        provenance: contract fnb.yaml POST /guest-orders
  states:
    loading: The menu, with the first category open
    error: Could not load the menu. **The kiosk still sells tickets** — one outlet being unreachable does
      not close the kiosk.
    emptyFirstRun: Nothing is being served right now. **The state names the next service time** — a guest
      at a kiosk at 4pm needs to know whether to wait twenty minutes or go elsewhere.
    emptyNoResults: Nothing matches that filter. **Allergen filters narrow hard** — a guest filtering
      for nut-free at a nut-heavy outlet should be told that plainly rather than shown a blank menu.
    emptyNoAccess: Not applicable — a kiosk menu is public.
  apis:
  - operationId: getGuestMenu
    contract: fnb
    purpose: The menu for this outlet
    trigger: onLoad
  - operationId: createGuestFnbOrder
    contract: fnb
    purpose: Order food at the kiosk; its own payment and receipt; refused without admission at an inside-the-venue
      outlet (DEC-206)
    trigger: onAction
  entryState:
    params:
    - name: outletId
      from: deepLink
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `outletId`.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P05 Guest Kiosk.dc.html#ksk-016
    derivedFrom: wireframes/reference/Kiosk Board 2.dc.html
    note: '**Drawn by Claude Design on `Kiosk Board 2.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formCreateGuestFnbOrder
    component: modal
    trigger: Pay
    body: '**Confirms the basket before it is sent; the guest types nothing here.** The kiosk sends the
      basket''s lines; `id`, `recordedAt`, `quotedTotal` and `locationSessionId` are set by the kiosk
      and `fulfilment` is the outlet''s counter pickup. Then the guest pays at the terminal (KSK-007)
      and the kitchen sees the order only once it is paid; KSK-009 confirms it (CHG-R1S-022). Dismissing
      sends nothing.'
    bindsTo: CreateGuestOrderRequest
    confirm:
      label: Pay
      operation: createGuestFnbOrder
    dismiss:
      label: Cancel
      discards:
      - id
      - lines
      - quotedTotal
      - recordedAt
      - locationSessionId
      - outletId
      - fulfilment
      - paymentMethod
    provenance: contract fnb.yaml POST /guest-orders
- id: KSK-017
  name: Shop
  module: Sell
  requiresModule: retail
  wave: 2
  implementation:
    app: guest-app
    route: /sell/shop
    component: apps/guest-app/src/routes/sell/ShopList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - KSK-016
    exitTo:
    - KSK-016
    - KSK-006
    - KSK-007
    inferred: false
    notes: '**Returns to KSK-016.** Stated on 4 September: this screen declared where it is reached from
      and no way to leave, so whoever landed on it was stuck. The return path is the same edge travelled
      the other way, not a guess about the product.'
    transitions:
    - to: KSK-016
      trigger: Order Food
      carries:
      - outletId
      provenance: derived — KSK-016 declares entryState.params outletId and KSK-017 holds outletId, so
        an edge into it carries them
    - to: KSK-006
      trigger: Review the basket
      provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
    - to: KSK-007
      trigger: Pay
      provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
  notes: 'BL-066, BL-019. **A guest can browse and reserve and not buy**, which is where retail stops
    for a guest surface — `createRetailSale` is a till operation. **Cross-surface parity, 31 August**:
    added addCartLine, lookupMerchandise. **A guest does not know which surface they are on** — the same
    named screen on web and app now calls the same guest-callable operations.


    **Buying goes through the kiosk basket and its payment steps (KSK-006, KSK-007)**; the hold is the
    only unpaid path. Corrected 2 October 2026 (CHG-SGU-018): the notes'' "browse and reserve and not
    buy" contradicted the purpose.'
  density: touchLarge
  boardFrames:
  - Kiosk Board 2.dc.html#KSK-017
  pattern: listDetail
  patternReason: '`listMerchandise` reads a population and nothing reads one of them; the detail is the
    row until a `get` exists'
  purpose: Buy merchandise at the kiosk in the same basket as tickets and food, or hold an item to pay
    for at the shop until the end of the visit day.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Shop
        operation: listMerchandise
        notes: Shops by name; sends `outletId`.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: GuestMerchandiseItem.outletId
      - kind: selectField
        label: Category
        operation: listMerchandise
        notes: Categories by name; sends `categoryId`.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: GuestMerchandiseItem.categoryId
      - kind: cardList
        label: Merchandise
        bindsTo: GuestMerchandiseItem
        columns:
        - GuestMerchandiseItem.name
        - GuestMerchandiseItem.description
        - GuestMerchandiseItem.price
        - GuestMerchandiseItem.isAvailable
        - GuestMerchandiseItem.imageAssetRef
        operation: listMerchandise
        notes: 'The guest projection: name, photo, price and whether it can be bought; sold-out items
          stay visible. No sku, barcode, variant, stock or inventory ids.'
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: toggle
        label: In stock only
        operation: listMerchandise
        notes: Sends `?inStockOnly=` to `listMerchandise`.
        provenance: contract retail.yaml GET /merchandise
      - kind: searchField
        label: Search
        operation: listMerchandise
        notes: Sends `?search=` to `listMerchandise`.
        provenance: contract retail.yaml GET /merchandise
      - kind: multiSelect
        label: Size
        provenance: carried from the previous definition
        notes: Size buttons switch between sibling items (DEC-057).
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Hold to pay at the shop
        operation: reserveMerchandise
        provenance: contract retail.yaml POST /outlets/{outletId}/reserve
      - kind: primaryButton
        label: Add to my kiosk basket
        operation: addCartLine
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Lookup merchandise
        operation: lookupMerchandise
        notes: The kiosk is a workstation, so the price check is at its own outlet and sends no `outletId`
          (a workstation caller's own outlet always wins); an inactive item is not found (decided 28 September,
          audit R215 (1)).
        provenance: contract retail.yaml GET /merchandise/lookup
  states:
    loading: Products with stock, in-stock first
    error: Could not load. Tickets and food are unaffected.
    emptyFirstRun: This kiosk does not sell merchandise. **Stated rather than shown as an empty shop**
      — a guest looking at a blank grid assumes it is broken.
    emptyNoResults: Nothing in stock in that size or category. **Reserve-for-collection is offered here**,
      because out of stock at this kiosk is not out of stock at the venue.
    emptyNoAccess: '**There is no permission to name: a guest holds none** (ADR-0025). The shop is public;
      buying needs the guest''s cart.'
  apis:
  - operationId: listMerchandise
    contract: retail
    purpose: What is available
    trigger: onLoad
  - operationId: reserveMerchandise
    contract: retail
    purpose: Hold for collection
    trigger: onAction
    invalidates:
    - listMerchandise
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
    invalidates:
    - listMerchandise
  - operationId: lookupMerchandise
    contract: retail
    purpose: Price and stock check by barcode
    trigger: onAction
  entryState:
    params:
    - name: outletId
      from: KSK-016
    - name: cartId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - MerchandiseItem.id
