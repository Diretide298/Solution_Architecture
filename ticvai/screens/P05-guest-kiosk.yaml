      - conversationId
  notes: 'Added 17 August for 2.1.28, which names the kiosk explicitly and was the only surface with no
    AI screen. **Scoped to `guestCapabilityScope`** — ticket selection, promotions, FAQs, recommendations
    and checkout, and nothing else. **No keyboard**: voice or a constrained touch interface, which is
    why the app chat pattern does not transfer. Depends on CF-14. **Not on the wireframe board.** **Built
    with the kiosk''s selection and checkout screens** (17 August): an assistant that guides a guest through
    ticket selection and checkout cannot ship before the screens that do the selecting and the checking
    out. **Cross-platform navigation removed 24 August**: SUP-004. **A till does not navigate to a back
    office and a guest app does not navigate to either** — those are device handovers, and a flow declares
    them with `crossesDevice` rather than a screen pretending there is a link.'
  density: touchLarge
  boardFrames:
  - Kiosk Board 2.dc.html#KSK-015
  pattern: statusTracker
  patternReason: 'A conversation: the question, the answer and its product cards are the content (CHG-SGU-016)'
  purpose: Help a guest choose and pay, and nothing else.
  gaps:
  - operation: getAvailability
    why: '**`getAvailability` declares its response inline**, so the component that shows it names fields
      but binds to no schema. The contract should name the shape.'
    source: contract catalogue.yaml GET /availability
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: assistantPanel
        label: Ask for help
        operation: sendAiMessage
        notes: 'Voice or a constrained touch interface, no keyboard. Products appear as cards inside the
          conversation (from `listProducts`, guest projection: name, price, what it includes), never as
          a table or a venue-id filter; tapping one returns the guest to the ticket step.'
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
      - kind: cardList
        label: Products Sahli suggests
        bindsTo: Product
        columns:
        - Product.name
        - Product.description
        operation: listProducts
        notes: Cards inside the conversation with the price for today; tapping one returns the guest to
          the ticket step (KSK-004).
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
      - kind: banner
        label: Available today
        operation: getAvailability
        notes: 'On a suggested card: whether it can still be bought today.'
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Talk to a person
        operation: handoverToAgent
        notes: One tap; reason guestRequested.
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
      - kind: secondaryButton
        label: Add to basket
        operation: addCartLine
        provenance: design cross-check, 3 October 2026 (CHG-R1S-023)
  states:
    loading: The assistant list.
    error: Could not load. Names which read failed and leaves the assistant untouched.
    emptyFirstRun: The ask prompt with three starter questions (tickets, timings, what is included).
    emptyNoAccess: '**A kiosk holds no permission and needs none** (decided by Chinmay, fix before Block
      A starts, 2 October 2026 (GFIX-4)): it sells to whoever is standing at it, and reads what the tenant
      has published like any visitor. A kiosk whose device registration is revoked goes out of service
      (KSK-014); it never shows a sign-in or names a permission.'
  apis:
  - operationId: sendAiMessage
    contract: ai
    purpose: Ask
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: listProducts
    contract: catalogue
    purpose: Products shown as cards inside the conversation
    trigger: onAction
  - operationId: getAvailability
    contract: catalogue
    purpose: Whether a product suggested in the conversation can still be bought today
    trigger: onAction
  - operationId: handoverToAgent
    contract: marketing-crm
    purpose: Pass an assistant conversation to a person
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: recordAnswerFeedback
    contract: ai
    purpose: Say whether an answer helped
    trigger: onAction
    provenance: build, 29 September 2026
  - operationId: createAiConversation
    contract: ai
    purpose: Opened silently on the first tap; the kiosk session is the scope
    trigger: background
  - operationId: addCartLine
    contract: orders
    purpose: Add what the assistant suggests to the basket
    trigger: onAction
    provenance: design cross-check, 3 October 2026 (CHG-R1S-023)
  entryState:
    params:
    - name: conversationId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createAiConversation`;
        a link or an edge that holds one opens it instead.'
    - name: messageId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `sendAiMessage`;
        a link or an edge that holds one opens it instead.'
    - name: cartId
      from: navigation
      optional: true
      notes: 'Optional: only `addCartLine` takes it, from the record the user acts on.'
    coldEntry: 'None: a kiosk has no notification cold entry. The assistant opens from KSK-004 at the
      point of confusion and closes when the guest returns or the session times out.'
    preloaded: []
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P05 Guest Kiosk.dc.html#ksk-015
    derivedFrom: wireframes/reference/Kiosk Board 2.dc.html
    note: '**Drawn by Claude Design on `Kiosk Board 2.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
