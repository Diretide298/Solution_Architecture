platform:
  code: P05
  audience: guest
  formFactor: kiosk
  shortName: Guest Kiosk
  name: Guest Kiosk — Self-Service
  surface: guestFacing
  runtime: reactWeb
  app: guest-app
  appStatus: scaffolded
  offlineCapable: false
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: kiosk hardware, kiosk-mode shell
    distribution: device management push
    bundleUpdate: on deploy
    hosting: in-cell
    storeReview: false
    deviceOwnership: venue-owned, unattended
    networkAssumption: venue LAN, generally reliable
    releaseCadence: monthly, out of hours
  screenCount: 17
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: Kiosk is white-labelled like the guest surfaces, not TICVAI-branded like the POS (14 August).
  operator: guest
  directions:
  - ltr
  - rtl
  wireframeBoard: wireframes/P05 Guest Kiosk.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: guest
    name: TICVAI Guest
    shell: kiosk
    siblings:
    - P01
    - P02
    note: '**One guest product in three shells.** Web, mobile and kiosk share 73–91% of their operations;
      the kiosk is the same product in a fixed frame with no keyboard, and is deliberately narrower rather
      than different.'
    decided: 10 September 2026
screens:
- id: KSK-001
  name: Attract Loop
  module: Sell
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: guest-app
    route: /sell/attract-loop
    component: apps/guest-app/src/routes/sell/AttractLoopDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - KSK-002
    - KSK-003
    - KSK-004
    - KSK-014
    inferred: true
    isEntryPoint: true
    transitions:
    - to: KSK-002
      trigger: Chooses a language
      provenance: flow F07 step 1→2, F75 step 1→2
    - to: KSK-003
      trigger: What are you buying
      provenance: structural — KSK-001 is P05's home screen and its exits are its launcher
    - to: KSK-004
      trigger: Choose tickets
      provenance: structural — KSK-001 is P05's home screen and its exits are its launcher
    - to: KSK-014
      trigger: Out of service
      provenance: structural — KSK-001 is P05's home screen and its exits are its launcher
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations still
    to be written. **The attract loop is the entry.** A kiosk has no login and nobody navigates to it
    — it is what the screen shows when nobody is standing there. **Declared 20 August** — `isEntryPoint`
    existed in the schema and five platforms used none, so every screen in them read as unreachable.
  density: touchLarge
  boardFrames:
  - Kiosk Board 1.dc.html#KSK-001
  pattern: listDetail
  patternReason: '**the screen''s operations choose no pattern** — no list, no get, no write that groups.
    It falls to the default, and the fallback is recorded rather than passed off as a decision'
  purpose: Pull somebody standing in a queue out of it.
  gaps: []
  layout:
    template: split
    regions:
    - name: contentBody
      components:
      - kind: cardList
        label: What's on
        operation: listProducts
        bindsTo: Product
        columns:
        - Product.name
        - Product.media
        notes: Published products only, primary media first; a touch opens the language choice (CHG-R1S-022).
        provenance: design cross-check, 3 October 2026 (CHG-R1S-022)
  states:
    loading: Not applicable — the attract loop is the idle state
    error: Falls through to KSK-014 if the kiosk cannot reach the server
    emptyFirstRun: Not applicable
    offline: '**Not available.** An unattended terminal selling from a stale catalogue oversells with
      nobody watching'
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: Fill the loop with the venue's products and their media
    trigger: onLoad
    provenance: design cross-check, 3 October 2026 (CHG-R1S-022)
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P05 Guest Kiosk.dc.html#ksk-001
    derivedFrom: wireframes/reference/Kiosk Board 1.dc.html
    note: '**Drawn by Claude Design on `Kiosk Board 1.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 0 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
- id: KSK-002
  name: Language Select
  module: Sell
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: guest-app
    route: /sell/language-select
    component: apps/guest-app/src/routes/sell/LanguageSelectDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - KSK-001
    - KSK-003
    - KSK-004
    inferred: true
    fromFlows: true
    transitions:
    - to: KSK-003
      trigger: Chooses buy or collect
      provenance: flow F07 step 2→3, F75 step 2→3
    - to: KSK-004
      trigger: Choose tickets
      provenance: 'derived — KSK-004 declares entryState.params productId and KSK-002 holds none of them.
        The edge carries nothing: productId only pre-selects (deep link or optional), and KSK-004 opens
        on its own'
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations still
    to be written.
  density: touchLarge
  boardFrames:
  - Kiosk Board 1.dc.html#KSK-002
  pattern: statusTracker
  patternReason: '`getTenantAppStatus` reads one record and nothing reads a population — the screen is
    about that one thing'
  purpose: Ask the only question that changes everything else.
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: selectField
        label: Choose your language
        bindsTo: PublishedTenantConfig.languages
        operation: getPublishedTenantConfig
        notes: One large button per published language (`languages`), each in its own script; the right-to-left
          ones lay the kiosk out right to left. From the cached configuration when the kiosk is offline.
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
      - kind: banner
        label: Closed for maintenance
        bindsTo: TenantAppStatus.maintenanceMessage
        operation: getTenantAppStatus
        notes: 'Only when `isInMaintenance`: the tenant''s message and expected-back time, and nothing
          can be bought.'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
  states:
    loading: The language select, read by `getTenantAppStatus`.
    error: Could not load. Names which read failed and leaves the language select untouched.
    emptyFirstRun: No language select yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoAccess: '**A kiosk holds no permission and needs none** (decided by Chinmay, fix before Block
      A starts, 2 October 2026 (GFIX-4)): it sells to whoever is standing at it, and reads what the tenant
      has published like any visitor. A kiosk whose device registration is revoked goes out of service
      (KSK-014); it never shows a sign-in or names a permission.'
    offline: '**From the cached configuration.** The languages the kiosk last read stay on screen; buying
      waits for the connection.'
  apis:
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: App status and recent changes
    trigger: onLoad
  - operationId: getPublishedTenantConfig
    contract: white-label
    purpose: The published languages and branding the kiosk renders in, cached for offline (GFIX-1)
    trigger: onLoad
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P05 Guest Kiosk.dc.html#ksk-002
    derivedFrom: wireframes/reference/Kiosk Board 1.dc.html
    note: '**Drawn by Claude Design on `Kiosk Board 1.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  gaps:
  - operation: getTenantConfig
    removed: true
    why: Replaced by `getPublishedTenantConfig`, the guest read of the same data.
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
