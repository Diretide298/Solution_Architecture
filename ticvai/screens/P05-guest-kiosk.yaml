- id: KSK-007
  name: Payment
  module: Sell
  requiresModule: ticketing
  wave: 2
  capability: C00
  implementation:
    app: guest-app
    route: /sell/payment
    component: apps/guest-app/src/routes/sell/PaymentDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - KSK-001
    - KSK-002
    - KSK-003
    - KSK-008
    - KSK-009
    inferred: true
    fromFlows: true
    transitions:
    - to: KSK-008
      trigger: Payment unresolved
      carries:
      - paymentId
      provenance: derived — KSK-008 declares entryState.params paymentId and KSK-007 holds paymentId,
        so an edge into it carries them
    - to: KSK-009
      trigger: Takes the printed ticket
      provenance: flow F07 step 7→8, F75 step 5→6
      operation: createPayment
      carries:
      - orderId
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Card only. No foreign cash** — a kiosk accepting foreign notes needs a note
    reader and a per-currency float, and neither is specified. A guest paying by card in a foreign currency
    is converted by their own issuer, which is not our rate. **Card only. No foreign cash** — a kiosk
    accepting notes needs a note reader and a per-currency float, and neither is specified. Dynamic currency
    conversion by the terminal is recorded as `fxRateSource: cardScheme`, because that rate is the scheme''s
    rather than ours.


    **The guest selects the currency and pays in it** (decided 2 October 2026, Chinmay; CHG-FIN-001; reverses
    the display-only rule, CF-37 and "payment will be processed in AED", in favour of option (b) of MoM
    10 Aug 2026 4.7, DI-211). The venue lists the currencies a guest may pay in (`VenueSettings.chargeCurrencies`,
    a subset of the currencies it shows); `listFxRates` with `chargeable=true` returns them, each marked
    `chargeable`. The selected currency is sent at checkout (`checkoutCart.chargeCurrency`), the rate
    is locked on the order (`Order.chargeFxRate`, `chargeTotal`, until `chargeRateLockedUntil`), and the
    payment request goes to the payment partner in that currency. The ledger stays in the venue''s base
    currency, with the rate recorded on the order, the payment and any refund. **Refunds go back in the
    currency paid**, at the sale rate, so a full refund returns exactly what was charged. A currency the
    venue shows but does not charge is still an approximate price, marked "approx.", with "You pay in
    <base currency>" beside it. **At the kiosk:** the guest may pick a chargeable currency before paying
    by card.'
  density: touchLarge
  boardFrames:
  - Kiosk Board 1.dc.html#KSK-007
  pattern: configEditor
  patternReason: the screen declares only writes (`createPayment`) and no read of a population — it is
    settings, not a list
  purpose: Take a card, and nothing else.
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: paymentTerminal
        label: Tap, insert or scan to pay
        operation: createPayment
        notes: 'The amount due and the card terminal''s prompt. The kiosk and the terminal fill the payment
          (`createPayment`): order, tender, amount and device are never typed. Card only (F75 step 5).'
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
      - kind: primaryButton
        derived: true
        impliedBy: createPayment
        label: Create payment
        notes: The act the screen exists for.
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: createPayment
  states:
    loading: The saved payment.
    error: Could not load. Names which read failed and leaves the payment untouched.
    emptyFirstRun: No payment configured. The form opens empty and `createPayment` saves the first one;
      it says what the platform does in the meantime.
    emptyNoAccess: '**A kiosk holds no permission and needs none** (decided by Chinmay, fix before Block
      A starts, 2 October 2026 (GFIX-4)): it sells to whoever is standing at it, and reads what the tenant
      has published like any visitor. A kiosk whose device registration is revoked goes out of service
      (KSK-014); it never shows a sign-in or names a permission.'
    offline: Not available. **Card only, and card needs the acquirer**
  apis:
