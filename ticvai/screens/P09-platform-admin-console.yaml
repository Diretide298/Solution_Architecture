    emptyFirstRun: —
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `PLATFORM_CELL_MANAGE`, `PLATFORM_CELL_VIEW`, `TICKET_LOOKUP` to manage platforms; a person
      without it sees the reason and who to ask, because an empty table reads as *there is no data* and
