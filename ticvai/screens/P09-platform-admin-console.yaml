  apis:
  - operationId: getCellHealth
    contract: subscription
    purpose: from page inventory
    trigger: onLoad
  - operationId: cancelDecommission
    contract: subscription
    purpose: Halt a decommission
    trigger: onAction
  - operationId: decommissionCell
    contract: subscription
    purpose: Begin decommissioning a cell
    trigger: onAction
  - operationId: getCell
    contract: subscription
    purpose: Read a cell
    trigger: onLoad
  - operationId: getCellCapacity
    contract: subscription
    purpose: Load against headroom
    trigger: onLoad
  - operationId: listCellJobs
    contract: subscription
    purpose: Provisioning, migration and maintenance jobs
    trigger: onLoad
  - operationId: updateCellTier
    contract: subscription
    purpose: Change a cell's tier
    trigger: onAction
  - operationId: propagateCrossRegionEntitlement
    contract: cross-region
    purpose: Propagate a right from the issuing cell to a consuming cell
    trigger: onAction
  - operationId: getCrossRegionEntitlement
    contract: cross-region
    purpose: Read a redemption right
    trigger: onLoad
  - operationId: reconcileRedemptions
    contract: cross-region
    purpose: Report consumption back to the issuing cell
    trigger: onAction
  implementation:
    app: ticvai-web
    route: /general/cross-tenant-health-dashboard
    component: apps/ticvai-web/src/routes/general/CrossTenantHealthDashboard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - ADM-002
    inferred: true
    exitTo:
    - ADM-001
    - ADM-002
    - ADM-004
    fromFlows: true
  notes: 'Purpose derived from the screen name and its operations on 17 August, not from a requirement.
    **Cross-platform navigation removed 24 August**: SCN-003. **A till does not navigate to a back office
    and a guest app does not navigate to either** — those are device handovers, and a flow declares them
    with `crossesDevice` rather than a screen pretending there is a link. **Drawn 26 August** — `Dashboards
    Board` frame `adm-003`. **One board draws five dashboards across five platforms** — platform admin,
    partner, support, guest web and cross-tenant health. A dashboard is a shape rather than a domain,
    and the pack recognised that before the package did.'
  density: compact
  entryState:
    params:
    - name: cellId
      from: deepLink
    - name: rightId
      from: deepLink
    coldEntry: '**A platform-admin link resolves against the tenant in the link and refuses if the operator
      does not hold that tenant.** A link is not authorisation. If the target is gone the screen says
      so and returns to the directory — **an admin console that silently shows the wrong tenant is worse
      than one that shows nothing.** Arrives with `cellId`, `rightId`.'
  requiresModule: membership
  statesDerived: true
  boardFrames:
  - Dashboards Board.dc.html#adm-003
