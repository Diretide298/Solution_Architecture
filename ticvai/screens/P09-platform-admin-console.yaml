# P09 — Platform Admin Console
# Generated from handoff/page-inventory.md. Layout, states and purpose are TODO.
# Validated against _schema.yaml; component kinds from _components.yaml.

platform:
  code: P09
  audience: platformAdmin
  formFactor: web
  shortName: TICVAI Web
  name: TICVAI Web — Platform Console
  surface: platformAdmin
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 37
  app: ticvai-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the Control Plane
    bundleUpdate: immediate on deploy
    hosting: Control Plane, outside every cell
    storeReview: false
    deviceOwnership: platform staff device
    networkAssumption: corporate network, IP-restricted
    releaseCadence: weekly
  operator: ticvai
  wireframeBoard: wireframes/P09 TICVAI Web.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: ADM-001
  name: Platform Login / MFA
  module: TODO
  purpose: Get someone into the app, fast, on a device that may be shared.
  wave: 1
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: searchField
      - kind: dataTable
  states:
    loading: Checking the session
    emptyFirstRun: —
    emptyNoResults: '**The filter matched nothing, and the data is still there.** The action widens
      or clears it — distinct from first run, which has nothing to match, and **a screen that shows
      the same panel for both sends somebody looking for data they already filtered out.**'
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `SESSION_FORCE_LOGOUT` to use sessions; a person without it sees the reason and who to ask,
      because an empty table reads as *there is no data* and sends somebody to support with the wrong
      question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.'
    error: Sign-in failed. Wrong credentials read differently from an unreachable directory
  wireframe:
    status: generated
    board: wireframes/P09 TICVAI Web.dc.html#adm-001
  capability: C35
  apis:
  - operationId: login
    contract: identity
    purpose: from page inventory
    trigger: onLoad
  - operationId: forceLogout
    contract: identity
    purpose: Supervisor termination of an abandoned session
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: getGuestSession
    contract: identity
    purpose: Read the current guest session
    trigger: onLoad
  - operationId: listActiveSessions
    contract: identity
    purpose: List active sessions
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  - operationId: revokeAllSessions
    contract: identity
    purpose: Revoke every session in scope
    trigger: onAction
  implementation:
    app: ticvai-web
    route: /general/platform-login-mfa
    component: apps/ticvai-web/src/routes/general/PlatformLoginMfaList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - ADM-002
    inferred: true
    exitTo:
    - ADM-002
    - ADM-003
    - ADM-004
  notes: Purpose derived from the screen name and its operations on 17 August, not from a requirement.
  density: compact
  entryState:
    params:
    - name: sessionId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
  requiresModule: core
  statesDerived: true
- id: ADM-002
  name: Platform Dashboard
  module: TODO
  purpose: The screen this app sits on. Everything else is entered from here and returns to it.
  wave: 1
  layout:
    template: dashboard
    regions:
    - name: contentBody
      components:
      - kind: metricTile
      - kind: chart
  states:
    loading: Tiles skeleton; tenant count first
    emptyFirstRun: No tenants yet — a new installation, not an error
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `PLATFORM_CELL_VIEW`, `PLATFORM_TENANT_VIEW`, `USER_MANAGE` to read platforms; a person
      without it sees the reason and who to ask, because an empty table reads as *there is no data*
      and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `membership` is not licensed.** The tenant has not bought this module, which
      is a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Each tile fails independently. **One dead cell must not blank the console that manages it**
  wireframe:
    status: designed
    board: wireframes/Dashboards Board.dc.html#adm-002
    generatedFallback: wireframes/P09 TICVAI Web.dc.html#adm-002
  capability: C95
  apis:
  - operationId: listTenants
    contract: subscription
    purpose: from page inventory
    trigger: onLoad
  - operationId: getEntitlementUsage
    contract: subscription
    purpose: Usage against licensed limits
    trigger: onLoad
  - operationId: getSsoConfig
    contract: identity
    purpose: Read SSO configuration
    trigger: onLoad
  - operationId: getTenant
    contract: subscription
    purpose: Read a tenant with cells and subscription
    trigger: onLoad
  - operationId: getTenantLicences
    contract: subscription
    purpose: What a tenant is licensed to use
    trigger: onLoad
  - operationId: listTenantCells
    contract: subscription
    purpose: List a tenant's cells
    trigger: onLoad
  implementation:
    app: ticvai-web
    route: /general/platform-dashboard
    component: apps/ticvai-web/src/routes/general/PlatformDashboard.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    exitTo:
    - ADM-001
    - ADM-003
    - ADM-004
    - ADM-005
    - ADM-006
    - ADM-007
    - ADM-008
    - ADM-012
    inferred: true
  notes: 'Purpose derived from the screen name and its operations on 17 August, not from a requirement.
    **Removed 24 August**: generateInvoice, getSubscription, getUsageMetering, listSubscriptionInvoices,
    previewSubscriptionChange, setSubscription. **Eleven P09 screens carried the same nine subscription
    operations** — a platform dashboard, a tenant directory and a rate-limit console all able to preview
    a subscription change. **Bulk-attach residue at platform scale**, and each screen now keeps only
    what it is for. **Removed 24 August**: addLicenceAddOn, createTenant, provisionCell, reactivateTenant,
    removeLicenceAddOn, setSsoConfig, suspendTenant, terminateTenant, updateTenant. **`ADM-015 API Rate
    Limit & Quota Management` could create and terminate tenants.** The 18 August bulk attach reached
    the platform console too — provisioning, licensing and SSO were on every screen that mentioned a
    tenant. **Drawn 26 August** — `Dashboards Board` frame `adm-002`. **One board draws five dashboards
    across five platforms** — platform admin, partner, support, guest web and cross-tenant health. A
    dashboard is a shape rather than a domain, and the pack recognised that before the package did.'
  density: compact
  entryState:
    params:
    - name: tenantId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
  requiresModule: membership
  statesDerived: true
  boardFrames:
  - adm-002
