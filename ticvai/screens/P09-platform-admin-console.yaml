- id: ADM-318
  name: Dead Letters
  module: Platform Ops
  purpose: Every event the platform gave up on, and the act that puts it back. A dead letter is work the
    platform accepted and did not do.
  capability: C00
  wave: 1
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: dataTable
        derived: true
        impliedBy: listDeadLetters
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, and this
          table is written by the retry path while it is read. **Filtered by consumer and by age** - 47
          consumers declare `retryThenDeadLetter` and all 47 are `isCritical`, so an unfiltered list is
          47 different problems wearing one shape.'
      - kind: primaryButton
        derived: true
        impliedBy: replayDeadLetter
        label: Replay
        notes: '**The act the screen exists for.** Replay is idempotent at the consumer; the screen still
          confirms, because a replay of a payment event is not a refresh.'
  apis:
  - operationId: listDeadLetters
    contract: platform-ops
    purpose: Events the retry path gave up on
    trigger: onLoad
  - operationId: replayDeadLetter
    contract: platform-ops
    purpose: Put one back on the queue
    trigger: onAction
  states:
    loading: Dead letters newest first, with the consumer and the age of each
    emptyFirstRun: '**Nothing has been dead-lettered.** The correct state and the one this screen should
      almost always be in — said as *nothing failed*, never as an empty table, because the two read identically
      and mean the opposite.'
    emptyNoResults: Nothing matches the current filters. **The filters are named and clearable from here**
      — an empty list with the filter state hidden elsewhere is a person who concludes the queue is clear
      when it is not.
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `PLATFORM_OPERATE`; a person without it sees the reason and who to ask, because an empty table
      here reads as *nothing has failed* — the most dangerous possible misreading.


      **Authority is carried by the person, not the device** (ADR-0002).'
    error: '**Could not load. Replay is blocked.** A replay issued against a list that failed to load
      is a replay against an unknown row.'
  navigation:
    exitTo:
    - ADM-001
    inferred: false
    entryFrom:
    - ADM-002
    notes: '**Reached from ADM-002** — a top-level console section. Stated on 4 September: this screen
      exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
  implementation:
    app: ticvai-web
    route: /platform/dead-letters
    component: apps/ticvai-web/src/routes/DeadLetters.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P09 TICVAI Web.dc.html#adm-318
  notes: 'Added 4 September. **47 consumers declare `retryThenDeadLetter` and all 47 are marked `isCritical`,
    and until this screen existed nothing in the package read the table they land in.** Deliberately not
    DEV-005 Webhooks: `replayEvents` is partner-facing redelivery of a customer''s own integration, and
    handling a platform failure as a customer integration question is how it stays unfixed.'
  density: compact
  statesDerived: true
  requiresModule: core
  entryState:
    params:
    - name: deadLetterId
      from: deepLink
    coldEntry: '**The ordinary path is a row on this screen**, and `replayDeadLetter` takes the id from
      the row the operator chose. A deep link is how an alert reaches one directly; if that id is already
      replayed or gone the screen says so and shows the list, because a replay issued against a row nobody
      can see is a replay nobody can account for.'
