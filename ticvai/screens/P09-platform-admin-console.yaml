- id: ADM-007
  name: Module & Feature Entitlement
  module: Tenants & Licensing
  purpose: See module & feature entitlement for this venue.
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
      - kind: primaryButton
        derived: true
        impliedBy: addLicenceAddOn
        label: Add licence add on
        notes: The act the screen exists for.
      - kind: dataTable
        derived: true
        impliedBy: listTenantCells
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
      - kind: destructiveButton
        derived: true
        impliedBy: removeLicenceAddOn
        notes: '**Always confirms, never the default focus.** The consequence goes in the body — *cancel
          3 orders worth AED 480* is a confirmation, *are you sure* is not.'
        label: Remove licence add on
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: addLicenceAddOn
      - kind: confirmDialog
        derived: true
        label: Confirm
        notes: '**The consequence goes in the body, not the title.** *Cancel 3 orders worth AED 480* is
          a confirmation; *are you sure* is not — and a dialog that cannot name what it destroys is a
          dialog somebody dismisses.


          **Added 31 August.** `confirmDialog` and `modal` were both in the component library and used
          **zero times across 492 screens**, while `destructiveButton` was used 39 times and its own entry
          reads *always requires confirmation*.'
  states:
    loading: Entitlements resolve against the plan
    emptyFirstRun: All modules enabled — the maximum plan
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `PLATFORM_CELL_VIEW`, `PLATFORM_TENANT_MANAGE`, `PLATFORM_TENANT_VIEW` and 1 more to read
      platforms; a person without it sees the reason and who to ask, because an empty table reads as *there
      is no data* and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the same
      terminal is the way through.


      **Also reached when `membership` is not licensed.** The tenant has not bought this module, which
      is a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Could not resolve. **Editing is blocked**, because saving against an unknown current state
      overwrites what nobody read
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from here**
      — an empty list with the filter state hidden elsewhere is a person who thinks the data is gone.
      **Added 25 August with the derived list component**: a screen that lists has to say what it shows
      when the list is empty, and this screen gained the list before it gained the sentence.'
