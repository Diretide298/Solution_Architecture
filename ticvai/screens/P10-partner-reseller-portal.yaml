      from a filter that matched nothing.
    emptyNoResults: Nothing matches the filter on principalId, roleId and the sub-agent are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: 'Shown when the caller lacks `PERMISSION_VIEW`, which `listDelegatedAccess` requires
      to show this screen, and names that permission. **Never an empty table** — that reads as *there
      is no data* and sends somebody to support with the wrong question. A caller who can see the screen
      but lacks what an action needs sees that action disabled, naming its permission: `PERMISSION_GRANT`
      for `createDelegatedAccess`, `deleteDelegatedAccess`.'
