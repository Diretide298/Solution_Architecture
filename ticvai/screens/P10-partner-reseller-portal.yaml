  notes: States derived from the screen pattern on 17 August, not individually considered — sound for
    a list, a form or a money screen, and worth revisiting where this screen is unusual. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **createRefund removed
    18 August** — attached by module resemblance, not by what this screen does. A screen that does not
    handle money should not be able to move it (CF-87's class). **Drawn 26 August** — `Dashboards Board`
    frame `ptr-002`. **One board draws five dashboards across five platforms** — platform admin, partner,
    support, guest web and cross-tenant health. A dashboard is a shape rather than a domain, and the pack
    recognised that before the package did.
  density: compact
  boardFrames:
  - Dashboards Board.dc.html#ptr-002
  pattern: listDetail
  patternReason: '`listOrders` reads the population and `getB2bCredit` reads one of them — list, select,
    act'
  purpose: See the partner's credit position and bookings at a glance, and start from here.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Venue id
        operation: listOrders
        notes: Sends `?venueId=` to `listOrders`.
        provenance: contract orders.yaml GET /orders
      - kind: textField
        label: Principal id
        operation: listOrders
        notes: Sends `?principalId=` to `listOrders`.
        provenance: contract orders.yaml GET /orders
      - kind: textField
        label: Shift id
        operation: listOrders
        notes: Sends `?shiftId=` to `listOrders`.
        provenance: contract orders.yaml GET /orders
      - kind: textField
        label: Status
        operation: listOrders
        notes: Sends `?status=` to `listOrders`.
        provenance: contract orders.yaml GET /orders
      - kind: datePicker
        label: Created from
        operation: listOrders
        notes: Sends `?createdFrom=` to `listOrders`.
        provenance: contract orders.yaml GET /orders
      - kind: datePicker
        label: Created to
        operation: listOrders
        notes: Sends `?createdTo=` to `listOrders`.
        provenance: contract orders.yaml GET /orders
      - kind: dataTable
        label: Every order
        bindsTo: OrderSummary
        columns:
        - OrderSummary.id
        - OrderSummary.orderNumber
        - OrderSummary.status
        - OrderSummary.grossAmount
        - OrderSummary.refundedAmount
        - OrderSummary.channel
        - OrderSummary.lineCount
        operation: listOrders
        provenance: contract orders.yaml GET /orders
      - kind: dataTable
        label: Every refund
        bindsTo: Refund
        columns:
        - Refund.fxRate
        - Refund.settleTo
        - Refund.fxVariance
        - Refund.amount
        - Refund.appliedPercentage
        - Refund.status
        operation: listOrderRefunds
        provenance: contract orders.yaml GET /orders/{orderId}/refunds
    - name: contextPanel
