  - id: formUpdateReport
    component: modal
    trigger: Save report
    body: '**Collects what `updateReport` sends before it is called.** Required: `name`, `category`, `dataSource`,
      `columns`, `requiredPermission`. Optional: `description`, `filters`, `groupBy`, `parameters`, `maxDateRangeDays`.
      Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: CreateReportRequest
    confirm:
