        provenance: contract operation approvePartnerStatuLifecycle
        permission: Approve
      - kind: banner
        label: Permissions this screen separates
        notes: '**The pack separates these permissions and no action on the screen claims them yet:**
          Activate, Restrict, Suspend, Reactivate, Terminate, Archive. Each needs attaching to the control
          it gates, or the screen needs the control.'
        provenance: pack B2B, Reseller & OTA Partner Management_Reference.pdf, page 18 §Authorized users
          can
      - kind: textField
        label: Authentication code
        operation: verifyMfaChallenge
        notes: 'Asked in place inside the Approve confirmation, because `approvePartnerStatuLifecycle`
          needs a fresh step-up token (`x-ticvai-step-up: mfa`); its result is the `stepUpToken`. Five
          wrong codes lock step-up for the lockout minutes (audit R126).'
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: secondaryButton
        label: Email me a code instead
        operation: createMfaChallenge
        notes: Opens the step-up challenge for Approve; the emailed code is the fallback to the authenticator
          app (audit R126 (5)).
        provenance: contract identity.yaml POST /auth/mfa/challenge
