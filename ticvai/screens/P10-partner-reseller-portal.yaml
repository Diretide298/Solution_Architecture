  notes: '**Rebuilt as a sign-in form on 2 October 2026 (CHG-DOOR-002/003; Chinmay, 2 October 2026: fix
    the Block A blockers now).** It was generated as a list over active sessions, MFA methods and SSO
    providers with Force logout and Revoke all sessions on the door, which a person who is not yet signed
    in can never use (platform-foundation process notes). The sequence is the same on every staff and
    partner door: credentials (or the organisation''s SSO) -> the authentication code only when a permission
    demands it (R135) -> the role prompt when several roles are held (ADR-0003) -> the landing. Managing
    sessions moved to the staff directory (BO-053); managing MFA methods stays on each app''s own security
    or profile screen. **The credit operations left the door** (getB2bCredit, setB2bCreditLimit, overrideCreditLimit,
    listPartnerAgreements): the partner reads credit on PTR-002 and PTR-013, and setting or overriding
    a limit is the tenant''s act, not the partner''s.'
  density: compact
  pattern: form
  patternReason: 'A sign-in: two fields, the organisation''s SSO where configured, and the second-factor
    and role steps in place - a form, not a list to browse.'
  purpose: 'Get a partner user (reseller, OTA, developer) into the partner portal: username and password
    or the tenant''s SSO, the second factor only for a listed permission, then the partner home with the
    allocation and credit.'
  layout:
    template: form
    regions:
    - name: contentBody
      slot: form
      components:
      - kind: textField
        label: Email or username
        notes: Goes into `LoginRequest.username`.
      - kind: textField
        label: Password
        notes: 'Goes into `LoginRequest.credential` with `method: password`. Minimum 8, show/hide. **No
          workstation is sent: a browser is not a registered device** (CHG-DOOR-001), and no PIN is offered,
          because a PIN is bounded by a device this door does not have.'
      - kind: primaryButton
        label: Sign in
        operation: login
        notes: 'Sends `LoginRequest`. 409 means this person already holds a session elsewhere (audit R184):
          the screen says where and since when, and that only a holder of SESSION_FORCE_LOGOUT can end
          it; signing in never ends the other session.'
        provenance: contract identity.yaml POST /auth/login
      - kind: cardList
        label: Sign in with your organisation
        bindsTo: SsoProvider
        columns:
        - SsoProvider.displayName
        - SsoProvider.protocol
        - SsoProvider.isEnforced
        operation: listSsoProviders
        notes: One button per identity provider the tenant configured for partners; **absent, not disabled,
          when there is none.** Read before sign-in, unauthenticated. When a provider `isEnforced` for
          this person, the password field is hidden and only this remains.
        provenance: contract identity.yaml GET /auth/sso/providers
      - kind: secondaryButton
        label: Continue with your organisation
        operation: startSsoAuthorization
        notes: Hands off to the identity provider with this door's `redirectUri`; nothing is typed here.
          Staff and partner doors only, never a guest door (audit R167).
        provenance: contract identity.yaml GET /auth/sso/{providerId}/authorize
      - kind: progressIndicator
        label: Finishing sign-in with your organisation
        operation: completeSsoAuthorization
        notes: 'On the provider''s redirect back (`code` and `state` from the redirect, never typed).
          Returns the same `LoginResponse` as `login`, so the second factor and the role prompt follow
          exactly as below. 403: the provider proved who this is and no group maps to a role in this tenant,
          which grants nothing.'
        provenance: contract identity.yaml POST /auth/sso/{providerId}/callback
    - name: secondFactor
      slot: form
      components:
      - kind: textField
        label: Authentication code
        operation: verifyMfaChallenge
        notes: 'Shown only when the sign-in comes back `requiresMfa`: the person holds a permission in
          `PasswordPolicy.mfaRequiredForPermissions` (ROLE_MANAGE, LEDGER_APPROVE, every PLATFORM_* permission,
          or one the tenant added; audit R135). Six digits from the authenticator app.'
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: primaryButton
        label: Verify
        operation: verifyMfaChallenge
        notes: Completes the sign-in; the session is usable only after it. Five wrong codes lock step-up
          for the policy's lockout minutes, never permanently (audit R126 (6)), and the screen says until
          when.
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: secondaryButton
        label: Email me a code instead
        operation: createMfaChallenge
        notes: '`action: signIn`. The authenticator app is the primary method and an emailed code the
          fallback (audit R126 (5)).'
        provenance: contract identity.yaml POST /auth/mfa/challenge
      - kind: secondaryButton
        label: Set up the authenticator app
        operation: enrolMfaMethod
        notes: 'Only when the sign-in comes back `requiresMfa` with `hasMfaMethod: false`: the first method
          is enrolled here before anything else (audit R135). Authenticator app (`totp`) or email (`emailOtp`)
          only; the secret as QR and text.'
        provenance: contract identity.yaml POST /auth/mfa/methods
      - kind: credentialDisplay
        label: Recovery codes
        operation: verifyMfaEnrolment
        notes: The method is active once its first code is verified. Recovery codes are shown once, with
          copy and download, and never again.
        provenance: contract identity.yaml POST /auth/mfa/methods/{methodId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: banner
        label: Signed in as
        operation: getCurrentSession
        notes: 'Read once the sign-in is complete (after the code and the role, where asked): the person''s
          name and role, then straight on. A partner user lands on the partner home (PTR-002), which shows
          the allocation and credit; credit details live on PTR-013.'
        provenance: contract identity.yaml GET /auth/session
      - kind: secondaryButton
        label: Choose role
        operation: selectRole
        notes: 'Only when `LoginResponse.requiresRoleSelection` is true: large role buttons, one per role
          the person holds (ADR-0003). One role goes straight in. A partner user lands on the partner
          home (PTR-002), which shows the allocation and credit; credit details live on PTR-013.'
        provenance: contract identity.yaml POST /auth/select-role
      - kind: textField
        label: New password
        operation: changeOwnCredential
        notes: 'Only when the credential was reset and is temporary: a new one is set before anything
          else, twice, and the last five cannot be reused (audit R132).'
        provenance: contract identity.yaml POST /auth/credential
  states:
    loading: Checking the credential. The form stays visible and disabled.
    emptyFirstRun: '**Nobody signed in** - the normal state of a door. The form offers username and password
      and, where the tenant configured one for partners, its SSO.'
    error: Identity could not be reached. **Says so rather than saying the password is wrong**, and keeps
      what was typed.
    denied: The credential does not match, or the account is locked. One message for both, with the attempts
      left before the lock; a locked account says when to try again.
    emptyNoAccess: Signed in, and the person holds no role in this app. Says who at the tenant grants
      access; distinct from a wrong password. A door has no permission of its own to name, because the
      person is not signed in until it succeeds.
    emptyNoResults: 'Never shown: `listSsoProviders` takes no filter; a tenant with no identity provider
      shows no SSO buttons at all, and the form is the whole door.'
    sessionHeld: '`login` answered 409: this person already holds a session elsewhere (audit R184, ADR-0004).
      Says where and since when; only a holder of SESSION_FORCE_LOGOUT ends it, on the staff directory
      (BO-053), and signing in never ends it by itself.'
    mfaRequired: '**Signed in, not yet through.** The principal holds a permission that requires MFA (ROLE_MANAGE,
      LEDGER_APPROVE, any PLATFORM_* permission, or one the tenant added), so the screen calls `createMfaChallenge`
      (`action: signIn`) and asks for the authentication code; `verifyMfaChallenge` completes the sign-in.
      **Email me a code instead** is the fallback. Five wrong codes lock step-up for the policy''s lockout
      minutes and the screen says until when (audit R135, R126). A person without such a permission never
      reaches this state.'
    mfaEnrolmentRequired: '**First sign-in, no method yet.** A person who requires MFA and has no active
      method enrols the authenticator app (email as the fallback) with `enrolMfaMethod`, confirms it with
      the first code (`verifyMfaEnrolment`), sees the recovery codes once, then continues to the code
      step (audit R135, R126 (5)).'
    offline: 'Not available, and the offline banner says why: signing in needs a connection.'
  apis:
  - operationId: login
    contract: identity
    purpose: Authenticate from a browser, with no workstation (CHG-DOOR-001)
    trigger: onAction
  - operationId: listSsoProviders
    contract: identity
    purpose: Which identity providers this door offers; unauthenticated, read before sign-in
    trigger: onLoad
  - operationId: startSsoAuthorization
    contract: identity
    purpose: Hand off to the identity provider where the tenant has SSO
    trigger: onAction
  - operationId: completeSsoAuthorization
    contract: identity
    purpose: Exchange the provider's code for the same LoginResponse as login, on the redirect back
    trigger: background
  - operationId: createMfaChallenge
    contract: identity
    purpose: Second factor after sign-in when the principal holds a permission in mfaRequiredForPermissions;
      action `signIn`, the authenticator app, or the email method as the fallback (audit R135, R126 (5))
    trigger: onAction
  - operationId: verifyMfaChallenge
    contract: identity
    purpose: Completes sign-in with the code; the session is usable only after it. Five wrong codes lock
      step-up (audit R126 (6))
    trigger: onAction
  - operationId: enrolMfaMethod
    contract: identity
    purpose: 'The first method, at a first sign-in that requires one: authenticator app, or email as the
      fallback (audit R135, R126 (5))'
    trigger: onAction
  - operationId: verifyMfaEnrolment
    contract: identity
    purpose: Activates the enrolled method with its first code; recovery codes shown once
    trigger: onAction
  - operationId: selectRole
    contract: identity
    purpose: Choose which role to work as when sign-in returns more than one (ADR-0003)
    trigger: onAction
  - operationId: changeOwnCredential
    contract: identity
    purpose: Replace a temporary password or PIN at the first sign-in after a reset (audit R132)
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Read the session the sign-in just opened, for the landing
    trigger: onAction
  entryState:
    params:
    - name: challengeId
      from: navigation
    - name: providerId
      from: deepLink
      optional: true
    - name: methodId
      from: navigation
    coldEntry: '**Needs nothing; that is what makes it the door.** No workstation travels with a browser
      sign-in (CHG-DOOR-001). `providerId` arrives only on the identity provider''s redirect back, with
      the `code` and `state` that `completeSsoAuthorization` exchanges; an expired or replayed redirect
      lands on the form with "That sign-in link has expired; sign in again".'
  apisNote: 'Declared by hand on 2 October 2026 (CHG-DOOR-002/003): sign-in, SSO, the second factor and
    its first enrolment, the role prompt, a temporary credential''s replacement and the session read for
    the landing. Nothing that needs a signed-in session to list or end sessions is here.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P10 Partner Web.dc.html#ptr-001
  gaps:
  - operation: getB2bCredit
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): A sign-in door shows no credit and no agreements: the
      credit read and the limit writes (getB2bCredit, setB2bCreditLimit, overrideCreditLimit) belong to
      the partner''s credit screens (PTR-002, PTR-013), and setting or overriding a limit is the tenant''s
      act, not the partner''s; partner agreements live on the agreement screens. The accountId entry parameter
      existed only for the credit calls. F10 step 1 now reads credit on the dashboard (design-notes correction
      platform-foundation PTR-001).'
    source: screens/P10-partner-reseller-portal.yaml#PTR-001; contracts/spine/orders.yaml#overrideCreditLimit
  - operation: listPartnerAgreements
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): A sign-in door shows no credit and no agreements: the
      credit read and the limit writes (getB2bCredit, setB2bCreditLimit, overrideCreditLimit) belong to
      the partner''s credit screens (PTR-002, PTR-013), and setting or overriding a limit is the tenant''s
      act, not the partner''s; partner agreements live on the agreement screens. The accountId entry parameter
      existed only for the credit calls. F10 step 1 now reads credit on the dashboard (design-notes correction
      platform-foundation PTR-001).'
    source: screens/P10-partner-reseller-portal.yaml#PTR-001; contracts/spine/orders.yaml#overrideCreditLimit
  - operation: overrideCreditLimit
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): A sign-in door shows no credit and no agreements: the
      credit read and the limit writes (getB2bCredit, setB2bCreditLimit, overrideCreditLimit) belong to
      the partner''s credit screens (PTR-002, PTR-013), and setting or overriding a limit is the tenant''s
      act, not the partner''s; partner agreements live on the agreement screens. The accountId entry parameter
      existed only for the credit calls. F10 step 1 now reads credit on the dashboard (design-notes correction
      platform-foundation PTR-001).'
    source: screens/P10-partner-reseller-portal.yaml#PTR-001; contracts/spine/orders.yaml#overrideCreditLimit
  - operation: setB2bCreditLimit
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): A sign-in door shows no credit and no agreements: the
      credit read and the limit writes (getB2bCredit, setB2bCreditLimit, overrideCreditLimit) belong to
      the partner''s credit screens (PTR-002, PTR-013), and setting or overriding a limit is the tenant''s
      act, not the partner''s; partner agreements live on the agreement screens. The accountId entry parameter
      existed only for the credit calls. F10 step 1 now reads credit on the dashboard (design-notes correction
      platform-foundation PTR-001).'
    source: screens/P10-partner-reseller-portal.yaml#PTR-001; contracts/spine/orders.yaml#overrideCreditLimit
