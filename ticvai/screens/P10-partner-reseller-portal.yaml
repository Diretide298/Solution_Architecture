    body: '**Names what `revokeApiCredential` changes and what it leaves alone**, in the consequence rather
      than the verb. A api credentials integration this affects should be identified in the dialog, not
      just counted.'
    provenance: contract public-api.yaml DELETE /api-clients/{clientId}/credentials
  - id: formCreateApiClient
    component: modal
    trigger: Create API client
    body: '**Collects what `createApiClient` sends before it is called.** The person enters `name`, picks
      `scopes` and an optional `ipAllowList`. **The environment is sandbox**: production clients are issued
      by TICVAI after certification (DI-927); `developerId` comes from the session; `clientId` and `lastUsedAt`
      are the server''s. Never `id` or `status`: an id is a client UUIDv7 generated silently and the status
      and timestamps are the server''s (design-notes correction, CHG-SOT-015). Dismissing sends nothing;
      the screen behind is unchanged.'
