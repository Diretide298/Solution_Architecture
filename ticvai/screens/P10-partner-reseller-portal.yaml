    from the screen name and its operations on 17 August, not from a requirement. **Licensed on `developerApi`,
    not on `partner`.** The partner licence is what puts a partner on this portal at all; this screen's
    whole function is the developer API, and without that licence there is nothing on it to show. Declared
    `partner` it warned as a two-licence page, which is exactly the drift the rule exists to catch.
  openQuestions:
  - Blocked — Developer & API workshop
