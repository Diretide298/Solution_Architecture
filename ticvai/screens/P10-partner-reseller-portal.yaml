    component: modal
    trigger: Request production access
    body: '**Collects what `requestProductionAccess` sends before it is called.** Required: `listingId`
      (a certified integration), `scopes`, `allowedTenantIds`, `ipAllowList` (at least one address, M17-07).
      Optional: `note`. The form says that a new production key is issued and the sandbox key stays a
