        label: Every API client
        bindsTo: ApiClient
        columns:
        - ApiClient.name
        - ApiClient.environment
        - ApiClient.scopes
        - ApiClient.ipAllowList
        - ApiClient.status
        - ApiClient.lastUsedAt
        operation: listApiClients
        provenance: contract public-api.yaml GET /api-clients
        notes: Name, environment, scopes, IP allow-list, status and last used; the client id is in the
          detail panel with a copy action, allowed tenants by venue name.
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected API client
