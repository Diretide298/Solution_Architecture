  name: Partner Dashboard
  module: Overview
  requiresModule: partner
  wave: 2
  capability: C34
  implementation:
    app: partner-web
    route: /general/partner-dashboard
    component: apps/partner-web/src/routes/general/PartnerDashboard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - PTR-001
    inferred: true
    exitTo:
    - PTR-001
    - PTR-003
    - PTR-007
    - PTR-008
    flowDerived: true
    transitions:
    - to: PTR-007
      trigger: Searches availability
      provenance: flow F03 step 1→2
      operation: getB2bCredit
    - to: PTR-001
      trigger: Partner Login / MFA
      provenance: 'derived — PTR-001 declares entryState.params challengeId, methodId, providerId and
