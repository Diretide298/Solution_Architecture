    on 17 August, not from a requirement. Wishlist. **Device operations removed** — Sanket flagged that
    no device management appears on this screen, and he was right. **Rewired on the 20 August review.**


    **Rev 3 (decided 29 September, rev 3 GAP-D3).** Built as one implementation with WEB-024 (the account''s
