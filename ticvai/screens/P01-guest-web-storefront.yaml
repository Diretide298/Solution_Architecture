    trigger: onLoad
    provenance: decided 29 September 2026, W12
  - operationId: getMyProfile
    contract: marketing-crm
    purpose: Prefill the buyer's contact from their own profile
    trigger: onLoad
  - operationId: extendSeatHold
    contract: seating
    purpose: Extend the seat hold once, from the warning before it lapses
    trigger: onAction
    provenance: design cross-check, 3 October 2026 (CHG-R1S-023)
  entryState:
    params:
    - name: subjectId
      from: session
    - name: cartId
      from: session
    - name: venueId
      from: session
    - name: holdId
      from: navigation
      optional: true
      notes: 'Optional: only `extendSeatHold` takes it, from the record the user acts on.'
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
