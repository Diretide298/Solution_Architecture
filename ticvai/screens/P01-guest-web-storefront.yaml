        label: Create resale listing
        operation: createResaleListing
        provenance: contract orders.yaml POST /resale-listings
  states:
    loading: The ticket transfer list.
    error: Could not load. Names which read failed and leaves the ticket transfer untouched.
    emptyFirstRun: No ticket transfer yet. Offers Create resale listing (`createResaleListing`); distinct
      from a filter that matched nothing.
    emptyNoResults: Nothing matches the filter on venueId, principalId, shiftId, status, createdFrom,
      createdTo and the ticket transfer are still there. Names the active filter and offers to clear it.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** Sending, claiming and listing for resale need the connection
