      match: partial
      view: Engine controls → Theme park → Multi-park combo → Book → Fri → 2 park ticket → three adults
        (the counters take the 2 park ticket's price; one cart line)
      differences: 'Ticket choice is on the same step as date and time and comes last: ''Date → time →
        ticket'' (Config ''Performance reveal'', Rev 3 item 2), whereas YAML goes WEB-005 → WEB-006. Prototype
        adds category → subcategory browsing, info-only (not bookable) products, ''Help me choose'' questions,
        location switcher (''Booking at'' bar), quick tour. Promo codes are entered in the cart, not on
        this step (YAML keeps evaluatePromotions here). 30 September: the guest counters take their price
        from the ticket chosen (2 park ticket, three adults: one line, AED 1,425), and Group / school
        booking starts from four group tickets with a typed headcount. The same flow''s Read more panel
        still prices guests at single-park rates (Adult AED 325, Infant AED 475): a prototype defect;
        the counters on the page are the reference. **Do not copy the Read more panel''s prices on the
        multi-park flow** (Adult AED 325, Infant AED 475 are single-park rates): a prototype defect; the
        counters on the page are the reference (CHG-SGU-020).'
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: helpMeChoose
    component: modal
    trigger: Help me choose (the button, the banner, or once on first arrival when the mode is popupOnArrival)
    body: '**One or two questions, three answers each** (title, one-liner, icon, optional badge), from
      the published `GuidedChoice`. The answer to the last question opens its target through a result
      card: a product (this step with that product), a product category (its tiles), an event (WEB-006)
      or a module. **Start over** returns to the first question. Nothing is sent to the server; the guest''s
      answers stay on the device (decided 29 September, rev 3 REV3-11).'
    bindsTo: GuidedChoice
    confirm:
      label: Show me
    dismiss:
      label: Close
      discards:
      - answers
    provenance: client-verified
  - id: quickTour
    component: modal
    trigger: First booking visit on this device, or Quick tour
    body: '**Four coach marks** over date, time, tickets and basket, with Back, Next and End tour. Shown
      once per device (the flag is kept on the device only) and replayable from Quick tour; only when
      `BookingFlowConfig.quickTour` is on (decided 29 September, rev 3 REV3-20).'
    dismiss:
      label: End tour
      discards: []
    provenance: client-verified
  notes: '**Rev 3 (decided 29 September).** **Order (REV3-2):** in the dated flow the guest picks the
    date, then the time (WEB-006), then tickets here: tickets stay hidden until a time is picked and Continue
    stays off until both are chosen, per `BookingFlowConfig.performanceReveal` (`dateTimeTicket` default,
    `allAtOnce` shows all). The two steps may render as one staged page. This screen may also render as
    a side panel on WEB-002 and WEB-004 (23SEP-5). **Sign-in (REV3-3):** with `signInAt` `afterAddOns`
    (default) the sign-in or guest code is asked when the guest leaves Add-ons (WEB-008), or on Continue
    here when the booking has no add-ons step; `atPayment` asks at WEB-012. The basket is kept either
    way. **Filters:** categories (REV3-16), experience and level (REV3-19). **Info-only** products show
    their label and open details (REV3-14). **Help me choose** (REV3-11) is a region and a pop-up of this
    step, not a screen of its own: the prototype draws it as a dialog over the booking step with a banner
    under the products. **Quick tour** (REV3-20). **Cart (REV3-10):** `cartLayout` may be `floatingIcon`,
    a round basket button with the count that opens the cart; the cart stays on the right in Arabic unless
    `cartSideInRtl` is `mirror`. Card layout, size and density are enums (DG-6). Every booking-flow setting
    named here is read from `getPublishedTenantConfig` `bookingFlow`, resolved for the venue the guest
    picked (audit R267): the tenant''s values with that venue''s `venueOverrides` entry laid over field
    by field (decided 29 September, rev 3 CFG-11).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getPublishedTenantConfig`
    `bookingFlow`.


    **29 September.** W4: Help me choose filters. W8: in a product-first flow (workshop) this step comes
    first and the date follows. W5: surf levels appear only after a time slot.

    **30 September (client feedback, CLIENT-RESPONSE-30SEP 1 and 2).** **Guest counters take the chosen
    ticket''s prices:** the guest types (adult, child, senior, infant) are the chosen product''s variants
    and are priced from it (`listProductVariants`), so *2 park ticket* with three adults is one line,
    *2 park ticket · Adult × 3*, never a ticket line plus a separate adult line; child and senior follow
    the chosen ticket, and an infant stays free where the ticket says so. **Group and school booking starts
    from the group tickets** (in the client build: School, Corporate, Tour operator and Community), each
    card with its per-person price and minimum group size, then **How many people** as a number box the
    guest can type into (for example 45) or step with − and + (the app adds a +10 step); there is no Group
    size dropdown. The estimate reads *<ticket> · Guests × <n>*, and the request is `requestGroupBooking`
    with the group ticket as `packageProductId` and the headcount as `expectedSize`. Supervisors listed
    separately and free, and a water-park group choosing a session, are not in the contract yet (questions
    of 1 October).'
- id: WEB-006
  name: Date & Performance Selection
