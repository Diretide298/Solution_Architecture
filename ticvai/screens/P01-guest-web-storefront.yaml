    body: '**The venue''s consent questions for this booking**, e.g. *Are you able to swim?*, *Do you
      hold a scuba certification?*, *I accept the risk*: one or several, in the order `Cart.consentQuestions`
      gives (the booking flow''s `BookingFlowConfig.consentQuestionIds` and every cart product''s `consentQuestionIds`,
      each question once). A question asked **per person** is asked for each member of the party; one
      asked **per booking** once. Themed as the prototype''s pop-up (Yes / No, Next). Next sends the answers
      to `recordConsentAnswers`, which stores each as a consent record (question version, answer, who
