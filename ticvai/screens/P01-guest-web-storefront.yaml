      verified: 2026-09-28
      match: partial
      view: Account → 'Reviews & feedback'
      differences: List of visits to rate with toast actions; no rating form or survey questions are drawn.
  apisNote: 'Rebuilt 9 September 2026 from the 1 operation this screen declares, not from a workshop pack
    — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formRaiseMyCase
    component: modal
    trigger: Report a problem
    body: A short summary and the detail of the problem; the visit is the one chosen above.
    confirm:
      label: Report a problem
      operation: raiseMyCase
    dismiss:
      label: Cancel
    provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
  entryState:
    params:
    - name: formId
      from: deepLink
      optional: true
