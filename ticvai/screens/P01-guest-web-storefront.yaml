  notes: Purpose derived from the screen name and its operations on 17 August, not from a requirement.
  density: compact
  pattern: configEditor
  patternReason: the screen declares only writes (`submitReview`) and no read of a population — it is
    settings, not a list
  purpose: Tell the venue how the visit went, answer a survey it sent, or report a problem.
  layout:
    template: form
    regions:
    - name: contentBody
      slot: form
      components:
      - kind: selectField
        label: Which visit
        bindsTo: SubmitReviewRequest.relatedOrderId
        operation: listMyOrders
        notes: Chosen from the guest's recent orders ("Coastal Aqua - Sat 26 Sep 2026"); never typed.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: selectField
        label: Your rating
        bindsTo: SubmitReviewRequest.rating
