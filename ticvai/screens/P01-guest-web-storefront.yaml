        label: Complete your details
        operation: updateMyProfile
        notes: 'For a profile created by guest checkout (W1): asks for what the pop-up did not; never
          blocks.'
        provenance: decided 29 September 2026, W1
      - kind: consentBlock
        label: What we may send you
        bindsTo: ConsentState.purposes
        operation: getGuestConsents
        notes: One row per configured purpose (`listConsentPurposes`), its channels as toggles, its plain-language
          description and the notice version in force; the current position from `getGuestConsents` (Given
          with date, Withdrawn with date, Not asked, Needs renewing). A change is recorded at once with
          `recordConsent` (source and notice version set by the app; the guest never types a purpose,
