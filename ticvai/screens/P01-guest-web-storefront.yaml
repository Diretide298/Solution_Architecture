    - to: WEB-015
      trigger: Adds tickets for a performance whose on-sale waiting room is on
      operation: addCartLine
      precondition: '`addCartLine` refused `403 admission-required`: this performance''s room is on and
        the page holds no admission token for it'
      carries:
