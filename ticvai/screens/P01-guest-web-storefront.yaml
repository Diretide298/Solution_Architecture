    provenance: client-verified
- id: WEB-035
  name: Multi-Currency & Pricing
  module: Ticketing
  requiresModule: ticketing
  wave: 1
  capability: C00
  implementation:
    app: guest-web
    route: /multi-currency-pricing
    component: apps/guest-web/src/routes/MulticurrencyPricing.tsx
    status: notStarted
  navigation:
    exitTo:
    - WEB-001
    - WEB-030
    - WEB-031
    inferred: true
    transitions:
    - to: WEB-030
      trigger: Ticket Transfer
      provenance: 'derived — WEB-030 declares entryState.params orderId, transferId and WEB-035 holds
        none of them. The edge carries nothing: orderId, transferId only pre-select (deep link or optional),
        and WEB-030 opens on its own'
    - to: WEB-031
      trigger: My Reservations
      carries:
      - productId
      provenance: derived — WEB-031 declares entryState.params groupBookingId, productId, reservationId,
        resourceId and WEB-035 holds productId, so an edge into it carries them
  notes: 'Added 17 August. **The surface the matrix names** — 2.6.33 *"website should be able to display
    multi currency"* and 2.9.1 *"in the B2C portal for guests comparison"*. First on the website, before
    the app, because **the website is where an overseas guest compares before booking** and the app is
    where they check after. **Display only — the sale settles in base currency** (CF-37). Not on the wireframe
    board; needs drawing. **`getRegionSettings` deliberately not called** — a guest does not need the
    venue''s scope configuration to pick a currency. `listFxRates` is the currency list: a rate exists
    only for a currency the venue enabled, so the two questions have one answer.


    **Rev 3 (decided 29 September, rev 3 GAP-D2).** The web and app waves of this capability differ; they
    are aligned to one wave once the client picks it (open, client to choose).


    Rates carry `fetchedAt` (`listFxRates`; GAP-B3, already); the prototype''s fixed demo rate is prototype-only
    (CFG-7, no change).


    **The guest selects the currency and pays in it** (decided 2 October 2026, Chinmay; CHG-FIN-001; reverses
    the display-only rule, CF-37 and "payment will be processed in AED", in favour of option (b) of MoM
    10 Aug 2026 4.7, DI-211). The venue lists the currencies a guest may pay in (`VenueSettings.chargeCurrencies`,
    a subset of the currencies it shows); `listFxRates` with `chargeable=true` returns them, each marked
    `chargeable`. The selected currency is sent at checkout (`checkoutCart.chargeCurrency`), the rate
    is locked on the order (`Order.chargeFxRate`, `chargeTotal`, until `chargeRateLockedUntil`), and the
    payment request goes to the payment partner in that currency. The ledger stays in the venue''s base
    currency, with the rate recorded on the order, the payment and any refund. **Refunds go back in the
    currency paid**, at the sale rate, so a full refund returns exactly what was charged. A currency the
    venue shows but does not charge is still an approximate price, marked "approx.", with "You pay in
    <base currency>" beside it.'
  density: compact
  pattern: listDetail
  patternReason: '`listFxRates` reads a population and nothing reads one of them; the detail is the row
    until a `get` exists'
  purpose: Choose the currency you see prices in and pay in.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Pay in
        operation: listFxRates
        notes: 'Sends `?venueId=&chargeable=true` to `listFxRates`: the currencies this venue lets a guest
          pay in, base currency first. The choice is kept for the session and sent at checkout as `chargeCurrency`
          (CHG-FIN-001).'
        provenance: contract finance.yaml GET /fx-rates
      - kind: banner
        label: How you pay
        operation: listFxRates
        notes: '"You pay in USD. Your card is charged USD 81.72; the venue records AED 300.00 at 3.6710."
          For a currency shown but not chargeable: "Prices in EUR are approximate. You pay in AED." (CHG-FIN-001).
          The purpose filter is fixed to `tender`, never typed by a guest.'
        provenance: contract finance.yaml GET /fx-rates
      - kind: cardList
        label: Currencies
        bindsTo: FxRate
        columns:
        - FxRate.toCurrency
        - FxRate.rate
        - FxRate.fetchedAt
        - FxRate.chargeable
        operation: listFxRates
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3); currency choice
          CHG-FIN-001
        notes: 'Fixed by the screen: the venue from Home, as at now, purpose tender. A guest never chooses
          a purpose: that would let them browse internal treasury rates. Was the generated table ''Every
          FX rate''; staff and plumbing columns removed (decided by Chinmay, fix before Block A starts,
          2 October 2026 (GFIX-3)).'
      - kind: cardList
        label: Prices in your currency
        bindsTo: Product
        columns:
        - Product.name
        - Product.description
        operation: listProducts
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        notes: The venue's products with the price converted at the rate above; the venue's own currency
          stays the price charged. The venue is the one the guest picked on Home (`venueId` from the session,
          audit R267), never typed. Was the generated table 'Every product'; staff and plumbing columns
          removed (decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)).
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected currency
        bindsTo: FxRate
        columns:
        - FxRate.fromCurrency
        - FxRate.toCurrency
        - FxRate.rate
        - FxRate.fetchedAt
        - FxRate.chargeable
        operation: listFxRates
        provenance: contract finance.yaml GET /fx-rates
  states:
    loading: The multi-currency pricing list.
    error: Could not load. Names which read failed and leaves the multi-currency pricing untouched.
    emptyFirstRun: 'Not reachable: with no other currency at the venue the screen is not linked, and prices
      stay in the venue''s currency.'
    emptyNoResults: 'Never shown: the screen sends no filter a guest chose.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows. Last known rates stay, with their age.** A rate is a number
      a guest may act on, and an undated one they cannot judge.'
  apis:
  - operationId: listFxRates
    contract: finance
    purpose: The currencies the venue shows, each marked chargeable or approximate — called with `venueId`
      (audit R120 (a)) and `chargeable` (CHG-FIN-001)
    trigger: onLoad
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  entryState:
    preloaded:
    - FxRate.id
    - FxRate.fromCurrency
    - FxRate.toCurrency
    - FxRate.rate
    - FxRate.purpose
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-035
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: exact
      view: Discover → 'Prices in your currency'
      differences: Matches the YAML's charged-vs-shown rule. Separately, Config → Currency switches the
        whole storefront currency, which contradicts 'always charged in AED'. **Resolved 2 October 2026
        (CHG-FIN-001):** the guest may pay in the selected currency, so a storefront currency switch is
        right where the venue charges that currency.
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
- id: WEB-036
  name: F&B – Browse & Order
  module: In-venue Services
  requiresModule: fnb
  wave: 1
  implementation:
    app: guest-web
    route: /fandb--browse-and-order
    component: apps/guest-web/src/routes/FBBrowseOrder.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
    - WEB-037
    transitions:
    - to: WEB-037
      trigger: Menu Item Detail
      carries:
      - outletId
      provenance: 'authored 3 October 2026 (CHG-SPF-004): WEB-036 lists them, and WEB-037 cannot load
        without the one the user picks'
  notes: '**A guest scans a QR on a table and lands in a browser.** That is the single most common F&B
    ordering pattern anywhere, and until 24 August it was the one thing this surface could not do — `claimTableSession`
    and `claimLocationSession` were app-only. **Nobody installs an app to order a coffee.** **Renamed
    31 August** from *F&B — Browse & Order*. **A guest surface is one product with two renderings** —
    a screen named differently on web and app is two screens to a developer and one journey to a guest.
    **Cross-surface parity, 31 August**: added getGuestOrderStatus. **The same screen on web and app was
    calling different operations** — one side could do something the other could not, and nothing recorded
    the difference as deliberate.


    **Rev 3 (decided 29 September).** **Table reservation and waitlist stay out of the basket (REV3-8):**
    `createTableReservation` and `joinRestaurantWaitlist` confirm straight away with a *No card needed*
    confirmation; the prototype''s basket line is prototype-only. **Deposit (REV3-8b, superseding audit
    R077 (a)):** where the venue has enabled a dining deposit, `createTableReservation` answers `awaitingDeposit`;
    the screen shows `deposit.amount` and basis, adds the deposit to the cart (`addCartLine` with `deposit.variantId`
    and `tableReservationId`), pays it through checkout, and shows `refundableUntil` and the late-cancel
    and no-show terms. Off by default; amount and basis are venue configuration, never a fixed AED 100.
    **Modifiers (REV3-9):** Add opens the modifier side panel of WEB-037 when the item has groups attached.
    Delivery fee, minimum order, area and full slots are unchanged (DG-5).


    **Where the outlet is (decided by Chinmay, 2 October 2026; DEC-070, DEC-206).** An outlet is *Inside
    the venue (needs an admission ticket)* or *Standalone (no ticket)* (`Outlet.admissionContext`). Ordering
    from an inside-the-venue outlet needs admission: a ticket, or a location claimed inside the venue;
    `createGuestFnbOrder` refuses 403 `entry-ticket-required` otherwise, and the screen says so and offers
    the tickets. A standalone restaurant sells takeaway and delivery without a ticket. **F&B keeps its
    own payment step and its own receipt** (DEC-071, DEC-052): DI-293''s one cart and one receipt does
    not apply to F&B, so the food order is paid on its own pay step and its receipt does not join the
    guest''s ticket receipt (CHG-SGU-001).'
  density: compact
  pattern: listDetail
  patternReason: 'Location, menu, basket, pay: the guest picks an outlet, then orders from its menu (CHG-SGU-018)'
  purpose: Order food from a table, a lounger or a seat.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Show the guest's own reservations, the one being changed among them
        operation: listMyTableReservations
        bindsTo: MyTableBooking
        columns:
        - MyTableBooking.kind
        - MyTableBooking.outletName
        - MyTableBooking.reservation
        - MyTableBooking.waitlistEntry
        provenance: r1 gate, 3 October 2026 (CHG-R1S-004)
      - kind: cardList
        label: Where you can eat now
        bindsTo: DiningOutlet
        columns:
        - DiningOutlet.name
        - DiningOutlet.zone
        - DiningOutlet.cuisine
        - DiningOutlet.orderingMethod
        - DiningOutlet.closesAt
        - DiningOutlet.estimatedWaitMinutes
        - DiningOutlet.imageAssetRef
        operation: listDiningOutlets
        notes: 'Outlets open now: photo, name, zone, cuisine, how to order ("Order to your seat", "Collect",
          "Counter only") and closing time; a wait only when the outlet reports one. No ids.'
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: textField
        label: Lounger, table or seat number
        operation: claimLocationSession
        notes: A scanned code arrives with the link and is claimed at once; this short box is the fallback
          when the QR is damaged ("Lounger B-14", "Table 12"). Party size is asked only at a table.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: LocationSession.label
      - kind: selectField
        label: How you get it
        operation: listFulfilmentSlots
        notes: 'Only what the outlet supports: to my table, seat or lounger; collect from the counter;
          delivery to an address. Sends `mode`.'
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: DiningOutlet.orderingMethod
      - kind: selectField
        label: When
        bindsTo: FulfilmentSlots.slots
        operation: listFulfilmentSlots
        notes: ASAP first ("About 25 min"), then the open slots; a date only for advance takeaway or delivery.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: selectField
        label: Deliver to
        operation: listDeliveryLocations
        notes: The delivery area check before the menu; an address outside it never reaches a basket.
          Building, unit, emirate (from the outlet's emirates) and directions.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: DeliveryLocation.label
      - kind: detailPanel
        label: Menu
        bindsTo: GuestMenu
        columns:
        - GuestMenu.name
        - GuestMenu.inForceUntil
        - GuestMenu.sections
        operation: getGuestMenu
        notes: Sections in the outlet's order, "Lunch menu until 16:00" from `inForceUntil`; each dish
          with photo, price and allergens; a dish's modifier groups come inside the menu (no venue-wide
          modifier list). Sold out stays in place, greyed.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: cartPanel
        label: Your order
        operation: getFnbDeliveryPolicy
        notes: Lines with choices and a 1-20 stepper, the kitchen note per dish; for delivery the fee,
          the free-delivery threshold and the minimum order.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: banner
        label: Order placed
        bindsTo: GuestOrderStatus
        operation: getGuestOrderStatus
        notes: The order number large, where it is going, the ready time as a clock time; then tracking
          (WEB-038 / GST-025).
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: banner
        label: Needs an admission ticket
        operation: createGuestFnbOrder
        notes: '**Where the outlet is (decided by Chinmay, 2 October 2026; DEC-070, DEC-206).** An outlet
          is *Inside the venue (needs an admission ticket)* or *Standalone (no ticket)* (`Outlet.admissionContext`).
          Ordering from an inside-the-venue outlet needs admission: a ticket, or a location claimed inside
          the venue; `createGuestFnbOrder` refuses 403 `entry-ticket-required` otherwise, and the screen
          says so and offers the tickets. A standalone restaurant sells takeaway and delivery without
          a ticket. **F&B keeps its own payment step and its own receipt** (DEC-071, DEC-052): DI-293''s
          one cart and one receipt does not apply to F&B, so the food order is paid on its own pay step
          and its receipt does not join the guest''s ticket receipt (CHG-SGU-001).'
        provenance: corrected 2 October 2026 (CHG-SGU-001, decided by Chinmay 2 October 2026, DEC-070/071/052/206)
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Pay
        operation: createGuestFnbOrder
        notes: Reads "Pay AED 86.00", never "Send to the kitchen". The order and the total the guest saw
          go to the server, then card or wallet on the F&B order's own pay step; the kitchen sees it only
          once payment succeeds, unless it goes on an open table tab. Its own receipt (DEC-071).
        provenance: corrected 2 October 2026 (CHG-SGU-001, decided by Chinmay 2 October 2026, DEC-070/071/052/206)
      - kind: secondaryButton
        label: Book a table
        operation: createTableReservation
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: secondaryButton
        label: Change or cancel booking
        operation: updateTableReservation
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: secondaryButton
        label: Join the waitlist
        operation: joinRestaurantWaitlist
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: destructiveButton
        label: Leave restaurant waitlist
        operation: leaveRestaurantWaitlist
        notes: Leaves the guest's own entry — the one just joined, or one opened from its link — and the
          entry returns `cancelled` (decided 28 September, audit R073 (d)); the same act as GST-070.
        provenance: contract fnb.yaml POST /waitlist/{entryId}/leave
  states:
    loading: Content resolves in place.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: No outlet takes orders here now. Names when the next one opens; a counter-only outlet's
      menu can still be read.
    emptyNoResults: 'No outlet open now matches: says so, with the next opening time.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** The menu already loaded stays with its age. Ordering, claiming
      a table and booking wait for the connection — an order placed offline is food nobody is making.'
  apis:
  - operationId: getFnbDeliveryPolicy
    contract: fnb
    purpose: Minimum order, delivery fee and area
    trigger: onLoad
  - operationId: listFulfilmentSlots
    contract: fnb
    purpose: Collection times or delivery windows still open
    trigger: onLoad
  - operationId: getGuestMenu
    contract: fnb
    purpose: The menu a guest sees
    trigger: onLoad
  - operationId: listDiningOutlets
    contract: fnb
    purpose: Where a guest can eat, right now
    trigger: onLoad
  - operationId: claimLocationSession
    contract: fnb
    purpose: Tell the platform where the guest is
    trigger: onAction
    invalidates:
    - listDiningOutlets
  - operationId: createGuestFnbOrder
    contract: fnb
    purpose: A guest orders food; refused 403 entry-ticket-required at an inside-the-venue outlet without
      admission; paid on its own pay step with its own receipt (DEC-070, DEC-071)
    trigger: onAction
    invalidates:
    - listDiningOutlets
  - operationId: listDeliveryLocations
    contract: fnb
    purpose: Where an order can be delivered
    trigger: onLoad
  - operationId: getGuestOrderStatus
    contract: fnb
    purpose: Track an order Only when signed in (decided 2 October 2026 by Chinmay, fix before Block A
      starts (GFIX-6)).
    trigger: onLoad
  - operationId: createTableReservation
    contract: fnb
    purpose: Reserve a table
    trigger: onAction
  - operationId: joinRestaurantWaitlist
    contract: fnb
    purpose: Join the waitlist when nothing is free
    trigger: onAction
  - operationId: leaveRestaurantWaitlist
    contract: fnb
    purpose: Leave the restaurant waitlist; the entry returns cancelled (decided 28 September, audit R073
      (d))
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Add a table deposit to the cart when the venue requires one
    trigger: onAction
  - operationId: updateTableReservation
    contract: fnb
    purpose: Change or cancel the guest's own table booking (web and app parity with GST-070)
    trigger: onAction
  - operationId: listMyTableReservations
    contract: fnb
    purpose: Show the guest's own reservations, the one being changed among them
    trigger: onLoad
    provenance: r1 gate, 3 October 2026 (CHG-R1S-004)
  entryState:
    params:
    - name: outletId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen reads it with `getFnbDeliveryPolicy`;
        an edge that holds one may still carry it to open on that record.'
    - name: venueId
      from: session
    - name: orderId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createGuestFnbOrder`;
        a link or an edge that holds one opens it instead.'
    - name: entryId
      from: deepLink
      optional: true
    - name: cartId
      from: session
      optional: true
    - name: reservationId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createTableReservation`;
        a link or an edge that holds one opens it instead.'
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with `outletId`. **`venueId` is the venue
      the guest picked on the home screen** (WEB-001 on the web, GST-001 in the app), remembered on the
      device and changeable there; it is not read from the sign-in (decided 28 September, audit R267).'
    preloaded:
    - FulfilmentSlots.slots
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-036
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (30 September build)
      verified: '2026-10-01'
      match: exact
      view: Summit Peaks → header 'At the venue' → Order food (table ordering)
      differences: 'Prototype splits in-venue table ordering (At the venue) from takeaway/delivery ordering
        (a booking flow with a delivery-area and slot check). Table reservation and waitlist (in YAML
        apis) are booking flows at Saffron Table. **The prototype sends the order with "Send to the kitchen"
        and no payment step: wrong here.** The contract takes payment before the kitchen sees a guest
        order unless the outlet runs a tab, and F11 puts the pay step (4) before the kitchen (5); the
        design shows the pay step (CHG-SGU-018).'
  apisNote: 'Rebuilt 9 September 2026 from the 8 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formCreateTableReservation
    component: modal
    trigger: Book a table
    body: 'Restaurant, date, time and party size on one screen, an optional note for allergies or requests,
      and optional seating preference (`seatingPreference`) and occasion (`occasion`: birthday, anniversary,
      business, celebration, other; DEC-204). Name and contact are prefilled from the profile. No table
      picking, no duration, and nothing the server sets (id, status, tables, group, visit). Confirmed
      at once with "No card needed", unless the venue enabled a deposit (`awaitingDeposit`).'
    bindsTo: TableReservation
    confirm:
      label: Book a table
      operation: createTableReservation
    dismiss:
      label: Cancel
    provenance: corrected 2 October 2026 (CHG-SGU-002, decided by Chinmay 2 October 2026, DEC-204)
  - id: formUpdateTableReservation
    component: modal
    trigger: Change or cancel booking
    body: 'Party size and time only; the restaurant is fixed. Cancelling says the consequence first: free,
      deposit released, or deposit kept.'
    bindsTo: TableReservation
    confirm:
      label: Change or cancel booking
      operation: updateTableReservation
    dismiss:
      label: Cancel
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
  - id: formJoinRestaurantWaitlist
    component: modal
    trigger: Join the waitlist
    body: Party size and seating (Any, Indoor, Outdoor, Bar, Booth, High chair needed). Name and contact
      come from the profile; nothing the server sets is asked.
    bindsTo: RestaurantWaitlist
    confirm:
      label: Join the waitlist
      operation: joinRestaurantWaitlist
    dismiss:
      label: Cancel
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
- id: WEB-037
  name: Menu Item Detail
  module: In-venue Services
