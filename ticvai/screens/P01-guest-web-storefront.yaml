    - name: transferId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): no operation on the screen takes it; a link that
        carries it only pre-selects the record.'
    coldEntry: '**A guest opening an order link weeks later.** Shows the order if it still resolves; if
      it was refunded or the performance passed, says which and offers the order list rather than an error.'
    preloaded:
    - OrderSummary.id
    - OrderSummary.orderNumber
    - OrderSummary.status
    - OrderSummary.grossAmount
    - OrderSummary.refundedAmount
  wireframe:
    status: review
    provenance: client-verified
