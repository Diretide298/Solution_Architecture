  notes: '**The point of a virtual queue is that the guest walks away** — which works the same in a browser
    tab as in an app.


    **Rev 3 (decided 29 September, rev 3 GAP-D2).** The web and app waves of this capability differ; they
    are aligned to one wave once the client picks it (open, client to choose).'
  density: compact
  pattern: statusTracker
  patternReason: '`getWaitingGuest` reads one record and nothing reads a population — the screen is about
    that one thing'
  purpose: Hold a place without standing in one.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The waiting guest
        bindsTo: WaitingGuest
        columns:
        - WaitingGuest.queueName
        - WaitingGuest.partyNumber
        - WaitingGuest.status
        - WaitingGuest.estimatedCallAt
        - WaitingGuest.calledAt
        - WaitingGuest.returnWindowEndsAt
        - WaitingGuest.redeemedAt
        - WaitingGuest.admittedCount
