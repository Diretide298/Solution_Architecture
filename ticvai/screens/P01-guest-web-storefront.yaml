        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: toggle
        label: Consent toggle
        operation: recordConsent
        notes: Per purpose and channel; recorded at once on change, append-only.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
        bindsTo: ConsentState.purposes
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: My details
        operation: getMyProfile
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
        notes: Read by session (`getMyProfile`), matching `updateMyProfile`; it cannot be pointed at another
          guest.
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save my profile
        operation: updateMyProfile
        provenance: contract marketing-crm.yaml PATCH /guests/me/profile
      - kind: secondaryButton
        label: Verify guest email
        operation: verifyGuestEmail
        provenance: contract identity.yaml POST /auth/guest/verify-email
      - kind: secondaryButton
        label: Save guest preferences
        operation: updateGuestPreferences
        provenance: contract marketing-crm.yaml PUT /guests/{subjectId}/preferences
  states:
