- id: WEB-044
  name: AI Concierge – Home
  module: Engagement & Support
  requiresModule: ai
  wave: 1
  implementation:
    app: guest-web
    route: /ai-concierge
    component: apps/guest-web/src/routes/AiConcierge.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
  notes: '**A concierge in a browser is a concierge.** ADR-0020 keeps it read-only against the transactional
    core regardless of surface. **Renamed 31 August** from *AI Concierge*. **A guest surface is one product
    with two renderings** — a screen named differently on web and app is two screens to a developer and
    one journey to a guest. **Cross-surface parity, 31 August**: added getGuestMenu. **A guest does not
    know which surface they are on** — the same named screen on web and app now calls the same guest-callable
    operations.


    **Rev 3 (decided 29 September, rev 3 CFG-5).** The concierge entry shows as mascot art when `BookingFlowConfig.conciergeMascot`
    is on (default on), otherwise as a plain button.'
  density: compact
  pattern: statusTracker
  patternReason: The conversation and its state (thinking, answered, handed to a person) are the content;
    the menu is only a shortcut (design-notes correction ai, CHG-SGU-016)
  purpose: Ask, and be answered or handed to a person.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: assistantPanel
        label: Ask Sahli
        operation: sendAiMessage
        notes: '**The conversation is the content.** The question shows at once and the answer streams
          with its sources; on 503 (every provider failed) "Sahli can''t answer right now" with Hand over
          to a person and Try again. The conversation is opened silently (`createAiConversation`) on the
          first message, its scope taken from the session; the guest never picks a module.


          **Answers stream** (decided by Chinmay, 3 October 2026 (CHG-SPF-013)): server-sent events carry
          the tokens, then the sources and any proposed action; the full message is stored once it ends.'
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
      - kind: textField
        label: Your question
        operation: sendAiMessage
        notes: The ask box under the conversation (typed, or a starter chip). Sending opens the conversation
          on the first message.
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
        bindsTo: AiMessage.content
      - kind: textField
        label: Message to the agent
        operation: sendGuestConversationMessage
        notes: Replaces the ask box once a person has taken the conversation; the transcript stays above.
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
        bindsTo: ConversationMessage.body
      - kind: detailPanel
        label: The agent's replies
        bindsTo: GuestConversation
        columns:
        - GuestConversation.state
        - GuestConversation.queuePosition
        - GuestConversation.estimatedWaitSeconds
        - GuestConversation.messages
        operation: getGuestConversation
        notes: '**After a handover the thread is read here** (Chinmay, 3 October 2026, r1 additions; CHG-RONEC-003):
          the agent''s replies, where the guest is in the queue and the wait, until an agent claims it.
          Polled every 5 seconds while the chat is on screen and every 30 seconds while the app or tab
          is hidden, with `afterMessageId` so each poll fetches only what is new; it stops when the conversation
          ends (`resolved`, `abandoned`, `timedOut`).'
        provenance: decided 3 October 2026, r1 additions (CHG-RONEC-003)
      - kind: cardList
        label: Earlier conversations
        bindsTo: AiConversation
        columns:
        - AiConversation.startedAt
        - AiConversation.lastMessageAt
        - AiConversation.messageCount
        operation: listAiConversations
        notes: The signed-in guest's own conversations, newest first, the first question as the title;
          no principal, scope or module columns.
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Hand over to a person
        operation: handoverToAgent
        notes: One tap, always visible in the panel header. Sends reason `guestRequested` with Sahli's
          own summary; the platform sets `assistantFailed`, `outOfScope` or `negativeSentiment` itself.
          The panel becomes the agent chat (`sendGuestConversationMessage`) with queue position and wait;
          409 offers to raise a case.
        provenance: corrected 2 October 2026 (CHG-SGU-016, design-notes correction)
      - kind: secondaryButton
        label: Helpful / Not helpful
