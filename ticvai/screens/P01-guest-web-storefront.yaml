      carries:
      - eventId
      - performanceId
      provenance: derived — WEB-006 declares entryState.params cartId, eventId, performanceId and WEB-007
        holds eventId, performanceId, so an edge into it carries them
    - to: WEB-010
      trigger: Reviews the cart
      provenance: flow F02 step 2→3
      carries:
      - holdId
      - performanceId
  notes: 'A map with no geometry falls back to category and best-available selection. Availability returns
    renderMode: list, and the screen renders groups rather than a plan. Never refuses the seated flow.
    **Drawn 26 August** — `Seat Board 3.dc.html` frame `seat-3b`. **The frame names this screen on its
    own face**, which is the first pack to do that: the earlier F&B, POS and Retail boards had to be hand-assigned
    by purpose after three derivation attempts produced nonsense. **A board that says what it draws removes
    the guess entirely.** **Renamed 31 August** from *Seat Map Selection*. **A guest surface is one product
    with two renderings** — a screen named differently on web and app is two screens to a developer and
    one journey to a guest. **Cross-surface parity, 31 August**: added recommendSeats. **A guest does
    not know which surface they are on** — the same named screen on web and app now calls the same guest-callable
    operations.


    **Rev 3 (decided 29 September).** Date and time on seated events: an inline step before this map,
    or a pop-up over it, per `BookingFlowConfig.seatEventDateMode` (REV3-4); a single-performance event
    opens straight here. Time bar with performance switcher (REV3-6, `seatTimeBar`). View-from-your-seat
    box placed per `seatViewPosition` (REV3-5) and fed by a section photo or the geometry (23SEP-14).
    Fixture strip and a direct WEB-004 → WEB-007 path (23SEP-16). With WEB-006 this may render as one
    step (REV3-7). Seat picker defaults to the bowl (`seatPicker` default `bowl`, CFG-6). **The cabana
    map is no longer this screen:** a cabana, lounger or other spot placed on a venue map is booked on
    WEB-047 (REV3-15, GAP-C2). Every booking-flow setting named here is read from `getPublishedTenantConfig`
    `bookingFlow`, resolved for the venue the guest picked (audit R267): the tenant''s values with that
    venue''s `venueOverrides` entry laid over field by field (decided 29 September, rev 3 CFG-11).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getPublishedTenantConfig`
    `bookingFlow`.


    **29 September (W2).** Sections first, zoom into a section, scroll or pinch out (or *Whole map*) back
    to the full map; held seats are kept.'
  density: compact
  boardFrames:
  - Seat Board 3.dc.html#seat-3b
  pattern: statusTracker
  patternReason: '`getSeatAvailability` reads one record and nothing reads a population — the screen is
    about that one thing'
  purpose: Choose specific seats.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The seat availability
        bindsTo: SeatAvailability
        columns:
        - SeatAvailability.performanceId
        - SeatAvailability.totals
        - SeatAvailability.byCategory
        - SeatAvailability.seats
        operation: getSeatAvailability
        provenance: contract seating.yaml GET /performances/{performanceId}/seat-availability
      - kind: banner
        notes: '**One countdown: `Cart.expiresAt`** (the earliest lease in the cart), always visible.
          The 8-minute seat hold and the 15-minute cart lease are never shown as two clocks; a selection
          that expires silently while a guest enters card details is the worst outcome in this flow (CHG-SGU-020).'
        provenance: carried from the previous definition
      - kind: seatMap
        label: Choose seats
        notes: '**A seat selection screen with no seat map.** `noGeometry` is the state that matters:
          a map imported from a manifest alone can be sold from a list and not rendered, and the screen
          has to say which it is rather than showing an empty frame. **At most `VenueSettings.seating.maxSeatsPerGuestOrder`
          seats per booking** on the guest channel (default 10, bounds 1-50): a `422 seat-limit-exceeded`
          from `createSeatHold` reads *Up to {maxSeats} seats per booking*, and the basket lists each
          seat (decided 29 September, rev 3 REV3-7). Section zoom happens on the same map (23SEP-16).
          **Sections first** (W2): tap a section to zoom in and see its seats; scroll or pinch out, or
          *← Whole map*, to return and compare sections, keeping held seats. **A tap on a seat is the
          hold** (`createSeatHold`); its length is the server''s default and never a guest input (GFIX-3).'
        provenance: minute 2026-08-03 §Ticket Flow Variations by Product Type
        operation: createSeatHold
      - kind: selectField
        label: Time bar
        notes: 'Above the map: the chosen performance, the other times of the event to switch to, and
          **Change date**. Switching releases the seats held for the old performance (`relinquishSeatHold`,
          the guest''s own hold; another''s answers 404) and holds new ones for the new one (`createSeatHold`).
          Shown only when `BookingFlowConfig.seatTimeBar` is on (default on).'
        operation: listPerformances
        provenance: decided 29 September, rev 3 REV3-6
      - kind: cardList
        label: Fixture strip
        notes: The fixture (teams, date, kick-off) as a strip at the top of the seat step, so a single-performance
          fixture opens straight on the map.
        operation: listPerformances
        provenance: decided 29 September, rev 3 23SEP-16
      - kind: detailPanel
        label: View from this section
        bindsTo: SeatAvailability.sections
        notes: 'When a section is picked: its photo (`sections[].viewAssetId`) if the venue uploaded one,
          otherwise a view rendered from the imported geometry (section boundary, stage position, seat
          positions) — closer sections show a larger stage and fewer rows ahead. Placed per `BookingFlowConfig.seatViewPosition`
          (bottom default, right, left, top) on wide screens; always below the map on narrow screens.'
        operation: getSeatAvailability
        provenance: decided 29 September, rev 3 23SEP-14, REV3-5
      - kind: progressIndicator
        label: Booking steps
        bindsTo: BookingFlow
        columns:
        - BookingFlow.steps
        operation: getPublishedBookingFlow
        notes: The steps of the published flow in their `sortOrder`, this one (seats) highlighted. A step
          the flow has turned off is not shown and is skipped by Continue and Back. Drawn in the venue's
          `BookingFlowSettings.stepIndicator` style; `embedMode` and `singleEventPage` come from the same
          published settings (CMS-016) (CHG-SGU-022).
        provenance: decided 29 September 2026, W12; CMS-103 Booking Flows
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Recommend seats
        operation: recommendSeats
        provenance: contract seating.yaml POST /performances/{performanceId}/seat-recommendations
      - kind: primaryButton
        label: Continue to checkout
        provenance: carried from the previous definition
  states:
    loading: The interactive seat selection, read by `getSeatAvailability`.
    error: Could not load. Names which read failed and leaves the interactive seat selection untouched.
    emptyFirstRun: No interactive seat selection yet. Offers Create seat hold (`createSeatHold`).
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
    emptyNoResults: The event has no other time to switch to on the time bar; the chosen performance stays.
  apis:
  - operationId: createSeatHold
    contract: seating
    purpose: Hold specific seats
    trigger: onAction
  - operationId: getSeatAvailability
    contract: seating
    purpose: Seat status for a performance
    trigger: onLoad
  - operationId: recommendSeats
    contract: seating
    purpose: Recommend seats for a party
    trigger: onAction
  - operationId: listPerformances
    contract: catalogue
    purpose: The event's other times, for the time bar and the date and time pop-up
    trigger: onLoad
  - operationId: relinquishSeatHold
    contract: seating
    purpose: Release the seats held for the old performance when the guest switches time on the time bar
      (decided 29 September, rev 3 REV3-6); a guest releases only their own hold
    trigger: onAction
  - operationId: getPublishedBookingFlow
    contract: white-label
    purpose: 'The published booking flow for this product: which steps it has and in what order (W12)'
    trigger: onLoad
    provenance: decided 29 September 2026, W12
  entryState:
    params:
    - name: performanceId
      from: deepLink
    - name: eventId
      from: WEB-006
    - name: holdId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createSeatHold`;
        a link or an edge that holds one opens it instead.'
    - name: venueId
      from: session
    coldEntry: '**A link to a performance that has happened.** Offers the next performance of the same
      event.'
    preloaded:
    - PublishedTenantConfig (bookingFlow and the venue-wide settings), loaded once by the app shell with
      getPublishedTenantConfig (WEB-001, GST-001, KSK-002)
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-007
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (30 September build; the view as verified on the 29 September build, CHG-R1S-015)
      verified: '2026-09-29'
      match: exact
      view: Union Arena → 'Flow 1 · Fixed date → zone → seat map' or 'Flow 2 · Choose date & time → seat
        map'; Grand Playhouse → Flow 1 / Flow 2
    derivedFrom: wireframes/reference/Seat Board 3.dc.html
    note: '**Drawn by Claude Design on `Seat Board 3.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formRecommendSeats
    component: modal
    trigger: Recommend seats
    body: '**How many seats, and best available or together.** The party size is the tickets already chosen;
      the guest only picks the preference, then `recommendSeats` places them.'
    bindsTo: SeatRecommendationRequest
    confirm:
