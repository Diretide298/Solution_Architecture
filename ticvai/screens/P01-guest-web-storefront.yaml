- id: WEB-041
  name: Parking – Reserve & Pay
  module: In-venue Services
  requiresModule: access
  wave: 1
  implementation:
    app: guest-web
    route: /parking--reserve-and-pay
    component: apps/guest-web/src/routes/ParkingReservePay.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
  notes: '**A guest reserves parking on the drive, from whatever is open on their phone.** Requiring an
    install for a car park is requiring an install to arrive. **Renamed 31 August** from *Parking — Reserve
    & Pay*. **A guest surface is one product with two renderings** — a screen named differently on web
    and app is two screens to a developer and one journey to a guest. **Rebound 28 September** (decided
    28 September, audit R166): parking is sold through the normal cart and checkout (`addCartLine`, `checkoutCart`,
    `createPayment`), so the entitlement gets its `orderId`; the guest no longer calls `createParkingEntitlement`,
    which the order service issues at payment. No live availability; a full car park is the `soldOutForDay`
    refusal.


    **Rev 3 (decided 29 September, rev 3 GAP-D2).** The web and app waves of this capability differ; they
    are aligned to one wave once the client picks it (open, client to choose).


    **The car park''s parking product is ParkingFacility.productVariantId (agreed with contracts in the
    ledger 4 October 2026): Add parking to my cart sends it as addCartLine''s variantId** (CHG-FXS-003)'
  density: compact
  pattern: listDetail
  patternReason: '`listParkingFacilities` reads a population and nothing reads one of them; the detail
    is the row until a `get` exists'
  purpose: Reserve a facility before arriving.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Load the parking entitlement being changed
        operation: getParkingEntitlement
        bindsTo: ParkingEntitlement
        columns:
        - ParkingEntitlement.plateNumber
        - ParkingEntitlement.plateCountry
        - ParkingEntitlement.mediaCode
        - ParkingEntitlement.status
        - ParkingEntitlement.pushedAt
        - ParkingEntitlement.pushFailureReason
        - ParkingEntitlement.validFrom
        - ParkingEntitlement.validTo
        provenance: r1 gate, 3 October 2026 (CHG-R1S-004)
      - kind: cardList
        label: Car parks
        bindsTo: ParkingFacility
        columns:
        - ParkingFacility.name
        - ParkingFacility.capacity
        - ParkingFacility.productVariantId
        operation: listParkingFacilities
        provenance: contract access.yaml ParkingFacility (defined 4 October 2026, CHG-FXS-003)
        notes: Choosing one puts its parking product (productVariantId, agreed field) in the basket with
          addCartLine.
      - kind: cardList
        label: Parking — Reserve & Pay
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Detail
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected parking facility
        bindsTo: ParkingFacility
        columns:
        - ParkingFacility.name
        operation: listParkingFacilities
        provenance: contract access.yaml GET /parking-facilities
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add parking to my cart
        operation: addCartLine
        notes: '**Parking is sold through the normal cart** (decided 28 September, audit R166): the car
          park''s parking product goes in as a cart line, then checkout and payment as for a ticket, and
          the parking entitlement is issued at payment carrying the order''s id — the guest never creates
          it. No live space count: a car park at capacity refuses the line with `soldOutForDay`.'
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Change plate
        operation: updateParkingEntitlement
        provenance: contract access.yaml PATCH /parking-entitlements/{entitlementId}
  states:
    loading: Content resolves in place.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: '**Nothing here yet for this venue.** Names what turns it on rather than showing an
      empty panel.'
    emptyNoResults: 'Never shown: the car parks are the venue''s, with no filter a guest sets.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** A reservation already confirmed stays on screen with its plate
      and car park. Reserving, paying and changing the plate need the connection.'
    soldOutForDay: '**The car park is full.** `addCartLine` refused the parking line with `soldOutForDay`:
      issued entitlements have reached the facility''s capacity for that day. Shown only then — there
      is no live space count in the first release, so the screen never promises spaces before the guest
      tries (decided 28 September, audit R166).'
  apis:
  - operationId: listParkingFacilities
    contract: access
    purpose: Car parks at a venue, and how each integrates
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Put the car park's parking product in the cart; refused `soldOutForDay` when the car park
      is at capacity (decided 28 September, audit R166)
    trigger: onAction
  - operationId: updateParkingEntitlement
    contract: access
    purpose: Change the plate, or revoke
    trigger: onAction
    invalidates:
    - listParkingFacilities
  - operationId: getParkingEntitlement
    contract: access
    purpose: Load the parking entitlement being changed
    trigger: onLoad
    provenance: r1 gate, 3 October 2026 (CHG-R1S-004)
  entryState:
    params:
    - name: entitlementId
      from: deepLink
    - name: venueId
      from: session
    - name: cartId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with `entitlementId`. **`venueId` is
      the venue the guest picked on the home screen** (WEB-001 on the web, GST-001 in the app), remembered
      on the device and changeable there; it is not read from the sign-in (decided 28 September, audit
      R267).'
    preloaded:
    - ParkingFacility.id
    - ParkingFacility.name
    - ParkingFacility.venueId
    - ParkingFacility.mode
    - ParkingFacility.capacity
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-041
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (30 September build)
      verified: '2026-10-01'
      match: partial
      view: Summit Peaks → header 'At the venue' → Parking
      differences: 'Shows live free-bay counts, which the YAML says it does not have (no live availability;
        full = soldOutForDay). Pays directly with ''Reserve and pay'' rather than through cart and checkout
        (R166). Also a plate field in the cabana/party flows. **Do not draw live free-bay counts or "Reserve
        and pay"**: no live count in the first release, and parking goes through the basket (R166) (CHG-SGU-020).'
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formAddCartLine
    component: modal
    trigger: Add parking to my cart
    body: '**Collects what `addCartLine` sends before it is called.** Required: `variantId` (the car park''s
      parking product), `quantity`. Optional: `performanceId`, `attributes` (the plate). A 409 `soldOutForDay`
      is shown as **the car park is full** for that day — capacity reached, not a live count (decided
      28 September, audit R166). Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Add to cart
      operation: addCartLine
    dismiss:
      label: Cancel
      discards:
      - variantId
      - quantity
      - performanceId
      - attributes
    provenance: client-verified
  - id: formUpdateParkingEntitlement
    component: modal
    trigger: Change plate
    body: '**The plate only.** `updateParkingEntitlement` with the new plate; a guest never sets a status.'
    bindsTo: UpdateParkingEntitlementRequest
    confirm:
      label: Save
      operation: updateParkingEntitlement
    dismiss:
      label: Cancel
      discards:
      - plate
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  gaps:
  - operation: checkoutCart
    removed: true
    why: Parking goes through the basket (R166); checkout is the basket's.
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  - operation: createPayment
    removed: true
    why: Payment is the basket's, after checkout (R166).
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
- id: WEB-042
  name: Retail & Shop and Drop
  module: Retail
  requiresModule: retail
  wave: 1
  implementation:
    app: guest-web
    route: /retail-and-shop-and-drop
    component: apps/guest-web/src/routes/RetailShopAndDrop.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
    - WEB-010
    transitions:
    - to: WEB-010
      trigger: 'Go to basket: one cart and one checkout for tickets, F&B add-ons and retail (DI-293, R236)'
      provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      carries:
      - cartId
      - performanceId
  notes: '**The web could sell merchandise and could not arrange collection.** `lookupShopAndDrop` was
    app-only, which made the service half-available on the surface most guests use. **Paid online at checkout**
    (decided 28 September, audit R236): the guest adds the item to the cart for collection, checks out
    and pays (`addCartLine`, `checkoutCart`, `createPayment`), and payment creates the shop-and-drop that
    `lookupShopAndDrop` then finds; `reserveMerchandise` ("reserved at purchase") is no longer wired here.


    **Paid only on the web (R236; DEC-075 of 2 October).** The app keeps an unpaid "hold to pay at the
    shop" drawn as secondary until decided, a sanctioned difference between the twins. The barcode price
    check (`lookupMerchandise`) is not drawn on the web (DEC-076) (CHG-SGU-018).'
  density: compact
  pattern: listDetail
  patternReason: '`listMerchandise` reads a population and nothing reads one of them; the detail is the
    row until a `get` exists'
  purpose: Buy merchandise and collect it on the way out.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Shop
        operation: listMerchandise
        notes: Shops by name; sends `outletId`.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: GuestMerchandiseItem.outletId
      - kind: selectField
        label: Category
        operation: listMerchandise
        notes: Categories by name; sends `categoryId`.
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        bindsTo: GuestMerchandiseItem.categoryId
      - kind: cardList
        label: Merchandise
        bindsTo: GuestMerchandiseItem
        columns:
        - GuestMerchandiseItem.name
        - GuestMerchandiseItem.description
        - GuestMerchandiseItem.price
        - GuestMerchandiseItem.isAvailable
        - GuestMerchandiseItem.imageAssetRef
        operation: listMerchandise
        notes: 'The guest projection: name, photo, price and whether it can be bought; sold-out items
          stay visible. No sku, barcode, variant, stock or inventory ids.'
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
      - kind: toggle
        label: In stock only
        operation: listMerchandise
        notes: Sends `?inStockOnly=` to `listMerchandise`.
        provenance: contract retail.yaml GET /merchandise
      - kind: searchField
        label: Search
        operation: listMerchandise
        notes: Sends `?search=` to `listMerchandise`.
        provenance: contract retail.yaml GET /merchandise
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add to basket
        operation: addCartLine
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: What is waiting for me
        operation: lookupShopAndDrop
        provenance: contract retail.yaml GET /shop-and-drop/lookup
  states:
    loading: Content resolves in place.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: '**Nothing here yet for this venue.** Names what turns it on rather than showing an
      empty panel.'
    emptyNoResults: Nothing matches.
    emptyNoAccess: '**There is no permission to name: a guest holds none** (ADR-0025). The shop is public;
      buying needs the guest''s cart.'
    offline: '**The offline banner shows, and lookup cannot run.** A drop reference already on screen
      stays visible so the guest can quote it at the collection point. Reserving merchandise needs the
      connection.'
  apis:
  - operationId: listMerchandise
    contract: retail
    purpose: List merchandise
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Put the item in the cart, marked for collection on the way out (audit R236)
    trigger: onAction
    invalidates:
    - listMerchandise
  - operationId: lookupShopAndDrop
    contract: retail
    purpose: Find a guest's dropped goods
    trigger: onAction
  entryState:
    params:
    - name: outletId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen lists them with `listMerchandise`
        and the user picks one; an edge that holds one may still carry it to open on that record.'
    - name: cartId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with `outletId`.'
    preloaded:
    - MerchandiseItem.id
    - MerchandiseItem.sku
    - MerchandiseItem.barcode
    - MerchandiseItem.name
    - MerchandiseItem.outletId
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-042
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (30 September build)
      verified: '2026-10-01'
      match: exact
      view: Summit Peaks → header 'At the venue' → Shop (collect at the gate, at the car park kiosk, or
        delivered home)
      differences: 'Pays in one tap on the page, not through the cart and checkout (YAML R236). 29 September:
        collect at the gate, at the car park kiosk, or delivered home, with a collection code after paying.'
  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formAddCartLine
    component: modal
    trigger: Add to basket
    body: The item and quantity (a size switches between sibling items); collection point or home delivery
      is chosen at checkout. No variant, performance or seat ids are asked.
    bindsTo: AddCartLineRequest
    confirm:
      label: Add to basket
      operation: addCartLine
    dismiss:
      label: Cancel
      discards:
      - variantId
      - quantity
      - performanceId
      - seatIds
      - parentLineId
      - attributes
    provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
- id: WEB-043
  name: Loyalty & Rewards
