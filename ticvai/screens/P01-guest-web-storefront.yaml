      differences: 'Contradicts 28 Sep decisions: YAML allows card or wallet only (R080) — prototype offers
        Apple Pay, Tabby split-in-4, pay on arrival and invoice/PO; YAML removed the ''is this you?''
        match at checkout (R120 b) — prototype still asks the guest to link or keep separate. The unknown-outcome
