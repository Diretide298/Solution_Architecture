  notes: '**Renamed 31 August** from *Order Confirmation*. **A guest surface is one product with two renderings**
    — a screen named differently on web and app is two screens to a developer and one journey to a guest.'
  density: compact
  pattern: statusTracker
  patternReason: '`getOrder` reads one record and nothing reads a population — the screen is about that
    one thing'
  purpose: Confirm the purchase and deliver the tickets.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The order
        bindsTo: Order
        columns:
        - Order.id
        - Order.orderNumber
        - Order.channel
        - Order.venueId
        - Order.scopePath
        - Order.status
        - Order.currency
        - Order.currencyScale
        - Order.grossAmount
        - Order.taxAmount
        - Order.netAmount
        - Order.refundedAmount
        - Order.totalPriceVariance
        - Order.lines
        - Order.payments
        - Order.principalId
        operation: getOrder
        provenance: contract orders.yaml GET /orders/{orderId}
      - kind: banner
        notes: Confirmation with the order number prominent
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Add to wallet
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Resend confirmation
        provenance: carried from the previous definition
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Transfer order tickets
        operation: transferOrderTickets
        provenance: contract orders.yaml POST /orders/{orderId}/transfer
      - kind: secondaryButton
        label: Reprint order
        operation: reprintOrder
        provenance: contract orders.yaml POST /orders/{orderId}/reprints
  states:
    loading: The booking confirmation, read by `getOrder`.
    error: Could not load. Names which read failed and leaves the booking confirmation untouched.
    emptyFirstRun: No booking confirmation yet. **Offers no create action** — this screen declares no
      operation that makes one — and says so rather than showing an empty table.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: transferOrderTickets
    contract: orders
    purpose: Transfer tickets to another guest
    trigger: onAction
  - operationId: getOrder
    contract: orders
    purpose: Read an order
    trigger: onLoad
  - operationId: reprintOrder
    contract: orders
    purpose: Reprint or resend tickets
    trigger: onAction
  entryState:
    params:
    - name: orderId
      from: WEB-012
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-013
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: Book → final step 'Confirmed' after paying
      differences: Prototype adds editing attendee details after purchase ('Change your details', signed-in
        only) and Reissue QR. No 'unpaid — pay now' route to WEB-014.
  apisNote: Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formTransferOrderTickets
    component: modal
    trigger: Transfer order tickets
    body: '**Collects what `transferOrderTickets` sends before it is called.** Required: `ticketIds`,
      `recipient`. Optional: `message`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Transfer order tickets
      operation: transferOrderTickets
    dismiss:
      label: Cancel
      discards:
      - ticketIds
      - recipient
      - message
    provenance: client-verified
  - id: formReprintOrder
    component: modal
    trigger: Reprint order
    body: '**Collects what `reprintOrder` sends before it is called.** Required: `delivery`, `recordedAt`.
      Optional: `destination`, `lineIds`, `reason`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Reprint order
      operation: reprintOrder
    dismiss:
      label: Cancel
      discards:
      - delivery
      - recordedAt
      - destination
      - lineIds
      - reason
    provenance: client-verified
- id: WEB-014
  name: Pay for a Booking
  module: Cart & Checkout
  requiresModule: ticketing
  wave: 1
  capability: C04
  implementation:
    app: guest-web
    route: /pay/:token
    component: apps/guest-web/src/routes/cart-and-checkout/PayByLinkForm.tsx
    status: notStarted
  navigation:
    exitTo:
    - WEB-013
    entryFrom:
    - WEB-013
    inferred: false
    notes: '**Reached from WEB-013** — an unpaid booking is paid from the confirmation that says it is
      unpaid. Stated on 4 September: this screen exited somewhere and nothing exited to it, so it was
      outside the navigation graph entirely.'
    transitions:
    - to: WEB-013
      trigger: Booking Confirmation
      carries:
      - orderId
      provenance: derived — WEB-013 declares entryState.params orderId and WEB-014 holds orderId, so an
        edge into it carries them
  notes: BL-072, rebuilt 20 August. **Declared `getCart` and `checkoutCart` until then, and `createPaymentLink`
    takes an `orderId`** — the screen was looking for a cart that was never created, and its entryState
    said `cartId` came from the session when **a guest arriving from an email has no session.** Wired
    by name-matching rather than by following the journey.
  density: compact
  pattern: statusTracker
  patternReason: '`getPaymentLink` reads one record and nothing reads a population — the screen is about
    that one thing'
  purpose: Pay for a booking somebody else took, without an account.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The payment link
        bindsTo: PaymentLink
        columns:
        - PaymentLink.id
        - PaymentLink.orderId
        - PaymentLink.reservationId
        - PaymentLink.token
        - PaymentLink.status
        - PaymentLink.channel
        - PaymentLink.sentTo
        - PaymentLink.expiresAt
        - PaymentLink.releaseHoldOnExpiry
        - PaymentLink.viewedAt
        - PaymentLink.paidAt
        - PaymentLink.resendCount
        - PaymentLink.issuedByPrincipalId
        - PaymentLink.scopePath
        operation: getPaymentLink
        provenance: contract orders.yaml GET /payment-links/{token}
      - kind: detailPanel
        bindsTo: PaymentLink
        notes: Venue, lines, total. **What they are paying for, before how to pay** — a guest who booked
          by phone may not recognise a reference number.
        provenance: carried from the previous definition
      - kind: banner
        notes: The deadline, counted in time remaining rather than as a timestamp. **Expires in 46 minutes**
          is actionable; **expires at 14:32** needs arithmetic.
        provenance: carried from the previous definition
      - kind: textField
        label: Email for your tickets (optional)
        notes: '**Optional, and only to send the ticket.** Requiring an account before taking money is
          how a paid booking becomes an abandoned one.'
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Pay now
        provenance: carried from the previous definition
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Pay by link
        operation: payByLink
        provenance: contract orders.yaml POST /payment-links/{token}/pay
  states:
    loading: The lines and the total, with the deadline counting down.
    error: Could not load the booking. **The hold is unaffected** — a failed page load must not release
      inventory.
    emptyFirstRun: '**Not reachable empty** — a link always names an order. An empty state here means
      the token did not resolve, which is the error state.'
    emptyNoAccess: '**The token is the credential, so there is no permission case** — either it resolves
      or it has gone.'
    offline: '**Not available, and the offline banner says why.** A payment needs the gateway, and pretending
      otherwise takes money nobody can confirm. What was typed stays on screen so nothing is entered twice.'
  apis:
  - operationId: getPaymentLink
    contract: orders
    purpose: What is owed and until when
    trigger: onLoad
  - operationId: payByLink
    contract: orders
    purpose: Take the money and convert the reservation
    trigger: onAction
  entryState:
    params:
    - name: token
      from: deepLink
    coldEntry: '**Cold is the only way in.** The guest arrives from an email, an SMS or a WhatsApp message
      with no session and quite possibly no account. **A link opened three days late is the ordinary case,
      not an edge** — the screen says the hold was released and offers to book again. Expired, already
      paid and superseded are three different messages, and **404 is never one of them**: telling somebody
      their booking does not exist when it expired is how a support call starts.'
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P01 Guest Web.dc.html#web-014
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3
      match: none
      note: 'The prototype has no view for this screen. It was drawn in Claude Design on 29 September
        in the prototype''s style and accepted as its design the same day (the frame on this screen''s
        board): build the layout from that frame.'
  apisNote: Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formPayByLink
    component: modal
    trigger: Pay by link
    body: '**Collects what `payByLink` sends before it is called.** Required: `providerToken`. Optional:
      `email`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Pay by link
      operation: payByLink
    dismiss:
      label: Cancel
      discards:
      - providerToken
      - email
    provenance: designed
- id: WEB-015
  name: Branded Queue / Waiting Room
  module: High-Demand Access
  requiresModule: ticketing
  wave: 2
  implementation:
    app: guest-web
    route: /high-demand-access/virtual-waiting-room
    component: apps/guest-web/src/routes/high-demand-access/VirtualWaitingRoomDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-006
    exitTo:
    - WEB-001
    - WEB-006
    transitions:
    - to: WEB-006
      trigger: Continue to your tickets
      precondition: '`getWaitingRoomPosition` answers `admitted`. The page keeps `admission.token` and sends
        it as `X-Admission-Token` on `addCartLine` until `admission.expiresAt`'
      carries:
      - performanceId
      provenance: ADR-0066 (accepted 1 October 2026) and its 1 October amendment
  notes: '**The on-sale waiting room (Q2), not the ride queue (Q1). Re-pointed 1 October under ADR-0066**
    from `joinQueue`, `getWaitingGuest` and `getWaitTimes`, which are the ride queue and wrote a `queue.entry`
    row per arriving guest, the load the room exists to keep away. The ride queue stays on WEB-040. Arrival
    is `enterWaitingRoom` (a Redis counter, no database write, no sign-in, no personal data); the page polls
    `getWaitingRoomPosition` every `pollAfterSeconds`. Admitted, it holds a short-lived signed admission
    token that `addCartLine` needs for this performance while its room is on (online cart holds only: the
    1 October amendment exempts tills, kiosks and venue workstations). **Reached from the sale, not the
    home screen:** WEB-006 lands here when `addCartLine` refuses `403 admission-required`, and admission
    returns there. `notRequired` (the room is off) goes straight back. **Renamed 31 August** from *Virtual
    Waiting Room*. **A guest surface is one product with two renderings** (GST-046).'
  density: compact
  pattern: statusTracker
  patternReason: '`getWaitingRoomPosition` reads one guest''s place in one performance''s room, polled — the
    screen is about that one thing'
  purpose: The on-sale waiting room for one performance — the guest's place, the wait, and the way on to
    the sale once admitted.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: Your place in the waiting room
        bindsTo: WaitingRoomEntry
        columns:
        - WaitingRoomEntry.state
        - WaitingRoomEntry.position
        - WaitingRoomEntry.aheadOfYou
        - WaitingRoomEntry.estimatedWaitSeconds
        operation: getWaitingRoomPosition
        provenance: contract catalogue.yaml GET /performances/{performanceId}/waiting-room/entries/{waitingEntryId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Take my place
        operation: enterWaitingRoom
        notes: The one write on this screen, pressed rather than fired on load so a prefetch or a bot
          does not take a place. Hidden once the guest has one.
        provenance: contract catalogue.yaml POST /performances/{performanceId}/waiting-room/entries
      - kind: primaryButton
        label: Continue to your tickets
        provenance: ADR-0066; live when `getWaitingRoomPosition` answers `admitted`
  states:
    loading: Taking a place in the room. *Take my place* (`enterWaitingRoom`) answers with a position, or
      `notRequired` and the guest goes straight on to the sale
    error: '**Lost the place.** The worst failure on this screen. A retry sends the same `Idempotency-Key`
      and gets the same entry back, so the guest is not sent to the back, and the screen says so, because
      a guest who thinks they lost their place will open a second tab and make it worse. `expired` (the admission
      was not used in time) offers to enter again; `closed` (the room was switched off or the performance
      stopped selling) says so and goes back to the event'
    emptyFirstRun: —
    emptyNoAccess: '**There is no access to refuse.** The room is anonymous (ADR-0066): no sign-in, no personal
      data, and the guest may not have an account yet.'
    offline: '**The offline banner shows.** The last known position stays on screen with its age, and polling
      resumes with the same entry when the connection is back. Admission needs the connection.'
  apis:
  - operationId: enterWaitingRoom
    contract: catalogue
    purpose: Take a place in the performance's on-sale waiting room (ADR-0066); `notRequired` when the
      room is off
    trigger: onAction
  - operationId: getWaitingRoomPosition
    contract: catalogue
    purpose: The guest's place, polled every `pollAfterSeconds`; admitted, it carries the admission token
      for `addCartLine`
    trigger: onInterval
  entryState:
    params:
    - name: performanceId
      from: WEB-006
    - name: waitingEntryId
      from: WEB-015
      optional: true
    coldEntry: '**Opened with no performance, or one no longer selling, the room says so and offers the
      event** — never a 404. The room belongs to one performance''s sale and has nothing to show without
      one.'
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-015
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: partial
      view: Only when the host tweak 'waitingRoom' is on; it is not in the Config drawer lists, so a reviewer
        cannot switch it on from the page
      differences: Drawn but unreachable from the Config drawer. The prototype holds the place by keeping
        the page open ('refreshing puts you at the back'); the room keeps it across a refresh, because
        `enterWaitingRoom` returns the same entry for the same `Idempotency-Key` (ADR-0066).
  apisNote: Rebuilt 1 October 2026 on the two waiting-room operations (ADR-0066). Columns are the entry's
    guest-facing fields; `pollAfterSeconds` and `admission` are plumbing the page acts on rather than shows.
- id: WEB-016
  name: Login / Register
  module: Account & Self-Service
  requiresModule: ticketing
  wave: 1
  capability: C36
  implementation:
    app: guest-web
    route: /account-and-self-service/login-register
    component: apps/guest-web/src/routes/account-and-self-service/LoginRegisterList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    - WEB-010
    - WEB-008
    - WEB-012
    - WEB-005
    - WEB-049
    inferred: true
    exitTo:
    - WEB-001
    - WEB-010
    - WEB-011
    - WEB-012
    - WEB-017
    - WEB-018
    - WEB-019
    transitions:
    - to: WEB-017
      trigger: My Account Dashboard
      provenance: 'derived — WEB-017 declares entryState.params deviceId, itemId, token and WEB-016 holds
        none of them. The edge carries nothing: deviceId, itemId, token only pre-select (deep link or
        optional), and WEB-017 opens on its own'
    - to: WEB-018
      trigger: My Tickets
      provenance: 'derived — WEB-018 declares entryState.params entitlementId, orderId and WEB-016 holds
        none of them. The edge carries nothing: entitlementId, orderId only pre-select (deep link or optional),
        and WEB-018 opens on its own'
    - to: WEB-019
      trigger: Order History
      provenance: 'derived — WEB-019 declares entryState.params documentId, invoiceId, orderId and WEB-016
        holds none of them. The edge carries nothing: orderId only pre-selects (deep link or optional);
        WEB-019 finds invoiceId (listTaxInvoices) itself; WEB-019 opens on listMyOrders, and documentId
        has no source on WEB-019 yet (a gap in WEB-019, not in this edge)'
    - to: WEB-010
      trigger: Signed in and verified — back to the cart
      precondition: arrived from the cart
      carries:
      - cartId
      provenance: decided 17 September 2026 — no order against an unproven contact; rule on identity verifyGuestEmail,
        per-site guestCheckout off by default (matrix 2.6.28)
    - to: WEB-011
      trigger: Guest Details & Attendee Forms
      provenance: 'derived — WEB-011 declares entryState.params deviceId, itemId and WEB-016 holds none
        of them. The edge carries nothing: deviceId, itemId only pre-select (deep link or optional), and
        WEB-011 opens on its own'
    - to: WEB-012
      trigger: Checkout — Payment
      provenance: 'derived — WEB-012 declares entryState.params orderId, paymentId and WEB-016 holds none
        of them. The edge carries nothing: WEB-016 is opened from WEB-012, so this edge is the way back
        and WEB-012 keeps its own state'
    - to: GST-039
      trigger: They set a profile
      provenance: flow F56 step 3→4
      crossesDevice: true
      back: false
      carries:
      - subjectId
  notes: 'Purpose derived from the screen name and its operations on 17 August, not from a requirement.
    **Corrected 24 August**: removed getCurrentSession, logout, selectRole. **A guest surface has no roles
    to select and its own logout** — `selectRole` is ADR-0002 staff authorisation and `getCurrentSession`
    is the staff session. `guestLogout` and `getGuestSession` are the equivalents and both already existed.
    **The screen was calling the staff identity surface because nothing checked that a guest platform
    only calls guest operations.** **Rebuilt 28 September as a guest sign-in form** (decided 28 September,
    audit R167, R073 (a)): removed `login`, `startSsoAuthorization`, `completeSsoAuthorization`, `listSsoProviders`
    and the six MFA operations — guests have no enterprise SSO. **The second factor came back on 29 September,
    per venue** (see below). Password sign-in is `guestPasswordLogin`.


    **Rev 3 (decided 29 September).** **Guest two-step verification is a per-venue setting, off by default**
    (GAP-B1, per venue, `VenueSettings.identity.guestTwoStep`; supersedes the second part of audit R167,
    *no guest MFA*; the first part, no enterprise SSO for guests, stands). The prompt appears only when
    the guest signs in at, or acts at, a venue that has it on; enrolment is on the guest''s account (WEB-024).
    **Sign-in gate (REV3-3):** this screen is where WEB-008 (after add-ons) or WEB-012 (at payment) sends
    a guest who is not signed in, and it returns them to the cart with the basket kept; a guest code is
    offered instead when guest checkout is on (`FeatureToggle guestCheckout`, off by default; match returning
    guests by `GuestMatchPolicy.matchBy`; DG-1, no change). UAE Pass and linking guest checkouts are declared
    (GAP-B3, already).


    **The venue in context is sent** (decided 29 September, rev 3 GAP-B1, per venue): `verifyGuestOtp`,
    `guestPasswordLogin`, `guestSocialLogin`, `guestUaePassLogin` and `createMfaChallenge` take an optional
    `venueId`, the venue the app or booking is in, so the second factor is asked only where that venue
    has guest two-step verification on.


    **29 September (W1).** The guest pop-up asks only `guestContactFields` (Email only / + name / + mobile)
    and the code; after the code nothing is asked again and the guest returns to the cart and on to the
    T&Cs.'
  density: compact
  pattern: form
  patternReason: '**A sign-in form, not a list.** Four ways in (a one-time code, a password, Apple or
    Google, UAE Pass) and a way to register; `getGuestSession` is the one piece of context. Rebuilt 28
    September: the screen had been generated as a list of MFA methods and SSO providers, neither of which
    a guest has (decided 28 September, audit R167, R073 (a)). The second-factor prompt is back as a step
    of sign-in, only at a venue that has guest two-step verification on (decided 29 September, rev 3 GAP-B1).'
  purpose: 'Get a guest into the site, fast, on a device that may be shared: a one-time code to the email
    or mobile, a password, Apple or Google, or UAE Pass, or register a new account. **No enterprise SSO
    for guests** (decided 28 September, audit R167, first part). **A second factor only where the venue
    enabled guest two-step verification** (decided 29 September, rev 3 GAP-B1, per venue, superseding
    the second part of R167).'
  layout:
    template: form
    regions:
    - name: signIn
      slot: fields
      components:
      - kind: textField
        label: Email or mobile number
        operation: requestGuestOtp
        notes: '**Guest checkout asks only the configured fields** (W1): `BookingFlowSettings.guestContactFields`
          (email, mobile, name).'
        provenance: contract identity.yaml POST /auth/guest/otp
      - kind: primaryButton
        label: Send me a code
        operation: requestGuestOtp
        provenance: contract identity.yaml POST /auth/guest/otp
      - kind: textField
        label: Code
        operation: verifyGuestOtp
        notes: Shown once a code has been sent; `verifyGuestOtp` returns the `GuestSession`.
        provenance: contract identity.yaml POST /auth/guest/otp/verify
      - kind: primaryButton
        label: Sign in with the code
        operation: verifyGuestOtp
        provenance: contract identity.yaml POST /auth/guest/otp/verify
      - kind: textField
        label: Password
        operation: guestPasswordLogin
        notes: '**Password sign-in** (decided 28 September, audit R073 (a)): sends `identifier`, `password`
          and the device''s `deviceId` to `guestPasswordLogin`, which returns the same `GuestSession`.
          A wrong password, an unknown identifier and an account with no password are one answer (401)
          and the screen shows one message for all of them, never which it was. Signing in here ends this
          device''s previous guest session.'
        provenance: contract identity.yaml POST /auth/guest/password
      - kind: secondaryButton
        label: Sign in with password
        operation: guestPasswordLogin
        provenance: contract identity.yaml POST /auth/guest/password
      - kind: secondaryButton
        label: Continue with Apple or Google
        operation: guestSocialLogin
        provenance: contract identity.yaml POST /auth/guest/social
      - kind: secondaryButton
        label: Continue with UAE Pass
        operation: guestUaePassLogin
        provenance: contract identity.yaml POST /auth/guest/uae-pass
      - kind: secondaryButton
        label: Create an account
        operation: registerGuest
        provenance: contract identity.yaml POST /auth/guest/register
      - kind: textField
        label: Verification code
        notes: '**Only when the returned `GuestSession` has `requiresMfa`**, which happens only at a venue
          whose `VenueSettings.identity.guestTwoStep.enabled` is on and only for a guest who enrolled
          a method (the venue is the one the site or booking is in). `createMfaChallenge` (`action: signIn`)
          sends the code (authenticator, email code as fallback); the session is usable after `verifyMfaChallenge`.
          At a venue with it off, the default, nothing is asked.'
        operation: verifyMfaChallenge
        provenance: decided 29 September, rev 3 GAP-B1 (per venue)
    - name: session
      slot: context
      components:
      - kind: detailPanel
        label: Who is signed in on this device
        bindsTo: GuestSession
        columns:
        - GuestSession.subjectId
        - GuestSession.displayName
        - GuestSession.isVerified
        - GuestSession.identityProviders
        - GuestSession.preferredLanguage
        - GuestSession.expiresAt
        operation: getGuestSession
        notes: Shown only when a guest session already exists on this device, with a way to sign out so
          a shared device is handed over clean.
