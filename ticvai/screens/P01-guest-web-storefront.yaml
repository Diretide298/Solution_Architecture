        label: What stood out
        bindsTo: SubmitReviewRequest.aspects
        operation: submitReview
        notes: The venue's closed aspect set (Cleanliness, Staff, Food, Queues); multi-select, optional.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: textField
        label: Your comments
        bindsTo: SubmitReviewRequest.body
        operation: submitReview
        notes: Optional, any language. Id, subject, venue and time are set by the platform.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: detailPanel
        label: Survey
        bindsTo: FormDefinition
        operation: getForm
        notes: A triggered survey link (post-visit, post-scan, case closure) opens here with its formId;
          answered with `submitForm` (DI-391).
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
    - name: actionBar
      slot: publish
      components:
      - kind: primaryButton
        label: Submit review
        operation: submitReview
        provenance: contract marketing-crm.yaml POST /reviews
      - kind: secondaryButton
        label: Send survey
        operation: submitForm
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: secondaryButton
        label: Report a problem
        operation: raiseMyCase
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
  states:
    loading: Survey loads
    error: '**Could not submit. The answers are kept on the form, and the guest retries by pressing Submit
      again** — nothing resends by itself: guest web is online-only (docs/architecture/offline-and-sync.md,
      *B2C web: None*), so there is no outbox behind this screen. The retry reuses the first attempt''s
      `Idempotency-Key`, so a submit that did reach the server before the failure is not recorded as a
      second review.'
    emptyFirstRun: —
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: submitReview
