  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-012
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: partial
      view: Book → 'Payment' step; Config → Layout & locale → 'Payment outcome (demo)' = Interrupted /
        Declined for the failure states; Config → Steps & cards → 'Guest checkout (code proof)' for the
