  - id: formRequestGroupBooking
    component: modal
    trigger: Request group booking
    body: '**Collects what `requestGroupBooking` sends before it is called.** Required: `kind`, `packageProductId`,
      `preferredDate`, `expectedSize`. Optional: `organisationName`, `yearGroup`, `accessAndDietaryNeeds`,
      `celebrantName`, `celebrantTurningAge`, `allergiesAndRequests`. Dismissing sends nothing; the screen
      behind is unchanged.

      **30 September (client feedback, CLIENT-RESPONSE-30SEP 1).** The group ticket is chosen first (`packageProductId`:
      cards with the per-person price and the minimum group size), then *How many people* (`expectedSize`)
      as a number box the guest types into or steps with − and + (+10 on the app); no Group size dropdown.
      The estimate reads *<ticket> · Guests × <n>*.'
