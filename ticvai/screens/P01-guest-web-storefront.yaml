- id: WEB-024
  name: Devices, Wishlist & Consent
  module: Membership, Loyalty & Value
  requiresModule: marketing
  wave: 1
  capability: C93
  implementation:
    app: guest-web
    route: /membership-loyalty-and-value/devices-wishlist-consent
    component: apps/guest-web/src/routes/membership-loyalty-and-value/DevicesWishlistConsentDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
    - WEB-021
    - WEB-022
    - WEB-023
    inferred: true
    transitions:
    - to: WEB-021
      trigger: Wallet & Gift Cards
      provenance: 'derived — WEB-021 declares entryState.params cardCode, walletId and WEB-024 holds none
        of them. The edge carries nothing: cardCode, walletId only pre-select (deep link or optional),
        and WEB-021 opens on its own'
    - to: WEB-022
      trigger: Membership Plans
      provenance: 'derived — WEB-022 declares entryState.params productId and WEB-024 holds none of them.
        The edge carries nothing: WEB-022 finds productId (listProducts) itself, and WEB-022 opens on
        its own'
    - to: WEB-023
      trigger: Membership Management
      provenance: 'derived — WEB-023 declares entryState.params caseId, orderId, statementId and WEB-024
        holds none of them. The edge carries nothing: orderId, caseId, statementId only pre-select (deep
        link or optional), and WEB-023 opens on its own'
    - to: GST-037
      trigger: Offers are shown against what they hold
      provenance: flow F53 step 2→3
      crossesDevice: true
      back: false
  notes: 'Purpose derived from the screen name and its operations on 17 August, not from a requirement.
    **Renamed 31 August** from *Loyalty & Rewards*. **A guest surface is one product with two renderings**
    — a screen named differently on web and app is two screens to a developer and one journey to a guest.


    **Rev 3 (decided 29 September).** **Security (GAP-D1):** the devices list and signing out a lost device
    are here (`listGuestDevices`, `revokeGuestDevice`, already declared). **Face Pass stays mobile-only**
    (GST-069) until the facial-reader vendor SDK is named and supports web capture; viewing and withdrawing
    an enrolment stay here. **Two-step verification (GAP-B1, per venue):** enrolment appears only when
    a venue of the tenant enabled it. **One implementation, several ids (GAP-D3):** WEB-009 and WEB-024
    are built as one account area; both ids are kept.


    **The Face Pass enrolmentId comes from the guest''s passes (listMyEntitlements, Entitlement.facePassEnrolmentId),
    bound 4 October 2026** (CHG-FXS-003)'
  density: compact
  pattern: listDetail
  patternReason: '`listGuestDevices` reads the population and `getWishlist` reads one of them — list,
    select, act'
  purpose: Your devices, security, cookie choices and data rights.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every guest device
        bindsTo: GuestDevice
        columns:
        - GuestDevice.platform
        - GuestDevice.tokenFingerprint
        - GuestDevice.status
        - GuestDevice.failureCount
        - GuestDevice.registeredAt
        - GuestDevice.lastSeenAt
        operation: listGuestDevices
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}/devices
      - kind: dataTable
        label: Every delegated access
        bindsTo: DelegatedAccess
        columns:
        - DelegatedAccess.permission
        - DelegatedAccess.overObjectRef
        - DelegatedAccess.delegationKind
        - DelegatedAccess.quota
        - DelegatedAccess.isRevocableBySubject
        - DelegatedAccess.effect
        operation: listDelegations
        provenance: contract identity.yaml GET /guests/{subjectId}/delegations
      - kind: confirmDialog
        derived: true
        label: Confirm
        notes: '**The consequence goes in the body, not the title.** *Cancel 3 orders worth AED 480* is
          a confirmation; *are you sure* is not — and a dialog that cannot name what it destroys is a
          dialog somebody dismisses.


          **Added 31 August.** `confirmDialog` and `modal` were both in the component library and used
          **zero times across 492 screens**, while `destructiveButton` was used 39 times and its own entry
          reads *always requires confirmation*.'
        provenance: carried from the previous definition
      - kind: consentBlock
        label: What we may send you
        bindsTo: ConsentState.purposes
        operation: getGuestConsents
        notes: One row per configured purpose (`listConsentPurposes`), its channels as toggles, its plain-language
          description and the notice version in force; the current position from `getGuestConsents` (Given
          with date, Withdrawn with date, Not asked, Needs renewing). A change is recorded at once with
          `recordConsent` (source and notice version set by the app; the guest never types a purpose,
          decision, source or time). Withdrawing is as easy as giving.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: cardList
        label: Purposes and notices
        operation: listConsentPurposes
        notes: The configured purposes with their plain-language description, channels and the notice
          version in force.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: toggle
        label: Consent toggle
        operation: recordConsent
        notes: Per purpose and channel; recorded at once on change, append-only.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
        bindsTo: ConsentState.purposes
      - kind: cardList
        label: Passes with a face
        bindsTo: Entitlement
        operation: listMyEntitlements
        columns:
        - Entitlement.productId
        - Entitlement.validTo
        - Entitlement.facePassEnrolmentId
        notes: Only passes with a facePassEnrolmentId; selecting one reads it.
        provenance: contract access.yaml Entitlement (defined 4 October 2026, CHG-FXS-003)
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected guest device
        bindsTo: GuestDevice
        columns:
        - GuestDevice.platform
        - GuestDevice.tokenFingerprint
        - GuestDevice.tokenRef
        - GuestDevice.status
        - GuestDevice.failureCount
        - GuestDevice.registeredAt
        - GuestDevice.lastSeenAt
        - GuestDevice.revokedAt
        operation: listGuestDevices
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}/devices
      - kind: selectField
        label: Whose Face Pass
        bindsTo: DelegatedAccess
        columns:
        - DelegatedAccess.overSubjectId
        - DelegatedAccess.delegationKind
        operation: listDelegations
        notes: '**Who is this for** (decided 28 September, audit R205): the signed-in guest and each child
          linked to them (`heldByThisGuest` with `delegationKind` `familyMember` or `primaryHolder`),
          so a parent sees and can revoke a child''s enrolment here. Enrolling is app-only (GST-069),
          where the same pick sets the `subjectId` `enrolFacePass` sends; no guardian field is collected
          — the server records the caller as guardian. A 403 `subject-not-linked` says the person is no
          longer linked.'
        provenance: contract identity.yaml GET /guests/{subjectId}/delegations
      - kind: detailPanel
        label: The face pass enrolment
        bindsTo: FacePassEnrolment
        columns:
        - FacePassEnrolment.id
        - FacePassEnrolment.subjectId
        - FacePassEnrolment.entitlementId
        - FacePassEnrolment.kind
        - FacePassEnrolment.retentionAnchor
        - FacePassEnrolment.source
        - FacePassEnrolment.capturedAt
        - FacePassEnrolment.consentPurposeId
        - FacePassEnrolment.consentGivenAt
        - FacePassEnrolment.guardianSubjectId
        - FacePassEnrolment.isActive
        - FacePassEnrolment.expiresAt
        operation: getFacePassEnrolment
        provenance: contract access.yaml GET /face-pass/enrolments/{enrolmentId}
      - kind: detailPanel
        label: The consent state
        bindsTo: ConsentState
        columns:
        - ConsentState.subjectId
        - ConsentState.purposes
        operation: getGuestConsents
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}/consents
      - kind: detailPanel
        label: Waiver status
        operation: getWaiverStatus
        notes: Shows `isSatisfied`, `missingFormIds`, `expiringWithinDays` from `getWaiverStatus`'s inline
          response. **The response has no named schema**, so this cannot bind until the contract names
          one.
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}/waiver-status
      - kind: detailPanel
        label: The wishlist
        bindsTo: Wishlist
        columns:
        - Wishlist.subjectId
        - Wishlist.items
        operation: getWishlist
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}/wishlist
      - kind: cardList
        label: Two-step verification
        notes: '**Offered only when at least one venue of the tenant has guest two-step verification on**
          (`VenueSettings.identity.guestTwoStep.enabled`); otherwise the section is not shown. Enrolment
          is on the guest''s account (enrol, verify, remove); the code is then asked only when signing
          in or acting at a venue that has it on.'
        operation: listMfaMethods
        provenance: decided 29 September, rev 3 GAP-B1 (per venue)
      - kind: cardList
        label: Notifications on my devices
        notes: Push registrations (`listGuestDevices`). "Stop notifications on this device" (`revokeGuestDevice`)
          stops notifications; it does not sign a lost device out. No guest operation lists or ends other
          sessions yet (CHG-SGU-024).
        operation: listGuestDevices
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
    - name: actionBar
      slot: rowActions
      components:
      - kind: destructiveButton
        label: Stop notifications on this device
        operation: revokeGuestDevice
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: destructiveButton
        label: Delete my account
        operation: deleteGuestAccount
        provenance: contract identity.yaml DELETE /auth/guest/account
      - kind: secondaryButton
        label: Get a copy of my data
        operation: exportSubjectData
        provenance: contract identity.yaml POST /guests/{subjectId}/data-export
      - kind: destructiveButton
        label: Revoke face pass
        operation: revokeFacePass
        provenance: contract access.yaml DELETE /face-pass/enrolments/{enrolmentId}
  overlays:
  - id: confirmRevokeGuestDevice
    component: confirmDialog
    trigger: Stop notifications on this device
    body: '**Names what `revokeGuestDevice` changes and what it leaves alone**, in the consequence rather
      than the verb. A devices wishlist consent this affects should be identified in the dialog, not just
      counted.'
    provenance: client-verified
  - id: confirmDeleteGuestAccount
    component: confirmDialog
    trigger: Delete my account
    body: '**Names what `deleteGuestAccount` changes and what it leaves alone**, in the consequence rather
      than the verb. A devices wishlist consent this affects should be identified in the dialog, not just
      counted.'
    provenance: client-verified
  - id: confirmRevokeFacePass
    component: confirmDialog
    trigger: Revoke face pass
    body: '**Names what `revokeFacePass` changes and what it leaves alone**, in the consequence rather
      than the verb. A devices wishlist consent this affects should be identified in the dialog, not just
      counted.'
    provenance: client-verified
  states:
    loading: Points and rewards
    error: Could not load
    emptyFirstRun: No points yet — explains how they accrue
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from here**
      — an empty list with the filter state hidden elsewhere is a person who thinks the data is gone.
      **Added 25 August with the derived list component**: a screen that lists has to say what it shows
      when the list is empty, and this screen gained the list before it gained the sentence.'
    emptyNoAccess: 'Shown when the caller lacks `GUEST_VIEW`, which `getGuestConsents` requires to show
      this screen, and names that permission (the screen''s other reads need `ORDER_VIEW` and say so in
      their own panels). **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question. A caller who can see the screen but lacks what an action needs
      sees that action disabled, naming its permission: `GUEST_MANAGE` for `revokeFacePass`; `GUEST_VIEW_PII`
      for `exportSubjectData`.'
    offline: '**Nothing here is offered offline, and the banner says so.** An erasure request or a device
      change queued and never sent is worse than one that could not be made — the legal clock starts when
      the platform receives it, and a device signed out offline is still signed in.'
  apis:
  - operationId: getWishlist
    contract: marketing-crm
    purpose: Read a guest's saved items
    trigger: onLoad
  - operationId: listGuestDevices
    contract: marketing-crm
    purpose: A guest's registered devices
    trigger: onLoad
  - operationId: recordConsent
    contract: marketing-crm
    purpose: Record a consent decision
    trigger: onAction
    invalidates:
    - listGuestDevices
  - operationId: revokeGuestDevice
    contract: marketing-crm
    purpose: Revoke a device registration
    trigger: onAction
    invalidates:
    - listGuestDevices
  - operationId: deleteGuestAccount
    contract: identity
    purpose: Ask for the account to be deleted
    trigger: onAction
  - operationId: exportSubjectData
    contract: identity
    purpose: Export everything held about this guest
    trigger: onAction
  - operationId: getFacePassEnrolment
    contract: access
    purpose: Whether a face pass is enrolled on this account
    trigger: onAction
  - operationId: getGuestConsents
    contract: marketing-crm
    purpose: What this guest has consented to
    trigger: onLoad
  - operationId: getWaiverStatus
    contract: marketing-crm
    purpose: Which waivers are signed and which are due
    trigger: onLoad
  - operationId: listDelegations
    contract: identity
    purpose: Who may act for this guest
    trigger: onLoad
  - operationId: revokeFacePass
    contract: access
    purpose: Revoke it after losing the phone that made it
    trigger: onAction
  - operationId: listMfaMethods
    contract: identity
    purpose: The guest's enrolled second-factor methods
    trigger: onLoad
  - operationId: enrolMfaMethod
    contract: identity
    purpose: Enrol an authenticator (email code as fallback)
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: verifyMfaEnrolment
    contract: identity
    purpose: Confirm the enrolment with a first code
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: removeMfaMethod
    contract: identity
    purpose: Remove a method
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: getCookieConsentRuntime
    contract: marketing-crm
    purpose: 'Preference centre: categories and the current decision'
    trigger: onLoad
    provenance: build, 29 September 2026
  - operationId: listPublishedTrackingTechnologies
    contract: marketing-crm
    purpose: Each cookie's name, provider, purpose, expiry and party
    trigger: onLoad
    provenance: build, 29 September 2026
  - operationId: getDeviceConsentHistory
    contract: marketing-crm
    purpose: My cookie decisions so far
    trigger: onLoad
    provenance: build, 29 September 2026
  - operationId: recordDeviceConsent
    contract: marketing-crm
    purpose: Change or withdraw cookie preferences
    trigger: onAction
    provenance: build, 29 September 2026
  - operationId: listConsentPurposes
    contract: marketing-crm
    purpose: The purposes the consent rows show
    trigger: onLoad
  - operationId: listMyEntitlements
    contract: access
    purpose: The guest's passes, each with its facePassEnrolmentId for getFacePassEnrolment and revokeFacePass
    trigger: onLoad
    provenance: defined 4 October 2026 (CHG-FXS-003)
  entryState:
    params:
    - name: deviceId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen lists them with `listGuestDevices`
        and the user picks one; an edge that holds one may still carry it to open on that record.'
    - name: itemId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): no operation on the screen takes it; a link that
        carries it only pre-selects the record.'
    - name: subjectId
      from: session
    - name: enrolmentId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `enrolMfaMethod`;
        a link or an edge that holds one opens it instead.'
    - name: methodId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen lists them with `listMfaMethods`
        and the user picks one; an edge that holds one may still carry it to open on that record.'
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `deviceId`, `itemId`.'
    preloaded:
    - GuestDevice.id
    - GuestDevice.subjectId
    - GuestDevice.platform
    - GuestDevice.tokenFingerprint
    - GuestDevice.tokenRef
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-024
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: partial
      view: Account → 'Security' (devices), 'Face Pass', 'Data & privacy', 'Newsletters' (devices that
        get notifications)
      differences: Spread across four panes rather than one screen; wishlist is its own view (WEB-009).
        Security pane includes passkeys and two-step verification, which the YAML does not have for guests.
        YAML purpose text still says 'See loyalty & rewards' (stale).
  apisNote: 'Rebuilt 9 September 2026 from the 7 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  gaps:
  - operation: getWaiverStatus
    why: '**`getWaiverStatus` declares its response inline**, so the component that shows it names fields
      but binds to no schema. The contract should name the shape.'
    source: contract marketing-crm.yaml GET /guests/{subjectId}/waiver-status
