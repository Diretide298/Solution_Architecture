    confirm:
      label: Link guest checkout
      operation: linkGuestCheckout
    dismiss:
      label: Cancel
      discards:
      - orderReference
      - verificationCode
    provenance: client-verified
  - id: formRefreshToken
    component: modal
    trigger: Refresh token
    body: '**Collects what `refreshToken` sends before it is called.** Required: `refreshToken`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Refresh token
      operation: refreshToken
    dismiss:
      label: Cancel
      discards:
      - refreshToken
    provenance: client-verified
  - id: formRequestGuestOtp
    component: modal
    trigger: Send me a code
    body: '**Collects what `requestGuestOtp` sends before it is called.** Required: `identifier`, `channel`.
