- id: WEB-047
  name: Map Booking — Cabanas & Spots
  module: Booking & Selection
  requiresModule: resources
  wave: 3
  implementation:
    app: guest-web
    route: /booking-and-selection/map-booking
    component: apps/guest-web/src/routes/booking-and-selection/MapBookingCanvas.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-004
    exitTo:
    - WEB-004
    - WEB-008
    - WEB-010
    transitions:
    - to: WEB-010
      trigger: Go to checkout
      operation: addCartLine
      carries:
      - cartId
      precondition: a spot is held and added
      provenance: decided 29 September, rev 3 REV3-15
    - to: WEB-008
      trigger: Continue to add-ons (rentals, towels)
      carries:
      - cartId
      provenance: decided 29 September, rev 3 REV3-15; prototype cabana flow add-ons step
    - to: WEB-004
      trigger: Back to the product
      back: true
      provenance: decided 29 September, rev 3 REV3-15
      carries:
      - productId
  notes: '**New 29 September** (decided 29 September, rev 3 REV3-15 and GAP-C2). **Cabana maps work like
    the stadium seat map:** the venue''s map is ingested with its cabanas, loungers and other bookable
    spots (number, zone, capacity, price band), and the guest picks a specific one on the map and buys
    it. This supersedes audit R073 (c) (*cabanas stay staff-booked*) for resources placed on an ingested
    map. **Tables on the map are non-dining spots sold like cabanas** (decided 29 September by the user);
    a restaurant table stays the F&B reservation flow (WEB-036 / GST-070). The map comes from `getVenueMap`
    (its `resources`: label, kind, zone, capacity, price band, boundary) and the status of every spot
    for the chosen day from one `getMapResourceAvailability` call, joined on `resourceId`; held, booked
    and unavailable spots are greyed. Tapping a free spot calls `createResourceHold` and starts the *Remaining
    time* counter from the hold''s `expiresAt` (8 minutes, extendable to 30 in all, audit R169); Add to
    basket sends `addCartLine` with the spot''s price-band `variantId` and the `resourceHoldId`, e.g.
    *Cabana B09 · Large cabana · Beach, AED 1,855*. Picking another spot releases the first hold (`relinquishResourceHold`).


    **29 September (W6).** Map booking of cabanas stays **optional per flow**: the venue picks *Cabana:
    pick on map* (WEB-047) or *Cabana: by size* (capacity) as its booking flow (CMS-103), and the resource
    selection policy (`guestMayChoose`, REV3-15) decides whether the guest chooses the unit. Same venue-map
    back end as F&B and locations.'
  density: compact
  pattern: listDetail
  patternReason: '`getMapResourceAvailability` reads the population of spots and a tap holds one of them
    — list (as a map), select, act'
  purpose: Pick a specific cabana, lounger or other spot on the venue map and hold it while you book.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: datePicker
        label: Date
        notes: Sends `from`/`to` (the venue's opening for the day, or a slot) to `getMapResourceAvailability`.
        operation: getMapResourceAvailability
        provenance: decided 29 September, rev 3 REV3-15
      - kind: numberField
        label: Who is coming
        notes: '`partySize`; a spot smaller than the party is refused `422 party-exceeds-capacity`.'
        operation: createResourceHold
        provenance: decided 29 September, rev 3 REV3-15
      - kind: selectField
        label: Area
        bindsTo: PlacedResource.zone
        notes: Beach, Tower, Riverside, Splash zone… from the placed resources' zones.
        operation: getVenueMap
        provenance: decided 29 September, rev 3 REV3-15; prototype cabana map
      - kind: seatMap
        label: Venue map
        bindsTo: VenueMapDetail.resources
        notes: The ingested map with every placed spot drawn at its boundary and numbered (R01-R10, T01-T08,
          S01-S06, B01-B10 on Coastal Aqua). Free spots are tappable; held, booked and unavailable ones
          greyed.
        operation: getVenueMap
        provenance: decided 29 September, rev 3 REV3-15, GAP-C2
      - kind: cardList
        label: Spots
        bindsTo: MapResourceAvailability.resources
        notes: 'The same spots as a list for the chosen area: number, capacity, price band and price,
          status. The accessible alternative to the map.'
        operation: getMapResourceAvailability
        provenance: decided 29 September, rev 3 REV3-15
      - kind: selectField
        label: Map
        bindsTo: BookableVenueMaps.maps
        operation: listBookableVenueMaps
        notes: '**Which map to book on.** `listBookableVenueMaps(venueId, productId)` returns the venue''s
          published maps that carry bookable spots; with one map the screen opens it directly and this
          choice is not shown. The chosen map''s `mapId` is what `getVenueMap` (at its `publishedVersion`)
          and `getMapResourceAvailability` read (decided 29 September, rev 3 REV3-15).'
        provenance: contract venue-map.yaml GET /bookable-venue-maps
    - name: contextPanel
      slot: selection
      components:
      - kind: banner
        label: Remaining time
        bindsTo: ResourceHold.expiresAt
        notes: Counts down from the hold's `expiresAt`, always visible. At zero the spot is released and
          the guest is told.
        operation: getResourceHold
        provenance: decided 29 September, rev 3 REV3-15; audit R169
      - kind: detailPanel
        label: The spot you picked
        bindsTo: PlacedResource
        columns:
        - PlacedResource.label
        - PlacedResource.kind
        - PlacedResource.zone
        - PlacedResource.capacity
        - PlacedResource.priceBandCode
        operation: getVenueMap
        provenance: decided 29 September, rev 3 REV3-15
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add to basket
        notes: Sends `variantId` (the spot's price band) and `resourceHoldId`.
        operation: addCartLine
        provenance: decided 29 September, rev 3 REV3-15
      - kind: secondaryButton
        label: Keep it longer
        operation: extendResourceHold
        provenance: decided 29 September, rev 3 REV3-15
      - kind: secondaryButton
        label: Pick another
        notes: Releases the hold at once so the spot is free for others.
        operation: relinquishResourceHold
        provenance: decided 29 September, rev 3 REV3-15
  states:
    loading: The venue map and the status of every spot for the day, read together.
    error: Could not load the map or the spots. Names which read failed; nothing is held.
    emptyFirstRun: '**No bookable spots are placed on this map yet.** Says so and offers the venue''s
      other ways to book, rather than an empty map.'
    emptyNoResults: Every spot in this area is taken for the day. Names the area and offers another area
      or day.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** The map and the spots already loaded stay on screen with their
      age, never shown as free now. Holding a spot and adding it to the basket need the connection — a
      cabana held offline is a cabana two people think they have.'
  apis:
  - operationId: getVenueMap
    contract: venue-map
    purpose: The map with its placed spots (label, kind, zone, capacity, price band)
    trigger: onLoad
  - operationId: getMapResourceAvailability
    contract: resources
    purpose: Every spot's status for the day in one call
    trigger: onLoad
  - operationId: createResourceHold
    contract: resources
    purpose: Hold the tapped spot for the window
    trigger: onAction
    invalidates:
    - getMapResourceAvailability
  - operationId: getResourceHold
    contract: resources
    purpose: The hold's countdown
    trigger: onInterval
  - operationId: extendResourceHold
    contract: resources
    purpose: Keep the hold longer while paying
    trigger: onAction
  - operationId: relinquishResourceHold
    contract: resources
    purpose: Release the hold
    trigger: onAction
    invalidates:
    - getMapResourceAvailability
  - operationId: addCartLine
    contract: orders
    purpose: Add the held spot to the basket (`variantId`, `resourceHoldId`)
    trigger: onAction
  - operationId: listBookableVenueMaps
    contract: venue-map
    purpose: Find the venue's published map with bookable spots (with productId when the product page
      opened it); getVenueMap then reads that map's published version (decided 29 September, rev 3 REV3-15)
    trigger: onLoad
  entryState:
    params:
    - name: mapId
      from: WEB-004
      optional: true
    - name: productId
      from: WEB-004
      optional: true
    - name: cartId
      from: session
    - name: venueId
      from: session
    - name: holdId
      from: navigation
    coldEntry: '**A link to a map that is no longer published, or a day that has passed,** says which
      and offers today on the current map. Nothing is held on arrival.'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-047
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: Coastal Aqua → 'Cabana & locker rentals' → cabana map ('Remaining time' counter)
  apisNote: Authored 29 September 2026 from the rev 3 decisions and the client prototype view named in
    `wireframe.prototype`; every operation exists in the contracts (decided 29 September, rev 3).
  overlays:
  - id: confirmReleaseHold
    component: confirmDialog
    trigger: Pick another (or tapping a second spot)
    body: '**Release the spot you are holding?** It goes back on the map at once and someone else may
      take it.'
    confirm:
      label: Release it
      operation: relinquishResourceHold
    dismiss:
      label: Keep it
      carries:
      - holdId
    provenance: client-verified
- id: WEB-048
  name: Book a Space by the Hour
  module: Booking & Selection
  requiresModule: resources
  wave: 3
  implementation:
    app: guest-web
    route: /booking-and-selection/space-by-the-hour
    component: apps/guest-web/src/routes/booking-and-selection/SpaceByTheHourWizard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-004
    exitTo:
    - WEB-004
    - WEB-010
    transitions:
    - to: WEB-010
      trigger: Add to basket, then review the cart
      operation: addCartLine
      carries:
      - cartId
      precondition: date, start time, length and room type chosen
      provenance: decided 29 September, rev 3 REV3-13
    - to: WEB-004
      trigger: Back to the product
      back: true
      provenance: decided 29 September, rev 3 REV3-13
      carries:
      - productId
  notes: '**New 29 September** (decided 29 September, rev 3 REV3-13: meeting rooms by the hour are in
    scope). A staged booking: date → start time → length (1 hour, 2 hours, half day, full day) → room
    type (focus pod, majlis, boardroom, auditorium) → attendees → add-ons (coffee break, working lunch,
    AV technician). **A room type is a product with `requiresTimeWindow`; a length is one of its variants**
    (the `length` axis, each value with `durationMinutes`), priced on its own, so the price is the variant''s
    — the room rate for that length. The guest never names a room: `addCartLine` carries `bookedWindow`
    {startsAt, endsAt}, `endsAt` being the start plus the length, and `allocateResources` picks the room
    at checkout (26 August minute). Add-ons are lines with `parentLineId`. `422 windowLengthMismatch`,
    `windowRequired` and `windowNotAllowed` are programming errors; `409 windowUnavailable` says the time
    filled and offers the next free start.


    **29 September (W9).** Availability is checked against date, start time and length together (`listProductStartTimes`
    with `variantId` = length); changing any of the three re-checks every room, and a busy room shows
    *free from*. Starts every 15 minutes where the venue sets `stepMinutes` 15.'
  density: compact
  pattern: multiStepForm
  patternReason: A staged booking — date, start time, length, room type, attendees, add-ons — ending in
    one `addCartLine`; the prototype draws it as one step revealing each choice in turn
  purpose: Book a meeting room or other space for a start time and a length; the price is the room rate
    for that length.
  layout:
    template: wizard
    regions:
    - name: contentBody
      slot: fields
      components:
      - kind: datePicker
        label: Select a date
        provenance: decided 29 September, rev 3 REV3-13
      - kind: selectField
        label: Start time
        bindsTo: ProductStartTime
        notes: The start times at which a room of the chosen type is free for the chosen length (`listProductStartTimes`
          with `productId`, `variantId` = the length, `date`; hourly, 08:00-20:00 in the prototype), each
          with how many rooms of the type are left. The chosen start and start + length go to `addCartLine`
          as `bookedWindow`.
        operation: listProductStartTimes
        provenance: decided 29 September, rev 3 REV3-13
      - kind: selectField
        label: How long
        bindsTo: ProductVariant
        notes: '1 hour, 2 hours, half day (4 h), full day (8 h): the room type''s `length` variants, each
          priced on its own (the prototype shows *Save 10%* and *Save 15%*).'
        operation: listProductVariants
        provenance: decided 29 September, rev 3 REV3-13
      - kind: cardList
        label: Choose a room
        bindsTo: Product
        notes: Room types (focus pod, majlis room, boardroom, auditorium) with capacity, description,
          badge and the price for the chosen length.
        operation: listProducts
        provenance: decided 29 September, rev 3 REV3-13
      - kind: numberField
        label: Attendees
        notes: For the visitor list at reception; a room type smaller than the party is not offered.
        provenance: decided 29 September, rev 3 REV3-13
      - kind: cardList
        label: Add to the booking
        bindsTo: Product
        notes: 'Coffee break, working lunch, AV technician: add-on lines with `parentLineId`.'
        operation: listProducts
        provenance: decided 29 September, rev 3 REV3-13
    - name: actionBar
      slot: submit
      components:
      - kind: primaryButton
        label: Add to basket
        notes: '`variantId` (the length), `bookedWindow` {startsAt, endsAt}, then the add-on lines.'
        operation: addCartLine
        provenance: decided 29 September, rev 3 REV3-13
  states:
    loading: The room types and their lengths for this venue.
    error: Could not load. Names which read failed; nothing is booked.
    emptyFirstRun: '**This venue sells no space by the hour yet.** Says so rather than an empty list.'
    emptyNoResults: No room of the type is free at that time for that length. Offers the next free start
      time.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** Rooms and times already loaded stay on screen with their age.
      Picking a start time and adding the booking need the connection — a room held offline is a room
      two people think they have.'
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: Room types sold by the hour (`requiresTimeWindow`) and their add-ons
    trigger: onLoad
  - operationId: listProductVariants
    contract: catalogue
    purpose: The lengths of a room type, each with its price
    trigger: onLoad
  - operationId: listProductStartTimes
    contract: resources
    purpose: Start times free for the room type and length on the date
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Add the room type for the booked window, then the add-ons
    trigger: onAction
  entryState:
    params:
    - name: productId
      from: WEB-004
      optional: true
    - name: cartId
      from: session
    coldEntry: Resolves the venue from the site and lists its room types; nothing is booked on arrival.
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-048
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: exact
      view: House of Pages → 'Meeting room by the hour'
  apisNote: Authored 29 September 2026 from the rev 3 decisions and the client prototype view named in
    `wireframe.prototype`; every operation exists in the contracts (decided 29 September, rev 3).
- id: WEB-049
  name: Transport — Route & Schedule
  module: Transport
  requiresModule: transport
  wave: 3
  implementation:
    app: guest-web
    route: /transport/route-and-schedule
    component: apps/guest-web/src/routes/transport/RouteAndScheduleSplit.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
    - WEB-007
    - WEB-010
    - WEB-016
    transitions:
    - to: WEB-007
      trigger: Choose seats on this departure
      carries:
      - performanceId
      precondition: the departure has a seat map
      provenance: 'decided 29 September, rev 3 REV3-21: seat selection reuses the seat map on the departure''s
        performanceId (step 2 of 3)'
    - to: WEB-010
      trigger: Continue to payment
      operation: addCartLine
      carries:
      - cartId
      provenance: decided 29 September, rev 3 REV3-21 (step 3 of 3)
    - to: WEB-016
      trigger: Sign in to save or see favourite routes
      returnsTo: WEB-049
      provenance: decided 29 September, rev 3 REV3-21
      carries:
      - subjectId
    - to: WEB-001
      trigger: Home
      back: true
      provenance: decided 29 September, rev 3 REV3-21
  notes: '**New 29 September** (decided 29 September, rev 3 REV3-21: transport ticketing is in scope —
    stations, routes, timetabled departures, one-way trips, multi-trip passes, favourite routes and a
    route map). **One-way:** From and To stations with a swap, the travel date (timetables are released
    30 days ahead), the passengers (adult; child and student half fare; a person of determination travels
    free — proof is checked by the driver at boarding), a time period with its departure count, then departure
    cards (departs, arrives, duration, seats left, fare). **Next Available Trip** jumps to the first departure
    with room. A chosen departure shows a price card and the stop list with *Show full route* and a street
    map. **The street map needs the internet** and a third-party tile provider approved under audit R038;
    the stop list and schematic line need neither. Buying a trip is `addCartLine` with `attributes.transport`
    (route, stations, passenger type); the price comes from `quoteTransportFare`, and a departure with
    a seat map goes through seat selection on its `performanceId`. **Multi-trip:** 5- and 10-trip cards
    and weekly or monthly unlimited passes for the station pair, with the saving. **Favourites:** saved
    routes, *Book this route* prefills one-way; remove. *Change your trip free up to two hours before
    departure* is the proposed default of the venue''s modification policy, client to correct. **The real
    network (stations, fares, timetable) is an open value from the client**; the prototype''s Emirates
    Link data is illustrative.

    **30 September (client feedback, CLIENT-RESPONSE-30SEP 5 and 6).** **A route opens with its stations
    filled in:** entered from a route (a transport product or a route card), From and To are that
    route''s first and last stops (for example E201: Abu Dhabi Central Bus Station to Al Ain Central Bus
    Station); the guest can still change or swap them. **Departures show straight away** for those
    stations and the date (`searchTransportDepartures` on load and on every change), with no need to
    press *Search Trips*; the time-period buttons filter the departures listed, and pressing the chosen
    period again shows them all. **Passengers appear only after a departure is chosen** (the departure
    first, then the tickets). The client build also has a *Popular routes* card view (route cards with a
    from-fare and *Book*, then the date, the departures and the passengers; on the app the first
    transport product); a route list with a from-fare is not in the contract yet (a question of 1
    October), so it is not specified here.'
  density: compact
  pattern: listDetail
  patternReason: '`searchTransportDepartures` reads the population of departures and one is chosen for
    a price card and a route — list, select, act; the prototype draws one-way, multi-trip and favourites
    as tabs of one view'
  purpose: Find a departure between two stations and buy a trip, a multi-trip or unlimited pass, or rebook
    a saved route.
  openQuestions:
  - The real network — stations, routes, fares and timetable — is an open value from the client (decided
    29 September, rev 3 REV3-21); the prototype's Emirates Link stations and prices are illustrative.
  - The street-map tile provider needs approval under audit R038; the approver is still to be named by
    the client.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: filters
      components:
      - kind: selectField
        label: Trip type
        notes: One-way trip, Multi-trip, Favourites (tabs).
        provenance: decided 29 September, rev 3 REV3-21; prototype tabs
      - kind: selectField
        label: From
        bindsTo: Station
        operation: listTransportStations
        provenance: decided 29 September, rev 3 REV3-21
      - kind: selectField
        label: To
        bindsTo: Station
        operation: listTransportStations
        provenance: decided 29 September, rev 3 REV3-21
      - kind: iconButton
        label: Swap stations
        notes: Swaps From and To and picks the paired route the other way.
        operation: listTransportRoutes
        provenance: decided 29 September, rev 3 REV3-21
      - kind: datePicker
        label: Travel date
        notes: Timetables are released 30 days ahead.
        provenance: decided 29 September, rev 3 REV3-21
      - kind: numberField
        label: Passengers
        bindsTo: PassengerType
        notes: Adult, child 5-11 and student at half fare, person of determination free (one companion
          at the adult fare); proof is checked at boarding.
        operation: getTransportFareTable
        provenance: decided 29 September, rev 3 REV3-21
      - kind: selectField
        label: Time period
        notes: Morning, Afternoon, Evening, Night, each with its count of departures.
        operation: searchTransportDepartures
        provenance: decided 29 September, rev 3 REV3-21
      - kind: cardList
        label: Departures
        bindsTo: DepartureOffer
        columns:
        - DepartureOffer.routeCode
        - DepartureOffer.departsAt
        - DepartureOffer.arrivesAt
        - DepartureOffer.durationMinutes
        - DepartureOffer.seatsLeft
        - DepartureOffer.fare
        operation: searchTransportDepartures
        provenance: decided 29 September, rev 3 REV3-21
      - kind: cardList
        label: Multi-trip cards
        bindsTo: PassOffer
        columns:
        - PassOffer.name
        - PassOffer.trips
        - PassOffer.validityDays
        - PassOffer.price
        - PassOffer.saving
        notes: The Multi-trip tab.
        operation: listTransportPassOffers
        provenance: decided 29 September, rev 3 REV3-21
      - kind: cardList
        label: Favourite routes
        bindsTo: FavouriteRoute
        columns:
        - FavouriteRoute.fromStationName
        - FavouriteRoute.toStationName
        - FavouriteRoute.adultFare
        notes: The Favourites tab; *Book this route* prefills the one-way tab. Signed-in guests only.
        operation: listMyFavouriteRoutes
        provenance: decided 29 September, rev 3 REV3-21
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Price card
        bindsTo: FareQuote
        notes: Line code and direction (e.g. E101-Out), departs, arrives, seats available, fare per passenger
          type and total.
        operation: quoteTransportFare
        provenance: decided 29 September, rev 3 REV3-21
      - kind: timeline
        label: Stops
        bindsTo: RouteMap.stops
        notes: 'From and To with the stops between folded: *Show full route (n stops)*.'
        operation: getTransportRouteMap
        provenance: decided 29 September, rev 3 REV3-21
      - kind: detailPanel
        label: Street map
        bindsTo: RouteMap
        notes: Needs the internet and a third-party tile provider approved under audit R038; hidden offline,
          where the stop list and schematic line remain.
        operation: getTransportRouteMap
        provenance: decided 29 September, rev 3 REV3-21
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Search Trips
        operation: searchTransportDepartures
        provenance: decided 29 September, rev 3 REV3-21
      - kind: secondaryButton
        label: Next Available Trip
        operation: getNextTransportDeparture
        provenance: decided 29 September, rev 3 REV3-21
      - kind: primaryButton
        label: Add to basket
        notes: 'A trip: the passenger type''s `variantId`, the departure''s `performanceId` and `attributes.transport`.
          A pass: the pass product''s `variantId`, no performance.'
        operation: addCartLine
        provenance: decided 29 September, rev 3 REV3-21
      - kind: secondaryButton
        label: Save route
        operation: saveFavouriteRoute
        provenance: decided 29 September, rev 3 REV3-21
      - kind: destructiveButton
        label: Remove favourite
        operation: deleteFavouriteRoute
        provenance: decided 29 September, rev 3 REV3-21
  states:
    loading: The stations, routes and passenger types.
    error: Could not load. Names which read failed; nothing is bought.
    emptyFirstRun: '**No routes are published for this venue yet.** Says so; the client still owes the
      real network (stations, fares, timetable).'
    emptyNoResults: No departure in that period. Names the period and offers **Next Available Trip** or
      another period or date.
    emptyNoAccess: 'Searching and buying need no account. **Favourites need a signed-in guest**: a guest
      who is not signed in is offered sign-in and brought back, never shown an empty list.'
    offline: '**The offline banner shows.** A route''s stop list and schematic line already loaded stay
      readable with their age; the street map needs the connection. Searching departures, buying a trip
      or a pass and saving a favourite route need the connection.'
  apis:
  - operationId: listTransportStations
    contract: transport
    purpose: The stations to pick From and To
    trigger: onLoad
  - operationId: listTransportRoutes
    contract: transport
    purpose: The routes between two stations (the swap uses the paired route)
    trigger: onAction
  - operationId: getTransportFareTable
    contract: transport
    purpose: Passenger types and fares of the route
    trigger: onLoad
  - operationId: searchTransportDepartures
    contract: transport
    purpose: Departures for the stations, date, period and party, with counts per period
    trigger: onLoad
  - operationId: getNextTransportDeparture
    contract: transport
    purpose: The next departure with room for the party
    trigger: onAction
  - operationId: getTransportRoute
    contract: transport
    purpose: The route and its stops
    trigger: onLoad
  - operationId: getTransportRouteMap
    contract: transport
    purpose: Stop list, line and bounds for the map
    trigger: onLoad
  - operationId: quoteTransportFare
    contract: transport
    purpose: The price for the stations and passengers
    trigger: onAction
  - operationId: listTransportPassOffers
    contract: transport
    purpose: Multi-trip and unlimited passes for the station pair
    trigger: onLoad
  - operationId: listMyFavouriteRoutes
    contract: transport
    purpose: The guest's saved routes
    trigger: onLoad
  - operationId: saveFavouriteRoute
    contract: transport
    purpose: Save this route
    trigger: onAction
    invalidates:
    - listMyFavouriteRoutes
  - operationId: deleteFavouriteRoute
    contract: transport
    purpose: Remove a saved route
    trigger: onAction
    invalidates:
    - listMyFavouriteRoutes
  - operationId: addCartLine
    contract: orders
    purpose: Add the trip or pass to the basket (`attributes.transport`)
    trigger: onAction
  entryState:
    params:
    - name: cartId
      from: session
    - name: favouriteId
      from: navigation
      optional: true
    - name: routeId
      from: navigation
      optional: true
    coldEntry: Arrives with nothing; the venue comes from the site. **Opened from a route** (a route card or
      a transport product, client feedback 30 September), `routeId` fills From and To with that route's first
      and last stops, and the departures show at once; the guest can still change or swap them. A saved
      route (`favouriteId`) prefills the same way. A shared link with stations prefills From and To if both
      still exist, and says which one does not.
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-049
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (30 September build)
      verified: '2026-10-01'
      match: exact
      view: 'Engine controls → Transport → Route & schedule · one-way, multi-trip, favourites → Book → Fri (stations filled in, departures without a search)'
      differences: '30 September: the route opens with its stations filled in and the departures listed without a search; the time-period buttons filter them. The engine''s other transport flow, Popular routes (card view), is route cards with a from-fare and Book, then the date, the departures and the passengers. The route map needs a street-map tile provider (audit R038).'
  apisNote: Authored 29 September 2026 from the rev 3 decisions and the client prototype view named in
    `wireframe.prototype`; every operation exists in the contracts (decided 29 September, rev 3).
  overlays:
  - id: confirmDeleteFavouriteRoute
    component: confirmDialog
    trigger: Remove favourite
    body: '**Remove this saved route?** It leaves Favourites; nothing already booked on it changes.'
    confirm:
      label: Remove
      operation: deleteFavouriteRoute
    dismiss:
      label: Keep it
      discards: []
    provenance: client-verified
- id: WEB-050
  name: Plan Your Visit
  module: Discovery & Browse
  requiresModule: ticketing
  wave: 1
  capability: AI-35
  implementation:
    app: guest-web
    route: /plan-your-visit
    component: apps/guest-web/src/routes/PlanYourVisit.tsx
    status: notStarted
  navigation:
    inferred: false
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-010
    - WEB-001
    - WEB-004
    transitions:
    - to: WEB-010
      trigger: Book this plan
      operation: bookVisitPlan
      carries:
      - cartId
      onFailure:
      - when: an item sold out since the plan was made
        to: WEB-050
        note: Names it and offers a swap; the rest of the plan is kept.
      provenance: 'decided 29 September 2026, MOB-6; web build: Book this plan goes straight into booking'
    - to: WEB-004
      trigger: Opens an item on the plan
      carries:
      - productId
      provenance: decided 29 September 2026, MOB-6
    - to: WEB-001
      trigger: Back to tickets
      provenance: decided 29 September 2026, MOB-6
  notes: '**Added 29 September**: the 29 September web build has *Plan your visit* in the header, opening
    the planner full screen, and *Book this plan* goes straight into booking. The web twin of the Plan
    tab (GST-051 questions, GST-053 plan), binding the same planner operations (venue-map `generateVisitPlan`,
    `getVisitPlan`, `updateVisitPlan`, `listVisitPlanAlternatives`, `bookVisitPlan`). Block A (29 September
    re-plan, superseding R187 and GAP-C3). Rules-based; the AI planner chat is app-only for now. Hidden
    when the venue turns module `visitPlanner` off.


    **Multi-venue intelligence (client meeting 30 September, MoM 4.7, Allam).** As on the app: each day
    is at one park and uses only that park''s rides, dining and retail (shops and kiosks, added beside
    F&B); a preference the park cannot meet is said, never filled from another park.'
  density: compact
  pattern: multiStepForm
  patternReason: 'The Visit Planner prototype: six questions, then the plan with Book this plan'
  purpose: 'Plan a visit on the website: answer six questions, get a day-by-day plan, edit it, and book
    it in one go.'
  layout:
    template: fullscreen
    regions:
    - name: progress
      slot: progress
      components:
      - kind: progressIndicator
        label: Plan your visit · n of 6
        notes: Who, heights (skipped with no children), days (up to 3), pace, interests, lunch.
        provenance: decided 29 September 2026, MOB-6; Visit Planner prototype
    - name: fields
      slot: fields
      components:
      - kind: numberField
        label: Adults and children
        notes: Adults 1-8 (12+), children 0-8 (3-11).
        provenance: decided 29 September 2026, MOB-6
      - kind: selectField
        label: How tall are the children?
        operation: listProducts
        notes: Per child; rides over the limit are left out (`ProductEligibilityRule`).
        provenance: decided 29 September 2026, MOB-6
      - kind: multiSelect
        label: Which days are you visiting?
        notes: Up to three.
        provenance: decided 29 September 2026, MOB-6
      - kind: selectField
        label: Which park each day?
        bindsTo: TenantAppStatus.venues
        operation: getTenantAppStatus
        notes: '**Only in a multi-venue tenant**; hidden otherwise. One choice per chosen day, defaulting
          to the venue picked in the header; sent as `VisitPlanRequest.dayVenues`. Each day is then planned
          from that park''s own rides, dining and shops only (client meeting 30 September, MoM 4.7).'
        provenance: decided 30 September 2026, client meeting MoM 4.7 (Allam)
      - kind: selectField
        label: How busy should each day be?
        notes: Packed, Balanced or Relaxed.
        provenance: decided 29 September 2026, MOB-6
      - kind: multiSelect
        label: What are you most interested in?
        operation: listProducts
        notes: Interest tags of the venue.
        provenance: decided 29 September 2026, MOB-6
      - kind: multiSelect
        label: Any shops you'd like to visit?
        notes: 'Shown when Shopping is chosen (client meeting 30 September, MoM 4.7: retail and kiosk
          shops join F&B in the planner). The `retailTags` of the chosen parks'' shops and retail kiosks;
          sent as `VisitPlanRequest.retailTags`.'
        provenance: decided 30 September 2026, client meeting MoM 4.7 (Allam)
      - kind: selectField
        label: What would you like for lunch?
        notes: Cuisines of the chosen parks' dining points only (restaurants, cafes, food kiosks; client
          meeting 30 September, MoM 4.7). In a multi-venue plan each cuisine names the park(s) that serve
          it, and lunch is planned only at a restaurant of that day's park.
        provenance: decided 29 September 2026, MOB-6; decided 30 September 2026, client meeting MoM 4.7
          (Allam)
      - kind: primaryButton
        label: Make my plan
        operation: generateVisitPlan
        notes: Runs the rules planner.
        provenance: decided 29 September 2026, MOB-6
    - name: review
      slot: review
      components:
      - kind: timeline
        label: Your plan
        bindsTo: VisitPlanItem
        operation: getVisitPlan
        notes: Day tabs, each naming its park (`VisitPlan.days[].venueId`); arrival, timed items, lunch
          and shop or kiosk stops, every one at that day's park (`VisitPlanItem.venueId`; client meeting
          30 September, MoM 4.7).
        provenance: decided 29 September 2026, MOB-6; decided 30 September 2026, client meeting MoM 4.7
          (Allam)
      - kind: banner
        label: Not at this park
        bindsTo: VisitPlan.unmatchedPreferences
        operation: getVisitPlan
        notes: Per day, a cuisine or shop the day's park cannot offer, and the park that can (from `availableAtVenueIds`),
          e.g. *No Indian restaurant at Summit Peaks. Indian food is at Aqua Park (day 2).* Hidden when
          every preference is met (client meeting 30 September, MoM 4.7).
        provenance: decided 30 September 2026, client meeting MoM 4.7 (Allam)
      - kind: secondaryButton
        label: Swap / + Add something
        operation: listVisitPlanAlternatives
        notes: Candidates that suit everyone in the group, from the day's park only (client meeting 30
          September, MoM 4.7).
        provenance: decided 29 September 2026, MOB-6
      - kind: secondaryButton
        label: Remove / Undo changes
        operation: updateVisitPlan
        notes: Each change is a new version.
        provenance: decided 29 September 2026, MOB-6
      - kind: toggle
        label: Add Fast Track
        operation: updateVisitPlan
        notes: Per guest, with the queuing time saved.
        provenance: decided 29 September 2026, MOB-6
      - kind: detailPanel
        label: Estimated total
        operation: getVisitPlan
        notes: Estimate for the group; confirmed in booking.
        provenance: decided 29 September 2026, MOB-6
    - name: submit
      slot: submit
      components:
      - kind: primaryButton
        label: Book this plan
        operation: bookVisitPlan
        notes: Cart lines from the plan; opens the cart.
        provenance: decided 29 September 2026, MOB-6
      - kind: secondaryButton
        label: Change answers
        notes: Back to the questions.
        provenance: decided 29 September 2026, MOB-6
  states:
    loading: The plan builds in place; the answers stay on screen.
    error: Could not build or load the plan. Names what failed; the answers are kept.
    emptyFirstRun: 'No plan yet: the first question is shown.'
    emptyNoResults: 'Nothing suits the whole group on that day: says which answer ruled everything out
      and offers to change it.'
    preferenceNotAtVenue: '**A preference a day''s park cannot meet** (client meeting 30 September, MoM
      4.7): before *Make my plan* the chip is marked *Not at the parks you chose* (naming a park of the
      tenant that has it); after it, the day shows the *Not at this park* banner and nothing from another
      park is placed. *Change answers* lets the guest move that day to the park that has it.'
    emptyNoAccess: A guest holds no permission. Anyone can build a plan; signing in is asked only to save
      it, and booking follows the cart's own sign-in gate.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: Interests and height limits of what the planner may include
    trigger: onLoad
    provenance: decided 29 September 2026, MOB-6
  - operationId: generateVisitPlan
    contract: venue-map
    purpose: Build a rules plan from the inputs (party, heights, dates, park per day, pace, interests,
      shops, cuisine); each day from its own park's points only
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6; decided 30 September 2026, client meeting MoM 4.7 (Allam)
  - operationId: getVisitPlan
    contract: venue-map
    purpose: 'The plan: days, timed items and add-on suggestions, at its current version'
    trigger: onLoad
    provenance: decided 29 September 2026, MOB-6
  - operationId: updateVisitPlan
    contract: venue-map
    purpose: 'Swap, remove, add or undo: each change is a new version, so undo goes back one'
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  - operationId: listVisitPlanAlternatives
    contract: venue-map
    purpose: Swap candidates for one item that suit everyone in the party
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  - operationId: bookVisitPlan
    contract: venue-map
    purpose: 'Book this plan: turns the plan (and chosen add-ons) into cart lines and returns the cart'
    trigger: onAction
    provenance: decided 29 September 2026, MOB-6
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: The tenant's active venues, for the park-per-day choice in a multi-venue tenant
    trigger: onLoad
    provenance: decided 30 September 2026, client meeting MoM 4.7 (Allam)
  entryState:
    params:
    - name: venueId
      from: session
    - name: planId
      from: deepLink
      optional: true
    - name: itemId
      from: navigation
      optional: true
    coldEntry: Starts at the first question; a saved-plan link opens the plan, or says it has passed and
      offers to plan again. `itemId` is the plan item the guest taps Swap on, picked on this screen.
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-050
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Visit Planner.dc.html
      rev: Visit Planner (30 September build)
      verified: '2026-10-01'
      match: exact
      view: 'Visit Planner → the six questions (defaults) → Make my plan (Your plan)'
      differences: 'Single-park planner: no "Which park each day?" step, no shops or kiosks as plan stops and no preferenceNotAtVenue (MoM 4.7, 30 September); these are pending in design: specified, and built from the definition until the design shows it (handoff/design-batches/apps/1-guest-app/README.md).'
