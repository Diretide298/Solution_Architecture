- id: WEB-012
  name: Checkout — Payment
  module: Cart & Checkout
  requiresModule: ticketing
  wave: 1
  capability: C04
  implementation:
    app: guest-web
    route: /cart-and-checkout/checkout-payment
    component: apps/guest-web/src/routes/cart-and-checkout/CheckoutPaymentForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-011
    - WEB-016
    - WEB-010
    exitTo:
    - WEB-001
    - WEB-010
    - WEB-011
    - WEB-013
    - WEB-016
    transitions:
    - to: WEB-010
      trigger: Shopping Cart
      carries:
      - cartId
      - lineId
      - performanceId
      provenance: derived — WEB-010 declares entryState.params cartId, code, holdId, lineId, performanceId
        and WEB-012 holds cartId, lineId, performanceId, so an edge into it carries them
    - to: WEB-011
      trigger: Guest Details & Attendee Forms
      provenance: 'derived — WEB-011 declares entryState.params holdId and WEB-012 holds none of them.
        The edge carries nothing: WEB-012 is opened from WEB-011, so this edge is the way back and WEB-011
        keeps its own state'
    - to: WEB-016
      trigger: Sign in or use a guest code (when sign-in is asked at payment)
      carries:
      - cartId
      precondition: the guest is not signed in
      provenance: 'decided 29 September, rev 3 REV3-3: `BookingFlowConfig.signInAt` `atPayment`; the basket
        is kept'
    - to: WEB-013
      trigger: Receives confirmation and tickets
      provenance: flow F01 step 7→8
      carries:
      - orderId
  notes: 'The unknown outcome is the one to build for. A payment taken but never confirmed must offer
    inquiry, not a retry — a retry double-charges and the guest finds out. **Card or wallet** (TenderKind
    `card`, `wallet`; decided 28 September, audit R080 (a)), **both in base currency, so tender currency
    equals base currency.** A guest paying with a foreign card is converted by their own issuer at their
    own rate — that is not our conversion and is not recorded as one. The displayed comparison price (`WEB-035`)
    and the charged amount are different numbers and the screen says so before the guest commits. **Wired
    24 August from review**: getOrder. **The operations existed and this screen could not call them**
    — reviewers reported them as missing APIs, which is what an unreachable operation looks like from
    a wireframe. **No ''is this you?'' at checkout** (decided 28 September, audit R120 (b)): a verified
    contact that matches an existing profile attaches the order automatically inside `checkoutCart` (ADR-0045),
    so `checkGuestCheckoutMatch` and `decideGuestCheckoutMatch` were removed from this screen; only unverified
    matches go to staff review.


    **Rev 3 (decided 29 September, rev 3 REV3-3).** With `BookingFlowConfig.signInAt` `atPayment` the
    sign-in or guest-code gate is here rather than at the Add-ons exit; the basket is kept. Unknown and
    declined payment outcomes are declared (`inquirePaymentStatus`; GAP-B3, already).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getPublishedTenantConfig`
    `bookingFlow`.


    **29 September.** W1: a guest who proved the contact with the code arrives here from the cart (WEB-011
    skipped) and only ticks the T&Cs. M18-15: unticked marketing opt-in.


    **The guest selects the currency and pays in it** (decided 2 October 2026, Chinmay; CHG-FIN-001; reverses
    the display-only rule, CF-37 and "payment will be processed in AED", in favour of option (b) of MoM
    10 Aug 2026 4.7, DI-211). The venue lists the currencies a guest may pay in (`VenueSettings.chargeCurrencies`,
    a subset of the currencies it shows); `listFxRates` with `chargeable=true` returns them, each marked
    `chargeable`. The selected currency is sent at checkout (`checkoutCart.chargeCurrency`), the rate
    is locked on the order (`Order.chargeFxRate`, `chargeTotal`, until `chargeRateLockedUntil`), and the
    payment request goes to the payment partner in that currency. The ledger stays in the venue''s base
    currency, with the rate recorded on the order, the payment and any refund. **Refunds go back in the
    currency paid**, at the sale rate, so a full refund returns exactly what was charged. A currency the
    venue shows but does not charge is still an approximate price, marked "approx.", with "You pay in
    <base currency>" beside it. **On this screen:** the total shows in the selected currency with the
    base amount and the rate beneath ("USD 81.72 · AED 300.00 at 3.6710, held until 14:25"); when the
    hold lapses the amount is re-quoted and the guest confirms the new figure before paying. The earlier
    rule above ("both in base currency, so tender currency equals base currency") is superseded for card
    and wallet.


    **createOrder left 4 October 2026: the order is made from the cart by checkoutCart (the cart''s lines,
    holder names and opt-ins), then paid with createPayment; F01 step 7 and F02 step 5 say the same**
    (CHG-FXS-003)'
  openQuestions:
  - Sandbox credentials for Stripe and Network International are outstanding. The recovery paths cannot
    be tested without them.
  density: compact
