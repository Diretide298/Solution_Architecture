        operation: replyToMyCase
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
  states:
    loading: Articles load
    error: Could not load
    emptyFirstRun: No articles — offers contact instead of an empty help centre
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
