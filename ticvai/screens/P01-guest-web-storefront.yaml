    purpose: Send a ticket to somebody
    trigger: onAction
  entryState:
    params:
    - name: entitlementId
      from: deepLink
    - name: orderId
      from: deepLink
    coldEntry: '**A ticket link opened after the event.** Shows the entitlement with its status — expired,
      used, transferred — because *not found* to somebody holding a ticket is the wrong answer.'
    preloaded:
    - Entitlement.id
    - Entitlement.templateId
    - Entitlement.productId
    - Entitlement.orderId
    - Entitlement.orderLineId
