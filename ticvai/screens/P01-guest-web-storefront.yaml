  notes: 'The unknown outcome is the one to build for. A payment taken but never confirmed must offer
    inquiry, not a retry — a retry double-charges and the guest finds out. **Card or wallet** (TenderKind
    `card`, `wallet`; decided 28 September, audit R080 (a)), **both in base currency, so tender currency
    equals base currency.** A guest paying with a foreign card is converted by their own issuer at their
    own rate — that is not our conversion and is not recorded as one. The displayed comparison price (`WEB-035`)
    and the charged amount are different numbers and the screen says so before the guest commits. **Wired
    24 August from review**: getOrder. **The operations existed and this screen could not call them**
    — reviewers reported them as missing APIs, which is what an unreachable operation looks like from
    a wireframe. **No ''is this you?'' at checkout** (decided 28 September, audit R120 (b)): a verified
    contact that matches an existing profile attaches the order automatically inside `checkoutCart` (ADR-0045),
    so `checkGuestCheckoutMatch` and `decideGuestCheckoutMatch` were removed from this screen; only unverified
    matches go to staff review.


    **Rev 3 (decided 29 September, rev 3 REV3-3).** With `BookingFlowConfig.signInAt` `atPayment` the
    sign-in or guest-code gate is here rather than at the Add-ons exit; the basket is kept. Unknown and
    declined payment outcomes are declared (`inquirePaymentStatus`; GAP-B3, already).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getTenantConfig`
    `bookingFlow`.


    **29 September.** W1: a guest who proved the contact with the code arrives here from the cart (WEB-011
    skipped) and only ticks the T&Cs. M18-15: unticked marketing opt-in.'
