  notes: 'Availability is read live and never cached beyond a few seconds. A guest selecting a session
    that filled while they were reading is a worse outcome than a slightly slower screen. **Wired 24 August
    from review**: acquireInventoryHold. **The operations existed and this screen could not call them**
    — reviewers reported them as missing APIs, which is what an unreachable operation looks like from
    a wireframe.


    **Rev 3 (decided 29 September).** **Date → time → ticket (REV3-2):** this step now comes before the
    ticket choice (WEB-005); the time sits right after the date and stays hidden until a date is picked,
    and tickets stay hidden until a time is picked (`BookingFlowConfig.performanceReveal`, default `dateTimeTicket`;
    `allAtOnce` shows everything). **Times (REV3-1):** compact tiles paged `timesPerPage` at a time, with
    Morning / Afternoon / Evening chips and counts (`dayPartFilter`, boundaries per venue, default before
    12:00, 12:00-17:00, from 17:00, venue time zone). **Seated events (REV3-4, REV3-7):** `seatEventDateMode`
    `inlineStep` keeps this step before the seat map; `popupOnSeatMap` asks the date and time in a pop-up
    over WEB-007 instead. **This step is skipped when the event has exactly one on-sale performance.**
    For a seated event this step and WEB-007 may render as one page (date, time, show — plus language
    and format for cinema — and the seat map). **Language (REV3-17)**, **experience and level with a four-day
    calendar (REV3-19)**, **Booking at (REV3-18)**, **Quick tour (REV3-20)**. **Consent questions (REV3-26)**
    pop up once after the session or date is picked; the prototype''s *Swim consent pop-up (on/off)* toggle
    is dropped because questions are attached per product or flow. Per-guest age and height eligibility,
    guardian signature and *Remove this guest* are `checkBookingEligibility`, unchanged (DG-3). **Guest-facing
    copy may say *Session*** (CFG-10, a glossary exception like *Booking* under audit R145); code and
    contracts keep `Performance`. Floating basket icon and cart side (REV3-10). Every booking-flow setting
    named here is read from `getPublishedTenantConfig` `bookingFlow`, resolved for the venue the guest
    picked (audit R267): the tenant''s values with that venue''s `venueOverrides` entry laid over field
    by field (decided 29 September, rev 3 CFG-11).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getPublishedTenantConfig`
    `bookingFlow`.


    **29 September.** M17-08: the date strip shows the next seven days, with a calendar for later dates.
    W5: surf products (beginner, intermediate …) only after a time slot. W8: the date-first default no
    longer overrides product-first flows: order comes from the flow. W11: tours stay date → language →
    time slot, unchanged.

    **30 September (client feedback, CLIENT-RESPONSE-30SEP 3 and 4).** **Choosing a session adds nothing
    to the cart.** Once a session is chosen its tickets appear (for a surf session: Surfer at the session
    price, Junior surfer 10–15, Spectator) and a line reaches the cart (`addCartLine`) only when a quantity
    is set; until a session is chosen the ticket area says *Choose a session above to see its tickets
    and prices.* **A question the flow already asks on the page is not asked again** in the consent pop-up:
    on the water park''s swim-ability flow the *Are you able to swim?* answer given on the page stands.'
