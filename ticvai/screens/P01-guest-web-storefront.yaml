  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formCreateResaleListing
    component: modal
    trigger: Create resale listing
    body: '**Collects what `createResaleListing` sends before it is called.** Required: `entitlementId`,
      `askPrice`. Optional: `sellerSubjectId`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: CreateResaleListingRequest
    confirm:
      label: Create resale listing
      operation: createResaleListing
    dismiss:
      label: Cancel
      discards:
      - entitlementId
      - askPrice
      - sellerSubjectId
    provenance: client-verified
  - id: formTransferOrderTickets
    component: modal
    trigger: Transfer tickets
    body: '**Pick the tickets on their cards, then the friend**: a channel (email, SMS or WhatsApp) and
      the address, with an optional message. `transferOrderTickets` moves ownership; the recipient claims
      from the link they receive.'
    confirm:
      label: Transfer tickets
      operation: transferOrderTickets
    dismiss:
      label: Cancel
      discards:
      - ticketIds
      - recipient
      - message
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  gaps:
  - operation: listOrders
    removed: true
    why: The staff-scoped order list; a guest screen lists the caller's own orders with `listMyOrders`
