          a confirmation; *are you sure* is not — and a dialog that cannot name what it destroys is a
          dialog somebody dismisses.


          **Added 31 August.** `confirmDialog` and `modal` were both in the component library and used
          **zero times across 492 screens**, while `destructiveButton` was used 39 times and its own entry
          reads *always requires confirmation*.'
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Browse
        notes: 'Shown when the list is empty: saving is done with the heart on the product and date cards
          (WEB-005, WEB-006, GST-004), never by typing an id here.'
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
    - name: actionBar
      slot: rowActions
      components:
      - kind: destructiveButton
        label: Remove from wishlist
        operation: removeFromWishlist
        provenance: contract marketing-crm.yaml DELETE /guests/{subjectId}/wishlist/{itemId}
      - kind: toast
        label: Removed. Undo
        operation: addToWishlist
        notes: The 5-second Undo after Remove; re-saves the same entry.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
  overlays:
  - id: confirmRemoveFromWishlist
    component: confirmDialog
    trigger: Remove from wishlist
    body: '**Names what `removeFromWishlist` changes and what it leaves alone**, in the consequence rather
      than the verb. A wishlist this affects should be identified in the dialog, not just counted.'
    provenance: client-verified
  states:
    loading: Saved items load
    error: Could not load
    emptyFirstRun: Nothing saved — explains what the list is for
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: getWishlist
    contract: marketing-crm
    purpose: Read a guest's saved items
    trigger: onLoad
  - operationId: addToWishlist
    contract: marketing-crm
    purpose: Undo after a remove re-saves the same variant and date (idempotent); saving itself happens
      on the product and date cards
    trigger: onAction
  - operationId: removeFromWishlist
    contract: marketing-crm
    purpose: Remove a saved item
    trigger: onAction
  entryState:
    params:
    - name: itemId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen reads it with `getWishlist`;
        an edge that holds one may still carry it to open on that record.'
    - name: subjectId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `itemId`.'
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-009
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: exact
      view: Discover → 'Wishlist' link (discoverLinks)
      differences: No 'withdrawn product stays marked unavailable' state (YAML note). Prototype adds 'Restore
        removed' and live queue times.
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
