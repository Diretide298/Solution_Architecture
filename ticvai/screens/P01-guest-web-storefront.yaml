    component: modal
    trigger: Save marketing subscription
    body: '**Collects what `setMarketingSubscription` sends before it is called.** Required: `id`, `subjectId`,
      `channel`, `listName`, `isSubscribed`. Optional: `source`, `unsubscribeToken`. Dismissing sends
