  notes: '**Cross-surface parity, 31 August**: added getWaitTimes. **A guest does not know which surface
    they are on** — the same named screen on web and app now calls the same guest-callable operations.


    **Rev 3 (decided 29 September).** Categories: tiles from `listProductCategories`, then `listProducts?categoryId=`,
    or one flat list, per `BookingFlowConfig.ticketCategories` (REV3-16); tiles as a grid or a row per
    `cardLayout` (`categoryDisplay` retired, W7). **Info-only products** (`Product.guestListing` `infoOnly`)
    are listed with `notBookableLabel` (default *Info only / Not bookable online*) and open their details
    instead of adding to the basket; they are hidden when `BookingFlowConfig.showInfoOnly` is off (REV3-14).
    Each card shows the product''s own primary image (`Product.media` `isPrimary`, `searchCatalogue` `primaryMedia`;
    23SEP-4). **Book** opens the ticket counters (WEB-005) as a side panel on this listing rather than
    a new page (23SEP-5). Card layout, size and density are the enums `cardLayout` [stackedRows, splitRows,
    cardsAcross, posterCards], `cardSize` [compact, standard, large, extraLarge] and `density` [compact,
    standard, roomy] (DG-6). Every booking-flow setting named here is read from `getTenantConfig` `bookingFlow`,
    resolved for the venue the guest picked (audit R267): the tenant''s values with that venue''s `venueOverrides`
    entry laid over field by field (decided 29 September, rev 3 CFG-11).


    **29 September.** W4: Help me choose filters this list, with *Show everything*. W3: view-only products
    show Call sales / Email sales. W7: `categoryDisplay` retired.'
  density: compact
  pattern: listDetail
  patternReason: '`listProducts` reads the population and `getWaitTimes` reads one of them — list, select,
    act'
  purpose: Browse and filter everything bookable.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Category tiles
        bindsTo: ProductCategory
        notes: 'Shown when `BookingFlowConfig.ticketCategories` is `categoryThenSubcategory` (the default):
          the category tiles (name, image) first, then that category''s products through `listProducts?categoryId=`.
          `flatList` skips the tiles. Tiles lay out as a grid or one scrolling row per `BookingFlowConfig.cardLayout`
          (W7).'
        operation: listProductCategories
        provenance: decided 29 September, rev 3 REV3-16, 23SEP-18
      - kind: textField
