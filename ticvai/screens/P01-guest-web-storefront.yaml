    **The holder details are written by checkoutCart on WEB-012 (attendees), which turns the cart into
    the order (4 October 2026): this step collects them and hands them over, because a verified or signed-in
    guest whose cart needs no forms skips this step (W1) and WEB-012 must make the order either way. recordConsentAnswers''
    answers are typed in the contract (questionId, questionVersion, answer, cartLineId, personIndex);
    the pull cut them (ledger)** (CHG-FXS-003)'
  density: compact
