      - kind: iconButton
        label: Quick tour
        notes: Replays the four-step coach-mark tour. Shown only when `BookingFlowConfig.quickTour` is
          on (default off).
        provenance: decided 29 September, rev 3 REV3-20
      - kind: cardList
        bindsTo: ProductVariant[]
        notes: Each row is a variant with a stepper. Price updates live. Each row shows `ProductVariant.description`
          (who it is for, what it includes) behind the (i) when `BookingFlowConfig.cardInfo` is on (23SEP-6),
          its display tags when `ticketTags` is on (23SEP-3) and its own photo (23SEP-4). In the dated
          flow the rows stay hidden until a time is picked (`performanceReveal` `dateTimeTicket`, REV3-2)
        provenance: carried from the previous definition
        operation: listProductVariants
      - kind: banner
        bindsTo: PromotionEvaluation.rejected
        notes: Shows near-miss offers — "add one more for the family rate". Uses the rejected list, which
          exists precisely so this can be said Promotions are evaluated by themselves on every change
          (`evaluatePromotions`); a guest never fills a promotions form (F01 step 4, GFIX-3).
        provenance: carried from the previous definition
        operation: evaluatePromotions
      - kind: progressIndicator
        label: Booking steps
        bindsTo: BookingFlow
        columns:
        - BookingFlow.steps
        operation: getPublishedBookingFlow
        notes: The steps of the published flow in their `sortOrder`, this one (tickets) highlighted. A
          step the flow has turned off is not shown and is skipped by Continue and Back. Drawn in the
          venue's `BookingFlowSettings.stepIndicator` style; `embedMode` and `singleEventPage` come from
          the same published settings (CMS-016) (CHG-SGU-022).
        provenance: decided 29 September 2026, W12; CMS-103 Booking Flows
      - kind: secondaryButton
        label: Show everything
        operation: listProducts
        notes: Clears the Help me choose filter (W4).
        provenance: decided 29 September 2026, W4
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Continue
        provenance: carried from the previous definition
        operation: addCartLine
  states:
    loading: The ticket type selection list.
    error: Could not load. Names which read failed and leaves the ticket type selection untouched.
    emptyFirstRun: No ticket type selection yet. **Offers no create action** — this screen declares no
      operation that makes one — and says so rather than showing an empty table.
    emptyNoResults: 'Never shown: `listProductVariants` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
