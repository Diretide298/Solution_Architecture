  notes: '**Venue selection added 28 September** (decided 28 September, audit R267): a venue picker on
    first open, remembered on the device, **Change venue** in the header, and a visit-day suggestion from
    the guest''s ticket. The options come from `getTenantAppStatus.venues`, the tenant''s active venues,
    public and cacheable.


    **Rev 3 (decided 29 September).** Category cards render as a grid or as one scrolling row per `BookingFlowConfig.cardLayout`
    (the retired `categoryDisplay` of 23SEP-18 is removed, W7). The event banner lists dates only when
    `BookingFlowConfig.eventBannerDates` is on (default off; 23SEP-19); the date picker always sits at
    the top of the booking step. The venue picked here (audit R267) is the venue whose booking-flow settings
    apply on every booking screen, and the booking screens'' *Booking at* bar changes it (REV3-18). Every
    booking-flow setting named here is read from `getPublishedTenantConfig` `bookingFlow`, resolved for
    the venue the guest picked (audit R267): the tenant''s values with that venue''s `venueOverrides`
    entry laid over field by field (decided 29 September, rev 3 CFG-11). The UI preset stays `BookingFlowConfig.preset`
    (CFG-1, no change); the search box in the banner is off by default (`searchInBanner` default false,
    CFG-6). The in-venue notifications link is live again: WEB-046 is back in the first release (GAP-C1,
    reversing audit R242).


    **29 September.** *Plan your visit* in the header opens WEB-050 full screen (MOB-6). W7: `categoryDisplay`
    is retired.'
  density: compact
  pattern: listDetail
  patternReason: '`listProducts` reads the population and `getTenantAppStatus` reads one of them — list,
    select, act'
  purpose: Show a guest what is on and give them one obvious way to start booking.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Your venue
        bindsTo: TenantAppStatus.venues
        operation: getTenantAppStatus
        notes: '**The guest picks a venue on first open** (decided 28 September, audit R267): shown before
          anything else when the device has no venue remembered, and remembered on the device after that.
          The chosen `venueId` is what every screen that declares `venueId` `from: session` reads, and
          it is sent as `?venueId=` to `listProducts`. The options are `getTenantAppStatus.venues` (venue
          id, name, city, today''s opening hours), the tenant''s active venues, returned without a session.'
        provenance: contract white-label.yaml GET /tenant-config/status (TenantAppStatus.venues, audit
          R267)
      - kind: banner
        label: Visiting today?
        bindsTo: Entitlement
        columns:
        - Entitlement.venueId
        - Entitlement.validFrom
        - Entitlement.validTo
        operation: listMyEntitlements
        notes: '**On a visit day the app suggests the ticket''s venue** (decided 28 September, audit R267):
          for a signed-in guest, an entitlement from `listMyEntitlements` (`state=upcoming`) valid today
          at a venue other than the chosen one offers **Switch to that venue**; the guest decides, the
          app never switches by itself.'
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: banner
        label: Sold out or closed today
        bindsTo: TenantAppStatus.availabilityMessage
        operation: getTenantAppStatus
        notes: From `getTenantAppStatus.availability` (`open`, `soldOut`, `closed`) and `availabilityMessage`
          (decided 28 September, audit R073 (f)); nothing shows while it is `open`.
        provenance: contract white-label.yaml GET /tenant-config/status
      - kind: cardList
        label: What's on
        bindsTo: Product
        columns:
        - Product.name
        - Product.description
        - Product.media
        - Product.displayTags
        operation: listProducts
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        notes: Guest cards show name, image, from-price, tags and availability only (DI-026). The venue
          is the one the guest picked on Home (`venueId` from the session, audit R267), never typed. Was
          the generated table 'Every product'; staff and plumbing columns removed (decided by Chinmay,
          fix before Block A starts, 2 October 2026 (GFIX-3)).
      - kind: banner
        bindsTo: TenantAppStatus.maintenanceMessage
        notes: Only when isInMaintenance. Tenant-branded, never a generic error page
        provenance: carried from the previous definition
        operation: getTenantAppStatus
      - kind: cardList
        bindsTo: HomepageLayout.sections
        notes: The sections of the published home, from the tenant's template (`templateKey`) or its own
          layout, each with the card count the venue chose (`maxItems`) and its scroll animation. **The
          client-approved web wireframe is the layout** (decided by Chinmay, 2 October 2026; DEC-163);
          a tenant with its own landing page links in with deep links (DEC-548) (CHG-SGU-005).
        provenance: corrected 2 October 2026 (CHG-SGU-005, decided by Chinmay 2 October 2026, DEC-163,
          DEC-548)
        operation: getPublishedTenantConfig
        label: Home sections
    - name: header
      slot: carried
      components:
      - kind: iconButton
        label: Search
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Sign in
        notes: Becomes an account menu once authenticated
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Change venue
        notes: Reopens the venue picker; the new choice replaces the remembered one on this device and
          every venue-scoped screen reloads for it (decided 28 September, audit R267).
        provenance: decided 28 September 2026, audit R267
  states:
    loading: The home landing list.
    error: Could not load. Names which read failed and leaves the home landing untouched.
    emptyFirstRun: No home landing yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing is on sale at this venue today. Said in the tenant's voice, with **Change
      venue**; the homepage sections that do not list products stay.
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: getTenantAppStatus
    purpose: Maintenance check before rendering anything
    trigger: onLoad
    contract: white-label
  - operationId: getPublishedTenantConfig
    contract: white-label
    purpose: 'The published brand, theme, fonts, header, footer, navigation, homepage, booking-flow display
      settings and languages, read before anyone signs in (GFIX-1)


      Also the analytics providers to start once their consent category is granted, from the published
      config (listAnalyticsProviders needs TENANT_CONFIGURE and left the guest screens: decided by Chinmay,
      3 October 2026 (CHG-SPF-007)).'
    trigger: onLoad
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  - operationId: listMyEntitlements
    contract: access
    purpose: The guest's upcoming tickets, so a visit day can suggest the ticket's venue (decided 28 September,
      audit R267); only when signed in
    trigger: onLoad
  - operationId: getCookieConsentRuntime
    contract: marketing-crm
    purpose: Cookie banner on first visit and what the tag loader may load
    trigger: onLoad
    provenance: build, 29 September 2026
  - operationId: recordDeviceConsent
    contract: marketing-crm
    purpose: Accept all, reject non-essential or save preferences from the banner
    trigger: onAction
    provenance: build, 29 September 2026
  - operationId: decideRecommendations
    contract: ai
    purpose: 'Recommendation slot (homepage / loyalty placement: products, offers, rewards, challenges)'
    trigger: onLoad
    provenance: build, 29 September 2026
  - operationId: recordRecommendationEvents
    contract: ai
    purpose: Report impressions, clicks and declines of recommended items
    trigger: onAction
    provenance: build, 29 September 2026
  - operationId: recordStorefrontSessionEvents
    contract: white-label
    purpose: Runtime-shell beacon of hashed browsing behaviour for fraud prevention (every page of the
      session; bound on the home screen as the shell's entry)
    trigger: onLoad
    provenance: build, 29 September 2026
  entryState:
    coldEntry: '**A cold arrival is the ordinary case.** **The venue comes from the device** (decided
      28 September, audit R267): on first open the guest picks one, it is remembered on the device and
      changeable from the header, and on a visit day the ticket''s venue is suggested. Every guest screen
      that declares `venueId` `from: session` reads that remembered choice.'
    preloaded:
    - Product.id
    - Product.code
    - Product.name
    - Product.description
    - Product.kind
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-001
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: partial
      view: Header 'Discover' (default view on load)
      differences: No first-open venue picker remembered on the device and no 'Change venue' in the header
        (YAML R267); the prototype shows 'Browse by venue' tiles instead and switches venue from the Config
        drawer. Prototype adds a resume-booking card, a video 'Tonight in the city' panel, live queue
        times on cards and footer links to Contact / Accessibility / Service status. YAML emptyNoAccess/offline
        states are not drawn on Home (offline exists only as a demo tweak).
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  gaps:
  - operation: getTenantConfig
    removed: true
    why: Replaced by `getPublishedTenantConfig`, the guest read of the same data.
    source: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-1)
- id: WEB-002
  name: Event & Attraction Listing
  module: Discovery & Browse
  requiresModule: ticketing
  wave: 1
  capability: C79
  implementation:
    app: guest-web
    route: /discovery-and-browse/event-and-attraction-listing
    component: apps/guest-web/src/routes/discovery-and-browse/EventAndAttractionListingList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    - WEB-003
    exitTo:
    - WEB-001
    - WEB-003
    - WEB-004
    - WEB-005
    transitions:
    - to: WEB-004
      trigger: Attraction Details
      carries:
      - eventId
      - productId
      provenance: derived — WEB-004 declares entryState.params eventId, productId and WEB-002 holds eventId,
        productId, so an edge into it carries them
    - to: WEB-005
      trigger: Book (the ticket counters open as a side panel on the listing)
      carries:
      - productId
      provenance: 'decided 29 September, rev 3 23SEP-5: WEB-005 may render as a side panel on WEB-002
        and WEB-004'
  notes: '**Cross-surface parity, 31 August**: added getWaitTimes. **A guest does not know which surface
    they are on** — the same named screen on web and app now calls the same guest-callable operations.


    **Rev 3 (decided 29 September).** Categories: tiles from `listProductCategories`, then `listProducts?categoryId=`,
    or one flat list, per `BookingFlowConfig.ticketCategories` (REV3-16); tiles as a grid or a row per
    `cardLayout` (`categoryDisplay` retired, W7). **Info-only products** (`Product.guestListing` `infoOnly`)
    are listed with `notBookableLabel` (default *Info only / Not bookable online*) and open their details
    instead of adding to the basket; they are hidden when `BookingFlowConfig.showInfoOnly` is off (REV3-14).
    Each card shows the product''s own primary image (`Product.media` `isPrimary`, `searchCatalogue` `primaryMedia`;
    23SEP-4). **Book** opens the ticket counters (WEB-005) as a side panel on this listing rather than
    a new page (23SEP-5). Card layout, size and density are the enums `cardLayout` [stackedRows, splitRows,
    cardsAcross, posterCards], `cardSize` [compact, standard, large, extraLarge] and `density` [compact,
    standard, roomy] (DG-6). Every booking-flow setting named here is read from `getPublishedTenantConfig`
    `bookingFlow`, resolved for the venue the guest picked (audit R267): the tenant''s values with that
    venue''s `venueOverrides` entry laid over field by field (decided 29 September, rev 3 CFG-11).


    **29 September.** W4: Help me choose filters this list, with *Show everything*. W3: view-only products
    show Call sales / Email sales. W7: `categoryDisplay` retired.


    **A product''s event is Product.eventId (added by the contracts agent, runs/fix-s12/LEDGER.md (CHG-FXC-011),
    4 October 2026): the date filter and the product page read listPerformances for it** (CHG-FXS-003)'
  density: compact
  pattern: listDetail
  patternReason: '`listProducts` reads the population and `getWaitTimes` reads one of them — list, select,
    act'
  purpose: Browse and filter everything bookable.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Category tiles
        bindsTo: ProductCategory
        notes: 'Shown when `BookingFlowConfig.ticketCategories` is `categoryThenSubcategory` (the default):
          the category tiles (name, image) first, then that category''s products through `listProducts?categoryId=`.
          `flatList` skips the tiles. Tiles lay out as a grid or one scrolling row per `BookingFlowConfig.cardLayout`
          (W7).'
        operation: listProductCategories
        provenance: decided 29 September, rev 3 REV3-16, 23SEP-18
      - kind: searchField
        label: Search events and attractions
        provenance: carried from the previous definition
        operation: searchCatalogue
      - kind: multiSelect
        label: Category
        provenance: carried from the previous definition
      - kind: datePicker
        label: Date
        notes: Picks a day; the listing keeps the events with a performance that day (`listPerformances`).
        provenance: carried from the previous definition
        operation: listPerformances
      - kind: cardList
        bindsTo: Product[]
        notes: Cursor pagination. Infinite scroll with an explicit load-more fallback
        provenance: carried from the previous definition
        operation: listProducts
      - kind: banner
        label: Help me choose
        operation: getPublishedGuidedChoice
        notes: '**The answers filter the list** (W4): sent as `guidedAnswerIds` to `listProducts` (and
          `searchCatalogue`), so web, app and kiosk filter the same way on the server.'
        provenance: decided 29 September 2026, W4
      - kind: secondaryButton
        label: Show everything
        operation: listProducts
        notes: Clears the Help me choose filter (W4).
        provenance: decided 29 September 2026, W4
      - kind: cardList
        label: Contact sales
        bindsTo: Product.salesContact
        operation: listProducts
        notes: '**View-only products** (W3): Call sales / Email sales from `Product.salesContact` instead
          of Book.'
        provenance: decided 29 September 2026, W3
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The wait time
        bindsTo: WaitTime
        columns:
        - WaitTime.queueName
        - WaitTime.status
