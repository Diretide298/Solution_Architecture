  notes: '**Venue selection added 28 September** (decided 28 September, audit R267): a venue picker on
    first open, remembered on the device, **Change venue** in the header, and a visit-day suggestion from
    the guest''s ticket. The options come from `getTenantAppStatus.venues`, the tenant''s active venues,
    public and cacheable.


    **Rev 3 (decided 29 September).** Category cards render as a grid or as one scrolling row per `BookingFlowConfig.cardLayout`
