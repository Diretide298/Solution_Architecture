    error: '**Save failed and the form keeps what was typed.** A consent change that silently did not
      save is a compliance failure, so the screen states it rather than showing success'
    emptyFirstRun: —
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from here**
      — an empty list with the filter state hidden elsewhere is a person who thinks the data is gone.
      **Added 25 August with the derived list component**: a screen that lists has to say what it shows
      when the list is empty, and this screen gained the list before it gained the sentence.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
