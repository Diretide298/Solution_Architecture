      optional: true
      notes: A link to an order already pending payment opens it; otherwise checkoutCart makes the order
        from the cart.
    - name: paymentId
      from: navigation
      optional: true
    - name: venueId
      from: session
    coldEntry: '**A guest opening an order link weeks later.** Shows the order if it still resolves; if
      it was refunded or the performance passed, says which and offers the order list rather than an error.'
    preloaded:
