    purpose: Leave a queue
    trigger: onAction
  - operationId: getWaitTimes
    contract: queue
    purpose: Wait times across a venue
    trigger: onLoad
  - operationId: joinWaitlist
    contract: catalogue
    purpose: Join a virtual queue
    trigger: onAction
  - operationId: leaveWaitlist
    contract: catalogue
    purpose: Leave it
    trigger: onAction
  entryState:
    params:
    - name: entryId
      from: deepLink
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
