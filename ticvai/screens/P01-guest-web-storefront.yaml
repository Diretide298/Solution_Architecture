          order it returns; an unknown payment outcome has the order to attach to.
  states:
    loading: The checkout payment, read by `getOrder`.
    error: Could not load. Names which read failed and leaves the checkout payment untouched.
    emptyFirstRun: No checkout payment yet. Offers Create order (`createOrder`).
    emptyNoAccess: 'Shown when the caller lacks `ORDER_VIEW`, which `getOrder` requires to show this screen,
      and names that permission. **Never an empty table** — that reads as *there is no data* and sends
      somebody to support with the wrong question. A caller who can see the screen but lacks what an action
      needs sees that action disabled, naming its permission: `ORDER_CREATE` for `createPayment`, `inquirePaymentStatus`.'
    offline: '**Not available, and the offline banner says why.** A payment needs the gateway, and pretending
      otherwise takes money nobody can confirm. What was typed stays on screen so nothing is entered twice.'
  apis:
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  - operationId: getOrder
    contract: orders
    purpose: 'Read an order With the guest session the device already holds: signed in, or the anonymous
      cart session a visitor gets with the first line (ADR-0045) (decided 2 October 2026 by Chinmay, fix
      before Block A starts (GFIX-6)).'
    trigger: onLoad
  - operationId: inquirePaymentStatus
    contract: orders
    purpose: Ask what happened to a payment that did not answer
    trigger: onAction
  - operationId: getPublishedBookingFlow
    contract: white-label
    purpose: 'The published booking flow for this product: which steps it has and in what order (W12)'
    trigger: onLoad
    provenance: decided 29 September 2026, W12
  - operationId: listPublishedPolicies
    contract: white-label
    purpose: The current terms and conditions the guest ticks, with their version, readable before sign-in
      (GFIX-2)
    trigger: onLoad
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-2)
  - operationId: checkoutCart
    contract: orders
    purpose: 'Pay now, first step: turn the session''s cart into the order pending payment, with the holder
      names (attendees) and opt-ins (marketingConsents) from WEB-011 when it ran'
    trigger: onAction
    provenance: defined 4 October 2026 (CHG-FXS-003)
  entryState:
    params:
    - name: cartId
      from: session
    - name: orderId
