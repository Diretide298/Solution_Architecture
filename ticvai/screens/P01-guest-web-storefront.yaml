  density: compact
  pattern: statusTracker
  patternReason: '`getCart` reads one record and nothing reads a population — the screen is about that
    one thing'
  purpose: Review and confirm what is being bought.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The cart
        bindsTo: Cart
        columns:
        - Cart.channel
        - Cart.status
        - Cart.lines
        - Cart.subtotal
        - Cart.discountTotal
        - Cart.taxTotal
        - Cart.total
        - Cart.appliedPromotionIds
        - Cart.couponCodes
        - Cart.expiresAt
        - Cart.extensionsUsed
        - Cart.maxExtensions
        operation: getCart
        provenance: contract orders.yaml GET /carts/{cartId}
      - kind: detailPanel
        label: The coupon code
        bindsTo: CouponCode
        columns:
        - CouponCode.code
        - CouponCode.status
        - CouponCode.redemptionCount
        - CouponCode.discount
        - CouponCode.invalidReason
        - CouponCode.validFrom
        - CouponCode.validTo
        - CouponCode.redeemedAt
        operation: getCouponCode
        provenance: contract promotions.yaml GET /coupon-codes/{code}
      - kind: textField
        label: Promo code
        bindsTo: ApplyCartPromoCodeRequest.code
        operation: applyCartPromoCode
        notes: '**Applied to the cart at once** with `applyCartPromoCode` (POST /carts/{cartId}/promo-codes,
          body `{code}`; decided 28 September, audit R073 (e)). The two refusals read differently: 422
          `promoCodeInvalid` says the code does not exist, was voided or is used up; 422 `promoCodeNotApplicable`
          says the code is real but nothing in this cart qualifies. A 410 `cartExpired` sends the guest
          back to rebuild the cart. Accepted codes are listed from `Cart.couponCodes` and re-priced on
          every read.'
        provenance: contract orders.yaml POST /carts/{cartId}/promo-codes
      - kind: secondaryButton
        label: Apply code
        operation: applyCartPromoCode
        provenance: contract orders.yaml POST /carts/{cartId}/promo-codes
      - kind: banner
        bindsTo: PromotionEvaluation.rejected
        notes: When a code does not apply, say which condition failed. "Expired" and "already used" are
          very different conversations Promotions are evaluated by themselves on every change (`evaluatePromotions`);
          a guest never fills a promotions form (F01 step 4, GFIX-3).
        provenance: carried from the previous definition
        operation: evaluatePromotions
      - kind: cardList
        label: Visit date per line
        notes: 'Each line shows its visit date: `Performance.startsAt` for a line with a performance (the
          match date for a fixture). A table reservation is not a cart line (REV3-8), so it shows on its
          confirmation.'
        operation: getPerformance
        provenance: decided 29 September, rev 3 23SEP-9
      - kind: progressIndicator
        label: Booking steps
        bindsTo: BookingFlow
        columns:
        - BookingFlow.steps
        operation: getPublishedBookingFlow
        notes: The steps of the published flow in their `sortOrder`, this one (cart) highlighted. A step
          the flow has turned off is not shown and is skipped by Continue and Back.
        provenance: decided 29 September 2026, W12; CMS-103 Booking Flows
      - kind: numberField
        label: Quantity
        operation: updateCartLine
        notes: A stepper on each line; each change saves at once (`updateCartLine`).
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
      - kind: cardList
        label: Add to your visit
        operation: addCartLine
        notes: The add-ons the booking flow suggests for what is in the cart; Add puts one in (`addCartLine`).
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
    - name: actionBar
      slot: rowActions
      components:
      - kind: destructiveButton
        label: Remove
        operation: removeCartLine
        provenance: contract orders.yaml DELETE /carts/{cartId}/lines/{lineId}
      - kind: secondaryButton
        label: More time
        operation: extendCart
        provenance: contract orders.yaml POST /carts/{cartId}/extend
        notes: Beside the countdown (`Cart.expiresAt`, the one clock the guest sees); `extendCart` up
          to `maxExtensions` times.
      - kind: destructiveButton
        label: Empty cart
        operation: abandonCart
        provenance: contract orders.yaml DELETE /carts/{cartId}
      - kind: primaryButton
        label: Checkout
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        operation: checkoutCart
        notes: Checks the cart out (`checkoutCart`) and moves on to the guest details.
  overlays:
  - id: confirmRemoveCartLine
    component: confirmDialog
    trigger: Remove
    body: '**Names what `removeCartLine` changes and what it leaves alone**, in the consequence rather
      than the verb. A shopping cart this affects should be identified in the dialog, not just counted.'
    provenance: client-verified
  - id: confirmAbandonCart
    component: confirmDialog
    trigger: Empty cart
    body: '**Names what `abandonCart` changes and what it leaves alone**, in the consequence rather than
      the verb. A shopping cart this affects should be identified in the dialog, not just counted.'
    provenance: client-verified
  states:
    loading: The shopping cart, read by `getCart`.
    error: Could not load. Names which read failed and leaves the shopping cart untouched.
    emptyFirstRun: No shopping cart yet. Offers Add cart line (`addCartLine`).
    emptyNoAccess: '**The cart is open to anyone** — signed in, unverified or anonymous (ADR-0045, 18
      September 2026). Nobody is turned away from it. The fork between signing in and continuing as a
      guest waits on `WEB-011`, and `checkoutCart` is what refuses.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: applyCartPromoCode
    contract: orders
    purpose: Apply a promo code to the cart; refused 422 promoCodeInvalid or promoCodeNotApplicable, shown
      as different messages (decided 28 September, audit R073 (e))
    trigger: onAction
    invalidates:
    - getCart
  - operationId: getCart
    contract: orders
    purpose: 'The cart, priced and checked, right now With the guest session the device already holds:
      signed in, or the anonymous cart session a visitor gets with the first line (ADR-0045) (decided
      2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: updateCartLine
    contract: orders
    purpose: Change a quantity
    trigger: onAction
  - operationId: removeCartLine
    contract: orders
    purpose: Take something out
    trigger: onAction
  - operationId: extendCart
    contract: orders
    purpose: Give the guest more time
    trigger: onAction
  - operationId: checkoutCart
    contract: orders
    purpose: Turn the cart into an order
    trigger: onAction
  - operationId: abandonCart
    contract: orders
    purpose: Empty it deliberately
    trigger: onAction
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Evaluate promotions against a cart
    trigger: onAction
  - operationId: getCouponCode
    contract: promotions
    purpose: 'Look up a code With the guest session the device already holds: signed in, or the anonymous
      cart session a visitor gets with the first line (ADR-0045) (decided 2 October 2026 by Chinmay, fix
      before Block A starts (GFIX-6)).'
    trigger: onLoad
  - operationId: createCart
    contract: orders
    purpose: 'Started by the runtime the first time a line is added, against the guest or the anonymous
      cart token (2.1.31); never a button or a form (GFIX-3). With the guest session the device already
      holds: signed in, or the anonymous cart session a visitor gets with the first line (ADR-0045) (decided
      2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: background
    provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
  - operationId: getPerformance
    contract: catalogue
    purpose: The visit date and time of each line (`Performance.startsAt`)
    trigger: onLoad
  - operationId: getResourceHold
    contract: resources
    purpose: 'The countdown of a cabana or spot held on the venue map (`expiresAt`) With the guest session
      the device already holds: signed in, or the anonymous cart session a visitor gets with the first
      line (ADR-0045) (decided 2 October 2026 by Chinmay, fix before Block A starts (GFIX-6)).'
    trigger: onInterval
  - operationId: getPublishedBookingFlow
    contract: white-label
    purpose: 'The published booking flow for this product: which steps it has and in what order (W12)'
    trigger: onLoad
    provenance: decided 29 September 2026, W12
  entryState:
    params:
    - name: cartId
      from: WEB-008
    - name: code
      from: deepLink
    - name: lineId
      from: deepLink
    - name: performanceId
      from: navigation
      optional: true
    - name: holdId
      from: navigation
    - name: venueId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `code`, `lineId`. **A cold arrival opens the cart whatever the session is** — the identity
      fork waits until checkout (ADR-0045).'
    preloaded:
    - PublishedTenantConfig (bookingFlow and the venue-wide settings), loaded once by the app shell with
      getPublishedTenantConfig (WEB-001, GST-001, KSK-002)
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-010
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: partial
      view: Visible on every booking step as the cart sidebar (Config → Layout & locale → 'Cart & summary'
        changes it to slide-in, bottom sheet, floating icon or single column)
      differences: 'Not a separate screen: a persistent sidebar/drawer through the stepper, with a Rev
        3 option to mirror it in Arabic. No ''extend hold'' action (extendCart) — only hold timers on
        the seat step. Exit-intent dialog (exit.open) is a prototype addition. **Draw the countdown with
        More time (`extendCart`) on the basket**, although the prototype has no extend action and times
        only the seat step (CHG-SGU-020).'
  apisNote: 'Rebuilt 9 September 2026 from the 9 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  notes: '**Rev 3 (decided 29 September).** Visit date per line (23SEP-9). **Layout (REV3-10):** `cartLayout`
    may be `floatingIcon` (a round basket button with the count); in Arabic the cart stays on the right
    unless `cartSideInRtl` is `mirror` (default `keepRight`). **A line holding a cabana or spot from the
    venue map** (`resourceHoldId`) counts down from its `ResourceHold.expiresAt` (REV3-15). **Consent
    (REV3-26):** `checkoutCart` answers `422 consentRequired` while a required consent question is unanswered,
    and `consentAnswerBlocks` when an answer blocks a line; both send the guest back to the questions
    (WEB-006 pop-up, or WEB-011 for a flow with no date step). Promo code and abandon are declared (`applyCartPromoCode`,
    `abandonCart`; GAP-B3, already). Every booking-flow setting named here is read from `getPublishedTenantConfig`
    `bookingFlow`, resolved for the venue the guest picked (audit R267): the tenant''s values with that
    venue''s `venueOverrides` entry laid over field by field (decided 29 September, rev 3 CFG-11).


    **The step order comes from the published booking flow** (W12, 29 September): `getPublishedBookingFlow`
    returns the flow the product (or its category, else the venue default for its kind) uses, with its
    enabled steps in `sortOrder`; this screen renders when that flow has its step and in the order the
    flow gives. Flow-level settings (`performanceReveal`, `signInAt`, `seatEventDateMode`, `extrasStep`,
    `quickTour`, `consentQuestionIds`) are read from the flow; venue-wide settings stay on `getPublishedTenantConfig`
    `bookingFlow`.


    **The guest selects the currency and pays in it** (decided 2 October 2026, Chinmay; CHG-FIN-001; reverses
    the display-only rule, CF-37 and "payment will be processed in AED", in favour of option (b) of MoM
    10 Aug 2026 4.7, DI-211). The venue lists the currencies a guest may pay in (`VenueSettings.chargeCurrencies`,
    a subset of the currencies it shows); `listFxRates` with `chargeable=true` returns them, each marked
    `chargeable`. The selected currency is sent at checkout (`checkoutCart.chargeCurrency`), the rate
    is locked on the order (`Order.chargeFxRate`, `chargeTotal`, until `chargeRateLockedUntil`), and the
    payment request goes to the payment partner in that currency. The ledger stays in the venue''s base
    currency, with the rate recorded on the order, the payment and any refund. **Refunds go back in the
    currency paid**, at the sale rate, so a full refund returns exactly what was charged. A currency the
    venue shows but does not charge is still an approximate price, marked "approx.", with "You pay in
    <base currency>" beside it. **On the cart:** prices show in the selected currency, marked approx.
    until checkout locks the rate.'
