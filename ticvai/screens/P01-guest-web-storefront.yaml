      to `recordConsentAnswers`, which stores each as a consent record (question version, answer, who
      answered, when). **A blocking answer** (e.g. *No* to the swim question) marks the lines it blocks
      and says so; the guest removes them or answers again. There is no tenant on/off toggle: a question
      is attached to a product or a flow by the venue (decided 29 September, rev 3 REV3-26).'
    bindsTo: ConsentQuestion
    confirm:
      label: Next
      operation: recordConsentAnswers
    dismiss:
      label: Back
      discards:
      - answers
    provenance: client-verified
- id: WEB-007
