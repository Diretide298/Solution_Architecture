    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
  notes: '**Allergens are read here more often than anywhere else in the platform**, and a guest checking
    one on a phone browser is the ordinary case rather than the exception.


    **Rev 3 (decided 29 September, rev 3 REV3-9).** The modifier side panel is drawn here (no api change);
    the *F&B add-ons & modifiers (on/off)* toggle is dropped: modifiers show when the item has attached
    groups.'
  density: compact
  pattern: listDetail
  patternReason: One dish from the outlet's guest menu, with its modifiers and allergens (CHG-SGU-018)
  purpose: What is in it, and what may be changed.
  layout:
    template: split
    regions:
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The dish
        bindsTo: GuestMenu
        columns:
        - GuestMenu.outletId
        - GuestMenu.menuId
        - GuestMenu.name
        - GuestMenu.inForceUntil
        - GuestMenu.currency
        - GuestMenu.currencyScale
        - GuestMenu.sections
        operation: getGuestMenu
        provenance: corrected 2 October 2026 (CHG-SGU-018, design-notes correction)
        notes: 'The dish `menuItemId` resolved inside the outlet''s `getGuestMenu`: photo, name, description,
          price, its modifier groups (min and max per group) and allergens. Until the guest menu carries
          the Allergen object, "Contains" is drawn from the current list and "May contain" and the diet
          badges (vegetarian, vegan, halal) are drawn as pending (CHG-SGU-024).'
  states:
    loading: Content resolves in place.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: '**Nothing here yet for this venue.** Names what turns it on rather than showing an
      empty panel.'
    emptyNoAccess: 'Never shown: a menu is public and browsing a dish needs no sign-in.'
    offline: '**The offline banner shows.** The dish already loaded stays, with a note that it may be
      out of date and its allergens in full. Ordering is refused — availability changes by the minute.'
  apis:
  - operationId: getGuestMenu
    contract: fnb
    purpose: The menu a guest sees
    trigger: onLoad
  entryState:
    params:
    - name: outletId
      from: deepLink
    - name: menuItemId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen reads it with `getGuestMenu`;
        an edge that holds one may still carry it to open on that record.'
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with `outletId`.'
    preloaded:
    - ModifierGroup.id
    - ModifierGroup.code
    - ModifierGroup.name
    - ModifierGroup.minSelections
    - ModifierGroup.maxSelections
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-037
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: exact
      view: At the venue → Order food → tap a dish; Takeaway/Delivery → 'Add' opens the modifier side
        panel
      differences: Two renderings of the same thing (dialog in-venue, side panel in takeaway/delivery).
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: modifierPanel
    component: drawer
    trigger: Add, on an item with modifier groups attached
    body: '**A side panel of choices**: choose-one groups, priced optional add-ons within their limits,
      and quantity; the basket line lists the choices. Shown whenever the item has groups attached (`listModifierGroups`);
      there is no tenant on/off toggle (decided 29 September, rev 3 REV3-9).'
    bindsTo: ModifierGroup
    confirm:
      label: Add to order
      carries:
      - modifierSelections
    dismiss:
      label: Cancel
      discards:
      - modifierSelections
    provenance: client-verified
- id: WEB-038
  name: F&B – Order Tracking
  module: In-venue Services
  requiresModule: fnb
  wave: 1
  implementation:
    app: guest-web
    route: /fandb--order-tracking
    component: apps/guest-web/src/routes/FBOrderTracking.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
  notes: '**Order to ready is the kitchen''s number; ready to collected is the counter''s.** A guest watching
    a status that never changes walks to the counter. **Renamed 31 August** from *F&B — Order Tracking*.
    **A guest surface is one product with two renderings** — a screen named differently on web and app
    is two screens to a developer and one journey to a guest.'
  density: compact
  pattern: statusTracker
  patternReason: '`getGuestOrderStatus` reads one record and nothing reads a population — the screen is
    about that one thing'
  purpose: Watch it being made, and see the table bill; it is paid at the table.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The guest order status
        bindsTo: GuestOrderStatus
        columns:
        - GuestOrderStatus.orderId
        - GuestOrderStatus.orderNumber
        - GuestOrderStatus.status
        - GuestOrderStatus.estimatedReadyAt
        - GuestOrderStatus.isReadyForCollection
        - GuestOrderStatus.lines
        operation: getGuestOrderStatus
        provenance: contract fnb.yaml GET /guest-orders/{orderId}
      - kind: detailPanel
        label: The bill
        bindsTo: Bill
        columns:
        - Bill.visitId
        - Bill.covers
        - Bill.lines
        - Bill.subtotal
        - Bill.serviceCharge
        - Bill.taxAmount
        - Bill.discountAmount
        - Bill.total
        operation: getGuestBill
        provenance: contract fnb.yaml GET /table-sessions/{sessionId}/bill
        notes: The table bill, read through the table session the guest holds. A guest who claimed with
          `claimLocationSession` holds a visit, not a table session, and cannot read it yet (CHG-SGU-024);
          "Pay at the table" until a guest payment of the visit's bill exists.
  states:
    loading: Loading the order.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: 'The order is not found or was refunded (a cold link): says which, with the way back
      to ordering.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data; decided by Chinmay,
      fix before Block A starts, 2 October 2026 (GFIX-4)). No access here means one of two things, told
      apart by the response: not signed in, where the guest is offered sign-in and brought back to this
      screen, or a record that is not theirs, which says so without saying whose it is. **Never an empty
      table** — that reads as *there is no data* and sends somebody to support with the wrong question.'
    offline: '**The offline banner shows.** The last status stays with its age ("Preparing, 2 min ago");
      nothing refreshes until the connection returns.'
  apis:
  - operationId: getGuestOrderStatus
    contract: fnb
    purpose: The order's status (ordered, accepted, in preparation, ready, served, collected or delivered),
      read on entry and polled while the screen is open; order updates show here, and in the in-venue
      notifications feed too, which is back in the first release (decided 29 September, rev 3 GAP-C1,
      reversing the deferral of audit R242)
    trigger: onInterval
  - operationId: getGuestBill
    contract: fnb
    purpose: The bill for the guest's table
    trigger: onLoad
  entryState:
    params:
    - name: subjectId
      from: session
    - name: orderId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen reads it with `getGuestBill`;
        an edge that holds one may still carry it to open on that record.'
    - name: sessionId
      from: deepLink
    - name: venueId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with `orderId`, `sessionId`. **`venueId`
      is the venue the guest picked on the home screen** (WEB-001 on the web, GST-001 in the app), remembered
      on the device and changeable there; it is not read from the sign-in (decided 28 September, audit
      R267).'
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-038
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: exact
      view: At the venue → Order food → 'Send to the kitchen'
      differences: No bill or settle-the-bill view (YAML getGuestBill, 'settle the bill').
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
- id: WEB-039
  name: Venue Map & Wait Times
  module: In-venue Services
  requiresModule: queue
  wave: 1
  implementation:
    app: guest-web
    route: /venue-map-and-wait-times
    component: apps/guest-web/src/routes/VenueMapWaitTimes.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
  notes: '**`getVenueMap` was already `guest` audience and offline-capable and no web screen drew it.**
    A map in a browser is a map. **Drawn 26 August** — `Seat Board 3.dc.html` frame `seat-3c`. **The frame
    names this screen on its own face**, which is the first pack to do that: the earlier F&B, POS and
    Retail boards had to be hand-assigned by purpose after three derivation attempts produced nonsense.
    **A board that says what it draws removes the guess entirely.**


    **The map comes from listBookableVenueMaps?venueId (contracts, ledger: the venue -> map read exists),
    so a normal visit has a map to load** (CHG-FXS-003)'
  density: compact
  boardFrames:
  - Seat Board 3.dc.html#seat-3c
  pattern: listDetail
  patternReason: '`listQueues` reads the population and `getVenueMap` reads one of them — list, select,
    act'
  purpose: Where things are, and how long they take.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Waits
        bindsTo: Queue
        columns:
        - Queue.name
        - Queue.kind
        - Queue.operatingWindows
        operation: listQueues
        provenance: decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)
        notes: Wait times by category (rides, dining). The venue is the one the guest picked on Home (`venueId`
          from the session, audit R267), never typed. Was the generated table 'Every queue'; staff and
          plumbing columns removed (decided by Chinmay, fix before Block A starts, 2 October 2026 (GFIX-3)).
      - kind: cardList
        label: Venue Map & Wait Times
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Detail
        provenance: carried from the previous definition
      - kind: selectField
        label: Map
        bindsTo: BookableVenueMaps.maps
        operation: listBookableVenueMaps
        notes: Picked by itself when the venue has one published map.
        provenance: contract venue-map.yaml BookableVenueMaps.maps (defined 4 October 2026, CHG-FXS-003)
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The venue map graph
        bindsTo: VenueMapGraph
        columns:
        - VenueMapGraph.mapId
        - VenueMapGraph.generatedAt
        - VenueMapGraph.nodes
        - VenueMapGraph.edges
        - VenueMapGraph.components
        operation: getVenueMapGraph
        provenance: contract venue-map.yaml GET /venue-maps/{mapId}/graph
      - kind: detailPanel
        label: The wait time
        bindsTo: WaitTime
        columns:
        - WaitTime.queueName
        - WaitTime.status
        - WaitTime.waitMinutes
        - WaitTime.isStale
        - WaitTime.heightRequirementCm
        - WaitTime.zone
        - WaitTime.asOf
        operation: getWaitTimes
        notes: '**A stale wait time is shown with a caveat, never hidden** (decided 28 September, audit
          R080 (b)): where `WaitTime.isStale` is true the minutes stay on screen marked out of date with
          their `asOf` time, as queue.yaml says.'
        provenance: contract queue.yaml GET /queues/wait-times
      - kind: detailPanel
        label: The venue map
        bindsTo: VenueMapDetail
        columns:
        - VenueMapDetail.map
        - VenueMapDetail.points
        - VenueMapDetail.paths
        operation: getVenueMap
        provenance: contract venue-map.yaml GET /venue-maps/{mapId}
  states:
    loading: Content resolves in place.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: '**Nothing here yet for this venue.** Names what turns it on rather than showing an
      empty panel.'
    emptyNoResults: No attraction of the category picked; the other categories stay.
    emptyNoAccess: Shown when the caller lacks `VENUE_MAP_VIEW`, which `getVenueMap` requires to show
      this screen, and names that permission (the screen's other reads need `QUEUE_VIEW` and say so in
      their own panels). **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**The offline banner shows.** A map and route graph already loaded stay usable, so directions
      do not need a signal. Wait times show their last reading marked out of date, never as live — a queue
      length from an hour ago sends a guest to the wrong ride. With no map loaded yet, the screen asks
      the guest to reconnect.'
  apis:
  - operationId: getVenueMap
    contract: venue-map
    purpose: A map with its points and paths
    trigger: onLoad
  - operationId: getVenueMapGraph
    contract: venue-map
    purpose: The navigation graph, ready to route over
    trigger: onLoad
  - operationId: getWaitTimes
    contract: queue
    purpose: Wait times across a venue
    trigger: onLoad
  - operationId: listQueues
    contract: queue
    purpose: List queues
    trigger: onLoad
  - operationId: listBookableVenueMaps
    contract: venue-map
    purpose: The venue's published map (query venueId), whose mapId getVenueMap and getVenueMapGraph take
    trigger: onLoad
    provenance: defined 4 October 2026 (CHG-FXS-003)
  entryState:
    params:
    - name: mapId
      from: deepLink
      optional: true
      notes: Otherwise the venue's published map from listBookableVenueMaps.
    - name: venueId
      from: session
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with `mapId`. **`venueId` is the venue
      the guest picked on the home screen** (WEB-001 on the web, GST-001 in the app), remembered on the
      device and changeable there; it is not read from the sign-in (decided 28 September, audit R267).'
    preloaded:
    - Queue.code
    - Queue.name
    - Queue.venueId
    - Queue.attractionProductId
    - Queue.assetId
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-039
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (30 September build)
      verified: '2026-10-01'
      match: exact
      view: Summit Peaks → header 'At the venue' → Map & waits (3D view, with the 2D plan one tap away)
      differences: Prototype adds turn-by-turn walking directions and navigation mode. The map has a 3D
        view / 2D plan switch ("Same plan, drawn two ways"); no map3dUnavailable or weakGps state is drawn.
    derivedFrom: wireframes/reference/Seat Board 3.dc.html
    note: '**Drawn by Claude Design on `Seat Board 3.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
- id: WEB-040
  name: Virtual Queue
