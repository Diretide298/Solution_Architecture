  notes: 'Consent withdrawal must be as easy as granting it. Same screen, same number of clicks. Purpose
    derived from the screen name and its operations on 17 August, not from a requirement. Profile and
    Preferences. **Wishlist and device operations removed; profile, consent and email verification added.**
    Deep listed exactly these. **Rewired on the 20 August review.**


    **29 September (W1).** *Complete your details* for a profile created by guest checkout.'
  density: compact
