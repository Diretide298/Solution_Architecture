  wave: 1
  capability: C51
  implementation:
    app: guest-web
    route: /booking-and-selection/seat-map-selection
    component: apps/guest-web/src/routes/booking-and-selection/SeatMapSelectionCanvas.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-006
    - WEB-004
    - WEB-049
    exitTo:
    - WEB-001
    - WEB-005
    - WEB-006
    - WEB-008
    - WEB-010
    transitions:
    - to: WEB-005
      trigger: Ticket Type Selection
      provenance: 'derived — WEB-005 declares entryState.params cartId, productId and WEB-007 holds none
        of them. The edge carries nothing: cartId only pre-selects (deep link or optional); WEB-005 finds
        productId (listProducts) itself, and WEB-005 opens on its own'
    - to: WEB-008
      trigger: Add-ons & Upsell
      provenance: 'derived — WEB-008 declares entryState.params bundleId and WEB-007 holds none of them.
