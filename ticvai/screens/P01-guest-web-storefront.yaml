    emptyNoResults: Nothing matches.
    emptyNoAccess: '**Sign in to see this.** A guest who is not signed in is offered the door, not refused.'
    offline: '**The offline banner shows.** The guest''s place stays on screen with its age, so they can
      see they hold it. Joining and leaving need the connection — a place taken offline is a place nobody
      else can see.'
  apis:
  - operationId: joinQueue
    contract: queue
    purpose: Join a virtual queue
    trigger: onAction
  - operationId: getWaitingGuest
    contract: queue
    purpose: The guest's place and the call to come forward, read on entry and polled while the screen
