- id: WEB-029
  name: Error / Sold Out / Maintenance
  module: System States
  requiresModule: core
  wave: 1
  capability: C57
  implementation:
    app: guest-web
    route: /system-states/error-sold-out-maintenance
    component: apps/guest-web/src/routes/system-states/ErrorSoldOutMaintenanceDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    inferred: true
    exitTo:
    - WEB-001
  notes: Tenant-branded. An unbranded error page inside a tenant's storefront reads as the tenant's failure,
    not ours. Purpose derived from the screen name and its operations on 17 August, not from a requirement.
    **Bound 28 September** — sold out and closed come from `getTenantAppStatus.availability` (`open`,
    `soldOut`, `closed`) and `availabilityMessage` (decided 28 September, audit R073 (f)). The forced
    upgrade (`minimumAppVersion`) is the app's alone, since a website is always the current version.
  density: compact
  pattern: statusTracker
  patternReason: '`getTenantAppStatus` reads one record and nothing reads a population — the screen is
    about that one thing'
  purpose: Say what is wrong in a way that tells the person whether to wait or leave.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: banner
        label: Closed for maintenance
        bindsTo: PublishedTenantConfig.maintenanceMessage
        operation: getPublishedTenantConfig
        notes: 'The main case: `isInMaintenance` with its message and the expected-back time ("Back at
          14:00"), set live on CMS-001 (DI-215).'
        provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
      - kind: detailPanel
        label: The tenant app status
        bindsTo: TenantAppStatus
        columns:
        - TenantAppStatus.isPublished
        - TenantAppStatus.publishedVersion
        - TenantAppStatus.publishedAt
        - TenantAppStatus.isInMaintenance
        - TenantAppStatus.maintenanceMessage
        - TenantAppStatus.expectedBackAt
        - TenantAppStatus.availability
        - TenantAppStatus.availabilityMessage
        operation: getTenantAppStatus
        provenance: contract white-label.yaml GET /tenant-config/status
      - kind: banner
        label: Sold out or closed today
        bindsTo: TenantAppStatus.availabilityMessage
        operation: getTenantAppStatus
        notes: '**From `getTenantAppStatus.availability`** (`open`, `soldOut`, `closed`) and its `availabilityMessage`,
          set live from CMS-001 through `setMaintenanceMode` (decided 28 September, audit R073 (f)). `soldOut`
          and `closed` read differently: sold out means come another day, closed means the venue is not
          open. Nothing shows while it is `open`.'
        provenance: contract white-label.yaml GET /tenant-config/status
  states:
    loading: —
    error: '**This screen is the error state.** It distinguishes sold out, closed, and platform unavailable
      — three different things a guest must not confuse, because only one means come back later'
    emptyFirstRun: —
    emptyNoAccess: '**Nothing here needs a sign-in** (decided by Chinmay, fix before Block A starts, 2
      October 2026 (GFIX-2)): the screen reads only what the tenant has published, which is public, so
      there is no no-access case. A host that belongs to no tenant shows the platform''s neutral holding
      page.'
    offline: '**The offline banner shows instead of this page.** Being offline is the guest''s connection,
      not the venue''s — an error or maintenance page shown for a dropped signal tells a guest the venue
      is down.'
    soldOut: '**Sold out today.** `getTenantAppStatus.availability` is `soldOut`: the page says so with
      the tenant''s `availabilityMessage` and offers another day, never a generic error (decided 28 September,
      audit R073 (f)).'
    closed: '**Closed.** `getTenantAppStatus.availability` is `closed`: the page says the venue is not
      open, with the tenant''s `availabilityMessage` and the opening hours from `contact` (decided 28
      September, audit R073 (f)).'
    maintenance: The venue's maintenance message and when it expects to be back; one way onward (try again
      at that time). Set live on CMS-001, never published.
  apis:
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: from page inventory
    trigger: onLoad
  - operationId: getPublishedTenantConfig
    contract: white-label
    purpose: Maintenance, message and expected-back time, readable without signing in
    trigger: onLoad
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-029
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: exact
      view: Footer 'Service status', or Discover → 'Service status'
      differences: 'Prototype has ''Maintenance'' where YAML has ''closed''; sold-out offers ''Join the
        waitlist'' (holds a returned place for 15 minutes), which the YAML screen (getTenantAppStatus
        only) cannot call. **Do not draw "Join the waitlist" on the sold-out page**: this screen calls
        no waitlist operation; a sold-out performance waitlist belongs to the event booking screens (CHG-SGU-022).'
  apisNote: 'Rebuilt 9 September 2026 from the 1 operation this screen declares, not from a workshop pack
    — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
