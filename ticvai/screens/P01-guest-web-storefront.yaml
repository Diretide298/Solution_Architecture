      order updates arrive once the connection is back, and the banner is the warning that they may be
      late.'
    emptyNoResults: '**No unread notifications.** Names the Unread only filter and offers to show all;
      the read ones are still there.'
  apis:
  - operationId: claimLocationSession
    contract: fnb
    purpose: Tell the platform where the guest is
    trigger: onAction
  - operationId: listMyNotifications
    contract: marketing-crm
    purpose: 'The guest''s notification feed, newest first: queue calls, order ready, booking changes,
