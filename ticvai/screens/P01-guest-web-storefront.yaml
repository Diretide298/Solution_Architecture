        operation: getMarketingSubscription
        notes: One row per list with a toggle per channel; a channel can be switched on only where marketing
          consent for it is given, otherwise the toggle asks "Allow offers by email?" first and records
          the consent in the same act. The guest never types an id, a subject, a token or a list name.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: textField
        label: Channel toggle
        operation: setMarketingSubscription
        notes: 'Arriving from an email link with its unsubscribe token: that list on that channel is unsubscribed
          at once ("You will no longer receive Coastal Aqua news by email"), with no sign-in and no confirmation.
          Resubscribing needs sign-in.'
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
        bindsTo: MarketingSubscription.isSubscribed
  states:
    loading: —
    error: Could not subscribe. **Consent is not recorded on a failed request**, because a subscription
      the guest believes happened and did not is worse than a visible failure
    emptyFirstRun: —
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from here**
      — an empty list with the filter state hidden elsewhere is a person who thinks the data is gone.
      **Added 25 August with the derived list component**: a screen that lists has to say what it shows
      when the list is empty, and this screen gained the list before it gained the sentence.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**Not available, and the offline banner says why.** A consent change must reach the server
      to mean anything.'
  apis:
  - operationId: recordConsent
    contract: marketing-crm
    purpose: from page inventory
    trigger: onAction
  - operationId: getMarketingSubscription
    contract: marketing-crm
    purpose: What this guest has opted into
    trigger: onLoad
  - operationId: setMarketingSubscription
    contract: marketing-crm
    purpose: Subscribe or unsubscribe
    trigger: onAction
  - operationId: getGuestConsents
    contract: marketing-crm
    purpose: The current consent per channel (signed in)
    trigger: onLoad
  - operationId: listConsentPurposes
    contract: marketing-crm
    purpose: The purposes the consent rows show
    trigger: onLoad
  entryState:
    params:
    - name: subjectId
      from: session
    - name: unsubscribeToken
      from: deepLink
      optional: true
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `deviceId`, `itemId`.'
    preloaded:
    - GuestDevice.id
    - GuestDevice.subjectId
    - GuestDevice.platform
    - GuestDevice.tokenFingerprint
    - GuestDevice.tokenRef
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-027
    prototype:
      file: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html
      rev: rev 3 (pointer moved to the 30 September build, CHG-R1S-015)
      verified: 2026-09-28
      match: partial
      view: Account → 'Newsletters'; Contact page → 'Choose newsletters'
      differences: Per-venue and channel toggles only for signed-in guests; no signed-out email sign-up
        form.
  apisNote: 'Rebuilt 9 September 2026 from the 9 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
