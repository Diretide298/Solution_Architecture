- id: EMP-010
  name: Scan — ready
  module: Operations
  purpose: The raised centre action, and the thing this app is for.
  capability: C00
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
      - kind: scanTarget
        derived: true
        impliedBy: listScans
        notes: '**A screen that validates a credential needs somewhere to point the camera.** `denied`
          and `hardwareError` look different because an operator facing a guest needs to know whether
          to try again or explain something.'
      - kind: searchField
        derived: true
        impliedBy: lookupTicket
        label: Search
        notes: A search that returns nothing must say so differently from a search not yet run.
      - kind: primaryButton
        derived: true
        impliedBy: overrideAccess
        notes: The act the screen exists for.
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: syncScans
  states:
    loading: Instant. This screen must never wait
    emptyFirstRun: —
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `ACCESS_OVERRIDE`, `ACCESS_VALIDATE`, `REPORT_VIEW_VENUE` and 1 more to use accesses; a
      person without it sees the reason and who to ask, because an empty table reads as *there is no
      data* and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `access` is not licensed.** The tenant has not bought this module, which is
      a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Camera failed — distinct from a bad scan and needing a different response
    offline: '**Keep working when the network does not.** The screen already had an `offline` state.'
    outcomeAdmitted: '**Confirm entry, then get out of the way.** Was a screen until 18 August; the
      name said it — `Scan — admitted` is a state of `Scan` with a dash in it.'
    outcomeDenied: '**Give the reason and the next action.**'
    overrideDialog: '**Admit against a failed validation, on the record.** A confirm dialog on `outcomeDenied`
      — an override is a decision taken while looking at the denial.'
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from
      here** — an empty list with the filter state hidden elsewhere is a person who thinks the data
      is gone. **Added 25 August with the derived list component**: a screen that lists has to say what
      it shows when the list is empty, and this screen gained the list before it gained the sentence.'
