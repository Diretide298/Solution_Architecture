# P06 — Staff App — Operations
#
# Derived from the wireframe board on 14 August. **Purposes and navigation are real;
# components, states and operations are not yet written.** Every screen carries
# wireframe.status drafted so the gap is visible rather than implied.

platform:
  code: P06
  audience: staff
  formFactor: mobileApp
  shortName: Venue Staff App
  name: Venue Staff App — Operations
  surface: staffFacing
  runtime: reactNative
  app: venue-staff-app
  appStatus: scaffolded
  offlineCapable: true
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: iOS / Android native
    distribution: MDM, not a public store
    bundleUpdate: on launch
    hosting: in-cell
    storeReview: false
    deviceOwnership: venue-owned or BYOD
    networkAssumption: venue wifi, dead zones expected
    releaseCadence: fortnightly
  screenCount: 66
  designReferences:
  - path: sources/designs/TICVAI_Employee_App_UI_Reference_1.pdf
    note: Employee app reference — dark theme, and the Home · Tasks · Scan · AI · More nav that CF-41
      is about.
  operator: venue
  directions:
  - ltr
  - rtl
  wireframeBoard: wireframes/P06 Venue Staff App.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: EMP-001
  name: Sign in
  module: Operations
  purpose: Get an employee onto a shared device fast.
  capability: C00
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
      - kind: primaryButton
        derived: true
        impliedBy: login
        notes: The act the screen exists for.
      - kind: dataTable
        derived: true
        impliedBy: listMfaMethods
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: login
  states:
    loading: Biometric prompt, or SSO redirect
    emptyFirstRun: Not applicable
    emptyNoAccess: '**Never rendered as an empty list.** A person who cannot see this screen is told
      so and told who to ask — an empty table reads as *there is no data*, which sends somebody to support
      with the wrong question.'
    error: Sign-in failed, with the reason
    offline: Signs in against the cached principal list. A technician in a basement still needs their
      tasks
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from
      here** — an empty list with the filter state hidden elsewhere is a person who thinks the data
      is gone. **Added 25 August with the derived list component**: a screen that lists has to say what
      it shows when the list is empty, and this screen gained the list before it gained the sentence.'
  navigation:
    exitTo:
    - EMP-002
    - EMP-003
    - EMP-048
    inferred: true
    fromFlows: true
    isEntryPoint: true
  wireframe:
    status: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-001
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Sign in.** A shared device between shifts shows nothing until somebody identifies
    themselves. **Declared 20 August** — `isEntryPoint` existed in the schema and five platforms used
    none, so every screen in them read as unreachable. **Removed 24 August**: forceLogout, listActiveSessions,
    revokeAllSessions. **Bulk-attach residue** — the 18 August defect that put identical operation sets
    on unrelated screens. A till does not cancel a performance, a staff app does not create roles, and
    **a scanner does not run a cash shift.**'
  implementation:
    app: venue-staff-app
    route: /operations/sign-in
    component: apps/venue-staff-app/src/routes/operations/SignInDetail.tsx
    status: notStarted
  apis:
  - operationId: login
    contract: identity
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: getGuestSession
    contract: identity
    purpose: Read the current guest session
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  density: comfortable
  entryState:
    params:
    - name: sessionId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
  requiresModule: core
  statesDerived: true
