    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-096
  notes: CF-125. **Conflict detection before assignment is the whole point** — two bookings on one cabana
    is a guest arriving to find somebody in their chair, and it must be impossible rather than unlikely.
  entryState:
    params:
    - name: resourceId
