- id: BO-093
  name: Map Import & Labelling
  module: Access & Venue
  wave: 2
  purpose: Upload a plan, check what was read, and review what the assistant suggests.
  apis:
  - operationId: importVenueGeometry
    contract: venue-map
    purpose: Read the drawing
    trigger: onAction
  - operationId: proposeVenueLabels
    contract: ai
    purpose: Suggest labels
    trigger: onAction
  - operationId: acceptVenueLabelProposals
    contract: venue-map
    purpose: Accept or reject
    trigger: onAction
  states:
    loading: Parsing the drawing
    emptyFirstRun: '**No shapes found.** Every layer name in the file is listed so a role can be mapped
      by reading rather than guessing'
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `VENUE_MAP_MANAGE` to manage venues; a person without it sees the reason and who to ask,
      because an empty table reads as *there is no data* and sends somebody to support with the wrong
      question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `seating` is not licensed.** The tenant has not bought this module, which
      is a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: '**Unreadable, or no layer matched.** The two are shown separately — a file that could not
      be opened and a file whose layers nobody claimed need different fixes'
  notes: 'CF-123. **Two failure modes on one screen, kept visually apart.** Extraction is deterministic
    and reports which layers it found; labelling is a proposal with a confidence. **A mis-parsed layer
    and a bad suggestion look identical if the screen blurs them**, and the operator is left saying
    only that the map is wrong. **Low-confidence proposals are shown, not filtered** — the shape the
    assistant is unsure about is the one most worth a human looking at. **Drawn 26 August** — `Seat
    Board 1.dc.html` frame `seat-1a`. **The frame names this screen on its own face**, which is the
    first pack to do that: the earlier F&B, POS and Retail boards had to be hand-assigned by purpose
