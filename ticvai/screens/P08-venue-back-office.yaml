- id: BO-096
  name: Resource Calendar
  module: Access & Venue
  wave: 2
  purpose: See what is free, and book it without double-booking.
  apis:
  - operationId: getResourceAvailability
    contract: resources
    purpose: Free windows
    trigger: onLoad
  - operationId: bookResource
    contract: resources
    purpose: Reserve
    trigger: onAction
  states:
    loading: Calendar grid; today renders first
    emptyFirstRun: Nothing booked in this window. **Free is the default state and it is worth showing
      plainly** — an empty calendar at a venue that takes bookings is either a quiet week or a resource
      nobody knows exists.
    emptyNoResults: No availability in this window. The response says why — booked, setup, teardown,
      maintenance or closed — because **wait and look elsewhere are different answers**.
    emptyNoAccess: You do not have RESOURCE_VIEW.
    error: Could not load availability. **Do not book blind** — a booking made against a stale calendar
      is the double-booking this screen exists to prevent.
  layout:
    template: calendar
    regions:
    - name: contentBody
      components:
      - kind: timeline
        bindsTo: ResourceAvailability
        notes: Setup and teardown render as their own bands, not as part of the booking — **a 30-minute
          turnaround is invisible if it is drawn inside the booking**
      - kind: primaryButton
        label: Book
      - kind: banner
        notes: Conflicts, named with times. *Not available* on something a guest can see is not an answer
  density: compact
  navigation:
    entryFrom:
    - BO-095
    exitTo:
