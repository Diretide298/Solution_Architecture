- id: BO-100
  name: Venue Home
  module: Venue Operations
  wave: 1
  purpose: The screen a venue manager opens in the morning, and the only way into everything else.
  density: compact
  apis:
  - operationId: getVenueSettings
    contract: tenancy
    purpose: What this venue is configured to do
    trigger: onLoad
  - operationId: listShifts
    contract: shift
    purpose: Who is on and what has been taken
    trigger: onLoad
  states:
    loading: The tiles render in place; each resolves on its own so one slow source does not hold the
      page.
    emptyFirstRun: '**A venue on its first morning.** No shifts, no orders, no stock. The state links
      to the opening checklist rather than showing eight empty tiles — **a dashboard of zeroes teaches
      a new manager nothing.**'
    emptyNoResults: Nothing happened in the window selected. Yesterday and today are the useful defaults.
    emptyNoAccess: '**Sections you cannot open are not shown.** A manager with no finance permission
      sees seven sections, not eight greyed out — a menu that lists what you may not do is a menu that
      invites a support ticket.'
    error: Could not load the summary. **Every section is still reachable** — this screen is a landing
      page, and a failed tile must not block navigation.
    partial: '**Some tiles resolved and some did not, and it says which.** A dashboard showing three
      numbers where four were promised is a manager acting on a partial picture without knowing it.'
  layout:
    template: dashboard
    regions:
    - name: sideNav
      components:
      - kind: treeNav
        bindsTo: sections
        notes: The eight sections. **Persistent — a back office is a place somebody works all day**,
          and a nav that disappears on every detail screen makes them use the browser back button as
          navigation.
    - name: contentBody
      components:
      - kind: metricTile
        notes: 'Today: takings, admissions, open shifts, items needing attention. **Four, not twelve**
          — a tile nobody acts on is a tile that trains people to ignore the row.'
      - kind: cardList
        bindsTo: sections
        notes: One card per section with its count of items needing attention. **The count is the point**
          — a section with nothing pending should look different from one with eleven approvals waiting.
      - kind: banner
        notes: Alerts that crossed a threshold, from VenueSettings.alerting. **On-platform and markable
          as read** (CF-134).
  navigation:
    isEntryPoint: true
    exitTo:
    - BO-101
    - BO-102
    - BO-103
    - BO-104
    - BO-105
    - BO-106
    - BO-107
    - BO-108
    entryFrom:
    - BO-108
  implementation:
    app: venue-management-web
    route: /home
    component: apps/venue-management-web/src/routes/home/VenueHomeDashboard.tsx
    status: notStarted
  wireframe:
    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-100
  notes: '**Built 20 August because P08 had none.** `BO-001 Queue Directory` was the declared entry
    point to a 99-screen back office — it exits to four queue screens, and **93 screens hung off nothing.**
    A back office entered through a queue list. **The module was also one bucket holding 72 of 99 screens**,
    so there was nothing for a home screen to point at; sections were derived from the contract each
    screen principally calls.'
  entryState:
    params:
    - name: venueId
      from: session
    coldEntry: '**Resolves from the session, so a cold arrival is the ordinary case** — a manager bookmarks
      the back office and opens it every morning. A principal with more than one venue is asked which
      before the page renders, rather than shown the first one.'
