- id: BO-006
  name: Parking Configuration
  module: Access & Venue
  purpose: Change how parking behaves here, and see which level the current value came from.
  capability: C39
  wave: 2
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: TODO
      - kind: dataTable
        derived: true
        impliedBy: listAccessPoints
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
      - kind: primaryButton
        derived: true
        impliedBy: updateAccessPoint
        label: Save access point
        notes: The act the screen exists for.
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: updateAccessPoint
  states:
    loading: Current values, with the level each resolves from
    emptyFirstRun: Nothing set at this level — the inherited value is shown and labelled as inherited
      (ADR-0018)
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `ACCESS_POINT_CONFIGURE`, `PARKING_CONFIGURE`, `SCOPE_VIEW` to configure accesses; a person
      without it sees the reason and who to ask, because an empty table reads as *there is no data*
      and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `access` is not licensed.** The tenant has not bought this module, which is
      a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: '**Could not load. Saving is blocked**, because a value saved over an unread one silently
      overwrites what someone else set'
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from
      here** — an empty list with the filter state hidden elsewhere is a person who thinks the data
      is gone. **Added 25 August with the derived list component**: a screen that lists has to say what
      it shows when the list is empty, and this screen gained the list before it gained the sentence.'
  wireframe:
    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-006
  notes: Placeholder. Parking was discussed on 14 August and the MoM has not yet been received. States
    derived from the screen pattern on 17 August, not individually considered — sound for a list, a
    form or a money screen, and worth revisiting where this screen is unusual. Purpose derived from
    the screen name and its operations on 17 August, not from a requirement.
