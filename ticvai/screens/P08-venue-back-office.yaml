# P08 — Venue Back Office
#
# STARTED, NOT COMPLETE. The page inventory counts 73 back office screens and
# itemises none of them — a figure carried from v1 with no list behind it.
# These six are the queue integration surface the client decided on 14 August,
# plus a parking placeholder pending that day's MoM.

platform:
  code: P08
  audience: staff
  formFactor: web
  shortName: Venue Management
  name: Venue Management — Back Office
  surface: staffFacing
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 143
  app: venue-management-web
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: venue-owned workstation
    networkAssumption: venue LAN
    releaseCadence: weekly
  operator: venue
  wireframeBoard: wireframes/P08 Venue Management.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: BO-001
  name: Queue Directory
  module: Access & Venue
  purpose: See every queue in the venue and whether its data is arriving.
  capability: C05
  wave: 1
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: dataTable
        bindsTo: Queue[]
        notes: Current wait, source, feed health, status
      - kind: banner
        notes: Queues whose feed has gone quiet. The first thing a duty manager checks
  states:
    loading: Table skeleton
    emptyFirstRun: No queues configured, with the action to create one
    emptyNoResults: '**Nothing matched.** This screen has no filter of its own, so the scope is what
      narrowed it — the venue, the shift or the date the person arrived with. **Naming the scope is
      what stops somebody concluding the record does not exist.**'
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `EVENT_CONFIGURE`, `PERFORMANCE_CONFIGURE`, `PRODUCT_VIEW` and 2 more to configure events;
      a person without it sees the reason and who to ask, because an empty table reads as *there is
      no data* and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `queue` is not licensed.** The tenant has not bought this module, which is
      a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Queue service unavailable. Manual wait times can still be set — the fallback must not depend
      on the thing that failed
  wireframe:
    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-001
  permission: QUEUE_VIEW
  apis:
  - operationId: listQueues
    contract: queue
    purpose: Every queue with its current wait
    trigger: onLoad
  - operationId: listQueueFeeds
    contract: queue
    purpose: Feed health per queue
    trigger: onLoad
  - operationId: listPerformances
    contract: catalogue
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: callNextParties
    contract: queue
    purpose: Call the next parties forward
    trigger: onAction
  - operationId: configureQueueFeed
    contract: queue
    purpose: Configure a sensor feed
    trigger: onAction
  - operationId: createEvent
    contract: catalogue
    purpose: Create an event
    trigger: onAction
  - operationId: createPerformances
    contract: catalogue
    purpose: Create performances, singly or by schedule
    trigger: onAction
  - operationId: createQueue
    contract: queue
    purpose: Create a queue
    trigger: onAction
  - operationId: getEvent
    contract: catalogue
    purpose: Read an event
    trigger: onLoad
  - operationId: getQueue
    contract: queue
    purpose: Read a queue with live position
    trigger: onLoad
  - operationId: getQueueFeedHealth
    contract: queue
    purpose: Feed health
    trigger: onLoad
  - operationId: getWaitTimes
    contract: queue
    purpose: Wait times across a venue
    trigger: onLoad
  - operationId: listEvents
    contract: catalogue
    purpose: List events
    trigger: onLoad
  - operationId: listQueueEntries
    contract: queue
    purpose: List entries in a queue
    trigger: onLoad
  - operationId: setQueueStatus
    contract: queue
    purpose: Open, pause or close a queue
    trigger: onAction
  - operationId: setWaitTime
    contract: queue
    purpose: Manually set a wait time
    trigger: onAction
  - operationId: testQueueFeed
    contract: queue
    purpose: Test a feed before trusting it
    trigger: onAction
  - operationId: updateEvent
    contract: catalogue
    purpose: Amend an event
    trigger: onAction
  - operationId: updateQueue
    contract: queue
    purpose: Amend queue configuration
    trigger: onAction
  notes: A queue on the manual adaptor shows "manual" rather than "no feed". It is configured and working;
    treating it as unconfigured makes the health view lie. **Was the declared entry point to the whole
    back office until 20 August**, which is why 93 screens were unreachable. Now reached from BO-100
    through its section.
  implementation:
    app: venue-management-web
    route: /queue-management/queue-directory
    component: apps/venue-management-web/src/routes/queue-management/QueueDirectoryList.tsx
    status: notStarted
  navigation:
    exitTo:
    - BO-002
    - BO-003
    - BO-004
    - BO-005
    inferred: true
  density: compact
  entryState:
    params:
    - name: eventId
      from: deepLink
    - name: feedId
      from: deepLink
    - name: queueId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No
      silent redirect — a supervisor following a link from an alert needs to know whether the record
      moved, closed or never existed, because those are three different next actions. **The scope is
      resolved from the session, never from the link**: a link cannot move somebody to a venue they
      do not hold. Arrives with `eventId`, `feedId`, `queueId`.'
  requiresModule: queue
  statesDerived: true
