- id: BO-094
  name: Map Editor & Publish
  module: Access & Venue
  wave: 2
  purpose: Place booths, toilets, exits, rides and restaurants, then publish.
  apis:
  - operationId: getVenueMap
    contract: venue-map
    purpose: The draft
    trigger: onLoad
  - operationId: setVenuePoint
    contract: venue-map
    purpose: Place a point
    trigger: onAction
  - operationId: publishVenueMap
    contract: venue-map
    purpose: Publish
    trigger: onAction
  - operationId: validateVenueMapGraph
    contract: venue-map
    purpose: What is unreachable, before anyone publishes it
    trigger: onAction
  - operationId: setPathClosure
    contract: venue-map
    purpose: Close a route during works or an incident
    trigger: onAction
  - operationId: getVenueMapGraph
    contract: venue-map
    purpose: The navigation graph, ready to route over
    trigger: onLoad
  states:
    loading: The draft with its points and paths
    emptyFirstRun: An imported map with no points. **Import gives geometry; this gives it meaning**
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `VENUE_MAP_MANAGE`, `VENUE_MAP_PUBLISH`, `VENUE_MAP_VIEW` to manage venues; a person without
      it sees the reason and who to ask, because an empty table reads as *there is no data* and sends
      somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `seating` is not licensed.** The tenant has not bought this module, which
      is a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Could not save. The published map is untouched
  notes: 'CF-123. **Publishing is a separate act from saving**, and the screen makes that visible —
    editing a live map under a guest standing in front of it is how a route ends at a wall. **Refuses
    to publish a point linked to a closed outlet**, naming which one: a restaurant point pointing nowhere
    is worse than no point, because a guest walks there. **`isStepFree` on a path is the field to get
    right** — a wheelchair user routed up a staircase was failed by the map, not the venue. **Graph
    validation runs before publish and on demand.** The screen separates two findings that read the
    same and are not: **an unreachable point is a defect, and a point reachable only by steps is a map
    that works until a wheelchair user opens it.** **Critical points — first aid, emergency exits, assembly
    points — are listed apart**, because an unreachable gift shop and an unreachable assembly point
    should not sit in one list of two hundred. **Drawn 26 August** — `Seat Board 1.dc.html` frame `seat-1b`.
    **The frame names this screen on its own face**, which is the first pack to do that: the earlier
    F&B, POS and Retail boards had to be hand-assigned by purpose after three derivation attempts produced
