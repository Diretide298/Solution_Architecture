- id: BO-003
  name: Queue Integration Setup
  module: Access & Venue
  purpose: Connect a queue to an on-site system, or leave it on manual entry.
  capability: C05
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: selectField
        label: Source
        notes: Manual, sensor API, webhook, MQTT, vendor poll, turnstile count, CV camera. Manual is
          the default and a valid end state
      - kind: textField
        label: Endpoint or topic
        notes: Hidden when the source is manual
      - kind: textField
        label: Credential reference
        notes: A key vault reference, never the secret. A secret typed into a form ends up in a screenshot
      - kind: numberField
        label: Expected interval (seconds)
        notes: Drives the went-quiet alarm. Too tight and a duty manager learns to ignore it
      - kind: secondaryButton
        label: Test connection
        notes: Runs testQueueFeed. Configuring an integration without a test is configuring it blind
      - kind: detailPanel
        bindsTo: FeedTestResult
        notes: Five checks, plus the mapped sample reading and the raw payload. A source that is reachable
          and returns a shape nobody mapped looks like silence, not an error
      - kind: toggle
        label: Enabled
        notes: Disabled by default. A feed goes live only after a passing test
    - name: actionBar
      components:
      - kind: primaryButton
        label: Save
  states:
    loading: Form skeleton
    emptyFirstRun: Not applicable
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `QUEUE_MANAGE` to configure a queue feed; a person without it sees the reason and who to
      ask.


      **Also reached when `queue` is not licensed** — a commercial answer, not a permission one, and
      the person to ask is different.'
    error: Save failed. The test result stays on screen — losing it forces the configurer to run the
      test again
  wireframe:
    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-003
  permission: QUEUE_MANAGE
  apis:
  - operationId: configureQueueFeed
    contract: queue
    purpose: Set the source
    trigger: onAction
  - operationId: testQueueFeed
    contract: queue
    purpose: One exchange with the configured source
    trigger: onAction
  - operationId: getQueueFeedHealth
    contract: queue
    purpose: Current feed state
    trigger: onLoad
  - operationId: listQueueFeeds
    contract: queue
    purpose: List configured sensor feeds
    trigger: onLoad
  notes: 'ADR-0012, adaptor-first. A named vendor is a driver behind a stable inbound shape, so adding
    one is configuration plus a driver rather than a core change. Vendor selection is CF-33a and deliberately
    late. **createRefund removed 18 August** — attached by module resemblance, not by what this screen
    does. A screen that does not handle money should not be able to move it (CF-87''s class). **Corrected
    24 August**: removed applyManualDiscount, createOrder, exchangeOrderLines, getOrder, getOrderStatement,
    getRefundPolicy and 11 more. **A queue integration screen carried 15 order operations** — create
    an order, apply a discount, exchange lines, hold, refund — and four queue ones. Bulk-attach residue,
    and `requiresModule` was `ticketing` to match the operations rather than the screen.


    **Found by deriving the empty states.** `emptyNoAccess` came out reading *"needs `ORDER_CREATE`
    to create orders"* on a screen called Queue Integration Setup — **a generated sentence that was
    accurate to the data and absurd about the screen**, which is exactly what made it visible.'
  implementation:
    app: venue-management-web
    route: /queue-management/queue-integration-setup
    component: apps/venue-management-web/src/routes/queue-management/QueueIntegrationSetupForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - BO-001
    inferred: true
    exitTo:
    - BO-001
    - BO-002
    - BO-004
    fromFlows: true
  density: compact
  entryState:
    params:
    - name: feedId
      from: BO-001
    - name: orderId
      from: deepLink
    - name: venueId
      from: session
    coldEntry: '**A guest opening an order link weeks later.** Shows the order if it still resolves;
      if it was refunded or the performance passed, says which and offers the order list rather than
      an error.'
  requiresModule: queue
  statesDerived: true
- id: BO-004
  name: Manual Wait Time Entry
  module: Access & Venue
  purpose: Set a wait time by hand, whether or not a feed exists.
  capability: C05
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: Queue[]
        notes: One row per queue with a stepper and the current value
      - kind: banner
        notes: Where a feed is live, a manual entry overrides it for a stated period and then reverts.
          A permanent silent override is how a broken sensor goes unnoticed for a season
    - name: actionBar
      components:
      - kind: primaryButton
        label: Publish
  states:
    loading: Rows skeleton. Current values render immediately
    emptyFirstRun: No queues configured
    emptyNoResults: '**Nothing matched.** This screen has no filter of its own, so the scope is what
      narrowed it — the venue, the shift or the date the person arrived with. **Naming the scope is
      what stops somebody concluding the record does not exist.**'
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `ORDER_REFUND_APPROVE`, `ORDER_REFUND_BULK`, `QUEUE_MANAGE` and 1 more to approve orders;
      a person without it sees the reason and who to ask, because an empty table reads as *there is
      no data* and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `queue` is not licensed.** The tenant has not bought this module, which is
      a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Publish failed. The entered value is kept on screen
  wireframe:
    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-004
