- id: BO-097
  name: Check Out & Check In
  module: Access & Venue
  wave: 2
  purpose: Hand it over with a deposit, take it back, settle.
  apis:
  - operationId: checkOutResource
    contract: resources
    purpose: Hand over
    trigger: onAction
  - operationId: checkInResource
    contract: resources
    purpose: Take back
    trigger: onAction
  - operationId: authoriseStoredValue
    contract: orders
    purpose: Hold the deposit
    trigger: onAction
  - operationId: releaseStoredValue
    contract: orders
    purpose: Release it
    trigger: onAction
  states:
    loading: The booking and its condition history
    emptyFirstRun: Nothing is out. **The list a poolside attendant checks at close** — anything still
      here at the end of the day is a conversation.
    emptyNoResults: Nothing matches. Overdue items are shown by default because they are the ones that
      need chasing.
    emptyNoAccess: You do not have RESOURCE_BOOK.
    error: Could not load. **Check-out and check-in work offline** — the deposit hold reconciles on
      sync.
    offline: Queued locally. The deposit is authorised on sync, and **the condition note taken now is
      the only defence against a dispute later**.
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        bindsTo: ResourceBooking
      - kind: textField
        label: Condition note
      - kind: fileUpload
        label: Condition photos
        notes: Taken on the way out, not only on the way back
      - kind: primaryButton
        label: Check out
      - kind: secondaryButton
        label: Check in
  density: compact
  navigation:
    entryFrom:
    - BO-095
    - BO-096
  implementation:
    app: venue-management-web
    route: /resources/check-out
    component: apps/venue-management-web/src/routes/resources/ResourceCheckOutForm.tsx
    status: notStarted
  wireframe:
    status: generated
    board: wireframes/P08 Venue Management.dc.html#bo-097
  notes: CF-125, CF-126. **The deposit is held, not taken** — a deposit taken and refunded is two transactions
    and a fee. **Damage routes the resource to maintenance directly**, because routing through available
    leaves a window where the next guest books a broken item. **The deposit operations are declared
    here because this screen calls them** — F25 named them at steps 4 and 5 and the screen did not,
    which the flow checker refused. **A step calling an operation its screen does not declare is one
    of the two out of step**, and in this case it was the screen.
  entryState:
    params:
    - name: authorisationId
      from: deepLink
    - name: bookingId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No
      silent redirect — a supervisor following a link from an alert needs to know whether the record
      moved, closed or never existed, because those are three different next actions. **The scope is
      resolved from the session, never from the link**: a link cannot move somebody to a venue they
      do not hold. Arrives with `authorisationId`, `bookingId`.'
  requiresModule: resources
- id: BO-098
  name: Qualifications
  module: Access & Venue
  wave: 2
  purpose: What a person is certified to do, and until when.
  apis:
  - operationId: setResourceQualifications
    contract: resources
    purpose: Set qualifications
    trigger: onAction
  states:
    loading: Qualifications with their expiry
    emptyFirstRun: No qualifications recorded. **A role is not a skill** — 1.2.36 requires the check
      before assignment, not after.
    emptyNoResults: Nobody matches. Expiring-soon is the default filter, because that is the list somebody
      acts on.
    emptyNoAccess: You do not have RESOURCE_MANAGE.
    error: Could not load.
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: dataTable
        bindsTo: Qualification[]
        notes: Sorted by expiry, not by name — **a lifeguard certificate that lapsed last month is a
          safety failure, not a data-quality one**
      - kind: banner
        notes: Expired qualifications held by staff on today rota
  density: compact
  navigation:
    entryFrom:
    - BO-095
  implementation:
