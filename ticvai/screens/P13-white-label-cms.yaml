platform:
  code: P13
  audience: staff
  formFactor: web
  shortName: Venue CMS
  name: Venue CMS — White Label
  surface: staffFacing
  runtime: reactWeb
  app: venue-management-web
  appStatus: scaffolded
  offlineCapable: false
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell
    storeReview: false
    deviceOwnership: tenant workstation
    networkAssumption: public internet
    releaseCadence: weekly
  screenCount: 100
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: The CMS **is** the White Label Builder. These six boards are the design, not a reference for
      one.
  reachesOtherPlatforms:
  - screen: ADM-016
    platform: P09
    board: P09 TICVAI Web.dc.html#adm-016
    note: White-label branding is administered from the platform console
  - screen: ADM-017
    platform: P09
    board: P09 TICVAI Web.dc.html#adm-017
    note: Domain and certificate management sits with the platform, not the tenant
  operator: venue
  directions:
  - ltr
  - rtl
  wireframeBoard: wireframes/P13 Venue CMS.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-management
    name: TICVAI Venue Management
    shell: web
    siblings:
    - P08
    - P12
    - P16
    note: '**Already one app in all but name** — P08, P13 and P16 declared the same `app` before this
      decision. One tenant-level surface that filters across venues, with analytics, CMS and the support
      desk as sections of it.'
    decided: 10 September 2026
screens:
- id: CMS-001
  name: Tenant Workspace
  module: White Label
  requiresModule: membership
  wave: 2
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/tenant-workspace
    component: apps/venue-management-web/src/routes/white-label/TenantWorkspaceDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - CMS-002
    - CMS-003
    - CMS-004
    - CMS-061
    - CMS-071
    - CMS-081
    - CMS-091
    inferred: true
    isEntryPoint: true
    transitions:
    - to: CMS-003
      trigger: Typography
      provenance: flow F102 step 1→2
    - to: CMS-002
      trigger: Brand Kit
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-004
      trigger: Logo & Assets
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-061
      trigger: Digital Asset Management Command Center
      provenance: structural — pack board 1 wiring, 11 September 2026
    - to: CMS-071
      trigger: AI Asset Intelligence Command Center
      provenance: structural — pack board 2 wiring, 11 September 2026
    - to: CMS-081
      trigger: DAM Governance & Rights Command Center
      provenance: structural — pack board 3 wiring, 11 September 2026
    - to: CMS-091
      trigger: Asset Distribution & Delivery Command Center
      provenance: structural — pack board 4 wiring, 11 September 2026
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations still
    to be written. States derived from the screen pattern on 17 August, not individually considered —
    sound for a list, a form or a money screen, and worth revisiting where this screen is unusual. **The
    tenant workspace.** Lands a tenant on what is live rather than on a form. **Declared 20 August** —
    `isEntryPoint` existed in the schema and five platforms used none, so every screen in them read as
    unreachable. **Drawn 31 August** — `Marketing Board 7.dc.html` frame `crm-7f` (*Agent Workspace*),
    matched on title at 0.84 within this board’s platforms.
  density: compact
  boardFrames:
  - Marketing Board 7.dc.html#crm-7f
  pattern: listDetail
  patternReason: '`listTenants` reads the population and `getSsoConfig` reads one of them — list, select,
    act'
  purpose: Land a tenant somewhere that shows what is live and what is not.
  gaps:
  - operation: getEntitlementUsage
    why: '**7 declared operations reach no component on this screen**: getEntitlementUsage, getSubscription,
      getTenant, getTenantLicences, getUsageMetering, listSubscriptionInvoices, listTenantCells. Either
      the screen is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every tenant
        bindsTo: Tenant
        columns:
        - Tenant.id
        - Tenant.code
        - Tenant.name
        - Tenant.status
        - Tenant.suspensionMode
        - Tenant.suspensionReason
        - Tenant.planId
        - Tenant.planName
        - Tenant.cellCount
        - Tenant.venueCount
        - Tenant.billingEmail
        - Tenant.accountManagerPrincipalId
        operation: listTenants
        provenance: contract subscription.yaml GET /tenants
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected tenant
        bindsTo: SsoProviderConfig
        columns:
        - SsoProviderConfig.id
        - SsoProviderConfig.displayName
        - SsoProviderConfig.protocol
        - SsoProviderConfig.metadataUrl
        - SsoProviderConfig.issuer
        - SsoProviderConfig.clientId
        - SsoProviderConfig.clientSecretRef
        - SsoProviderConfig.groupMappings
        - SsoProviderConfig.autoProvisionPrincipals
        - SsoProviderConfig.isEnforced
        - SsoProviderConfig.isActive
        operation: getSsoConfig
        provenance: contract identity.yaml GET /tenants/sso-config
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save changes
        operation: setSsoConfig
        provenance: contract identity.yaml PUT /tenants/sso-config
      - kind: secondaryButton
        label: Add
        operation: addLicenceAddOn
        provenance: contract subscription.yaml POST /tenants/{tenantId}/licences/add-ons
      - kind: secondaryButton
        label: Create
        operation: createTenant
        provenance: contract subscription.yaml POST /tenants
      - kind: secondaryButton
        label: Generate
        operation: generateInvoice
        provenance: contract subscription.yaml POST /tenants/{tenantId}/invoices
      - kind: secondaryButton
        label: Preview
        operation: previewSubscriptionChange
        provenance: contract subscription.yaml POST /tenants/{tenantId}/subscription/preview
      - kind: secondaryButton
        label: Provision
        operation: provisionCell
        provenance: contract subscription.yaml POST /tenants/{tenantId}/cells
      - kind: secondaryButton
        label: Reactivate
        operation: reactivateTenant
        provenance: contract subscription.yaml POST /tenants/{tenantId}/reactivate
      - kind: destructiveButton
        label: Remove
        operation: removeLicenceAddOn
        provenance: contract subscription.yaml DELETE /tenants/{tenantId}/licences/add-ons
      - kind: secondaryButton
        label: Save changes
        operation: setSubscription
        provenance: contract subscription.yaml PUT /tenants/{tenantId}/subscription
      - kind: destructiveButton
        label: Suspend
        operation: suspendTenant
        provenance: contract subscription.yaml POST /tenants/{tenantId}/suspend
      - kind: destructiveButton
        label: Terminate
        operation: terminateTenant
        provenance: contract subscription.yaml POST /tenants/{tenantId}/terminate
      - kind: secondaryButton
        label: Save changes
        operation: updateTenant
        provenance: contract subscription.yaml PATCH /tenants/{tenantId}
    - name: contentBody
      slot: carried
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
        provenance: carried from the previous definition
      - kind: dataTable
        derived: true
        impliedBy: listTenants
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
        provenance: carried from the previous definition
      - kind: primaryButton
        derived: true
        impliedBy: setSsoConfig
        label: Save sso config
        provenance: carried from the previous definition
      - kind: destructiveButton
        derived: true
        impliedBy: removeLicenceAddOn
        notes: '**Always confirms, never the default focus.** The consequence goes in the body — *cancel
          3 orders worth AED 480* is a confirmation, *are you sure* is not.'
        label: Remove licence add on
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: setSsoConfig
        provenance: carried from the previous definition
      - kind: confirmDialog
        derived: true
        label: Confirm
        notes: '**The consequence goes in the body, not the title.** *Cancel 3 orders worth AED 480* is
          a confirmation; *are you sure* is not — and a dialog that cannot name what it destroys is a
          dialog somebody dismisses.


          **Added 31 August.** `confirmDialog` and `modal` were both in the component library and used
          **zero times across 492 screens**, while `destructiveButton` was used 39 times and its own entry
          reads *always requires confirmation*.'
        provenance: carried from the previous definition
  overlays:
  - id: confirmRemoveLicenceAddOn
    component: confirmDialog
    trigger: Remove
    body: '**Names what `removeLicenceAddOn` changes and what it leaves alone**, in the consequence rather
      than the verb. A tenant this affects should be identified in the dialog, not just counted.'
    provenance: contract subscription.yaml DELETE /tenants/{tenantId}/licences/add-ons
  - id: confirmSuspendTenant
    component: confirmDialog
    trigger: Suspend
    body: '**Names what `suspendTenant` changes and what it leaves alone**, in the consequence rather
      than the verb. A tenant this affects should be identified in the dialog, not just counted.'
    provenance: contract subscription.yaml POST /tenants/{tenantId}/suspend
  - id: confirmTerminateTenant
    component: confirmDialog
    trigger: Terminate
    body: '**Names what `terminateTenant` changes and what it leaves alone**, in the consequence rather
      than the verb. A tenant this affects should be identified in the dialog, not just counted.'
    provenance: contract subscription.yaml POST /tenants/{tenantId}/terminate
  states:
    loading: The tenant list.
    error: Could not load. Names which read failed and leaves the tenant untouched.
    emptyFirstRun: No tenant yet. Carries the create action; distinct from a filter that matched nothing.
    emptyNoResults: The filter narrowed it and the tenant are still there. Names the active filter and
      offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
  apis:
  - operationId: getSsoConfig
    contract: identity
    purpose: Read SSO configuration
    trigger: onLoad
  - operationId: listTenants
    contract: subscription
    purpose: List tenants
    trigger: onLoad
  - operationId: setSsoConfig
    contract: identity
    purpose: Configure an identity provider
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: addLicenceAddOn
    contract: subscription
    purpose: License a module outside the plan
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: createTenant
    contract: subscription
    purpose: Create a tenant
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: generateInvoice
    contract: subscription
    purpose: Generate an invoice for a period
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: getEntitlementUsage
    contract: subscription
    purpose: Usage against licensed limits
    trigger: onLoad
  - operationId: getSubscription
    contract: subscription
    purpose: Read the current subscription
    trigger: onLoad
  - operationId: getTenant
    contract: subscription
    purpose: Read a tenant with cells and subscription
    trigger: onLoad
  - operationId: getTenantLicences
    contract: subscription
    purpose: What a tenant is licensed to use
    trigger: onLoad
  - operationId: getUsageMetering
    contract: subscription
    purpose: Metered usage for a period
    trigger: onLoad
  - operationId: listSubscriptionInvoices
    contract: subscription
    purpose: List subscription invoices
    trigger: onLoad
  - operationId: listTenantCells
    contract: subscription
    purpose: List a tenant's cells
    trigger: onLoad
  - operationId: previewSubscriptionChange
    contract: subscription
    purpose: Preview the effect of a plan change
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: provisionCell
    contract: subscription
    purpose: Provision a cell for a region
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: reactivateTenant
    contract: subscription
    purpose: Lift a suspension
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: removeLicenceAddOn
    contract: subscription
    purpose: Remove an add-on
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: setSubscription
    contract: subscription
    purpose: Assign or change a subscription
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: suspendTenant
    contract: subscription
    purpose: Suspend a tenant
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: terminateTenant
    contract: subscription
    purpose: Begin termination
    trigger: onAction
    invalidates:
    - listTenants
  - operationId: updateTenant
    contract: subscription
    purpose: Amend tenant details
    trigger: onAction
    invalidates:
    - listTenants
  entryState:
    params:
    - name: tenantId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - SsoProviderConfig.id
    - SsoProviderConfig.displayName
    - SsoProviderConfig.protocol
    - SsoProviderConfig.metadataUrl
    - SsoProviderConfig.issuer
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-001
    note: '**Drawn by Claude Design on `Marketing Board 7.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: Rebuilt 9 September 2026 from the 21 operations this screen declares, not from a workshop
    pack — it has none. Columns are every field the response schema declares, plumbing aside — narrowing
    them to the ones that matter is work a person still owes this screen.
- id: CMS-002
  name: Brand Kit
  module: White Label
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/brand-kit
    component: apps/venue-management-web/src/routes/white-label/BrandKitDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - CMS-001
    - CMS-003
    - CMS-004
    - CMS-005
    inferred: true
    fromFlows: true
    transitions:
    - to: CMS-005
      trigger: Sets the colour theme
      provenance: flow F22 step 1→2
    - to: CMS-001
      trigger: Tenant Workspace
      carries:
      - tenantId
      provenance: derived — CMS-001 declares entryState.params tenantId, so an edge into it must carry
        them
    - to: CMS-003
      trigger: Typography
      carries:
      - bannerId
      - pageId
      - policyKind
      - version
      provenance: derived — CMS-003 declares entryState.params bannerId, pageId, policyKind, version,
        so an edge into it must carry them
    - to: CMS-004
      trigger: Logo & Assets
      carries:
      - assetId
      provenance: derived — CMS-004 declares entryState.params assetId, so an edge into it must carry
        them
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations still
    to be written. States derived from the screen pattern on 17 August, not individually considered —
    sound for a list, a form or a money screen, and worth revisiting where this screen is unusual.
  density: compact
  pattern: statusTracker
  patternReason: '`getBrandIdentity` reads one record and nothing reads a population — the screen is about
    that one thing'
  purpose: Set the things every surface reads.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The selected brand kit
        bindsTo: BrandIdentity
        columns:
        - BrandIdentity.logoAssetRef
        - BrandIdentity.logoDarkAssetRef
        - BrandIdentity.faviconAssetRef
        - BrandIdentity.splashImageAssetRefs
        - BrandIdentity.splashDurationSeconds
        - BrandIdentity.splashBackgroundColour
        - BrandIdentity.showLoadingIndicator
        - BrandIdentity.splashChangeScope
        operation: getBrandIdentity
        provenance: contract white-label.yaml GET /tenant-config/brand
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save changes
        operation: setBrandIdentity
        provenance: contract white-label.yaml PUT /tenant-config/brand
      - kind: secondaryButton
        label: Create
        operation: createUpload
        provenance: contract assets.yaml POST /media/uploads
      - kind: secondaryButton
        label: Complete
        operation: completeUpload
        provenance: contract assets.yaml POST /media/uploads/{uploadId}/complete
    - name: contentBody
      slot: carried
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
        provenance: carried from the previous definition
      - kind: primaryButton
        derived: true
        impliedBy: setBrandIdentity
        label: Save brand identity
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: setBrandIdentity
        provenance: carried from the previous definition
  states:
    loading: The brand kit list.
    error: Could not load. Names which read failed and leaves the brand kit untouched.
    emptyFirstRun: No brand kit yet. Carries the create action; distinct from a filter that matched nothing.
    emptyNoResults: The filter narrowed it and the brand kit are still there. Names the active filter
      and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
  apis:
  - operationId: getBrandIdentity
    contract: white-label
    purpose: Read brand identity
    trigger: onLoad
  - operationId: setBrandIdentity
    contract: white-label
    purpose: Set logo, favicon and splash
    trigger: onAction
  - operationId: createUpload
    contract: assets
    purpose: Request a signed upload URL
    trigger: onAction
  - operationId: completeUpload
    contract: assets
    purpose: Confirm an upload and create the asset
    trigger: onAction
  entryState:
    params:
    - name: uploadId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `uploadId`.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-002
  apisNote: Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
