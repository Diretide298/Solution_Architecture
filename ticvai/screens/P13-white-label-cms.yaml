      - description
      - venueId
      - parentCollectionId
    provenance: contract assets.yaml POST /media/collections
  - id: formCreateUpload
    component: modal
    trigger: Create upload
    body: '**Collects what `createUpload` sends before it is called.** Required: `filename`, `contentType`,
      `sizeBytes`. Optional: `venueId`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Create upload
      operation: createUpload
    dismiss:
      label: Cancel
      discards:
