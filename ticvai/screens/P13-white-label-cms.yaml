    confirm:
      label: Replace media asset
      operation: replaceMediaAsset
    dismiss:
      label: Cancel
      discards:
      - uploadId
      - note
    provenance: contract assets.yaml POST /media/{mediaId}/replace
  - id: formUpdateMediaAsset
    component: modal
    trigger: Save media asset
    body: '**Collects what `updateMediaAsset` sends before it is called.** Nothing in the body is required.
      Optional: `title`, `description`, `altText`, `tags`, `collectionIds`, `rights`, `status`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save media asset
      operation: updateMediaAsset
    dismiss:
      label: Cancel
      discards:
      - title
      - description
      - altText
      - tags
      - collectionIds
      - rights
      - status
    provenance: contract assets.yaml PATCH /media/{mediaId}
  states:
    loading: The media list.
    error: Could not load. Names which read failed and leaves the media untouched.
    emptyFirstRun: No media yet. Offers Create collection (`createCollection`); distinct from a filter
      that matched nothing.
    emptyNoResults: Nothing matches the filter on kind, tag, collectionId, venueId, search, unusedOnly
      and the media are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ASSET_LIBRARY_VIEW`, which `searchMedia` requires, and
      names that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
  apis:
