      precondition: the tenant has published at least once
      provenance: authored 29 September, M24-08
      back: true
  notes: '**Added 29 September for W12 and M24-05: the CMS is a flow builder with a step-based shell.**
    The configuration side panel of the rev 3 prototype is a reference tool only (W12). The builder is
    the white-labelling builder M24-05 asks for, not a new set of editors: every step opens a screen that
    already exists and holds its details.'
  density: compact
  pattern: multiStepForm
  patternReason: '`getSiteSetupProgress` holds the seven steps and their state, and `setSiteSetupProgress`
    saves each one — progress, fields per step, review, submit'
  purpose: 'Build a working site in about 30 minutes: pick a preset, then walk seven saved steps (venue
    and modules, ticketing flows, compose steps, Help me choose, look and feel, mobile app, preview and
    publish), each opening the full screen for its details. **The preset keeps the minimum path short
    (M24-05)**: it proposes the modules, the booking flows with their default step order, the home sections
    and the mobile tabs, so the only things an operator must supply are a logo, four colours and a Publish;
    everything else keeps the preset or the contract default and can be refined later.'
  layout:
    template: wizard
    regions:
    - name: progress
      slot: progress
      components:
      - kind: progressIndicator
        label: Seven steps
        bindsTo: SiteSetupProgress
        columns:
        - SiteSetupProgress.currentStep
        - SiteSetupProgress.steps
        - SiteSetupProgress.minimumPathDone
        operation: getSiteSetupProgress
        notes: 1 Venue and modules · 2 Ticketing flows · 3 Compose steps · 4 Help me choose · 5 Look and
          feel · 6 Mobile app · 7 Preview and publish. Each step shows not started, in progress, done
          or skipped; steps 4 and 6 may be skipped. **Minimum path** (logo, colours, one valid flow, a
          publish) is marked, so an operator in a hurry sees what is left before the site works.
        provenance: contract white-label.yaml GET /tenant-config/site-setup
    - name: fields
      slot: fields
      components:
      - kind: selectField
        label: Start from
        bindsTo: SiteSetupProgress.presetKey
        operation: setSiteSetupProgress
        notes: 'Theme park, water park, museum, theatre and arena, single attraction, play centre, several
          venues. **Proposes, never writes**: each step opens pre-filled from the preset, and nothing
          changes until the operator saves that step.'
        provenance: contract white-label.yaml PUT /tenant-config/site-setup
      - kind: cardList
        label: Flow types the preset proposes
        bindsTo: BookingFlowType
        columns:
        - BookingFlowType.key
        - BookingFlowType.name
        - BookingFlowType.productKinds
        operation: listBookingFlowTypes
        notes: 'Step 2 in one tap: the preset''s flow types, ticked; **Add these flows** creates each
          with the type''s default steps and order (`createBookingFlowDefinition`). Composing the order
          is step 3, on CMS-103.'
        provenance: contract white-label.yaml GET /booking-flow-types
      - kind: dataTable
        label: Flows this venue has
        bindsTo: BookingFlow
        columns:
        - BookingFlow.name
        - BookingFlow.flowTypeKey
        - BookingFlow.isDefaultForType
        - BookingFlow.isValid
        operation: listBookingFlows
        notes: Steps 2 and 3 are done when every flow here is valid and each bookable product kind has
          one.
        provenance: contract white-label.yaml GET /venues/{venueId}/booking-flows
    - name: review
      slot: review
      components:
      - kind: detailPanel
        label: What is live
        bindsTo: TenantAppStatus
        columns:
        - TenantAppStatus.isPublished
        - TenantAppStatus.publishedVersion
        - TenantAppStatus.hasUnpublishedChanges
        operation: getTenantAppStatus
        provenance: contract white-label.yaml GET /tenant-config/status
      - kind: banner
        label: What still blocks a publish
        bindsTo: ConfigValidationReport
        columns:
        - ConfigValidationReport.passed
        - ConfigValidationReport.findings
        operation: validateTenantConfig
        notes: Each finding links to the step and screen that fixes it (a missing logo to CMS-004, an
          invalid flow to CMS-103).
        provenance: contract white-label.yaml POST /tenant-config/validate
    - name: actionBar
      slot: submit
      components:
      - kind: primaryButton
        label: Save and continue
        operation: setSiteSetupProgress
        provenance: contract white-label.yaml PUT /tenant-config/site-setup
      - kind: secondaryButton
        label: Add these flows
        operation: createBookingFlowDefinition
        provenance: contract white-label.yaml POST /venues/{venueId}/booking-flows
      - kind: secondaryButton
        label: Check what blocks a publish
        operation: validateTenantConfig
        provenance: contract white-label.yaml POST /tenant-config/validate
  states:
    loading: The builder's progress, read by `getSiteSetupProgress`.
    error: Could not load. Names which read failed and leaves the progress untouched.
    emptyFirstRun: '**Nothing set up yet.** Opens on Start from, with every step not started, and says
      the minimum path is a logo, four colours, the preset''s flows and a publish.'
    emptyNoResults: The venue has no flow of a type the preset proposes yet; the flow list says so and
      offers Add these flows rather than showing an empty table.
    emptyNoAccess: Shown when the caller lacks `TENANT_CONFIGURE`, which `getSiteSetupProgress` requires,
      and names that permission. **Never an empty form** — that reads as *there is nothing to set up*.
  apis:
  - operationId: getSiteSetupProgress
    contract: white-label
    purpose: Where the operator is in the seven steps, and the preset picked
    trigger: onLoad
  - operationId: setSiteSetupProgress
    contract: white-label
    purpose: Save the preset and each step's state on every return
    trigger: onAction
    invalidates:
    - getSiteSetupProgress
  - operationId: listBookingFlowTypes
    contract: white-label
    purpose: The flow types the preset proposes for step 2
    trigger: onLoad
  - operationId: listBookingFlows
    contract: white-label
    purpose: The venue's flows, to mark steps 2 and 3 done
    trigger: onLoad
  - operationId: createBookingFlowDefinition
    contract: white-label
    purpose: Add the preset's flows with their default steps in one go
    trigger: onAction
    invalidates:
    - listBookingFlows
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: Whether the site is live, for step 7
    trigger: onLoad
  - operationId: validateTenantConfig
    contract: white-label
    purpose: What still blocks a publish, each finding linked to its step
    trigger: onAction
  entryState:
    params:
    - name: venueId
      from: session
    coldEntry: Resolves the tenant and venue from the session and opens on the current step, or on Start
      from when nothing is saved.
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-102
  apisNote: Authored 29 September 2026 (W12 and M24-05) from impact.md section b.
  overlays:
  - id: formAddPresetFlows
    component: modal
    trigger: Add these flows
    body: '**Collects what `createBookingFlowDefinition` sends, once per ticked type.** Required: `flowTypeKey`,
      `name` (pre-filled from the type). `isDefaultForType` on. Steps are left out, so each flow gets
      the type''s default steps and order. Dismissing sends nothing.'
    bindsTo: BookingFlow
    confirm:
      label: Add flows
      operation: createBookingFlowDefinition
    dismiss:
      label: Cancel
      discards:
      - flowTypeKey
      - name
    provenance: contract white-label.yaml POST /venues/{venueId}/booking-flows
- id: CMS-103
  name: Booking Flows
  module: White Label
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/booking-flows
    component: apps/venue-management-web/src/routes/white-label/BookingFlows.tsx
    status: notStarted
  navigation:
    entryFrom:
    - CMS-102
    - CMS-016
    - CMS-014
    exitTo:
    - CMS-102
    - CMS-016
    - CMS-101
    - CMS-014
    inferred: false
    notes: '**Steps 2 and 3 of the Site Builder (decided 29 September, W12).** Also reached from Site
      Settings, which now holds only the venue-wide settings, and from Publishing when a flow blocks the
      publish.'
    transitions:
    - to: CMS-102
      trigger: Back to the Site Builder
      provenance: authored 29 September, W12
      back: true
    - to: CMS-016
      trigger: Venue-wide booking settings
      provenance: authored 29 September, W12 (the settings every flow shares stay on CMS-016)
    - to: CMS-101
      trigger: Help me choose
      provenance: authored 29 September, W4 (an answer can point at a flow)
    - to: CMS-014
      trigger: Publish with the site
      provenance: authored 29 September, W12 (flows publish through publishTenantConfig)
  notes: '**Added 29 September for W12: operators pick their ticketing flows, see which steps are required,
    optional or conditional, and set their own order.** The catalogue (`listBookingFlowTypes`) is the
    same for every tenant: dated day pass, timed entry, open-dated, seated (fixed performance, or date
    and time then seat map), experience or workshop (product first, W8), surf or session (time then level),
    meeting room by the hour, cabana on a map or by size (W6), guided tour by language, transport, table
    reservation, membership, gift card and several locations. Flows reach guests with the rest of the
    site (`publishTenantConfig`); WEB-005..012, GST-007..009 and GST-041 order their steps from the published
    flow.'
  density: compact
  pattern: listDetail
  patternReason: '`listBookingFlows` reads the venue''s flows and `getBookingFlow` reads one of them to
    compose — list, select, act'
  purpose: Pick the venue's booking flows, turn optional steps on or off, set the step order within the
    allowed limits with a live preview, assign flows to products and categories, and validate them before
    they publish with the site.
  layout:
    template: split
    regions:
    - name: filters
      slot: filters
      components:
      - kind: selectField
        label: Venue
        operation: listBookingFlows
        notes: The venue whose flows are shown (path `venueId`); defaults to the session venue.
        provenance: contract white-label.yaml GET /venues/{venueId}/booking-flows
      - kind: selectField
        label: Flow type
        operation: listBookingFlows
        notes: Sends `?flowTypeKey=`.
        provenance: contract white-label.yaml GET /venues/{venueId}/booking-flows
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: The venue's flows
        bindsTo: BookingFlow
        columns:
        - BookingFlow.name
        - BookingFlow.flowTypeKey
        - BookingFlow.isDefaultForType
        - BookingFlow.isEnabled
        - BookingFlow.isValid
        - BookingFlow.updatedAt
        operation: listBookingFlows
        notes: An invalid flow is marked and blocks the site's publish until it is fixed.
        provenance: contract white-label.yaml GET /venues/{venueId}/booking-flows
      - kind: cardList
        label: Flow types to pick from
        bindsTo: BookingFlowType
        columns:
        - BookingFlowType.key
        - BookingFlowType.name
        - BookingFlowType.description
        - BookingFlowType.productKinds
        - BookingFlowType.steps
        operation: listBookingFlowTypes
        notes: Each card lists the type's steps with their required, optional or conditional mark, so
          the choice is made knowing what the guest will go through.
        provenance: contract white-label.yaml GET /booking-flow-types
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Compose the steps
        bindsTo: BookingFlow
        columns:
        - BookingFlow.name
        - BookingFlow.flowTypeKey
        - BookingFlow.isDefaultForType
        - BookingFlow.isEnabled
        - BookingFlow.steps
        - BookingFlow.isValid
        operation: getBookingFlow
        notes: '**The step list, in the venue''s order.** Each step carries its mark: *Required* (locked
          on), *Optional* (a switch) or *Conditional* (a switch, with the condition in words, e.g. "only
          when the tenant has more than one venue"). Steps are dragged to reorder; **a drop that breaks
          a constraint is refused before it lands** (`validateBookingFlow` with the proposed `steps`),
          and the constraint is named ("payment is always last", "the seat map comes after date and time").
          Each step opens its settings: the step''s own (`BookingFlowStep.settings`, e.g. the tour languages
          or the room''s hours) and, read-only with a link to CMS-016, the venue-wide settings it uses.'
        provenance: contract white-label.yaml GET /booking-flows/{bookingFlowId}
      - kind: detailPanel
        label: This flow's settings
        bindsTo: BookingFlowLevelSettings
        columns:
        - BookingFlowLevelSettings.performanceReveal
        - BookingFlowLevelSettings.signInAt
        - BookingFlowLevelSettings.seatEventDateMode
        - BookingFlowLevelSettings.extrasStep
        - BookingFlowLevelSettings.quickTour
        - BookingFlowLevelSettings.consentQuestionIds
        operation: getBookingFlow
        notes: '**Moved here from Site Settings on 29 September (W12)**, because they belong to one flow:
          date, time then tickets or all at once (REV3-2); sign in after add-ons or at payment (REV3-3);
          a seated event''s date inline or over the seat map (REV3-4, seated flows only); the extras step
          auto, always or never; the quick tour (REV3-20); the flow''s consent questions (REV3-26).'
        provenance: contract white-label.yaml GET /booking-flows/{bookingFlowId}
      - kind: multiSelect
        label: Consent questions this flow asks
        bindsTo: BookingFlowLevelSettings.consentQuestionIds
        operation: listConsentQuestions
        notes: '**The questions every booking in this flow asks, whatever the product** (rev 3 REV3-26),
          e.g. a water park''s "Are you able to swim?". Options are the active questions from `listConsentQuestions`,
          written on CMS-018. A Help me choose answer may pre-fill one; the guest still confirms it (W4).'
        provenance: contract marketing-crm.yaml GET /consent-questions
      - kind: livePreview
        label: Preview
        notes: '**The flow as a guest meets it, step by step, on web and on mobile**, redrawn on every
          change and drawn from the record in hand. Calls nothing and publishes nothing; guests keep the
          published flow (`getPublishedBookingFlow`, shown beside it for comparison) until the site is
          published.'
        provenance: authored 29 September, W12
      - kind: dataTable
        label: Products and categories using this flow
        bindsTo: Product
        columns:
        - Product.name
        - Product.kind
        - Product.categoryId
        - Product.bookingFlowId
        operation: listProducts
        notes: Assign the flow to a product (`updateProduct` `bookingFlowId`) or a category (`setProductCategories`,
          the category's `bookingFlowId`). A product naming no flow uses its category's, then the venue's
          default for its kind. Set up also on BO-007/BO-008 and BO-115.
        provenance: contract catalogue.yaml GET /products
      - kind: banner
        label: Why this flow cannot publish
        bindsTo: BookingFlowValidation
        columns:
        - BookingFlowValidation.valid
        - BookingFlowValidation.problems
        operation: validateBookingFlow
        notes: A required step turned off, a step out of its allowed order, a condition that can never
          hold, each naming the step and the fix.
        provenance: contract white-label.yaml POST /booking-flows/{bookingFlowId}/validate
      - kind: publishGate
        label: What publishing changes
        impliedBy: publishTenantConfig
        notes: '**Flows publish with the whole site**, never alone: the gate names every venue flow that
          changed since the last version and the products whose steps will change for guests, and says
          the rest of the draft (theme, pages, navigation) goes live with it. Refused while any enabled
          flow is invalid (`409`, `bookingFlowInvalid`). Needs `TENANT_PUBLISH`.'
        provenance: contract white-label.yaml POST /tenant-config/publish
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add a flow
        operation: createBookingFlowDefinition
        provenance: contract white-label.yaml POST /venues/{venueId}/booking-flows
      - kind: secondaryButton
        label: Save flow
        operation: updateBookingFlowDefinition
        provenance: contract white-label.yaml PATCH /booking-flows/{bookingFlowId}
      - kind: secondaryButton
        label: Validate
        operation: validateBookingFlow
        provenance: contract white-label.yaml POST /booking-flows/{bookingFlowId}/validate
      - kind: secondaryButton
        label: Assign to product
        operation: updateProduct
        provenance: contract catalogue.yaml PATCH /products/{productId}
      - kind: secondaryButton
        label: Assign to category
        operation: setProductCategories
        provenance: contract catalogue.yaml PUT /product-categories
      - kind: secondaryButton
        label: Publish site
        operation: publishTenantConfig
        permission: TENANT_PUBLISH
        provenance: contract white-label.yaml POST /tenant-config/publish
      - kind: destructiveButton
        label: Remove flow
        operation: deleteBookingFlow
        notes: Refused `409` while a product or category names the flow or it is the default for products
          on sale; the refusal names them and offers to reassign.
        provenance: contract white-label.yaml DELETE /booking-flows/{bookingFlowId}
  states:
    loading: The venue's flows and the flow-type catalogue, read by `listBookingFlows` and `listBookingFlowTypes`.
    error: Could not load. Names which read failed and leaves the flows untouched.
    emptyFirstRun: '**No flows at this venue yet.** Guests book through each type''s default order until
      one is picked. Offers the flow-type cards and, from the Site Builder, the preset''s flows in one
      step.'
    emptyNoResults: The flow-type filter matched nothing and the venue's other flows are still there.
      Names the filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `TENANT_CONFIGURE`, which `listBookingFlows` requires,
      and names that permission. **Never an empty table** — that reads as *there are no flows*.
  apis:
  - operationId: listBookingFlows
    contract: white-label
    purpose: The venue's flows in the draft
    trigger: onLoad
  - operationId: listBookingFlowTypes
    contract: white-label
    purpose: The flow types to pick from, with their steps and order constraints
    trigger: onLoad
  - operationId: getBookingFlow
    contract: white-label
    purpose: One flow with every step, to compose
    trigger: onAction
  - operationId: getPublishedBookingFlow
    contract: white-label
    purpose: What guests book through now, beside the draft in the preview
    trigger: onAction
  - operationId: createBookingFlowDefinition
    contract: white-label
    purpose: Pick a flow type for the venue
    trigger: onAction
    invalidates:
    - listBookingFlows
  - operationId: updateBookingFlowDefinition
    contract: white-label
    purpose: Save the step order, the optional steps and the flow's settings
    trigger: onAction
    invalidates:
    - listBookingFlows
    - getBookingFlow
  - operationId: validateBookingFlow
    contract: white-label
    purpose: Check a proposed order before it is dropped, or the saved flow
    trigger: onAction
  - operationId: deleteBookingFlow
    contract: white-label
    purpose: Remove a flow nothing uses
    trigger: onAction
    invalidates:
    - listBookingFlows
  - operationId: publishTenantConfig
    contract: white-label
    purpose: Publish the site, flows included
    trigger: onAction
  - operationId: listConsentQuestions
    contract: marketing-crm
    purpose: The consent questions a flow can ask (rev 3 REV3-26)
    trigger: onLoad
  - operationId: listProducts
    contract: catalogue
    purpose: The products a flow is assigned to
    trigger: onAction
  - operationId: updateProduct
    contract: catalogue
    purpose: Assign the flow to a product (`bookingFlowId`)
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: listProductCategories
    contract: catalogue
    purpose: The categories a flow can be assigned to
    trigger: onAction
  - operationId: setProductCategories
    contract: catalogue
    purpose: Assign the flow to a category (`bookingFlowId`)
    trigger: onAction
    invalidates:
    - listProductCategories
  entryState:
    params:
    - name: venueId
      from: session
    - name: bookingFlowId
      from: CMS-102
      optional: true
    - name: productId
      from: navigation
    coldEntry: Resolves the venue from the session and opens on the flow list, or on the flow named in
      the link.
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-103
  apisNote: Authored 29 September 2026 (W12, W6, W8) from impact.md section b.
  overlays:
  - id: formCreateBookingFlowDefinition
    component: modal
    trigger: Add a flow
    body: '**Collects what `createBookingFlowDefinition` sends.** Required: `flowTypeKey` (from the cards),
      `name`. Optional: `isDefaultForType`, `steps` (left out, the type''s defaults), `settings`. Dismissing
      sends nothing.'
    bindsTo: BookingFlow
    confirm:
      label: Add flow
      operation: createBookingFlowDefinition
    dismiss:
      label: Cancel
      discards:
      - flowTypeKey
      - name
      - isDefaultForType
      - steps
      - settings
    provenance: contract white-label.yaml POST /venues/{venueId}/booking-flows
  - id: confirmDeleteBookingFlow
    component: confirmDialog
    trigger: Remove flow
    body: Names the flow and says guests keep it until the next publish. Refused `409` while products
      or categories name it, and names them.
    confirm:
      label: Remove
      operation: deleteBookingFlow
    dismiss:
      label: Keep it
    provenance: contract white-label.yaml DELETE /booking-flows/{bookingFlowId}
  - id: confirmPublishSite
    component: confirmDialog
    trigger: Publish site
    body: '**Names what goes live**: the changed flows and the products whose booking steps change, with
      the rest of the draft. Asks for the publish note `publishTenantConfig` requires.'
    confirm:
      label: Publish
      operation: publishTenantConfig
    dismiss:
      label: Cancel
    provenance: contract white-label.yaml POST /tenant-config/publish
- id: CMS-104
  name: App Build & Store Publishing
  module: White Label
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/app-publishing
    component: apps/venue-management-web/src/routes/white-label/AppPublishing.tsx
    status: notStarted
  navigation:
    entryFrom:
    - CMS-102
    - CMS-014
    exitTo:
    - CMS-102
    - CMS-004
    - CMS-014
    inferred: false
    notes: Reached from the Site Builder after the first publish, and from Publishing when a change is
      build-time.
    transitions:
    - to: CMS-102
      trigger: Back to the Site Builder
      provenance: authored 29 September, M24-08
      back: true
    - to: CMS-004
      trigger: App icons and splash
      provenance: authored 29 September, M24-08 (build-time assets)
    - to: CMS-014
      trigger: Publish the configuration first
      provenance: authored 29 September, M24-08 (a build is made from a published version)
  notes: '**Added 29 September for M24-08.** TICVAI never publishes a client''s app under its own developer
    account: each client opens and owns its Apple Developer account (with a D-U-N-S number) and its Google
    Play account, builds its app here from the published configuration, and uploads it, or lets us submit
    it with its own API credential. The accounts are make-or-break client inputs (`setStoreAccounts`).'
  density: compact
  pattern: listDetail
  patternReason: '`listAppBuilds` reads the builds and `getAppBuild` reads one — list, select, act; the
    checklist sits above the list'
  purpose: Get the tenant's own app into the App Store and Google Play under the client's own accounts
    — checklist, store listing, request a build, download or submit it, follow its review — with a guide
    for the steps only the client can take.
  layout:
    template: split
    regions:
    - name: filters
      slot: filters
      components:
      - kind: detailPanel
        label: Before the first build
        bindsTo: StorePublishingChecklist
        columns:
        - StorePublishingChecklist.items
        - StorePublishingChecklist.accounts
        operation: getStoreAccounts
        notes: Apple D-U-N-S number, Apple Developer account, Google Play developer account (**the client's
          to open; we cannot open them for them**), store listing, app icons, a published configuration.
          Each open item says what to do next.
        provenance: contract white-label.yaml GET /tenant-config/store-accounts
      - kind: selectField
        label: Platform
        operation: listAppBuilds
        notes: Sends `?platform=`, iOS or Android.
        provenance: contract white-label.yaml GET /tenant-config/app-builds
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Builds
        bindsTo: AppBuild
        columns:
        - AppBuild.platform
        - AppBuild.versionName
        - AppBuild.buildNumber
        - AppBuild.configVersion
        - AppBuild.status
        - AppBuild.requestedAt
        - AppBuild.finishedAt
        operation: listAppBuilds
        provenance: contract white-label.yaml GET /tenant-config/app-builds
      - kind: toggle
        label: Show "Powered by TICVAI"
        bindsTo: BrandIdentity.showPoweredBy
        operation: setBrandIdentity
        notes: "**A configuration toggle, on by default** (decided by Chinmay, 2 October 2026; DEC-160;
          CHG-CSA-036). The credit shows on the launch screen under the splash and at the foot of Account
          (DI-250, DI-297); switching it off is refused 403 `powered-by-locked` unless the tenant's licence
          carries the powered-by removal add-on, and the toggle says so (CHG-SGU-011)."
        provenance: corrected 2 October 2026 (CHG-SGU-011, decided by Chinmay 2 October 2026, DEC-160)
      - kind: detailPanel
        label: Credit shown
        bindsTo: BrandIdentity
        columns:
        - BrandIdentity.showPoweredBy
        operation: getBrandIdentity
        notes: Whether the "Powered by TICVAI" credit shows now, and whether the licence lets it be switched
          off.
        provenance: corrected 2 October 2026 (CHG-SGU-011, decided by Chinmay 2 October 2026, DEC-160)
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected build
        bindsTo: AppBuild
        columns:
        - AppBuild.status
        - AppBuild.failureReason
        - AppBuild.packageAssetRef
        - AppBuild.releaseNotes
        - AppBuild.submitToStore
        operation: getAppBuild
        notes: Download the signed package to upload it in App Store Connect or the Play Console; with
          a credential recorded, the store review status follows here (submitted, in review, approved,
          rejected, released).
        provenance: contract white-label.yaml GET /tenant-config/app-builds/{appBuildId}
      - kind: assistantPanel
        label: App publishing guide
        operation: sendAiMessage
        notes: '**The in-platform guide M24-08 asks for**: how to get a D-U-N-S number, open each account,
          fill the listing and answer store review. Grounded on a store-publishing knowledge source, no
          tenant data. `unavailable` until the ai "app publishing guide" assistant profile exists; the
          checklist guidance works without it.'
        provenance: authored 29 September, M24-08
      - kind: publishGate
        label: What a build and a submission do
        impliedBy: requestAppBuild
        notes: Names the configuration version built, the build-time changes it carries (icons, splash,
          fonts, wallet and payment integrations) and the account it is signed for; with **Submit to the
          store**, says it goes to the client's store review under the client's account. Needs `TENANT_PUBLISH`.
        provenance: contract white-label.yaml POST /tenant-config/app-builds
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Request a build
        operation: requestAppBuild
        permission: TENANT_PUBLISH
        provenance: contract white-label.yaml POST /tenant-config/app-builds
      - kind: secondaryButton
        label: Save store accounts and listing
        operation: setStoreAccounts
        provenance: contract white-label.yaml PUT /tenant-config/store-accounts
  states:
    loading: The checklist and the builds, read by `getStoreAccounts` and `listAppBuilds`.
    error: Could not load. Names which read failed.
    emptyFirstRun: '**No build yet.** Shows the checklist first: nothing can be built until the client''s
      store account for the platform is recorded and a version is published.'
    emptyNoResults: No build for the platform picked. Names it and offers the other.
    emptyNoAccess: Shown when the caller lacks `TENANT_CONFIGURE`, which `listAppBuilds` requires, and
      names that permission.
  apis:
  - operationId: getStoreAccounts
    contract: white-label
    purpose: The client's store accounts and the checklist
    trigger: onLoad
  - operationId: setStoreAccounts
    contract: white-label
    purpose: Record the client's own Apple and Google accounts and the store listing
    trigger: onAction
    invalidates:
    - getStoreAccounts
  - operationId: listAppBuilds
    contract: white-label
    purpose: The builds and their store status
    trigger: onLoad
  - operationId: getAppBuild
    contract: white-label
    purpose: One build, its package and its review status
    trigger: onAction
  - operationId: requestAppBuild
    contract: white-label
    purpose: Build the app from a published version, for the client's account
    trigger: onAction
    invalidates:
    - listAppBuilds
  - operationId: createAiConversation
    contract: ai
    purpose: Open a conversation with the app publishing guide
    trigger: onAction
  - operationId: sendAiMessage
    contract: ai
    purpose: Ask the app publishing guide a question
    trigger: onAction
  - operationId: getBrandIdentity
    contract: white-label
    purpose: Whether "Powered by TICVAI" shows (BrandIdentity.showPoweredBy)
    trigger: onLoad
  - operationId: setBrandIdentity
    contract: white-label
    purpose: Switch "Powered by TICVAI" off where the licence allows (DEC-160)
    trigger: onAction
  entryState:
    params:
    - name: appBuildId
      from: navigation
      optional: true
    - name: conversationId
      from: navigation
    coldEntry: Resolves the tenant from the session and opens on the checklist and the newest build.
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-104
  apisNote: Authored 29 September 2026 (M24-08) from impact.json.
  overlays:
  - id: formSetStoreAccounts
    component: modal
    trigger: Save store accounts and listing
    body: '**Collects what `setStoreAccounts` sends**: per store, `accountHolderName`, `developerAccountId`,
      `appIdentifier`, `dunsNumber` (Apple, nine digits), optional `apiCredentialSecretRef` and the `listing`
      (name, subtitle, description and keywords in every tenant language, category, support and privacy
      links, screenshots). Refused `400` for an Apple account without a D-U-N-S number. Dismissing sends
      nothing.'
    bindsTo: StoreAccount
    confirm:
      label: Save
      operation: setStoreAccounts
    dismiss:
      label: Cancel
      discards:
      - accounts
    provenance: contract white-label.yaml PUT /tenant-config/store-accounts
  - id: confirmRequestAppBuild
    component: confirmDialog
    trigger: Request a build
    body: '**Names the platform, the version built and the account it is signed for.** Optional release
      notes and Submit to the store (needs a recorded credential). Refused `409` with the reason when
      the account is missing, nothing is published, or a build is already running.'
    confirm:
      label: Build
      operation: requestAppBuild
    dismiss:
      label: Cancel
    provenance: contract white-label.yaml POST /tenant-config/app-builds
