      provenance: flow F150 step 8→9
      operation: listCookieTrackingDigital
  density: compact
  purposeNote: Administrators maintain an auditable inventory of governed cookies and tracking technologies,
    their purposes and applicable consent requirements.
  pattern: listDetail
  patternReason: '**nothing in the pack chooses a pattern for this screen** — no metric directory, no
    display directory, no configuration directory. It falls to the default, and the fallback is recorded
    rather than passed off as a decision'
  purpose: Maintain a centralized registry of cookies, SDKs, pixels and other governed tracking technologies
    used by TICVAI digital channels. This should cover more than traditional browser cookies.
  gaps:
  - operation: null
    why: '**The pack names 3 actions on this screen and the screen declares 1 operation.** Unserved: Analytics
      Tracker, Embedded Service, Other tracking technology. Each needs an operation, or needs removing
      from the screen; this is the Phase 3 reconciliation seen from the screen side rather than the contract
      side.'
    source: pack Privacy__Consent___Preference_Management_Reference.pdf, page 10 §Support
  - operation: null
    why: '**The pack gives this screen nothing that can be drawn.** Its sections are prose — purpose,
      acceptance conditions, worked examples — with no directory of metrics, columns or fields anywhere
      in them. The screen has no content region rather than an empty one, and it needs a person before
      it is built.'
    source: pack Privacy__Consent___Preference_Management_Reference.pdf, page 10
  - operation: null
    why: '**The pack gives this screen no display, metric or configuration directory**, so its shape is
      a default rather than a reading. It needs a person before it is built.'
    source: pack Privacy__Consent___Preference_Management_Reference.pdf, page 10
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Technology type
        operation: listCookieTrackingDigital
        notes: A filter over the registry (first-party cookie, third-party cookie, mobile SDK, analytics
          tracker, advertising pixel, embedded service, local storage, other); not an action.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
        bindsTo: CookieTrackingDigitalTechnologyRegistryView.technologyType
      - kind: dataTable
        label: Tracking technologies
        bindsTo: CookieTrackingDigitalTechnologyRegistryView
        columns:
        - CookieTrackingDigitalTechnologyRegistryView.name
        - CookieTrackingDigitalTechnologyRegistryView.provider
        - CookieTrackingDigitalTechnologyRegistryView.technologyType
        - CookieTrackingDigitalTechnologyRegistryView.category
        - CookieTrackingDigitalTechnologyRegistryView.durationDays
        - CookieTrackingDigitalTechnologyRegistryView.status
        - CookieTrackingDigitalTechnologyRegistryView.source
        operation: listCookieTrackingDigital
        notes: Detected (blocked, needs review) first, then approved, blocked and retired; retired rather
          than deleted, as evidence of what a site did on a date.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: dataTable
        label: Scan runs
        bindsTo: CookieScanRun
        columns:
        - CookieScanRun.scannedAt
        - CookieScanRun.channel
        - CookieScanRun.source
        - CookieScanRun.findingsCount
        - CookieScanRun.newlyDetectedCount
        - CookieScanRun.missingCount
        operation: listCookieScans
        notes: "**A bought scanner API (hybrid) runs the scheduled scans** (decided by Chinmay, 2 October
          2026; DEC-019; CHG-CSA-023): it feeds `recordCookieScan` through TICVAI's adapter, and the manual
          \"Upload scan report\" path stays for a venue that scans elsewhere. The source column says Scanner
          or Upload per run. Our banner, runtime, registry and consent logs stay ours (CHG-SGU-013)."
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
      - kind: metricTile
        label: Loaded before consent
        operation: listCookieScans
        notes: "**The compliance output, shown first and prominently:** the scan run's `preConsentViolationCount`,
          the technologies seen loading before the visitor decided (CHG-FUP-009) (CHG-SGU-013)."
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
      - kind: dataTable
        label: What the scan saw
        operation: listCookieScanFindings
        notes: 'Per finding of the selected run: the consent state it was seen in (no decision, rejected
          all, accepted all), the page, the script that set it, its attributes (domain, SameSite, Secure)
          and the suggested category (CHG-FUP-009) (CHG-SGU-013).'
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
      - kind: cardList
        label: Known cookies catalogue
        operation: listTrackingTechnologyCatalogue
        notes: The platform-wide catalogue of known cookies and trackers, read-only for the venue; a finding
          that matches it comes with its category suggested (CHG-FUP-010) (CHG-SGU-013).
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
      - kind: detailPanel
        label: Scan schedule and source
        bindsTo: CookieScanPolicy
        columns:
        - CookieScanPolicy.channel
        - CookieScanPolicy.frequency
        - CookieScanPolicy.scanSource
        - CookieScanPolicy.scannerVendorRef
        - CookieScanPolicy.nextRunAt
        operation: listCookieScanPolicies
        notes: 'Per channel: daily, weekly, monthly or off, who is alerted on a new finding, and the source
          (bought scanner, the default, or manual upload) (CHG-SGU-013).'
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add technology
        operation: setTrackingTechnology
        notes: Add, classify or retire a technology; consent required can be off only for strictly necessary.
        provenance: corrected 2 October 2026 (CHG-SGU-017, design-notes correction)
      - kind: secondaryButton
        label: Upload scan report
        operation: recordCookieScan
        notes: The manual path for a venue that scans elsewhere (hybrid).
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
      - kind: secondaryButton
        label: Save scan schedule
        operation: setCookieScanPolicy
        provenance: corrected 2 October 2026 (CHG-SGU-013, decided by Chinmay 2 October 2026, DEC-019)
  states:
    loading: The cookie tracking digital list.
    error: Could not load. Names which read failed and leaves the cookie tracking digital untouched.
    emptyFirstRun: 'No technology registered and no scan yet: offers Add technology and Save scan schedule;
      the first scheduled scan fills the registry.'
    emptyNoResults: Nothing matches the technology type chosen; names it and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
  apis:
  - operationId: listCookieTrackingDigital
    contract: marketing-crm
