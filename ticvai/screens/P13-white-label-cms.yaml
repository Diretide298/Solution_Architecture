        operation: listConsentQuestions
        notes: '**A consent, not a data field** (decided 29 September, rev 3 REV3-26). Each question has
          its own text per locale, a version, and whether it is asked for each person or once per booking.
          Filter by `kind` and `status`. **Attaching** is done where the question is used: to a booking
          flow on CMS-016 (`BookingFlowConfig.consentQuestionIds`, per venue), to a product on BO-008
          (`Product.consentQuestionIds`).'
        provenance: contract marketing-crm.yaml GET /consent-questions
        permission: GUEST_VIEW
      - kind: dataTable
        label: Consent records
        bindsTo: BookingConsentRecord
        columns:
        - BookingConsentRecord.answeredAt
        - BookingConsentRecord.questionId
        - BookingConsentRecord.questionVersion
        - BookingConsentRecord.answer
        - BookingConsentRecord.scope
        - BookingConsentRecord.personName
        - BookingConsentRecord.orderId
        - BookingConsentRecord.answeredBySubjectId
        - BookingConsentRecord.answeredByPrincipalId
        - BookingConsentRecord.source
        - BookingConsentRecord.blocksBooking
        - BookingConsentRecord.supersededAt
        operation: listConsentAnswers
        notes: '**What was asked, at which version, what was answered, for whom, by whom and when** (rev
          3 REV3-26). Filter by order, guest or question. Read-only: an answer is never edited here, and
          a superseded answer stays listed with `supersededAt`.'
        provenance: contract marketing-crm.yaml GET /consent-answers
        permission: GUEST_VIEW
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected policy
        bindsTo: Policy
        columns:
        - Policy.kind
        - Policy.title
        - Policy.body
        - Policy.requiresReconsent
        - Policy.effectiveFrom
        - Policy.publishedByPrincipalId
        - Policy.publishedAt
        - Policy.scopePath
        operation: listPolicies
        provenance: contract white-label.yaml GET /tenant-config/policies
        permission: TENANT_CONFIGURE
      - kind: detailPanel
        label: The selected consent question
        bindsTo: ConsentQuestion
        columns:
        - ConsentQuestion.kind
        - ConsentQuestion.text
        - ConsentQuestion.helpText
        - ConsentQuestion.version
        - ConsentQuestion.scope
        - ConsentQuestion.required
        - ConsentQuestion.blockingAnswer
        - ConsentQuestion.status
        operation: listConsentQuestions
        provenance: contract marketing-crm.yaml GET /consent-questions
        permission: GUEST_VIEW
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save policy
        operation: setPolicy
        provenance: contract white-label.yaml PUT /tenant-config/policies/{policyKind}
        permission: TENANT_CONFIGURE
      - kind: secondaryButton
        label: Save consent purposes
        operation: setConsentPurposes
        provenance: contract marketing-crm.yaml PUT /consent-purposes
        permission: GUEST_MANAGE
      - kind: secondaryButton
        label: New consent question
        operation: createConsentQuestion
        provenance: contract marketing-crm.yaml POST /consent-questions
        permission: GUEST_MANAGE
      - kind: secondaryButton
        label: Save as new version
        operation: updateConsentQuestion
        notes: '**A change to what the guest is asked is a new version, never an edit** (rev 3 REV3-26):
          changing the text, scope, required or blocking answer raises `version` by one, and every answer
          already given keeps the version it was given against.'
        provenance: contract marketing-crm.yaml PATCH /consent-questions/{questionId}
        permission: GUEST_MANAGE
      - kind: destructiveButton
        label: Retire question
        operation: updateConsentQuestion
        notes: Sets `status` to `retired`. It stops being asked on every flow and product it is attached
          to and changes no version; the answers already given stay on record.
        provenance: contract marketing-crm.yaml PATCH /consent-questions/{questionId}
        permission: GUEST_MANAGE
  entryState:
    params:
    - name: policyKind
      from: navigation
    - name: questionId
      from: navigation
    preloaded:
    - Policy.kind
    - Policy.title
    - Policy.body
    - Policy.requiresReconsent
    - Policy.effectiveFrom
  overlays:
  - id: formSetPolicy
    component: modal
    trigger: Save policy
    body: '**Collects what `setPolicy` sends before it is called.** Required: `body`, `requiresReconsent`.
      Optional: `effectiveFrom`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save policy
      operation: setPolicy
    dismiss:
      label: Cancel
      discards:
      - body
      - requiresReconsent
      - effectiveFrom
    provenance: contract white-label.yaml PUT /tenant-config/policies/{policyKind}
  - id: formSetConsentPurposes
    component: modal
    trigger: Save consent purposes
    body: '**Collects what `setConsentPurposes` sends before it is called.** Required: `purposes`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save consent purposes
      operation: setConsentPurposes
    dismiss:
      label: Cancel
      discards:
      - purposes
    provenance: contract marketing-crm.yaml PUT /consent-purposes
  - id: formCreateConsentQuestion
    component: modal
    trigger: New consent question
    body: '**Collects what `createConsentQuestion` sends before it is called.** Required: `kind`, `text`
      (every tenant language). Optional: `helpText`, `scope` (`perPerson`, the default, or `perBooking`),
      `required` (default true: checkout waits for it) and `blockingAnswer` (`yes`, `no` or `none`, the
      default: the answer that stops the booking for the person or booking it covers). Created at version
      1 (rev 3 REV3-26). Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: ConsentQuestion
    confirm:
      label: Create question
      operation: createConsentQuestion
    dismiss:
      label: Cancel
      discards:
      - kind
      - text
      - helpText
      - scope
      - required
      - blockingAnswer
    provenance: contract marketing-crm.yaml POST /consent-questions
  - id: formUpdateConsentQuestion
    component: modal
    trigger: Save as new version
    body: '**Says, before saving, that the guest will be asked version N+1 from the next cart read** and
      that answers already given keep their version (rev 3 REV3-26). Optional: `text`, `helpText`, `scope`,
      `required`, `blockingAnswer`, `status`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: ConsentQuestion
    confirm:
      label: Save new version
      operation: updateConsentQuestion
    dismiss:
      label: Cancel
      discards:
      - text
      - helpText
      - scope
      - required
      - blockingAnswer
      - status
    provenance: contract marketing-crm.yaml PATCH /consent-questions/{questionId}
