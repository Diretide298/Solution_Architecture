platform:
  code: P13
  audience: staff
  formFactor: web
  shortName: Venue CMS
  name: Venue CMS — White Label
  surface: staffFacing
  runtime: reactWeb
  app: venue-management-web
  appStatus: scaffolded
  offlineCapable: false
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell
    storeReview: false
    deviceOwnership: tenant workstation
    networkAssumption: public internet
    releaseCadence: weekly
  screenCount: 103
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: The CMS **is** the White Label Builder. These six boards are the design, not a reference for
      one.
  reachesOtherPlatforms:
  - screen: ADM-016
    platform: P09
    board: P09 TICVAI Web.dc.html#adm-016
    note: White-label branding is administered from the platform console
  - screen: ADM-017
    platform: P09
    board: P09 TICVAI Web.dc.html#adm-017
    note: Domain and certificate management sits with the platform, not the tenant
  operator: venue
  directions:
  - ltr
  - rtl
  wireframeBoard: wireframes/P13 Venue CMS.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-management
    name: TICVAI Venue Management
    shell: web
    siblings:
    - P08
    - P12
    - P16
    note: '**Already one app in all but name** — P08, P13 and P16 declared the same `app` before this
      decision. One tenant-level surface that filters across venues, with analytics, CMS and the support
      desk as sections of it.'
    decided: 10 September 2026
screens:
- id: CMS-001
  name: Tenant Workspace
  module: White Label
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/tenant-workspace
    component: apps/venue-management-web/src/routes/white-label/TenantWorkspaceDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - CMS-002
    - CMS-003
    - CMS-004
    - CMS-008
    - CMS-009
    - CMS-010
    - CMS-011
    - CMS-016
    - CMS-015
    - CMS-019
    - CMS-021
    - CMS-031
    - CMS-041
    - CMS-051
    - CMS-061
    - CMS-071
    - CMS-081
    - CMS-091
    - CMS-102
    inferred: true
    isEntryPoint: true
    transitions:
    - to: CMS-102
      trigger: Site Builder
      provenance: authored 29 September, W12 and M24-05 (the step-based builder starts from the workspace)
    - to: CMS-002
      trigger: Brand Kit
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-004
      trigger: Logo & Assets
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-061
      trigger: Digital Asset Management Command Center
      provenance: structural — pack board 1 wiring, 11 September 2026
    - to: CMS-071
      trigger: AI Asset Intelligence Command Center
      provenance: structural — pack board 2 wiring, 11 September 2026
    - to: CMS-081
      trigger: DAM Governance & Rights Command Center
      provenance: structural — pack board 3 wiring, 11 September 2026
    - to: CMS-091
      trigger: Asset Distribution & Delivery Command Center
      provenance: structural — pack board 4 wiring, 11 September 2026
    - to: CMS-008
      trigger: Content Blocks
      provenance: 'derived — CMS-008 declares entryState.params actionId, bannerId, promoBlockId and CMS-001
        holds none of them. The edge carries nothing: CMS-008 finds bannerId (createBanner), promoBlockId
        (createPromoBlock) itself; CMS-008 opens on listPromoBlocks, and actionId has no source on CMS-008
        yet (a gap in CMS-008, not in this edge)'
    - to: CMS-009
      trigger: Navigation & Menus
      provenance: 'derived — CMS-009 declares entryState.params menuId and CMS-001 holds none of them.
        The edge carries nothing: menuId only pre-selects (deep link or optional), and CMS-009 opens on
        its own'
    - to: CMS-010
      trigger: Media Library
      provenance: 'derived — CMS-010 declares entryState.params mediaCode, mediaId, uploadId and CMS-001
        holds none of them. The edge carries nothing: mediaCode, mediaId, uploadId only pre-select (deep
        link or optional), and CMS-010 opens on its own'
    - to: CMS-011
      trigger: Translations
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-016
      trigger: Site Settings
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-019
      trigger: User Access
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-015
      trigger: Version History
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
      carries:
      - version
    - to: CMS-021
      trigger: Privacy & Consent Configuration Command Center
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-031
      trigger: Privacy Operations Command Center
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-041
      trigger: Waiver & Consent Command Center
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-051
      trigger: Waiver Operations Command Center
      provenance: structural — CMS-001 is P13's home screen and its exits are its launcher
    - to: CMS-003
      trigger: Typography
      provenance: flow F102 step 1→2
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. States derived from the screen pattern on 17 August, not individually considered
    — sound for a list, a form or a money screen, and worth revisiting where this screen is unusual. **The
    tenant workspace.** Lands a tenant on what is live rather than on a form. **Declared 20 August** —
    `isEntryPoint` existed in the schema and five platforms used none, so every screen in them read as
    unreachable. **Drawn 31 August** — `Marketing Board 7.dc.html` frame `crm-7f` (*Agent Workspace*),
    matched on title at 0.84 within this board’s platforms.


    **Rewired 23 September (L7).** The screen called the maintenance equipment register, guest CRM or
    subscription billing where its purpose names White Labelling. Its operations now match its purpose.'
  density: compact
  boardFrames:
  - Marketing Board 7.dc.html#crm-7f
  pattern: statusTracker
  patternReason: '`getTenantAppStatus` reads one record and nothing reads a population — the screen is
    about that one thing'
  purpose: Land a tenant somewhere that shows what is live and what is not, and hold step 1 of the Site
    Builder (venue and modules).
  purposeNote: '**Step 1 of CMS-102 Site Builder (decided 29 September, W12).** The modules and feature
    toggles here, including `guestCheckout` (which fields its pop-up asks is `guestContactFields` on CMS-016,
    W1) and the new `visitPlanner` module, which shows or hides the mobile Plan tab and WEB-050 (MOB-1).
    A Site Builder card leads new tenants into the seven steps.'
  states:
    loading: The tenant, read by `getTenantAppStatus`.
    error: Could not load. Names which read failed and leaves the tenant untouched.
    emptyFirstRun: 'Nothing published yet: the status shows "Never published" and the Site Builder card
      offers to start (CMS-102). A tenant always exists here.'
    emptyNoAccess: Shown when the caller lacks `TENANT_CONFIGURE`, which `getTenantConfig` requires, and
      names that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
  apis:
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: Whether the guest web and app are live
    trigger: onLoad
  - operationId: getModuleEnablement
    contract: white-label
    purpose: Which modules guests can see
    trigger: onLoad
  - operationId: getFeatureToggles
    contract: white-label
    purpose: Which features are switched on
    trigger: onLoad
  - operationId: setModuleEnablement
    contract: white-label
    purpose: Switch a module on or off for guests
    trigger: onAction
  - operationId: setFeatureToggles
    contract: white-label
    purpose: Switch a feature on or off
    trigger: onAction
  - operationId: setMaintenanceMode
    contract: white-label
    purpose: Put the guest web and app into maintenance, and set the rest of the live app status — minimum
      app version, contact details, availability (decided 28 September, audit R073)
    trigger: onAction
  - operationId: getSiteSetupProgress
    contract: white-label
    purpose: Where the tenant is in the Site Builder
    trigger: onLoad
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-001
    derivedFrom: wireframes/reference/Marketing Board 7.dc.html
    note: '**Drawn by Claude Design on `Marketing Board 7.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: Rebuilt 9 September 2026 from the 7 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: banner
        label: Status
        bindsTo: TenantAppStatus
        operation: getTenantAppStatus
        notes: 'Three badges in this order: Published (version and time, or "Never published"), Draft
          ("Unpublished changes"), Live now (maintenance, sold out today, closed, forced update). Counts:
          active of licensed modules, active pages.'
        provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
      - kind: cardList
        label: Site Builder
        bindsTo: SiteSetupProgress
        operation: getSiteSetupProgress
        notes: Shown while the minimum path is not done, with the next unfinished step; opens CMS-102.
        provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
      - kind: cardList
        label: White label
        notes: 'Tiles: Brand kit, Theme, Typography, Logo and assets, Homepage and pages, Navigation,
          Banners, Booking settings, Booking flows, Help me choose, Languages, Domain, Versions, Publish,
          App build.'
        provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
      - kind: cardList
        label: Other areas
        notes: The DAM, privacy and waiver command centres (CMS-021 to CMS-100) are other modules' areas,
          grouped apart so the white-label path stays short (the 30-minute site, DI-988).
        provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
      - kind: detailPanel
        label: The module enablement
        bindsTo: ModuleEnablement
        columns:
        - ModuleEnablement.moduleKey
        - ModuleEnablement.displayName
        - ModuleEnablement.isLicensed
        - ModuleEnablement.isEnabled
        - ModuleEnablement.referencedBy
        operation: getModuleEnablement
        provenance: contract white-label.yaml GET /tenant-config/modules
      - kind: detailPanel
        label: The feature toggle
        bindsTo: FeatureToggle
        columns:
        - FeatureToggle.featureKey
        - FeatureToggle.displayName
        - FeatureToggle.isEnabled
        - FeatureToggle.changeScope
        - FeatureToggle.requiresConfiguration
        operation: getFeatureToggles
        provenance: contract white-label.yaml GET /tenant-config/features
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save module enablement
        operation: setModuleEnablement
        provenance: contract white-label.yaml PUT /tenant-config/modules
      - kind: secondaryButton
        label: Save feature toggles
        operation: setFeatureToggles
        provenance: contract white-label.yaml PUT /tenant-config/features
      - kind: secondaryButton
        label: Live now
        operation: setMaintenanceMode
        provenance: contract white-label.yaml PUT /tenant-config/status
  overlays:
  - id: formSetModuleEnablement
    component: modal
    trigger: Save module enablement
    body: '**Collects what `setModuleEnablement` sends before it is called.** Required: `modules`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save module enablement
      operation: setModuleEnablement
    dismiss:
      label: Cancel
      discards:
      - modules
    provenance: contract white-label.yaml PUT /tenant-config/modules
  - id: formSetFeatureToggles
    component: modal
    trigger: Save feature toggles
    body: '**Collects what `setFeatureToggles` sends before it is called.** Required: `features`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save feature toggles
      operation: setFeatureToggles
    dismiss:
      label: Cancel
      discards:
      - features
    provenance: contract white-label.yaml PUT /tenant-config/features
  - id: formSetMaintenanceMode
    component: modal
    trigger: Live now
    body: '**Live now: four controls, each labelled by what it does**, applied at once and never published
      or restored: Maintenance (on, message, back at), Minimum app version (iOS, Android), Contact (phone,
      email, WhatsApp, address, hours) and today’s availability (open, sold out, closed, message). The
      confirmation names the consequence ("Guests on web and app see the maintenance page from now until
      you clear it") (CHG-SGU-022). **Collects what `setMaintenanceMode` sends before it is called.** Required:
      `isInMaintenance`. Optional: `message`, `expectedBackAt`, `minimumAppVersion` (`ios`, `android`),
      `contact` (`phone`, `email`, `whatsapp`, `address`, `openingHours`), `availability` (`open`, `soldOut`,
      `closed`) and `availabilityMessage`. **The live app status is set here, not published** (decided
      28 September, audit R073 (b)(f)): a guest app below `minimumAppVersion` for its platform is sent
      to the forced upgrade (GST-047), the contact details feed WEB-028 and the availability feeds WEB-029''s
      sold-out and closed states. A field not sent is left as it is, so clearing maintenance does not
      clear the contact details. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save maintenance mode
      operation: setMaintenanceMode
    dismiss:
      label: Cancel
      discards:
      - isInMaintenance
      - message
      - expectedBackAt
      - minimumAppVersion
      - contact
      - availability
      - availabilityMessage
    provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
- id: CMS-002
  name: Brand Kit
  module: White Label
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/brand-kit
    component: apps/venue-management-web/src/routes/white-label/BrandKitDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - CMS-001
    - CMS-003
    - CMS-004
    - CMS-005
    inferred: true
    fromFlows: true
    transitions:
    - to: CMS-005
      trigger: Sets the colour theme
      provenance: flow F22 step 1→2
    - to: CMS-001
      trigger: Tenant Workspace
      provenance: 'derived — CMS-001 declares entryState.params  and CMS-002 holds none of them. The edge
        carries nothing: CMS-001 needs nothing to open'
    - to: CMS-003
      trigger: Typography
      provenance: 'derived — CMS-003 declares entryState.params bannerId, pageId, policyKind, version
        and CMS-002 holds none of them. The edge carries nothing: bannerId, pageId, policyKind, version
        only pre-select (deep link or optional), and CMS-003 opens on its own'
    - to: CMS-004
      trigger: Logo & Assets
      provenance: 'derived — CMS-004 declares entryState.params  and CMS-002 holds none of them. The edge
        carries nothing: CMS-004 needs nothing to open'
  notes: "Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. States derived from the screen pattern on 17 August, not individually considered
    — sound for a list, a form or a money screen, and worth revisiting where this screen is unusual.\n
    \n**This screen owns the marks and the logo variant** (logo, dark logo, variant, favicon); CMS-004
    owns the app icons, the splash and the intro video, so the two never edit the same fields (CHG-SGU-022).
    `splashChangeScope` is read-only and shown, never sent."
  density: compact
  pattern: statusTracker
  patternReason: '`getBrandIdentity` reads one record and nothing reads a population — the screen is about
    that one thing'
  purpose: Set the things every surface reads.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The brand identity
        bindsTo: BrandIdentity
        columns:
        - BrandIdentity.logoAssetRef
        - BrandIdentity.logoDarkAssetRef
        - BrandIdentity.logoVariant
        - BrandIdentity.faviconAssetRef
        - BrandIdentity.splashImageAssetRefs
        - BrandIdentity.splashDurationSeconds
        - BrandIdentity.splashBackgroundColour
        - BrandIdentity.showLoadingIndicator
        - BrandIdentity.splashChangeScope
        operation: getBrandIdentity
        provenance: contract white-label.yaml GET /tenant-config/brand
      - kind: fileUpload
        label: Upload a logo
        operation: createUpload
        notes: 'One upload control: it asks the platform for an upload (`createUpload`), sends the file
          and completes it (`completeUpload`) behind the one action; nobody types a file name, content
          type or size.'
        provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
        bindsTo: BrandIdentity.logoAssetRef
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save brand identity
        operation: setBrandIdentity
        provenance: contract white-label.yaml PUT /tenant-config/brand
  states:
    loading: The brand kit, read by `getBrandIdentity`.
    error: Could not load. Names which read failed and leaves the brand kit untouched.
    emptyFirstRun: No brand kit yet. Offers Create upload (`createUpload`).
    emptyNoAccess: Shown when the caller lacks `TENANT_CONFIGURE`, which `getBrandIdentity` requires,
      and names that permission. **Never an empty table** — that reads as *there is no data* and sends
      somebody to support with the wrong question.
  apis:
  - operationId: getBrandIdentity
    contract: white-label
    purpose: Read brand identity
    trigger: onLoad
  - operationId: setBrandIdentity
    contract: white-label
    purpose: Set logo, favicon and splash
    trigger: onAction
  - operationId: createUpload
    contract: assets
    purpose: Request a signed upload URL
    trigger: onAction
  - operationId: completeUpload
    contract: assets
    purpose: Completes the upload behind the one upload control
    trigger: background
  entryState:
    params:
    - name: uploadId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `uploadId`.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-002
  apisNote: Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formSetBrandIdentity
    component: modal
    trigger: Save brand identity
    body: '**Collects what `setBrandIdentity` sends before it is called.** Required: `logoAssetRef`. Optional:
      `logoVariant` (light, dark or duotone: which lockup sits in the nav bar and which colour reading
      of it drives the theme, decided 29 September, rev 3 CFG-4), `logoDarkAssetRef`, `faviconAssetRef`,
      `splashImageAssetRefs`, `splashDurationSeconds`, `splashBackgroundColour`, `showLoadingIndicator`.
      Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: BrandIdentity
    confirm:
      label: Save brand identity
      operation: setBrandIdentity
    dismiss:
      label: Cancel
      discards:
      - logoAssetRef
      - logoDarkAssetRef
      - logoVariant
      - faviconAssetRef
      - splashImageAssetRefs
      - splashDurationSeconds
      - splashBackgroundColour
      - showLoadingIndicator
    provenance: contract white-label.yaml PUT /tenant-config/brand
- id: CMS-003
  name: Typography
  module: White Label
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: venue-management-web
