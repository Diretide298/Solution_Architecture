      - documentType
      - status
      - changeClassification
      - requiresReAcceptance
      - requiresNotification
      - ownerPrincipalId
      - approvedByPrincipalId
      - approvalRequestId
      - approvedAt
      - scopePath
    provenance: contract marketing-crm.yaml PUT /privacy-notice-policy
