  - operationId: createCollection
    contract: assets
    purpose: Create a collection
    trigger: onAction
    invalidates:
    - searchMedia
  - operationId: createUpload
    contract: assets
    purpose: Request a signed upload URL
    trigger: onAction
    invalidates:
    - searchMedia
  - operationId: deleteMediaAsset
    contract: assets
    purpose: Delete an asset
    trigger: onAction
    invalidates:
    - searchMedia
  - operationId: getExpiringRights
