    body: '**Collects what `setPrivacyNoticePolicyGovernance` sends before it is called.** Required: `id`,
      `policyId`, `documentType`, `status`. Optional: `changeClassification`, `requiresReAcceptance`,
      `requiresNotification`, `ownerPrincipalId`, `approvedByPrincipalId`, `approvalRequestId`, `approvedAt`,
      `scopePath`. Dismissing sends nothing; the screen behind is unchanged.'
