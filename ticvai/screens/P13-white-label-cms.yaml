- id: CMS-101
  name: Help Me Choose
  module: White Label
  requiresModule: core
  wave: 2
  implementation:
    app: venue-management-web
    route: /white-label/help-me-choose
    component: apps/venue-management-web/src/routes/white-label/HelpMeChoose.tsx
    status: notStarted
  navigation:
    entryFrom:
    - CMS-016
    - CMS-102
    exitTo:
    - CMS-016
    - CMS-102
    inferred: false
    notes: '**Reached from CMS-016 Site Settings**, beside the booking-flow settings, because Help me
      choose sits on the booking page those settings shape (decided 29 September, rev 3 REV3-11).'
    transitions:
    - to: CMS-016
      trigger: Back to Site Settings
      provenance: authored 29 September, rev 3 REV3-11
      back: true
    - to: CMS-102
      trigger: Back to the Site Builder
      provenance: authored 29 September, W12 (step 4)
      back: true
  notes: '**Added 29 September for rev 3 REV3-11: Help me choose is venue configuration, never hard-coded.**
    A venue sets up one to four questions, each with two to four answers (title, one-liner, icon, optional
    badge), and the answer picked on the last question opens the product, category, event or booking module
    that fits through a result card. **Two sources, one review**: staff write a set-up here, and once
    the venue''s products are uploaded the `ai` service proposes set-ups (`source` `aiSuggested`), which
    land here as drafts. **A suggestion is never published by itself**: a person reviews it, edits it
    or dismisses it, previews it and publishes it. One published set-up per venue; publishing another
    returns the old one to draft.'
  density: compact
  pattern: listDetail
  patternReason: '`listGuidedChoices` reads the venue''s set-ups and the editor acts on one of them —
    list, select, act'
  purpose: Set up a venue's Help me choose so its answers filter the catalogue, review the question set
    the assistant proposes from the venue's products, preview the filtered list and publish it (Site Builder
    step 4).
  layout:
    template: split
    regions:
    - name: filters
      slot: filters
      components:
      - kind: selectField
        label: Venue
        operation: listGuidedChoices
        notes: The venue whose set-ups are shown (path `venueId`); defaults to the session venue.
        provenance: contract white-label.yaml GET /venues/{venueId}/guided-choices
      - kind: selectField
        label: Source
        operation: listGuidedChoices
        notes: Sends `?source=`, `manual` or `aiSuggested`. **Suggestions awaiting review** is `aiSuggested`
          with status `draft`, and is the default view while any exist.
        provenance: contract white-label.yaml GET /venues/{venueId}/guided-choices
      - kind: selectField
        label: Status
        operation: listGuidedChoices
        notes: Sends `?status=`, `draft` or `published`.
        provenance: contract white-label.yaml GET /venues/{venueId}/guided-choices
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every Help me choose set-up at this venue
        bindsTo: GuidedChoice
        columns:
        - GuidedChoice.name
        - GuidedChoice.status
        - GuidedChoice.source
        - GuidedChoice.mode
        - GuidedChoice.showBanner
        - GuidedChoice.publishedAt
        - GuidedChoice.updatedAt
        operation: listGuidedChoices
        notes: '**An AI suggestion is labelled as one** on its row, and keeps `source` `aiSuggested` after
          a person edits it, so a report can count how many proposals were published.'
        provenance: contract white-label.yaml GET /venues/{venueId}/guided-choices
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected set-up
        bindsTo: GuidedChoice
        columns:
        - GuidedChoice.name
        - GuidedChoice.mode
        - GuidedChoice.showBanner
        - GuidedChoice.behaviour
        - GuidedChoice.showEverything
        - GuidedChoice.questions
        - GuidedChoice.status
        - GuidedChoice.source
        - GuidedChoice.suggestionRef
        - GuidedChoice.publishedAt
        - GuidedChoice.publishedBy
        operation: listGuidedChoices
        notes: '**The editor.** `mode`: a button on the booking page, a pop-up on the guest''s first arrival
          as well, or off (configured but not shown). `showBanner`: the dark banner under the products.
          One or two questions, two to four answers each: title, one-liner (140 characters), icon, badge
          (24 characters), target (a product, category, event or booking module, picked from `listProducts`,
          `listProductCategories` and `listEvents`) and the result card (title, body, image; absent fields
          fall back to the target''s own). Every text in every tenant language.

          **Help me choose filters (decided 29 September, W4).** `behaviour` filter (default) or recommend;
          up to four questions, each of a kind: choice, yes/no, age, level or certification. **The filter
          builder** sets what each answer keeps: products, categories, segment tags, an age range, swimmers
          only or never, a certificate held or not; a target may also be a booking flow (`listBookingFlows`).
          An answer may pre-fill a consent question, which the guest still confirms. The "Show everything"
          link is on by default.'
        provenance: contract white-label.yaml GET /venues/{venueId}/guided-choices
      - kind: livePreview
        label: Preview
        notes: '**Renders the draft as a guest would meet it**: the button or pop-up, the banner, each
          question and the result card, in each language and in both directions. Drawn from the record
          in hand; it calls nothing and publishes nothing, and guests keep seeing the published set-up
          until Publish. **Preview the filtered list**: for each combination of answers, the products
          left (read with `listProducts` and the answer''s filter), so an answer that leaves nothing bookable
          shows before it is published (W4).'
        provenance: authored 29 September, rev 3 REV3-11
      - kind: publishGate
        label: What publishing changes
        impliedBy: publishGuidedChoice
        notes: Names the venue, says that guests there see this set-up from now on, and that **the set-up
          published there before returns to draft** (one published per venue). Refused `422` when an answer
          targets a product, category, event or module that is not on sale or not enabled, naming the
          answer; only staff publish (`TENANT_PUBLISH`), never the assistant.
        provenance: contract white-label.yaml POST /guided-choices/{guidedChoiceId}/publish
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: New set-up
        operation: createGuidedChoice
        provenance: contract white-label.yaml POST /venues/{venueId}/guided-choices
      - kind: secondaryButton
        label: Save draft
        operation: updateGuidedChoice
        notes: A draft only. A published set-up is refused `409`; unpublish it first or create a new draft.
        provenance: contract white-label.yaml PATCH /guided-choices/{guidedChoiceId}
      - kind: secondaryButton
        label: Publish
        operation: publishGuidedChoice
        provenance: contract white-label.yaml POST /guided-choices/{guidedChoiceId}/publish
      - kind: secondaryButton
        label: Unpublish
        operation: unpublishGuidedChoice
        notes: Guests stop seeing Help me choose at this venue; the set-up returns to draft.
        provenance: contract white-label.yaml POST /guided-choices/{guidedChoiceId}/unpublish
      - kind: destructiveButton
        label: Delete draft or dismiss suggestion
        operation: deleteGuidedChoice
        notes: A draft only; a published set-up is refused `409`. Dismissing an AI suggestion is this
          delete.
        provenance: contract white-label.yaml DELETE /guided-choices/{guidedChoiceId}
  states:
    loading: The venue's Help me choose set-ups, read by `listGuidedChoices`.
    error: Could not load. Names which read failed and leaves the set-ups untouched.
    emptyFirstRun: '**No Help me choose at this venue, so guests see none.** Offers New set-up, and says
      that once the venue''s products are uploaded the assistant proposes set-ups here as drafts for review.'
    emptyNoResults: The source or status filter matched nothing and the venue's other set-ups are still
      there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `TENANT_CONFIGURE`, which `listGuidedChoices` requires,
      and names that permission. **Never an empty table** — that reads as *there is no data* and sends
      somebody to support with the wrong question.
  apis:
  - operationId: listGuidedChoices
    contract: white-label
    purpose: The venue's set-ups, filtered by source and status (rev 3 REV3-11)
    trigger: onLoad
  - operationId: createGuidedChoice
    contract: white-label
    purpose: Start a set-up by hand, as a draft
    trigger: onAction
    invalidates:
    - listGuidedChoices
  - operationId: updateGuidedChoice
    contract: white-label
    purpose: Edit a draft, including an AI suggestion under review
    trigger: onAction
    invalidates:
    - listGuidedChoices
  - operationId: deleteGuidedChoice
    contract: white-label
    purpose: Delete a draft or dismiss a suggestion
    trigger: onAction
    invalidates:
    - listGuidedChoices
  - operationId: publishGuidedChoice
    contract: white-label
    purpose: Make a reviewed set-up the one guests see at this venue
    trigger: onAction
    invalidates:
    - listGuidedChoices
  - operationId: unpublishGuidedChoice
    contract: white-label
    purpose: Stop showing it to guests; back to draft
    trigger: onAction
    invalidates:
    - listGuidedChoices
  - operationId: listProducts
    contract: catalogue
    purpose: Products an answer can open
    trigger: onAction
  - operationId: listProductCategories
    contract: catalogue
    purpose: Categories an answer can open
    trigger: onAction
  - operationId: listEvents
    contract: catalogue
    purpose: Events an answer can open
    trigger: onAction
  - operationId: listBookingFlows
    contract: white-label
    purpose: The venue's flows an answer can open (target kind bookingFlow, W12)
    trigger: onAction
  - operationId: suggestGuidedChoice
    contract: ai
    purpose: Ask the assistant for a question set from product attributes (age and height rules, level
      tags, certifications); it lands here as a draft through white-label proposeGuidedChoice (W4)
    trigger: onAction
    provenance: build, 29 September 2026
  - operationId: getGuidedChoiceSuggestion
    contract: ai
    purpose: The reasons behind a Help me choose suggestion
    trigger: onAction
    provenance: build, 29 September 2026
  entryState:
    params:
    - name: venueId
      from: session
    - name: guidedChoiceId
      from: navigation
    - name: suggestionId
      from: navigation
    coldEntry: Resolves the venue from the session and opens on the suggestions awaiting review, or on
      the list when there are none.
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P13 Venue CMS.dc.html#cms-101
  overlays:
  - id: formCreateGuidedChoice
    component: modal
    trigger: New set-up
    body: '**Collects what `createGuidedChoice` sends before it is called.** Required: `name` (staff-facing),
      `mode`, `questions` (one or two, each with two to four answers and a target per answer). Optional:
      `showBanner` (default on). Created as a draft; guests see nothing until it is published. Dismissing
      sends nothing; the screen behind is unchanged. **One to four questions; the answers filter the catalogue
      by default and a target per answer is optional** (W4, 29 September) (CHG-SGU-022).'
    bindsTo: GuidedChoice
    confirm:
      label: Create draft
      operation: createGuidedChoice
    dismiss:
      label: Cancel
      discards:
      - name
      - mode
      - showBanner
      - questions
    provenance: corrected 2 October 2026 (CHG-SGU-022, design-notes correction)
  - id: confirmPublishGuidedChoice
    component: confirmDialog
    trigger: Publish
    body: '**Names the venue and the set-up that stops showing there**, since only one is published per
      venue. An answer whose target is not on sale or not enabled blocks the publish and is named (`422`).'
    confirm:
      label: Publish to guests
      operation: publishGuidedChoice
    dismiss:
      label: Cancel
    provenance: contract white-label.yaml POST /guided-choices/{guidedChoiceId}/publish
  - id: confirmDeleteGuidedChoice
    component: confirmDialog
    trigger: Delete draft or dismiss suggestion
    body: Names the set-up and, for an AI suggestion, says that dismissing it removes it and the assistant's
      reasoning with it. A published set-up cannot be deleted (`409`).
    confirm:
      label: Delete
      operation: deleteGuidedChoice
    dismiss:
      label: Keep it
    provenance: contract white-label.yaml DELETE /guided-choices/{guidedChoiceId}
- id: CMS-102
  name: Site Builder
  module: White Label
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/site-builder
    component: apps/venue-management-web/src/routes/white-label/SiteBuilder.tsx
    status: notStarted
  navigation:
    entryFrom:
    - CMS-001
    exitTo:
    - CMS-001
    - CMS-103
    - CMS-101
    - CMS-007
    - CMS-009
    - CMS-002
    - CMS-004
    - CMS-008
    - CMS-005
    - CMS-003
    - CMS-006
    - CMS-012
    - CMS-014
    - CMS-015
    - CMS-104
    inferred: false
    notes: '**The step-based CMS (decided 29 September, W12 and M24-05).** Each of the seven steps opens
      the full screen for its details and comes back here; progress is saved on every return, so the builder
      reopens where the operator left it.'
    transitions:
    - to: CMS-001
      trigger: 1 Venue and modules
      provenance: authored 29 September, W12 (step 1 reuses CMS-001 for modules, feature toggles and guest
        checkout)
      back: true
    - to: CMS-103
      trigger: 2 Ticketing flows
      provenance: authored 29 September, W12 (steps 2 and 3 are CMS-103)
