- id: CMS-010
  name: Media Library
  module: White Label
  requiresModule: core
  wave: 2
  capability: C00
  implementation:
    app: venue-management-web
    route: /white-label/media-library
    component: apps/venue-management-web/src/routes/white-label/MediaLibraryDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - CMS-001
    - CMS-002
    - CMS-003
    inferred: false
    entryFrom:
    - CMS-001
    notes: '**Reached from CMS-001** — a top-level workspace section. Stated on 4 September: this screen
      exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
    transitions:
    - to: CMS-001
      trigger: Tenant Workspace
      provenance: 'derived — CMS-001 declares entryState.params  and CMS-010 holds none of them. The edge
        carries nothing: CMS-010 is opened from CMS-001, so this edge is the way back and CMS-001 keeps
        its own state'
    - to: CMS-002
      trigger: Brand Kit
      carries:
      - uploadId
      provenance: derived — CMS-002 declares entryState.params uploadId and CMS-010 holds uploadId, so
        an edge into it carries them
    - to: CMS-003
      trigger: Typography
      provenance: 'derived — CMS-003 declares entryState.params bannerId, pageId, policyKind, version
        and CMS-010 holds none of them. The edge carries nothing: bannerId, pageId, policyKind, version
        only pre-select (deep link or optional), and CMS-003 opens on its own'
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. States derived from the screen pattern on 17 August, not individually considered
    — sound for a list, a form or a money screen, and worth revisiting where this screen is unusual.


    **Archive and quarantine are reversible; deletion is the only end of an asset''s life (decided 28
    September, audit STATE-MEDIA).** An archived asset offers **Restore** (`updateMediaAsset` with `status:
    ready`); a quarantined one offers **Release**, which is the same call after a reviewer has cleared
    the scan flag (the state model marks that move as needing approval). **Delete media asset** (`deleteMediaAsset`)
    removes the asset for good and is refused while it is referenced.'
  density: compact
  pattern: listDetail
  patternReason: '`searchMedia` reads the population and `getMediaEntitlements` reads one of them — list,
    select, act'
  purpose: Hold the imagery, and know where it is used.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Kind
        operation: searchMedia
        notes: The media kinds (image, video, document, audio) as a choice; sends `kind`.
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
        bindsTo: MediaAsset.kind
      - kind: multiSelect
        label: Tag
        operation: searchMedia
        notes: Tags picked from the taxonomy; sends `tag`.
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
        bindsTo: MediaAsset.tags
      - kind: selectField
        label: Collection
        operation: searchMedia
        notes: Collections by name; sends `collectionId`.
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
        bindsTo: Collection.name
      - kind: selectField
        label: Venue
        operation: searchMedia
        notes: Venues by name; sends `venueId`.
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
        bindsTo: MediaAsset.venueId
      - kind: searchField
        label: Search
        operation: searchMedia
        notes: Sends `?search=` to `searchMedia`.
        provenance: contract assets.yaml GET /media
      - kind: toggle
        label: Unused only
        operation: searchMedia
        notes: Sends `?unusedOnly=` to `searchMedia`.
        provenance: contract assets.yaml GET /media
      - kind: numberField
        label: Rights expiring within days
        operation: searchMedia
        notes: Sends `?rightsExpiringWithinDays=` to `searchMedia`.
        provenance: contract assets.yaml GET /media
      - kind: dataTable
        label: Every media asset
        bindsTo: MediaAsset
        columns:
        - MediaAsset.kind
        - MediaAsset.status
        - MediaAsset.filename
        - MediaAsset.contentType
        - MediaAsset.sizeBytes
        - MediaAsset.title
        - MediaAsset.altText
        - MediaAsset.width
        - MediaAsset.height
        - MediaAsset.durationSeconds
        operation: searchMedia
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
      - kind: dataTable
        label: Every collection
        bindsTo: Collection
        columns:
        - Collection.name
        - Collection.description
        - Collection.assetCount
        operation: listCollections
        provenance: corrected 2 October 2026 (CHG-SGU-019, design-notes correction)
      - kind: confirmDialog
        derived: true
        label: Confirm
        notes: '**The consequence goes in the body, not the title.** *Cancel 3 orders worth AED 480* is
          a confirmation; *are you sure* is not — and a dialog that cannot name what it destroys is a
          dialog somebody dismisses.


          **Added 31 August.** `confirmDialog` and `modal` were both in the component library and used
          **zero times across 492 screens**, while `destructiveButton` was used 39 times and its own entry
          reads *always requires confirmation*.'
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected media asset
        bindsTo: MediaAsset
        columns:
        - MediaAsset.id
        - MediaAsset.kind
        - MediaAsset.status
        - MediaAsset.filename
        - MediaAsset.contentType
        - MediaAsset.sizeBytes
        - MediaAsset.title
        - MediaAsset.description
        - MediaAsset.altText
        - MediaAsset.width
        - MediaAsset.height
        - MediaAsset.durationSeconds
        - MediaAsset.customMetadata
        - MediaAsset.sharedWithTenantIds
        - MediaAsset.tags
        - MediaAsset.venueId
        operation: searchMedia
        provenance: contract assets.yaml GET /media
      - kind: detailPanel
        label: The expiring media
        bindsTo: ExpiringMedia
        columns:
