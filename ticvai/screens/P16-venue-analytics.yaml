        bindsTo: Alert
        columns:
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.acknowledgedAt
        - Alert.resolvedAt
        - Alert.escalatedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
      - kind: multiSelect
        label: Domain
        notes: '**The selector that collapses 26 board screens into nine.** A domain is a filter on an
          analytics screen, not a copy of it — building three sets means maintaining one screen three
          times and watching them drift.'
        provenance: carried from the previous definition
      - kind: chart
        notes: '**Comparison against the previous period by default.** A number with nothing beside it
          is a number nobody can act on.'
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected alert
        bindsTo: Alert
        columns:
        - Alert.ruleName
        - Alert.metric
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.observedValue
        - Alert.threshold
        - Alert.acknowledgedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
      - kind: detailPanel
        label: The command centre
        bindsTo: CommandCentre
        columns:
        - CommandCentre.modules
        - CommandCentre.resolvedAt
        operation: getCommandCentre
        provenance: contract reporting.yaml GET /command-centre
      - kind: detailPanel
        label: The dashboard data
        bindsTo: DashboardData
        columns:
        - DashboardData.tileData
        operation: getDashboard
        provenance: contract reporting.yaml GET /dashboards/{dashboardId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Request suggestion
        operation: requestSuggestion
        provenance: contract ai.yaml POST /ai/suggestions
      - kind: secondaryButton
        label: Run report
        operation: runReport
        provenance: contract reporting.yaml POST /reports/{reportId}/run
  states:
    loading: Tiles render in place; **each resolves on its own** so one slow source does not hold the
      page.
    error: Could not load. **Trading is unaffected** — this reads and writes nothing.
    emptyFirstRun: '**A venue with no trading history.** Links to the seeded reports rather than showing
      zeroes — a dashboard of zeroes teaches a new manager nothing.'
    emptyNoResults: Nothing in this window. **Last week and last month are the useful defaults**, not
      today — an analytics screen opened on a Monday is asking about a period.
    emptyNoAccess: You do not have reporting permission at this scope. **Sections you cannot see are not
      shown** rather than greyed out.
  apis:
  - operationId: getCommandCentre
    contract: reporting
    purpose: The modules this login is entitled to, and each module's dashboards
    trigger: onLoad
    provenance: command-centre decision, 22 September 2026
  - operationId: getDashboard
    contract: reporting
    purpose: Read a dashboard with tile data
    trigger: onLoad
  - operationId: listAlerts
    contract: reporting
    purpose: What is currently raised
    trigger: onLoad
  - operationId: requestSuggestion
    contract: ai
    purpose: requestSuggestion
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: runReport
    contract: reporting
    purpose: Run a report
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: recordDashboardView
    contract: reporting
    purpose: Record that a dashboard was opened — fired once when the dashboard renders; nothing on the
      screen waits for it.
    trigger: background
  - operationId: listAiInsights
    contract: ai
    purpose: Insights and anomalies
    trigger: onLoad
    provenance: build, 29 September 2026
  entryState:
    params:
    - name: venueId
      from: session
    - name: domain
      from: session
      optional: true
    - name: dashboardId
      from: deepLink
    - name: reportId
      from: deepLink
    coldEntry: '**A bookmarked dashboard is the normal way in** — a manager opens the same view every
      Monday. The domain and the window come from the link where it carries them, and from the last view
      where it does not.'
    preloaded:
    - Alert.id
    - Alert.ruleId
    - Alert.ruleName
    - Alert.metric
    - Alert.raisedAt
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P16 Venue Analytics.dc.html#anl-001
    source: Claude Design POS pack, 24 August
    note: '**Drawn as POS-6A in the client POS pack.** The pack''s frame is the specification — it carries
      operations, states, entry params and exits, and it is better specified than anything derived from
      the screen file.'
    derivedFrom: wireframes/POS Board 6.dc.html#pos-6a
  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  purposeNote: Provide senior management with an immediate consolidated view of overall organizational
    performance.
  gaps:
  - operation: null
    why: '**This screen''s operations return no schema with described properties**, so not one of its
      columns can be bound. The columns are the pack''s own labels and are carried as text until the response
      shape exists.'
    source: pack Unified_BI_Reporting_and_AI_Analytics_Platform_Reference.pdf, page 3 §The system shall
      display
  overlays:
  - id: formRequestSuggestion
    component: modal
    trigger: Request suggestion
    body: '**Collects what `requestSuggestion` sends before it is called.** Required: `kind`. Optional:
      `subjectRef`, `horizon`, `context`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Request suggestion
      operation: requestSuggestion
    dismiss:
      label: Cancel
      discards:
      - kind
      - subjectRef
      - horizon
      - context
    provenance: contract ai.yaml POST /ai/suggestions
  - id: formRunReport
    component: modal
    trigger: Run report
    body: '**Collects what `runReport` sends before it is called.** Nothing in the body is required. Optional:
      `parameters`, `venueId`, `dateFrom`, `dateTo`, `forceAsync`. Dismissing sends nothing; the screen
      behind is unchanged.'
    bindsTo: RunReportRequest
    confirm:
      label: Run report
      operation: runReport
    dismiss:
      label: Cancel
      discards:
      - parameters
      - venueId
      - dateFrom
      - dateTo
      - forceAsync
    provenance: contract reporting.yaml POST /reports/{reportId}/run
