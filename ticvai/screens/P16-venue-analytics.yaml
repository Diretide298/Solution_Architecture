    a suggestion surface that differs per domain is six screens to change when the model changes. **Owns
    POS board frame(s) POS-6F** (client pack, 24 August). **Assigned by board purpose rather than by operation
    overlap** — three attempts at deriving that mapping produced plausible nonsense, and a reader who
    trusts a bad table is worse off than one who has none. **Board repointed 24 August.** This screen
    pointed at `wireframes/POS Board 6.dc.html#pos-6f` — a frame in the client pack, which is where the
    design came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html` and `P16 Venue
