  states:
    loading: The report access sharing list.
    error: Could not load. Names which read failed and leaves the report access sharing untouched.
    emptyFirstRun: 'No report access policy yet: reports follow the roles'' own reporting permissions
      alone. Offers New access policy (`createAuthorisationPolicy`) to narrow or widen that by group,
      operating area or user; distinct from a filter that matched nothing.'
    emptyNoResults: Nothing matches the status filter, and the access policies are still there. Names
      the active filter and offers to clear it.
    emptyNoAccess: 'Shown when the caller lacks `PERMISSION_VIEW`, which `listAuthorisationPolicies` requires
