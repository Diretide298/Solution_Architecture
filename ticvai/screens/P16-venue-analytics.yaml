    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: New access policy
        operation: createAuthorisationPolicy
        notes: Created as a draft; it applies only once activated (`setAuthorisationPolicyState`, on the
          role and policy screens).
        provenance: contract identity.yaml POST /authorisation-policies
      - kind: secondaryButton
