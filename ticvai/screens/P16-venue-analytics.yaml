  notes: '**Built 20 August. Answers 3 board screens**: F&B Executive Command Center; Retail Executive
    Command Center; Enterprise Frontline Operations Dashboard. **Three board screens, one screen with
    a domain selector.** F&B, Retail and POS each drew an executive command centre and they differ only
    in which numbers fill the tiles. **Owns POS board frame(s) POS-6A** (client pack, 24 August). **Assigned
    by board purpose rather than by operation overlap** — three attempts at deriving that mapping produced
    plausible nonsense, and a reader who trusts a bad table is worse off than one who has none. **Board
    repointed 24 August.** This screen pointed at `wireframes/POS Board 6.dc.html#pos-6a` — a frame in
    the client pack, which is where the design came from and not where this screen is drawn. **`P15 Kitchen
    Display.dc.html` and `P16 Venue Analytics.dc.html` carry one anchor per screen and nothing referenced
    either**, so both shipped correctly anchored and unreachable. The pack frame is kept in `derivedFrom`
    because provenance is worth more than the wrong pointer. **`wireframe.status` corrected 25 August.**
    When these screens were repointed from the client pack to their own board on 24 August, the status
    stayed `designed` — **which claimed a client had drawn a board this package generated.** `derivedFrom`
    keeps the pack frame, which is where the design came from; `status` describes the file being pointed
    at, and those are different facts.


    **Combo, matrix, waterfall, treemap and scatter now bind** (CHG-FIN-007, 2 October 2026) through the
    report column encodings; the correction that they could not is closed. **Measure names, not "Revenue"**
    (decided 2 October 2026, Chinmay; CHG-FIN-002; BOARDREQ MOM-2758..2761). Takings (money taken less
    money paid back, a cash-control figure), Gross sales (before discounts, excluding VAT), Net revenue
    (gross sales less discounts and refunds), Recognised revenue and Deferred revenue are different numbers
    and never share a label; a tile takes its label from the seeded KPI it is bound to (`ReportingSystemKpi`).'
