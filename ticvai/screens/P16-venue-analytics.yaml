- id: ANL-023
  name: Drag-and-Drop Dashboard Canvas
  module: Analytics
  requiresModule: analytics
  wave: 3
  source:
    pack: Unified_BI_Reporting_and_AI_Analytics_Platform_Reference.pdf
    board: '2'
    number: '2.3'
    page: 16
  implementation:
    app: venue-management-web
    route: /analytics/drag-and-drop-dashboard-canvas-anl-023
    component: apps/venue-management-web/src/routes/analytics/DragAndDropDashboardCanvas.tsx
    status: notStarted
  navigation:
    entryFrom:
    - ANL-021
    exitTo:
    - ANL-021
    transitions:
    - to: ANL-021
      trigger: Back to Dashboard Library
      provenance: structural — pack board 2 wiring, 9 September 2026
      back: true
      carries:
      - dashboardId
  density: compact
  purposeNote: A business analyst can visually construct a dashboard without coding.
  pattern: configEditor
  patternReason: 'A canvas edited and saved as a whole (`updateDashboard` replaces the tiles), drawn 2
    October 2026 from the client''s dashboard specification (MATRIX 8.7.12: grid, gallery, data pane,
    field wells, formatting); CHG-SOT-010.'
  purpose: Provide the main visual workspace for dashboard construction.
  gaps:
  - operation: null
    why: '**No draft, preview-publish or rollback for a dashboard** (design-notes correction ANL-023,
      MATRIX 7.1.46). Every save overwrites the live dashboard; the contract has no dashboard version
      or publish operation. Undo and redo are drawn as session-only. Logged as a contract gap 2 October
      2026 (CHG-SOT-016).'
    source: contracts/satellite/reporting.yaml#updateDashboard
  layout:
    template: split
    regions:
    - name: toolbar
      slot: publish
      components:
      - kind: primaryButton
        label: Save dashboard
        operation: updateDashboard
        notes: Saves the whole dashboard (tiles replace tiles); the confirmation names tiles that will
          be removed. Refused 422 `tile-encoding-missing` for a tile whose report lacks a well its mark
          requires, naming the tile and the well.
        provenance: contract reporting.yaml PUT /dashboards/{dashboardId}
      - kind: iconButton
        label: Undo
        notes: Undo the last change on the canvas, in this editing session only. Nothing is saved until
          Save dashboard.
        provenance: design-notes correction ANL-023 (MATRIX 7.1.46), 2 October 2026
      - kind: iconButton
        label: Redo
        notes: Redo, in this editing session only.
        provenance: design-notes correction ANL-023 (MATRIX 7.1.46), 2 October 2026
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.** Discards unsaved changes
          after saying how many.'
        provenance: derived from updateDashboard
      - kind: destructiveButton
        label: Archive dashboard
        operation: deleteDashboard
        notes: Archives rather than removes (`archivedAt`); the confirmation names the dashboard and its
          tile count.
        provenance: contract reporting.yaml DELETE /dashboards/{dashboardId}
    - name: gallery
      slot: collection
      components:
      - kind: cardList
        label: Visuals
        notes: '**All twenty marks of `DashboardTile.visualisation`, the nine complex ones included**
          (decided 2 October 2026, Chinmay: "Build all chart types, including the nine complex ones";
          DEC-080, CHG-FIN-007): number, line, area, bar, stackedBar, stackedBar100, combo, pie, donut,
          table, matrix, gauge, heatmap, funnel, waterfall, treemap, scatter, map, ribbon and decompositionTree.
          Each card names the wells its mark requires (the binding table in the contract): combo an x
          dimension and two or more measures with axis and series type; matrix rows, optional columns
          and values; funnel ordered stages and a value; waterfall ordered steps and a value, total last;
          treemap categories with levels and a size; scatter x, y and a label; map a location and a value;
          ribbon a period, a series and a value; decomposition tree a value and two or more levels. Slicers
          and narrative text are not marks (`x-ticvai-refuses`).'
        provenance: contract reporting.yaml DashboardTile.visualisation (CHG-FIN-007)
    - name: dataPane
      slot: filters
      components:
      - kind: searchField
        label: Find a report
        operation: listReports
        notes: Sends `?search=`; the data pane lists the reports a tile may bind, by category.
        provenance: contract reporting.yaml GET /reports
      - kind: treeNav
        label: Reports and their columns
        bindsTo: ReportDefinition
        operation: getReport
        notes: Each report opens to its columns with `role`, `encoding`, `axis`, `seriesType`, `hierarchyLevel`
          and `unitLabel` (CHG-FIN-007); a column is dragged into a well.
        provenance: contract reporting.yaml GET /reports/{reportId}
    - name: contentBody
      slot: canvas
      components:
      - kind: detailPanel
        label: Canvas
        bindsTo: Dashboard
        columns:
        - Dashboard.name
        - Dashboard.module
        - Dashboard.venueId
        - Dashboard.isShared
        - Dashboard.tiles
        operation: getDashboard
        notes: A grid; each tile sits at `position` (row, column, width, height). **At most 24 tiles.**
          Every tile renders its mark with live data, shows its as-of time and a stale warning past its
          refresh (BOARDREQ MOM-2713/2714).
        provenance: contract reporting.yaml GET /dashboards/{dashboardId}
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Field wells
        bindsTo: ReportColumn
        columns:
        - ReportColumn.label
        - ReportColumn.role
        - ReportColumn.encoding
        - ReportColumn.axis
        - ReportColumn.seriesType
        - ReportColumn.hierarchyLevel
        - ReportColumn.unitLabel
        operation: getReport
        notes: The wells of the selected tile's mark, filled from its report's columns. A required well
          left empty is named in red, and Save is refused for it rather than drawing an empty chart.
        provenance: contract reporting.yaml ReportColumn (CHG-FIN-007)
      - kind: textField
        label: Tile title
        bindsTo: DashboardTile.title
        operation: updateDashboard
        provenance: contract reporting.yaml DashboardTile
      - kind: numberField
        label: Refresh every (seconds)
        bindsTo: DashboardTile.refreshSeconds
        operation: updateDashboard
        notes: Minimum 30.
        provenance: contract reporting.yaml DashboardTile
      - kind: detailPanel
        label: Formatting
        bindsTo: DashboardTile
        columns:
        - DashboardTile.parameters
        operation: updateDashboard
        notes: 'The tile''s run parameters and display settings (for `number`: comparison, variance, sparkline
          and status icon).'
        provenance: contract reporting.yaml DashboardTile.parameters
  states:
    loading: The dashboard and its tiles.
    error: Could not load. Names which read failed (the dashboard or a report) and leaves the canvas as
      it was.
    emptyFirstRun: A new dashboard with no tiles yet. The gallery is open and says "Drag a visual onto
      the grid"; nothing is created until Save dashboard.
    emptyNoResults: The report search matched nothing. Names the search and offers to clear it.
    emptyNoAccess: Without `REPORT_VIEW_VENUE`, which `listReports` requires, the screen does not load
      and this state names that permission. Shown when the caller lacks `REPORT_MANAGE`, which saving
      requires; the dashboard opens read-only and names that permission.
  apis:
  - operationId: updateDashboard
    contract: reporting
    purpose: Lay it out
    trigger: onAction
    provenance: board reading, 19 September 2026
    invalidates:
    - getDashboard
    - listDashboards
  - operationId: getDashboard
    contract: reporting
    purpose: The dashboard being edited
    trigger: onAction
    provenance: board reading, 19 September 2026
  - operationId: deleteDashboard
    contract: reporting
    purpose: Archive this dashboard
    trigger: onAction
    provenance: decided 29 September, VM close-out (venue management and configuration)
  - operationId: recordDashboardView
    contract: reporting
    purpose: Record that a dashboard was opened — fired once when the dashboard renders; nothing on the
      screen waits for it.
    trigger: background
  - operationId: listReports
    contract: reporting
    purpose: The reports a tile may bind, for the data pane
    trigger: onLoad
    provenance: '2 October 2026 (CHG-SOT-010): the canvas binds tiles to reports'
  - operationId: getReport
    contract: reporting
    purpose: A report's columns and their encodings, for the field wells
    trigger: onAction
    provenance: '2 October 2026 (CHG-SOT-010): the wells come from ReportColumn (CHG-FIN-007)'
  wireframe:
    status: notStarted
    board: wireframes/P16 Venue Analytics.dc.html#anl-023
    workshopBoard: wireframes/WS173 Unified BI Reporting and AI Analytics Platform Board 2.dc.html#anl-023
  apisNote: Regenerated 9 September 2026 from Unified_BI_Reporting_and_AI_Analytics_Platform_Reference.pdf
    page 16. 0 of 0 labels bound to a contract property; 0 of 26 pack bullets carried onto the screen
    — the rest are acceptance prose, worked examples and AI narrative, which belong to the matrix and
    the contracts rather than here.
  entryState:
    params:
    - name: dashboardId
      from: navigation
    - name: reportId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen lists them with `listReports`
        and the user picks one; an edge that holds one may still carry it to open on that record.'
  notes: '**The nine new marks bind** (decided 2 October 2026, Chinmay; CHG-FIN-007). The canvas offers
    all twenty marks of `DashboardTile.visualisation` and, for each, field wells filled from the report''s
    columns (`ReportColumn.role`, `encoding`, `axis`, `seriesType`, `hierarchyLevel`, `unitLabel`): combo
    (x, bars and lines, primary and secondary axis with units), matrix (rows, columns, values, with drill
    levels), funnel (ordered stages, value), waterfall (ordered steps of a measure set, total last), treemap
    (nested categories, size, colour), scatter (x, y, label, size, colour), map (venue, zone or map point,
    value), ribbon (period, series, value) and decomposition tree (value, levels). A tile whose report
    lacks a required well cannot be saved (422 `tile-encoding-missing`). At most 24 tiles; every tile
    shows its as-of time and a stale warning past its refresh (BOARDREQ MOM-2713/2714).'
  permission: REPORT_MANAGE
  overlays:
  - id: confirmUpdateDashboard
    component: confirmDialog
    trigger: Save dashboard
    body: '**Names what the save removes**, because the tiles are replaced as a whole ("Save and remove
      2 tiles: Refunds by channel, Queue time"). Dismissing keeps editing.'
    confirm:
      label: Save dashboard
      operation: updateDashboard
    dismiss:
      label: Keep editing
      discards: []
    provenance: contract reporting.yaml PUT /dashboards/{dashboardId}
  - id: confirmDeleteDashboard
    component: confirmDialog
    trigger: Archive dashboard
    body: Names the dashboard and its tile count; archived dashboards leave the library unless asked for.
      Dismissing sends nothing.
    confirm:
      label: Archive dashboard
      operation: deleteDashboard
    dismiss:
      label: Cancel
      discards: []
    provenance: contract reporting.yaml DELETE /dashboards/{dashboardId}
