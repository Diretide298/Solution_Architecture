  overlays:
  - id: formCreateAuthorisationPolicy
    component: drawer
    trigger: New access policy
    body: '**Collects what `createAuthorisationPolicy` sends.** Required: `code`, `name`, `effect` (permit
      or deny; deny wins). Optional: `description`, `permissions` (the reporting permissions it speaks
      to), `conditions`, `combining`, `priority`, `scopePath` (the operating area), `appliesToRoleIds`
      (the groups), `effectiveFrom`, `effectiveTo`. Never or: the server sets them. Dismissing sends nothing.
      Not asked, because the server sets them (readOnly in the contract): `id`, `status`, `version` (3
      October 2026, CHG-SPF-001).'
    bindsTo: AuthorisationPolicy
    confirm:
      label: Create access policy
      operation: createAuthorisationPolicy
    dismiss:
      label: Cancel
      discards:
      - code
      - name
      - effect
      - description
      - permissions
      - conditions
      - combining
      - priority
      - scopePath
      - appliesToRoleIds
      - effectiveFrom
      - effectiveTo
    provenance: contract identity.yaml POST /authorisation-policies
  - id: formUpdateAuthorisationPolicy
    component: drawer
    trigger: Save access policy
    body: '**The selected policy, editable.** The same fields as creating one; saving writes a new version
      and the panel shows it. Dismissing sends nothing.'
    bindsTo: AuthorisationPolicy
    confirm:
      label: Save access policy
      operation: updateAuthorisationPolicy
    dismiss:
      label: Cancel
      discards:
      - name
      - effect
      - description
      - permissions
      - conditions
      - combining
      - priority
      - scopePath
      - appliesToRoleIds
      - effectiveFrom
      - effectiveTo
    provenance: contract identity.yaml PUT /authorisation-policies/{policyId}
