  density: compact
  purposeNote: Administrators can centrally define reusable KPIs and ensure the same KPI calculation is
    used across TICVAI dashboards.
  pattern: configEditor
  patternReason: the pack gives this screen a configuration directory (§Configure; Define whether) and
    no display directory — it is settings, not a population
  purpose: Allow authorized business users to create standardized enterprise KPIs.
  gaps:
  - operation: null
    why: '**No update or retire operation for a KPI** (design-notes correction ANL-025). `createKpi` writes
      one; nothing corrects or retires it, so a mistake cannot be put right. Logged as a contract gap
      2 October 2026 (CHG-SOT-016). The earlier gap ("declares no operation that writes anything") was
      stale: the screen declares `createKpi`.'
    source: contracts/satellite/reporting.yaml#createKpi
  layout:
    template: form
    regions:
    - name: contentBody
      slot: fields
      components:
      - kind: textField
        label: KPI name
        bindsTo: KpiDefinition.name
        provenance: contract reporting.yaml KpiDefinition
      - kind: textField
        label: KPI code
        bindsTo: KpiDefinition.code
        notes: Unique in the tenant; the seeded codes (`takings`, `admissions`, the finance measures)
          are taken.
        provenance: contract reporting.yaml KpiDefinition
      - kind: textField
        label: Description
        bindsTo: KpiDefinition.description
        provenance: contract reporting.yaml KpiDefinition
      - kind: selectField
        label: Business domain
        bindsTo: KpiDefinition.domain
        notes: The semantic model's domains.
        provenance: contract reporting.yaml KpiDefinition
      - kind: textField
        label: Owner
        bindsTo: KpiDefinition.owner
        provenance: contract reporting.yaml KpiDefinition
      - kind: textField
        label: Formula
        bindsTo: KpiDefinition.formula
        notes: '**Against the semantic model, not tables.** The measure, the aggregation and the data
          source are all in the formula; there are no separate fields for them.'
        provenance: contract reporting.yaml KpiDefinition.formula
      - kind: selectField
        label: Unit
        bindsTo: KpiDefinition.unit
        notes: Currency, count, percentage, duration, ratio or score. Currency and decimal places follow
          the region (AED 2, BHD/KWD/OMR 3), not the KPI.
        provenance: contract reporting.yaml KpiDefinition.unit
      - kind: toggle
        label: Higher is better
        bindsTo: KpiDefinition.higherIsBetter
        notes: 'One yes/no. Examples, not fields: revenue and conversion up is better; refund rate, gate
          rejection rate and queue time down is better.'
        provenance: contract reporting.yaml KpiDefinition.higherIsBetter
      - kind: selectField
        label: Default period
        bindsTo: KpiDefinition.defaultPeriod
        provenance: contract reporting.yaml KpiDefinition
      - kind: toggle
        label: Active
        bindsTo: KpiDefinition.isActive
        notes: 'The KPI''s status: inactive KPIs are kept and not offered on dashboards.'
        provenance: contract reporting.yaml KpiDefinition.isActive
      - kind: dataTable
        label: KPIs already defined
        bindsTo: KpiDefinition
        columns:
        - KpiDefinition.code
        - KpiDefinition.name
        - KpiDefinition.domain
        - KpiDefinition.unit
        - KpiDefinition.higherIsBetter
        - KpiDefinition.owner
        - KpiDefinition.isActive
        operation: listKpis
        notes: The seeded KPIs first (takings, admissions and the finance measures, CHG-FIN-007), then
          the tenant's own.
        provenance: contract reporting.yaml GET /kpis
    - name: actionBar
      slot: publish
      components:
      - kind: primaryButton
        label: Create KPI
        operation: createKpi
        notes: Defines it once, for every dashboard and report.
        provenance: contract reporting.yaml POST /kpis
  states:
    loading: The KPIs already defined.
    error: Could not load. Names which read failed and leaves the form untouched.
    emptyFirstRun: Only the seeded KPIs exist (takings, admissions and the finance measures). Offers Create
      KPI (`createKpi`) for the tenant's first own KPI.
    emptyNoAccess: Without `REPORT_VIEW_TENANT`, which `listKpis` requires, the screen does not load and
      this state names that permission. Shown when the caller lacks `REPORT_MANAGE`, which `createKpi`
      requires; the KPI list stays readable and the form names that permission.
  apis:
  - operationId: listKpis
    contract: reporting
    purpose: KPIs already defined
    trigger: onLoad
    provenance: board reading, 19 September 2026
  - operationId: createKpi
    contract: reporting
    purpose: Define one, for everywhere
