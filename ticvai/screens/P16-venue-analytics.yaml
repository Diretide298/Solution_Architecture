        label: Gross sales to net revenue
        bindsTo: KpiValue
        operation: getKpiValues
        notes: 'The `waterfall` mark (CHG-FIN-007): Gross sales, minus Discounts, minus Refunds, equals
          Net revenue, from the same seeded KPIs as the tiles. Never gross and net stacked in one bar.'
        provenance: contract reporting.yaml DashboardTile.visualisation waterfall (CHG-FIN-007)
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Where the money stands
        bindsTo: UnifiedReconciliation
        columns:
        - UnifiedReconciliation.from
        - UnifiedReconciliation.to
        - UnifiedReconciliation.sources
        - UnifiedReconciliation.variances
        operation: getUnifiedReconciliation
        notes: POS, gateway, bank, wallet and ledger, each with its total and count, then each variance
          naming the two sources that disagree ("Gateway vs Ledger, short AED 500.00"). Shown as "Not
          available with your access" without ledger access, never as zeros.
        provenance: contract finance.yaml GET /reconciliation/unified
      - kind: metricTile
        label: Tax invoices issued
        operation: listTaxInvoices
        notes: Count for the legal entity and period.
        provenance: contract finance.yaml GET /tax-invoices
      - kind: metricTile
        label: Credit memos
        operation: listCreditMemos
        notes: Count and value for the legal entity and period. "Credit memo", not "Tax credit note",
          until the label is decided.
        provenance: contract finance.yaml GET /credit-memos
      - kind: metricTile
        label: E-invoice transmissions failed
        operation: listEInvoiceTransmissions
        notes: '`status=failed`; red above zero and links to the transmission log.'
        provenance: contract finance.yaml GET /e-invoicing/transmissions
  states:
    loading: The finance measures for the chosen legal entity and period.
    error: Could not load. Names which read failed (the measures, the money position or the tax documents)
      and leaves the others on screen.
    emptyFirstRun: 'No postings for this period yet. Offers no create action: a dashboard has nothing
      to create; it says which period is empty and offers the previous one.'
    emptyNoResults: The venue or product category filter matched no sales in the period. Names the active
      filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `LEDGER_VIEW`, which the money position and tax documents
      require, and names that permission. **Never an empty table** — that reads as *there is no data*.
