    - name: contentBody
      slot: carried
      components:
      - kind: multiSelect
        label: Kind
        provenance: carried from the previous definition
      - kind: cardList
        bindsTo: Suggestion[]
        notes: '**The basis and the stage are on the card, not behind a tap.** Every answer shows a "Based
          on" chip (*your venue profile, UAE calendar, weather, 23 days of your sales*) and a stage badge:
          Starting, Learning, Established or Trained on your data (29 September, AI functions review).
          "Limited historical data" while the starting pattern carries more than half the weight. Never
          a bare percentage.'
        provenance: carried from the previous definition
        operation: requestSuggestion
      - kind: detailPanel
        notes: The explanation in plain words and the inputs it used. **Advice computed from data the
          manager cannot see is advice they will not trust.**
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Take it
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Do something else
        notes: '**Records the outcome either way.** A rejected suggestion is the case the current rule
          got wrong, which is exactly what a model is trained to beat.'
