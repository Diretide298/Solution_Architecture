      - kind: dataTable
        label: Who may see which reports
        bindsTo: AuthorisationPolicy
        columns:
        - AuthorisationPolicy.name
        - AuthorisationPolicy.effect
        - AuthorisationPolicy.permissions
        - AuthorisationPolicy.appliesToRoleIds
        - AuthorisationPolicy.scopePath
        - AuthorisationPolicy.status
        - AuthorisationPolicy.effectiveFrom
        operation: listAuthorisationPolicies
        notes: The policies whose permissions include a reporting permission (`REPORT_*`). Roles and scopes
          are shown by name (group rights, operating-area rights, user rights), never as ids. **Cursor
          pagination, never offset.**
        provenance: contract identity.yaml GET /authorisation-policies; correction applied 2 October 2026
          (CHG-SOT-013)
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected access policy
        bindsTo: AuthorisationPolicy
        columns:
        - AuthorisationPolicy.code
        - AuthorisationPolicy.name
        - AuthorisationPolicy.description
        - AuthorisationPolicy.effect
        - AuthorisationPolicy.permissions
        - AuthorisationPolicy.priority
        - AuthorisationPolicy.status
        - AuthorisationPolicy.effectiveFrom
        operation: listAuthorisationPolicies
        provenance: contract identity.yaml GET /authorisation-policies
      - kind: detailPanel
        label: Sharing and export rules
        bindsTo: AnalyticsGovernancePolicy
        columns:
        - AnalyticsGovernancePolicy.sharing
        - AnalyticsGovernancePolicy.export
        - AnalyticsGovernancePolicy.masking
        operation: getAnalyticsGovernancePolicy
        notes: Read-only here; edited on ANL-070 by holders of `REPORT_GOVERNANCE_MANAGE` (DEC-225, CHG-FUP-007).
          **Sharing, export and subscription cannot bypass the permission model** (the pack's acceptance
          condition).
