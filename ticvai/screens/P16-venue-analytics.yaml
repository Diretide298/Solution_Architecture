    status: notStarted
    board: wireframes/P16 Venue Analytics.dc.html#anl-072
    workshopBoard: wireframes/WS163 TICVAI Finance Backend Structure Reference v1.0 Board 1.dc.html#bo-1081
    note: The client's workshop frame for this dashboard is the one drawn for BO-1081 (the same pack,
      board 1, number 1), whose content ANL-072 carries since DEC-219 (CHG-SOT-008; CHG-GTB-006).
  notes: '**Issued 2 October 2026 (CHG-SOT-008, DEC-219).** The Finance standard dashboard of the one
    reporting area (DI-721), carrying DI-260''s content from BO-1081, which becomes a link card on Orders
    & Money (P08, the back-office agent''s change). The design notes of BO-1081 (finance-insights) apply
    here in full: tile order, definitions, the money-position sentence, tax-document counts and freshness.
    **Measure names, not "Revenue"** (CHG-FIN-002): Gross sales, Net revenue, Recognised revenue and Deferred
    revenue never share a label, and the tiles never bind `takings`. **One reporting area, one set of
    numbers** (CHG-FIN-006): this screen reads the same seeded KPIs as the till report (POS-008) and the
    back-office reports for the same scope, period and as-of time, computes no total of its own and shows
    the as-of time on every figure. **The guard is the frontend comparison test TEST-SAME-NUMBERS** (decided
    2 October 2026, DEC-559; `docs/active/block-a-extra-tasks.json`), which compares takings, gross sales,
    net revenue and refunds here with POS-008 and the back office for the same period and scope, and fails
    when they differ.'
