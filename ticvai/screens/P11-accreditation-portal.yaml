# P11 — Accreditation Portal
# BLOCKED on the Accreditation workshop.
# Note the split: this portal is Wave 3, but accreditation VALIDATION appears on the
# employee scanner in Wave 1. That is why this is the urgent one of the four workshops.

platform:
  code: P11
  audience: public
  formFactor: web
  shortName: Accreditation Web
  name: Accreditation Web — Applications
  surface: public
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 8
  app: accreditation-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  deployment:
    target: browser
    distribution: public, served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: applicant device, unmanaged
    networkAssumption: public internet
    releaseCadence: monthly
  reachesOtherPlatforms:
  - screen: SCN-003
    platform: P07
    board: P07 Venue Scanner.dc.html#scn-003
    note: A steward scans an accreditation credential at a service gate — the same handheld, a different
      credential kind
  operator: public
  wireframeBoard: wireframes/P11 Accreditation Web.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: ACC-001
  name: Landing / Programme Overview
  module: Applicant Journey
  wave: 3
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
  states:
    loading: Content loads
    emptyFirstRun: '**A venue that opened this morning.** Nothing here yet, and nothing on this screen
      creates the first one — it is filled by another screen or by a job, and this state names which
      rather than leaving somebody looking for a button that does not exist.


      The screen this app sits on. Everything else is entered from here and returns to it.'
    error: Could not load
  wireframe:
    status: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-001
  openQuestions:
  - Blocked on the Accreditation workshop. 58 requirements, zero MoM coverage. No capability or API
    mapping until the domain is discussed.
  implementation:
    app: accreditation-web
    route: /applicant-journey/landing-programme-overview
    component: apps/accreditation-web/src/routes/applicant-journey/LandingProgrammeOverviewDetail.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    inferred: true
    exitTo:
    - ACC-002
    - ACC-003
    - ACC-004
  notes: States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement.
  purpose: The screen this app sits on. Everything else is entered from here and returns to it.
  density: compact
  requiresModule: accreditation
  statesDerived: true
- id: ACC-002
  name: Registration Form
  module: Applicant Journey
  wave: 3
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
      - kind: dataTable
        derived: true
        impliedBy: listApprovalRequests
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
  states:
    loading: Content loads
    emptyFirstRun: '**A venue that opened this morning.** Nothing here yet, and nothing on this screen
      creates the first one — it is filled by another screen or by a job, and this state names which
      rather than leaving somebody looking for a button that does not exist.


      Find registration form for this venue.'
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `APPROVAL_VIEW` to read approvals; a person without it sees the reason and who to ask, because
      an empty table reads as *there is no data* and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the
      same terminal is the way through.


      **Also reached when `accreditation` is not licensed.** The tenant has not bought this module,
      which is a commercial answer and not a permission one — say which, because the person to ask is
      different.'
    error: Could not load
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from
      here** — an empty list with the filter state hidden elsewhere is a person who thinks the data
      is gone. **Added 25 August with the derived list component**: a screen that lists has to say what
      it shows when the list is empty, and this screen gained the list before it gained the sentence.'
  wireframe:
    status: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-002
  openQuestions:
  - Blocked on the Accreditation workshop. 58 requirements, zero MoM coverage. No capability or API
    mapping until the domain is discussed.
  implementation:
    app: accreditation-web
    route: /applicant-journey/registration-form
    component: apps/accreditation-web/src/routes/applicant-journey/RegistrationForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - ACC-001
    inferred: true
    exitTo:
    - ACC-001
    - ACC-003
    - ACC-004
    - ACC-007
    fromFlows: true
  notes: States derived from the screen pattern on 17 August, not individually considered. Purpose derived
