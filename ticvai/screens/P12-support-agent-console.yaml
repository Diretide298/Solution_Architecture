platform:
  code: P12
  audience: staff
  formFactor: web
  shortName: Venue Support
  name: Venue Support — Agent Console
  surface: staffFacing
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 28
  app: venue-support-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: agent workstation
    networkAssumption: corporate network
    releaseCadence: weekly
  reachesOtherPlatforms:
  - screen: ADM-035
    platform: P09
    board: P09 TICVAI Web.dc.html#adm-035
    note: An agent escalates to platform support
  - screen: PTR-021
    platform: P10
    board: P10 Partner Web.dc.html#ptr-021
    note: A partner query resolved from the partner record
  operator: venue
  wireframeBoard: wireframes/P12 Venue Support.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: SUP-001
  name: Agent Login
  module: Access & Availability
  purpose: Get someone into the app, fast, on a device that may be shared.
  wave: 3
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: searchField
      - kind: dataTable
  states:
    loading: Detail loads
    emptyFirstRun: Not found — it may have been deleted or moved out of scope
    emptyNoResults: '**The filter matched nothing, and the data is still there.** The action widens or
      clears it — distinct from first run, which has nothing to match, and **a screen that shows the same
      panel for both sends somebody looking for data they already filtered out.**'
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `SESSION_FORCE_LOGOUT` to use sessions; a person without it sees the reason and who to ask,
      because an empty table reads as *there is no data* and sends somebody to support with the wrong
      question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the same
      terminal is the way through.'
    error: Could not load. Editing is blocked
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P12 Venue Support.dc.html#sup-001
  capability: C35
  apis:
  - operationId: login
    contract: identity
    purpose: from page inventory
    trigger: onLoad
  - operationId: forceLogout
    contract: identity
    purpose: Supervisor termination of an abandoned session
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: getGuestSession
    contract: identity
    purpose: Read the current guest session
    trigger: onLoad
  - operationId: listActiveSessions
    contract: identity
    purpose: List active sessions
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  - operationId: revokeAllSessions
    contract: identity
    purpose: Revoke every session in scope
    trigger: onAction
  implementation:
    app: venue-support-web
    route: /general/agent-login
    component: apps/venue-support-web/src/routes/general/AgentLoginList.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    inferred: true
    exitTo:
    - SUP-002
    - SUP-003
    - SUP-004
  notes: States derived from the screen pattern on 17 August, not individually considered — sound for
    a list, a form or a money screen, and worth revisiting where this screen is unusual. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement.
  density: compact
  entryState:
    params:
    - name: sessionId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
  requiresModule: core
  statesDerived: true
- id: SUP-002
  name: Agent Dashboard
  module: Overview
  purpose: The screen this app sits on. Everything else is entered from here and returns to it.
  wave: 3
  layout:
    template: dashboard
    regions:
    - name: contentBody
      components:
      - kind: metricTile
      - kind: chart
  states:
    loading: List skeleton; the count renders first
    emptyFirstRun: Nothing matches. Distinguishes an empty filter from an empty dataset
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `CASE_MANAGE`, `CASE_VIEW` to manage cases; a person without it sees the reason and who to
      ask, because an empty table reads as *there is no data* and sends somebody to support with the wrong
      question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the same
      terminal is the way through.


      **Also reached when `marketing` is not licensed.** The tenant has not bought this module, which
      is a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: Could not load
  wireframe:
    status: notStarted
    provenance: designed
    board: wireframes/Dashboards Board.dc.html#sup-002
    generatedFallback: wireframes/P12 Venue Support.dc.html#sup-002
  capability: C32
  apis:
  - operationId: listCases
    contract: marketing-crm
    purpose: from page inventory
    trigger: onLoad
  - operationId: addCaseMessage
    contract: marketing-crm
    purpose: Add a message or internal note
    trigger: onAction
  - operationId: createCase
    contract: marketing-crm
    purpose: Raise a service case
    trigger: onAction
  - operationId: escalateCase
    contract: marketing-crm
    purpose: Escalate a case
    trigger: onAction
  - operationId: getCase
    contract: marketing-crm
    purpose: Read a case with its thread
    trigger: onLoad
  - operationId: reopenCase
    contract: marketing-crm
    purpose: Reopen a resolved case
    trigger: onAction
  - operationId: updateCase
    contract: marketing-crm
    purpose: Assign, reprioritise or resolve a case
    trigger: onAction
  - operationId: listConversations
    contract: marketing-crm
    purpose: The omnichannel inbox
    trigger: onLoad
  - operationId: setAgentAvailability
    contract: marketing-crm
    purpose: An agent goes available, away or offline
    trigger: onAction
  implementation:
    app: venue-support-web
    route: /general/agent-dashboard
    component: apps/venue-support-web/src/routes/general/AgentDashboard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - SUP-001
    inferred: true
    exitTo:
    - SUP-001
    - SUP-003
    - SUP-004
  notes: States derived from the screen pattern on 17 August, not individually considered — sound for
    a list, a form or a money screen, and worth revisiting where this screen is unusual. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Drawn 26 August**
    — `Dashboards Board` frame `sup-002`. **One board draws five dashboards across five platforms** —
    platform admin, partner, support, guest web and cross-tenant health. A dashboard is a shape rather
    than a domain, and the pack recognised that before the package did.
  density: compact
  entryState:
    params:
    - name: caseId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `caseId`.'
  requiresModule: marketing
  statesDerived: true
  boardFrames:
  - Dashboards Board.dc.html#sup-002
