platform:
  code: P15
  formFactor: kiosk
  surface: staffFacing
  runtime: reactWeb
  themes:
  - dark
  directions:
  - ltr
  app: kitchen-display
  appStatus: not scaffolded
  operator: venue
  deployment:
    target: browser
    distribution: served from the cell
    bundleUpdate: on next idle
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: venue-owned, wall-mounted, never moved
    networkAssumption: venue LAN, and it must survive losing it
    releaseCadence: '**Deployed when the kitchen is closed, never during service.** A display that restarts
      mid-service loses the rail a chef is reading.'
  name: Kitchen Display — Pass and Stations
  shortName: Kitchen Display
  audience: staff
  offlineCapable: true
  screenCount: 10
  notes: '**Its own platform, and the placement rule is what put it here.** Three questions decide where
    a board screen rests, and a kitchen display answers all three differently from a back office: it is
    used standing, it **must survive the network going down because the kitchen still has to send food
    out**, and no existing platform does it — P08 had a `Kitchen Display` screen among 143 back-office
    screens, which is a rail buried in a configuration tool.


    **Nobody logs in.** It is on when the kitchen is open and resolves its station from the device assignment,
    which is why every screen here is cold-entry and none of them has a sign-in.


    **Dark theme only.** A kitchen is lit for cooking, not for reading, and a white screen at head height
    in a service window is a light source.


    **Depends on `offline-core`.**  refused the platform without it, and correctly — **an app that queues
    writes without it does not queue them anywhere**, and every bump on this platform is a write that
    has to survive a dropped network.'
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  wireframeBoard: wireframes/P15 Kitchen Display.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-pos
    name: TICVAI POS
    shell: display
    siblings:
    - P04
    note: '**The kitchen display is the till, signed into differently.** Same software, same outlet, same
      orders — what changes is who is looking and what they may do, which is a permission, not an application.'
    decided: 10 September 2026
screens:
- id: KIT-001
  name: Kitchen Operations Command Center
  module: Kitchen
  requiresModule: fnb
  wave: 1
  permission: ORDER_VIEW
  implementation:
    app: kitchen-display
    route: /kitchen/kitchen-operations-command-center
    component: apps/kitchen-display/src/routes/kitchen/KitchenOperationsCommandCenterBoard.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    exitTo:
    - KIT-002
    - KIT-003
    - KIT-004
    - KIT-005
    - KIT-006
    - KIT-007
    - KIT-008
    - KIT-009
    - KIT-010
    transitions:
    - to: KIT-002
      trigger: Kitchen Display System (KDS)
      provenance: flow F83 step 1→2
    - to: KIT-003
      trigger: Order Firing & Course Management
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
    - to: KIT-004
      trigger: Active Order Management & Fulfilment Journey
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
      carries:
      - orderId
    - to: KIT-005
      trigger: Kitchen Station Workload & Dynamic Routing
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
    - to: KIT-006
      trigger: Expeditor & Order Assembly
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
    - to: KIT-007
      trigger: Guest Collection, Buzzer & Digital Notification
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
      carries:
      - orderId
    - to: KIT-008
      trigger: Exceptions, Re-Fire & Unavailable Items
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
    - to: KIT-009
      trigger: SLA, Priority & Service Rules
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
    - to: KIT-010
      trigger: Kitchen Performance, AI & Operational Optimization
      provenance: structural — KIT-001 is P15's home screen and its exits are its launcher
  notes: '**Built 20 August from board 3 of the client F&B design set.** **Board repointed 24 August.**
    This screen pointed at `wireframes/FnB Board 3.dc.html#fnb-3a` — a frame in the client pack, which
    is where the design came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html`
    and `P16 Venue Analytics.dc.html` carry one anchor per screen and nothing referenced either**, so
    both shipped correctly anchored and unreachable. The pack frame is kept in `derivedFrom` because provenance
    is worth more than the wrong pointer. **`wireframe.status` corrected 25 August.** When these screens
    were repointed from the client pack to their own board on 24 August, the status stayed `designed`
    — **which claimed a client had drawn a board this package generated.** `derivedFrom` keeps the pack
    frame, which is where the design came from; `status` describes the file being pointed at, and those
    are different facts. **Drawn 31 August** — `FnB Board 3.dc.html` frame `fnb-3a`. **Matched on frame
    title against screen name, constrained to this board’s platforms.** These packs label by board position
    (`GM-6C`) rather than naming the screen, so the title is the only join — *Kitchen Operations Command
    Center* matched at 1.0. **A cross-platform title match was refused**: `Outlet Management` scored 0.85
    against a partner-portal screen, which is how a mapping goes wrong quietly.


    **DI-077 is superseded** (19 September: the kitchen display is TICVAI''s own, not an integration point;
    design-notes correction fnb-retail KIT-001; CHG-SPO-017). The design-input index entry is the design-inputs
    owner''s to mark.'
  density: touchLarge
  densityReason: '**Bumped by somebody with flour on their hands, read from two metres, in a room where
    nobody is sitting down.** A kitchen display is not a back office at a different width.'
  boardFrames:
  - FnB Board 3.dc.html#fnb-3a
  pattern: commandCentre
  patternReason: 3 independent reads and no read of one record — the screen watches a population rather
    than working one
  purpose: Kitchen Operations Command Center — board 3 of the client F&B design set.
  layout:
    template: dashboard
    regions:
    - name: contentBody
      slot: headline
      components:
      - kind: metricTile
        label: Kitchen tickets
        bindsTo: KitchenTicket
        operation: listKitchenTickets
        permission: ORDER_VIEW
        provenance: contract fnb.yaml GET /kitchen/tickets
      - kind: metricTile
        label: Kitchen stations
        bindsTo: KitchenStation
        operation: listKitchenStations
        permission: PRODUCT_VIEW
        provenance: contract fnb.yaml GET /kitchen/stations
      - kind: metricTile
        label: Fnb orders
        bindsTo: FnbOrder
        operation: listFnbOrders
        permission: ORDER_VIEW
        provenance: contract fnb.yaml GET /fnb-orders
      - kind: dataTable
        label: Every station, at a glance
        bindsTo: KitchenTicket
        columns:
        - KitchenTicket.orderNumber
        - KitchenTicket.tableLabel
        - KitchenTicket.serviceMode
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        operation: listKitchenTickets
        permission: ORDER_VIEW
        provenance: contract fnb.yaml GET /kitchen/tickets
        notes: 'The command centre spans every station (DI-332): load per station, late tickets and the
          oldest wait. No bump here: the rail is KIT-002. **The server''s order, never re-sorted on the
          device** (`listKitchenTickets` orders by priority weights; design-notes correction fnb-retail):
          no "oldest first" and no "promise time" sort of its own.'
      - kind: cardList
        bindsTo: KitchenTicket[]
        notes: '**One ticket per card, ordered by promise time not arrival.** A ticket due in two minutes
          sits above one that arrived first, because a kitchen works to when food is wanted.'
        provenance: carried from the previous definition
      - kind: metricTile
        notes: Depth and oldest ticket age. **Two numbers, glanceable** — anything a chef has to read
          is a number they will not read. The station-load tile is not in the first release (decided 28
          September, audit R277).
        provenance: carried from the previous definition
  states:
    loading: Every station's load, then the tickets, in the server's order.
    error: Could not reach the platform. **The rail is still live from cache** and every bump is queued.
    emptyFirstRun: '**No tickets. The kitchen is clear**, and that is worth saying plainly rather than
      showing a blank rail — a screen that looks broken and a screen that means nothing to do are the
      same picture otherwise.'
    emptyNoResults: Nothing matches the station chips; the kitchen is not empty.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, the screen's permission, and names it. The
      command centre is not tied to one station, so it never says "not assigned to a station".
    offline: '**Amber, and it keeps working.** The kitchen still has to send food out — a display that
      blanks mid-service is worse than one that says it is behind, and every bump journals locally and
      syncs when the network returns.'
  apis:
  - operationId: listKitchenTickets
    contract: fnb
    purpose: Kitchen ticket queue
    trigger: onLoad
  - operationId: listKitchenStations
    contract: fnb
    purpose: List preparation stations and their routing
    trigger: onLoad
  - operationId: listFnbOrders
    contract: fnb
    purpose: List F&B orders
    trigger: onLoad
  entryState:
    params:
    - name: venueId
      from: session
    - name: stationId
      from: session
    coldEntry: '**Cold is the only way in.** Nobody logs into a kitchen display — it is on when the kitchen
      is open, and it resolves its station from the device assignment rather than from a person.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P15 Kitchen Display.dc.html#kit-001
    source: Claude Design F&B pack, 20 August
    note: '**Drawn by Claude Design on `FnB Board 3.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
    derivedFrom: wireframes/FnB Board 3.dc.html#fnb-3a
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
- id: KIT-002
  name: Kitchen Display System (KDS)
  module: Kitchen
  requiresModule: fnb
  wave: 1
  permission: ORDER_VIEW
  implementation:
    app: kitchen-display
    route: /kitchen/kitchen-display-system-kds
    component: apps/kitchen-display/src/routes/kitchen/KitchenDisplaySystemKdsBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - KIT-001
    - KIT-006
    exitTo:
    - KIT-001
    - KIT-003
    inferred: false
    notes: '**Returns to KIT-001.** Stated on 4 September: this screen declared where it is reached from
      and no way to leave, so whoever landed on it was stuck. The return path is the same edge travelled
      the other way, not a guess about the product.'
    transitions:
    - to: KIT-001
      trigger: Kitchen Operations Command Center
      provenance: 'derived — KIT-001 declares entryState.params  and KIT-002 holds none of them. The edge
        carries nothing: KIT-002 is opened from KIT-001, so this edge is the way back and KIT-001 keeps
        its own state'
    - to: KIT-003
      trigger: Order Firing & Course Management
      provenance: flow F83 step 2→3, F88 step 2→3
      carries:
      - ticketId
    - to: EMP-058
      trigger: Starters cleared
      provenance: flow F29 step 4→5
      crossesDevice: true
      back: false
      carries:
      - ticketId
      - visitId
    - to: EMP-059
      trigger: The server comps the delayed dish
      provenance: flow F29 step 6→7
      operation: refireItem
      crossesDevice: true
      back: false
      carries:
      - visitId
    - to: POS-022
      trigger: The guest is called and takes it
      provenance: flow F108 step 5→6
      operation: setKitchenTicketStatus
      crossesDevice: true
      back: false
      carries:
      - orderId
      - ticketId
  notes: '**Fire and hold leave the station display** (2 October 2026, CHG-CLN-006): the pass fires and
    holds courses (DI-407; KIT-003), and flow F88 step 2 no longer calls them here (CHG-SPO-020).


    **Built 20 August from board 3 of the client F&B design set.** **The screen the platform exists for.**
    Bumped, not tapped — a bump bar and a touch target sized for somebody wearing gloves. Nothing on it
    is more than one action deep. **Operations from the 24 August F&B build wired here** — the contract
    grew and the screens had not caught up, which is how 92 operations reached 49% of screens. **Cross-platform
    navigation removed 24 August**: EMP-058. **A till does not navigate to a back office and a guest app
    does not navigate to either** — those are device handovers, and a flow declares them with `crossesDevice`
    rather than a screen pretending there is a link. **Board repointed 24 August.** This screen pointed
    at `wireframes/FnB Board 3.dc.html#fnb-3b` — a frame in the client pack, which is where the design
    came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html` and `P16 Venue Analytics.dc.html`
    carry one anchor per screen and nothing referenced either**, so both shipped correctly anchored and
    unreachable. The pack frame is kept in `derivedFrom` because provenance is worth more than the wrong
    pointer. **Drawn 31 August** — `FnB Board 3.dc.html` frame `fnb-3b`. **Matched on frame title against
    screen name, constrained to this board’s platforms.** These packs label by board position (`GM-6C`)
    rather than naming the screen, so the title is the only join — *Kitchen Display System (KDS)* matched
    at 1.0. **A cross-platform title match was refused**: `Outlet Management` scored 0.85 against a partner-portal
    screen, which is how a mapping goes wrong quietly.'
  density: touchLarge
  densityReason: '**Bumped by somebody with flour on their hands, read from two metres, in a room where
    nobody is sitting down.** A kitchen display is not a back office at a different width.'
  boardFrames:
  - FnB Board 3.dc.html#fnb-3b
  pattern: listDetail
  patternReason: '`listKitchenTickets` reads a population and nothing reads one of them; the detail is
    the row until a `get` exists'
  purpose: Kitchen Display System (KDS) — board 3 of the client F&B design set.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: multiSelect
        label: Course
        operation: listKitchenTickets
        notes: 'Course chips, not a typed number (design-notes correction fnb-retail KIT-002). Sends `?course=`
          to `listKitchenTickets`; only that course''s lines come back. **No station picker**: the display''s
          station comes from its assignment (`KitchenStation.displayWorkstationIds`, set in station setup)
          and the display sends no `stationId` (decided 28 September, audit R277).'
        provenance: contract fnb.yaml GET /kitchen/tickets
      - kind: dataTable
        label: Every kitchen ticket
        bindsTo: KitchenTicket
        columns:
        - KitchenTicket.orderNumber
        - KitchenTicket.tableLabel
        - KitchenTicket.serviceMode
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        operation: listKitchenTickets
        permission: ORDER_VIEW
        provenance: contract fnb.yaml GET /kitchen/tickets
        notes: '**The server''s order, never re-sorted on the device** (`listKitchenTickets` orders by
          priority weights; design-notes correction fnb-retail): no "oldest first" and no "promise time"
          sort of its own.'
      - kind: cardList
        bindsTo: KitchenTicket[]
        notes: '**One ticket per card, ordered by promise time not arrival.** A ticket due in two minutes
          sits above one that arrived first, because a kitchen works to when food is wanted.'
        provenance: carried from the previous definition
      - kind: metricTile
        notes: Depth and oldest ticket age. **Two numbers, glanceable** — anything a chef has to read
          is a number they will not read. The station-load tile is not in the first release (decided 28
          September, audit R277).
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Bump
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected kitchen ticket
        bindsTo: KitchenTicket
        columns:
        - KitchenTicket.orderNumber
        - KitchenTicket.tableLabel
        - KitchenTicket.serviceMode
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        - KitchenTicket.targetReadyAt
        - KitchenTicket.elapsedSeconds
        operation: listKitchenTickets
        permission: ORDER_VIEW
        provenance: contract fnb.yaml GET /kitchen/tickets
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save kitchen ticket status
        operation: setKitchenTicketStatus
        permission: ORDER_MODIFY
        provenance: contract fnb.yaml PUT /kitchen/tickets/{ticketId}/status
      - kind: secondaryButton
        label: Refire item
        operation: refireItem
        permission: ORDER_MODIFY
        provenance: contract fnb.yaml POST /kitchen-tickets/{ticketId}/refire
      - kind: secondaryButton
        label: Recall kitchen ticket
        operation: recallKitchenTicket
        permission: ORDER_MODIFY
        provenance: contract fnb.yaml POST /kitchen-tickets/{ticketId}/recall
      - kind: secondaryButton
        label: Notify server
        operation: notifyServer
        permission: ORDER_MODIFY
        provenance: contract fnb.yaml POST /table-visits/{visitId}/notify-server
  states:
    loading: 'The rail. **The count renders before the tickets.** **The server''s order, never re-sorted
      on the device** (`listKitchenTickets` orders by priority weights; design-notes correction fnb-retail):
      no "oldest first" and no "promise time" sort of its own.'
    error: Could not reach the platform. **The rail is still live from cache** and every bump is queued.
    emptyFirstRun: '**No tickets. The kitchen is clear**, and that is worth saying plainly rather than
      showing a blank rail — a screen that looks broken and a screen that means nothing to do are the
      same picture otherwise.'
    emptyNoResults: Nothing matches this station or course filter. **The rail is not empty** — the filter
      is narrow, and on a kitchen screen that distinction is the difference between calm and panic.
    emptyNoAccess: 'This display is not assigned to a station. **Assignment is a back-office act** — a
      kitchen screen does not choose what it shows. **A principal without `ORDER_VIEW` gets this state
      naming `ORDER_VIEW`**, the screen''s `permission` and the one its read enforces; a button whose
      own `permission` the principal lacks is hidden, and a 403 from an action names that operation''s
      permission. A caller who can see the screen but lacks what an action needs sees that action disabled,
      naming its permission: `ORDER_MODIFY` for `setKitchenTicketStatus`, `refireItem`, `recallKitchenTicket`,
      `notifyServer`.'
    offline: '**Amber, and it keeps working.** The kitchen still has to send food out — a display that
      blanks mid-service is worse than one that says it is behind, and every bump journals locally and
      syncs when the network returns.'
  apis:
  - operationId: listKitchenTickets
    contract: fnb
    purpose: Kitchen ticket queue
    trigger: onLoad
  - operationId: setKitchenTicketStatus
    contract: fnb
    purpose: Advance a kitchen ticket
    trigger: onAction
    invalidates:
    - listKitchenTickets
  - operationId: refireItem
    contract: fnb
    purpose: Make it again
    trigger: onAction
    invalidates:
    - listKitchenTickets
  - operationId: recallKitchenTicket
    contract: fnb
    purpose: Bring back a ticket that was bumped by mistake
    trigger: onAction
    invalidates:
    - listKitchenTickets
  - operationId: notifyServer
    contract: fnb
    purpose: The kitchen calls the server to the pass
    trigger: onAction
    invalidates:
    - listKitchenTickets
  entryState:
    params:
    - name: venueId
      from: session
    - name: stationId
      from: session
    - name: ticketId
      from: KIT-002
    - name: visitId
      from: deepLink
      optional: true
    coldEntry: '**Cold is the only way in.** Nobody logs into a kitchen display — it is on when the kitchen
      is open, and it resolves its station from the device assignment rather than from a person. The table
      the ticket belongs to.'
    preloaded:
    - KitchenTicket.id
    - KitchenTicket.orderId
    - KitchenTicket.orderNumber
    - KitchenTicket.outletId
    - KitchenTicket.tableLabel
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P15 Kitchen Display.dc.html#kit-002
    source: Claude Design F&B pack, 20 August
    note: '**Drawn by Claude Design on `FnB Board 3.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
    derivedFrom: wireframes/FnB Board 3.dc.html#fnb-3b
  apisNote: 'Rebuilt 9 September 2026 from the 7 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formSetKitchenTicketStatus
    component: modal
    trigger: Save kitchen ticket status
    body: '**A gesture on the card** (bump, start, ready); no form, no line ids typed and no time entered:
      the time is the device''s (design-notes correction fnb-retail KIT-002).'
    confirm:
      label: Save kitchen ticket status
      operation: setKitchenTicketStatus
    dismiss:
      label: Cancel
      discards:
      - status
      - recordedAt
      - lineIds
      - stationId
    provenance: contract fnb.yaml PUT /kitchen/tickets/{ticketId}/status
  - id: formRefireItem
    component: modal
    trigger: Refire item
    body: '**Collects what `refireItem` sends before it is called.** Required: `lineId`, `reason`, `recordedAt`.
      Optional: `chargeable`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Refire item
      operation: refireItem
    dismiss:
      label: Cancel
      discards:
      - lineId
      - reason
      - recordedAt
      - chargeable
    provenance: contract fnb.yaml POST /kitchen-tickets/{ticketId}/refire
  - id: formRecallKitchenTicket
    component: modal
    trigger: Recall kitchen ticket
    body: '**Collects what `recallKitchenTicket` sends before it is called.** Required: `recordedAt`.
      Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Recall kitchen ticket
      operation: recallKitchenTicket
    dismiss:
      label: Cancel
      discards:
      - recordedAt
    provenance: contract fnb.yaml POST /kitchen-tickets/{ticketId}/recall
  - id: formNotifyServer
    component: modal
    trigger: Notify server
    body: '**Collects what `notifyServer` sends before it is called.** Nothing in the body is required.
      Optional: `reason`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Notify server
      operation: notifyServer
    dismiss:
      label: Cancel
      discards:
      - reason
    provenance: contract fnb.yaml POST /table-visits/{visitId}/notify-server
