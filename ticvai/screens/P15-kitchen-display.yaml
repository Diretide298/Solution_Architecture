- id: KIT-009
  name: SLA, Priority & Service Rules
  module: Kitchen
  requiresModule: fnb
  wave: 1
  permission: ORDER_MODIFY
  implementation:
    app: kitchen-display
    route: /kitchen/sla-priority-service-rules
    component: apps/kitchen-display/src/routes/kitchen/SlaPriorityServiceRulesBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - KIT-001
    exitTo:
    - KIT-001
    inferred: false
    notes: '**Returns to KIT-001.** Stated on 4 September: this screen declared where it is reached from
      and no way to leave, so whoever landed on it was stuck. The return path is the same edge travelled
      the other way, not a guess about the product.'
    transitions:
    - to: KIT-001
      trigger: Kitchen Operations Command Center
      provenance: 'derived — KIT-001 declares entryState.params  and KIT-009 holds none of them. The edge
        carries nothing: KIT-009 is opened from KIT-001, so this edge is the way back and KIT-001 keeps
        its own state'
  notes: '**Built 20 August from board 3 of the client F&B design set.** **Board repointed 24 August.**
    This screen pointed at `wireframes/FnB Board 3.dc.html#fnb-3j` — a frame in the client pack, which
    is where the design came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html`
    and `P16 Venue Analytics.dc.html` carry one anchor per screen and nothing referenced either**, so
    both shipped correctly anchored and unreachable. The pack frame is kept in `derivedFrom` because provenance
    is worth more than the wrong pointer. **Drawn 31 August** — `FnB Board 3.dc.html` frame `fnb-3j`.
    **Matched on frame title against screen name, constrained to this board’s platforms.** These packs
    label by board position (`GM-6C`) rather than naming the screen, so the title is the only join — *SLA,
    Priority &amp; Service Rules* matched at 1.0. **A cross-platform title match was refused**: `Outlet
    Management` scored 0.85 against a partner-portal screen, which is how a mapping goes wrong quietly.'
  density: touchLarge
  densityReason: '**Bumped by somebody with flour on their hands, read from two metres, in a room where
    nobody is sitting down.** A kitchen display is not a back office at a different width.'
  boardFrames:
  - FnB Board 3.dc.html#fnb-3j
  pattern: configEditor
  patternReason: the screen declares only writes (`prioritiseKitchenTicket`, `setVenueSettings`) and no
    read of a population — it is settings, not a list
  purpose: SLA, Priority & Service Rules — board 3 of the client F&B design set.
  layout:
    template: form
    regions:
    - name: actionBar
      slot: publish
      components: []
    - name: contentBody
      slot: carried
      components:
      - kind: cardList
        bindsTo: KitchenTicket[]
        notes: '**One ticket per card, ordered by promise time not arrival.** A ticket due in two minutes
          sits above one that arrived first, because a kitchen works to when food is wanted.'
        provenance: carried from the previous definition
      - kind: metricTile
        notes: Depth and oldest ticket age. **Two numbers, glanceable** — anything a chef has to read
          is a number they will not read. The station-load tile is not in the first release (decided 28
          September, audit R277).
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Bump
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Targets set now
        bindsTo: KitchenSla
        operation: getKitchenSla
        notes: How long a ticket may sit before it is late, per station; edited with Save. Prioritising
          a single ticket is a live act on the pass (KIT-003), not a rule here (design-notes correction
          fnb-retail KIT-009).
        provenance: contract fnb.yaml GET /outlets/{outletId}/kitchen-sla
      - kind: detailPanel
        label: Course rules
        bindsTo: CourseRules
        operation: getCourseRules
        provenance: contract fnb.yaml GET /outlets/{outletId}/course-rules
  states:
    loading: The rail, oldest ticket first. **The count renders before the tickets** — a kitchen wants
      to know how deep it is before it reads anything.
    error: Could not reach the platform. **The rail is still live from cache** and every bump is queued.
    emptyFirstRun: '**No tickets. The kitchen is clear**, and that is worth saying plainly rather than
      showing a blank rail — a screen that looks broken and a screen that means nothing to do are the
      same picture otherwise.'
    emptyNoAccess: 'This display is not assigned to a station. **Assignment is a back-office act** — a
      kitchen screen does not choose what it shows. Shown when the caller lacks `PRODUCT_VIEW`, which
      `getKitchenSla` requires to show this screen, and names that permission. **Never an empty table**
      — that reads as *there is no data* and sends somebody to support with the wrong question. A caller
      who can see the screen but lacks what an action needs sees that action disabled, naming its permission:
      `PRODUCT_CONFIGURE` for `setKitchenSla`.'
    offline: '**Amber, and it keeps working.** The kitchen still has to send food out — a display that
      blanks mid-service is worse than one that says it is behind, and every bump journals locally and
      syncs when the network returns.'
  apis:
  - operationId: setKitchenSla
    contract: fnb
    purpose: The outlet's kitchen service-time targets
    trigger: onAction
    provenance: decided 29 September, VM close-out (venue management and configuration)
  - operationId: getKitchenSla
    contract: fnb
    purpose: The targets set now, so the rules editor loads what it changes (CHG-CSA-045)
    trigger: onLoad
  - operationId: getCourseRules
    contract: fnb
    purpose: How this outlet courses by default, shown beside the targets (CHG-CSA-045)
    trigger: onLoad
  entryState:
    params:
    - name: venueId
      from: session
    - name: stationId
      from: session
    - name: outletId
      from: session
    coldEntry: '**Cold is the only way in.** Nobody logs into a kitchen display — it is on when the kitchen
      is open, and it resolves its station from the device assignment rather than from a person. **`outletId`
      comes from that assignment too** (confirmed 29 September, readiness close-out): the display is a
      tenancy `Workstation` listed in its station''s `KitchenStation.displayWorkstationIds`, and the station
      carries `outletId`, so `setKitchenSla` (per outlet) needs nothing the session does not already hold,
      as KIT-003 and KIT-008 already take it.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P15 Kitchen Display.dc.html#kit-009
    source: Claude Design F&B pack, 20 August
    note: '**Drawn by Claude Design on `FnB Board 3.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
    derivedFrom: wireframes/FnB Board 3.dc.html#fnb-3j
  apisNote: 'Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  gaps:
  - operation: prioritiseKitchenTicket
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-008): setVenueSettings (the whole venue record, TENANT_CONFIGURE)
      on a kitchen device is a permission leak, and prioritising one ticket is a live act on the pass
      (KIT-003), not a rules setting (R254; design-notes corrections fnb-retail KIT-009).'
    source: contracts/spine/tenancy.yaml#setVenueSettings | R254
  - operation: setVenueSettings
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-008): setVenueSettings (the whole venue record, TENANT_CONFIGURE)
      on a kitchen device is a permission leak, and prioritising one ticket is a live act on the pass
      (KIT-003), not a rules setting (R254; design-notes corrections fnb-retail KIT-009).'
    source: contracts/spine/tenancy.yaml#setVenueSettings | R254
  - operation: null
    why: 'Contract gap recorded 2 October 2026 (CHG-WIR-011): No read of an outlet''s course rules or
      kitchen SLA.'
    source: contracts/satellite/fnb.yaml#setCourseRules | contracts/satellite/fnb.yaml#setKitchenSla
