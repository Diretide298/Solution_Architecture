  states:
    loading: The held orders list.
    error: Could not load. Names which read failed and leaves the held orders untouched.
    emptyFirstRun: No held orders yet. Offers Create order (`createOrder`); distinct from a filter that
      matched nothing.
    emptyNoResults: Nothing matches the filter on venueId, principalId, shiftId, status, createdFrom,
      createdTo and the held orders are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listOrders` requires, and names that
      permission. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.
    offline: Orders held at this terminal are listed. Those held elsewhere are not — resuming another
      till's sale needs the server
    denied: Held sales are listed and cannot be recalled without `sale.resume`. **The list is still shown**,
      because a cashier who cannot see the held sale fetches a supervisor to the wrong screen.
  apis:
  - operationId: listOrders
    contract: orders
    purpose: Held orders at this venue
    trigger: onLoad
  - operationId: resumeOrder
    contract: orders
    purpose: Bring it back, reporting anything that moved
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: applyManualDiscount
    contract: orders
    purpose: Apply a discount a cashier chose
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: createRefund
    contract: orders
    purpose: Refund an order, wholly or in part
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: exchangeOrderLines
    contract: orders
    purpose: Exchange lines for different products or dates
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: getOrder
    contract: orders
    purpose: Read an order
    trigger: onLoad
  - operationId: getOrderStatement
    contract: orders
    purpose: Full financial history of an order
    trigger: onLoad
  - operationId: holdOrder
    contract: orders
    purpose: Park a sale and free the till
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: listOrderRefunds
    contract: orders
    purpose: List refunds against an order
    trigger: onLoad
  - operationId: modifyOrder
    contract: orders
    purpose: Add or remove lines on an existing order
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: reprintOrder
    contract: orders
    purpose: Reprint or resend tickets
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: rescheduleOrder
    contract: orders
    purpose: Move an order to another performance
    trigger: onAction
    invalidates:
    - listOrders
  - operationId: voidOrder
    contract: orders
    purpose: Void an order
    trigger: onAction
    invalidates:
    - listOrders
  entryState:
    params:
    - name: orderId
      from: POS-002
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - OrderSummary.id
    - OrderSummary.orderNumber
    - OrderSummary.status
    - OrderSummary.grossAmount
    - OrderSummary.refundedAmount
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-006
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: partial
      view: Cart 'Hold sale' or Home hot key F2 'Recall held (n)' -> 'Held sales' modal
      differences: Held orders are a modal limited to this terminal, and there are also up to 4 parked
        cart tabs that act as a second hold mechanism. There is no search, and no modify/refund/exchange/reschedule/void
        of held orders, although the YAML attaches 9 overlays.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/pos-006.png
      match: partial
      view: 'Cart ''Hold sale'', then F2 ''Recall held'' -> ''Held sales'' screen (was a modal): parked
        value, every line in full, Recall into sale / Print hold slip / Discard hold'
      differences: 'v2 makes Held sales a screen (it was a modal): held sales, parked value, units held
        and oldest hold, then each hold with every line, Recall into sale, Print hold slip and Discard
        hold, and an empty state (''No held sales on this terminal''). Reached from the cart''s Hold sale
        and F2 Recall held. Still this terminal only, no search (emptyNoResults is not drawn), and no
        modify, refund, exchange or reschedule of a held order, although the definition attaches those
        overlays. Design gap (decided 1 October, POSV2-6): the modify, refund, exchange and reschedule
        overlays stay in the definition; the design must add them to a held sale.'
    derivedFrom: wireframes/reference/Retail Board 3.dc.html
    source: Claude Design Retail pack, 24 August
