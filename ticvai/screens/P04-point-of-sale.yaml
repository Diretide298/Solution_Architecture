  navigation:
    entryFrom:
    - POS-001
    - POS-025
    exitTo:
    - POS-005
    - POS-002
    transitions:
    - to: POS-005
      trigger: Charge
      control: primaryButton#charge
      precondition: cart.lineCount > 0
      guard: payment.take
      carries:
      - discount
      returnsTo: POS-023
      onFailure:
      - when: outOfStock
        to: POS-023#stockConflict
        note: Reserve-on-add means the shortfall is found before payment — `reserveStock` (4025). Offline,
          the sale proceeds on policy and the conflict is raised at sync.
      provenance: board TICVAI POS Terminal · goCheckout (5157) from the `retail` screen
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      carries:
      - orderId
      - promotionId
      provenance: derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId
        and POS-023 holds orderId, promotionId, so an edge into it carries them
    uses:
    - posPrimaryRail
    - posSaleToPayment
  notes: '**Built 24 August.** `RetailService` has 35 operations and F34 walks a retail sale from scan
    to return — **on `POS-002`, which is declared `ticketing`.** A venue licensing retail without ticketing
    had a till it could not open.


    **Offline: the design follows the contract until one rule is chosen** (design-notes correction fnb-retail
    POS-023; CHG-SPO-016): `createRetailSale` is not offline-capable, so the offline state says a retail
    sale needs the link. The question of offline overselling (DI-075 against DI-294) is logged in CHG-SPO-020.'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listMerchandise` reads a population and nothing reads one of them; the detail is the
    row until a `get` exists'
  purpose: A guest buys merchandise at a counter.
  layout:
    template: split
    regions:
