    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: createCashMovement
    contract: shift
    purpose: Record a cash lift or add
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: listCashMovements
    contract: shift
    purpose: Lifts, adds and the opening float
    trigger: onLoad
  - operationId: listDenominations
    contract: shift
    purpose: listDenominations
    trigger: onLoad
  - operationId: withdrawFromDepositBox
