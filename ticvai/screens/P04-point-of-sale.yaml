  notes: 'CF-58, from the 14 August MoM. Not in the delivered mockups. **9 assets operations removed 18
    August (CF-114).** The whole media contract was attached to this screen. **A till adding an item to
    a ticket does not manage a media library** — it reads the asset it needs and nothing else. Same shape
    as CF-87, one level up: that attached sibling operations, this attached a whole contract. **Wired
    24 August from review**: getCart, exchangeOrderLines. **The operations existed and this screen could
    not call them** — reviewers reported them as missing APIs, which is what an unreachable operation
    looks like from a wireframe.'
  density: touchLarge
