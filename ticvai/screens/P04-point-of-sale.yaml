      capture: wireframes/incoming/P04-pos-v2/img/pos-022.png
      match: partial
      view: Left rail 'Queue' -> partner order DLV-8842 'Send to kitchen' (it moves to Preparing; the
        guest status board above shows takeaway and quick-service numbers only, never partner, delivery
        or dine-in orders)
      differences: 'There is still no send-to-kitchen step at the counter: partner and kiosk orders arrive
