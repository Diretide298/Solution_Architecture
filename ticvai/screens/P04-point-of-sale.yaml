      - kind: primaryButton
        label: Sync orders
        operation: syncOrders
        provenance: contract orders.yaml POST /sync/orders
      - kind: secondaryButton
        label: Create order
        operation: createOrder
        provenance: contract orders.yaml POST /orders
      - kind: secondaryButton
        label: Adjust deposit box float
        operation: adjustDepositBoxFloat
        provenance: contract shift.yaml POST /deposit-boxes/{boxId}/adjust-float
      - kind: secondaryButton
        label: Create cash movement
        operation: createCashMovement
