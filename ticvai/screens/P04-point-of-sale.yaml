        - KitchenTicket.coursing
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        - KitchenTicket.prioritisedByPrincipalId
        - KitchenTicket.prioritiseReason
        operation: listKitchenTickets
        provenance: contract fnb.yaml GET /kitchen/tickets
      - kind: metricTile
        notes: Orders ahead, and the oldest. **A cashier quoting a wait needs the number the kitchen is
          actually working to.**
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Collected
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected kitchen ticket
        bindsTo: KitchenTicket
        columns:
        - KitchenTicket.id
        - KitchenTicket.orderId
        - KitchenTicket.orderNumber
        - KitchenTicket.outletId
        - KitchenTicket.tableLabel
        - KitchenTicket.serviceMode
        - KitchenTicket.coursing
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        - KitchenTicket.prioritisedByPrincipalId
        - KitchenTicket.prioritiseReason
        - KitchenTicket.lines
        - KitchenTicket.targetReadyAt
        - KitchenTicket.elapsedSeconds
        operation: listKitchenTickets
        provenance: contract fnb.yaml GET /kitchen/tickets
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create F&B order
        operation: createFnbOrder
        provenance: contract fnb.yaml POST /fnb-orders
      - kind: secondaryButton
        label: Save kitchen ticket status
        operation: setKitchenTicketStatus
        provenance: contract fnb.yaml PUT /kitchen/tickets/{ticketId}/status
      - kind: secondaryButton
        label: Mark order collected
        operation: markOrderCollected
        provenance: contract fnb.yaml POST /orders/{orderId}/collected
  states:
    loading: The send kitchen list.
    error: Could not load. Names which read failed and leaves the send kitchen untouched.
    emptyFirstRun: No send kitchen yet. Offers Create F&B order (`createFnbOrder`); distinct from a filter
      that matched nothing.
    emptyNoResults: Nothing matches the filter on stationId, status and the send kitchen are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listKitchenTickets` requires, and
