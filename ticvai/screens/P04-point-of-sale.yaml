      - kind: secondaryButton
        label: Create retail sale
        operation: createRetailSale
        provenance: contract retail.yaml POST /retail-sales
      - kind: secondaryButton
        label: Lookup retail sale
        operation: lookupRetailSale
        provenance: contract retail.yaml GET /retail-sales/lookup
        notes: '**Scan the receipt barcode, or type the receipt or order number.** The barcode wins, then
          the receipt number, then the order number; `matchedBy` says which was used. The answer is a
          list: one match opens it, several show a pick list, newest first, for the cashier to choose
