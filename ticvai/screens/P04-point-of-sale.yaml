        label: Lookup merchandise
        operation: lookupMerchandise
        provenance: contract retail.yaml GET /merchandise/lookup
        notes: Price and stock are this till's outlet, resolved from the workstation; the till sends no
          `outletId` (only a caller with no workstation does), and an inactive item answers 404 like an
          unknown barcode (decided 28 September, audit R215).
      - kind: secondaryButton
        label: Add cart line
        operation: addCartLine
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Create retail sale
        operation: createRetailSale
        provenance: contract retail.yaml POST /retail-sales
      - kind: secondaryButton
        label: Evaluate promotions
        operation: evaluatePromotions
        provenance: contract promotions.yaml POST /promotions/evaluate
  states:
    loading: The catalogue for this store.
    error: Could not load. **The cached catalogue is still sellable.**
    emptyFirstRun: '**No merchandise published to this outlet.**'
    emptyNoResults: Nothing matches. **A scan that finds nothing is a barcode not in the catalogue** —
      said plainly, because the cashier will otherwise scan it four more times.
    emptyNoAccess: You do not have permission to sell at this store.
    offline: '**A retail sale needs the link** (`createRetailSale` is not offline-capable). The tiles
      stay browsable from the cached catalogue; Charge says to reconnect. (Design-notes correction fnb-retail
      POS-023; the offline-overselling rule is an open question, CHG-SPO-020.)'
    denied: Merchandise scans and prices normally; charging needs `payment.take`. Stock reserved on add
      is released rather than held against a sale that cannot complete.
    stockConflict: The merchandise line went out of stock between scan and charge. The line is flagged
      and the rest of the sale stands.
  apis:
  - operationId: lookupMerchandise
    contract: retail
    purpose: Price and stock check by barcode
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: createRetailSale
    contract: retail
    purpose: Sell merchandise
    trigger: onAction
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Evaluate promotions against a cart
    trigger: onAction
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: cartId
      from: session
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till is
      signed into, not navigated to — and the outlet is a property of where the till is bolted down, not
      something a cashier picks.'
    preloaded:
