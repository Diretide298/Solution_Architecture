        columns:
        - Denomination.id
        - Denomination.currencyCode
        - Denomination.displayName
        - Denomination.kind
        - Denomination.sortOrder
        - Denomination.isActive
        - Denomination.value
        operation: listDenominations
        provenance: contract shift.yaml GET /denominations
      - kind: primaryButton
