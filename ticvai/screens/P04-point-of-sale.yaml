    provenance: contract fnb.yaml POST /fnb-orders/{orderId}/cancel; wiring fix, 2 October 2026
- id: POS-023
  name: Sell — Merchandise
  module: Sell
  requiresModule: retail
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/sell---merchandise
    component: apps/venue-pos/src/routes/sell/SellMerchandiseBoard.tsx
