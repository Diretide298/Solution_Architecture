  notes: '**Added 20 August from the client design board.** The operations existed and no screen called
    them.


    `id` and `recordedAt` of a no-sale are set by the till (design-notes correction ticketing-guest POS-014;
    CHG-SPO-015). The approval modal has a reject path: the supervisor declines with a reason, and the
    drawer stays shut.'
  density: touchLarge
  pattern: configEditor
  patternReason: the screen declares only writes (`recordNoSale`, `voidOrder`, `applyManualDiscount`)
    and no read of a population — it is settings, not a list
  purpose: Sales Exceptions, Controls & Operational Actions — from the client design board, 20 August.
  layout:
    template: form
    regions:
    - name: actionBar
      slot: publish
      components:
      - kind: primaryButton
        label: Record no sale
        operation: recordNoSale
        provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
      - kind: destructiveButton
        label: Void order
        operation: voidOrder
        provenance: contract orders.yaml POST /orders/{orderId}/voids
      - kind: secondaryButton
        label: Apply manual discount
        operation: applyManualDiscount
        provenance: contract orders.yaml POST /orders/{orderId}/discounts
    - name: contentBody
      slot: carried
      components:
      - kind: primaryButton
        label: Confirm
        provenance: carried from the previous definition
      - kind: selectField
        label: Reason
        operation: recordNoSale
        notes: Required.
        provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
      - kind: textField
        label: Note
        operation: recordNoSale
        provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
  overlays:
  - id: confirmVoidOrder
    component: confirmDialog
    trigger: Void order
    body: '**Names what `voidOrder` changes and what it leaves alone**, in the consequence rather than
      the verb. A sales exceptions controls this affects should be identified in the dialog, not just
      counted. **Collects what `voidOrder` sends before it is called.** Required: `id`, `reason`, `recordedAt`.
      `reason` is picked from the void reason list (guestChangedMind, enteredInError, itemUnavailable,
      qualityIssue, duplicate, other); **`note` is required when the reason is other**, refused 400 without
      it (decided 28 September, audit R125 (4), R222).'
    provenance: client-verified
    confirm:
      label: Void
      operation: voidOrder
      carries:
      - orderId
      - reason
    dismiss:
      label: Keep the sale
      discards:
      - reason
  - id: formApplyManualDiscount
    component: modal
    trigger: Apply manual discount
    body: '**Collects what `applyManualDiscount` sends before it is called.** Required: `id`, `reason`,
      `recordedAt`. Optional: `lineId`, `amount`, `percentage`, `reasonCode`, `approverPrincipalId`. Dismissing
      sends nothing; the screen behind is unchanged.'
    bindsTo: ManualDiscountRequest
    confirm:
      label: Apply manual discount
      operation: applyManualDiscount
    dismiss:
      label: Cancel
      discards:
      - id
      - reason
      - recordedAt
      - lineId
      - amount
      - percentage
      - reasonCode
      - approverPrincipalId
    provenance: client-verified
  states:
    loading: The saved sales exceptions controls.
    error: Could not load. Names which read failed and leaves the sales exceptions controls untouched.
    emptyFirstRun: No sales exceptions controls configured. The form opens empty and `recordNoSale` saves
      the first one; it says what the platform does in the meantime.
    emptyNoAccess: Shown when the caller lacks `CASH_NO_SALE`, which `recordNoSale` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Working from the local journal.** The till keeps taking money; this reconciles on sync.'
    approvalRejected: The supervisor declined the no-sale or void; the drawer stays shut and the reason
