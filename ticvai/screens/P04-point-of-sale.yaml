        provenance: contract fnb.yaml PATCH /table-visits/{visitId}
      - kind: secondaryButton
        label: Change server
        operation: transferTableVisit
        notes: Hands the check to another server; the transfer is recorded (DEC-068; CHG-CSA-013).
