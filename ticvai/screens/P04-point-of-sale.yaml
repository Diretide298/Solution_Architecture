      - kind: numberField
        label: Counted by denomination
        notes: '**Blind count.** Count by denomination; no expected total, no running variance and no
          takings figure on this screen at any step (CHG-FIN-003). A reason (till error, unrecorded refund,
          miscount, other) and a note are offered with every count, not only after a variance (DI-803).'
        provenance: carried from the previous definition
      - kind: banner
        bindsTo: ShiftCountReceipt.outcome
        notes: 'After submission: "Shift closed" within the venue threshold, or "Your count is with your
          supervisor" beyond it; never the amount and never over or short (CHG-FIN-003). The supervisor
          sees the variance only after their own PIN step-up, in the acceptance form.'
        provenance: carried from the previous definition
      - kind: timeline
        notes: No-sale count, manual discounts, voids — the numbers a supervisor reviews
        provenance: carried from the previous definition
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected cash movement
        bindsTo: CashMovement
        columns:
        - CashMovement.kind
        - CashMovement.amount
        - CashMovement.denominations
        - CashMovement.reference
        - CashMovement.reason
        - CashMovement.recordedAt
        - CashMovement.withdrawalReason
        - CashMovement.syncedAt
        operation: listCashMovements
        provenance: contract shift.yaml GET /shifts/{shiftId}/cash-movements
      - kind: detailPanel
        label: The shift
        bindsTo: Shift
        columns:
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        - Shift.openingFloat
        operation: getCurrentShift
        provenance: contract shift.yaml GET /shifts/current
      - kind: dataTable
        label: What was counted, note by note
        bindsTo: CashCountLine
        operation: getShiftCountLines
        permission: OVERSHORT_ACCEPT
        notes: 'For the supervisor reviewing an "Under review" shift: each count (and each recount) by
          denomination, counted quantity and value only. Never shown to the cashier on this screen, although
          the read itself carries no expected figure (CHG-CSP-014).'
        provenance: contract shift.yaml GET /shifts/{shiftId}/count-lines
    - name: actionBar
      slot: decision
      components:
      - kind: destructiveButton
        label: Close shift
        operation: submitShiftCount
        provenance: contract shift.yaml POST /shifts/{shiftId}/close
      - kind: secondaryButton
        label: Accept shift variance
        operation: acceptShiftVariance
        provenance: contract shift.yaml POST /shifts/{shiftId}/accept-variance
        permission: OVERSHORT_ACCEPT
        notes: Supervisor only, after their PIN step-up on this till; shows counted, expected and variance
          to them (CHG-FIN-003).
      - kind: primaryButton
        label: Submit count
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Ask for a recount
        operation: rejectShiftVariance
        permission: OVERSHORT_ACCEPT
        notes: 'Supervisor only, PIN step-up: rejects the variance with a reason the cashier reads (never
          the amount). The shift stays pendingVariance with the recount requested; the cashier recounts
          blind at any till and resubmits with `submitShiftCount` (DEC-175; DI-804; CHG-CSP-013).'
        provenance: contract shift.yaml POST /shifts/{shiftId}/reject-variance
      - kind: secondaryButton
        label: Close shift for the cashier
        operation: closeShift
        permission: SHIFT_CLOSE_OTHER
        notes: 'Supervisor only, after their own PIN on this till (any till of the venue): closes the
          cashier''s shift, or resolves one that is "Under review". The supervisor sees counted, expected
          and variance; the cashier never does (decided 2 October 2026, Chinmay, pre-apply round: "closeShift
          is declared on POS-007 (supervisor PIN, any till) and in the daily cash reconciliation"; DEC-059;
          CHG-CSP-012; CHG-SPO-021).'
        provenance: contract shift.yaml POST /shifts/{shiftId}/close
  overlays:
  - id: confirmCloseShift
    component: confirmDialog
    trigger: Close shift
    body: '**Collects what `submitShiftCount` sends.** Required: `countedCash` (by denomination), `recordedAt`.
      Optional: `cashierReason`, `notes`, `nonCashDeclared`, `releaseHeldLeases`. Says "Your count is
      final once submitted" and shows no expected figure (CHG-FIN-003).'
    provenance: client-verified
    confirm:
      label: Submit count
      operation: submitShiftCount
      carries:
      - shiftId
      - countedFloat
      - cashierReason
    dismiss:
      label: Not yet
      discards: []
    bindsTo: CloseShiftRequest
  - id: formAcceptShiftVariance
    component: modal
    trigger: Accept shift variance
    body: '**Collects what `acceptShiftVariance` sends before it is called.** Required: `reason`. Shown
      in the pendingVariance state; the supervisor confirms with their PIN (step-up) on this till (audit
      R080 (e)). Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Accept shift variance
      operation: acceptShiftVariance
    dismiss:
      label: Cancel
      discards:
      - reason
    provenance: client-verified
  - id: formRejectShiftVariance
    component: modal
    trigger: Ask for a recount
    body: '**Collects what `rejectShiftVariance` sends.** Required: `reason` (at least 3 characters),
      shown to the cashier; never the amount. The supervisor confirms with their PIN (step-up). Dismissing
      sends nothing.'
    confirm:
      label: Ask for a recount
      operation: rejectShiftVariance
    dismiss:
      label: Cancel
      discards:
      - reason
    provenance: contract shift.yaml POST /shifts/{shiftId}/reject-variance
  - id: formCloseShiftForCashier
    component: modal
    trigger: Close shift for the cashier
    body: '**The supervisor''s close.** Asks for the supervisor''s PIN (step-up on this device), then
      shows counted, expected and variance to the supervisor only, and closes the shift. The cashier''s
      own count stays on `submitShiftCount`; this is the close on their behalf (decided 2 October 2026,
      Chinmay; CHG-CSP-012). Dismissing sends nothing.'
    confirm:
      label: Close shift
      operation: closeShift
    dismiss:
      label: Cancel
      discards: []
    provenance: contract shift.yaml POST /shifts/{shiftId}/close
  states:
    loading: The close shift list.
    error: Could not load. Names which read failed and leaves the close shift untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: 'Never shown: `listCashMovements` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: Shown when the caller lacks `SHIFT_OPEN`, which `getCurrentShift` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: Cannot close. Closing requires the server total, and a locally computed variance is not a
      variance
    denied: '`acceptShiftVariance` was refused: the caller lacks OVERSHORT_ACCEPT at this venue, or is
      the cashier whose shift it is. The shift stays `pendingVariance` against the same count, and a supervisor
      accepts it on this till (audit R080 (e)).'
    pendingVariance: '**Counted; "Under review".** `submitShiftCount` answered `referredToSupervisor`.
      The cashier sees "Under review" and no amount, **and may sign out**: the shift waits, and the next
      cashier opens a shift on this till meanwhile (it never blocks the next one). A supervisor resolves
      it with their PIN on this till or any till of the venue (accept the variance, ask for a recount,
      or close it with `closeShift`), or in the daily cash reconciliation, which lists every shift of
      the day and resolves them one by one (decided 2 October 2026, Chinmay, batch 3 #1 and pre-apply
      round; DEC-059, DEC-173; CHG-CSP-012; CHG-FIN-003; audit R080 (e)).'
    recountRequested: '**"Recount requested".** A supervisor rejected the variance (`rejectShiftVariance`)
      with a reason the cashier reads; the shift is still pendingVariance with `recountRequestedAt` set.
      The cashier counts the drawer blind again, at any till of the venue, and submits with `submitShiftCount`;
      a recount within the threshold closes the shift (DEC-175; DI-804; CHG-CSP-013).'
  apis:
  - operationId: submitShiftCount
    contract: shift
    purpose: Submit the blind count; the receipt says closed, with the supervisor or awaiting close approval,
      and never the expected cash or the variance (CHG-FIN-003)
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: acceptShiftVariance
    contract: shift
    purpose: Supervisor accepts a variance above threshold on the till, after closeShift left the shift
      pendingVariance (OVERSHORT_ACCEPT, PIN step-up; audit R080 (e))
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: getCurrentShift
    contract: shift
    purpose: The open or suspended shift on the session's workstation
    trigger: onLoad
  - operationId: listCashMovements
    contract: shift
    purpose: Lifts, adds and the opening float
    trigger: onLoad
  - operationId: listDenominations
    contract: shift
    purpose: listDenominations
    trigger: onLoad
  - operationId: rejectShiftVariance
    contract: shift
    purpose: A supervisor sends a counted shift back for a recount, with a reason and their PIN; the shift
      stays pendingVariance (DEC-175; CHG-CSP-013)
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: getShiftCountLines
    contract: shift
    purpose: The denominations the cashier counted, line by line, for the supervisor reviewing the shift;
      counted values only, never the expected figure (CHG-CSP-014)
    trigger: onAction
  - operationId: closeShift
    contract: shift
    trigger: onAction
    purpose: A supervisor closes a cashier's shift on this till or any till of the venue, with their own
      PIN; counted, expected and variance go to the supervisor only (decided 2 October 2026, Chinmay,
      pre-apply round; DEC-059; CHG-CSP-012, CHG-SPO-021)
    invalidates:
    - listCashMovements
  entryState:
    params:
    - name: shiftId
      from: session
    - name: boxId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case. The deposit box allocated
      to this till for the shift. A sale opened from the transaction list.
    preloaded:
    - CashMovement.id
    - CashMovement.kind
    - CashMovement.amount
    - CashMovement.denominations
    - CashMovement.reference
