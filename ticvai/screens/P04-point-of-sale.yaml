  overlays:
  - id: formOpenShift
    component: modal
    trigger: Open shift
    body: '**Collects what `openShift` sends before it is called.** Required: `workstationId`, `openingFloat`.
      Optional: `depositBoxCode`, `bagNumber`, `recordedAt`. Dismissing sends nothing; the screen behind
      is unchanged.'
    bindsTo: OpenShiftRequest
    confirm:
      label: Open shift
      operation: openShift
    dismiss:
      label: Cancel
      discards:
      - workstationId
      - openingFloat
      - depositBoxCode
      - bagNumber
      - recordedAt
    provenance: client-verified
  - id: formApproveShiftOpen
    component: modal
    trigger: Approve shift open
    body: '**Collects what `approveShiftOpen` sends before it is called.** Required: `reason`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Approve shift open
      operation: approveShiftOpen
    dismiss:
      label: Cancel
