  states:
    loading: The sell ticket catalogue list.
    error: Could not load. Names which read failed and leaves the sell ticket catalogue untouched.
    emptyFirstRun: No sell ticket catalogue yet. Offers Create order (`createOrder`); distinct from a
      filter that matched nothing.
    emptyNoResults: Nothing matches the filter on venueId, kind, isSellable and the sell ticket catalogue
      are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listProducts` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: Served from the local catalogue bundle (ADR-0013). One read path, always local — the terminal
      does not know whether it has a network.
    denied: The catalogue reads normally and **Charge is refused** without `payment.take`. The cart is
      held, not cleared, so a permitted operator can complete the same sale.
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: Catalogue
    trigger: onLoad
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Live cart pricing
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: holdOrder
    contract: orders
    purpose: Park the sale
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: applyManualDiscount
    contract: orders
    purpose: Cashier discount with a reason
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: analysePromotionConflicts
    contract: promotions
    purpose: Analyse stacking against live promotions
    trigger: onAction
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: createRefund
    contract: orders
    purpose: Refund an order, wholly or in part
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: exchangeOrderLines
    contract: orders
    purpose: Exchange lines for different products or dates
    trigger: onAction
    invalidates:
    - listProducts
  - operationId: getOrder
    contract: orders
    purpose: Read an order
    trigger: onAction
  - operationId: getOrderStatement
    contract: orders
    purpose: Full financial history of an order
