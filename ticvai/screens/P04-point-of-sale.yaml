        notes: Ends "Table closed" (the contract's needsClearing) and frees the table (DI-336; CHG-CSA-012).
        provenance: contract fnb.yaml POST /tables/{tableId}/clear
    - name: actionBar
      components:
      - kind: secondaryButton
        label: Bill requested
        operation: requestBill
        provenance: contract fnb.yaml POST /table-visits/{visitId}/request-bill; wiring fix, 2 October
          2026
      - kind: secondaryButton
        label: Split bill
        operation: splitBill
        provenance: contract fnb.yaml POST /table-visits/{visitId}/bill/split; wiring fix, 2 October 2026
      - kind: secondaryButton
        label: Change covers
