- id: POS-021
  name: Sell — Food & Drink
  module: Sell
  requiresModule: fnb
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/sell---food-and-drink
    component: apps/venue-pos/src/routes/sell/SellFoodDrinkBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    - POS-025
    - POS-028
    exitTo:
    - POS-005
    - POS-002
    - POS-022
    transitions:
    - to: POS-005
      trigger: Charge
      control: primaryButton#charge
      precondition: cart.lineCount > 0
      guard: payment.take
      carries:
      - discount
      returnsTo: POS-021
      provenance: board TICVAI POS Terminal · goCheckout (5157) from the `fnb` screen
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      carries:
      - promotionId
      provenance: derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId
        and POS-021 holds promotionId, so an edge into it carries them
    - to: POS-022
      trigger: The order goes to the pass before the guest pays
      provenance: flow F108 step 2→3
      operation: evaluatePromotions
    uses:
    - posPrimaryRail
    - posSaleToPayment
  notes: '**Built 24 August. P04 had no F&B screens at all** — a venue licensing `fnb` and running a coffee
    counter had a kitchen display that receives tickets, a back office that configures the menu, and **no
    way to take the order.**


    **The client pack has the same gap.** Six F&B boards: board 3 is the kitchen, board 4 is table service,
    and none is a counter till — so the placement on 20 August was faithful to a pack that never drew
    it.


    **Outlet decisions of 2 October** (Chinmay; CHG-SPO-004): payment timing is an outlet setting, send
    first or pay first (DEC-064, refining audit R261 per outlet); a dish can carry a daily count that
    sells it out at zero (DEC-194); and F&B owns its prices in its own catalogue (DEC-034), so the till
    prices a dish from the guest menu, never from the ticketing catalogue.'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listMenus` reads the population and `getGuestMenu` reads one of them — list, select,
    act'
  purpose: A guest orders food at a counter and pays.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        bindsTo: MenuItem[]
        label: Menu
        notes: '**Sections in the order the outlet set them, not alphabetical.** A menu board that sorts
          by name puts Desserts above Mains forever. **Daily counts** (DEC-194; CHG-CSA-017): a dish with
          a count shows what is left ("6 left", `MenuItem.remainingCount`) and goes sold out by itself
          at zero. **Prices are F&B''s own**: `MenuItem.price`, set per outlet in the F&B catalogue, never
          the central catalogue variant (DEC-034; CHG-CSA-009).'
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Modifiers
        notes: '**A modifier group is attached to the item, not chosen per sale.** *How would you like
          that cooked* is one group on nine steaks — CF-160.'
        provenance: carried from the previous definition
      - kind: dataTable
        label: Basket
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Pay
        provenance: carried from the previous definition
        notes: '**Payment timing is the outlet''s setting** (decided 2 October 2026, Chinmay, batch 1,
          POS-021: "Two configurations: one takes the bill first, the other sends first and charges after";
          DEC-064; CHG-CSP-004, CHG-CSA-010). Send first (the default, audit R261): Send to kitchen, then
          Charge. Pay first: Charge, and the order reaches the kitchen only once paid. The button order
          and labels follow `Outlet.paymentTiming`; the header never says "kitchen fires on payment" on
          a send-first outlet.'
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The guest menu
        bindsTo: GuestMenu
        columns:
        - GuestMenu.outletId
        - GuestMenu.menuId
        - GuestMenu.name
        - GuestMenu.inForceUntil
        - GuestMenu.currency
        - GuestMenu.currencyScale
        - GuestMenu.sections
        operation: getGuestMenu
        provenance: contract fnb.yaml GET /outlets/{outletId}/guest-menu
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add cart line
        operation: addCartLine
        provenance: contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Evaluate promotions
        operation: evaluatePromotions
        provenance: contract promotions.yaml POST /promotions/evaluate
        notes: Automatic on every cart change (DI-102); drawn as the basket's promotion line, never a
          button.
      - kind: secondaryButton
        label: Save item availability
        operation: setItemAvailability
        provenance: contract fnb.yaml PUT /menu-items/{itemId}/availability
  states:
    loading: The menu board, sections in the order the outlet set them.
    error: Could not load. **The last published menu is still on the device** — a till that stops selling
      because a panel failed is worse than a stale panel.
    emptyFirstRun: '**No menu published for this outlet.** Names the back-office screen that publishes
      one rather than showing an empty board.'
    emptyNoResults: Nothing matches this section.
    emptyNoAccess: You do not have permission to sell at this outlet.
    offline: '**Selling continues from the cached menu.** 86 changes made while offline arrive on sync,
      which is why an item can be sold that the kitchen has just marked unavailable — the kitchen refuses
      it and the guest is refunded at the counter.'
    denied: Ordering is refused without `payment.take`. The kitchen is not fired, so nothing is cooked
      against a sale that cannot be paid for.
    soldOutByCount: A dish whose daily count reached zero shows Sold out and cannot be added; the kitchen
      or the back office sets tomorrow's count (DEC-194; CHG-CSA-017).
  apis:
  - operationId: getGuestMenu
    contract: fnb
    purpose: The menu a guest sees
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Evaluate promotions against a cart
    trigger: onAction
  - operationId: setItemAvailability
    contract: fnb
    purpose: Mark an item available or eighty-sixed
    trigger: onAction
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: cartId
      from: session
    - name: itemId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till is
      signed into, not navigated to — and the outlet is a property of where the till is bolted down, not
      something a cashier picks.'
    preloaded:
    - Menu.id
    - Menu.code
    - Menu.name
    - Menu.outletId
    - Menu.availability
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-021
