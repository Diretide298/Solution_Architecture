  overlays:
  - id: confirmCloseShift
    component: confirmDialog
    trigger: Close shift
    body: '**Names what `closeShift` changes and what it leaves alone**, in the consequence rather than
      the verb. A begin shift this affects should be identified in the dialog, not just counted. **Collects
      what `closeShift` sends before it is called.** Required: `countedCash`, `recordedAt`. Optional:
      `nonCashDeclared`, `notes`, `releaseHeldLeases`.'
    provenance: client-verified
    confirm:
      label: Close the shift
      operation: closeShift
      carries: &id003
      - shiftId
      - countedFloat
      - varianceReason
    dismiss:
      label: Not yet
      discards: &id004 []
    bindsTo: CloseShiftRequest
  - id: confirmSuspendShift
    component: confirmDialog
    trigger: Suspend shift
    body: '**Names what `suspendShift` changes and what it leaves alone**, in the consequence rather than
      the verb. A begin shift this affects should be identified in the dialog, not just counted. **Collects
      what `suspendShift` sends before it is called.** Required: `recordedAt`. Optional: `reason`.'
    provenance: client-verified
    confirm:
      label: Suspend
      operation: suspendShift
      carries: &id005
      - shiftId
    dismiss:
      label: Cancel
      discards: &id006 []
  - id: formOpenShift
    component: modal
    trigger: Open shift
    body: '**Collects what `openShift` sends before it is called.** Required: `workstationId`, `openingFloat`.
      Optional: `depositBoxCode`, `bagNumber`, `recordedAt`. Dismissing sends nothing; the screen behind
      is unchanged.'
    bindsTo: OpenShiftRequest
