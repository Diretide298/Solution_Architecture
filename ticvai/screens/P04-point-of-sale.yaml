  - id: formCreateCashMovement
    component: modal
    trigger: Create cash movement
    body: '**Collects what `createCashMovement` sends before it is called.** Required: `id`, `kind`, `amount`,
      `recordedAt`. Optional: `denominations`, `reference`, `reason`. Dismissing sends nothing; the screen
