  overlays:
  - id: confirmVoidOrder
    component: confirmDialog
    trigger: Void order
    body: '**Names what `voidOrder` changes and what it leaves alone**, in the consequence rather than
      the verb. A sell ticket catalogue this affects should be identified in the dialog, not just counted.
      **Collects what `voidOrder` sends before it is called.** Required: `id`, `reason`, `recordedAt`.
      `reason` is picked from the void reason list (guestChangedMind, enteredInError, itemUnavailable,
      qualityIssue, duplicate, other); **`note` is required when the reason is other**, refused 400 without
      it (decided 28 September, audit R125 (4), R222).'
    provenance: client-verified
    confirm:
      label: Void
      operation: voidOrder
      carries: &id001
      - orderId
      - reason
    dismiss:
      label: Keep the sale
      discards: &id002
      - reason
  - id: drawerTicketDetail
    component: drawer
    trigger: Select a ticket
    bindsTo: Product
    body: '**What this ticket includes and what it does not.** Inclusions, and the rules and restrictions
      that apply — the things a cashier is asked at the counter and currently has to know. The catalogue
      stays behind it: nothing is lost by closing this, because nothing has been added to the cart yet.'
    provenance: client-verified
    confirm:
      label: Continue
      to: POS-002
      carries:
      - productId
      - variantQty
    dismiss:
      label: Close
      to: POS-002
      discards:
      - variantQty
  - id: drawerDateAndSession
    component: drawer
    trigger: Continue from ticket detail
    bindsTo: Availability
    body: '**Date, then performance, for the flows that need them** (a session is a Performance, audit
      R165). An admission ticket skips this and goes to quantity; a dated ticket asks the date; a timed
      ticket asks the date and then the time. Which of the three is not a property of this drawer — it
      is the product type, and the drawer shows the steps that type requires.'
    provenance: client-verified
    confirm:
      label: Continue
      to: POS-002
      carries:
      - productId
      - visitDate
      - sessionTime
    dismiss:
      label: Close
      to: POS-002
      carries:
      - productId
      discards:
      - visitDate
      - sessionTime
