    trigger: onAction
    invalidates:
    - getTableMap
  - operationId: transferTableVisit
    contract: fnb
    purpose: 'Change server: hand the check to another server, recorded so tips and sales follow (DEC-068;
      CHG-CSA-013)'
    trigger: onAction
    invalidates:
    - getTableMap
  - operationId: createTableReservationForGuest
    contract: fnb
    purpose: 'Book a table for the guest at the till: a sitting, party size, the table held, seating preference
