      provenance: structural — POS-025 is P04's home screen and its exits are its launcher
    - to: POS-028
      trigger: Table Service
      provenance: structural — POS-025 is P04's home screen and its exits are its launcher
    - to: POS-029
      trigger: Order Queue
      provenance: structural — POS-025 is P04's home screen and its exits are its launcher
    - to: POS-026
      trigger: Receipt & Reprint
      provenance: structural — POS-025 is P04's home screen and its exits are its launcher
    - to: POS-007
      trigger: Close Shift
      provenance: structural — POS-025 is P04's home screen and its exits are its launcher
    - to: POS-030
      trigger: Sales journal (F7, or a KPI tile)
      provenance: 'decided 1 October 2026 (POS v2 decisions, POSV2-1): v2''s F7 Sales journal and the
        KPI tiles open the journal, on this terminal and today'
    - to: POS-031
      trigger: Reservations (F5)
      provenance: 'decided 1 October 2026 (POSV2-2): v2''s F5 Reservations and the Bookings rail item'
  notes: '**P04 had no entry surface.** Eleven of its screens declared `entryFrom: POS-001`, which is
    the sign-in — so the model said a cashier signs in and is somehow already inside a sale. The prototype''s
    `home` is the missing step, and it is what makes the rail in `posPrimaryRail` mean something: **twelve
    screens named that set and shared no destination**, because the destination they share is this one.'
  density: touchLarge
  pattern: dashboard
  patternReason: '`getCurrentShift` reads the one thing that is true right now and the tiles read counts
    — a dashboard, not a list'
  purpose: The surface a cashier lands on after opening a shift, and the one they return to between sales.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: summary
      components:
      - kind: metricTile
        label: Shift takings so far
        bindsTo: Shift
      - kind: metricTile
        label: Open holds
        bindsTo: Order
      - kind: metricTile
        label: Queue waiting
        bindsTo: Queue
      - kind: cardList
        label: Sale boards — tickets, F&B, retail
        bindsTo: SaleBoard
      - kind: cardList
        label: Peripheral health
        bindsTo: DeviceBinding
      - kind: banner
        label: Alerts for this workstation
        bindsTo: Alert
  states:
    loading: The saved till home.
    error: Could not load. Names which read failed and leaves the till home untouched.
    emptyFirstRun: No till home yet. Carries the create action and says what the till does in the meantime.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**Working from the local journal.** The tiles show what this workstation knows; the queue
      and alerts are last-known and say so.'
    denied: Names the permission the operator does not hold and who at this venue does. **Never a disabled
      tile with no explanation** — that reads as a broken till.
  apis:
  - operationId: getCurrentShift
    contract: shift
    purpose: Whose shift this is and when it opened
    trigger: onLoad
  - operationId: listSaleBoards
    contract: tenancy
    purpose: Which sale boards this workstation may open
    trigger: onLoad
  - operationId: getWorkstationHealth
    contract: tenancy
    purpose: Whether the till and its peripherals are well
    trigger: onLoad
  - operationId: listAlerts
    contract: reporting
    purpose: Anything the cashier must see before selling
    trigger: onLoad
  - operationId: listDevices
    contract: tenancy
    purpose: The peripherals bound to this workstation
    trigger: onLoad
  entryState:
    params:
    - name: workstationId
      from: session
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
      not navigated to.'
  requiresModule: core
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-025
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: exact
      view: After 'Open shift & start selling', or left rail 'Home' (startScreen 'home')
      differences: Adds hot keys, a venue highlight card and a recent-transactions feed that jumps to
        Refunds. The alerts and device health that the YAML binds to (listAlerts, listDevices) sit in
        the top-bar bell and device icon rather than on the home surface.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/pos-025.jpg
      match: exact
      view: 'After ''Open shift & start selling'', or left rail ''Home'': the F1-F7 function bar replaces
        the home hot keys; the KPI tiles drill into the Sales journal'
      differences: 'v2: the F1-F7 function bar (Scan ticket, Recall held, Open drawer, Reprint receipt,
        Reservations, Encode tickets · inactive, Sales journal) replaces the home hot keys and stays on
        every screen; the KPI tiles (shift sales, average basket, open checks, queue now) drill into the
        Sales journal; the launcher, the recent transactions with ''Open sales journal'', and the venue
        highlight stay. The ''On shift'' pill opens a Shift management panel (clock out, start break,
        shift statistics, the cash drawer, End shift & declare cash). Alerts and device health stay in
        the top bar. Decided 1 October: the Sales journal (F7 and the KPI tiles) is POS-030 (POSV2-1)
        and Reservations (F5) is POS-031 (POSV2-2). Design corrections: Encode tickets (F6) is not built,
        since nothing is encoded before payment (POSV2-2); the Shift management panel drops ''Expected
        in drawer'', the blind count standing (POSV2-3, audit R080), and its Clock out and breaks call
        recordAttendance, on POS-009 Staff Roster (POSV2-3).'
