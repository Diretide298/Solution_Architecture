    confirm:
      label: Create cash movement
      operation: createCashMovement
    dismiss:
      label: Cancel
      discards:
      - id
      - kind
      - amount
      - recordedAt
      - denominations
      - reference
      - reason
    provenance: client-verified
  states:
    loading: The mobile pos event list.
    error: Could not load. Names which read failed and leaves the mobile pos event untouched.
    emptyFirstRun: No mobile pos event yet. Offers Create order (`createOrder`).
    emptyNoResults: 'Never shown: `listCashMovements` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: Shown when the caller lacks `ACCESS_VALIDATE`, which `getOfflinePackage` requires,
      and names that permission. **Never an empty table** — that reads as *there is no data* and sends
      somebody to support with the wrong question.
    offline: '**Working from the local journal.** The till keeps taking money; this reconciles on sync.'
    denied: The sync queue is readable by anyone on shift. Resolving a conflict changes stock and needs
      `inventory.conflict.resolve`; a supervisor PIN unlocks it in place.
  apis:
  - operationId: getOfflinePackage
    contract: access
    purpose: Entitlement and rule set for offline validation
