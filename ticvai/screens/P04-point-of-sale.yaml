      match: partial
      view: 'Implicit: F&B sale fires on payment; then Queue -> stage ''Received'' action ''Send to kitchen''
        / ''Mark ready'' / ''Dispatch / hand over'''
      differences: There is no explicit send-to-kitchen step at the counter; the order fires on payment.
        Kitchen ticket status and 'collected' are worked from the Queue board (POS-029), not from a screen
        of their own.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/pos-022.png
      match: partial
      view: Left rail 'Queue' -> partner order DLV-8842 'Send to kitchen' (it moves to Preparing; the
        guest status board above shows takeaway and quick-service numbers only, never partner, delivery
        or dine-in orders)
      differences: 'There is still no send-to-kitchen step at the counter: partner and kiosk orders arrive
        as Received and are sent from the queue (POS-029) with Send to kitchen, and a counter order fires
        on payment, which the 28 September decision replaced (audit R261: send to kitchen, then charge,
        for every POS F&B order). v2 adds the guest status board: takeaway and quick-service numbers under
        Preparing and Ready for pickup, mirroring the kitchen display, never a name. Kitchen ticket status
        and collection are worked from the queue, not from a screen of their own. Design correction (decided
        1 October, POSV2-4): a counter order is not fired on payment; audit R261 stands: send to kitchen,
        then charge. The guest status board is owned by KIT-007 (POSV2-7).'
  apisNote: 'Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formCreateFnbOrder
    component: modal
    trigger: Create F&B order
    body: '**No form: the order comes from the cart.** Send to kitchen sends the cart''s F&B lines with
      the service mode; ids and device times are generated, never typed (design-notes correction fnb-retail
      POS-022).'
    bindsTo: CreateFnbOrderRequest
    confirm:
      label: Create F&B order
      operation: createFnbOrder
    dismiss:
      label: Cancel
      discards:
      - id
      - outletId
      - serviceMode
      - lines
      - recordedAt
      - tableVisitId
    provenance: client-verified
  - id: formSetKitchenTicketStatus
    component: modal
    trigger: Save kitchen ticket status
    body: '**A gesture on the ticket card, not a form**; the time is the device''s.'
    confirm:
      label: Save kitchen ticket status
      operation: setKitchenTicketStatus
    dismiss:
      label: Cancel
      discards:
