- id: POS-026
  name: Receipt & Reprint
  module: Sell
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/receipt
    component: apps/venue-pos/src/routes/sell/ReceiptReprintBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-025
    - POS-030
    - POS-005
    exitTo:
    - POS-025
    - POS-011
    transitions:
    - to: POS-025
      trigger: Till Home
      provenance: 'derived — POS-025 declares entryState.params  and POS-026 holds none of them. The edge
        carries nothing: POS-026 is opened from POS-025, so this edge is the way back and POS-025 keeps
        its own state'
    - to: POS-011
      trigger: Returns, Refunds & Exchanges
      carries:
      - invoiceId
      - orderId
      provenance: derived — POS-011 declares entryState.params invoiceId, orderId, outletId and POS-026
        holds invoiceId, orderId, so an edge into it carries them
  notes: '**`reprintReceipt` has existed in the contracts all along and no screen called it.** The prototype
    puts it at the counter because that is where the guest is standing — a reprint requested from the
    back office is a different, slower thing.


    **Tax documents, as the UAE requires them** (research 2 October 2026, CHG-FIN-011; Executive Regulation
    Art. 59-60): the document a paid order gets is titled "Tax Invoice" (a simplified tax invoice for
    a guest, a full one with the buyer''s name, address and TRN on request), never "Receipt" or "VAT receipt"
    as the title, and a correction is a "Tax Credit Note" (the contract calls it a credit memo). A simplified
    tax invoice is issued automatically when the order is paid; a full one is offered for a VAT-registered
    buyer and is the only kind above AED 10,000 for them. Amounts and VAT are in AED; a guest who paid
    in another currency sees the amount paid, the currency and the rate as payment information (CHG-FIN-001).
    **The receipt is the simplified tax invoice** (`FinTaxInvoiceTemplate.autoIssueOnPayment`, always
    on for a UAE VAT-registered entity; Decree-Law Art. 65(1), Executive Regulation Art. 59(13)(1)): the
    till prints it on payment from the issued invoice (`getTaxInvoice`, `getTaxDocumentRendition`) with
    the words "Tax Invoice", the supplier''s name, address and TRN, the date, what was sold, the total
    and the VAT in AED. A reprint is marked "Copy" and keeps the invoice number. A VAT-registered buyer
    may ask for a full tax invoice here (`issueTaxInvoice` `full`, name, address and TRN).


    **Both receipt cases are drawn**: auto-issued (the receipt is the simplified tax invoice) and on request.
    Whether a venue auto-issues is a template setting (`FinTaxInvoiceTemplate.autoIssueOnPayment`, off
    by default), but the only read of it (`listTaxInvoiceTemplates`) is tenant-scoped under LEDGER_VIEW,
    which a till does not hold; a till-scoped read is logged as a contract gap (open entry CHG-SPO-019;
    design-notes correction finance-insights POS-026).'
  density: touchLarge
  pattern: detail
  patternReason: One order is named and acted on — detail, not a list
  purpose: Reprint a receipt or reissue an entitlement when the guest is still at the counter.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: detail
      components:
      - kind: detailPanel
        label: The order, as it was sold
        bindsTo: Order
      - kind: dataTable
        label: What was issued against it
        bindsTo: Entitlement
      - kind: primaryButton
        label: Reprint receipt
      - kind: secondaryButton
        label: Reissue entitlement
  states:
    loading: The saved receipt.
    error: Could not load. Names which read failed and leaves the receipt untouched.
    emptyFirstRun: No receipt yet. Carries the create action and says what the till does in the meantime.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**Reprint is available offline; reissue is not.** A reissue changes what the gate will admit,
      and the gate cannot be told from here.'
  apis:
  - operationId: reprintReceipt
    contract: retail
    purpose: Print the receipt again
    trigger: onAction
  - operationId: reprintOrder
    contract: orders
    purpose: Print the whole order again
    trigger: onAction
  - operationId: reissueEntitlement
    contract: orders
    purpose: Reissue the ticket or wristband
    trigger: onAction
  - operationId: issueTaxInvoice
    contract: finance
    purpose: Issue a tax invoice
    trigger: onAction
    provenance: build, 29 September 2026
  - operationId: getTaxInvoice
    contract: finance
    purpose: Show a tax invoice
    trigger: onLoad
    provenance: build, 29 September 2026
  - operationId: getTaxDocumentRendition
    contract: finance
    purpose: Download the invoice / credit memo PDF
    trigger: onLoad
    provenance: build, 29 September 2026
  entryState:
    params:
    - name: orderId
      from: navigation
    - name: workstationId
      from: session
    - name: saleId
      from: navigation
    - name: entitlementId
      from: navigation
    - name: documentId
      from: navigation
    - name: invoiceId
      from: navigation
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
      not navigated to.'
  requiresModule: ticketing
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P04 Venue POS.dc.html#pos-026
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: partial
      view: After a successful payment (receipt screen); reprint via Home F4 or cart 'History' -> 'Reprint'
      differences: The post-payment receipt is drawn and answers the POS-005 exitTo gap. Reprint is only
        a toast from the hot key or History, and there is no entitlement reissue (reissueEntitlement).
