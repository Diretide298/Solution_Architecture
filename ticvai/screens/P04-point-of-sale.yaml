platform:
  code: P04
  audience: staff
  formFactor: posTerminal
  shortName: Venue POS
  name: Venue POS — Terminal and Tablet
  surface: staffFacing
  runtime: reactNativeTablet
  offlineCapable: true
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 32
  app: venue-pos
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: POS terminal — Windows or Android
    distribution: device management push
    bundleUpdate: catalogue bundle applies at shift open; app on a scheduled window
    hosting: local, offline-first (ADR-0013)
    storeReview: false
    deviceOwnership: venue-owned, staffed
    networkAssumption: venue LAN with expected outages
    releaseCadence: monthly, never during trading
  designReferences:
  - path: sources/designs/TICVAI_POS_Terminal_client_approved.html
    note: Client-approved POS build, 30 screens, and the fidelity reference for every other platform.
      It replaced the two early Park_POS explorations, removed on purpose 11 September; screen notes that
      cite Park_POS_dc.html record where a decision came from, not a file to open.
  operator: venue
  wireframeBoard: wireframes/P04 Venue POS.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  navigationSets:
    posPrimaryRail:
      members:
      - POS-002
      - POS-005
      - POS-007
      - POS-008
      - POS-009
      - POS-011
      - POS-012
      - POS-013
      - POS-015
      - POS-016
      - POS-021
      - POS-023
      destinations: []
      unrealised: '**Named by 12 screens and implemented by none of them.** They share no destination
        at all, so there is nothing here to call a rail. Either the shared exits are missing from those
        screens or the key is wrong — but a plausible membership invented here would read as fact.'
    posSaleToPayment:
      members:
      - POS-002
      - POS-003
      - POS-004
      - POS-010
      - POS-021
      - POS-022
      - POS-023
      destinations:
      - POS-005
      provenance: derived — every one of the 7 screens naming this set exits to all of them
  targetApp:
    app: venue-pos
    name: TICVAI POS
    shell: terminal
    siblings:
    - P15
    note: '**The kitchen display is the till, signed into differently.** Same software, same outlet, same
      orders — what changes is who is looking and what they may do, which is a permission, not an application.'
    decided: 10 September 2026
screens:
- id: POS-000
  name: Sign In
  module: Shift
  requiresModule: core
  wave: 1
  capability: C11
  purpose: Authenticate the operator at the terminal and resolve the session every other screen on this
    app reads.
  implementation:
    app: venue-pos
    route: /sign-in
    component: apps/venue-pos/src/routes/SignInTerminal.tsx
    status: notStarted
  density: touchLarge
  pattern: form
  patternReason: Two fields and a keypad. `listActiveSessions` reads who holds the till so a supervisor
    can end that session -- a form with one piece of context, not a list to browse
  entryState:
    params:
    - name: challengeId
      from: navigation
    coldEntry: '**The only screen in venue-pos that needs nothing.** That is what makes it the door. `workstationId`
      travels in the login request and comes from the terminal itself, not from a session -- the contract
      says it identifies the device and is *NOT a permission source*.'
  states:
    loading: Checking the credential. The keypad stays visible and disabled.
    emptyFirstRun: '**A till nobody has signed into yet.** No recent operators, so the quick-login row
      is not there and the keypad is the whole screen. This is the state on the morning a terminal is
      first plugged in, and it is the one a venue sees when it opens - not a fault, and it must not read
      as one.'
    error: Identity could not be reached. **Says so rather than saying the PIN is wrong** -- telling an
      operator their PIN failed when the network did sends them to a supervisor with the wrong question.
    denied: The employee number and PIN do not match, or the account is locked. Names which, and how many
      attempts remain before the lock.
    emptyNoAccess: Authentication succeeded and the operator holds no role on this workstation. **A real
      outcome on a shared till** -- a steward badged for the gate is not a cashier -- and it is the session
      that succeeded and the authorisation that did not.
    mfaRequired: '**Signed in, not yet through.** The principal holds a permission that requires MFA (ROLE_MANAGE,
      LEDGER_APPROVE, any platform-staff permission, or one the tenant added), so after `login` the screen
      calls `createMfaChallenge` and asks for the authenticator code; `verifyMfaChallenge` completes the
      sign-in. **Email me a code instead** is the fallback. Five wrong codes lock step-up for the policy''s
      lockout minutes and the screen says so. A principal with no enrolled method is sent to enrol first
      (decided 28 September, audit R135, R126). A cashier never reaches this state.'
    offline: Signs in against the cached operator list and syncs when the link returns. **A till that
      cannot open because the network is down is a till that does not sell**, which is the same reasoning
      POS-001 applies to the float.
  navigation:
    entryFrom: []
    exitTo:
    - POS-001
    - POS-025
    transitions:
    - to: POS-001
      trigger: Begin Shift
      provenance: 'derived — POS-001 declares entryState.params shiftId and POS-000 holds none of them.
        The edge carries nothing: shiftId only pre-selects (deep link or optional), and POS-001 opens
        on its own'
    - to: POS-025
      trigger: Till Home
      provenance: 'derived — POS-025 declares entryState.params  and POS-000 holds none of them. The edge
        carries nothing: POS-025 needs nothing to open'
  layout:
    template: form
    regions:
    - name: contentBody
      slot: form
      components:
      - kind: banner
        label: Venue co-branding
        notes: The venue name and logo above the sign-in, as drawn in v2 (POSV2-9, DEC-550). Read from
          the terminal's cached brand (the catalogue bundle the till already holds), never fetched before
          sign-in, so the door still needs nothing to open.
        provenance: POS v2 candidate, accepted 2 October 2026 (POSV2-9)
      - kind: numberField
        label: Cashier ID
        notes: Goes into `LoginRequest.username`. For anyone not on the recent-cashier tiles (v2 cashier-ID
          entry, POSV2-9, DEC-550).
        bindsTo: LoginRequest.username
      - kind: selectField
        label: Sign in with PIN or password
        notes: 'The v2 switch (POSV2-9, DEC-550): sets `LoginRequest.method` to `pin` or `password` and
          swaps the keypad for a text field. A tenant whose password policy forbids PINs shows password
          only.'
        provenance: POS v2 candidate (sources/designs/TICVAI_POS_Terminal_v2.html), accepted 2 October
          2026 (POSV2-9)
        bindsTo: LoginRequest.method
      - kind: numberField
        label: PIN or password
        notes: 'Goes into `LoginRequest.credential`, with `method: pin` (a 4-digit keypad) or `method:
          password` (a text field), as the switch above it says.'
        bindsTo: LoginRequest.credential
      - kind: primaryButton
        label: Sign in
        operation: login
        provenance: contract identity.yaml POST /auth/login
      - kind: textField
        label: Authentication code
        operation: verifyMfaChallenge
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
        notes: Shown only in the mfaRequired state -- a supervisor or manager whose permissions require
          a second factor (audit R135).
      - kind: primaryButton
        label: Verify
        operation: verifyMfaChallenge
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: secondaryButton
        label: Email me a code instead
        operation: createMfaChallenge
        provenance: contract identity.yaml POST /auth/mfa/challenge
        notes: The fallback -- issues the challenge against the principal's email (`emailOtp`) method
          (audit R126 (5)).
      - kind: cardList
        label: Recent cashiers on this till
        notes: '**Device-local and deliberately backed by no operation.** Four at a time, each with their
          last shift on this till, as drawn in v2 (POSV2-9, DEC-550). The terminal remembers who used
          it so an operator taps a face rather than typing a number; the PIN or password is still required.
          Putting this behind an endpoint would publish a staff list to an unauthenticated caller.'
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Signed in on this till now
        bindsTo: ActiveSession
        operation: listActiveSessions
        provenance: contract identity.yaml GET /auth/sessions
      - kind: destructiveButton
        label: Take the till over
        operation: forceLogout
        provenance: contract identity.yaml POST /auth/sessions/{sessionId}/force-logout
        notes: '**One principal, one active session per workstation.** Signing in while somebody else
          holds the till is refused (`login` answers 409); signing in never ends the other session. A
          supervisor holding SESSION_FORCE_LOGOUT ends it with `forceLogout`, and only then can the next
          operator sign in (decided 28 September, audit R184). The `sessionId` is theirs, picked off the
          list above.'
      - kind: confirmDialog
        label: End the other operator's session?
        notes: Names who is being signed out and whether their shift is still open. **Their float does
          not move** -- the shift survives, the session does not.
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Choose role
        operation: selectRole
        provenance: contract identity.yaml
        notes: 'Shown when `LoginResponse.requiresRoleSelection` is true. **The role decides the surface**:
          a cashier lands on POS-001, kitchen staff on KIT-002. Same app, different door out.'
  apis:
  - operationId: changeOwnCredential
    contract: identity
    purpose: Replace a temporary PIN or password at first sign-in
    trigger: onAction
  - operationId: login
    contract: identity
    purpose: Authenticate the operator at this terminal
    trigger: onAction
  - operationId: listActiveSessions
    contract: identity
    purpose: Who holds this till now
    trigger: onLoad
  - operationId: forceLogout
    contract: identity
    purpose: A supervisor ends the session of the operator holding the till, after login was refused 409
      (audit R184)
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: selectRole
    contract: identity
    purpose: Choose which role to work as when login returns more than one
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Read the session the login just created
    trigger: onAction
  - operationId: createMfaChallenge
    contract: identity
    purpose: Second factor after login when the principal holds a permission in mfaRequiredForPermissions;
      action `signIn`, the primary method (authenticator app), or the email method as the fallback (decided
      28 September, audit R135, R126 (5))
    trigger: onAction
  - operationId: verifyMfaChallenge
    contract: identity
    purpose: Completes sign-in with the code; the session is usable only after it. Five wrong codes lock
      step-up (audit R126 (6))
    trigger: onAction
  apisNote: '**MFA by permission, not by device** (decided 28 September, audit R135). A cashier never
    holds a permission in `PasswordPolicy.mfaRequiredForPermissions`, so a cashier signs in with number
    and PIN and never sees the second-factor step; the till''s `workstationId` remains the bound on a
    PIN. A manager or supervisor who holds LEDGER_APPROVE or ROLE_MANAGE (or a permission the tenant added)
    is asked for the authenticator code after `login` via `createMfaChallenge` / `verifyMfaChallenge`.
    Enrolment happens on EMP-042, not at the till, so there is no `listMfaMethods` here.'
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-000
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: exact
      view: 'Opens here (startScreen ''login''): pick an operator tile, enter any 4-digit PIN'
      differences: Prototype adds Badge/RFID and Corporate SSO sign-in (both just submit), a 'Terminal
        locks after 90 s idle' rule, and a 'Shift not started · Float pending' pill. No MFA challenge,
        no active-session / force-logout, no role selection, no denied/offline state (YAML has mfaRequired,
        denied, offline, emptyNoAccess). The operator's role is fixed by the tile, not chosen.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/pos-000.jpg
      match: exact
      view: 'Opens here: venue co-branding (Ferrari World), recent cashiers four at a time with their
        last shift, cashier-ID entry, PIN or password'
      differences: 'v2 co-brands the sign-in with the venue (name and logo, a demo setting of the build),
        shows recent cashiers four at a time with their last shift, adds a cashier-ID entry for anyone
        not on the tiles, and switches between a 4-digit PIN and a password (LoginRequest.method takes
        pin or password). Badge / RFID, Corporate SSO, the 90 s idle lock and the ''Shift not started
        · Float pending'' pill stay. As in the approved build: no MFA challenge, no active-session / force-logout,
        no role selection, and no denied, offline or emptyNoAccess state. Accepted as drawn (decided 2
        October 2026, Chinmay, batch 5: "Accept all of v2"; POSV2-9, DEC-550; CHG-SPO-001): the venue
        co-branding, the recent cashiers four at a time with their last shift, the cashier-ID entry and
        the PIN/password switch are the specification now; the layout carries them.'
