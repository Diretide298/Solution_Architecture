  notes: 'Design: Park_POS_dc.html, "Ticket Catalogue / Product Selection". The mockup exposes Hold Order
    and Discount as first-class buttons — neither existed as an operation until 14 August. Where a foreign
    note is offered, the tender currency and rate are recorded on the payment. **The sale is still booked
    in base currency** — 2.9.1: the sale finalises in local currency. **Improved 20 August against the
    client design board**, answering 4 board screen(s): Retail Sales & POS Command Center; Retail POS
    Selling Workspace; Guest, Membership, Loyalty & Entitlement Interface and 1 more. **`getLatestBundle`
    wired 24 August.** ADR-0013 makes the POS local-first and **no P04 screen polled for a catalogue**
    — the till held a bundle and nothing on the platform refreshed it. Found by writing F31, not by auditing
    the contract. **Retail board operations wired 24 August.** **Cross-platform navigation removed 24
    August**: BO-084, GST-026. **A till does not navigate to a back office and a guest app does not navigate
    to either** — those are device handovers, and a flow declares them with `crossesDevice` rather than
    a screen pretending there is a link. **Authoring operations removed 24 August**: createProduct, createPromotion,
    endPromotion, pausePromotion, publishPromotion, setAlternativeCodes, setProductAttributes, transitionProductLifecycle,
    unschedulePromotion, updateProduct, updatePromotion, createStockMovement. **A till sells the catalogue;
    it does not author it.** These arrived in the 18 August bulk attach — the same defect that put 21
    of 39 review rows in one bucket — and a flow walking a ticket sale is what surfaced them.'
  density: touchLarge
  boardFrames:
  - Retail Board 3.dc.html#ret-3b
