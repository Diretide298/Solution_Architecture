      differences: 'Prototype goes further than the YAML: it has an explicit unknown-outcome state with
        ''Check payment status'' (inquirePaymentStatus), idempotent retry, a Complimentary tender with
        a required reason, Split, Corporate voucher and Prepaid tenders, a printer-offline fallback to
        email, and training mode (''Sales are simulated and not posted''). The Tip step is missing: Setup
        has a ''Tip prompt'' toggle but flags.tips is never read, so no tip is taken. There is no foreign-currency
        tender, and no buyer name/address/TRN is captured above the AED 10,000 invoice threshold, although
        the receipt does relabel to ''Tax Invoice'' (the YAML gap is still open).'
