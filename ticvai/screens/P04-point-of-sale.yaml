        and the queue drains on reconnect — `toggleNet` (4750).
    - to: POS-020
      trigger: Open a queued transaction that needs attention
      control: dataTable#syncQueue
      precondition: syncQueue.any(status in ['CONFLICT','FAILED','REQUIRES_ATTENTION'])
      guard: inventory.conflict.resolve
      escalatable: true
      carries:
      - localTxnId
      - conflictReason
      - productId
      provenance: board TICVAI POS Terminal · openConflict (4770) + resolveConflict (4776)
    - to: POS-007
      trigger: Close Shift
      provenance: flow F87 step 3→4
    uses:
    - posPrimaryRail
  notes: '**Added 20 August from the client design board.** The operations existed and no screen called
    them. **Named in the board contents and not written up in it.** **Owns POS board frame(s) POS-2D,
    POS-2E** (client pack, 24 August). **Assigned by board purpose rather than by operation overlap**
    — three attempts at deriving that mapping produced plausible nonsense, and a reader who trusts a bad
    table is worse off than one who has none.'
  density: touchLarge
  boardFrames:
  - POS Frontline Board 2.dc.html#pos-2d
  - POS Frontline Board 2.dc.html#pos-2e
  machine:
    key: netStatus
    initial: online
    provenance: client-verified
    states:
      online:
        operation: syncOrders
        note: Connected. Anything queued while offline is replayed in order.
      offline:
        note: '**Selling continues.** Orders are written to the local queue and carry a conflict status
          until they are replayed.'
    transitions:
    - from: online
      'on': connection lost
      to: offline
    - from: offline
      'on': connection restored
      to: online
  pattern: listDetail
  patternReason: '`listCashMovements` reads the population and `getOfflinePackage` reads one of them —
    list, select, act'
  purpose: Mobile POS, Event Sales & Offline Operations — from the client design board, 20 August.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every cash movement
        bindsTo: CashMovement
        columns:
        - CashMovement.id
        - CashMovement.kind
        - CashMovement.amount
        - CashMovement.denominations
        - CashMovement.reference
        - CashMovement.reason
        - CashMovement.recordedAt
        - CashMovement.shiftId
        - CashMovement.authorisedByPrincipalId
        - CashMovement.sequence
        - CashMovement.syncedAt
        operation: listCashMovements
