  name: Returns, Refunds & Exchanges
  module: Sell
  requiresModule: ticketing
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/returns-refunds-exchanges
    component: apps/venue-pos/src/routes/sell/ReturnsRefundsExchangesBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    - POS-026
    - POS-030
    exitTo:
    - POS-002
    - POS-012
    uses:
    - posPrimaryRail
    transitions:
    - to: BO-082
      trigger: The returned item is dispositioned — resaleable, damaged, or back to the supplier
      provenance: flow F34 step 7→8
      crossesDevice: true
      back: false
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      carries:
      - orderId
      provenance: derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId
        and POS-011 holds orderId, so an edge into it carries them
    - to: POS-012
      trigger: Omnichannel Order & Fulfilment Center
      provenance: flow F87 step 1→2
      operation: listSerialisedItems
      carries:
      - orderId
      - outletId
  notes: '**Added 20 August from the client design board.** The operations existed and no screen called
    them. **Owns POS board frame(s) POS-2B** (client pack, 24 August). **Assigned by board purpose rather
    than by operation overlap** — three attempts at deriving that mapping produced plausible nonsense,
    and a reader who trusts a bad table is worse off than one who has none.


    **Tax documents, as the UAE requires them** (research 2 October 2026, CHG-FIN-011; Executive Regulation
    Art. 59-60): the document a paid order gets is titled "Tax Invoice" (a simplified tax invoice for
    a guest, a full one with the buyer''s name, address and TRN on request), never "Receipt" or "VAT receipt"
    as the title, and a correction is a "Tax Credit Note" (the contract calls it a credit memo). A simplified
    tax invoice is issued automatically when the order is paid; a full one is offered for a VAT-registered
    buyer and is the only kind above AED 10,000 for them. Amounts and VAT are in AED; a guest who paid
    in another currency sees the amount paid, the currency and the rate as payment information (CHG-FIN-001).
    **Refunds** (CHG-FIN-001): a card or wallet payment taken in a guest-selected currency is refunded
    in that currency at the sale rate (`Refund.tenderCurrency`, `tenderAmount`), shown beside the base
    amount ("USD 81.72 = AED 300.00 at 3.6710"); foreign cash at a till is refunded in base currency (DI-282).'
  density: touchLarge
  boardFrames:
  - POS Frontline Board 2.dc.html#pos-2b
  - Retail Board 3.dc.html#ret-3g
  machine:
    key: reversalStage
    initial: requested
    provenance: client-verified
    states:
      requested:
        note: A reversal has been asked for. **Whether the operator may approve their own is a policy
          question**, and the prototype checks it before offering the control.
      processing:
        operation: createRefund
        note: The reversal is with the gateway.
      done:
        terminal: true
        note: Reversed, and written to the audit trail against the operator.
    transitions:
    - from: requested
      'on': Confirm reversal
      to: processing
    - from: processing
      'on': gateway acknowledged
      to: done
  pattern: listDetail
  patternReason: '`listDenominations` reads the population and `getReturnPolicy` reads one of them — list,
    select, act'
  purpose: Take back a sale, refund it or exchange it, against the original receipt.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every serialised
        bindsTo: SerialisedItem
        columns:
        - SerialisedItem.serial
        - SerialisedItem.status
        - SerialisedItem.warrantyUntil
        - SerialisedItem.receivedAt
        operation: listSerialisedItems
        provenance: contract inventory.yaml GET /serialised-items
      - kind: primaryButton
        label: Confirm
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The return policy
        bindsTo: ReturnPolicy
        columns:
        - ReturnPolicy.defaultWindowDays
        - ReturnPolicy.requiresReceipt
        - ReturnPolicy.allowCashRefundOnCardSale
        - ReturnPolicy.selfAuthoriseLimit
        - ReturnPolicy.requiresSecondUserAbove
        - ReturnPolicy.requiresApprovalAbove
        - ReturnPolicy.restockableConditions
        operation: getReturnPolicy
        provenance: contract retail.yaml GET /outlets/{outletId}/return-policy
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create refund
        operation: createRefund
        provenance: contract orders.yaml POST /orders/{orderId}/refunds
        notes: '**Store credit is a gift card issued at the refund amount** (decided 2 October 2026, Chinmay,
          batch 1, POS-011: "Gift card"; DEC-061; CHG-CSP-037, CHG-CSA-027). The tender list reads "Gift
          card (store credit)"; `createRefund` with `settleTo: storeCredit` issues the card and the receipt
          prints its number.'
      - kind: secondaryButton
        label: Exchange order lines
        operation: exchangeOrderLines
        provenance: contract orders.yaml POST /orders/{orderId}/exchanges
      - kind: secondaryButton
        label: Lookup retail sale
        operation: lookupRetailSale
        provenance: contract retail.yaml GET /retail-sales/lookup
        notes: '**Scan the receipt barcode, or type the receipt or order number.** The barcode wins, then
          the receipt number, then the order number; `matchedBy` says which was used. The answer is a
          list: one match opens it, several show a pick list, newest first, for the cashier to choose
          the sale being returned (decided 28 September, audit R215).'
      - kind: dataTable
        label: Matching sales
        bindsTo: RetailSale
        columns:
        - RetailSale.receiptNumber
        - RetailSale.orderId
        - RetailSale.outletId
        - RetailSale.grossAmount
        - RetailSale.createdAt
        operation: lookupRetailSale
        provenance: contract retail.yaml GET /retail-sales/lookup
        notes: Shown only when `lookupRetailSale` returns more than one sale; picking a row opens it.
          Headed by the identifier in `matchedBy` (audit R215).
      - kind: secondaryButton
        label: Create retail return
        operation: createRetailReturn
        provenance: contract retail.yaml POST /retail-returns
  states:
    loading: The returns refunds exchanges list.
    error: Could not load. Names which read failed and leaves the returns refunds exchanges untouched.
    emptyFirstRun: No returns refunds exchanges yet. Offers Create refund (`createRefund`); distinct from
      a filter that matched nothing.
    emptyNoResults: Nothing matches the filter on includeInactive and the returns refunds exchanges are
      still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `getReturnPolicy` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Refunds and returns are refused offline** (F58 step 8; design-notes correction fnb-retail
      POS-011). The till keeps selling from the local journal; a refund needs the original sale and its
      payment, which only the server holds. Says so and offers to try again when the link returns.'
  apis:
  - operationId: createRefund
    contract: orders
    purpose: Refund an order, wholly or in part
    trigger: onAction
  - operationId: exchangeOrderLines
    contract: orders
    purpose: Exchange lines for different products or dates
    trigger: onAction
