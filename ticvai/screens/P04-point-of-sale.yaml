  states:
    loading: The close shift list.
    error: Could not load. Names which read failed and leaves the close shift untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: 'Never shown: `listCashMovements` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: Shown when the caller lacks `SHIFT_OPEN`, which `getCurrentShift` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: Cannot close. Closing requires the server total, and a locally computed variance is not a
      variance
    denied: '`acceptShiftVariance` was refused: the caller lacks OVERSHORT_ACCEPT at this venue, or is
      the cashier whose shift it is. The shift stays `pendingVariance` against the same count, and a supervisor
      accepts it on this till (audit R080 (e)).'
    pendingVariance: '**Closed as counted, over/short waiting for a supervisor.** `closeShift` returned
      `requiresAcceptance`; a supervisor holding OVERSHORT_ACCEPT accepts the variance on this till with
      a PIN step-up. There is no pre-close PIN hold and no approval request (decided 28 September, audit
      R080 (e)).'
