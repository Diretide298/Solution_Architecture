      precondition: syncQueue.any(status in ['CONFLICT','FAILED','REQUIRES_ATTENTION'])
      guard: inventory.conflict.resolve
      escalatable: true
      provenance: board TICVAI POS Terminal · openConflict (4770) + resolveConflict (4776)
      carries:
      - shiftId
    - to: POS-007
      trigger: Close Shift
      provenance: flow F87 step 3→4
      operation: createOrder
    - to: BO-130
      trigger: Four transactions are rejected — a product retired while the till was offline
      provenance: flow F33 step 6→7
      operation: syncOrders
      crossesDevice: true
      back: false
    uses:
    - posPrimaryRail
  notes: '**Added 20 August from the client design board.** The operations existed and no screen called
    them. **Named in the board contents and not written up in it.** **Owns POS board frame(s) POS-2D,
    POS-2E** (client pack, 24 August). **Assigned by board purpose rather than by operation overlap**
    — three attempts at deriving that mapping produced plausible nonsense, and a reader who trusts a bad
    table is worse off than one who has none.'
  density: touchLarge
