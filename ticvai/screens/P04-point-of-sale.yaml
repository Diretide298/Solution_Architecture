  apis:
  - operationId: recordNoSale
    contract: shift
    purpose: Open the drawer without a sale
    trigger: onAction
  - operationId: voidOrder
    contract: orders
    purpose: Void an order
    trigger: onAction
  - operationId: applyManualDiscount
    contract: orders
    purpose: Apply a discount a cashier chose
    trigger: onAction
  entryState:
    params:
    - name: workstationId
      from: session
    - name: orderId
      from: deepLink
    - name: shiftId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
      not navigated to.'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P04 Venue POS.dc.html#pos-014
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: partial
      view: 'Spread across: cart ''Discount'' modal; Refunds ''Void''; Home hot key F3 ''Open drawer'';
        ''AUTHORISATION REQUIRED'' PIN modal'
      differences: 'There is no single exceptions screen: the controls are overlays on the sale. ''Open
        drawer'' (the no-sale) takes no reason, checks no permission and writes no audit entry; it only
        shows a toast. This is the POS-020 gap C-4/C-5, still present. The approval modal has a reject
        path that the YAML does not model.'
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
