- id: POS-005
  name: Payment
  module: Payment
  requiresModule: ticketing
  wave: 1
  capability: C04
  implementation:
    app: venue-pos
    route: /payment/payment
    component: apps/venue-pos/src/routes/payment/PaymentForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    - POS-003
    - POS-004
    - POS-028
    - POS-031
    exitTo:
    - POS-001
    - POS-002
    - POS-010
    - POS-022
    - POS-023
    - POS-026
    fromFlows: true
    transitions:
    - to: POS-002
      trigger: Back to sale
      control: secondaryButton#backToSale
      returnsTo: POS-002
      discards:
      - tendered
      - splitParts
      carries:
      - discount
      provenance: board TICVAI POS Terminal · backToSale (5506). **The cart survives.** `cancelPaymentTxn`
        (4655) is the other path and it clears the cart — raised as POS-BOARD-AUDIT.md C-6, because a
        declined card is not an abandoned sale.
    - to: POS-001
      trigger: Begin Shift
      carries:
      - shiftId
      provenance: derived — POS-001 declares entryState.params shiftId and POS-005 holds shiftId, so an
        edge into it carries them
    - to: POS-023
      trigger: Sell — Merchandise
      provenance: 'derived — POS-023 declares entryState.params  and POS-005 holds none of them. The edge
        carries nothing: POS-023 needs nothing to open'
    - to: POS-022
      trigger: Charged — back to the pass, where the order already sent to the kitchen is handed over
        (send to kitchen, then charge; audit R261)
      provenance: flow F108 step 4→6 — paid at step 4, collected at the pass at step 6 once the kitchen
        (step 5, another device) has bumped it; the send itself is POS-022 → POS-005, step 3→4
      carries:
      - orderId
    - to: KIT-002
      trigger: The kitchen makes it and bumps it
      provenance: flow F108 step 4→5
      crossesDevice: true
      back: false
    - to: POS-026
      trigger: Receipt
      provenance: 'wiring fix, 2 October 2026 (CHG-WIR-019): the payment''s success branch'
      carries:
      - entitlementId
      - orderId
      - saleId
    - to: POS-010
      trigger: The guest asks to add a locker to the ticket they just bought
      provenance: flow F58 step 6→7
      carries:
      - orderId
    - to: GST-062
      trigger: Guest tracks it in the app
      provenance: flow F17 step 3→4
      operation: createShopAndDrop
      crossesDevice: true
      back: false
    uses:
    - posPrimaryRail
  notes: 'Design: Park_POS_dc.html, "Cash Payment". Add Tip appears in the design and had no operation
    until 14 August. A tip posts to a liability, not to sales. **The one surface that takes foreign cash**
    (4.6.11). Records `tenderCurrency`, `tenderAmount` and the `fxRate` applied, and **gives change in
    base currency only** — a till giving change in five currencies needs five floats and the variance
    becomes unattributable. **Improved 20 August against the client design board**, answering 1 board
    screen(s): Checkout, Payment & Receipt. **Cross-platform navigation removed 24 August**: BO-048. **A
    till does not navigate to a back office and a guest app does not navigate to either** — those are
    device handovers, and a flow declares them with `crossesDevice` rather than a screen pretending there
    is a link. **Reaches the counter screens from 24 August.** **A till has one tender flow, not one per
    module** — a food order and a ticket both settle here and return to whichever board they came from.


    **Receipt** (CHG-FIN-011): the receipt printed or emailed on payment is the simplified tax invoice
    titled "Tax Invoice", issued automatically when the order is paid (POS-026). Foreign cash tendered
    here is recorded at its base equivalent and change is given in base currency (DI-282, unchanged by
    CHG-FIN-001).'
  density: touchLarge
  boardFrames:
  - Retail Board 3.dc.html#ret-3e
  machine:
    key: payStage
    initial: idle
    provenance: client-verified
    states:
      idle:
        note: Nothing has been sent to the terminal yet.
      processing:
        operation: createPayment
        note: Authorisation in flight. **The idempotency key is minted here and reused on every subsequent
          attempt** — it is what makes the inquiry path safe.
      unknown:
        note: '**The terminal charged a card and never answered.** Inquiry, never retry: a retry takes
          the money a second time, and the guest is standing there.'
      checking:
        operation: inquirePaymentStatus
        note: Asking the gateway what actually happened to the attempt.
      completed:
        terminal: true
        goes: POS-002
        note: Settled. The till returns to the catalogue for the next sale.
      failed:
        terminal: true
        retryTo: idle
        note: Declined or cancelled, and known to be so. Safe to take again.
    transitions:
    - from: idle
      'on': Charge
      to: processing
    - from: processing
      'on': approved
      to: completed
    - from: processing
      'on': declined or cancelled
      to: failed
    - from: processing
      'on': gatewayTimeout
      to: unknown
      note: The network dropped between the charge and the answer.
    - from: unknown
      'on': Check status
      to: checking
    - from: checking
      'on': settled
      to: completed
      note: Confirmed with the gateway — the payment succeeded and no duplicate was created.
    - from: checking
      'on': notFound
      to: failed
  pattern: listDetail
  patternReason: '`listRetailSales` reads the population and `getRetailSale` reads one of them — list,
    select, act'
  purpose: Take payment and complete the sale.
  gaps:
  - field: navigation.exitTo
    why: '**The success branch has nowhere to go.** `finishPayment` (4636) lands on a receipt with a VAT
      breakdown, a reprint and a 12-second auto-continue back to a new sale. P04 declares no receipt screen,
      so the most-reached screen on the platform is undrawn and unspecified.'
    source: POS-BOARD-AUDIT.md §5
  - field: Order.buyerTrn
    why: '**Above AED 10,000 a simplified tax invoice is not lawful** — a full UAE tax invoice needs the
      buyer''s name, address and TRN. The board relabels the receipt at the threshold and captures none
      of the three, and no P04 screen declares the capture. See `roles.yaml` thresholds.taxInvoice.'
    source: POS-BOARD-AUDIT.md C-11
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
