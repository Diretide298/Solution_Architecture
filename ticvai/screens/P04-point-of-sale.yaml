- id: POS-029
  name: Order Queue
  module: Sell
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/queue
    component: apps/venue-pos/src/routes/sell/OrderQueueBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-025
    exitTo:
    - POS-025
    - POS-022
    transitions:
    - to: POS-025
      trigger: Till Home
      provenance: 'derived — POS-025 declares entryState.params  and POS-029 holds none of them. The edge
        carries nothing: POS-029 is opened from POS-025, so this edge is the way back and POS-025 keeps
        its own state'
    - to: POS-022
      trigger: Send to Kitchen
      carries:
      - orderId
      provenance: derived — POS-022 declares entryState.params orderId, ticketId and POS-029 holds orderId,
        so an edge into it carries them
  notes: '**The prototype models five stages with the action that leaves each one** — received → *send
    to kitchen*, preparing → *mark ready*, ready → *dispatch / hand over*, out for delivery → *mark delivered*,
    completed → *reopen*. P04 had `listFnbOrders` and nineteen queue operations and no board to work them
    on. **The customer-facing order status board is owned by KIT-007** (P15, decided 1 October 2026, POSV2-7):
    this queue shows a mirror of it (order numbers only, Preparing and Ready for pickup), and **Cancel
    is not on the cards**: no operation is behind it (POSV2-8).'
  density: touchLarge
  pattern: board
  patternReason: Orders move between named stages and are acted on in place — a board
  purpose: Watch orders move from received to handed over, and act on the ones that stall.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: board
      components:
      - kind: cardList
        label: Orders by stage — received, preparing, ready, out, completed
        bindsTo: FnbOrder
      - kind: detailPanel
        label: The selected order
        bindsTo: FnbOrder
      - kind: primaryButton
        label: Advance stage
      - kind: cardList
        label: Guest status board — the mirror of the kitchen display's
        bindsTo: FnbOrder
        operation: listFnbOrders
        notes: Order numbers only, under Preparing and Ready for pickup, never a name. **KIT-007 owns
          the board** and this is its mirror on the till (decided 1 October 2026, POSV2-7).
        provenance: v2 build, Queue (the guest status board)
      - kind: cardList
        label: Feed health
        bindsTo: QueueFeed
  states:
    loading: The saved queue.
    error: Could not load. Names which read failed and leaves the queue untouched.
    emptyFirstRun: No queue yet. Carries the create action and says what the till does in the meantime.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**The queue is the one thing that must never look current when it is not.** Offline, every
      card carries the time it was last known and the advance action is withheld.'
  apis:
  - operationId: listFnbOrders
    contract: fnb
    purpose: Every order this outlet is working
    trigger: onLoad
  - operationId: listQueueEntries
    contract: queue
    purpose: Who is waiting and for how long
    trigger: onAction
  - operationId: getQueue
    contract: queue
    purpose: The queue this workstation serves
    trigger: onAction
  - operationId: getQueueFeedHealth
    contract: queue
    purpose: Whether the feed is current
    trigger: onAction
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: queueId
      from: navigation
    - name: feedId
      from: navigation
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
      not navigated to.'
  requiresModule: fnb
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-029
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: exact
      view: Left rail 'Queue'
      differences: Adds order cancellation with a reason, and auto-refund for partner-prepaid orders.
        The YAML has no cancel operation on this screen and no queue feed-health display.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/pos-029.png
      match: exact
      view: 'Left rail ''Queue'': stage counts, the guest status board (order numbers only, mirrors the
        kitchen display), takeaway, partner, dine-in, delivery and quick-service orders'
      differences: 'v2 adds the guest status board above the lanes (order numbers only, Preparing and
        Ready for pickup, mirroring the kitchen display) and quick-service orders beside takeaway, partner,
        dine-in and delivery. Each card carries its stage action (Send to kitchen, Mark ready, Served
        to table, Mark delivered, Hand over to guest) and Cancel, which has no operation on this screen.
        No queue feed-health display. Decided 1 October: Cancel is dropped from the design, no operation
        is behind it (POSV2-8); the guest status board is owned by KIT-007 (P15) and this queue mirrors
        it (POSV2-7).'
- id: POS-030
  name: Sales Journal
  module: Sell
  requiresModule: core
  wave: 1
  permission: ORDER_VIEW
  implementation:
    app: venue-pos
    route: /sell/journal
    component: apps/venue-pos/src/routes/sell/SalesJournalBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-025
    - POS-002
    exitTo:
    - POS-025
    - POS-002
    - POS-011
    - POS-026
    transitions:
    - to: POS-025
      trigger: Till Home
      provenance: 'decided 1 October 2026 (POS v2 decisions, POSV2-1): the journal is opened from the
        Till Home function bar (F7 Sales journal) and its KPI tiles, and this edge is the way back. It
        carries nothing: POS-025 keeps its own state'
    - to: POS-002
      trigger: Reload this cart
      control: secondaryButton#reloadCart
      operation: addCartLine
      guard: ORDER_CREATE
      carries:
      - cartId
      provenance: 'decided 1 October 2026 (POSV2-1), from the v2 cart history (Reload this cart): the
        selected sale''s lines are read with `getOrder` and added to the till''s cart with `addCartLine`,
        at today''s prices and availability; the old order is not touched'
    - to: POS-011
      trigger: Refund or void
      control: secondaryButton#refundOrVoid
      guard: ORDER_REFUND
      escalatable: true
      carries:
      - orderId
      provenance: 'decided 1 October 2026 (POSV2-1), from the v2 sales journal (Refund or void): the journal
        hands the sale to Returns, Refunds & Exchanges and does not refund or void on its own surface'
    - to: POS-026
      trigger: Open the receipt
      control: dataTable#journal
      carries:
      - orderId
      provenance: 'decided 1 October 2026 (POSV2-1): a sale opened from the journal shows its receipt
        on Receipt & Reprint, where the entitlement can be reissued'
  notes: '**Added 1 October 2026 from the POS v2 build** (decision POSV2-1, docs/registers/pos-v2-decisions.md).
    v2 has a Sales journal (F7, and the Till Home KPI tiles) and a Cart history (the cart''s History)
    and P04 had no screen for either, although `listOrders` and `getOrder` existed. **One screen, not
    two**: the cart history is this journal opened from the cart, filtered to this terminal and today.
    **No CSV or Excel export in r2**: v2 draws both, and an export is a later change (no operation exports
    orders). The customer, terminal and payment-method filters were added to `listOrders` the same day
    as optional query parameters, an additive change.'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listOrders` reads the till''s sales and `getOrder` reads one of them — list, select,
    act'
  purpose: Find a sale this till made and act on it — reprint or email the receipt, issue a tax invoice,
    reload it into the cart, or hand it to returns.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Terminal
        operation: listOrders
        notes: Sends `?workstationId=`. **Defaults to this terminal**; another terminal at the venue needs
          `ORDER_VIEW_OTHER` when its sales are not the caller's own.
        provenance: contract orders.yaml GET /orders (workstationId, added 1 October 2026)
      - kind: datePicker
        label: Day
        operation: listOrders
        notes: Sends `?createdFrom=` and `?createdTo=` for the venue's business day. **Defaults to today.**
        provenance: contract orders.yaml GET /orders
      - kind: searchField
        label: Customer — name, phone or booking reference
        operation: searchGuests
        notes: Picks the guest, then sends `?subjectId=` to `listOrders`; only that guest's sales come
          back.
        provenance: contract marketing-crm.yaml GET /guests · orders.yaml GET /orders (subjectId, added
          1 October 2026)
      - kind: selectField
        label: Payment method
        operation: listOrders
        notes: Sends `?tender=` (cash, card, wallet, voucher, gift card, complimentary and the rest of
          the tender kinds); a sale matches when any of its payments used that tender, so a split sale
          shows under each of its tenders.
        provenance: contract orders.yaml GET /orders (tender, added 1 October 2026)
      - kind: selectField
        label: Status
        operation: listOrders
        notes: Sends `?status=`.
        provenance: contract orders.yaml GET /orders
      - kind: metricTile
        label: Sales and gross value
        bindsTo: OrderSummary.grossAmount
        operation: listOrders
        notes: The count and the gross value of the sales the filter returns. **Not the shift's takings**
          — those are Reports (POS-008) and the close (POS-007).
        provenance: v2 sales journal (GROSS VALUE)
      - kind: dataTable
        label: The till's sales, newest first
        bindsTo: OrderSummary
        columns:
        - OrderSummary.orderNumber
        - OrderSummary.createdAt
        - OrderSummary.status
        - OrderSummary.channel
        - OrderSummary.lineCount
        - OrderSummary.grossAmount
        - OrderSummary.refundedAmount
        - OrderSummary.principalId
        operation: listOrders
        provenance: contract orders.yaml GET /orders
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected sale — its lines, payments and status
        bindsTo: Order
        columns:
        - Order.orderNumber
        - Order.status
        - Order.lines
        - Order.payments
        - Order.grossAmount
        - Order.taxAmount
        - Order.netAmount
        - Order.refundedAmount
        - Order.principalId
        - Order.workstationId
        - Order.subjectId
        - Order.createdAt
        operation: getOrder
        provenance: contract orders.yaml GET /orders/{orderId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Reprint or email the receipt
        operation: reprintReceipt
        permission: ORDER_REPRINT
        provenance: contract retail.yaml POST /retail-sales/{saleId}/reprint
      - kind: secondaryButton
        label: Reprint the order
        operation: reprintOrder
        permission: ORDER_REPRINT
        provenance: contract orders.yaml POST /orders/{orderId}/reprints
      - kind: secondaryButton
        label: Tax invoice
        operation: issueTaxInvoice
        permission: LEDGER_POST
        notes: Issues the full tax invoice for the sale, or opens the one already issued (`getTaxDocumentRendition`
          for the PDF, to print or email).
        provenance: contract finance.yaml POST /tax-invoices
      - kind: secondaryButton
        label: Print or email the tax invoice
        operation: getTaxDocumentRendition
        permission: LEDGER_VIEW
        notes: The issued invoice as a PDF, in English or Arabic, to print at the till or email to the
          guest.
        provenance: v2 sales journal (Email tax invoice) · contract finance.yaml GET /tax-documents/{documentId}/rendition
      - kind: secondaryButton
        label: Reload this cart
        operation: addCartLine
        provenance: v2 cart history (Reload this cart) · contract orders.yaml POST /carts/{cartId}/lines
      - kind: secondaryButton
        label: Refund or void
        notes: Hands the sale to Returns, Refunds & Exchanges (POS-011). Nothing is refunded or voided
          here.
        provenance: v2 sales journal (Refund or void)
  overlays:
  - id: formReprintReceipt
    component: modal
    trigger: Reprint or email the receipt
    body: '**Collects what `reprintReceipt` sends before it is called.** Required: `delivery` (print,
      email, SMS or WhatsApp). `destination` is required for anything but print. Dismissing sends nothing;
      the sale is unchanged.'
    confirm:
      label: Send
      operation: reprintReceipt
    dismiss:
      label: Cancel
      discards:
      - delivery
      - destination
    provenance: v2 sales journal (Reprint receipt, Email tax invoice)
  - id: formReprintOrder
    component: modal
    trigger: Reprint the order
    body: '**Collects what `reprintOrder` sends before it is called.** Required: `delivery`, `recordedAt`.
      Optional: `destination`, `lineIds`, `reason`. Dismissing sends nothing; the sale is unchanged.'
    confirm:
      label: Reprint
      operation: reprintOrder
    dismiss:
      label: Cancel
      discards:
      - delivery
      - recordedAt
      - destination
      - lineIds
      - reason
    provenance: contract orders.yaml POST /orders/{orderId}/reprints
  - id: formIssueTaxInvoice
    component: modal
    trigger: Tax invoice
    body: '**Collects what `issueTaxInvoice` sends before it is called**: the buyer''s name, address and
      TRN where the invoice needs them. An invoice already issued for the sale opens instead of a second
      one. Dismissing sends nothing.'
    bindsTo: FinIssueTaxInvoiceRequest
    confirm:
      label: Issue tax invoice
      operation: issueTaxInvoice
    dismiss:
      label: Cancel
      discards:
      - buyer
    provenance: contract finance.yaml POST /tax-invoices
  - id: confirmReloadCart
    component: confirmDialog
    trigger: Reload this cart
    body: '**Adds this sale''s lines to the cart at today''s prices and availability.** A line no longer
      on sale, or a performance that has passed, is named and left out. The original sale is not changed.'
    confirm:
      label: Reload into the cart
      operation: addCartLine
      to: POS-002
      carries:
      - cartId
    dismiss:
      label: Keep the cart as it is
      discards:
      - cartId
    provenance: v2 cart history (Reload this cart)
  states:
    loading: This terminal's sales today, newest first. **The filters render before the rows.**
    error: Could not load the journal. Names which read failed and keeps the filters as they were.
    emptyFirstRun: '**No sales on this terminal today yet.** Says so plainly; the journal fills as sales
      are made.'
    emptyNoResults: Nothing matches the filter on terminal, day, customer, payment method or status, and
      the till's sales are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listOrders` requires, and names that
      permission. **Never an empty table** — that reads as *there is no data*.
    denied: Another terminal's or another cashier's sales need `ORDER_VIEW_OTHER`. **This terminal's own
      sales are still listed**; the filter names what is withheld.
    offline: '**Orders taken on this terminal are listed from the local journal**; other terminals, the
      customer search and tax invoices need the network. Reprint works offline (`reprintOrder`).'
  apis:
  - operationId: listOrders
    contract: orders
    purpose: The till's sales — this terminal, today, by default
    trigger: onLoad
  - operationId: getOrder
    contract: orders
    purpose: The selected sale with its lines and payments
    trigger: onAction
  - operationId: searchGuests
    contract: marketing-crm
    purpose: Find the customer to filter by
    trigger: onAction
  - operationId: reprintReceipt
    contract: retail
    purpose: Print or email the receipt again
    trigger: onAction
  - operationId: reprintOrder
    contract: orders
    purpose: Print or resend the order's tickets
    trigger: onAction
  - operationId: issueTaxInvoice
    contract: finance
    purpose: Issue a tax invoice for the sale
    trigger: onAction
  - operationId: getTaxDocumentRendition
    contract: finance
    purpose: The tax invoice PDF, to print or email
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Reload the sale's lines into the till's cart
    trigger: onAction
  entryState:
    params:
    - name: workstationId
      from: session
    - name: shiftId
      from: session
    - name: cartId
      from: session
    - name: orderId
      from: navigation
      optional: true
    - name: documentId
      from: navigation
    - name: saleId
      from: navigation
    coldEntry: '**Resolves from the session, which carries the workstation** — the journal opens on this
      terminal''s sales today.'
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-030
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: partial
      view: Cart 'History' (the cart history, with Reprint)
      differences: The approved build has only the cart's History, with a toast for Reprint. No sales
        journal, no filters, no tax invoice, no refund hand-off and no Reload this cart.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/v2-journal.png
      match: partial
      view: F7 'Sales journal' or a Till Home KPI tile -> the journal, first row expanded; the cart's
        'History' opens it as Cart history (this terminal, by day), drawn as the variant
      differences: 'v2 draws two views and the definition makes them one screen (decided 1 October, POSV2-1):
        the Sales journal (gross value and settlement tiles, every sale with its pay status, a row expanding
        to its lines and transaction status, Reprint receipt, Email tax invoice, Refund or void) and the
        Cart history (the cart''s History: this terminal''s sales by day, Reload this cart). The definition
        opens on this terminal and today, filters by terminal, day, customer, payment method and status
        (listOrders), hands Refund or void to POS-011 and refunds nothing here, and reloads a cart with
        getOrder then addCartLine at today''s prices. v2''s CSV and Excel export is not in r2 (a later
        change: no operation exports orders).'
- id: POS-031
  name: Reservations & Group Arrivals
  module: Sell
  requiresModule: ticketing
  wave: 1
  permission: ORDER_VIEW
  implementation:
    app: venue-pos
    route: /sell/reservations
    component: apps/venue-pos/src/routes/sell/ReservationsGroupArrivalsBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-025
    - POS-002
    exitTo:
    - POS-025
    - POS-005
    transitions:
    - to: POS-025
      trigger: Till Home
      provenance: 'decided 1 October 2026 (POS v2 decisions, POSV2-2): opened from the Till Home function
        bar (F5 Reservations) and the Bookings rail item, and this edge is the way back. It carries nothing'
    - to: POS-005
      trigger: Take payment
      control: primaryButton#takePayment
      operation: convertReservation
      guard: ORDER_CREATE
      carries:
      - orderId
      precondition: reservation.status == held, or the group's order has a balance due
      onFailure:
      - when: the reservation expired (409 reservationExpired)
        to: POS-031
        note: The capacity has been released. Offer a new reservation for what is still available.
      - when: already converted (409 alreadyConverted)
        to: POS-031
        note: Open the order it became and take its balance.
      provenance: 'decided 1 October 2026 (POSV2-2): a reservation is converted into an order on arrival
        (`convertReservation`) and paid at Payment; **the tickets are issued when it is paid, never before**.
        A group''s order is paid the same way'
  notes: '**Added 1 October 2026 from the POS v2 build** (decision POSV2-2, docs/registers/pos-v2-decisions.md).
    v2 has a Bookings rail item and F5 Reservations (reservations and group bookings), and the six reservation
    operations had no screen at the till. **Built on the existing contract and nothing else**: a reservation
    holds capacity, expires, **creates no entitlement** and posts nothing to the ledger. On arrival it
    is converted (`convertReservation`), paid (POS-005) and the tickets are issued then. **v2 encodes
    a group''s tickets as inactive before payment and activates them on payment; that is not built**:
    nothing is encoded before the order is paid. Groups use the group operations the back office already
    uses (BO-026, BO-280): the group, its leader and manifest, and the arrival check-in.'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listReservations` and `listGroupArrivalCheck` read who is due and `getReservation`
    / `getGroupBooking` read one of them — list, select, act'
  purpose: Hold a sale without payment, and take payment when the guest or the group arrives.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Status
        operation: listReservations
        notes: Sends `?status=` (held, converted, expired, cancelled). Defaults to held.
        provenance: contract orders.yaml GET /reservations
      - kind: toggle
        label: Expiring within the hour
        operation: listReservations
        notes: Sends `?expiringWithinMinutes=60` — the reservations about to release their capacity.
        provenance: contract orders.yaml GET /reservations
      - kind: dataTable
        label: Reservations, soonest expiry first
        bindsTo: Reservation
        columns:
        - Reservation.id
        - Reservation.subjectId
        - Reservation.status
        - Reservation.lines
        - Reservation.expiresAt
        - Reservation.createdAt
        operation: listReservations
        provenance: contract orders.yaml GET /reservations
      - kind: dataTable
        label: Groups due today
        bindsTo: GroupArrivalCheckInAdmissionOperationsView
        columns:
        - GroupArrivalCheckInAdmissionOperationsView.groupsExpectedToday
        - GroupArrivalCheckInAdmissionOperationsView.arrivalTime
        - GroupArrivalCheckInAdmissionOperationsView.groupLeader
        - GroupArrivalCheckInAdmissionOperationsView.groupSize
        - GroupArrivalCheckInAdmissionOperationsView.checkedIn
        - GroupArrivalCheckInAdmissionOperationsView.remaining
        - GroupArrivalCheckInAdmissionOperationsView.readiness
        operation: listGroupArrivalCheck
        provenance: contract orders.yaml GET /group-arrival-check (as on BO-280)
      - kind: primaryButton
        label: New reservation
        operation: createReservation
        permission: ORDER_CREATE
        provenance: contract orders.yaml POST /reservations · v2 Bookings (New reservation) and the cart's
          Reserve
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected reservation — what it holds and until when
        bindsTo: Reservation
        columns:
        - Reservation.id
        - Reservation.venueId
        - Reservation.subjectId
        - Reservation.status
        - Reservation.lines
        - Reservation.expiresAt
        - Reservation.convertedOrderId
        operation: getReservation
        provenance: contract orders.yaml GET /reservations/{reservationId}
      - kind: detailPanel
        label: The selected group — leader, numbers and its order
        bindsTo: GroupBooking
        columns:
        - GroupBooking.organisationName
        - GroupBooking.leaderSubjectId
        - GroupBooking.expectedSize
        - GroupBooking.confirmedSize
        - GroupBooking.status
        - GroupBooking.orderId
        operation: getGroupBooking
        provenance: contract orders.yaml GET /group-bookings/{groupBookingId} (as on BO-026)
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Take payment
        operation: convertReservation
        permission: ORDER_CREATE
        notes: Converts the reservation into an order and opens Payment. **Tickets are issued when the
          payment completes**, not here and not before.
        provenance: contract orders.yaml POST /reservations/{reservationId}/convert
      - kind: secondaryButton
        label: Extend the hold
        operation: extendReservation
        permission: ORDER_CREATE
        provenance: contract orders.yaml POST /reservations/{reservationId}/extend
      - kind: secondaryButton
        label: Check the group in
        operation: recordGroupCheckIn
        permission: ORDER_MODIFY
        provenance: contract orders.yaml POST /group-bookings/{groupBookingId}/check-in (as on BO-280)
      - kind: destructiveButton
        label: Cancel reservation
        operation: cancelReservation
        permission: ORDER_CANCEL
        provenance: contract orders.yaml DELETE /reservations/{reservationId}
  overlays:
  - id: formCreateReservation
    component: modal
    trigger: New reservation
    body: '**Collects what `createReservation` sends before it is called.** Required: `id`, `venueId`,
      `lines`, `expiresAt` (the hold, from the venue''s choices). Optional: `subjectId`, the guest or
      the group''s leader. **Holds capacity only: no ticket is issued and nothing is charged.** Opened
      from the cart''s Reserve, it carries the cart''s lines. Dismissing sends nothing.'
    bindsTo: CreateReservationRequest
    confirm:
      label: Reserve, no payment
      operation: createReservation
    dismiss:
      label: Cancel
      discards:
      - id
      - venueId
      - lines
      - expiresAt
      - subjectId
    provenance: contract orders.yaml POST /reservations · v2 cart Reserve and Bookings New reservation
  - id: confirmExtendReservation
    component: confirmDialog
    trigger: Extend the hold
    body: '**Keeps the capacity held for longer**, to the new expiry shown; refused once the reservation
      has expired.'
    confirm:
      label: Extend
      operation: extendReservation
    dismiss:
      label: Keep the current expiry
      discards: []
    provenance: contract orders.yaml POST /reservations/{reservationId}/extend
  - id: confirmCancelReservation
    component: confirmDialog
    trigger: Cancel reservation
    body: '**Releases what the reservation holds back on sale.** Names the lines and the guest; nothing
      was charged, so nothing is refunded.'
    confirm:
      label: Cancel reservation
      operation: cancelReservation
    dismiss:
      label: Keep the reservation
      discards: []
    provenance: contract orders.yaml DELETE /reservations/{reservationId}
  - id: formRecordGroupCheckIn
    component: modal
    trigger: Check the group in
    body: '**Collects what `recordGroupCheckIn` sends before it is called.** Required: `arrivedCount`.
      Optional: `additionalGuests`, `staffLeadersCount`, `arrivalGateId`, `actualArrivalAt`, `checkInIssues`.
      A group with a balance due is paid at Payment first; its tickets are issued when it is paid. Dismissing
      sends nothing.'
    bindsTo: GroupCheckInRequest
    confirm:
      label: Check in
      operation: recordGroupCheckIn
    dismiss:
      label: Cancel
      discards:
      - arrivedCount
      - additionalGuests
      - staffLeadersCount
      - arrivalGateId
      - actualArrivalAt
      - checkInIssues
    provenance: contract orders.yaml POST /group-bookings/{groupBookingId}/check-in (as on BO-280)
  states:
    loading: The reservations held at this venue, soonest expiry first, and the groups due today.
    error: Could not load. Names which read failed and leaves the reservations untouched.
    emptyFirstRun: '**No reservations held and no groups due today.** Offers New reservation (`createReservation`).'
    emptyNoResults: Nothing matches the status or expiry filter, and the reservations are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listReservations` requires, and names
      that permission. **Never an empty table**.
    denied: Reservations are listed; New reservation, Take payment and Extend need `ORDER_CREATE`, Cancel
      needs `ORDER_CANCEL` and the check-in `ORDER_MODIFY`. **The list is still shown**, so the cashier
      can fetch a supervisor to the right reservation.
    offline: '**Reservations need the network**: a hold is capacity, and only the server knows what is
      left. Offline the screen says so and sells nothing from here.'
  apis:
  - operationId: listReservations
    contract: orders
    purpose: Reservations held at this venue, soonest expiry first
    trigger: onLoad
  - operationId: getReservation
    contract: orders
    purpose: The selected reservation
    trigger: onAction
  - operationId: createReservation
    contract: orders
    purpose: Hold a sale without payment
    trigger: onAction
    invalidates:
    - listReservations
  - operationId: extendReservation
    contract: orders
    purpose: Keep the hold for longer
    trigger: onAction
    invalidates:
    - listReservations
  - operationId: convertReservation
    contract: orders
    purpose: Turn the reservation into an order to pay on arrival
    trigger: onAction
    invalidates:
    - listReservations
  - operationId: cancelReservation
    contract: orders
    purpose: Release the reservation
    trigger: onAction
    invalidates:
    - listReservations
  - operationId: listGroupArrivalCheck
    contract: orders
    purpose: Groups due to arrive today
    trigger: onLoad
  - operationId: getGroupBooking
    contract: orders
    purpose: The selected group, its leader and its order
    trigger: onAction
  - operationId: recordGroupCheckIn
    contract: orders
    purpose: Record the group's arrival
    trigger: onAction
    invalidates:
    - listGroupArrivalCheck
  entryState:
    params:
    - name: workstationId
      from: session
    - name: venueId
      from: session
    - name: cartId
      from: POS-002
      optional: true
    - name: reservationId
      from: navigation
      optional: true
    - name: groupBookingId
      from: navigation
    coldEntry: '**Resolves from the session, which carries the workstation and its venue** — the screen
      opens on the venue''s held reservations and today''s groups.'
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-031
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      match: none
      note: The approved build has no reservations or group-arrival view (its Reservations toggle under
        Tables is table bookings, POS-028). The v2 build has one; see the candidate block.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/v2-groups.jpg
      match: partial
      view: Left rail 'Bookings' (F5 'Reservations') -> a group reservation (deposit paid, balance due,
        Take payment); a confirmed unpaid group opens the encode dialog, drawn as the variant
      differences: 'Design correction (decided 1 October, POSV2-2): v2 encodes a group''s tickets as Inactive
        before payment (''Encode tickets as Inactive · Pay on arrival'', ''VALID AT GATES'', ''Set active'',
        ''Activate all on payment'', and F6 ''Encode tickets · inactive'' on the function bar). That is
        not built: a reservation creates no entitlement, so nothing is encoded before payment; on arrival
        the reservation is converted (convertReservation), paid at POS-005, and the tickets are issued
        then. A group''s deposit and balance come from the group''s order; the balance is taken at POS-005,
        and the arrival is recorded with recordGroupCheckIn. v2''s New reservation (Tentative 48 h hold
        or Confirmed) maps to createReservation with its expiry, and Extend and Cancel to extendReservation
        and cancelReservation.'
