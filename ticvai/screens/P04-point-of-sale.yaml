        provenance: carried from the previous definition
      - kind: metricTile
        bindsTo: Shift.openingFloat
        notes: Computed, never typed
        provenance: carried from the previous definition
      - kind: textField
        label: Notes
        provenance: carried from the previous definition
      - kind: detailPanel
        notes: Suggested float from the venue default. Advisory, not prefilled — a prefilled count is
          not a count
        provenance: carried from the previous definition
    - name: contextPanel
      slot: item
