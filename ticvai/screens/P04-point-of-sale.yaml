      provenance: flow F108 step 3→5 — the ticket sent here is made on the kitchen display while the guest
        pays at POS-005 (step 4)
      crossesDevice: true
      back: false
      carries:
      - ticketId
    uses:
    - posSaleToPayment
  notes: '**The counter half of F29 and F83.** The kitchen ticket already exists and P15 already renders
    it; **nothing put one on the rail from a till.**


    `markOrderCollected` closes the fulfilment clock here — **order to ready is the kitchen’s number,
    ready to collected is the counter’s**, and food under a lamp for nine minutes shows in neither alone.


    **The counter sends before it charges on a send-first outlet** (POSV2-4, audit R261; DEC-064 makes
    it the outlet''s choice; CHG-SPO-016): Send to kitchen is the step at the counter before Charge.'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listKitchenTickets` reads a population and nothing reads one of them; the detail is
    the row until a `get` exists'
  purpose: The order goes to the pass and the guest is given a number.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every kitchen ticket
        bindsTo: KitchenTicket
        columns:
        - KitchenTicket.orderNumber
        - KitchenTicket.tableLabel
        - KitchenTicket.serviceMode
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        operation: listKitchenTickets
        provenance: contract fnb.yaml GET /kitchen/tickets
      - kind: metricTile
        notes: Orders ahead, and the oldest. **A cashier quoting a wait needs the number the kitchen is
          actually working to.**
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Collected
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected kitchen ticket
        bindsTo: KitchenTicket
        columns:
        - KitchenTicket.orderNumber
        - KitchenTicket.tableLabel
        - KitchenTicket.serviceMode
        - KitchenTicket.buzzerCode
        - KitchenTicket.status
        - KitchenTicket.priority
        - KitchenTicket.targetReadyAt
        - KitchenTicket.elapsedSeconds
        operation: listKitchenTickets
        provenance: contract fnb.yaml GET /kitchen/tickets
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create F&B order
        operation: createFnbOrder
        provenance: contract fnb.yaml POST /fnb-orders
      - kind: secondaryButton
        label: Save kitchen ticket status
        operation: setKitchenTicketStatus
        provenance: contract fnb.yaml PUT /kitchen/tickets/{ticketId}/status
      - kind: secondaryButton
        label: Mark order collected
        operation: markOrderCollected
        provenance: contract fnb.yaml POST /orders/{orderId}/collected
      - kind: secondaryButton
        label: Cancel order
        operation: cancelFnbOrder
        provenance: contract fnb.yaml POST /fnb-orders/{orderId}/cancel; wiring fix, 2 October 2026
  states:
    loading: The send kitchen list.
    error: Could not load. Names which read failed and leaves the send kitchen untouched.
    emptyFirstRun: No send kitchen yet. Offers Create F&B order (`createFnbOrder`); distinct from a filter
      that matched nothing.
    emptyNoResults: Nothing matches the filter on stationId, status and the send kitchen are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listKitchenTickets` requires, and
      names that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Queued locally and sent on reconnect.** The kitchen display is on the same LAN, so a venue-wide
      outage stops both and a device outage stops neither.'
    denied: The rail is readable and **Send to kitchen is refused** without `payment.take`. Tickets already
      fired are unaffected.
  apis:
  - operationId: createFnbOrder
    contract: fnb
    purpose: Place an F&B order
    trigger: onAction
    invalidates:
    - listKitchenTickets
  - operationId: listKitchenTickets
    contract: fnb
    purpose: Kitchen ticket queue
    trigger: onLoad
  - operationId: setKitchenTicketStatus
    contract: fnb
    purpose: Advance a kitchen ticket
    trigger: onAction
    invalidates:
    - listKitchenTickets
  - operationId: markOrderCollected
    contract: fnb
    purpose: The guest took it
    trigger: onAction
    invalidates:
    - listKitchenTickets
  - operationId: cancelFnbOrder
    contract: fnb
    purpose: Cancel an unpaid sent order (the guest walked away)
    trigger: onAction
    provenance: wiring fix, 2 October 2026 (CHG-WIR-008)
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: orderId
      from: deepLink
    - name: ticketId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till is
      signed into, not navigated to — and the outlet is a property of where the till is bolted down, not
      something a cashier picks.'
    preloaded:
    - KitchenTicket.id
    - KitchenTicket.orderId
    - KitchenTicket.orderNumber
    - KitchenTicket.outletId
    - KitchenTicket.tableLabel
  wireframe:
