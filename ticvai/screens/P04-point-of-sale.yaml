  notes: 'Design: Park_POS_dc.html. The mockup warns "you will not be able to edit the float amount after
    the shift has started" — that is correct and deliberate. An editable opening float makes close-out
    variance meaningless. **Improved 20 August against the client design board**, answering 2 board screen(s):
    Opening Float Management; Shift Opening & Login. **Owns POS board frame(s) POS-2A, POS-3D** (client
    pack, 24 August). **Assigned by board purpose rather than by operation overlap** — three attempts
    at deriving that mapping produced plausible nonsense, and a reader who trusts a bad table is worse
    off than one who has none.


    **Blind close (decided 2 October 2026, Chinmay; CHG-FIN-003).** The cashier never sees the expected
    cash: not while counting, not after submitting, not as a sales or takings total from which it could
    be worked out (MoM 12 Aug 2026 section 19, DI-271; MoM 9 Sep 2026 4.18, DI-806: "if a cashier knew
    they had a small surplus, they could pocket it"). The count is submitted with `submitShiftCount`,
    which answers only what happens next (closed, with your supervisor, or awaiting close approval); the
    variance alerts the supervisors on the venue''s alerting channel and appears on BO-040. The cashier
    may add a reason and a note with every count (DI-803). A recount the supervisor asks for is counted
    blind again (DI-804). Retail practice: docs/active/research-uae-vat-and-blind-close-2-october.md.
    On this screen: the edge to POS-007 no longer carries `expectedCash`, the shift panels no longer show
    sales, refunds or lifts totals, and closing goes through POS-007''s blind count.


    **A shift "Under review" does not stop this one** (decided 2 October 2026, Chinmay; DEC-059; CHG-CSP-012;
    CHG-SPO-003). `openShift` refuses only while a shift is open or suspended on this workstation; a counted
    shift waiting for its supervisor has its own box and count, so the next cashier opens with a new float.'
  density: touchLarge
  boardFrames:
  - POS Board 3.dc.html#pos-3d
  - TICVAI Boards v2.dc.html#pos-2a
  pattern: approvalInbox
  patternReason: '`approveShiftOpen` decides items that `listCashMovements` queues — every row is waiting
    for a person, so the empty state is success'
  purpose: Count the opening float and open the till.
  gaps:
  - operation: getWorkstationHealth
    why: '**`getWorkstationHealth` declares its response inline**, so the component that shows it names
