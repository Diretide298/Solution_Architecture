      trigger: The kitchen makes it and bumps it
      provenance: flow F108 step 4→5
      crossesDevice: true
      back: false
    - to: POS-010
      trigger: The guest asks to add a locker to the ticket they just bought
      provenance: flow F58 step 6→7
      carries:
      - orderId
