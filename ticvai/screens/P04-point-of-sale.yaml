- id: POS-008
  name: Reports
  module: Reports
  requiresModule: analytics
  wave: 2
  capability: C21
  implementation:
    app: venue-pos
    route: /reports/reports
    component: apps/venue-pos/src/routes/reports/ReportsDashboard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    - POS-007
    exitTo:
    - POS-009
    uses:
    - posPrimaryRail
    transitions:
    - to: POS-009
      trigger: Staffing against takings is read
      provenance: flow F74 step 2→3
      operation: runReport
  notes: 'Design: Park_POS_dc.html reports view. Read routing is analytical — never the primary, under
    any load. **Authoring operations removed 24 August**: createReport, updateReport. **A till sells the
    catalogue; it does not author it.** These arrived in the 18 August bulk attach — the same defect that
    put 21 of 39 review rows in one bucket — and a flow walking a ticket sale is what surfaced them.


    **One reporting area, one set of numbers** (decided 2 October 2026, Chinmay; CHG-FIN-006; DI-721,
    DI-702). This screen is a scoped window onto the reporting area (Analytics, P16): it runs the same
    seeded report definitions and reads the same seeded KPIs, so its figures equal what Analytics shows
    for the same scope, period and as-of time. It computes no total of its own and shows the as-of time
    on every figure.


    **On the till** (CHG-FIN-003): the terminal day view withholds its cash-tender figures from the cashier
    of an open shift, since float plus cash takings is the expected drawer; what else a cashier sees is
    the per-role switch of DI-802.


    **This terminal''s day, not the venue''s** (design-notes corrections finance-insights POS-008; CHG-SPO-015).
    No report authoring (Retire report, Save query), no statutory statements and no Export at the till
    (CSV and Excel export were deferred by POSV2-1). Do not copy the approved prototype''s cross-venue
    command dashboard. The per-cashier foreign-currency collections report has no cashier-tier read yet
    (open entry CHG-SPO-019).'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listReports` reads the population and `getFinancialReport` reads one of them — list,
    select, act'
  purpose: See how the day is going from the terminal.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: searchField
        label: Search
        operation: listReports
        notes: Sends `?search=` to `listReports`.
        provenance: contract reporting.yaml GET /reports
      - kind: dataTable
        label: Every report definition
        bindsTo: ReportDefinition
        columns:
        - ReportDefinition.name
        - ReportDefinition.description
        - ReportDefinition.category
        - ReportDefinition.maxDateRangeDays
        - ReportDefinition.isSystem
        operation: listReports
        provenance: contract reporting.yaml GET /reports
      - kind: metricTile
        notes: Gross, tickets, average basket
        provenance: carried from the previous definition
      - kind: chart
        notes: Revenue by hour, revenue mix by category — as designed
        provenance: carried from the previous definition
      - kind: dataTable
        notes: Top selling products with units, revenue, share
        provenance: carried from the previous definition
      - kind: detailPanel
        notes: Sales channels and terminal health
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected report definition
        bindsTo: ReportDefinition
        columns:
        - ReportDefinition.name
        - ReportDefinition.description
        - ReportDefinition.category
        - ReportDefinition.dataSource
        - ReportDefinition.columns
        - ReportDefinition.filters
        - ReportDefinition.estimatedCost
        - ReportDefinition.lastRunAt
        operation: getReport
        provenance: contract reporting.yaml GET /reports/{reportId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Run report
        operation: runReport
        provenance: contract reporting.yaml POST /reports/{reportId}/run
        notes: Runs the seeded report `terminalDayView` (sales, tenders, voids and refunds for this terminal
          today), its `reportId` taken from `listSeededReports` (proposed, client to correct; decided
          28 September, audit R282).
      - kind: secondaryButton
        label: Ask reporting question
        operation: askReportingQuestion
        provenance: contract reporting.yaml POST /reports/ask
  overlays:
  - id: formRunReport
    component: modal
    trigger: Run report
    body: '**Collects what `runReport` sends before it is called.** Nothing in the body is required. Optional:
      `parameters`, `venueId`, `dateFrom`, `dateTo`, `forceAsync`. Dismissing sends nothing; the screen
      behind is unchanged.'
    bindsTo: RunReportRequest
    confirm:
      label: Run report
      operation: runReport
    dismiss:
      label: Cancel
      discards:
      - parameters
      - venueId
      - dateFrom
      - dateTo
      - forceAsync
    provenance: client-verified
  - id: formAskReportingQuestion
    component: modal
    trigger: Ask reporting question
    body: '**Collects what `askReportingQuestion` sends before it is called.** Required: `question`. Optional:
      `conversationId`, `venueId`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Ask reporting question
      operation: askReportingQuestion
    dismiss:
      label: Cancel
      discards:
      - question
      - conversationId
      - venueId
    provenance: client-verified
  states:
    loading: The reports list.
    error: Could not load. Names which read failed and leaves the reports untouched.
    emptyFirstRun: No reports yet. **Offers no create action** — this screen declares no operation that
      makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing matches the filter on category, search and the reports are still there. Names
      the active filter and offers to clear it.
    emptyNoAccess: 'Shown when the caller holds neither REPORT_VIEW_OWN (a cashier''s own figures) nor
