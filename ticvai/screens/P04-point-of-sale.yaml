      provenance: 'derived — POS-020 declares entryState.params reportId, requestId, shiftId and POS-002
        holds none of them. The edge carries nothing: shiftId, reportId, requestId only pre-select (deep
        link or optional), and POS-020 opens on its own'
    - to: POS-008
      trigger: Reports
      provenance: 'derived — POS-008 declares entryState.params conversationId, reportId and POS-002 holds
        none of them. The edge carries nothing: conversationId, reportId only pre-select (deep link or
        optional), and POS-008 opens on its own'
    - to: POS-030
