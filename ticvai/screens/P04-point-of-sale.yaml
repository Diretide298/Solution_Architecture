      - kind: secondaryButton
        label: Create order
        operation: createOrder
        provenance: contract orders.yaml POST /orders
  overlays:
  - id: formSyncOrders
    component: modal
    trigger: Sync orders
    body: '**Collects what `syncOrders` sends before it is called.** Required: `deviceId`, `orders`. Dismissing
