      - kind: searchField
        label: Scan or search
        provenance: carried from the previous definition
      - kind: dataTable
        label: Basket
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Pay
        provenance: carried from the previous definition
      - kind: cardList
        label: Category tabs (including Lockers), REFINE chips and Scan
        operation: lookupMerchandise
        notes: 'As drawn in v2 (POSV2-13, DEC-554): category tabs including Lockers, REFINE chips and
          Scan (a barcode or SKU resolves through `lookupMerchandise`). No inventory ledger on the till.
          **Merchandise words, not ticket words**: a chip reads "Low stock", never "Low capacity", and
          no tile carries an "Open-dated · any day" validity. An item with variants (size, colour) opens
