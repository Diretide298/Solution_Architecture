- id: POS-007
  name: Close Shift
  module: Shift
  requiresModule: core
  wave: 1
  capability: C11
  implementation:
    app: venue-pos
    route: /shift/close-shift
    component: apps/venue-pos/src/routes/shift/CloseShiftWizard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    - POS-013
    - POS-025
    exitTo:
    - POS-001
    - POS-008
    - POS-009
    inferred: true
    transitions:
    - to: POS-001
      trigger: Close and sign out
      control: primaryButton#lockShift
      precondition: closeStep == 'summary'
      operation: closeShift
      carries:
      - shiftId
      - countedCash
      - variance
      discards:
      - cart
      - guest
      - table
      - discount
      onFailure:
      - when: requiresAcceptance
        to: POS-007#pendingVariance
        note: '**No pre-close PIN hold** (decided 28 September, audit R080 (e)). `closeShift` is submitted
          with the blind count; when `ShiftCloseResult.requiresAcceptance` is true the shift is `pendingVariance`
          and a supervisor accepts it on this till with `acceptShiftVariance` (OVERSHORT_ACCEPT, PIN step-up),
          the only path for a variance. The expected figure is never shown before the count (blindCount).'
      provenance: board TICVAI POS Terminal · signOut (5641) + lockShift (5687); flow F32 step 6
    - to: POS-008
      trigger: The day is reported
      provenance: flow F74 step 1→2
    - to: BO-024
      trigger: The supervisor reviews the shift and the deposit reconciles
      provenance: flow F32 step 7→8
      crossesDevice: true
      back: false
    - to: POS-009
      trigger: Staff Roster
      provenance: 'derived — POS-009 declares entryState.params  and POS-007 holds none of them. The edge
        carries nothing: POS-009 needs nothing to open'
    uses:
    - posPrimaryRail
  notes: 'The blind count is the whole control. Not in the mockup, which shows only Begin Shift. **Improved
    20 August against the client design board**, answering 2 board screen(s): Cash Reconciliation & Variance
    Management; Shift Closing & Settlements. **Owns POS board frame(s) POS-2F, POS-3F** (client pack,
    24 August). **Assigned by board purpose rather than by operation overlap** — three attempts at deriving
    that mapping produced plausible nonsense, and a reader who trusts a bad table is worse off than one
