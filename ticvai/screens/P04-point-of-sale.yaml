  notes: 'Design: Park_POS_dc.html, "Cash Payment". Add Tip appears in the design and had no operation
    until 14 August. A tip posts to a liability, not to sales. **The one surface that takes foreign cash**
    (4.6.11). Records `tenderCurrency`, `tenderAmount` and the `fxRate` applied, and **gives change in
    base currency only** — a till giving change in five currencies needs five floats and the variance
    becomes unattributable. **Improved 20 August against the client design board**, answering 1 board
    screen(s): Checkout, Payment & Receipt. **Cross-platform navigation removed 24 August**: BO-048. **A
    till does not navigate to a back office and a guest app does not navigate to either** — those are
    device handovers, and a flow declares them with `crossesDevice` rather than a screen pretending there
    is a link. **Reaches the counter screens from 24 August.** **A till has one tender flow, not one per
    module** — a food order and a ticket both settle here and return to whichever board they came from.'
  density: touchLarge
  boardFrames:
  - Retail Board 3.dc.html#ret-3e
  machine:
    key: payStage
    initial: idle
    provenance: client-verified
    states:
      idle:
        note: Nothing has been sent to the terminal yet.
      processing:
        operation: createPayment
        note: Authorisation in flight. **The idempotency key is minted here and reused on every subsequent
          attempt** — it is what makes the inquiry path safe.
      unknown:
        note: '**The terminal charged a card and never answered.** Inquiry, never retry: a retry takes
          the money a second time, and the guest is standing there.'
      checking:
        operation: inquirePaymentStatus
        note: Asking the gateway what actually happened to the attempt.
      completed:
        terminal: true
        goes: POS-002
        note: Settled. The till returns to the catalogue for the next sale.
      failed:
        terminal: true
        retryTo: idle
        note: Declined or cancelled, and known to be so. Safe to take again.
    transitions:
    - from: idle
      'on': Charge
      to: processing
    - from: processing
      'on': approved
      to: completed
    - from: processing
      'on': declined or cancelled
      to: failed
    - from: processing
      'on': gatewayTimeout
      to: unknown
      note: The network dropped between the charge and the answer.
    - from: unknown
      'on': Check status
      to: checking
    - from: checking
      'on': settled
      to: completed
      note: Confirmed with the gateway — the payment succeeded and no duplicate was created.
    - from: checking
      'on': notFound
      to: failed
  pattern: listDetail
