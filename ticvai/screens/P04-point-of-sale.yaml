    trigger: onAction
    invalidates:
    - listTableReservations
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: tableId
      from: navigation
    - name: visitId
      from: navigation
    - name: reservationId
      from: navigation
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
