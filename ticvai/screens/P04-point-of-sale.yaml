- id: POS-020
  name: Shift Exceptions & Alerts
  module: Sell
  requiresModule: analytics
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/shift-exceptions-alerts
    component: apps/venue-pos/src/routes/sell/ShiftExceptionsAlertsBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    - POS-018
    exitTo:
    - POS-002
    - POS-007
    transitions:
    - to: POS-007
      trigger: End of shift
      provenance: flow F32 step 5→6
      operation: recordNoSale
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      provenance: 'derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId
        and POS-020 holds none of them. The edge carries nothing: cardCode, orderId, productId, promotionId
        only pre-select (deep link or optional), and POS-002 opens on its own'
  notes: '**Added 20 August from the client design board.** The operations existed and no screen called
    them. **Owns POS board frame(s) POS-3E** (client pack, 24 August). **Assigned by board purpose rather
    than by operation overlap** — three attempts at deriving that mapping produced plausible nonsense,
    and a reader who trusts a bad table is worse off than one who has none.


    **Cash variances are for the supervisor, not the cashier** (decided 2 October 2026, Chinmay; CHG-FIN-003).
    A shift counted beyond the venue threshold raises an alert to the supervisors holding OVERSHORT_ACCEPT;
    the `shiftSummary` report (expected against counted, variance) runs only for them, and is never shown
    to the cashier whose shift it is. The cashier''s own till shows no expected cash anywhere.


    Workstation and shift are this till''s by default and are picked, never typed as ids (design-notes
    correction finance-insights POS-020; CHG-SPO-015).'
  density: touchLarge
  boardFrames:
  - POS Board 3.dc.html#pos-3e
  pattern: approvalInbox
  patternReason: '`decideApprovalRequest` decides items that `listAlerts` queues — every row is waiting
    for a person, so the empty state is success'
  purpose: Shift Exceptions & Alerts — from the client design board, 20 August.
  gaps:
  - operation: recordNoSale
    why: '**A no-sale with no reason is the single most reliable indicator of till theft** (F32 step 5),
      and nothing in the board or this screen captures one. The board''s home hot key opens the drawer
      with no permission check and no audit record.'
    source: POS-BOARD-AUDIT.md C-4, C-5
  layout:
    template: split
    regions:
    - name: contentBody
      slot: queue
      components:
      - kind: textField
        label: Status
        operation: listAlerts
        notes: Sends `?status=` to `listAlerts`.
        provenance: contract reporting.yaml GET /alerts
      - kind: textField
        label: Severity
        operation: listAlerts
        notes: Sends `?severity=` to `listAlerts`.
        provenance: contract reporting.yaml GET /alerts
      - kind: dataTable
        label: Waiting for a decision
        bindsTo: Alert
        columns:
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.threshold
        - Alert.acknowledgedAt
        - Alert.resolvedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
      - kind: primaryButton
        label: Confirm
        provenance: carried from the previous definition
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected alert
        bindsTo: Alert
        columns:
        - Alert.id
        - Alert.ruleId
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.observedValue
        - Alert.threshold
        - Alert.scopePath
        - Alert.acknowledgedByPrincipalId
        - Alert.acknowledgedAt
        - Alert.resolvedAt
        - Alert.escalatedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
    - name: actionBar
      slot: decision
      components:
      - kind: primaryButton
        label: Record no sale
        operation: recordNoSale
        provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
      - kind: secondaryButton
        label: Create approval request
        operation: createApprovalRequest
        provenance: contract approvals.yaml POST /approval-requests
      - kind: secondaryButton
        label: Decide approval request
        operation: decideApprovalRequest
        provenance: contract approvals.yaml POST /approval-requests/{requestId}/decide
      - kind: secondaryButton
        label: Run report
        operation: runReport
        provenance: contract reporting.yaml POST /reports/{reportId}/run
        notes: Runs the seeded report `shiftSummary` (each till shift's takings, expected against counted
          cash, and variance), its `reportId` taken from `listSeededReports` (proposed, client to correct;
          decided 28 September, audit R282).
        permission: OVERSHORT_ACCEPT
  states:
    loading: The shift exceptions alerts list.
    error: Could not load. Names which read failed and leaves the shift exceptions alerts untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: Nothing matches the filter on status, severity, workstationId, shiftId, itemId and
      the shift exceptions alerts are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `REPORT_VIEW_VENUE`, which `listAlerts` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**The till keeps taking money; this screen does not keep showing alerts.** `listAlerts`
      reads the analytical replica (ADR-0016) and there is nothing local to read — the offline trading
      happens on POS-002 and POS-013, and this monitor goes quiet until the network returns. **Corrected
      24 August**: the prose claimed continued function the wiring cannot deliver.'
  apis:
  - operationId: recordNoSale
    contract: shift
    purpose: Open the drawer without a sale
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: listAlerts
    contract: reporting
    purpose: What is currently raised
    trigger: onLoad
  - operationId: createApprovalRequest
    contract: approvals
    purpose: Raise a request
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: decideApprovalRequest
    contract: approvals
    purpose: Approve or reject
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: runReport
    contract: reporting
    purpose: Shift summary -- runs the seeded report shiftSummary (audit R282)
    trigger: onAction
    invalidates:
    - listAlerts
  entryState:
    params:
    - name: workstationId
      from: session
    - name: shiftId
      from: deepLink
    - name: reportId
      from: deepLink
    - name: requestId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
      not navigated to. An approval request opened from the queue.'
    preloaded:
    - Alert.id
    - Alert.ruleId
    - Alert.raisedAt
    - Alert.severity
    - Alert.status
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P04 Venue POS.dc.html#pos-020
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: partial
      view: Top-bar bell -> 'Notifications' panel; Reports -> 'Needs attention'
      differences: Alerts are a notification list with no screen of their own. There are no approval-request
        decisions (the PIN modal is inline and synchronous) and no no-sale reason log.
    derivedFrom: wireframes/reference/POS Board 3.dc.html
    source: Claude Design POS pack, 24 August
    note: '**Drawn by Claude Design on `POS Board 3.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 5 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formRecordNoSale
    component: modal
    trigger: Record no sale
    body: '**Collects what `recordNoSale` sends before it is called.** Required: `id`, `reason`, `recordedAt`.
      Optional: `note`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Record no sale
      operation: recordNoSale
    dismiss:
      label: Cancel
      discards:
      - id
      - reason
      - recordedAt
      - note
    provenance: client-verified
  - id: formCreateApprovalRequest
    component: modal
    trigger: Create approval request
    body: '**Raised from the transaction it is about**: the record, contract and subject type and the
      scope come from the selected exception, never typed. The person adds the reason only (design-notes
      correction finance-insights POS-020).'
    bindsTo: CreateApprovalRequest
    confirm:
      label: Create approval request
      operation: createApprovalRequest
    dismiss:
      label: Cancel
      discards:
      - id
      - kind
      - subjectContract
      - subjectType
      - subjectId
      - scopePath
      - summary
      - amount
      - attributes
      - justification
      - isDraft
    provenance: client-verified
  - id: formDecideApprovalRequest
    component: modal
    trigger: Decide approval request
    body: '**Collects what `decideApprovalRequest` sends before it is called.** Required: `decision`.
      Optional: `comment`, `reason`, `stepUpToken`, `signature`. Dismissing sends nothing; the screen
      behind is unchanged.'
    confirm:
      label: Decide approval request
      operation: decideApprovalRequest
    dismiss:
      label: Cancel
      discards:
      - decision
      - comment
      - reason
      - stepUpToken
      - signature
    provenance: client-verified
  - id: formRunReport
    component: modal
    trigger: Run report
    body: '**Collects what `runReport` sends before it is called.** Nothing in the body is required. Optional:
