    component: apps/venue-pos/src/routes/sell/SalesExceptionsControlsOperationalBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    exitTo:
    - POS-001
    inferred: false
    notes: '**Returns to POS-001.** Stated on 4 September: this screen declared where it is reached from
      and no way to leave, so whoever landed on it was stuck. The return path is the same edge travelled
      the other way, not a guess about the product.'
    transitions:
    - to: POS-001
      trigger: Begin Shift
