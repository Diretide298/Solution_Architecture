- id: POS-007
  name: Close Shift
  module: Shift
  requiresModule: core
  wave: 1
  capability: C11
  implementation:
    app: venue-pos
    route: /shift/close-shift
    component: apps/venue-pos/src/routes/shift/CloseShiftWizard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    - POS-013
    - POS-025
    exitTo:
    - POS-001
    - POS-008
    - POS-009
    inferred: true
    transitions:
    - to: POS-001
      trigger: Close and sign out
      control: primaryButton#lockShift
      precondition: closeStep == 'summary'
      operation: submitShiftCount
      carries:
      - shiftId
      - countedCash
      discards:
      - cart
      - guest
      - table
      - discount
      onFailure:
      - when: referredToSupervisor
        to: POS-007#pendingVariance
        note: '`submitShiftCount` answered `referredToSupervisor`: the shift is `pendingVariance` and
          the supervisor is alerted; the till shows no amount (CHG-FIN-003; audit R080 (e)).'
      provenance: board TICVAI POS Terminal · signOut (5641) + lockShift (5687); flow F32 step 6
    - to: POS-008
      trigger: The day is reported
      provenance: flow F74 step 1→2
    - to: BO-024
      trigger: The supervisor reviews the shift and the deposit reconciles
      provenance: flow F32 step 7→8
      crossesDevice: true
      back: false
    - to: POS-009
      trigger: Staff Roster
      provenance: 'derived — POS-009 declares entryState.params  and POS-007 holds none of them. The edge
        carries nothing: POS-009 needs nothing to open'
    uses:
    - posPrimaryRail
  notes: 'The blind count is the whole control. Not in the mockup, which shows only Begin Shift. **Improved
    20 August against the client design board**, answering 2 board screen(s): Cash Reconciliation & Variance
    Management; Shift Closing & Settlements. **Owns POS board frame(s) POS-2F, POS-3F** (client pack,
    24 August). **Assigned by board purpose rather than by operation overlap** — three attempts at deriving
    that mapping produced plausible nonsense, and a reader who trusts a bad table is worse off than one
    who has none.


    **Blind close (decided 2 October 2026, Chinmay; CHG-FIN-003).** The cashier never sees the expected
    cash: not while counting, not after submitting, not as a sales or takings total from which it could
    be worked out (MoM 12 Aug 2026 section 19, DI-271; MoM 9 Sep 2026 4.18, DI-806: "if a cashier knew
    they had a small surplus, they could pocket it"). The count is submitted with `submitShiftCount`,
    which answers only what happens next (closed, with your supervisor, or awaiting close approval); the
    variance alerts the supervisors on the venue''s alerting channel and appears on BO-040. The cashier
    may add a reason and a note with every count (DI-803). A recount the supervisor asks for is counted
    blind again (DI-804). Retail practice: docs/active/research-uae-vat-and-blind-close-2-october.md.


    **The cashier signs out; the supervisor resolves later** (decided 2 October 2026, Chinmay, batch 3
    #1, batch 6 #173 to #175 and the pre-apply round; DEC-059, DEC-175; CHG-SPO-003). A shift over the
    threshold is "Under review" on the cashier''s view, never blocks the next cashier''s shift on this
    till, and is resolved by a supervisor with their PIN on any till (accept, or ask for a recount) or
    in the daily cash reconciliation (BO-043). The supervisor''s close is on this screen: `closeShift`
    behind SHIFT_CLOSE_OTHER and the supervisor''s PIN, any till (pre-apply round; CHG-SPO-021; check-finance-rules
    admits closeShift on a till only from a supervisor''s control).'
  density: touchLarge
  boardFrames:
  - POS Board 3.dc.html#pos-3f
  - TICVAI Boards v2.dc.html#pos-2f
  machine:
    key: closeStep
    initial: count
    provenance: client-verified
    states:
      count:
        note: Counting the drawer down, denomination by denomination, against the float declared at open.
      summary:
        operation: submitShiftCount
        note: 'The count is entered. `submitShiftCount` submits it blind: the till learns only whether
          the shift closed or went to the supervisor (CHG-FIN-003).'
      pendingVariance:
        operation: acceptShiftVariance
        note: '**Counted, and the supervisor has been alerted; the cashier sees "Under review" and may
          sign out.** A supervisor holding OVERSHORT_ACCEPT, after a PIN step-up on any till, sees counted,
          expected and variance and accepts it, asks for a recount (`rejectShiftVariance`) or closes it
          (`closeShift`, CHG-SPO-021); or does so in the daily cash reconciliation (BO-043). Not the cashier
          whose shift it is (audit R080 (e); CHG-FIN-003; DEC-059, DEC-175).'
      recountRequested:
        operation: rejectShiftVariance
        note: The supervisor asked for a recount; the cashier recounts blind and resubmits (DEC-175; CHG-CSP-013).
    transitions:
    - from: count
      'on': Submit count
      to: summary
    - from: summary
      'on': Back to count
      to: count
    - from: summary
      'on': submitShiftCount returns referredToSupervisor
      to: pendingVariance
      note: Within the threshold the shift closes and the screen leaves for POS-001; beyond it the shift
        is `pendingVariance` (audit R080 (e)).
    - from: pendingVariance
      'on': rejectShiftVariance (supervisor PIN)
      to: recountRequested
      note: The shift stays pendingVariance in the contract; the till shows "Recount requested" (CHG-CSP-013).
    - from: recountRequested
      'on': Recount
      to: count
  pattern: approvalInbox
  patternReason: '`approveShiftOpen` decides items that `listCashMovements` queues — every row is waiting
