  states:
    loading: The begin shift list.
    error: Could not load. Names which read failed and leaves the begin shift untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: 'Never shown: `listCashMovements` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: Shown when the caller lacks `SHIFT_OPEN`, which `getCurrentShift` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: Opens locally and syncs. A gate that cannot open a till because the network is down is a
      gate that does not sell
    denied: Sign-in succeeds and the shift will not open — the operator's role does not hold `sale.create`
      on this terminal. The float count is kept, not discarded, and a supervisor can open the shift against
      the same count.
