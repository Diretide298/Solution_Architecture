  states:
    loading: The saved floor.
    error: Could not load. Names which read failed and leaves the floor untouched.
    emptyFirstRun: No floor yet. Carries the create action and says what the till does in the meantime.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**The floor is held locally and reconciles on sync.** Seating, covers and server changes
      made offline queue; two tills changing the same visit while disconnected reconcile server-wins on
      reconnect and the till says which change stood. (Moving and merging tables is not on this screen
      until after r2, POSV2-8; design-notes correction fnb-retail POS-028.)'
  apis:
