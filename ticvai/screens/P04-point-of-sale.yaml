    source: docs/registers/pos-v2-decisions.md
  - operation: mergeTableVisits
    removed: true
    why: Deferred until after r2 (POS v2 decision POSV2-8, 1 October 2026). Kept in the fnb contract and
      on EMP-058; comes back to the till in a later release.
    source: docs/registers/pos-v2-decisions.md
  wireframe:
    status: review
    provenance: designed
    board: wireframes/P04 Venue POS.dc.html#pos-028
    prototype:
      file: sources/designs/TICVAI_POS_Terminal_client_approved.html
      rev: TICVAI OS 4.2.1, build 2026.08.14
      verified: 2026-09-10
      match: partial
      view: Left rail 'Tables' -> 'Table service' | 'Reservations' toggle
      differences: There is no move, merge or close/clear of a table visit; tapping a table only drops
        into the F&B catalogue. The prototype adds reservation creation with a deposit, which goes beyond
        listTableReservations / seatTableReservation.
    candidate:
      file: sources/designs/TICVAI_POS_Terminal_v2.html
      rev: 'v2, 1 October 2026 (TICVAI POS Terminal (3).html): ours, not client-approved'
      captured: '2026-10-01'
      capture: wireframes/incoming/P04-pos-v2/img/pos-028.jpg
      match: partial
      view: 'Left rail ''Tables'' -> ''Table service'': halls (Main Hall, Terrace, Majlis rooms), the
        plan drawn to scale, status filters, the hall''s table list with Seat & order / Recall check /
        Settle bill / Seat booking'
      differences: 'v2: three halls (Main Hall, Terrace, Majlis rooms), the floor plan drawn to scale
        with status filters (vacant, occupied, bill requested, reserved), and the hall''s table list with
        Seat & order, Recall check, Settle bill and Seat booking. Reservations takes a sitting with party
        size, the table held for, the tables that fit and an optional holding deposit. Still no close
        / clear of a table visit. Decided 1 October (POSV2-8): moving and merging tables is deferred until
        after r2 and taken off this screen; moveTableVisit and mergeTableVisits stay in the contract and
