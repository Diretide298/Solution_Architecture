        - Shift.workstationId
        - Shift.venueId
        - Shift.scopePath
        - Shift.principalId
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        operation: listShifts
        provenance: contract shift.yaml GET /shifts
      - kind: dataTable
        label: Every denomination
        bindsTo: Denomination
        columns:
        - Denomination.id
        - Denomination.currencyCode
        - Denomination.displayName
        - Denomination.kind
        - Denomination.sortOrder
        - Denomination.isActive
        - Denomination.value
        operation: listDenominations
        provenance: contract shift.yaml GET /denominations
      - kind: numberField
        label: Denomination count
        notes: Per denomination, from the region settings — the mockup shows AED 200 down to coins. Not
