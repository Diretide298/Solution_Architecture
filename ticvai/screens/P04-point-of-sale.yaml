    - name: outletId
      from: session
    - name: tableId
      from: navigation
    - name: visitId
      from: navigation
    - name: reservationId
      from: navigation
    coldEntry: '**Resolves from the session, which carries the workstation** — a till is signed into,
      not navigated to.'
  requiresModule: fnb
  gaps:
  - operation: moveTableVisit
    removed: true
    why: Deferred until after r2 (POS v2 decision POSV2-8, 1 October 2026). Kept in the fnb contract and
