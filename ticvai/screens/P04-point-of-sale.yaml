    confirm:
      label: Sync orders
      operation: syncOrders
    dismiss:
      label: Cancel
      discards:
      - deviceId
      - orders
    provenance: client-verified
  - id: formCreateOrder
    component: modal
    trigger: Create order
    body: '**Collects what `createOrder` sends before it is called.** Required: `id`, `venueId`, `channel`,
      `lines`, `recordedAt`. Optional: `shiftId`, `subjectId`, `guestLinkId`, `catalogueBundleVersion`.
      Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: CreateOrderRequest
    confirm:
      label: Create order
      operation: createOrder
    dismiss:
      label: Cancel
      discards:
      - id
      - venueId
      - channel
      - lines
      - recordedAt
      - shiftId
      - subjectId
      - guestLinkId
      - catalogueBundleVersion
    provenance: client-verified
  states:
    loading: The mobile pos event list.
    error: Could not load. Names which read failed and leaves the mobile pos event untouched.
    emptyFirstRun: No mobile pos event yet. Offers Create order (`createOrder`).
    emptyNoResults: 'Never shown: nothing on this screen filters its list, so an empty list is always
      the first-run state above.'
    emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listSyncRejections` requires, and
      names that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Working from the local journal.** The till keeps taking money; this reconciles on sync.'
    denied: The sync queue is readable by anyone on shift. Resolving a conflict changes stock and needs
      `inventory.conflict.resolve`; a supervisor PIN unlocks it in place.
  apis:
  - operationId: syncOrders
    contract: orders
    purpose: Replay orders recorded offline
    trigger: onAction
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: listSyncRejections
