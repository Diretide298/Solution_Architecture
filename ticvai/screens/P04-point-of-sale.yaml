        on merchandise (DI-354; design-notes correction fnb-retail POS-023).'
  apisNote: 'Rebuilt 9 September 2026 from the 5 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
