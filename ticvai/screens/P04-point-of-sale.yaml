    purpose: The party asked to pay
    trigger: onAction
    provenance: wiring fix, 2 October 2026 (CHG-WIR-008)
  - operationId: splitBill
    contract: fnb
    purpose: Split by amount, covers, category, item or seat
    trigger: onAction
    provenance: wiring fix, 2 October 2026 (CHG-WIR-008)
  - operationId: updateTableVisit
    contract: fnb
    purpose: 'Change covers on the visit (the till changes covers only in Block A; decided 2 October 2026,
