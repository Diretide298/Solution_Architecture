      capture: wireframes/incoming/P04-pos-v2/img/pos-021.jpg
      match: exact
      view: Left rail 'F&B' (category tabs with counts, REFINE chips, Quick service order type)
      differences: 'v2: category tabs with counts (Popular, Mains, Sides, Drinks, Desserts), REFINE chips
        and Scan; the cart takes the order type. The header still reads ''kitchen fires on payment'',
        which the 28 September decision replaced (audit R261: send to kitchen, then charge, for every
