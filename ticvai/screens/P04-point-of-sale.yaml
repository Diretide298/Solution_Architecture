        carries nothing: POS-023 needs nothing to open'
    - to: POS-022
      trigger: Charged — back to the pass, where the order already sent to the kitchen is handed over
        (send to kitchen, then charge; audit R261)
      provenance: flow F108 step 4→6 — paid at step 4, collected at the pass at step 6 once the kitchen
        (step 5, another device) has bumped it; the send itself is POS-022 → POS-005, step 3→4
      carries:
      - orderId
