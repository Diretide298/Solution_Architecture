- id: POS-022
  name: Send to Kitchen
  module: Sell
  requiresModule: fnb
  wave: 1
  implementation:
    app: venue-pos
    route: /sell/send-to-kitchen
    component: apps/venue-pos/src/routes/sell/SendToKitchenBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    - POS-029
    exitTo:
    - POS-005
    - POS-002
    transitions:
    - to: POS-005
      trigger: Send to kitchen, then charge
      precondition: order.lineCount > 0
      guard: payment.take
      carries:
      - orderId
      - tableLabel
      - courses
      - cart
      provenance: board TICVAI POS Terminal · queue STAGES (3483). **Send to kitchen, then charge, for
        every POS F&B order** — the ticket fires on send and the till charges after (decided 28 September,
        audit R261); the board's "fires on payment for quick service" is superseded. Flow F108 step 3→4.
    - to: POS-002
      trigger: Sell — Ticket Catalogue
      carries:
      - orderId
      provenance: derived — POS-002 declares entryState.params cardCode, orderId, productId, promotionId
        and POS-022 holds orderId, so an edge into it carries them
    - to: KIT-002
      trigger: The kitchen makes it and bumps it
      provenance: flow F108 step 3→5 — the ticket sent here is made on the kitchen display while the guest
        pays at POS-005 (step 4)
      crossesDevice: true
      back: false
      carries:
      - ticketId
    uses:
    - posSaleToPayment
  notes: '**The counter half of F29 and F83.** The kitchen ticket already exists and P15 already renders
    it; **nothing put one on the rail from a till.**


    `markOrderCollected` closes the fulfilment clock here — **order to ready is the kitchen’s number,
    ready to collected is the counter’s**, and food under a lamp for nine minutes shows in neither alone.'
  density: touchLarge
  pattern: listDetail
  patternReason: '`listKitchenTickets` reads a population and nothing reads one of them; the detail is
    the row until a `get` exists'
  purpose: The order goes to the pass and the guest is given a number.
