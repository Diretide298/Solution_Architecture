    the fnb contract and on the staff app''s EMP-058, and come back to the till in a later release. The
    v2 build draws neither.


    **Change covers and change server in Block A; table transfer after r2** (decided 2 October 2026, Chinmay,
    batch 3 #3; DEC-068; CHG-SPO-006). Covers use `updateTableVisit`, the server `transferTableVisit`;
    moving the party stays on the staff app (EMP-058). Reserved, Table closed and Make available follow
    the client''s table states (DEC-202, DI-336).'
