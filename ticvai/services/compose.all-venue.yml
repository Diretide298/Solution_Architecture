# **Identical in everything but topology.** Same images, same Postgres flags, same Redis, same limits.
# Only placement changes — that is the whole experiment, and anything else differing invalidates it.

# **Agent 1 — every service per venue.** 16 services × 3 venues = 48 containers for a
# three-venue tenant. **Refuted analytically before running**: IdentityService carries 81
# inbound cross-service touches and CrossRegionService has no counterpart at venue level.
# Run it anyway — the connection arithmetic is the number worth having.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticvai
      POSTGRES_PASSWORD: ticvai
      POSTGRES_DB: ticvai
    command: postgres -c max_connections=400 -c shared_buffers=512MB
    volumes:
    - ./backend:/docker-entrypoint-initdb.d:ro
    ports:
    - 5432:5432
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
  identityservice-v1:
    build: ./IdentityService
    environment:
      PG_DSN: postgres://ticvai:ticvai@postgres:5432/ticvai
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '2'
      PG_POOL_MAX: '6'
    depends_on:
    - postgres
    - redis
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
  identityservice-v2:
    build: ./IdentityService
    environment:
      PG_DSN: postgres://ticvai:ticvai@postgres:5432/ticvai
      REDIS_URL: redis://redis:6379/0
