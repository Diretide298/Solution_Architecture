# **Identical in everything but topology.** Same images, same Postgres flags, same Redis, same limits.
# Only placement changes — that is the whole experiment, and anything else differing invalidates it.

# **Agent 2 — every service per tenant.** 16 × 3 tenants = 48 containers. **Isolates on the
# wrong axis**: a Saturday spike is one venue, and this scales eleven venues' worth of every
# service because one is busy. Also contradicts ADR-0001 where a tenant spans jurisdictions.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticvai
      POSTGRES_PASSWORD: ticvai
      POSTGRES_DB: ticvai
    command: postgres -c max_connections=400 -c shared_buffers=512MB
    volumes:
    - ./backend:/docker-entrypoint-initdb.d:ro
    ports:
    - 5432:5432
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
  identityservice-t1:
    build: ./IdentityService
    environment:
      PG_DSN: postgres://ticvai:ticvai@postgres:5432/ticvai
      REDIS_URL: redis://redis:6379/0
      PG_POOL_MIN: '2'
      PG_POOL_MAX: '8'
    depends_on:
    - postgres
    - redis
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
  identityservice-t2:
    build: ./IdentityService
    environment:
      PG_DSN: postgres://ticvai:ticvai@postgres:5432/ticvai
      REDIS_URL: redis://redis:6379/0
