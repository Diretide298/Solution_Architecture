why: '**The gate.** Validating an entitlement is a sub-300ms decision made forty times a minute per
  lane, and it must work when the network does not.'
scale: Read-heavy, extreme latency sensitivity, edge-cached. **`frozenDays` is held rather than replayed**
  precisely because the gate cannot afford the arithmetic.
ifDown: Down means the gates stop. Runs at the edge with a local decision cache.
