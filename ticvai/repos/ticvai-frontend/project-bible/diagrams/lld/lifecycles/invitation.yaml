notes: '**Capacity is held at `issued` and consumed at `accepted`.** Holding nothing oversells the event;
  consuming at send means a hundred unanswered invitations lock a hundred seats.


  **`viewed` earns its place**: an invitation nobody opened is a delivery problem, and one opened and
  ignored is a proposition problem.'
