    the policy version is invalidated (design 3.6)'
- from: published
  to: superseded
  operation: publishAiGovernancePolicy
  trigger: operation
  guard: The next version of the same policy was published; this one becomes `superseded` in the same
    transaction (AIC-165)
notes: A draft that is never published stays a draft; it decides nothing, because the effective policy
  is resolved from published versions only. Simulating a `simulated` version again refreshes its results
  and changes no status; a published or superseded version is refused (`409`).
