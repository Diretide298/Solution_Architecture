transitions:
- from: draft
  to: simulated
  operation: simulateAiGovernancePolicy
  trigger: operation
  guard: '**Replays the draft** over recorded decisions in a window and over the capability''s test
    cases, and reports what would change (ADM-527). Runs no action'
- from: simulated
  to: published
  operation: publishAiGovernancePolicy
  trigger: operation
  guard: '**A controlled review** (ADM-528): the version was simulated (`409 policy-not-simulated`)
