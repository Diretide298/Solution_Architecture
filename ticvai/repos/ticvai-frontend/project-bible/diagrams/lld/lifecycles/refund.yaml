transitions:
- from: pendingApproval
  to: pendingGateway
  operation: decideApprovalRequest
  trigger: operation
  guard: '**Approved.** Routed through `approvals` — refund thresholds were one of four bespoke implementations
    before CF-59a'
- from: pendingApproval
