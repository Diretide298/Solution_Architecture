  operation: createRefund
  trigger: operation
  guard: Retried. Safe, because nothing was cancelled on the failure
  isReversal: true
notes: '**The order of operations is the design.** Approve, then gateway, then cancel the entitlement
  — never the reverse. A refund that cancels first and fails at the gateway leaves a guest with no ticket
  and no money, and they will be at a gate rather than on a phone.


  `pendingApproval` is skipped where the amount is below the configured threshold, which is why there
  are two initial states.'
