notes: '**Commission settlement is Finance''s money and Finance''s approval** (decided 29 September,
  writers pass). The batch groups one partner''s lines for one currency, period and legal entity; its
  states are the line states, and a line follows its batch from `financeReview` to `paid` (states/partner-commission-line.yaml).



  **`paid` is terminal.** Money recovered after payment is a new adjustment line in a later batch, never
  a reopened batch. The settlement run creates batches; Finance submits, approves, schedules, holds,
  releases, disputes and voids them with actOnPartnerSettlementBatch (decided 29 September, writers
  pass; DM4). `paid` arrives from the payment confirmation. `listCommissionCalculationSettlement` only
  reads.'
