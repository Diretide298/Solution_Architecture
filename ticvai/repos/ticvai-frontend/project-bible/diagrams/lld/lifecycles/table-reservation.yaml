id: LLD-Table reservation
title: Table reservation — 12 transitions
generatedBy: tools/derive-diagrams.py
index: diagrams/hld/04-lifecycles.yaml
source: states/table-reservation.yaml
entity: Table reservation
contract: fnb
enum: TableReservationStatus
enumKind: named
enumSchema: TableReservationStatus
owner: fnb
initial:
- booked
- awaitingDeposit
terminal:
- completed
- cancelled
transitions:
- from: awaitingDeposit
  to: booked
  trigger: cascade
  guard: '**The deposit was authorised** — the cart holding the deposit line (`CartLine.tableReservationId`)
    was checked out and paid. Only where the venue''s `DepositPolicy.dining` applied at booking (decided
    29 September, rev 3 REV3-8b)'
- from: awaitingDeposit
  to: cancelled
  trigger: timer
  guard: '`deposit.holdExpiresAt` passed with no authorised deposit. The held cover is released and
    nothing is charged'
- from: awaitingDeposit
  to: cancelled
  operation: updateTableReservation
  trigger: operation
  guard: The guest gave up before paying the deposit. Nothing was held, so nothing is released but the
    cover
- from: booked
  to: confirmed
  operation: updateTableReservation
  trigger: operation
  guard: The guest confirmed, or a reminder was acknowledged
- from: booked
  to: seated
  operation: seatTableReservation
  trigger: operation
  guard: '**The host named the actual table.** Committing one at booking time would refuse later bookings
    against a constraint that did not need to exist'
- from: confirmed
  to: seated
  operation: seatTableReservation
  trigger: operation
  guard: Arrived and sat down
- from: seated
  to: completed
  trigger: cascade
  guard: The table visit closed and the bill was settled
- from: booked
  to: cancelled
  operation: updateTableReservation
  trigger: operation
  guard: '**Cover released immediately** — four seats returned at 18:00 can be sold for the same evening'
- from: confirmed
  to: cancelled
  operation: updateTableReservation
  trigger: operation
  guard: Cancelled after confirming
- from: booked
  to: noShow
  trigger: timer
  guard: '**Nobody arrived within the grace period.** Distinct from cancelled: one told us, one did
    not, and only the second is worth a policy'
- from: confirmed
  to: noShow
  trigger: timer
  guard: Confirmed and still did not arrive — the worse case, because the cover was held with more confidence
- from: noShow
  to: seated
  operation: seatTableReservation
  trigger: operation
  guard: '**They turned up late and there is still a table.** A no-show that walks in is a guest, not
    a record'
  isReversal: true
notes: '`noShow` is computed on a grace period, not set by a host. An operator cannot forget to mark
  it, which is the point — a restaurant that only records the no-shows someone remembered cannot measure
  them.


  **`noShow` is not terminal in practice.** A party arriving twenty minutes late is still a party, and
  refusing to seat them because a timer fired is a system overruling a host.


  What happens on a no-show is the venue''s `orders.DepositPolicy.dining` (decided 29 September, rev
  3 REV3-8b, superseding audit R077 (a)): with no dining deposit enabled, the default, nothing; with
  one, `dining.onLateCancelOrNoShow` forfeits or releases the deposit held. This answers **CF-85** for
  deposits.


  **`awaitingDeposit` exists only where a deposit applies.** A booking with no deposit is created `booked`,
  confirmed at once and never enters the cart (rev 3 REV3-8).'
