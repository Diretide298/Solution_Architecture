transitions:
- from: free
  to: seated
  operation: claimTableSession
  trigger: operation
  guard: A party sat down
- from: seated
  to: ordered
  operation: createFnbOrder
  trigger: cascade
  guard: First order placed
- from: ordered
  to: billRequested
  trigger: operation
  guard: Bill asked for
- from: billRequested
  to: needsClearing
  operation: createPayment
  trigger: cascade
  guard: Paid and the party left. Shown as **Table closed** (Chinmay, 2 October, workbook Q201; DI-336;
