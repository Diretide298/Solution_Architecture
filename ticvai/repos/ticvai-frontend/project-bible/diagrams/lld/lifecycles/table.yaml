- from: seated
  to: free
  operation: clearTable
  trigger: operation
  guard: Party left without ordering
notes: '`needsClearing` exists so a paid table is not immediately sellable. Seating a new party at an
  uncleared table is the complaint that follows from collapsing this state into `free`. **The client''s
  names** (DI-336; Chinmay, 2 October, workbook Q201; CHG-CSA-012): `free` is Available, `ordered` is
  Ordered, `needsClearing` is **Table closed**, a short state ended by **Make available**, and `reserved`
  is Reserved; there is no cleaning status, and staff screens avoid "clean", "clear" and "reset".'
