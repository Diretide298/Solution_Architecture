- from: reserved
  to: seated
  operation: claimTableSession
  trigger: operation
  guard: The booking arrived
- from: reserved
  to: free
  trigger: timer
  guard: '**No-show past the hold window.** A table held all evening for someone who never came is a
    table that earned nothing'
- from: free
  to: outOfService
  operation: clearTable
  trigger: operation
  guard: Damaged, or the section is closed
- from: free
  to: outOfService
  operation: setTableLayout
  trigger: operation
