deployOrder:
- order: 1
  tier: foundation
  rule: '**First and alone.** A restart of Identity is an outage everywhere.'
- order: 2
  tier: commerce
  rule: '**Catalogue before Order** — a till pulls a bundle before it sells. **Access last of the four**:
    it runs at the edge with a local cache and can lag the others safely.'
- order: 3
  tier: operations
  rule: '**Module-gated.** `requiresModule` on every screen decides what a tenant sees.'
- order: 4
  tier: engagement
  rule: '**Can ship late and be down.**'
- order: 5
  tier: platform
  rule: Control provisions a tenant rather than serving one. CrossRegion only matters once a second
    region exists.
canBeDownWithoutStoppingASale:
- MarketingService
- AiService
- ReportingService
- CrossRegionService
notes: '**`shift` moved from Tenancy to Order on 24 August.** It owns no tables of its own — which is
  true, and the conclusion drawn from it was wrong. **A service with no data belongs where its data
  is**, and a shift''s data is entirely in `orders`.


  **The coupling made it visible**: all 43 of Tenancy''s cross-service touches into `orders` were the
  `shift` contract. Moving it took Tenancy''s cross-service writes from 23 to 2.'
