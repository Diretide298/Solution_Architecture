id: HLD
title: TICVAI — seventeen modules in five tiers, five deployables
generatedBy: tools/derive-diagrams.py
about: '**What ships together.** 2,790 operations and 1,133 tables resolve into seventeen modules, deployed
  as five units (ADR-0055), and **the data boundary decides where they split**: a module owns and migrates
  its schemas; another module reads them through published views and writes them only through the owner''s
  in-process API.


  **Arrows are cross-service writes.** The rule is that the owner defines the row and a foreign writer
  may only append to it: a till closing posts to `ledger.posting` because settling a shift *is* a ledger
  act.'
decision: docs/adr/0028-service-decomposition.md
tiers:
- tier: foundation
  meaning: Read by everything, reads nothing above. **Deploys first and alone** — twelve contracts read
    Identity and 289 tables anchor on `platform.scope`.
  services:
  - service: TenancyService
    operations: 212
    tables: 110
    schemas:
    - platform
    - workforce
    - approvals
    - accreditation
    - tenancy
    - kernel
    contracts:
    - tenancy
    - workforce
    - approvals
    - accreditation
    flowCoverage: 24%
    scale: Read-heavy and highly cacheable. Config changes are rare.
    ifDown: Same as identity — nothing runs without a scope.
    ref: diagrams/lld/services/TenancyService.yaml
  - service: IdentityService
    operations: 94
    tables: 39
    schemas:
    - identity
    - pii
    contracts:
    - identity
    flowCoverage: 22%
    scale: Read-heavy, latency-critical, cached hard. Every request resolves a principal.
    ifDown: '**A restart is an outage everywhere.** Deploys go out first and alone.'
    ref: diagrams/lld/services/IdentityService.yaml
- tier: commerce
  meaning: The sale path. Highest availability and the highest write rate in the platform.
  services:
  - service: CatalogueService
    operations: 447
    tables: 138
    schemas:
    - catalogue
    - pricing
    - promotions
    - seating
    contracts:
    - catalogue
    - promotions
    - seating
    flowCoverage: 54%
    scale: Read-heavy, bundle-published to tills. **The catalogue bundle is this service's output**
      (ADR-0013).
    ifDown: A bad publish reaches every workstation. Versioned and rollback-able for that reason.
    ref: diagrams/lld/services/CatalogueService.yaml
  - service: OrderService
    operations: 299
    tables: 116
    schemas:
    - orders
    - payments
    contracts:
    - orders
    - shift
    - payments
    flowCoverage: 47%
    scale: Write-heavy, spiky, latency-critical. **The one that autoscales.**
    ifDown: '**Down means no sales.** Highest availability target in the platform.'
    ref: diagrams/lld/services/OrderService.yaml
  - service: AccessService
    operations: 257
    tables: 78
    schemas:
    - access
    contracts:
    - access
    flowCoverage: 61%
    scale: Read-heavy, extreme latency sensitivity, edge-cached. **`frozenDays` is held rather than
      replayed** precisely because the gate cannot afford the arithmetic.
    ifDown: Down means the gates stop. Runs at the edge with a local decision cache.
    ref: diagrams/lld/services/AccessService.yaml
  - service: LedgerService
    operations: 72
    tables: 27
    schemas:
    - ledger
    contracts:
    - finance
    flowCoverage: 50%
    scale: Write-heavy, batch-tolerant, not latency-critical. Recognition and revaluation are jobs.
    ifDown: '**Correctness over availability.** A ledger that is briefly unavailable is recoverable;
      one that is briefly wrong is not.'
    ref: diagrams/lld/services/LedgerService.yaml
  - service: WalletService
    operations: 70
    tables: 32
    schemas:
    - wallet
    contracts:
    - wallet
    flowCoverage: 4%
    scale: 'Read-heavy on the sale path — every till and reader resolves a balance — and write-heavy
      on top-up. **Latency-critical in a way LedgerService is not**, which is why the two are separate:
      the ledger is append-only and batch-tolerant, a balance check is neither.'
    ifDown: '**It holds a liability owed to a customer.** A wallet that double-spends is a financial
      loss, not a bug report. Deduction order across credit lots is FEFO and is decided here, once,
      rather than per caller.'
    ref: diagrams/lld/services/WalletService.yaml
- tier: operations
  meaning: What a venue does with what it sold. **Licensed per module** — a venue that bought none of
    these runs none of them.
  services:
  - service: VenueOpsService
    operations: 291
    tables: 125
    schemas:
    - queue
    - maintenance
    - resources
    - venuemap
    - assets
    - games
    - rental
    - transport
    contracts:
    - queue
    - maintenance
    - resources
    - venue-map
    - assets
    - games
    - rental
    - transport
    flowCoverage: 19%
    scale: Low and steady. Queue readings are the only frequent write.
    ifDown: Down degrades venue operations. Selling and admitting continue.
    ref: diagrams/lld/services/VenueOpsService.yaml
  - service: FnbService
    operations: 138
    tables: 54
    schemas:
    - fnb
    contracts:
    - fnb
    flowCoverage: 47%
    scale: Write-heavy during service, idle between. **Two peaks a day, sharply.**
    ifDown: Down means the kitchen falls back to paper. Offline-capable by design.
    ref: diagrams/lld/services/FnbService.yaml
  - service: InventoryService
    operations: 59
    tables: 23
    schemas:
    - inventory
    contracts:
    - inventory
    flowCoverage: 71%
    scale: Mixed. Counting is bursty; procurement is not.
    ifDown: Down blocks receiving and counting; selling continues from the till's cache.
    ref: diagrams/lld/services/InventoryService.yaml
  - service: RetailService
    operations: 25
    tables: 13
    schemas:
    - retail
    contracts:
    - retail
    flowCoverage: 60%
    scale: Follows the sale. Nothing unusual.
    ifDown: Down means the shop stops; the gates and the restaurant do not.
    ref: diagrams/lld/services/RetailService.yaml
- tier: engagement
  meaning: Guests and intelligence. **Nothing that takes money depends on these**, which is a deliberate
    property and one that should be tested rather than assumed.
  services:
  - service: MarketingService
    operations: 277
    tables: 132
    schemas:
    - marketing
    contracts:
    - marketing-crm
    flowCoverage: 37%
    scale: Bursty on send, read-heavy otherwise. **The one to watch for a split.**
    ifDown: Down stops campaigns and guest lookup. Neither stops trading.
    ref: diagrams/lld/services/MarketingService.yaml
  - service: AiService
    operations: 144
    tables: 75
    schemas:
    - ai
    - qdrant
    contracts:
    - ai
    flowCoverage: 13%
    scale: Latency-tolerant, cost-sensitive, token-metered. Different hardware from everything else.
    ifDown: Down degrades suggestions and the concierge. **Nothing that takes money depends on it.**
    ref: diagrams/lld/services/AiService.yaml
- tier: platform
  meaning: Provisioning, publishing, reporting, and the one path that crosses a region.
  services:
  - service: PlatformService
    operations: 228
    tables: 109
    schemas:
    - control
    - subscription
    contracts:
    - subscription
    - platform-ops
    - public-api
    flowCoverage: 35%
    scale: Low volume, high consequence. Tenant provisioning and licensing.
    ifDown: Down blocks provisioning and the developer API. **Trading is unaffected.**
    ref: diagrams/lld/services/PlatformService.yaml
  - service: WhiteLabelService
    operations: 108
    tables: 34
    schemas:
    - whitelabel
    contracts:
    - white-label
    flowCoverage: 28%
    scale: Read-heavy and heavily cached. Published, not queried.
    ifDown: Down freezes the current published config. Guests see the last good version.
    ref: diagrams/lld/services/WhiteLabelService.yaml
  - service: ReportingService
    operations: 51
    tables: 25
    schemas:
    - reporting
    contracts:
    - reporting
    flowCoverage: 35%
    scale: Analytical. Runs against the replica and the analytical store.
    ifDown: Down stops dashboards. **Nothing operational depends on it.**
    ref: diagrams/lld/services/ReportingService.yaml
  - service: CrossRegionService
    operations: 18
    tables: 3
    schemas:
    - sync
    contracts:
    - cross-region
    flowCoverage: 6%
    scale: Low volume, high scrutiny.
    ifDown: Down blocks cross-region entitlements. Each region continues alone.
    ref: diagrams/lld/services/CrossRegionService.yaml
deployables:
- deployable: commerce
  note: 'The sale path: order, payment and ledger commit in one transaction. Autoscales on requests
    per second.'
  modules:
  - CatalogueService
  - IdentityService
  - LedgerService
  - OrderService
  - TenancyService
  - WalletService
- deployable: access
  note: The gate hot path, flat high rate, offline package. The same module code builds the venue edge
    node.
  modules:
  - AccessService
- deployable: operations
  note: Back office and engagement. Nothing that takes money waits on it.
  modules:
  - CrossRegionService
  - FnbService
  - InventoryService
  - MarketingService
  - PlatformService
  - ReportingService
  - RetailService
  - VenueOpsService
  - WhiteLabelService
- deployable: ticvai-ai
  note: 'AI, in Python, isolated (ADR-0020): three process groups, read-only on the transactional schemas.'
  modules:
  - AiService
- deployable: workers
  note: 'No module of its own: the outbox relay (one per region, ADR-0058), every module''s event consumers
    and scheduled jobs. Scales on queue depth.'
  modules: []
