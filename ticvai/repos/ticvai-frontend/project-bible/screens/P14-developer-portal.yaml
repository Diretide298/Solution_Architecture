platform:
  code: P14
  formFactor: web
  surface: partner
  runtime: reactWeb
  themes:
  - light
  - dark
  directions:
  - ltr
  app: developer-portal-web
  appStatus: not scaffolded
  operator: partner
  deployment:
    target: browser
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: developer device, unmanaged
    networkAssumption: public internet
    releaseCadence: 'Monthly, and the API it documents moves on a twelve-month deprecation cycle (ADR-0026).
      **The portal may change weekly; the contract it describes may not.**

      '
  name: Developer Portal
  shortName: Developer
  audience: partner
  offlineCapable: false
  screenCount: 8
  notes: '**Two audiences on one platform and the split matters.** A developer manages their own organisation,
    clients, sandboxes and subscriptions. A Softlabs administrator sets quotas, certifies integrations
    and configures licensing — `DEVELOPER_ADMIN`, and those screens are never shown to a developer.

    **Nothing here is offline-capable.** A developer portal is used at a desk.

    '
  wireframeBoard: wireframes/P14 Developer.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: ticvai-control
    name: TICVAI Control
    shell: web
    siblings:
    - P09
    - P10
    - P11
    - P17
    note: '**TICVAI operates all five**, whoever signs in. The partner portal, the accreditation intake,
      the developer portal and the sign-up are outward faces of the control plane, not separate products
      — but their users are not TICVAI staff, and the permission model has to hold that line. **P17 added
      11 September 2026**: a prospect buying TICVAI has no tenant and no cell, so the control plane is
      the only thing that can serve them.'
    decided: 10 September 2026
screens:
- id: DEV-001
  name: API Reference
  module: Developer & API
  requiresModule: developerApi
  wave: 2
  implementation:
    app: developer-portal-web
    route: /developer/reference
    component: apps/developer-portal-web/src/routes/developer/ApiReference.tsx
    status: notStarted
  navigation:
    exitTo:
    - DEV-002
    - DEV-004
    isEntryPoint: true
    transitions:
    - to: DEV-002
      trigger: They register their organisation
      provenance: flow F27 step 1→2
      operation: listApiVersions
    - to: DEV-004
      trigger: Sandbox
      provenance: structural — DEV-001 is P14's home screen and its exits are its launcher
  notes: CF-135. **A portal over artefacts that already exist**, which is why this is frontend scope rather
    than a contract gap — the twelve domain-13 rows left open after the contract landed are all this screen
    and its siblings. **The API reference.** A developer arrives at the documentation, not at a sign-up
    form — registration is what they do after reading. **Declared 20 August** — `isEntryPoint` existed
    in the schema and five platforms used none, so every screen in them read as unreachable.
  density: compact
  pattern: listDetail
  patternReason: '`listApiVersions` reads a population and nothing reads one of them; the detail is the
    row until a `get` exists'
  purpose: Read the contract, and call it without leaving the page.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every api reference
        bindsTo: ApiVersion
        columns:
        - ApiVersion.status
        - ApiVersion.releasedAt
        - ApiVersion.deprecatedAt
        - ApiVersion.sunsetAt
        - ApiVersion.minimumNoticeMonths
        - ApiVersion.migrationGuideUrl
        - ApiVersion.activeClientCount
        operation: listApiVersions
        provenance: contract public-api.yaml GET /api-versions
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected api reference
        bindsTo: ApiVersion
        columns:
        - ApiVersion.status
        - ApiVersion.releasedAt
        - ApiVersion.deprecatedAt
        - ApiVersion.sunsetAt
        - ApiVersion.minimumNoticeMonths
        - ApiVersion.migrationGuideUrl
        - ApiVersion.activeClientCount
        operation: listApiVersions
        provenance: contract public-api.yaml GET /api-versions
    - name: sideNav
      slot: carried
      components:
      - kind: searchField
        label: Search operations
        provenance: carried from the previous definition
      - kind: treeNav
        bindsTo: contracts
        notes: 'Grouped by contract, not by tag. **A developer thinks in domains** — ticketing, access,
          F&B — and the contracts already are the domains.

          '
        provenance: carried from the previous definition
    - name: contentBody
      slot: carried
      components:
      - kind: detailPanel
        bindsTo: operation
        notes: 'Request, response, scopes and error codes. **The error codes are what a developer comes
          back for**, and they are the section most documentation buries.

          '
        provenance: carried from the previous definition
      - kind: codeBlock
        notes: 'A working example per language. **Copy-paste that runs** — an example with a placeholder
          token teaches nothing about auth, which is where integrations fail.

          '
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Try it
        notes: 'Runs against the sandbox, never production. **The environment is stated on the button**,
          because a try-it that quietly hits production is how somebody refunds a real order while reading
          the docs.

          '
        provenance: carried from the previous definition
  states:
    loading: The operation list; the current version renders first.
    error: 'Could not load the reference. **Names which contract failed** — 28 files load independently
      and one missing does not mean the API is down.

      '
    emptyFirstRun: '**Never empty in practice** — the contracts are the documentation and they ship with
      the platform. An empty reference means the artefacts did not load, which is an error rather than
      a first run.

      '
    emptyNoResults: 'No operation matches this search. **Search covers the summary and the description**,
      not just the operationId, because a developer looking for *"how do I refund"* does not know it is
      called `createRefund`.

      '
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
  apis:
  - operationId: listApiVersions
    contract: public-api
    purpose: Which versions exist and which is current
    trigger: onLoad
  entryState:
    preloaded:
    - ApiVersion.status
    - ApiVersion.releasedAt
    - ApiVersion.deprecatedAt
    - ApiVersion.sunsetAt
    - ApiVersion.minimumNoticeMonths
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P14 Developer.dc.html#dev-001
  apisNote: Rebuilt 9 September 2026 from the 1 operation this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
- id: DEV-002
  name: Register & Organisation
  module: Developer & API
  requiresModule: developerApi
  wave: 2
  implementation:
    app: developer-portal-web
    route: /developer/organisation
    component: apps/developer-portal-web/src/routes/developer/OrganisationForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - DEV-001
    exitTo:
    - DEV-003
    transitions:
    - to: DEV-003
      trigger: They create a sandbox client and take the secret
      provenance: flow F27 step 2→3
      operation: registerDeveloper
  notes: '13.1.6 to 13.1.10. **The organisation administers its own people** — Softlabs maintaining every
    integrator''s staff list is Softlabs doing their HR.

    '
  density: compact
  pattern: configEditor
  patternReason: the screen declares only writes (`registerDeveloper`, `setDeveloperMembers`) and no read
    of a population — it is settings, not a list
  purpose: Sign up as an organisation, and manage who at it may do what.
  layout:
    template: form
    regions:
    - name: contentBody
      slot: fields
      components:
      - kind: textField
        label: id
        bindsTo: DeveloperAccount.id
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: organisationName
        bindsTo: DeveloperAccount.organisationName
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: contactEmail
        bindsTo: DeveloperAccount.contactEmail
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: websiteUrl
        bindsTo: DeveloperAccount.websiteUrl
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: countryCode
        bindsTo: DeveloperAccount.countryCode
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: partnerId
        bindsTo: DeveloperAccount.partnerId
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: status
        bindsTo: DeveloperAccount.status
        provenance: contract public-api.yaml POST /developers
      - kind: textField
        label: verifiedAt
        bindsTo: DeveloperAccount.verifiedAt
        provenance: contract public-api.yaml POST /developers
    - name: actionBar
      slot: publish
      components:
      - kind: primaryButton
        label: Register
        operation: registerDeveloper
        provenance: contract public-api.yaml POST /developers
      - kind: secondaryButton
        label: Save changes
        operation: setDeveloperMembers
        provenance: contract public-api.yaml PUT /developers/{developerId}/members
    - name: contentBody
      slot: carried
      components:
      - kind: textField
        label: Organisation name
        provenance: carried from the previous definition
      - kind: textField
        label: Contact email
        provenance: carried from the previous definition
      - kind: dataTable
        bindsTo: members
        notes: Role per member — owner, admin, developer, read-only.
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Invite
        provenance: carried from the previous definition
  states:
    loading: The organisation and its members.
    error: Could not load. Your credentials are unaffected.
    emptyFirstRun: '**You are the first member and you are the owner.** An integration outlives the engineer
      who built it, so this is an organisation rather than a personal account — and the invite action
      is the point of the state.

      '
    emptyNoAccess: '**You are a member and not an owner.** Stated plainly rather than shown as an empty
      list, because a developer who sees no colleagues assumes the page is broken.

      '
  apis:
  - operationId: registerDeveloper
    contract: public-api
    purpose: Register
    trigger: onAction
  - operationId: setDeveloperMembers
    contract: public-api
    purpose: Manage members
    trigger: onAction
  entryState:
    params:
    - name: developerId
      from: deepLink
    coldEntry: '**A partner link resolves within that partner''s own scope and refuses outside it.** A
      forwarded link between partners must not open another partner''s record. If the target is gone the
      screen says so and offers the partner''s own list. Arrives with `developerId`.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P14 Developer.dc.html#dev-002
  apisNote: Rebuilt 9 September 2026 from the 2 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
- id: DEV-003
  name: Clients & Credentials
  module: Developer & API
  requiresModule: developerApi
  wave: 2
  implementation:
    app: developer-portal-web
    route: /developer/clients
    component: apps/developer-portal-web/src/routes/developer/ClientList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - DEV-002
    exitTo:
    - DEV-004
    - DEV-005
    transitions:
    - to: DEV-004
      trigger: They provision a sandbox and build against it
      provenance: flow F27 step 3→4
      operation: createApiClient
    - to: DEV-005
      trigger: Webhooks
      carries:
      - subscriptionId
      provenance: derived — DEV-005 declares entryState.params subscriptionId, so an edge into it must
        carry them
  notes: 'CF-135a. **The one credential model** — 2.7.52, 7.1.25 and 7.1.30 each asserted their own. **Rotation
    carries an overlap window and revocation does not**: one is hygiene, the other is what you reach for
    when a secret has leaked, and a grace period defeats it.

    '
  density: compact
  pattern: listDetail
  patternReason: '`listApiClients` reads a population and nothing reads one of them; the detail is the
    row until a `get` exists'
  purpose: Create a client, choose its scopes, and rotate its secret without an outage.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every clients credentials
        bindsTo: ApiClient
        columns:
        - ApiClient.id
        - ApiClient.developerId
        - ApiClient.name
        - ApiClient.clientId
        - ApiClient.environment
        - ApiClient.scopes
        - ApiClient.allowedTenantIds
        - ApiClient.ipAllowList
        - ApiClient.status
        - ApiClient.lastUsedAt
        operation: listApiClients
        provenance: contract public-api.yaml GET /api-clients
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected clients credentials
        bindsTo: ApiClient
        columns:
        - ApiClient.id
        - ApiClient.developerId
        - ApiClient.name
        - ApiClient.clientId
        - ApiClient.environment
        - ApiClient.scopes
        - ApiClient.allowedTenantIds
        - ApiClient.ipAllowList
        - ApiClient.status
        - ApiClient.lastUsedAt
        operation: listApiClients
        provenance: contract public-api.yaml GET /api-clients
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create
        operation: createApiClient
        provenance: contract public-api.yaml POST /api-clients
      - kind: secondaryButton
        label: Rotate
        operation: rotateApiCredential
        provenance: contract public-api.yaml POST /api-clients/{clientId}/credentials
      - kind: destructiveButton
        label: Revoke
        operation: revokeApiCredential
        provenance: contract public-api.yaml DELETE /api-clients/{clientId}/credentials
    - name: contentBody
      slot: carried
      components:
      - kind: dataTable
        bindsTo: ApiClient[]
        notes: 'Environment is a column and not a badge. **A sandbox key and a production key that look
          alike is how somebody uses the wrong one**, and the difference must survive a glance.

          '
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Create client
        provenance: carried from the previous definition
      - kind: banner
        notes: '**The secret is shown once.** The banner says so before it is generated, not after — a
          system that can show you a secret later is a system that stores one.

          '
        provenance: carried from the previous definition
  overlays:
  - id: confirmRevokeApiCredential
    component: confirmDialog
    trigger: Revoke
    body: '**Names what `revokeApiCredential` changes and what it leaves alone**, in the consequence rather
      than the verb. A clients credentials this affects should be identified in the dialog, not just counted.'
    provenance: contract public-api.yaml DELETE /api-clients/{clientId}/credentials
  states:
    loading: Clients, sandbox first.
    error: Could not load clients. Existing credentials keep working.
    emptyFirstRun: '**No clients yet. Create a sandbox one** — the action says sandbox because a first
      client should never be a production client, and defaulting the other way is how a first API call
      hits a live venue.

      '
    emptyNoResults: No client matches this environment or scope.
    emptyNoAccess: You are a read-only member. Credentials are hidden, not absent.
  apis:
  - operationId: listApiClients
    contract: public-api
    purpose: Clients with their environment and scopes
    trigger: onLoad
  - operationId: createApiClient
    contract: public-api
    purpose: Create one
    trigger: onAction
    invalidates:
    - listApiClients
  - operationId: rotateApiCredential
    contract: public-api
    purpose: New secret with an overlap
    trigger: onAction
    invalidates:
    - listApiClients
  - operationId: revokeApiCredential
    contract: public-api
    purpose: Revoke now
    trigger: onAction
    invalidates:
    - listApiClients
  entryState:
    params:
    - name: clientId
      from: deepLink
    coldEntry: '**A partner link resolves within that partner''s own scope and refuses outside it.** A
      forwarded link between partners must not open another partner''s record. If the target is gone the
      screen says so and offers the partner''s own list. Arrives with `clientId`.'
    preloaded:
    - ApiClient.id
    - ApiClient.developerId
    - ApiClient.name
    - ApiClient.clientId
    - ApiClient.environment
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P14 Developer.dc.html#dev-003
  apisNote: Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
- id: DEV-004
  name: Sandbox
  module: Developer & API
  requiresModule: developerApi
  wave: 2
  implementation:
    app: developer-portal-web
    route: /developer/sandbox
    component: apps/developer-portal-web/src/routes/developer/SandboxList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - DEV-001
    - DEV-003
    exitTo:
    - DEV-005
    transitions:
    - to: DEV-005
      trigger: They subscribe to the events they need and watch the deliveries
      provenance: flow F27 step 4→5
  notes: 'Decisions D2 and D3. **One shared sandbox, synthetic data only** — which removes the PDPL and
    DESC exposure entirely. Tenant-specific validation runs on per-customer staging.

    '
  density: compact
  pattern: listDetail
  patternReason: '`listSandboxes` reads a population and nothing reads one of them; the detail is the
    row until a `get` exists'
  purpose: Test against synthetic data, and reset to a known state.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every sandbox
        bindsTo: Sandbox
        columns:
        - Sandbox.id
        - Sandbox.name
        - Sandbox.developerId
        - Sandbox.status
        - Sandbox.dataProfile
        - Sandbox.containsProductionData
        - Sandbox.expiresAt
        - Sandbox.lastResetAt
        operation: listSandboxes
        provenance: contract public-api.yaml GET /sandboxes
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected sandbox
        bindsTo: Sandbox
        columns:
        - Sandbox.id
        - Sandbox.name
        - Sandbox.developerId
        - Sandbox.status
        - Sandbox.dataProfile
        - Sandbox.containsProductionData
        - Sandbox.expiresAt
        - Sandbox.lastResetAt
        operation: listSandboxes
        provenance: contract public-api.yaml GET /sandboxes
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create
        operation: createSandbox
        provenance: contract public-api.yaml POST /sandboxes
      - kind: destructiveButton
        label: Reset
        operation: resetSandbox
        provenance: contract public-api.yaml POST /sandboxes/{sandboxId}/reset
    - name: contentBody
      slot: carried
      components:
      - kind: cardList
        bindsTo: Sandbox[]
        notes: Venue kind, record counts, expiry.
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Provision sandbox
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Reset
        notes: 'Confirms by naming what goes. **"Reset — 5,000 guests and 12 months of orders will be
          regenerated"** rather than "are you sure", because a developer mid-test needs to know what they
          are about to lose.

          '
        provenance: carried from the previous definition
      - kind: banner
        notes: '**Expiry, counted in days.** A sandbox that vanishes with no warning is a developer who
          thinks the platform broke.

          '
        provenance: carried from the previous definition
  overlays:
  - id: confirmResetSandbox
    component: confirmDialog
    trigger: Reset
    body: '**Names what `resetSandbox` changes and what it leaves alone**, in the consequence rather than
      the verb. A sandbox this affects should be identified in the dialog, not just counted.'
    provenance: contract public-api.yaml POST /sandboxes/{sandboxId}/reset
  states:
    loading: Sandboxes with their data profile.
    error: Could not load. A running sandbox is unaffected.
    emptyFirstRun: '**No sandbox yet. Provisioning takes a few minutes and the data is generated, not
      copied** — no production data is ever cloned or masked into it, which is the decision the whole
      environment rests on.

      '
    emptyNoResults: No sandbox matches.
    emptyNoAccess: You do not have DEVELOPER_MANAGE.
  apis:
  - operationId: listSandboxes
    contract: public-api
    purpose: Sandboxes and their expiry
    trigger: onLoad
  - operationId: createSandbox
    contract: public-api
    purpose: Provision one
    trigger: onAction
    invalidates:
    - listSandboxes
  - operationId: resetSandbox
    contract: public-api
    purpose: Back to clean
    trigger: onAction
    invalidates:
    - listSandboxes
  entryState:
    params:
    - name: sandboxId
      from: deepLink
    coldEntry: '**A partner link resolves within that partner''s own scope and refuses outside it.** A
      forwarded link between partners must not open another partner''s record. If the target is gone the
      screen says so and offers the partner''s own list. Arrives with `sandboxId`.'
    preloaded:
    - Sandbox.id
    - Sandbox.name
    - Sandbox.developerId
    - Sandbox.status
    - Sandbox.dataProfile
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P14 Developer.dc.html#dev-004
  apisNote: Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
- id: DEV-005
  name: Webhooks
  module: Developer & API
  requiresModule: developerApi
  wave: 2
  implementation:
    app: developer-portal-web
    route: /developer/webhooks
    component: apps/developer-portal-web/src/routes/developer/WebhookList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - DEV-003
    - DEV-004
    exitTo:
    - DEV-006
    transitions:
    - to: DEV-006
      trigger: They go live, and watch whether it is healthy
      provenance: flow F27 step 5→6
  notes: '13.1.26 to 13.1.30, 13.3.17 to 13.3.23. **The 29 events already existed and nothing outside
    could receive one.**

    '
  density: compact
  pattern: listDetail
  patternReason: '`listWebhookSubscriptions` reads a population and nothing reads one of them; the detail
    is the row until a `get` exists'
  purpose: Subscribe to events, see every delivery, and replay what was missed.
  gaps:
  - operation: listWebhookDeliveries
    why: '**1 declared operation reach no component on this screen**: listWebhookDeliveries. Either the
      screen is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every webhooks
        bindsTo: WebhookSubscription
        columns:
        - WebhookSubscription.id
        - WebhookSubscription.clientId
        - WebhookSubscription.endpointUrl
        - WebhookSubscription.eventTypes
        - WebhookSubscription.filters
        - WebhookSubscription.signingSecret
        - WebhookSubscription.status
        - WebhookSubscription.consecutiveFailures
        - WebhookSubscription.disabledReason
        operation: listWebhookSubscriptions
        provenance: contract public-api.yaml GET /webhook-subscriptions
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected webhooks
        bindsTo: WebhookSubscription
        columns:
        - WebhookSubscription.id
        - WebhookSubscription.clientId
        - WebhookSubscription.endpointUrl
        - WebhookSubscription.eventTypes
        - WebhookSubscription.filters
        - WebhookSubscription.signingSecret
        - WebhookSubscription.status
        - WebhookSubscription.consecutiveFailures
        - WebhookSubscription.disabledReason
        operation: listWebhookSubscriptions
        provenance: contract public-api.yaml GET /webhook-subscriptions
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create
        operation: createWebhookSubscription
        provenance: contract public-api.yaml POST /webhook-subscriptions
      - kind: secondaryButton
        label: Replay
        operation: replayEvents
        provenance: contract public-api.yaml POST /webhook-subscriptions/{subscriptionId}/replay
    - name: sideNav
      slot: carried
      components:
      - kind: cardList
        bindsTo: WebhookSubscription[]
        notes: 'Failing subscriptions sort first and carry the consecutive-failure count. **A developer
          is told before it is disabled, not after.**

          '
        provenance: carried from the previous definition
    - name: contentBody
      slot: carried
      components:
      - kind: dataTable
        bindsTo: WebhookDelivery[]
        notes: 'Status, attempts, response code and an excerpt of the receiver''s own error. **The excerpt
          is what makes the log useful** — a 500 with their own message in it answers the question without
          a support conversation.

          '
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Replay from…
        notes: 'Bounded by retention, and the replay is marked in the payload. **A consumer that cannot
          tell a replay from a live event will double-count.**

          '
        provenance: carried from the previous definition
  states:
    loading: Subscriptions; failing ones first.
    error: Could not load. Deliveries continue regardless of this screen.
    emptyFirstRun: '**No subscriptions. Twenty-nine business events are available** — and the state names
