  notes: '**`DEVELOPER_ADMIN` throughout, and never shown to a developer.** Decision D5 makes the commercial
    model configuration rather than code — this is the surface, and the rates themselves remain CF-135c.
    **Staff audience on a partner platform, and deliberately.** Every operation here — `setApiQuota`,
    `certifyIntegration`, `setApiLicensing`, `deprecateApiVersion` — is **Softlabs administering the programme,
    not a developer self-serving.** A developer who could set their own quota has no quota.


    **Declared on the screen rather than the platform** because P14 is a partner surface with one staff
    screen on it, and moving the screen to P09 would separate the console from the catalogue it governs.
    `check-screens` reads `screen.audience` before the platform’s.'
  density: compact
  audience: staff
  pattern: configEditor
  patternReason: the screen declares only writes (`setApiQuota`, `certifyIntegration`, `setApiLicensing`)
    and no read of a population — it is settings, not a list
