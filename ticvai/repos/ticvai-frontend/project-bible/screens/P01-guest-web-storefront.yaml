    contract: access
    purpose: Every ticket, pass and membership this guest holds
    trigger: onLoad
  - operationId: getEntitlement
    contract: access
    purpose: One entitlement, with what remains on it
    trigger: onLoad
  - operationId: getEntitlementCredential
