    - MerchandiseItem.name
    - MerchandiseItem.outletId
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-042
    prototype:
      file: 'sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html'
      rev: 'rev 3'
      verified: 2026-09-28
      match: exact
      view: 'At the venue → ''Shop & drop'''
      differences: 'Pays in one tap on the page, not through the cart and checkout (YAML R236).'
  apisNote: Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formAddCartLine
    component: modal
    trigger: Add to cart for collection
    body: '**Collects what `addCartLine` sends before it is called.** Required: `variantId`, `quantity`.
