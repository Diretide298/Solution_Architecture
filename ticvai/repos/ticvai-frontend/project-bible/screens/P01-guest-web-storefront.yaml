    trigger: onLoad
  - operationId: getWaiverStatus
    contract: marketing-crm
    purpose: Which waivers are signed and which are due
    trigger: onLoad
  - operationId: grantDelegation
    contract: identity
    purpose: Let somebody else manage a booking
    trigger: onAction
  - operationId: listDelegations
