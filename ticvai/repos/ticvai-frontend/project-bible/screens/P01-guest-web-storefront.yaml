      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: listMerchandise
    contract: retail
    purpose: List merchandise
    trigger: onLoad
  - operationId: lookupMerchandise
    contract: retail
    purpose: Price and stock check by barcode, at the outlet named by `outletId` (audit R215 (1))
    trigger: onAction
  - operationId: checkoutCart
    contract: orders
    purpose: Turn the cart into an order; merchandise for collection is paid online (audit R236)
    trigger: onAction
  - operationId: createPayment
    contract: orders
    purpose: Pay for it; payment creates the shop-and-drop for collection (decided 28 September, audit
      R236)
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
    invalidates:
    - listMerchandise
  entryState:
    params:
    - name: cartId
      from: session
    - name: outletId
      from: deepLink
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `outletId`.'
    preloaded:
    - MerchandiseItem.id
    - MerchandiseItem.sku
    - MerchandiseItem.barcode
    - MerchandiseItem.name
    - MerchandiseItem.outletId
  wireframe:
