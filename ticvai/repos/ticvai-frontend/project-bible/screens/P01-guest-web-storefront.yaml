    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
  notes: '**P01 Board 3 drew *Membership* with nothing behind it.** `getLoyaltyPosition` and `listLoyaltyProgrammes`
    were app-only — **the surface a guest checks their points on between visits is the web one.**

    **`evaluatePromotions` removed 27 September 2026 (audit root R292).** It evaluates promotions against
    a cart — `EvaluatePromotionsRequest` requires `venueId`, `channel` and at least one line — and this
    screen arrives with no parameter and holds no cart. Offers apply on WEB-005 and WEB-010, which keep
    the call.'
