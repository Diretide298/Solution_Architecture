    28 September, audit R077 (c)). Purpose derived from the screen name and its operations on 17 August,
    not from a requirement. The read surface Deep asked for. **All four were missing and the table itself
    did not exist until 18 August.** **Rewired on the 20 August review.** **`listEntitlements` wired 24
    August, raised in review.** The staff-scoped list was on this guest screen — **a guest-facing list
    must be scoped to the caller, not filtered by a subject parameter**, or a guest is one parameter away
    from somebody else’s. **Cross-surface parity, 31 August**: added transferOrderTickets. **The same
    screen on web and app was calling different operations** — one side could do something the other could
    not, and nothing recorded the difference as deliberate.'
  density: compact
  pattern: listDetail
  patternReason: '`listMyEntitlements` reads the population and `getEntitlement` reads one of them — list,
    select, act'
  purpose: Find my tickets for this venue.
  gaps:
  - operation: getEntitlementCredential
    why: '**`getEntitlementCredential` declares its response inline**, so the component that shows it
      names fields but binds to no schema. The contract should name the shape.'
    source: contract access.yaml GET /entitlements/{entitlementId}/credential
  - operation: getEntitlementHistory
    why: '**`getEntitlementHistory` declares its response inline**, so the component that shows it names
      fields but binds to no schema. The contract should name the shape.'
    source: contract access.yaml GET /entitlements/{entitlementId}/history
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: State
        operation: listMyEntitlements
        notes: Sends `?state=` to `listMyEntitlements`.
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: toggle
        label: Include shared
        operation: listMyEntitlements
        notes: Sends `?includeShared=` to `listMyEntitlements`.
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: dataTable
        label: Every entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.id
        - Entitlement.templateId
        - Entitlement.productId
        - Entitlement.orderId
        - Entitlement.orderLineId
        - Entitlement.subjectId
        - Entitlement.venueId
        - Entitlement.scopePath
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        operation: listMyEntitlements
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: dataTable
        label: Entitlement history
        operation: getEntitlementHistory
        notes: Shows `at`, `kind`, `accessPointName`, `denyReason`, `byPrincipalName` from `getEntitlementHistory`'s
          inline response. **The response has no named schema**, so this cannot bind until the contract
          names one.
        provenance: contract access.yaml GET /entitlements/{entitlementId}/history
      - kind: dataTable
        label: Every entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.id
        - Entitlement.templateId
        - Entitlement.productId
        - Entitlement.orderId
        - Entitlement.orderLineId
        - Entitlement.subjectId
        - Entitlement.venueId
        - Entitlement.scopePath
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        operation: listEntitlements
        provenance: contract access.yaml GET /my/entitlements/all
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.id
        - Entitlement.templateId
        - Entitlement.productId
        - Entitlement.orderId
        - Entitlement.orderLineId
        - Entitlement.subjectId
        - Entitlement.venueId
        - Entitlement.scopePath
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        - Entitlement.validTo
        - Entitlement.entriesUsed
        - Entitlement.entriesAllowed
        - Entitlement.lastEntryAt
        operation: getEntitlement
        provenance: contract access.yaml GET /entitlements/{entitlementId}
      - kind: detailPanel
        label: Entitlement credential
        operation: getEntitlementCredential
        notes: 'Shows `mediaCode`, `payload`, `expiresAt` from `getEntitlementCredential`''s inline response.
          **The response has no named schema**, so this cannot bind until the contract names one. **A
          rotating code derived on the device** (decided 28 September, audit R230): while online the screen
          fetches `rotation` (secret, `timeStepSeconds`, `digits`, `algorithm`, valid `validFrom` to `validTo`)
          and computes the current code from the seed and the clock, with a visible countdown to the next
          step; it keeps rotating with no signal. A null `rotation` (wristband, wallet pass) shows the
          static code. **No screenshot blocking on the web** — a browser cannot enforce it and the page
          promises none (audit R077 (c)).'
        provenance: contract access.yaml GET /entitlements/{entitlementId}/credential
    - name: actionBar
