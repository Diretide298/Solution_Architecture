      - idToken
      - deviceId
    provenance: client-verified
  - id: formGuestUaePassLogin
    component: modal
    trigger: Continue with UAE Pass
    body: '**Collects what `guestUaePassLogin` sends before it is called.** Required: `code`, `redirectUri`.
