      - kind: cardList
        label: Loyalty & Rewards
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Detail
        provenance: carried from the previous definition
    - name: contextPanel
      slot: reads
      components:
      - kind: detailPanel
        label: Loyalty position
        operation: getLoyaltyPosition
        notes: Shows `subjectId`, `programmeId`, `pointsBalance`, `pointsPending`, `tier`, `nextTier`,
          `pointsToNextTier`, `expiringPoints`, `expiringAt` from `getLoyaltyPosition`'s inline response.
          **The response has no named schema**, so this cannot bind until the contract names one.
        provenance: contract marketing-crm.yaml GET /loyalty/position
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Create referral
        operation: createReferral
        provenance: contract marketing-crm.yaml POST /referrals
      - kind: secondaryButton
        label: Redeem loyalty points
        operation: redeemLoyaltyPoints
        provenance: contract marketing-crm.yaml POST /loyalty/redemptions
  states:
    loading: Content resolves in place.
    error: Could not load. **The rest of the site is unaffected.**
    emptyFirstRun: '**Nothing here yet for this venue.** Names what turns it on rather than showing an
      empty panel.'
    emptyNoResults: Nothing matches.
    emptyNoAccess: '**Sign in to see this.** A guest who is not signed in is offered the door, not refused.'
    offline: '**The offline banner shows.** The last known balance stays with its age, and **points earned
      since are not shown** — and that is said. Redeeming and referring need the connection.'
  apis:
  - operationId: getLoyaltyPosition
    contract: marketing-crm
    purpose: A guest's points, tier and what is within reach
    trigger: onLoad
  - operationId: listLoyaltyProgrammes
    contract: marketing-crm
    purpose: List loyalty programmes
    trigger: onLoad
  - operationId: listPromotions
    contract: promotions
    purpose: List promotions
    trigger: onLoad
  - operationId: createReferral
    contract: marketing-crm
    purpose: Refer a friend
    trigger: onAction
  - operationId: redeemLoyaltyPoints
    contract: marketing-crm
    purpose: Spend points
    trigger: onAction
  entryState:
    params: []
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared link, a scanned code and a forwarded confirmation all land
      here, and the person holding it did nothing wrong. Arrives with no parameter — the venue comes from
      the site.'
  wireframe:
    status: review
    provenance: client-verified
    board: wireframes/P01 Guest Web.dc.html#web-043
    prototype:
      file: 'sources/designs/guest-rev3-28-september/TICVAI Guest Booking v2.dc.html'
      rev: 'rev 3'
