_note: '**The issue log for screen ids, and the reason it exists.** On 4 September two workstreams both
  allocated ADM-038 — each took max+1 of the same prefix, neither could see the other, and nothing in
  the package held a number. One was ''Dead Letters'', the other ''Communication Service Command Center''.
  The collision was silent on both sides.


  **An id appears here when it is issued, not when it is built.** That is the whole mechanism: a number
  in this file is spent, and the next allocator starts above the highest number recorded rather than above
  the highest number it can see.


  **A retired id is never reissued.** `nextFree` is the high-water mark plus one, gaps included — reusing
  a deleted screen''s number is how an old link opens the wrong screen.


  `tools/check-screens.py` fails on a screen issued above the recorded high-water mark. Regenerate with
  `tools/derive-id-register.py --apply` and commit it in the same change.'
