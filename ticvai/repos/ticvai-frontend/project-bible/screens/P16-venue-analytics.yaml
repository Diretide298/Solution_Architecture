# P16 — Venue Analytics
#
# Board 6 of every client design set, received 20 August 2026.
# 26 board screens collapsed to nine with a domain selector — six were duplicated across
# F&B and Retail, two word for word.
#
# Validated against _schema.yaml; component kinds from _components.yaml.

platform:
  code: P16
  formFactor: web
  surface: staffFacing
  runtime: reactWeb
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  app: venue-management-web
  appStatus: not scaffolded
  operator: venue
  deployment:
    target: browser
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: venue-owned workstation
    networkAssumption: venue LAN
    releaseCadence: fortnightly
  name: Venue Analytics — Cross-Domain Reporting
  shortName: Venue Analytics
  audience: staff
  offlineCapable: false
  screenCount: 10
  notes: '**26 board screens collapsed to nine.** F&B, Retail and POS each ended their set with an executive
    command centre, a sales and revenue view, a performance view, a forecasting view and an AI centre
    — and **two of them are word-for-word identical across domains.**


    **A domain is a filter on an analytics screen, not a copy of it.** Building three sets means maintaining
    one screen three times and watching them drift, and the drift is invisible until two dashboards
    disagree about last month.


    **Its own platform rather than a P08 section** because it is read rather than operated: opened on
    a Monday morning, never during service, by somebody asking about a period rather than doing a job.


    **Shares the `venue-management-web` app.** A separate platform is a navigation and permission boundary,
    not necessarily a separate codebase.'
  wireframeBoard: wireframes/P16 Venue Analytics.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: ANL-001
  name: Executive Command Center
  module: Analytics
  wave: 3
  purpose: Executive Command Center — across F&B, retail, ticketing and frontline, filtered by domain.
  density: compact
  apis:
  - operationId: getDashboard
    contract: reporting
    purpose: Read a dashboard with tile data
    trigger: onLoad
  - operationId: listAlerts
    contract: reporting
    purpose: What is currently raised
    trigger: onLoad
  - operationId: requestSuggestion
    contract: ai
    purpose: requestSuggestion
    trigger: onAction
  - operationId: runReport
    contract: reporting
    purpose: Run a report
    trigger: onAction
  states:
    loading: Tiles render in place; **each resolves on its own** so one slow source does not hold the
      page.
    emptyFirstRun: '**A venue with no trading history.** Links to the seeded reports rather than showing
      zeroes — a dashboard of zeroes teaches a new manager nothing.'
    emptyNoResults: Nothing in this window. **Last week and last month are the useful defaults**, not
      today — an analytics screen opened on a Monday is asking about a period.
    emptyNoAccess: You do not have reporting permission at this scope. **Sections you cannot see are
      not shown** rather than greyed out.
    error: Could not load. **Trading is unaffected** — this reads and writes nothing.
    partial: '**Some tiles resolved and some did not, and it says which.** A dashboard showing three
      numbers where four were promised is a manager acting on an incomplete picture without knowing
      it.'
  entryState:
    params:
    - name: venueId
      from: session
    - name: domain
      from: session
      optional: true
    - name: dashboardId
      from: deepLink
    - name: reportId
      from: deepLink
    coldEntry: '**A bookmarked dashboard is the normal way in** — a manager opens the same view every
      Monday. The domain and the window come from the link where it carries them, and from the last
      view where it does not.'
  layout:
    template: dashboard
    regions:
    - name: contentBody
      components:
      - kind: multiSelect
        label: Domain
        notes: '**The selector that collapses 26 board screens into nine.** A domain is a filter on
          an analytics screen, not a copy of it — building three sets means maintaining one screen three
          times and watching them drift.'
      - kind: metricTile
      - kind: chart
        notes: '**Comparison against the previous period by default.** A number with nothing beside
          it is a number nobody can act on.'
      - kind: dataTable
  navigation:
    isEntryPoint: true
    exitTo:
    - ANL-002
    - ANL-003
    - ANL-004
    - ANL-005
    - ANL-006
    - ANL-007
    - ANL-008
    - ANL-009
    - ANL-010
  implementation:
    app: venue-management-web
    route: /analytics/executive-command-center
    component: apps/venue-management-web/src/routes/analytics/ExecutiveCommandCenterDashboard.tsx
    status: notStarted
  wireframe:
    status: designed
    board: wireframes/P16 Venue Analytics.dc.html#anl-001
    source: Claude Design POS pack, 24 August
    note: '**Drawn as POS-6A in the client POS pack.** The pack''s frame is the specification — it carries
      operations, states, entry params and exits, and it is better specified than anything derived from
      the screen file.'
    derivedFrom: wireframes/POS Board 6.dc.html#pos-6a
  provenance: client board, specified
  notes: '**Built 20 August. Answers 3 board screens**: F&B Executive Command Center; Retail Executive
    Command Center; Enterprise Frontline Operations Dashboard. **Three board screens, one screen with
    a domain selector.** F&B, Retail and POS each drew an executive command centre and they differ only
    in which numbers fill the tiles. **Owns POS board frame(s) POS-6A** (client pack, 24 August). **Assigned
    by board purpose rather than by operation overlap** — three attempts at deriving that mapping produced
    plausible nonsense, and a reader who trusts a bad table is worse off than one who has none. **Board
    repointed 24 August.** This screen pointed at `wireframes/POS Board 6.dc.html#pos-6a` — a frame
    in the client pack, which is where the design came from and not where this screen is drawn. **`P15
    Kitchen Display.dc.html` and `P16 Venue Analytics.dc.html` carry one anchor per screen and nothing
    referenced either**, so both shipped correctly anchored and unreachable. The pack frame is kept
    in `derivedFrom` because provenance is worth more than the wrong pointer.'
  requiresModule: analytics
  boardFrames:
  - FNB-6A
  - POS-6A
  - RET-6A
