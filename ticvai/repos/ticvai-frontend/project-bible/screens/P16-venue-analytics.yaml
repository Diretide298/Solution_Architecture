- id: ANL-010
  name: Suggestions & Advice
  module: Analytics
  wave: 3
  requiresModule: ai
  purpose: Every open suggestion, what it is based on, and whether the venue took it.
  density: compact
  apis:
  - operationId: requestSuggestion
    contract: ai
    purpose: Ask for an answer
    trigger: onAction
  - operationId: recordSuggestionOutcome
    contract: ai
    purpose: What the venue did
    trigger: onAction
  states:
    loading: Open suggestions, newest first, grouped by kind.
    emptyFirstRun: '**A venue with no history has nothing to suggest from**, and the screen says so
      rather than showing a rule dressed as advice. Names when there will be enough data.'
    emptyNoResults: Nothing open in this window. **Acted-on suggestions move to history rather than
      vanishing** — a manager reviewing last month needs to see what was advised.
    emptyNoAccess: You do not have AI permission at this venue.
    error: Could not load. **Trading is unaffected** — this advises and does not act.
    shadowRunning: '**A model is running alongside the rule and its answers are not shown.** Named here
      so a manager knows a comparison is in progress and when it reports.'
  entryState:
    params:
    - name: venueId
      from: session
    - name: suggestionId
      from: deepLink
      optional: true
    coldEntry: A bookmarked view opened weekly, or **a link from an alert naming one suggestion** —
      an alert that cannot take a manager to the thing it is about is a notification.
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: multiSelect
        label: Kind
      - kind: cardList
        bindsTo: Suggestion[]
        notes: '**The basis is on the card, not behind a tap.** A manager must see that today’s answer
          is a margin rule and next quarter’s is a model — the same screen, a different basis.'
      - kind: detailPanel
        notes: The explanation in plain words and the inputs it used. **Advice computed from data the
          manager cannot see is advice they will not trust.**
      - kind: primaryButton
        label: Take it
      - kind: secondaryButton
        label: Do something else
        notes: '**Records the outcome either way.** A rejected suggestion is the case the current rule
          got wrong, which is exactly what a model is trained to beat.'
  navigation:
    entryFrom:
    - ANL-001
    exitTo: []
  implementation:
    app: venue-management-web
    route: /analytics/suggestions
    component: apps/venue-management-web/src/routes/analytics/SuggestionsDashboard.tsx
    status: notStarted
  wireframe:
    status: designed
    board: wireframes/P16 Venue Analytics.dc.html#anl-010
    source: Claude Design POS pack, 24 August
    note: '**Drawn as POS-6F in the client POS pack.** The pack''s frame is the specification — it carries
      operations, states, entry params and exits, and it is better specified than anything derived from
      the screen file.'
    derivedFrom: wireframes/POS Board 6.dc.html#pos-6f
  provenance: client board, specified
  notes: '**Built 24 August.** The client F&B boards drew six suggestion endpoints — price, requisition,
    replenishment, scenario, SLA, demand plan. **One screen and one operation answer all six**, because
    a suggestion surface that differs per domain is six screens to change when the model changes. **Owns
    POS board frame(s) POS-6F** (client pack, 24 August). **Assigned by board purpose rather than by
    operation overlap** — three attempts at deriving that mapping produced plausible nonsense, and a
    reader who trusts a bad table is worse off than one who has none. **Board repointed 24 August.**
    This screen pointed at `wireframes/POS Board 6.dc.html#pos-6f` — a frame in the client pack, which
    is where the design came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html`
    and `P16 Venue Analytics.dc.html` carry one anchor per screen and nothing referenced either**, so
    both shipped correctly anchored and unreachable. The pack frame is kept in `derivedFrom` because
    provenance is worth more than the wrong pointer.'
  boardFrames:
  - POS-6F
