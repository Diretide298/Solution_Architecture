platform:
  code: P02
  audience: guest
  formFactor: mobileApp
  shortName: Guest App
  name: Guest App — Mobile
  surface: guestFacing
  runtime: reactNative
  offlineCapable: true
  offlineBanner:
    kind: banner
    state: warning
    message: You're offline. Connect to the internet to book, pay, order or join a queue.
    shows: The moment the connection drops, on every screen, above the screen's own content.
    clears: By itself as soon as the connection is back, with a short "Back online" confirmation.
    never: Covers what is already on screen, or appears for a server error — that is the screen's own
      error state, and a guest told they are offline when the venue is down reconnects for nothing.
    provenance: Decided 12 September 2026 — guest web and guest app behave identically offline and say
      so with the same banner.
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 71
  app: guest-app
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: iOS / Android native
    distribution: App Store + Play, tenant developer account
    bundleUpdate: over-the-air for JS; store release for native
    hosting: n/a — installed
    storeReview: true
    deviceOwnership: guest device
    networkAssumption: mobile data, intermittent
    releaseCadence: fortnightly, gated by review
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: White Label Builder — the guest app is what the builder configures.
  operator: guest
  wireframeBoard: wireframes/P02 Guest App.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: guest
    name: TICVAI Guest
    shell: mobile
    siblings:
    - P01
    - P05
    note: '**One guest product in three shells.** Web, mobile and kiosk share 73–91% of their operations;
      the kiosk is the same product in a fixed frame with no keyboard, and is deliberately narrower rather
      than different.'
    decided: 10 September 2026
screens:
- id: GST-001
  name: Home – Default
  module: Discovery & Browse
  requiresModule: marketing
  wave: 1
  capability: C02
  implementation:
    app: guest-app
    route: /general/home-default
    component: apps/guest-app/src/routes/general/HomeDefaultDashboard.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    inferred: true
    exitTo:
    - GST-002
    - GST-003
    - GST-004
    transitions:
    - to: GST-002
      trigger: Explore Categories
      provenance: structural — GST-001 is P02's home screen and its exits are its launcher
    - to: GST-003
      trigger: Event & Attraction Listing
      provenance: structural — GST-001 is P02's home screen and its exits are its launcher
    - to: GST-004
      trigger: Attraction Details
      provenance: structural — GST-001 is P02's home screen and its exits are its launcher
  notes: States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. Landing. **Declared
    only a health check.** Pranay asked for guest details and tickets; Chitrangi asked for search. All
    three existed and none were wired. **Rewired on the 20 August review.**
  openQuestions:
  - Inventory cites `GET /catalogue, local` — no matching operation. Written before the contracts existed.
  density: comfortable
  pattern: listDetail
  patternReason: '`listMyEntitlements` reads the population and `getTenantAppStatus` reads one of them
    — list, select, act'
  purpose: The screen this app sits on. Everything else is entered from here and returns to it.
  gaps:
  - operation: getGuestProfile
    why: '**2 declared operations reach no component on this screen**: getGuestProfile, searchCatalogue.
      Either the screen is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every home default
        bindsTo: Entitlement
        columns:
        - Entitlement.id
        - Entitlement.templateId
        - Entitlement.productId
        - Entitlement.orderId
        - Entitlement.orderLineId
        - Entitlement.subjectId
        - Entitlement.venueId
        - Entitlement.scopePath
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        operation: listMyEntitlements
        provenance: contract access.yaml GET /guests/me/entitlements
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected home default
        bindsTo: TenantAppStatus
        columns:
        - TenantAppStatus.isPublished
        - TenantAppStatus.publishedVersion
        - TenantAppStatus.publishedAt
        - TenantAppStatus.draftVersion
        - TenantAppStatus.hasUnpublishedChanges
        - TenantAppStatus.activeModuleCount
        - TenantAppStatus.licensedModuleCount
        - TenantAppStatus.activePageCount
        - TenantAppStatus.isInMaintenance
        - TenantAppStatus.maintenanceMessage
        - TenantAppStatus.expectedBackAt
        - TenantAppStatus.recentChanges
        operation: getTenantAppStatus
        provenance: contract white-label.yaml GET /tenant-config/status
  states:
    loading: The home default list.
    error: Could not load. Names which read failed and leaves the home default untouched.
    emptyFirstRun: No home default yet. Carries the create action; distinct from a filter that matched
      nothing.
    emptyNoResults: The filter narrowed it and the home default are still there. Names the active filter
      and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: App status and recent changes
    trigger: onLoad
  - operationId: getGuestProfile
    contract: marketing-crm
    purpose: Read a guest profile
    trigger: onLoad
  - operationId: listMyEntitlements
    contract: access
    purpose: Every ticket, pass and membership this guest holds
    trigger: onLoad
  - operationId: searchCatalogue
    contract: catalogue
    purpose: Find something by name
    trigger: onLoad
  - operationId: getTenantConfig
    contract: white-label
    purpose: Branding, currency and what this venue enables
    trigger: onLoad
  entryState:
    params:
    - name: subjectId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - TenantAppStatus.isPublished
    - TenantAppStatus.publishedVersion
    - TenantAppStatus.publishedAt
    - TenantAppStatus.draftVersion
    - TenantAppStatus.hasUnpublishedChanges
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P02 Guest App.dc.html#gst-001
  apisNote: Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
