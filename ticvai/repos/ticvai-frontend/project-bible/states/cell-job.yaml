# Cell job — state model
# Contract: subscription.CellJob.status
# Checked by tools/check-states.py.

entity: Cell job
contract: subscription
enum: CellJob.status
enumKind: inline
enumSchema: CellJob
enumProperty: status
owner: subscription
initial:
- queued
terminal:
- completed
- rolledBack
transitions:
- from: queued
  to: running
  trigger: job
  guard: Picked up
- from: queued
  to: failed
  trigger: job
  guard: 'A tier change''s job whose cell is `suspended`, `decommissioning` or `failed` when it would start (ADAM
    CR-489, Chinmay, 3 November 2026): the job fails, its `error` naming the cell''s status, and the cell is left as
    it is. A cell `migrating` for another job leaves the job queued, tried again later'
- from: running
  to: completed
  trigger: job
  guard: Done
- from: running
  to: failed
  trigger: job
  guard: '**The cell is left in a known state** — a job that fails halfway and reports nothing is worse
    than one that fails loudly'
- from: failed
  to: rolledBack
  trigger: job
  guard: Reversed where reversible
- from: failed
  to: queued
  trigger: job
  guard: Retried
  isReversal: true
notes: Provisioning, migration and configuration work against a single cell. **Idempotent by requirement**
  — a retried job must not double-apply.
