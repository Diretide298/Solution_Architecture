# API client — state model
# Contract: public-api.ApiClient.status

entity: API client
contract: public-api
enum: ApiClient.status
enumKind: inline
enumSchema: ApiClient
enumProperty: status
owner: public-api
initial:
- active
terminal:
- revoked
transitions:
- from: active
  to: suspended
  operation: setApiClientStatus
  trigger: operation
  guard: '**An integration misbehaving, paused on purpose.** Credentials, subscriptions and mappings are
    kept; `reason` is required (VM close-out, 29 September). Quota breach, a security event or a licence lapsing
    suspend through here too: a suspension is a conversation, a revocation is not'
- from: suspended
  to: active
  operation: setApiClientStatus
  trigger: operation
  guard: '**Resumed by the integration owner, the only way back to active** (ADAM CR-098, 25 October 2026;
    CHG-R10ID-011): `rotateApiCredential` never reactivates a client (409 `api-client-suspended`)'
  isReversal: true
- from: active
  to: revoked
  operation: revokeApiCredential
  trigger: operation
  guard: '**Terminal, and active tokens die with it.** Revoking the credential while leaving tokens
    alive is a revocation that takes an hour to mean anything'
- from: suspended
  to: revoked
  operation: revokeApiCredential
  trigger: operation
  guard: Never resolved
notes: '**Revocation never suspends and rotation never reactivates** (ADAM CR-098, 25 October 2026; CHG-R10ID-011):
  the r1 model had `revokeApiCredential` moving active to suspended and `rotateApiCredential` moving suspended back to
  active, which skipped `setApiClientStatus` and its reason. Both are gone.


  **`revoked` is terminal and the record stays.** An audit asking who called what last March needs
  the client to still resolve.


  **Suspension is reversible and revocation is not**, which is the whole reason both exist — an over-quota
  integrator should not need to re-onboard.'
