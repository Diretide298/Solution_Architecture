# device.enrolmentChanged v1 — published by tenancy
# Checked by tools/check-states.py against states/ and the contracts.

name: device.enrolmentChanged
version: 1
publisher: tenancy
description: A device moved through its lifecycle — enrolled, provisioned, activated, deactivated or retired.
aggregate: device
emittedWhen: enrolDevice succeeds (RegisteredDevice.enrolmentState changes)
payload:
- field: deviceId
  type: uuid
- field: kind
  type: string
- field: scopePath
  type: string
- field: fromState
  type: string
- field: toState
  type: string
- field: reason
  type: string
  required: false
- field: configurationProfileId
  type: uuid
  required: false
- field: changedAt
  type: timestamp
consumers:
- context: public-api
  purpose: Deliver to webhook subscriptions taking device.enrolmentChanged (16.9.56)
  idempotencyKey: deviceId + changedAt
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 1 year after publication
notes: '**The access consumer is gone** (ADR-0067, accepted 1 October): there is one device register, so there is
  nothing to keep in step, and Access reads a device''s lifecycle from tenancy when it places it or admits through
  it. The event stays for the webhook subscribers (16.9.56); ADR-0067''s action item says to drop it, and that is a
  person''s call while the public API offers it.


  **Added 29 September (build pass, group RD).** No state model emits this yet: `enrolmentState` has no state model (check-states warns on
  `tenancy.DeviceEnrolment.state`), so the emit sits on `enrolDevice`. The access consumer is the interim answer to the
  duplicated device register listed in RD.json `open`.'
