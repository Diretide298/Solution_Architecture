# wallet.credited v2 — published by wallet
# Added 29 September (system-design review SD-033, SD-027).
# v2 (20 October 2026, r8 cause APPROVALS-TENANCY-C30, the lead's option A): a game-card load carries the load
# itself (cardId, credits, bonusCredits, amountPaid, loadId), and an anonymous card's load writes no wallet
# transaction, so walletTransactionId is absent on it. The games consumer is built to v2.
# Versioning (r8 integration, CHG-R8INT-004; events/_schema.yaml): v2 is a major version, because a v1 reader
# that requires walletTransactionId cannot read an anonymous card's load. Wallet writes both versions to the
# outbox (one envelope each, `version` 1 and 2; v1 only where walletTransactionId exists) until every consumer
# listed below is built to v2, then stops v1. In Block A both consumers (ledger, games) are built at r8, so the
# side-by-side window is the r8 deployment only; a consumer states the version it reads in its inbox filter.

name: wallet.credited
version: 2
publisher: wallet
description: Money reached a wallet's available balance (top-up, refund, adjustment, a released hold).
aggregate: wallet
emittedWhen: topUpWallet, adjustWallet, releaseWalletHold or a refund to wallet moves the balance up; loadGameCredits and adjustGameCard move a game card's credits (kind gameCreditLoad or adjustment; walletId is the card's id for an anonymous card; 4 October 2026, CHG-FXC-006)
emittedBy:
- wallet.topUpWallet
- wallet.adjustWallet
- wallet.releaseWalletHold
- wallet.loadGameCredits
- wallet.adjustGameCard
payload:
- field: walletId
  type: uuid
  notes: The wallet, or the card's id for an anonymous game card.
- field: walletTransactionId
  type: uuid
  required: false
  notes: 'Absent on an anonymous game card''s load or adjustment (v2): no wallet transaction is written for it.'
- field: amount
  type: Money
- field: availableAfter
  type: Money
- field: kind
  type: string
- field: loadId
  type: uuid
  required: false
  notes: 'v2. On kind gameCreditLoad: the loadGameCredits request''s `id`; the games consumer''s idempotency key.'
- field: cardId
  type: uuid
  required: false
  notes: v2. On kind gameCreditLoad or a card adjustment, the games.card the credits go to.
- field: credits
  type: integer
  required: false
  notes: v2. On kind gameCreditLoad, the paid credits loaded (a count, not money).
- field: bonusCredits
  type: integer
  required: false
  notes: v2. On kind gameCreditLoad, the bonus credits loaded.
- field: amountPaid
  type: Money
  required: false
  notes: v2. On kind gameCreditLoad, what the guest paid; the ledger posts gameCreditLoaded for it.
consumers:
- context: ledger
  purpose: Increase the stored-value liability for a funded top-up, and post gameCreditLoaded for amountPaid on a
    game-card load
  idempotencyKey: walletTransactionId, or loadId on an anonymous game card's load (v2)
  onFailure: retryThenDeadLetter
  isCritical: true
- context: games
  purpose: 'Keep games.card''s credit and points balance in step when loadGameCredits or adjustGameCard moved a game
    card (kind gameCreditLoad or adjustment). On an anonymous card this consumer is the only writer of the card''s
    credits (v2): it adds `credits` and `bonusCredits` to games.card on its locked row. WalletService runs in
    commerce and the games schema is VenueOpsService''s, in operations (ADR-0055 rule 4, ADAM CR-002, CHG-R6-020)'
  writes:
  - games.card
  idempotencyKey: loadId on a game-card load (v2), walletTransactionId otherwise
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: No state model emits this.
