# maintenance.assetReturnedToService v1 — published by maintenance
# Checked by tools/check-states.py against states/ and the contracts.

name: maintenance.assetReturnedToService
version: 1
publisher: maintenance
description: An asset is verified and back in service.
aggregate: asset
emittedWhen: WorkOrderStatus completed to verified
payload:
- field: assetId
  type: uuid
- field: workOrderId
  type: uuid
- field: venueId
  type: uuid
- field: verifiedByPrincipalId
  type: uuid
  notes: Not the person who did the work
- field: isSafetyCritical
  type: boolean
- field: returnedAt
  type: timestamp
consumers:
- context: games
  purpose: Re-enable a game bound to this asset so it accepts play again
  idempotencyKey: assetId + workOrderId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: queue
  purpose: Reopen a queue for the attraction
  idempotencyKey: assetId + workOrderId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Availability
  idempotencyKey: assetId + workOrderId
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: '**Two critical consumers, and they are why this event is separate from completion.** A ride
  verified and back in service whose queue never reopened is a closed attraction nobody closed.'
