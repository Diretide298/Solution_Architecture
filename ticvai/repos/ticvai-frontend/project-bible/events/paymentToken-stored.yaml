# paymentToken.stored v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: paymentToken.stored
version: 1
publisher: orders
description: A guest saved a payment method for future use, and consented to its storage.
aggregate: paymentToken
emittedWhen: storePaymentToken succeeds
emittedBy:
- storePaymentToken
payload:
- field: tokenId
  type: uuid
  notes: The payments.token row. **Never the provider token or any card data**
- field: subjectId
  type: uuid
- field: consentPurpose
  type: string
  notes: The consent purpose the guest agreed to for storing the method
- field: channel
  type: string
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: marketing
  purpose: Record the consent to store the payment method as a marketing.consent_record, which Marketing owns, bound to
    the token and the subject
  writes:
  - marketing.consent_record
  idempotencyKey: tokenId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Added 12 October 2026 (ADAM CR-002, CHG-R6-020).** storePaymentToken runs in OrderService, in
  `commerce`; the consent record is MarketingService''s, in `operations`. The DB-ROLES grants refuse the direct
  INSERT, so the consent reaches its owner as this event (ADR-0055 rule 4, ADR-0057), and storing a card does not
  wait on the back office.


  No state model emits this: the token is created stored.'
