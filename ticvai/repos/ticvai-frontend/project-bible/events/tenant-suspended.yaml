# tenant.suspended v1 — published by subscription
# Checked by tools/check-states.py against states/ and the contracts.

name: tenant.suspended
version: 1
publisher: subscription
description: A tenant has been suspended, in one of three modes.
aggregate: tenant
emittedWhen: 'TenantStatus active to suspended: when Subscription''s approval.granted consumer applies the suspension
  suspendTenant raised (ADAM CR-172), for an immediate one, or by the workers job at control.tenant.suspension_effective_at for a future one. Written to control.outbox in the same transaction
  as the status change, with tenantId the suspended tenant and the scope path its root
  (control.cell_tenant.root_scope_path); drained by the workers relay (ADAM CR-152, 18 October 2026; CHG-CRA-005).
  **No operation emits it** (ADAM CR-172, fix round 3): suspendTenant writes only its approval request, so it is not
  an emitter and `emittedBy` is left out, as for the other events only a consumer or a job writes'
payload:
- field: tenantId
  type: uuid
- field: mode
  type: string
  notes: readOnly, noNewSales or fullLockout
- field: reason
  type: string
- field: effectiveAt
  type: timestamp
consumers:
- context: catalogue
  purpose: Stop publishing and stop new sales
  idempotencyKey: tenantId + effectiveAt
  onFailure: retryThenDeadLetter
  isCritical: true
- context: orders
  purpose: Refuse new orders per the mode
  idempotencyKey: tenantId + effectiveAt
  onFailure: retryThenDeadLetter
  isCritical: true
- context: white-label
  purpose: Show the tenant-branded suspension notice, not a generic error
  idempotencyKey: tenantId + effectiveAt
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Stop the tenant's batch work (indexing, forecasting, risk scoring) and freeze its action
    plans so nothing executes on a suspended tenant (AI system design section 3.2)
  idempotencyKey: tenantId + effectiveAt
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Access validation is deliberately not a consumer.** A commercial dispute must not strand guests
  at a gate holding valid tickets, under any mode.'
