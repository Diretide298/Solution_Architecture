# consent.deviceConsentRecorded v1 — published by marketing
# Checked by tools/check-states.py against states/ and the contracts.

name: consent.deviceConsentRecorded
version: 1
publisher: marketing
description: A visitor nobody has identified yet made a cookie decision on a banner or preference centre — accepted, rejected, saved preferences, withdrew or opted out of sale and sharing.
aggregate: deviceConsent
emittedWhen: recordDeviceConsent succeeds (one append-only marketing.device_consent row)
payload:
- field: deviceConsentId
  type: uuid
- field: consentKey
  type: string
  notes: The opaque key the platform minted for the browser or app (not a fingerprint). What a CDP joins its own device record on
- field: channel
  type: string
  notes: CookieConsentChannel
- field: brandId
  type: uuid
  required: false
- field: action
  type: string
  notes: One of acceptAll, rejectNonEssential, savePreferences, withdraw, doNotSellOrShare
- field: categories
  type: array
  notes: Every category of the design with its decision (granted or declined), as written
- field: noticeVersion
  type: string
- field: globalPrivacyControl
  type: boolean
- field: country
  type: string
  required: false
  notes: The edge's geolocation of the request. **No IP address or user agent** — those stay in pii.consent_identifier
- field: decidedAt
  type: timestamp
- field: expiresAt
  type: timestamp
  required: false
- field: scopePath
  type: string
consumers:
- context: public-api
  purpose: Deliver to webhook subscriptions taking consent.deviceConsentRecorded, so a CDP or CRM receives the consent signal for an unidentified visitor (2.6.65)
  idempotencyKey: deviceConsentId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication; the decision itself is kept in marketing.device_consent as evidence
notes: '**Added 29 September (build pass, group OWN, from group RB''s handoff, BL-073).** Google Analytics and
  Tag Manager consent mode read the decision in the page (`getCookieConsentRuntime` consentModeSignals); a CDP
  or CRM outside the page had nothing to subscribe to, and this is it.


  No state model emits this: a device consent is append-only, so every decision is a new row created by
  `recordDeviceConsent` rather than a status change. The operation writes `platform.outbox` in the same
  transaction as the row (ADR-0033).'
