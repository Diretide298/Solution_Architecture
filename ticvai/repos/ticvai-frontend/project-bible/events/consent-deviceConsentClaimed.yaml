# consent.deviceConsentClaimed v1 — published by marketing
# Checked by tools/check-states.py against states/ and the contracts.

name: consent.deviceConsentClaimed
version: 1
publisher: marketing
description: A browser's cookie decision was attached to the guest who signed in or registered on it, and the guest's consent became the narrower of the two per category.
aggregate: deviceConsent
emittedWhen: claimDeviceConsent succeeds for the first time for a key (a repeat claim by the same subject publishes nothing)
payload:
- field: deviceConsentId
  type: uuid
- field: consentKey
  type: string
- field: subjectId
  type: uuid
  notes: The guest who now owns the decision
- field: channel
  type: string
- field: brandId
  type: uuid
  required: false
- field: categories
  type: array
  notes: Per category the decision after the claim — the narrower of the browser's and the guest's (CF-160)
- field: noticeVersion
  type: string
- field: claimedAt
  type: timestamp
- field: scopePath
  type: string
consumers:
- context: public-api
  purpose: Deliver to webhook subscriptions taking consent.deviceConsentClaimed, so a CDP or CRM can join an anonymous visitor's consent to a known profile (2.6.65)
  idempotencyKey: deviceConsentId + subjectId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication; the claim itself is kept on marketing.device_consent and as ConsentRecords
notes: '**Added 29 September (build pass, group OWN, from group RB''s handoff, BL-073).** The per-purpose
  `ConsentRecord`s the claim writes reach the guest''s own consent history; this is what tells a system outside
  TICVAI that the anonymous key now belongs to a subject.


  No state model emits this: `claimedBySubjectId` is set once and never cleared, which is a stamp on the row,
  not a lifecycle. `claimDeviceConsent` writes `platform.outbox` in the same transaction (ADR-0033).'
