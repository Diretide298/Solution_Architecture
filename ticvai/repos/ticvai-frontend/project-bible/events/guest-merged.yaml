# guest.merged v1 — published by marketing
# Checked by tools/check-states.py against states/ and the contracts.

name: guest.merged
version: 1
publisher: marketing
description: Two guest records were found to be one person and merged into a survivor.
aggregate: guest
emittedWhen: mergeGuests succeeds
emittedBy:
- mergeGuests
payload:
- field: survivorSubjectId
  type: uuid
- field: mergedSubjectId
  type: uuid
  notes: The record that is folded into the survivor
- field: mergedByPrincipalId
  type: uuid
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: identity
  purpose: Fold the merged subject into the survivor on pii.subject, which Identity owns, and move the merged
    subject's identity.subject_holding rows to the survivor (ADAM CR-084, CHG-GDL-001). **Ids only travel**; the
    personal data never leaves the pii schema
  writes:
  - pii.subject
  - identity.subject_holding
  idempotencyKey: mergedSubjectId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Added 12 October 2026 (ADAM CR-002, CHG-R6-020).** mergeGuests runs in MarketingService, in
  `operations`; pii.subject is IdentityService''s, in `commerce`. The DB-ROLES grants refuse the direct UPDATE, so
  the merge reaches the owner as this event (ADR-0055 rule 4, ADR-0057). marketing.guest_profile is merged in the
  operation''s own transaction.


  No state model emits this: a merge is not a status of the guest.'
