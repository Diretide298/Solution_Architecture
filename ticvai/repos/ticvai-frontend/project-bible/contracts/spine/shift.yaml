  /shifts/{shiftId}/close:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeShift
      x-ticvai-consumed-by:
        - "P04 POS-007 Close Shift"
        - "P08 BO-040 Variance Approval"
        - "P08 BO-043 Daily Reconciliation"
      x-ticvai-audience: [staff]
      summary: Blind close-out
      description: >
        The operator submits a counted denomination breakdown. The expected figure is not
        returned before submission — that is what makes the count blind.

        The response carries the variance. Where it exceeds the configured threshold, the
        shift moves to `pendingVariance` and requires OVERSHORT_ACCEPT to finalise.

        **The threshold is the venue setting `shiftVarianceThreshold`, with a tenant default**, an
        absolute amount either way, over or short (decided 28 September, audit R094). **Proposed
        default, client to correct (audit R094): AED 20.00 per shift.**

        **`acceptShiftVariance` is the one way past that threshold** (decided 28 September, audit
        R080 (e)): a supervisor accepts the variance on the till. The close is not held for a PIN
        before this call, and no approval request is raised for it.

        Closing a shift opened by another principal requires SHIFT_CLOSE_OTHER.

        Where the venue requires approval on close, the shift waits in `pendingClosure` for
        `approveShiftClose` (SHIFT_APPROVE_CLOSE).

        **The cashier never sees the expected cash** (decided 2 October 2026, Chinmay; CHG-FIN-003).
        This response carries `expectedCash` and `variance`, so it is the **supervisor and back-office
        close** (BO-039, BO-040: closing a shift on a cashier's behalf). A cashier counting their own
        drawer at the till or on the staff app submits the count with `submitShiftCount`, which returns
        neither figure. A caller closing a shift they opened themselves, without OVERSHORT_ACCEPT, is
        refused 403 `blind-count-required`. Retail practice and the client's reason are in
        docs/active/research-uae-vat-and-blind-close-2-october.md (MoM 9 Sep 2026 4.18, DI-271, DI-806).

        **Online only** (F32, 26 September pull audit R257). Closing needs the server's total — a
        variance computed against a stale local journal is not a variance — and POS-007 and
        `states/shift.yaml` (`pendingClosure` is not offline-reachable) already said so.

        **The supervisor's close: on POS-007 with a supervisor PIN, at any till, and in the daily cash
        reconciliation** (decided 2 October 2026, Chinmay, pre-apply round: "closeShift is declared on
        POS-007 (supervisor PIN, any till) and in the daily cash reconciliation"; batch 3 #1 and batch 6
        #174; DEC-059, DEC-173; CHG-CSP-012). A supervisor closes a cashier's shift at the till the
        cashier left (POS-007), at any other till of the venue, or from the daily cash reconciliation
        (BO-043), which lists every shift of the day and resolves them one by one: a shift still open is
        closed here, a counted shift waiting for review is accepted (`acceptShiftVariance`) or sent back
        for a recount (`rejectShiftVariance`). The supervisor presents their own PIN on the device in
        use; the cashier's own count stays `submitShiftCount`.

        **The step-up travels in the body** (Chinmay, 3 October 2026, defaults taken; CHG-RUL-019), as on
        `reopenShift` and `rejectShiftVariance`: `supervisorStepUp` carries the principal and PIN of the supervisor closing the shift, entered on the
        device making this call, verified as `common.yaml` `SupervisorStepUp` says. Optional in the schema so a
        client built at r1 still validates, **refused without it** (`403 supervisor-step-up-refused`).
      tags: [shift]
      x-ticvai-permission: SHIFT_CLOSE
      x-ticvai-permission-escalated: SHIFT_CLOSE_OTHER   # where the shift belongs to somebody else
      x-ticvai-step-up: pin
      x-ticvai-step-up-reason: A supervisor closes a cashier's shift and sees the expected cash and the variance (CHG-FIN-003); their own PIN on the device in use proves who did it (pre-apply round, 2 October; CHG-CSP-012).
      x-ticvai-step-up-carrier: body:supervisorStepUp
      x-ticvai-scope-level: venue   # was workstation; the supervisor closes from any till or the back office (CHG-CSP-012)
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CloseShiftRequest'
                - type: object
                  properties:
                    supervisorStepUp:
                      allOf:
                        - $ref: '../shared/common.yaml#/components/schemas/SupervisorStepUp'
                      description: >
                        The supervisor closing the shift, signing on this device (CHG-RUL-019). Refused without
                        it (`403 supervisor-step-up-refused`). Not on `submitShiftCount`, which shares the count
                        schema and asks no step-up.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Closed, or held pending variance acceptance or approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftCloseResult' }
        '403':
          description: >
            The caller is the cashier whose shift it is and does not hold OVERSHORT_ACCEPT (problem
            type `blind-count-required`): their count goes through `submitShiftCount`, which never
            returns the expected figure (CHG-FIN-003). Or the caller lacks SHIFT_CLOSE, or
            SHIFT_CLOSE_OTHER for somebody else's shift (`forbidden`). One `403` since 2 October 2026:
            the second key this response map carried made YAML drop the first (CHG-CSP-012). Or the
