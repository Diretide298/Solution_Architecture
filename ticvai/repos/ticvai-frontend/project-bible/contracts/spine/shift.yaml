            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: >
                    Why a recount is needed, shown to the cashier. Never the amount: "Count the AED 100 notes
                    again", not "you are AED 100 short". Retained for audit with the rejecting principal.
                supervisorStepUp:
                  allOf:
                    - $ref: '../shared/common.yaml#/components/schemas/SupervisorStepUp'
                  description: >
                    The supervisor sending the shift back, signing on this device (CHG-RUL-014, as `reopenShift`).
                    Optional in the schema so a client built at r1 still validates, **refused without it**
