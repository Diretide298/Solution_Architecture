        tills does not close them one at a time, and a box whose holder has gone home still has to
        be reconciled.

        A box closed without its holder present is flagged rather than blocked — **the cash is
        counted by somebody, and who counted it is the record that matters.**

        **Counted figures are required, and a mismatch still closes** (decided 28 September, audit
        R123 (4)). Every box being closed needs an entry in `counts`, as a total or a denomination
        count (a denomination count takes precedence where both are sent). A box whose count differs
        from its expected figure closes with that difference recorded as its `variance`; it is not
        refused. A box still `allocated`, never traded, needs no count and closes at its opening
        float.
