    post:
      operationId: createCashMovement
      x-ticvai-consumed-by:
        - "P04 POS-017 Cash In / Cash Out Operations"
        - "P04 POS-018 Safe Drop & Cash Transfer Management"
        - "P08 BO-041 Cash Movements"
        - "P08 BO-042 Banking & Safe"
      x-ticvai-audience: [staff]
      summary: Record a cash lift or add
      description: >
        A lift removes cash from an open float mid-shift without closing it — the supervisor
        takes the excess to the safe and the cashier keeps trading. Both directions are
        traced, both record the authorising principal, and both adjust the expected figure
        used at close.

        **What "exceeds the counted float" means** (decided 28 September, audit R123 (2)): the
        cash available to lift is the float counted at the shift's last count (the opening float,
        or the last `movement` count if one is later), less every lift recorded since, plus every
        add. A lift larger than that is refused with `lift-exceeds-float`. Cash taken in sales since
        the last count does not count towards it, because nobody has counted it.

        **The drawer limit offers the lift** (decided 2 October 2026, Chinmay, batch 6 #179, BO-042:
        "Add drawer limit setting (warn + offer cash lift)"; DEC-179; CHG-CSP-016; DI-274). When the cash
        a till has taken since its last count puts the drawer over the till's limit
        (`tenancy.Workstation.cashDrawerLimit`, else `tenancy.VenueSettings.cashDrawerLimit`), the till
        warns and offers a lift recorded here; `DepositBox.overDrawerLimit` flags the box on BO-042. The
        warning never blocks a sale, and the cashier is told only that the drawer is over its limit, not
        what it holds (CHG-FIN-003). A supervisor recording the lift counts what they take, which makes it
        counted cash.
