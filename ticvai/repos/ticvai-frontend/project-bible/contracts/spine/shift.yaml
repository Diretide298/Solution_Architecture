        - "P04 POS-007 Close Shift"
        - "P08 BO-040 Variance Approval"
        - "P08 BO-043 Daily Reconciliation"
      x-ticvai-audience: [staff]
      summary: Send a counted shift back for a recount
      description: >
        **A supervisor rejects the variance and the cashier recounts and resubmits** (decided 2 October
        2026, Chinmay, batch 6 #175, BO-040: "Add Reject + recount (DI-804)"; DEC-175; CHG-CSP-013; MoM
        9 September 4.18, DI-804). Until 2 October the only way back was `reopenShift` on BO-039, which
        reopens a closed shift for trading; a recount is narrower and happens before anything is
        accepted.

        From `pendingVariance` only. The shift **stays `pendingVariance`** with `recountRequestedAt`,
        `recountRequestedByPrincipalId` and `recountReason` set (`states/shift.yaml`: the recount
        transition; no new status, so clients built at r1 keep the values they switch on). The cashier
        whose shift it is sees "Recount requested" rather than "Under review", recounts the box at any
        till of the venue and submits with `submitShiftCount`; the new lines point at the ones they
        replace (`CashCountLine.recountOf`), the latest count is the one measured, and the request flags
        clear. Still blind: the rejection carries the supervisor's reason and never the expected figure
        or the variance (CHG-FIN-003).

        **The supervisor's step-up travels in the body, as on `reopenShift`** (Chinmay, 3 October 2026,
        Block A business rules; CHG-RUL-014). `supervisorStepUp` carries the supervisor's principal and PIN,
        entered on the till or the BO-043 browser making this call. The rule is `SupervisorStepUp` in
        `common.yaml`: the PIN is verified against the principal, who must hold `OVERSHORT_ACCEPT` at this
        venue and must not be the cashier whose shift it is; otherwise a `403` and nothing is written.
      tags: [shift]
      x-ticvai-permission: OVERSHORT_ACCEPT
      x-ticvai-step-up: pin
      x-ticvai-step-up-reason: The same supervisor act as accepting a variance, in person with their own PIN (audit R080 (e); DEC-175).
      x-ticvai-step-up-carrier: body:supervisorStepUp
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
