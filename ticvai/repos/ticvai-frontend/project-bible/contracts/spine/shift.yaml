        before it is submitted, and no approval request (`approvals.createApprovalRequest`) is raised
        for a shift variance. BO-040 lists the shifts waiting here; it does not approve them by
        another route.

        Moves the shift to `closed` and each of its deposit boxes from `closed` to `reconciled`
        (`states/shift.yaml`, `states/deposit-box.yaml`).

        **Any till at the venue, and the daily cash reconciliation, with the supervisor's PIN** (decided
