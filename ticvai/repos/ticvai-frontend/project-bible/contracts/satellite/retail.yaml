      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRule'
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Change a store rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreRule'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /product-recommendations:
    get:
      operationId: listRetailRecommendations
      summary: Upsell and pairing suggestions for retail
      description: >
        **A channel adapter of the one recommendation engine** (ADR-0052, accepted 1 October). This operation stays as the retail basket surface, with its path, id and response shape. **Block A**: the promotions module answers it from the relationship map (rules; strategy, relationships, business priority and suppression are configured in promotions). **Block B**: it forwards to the engine in `ticvai-ai` (ai `decideRecommendations`, placement `retailBasket`) with no contract change, under a hard 200 ms budget and failing open to the rules answer, so checkout never waits on it. New screens may bind either; the deprecation of 29 September is withdrawn.

        The retail half of the same table F&B keeps. **Separate because the merchandising is
        separate** — a coffee pairs with a pastry and a jacket pairs with a hat, and one list
        serving both would be filtered on every read.
      tags:
      - retail
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Upsell and pairing suggestions for retail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RetailProductRecommendation'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
components:
  schemas:
    RetailProductRecommendation:
      type: object
      x-ticvai-persistence: retail.product_recommendation
      description: '**Taken from the backend workbook, 20 September.** Defines Retail upsell, cross-sell and add-on recommendations, including optional cross-service targets.'
      required:
      - sourceProductId
      - type
      - targetService
      - targetProductId
      - defaultQuantity
      - priority
      - isActive
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        scopePath:
          type: string
          nullable: true
        sourceProductId:
          type: string
          format: uuid
        sourceVariantId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          maxLength: 30
        targetService:
          type: string
          maxLength: 30
        targetProductId:
          type: string
          format: uuid
        targetVariantId:
          type: string
          format: uuid
          nullable: true
        displayMessage:
          type: string
          maxLength: 300
          nullable: true
        defaultQuantity:
          type: number
        maxQuantity:
          type: number
          nullable: true
        priority:
          type: integer
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    StoreRule:
      type: object
      x-ticvai-persistence: retail.store_rule
      # 26 September: `thresholdMinor` (an integer of minor units that also stood for an age)
      # split into `thresholdAmount` (Money) and `minimumAgeYears`. naming-and-style 5.1: money
      # is Money, never an integer and never a float.
      x-ticvai-retired-columns:
      - threshold_minor
      description: '**Drafted 4 September.** One rule or control in force in a store - a discount
        limit, a refund threshold, an age check, a manager override. **A row rather than a config
        value** because somebody has to be able to say who changed a limit and when, which is
        what `updatedAt` and `updatedByPrincipalId` record.


        **Which limit field a kind uses.** `refundThreshold` uses `thresholdAmount`. `ageCheck`
        uses `minimumAgeYears`. **Not yet decided:** whether a `discountLimit` or a
        `priceOverride` limit is an amount or a percentage, and whether a `managerOverride` has a
        limit at all. Until that is decided those kinds carry no limit field of their own.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - discountLimit
          - refundThreshold
          - ageCheck
          - managerOverride
          - priceOverride
        thresholdAmount:
          allOf:
          - $ref: '../shared/common.yaml#/components/schemas/Money'
          nullable: true
          description: The amount above which `requiresPermission` is needed. For `refundThreshold`.
        minimumAgeYears:
          type: integer
          minimum: 0
          nullable: true
          description: The age a guest must have reached. For `ageCheck`.
        requiresPermission:
          type: string
          description: The permission a person needs to act past this rule.
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
          description: Who last changed this rule. Set by the server from the caller of `setStoreRules`.
    MerchandiseItem:
      x-ticvai-persistence: "retail.merchandise"
      type: object
      required: [id, sku, name, outletId, variantId, price, onHand, isActive]
      properties:
        description:
          type: string
          description: 'What the item is, in the guest''s words. Indexed for guest-app search.

            '
        id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        outletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        variantId:
          type: string
          format: uuid
          description: The catalogue variant sold. Price and tax come from there.
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
          description: >
            The stock item depleted on sale. Null means the item sells but never runs out,
            which is almost always a configuration error.
        price: { $ref: '../shared/common.yaml#/components/schemas/Money', x-ticvai-column: list_price }
        onHand: { type: number }
        isReturnable: { type: boolean, default: true }
        returnWindowDays: { type: integer, nullable: true }
        requiresSerialNumber: { type: boolean, default: false }
        imageAssetRef: { type: string, nullable: true }
        isActive: { type: boolean }

    GuestMerchandiseItem:
      x-ticvai-persistence: "none — guest projection of MerchandiseItem"
      type: object
      description: >
        **What a guest caller of `listMerchandise` receives.** The fields a shop screen shows
        and the ids a guest needs to reserve or buy, and nothing else: no inventory link, no
        catalogue variant, no stock count, no serial-number flag. `additionalProperties: false`
        is the guarantee: a staff field added to `MerchandiseItem` does not reach a guest by
        default.
      additionalProperties: false
      required: [id, name, outletId, price, isAvailable]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        outletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        price: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        isAvailable:
          type: boolean
          description: >
            True when the item is active and in stock at its outlet. An item with no
            `inventoryItemId` never runs out, so it is available while active.
        isReturnable: { type: boolean }
        returnWindowDays: { type: integer, nullable: true }
        imageAssetRef: { type: string, nullable: true }

    MerchandiseConflictProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason]
          properties:
            refusedReason:
              type: string
              enum: [barcodeInUse]
            conflictingMerchandiseId:
              type: string
              format: uuid
              description: The item that already carries the barcode.

    CreateMerchandiseRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [sku, name, outletId, variantId]
      properties:
        sku: { type: string, maxLength: 64 }
        barcode: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 200 }
        description:
          type: string
          description: What the item is, in the guest's words. Indexed for guest-app search.
        outletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        isReturnable: { type: boolean, default: true }
        returnWindowDays: { type: integer }
        requiresSerialNumber: { type: boolean, default: false }
        imageAssetRef: { type: string }

    PriceCheck:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [merchandiseId, name, listPrice, effectivePrice, onHand]
      properties:
        merchandiseId: { type: string, format: uuid }
        outletId:
          type: string
          format: uuid
          description: >
            The outlet whose price and stock this is: the asking workstation's outlet, or
            `outletId` for a caller with none (decided 28 September, audit R215).
        sku: { type: string }
        name: { type: string }
        listPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        effectivePrice:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: After any live promotion.
        appliedPromotionCode: { type: string, nullable: true }
        onHand: { type: number }
        isAvailable: { type: boolean }
        siblingOutlets:
          type: array
          description: Stock elsewhere in the venue, so a colleague can be sent.
          items:
            type: object
            properties:
              outletId: { type: string, format: uuid }
              outletName: { type: string }
              onHand: { type: number }

    CreateRetailSaleLine:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, merchandiseId, quantity]
      properties:
        id: { type: string, format: uuid }
        merchandiseId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        serialNumbers:
          type: array
          items: { type: string }
          description: Required where the item is serialised. One per unit.
        overridePrice:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Manual price override. Requires PRICE_OVERRIDE and records a reason.
        overrideReason: { type: string, maxLength: 200 }

    CreateRetailSaleRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, outletId, lines, recordedAt]
      properties:
        id: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        shiftId: { type: string }
        subjectId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateRetailSaleLine' }
        couponCodes:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }

    RetailSale:
      x-ticvai-persistence: "retail.sale + retail.sale_line"
      type: object
      required: [id, receiptNumber, orderId, outletId, lines, grossAmount, createdAt]
      properties:
        id: { type: string }
        receiptNumber:
          type: string
          readOnly: true
          description: >
            **Server-assigned: the venue prefix plus a sequence per venue** (decided 28
            September, audit R152). Each till holds a reserved range of the venue's sequence,
            so a sale made offline prints its number at once and the server accepts it on
            sync. **Not gapless**: an unused reserved number is skipped, not reissued. Only
            tax invoices are gapless, per legal entity.
        orderId:
          type: string
          description: The order in the Order & Payment context. Retail does not keep its own ledger.
        outletId: { type: string, format: uuid }
        shiftId: { type: string, nullable: true }
        subjectId: { type: string, format: uuid, nullable: true }
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string }
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              discount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              lineTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              serialNumbers:
                type: array
                items: { type: string }
              returnedQuantity: { type: integer }
              isReturnable:
                type: boolean
                description: False once the window has passed or the line is fully returned.
              notReturnableReason: { type: string, nullable: true }
        subtotal: { $ref: '../shared/common.yaml#/components/schemas/Money', x-ticvai-column: net_amount }
        discountAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        reprintCount: { type: integer }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    StockConflictProblem:
      x-ticvai-persistence: "none — error shape"
      description: >
        The 409 of `createRetailSale`, `createRetailExchange` and `reserveMerchandise`.
        `refusedReason` tells the causes apart; each operation lists the values it can return.
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason]
          properties:
            refusedReason:
              type: string
              enum:
                - insufficientStock
                - serialNumberRequired
                - terminalOffline
                - originalNotExchangeable
            lines:
              type: array
              items:
                type: object
                properties:
                  merchandiseId: { type: string, format: uuid }
                  name: { type: string }
                  requested: { type: number }
                  available: { type: number }
                  siblingOutletsWithStock:
                    type: array
                    items:
                      type: object
                      properties:
                        outletId: { type: string, format: uuid }
                        outletName: { type: string }
                        onHand: { type: number }

    ReturnCondition:
      type: string
      description: Determines whether stock is restored or written off.
      enum: [resaleable, opened, damaged, faulty, missingParts]

    ReturnReason:
      type: string
      enum: [changedMind, wrongSize, wrongItem, faulty, damagedInTransit, duplicatePurchase, giftReturn, other]

    CreateRetailReturnRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, saleId, lines, reason, recordedAt]
      properties:
        id: { type: string, format: uuid }
        saleId: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, quantity, condition]
            properties:
              lineId: { type: string }
              quantity: { type: integer, minimum: 1 }
              condition: { $ref: '#/components/schemas/ReturnCondition' }
              serialNumbers:
                type: array
                items: { type: string }
              note: { type: string, maxLength: 200 }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        refundTender:
          type: string
          description: >
            Defaults to the original tender. Cash refunds against a card sale usually need
            approval, per the outlet's return policy.
        secondaryAuthorisation:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/SupervisorStepUp'
          description: >
            Required above the outlet's self-authorise limit. **A supervisor's step-up on the
            same device** (decided 28 September, audit R144): `credential` is the supervisor's
            staff PIN, never a password (audit R123 (7)), as on orders `CreateRefundRequest`.
            The principal must hold `ORDER_REFUND_APPROVE` at this venue and must not be the
            caller.
        recordedAt: { type: string, format: date-time }

    RetailReturn:
      x-ticvai-persistence: "retail.return + retail.return_line"
      type: object
      required: [id, saleId, lines, status, refundAmount, restockedQuantity, writtenOffQuantity, createdAt]
      properties:
        id: { type: string }
        returnNumber: { type: string }
        saleId: { type: string }
        refundId:
          type: string
          nullable: true
          description: The refund raised in the Order & Payment context.
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string }
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              condition: { $ref: '#/components/schemas/ReturnCondition' }
              wasRestocked:
                type: boolean
                description: >
                  False for opened, damaged or faulty goods, which are written off with a
                  reason rather than silently absent.
              refundAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        refundAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundTender: { type: string }
        restockedQuantity: { type: integer }
        writtenOffQuantity: { type: integer }
        status:
          allOf:
            - $ref: '#/components/schemas/RetailReturnStatus'
          readOnly: true
        refusedReason:
          allOf:
            - $ref: '#/components/schemas/ReturnRefusedReason'
          nullable: true
          readOnly: true
          description: Set when `status` is `refused`, null otherwise.
        acceptedByPrincipalId:
          type: string
          format: uuid
          description: Who took the return at the desk. On a refused return, who attempted it.
        secondaryPrincipalId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    RetailReturnStatus:
      type: string
      description: >
        `accepted`: goods came back and the refund was raised. `refused`: the return policy
        refused it; nothing was refunded, restocked or written off, and the row exists so the
        refusal can be found later.
      enum: [accepted, refused]

    ReturnRefusedReason:
      type: string
      description: Why the return policy refused a return. One value per cause.
      enum:
        - outsideReturnWindow
        - itemNotReturnable
        - alreadyReturned
        - requiresSecondUser
        - requiresApproval
        - receiptRequired
        - serialNumberMismatch

    ReturnPolicyProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason, refusalId]
          properties:
            refusedReason: { $ref: '#/components/schemas/ReturnRefusedReason' }
            refusalId:
              type: string
              format: uuid
              description: >
                The id of the `RetailReturn` recorded with `status: refused`. Assigned by the
                server; not the request's `id`.
            windowDays: { type: integer }
            daysSincePurchase: { type: integer }
            threshold: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    ReturnPolicy:
      x-ticvai-persistence: "retail.return_policy"
      type: object
      required: [outletId, defaultWindowDays, requiresReceipt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        outletId: { type: string, format: uuid }
        defaultWindowDays: { type: integer, minimum: 0 }
        requiresReceipt: { type: boolean, default: true }
        allowCashRefundOnCardSale: { type: boolean, default: false }
        selfAuthoriseLimit:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Up to this, one cashier may accept a return alone.
        requiresSecondUserAbove: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        requiresApprovalAbove: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        restockableConditions:
          type: array
          description: >
            Conditions that return stock to sale. Everything else is written off.


            Stored as a `text[]` column on `retail.return_policy`, like
            `nonReturnableCategoryIds`. The items wrap the enum in `allOf` so the schema
            derivation reads a list of values rather than a child table.
          items:
            allOf:
              - $ref: '#/components/schemas/ReturnCondition'
        nonReturnableCategoryIds:
          type: array
          items: { type: string, format: uuid }

    CreateExchangeRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, saleId, returnLines, replacementLines, recordedAt]
      properties:
        id: { type: string, format: uuid }
        saleId: { type: string }
        returnLines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, quantity, condition]
            properties:
              lineId: { type: string }
              quantity: { type: integer, minimum: 1 }
              condition: { $ref: '#/components/schemas/ReturnCondition' }
        replacementLines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateRetailSaleLine' }
        recordedAt: { type: string, format: date-time }

    RetailExchange:
      x-ticvai-persistence: "retail.exchange"
      type: object
      required: [id, saleId, returnId, newSaleId, difference]
      properties:
        id: { type: string }
        saleId: { type: string }
        returnId: { type: string }
        newSaleId: { type: string }
        returnedValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        replacementValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        difference:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Positive means the guest pays; negative means a refund is due. Only the
            difference settles.
        createdAt: { type: string, format: date-time }






    OutletStockLine:
      x-ticvai-persistence: "none — projection over inventory"
      type: object
      required: [merchandiseId, name, onHand, isBelowReorderPoint]
      properties:
        merchandiseId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        categoryName: { type: string, nullable: true }
        onHand: { type: number }
        allocated:
          type: number
          description: Held by an unexpired collection reservation.
        available: { type: number }
        isBelowReorderPoint: { type: boolean }
        lastSoldAt: { type: string, format: date-time, nullable: true }

    ShopAndDrop:
      type: object
      x-ticvai-persistence: "retail.shop_and_drop + retail.shop_and_drop_line"
      required: [id, dropReference, collectionPointId, status, collectBy]
      properties:
        id: { type: string }
        dropReference:
          type: string
          description: Short and readable. Printed on the slip a guest may or may not keep.
        saleId:
          type: string
          nullable: true
          description: The till sale. Null for an online order, which sets `orderId` (audit R236).
        orderId:
          type: string
          format: uuid
          nullable: true
          description: The paid online order that created this collection (audit R236).
        entitlementId:
          type: string
          nullable: true
          description: >
            The ticket that claims these goods. The point of 4.4.7 — a guest does not have to
            keep a receipt safe for eight hours in a water park.
        subjectId: { type: string, format: uuid, nullable: true }
        collectionPointId: { type: string, format: uuid }
        collectionPointName: { type: string }
        status:
          type: string
          enum: [awaitingCollection, partiallyCollected, collected, uncollected, disposed]
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string }
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              collectedQuantity: { type: integer }
        droppedAt: { type: string, format: date-time }
        collectBy: { type: string, format: date-time }
        collectedAt: { type: string, format: date-time, nullable: true }
        collectedByPrincipalId: { type: string, format: uuid, nullable: true }
        verifiedBy: { type: string, nullable: true }

    ShopAndDropProblem:
      x-ticvai-persistence: "none — error shape"
      description: >
        The 409 of `createShopAndDrop` and `collectShopAndDrop`. `refusedReason` tells the
        causes apart; each operation lists the values it can return.
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason]
          properties:
            refusedReason:
              type: string
              enum:
                - alreadyDropped
                - itemNotDroppable
                - collectionPointClosed
                - alreadyCollected
                - pastCollectBy
            lineIds:
              type: array
              description: For `itemNotDroppable`, the sale lines that cannot be dropped.
              items: { type: string }

    MerchandiseReservation:
      x-ticvai-persistence: "retail.reservation + retail.reservation_line"
      type: object
      required: [id, outletId, lines, status, expiresAt]
      properties:
        id: { type: string }
        reservationNumber: { type: string }
        outletId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        lines:
          type: array
          items:
            type: object
            properties:
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
        status:
          type: string
          enum: [reserved, collected, expired, cancelled]
        collectionNote: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        collectedAt: { type: string, format: date-time, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell, as `common.yaml` `serviceAuth`. Used by the order service calling
        `createShopAndDrop` when an online order is paid (audit R236).
