  /shop-and-drop:
    post:
      operationId: createShopAndDrop
      x-ticvai-audience: [staff, service]
      security:
        - bearerAuth: []
        - serviceAuth: []
      summary: Buy now, collect on the way out
      description: >
        4.4.7 — a guest buys in store and leaves the goods behind rather than carrying them
        round a venue all day. The purchase is **linked to their entitlement**, which is what
        makes collection possible without a receipt: the ticket they are already carrying is
        the claim.

        The goods leave stock at purchase, not at collection. They are sold; they are merely
        somewhere else.

        Not a reservation. `reserveMerchandise` holds unsold stock for someone who has not
        paid; this is paid goods awaiting handover, and conflating the two produces a stock
        figure nobody can explain.


        **Also called by the order service when an online order is paid** (decided 28
        September, audit R236): a guest on the web buys merchandise to collect on the way
        out, pays at checkout, and on payment the order service calls this with `orderId`
        (and no `saleId`), once per order, naming the retail lines marked for collection in
        `lineIds`. A staff caller at a till sends `saleId`. Exactly one of the two is sent.
      tags: [floor]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, collectionPointId, recordedAt]
              properties:
                id: { type: string, format: uuid }
                saleId:
                  type: string
                  nullable: true
                  description: The retail sale, from a till. Send this or `orderId`, not both.
                orderId:
                  type: string
                  nullable: true
                  description: >
                    The paid online order, when the order service calls on payment (audit R236).
                    `lineIds` then names the order's retail lines marked for collection.
                entitlementId:
                  type: string
                  nullable: true
                  description: >
                    The guest's ticket. Scanned at collection instead of a receipt — the
                    thing they cannot leave without is the thing that claims their shopping.
                collectionPointId: { type: string, format: uuid }
                lineIds:
                  type: array
                  description: Omit to drop the whole sale.
                  items: { type: string }
                collectBy:
                  type: string
                  format: date-time
                  description: >
                    Usually venue close. Uncollected goods after it become an exception, not
                    a permanent shelf occupant.
                recordedAt: { type: string, format: date-time }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Dropped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopAndDrop' }
        '409':
          description: >
            Sale already dropped (`alreadyDropped`), an item is non-droppable — chilled,
            fragile, oversized — (`itemNotDroppable`), or the collection point is closed before
            `collectBy` (`collectionPointClosed`). `refusedReason` says which.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ShopAndDropProblem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

