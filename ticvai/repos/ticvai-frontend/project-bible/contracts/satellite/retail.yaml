      x-ticvai-audience: [staff, guest]
      summary: Reserve an item for collection
      description: >
        A guest who cannot carry a purchase around a venue collects it on the way out. The
        item is allocated but not sold, and the reservation expires.


        **`expiresAt` is at least 15 minutes ahead and no later than the end of the visit
        day** (decided 28 September, audit R215): the close of the venue's operating day on
        which the reservation is made. Outside that window the request is a `400`. **Left
        out, the reservation holds until the end of the visit day** (decided 28 September,
