                    properties:
                      merchandiseId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                expiresAt:
                  type: string
                  format: date-time
                  description: >
                    At least 15 minutes from now and no later than the close of the venue's
                    operating day (audit R215). Defaults to the close of the venue's operating
                    day, the end of the visit day (audit R169).
                collectionNote: { type: string, maxLength: 200 }
      responses:
        '400':
          description: >
            `expiresAt` is less than 15 minutes ahead, or later than the end of the visit day
            (audit R215).
          x-ticvai-problem-types: [validation]
