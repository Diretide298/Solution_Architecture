          in: query
          description: Exact match. Returns taken at this outlet only. Omit for every outlet in the venue.
          schema: { type: string, format: uuid }
        - name: condition
          in: query
          description: Returns with at least one line in this condition.
          schema: { $ref: '#/components/schemas/ReturnCondition' }
        - name: status
          in: query
          description: >
            `accepted` or `refused`. Omit for both. A refused return is recorded (see
            `createRetailReturn`), so it can be found when the guest comes back to complain.
          schema: { $ref: '#/components/schemas/RetailReturnStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Returns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RetailReturn' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: createRetailReturn
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-011 Returns, Refunds & Exchanges"
      x-ticvai-audience: [staff]
      summary: Accept a return
      description: >
        **A return is not a negative sale.** It records the condition of the goods, restores
        stock only where condition permits, and refunds through the venue's retail return
        policy — which is separate from the ticket refund policy.

        Goods returned damaged or opened are written off rather than restocked, and that
        write-off is a movement with a reason rather than a silent absence. **A returned kit
        reverses its components** (4.4.20): each component is restocked or written off, never
        the kit itself.

        **The money goes back as a refund raised in the Order & Payment context** (`refundId`),
        so the orders `FraudRule` refund rules (`refundCount`, `refundValue`, `refundRatio` per
        guest or card, 5.3.33) are evaluated on retail returns as on every other refund; a held
        refund goes to approval rather than being refused at the till.


        **A refused return is recorded** (F34 `refusedReturn`: a refused return is a guest
        who may complain). The 409 writes a `RetailReturn` with `status: refused`, the
        `refusedReason`, nothing refunded, restocked or written off, and a new id that the
        server assigns and returns as `refusalId`. The request's own `id` stays unused, so the
        same return can be sent again, under a new `Idempotency-Key`, once the second
        authoriser is in hand.


        **Above the outlet's self-authorise limit, a supervisor's step-up on the same device**
        (decided 28 September, audit R144), never an approval request. `secondaryAuthorisation`
        carries the supervisor's principal and staff PIN (a PIN, never a password, audit R123
        (7)). The rule is `SupervisorStepUp` in `common.yaml`: the PIN is verified against the
        principal, who must hold `ORDER_REFUND_APPROVE` at this venue and must not be the caller;
        a failure is a `403` (`supervisor-step-up-refused`) and nothing is written. Missing when
        the amount needs it, the return is refused with the `409` below.
      tags: [return]
      x-ticvai-permission: ORDER_REFUND
      x-ticvai-permission-escalated: ORDER_REFUND_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRetailReturnRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailReturn' }
        '409':
          description: >
            Refused by the return policy: outside the return window, item is non-returnable,
            already returned, a supervisor step-up is required, no receipt, or a serial number
            that does not match. `refusedReason` says which, and `refusalId` names the recorded
            refusal.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ReturnPolicyProblem' }
        '403':
          description: >
            The caller lacks `ORDER_REFUND`, or the supervisor step-up failed: the PIN did not
            verify, the principal does not hold `ORDER_REFUND_APPROVE` at this venue, or is the
            caller (`supervisor-step-up-refused`, audit R144).
          x-ticvai-problem-types:
            - forbidden
            - supervisor-step-up-refused
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /retail-exchanges:
    post:
