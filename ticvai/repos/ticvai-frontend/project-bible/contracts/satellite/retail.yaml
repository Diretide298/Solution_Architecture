openapi: 3.1.0
info:
  title: TICVAI Retail
  version: 0.1.0
  x-ticvai-screen-count: 18
  x-ticvai-tier: satellite
  x-ticvai-module: "6 — Retail POS"
  x-ticvai-requirements: 78
  x-ticvai-capabilities: [C08, C21, C37]
  x-ticvai-platforms:
    - "P04 POS"
    - "P02 Guest App"
  description: >
    ## What this contract covers

    **Merchandise, returns and stored value. Blocked offline — stock depletes in real time.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 6 — Retail POS |
    | **Requirements** | ~78 |
    | **Capabilities** | C08, C21, C37 |
    | **Consumed by** | P04 POS · P02 Guest App |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Merchandise selling, returns and exchanges, gift cards and the stored-value wallet.
    Domain 6 — 78 requirements, plus the retail sub-domains of domain 7.

    Positions this encodes:

    - **Retail is blocked offline.** Stock depletes in real time and there is no way to lease
      a specific unit the way a timed product can be leased. A terminal without a connection
      cannot sell merchandise.
    - **Selling depletes stock through the inventory movement ledger**, not through a
      separate retail counter. One ledger, one truth — a second stock figure maintained by
      the till is a reconciliation problem waiting to happen.
    - **A return is not a negative sale.** It restores stock, may or may not restore the
      original tender, and carries its own authorisation rules. Modelling it as a sale with a
      minus sign loses the reason and the condition of the goods.
    - **Wallet is stored value, distinct from a gift card.** The wallet belongs to a guest
      and follows them across venues; a gift card is a bearer instrument. Both settle
      through the same ledger accounts but they are not the same object.
    - Price and stock checks are the most-used operations on a shop floor and are shaped for
      a handheld, not a desk.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: merchandise
  - name: sale
  - name: return
  - name: wallet
  - name: giftCard
  - name: floor

paths:
  # ---------------------------------------------------------------- merchandise






  /merchandise-reservations/{reservationId}/collect:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: collectMerchandiseReservation
      x-ticvai-audience: [staff]
      summary: The guest picked it up
      description: >
        Stock leaves the outlet. **Distinct from the sale**, which may have happened days
        earlier.
      tags: [retail]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Done
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /merchandise-reservations/{reservationId}/cancel:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelMerchandiseReservation
      x-ticvai-audience: [staff]
      summary: Release a reservation
      description: >
        **Stock returns to sale immediately.** A reservation nobody cancels is stock nobody
        can buy.
      tags: [retail]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Done
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /shop-and-drop/{dropId}/dispose:
    parameters:
      - name: dropId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: disposeShopAndDrop
      x-ticvai-consumed-by:
        - "P08 BO-143 Retail Global Settings & Controls"
      x-ticvai-audience: [staff]
      summary: Dispose of an uncollected item
      description: >
        Held for the stated period, then disposed of. **The period must be told to the guest at
        drop-off** — an item disposed of on a policy nobody stated is a paid item destroyed.

        Recorded with who authorised it, because this destroys something a guest owns.
      tags: [retail]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [donated, destroyed, returnedToStock, heldLonger] }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Done
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /merchandise:
    get:
      operationId: listMerchandise
      x-ticvai-consumed-by:
        - "P01 WEB-033 Shop"
        - "P01 WEB-042 Retail & Shop and Drop"
        - "P02 GST-026 Retail / Merchandise"
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-023 Sell — Merchandise"
        - "P05 KSK-017 Shop"
        - "P08 BO-007 Product Directory"
        - "P08 BO-044 F&B Outlets"
        - "P08 BO-048 Retail Products"
        - "P08 BO-116 Merchandising & Product Presentation"
      x-ticvai-audience: [staff, guest]
      x-ticvai-read-routing: replica
      summary: List merchandise
      description: >
        Two callers. **The back office** lists and manages the range. **The guest shop
        screens** (web, guest app, kiosk) browse it. A terminal does not call this: it reads
        its merchandise catalogue from the local bundle and checks live stock with
        `lookupMerchandise` before completing a sale.


        **A guest gets the guest projection, not the stock record.** A staff caller receives
        `MerchandiseItem`. A guest caller receives `GuestMerchandiseItem`, which leaves out the
        inventory link, the catalogue variant, the stock count and the serial-number flag, and
        says only whether the item can be bought. The server chooses by the caller's
        audience; the client does not ask for one.
      tags: [merchandise]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-offline-note: >
        24 August: **servable from a local cache.** The device holds enough to answer without the 
        network and the answer may be stale — which is correct for a catalogue and wrong for conte
        nded state. `getSeatAvailability`, `getSeatHold` and `getPromotionUsage` are deliberately 
        excluded - **a stale seat is a seat sold twice.**
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: outletId
          in: query
          description: Exact match. Items of this outlet only. Omit for every outlet in the venue.
          schema: { type: string, format: uuid }
        - name: categoryId
          in: query
          description: Exact match on `categoryId`. Items with no category never match.
          schema: { type: string, format: uuid }
        - name: inStockOnly
          in: query
          description: >
            True returns only items with `onHand` greater than zero at their own outlet. Items
            with no `inventoryItemId` never run out, so they always pass. False (the default)
            applies no stock filter.
          schema: { type: boolean, default: false }
        - name: search
          in: query
          description: >
            Case-insensitive "contains" match over `name`, `sku`, `barcode` and `description`.
            An item matches when any one of them contains the text. Combined with the other
            filters by AND.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: >
            Merchandise, one page. Items are `MerchandiseItem` for a staff caller and
            `GuestMerchandiseItem` for a guest caller.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/MerchandiseItem'
                            - $ref: '#/components/schemas/GuestMerchandiseItem'
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: createMerchandise
      x-ticvai-consumed-by:
        - "P08 BO-007 Product Directory"
        - "P08 BO-048 Retail Products"
      x-ticvai-audience: [staff]
      summary: Create a merchandise item
      description: >
        Links a sellable catalogue variant to an inventory item. That link is what makes a
        sale deplete stock — merchandise without it sells but never runs out, which is how a
        shop discovers its stock figures are fiction.
      tags: [merchandise]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMerchandiseRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandiseItem' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: Barcode already in use in this venue. `refusedReason` is `barcodeInUse`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/MerchandiseConflictProblem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /merchandise/{merchandiseId}:
    parameters:
      - name: merchandiseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMerchandise
      x-ticvai-consumed-by:
        - "P08 BO-048 Retail Products"
        - "P08 BO-116 Merchandising & Product Presentation"
      x-ticvai-audience: [staff]
      summary: Amend a merchandise item
      tags: [merchandise]
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                description:
                  type: string
                  nullable: true
                  description: What the item is, in the guest's words. Null clears it.
                barcode:
                  type: string
                  maxLength: 128
                  nullable: true
                  description: Must stay unique in the venue. Null clears it.
                categoryId: { type: string, format: uuid }
                inventoryItemId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Re-points the stock item a sale depletes. Sales already made keep the
                    movements they wrote. Null unlinks it, and the item then sells without
                    running out, which is almost always a configuration error.
                imageAssetRef: { type: string, nullable: true }
                isReturnable: { type: boolean }
                returnWindowDays: { type: integer, minimum: 0 }
                requiresSerialNumber: { type: boolean }
                isActive: { type: boolean }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandiseItem' }
        '409':
          description: The new barcode is already in use in this venue. `refusedReason` is `barcodeInUse`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/MerchandiseConflictProblem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /merchandise/lookup:
    get:
      operationId: lookupMerchandise
      x-ticvai-consumed-by:
        - "P01 WEB-033 Shop"
        - "P01 WEB-042 Retail & Shop and Drop"
        - "P02 GST-026 Retail / Merchandise"
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-023 Sell — Merchandise"
        - "P05 KSK-017 Shop"
        - "P06 EMP-069 Barcode, RFID, Serialized Stock & Traceability"
        - "P08 BO-048 Retail Products"
        - "P08 BO-114 Variants, Attributes, Barcode & RFID Management"
      x-ticvai-audience: [staff, guest]
      x-ticvai-read-routing: primary
      summary: Price and stock check by barcode
      description: >
        The most-used operation on a shop floor. Returns price after any live promotion,
        stock at this outlet, and stock at sibling outlets — so a colleague can be sent to
        fetch a size rather than losing the sale.


        **"This outlet" is the outlet of the workstation asking** (decided 28 September, audit
        R215): price and `onHand` are that outlet's row. A caller with no workstation (a guest
        on the web shop or app) names the outlet with `outletId`; a workstation caller's own
        outlet always wins. **An inactive item is not found**: it answers `404`, exactly as
        an unknown barcode does.
      tags: [floor]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: barcode
          in: query
          description: Exact match on `barcode`, within the venue. Send `barcode` or `sku`.
          schema: { type: string }
        - name: sku
          in: query
          description: Exact match on `sku`, within the venue. Send `barcode` or `sku`.
          schema: { type: string }
        - name: includeSiblingOutlets
          in: query
          description: False leaves `siblingOutlets` empty.
          schema: { type: boolean, default: true }
        - name: outletId
          in: query
          description: >
            The outlet to price and count at, for a caller with no workstation (audit R215).
            Ignored for a workstation caller, whose own outlet is used. Required when the
            caller has no workstation; absent then, the request is a `400`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Price and stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceCheck' }
        '400':
          description: Neither barcode nor SKU supplied, or a caller with no workstation sent no `outletId` (audit R215)
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '404':
          description: No active item with that barcode or SKU at the outlet. An inactive item is not found (audit R215).
          x-ticvai-problem-types: [not-found]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------- sales
  /retail-sales:
    get:
      operationId: listRetailSales
      x-ticvai-consumed-by:
        - "P04 POS-005 Payment"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List retail sales
      tags: [sale]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: outletId
          in: query
          description: Exact match. Sales at this outlet only. Omit for every outlet in the venue.
          schema: { type: string, format: uuid }
        - name: shiftId
          in: query
          description: Exact match. Sales rung up in this shift only.
          schema: { type: string }
        - name: createdFrom
          in: query
          description: Sales with `createdAt` at or after this instant.
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          description: Sales with `createdAt` before this instant. With `createdFrom`, the range is half-open.
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Sales
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RetailSale' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: createRetailSale
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-005 Payment"
        - "P04 POS-023 Sell — Merchandise"
      x-ticvai-audience: [staff]
      summary: Sell merchandise
      description: >
        **Not offline-capable.** Stock depletes in real time and a specific unit cannot be
        leased the way a timed product can, so a terminal without a connection cannot
        complete a retail sale.

        Creates an order in the Order & Payment context and a `saleDepletion` movement in the
        inventory ledger, in one transaction. There is no second stock counter maintained by
        the till.

        **A kit sells as one line and leaves stock as its components** (4.4.20, 29 September
        build). Where the line's item has an `inventory.kit_component` bill of materials
        (inventory `setInventoryKitDefinition`), one `saleDepletion` is posted per component,
        quantity times the line quantity, and none for the kit; `insufficientStock` is judged on
        the components.
      tags: [sale]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRetailSaleRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Sold; stock depleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailSale' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: >
            Insufficient stock (`insufficientStock`), a serialised item has no serial number
            (`serialNumberRequired`), or the terminal is offline (`terminalOffline`).
            `refusedReason` says which, and `lines` names the lines at fault.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/StockConflictProblem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /retail-sales/{saleId}:
    parameters:
      - name: saleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRetailSale
      x-ticvai-consumed-by:
        - "P04 POS-005 Payment"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read a retail sale
      description: >
        Also the receipt lookup a returns desk starts from. Returns whether each line is
        still returnable and why not.
      tags: [sale]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetailSale' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /retail-sales/lookup:
    get:
      operationId: lookupRetailSale
      x-ticvai-consumed-by:
        - "P04 POS-005 Payment"
        - "P04 POS-011 Returns, Refunds & Exchanges"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Find a sale from a receipt
      description: >
        By receipt number, order number or the barcode printed on the receipt. A guest at a
        returns desk has a piece of paper, not an order ID.


        **Where several identifiers are sent, the receipt barcode wins, then the receipt
        number, then the order number** (decided 28 September, audit R215); the others are
        ignored and `matchedBy` says which was used. **Several matching sales return a list**,
        newest first, for the cashier to choose from; one match is a list of one.
      tags: [return]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: receiptNumber
          in: query
          description: Exact match on `receiptNumber`. Send one of the three identifiers.
          schema: { type: string }
        - name: orderNumber
          in: query
          description: Exact match on the order number of the order in the Order & Payment context.
          schema: { type: string }
        - name: receiptBarcode
          in: query
          description: Exact match on the barcode printed on the receipt. Wins over the other two (audit R215).
          schema: { type: string }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: The matching sales, newest first. Several matches return several (audit R215).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    required: [matchedBy]
                    properties:
                      matchedBy:
                        type: string
                        enum: [receiptBarcode, receiptNumber, orderNumber]
                        description: The identifier used, by the precedence above (audit R215).
                      items:
