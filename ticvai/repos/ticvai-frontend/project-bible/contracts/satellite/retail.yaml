            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandiseReservation' }
        '409':
          description: Insufficient stock. `refusedReason` is `insufficientStock`, and `lines` names the lines short.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/StockConflictProblem' }
        '429':
