                $ref: '#/components/schemas/ScalingPolicy'
components:
  schemas:
    ScalingPolicy:
      type: object
      x-ticvai-persistence: control.scaling_policy
      description: '**Drafted 4 September.** What a cell scales on. **A floor and a ceiling are not
        symmetric** - the floor is the size the environment is stood up at before traffic arrives,
        and the ceiling is a cap on absorbing a peak nobody predicted (ADR-0035).'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        service:
          type: string
        replicaFloor:
          type: integer
        replicaCeiling:
          type: integer
          description: 'Null means no maximum, which is the correct setting for a burst cell.'
        targetUtilisationPct:
          type: integer
        scaleStepPct:
          type: integer
        updatedAt:
          type: string
          format: date-time
    ArchivalJob:
      type: object
      x-ticvai-persistence: control.archival_job
      description: '**Drafted 4 September.** One archival or retention run. Retention is a legal
        obligation, so a stalled job is a compliance failure rather than a housekeeping one.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        policyName:
          type: string
        targetTable:
          type: string
        rowsArchived:
          type: integer
        rowsPurged:
          type: integer
        state:
          type: string
          enum:
          - scheduled
          - running
          - succeeded
          - failed
        runAt:
          type: string
          format: date-time
        error:
          type: string
    BackupRun:
      type: object
      x-ticvai-persistence: control.backup_run
      description: '**Drafted 4 September.** One backup run. The question this answers is not *did it
        run* but *how old is the newest restorable copy* - a job that succeeds nightly against an
        empty database succeeds forever.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        scope:
          type: string
          enum:
          - cell
          - tenant
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - running
          - succeeded
          - failed
        sizeBytes:
          type: integer
        restoreTestedAt:
          type: string
          format: date-time
          description: '**A backup nobody has restored is a hypothesis.**'
        error:
          type: string
    WafRule:
      type: object
      x-ticvai-persistence: control.waf_rule
      description: '**Drafted 4 September.** One firewall rule, and the reason it is a row rather than
        a config file is that somebody has to be able to say who changed it and when.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        name:
          type: string
        action:
          type: string
          enum:
          - allow
          - block
          - rateLimit
          - challenge
        matchOn:
          type: string
          description: What the rule inspects - a path, a header, a source range.
        pattern:
          type: string
        enabled:
          type: boolean
        hitCount24h:
          type: integer
          description: '**A rule with no hits is either protecting nothing or blocking everything
            silently**, and both want looking at.'
        updatedAt:
          type: string
          format: date-time
    EnvironmentKind:
      type: string
      enum:
      - dev
      - staging
      - production
    ReleaseStatus:
      type: string
      enum:
      - draft
      - inDev
      - inStaging
      - inProduction
      - superseded
      - withdrawn
    RolloutStatus:
      type: string
      enum:
      - queued
      - canary
      - rolling
      - paused
      - complete
      - failed
      - rolledBack
    ComponentVersion:
      type: object
      required:
      - component
      - version
      properties:
        component:
          type: string
          enum:
          - backend
          - frontend
          - ai
          - infra
          - contracts
        version:
          type: string
        imageDigest:
          type: string
          nullable: true
    CreateReleaseRequest:
      type: object
      required:
      - version
      - components
      - note
      properties:
        version:
          type: string
        components:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComponentVersion'
        requiredMigrations:
          type: array
          description: Migration versions this release depends on.
          items:
            type: string
        note:
          type: string
          minLength: 3
          maxLength: 2000
        breakingChanges:
          type: array
          items:
            type: string
    Release:
      allOf:
      - $ref: '#/components/schemas/CreateReleaseRequest'
      - type: object
        required:
        - id
        - status
        - createdAt
        x-ticvai-persistence: control.release + control.release_component
        properties:
          id:
            type: string
            format: uuid
          status:
            $ref: '#/components/schemas/ReleaseStatus'
          createdByPrincipalId:
            type: string
            format: uuid
          createdAt:
            type: string
            format: date-time
          promotedToStagingAt:
            type: string
            format: date-time
            nullable: true
          promotedToProductionAt:
            type: string
            format: date-time
            nullable: true
    ReleaseDetail:
      allOf:
      - $ref: '#/components/schemas/Release'
      - type: object
        x-ticvai-persistence: none — projection
        properties:
          rollouts:
            type: array
            items:
              $ref: '#/components/schemas/Rollout'
          cellsOnThisVersion:
            type: integer
          cellsTotal:
            type: integer
    ReleaseReadiness:
      type: object
      x-ticvai-persistence: none — computed
      required:
      - reinventoryHoldId
      - canPromote
      - gates
      properties:
        reinventoryHoldId:
          type: string
          format: uuid
        canPromote:
          type: boolean
        targetEnvironment:
          $ref: '#/components/schemas/EnvironmentKind'
        gates:
          type: array
          items:
            type: object
            required:
            - gate
            - passed
            properties:
              gate:
                type: string
                enum:
                - priorEnvironmentHealthy
                - soakPeriodElapsed
                - migrationsReversible
                - noOpenIncidents
                - approvalRecorded
                - contractsCompatible
              passed:
                type: boolean
              detail:
                type: string
    PromotionBlockedProblem:
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        x-ticvai-persistence: none — error shape
        properties:
          failedGates:
            type: array
            items:
              type: object
              properties:
                gate:
                  type: string
                detail:
                  type: string
    Rollout:
      type: object
      x-ticvai-persistence: control.rollout
      required:
      - id
      - reinventoryHoldId
      - environment
      - status
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        reinventoryHoldId:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/EnvironmentKind'
        status:
          $ref: '#/components/schemas/RolloutStatus'
        cellsTotal:
          type: integer
        cellsComplete:
          type: integer
        cellsFailed:
          type: integer
        startedByPrincipalId:
          type: string
          format: uuid
        approvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        pausedReason:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    RolloutDetail:
      allOf:
      - $ref: '#/components/schemas/Rollout'
      - type: object
        x-ticvai-persistence: none — projection over rollout and cell state
        properties:
          cells:
            type: array
            description: 'Per-cell state. "60% complete" says nothing about whether the failing 40% is
              one region or forty venues.

              '
            items:
              $ref: '#/components/schemas/RolloutCell'
    RolloutTenant:
      type: object
      x-ticvai-persistence: control.rollout_tenant
      description: 'What happened to one tenant database during one run. **The same shape as `RolloutCell`
        one level down**, and it serves the per-tenant rows of both a rollout and a migration run — which
        is the arrangement `RolloutCell` already has with `rollout_cell` and `migration_run_cell`.


        **`databaseName` is denormalised on purpose.** After a drop the run record still has to say what it
        touched, and a join to a row that no longer exists says nothing.

        '
      required:
      - tenantId
      - cellId
      - status
      properties:
        tenantId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        databaseName:
          type: string
        isCanary:
          type: boolean
        wave:
          type: integer
          description: 'A wave is now a set of tenants and may be a subset of one cell.'
        status:
          type: string
          enum:
          - pending
          - running
          - complete
          - failed
          - skipped
          - rolledBack
        fromVersion:
          type: string
          nullable: true
        toVersion:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    RolloutCell:
      type: object
      x-ticvai-persistence: control.rollout_cell
      required:
      - cellId
      - status
      properties:
        cellId:
          type: string
          format: uuid
        cellName:
          type: string
        regionName:
          type: string
        countryCode:
          type: string
        isCanary:
          type: boolean
        wave:
          type: integer
        status:
          type: string
          enum:
          - pending
          - running
          - complete
          - failed
          - skipped
          - rolledBack
        fromVersion:
          type: string
          nullable: true
        toVersion:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    IrreversibleProblem:
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        x-ticvai-persistence: none — error shape
        properties:
          irreversibleMigrations:
            type: array
            description: 'Named, not merely counted. A one-way door should be identified before it is
              walked through.

              '
            items:
              type: object
              properties:
                version:
                  type: string
                module:
                  type: string
                reason:
                  type: string
    Migration:
      type: object
      x-ticvai-persistence: control.migration
      required:
      - version
      - module
      - isReversible
      - checksum
      properties:
        version:
          type: string
        module:
          type: string
        description:
          type: string
        isReversible:
          type: boolean
          description: 'A rollback section exists and CI has executed it against a restored snapshot.
            A rollback nobody has run is a comment, not a rollback.

            '
        rollbackTestedAt:
          type: string
          format: date-time
          nullable: true
        checksum:
          type: string
          description: 'Compared on apply. A migration edited after it was applied somewhere is a defect
            the register catches, not a mystery to debug later.

            '
        estimatedLockMs:
          type: integer
          nullable: true
        touchesPartitionedTable:
          type: boolean
        appliedCellCount:
          type: integer
        pendingCellCount:
          type: integer
    MigrationPlan:
      type: object
      x-ticvai-persistence: control.migration_plan
      required:
      - id
      - targetVersion
      - computedAt
      - cells
      - allReversible
      properties:
        id:
          type: string
          format: uuid
        targetVersion:
          type: string
        computedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 'A plan is computed against cell state at a moment. Beyond this it is stale and
            apply refuses it rather than applying to a different world than it was made for.

            '
        allReversible:
          type: boolean
        irreversible:
          type: array
          items:
            type: string
        totalEstimatedLockMs:
          type: integer
        cells:
          type: array
          items:
            type: object
            properties:
              cellId:
                type: string
                format: uuid
              cellName:
                type: string
              tenantSelection:
                type: string
                description: 'Which of the cell''s tenant databases the plan targets. **A plan that can
                  only say "this region" cannot express the rollout ADR-0038 makes normal** — a cell is a
                  region holding many tenants, and a wave may be a subset of one.'
                enum:
                - all
                - named
              tenantIds:
                type: array
                description: 'Present only where `tenantSelection` is `named`. **Named rather than
                  counted**, for the reason `migration_run_cell` gives about partial failure: a set
                  recorded as a number cannot be checked against what actually ran.'
                items:
                  type: string
                  format: uuid
              currentVersion:
                type: string
              migrationsToApply:
                type: array
                items:
                  type: string
              estimatedLockMs:
                type: integer
              warnings:
                type: array
                description: 'A long lock on a partitioned table during trading hours is the output this
                  endpoint exists to produce.

                  '
                items:
                  type: string
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    MigrationRun:
      type: object
      x-ticvai-persistence: control.migration_run + control.migration_run_cell + control.migration_run_tenant
      description: 'One run, its per-region rollup, and its per-tenant outcomes. **The third table exists
        because ADR-0038 made a cell a region holding many tenants**, and `migration_run_cell`''s own note
        says it is there so *"a partial failure is named rather than counted"* — which is exactly what it
        stopped doing. A run that fails for twenty of two hundred tenants had one row saying `failed`.


        The rollup stays. *"How is the UAE doing"* is a real question and computing it from two hundred rows
        on every read is not.

        '
      required:
      - id
      - planId
      - status
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - canary
          - running
          - paused
          - complete
          - failed
          - rolledBack
        canaryCellId:
          type: string
          format: uuid
          nullable: true
          description: 'Which region the canary tenant is in. **The canary itself is a tenant** — a first
            cell holding two hundred databases is not a cheap failure, and cheap failure is the only thing
            a canary is for.'
        canaryTenantId:
          type: string
          format: uuid
          nullable: true
        tenantsTotal:
          type: integer
        tenantsComplete:
          type: integer
        tenantsFailed:
          type: integer
        cellsTotal:
          type: integer
        cellsComplete:
          type: integer
        cellsFailed:
          type: integer
        startedByPrincipalId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        cells:
          type: array
          items:
            $ref: '#/components/schemas/RolloutCell'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/RolloutTenant'
    VersionSkewReport:
      type: object
      x-ticvai-persistence: none — computed from cell state
      required:
      - asAt
      - cells
      - hasUnexplainedSkew
      properties:
        asAt:
          type: string
          format: date-time
        hasUnexplainedSkew:
          type: boolean
          description: 'Skew during a rollout is expected. Skew outside one is a defect, and separating
            the two is the entire value of this report.

            **An on-premise cell is a third case: legitimately behind, indefinitely**, because the client
            has not scheduled the window and TICVAI cannot push. It is not counted here and must not appear
            as a defect (ADR-0017).

            '
        cells:
          type: array
          items:
            type: object
            properties:
              cellId:
                type: string
                format: uuid
              cellName:
                type: string
              schemaVersion:
                type: string
              applicationVersion:
                type: string
              isBehind:
                type: boolean
              versionsBehind:
                type: integer
              reason:
                type: string
                nullable: true
                enum:
                - midRollout
                - rolloutPaused
                - rolloutFailed
                - tenantDeferred
                - onPremiseNotScheduled
                - unexplained
    Environment:
      type: object
      x-ticvai-persistence: control.environment
      required:
      - id
      - kind
      - name
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/EnvironmentKind'
        name:
          type: string
        cellIds:
          type: array
          items:
            type: string
            format: uuid
        requiresApprovalToPromote:
          type: boolean
        soakHours:
          type: integer
          description: 'How long a release must sit here before it may be promoted. Zero for dev; a real
            number for staging, or staging is a formality.

            '
        currentReleaseVersion:
          type: string
          nullable: true
        isActive:
          type: boolean
    UpgradeSchedule:
      type: object
      x-ticvai-persistence: control.upgrade_schedule
      required:
      - tenantId
      - releaseVersion
      - scheduledFor
      properties:
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        releaseVersion:
          type: string
        scheduledFor:
          type: string
          format: date-time
        deferredByTenant:
          type: boolean
        deferralReason:
          type: string
          nullable: true
        maxDeferralUntil:
          type: string
          format: date-time
          description: 'Beyond this the platform proceeds. An indefinitely deferred tenant becomes a version
            nobody supports.

            '
        notifiedAt:
          type: string
          format: date-time
          nullable: true
    SupportNotice:
      type: object
      x-ticvai-persistence: control.support_notice
      required:
      - id
      - version
      - supportEndsAt
      - publishedAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        supportEndsAt:
          type: string
          format: date
        message:
          type: object
          additionalProperties:
            type: string
        affectedTenantIds:
          type: array
          readOnly: true
          description: Computed from cell versions, never typed. A notice to the wrong list is worse than
            none.
          items:
            type: string
            format: uuid
        publishedByPrincipalId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    DeadLetter:
      type: object
      x-ticvai-persistence: platform.dead_letter
      description: 'ADR-0033. **An outbox row whose delivery failed after its retry budget.**


        **A financial posting is never dead-lettered** — `ledger.journal_entry` is append-only and a failed
        posting is an incident. **Nor is a DSAR**: `platform.dsar_request` carries a legal clock, and
        a dead-lettered erasure nobody works is a regulatory failure with a timestamp on it. Both halt
        and alert.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        outboxId:
          type: string
          format: uuid
          description: The row that would not deliver.
        eventName:
          type: string
        consumer:
          type: string
          description: Which consumer failed. **A dead letter you cannot attribute is a log entry with
            a table’s overhead.**
        payload:
          type: object
          description: The event as it was written. **Replay needs the payload, not a reference to a row
            that may have moved on.**
        attempts:
          type: integer
          description: '**Five, exponential from one second, jittered** (ADR-0033). Jitter because a thousand
            failures at the same instant retry at the same instant.'
        lastError:
          type: string
        lastAttemptAt:
          type: string
          format: date-time
        replayCount:
          type: integer
          default: 0
          description: '**A replay is a new attempt, not a reset.** An operator retrying the same poison
            message forty times should be able to see that they did.'
        scopePath:
          type: string
        createdAt:
          type: string
          format: date-time
    OutboxEntry:
      type: object
      x-ticvai-persistence: platform.outbox
      description: '**Written in the same transaction as the state change** (ADR-0033). That is what makes
        it exactly-once — the row and the change commit together or neither does.


        **Not a queue write inside a transaction.** A broker acknowledging a publish that then rolls back
        is the exactly-once problem restated.


        **Declared 31 August.** The table was storage-only with no schema and therefore no columns, while
        20 operations wrote to it and `platform.dead_letter.outbox_id` referenced it — **twenty relationship
        edges pointing at a table the schema did not have.**'
      required:
      - id
      - eventName
      - payload
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        eventName:
          type: string
          description: One of the 29 declared events.
        aggregateType:
          type: string
          description: The table the change happened in.
        aggregateId:
          type: string
          format: uuid
          description: Which row changed.
        payload:
          type: object
          description: '**The event as it happened, not a reference to a row that may have moved on.**
            A consumer reading the current state instead would see the third change, not the first.'
        scopePath:
          type: string
          description: The partition key (ADR-0005).
        sequence:
          type: integer
          description: '**Monotonic per scope.** A consumer that missed one knows it missed one — ordering
            is the difference between at-least-once and unusable.'
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the relay publishes it. **This column is the queue** — unpublished rows
            in sequence order are the work.
        attempts:
          type: integer
          default: 0
          description: '**Five, exponential from one second, jittered.** Then `platform.dead_letter`.'
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
