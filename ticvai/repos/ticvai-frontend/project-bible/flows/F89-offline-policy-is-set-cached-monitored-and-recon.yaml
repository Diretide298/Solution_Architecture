$schema: ./_schema.yaml
id: F89
name: Offline policy is set, cached, monitored and reconciled
actor: technician
capability: Offline policy is set, cached, monitored and reconciled
wave: 2
frequency: As the venue needs it.
criticality: financial
primaryContract: tenancy
contracts:
- tenancy
- orders
- catalogue
platforms:
- P08
trigger:
  description: A venue decides how much trading it will tolerate with no network.
offlineBehaviour: Configuration is online. What it configures is entirely offline.
steps:
- step: 1
  screen: BO-130
  action: The venue sets its offline policy.
  operations:
  - setOfflinePolicy
  outcome: What a till may do with no network, and for how long.
- step: 2
  screen: BO-131
  action: The connectivity thresholds are set.
  operations:
  - setConnectivityThresholds
  outcome: When a device counts as offline rather than slow.
  crossesDevice: true
  note: '**Repointed 2 October (CHG-WIR-021).** The thresholds were set on BO-129, the firmware and profile screen; they are set on BO-131 Connectivity & Auto-Switch Settings, which declares setConnectivityThresholds.'
- step: 3
  screen: BO-037
  action: Each device's cached package is checked.
  operations:
  - listCatalogueBundles
  outcome: '**What each device is enforcing right now**, not what was configured.'
  crossesDevice: true
  note: '**Repointed 2 October (CHG-WIR-025, CHG-WIR-027).** getOfflinePackage answers only for the calling workstation, so a back-office screen cannot read another device''s package with it; the venue-scoped read of each device''s package is an open contract gap (CHG-WIR-027).'
- step: 4
  screen: BO-128
  action: The fleet is monitored.
  operations:
  - getWorkstationHealth
  - listWorkstations
  outcome: Which tills are offline, and since when.
  crossesDevice: true
- step: 5
  screen: BO-037
  action: What the tills did offline is reconciled.
  operations:
  - listSyncRejections
  - syncOrders
  outcome: '**Every rejected offline sale is seen by a person.** A rejection nobody reads is money nobody
    collects.'
branches:
- at: 1
  condition: A step in the chain is not licensed for this tenant.
  behaviour: '**The chain stops at the module boundary.** `requiresModule` on each screen decides —
    a tenant without the retail licence does not see the retail half, and the journey is shorter rather
    than broken.'
  severity: medium
  resolvedBy: getModuleEnablement
exitStates:
- state: completed
  description: The chain ran as the client drew it.
- state: stoppedAtModule
  description: '**A licence boundary, not a failure.**'
notes: '**Re-authored 28 September to follow the purpose of each screen it visits** (decided 28 September, audit R261): set, cached, monitored and reconciled now each land on the screen whose purpose it is, instead of setOfflinePolicy repeated on four screens. **POS board 5.** F33 walks a till going offline; this walks the venue deciding the rules it
  obeys. **Derived from the client''s own `GOES TO` edges**, not from an inferred path — a pair of frames
  the client linked is evidence; a chain assembled from unrelated pairs is a guess.'
openQuestions: null
