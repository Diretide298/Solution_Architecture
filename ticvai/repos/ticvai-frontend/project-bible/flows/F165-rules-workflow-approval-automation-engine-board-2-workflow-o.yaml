- step: 17
  screen: ADM-248
  action: Returns to the board's landing screen
  operations:
  - listWorkflow
  outcome: Ready for the next screen on this board
- step: 18
  screen: ADM-257
  action: Works in AI Workflow Intelligence & Autonomous Governance Center
  operations:
  - listWorkflowAutonomouGovernance
  outcome: Create the AI intelligence layer across TICVAI's entire rules, workflow and automation ecosystem.
