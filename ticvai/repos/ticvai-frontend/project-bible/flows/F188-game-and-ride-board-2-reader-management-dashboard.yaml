- step: 2
  screen: BO-405
  action: Works in Reader Directory
  operations: []
  outcome: Maintain the master inventory of physical readers connected to TICVAI. The source requires
    the ability to define a minimum of three reader types.
- step: 3
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-406
  action: Works in Reader Profile & Device Setup
  operations: []
  outcome: Configure the technical and operational identity of an individual reader.
- step: 5
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-407
  action: Works in Reader Credit & Payment Configuration
  operations: []
  outcome: 'Define exactly what type of wallet value a reader accepts and how much is required to start
    the game or ride. This directly implements requirement 10.2.6, which requires configurable: Credit
    type accepted Credit amount required Attraction t'
- step: 7
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-408
  action: Works in Reader / Attraction Assignment
  operations: []
  outcome: Assign a physical reader to the appropriate game, ride, or attraction.
- step: 9
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-409
  action: Works in Retap Delay & Transaction Protection
  operations: []
  outcome: Prevent accidental repeated deductions when a customer taps the card multiple times within
    a short period. The requirement explicitly states that a configurable delay—example 5 seconds—must
    exist between the first tap and subsequent taps.
- step: 11
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-410
  action: Works in Free Game Glow & Reader Display Rules
  operations: []
  outcome: Configure how the reader visually communicates that a game or ride is available free of charge.
