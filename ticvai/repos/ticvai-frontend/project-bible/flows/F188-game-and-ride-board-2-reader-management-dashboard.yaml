    customer to recognize that the game is free
- step: 13
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-411
  action: Works in Reader Theme & Experience Configuration
  operations: []
  outcome: Configure different visual experiences for reader categories. The source requires custom themes
    controlled from BOS, with skill games and rides able to have different reader themes.
- step: 15
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-412
  action: Works in Real-Time Tap Validation & Reader Response
  operations: []
  outcome: 'Define and visualize what occurs when a customer taps their card/device before gameplay. This
    screen directly addresses requirement 10.2.13: the system must validate the customer''s credit/card
    balance, bonus and entitlements in real time be'
- step: 17
  screen: BO-404
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-413
  action: Works in Balance Check Reader & Device Test Console
  operations: []
  outcome: Configure dedicated balance-check readers and provide administrators with a test environment
    for deployed reader configurations. Requirement 10.2.20 specifically requires a reader through which
    the customer can check their balance.
branches:
- at: 1
  condition: Nothing has been set up on Reader Management Dashboard yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Game and Ride board 2 visited
