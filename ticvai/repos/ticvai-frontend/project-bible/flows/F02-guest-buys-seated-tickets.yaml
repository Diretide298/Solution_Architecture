# F02 — Guest buys seated tickets
#
# Validated against _schema.yaml by tools/check-flows.py.

id: F02
name: Guest buys seated tickets
actor: guest
wave: 2
frequency: daily
criticality: revenue
platforms:
- P01 Guest Web Storefront
offlineBehaviour: Cannot start. Seat holds require the primary and cannot be leased to a browser.
trigger:
  description: A guest choosing a specific seat rather than general admission.
  entryScreen: WEB-004
steps:
- step: 1
  screen: WEB-006
  action: Picks a performance
  operations:
  - getAvailability
  outcome: 'Seated performances route to the map rather than to the cart. Per the published flow''s `settings.seatEventDateMode`
    (`getPublishedBookingFlow`, W12; was `BookingFlowConfig`) the date and time are this inline step (`inlineStep`, default) or a pop-up over the seat map (`popupOnSeatMap`);
    an event with exactly one on-sale performance skips this step and opens on the map, and the two steps may
    render as one page (decided 29 September, rev 3 REV3-4 and REV3-7)'
- step: 2
  screen: WEB-007
  action: Selects seats on the map
  operations:
  - getSeatAvailability
  - createSeatHold
  outcome: 'Seats held with a visible countdown. At most `VenueSettings.seating.maxSeatsPerGuestOrder` seats
    per booking on a guest channel (default 10, bounds 1-50; `422 seat-limit-exceeded`), and the basket lists each
    seat (decided 29 September, rev 3 REV3-7). A time bar switches performance and re-holds (rev 3 REV3-6). **Sections first** (decided 29 September, W2): zoom into a section for its seats; scroll or pinch out,
    or *Whole map*, returns to the full map to compare sections, keeping the seats held'
  duration: The hold TTL is the clock the guest is racing
- step: 3
  screen: WEB-010
  action: Reviews the cart
  operations:
  - evaluatePromotions
  outcome: Held seats itemised with the countdown still visible
- step: 4
  screen: WEB-011
  action: Enters contact details and answers consent
  operations:
  - getMyProfile
  - listConsentPurposes
  outcome: The hold is still counting down. The countdown stays visible through this step
- step: 5
  screen: WEB-012
  action: Pays
  operations:
  - checkoutCart
  - createPayment
  outcome: Hold converts to entitlements on payment
branches:
- at: 2
  condition: The map has no geometry
  severity: recoverable
  behaviour: 'Availability returns renderMode: list and the screen shows category groups and best-available.
    The seated flow is never refused — a venue that has not supplied a CAD plan can still sell.'
  resolvedBy: WEB-007
- at: 2
  condition: A selection would leave an orphan seat
  severity: recoverable
  behaviour: Refused with the reason. Operators want orphan prevention and rarely ask for it by name.
  resolvedBy: WEB-007
- at: 3
  condition: The hold expires while the guest reads the cart
  severity: abandonsFlow
  behaviour: Seats return to the pool and the cart shows what was lost, with one action to re-select.
    A silent expiry discovered at payment is the worst outcome in this flow.
  resolvedBy: WEB-007
- at: 5
  condition: The hold expires between cart and payment
  severity: requiresStaff
  behaviour: Extension is offered before expiry rather than after. Where it has already lapsed and the
    seats are gone, the guest is told which seats and offered the nearest equivalent.
  resolvedBy: extendSeatHold
- at: 4
  condition: The hold expires while the guest fills in the details form
  behaviour: The most likely place to lose it — a form takes longer than a cart. Extension is offered
    proactively as the countdown nears zero, not after it passes.
  severity: requiresStaff
  resolvedBy: extendSeatHold
exitStates:
- state: completed
  description: Seats sold, hold converted
- state: abandoned
  description: Hold expired and seats returned to the pool automatically
primaryContract: seating
contracts:
- seating
- marketing-crm
- orders
- catalogue
- promotions
