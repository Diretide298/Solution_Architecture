# GitLab CI (the lead, 20 October 2026, r8 cause FOUNDATION-AI-C37, option A: GitLab CI with shared runners in every
# repository; ADR-0007 amendment). Replaces the GitHub Actions workflows this repository shipped.
# The frontend is six GitLab repositories in the ticvai-frontend group, one app each (CHG-R6-058); this is the
# template each of them starts from. Each repository's owner fills its profile in the package's
# docs/active/frontend-repos.yaml (workspace, package manager, lint, typecheck, test and build scripts), and this
# job runs those scripts; until a profile exists, the template runs the scripts its package.json declares.

stages: [check, build]

bible-check:
  stage: check
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache git >/dev/null
    - test -f project-bible/overview.md || { echo "project-bible missing. Run ./update-bible.sh from the workspace root."; exit 1; }
    - echo "Bible synced at $(cat project-bible/.synced-at 2>/dev/null || echo unknown)"
    # project-bible/ is a copy of ticvai-docs: an edit here is overwritten by the next ./update-bible.sh run,
    # so it is flagged rather than lost.
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" | grep -q '^project-bible/'; then
        echo "WARNING: project-bible/ was modified. It is a copy of ticvai-docs and will be overwritten on the next sync. Change ticvai-docs instead."
      fi

build:
  stage: build
  image: node:20
  script:
    - corepack enable
    - if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; elif [ -f yarn.lock ]; then yarn install --frozen-lockfile; else npm ci; fi
    # @ticvai/api-client comes from the group's GitLab npm registry, pinned by exact version in package.json.
    - npm run --if-present lint
    - npm run --if-present typecheck
    - npm run --if-present test
    - npm run --if-present build
