name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev,qdrant]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest

      # No capability ships without an eval baseline. A regression here fails the
      # build the same way a unit test failure does.
      - name: Eval regression gate
        run: pytest tests/evals --strict-markers
