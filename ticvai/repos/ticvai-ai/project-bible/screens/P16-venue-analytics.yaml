  notes: '**Built 24 August.** The client F&B boards drew six suggestion endpoints — price, requisition,
    replenishment, scenario, SLA, demand plan. **One screen and one operation answer all six**, because
    a suggestion surface that differs per domain is six screens to change when the model changes. **Owns
    POS board frame(s) POS-6F** (client pack, 24 August). **Assigned by board purpose rather than by operation
    overlap** — three attempts at deriving that mapping produced plausible nonsense, and a reader who
    trusts a bad table is worse off than one who has none. **Board repointed 24 August.** This screen
    pointed at `wireframes/POS Board 6.dc.html#pos-6f` — a frame in the client pack, which is where the
    design came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html` and `P16 Venue
    Analytics.dc.html` carry one anchor per screen and nothing referenced either**, so both shipped correctly
    anchored and unreachable. The pack frame is kept in `derivedFrom` because provenance is worth more
    than the wrong pointer.'
  density: compact
  boardFrames:
  - POS Board 6.dc.html#pos-6f
  pattern: configEditor
  patternReason: the screen declares only writes (`requestSuggestion`, `recordSuggestionOutcome`) and
    no read of a population — it is settings, not a list
  purpose: Every open suggestion, what it is based on, and whether the venue took it.
  gaps:
  - operation: requestSuggestion
    why: '**`requestSuggestion` declares no request body shape**, so nothing says what this editor edits.
      The fields cannot be derived and the screen needs the contract before it needs a designer.'
    source: contract ai.yaml POST /ai/suggestions
  layout:
    template: form
    regions:
    - name: actionBar
      slot: publish
      components:
      - kind: primaryButton
        label: Request
        operation: requestSuggestion
        provenance: contract ai.yaml POST /ai/suggestions
      - kind: secondaryButton
        label: Record
        operation: recordSuggestionOutcome
        provenance: contract ai.yaml POST /ai/suggestions/{suggestionId}/outcome
    - name: contentBody
      slot: carried
      components:
      - kind: multiSelect
        label: Kind
        provenance: carried from the previous definition
      - kind: cardList
        bindsTo: Suggestion[]
        notes: '**The basis is on the card, not behind a tap.** A manager must see that today’s answer
          is a margin rule and next quarter’s is a model — the same screen, a different basis.'
        provenance: carried from the previous definition
      - kind: detailPanel
        notes: The explanation in plain words and the inputs it used. **Advice computed from data the
          manager cannot see is advice they will not trust.**
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Take it
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Do something else
        notes: '**Records the outcome either way.** A rejected suggestion is the case the current rule
          got wrong, which is exactly what a model is trained to beat.'
        provenance: carried from the previous definition
  states:
    loading: Open suggestions, newest first, grouped by kind.
    error: Could not load. **Trading is unaffected** — this advises and does not act.
    emptyFirstRun: '**A venue with no history has nothing to suggest from**, and the screen says so rather
      than showing a rule dressed as advice. Names when there will be enough data.'
    emptyNoAccess: You do not have AI permission at this venue.
  apis:
  - operationId: requestSuggestion
    contract: ai
    purpose: Ask for an answer
    trigger: onAction
  - operationId: recordSuggestionOutcome
    contract: ai
    purpose: What the venue did
    trigger: onAction
