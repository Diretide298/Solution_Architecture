  wave: 3
  implementation:
    app: venue-management-web
    route: /analytics/ai-assistant-action-center
    component: apps/venue-management-web/src/routes/analytics/AiAssistantActionCenterDashboard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - ANL-001
    exitTo:
    - ANL-001
    inferred: false
    notes: '**Returns to ANL-001.** Stated on 4 September: this screen declared where it is reached from
      and no way to leave, so whoever landed on it was stuck. The return path is the same edge travelled
      the other way, not a guess about the product.'
    transitions:
    - to: ANL-001
      trigger: Executive Command Center
      carries:
      - dashboardId
      - domain
      - reportId
      - venueId
      provenance: derived — ANL-001 declares entryState.params dashboardId, domain, reportId, venueId,
        so an edge into it must carry them
    - to: BO-010
      trigger: Promotions & Coupons
      provenance: flow F77 step 3→4
      crossesDevice: true
      back: false
  notes: '**Built 20 August. Answers 5 board screens**: AI Recommendation, Simulation & Optimization Center;
    AI Assistant, Alerts & Management Action Center; Transaction & Exception Monitoring and 2 more. **Five
    board screens, and the collapse is the point.** Every domain drew an AI centre and an alert centre;
    **an alert nobody can act on from the screen showing it is a notification**, so recommendation and
    action are one place. **Owns POS board frame(s) POS-6E** (client pack, 24 August). **Assigned by board
    purpose rather than by operation overlap** — three attempts at deriving that mapping produced plausible
    nonsense, and a reader who trusts a bad table is worse off than one who has none. **Retail board operations
    wired 24 August.** **Board repointed 24 August.** This screen pointed at `wireframes/POS Board 6.dc.html#pos-6e`
    — a frame in the client pack, which is where the design came from and not where this screen is drawn.
    **`P15 Kitchen Display.dc.html` and `P16 Venue Analytics.dc.html` carry one anchor per screen and
    nothing referenced either**, so both shipped correctly anchored and unreachable. The pack frame is
    kept in `derivedFrom` because provenance is worth more than the wrong pointer.'
  density: compact
  boardFrames:
  - FnB Board 5.dc.html#fnb-5k
  - FnB Board 6.dc.html#fnb-6j
  - FnB Board 6.dc.html#fnb-6k
  - POS Board 6.dc.html#pos-6e
  - Retail Board 5.dc.html#ret-5k
  - Retail Board 6.dc.html#ret-6k
  pattern: approvalInbox
  patternReason: '`decideProposedAction` decides items that `listAlerts` queues — every row is waiting
    for a person, so the empty state is success'
  purpose: AI Assistant & Action Center — across F&B, retail, ticketing and frontline, filtered by domain.
  gaps:
  - operation: listOrders
    why: '**2 declared operations reach no component on this screen**: listOrders, listProposedActions.
      Either the screen is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: queue
      components:
      - kind: dataTable
        label: Waiting for a decision
        bindsTo: Alert
        columns:
        - Alert.id
        - Alert.ruleId
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.observedValue
        - Alert.threshold
        - Alert.scopePath
        - Alert.acknowledgedByPrincipalId
        - Alert.acknowledgedAt
        - Alert.resolvedAt
        - Alert.escalatedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected assistant action
        bindsTo: Alert
        columns:
        - Alert.id
        - Alert.ruleId
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.observedValue
        - Alert.threshold
        - Alert.scopePath
        - Alert.acknowledgedByPrincipalId
        - Alert.acknowledgedAt
        - Alert.resolvedAt
        - Alert.escalatedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
    - name: actionBar
      slot: decision
      components:
      - kind: primaryButton
        label: Ask
        operation: askReportingQuestion
        provenance: contract reporting.yaml POST /reports/ask
      - kind: secondaryButton
        label: Acknowledge
        operation: acknowledgeAlert
        provenance: contract reporting.yaml POST /alerts/{alertId}/acknowledge
      - kind: secondaryButton
        label: Run
        operation: runReport
        provenance: contract reporting.yaml POST /reports/{reportId}/run
      - kind: secondaryButton
        label: Save changes
        operation: setAlertRule
        provenance: contract reporting.yaml PUT /alert-rules
      - kind: secondaryButton
        label: Decide
        operation: decideProposedAction
        provenance: contract ai.yaml POST /proposed-actions/{actionId}/decide
    - name: contentBody
      slot: carried
      components:
      - kind: multiSelect
        label: Domain
        notes: '**The selector that collapses 26 board screens into nine.** A domain is a filter on an
          analytics screen, not a copy of it — building three sets means maintaining one screen three
          times and watching them drift.'
        provenance: carried from the previous definition
      - kind: chart
        notes: '**Comparison against the previous period by default.** A number with nothing beside it
          is a number nobody can act on.'
        provenance: carried from the previous definition
  states:
    loading: Tiles render in place; **each resolves on its own** so one slow source does not hold the
      page.
    error: Could not load. **Trading is unaffected** — this reads and writes nothing.
    emptyFirstRun: '**A venue with no trading history.** Links to the seeded reports rather than showing
      zeroes — a dashboard of zeroes teaches a new manager nothing.'
    emptyNoResults: Nothing in this window. **Last week and last month are the useful defaults**, not
      today — an analytics screen opened on a Monday is asking about a period.
    emptyNoAccess: You do not have reporting permission at this scope. **Sections you cannot see are not
      shown** rather than greyed out.
  apis:
  - operationId: askReportingQuestion
    contract: reporting
    purpose: Natural-language reporting query
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: listAlerts
    contract: reporting
    purpose: What is currently raised
    trigger: onLoad
  - operationId: acknowledgeAlert
    contract: reporting
    purpose: Take responsibility for it
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: listOrders
    contract: orders
    purpose: List orders
    trigger: onLoad
  - operationId: runReport
    contract: reporting
    purpose: Run a report
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: setAlertRule
    contract: reporting
    purpose: Raise an alert when a number leaves a range
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: listProposedActions
    contract: ai
    purpose: What the assistant has proposed and nobody has decided
    trigger: onLoad
  - operationId: decideProposedAction
    contract: ai
    purpose: Approve or reject a proposal
    trigger: onAction
    invalidates:
    - listAlerts
  entryState:
    params:
    - name: venueId
      from: session
    - name: domain
      from: session
      optional: true
    - name: alertId
      from: deepLink
    - name: reportId
      from: deepLink
    - name: actionId
      from: deepLink
    coldEntry: '**A bookmarked dashboard is the normal way in** — a manager opens the same view every
      Monday. The domain and the window come from the link where it carries them, and from the last view
      where it does not. A proposed action opened from the queue or an alert.'
