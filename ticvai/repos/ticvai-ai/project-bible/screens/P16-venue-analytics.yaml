        - Alert.ruleId
        - Alert.raisedAt
        - Alert.severity
        - Alert.status
        - Alert.observedValue
        - Alert.threshold
        - Alert.scopePath
        - Alert.acknowledgedByPrincipalId
        - Alert.acknowledgedAt
        - Alert.resolvedAt
        - Alert.escalatedAt
        operation: listAlerts
        provenance: contract reporting.yaml GET /alerts
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected executive
        bindsTo: DashboardData
        columns:
        - DashboardData.tileData
        operation: getDashboard
        provenance: contract reporting.yaml GET /dashboards/{dashboardId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Request
        operation: requestSuggestion
        provenance: contract ai.yaml POST /ai/suggestions
      - kind: secondaryButton
        label: Run
        operation: runReport
        provenance: contract reporting.yaml POST /reports/{reportId}/run
    - name: contentBody
      slot: carried
      components:
      - kind: multiSelect
        label: Domain
        notes: '**The selector that collapses 26 board screens into nine.** A domain is a filter on an
          analytics screen, not a copy of it — building three sets means maintaining one screen three
          times and watching them drift.'
        provenance: carried from the previous definition
      - kind: chart
        notes: '**Comparison against the previous period by default.** A number with nothing beside it
          is a number nobody can act on.'
        provenance: carried from the previous definition
  states:
    loading: Tiles render in place; **each resolves on its own** so one slow source does not hold the
      page.
    error: Could not load. **Trading is unaffected** — this reads and writes nothing.
    emptyFirstRun: '**A venue with no trading history.** Links to the seeded reports rather than showing
      zeroes — a dashboard of zeroes teaches a new manager nothing.'
    emptyNoResults: Nothing in this window. **Last week and last month are the useful defaults**, not
      today — an analytics screen opened on a Monday is asking about a period.
    emptyNoAccess: You do not have reporting permission at this scope. **Sections you cannot see are not
      shown** rather than greyed out.
  apis:
  - operationId: getDashboard
    contract: reporting
    purpose: Read a dashboard with tile data
    trigger: onLoad
  - operationId: listAlerts
    contract: reporting
    purpose: What is currently raised
    trigger: onLoad
  - operationId: requestSuggestion
    contract: ai
    purpose: requestSuggestion
    trigger: onAction
    invalidates:
    - listAlerts
  - operationId: runReport
    contract: reporting
    purpose: Run a report
    trigger: onAction
    invalidates:
    - listAlerts
  entryState:
    params:
    - name: venueId
      from: session
    - name: domain
      from: session
      optional: true
    - name: dashboardId
      from: deepLink
    - name: reportId
      from: deepLink
    coldEntry: '**A bookmarked dashboard is the normal way in** — a manager opens the same view every
      Monday. The domain and the window come from the link where it carries them, and from the last view
      where it does not.'
    preloaded:
    - DashboardData.tileData
