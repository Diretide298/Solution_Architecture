platform:
  code: P16
  formFactor: web
  surface: staffFacing
  runtime: reactWeb
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  app: venue-management-web
  appStatus: not scaffolded
  operator: venue
  deployment:
    target: browser
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: venue-owned workstation
    networkAssumption: venue LAN
    releaseCadence: fortnightly
  name: Venue Analytics — Cross-Domain Reporting
  shortName: Venue Analytics
  audience: staff
  offlineCapable: false
  screenCount: 69
  notes: '**26 board screens collapsed to nine.** F&B, Retail and POS each ended their set with an executive
    command centre, a sales and revenue view, a performance view, a forecasting view and an AI centre
    — and **two of them are word-for-word identical across domains.**


    **A domain is a filter on an analytics screen, not a copy of it.** Building three sets means maintaining
    one screen three times and watching them drift, and the drift is invisible until two dashboards disagree
    about last month.


    **Its own platform rather than a P08 section** because it is read rather than operated: opened on
    a Monday morning, never during service, by somebody asking about a period rather than doing a job.


    **Shares the `venue-management-web` app.** A separate platform is a navigation and permission boundary,
    not necessarily a separate codebase.'
  wireframeBoard: wireframes/P16 Venue Analytics.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-management
    name: TICVAI Venue Management
    shell: web
    siblings:
    - P08
    - P12
    - P13
    note: '**Already one app in all but name** — P08, P13 and P16 declared the same `app` before this
      decision. One tenant-level surface that filters across venues, with analytics, CMS and the support
      desk as sections of it.'
    decided: 10 September 2026
