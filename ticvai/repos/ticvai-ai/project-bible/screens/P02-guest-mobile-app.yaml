    error: Could not load. Names which read failed; nothing is added.
    emptyFirstRun: '**This product has no ticket types on sale.** Says so and offers the product page.'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025: `x-ticvai-permission`
      is what a staff caller must hold; a guest call resolves to the guest''s own data). No access here
      means one of two things, told apart by the response: not signed in, where the guest is offered sign-in
      and brought back to this screen, or a record that is not theirs, which says so without saying whose
      it is. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.'
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
    emptyNoResults: No ticket in the category picked. Names the category and offers the others.
  apis:
  - operationId: listProductVariants
    contract: catalogue
    purpose: The ticket types and prices
    trigger: onLoad
  - operationId: listProductCategories
    contract: catalogue
    purpose: Ticket categories
    trigger: onLoad
  - operationId: listProducts
    contract: catalogue
    purpose: The add-ons, and the tickets of a category
    trigger: onLoad
  - operationId: getPublishedGuidedChoice
    contract: white-label
    purpose: The venue's published Help me choose (404 = none)
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Add the tickets and add-ons
    trigger: onAction
  entryState:
    params:
    - name: productId
      from: GST-004
    - name: performanceId
      from: GST-007
      optional: true
    - name: cartId
      from: session
    - name: venueId
      from: session
    coldEntry: '**A link to a product no longer on sale** says so and offers the listing; a performance
      that has passed offers the next one.'
  wireframe:
    status: notStarted
    provenance: client-verified
    board: wireframes/P02 Guest App.dc.html#gst-008
    prototype:
      file: sources/designs/guest-rev3-28-september/TICVAI Guest Booking Mobile v2.dc.html
      rev: rev 3
      verified: 2026-09-28
      match: partial
      view: Account → All screens → Wave 1 → Tickets & add-ons; ticket selection itself is Rev 3 feedback
        → Tickets after a time
      differences: The YAML (transferOrderTickets only) and the Wave 1 prototype screen both treat this
        as tickets-with-transfer after purchase, but the name and the Rev 3 flow mean choosing ticket
        types and add-ons during booking. Rev 3 also moves all add-ons to one Add-ons step. The YAML needs
        a definition for selection and add-ons (listProducts/addCartLine).
  apisNote: Rebuilt 9 September 2026 from the 1 operation this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  purposeNote: Rewritten 29 September (decided 29 September, rev 3 GAP-D3). The screen had been defined
    as ticket transfer (`transferOrderTickets` only), a duplicate of GST-014 / GST-045; transfer stays
    there.
  overlays:
  - id: helpMeChoose
    component: modal
    trigger: Help me choose (button, banner, or once on first arrival when the mode is popupOnArrival)
    body: '**One or two questions, three answers each** (title, one-liner, icon, optional badge); the
      last answer opens its target (a product, a category, an event or a module) through a result card.
      **Start over** returns to the first question. Answers stay on the device (decided 29 September,
      rev 3 REV3-11). The prototype draws it as a full-height sheet (r3quiz) opened from the banner, so
      it is an overlay of this step rather than a screen of its own.'
    bindsTo: GuidedChoice
    confirm:
      label: Show me
    dismiss:
      label: Close
      discards:
      - answers
    provenance: client-verified
