        contact; per-site guestCheckout off by default (matrix 2.6.28)
    - to: GST-001
      trigger: Home – Default
      provenance: derived — GST-001 declares entryState.params  and GST-041 holds none of them, so the
        edge carries nothing and GST-001 opens cold
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Promo code added 28
    September** (decided 28 September, audit R073 (e)) — the web cart WEB-010 has the field, and the two
    shells are one product.


    **Rev 3 (decided 29 September).** **Sign-in (REV3-3):** with `signInAt` `afterAddOns` (default) the
    sign-in or guest-code choice is asked when the guest leaves the tickets and add-ons step (GST-008
    → GST-042); with `atPayment` it is asked here, on the way to payment. The basket is kept either way;
    guest checkout and matching are unchanged (DG-1). Visit date per line (23SEP-9). **On mobile the basket
    stays a bottom bar with the running total**; the floating icon and the cart side apply to the website
    (REV3-10). A spot held on the venue map counts down from its `ResourceHold.expiresAt` (REV3-15). `checkoutCart`
    `422 consentRequired` or `consentAnswerBlocks` sends the guest back to the consent questions (REV3-26).'
  density: comfortable
  pattern: statusTracker
  patternReason: '`getCart` reads one record and nothing reads a population — the screen is about that
    one thing'
  purpose: Take the money, and be unambiguous about whether it worked.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The cart
        bindsTo: Cart
        columns:
        - Cart.id
        - Cart.token
        - Cart.venueId
        - Cart.channel
        - Cart.subjectId
        - Cart.status
        - Cart.lines
        - Cart.conflicts
        - Cart.subtotal
        - Cart.discountTotal
        - Cart.taxTotal
        - Cart.total
        - Cart.appliedPromotionIds
        - Cart.expiresAt
        - Cart.extensionsUsed
        - Cart.maxExtensions
