        edge carries nothing and GST-001 opens cold
    - to: GST-059
      trigger: They follow it through the day
      provenance: flow F49 step 4→5
      carries:
      - suggestionId
  notes: 'Minuted 10 Aug §4.9. **The AI half is Wave 2** — the manual planner must work without it (CF-41).
    **Guest concierge confirmed in Phase 1 on 17 August (CF-14), charged per token and bounded by `AiPolicy.guestCapabilityScope`.**
    Still degrades to the manual planner rather than to an error. ** wired 24 August.** The board drew
    four bespoke AI endpoints for itinerary planning; **one operation with a kind answers all of them**
    (ADR-0028), and recording the outcome is what lets a model replace the heuristic later. **`recordSuggestionOutcome`
    removed from the guest surface.** `check-screens` refused it and was right: **a guest does not record
    an outcome — the platform observes what they did.** A guest app that self-reports whether it took
    the advice is a training label the guest could forge, and the observation belongs server-side where
    the plan and the visit can be compared. **Out of the first release** (decided 28 September, audit
    R187): the itinerary planner is deferred and this screen is `wave: 4` with a `deferred` block. Kept,
    not deleted, for the release that builds it. **Itinerary suggestion removed 28 September** (decided
    28 September, audit R209): the planner is deferred (R187) and `requestSuggestion` refuses a guest
    anything but prepPlan, upsell and waitTime, so this screen no longer asks for a day plan.


    **Rev 3 (decided 29 September).** Stays in wave 4 (GAP-C3): the itinerary screens are not built in
    the first release, confirming audit R187.'
