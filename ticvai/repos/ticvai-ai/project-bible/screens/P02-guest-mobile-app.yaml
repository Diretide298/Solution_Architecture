    - to: ADM-003
      trigger: The right is propagated to the other cell
      provenance: flow F19 step 1→2
      crossesDevice: true
      back: false
  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. Membership. **`listDelegations`
    and `grantDelegation` are the member list and add-member** Pranay asked for — CF-132 built them as
    delegated authority rather than a household table. **Rewired on the 20 August review.** **`getGuestLink`
    restored** — F19 step 1 calls it from here and my rewire dropped it. **A membership that works in
    another country resolves through the guest link**, and the flow checker caught what the screen edit
    did not. **Cross-platform navigation removed 24 August**: ADM-003. **A till does not navigate to a
    back office and a guest app does not navigate to either** — those are device handovers, and a flow
    declares them with `crossesDevice` rather than a screen pretending there is a link. **Wired 24 August
    from review**: getSubscription, listSubscriptionInvoices. **The operations existed and this screen
    could not call them** — reviewers reported them as missing APIs, which is what an unreachable operation
    looks like from a wireframe. **`getSubscription` and `listSubscriptionInvoices` removed the same day
    they were wired.** `check-screens` refused them: **both carry a staff permission and this is a guest
    surface.** The reviewer asked for `GET /memberships/current` — a guest-scoped read that does not exist.
    **That is the correct finding and the wiring was the wrong fix**: it is a new operation, not a missing
    link. **`getGuestLink` is `service` audience** — a cross-region pseudonymous lookup (ADR-0010), not
    something a membership screen calls. Removed 24 August. **`getMyMemberships` and `listGuestMemberships`
    wired 24 August**, replacing `getGuestLink`. A guest reading their own membership calls a guest operation;
    **`getGuestLink` is the cross-region pseudonymous lookup a service makes on their behalf** (ADR-0010),
    and F19 was walking it from a guest screen.


    **Rev 3 (decided 29 September).** Billing statement decline states (DG-2, no contract change): soft
    decline → *Retry now* and *Use another card*; hard decline → another card only; declined again → the
    next retry date; paid.'
