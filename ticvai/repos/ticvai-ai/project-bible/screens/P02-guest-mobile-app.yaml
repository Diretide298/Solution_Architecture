    waitlist** is `leaveRestaurantWaitlist` (audit R073 (d)). **A table deposit is a venue option, off
    by default** (decided 29 September, rev 3 REV3-8b, superseding audit R077 (a)): with it off, no card
    is needed and cancelling is free; with it on, the venue''s `DepositPolicy.dining` sets the amount,
    the basis and the late-cancel and no-show terms.


    **Leaving a waitlist matters as much as joining one.** A guest who has given up and walked away still
    holds a place, and a queue full of people who left is a queue nobody trusts.


    **Rev 3 (decided 29 September).** **No basket without a deposit (REV3-8):** a table reservation and
    a waitlist place confirm straight after `createTableReservation` / `joinRestaurantWaitlist` with a
    *No card needed* confirmation; the prototype''s basket line is prototype-only. **Deposit (REV3-8b):**
