  states:
    loading: Content loads.
    error: Could not load. **Says what failed and offers one way onward**, never a bare failure.
    emptyFirstRun: '**Nothing requested yet.** No export, no erasure, no document — and that is the ordinary
      state. **The screen explains what each request means before offering it**, because an erasure a
      guest did not understand is one they will phone about.'
    emptyNoResults: '**Nothing here yet.** The scope is what narrowed it — naming the scope is what stops
      somebody concluding the record does not exist.'
    emptyNoAccess: Shown when the caller lacks `GUEST_VIEW_PII`, which `exportSubjectData` requires, and
