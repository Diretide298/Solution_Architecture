      - code
      - deviceId
    provenance: client-verified
  states:
    loading: Checking whether this device already holds a guest session. The sign-in form stays visible.
    error: Identity could not be reached. **Says so rather than saying the password or code is wrong**,
      and keeps what was typed.
    emptyFirstRun: '**Nobody signed in on this device** — the normal state. The form offers a code, a
      password, Apple or Google and UAE Pass, and Create an account (`registerGuest`).'
    emptyNoAccess: '**There is no permission to name — a guest holds none** (ADR-0025), and this is the
      screen a guest who is not signed in is sent to, so it has no no-access case of its own. A session
      that has expired lands here with the screen it came from kept, and returns to it after sign-in.'
    signInRefused: '**One message for every refusal of a password sign-in**: `guestPasswordLogin` answers
      401 alike for a wrong password, an unknown identifier, an account with no password and a locked
      account, and the screen never says which. Too many attempts (429, or the lockout after `PasswordPolicy.lockoutAfterAttempts`)
      says to try again later and offers **Send me a code** instead (decided 28 September, audit R073
      (a)).'
    offline: '**Not available, and the offline banner says why.** Signing in, registering and verifying
      a code need the server.'
  apis:
  - operationId: registerGuest
