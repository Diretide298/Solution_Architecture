  notes: 'States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Corrected 24 August**:
    removed getCurrentSession, logout, selectRole. **A guest surface has no roles to select and its own
    logout.** `selectRole` is ADR-0002 staff authorisation; `getCurrentSession` is the staff session.
    `guestLogout` and `getGuestSession` already existed — the screen was reaching into the staff identity
    surface because nothing checked that a guest platform only calls guest operations. **Rebuilt 28 September
    as a guest sign-in form** (decided 28 September, audit R167, R073 (a)): removed `login`, `startSsoAuthorization`,
    `completeSsoAuthorization`, `listSsoProviders` and the six MFA operations — guests have no enterprise
    SSO. **The second factor came back on 29 September, per venue** (see below). Password sign-in is `guestPasswordLogin`.


    **Rev 3 (decided 29 September).** **Guest two-step verification is per venue, off by default** (GAP-B1,
    `VenueSettings.identity.guestTwoStep`; supersedes the second part of audit R167; no enterprise SSO
    stands). The prompt appears only when signing in or acting at a venue that has it on; enrolment is
    on the guest''s account (GST-073). **Sign-in gate (REV3-3):** reached from GST-008 (after add-ons)
    or GST-041 (at payment), returning to the basket with it kept; guest checkout and matching unchanged
    (DG-1).


    **The venue in context is sent** (decided 29 September, rev 3 GAP-B1, per venue): `verifyGuestOtp`,
    `guestPasswordLogin`, `guestSocialLogin`, `guestUaePassLogin` and `createMfaChallenge` take an optional
    `venueId`, the venue the app or booking is in, so the second factor is asked only where that venue
    has guest two-step verification on.'
