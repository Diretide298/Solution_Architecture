      - kind: secondaryButton
        label: Upload guest document
        operation: uploadGuestDocument
        provenance: contract marketing-crm.yaml POST /guest-documents
      - kind: secondaryButton
        label: Export subject data
        operation: exportSubjectData
        provenance: contract identity.yaml POST /guests/{subjectId}/data-export
  overlays:
  - id: confirmDeleteGuestAccount
    component: confirmDialog
    trigger: Delete guest account
    body: '**Names what `deleteGuestAccount` changes and what it leaves alone**, in the consequence rather
      than the verb. A privacy data this affects should be identified in the dialog, not just counted.'
    provenance: client-verified
  - id: formUpdateGuestPreferences
    component: modal
    trigger: Save guest preferences
    body: '**Collects what `updateGuestPreferences` sends before it is called.** Nothing in the body is
      required. Optional: `id`, `subjectId`, `seatingPreference`, `drinkPreferences`, `dietary`, `accessibility`,
      `preferredChannel`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: GuestPreferences
    confirm:
      label: Save guest preferences
      operation: updateGuestPreferences
    dismiss:
      label: Cancel
      discards:
      - id
      - subjectId
      - seatingPreference
      - drinkPreferences
      - dietary
      - accessibility
      - preferredChannel
    provenance: client-verified
  - id: formUploadGuestDocument
    component: modal
    trigger: Upload guest document
    body: '**Collects what `uploadGuestDocument` sends before it is called.** Required: `id`, `subjectId`,
      `kind`, `storageRef`, `retainUntil`. Optional: `contentType`, `consentPurposeId`, `uploadedAt`,
      `uploadedByPrincipalId`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: GuestDocument
    confirm:
      label: Upload guest document
      operation: uploadGuestDocument
    dismiss:
      label: Cancel
      discards:
      - id
      - subjectId
      - kind
      - storageRef
      - retainUntil
      - contentType
      - consentPurposeId
      - uploadedAt
      - uploadedByPrincipalId
