  - id: formVerifyGuestOtp
    component: modal
    trigger: Sign in with the code
    body: '**Collects what `verifyGuestOtp` sends before it is called.** Required: `identifier`, `code`.
      Optional: `deviceId`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Verify guest OTP
      operation: verifyGuestOtp
    dismiss:
      label: Cancel
      discards:
