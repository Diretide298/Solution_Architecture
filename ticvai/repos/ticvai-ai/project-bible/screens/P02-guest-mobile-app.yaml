      - kind: secondaryButton
        label: Check out
        operation: checkoutCart
        provenance: contract orders.yaml POST /carts/{cartId}/checkout
      - kind: primaryButton
        label: Pay
        operation: createPayment
        provenance: contract orders.yaml POST /payments
      - kind: secondaryButton
        label: Save parking entitlement
        operation: updateParkingEntitlement
        provenance: contract access.yaml PATCH /parking-entitlements/{entitlementId}
  states:
    loading: Terminal or gateway state, shown plainly
    error: '**Declined reads differently from unresolved.** An unresolved payment inquires rather than
      retries, and nothing is issued until it resolves'
    emptyFirstRun: —
    emptyNoResults: Nothing matches the filter on venueId and the parking reserve pay are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `PARKING_CONFIGURE`, which `listParkingFacilities` requires,
