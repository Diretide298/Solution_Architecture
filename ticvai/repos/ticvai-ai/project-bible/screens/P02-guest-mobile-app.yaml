    18 August** — the guest app''s payment screen did not declare the operation that takes a payment,
    and F11 routed food payment through the AI concierge instead. **Card or wallet** (TenderKind `card`,
    `wallet`, as `createPayment` and flow F11 step 4 say; decided 28 September, audit R080 (a)), **both
    in base currency, so tender currency equals base currency**; a foreign card is converted by the guest''s
    own issuer at their rate, which is not ours and is not recorded as ours. **Navigation repointed to
    P15 on 20 August** — the F&B screens it linked to moved out of the back office when the client board
    was adopted. **Cross-platform navigation removed 24 August**: BO-020. **A till does not navigate to
    a back office and a guest app does not navigate to either** — those are device handovers, and a flow
    declares them with `crossesDevice` rather than a screen pretending there is a link. **No ''is this
    you?'' at checkout** (decided 28 September, audit R120 (b)): a verified contact that matches an existing
    profile attaches the order automatically inside `checkoutCart` (ADR-0045), so `checkGuestCheckoutMatch`
    and `decideGuestCheckoutMatch` were removed from this screen; only unverified matches go to staff
    review.'
