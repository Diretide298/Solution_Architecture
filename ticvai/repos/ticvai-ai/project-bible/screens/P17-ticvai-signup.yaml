platform:
  code: P17
  audience: public
  formFactor: web
  shortName: TICVAI Sign-up
  name: TICVAI Sign-up — Onboarding & Purchase
  surface: public
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 24
  app: signup-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  deployment:
    target: browser
    distribution: public, served from the Control Plane
    bundleUpdate: immediate on deploy
    hosting: Control Plane, outside every cell — a prospect has no cell yet. The application itself is
      written to the prospect's regional control database (ADR-0043)
    storeReview: false
    deviceOwnership: prospect device, unmanaged
    networkAssumption: public internet
    releaseCadence: monthly
  reachesOtherPlatforms:
  - screen: BO-594
    platform: P08
    board: wireframes/P08 Venue Management.dc.html#bo-594
    note: After activation the customer's next screen is *Your TICVAI Environment Is Ready*, inside their
      own tenant — provisioning between the two is automatic (board 6)
  operator: public
  wireframeBoard: wireframes/P17 TICVAI Sign-up.dc.html
  wireframeBoardNote: '**The generated board for the whole platform**, declared when the platform was
    created on 11 September 2026 so `check-wireframes` never meets an orphan.'
  note: '**Somebody who is not a customer yet, buying TICVAI.** Created on 11 September 2026 from the
    Subscription book''s boards 2, 4 and 5, which were on P09 — a console a prospect cannot sign into.
    **Every operation the journey needs is authenticated today**: `submitOnboardingApplication` requires
    `TENANT_CONFIGURE` at tenant scope, so only a tenant can apply to become one, and `listPlans` requires
    a TICVAI staff permission. That is a contract gap, recorded in `workshop-contract-gap.md`, not something
    this platform can resolve by being drawn.'
  targetApp:
    app: ticvai-control
    name: TICVAI Control
    shell: web
    siblings:
    - P09
    - P10
    - P11
    - P14
    note: '**TICVAI operates all five**, whoever signs in. The partner portal, the accreditation intake,
      the developer portal and the sign-up are outward faces of the control plane, not separate products
      — but their users are not TICVAI staff, and the permission model has to hold that line. **P17 added
      11 September 2026**: a prospect buying TICVAI has no tenant and no cell, so the control plane is
      the only thing that can serve them.'
    decided: 10 September 2026
screens:
- id: SGN-001
  name: Welcome & Start Your TICVAI Journey
  module: Onboarding & Assessment
  requiresModule: core
  wave: 3
  source:
    sameAs: ADM-379
    book: Subscription_Licensing_AI_Self_Service.pdf
    board: '2'
    number: '1'
    page: 21
  implementation:
    app: signup-web
    route: /onboarding-assessment/welcome-start-your-ticvai-journey-sgn-001
    component: apps/signup-web/src/routes/onboarding-assessment/WelcomeStartYourTicvaiJourney.tsx
    status: notStarted
  density: compact
  notes: The self-service form of `ADM-379`, for a prospect with no account. Decided 11 September 2026;
    P09 keeps its screen for the operator-led path (BL-165). `tools/applied/apply-subscription-placement.py`
    keeps the two in step.
  wireframe:
    status: notStarted
    board: wireframes/P17 TICVAI Sign-up.dc.html#sgn-001
  purpose: Provide the entry point for a new customer starting self-service onboarding.
  pattern: configEditor
  patternReason: the pack gives this screen a configuration directory (§Starting Options) and no display
    directory — it is settings, not a population
  layout:
    template: form
    regions:
    - name: contentBody
      slot: fields
      components:
      - kind: selectField
        label: Start New Setup
        provenance: pack Subscription_Licensing_AI_Self_Service.pdf, page 21 §Starting Options
      - kind: selectField
        label: Continue Saved Setup
        provenance: pack Subscription_Licensing_AI_Self_Service.pdf, page 21 §Starting Options
      - kind: selectField
        label: Sign In
        provenance: pack Subscription_Licensing_AI_Self_Service.pdf, page 21 §Starting Options
      - kind: selectField
        label: Request Enterprise Consultation
        provenance: pack Subscription_Licensing_AI_Self_Service.pdf, page 21 §Starting Options
  states:
    loading: The welcome start your configuration as saved.
    error: Could not load. Names which read failed and leaves the welcome start your untouched.
    emptyFirstRun: No welcome start your configured yet. Offers no create action — this screen declares
      no operation that makes one; distinct from a filter that matched nothing.
    emptyNoAccess: TODO — not decided. A prospect is signed out and holds no permission, so the operator
      wording on the P09 twin does not apply. The book offers *Continue Saved Setup* and *Sign In* on
      2.1, which is where somebody without access to a saved setup would be sent; no minute has decided
      it.
    emptyNoResults: '**Nothing matched.** The filter or the scope narrowed it — naming which is what stops
      somebody concluding the record does not exist'
  apis: []
  apisNote: Regenerated 9 September 2026 from Subscription_Licensing_AI_Self_Service.pdf page 21. 0 of
    0 labels bound to a contract property; 4 of 16 pack bullets carried onto the screen — the rest are
    acceptance prose, worked examples and AI narrative, which belong to the matrix and the contracts rather
    than here.
  navigation:
    isEntryPoint: true
    exitTo:
    - SGN-002
    transitions:
    - to: SGN-002
      trigger: Customer & Organization Registration
      provenance: structural — the book's own journey, 2.1 "Journey Preview", 11 September 2026
    entryFrom:
    - SGN-002
  gaps:
  - operation: scoreVsiAssessment
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): The welcome page scores nothing (scoreVsiAssessment is
      called on the assessment screens SGN-003 to SGN-010); the operator-led copy ADM-379 loses it too,
      so the two stay in step (design-notes correction platform-foundation SGN-001).'
    source: screens/P17-ticvai-signup.yaml#SGN-001
- id: SGN-002
  name: Customer & Organization Registration
  module: Onboarding & Assessment
  requiresModule: core
  wave: 3
  source:
    sameAs: ADM-380
    book: Subscription_Licensing_AI_Self_Service.pdf
    board: '2'
    number: '2'
    page: 22
  implementation:
    app: signup-web
    route: /onboarding-assessment/customer-organization-registration-sgn-002
    component: apps/signup-web/src/routes/onboarding-assessment/CustomerOrganizationRegistration.tsx
    status: notStarted
  density: compact
  notes: The self-service form of `ADM-380`, for a prospect with no account. Decided 11 September 2026;
    P09 keeps its screen for the operator-led path (BL-165). `tools/applied/apply-subscription-placement.py`
    keeps the two in step.
  wireframe:
    status: notStarted
    board: wireframes/P17 TICVAI Sign-up.dc.html#sgn-002
  purpose: Create the initial customer account and organization profile.
  pattern: listDetail
  patternReason: '**nothing in the pack chooses a pattern for this screen** — no metric directory, no
    display directory, no configuration directory. It falls to the default, and the fallback is recorded
    rather than passed off as a decision'
  layout:
    template: split
    regions:
    - name: contentBody
      components:
      - kind: textField
        label: Work email
        bindsTo: StartProspectSignupRequest.email
        notes: 'Step one of the prospect sign-up session (DEC-167, "Email + one-time code"): the code
          goes to this address; "Continue saved setup" is the same field (CHG-CLN-019).'
        provenance: contract identity.yaml POST /auth/prospect/signup
      - kind: secondaryButton
        label: Send code
        operation: startProspectSignup
        notes: Sends the one-time code; the answer is the same whether or not the email has a saved setup.
        provenance: contract identity.yaml POST /auth/prospect/signup
      - kind: textField
        label: One-time code
        bindsTo: VerifyProspectSignupCodeRequest.code
        notes: Six digits from the email; a right code opens the sign-up session (prospectAuth) the rest
          of the journey runs on and resumes a saved setup (CHG-CLN-019).
        provenance: contract identity.yaml POST /auth/prospect/signup/{challengeId}/verify
      - kind: secondaryButton
        label: Verify code
        operation: verifyProspectSignupCode
        notes: A wrong code says so and counts against the challenge; after five, Send code again.
        provenance: contract identity.yaml POST /auth/prospect/signup/{challengeId}/verify
      - kind: primaryButton
        derived: true
        impliedBy: submitOnboardingApplication
        label: Submit
        notes: The act the screen exists for.
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: submitOnboardingApplication
  states:
    loading: The customer organization registration list.
    error: Could not load. Names which read failed and leaves the customer organization registration untouched.
    emptyFirstRun: No customer organization registration yet. Carries the create action; distinct from
      a filter that matched nothing.
    emptyNoResults: The filter narrowed it and the customer organization registration are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: TODO — not decided. A prospect is signed out and holds no permission, so the operator
      wording on the P09 twin does not apply. The book offers *Continue Saved Setup* and *Sign In* on
      2.1, which is where somebody without access to a saved setup would be sent; no minute has decided
      it.
  gaps:
  - operation: null
    why: '**The pack gives this screen nothing that can be drawn.** Its sections are prose — purpose,
      acceptance conditions, worked examples — with no directory of metrics, columns or fields anywhere
      in them. The screen has no content region rather than an empty one, and it needs a person before
      it is built.'
    source: pack Subscription_Licensing_AI_Self_Service.pdf, page 22
  - operation: null
    why: '**The pack gives this screen no display, metric or configuration directory**, so its shape is
      a default rather than a reading. It needs a person before it is built.'
    source: pack Subscription_Licensing_AI_Self_Service.pdf, page 22
  apis:
  - operationId: submitOnboardingApplication
    contract: subscription
    purpose: Register the organisation
    trigger: onAction
    provenance: board reading, 19 September 2026
  - operationId: startProspectSignup
    contract: identity
    purpose: Send the one-time code that opens (or resumes) the sign-up
    trigger: onAction
    provenance: DEC-167, 2 October 2026 (CHG-CLN-019)
  - operationId: verifyProspectSignupCode
    contract: identity
    purpose: Prove the email and receive the prospect sign-up session
    trigger: onAction
    provenance: DEC-167, 2 October 2026 (CHG-CLN-019)
  apisNote: Regenerated 9 September 2026 from Subscription_Licensing_AI_Self_Service.pdf page 22. 0 of
    0 labels bound to a contract property; 0 of 22 pack bullets carried onto the screen — the rest are
    acceptance prose, worked examples and AI narrative, which belong to the matrix and the contracts rather
    than here.
  navigation:
    entryFrom:
    - SGN-001
    - SGN-003
    exitTo:
    - SGN-001
    - SGN-003
    transitions:
    - to: SGN-001
      trigger: Back to Welcome & Start Your TICVAI Journey
      provenance: structural — the book's own journey, 2.1 "Journey Preview", 11 September 2026
      back: true
    - to: SGN-003
      trigger: Venue Type & Business Profile
      provenance: structural — the book's own journey, 2.1 "Journey Preview", 11 September 2026
  entryState:
    params:
    - name: challengeId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `startProspectSignup`;
        a link or an edge that holds one opens it instead.'
