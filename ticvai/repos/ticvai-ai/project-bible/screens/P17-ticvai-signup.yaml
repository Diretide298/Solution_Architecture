      application.** `createUpload` is staff-only, and the application is created once (SGN-002), so the
      billing entity and its documents cannot be added from here after it is submitted. Logged as contract
      gaps 2 October 2026 (CHG-SOT-016).'
    source: contracts/satellite/assets.yaml#createUpload | contracts/satellite/subscription.yaml#submitOnboardingApplication
  apis:
  - operationId: submitOnboardingApplication
    contract: subscription
    purpose: The billing entity rides on the onboarding application, saved before verification (DEC-223)
    trigger: onAction
    provenance: decided 2 October 2026 (DEC-209, DEC-223, CHG-CSA-030); bound by CHG-SOT-017
