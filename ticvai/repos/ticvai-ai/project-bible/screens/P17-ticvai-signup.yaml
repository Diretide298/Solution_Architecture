  density: compact
  notes: The self-service form of `ADM-411`, for a prospect with no account. Decided 11 September 2026;
    P09 keeps its screen for the operator-led path (BL-165). `tools/applied/apply-subscription-placement.py`
    keeps the two in step.
  wireframe:
    status: notStarted
    board: wireframes/P17 TICVAI Sign-up.dc.html#sgn-020
  purpose: Capture the company TICVAI will invoice and its trade licence and tax registration, in plain
    language, saved on the application.
  pattern: configEditor
  patternReason: One record (the billing entity) entered and saved on the application; no population to
    list (CHG-SOT-017).
  layout:
    template: form
    regions:
    - name: contentBody
      slot: fields
      components:
      - kind: textField
        label: Company to be invoiced (legal name)
        bindsTo: BillingEntity.legalName
        operation: submitOnboardingApplication
        notes: Prints on the tax invoice exactly as entered. **The commercial customer may differ from
          the operating venue** (the pack's "Commercial Customer ≠ Operating Venue").
        provenance: contract subscription.yaml BillingEntity (CHG-CSA-030)
      - kind: selectField
        label: Country
        bindsTo: BillingEntity.countryCode
        operation: submitOnboardingApplication
        notes: Decides which documents are required (tenancy `RegionSettings`).
        provenance: contract subscription.yaml BillingEntity (CHG-CSA-030)
      - kind: textField
        label: Trade licence number
        bindsTo: BillingEntity.tradeLicenceNumber
        operation: submitOnboardingApplication
        provenance: contract subscription.yaml BillingEntity (CHG-CSA-030)
      - kind: textField
        label: Tax registration number (TRN)
        bindsTo: BillingEntity.trn
        operation: submitOnboardingApplication
        notes: Optional. Entering one makes the VAT certificate required (decided 2 October 2026, workbook
          Q210, DEC-210).
        provenance: contract subscription.yaml BillingEntity (CHG-CSA-030)
      - kind: textField
        label: Billing address
        bindsTo: BillingEntity.address
        operation: submitOnboardingApplication
        provenance: contract subscription.yaml BillingEntity (CHG-CSA-030)
      - kind: textField
        label: Invoice email
        bindsTo: BillingEntity.invoiceEmail
        operation: submitOnboardingApplication
        provenance: contract subscription.yaml BillingEntity (CHG-CSA-030)
      - kind: detailPanel
        label: Documents required
        bindsTo: BillingEntity.documents
        columns:
        - BillingEntity.documents
        - BillingEntity.missingDocuments
        operation: submitOnboardingApplication
        notes: A trade licence always; a VAT certificate when a TRN is entered. Each shows missing, uploaded,
          verified, rejected or expired. **Nothing is provisioned until verification passes** (DEC-223).
        provenance: contract subscription.yaml BillingEntity.documents (CHG-CSA-030)
    - name: actionBar
      slot: publish
      components:
      - kind: primaryButton
        label: Save and continue
        operation: submitOnboardingApplication
        notes: 'Sends the application with `billingEntity` (decided 2 October 2026, Chinmay, workbook
          Q209 and Q223: "Yes: saved on the application; nothing provisioned until verified"; DEC-209,
          DEC-223, CHG-CSA-030).'
        provenance: contract subscription.yaml POST /onboarding-applications
      - kind: secondaryButton
        label: Back
        notes: Leaves without sending; what was typed stays on the sign-up session.
        provenance: derived
  states:
    loading: The application as saved so far.
    error: Could not save. Names what failed; nothing typed is lost.
    emptyFirstRun: Nothing entered yet. Says why each item is asked (it prints on the tax invoice) and
      that nothing is provisioned until it is verified. The prospect's answers are kept on their sign-up
      session and they can come back with a one-time code to "Continue saved setup" (decided 2 October
      2026, DEC-167).
    emptyNoAccess: 'Not applicable: a prospect holds no permission. A signed-out prospect without a saved
      setup is sent to SGN-001 to start or continue one.'
  gaps:
  - operation: createLegalEntity
    removed: true
    why: 'Removed 2 October 2026 (CHG-SOT-017, design-notes correction SGN-020): `createLegalEntity` is
      a tenant-scoped, staff-only ledger operation needing ACCOUNT_CONFIGURE, and a prospect on P17 has
      no tenant and no cell. The billing entity rides on the onboarding application instead (CHG-CSA-030);
      TICVAI staff maintain it on ADM-411 with `setBillingEntity`.'
    source: contracts/spine/finance.yaml#createLegalEntity | contracts/satellite/subscription.yaml#submitOnboardingApplication
  - operation: null
