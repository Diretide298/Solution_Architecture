- id: PTR-003
  name: Profile & Company Details
  module: Access & Account
  purpose: What we hold about staff, and what they can change.
  wave: 2
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
      - kind: primaryButton
        derived: true
        impliedBy: createPrincipal
        label: Create principal
        notes: The act the screen exists for.
      - kind: dataTable
        derived: true
        impliedBy: listPrincipals
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: createPrincipal
  states:
    loading: Current values, with the level each resolves from
    emptyFirstRun: Nothing set at this level — the inherited value is shown and labelled as inherited
      (ADR-0018)
    emptyNoAccess: '**Says which permission is missing, and never renders as an empty list.** This screen
      needs `USER_MANAGE` to manage users; a person without it sees the reason and who to ask, because
      an empty table reads as *there is no data* and sends somebody to support with the wrong question.


      **Authority is carried by the person, not the device** (ADR-0002) — so signing in again on the same
      terminal is the way through.


      **Also reached when `partner` is not licensed.** The tenant has not bought this module, which is
      a commercial answer and not a permission one — say which, because the person to ask is different.'
    error: '**Could not load. Saving is blocked**, because a value saved over an unread one silently overwrites
      what someone else set'
    emptyNoResults: 'Nothing matches the current filters. **The filters are named and clearable from here**
      — an empty list with the filter state hidden elsewhere is a person who thinks the data is gone.
      **Added 25 August with the derived list component**: a screen that lists has to say what it shows
      when the list is empty, and this screen gained the list before it gained the sentence.'
  wireframe:
    status: generated
    board: wireframes/P10 Partner Web.dc.html#ptr-003
