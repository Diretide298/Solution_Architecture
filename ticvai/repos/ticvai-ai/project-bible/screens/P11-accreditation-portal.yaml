# P11 — Accreditation Portal
# BLOCKED on the Accreditation workshop.
# Note the split: this portal is Wave 3, but accreditation VALIDATION appears on the
# employee scanner in Wave 1. That is why this is the urgent one of the four workshops.

platform:
  code: P11
  audience: public
  formFactor: web
  shortName: Accreditation Web
  name: Accreditation Web — Applications
  surface: public
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 8
  app: accreditation-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  deployment:
    target: browser
    distribution: public, served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: applicant device, unmanaged
    networkAssumption: public internet
    releaseCadence: monthly
  reachesOtherPlatforms:
  - screen: SCN-003
    platform: P07
    board: P07 Venue Scanner.dc.html#scn-003
    note: A steward scans an accreditation credential at a service gate — the same handheld, a different
      credential kind
  operator: public
  wireframeBoard: wireframes/P11 Accreditation Web.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
