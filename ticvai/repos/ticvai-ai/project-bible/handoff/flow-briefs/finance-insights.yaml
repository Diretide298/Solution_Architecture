      - out-of-scope data -> a narrower answer, not a refusal
      - nothing retrieved -> "I couldn't find that in your data."
      source: manager on BO-058 / EMP-020
    processing:
    - input: Grounded answer
      operations:
      - reporting#listReports
      - reporting#runReport
      - ai#sendAiMessage
      does: retrieval runs as the caller; answer cites sources; proposals are proposedAction, never applied
    - input: Save as report
      operations:
      - reporting#createReport
      does: the generated query is saved, not the answer
    outputs:
    - output: Answer
      states:
        streaming: tokens stream (server-sent events), then sources and any proposed action
        noSources: shown as a guess
        providersDown: reported, not retried indefinitely
      failure_branches:
      - what_goes_wrong: the operation behind this output fails (derived)
        user_sees: the error state names what failed and keeps what was entered (package error-state rule) (derived)
        recovery: retry (derived)
    - output: Figures consistency
      states:
        rule: >-
          Same-numbers rule (DEC-559, CHG-DOC-022; docs/active/block-test-strategy.md): the till day view POS-008, the back-office
          reports BO-058/BO-059 and Analytics P16 are windows onto one reporting area. For one scope, one period and one as-of
          time they show the same takings, gross sales excluding VAT and refunds; a frontend comparison test fails on any
          difference. Every figure carries its "as of" time; scope comes from the person's rights, never from a filter.
      failure_branches:
      - what_goes_wrong: the operation behind this output fails (derived)
        user_sees: the error state names what failed and keeps what was entered (package error-state rule) (derived)
        recovery: retry (derived)
    failure_branches:
    - at_step: 1
      what: The question needs data the manager may not see
      user_sees: >-
        Retrieval runs as the caller. The assistant sees exactly what that person could read directly, so the answer is narrower
        rather than refused.
      recovery: Automatic
    - at_step: 2
      what: Nothing relevant was retrieved
      user_sees: >-
        Says so rather than answering from general knowledge. A confident answer about a venue the model has never seen is
        the failure that stops people trusting it.
      recovery: Automatic
    - at_step: 2
      what: The answer proposes a change
      user_sees: >-
        A proposedAction, not an applied one. Pricing and financial proposals need approval before execution.
      recovery: Approver
    - at_step: 2
      what: Every provider is unavailable
      user_sees: Reported rather than retried indefinitely. An assistant that hangs is worse than one that says no.
      recovery: Automatic
    - at_step: 1
      what: The question contains guest personal data
      user_sees: >-
        Masked before the prompt leaves the platform. The masking list fails closed — an unset list sends nothing rather than
        everything.
      recovery: Automatic
    - at_step: 3
      what: The saved report returns different numbers tomorrow
      user_sees: >-
        Expected. It runs against the analytical replica and the data moved. The generated query is saved, not the answer,
        which is why the query is returned in the first place.
      recovery: Automatic
    steps:
    - frame: 1
      flowStep: 1
      screen: BO-058 Reporting Home
      block: later
      sees: Find the report rather than build it.
      does: Asks in plain language
      calls:
      - reporting#runReport
      - reporting#listReports
      result: Grounded in the tenant’s own data
    - frame: 2
      flowStep: 2
      screen: EMP-020 AI assistant — answer
      block: later
      sees: Answer with the operation behind it visible.
      does: The answer arrives with its sources
      calls:
      - ai#sendAiMessage
      result: An answer with no sources is a guess, and the interface shows it as one
    - frame: 3
      flowStep: 3
      screen: BO-058 Reporting Home
      block: later
      sees: Find the report rather than build it.
      does: Saves it as a report
      calls:
      - reporting#createReport
      result: A one-off question becomes schedulable
    exits:
    - completed
    - deferred
    - abandoned
    motion:
    - >-
      AI answer streams token by token (SSE for sendAiMessage: tokens, then sources, then any proposed action; decided 3 Oct).
    - Source chips appear after the text completes.
    decisions:
    - id: 3 Oct business rules
      says: stream answers; the full message is stored
    - id: DEC-559
      says: same numbers
    sources:
    - flows/F20
    open:
    - q: EMP-020 (step 2) is not Block A; the answer surface on BO-058 is.
      default: draw the answer on BO-058
