      trigger:
        description: The venue is closing and somebody has to know what was taken.
      steps:
      - frame: 1
        screen: POS-007
        screen_name: Close Shift
        block_a: true
        user_sees: >-
          The end of a cashier's shift: count the drawer blind, declare non-cash totals, give a reason if the count is off,
          and close.
        user_does: >-
          The shift closes on a blind count and settles (CHG-FIN-003). A supervisor closes or resolves it with their own PIN
          at any till of the venue (decided 2 October 2026, DEC-059, CHG-CSP-012).
        operations:
        - shift#submitShiftCount
        - shift#acceptShiftVariance
        - shift#listDenominations
        - shift#closeShift
        result: >-
          F32 walks this in detail; here it is the input to the day. A counted shift waiting for review is still an input
          to the day, shown as "Under review", not as missing.
      - frame: 2
        screen: POS-008
        screen_name: Reports
        block_a: true
        user_sees: >-
          How the day is going, seen from the terminal: the till's own sales, tenders, voids and refunds today, and the foreign-currency
          cash it took.
        user_does: The day is reported.
        operations:
        - reporting#runReport
        result: >-
          `runReport` with a definition, not a bespoke endpoint. `POS-008` declared `createReport` and `updateReport` until
          24 August — a till that could author report definitions.
        crosses_device: true
      - frame: 3
        screen: POS-009
        screen_name: Staff Roster
        block_a: true
        user_sees: >-
          Who is on duty right now, on which till, and their own clock: a supervisor sees the venue's staff on shift (role,
          till, shift times, status), and any staff member clocks in or out and starts or ends a break here — the v2 shift
          panel's …
        user_does: Staffing against takings is read.
        operations:
        - workforce#listRotaAssignments
        - shift#listShifts
        result: Takings per staffed hour is the number a venue manager actually wants, and it needs both sides.
        crosses_device: true
      - frame: 4
        screen: BO-043
        screen_name: Daily Reconciliation
        block_a: true
        user_sees: >-
          Finance proves each venue's day balances: every money source (till cash, card gateway settlements, bank, wallet)
          set against the ledger, with the differences named and the unmatched settlement lines to resolve.
        user_does: >-
          The daily cash reconciliation lists every shift of the day and resolves the ones still under review, one by one.
        operations:
        - shift#listShifts
        - shift#getShiftCountLines
        - shift#closeShift
        result: >-
          Daily per venue, shift by shift (decided 2 October 2026, Chinmay, batch 3 #1 and batch 6 #215; DEC-059, CHG-CSP-012).
          Each pending shift is accepted, sent back for a recount or closed by a supervisor with their PIN; the count lines
          are read note by note, never the expected figure first.
        crosses_device: true
      processing:
      - operation: shift#submitShiftCount
        what: The cashier's blind count, closing their own shift
        steps:
        - 1
        block_a: true
        writes: true
      - operation: shift#acceptShiftVariance
        what: Accept an over/short beyond the threshold
        steps:
        - 1
        block_a: true
        writes: true
      - operation: shift#closeShift
        what: Blind close-out
        steps:
        - 1
        - 4
        block_a: true
        writes: true
      - operation: reporting#runReport
        what: Run a report
        steps:
        - 2
        block_a: true
        writes: true
      - operation: workforce#listRotaAssignments
        what: The rota
        steps:
        - 3
        block_a: true
        offline_capable: true
      - operation: shift#listShifts
        what: List shifts
        steps:
        - 3
        - 4
        block_a: true
      - operation: shift#getShiftCountLines
        what: The denomination breakdown of a shift's counts
        steps:
        - 4
        block_a: true
  F98:
    title: A day is reconciled from takings to the ledger
    process: finance-insights
    trigger: >-
      Yesterday happened and the numbers have to agree: one venue-day of POS cash, gateway settlements, bank and wallet set
      against the ledger.
    actors:
      role: financeController
      apps:
      - P08
    inputs:
    - name: Day and venue
      formats:
      - date picker (yesterday default)
      - venue pick
      limits: one day, one venue; region time zone
      validation:
      - >-
        The file is for a different currency than the venue trades in -> Show both currencies and refuse to compute a difference
        that means nothing. (derived)
      - >-
        A file arrives for a day already reconciled -> A new batch; never overwrites the earlier one. (derived)
      source: finance controller on BO-043
    - name: Settlement file
      formats:
      - CSV
      - fixed width
      - XML
      - JSON (format picked when not detected)
      limits: >-
        provider (Stripe, Network International...), the day it covers; one file per upload; size limit not in the package
      validation:
      - parse fails -> status Failed with the reason and "Upload again"
      - file for a different currency -> both currencies shown; no difference computed
      - file for a day already reconciled -> a new batch, never overwrites
      source: finance controller on BO-043 (Ingest settlement file)
    - name: Resolve an exception
      formats:
      - 'outcome: Matched by hand / Write off / Dispute raised / Provider error / Timing difference'
      - note (required)
      - matching payment when matching by hand
      limits: note required
      validation:
      - 'no note -> "Add a note: who reads this next month needs the reason"'
      source: BO-043
    - name: Filters
      formats:
      - provider pick list
      - status pick list
      limits: not free text (design-note correction)
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      source: BO-043
    - name: Account and mapping edits
      formats:
      - account code, type, ERP code
      - event -> debit/credit per venue
      limits: see F16
      validation:
      - row removed -> "Refunds will post to suspense"
      source: BO-074, BO-075
    processing:
    - input: Settlement file
      operations:
      - finance#ingestSettlementFile
      - finance#listSettlements
      - finance#getSettlement
      does: >-
        ingest, parse, match, classify, auto-resolve in the background; Ingesting -> Parsing -> Matching -> Matched / Has
        exceptions; fees shown apart from shortfalls
    - input: Exceptions
      operations:
      - finance#listSettlementExceptions
      - finance#resolveSettlementException
      does: >-
        only genuine mismatches reach a person; closes with who and why; batch Resolved when none open; a found chargeback
        goes to BO-025
    - input: Ledger
      operations:
      - finance#listLedgerEntries
      - finance#getTrialBalance
      does: postings behind a figure, read-only
    - input: Sources side by side
      operations:
      - finance#getUnifiedReconciliation (not Block A)
      does: POS cash, each gateway, bank, wallet and ledger with totals; each variance names its two sources
    outputs:
    - output: Sources against the ledger
      states:
        balanced: '"Balanced" in words'
        variance: '"gateway against ledger: AED 500.00 short - likely cause: 3 refunds settled next day"'
        notAvailable: 'getUnifiedReconciliation is not in Block A: panel drawn, marked later'
      failure_branches:
      - what_goes_wrong: the operation behind this output fails (derived)
        user_sees: the error state names what failed and keeps what was entered (package error-state rule) (derived)
        recovery: retry (derived)
    - output: Settlement batch row
      states:
        Ingesting: progress
        Parsing: progress
        Matching: progress
        Matched: green
        Has exceptions: count of open exceptions
        Failed: reason + Upload again
        Resolved: none open
      failure_branches:
      - what_goes_wrong: Failed state
        user_sees: reason + Upload again
        recovery: Retry; nothing entered is lost (derived)
    - output: Figures consistency
      states:
        rule: >-
          BO-1081 finance dashboard shows the same variance figures; BO-090 "Settlements reconciled" close check uses the
          same counts. Every figure shows its "as of" time (lag-tolerant reporting copy); a stale or partial figure says so
          instead of showing a total.
      failure_branches:
      - what_goes_wrong: the operation behind this output fails (derived)
        user_sees: the error state names what failed and keeps what was entered (package error-state rule) (derived)
        recovery: retry (derived)
    - output: BO-043 Daily Reconciliation
      states:
        loading: The daily reconciliation list.
        error: Could not load. Names which read failed and leaves the daily reconciliation untouched.
        emptyFirstRun: >-
          No daily reconciliation yet. Offers no create action — this screen declares no operation that makes one — and says
          so rather than showing an empty tab ...
        emptyNoResults: >-
          Nothing matches the filter on providerName, status and the daily reconciliation are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks LEDGER_VIEW, which getTrialBalance requires to show this screen, and names that permission
          (the screen's other reads need ...
      failure_branches:
      - at_step: 1
        what: The acting principal lacks the permission at this scope.
        user_sees: >-
          Refused at the first step, not the last. ADR-0002 makes authorisation user-driven — a person who gets three steps
          in and then cannot finish has been told the wrong thing.
        recovery: resolvePermissions
    - output: BO-074 Chart of Accounts
      states:
        loading: The chart accounts list.
        error: Could not load. Names which read failed and leaves the chart accounts untouched.
        emptyFirstRun: >-
          No chart accounts yet. Offers Create account (createAccount); distinct from a filter that matched nothing.
        emptyNoResults: >-
          Nothing matches the filter on legalEntityId, type, isPostable and the chart accounts are still there. Names the
          active filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccounts requires to show this screen, and names that permission.
      failure_branches:
      - what_goes_wrong: error state on BO-074
        user_sees: Could not load. Names which read failed and leaves the chart accounts untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-074
        user_sees: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccounts requires to show this screen, and names that permission.
        recovery: Ask an administrator for the permission the state names (derived)
    - output: BO-075 Account Mapping
      states:
        loading: The account mapping figures; each tile loads on its own.
        error: Could not load. Names which read failed and leaves the account mapping untouched.
        emptyFirstRun: No account mapping yet. Offers Create tax code (createTaxCode).
        emptyNoResults: >-
          Never shown: listAccountMappings takes no filter, so an empty list is always the first-run state above.
        emptyNoAccess: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccountMappings requires to show this screen, and names that
          permission.
      failure_branches:
      - what_goes_wrong: error state on BO-075
        user_sees: Could not load. Names which read failed and leaves the account mapping untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-075
        user_sees: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccountMappings requires to show this screen, and names that
          permission.
        recovery: Ask an administrator for the permission the state names (derived)
    steps:
    - frame: 1
      screen: BO-043 Daily Reconciliation
      sees: >-
        day + venue; sources against the ledger; Shifts of the day; settlement batches; exceptions (open first); month view
      does: picks Tue 29 Sep, Aquaventure Waterpark
      calls:
      - finance#listSettlements
      - shift#listShifts
      result: 'POS cash AED 8,460.00 deposited vs 8,480.00 expected: short AED 20.00'
    - frame: 2
      screen: BO-043 Daily Reconciliation (upload)
      sees: 'Ingest settlement file dialog: provider, day, file, format'
      does: uploads the Network International file
      calls:
      - finance#ingestSettlementFile
      result: batch row appears and advances Ingesting -> Parsing -> Matching -> Has exceptions
    - frame: 3
      screen: BO-043 Daily Reconciliation (exception)
      sees: Amount differs - ref NI-88231907 - AED 449.00 against AED 499.00
      does: resolves as Timing difference with a note
      calls:
      - finance#listSettlementExceptions
      - finance#resolveSettlementException
      result: exception closed with who and why; batch Resolved when none open
    - frame: 4
      screen: BO-043 Daily Reconciliation (ledger)
      sees: Open ledger entries for a figure
      does: reads the postings
      calls:
      - finance#listLedgerEntries
      result: read-only postings for that day
    - frame: 5
      screen: BO-074 Chart of Accounts
      sees: account tree per legal entity, suspense balance banner
      does: checks the over/short and suspense accounts
      calls:
      - finance#getAccount (not Block A)
      result: nothing unmapped left in suspense, or the banner names the events
    - frame: 6
      screen: BO-075 Account Mapping
      sees: event -> debit / credit per venue
      does: maps a missing event
      calls:
      - finance#setAccountMappings (not Block A)
      result: future postings leave suspense
    exits:
    - completed
    - refused
    motion:
    - >-
      Batch status advances through Ingesting, Parsing, Matching to Matched / Has exceptions; the page updates when matching
      finishes (no reload).
    - Resolved exceptions collapse out of the open list.
    decisions:
    - id: CHG-FIN-009, DEC-215
      says: daily per venue plus month view
    - id: 'answers batch 6 #212-213'
      says: daily per venue; settlement postings automatic when fully matched
    - id: DEC-059
      says: the daily cash reconciliation resolves each shift
    sources:
    - handoff/design-notes/finance-insights.yaml#BO-043
    - >-
      contracts/spine/finance.yaml#ingestSettlementFile, #resolveSettlementException, #getUnifiedReconciliation
    - R110
    - DI-268
    - DI-275
    - DI-258
    - flows/F98
    - ADR-0002
    open:
    - q: >-
        getUnifiedReconciliation (the side-by-side sources read) is not a Block A operation and not declared on BO-043.
      default: draw the panel; mark it later; flag to the lead
    - q: Settlement file size and row limits are not in the package.
      default: 20 MB per file
    - q: The trial balance on a daily screen (design-note correction).
      default: leave it off the daily view; it lives on BO-090
    - q: BO-076 (step 4, revenue recognition) is not Block A.
      default: later frame
  F13:
    title: Month end closes
    process: finance-insights
    trigger: The month has ended and the books must be closed before anyone reports on them.
    actors:
      role: financeController
      apps:
      - P08 Venue Management
    inputs:
    - name: Legal entity and period
      formats:
      - 'entity switcher; periods by year: Open / Closing / Closed'
      limits: periods follow the entity fiscal year
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      source: BO-090
    - name: Abandon or reopen reason
      formats:
      - text
      limits: required
      validation:
      - empty -> "Give a reason"
      source: BO-090
    - name: Journal entry
      formats:
      - open period, posting date, description 3-500, reference, at least two lines
      limits: approver is never the preparer; LEDGER_APPROVE needs MFA
      validation:
      - period closing -> "Period is closing; choose an open period"
      - own entry -> "Waiting for another approver"
      source: BO-089 (not Block A)
    processing:
    - input: Close
      operations:
      - finance#listFiscalPeriods (not Block A)
      - finance#getTrialBalance
      - finance#beginPeriodClose
      - finance#closeFiscalPeriod (not Block A)
      does: >-
        seven close checks; open shifts and unresolved settlement exceptions block; sales during closing post to the next
        period
    outputs:
    - output: Close checks
      states:
        blocking: each blocker named with a link (Under-review shift -> BO-043/BO-040, open exception -> BO-043)
        pending: FX revaluation shown pending, not passed
        restated: banner when a closed period is reopened
      failure_branches:
      - what_goes_wrong: pending state
        user_sees: FX revaluation shown pending, not passed
        recovery: Follow the action the state offers (derived)
    failure_branches:
    - at_step: 1
      what: An open shift in the period
      user_sees: >-
        The close blocks. A shift with an uncounted drawer is a cash figure nobody has confirmed, and closing over it books
        a number that will change.
      recovery: Venue manager
    - at_step: 1
      what: A settlement exception is unresolved
      user_sees: Blocks. The gateway says one figure and the ledger says another, and closing picks one arbitrarily.
      recovery: Finance
    - at_step: 3
      what: A journal needs approval and the approver is away
      user_sees: >-
        approvals delegation. This is why delegation is time-bounded — a month end waiting on someone on leave is the case
        it exists for.
      recovery: Delegate
    - at_step: 4
      what: A sale arrives after the period began closing
      user_sees: >-
        Posts to the next period automatically with a reference to the date. It is not rejected — a guest buying a ticket
        does not care that finance is closing.
      recovery: Automatic
    - at_step: 5
      what: The trial balance does not balance
      user_sees: >-
        Stops. The close is abandoned, the period reopens for posting, and the difference is investigated. Closing an unbalanced
        period moves the problem rather than solving it.
      recovery: Finance controller
    - at_step: 6
      what: A correction is needed after closing
      user_sees: >-
        reopenPeriod, which requires approval and is recorded. Or a reversal in the current period, which is usually right
        — reopening a closed period invalidates every report already issued from it.
      recovery: Finance controller
    - at_step: 2
      what: FX revaluation is pending
      user_sees: Inter-entity obligations in a foreign currency must be revalued before the balance means anything.
      recovery: Automatic
    steps:
    - frame: 1
      flowStep: 1
      screen: BO-090 Period Close
      block: later
      sees: Close a fiscal period, and see what is stopping it.
      does: Opens the period and sees what is blocking
      calls:
      - finance#listFiscalPeriods (not Block A)
      - finance#getTrialBalance
      result: Unposted journals, open shifts, unreconciled settlements — each named
    - frame: 2
      flowStep: 2
      screen: BO-040 Variance Approval
      block: later
      sees: See which tills are waiting for a variance to be accepted at the till, and which were.
      does: Clears outstanding shift variances
      calls:
      - shift#listShifts
      result: A shift left open in the period blocks the close
    - frame: 3
      flowStep: 3
      screen: BO-089 Journal Entries
      block: later
      sees: Every posting, and the ones waiting for approval.
      does: Posts the remaining journals
      calls:
      - finance#listJournalEntries (not Block A)
      - finance#approveJournalEntry (not Block A)
      result: Accruals, adjustments, corrections
    - frame: 4
      flowStep: 4
      screen: BO-090 Period Close
      block: later
      sees: Close a fiscal period, and see what is stopping it.
      does: Begins the close
      calls:
      - finance#beginPeriodClose
      result: >-
        The period stops accepting postings. Sales continue — the period is a ledger boundary, not a trading one
    - frame: 5
      flowStep: 5
      screen: BO-090 Period Close
      block: later
      sees: Close a fiscal period, and see what is stopping it.
      does: Reviews the trial balance
      calls:
      - finance#getTrialBalance
      result: It balances, or the close does not proceed
    - frame: 6
      flowStep: 6
      screen: BO-090 Period Close
      block: later
      sees: Close a fiscal period, and see what is stopping it.
      does: Closes
      calls:
      - finance#closeFiscalPeriod (not Block A)
      result: Locked. Later corrections post to the next period with a reference
    exits:
    - completed
    - deferred
    - escalated
    motion: none
    decisions:
    - ids:
      - CHG-WIR-008
      - R080
    sources:
    - flows/F13
    open:
    - q: >-
        listFiscalPeriods and closeFiscalPeriod are not Block A while beginPeriodClose and getTrialBalance are.
      default: draw the close as later beyond "Begin close"
  F107:
    title: A report is defined, scheduled and delivered
    process: finance-insights
    trigger: Somebody wants the same numbers every Monday without asking for them.
    actors:
      role: venueManager
      apps:
