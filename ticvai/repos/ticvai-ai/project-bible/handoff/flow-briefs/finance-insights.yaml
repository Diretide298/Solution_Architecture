  F20:
    title: A manager asks a question and gets an answer
    process: finance-insights
    trigger: A venue manager wants to know something the platform knows and does not want to find the report.
    actors:
      role: venueManager
      apps:
      - P08 Venue Management
      - P06 Venue Staff App
