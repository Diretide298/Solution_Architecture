process: finance-insights
title: 'Flow design briefs, Block A: Finance, Ledger & Tax, Reporting & Analytics'
written: 2026-10-03, finance-insights brief agent
cross_cutting:
  same_numbers: >-
    Same-numbers rule (DEC-559, CHG-DOC-022; docs/active/block-test-strategy.md): the till day view POS-008, the back-office
    reports BO-058/BO-059 and Analytics P16 are windows onto one reporting area. For one scope, one period and one as-of
    time they show the same takings, gross sales excluding VAT and refunds; a frontend comparison test fails on any difference.
    Every figure carries its "as of" time; scope comes from the person's rights, never from a filter.
  as_of: >-
    Every figure shows its "as of" time (lag-tolerant reporting copy); a stale or partial figure says so instead of showing
    a total.
  money: >-
    base currency of the region; AED 2 decimals; BHD/KWD/OMR 3 decimals never rounded away; one figure per currency, never
    a cross-currency sum
scope:
  rule: >-
    Block A = builds of the tickets under BLOCK-A in handoff/service-docs/op-release.json; a flow belongs to the process
    of its trigger screen.
  covered:
  - F74
  - F98
  - F13
  - F107
  - F20
  - F303
  - F82
  - F99
  - F106
  - F145
  - F176
  - F180
  note_F74: >-
    assigned here by the lead (day report + daily cash reconciliation); fnb-retail may claim it by entry screen POS-007
  skipped:
  - flows:
    - F175
    - F177
    - F178
    - F179
    - F262
    reason: no step touches a Block A screen or operation
flows:
  F74:
    title: A shift closes and the day is reported
    process: finance-insights
    trigger: >-
      The venue is closing and somebody has to know what was taken: every till's shift is counted blind, the day is reported
      on the till, and the next morning the daily cash reconciliation resolves each shift.
    actors:
      roles:
      - cashier (blind count)
      - supervisor (PIN; OVERSHORT_ACCEPT, SHIFT_CLOSE_OTHER)
      - venue manager
      - finance controller
      apps:
      - P04 Venue POS (POS-007, POS-008, POS-009)
      - P08 Venue Management (BO-043)
    note: >-
      Assigned to finance-insights by the lead (the day report and the daily cash reconciliation are finance); by its entry
      screen POS-007 the fnb-retail brief may also claim it: dedupe on merge. The till side of the close is drawn in full
      in platform-foundation.yaml F32.
    inputs:
    - name: Blind closing count
      formats:
      - per denomination, drawer order
      - declared non-cash totals per tender
      limits: no expected, no variance, no takings shown to the cashier (CHG-FIN-003)
      validation:
      - open orders -> close refused, each listed
      - offline -> "Closing needs a connection."
      source: cashier on POS-007
    - name: Day report period and scope
      formats:
      - Today (default) / This shift
      - My sales / This terminal / This outlet (only scopes the role may read; hidden, not greyed)
      limits:
      - a cashier cannot widen it; a supervisor may pick a past day for this terminal
      - between allowed views
      validation:
      - >-
        offline -> "Reports need a connection. Your sales are safe and will sync." (no figures from the local journal)
      - outlet with a till still open -> "2 tills still open" instead of a partial total
      - >-
        Today (default) or "This shift". A cashier cannot widen it; a supervisor may pick a past day for this terminal.
      - >-
        Shows only the scopes the signed-in role may read; hidden, not greyed. The server already limits what a role sees;
        the control only switches between allowed views.
      source:
      - POS-008
      - venueManager on POS-008 Reports
      also_named:
      - Period
      - Scope (My sales / This terminal / This outlet)
      ref: >-
        DI-181 | contracts/satellite/reporting.yaml#runReport | DI-802 | DI-387 | contracts/shared/permissions.yaml#/components/schemas/Permission
    - name: Reconciliation day and venue
      formats:
      - date (yesterday by default)
      - venue pick (only venues in Session.scope)
      limits: midnight to midnight in the region's time zone; one venue-day is the unit of sign-off (CHG-FIN-009)
      validation:
      - >-
        The file is for a different currency than the venue trades in -> Show both currencies and refuse to compute a difference
        that means nothing. (derived)
      - >-
        A file arrives for a day already reconciled -> A new batch; never overwrites the earlier one. (derived)
      - >-
        One day (yesterday by default) and one venue; the day runs midnight to midnight in the region's time zone.
      source:
      - finance on BO-043
      - venueManager on BO-043 Daily Reconciliation
      also_named:
      - Day and venue
      ref: R110 | contracts/spine/finance.yaml#/components/schemas/Settlement
    - name: Supervisor decision on a shift (BO-043 or any till)
      formats:
      - supervisor PIN in body supervisorStepUp
      - reason 3-500 characters
      limits: >-
        the supervisor must not be the cashier; refused without the step-up (RUL-1, RUL-2, CHG-RUL-019); venue scope, any
        till or BO-043
      validation:
      - 'no step-up / wrong PIN -> 403 supervisor-step-up-refused: "That PIN was not accepted."'
      - own shift -> "A different supervisor must accept this."
      - 'already decided -> 409: the row refreshes to who decided and how'
      - reject without reason -> "Tell the cashier why you want a recount"
      source: the supervisor (OVERSHORT_ACCEPT; SHIFT_CLOSE_OTHER to close a still-open shift)
    - name: Question to the assistant
      screen: POS-008
      validation: >-
        Free text. Answered only within the person's role; if the question needs data they cannot see, the answer is narrower,
        not refused outright. Asks back when the period or measure is missing.
      source: venueManager on POS-008 Reports
      ref: DI-964 | DI-712 | F20 step 1
      formats:
      - text field (derived)
      limits:
      - only within the person's role (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Clock in / out, Start / End break
      screen: POS-009
      validation: >-
        One tap each; device time recorded and queued offline; at a venue that requires it, the access point or location is
        captured.
      source: venueManager on POS-009 Staff Roster
      ref: contracts/satellite/workforce.yaml#recordAttendance | POSV2-3
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Upload settlement file
      screen: BO-043
      formats:
      - CSV
      - JSON
      validation: >-
        Provider (Stripe, Network International…), the day it covers, the file, and its format (CSV, fixed width, XML, JSON)
        if not detected. Parsing runs in the background; the row shows Ingesting, Parsing, Matching, then Matched or Has exceptions.
      source: venueManager on BO-043 Daily Reconciliation
      ref: >-
        contracts/spine/finance.yaml#ingestSettlementFile | contracts/spine/finance.yaml#/components/schemas/SettlementStatus
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Resolve an exception
      screen: BO-043
      validation: >-
        Outcome (Matched by hand, Write off, Dispute raised, Provider error, Timing difference), a required note, and the
        matching payment when matching by hand.
      source: venueManager on BO-043 Daily Reconciliation
      ref: >-
        contracts/spine/finance.yaml#/components/schemas/SettlementResolution | contracts/spine/finance.yaml#resolveSettlementException
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - screen: POS-007
      see: platform-foundation#F32
      note: inputs of this screen are detailed once, in that flow
    processing:
    - input: Blind count
      operations:
      - shift#submitShiftCount
      does: >-
        expected and variance computed on the server; beyond shiftVarianceThreshold the shift is pendingVariance and supervisors
        are alerted
    - input: Day report
      operations:
      - reporting#runReport
      does: >-
        runs a seeded definition for the till scope; a till runs reports, never authors them; figures come from the reporting
        copy with an as-of time
    - input: Staffing against takings
      operations:
      - workforce#listRotaAssignments
      - shift#listShifts
      does: takings per staffed hour
    - input: Daily cash reconciliation
      operations:
      - shift#listShifts
      - shift#getShiftCountLines
      - shift#acceptShiftVariance
      - shift#rejectShiftVariance
      - shift#closeShift
      does: >-
        lists every shift of the venue-day with status; a shift still open is closed by a supervisor (closeShift, PIN), an
        Under-review shift is accepted (posts over/short to the over/short account, boxes reconciled) or sent back for a recount;
        count lines read note by note before any expected figure
    - operation: shift#listDenominations
      what: The notes and coins a till counts
      steps:
      - 1
      block_a: true
      offline_capable: true
    outputs:
    - output: Day report (POS-008)
      states:
        loading: skeleton tiles
        ready: takings, gross sales excl. VAT, refunds with "as of 22:41"
        partial: '"2 tills still open": no total presented as the day'
        deferred: reported with shifts "Under review" marked, not missing
        offline: '"Reports need a connection."'
        emptyNoAccess: names REPORT_VIEW_* missing
        error: Could not load. Names which read failed and leaves the reports untouched.
        emptyFirstRun: >-
          No reports yet. Offers no create action — this screen declares no operation that makes one — and says so rather
          than showing an empty table.
        emptyNoResults: >-
          Nothing matches the filter on category, search and the reports are still there. Names the active filter and offers
          to clear it.
      failure_branches:
      - at_step: 2
        what: A till has not closed yet.
        user_sees: >-
          The day report says so rather than reporting a partial figure as a total. A number that quietly excludes a lane
          is worse than a number that is late.
        recovery: listShifts
      - screen: POS-008
        what_goes_wrong: Offline
        user_sees: >-
          "Reports need a connection. Your sales are safe and will sync." No figures from the terminal's local journal: they
          would disagree with the back office.
      - screen: POS-008
        what_goes_wrong: Another till at the outlet has not closed yet (outlet scope)
        user_sees: >-
          The day view says so ("2 tills still open") rather than presenting a partial figure as the day's total.
      - screen: POS-008
        what_goes_wrong: A three-decimal currency venue
        user_sees: All amounts at three decimals (BHD 1,284.375); never rounded to two.
      - screen: POS-008
        what_goes_wrong: A cashier asks the assistant for venue revenue
        user_sees: The answer covers only what they may see ("Your sales today were AED 6,240.00").
      shows:
      - element: Headline tiles
        rule: >-
          Gross sales, transactions, average basket, voids and refunds (count and value). Each tile carries "as of HH:MM".
          Labels follow the process vocabulary: "Gross sales", not "Revenue".
      - element: Sales mix
        rule: By line of business (Tickets, Food & drink, Retail, Other) and by hour. Bars start at zero.
      - element: Tenders
        rule: >-
          Cash, card, wallet, gift card and foreign currency. Foreign currency shows the amount taken in that currency and
          its AED equivalent at the rate applied; only the AED figure adds to totals.
      - element: Expected cash in drawer
        rule: Never shown to a cashier. Supervisors see it on the shift close and POS-020, not here.
      - element: Top products
        rule: Units, sales and share for this terminal; at most ten rows.
      package_states:
        loading: The reports list.
        emptyNoAccess: >-
          Shown when the caller holds neither REPORT_VIEW_OWN (a cashier's own figures) nor REPORT_VIEW_WORKSTATION (this
          terminal's, for a supervisor), and names them. Never the venue-wide …
        offline: >-
          Not available. Reporting reads the analytical replica (ADR-0016) and a terminal-local figure would disagree with
          the back office
      also_named:
      - Reports
    - output: Shifts of the day (BO-043)
      states:
        open: 'still open: Close shift (supervisor PIN)'
        pendingVariance: 'Under review: Accept variance / Reject and recount'
        recountRequested: waiting for the cashier's new count
        closed: closed within threshold
        closedWithVariance: accepted, with who and the reason
        allResolved: '"Every shift of Tue 29 Sep is resolved"'
        loading: The daily reconciliation list.
        error: Could not load. Names which read failed and leaves the daily reconciliation untouched.
        emptyFirstRun: >-
          No daily reconciliation yet. Offers no create action — this screen declares no operation that makes one — and says
          so rather than showing an empty table.
        emptyNoResults: >-
          Nothing matches the filter on providerName, status and the daily reconciliation are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks `LEDGER_VIEW`, which `getTrialBalance` requires to show this screen, and names that
          permission (the screen's other reads need …
      failure_branches:
      - at_step: 4
        what: The supervisor does not accept the count.
        user_sees: >-
          Sent back for a recount, not reopened for trading (decided 2 October 2026, batch 6 #175, BO-040: "Add Reject + recount
          (DI-804)"; CHG-CSP-013).
        recovery: rejectShiftVariance, then the cashier's submitShiftCount
      - at_step: 4
        what: A shift is still under review when the day is reported.
        user_sees: >-
          The day report names it as under review rather than leaving it out. Its counted figure is in the day; its variance
          is pending until the reconciliation resolves it.
        recovery: Supervisor, in the daily cash reconciliation (BO-043)
      - screen: BO-043
        what_goes_wrong: The file is for a different currency than the venue trades in
        user_sees: Show both currencies and refuse to compute a difference that means nothing.
      - screen: BO-043
        what_goes_wrong: A file arrives for a day already reconciled
        user_sees: A new batch; never overwrites the earlier one.
      - screen: BO-043
        what_goes_wrong: Parsing fails
        user_sees: Status Failed with the reason and an "Upload again" action.
      - screen: BO-043
        what_goes_wrong: Exceptions still open at month end
        user_sees: They block the period close; the close screen links back here.
      shows:
      - element: Sources against the ledger
        rule: >-
          One row per source (POS cash, each gateway, bank, wallet, ledger) with its total and count, and below them each
          variance with the two sources it lies between, the amount and the likely cause. A day with no variance says "Balanced"
          in words.
      - element: Settlement batches
        rule: >-
          Provider, day, status, lines, matched, exceptions, provider gross, fees, net, ledger gross, difference. Differences
          in red with sign; fees shown separately so fees are never mistaken for a shortfall.
      - element: Exceptions
        rule: >-
          Kind in words (In provider file but not in our records; In our records but not in the file; Amount differs; Duplicate
          in file; Fee not explained), provider reference, amount against expected. Open first.
      - element: Cash
        rule: >-
          Expected against deposited per till and the over/short, which posts to the over/short account visible at month end.
      also_named:
      - Daily Reconciliation
    - output: Figures consistency
      states:
        rule: >-
          Same-numbers rule (DEC-559, CHG-DOC-022; docs/active/block-test-strategy.md): the till day view POS-008, the back-office
          reports BO-058/BO-059 and Analytics P16 are windows onto one reporting area. For one scope, one period and one as-of
          time they show the same takings, gross sales excluding VAT and refunds; a frontend comparison test fails on any
          difference. Every figure carries its "as of" time; scope comes from the person's rights, never from a filter.
      failure_branches:
      - what_goes_wrong: the operation behind this output fails (derived)
        user_sees: the error state names what failed and keeps what was entered (package error-state rule) (derived)
        recovery: retry (derived)
    - output: POS-007 Close Shift
      states:
        loading: The close shift list.
        error: Could not load. Names which read failed and leaves the close shift untouched.
        emptyFirstRun: Nothing is waiting, which is the good outcome. An empty queue means every item has been decided;
        emptyNoResults: >-
          Never shown: listCashMovements takes no filter, so an empty list is always the first-run state above.
        emptyNoAccess: >-
          Shown when the caller lacks SHIFT_OPEN, which getCurrentShift requires to show this screen, and names that permission
          (the screen's other reads need R ...
        offline: Cannot close. Closing requires the server total, and a locally computed variance is not a variance
        denied: >-
          acceptShiftVariance was refused: the caller lacks OVERSHORT_ACCEPT at this venue, or is the cashier whose shift
          it is.
        pendingVariance: Counted; "Under review". submitShiftCount answered referredToSupervisor.
        recountRequested: >-
          "Recount requested". A supervisor rejected the variance (rejectShiftVariance) with a reason the cashier reads;
      failure_branches:
      - at_step: 1
        what: The count is over the variance threshold and no supervisor is at the till.
        user_sees: >-
          The cashier signs out and the shift waits as "Under review" (decided 2 October 2026, Chinmay, batch 3 #1, POS-007:
          "The cashier may sign out, and the shift stays pending until the supervisor accepts.
        recovery: Supervisor, with acceptShiftVariance or closeShift (supervisor PIN), on POS-007 or BO-043
    - output: POS-008 Reports
      states:
        loading: The reports list.
        error: Could not load. Names which read failed and leaves the reports untouched.
        emptyFirstRun: >-
          No reports yet. Offers no create action — this screen declares no operation that makes one — and says so rather
          than showing an empty table.
        emptyNoResults: >-
          Nothing matches the filter on category, search and the reports are still there. Names the active filter and offers
          to clear it.
        emptyNoAccess: >-
          Shown when the caller holds neither REPORT_VIEW_OWN (a cashier's own figures) nor REPORT_VIEW_WORKSTATION (this
          terminal's, for a supervisor), and nam ...
        offline: >-
          Not available. Reporting reads the analytical replica (ADR-0016) and a terminal-local figure would disagree with
          the back office
      failure_branches:
      - what_goes_wrong: error state on POS-008
        user_sees: Could not load. Names which read failed and leaves the reports untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on POS-008
        user_sees: >-
          Shown when the caller holds neither REPORT_VIEW_OWN (a cashier's own figures) nor REPORT_VIEW_WORKSTATION (this
          terminal's, for a supervisor), and nam ...
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on POS-008
        user_sees: >-
          Not available. Reporting reads the analytical replica (ADR-0016) and a terminal-local figure would disagree with
          the back office
        recovery: Reconnect; the screen picks up where it was (derived)
    - output: POS-009 Staff Roster
      states:
        loading: The staff roster list.
        error: Could not load. Names which read failed and leaves the staff roster untouched.
        emptyFirstRun: Nothing is waiting, which is the good outcome. An empty queue means every item has been decided;
        emptyNoResults: >-
          Nothing matches the filter on workstationId, status, openedFrom, openedTo and the staff roster are still there.
        emptyNoAccess: >-
          Shown when the caller lacks REPORT_VIEW_WORKSTATION, which listShifts requires to show this screen, and names that
          permission (the screen's other read ...
        offline: Last known roster, with its age shown
      failure_branches:
      - what_goes_wrong: error state on POS-009
        user_sees: Could not load. Names which read failed and leaves the staff roster untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on POS-009
        user_sees: >-
          Shown when the caller lacks REPORT_VIEW_WORKSTATION, which listShifts requires to show this screen, and names that
          permission (the screen's other read ...
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on POS-009
        user_sees: Last known roster, with its age shown
        recovery: Reconnect; the screen picks up where it was (derived)
      - screen: POS-009
        what_goes_wrong: Clock-out with no clock-in, or a second clock-in
        user_sees: Refused and reported as out of sequence, not silently corrected.
      - screen: POS-009
        what_goes_wrong: Offline
        user_sees: Last known roster with its age; clock actions queue with device time.
      shows:
      - element: Roster
        rule: >-
          Rows: staff name, role, till, rota time, attendance (on duty / on break / not clocked in), shift status (Open, Suspended,
          Waiting for supervisor). Sorted by till. A cashier without the view permission sees only themselves.
      - element: My shift
        rule: Start time, elapsed time and breaks taken today. No takings and no expected cash.
      package_states:
        emptyFirstRun: >-
          Nothing is waiting, which is the good outcome. An empty queue means every item has been decided; it offers no create
          action, because creating work is not what it needs.
        emptyNoResults: >-
          Nothing matches the filter on workstationId, status, openedFrom, openedTo and the staff roster are still there.
          Names the active filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks `REPORT_VIEW_WORKSTATION`, which `listShifts` requires to show this screen, and names
          that permission (the screen's other reads need `WORKFORCE_VIEW` …
    - output: BO-043 Daily Reconciliation
      states:
        loading: The daily reconciliation list.
        error: Could not load. Names which read failed and leaves the daily reconciliation untouched.
        emptyFirstRun: >-
          No daily reconciliation yet. Offers no create action — this screen declares no operation that makes one — and says
          so rather than showing an empty tab ...
        emptyNoResults: >-
          Nothing matches the filter on providerName, status and the daily reconciliation are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks LEDGER_VIEW, which getTrialBalance requires to show this screen, and names that permission
          (the screen's other reads need ...
      failure_branches:
      - what_goes_wrong: error state on BO-043
        user_sees: Could not load. Names which read failed and leaves the daily reconciliation untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-043
        user_sees: >-
          Shown when the caller lacks LEDGER_VIEW, which getTrialBalance requires to show this screen, and names that permission
          (the screen's other reads need ...
        recovery: Ask an administrator for the permission the state names (derived)
    - name: Flow outcome (exit states)
      states:
        reported: All tills closed, day reported.
        partial: Incomplete and labelled as such.
        deferred: >-
          Reported, with one or more shifts "Under review" until the daily reconciliation resolves them (DEC-059).
      failure_branches:
      - at_step: 2
        what_goes_wrong: A till has not closed yet.
        user_sees: >-
          The day report says so rather than reporting a partial figure as a total. A number that quietly excludes a lane
          is worse than a number that is late.
        recovery: high; resolved by shift#listShifts
      - at_step: 1
        what_goes_wrong: The count is over the variance threshold and no supervisor is at the till.
        user_sees: >-
          The cashier signs out and the shift waits as "Under review" (decided 2 October 2026, Chinmay, batch 3 #1, POS-007:
          "The cashier may sign out, and the shift stays pending until the supervisor accepts. That must not stop the next
          cashier starting a shift"; DEC-059, CHG-CSP-012, DI-805). The shift is `pendingVariance` with its own deposit box
          and count; `openShift` refuses only while a shift is `open` or `suspended`, …
        recovery: >-
          requiresStaff; resolved by Supervisor, with acceptShiftVariance or closeShift (supervisor PIN), on POS-007 or BO-043
          (not in contracts)
      - at_step: 4
        what_goes_wrong: The supervisor does not accept the count.
        user_sees: >-
          Sent back for a recount, not reopened for trading (decided 2 October 2026, batch 6 #175, BO-040: "Add Reject + recount
          (DI-804)"; CHG-CSP-013). The shift stays `pendingVariance` and the cashier sees "Recount requested" rather than
          "Under review", recounts at any till of the venue and resubmits with `submitShiftCount`. Still blind: the rejection
          carries the reason, never the expected figure.
        recovery: >-
          requiresStaff; resolved by rejectShiftVariance, then the cashier's submitShiftCount (not in contracts)
      - at_step: 4
        what_goes_wrong: A shift is still under review when the day is reported.
        user_sees: >-
          The day report names it as under review rather than leaving it out. Its counted figure is in the day; its variance
          is pending until the reconciliation resolves it.
        recovery: recoverable; resolved by Supervisor, in the daily cash reconciliation (BO-043) (not in contracts)
      merged: merged from the fnb-retail brief (3 Oct)
    - screen: POS-007
      see: platform-foundation#F32
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: POS-007 Close Shift
      sees: denomination counter, no expected
      does: cashier counts and submits
      calls:
      - shift#listDenominations
      - shift#submitShiftCount
      result: '"Shift closed" or "Your count is with your supervisor" (Under review)'
    - frame: 2
      screen: POS-008 Reports
      sees: 'Today / This terminal tiles: takings, gross sales excl. VAT, refunds, each with "as of"'
      does: supervisor reads the day for the terminal
      calls:
      - reporting#runReport
      result: >-
        figures equal BO-058/BO-059 and P16 for the same scope, period and as-of (DEC-559); "2 tills still open" if any is
    - frame: 3
      screen: POS-009 Staff Roster
      sees: who was on duty, per terminal
      does: reads takings against staffed hours
      calls:
      - workforce#listRotaAssignments
      - shift#listShifts
      result: takings per staffed hour
    - frame: 4
      screen: BO-043 Daily Reconciliation (shifts tab)
      sees: 'Shifts of the day: till, cashier, status chip, counted (supervisor only), expected, variance'
      does: finance opens yesterday for Aquaventure Waterpark
      calls:
      - shift#listShifts
      result: every shift listed; Under-review ones first
    - frame: 5
      screen: BO-043 Daily Reconciliation (resolve one)
      sees: >-
        Count by denomination for the selected shift, note by note; then expected and variance after the supervisor PIN
      does: supervisor enters PIN and reason; Accept variance or Reject and recount
      calls:
      - shift#getShiftCountLines
      - shift#acceptShiftVariance
      - shift#rejectShiftVariance
      result: accepted -> closed, over/short posted; rejected -> cashier recounts blind and resubmits
