# platform — derived from the API contracts, not hand-written
# Migration: V0001 / V0003 — DONE
#
# Columns come from schema properties. Types are inferred: format uuid to uuid,
# date-time to timestamptz, ULID patterns to char(26), Money to numeric(18,4).
# What is NOT here: partitioning, RLS policies, indexes, the PII split. That is
# storage design and lives in the migration scripts.

module: platform
migration: V0001 / V0003 — DONE
tableCount: 9
