      required: true
    - name: kind
      type: jsonb
      required: true
    - name: driver
      type: text
      required: true
      description: Built to an open standard where one exists — ESC/POS, UnifiedPOS, OSDP. Adding a vendor
        is a driver plus configuration, not a core change (ADR-0015).
