why: '**The only service that reaches another region** (ADR-0010, ADR-0014). Separate because it is
  the one place where data crosses a jurisdiction, and **a boundary that matters legally should be a
  boundary that exists physically.**


  It moves a pseudonymous guest link rather than a guest, which is the whole design.'
