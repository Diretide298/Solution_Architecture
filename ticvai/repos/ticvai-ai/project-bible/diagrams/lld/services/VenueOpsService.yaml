why: '**Six small domains, 102 operations, one team.** Queue, maintenance, bookable resources, venue
  mapping, media assets and arcade. None is large enough to deploy alone, all are venue-scoped, none
  is on the critical sale path, and **all six are licensed as optional modules** — a venue that buys
  none of them should not be running six idle services.'
scale: Low and steady. Queue readings are the only frequent write.
ifDown: Down degrades venue operations. Selling and admitting continue.
