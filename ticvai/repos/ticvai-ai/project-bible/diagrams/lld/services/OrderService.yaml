    consequence — no migration, no backup, no owner.'
  key: scope_path + what is being resolved — permissions, configuration, a price list
  eviction:
  - 'version: Bumped by the write that evicts it. **A config change nobody evicts is a stale permission**'
  writtenBy:
  - getRefundPolicy
