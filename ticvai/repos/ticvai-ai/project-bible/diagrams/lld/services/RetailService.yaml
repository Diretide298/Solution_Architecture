tables:
- store: cache:idempotency
  kind: cache
  columns: 5
  backing: redis
  owned: false
  why: '**Not a table and not owned by a service.** Derived from something already read, losable without
    consequence — no migration, no backup, no owner.'
  key: The idempotency key the caller sent
  eviction:
  - 'expires_at: **Must exceed the longest offline window.** A scanner out for a weekend replays on
    Monday'
  writtenBy:
