  - createRetailSale
  - createShopAndDrop
  - disposeShopAndDrop
  - reprintReceipt
  - reserveMerchandise
  - setReturnPolicy
  - updateMerchandise
  keys:
    setReturnPolicy:
      role: evicts
      resolvers: &id001
      - retail.return_policy
      key: res:{tenantId}:{resolver}:{scopePath}
      bump: INCR resver:{tenantId}:{resolver}
      affects: 'every scope in the tenant: the bump is one counter per resolver, so the scope written,
        its ancestors and every descendant that inherits from it re-resolve on their next read'
- store: cache:resolution
  kind: cache
  columns: 4
  backing: redis
  owned: false
  why: '**Not a table and not owned by a service.** Derived from something already read, losable without
    consequence — no migration, no backup, no owner.'
  key: scope_path + what is being resolved — permissions, configuration, a price list
  eviction:
  - 'version: Bumped by the write that evicts it. **A config change nobody evicts is a stale permission**'
  writtenBy:
  - getReturnPolicy
  - setReturnPolicy
  readBy:
  - getReturnPolicy
  keys:
    getReturnPolicy:
      role: fills
      resolvers:
      - retail.return_policy
      key: res:{tenantId}:{resolver}:{scopePath}
      bump: null
      affects: null
    setReturnPolicy:
      role: evicts
      resolvers: *id001
      key: res:{tenantId}:{resolver}:{scopePath}
      bump: INCR resver:{tenantId}:{resolver}
      affects: 'every scope in the tenant: the bump is one counter per resolver, so the scope written,
