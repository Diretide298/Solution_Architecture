notes: '**A status belongs to a version, not to the product code.** Saving a change to an active product
  creates the next version in `draft` (setMembershipProductTier, pack p.6); the active version keeps
  selling until the new one is published, and `migrationPolicy` says when members move to it.


  **Every action writes an audit row** to subscription.membership_product_history (pack p.18).


