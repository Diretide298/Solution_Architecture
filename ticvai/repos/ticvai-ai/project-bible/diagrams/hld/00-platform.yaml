id: HLD
title: TICVAI — the whole platform
generatedBy: tools/derive-diagrams.py
about: '**A multi-tenant venue platform.** One tenant operates several venues; a venue sells admission,
  food, retail and experiences; a guest arrives, is admitted, spends and leaves.


  **Five layers, one join.** Screens name operations, operations resolve against 28 OpenAPI contracts,
  contracts persist to 26 schemas, and every artefact in the package is drawn by resolving against that
  join rather than by being written twice.'
