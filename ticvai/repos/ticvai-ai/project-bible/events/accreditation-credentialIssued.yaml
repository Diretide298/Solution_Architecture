# accreditation.credentialIssued v1 — published by accreditation
# Checked by tools/check-states.py against states/ and the contracts.

name: accreditation.credentialIssued
version: 1
publisher: accreditation
description: A badge, QR, mobile, NFC, RFID or wristband credential was issued to an accredited person, new or as a replacement.
aggregate: accreditationCredential
emittedWhen: issueAccreditationCredential or replaceAccreditationCredential succeeds
payload:
- field: credentialId
  type: uuid
- field: holderId
  type: uuid
- field: programmeId
  type: uuid
- field: kind
  type: string
  notes: One of printedBadge, mobileCredential, qr, nfcCard, rfidCard, wristband
- field: symbology
  type: string
  required: false
- field: encodedIdentifier
  type: string
  required: false
  notes: '**What a gate reads.** Not sent to webhook subscribers — the public-api consumer strips it'
- field: serialNumber
  type: string
  required: false
- field: replacesCredentialId
  type: uuid
  required: false
  notes: Set on a replacement. The replaced credential stops admitting in the same act
- field: validFrom
  type: date
  required: false
- field: validTo
  type: date
  required: false
- field: effectiveZones
  type: array
  notes: The holder's zones at issue, for the offline bundle
- field: scopePath
  type: string
- field: issuedAt
  type: timestamp
consumers:
- context: access
  purpose: Add the encodedIdentifier to the validation bundle, and drop the replaced one, so a gate resolves the accreditation credential without a network
  idempotencyKey: credentialId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: public-api
  purpose: Deliver to webhook subscriptions taking accreditation.credentialIssued (12.1.53), without encodedIdentifier
  idempotencyKey: credentialId
  onFailure: retryThenDeadLetter
  isCritical: false
- context: marketing
  purpose: Tell the holder their credential is ready (the credentialReady notification rule)
  idempotencyKey: credentialId
  onFailure: retry
  isCritical: false
- context: reporting
  purpose: Accreditation KPIs — credentials issued and replaced by kind and period (12.1.50)
  idempotencyKey: credentialId
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: '**Added 29 September (build pass, BL-180 and BL-181).** A credential issued and never heard of by
  `access` is a person refused at a service gate holding a valid badge; a replacement nobody told the gates
  about is two live badges for one person.


  No state model emits this: a credential is **created** already issued, by the operation that issues it,
  so there is no from-state for a transition to carry the emit — the event fires on creation, as
  `entitlement.issued` does. Both operations write `platform.outbox` in the same transaction (ADR-0033).'
