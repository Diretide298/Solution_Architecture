# order.linkedToGuest v1 — published by orders
# Added 14 October 2026 (ADAM CR-084, CHG-GDL-003).

name: order.linkedToGuest
version: 1
publisher: orders
description: A guest-checkout order was attached to a guest's account, so it now belongs to that subject.
aggregate: order
emittedWhen: attachGuestCheckoutOrders, Orders' consumer of identity.guestCheckoutLinked, attaches the guest-checkout
  orders linkGuestCheckout matched (one event per order attached; r10 ruling, CHG-R10ID-018); setCustomerGuestAccount attaches a guest account to an order (one event
  per order whose subject it sets; CHG-MOD-006)
emittedBy:
- orders.attachGuestCheckoutOrders
- orders.setCustomerGuestAccount
payload:
- field: orderId
  type: uuid
- field: subjectId
  type: uuid
  notes: The account the order now belongs to
- field: status
  type: string
  notes: The order's OrderStatus when it was attached
- field: venueId
  type: uuid
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: linkedAt
  type: timestamp
consumers:
- context: identity
  purpose: Set the subject on the order's identity.subject_holding row and on the rows of the entitlements issued from
    it (recorded without a subject when the order was a guest checkout), so an attached order and its tickets block
    deleteGuestAccount like any other the guest holds (ADAM CR-084, CHG-GDL-003)
  writes:
  - identity.subject_holding
  idempotencyKey: orderId + subjectId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Added 14 October 2026 (ADAM CR-084, CHG-GDL-003).** linkGuestCheckout changed which subject an order belongs
  to and told nobody, so Identity''s projection of what each guest holds (identity.subject_holding, CHG-GDL-001) never
  learned that a guest who bought before registering holds the order and its tickets, and deleteGuestAccount would
  have erased an account holding a valid ticket. tools/check-error-sources.py (E-UNFED) now fails an operation that
  changes the subject of a projected source table without emitting an event the projection consumes.


  **Publisher is orders, as the order is the aggregate.** Since r10 (the lead''s ruling on ADR-0028, CHG-R10ID-018)
  Identity no longer attaches the orders itself: linkGuestCheckout matches them in Identity''s own projection and emits
  identity.guestCheckoutLinked; Orders'' attachGuestCheckoutOrders sets each order''s subject and writes this event in
  its own transaction (ADR-0033).


  No state model emits this: attaching an order changes its owner, not its status.'
