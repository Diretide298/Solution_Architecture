# identity.loginRecorded v1 — published by identity
# Checked by tools/check-states.py against states/ and the contracts.

name: identity.loginRecorded
version: 1
publisher: identity
description: Somebody tried to sign in — a staff or partner principal, or a guest — and it succeeded,
  failed, or was asked for a second factor.
aggregate: principal
emittedWhen: Every call to login, guestPasswordLogin, verifyGuestOtp, guestSocialLogin, guestUaePassLogin,
  registerGuest (the first sign-in), completeSsoAuthorization or verifyMfaChallenge (action signIn),
  success or failure
payload:
- field: loginEventId
  type: string
  notes: ULID minted by the operation. The idempotency key for every consumer
- field: principalId
  type: uuid
  required: false
  notes: A staff or partner sign-in. Null for a guest, and null on a failure against an unknown identifier
- field: subjectId
  type: uuid
  required: false
  notes: A guest sign-in. Null for a principal, and null on a failure against an unknown identifier
- field: deviceIdHash
  type: string
  notes: '**Hashed, never the raw device id.** Keyed per tenant, so two tenants cannot join their guests
    on it'
- field: result
  type: string
  notes: success, failure or stepUp (a second factor was required before the session is usable)
- field: method
  type: string
  notes: password, otp, social, uaePass, sso, mfa or registration
- field: failureReason
  type: string
  required: false
  notes: invalidCredentials, lockedOut, sessionExists or mfaFailed. **Never tells an unknown identifier
    from a wrong password** — the event must not become the enumeration tool the 401 refuses to be
- field: ipCountry
  type: string
  required: false
  notes: ISO 3166-1 alpha-2, resolved at the edge. The address itself is not carried
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: ai
  purpose: Account-takeover signals (failure bursts, new device and country for a principal or guest) and
    device-sharing signals (one device hash across many accounts), in `ai-realtime` (AI system design
    section 3.2; AIP-122, AIP-124)
  idempotencyKey: loginEventId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Added 29 September (build pass, group OWN, from the AI group''s handoff).** Identity already
  counts failed attempts for the lockout; nothing outside it could see a pattern across accounts, which is
  what a credential-stuffing run looks like.


  No state model emits this: a sign-in attempt is **created** by the operation that handles it, not a
  status change — a failure opens no session at all. Each operation writes `platform.outbox` in the same
  transaction as the session it opens on a success (ADR-0033); on a failure the outbox row is what the
  operation commits, so **a refused sign-in still records one** even though the caller gets a 401.'
