# identity.guestRegistered v1 — published by identity
# Added 20 October 2026 (r8 cause IDENTITY-C55; the core lane's registerGuest x-ticvai-emits, CHG-R8SPN-029):
# the consents a guest gives at registration reach Marketing, which owns marketing.consent_record.

name: identity.guestRegistered
version: 1
publisher: identity
description: A guest registered an account, with the consents they gave on the form.
aggregate: subject
emittedWhen: registerGuest creates the guest's subject
emittedBy:
- identity.registerGuest
payload:
- field: subjectId
  type: uuid
- field: channel
  type: string
  notes: 'Where the guest registered (guestWeb, guestApp, kiosk): registerGuest''s RegisterGuestRequest.source,
    guestWeb when it is left out (ADAM CR-371, CHG-CR371-001). Never the code''s delivery channel (email, sms,
    whatsapp), which is not on the event'
- field: consents
  type: array
  notes: 'One per consent purpose shown on the form: purpose, granted (boolean), noticeVersion'
- field: registeredAt
  type: timestamp
consumers:
- context: marketing
  purpose: 'Record each consent through recordConsent''s rules, with the ConsentSource channel maps to (guestWeb is
    website, guestApp is guestApp, kiosk is kiosk; ADAM CR-371, never registration, which the source check refuses): a
    granted purpose becomes a consent record at its notice version, a refused one is recorded as refused, never
    skipped'
  writes:
  - marketing.consent_record
  idempotencyKey: eventId + purpose
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: No state model emits this.
