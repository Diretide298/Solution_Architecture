# Group task — state model
# Contract: orders.GroupTask.status
# Checked by tools/check-states.py. Added 29 September (DM5: data model for the agreed operations).

entity: Group task
contract: orders
enum: GroupTask.status
enumKind: inline
enumSchema: GroupTask
enumProperty: status
owner: orders
initial:
- open
terminal:
- done
- cancelled
transitions:
- from: open
  to: inProgress
  operation: setGroupOperationalPlanning
  trigger: operation
  guard: The owning department started it
- from: inProgress
  to: done
  operation: setGroupOperationalPlanning
  trigger: operation
  guard: Completed before the group's arrival
- from: open
  to: done
  operation: setGroupOperationalPlanning
  trigger: operation
  guard: Completed without being marked started
- from: open
  to: cancelled
  operation: setGroupOperationalPlanning
  trigger: operation
  guard: No longer needed (the plan changed)
- from: inProgress
  to: cancelled
  operation: setGroupOperationalPlanning
  trigger: operation
  guard: No longer needed (the plan changed)
- from: open
  to: cancelled
  trigger: cascade
  guard: The group booking was cancelled
