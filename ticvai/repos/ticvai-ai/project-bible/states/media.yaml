# Media asset — state model
# Contract: assets.MediaStatus
# Checked by tools/check-states.py.

entity: Media asset
contract: assets
enum: MediaStatus
enumKind: named
enumSchema: MediaStatus
owner: assets
initial:
- processing
terminal: []
transitions:
- from: processing
  to: ready
  trigger: job
  guard: Derivatives generated and the virus scan passed
  emits:
  - assets.documentIndexed
- from: processing
  to: quarantined
  trigger: job
  guard: '**Scan flagged it.** Quarantined rather than deleted — a false positive on a tenant’s hero
    image must be recoverable'
- from: processing
  to: failed
  trigger: job
  guard: Unreadable, or a format nothing can derive from
- from: quarantined
  to: ready
  operation: updateMediaAsset
  trigger: operation
  guard: Reviewed and cleared
  isReversal: true
  requiresApproval: true
- from: ready
  to: archived
  operation: updateMediaAsset
  trigger: operation
  guard: '**Refused while in use.** An archived asset still referenced by a live homepage is a broken
    image on a guest surface'
- from: archived
  to: ready
  operation: updateMediaAsset
  trigger: operation
  guard: Restored
  isReversal: true
notes: '`processing` is the state most systems omit and the one that breaks things. An upload completes
  before its derivatives exist, and a screen showing "done" too early produces a broken image.

  **No state is terminal (decided 28 September, audit STATE-MEDIA).** Restore is allowed: `archived`
  to `ready` and `quarantined` to `ready` (after review) stay. An asset''s life ends only by
  `deleteMediaAsset`, which removes the row rather than moving it to a state. `failed` has no way out
  because a file nothing can derive from is re-uploaded, not repaired; it too ends by deletion.'
