- step: 2
  screen: BO-555
  action: Works in Active Rental Detail & Live Timeline
  operations: []
  outcome: Provide the complete operational view of one active rental.
- step: 3
  screen: BO-554
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-556
  action: Works in Rental Extension Request
  operations: []
  outcome: Allow the customer or operator to request additional rental time. This is one of the important
    capabilities I recommend formally adding to the rental scope.
- step: 5
  screen: BO-554
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-557
  action: Works in Extension Pricing & Confirmation
  operations: []
  outcome: Calculate the commercial impact of an approved extension. Once Board 3 confirms availability,
    Board 4 calculates the extension charge.
- step: 7
  screen: BO-554
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-558
  action: Works in Equipment Swap / Replacement
  operations: []
  outcome: Replace equipment during an active rental without terminating and recreating the rental. This
