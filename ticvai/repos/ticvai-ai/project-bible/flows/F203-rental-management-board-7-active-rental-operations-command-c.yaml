  screen: BO-554
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-560
  action: Works in Due Soon & Customer Notification Management
  operations: []
  outcome: Proactively communicate with customers before their rental becomes overdue. The original matrix
