$schema: ./_schema.yaml
id: F79
name: A workstation is registered, configured and rolled out
actor: technician
capability: A workstation is registered, configured and rolled out
wave: 2
frequency: As the venue needs it.
criticality: operational
primaryContract: tenancy
contracts:
- tenancy
- platform-ops
platforms:
- P08
trigger:
  description: A new till arrives in a box, or an old one needs a new configuration.
offlineBehaviour: '**Deployment needs the network by definition.** A config pushed to a device nobody
  can reach is a config that has not been pushed.'
steps:
- step: 1
  screen: BO-036
  action: The new device is registered and its workstation configured.
  operations:
  - registerDevice
  - configureWorkstation
  - getWorkstation
  outcome: '**Known before it is used.** A till nobody registered is a till whose sales belong to nobody.'
- step: 2
  screen: BO-129
  action: A configuration profile is set for it.
  operations:
  - setConfigurationProfile
  outcome: Software version, settings and when it counts as offline.
  crossesDevice: true
  note: '**Repointed 2 October (CHG-WIR-021).** Connectivity thresholds have their own screen (BO-131) and are set in F89; this step sets the configuration profile.'
- step: 3
  screen: BO-124
  action: Its sale board layout is built.
  operations:
  - createSaleBoard
  - updateSaleBoard
  outcome: What the cashier sees and in what order.
  crossesDevice: true
- step: 4
  screen: BO-126
  action: The configuration is deployed and rolled out.
  operations:
  - deployConfigurationProfile
  outcome: '**`startRollout` answers 202 until the release manager approves** (audit R144); a requester
    cannot approve their own.'
  crossesDevice: true
  note: '**Repointed 2 October (CHG-WIR-021).** startRollout is TICVAI''s platform release act (PLATFORM_RELEASE_PROMOTE) that tenant staff cannot hold; the venue deploys its configuration profile with deployConfigurationProfile.'
branches:
- at: 1
  condition: A step in the chain is not licensed for this tenant.
  behaviour: '**The chain stops at the module boundary.** `requiresModule` on each screen decides —
    a tenant without the retail licence does not see the retail half, and the journey is shorter rather
    than broken.'
  severity: medium
  resolvedBy: getModuleEnablement
exitStates:
- state: completed
  description: The chain ran as the client drew it.
- state: stoppedAtModule
  description: '**A licence boundary, not a failure.**'
notes: '**Re-authored 28 September to follow the purpose of each screen it visits** (decided 28 September, audit R261): the guest-loyalty and consent operations bulk-attached to Device Registry left the journey (audit R254), and the chain now runs register, configure, lay out, roll out. **POS board 1, the fleet loop.** `getWorkstationHealth`, `setConfigurationProfile` and `deployConfigurationProfile`
  were built on 20 August from this same board and had never been walked together. **Derived from the
  client''s own `GOES TO` edges**, not from an inferred path — a pair of frames the client linked is
  evidence; a chain assembled from unrelated pairs is a guess.'
openQuestions: null
