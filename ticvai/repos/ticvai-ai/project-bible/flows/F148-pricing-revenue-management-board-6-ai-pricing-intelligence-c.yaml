id: F148
name: 'Pricing   Revenue Management board 6: AI Pricing Intelligence Command Center'
actor: platformAdmin
wave: 3
frequency: routine
criticality: operational
platforms:
- P09 TICVAI Web
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Pricing   Revenue Management board 6. **This route is read
    from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: ADM-098
  entryPoints:
  - Arrives at AI Pricing Intelligence Command Center
steps:
- step: 1
  screen: ADM-098
  action: Opens AI Pricing Intelligence Command Center
  operations:
  - listPricing
  outcome: Provide Revenue Managers with a single operational view of all AI signals, forecasts, opportunities
    and risks influencing pricing.
- step: 2
  screen: ADM-099
  action: Works in Internal Demand & Booking Signal Hub
  operations:
  - listInternalDemandBooking
  outcome: Centralize the internal TICVAI signals used by forecasting and AI pricing models. These are
    generally the highest-confidence signals because they come directly from TICVAI transactions.
- step: 3
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 4
  screen: ADM-100
  action: Works in Weather Intelligence & Demand Impact Configuration
  operations:
  - listWeatherDemandImpact
  outcome: Allow TICVAI to understand how weather conditions affect demand for different venues and experiences.
    This should be much more sophisticated than simply connecting a weather API.
- step: 5
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 6
  screen: ADM-101
  action: Works in Nearby Event, Exhibition & Local Demand Intelligence
  operations:
  - listNearbyEventExhibition
  outcome: Detect external events around TICVAI venues that could materially affect visitor demand. This
    directly addresses the exhibition-near-the-venue scenario.
- step: 7
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 8
  screen: ADM-102
  action: Works in Competitor Pricing & Market Position Intelligence
  operations:
  - listCompetitorPricingMarket
  outcome: Allow TICVAI to understand its commercial position relative to relevant competitors.
- step: 9
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 10
  screen: ADM-103
  action: Works in Market, Tourism, Holiday & Contextual Signal Hub
  operations:
  - listMarketTourismHoliday
  outcome: Capture broader external factors that may affect visitor demand beyond weather and nearby events.
- step: 11
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 12
  screen: ADM-104
  action: Works in AI Demand Forecasting & Booking Curve Studio
  operations:
  - listDemandBookingCurve
  outcome: Predict future demand at a granular commercial level. This is the core predictive engine behind
    intelligent dynamic pricing.
- step: 13
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 14
  screen: ADM-105
  action: Works in Price Elasticity & Revenue Response Intelligence
  operations:
  - listPriceElasticityRevenue
  outcome: Estimate how customers are likely to respond to different prices.
- step: 15
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 16
  screen: ADM-106
  action: Works in AI Pricing Recommendation & Explainability Center
  operations:
  - listPricingRecommendationExplainability
  outcome: Convert all intelligence generated by Board 6 into actionable pricing recommendations. This
    is the central AI recommendation screen.
- step: 17
  screen: ADM-098
  action: Returns to the board's landing screen
  operations:
  - listPricing
  outcome: Ready for the next screen on this board
- step: 18
  screen: ADM-107
  action: Works in AI Signal Registry, Data Quality & Model Governance
  operations:
  - listSignalDataQuality
  outcome: Govern the complete data and intelligence ecosystem behind AI pricing. This is critical. Without
    this screen, Development team could connect many external sources without giving TICVAI proper control
    over them.
branches:
- at: 1
  condition: Nothing has been set up on AI Pricing Intelligence Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Pricing   Revenue Management board 6 visited
primaryContract: catalogue
contracts:
- catalogue
