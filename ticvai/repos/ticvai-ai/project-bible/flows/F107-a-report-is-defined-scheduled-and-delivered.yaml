$schema: ./_schema.yaml
id: F107
name: A report is defined, scheduled and delivered
actor: venueManager
capability: A report is defined, scheduled and delivered
wave: 3
frequency: As needed.
criticality: operational
primaryContract: reporting
contracts:
- reporting
platforms:
- P08
trigger:
  description: Somebody wants the same numbers every Monday without asking for them.
offlineBehaviour: Analytical.
steps:
- step: 1
  screen: BO-058
  action: The report is defined.
  operations:
  - createReport
  - runReport
  outcome: Built once and run to check it shows the right numbers.
- step: 2
  screen: BO-061
  action: It is scheduled to the people who need it.
  operations:
  - createReportSchedule
  - listReportSchedules
  outcome: '**Every Monday, to these people**, without anybody remembering to run it.'
  crossesDevice: true
- step: 3
  screen: BO-061
  action: Each delivery is checked.
  operations:
  - listReportExecutions
  outcome: '**Delivered, or failed and said so.** A schedule that silently stops is worse than none.'
branches:
- at: 1
  condition: The acting principal lacks the permission at this scope.
  behaviour: '**Refused at the first step, not the last.** ADR-0002 makes authorisation user-driven
    — a person who gets three steps in and then cannot finish has been told the wrong thing.'
  severity: medium
  resolvedBy: resolvePermissions
exitStates:
- state: completed
  description: The journey ran end to end.
- state: refused
  description: '**Stopped at a permission or a licence boundary**, with the reason named.'
notes: '**Re-authored 28 September to follow the purpose of each screen it visits** (decided 28 September, audit R261): the step on Attendance & Footfall (overrideAccess, updateReport) left the journey; defining, scheduling and delivering now run on Reporting Home and Scheduled Reports. **ReportingService at 48% and scheduling uncovered.** A report nobody has to remember to run
  is the difference between a dashboard and a habit.'
openQuestions: null
