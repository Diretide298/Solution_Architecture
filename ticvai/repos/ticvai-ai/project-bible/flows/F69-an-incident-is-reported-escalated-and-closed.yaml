$schema: ./_schema.yaml
id: F69
name: An incident is reported, escalated and closed
actor: supervisor
capability: Incident management
wave: 2
frequency: Routine.
criticality: safety
primaryContract: maintenance
contracts:
- maintenance
- workforce
- marketing-crm
platforms:
- P06
trigger:
  description: Something happened — an injury, an evacuation, a theft. **The first minutes matter and
    the record matters later.**
offlineBehaviour: '**Reporting works offline and must.** An incident happens where it happens, and a
  steward who has to walk to a signal is a steward not dealing with it.'
steps:
- step: 1
  screen: EMP-026
  action: A steward reports it from where it happened.
  operations:
  - reportIncident
  outcome: '**Kind, location, people involved, time.** Typed in under a minute or it is typed later
    and wrongly.'
- step: 2
  screen: EMP-027
  action: A supervisor reads it and adds detail.
  operations:
  - getIncident
  - updateIncident
  outcome: '**Appended, never overwritten.** An incident record edited after the fact is a record that
    cannot be relied on.'
  crossesDevice: true
- step: 3
  screen: EMP-027
  action: Where required, the authorities are notified.
  operations:
  - recordAuthorityNotification
  outcome: '**The notification is itself a record.** *We told the police* with no time and no name is
    not evidence.'
  crossesDevice: true
  note: '**Repointed 2 October (CHG-WIR-001).** Notifying the authorities is part of following up the incident (EMP-027), not of restoring the venue (EMP-050); the operation moved with it.'
- step: 4
  screen: EMP-038
  action: If it is a venue-wide event, an announcement goes out.
  operations:
  - publishAnnouncement
  - getAnnouncementReach
  outcome: '**Reach is measured.** An evacuation announcement nobody acknowledged is an evacuation nobody
    heard.'
  crossesDevice: true
  note: '**Repointed 2 October (CHG-WIR-001).** The venue-wide announcement is declared from Broadcast to team (EMP-038); Emergency mode (EMP-047) is the recipients'' full-screen takeover with acknowledge as its one action.'
branches:
- at: 2
  condition: It involves a guest and becomes a case.
  behaviour: '`createCase` links the incident to the guest record. **An incident is what happened; a
    case is the conversation afterwards**, and conflating them puts operational detail in a guest-facing
    thread.'
  severity: high
  resolvedBy: createCase
- at: 4
  condition: Staff do not acknowledge the announcement.
  behaviour: '**Escalated by name, not re-broadcast.** A second identical message to everybody is a
    message everybody ignores.'
  severity: high
  resolvedBy: getAnnouncementReach
exitStates:
- state: closed
  description: Reported, actioned, recorded.
- state: escalatedToAuthorities
  description: '**With time and name.**'
- state: linkedToCase
  description: A guest is involved and the conversation continues elsewhere.
notes: '**Incident handling belongs to maintenance, not workforce** (decided 28 September, audit R139 (d)):
  `reportIncident`, `getIncident`, `updateIncident`, `listIncidents` and `recordAuthorityNotification`
  are MaintenanceService operations (states/incident.yaml), so steps 1 to 3 run against `maintenance`.
  Workforce owns only the announcement in step 4, and `approvals` was never called. **Written 24 August.** `EMP-027` could report a new incident from a detail screen — removed.
  And **`getAnnouncementReach` had never been in a flow**: the platform could broadcast and never ask
  who heard.'
openQuestions: null
