id: F153
name: 'Product Lifecycle   Catalogue Governance board 2: Product Governance Command Center'
actor: platformAdmin
wave: 3
frequency: routine
criticality: operational
platforms:
- P09 TICVAI Web
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Product Lifecycle   Catalogue Governance board 2. **This
    route is read from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: ADM-128
  entryPoints:
  - Arrives at Product Governance Command Center
steps:
- step: 1
  screen: ADM-128
  action: Opens Product Governance Command Center
  operations:
  - listProductGovernance
  outcome: Provide management and administrators with a single control center for all product governance
    activities.
- step: 2
  screen: ADM-129
  action: Works in Approval Workflow Designer
  operations:
  - approveWorkflow
  outcome: Configure reusable approval workflows governing product creation and modification.
- step: 3
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 4
  screen: ADM-130
  action: Works in Approval Review & Decision Workspace
  operations:
  - approveReviewDecision
  outcome: Give approvers a clear interface for reviewing a proposed product or product change before
    making a decision.
- step: 5
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 6
  screen: ADM-131
  action: Works in Product Version Management
  operations:
  - listProductVersions
  outcome: Maintain controlled versions of every governed product configuration. The source matrix specifically
    requires version history for products and the ability to roll back to earlier versions.
- step: 7
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 8
  screen: ADM-132
  action: Works in Rollback & Recovery Management
  operations:
  - listRollbackRecovery
  outcome: Safely restore an earlier product configuration when a newly published configuration causes
    an issue.
- step: 9
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 10
  screen: ADM-133
  action: Works in Change Impact Analysis
  operations:
  - listChangeImpactAnalysis
  outcome: Show administrators what will be affected before a product change is approved or published.
    This directly addresses the matrix requirement to perform impact analysis before product changes are
    published.
- step: 11
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 12
  screen: ADM-134
  action: Works in Change Propagation & Dependency Control
  operations:
  - listChangePropagationDependency
  outcome: Control whether approved product changes should automatically propagate to related products
    or dependent configurations. The source matrix requires controlled propagation of changes to linked
    products.
- step: 13
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 14
  screen: ADM-135
  action: Works in Product Retirement, Suspension & Archive
  operations:
  - listProductRetirementSuspension
  outcome: Provide a governed end-of-life process for products. The source matrix explicitly requires
    disabling or retiring products without affecting previously sold tickets.
- step: 15
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 16
  screen: ADM-136
  action: Works in Product Audit Trail & Change History
  operations:
  - listProductTrailChange
  outcome: Provide a complete, immutable history of product configuration and governance activity. The
    matrix requires tracking configuration changes with timestamps and user information.
- step: 17
  screen: ADM-128
  action: Returns to the board's landing screen
  operations:
  - listProductGovernance
  outcome: Ready for the next screen on this board
- step: 18
  screen: ADM-137
  action: Works in Governance Risk, AI Monitoring & Control Center
  operations:
  - listGovernanceRiskMonitoring
  outcome: Use TICVAI intelligence to continuously identify catalogue governance risks rather than relying
    entirely on administrators to discover them manually.
branches:
- at: 1
  condition: Nothing has been set up on Product Governance Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Product Lifecycle   Catalogue Governance board 2 visited
primaryContract: catalogue
contracts:
- catalogue
