    the entry point when someone asks: “Why did TICVAI do this?” Search By Support: Decision ID Trace
    ID Approval ID Execution ID Transaction ID Cu'
- step: 3
  screen: ADM-539
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 4
  screen: ADM-541
  action: Works in AI Decision Explanation Workspace
  operations: []
