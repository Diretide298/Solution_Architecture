  operations: []
  outcome: Determine exactly where returned value goes when the original transaction consumed multiple
    wallet credits. This is important because a simple “+AED 200 to Cash Credit” can corrupt wallet economics.
    Example
- step: 9
  screen: BO-1143
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-1148
