  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-1146
  action: Works in Refund-to-Wallet Policy Configuration
  operations: []
  outcome: Configure when refunds from TICVAI transactions may be returned directly to a digital wallet.
    Requirement 4.3.15 specifically requires instant refund to the digital wallet with customer notification.
    Refund Sources Ticket cancellation Event
- step: 7
  screen: BO-1143
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
