    wallet operational activity and exceptions. Dashboard KPIs
- step: 2
  screen: BO-1144
  action: Works in Peer-to-Peer Transfer Configuration
  operations: []
  outcome: Configure direct value transfers between independent TICVAI wallet accounts. Requirement 4.3.16
    specifically requires guests to transfer money from their wallet to another guest's wallet. Transfer
    Methods
- step: 3
  screen: BO-1143
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 4
