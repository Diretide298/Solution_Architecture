  outcome: Provide end-to-end visibility into how the different media attached to one Virtual Ticket have
    been presented or used. This screen is for credential traceability, while Area 16 remains responsible
    for the actual access-control decision.
- step: 15
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-362
  action: Works in Credential Security, Audit & Operational Evidence
  operations:
  - listCredentialSecurityOperational
  outcome: Maintain complete evidence of credential creation and lifecycle activity.
- step: 17
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-363
  action: Works in Ticket Media Analytics & AI Operations Intelligence
  operations:
  - listTicketMedia
  outcome: Provide management and operations with analytics and AI intelligence across Virtual Tickets
    and credential media. This should be a serious operational intelligence layer—not simply a chatbot.
branches:
- at: 1
  condition: Nothing has been set up on Credential Operations Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Ticket Media   Credential Management board 3 visited
primaryContract: access
contracts:
- access
