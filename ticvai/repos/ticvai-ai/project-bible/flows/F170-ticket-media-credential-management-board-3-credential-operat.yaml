id: F170
name: 'Ticket Media   Credential Management board 3: Credential Operations Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Ticket Media   Credential Management board 3. **This route
    is read from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-354
  entryPoints:
  - Arrives at Credential Operations Command Center
steps:
- step: 1
  screen: BO-354
  action: Opens Credential Operations Command Center
  operations:
  - listCredential
  outcome: Provide Operations, Ticketing, Customer Service and Technical teams with a real-time command
    center covering all issued credential media. This is the operational starting point for Area 15.
- step: 2
  screen: BO-355
  action: Works in Virtual Ticket & Credential 360° Workspace
  operations:
  - setVirtualTicketCredential
  outcome: Provide a complete operational view of one Virtual Ticket and every media credential currently
    or historically associated with it. This is one of the most important operational screens.
- step: 3
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-356
  action: Works in Credential Generation & Issuance Monitor
  operations:
  - listCredentialGenerationIssuance
  outcome: Manage and monitor generation of credential instances from approved Board 2 media templates.
- step: 5
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-357
  action: Works in Credential Delivery & Distribution Operations
  operations:
  - listCredentialDeliveryDistribution
  outcome: Manage how generated ticket media are delivered or made available to customers, participants
    and operational staff.
- step: 7
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-358
  action: Works in Media Binding, Activation & Assignment Operations
  operations:
  - setMediaBindingActivation
  outcome: Manage credentials that require operational assignment or activation after ticket issuance.
- step: 9
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-359
  action: Works in Credential Replacement, Reissue, Revocation & Recovery
  operations:
  - listCredentialReplacementReissue
  outcome: Manage operational credential changes while preserving the underlying Virtual Ticket.
- step: 11
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-360
  action: Works in Failed Generation, Delivery & Credential Exception Management
  operations:
  - listFailedGenerationDelivery
  outcome: Provide one dedicated operational queue for credential-related failures.
- step: 13
  screen: BO-354
  action: Returns to the board's landing screen
  operations:
  - listCredential
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-361
  action: Works in Credential Usage & Cross-Media Traceability
  operations:
