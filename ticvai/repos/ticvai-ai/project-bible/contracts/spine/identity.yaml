            effect for its holders at their next sign-in, unless it is a DENY, which ends their sessions at
            once.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccess'
        '400':
          description: Wildcard on an ALLOW, or scope outside the caller's own grants
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
