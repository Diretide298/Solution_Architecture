        scopePath:
          type: string
    EmergencyAccessOverride:
      type: object
      x-ticvai-persistence: identity.access_override
      description: '3.3.6. **Time-boxed at creation, alerted as well as logged.**'
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        permissions:
          type: array
          items:
            type: string
        reason:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        alertedTo:
          type: array
          items:
            type: string
            format: uuid
    PlatformStaffGrant:
      type: object
      x-ticvai-persistence: identity.platform_staff_grant
      description: '**One platform operator''s time-boxed access into this tenant** (decided 28 September,
        audit R098). Written by `openPlatformStaffGrant`, read by the tenant through
        `listPlatformStaffGrants`, and never edited: a grant ends at `expiresAt`, and a new need is a new
        grant.

        '
      required:
      - id
      - operatorPrincipalId
      - permissions
      - reason
      - openedAt
      - expiresAt
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        operatorPrincipalId:
          type: string
          format: uuid
          readOnly: true
          description: The platform operator, from the Control Plane token. Set by the server.
        operatorDisplayName:
          type: string
          readOnly: true
        permissions:
          type: array
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
        reason:
          type: string
        ticketRef:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
        scopePath:
          type: string
          readOnly: true
          description: The tenant root. **Operations write it at `tenant` scope**; the server sets it.
    GuestSession:
      x-ticvai-persistence: none — Redis session registry
      type: object
      required:
      - subjectId
      - tokens
      - isVerified
      - expiresAt
      properties:
        subjectId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        tokens:
          $ref: '#/components/schemas/TokenPair'
        isVerified:
          type: boolean
          description: 'False until an OTP or a verified provider identity confirms ownership. An unverified
            account may browse and fill a cart but not transact: the gate is the checkout page
            (ADR-0045), where `checkoutCart` refuses it until the guest verifies or proves the contact by
            code. UAE Pass returns a verified identity, so it starts true. Rule on `verifyGuestEmail`,
            decided 17 September 2026.

            '
        identityProviders:
          type: array
          description: Linked providers. Several may resolve to one account.
          items:
            type: string
            enum:
            - password
            - otp
            - apple
            - google
            - uaePass
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells (ADR-0010).
        requiresMfa:
          type: boolean
          default: false
          description: >
            True only where the sign-in venue enabled guest two-step verification
            (`VenueSettings.identity.guestTwoStep`, in tenancy) and this guest has an active method
            (decided 29 September, rev 3 GAP-B1, per venue). The session is then
            not usable until `verifyMfaChallenge` succeeds on a `signIn` challenge. Always false for a UAE
            Pass sign-in, which is already a verified two-factor identity (proposed, client to correct).
        mfaMethods:
          type: array
          description: The guest's active methods, so the client can offer the right one. Empty when
            `requiresMfa` is false.
          items:
            $ref: '#/components/schemas/MfaMethod'
        homeCellName:
          type: string
          nullable: true
        preferredLanguage:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          description: '**30 days, sliding** (decided 28 September, audit R126 (2)): each use of the session
            moves this to 30 days from now, and 30 days unused ends it. **One session per device**: a guest
            may be signed in on a phone and a laptop at once, and a new sign-in on the same `deviceId` ends
            that device''s previous session.

            '
    ChangeCredentialRequest:
      type: object
      description: 'Request only. The credential itself is stored hashed in `identity.principal_credential`
        and is never returned by any operation (`handoff/schema-storage-only.md`).

        '
      required:
      - method
      - currentCredential
      - newCredential
      properties:
        method:
          type: string
          enum:
          - password
          - pin
          description: Which credential is being changed. Card, RFID and SSO are not secrets the principal
            holds, so they are not changed here.
        currentCredential:
          type: string
          maxLength: 512
          writeOnly: true
        newCredential:
          type: string
          maxLength: 512
          writeOnly: true
    ResetCredentialRequest:
      type: object
      description: Request only; see `ChangeCredentialRequest`.
      required:
      - method
      - temporaryCredential
      - reason
      properties:
        method:
          type: string
          enum:
          - password
          - pin
        temporaryCredential:
          type: string
          maxLength: 512
          writeOnly: true
          description: Issued to the principal out of band. Must be changed at next sign-in.
        reason:
          type: string
          minLength: 3
          maxLength: 500
    PasswordPolicy:
      type: object
      x-ticvai-persistence: identity.password_policy
      description: 'BL-144. **Written by `setPasswordPolicy`, which returns it**, at tenant scope. Before BL-144
        the package had no password policy, no lockout and no forced change at first logon anywhere.

        **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition, and forced rotation
        on a schedule makes passwords worse — people increment a digit. Rotation is here because some
        tenants are contractually required to have it, **not because it helps.**

        '
      required:
      - id
      - scopePath
      - minLength
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server. Required in the response only; ignored if a request sends it.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005), written by the server from the caller''s tenant
            (`x-ticvai-config-scope: tenant`). Required in the response only; ignored if a request sends it.'
        minLength:
          type: integer
          default: 12
          minimum: 8
          description: A tenant may raise the length and never set it below 8 (decided 28 September, audit
            R126 (7)).
        requireBreachCheck:
          type: boolean
          default: true
          description: '**The single most effective rule.** Refusing a password known to be breached stops
            more account takeovers than every composition rule combined.

            '
        maxAgeDays:
          type: integer
          nullable: true
          description: '**Null is the recommended value.** Forced rotation produces `Summer2026!` becoming
            `Summer2027!`, and it is offered because some tenants are contractually obliged to have it
            rather than because it works.

            '
        recoveryMethods:
          type: array
          description: 'BL-132. **A guest locked out had no path back** — lockout existed and recovery
            did not, which turns a forgotten password into a support call.

            **Ordered by strength, and the venue chooses which it offers.** Email is weakest and universal;
            a verified phone is stronger; an in-person check at a desk is strongest and only available
            to a guest who is already at the venue.

            '
          items:
            type: string
            enum:
            - email
            - sms
            - securityQuestions
            - inPersonVerification
            - supportAssisted
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: 'BL-145. **Null, and that is the decision.** A staff principal has one live session,
            full stop: ADR-0004 keeps a server-side session registry (the `sid` claim, `ActiveSession`), and
            §3.1.3 refuses a second sign-in rather than counting towards a limit (confirmed 28 September,
            audit R184). A number here would only ever mean 1.

            The requirement asked for it configurable. **Configurable to null is still an answer.**

            '
        deviceRestriction:
          type: object
          nullable: true
          description: 'BL-146. **Device, browser, IP and location restriction on access.** Applies to
            staff principals, not guests — a guest restricted to one device is a guest who cannot use
            their new phone.

            **Warn before block by default.** An IP restriction that blocks silently is a venue manager
            locked out on the day their ISP rotates an address.

            '
          properties:
            allowedIpRanges:
              type: array
              items:
                type: string
            allowedCountries:
              type: array
              items:
                type: string
            requireRegisteredDevice:
              type: boolean
              default: false
            onViolation:
              type: string
              enum:
              - warn
              - requireStepUp
              - block
              default: requireStepUp
        lockoutAfterAttempts:
          type: integer
          default: 10
        lockoutMinutes:
          type: integer
          default: 15
          description: '**A temporary lockout, not a permanent one.** Permanent lockout on failed attempts
            is a denial-of-service anybody can run against a known username.

            '
        forceChangeOnFirstLogon:
          type: boolean
          default: true
        reusePreventionCount:
          type: integer
          default: 5
          minimum: 0
          maximum: 24
          description: '**How many previous credentials a staff member may not reuse** — the last 5 unless
            the tenant sets another (decided 28 September, audit R132). `changeOwnCredential` refuses a
            match with `422`.

            '
        mfaRequiredForPermissions:
          type: array
          description: '**Step-up rather than blanket MFA.** Requiring it for a refund approval and not
            for reading a rota is what stops people sharing devices to avoid it.

            **MFA is required by permission, not by role** (decided 28 September, audit R135). A principal
            holding any permission listed here must keep an active method (`removeMfaMethod` refuses to
            remove the last one). **The default is the platform floor**: `ROLE_MANAGE`, `LEDGER_APPROVE`
            and every `PLATFORM_*` permission. A tenant may add to the list and never remove a floor entry;
            a body that drops one is refused `400`.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
          default:
          - ROLE_MANAGE
          - LEDGER_APPROVE
          - PLATFORM_TENANT_VIEW
          - PLATFORM_TENANT_MANAGE
          - PLATFORM_TENANT_TERMINATE
          - PLATFORM_TENANT_ACCESS
          - PLATFORM_PLAN_MANAGE
          - PLATFORM_CELL_VIEW
          - PLATFORM_CELL_MANAGE
          - PLATFORM_BILLING_VIEW
          - PLATFORM_BILLING_MANAGE
          - PLATFORM_RELEASE_VIEW
          - PLATFORM_RELEASE_MANAGE
          - PLATFORM_RELEASE_PROMOTE
          - PLATFORM_MIGRATION_VIEW
          - PLATFORM_MIGRATION_APPLY
    SegregationViolation:
      type: object
      x-ticvai-persistence: none — computed from identity.grant against identity.segregation_rule
      description: 'BL-110, 3.3.31, 3.3.38. **One principal currently holding both halves of a
        rule.**

        **Computed rather than stored.** A violation row that survived the grant behind it would be
        a queue item nobody could close, and a compliance queue that cannot reach zero is one
        people stop opening.

        '
      required:
      - ruleId
      - principalId
      - permissionA
      - permissionB
      properties:
        ruleId:
          type: string
          format: uuid
        ruleName:
          type: string
        severity:
          type: string
          enum:
          - block
          - requireApproval
          - warn
          description: '**From the rule.** A `warn` violation and a `block` violation are the same
            finding with very different urgency, and a queue that does not carry it sorts by
            nothing useful.

            '
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        atScopePath:
          type: string
          nullable: true
          description: '**Where the two overlap**, and the field that makes a finding actionable:
            the answer is usually to narrow one grant rather than to remove it.

            **Null where the rule is not `scopeSensitive`**, which is the estate-wide case.

            '
        compensatingControlNoted:
          type: boolean
          default: false
          description: '**True where `allowWithCompensatingControl` covers this one.** Flagged
            rather than filtered out — a small venue that cannot separate duties is a fact somebody
            accepted, and it should stay visible rather than disappearing from the count.

            '
        detectedAt:
          type: string
          format: date-time

    ModuleCapability:
      type: object
      x-ticvai-persistence: none — derived from contracts/shared/permissions.yaml and every contract
      description: >
        BL-110. **One tickable thing a person can be allowed to do in a module.** Derived rather
        than authored, so an operation added with a permission appears on the right checklist by
        existing rather than by somebody remembering.
      required:
      - key
      properties:
        key:
          type: string
          description: >
            **The permission string, and the only vocabulary there is.** `roles.yaml` holds 44
            lowercase keys sharing none of these; that file is a saved tick-set for the POS
            surface which was mistaken for the alphabet, and it becomes a `CapabilityTemplate`.
        label:
          type: string
          nullable: true
          description: >
            **Null where the permission has no description yet, and the client renders the key.**
            72 of them are in that state. **A generated sentence would read like a label and mean
            nothing** — and a checklist item nobody understands is ticked anyway, which is worse
            than one that visibly needs explaining.
        group:
          type: string
          nullable: true
          description: The heading it sits under in the vocabulary — Selling, Access control, Shift
            and cash. **How a checklist of forty items stays readable.**
        operationCount:
          type: integer
          description: >
            **How much this tick actually grants.** A capability behind ninety operations and one
            behind two are different decisions, and the number is the only honest way to say so on
            a screen.
        elevated:
          type: boolean
          default: false
          description: >
            **Derived: at least one operation behind it declares `x-ticvai-step-up`.** Not a rank
            and not a judgement about the name — the operation already said it needs a second
            factor. Ticking one raises an approval rather than taking effect.
        segregationConstrained:
          type: boolean
          default: false
          description: >
            **Named in a `SegregationRule`.** Ticking it may conflict with something the principal
            already holds, and `setPrincipalModuleAccess` answers 409 rather than letting it
            through.

    ModuleCapabilitySet:
      type: object
      description: BL-110. One module and everything a person could be allowed to do in it.
      properties:
        module:
          type: string
        title:
          type: string
        unguardedOperations:
          type: integer
          description: >
            **Operations in this module that carry no permission, and so appear on no checklist.**
            94 across the package — guest-facing, service-to-service or self-scoped. Stated
            because a checklist that silently omits a third of a module reads as complete.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModuleCapability'

    ModuleAccess:
      x-ticvai-persistence: identity.module_access
      type: object
      description: >
        BL-110. **What one principal may do in one module, at one scope.** The unit the grant
        screen writes and reads back unchanged.
      required:
      - module
      - scopePath
      - capabilities
      properties:
        principalId:
          type: string
          format: uuid
          readOnly: true
        module:
          type: string
        scopePath:
          type: string
          description: >
            **Where, and it is half the grant** (ADR-0018). A capability means nothing until it is
            held at a scope containing the thing it acts on — holding `ORDER_REFUND` at one venue
            is not holding it at another, and the checklist is per scope for that reason.
        capabilities:
          type: array
          items:
            type: string
          description: >
            **Permission keys, ticked.** The complete set for this module and scope: what is
            absent is not granted, which is what makes the write replaceable and the read
            verifiable.
        appliedTemplate:
          type: string
          nullable: true
          description: >
            **Which saved tick-set this was copied from, for the record only.** It is not a
            binding: the ticks are the grant, and editing the template afterwards changes nothing
            here. A grant that silently follows a template is a grant nobody can audit at a point
            in time.
        grantedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        grantedAt:
          type: string
          format: date-time
          readOnly: true

    CapabilityTemplate:
      x-ticvai-persistence: identity.capability_template
      type: object
      description: >
        3.3.23, BL-110. **A named tick-set — a role, with nothing depending on the name.**
      required:
      - code
      - name
      - capabilities
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Written by the server at `tenant` scope; ignored
            if a request sends it.'

    SegregationRule:
      type: object
      x-ticvai-persistence: identity.segregation_rule
      description: 'BL-147, 3.3.31 and 11.1.24. **The package enforced segregation of duties in exactly
        one place** — the product lifecycle guard requiring the approver not be the author — and there
        was no general rule.

        **A conflict is between two permissions held by one principal**, and the check runs at grant time
        rather than at use time: **discovering the conflict when somebody exercises it means the conflict
        already existed.**

        '
      required:
      - id
      - permissionA
      - permissionB
      - severity
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server. Required in the response only; ignored if a request sends it.
        name:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        severity:
          type: string
          enum:
          - block
          - requireApproval
          - warn
        rationale:
          type: string
          description: '**Why these two conflict, in words an auditor reads.** A rule with no rationale
            is a rule somebody removes when it becomes inconvenient.

            '
        scopeSensitive:
          type: boolean
          default: true
          description: '**Whether the two permissions must overlap in scope to conflict**, and this
            is not `scopePath` below — that one is the partition key and says where the rule *row*
            lives (ADR-0005), not where the *conflict* applies.

            **True, and it should rarely be false.** `ACCREDITATION_ISSUE` at Yas Island beside
            `ACCREDITATION_MANAGE` at Warner Bros is two jobs at two sites; flagging it is a
            control crying wolf, and the first thing a venue does with one of those is switch it
            off. The comparison walks `scopePath` prefixes the same way `resolvePermissions`
            already does — `uae.dubai` contains `uae.dubai.marina`, so one is an overlap and two
            siblings are not.

            **False is for conflicts that are genuinely estate-wide**, such as holding both sides
            of a financial reconciliation anywhere at all.

            '
        allowWithCompensatingControl:
          type: boolean
          default: false
          description: '**A small venue cannot always separate duties**, and pretending otherwise means
            the rule gets disabled entirely. A named compensating control is better than no rule.

            '
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope**; the server sets it and ignores it in a request.'
