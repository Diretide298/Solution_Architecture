openapi: 3.1.0
info:
  title: TICVAI Identity & Authorisation
  version: 1.0.0
  x-ticvai-screen-count: 71
  x-ticvai-tier: spine
  x-ticvai-module: 19 — Guest Mobile App & Branding (auth) + cross-cutting staff auth
  x-ticvai-requirements: 107
  x-ticvai-capabilities:
  - C35
  - C36
  - C56
  x-ticvai-platforms:
  - All platforms
  description: "## What this contract covers\n**Defines who is asking, and what they may do.**\n| | |\
    \ |---|---| | **Tier** | spine | | **Matrix domain** | 19 — Guest Mobile App & Branding (auth) + cross-cutting\
    \ staff auth | | **Requirements** | ~107 | | **Capabilities** | C35, C36, C56 | | **Consumed by**\
    \ | All platforms |\n## How to read this file\n**This file is a contract.** It is hand-authored and\
    \ it is the source of truth for one bounded context: server code, client code and mock servers are\
    \ generated from it, never the other way round. If a field is not here, it does not exist.\n**Contracts\
    \ are split into two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy,\
    \ identity,\n  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n\
    \  requires a formal change request, because every satellite has pinned against it.\n- **Satellite**\
    \ — a domain that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths`\
    \ are operations.** Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n\
    | Extension | Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From\
    \ one enum in `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the\
    \ seven-level hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected\
    \ terminal may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`,\
    \ `serverWins`, `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth:\
    \ service` (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table\
    \ name, a list of tables, or `none` with a reason. It is documentation of the mapping, not a generator\
    \ input — the DDL lives in versioned SQL migrations, because partitioning, RLS policies, `ltree` indexes\
    \ and partial indexes have no expression in OpenAPI.\n**`security` arrays hold OAuth scopes.** Empty\
    \ means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty is not the\
    \ same as absent: absent means unauthenticated.\n\n## This context\nAuthentication, session lifecycle\
    \ and effective-permission resolution.\nTwo positions from the Project Direction shape this contract:\n\
    - §3.1.1 Authorisation is user/role-driven. A user logs in from any device and\n  carries their access.\
    \ Workstation determines presentation, hardware binding,\n  till identity and reporting dimension\
    \ — never authorisation.\n- §3.1.3 Single session per user. A second login is REJECTED (409), not\n\
    \  auto-terminating the first, because auto-terminate can orphan an open cart\n  or an unclosed cash\
    \ drawer.\n\nClients never compute permissions locally. They consume `effectivePermissions` returned\
    \ at login and refreshed on demand.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
      description: Resolved per tenant from the Control Plane. Never hardcoded.
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: login
      x-ticvai-consumed-by:
        - "P04 POS-000 Sign In"
        - "P06 EMP-001 Sign in"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Venue Management Sign In"
      x-ticvai-audience:
      - anonymous
      - partner
      tags:
      - identity
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      summary: Authenticate and open a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: 'Authenticated. When the user holds exactly one role the response is complete.
            When the user holds several, `requiresRoleSelection` is true and `availableRoles` is populated
            — the caller must call /auth/select-role before the session becomes usable.

            **When `requiresMfa` is true the session is not usable until the second factor is presented**
            (decided 28 September, audit R135): the client calls `createMfaChallenge` with `action: signIn`,
            then `verifyMfaChallenge`. A principal with `requiresMfa` and no active method
            (`hasMfaMethod: false`) may only enrol one (`enrolMfaMethod`, `verifyMfaEnrolment`) before that.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '409':
          description: 'An active session already exists for this principal on another device. Per §3.1.3
            the new login is refused. A supervisor with the SESSION_FORCE_LOGOUT permission may terminate
            the existing session. **The same holds on a till somebody else is signed in to**: the sign-in
            is refused until a supervisor ends the other session with `forceLogout`; signing in never ends
            it (confirmed 28 September, audit R184).

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
  /auth/guest/verify-email:
    post:
      operationId: verifyGuestEmail
      x-ticvai-consumed-by:
        - "P01 WEB-020 Profile & Preferences"
        - "P02 GST-073 Security & Sign-in"
      security:
      - guestAuth: []
      - {}
      summary: Send a verification link, or consume one
      description: '**Raised in review by Deep.** `registerGuest` creates an account and nothing verifies
        the address on it — and **a guest account with an unverified email can receive somebody else''s
        tickets**, because a transfer is offered to an address.

        Two modes on one operation: **`send` issues a single-use token; `confirm` consumes it.** One operation
        because they are one act with two halves, and splitting them invites a `confirm` that works without
        a `send`.

        **An unverified account does not buy — decided 17 September 2026**, replacing *unverified accounts
        still buy*, which this description said while `registerGuest` and `GuestSession.isVerified` said
        the opposite. Tickets go to an address, and an unproven address is how somebody receives a
        stranger''s tickets.

        **On the guest web and the guest app, the site''s `guestCheckout` feature decides the route**
        (requirement matrix 2.6.28 and 2.6.67 — guest checkout, configurable per site). It is **off by
        default**.

        **The gate is the checkout page, not the cart** ([ADR-0045](../../docs/adr/0045-every-order-carries-a-proven-contact.md),
        18 September 2026, matrix 2.6.1 §2.4: *"On the check out page, users can log in or manually
        fill in the following details"*). The cart is open to anyone; `checkoutCart` refuses until one
        of the two routes has completed.

        - **Off:** the guest signs in, verified, at checkout. `WEB-011` and `GST-041` carry the fork.

        - **On:** the guest may check out without an account, and proves the email or mobile the tickets
        go to with a one-time code at checkout (`requestGuestOtp`, purpose `verify`) — the *dual OTP
        validation* of the reference checkout the client walked through.

        **Both routes produce a guest profile**, because the tickets have to go somewhere and the order
        has to belong to something. **A one-time checkout profile carries no credential** — recalling
        previous transactions needs access set up separately (matrix 2.6.29), which is what
        `linkGuestCheckout` does from the other direction.

        **A returning verified contact attaches to the profile already held** (matrix 22.2.8) — the new
        order, its tickets and its history, automatically, with no duplicate record. **It does not open
        that profile.** The guest sees the order just placed and nothing earlier until they authenticate
        as its owner: a code proves someone controls the mailbox today, which is enough to route a ticket
        there and not enough to hand over a history. **Any match that is not a verified contact** —
        passport, national id, an unproved phone, a similar name — **is a suggestion for the staff review
        of matrix 7.3.7**, with its audit log and rollback. A merge takes the narrower of two consents
        (CF-160).

        **The kiosk is exempt.** A walk-up pays at the kiosk and takes printed tickets, so there is no
        address to prove (matrix 2.1.10). An unverified account also cannot *receive a transfer* or
        *reset a password*, for the same reason.

        '
      tags:
      - identity
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      - anonymous
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - send
                  - confirm
                token:
                  type: string
                  nullable: true
                  description: 'For `confirm`. **Single use and short-lived** — a verification link that
                    works forever is a verification link in an old inbox. **Valid for 24 hours and sent by
                    email only** (decided 28 September, audit R126); after that `confirm` answers `410`
                    and `send` issues a new one.

                    '
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Sent, or verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVerified:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
        '410':
          description: '**The token expired or was already used.** Distinct from an invalid one — a guest
            who clicked an old link should be offered a new one rather than told they are wrong.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /password-policy:
    get:
      operationId: getPasswordPolicy
      summary: Read the password and MFA policy in force
      description: 'The read `setPasswordPolicy` never had (decided 28 September, audit R135). `setPasswordPolicy`
        replaces the whole policy, so a screen that changes one field, such as `mfaRequiredForPermissions`,
        must read the rest here and send it back unchanged. A tenant that never set one is answered with
        the defaults.

        '
      tags:
      - identity
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The policy in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
    put:
      operationId: setPasswordPolicy
      x-ticvai-consumed-by:
        - "P09 ADM-342 Authentication & MFA Policy Manager"
        - "P09 ADM-421 Venue & Operational Structure Creation"
      summary: Length, breach check, lockout and step-up
      description: 'BL-144. **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition,
        and `requireBreachCheck` stops more account takeovers than every composition rule combined.

        **`maxAgeDays` defaults to null on purpose** — forced rotation produces `Summer2026!` becoming
        `Summer2027!`. It exists because some tenants are contractually obliged to have it.

        '
      tags:
      - identity
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
  /module-capabilities:
    get:
      operationId: listModuleCapabilities
      summary: What a person can be allowed to do, per module
      description: '3.3.5, BL-110. **The checklist a grant screen renders**, and the reason the
        package does not need a role taxonomy first.

        **Derived, not authored** (`handoff/module-capabilities.json`): the 167-key vocabulary in
        `contracts/shared/permissions.yaml` crossed with every contract''s
        `x-ticvai-permission`. 232 capability pairs across 32 modules, and adding an operation
        with a permission adds it to the right checklist by existing.

        **`label` may be null and the client must render the key when it is.** 72 permissions
        carry no description yet; a generated sentence would read like a label and mean nothing,
        and **a checklist item nobody understands gets ticked anyway.**

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      parameters:
      - name: module
        in: query
        description: A contract name. Omitted returns every module.
        schema:
          type: string
      responses:
        '200':
          description: Modules and their capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleCapabilitySet'
  /principals/{principalId}/module-access:
    parameters:
    - name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPrincipalModuleAccess
      summary: What this person may do, as ticks
      description: 'BL-110. **The same shape the grant screen writes**, so what an administrator
        sees when they open it is what they saved. A read that returns a different structure from
        the write is how an interface grows a translation layer nobody maintains.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Access
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAccess'
    put:
      operationId: setPrincipalModuleAccess
      x-ticvai-conflict-policy: serverWins
      summary: Tick what they may do
      description: 'BL-110, 3.3.5. **The whole grant, replaced.** A partial update would make
        "everything else stays as it was" a claim the caller cannot verify, and access is the one
        setting where a silent survivor is a breach.

        **Segregation is checked here, while the person is deciding.** `SegregationRule` says
        which permissions one principal may not hold at once; a tick that would create a conflict
        is refused with 409 naming the rule and the other capability — rather than appearing in a
        violation report a month later, which is the same finding arriving too late to act on.

        **An `elevated` capability raises an approval rather than taking effect.** The response is
        202 with the request id when any tick is elevated, 200 when none is. Routed through
        `approvals` so that 11.1.24 — *a requester may never approve their own request* — applies
        without being restated here.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_GRANT
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ModuleAccess'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Granted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleAccess'
        '202':
          description: '**Raised for approval**, because at least one capability is elevated.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalRequestId:
                    type: string
                    format: uuid
                  elevatedCapabilities:
                    type: array
                    items:
                      type: string
        '409':
          description: '**A tick would breach a segregation rule.** Names the rule and the
            capability already held, so the person deciding can narrow one rather than guess.'
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /capability-templates:
    get:
      operationId: listCapabilityTemplates
      summary: Saved tick-sets
      description: '3.3.23, BL-110. **A role, without the taxonomy.** *Duty Manager* is a named
        set of ticks somebody saved because they grant it often — useful, and **not a thing access
        depends on.**

        **Applying a template copies its ticks and does not bind to them.** Editing one never
        widens access somebody already holds, which is what makes a role hierarchy frightening to
        change and is why most of them are never changed.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityTemplate'
    put:
      operationId: setCapabilityTemplate
      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
      x-ticvai-conflict-policy: serverWins
      summary: Save a tick-set under a name
      tags:
      - administration
      x-ticvai-permission: ROLE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityTemplate'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityTemplate'
  /segregation-rules:
    get:
      operationId: listSegregationRules
      summary: Read the conflicting-permission rules back
      description: 'BL-110, 3.3.31. **`setSegregationRules` was a PUT with no GET**, so the screen
        named above manages rules it cannot load — and nobody could audit a tenant''s controls
        without reaching the database.

        **Rules are evidence as much as configuration.** An auditor asking *"what does this venue
        forbid"* is asking a question the platform should answer without a query.

        '
      tags:
      - identity
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegregationRule'
    put:
      operationId: setSegregationRules
      x-ticvai-consumed-by:
        - "P09 ADM-340 Segregation of Duties Policy Manager"
      x-ticvai-config-scope: tenant
      summary: Which permissions may not be held together
      description: 'BL-147, 3.3.31. **Checked at grant time, not at use time** — discovering the conflict
        when somebody exercises it means the conflict already existed.

        **`allowWithCompensatingControl` is there because a small venue cannot always separate duties**,
        and a rule that cannot be satisfied is a rule that gets disabled entirely.

        '
      tags:
      - identity
      x-ticvai-permission: ROLE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rules
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/SegregationRule'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegregationRule'
  /segregation-violations:
    get:
      operationId: listSegregationViolations
      summary: Who already holds a conflicting pair
      description: 'BL-110, 3.3.31, 3.3.38. **The check runs at grant time, and a rule added today
        has said nothing about the grants made yesterday.** BL-147 was right that catching a
        conflict at use time catches it too late — but a rule that only polices future grants
        leaves the venue holding the control and not the finding.

        **This is deliberately a report and not an action.** The two automatic answers are both
        wrong: revoking on rule creation strands a venue mid-shift, and doing nothing leaves real
        exposure unreported. **A person decides, and this is what they read.**

        **Violations covered by `allowWithCompensatingControl` are flagged rather than filtered.**
        A queue that hides what has been excused stops measuring the thing it exists to measure.

        '
      tags:
      - identity
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: ruleId
        in: query
        schema:
          type: string
          format: uuid
      - name: severity
        in: query
        schema:
          type: string
          enum: [block, requireApproval, warn]
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Violations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/SegregationViolation'
  /guests/{subjectId}/data-export:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: exportSubjectData
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-066 Privacy & My Data"
      security:
      - guestAuth: []
      - bearerAuth: []
      summary: Everything the platform holds about one guest
      description: 'BL-149. **A subject access request has a statutory clock**, and answering it by hand
        across twenty-seven contracts is how a venue misses it.

        **Assembled from the lineage, not from a hand-written list.** `api-data-lineage.json` already
        knows which tables hold subject data, so the export is derived rather than maintained — **a hand-maintained
        list of personal data is a list that drifts the first time somebody adds a column.**

        Includes what is held and where it came from. **Excludes another guest''s data even where the
        two share a booking**, which is the case that makes this harder than a table dump.

        '
      tags:
      - identity
      x-ticvai-permission: GUEST_VIEW_PII
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                  - json
                  - csv
                  - pdf
                  default: json
      responses:
        '202':
