    AccessPolicy:
      type: object
      x-ticvai-persistence: identity.access_policy
      description: '3.3. **Conditions and an effect, evaluated by one engine.** A role says who you are;
        a policy says under what circumstances that is enough.


        **Which of the two policy engines this is** (stated 29 September, build pass). The package has two:
        this one, and the access contract''s `AccessDynamicPolicy` (`access.dynamic_policy`). **This one
        governs who may do what in the software**: a principal''s permissions on operations and screens
        (`permissions` names them), narrowed or extended by who, where, when and on what device, and decided by
        `evaluateAccess`. **`AccessDynamicPolicy` governs who may pass which gate**: a guest''s, holder''s or
        employee''s admission at an access point, decided in the gate''s validation with results such as
        `requireId` or `requireSupervisor` that mean nothing to a permission check. A staff member''s badge
        opening a staff door is a gate decision (access); the same staff member approving a refund is a
        permission decision (here). The overlap that remains is listed in the build readiness open items
        rather than merged in this pass.

        '
      required:
      - code
      - name
      - effect
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server on `createAccessPolicy`; the path names the policy on update.
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        isTemplate:
          type: boolean
          default: false
        permissions:
          type: array
          items:
            type: string
          description: '**Which permissions this policy speaks to.** A policy with an empty list speaks
            to all of them, which is powerful enough that it is worth being explicit about.

            '
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AccessCondition'
        combining:
          type: string
          enum:
          - allMustMatch
          - anyMayMatch
          default: allMustMatch
        effect:
          type: string
          enum:
          - permit
          - deny
          description: '**Deny wins over permit when two policies disagree.** 3.3.32 asks for
            least-privilege, and a permit that can override a deny is not least-privilege by any
            reading — it is the union of every mistake anybody has made.

            '
        priority:
          type: integer
          default: 0
        scopePath:
          type: string
          description: '3.3.40 to 3.3.43. **Tenant, venue and cross-venue policies are one mechanism**,
            because `scope_path` is prefix-comparable — `uae.dubai` contains `uae.dubai.marina` — and
            inheritance is the prefix walk rather than a second table.

            '
        appliesToRoleIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          readOnly: true
          description: '**Moved only by `setAccessPolicyState`.** A policy is created as a `draft`, and a
            status sent in a create or update body is ignored — otherwise a write could skip the approval
            3.3.26 requires.

            '
          enum:
          - draft
          - pendingApproval
          - active
          - suspended
          - retired
        version:
          type: integer
          default: 1
          readOnly: true
          description: Set by the server; every `updateAccessPolicy` writes a new version.
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        delegatedAdminRoleIds:
          type: array
          items:
            type: string
            format: uuid
          description: '3.3.35. **Who may edit this policy without being a platform administrator.** A
            venue manager tuning their own opening-hours rule should not need someone who can edit every
            tenant''s.

            '
    AccessCondition:
      type: object
      description: '**One attribute, one operator, one value** — and the attribute names are an enum
        rather than free text, because a policy that reads `venu.type` silently never matches.

        The enum is the matrix, row by row: user (3.3.7), employee (3.3.8), membership (3.3.9),
        accreditation (3.3.10), customer segment (3.3.11), resource classification (3.3.12), venue
        (3.3.13), attraction (3.3.14), device (3.3.15), day of week (3.3.16), season (3.3.17), event
        (3.3.18), capacity (3.3.19), occupancy (3.3.20), risk score (3.3.21), location (3.3.2) and time
        (3.3.3).

        '
      required:
      - attribute
      - operator
      properties:
        attribute:
          type: string
          enum:
          - user.attribute
          - employee.attribute
          - employee.onShift
          - membership.tier
          - membership.status
          - accreditation.type
          - accreditation.status
          - customer.segment
          - resource.classification
          - venue.attribute
          - venue.id
          - attraction.attribute
          - device.kind
          - device.id
          - device.trusted
          - time.ofDay
          - time.dayOfWeek
          - time.season
          - time.withinOperatingHours
          - event.id
          - event.status
          - capacity.utilisationPercent
          - occupancy.level
          - risk.score
          - ticket.status
          - location.scopePath
        key:
          type: string
          nullable: true
          description: For the `*.attribute` forms — which attribute, by code.
        operator:
          type: string
          enum:
          - equals
          - notEquals
          - in
          - notIn
          - greaterThan
          - lessThan
          - between
          - contains
          - startsWith
          - exists
        value:
          nullable: true
          description: 'The single comparand for `equals`, `notEquals`, `greaterThan`, `lessThan`,
            `contains` and `startsWith` — a string, number or boolean, by the attribute. Null for
            `exists`; `in`, `notIn` and `between` use `values`.

            '
        values:
          type: array
          items:
            type: string
    AccessContext:
      type: object
      description: '**Everything the decision is allowed to depend on.** Stated as one object so a
        simulation and a live decision see the same shape — a simulator that takes different inputs from
        the evaluator is testing something else.

        '
