      summary: A platform operator opens a time-boxed grant into this tenant
      description: '**How a TICVAI operator acts inside a tenant — decided 28 September, audit R098.** The
        Platform Console (P09) runs outside every cell, and its tenant screens call operations that live
        in the tenant''s cell. The operator **picks a tenant, then opens a grant here**, in that tenant''s
        cell: it names the permissions it carries, a reason and a window. Until it is open, a platform
        token carries no tenant permission at all; while it is open, the cell resolves the operator''s
        permissions from the grant, at tenant scope, and nothing else.

        **`PLATFORM_*` permissions never ride in a grant; they are read from the platform token** (decided
        28 September, audit R203). A cell honours one only on the few operations that name it: this one
        (`PLATFORM_TENANT_ACCESS`), `listOwnPlatformStaffGrants`, and `ai.setAiProvider`
        (`PLATFORM_TENANT_MANAGE`), which in addition requires a grant into the tenant to be open so
        the change is audited against it.

        **Time-boxed at opening and never open-ended**: `expiresAt` is at most 8 hours ahead (proposed,
        client to correct). **Every action under the grant is audited** with the grant''s id
        (`AuditRecord.platformStaffGrantId`) and **the grant itself is listed to the tenant**
        (`listPlatformStaffGrants`). A tenant never has to grant a support role for this, and cannot
        see a platform action that is not tied to a grant.

        Requires step-up: the operator holds `PLATFORM_*` permissions, which require MFA (audit R135).

        '
      tags:
      - administration
      x-ticvai-permission: PLATFORM_TENANT_ACCESS
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-step-up: mfa
      x-ticvai-step-up-reason: Opens a platform operator's access into a tenant's data.
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - permissions
              - reason
              - expiresAt
              properties:
                id:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                  description: Client-generated ULID for the grant.
                permissions:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: What the operator may do in this tenant while the grant is open. Tenant
                    permissions only; a `PLATFORM_*` value is refused `400`.
                  items:
                    $ref: ../shared/permissions.yaml#/components/schemas/Permission
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                ticketRef:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: The support case this access serves, where there is one.
                expiresAt:
                  type: string
                  format: date-time
                  description: At most 8 hours after opening (proposed, client to correct).
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Open. The operator's calls into this tenant resolve against it until `expiresAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStaffGrant'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
