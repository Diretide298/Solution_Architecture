      type: string
      enum:
      - oidc
      - saml2
    SsoProvider:
      x-ticvai-persistence: identity.sso_provider
      type: object
      required:
      - id
      - displayName
      - protocol
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        protocol:
          $ref: '#/components/schemas/SsoProtocol'
        iconAssetRef:
          type: string
          nullable: true
        isEnforced:
          type: boolean
          description: True disables password login for principals covered by this provider.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope**; the server sets it and ignores it in a request.'
    SsoGroupMapping:
      x-ticvai-persistence: identity.sso_group_mapping
      type: object
      required:
      - externalGroup
      - roleId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The table had no key at all — the response returned the external
            group, the role and the scope, which is everything a caller needs and not the row own identity.

            **(provider, external_group) is unique and would serve**, but a mapping is edited and revoked
            by an administrator, and **a row addressed by the values it holds cannot be corrected** —
            changing the group means deleting a mapping and creating another, which loses who granted
            it and when.

            '
        externalGroup:
          type: string
        roleId:
          type: string
          format: uuid
        scopePath:
          type: string
          description: Scope the mapped role is granted at.
    SsoProviderConfig:
      x-ticvai-persistence: identity.sso_provider
      type: object
      required:
      - id
      - displayName
      - protocol
      - groupMappings
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        protocol:
          $ref: '#/components/schemas/SsoProtocol'
        metadataUrl:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
        clientSecretRef:
          type: string
          nullable: true
          description: Key vault reference. The secret itself is never returned.
        groupMappings:
          type: array
          minItems: 1
          description: '**A group with no mapping grants nothing.** No default role, ever — otherwise
            the identity provider becomes a way to mint access nobody configured.

            '
          items:
            $ref: '#/components/schemas/SsoGroupMapping'
        autoProvisionPrincipals:
          type: boolean
          default: false
          description: Create a principal on first successful sign-in.
        isEnforced:
          type: boolean
          default: false
        isActive:
          type: boolean
    MfaKind:
      type: string
      enum:
      - totp
      - smsOtp
      - emailOtp
      - biometric
      - hardwareToken
    MfaMethod:
      x-ticvai-persistence: identity.mfa_method
      type: object
      required:
      - id
      - kind
      - isActive
      - enrolledAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MfaKind'
        label:
          type: string
          nullable: true
        maskedTarget:
          type: string
          nullable: true
          description: Partially masked destination, so a person can tell two methods apart.
        isActive:
          type: boolean
        isPrimary:
          type: boolean
        enrolledAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    MfaEnrolment:
      x-ticvai-persistence: none — transient
      type: object
      required:
      - methodId
      - kind
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The table had no key at all — no id, no parent and no natural
            key, so **no row could be addressed, updated or deleted.** The response schema returned everything
            a caller needs and not the row''s own identity, which is the difference between an API response
            and a table.

            '
        methodId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MfaKind'
        secret:
          type: string
          nullable: true
          description: TOTP shared secret. Returned once, at enrolment, and never again.
        qrCodeUri:
          type: string
          nullable: true
        recoveryCodes:
          type: array
          description: 'Returned once, in this enrolment response (`enrolMfaMethod` writes them, hashed,
            to `identity.mfa_recovery_code`). Not retrievable afterwards — `verifyMfaEnrolment` does not
            return them.

            '
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    SessionStatus:
      type: string
      description: >
        **The life of one signed-in session, which is not the life of a shift.** A shift holds the
        float and survives a break; a session holds the person and does not. `ShiftStatus.suspended`
        is where a break lives — *break cover; float intact, workstation released* — and the release
        of the workstation is exactly why the session ends rather than pausing: the next person
        opens their own.

        **One principal, one active session per workstation.** Enforced by the `ActiveSession`
        registry rather than by a state, because it is a fact about the set of sessions and not
        about any one of them.
      enum:
        - active            # signed in and working; the only non-terminal state
        - signedOut         # the principal ended it themselves
        - terminated        # a supervisor ended an abandoned session somebody else needed
        - expired           # idle past the timeout; the registry dropped it and freed the workstation

    ActiveSession:
      x-ticvai-persistence: none — Redis session registry
      type: object
      required:
      - sessionId
      - principalId
      - status
      - startedAt
      - lastSeenAt
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/SessionStatus'
          description: >
            **A registry that only holds live sessions cannot answer why one ended.** Kept on the
            record so a supervisor asking *what happened to till 4* gets `terminated` or `expired`
            rather than an absence.
        sessionId:
          type: string
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
        roleId:
          type: string
          format: uuid
          nullable: true
        roleName:
          type: string
          nullable: true
        workstationId:
          type: string
          format: uuid
          nullable: true
        workstationName:
          type: string
          nullable: true
        venueId:
          type: string
          format: uuid
          nullable: true
        ipAddress:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        hasOpenShift:
          type: boolean
          description: Revoking this session leaves cash unreconciled.
        mfaSatisfied:
          type: boolean
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    Principal:
      x-ticvai-persistence: identity.principal
      type: object
      required:
      - id
      - username
      - displayName
      - isActive
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        isActive:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
          description: Past this, resolution returns DENY regardless of grants.
        primaryRoleId:
          type: string
          format: uuid
          nullable: true
          description: 'Determines the landing screen when the principal holds several roles and picks
            one at login.

            '
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    CreatePrincipalRequest:
      type: object
      required:
      - username
      - displayName
      properties:
        username:
          type: string
          maxLength: 256
        displayName:
          type: string
          maxLength: 200
        initialCredential:
          type: string
          maxLength: 512
          writeOnly: true
        mustChangeCredential:
          type: boolean
          default: true
        validTo:
          type: string
          format: date-time
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    Role:
      x-ticvai-persistence: identity.role
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          x-ticvai-unique: tenant
          description: '**Unique within the tenant** (decided 28 September, audit R108). A seeded role''s
            code is reserved in every tenant. Unique per tenant, not per venue, because a grant names a
            role anywhere in the tree; `createRole` refuses a duplicate with `409 duplicate-code`.

            '
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: '**A role that grants no permissions is not a role.** `Role` carried a code, a
            name and two counts until 18 August, and `identity.role_permission` derived from it with exactly
            one column — `role_id`. **A join table that joins to nothing**, found by Hrushikant in review
            and missed by the schema audit that ran the same day.

            **The audit asked whether every table had columns, a relationship and an owner, and this table
            had all three.** What it did not ask is whether a table with one column can do the job its
            name claims.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
        inheritsFromRoleId:
          type: string
          format: uuid
          nullable: true
          description: '**Role composition, one level deep and no deeper.** A supervisor role that is
            a cashier plus three permissions is how venues actually describe them.

            **Cycles are refused and depth is capped at one**, because a permission set nobody can read
            off the screen is a permission set nobody audits.

            '
        isSystem:
          type: boolean
          default: false
          description: '**Seeded roles ship and are editable; deleting one is refused.** A venue that
            removes `cashier` and rebuilds it has two roles with one name in the audit log.

            **The seeded system roles are Cashier, Supervisor, Venue Manager, Finance and Tenant Admin**
            (proposed in `docs/active/seed-data-proposal.md` section 2, client to correct; audit R229).

            '
        principalCount:
          type: integer
        grantCount:
          type: integer
    RolePermission:
      x-ticvai-persistence: identity.role_permission
      type: object
      description: '**The grant is a row, not a value in an array.** Raised again in review on 24 August:
        `identity.role_permission` held `role_id` and `permission` and nothing else — **no record of who
        granted a permission or when.**

        Hrushikant found the first half on 18 August, when the table had one column. **The fix added the
        permission and stopped**, which is how a half-repair survives: the table now joined, so nothing
        looked wrong.

        **A permission grant is the most audited act in the platform** and it was the one write with no
        audit trail. `listAuditRecords` was built on 20 August because `platform.audit_record` was written
        by nothing — this is the other end of the same gap.

        '
      required:
      - roleId
      - permission
      properties:
        roleId:
          type: string
          format: uuid
        permission:
          $ref: ../shared/permissions.yaml#/components/schemas/Permission
        grantedAt:
          type: string
          format: date-time
        grantedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**Null for a system role.** A seeded role is granted by the platform and naming
            a person there would be a fiction.

            '
        isActive:
          type: boolean
          default: true
          description: '**Revoked rather than deleted.** A permission that vanishes from the table takes
            its history with it, and *who could do this last Tuesday* is the question an incident asks.

            '
    DelegatedAccess:
      x-ticvai-persistence: identity.delegated_access
      type: object
      required:
      - id
      - permission
      - scopePath
      - effect
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          description: From the permission enum. `*` permitted on DENY only.
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'CF-132, CL-05. **A grant held by a guest rather than a staff principal.**

            Section 5.5 asks for portfolios — a primary holder assigning entitlements, transfer between
            linked accounts, shared wallets with individual tracking — and it appears ten times across
            ten sections. **Every one of those reduces to the same question: who may act on whose behalf,
            over what, and until when.**

            **That is a grant, not a household table.** A primary holder assigning an entitlement is a
            grant. A group leader holding tickets for twelve is a grant. A corporate account enrolling
            members is a grant with a quota. **A shared wallet with individual tracking is a grant over
            a balance, and the transaction log already records who spent.**

            **A household table would answer one of those four.**

            '
        overSubjectId:
          type: string
          format: uuid
          nullable: true
          description: 'Whose behalf. **Null for a staff grant, which is the existing behaviour** — every
            grant written before 18 August means exactly what it meant before.

            '
        overObjectRef:
          type: string
          nullable: true
          description: '**Where the authority is over a thing rather than a scope** — a wallet, an entitlement,
            a booking. `scopePath` answers *where*; this answers *what*, and a guest''s authority is almost
            always over a specific object rather than a branch of the tree.

            '
        delegationKind:
          type: string
          nullable: true
          enum:
          - primaryHolder
          - familyMember
          - groupLeader
          - attendee
          - corporateAdmin
          - corporateMember
          - carer
          description: '**What kind of relationship this expresses**, for display and for reporting. The
            mechanism does not branch on it — a family member and a group attendee are the same grant
            with different words around them, which is the point.

            '
        quota:
          type: integer
          nullable: true
          description: '2.14.15 and 4.3.11. **How many the holder may assign.** A corporate account with
            fifty allocations and a family with four are the same structure with different numbers.

            '
        isRevocableBySubject:
          type: boolean
          default: true
          description: '**Whether the person it is over can end it.** A guest who linked a family member
            should be able to unlink them; a corporate member should not be able to revoke their employer''s
            oversight — and **a delegation nobody can end is a delegation somebody will regret.**

            '
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        permissionId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Taken from `identity.user_access`, 20 September, when that table was collapsed into
            this one.** `permission` above is free text; this names a row in
            `identity.permission`, the catalogue wired the same day. A grant that names a
            catalogue row can be checked against the keys the contracts actually enforce — which
            is the whole point of a catalogue that reported *154 on operations, 35 in roles.yaml,
            0 shared*.

            Nullable because a role grant carries no permission at all.
        revokedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            Taken from `identity.user_access`. This table recorded `revokedBy` and not when, so
            it could say who revoked a grant and not whether it was before or after the thing
            somebody is asking about.
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        createdByPrincipalId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateGrantRequest:
      type: object
      required:
      - permission
      - scopePath
      - effect
      properties:
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        permission:
          type: string
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - username
      - credential
      - workstationId
      properties:
        username:
          type: string
          maxLength: 256
        credential:
          type: string
          description: 'Password, PIN, card token or RFID token depending on `method`.

            '
          maxLength: 512
          writeOnly: true
        method:
          type: string
          description: '**`pin` is how a till is actually used.** A cashier signs in at a shared
            terminal between guests, and a password on a touchscreen with somebody waiting is a
            password that gets shortened, shared or written on the drawer. The employee number
            goes in `username` and the PIN in `credential`, so the shape of the request does not
            change — only what the operator types.


            **A PIN is weaker than a password and the difference is bounded by the device, not by
            the secret.** `workstationId` is required on every login and is *NOT a permission
            source*: it says which till, and the till is on a venue network in a staff area. A PIN
            is a reasonable credential there and nowhere else, which is why this is an enum value
            and not a policy flag — a surface that wants it has to ask for it by name.


            Added 10 September 2026 for `POS-000 Sign In`.

            '
          enum:
          - password
          - pin
          - card
          - rfid
          - sso
          default: password
        workstationId:
          type: string
          format: uuid
          description: 'Identifies the device. Determines Sale Board, connected hardware, till identity
            and Access Point inheritance. NOT a permission source.

            '
        deviceFingerprint:
          type: string
          maxLength: 256
    LoginResponse:
      x-ticvai-persistence: none — computed
      allOf:
      - $ref: '#/components/schemas/TokenPair'
