              false, the client must enrol one first (audit R135, R126 (5)).
          mfaMethods:
            type: array
            description: The principal's active methods, so the client can offer the right one for the
              `signIn` challenge. Empty when `requiresMfa` is false.
            items:
              $ref: '#/components/schemas/MfaMethod'
          availableRoles:
