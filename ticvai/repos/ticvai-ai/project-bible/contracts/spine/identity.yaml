  /permission-findings:
    get:
      operationId: listPermissionFindings
      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-agreed: '29 September: our build plan (7.1.47 "identify conflicts, missing permissions and excessive
        permissions"); shape follows listSegregationViolations, paged with the Page envelope'
      summary: Excessive, missing and conflicting permissions, per principal or role
      description: '7.1.47 (decided 29 September, build pass). **The analysis half of the sandbox**:
        `simulateAccessPolicy` shows what a draft would decide, and this says what is wrong with the grants as
        they stand, or as they would stand with a draft policy active (`draftPolicyId`).


        Three kinds of finding, each with the evidence that produced it:

        - **`excessive`**: a permission a principal holds (by role, delegation or policy) that no decision in
        `lookbackDays` used. Recommendation `revoke`.

        - **`missing`**: a permission the principal was denied `deniedThreshold` times or more in the window,
        which most holders of the same role at the same scope do hold. Recommendation `grant` or `review`.

        - **`conflicting`**: a pair a `SegregationRule` forbids, held together (the same test
        `listSegregationViolations` runs), so one screen shows all three.


        **Advisory.** Nothing is revoked or granted by this read; a change goes through `createDelegatedAccess`,
        the role, or a policy, with their approvals.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
