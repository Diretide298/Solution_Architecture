        rev 3 GAP-B1, per venue, superseding the second part of audit R167). The venue is `venueId` in
        the body: for `signIn` the venue the guest signed in from, for a step-up the venue of the booking,
        cart or ticket being acted on (the calling client or service passes it). Where that venue''s
