        schema:
          type: string
          format: uuid
      - name: roleId
        in: query
        schema:
          type: string
          format: uuid
      - name: scopePath
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - excessive
          - missing
          - conflicting
      - name: lookbackDays
        in: query
        description: The usage window for `excessive` and `missing`. Proposed default 90 (our build plan).
        schema:
          type: integer
          minimum: 7
          maximum: 365
          default: 90
      - name: deniedThreshold
        in: query
        schema:
          type: integer
          minimum: 1
          default: 3
      - name: draftPolicyId
        in: query
        description: Evaluate as if this draft `AccessPolicy` were active, so a policy can be checked for the
          grants it would widen or leave missing before it is submitted.
        schema:
          type: string
          format: uuid
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityPermissionFinding'
