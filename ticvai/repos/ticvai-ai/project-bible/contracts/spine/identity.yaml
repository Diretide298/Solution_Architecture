  /role-suggestions:
    get:
      operationId: suggestRoleAssignment
      x-ticvai-consumed-by:
        - "P08 BO-053 Staff Directory"
        - "P08 BO-054 Role Assignment"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56 role-assignment and provisioning recommendations);
        shape follows listPermissionFindings, paged with the Page envelope'
      summary: Which roles a person should probably hold, from peers with the same job and posting
      description: '7.1.35, 7.1.56 (decided 29 September, build pass, group G2). **Provisioning by precedent.** For a
        principal, or for a job title and posting before the principal exists, the roles held by **peers**: principals
        whose primary work assignment (`workforce.work_assignment`, `isPrimary`, in force today) has the same
        `jobTitleId` at the same posting (the assignment''s venue, department or outlet, `scopePath`). Each suggestion
        is a role at a scope with the share of peers holding it there and the evidence: how many peers, how many hold
        it, and whether the peers who hold it used it in `lookbackDays` (a role most peers hold and none use is shown
        with `recommendation` `review`, not `grant`).


        **Rules, not a model**: a count over grants (`identity.delegated_access`) and decisions
        (`identity.access_decision`), so it works on the first day. Roles the principal already holds at that scope
        are returned with `alreadyHeld` true and never recommended again.


        **Advisory. A person grants** (`createDelegatedAccess`, with its approvals where the role needs them); nothing
        is written by this read. Fewer than `minPeers` peers answers an empty page with `insufficientPeers` true,
        because a suggestion from one colleague is a copy of that colleague''s access, not a pattern.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: principalId
        in: query
        description: The person to suggest for. Their primary work assignment gives the job title and posting. Either
          this or `jobTitleId` with `scopePath`.
        schema:
          type: string
          format: uuid
      - name: jobTitleId
        in: query
        description: For somebody not yet created as a principal (onboarding). With `scopePath`.
        schema:
          type: string
          format: uuid
      - name: scopePath
        in: query
        description: The posting (venue, department or outlet) the peers are drawn from.
        schema:
          type: string
      - name: minPeerShare
        in: query
        description: Only roles held by at least this share of peers, percent. Proposed default 60 (our build plan).
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 60
      - name: minPeers
        in: query
        schema:
          type: integer
          minimum: 2
          default: 3
      - name: lookbackDays
        in: query
        schema:
          type: integer
          minimum: 7
          maximum: 365
          default: 90
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Suggested roles, highest peer share first
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    insufficientPeers:
                      type: boolean
                      description: True when fewer than `minPeers` peers were found; the page is then empty.
                    peerCount:
                      type: integer
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityRoleSuggestion'
        '400':
          description: Neither `principalId` nor `jobTitleId` with `scopePath`, or both.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          description: The principal has no primary work assignment in force, so there is no job title to compare
            (`no-work-assignment`).
          x-ticvai-problem-types:
          - no-work-assignment
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /access-review-campaigns:
    get:
      operationId: listAccessReviewCampaigns
      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56 periodic access reviews); shape follows
        listPermissionFindings'
      summary: Access review campaigns, open first
      description: 'Campaigns in the caller''s scope with their progress (`itemCount`, `decidedCount`, `revokedCount`),
        open ones first, then by `dueAt`; keyset cursor on `dueAt`, `id`.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - open
          - completed
          - expired
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityAccessReviewCampaign'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
    post:
      operationId: createAccessReviewCampaign
      x-ticvai-consumed-by:
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56 periodic access reviews, pre-filled from
        listPermissionFindings); shape follows createDelegatedAccess'
      summary: Start an access review, one item per grant in scope
      description: '7.1.35, 7.1.56 (decided 29 September, build pass, group G2). **A periodic re-certification of who
        holds what.** Creating the campaign snapshots, in the same transaction, one `IdentityAccessReviewItem` per
        grant (`identity.delegated_access`, allow, in force) inside `scopePath`, narrowed to `roleIds` where given.
        Each item names its reviewer (`reviewerMode`: the principal''s line manager from their primary work
        assignment, or the named reviewers in turn) and, with `prefillFromFindings`, carries what
        `listPermissionFindings` says about that grant (`excessive`: unused in `lookbackDays`, recommendation
        `revoke`; `conflicting`: a segregation pair, `review`; otherwise `certify`).


        **The reviewer decides; the findings only pre-fill** (`decideAccessReviewItem`). At `dueAt` undecided items
        become `notReviewed` and the grant is left as it is: **an access review that silently revokes what nobody
        looked at locks people out of their work**, so the report says what was not reviewed rather than acting on
        it. `recurrence` repeats the campaign on the same terms (a job creates the next one at the end of this one).

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAccessReviewCampaign'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created, with its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAccessReviewCampaign'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '422':
          description: '`dueAt` not in the future, `reviewerMode` `named` with no `reviewerPrincipalIds`, a
            `scopePath` outside the caller''s own, or no grant in scope to review (`nothing-to-review`).

            '
          x-ticvai-problem-types:
          - nothing-to-review
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /access-review-campaigns/{campaignId}/items:
    parameters:
    - name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listAccessReviewItems
      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56); shape follows listPermissionFindings'
      summary: The grants a campaign asks somebody to certify or revoke
      description: 'One row per grant in the campaign, with the finding that pre-filled it and the decision so far.
        `assignedToMe` is the reviewer''s own queue. Ordered by `recommendation` (revoke first), then principal; keyset
        cursor.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - certified
          - revoked
          - notReviewed
      - name: assignedToMe
        in: query
        schema:
          type: boolean
      - name: findingKind
        in: query
        schema:
          type: string
          enum:
          - none
          - excessive
          - conflicting
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Review items
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityAccessReviewItem'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
  /access-review-items/{itemId}/decision:
    parameters:
    - name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: decideAccessReviewItem
      x-ticvai-consumed-by:
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56 certify or revoke each grant); shape follows
        createDelegatedAccess'
      summary: Certify a grant, or revoke it
      description: '**`certify`** records that the reviewer confirmed the grant is still needed. **`revoke`** ends the
        grant in the same transaction (`identity.delegated_access` ends now, as when a grant is withdrawn any other
        way) and ends the holder''s live sessions, so it applies at once (audit R126). `reason` is required for
        `revoke`, and for `certify` where the item''s recommendation was `revoke` (overriding the evidence is what an
        auditor asks about).


        **Segregation of duties**: nobody decides an item for a grant they hold themselves (403). The reviewer must
        hold `PERMISSION_GRANT` at the grant''s scope, as they would to change it any other way.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_GRANT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - certify
                  - revoke
                reason:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAccessReviewItem'
        '400':
          description: '`revoke` without a `reason`, or `certify` against a `revoke` recommendation without one.'
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '403':
          description: The item is for a grant the caller holds, or the caller lacks `PERMISSION_GRANT` at its scope.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: Already decided, or the campaign is no longer `open` (`campaign-closed`).
          x-ticvai-problem-types:
          - item-decided
          - campaign-closed
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (common.yaml bearerAuth). Added 29 September (system-design review SD-054).
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
  schemas:
    IdentityRoleSuggestion:
      type: object
      x-ticvai-persistence: none — computed from workforce.work_assignment peers, identity.delegated_access and
        identity.access_decision
      description: One role suggested for a person because peers with the same job title and posting hold it (7.1.35,
        7.1.56; decided 29 September, build pass, group G2).
      required:
      - roleId
      - scopePath
      - peersHoldingPercent
      - recommendation
      properties:
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        roleName:
          type: string
        scopePath:
          type: string
          description: Where the peers hold it, and so where it would be granted.
        peerCount:
          type: integer
          description: Principals with the same job title at the same posting.
        peersHolding:
          type: integer
        peersHoldingPercent:
          type: number
          minimum: 0
          maximum: 100
        peersUsingPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Of the peers holding it, the share with a permit using one of its permissions in `lookbackDays`.
        alreadyHeld:
          type: boolean
        recommendation:
          type: string
          enum:
          - grant
          - review
          - held
          description: '`grant` where most peers hold and use it; `review` where they hold it and do not use it;
            `held` where the person has it already.'
        evidence:
          type: object
          description: What the suggestion rests on, so the person granting can check it.
          properties:
            jobTitleId:
              type: string
              format: uuid
            postingScopePath:
              type: string
            samplePeerPrincipalIds:
              type: array
              maxItems: 5
              items:
                type: string
                format: uuid
            requiresApproval:
              type: boolean
              description: Whether granting this role raises an approval (a role carrying permission or price
                authority, ApprovalKind level 2).
    IdentityAccessReviewCampaign:
      type: object
      x-ticvai-persistence: identity.access_review_campaign
      description: '**A periodic access review** (7.1.35, 7.1.56; decided 29 September, build pass, group G2): which
        grants, reviewed by whom, by when. Its items are `identity.access_review_item`. Lifecycle in
        `states/access-review-campaign.yaml`.'
      required:
      - name
      - scopePath
      - reviewerMode
      - dueAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005), and what is reviewed: every grant at or below it. Inside the
            caller''s own scope. Operations write it at `venue` scope.'
        roleIds:
          type: array
          nullable: true
          description: Only grants of these roles; null reviews every grant in scope.
          items:
            type: string
            format: uuid
        reviewerMode:
          type: string
          enum:
          - lineManager
          - named
          description: '`lineManager`: each item goes to the holder''s manager from their primary work assignment,
            falling back to the named reviewers where none is found. `named`: the named reviewers share the items.'
        reviewerPrincipalIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        dueAt:
          type: string
          format: date-time
        recurrence:
          type: string
          enum:
          - none
          - quarterly
          - semiAnnual
          - annual
          default: none
        prefillFromFindings:
          type: boolean
          default: true
        lookbackDays:
          type: integer
          minimum: 7
          maximum: 365
          default: 90
        status:
          type: string
          enum:
          - open
          - completed
          - expired
          readOnly: true
        itemCount:
          type: integer
          readOnly: true
        decidedCount:
          type: integer
          readOnly: true
          description: Kept by `decideAccessReviewItem` in the same write, so the campaign list needs no count query.
        revokedCount:
          type: integer
          readOnly: true
        createdByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    IdentityAccessReviewItem:
      type: object
      x-ticvai-persistence: identity.access_review_item
      description: One grant under review in a campaign, with the finding that pre-filled it and the reviewer's decision
        (decided 29 September, build pass, group G2). Lifecycle in `states/access-review-item.yaml`.
      required:
      - campaignId
      - delegatedAccessId
      - principalId
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaignId:
          type: string
          format: uuid
          x-ticvai-references: identity.access_review_campaign
        delegatedAccessId:
          type: string
          format: uuid
          x-ticvai-references: identity.delegated_access
          description: The grant under review.
        principalId:
          type: string
          format: uuid
          x-ticvai-references: identity.principal
        roleId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: identity.role
        scopePath:
          type: string
          description: The grant's scope. **The partition key** (ADR-0005).
        reviewerPrincipalId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: identity.principal
        findingKind:
          type: string
          enum:
          - none
          - excessive
          - conflicting
          default: none
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        recommendation:
          type: string
          enum:
          - certify
          - revoke
          - review
        status:
          type: string
          enum:
          - pending
          - certified
          - revoked
          - notReviewed
          readOnly: true
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        reason:
          type: string
          maxLength: 1000
          nullable: true
    IdentityAccessPolicyEffectiveness:
      type: object
      x-ticvai-persistence: none — computed from identity.access_decision and identity.access_override over the
        requested period
      description: One `AccessPolicy` over a period (3.3.48; decided 29 September, build pass).
      required:
      - policyId
      - evaluations
      properties:
        policyId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - draft
          - pendingApproval
          - active
          - suspended
          - retired
        versionsInPeriod:
          type: array
          items:
            type: integer
          description: The versions that decided anything in the period.
        evaluations:
          type: integer
          minimum: 0
          description: Decisions that evaluated this policy.
        matched:
