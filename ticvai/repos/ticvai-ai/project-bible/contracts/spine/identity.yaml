  /auth/guest/password:
    post:
      operationId: guestPasswordLogin
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
        - "P02 GST-042 Simple Registration & OTP"
      x-ticvai-audience:
      - anonymous
      summary: Sign in with an email or mobile and a password
      description: '**Decided 28 September, audit R073 (a).** `registerGuest` has always taken an optional
        password and nothing let a guest sign in with it, so `WEB-016` promised a sign-in that did not
        exist. This is that sign-in, beside the one-time code, social and UAE Pass routes; it returns the
        same `GuestSession`.

        **A wrong password, an unknown identifier and an account with no password are one answer**
        (`401`, the same timing), because a sign-in that tells them apart is an account enumeration
        tool. **Failed attempts count against `PasswordPolicy.lockoutAfterAttempts`** and lock the
        account for `lockoutMinutes`, never permanently; the guest can still use a one-time code.

        **A second factor only in a venue that enabled guest two-step verification** (decided 29
        September, rev 3 GAP-B1, per venue, superseding the second part of audit R167, "no guest MFA").
        The venue comes from `venueId` in the body, the venue the guest app or booking is in. Where
        that venue''s `VenueSettings.identity.guestTwoStep.enabled` is false, the default, a guest signs
        in with this, a code, a social provider or UAE Pass and nothing more. Where it is on and the
        guest has an enrolled method, the returned `GuestSession` has `requiresMfa` true and is not
        usable until `createMfaChallenge` (`action: signIn`) and `verifyMfaChallenge` succeed. With no
        `venueId`, an enrolled guest is asked when any venue of the tenant has it on (fail closed). Never with enterprise SSO (R167, first part, stands).
        **One session per device**
        (audit R126): signing in on a device ends that device''s previous guest session.

        An unverified account signs in and may browse and fill a cart; the checkout gate on
        `verifyGuestEmail` still applies.

        '
