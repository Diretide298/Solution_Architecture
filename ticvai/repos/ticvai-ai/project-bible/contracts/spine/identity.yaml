    post:
      operationId: grantDelegation
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-015 Memberships"
      security:
      - guestAuth: []
      - bearerAuth: []
      summary: Let one guest act for another
      description: 'CF-132, CL-05. **A portfolio is delegated authority, not a household table.**

        Covers a primary holder assigning entitlements, a group leader holding tickets, a corporate account
        enrolling members and a shared wallet with individual tracking — **four requirements the matrix
        raises separately and one mechanism.**

        **It inherits the audit.** Who granted what to whom, when, and whether it has expired is already
        recorded for every grant, which a bespoke family structure would have needed built.

        **This does not make the work smaller** — extending grants to guest-held, object-scoped authority
        is real work touching `orders`, `access` and `retail`. **It makes it one piece of work rather
        than four.**


        **Who grants, and the minor rule — decided 28 September, audit R126 (3).** **The account holder
        grants**: the guest whose account the authority is over (`overSubjectId`), or, where that guest is
        a minor, the adult account holder the minor is linked to. A guest caller may not grant authority
        over anybody else''s account; staff holding `GUEST_MANAGE` record a grant on the account holder''s
        behalf. **A subject with no date of birth on file is treated as a minor.** The age below which a
        subject is a minor is an open value that client counsel sets; it is not assumed here.

