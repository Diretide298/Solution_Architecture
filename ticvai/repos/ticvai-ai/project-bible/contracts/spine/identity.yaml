          nullable: true
        attributes:
          type: object
          additionalProperties: true
          description: '**Deliberately an open map**, keyed by attribute (the `AccessCondition.attribute`
            vocabulary, with `key` for the `*.attribute` forms), each value the one a condition compares
            against.
            **Supplied attributes are a fallback, not the source.** The evaluator resolves
            what it can itself; a caller that could assert its own membership tier could assert any
            membership tier.

            '
    AccessDecision:
      type: object
      x-ticvai-persistence: identity.access_decision
      description: '3.3.37. **The decision, the policy version behind it, and the attribute values it
        actually saw.** The third is what separates *the policy is wrong* from *the data was stale*.

        '
      properties:
        id:
          type: string
          format: uuid
        effect:
          type: string
          enum:
          - permit
          - deny
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          enum:
          - central
          - deviceBundle
          description: 3.3.29 against 3.3.30 — which evaluator answered.
        principalId:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
        scopePath:
          type: string
        matchedPolicies:
          type: array
          items:
            type: object
            properties:
              policyId:
                type: string
                format: uuid
              version:
                type: integer
              effect:
                type: string
              matched:
                type: boolean
              failedCondition:
                type: string
                nullable: true
        observedAttributes:
          type: object
          additionalProperties: true
          description: '**Deliberately an open map**, the same keys as `AccessContext.attributes`: the value
