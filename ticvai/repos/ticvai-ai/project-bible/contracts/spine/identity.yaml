        decision taken under it (`listAccessDecisions` names the version) must still be explainable.


        **Only a version that was approved can be restored** (`AccessPolicyVersion.approvedBy` set): a draft
        that never passed approval is not a known-good state to go back to. The new version is
        `pendingApproval` and goes through the same approval route as any policy change (`setAccessPolicyState`,
