                  maxLength: 256
                  writeOnly: true
                deviceId:
                  type: string
                  description: Names the device; a new sign-in here ends the previous session on it.
                venueId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The venue the guest app or booking is in. Identity reads that venue's
                    `VenueSettings.identity.guestTwoStep` to decide whether a second factor is asked
                    (decided 29 September, rev 3 GAP-B1, per venue).
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: 'Identifier or password not accepted, or the account is locked. One answer for all
            of them, deliberately.

            '
