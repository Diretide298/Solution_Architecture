        and context rather than fixed roles only."*

        A role grant answers *who you are*. These answer *who you are, where, when, on what device,
        under what occupancy, at what risk* — and none of that is a property of the person, so none of it
        can be baked into a role without inventing a role per combination.

        **The role model is not replaced.** Roles remain the coarse grant and a policy narrows or extends
