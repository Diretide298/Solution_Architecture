                  nullable: true
                validTo:
                  type: string
                  format: date-time
                  nullable: true
                isRevocableBySubject:
                  type: boolean
                  default: true
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccess'
        '409':
