  /guest-orders:
    post:
      operationId: createGuestFnbOrder
      x-ticvai-consumed-by:
        - "P01 WEB-036 F&B – Browse & Order"
        - "P02 GST-024 F&B – Browse & Order"
        - "P02 GST-032 AI Concierge – Chat"
        - "P05 KSK-016 Order Food"
      x-ticvai-audience:
      - guest
      summary: A guest orders food
      description: 'Order to a table, or for collection from a counter.

        **Distinct from `createFnbOrder`, which is staff-operated.** A server placing an order is trusted
        with an outlet, a table and a price. A guest is trusted with none of those: the outlet comes from
        the location session (`claimLocationSession`), the price is recomputed server-side and the quoted
        total is checked against it.

        **An order that breaks the outlet''s `FnbDeliveryPolicy` is refused with 422**, naming the rule it
        broke; a 409 is a state that changed under the guest.

        Payment is required before the kitchen sees it, unless the outlet runs a tab — a kitchen that
        cooks on an unpaid guest order is a kitchen giving food away.

        '
      tags:
      - guestOrdering
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
      - guestAuth: []
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestOrderRequest'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestOrderResult'
        '409':
          description: 'An item became unavailable, the quoted total no longer matches, the location session
            expired, or the outlet stopped taking orders. The response names which in `refusedReason`.

            '
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/GuestOrderProblem'
                - type: object
                  properties:
                    refusedReason:
                      enum:
                      - itemUnavailable
                      - priceChanged
                      - locationSessionExpired
                      - locationNotServiceable
                      - outletClosed
                      - outletNotAcceptingOrders
                      - modifierConstraintUnmet
                      - orderTooLarge
        '422':
          description: The order breaks the outlet's `FnbDeliveryPolicy`. Names the rule in `refusedReason`.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/GuestOrderProblem'
                - type: object
                  properties:
                    refusedReason:
                      enum:
                      - collectionNotOffered
                      - deliveryNotOffered
                      - belowMinimumOrder
                      - outsideDeliveryArea
                      - fulfilmentSlotClosed
        '402':
          description: Payment required or declined
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/GuestOrderProblem'
                - type: object
                  properties:
                    refusedReason:
                      enum:
                      - paymentRequired
                      - paymentDeclined
