        type: string
        format: uuid
    post:
      operationId: publishMenu
      x-ticvai-consumed-by:
        - "P08 BO-045 Menu Management"
      x-ticvai-config-scope: outlet
      summary: Make the draft live, now or on a date
      description: 'Board 2. **`updateMenu` existed, so a menu edited was a menu live** — no draft, no
        schedule, no rollback. **A venue changing prices for next Monday had to do it on Monday.**

        **Publishing is versioned and the previous version stays readable**, which is what makes rollback
        possible — and a price change that cannot be undone is a price change nobody makes on a Friday.
        Each publish writes a `MenuVersion`; `listMenuVersions` reads them back, and a publish with an
        `effectiveAt` also writes the `MenuSchedule` that `listMenuSchedules` shows as pending.

        **A scheduled publish takes effect at the outlet''s local midnight**, not the tenant''s. A venue
        in Dubai and one in London do not change menu at the same instant. The outlet''s zone is its
        Region''s time zone (`RegionSettings.timeZone`); outlets have no zone of their own.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-permission-escalated: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: Absent or null publishes now. Otherwise local midnight, in the
                    Region's time zone, of the day the menu goes live, sent as a UTC instant like
                    every date-time.
                channels:
                  type: array
                  description: Where the version goes live. Empty means every channel the outlet sells on.
                  items:
                    $ref: ../shared/common.yaml#/components/schemas/SalesChannel
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Published, or scheduled. The version written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuVersion'
