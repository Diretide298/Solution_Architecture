      x-ticvai-read-routing: replica
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: The checkpoints in scope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemperatureCheckpoint'
    put:
      operationId: setTemperatureCheckpoint
      summary: Define a checkpoint and its safe range
      description: '**The range is the configuration; the reading is the record.** `TemperatureLog`
        keeps `minCelsius` and `maxCelsius` as the snapshot in force when it was taken, for the reason
        the log already gives — *"deleting a bad reading is the one thing an inspector looks for"*, and
        silently restating the range a past reading was judged against is the same act by other means.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemperatureCheckpoint'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureCheckpoint'
