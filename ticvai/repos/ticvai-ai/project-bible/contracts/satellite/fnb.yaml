components:
  schemas:
    FnbReservationPolicy:
      type: object
      x-ticvai-persistence: fnb.reservation_policy
      description: '**How long a table is held, and what sits between one seating and the next.** The
        source of `TableReservation.durationMinutes`, which keeps its own value as the snapshot.'
      required:
      - defaultTurnMinutes
      - isActive
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
          nullable: true
          description: Null is the venue default; an outlet's own policy overrides it.
        defaultTurnMinutes:
          type: integer
          minimum: 15
          description: The turn time when no party-size band matches.
        turnTimeBands:
          type: array
          description: '**Turn time by party size** — a two-top and a table of eight do not turn at the
            same speed, and a single default is how a restaurant ends up double-booking its large
            tables. The first band whose range contains the party size wins.'
          items:
            type: object
            required:
            - fromPartySize
            - turnMinutes
            properties:
              fromPartySize:
                type: integer
                minimum: 1
              toPartySize:
                type: integer
                nullable: true
                description: Null means no upper bound.
              turnMinutes:
                type: integer
                minimum: 15
        seatingBufferMinutes:
          type: integer
          minimum: 0
          default: 0
          description: '**The reset between seatings** — clearing, laying and a moment for the floor.
            Zero is a legitimate answer and a stated one.'
        maximumDurationMinutes:
          type: integer
          nullable: true
          description: '**The ceiling on a single booking.** A reservation extended by hand past this
            needs the manager, because the table after it is somebody else''s booking.'
        isActive:
          type: boolean
        scopePath:
          type: string
    TemperatureCheckpoint:
      type: object
      x-ticvai-persistence: fnb.temperature_checkpoint
      description: '**A unit that gets read, and the range it is required to hold.** The entity
        `TemperatureLog.checkPointId` has always been required to name and that nothing defined.

        **The safe range belongs here and is snapshotted onto each reading**, so that a range revised
        in March cannot silently re-judge a reading taken in January.'
      required:
      - id
      - kind
      - label
      - isActive
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - fridge
          - freezer
          - holdingCabinet
          - blastChiller
          - coreProbe
          - delivery
          - displayCounter
          - ambient
          description: The same closed set `TemperatureLog.checkPointKind` records.
        label:
          type: string
          description: '**What the person reading it calls it** — *Walk-in 2*, *Dessert counter*. A
            checkpoint identified only by a uuid is one somebody will read the wrong unit for.'
        minCelsius:
          type: number
          nullable: true
        maxCelsius:
          type: number
          nullable: true
          description: '**Null at either end is legitimate** — a core probe has a floor and no ceiling.
            Both null is not, and is what an unconfigured checkpoint looks like.'
        checkFrequencyMinutes:
          type: integer
          nullable: true
          description: '**How often it must be read.** The gap this leaves open otherwise is the one an
            inspector finds: not a bad reading, but a missing one.'
        requiresCorrectiveActionOnBreach:
          type: boolean
        isActive:
          type: boolean
        scopePath:
          type: string
    FnbServiceChargePolicy:
      type: object
      x-ticvai-persistence: fnb.service_charge_policy
      description: '**What the service charge on a bill is, and where it came from.** Every field here
        answers a question `fnb.sub_bill.service_charge` was being asked and could not answer.

        **Tax and service charge recompute per bill on a split** (`F29`), so the policy is resolved per
        bill rather than apportioned from the visit — which only works if there is a policy to resolve.'
      required:
      - basis
      - isTaxable
      - isDiscretionary
      - distribution
      properties:
        id:
          type: string
          format: uuid
        basis:
          type: string
          enum:
          - none
          - percentOfSubtotal
          - fixedPerCover
          - fixedPerBill
          description: '`none` is a real answer and the default. **A venue that does not levy one should
            say so**, rather than leaving a null that reads as unconfigured.'
        ratePercent:
          type: number
          nullable: true
          description: Set when `basis` is `percentOfSubtotal`.
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        minimumPartySize:
          type: integer
          nullable: true
          description: '**The common case for an automatic charge** — parties of six and above. Null
            applies it to every cover.'
        serviceTypes:
          type: array
          items:
            type: string
            enum:
            - dineIn
            - takeaway
            - delivery
            - roomService
          description: '**A delivery order charged a dine-in service charge is a complaint.** Empty means
            every service type.'
        isTaxable:
          type: boolean
          description: '**Whether VAT applies to the charge itself.** It does in the UAE, and a bill that
            taxes the subtotal but not the charge is understated.'
        includedInDisplayPrice:
          type: boolean
          description: '**Menu-price inclusive or added at the bill.** The pair of this and
            `shownSeparately` is what a guest is entitled to see before ordering.'
        shownSeparately:
          type: boolean
        isDiscretionary:
          type: boolean
          description: '**Whether a guest may have it removed.** A charge that cannot be declined is a
            price; a charge that can is a request, and the bill has to say which.'
        distribution:
          type: string
          enum:
          - venueRevenue
          - staffPool
          - split
          description: '**Not a tip.** `orders` separates `serviceCharge` from a gratuity because it is
            revenue in most jurisdictions and pooling the two is how a payroll dispute starts. This is
            the field that carries the distinction into payroll.'
        staffPoolPercent:
          type: number
          nullable: true
          description: Set when `distribution` is `split`.
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
