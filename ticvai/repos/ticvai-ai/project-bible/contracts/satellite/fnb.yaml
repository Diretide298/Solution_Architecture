      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/MenuSchedule'
    post:
      operationId: scheduleMenuPublish
      x-ticvai-consumed-by:
        - "P08 BO-045 Menu Management"
      x-ticvai-config-scope: outlet
      summary: Publish it on a date, not now
      description: 'Board 2J. **`publishMenu` took an `effectiveAt` and nothing listed or cancelled what
        was pending.** A venue with three scheduled price changes had no way to see them. Pending schedules
        are now read with `listMenuSchedules`, and `cancelScheduleId` cancels one of them.

        **One schedule per menu per date.** A second schedule for a date that already has one is refused
        with the existing schedule named (flow F31) — cancel it first.

        **Takes effect at the outlet''s local midnight**, not the tenant''s — a venue in Dubai and one
        in London do not change menu at the same instant. The outlet''s zone is its Region''s time zone
        (`RegionSettings.timeZone`); outlets have no zone of their own.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
