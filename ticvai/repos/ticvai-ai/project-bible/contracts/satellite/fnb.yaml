              menuItemId:
                type: string
                format: uuid
              upcharge:
                $ref: ../shared/common.yaml#/components/schemas/Money
              isDefault:
                type: boolean
                default: false
                description: '**The one a cashier gets without asking.** A combo with no default is four
                  taps at every till in the venue.

                  '
    KitchenException:
      type: object
      x-ticvai-persistence: fnb.kitchen_exception
      description: 'Board 3, 24 August. **Something that cost the kitchen a service and left no other
        trace** — equipment down, an item run out mid-ticket, a late delivery, a station short.

        `refireItem` covers a dish. **This covers the reasons a venue looking at a bad Saturday needs**,
        and which currently live in somebody''s memory.

        '
      required:
      - id
      - kind
      - raisedAt
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
          nullable: true
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          nullable: true
        kind:
          type: string
          enum:
          - equipmentDown
          - itemRanOut
          - lateDelivery
          - staffShort
          - powerLoss
          - spillage
          - chased
          - other
        durationMinutes:
          type: integer
          nullable: true
        raisedAt:
          type: string
          format: date-time
        raisedByPrincipalId:
          type: string
          format: uuid
        note:
          type: string
          nullable: true
    EightySixEvent:
      type: object
      x-ticvai-persistence: fnb.sold_out_item
      description: 'Board 5J. **`setItemAvailability` recorded the current state and not the history.**
        An item 86''d at 7pm on a Saturday is a lost-sales figure and a prep-planning signal, and the
        package kept only the flag.

        **`refusedOrderCount` is what makes it worth keeping.** *Off for ninety minutes* is a note; *off
        for ninety minutes and eleven guests asked for it* is a purchasing decision.

        '
      required:
      - id
      - menuItemId
      - offAt
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        menuItemId:
          type: string
          format: uuid
        offAt:
          type: string
          format: date-time
        backAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          enum:
          - ranOut
          - qualityIssue
          - equipmentDown
          - supplierFailure
          - seasonal
          - other
        calledByPrincipalId:
          type: string
          format: uuid
        refusedOrderCount:
          type: integer
          default: 0
          readOnly: true
    SubBill:
      type: object
      x-ticvai-persistence: fnb.sub_bill
      description: 'One bill from a split. **Tax and service charge recompute per bill rather than apportioning
        pro rata** — a split that divides VAT by percentage produces bills that do not sum to the original,
        and the difference is a fils somebody has to explain at close.

