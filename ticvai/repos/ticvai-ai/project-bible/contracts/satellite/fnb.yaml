        line with at most a price delta.

        '
      required:
      - id
      - code
      - name
      - minSelections
      - maxSelections
      - options
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        minSelections:
          type: integer
          minimum: 0
          description: Greater than zero makes the group required.
        maxSelections:
          type: integer
          minimum: 1
        options:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - id
            - name
            - priceDelta
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              priceDelta:
                $ref: ../shared/common.yaml#/components/schemas/Money
              isDefault:
                type: boolean
              isAvailable:
                type: boolean
              allergens:
                type: array
                description: What choosing this option adds to the dish. `attachModifierGroup` refuses a group
                  that adds one the item does not declare, and `verifyAllergens` reports it as `via` `modifier`.
                items:
                  $ref: '#/components/schemas/AllergenCode'
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    FnbOrderStatus:
      type: string
      description: 'The full lifecycle from 4.6.35. Nine states, not six — the earlier enum collapsed
        `accepted` into `placed` and had no `collected` or `delivered` at all, which made collection and
        delivery indistinguishable from a server putting a plate down.

        `accepted` matters because an outlet may refuse: past last orders, out of a key ingredient, or
        simply too far behind. A guest whose order sat in `placed` for ten minutes and was then rejected
        has a worse experience than one refused immediately.

        '
