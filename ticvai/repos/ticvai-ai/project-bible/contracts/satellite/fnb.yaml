        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComboSlot'
        availability:
          allOf:
          - $ref: '#/components/schemas/MenuAvailability'
          nullable: true
          description: 'Service periods it sells in, in the same shape as a menu''s. **A lunch deal at 9pm is a margin leak** and the
            venue only notices at month end.

            '
        isActive:
          type: boolean
          default: true
    ComboSlot:
      type: object
      x-ticvai-persistence: fnb.combo_slot
      description: 'One choice within a combo. **`minSelect` and `maxSelect` are what make it a slot rather
        than a line** — a main is exactly one, a side is one of four, and a sauce might be none or two.

        '
      required:
