  /food-safety/checkpoints:
    get:
      operationId: listTemperatureCheckpoints
      summary: The units that get read, and the range each must hold
      description: '**`TemperatureLog.checkPointId` is required and pointed at nothing.** No
        `fnb.check_point` existed in 628 tables, so every HACCP reading was obliged to reference a
        definition the package had never modelled — and `minCelsius` and `maxCelsius` were written onto
        each reading with no source.

        **This is a compliance gap, not a modelling preference.** `TemperatureLog` says it itself:
        *"HACCP records are a UAE regulatory obligation, they are inspected."* An inspector asks what
        range a freezer is required to hold, and a range that exists only on the readings that happened
        cannot answer — least of all for the reading nobody took.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
