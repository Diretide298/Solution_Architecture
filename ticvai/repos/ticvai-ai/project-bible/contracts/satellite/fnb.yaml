      description: '**Superseded by `claimLocationSession`, 26 September.** That operation is *one operation
        for all of them* — a table is a `DeliveryLocation` of kind `table` with its `tableId` — and it is the
        one `CreateGuestOrderRequest.locationSessionId`, flow F11 and flow F48 use. A `TableSession` id has
        nowhere to go on a guest order. Kept, with its path and id, for callers already built on it; new
        screens claim with `claimLocationSession`.

        Scanning the QR code on a table. This is the step that makes ordering to a table possible
        without a server — the guest tells the platform where they are.

        **A claim is not a booking.** It attaches the guest to a table so an order can be routed there.
        Where a visit is already open — a server seated them — the guest joins it rather than starting
        a second one, and both order onto the same bill.

