          description: The outlet in the path.
        defaultCoursing:
          $ref: '#/components/schemas/CoursingPolicy'
        courseNames:
          type: array
          items:
            type: string
        autoFireMinutes:
          type: integer
          nullable: true
        serviceModeOverrides:
          type: object
          description: A different default per service mode.
          propertyNames:
            $ref: '#/components/schemas/ServiceMode'
          additionalProperties:
            $ref: '#/components/schemas/CoursingPolicy'
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Operations write it at `outlet` scope.'
    TableCombination:
      type: object
      x-ticvai-persistence: fnb.table_combination
      description: '**Tables that can be pushed together, and what they seat together.** Declared by a host
        rather than inferred from a floor plan — a pillar, a step or a service run stops two adjacent tables
        combining. `setTableCombinations` writes the outlet''s set.

        '
      required:
      - tableIds
      - combinedCovers
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        outletId:
          type: string
          format: uuid
          readOnly: true
          description: The outlet in the path.
        tableIds:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid
        combinedCovers:
          type: integer
          minimum: 1
        setupMinutes:
          type: integer
          default: 5
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Operations write it at `outlet` scope.'
    SectionLayout:
      type: object
      description: An outlet's floor divided into sections, each with its server (`setSectionLayout`).
      required:
      - sections
      properties:
        sections:
          type: array
          items:
            type: object
            required:
            - name
            - tableIds
            properties:
              name:
                type: string
              tableIds:
                type: array
                items:
                  type: string
                  format: uuid
              serverPrincipalId:
                type: string
                format: uuid
                nullable: true
              servicePeriod:
                type: string
                nullable: true
    KitchenSla:
      type: object
      description: '**How long a ticket may sit, per service mode, and what pushes it up the rail**
        (`setKitchenSla`). The priority weights are the ones `listKitchenTickets` orders the rail by.

        '
      properties:
        targets:
          type: array
          items:
            type: object
            required:
            - serviceMode
            - targetMinutes
            properties:
              serviceMode:
                $ref: '#/components/schemas/ServiceMode'
              targetMinutes:
                type: integer
                minimum: 1
              warnAtPercent:
                type: integer
                default: 80
        priorityWeights:
          type: object
          description: The weight of each signal the board names — age, promise time, table stage, a VIP marker.
          properties:
            age:
              type: integer
              minimum: 0
            targetReadyAt:
              type: integer
              minimum: 0
              description: Promise time.
            tableStage:
              type: integer
              minimum: 0
            vip:
              type: integer
              minimum: 0
    StationRebalance:
      type: object
      description: '**A temporary move of work between stations** (`rebalanceStationLoad`). Reverts at
        `revertAt`, or at close where that is null — a permanent change is `setKitchenStations`.

        '
      required:
      - moves
      properties:
        moves:
          type: array
          items:
            type: object
            required:
            - fromStationId
            - toStationId
            properties:
              fromStationId:
                type: string
                format: uuid
              toStationId:
                type: string
                format: uuid
              categoryIds:
                type: array
                items:
                  type: string
                  format: uuid
        revertAt:
          type: string
          format: date-time
          nullable: true
    OrderLabel:
      type: object
      x-ticvai-persistence: none — rendered from the kitchen ticket and its order
      description: '**What goes on the bag** (`printOrderLabel`). Order number, guest name, items and **the
        allergen flags, which are the reason the label is rendered by the server** from the same source
        as the order rather than printed from whatever the client has.

        '
      required:
      - ticketId
      - orderNumber
      - lines
      - allergens
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        orderNumber:
          type: string
        guestName:
          type: string
          nullable: true
        serviceMode:
          $ref: '#/components/schemas/ServiceMode'
        deliveryLabel:
          type: string
          nullable: true
          description: Where it is going, as a runner would read it.
        buzzerCode:
          type: string
          nullable: true
        lines:
          type: array
          items:
            type: object
            required:
            - name
            - quantity
            properties:
              name:
                type: string
              quantity:
                type: integer
              modifiers:
                type: array
                items:
                  type: string
              allergens:
                type: array
                items:
                  $ref: '#/components/schemas/AllergenCode'
        allergens:
          type: array
          description: Every allergen on the order, together. Present and possibly empty — never omitted.
          items:
            $ref: '#/components/schemas/AllergenCode'
    BookingMessageReceipt:
      type: object
      x-ticvai-persistence: none — response shape
      description: What `sendBookingConfirmation` queued.
      required:
      - reservationId
      - kind
      - queuedAt
      properties:
        reservationId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - confirmation
          - reminder
          - reconfirmationRequest
          - cancellation
        channel:
          type: string
          nullable: true
          enum:
          - email
          - sms
          - whatsapp
        queuedAt:
          type: string
          format: date-time
        releaseIfUnconfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Where `requiresReconfirmation` was set, when the table goes back if nobody answers.
    RecountResult:
      type: object
      x-ticvai-persistence: none — response shape
      description: The lines `requestRecount` reopened.
      required:
      - countId
      - reopenedLineIds
      properties:
        countId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        reopenedLineIds:
          type: array
          items:
            type: string
            format: uuid
        reason:
          type: string
          nullable: true
    MenuVersion:
      type: object
      x-ticvai-persistence: fnb.menu_version
      description: '**One published state of a menu, kept.** `publishMenu` writes one, `rollbackMenu`
        writes a new one from an older one, and `listMenuVersions` reads them — the previous version stays
        readable, which is what makes rollback and *what were we charging at noon* possible. **A version
        is never edited**; a menu history that can be edited cannot answer a refund dispute.

        Statuses follow flow F31: a new version is `draft` while the live one keeps selling, `scheduled`
        once dated, `live`, and `superseded` when a later version goes live.

        '
      required:
      - id
      - menuId
      - version
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        menuId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - draft
          - scheduled
          - live
          - superseded
        effectiveAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        publishedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        restoredFromVersion:
          type: integer
          nullable: true
          description: Set on a version written by `rollbackMenu` — the version it restored.
        channels:
          type: array
          items:
            $ref: ../shared/common.yaml#/components/schemas/SalesChannel
        note:
          type: string
          nullable: true
        availability:
          $ref: '#/components/schemas/MenuAvailability'
        sections:
          type: array
          description: The sections and items as published. The snapshot, not a reference to the live rows.
          items:
            $ref: '#/components/schemas/MenuSection'
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Operations write it at `venue` scope.'
    MenuSchedule:
      type: object
      x-ticvai-persistence: fnb.menu_schedule
      description: '**A publish dated for later** (`scheduleMenuPublish`, or `publishMenu` with an
        `effectiveAt`). Listed by `listMenuSchedules` while `pending`, so a venue with three scheduled
        price changes can see them; one per menu per date.

        '
      required:
      - id
      - menuId
      - effectiveAt
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        menuId:
          type: string
          format: uuid
        effectiveAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - applied
          - cancelled
        publishedVersion:
          type: integer
          nullable: true
          readOnly: true
          description: The `MenuVersion.version` that went live when the schedule fired. Null until then.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Operations write it at `venue` scope.'
    MenuActionSelector:
      type: object
      description: '**Which items a bulk action touches.** At least one criterion; several narrow each
        other. *Reprice all* and *reprice all in this section* are different selectors on purpose, and the
        preview says how many items each one reaches.

        '
      minProperties: 1
      properties:
        menuItemIds:
          type: array
          items:
            type: string
            format: uuid
        sectionCodes:
          type: array
          description: '`MenuSection.code` values on this menu.'
          items:
            type: string
        allItems:
          type: boolean
          description: Every item on the menu. Stated rather than implied by an empty selector.
    MenuActionValue:
      type: object
      description: 'What the action sets. **One field per kind**: `reprice` takes `percentChange` or
        `price`; `moveSection` takes `toSectionCode`; `setAvailability` takes `isAvailable`; `setTax` takes
        `taxCode`; `retire` and `activate` take none.

        '
      properties:
        percentChange:
          type: number
          description: Signed. `-5` is five per cent off.
        price:
          $ref: ../shared/common.yaml#/components/schemas/Money
        toSectionCode:
          type: string
        isAvailable:
          type: boolean
        taxCode:
          type: string
          description: A tax code from the finance tax engine.
    MenuActionResult:
      type: object
      x-ticvai-persistence: none — response shape
      description: '**The preview, or what was applied** (`applyMenuActions`). The same shape either way,
        so the screen that showed the preview shows the result.

        '
      required:
      - applied
      - actions
      properties:
        applied:
          type: boolean
          description: False for a preview (`previewOnly`), true once applied.
        actions:
          type: array
          items:
            type: object
            required:
            - index
            - kind
            - affectedItemCount
            properties:
              index:
                type: integer
                description: The action's position in the request.
              kind:
                type: string
                enum:
                - reprice
                - retire
                - activate
                - moveSection
                - setAvailability
                - setTax
              affectedItemCount:
                type: integer
                description: '**How many items it touches** — the number the preview exists to show.'
              affectedMenuItemIds:
                type: array
                items:
                  type: string
                  format: uuid
        appliedAt:
          type: string
          format: date-time
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
