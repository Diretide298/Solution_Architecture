      summary: Put the previous version back
      description: 'Board 2. **The reason to version a menu at all.** A price published wrong at 11am
        on a Saturday needs one action, not a re-edit of forty items under pressure.

        **Rolls forward, never backwards.** The restored version becomes a new version rather than deleting
