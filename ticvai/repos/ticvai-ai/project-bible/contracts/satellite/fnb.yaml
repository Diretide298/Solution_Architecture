openapi: 3.1.0
info:
  title: TICVAI Food & Beverage
  version: 0.1.0
  x-ticvai-screen-count: 87
  x-ticvai-tier: satellite
  x-ticvai-module: 7 — F&B POS  ·  5 — F&B & Guest Management (service)
  x-ticvai-requirements: 151
  x-ticvai-capabilities:
  - C05
  - C06
  - C07
  - C08
  - C27
  - C36
  - C90
  x-ticvai-platforms:
  - P04 POS
  - P02 Guest App
  - P15 Kitchen Display
  description: "## What this contract covers\n**Menus, table service and kitchen handoff. The kitchen display\
    \ is built here too (P15).**\n| | | |---|---| | **Tier** | satellite | | **Matrix domain** | 7 — F&B POS\
    \  ·  5 — F&B & Guest Management (service) | | **Requirements** | ~151 | | **Capabilities** | C05,\
    \ C06, C07, C08, C27, C36, C90 | | **Consumed by** | P04 POS · P02 Guest App · P15 Kitchen Display |\n\
    ## How to read this file\n**This file is a contract.** It is hand-authored and it is the source of\
    \ truth for one bounded context: server code, client code and mock servers are generated from it,\
    \ never the other way round. If a field is not here, it does not exist.\n**Contracts are split into\
    \ two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy, identity,\n\
    \  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n  requires\
    \ a formal change request, because every satellite has pinned against it.\n- **Satellite** — a domain\
    \ that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths` are operations.**\
    \ Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n| Extension |\
    \ Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From one enum in\
    \ `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the seven-level\
    \ hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected terminal\
    \ may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`,\
    \ `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`\
    \ (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**`security` arrays hold OAuth scopes.** Empty means \"this scheme, no scopes\" — for\
    \ bearer tokens there is nothing to list. Empty is not the same as absent: absent means unauthenticated.\n\
    \n## This context\nMenus, modifiers, quick-service ordering, table service, bill splitting and kitchen\
    \ handoff. Domains 4 and 7 — roughly 190 requirements.\nPositions this encodes:\n- **The kitchen display is TICVAI's own** (19 Sep, replacing the 31 Jul §11 *KDS integration\
    \ only*). P15 Kitchen Display runs on any commodity touchscreen and reads\n  `listKitchenTickets`;\
    \ the station mapping, the routing rules and the offline fallback are ours (18 Aug\n  minute), and no\
    \ KDS vendor is integrated.\n- **Menus\
    \ read from the local bundle** at point of sale, like the rest of the catalogue\n  (ADR-0013). The\
    \ endpoints here that a terminal calls on the transaction path are order\n  submission and table state\
    \ — not menu retrieval.\n- **A table visit is not an order.** A guest sits, orders, orders again,\
    \ then pays. The\n  visit accumulates; orders attach to it; the bill closes it.\n- **Splitting happens\
    \ at close, not at order time.** By amount, by covers, or by\n  category — 03 Aug §5. A split computed\
    \ at order time falls apart the moment someone\n  orders another drink.\n- Stock depletion for recipe-linked\
    \ items is real-time, so **F&B is blocked offline\n  where inventory is tracked**, and available offline\
    \ where it is not.\n\n## Dates and clock times are local\n**Every `format: date` field\
    \ and parameter here is a calendar day in the Region's time zone** (`RegionSettings.timeZone`,\n\
    \  which every venue and outlet inherits and cannot override), running from local midnight to\n  local\
    \ midnight. Not UTC: in the Gulf a UTC day starts at four in the morning, and a\n  reservation list\
    \ read by UTC days moves the late sitting onto the wrong date. **Wall-clock\n  times** (`HH:mm`, such\
    \ as `MenuAvailability.startTime`) are read in the same zone. An\n  outlet's local midnight is midnight\
    \ in its Region's zone. Instants (`date-time`) stay\n  UTC, as everywhere else (naming-and-style\
    \ 5.2).\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: guestOrdering
- name: menu
- name: modifier
- name: order
- name: table
- name: bill
- name: kitchen
- name: production
paths:
  /reservation-policy:
    get:
      operationId: getFnbReservationPolicy
      summary: How long a table is held, by party size
      description: '**`fnb.table_reservation.duration_minutes` was set per booking with no default
        behind it.** A turn time is the single most tuned number in a restaurant — it differs by party
        size, by service and by day — and every reservation was choosing its own.

        **Found by `tools/audit-uncontrolled-values.py`.** It cannot confirm this fix itself: the
        column is `duration_minutes`, and `duration` is too generic a stem to pair on, so the verdict
        is recorded by hand in `handoff/values-without-configuration.md` with this operation as its
        citation.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: outletId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: The outlet's own policy if it has one, otherwise the venue default.
      responses:
        '200':
          description: The policy in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FnbReservationPolicy'
    put:
      operationId: setFnbReservationPolicy
      summary: Set turn times and seating buffers
      description: '**The booking keeps its own duration as the snapshot.** A turn time revised in
        March must not shorten a reservation already made in February — the same rule-and-record
        split as `fnb.service_charge_policy` and `orders.order_fee`.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FnbReservationPolicy'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FnbReservationPolicy'
  /service-charge-policy:
    get:
      operationId: getFnbServiceChargePolicy
      summary: The service charge a venue applies, and on what
      description: '**`fnb.sub_bill.service_charge` was stored and nothing said what the rate was.**
        `F29` recomputes tax and service charge per bill on a split rather than apportioning them, so
        a rate was being applied at least twice over a single visit and lived only in whatever the
        implementer assumed.

        **Found by `tools/audit-uncontrolled-values.py`**, which pairs an applied value against the
        configuration that sets it and reported this one as having none. `rental.fee_policy` is the
        shape being followed here.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: The policy in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FnbServiceChargePolicy'
    put:
      operationId: setFnbServiceChargePolicy
      summary: Set the service charge
      description: '**A service charge is revenue, not a tip** — `orders` already separates the two
        deliberately, *"it is revenue in most jurisdictions, and pooling it with tips is how a payroll
        dispute starts."* `distribution` carries that distinction into the configuration rather than
        leaving it to whoever writes the payroll export.

        **`isDiscretionary` is the field a regulator reads first.** A charge a guest cannot decline is
        a price, and a price has to be in the displayed total.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FnbServiceChargePolicy'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FnbServiceChargePolicy'
  /substitution-rules:
    put:
      operationId: setSubstitutionRules
      x-ticvai-consumed-by:
        - "P08 BO-111 Ingredient Substitution, Allergen & Nutrition"
      summary: What may replace what
      description: 'Board 2L. **A kitchen substitutes constantly and the package could not say which swaps
        are allowed.**

        **`requiresApproval` defaults true wherever the swap changes an allergen.** A chef may substitute
        freely within a claim; changing the claim is somebody else''s decision.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rules
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/SubstitutionRule'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubstitutionRule'
  /menu-items/{menuItemId}/verify-allergens:
    parameters:
    - name: menuItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: verifyAllergens
      x-ticvai-consumed-by:
        - "P08 BO-045 Menu Management"
        - "P08 BO-111 Ingredient Substitution, Allergen & Nutrition"
      summary: Does this dish still match its claim?
      description: 'Board 2L, and **the operation the whole frame exists for.** BL-127 built allergens
        on 18 August and built substitution nowhere — so **a substituted ingredient changed the dish and
        never changed the label.**

        **Walks the recipe, its substitutions and its modifier groups**, and compares what is actually
        in the dish against what the menu claims. Three places an allergen can enter and the package checked
        none of them together.

        **A dish still labelled nut-free after a swap nobody checked is what this prevents**, and that
        is not a data-quality problem — it is somebody in an ambulance.

        **Run on every recipe change, not on demand.** An operation a kitchen must remember to call is
        an operation nobody calls on the day it matters.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: The verdict, and where any discrepancy came from
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: boolean
                  declared:
                    type: array
                    items:
                      type: string
                  actual:
                    type: array
                    items:
                      type: string
                  undeclared:
                    type: array
                    description: '**Present in the dish and absent from the label.** The dangerous direction,
                      and the response leads with it.

                      '
                    items:
                      type: object
                      properties:
                        allergen:
                          type: string
                        via:
                          type: string
                          enum:
                          - ingredient
                          - substitution
                          - modifier
                          - sharedEquipment
                        sourceRef:
                          type: string
                  overDeclared:
                    type: array
                    description: 'Labelled and no longer present. **Safe, and still worth fixing** — a
                      menu that over-declares teaches guests the labels are guesses.

                      '
                    items:
                      type: string
  /production-plans:
    post:
      operationId: buildProductionPlan
      x-ticvai-consumed-by:
        - "P08 BO-136 F&B Global Settings & Controls"
      summary: Turn a forecast into a prep list
      description: 'Board 2M. **Demand forecast through recipes to quantities per item and per station.**

        **Draft, always.** The plan starts from `requestSuggestion(kind=prepPlan)` and is edited before
        it is released — **a forecast a chef cannot overrule is a forecast a chef ignores**, and the edit
        is the signal that trains the next one.

        **The suggested quantity is kept beside the planned one**, the same rule as `updateRequisitionLines`:
        the gap is the evidence the forecast is wrong.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionPlan'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Drafted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionPlan'
  /production-plans/{planId}/release:
    parameters:
    - name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: releaseProductionPlan
      x-ticvai-consumed-by:
        - "P08 BO-136 F&B Global Settings & Controls"
      summary: Make the plan real
      description: 'Board 2M. **A plan becomes production runs**, one per line or grouped by station.

        **Separate from building it because a plan is edited before it is released.** A plan that creates
        runs as it is drafted creates runs nobody asked for, and a kitchen that finds yesterday''s abandoned
        draft in today''s prep list stops trusting the list.

        **Releasing calls `recordSuggestionOutcome`; it does not write the outcome itself.** ADR-0020:
        only the AI contract writes AI tables — **the fourth time that boundary has caught a write in
        this package**, and every time the operation looked reasonable.

        The label matters: planned quantities against the forecast are what make a model possible later,
        and the record has to exist for that to be true.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Released, with the runs it created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionPlan'
  /production-runs/{runId}:
    parameters:
    - name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getProductionRun
      x-ticvai-consumed-by:
        - "P08 BO-137 Recipe Consumption & Theoretical Inventory"
      summary: One run — its plan, its output, and the gap
      description: 'Board 5D and 2M. **The prep sheet, the batch detail and the yield are three views
        of one run**, and the boards drew them as three panels.

        **Yield is derived, never stored.** Planned quantity against `completeProductionRun`''s actual
        — **a stored yield survives a correction to the actual and becomes a number nobody can reconcile.**

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionRun'
  /table-reservations/{reservationId}/confirm:
    parameters:
    - name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: sendBookingConfirmation
      summary: Confirm a booking, and ask them to confirm back
      description: 'Board 4E, 24 August. **A reservation nobody confirms is a no-show waiting to happen**,
        and the package created bookings and never told anybody about them.

        **The reminder matters more than the confirmation.** A booking made three weeks out is forgotten;
        one reminded of the day before is kept, and **the no-show rate between those two is the difference
        between a full Saturday and an empty one.**

        **`requiresReconfirmation` puts the table back if they do not answer.** A venue holding a table
        for a party that stopped caring is a venue turning away a walk-in — but it is a policy rather
        than a default, because **a venue that releases a real booking has done worse than hold an empty
        table.**

        '
      tags:
      - fnb
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - whatsapp
                kind:
                  type: string
                  enum:
                  - confirmation
                  - reminder
                  - reconfirmationRequest
                  - cancellation
                  default: confirmation
                requiresReconfirmation:
                  type: boolean
                  default: false
                releaseIfUnconfirmedHours:
                  type: integer
                  nullable: true
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Queued for sending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingMessageReceipt'
  /table-reservations/conflicts:
    get:
      operationId: resolveBookingConflict
      summary: Two bookings, one table — and what to do about it
      description: 'Board 4D. **Double bookings happen and the package had no way to see one.** A phone
        booking and an online booking land on the same table for the same hour, and the host finds out
        when the second party arrives.

        **Returns the conflicts and the options, never resolves silently.** Moving a booking is a decision
        with a guest attached — the alternatives are a different table, an earlier slot, a combination,
        or a call — and **a system that picks one has picked wrong for somebody.**

        **Ranks by which party is easier to move.** A party of two at 6pm has options; a party of twelve
        at 8pm on a Saturday does not.

        '
      tags:
      - fnb
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: date
        in: query
        description: A calendar day, in the Region's time zone, not UTC.
        schema:
          type: string
          format: date
      - name: outletId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Conflicts, each with its options
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tableId:
                      type: string
                      format: uuid
                    reservationIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                    overlapMinutes:
                      type: integer
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - alternativeTable
                            - earlierSlot
                            - laterSlot
                            - combineTables
                            - contactGuest
                          detail:
                            type: string
                          disruptionScore:
                            type: integer
                            description: '**Lower is easier to move.** A party of two at 6pm has options;
                              a party of twelve at 8pm on a Saturday does not.

                              '
  /tables:
    post:
      operationId: createTable
      summary: A table as a thing, not an inference
      description: 'Board 4C, 24 August. **The package inferred a table from a visit and from `setTableLayout`**,
        and `setSectionLayout` and `setTableCombinations` — both built this week — reference a table that
        is not a first-class row.

        **A table has a capacity, a shape, a section and a state whether anybody is sitting at it or not.**
        An empty room still has fourteen tables, and a model that only knows tables through visits cannot
        say that.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDefinition'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
  /tables/{tableId}:
    parameters:
    - name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateTable
      summary: Change what a table is
      description: 'Board 4C. **Capacity, label, section, whether it is out of service** (`isOutOfService`).

        **Refused while a visit is open on it**, with `refusedReason: tableHasOpenVisit`. Changing a table''s capacity under a seated party is
        how a floor plan and a room stop agreeing, and the room wins.

        '
      tags:
      - fnb
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableDefinition'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDefinition'
        '409':
          description: A visit is open on the table. Names the visit.
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FnbProblem'
                - type: object
                  properties:
                    refusedReason:
                      enum:
                      - tableHasOpenVisit
  /menus/{menuId}/schedule:
    parameters:
    - name: menuId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listMenuSchedules
      summary: What is scheduled to go live, and when
      description: '**Added 26 September.** A scheduled publish was accepted and never shown again, so a
        venue with three scheduled price changes could not see them and `cancelScheduleId` had no way
        to be found. Flow F31 needs `scheduledPending` to be *visible as pending rather than invisible*.

        Pending first, then by `effectiveAt`.

        '
      tags:
      - menu
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
