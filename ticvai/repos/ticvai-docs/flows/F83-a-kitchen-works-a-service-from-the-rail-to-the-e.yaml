- step: 4
  screen: KIT-004
  action: Active Order Management & Fulfilment Journey.
  operations:
  - getFnbOrder
  - listKitchenTickets
  outcome: '**Drawn by the client as FNB-3D.** 2 operations on this step.'
  crossesDevice: true
- step: 5
  screen: KIT-008
  action: Exceptions, Re-Fire & Unavailable Items.
  operations:
