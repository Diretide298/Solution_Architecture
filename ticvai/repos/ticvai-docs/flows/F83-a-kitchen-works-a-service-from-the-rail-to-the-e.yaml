- step: 2
  screen: KIT-002
  action: Kitchen Display System (KDS).
  operations:
  - listKitchenTickets
  - recallKitchenTicket
  outcome: '**Drawn by the client as FNB-3B.** 2 operations on this step.'
- step: 3
  screen: KIT-003
