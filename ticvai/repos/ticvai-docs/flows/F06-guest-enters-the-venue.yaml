# F06 — Guest enters the venue
#
# The highest-volume flow in the platform, and the only one that must work with no
# network at all. Every branch below has been seen at a real gate.
#
# Validated by tools/check-flows.py.

id: F06
name: Guest enters the venue
actor: gateOperator
wave: 1
frequency: constant
criticality: revenue
platforms:
- P07 Venue Scanner
offlineBehaviour: '**The whole flow runs offline.** A gate that cannot validate without a network is
  a queue. The handheld validates against a bundle loaded at shift start, journals every scan locally,
  and syncs when it can. The reconciliation step is not optional — it is where the server tells the
  steward that an admit they already granted was wrong.'
trigger:
  description: A guest presents a ticket, wristband or phone at a gate. This runs tens of thousands
    of times a day and is the flow with the least tolerance for latency.
  entryScreen: SCN-001
  entryPoints:
  - Start of shift
  - Device handed over mid-shift
  - Gate opened late
steps:
- step: 1
  screen: SCN-001
  action: Steward signs in with PIN or badge
  operations:
  - login
  outcome: Session carries the workstation, so every scan is attributable. A scanner runs no cash shift,
    so the door reads none (CHG-DOOR-003)
  note: '**Repointed 2 October (CHG-WIR-021).** A scanner has no cash shift; getCurrentShift (SHIFT_OPEN) showed stewards a missing-permission state at sign-in.'
- step: 2
  screen: SCN-002
  action: Confirms access point and direction
  operations:
  - listAccessPoints
  outcome: The device knows what it is doing before it does it
- step: 3
  screen: SCN-015
  action: Loads the offline package
  operations:
  - getOfflinePackage
  outcome: Entitlements, blacklist and admission profiles are local from here
- step: 4
  screen: SCN-003
  action: Waits at the ready screen
  operations: []
  outcome: The loop. The device sits here all day **Calls nothing** — the ready screen is idle by design,
    which is what makes the next scan instant.
- step: 5
  screen: SCN-003
  action: Scans and admits
  operations:
  - validateAccess
  outcome: Green, party size, and the entitlement is consumed locally
- step: 6
  screen: SCN-014
  action: Syncs the journal when signal returns
  operations:
  - syncScans
  - listSyncRejections
  outcome: The server accepts most and may reject some
branches:
- at: 5
  condition: Entitlement already fully consumed
  behaviour: SCN-003 shows denied with the reason and the time of the previous scan. **The reason matters
    more than the denial** — a steward facing a guest needs to say what happened, not just no.
  severity: recoverable
  resolvedBy: Steward explains, or escalates to a supervisor override on SCN-003
- at: 5
  condition: Guest is blacklisted
  behaviour: 'SCN-003, handled differently from an ordinary denial: no override offered on the device,
    and a supervisor is summoned.'
  severity: requiresStaff
  resolvedBy: Supervisor
- at: 5
  condition: Media unreadable — damaged QR, dead phone
  behaviour: SCN-008 manual entry by reference, or SCN-009 lookup by name. Both are slower and both
    are necessary.
  severity: recoverable
  resolvedBy: Steward
- at: 5
  condition: Party larger than the entitlement
  behaviour: SCN-007 group admission admits what is valid and states the shortfall, rather than refusing
    the whole party at a gate with a queue behind it.
  severity: recoverable
  resolvedBy: Steward
- at: 5
  condition: Steward believes the denial is wrong
  behaviour: Supervisor override on SCN-003, which requires a permission a steward may not hold and records who, why
    and against which scan.
  severity: requiresStaff
  resolvedBy: Supervisor
- at: 5
  condition: The attraction behind this access point is temporarily closed
  behaviour: '**Denied with the reason and the reopening time, plus a way back** (decided 2 October 2026,
    Chinmay, BO-147: "Deny + reopening time + a virtual-queue return window where enabled"; DEC-228,
    CHG-CSP-026). `validateAccess` answers `denyCause` `attractionTemporarilyClosed` with `reopensAt` and,
    where the venue enables it, a `queueReturnOffer`; SCN-003 shows both so the steward can tell the guest
    when to come back. The closure travels in the offline package, so an offline gate denies the same way.'
  severity: recoverable
  resolvedBy: Steward explains; the guest takes the return window (joinQueue) where offered
- at: 5
  condition: A time-bound entitlement is scanned after its window from first scan
  behaviour: '**Denied as expired, with when the window ended** (decided 2 October 2026, BO-159: "Yes: add
    time-bound entitlements (validity from first scan)"; DEC-232, CHG-CSP-030). `denyCause`
    `timeBoundWindowElapsed`, `denyReason` `expired`; the first-scan time travels in the offline package
    (ADR-0068), so a second gate offline still knows when the window began.'
  severity: recoverable
  resolvedBy: Steward explains, or sells an extension at a counter
- at: 5
  condition: The handheld has been offline longer than the venue allows
  behaviour: '**Offline taps are refused until it reconnects** (decided 2 October 2026, BO-471: "Yes: the
    venue sets a maximum offline duration; readers then refuse offline taps"; DEC-426, CHG-CSP-035).
    `denyCause` `offlineLimitExceeded`; SCN-003 says the device must sync, not that the ticket is bad, and
    the age of the bundle is on screen before the limit is reached.'
  severity: requiresStaff
  resolvedBy: Steward moves to signal and syncs (SCN-014), or a supervisor swaps the device
- at: 2
  condition: The gate's direction is switched live during the shift
  behaviour: '**The device picks up the new direction from the next push** (decided 2 October 2026, BO-230:
    "Live direction switch with permission, logged; R221 amended"; DEC-255, CHG-CSP-032). The switch is made
    in the back office by a holder of `ACCESS_POINT_CONFIGURE`, never by the steward, and is logged; an offline
    device keeps its old direction until it reconnects and SCN-002 shows which direction it is enforcing.'
  severity: recoverable
  resolvedBy: Supervisor (setAccessPointDirection); the device follows on reconnect
- at: 4
  condition: No network at shift start
  behaviour: SCN-003 offline. The bundle from the previous sync is used and its age is shown. **An old bundle
    is better than no gate**, and the steward must be able to see how old.
  severity: recoverable
  resolvedBy: Automatic
- at: 6
  condition: Server rejects a scan the device already admitted
  behaviour: SCN-014 reconciliation. The guest is already inside. This is a revenue and audit event,
    not a gate event, and it is why the journal exists.
  severity: requiresStaff
  resolvedBy: Duty manager, after the fact
- at: 6
  condition: Journal too large to sync in one pass
  behaviour: Batched. The device keeps journalling while it syncs — a device that stops scanning to
    sync is a closed gate.
  severity: recoverable
  resolvedBy: Automatic
exitStates:
- state: completed
  description: Guest admitted and the scan reconciled
- state: escalated
  description: Denied and referred to a supervisor
- state: deferred
  description: Admitted offline, reconciliation pending
primaryContract: access
contracts:
- access
- identity
- shift
- orders
