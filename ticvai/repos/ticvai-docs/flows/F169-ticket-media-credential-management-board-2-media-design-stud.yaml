id: F169
name: 'Ticket Media   Credential Management board 2: Media Design Studio Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Ticket Media   Credential Management board 2. **This route
    is read from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-344
  entryPoints:
  - Arrives at Media Design Studio Command Center
steps:
- step: 1
  screen: BO-344
  action: Opens Media Design Studio Command Center
  operations:
  - listMediaDesign
  outcome: Provide administrators with the central workspace for creating and managing all ticket and
    credential media templates. This should be the entry point for the entire no-code Media Design Studio.
- step: 2
  screen: BO-345
  action: Works in Digital QR & Barcode Ticket Designer
  operations:
  - setDigitalBarcodeTicket
  outcome: Provide a visual no-code designer specifically for digital QR and barcode tickets.
- step: 3
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-346
  action: Works in PDF, Printable & POS Ticket Designer
  operations:
  - setPdfPrintablePos
  outcome: Design tickets intended for printing, PDF generation, POS, box office and other physical/document
    outputs.
- step: 5
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-347
  action: Works in Apple Wallet Pass Designer
  operations:
  - setAppleWalletPass
  outcome: Provide an Apple Wallet-specific configuration experience for eligible TICVAI credentials.
    This should not simply be a PDF ticket rendered inside a wallet.
- step: 7
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-348
  action: Works in Google Wallet Pass Designer
  operations:
  - setGoogleWalletPass
  outcome: Provide a dedicated Google Wallet configuration environment.
- step: 9
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-349
  action: Works in RFID, NFC, Card & Wristband Media Designer
  operations:
  - setRfidNfcCard
  outcome: Configure both the visual and technical profile of physical electronic credentials. This is
    important because RFID/NFC media are not merely artwork.
- step: 11
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-350
  action: Works in Digital Card, Membership & Wearable Designer
  operations:
  - setDigitalCardMembership
  outcome: Provide specialized configuration for persistent credentials that may represent longer-lived
    relationships rather than a single event ticket.
- step: 13
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-351
  action: Works in Dynamic Fields, Data Mapping & Content Builder
  operations:
  - setDynamicFieldData
  outcome: Create a centralized reusable field library so development team does not hard-code ticket fields
    separately into every media designer. This is another important architecture screen.
- step: 15
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-352
  action: Works in Branding, Localization & Template Inheritance
  operations:
  - listBrandingLocalizationTemplate
  outcome: Allow TICVAI's multi-tenant clients to control branding and localization without rebuilding
    every ticket template.
- step: 17
  screen: BO-344
  action: Returns to the board's landing screen
  operations:
  - listMediaDesign
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-353
  action: Works in Multi-Media Preview, Testing, Approval & Publication
  operations:
  - approveMultiMediaPreview
  outcome: Provide the final quality and governance gate before any media template becomes operational.
    This should be a particularly visual screen. Board 1 established the Virtual Ticket as the authoritative
    ticket identity and the one- Virtual-Ticket-to-many-media architecture. Board 2 established how administrators
    design and configure each media type. Board 3 manages what happens to the actual credential instances
    in production after a Virtual Ticket has been created.
branches:
- at: 1
  condition: Nothing has been set up on Media Design Studio Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Ticket Media   Credential Management board 2 visited
primaryContract: access
contracts:
- access
