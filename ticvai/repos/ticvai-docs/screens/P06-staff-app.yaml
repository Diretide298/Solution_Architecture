platform:
  code: P06
  audience: staff
  formFactor: mobileApp
  shortName: Venue Staff App
  name: Venue Staff App — Operations
  surface: staffFacing
  runtime: reactNative
  app: venue-staff-app
  appStatus: scaffolded
  offlineCapable: true
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: iOS / Android native
    distribution: MDM, not a public store
    bundleUpdate: on launch
    hosting: in-cell
    storeReview: false
    deviceOwnership: venue-owned or BYOD
    networkAssumption: venue wifi, dead zones expected
    releaseCadence: fortnightly
  screenCount: 96
  designReferences:
  - path: sources/designs/TICVAI_Employee_App_UI_Reference_1.pdf
    note: Employee app reference — dark theme, and the Home · Tasks · Scan · AI · More nav that CF-41
      is about.
  operator: venue
  directions:
  - ltr
  - rtl
  wireframeBoard: wireframes/P06 Venue Staff App.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-staff-mobile
    name: TICVAI Venue Staff
    shell: mobile
    siblings:
    - P07
    note: '**Both offline-capable, both carried rather than sat at.** They cannot fold into venue management,
      which is online desktop web, and they share 69% with each other.'
    decided: 10 September 2026
screens:
- id: EMP-001
  name: Sign in
  module: Operations
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-staff-app
    route: /operations/sign-in
    component: apps/venue-staff-app/src/routes/operations/SignInDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - EMP-002
    - EMP-003
    - EMP-048
    inferred: true
    fromFlows: true
    isEntryPoint: true
    transitions:
    - to: EMP-002
      trigger: Selects venue and role
      provenance: flow F08 step 1→2, F64 step 1→2
    - to: EMP-003
      trigger: Home — on duty
      provenance: structural — EMP-001 is P06's home screen and its exits are its launcher
    - to: EMP-048
      trigger: Opening checklist
      provenance: structural — EMP-001 is P06's home screen and its exits are its launcher
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Sign in.** A shared device between shifts shows nothing until somebody identifies
    themselves. **Declared 20 August** — `isEntryPoint` existed in the schema and five platforms used
    none, so every screen in them read as unreachable. **Removed 24 August**: forceLogout, listActiveSessions,
    revokeAllSessions. **Bulk-attach residue** — the 18 August defect that put identical operation sets
    on unrelated screens. A till does not cancel a performance, a staff app does not create roles, and
    **a scanner does not run a cash shift.**'
  density: comfortable
  pattern: listDetail
  patternReason: '`listMfaMethods` reads the population and `getCurrentSession` reads one of them — list,
    select, act'
  purpose: Get an employee onto a shared device fast.
  gaps:
  - operation: listSsoProviders
    why: '**1 declared operation reaches no component on this screen**: listSsoProviders. Either the screen
      is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every sign
        bindsTo: MfaMethod
        columns:
        - MfaMethod.id
        - MfaMethod.kind
        - MfaMethod.label
        - MfaMethod.maskedTarget
        - MfaMethod.isActive
        - MfaMethod.isPrimary
        - MfaMethod.enrolledAt
        - MfaMethod.lastUsedAt
        operation: listMfaMethods
        provenance: contract identity.yaml GET /auth/mfa/methods
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected sign
        bindsTo: Session
        columns:
        - Session.sessionId
        - Session.principalId
        - Session.roleId
        - Session.displayName
        - Session.scope
        - Session.effectivePermissions
        - Session.permissionsByScope
        - Session.saleBoardId
        - Session.workstation
        - Session.openedAt
        - Session.expiresAt
        operation: getCurrentSession
        provenance: contract identity.yaml GET /auth/session
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Login
        operation: login
        provenance: contract identity.yaml POST /auth/login
    - name: contentBody
      slot: carried
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
        provenance: carried from the previous definition
      - kind: dataTable
        derived: true
        impliedBy: listMfaMethods
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
        provenance: carried from the previous definition
      - kind: secondaryButton
        label: Cancel
        notes: '**A screen that can submit must be leaveable without submitting.**'
        derived: true
        impliedBy: login
        provenance: carried from the previous definition
  states:
    loading: The sign list.
    error: Could not load. Names which read failed and leaves the sign untouched.
    emptyFirstRun: No sign yet. Carries the create action; distinct from a filter that matched nothing.
    emptyNoResults: The filter narrowed it and the sign are still there. Names the active filter and offers
      to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: Signs in against the cached principal list. A technician in a basement still needs their
      tasks
  apis:
  - operationId: login
    contract: identity
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  entryState:
    params: []
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - Session.sessionId
    - Session.principalId
    - Session.roleId
    - Session.displayName
    - Session.scope
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-001
  apisNote: Rebuilt 9 September 2026 from the 5 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
