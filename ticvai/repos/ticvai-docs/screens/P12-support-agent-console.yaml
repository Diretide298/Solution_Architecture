platform:
  code: P12
  audience: staff
  formFactor: web
  shortName: Venue Support
  name: Venue Support — Agent Console
  surface: staffFacing
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 28
  app: venue-support-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: agent workstation
    networkAssumption: corporate network
    releaseCadence: weekly
  reachesOtherPlatforms:
  - screen: ADM-035
    platform: P09
    board: P09 TICVAI Web.dc.html#adm-035
    note: An agent escalates to platform support
  - screen: PTR-021
    platform: P10
    board: P10 Partner Web.dc.html#ptr-021
    note: A partner query resolved from the partner record
  operator: venue
  wireframeBoard: wireframes/P12 Venue Support.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-management
    name: TICVAI Venue Management
    shell: web
    siblings:
    - P08
    - P13
    - P16
    note: '**Already one app in all but name** — P08, P13 and P16 declared the same `app` before this
      decision. One tenant-level surface that filters across venues, with analytics, CMS and the support
      desk as sections of it.'
    decided: 10 September 2026
screens:
- id: SUP-001
  name: Venue Management Sign In
  module: Access & Availability
  requiresModule: core
  wave: 3
  capability: C35
  implementation:
    app: venue-support-web
    route: /general/agent-login
    component: apps/venue-support-web/src/routes/general/AgentLoginList.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    inferred: true
    exitTo:
    - ANL-001
    - BO-001
    - CMS-001
    - SUP-002
    - SUP-003
    - SUP-004
    - SUP-005
    - SUP-006
    - SUP-007
    - SUP-008
    - SUP-009
    - SUP-019
    transitions:
    - to: SUP-002
      trigger: Agent Dashboard
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: SUP-003
      trigger: Availability & Routing Settings
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: SUP-004
      trigger: Conversation Queue
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: BO-001
      trigger: Queue Directory
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: CMS-001
      trigger: Tenant Workspace
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: ANL-001
      trigger: Executive Command Center
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: SUP-005
      trigger: Live Chat Workspace
      provenance: derived — SUP-005 declares entryState.params caseId, conversationId and SUP-001 holds
        none of them, so the edge carries nothing and SUP-005 opens cold
    - to: SUP-006
      trigger: Knowledge Base Search
      provenance: derived — SUP-006 declares entryState.params bannerId, pageId, policyKind, version and
        SUP-001 holds none of them, so the edge carries nothing and SUP-006 opens cold
    - to: SUP-008
      trigger: Agent Performance & SLA View
      provenance: derived — SUP-008 declares entryState.params conversationId, reportId and SUP-001 holds
        none of them, so the edge carries nothing and SUP-008 opens cold
    - to: SUP-007
      trigger: Canned Response Management
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: SUP-009
      trigger: Customer Service Command Center
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
    - to: SUP-019
      trigger: Contact Center Operations Command Center
      provenance: structural — SUP-001 is P12's home screen and its exits are its launcher
  notes: '**Generalised on 10 September 2026 from `Agent Login`.** It was the only door into an application
    of 550 screens - P08 back office, P13 CMS, P16 analytics and this console - and it was named for one
    of the four. A venue manager signing in through a screen called *Agent Login* is being told they are
    in the wrong place.


    **Nothing about the screen changed except what it admits to.** It already called the whole identity
    set - `login`, `forceLogout`, `listSsoProviders`, `revokeAllSessions`, `listMfaMethods` - and its
    purpose already read *get someone into the app, fast, on a device that may be shared*. The work was
    the name and the exits.


    **`implementation.app` stays `venue-support-web`.** That is the build unit, one of twelve frontends
    `check-frontend` and `check-package` validate against; `venue-management` is the shipped unit, one
    of five. Moving the route would break the join for a rename.


    **It keeps `listMfaMethods` where `POS-000` does not**, and the difference is the point: this signs
    somebody into the ledger, the pricing and the tenant''s own content from a desk, while a till is bounded
    by the terminal it is bolted to.'
  density: compact
  pattern: listDetail
  patternReason: '`listActiveSessions` reads the population and `getCurrentSession` reads one of them
    — list, select, act'
  purpose: Get someone into venue management, fast, on a device that may be shared, and resolve the session
    the back office, the CMS and analytics all read.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Venue id
        operation: listActiveSessions
        notes: Sends `?venueId=` to `listActiveSessions`.
        provenance: contract identity.yaml GET /auth/sessions
      - kind: textField
        label: Principal id
        operation: listActiveSessions
        notes: Sends `?principalId=` to `listActiveSessions`.
        provenance: contract identity.yaml GET /auth/sessions
      - kind: textField
        label: Workstation id
        operation: listActiveSessions
        notes: Sends `?workstationId=` to `listActiveSessions`.
        provenance: contract identity.yaml GET /auth/sessions
      - kind: dataTable
        label: Every active session
        bindsTo: ActiveSession
        columns:
        - ActiveSession.sessionId
        - ActiveSession.principalId
        - ActiveSession.principalName
        - ActiveSession.roleId
        - ActiveSession.roleName
        - ActiveSession.workstationId
        - ActiveSession.workstationName
        - ActiveSession.venueId
        - ActiveSession.ipAddress
        - ActiveSession.deviceInfo
        - ActiveSession.hasOpenShift
        - ActiveSession.mfaSatisfied
        operation: listActiveSessions
        provenance: contract identity.yaml GET /auth/sessions
      - kind: dataTable
        label: Every MFA method
        bindsTo: MfaMethod
        columns:
        - MfaMethod.id
        - MfaMethod.kind
        - MfaMethod.label
        - MfaMethod.maskedTarget
        - MfaMethod.isActive
        - MfaMethod.isPrimary
        - MfaMethod.enrolledAt
        - MfaMethod.lastUsedAt
        operation: listMfaMethods
        provenance: contract identity.yaml GET /auth/mfa/methods
      - kind: dataTable
        label: Every SSO provider
        bindsTo: SsoProvider
        columns:
        - SsoProvider.id
        - SsoProvider.displayName
        - SsoProvider.protocol
        - SsoProvider.iconAssetRef
        - SsoProvider.isEnforced
        - SsoProvider.scopePath
        operation: listSsoProviders
        provenance: contract identity.yaml GET /auth/sso/providers
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected active session
        bindsTo: ActiveSession
        columns:
        - ActiveSession.status
        - ActiveSession.sessionId
        - ActiveSession.principalId
        - ActiveSession.principalName
        - ActiveSession.roleId
        - ActiveSession.roleName
        - ActiveSession.workstationId
        - ActiveSession.workstationName
        - ActiveSession.venueId
        - ActiveSession.ipAddress
        - ActiveSession.deviceInfo
        - ActiveSession.hasOpenShift
        - ActiveSession.mfaSatisfied
        - ActiveSession.startedAt
        - ActiveSession.lastSeenAt
        operation: listActiveSessions
        provenance: contract identity.yaml GET /auth/sessions
      - kind: detailPanel
        label: The session
        bindsTo: Session
        columns:
        - Session.sessionId
        - Session.principalId
        - Session.roleId
        - Session.displayName
        - Session.scope
        - Session.effectivePermissions
        - Session.permissionsByScope
        - Session.saleBoardId
        - Session.workstation
        - Session.openedAt
        - Session.expiresAt
        operation: getCurrentSession
        provenance: contract identity.yaml GET /auth/session
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Login
        operation: login
        provenance: contract identity.yaml POST /auth/login
      - kind: textField
        label: Authentication code
        operation: verifyMfaChallenge
        notes: Shown only in the mfaRequired state, after `login`, for the authenticator-app code or the
          emailed code (decided 28 September, audit R135, R126 (5)).
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: primaryButton
        label: Verify
        operation: verifyMfaChallenge
        notes: Completes sign-in; the session is usable only after it. Five wrong codes lock step-up (429
          step-up-locked, audit R126 (6)).
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: secondaryButton
        label: Email me a code instead
        operation: createMfaChallenge
        notes: 'The fallback: a new challenge with the email method (`emailOtp`) instead of the authenticator
          app (decided 28 September, audit R126 (5)).'
        provenance: contract identity.yaml POST /auth/mfa/challenge
      - kind: destructiveButton
        label: Force logout
        operation: forceLogout
        provenance: contract identity.yaml POST /auth/sessions/{sessionId}/force-logout
      - kind: destructiveButton
        label: Revoke all sessions
        operation: revokeAllSessions
        provenance: contract identity.yaml POST /auth/sessions/revoke-all
  overlays:
  - id: confirmForceLogout
    component: confirmDialog
    trigger: Force logout
    body: '**Names what `forceLogout` changes and what it leaves alone**, in the consequence rather than
      the verb. A agent login this affects should be identified in the dialog, not just counted. **Collects
      what `forceLogout` sends before it is called.** Required: `reason`.'
    provenance: contract identity.yaml POST /auth/sessions/{sessionId}/force-logout
  - id: confirmRevokeAllSessions
    component: confirmDialog
    trigger: Revoke all sessions
    body: '**Names what `revokeAllSessions` changes and what it leaves alone**, in the consequence rather
      than the verb. A agent login this affects should be identified in the dialog, not just counted.
      **Collects what `revokeAllSessions` sends before it is called.** Required: `reason`, `stepUpToken`.
      Optional: `venueId`, `excludeSelf`.'
    provenance: contract identity.yaml POST /auth/sessions/revoke-all
  - id: formLogin
    component: modal
    trigger: Login
    body: '**Collects what `login` sends before it is called.** Required: `username`, `credential`, `workstationId`.
      Optional: `method`, `deviceFingerprint`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: LoginRequest
    confirm:
      label: Login
      operation: login
    dismiss:
      label: Cancel
      discards:
      - username
      - credential
      - workstationId
      - method
      - deviceFingerprint
    provenance: contract identity.yaml POST /auth/login
  states:
    loading: The agent login list.
    error: Could not load. Names which read failed and leaves the agent login untouched.
    emptyFirstRun: No agent login yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing matches the filter on venueId, principalId, workstationId and the agent login
      are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `SESSION_FORCE_LOGOUT`, which `listActiveSessions` requires,
      and names that permission. **Never an empty table** — that reads as *there is no data* and sends
      somebody to support with the wrong question.
    mfaRequired: '**Signed in, not yet through.** The principal holds a permission that requires MFA (ROLE_MANAGE,
      LEDGER_APPROVE, any platform-staff permission, or one the tenant added), so after `login` the screen
      calls `createMfaChallenge` and asks for the authenticator code; `verifyMfaChallenge` completes the
      sign-in. **Email me a code instead** is the fallback. Five wrong codes lock step-up for the policy''s
      lockout minutes and the screen says so. A principal with no enrolled method is sent to enrol first
      (decided 28 September, audit R135, R126).'
  apis:
  - operationId: createMfaChallenge
    contract: identity
    purpose: Second factor after login when the principal holds a permission in mfaRequiredForPermissions;
      action `signIn`, the primary method (authenticator app), or the email method as the fallback (decided
      28 September, audit R135, R126 (5))
    trigger: onAction
  - operationId: verifyMfaChallenge
    contract: identity
    purpose: Completes sign-in with the code; the session is usable only after it. Five wrong codes lock
      step-up (audit R126 (6))
    trigger: onAction
  - operationId: login
    contract: identity
    purpose: from page inventory
    trigger: onAction
  - operationId: forceLogout
    contract: identity
    purpose: Supervisor termination of an abandoned session
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: listActiveSessions
    contract: identity
    purpose: List active sessions
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  - operationId: revokeAllSessions
    contract: identity
    purpose: Revoke every session in scope
    trigger: onAction
    invalidates:
    - listActiveSessions
  entryState:
    params:
    - name: challengeId
      from: navigation
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - ActiveSession.status
    - ActiveSession.sessionId
    - ActiveSession.principalId
    - ActiveSession.principalName
    - ActiveSession.roleId
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P12 Venue Support.dc.html#sup-001
  apisNote: Rebuilt 9 September 2026 from the 8 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
- id: SUP-002
  name: Agent Dashboard
  module: Overview
  requiresModule: marketing
  wave: 3
  capability: C32
  implementation:
    app: venue-support-web
    route: /general/agent-dashboard
    component: apps/venue-support-web/src/routes/general/AgentDashboard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - SUP-001
    inferred: true
    exitTo:
    - SUP-001
    - SUP-003
    - SUP-004
    transitions:
    - to: SUP-001
      trigger: Agent Login
      provenance: derived — SUP-001 declares entryState.params challengeId and SUP-002 holds none of them,
        so the edge carries nothing and SUP-001 opens cold
    - to: SUP-004
      trigger: Conversation Queue
      carries:
      - caseId
      - conversationId
      provenance: derived — SUP-004 declares entryState.params caseId, conversationId and SUP-002 holds
        caseId, conversationId, so an edge into it carries them
  notes: States derived from the screen pattern on 17 August, not individually considered — sound for
    a list, a form or a money screen, and worth revisiting where this screen is unusual. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. **Drawn 26 August**
    — `Dashboards Board` frame `sup-002`. **One board draws five dashboards across five platforms** —
    platform admin, partner, support, guest web and cross-tenant health. A dashboard is a shape rather
    than a domain, and the pack recognised that before the package did.
  density: compact
  boardFrames:
  - Dashboards Board.dc.html#sup-002
  pattern: listDetail
  patternReason: '`listCases` reads the population and `getCase` reads one of them — list, select, act'
  purpose: The screen this app sits on. Everything else is entered from here and returns to it.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Status
        operation: listCases
        notes: Sends `?status=` to `listCases`.
        provenance: contract marketing-crm.yaml GET /cases
      - kind: textField
        label: Assigned to principal id
        operation: listCases
        notes: Sends `?assignedToPrincipalId=` to `listCases`.
        provenance: contract marketing-crm.yaml GET /cases
      - kind: toggle
        label: Breached sla
        operation: listCases
        notes: Sends `?breachedSla=` to `listCases`.
        provenance: contract marketing-crm.yaml GET /cases
      - kind: textField
        label: Priority
        operation: listCases
        notes: Sends `?priority=` to `listCases`.
        provenance: contract marketing-crm.yaml GET /cases
      - kind: dataTable
        label: Every case
        bindsTo: Case
        columns:
        - Case.id
        - Case.caseNumber
        - Case.subjectId
        - Case.guestName
        - Case.subject
        - Case.categoryId
        - Case.status
        - Case.priority
        - Case.assignedToPrincipalId
        - Case.venueId
        - Case.relatedOrderId
        - Case.slaDueAt
        operation: listCases
        provenance: contract marketing-crm.yaml GET /cases
      - kind: dataTable
        label: Every conversation
        bindsTo: Conversation
        columns:
        - Conversation.id
        - Conversation.telephony
        - Conversation.assistSessionId
        - Conversation.channel
        - Conversation.state
        - Conversation.subjectId
        - Conversation.venueId
        - Conversation.assignedPrincipalId
        - Conversation.queueId
        - Conversation.queuePosition
        - Conversation.estimatedWaitSeconds
        - Conversation.handoverReason
        operation: listConversations
        provenance: contract marketing-crm.yaml GET /conversations
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected case
        bindsTo: Case
        columns:
        - Case.id
        - Case.caseNumber
        - Case.subjectId
        - Case.guestName
        - Case.subject
        - Case.kind
        - Case.channel
        - Case.recordedAt
        - Case.syncedAt
        - Case.categoryId
        - Case.status
        - Case.priority
        - Case.assignedToPrincipalId
        - Case.venueId
        - Case.relatedOrderId
        - Case.slaDueAt
        operation: listCases
        provenance: contract marketing-crm.yaml GET /cases
      - kind: detailPanel
        label: The case
        bindsTo: CaseDetail
        columns:
        - CaseDetail.id
        - CaseDetail.caseNumber
        - CaseDetail.subjectId
        - CaseDetail.guestName
        - CaseDetail.subject
        - CaseDetail.kind
        - CaseDetail.channel
        - CaseDetail.recordedAt
        - CaseDetail.syncedAt
        - CaseDetail.categoryId
        - CaseDetail.status
        - CaseDetail.priority
        - CaseDetail.assignedToPrincipalId
        - CaseDetail.venueId
        - CaseDetail.relatedOrderId
        - CaseDetail.slaDueAt
        operation: getCase
        provenance: contract marketing-crm.yaml GET /cases/{caseId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Add case message
        operation: addCaseMessage
        provenance: contract marketing-crm.yaml POST /cases/{caseId}/messages
      - kind: secondaryButton
        label: Create case
        operation: createCase
        provenance: contract marketing-crm.yaml POST /cases
      - kind: secondaryButton
        label: Escalate case
        operation: escalateCase
        provenance: contract marketing-crm.yaml POST /cases/{caseId}/escalate
      - kind: secondaryButton
        label: Reopen case
        operation: reopenCase
        provenance: contract marketing-crm.yaml POST /cases/{caseId}/reopen
      - kind: secondaryButton
        label: Save case
        operation: updateCase
        provenance: contract marketing-crm.yaml PATCH /cases/{caseId}
      - kind: secondaryButton
        label: Save agent availability
        operation: setAgentAvailability
        provenance: contract marketing-crm.yaml PUT /agent-availability
  states:
    loading: The agent list.
    error: Could not load. Names which read failed and leaves the agent untouched.
    emptyFirstRun: No agent yet. Offers Add case message (`addCaseMessage`); distinct from a filter that
      matched nothing.
    emptyNoResults: Nothing matches the filter on status, assignedToPrincipalId, breachedSla, priority
      and the agent are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `CASE_VIEW`, which `listCases` requires, and names that
      permission. **Never an empty table** — that reads as *there is no data* and sends somebody to support
      with the wrong question.
  apis:
  - operationId: listCases
    contract: marketing-crm
    purpose: from page inventory
    trigger: onLoad
  - operationId: addCaseMessage
    contract: marketing-crm
    purpose: Add a message or internal note
    trigger: onAction
    invalidates:
    - listCases
  - operationId: createCase
    contract: marketing-crm
    purpose: Raise a service case
    trigger: onAction
    invalidates:
    - listCases
  - operationId: escalateCase
    contract: marketing-crm
    purpose: Escalate a case
    trigger: onAction
    invalidates:
    - listCases
  - operationId: getCase
    contract: marketing-crm
    purpose: Read a case with its thread
    trigger: onAction
  - operationId: reopenCase
    contract: marketing-crm
    purpose: Reopen a resolved case
    trigger: onAction
    invalidates:
    - listCases
  - operationId: updateCase
    contract: marketing-crm
    purpose: Assign, reprioritise or resolve a case
    trigger: onAction
    invalidates:
    - listCases
  - operationId: listConversations
    contract: marketing-crm
    purpose: The omnichannel inbox
    trigger: onLoad
  - operationId: setAgentAvailability
    contract: marketing-crm
    purpose: An agent goes available, away or offline
    trigger: onAction
    invalidates:
    - listCases
  entryState:
    params:
    - name: caseId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `caseId`.'
    preloaded:
    - Case.id
    - Case.caseNumber
    - Case.subjectId
    - Case.guestName
    - Case.subject
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P12 Venue Support.dc.html#sup-002
    derivedFrom: wireframes/reference/Dashboards Board.dc.html
    note: '**Drawn by Claude Design on `Dashboards Board.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: Rebuilt 9 September 2026 from the 9 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formAddCaseMessage
    component: modal
    trigger: Add case message
    body: '**Collects what `addCaseMessage` sends before it is called.** Required: `id`, `body`, `isInternal`,
      `recordedAt`. Optional: `channel`, `attachmentRefs`. Dismissing sends nothing; the screen behind
      is unchanged.'
    confirm:
      label: Add case message
      operation: addCaseMessage
    dismiss:
      label: Cancel
      discards:
      - id
      - body
      - isInternal
      - recordedAt
      - channel
      - attachmentRefs
    provenance: contract marketing-crm.yaml POST /cases/{caseId}/messages
  - id: formCreateCase
    component: modal
    trigger: Create case
    body: '**Collects what `createCase` sends before it is called.** Required: `id`, `subject`, `description`,
      `channel`, `recordedAt`. Optional: `subjectId`, `categoryId`, `priority`, `kind`, `venueId`, `relatedOrderId`,
      `attachmentRefs`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: CreateCaseRequest
    confirm:
      label: Create case
      operation: createCase
    dismiss:
      label: Cancel
      discards:
      - id
      - subject
      - description
      - channel
      - recordedAt
      - subjectId
      - categoryId
      - priority
      - kind
      - venueId
      - relatedOrderId
      - attachmentRefs
    provenance: contract marketing-crm.yaml POST /cases
  - id: formEscalateCase
    component: modal
    trigger: Escalate case
    body: '**Collects what `escalateCase` sends before it is called.** Required: `reason`. Optional: `assignToPrincipalId`,
      `newPriority`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Escalate case
      operation: escalateCase
    dismiss:
      label: Cancel
      discards:
      - reason
      - assignToPrincipalId
      - newPriority
    provenance: contract marketing-crm.yaml POST /cases/{caseId}/escalate
  - id: formReopenCase
