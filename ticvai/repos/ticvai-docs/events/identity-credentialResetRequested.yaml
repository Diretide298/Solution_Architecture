# identity.credentialResetRequested v1 — published by identity
# Checked by tools/check-states.py against states/ and the contracts.

name: identity.credentialResetRequested
version: 1
publisher: identity
description: Somebody asked for a password or PIN to be reset — a guest asked for a reset code, or a supervisor
  reset a member of staff's credential.
aggregate: principal
emittedWhen: requestGuestOtp with purpose passwordReset (whether or not the identifier exists), or
  resetPrincipalCredential succeeds
payload:
- field: resetEventId
  type: uuid
  notes: UUIDv7 minted by the operation. The idempotency key for every consumer
- field: kind
  type: string
  notes: guestSelfService (a guest asked for a reset code) or staffReset (a supervisor reset a principal)
- field: principalId
  type: uuid
  required: false
  notes: The principal whose credential was reset. Set for staffReset only
- field: subjectId
  type: uuid
  required: false
  notes: The guest the identifier resolved to. Null where it resolved to nobody; **the event still fires**,
    because a burst of resets against identifiers that do not exist is itself the pattern
- field: identifierHash
  type: string
  notes: The identifier asked about (email or mobile), normalised and hashed with the tenant key, so resets
    against one identifier can be counted without carrying it. Empty for staffReset
- field: requestedByPrincipalId
  type: uuid
  required: false
  notes: The supervisor who performed a staffReset
- field: channel
  type: string
  required: false
  notes: whatsapp, sms or email for guestSelfService
- field: deviceIdHash
  type: string
  required: false
  notes: Hashed, keyed per tenant, as on identity.loginRecorded
- field: ipHash
  type: string
  required: false
  notes: The client address hashed with the tenant key at the edge, the same hash `ai.scoreTransactionRisk`
    receives as `ipHash`, so resets across many accounts from one address can be counted. The address itself is
    not carried
- field: ipCountry
  type: string
  required: false
  notes: ISO 3166-1 alpha-2, resolved at the edge
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: ai
  purpose: 'Account-takeover signals (8.3.34): a reset followed by a sign-in from a new device or country, reset
    bursts across many identifiers from one device or country, repeated resets of one account; in `ai-realtime`
    beside identity.loginRecorded (AI system design section 3.2)'
  idempotencyKey: resetEventId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Added 29 September (build pass, group G2), closing the password-reset half of 8.3.34.** Sign-ins
  reached the risk engine (identity.loginRecorded) and resets did not, and a reset is the step an account
  takeover takes just before the sign-in that looks ordinary.


  No state model emits this: a reset request is an act, not a status change, and a guest reset request against
  an unknown identifier changes nothing at all. `requestGuestOtp` and `resetPrincipalCredential` write
  `platform.outbox` in the same transaction as the code or credential they write (ADR-0033); for an unknown
  identifier the outbox row is the only thing committed, and the 202 the caller sees is the same either way.


  **Not offered to webhooks**, like identity.loginRecorded: it is a security signal, and a stream of reset
  attempts to an outside receiver is a map of which accounts are being attacked.'
