# approval.expired v1 — published by approvals
# Checked by tools/check-states.py against states/ and the contracts.

name: approval.expired
version: 1
publisher: approvals
description: An approval request stopped waiting because nobody decided it before the rule's expiry.
aggregate: approvalRequest
emittedWhen: ApprovalStatus pending or escalated to expired (timer, ApprovalRule.expiresAfterMinutes)
payload:
- field: requestId
  type: uuid
- field: kind
  type: string
- field: subjectContract
  type: string
- field: subjectType
  type: string
- field: subjectId
  type: uuid
- field: scopePath
  type: string
- field: expiredAt
  type: timestamp
consumers:
- context: ai
  purpose: Close the action plan waiting on it (AI system design section 3.2)
  idempotencyKey: requestId
  onFailure: retry
  isCritical: false
- context: public-api
  purpose: Deliver to webhook subscriptions taking approval.expired (11.1.66)
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: false
- context: identity
  purpose: 'A guest''s privacy request expired (`subjectContract` identity; ADAM CR-101, CHG-R10ID-016): a
    `subjectDataExport` request''s identity.subject_data_export row ends `rejected` with no file; a `subjectErasure`
    request closes unfulfilled and nothing is erased'
  writes:
  - identity.subject_data_export
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: white-label
  purpose: 'A reviewed content block whose request was expired (`subjectId` a whitelabel.content_block row pending
    review; ADAM CR-462, decided 2 November 2026; CHG-CR462-001): `reviewStatus` rejected, and the block keeps the
    status and schedule it had (draft, scheduled or expired), as publishContentBlock states'
  writes:
  - whitelabel.content_block
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: catalogue
  purpose: '**Catalogue''s approval consumer, by `subjectType`** (the consumer ADAM CR-415 adds for `pricingRecommendation`).
    For `subjectType` `dynamicPricingControl` (ADAM CR-425, CHG-CR425-001): the expired raise is dropped,
    `pending_automation_level` and `pending_approval_request_id` cleared on the row whose pending request is
    `requestId`, and `automation_level` keeps the current level; a row whose pending request is another, or none,
    changes nothing. For `subjectType` `rollbackAction` (ADAM CR-421): an outcome for a pricing rollback that is no
    longer `requested` or `scheduled` (cancelled with cancelPricingRollback, which cancels its request in process)
    changes nothing. For `subjectType` `pricingRecommendation` : (CHG-CR415-001; `subjectContract`
    catalogue, the request decidePricingRecommendation raised on `sendForApproval` for `subjectType`
    `pricingRecommendation`; ADAM CR-415, decided 31 October 2026). The recommendation is the one whose decision row''s
    approval_request_id is `requestId`. A recommendation still `sentForApproval` moves to `rejected`; any other state
    changes nothing.'
  writes:
  - catalogue.dynamic_pricing_control
  - catalogue.pricing_recommendation
  idempotencyKey: requestId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: Retained with the request. This is an audit record, not an operational message
