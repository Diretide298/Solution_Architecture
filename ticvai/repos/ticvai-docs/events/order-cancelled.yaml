# order.cancelled v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: order.cancelled
version: 1
publisher: orders
description: An order was voided before any money was captured — the whole order, with its reason and
  who did it.
aggregate: order
emittedWhen: OrderStatus pending to voided (voidOrder)
emittedBy:
- voidOrder
payload:
- field: orderId
  type: uuid
- field: lines
  type: array
  notes: productId, quantity, amount — what was on the order when it was voided
- field: total
  type: Money
- field: reason
  type: string
  notes: The `VoidReason` value, verbatim. `other` carries the note
- field: note
  type: string
  required: false
- field: channel
  type: string
  notes: pos, kiosk, guestApp, guestWeb, callCentre, partner, api, backOffice
- field: principalId
  type: uuid
  required: false
  notes: The staff member who voided it, where staff-initiated. Null for a partner void
- field: workstationId
  type: uuid
  required: false
  notes: The till it was voided on. With principalId, what a leakage pattern is read against
- field: wasOffline
  type: boolean
  notes: True where the void was recorded offline and replayed through `syncOrders`
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: ai
  purpose: Staff leakage and refund-abuse risk (voids per cashier and till against their peers), forecast
    actuals, and reversing any recommendation attribution the order earned (AI system design section 3.2)
  idempotencyKey: orderId + eventId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Added 29 September (build pass, group OWN, from the AI group''s handoff).** Named `cancelled`
  for what the business calls it; the order model''s state is `voided`, and there is no `cancelled` in
  `OrderStatus`. A void after payment is not this event — once money has moved it is a refund, and
  `order.refunded` carries it.


  **A state model transition is the cause:** `states/order.yaml` pending → voided (`voidOrder`) should
  carry `emits: [order.cancelled]`, and `voidOrder` writes `platform.outbox` in the same transaction as
  the order row (ADR-0033). **held → voided (timer) deliberately does not emit it** — a parked sale that
  expired was cancelled by nobody, and counting it against the cashier who parked it would make every
  busy till look like leakage.'
