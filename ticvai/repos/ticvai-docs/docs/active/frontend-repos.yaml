# The frontend repositories: which GitLab repository a screen's ticket is built in.
#
# Authored root (CHG-R6-059, decided by Chinmay on 13 October 2026). The frontend is one GitLab repository per app
# in the group ticvai-frontend, not the single Nx workspace of thirteen apps the package was written against
# (CHG-R6-058); the folders apps/<app>/ that screens/*.yaml name in implementation.component do not exist.
#
# Read by tools/frontend_repos.py, which tools/derive-frontend.py, tools/op-descriptions.py, tools/op-release.py
# and tools/build-service-docs.py use to name the repository in the ticket text. Checked by
# tools/check-frontend-repos.py: every platform the screens declare has an entry here, its app is the platform's
# app, a repository serves one platform unless `shared` says why, and the table in
# viewer/mcp/setup/starters/frontend/CLAUDE.md (ADAM setup) names the same repository for each platform.
#
# **The key is the platform, not the app.** The package serves P02 and P05 from one app (guest-app) and P08, P13
# and P16 from another (venue-management-web); the repositories split them differently.

group: ticvai-frontend
url: http://gitlab.softlabsgroup.in/ticvai-frontend/{repo}.git

# Nobody on the package team can read GitLab, so the inside of each repository is not known. The ticket text
# assumes a repository's root holds what the package's app folder held: apps/venue-pos/src/x is src/x in
# ticvai-pos. It presents that as a suggested location, to be matched to the repository's own layout.
layout:
  assumed: true
  strip: apps/{app}/
  wording: match the repository's own layout if it differs
  note: 'The internal layout of the six repositories is unknown (13 October 2026). A ticket gives the route, the
    component name and a suggested location only; a developer who finds the repository laid out differently
    follows the repository.'
  # **Each repository's profile** (CHG-RPO-001, CHG-RPO-002, 14 October 2026). What a repository was seen to hold is
  # recorded on its entry as `observed:` (by, date, how, reachable; and, once read: workspace, stack,
  # packageManager, appRoot, srcRoot, packages, scripts). tools/frontend_repos.py profile() lays that over `default`
  # below, then over the entry's own `profile:` (a value nobody observed, kept apart and named as assumed).
  # Every screen's implementation.component on a platform with a repository is written from its profile by
  # tools/apply-repo-layout.py: `<screensDir>/<area>/<Component>.tsx`, relative to the repository's root. The
  # tickets, the frontend spec pages and ADAM setup's frontend CLAUDE.md read the same profile. The owner of each
  # repository confirms its profile afterwards (the lead's decision 3, 14 October 2026).
  default:
    stack: the platform's runtime (screens/P*.yaml platform.runtime)
    workspace: unknown
    packageManager: the one its lock file belongs to
    appRoot: .
    srcRoot: src
    screensDir: src/routes
    packages: unknown
    scripts: {lint: unknown, typecheck: unknown, test: unknown, build: unknown}

# One entry per platform in screens/P*.yaml. `repo: null` is a platform with no repository yet: its tickets say
# so and name no folder. `assumed: true` is a mapping the lead stated as an assumption, not yet confirmed.
platforms:
  P01:
    name: Guest Web - Storefront
    app: guest-web
    repo: ticvai-guest-web
    assumed: false
    observed:
      by: the Block A audit's frontend-repos batch (RPO), for Chinmay
      date: '2026-10-14'
      how: a shallow, read-only clone of the url above with the GitLab access the package team holds
      reachable: false
      result: 'GitLab answered that the project could not be found: nothing inside the repository was read, so
        its profile is the default above (assumed). The repository''s owner confirms the real layout.'
      confirmed: false
  P02:
    name: Guest App - Mobile
    app: guest-app
    repo: ticvai-guest-app
    assumed: false
    observed:
      by: 'the developer''s agent on #27741 (AM-IDENTITY-SECURITY-P02), in its own clone; relayed by the lead'
      date: '2026-10-14'
      how: '#27741 problem 3 (CHG-SWP-003). A shallow, read-only clone from the package team the same day was
        refused, as for the other five repositories.'
      reachable: true
      workspace: none
      stack: React Native CLI, one app at the repository root
      packageManager: npm
      state: Redux Toolkit
      navigation: React Navigation
      appRoot: .
      srcRoot: src
      packages: []
      scripts: {lint: unknown, typecheck: none, test: unknown, build: unknown}
      confirmed: false
    profile:
      screensDir: src/screens
      assumed: 'screensDir only. React Navigation registers screens in a navigator, not by file route, so the
        package''s routes/ folder (a web router''s) is not carried over; src/screens is assumed until the owner
        confirms.'
