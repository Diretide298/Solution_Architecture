description: One credential generation request, keyed by `requestId`, walking the generation pipeline
  (declared 29 September, writers pass). The pipeline steps are the generation job's; staff act only
  on a failed request, through `retryCredentialGeneration` or `resolveCredentialException`. **`failed`
  is not terminal**, because a failed request can be retried; a request nobody retries rests there with
  its `failureReason`.
initial:
- requested
terminal:
- delivered
transitions:
- from: requested
  to: queued
  trigger: job
  guard: The trigger (order confirmation, ticket issuance, membership activation, a staff action) was
    accepted and the request queued
- from: queued
  to: templateResolved
  trigger: job
  guard: A published media template version was resolved for the product, channel and media kind
- from: queued
  to: failed
  trigger: job
  guard: No published template matches (`failureReason` `templateMissing`); a `generationFailed` credential
    exception is raised
- from: templateResolved
  to: dataMapped
  trigger: job
  guard: Every field the template needs was mapped from the ticket, order and guest
- from: templateResolved
  to: failed
  trigger: job
  guard: A required field has no value (`requiredDataMissing`)
- from: dataMapped
  to: credentialGenerated
  trigger: job
  guard: The payload, token or wallet pass was generated
- from: dataMapped
  to: failed
  trigger: job
  guard: '`providerUnavailable`, `invalidPayload`, `tokenGenerationFailure` or `walletGenerationFailure`'
- from: credentialGenerated
  to: bound
  trigger: job
  guard: The credential was bound to the Virtual Ticket (an `AccessCredentialBinding` written; `credentialBindingId`
    set)
- from: credentialGenerated
  to: failed
  trigger: job
  guard: Binding or encoding failed (`encoderUnavailable`, a duplicate credential)
- from: bound
  to: ready
  trigger: job
  guard: The credential is ready to hand over or send
- from: ready
  to: delivered
  trigger: job
  guard: The first delivery attempt reported delivered or completed, or the credential needs no delivery
    and was handed over
- from: failed
  to: queued
  trigger: job
  guard: Automatic retry under `access.credential_issuance_retry_policy`, while `attemptCount` is below
    the limit and the reason is retryable
- from: failed
  to: queued
  operation: retryCredentialGeneration
  trigger: operation
  guard: Manual retry (selected or `allEligible`); refused for `templateMissing` and `requiredDataMissing`
    until they are fixed; a request not failed or already queued is skipped
- from: failed
  to: queued
  operation: resolveCredentialException
  trigger: operation
  guard: '`retry`, `regenerate` or `useFallback` on the generation exception for this request'
openQuestions:
- A request that fails for good sits in `failed` indefinitely. If the monitor needs a closed state for
  abandoned requests, the enum needs one (e.g. `abandoned`); until then `failed` is where they rest.
notes: '**Only `delivered` is terminal.** `failed` has a retry out of it, so declaring it terminal would
  make the retry illegal. Every step between `requested` and `delivered` is the job''s; no operation
  advances a request.'
