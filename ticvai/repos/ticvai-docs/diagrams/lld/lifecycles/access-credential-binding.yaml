owner: access
description: One medium (RFID, NFC, wristband, card, face reference, temporary credential) bound to
  a Virtual Ticket (declared 29 September, writers pass). `setMediaBindingActivation` writes the binding;
  its `activationMode` decides whether it is born `active` (`activateNow`) or `pending` (`schedule`,
  `activateOnFirstUse`, `activateOnCollection`, or `temporaryActivation` with a later start). **A medium
  already bound to another ticket is refused**, so a binding never moves between tickets; a replacement
  is a new binding and the old one is revoked.
initial:
- pending
- active
terminal:
- revoked
- expired
transitions:
- from: pending
  to: active
  trigger: timer
  guard: '`activationMode` is `schedule` and `scheduledAt` has come'
- from: pending
  to: active
  trigger: job
  guard: '`activationMode` is `activateOnFirstUse` and the first valid scan of the medium was accepted'
- from: pending
  to: active
  operation: setMediaBindingActivation
  trigger: operation
  guard: '`activationMode` is `activateOnCollection` and the counter activates the medium as it is handed
    over'
- from: pending
  to: active
  operation: resolveCredentialException
  trigger: operation
  guard: An `activationFailed` exception on this binding is retried (`retry`) and the activation now
    succeeds
- from: pending
  to: revoked
  operation: resolveCredentialException
  trigger: operation
  guard: '`useFallback` or `regenerate` on the exception for this binding; the failed medium is abandoned
    and the credential goes out on a new binding'
- from: pending
  to: revoked
  operation: replaceCredential
  trigger: operation
  guard: The medium is replaced before it was ever activated
- from: active
  to: suspended
  trigger: cascade
  guard: An identity lock whose scope covers this medium (`credentialOnly`, `mediaOnly`, `entitlement`,
    `venue`, `allVenueAccess`, `fullIdentity`) became active
- from: suspended
  to: active
  trigger: cascade
  guard: The last active identity lock covering this medium was released
- from: active
  to: revoked
  operation: replaceCredential
  trigger: operation
  guard: The replacement rule for the reason (`setMediaReplacementRevocation`) revokes the old medium
    at once. Where that rule requires approval, a granted `approvalRequestId` from the approvals engine
    is sent (`409 approval-required` without one). The row keeps `role` `revokedHistorical`
  isReversal: true
  requiresApproval: true
- from: active
  to: revoked
  trigger: timer
  guard: '`replaceCredential` was called under a rule with a grace period, and the grace period ended'
  isReversal: true
- from: suspended
  to: revoked
  operation: replaceCredential
  trigger: operation
  guard: A suspended medium is replaced (lost or stolen while locked); revoked at once
  isReversal: true
- from: pending
  to: expired
  trigger: timer
  guard: The ticket's validity ended before the medium was ever activated
- from: active
  to: expired
  trigger: timer
  guard: The Virtual Ticket's validity ended, or a `temporaryActivation` window closed
- from: suspended
  to: expired
  trigger: timer
  guard: The validity ended while the medium was suspended
openQuestions: null
notes: '`replaceCredential` needs approval only where the replacement rule says so; `requiresApproval`
  is true on active->revoked because it can, and the guard says when. **`revoked` and `expired` are
  terminal.** A medium that must work again is bound again, which writes a new binding; the revoked
  row stays for the audit trail and for the offline revocation package. Suspension is never set directly:
  it follows the identity locks.'
