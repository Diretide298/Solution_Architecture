description: One credential generation, binding, activation or delivery failure in the exception queue
  (declared 29 September, writers pass). The issuance and delivery jobs raise it `open` when a step
  fails; `resolveCredentialException` acts on it with one of `retry`, `regenerate`, `useFallback`, `escalate`,
  `assignOwner` or `openTechnicalCase`, each kept on `actionHistory` with the acting principal. **A
  resolved exception takes no further action** (`409`).
