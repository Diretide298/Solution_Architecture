id: LLD-MarketingService
title: MarketingService — 96 operations, 37 tables
generatedBy: tools/derive-diagrams.py
tier: engagement
index: diagrams/hld.yaml
why: '**93 operations and 37 tables — the biggest thing in the package, and probably two services eventually.**
  CRM and campaigns have different write patterns: a guest profile is read constantly and written rarely;
  a campaign send is a burst of millions of rows nobody reads again.


  **Kept as one for now** because splitting a service before it has a load profile is guessing.'
scale: Bursty on send, read-heavy otherwise. **The one to watch for a split.**
ifDown: Down stops campaigns and guest lookup. Neither stops trading.
coverage:
  operations: 96
  inAFlow: 39
  percent: 41%
  note: '**Flow coverage is how much of this service a journey has walked.** A service under 40% is
    unwalked rather than under-documented.'
