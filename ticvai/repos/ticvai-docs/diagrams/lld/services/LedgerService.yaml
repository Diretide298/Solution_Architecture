why: '**Money, and it is append-only.** 54 operations over 18 tables that are never updated and never
  deleted — a different discipline from everything around it, and one that should not share a deploy
  with anything that does mutate.'
scale: Write-heavy, batch-tolerant, not latency-critical. Recognition and revaluation are jobs.
ifDown: '**Correctness over availability.** A ledger that is briefly unavailable is recoverable; one
  that is briefly wrong is not.'
