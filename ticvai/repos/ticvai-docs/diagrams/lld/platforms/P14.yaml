why: '**Two audiences on one platform and the split matters.** A developer manages their own organisation,
  clients, sandboxes and subscriptions. A Softlabs administrator sets quotas, certifies integrations
  and configures licensing — `DEVELOPER_ADMIN`, and those screens are never shown to a developer.

  **Nothing here is offline-capable.** A developer portal is used at a desk.

  '
