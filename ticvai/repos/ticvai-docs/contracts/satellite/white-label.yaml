  /tenant-config/publish:
    post:
      operationId: publishTenantConfig
      x-ticvai-consumed-by:
        - "P08 BO-843 Publishing, Analytics & Audit"
        - "P09 ADM-016 White-Label Branding Management"
        - "P13 CMS-006 Component Preview"
        - "P13 CMS-014 Publishing Workflow"
        - "P13 CMS-103 Booking Flows"
      x-ticvai-audience:
      - staff
      x-ticvai-config-scope: tenant
      summary: Publish the working draft
      description: 'Validates, snapshots, versions and activates atomically: the draft is copied into
        the new version''s `snapshot`, and that version becomes the one guests read. Guests receive the new configuration
        on next launch — no store release, because runtime configuration is deliberately separated from
        build-time.

        The response names any build-time change in the draft that will **not** reach guests until the
        next release. A tenant who changed their app icon and published should be told plainly that the
        icon has not shipped.

        **Booking flows are published here (decided 29 September, W12).** Each venue''s enabled flows are copied
        into the snapshot with the rest of the draft; `getPublishedBookingFlow` reads them from the current
        version. An invalid enabled flow fails validation (409, `bookingFlowInvalid`).

        '
      tags:
      - publishing
      x-ticvai-permission: TENANT_PUBLISH
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
