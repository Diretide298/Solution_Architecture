          - gallery
          - cta
          - faq
          - form
          - embed
          - productGrid
          - countdown
          - testimonial
        position:
          type: integer
        body:
          type: object
          additionalProperties: true
          description: Typed by `kind`, and validated against the block's own schema at save.
        localeVariants:
          type: object
          additionalProperties: true
          description: '**Per-locale bodies, not per-locale pages.** A venue running Arabic and English
            should not maintain two page trees that drift — the structure is shared and the words are
            not.

            '
        status:
          type: string
          readOnly: true
          description: Created as `draft`; moved by `publishContentBlock` and the `publishAt`/`expireAt`
            timer (`states/content-block.yaml`), never by the body of a create.
          enum:
          - draft
          - scheduled
          - published
          - expired
          - archived
        publishAt:
          type: string
          format: date-time
          nullable: true
          description: '**Content scheduling, which the configuration model had no room for.** A seasonal
            banner that needs somebody awake at midnight is the same defect `Product.onSaleFrom` fixed.

            '
        expireAt:
          type: string
          format: date-time
          nullable: true
        audienceSegmentId:
          type: string
          format: uuid
          nullable: true
          description: '**Personalisation, evaluated at render.** A block shown only to members, or only
            to first-time visitors. Null shows it to everybody, which is what every block does today.

            '
        approvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
