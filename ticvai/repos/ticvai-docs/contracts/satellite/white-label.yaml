openapi: 3.1.0
info:
  title: TICVAI White Label Builder
  version: 0.1.0
  x-ticvai-screen-count: 77
  x-ticvai-tier: satellite
  x-ticvai-module: 19 — Guest Mobile App & Branding (builder)
  x-ticvai-requirements: 107
  x-ticvai-capabilities:
  - C57
  - C105
  - C106
  x-ticvai-platforms:
  - P13 Venue CMS
  - P08 Venue Management
  description: "## What this contract covers\n**How a tenant configures their branded guest app. A CMS\
    \ plus an app builder.**\n| | | |---|---| | **Tier** | satellite | | **Matrix domain** | 19 — Guest\
    \ Mobile App & Branding (builder) | | **Requirements** | ~107 | | **Capabilities** | C57, C105, C106\
    \ | | **Consumed by** | P13 Venue CMS · P08 Venue Management |\n## How to read this file\n**This file\
    \ is a contract.** It is hand-authored and it is the source of truth for one bounded context: server\
    \ code, client code and mock servers are generated from it, never the other way round. If a field\
    \ is not here, it does not exist.\n**Contracts are split into two tiers.**\n- **Spine** — the eight\
    \ contexts everything else depends on: tenancy, identity,\n  catalogue, orders, shift, access, finance,\
    \ cross-region. Frozen first. A change here\n  requires a formal change request, because every satellite\
    \ has pinned against it.\n- **Satellite** — a domain that builds on the spine and can move independently.\n\
    \  Cheaper to change.\n\n**`paths` are operations.** Each one declares four TICVAI extensions, and\
    \ Redocly rejects any that does not:\n| Extension | Answers | |---|---| | `x-ticvai-permission` |\
    \ Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed\
    \ | | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held | |\
    \ `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this | | `x-ticvai-conflict-policy`\
    \ | How a replayed operation resolves — `append`, `serverWins`, `manual` |\nWhere `x-ticvai-permission`\
    \ is null, one of these says why: `x-ticvai-auth: service` (cell-to-cell), `x-ticvai-self-scoped`\
    \ (acts only on the caller's own resources), or `security: []` (genuinely public).\n**`components.schemas`\
    \ are API schemas — the shape of data on the wire.** They are not database tables. One API schema\
    \ may become three columns (`Money`) or five tables (`Order`); some have no table at all (`ValidationResult`,\
    \ `TrialBalance`). Roughly 70% of the DDL derives from these, and the rest — partitioning, RLS, the\
    \ PII split — is storage design that lives in the migration scripts.\n**`security` says who may call.**\
    \ An operation with no `security` of its own inherits the file-level `bearerAuth`, a staff session.\
    \ `security: []` on an operation removes that: the call is public and needs no token. A list naming\
    \ several schemes accepts any one of them, and an empty object `{}` in the list makes the token optional.\
    \ Inside a scheme the array holds OAuth scopes; TICVAI uses none, so it is always empty.\n\n## This\
    \ context\nHow a tenant configures\
    \ their branded guest app — identity, theme, navigation, homepage, content, module enablement, and\
    \ publishing. Capabilities C57, C105 and C106.\nTwenty screens in the client UI/UX reference. This\
    \ is not a settings page; it is a CMS plus an app builder, and no tenant goes live without it.\nPositions\
    \ this encodes:\n- **Build-time and runtime configuration are separated and enforced.** Every change\
    \ to a\n  build-time value costs a store review cycle, so the API marks those fields explicitly\n\
    \  and refuses to treat them as publishable config.\n- **Publishing is a workflow, not a save.** Draft\
    \ → review → preview → publish, with\n  version history and restore. A tenant editing their live app\
    \ in place is a tenant one\n  keystroke from a broken storefront.\n- **Configuration versions behave\
    \ like catalogue bundles.** Immutable, versioned,\n  atomically applied, restorable. Same problem,\
    \ so the same mechanism rather than a\n  second one.\n- **Module enablement is the licensing model\
    \ surfaced.** A module the tenant has not\n  licensed cannot be enabled here, and a disabled module\
    \ is hidden from the guest app\n  entirely rather than shown and refused.\n- **Arabic is a first-class\
    \ layout, not a translation layer.** Fonts pair Arabic with\n  Latin, preview toggles direction, and\
    \ content carries per-language versions.\n\n## Draft, published and live\n**One working draft per\
    \ tenant.** It is the tenant's `whitelabel.tenant_config` row (`isDraft` true) and the rows that hang\
    \ off it: brand, app icons, booking flow, theme, fonts, header, footer, navigation, homepage, module\
    \ enablement, feature toggles, languages and each venue's booking flows (29 September, W12). Every `set*` operation on those parts writes the draft,\
    \ and nothing a guest sees changes. The first `set*` call creates the draft row; until a part has\
    \ been saved once, its read returns 404 `not-configured`, which a screen shows as its first-run state.\n\
    **Published versions are snapshots.** `publishTenantConfig` copies the draft into a new `ConfigVersion`\
    \ (its `snapshot`) and makes that version current. Guests read the current version, never the draft.\
    \ `restoreConfigVersion` copies a snapshot back into the draft and does not publish.\n**Outside the\
    \ draft:** `setMaintenanceMode` (live at once, and neither published nor restored), `setPolicy` (each\
    \ call publishes a policy version), content blocks and banners (each has its own schedule), custom\
    \ domains, the Site Builder's progress, the client's store accounts and app builds (29 September, W12 and M24-08).\n\n## Fields the server owns\nA `readOnly` field (an id, a `status` or `state` that an operation\
    \ or a timer moves, `scopePath`, a computed field) is returned and never taken: a request that carries\
    \ one has it ignored. `x-ticvai-derived` says how a computed field is kept current: `onWrite` (in the\
    \ same transaction as the write that changes it), `onRead` (computed when read, never stored) or `sweeper`\
    \ (a timer).\n\n## Asset references\nA field named `*AssetRef` or `*AssetRefs` holds the `id` of a `MediaAsset`\
    \ in the `assets` library, produced there by `createUpload` then `completeUpload`.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: overview
- name: brand
- name: theme
- name: navigation
- name: homepage
- name: content
- name: modules
- name: publishing
- name: bookingFlows
- name: appPublishing
paths:
  /tenant-domains:
    get:
      operationId: listCustomDomains
      x-ticvai-consumed-by:
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      summary: The domains this tenant has claimed
      description: '**Status per domain, not just the hostname.** `pending`, `verifying`, `verified`,
        `issuing`, `active`, `failed`, `expired` or `revoked` (`states/custom-domain.yaml`) — a tenant
        looking at this screen is almost always looking because something is wrong. A certificate close
        to lapsing is an `active` domain with an early `certificateExpiresAt`; there is no separate status
        for it.

        '
      tags:
      - white-label
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDomain'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: claimCustomDomain
      x-ticvai-consumed-by:
        - "P08 BO-835 Site, Brand & Domain Setup"
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      summary: Claim a domain and get a verification token
      description: '**Claiming is not owning.** The response carries the record the tenant must publish
        (`verificationRecord`), and nothing happens until it resolves.

        **Refused where another tenant already holds it** — with no detail about who, because telling
        one tenant that another owns a hostname is telling them something about a customer.

        '
      tags:
      - white-label
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hostname
              - kind
              properties:
                hostname:
                  type: string
                kind:
                  type: string
                  enum:
                  - guestWeb
                  - guestApp
                  - partnerPortal
                  - developerPortal
                verificationMethod:
                  type: string
                  enum:
                  - dnsTxt
                  - cname
                  - httpFile
                  default: dnsTxt
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Claimed, with the record to publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomain'
        '409':
          description: '**Already claimed.** Named as unavailable rather than attributed.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tenant-domains/{domainId}/verify:
    parameters:
    - name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: verifyCustomDomain
      x-ticvai-consumed-by:
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      summary: Check the record and issue the certificate
      description: '**Verification and issuance are one act from the tenant''s point of view and two states
        in the model.** A tenant who has published the record wants a working domain, not a green tick.

        **Retried by a job rather than by the tenant.** DNS propagation takes hours and a tenant clicking
        *verify* every ten minutes is a tenant who will give up before it resolves.


        **Verification routes the hostname** (system-design review SD-021, 29 September; applied 30
        September). In the same step that marks the domain verified, it calls tenancy
        `setTenantDomainMapping`, which writes `control.tenant_domain` (hostname, tenant, cell, database,
        channel, status `active`) so the edge''s `resolveTenantHost` can route the host. Until that write
        succeeds the domain is not reported live. A hostname already routed to another tenant is refused
        409 `hostname-taken` and nothing is issued.

        '
      x-ticvai-calls:
      - tenancy.setTenantDomainMapping
      tags:
      - white-label
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Verified, or the reason it is not yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomain'
        '409':
          description: The hostname is already routed to another tenant (`hostname-taken`, from tenancy
            `setTenantDomainMapping`, SD-021); nothing was verified or issued.
          x-ticvai-problem-types:
          - hostname-taken
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tenant-domains/{domainId}:
    parameters:
    - name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: relinquishCustomDomain
      x-ticvai-consumed-by:
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      summary: Give the domain up
      description: '**Refused while it is the only active domain for a live app.** Releasing the hostname
        a tenant''s guests are using takes their storefront down, and the confirmation should say so rather
        than the request succeeding.

        **A live app is an app with a published configuration (decided 28 September, audit R096)**: the
        tenant has a current `ConfigVersion` (`TenantAppStatus.isPublished` true) for the app the domain
        serves. Maintenance mode does not make an app less live.


        **Detaching unroutes the hostname** (SD-021, applied 30 September): the release calls tenancy
        `setTenantDomainMapping` with status `detached`, so the edge stops routing the host to this
        tenant in the same step; the row is kept for the audit trail, not deleted.

        '
      x-ticvai-calls:
      - tenancy.setTenantDomainMapping
      tags:
      - white-label
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Released
        '409':
          description: '**The only active domain for a live app.** Refused, naming what would break.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /footer:
    put:
      operationId: setFooter
      x-ticvai-consumed-by:
        - "P13 CMS-007 Page Builder"
      summary: Footer columns, legal links and social
      description: 'BL-002. **A header is chrome and a footer is a link surface**, which is why this is
        not `setHeader` with different fields.

        **Legal links are held separately from the free-form columns**, so a tenant reorganising their
        footer cannot remove the privacy notice by accident.

        **Set per tenant in the tenant''s own configuration, not in the control plane (decided 28
        September, audit R163).** The footer is part of the working draft and reaches guests through
        `publishTenantConfig`, like the header and the theme.

        '
      tags:
      - whiteLabel
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FooterConfig'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FooterConfig'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /content-blocks:
    post:
      operationId: createContentBlock
      x-ticvai-consumed-by:
        - "P08 BO-839 Dynamic Product Pages"
      summary: Author a block of content
      description: 'BL-172. **The CMS modelled configuration and not authoring** — a marketer could choose
        between things a developer had built and could not write something new.

        **Scheduled, localised and optionally personalised.** The page builder is a frontend over this,
        the same way the venue map''s canvas is a frontend over its graph.

        '
      tags:
      - whiteLabel
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentBlock'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created as a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBlock'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /content-blocks/{blockId}/publish:
    parameters:
    - name: blockId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: publishContentBlock
      summary: Publish now, or schedule it
      description: '**A seasonal banner needing somebody awake at midnight is the same defect `Product.onSaleFrom`
        fixed**, and the answer is the same: a date on the object rather than a person with an alarm.

        Approval is separate from authoring where the tenant requires it — **the approver may not be the
        author**, following the rule already enforced on products.

        **`expireAt` must follow `publishAt`** when both are sent (decided 28 September, audit R163), or
        400. A scheduled job makes the publish and the expiry at those times (audit R163).

        '
      tags:
      - whiteLabel
      x-ticvai-permission: TENANT_PUBLISH
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publishAt:
                  type: string
                  format: date-time
                  nullable: true
                expireAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Published or scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBlock'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tenant-config:
    get:
      operationId: getTenantConfig
      x-ticvai-consumed-by:
        - "P01 WEB-001 Home / Landing"
        - "P02 GST-001 Home"
        - "P05 KSK-002 Language Select"
        - "P08 BO-599 Manual Configuration Center"
        - "P08 BO-834 Digital Experience Center"
        - "P13 CMS-001 Tenant Workspace"
        - "P13 CMS-012 RTL Preview"
        - "P13 CMS-016 Site Settings"
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-read-routing: replica
      summary: Full working configuration
      description: 'Everything the builder edits. **A staff caller gets the working draft**, or with
        `version` the snapshot of that published version. **A guest caller always gets the current published
        version**: `version` is ignored and `TENANT_CONFIGURE` is not needed, because reading the published
        app is not configuring it. The dashboard''s status view (published state, module and page counts,
        recent changes) is `getTenantAppStatus`, not this.

        '
      tags:
      - overview
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      security:
      - guestAuth: []
      - bearerAuth: []
      parameters:
      - name: version
        in: query
        description: Read a published version's snapshot instead of the working draft. Staff only.
        schema:
          type: string
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfig'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          description: '`version` names no published version (`not-found`), or the tenant has no working
            draft yet — for a guest, nothing has been published yet (`not-configured`).

            '
          x-ticvai-problem-types:
          - not-found
          - not-configured
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tenant-config/status:
    get:
      operationId: getTenantAppStatus
      x-ticvai-consumed-by:
        - "P01 WEB-001 Home / Landing"
        - "P01 WEB-025 Help Centre / FAQ"
        - "P01 WEB-028 Contact & Venue Information"
        - "P01 WEB-029 Error / Sold Out / Maintenance"
        - "P01 WEB-045 Help Centre & Accessibility"
        - "P01 WEB-050 Plan Your Visit"
        - "P02 GST-001 Home"
        - "P02 GST-029 Venue Info & Services"
        - "P02 GST-038 At the Venue"
        - "P02 GST-040 Help & Support"
        - "P02 GST-047 Maintenance / Upgrade Page"
        - "P02 GST-051 Plan"
        - "P05 KSK-002 Language Select"
        - "P13 CMS-001 Tenant Workspace"
        - "P13 CMS-014 Publishing Workflow"
        - "P13 CMS-102 Site Builder"
      x-ticvai-audience:
      - device
      - guest
      x-ticvai-read-routing: replica
      summary: App status and recent changes
      description: 'Also the endpoint the guest app calls to discover a maintenance window, which is why
        it is unauthenticated and cacheable.

        **Two views of one schema.** Called without a staff session, the response carries only `tenantId`,
        `isPublished`, `publishedVersion`, `publishedAt`, `isInMaintenance`, `maintenanceMessage`,
        `expectedBackAt`, `minimumAppVersion`, `contact`, `availability`, `availabilityMessage`, `venues` and `whatsNew`. The draft and CMS fields (`draftVersion`, `hasUnpublishedChanges`, the module
        and page counts, `recentChanges`) are returned only to a staff session holding `TENANT_CONFIGURE`
        — a public, cacheable response must not carry who changed what.

        **It also carries what the guest screens promise (decided 28 September, audit R073)**: the
        minimum supported app version, so GST-047 can force an upgrade (`minimumAppVersion`); and the
        venue''s contact details with a sold-out or closed signal, for WEB-028 and WEB-029 (`contact`,
        `availability`). All of them are set with `setMaintenanceMode`.

        **And the tenant''s venues, for the guest''s venue picker (decided 28 September, audit R267)**: the
        guest picks a venue on first open of WEB-001 or GST-001, the choice is remembered on the device
        and changeable, and on a visit day the app suggests the venue on the guest''s ticket. `venues` lists
        the tenant''s active venues so that picker has a source without a session.

        **And what is new, for guests (decided 29 September, rev 3 GAP-B2)**: `whatsNew` is the public,
        localised release notes the guest Help screen reads (WEB-025, WEB-045, GST-040), newest first, at
        most 10, filled from `platform-ops.Release.guestReleaseNotes` of the releases the tenant''s cell
        has received, skipping releases with none. It names no person. `recentChanges` stays staff only.

        '
      tags:
      - overview
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      # Public, with an optional staff token: `{}` makes authentication optional (header, "security").
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAppStatus'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setMaintenanceMode
      x-ticvai-consumed-by:
        - "P13 CMS-001 Tenant Workspace"
      x-ticvai-audience:
      - staff
      summary: Enable or clear maintenance mode, and set the live app status
      description: 'Renders the branded maintenance screen with an expected-back time. Tenant-branded,
        because an unbranded error page in a tenant''s app looks like the tenant''s failure.

        **Also sets the rest of the live app status (decided 28 September, audit R073)**: the minimum
        supported app version, the contact details and the sold-out or closed signal. Each is optional
        in the body and a field not sent is left as it is, so clearing maintenance does not clear the
        contact details.

        **Live at once, not through `publishTenantConfig`.** Written to the maintenance fields of the
        tenant''s `tenant_config` row (`TenantConfig.isInMaintenance`, `maintenanceMessage`, `expectedBackAt`),
        which a publish does not snapshot and a restore does not overwrite. `getTenantAppStatus` reads
        them from there.

        '
      tags:
      - overview
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - isInMaintenance
              properties:
                isInMaintenance:
                  type: boolean
                message:
