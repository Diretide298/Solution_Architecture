      description: 'Computed on read. The published fields come from the current `ConfigVersion`, the
        maintenance fields from the tenant''s `tenant_config` row (`setMaintenanceMode`), and the draft
        fields from the working draft. **Fields marked staff only are left out of a response to a caller
        without a staff session** (`getTenantAppStatus`).

        '
      required:
      - tenantId
      - isPublished
      - isInMaintenance
      properties:
        tenantId:
          type: string
          format: uuid
        isPublished:
          type: boolean
          x-ticvai-derived: onRead
          description: True once any version has been published.
        publishedVersion:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        draftVersion:
          type: string
          description: Staff only.
        hasUnpublishedChanges:
          type: boolean
          x-ticvai-derived: onRead
          description: Staff only. The working draft differs from the current version's `snapshot`.
        activeModuleCount:
          type: integer
          x-ticvai-derived: onRead
          description: Staff only. `ModuleEnablement` rows with `isEnabled` true.
        licensedModuleCount:
          type: integer
          x-ticvai-derived: onRead
          description: Staff only. `ModuleEnablement` rows with `isLicensed` true.
        activePageCount:
          type: integer
          x-ticvai-derived: onRead
          description: Staff only. Content pages that are `published` and enabled.
        isInMaintenance:
          type: boolean
        maintenanceMessage:
          $ref: '#/components/schemas/LocalisedText'
        expectedBackAt:
          type: string
          format: date-time
          nullable: true
        minimumAppVersion:
          $ref: '#/components/schemas/MinimumAppVersion'
        contact:
          $ref: '#/components/schemas/VenueContact'
        availability:
          $ref: '#/components/schemas/AppAvailability'
        availabilityMessage:
          allOf:
          - $ref: '#/components/schemas/LocalisedText'
          nullable: true
          description: What the sold-out or closed screen says (WEB-029). Null shows the default wording.
        venues:
          type: array
          maxItems: 200
          x-ticvai-derived: onRead
          description: >
            **Public: the venues a guest can pick** (decided 28 September, audit R267; schema named 29
            September, readiness close-out, our build plan). The source of the venue picker on WEB-001 and
            GST-001, returned with or without a session. **Published only**: a venue is listed when its scope
            node is active (`tenancy.OrgUnit.isActive`) and it is in the tenant's current published
            `ConfigVersion`; a venue added or reactivated since the last publish appears after the next
            publish, and a draft never reaches a guest. Ordered by `name`. Empty when nothing is published.
          items:
            type: object
            required:
            - venueId
            - name
            properties:
              venueId:
                type: string
                format: uuid
                description: '**The venue''s scope node** (`tenancy.OrgUnit.id`, level venue): what every guest
                  screen that declares `venueId` `from: session` reads once the guest picks it.'
              name:
                type: string
                maxLength: 200
                description: The venue's name (`tenancy.OrgUnit.name`).
              city:
                type: string
                maxLength: 120
                nullable: true
                description: Shown under the name so two venues with similar names can be told apart.
              openingHoursToday:
                type: object
                nullable: true
                description: Today's opening hours in the venue's time zone, from `tenancy.VenueSettings`
                  opening hours. Null when the venue is closed today or has none set.
                properties:
                  opens:
                    type: string
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                  closes:
                    type: string
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        whatsNew:
          type: array
          maxItems: 10
          x-ticvai-derived: onRead
          description: >
            **Public: the guest "what's new"** (decided 29 September, rev 3 GAP-B2). Newest first, at most
            10, from `platform-ops.Release.guestReleaseNotes` of the releases the tenant's cell has
            received; a release with no guest notes is skipped. Returned with or without a staff session.
          items:
            type: object
            required:
            - version
            - publishedAt
            - notes
            properties:
              version:
                type: string
                description: The release version.
              publishedAt:
                type: string
                format: date-time
                description: When the release reached the tenant's cell.
              notes:
                $ref: '#/components/schemas/LocalisedText'
        recentChanges:
          type: array
          description: Staff only. Names the principal behind each change, so it never reaches a public
            response.
          items:
            type: object
            properties:
              area:
                type: string
              description:
                type: string
              principalId:
                type: string
                format: uuid
              at:
                type: string
                format: date-time
    MinimumAppVersion:
      x-ticvai-persistence: none — embedded in tenant_config
      type: object
      nullable: true
      description: '**The oldest guest app build still allowed to run (decided 28 September, audit R073).**
        A guest app whose own version is below the one for its platform shows the forced-upgrade screen
        (GST-047) and nothing else. Null, or a platform left null, forces nothing. Live at once through
        `setMaintenanceMode`, because an upgrade that must wait for a publish is not forced.

        '
      properties:
        ios:
          type: string
          nullable: true
          pattern: ^\d+\.\d+\.\d+$
        android:
          type: string
          nullable: true
          pattern: ^\d+\.\d+\.\d+$
    VenueContact:
      x-ticvai-persistence: none — embedded in tenant_config
      type: object
      nullable: true
