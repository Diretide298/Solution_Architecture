          description: Required when `kind` is `productCategory`. A catalogue `ProductCategory`.
        eventId:
          type: string
          format: uuid
          nullable: true
          description: Required when `kind` is `event`.
        moduleKey:
          allOf:
          - $ref: '#/components/schemas/ModuleKey'
          nullable: true
          description: Required when `kind` is `module`. The module must be enabled.
        bookingFlowId:
          type: string
          format: uuid
          nullable: true
          description: Required when `kind` is `bookingFlow` (decided 29 September, W12; BUILD-YOUR-EXPERIENCE
            "each answer points to one booking flow"). One of the venue's enabled `BookingFlow`s.
    GuidedChoice:
      x-ticvai-persistence: whitelabel.guided_choice + whitelabel.guided_choice_question + whitelabel.guided_choice_answer
      type: object
      description: '**Help me choose (decided 29 September, rev 3 REV3-11).** A venue''s short set of
        questions that ends on a result card opening the booking flow, product, category or event that
        fits. Each question has a few answers with a title, a one-line body, an icon and an optional badge;
        **the answer the guest picks on the last question decides the result**, and each earlier answer
        carries a target too, so a one-question setting still ends on a result. Venue configuration, never
        hard-coded: set up in Venue Management, off unless the venue publishes one.

        **Two sources, one review.** `manual` is written by staff; `aiSuggested` is proposed by the `ai`
        service from the venue''s uploaded products (a suggestion, reviewed and published by a person,
        never auto-published). Both arrive as `draft`.

        **Help me choose filters the catalogue (decided 29 September, W4).** With `behaviour` `filter`, the
        default, each answer''s `filter` narrows the products the guest sees (web, mobile and kiosk alike,
        through catalogue `listProducts` and `searchCatalogue` `guidedAnswerIds`), with a "Show everything"
        link; `recommend` keeps the rev 3 result card from the last answer''s `target`. **It is never a consent
        step**: an answer may pre-fill a REV3-26 consent question (`consentPrefill`), which the guest still
        confirms, so the question is not asked twice and the consent stays explicit.

        '
      required:
      - id
      - venueId
      - name
      - mode
      - questions
      - status
      - source
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUIDv7.
        venueId:
          type: string
          format: uuid
          readOnly: true
          description: From the path of `createGuidedChoice`.
        name:
          type: string
          maxLength: 80
          description: Staff-facing name, e.g. "Water park day planner". Not shown to guests.
        mode:
          type: string
          enum:
          - button
          - popupOnArrival
          - 'off'
          default: button
          description: '**How the guest reaches it (rev 3 REV3-11).** `button` puts a Help me choose button
            on the booking page; `popupOnArrival` also opens it once on the guest''s first arrival at the
            booking page (whether it was seen is kept on the device only); `off` keeps a published choice
            configured but not shown.

            '
        showBanner:
          type: boolean
          default: true
          description: The dark banner under the products ("Choose from the experiences above or let us
            help you decide") with a Help me choose button. Ignored when `mode` is `off`.
        behaviour:
          type: string
          enum:
          - filter
          - recommend
          default: filter
          description: '**`filter` (default) narrows the list; `recommend` ends on one result card (decided
            29 September, W4).** With `filter`, every answer needs a `filter` and `target` is optional; with
            `recommend`, every answer on the last question needs a `target`. `publishGuidedChoice` refuses
            the other case with 422.

            '
        showEverything:
          type: boolean
          default: true
          description: The "Show everything" link under a filtered list, which clears the answers (W4).
        questions:
          type: array
          minItems: 1
          maxItems: 4
          description: '**One to four questions** (decided 29 September, W4: the Deep Dive reference asks
            three or four; rev 3 REV3-11 allowed two). Shown in `sortOrder`.

            '
          items:
            type: object
            required:
            - title
            - sortOrder
            - answers
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
                description: UUIDv7. The row's own key.
              title:
                $ref: '#/components/schemas/LocalisedText'
              kind:
                type: string
                enum:
                - choice
                - yesNo
                - age
                - level
                - certification
                default: choice
                description: '**What the question asks (decided 29 September, W4).** `choice` free answers;
                  `yesNo` two answers (e.g. "Can everyone swim?"); `age` answers carrying an age range; `level`
                  answers carrying a level tag; `certification` answers saying whether the guest holds a certificate
                  (e.g. a diving licence). The kind decides which `filter` fields its answers use.

                  '
              sortOrder:
                type: integer
                minimum: 0
              answers:
                type: array
                minItems: 2
                maxItems: 4
                description: Two to four answers; the prototype shows three (proposed, client to correct,
                  rev 3 REV3-11).
                items:
                  type: object
                  required:
                  - title
                  - sortOrder
                  properties:
                    id:
                      type: string
                      format: uuid
                      readOnly: true
                      description: UUIDv7. The row's own key.
                    title:
                      $ref: '#/components/schemas/LocalisedText'
                    body:
                      allOf:
                      - $ref: '#/components/schemas/LocalisedText'
                      description: The one-liner under the title, at most 140 characters in each language.
                    icon:
                      type: string
                      maxLength: 40
                      nullable: true
                      description: An icon name from the guest app's icon set.
                    badge:
                      allOf:
                      - $ref: '#/components/schemas/LocalisedText'
                      nullable: true
                      description: Optional, e.g. "Best value". At most 24 characters in each language.
                    sortOrder:
                      type: integer
                      minimum: 0
                    target:
                      allOf:
                      - $ref: '#/components/schemas/GuidedChoiceTarget'
                      nullable: true
                      description: Required with `behaviour` `recommend` on the last question; optional with
                        `filter`, where it is the card shown above the filtered list.
                    filter:
                      type: object
                      nullable: true
                      description: '**What this answer keeps in the list (decided 29 September, W4).** Every
                        field set must hold; answers to different questions are combined with AND. Required with
                        `behaviour` `filter`. The server applies it (catalogue `guidedAnswerIds`), so web, mobile
                        and kiosk show the same list.

                        '
                      properties:
                        productIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                        productCategoryIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                        segmentTags:
                          type: array
                          description: Catalogue `Product.segmentTags`, e.g. a level tag.
                          items:
                            type: string
                        minAgeYears:
                          type: integer
                          minimum: 0
                          nullable: true
                        maxAgeYears:
                          type: integer
                          minimum: 0
                          nullable: true
                          description: With `minAgeYears`, checked against each product's age rule (catalogue
                            `ProductEligibilityRule`).
                        requiresSwimmer:
                          type: boolean
                          nullable: true
                          description: False hides products whose eligibility needs a swimmer; true keeps only
                            those.
                        certificationCode:
                          type: string
                          nullable: true
                          maxLength: 40
                          description: Keeps products that need this certificate, or with `holdsCertification`
                            false, hides them.
                        holdsCertification:
                          type: boolean
                          nullable: true
                    consentPrefill:
                      type: object
                      nullable: true
                      description: '**Pre-fills a REV3-26 consent question from this answer (decided 29 September,
                        W4).** The guest still ticks it at the consent step; nothing is recorded as consent until
                        they do.

                        '
                      required:
                      - consentQuestionId
                      - answer
                      properties:
                        consentQuestionId:
                          type: string
                          format: uuid
                        answer:
                          type: boolean
                    result:
                      type: object
                      nullable: true
                      description: The result card when this answer decides the result. Absent fields
                        fall back to the target's own name, summary and image.
                      properties:
                        title:
                          $ref: '#/components/schemas/LocalisedText'
                        body:
                          $ref: '#/components/schemas/LocalisedText'
                        imageAssetRef:
                          type: string
                          format: uuid
                          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/GuidedChoiceStatus'
          readOnly: true
        source:
          type: string
          enum:
          - manual
          - aiSuggested
          readOnly: true
          description: '`manual` when staff created it; `aiSuggested` when the `ai` service proposed it
            (a service caller). Kept after a person edits a suggestion, so a report can say how many AI
            proposals were published.'
        suggestionRef:
          type: string
          nullable: true
          readOnly: true
          description: For `aiSuggested`, the id of the `ai` job that proposed it. Null for `manual`.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        publishedBy:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The person who published it. Never a service.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    BookingFlowTypeKey:
      type: string
      description: '**The flow types the system catalogue offers (decided 29 September, W12; impact.md b).**
        `seatedFixedPerformance` and `seatedDateTimeSeatMap` are the two seated flows; `cabanaMap` and `cabanaBySize`
        are the two cabana flows (W6); `experienceWorkshop` puts the product before the date (W8); `multiLocation`
        opens on the location switcher.

        '
      enum:
      - datedDayPass
      - timedEntry
      - openDated
      - seatedFixedPerformance
      - seatedDateTimeSeatMap
      - experienceWorkshop
      - surfSession
      - meetingRoomHourly
      - cabanaMap
      - cabanaBySize
      - guidedTourByLanguage
      - transport
      - tableReservation
      - membership
      - giftCard
      - multiLocation
    BookingFlowStepKey:
      type: string
      description: 'Every step a guest booking flow can hold (decided 29 September, W12). What each step does
        on WEB and MOB, and which screen draws it, is in the screen definitions of P01 and P02; which types
        carry which steps is `x-ticvai-system-catalogue` on `BookingFlowType`. `payment` is always last. Sign-in
        is not a step: it is asked where the flow''s `signInAt` says.

        '
      enum:
      - location
      - helpMeChoose
      - product
      - date
      - time
      - performance
      - level
      - language
      - duration
      - route
      - partySize
      - resourceMap
      - resourceSize
      - seatMap
      - tickets
      - attendees
      - membershipPlan
      - giftCardValue
      - recipient
      - consent
      - extras
      - review
      - payment
    BookingFlowType:
      x-ticvai-persistence: none — system catalogue, shipped with the service and the same for every tenant
      type: object
      description: '**A flow type from the system catalogue (decided 29 September, W12).** Read-only: a venue
        picks one (`createBookingFlowDefinition`) and orders its steps within `orderConstraints`. `requirement`
        is `required` (cannot be turned off), `optional` (the venue chooses) or `conditional` (shown to a guest
        only when `condition` holds; the venue may still turn it off where it is not also required by law or
        by a product, as the condition says). `settingsOwned` names the settings, venue-wide (`BookingFlowSettings`)
        or flow-level (`BookingFlowLevelSettings`), that the CMS shows beside the step; `stepSettings` are the
        step''s own settings, kept in `BookingFlowStep.settings`.

        '
      x-ticvai-system-catalogue:
        commonConstraints:
        - {kind: last, stepKey: payment}
        - {kind: first, stepKey: location}
        - {kind: before, stepKey: helpMeChoose, otherStepKey: tickets}
        - {kind: before, stepKey: helpMeChoose, otherStepKey: product}
        - {kind: before, stepKey: tickets, otherStepKey: extras}
        - {kind: before, stepKey: tickets, otherStepKey: consent}
        - {kind: before, stepKey: review, otherStepKey: payment}
        commonConditions:
          location: the tenant has more than one active venue and `locationSwitcher` is on
          helpMeChoose: the venue has a published `GuidedChoice`
          consent: the flow's `consentQuestionIds` or a product in the cart asks a consent question (REV3-26);
            cannot be turned off while either does
          attendees: a product in the cart asks attendee details
        types:
        - key: datedDayPass
          productKinds: [admission, datedAdmission]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: helpMeChoose, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays, performanceReveal]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories, ticketTags, cardInfo, cardLayout, cardSize, showInfoOnly]}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
        - key: timedEntry
          productKinds: [timedAdmission]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: helpMeChoose, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays, performanceReveal]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries, performanceReveal]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories, ticketTags, cardInfo, cardLayout, cardSize, showInfoOnly]}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: time}
        - key: openDated
          productKinds: [openDated, admission]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: helpMeChoose, requirement: conditional}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories, ticketTags, cardInfo, cardLayout, cardSize, showInfoOnly]}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
        - key: seatedFixedPerformance
          productKinds: [seated]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: performance, requirement: required, condition: skipped for the guest when the event has one on-sale performance}
          - {stepKey: seatMap, requirement: required, settingsOwned: [seatPicker, seatViewPosition, seatTimeBar, mapView]}
          - {stepKey: tickets, requirement: conditional, condition: "the seat's price category has more than one ticket type (adult or child)"}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: performance, otherStepKey: seatMap}
        - key: seatedDateTimeSeatMap
          productKinds: [seated]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays, seatEventDateMode]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries, seatEventDateMode]}
          - {stepKey: seatMap, requirement: required, settingsOwned: [seatPicker, seatViewPosition, seatTimeBar, mapView, seatEventDateMode]}
          - {stepKey: tickets, requirement: conditional, condition: the seat's price category has more than one ticket type}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: time}
          - {kind: before, stepKey: time, otherStepKey: seatMap}
        - key: experienceWorkshop
          productKinds: [timedAdmission, admission]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: helpMeChoose, requirement: conditional}
          - {stepKey: product, requirement: required, settingsOwned: [cardLayout, cardSize, cardInfo, showInfoOnly]}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays, performanceReveal]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories, ticketTags]}
          - {stepKey: attendees, requirement: conditional}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: product, otherStepKey: date}
          - {kind: before, stepKey: date, otherStepKey: time}
        - key: surfSession
          productKinds: [timedAdmission, rental]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries]}
          - {stepKey: level, requirement: required, stepSettings: [{name: levels, type: 'string[]', note: level tags offered, from the products' segmentTags}]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketTags, cardInfo]}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: time}
          - {kind: before, stepKey: time, otherStepKey: level}
        - key: meetingRoomHourly
          productKinds: [rental]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries]}
          - {stepKey: duration, requirement: required, stepSettings: [{name: minHours, type: integer, default: 1}, {name: maxHours, type: integer, default: 8}, {name: stepMinutes, type: integer, default: 60}]}
          - {stepKey: partySize, requirement: optional, stepSettings: [{name: minGuests, type: integer, default: 1}, {name: maxGuests, type: integer}]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: time}
          - {kind: before, stepKey: time, otherStepKey: duration}
        - key: cabanaMap
          productKinds: [rental]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: resourceMap, requirement: required, condition: "the venue's resource selection policy lets the guest choose (resources setResourceSelectionPolicy guestMayChoose; REV3-15)", settingsOwned: [mapView]}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: resourceMap}
        - key: cabanaBySize
          productKinds: [rental]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: partySize, requirement: required, stepSettings: [{name: minGuests, type: integer, default: 1}, {name: maxGuests, type: integer}]}
          - {stepKey: resourceSize, requirement: required, note: the server assigns a unit of the chosen size}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: resourceSize}
          - {kind: before, stepKey: partySize, otherStepKey: resourceSize}
        - key: guidedTourByLanguage
          productKinds: [timedAdmission]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: language, requirement: required, stepSettings: [{name: languages, type: 'string[]', note: ISO 639-1 codes the tours run in}]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories, ticketTags]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: time}
          - {kind: before, stepKey: language, otherStepKey: time}
        - key: transport
          productKinds: [admission, timedAdmission]
          steps:
          - {stepKey: route, requirement: required}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: route, otherStepKey: time}
          - {kind: before, stepKey: date, otherStepKey: time}
        - key: tableReservation
          productKinds: [fnb]
          steps:
          - {stepKey: location, requirement: conditional}
          - {stepKey: date, requirement: required, settingsOwned: [dateStripDays]}
          - {stepKey: partySize, requirement: required, stepSettings: [{name: minGuests, type: integer, default: 1}, {name: maxGuests, type: integer, default: 12}]}
          - {stepKey: time, requirement: required, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries]}
          - {stepKey: extras, requirement: optional, note: pre-order, settingsOwned: [extrasStep]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: conditional, condition: the venue takes a deposit or pre-order for the table, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: date, otherStepKey: time}
          - {kind: before, stepKey: partySize, otherStepKey: time}
        - key: membership
          productKinds: [membership]
          steps:
          - {stepKey: membershipPlan, requirement: required}
          - {stepKey: attendees, requirement: required, note: each member's details}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: membershipPlan, otherStepKey: attendees}
        - key: giftCard
          productKinds: [giftCard]
          steps:
          - {stepKey: giftCardValue, requirement: required}
          - {stepKey: recipient, requirement: required}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
        - key: multiLocation
          productKinds: [admission, timedAdmission, datedAdmission]
          steps:
          - {stepKey: location, requirement: required, settingsOwned: [locationSwitcher]}
          - {stepKey: helpMeChoose, requirement: conditional}
          - {stepKey: product, requirement: required, settingsOwned: [cardLayout, cardSize, cardInfo]}
          - {stepKey: date, requirement: conditional, condition: the product is dated or timed, settingsOwned: [dateStripDays, performanceReveal]}
          - {stepKey: time, requirement: conditional, condition: the product is timed, settingsOwned: [timesPerPage, dayPartFilter, dayPartBoundaries]}
          - {stepKey: tickets, requirement: required, settingsOwned: [ticketCategories, ticketTags]}
          - {stepKey: consent, requirement: conditional, settingsOwned: [consentQuestionIds]}
          - {stepKey: extras, requirement: optional, settingsOwned: [extrasStep, quantitiesOnAddOns]}
          - {stepKey: review, requirement: optional}
          - {stepKey: payment, requirement: required, settingsOwned: [signInAt]}
          orderConstraints:
          - {kind: before, stepKey: location, otherStepKey: product}
          - {kind: before, stepKey: date, otherStepKey: time}
      required:
      - key
      - name
      - productKinds
      - steps
      - orderConstraints
      properties:
        key:
          $ref: '#/components/schemas/BookingFlowTypeKey'
        name:
          $ref: '#/components/schemas/LocalisedText'
        description:
          $ref: '#/components/schemas/LocalisedText'
        productKinds:
          type: array
          description: The catalogue `ProductKind` values this type books. A venue's default flow for a type
            serves every product of these kinds that names no flow of its own.
          items:
            type: string
        steps:
          type: array
          description: In the type's default order.
          items:
