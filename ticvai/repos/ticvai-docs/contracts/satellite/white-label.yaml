        conciergeMascot:
          type: boolean
          default: true
          description: '**The concierge as mascot art or a plain button (decided 29 September, rev 3 CFG-5).**
            Read only where the `aiConciergeChat` feature is on.

            '
        showInfoOnly:
          type: boolean
          default: true
          description: '**Show info-only products (decided 29 September, rev 3 REV3-14).** On, a product
            with `guestListing` `infoOnly` (catalogue) is listed with its not-bookable label and opens its
            details; off, guests are not shown it.

            '
        locationSwitcher:
          type: boolean
          default: false
