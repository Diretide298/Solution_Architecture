    GuidedChoiceStatus:
      type: string
      description: '**Draft until a person publishes it (decided 29 September, rev 3 REV3-11).** Guests
        see only a `published` choice. An AI-proposed choice arrives as `draft` and is never published
        by the system. Moves as `states/guided-choice.yaml` says: `publishGuidedChoice` and `unpublishGuidedChoice`,
