          default: auto
          description: L1 Ticket box … L6 Season. `auto` picks by venue type; `custom` applies none. The
            UI preset of the prototype's drawer (rev 3 CFG-1, no change).
        stepIndicator:
          type: string
          enum:
          - bar
          - numbered
          - dots
          - segmented
          - breadcrumb
          - pills
          - ticks
          - none
          default: bar
        cartLayout:
          type: string
          enum:
