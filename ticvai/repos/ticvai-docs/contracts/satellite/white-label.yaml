    put:
      operationId: setBookingFlowConfig
      x-ticvai-consumed-by:
        - "P13 CMS-016 Site Settings"
      summary: Set how the guest booking flow looks and steps
      description: '**Design gap, 23 September.** The booking design has a white-label engine drawer (preset,
        step indicator, card and cart layout, extras step, seat picker, map view, density, embed mode) and
        White Labelling had no setting or screen for any of it. **Part of the published tenant config**,
        like the theme: a change goes live through `publishTenantConfig`, never directly.

        **Rev 3 settings (decided 29 September, rev 3).** Times per page and the day-part chips with their
        boundaries (REV3-1), where sign-in is asked (REV3-3), date and time on seated events (REV3-4), the
        seat-view box position (REV3-5), the time bar above the seat map (REV3-6), the floating cart icon
        and the cart side in Arabic (REV3-10), ticket categories (REV3-16), the quick tour (REV3-20), tags
        on tickets (23SEP-3), extra info on cards (23SEP-6), dates in the
        event banner (23SEP-19), the card layout, size and density enums (DG-6), and the concierge mascot
        (CFG-5). Help me choose is a venue''s `GuidedChoice`, not a field here (REV3-11).

        **What is left here is venue-wide (decided 29 September, W12).** `performanceReveal`, `signInAt`,
        `seatEventDateMode`, `extrasStep`, `quickTour` and `consentQuestionIds` belong to one booking flow and
        moved to `BookingFlow.settings` (`updateBookingFlowDefinition`, CMS-103); `categoryDisplay` is removed
        (W7, superseding 23SEP-18: `cardLayout` carries rows or grid). Added: `guestContactFields` (W1) and
        `dateStripDays` (M17-08).

        **Per tenant, with a per-venue override (decided 29 September, rev 3 CFG-11).** `venueOverrides`
        holds the fields a venue changes; everything else it inherits. A `venueId` not among the tenant''s
        active venues, or one given twice, is refused with 400.

