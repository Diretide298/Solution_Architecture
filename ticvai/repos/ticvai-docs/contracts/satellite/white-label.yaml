  /storefront/session-events:
    post:
      operationId: recordStorefrontSessionEvents
      x-ticvai-consumed-by:
        - "P01 WEB-001 Home / Landing"
        - "P02 GST-001 Home"
      x-ticvai-audience:
      - guest
      - anonymous
      x-ticvai-agreed: '29 September: our build plan (8.3.40 browsing behaviour as a risk signal; AI system design 3.2
        events into ai-realtime); shape follows setAnalyticsProvider''s guest runtime and identity.loginRecorded''s
        hashing'
      summary: Report a batch of browsing behaviour for fraud prevention, hashed and without personal data
      description: '8.3.40 (decided 29 September, build pass, group G2). **The storefront and guest app runtime posts
        this as a beacon**, every 50 interactions or 30 seconds and when the page is hidden, for every page of the
        session; it is part of the runtime shell, not of any one screen. Each accepted batch publishes one
        `storefront.sessionEvent` (ADR-0033: the outbox row is the only write) for the risk engine, which joins it to a
        later payment through `sessionRef`.


        **No personal data is accepted.** The session id and device id are identifiers the runtime minted for itself,
        SHA-256 hashed in the browser and hashed again with the tenant key on arrival; a page is sent as its route
        family, never its URL; no search text, form value or guest id is taken (a signed-in session says only
        `signedIn` true). A body carrying anything else is refused with 400 rather than stored, so a runtime bug cannot
        leak what this was built not to hold.


        **Cheap and lossy by design.** Answers 202 without waiting for the publish; a batch dropped by the rate limit
        (per session and per address, `429`) is not retried. Nothing a guest sees depends on it. The address is
        hashed at the edge with the same tenant key as the `ipHash` `ai.scoreTransactionRisk` receives, and added
        to the event; the runtime never sends it.

        '
      tags:
      - overview
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      security:
      - {}
      - guestAuth: []
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhiteLabelStorefrontSessionBatch'
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Accepted for publication. Nothing is returned.
        '400':
          description: A field outside the batch shape (a URL with a query, free text, an unhashed id), or more than
            50 interactions.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests

