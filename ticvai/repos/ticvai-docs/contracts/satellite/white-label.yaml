      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
                  minLength: 3
                  maxLength: 500
                scheduledFor:
                  type: string
                  format: date-time
                  description: >-
                    Publish at a future time. Useful for a campaign launch. **A scheduled job
                    activates it (decided 28 September, audit R163)**: the version is validated and
                    snapshotted now, recorded with `isCurrent` false, and the job makes it current at
                    `scheduledFor`. It is validated again then; a failure leaves the current version
                    live and is reported on the version.
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
        '409':
