          description: '**Where the view-from-your-seat box sits around the seat map (decided 29 September,
            rev 3 REV3-5).** Web only; on mobile and on a narrow screen it is always below the map.

            '
        seatTimeBar:
          type: boolean
          default: true
          description: '**Time bar above the seat map (decided 29 September, rev 3 REV3-6).** Shows the
            chosen performance and lets the guest switch performance or change the date; switching releases
            the seats held for the previous one.

