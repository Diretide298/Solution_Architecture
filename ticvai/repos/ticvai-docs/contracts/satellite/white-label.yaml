    CustomDomain:
      type: object
      x-ticvai-persistence: whitelabel.custom_domain
      description: '24 August. **`ADM-017 Domain & Certificate Management` declared 41 operations and
        not one of them was about a domain** — it carried the same bulk-attached set as every other white-label
        screen, and **no domain or certificate operation existed anywhere in 1,010.**

        A white-label platform whose tenants cannot use their own domain is a white-label platform in
        name only.

        **Verification before issuance, always.** A certificate issued for a domain the tenant does not
        control is a certificate issued to whoever asked.

        '
      required:
      - id
      - tenantId
      - hostname
      - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        hostname:
          type: string
        kind:
          type: string
          enum:
          - guestWeb
          - guestApp
          - partnerPortal
          - developerPortal
        status:
          type: string
          enum:
          - pending
          - verifying
          - verified
          - issuing
          - active
          - failed
          - expired
          - revoked
        verificationMethod:
          type: string
          enum:
          - dnsTxt
          - cname
          - httpFile
        verificationToken:
          type: string
          readOnly: true
        verificationRecord:
          type: object
          readOnly: true
          description: '**The record the tenant must publish**, which `claimCustomDomain` promises and
            the claim had nowhere to hold. Set when the claim is made, from `hostname`, `verificationMethod`
            and `verificationToken`: a TXT record for `dnsTxt`, a CNAME for `cname`, and for `httpFile`
            the URL path to serve and the file''s content.

            '
          required:
          - type
          - name
          - value
          properties:
            type:
              type: string
              enum:
              - TXT
              - CNAME
              - httpFile
            name:
              type: string
              description: The DNS name to create, or for `httpFile` the URL path on `hostname`.
            value:
              type: string
              description: The record's value, CNAME target or file content.
        certificateExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**Renewal is a job, not a reminder.** A certificate that expires on a Saturday
            takes a tenant''s storefront down, and nobody reads a reminder email on a Saturday.

            '
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
          nullable: true
    FooterConfig:
      type: object
      x-ticvai-persistence: whitelabel.footer_config + whitelabel.footer_config_column + whitelabel.footer_config_social_link
      description: 'BL-002. **`setHeader` and `HeaderConfig` exist and the footer does not**, which looked
        like symmetry until you notice it is not: **a header is chrome and a footer is a link surface.**

        A footer carries the legal links — terms, privacy, accessibility statement, cookie preferences
        — and **those are the ones a regulator checks.** Treating it as a mirror of the header would have
        given it a logo and no way to reach a privacy notice.

        **Where it is stored.** `legalLinks` and `copyrightText` are columns of `whitelabel.footer_config`;
        each entry of `columns` is a `whitelabel.footer_config_column` row and each entry of `socialLinks`
        a `whitelabel.footer_config_social_link` row. Part of the working draft (see the header). **In
        the tenant''s own database, not the control plane (decided 28 September, audit R163)**: it moved
        from `control.footer_config` and its two child tables.

        '
      required:
      - id
      - scopePath
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005), written at `tenant` scope by the server.
        columns:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
              links:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    url:
                      type: string
                    opensCookiePreferences:
                      type: boolean
                      default: false
        legalLinks:
          type: object
          description: '**Required links, held separately from the free-form columns** — a tenant reorganising
            their footer must not be able to remove the privacy notice by accident.

            '
          properties:
            termsUrl:
              type: string
            privacyUrl:
              type: string
            accessibilityUrl:
              type: string
              nullable: true
            cookiePolicyUrl:
              type: string
              nullable: true
        copyrightText:
          type: string
        socialLinks:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              url:
                type: string
    AccessibilitySettings:
      type: object
      description: 'BL-065, 2.1.27. **POS and kiosk accessibility, which is a legal obligation in most
        jurisdictions and was unstated.**

        **A kiosk is the hard case.** A guest with low vision using a website brings their own assistive
        technology; a guest at a kiosk gets whatever the kiosk offers, so the settings have to be on the
        device rather than in the browser.

        '
      properties:
        largeTextAvailable:
          type: boolean
          default: true
        highContrastAvailable:
          type: boolean
          default: true
        simplifiedNavigationAvailable:
          type: boolean
          default: true
        screenReaderSupported:
          type: boolean
          default: true
        reachableHeightModeAvailable:
          type: boolean
          default: false
          description: '**Moves the interface to the lower half of the screen** for a guest using a wheelchair.
            A kiosk mounted at standing height is unusable otherwise, and no software setting fixes the
            mounting — this is the mitigation.

            '
        sessionTimeoutMultiplier:
          type: number
          default: 1
          description: '**Timeouts are an accessibility barrier nobody counts.** A guest who needs three
            times as long to read a screen should not lose their basket to a 90-second inactivity timer.

            '
    ContentBlock:
      type: object
      x-ticvai-persistence: control.content_block
      description: 'BL-172. **`white-label` is excellent as a configuration model and is not an authoring
        surface.** `HomepageLayout` with ordered sections, `Banner`, `PromoBlock` and `ContentPage` describe
        what a venue has chosen; **none of them lets a marketer write something new without a developer.**

        A block is a piece of authored content with a type, a body and a schedule. **The page builder
        is a frontend over this**, the same way the venue map''s canvas is a frontend over its graph.

        '
