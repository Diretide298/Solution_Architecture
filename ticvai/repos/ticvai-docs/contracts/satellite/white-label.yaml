        normal state. `soldOut` shows WEB-029''s sold-out state across the app while browsing still
        works; `closed` shows the closed state (a weather closure, a private event). Neither refuses a
        request on its own: it is what the guest is told, and a sale is still refused by availability
        where it applies. Set with `setMaintenanceMode`.

        '
      enum:
      - open
      - soldOut
      - closed
      default: open
    BrandIdentity:
