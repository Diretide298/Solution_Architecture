              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400':
          description: Closure attempted without findings or a corrective action
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /incidents/{incidentId}/notify-authority:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordAuthorityNotification
      x-ticvai-consumed-by:
        - "P06 EMP-003 Home — on duty"
        - "P06 EMP-026 Incident report"
        - "P06 EMP-029 Guest assistance"
        - "P06 EMP-050 Post-incident restore"
        - "P08 BO-072 Incident Log"
      x-ticvai-audience: [staff]
      summary: Record notification to an external authority
      description: >
        Some incidents must be reported externally within a statutory window. This records
        that it happened, when, to whom, and with what reference — the evidence that the
        obligation was met.

        Appends a `maintenance.incident_authority_notification` row; a second notification
        adds a row rather than replacing the first.

        **Refused for an incident that is not reportable; a repeat is recorded** (decided
        28 September, audit R106 (6)). Where `isReportable` is false the call is refused `409`
        and nothing is written. A second notification to the same authority is accepted and
        kept as its own row, because each is evidence.
      tags: [incident]
      x-ticvai-permission: INCIDENT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authority, notifiedAt]
              properties:
                authority: { type: string, maxLength: 200 }
                reference: { type: string, maxLength: 128 }
                notifiedAt: { type: string, format: date-time }
                notifiedByPrincipalId: { type: string, format: uuid }
                attachmentRefs:
                  type: array
                  items: { type: string }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '409':
          description: The incident is not reportable (`isReportable` false, audit R106 (6)).
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  schemas:
    InspectionItem:
      x-ticvai-persistence: maintenance.inspection_item
      type: object
      description: >
        **One answer to one question, which the API has always accepted and never stored.**
        `SubmitInspectionRequest.responses[]` takes a key, a value, a pass flag, a note and
        attachments; the only persistence ever claimed for them was
        `maintenance.inspection_response`, a table that does not exist.

        So `maintenance.inspection_template_item` held the questions, `maintenance.inspection`
        held `failedItemCount` and `failedSafetyCriticalCount`, and **which check failed was
        accepted over the wire and dropped** — on a record that takes an asset out of service.

        Returned on `InspectionResult`, not on `Inspection`: `listInspections` returns the
        latter in a list, and twenty item rows per inspection on a list screen is the wrong
        trade. The counts stay for exactly that reason.
      required: [id, inspectionId, itemKey]
      properties:
        id: { type: string, format: uuid }
        inspectionId: { type: string, format: uuid }
        templateItemId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Nullable because a template changes and an inspection does not.** An answer
            recorded against an item that was later removed still has to be readable, so the key
            below is the durable record and this is the live link.
        itemKey:
          type: string
          maxLength: 120
          description: The template item's `key`, copied at submission and never updated.
        label:
          type: string
          nullable: true
          description: >
            The question as it was asked, copied at submission. **A template reworded next
            season must not silently reword last season's inspection.**
        value:
          nullable: true
          description: Whatever the item's `kind` calls for — a boolean, a number, a string.
        passed:
          type: boolean
          nullable: true
          description: Null where the item is informational rather than pass or fail.
        isSafetyCritical:
          type: boolean
          default: false
          description: >
            Copied from the template item at submission, for the same reason as `label`: it is
            what makes `failedSafetyCriticalCount` reproducible, and the template can change.
        note: { type: string, maxLength: 1000, nullable: true }
        attachmentAssetIds:
          type: array
          items: { type: string, format: uuid }
          description: >
            **A deliberate array, and the same exception as
            `workforce.sync_conflict.affectedAssignmentIds`**: evidence attached to this answer
            at the moment it was recorded. It is never queried from the other end — nobody asks
            which inspection items reference a photograph — and it must not change when an asset
            library is reorganised.
        recordedAt: { type: string, format: date-time }
    AssetStatus:
      type: string
      enum: [inService, outOfService, underMaintenance, awaitingParts, retired, disposed]

    AssetCriticality:
      type: string
      enum: [safetyCritical, revenueCritical, standard, low]

    CreateAssetRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [assetTag, name, venueId, criticality]
      properties:
        assetTag:
          type: string
          maxLength: 64
          x-ticvai-unique: venue
          description: >
            **Unique per venue** (decided 28 September, audit R108). Two assets in one venue never
            share a tag; `createAsset` refuses a duplicate with `409` `duplicate-code`. Two venues
            may each have an `A-001`.
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        locationDescription: { type: string, maxLength: 500 }
        criticality: { $ref: '#/components/schemas/AssetCriticality' }
        priorityOverride:
          allOf:
            - $ref: '#/components/schemas/WorkOrderPriority'
          nullable: true
          description: >
            **"If this device goes down, raise this priority"** (decided 17 September, M17-01). A
            corrective work order raised on this asset takes this priority instead of the score. Null
            means the score decides.
        manufacturer: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 200 }
        serialNumber: { type: string, maxLength: 128 }
        commissionedAt: { type: string, format: date }
        warrantyExpiresAt: { type: string, format: date }
        supplierId: { type: string, format: uuid }
        linkedProductIds:
          type: array
          description: >
            Products this asset delivers. A fault here can stop them selling.
          items: { type: string, format: uuid }
        linkedAccessPointId:
          type: string
          format: uuid
          nullable: true
          description: Access point this asset controls. Out of service blocks it.
        requiresInspectionToReturn:
          type: boolean
          default: false
          description: >
            True means a completed inspection is required before return to service. A
            technician cannot simply declare a ride safe.
        documents:
          type: array
          description: >
            Manuals, procedures, certificates, each with its name and kind. Stored one row per
            document in `maintenance.asset_document`, which is where `AssetDetail.documents`
            reads them from.
          items: { $ref: '#/components/schemas/AssetDocumentInput' }
        documentRefs:
          type: array
          x-ticvai-persisted: false
          description: >
            **The refs alone, kept for callers that predate `documents`.** Each ref sent here is
            stored as an `asset_document` row with no name and no kind. Returned as the refs of
            `documents`, computed on read — there is no second copy to fall out of step.
          items: { type: string }

    AssetDocumentInput:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [ref, kind]
      properties:
        ref: { type: string, description: The document in the media store. }
        name: { type: string, maxLength: 200 }
        kind: { $ref: '#/components/schemas/AssetDocumentKind' }

    AssetDocumentKind:
      type: string
      enum: [manual, sop, certificate, warranty, drawing, riskAssessment]

    AssetDocument:
      x-ticvai-persistence: maintenance.asset_document
      type: object
      description: >
        A document attached to an asset — manual, procedure, certificate — with the name and
        kind a technician needs on site. **One row per document**, because `AssetDetail.documents`
        returns a name and a kind for each and a `text[]` of refs has nowhere to hold either.
      required: [id, assetId, ref]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        ref: { type: string, description: The document in the media store. }
        name: { type: string, maxLength: 200, nullable: true }
        kind:
          allOf:
            - $ref: '#/components/schemas/AssetDocumentKind'
          nullable: true
          description: Null where the document arrived as a bare ref in `documentRefs`.

    Asset:
      x-ticvai-persistence: "maintenance.asset"
      allOf:
        - $ref: '#/components/schemas/CreateAssetRequest'
        - type: object
          # `is_maintenance_overdue` is computed on read (below) and no longer stored.
          # `document_refs` moved to one `maintenance.asset_document` row per document.
          x-ticvai-retired-columns:
            - is_maintenance_overdue
            - document_refs
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            resourceId:
              type: string
              format: uuid
              nullable: true
              description: >
                1.2.x. **Where this asset is also bookable.** An AV rig is an asset to maintain and a
                resource to allocate, and they are the same object seen from two sides.

                **`resources` owns the calendar and this owns the condition.** An asset out of service
                makes its resource unbookable, which is one link rather than two models of availability.
            deviceId:
              type: string
              format: uuid
              nullable: true
              description: >
                BL-160. **Where this asset is also a registered device.** A turnstile is an asset
                to maintain and a device to operate, and — exactly as with `resourceId` above —
                they are the same object seen from two sides.

                **Nothing joined them before this.** A turnstile controller reporting
                `needsAttention` could not raise a work order against itself, and an engineer
                closing one had no way back to the device whose firmware caused it.

                **Null for most assets and for most devices.** A chiller is not a device and a
                signature pad is not on the asset register; the link is sparse, and it lives here
                rather than on `platform.device` because `platform` is the foundation tier and a
                foreign key pointing from it into `maintenance` would invert the tiers — every
                cell running a spine would carry a column for a satellite it may not deploy.
            acquisitionCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            acquiredOn: { type: string, format: date, nullable: true }
            depreciation:
              type: object
              nullable: true
              description: >
                **Recorded here and posted by `finance`.** Depreciation is an accounting act and the
                asset register is where the useful life is actually known — an engineer knows a chiller
                lasts fifteen years and an accountant knows what to do about it.
              properties:
                method: { type: string, enum: [straightLine, reducingBalance, unitsOfProduction, none] }
                usefulLifeMonths: { type: integer }
                residualValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                accumulatedDepreciation: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            retiredOn:
              type: string
              format: date
              nullable: true
              description: >
                **Retirement is not deletion.** A work order from three years ago still names this
                asset, and an inspection record with no asset is an inspection of nothing.
            disposalProceeds: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            status: { $ref: '#/components/schemas/AssetStatus' }
            statusReason: { type: string, nullable: true }
            # **Four values on this schema are derived, and each says who keeps it.** A stored
            # count nobody names a writer for drifts the first time a code path forgets it, and
            # a stored boolean that depends on the clock is wrong from the minute it is written.
            # `x-ticvai-derived` is `onWrite` (maintained in the same transaction as the write
            # that changes it), `onRead` (computed when read, never stored) or `sweeper` (a named
            # job). The text beside it names the source.
            openWorkOrderCount:
              type: integer
              readOnly: true
              x-ticvai-derived: onWrite
              description: >
                Work orders on this asset whose status is `open`, `assigned`, `inProgress`,
                `paused` or `awaitingParts` — the same set `AssetDetail.openWorkOrders` returns.
                **Maintained on write**: `createWorkOrder` and every transition into or out of
                that set (complete, cancel, close, reject back to open) adjust it in the same
                transaction as the work-order row.
            nextMaintenanceDueAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              x-ticvai-derived: onWrite
              description: >
                The earliest `nextDueAt` among this asset's active maintenance plans; null when
                none has one. **Maintained on write**: recomputed whenever one of those plans is
                created, amended, suspended or has its `nextDueAt` moved by a completed work
                order. `listAssets?maintenanceDue` filters on this column against the clock.
            isMaintenanceOverdue:
              type: boolean
              readOnly: true
              x-ticvai-persisted: false
              x-ticvai-derived: onRead
              description: >
                `nextMaintenanceDueAt` is in the past at the moment of the read. **Computed on
                read and not stored** — it depends on the clock, so a stored copy is stale the
                minute after it is written.
            lastInspectionAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              x-ticvai-derived: onWrite
              description: >
                `performedAt` of the latest inspection submitted against this asset. **Maintained
                on write** by `submitInspection`, in the same transaction as the inspection row;
                an inspection synced late with an earlier `performedAt` does not move it back.
            usageCounter:
              type: number
              nullable: true
              description: Cycles, hours or kilometres. Drives usage-based maintenance.

    AssetDetail:
      x-ticvai-persistence: "maintenance.asset"
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            openWorkOrders:
              type: array
              items: { $ref: '#/components/schemas/WorkOrder' }
            maintenancePlans:
              type: array
              items: { $ref: '#/components/schemas/MaintenancePlan' }
            documents:
              type: array
              description: >
                Manuals, procedures, certificates. What a technician needs on site. Read from
                `maintenance.asset_document`.
              items: { $ref: '#/components/schemas/AssetDocument' }

    SetAssetStatusRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [status, reason, recordedAt]
      properties:
        status: { $ref: '#/components/schemas/AssetStatus' }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        inspectionId:
          type: string
          format: uuid
          nullable: true
          description: Required for return to service where the asset demands it.
        raiseWorkOrder: { type: boolean, default: false }
        recordedAt: { type: string, format: date-time }

    AssetStatusResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [asset, downstreamEffects]
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        downstreamEffects:
          type: object
          description: >
            What else changed. Surfaced so the person taking a ride out of service sees the
            commercial consequence at the moment they do it.
          properties:
            productsSuspended:
              type: array
              items: { type: string, format: uuid }
            accessPointBlocked: { type: boolean }
            performancesAffected: { type: integer }
            workOrderId: { type: string, format: uuid, nullable: true }

    AssetStatusChange:
      x-ticvai-persistence: maintenance.asset_status_change
      type: object
      description: >
        **One row per status change on an asset, appended by `setAssetStatus`** and by the
        automatic paths that change it (a work order raised with `takeAssetOutOfService`, a
        failed safety-critical inspection item). `maintenance.asset` holds only the current
        status; this is the sequence an insurer or a regulator asks for, and it is what
        `WorkOrder.downtimeMinutes` is measured from.
      required: [id, assetId, toStatus, reason, recordedAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/AssetStatus'
          nullable: true
        toStatus: { $ref: '#/components/schemas/AssetStatus' }
        reason: { type: string, maxLength: 1000 }
        workOrderId:
          type: string
          format: uuid
          nullable: true
          description: The work order that took the asset out, where one did.
        inspectionId:
          type: string
          format: uuid
          nullable: true
          description: The inspection that took it out, or that allowed its return to service.
        changedByPrincipalId: { type: string, format: uuid, nullable: true }
        recordedAt:
          type: string
          format: date-time
          description: Device time. The change is offline-capable and appended on replay.
        syncedAt: { type: string, format: date-time, nullable: true }

    AssetHistoryEntry:
      x-ticvai-persistence: "none — union view over work orders, inspections, incidents and asset status changes"
      type: object
      description: >
        **Every kind has a source.** `workOrder` is a work-order row, `inspection` an inspection,
        `incident` an incident, `statusChange` a `maintenance.asset_status_change` row.
        `partReplaced` is a completed work order whose `resolutionCode` is `partReplaced`, and `planCompleted` a completed work order with a `sourcePlanId` — both
        read from `maintenance.work_order`, not stored twice.
      required: [kind, occurredAt, summary]
      properties:
        kind:
          type: string
          enum: [workOrder, inspection, incident, statusChange, partReplaced, planCompleted]
        referenceId:
          type: string
          format: uuid
          nullable: true
          description: >
            The source row's id: a work order, inspection or incident, or an
            `asset_status_change` id. A uuid, as every id is (ADR-0056).
        summary: { type: string }
        principalId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }

    WorkOrderStatus:
      type: string
      enum: [open, assigned, inProgress, paused, awaitingParts, completed, verified, closed, cancelled]

    WorkOrderPriority:
      type: string
      enum: [low, normal, high, urgent, emergency]

    WorkOrderKind:
      type: string
      enum: [corrective, planned, inspectionFollowUp, incidentCorrective, improvement]

    ResolutionCode:
      type: string
      enum: [repaired, partReplaced, adjusted, cleaned, noFaultFound, referredExternal, replaced, deferred]

    CreateWorkOrderRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, title, venueId, recordedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        locationDescription: { type: string, maxLength: 500 }
        kind:
          allOf:
            - $ref: '#/components/schemas/WorkOrderKind'
          default: corrective
        priority:
          allOf:
            - $ref: '#/components/schemas/WorkOrderPriority'
          description: >
            **Optional since 29 September** (M17-01). Sent, it is `manual` and wins. Absent, the asset's
            `priorityOverride` applies, and failing that the venue's `WorkOrderPriorityPolicy` scores the
            fault.
        faultAssessment: { $ref: '#/components/schemas/WorkOrderFaultAssessment' }
        requiredQualificationCodes:
          type: array
          maxItems: 10
          items: { type: string }
          description: Skills the job needs, as qualification codes; `suggestWorkOrderAssignee` ranks by them (M17-13).
        categoryId: { type: string, format: uuid }
        assignedToPrincipalId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        attachmentRefs:
          type: array
          description: Photo-first. Expected at creation, not added later from memory.
          items: { type: string }
        takeAssetOutOfService:
          type: boolean
          default: false
          description: >
            Raise and immediately suspend the asset. For a fault found on a live ride, the
            two are one action.
        recordedAt: { type: string, format: date-time }

    WorkOrderAttachment:
      type: object
      x-ticvai-persistence: "maintenance.work_order_attachment"
      required: [id, workOrderId, kind, capturedAt]
      properties:
        id: { type: string, format: uuid }
        workOrderId: { type: string, format: uuid }
        kind: { type: string, enum: [photo, video, document, note, signature] }
        assetRef: { type: string, format: uuid, nullable: true }
        text: { type: string, nullable: true }
        stage: { type: string, enum: [before, during, after, signOff], nullable: true }
        capturedByPrincipalId: { type: string, format: uuid }
        capturedAt:
          type: string
          format: date-time
          description: >
            Device time. **Distinct from when it synced** — a photo taken at 09:14 in a basement
            and uploaded at 11:40 is evidence of the first, not the second.
        syncedAt: { type: string, format: date-time, nullable: true }

    WorkOrder:
      x-ticvai-persistence: "maintenance.work_order"
      # `is_overdue` is computed on read (see `isOverdue`) and no longer stored.
      x-ticvai-retired-columns:
        - is_overdue
      type: object
      required: [id, workOrderNumber, title, venueId, status, priority, kind, createdAt]
      properties:
        downtimeMinutes:
          type: integer
          nullable: true
          readOnly: true
          x-ticvai-derived: onWrite
          description: >
            **Measured from out-of-service to back-in-service, not from work start to work
            end.** A ride down for six hours of which two were spent working is down six hours,
            and the gap between the two numbers is the thing worth managing.

            **Maintained on write**: set when the asset returns to service, as the
            minutes from the `maintenance.asset_status_change` row that took it out carrying
            this work order's id to the asset's next change back to `inService`. Null while the
            asset is still out, and for a work order that never took it out.
        rootCause:
          type: string
          nullable: true
          enum: [wearAndTear, operatorError, guestDamage, manufacturingDefect, environmental,
                 softwareFault, powerFailure, deferredMaintenance, unknown]
          description: >
            **Structured, because free text cannot be counted.** *Deferred maintenance* is the
            value a venue least wants to see and most needs to — a fault caused by work that was
            postponed is an argument for a budget.
        rootCauseNote: { type: string, nullable: true }
        escalatedAt: { type: string, format: date-time, nullable: true }
        escalationLevel:
          type: integer
          default: 0
          description: >
            **Escalation is a clock, not a decision.** A work order on a ride nobody has
            accepted after twenty minutes escalates itself, because the alternative is somebody
            noticing.
        id: { type: string, format: uuid }
        workOrderNumber:
          type: string
          readOnly: true
          description: >
            **Server-assigned: the venue prefix plus a sequence per venue** (decided 28
            September, audit R152). Not gapless; only tax invoices are gapless, per legal entity.
        title: { type: string }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        assetName:
          type: string
          nullable: true
          readOnly: true
          x-ticvai-derived: onWrite
          description: >
            The asset's name, copied when the work order is raised or its asset changes, and not
            updated when the asset is later renamed — the record reads as it was raised.
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        priorityScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          readOnly: true
          description: The score the venue's policy gave the fault when raised; null when a person or the asset set the priority (M17-01).
        prioritySource:
          type: string
          enum: [scored, assetOverride, manual]
          readOnly: true
          description: Where `priority` came from (M17-01). A change through `updateWorkOrder` makes it `manual`.
        faultAssessment: { $ref: '#/components/schemas/WorkOrderFaultAssessment' }
        requiredQualificationCodes:
          type: array
          items: { type: string }
          description: Skills the job needs (M17-13).
        kind: { $ref: '#/components/schemas/WorkOrderKind' }
        assignedToPrincipalId: { type: string, format: uuid, nullable: true }
        raisedByPrincipalId: { type: string, format: uuid }
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: >
            As raised in `CreateWorkOrderRequest.categoryId`, amendable by `updateWorkOrder`. The
            category is what `completeWorkOrder` reads to decide whether completion photographs
            are required.
        locationDescription:
          type: string
          maxLength: 500
          nullable: true
          description: >
            Where the fault is, as raised. Needed where there is no asset — a broken tile, a
            leak in a corridor.
        elapsedMinutes:
          type: integer
          readOnly: true
          x-ticvai-derived: onWrite
          description: >
            Labour minutes accumulated up to the last pause or stop. **Maintained on write** by
            `recordWorkOrderTime`, `pauseWorkOrder` and `completeWorkOrder`; while
            `isTimerRunning` is true the interval since the last start is not yet included.
        isTimerRunning:
          type: boolean
          readOnly: true
          x-ticvai-derived: onWrite
          description: >
            Maintained on write by `startWorkOrder`, `resumeWorkOrder`, `recordWorkOrderTime`,
            `pauseWorkOrder` and `completeWorkOrder`.
        dueAt: { type: string, format: date-time, nullable: true }
        isOverdue:
          type: boolean
          readOnly: true
          x-ticvai-persisted: false
          x-ticvai-derived: onRead
          description: >
            `dueAt` is in the past and the status is still `open`, `assigned`, `inProgress`,
            `paused` or `awaitingParts`. **Computed on read and not stored** — it depends on the
            clock. `listWorkOrders?overdueOnly` applies the same test to `due_at`.
        requiresVerification: { type: boolean }
        sourcePlanId: { type: string, format: uuid, nullable: true }
        sourceInspectionId: { type: string, format: uuid, nullable: true }
        sourceIncidentId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }

    WorkOrderDetail:
      x-ticvai-persistence: "maintenance.work_order"
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
        - type: object
          properties:
            description: { type: string, nullable: true }
            resolution: { type: string, nullable: true }
            resolutionCode: { $ref: '#/components/schemas/ResolutionCode' }
            attachmentRefs:
              type: array
              items: { type: string }
            timeEntries:
              type: array
              items:
                type: object
                properties:
                  action: { type: string }
                  principalId: { type: string, format: uuid }
                  pauseReason: { type: string, nullable: true }
                  recordedAt: { type: string, format: date-time }
            parts:
              type: array
              items:
                type: object
                properties:
                  inventoryItemId: { type: string, format: uuid }
                  itemName: { type: string }
                  quantity: { type: number }
                  reservedQuantity:
                    type: number
                    description: Still reserved for this work order and not yet issued (M17-02).
                  cost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            labourCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            partsCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            totalCost: { $ref: '../shared/common.yaml#/components/schemas/Money', x-ticvai-column: net_cost_amount }
            # **Every field the lifecycle operations accept is stored and returned here.**
            # `cancelWorkOrder`, `completeWorkOrder`, `verifyWorkOrder` and `closeWorkOrder`
            # took reasons, outcomes, notes and linked work orders that no column held, so the
            # distinction the descriptions insist on — cancelled versus closed, completed
            # versus verified — was lost the moment the request was answered.
            completedByPrincipalId:
              type: string
              format: uuid
              nullable: true
              description: >
                Who called `completeWorkOrder`. **What `verifyWorkOrder` compares against** — the
                verifier may not be the technician who completed the work, and the assignee is
                not necessarily that person.
            followUpRequired: { type: boolean, default: false }
            followUpNote: { type: string, maxLength: 1000, nullable: true }
            verificationOutcome:
              type: string
              enum: [verified, rejected]
              nullable: true
              description: The latest `verifyWorkOrder` outcome.
            verificationNote: { type: string, maxLength: 1000, nullable: true }
            verifiedAt: { type: string, format: date-time, nullable: true }
            verifiedByPrincipalId: { type: string, format: uuid, nullable: true }
            cancelReason:
              type: string
              enum: [raisedInError, duplicate, superseded, noLongerRequired]
              nullable: true
            cancelNote: { type: string, maxLength: 300, nullable: true }
            supersededByWorkOrderId:
              type: string
              format: uuid
              nullable: true
              description: Set by `cancelWorkOrder` where the reason is `superseded`.
            cancelledAt: { type: string, format: date-time, nullable: true }
            closeOutcome:
              type: string
              enum: [completedAndVerified, notReproducible, supersededByReplacement,
                     noLongerApplicable, duplicate]
              nullable: true
            closeNote: { type: string, maxLength: 500, nullable: true }
            duplicateOfWorkOrderId:
              type: string
              format: uuid
              nullable: true
              description: Set by `closeWorkOrder` where the outcome is `duplicate`.
            closedAt: { type: string, format: date-time, nullable: true }
            closedByPrincipalId: { type: string, format: uuid, nullable: true }

    WorkOrderPriorityPolicy:
      x-ticvai-persistence: "maintenance.priority_scoring_model"
      type: object
      description: >
        **How a corrective fault's priority is scored** (decided 17 September, M17-01). One per venue.
        The score is 0 to 100: each weight times its factor, where safety is the fault's
        `faultAssessment.safetyRisk`, guest operations is `faultAssessment.guestImpact` (and whether the
        asset has a linked access point), revenue is whether the asset has linked products, and
        criticality is the asset's `criticality`. The band the score falls in is the priority. **An
        asset's `priorityOverride` wins over the score**, and a priority a person sets wins over both.
      required: [weights, bands]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        venueId: { type: string, format: uuid, readOnly: true }
        weights:
          type: object
          required: [safety, guestOperations, revenue, criticality]
          properties:
            safety: { type: integer, minimum: 0, maximum: 100 }
            guestOperations: { type: integer, minimum: 0, maximum: 100 }
            revenue: { type: integer, minimum: 0, maximum: 100 }
            criticality: { type: integer, minimum: 0, maximum: 100 }
        bands:
          type: array
          minItems: 1
          maxItems: 5
          description: Highest first. A score at or above `minScore` takes `priority`.
          items:
            type: object
            required: [minScore, priority]
            properties:
              minScore: { type: integer, minimum: 0, maximum: 100 }
              priority: { $ref: '#/components/schemas/WorkOrderPriority' }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedByPrincipalId: { type: string, format: uuid, readOnly: true, nullable: true }

    WorkOrderFaultAssessment:
      x-ticvai-persistence: "none — columns on maintenance.work_order"
      type: object
      description: What the person raising a fault says about it, which the priority score reads (M17-01).
      properties:
        safetyRisk: { type: boolean, default: false }
        guestImpact: { type: string, enum: [none, degraded, closed], default: none }

    WorkOrderAssigneeSuggestion:
      x-ticvai-persistence: "none — computed on read"
      type: object
      required: [principalId, rank]
      properties:
        principalId: { type: string, format: uuid }
        name: { type: string }
        rank: { type: integer, minimum: 1 }
        hasAllQualifications: { type: boolean }
        missingQualificationCodes:
          type: array
          items: { type: string }
        onShift: { type: boolean, description: On shift now or before the work order is due. }
        openWorkOrderCount: { type: integer }

    VendorServiceRequestStatus:
      type: string
      enum: [draft, sent, accepted, scheduled, completed, cancelled]

    VendorServiceRequest:
      x-ticvai-persistence: "maintenance.vendor_service_request"
      type: object
      description: >
        **An outside vendor engaged on a work order** (decided 17 September, M17-13). The supplier is an
        `inventory.supplier`.
      required: [workOrderId, supplierId, scope]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        venueId: { type: string, format: uuid, readOnly: true }
        workOrderId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        scope: { type: string, maxLength: 2000, description: What the vendor is asked to do. }
        status:
          allOf:
            - $ref: '#/components/schemas/VendorServiceRequestStatus'
          default: draft
        vendorReference: { type: string, maxLength: 100, nullable: true }
        quotedCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        finalCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        scheduledVisitAt: { type: string, format: date-time, nullable: true }
        note: { type: string, maxLength: 1000, nullable: true }
        raisedByPrincipalId: { type: string, format: uuid, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        completedAt: { type: string, format: date-time, nullable: true, readOnly: true }

    MaintenancePlan:
      x-ticvai-persistence: "maintenance.preventive_plan"
      type: object
      required: [id, name, assetId, taskTemplate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        assetId: { type: string, format: uuid }
        assetCategoryId:
          type: string
          format: uuid
          nullable: true
          description: Applies to every asset in the category rather than one.
        intervalDays:
          type: integer
          nullable: true
          description: Elapsed-time trigger.
        usageInterval:
          type: number
          nullable: true
          description: >
            Usage trigger — cycles, hours, kilometres. **Whichever comes first** when both are
            set. A ride serviced every three months or ten thousand cycles is one plan.
        leadTimeDays:
          type: integer
          default: 7
          description: >
            How far ahead the work order is generated, so parts can be ordered before the job
            is already late.
        taskTemplate:
          type: object
          required: [title, priority]
          properties:
            title: { type: string }
            description: { type: string }
            priority: { $ref: '#/components/schemas/WorkOrderPriority' }
            estimatedMinutes: { type: integer }
            inspectionTemplateId: { type: string, format: uuid }
            requiredPartIds:
              type: array
              items: { type: string, format: uuid }
        lastCompletedAt: { type: string, format: date-time, nullable: true }
        nextDueAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }

    DueMaintenanceTask:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [planId, assetId, assetName, dueAt, isOverdue, criticality]
      properties:
        planId: { type: string, format: uuid }
        planName: { type: string }
        assetId: { type: string, format: uuid }
        assetName: { type: string }
        criticality: { $ref: '#/components/schemas/AssetCriticality' }
        dueAt: { type: string, format: date-time }
        isOverdue: { type: boolean }
        daysOverdue: { type: integer }
        triggeredBy:
          type: string
          enum: [interval, usage]
        workOrderId: { type: string, format: uuid, nullable: true }

    InspectionItemKind:
      type: string
      enum: [passFail, yesNo, numeric, text, photo, signature]

    InspectionTemplate:
      x-ticvai-persistence: "maintenance.inspection_template + maintenance.inspection_template_item"
      type: object
      required: [id, code, name, items]
      properties:
        instructions:
          type: string
          description: '**The procedure itself.** A technician asking how to isolate a chiller is asking a safety question, and the answer has to come from the template rather than from its title.

            '
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid, nullable: true }
        appliesToAssetCategoryId: { type: string, format: uuid, nullable: true }
        frequency:
          type: string
          enum: [preOpening, postClosing, daily, weekly, monthly, annual, adHoc]
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, label, kind, isRequired]
            properties:
              key: { type: string }
              label: { type: string }
              kind: { $ref: '#/components/schemas/InspectionItemKind' }
              isRequired: { type: boolean }
              isSafetyCritical:
                type: boolean
                default: false
                description: >
                  A failed safety-critical item **blocks the inspection from passing** and
                  cannot be overridden by completing the rest.
              requiresPhotoOnFail: { type: boolean, default: true }
              minValue: { type: number, nullable: true }
              maxValue: { type: number, nullable: true }
              guidance: { type: string, nullable: true }
        retentionYears:
          type: integer
          default: 7
          description: Compliance inspections are retained alongside the financial trail.
        isActive: { type: boolean }

    InspectionOutcome:
      type: string
      enum: [passed, passedWithObservations, failed]

    SubmitInspectionRequest:
      x-ticvai-persistence: maintenance.inspection + maintenance.inspection_item
      # **It was tagged "none — request only" and it writes two tables.**
      # `responses[]` has always carried the per-item answers; nothing
      # persisted them, so the write derived from this schema named the
      # inspection and not the items it is made of.
      type: object
      required: [id, templateId, venueId, responses, recordedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        responses:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: {}
              passed: { type: boolean, nullable: true }
              note: { type: string, maxLength: 1000 }
              attachmentRefs:
                type: array
                items: { type: string }
        signatureRef: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }

    Inspection:
      x-ticvai-persistence: maintenance.inspection
      # **`+ maintenance.inspection_response` was removed on 20 September: no such table
      # exists and this schema never described one.** It returns `failedItemCount` and
      # `failedSafetyCriticalCount` — counts, not answers. The claim was invisible while
      # the lineage read a dual tag as one table name with a plus sign in it.
      #
      # **The gap it was pointing at is real.** `maintenance.inspection_template_item`
      # holds the questions and nothing holds the answers, so a failed inspection can say
      # how many items failed and not which. `rental.inspection_item` is the shape that
      # would fill it. Recorded rather than invented, because which items an inspection
      # must retain is a retention decision.
      type: object
      required: [id, templateId, venueId, outcome, performedByPrincipalId, performedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        templateName: { type: string }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        outcome: { $ref: '#/components/schemas/InspectionOutcome' }
        failedItemCount: { type: integer }
        failedSafetyCriticalCount: { type: integer }
        performedByPrincipalId:
          type: string
          format: uuid
          description: An inspection nobody signed is not an inspection.
        performedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }
        retainUntil: { type: string, format: date, nullable: true }

    InspectionResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [inspection, consequences]
      properties:
        inspection: { $ref: '#/components/schemas/Inspection' }
        items:
          type: array
          description: >
            **The answers, which had nowhere to live until 20 September.** A failed
            safety-critical item takes an asset out of service and `consequences` below says it
            happened; this says which check caused it.
          items: { $ref: '#/components/schemas/InspectionItem' }
        consequences:
          type: object
          description: >
            What the submission triggered. A failed safety-critical item takes the asset out
            of service without waiting for anyone to decide.
          properties:
            assetTakenOutOfService: { type: boolean }
            workOrdersRaised:
              type: array
              items: { type: string, format: uuid }
            productsSuspended:
              type: array
              items: { type: string, format: uuid }
            escalatedToPrincipalId: { type: string, format: uuid, nullable: true }

    IncidentSeverity:
      type: string
      enum: [nearMiss, minor, moderate, major, critical]

    IncidentStatus:
      type: string
      enum: [reported, underInvestigation, actionRequired, closed]

    IncidentKind:
      type: string
      enum:
        - guestInjury
        - staffInjury
        - nearMiss
        - propertyDamage
        - equipmentFailure
        - securityIncident
        - fireOrEvacuation
        - foodSafety
        - environmental
        - other

    ReportIncidentRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, kind, severity, venueId, description, occurredAt, recordedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/IncidentKind' }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        locationDescription: { type: string, maxLength: 500 }
        description: { type: string, minLength: 3, maxLength: 10000 }
        involvedSubjectIds:
          type: array
          description: >
            Opaque references. Personal details live in the erasable store, so the incident
            record survives an erasure request intact.
          items: { type: string, format: uuid }
        involvedStaffPrincipalIds:
          type: array
          items: { type: string, format: uuid }
        witnessCount: { type: integer }
        firstAidGiven: { type: boolean, default: false }
        emergencyServicesCalled: { type: boolean, default: false }
        attachmentRefs:
          type: array
          items: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    Incident:
      x-ticvai-persistence: "maintenance.incident"
      type: object
      required: [id, incidentNumber, kind, severity, status, venueId, occurredAt, reportedByPrincipalId]
      properties:
        id: { type: string, format: uuid }
        incidentNumber:
          type: string
          readOnly: true
          description: >
            **Server-assigned: the venue prefix plus a sequence per venue** (decided 28
            September, audit R152). Not gapless; only tax invoices are gapless, per legal entity.
        kind: { $ref: '#/components/schemas/IncidentKind' }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        venueId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        locationDescription: { type: string, nullable: true }
        isReportable:
          type: boolean
          description: Requires notification to an external authority within a statutory window.
        notificationDueAt: { type: string, format: date-time, nullable: true }
        notifiedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          x-ticvai-derived: onWrite
          description: >
            The earliest `notifiedAt` among this incident's authority notifications. **Maintained
            on write** by `recordAuthorityNotification`; each notification itself is a row of
            `maintenance.incident_authority_notification`.
        assignedToPrincipalId: { type: string, format: uuid, nullable: true }
        reportedByPrincipalId: { type: string, format: uuid }
        correctiveWorkOrderId: { type: string, format: uuid, nullable: true }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }

    IncidentDetail:
      x-ticvai-persistence: "maintenance.incident"
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          properties:
            description:
              type: string
              description: The original report. Never edited — investigation adds to the record.
            investigationNote:
              type: string
              nullable: true
              readOnly: true
              description: The latest entry of `investigationNotes`, kept for readers that show one line.
            investigationNotes:
              type: array
              readOnly: true
              description: >
                **Every investigation note, oldest first** (decided 28 September, audit R106 (5)).
                Read from `maintenance.incident_investigation_note`; appended by `updateIncident`.
              items: { $ref: '#/components/schemas/IncidentInvestigationNote' }
            rootCause: { type: string, nullable: true }
            correctiveActions: { type: string, nullable: true }
            firstAidGiven: { type: boolean }
            emergencyServicesCalled: { type: boolean }
            witnessCount: { type: integer }
            attachmentRefs:
              type: array
              items: { type: string }
            involvedParties:
              type: array
              description: >
                Who was involved, as given in `ReportIncidentRequest.involvedSubjectIds` and
                `involvedStaffPrincipalIds`. Read from `maintenance.incident_involved_party`.
              items: { $ref: '#/components/schemas/IncidentInvolvedParty' }
            authorityNotifications:
              type: array
              description: Read from `maintenance.incident_authority_notification`, oldest first.
              items: { $ref: '#/components/schemas/IncidentAuthorityNotification' }

    IncidentInvolvedParty:
      x-ticvai-persistence: maintenance.incident_involved_party
      type: object
      description: >
        **One person involved in an incident, by opaque reference.** A guest or member of the
        public is a `pii.subject` id — personal details live there, the erasable store of
        ADR-0023, so the incident record survives an erasure request intact. A member of staff
        is a principal id. Exactly one of the two is set, as `kind` says.
      required: [id, incidentId, kind]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        kind: { type: string, enum: [subject, staff] }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: A `pii.subject` id where `kind` is `subject`.
        principalId:
          type: string
          format: uuid
          nullable: true
          description: The staff principal where `kind` is `staff`.

    IncidentInvestigationNote:
      x-ticvai-persistence: maintenance.incident_investigation_note
      type: object
      description: >
        **One investigation note, appended by `updateIncident`** (decided 28 September, audit
        R106 (5)). A history rather than a field, so what an investigator thought on Tuesday
        survives what they found on Thursday.
      required: [id, incidentId, note, recordedAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        note: { type: string, maxLength: 10000 }
        writtenByPrincipalId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }

    IncidentAuthorityNotification:
      x-ticvai-persistence: maintenance.incident_authority_notification
      type: object
      description: >
        **One notification to an external authority, appended by
        `recordAuthorityNotification`.** An incident may be reported to more than one authority,
        or to the same one twice, and each is the evidence that an obligation was met — so each
        is a row, not an overwrite of `maintenance.incident.notified_at`.
      required: [id, incidentId, authority, notifiedAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        authority: { type: string, maxLength: 200 }
        reference: { type: string, maxLength: 128, nullable: true }
        notifiedAt: { type: string, format: date-time }
        notifiedByPrincipalId: { type: string, format: uuid }
        attachmentRefs:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
