  theme.primaryColour: 'the palette''s brand: --brand (web), --br (app)'
  theme.secondaryColour: 'the palette''s brand2: --brand-2 (web)'
  theme.accentColour: 'the palette''s accent: --accent'
  theme.backgroundColour: 'the palette''s bg: --bg'
  theme.textColour: --ink, where set; never derived (Theme requires it)
  theme.darkMode: never used to render (deprecated, CHG-CSA-035)
  theme.cornerRadius: --rk = cornerRadius / 10, the scale on the base radii sm 6, md 10, lg 16 (px)
  theme.surfaceStyle: 'Glass or Solid: --surface, --surface-2, --line (web, data-glass on the root)'
  theme.buttonStyle: 'Solid, Outline or Pill: --btn-bg, --btn-fg, --btn-bd, --btn-r (web)'
  fonts: 'FontConfig''s faces replace the skin''s --fh and --fb: the Latin pair (primaryLatin, secondaryLatin),
    and under dir=rtl the Arabic pair (primaryArabic, secondaryArabic)'
  direction: dir=rtl on the root when the guest's language is Arabic; every token is direction-free
  skinKey: 'PublishedTenantConfig.skinKey (getPublishedTenantConfig with venueId): the venue''s skin, one of skins.byVenueKind;
    null or not yet published: the base skin with park (until the field arrives, the shell takes the key as an input,
    base plus park until set)'
  order: the skin sets every token; then theme.primaryColour, theme.backgroundColour and theme.textColour override
    --br, --bg and --ink where set
