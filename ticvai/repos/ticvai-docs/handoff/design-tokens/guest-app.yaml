notes:
- 'The two app prototypes name their variables differently (v4: --br, --sf, --ln, --rk, --fh, --fb; v2: --brand,
  --surface, --line, --r, --font-h, --font-b). They are one system: the shell keeps one set of names and maps both
  to it; a screen takes the names of the prototype its view is in.'
- A variable's `default` is the prototype's fallback before the venue's skin is applied.
