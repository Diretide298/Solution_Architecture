# Pricing publication target — state model
# Contract: catalogue.PricingPublicationTarget.status
# Checked by tools/check-states.py. Added 29 September (writers pass).

entity: Pricing publication target
contract: catalogue
enum: PricingPublicationTarget.status
enumKind: inline
enumSchema: PricingPublicationTarget
enumProperty: status
owner: catalogue
initial:
- pending
terminal:
- inSync
transitions:
- from: pending
  to: publishing
  trigger: job
  guard: The distribution job starts sending the publication to this target
- from: publishing
  to: inSync
  trigger: job
  guard: The target acknowledged every record
- from: publishing
  to: failed
  trigger: job
  guard: The target refused or timed out; `failureReason` records why
- from: failed
  to: publishing
  trigger: job
  guard: The distribution job retries with backoff until the target acknowledges
notes: '**Written only by the distribution job**, one row per target of a `catalogue.pricing_publication`
  (`publishPricingEffectiveDate`). A target left `failed` keeps the publication `publishing` and is shown on
  ADM-085.'
