services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ticvai_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c max_connections=200
               -c shared_preload_libraries=pg_stat_statements
               -c log_min_duration_statement=200

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: dev
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    ports: ["6432:5432"]
    depends_on: [postgres]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes

  # Event broker (ADR-0057): RabbitMQ locally until the client chooses RabbitMQ or Kafka for the
  # cloud; modules use the kernel's IEventPublisher/IEventSubscriber, never the client library directly.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]

  # Vectors (ADR-0049): Qdrant, one collection per tenant with a collection-scoped JWT.
  qdrant:
    image: qdrant/qdrant:v1.16.0
    environment:
      QDRANT__SERVICE__JWT_RBAC: "true"
      QDRANT__SERVICE__API_KEY: dev
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrantdata:/qdrant/storage

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4317:4317"]

volumes:
  pgdata:
  qdrantdata:
