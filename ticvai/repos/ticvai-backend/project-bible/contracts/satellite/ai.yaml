openapi: 3.1.0
info:
  title: TICVAI — AI
  version: 1.0.0
  x-ticvai-screen-count: 19
  x-ticvai-module: "8 — Unified Operations Dashboard (AI)"
  x-ticvai-platforms:
    - P02 Guest App
    - P05 Guest Kiosk
    - P06 Venue Staff App
    - P08 Venue Management
    - P09 TICVAI Web
  # Derived from screens/*.yaml on 18 August — every platform with a screen that calls an
  # operation in this contract. **Six contracts declared none**, which the viewer reports as
  # missing taxonomy and no package checker tested for.
  x-ticvai-tier: satellite
  description: >
    **Retrieval and inference over data the platform already holds. Nothing here needs a trained
    model.**

    Scope was set on 14 August. Forecasting, fraud detection, dynamic pricing and recommendation
    all require operating history that does not exist before go-live, and a model trained on
    nothing predicts nothing. Those 194 requirements are parked with their front ends, back ends
    and tables buildable and their engines deferred.

    What is left is the part that works on day one because it reads what is already there: a
    conversational assistant grounded in the tenant's own catalogue and configuration (8.4.38
    names RAG outright), semantic search across products and documents (8.4.39), configuration
    assistance that walks an admin through creating a product (CF-57, the client's stated first
    priority), map and layout generation from an uploaded plan, and the governance that makes
    all of it auditable.

    ## Four rules this contract enforces

    **No provider SDK in capability code.** `AiProvider` is configuration. OpenAI, Gemini,
    Claude and a local model are interchangeable at the operation level (8.4.21–8.4.25), and
    failover between them is a platform concern rather than a caller's (8.4.26).

    **Tenant isolation is the cell where a cell holds one tenant, and a dedicated shard where it
    does not** (ADR-0021). A collection is per embedding model, not per tenant — a collection
    carries its own vector configuration and a shard cannot, so the split criterion is the model.

    The rule this replaces said isolation must never be filter-level. **That was right about
    shared placement for the wrong stated reason, and reasoning from it produced a cross-tenant
    defect on 17 August (CF-97)** — which is why the corrected version lives here, in the file
    servers and clients are generated from, rather than only in the ADR.

    **Read-only against the transactional core.** An AI capability must never become a
    permission bypass. Retrieval runs as the calling principal and returns only what that
    principal could have read directly. An assistant that can see more than its user is a
    privilege escalation with a friendly interface.

    **Nothing acts without approval.** The assistant drafts a product, a promotion or a pricing
    rule and a person applies it (8.3.61–8.3.66). Financial and pricing actions require approval
    before execution, and that is enforced here rather than assumed downstream.

    ## What is deliberately absent

    No training, no fine-tuning, no model registry. Providers are called, not trained. When the
    parked capabilities arrive they will need all three, and adding them then is cheaper than
    carrying an unused abstraction now.
  contact:
    name: TICVAI Platform
servers:
  - url: https://api.{region}.ticvai.com/ai/v1
    variables:
      region:
        default: ae
security:
  - bearerAuth: []
tags:
  - name: assist
    description: Conversational assistance, grounded in the tenant's own data
  - name: retrieval
    description: Semantic search and the collections it searches
  - name: generate
    description: Draft a configuration a person then reviews
  - name: governance
    description: Logging, approval, explainability and cost
  - name: config
    description: Providers, models and policy
paths:
  /ai/translate:
    post:
      operationId: proposeTranslations
      summary: Fill translation gaps with a first pass, for a human to edit
      description: >
        BL-071, 2.6.34. **`setLanguages` already measures the gap** — `translationGaps` reports
        content missing a version. What was absent is filling it.

        **A first pass, never a publish.** Every proposal lands as a draft on the block it
        translates, and **a tenant's own words in a language nobody at the venue reads is exactly
        the content that must not go live unreviewed.**

        **Lives here rather than in `white-label` because it calls a model.** ADR-0020: only the AI
        contract writes AI tables — and the boundary caught this on the day it was written, for the
        third time in one session. **A rule I had just described in the description above and then
        broke in the lineage below it.**
      tags: [ai]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetLocale]
              properties:
                targetLocale: { type: string }
                scope: { type: string, enum: [allGaps, contentBlocks, productNames, emailTemplates] }
                glossaryRef:
                  type: string
                  nullable: true
                  description: >
                    **Terms that must not be translated** — a venue's ride names, its brand, its
                    membership tiers. Without one, *Ladies Night* becomes a literal translation
                    somebody has to find and undo.
      responses:
        '202':
          description: Proposed as drafts, for review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true


  /ai/suggestions:
    post:
      operationId: requestSuggestion
      x-ticvai-consumed-by:
        - "P02 GST-052 Suggested Itineraries"
        - "P02 GST-054 AI Optimized Itinerary"
        - "P02 GST-059 Plan My Day – In Progress"
        - "P08 BO-115 Category, Brand & Merchandise Hierarchy"
        - "P08 BO-117 Product Import, Governance & AI Configuration Assistant"
        - "P16 ANL-001 Executive Command Center"
        - "P16 ANL-010 Suggestions & Advice"
      summary: Ask for an answer, however it is currently produced
      description: >
        **One operation for thirteen questions, and the reason is the swap.** The client F&B boards
        drew six of these as their own endpoints — `suggestPrice`, `suggestRequisition`,
        `suggestReplenishment`, `simulateScenario`, `simulateSlaPolicy`, `publishDemandPlan`.
        **Six endpoints means six places to change when a model changes**, and the model will change
        more often than the venue's question does.

        **Ships answering from heuristics.** A price suggestion is a margin rule; a replenishment is
        par level minus on-hand plus lead time. **Every one of those is a stated rule that works on
        day one and is beaten by a model on day four hundred** — and the swap is a provider change,
        not a contract change.

        **The response always names its basis.** A manager must be able to see that today's answer
        is arithmetic and next quarter's is a trained model, on the same screen, without being told.

        **Never acts.** A suggestion that can order stock is a suggestion that will order stock
        wrongly at three in the morning — this proposes, and `decideProposedAction` decides.
      tags: [ai]
      x-ticvai-permission: AI_USE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  allOf:
                    - $ref: '#/components/schemas/SuggestionKind'
                  description: >
                    **A guest caller may ask for `prepPlan`, `upsell` and `waitTime` only.**
                    Anything else is refused — a guest asking for `price` is a guest asking what
                    the venue is willing to charge, and `demandForecast` is a competitor
                    question. The refusal is on the operation rather than in a note, because
                    **an audience widened without narrowing its inputs is an audience given
                    everything.**
                subjectRef: { type: string, nullable: true }
                horizon:
                  type: string
                  nullable: true
                  description: For a forecast — `nextService`, `7d`, `28d`, or an ISO period.
                context:
                  type: object
                  additionalProperties: true
                  description: >
                    **What the caller already knows.** Passed rather than re-fetched so a
                    suggestion made from a screen uses the numbers the screen is showing —
                    **advice computed from data the manager cannot see is advice they will not
                    trust.**
      responses:
        '200':
          description: The suggestion, with its basis and its reasoning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestion' }
        '422':
          description: >
            **Not enough data to answer.** A venue three weeks old has no seasonality, and
            **refusing is better than a confident number built on nothing** — the response names
            what is missing and when there will be enough.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /ai/suggestions/{suggestionId}/outcome:
    parameters:
      - name: suggestionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordSuggestionOutcome
      x-ticvai-consumed-by:
        - "P16 ANL-010 Suggestions & Advice"
      summary: What the venue actually did
      description: >
        **The operation that makes machine learning possible later.** A model needs labelled data
        and **the only source of labels is whether the venue took the advice and whether it
        worked.**

        **A platform that suggests and never records the outcome has no training set a year on**,
        and the swap it was designed for never happens.

        **A rejected suggestion is the more valuable record.** It is the case the current rule got
        wrong, which is exactly what a model is being trained to beat — so this is called on
        rejection as well as acceptance, and `ignored` and `expired` are captured by a job rather
        than by a person.
      tags: [ai]
      x-ticvai-permission: AI_USE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestionOutcome' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionOutcome' }

  /ai/suggestion-providers:
    put:
      operationId: setSuggestionProvider
      summary: Point a question at a rule, a model, or both
      description: >
        **The swap, and it is a configuration change.** Per `SuggestionKind`: which producer answers
        it, at which version, and with what guard rails.

        **Shadow mode is why this exists rather than a feature flag.** A new model runs alongside
        the rule, its answers are recorded and never shown, and **the venue compares six weeks of
        both before anything changes on a screen.** A model promoted without that is a model
        nobody can defend when it is wrong.

        **A guard rail is not optional for a `model` basis.** A price suggestion outside a stated
        band is refused and falls back to the rule — **an unbounded model in a pricing path is one
        bad inference from a free lunch for a thousand guests.**
      tags: [ai]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-permission-escalated: AI_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [kind, basis, producerRef]
                    properties:
                      kind: { $ref: '#/components/schemas/SuggestionKind' }
                      basis: { $ref: '#/components/schemas/SuggestionBasis' }
                      producerRef: { type: string }
                      shadowProducerRef:
                        type: string
                        nullable: true
                        description: >
                          Runs alongside and is recorded, never shown. **How a model earns its
                          place before anybody depends on it.**
                      guardRails:
                        type: object
                        nullable: true
                        additionalProperties: true
                        description: >
                          Bounds the answer must fall within. **Required where basis is `model`** —
                          refused at save otherwise.
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /ai/venue-map/{mapId}/propose-walkways:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: proposeWalkways
      summary: Find walkable space in a drawing that has no vectors
      description: >
        **The last resort, and it says so.** Walkable space is normally derived by subtraction —
        the site minus buildings, seating, water and keep-out — which is exact, repeatable and
        needs no model.

        **This is for a raster plan only**: a scan, a photograph, an illustrated map with no
        geometry behind it. There is nothing to subtract, so the paths have to be seen.

        **Proposes a path network with a confidence per segment, and applies nothing.** The failure
        mode is why: **a wrongly seen path routes a guest into a lake or a service yard**, and
        unlike a mislabelled toilet that is not a cosmetic error.

        **Low-confidence segments are shown, not hidden.** A segment the model is unsure about is
        the one an operator must look at, and filtering them out produces a network that looks
        clean and has a hole in it.

        Writes `ai.proposed_action` and stops. `venue-map.acceptWalkwayProposals` is the human half.
      tags: [ai]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Proposed walkways, for review
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '409':
          description: >
            **The map has vector geometry.** Refused deliberately — subtraction is available and
            better, and running a model where geometry exists is how a worse answer gets preferred
            because it arrived in a nicer format.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /ai/venue-map/{mapId}/propose-labels:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: proposeVenueLabels
      x-ticvai-consumed-by:
        - "P08 BO-093 Map Import & Labelling"
      summary: Suggest what each extracted shape is
      description: >
        1.4.24 and 8.8.13. **Reads shapes that `venue-map.importVenueGeometry` already extracted and
        proposes what each one is.** A polygon on the toilet layer beside an entrance is probably a
        restroom; a large shape with a ride name in the label layer is probably an attraction.

        **It does not parse the drawing.** Extraction is deterministic and lives in `venue-map`,
        carrying the four defects CF-122 found on the seat importer. **Two failure modes kept
        apart** — a mis-parsed layer and a bad suggestion look identical if one operation does
        both, and *"the map is wrong"* is then unactionable.

        **Lives here rather than in `venue-map` because it calls a model.** ADR-0020: only the AI
        contract writes AI tables, and the boundary caught `venue-map` trying to write
        `ai.proposed_action` on the day it was drafted.

        Proposes and stops. `venue-map.acceptVenueLabelProposals` is the human half.
      tags: [ai]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Proposals, for review
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /ai-providers/{providerId}/credential:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setAiCredential
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience: [staff]
      summary: Store or rotate a provider key
      description: >
        **The key goes to the vault and never to the database.** The request carries the secret
        once; what is stored is a `credentialRef`, and every read of this provider thereafter
        returns the reference rather than the value.

        **No surface ever holds a provider key.** A kiosk, an app and a browser all call TICVAI,
        and TICVAI calls the provider — because a token that reaches a client is a token that
        bills the tenant from somebody else's machine.

        Rotation is the same operation. The previous key is revoked at the vault after a grace
        window, so an in-flight request does not fail mid-answer.
      tags: [ai]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret:
                  type: string
                  format: password
                  description: >
                    **Write-only, never returned, never logged, never in an `ai.interaction`.**
                    Masked in any audit record of this call.
                expiresAt: { type: string, format: date-time, nullable: true }
                graceMinutes:
                  type: integer
                  default: 15
                  description: How long the previous key stays valid, so in-flight requests survive.
      responses:
        '200':
          description: Stored, with a reference and no secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProvider' }

  /ai-providers/{providerId}/test:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: testAiProvider
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience: [staff]
      summary: Check the key works before anyone relies on it
      description: >
        A minimal call against the provider, using the stored credential.

        **Run before activating and on a schedule after.** A key that lapses silently takes the
        assistant down with no error anyone reads — the failure surfaces as an assistant that
        stopped answering, which is diagnosed slowly.

        Costs a handful of tokens and **is billed to the tenant like any other call**, because
        pretending otherwise would put a hole in the reconciliation.
      tags: [ai]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  model: { type: string }
                  latencyMs: { type: integer }
                  failureReason:
                    type: string
                    nullable: true
                    enum: [invalidKey, expiredKey, quotaExceeded, modelUnavailable, unreachable, residencyRefused]
                  verifiedAt: { type: string, format: date-time }

  /conversations:
    get:
      operationId: listAiConversations
      x-ticvai-consumed-by:
        - "P06 EMP-019 AI assistant — home"
        - "P06 EMP-020 AI assistant — answer"
      x-ticvai-audience: [staff]
      summary: A principal's conversation history
      description: >
        8.4.30. Retained because an assistant with no memory of yesterday is a search box, and
        because the governance requirements need the history to exist (8.3.59).
      tags: [assist]
      x-ticvai-permission: AI_USE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiConversation' }

    post:
      operationId: createAiConversation
      x-ticvai-consumed-by:
        - "P06 EMP-019 AI assistant — home"
        - "P06 EMP-020 AI assistant — answer"
      x-ticvai-audience: [staff]
      summary: Open a conversation
      description: >
        Scoped to a module and a role, because the same question means different things to a
        cashier and a finance controller (8.4.6). The scope is taken from the session, never
        from the request — an assistant that accepts the venue it should answer about is an
        assistant that can be asked about someone else's.
      tags: [assist]
      x-ticvai-permission: AI_USE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module]
              properties:
                module:
                  type: string
                  description: Which part of the platform the conversation is about (8.4.1).
                locale:
                  type: string
                  description: 8.4.3. Multilingual, and Arabic is not an afterthought here.
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConversation' }

  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendAiMessage
      x-ticvai-consumed-by:
        - "P02 GST-031 AI Concierge – Home"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-033 AI Concierge – Contextual Help"
        - "P02 GST-054 AI Optimized Itinerary"
        - "P05 KSK-015 Assistant"
        - "P06 EMP-019 AI assistant — home"
        - "P06 EMP-020 AI assistant — answer"
      x-ticvai-audience: [staff, guest]
      summary: Ask
      description: >
        **The central operation.** Natural language in, a grounded answer out, with its sources
        (8.4.2, 8.4.10, 8.4.38).

        Retrieval runs **as the calling principal**. The assistant can see exactly what that
        person could have read directly and nothing more — no service account, no elevated
        query. This is the difference between an assistant and a privilege escalation with a
        friendly interface.

        Every response carries a trace id, the model and provider that produced it, token
        counts and its sources. Not for the user's benefit: for cost attribution and for the
        grounding audit that 8.3.70 requires.

        **Where the answer proposes an action, it is a draft.** The response carries a
        `proposedAction` the caller may apply through the owning contract, and applying it is a
        separate, permissioned, audited step (8.3.61–8.3.64).
      tags: [assist]
      x-ticvai-permission: AI_USE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 8000 }
                collectionIds:
                  type: array
                  description: >
                    Restrict retrieval to named collections. Absent means every collection the
                    principal may read.
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiMessage' }
        '429':
          description: >
            Usage limit reached for this tenant or principal (8.3.76). The limit is a cost
            control, and the message says which limit rather than failing opaquely.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '503':
          description: >
            Every configured provider failed. **Reported rather than retried indefinitely** —
            an assistant that hangs is worse than one that says it cannot answer.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /search:
    post:
      operationId: semanticSearch
      x-ticvai-consumed-by:
        - "P06 EMP-040 Knowledge base"
        - "P06 EMP-041 Training"
      x-ticvai-audience: [staff]
      summary: Search meaning, not words
      description: >
        8.4.39. Across products, tickets, memberships, documents and knowledge collections.

        Separate from the conversational path because most of the time a person wants a list
        and not a paragraph, and generating prose to answer "which annual passes do we sell"
        costs tokens to produce something worse than a table.

        Results are scoped to the principal, and each carries the collection it came from so a
        wrong answer can be traced to a wrong document rather than blamed on the model.
      tags: [retrieval]
      x-ticvai-permission: AI_USE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 500 }
                kinds:
                  type: array
                  items:
                    type: string
                    enum: [product, entitlement, membership, document, knowledge, faq, report]
                limit: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchResult' }

  /collections:
    get:
      operationId: listKnowledgeCollections
      x-ticvai-audience: [staff]
      summary: Collections available to this tenant
      description: >
        **A collection belongs to exactly one tenant.** Isolation is partition-level, never a
        filter on a shared index — a forgotten filter is a cross-tenant breach, and a missing
        collection is a loud failure. Only the second is recoverable.
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeCollection' }

    post:
      operationId: createKnowledgeCollection
      x-ticvai-audience: [staff]
      summary: Create a collection
      description: >
        Approved enterprise knowledge sources (8.4.38) — operating procedures, policies, product
        notes. **Named sources, not the open web.**
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
