    LayoutDraft:
      type: object
      x-ticvai-persistence: "ai.layout_draft"
      required: [importJobId, status]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        importJobId:
          type: string
          format: uuid
          description: >
            Enters the seat-map import pipeline at `previewReady`. Nothing is written until a
            person commits it.
        status: { type: string, enum: [parsing, previewReady, failed] }
        seatCount: { type: integer }
        sectionCount: { type: integer }
        categoriesProposed:
          type: array
          items: { type: string }
        unresolved:
          type: array
          description: Regions of the plan it could not interpret, named so a person can fix them.
          items: { type: string }
        traceId: { type: string }

    AiUsageReport:
      type: object
      x-ticvai-persistence: "none — aggregated from ai.interaction"
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        groupBy: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              interactions: { type: integer }
              promptTokens: { type: integer }
              completionTokens: { type: integer }
              costMinor: { type: integer }
              p95LatencyMs: { type: integer }
              refusalRate: { type: number }
              rejectionRate:
                type: number
                description: >
                  Proposals a person refused. **The number that says whether the assistant is
                  worth having**, and the one nobody thinks to measure.
