  /collections/{collectionId}/documents:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: ingestKnowledgeDocument
      x-ticvai-audience: [staff]
      summary: Add a document
      description: >
        8.4.11. Chunked and embedded asynchronously — `status` moves through `processing`
        before `indexed`, and **a document that says "added" while still processing is a
        document a user will search for and not find**.

        Documents carry the scope they may be retrieved at. A venue operating procedure is not
        an answer to a question about another venue.
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeDocument' }
      responses:
        '202':
          description: Accepted for indexing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }

  /generate/configuration:
    post:
      operationId: generateConfiguration
      x-ticvai-consumed-by:
        - "P08 BO-117 Product Import, Governance & AI Configuration Assistant"
      x-ticvai-audience: [staff]
      summary: Draft a configuration from a description
      description: >
        8.8.10 to 8.8.14. **An admin describes what they want and the assistant walks the
        configuration** — products, pricing, promotions, seating and the calendar. Five
        requirements, not twenty: 8.1's "AI Configuration Assistant" heading sits over two
        unrelated blocks (CF-74).

        **It needs no training corpus and it is not context-free**, and those are different
        claims. The phasing paper calls this data-independent because it forecasts nothing and
        learns from no history — correct. But *"create VIP seating in the first three rows with a
        30% premium"* cannot be answered without the seat map, the price categories and the
        venue's own vocabulary.

        **So it reads the venue's current configuration and nothing behavioural.** Twenty-two
        tables: the catalogue, price lists, promotions, the seat map, performances and region
        settings. No orders, no scans, no guests.

        **The bootstrapping case is the one to design for.** A brand-new tenant has no seat map,
        no price list and no products, and *"first three rows"* means nothing. On an empty venue
        the assistant creates rather than amends, and the two are different prompts with different
        risk — **amending touches things already sold.**

        **Proposes; never applies.** Writes `ai.proposed_action` and stops. 8.1.4 requires approval
        before execution for anything affecting pricing or financial operations, and this is that
        gate — the same one `x-ticvai-permission-escalated` enforces for a human.

        Seating includes generating a map from an uploaded layout, which is `generateVenueLayout`
        and `importSeatGeometry` (CF-123). **The assistant does not parse the drawing** — it names
        the sections, categories and premiums once the geometry is in.
      tags: [generate]
      x-ticvai-permission: AI_USE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, description]
              properties:
                kind:
                  type: string
                  enum: [product, membership, pass, promotion, discountRule, pricingCalendar,
                         seatingZone, operatingHours, campaign]
                description: { type: string, minLength: 5, maxLength: 4000 }
                conversationId:
                  type: string
                  format: uuid
                  description: Where the clarifying questions were asked and answered.
      responses:
        '200':
          description: A draft, plus what it needed to guess
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedConfiguration' }

  /generate/venue-layout:
    post:
      operationId: generateVenueLayout
      x-ticvai-audience: [staff]
      summary: Draft a seat map from an uploaded plan
      description: >
        Raised by Chinmay on 14 August as the near-term use case that needs no history: a venue
        uploads a plan image and a schema, and the platform proposes the seat map, categories
        and the ticket configuration that follows.

        **A draft into the seat-map import pipeline**, which already has a preview step for
        exactly this reason — a manifest somebody made is always wrong the first time in a way
        only a person looking at it will notice. The generated layout enters at `previewReady`
        and a human commits it.
      tags: [generate]
      x-ticvai-permission: CAPACITY_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, planAssetId]
              properties:
                venueId: { type: string, format: uuid }
                planAssetId:
                  type: string
                  format: uuid
                  description: The uploaded plan image, in the media store.
                schemaAssetId:
                  type: string
                  format: uuid
                  description: A manifest or schema file where one exists.
                notes: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: >
            An import job at `previewReady`. Nothing is written to the seat map until a person
            commits it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDraft' }
        '422':
          description: The plan could not be interpreted. The reason is specific enough to act on
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /interactions:
    get:
      operationId: listAiInteractions
      x-ticvai-consumed-by:
        - "P09 ADM-004 Platform Audit Log"
      x-ticvai-audience: [staff]
      summary: Every prompt, response and action
      description: >
        8.1.2, 8.1.3, 8.3.55–8.3.57. The audit trail, and the reason it is a first-class
        operation rather than a log file: **8.1.6 requires a history of AI actions and the user
        decisions taken against them**, and a log nobody can query is not an audit trail.

        Carries the prompt, the response, the provider and model, token counts, cost, latency,
        the sources retrieved and whether a proposed action was applied or rejected. **The
        rejection is the interesting record** — an assistant whose suggestions are refused nine
        times in ten is a measurable problem.
      tags: [governance]
      x-ticvai-permission: AI_AUDIT_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: analytical
      parameters:
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - name: outcome
          in: query
          schema: { type: string, enum: [answered, refused, applied, rejected, failed] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Interactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiInteraction' }

  /proposed-actions:
    get:
      operationId: listProposedActions
      x-ticvai-consumed-by:
        - "P16 ANL-009 AI Assistant & Action Center"
      x-ticvai-audience: [staff]
      summary: What the assistant has proposed and nobody has decided
      description: >
        8.3.61–8.3.66. Pricing, promotional, operational and financial proposals wait here for
        approval, and multi-level approval is supported because a pricing change and a discount
        rule do not carry the same authority.
      tags: [governance]
      x-ticvai-permission: AI_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Awaiting a decision
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProposedAction' }

  /proposed-actions/{actionId}/decide:
    parameters:
      - name: actionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decideProposedAction
      x-ticvai-consumed-by:
        - "P16 ANL-009 AI Assistant & Action Center"
      x-ticvai-audience: [staff]
      summary: Approve or reject a proposal
      description: >
        **Approval is recorded here; execution happens in the owning contract under the
        approver's own permission.** This operation does not apply the change.

        That separation matters: an approval endpoint that also executes would let a person
        approve something they could not themselves do, and the whole control depends on them
        being the same person.

        A rejection carries a reason. It is the only signal that the assistant is proposing
        badly, and without it a bad model degrades silently.
      tags: [governance]
      x-ticvai-permission: AI_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProposedAction' }
        '403':
          description: >
            The approver may not authorise this kind of action, or is the principal who
            prompted it.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /usage:
    get:
      operationId: getAiUsage
      x-ticvai-consumed-by:
        - "P08 BO-091 AI Policy & Spend"
      x-ticvai-audience: [staff]
      summary: Usage, cost and performance
      description: >
        8.1.7, 8.3.81–8.3.83. Tokens, cost and latency by tenant, venue, principal, provider and
        capability.

        **Cost attribution is the reason every response carries a token count.** An AI feature
        with no cost signal is a bill nobody predicted, and the first month is when it matters.
      tags: [governance]
      x-ticvai-permission: AI_AUDIT_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: analytical
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [tenant, venue, principal, provider, capability, day] }
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiUsageReport' }

  /providers:
    get:
      operationId: listAiProviders
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience: [staff]
      summary: Configured providers and their order
      description: >
        8.4.21–8.4.26. OpenAI, Gemini, Claude and a local model, several at once, with failover.

        **Order is configuration, not code.** A capability names what it needs — a model that
        reasons, a model that embeds — and the platform resolves which provider serves it. That
        is what makes "no provider SDK in capability code" enforceable rather than aspirational.
      tags: [config]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-config-scope: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiProvider' }

    put:
      operationId: setAiProvider
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience: [staff]
      summary: Configure a provider
      description: >
        **Region-scoped, because inference is a data transfer.** ADR-0009: a prompt containing
        guest data leaves the jurisdiction the moment it reaches a provider hosted elsewhere,
        and which providers a region may use is a residency decision rather than a preference.

        Credentials are a key-vault reference, never the key.
      tags: [config]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-config-scope: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiProvider' }
      responses:
        '200':
          description: Configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiProvider' }

  /policy:
    get:
      operationId: getAiPolicy
      x-ticvai-consumed-by:
        - "P08 BO-091 AI Policy & Spend"
      x-ticvai-audience: [staff]
      summary: What the assistant may do here
      description: >
        8.3.72–8.3.80. Which capabilities are enabled, which roles may use them, what is masked
        before it reaches a provider, and the usage ceiling.
      tags: [config]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiPolicy' }

    put:
      operationId: setAiPolicy
      x-ticvai-consumed-by:
        - "P08 BO-091 AI Policy & Spend"
      x-ticvai-audience: [staff]
      summary: Set the policy
      description: >
        **Tenant sets the default; a venue may narrow it and never widen it** (8.4.4 and 8.4.5,
        adjacent requirements asking for both, which is ADR-0018's inheritance rule stated by
        the matrix itself).

        Masking is the part to get right. `maskedFields` names what is redacted before a prompt
        leaves the platform, and it defaults to every field in the `pii` schema — **a default
        that fails closed, because a masking list somebody forgot to fill in should send
        nothing rather than everything.**
      tags: [config]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiPolicy' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiPolicy' }

  /index-sources:
    get:
      operationId: listIndexSources
      x-ticvai-audience: [staff]
      summary: What is indexed, and how current it is
      description: >
        **A source is declared once here, not implemented in twenty-two services.**

        The alternative — every service calling the AI service when its content changes — makes
        AI a dependency of the catalogue, the CMS, maintenance and marketing, and a failure in
        indexing then becomes a failure in publishing a product. That is backwards: **retrieval
        is downstream of the business, and downstream failures must not propagate upstream.**

        Instead each source names the domain event that already exists. `catalogue.product` is
        reindexed when `catalogue.productPublished` is published, and the catalogue never learns
        that AI exists.
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Sources with their freshness
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IndexSource' }

    put:
      operationId: setIndexSource
      x-ticvai-audience: [staff]
      summary: Declare a source indexed
      description: >
        Names the table, the fields that carry retrievable text, the collection it lands in and
        the event that invalidates it.

        **`textFields` is the important one.** Indexing an entire row embeds ids, timestamps and
        foreign keys as though they were meaning, and a search for "annual pass" then matches a
        UUID. Only the fields a person would read are embedded; the rest becomes payload used
        for filtering.
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndexSource' }
      responses:
        '200':
          description: Declared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexSource' }

  /index-sources/{sourceId}/reindex:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reindexSource
      x-ticvai-audience: [staff]
      summary: Rebuild a source
      description: >
        Needed for three reasons and worth naming them: the embedding model changed, the
        `textFields` changed, or incremental indexing drifted and nobody knows why.

        **Builds into a shadow collection and swaps on completion.** Reindexing in place leaves
        the assistant answering from a half-built index, which is worse than answering from a
        stale one — a stale answer is wrong in a knowable way.
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [embeddingModelChanged, fieldsChanged, driftSuspected, initialBuild]
      responses:
        '202':
          description: Rebuilding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndexJob' }
        '409':
          description: Already rebuilding
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /index-sources/{sourceId}/entries/{entryId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: entryId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeIndexEntry
      x-ticvai-audience: [staff]
      summary: Remove one record from the index
      description: >
        **The erasure path.** When a subject is erased (`pii.erase_subject`) or a page is
        unpublished, its vectors must go too — a knowledge base that keeps answering from a
        deleted document is a deletion that did not happen.

        Deleting from Postgres does not delete from Qdrant. Nothing cascades between the two
        stores, which is why this operation exists rather than being implied.
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Removed from both stores
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /index-jobs:
    get:
      operationId: listIndexJobs
      x-ticvai-consumed-by:
        - "P08 BO-088 Approval Analytics"
      x-ticvai-audience: [staff]
      summary: Indexing in flight and recently finished
      description: >
        Progress, failures and the count of records an index could not embed. **A source that
        silently fails on 3% of its rows is a search that silently misses 3% of the answers.**
      tags: [retrieval]
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IndexJob' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AiProviderKind:
      type: string
      enum: [openai, gemini, anthropic, azureOpenai, localLlm]

    SuggestionKind:
      type: string
      description: >
        What is being suggested. **A closed set, and the reason it is closed is the swap.** Every
        entry here is a question a venue asks that a model could answer better than a rule — and
        each one starts as a heuristic and becomes a model when there is data.

        **Six of these were drawn as their own endpoints on the client F&B boards** — `suggestPrice`,
        `simulateScenario`, `simulateSlaPolicy`, `suggestRequisition`, `suggestReplenishment`,
        `publishDemandPlan`. **Building six endpoints means six places to change when a model
        changes**, and the model will change more often than the venue's question does.
      enum:
        - price                 # what to charge, given cost, demand and competition
        - replenishment         # what to order and when
        - requisition           # what an outlet should pull from the store
        - demandForecast        # covers, or units, by day and daypart
        - prepPlan              # what to make before service
        - menuEngineering       # which items to promote, reprice, or retire
        - staffing              # how many, where, when
        - slaTarget             # what a realistic kitchen target is for this outlet
        - waitTime              # how long this party will actually wait
        - upsell                # what else this guest might want
        - segmentation          # which guests behave alike
        - anomaly               # this number does not look like the others
        - scenario              # what happens if we change X

    SuggestionBasis:
      type: string
      description: >
        **How the answer was reached, and this is the field the whole design exists for.**

        A venue must be able to see that today's price suggestion is a margin rule and next
        quarter's is a trained model — **the same operation, the same screen, a different basis** —
        and a screen that cannot say which is a screen that asks a manager to trust arithmetic it
        will not show.

        **Swapping a heuristic for a model is a provider change, not a contract change.** That is
        the point of the abstraction: the frontend, the audit record and the outcome capture all
        stay exactly as they are.
      enum:
        - heuristic             # a stated rule. What ships first.
        - statistical           # a fitted curve over the venue's own history
        - model                 # a trained model, hosted or third-party
        - hybrid                # a model with a rule as a guard rail
        - manual                # a person overrode it, and that is recorded too

    Suggestion:
      type: object
      x-ticvai-persistence: "ai.suggestion"
      description: >
        One answer to one question, with its reasoning and its confidence. **Built 24 August so
        that machine learning can be swapped in without touching a screen.**

        **A suggestion is never an action.** It proposes; `ProposedAction` and its approval path
        decide. A model that can order stock is a model that will order stock wrongly at three in
        the morning.

        **`inputs` is recorded, not just referenced.** A suggestion that cannot be reproduced cannot
        be defended to a finance controller asking why the system said to order four hundred.
      required: [id, kind, basis, producedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SuggestionKind' }
        basis: { $ref: '#/components/schemas/SuggestionBasis' }
        scopePath: { type: string }
        subjectRef:
          type: string
          nullable: true
          description: What it is about — a product, an outlet, an item, a party.
        value:
          type: object
          additionalProperties: true
          description: The suggestion itself. Shape depends on `kind`.
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >
            **Null for a heuristic and that is honest.** A rule has no confidence — dressing one up
            with 0.85 is the fastest way to make a manager trust a number that means nothing.
        explanation:
          type: string
          description: >
            **Plain words, always present, whatever the basis.** *Because covers are up 12% on this
            day last year* — a suggestion a manager cannot explain to their own boss is a suggestion
            they will not action.
        inputs:
          type: object
          additionalProperties: true
          description: >
            What went in. **Recorded so the answer can be reproduced** — and so that when a model
            replaces the rule, the two can be run against the same inputs and compared.
        producerRef:
          type: string
          description: >
            The rule name or the model id and version. **A model version is part of the record**:
            *the model said so* is not an answer to *which model, when*.
        producedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **A demand forecast for Saturday is worthless on Sunday.** An expired suggestion is
            hidden rather than shown stale.

    SuggestionOutcome:
      type: object
      x-ticvai-persistence: "ai.suggestion_outcome"
      description: >
        **What actually happened, and this is the table that makes the swap possible at all.**

        A model needs labelled data and **the only source of labels is whether the venue took the
        advice and whether it worked.** A platform that suggests and never records the outcome has
        no training set a year later, and the swap he is planning for never happens.

        **Captured whether or not the suggestion was taken.** A rejected suggestion is a stronger
        signal than an accepted one — it is the case the rule got wrong.
      required: [id, suggestionId, decision]
      properties:
        id: { type: string, format: uuid }
        suggestionId: { type: string, format: uuid }
        decision: { type: string, enum: [accepted, modified, rejected, ignored, expired] }
        actualValue:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            What the venue did instead. **The label.** A suggestion of 400 units, an order of 250,
            and a stockout on Saturday is one training example worth more than a hundred accepted
            ones.
        decidedByPrincipalId: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time }
        realisedOutcome:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            **Filled in later by a job, not by a person.** Whether the stockout happened, whether
            the covers arrived, whether the margin held — nobody comes back to record this by hand,
            so nothing that depends on them doing so should be designed.
        note: { type: string, nullable: true }


    AiCapability:
      type: string
      description: >
        What a capability needs, not which provider serves it. This indirection is what makes
        "no provider SDK in capability code" enforceable.

        **`speechToText` and `textToSpeech` added 18 August (BL-164)** — voice added rather than
        declined. **Speech is the capability where UAE residency is hardest to satisfy**: the major
        providers run it in fewer regions than text, and a guest speaking into a kiosk is producing
        personal data in the moment. `AiProvider.residency` already carries the constraint and
        **speech is the capability most likely to fail it**, which is why it is separate rather than
        folded into `chat`.
      enum: [chat, embedding, vision, rerank, speechToText, textToSpeech]

    AiProvider:
      type: object
      x-ticvai-persistence: "ai.provider"
      required: [kind, capability, priority, isActive]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { $ref: '#/components/schemas/AiProviderKind' }
        capability: { $ref: '#/components/schemas/AiCapability' }
        model: { type: string }
        failoverProviderId:
          type: string
          format: uuid
          nullable: true
          description: >
            BL-151. **A provider outage with no fallback is every AI surface going dark at once**,
            and the surfaces most likely to be noticed are the guest-facing ones.

            **Failover is declared per capability because a provider is** — a fallback covering chat
            and not embedding leaves search broken while the concierge works, which reads as a
            stranger failure than a clean outage.
        degradeGracefully:
          type: boolean
          default: true
          description: >
            **Where no fallback answers, the surface degrades rather than errors.** Semantic search
            falls back to keyword, the concierge offers a human, a recommendation returns the
            rule-based set — **an AI feature that returns a 500 is worse than one that quietly
            becomes ordinary software.**
        priority:
          type: integer
          description: Failover order (8.4.26). Lower is tried first.
        scopeLevel:
          type: string
          enum: [platform, tenant, venue]
          description: >
            **Where this provider configuration applies, and therefore whose token pays for it.**
            A tenant-scoped provider means that tenant's usage bills against their own key at the
            provider — **an independent reconciliation source against our own meter**, which is
            the point of per-tenant tokens rather than one platform key.

            `venue` exists for the case where one venue's volume justifies its own key, or where
            a venue is billed separately from the rest of its tenant.
        scopePath:
          type: string
          description: Resolved scope node. Nearest ancestor wins (ADR-0018).
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: Null only where `scopeLevel` is `platform`.
        credentialRef:
          type: string
          description: >
            A key-vault reference, never the key. A key typed into a form ends up in a
            screenshot.
        credentialRotatedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        credentialExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Where the provider issues expiring keys. **A key that lapses silently takes the
            assistant down without an error anyone reads** — the expiry is surfaced so it can be
            chased before it bites.
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When `testAiProvider` last confirmed the key works.
        endpoint: { type: string, nullable: true }
        residency:
          type: string
          description: >
            Where inference physically happens. **A prompt reaching a provider hosted elsewhere
            is a cross-border transfer** (ADR-0009), and this field is what makes that
            auditable rather than assumed.
        maxTokens: { type: integer }
        isActive: { type: boolean }

    AiPolicy:
      type: object
      x-ticvai-persistence: "ai.policy"
      required: [scopeLevel, enabledCapabilities]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        scopeLevel:
          type: string
          enum: [tenant, venue]
          description: Tenant sets the default; a venue may narrow it and never widen it.
        enabledCapabilities:
          type: array
          items:
            type: string
            enum: [assist, search, generateConfiguration, generateLayout, summarise, explain]
        allowedRoleIds:
          type: array
          items: { type: string, format: uuid }
        maskedFields:
          type: array
          description: >
            Redacted before a prompt leaves the platform (8.3.73). **Defaults to every field in
            the pii schema** — a masking list nobody filled in should send nothing rather than
            everything.
          items: { type: string }
        requiresApprovalFor:
          type: array
          description: 8.3.61–8.3.64. Nothing in this list executes without a decision.
          items:
            type: string
            enum: [pricing, promotion, operational, financial, configuration]
        monthlyTokenCeiling: { type: integer, nullable: true }
        ceilingBehaviour:
          type: string
          enum: [warn, warnThenDisable, block]
          default: warn
          description: >
            **Decided 17 August: warn, and let the venue manager choose.** A cap that stops the
            assistant mid-visit turns a cost control into a guest-facing outage, and the venue
            has no warning it is about to happen.

            At the ceiling a notification reaches the venue manager with the spend and the
            remaining period, and **the assistant keeps answering until somebody decides
            otherwise**. `warnThenDisable` and `block` exist for a tenant who asks for a hard
            limit; neither is the default.
        ceilingWarningPercent:
          type: integer
          default: 80
          description: >
            **Warn before the ceiling, not at it.** A manager told at 100% has already spent it;
            one told at 80% can decide with a week left.
        guestCapabilityScope:
          type: array
          description: >
            **What a guest-facing assistant may help with, and nothing else** (2.1.28). Bounding
            the capability is what makes the cost predictable and the safety posture tractable —
            an assistant that answers anything is one that can be asked anything.
          items:
            type: string
            enum: [ticketSelection, promotions, faq, recommendations, checkout, waitTimes, wayfinding]
        retrieveTopK:
          type: integer
          default: 30
          description: How many chunks retrieval returns before reranking.
        rerankTopK:
          type: integer
          nullable: true
          default: 5
          description: >
            How many survive the rerank and reach the model. **Reranking reduces cost as well as
            improving quality**, which is unusual — retrieval is cheap and the tokens sent to the
            model are not.

            Null disables reranking, and a venue with no rerank provider configured runs without
            it rather than failing.
        cacheAnswers:
          type: boolean
          default: true
          description: >
            **The largest cost lever available at a kiosk.** Guest questions are extraordinarily
            repetitive — forty questions, thousands of times a day — where staff questions are
            diverse.

            **Invalidation runs on the same events that invalidate the index.** A cached answer
            that outlives a price change has misled a guest on the venue's behalf, which is worse
            than a slow one.
        cacheTtlMinutes:
          type: integer
          default: 60
          description: >
            An upper bound on top of event invalidation, not instead of it. **The key carries
            `scope_path`** — a cache keyed on the question alone is a cross-venue leak wearing a
            performance hat.
        retainInteractionsDays:
          type: integer
          description: >
            How long prompts and responses are kept. **Unresolved — CF-64.** Prompts may carry
            personal data, so this is a retention decision nobody has made.

    AiConversation:
      type: object
      x-ticvai-persistence: "ai.conversation"
      required: [id, principalId, module, startedAt]
      properties:
        id: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        scopePath: { type: string }
        module: { type: string }
        locale: { type: string }
        messageCount: { type: integer }
        startedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }

    AiSource:
      type: object
      x-ticvai-persistence: "none — embedded in the interaction"
      description: >
        What the answer was grounded in (8.3.70). **An answer with no sources is a guess**, and
        the interface should show it as one.
      properties:
        kind: { type: string, enum: [document, product, entitlement, report, record] }
        id: { type: string }
        title: { type: string }
        collectionId: { type: string, format: uuid, nullable: true }
        excerpt: { type: string }
        relevance: { type: number }

    AiMessage:
      type: object
      x-ticvai-persistence: "ai.message"
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AiSource' }
        confidence:
          type: number
          nullable: true
          description: >
            8.1.5, 8.3.67. **Nullable on purpose** — a provider that does not report confidence
            must yield null rather than an invented number, and an interface showing 0.9 because
            the code defaulted it is worse than showing nothing.
        rationale:
          type: string
          nullable: true
          description: 8.3.68, 8.3.69.
        proposedAction:
          allOf:
            - $ref: '#/components/schemas/ProposedAction'
          nullable: true
          description: Present where the answer suggests a change. **A draft, never applied here.**
        traceId: { type: string }
        provider: { $ref: '#/components/schemas/AiProviderKind' }
        model: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        latencyMs: { type: integer }
        createdAt: { type: string, format: date-time }

    ProposedAction:
      type: object
      x-ticvai-persistence: "ai.proposed_action"
      required: [id, kind, targetContract, targetOperation, payload, status]
      properties:
        id: { type: string, format: uuid }
        interactionId: { type: string, format: uuid }
        kind:
          type: string
          enum: [pricing, promotion, operational, financial, configuration]
        targetContract:
          type: string
          description: Which contract would perform it. The assistant never performs it itself.
        targetOperation: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: The request body a person would submit, ready to review.
        summary: { type: string }
        status:
          type: string
          enum: [proposed, approved, rejected, applied, expired]
        approvalLevel:
          type: integer
          description: 8.3.65. Multi-level, because a discount and a pricing change differ in authority.
        decidedByPrincipalId: { type: string, format: uuid, nullable: true }
        decisionReason:
          type: string
          nullable: true
          description: >
            Required on rejection. **The only signal the assistant is proposing badly**, and
            without it a poor model degrades silently.
        proposedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }

    AiInteraction:
      type: object
      x-ticvai-persistence: "ai.interaction"
      required: [id, principalId, capability, outcome, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid, nullable: true }
        principalId: { type: string, format: uuid }
        audience:
          type: string
          enum: [staff, guest]
          description: >
            **Billing divides on this.** Staff usage is bounded by headcount; guest usage is bounded
            by footfall and curiosity, and a venue cannot stop guests asking questions.
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            The guest, where the audience is `guest`. `principalId` is null in that case — **a guest
            is not a principal**, and attributing their tokens to a staff member would be wrong twice.
        billableToTenantId:
          type: string
          format: uuid
          description: >
            Resolved from `scopePath` at write time, not derived later. **Billing must not depend on
            walking a scope tree that has since been reorganised.**
        scopePath: { type: string }
        capability: { type: string }
        prompt: { type: string }
        response: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/AiSource' }
        outcome: { type: string, enum: [answered, refused, applied, rejected, failed] }
        refusalReason: { type: string, nullable: true }
        provider: { $ref: '#/components/schemas/AiProviderKind' }
        model: { type: string }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        costMinor: { type: integer, description: In the region's base currency, minor units }
        latencyMs: { type: integer }
        maskedFieldCount:
          type: integer
          description: How many fields were redacted. Zero on a prompt touching guest data is a defect.
        traceId: { type: string }
        createdAt: { type: string, format: date-time }

    IndexSource:
      type: object
      x-ticvai-persistence: "ai.index_source"
      description: >
        One declaration per indexed table. **The service that owns the table does not know this
        exists** — the AI service consumes the domain event the owner already publishes.
      required: [table, textFields, collection, scopeLevel]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        table:
          type: string
          description: Schema-qualified, e.g. `whitelabel.content_page`.
        contract:
          type: string
          description: Which contract owns it, for tracing back.
        textFields:
          type: array
          minItems: 1
          description: >
            The fields a person would read. **Only these are embedded** — indexing a whole row
            embeds ids and timestamps as though they were meaning, and a search for "annual
            pass" then matches a UUID.
          items: { type: string }
        payloadFields:
          type: array
          description: >
            Carried alongside the vector for filtering, not embedded. Always includes
            `scope_path` — **the vector store has no row-level security, so scope travels in
            the payload or it does not travel at all.**
          items: { type: string }
        collection:
          type: string
          description: Which Qdrant collection it lands in.
        scopeLevel: { type: string, enum: [tenant, region, venue] }
        invalidatedBy:
          type: array
          description: >
            Domain events that make an entry stale. `catalogue.product` names
            `catalogue.productPublished`, and the catalogue never learns AI exists.
          items: { type: string }
        chunkStrategy:
          type: string
          enum: [wholeRecord, paragraph, fixedTokens, section, semanticSection, parentChild]
          description: >
            **Changes what is stored, so it cannot be altered without a reindex.**

            `parentChild` retrieves on a small precise chunk and returns the parent section. **A
            refund policy paragraph retrieved without its heading answers the wrong question
            confidently**, which is the failure this exists to prevent.

            `semanticSection` splits on meaning rather than length. `fixedTokens` cuts a rule in
            half, and policies and FAQs are where that shows.
        parentField:
          type: string
          nullable: true
          description: Which field carries the parent context, where `chunkStrategy` is `parentChild`.
        isActive: { type: boolean }
        entryCount: { type: integer, readOnly: true }
        lastIndexedAt: { type: string, format: date-time, readOnly: true, nullable: true }
        staleCount:
          type: integer
          readOnly: true
          description: Records changed since their last embedding. Non-zero for long is drift.

    IndexJob:
      type: object
      x-ticvai-persistence: "ai.index_job"
      required: [id, sourceId, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        kind: { type: string, enum: [full, incremental, removal] }
        reason: { type: string }
        status:
          type: string
          enum: [queued, building, verifying, swapping, complete, failed]
        recordsTotal: { type: integer }
        recordsEmbedded: { type: integer }
        recordsFailed:
          type: integer
          description: >
            **The number to watch.** A source silently failing on 3% of its rows is a search
            silently missing 3% of the answers, and nothing else in the system will say so.
        failureSample:
          type: array
          items: { type: string }
        shadowCollection:
          type: string
          nullable: true
          description: >
            A full rebuild writes here and swaps on completion. Reindexing in place leaves the
            assistant answering from a half-built index.
        shardKey:
          type: string
          readOnly: true
          description: >
            **The tenant boundary on shared placement** (ADR-0021). A collection is shared by every
            tenant using the same embedding model, and the shard is what separates them — set at
            provisioning from the tenant, never from a request.

            On dedicated placement there is one shard and this is still populated, because a
            tenant moving from shared to dedicated moves a shard rather than being re-indexed.
        embeddingModel: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    KnowledgeCollection:
      type: object
      x-ticvai-persistence: "ai.knowledge_collection"
      required: [name, scopeLevel]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        description: { type: string }
        scopeLevel: { type: string, enum: [tenant, region, venue] }
        scopePath: { type: string, readOnly: true }
        documentCount: { type: integer, readOnly: true }
        shardKey:
          type: string
          readOnly: true
          description: >
            **The tenant boundary on shared placement** (ADR-0021). A collection is shared by every
            tenant using the same embedding model, and the shard separates them — set at
            provisioning from the tenant, never from a request.

            On dedicated placement there is one shard and this is still populated, because a tenant
            moving from shared to dedicated moves a shard rather than being re-indexed.
        retrieval:
          type: string
          enum: [dense, hybrid]
          default: hybrid
          description: >
            **Set at creation and not changeable.** A collection created dense-only cannot gain a
            sparse index without a full rebuild, which is why this is a creation decision rather
            than a query one.

            Hybrid is the default because **a venue corpus is mostly proper nouns** — Yas
            Waterworld, Bronze Annual Pass, a menu item name. Dense retrieval is good at meaning
            and poor at exact tokens, and half our queries are exact tokens.
        sparseModel:
          type: string
          nullable: true
          description: The sparse signal, where `retrieval` is `hybrid`. BM25 unless a tenant needs otherwise.
        idfScope:
          type: string
          enum: [shard, tenant, venue]
          default: tenant
          description: >
            **Which population the sparse score measures rarity against** (ADR-0021). Qdrant
            computes IDF statistics shard-wide by default, so a term common at one venue and rare
            at another gets one score for both. Shard-per-tenant fixes the cross-tenant case;
            **inside a dedicated cell the shard is the whole tenant and venues share it**, which
            is what this narrows.
        embeddingModel:
          type: string
          readOnly: true
          description: >
            **This is what decides how many collections exist** (ADR-0021). A collection carries
            its own vector configuration and a shard cannot, so vectors from two models cannot
            share one. A tenant that residency forces onto a local model therefore has its own
            collection — forced by the model, not chosen for isolation.

            Read-only because **changing it invalidates every embedding in the collection**, and
            a collection silently searched with mismatched vectors returns plausible nonsense.
        isActive: { type: boolean }

    KnowledgeDocument:
