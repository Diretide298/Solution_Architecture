      responses:
        '201':
          description: Granted. Takes effect at next login unless it is a revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatedAccess'
        '400':
          description: Wildcard on an ALLOW, or scope outside the caller's own grants
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
