      summary: Write a policy without writing code
      description: '3.3.5. *"Administrators shall configure access policies without software
        development."* **That sentence is the whole requirement and it decides the shape.** A policy is
        data — a set of attribute conditions and an effect — evaluated by one engine, because the
        alternative is a deployment every time a venue changes its opening hours.

        **Created as a draft.** 3.3.25 wants simulation before deployment and 3.3.26 wants approval, so a
        policy that took effect on creation would satisfy neither.

