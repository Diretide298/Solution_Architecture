  /access-policies/{policyId}/state:
    parameters:
    - name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: setAccessPolicyState
      summary: Submit, approve, activate or retire a policy
      description: '3.3.26. **A policy change is an authorisation change**, so it goes through the same
        approval machinery as anything else that moves money or opens a door — routed to `approvals`
        rather than given a second workflow here.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - draft
                  - pendingApproval
                  - active
                  - suspended
                  - retired
                reason:
                  type: string
                  nullable: true
                effectiveFrom:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
  /access-policies/simulate:
    post:
      operationId: simulateAccessPolicy
      x-ticvai-consumed-by:
        - "P08 BO-1066 Roles, Permissions & Masking"
      summary: What this policy would decide, before it decides anything
      description: '3.3.25. *"System shall support simulation and testing of policies prior to
        deployment."*

        **An access policy is uniquely unforgiving of being tested in production.** A pricing rule that
        is wrong overcharges somebody and is refunded; an access policy that is wrong either lets the
        wrong person through a gate or strands a shift supervisor outside one at six in the morning.

        Takes a policy — including an unsaved draft — and a set of contexts, and returns the decision and
        the matched conditions for each.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contexts
              properties:
                policyId:
                  type: string
                  format: uuid
                  nullable: true
                policy:
                  $ref: '#/components/schemas/AccessPolicy'
                contexts:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccessContext'
      responses:
        '200':
          description: One decision per context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessDecision'
  /access-decisions:
    post:
      operationId: evaluateAccess
      summary: Decide, now, and say why
      description: '3.3.27 and 3.3.29. **One decision point, called by everything.** Gates, turnstiles,
        back-office screens and APIs all ask the same question, and a second evaluator anywhere means two
        answers that diverge silently.

        **The reason is part of the answer, not a log line.** 3.3.38 wants access investigations to be
        reportable, and an investigation into a denial needs to know *which condition failed* — a bare
        DENY sends somebody to read forty policies by hand.

        **Offline is a different operation on purpose.** 3.3.30 wants local evaluation when offline, and
        that is `getAccessPolicyBundle` plus a device-side evaluator — not this call with a longer
        timeout. A gate that waits for the network is a gate that stops working when the network does.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: primary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessContext'
      responses:
        '200':
          description: The decision, with its reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
  /access-policies/bundle:
    get:
      operationId: getAccessPolicyBundle
      summary: The policies a device needs to decide for itself
      description: '3.3.28 and 3.3.30. **Caching and offline evaluation are the same mechanism at two
        durations.** A signed, versioned bundle of the policies relevant to this device and scope, with a
        validity window — so a turnstile that loses the network keeps deciding, and stops deciding when
        the bundle expires rather than drifting indefinitely.

        **Expiry is the safety property.** A cached policy with no end date is a policy that outlives its
        own revocation.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      parameters:
      - name: deviceId
        in: query
        schema:
          type: string
          format: uuid
      - name: scopePath
        in: query
        schema:
          type: string
      responses:
        '200':
          description: The bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyBundle'
  /access-policy-templates:
    get:
      operationId: listAccessPolicyTemplates
      summary: Reusable policy shapes
      description: '3.3.23. **A template is where the platform''s own experience lives.** *Shift-hours
        only*, *venue-local staff*, *capacity-gated entry* are policies every venue writes, and writing
        them forty times is forty chances to get the condition backwards.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessPolicy'
  /access-policies/{policyId}/history:
    parameters:
    - name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listAccessPolicyHistory
      summary: Every version, who changed it and why
      description: '3.3.36 and 3.3.39. **Policy changes and access decisions are two different audits**
        and this is the first. Conflating them makes the common question — *who widened this and when* —
        a search through millions of decision records.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessPolicyVersion'
  /access-decisions/audit:
    get:
      operationId: listAccessDecisions
      summary: What was decided, for whom, where and why
      description: '3.3.37 and 3.3.38. **The second audit: decisions, not policy edits.** An access
        investigation starts from a person, a door and a time, and needs the decision, the policy version
        that produced it and the attribute values it saw — because *the policy says permit* and *the
        policy saw a stale attribute* look identical without the third.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: principalId
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: effect
        in: query
        schema:
          type: string
          enum:
          - permit
          - deny
      responses:
        '200':
          description: Decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessDecision'
  /access-overrides:
    post:
      operationId: createEmergencyAccessOverride
      summary: Bypass the policy, loudly
      description: '3.3.6. *"Authorized users may temporarily bypass restrictions with full audit
        logging."*

        **The override is time-boxed at creation and cannot be open-ended.** An emergency bypass with no
        expiry is how a fire-drill exception becomes a permanent hole nobody remembers opening.

        Raises an alert as well as an audit record. **An override nobody is told about is
        indistinguishable from a breach**, which is the situation an emergency override is supposed to
        prevent.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - expiresAt
              - scopePath
              properties:
                principalId:
                  type: string
                  format: uuid
                  nullable: true
                scopePath:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                reason:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Granted, logged and alerted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyAccessOverride'

components:
  schemas:
    AccessPolicy:
      type: object
      x-ticvai-persistence: identity.access_policy
      description: '3.3. **Conditions and an effect, evaluated by one engine.** A role says who you are;
        a policy says under what circumstances that is enough.

        '
      required:
      - code
      - name
      - effect
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        isTemplate:
          type: boolean
          default: false
        permissions:
          type: array
          items:
            type: string
          description: '**Which permissions this policy speaks to.** A policy with an empty list speaks
            to all of them, which is powerful enough that it is worth being explicit about.

            '
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AccessCondition'
        combining:
          type: string
          enum:
          - allMustMatch
          - anyMayMatch
          default: allMustMatch
        effect:
          type: string
          enum:
          - permit
          - deny
          description: '**Deny wins over permit when two policies disagree.** 3.3.32 asks for
            least-privilege, and a permit that can override a deny is not least-privilege by any
            reading — it is the union of every mistake anybody has made.

            '
        priority:
          type: integer
          default: 0
        scopePath:
          type: string
          description: '3.3.40 to 3.3.43. **Tenant, venue and cross-venue policies are one mechanism**,
            because `scope_path` is prefix-comparable — `uae.dubai` contains `uae.dubai.marina` — and
            inheritance is the prefix walk rather than a second table.

            '
        appliesToRoleIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum:
          - draft
          - pendingApproval
          - active
          - suspended
          - retired
        version:
          type: integer
          default: 1
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        delegatedAdminRoleIds:
          type: array
          items:
            type: string
            format: uuid
          description: '3.3.35. **Who may edit this policy without being a platform administrator.** A
            venue manager tuning their own opening-hours rule should not need someone who can edit every
            tenant''s.

            '
    AccessCondition:
      type: object
      description: '**One attribute, one operator, one value** — and the attribute names are an enum
        rather than free text, because a policy that reads `venu.type` silently never matches.

        The enum is the matrix, row by row: user (3.3.7), employee (3.3.8), membership (3.3.9),
        accreditation (3.3.10), customer segment (3.3.11), resource classification (3.3.12), venue
        (3.3.13), attraction (3.3.14), device (3.3.15), day of week (3.3.16), season (3.3.17), event
        (3.3.18), capacity (3.3.19), occupancy (3.3.20), risk score (3.3.21), location (3.3.2) and time
        (3.3.3).

        '
      required:
      - attribute
      - operator
      properties:
        attribute:
          type: string
          enum:
          - user.attribute
          - employee.attribute
          - employee.onShift
          - membership.tier
          - membership.status
          - accreditation.type
          - accreditation.status
          - customer.segment
          - resource.classification
          - venue.attribute
          - venue.id
          - attraction.attribute
          - device.kind
          - device.id
          - device.trusted
          - time.ofDay
          - time.dayOfWeek
          - time.season
          - time.withinOperatingHours
          - event.id
          - event.status
          - capacity.utilisationPercent
          - occupancy.level
          - risk.score
          - ticket.status
          - location.scopePath
        key:
          type: string
          nullable: true
          description: For the `*.attribute` forms — which attribute, by code.
        operator:
          type: string
          enum:
          - equals
          - notEquals
          - in
          - notIn
          - greaterThan
          - lessThan
          - between
          - contains
          - startsWith
          - exists
        value:
          nullable: true
        values:
          type: array
          items:
            type: string
    AccessContext:
      type: object
      description: '**Everything the decision is allowed to depend on.** Stated as one object so a
        simulation and a live decision see the same shape — a simulator that takes different inputs from
        the evaluator is testing something else.

        '
      properties:
        principalId:
          type: string
          format: uuid
          nullable: true
        subjectId:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
        scopePath:
          type: string
        venueId:
          type: string
          format: uuid
          nullable: true
        attractionId:
          type: string
          format: uuid
          nullable: true
        deviceId:
          type: string
          format: uuid
          nullable: true
        eventId:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time
          nullable: true
        attributes:
          type: object
          additionalProperties: true
          description: '**Supplied attributes are a fallback, not the source.** The evaluator resolves
            what it can itself; a caller that could assert its own membership tier could assert any
            membership tier.

            '
    AccessDecision:
      type: object
      x-ticvai-persistence: identity.access_decision
      description: '3.3.37. **The decision, the policy version behind it, and the attribute values it
        actually saw.** The third is what separates *the policy is wrong* from *the data was stale*.

        '
      properties:
        id:
          type: string
          format: uuid
        effect:
          type: string
          enum:
          - permit
          - deny
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          enum:
          - central
          - deviceBundle
          description: 3.3.29 against 3.3.30 — which evaluator answered.
        principalId:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
        scopePath:
          type: string
        matchedPolicies:
          type: array
          items:
            type: object
            properties:
              policyId:
                type: string
                format: uuid
              version:
                type: integer
              effect:
                type: string
              matched:
                type: boolean
              failedCondition:
                type: string
                nullable: true
        observedAttributes:
          type: object
          additionalProperties: true
        overrideId:
          type: string
          format: uuid
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        scopePathIndex:
          type: string
    AccessPolicyBundle:
      type: object
      description: '3.3.28 and 3.3.30. **Signed, versioned and time-boxed**, so an offline gate decides
        correctly and then stops rather than drifting.

        '
      properties:
        bundleId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        policies:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicy'
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string
    AccessPolicyVersion:
      type: object
      x-ticvai-persistence: identity.access_policy_version
      description: '3.3.36 and 3.3.39. **Who changed what, from what, and why.**'
      properties:
        policyId:
          type: string
          format: uuid
        version:
          type: integer
        changedBy:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        approvedBy:
          type: string
          format: uuid
          nullable: true
        previous:
          $ref: '#/components/schemas/AccessPolicy'
        current:
          $ref: '#/components/schemas/AccessPolicy'
        scopePath:
          type: string
    EmergencyAccessOverride:
      type: object
      x-ticvai-persistence: identity.access_override
      description: '3.3.6. **Time-boxed at creation, alerted as well as logged.**'
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        permissions:
          type: array
          items:
            type: string
        reason:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        alertedTo:
          type: array
          items:
            type: string
            format: uuid
    GuestSession:
      x-ticvai-persistence: none — Redis session registry
      type: object
      required:
      - subjectId
      - tokens
      - isVerified
      - expiresAt
      properties:
        subjectId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        tokens:
          $ref: '#/components/schemas/TokenPair'
        isVerified:
          type: boolean
          description: 'False until an OTP or a verified provider identity confirms ownership. An unverified
            account may browse but not transact: the guest web and app send it to sign-in before the cart,
            and `checkoutCart` refuses it. UAE Pass returns a verified identity, so it starts true. Rule on
            `verifyGuestEmail`, decided 17 September 2026.

            '
        identityProviders:
          type: array
          description: Linked providers. Several may resolve to one account.
          items:
            type: string
            enum:
            - password
            - otp
            - apple
            - google
            - uaePass
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells (ADR-0010).
        homeCellName:
          type: string
          nullable: true
        preferredLanguage:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          description: 'Longer lived than a staff session. No single-session rule — a guest may be signed
            in on a phone and a laptop at once.

            '
    PasswordPolicy:
      type: object
      x-ticvai-persistence: identity.password_policy
      description: 'BL-144. **Settled-lane and never written.** No password policy, no lockout, no forced
        change at first logon anywhere in the package.

        **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition, and forced rotation
        on a schedule makes passwords worse — people increment a digit. Rotation is here because some
        tenants are contractually required to have it, **not because it helps.**

        '
      required:
      - id
      - scopePath
      - minLength
      properties:
        id:
          type: string
          format: uuid
        scopePath:
          type: string
        minLength:
          type: integer
          default: 12
        requireBreachCheck:
          type: boolean
          default: true
          description: '**The single most effective rule.** Refusing a password known to be breached stops
            more account takeovers than every composition rule combined.

            '
        maxAgeDays:
          type: integer
          nullable: true
          description: '**Null is the recommended value.** Forced rotation produces `Summer2026!` becoming
            `Summer2027!`, and it is offered because some tenants are contractually obliged to have it
            rather than because it works.

            '
        recoveryMethods:
          type: array
          description: 'BL-132. **A guest locked out had no path back** — lockout existed and recovery
            did not, which turns a forgotten password into a support call.

            **Ordered by strength, and the venue chooses which it offers.** Email is weakest and universal;
            a verified phone is stronger; an in-person check at a desk is strongest and only available
            to a guest who is already at the venue.

            '
          items:
            type: string
            enum:
            - email
            - sms
            - securityQuestions
            - inPersonVerification
            - supportAssisted
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: 'BL-145. **Null, and that is the decision.** ADR-0004 makes a session a token with
            a validity window and no server-side registry, so counting concurrent sessions would mean
            adding one — **a stateful check on a deliberately stateless design.**

            The requirement asked for it configurable. **Configurable to null is still an answer**, and
            the contradiction is recorded rather than resolved by quietly building a session table.

            '
        deviceRestriction:
          type: object
          nullable: true
          description: 'BL-146. **Device, browser, IP and location restriction on access.** Applies to
            staff principals, not guests — a guest restricted to one device is a guest who cannot use
            their new phone.

            **Warn before block by default.** An IP restriction that blocks silently is a venue manager
            locked out on the day their ISP rotates an address.

            '
          properties:
            allowedIpRanges:
              type: array
              items:
                type: string
            allowedCountries:
              type: array
              items:
                type: string
            requireRegisteredDevice:
              type: boolean
              default: false
            onViolation:
              type: string
              enum:
              - warn
              - requireStepUp
              - block
              default: requireStepUp
        lockoutAfterAttempts:
          type: integer
          default: 10
        lockoutMinutes:
          type: integer
          default: 15
          description: '**A temporary lockout, not a permanent one.** Permanent lockout on failed attempts
            is a denial-of-service anybody can run against a known username.

            '
        forceChangeOnFirstLogon:
          type: boolean
          default: true
        reusePreventionCount:
          type: integer
          default: 5
        mfaRequiredForPermissions:
          type: array
          description: '**Step-up rather than blanket MFA.** Requiring it for a refund approval and not
            for reading a rota is what stops people sharing devices to avoid it.

            '
          items:
            type: string
    SegregationRule:
      type: object
      x-ticvai-persistence: identity.segregation_rule
      description: 'BL-147, 3.3.31 and 11.1.24. **The package enforced segregation of duties in exactly
        one place** — the product lifecycle guard requiring the approver not be the author — and there
        was no general rule.

        **A conflict is between two permissions held by one principal**, and the check runs at grant time
        rather than at use time: **discovering the conflict when somebody exercises it means the conflict
        already existed.**

        '
      required:
      - id
      - permissionA
      - permissionB
      - severity
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        severity:
          type: string
          enum:
          - block
          - requireApproval
          - warn
        rationale:
          type: string
          description: '**Why these two conflict, in words an auditor reads.** A rule with no rationale
            is a rule somebody removes when it becomes inconvenient.

            '
        allowWithCompensatingControl:
          type: boolean
          default: false
          description: '**A small venue cannot always separate duties**, and pretending otherwise means
            the rule gets disabled entirely. A named compensating control is better than no rule.

            '
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    RegisterGuestRequest:
      type: object
      required:
      - identifier
      - channel
      properties:
        identifier:
          type: string
          maxLength: 256
          description: Email address or mobile number in E.164.
        channel:
          type: string
          enum:
          - email
          - sms
          - whatsapp
        displayName:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: Optional. OTP-only accounts are supported and are the default.
        preferredLanguage:
          type: string
          pattern: ^[a-z]{2}$
        consents:
          type: array
          description: Consent captured at registration, recorded with the notice version.
          items:
            type: object
            properties:
              purpose:
                type: string
              granted:
                type: boolean
              noticeVersion:
                type: string
    SsoProtocol:
      type: string
      enum:
      - oidc
      - saml2
    SsoProvider:
      x-ticvai-persistence: identity.sso_provider
      type: object
      required:
      - id
      - displayName
      - protocol
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        protocol:
          $ref: '#/components/schemas/SsoProtocol'
        iconAssetRef:
          type: string
          nullable: true
        isEnforced:
          type: boolean
          description: True disables password login for principals covered by this provider.
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    SsoGroupMapping:
      x-ticvai-persistence: identity.sso_group_mapping
      type: object
      required:
      - externalGroup
      - roleId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The table had no key at all — the response returned the external
            group, the role and the scope, which is everything a caller needs and not the row own identity.

            **(provider, external_group) is unique and would serve**, but a mapping is edited and revoked
            by an administrator, and **a row addressed by the values it holds cannot be corrected** —
            changing the group means deleting a mapping and creating another, which loses who granted
            it and when.

            '
        externalGroup:
          type: string
        roleId:
          type: string
          format: uuid
        scopePath:
          type: string
          description: Scope the mapped role is granted at.
    SsoProviderConfig:
      x-ticvai-persistence: identity.sso_provider
      type: object
      required:
      - id
      - displayName
      - protocol
      - groupMappings
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        protocol:
          $ref: '#/components/schemas/SsoProtocol'
        metadataUrl:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
        clientSecretRef:
          type: string
          nullable: true
          description: Key vault reference. The secret itself is never returned.
        groupMappings:
          type: array
          minItems: 1
          description: '**A group with no mapping grants nothing.** No default role, ever — otherwise
            the identity provider becomes a way to mint access nobody configured.

            '
          items:
            $ref: '#/components/schemas/SsoGroupMapping'
        autoProvisionPrincipals:
          type: boolean
          default: false
          description: Create a principal on first successful sign-in.
        isEnforced:
          type: boolean
          default: false
        isActive:
          type: boolean
    MfaKind:
      type: string
      enum:
      - totp
      - smsOtp
      - emailOtp
      - biometric
      - hardwareToken
    MfaMethod:
      x-ticvai-persistence: identity.mfa_method
      type: object
      required:
      - id
      - kind
      - isActive
      - enrolledAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MfaKind'
        label:
          type: string
          nullable: true
        maskedTarget:
          type: string
          nullable: true
          description: Partially masked destination, so a person can tell two methods apart.
        isActive:
          type: boolean
        isPrimary:
          type: boolean
        enrolledAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    MfaEnrolment:
      x-ticvai-persistence: none — transient
      type: object
      required:
      - methodId
      - kind
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The table had no key at all — no id, no parent and no natural
            key, so **no row could be addressed, updated or deleted.** The response schema returned everything
            a caller needs and not the row''s own identity, which is the difference between an API response
            and a table.

            '
        methodId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MfaKind'
        secret:
          type: string
          nullable: true
          description: TOTP shared secret. Returned once, at enrolment, and never again.
        qrCodeUri:
          type: string
          nullable: true
        recoveryCodes:
          type: array
          description: Returned once on successful verification. Not retrievable afterwards.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    SessionStatus:
      type: string
      description: >
        **The life of one signed-in session, which is not the life of a shift.** A shift holds the
        float and survives a break; a session holds the person and does not. `ShiftStatus.suspended`
        is where a break lives — *break cover; float intact, workstation released* — and the release
        of the workstation is exactly why the session ends rather than pausing: the next person
        opens their own.

        **One principal, one active session per workstation.** Enforced by the `ActiveSession`
        registry rather than by a state, because it is a fact about the set of sessions and not
        about any one of them.
      enum:
        - active            # signed in and working; the only non-terminal state
        - signedOut         # the principal ended it themselves
        - terminated        # a supervisor ended an abandoned session somebody else needed
        - expired           # idle past the timeout; the registry dropped it and freed the workstation

    ActiveSession:
      x-ticvai-persistence: none — Redis session registry
      type: object
      required:
      - sessionId
      - principalId
      - status
      - startedAt
      - lastSeenAt
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/SessionStatus'
          description: >
            **A registry that only holds live sessions cannot answer why one ended.** Kept on the
            record so a supervisor asking *what happened to till 4* gets `terminated` or `expired`
            rather than an absence.
        sessionId:
          type: string
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
        roleId:
          type: string
          format: uuid
          nullable: true
        roleName:
          type: string
          nullable: true
        workstationId:
          type: string
          format: uuid
          nullable: true
        workstationName:
          type: string
          nullable: true
        venueId:
          type: string
          format: uuid
          nullable: true
        ipAddress:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        hasOpenShift:
          type: boolean
          description: Revoking this session leaves cash unreconciled.
        mfaSatisfied:
          type: boolean
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    Principal:
      x-ticvai-persistence: identity.principal
      type: object
      required:
      - id
      - username
      - displayName
      - isActive
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        isActive:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
          description: Past this, resolution returns DENY regardless of grants.
        primaryRoleId:
          type: string
          format: uuid
          nullable: true
          description: 'Determines the landing screen when the principal holds several roles and picks
            one at login.

            '
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    CreatePrincipalRequest:
      type: object
      required:
      - username
      - displayName
      properties:
        username:
          type: string
          maxLength: 256
        displayName:
          type: string
          maxLength: 200
        initialCredential:
          type: string
          maxLength: 512
        mustChangeCredential:
          type: boolean
          default: true
        validTo:
          type: string
          format: date-time
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    Role:
      x-ticvai-persistence: identity.role
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: '**A role that grants no permissions is not a role.** `Role` carried a code, a
            name and two counts until 18 August, and `identity.role_permission` derived from it with exactly
            one column — `role_id`. **A join table that joins to nothing**, found by Hrushikant in review
            and missed by the schema audit that ran the same day.

            **The audit asked whether every table had columns, a relationship and an owner, and this table
            had all three.** What it did not ask is whether a table with one column can do the job its
            name claims.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
        inheritsFromRoleId:
          type: string
          format: uuid
          nullable: true
          description: '**Role composition, one level deep and no deeper.** A supervisor role that is
            a cashier plus three permissions is how venues actually describe them.

            **Cycles are refused and depth is capped at one**, because a permission set nobody can read
            off the screen is a permission set nobody audits.

            '
        isSystem:
          type: boolean
          default: false
          description: '**Seeded roles ship and are editable; deleting one is refused.** A venue that
            removes `cashier` and rebuilds it has two roles with one name in the audit log.

            '
        principalCount:
          type: integer
        grantCount:
          type: integer
    RolePermission:
      x-ticvai-persistence: identity.role_permission
      type: object
      description: '**The grant is a row, not a value in an array.** Raised again in review on 24 August:
        `identity.role_permission` held `role_id` and `permission` and nothing else — **no record of who
        granted a permission or when.**

        Hrushikant found the first half on 18 August, when the table had one column. **The fix added the
        permission and stopped**, which is how a half-repair survives: the table now joined, so nothing
        looked wrong.

        **A permission grant is the most audited act in the platform** and it was the one write with no
        audit trail. `listAuditRecords` was built on 20 August because `platform.audit_record` was written
        by nothing — this is the other end of the same gap.

        '
      required:
      - roleId
      - permission
      properties:
        roleId:
          type: string
          format: uuid
        permission:
          $ref: ../shared/permissions.yaml#/components/schemas/Permission
        grantedAt:
          type: string
          format: date-time
        grantedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**Null for a system role.** A seeded role is granted by the platform and naming
            a person there would be a fiction.

            '
        isActive:
          type: boolean
          default: true
          description: '**Revoked rather than deleted.** A permission that vanishes from the table takes
            its history with it, and *who could do this last Tuesday* is the question an incident asks.

            '
    DelegatedAccess:
      x-ticvai-persistence: identity.delegated_access
      type: object
      required:
      - id
      - permission
      - scopePath
      - effect
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: string
          format: uuid
          nullable: true
        permission:
          type: string
          description: From the permission enum. `*` permitted on DENY only.
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'CF-132, CL-05. **A grant held by a guest rather than a staff principal.**

            Section 5.5 asks for portfolios — a primary holder assigning entitlements, transfer between
            linked accounts, shared wallets with individual tracking — and it appears ten times across
            ten sections. **Every one of those reduces to the same question: who may act on whose behalf,
            over what, and until when.**

            **That is a grant, not a household table.** A primary holder assigning an entitlement is a
            grant. A group leader holding tickets for twelve is a grant. A corporate account enrolling
            members is a grant with a quota. **A shared wallet with individual tracking is a grant over
            a balance, and the transaction log already records who spent.**

            **A household table would answer one of those four.**

            '
        overSubjectId:
          type: string
          format: uuid
          nullable: true
          description: 'Whose behalf. **Null for a staff grant, which is the existing behaviour** — every
            grant written before 18 August means exactly what it meant before.

            '
        overObjectRef:
          type: string
          nullable: true
          description: '**Where the authority is over a thing rather than a scope** — a wallet, an entitlement,
            a booking. `scopePath` answers *where*; this answers *what*, and a guest''s authority is almost
            always over a specific object rather than a branch of the tree.

            '
        delegationKind:
          type: string
          nullable: true
          enum:
          - primaryHolder
          - familyMember
          - groupLeader
          - attendee
          - corporateAdmin
          - corporateMember
          - carer
          description: '**What kind of relationship this expresses**, for display and for reporting. The
            mechanism does not branch on it — a family member and a group attendee are the same grant
            with different words around them, which is the point.

            '
        quota:
          type: integer
          nullable: true
          description: '2.14.15 and 4.3.11. **How many the holder may assign.** A corporate account with
            fifty allocations and a family with four are the same structure with different numbers.

            '
        isRevocableBySubject:
          type: boolean
          default: true
          description: '**Whether the person it is over can end it.** A guest who linked a family member
            should be able to unlink them; a corporate member should not be able to revoke their employer''s
            oversight — and **a delegation nobody can end is a delegation somebody will regret.**

            '
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        createdByPrincipalId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateGrantRequest:
      type: object
      required:
      - permission
      - scopePath
      - effect
      properties:
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        permission:
          type: string
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - username
      - credential
      - workstationId
      properties:
        username:
          type: string
          maxLength: 256
        credential:
          type: string
          description: 'Password, PIN, card token or RFID token depending on `method`.

            '
          maxLength: 512
        method:
          type: string
          description: '**`pin` is how a till is actually used.** A cashier signs in at a shared
            terminal between guests, and a password on a touchscreen with somebody waiting is a
            password that gets shortened, shared or written on the drawer. The employee number
            goes in `username` and the PIN in `credential`, so the shape of the request does not
            change — only what the operator types.


            **A PIN is weaker than a password and the difference is bounded by the device, not by
            the secret.** `workstationId` is required on every login and is *NOT a permission
            source*: it says which till, and the till is on a venue network in a staff area. A PIN
            is a reasonable credential there and nowhere else, which is why this is an enum value
            and not a policy flag — a surface that wants it has to ask for it by name.


            Added 10 September 2026 for `POS-000 Sign In`.

            '
          enum:
          - password
          - pin
          - card
          - rfid
          - sso
          default: password
        workstationId:
          type: string
          format: uuid
          description: 'Identifies the device. Determines Sale Board, connected hardware, till identity
            and Access Point inheritance. NOT a permission source.

            '
        deviceFingerprint:
          type: string
          maxLength: 256
    LoginResponse:
      x-ticvai-persistence: none — computed
      allOf:
      - $ref: '#/components/schemas/TokenPair'
      - type: object
        required:
        - requiresRoleSelection
        properties:
          requiresRoleSelection:
            type: boolean
          availableRoles:
            type: array
            items:
              $ref: '#/components/schemas/RoleSummary'
          session:
            $ref: '#/components/schemas/Session'
    TokenPair:
      x-ticvai-persistence: none — transient
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT carrying `sid`, validated per request against the session registry.
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds
    RoleSummary:
      x-ticvai-persistence: none — projection over role
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        isPrimary:
          type: boolean
    Session:
      type: object
      required:
      - sessionId
      - principalId
      - roleId
      - scope
      - effectivePermissions
      - saleBoardId
      properties:
        sessionId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        displayName:
          type: string
        scope:
          type: array
          description: 'Scope nodes this session may act within, resolved once at login from the ltree
            hierarchy with deny-overrides-allow. Clients filter navigation against this — they never compute
            it.

            '
          items:
            $ref: ../shared/common.yaml#/components/schemas/ScopeRef
        effectivePermissions:
          allOf:
          - $ref: ../shared/permissions.yaml#/components/schemas/PermissionSet
          description: 'Flattened set across all granted scopes, after deny resolution. Convenience for
            coarse checks. Anything scope-sensitive must use `permissionsByScope`.

            '
        permissionsByScope:
          type: array
          description: 'Permissions effective at each granted scope path. Clients filter navigation on
            this and never compute permissions themselves.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/ScopedPermissions
        saleBoardId:
          type: string
          format: uuid
          description: 'Landing surface, derived from the WORKSTATION, not the role (12 Aug 2026 §3).
            Ticketing, F&B or Retail board.

            '
        workstation:
          $ref: '#/components/schemas/WorkstationContext'
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    WorkstationContext:
      type: object
      required:
      - id
      - code
      - venueId
      - regionId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        venueId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        accessPointId:
          type: string
          format: uuid
          description: Inherited from the workstation, never selected by the operator.
        devices:
          type: array
          items:
            type: object
            required:
            - kind
            - driver
            properties:
              kind:
                type: string
                enum:
                - receiptPrinter
                - ticketPrinter
                - cashDrawer
                - barcodeScanner
                - rfidReader
                - paymentTerminal
                - customerDisplay
              driver:
                type: string
              identifier:
                type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
        timezone:
          type: string
        cellName:
          type: string
          description: 'The cell serving this workstation''s region. One cell per tenant per region (ADR-0014).
            A client uses this only for diagnostics and telemetry tagging — never for routing, which the
            Control Plane resolves.

            '
        deploymentProfile:
          type: string
          enum:
          - terminalLocal
          - venueEdge
          - thin
          description: 'Whether this surface reads catalogue locally (ADR-0013). Determines which flows
            the client enables offline.

            '
