      x-ticvai-consumed-by:
        - "P10 PTR-020 Sub-Agent Management"
      x-ticvai-audience:
      - staff
      - partner
      summary: Assign a grant
      description: 'Resolution is deny-overrides-allow. A DENY at any node suppresses the permission at
        that node and everything beneath it, and is never overridden by a more specific ALLOW — so a deny
        is a guarantee rather than a default.

        Wildcard is permitted on DENY only. A wildcard allow is an accident waiting to happen.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_GRANT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
