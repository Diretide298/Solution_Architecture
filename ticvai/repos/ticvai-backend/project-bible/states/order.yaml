# Order — state model
# Contract: orders.OrderStatus
# Checked by tools/check-states.py against the contract enum and the event catalogue.

entity: Order
contract: orders
enum: OrderStatus
enumKind: named
enumSchema: OrderStatus
owner: orders
initial:
- pending
terminal:
- voided
- refunded
- failed
transitions:
- from: pending
  to: held
  operation: holdOrder
  trigger: operation
  guard: Not yet paid. Holds no inventory — a parked sale that reserved capacity would let a queue of
    parked sales exhaust a session
- from: held
  to: pending
  operation: resumeOrder
  trigger: operation
  guard: Hold not expired. Prices re-evaluated; any change is surfaced rather than applied silently
- from: held
  to: voided
  trigger: timer
  guard: Hold expired. A till that accumulates parked sales cannot be closed. Expired is `Order.heldUntil` passed,
    which is holdOrder's `holdUntil` or, when the cashier sent none, the venue's next business-day cut-off
    (VenueSettings.businessDayCutoff, CHG-R6-032), so a parked sale nobody comes back for still lapses (ADAM CR-084,
    CHG-GDL-003)
  emits:
  - order.lapsed
- from: pending
  to: paid
  operation: createPayment
  trigger: operation
  guard: Payment captured in full
  emits:
  - order.paid
- from: pending
  to: partiallyPaid
  operation: createPayment
  trigger: operation
  guard: Split payment, balance outstanding
- from: partiallyPaid
  to: paid
  operation: createPayment
  trigger: operation
  guard: Balance settled
  emits:
  - order.paid
- from: pending
  to: failed
  operation: createPayment
  trigger: operation
  guard: Declined and not retried
  emits:
  - order.lapsed
- from: paid
  to: completed
  trigger: job
  guard: Entitlements issued and fulfilment recorded
  emits:
  - order.completed
- from: pending
  to: voided
  operation: voidOrder
  trigger: operation
  guard: Nothing captured. A void before payment is not a refund and must not post one
  emits:
  - order.cancelled
- from: pending
  to: voided
  trigger: timer
  guard: 'Payment window passed with nothing captured (ADAM CR-084, CHG-GDL-003). The window is the one the order''s
    capacity is already held for: the latest `expiresAt` of the holds checkout carried over to the order (set by the
    narrowest ReservationHoldPolicy where one matches, else VenueSettings.cartLeaseSeconds, default 900 seconds, audit
    R169; extended only by extendCart), or, for an order that holds no capacity, `createdAt` plus
    VenueSettings.cartLeaseSeconds. An order with an active payment link lapses when the link expires
    (PaymentLink.expiresAt) instead. Never while a payment against it is pendingConfirmation (inquirePaymentStatus may
    still capture it). MoM 1 Sep 4.11 releases the hold to inventory when payment is not completed; the order now
    lapses with it, so an abandoned checkout stops blocking the guest''s erasure'
  emits:
  - order.lapsed
- from: paid
  to: refunded
  operation: createRefund
  trigger: operation
  guard: Full value returned
  isReversal: true
  requiresApproval: true
  emits:
  - order.refunded
- from: completed
  to: refunded
  operation: createRefund
  trigger: operation
  guard: Full value returned after fulfilment
  isReversal: true
  requiresApproval: true
  emits:
  - order.refunded
- from: paid
  to: partiallyRefunded
  operation: createRefund
  trigger: operation
  guard: Partial value returned
  isReversal: true
  requiresApproval: true
  # order.refunded's emittedWhen already says partiallyRefunded; the emit was missing (CHG-GDL-003, E-UNFED).
  emits:
  - order.refunded
- from: completed
  to: partiallyRefunded
  operation: createRefund
  trigger: operation
  guard: Partial value returned after fulfilment
  isReversal: true
  requiresApproval: true
  emits:
  - order.refunded
- from: partiallyRefunded
  to: refunded
  operation: createRefund
  trigger: operation
  guard: Remaining value returned
  isReversal: true
  requiresApproval: true
notes: '**held → refunded is not a transition.** A parked sale was never paid, so there is nothing to
  return. The enum permits it and the business does not, which is the defect this file exists to catch.'
offlineReachable:
- pending
- held
- paid
