# Incident — state model
# Contract: maintenance.IncidentStatus
# Checked by tools/check-states.py, and by tools/check-business-rules.py (BR-INCIDENT).
#
# The flow decided by Chinmay on 3 October 2026 (Block A business rules; CHG-RUL-011;
# docs/active/decisions/answers-3-october-business-rules.md): Reported > Investigating > Escalated (optional)
# > Closed; reopen to Investigating with a reason; every change logged. Investigating is `underInvestigation`.
# Escalated is `underInvestigation` with `Incident.escalation` set (updateIncident `escalate`), so the
# status values clients built at r1 switch on are unchanged (no response enum value added).

entity: Incident
contract: maintenance
enum: IncidentStatus
enumKind: named
enumSchema: IncidentStatus
owner: maintenance
initial:
- reported
# **Legacy only.** `actionRequired` is no longer entered (3 October flow). It stays in the contract enum so a
# client built at r1 still parses a row written before; such a row starts here and leaves by the two
# transitions below. Listed as initial because nothing moves a record into it any more.
- actionRequired
# **No terminal state, by design** (3 October): a closed incident can be reopened with a reason.
terminal: []
transitions:
- from: reported
  to: underInvestigation
  operation: updateIncident
  trigger: operation
  guard: Someone took it
- from: underInvestigation
  to: closed
  operation: updateIncident
  trigger: operation
  guard: '**Closed with findings.** A closed incident with no findings is a lesson nobody learned. An escalated
    incident closes the same way; the escalation is kept on the logged rows'
  requiresApproval: true
- from: reported
  to: closed
  operation: updateIncident
  trigger: operation
  guard: Duplicate or reported in error, with a reason
  requiresApproval: true
- from: closed
  to: underInvestigation
  operation: updateIncident
  trigger: operation
  guard: '**Reopen, with a reason** (3 October). Logged as a reopen row; `reopenCount` goes up'
- from: actionRequired
  to: underInvestigation
  operation: updateIncident
  trigger: operation
  guard: A legacy row back under investigation
- from: actionRequired
  to: closed
  operation: updateIncident
  trigger: operation
  guard: A legacy row closed with findings
  requiresApproval: true
notes: 'Escalation is not a status: it is `escalation` on an incident under investigation, set by updateIncident
  `escalate` and logged as a note row (CHG-RUL-011). Every status change, escalation and reopen appends a row to
  `IncidentDetail.investigationNotes` with the status before and after and the reason. A recurring incident that
  is a new event is still a new incident with a link to the old one; reopening is for an incident closed too soon.'
