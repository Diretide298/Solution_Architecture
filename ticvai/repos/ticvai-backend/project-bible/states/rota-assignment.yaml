# Rota assignment — state model
# Contract: workforce.RotaStatus
# Checked by tools/check-states.py.

entity: Rota assignment
contract: workforce
enum: RotaStatus
enumKind: named
enumSchema: RotaStatus
owner: workforce
initial:
- planned
terminal:
- cancelled
- completed
- noShow
transitions:
- from: planned
  to: published
  operation: createRotaAssignment
  trigger: operation
  guard: Visible to the person rostered. **Until published it is a plan, not a commitment**
- from: planned
  to: published
  operation: updateRotaAssignment
  trigger: operation
  guard: Published by a PATCH of its status (ADAM CR-315). Visible to the person rostered from then on
- from: published
  to: confirmed
  operation: updateRotaAssignment
  trigger: operation
  guard: The person acknowledged it
- from: published
  to: swapPending
  operation: requestShiftSwap
  trigger: operation
  guard: A swap was asked for. Both parties, then the supervisor
- from: confirmed
  to: swapPending
  operation: requestShiftSwap
  trigger: operation
  guard: A swap was asked for after the person confirmed. Same role, same venue, and a supervisor
    approves before it takes effect (audit R129 (6))
- from: swapPending
  to: published
  trigger: cascade
  guard: Swap rejected or withdrawn (the shift swap reaching rejected or withdrawn) — the original assignment stands.
    Not requestShiftSwap, whose 409 refuses a swapPending assignment (r10 ruling on check-state-refusals, the lead, 25 October 2026; CHG-R10ORD-020)
  isReversal: true
- from: swapPending
  to: cancelled
  operation: updateRotaAssignment
  trigger: operation
  guard: Swap approved. A new assignment replaces this one
- from: confirmed
  to: completed
  trigger: cascade
  guard: A clock-out matched the assignment
- from: confirmed
  to: noShow
  trigger: timer
  guard: '**Nobody clocked in.** The gap between the rota and attendance, which is the whole operational
    value of having both'
- from: published
  to: noShow
  trigger: timer
  guard: Never confirmed and never attended
- from: planned
  to: cancelled
  operation: updateRotaAssignment
  trigger: operation
  guard: Removed before publication
- from: published
  to: cancelled
  operation: updateRotaAssignment
  trigger: operation
  guard: Cancelled after publication. The person is told
notes: '`noShow` is computed rather than set. An operator cannot forget to mark it, which is the point
  — a venue with only a rota believes it is fully staffed every day.'
