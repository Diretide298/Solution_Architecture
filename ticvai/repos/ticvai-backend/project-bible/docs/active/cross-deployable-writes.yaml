# Cross-deployable writes: the kernel grants and the dated exceptions. AUTHORED: a person writes every entry.
#
# DB-ROLES (docs/active/block-a-extra-tasks.json) gives each deployable's PostgreSQL role DML only on the schemas
# its own modules own (handoff/service-decomposition.json, ADR-0055). A write into another deployable's schema made
# with the caller's own SQL is therefore refused at runtime. ADR-0055 rule 4 says how it travels instead: by event
# (ADR-0057, events/) consumed by the owning module, or by a call to the owner's published HTTP operation. The
# operation states its route as `x-ticvai-write-via` in its contract, and tools/derive-lineage.py copies it into
# handoff/api-data-lineage.json as `writeVia` (ADAM CR-002, decided by Chinmay on 12 October 2026, CHG-R6-020).
#
# This file holds the two things that are not routed:
#
#   kernel       the shared-kernel tables every host needs, granted to every deployable role directly. Exactly
#                these four; tools/check-cross-deployable-writes.py fails on any other entry or privilege.
#   exceptions   writes that cannot route yet, each with its reason, the date it was added and the release that
#                removes it. The check fails on an unrouted write that is not here, on an entry here for a write
#                that is not cross-deployable or that is also routed, and on an entry whose removal release has
#                been tagged.
#
#   id               XDW-001, XDW-002, ... never reused
#   operation        the operationId that writes
#   table            the table it writes, <schema>.<table>
#   kind             misplaced-table (the table sits in a schema another deployable owns, and its writer is its real
#                    owner: the lead decides between moving it and a table-level grant) or owner-operation-missing
#                    (the owner publishes no operation to call, and an event would carry personal data)
#   reason           why it cannot route yet, and what removes it
#   added            the date the entry was added
#   removal_release  the release that removes it (r<N>); until then DB-ROLES grants the writer's role DML on this
#                    one table
#
# The readable table for the backend developer is handoff/cross-deployable-writes.md, written by
# `python tools/check-cross-deployable-writes.py --write`.

kernel:
- table: platform.outbox
  privileges: [INSERT]
  why: 'Every host writes the events it emits in the same transaction as the change they report (ADR-0033, ADR-0058).'
- table: platform.scope
  privileges: [SELECT]
  why: 'Every host resolves the caller''s scope and its row-level security reads it (ADR-0005). Read only: a write to
    platform.scope from another deployable is not exempt.'
- table: platform.audit_record
  privileges: [INSERT]
  why: 'Every operation that audits itself appends its audit row in its own transaction (CHG-R6-002).'
- table: platform.idempotency_record
  privileges: [SELECT, INSERT, UPDATE]
  why: 'Every host claims, completes and replays an Idempotency-Key in the transaction of the write it guards.'

