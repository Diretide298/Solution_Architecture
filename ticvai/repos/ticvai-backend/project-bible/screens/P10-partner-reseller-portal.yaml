      - kind: secondaryButton
        label: Hold
        operation: holdOrder
        provenance: contract orders.yaml POST /orders/{orderId}/hold
      - kind: secondaryButton
        label: Modify
        operation: modifyOrder
        provenance: contract orders.yaml POST /orders/{orderId}/modify
      - kind: destructiveButton
