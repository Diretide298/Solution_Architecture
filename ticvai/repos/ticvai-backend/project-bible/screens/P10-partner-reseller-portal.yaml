platform:
  code: P10
  audience: partner
  formFactor: web
  shortName: Partner Web
  name: Partner Web — Reseller Portal
  surface: partner
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 51
  app: partner-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: partner device, unmanaged
    networkAssumption: public internet
    releaseCadence: monthly — partners integrate against it
  operator: partner
  wireframeBoard: wireframes/P10 Partner Web.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: ticvai-control
    name: TICVAI Control
    shell: web
    siblings:
    - P09
    - P11
    - P14
    - P17
    note: '**TICVAI operates all five**, whoever signs in. The partner portal, the accreditation intake,
      the developer portal and the sign-up are outward faces of the control plane, not separate products
      — but their users are not TICVAI staff, and the permission model has to hold that line. **P17 added
      11 September 2026**: a prospect buying TICVAI has no tenant and no cell, so the control plane is
      the only thing that can serve them.'
    decided: 10 September 2026
screens:
- id: PTR-001
  name: Partner Login / MFA
  module: Access & Account
  requiresModule: partner
  wave: 2
  capability: C35
  implementation:
    app: partner-web
    route: /general/partner-login-mfa
    component: apps/partner-web/src/routes/general/PartnerLoginMfaList.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    inferred: true
    exitTo:
    - PTR-002
    - PTR-003
    - PTR-004
    - PTR-005
    - PTR-022
    fromFlows: true
    transitions:
    - to: PTR-005
      trigger: Books against the allocation
      provenance: flow F10 step 1→2
      operation: getB2bCredit
    - to: PTR-002
      trigger: Partner Dashboard
      provenance: structural — PTR-001 is P10's home screen and its exits are its launcher
    - to: PTR-003
      trigger: Profile & Company Details
      provenance: structural — PTR-001 is P10's home screen and its exits are its launcher
    - to: PTR-004
      trigger: Notifications
      provenance: structural — PTR-001 is P10's home screen and its exits are its launcher
    - to: SUP-001
      trigger: Agent Login
      provenance: flow F104 step 2→3
      crossesDevice: true
      back: false
    - to: PTR-022
      trigger: Opens the partner command centre
      provenance: flow F110 step 1→2
  notes: States derived from the screen pattern on 17 August, not individually considered — sound for
    a list, a form or a money screen, and worth revisiting where this screen is unusual. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement.
  density: compact
  pattern: listDetail
  patternReason: '`listActiveSessions` reads the population and `getB2bCredit` reads one of them — list,
    select, act'
  purpose: Get someone into the app, fast, on a device that may be shared.
  gaps:
  - operation: getCurrentSession
    why: '**5 declared operations reach no component on this screen**: getCurrentSession, getGuestSession,
      listMfaMethods, listSsoProviders, listPartnerAgreements. Either the screen is missing what calls
      them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every partner login mfa
        bindsTo: ActiveSession
        columns:
        - ActiveSession.sessionId
        - ActiveSession.principalId
        - ActiveSession.principalName
        - ActiveSession.roleId
        - ActiveSession.roleName
        - ActiveSession.workstationId
        - ActiveSession.workstationName
        - ActiveSession.venueId
        - ActiveSession.ipAddress
        - ActiveSession.deviceInfo
        - ActiveSession.hasOpenShift
        - ActiveSession.mfaSatisfied
        operation: listActiveSessions
        provenance: contract identity.yaml GET /auth/sessions
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected partner login mfa
        bindsTo: CreditPosition
        columns:
        - CreditPosition.id
        - CreditPosition.accountId
        - CreditPosition.accountName
        - CreditPosition.creditLimit
        - CreditPosition.used
        - CreditPosition.available
        - CreditPosition.isOverLimit
        - CreditPosition.isSuspended
        - CreditPosition.paymentTermsDays
        - CreditPosition.oldestUnpaidInvoiceAt
        - CreditPosition.daysOverdue
        - CreditPosition.activeOverrides
        - CreditPosition.scopePath
        operation: getB2bCredit
        provenance: contract orders.yaml GET /b2b-accounts/{accountId}/credit
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Login
        operation: login
        provenance: contract identity.yaml POST /auth/login
      - kind: destructiveButton
        label: Force
        operation: forceLogout
        provenance: contract identity.yaml POST /auth/sessions/{sessionId}/force-logout
      - kind: destructiveButton
        label: Override
        operation: overrideCreditLimit
        provenance: contract orders.yaml POST /b2b-accounts/{accountId}/credit/override
      - kind: destructiveButton
        label: Revoke
        operation: revokeAllSessions
        provenance: contract identity.yaml POST /auth/sessions/revoke-all
      - kind: secondaryButton
        label: Save changes
        operation: setB2bCreditLimit
        provenance: contract orders.yaml PUT /b2b-accounts/{accountId}/credit
  overlays:
  - id: confirmForceLogout
    component: confirmDialog
    trigger: Force
    body: '**Names what `forceLogout` changes and what it leaves alone**, in the consequence rather than
      the verb. A partner login mfa this affects should be identified in the dialog, not just counted.'
    provenance: contract identity.yaml POST /auth/sessions/{sessionId}/force-logout
  - id: confirmOverrideCreditLimit
    component: confirmDialog
    trigger: Override
    body: '**Names what `overrideCreditLimit` changes and what it leaves alone**, in the consequence rather
      than the verb. A partner login mfa this affects should be identified in the dialog, not just counted.'
    provenance: contract orders.yaml POST /b2b-accounts/{accountId}/credit/override
  - id: confirmRevokeAllSessions
    component: confirmDialog
    trigger: Revoke
    body: '**Names what `revokeAllSessions` changes and what it leaves alone**, in the consequence rather
      than the verb. A partner login mfa this affects should be identified in the dialog, not just counted.'
    provenance: contract identity.yaml POST /auth/sessions/revoke-all
  states:
    loading: The partner login mfa list.
    error: Could not load. Names which read failed and leaves the partner login mfa untouched.
    emptyFirstRun: No partner login mfa yet. Carries the create action; distinct from a filter that matched
      nothing.
    emptyNoResults: The filter narrowed it and the partner login mfa are still there. Names the active
      filter and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
  apis:
  - operationId: login
    contract: identity
    purpose: from page inventory
    trigger: onLoad
  - operationId: getB2bCredit
    contract: orders
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: forceLogout
    contract: identity
    purpose: Supervisor termination of an abandoned session
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: getGuestSession
    contract: identity
    purpose: Read the current guest session
    trigger: onLoad
  - operationId: listActiveSessions
    contract: identity
    purpose: List active sessions
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  - operationId: overrideCreditLimit
    contract: orders
    purpose: Authorise an order beyond the credit limit
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: revokeAllSessions
    contract: identity
    purpose: Revoke every session in scope
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: setB2bCreditLimit
    contract: orders
    purpose: Set a partner credit limit
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: listPartnerAgreements
    contract: subscription
    purpose: Commercial agreements with B2B partners
    trigger: onLoad
  entryState:
    params:
    - name: accountId
      from: deepLink
    coldEntry: '**A partner link resolves within that partner''s own scope and refuses outside it.** A
      forwarded link between partners must not open another partner''s record. If the target is gone the
      screen says so and offers the partner''s own list. Arrives with `accountId`.'
    preloaded:
    - CreditPosition.id
    - CreditPosition.accountId
    - CreditPosition.accountName
    - CreditPosition.creditLimit
    - CreditPosition.used
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P10 Partner Web.dc.html#ptr-001
  apisNote: Rebuilt 9 September 2026 from the 12 operations this screen declares, not from a workshop
    pack — it has none. Columns are every field the response schema declares, plumbing aside — narrowing
    them to the ones that matter is work a person still owes this screen.
