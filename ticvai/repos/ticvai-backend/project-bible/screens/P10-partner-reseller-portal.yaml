  navigation:
    entryFrom:
    - PTR-032
    exitTo:
    - PTR-032
    inferred: false
    notes: '**Reached from PTR-032, the hub of its workshop board.** Stated on 4 September: the pack groups
      its screens ten to a board behind a command centre, and that grouping is the navigation.'
  density: compact
  pattern: listDetail
  patternReason: '**nothing in the pack chooses a pattern for this screen** — no metric directory, no
    display directory, no configuration directory. It falls to the default, and the fallback is recorded
    rather than passed off as a decision'
  purpose: 'Give management a single consolidated view of the complete commercial relationship with a
    partner. Board 3 manages the day-to-day operational and financial relationship with active B2B, reseller
    and OTA partners. The three boards now form a clean lifecycle: Board 1 — Who is the partner? Onboarding
    → Organization → Users → Territory → Compliance → Permissions → Activation Board 2 — Under what commercial
    terms can they transact? Agreement → Rates → Commission → Credit → Security → Billing → Allocation
    → Limits Board 3 — What happens once the partner starts doing business? Orders → Reservations → Cancellations
    → Statements → Reconciliation → Commission Settlement → Disputes → Performance → Risk → AI Optimization
    A key principle for Board 3 is that it should provide a Partner Operations 360° without rebuilding
    functionality already owned by Orders, Finance, Ticketing, Payment or Channel Management.'
  purposeNote: Management can evaluate the complete commercial relationship, financial exposure, performance
    and upcoming risks from a single Partner Commercial 360 workspace. Board 2 — Final Screen Register
    Screen Backend Screen Primary Responsibility
  gaps:
  - operation: null
    why: '**The pack gives this screen nothing that can be drawn.** Its sections are prose — purpose,
      acceptance conditions, worked examples — with no directory of metrics, columns or fields anywhere
      in them. The screen has no content region rather than an empty one, and it needs a person before
      it is built.'
    source: pack B2B, Reseller & OTA Partner Management_Reference.pdf, page 38
  - operation: null
    why: '**The pack gives this screen no display, metric or configuration directory**, so its shape is
      a default rather than a reading. It needs a person before it is built.'
    source: pack B2B, Reseller & OTA Partner Management_Reference.pdf, page 38
  layout:
    template: split
    regions:
    - name: actionBar
      slot: rowActions
      components:
      - kind: banner
        label: Permissions this screen separates
        notes: '**The pack separates these permissions and no action on the screen claims them yet:**
          Start Renewal, Request Commercial Review, Change Terms, Request Credit Review, Create Exception,
          Suspend Commercial Access. Each needs attaching to the control it gates, or the screen needs
          the control.'
        provenance: pack B2B, Reseller & OTA Partner Management_Reference.pdf, page 38 §Authorized users
          can
    - name: contentBody
      components:
      - kind: dataTable
        derived: true
        impliedBy: listCommercialAgreementHealth
        notes: '**Cursor pagination, never offset** — offset drifts under concurrent writes, which on
          a venue''s busiest hour is a list that skips rows.'
