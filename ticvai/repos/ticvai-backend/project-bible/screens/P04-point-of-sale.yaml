- id: POS-021
  name: Sell — Food & Drink
  module: Sell
  wave: 1
  requiresModule: fnb
  permission: ORDER_CREATE
  purpose: A guest orders food at a counter and pays.
  density: touchLarge
  apis:
  - operationId: getGuestMenu
    contract: fnb
    purpose: The menu a guest sees
    trigger: onLoad
  - operationId: listMenus
    contract: fnb
    purpose: List menus
    trigger: onLoad
  - operationId: listModifierGroups
    contract: fnb
    purpose: List modifier groups
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Evaluate promotions against a cart
    trigger: onAction
  - operationId: setItemAvailability
    contract: fnb
    purpose: Mark an item available or eighty-sixed
    trigger: onAction
  states:
    loading: The menu board, sections in the order the outlet set them.
    emptyFirstRun: '**No menu published for this outlet.** Names the back-office screen that publishes
      one rather than showing an empty board.'
    emptyNoResults: Nothing matches this section.
    emptyNoAccess: You do not have permission to sell at this outlet.
    error: Could not load. **The last published menu is still on the device** — a till that stops selling
      because a panel failed is worse than a stale panel.
    offline: '**Selling continues from the cached menu.** 86 changes made while offline arrive on sync,
      which is why an item can be sold that the kitchen has just marked unavailable — the kitchen refuses
      it and the guest is refunded at the counter.'
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: cartId
      from: session
    - name: itemId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till
      is signed into, not navigated to — and the outlet is a property of where the till is bolted down,
      not something a cashier picks.'
  layout:
    template: board
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: MenuItem[]
        label: Menu
        notes: '**Sections in the order the outlet set them, not alphabetical.** A menu board that sorts
          by name puts Desserts above Mains forever.'
      - kind: detailPanel
        label: Modifiers
        notes: '**A modifier group is attached to the item, not chosen per sale.** *How would you like
          that cooked* is one group on nine steaks — CF-160.'
      - kind: dataTable
        label: Basket
      - kind: primaryButton
        label: Pay
  navigation:
    entryFrom:
    - POS-001
    exitTo:
    - POS-005
    - POS-002
  implementation:
    app: venue-pos
    route: /sell/sell---food-and-drink
    component: apps/venue-pos/src/routes/sell/SellFoodDrinkBoard.tsx
    status: notStarted
  wireframe:
    status: generated
  provenance: gap found 24 August — no counter-service F&B on any till
  notes: '**Built 24 August. P04 had no F&B screens at all** — a venue licensing `fnb` and running a
    coffee counter had a kitchen display that receives tickets, a back office that configures the menu,
    and **no way to take the order.**


    **The client pack has the same gap.** Six F&B boards: board 3 is the kitchen, board 4 is table service,
    and none is a counter till — so the placement on 20 August was faithful to a pack that never drew
    it.'
