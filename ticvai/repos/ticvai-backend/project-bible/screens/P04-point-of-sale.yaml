    - name: contentBody
      components:
      - kind: metricTile
        notes: Orders ahead, and the oldest. **A cashier quoting a wait needs the number the kitchen
          is actually working to.**
      - kind: cardList
        bindsTo: KitchenTicket[]
      - kind: primaryButton
        label: Collected
  navigation:
