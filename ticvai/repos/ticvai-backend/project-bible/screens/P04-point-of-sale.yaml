    status: generated
  provenance: gap found 24 August — no counter-service F&B on any till
  notes: '**The counter half of F29 and F83.** The kitchen ticket already exists and P15 already renders
    it; **nothing put one on the rail from a till.**


    `markOrderCollected` closes the fulfilment clock here — **order to ready is the kitchen’s number,
    ready to collected is the counter’s**, and food under a lamp for nine minutes shows in neither alone.'
