- id: POS-024
  name: Outlet Setup
  module: Sell
  wave: 1
  requiresModule: fnb
  permission: PRODUCT_CONFIGURE
  purpose: A manager configures this outlet from the floor.
  density: touchLarge
  apis:
  - operationId: listOutlets
    contract: tenancy
    purpose: List outlets
    trigger: onLoad
  - operationId: setTableLayout
    contract: fnb
    purpose: Configure the table layout
    trigger: onAction
  - operationId: setTableCombinations
    contract: fnb
    purpose: Which tables can be pushed together, and to what capacity
    trigger: onAction
  - operationId: setItemAvailability
    contract: fnb
    purpose: Mark an item available or eighty-sixed
    trigger: onAction
  - operationId: listMenus
    contract: fnb
    purpose: List menus
    trigger: onLoad
  states:
    loading: This outlet, its tables and its menu.
    emptyFirstRun: '**A new outlet with no layout.** The one action that draws the first table.'
    emptyNoResults: Nothing matches.
    emptyNoAccess: '**You are signed in as a cashier.** Configuration needs a manager role — ADR-0002
      makes that the person, not the device, so signing in again on this same till is the way through.'
    error: Could not load configuration. **Selling is unaffected.**
    offline: '**Configuration is refused offline.** A table layout edited on two disconnected tablets
      is two layouts, and the room only has one.'
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: itemId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till
      is signed into, not navigated to — and the outlet is a property of where the till is bolted down,
      not something a cashier picks.'
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: TableDefinition[]
        label: Floor
      - kind: detailPanel
        label: Combinations
        notes: '**Declared, not inferred.** Two adjacent tables do not always combine — a pillar, a
          step, a service run. A host knows which pairs work and a floor plan does not.'
      - kind: multiSelect
        label: 86 an item
      - kind: primaryButton
        label: Apply
