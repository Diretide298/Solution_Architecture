    trigger: onAction
  - operationId: listKitchenTickets
    contract: fnb
    purpose: Kitchen ticket queue
    trigger: onLoad
  - operationId: setKitchenTicketStatus
    contract: fnb
    purpose: Advance a kitchen ticket
    trigger: onAction
  - operationId: markOrderCollected
    contract: fnb
    purpose: The guest took it
    trigger: onAction
  states:
    loading: The order, and what is ahead of it.
    emptyFirstRun: TODO — what a cashier sees before the first order of the day.
    emptyNoResults: Nothing outstanding at this counter.
    emptyNoAccess: You do not have permission at this outlet.
    error: Could not send. **The order is journaled and retries** — a counter that loses an order the
      guest has paid for is the failure this prevents.
    offline: '**Queued locally and sent on reconnect.** The kitchen display is on the same LAN, so a
      venue-wide outage stops both and a device outage stops neither.'
