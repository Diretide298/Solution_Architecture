# P04 — Point of Sale
#
# Written against the delivered mockups: Park_POS_dc.html and Park_POS_v1_dc.html.
# POS-010 is from the 14 August MoM and is not in those designs.
#
# Offline-capable, so every screen declares an offline state. Those states are the
# most important lines in this file: they are where ADR-0013 becomes a behaviour.

platform:
  code: P04
  audience: staff
  formFactor: posTerminal
  shortName: Venue POS
  name: Venue POS — Terminal and Tablet
  surface: staffFacing
  runtime: reactNativeTablet
  offlineCapable: true
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 24
  app: venue-pos
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: POS terminal — Windows or Android
    distribution: device management push
    bundleUpdate: catalogue bundle applies at shift open; app on a scheduled window
    hosting: local, offline-first (ADR-0013)
    storeReview: false
    deviceOwnership: venue-owned, staffed
    networkAssumption: venue LAN with expected outages
    releaseCadence: monthly, never during trading
  designReferences:
  - path: sources/designs/Park_POS_dc.html
    note: Delivered client mockup. Six of the ten screens exist in it, and it is the source of the design
      tokens the boards use.
  - path: sources/designs/Park_POS_v1_dc.html
    note: Delivered client mockup. Six of the ten screens exist in it, and it is the source of the design
      tokens the boards use.
  operator: venue
  wireframeBoard: wireframes/P04 Venue POS.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: POS-001
  name: Begin Shift
  module: Shift
  purpose: Count the opening float and open the till.
  capability: C11
  wave: 1
  layout:
    template: wizard
    regions:
    - name: statusStrip
      ref: statusStrip
      components: []
    - name: contentBody
      components:
      - kind: numberField
        label: Denomination count
        notes: Per denomination, from the region settings — the mockup shows AED 200 down to coins.
          Not a hardcoded list
      - kind: metricTile
        bindsTo: Shift.floatTotal
        notes: Computed, never typed
      - kind: textField
        label: Notes
      - kind: detailPanel
        notes: Suggested float from the venue default. Advisory, not prefilled — a prefilled count is
          not a count
    - name: actionBar
      components:
      - kind: primaryButton
        label: Review & confirm
  states:
    loading: Denominations from region settings
    emptyFirstRun: Not applicable
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Open failed. Counts are kept on screen
    offline: Opens locally and syncs. A gate that cannot open a till because the network is down is
      a gate that does not sell
  wireframe:
    status: designed
    board: wireframes/TICVAI Boards v2.dc.html#pos-2a
    source: Claude Design POS pack, 24 August
    note: '**Drawn as POS-2A, POS-3D in the client POS pack.** The pack''s frame is the specification
      — it carries operations, states, entry params and exits, and it is better specified than anything
      derived from the screen file.'
  permission: SHIFT_OPEN
  apis:
  - operationId: openShift
    contract: shift
    purpose: Open with the counted float
    trigger: onAction
  - operationId: getCurrentShift
    contract: shift
    purpose: Whether a shift is already open here
    trigger: onLoad
  - operationId: acceptShiftVariance
    contract: shift
    purpose: Accept an over/short beyond the threshold
    trigger: onAction
  - operationId: approveShiftOpen
    contract: shift
    purpose: Approve a shift opening outside tolerance
    trigger: onAction
  - operationId: closeShift
    contract: shift
    purpose: Blind close-out
    trigger: onAction
  - operationId: createCashMovement
    contract: shift
    purpose: Record a cash lift or add
    trigger: onAction
  - operationId: getShift
    contract: shift
    purpose: Read a shift
    trigger: onLoad
  - operationId: listCashMovements
    contract: shift
    purpose: Lifts, adds and the opening float
    trigger: onLoad
  - operationId: listShifts
    contract: shift
    purpose: List shifts
    trigger: onLoad
  - operationId: recordNoSale
    contract: shift
    purpose: Open the drawer without a sale
    trigger: onAction
  - operationId: reopenShift
    contract: shift
    purpose: Reopen a shift closed in error
    trigger: onAction
  - operationId: resumeShift
    contract: shift
    purpose: Resume a suspended shift
    trigger: onAction
  - operationId: suspendShift
    contract: shift
    purpose: Suspend a shift so another user can log in
    trigger: onAction
  - operationId: adjustDepositBoxFloat
    contract: shift
    purpose: Change the initial fund
    trigger: onAction
  - operationId: selectRole
    contract: identity
    purpose: Choose a role for a multi-role session
    trigger: onAction
  - operationId: getWorkstationHealth
    contract: tenancy
    purpose: getWorkstationHealth
    trigger: onLoad
  - operationId: listDenominations
    contract: shift
    purpose: listDenominations
    trigger: onLoad
  notes: 'Design: Park_POS_dc.html. The mockup warns "you will not be able to edit the float amount
    after the shift has started" — that is correct and deliberate. An editable opening float makes close-out
    variance meaningless. **Improved 20 August against the client design board**, answering 2 board
    screen(s): Opening Float Management; Shift Opening & Login. **Owns POS board frame(s) POS-2A, POS-3D**
    (client pack, 24 August). **Assigned by board purpose rather than by operation overlap** — three
    attempts at deriving that mapping produced plausible nonsense, and a reader who trusts a bad table
    is worse off than one who has none.'
  implementation:
    app: venue-pos
    route: /shift/begin-shift
    component: apps/venue-pos/src/routes/shift/BeginShiftWizard.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    exitTo:
    - POS-002
    - POS-007
    - POS-009
    - POS-021
    - POS-022
    - POS-023
    - POS-024
  density: touchLarge
  entryState:
    params:
    - name: workstationId
      from: session
    - name: boxId
      from: session
    - name: shiftId
      from: deepLink
    coldEntry: '**The deposit box allocated to this workstation for this shift**, resolved at shift
      open — a cashier does not choose a box.'
  provenance: client board, specified
  requiresModule: core
  boardFrames:
  - POS-2A
  - POS-3D
- id: POS-002
  name: Sell — Ticket Catalogue
  module: Sell
  purpose: Find a product and add it to the cart.
  capability: C01
  wave: 1
  layout:
    template: board
    regions:
    - name: sideNav
      ref: sideNav
      components: []
    - name: contentBody
      components:
      - kind: searchField
        label: Search events, tickets, customers
      - kind: saleBoard
        bindsTo: SaleBoard
        notes: Category tiles then product cards. Layout is the sale board configured per workstation
          (ADR-0002), not a fixed grid
      - kind: selectField
        label: Sort by
      - kind: multiSelect
        label: Filters
    - name: contextPanel
      components:
      - kind: cartPanel
        bindsTo: PromotionEvaluation
        notes: Persistent. The mockup shows member discount applied automatically — that is evaluatePromotions,
          not a manual entry
    - name: actionBar
      components:
      - kind: primaryButton
        label: Checkout
      - kind: secondaryButton
        label: Hold order
        permission: ORDER_MODIFY
      - kind: secondaryButton
        label: Open order
      - kind: secondaryButton
        label: Discount
        permission: ORDER_DISCOUNT
      - kind: secondaryButton
        label: Promo code
      - kind: destructiveButton
        label: Clear cart
  states:
    loading: Tiles from the local bundle. Instant — this screen must not wait on a network
    emptyFirstRun: No products in this category
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Bundle stale or missing. The terminal refuses to sell rather than selling at an unknown price
    offline: Served from the local catalogue bundle (ADR-0013). One read path, always local — the terminal
      does not know whether it has a network.
    catalogueStale: '**The bundle on this till is older than the one published.** Shown, not hidden
      — a till selling yesterday’s prices is a real exposure, and `maxOfflineHours` bounds how long
      it can last.'
  wireframe:
    status: designed
    board: wireframes/Retail Board 3.dc.html#ret-3b
    source: Claude Design Retail pack, 24 August
    note: '**Drawn as RET-3B, RET-3C, RET-3D in the client Retail pack.**'
  permission: ORDER_CREATE
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: Catalogue
    trigger: onLoad
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Live cart pricing
    trigger: onAction
  - operationId: holdOrder
    contract: orders
    purpose: Park the sale
    trigger: onAction
  - operationId: applyManualDiscount
    contract: orders
    purpose: Cashier discount with a reason
    trigger: onAction
  - operationId: analysePromotionConflicts
    contract: promotions
    purpose: Analyse stacking against live promotions
    trigger: onLoad
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: createRefund
    contract: orders
    purpose: Refund an order, wholly or in part
    trigger: onAction
  - operationId: exchangeOrderLines
    contract: orders
    purpose: Exchange lines for different products or dates
    trigger: onAction
  - operationId: getOrder
    contract: orders
    purpose: Read an order
    trigger: onLoad
  - operationId: getOrderStatement
    contract: orders
    purpose: Full financial history of an order
    trigger: onLoad
  - operationId: getProduct
    contract: catalogue
    purpose: Read a product
    trigger: onLoad
  - operationId: getPromotion
    contract: promotions
    purpose: Read a promotion
    trigger: onLoad
  - operationId: getPromotionUsage
    contract: promotions
    purpose: Redemption count and discount given
    trigger: onLoad
  - operationId: listAlternativeCodes
    contract: catalogue
    purpose: External identifiers for a product
    trigger: onLoad
  - operationId: listOrderRefunds
    contract: orders
    purpose: List refunds against an order
    trigger: onLoad
  - operationId: listOrders
    contract: orders
    purpose: List orders
    trigger: onLoad
  - operationId: listProductVariants
    contract: catalogue
    purpose: List generated variants
    trigger: onLoad
  - operationId: listPromotions
    contract: promotions
    purpose: List promotions
    trigger: onLoad
  - operationId: modifyOrder
    contract: orders
    purpose: Add or remove lines on an existing order
    trigger: onAction
  - operationId: reprintOrder
    contract: orders
    purpose: Reprint or resend tickets
    trigger: onAction
  - operationId: rescheduleOrder
    contract: orders
    purpose: Move an order to another performance
    trigger: onAction
  - operationId: resolveProductByCode
    contract: catalogue
    purpose: Resolve a partner code to a product
    trigger: onLoad
  - operationId: resumeOrder
    contract: orders
    purpose: Bring a parked sale back to a till
    trigger: onAction
  - operationId: voidOrder
    contract: orders
    purpose: Void an order
    trigger: onAction
  - operationId: evaluateApprovalRequirement
    contract: approvals
    purpose: Does this need approval, and from whom
    trigger: onAction
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  - operationId: listMerchandise
    contract: retail
    purpose: List merchandise
    trigger: onLoad
  - operationId: lookupMerchandise
    contract: retail
    purpose: Price and stock check by barcode
    trigger: onLoad
  - operationId: issueGameCard
    contract: games
    purpose: Issue or activate a game card
    trigger: onAction
  - operationId: loadGameCredits
    contract: games
    purpose: Load credits onto a card
    trigger: onAction
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: getLoyaltyPosition
    contract: marketing-crm
    purpose: A guest's points, tier and what is within reach
    trigger: onLoad
  - operationId: identifyGuest
    contract: marketing-crm
    purpose: Resolve any identifier to a guest
    trigger: onAction
  - operationId: listMyEntitlements
    contract: access
    purpose: Every ticket, pass and membership this guest holds
    trigger: onLoad
  - operationId: listSaleBoards
    contract: tenancy
    purpose: List sale boards
    trigger: onLoad
  - operationId: getLatestBundle
    contract: catalogue
    purpose: Pull the current bundle for this workstation's venue
    trigger: onLoad
  - operationId: syncOrders
    contract: orders
    purpose: Replay orders recorded offline
    trigger: onAction
  - operationId: createRetailReturn
    contract: retail
    purpose: Accept a return
    trigger: onAction
  - operationId: redeemLoyaltyPoints
    contract: marketing-crm
    purpose: Spend points
    trigger: onAction
  - operationId: createApprovalRequest
    contract: approvals
    purpose: Raise a request
    trigger: onAction
  - operationId: createRetailSale
    contract: retail
    purpose: Sell merchandise
    trigger: onAction
  notes: 'Design: Park_POS_dc.html, "Ticket Catalogue / Product Selection". The mockup exposes Hold
    Order and Discount as first-class buttons — neither existed as an operation until 14 August. Where
    a foreign note is offered, the tender currency and rate are recorded on the payment. **The sale
    is still booked in base currency** — 2.9.1: the sale finalises in local currency. **Improved 20
    August against the client design board**, answering 4 board screen(s): Retail Sales & POS Command
    Center; Retail POS Selling Workspace; Guest, Membership, Loyalty & Entitlement Interface and 1 more.
    **`getLatestBundle` wired 24 August.** ADR-0013 makes the POS local-first and **no P04 screen polled
    for a catalogue** — the till held a bundle and nothing on the platform refreshed it. Found by writing
    F31, not by auditing the contract. **Retail board operations wired 24 August.** **Cross-platform
    navigation removed 24 August**: BO-084, GST-026. **A till does not navigate to a back office and
    a guest app does not navigate to either** — those are device handovers, and a flow declares them
    with `crossesDevice` rather than a screen pretending there is a link. **Authoring operations removed
    24 August**: createProduct, createPromotion, endPromotion, pausePromotion, publishPromotion, setAlternativeCodes,
    setProductAttributes, transitionProductLifecycle, unschedulePromotion, updateProduct, updatePromotion,
    createStockMovement. **A till sells the catalogue; it does not author it.** These arrived in the
    18 August bulk attach — the same defect that put 21 of 39 review rows in one bucket — and a flow
    walking a ticket sale is what surfaced them.'
  implementation:
    app: venue-pos
    route: /sell/sell-ticket-catalogue
    component: apps/venue-pos/src/routes/sell/SellTicketCatalogueBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    - POS-006
    exitTo:
    - POS-001
    - POS-003
    - POS-004
    - POS-005
    - POS-006
    - POS-007
    - POS-010
    - POS-011
    - POS-013
    - POS-020
    fromFlows: true
  density: touchLarge
  entryState:
    params:
    - name: workstationId
      from: session
    - name: cardCode
      from: deepLink
    - name: cartId
      from: session
    - name: orderId
      from: deepLink
    - name: productId
      from: deepLink
    - name: promotionId
      from: deepLink
    coldEntry: '**The cart in progress at this till**, held locally. A cold arrival mid-sale resumes
      it from the journal rather than losing it. An order recalled from the held list or a receipt lookup.'
  provenance: client board, specified
  requiresModule: ticketing
  boardFrames:
  - RET-3B
  - RET-3C
  - RET-3D
- id: POS-003
  name: Sell — Timed Entry
  module: Sell
  purpose: Pick a date, a session and ticket quantities.
  capability: C81
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: datePicker
        notes: Seven-day strip, as designed. Region date format
      - kind: cardList
        bindsTo: Availability.performances
        notes: Slots with remaining counts and a demand indicator — the mockup shows High, Medium, Low,
          Sold Out
      - kind: cardList
        bindsTo: ProductVariant[]
        notes: Adult and child with steppers
    - name: contextPanel
      components:
      - kind: cartPanel
    - name: actionBar
      components:
      - kind: primaryButton
        label: Add to cart
  states:
    loading: Slot skeleton
    emptyFirstRun: No sessions on this date, with the next available offered
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Availability unavailable. Selection blocked — overselling is worse than waiting
    offline: '**Availability is never served from the bundle.** A lease is acquired against the server;
      without one the terminal sells only from its allocated lease and refuses beyond it (ADR-0013)'
  wireframe:
    status: generated
    board: wireframes/P04 Venue POS.dc.html#pos-003
  permission: ORDER_CREATE
  apis:
  - operationId: getAvailability
    contract: catalogue
    purpose: Per-session remaining
    trigger: onLoad
  - operationId: acquireLease
    contract: catalogue
    purpose: Hold capacity for this terminal
    trigger: onAction
  - operationId: listProductVariants
    contract: catalogue
    purpose: Ticket types
    trigger: onLoad
  - operationId: getProduct
    contract: catalogue
    purpose: Read a product
    trigger: onLoad
  - operationId: listAlternativeCodes
    contract: catalogue
    purpose: External identifiers for a product
    trigger: onLoad
  - operationId: listLeases
    contract: catalogue
    purpose: List leases
    trigger: onLoad
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  - operationId: releaseLease
    contract: catalogue
    purpose: Return unsold units
    trigger: onAction
  - operationId: renewLease
    contract: catalogue
    purpose: Extend a lease TTL
    trigger: onAction
  - operationId: resolveProductByCode
    contract: catalogue
    purpose: Resolve a partner code to a product
    trigger: onLoad
  notes: 'Design: Park_POS_dc.html, "Aquarium Entry" timed entry. The demand indicator is a presentation
    of remaining capacity, not a separate field. **Authoring operations removed 24 August**: createProduct,
    forceReleaseLease, setAlternativeCodes, setProductAttributes, transitionProductLifecycle, updateProduct.
    **A till sells the catalogue; it does not author it.** These arrived in the 18 August bulk attach
    — the same defect that put 21 of 39 review rows in one bucket — and a flow walking a ticket sale
    is what surfaced them.'
  implementation:
    app: venue-pos
    route: /sell/sell-timed-entry
    component: apps/venue-pos/src/routes/sell/SellTimedEntryForm.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    exitTo:
    - POS-001
    - POS-002
    - POS-004
    - POS-005
    - POS-006
  density: touchLarge
  entryState:
    params:
    - name: leaseId
      from: deepLink
    - name: productId
      from: POS-002
    coldEntry: TODO — what this screen shows when somebody arrives with no upstream screen.
  requiresModule: ticketing
- id: POS-004
  name: Sell — Seat Map
  module: Sell
  purpose: Choose specific seats for a seated event.
  capability: C51
  wave: 2
  layout:
    template: canvas
    regions:
    - name: contentBody
      components:
      - kind: seatMap
        bindsTo: SeatAvailability
        notes: Category filter, zoom, legend. Available, selected, sold, accessible — exactly the four
          states in the design
      - kind: banner
        notes: Hold countdown
    - name: contextPanel
      components:
      - kind: cartPanel
        bindsTo: SeatHold
        notes: Seat total plus booking fee, itemised as designed
    - name: actionBar
      components:
      - kind: primaryButton
        label: Add seats to cart
  states:
    loading: Map skeleton at the venue aspect ratio
    emptyFirstRun: No seats in the selected category
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Map unavailable, with best-available offered instead
    offline: '**Not available offline.** Seat holds require the primary; two terminals selling the same
      seat is unrecoverable'
  wireframe:
    status: generated
    board: wireframes/P04 Venue POS.dc.html#pos-004
  permission: ORDER_CREATE
  apis:
  - operationId: getSeatAvailability
    contract: seating
    purpose: Seat status
    trigger: onLoad
  - operationId: createSeatHold
    contract: seating
    purpose: Hold on selection
    trigger: onAction
  - operationId: extendSeatHold
    contract: seating
    purpose: Extend during payment
    trigger: onAction
  - operationId: getPerformance
    contract: catalogue
    purpose: Read a performance
    trigger: onLoad
  - operationId: getSeatHold
    contract: seating
    purpose: Read a hold
    trigger: onLoad
  - operationId: recommendSeats
    contract: seating
    purpose: Recommend seats for a party
    trigger: onAction
  - operationId: releaseSeatHold
    contract: seating
    purpose: Release a hold
    trigger: onAction
  - operationId: updatePerformance
    contract: catalogue
    purpose: Amend a performance
    trigger: onAction
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  - operationId: evaluateApprovalRequirement
    contract: approvals
    purpose: Does this need approval, and from whom
    trigger: onAction
  notes: 'Design: Park_POS_dc.html, "Reserved Seating / Seat Map". Booking fee is a separate line —
    it is a fee, not part of the seat price, and reporting separates them. Foreign tender: **cash in
    a currency the venue accepts, converted at the rate on the payment** (4.6.11). Change is given in
    base currency only, so the till holds one float and one count per currency it takes in. **Removed
    24 August**: cancelPerformance. **Bulk-attach residue** — the 18 August defect that put identical
    operation sets on unrelated screens. A till does not cancel a performance, a staff app does not
    create roles, and **a scanner does not run a cash shift.**'
  implementation:
    app: venue-pos
    route: /sell/sell-seat-map
    component: apps/venue-pos/src/routes/sell/SellSeatMapCanvas.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-002
    exitTo:
    - POS-001
    - POS-002
    - POS-003
    - POS-005
    - POS-006
  density: touchLarge
  entryState:
    params:
    - name: holdId
      from: deepLink
    - name: performanceId
      from: deepLink
    coldEntry: '**A link to a performance that has happened.** Offers the next performance of the same
      event.'
  requiresModule: seating
- id: POS-005
  name: Payment
  module: Payment
  purpose: Take payment and complete the sale.
  capability: C04
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: selectField
        label: Payment method
        notes: Card, cash, digital wallet, gift card or voucher, online payment — the five in the design
      - kind: numberField
        label: Amount received
      - kind: detailPanel
        bindsTo: changeDue
        notes: Computed live. Quick-tender chips for exact, 250, 300
      - kind: paymentTerminal
        bindsTo: Payment
    - name: contextPanel
      components:
      - kind: cartPanel
        notes: Order summary stays visible
    - name: actionBar
      components:
      - kind: primaryButton
        label: Complete payment
      - kind: secondaryButton
        label: Split payment
      - kind: secondaryButton
        label: Add tip
      - kind: secondaryButton
        label: Print receipt
      - kind: secondaryButton
        label: Email receipt
      - kind: destructiveButton
        label: Cancel order
  states:
    loading: Button disabled while processing. Double submission impossible
    emptyFirstRun: Not applicable
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Declined, with the reason. Retry reuses the same idempotency key
    offline: Cash completes locally and journals. **Card does not** — an offline card approval the acquirer
      never saw is a sale that vanishes at settlement
  wireframe:
    status: designed
    board: wireframes/Retail Board 3.dc.html#ret-3e
    source: Claude Design Retail pack, 24 August
    note: '**Drawn as RET-3E in the client Retail pack.**'
  permission: ORDER_CREATE
  apis:
  - operationId: createPayment
    contract: orders
    purpose: Capture
    trigger: onAction
  - operationId: inquirePaymentStatus
    contract: orders
    purpose: Resolve an unknown terminal outcome
    trigger: onAction
  - operationId: addTip
    contract: orders
    purpose: Record a tip against the payment
    trigger: onAction
  - operationId: reprintReceipt
    contract: retail
    purpose: Reprint
    trigger: onAction
  - operationId: capturePayment
    contract: orders
    purpose: Capture a previously authorised payment
    trigger: onAction
  - operationId: createRetailSale
    contract: retail
    purpose: Sell merchandise
    trigger: onAction
  - operationId: getRetailSale
    contract: retail
    purpose: Read a retail sale
    trigger: onLoad
  - operationId: listRetailSales
    contract: retail
    purpose: List retail sales
    trigger: onLoad
  - operationId: lookupRetailSale
    contract: retail
    purpose: Find a sale from a receipt
    trigger: onLoad
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: redeemLoyaltyPoints
    contract: marketing-crm
    purpose: Spend points
    trigger: onAction
  notes: 'Design: Park_POS_dc.html, "Cash Payment". Add Tip appears in the design and had no operation
    until 14 August. A tip posts to a liability, not to sales. **The one surface that takes foreign
    cash** (4.6.11). Records `tenderCurrency`, `tenderAmount` and the `fxRate` applied, and **gives
