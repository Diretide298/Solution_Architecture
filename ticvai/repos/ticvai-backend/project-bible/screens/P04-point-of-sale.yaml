    variance becomes unattributable. **Improved 20 August against the client design board**, answering
    1 board screen(s): Checkout, Payment & Receipt. **Cross-platform navigation removed 24 August**:
    BO-048. **A till does not navigate to a back office and a guest app does not navigate to either**
    — those are device handovers, and a flow declares them with `crossesDevice` rather than a screen
    pretending there is a link. **Reaches the counter screens from 24 August.** **A till has one tender
    flow, not one per module** — a food order and a ticket both settle here and return to whichever
    board they came from.'
