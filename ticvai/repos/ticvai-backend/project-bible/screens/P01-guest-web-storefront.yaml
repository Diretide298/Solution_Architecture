    two renderings** — a screen named differently on web and app is two screens to a developer and one
    journey to a guest. **Cross-surface parity, 31 August**: added getAvailability, getWaitTimes. **A
    guest does not know which surface they are on** — the same named screen on web and app now calls the
    same guest-callable operations.'
