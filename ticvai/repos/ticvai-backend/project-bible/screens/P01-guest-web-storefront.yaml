  notes: '**Cross-surface parity, 31 August**: added getWaitTimes. **A guest does not know which surface
    they are on** — the same named screen on web and app now calls the same guest-callable operations.'
  density: compact
  pattern: listDetail
  patternReason: '`listProducts` reads the population and `getWaitTimes` reads one of them — list, select,
    act'
  purpose: Browse and filter everything bookable.
  gaps:
  - operation: listPerformances
    why: '**2 declared operations reach no component on this screen**: listPerformances, searchCatalogue.
      Either the screen is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every event attraction listing
        bindsTo: Product
        columns:
        - Product.id
        - Product.code
        - Product.name
        - Product.description
        - Product.kind
        - Product.venueId
        - Product.scopePath
