        - Product.approvedByPrincipalId
        - Product.responsibleDepartmentId
        - Product.onSaleFrom
        - Product.onSaleTo
        operation: listProducts
        provenance: contract catalogue.yaml GET /products
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected event attraction listing
        bindsTo: WaitTime
        columns:
        - WaitTime.queueId
        - WaitTime.queueName
        - WaitTime.attractionProductId
        - WaitTime.status
        - WaitTime.waitMinutes
        - WaitTime.source
        - WaitTime.isStale
        - WaitTime.heightRequirementCm
        - WaitTime.zone
        - WaitTime.asOf
        operation: getWaitTimes
        provenance: contract queue.yaml GET /queues/wait-times
    - name: contentBody
      slot: carried
      components:
      - kind: searchField
        label: Search events and attractions
        provenance: carried from the previous definition
      - kind: multiSelect
        label: Category
        provenance: carried from the previous definition
      - kind: datePicker
        label: Date
        notes: Format from region settings, not a locale guess
        provenance: carried from the previous definition
      - kind: cardList
        bindsTo: Product[]
        notes: Cursor pagination. Infinite scroll with an explicit load-more fallback
        provenance: carried from the previous definition
  states:
    loading: The event attraction listing list.
    error: Could not load. Names which read failed and leaves the event attraction listing untouched.
    emptyFirstRun: No event attraction listing yet. Carries the create action; distinct from a filter
      that matched nothing.
    emptyNoResults: The filter narrowed it and the event attraction listing are still there. Names the
      active filter and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  - operationId: listPerformances
    contract: catalogue
    purpose: List performances of an event
    trigger: onLoad
  - operationId: searchCatalogue
    contract: catalogue
    purpose: Find something by name
    trigger: onLoad
  - operationId: getWaitTimes
    contract: queue
    purpose: Wait times across a venue
    trigger: onLoad
  entryState:
    params:
    - name: eventId
      from: deepLink
    coldEntry: '**A guest arriving cold on a link that no longer resolves is shown what happened and one
      way onward — never a 404.** A shared ticket, a forwarded confirmation and a push notification opened
      three weeks late all land here, and the person holding the link did nothing wrong. **The screen
      names the thing, says it is expired, cancelled or withdrawn, and offers the list it came from.**
      Arrives with `eventId`.'
    preloaded:
