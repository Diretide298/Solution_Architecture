        - Product.name
        - Product.description
        - Product.kind
        - Product.venueId
        - Product.scopePath
        - Product.createdByPrincipalId
        - Product.approvedByPrincipalId
        - Product.responsibleDepartmentId
        - Product.onSaleFrom
        - Product.onSaleTo
