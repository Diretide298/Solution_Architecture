  outcome: Allow authorized users to operationally adjust inventory allocations as demand changes. Board
    1 defines the allocation rules. Board 2 manages those allocations during live operations.
- step: 9
  screen: ADM-268
  action: Returns to the board's landing screen
  operations:
  - listChannel
  outcome: Ready for the next screen on this board
- step: 10
  screen: ADM-273
