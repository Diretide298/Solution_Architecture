id: F167
name: 'Sales Channel Management board 2: Channel Operations Command Center'
actor: platformAdmin
wave: 3
frequency: routine
criticality: operational
platforms:
- P09 TICVAI Web
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Sales Channel Management board 2. **This route is read from
    the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: ADM-268
  entryPoints:
  - Arrives at Channel Operations Command Center
steps:
- step: 1
  screen: ADM-268
  action: Opens Channel Operations Command Center
  operations:
  - listChannel
  outcome: Provide a real-time operational view of all active TICVAI sales channels.
- step: 2
  screen: ADM-269
  action: Works in Channel Connection & Integration Manager
  operations:
  - listChannelConnectionIntegration
  outcome: Configure and manage the technical connection between TICVAI and external or internal sales
    channels.
- step: 3
  screen: ADM-268
  action: Returns to the board's landing screen
  operations:
  - listChannel
  outcome: Ready for the next screen on this board
- step: 4
  screen: ADM-270
  action: Works in Product, Price & Availability Synchronization
  operations:
  - listProductPriceAvailability
  outcome: Control how TICVAI distributes commercial information to connected channels and receives supported
    updates.
- step: 5
  screen: ADM-268
  action: Returns to the board's landing screen
  operations:
  - listChannel
  outcome: Ready for the next screen on this board
- step: 6
  screen: ADM-271
  action: Works in Real-Time Channel Availability & Inventory Monitor
  operations:
