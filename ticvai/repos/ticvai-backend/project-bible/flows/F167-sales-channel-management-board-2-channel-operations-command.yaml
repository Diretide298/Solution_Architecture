  outcome: Provide operations with a live view of what each channel can currently sell.
- step: 7
  screen: ADM-268
  action: Returns to the board's landing screen
  operations:
  - listChannel
  outcome: Ready for the next screen on this board
- step: 8
  screen: ADM-272
  action: Works in Channel Allocation & Rebalancing Operations
