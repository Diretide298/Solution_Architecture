  outcome: Provide a calendar-based operational view of promotions.
- step: 9
  screen: ADM-138
  action: Returns to the board's landing screen
  operations:
  - listPromotions
  outcome: Ready for the next screen on this board
- step: 10
  screen: ADM-143
  action: Works in Promotion Channel & Publication Monitor
  operations:
