  outcome: Ensure promotional configurations are correctly synchronized across every TICVAI sales channel.
- step: 11
  screen: ADM-138
  action: Returns to the board's landing screen
  operations:
  - listPromotions
  outcome: Ready for the next screen on this board
- step: 12
