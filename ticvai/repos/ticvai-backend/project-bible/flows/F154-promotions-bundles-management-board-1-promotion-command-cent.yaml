  - getPromotionUsage
  outcome: Provide management with a real-time executive and operational overview of all promotional activities.
- step: 2
  screen: ADM-139
  action: Works in Promotion & Campaign Directory
  operations:
  - listPromotionCampaign
  outcome: Provide the master searchable list of every promotion and commercial campaign created within
    TICVAI.
- step: 3
  screen: ADM-138
  action: Returns to the board's landing screen
  operations:
  - listPromotions
  outcome: Ready for the next screen on this board
- step: 4
  screen: ADM-140
  action: Works in Promotion Overview
  operations:
  - listPromotions
  outcome: Provide the complete business summary of one selected promotion without opening its detailed
