  outcome: Ready for the next screen on this board
- step: 18
  screen: ADM-147
  action: Works in Promotion Audit, Activity & Version History
  operations:
  - listPromotionActivityVersion
  outcome: Provide complete governance and traceability for every promotion. Board 2 is the core commercial
    rule engine for promotions. It shall allow authorized TICVAI business users to configure discount
    and promotion mechanics without development, including percentage and fixed discounts, transaction
    thresholds, volume discounts, bulk pricing, early-bird and last-minute offers, special guest pricing,
    payment-method discounts, partner discounts, and dynamic conditional discounts. The matrix explicitly
    requires percentage/value discounts, quantity thresholds, bulk discounts, early-bird/volume/customer-segment
    conditions, payment-type offers, group pricing, and special individual pricing. The board should contain
    10 backend screens.
branches:
- at: 1
  condition: Nothing has been set up on Promotion Command Center Dashboard yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Promotions   Bundles Management board 1 visited
primaryContract: approvals
contracts:
- approvals
- promotions
