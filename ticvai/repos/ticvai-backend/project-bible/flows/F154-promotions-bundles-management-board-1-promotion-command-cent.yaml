id: F154
name: 'Promotions   Bundles Management board 1: Promotion Command Center Dashboard'
actor: platformAdmin
wave: 3
frequency: routine
criticality: operational
platforms:
- P09 TICVAI Web
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Promotions   Bundles Management board 1. **This route is
    read from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: ADM-138
  entryPoints:
  - Arrives at Promotion Command Center Dashboard
steps:
- step: 1
  screen: ADM-138
  action: Opens Promotion Command Center Dashboard
  operations:
