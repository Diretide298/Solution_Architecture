# whitelabel.contentPublished v1 — published by whitelabel
# Checked by tools/check-states.py.

name: whitelabel.contentPublished
version: 1
publisher: whitelabel
description: A tenant published content to their guest surfaces — a page, a banner, an FAQ or a policy.
aggregate: tenantConfig
emittedWhen: 'A white-label config version becomes current (ADAM CR-154, 18 October 2026; CHG-CRA-004): at
  publishTenantConfig for a 201, by white-label''s approval.granted consumer for a 202, and by the scheduled-publish
  job at scheduledFor. Never at the request of a version that is pending review or scheduled'
emittedBy:
- publishTenantConfig
payload:
- field: tenantId
  type: uuid
- field: configVersion
  type: string
- field: changedKinds
  type: array
  notes: 'page, faq, policy, banner, promoBlock, and for a config publish brand, appIcons, theme, fonts, navigation,
    homepage, footer, modules, features, languages and bookingFlows (ADAM CR-324, A2; CHG-CR324-001) — only what
    actually changed. **Changed** means it differs from the previously current version''s snapshot; on a first
    publish, every part that is set'
- field: changedIds
  type: array
  notes: 'So indexing is incremental. **Republishing a whole config to change one FAQ would reindex everything**.
    The ids of the changed items that have one: navigation items, homepage sections and booking flows (ADAM CR-324,
    A2)'
- field: locales
  type: array
  notes: 'Which languages changed. A translation added is new content to retrieve. The draft''s languages that
    appear in any changed LocalisedText (ADAM CR-324, A2)'
- field: publishedAt
  type: timestamp
consumers:
- context: ai
  purpose: Reindex the changed pages, FAQs and policies
  idempotencyKey: configVersion + changedIds
  onFailure: retry
  isCritical: false
- context: guest-app
  purpose: Invalidate the cached config so guests see it
  idempotencyKey: configVersion
  onFailure: retryThenDeadLetter
  isCritical: true
- context: cache
  purpose: Drop cached answers under the affected scope. **The same event that invalidates the index
    invalidates the answer** — a cached answer that outlives a price change has misled a guest on the
    venue’s behalf, which is worse than a slow one
  idempotencyKey: scopePath+eventId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Carries what changed, not that something did.** A publish event with no change list forces
  a full reindex on every save, and a tenant editing a homepage over a week would rebuild the knowledge
  base daily.


  **The aggregate id is the tenantId** (the envelope''s `aggregateId`; ADAM CR-324, A2; CHG-CR324-001): one
  tenantConfig per tenant, so events about the same tenant''s configuration are ordered.'
