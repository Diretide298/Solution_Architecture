# seat.sold v1 — published by seating
# Checked by tools/check-states.py against states/ and the contracts.

name: seat.sold
version: 1
publisher: seating
description: A specific seat is no longer available for a performance.
aggregate: seat
emittedWhen: SeatStatus held to sold
# **Published by seating, from inside the order transaction** (3 October 2026, CHG-R1S-010; the HLD/LLD
# cross-check found createPayment, an OrderService operation, named for a seating event). The payment calls
# catalogue.convertInventoryHold (CatalogueService, which owns seating), and that converts the order's seat
# holds and writes seat.sold to the outbox, one per seat.
emittedBy:
- catalogue.convertInventoryHold
payload:
- field: seatId
  type: uuid
- field: performanceId
  type: uuid
- field: venueId
  type: uuid
- field: orderId
  type: uuid
- field: categoryId
  type: uuid
- field: soldAt
  type: timestamp
consumers:
- context: catalogue
  purpose: Decrement the performance envelope
  idempotencyKey: orderId + seatId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Seat-level sales and heat maps
  idempotencyKey: orderId + seatId
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Candidate availability (a sold seat is no longer a recommendation) and forecast and risk
    context (AI system design section 3.2)
  idempotencyKey: orderId + seatId
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: Per seat rather than per order. A twelve-seat order emits twelve, because the envelope and the
  heat map both work at seat grain.
