# identity.privacyRequestRaised v1 — published by identity
# Added 25 October 2026 (ADAM CR-101, accepted 15 October 2026; CHG-R10ID-016): a guest's data export or erasure,
# raised as an Approvals request by Identity, enters Marketing's privacy queue, so the jurisdiction's response
# period gives it a dueAt. Identity is Foundation and does not read the queue (ADR-0028); it only tells it.

name: identity.privacyRequestRaised
version: 1
publisher: identity
description: A guest's privacy request (a data export or an erasure) was raised, as an Approvals request.
aggregate: subject
emittedWhen: exportSubjectData or deleteGuestAccount raises its Approvals request
emittedBy:
- identity.exportSubjectData
- identity.deleteGuestAccount
payload:
- field: subjectId
  type: uuid
  notes: The guest the request is about (pii.subject)
- field: approvalRequestId
  type: uuid
  notes: The approvals.request id the operation answered with as requestId; where no matrix rule matched and the
    job ran at once, the export's own id (r10 round 3)
- field: requestType
  type: string
  notes: 'access for exportSubjectData, deletion for deleteGuestAccount: the configured privacy request type codes
    (setPrivacyRequestTypes)'
- field: format
  type: string
  required: false
  notes: For an export, json, csv or pdf
- field: raisedByGuest
  type: boolean
  notes: True when the guest raised it (source self-service); false when staff raised it for the guest
- field: jurisdiction
  type: string
  notes: 'ISO 3166-1 alpha-2 country of the venue the request was raised at (the request''s venue; the lead, 25 October
    2026, r10 round 3, CHG-R10ID-024); selects the response period. It is the countryCode of the region settings row
    at the nearest ancestor of that venue''s path (the X-Venue-Id venue, or a staff caller''s working venue; ADAM
    CR-512, CHG-CR512-001)'
- field: raisedAt
  type: timestamp
consumers:
- context: marketing
  purpose: 'Open a privacy request in the privacy queue (marketing.privacy_request: subjectId, requestType, requesterRole
    self, source customerPortal when raisedByGuest is true and customerService otherwise, jurisdiction, approvalRequestId,
    submittedAt = raisedAt), so
    its dueAt is submittedAt plus the response period configured for the request type and jurisdiction; with no
    period configured it shows no deadline (the statutory period is the client''s to give)'
  writes:
  - marketing.privacy_request
  idempotencyKey: eventId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: marketing
  purpose: 'For requestType access, write Marketing''s part of the guest''s data export (the guest''s rows of
    marketing.consent_record, guest_profile, form_submission and guest_document) to the tenant''s private object
    storage and publish marketing.subjectDataPartWritten, so the export job assembles it without reading a Marketing
    table (the lead, 29 October 2026, r11 gate; CHG-R11FXC-005). requestType deletion writes no part'
  operation: marketing-crm.writeSubjectDataExportPart
  idempotencyKey: approvalRequestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: access
  purpose: 'access''s part of the guest''s privacy request: for access, write its rows of the subject as one object in the tenant''s private storage; for deletion, erase the personal fields it keeps outside pii.*; either way record the part with identity submitSubjectDataPart (r13 review B-01, CHG-R14M-001)'
  idempotencyKey: approvalRequestId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: accreditation
  purpose: 'accreditation''s part of the guest''s privacy request: for access, write its rows of the subject as one object in the tenant''s private storage; for deletion, erase the personal fields it keeps outside pii.*; either way record the part with identity submitSubjectDataPart (r13 review B-01, CHG-R14M-001)'
  idempotencyKey: approvalRequestId
