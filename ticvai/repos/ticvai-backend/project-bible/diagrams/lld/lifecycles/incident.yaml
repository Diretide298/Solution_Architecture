notes: 'Escalation is not a status: it is `escalation` on an incident under investigation, set by updateIncident
  `escalate` and logged as a note row (CHG-RUL-011). Every status change, escalation and reopen appends
  a row to `IncidentDetail.investigationNotes` with the status before and after and the reason. A recurring
  incident that is a new event is still a new incident with a link to the old one; reopening is for
  an incident closed too soon.'
