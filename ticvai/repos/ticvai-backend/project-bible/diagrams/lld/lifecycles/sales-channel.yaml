notes: '**A move this model does not allow is `409 invalid-channel-transition`** (for example `activate`
  from `draft`; ADAM CR-211, option A, decided 25 October 2026; CHG-R10CAT-003).


  **A channel is created `draft` by `createChannelProfile`** and never deleted; a channel that stops
  trading stays `suspended`, which keeps its history, allocations and audit reachable. There is no terminal
  state by design.'
