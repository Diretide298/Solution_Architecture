description: One rollout of one gate configuration version to one target set (decided 29 September,
  VM close-out; pack Access Control Module p.82, BO-203). Same vocabulary as `tenancy.ProfileDeployment`,
  so a partial failure is visible and retried or rolled back. **Deploying the same version again is
  a new deployment**, which is why `publishHardwareDeployment` is a POST.
