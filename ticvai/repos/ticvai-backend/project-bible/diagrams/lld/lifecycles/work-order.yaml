- from: paused
  to: inProgress
  operation: resumeWorkOrder
  trigger: operation
  guard: Resumed
- from: inProgress
  to: awaitingParts
  operation: pauseWorkOrder
  trigger: operation
  guard: Blocked on a part. Distinct from paused — one is a person, the other is supply
- from: awaitingParts
  to: inProgress
  operation: resumeWorkOrder
  trigger: operation
  guard: Part received
- from: inProgress
  to: completed
  operation: completeWorkOrder
