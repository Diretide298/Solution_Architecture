id: HLD-LIFECYCLES
sourceFiles:
  folder: states/
  files: 114
  drawn: 113
  skipped:
  - _schema.yaml
  why: '**`_schema.yaml` is the shape, not a model.** Every state file validates against it; it has
    no entity and no transitions.'
title: 113 state models and 29 events
generatedBy: tools/derive-diagrams.py
index: diagrams/hld/00-platform.yaml
about: '**What can happen to a thing, and in what order.** A state model is a lifecycle within one entity;
  an event is a lifecycle crossing between two.


  **223 of 1,014 operations are named by a transition** — a quarter of the API is a state change somewhere,
  and the rule that a critical finding cannot be signed by whoever raised it lives here and nowhere
  else.'
naming: '**Called `domain` in the viewer, which names a methodology rather than a subject.** Every other
  layer names a thing a reader recognises. `Lifecycles` covers both halves and says what question it
  answers.'
