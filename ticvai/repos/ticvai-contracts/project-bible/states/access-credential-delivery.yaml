# Access credential delivery — state model
# Contract: access.AccessCredentialDelivery.status
# Checked by tools/check-states.py.

entity: AccessCredentialDelivery
contract: access
enum: AccessCredentialDelivery.status
enumKind: inline
enumSchema: AccessCredentialDelivery
enumProperty: status
owner: access
description: One delivery attempt of a credential over one channel (declared 29 September, writers pass).
  `deliverCredential` creates the attempt `pending`; the dispatch job moves it from there on provider
  receipts. **Each call is a new attempt with its own status**, so a re-send never reopens a finished
  row, which is why every outcome is terminal.
initial:
- pending
- notRequired
terminal:
- completed
- failed
- bounced
- expired
- cancelled
- notRequired
transitions:
- from: pending
  to: sent
  trigger: job
  guard: The dispatch job handed the credential to the channel provider (email, SMS, WhatsApp, wallet)
- from: pending
  to: failed
  trigger: job
  guard: The provider refused the message or the destination is invalid; a `deliveryFailed` credential
    exception is raised
- from: pending
  to: completed
  trigger: job
  guard: A hand-over channel (`pos`, `boxOffice`, `kiosk`, `physicalCollection`, `download`, `api`)
    recorded the credential as handed over
- from: pending
  to: cancelled
  trigger: cascade
  guard: The credential was replaced (`replaceCredential`) or revoked before the attempt was dispatched
- from: sent
  to: delivered
  trigger: job
  guard: The provider reported delivery to the destination
- from: sent
  to: bounced
  trigger: job
  guard: The provider reported a hard bounce; a `deliveryFailed` credential exception is raised
- from: sent
  to: failed
  trigger: job
  guard: The provider reported the message undeliverable after its own retries
- from: sent
  to: expired
  trigger: timer
  guard: The delivery link expired without a delivery receipt
- from: delivered
  to: openedDownloaded
  trigger: job
  guard: The recipient opened the link or downloaded the credential or wallet pass (`openedAt` set)
- from: delivered
  to: completed
  trigger: job
  guard: The channel reports no open event (wallet push, SMS without tracking) and the provider marked
    the delivery complete
- from: delivered
  to: expired
  trigger: timer
  guard: The delivery link expired unopened
- from: openedDownloaded
  to: completed
  trigger: job
  guard: The credential was saved to the device or wallet
openQuestions: null
notes: '**`notRequired` rows are written by the issuance job** for a credential that needs no delivery
  (Face Pass, media handed over at the counter); `deliverCredential` always writes `pending`. **Every outcome is terminal.** A failed, bounced or expired attempt is followed by another
  `deliverCredential` call, which writes a new row; the old one stays as the history the delivery
  screen shows.'
