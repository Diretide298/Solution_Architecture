# Registered device — state model
# Contract: tenancy.RegisteredDevice.status
# Checked by tools/check-states.py.

entity: Registered device
contract: tenancy
enum: RegisteredDevice.status
enumKind: inline
enumSchema: RegisteredDevice
enumProperty: status
owner: tenancy
initial:
- offline
terminal: []
transitions:
- from: offline
  to: online
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: Reported in
  emits:
  - device.statusChanged
- from: online
  to: offline
  trigger: timer
  guard: '**No heartbeat within the window.** Not an error — a scanner in a locker overnight is offline
    and fine'
  emits:
  - device.statusChanged
- from: online
  to: error
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: The device reported a fault itself
  emits:
  - device.statusChanged
- from: online
  to: consumableLow
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: '**Paper, ribbon, battery.** A wristband printer that runs out at 10am on a Saturday closes
    a gate'
  emits:
  - device.statusChanged
- from: consumableLow
  to: online
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: Replenished
  isReversal: true
  emits:
  - device.statusChanged
- from: error
  to: online
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: Cleared
  isReversal: true
  emits:
  - device.statusChanged
- from: online
  to: needsAttention
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: Working but degraded — a failing scanner head
  emits:
  - device.statusChanged
- from: needsAttention
  to: online
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: Serviced
  isReversal: true
  emits:
  - device.statusChanged
- from: online
  to: localMode
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: '**An access-control device validating from its offline package** with its link to the platform down
    (ADR-0067, 1 October: the access register''s health merged into this one). Reported when the link returns,
    so the move is recorded late and is still true'
  emits:
  - device.statusChanged
- from: localMode
  to: online
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: The link to the platform is back; the offline scans it queued sync
  isReversal: true
  emits:
  - device.statusChanged
- from: localMode
  to: offline
  trigger: timer
  guard: The device stopped reporting altogether
  emits:
  - device.statusChanged
- from: offline
  to: localMode
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: The device reconnected and reports it ran in local mode while unreachable
  emits:
  - device.statusChanged
- from: offline
  to: unknown
  trigger: timer
  guard: '**Silent long enough that offline is no longer the explanation.** Lost, stolen, or decommissioned
    without telling anyone'
  emits:
  - device.statusChanged
- from: unknown
  to: online
  operation: recordDeviceHeartbeat
  trigger: operation
  guard: Reappeared
  isReversal: true
  emits:
  - device.statusChanged
notes: '**No terminal state, which is deliberate.** A device is never finished — it is somewhere, in
  some condition, and the model has to represent "we have not heard from it in three weeks" without
  deciding what that means.


  `consumableLow` is the state that prevents an outage rather than reporting one.


  **One health model for every device since ADR-0067 (1 October).** `access.access_device` carried its own
  health (`healthy`, `active`, `degraded`, `offline`, `localMode`, `states/access-device-status.yaml`, removed
  with it). `offline` is the same state here; `localMode` joins this model; `healthy` and `degraded` are
  `health`, which is computed rather than reported; component readings are `scannerHealth`,
  `controllerHealth` and `cameraHealth` on the register.'
