id: F111
name: 'Access Control board 1: Access Control Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Access Control board 1. **This route is read from the screens'
    own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-144
  entryPoints:
  - Arrives at Access Control Command Center
steps:
- step: 1
  screen: BO-144
  action: Opens Access Control Command Center
  operations:
  - listAccess
  outcome: Central operational/configuration landing page for the complete Access Control module.
- step: 2
  screen: BO-145
  action: Works in Venue & Park Access Structure
  operations:
  - listVenueParkAccess
  outcome: Define the highest-level physical access hierarchy.
- step: 3
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-146
  action: Works in Access Area & Zone Builder
  operations:
  - setAccessAreaZone
  outcome: Divide a venue into controlled access areas.
- step: 5
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-147
  action: Works in Attraction Access Configuration
  operations:
  - setAttractionAccess
  outcome: Configure attractions as access-controlled destinations.
- step: 7
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-148
  action: Works in Access Point Directory
  operations:
  - listAccessPoints
  outcome: Create the logical access points where validation occurs. An Access Point is different from
    a physical reader/device.
- step: 9
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-149
  action: Works in Gate & Lane Configuration
  operations:
  - setGateLane
  outcome: Configure individual physical gates/lanes.
- step: 11
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-150
  action: Works in Access Control Graphical Map Designer
  operations:
  - setAccessGraphicalMap
  outcome: Create a graphical digital twin of the access-control environment.
- step: 13
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-151
  action: Works in Access Location Grouping
  operations:
  - listAccessLocationGrouping
  outcome: Group multiple access points for operational and capacity purposes.
- step: 15
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-152
  action: Works in Operating Calendar & Special Access Days
  operations:
  - listOperatingCalendarSpecial
  outcome: Allow access topology and operating behavior to change by date/time.
- step: 17
  screen: BO-144
  action: Returns to the board's landing screen
  operations:
  - listAccess
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-153
  action: Works in Topology Validation & Publication
  operations:
  - publishTopologyValidation
  outcome: 'Final validation and controlled deployment of access configuration. Before publication, TICVAI
    automatically validates: orphan gates devices without access points access points without zones incorrect
    entry/exit direction missing offline configuration conflicting operating calendars inaccessible zones
    missing emergency configuration capacity inconsistencies missing reader/device association policy
    dependencies.'
branches:
- at: 1
  condition: Nothing has been set up on Access Control Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Access Control board 1 visited
primaryContract: access
contracts:
- access
