$schema: ./_schema.yaml
id: F49
name: A guest plans a day and follows it
actor: guest
capability: Itinerary planning
wave: 4
deferred:
  release: later
  decided: '2026-09-28'
  decision: R187
  reason: The itinerary planner is deferred to a later release and its five screens leave Block A,
    since no itinerary schema, operation, table or on-device store exists to build them against.
frequency: Routine.
criticality: revenue
primaryContract: ai
contracts:
- ai
- catalogue
- queue
platforms:
- P02
trigger:
  description: A guest with a whole day and too many options. **Planning is the feature a venue sells
    a full-day ticket on.**
offlineBehaviour: '**A saved itinerary reads offline; building one does not.** The plan is worth having
  in a basement; making it needs availability nobody can cache.'
steps:
- step: 1
  screen: GST-051
  action: They start planning.
  operations:
  - listProducts
  outcome: What is on, and when.
- step: 2
  screen: GST-052
  action: Suggested itineraries are offered.
  operations:
  - listProducts
  outcome: '**Seeded, not generated, on day one.** A venue with no history has nothing to learn from,
    and a suggestion built on nothing is worse than a curated list.'
  crossesDevice: true
- step: 3
  screen: GST-053
  action: They build their own instead.
  operations:
  - listProducts
  outcome: '**Availability at build time, not at save time.** A plan that books nothing is a plan the
    venue cannot honour.'
  crossesDevice: true
- step: 4
  screen: GST-054
  action: An optimised order is proposed.
  operations:
  - listProducts
  - getWaitTimes
  outcome: '**No AI suggestion for an itinerary** (decided 28 September, audit R209): the planner is deferred
    (R187) and `requestSuggestion` has no guest itinerary kind; `scenario` is staff-only. The later release
    decides how an order is proposed.'
  crossesDevice: true
- step: 5
  screen: GST-059
  action: They follow it through the day.
  operations:
  - getWaitTimes
  outcome: '**Re-ordered as waits change.** A plan fixed at 9am is a plan abandoned by 11.'
  crossesDevice: true
exitStates:
- state: followed
  description: Planned and largely followed.
- state: abandoned
  description: '**Plans are abandoned constantly and that is normal** — the value is in what was attempted.'
branches:
- at: 4
  condition: There is not enough history to optimise.
  behaviour: '**Refused with a reason**, naming what is missing. A confident itinerary built on nothing
    teaches a guest not to trust the next one. (The mechanism is the later release''s to choose; not
    `requestSuggestion`, audit R209.)'
  severity: medium
  resolvedBy: Later release
notes: '**Written 24 August.** Five screens. **Deferred to a later release on 28 September** (audit R187):
  all five screens (GST-051 to GST-054, GST-059) carry a `deferred` block, and neither this flow nor
  its screens count toward Block A. `GST-054` no longer calls `requestSuggestion` (audit R209).'
openQuestions: null
