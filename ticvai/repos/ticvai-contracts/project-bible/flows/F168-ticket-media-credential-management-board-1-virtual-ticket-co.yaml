id: F168
name: 'Ticket Media   Credential Management board 1: Virtual Ticket Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Ticket Media   Credential Management board 1. **This route
    is read from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-334
  entryPoints:
  - Arrives at Virtual Ticket Command Center
steps:
- step: 1
  screen: BO-334
  action: Opens Virtual Ticket Command Center
  operations:
  - listVirtualTicket
  outcome: Provide administrators and operations teams with a centralized view of all Virtual Tickets
    and their associated media across TICVAI. This is the primary administrative entry point into the
    Virtual Ticket architecture.
- step: 2
  screen: BO-335
  action: Works in Virtual Ticket Identity & Master Record Configuration
  operations:
  - setVirtualTicketIdentity
  outcome: Define the authoritative Virtual Ticket object used throughout TICVAI. This screen is extremely
    important because the Virtual Ticket—not the QR/RFID/card— is the master ticket record.
- step: 3
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-336
  action: Works in Virtual Ticket Status & Lifecycle Model
  operations:
  - listVirtualTicketStatus
  outcome: Configure the standardized lifecycle of a Virtual Ticket independently from the lifecycle of
    individual media.
- step: 5
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-337
  action: Works in Media Type & Credential Technology Registry
  operations:
  - listMediaTypeCredential
  outcome: Maintain the centralized catalogue of credential technologies supported by TICVAI. This makes
    the credential architecture extensible rather than hard-coded.
- step: 7
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-338
  action: Works in Multi-Media Binding & Association Rules
  operations:
  - listMultiMediaBinding
  outcome: Configure how one Virtual Ticket can be associated with multiple media simultaneously. This
    is one of the most important screens in Area 15.
- step: 9
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-339
  action: Works in Credential Identity, Token & Reference Mapping
  operations:
  - listCredentialIdentityToken
  outcome: Define how individual media identifiers resolve securely back to the authoritative Virtual
    Ticket.
- step: 11
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-340
  action: Works in Entitlement & Cross-Media Synchronization Rules
  operations:
  - listEntitlementCrossMedia
  outcome: Ensure all media attached to a Virtual Ticket share the same authoritative ticket and entitlement
    state.
- step: 13
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-341
  action: Works in Media Activation, Priority & Fallback Rules
  operations:
  - listMediaActivationPriority
  outcome: Configure when each credential becomes active and how alternative media behave if the preferred
    credential cannot be used.
- step: 15
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-342
  action: Works in Media Replacement, Revocation & Rebinding Rules
  operations:
  - listMediaReplacementRevocation
  outcome: Configure controlled handling of lost, stolen, damaged, compromised or replaced credential
    media.
- step: 17
  screen: BO-334
  action: Returns to the board's landing screen
  operations:
  - listVirtualTicket
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-343
  action: Works in Virtual Ticket Architecture Testing, Governance & Audit
  operations:
  - listVirtualTicketArchitecture
  outcome: Provide the final testing and governance environment for Virtual Ticket and multi-media configurations.
    Board 1 established what the Virtual Ticket is and how multiple credentials can point to the same
    authoritative ticket. Board 2 defines how each media type is created, designed, configured, branded,
    populated with data, previewed, tested and published.
branches:
- at: 1
  condition: Nothing has been set up on Virtual Ticket Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Ticket Media   Credential Management board 1 visited
primaryContract: access
contracts:
- access
