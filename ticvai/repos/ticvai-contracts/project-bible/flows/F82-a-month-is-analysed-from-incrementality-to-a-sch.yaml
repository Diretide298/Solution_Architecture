    than broken.'
  severity: medium
  resolvedBy: getModuleEnablement
exitStates:
- state: completed
  description: The chain ran as the client drew it.
- state: stoppedAtModule
  description: '**A licence boundary, not a failure.**'
notes: '**Retail board 6 as drawn.** ReportingService sat at 14% coverage — the lowest but one — and
  this is the chain the client themselves laid out. **Derived from the client''s own `GOES TO` edges**,
  not from an inferred path — a pair of frames the client linked is evidence; a chain assembled from
  unrelated pairs is a guess.'
openQuestions: null
