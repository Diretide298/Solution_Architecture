      x-ticvai-permission: ACCREDITATION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationHolder'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationHolder'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-documents:
    get:
      operationId: listAccreditationDocuments
      x-ticvai-consumed-by:
        - "P08 BO-615 Accreditation Command Center"
        - "P08 BO-629 Document Repository"
        - "P08 BO-630 Document Verification Queue"
        - "P08 BO-636 Application Review Workspace"
        - "P08 BO-672 Expiry Monitor & Expiration Rules"
        - "P11 ACC-007 Reviewer Application Detail"
      x-ticvai-agreed: '29 September: build pass, BL-180 (12.1.18, 12.1.19); pack ACCREDITATION.pdf pages 14-15
        (BO-629, BO-630); P11 ACC-007 listAccreditationDocuments gap; shape follows listAccreditationApplications'
      summary: Documents supplied, by holder, application, requirement or state
      description: '12.1.18 and 12.1.19. **Documents could be submitted and verified and never read back**, so
        a reviewer had no `documentId` to verify and the repository had nothing to show.


        By `applicationId` for the reviewer deciding one application, by `holderId` for the repository, and
        `status=submitted` for the verification queue, oldest first, because a queue served newest first is
        one where the first document in waits longest. Each carries the requirement it satisfies, its asset,
        its own expiry and who verified or refused it and why; `expiringWithinDays` finds the insurance
        certificates that will lapse before the accreditation does.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: applicationId
        in: query
        schema:
          type: string
          format: uuid
      - name: holderId
        in: query
        schema:
          type: string
          format: uuid
      - name: requirementCode
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - submitted
          - verified
          - rejected
          - expired
      - name: expiringWithinDays
        in: query
        schema:
          type: integer
          minimum: 0
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Documents — by `submittedAt` ascending for `status=submitted` (the queue), descending
            otherwise, then `id`; the cursor is keyset on that pair
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AccreditationDocument'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: submitAccreditationDocument
      x-ticvai-consumed-by:
        - "P08 BO-629 Document Repository"
        - "P11 ACC-002 Registration Form"
        - "P11 ACC-004 Application Status Tracking"
      x-ticvai-conflict-policy: append
      security:
      - guestAuth: []
      - bearerAuth: []
      summary: Supply a document against a requirement
      description: 'Boards 2.5 and 2.6. **A document is submitted against a named requirement**, not
        into a folder. Otherwise a verification queue is a pile of files somebody has to open to find
        out what each one is for.

        Carries its own expiry, because an insurance certificate valid until March accredits somebody
        until March whatever the programme says.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_APPLY
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationDocument'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationDocument'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-documents/{documentId}/verify:
