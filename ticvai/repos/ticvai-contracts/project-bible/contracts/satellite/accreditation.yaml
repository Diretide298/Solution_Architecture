        content:
          application/json:
            schema:
              type: object
              required:
              - channel
              properties:
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - holderApp
                activateOnDelivery:
                  type: boolean
                  default: false
                  description: Set `activatedAt` when the holder opens the credential, rather than at issue
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Queued for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationCredentialDelivery'
        '409':
          description: Not a mobile or QR credential, or not issued or active
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: The holder has no email or phone for the chosen channel
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-credentials/verify:
    get:
      operationId: verifyAccreditationCredential
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P07 SCN-003 Ready to scan"
      x-ticvai-agreed: '29 September: build pass, BL-181 (18.8.3 staff verifying a presented accreditation);
        shape follows access lookupTicket'
      summary: Who holds this credential, and where may they go
      description: '18.8.3. **A steward handed an accreditation had nothing to check it against.**
        `access.validateAccess` answers about tickets; this answers about the person: name, photograph,
        organisation, category, the zones they may enter now, and whether the accreditation and this
        credential are valid today.


        `identifier` is what the credential presents — the `encodedIdentifier` read from a QR, NFC or RFID
        credential, or the `serialNumber` printed on a badge and typed in. `zoneId`, when given, answers
        whether this holder may enter that zone at this moment under their access profile schedule and any
        exception. **Read-only, like `lookupTicket`**: it records no scan, admits nobody and changes nothing;
        admitting at a gate stays with `access.validateAccess`. A replaced, lost, revoked or expired
        credential is returned with that `outcome` and the holder is still shown, so the steward can see why.
        An identifier nothing matches is `404`.

        **Offline, the gate answers from the access package** (29 September, build; BL-181). `access` keeps
        every issued credential and every holder status change it hears (`accreditation.credentialIssued`,
        `accreditation.holderStatusChanged`) in `access.accreditation_credential` and ships the admitting ones
        in `getOfflinePackage` (`accreditationCredentials`), so `validateAccess` admits or refuses an accredited
        person without a network. This read, with the photograph and organisation, needs one.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: identifier
        in: query
        required: true
        schema:
          type: string
          maxLength: 256
      - name: zoneId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The holder, the credential and what it permits now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationCredentialVerification'
        '400':
          description: No identifier supplied
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-holders/{holderId}/renew:
    parameters:
    - name: holderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: renewAccreditation
      x-ticvai-consumed-by:
        - "P08 BO-672 Expiry Monitor & Expiration Rules"
        - "P08 BO-673 Accreditation Renewal Workspace"
        - "P11 ACC-005 Accreditation Badge"
      x-ticvai-conflict-policy: serverWins
      security:
      - guestAuth: []
      - bearerAuth: []
      x-ticvai-agreed: '29 September: build pass, BL-180 (12.1.37); pack ACCREDITATION.pdf page 53 (BO-673
        "without unnecessarily recreating the holder or application"); shape follows createAccreditationApplication'
      summary: Renew a holder's accreditation for another period
      description: '12.1.37. **Renewal keeps the holder and looks again**; it does not create a second person.
        Opens a renewal application (`renewsHolderId`) against the holder''s programme, prefilled from the
        holder and their documents still in date.


        Where the programme''s `AccreditationValidity.renewalRequiresReverification` is true the application
        is `submitted` and reviewed like any other, and approval extends the same holder''s `validTo` by the
        programme''s validity. Where it is false the renewal is approved at once, the holder''s validity is
        extended and the application records it — **either way there is a record of who renewed whom**.
        Credentials stay the same; wallet passes are pushed with the new validity.


        Only inside the renewal window (`renewalWindowDays` before `validTo`, or during a grace period) and
        only for an `active` or `expired` holder (`409`); a `revoked` holder applies afresh. A guest may renew
        only their own accreditation (`403`).

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_APPLY
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryCode:
                  type: string
                  nullable: true
                  description: A different category for the new period, where the programme allows it
                subject:
                  type: object
                  additionalProperties: true
                  nullable: true
                  description: Answers that changed since the last period
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The renewal application — submitted, or approved where no reverification is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationApplication'
        '403':
          description: A guest renewing an accreditation that is not theirs
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: Outside the renewal window, the holder is revoked, suspended or archived, or a renewal
            is already open
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-exports:
    get:
      operationId: listAccreditationExports
      x-ticvai-consumed-by:
        - "P08 BO-682 Accreditation Export & Data Extract Center"
      x-ticvai-agreed: '29 September: build pass, BL-180 (12.1.55); pack ACCREDITATION.pdf page 61 (BO-682
        columns requested by, date, filters, fields, records, status); shape follows listAccreditationAudit'
      summary: Exports taken, by whom, of what
      description: '**A spreadsheet of accredited people leaving the platform is an event someone should own.**
        The history BO-682 shows: who asked, when, with which filters and fields, how many records, and
        whether personal data went with it.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Exports, newest first — by `requestedAt` descending, then `id`; the cursor is keyset on
            that pair
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AccreditationDataExport'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: exportAccreditationData
      x-ticvai-consumed-by:
        - "P08 BO-682 Accreditation Export & Data Extract Center"
      x-ticvai-conflict-policy: serverWins
      x-ticvai-agreed: '29 September: build pass, BL-180 (12.1.55); pack ACCREDITATION.pdf page 61 (BO-682);
        shape follows reporting exportReportResult'
      summary: Export holders, applications, credentials or access assignments
      description: '12.1.55. **Asynchronous.** Returns the export `queued`; `getAccreditationExport` gives the
        signed, expiring download link once it is `ready`.


        One `dataset` per export, filtered by programme, status, organisation, category and the date the
        accreditation must be valid on, as `csv` or `xlsx`. The base export carries names, accreditation
        numbers, organisation, category, status, validity and zones — the register a security team is handed
        before a performance. **Contact details, date of birth, nationality and document references come only
        with `includePersonalData`**, which needs `REPORT_EXPORT_PII` (`403` without it) and a `purpose`
        (`422` without one), and is written to the accreditation audit trail.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_MANAGE
      x-ticvai-permission-escalated: REPORT_EXPORT_PII
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationDataExport'
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Export queued. Poll `getAccreditationExport` until it is `ready`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationDataExport'
          links:
            pollExport:
              operationId: getAccreditationExport
              parameters:
                exportId: $response.body#/id
              description: Export status, and the download link once ready.
        '403':
          description: Personal data requested without REPORT_EXPORT_PII
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: Personal data requested without a purpose
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-exports/{exportId}:
    parameters:
    - name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getAccreditationExport
      x-ticvai-consumed-by:
        - "P08 BO-682 Accreditation Export & Data Extract Center"
      x-ticvai-agreed: '29 September: build pass, BL-180 (12.1.55); shape follows reporting getReportExport'
      summary: One export, and its download link once ready
      description: 'The download link is signed and expires; an `expired` export is taken again rather than
        its file kept, so a register of personal data does not outlive the reason it was taken.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationDataExport'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (common.yaml bearerAuth). Added 29 September (system-design review SD-054).
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
  schemas:
    AccreditationCredentialDelivery:
      type: object
      x-ticvai-persistence: accreditation.mobile_credential_delivery
      description: '12.1.21. **Issuing a mobile credential and getting it onto a phone are two acts**, and
        the second is recorded so *"I never got it"* has an answer. Written by `deliverAccreditationCredential`
        (the accreditation team sends it) and `issueMyAccreditationWalletPass` (the holder adds it to a
        wallet).

        '
      required:
      - credentialId
      - channel
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        credentialId:
          type: string
          format: uuid
        holderId:
          type: string
          format: uuid
          readOnly: true
        channel:
          type: string
          enum:
          - email
          - sms
          - holderApp
          - appleWallet
          - googleWallet
        destinationMasked:
          type: string
          nullable: true
          readOnly: true
          description: The address or number used, masked (`j***@agency.com`). Always the holder's own
        walletPassSerial:
          type: string
          nullable: true
          readOnly: true
        walletPassUrl:
          type: string
          nullable: true
          readOnly: true
          description: Signed and expiring; adds the pass to the wallet
        status:
          type: string
          readOnly: true
          enum:
          - queued
          - sent
          - delivered
          - opened
          - failed
          - superseded
        failureReason:
          type: string
          nullable: true
          readOnly: true
        requestedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        requestedAt:
          type: string
          format: date-time
          readOnly: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        scopePath:
          type: string
    AccreditationCredentialVerification:
      type: object
      description: '18.8.3. **What a steward needs to believe the person in front of them**: the face, the
        name, the category and the zones, and whether any of it is valid now. Returned by
        `verifyAccreditationCredential`; not stored.

        '
      required:
      - outcome
      properties:
        outcome:
          type: string
          enum:
          - valid
          - notYetValid
          - expired
          - suspended
          - revoked
          - credentialReplaced
          - credentialLost
          - credentialInactive
          description: '`valid` only when the holder is `active`, today is inside the holder''s validity, and
            the credential is `issued` or `active`'
        reason:
          type: string
          nullable: true
        credentialId:
          type: string
          format: uuid
        credentialKind:
          type: string
        credentialStatus:
          type: string
        holderId:
          type: string
          format: uuid
        accreditationNumber:
          type: string
        fullName:
          type: string
        photoAssetId:
          type: string
          format: uuid
          nullable: true
        photoUrl:
          type: string
          nullable: true
          description: Signed and short-lived, so the scan screen can show the face without a second call
        organisationName:
          type: string
          nullable: true
        affiliationRole:
          type: string
          nullable: true
        programmeId:
          type: string
          format: uuid
        categoryCode:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        holderStatus:
          type: string
        validFrom:
          type: string
          format: date
          nullable: true
        validTo:
          type: string
          format: date
          nullable: true
        effectiveZones:
          type: array
          description: The zones the holder may enter under their profiles and exceptions, today
          items:
            type: object
            properties:
              zoneId:
                type: string
                format: uuid
              zoneName:
                type: string
              allowedNow:
                type: boolean
                description: Inside the profile schedule (date, day, time, event phase) at this moment
        escortRequired:
          type: boolean
        zoneCheck:
          type: object
          nullable: true
          description: Present when `zoneId` was given
          properties:
            zoneId:
              type: string
              format: uuid
            allowed:
              type: boolean
            reason:
              type: string
              nullable: true
        checkedAt:
          type: string
          format: date-time
    AccreditationDataExport:
      type: object
      x-ticvai-persistence: accreditation.data_export
      description: '12.1.55. **A spreadsheet of accredited people leaving the platform is an event someone
        should own.** Requested by `exportAccreditationData`, listed for BO-682, and fetched once `ready`.

        '
      required:
      - dataset
      - format
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        dataset:
          type: string
          enum:
          - holders
          - applications
          - credentials
          - accessAssignments
          - documents
        format:
          type: string
          enum:
          - csv
          - xlsx
        programmeId:
          type: string
          format: uuid
          nullable: true
        statusFilter:
          type: string
          nullable: true
        organisationId:
          type: string
          format: uuid
          nullable: true
        categoryCode:
          type: string
          nullable: true
        validOn:
          type: string
          format: date
          nullable: true
          description: Only accreditations valid on this date — the register for one performance
        fields:
          type: array
          description: The columns wanted. Omitted means the dataset's standard set
          items:
            type: string
        includePersonalData:
          type: boolean
          default: false
          description: Contact details, date of birth, nationality and document references. Requires
            REPORT_EXPORT_PII and a purpose; recorded in the accreditation audit trail
        purpose:
          type: string
          maxLength: 500
          nullable: true
        requestedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        requestedAt:
          type: string
          format: date-time
          readOnly: true
        recordCount:
          type: integer
          nullable: true
          readOnly: true
        status:
          type: string
          readOnly: true
          enum:
          - queued
          - running
          - ready
          - failed
          - expired
        downloadUrl:
          type: string
          nullable: true
          readOnly: true
          description: Signed and expiring
        expiresAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        scopePath:
          type: string

    AccreditationProgramme:
      type: object
      x-ticvai-persistence: accreditation.programme
      description: 'Boards 1.5 and 1.6. **The thing an application is made against.**'
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        venueIds:
          type: array
          items:
            type: string
            format: uuid
        eventIds:
          type: array
          items:
            type: string
            format: uuid
        categories:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              defaultAccessProfileId:
                type: string
                format: uuid
                nullable: true
              quota:
                type: integer
                nullable: true
                description: '**A cap on how many may be accredited in this category.** Without one,
                  a category is a promise nobody counted.

                  '
              badgeTemplateId:
                type: string
                format: uuid
                nullable: true
                description: The badge printed for this category; travels with the category when a programme
                  is cloned
        applicantTypes:
          type: array
          items:
            type: string
        applicationsOpenAt:
          type: string
          format: date-time
          nullable: true
        applicationsCloseAt:
          type: string
          format: date-time
          nullable: true
        approvalWorkflowId:
          type: string
          format: uuid
          nullable: true
        formId:
          type: string
          format: uuid
          nullable: true
          description: '12.1.2. The `marketing-crm` form definition (`createForm`, BO-618) the applicant
            fills in. The requirements matrix''s `field` rows name the form fields they check, so the form
            is configured without software development and what blocks approval stays in one place.

            '
        isTemplate:
          type: boolean
          default: false
          description: '12.1.56. **A reusable programme template**: never opened for applications, and what
            `cloneAccreditationProgramme` copies its categories, requirements, validity, notification rules
            and form link from.

            '
        templateProgrammeId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The programme or template this one was cloned from
        status:
          type: string
          enum:
          - draft
          - open
          - closed
          - archived
        faceMatching:
          type: object
          description: '**Face matching for duplicate applicants: only where the venue enables it, with each
            applicant''s consent and the venue''s legal sign-off; off by default** (Chinmay, 2 October, workbook Q461;
            ADR-0063; CHG-CSA-031). With `enabled` false, identity conflicts are raised on names, dates of birth and
            documents only and never on a face, and BO-631 shows no Face chip. Enabling needs `legalSignOffRef`
            (the venue''s legal sign-off, recorded with who gave it and when), and a face is compared only for an
            applicant whose application carries a face-matching consent (the programme''s consent form, CHG-CSA-026).'
          properties:
            enabled:
              type: boolean
              default: false
            legalSignOffRef:
              type: string
              nullable: true
              description: The venue's legal sign-off document (a stored file reference).
            signedOffByPrincipalId:
              type: string
              format: uuid
              nullable: true
              readOnly: true
            signedOffAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
        identityVerification:
          type: object
          description: '**UAE Pass and ICP verification, in release 1** (Chinmay, 2 October, workbook Q457; CHG-CSA-031).
            Which government identity checks an applicant passes through: UAE Pass sign-in (identity `guestUaePassLogin`)
            and the ICP identity check (access''s verification adaptor). **Both need the client''s access to the
            government services** (an external dependency); until it is granted, `methods` may name them but the check
            answers `manualReview`.'
          properties:
            methods:
              type: array
              items:
                type: string
                enum:
                - uaePass
                - icp
                - manualReview
            required:
              type: boolean
              default: false
              description: Whether an application is blocked from approval until a listed check passes.
        scopePath:
          type: string
    AccreditationRequirements:
      type: object
      x-ticvai-persistence: accreditation.requirements
      description: 'Board 1.8. **Blocking submission and blocking approval are not the same.**'
      properties:
        programmeId:
          type: string
          format: uuid
        rows:
          type: array
          items:
            type: object
            properties:
              applicantType:
                type: string
              categoryCode:
                type: string
                nullable: true
              requirementCode:
                type: string
              label:
                type: string
              kind:
                type: string
                enum:
                - document
                - field
                - photo
                - backgroundCheck
                - training
                - declaration
                - payment
              blocksSubmission:
                type: boolean
                default: false
              blocksApproval:
                type: boolean
                default: true
              expiryMonths:
                type: integer
                nullable: true
              formFieldKey:
                type: string
                nullable: true
                description: For a `field` row, the key of the field on the programme's form that it checks
              fieldType:
                type: string
                nullable: true
                description: 12.1.2. For a `field` row, what kind of answer it takes
                enum:
                - text
                - email
                - phone
                - date
                - country
                - number
                - boolean
                - singleChoice
                - multipleChoice
              visibility:
                type: string
                default: mandatory
                description: Pack page 5 (BO-618) — mandatory, optional, conditional on another answer, or hidden
                enum:
                - mandatory
                - optional
                - conditional
                - hidden
              condition:
                type: object
                nullable: true
                description: For `conditional`, the answer that makes this row apply
                properties:
                  requirementCode:
                    type: string
                  equals:
                    type: string
              validation:
                type: object
                nullable: true
                description: Checked on save and on submit; a failing answer is refused with the row's label
                properties:
                  pattern:
                    type: string
                    nullable: true
                  minLength:
                    type: integer
                    nullable: true
                  maxLength:
                    type: integer
                    nullable: true
                  minValue:
                    type: number
                    nullable: true
                  maxValue:
                    type: number
                    nullable: true
                  allowedValues:
                    type: array
                    items:
                      type: string
        scopePath:
          type: string
    AccreditationApplication:
