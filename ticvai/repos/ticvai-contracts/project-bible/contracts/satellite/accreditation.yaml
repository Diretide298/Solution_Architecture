      x-ticvai-consumed-by:
        - "P08 BO-627 Identity Details & Verification"
        - "P08 BO-628 Photo Management"
        - "P08 BO-632 Organization & Affiliation Management"
      x-ticvai-conflict-policy: serverWins
      summary: Amend identity, affiliation or contact details
      tags:
