openapi: 3.1.0
info:
  title: TICVAI — Accreditation
  version: 1.0.0
  x-ticvai-screen-count: 47
  x-ticvai-tier: satellite
  x-ticvai-module: 12 — Accreditation & Credential Management
  x-ticvai-platforms:
  - P11 Accreditation Web
  - P08 Venue Management
  description: '**Accreditation is the opposite of ticketing, and that is why it cannot live in it.**

    A ticket is bought by anyone, is valid for one occasion, and grants entry. **An accreditation is
    applied for, vetted, and granted to a named person for a period, and what it grants is a set of
    places and times that differs for every holder.** A journalist, a contractor, a performer''s
    driver and a sponsor''s guest all hold one and none of them may go where the others may.

    ## Why it is its own context

    **The application is a workflow, not a purchase.** It is submitted with documents, checked
    against requirements that differ by applicant type, reviewed by a person, and approved or
    rejected with a reason and a right of resubmission. `orders` has no shape for any of that.

    **The credential is not the accreditation.** A badge is reprinted, reissued, lost and encoded
    onto NFC; the accreditation behind it survives all of that. Conflating them means a lost badge
    is a lost accreditation, and a re-vetting every time somebody drops one.

    **Access is per holder, not per product.** `access` grants entry on an entitlement somebody
    bought; here the access profile is assembled from the person''s role, their organisation, the
    zones they need, the dates they hold and any temporary exception — and it changes without any
    transaction.

    ## What it deliberately does not own

    **Not the scan.** `access.validateAccess` admits people at gates and turnstiles. This decides
    what an accreditation permits; that enforces it in the moment.

    **Not the approval machinery.** `approvals` owns workflows, matrices, delegation, SLA and the
    tamper-evident decision record. Accreditation review routes through it rather than growing a
    second one.

    **Not the identity.** `identity` owns principals and sessions. An accreditation holder is a
    subject who may never sign in to anything.

    '
