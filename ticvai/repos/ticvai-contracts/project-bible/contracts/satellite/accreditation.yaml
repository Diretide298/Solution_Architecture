      description: 'Boards 1.5, 1.6 and 1.7. **A programme is the thing an application is made
        against** — a season, a tournament, a venue''s standing contractor scheme — and it carries the
        categories within it and the applicant types eligible for each.


        `isTemplate=true` lists the reusable templates `cloneAccreditationProgramme` starts from (12.1.56).

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: isTemplate
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccreditationProgramme'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createAccreditationProgramme
      x-ticvai-consumed-by:
        - "P08 BO-620 Accreditation Program Setup"
      x-ticvai-conflict-policy: serverWins
      summary: Define a programme, its categories and its window
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationProgramme'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationProgramme'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-requirements:
    put:
      operationId: setAccreditationRequirements
      x-ticvai-consumed-by:
        - "P08 BO-621 Applicant Type Configuration"
        - "P08 BO-622 Application Requirements Matrix"
      x-ticvai-conflict-policy: serverWins
      summary: What each applicant type must supply and pass
      description: 'Board 1.8 — the requirements matrix. **Different applicant types are vetted
        differently, and pretending otherwise is why accreditation systems collapse into one enormous
        form.** A contractor needs insurance and a safety induction; a journalist needs a press card;
        a performer''s child needs a guardian.

        **A requirement states whether it blocks submission or blocks approval**, and those are not
        the same. A missing photograph should not stop somebody applying at midnight; a missing
        background check must stop them being approved.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationRequirements'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationRequirements'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-applications:
    get:
      operationId: listAccreditationApplications
      x-ticvai-consumed-by:
        - "P08 BO-615 Accreditation Command Center"
        - "P08 BO-616 Accreditation Application Directory"
        - "P08 BO-623 Accreditation Intake Monitor"
        - "P08 BO-635 Accreditation Review Queue"
        - "P08 BO-640 Rejection & Resubmission Management"
        - "P11 ACC-006 Reviewer Queue"
      summary: Applications, by state and programme
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: programmeId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      - name: applicantType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccreditationApplication'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createAccreditationApplication
      x-ticvai-consumed-by:
        - "P08 BO-617 New Accreditation Application"
        - "P11 ACC-002 Registration Form"
      x-ticvai-conflict-policy: serverWins
      security:
      - guestAuth: []
      - bearerAuth: []
      summary: Apply, or apply on behalf of somebody
      description: 'Board 1.3. **Most accreditations are applied for by an organisation on behalf of
        its people**, not by the people themselves, and a model that assumes self-service leaves a
        production company entering sixty forms by hand.

        Guest-callable so an applicant can complete their own, and staff-callable so a coordinator can
        submit a roster.

        **Runs the identity-conflict check** (decided 29 September, writers pass), the same one
        `importAccreditationHolders` applies: a suspected match with an existing holder is written as a
        `pending` `accreditation.identity_conflict` for `resolveIdentityConflict`, and a pair already `rejected`
        as two different people is not raised again. The application is accepted either way.


        **`status: draft` saves without submitting** (29 September, build pass, 12.1.2): requirements that
        block submission are not checked on a draft, `updateAccreditationApplication` keeps saving it and
        `submitAccreditationApplication` sends it. Any other status in the request is ignored and the
        application is `submitted`, checked against the requirements that block submission (`422`).

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_APPLY
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationApplication'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Submitted, or saved as a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationApplication'
        '422':
          description: Submitted with a requirement that blocks submission unsatisfied
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-applications/{applicationId}/decide:
    parameters:
    - name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: decideAccreditationApplication
      x-ticvai-consumed-by:
        - "P08 BO-635 Accreditation Review Queue"
        - "P08 BO-636 Application Review Workspace"
        - "P08 BO-640 Rejection & Resubmission Management"
        - "P11 ACC-006 Reviewer Queue"
        - "P11 ACC-007 Reviewer Application Detail"
      x-ticvai-conflict-policy: serverWins
      summary: Approve, reject, return for more, or escalate
      description: 'Boards 3.2 and 3.6. **Rejection must carry a reason and a route back.** An
        application refused with no explanation produces a phone call at best and a person turning up
        at a gate at worst, and *"resubmit"* without saying what to change is the same thing slower.

        Routes through `approvals` where the programme configures a workflow — the matrix, delegation,
        SLA and the tamper-evident record all already exist there.


        `reason` and `missingRequirements` are kept on the application, so the applicant reads what to
        change (`listMyAccreditationApplications`) and `resubmitAccreditationApplication` sends it back.
        Publishes `accreditation.applicationDecided`.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_APPROVE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                  - returnForInformation
                  - escalate
                reason:
                  type: string
                  nullable: true
                missingRequirements:
                  type: array
                  items:
                    type: string
                accessProfileId:
                  type: string
                  format: uuid
                  nullable: true
                validFrom:
                  type: string
                  format: date
                  nullable: true
                validTo:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationApplication'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
