    AccreditationIdentityConflict:
      type: object
      x-ticvai-persistence: accreditation.identity_conflict
      description: 'Board 2.7. **One badge revoked and the other still opening doors.**


        **`matchedOn` names `face` only where the programme''s `faceMatching` is enabled** and both applicants
        consented (workbook Q461; CHG-CSA-031).


        **Stored, not recomputed on each read** (data model for the agreed operations, 29 September): a
        suspected pair is raised by `createAccreditationApplication` and `importAccreditationHolders` using
        `marketing-crm`''s identity resolution, and keeps its id and status while somebody decides it, so
        a pair rejected as two different people is not raised again on the next import. Resolved by
        `resolveIdentityConflict` (`pending` to `merged` or `rejected`, decided 29 September, writers pass);
        lifecycle in `states/accreditation-identity-conflict.yaml`.'
      required:
      - id
      - holderIds
      - status
      properties:
        id:
          type: string
          format: uuid
        holderIds:
          type: array
          items:
            type: string
            format: uuid
        score:
          type: number
        matchedOn:
          type: array
          items:
            type: string
        differingAccess:
          type: boolean
        status:
          type: string
          enum:
          - pending
          - merged
          - rejected
        detectedAt:
          type: string
          format: date-time
          readOnly: true
        survivingHolderId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The holder kept when the conflict was merged
        resolutionReason:
          type: string
          maxLength: 500
          nullable: true
          readOnly: true
        resolvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
