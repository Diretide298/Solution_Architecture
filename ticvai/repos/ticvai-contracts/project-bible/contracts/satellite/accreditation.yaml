    post:
      operationId: resolveIdentityConflict
      x-ticvai-consumed-by:
        - "P08 BO-631 Duplicate & Identity Conflict Detection"
      x-ticvai-conflict-policy: serverWins
      x-ticvai-agreed: '29 September: writers pass; board 2.7 (BO-631 Duplicate & Identity Conflict Detection);
        closes DM2 open item (identity_conflict pending with no way out); shape follows verifyAccreditationDocument'
      summary: Decide whether two accreditation records are the same person
      description: '**Takes a suspected pair out of `pending`** (decided 29 September, writers pass). The reviewer
        decides, with a reason, and the decision is kept on the conflict.


        - `merged`: the records are one person. `survivingHolderId` (one of the conflict''s `holderIds`, `422`
        otherwise) keeps the accreditation; the other holders'' applications and documents are re-pointed to it,
        and each other holder goes to `archived` with **every credential invalidated and pushed to the gates
        at once**, as a revocation is, because the point of the check is that one badge must not stay live
        while the other is revoked. The survivor keeps its own access; where `differingAccess` was true the
        reviewer sets it with `setHolderAccess`, never by adding the two profiles together.

        - `rejected`: they are different people. The pair is kept as `rejected` and is not raised again by a
        later application or import.


        Only a `pending` conflict can be resolved (`409`). Transitions in `states/accreditation-identity-conflict.yaml`.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outcome
              - reason
              properties:
                outcome:
                  type: string
                  enum:
                  - merged
                  - rejected
                survivingHolderId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required when outcome is merged; one of the conflict's holderIds
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationIdentityConflict'
        '409':
          description: The conflict is already merged or rejected
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: survivingHolderId missing for merged, or not one of the conflict's holders
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
