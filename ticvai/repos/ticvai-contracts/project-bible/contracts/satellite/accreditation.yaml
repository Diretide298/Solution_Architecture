    - name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: verifyAccreditationDocument
      x-ticvai-consumed-by:
        - "P08 BO-630 Document Verification Queue"
        - "P08 BO-636 Application Review Workspace"
        - "P11 ACC-007 Reviewer Application Detail"
      x-ticvai-conflict-policy: serverWins
      summary: Accept or refuse a submitted document
      description: 'Board 2.6. **The verifier is recorded and so is the refusal reason**, because a
        document refused for being unreadable and one refused for being the wrong document need
        different things from the applicant.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_APPROVE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outcome
              properties:
                outcome:
                  type: string
                  enum:
                  - verified
                  - rejected
                  - illegible
                  - wrongDocument
                  - expired
                reason:
                  type: string
                  nullable: true
                expiresAt:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccreditationDocument'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-identity-conflicts:
    get:
      operationId: listAccreditationIdentityConflicts
      x-ticvai-consumed-by:
        - "P08 BO-615 Accreditation Command Center"
        - "P08 BO-623 Accreditation Intake Monitor"
        - "P08 BO-631 Duplicate & Identity Conflict Detection"
      summary: People who may already be accredited under another record
      description: 'Board 2.7. **The same person accredited twice with different access is the failure
        this exists to prevent** — one badge revoked and the other still opening doors.

        Uses `marketing-crm`''s identity resolution rules rather than a second matcher, because two
        matchers means two answers to whether two people are the same.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccreditationIdentityConflict'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /accreditation-credentials:
    get:
      operationId: listAccreditationCredentials
      x-ticvai-consumed-by:
        - "P08 BO-615 Accreditation Command Center"
        - "P08 BO-644 Credential Issuance Command Center"
        - "P08 BO-645 Credential Generation Workspace"
        - "P08 BO-649 Digital & Mobile Credential Management"
        - "P08 BO-650 NFC & RFID Credential Encoding"
        - "P08 BO-651 Credential Activation & Delivery"
        - "P08 BO-653 Credential Registry & Credential History"
        - "P11 ACC-008 Credential Register"
      summary: Badges and digital credentials issued
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
