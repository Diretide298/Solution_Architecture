        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccreditationCredential'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: issueAccreditationCredential
      x-ticvai-consumed-by:
        - "P08 BO-645 Credential Generation Workspace"
        - "P08 BO-650 NFC & RFID Credential Encoding"
      x-ticvai-conflict-policy: serverWins
      summary: Produce a badge, a mobile credential, or both
      description: 'Boards 4.2, 4.6 and 4.7. **The credential is not the accreditation.** Issuing a
        second one because the first was lost does not re-vet anybody, and revoking one does not
        revoke the access — `revokeAccreditation` does that.

        Encoding for NFC or RFID happens here because the encoded identifier has to be recorded
        against the credential, or a reader presents an id nothing can resolve.


        A `qr` credential (12.1.22) or a `mobileCredential` carries its `encodedIdentifier` in the stated
        `symbology`. Publishes `accreditation.credentialIssued`, so `access` can resolve the identifier at a
        gate; `deliverAccreditationCredential` sends a mobile one to its holder.

        '
      tags:
      - accreditation
      x-ticvai-permission: ACCREDITATION_ISSUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccreditationCredential'
      responses:
        '201':
          headers:
