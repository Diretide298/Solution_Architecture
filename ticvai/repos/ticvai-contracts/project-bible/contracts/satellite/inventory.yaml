        requisitionId: { type: string }
        supplierId: { type: string, format: uuid }
        quotationId: { type: string, format: uuid }
        deliverToLocationId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity, unitPrice]
            properties:
              itemId: { type: string, format: uuid }
              quantity: { type: number, minimum: 0 }
              unit: { type: string }
              unitPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        expectedDelivery: { type: string, format: date }
        note: { type: string, maxLength: 1000 }

    PurchaseOrder:
      x-ticvai-persistence: "inventory.purchase_order + inventory.purchase_order_line"
      type: object
      required: [id, purchaseOrderNumber, supplierId, status, lines, total, createdAt]
      properties:
        id: { type: string }
        purchaseOrderNumber: { type: string }
        requisitionId: { type: string }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        kind:
          type: string
          enum: [standard, blanket, release, rfqAward]
          default: standard
          description: >
            BL-159. **A blanket order is a price and a commitment, not a delivery.** Releases draw
            against it, and modelling each release as its own purchase order loses the contract that
            makes the price valid.
        blanketParentId:
          type: string
          format: uuid
          nullable: true
        contractPriceValidUntil:
          type: string
          format: date
          nullable: true
        rfqId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where this order came from a quotation round. **Keeping the link is what lets a venue
            show it took the best of three**, which is usually the procurement rule rather than a
            preference.
        supplierInvoiceRef:
          type: string
          nullable: true
          description: >
            BL-123. **Purchase orders and goods receipts both existed — the third leg did not.**
            A three-way match with two legs is a two-way match, and it is the supplier invoice that
            carries the price nobody has checked yet.
        matchStatus:
          type: string
          nullable: true
          enum: [unmatched, matched, priceVariance, quantityVariance, bothVariance]
          description: >
            **The variance kinds are separated because they have different owners** — a price
            variance is a buyer's problem and a quantity variance is a receiving one.
        status: { $ref: '#/components/schemas/PurchaseOrderStatus' }
        deliverToLocationId: { type: string, format: uuid }
        lines:
