components:
  schemas:
    CostingMethod:
      type: string
      description: Fixed at item creation. Immutable once movements exist.
      enum: [weightedAverage, fifo, standardCost, lastPurchasePrice]

    CountLine:
      type: object
      x-ticvai-persistence: "inventory.count_line"
      description: >
        Board 5 of the client F&B pack, 24 August. **`startStockCount` and `postStockCount` existed
        and this did not** — a count could be opened and posted and **nothing recorded what was
        counted.**

        **The theoretical quantity is captured at entry, not at post.** Stock moves during a count;
        a variance computed at post time is measured against a different number from the one the
        counter was standing in front of.

        **A line may be entered twice and the second replaces the first.** A counter who miskeys and
        re-counts is the normal case, and a model that refuses the second sends them to a supervisor
        to undo the first.
      required: [id, countId, itemId, countedQuantity]
      properties:
        id: { type: string, format: uuid }
        countId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid, nullable: true }
        batchId: { type: string, format: uuid, nullable: true }
        countedQuantity: { type: number }
        theoreticalQuantity:
          type: number
          description: >
            **Snapshotted at entry.** What the platform believed was there at the moment the counter
            looked.
        uom: { type: string }
        variance: { type: number, readOnly: true }
        variancePercent: { type: number, readOnly: true }
        status: { type: string, enum: [entered, recountRequested, recounted, accepted, rejected] }
        countedByPrincipalId: { type: string, format: uuid }
        countedAt: { type: string, format: date-time }
        note: { type: string, nullable: true }


    SerialisedItem:
      type: object
      x-ticvai-persistence: "inventory.serialised_item"
      description: >
        Retail Board 4 of the client's design set, 20 August. **`StockBatch` was added on 18 August
        with a lot number, and serialisation to the individual item is a step beyond it.**

        A lot answers *which delivery did this come from*. A serial answers *where is this exact
        one* — which is what a jewellery counter, a phone, a ticketed collectible or anything with a
        warranty needs.

        **Most stock is not serialised and should not be.** Turning it on for a 2 AED keyring
        creates a row per keyring, so it is a per-item decision rather than a policy.
      required: [id, itemId, serial, status]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        batchId:
          type: string
          format: uuid
          nullable: true
          description: The batch it arrived in, where the item is both lotted and serialised.
        serial:
          type: string
          description: >
            **Unique within the item, not globally.** Two manufacturers reuse serial numbers and a
            global constraint would refuse the second one.
        locationId: { type: string, format: uuid }
        status: { type: string, enum: [inStock, reserved, sold, returned, damaged, lost, inTransit, warranty] }
        soldOnOrderLineId:
          type: string
          format: uuid
          nullable: true
          description: >
            **The link that makes serialisation worth having.** A warranty claim, a recall and a
            proof of purchase all start with *which sale was this exact item*.
        warrantyUntil: { type: string, format: date, nullable: true }
        receivedAt: { type: string, format: date-time }


    StockBatch:
      type: object
      x-ticvai-persistence: "inventory.stock_batch"
      description: >
        BL-122. **`isPerishable` and `shelfLifeDays` are on the item, so a shelf life is declared
        and never instantiated.** Two deliveries of the same milk arriving a week apart are one
        stock level with one implied expiry, and the older one is invisible.

        **A batch is the instance that actually expires.** Without it, first-expiry-first-out is not
        computable and a venue discovers the problem by smell.
      required: [id, itemId, locationId, quantity, receivedAt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        batchCode: { type: string, nullable: true }
        lotNumber:
          type: string
          nullable: true
          description: >
            The supplier's own reference. **A recall names a lot number**, and an inventory that
            cannot resolve one has to discard everything.
        quantity: { type: number }
        receivedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date, nullable: true }
        supplierId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [available, quarantined, expired, recalled, consumed, written-off] }


    LocationKind:
      type: string
      enum: [mainStore, subStore, kitchen, bar, retailFloor, cellar, transit]

    CreateInventoryItemRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [sku, name, venueId, baseUnit, costingMethod]
      properties:
        sku: { type: string, maxLength: 64 }
        barcode: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        baseUnit:
          type: string
          description: The unit stock is held in. Immutable once movements exist.
        purchaseUnit:
          type: string
          description: How the supplier sells it — a case of 24 against a base unit of one.
        purchaseUnitFactor: { type: number, minimum: 0, default: 1 }
        costingMethod: { $ref: '#/components/schemas/CostingMethod' }
        reorderPoint: { type: number, minimum: 0 }
        reorderQuantity: { type: number, minimum: 0 }
        parLevel: { type: number, minimum: 0 }
        preferredSupplierId: { type: string, format: uuid }
        allowNegativeStock:
          type: boolean
          default: false
          description: >
            True permits issue beyond on-hand. Occasionally needed at a bar mid-service;
            dangerous everywhere else.
        isPerishable: { type: boolean, default: false }
        shelfLifeDays: { type: integer, nullable: true }

    InventoryItem:
      x-ticvai-persistence: "inventory.item"
      allOf:
        - $ref: '#/components/schemas/CreateInventoryItemRequest'
        - type: object
          required: [id, onHand, isActive]
          properties:
            id: { type: string, format: uuid }
            onHand:
              type: number
              description: Derived from movements. Not directly editable.
            onOrder: { type: number }
            inTransit: { type: number }
            available: { type: number }
            averageCost: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            lastPurchasePrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            isBelowReorderPoint: { type: boolean }
            hasMovements:
              type: boolean
              description: True locks costing method and base unit.
            isActive: { type: boolean }

    StockLocation:
      x-ticvai-persistence: "inventory.location"
      type: object
      required: [id, code, name, venueId, kind]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        venueId: { type: string, format: uuid }
