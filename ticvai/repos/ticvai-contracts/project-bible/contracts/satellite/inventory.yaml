      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Draft requisitions from reorder points
      description: >
        Items below their reorder point, with suggested quantities from par level and recent
        consumption. A draft for a storekeeper to review — **never raised automatically**,
        because an automatic order against a miscounted item compounds the error.
      tags: [requisition]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: locationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: '#/components/schemas/RequisitionSuggestion' }

  /requisitions/{requisitionId}/reject:
    parameters:
      - name: requisitionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rejectRequisition
      x-ticvai-consumed-by:
        - "P08 BO-078 Requisitions"
      x-ticvai-audience: [staff]
      summary: Reject a requisition
      description: >
        Refused with a reason. The requester may copy it into a new draft rather than losing the detail.
      tags: [procurement]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /requisitions/{requisitionId}/return:
    parameters:
      - name: requisitionId
        in: path
        required: true
        schema: { type: string }
