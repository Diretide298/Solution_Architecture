      tags: [procurement]
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /requisitions/{requisitionId}/cancel:
    parameters:
      - name: requisitionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelRequisition
      x-ticvai-consumed-by:
        - "P08 BO-078 Requisitions"
      x-ticvai-audience: [staff]
      summary: Cancel a requisition
