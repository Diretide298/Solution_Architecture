    ResourceSchedule:
      type: object
      x-ticvai-persistence: resources.resource_schedule
      description: 'Boards 2.03 and 2.04. **A recurring pattern with exceptions, not a list of dates.**
        A schedule written as concrete dates silently expires.

        '
      properties:
        resourceId:
          type: string
          format: uuid
        availabilityMode:
          type: string
          enum:
          - alwaysAvailable
          - scheduled
          - onRequest
        windows:
          type: array
          items:
            type: object
            properties:
              daysOfWeek:
                type: array
                items:
                  type: string
              from:
                type: string
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                description: Local time of day, HH:MM.
              to:
                type: string
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                description: Local time of day, HH:MM.
              effectiveFrom:
                type: string
                format: date
                nullable: true
              effectiveTo:
                type: string
                format: date
                nullable: true
        slotMinutes:
          type: integer
          nullable: true
          description: '**How finely this resource''s time can be cut**, which is a property of the
            resource and not of the product sold against it.

            '
        minimumBookingMinutes:
          type: integer
          nullable: true
        maximumBookingMinutes:
          type: integer
          nullable: true
        advanceBookingDays:
          type: integer
          nullable: true
        exceptions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              closed:
                type: boolean
              from:
                type: string
                nullable: true
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                description: Local time of day, HH:MM.
              to:
                type: string
                nullable: true
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                description: Local time of day, HH:MM.
        scopePath:
          type: string
    ResourceBlock:
      type: object
      x-ticvai-persistence: resources.resource_block
      description: 'Board 2.07. **A block is not a booking**, and the reason travels with it so an
        operator knows whether to wait or to look elsewhere.

        '
      required:
      - resourceId
      - from
      - to
      - reason
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        reason:
          type: string
          enum:
          - setup
          - teardown
          - maintenance
          - blackout
          - closed
          - operational
          - training
        note:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
    ResourceCalendarRow:
      type: object
      description: 'Board 2.01. **One resource across the window, with its states already computed** —
        including conflict, which a client cannot derive from a booking list.

        '
      properties:
        resourceId:
          type: string
          format: uuid
        resourceName:
          type: string
        resourceTypeId:
          type: string
          format: uuid
        utilisationPercent:
          type: number
        segments:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              state:
                type: string
                enum:
                - available
                - reserved
                - assigned
                - partiallyUtilised
                - fullyUtilised
                - unavailable
                - onBreak
                - onLeave
                - underMaintenance
                - operationallyBlocked
                - pendingApproval
                - conflict
              bookingId:
                type: string
                format: uuid
                nullable: true
              conflictsWith:
                type: array
                items:
                  type: string
                  format: uuid
    ResourceAllocationPolicy:
      type: object
      x-ticvai-persistence: resources.allocation_policy
      description: 'Board 5.08, and the 26 August rotation decision. **Named rather than hidden in the
        allocator**, so somebody can answer why cabana three never gets used.

        '
      properties:
        strategy:
          type: string
          enum:
          - rotate
          - leastUtilised
          - priorityOrder
          - nearestFirst
          default: rotate
          description: '**`rotate` is the default because 26 August made it one.** *"rotate across all
            available resources… rather than repeatedly reusing the same resource, to avoid overburdening
            any single resource while others remain unused."*

            '
        respectResourcePriority:
          type: boolean
          default: true
        scoringWeights:
          type: object
          additionalProperties:
            type: number
        allowPartialAllocation:
          type: boolean
          default: false
          description: '**False by default.** A stage allocated without its sound system is worse than
            no allocation, because it looks finished.

            '
        scopePath:
          type: string
    ResourceAuditEntry:
      type: object
      x-ticvai-persistence: resources.resource_audit
      description: 'Board 1.10. **Immutable, and it carries the previous value.**'
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        field:
          type: string
          nullable: true
        previousValue:
          nullable: true
        newValue:
          nullable: true
        reason:
          type: string
          nullable: true
        sourceChannel:
          type: string
          nullable: true
        apiOrigin:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        scopePath:
          type: string
    ResourceUtilisation:
      type: object
      description: 'Board 10.02. **Booked time over available time**, where available knows about
        schedules, blocks, setup and travel.

        '
      properties:
        key:
          type: string
        label:
          type: string
        availableMinutes:
          type: integer
        bookedMinutes:
          type: integer
        blockedMinutes:
          type: integer
        utilisationPercent:
          type: number
        bookingCount:
          type: integer
    Resource:
      type: object
      x-ticvai-persistence: resources.resource
      description: '**A specific object, not a quantity of interchangeable ones.** A venue with forty
        identical strollers has forty resources, because guest number twelve returned stroller number
        twelve.

        '
      required:
      - id
      - code
      - name
      - kind
      - venueId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ResourceKind'
        venueId:
          type: string
          format: uuid
        scopePath:
          type: string
        parentResourceId:
          type: string
          format: uuid
          nullable: true
          description: '**A pool cabana belongs to the pool area; a seat belongs to an auditorium.** Booking
            a parent takes its children with it, which is the behaviour a venue expects and would otherwise
            have to enforce by hand.

            '
        principalId:
          type: string
          format: uuid
          nullable: true
          description: 'For a resource of kind `instructor` or `staff`. **`workforce` still owns their rota** — this says whether
            they are qualified and whether they are already committed.

            '
        attributes:
          type: object
          additionalProperties: true
          description: Configurable per kind — capacity, size, shade, power, poolside.
        setupMinutes:
          type: integer
          default: 0
          description: '**Before the booking, not inside it.** An auditorium booked 14:00–16:00 is unavailable
            from 13:30 with a 30-minute setup, and a calendar that cannot express that double-books every
            time.

            '
        teardownMinutes:
          type: integer
          default: 0
        requiresQualification:
          type: array
          items:
            type: string
          description: Qualification codes a person must hold to be assigned to this.
        depositAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        status:
          type: string
          enum:
          - available
          - booked
          - checkedOut
          - maintenance
          - retired
        isActive:
          type: boolean
          default: true
    ResourceAvailability:
      type: object
      description: '**Free windows, with setup and teardown already subtracted.** A client computing this
        from bookings will forget the turnaround.

        '
      properties:
        resourceId:
          type: string
          format: uuid
        freeWindows:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
        blockedWindows:
          type: array
          description: '**With a reason, because they are not the same.** Booked and under repair need
            different responses from an operator looking for something free — wait, or look elsewhere.

            '
          items:
            type: object
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              reason:
                type: string
                enum:
                - booked
                - held
                - setup
                - teardown
                - maintenance
                - blackout
                - closed
                description: '`held` is a live `ResourceHold` (rev 3 REV3-15): taken now, free again if
                  it expires.

                  '
    ResourceBooking:
      type: object
      x-ticvai-persistence: resources.booking
      required:
      - id
      - resourceId
      - from
      - to
      - status
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ResourceBookingStatus'
        holdId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          nullable: true
          description: 'The `ResourceHold` this booking was converted from, where a guest picked the
            resource on a venue map (rev 3 REV3-15). Null for a staff booking or an allocation.

            '
        recurrenceGroupId:
          type: string
          format: uuid
          nullable: true
          description: 'Ties the occurrences of a recurring booking. **Cancelling one week does not cancel
            the series**, and cancelling the series is a separate act with a separate confirmation.

            '
        depositAuthorisationId:
          type: string
          format: uuid
          nullable: true
          description: 'The hold, through `orders.authoriseStoredValue` (CF-126). **A deposit taken and
            refunded is two transactions and a fee; held and released is neither.**

            '
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        dueBackAt:
          type: string
          format: date-time
          nullable: true
        returnedAt:
          type: string
          format: date-time
          nullable: true
        conditionOut:
          type: string
          nullable: true
        conditionIn:
          type: string
          nullable: true
        syncedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 'When the latest offline check-out or check-in write reached the server. **The
            device times are `checkedOutAt` and `returnedAt`**, taken from each write''s `recordedAt`;
            this is the server''s half of the pair naming-and-style 5.2 requires. Null while pending.

            '
    Qualification:
      type: object
      x-ticvai-persistence: resources.qualification
      description: '1.2.36. **A role is not a skill**, and the check happens before assignment rather
        than after.

        '
      required:
      - code
      - name
      properties:
        resourceId:
          type: string
          format: uuid
          readOnly: true
          description: '**The resource that holds this qualification.** Set from the path of
            `setResourceQualifications`; without it a stored qualification belongs to nobody and the
            check before assignment has nothing to check against. One row per resource and `code`.

            '
        code:
          type: string
        name:
          type: string
        issuedAt:
          type: string
          format: date
          nullable: true
        expiresAt:
          type: string
          format: date
          nullable: true
          description: '**The field that makes this worth having.** A certification with no expiry is
            one nobody renews, and a lifeguard certificate that lapsed last month is a safety failure
            rather than a data-quality one.

            '
        issuer:
          type: string
          nullable: true
        documentAssetId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    PerformanceParticipant:
      type: object
      x-ticvai-persistence: resources.performance_participant
      description: '1.3.44. **The running order is operational.** An instructor takes beginners first,
        and a manifest sorted by booking time puts one between two advanced riders.

        Formerly `SessionParticipant` on `resources.session_participant`: a session is a Performance and
        the manifest hangs off one (decided 28 September, audit R165).

        '
      required:
      - id
      - performanceId
      - subjectId
      - position
      properties:
        id:
          type: string
          format: uuid
        performanceId:
          type: string
          format: uuid
          description: The `catalogue.performance` this participant is on (audit R165).
        subjectId:
          type: string
          format: uuid
        position:
          type: integer
        experienceLevel:
          type: string
          enum:
          - firstTime
          - beginner
          - intermediate
          - advanced
          nullable: true
        packageName:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 'When the device made the running-order change that set `position` — the
            `recordedAt` of the last `reorderPerformanceManifest`. Null until the order is first changed.

            '
        syncedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When that change reached the server (naming-and-style 5.2).
        hasSignedWaiver:
          type: boolean
          readOnly: true
          description: '2.15.9. **Shown on the manifest because that is where it is acted on** — an instructor
            about to start does not want to discover an unsigned waiver at the water''s edge.

            '
    ResourceKind:
      type: string
      description: 'BL-135. **`locker` was an entitlement kind in `orders` and nothing issued, assigned
        or released one.** A locker is a specific object checked out to a named guest and returned
        — which is this context exactly, and modelling it as an entitlement would have needed a second
        check-out mechanism.

        A seed for `ResourceType` rather than the law (board 1.02): a customer adding a class does it
        with `createResourceType`, not by waiting for this list to grow.

        **`table` is a non-dining spot** (decided 29 September, rev 3 GAP-C2, confirmed by Chinmay): a beach
        or event table placed on a venue map, picked and sold like a cabana (`createResourceHold`, then
        the order). **A dining table is not this**: restaurant tables stay `fnb` tables, booked with
        `fnb.createTableReservation` and the waitlist (audit R073 (d)).

        '
      enum:
      - cabana
      - lounger
      - locker
      - wheelchair
      - stroller
      - equipment
      - room
      - auditorium
      - vehicle
      - instructor
      - staff
      - table
      - pitch
      - studio
      - other
      x-ticvai-refuses:
        mealPlan: '**Listed by 5.5.8b and deliberately not a kind.** 5.5.8b groups meal plans with
          lockers and parking, but a meal plan is a balance rather than an object. It resolves to
          `retail.Wallet` with a `mealPlan` credit kind (CF-126), not to a resource — so it is not
          offered here, and a form built from this enum cannot offer it either.'
    ResourceBookingStatus:
      type: string
      enum:
      - reserved
      - checkedOut
      - returned
      - overdue
      - cancelled
      - noShow
    ResourceLifecycleState:
      type: string
      description: 'Board 1.10. **States of one machine**, whose allowed transitions are configuration.'
      enum:
      - draft
      - pendingApproval
      - approved
      - active
      - temporarilyUnavailable
      - underMaintenance
      - suspended
      - retired
      - archived
    ResourceConflictProblem:
      x-ticvai-persistence: none — error shape
      description: '**Names every clash with its times.** *"Not available"* on a resource somebody can
        see in front of them is not an answer. Returned by `bookResource`, `updateResourceBooking`,
        `createResourceBlock` and `setResourceVenueAssignment`.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - conflicts
        properties:
          conflicts:
            type: array
            items:
              type: object
              required:
              - resourceId
              - from
              - to
              - reason
              properties:
                resourceId:
                  type: string
                  format: uuid
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                reason:
                  type: string
                  enum:
                  - booked
                  - setup
                  - teardown
                  - maintenance
                  - blackout
                  - closed
                  - operational
                  - training
                  - travelBuffer
                  - overlappingAssignment
                bookingId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The booking in the way, where the clash is a booking.
                blockId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The block in the way, where the clash is a block.
                occurrenceFrom:
                  type: string
                  format: date-time
                  nullable: true
                  description: For a recurring request, the start of the occurrence that clashes.
    ResourceAllocationProblem:
      x-ticvai-persistence: none — error shape
      description: '**"No instructor free" and "the stage has no sound system" need different actions**,
        so each unmet requirement says which it is. Returned by `allocateResources`.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - unmet
        properties:
          unmet:
            type: array
            items:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - nothingAvailable
                  - dependencyMissing
                requirement:
                  $ref: '#/components/schemas/ResourceRequirement'
                availableQuantity:
                  type: integer
                  description: How many matching resources were free in the window.
                missingDependency:
                  $ref: '#/components/schemas/ResourceDependency'
    ResourceTransitionProblem:
      x-ticvai-persistence: none — error shape
      description: 'Returned by `setResourceLifecycleState`. **Names which refusal it is** — a transition
        the configuration does not allow, or an approval it requires that has not been given.'
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - refusedReason
        properties:
          refusedReason:
            type: string
            enum:
            - transitionNotAllowed
            - approvalRequired
          currentState:
            $ref: '#/components/schemas/ResourceLifecycleState'
          requestedState:
            $ref: '#/components/schemas/ResourceLifecycleState'
          allowedStates:
            type: array
            items:
              $ref: '#/components/schemas/ResourceLifecycleState'
    ResourceHierarchyProblem:
      x-ticvai-persistence: none — error shape
      description: 'Returned by `setResourceHierarchy` (board 1.06).'
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - refusedReason
        properties:
          refusedReason:
            type: string
            enum:
            - circular
            - invalidParent
            - crossTenantUnauthorised
          cycle:
            type: array
            description: For `circular`, the resource ids that would form the loop, in order.
            items:
              type: string
              format: uuid
    ResourceInUseProblem:
      x-ticvai-persistence: none — error shape
      description: 'Returned by `updateResourceType` and `updateResourceCategory`. **Carries the count and
        the resources**, so the warning can say how many and which.'
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - refusedReason
        - resourceCount
        properties:
          refusedReason:
            type: string
            enum:
            - resourcesCheckedOut
            - resourcesInvalidated
            - categoryInUse
          resourceCount:
            type: integer
          resourceIds:
            type: array
            items:
              type: string
              format: uuid
