  /resource-selection-policy:
    put:
      operationId: setResourceSelectionPolicy
      x-ticvai-consumed-by:
        - "P08 BO-897 Customer Resource Selection Configuration"
      summary: Whether the guest may choose the resource, per ticket type
      description: '**Two 26 August decisions meet here and they have to be read together.**

        > *"a guest always books a product or package — never a resource directly, and never a specific
        room/vehicle/instructor by itself — across all sales channels. The product''s configuration
        determines which resources are associated and get booked behind the scenes."*

        > *"instructor/resource selection will be a configurable, per-ticket-type setting — private-session
        ticket types can optionally allow the guest to choose a specific instructor, while group-session
        ticket types auto-assign an instructor without exposing the choice to the guest. Private and
        group sessions are modelled as two separate products with separate pricing, not variants of the
        same product."*

        So the guest never addresses a resource, and may sometimes express a preference *within a
        product that permits it.* **That is why this is a policy on the ticket type rather than a flag on
        the resource** — the same instructor is choosable in the private lesson and invisible in the
        group one, and nothing about the instructor changed.

        **Superseded for resources on a venue map** (decided 29 September, rev 3 REV3-15, superseding
        audit R073 (c) and the first minute above for them): a resource placed on a published venue map
        is chosen by the guest on the map whatever this policy says. This policy still governs every
        resource that is not on a map.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
