                  format: uuid
                  nullable: true
                requirements:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceRequirement'
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                orderId:
                  type: string
                  format: uuid
                  nullable: true
                preferredResourceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: '**Only honoured where the product allows the guest to choose** — see
                    `setResourceSelectionPolicy`. A preference that the policy does not permit is
                    ignored rather than refused, because it is the caller''s error and not the guest''s.

                    '
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Allocated, and which ones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceBooking'
        '409':
          description: '**Nothing available, or a dependency is missing.** Both are named — "no
            instructor free" and "the stage has no sound system" need different actions from the person
            reading it.

