      description: '**The writer of `resources.resource_cost`** (decided 29 September, writers pass). One
        entry per cost: moving a resource between venues (`transfer`, which needs `fromVenueId` and
        `toVenueId`, different, else `422`), running or maintaining it (`operating`), or replacing a
        retired or lost item (`replacement`). The amount is in the venue''s currency and positive; a
        correction is a delete and a new entry, not an edit, so the analytics for a closed window do not
        move silently. An unknown `resourceId` at this venue is `422`.

        **Maintenance and transfers do not write it on their own.** A cost is a number somebody knows,
        not one the platform can infer from a work order, so it is entered here (our build plan).

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCostEntry'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCostEntry'
        '422':
          description: Unknown resource at this venue; a `transfer` without both venues or with the same
            venue twice; a non-positive amount.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /resource-costs/{costId}:
    parameters:
    - name: costId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: deleteResourceCost
      x-ticvai-consumed-by:
        - "P08 BO-945 Resource Cost, Revenue & Efficiency Analytics"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: writers pass; correction path for resources.resource_cost; shape
        follows releaseResourceBlock'
      summary: Remove a cost entry booked in error
      description: 'Removes one `resources.resource_cost` row (decided 29 September, writers pass). The
        removal is recorded on `resources.resource_audit` with who and when, because the analytics it fed
        change.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Removed
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound

components:
  schemas:

    ResourceBookingProgressInput:
      type: object
      x-ticvai-persistence: none — request only; the step is recorded on resources.booking
      description: What `setResourceBookingProgress` takes (decided 29 September, readiness close-out).
      required:
      - state
      - recordedAt
      properties:
        state:
          type: string
          enum:
          - started
          - completed
          description: '`started` is recorded as `checkedOut`, `completed` as `returned`.'
        note:
          type: string
          maxLength: 1000
          nullable: true
        recordedAt:
          type: string
          format: date-time
          description: When the employee pressed the button on the device, not when the write reached the server.
    ResourceRequestKind:
      type: string
      enum:
      - replacementResource
      - additionalEquipment
      - resourceIssue
      - maintenanceRequest
      - assignmentChange
      - venueChange
      - scheduleClarification
      - other
      description: The request kinds on BO-935 / BO-938 (decided 29 September, readiness close-out). `other`
        is the pack's custom operational request.
    ResourceRequestInput:
      type: object
      x-ticvai-persistence: none — request only
      description: What `raiseResourceRequest` takes.
      required:
      - id
      - kind
      - detail
      - recordedAt
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Client-generated ULID, so a request raised offline is not duplicated on sync.
        kind:
          $ref: '#/components/schemas/ResourceRequestKind'
        bookingId:
          type: string
          format: uuid
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        detail:
          type: string
          minLength: 3
          maxLength: 2000
        recordedAt:
          type: string
          format: date-time
    ResourceRequest:
      type: object
      x-ticvai-persistence: resources.resource_request
      description: '**An employee''s request about the resources on an assignment** (decided 29 September,
        readiness close-out; BO-935, BO-938). New table. Raised `open`, then `acknowledged`, `resolved` or
        `declined` by the resource manager.

        '
      required:
      - id
      - kind
      - detail
      - status
      - raisedByPrincipalId
      - recordedAt
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          $ref: '#/components/schemas/ResourceRequestKind'
        bookingId:
          type: string
          format: uuid
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        detail:
          type: string
        status:
          type: string
          enum:
          - open
          - acknowledged
          - resolved
          - declined
          readOnly: true
          description: '`open` on raise.'
        raisedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        recordedAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
          readOnly: true
        resolutionNote:
          type: string
          nullable: true
          readOnly: true
        scopePath:
          type: string
          readOnly: true
    ResourceCostAnalytics:
      type: object
      x-ticvai-persistence: none — projection over resources.resource_cost, bookings and maintenance work orders, computed at read time
      description: One group's cost and revenue for the window (decided 29 September, readiness close-out; BO-945).
      required:
      - key
      - label
      properties:
        key:
          type: string
        label:
          type: string
        transferCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        operatingCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        replacementCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        revenue:
          $ref: ../shared/common.yaml#/components/schemas/Money
        bookedHours:
          type: number
        costPerBookedHour:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          nullable: true
          description: Total cost over booked hours; null when nothing was booked.
    ResourceSelectionPolicy:
      type: object
      x-ticvai-persistence: resources.selection_policy
      description: '**Whether the guest may choose the resource, per ticket type**: the body of
        `setResourceSelectionPolicy` and its row, one per ticket type, replaced by each `PUT` (decided
        29 September, data model DM4).

        '
      required:
      - ticketTypeId
      - mode
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticketTypeId:
          type: string
          format: uuid
          description: One policy per ticket type; a `PUT` for a ticket type that has one replaces it.
        mode:
          type: string
          enum:
          - autoAssign
          - guestMayChoose
        resourceTypeId:
          type: string
          format: uuid
          nullable: true
        showQualifications:
          type: boolean
          default: false
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005), written at `venue` scope.
    ResourceCostEntry:
      type: object
      x-ticvai-persistence: resources.resource_cost
      description: '**One cost booked against a resource**: a transfer between locations, an operating
        cost or a replacement. `getResourceCostAnalytics` sums these per group and window (decided 29
        September, data model DM4).

        '
      required:
      - id
      - resourceId
      - kind
      - amount
      - incurredOn
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - transfer
          - operating
          - replacement
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        incurredOn:
          type: string
          format: date
        fromVenueId:
          type: string
          format: uuid
          nullable: true
          description: A `transfer` only, with `toVenueId`.
        toVenueId:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005), written at `venue` scope.
    ProductStartTime:
      x-ticvai-persistence: none — computed on read
      type: object
      description: One start time a room type can be booked at for the chosen length (rev 3 REV3-13).
      required:
      - startsAt
      - endsAt
      - freeCount
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: '`startsAt` plus the variant''s `durationMinutes`; the cart line''s `bookedWindow.endsAt`.'
        freeCount:
          type: integer
          minimum: 1
          description: Resources of the room type free for the whole window. Only times with at least one are returned.
    MapResourceAvailability:
      x-ticvai-persistence: none — computed from placed resources, bookings, holds and blocks
      type: object
      description: 'What `getMapResourceAvailability` returns: **every placed resource on one map, for
        one window, in one answer** (rev 3 REV3-15).

        '
      required:
      - mapId
      - mapVersion
      - from
      - to
      - resources
      properties:
        mapId:
          type: string
          format: uuid
        mapVersion:
          type: integer
          description: The published `venue-map` version the placements were read from; the client checks
            it against the map it cached.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totals:
          type: object
          properties:
            total:
              type: integer
            available:
              type: integer
            held:
              type: integer
            booked:
              type: integer
            unavailable:
              type: integer
        resources:
          type: array
          items:
            type: object
            required:
            - resourceId
            - label
            - status
            properties:
              resourceId:
                type: string
                format: uuid
              placedResourceId:
                type: string
                format: uuid
                description: The `venue-map.PlacedResource` it was read from.
              label:
                type: string
                description: As on the map, e.g. `B09`.
              kind:
                $ref: '#/components/schemas/ResourceKind'
              zone:
                type: string
              capacity:
                type: integer
              priceBandCode:
                type: string
              variantId:
                type: string
                format: uuid
                description: What the cart line names to buy it.
              price:
                $ref: ../shared/common.yaml#/components/schemas/Money
              status:
                type: string
                enum:
                - available
                - held
                - booked
                - unavailable
                description: '`unavailable` covers maintenance, a blackout, a block and a placement marked
                  not bookable; the map greys all of them the same way.

                  '
    CreateResourceHoldRequest:
      x-ticvai-persistence: none — request only
      type: object
