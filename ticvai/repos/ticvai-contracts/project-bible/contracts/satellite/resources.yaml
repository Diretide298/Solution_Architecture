      - id
      - mapId
      - resourceIds
      - from
      - to
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Client-generated ULID, as a seat hold's.
        mapId:
          type: string
          format: uuid
          description: The published venue map the guest picked from.
        resourceIds:
          type: array
          minItems: 1
          maxItems: 10
          description: Placed resources on that map, e.g. two adjoining loungers. All or none are held.
          items:
            type: string
            format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        partySize:
          type: integer
          minimum: 1
          nullable: true
          description: Checked against each resource's `capacity`; above it the hold is refused `422`.
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 1800
          default: 480
          description: 8 minutes by default, 30 in all with extensions (audit R169), as a seat hold.
        subjectId:
          type: string
          format: uuid
          nullable: true
    ResourceHold:
      x-ticvai-persistence: resources.resource_hold
      type: object
      description: '**A guest''s pick on the map, held while they pay** (decided 29 September, rev 3
        REV3-15). The resource counterpart of `seating.SeatHold`: named resources, short-lived, converted
        by the order rather than released. States in `states/resource-hold.yaml`.

        '
      required:
      - id
      - mapId
      - resourceIds
      - from
      - to
      - status
      - createdAt
      - expiresAt
