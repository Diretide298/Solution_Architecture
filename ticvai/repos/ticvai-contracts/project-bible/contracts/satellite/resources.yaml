openapi: 3.1.0
info:
  title: TICVAI — Resources
  version: 1.0.0
  x-ticvai-screen-count: 60
  x-ticvai-tier: satellite
  x-ticvai-module: 1 — Ticketing Catalogue
  x-ticvai-platforms:
  - P08 Venue Management
  description: '**A bookable resource is a specific object checked out to a named guest and returned.**
    A cabana, a locker, a wheelchair, a stroller, an AV rig, an instructor, an auditorium.

    ## Why this is not a product

    **A product with an availability envelope sells a slot.** It answers *"can somebody have a cabana
    at 2pm"* and it cannot answer *"which cabana, held by whom, returned when, with what deposit against
    it."*

    Ten requirements define the entity directly, 7.6 is fifteen rows of rentals with none served, and
    **the utilisation reporting behind them has no source** — you cannot report on the utilisation of
    something the model does not know exists.

    ## The three things that make it a context rather than a table

    **A calendar with conflict detection.** Two bookings on one cabana is not a pricing problem, it is
    a guest arriving to find somebody in their chair. **Conflict detection before assignment is the whole
    point**, and nothing in the package computed it.

    **Check-out and check-in.** A rental leaves with a guest and comes back, or does not. **A deposit
    is held against the object, not against the order** — which is why `orders` could not carry this:
    an order completes and a rental is still out.

    **Setup and teardown.** An auditorium booked 14:00–16:00 is unavailable 13:30–16:30, and a calendar
    that cannot express that double-books every time.

    ## What it deliberately does not own

    **Not staff scheduling.** `workforce` owns rotas. A resource of kind `instructor` or `staff` points at a principal
    and the rota still says when they work — **this says whether they are qualified and whether they are
    already committed.**

    **Not stock.** `inventory` owns quantities of interchangeable things. **A resource is not interchangeable**
    — that is the whole distinction, and a venue with forty identical strollers has forty resources because
    guest number twelve returned stroller number twelve.


    ## Resources on a venue map: the guest picks one (decided 29 September, rev 3 REV3-15)

    **A venue map can carry cabanas, loungers, tables and other bookable resources**, ingested the way
    a stadium seat map is (`venue-map.importVenueGeometry`, `validateVenueMapGraph`, `publishVenueMap`),
    each placed with a label, zone, capacity and price band (`venue-map.PlacedResource`). A guest reads
    the whole map''s availability for a date in one call (`getMapResourceAvailability`), picks a specific
    one, holds it with an expiring `ResourceHold` exactly as a seat is held (`createResourceHold`), and
    buys it: the order converts the hold into a `ResourceBooking`. **This supersedes audit R073 (c)**
    (*"cabanas stay staff-booked"*, 28 September) **and the 26 August minute** (*"never a specific
    room/vehicle/instructor by itself"*) **for resources on an ingested map.** Resources that are not on
    a published map (instructors, rooms, vehicles, lockers) keep the minute: the guest buys a product and
    `allocateResources` picks.

    '
servers:
- url: https://api.ticvai.com/v1
paths:
  /resources:
    get:
      operationId: listResources
      x-ticvai-consumed-by:
        - "P08 BO-095 Resources"
        - "P08 BO-854 Resource Management Command Center"
        - "P08 BO-874 Staff Resource Profile"
        - "P08 BO-903 Equipment & Asset Command Center"
        - "P08 BO-923 AI Resource Intelligence Command Center"
        - "P08 BO-943 Resource Analytics Command Center"
      summary: Resources at this venue
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: kind
        in: query
        description: Only resources of this kind.
        schema:
          $ref: '#/components/schemas/ResourceKind'
      - name: availableFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: availableTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      operationId: createResource
      x-ticvai-consumed-by:
        - "P08 BO-095 Resources"
        - "P08 BO-857 Resource Creation & Profile"
        - "P08 BO-863 Resource Lifecycle, Governance & Audit"
      summary: Define a bookable resource
      tags:
      - resources
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
  /resources/{resourceId}/availability:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getResourceAvailability
      x-ticvai-consumed-by:
        - "P01 WEB-031 My Reservations"
        - "P08 BO-096 Resource Calendar"
      summary: When it is free, with conflicts already resolved
      description: '**Returns free windows, not a list of bookings for the caller to subtract.** A client
        computing availability from bookings will forget setup time, and a cabana booked 14:00–16:00 with
        a 30-minute turnaround is not free at 16:00.

        Includes maintenance windows and blackouts. **A resource under repair is unavailable for a different
        reason from one that is booked**, and the response says which — an operator looking for something
        free needs to know whether to wait or to look elsewhere.

        **Per resource.** A guest booking a meeting room never names one, so the start times they choose
        from come from `listProductStartTimes` (product, length variant, date), not from here (decided 29
        September, rev 3 REV3-13).

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Free windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAvailability'
  /resource-bookings:
    get:
      operationId: listResourceBookings
      x-ticvai-consumed-by:
        - "P08 BO-868 Advance Reservation Management"
        - "P08 BO-933 My Resource Operations Home"
        - "P08 BO-935 Assignment Detail & Operational Brief"
      summary: Bookings, filtered
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: resourceId
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: Only bookings in this state.
        schema:
          $ref: '#/components/schemas/ResourceBookingStatus'
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceBooking'
    post:
      operationId: bookResource
      x-ticvai-consumed-by:
        - "P08 BO-096 Resource Calendar"
        - "P08 BO-864 Resource Calendar Command Center"
        - "P08 BO-868 Advance Reservation Management"
        - "P08 BO-869 Recurring Reservation Configuration"
        - "P08 BO-915 Venue & Space Allocation"
      summary: Reserve a specific resource for a window — staff only
      description: '**Refuses on conflict, including setup and teardown.** This is the operation the whole
        context exists for — **two bookings on one cabana is a guest arriving to find somebody in their
        chair**, and it must be impossible rather than unlikely.

        Where the caller does not care which one, `resourceId` may be omitted and a kind supplied: **the
        platform picks and tells you which.**

        ## Amended 19 September — no longer guest-callable

        This shipped with `x-ticvai-guest-callable: true`, and the 26 August minute says otherwise:

        > *"a guest always books a product or package — **never a resource directly, and never a specific
        room/vehicle/instructor by itself** — across all sales channels. The product''s configuration
        determines which resources are associated and get booked behind the scenes."*

        **The original reasoning was right and stopped one step short.** It argued a guest booking *a*
        cabana does not choose cabana seven; the minute goes further and says the guest does not address
        the cabana at all. They buy a product, the product declares what it needs
        (`setExperienceResourceRequirements`), and `allocateResources` fills it — rotating, per the same
        minute, so one cabana is not worn out while others sit empty.

        **This closes the open question on `F25-a-guest-rents-a-cabana`**, which recorded that the venue
        had not said whether a guest may book a cabana themselves. They had; it was minuted on 26 August
        and nothing read the minutes.

        ## Superseded 29 September for resources on a venue map (rev 3 REV3-15)

        **The minute above, and audit R073 (c) (*"cabanas stay staff-booked"*), no longer hold for a
        resource placed on a published venue map** (decided 29 September, rev 3 REV3-15 and GAP-C2). There
        a guest picks the specific cabana, lounger or table on the map, holds it with `createResourceHold`
        and buys it; the order converts the hold into a booking. **This operation stays staff-only**: the
        guest route is hold then order, never a direct booking. For resources not on a map the minute
        still holds.

        **A live `ResourceHold` is a conflict here** like a booking: staff cannot book a cabana a guest
        is holding at checkout.

        **It reads `resources.selection_policy` when the booking is for an order** (decided 29 September,
        writers pass; DM4). With `orderId` given, the policy of the order line''s ticket type decides
        whether a named `resourceId` stands for the guest''s choice: under `guestMayChoose` it is honoured
        (within `resourceTypeId` where the policy sets one), under `autoAssign` it is ignored and the
        platform picks as for `resourceKind`, the same rule as `allocateResources.preferredResourceIds`,
        and the response names what was booked. A booking with no `orderId` is a staff booking and the
        policy does not apply.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              properties:
                resourceId:
                  type: string
                  format: uuid
                  nullable: true
                resourceKind:
                  $ref: '#/components/schemas/ResourceKind'
                  description: Supplied instead of `resourceId` when the caller does not care which
                    one; the platform picks and the response names it.
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                orderId:
                  type: string
                  format: uuid
                  nullable: true
                recurrence:
                  type: object
                  nullable: true
                  description: '**A weekly swimming lesson is one booking, not twelve.** Conflict detection
                    runs across every occurrence before any of them is written — booking eight of twelve
                    failing after seven succeeded is worse than the whole thing refusing.

                    '
                  properties:
                    pattern:
                      type: string
                      enum:
                      - daily
                      - weekly
                      - monthly
                    daysOfWeek:
                      type: array
                      items:
                        type: string
                    until:
                      type: string
                      format: date
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBooking'
        '409':
          description: '**Conflicts, and the response names them with times.** *"Not available"* on a
            resource a guest can see in front of them is not an answer. Also refused while the resource
            came back damaged and has not been inspected (`resource-awaiting-inspection`, decided 28
            September, audit R106 (4)); the response names the booking it came back damaged from.

            '
          x-ticvai-problem-types:
          - resource-conflict
          - resource-awaiting-inspection
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ResourceConflictProblem'
  /resource-bookings/{bookingId}/check-out:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: checkOutResource
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
        - "P08 BO-907 Guest & Resource Assignment"
        - "P08 BO-937 Resource Collection, Handover & Return"
      summary: Hand it over, with a deposit against it
      description: '7.6. **A rental leaves with a guest, and the deposit is held against the object rather
        than the order** — which is why `orders` could not carry this: an order completes and a rental
        is still out.

        Holds through `authoriseStoredValue` (CF-126) rather than taking payment. **A deposit taken and
        refunded is two transactions and a fee; a deposit held and released is neither**, and a guest
        who returns a stroller intact should not wait three days for their money.

        Records condition at handover. **The condition note taken on the way out is the only defence against
        a dispute on the way back.**

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subjectId
              - recordedAt
              properties:
                subjectId:
                  type: string
                  format: uuid
                depositAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                depositInstrument:
                  $ref: ../shared/common.yaml#/components/schemas/StoredValueKind
                depositInstrumentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: '**Which wallet, card, voucher or position the deposit is held against.**
                    `depositInstrument` says what kind it is and this says which one — the pair is
                    `kind` and `instrumentId` on `orders.authoriseStoredValue`, which cannot place a
                    hold without both. Required whenever `depositAmount` is supplied.

                    '
                recordedAt:
                  type: string
                  format: date-time
                  description: '**When the device handed it over**, not when the write reached the
                    server. This operation is offline-capable, and a check-out replayed from the outbox
                    an hour later still went out at the counter time. Stored as the booking''s
                    `checkedOutAt`; the server records `syncedAt` on arrival (naming-and-style 5.2).

                    '
                conditionNote:
                  type: string
                  nullable: true
                conditionPhotoRefs:
                  type: array
                  items:
                    type: string
                dueBackAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBooking'
  /resource-bookings/{bookingId}/check-in:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: checkInResource
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
        - "P08 BO-937 Resource Collection, Handover & Return"
      summary: Take it back, and settle the deposit
      description: '**Releases the hold, or captures part of it against damage.** Partial capture is the
        normal case for a damaged item and the reason two-phase spend was worth building.

        **Marks the resource unavailable where it comes back broken**, so the next booking cannot take
        it. A returned item that goes straight back into the pool with a cracked wheel is how the second
        guest gets hurt.

        **Damaged means unavailable until inspected** (decided 28 September, audit R106 (4)). A
        `condition` of `minorDamage` or `majorDamage` moves the resource to `maintenance`
        (`states/resource.yaml`) whatever `blockFurtherBookings` says, and `bookResource` refuses it
        with `409 resource-awaiting-inspection` until an inspection clears it
        (`setResourceLifecycleState` back to active, with the inspector''s reason). A `good` return
        frees it at once.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - condition
              - recordedAt
              properties:
                condition:
                  type: string
                  enum:
                  - good
                  - minorDamage
                  - majorDamage
                  - notReturned
                recordedAt:
                  type: string
                  format: date-time
                  description: '**When the device took it back**, not when the write reached the server.
                    Stored as the booking''s `returnedAt`, so an overdue charge is judged against the
                    counter time rather than the sync time; the server records `syncedAt` on arrival
                    (naming-and-style 5.2).

                    '
                captureAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                note:
                  type: string
                  nullable: true
                blockFurtherBookings:
                  type: boolean
                  default: false
                  description: Blocks a `good` return from further booking too. **Ignored for a damaged
                    return, which always blocks until inspected** (audit R106 (4)).
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBooking'
  /resources/{resourceId}/qualifications:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getResourceQualifications
      summary: What an instructor or staff resource is certified to do, and until when — as saved
      description: '**The read the qualifications screen loads before it edits.** `setResourceQualifications`
        replaces the whole set, so a screen that cannot load the current set can only overwrite it
        blind — and the expiry on each row is the thing an operator opens the screen to check.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The resource's qualifications, with their expiry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Qualification'
    put:
      operationId: setResourceQualifications
      x-ticvai-consumed-by:
        - "P08 BO-098 Qualifications"
        - "P08 BO-875 Skills & Competency Management"
        - "P08 BO-876 Certification & Expiry Management"
        - "P08 BO-877 Qualification & Assignment Rule Engine"
        - "P08 BO-894 Staff-to-Experience Qualification Mapping"
      summary: What a person resource is certified to do, and until when
      description: '1.2.36. **`RotaAssignment` carried `requiredRoleId` alone, and a role is not a skill.**

        The requirement is that the qualification is checked **before** the assignment is made — and **a
        lifeguard certificate that lapsed last month is a safety failure, not a data quality one.**

        Expiry is the field that matters. A certification with no expiry is a certification nobody renews.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - qualifications
              properties:
                qualifications:
                  type: array
                  items:
                    $ref: '#/components/schemas/Qualification'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Qualification'
  /performances/{performanceId}/manifest:
    parameters:
    - name: performanceId
      in: path
      required: true
      description: The catalogue Performance the manifest belongs to (`catalogue.performance`).
      schema:
        type: string
        format: uuid
    get:
      operationId: getPerformanceManifest
      x-ticvai-consumed-by:
        - "P08 BO-099 Performance Manifest"
      summary: Who is in a performance, in what order
      description: '1.3.44. **Distinct from duration, which variants already handle.**

        A performance holding a mix of first-time and experienced participants needs a running order, **because
        the order is operational rather than administrative** — an instructor takes the beginners first,
        and a manifest sorted by booking time gives them a beginner between two advanced riders.

        **The manifest hangs off a Performance** (decided 28 September, audit R165). What the design calls a
        session is a Performance, so `performanceId` is a `catalogue.performance` id; the former
        `sessionId` pointed at no entity. Formerly `getSessionManifest` on `/sessions/{sessionId}/manifest`.
        An unknown or out-of-scope performance is a `404`.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceParticipant'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
    put:
      operationId: reorderPerformanceManifest
      x-ticvai-consumed-by:
        - "P08 BO-099 Performance Manifest"
      summary: Change the running order
      description: 'Formerly `reorderSessionManifest`. The manifest belongs to a Performance (decided 28
        September, audit R165).

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order
              - recordedAt
              properties:
                order:
                  type: array
                  items:
                    type: string
                    format: uuid
                recordedAt:
                  type: string
                  format: date-time
                  description: '**When the device made the change**, not when it reached the server.
                    This is a `lastWriterWins` write that can arrive from an offline outbox, and without
                    the device time "last" could only mean last to sync — an instructor''s reorder at the
                    water''s edge would lose to an older one replayed after it. Stored on each
                    participant as `recordedAt`; the server records `syncedAt` on arrival
                    (naming-and-style 5.2).

                    '
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceParticipant'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
  /resource-types:
    get:
      operationId: listResourceTypes
      x-ticvai-consumed-by:
        - "P08 BO-854 Resource Management Command Center"
