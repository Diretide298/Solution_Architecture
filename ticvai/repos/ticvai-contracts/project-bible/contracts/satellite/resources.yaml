        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        mapId:
          type: string
          format: uuid
        resourceIds:
          type: array
          items:
            type: string
            format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        partySize:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - held
          - converted
          - released
          - expired
        totalPrice:
          x-ticvai-column: gross_amount
          $ref: ../shared/common.yaml#/components/schemas/Money
        heldByPrincipalId:
          type: string
          format: uuid
          nullable: true
        subjectId:
          type: string
          format: uuid
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
