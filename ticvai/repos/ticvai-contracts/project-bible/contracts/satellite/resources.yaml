      summary: The classes of resource this organisation supports
      description: 'Board 1.02. **A resource type is configuration, not code.** The board is explicit
        that administrators define staff, instructor, venue, room, hall, area, cabana, equipment, rental
        item, vehicle and locker *without requiring software development* — so the list is a table, and
        the `Resource.kind` enum that shipped first is a seed for it rather than the law.

