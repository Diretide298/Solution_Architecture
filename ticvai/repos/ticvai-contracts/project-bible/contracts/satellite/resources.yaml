        a customer adding "Golf Buggy" does not need a release.

        '
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        displayColour:
          type: string
          nullable: true
        nature:
          type: string
          enum:
          - physical
          - human
          - virtual
          description: '**Human resources point at a principal and are rostered by `workforce`.** The
            nature decides which other context owns the thing, which is why it is not a free label.

            '
        reservable:
          type: boolean
          default: true
        rentable:
          type: boolean
          default: false
        capacityControlled:
          type: boolean
          default: false
        scheduleControlled:
          type: boolean
          default: true
        inventoryControlled:
          type: boolean
          default: false
        qualificationRequired:
          type: boolean
          default: false
        maintenanceControlled:
          type: boolean
          default: false
        checkInOutSupported:
          type: boolean
          default: false
        depositApplicable:
          type: boolean
          default: false
        customerSelectable:
          type: boolean
          default: false
          description: '**A ceiling, not a permission.** Whether a guest may actually choose is decided
