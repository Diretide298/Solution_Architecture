        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        scopePath:
          type: string
          description: The partition key (ADR-0005), written at `venue` scope.
    ResourceHoldExtendProblem:
      x-ticvai-persistence: none — error shape
