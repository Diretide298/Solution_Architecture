                reason:
                  type: string
                  nullable: true
                effectiveFrom:
                  type: string
                  format: date-time
                  nullable: true
                replacementResourceId:
                  type: string
                  format: uuid
                  nullable: true
                disposal:
                  type: object
                  nullable: true
                  additionalProperties: true
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '409':
          description: '**The transition is not allowed from the current state**, or an approval the
            configuration requires has not been given. The response names which.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ResourceTransitionProblem'
