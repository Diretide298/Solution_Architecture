  /resource-allocations:
    post:
      operationId: allocateResources
      x-ticvai-consumed-by:
        - "P08 BO-871 Multi-Event Resource Planning"
        - "P08 BO-899 Customer / Cashier Resource Assignment Experience"
        - "P08 BO-900 Dynamic Resource Allocation Engine"
        - "P08 BO-916 Equipment & Asset Allocation"
      summary: Fill a requirement from the pool, rotating rather than repeating
      description: '**The 26 August decision is the whole of this operation.** *"resource allocation
        should rotate across all available resources (e.g., resource 1, then 2, then 3) rather than
        repeatedly reusing the same resource, to avoid overburdening any single resource while others
        remain unused."*

        A naive allocator picks the first free match and is correct on every individual booking while
        being wrong overall — the same instructor takes every lesson and the same cabana wears out first.
        **Rotation is therefore a property of the platform, not advice to an operator**, and this is the
        one place it can be enforced.

        Fills resource-type placeholders in a package, evaluates dependencies before confirming, and
        refuses naming what is missing rather than allocating a stage without its sound system.

        **Not how a map-placed resource is sold** (decided 29 September, rev 3 REV3-15): a cabana, lounger
        or table on a published venue map is picked by the guest and held with `createResourceHold`, so
        rotation does not apply to it. A live hold counts as taken when this allocates.

        **It assigns the room for a space booked by the hour** (decided 29 September, rev 3 REV3-13).
        When `orders.checkoutCart` (or `createOrder`) turns a cart line with a `bookedWindow` into an order
        line, the order service calls this service to service with `from`/`to` = the window,
        `requirements` = the product''s (`setExperienceResourceRequirements`, the experience being the
        product) and the `orderId`, and one concrete room of the type is booked for the window, rotating
        as above. The guest chose the room type, length and start time and never a room (26 August
        minute). If no room is free, which the line''s capacity hold should have prevented, `409` names
        the requirement and the checkout refuses the line `windowUnavailable`.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
