  /proposed-actions/{actionId}/decide:
    parameters:
    - name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: decideProposedAction
      x-ticvai-consumed-by:
        - "P16 ANL-009 AI Assistant & Action Center"
      x-ticvai-audience:
      - staff
      summary: Approve or reject a proposal
      description: '**Approval is recorded here; execution happens in the owning contract under the approver''s
        own permission.** This operation does not apply the change.

        That separation matters: an approval endpoint that also executes would let a person approve something
        they could not themselves do, and the whole control depends on them being the same person.

        A rejection carries a reason. It is the only signal that the assistant is proposing badly, and
        without it a bad model degrades silently.

        **Who may approve (decided 28 September, audit R213 (3)).** An action at `approvalLevel` 2, anything
        touching prices or permissions, needs a manager: a principal holding `AI_APPROVE` who is not the
        one who prompted it. An action at level 1 is approved by the requester themselves. A proposal
        past its `expiresAt` is refused with 409.

        **The permission model says the same thing.** The operation''s permission is `AI_USE`, the one the
        requester already holds to prompt the assistant, and it lets them decide **only their own level 1
        proposals**. Deciding a level 2 proposal requires `AI_APPROVE` (`x-ticvai-permission-escalated`)
        and a caller other than the requester. Deciding somebody else''s level 1 proposal is refused
        unless the caller holds `AI_APPROVE`. Each refusal is a `403` naming which rule failed.

        '
      tags:
      - governance
      x-ticvai-permission: AI_USE
      x-ticvai-permission-escalated: AI_APPROVE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedAction'
        '403':
          description: 'The caller may not decide this proposal (audit R213 (3)): a level 2 proposal and
            the caller lacks `AI_APPROVE` (`approval-level-requires-manager`), a level 2 proposal the
            caller prompted themselves (`approver-is-requester`), or a level 1 proposal somebody else
            prompted and the caller lacks `AI_APPROVE` (`not-own-proposal`). One `403` only: the older
            second `403` key, which YAML let silently replace this one, is merged in here.

            '
          x-ticvai-problem-types:
          - approval-level-requires-manager
          - approver-is-requester
          - not-own-proposal
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: The action is no longer `proposed` — already decided, or expired (7 days after it
            was proposed, audit R213).
          x-ticvai-problem-types:
          - proposal-not-open
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
