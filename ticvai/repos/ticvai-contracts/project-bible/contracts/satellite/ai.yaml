            `venue-map` uses for `VenuePath.geometry`, so an accepted segment becomes a path without conversion.
        distanceMetres:
          type: number
          nullable: true
          description: Along the centreline. Null where the plan has no georeference.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reasoning:
          type: string
          nullable: true
    InsufficientDataProblem:
      x-ticvai-persistence: none — error shape
