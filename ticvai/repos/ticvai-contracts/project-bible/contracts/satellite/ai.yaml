    VenueLabelProposal:
      type: object
      x-ticvai-persistence: none — each proposal is an ai.proposed_action row; proposalId is its id
      description: '1.4.24. **One shape, what the assistant thinks it is, and how sure it is.** The
        fields are `venue-map`''s `PointProposal` plus the id `acceptVenueLabelProposals` needs — a
