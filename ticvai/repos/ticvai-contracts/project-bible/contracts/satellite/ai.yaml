      description: '8.3.61–8.3.66. Pricing, promotional, operational and financial proposals wait here
        for approval, and multi-level approval is supported because a pricing change and a discount rule
        do not carry the same authority.

        **What a caller sees follows who may decide** (audit R213 (3)): a caller holding `AI_APPROVE` sees
        every open proposal at the scope; a caller with `AI_USE` only sees the proposals they prompted,
        because those are the level 1 proposals they may approve themselves.

        '
      tags:
