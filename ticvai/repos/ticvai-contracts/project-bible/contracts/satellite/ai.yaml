            '
        guardRails:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Bounds the answer must fall within. **Required where basis is `model`** — refused
            at save otherwise.

            '
    SuggestionProviderAssignments:
      type: array
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: '**The routing table for `requestSuggestion`, held on the tenant''s `ai.policy` row**
        as one `jsonb` column (`suggestion_providers`). At most one entry per `kind`.

        '
      items:
        $ref: '#/components/schemas/SuggestionProviderAssignment'
    TranslationProposals:
      type: object
      x-ticvai-persistence: none — each draft is written on the block it translates
      description: 'What `proposeTranslations` drafted. **Every entry is a draft, never a publish** —
