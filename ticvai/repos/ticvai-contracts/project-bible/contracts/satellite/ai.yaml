        '
      required:
      - proposalId
      - shapeRef
      - proposedKind
      - confidence
      properties:
        proposalId:
          type: string
          format: uuid
          description: The `ai.proposed_action` id. `venue-map.acceptVenueLabelProposals` takes it as
            `decisions[].proposalId`.
        shapeRef:
          type: string
        proposedKind:
          type: string
        proposedName:
          type: string
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: '**Shown to the operator, and low confidence is not filtered out.** A shape the
            assistant is unsure about is the one most worth a human looking at.

            '
        sourceLayer:
          type: string
          nullable: true
        reasoning:
          type: string
          nullable: true
          description: 8.1.5b. Why it thinks so, so an operator can disagree with the reason rather than
            the answer.
    WalkwayProposal:
      type: object
      x-ticvai-persistence: none — each proposal is an ai.proposed_action row; proposalId is its id
      description: '**One seen path segment, with its confidence.** Low-confidence segments are returned,
        not hidden — they are the ones an operator must look at.

        '
      required:
      - proposalId
      - geometry
      - confidence
      properties:
        proposalId:
          type: string
          format: uuid
          description: The `ai.proposed_action` id. `venue-map.acceptWalkwayProposals` takes it as `decisions[].proposalId`.
        geometry:
          type: string
