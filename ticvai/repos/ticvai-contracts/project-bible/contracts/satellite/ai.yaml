            an embed failure is a provider one.'
        error:
          type: string
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
    AiSourceList:
      type: array
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: '**The sources an answer was grounded in, stored with the answer** (8.3.70). One `jsonb`
        column on the row that carries it — `ai.message.sources` and `ai.activity.sources` — because
        the grounding audit reads the list as it was when the answer was given, and a source is never
        queried on its own.

