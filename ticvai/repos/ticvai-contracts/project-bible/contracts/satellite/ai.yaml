      x-ticvai-audience:
      - staff
      summary: Add a document
      description: '8.4.11. Chunked and embedded asynchronously — `status` moves through `processing`
        before `indexed`, and **a document that says "added" while still processing is a document a user
        will search for and not find**.

        Documents carry the scope they may be retrieved at. A venue operating procedure is not an answer
        to a question about another venue.

        **Re-ingesting and replacing go through here too** (states/ai-knowledge-document.yaml), and
        the body says which. With neither field below, this adds a new document.

        - `reingestDocumentId` names an `indexed` or `failed` document to process again from the
        `sourceAssetId` in the body. **The same document** moves back to `processing` and keeps its
        id; no new document is created.

        - `supersedesDocumentId` names an `indexed` document that this new one replaces. A new document
        is created, and the named one moves to `superseded` when the new one reaches `indexed` — so
        search is never left with neither version.

        Sending both, or naming a document in another collection or in a state the transition does
        not start from, is refused as a validation failure.

        '
