  /generate/configuration:
    post:
      operationId: generateConfiguration
      x-ticvai-consumed-by:
        - "P08 BO-117 Product Import, Governance & AI Configuration Assistant"
        - "P08 BO-597 AI Configuration Workspace"
        - "P08 BO-598 AI Draft Review & Approval"
      x-ticvai-audience:
      - staff
      summary: Draft a configuration from a description
      description: '8.8.10 to 8.8.14. **An admin describes what they want and the assistant walks the
        configuration** — products, pricing, promotions, seating and the calendar. Five requirements,
        not twenty: 8.1''s "AI Configuration Assistant" heading sits over two unrelated blocks (CF-74).

        **It needs no training corpus and it is not context-free**, and those are different claims. The
        phasing paper calls this data-independent because it forecasts nothing and learns from no history
        — correct. But *"create VIP seating in the first three rows with a 30% premium"* cannot be answered
        without the seat map, the price categories and the venue''s own vocabulary.

        **So it reads the venue''s current configuration and nothing behavioural.** Twenty-two tables:
        the catalogue, price lists, promotions, the seat map, performances and region settings. No orders,
        no scans, no guests.

        **The bootstrapping case is the one to design for.** A brand-new tenant has no seat map, no price
        list and no products, and *"first three rows"* means nothing. On an empty venue the assistant
        creates rather than amends, and the two are different prompts with different risk — **amending
        touches things already sold.**

        **Proposes; never applies.** Writes `ai.proposed_action` and stops, and returns that row''s
        id as `proposedActionId` for `decideProposedAction`. 8.1.4 requires approval before
        execution for anything affecting pricing or financial operations, and this is that gate — the
        same one `x-ticvai-permission-escalated` enforces for a human.

        Seating includes generating a map from an uploaded layout, which is `generateVenueLayout` and
        `importSeatGeometry` (CF-123). **The assistant does not parse the drawing** — it names the sections,
        categories and premiums once the geometry is in.

        '
