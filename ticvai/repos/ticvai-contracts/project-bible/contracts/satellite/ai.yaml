  /providers:
    get:
      operationId: listAiProviders
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience:
      - staff
      summary: Configured providers and their order
      description: '8.4.21–8.4.26. OpenAI, Gemini, Claude and a local model, several at once, with failover.

        **Order is configuration, not code.** A capability names what it needs — a model that reasons,
        a model that embeds — and the platform resolves which provider serves it. That is what makes "no
        provider SDK in capability code" enforceable rather than aspirational.

        **Per tenant** (decided 28 September, audit R203; ADR-0009). Platform staff read and set a
        tenant''s providers on ADM-037, acting inside the tenant under a platform-staff grant (audit
        R098); the tenant''s own staff read them with `AI_CONFIGURE`. Each row carries `residency`, which
        the tenant''s region may restrict (`tenancy.RegionSettings.allowedAiResidencies`). ADM-037 finds
        that region from `subscription.Tenant.regionId` and reads it with `tenancy.getRegionSettings`.

        '
      tags:
      - config
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProvider'
    put:
      operationId: setAiProvider
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience:
      - staff
      summary: Configure a provider
      description: '**Per tenant, with a compliance gate (decided 28 September, audit R203), as ADR-0009
        says.** Inference is a data transfer: a prompt containing guest data leaves the jurisdiction the
        moment it reaches a provider hosted elsewhere. So **platform staff set a tenant''s provider on
        ADM-037**, and **a region may restrict the choice**: a provider whose `residency` is not in the
        allowed residencies of the tenant''s home region (`subscription.Tenant.regionId`, read through
        `tenancy.getRegionSettings` as `RegionSettings.allowedAiResidencies`; empty means no restriction)
        is refused with 409 `residency-refused`, which is the gate.

        **How the permission is honoured in the tenant''s cell** (decided 28 September, audit R203).
        `PLATFORM_TENANT_MANAGE` is a platform permission: it is read from the operator''s platform token,
        never from a platform-staff grant, which refuses `PLATFORM_*` values. The cell additionally
        requires the operator to have a grant into this tenant open (`openPlatformStaffGrant`, audit R098),
        so the change is audited against that grant (`AuditRecord.platformStaffGrantId`); without one it
        refuses `403 platform-grant-required`. A tenant''s own staff cannot set a provider, whatever they
        hold.

        Credentials are a key-vault reference, never the key.

        **What the PUT does.** The body is one whole provider configuration, matched on `id`. With
        an `id`, it replaces that provider''s configuration in full — a field left out takes its default
        or null, not its old value — and returns 200; an `id` that names no provider at the caller''s
        scope is a 404. Without an `id`, it creates a provider and returns 201 with the new id. The
        other providers are never touched: this is not a replace-the-list call.

        '
      tags:
      - config
      x-ticvai-permission: PLATFORM_TENANT_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProvider'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Configured — an existing provider, named by `id`, replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '201':
          description: Created — the body carried no `id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '403':
          description: The caller lacks `PLATFORM_TENANT_MANAGE` on their platform token, or has no
            platform-staff grant into this tenant open (`platform-grant-required`, audit R203).
          x-ticvai-problem-types:
          - platform-grant-required
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: The provider's `residency` is not in the tenant's region's `allowedAiResidencies`
            (audit R203).
          x-ticvai-problem-types:
          - residency-refused
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /policy:
    get:
      operationId: getAiPolicy
      x-ticvai-consumed-by:
        - "P08 BO-091 AI Policy & Spend"
      x-ticvai-audience:
      - staff
      summary: What the assistant may do here
      description: '8.3.72–8.3.80. Which capabilities are enabled, which roles may use them, what is masked
        before it reaches a provider, and the usage ceiling.

        **Returns the policy in force at `scopePath`** — the venue''s own row where the venue has narrowed
        the tenant''s, the tenant''s row otherwise (nearest ancestor wins, ADR-0018). The response''s
        `scopeLevel` and `scopePath` say which row that is. Without `scopePath`, the tenant row is returned;
        a `scopePath` outside the caller''s grants is refused.

        '
      tags:
      - config
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-config-scope-note: '**Two levels of one policy.** The tenant row is the default and a
        venue row may narrow it (ADR-0018). Declared `venue` because a venue manager (BO-091) reads
        and narrows their own venue''s row. A venue grant is shown the tenant row where it is the
        policy in force at that venue, and cannot write it; only a tenant-level grant writes the default.

        '
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: scopePath
        in: query
        required: false
        description: The tenant or venue node to read the policy for. Absent means the tenant.
        schema:
          type: string
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPolicy'
    put:
      operationId: setAiPolicy
      x-ticvai-consumed-by:
        - "P08 BO-091 AI Policy & Spend"
      x-ticvai-audience:
      - staff
      summary: Set the policy
      description: '**Tenant sets the default; a venue may narrow it and never widen it** (8.4.4 and 8.4.5,
        adjacent requirements asking for both, which is ADR-0018''s inheritance rule stated by the matrix
        itself).

        Masking is the part to get right. `maskedFields` names what is redacted before a prompt leaves
        the platform, and it defaults to every field in the `pii` schema — **a default that fails closed,
        because a masking list somebody forgot to fill in should send nothing rather than everything.**

        **Which row it writes.** The body''s `scopeLevel` and `scopePath` name the target: `tenant`
        with the tenant''s node writes the default, `venue` with a venue''s node writes that venue''s
        narrowing. There is one row per `scopePath`. A `scopePath` outside the caller''s grants is
        refused (403), and a venue row that would widen the tenant''s — a capability, role or guest
        scope the tenant does not allow, fewer masked fields, or a higher ceiling — is refused as a
        validation failure.

        **What the PUT does.** It replaces the whole row at that `scopePath`: a field left out takes
        its default, not its old value. It returns 200 where the row existed and 201 where this created
        it — a venue''s first narrowing. `suggestionProviders` is not written here; `setSuggestionProvider`
        is its only writer, and it is kept as it was.

        '
      tags:
      - config
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-config-scope-note: '**Two levels of one policy.** The tenant row is the default and a
        venue row may narrow it (ADR-0018). Declared `venue` because a venue manager (BO-091) reads
        and narrows their own venue''s row; a tenant-level grant still reaches the tenant row, and a
        venue grant cannot, because the row''s `scopePath` sits above it.

        '
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiPolicy'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set — the row at `scopePath` existed and is replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPolicy'
        '201':
          description: Set — this created the row at `scopePath`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPolicy'
  /index-sources:
    get:
      operationId: listIndexSources
      x-ticvai-audience:
      - staff
      summary: What is indexed, and how current it is
      description: '**A source is declared once here, not implemented in twenty-two services.**

        The alternative — every service calling the AI service when its content changes — makes AI a dependency
        of the catalogue, the CMS, maintenance and marketing, and a failure in indexing then becomes a
        failure in publishing a product. That is backwards: **retrieval is downstream of the business,
        and downstream failures must not propagate upstream.**

        Instead each source names the domain event that already exists. `catalogue.product` is reindexed
        when `catalogue.productPublished` is published, and the catalogue never learns that AI exists.

        '
      tags:
      - retrieval
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Sources with their freshness
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexSource'
    put:
      operationId: setIndexSource
      x-ticvai-audience:
      - staff
      summary: Declare a source indexed
      description: 'Names the table, the fields that carry retrievable text, the collection it lands in
        and the event that invalidates it.

        **`textFields` is the important one.** Indexing an entire row embeds ids, timestamps and foreign
        keys as though they were meaning, and a search for "annual pass" then matches a UUID. Only the
        fields a person would read are embedded; the rest becomes payload used for filtering.

        **What the PUT does.** One declaration per indexed table, so the match key is `table`. A body
        naming a table already declared replaces that declaration in full — a field left out takes
        its default, not its old value — and returns 200; a table not yet declared is created and returns
        201. Other declarations are never touched. A change to `textFields` or `chunkStrategy` does
        not re-embed anything by itself; `reindexSource` does.

        '
      tags:
      - retrieval
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexSource'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Declared — the table's existing declaration replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexSource'
        '201':
          description: Declared — the table had no declaration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexSource'
  /index-sources/{sourceId}/reindex:
    parameters:
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reindexSource
      x-ticvai-audience:
      - staff
      summary: Rebuild a source
      description: 'Needed for three reasons and worth naming them: the embedding model changed, the `textFields`
        changed, or incremental indexing drifted and nobody knows why.

        **Builds into a shadow collection and swaps on completion.** Reindexing in place leaves the assistant
        answering from a half-built index, which is worse than answering from a stale one — a stale answer
        is wrong in a knowable way.

        '
      tags:
      - retrieval
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-singleton: true
      x-ticvai-singleton-note: 'ADR-0031. **With three replicas, three instances wake up.** A Postgres
        advisory lock rather  than Redis: the work is transactional against the same database, so the
        lock belongs there.  **A Redis lock that expires mid-transaction leaves two writers and no error.**

        '
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                  - embeddingModelChanged
                  - fieldsChanged
                  - driftSuspected
                  - initialBuild
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Rebuilding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexJob'
        '409':
          description: Already rebuilding
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /index-sources/{sourceId}/entries/{entryId}:
    parameters:
    - name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entryId
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: removeIndexEntry
      x-ticvai-audience:
      - staff
      summary: Remove one record from the index
      description: '**The erasure path.** When a subject is erased — by `deleteGuestAccount`, the
        guest''s own request, or by `eraseSubject` where it arrived some other way — or a page is
        unpublished, its vectors must go too: a knowledge base that keeps answering from a deleted
        document is a deletion that did not happen.


        **Called at archive as well as at erasure** (ADR-0047). Archived personal data moves to a
        separate instance and is no longer operationally readable, so a knowledge base still
        answering from it is an archive that did not happen — the same rule one stage earlier.


        **This used to cite `pii.erase_subject`, which is not a table and not an operation.** `pii`
        holds `subject`, `subject_contact`, `subject_document` and `subject_biometric`. The dangling
        name was read as evidence that erasure did not exist, and an ADR was drafted on it.

        Deleting from Postgres does not delete from Qdrant. Nothing cascades between the two stores, which
        is why this operation exists rather than being implied.

        '
      tags:
      - retrieval
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Removed from both stores
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
  /index-jobs:
    get:
      operationId: listIndexJobs
      x-ticvai-consumed-by:
        - "P08 BO-088 Approval Analytics"
      x-ticvai-audience:
      - staff
      summary: Indexing in flight and recently finished
      description: 'Progress, failures and the count of records an index could not embed. **A source that
        silently fails on 3% of its rows is a search that silently misses 3% of the answers.**

        '
      tags:
      - retrieval
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexJob'
  /index-failures:
    get:
      operationId: listIndexFailures
      x-ticvai-consumed-by:
        - "P08 BO-091 AI Policy & Spend"
      x-ticvai-audience:
      - staff
      summary: Records an index could not embed
      description: 'ADR-0033. **`ai.index_failure` existed with no operation reading it and no screen
        behind it** - the table was specified, written up as "failure is a row somebody works, not a
        log line", and then nothing in the package could reach a single row of it.

        **`stage` is the field that matters and it decides who fixes it.** A `parse` failure is the
        tenant''s document; an `embed` failure is whoever holds the provider key. Without it the two
        look alike, and both get reported as the platform being broken.

        '
      tags:
      - retrieval
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: jobId
        in: query
        schema:
          type: string
          format: uuid
      - name: stage
        in: query
        schema:
          type: string
          enum:
          - fetch
          - parse
          - chunk
          - embed
          - upsert
      responses:
        '200':
          description: Failures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexFailure'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AiProviderKind:
      type: string
      enum:
      - openai
      - gemini
      - anthropic
      - azureOpenai
      - localLlm
    SuggestionKind:
      type: string
      description: 'What is being suggested. **A closed set, and the reason it is closed is the swap.**
        Every entry here is a question a venue asks that a model could answer better than a rule — and
        each one starts as a heuristic and becomes a model when there is data.

        **Six of these were drawn as their own endpoints on the client F&B boards** — `suggestPrice`,
        `simulateScenario`, `simulateSlaPolicy`, `suggestRequisition`, `suggestReplenishment`, `publishDemandPlan`.
        **Building six endpoints means six places to change when a model changes**, and the model will
        change more often than the venue''s question does.

        **What each kind is based on, and how much history is enough. Proposed, client to correct
        (decided 28 September, audit R213).** With less than the minimum, `requestSuggestion` answers
        422 with `InsufficientDataProblem` naming the input, what there is and this minimum.

        - `price`: unit cost plus the category''s target margin, held inside the price band. Minimum:
        a current cost, no history.

        - `replenishment`: par level minus on-hand plus expected use over the supplier lead time.
        Minimum: 14 days of stock movements.

        - `requisition`: the next service''s prep-plan ingredient needs minus kitchen stock. Minimum: 14
        days of sales.

        - `demandForecast`: the average of the same weekday over the last 8 weeks, adjusted by admissions
        already booked. Minimum: 8 weeks of sales.

        - `prepPlan`: forecast covers for the service times each item''s share of the last 4 same
        weekdays. Minimum: 4 weeks of sales.

        - `menuEngineering`: each item placed by popularity against margin, over 90 days. Minimum: 90
        days of sales.

        - `staffing`: forecast demand divided by the role''s standard covers per staff hour. Minimum: 8
        weeks of sales (the forecast it rests on).

        - `slaTarget`: the 80th percentile of actual times over the last 30 days. Minimum: 30 days of
        timed events.

        - `waitTime`: people ahead divided by the throughput of the last 30 minutes. Minimum: 30 minutes
        of throughput today.

        - `upsell`: the item most often bought with the basket''s items over 90 days. Minimum: 90 days of
        orders.

        - `segmentation`: recency, frequency and spend scores over 12 months. Minimum: 90 days of orders.

        - `anomaly`: a value outside three standard deviations of the same weekday over 8 weeks. Minimum:
        8 weeks of the measure.

        - `scenario`: the demand forecast re-run with the stated changes. Minimum: as `demandForecast`.

        '
      enum:
      - price
      - replenishment
      - requisition
      - demandForecast
      - prepPlan
      - menuEngineering
      - staffing
      - slaTarget
      - waitTime
      - upsell
      - segmentation
      - anomaly
      - scenario
    SuggestionBasis:
      type: string
      description: '**How the answer was reached, and this is the field the whole design exists for.**

        A venue must be able to see that today''s price suggestion is a margin rule and next quarter''s
        is a trained model — **the same operation, the same screen, a different basis** — and a screen
        that cannot say which is a screen that asks a manager to trust arithmetic it will not show.

        **Swapping a heuristic for a model is a provider change, not a contract change.** That is the
        point of the abstraction: the frontend, the audit record and the outcome capture all stay exactly
        as they are.

        '
      enum:
      - heuristic
      - statistical
      - model
      - hybrid
      - manual
    Suggestion:
      type: object
      x-ticvai-persistence: ai.suggestion
      description: 'One answer to one question, with its reasoning and its confidence. **Built 24 August
        so that machine learning can be swapped in without touching a screen.**

        **A suggestion is never an action.** It proposes; `ProposedAction` and its approval path decide.
        A model that can order stock is a model that will order stock wrongly at three in the morning.

        **`inputs` is recorded, not just referenced.** A suggestion that cannot be reproduced cannot be
        defended to a finance controller asking why the system said to order four hundred.

        '
      required:
      - id
      - kind
      - basis
      - producedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SuggestionKind'
        basis:
          $ref: '#/components/schemas/SuggestionBasis'
        scopePath:
          type: string
        subjectRef:
          type: string
          nullable: true
          description: What it is about — a product, an outlet, an item, a party.
        value:
          type: object
          additionalProperties: true
          description: The suggestion itself. Shape depends on `kind`.
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: '**Null for a heuristic and that is honest.** A rule has no confidence — dressing
            one up with 0.85 is the fastest way to make a manager trust a number that means nothing.

            '
        explanation:
          type: string
          description: '**Plain words, always present, whatever the basis.** *Because covers are up 12%
            on this day last year* — a suggestion a manager cannot explain to their own boss is a suggestion
            they will not action.

            '
        inputs:
          type: object
          additionalProperties: true
          description: 'What went in. **Recorded so the answer can be reproduced** — and so that when
            a model replaces the rule, the two can be run against the same inputs and compared.

            '
        producerRef:
          type: string
          description: 'The rule name or the model id and version. **A model version is part of the record**:
            *the model said so* is not an answer to *which model, when*.

            '
        producedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**A demand forecast for Saturday is worthless on Sunday.** An expired suggestion
            is hidden rather than shown stale.

            '
    SuggestionOutcome:
      type: object
      x-ticvai-persistence: ai.suggestion_outcome
      description: '**What actually happened, and this is the table that makes the swap possible at all.**

        A model needs labelled data and **the only source of labels is whether the venue took the advice
        and whether it worked.** A platform that suggests and never records the outcome has no training
        set a year later, and the swap he is planning for never happens.

        **Captured whether or not the suggestion was taken.** A rejected suggestion is a stronger signal
        than an accepted one — it is the case the rule got wrong.

        '
      required:
      - id
      - suggestionId
      - decision
      properties:
        id:
          type: string
          format: uuid
        suggestionId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - accepted
          - modified
          - rejected
          - ignored
          - expired
        actualValue:
          type: object
          nullable: true
          additionalProperties: true
          description: 'What the venue did instead. **The label.** A suggestion of 400 units, an order
            of 250, and a stockout on Saturday is one training example worth more than a hundred accepted
            ones.

            '
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
        realisedOutcome:
          type: object
          nullable: true
          additionalProperties: true
          description: '**Filled in later by a job, not by a person.** Whether the stockout happened,
            whether the covers arrived, whether the margin held — nobody comes back to record this by
            hand, so nothing that depends on them doing so should be designed.

            '
        note:
          type: string
          nullable: true
    AiCapability:
      type: string
      description: 'What a capability needs, not which provider serves it. This indirection is what makes
        "no provider SDK in capability code" enforceable.

        **`speechToText` and `textToSpeech` added 18 August (BL-164)** — voice added rather than declined.
        **Speech is the capability where UAE residency is hardest to satisfy**: the major providers run
        it in fewer regions than text, and a guest speaking into a kiosk is producing personal data in
        the moment. `AiProvider.residency` already carries the constraint and **speech is the capability
        most likely to fail it**, which is why it is separate rather than folded into `chat`.

        '
      enum:
      - chat
      - embedding
      - vision
      - rerank
      - speechToText
      - textToSpeech
    AiProvider:
      type: object
      x-ticvai-persistence: ai.provider
      required:
      - kind
      - capability
      - priority
      - isActive
      properties:
        id:
          type: string
          format: uuid
          description: Assigned on create. Sent to `setAiProvider` to replace that provider; left out
            to create one.
        kind:
          $ref: '#/components/schemas/AiProviderKind'
        capability:
          $ref: '#/components/schemas/AiCapability'
        model:
          type: string
        failoverProviderId:
          type: string
          format: uuid
          nullable: true
          description: 'BL-151. **A provider outage with no fallback is every AI surface going dark at
            once**, and the surfaces most likely to be noticed are the guest-facing ones.

            **Failover is declared per capability because a provider is** — a fallback covering chat and
            not embedding leaves search broken while the concierge works, which reads as a stranger failure
            than a clean outage.

            '
        degradeGracefully:
          type: boolean
          default: true
          description: '**Where no fallback answers, the surface degrades rather than errors.** Semantic
            search falls back to keyword, the concierge offers a human, a recommendation returns the rule-based
            set — **an AI feature that returns a 500 is worse than one that quietly becomes ordinary software.**

            '
        priority:
          type: integer
          description: Failover order (8.4.26). Lower is tried first.
        scopeLevel:
          type: string
          enum:
          - platform
          - tenant
          - venue
          description: '**Where this provider configuration applies, and therefore whose token pays for
            it.** A tenant-scoped provider means that tenant''s usage bills against their own key at the
            provider — **an independent reconciliation source against our own meter**, which is the point
            of per-tenant tokens rather than one platform key.

            `venue` exists for the case where one venue''s volume justifies its own key, or where a venue
            is billed separately from the rest of its tenant.

            **`tenant` is the decided level** (audit R203, ADR-0009): a tenant''s provider is set per
            tenant, by platform staff on ADM-037. `venue` narrows inside a tenant; `platform` is only
            the platform''s fallback. **No provider is configured per region**: a region restricts the
            choice through `tenancy.RegionSettings.allowedAiResidencies` and nothing else, and the table''s
            `region_id` is the tenant''s home region, recorded so that gate can be re-checked.

            '
        scopePath:
          type: string
          description: Resolved scope node. Nearest ancestor wins (ADR-0018).
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: Null only where `scopeLevel` is `platform`.
        credentialRef:
          type: string
          description: 'A key-vault reference, never the key. A key typed into a form ends up in a screenshot.

            '
        credentialRotatedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        credentialExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: 'Where the provider issues expiring keys. **A key that lapses silently takes the
            assistant down without an error anyone reads** — the expiry is surfaced so it can be chased
            before it bites.

            '
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When `testAiProvider` last confirmed the key works.
        endpoint:
          type: string
          nullable: true
        residency:
          type: string
          description: 'Where inference physically happens. **A prompt reaching a provider hosted elsewhere
            is a cross-border transfer** (ADR-0009), and this field is what makes that auditable rather
            than assumed.

            '
        maxTokens:
          type: integer
        isActive:
          type: boolean
    AiPolicy:
      type: object
      x-ticvai-persistence: ai.policy
      required:
      - scopeLevel
      - scopePath
      - enabledCapabilities
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        scopeLevel:
          type: string
          enum:
          - tenant
          - venue
          description: Tenant sets the default; a venue may narrow it and never widen it.
        scopePath:
          type: string
          description: '**The node this row belongs to, and the key it is written under** — the tenant''s
            node where `scopeLevel` is `tenant`, a venue''s where it is `venue`. One row per `scopePath`;
            `setAiPolicy` writes the row it names and `getAiPolicy` resolves nearest ancestor first
            (ADR-0018).

            '
        enabledCapabilities:
          type: array
          items:
            type: string
            enum:
            - assist
            - search
            - generateConfiguration
            - generateLayout
            - summarise
            - explain
        allowedRoleIds:
          type: array
          items:
            type: string
            format: uuid
        maskedFields:
          type: array
          description: 'Redacted before a prompt leaves the platform (8.3.73). **Defaults to every field
            in the pii schema** — a masking list nobody filled in should send nothing rather than everything.

            Each entry is a column named `schema.table.column`, as the DDL names it — `pii.subject_contact.email`.
            **Omitted, null and an empty array all take the default**, because each of them is a list
            nobody filled in. An entry naming no column is refused at save rather than silently masking
            nothing.

            '
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
        requiresApprovalFor:
          type: array
          description: 8.3.61–8.3.64. Nothing in this list executes without a decision.
          items:
            type: string
            enum:
            - pricing
            - promotion
            - operational
            - financial
            - configuration
        monthlyTokenCeiling:
          type: integer
          nullable: true
        ceilingBehaviour:
          type: string
          enum:
          - warn
          - warnThenDisable
          - block
          default: warn
          description: '**Decided 17 August: warn, and let the venue manager choose.** A cap that stops
            the assistant mid-visit turns a cost control into a guest-facing outage, and the venue has
            no warning it is about to happen.

            At the ceiling a notification reaches the venue manager with the spend and the remaining period,
            and **the assistant keeps answering until somebody decides otherwise**. `warnThenDisable`
            and `block` exist for a tenant who asks for a hard limit; neither is the default.

            '
        ceilingWarningPercent:
          type: integer
          default: 80
          description: '**Warn before the ceiling, not at it.** A manager told at 100% has already spent
            it; one told at 80% can decide with a week left.

            '
        guestCapabilityScope:
          type: array
          description: '**What a guest-facing assistant may help with, and nothing else** (2.1.28). Bounding
            the capability is what makes the cost predictable and the safety posture tractable — an assistant
            that answers anything is one that can be asked anything.

            '
          items:
            type: string
            enum:
            - ticketSelection
            - promotions
            - faq
            - recommendations
            - checkout
            - waitTimes
            - wayfinding
        retrieveTopK:
          type: integer
          default: 30
          description: How many chunks retrieval returns before reranking.
        rerankTopK:
          type: integer
          nullable: true
          default: 5
          description: 'How many survive the rerank and reach the model. **Reranking reduces cost as well
            as improving quality**, which is unusual — retrieval is cheap and the tokens sent to the model
            are not.

            Null disables reranking, and a venue with no rerank provider configured runs without it rather
            than failing.

            '
        cacheAnswers:
          type: boolean
          default: true
          description: '**The largest cost lever available at a kiosk.** Guest questions are extraordinarily
            repetitive — forty questions, thousands of times a day — where staff questions are diverse.

            **Invalidation runs on the same events that invalidate the index.** A cached answer that outlives
            a price change has misled a guest on the venue''s behalf, which is worse than a slow one.

            '
        cacheTtlMinutes:
          type: integer
          default: 60
          description: 'An upper bound on top of event invalidation, not instead of it. **The key carries
            `scope_path`** — a cache keyed on the question alone is a cross-venue leak wearing a performance
            hat.

            '
        retainInteractionsDays:
          type: integer
          description: 'How long prompts and responses are kept. **Unresolved — CF-64.** Prompts may carry
            personal data, so this is a retention decision nobody has made.

            '
        semanticCacheThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.95
          description: '**Similarity above which a cached answer serves a new question.** `cache:answer`
            is exact-match on question, scope and locale — *what time do you close* and *when do you shut*
            are two misses and two provider calls.


            **Per capability, not global.** A factual venue question tolerates 0.95; a recommendation
            tolerates nothing. **A tenant who finds it wrong can move it**, which is why it is policy
            rather than a constant.'
        negativeCacheTtlSeconds:
          type: integer
          default: 300
          description: '**How long *no answer found* is remembered.** A miss costs a full retrieval and
            a completion.


            **Shorter than a hit deliberately** — the answer may exist tomorrow because somebody indexed
            it.'
        cascade:
          type: object
          nullable: true
          description: '**A small model answers and escalates only below a confidence threshold.** `ai.suggestion.confidence`
            exists and nothing routes on it.'
          properties:
            smallModel:
              type: string
            largeModel:
              type: string
            escalateBelow:
              type: number
              default: 0.7
        chunking:
          type: object
          description: '**The single biggest lever on retrieval quality**, and currently nowhere. **A
            venue FAQ and a maintenance manual do not chunk the same way.** Per collection, not global.'
          properties:
            sizeTokens:
              type: integer
              default: 512
            overlapTokens:
              type: integer
              default: 64
            strategy:
              type: string
              enum:
              - fixed
              - sentence
              - semantic
              default: sentence
        quantisation:
          type: string
          enum:
          - none
          - scalar
          - binary
          default: none
          description: '**A decision, never a default.** `scalar` int8 is roughly four times smaller —
            49 GB becomes 12 — **and it costs recall**. `binary` is smaller again and needs rescoring
            against full vectors to be usable.


            **A creation decision**: changing it means a rebuild, which is what `shadow_collection` is
            for. **A tenant whose search quality drops after an infrastructure change should be able to
            find the line that did it.**'
        hnsw:
          type: object
          nullable: true
          description: '**Defaults are tuned for neither our recall nor our latency.** A collection built
            with the wrong ones needs a rebuild, which is why this is a creation decision like the sparse
            index.'
          properties:
            m:
              type: integer
              default: 16
            efConstruct:
              type: integer
              default: 128
            efSearch:
              type: integer
              default: 64
        perRequestTokenCeiling:
          type: integer
          nullable: true
          description: '**One runaway conversation can spend a tenant''s month.** `monthlyTokenCeiling`
            discovers that after it has happened.'
        streamsByCapability:
          type: array
          items:
            type: string
          description: '**Time to first token and total latency are separate targets.** A concierge that
            starts answering in 300 ms and finishes in 4 seconds is better than one silent for 2.


            **`chat` streams; `generateConfiguration` does not** — nobody watches a config draft assemble.'
        fallbackProviderId:
          type: string
          format: uuid
          nullable: true
          description: 'BL-151: **a provider outage with no fallback is every AI surface going dark at
            once.**


            **`residencyRefused` is never failed over.** It is a correct answer, and moving the call elsewhere
            would defeat the refusal.'
        guardrailShortCircuit:
          type: boolean
          default: true
          description: '**A refusal a rule can decide never reaches a model.** Cheaper, faster and more
            consistent than asking a model to refuse.'
        suggestionProviders:
          allOf:
          - $ref: '#/components/schemas/SuggestionProviderAssignments'
          readOnly: true
          description: '**Which producer answers each `SuggestionKind`**, and what `requestSuggestion`
            routes by. Written only by `setSuggestionProvider`; `setAiPolicy` leaves it as it was. Held
            on the tenant row — a venue row does not carry its own.

            '
    AiConversation:
      type: object
      x-ticvai-persistence: ai.conversation
      required:
      - id
      - principalId
      - module
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        scopePath:
          type: string
        module:
          $ref: ../shared/common.yaml#/components/schemas/ModuleKey
        locale:
          type: string
        messageCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
    AiSource:
      type: object
      x-ticvai-persistence: none — stored as jsonb on the row that carries it (ai.message.sources, ai.activity.sources), through AiSourceList
      description: 'What the answer was grounded in (8.3.70). **An answer with no sources is a guess**,
        and the interface should show it as one.

        '
      properties:
        kind:
          type: string
          enum:
          - document
          - product
          - entitlement
          - report
          - record
        id:
          type: string
        title:
          type: string
        collectionId:
          type: string
          format: uuid
          nullable: true
        excerpt:
          type: string
        relevance:
          type: number
    AiMessage:
      type: object
      x-ticvai-persistence: ai.message
      required:
      - id
      - conversationId
      - role
      - content
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
          - system
        content:
          type: string
        sources:
          $ref: '#/components/schemas/AiSourceList'
        confidence:
          type: number
          nullable: true
          description: '8.1.5, 8.3.67. **Nullable on purpose** — a provider that does not report confidence
            must yield null rather than an invented number, and an interface showing 0.9 because the code
            defaulted it is worse than showing nothing.

            '
        rationale:
          type: string
          nullable: true
          description: 8.3.68, 8.3.69.
        proposedAction:
          allOf:
          - $ref: '#/components/schemas/ProposedAction'
          nullable: true
          description: Present where the answer suggests a change. **A draft, never applied here.**
        traceId:
          type: string
        provider:
          $ref: '#/components/schemas/AiProviderKind'
        model:
          type: string
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        latencyMs:
          type: integer
        createdAt:
          type: string
          format: date-time
    ProposedAction:
      type: object
      x-ticvai-persistence: ai.proposed_action
      required:
      - id
      - kind
      - targetContract
      - targetOperation
      - payload
      - status
      properties:
        id:
          type: string
          format: uuid
        interactionId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - pricing
          - promotion
          - operational
          - financial
          - configuration
        targetContract:
          type: string
          description: Which contract would perform it. The assistant never performs it itself.
        targetOperation:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: 'The request body a person would submit, ready to review. **Open on purpose: its
            shape is the request body of `targetOperation` in `targetContract`**, and it is validated
            against that operation, not restated here.

            '
        summary:
          type: string
        status:
          type: string
          description: '**Expiry (decided 28 September, audit R213)**: a `proposed` action expires 7 days
            after `proposedAt`; an `approved` action not applied expires 24 hours after `decidedAt`. Both
            are proposed values, client to correct, and `expiresAt` carries the one that applies.

            '
          enum:
          - proposed
          - approved
          - rejected
          - applied
          - expired
        expiresAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          x-ticvai-derived: onWrite
          description: When the expiry timer moves this action to `expired` — `proposedAt` plus 7 days
            while `proposed`, `decidedAt` plus 24 hours once `approved`, null once `rejected`, `applied`
            or `expired` (audit R213).
        approvalLevel:
          type: integer
          minimum: 1
          maximum: 2
          description: '8.3.65. Multi-level, because a discount and a pricing change differ in authority.
            **Two levels (decided 28 September, audit R213)**: `2` for anything touching prices or
            permissions (every `pricing` and `promotion` action, and any other whose payload sets a price,
            a discount, a role or a permission grant), which needs a manager other than the requester;
            `1` for everything else, which the requester approves themselves.

            '
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        decisionReason:
          type: string
          nullable: true
          description: 'Required on rejection. **The only signal the assistant is proposing badly**, and
            without it a poor model degrades silently.

            '
        proposedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    AiInteraction:
      type: object
      x-ticvai-persistence: ai.activity
      required:
      - id
      - principalId
      - capability
      - outcome
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
          nullable: true
        principalId:
          type: string
          format: uuid
        audience:
          type: string
          enum:
          - staff
          - guest
          description: '**Billing divides on this.** Staff usage is bounded by headcount; guest usage
            is bounded by footfall and curiosity, and a venue cannot stop guests asking questions.

            '
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'The guest, where the audience is `guest`. `principalId` is null in that case —
            **a guest is not a principal**, and attributing their tokens to a staff member would be wrong
            twice.

            '
        billableToTenantId:
          type: string
          format: uuid
          description: 'Resolved from `scopePath` at write time, not derived later. **Billing must not
            depend on walking a scope tree that has since been reorganised.**

            '
        scopePath:
          type: string
        capability:
          type: string
        prompt:
          type: string
        response:
          type: string
        sources:
          $ref: '#/components/schemas/AiSourceList'
        outcome:
          type: string
          enum:
          - answered
          - refused
          - applied
          - rejected
          - failed
        refusalReason:
          type: string
          nullable: true
        provider:
          $ref: '#/components/schemas/AiProviderKind'
        model:
          type: string
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        cost:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          x-ticvai-column: cost_amount
          description: 'What the call cost at the provider. **Money like every other amount** (naming-and-style
            5.1) — it replaces an integer `costMinor` that carried no currency or scale, which AED and
            OMR read differently.

            '
        latencyMs:
          type: integer
        maskedFieldCount:
          type: integer
          description: How many fields were redacted. Zero on a prompt touching guest data is a defect.
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
    IndexSource:
      type: object
      x-ticvai-persistence: ai.index_source
      description: 'One declaration per indexed table. **The service that owns the table does not know
        this exists** — the AI service consumes the domain event the owner already publishes.

        '
      required:
      - table
      - textFields
      - collection
      - scopeLevel
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        table:
          type: string
          description: Schema-qualified, e.g. `whitelabel.content_page`.
        contract:
          type: string
          description: Which contract owns it, for tracing back.
        textFields:
          type: array
          minItems: 1
          description: 'The fields a person would read. **Only these are embedded** — indexing a whole
            row embeds ids and timestamps as though they were meaning, and a search for "annual pass"
            then matches a UUID.

            '
          items:
            type: string
        payloadFields:
          type: array
          description: 'Carried alongside the vector for filtering, not embedded. Always includes `scope_path`
            — **the vector store has no row-level security, so scope travels in the payload or it does
            not travel at all.**

            '
          items:
            type: string
        collection:
          type: string
          description: Which Qdrant collection it lands in.
        scopeLevel:
          type: string
          enum:
          - tenant
          - region
          - venue
        invalidatedBy:
          type: array
          description: 'Domain events that make an entry stale. `catalogue.product` names `catalogue.productPublished`,
            and the catalogue never learns AI exists.

            '
          items:
            type: string
        chunkStrategy:
          type: string
          enum:
          - wholeRecord
          - paragraph
          - fixedTokens
          - section
          - semanticSection
          - parentChild
          description: '**Changes what is stored, so it cannot be altered without a reindex.**

            `parentChild` retrieves on a small precise chunk and returns the parent section. **A refund
            policy paragraph retrieved without its heading answers the wrong question confidently**, which
            is the failure this exists to prevent.

            `semanticSection` splits on meaning rather than length. `fixedTokens` cuts a rule in half,
            and policies and FAQs are where that shows.

            '
        parentField:
          type: string
          nullable: true
          description: Which field carries the parent context, where `chunkStrategy` is `parentChild`.
        isActive:
          type: boolean
        entryCount:
          type: integer
          readOnly: true
        lastIndexedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        staleCount:
          type: integer
          readOnly: true
          description: Records changed since their last embedding. Non-zero for long is drift.
    IndexJob:
      type: object
      x-ticvai-persistence: ai.index_job
      required:
      - id
      - sourceId
      - status
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - full
          - incremental
          - removal
        reason:
          type: string
        status:
          type: string
          enum:
          - queued
          - building
          - verifying
          - swapping
          - complete
          - failed
        recordsTotal:
          type: integer
        recordsEmbedded:
          type: integer
        recordsFailed:
          type: integer
          description: '**The number to watch.** A source silently failing on 3% of its rows is a search
            silently missing 3% of the answers, and nothing else in the system will say so.

            '
        failureSample:
          type: array
          items:
            type: string
        shadowCollection:
          type: string
          nullable: true
          description: 'A full rebuild writes here and swaps on completion. Reindexing in place leaves
            the assistant answering from a half-built index.

            '
        shardKey:
          type: string
          readOnly: true
          description: '**The tenant boundary on shared placement** (ADR-0021). A collection is shared
            by every tenant using the same embedding model, and the shard is what separates them — set
            at provisioning from the tenant, never from a request.

            On dedicated placement there is one shard and this is still populated, because a tenant moving
            from shared to dedicated moves a shard rather than being re-indexed.

            '
        embeddingModel:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    KnowledgeCollection:
      type: object
      x-ticvai-persistence: ai.knowledge_collection
      required:
      - name
      - scopeLevel
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        scopeLevel:
          type: string
          enum:
          - tenant
          - region
          - venue
        scopePath:
          type: string
          readOnly: true
        documentCount:
          type: integer
          readOnly: true
        shardKey:
          type: string
          readOnly: true
          description: '**The tenant boundary on shared placement** (ADR-0021). A collection is shared
            by every tenant using the same embedding model, and the shard separates them — set at provisioning
            from the tenant, never from a request.

            On dedicated placement there is one shard and this is still populated, because a tenant moving
            from shared to dedicated moves a shard rather than being re-indexed.

            '
        retrieval:
          type: string
          enum:
          - dense
          - hybrid
          default: hybrid
          description: '**Set at creation and not changeable.** A collection created dense-only cannot
            gain a sparse index without a full rebuild, which is why this is a creation decision rather
            than a query one.

            Hybrid is the default because **a venue corpus is mostly proper nouns** — Yas Waterworld,
            Bronze Annual Pass, a menu item name. Dense retrieval is good at meaning and poor at exact
            tokens, and half our queries are exact tokens.

            '
        sparseModel:
          type: string
          nullable: true
          description: The sparse signal, where `retrieval` is `hybrid`. BM25 unless a tenant needs otherwise.
        idfScope:
          type: string
          enum:
          - shard
          - tenant
          - venue
          default: tenant
          description: '**Which population the sparse score measures rarity against** (ADR-0021). Qdrant
            computes IDF statistics shard-wide by default, so a term common at one venue and rare at another
            gets one score for both. Shard-per-tenant fixes the cross-tenant case; **inside a dedicated
            cell the shard is the whole tenant and venues share it**, which is what this narrows.

            '
        embeddingModel:
          type: string
          readOnly: true
          description: '**This is what decides how many collections exist** (ADR-0021). A collection carries
            its own vector configuration and a shard cannot, so vectors from two models cannot share one.
            A tenant that residency forces onto a local model therefore has its own collection — forced
            by the model, not chosen for isolation.

            Read-only because **changing it invalidates every embedding in the collection**, and a collection
            silently searched with mismatched vectors returns plausible nonsense.

            '
        isActive:
          type: boolean
    KnowledgeDocument:
      type: object
      x-ticvai-persistence: ai.knowledge_document
      required:
      - title
      - sourceAssetId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        collectionId:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
        sourceAssetId:
          type: string
          format: uuid
        mimeType:
          type: string
        reingestDocumentId:
          type: string
          format: uuid
          nullable: true
          writeOnly: true
          x-ticvai-persisted: false
          description: 'An `indexed` or `failed` document in this collection to process again from
            `sourceAssetId`. **The same document** returns to `processing` and keeps its id (states/ai-knowledge-document.yaml).
            A request, not a fact about the row, so it is not stored.

            '
        supersedesDocumentId:
          type: string
          format: uuid
          nullable: true
          description: 'The `indexed` document in this collection that this one replaces. It moves to
            `superseded` when this one reaches `indexed`, and is kept — **a technician who followed version
            2 last week needs version 2 to still exist.**

            '
        status:
          type: string
          enum:
          - processing
          - indexed
          - failed
          - superseded
          readOnly: true
        chunkCount:
          type: integer
          readOnly: true
        failureReason:
          type: string
          nullable: true
          readOnly: true
        indexedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    SearchResult:
      type: object
      x-ticvai-persistence: none — computed
      properties:
        kind:
          type: string
        id:
          type: string
        title:
          type: string
        excerpt:
          type: string
        relevance:
          type: number
        collectionId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
    GeneratedConfiguration:
      type: object
      x-ticvai-persistence: none — a draft, applied through the owning contract; the draft itself is the ai.proposed_action row named by proposedActionId
      required:
      - proposedActionId
      - kind
      - targetContract
      - targetOperation
      - payload
      properties:
        proposedActionId:
          type: string
          format: uuid
          description: '**The `ai.proposed_action` row this draft was written as**, and the id `decideProposedAction`
            takes. Without it a reviewer (BO-598) has a draft and no way to approve it.

            '
        kind:
          type: string
          enum:
          - product
          - membership
          - pass
          - promotion
          - discountRule
          - pricingCalendar
          - seatingZone
          - operatingHours
          - campaign
          description: The `kind` the request asked for.
        targetContract:
          type: string
        targetOperation:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: '**Open on purpose: its shape is the request body of `targetOperation` in `targetContract`**,
            validated against that operation before it is returned — this contract does not restate
            thirty other contracts'' request schemas.

            '
        assumptions:
          type: array
          description: '**What it had to guess.** An admin reviewing a draft needs to know which fields
            came from what they said and which the assistant chose, or they approve a decision they did
            not make.

            '
          items:
            type: object
            properties:
              field:
                type: string
              value:
                type: string
              reason:
                type: string
        clarificationsNeeded:
          type: array
          description: What it could not resolve and should ask about.
          items:
            type: string
        confidence:
          type: number
          nullable: true
        traceId:
          type: string
    LayoutDraft:
      type: object
      x-ticvai-persistence: ai.layout_draft
      required:
      - importJobId
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        importJobId:
          type: string
          format: uuid
          description: 'Enters the seat-map import pipeline at `previewReady`. Nothing is written until
            a person commits it.

            '
        status:
          type: string
          enum:
          - parsing
          - previewReady
          - failed
        seatCount:
          type: integer
        sectionCount:
          type: integer
        categoriesProposed:
          type: array
          items:
            type: string
        unresolved:
          type: array
          description: Regions of the plan it could not interpret, named so a person can fix them.
          items:
            type: string
        traceId:
          type: string
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    AiUsageReport:
      type: object
      x-ticvai-persistence: none — aggregated from ai.activity
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        groupBy:
          type: string
        rows:
          type: array
