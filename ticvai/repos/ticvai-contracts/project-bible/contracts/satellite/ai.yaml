                type: string
              interactions:
                type: integer
              promptTokens:
                type: integer
              completionTokens:
                type: integer
              cost:
                $ref: ../shared/common.yaml#/components/schemas/Money
              p95LatencyMs:
                type: integer
              refusalRate:
                type: number
              rejectionRate:
                type: number
                description: 'Proposals a person refused. **The number that says whether the assistant
                  is worth having**, and the one nobody thinks to measure.

                  '
    IndexFailure:
      type: object
      x-ticvai-persistence: ai.index_failure
      description: 'ADR-0033. **Failure is a row somebody works, not a log line.**


        `ai.index_job` already counts `records_failed` and holds a `failure_sample`; **this is where the
        other 4,999 go.**'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        documentRef:
          type: string
          description: What would not index.
        stage:
          type: string
          enum:
          - fetch
          - parse
          - chunk
          - embed
          - upsert
