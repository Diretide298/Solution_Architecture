                  - pricingCalendar
                  - seatingZone
                  - operatingHours
                  - campaign
                description:
                  type: string
                  minLength: 5
                  maxLength: 4000
                conversationId:
                  type: string
                  format: uuid
                  description: Where the clarifying questions were asked and answered.
      responses:
