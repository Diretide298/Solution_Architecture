  /step-up-policies:
    get:
      operationId: listStepUpPolicies
      x-ticvai-consumed-by:
        - "P09 ADM-342 Authentication & MFA Policy Manager"
      x-ticvai-audience:
      - staff
      summary: What needs a second factor here
      description: 'Every action that can demand step-up, the strength the contract sets as its floor,
        and the strength in force here. Resolves up the scope tree the way the approval matrix does (ADR-0018):
        tenant default, region override, venue override.

        '
      tags:
      - matrix
      x-ticvai-permission: APPROVAL_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: effective
        in: query
        description: Show the strength as it applies here, rather than the rules set at this level.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Step-up policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepUpPolicy'
    put:
      operationId: setStepUpPolicy
      x-ticvai-consumed-by:
        - "P09 ADM-342 Authentication & MFA Policy Manager"
      x-ticvai-audience:
      - staff
      summary: Raise what needs a second factor
      description: 'Raise the authentication strength required before an action may be executed.


        **A policy may raise a requirement and never lower it.** The value on the operation is a floor:
        `mfa` cannot be configured down to `pin` or `none`, in the same way a venue may tighten a refund
        threshold and never loosen one. A tenant able to switch MFA off `approveJournalEntry` would have
        a policy manager that manages the control away.


        **Changing a policy does not change a decision already in flight.** A request keeps the requirement
        it was raised under, for the reason `setApprovalMatrix` gives: an approver must not be answering
        a question that changed while they read it.


        **Set at tenant level, and that is forced by what it governs.** The policy covers actions declared
        at venue, region and tenant scope - `approveMembershipProductValidation` and `approvePartnerStatuLifecycle`
        are tenant-wide. A venue-scoped policy could have configured a tenant-level control, which `check-step-up.py`
        refuses, because **a scope that can configure away a control above it is not a control.** Venues
        inherit and, by the raise-only rule, may not weaken what they inherit.

        '
      tags:
      - matrix
      x-ticvai-permission: APPROVAL_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpPolicy'
      responses:
        '200':
          description: Policy as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpPolicy'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DraftedRecord:
      type: object
      x-ticvai-provisional: true
      description: '**A provisional envelope, drafted 2026-09-04 from the workshop pack.** It carries
        what every one of these screens needs to address a row and nothing it has not earned. **There
        is deliberately no `x-ticvai-persistence`** - naming a table here would put a storage decision
        nobody made into the ER model and the DDL.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        updatedAt:
          type: string
          format: date-time
    AccreditationBadge:
      type: object
      x-ticvai-persistence: approvals.accreditation_badge
      description: '**Drafted 4 September.** The credential an approved application produces. **Its lifetime
        is not the approval''s** - a badge is revoked, lost or expires while the decision that authorised
        it still stands.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        approvalRequestId:
          type: string
          format: uuid
        holderName:
          type: string
        zones:
          type: array
          items:
            type: string
          description: Where this badge admits, which is the whole point of it.
        state:
          type: string
          enum:
          - issued
          - collected
          - suspended
          - revoked
          - expired
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedReason:
          type: string
    ApprovalKind:
      type: string
      description: '11.1.7 and 11.1.30–11.1.37. **The first four already exist as bespoke implementations**
        and this contract is what they collapse into.

        '
      enum:
      - refund
      - priceOverride
      - discountOverride
      - complimentaryTicket
      - membershipCancellation
      - accessPermissionChange
      - configurationChange
      - aiRecommendation
      - shiftVariance
      - releasePromotion
      - requisition
      - stockWriteOff
      - journalEntry
      - periodReopen
      - tenantMigration
    ApprovalStatus:
      type: string
      enum:
      - draft
      - pending
      - escalated
      - approved
      - rejected
      - withdrawn
      - expired
      - cancelled
    ApprovalMode:
      type: string
      description: '11.1.43–11.1.46. **Sequential** asks one at a time, **parallel** asks everyone at
        once, **consensus** needs all of them, **majority** needs more than half.

        Parallel and consensus differ in when it completes: parallel completes on the first approval,
        consensus waits for all. Conflating them is how a four-eyes rule turns into a one-eye rule.

        '
      enum:
      - sequential
      - parallel
      - consensus
      - majority
    ApprovalRule:
      type: object
      x-ticvai-persistence: approvals.rule
      required:
      - order
      - approverRoleIds
      - mode
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        order:
          type: integer
          description: '**First match wins.** Explicit ordering is what makes a matrix reviewable — an
            unordered set of overlapping rules is one nobody can reason about.

            '
        minAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        maxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        riskScoreAbove:
          type: number
          nullable: true
          description: '11.1.12. **Nothing supplies this yet** — risk scoring is parked with the model-dependent
            AI. The field exists so adding the engine later is configuration rather than a schema change.

            '
        condition:
          type: string
          nullable: true
          description: 11.1.13. Evaluated against the attributes the caller supplied.
        approverRoleIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        approverScopeLevel:
          type: string
          enum:
          - venue
          - department
          - region
          - tenant
          description: 11.1.39. Which organisational level the approver must sit at.
        mode:
          $ref: '#/components/schemas/ApprovalMode'
        levels:
          type: integer
          default: 1
          description: 11.1.3. Multi-level chains ask each level in turn.
        requiresMfa:
          type: boolean
          default: false
        requiresSignature:
          type: boolean
          default: false
        slaMinutes:
          type: integer
          nullable: true
          description: 11.1.14. Null means no SLA, which is different from a long one.
        escalateAfterMinutes:
          type: integer
          nullable: true
        escalateToRoleIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAfterMinutes:
          type: integer
          nullable: true
          description: 11.1.53. An unanswered request eventually stops waiting.
    ApprovalMatrix:
      type: object
      x-ticvai-persistence: approvals.matrix
      required:
      - kind
      - scopeLevel
      - rules
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        scopeLevel:
          type: string
          enum:
          - tenant
          - region
          - venue
        scopePath:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: '11.1.80. **A request is decided by the rules it was raised under.** Changing the
            matrix mid-flight would mean an approver answering a question that changed while they read
            it.

            '
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRule'
        isActive:
          type: boolean
    ApprovalRequirement:
      type: object
      x-ticvai-persistence: none — computed
      description: The answer to "does this need approval", returned before the action.
      required:
      - isRequired
      properties:
        isRequired:
          type: boolean
        matchedRule:
          allOf:
          - $ref: '#/components/schemas/ApprovalRule'
          nullable: true
        matrixVersion:
          type: integer
          nullable: true
        approvers:
          type: array
          description: 'Resolved, with delegations applied. **Named so the caller can say "this needs
            Sara"** rather than "this needs approval".

            '
          items:
            type: object
            properties:
              principalId:
                type: string
                format: uuid
              displayName:
                type: string
              level:
                type: integer
              isDelegate:
                type: boolean
              delegatedFrom:
                type: string
                format: uuid
                nullable: true
        slaMinutes:
          type: integer
          nullable: true
        noApproverAvailable:
          type: boolean
          description: '**The case that must not fail silently.** A rule requiring a role nobody at this
            venue holds means the action is blocked forever, and the caller needs to know that now rather
            than after raising a request nobody can decide.

            '
    CreateApprovalRequest:
      type: object
      x-ticvai-persistence: none — request only
      required:
      - id
      - kind
      - subjectContract
      - subjectType
      - subjectId
      - scopePath
      - summary
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        subjectContract:
          type: string
          description: Which contract owns the thing being approved.
        subjectType:
          type: string
        subjectId:
          type: string
          description: '**A reference, never a copy.** A copy goes stale between raising and deciding,
            and an approver reading a stale copy approves something that no longer exists.

            '
        scopePath:
          type: string
        summary:
          type: string
          maxLength: 300
          description: What the approver sees in their queue before opening it.
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        attributes:
          type: object
          additionalProperties: true
        justification:
          type: string
          maxLength: 1000
        isDraft:
          type: boolean
          default: false
    ApprovalDecision:
      type: object
      x-ticvai-persistence: approvals.decision
      required:
      - level
      - principalId
      - decision
      - decidedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        level:
          type: integer
        principalId:
          type: string
          format: uuid
        displayName:
          type: string
        isDelegate:
          type: boolean
        delegatedFrom:
          type: string
          format: uuid
          nullable: true
        decision:
          type: string
          enum:
          - approve
          - reject
        comment:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        usedMfa:
          type: boolean
        signatureRef:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
    ApprovalRequest:
      type: object
      x-ticvai-persistence: approvals.request
      required:
      - id
      - kind
      - status
      - requestedByPrincipalId
      - requestedAt
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        rerouteOnNoApprover:
          type: boolean
          default: true
          description: 'BL-154. **An approver on leave is an approval that waits for them to come back.**
            Reroutes to the next in the chain rather than stalling — `workforce` already knows who is
            on leave, and an approval queue nobody is watching is the thing that stops a venue.

            '
        outOfOfficeDelegateId:
          type: string
          format: uuid
          nullable: true
        allowEmailApproval:
          type: boolean
          default: false
          description: '**Approving from an email link with no second factor is the weakest path in the
            system**, so it is off by default and available only below a configured value.

            '
        reopenedFrom:
          type: string
          format: uuid
          nullable: true
          description: '**Reopening a decided approval creates a new one that points back.** Editing a
            decision in place destroys the record of what was originally approved, which is the only thing
            an audit wants.

            '
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        subjectContract:
          type: string
        subjectType:
          type: string
        subjectId:
          type: string
        scopePath:
          type: string
        summary:
          type: string
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        justification:
          type: string
          nullable: true
        requestedByPrincipalId:
          type: string
          format: uuid
        matrixVersion:
          type: integer
        mode:
          $ref: '#/components/schemas/ApprovalMode'
        currentLevel:
          type: integer
        totalLevels:
          type: integer
        pendingApprovers:
          type: array
          items:
            type: object
            properties:
              principalId:
                type: string
                format: uuid
              displayName:
                type: string
              isDelegate:
                type: boolean
        decisions:
          type: array
          description: 'Every decision at every level, in order. **Immutable once the request completes**
            (11.1.56) — an approval is evidence, and amending one is a different fact.

            '
          items:
            $ref: '#/components/schemas/ApprovalDecision'
        escalations:
          type: array
          description: '11.1.48. Who was asked, when, and why it moved up. **Escalation adds an approver
            rather than replacing one**, so the original stays in the record.

            '
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              reason:
                type: string
              fromLevel:
                type: integer
              toLevel:
                type: integer
              wasAutomatic:
                type: boolean
        resubmittedFromId:
          type: string
          nullable: true
        reopenedFromId:
          type: string
          nullable: true
        slaDueAt:
          type: string
          format: date-time
          nullable: true
        slaBreached:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    ApprovalDelegation:
      type: object
      x-ticvai-persistence: approvals.delegation
      required:
      - delegatorPrincipalId
      - delegatePrincipalId
      - from
      - to
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        delegatorPrincipalId:
          type: string
          format: uuid
        delegatePrincipalId:
          type: string
          format: uuid
        kinds:
          type: array
          description: Absent means everything the delegator may approve.
          items:
            $ref: '#/components/schemas/ApprovalKind'
        maxAmount:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          description: A delegate may be given less authority than the delegator, never more.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: '**Required.** An open-ended delegation is an approver who quietly stopped approving
            and a delegate who does not know they still hold it.

            '
        reason:
          type: string
        isActive:
          type: boolean
          readOnly: true
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    ApprovalRefusedProblem:
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        x-ticvai-persistence: none — error shape
        properties:
          refusedReason:
            type: string
            enum:
            - approverIsRequester
            - notInApproverChain
            - insufficientPermission
            - mfaRequired
            - signatureRequired
            - delegationExpired
            - alreadyDecidedAtThisLevel
    ApprovalAnalytics:
      type: object
      x-ticvai-persistence: none — aggregated from approvals.request
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        groupBy:
          type: string
        rows:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              raised:
                type: integer
              approved:
                type: integer
              rejected:
                type: integer
              withdrawn:
                type: integer
              expired:
                type: integer
                description: '**Requests nobody answered.** Usually a routing defect rather than a busy
                  approver, and the number that says the matrix names the wrong person.

                  '
              escalated:
                type: integer
              slaBreached:
                type: integer
              medianMinutes:
                type: number
              p95Minutes:
                type: number
