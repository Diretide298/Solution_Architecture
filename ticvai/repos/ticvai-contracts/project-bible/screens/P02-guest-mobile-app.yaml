    board: wireframes/P02 Guest App.dc.html#gst-027
  apisNote: Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formAddCartLine
    component: modal
    trigger: Add parking to my cart
    body: '**Collects what `addCartLine` sends before it is called.** Required: `variantId` (the car park''s
      parking product), `quantity`. Optional: `performanceId`, `attributes` (the plate). A 409 `soldOutForDay`
      is shown as **the car park is full** for that day — capacity reached, not a live count (decided
      28 September, audit R166). Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Add to cart
      operation: addCartLine
    dismiss:
      label: Cancel
      discards:
      - variantId
      - quantity
      - performanceId
      - attributes
    provenance: contract orders.yaml POST /carts/{cartId}/lines
  - id: formUpdateParkingEntitlement
    component: modal
    trigger: Save parking entitlement
    body: '**Collects what `updateParkingEntitlement` sends before it is called.** Nothing in the body
      is required. Optional: `plateNumber`, `plateCountry`, `status`. Dismissing sends nothing; the screen
      behind is unchanged.'
    bindsTo: UpdateParkingEntitlementRequest
    confirm:
      label: Save parking entitlement
      operation: updateParkingEntitlement
    dismiss:
      label: Cancel
      discards:
      - plateNumber
      - plateCountry
      - status
    provenance: contract access.yaml PATCH /parking-entitlements/{entitlementId}
