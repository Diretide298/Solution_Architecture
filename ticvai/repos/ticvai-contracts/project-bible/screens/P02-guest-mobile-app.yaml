platform:
  code: P02
  audience: guest
  formFactor: mobileApp
  shortName: Guest App
  name: Guest App — Mobile
  surface: guestFacing
  runtime: reactNative
  offlineCapable: true
  offlineBanner:
    kind: banner
    state: warning
    message: You're offline. Connect to the internet to book, pay, order or join a queue.
    shows: The moment the connection drops, on every screen, above the screen's own content.
    clears: By itself as soon as the connection is back, with a short "Back online" confirmation.
    never: Covers what is already on screen, or appears for a server error — that is the screen's own
      error state, and a guest told they are offline when the venue is down reconnects for nothing.
    provenance: Decided 12 September 2026 — guest web and guest app behave identically offline and say
      so with the same banner.
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 71
  app: guest-app
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: iOS / Android native
    distribution: App Store + Play, tenant developer account
    bundleUpdate: over-the-air for JS; store release for native
    hosting: n/a — installed
    storeReview: true
    deviceOwnership: guest device
    networkAssumption: mobile data, intermittent
    releaseCadence: fortnightly, gated by review
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: White Label Builder — the guest app is what the builder configures.
  operator: guest
  wireframeBoard: wireframes/P02 Guest App.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: guest
    name: TICVAI Guest
    shell: mobile
    siblings:
    - P01
    - P05
    note: '**One guest product in three shells.** Web, mobile and kiosk share 73–91% of their operations;
      the kiosk is the same product in a fixed frame with no keyboard, and is deliberately narrower rather
      than different.'
    decided: 10 September 2026
