- id: GST-073
  name: Security & Sign-in
  module: Account & Self-Service
  requiresModule: core
  wave: 2
  capability: read-write
  implementation:
    app: guest-app
    route: /account/security-sign-in
    component: apps/guest-app/src/routes/account/SecuritySignIn.tsx
    status: notStarted
  navigation:
    exitTo:
    - GST-039
    entryFrom:
    - GST-039
    inferred: false
    notes: '**Reached from GST-039** — sign-in security is a setting on the profile. Stated on 4 September:
      this screen exited somewhere and nothing exited to it, so it was outside the navigation graph entirely.'
    transitions:
    - to: GST-039
      trigger: Profile
      carries:
      - subjectId
      provenance: derived — GST-039 declares entryState.params subjectId and GST-073 holds subjectId,
        so an edge into it carries them
  notes: '**A guest could enrol a second factor and not manage it.** Small screen, and it is the one a
    guest reaches after losing a phone. **No second factor for guests** (decided 28 September, audit R167,
    R073 (a)): `createMfaChallenge` is removed from this screen. The identity contract still lets a guest
    surface call it for step-up before a sensitive act on its own account, but a guest cannot enrol a
    method (the staff kinds only), so nothing here could satisfy it; the decision is to offer none. What
    the screen offers instead: the sign-in methods linked to the account (`GuestSession.identityProviders`),
    confirming the email that recovers it (`verifyGuestEmail`), the devices that hold its credentials
    and signing a lost one out (`listGuestDevices`, `revokeGuestDevice`), and signing out here (`guestLogout`).
    The contract has no guest operation that lists sessions, so "your sessions" is the device list.'
  density: comfortable
  offline: false
  pattern: configEditor
  patternReason: settings for the guest's own sign-in — the linked sign-in methods (`getGuestSession`)
    and the devices that hold the account (`listGuestDevices`), each with one act; not a list to browse
  purpose: '**How this guest signs in, and where.** The sign-in methods linked to the account, the email
    that recovers it, and the devices signed in, with a way to sign a lost phone out. Small screen, and
    it is the one a guest reaches after losing a phone. No second factor: guests have none (decided 28
    September, audit R167).'
  layout:
    template: form
    regions:
    - name: actionBar
      slot: publish
      components:
      - kind: secondaryButton
        label: Sign out on this device
        operation: guestLogout
        provenance: contract identity.yaml DELETE /auth/guest/session
      - kind: secondaryButton
        label: Register guest device
        operation: registerGuestDevice
        provenance: contract marketing-crm.yaml POST /guests/{subjectId}/devices
      - kind: destructiveButton
        label: Revoke guest device
        operation: revokeGuestDevice
        provenance: contract marketing-crm.yaml DELETE /guests/{subjectId}/devices/{deviceId}
      - kind: secondaryButton
        label: Verify guest email
        operation: verifyGuestEmail
        provenance: contract identity.yaml POST /auth/guest/verify-email
    - name: contentBody
      components:
      - kind: dataTable
        label: Every guest device
        bindsTo: GuestDevice
        columns:
        - GuestDevice.id
        - GuestDevice.subjectId
        - GuestDevice.platform
        - GuestDevice.tokenFingerprint
        - GuestDevice.tokenRef
        - GuestDevice.appVersion
        - GuestDevice.osVersion
        - GuestDevice.deviceModel
        - GuestDevice.locale
        - GuestDevice.status
        - GuestDevice.failureCount
        - GuestDevice.registeredAt
        operation: listGuestDevices
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}/devices
      - kind: detailPanel
        label: How you sign in
        bindsTo: GuestSession
        columns:
        - GuestSession.displayName
        - GuestSession.isVerified
        - GuestSession.identityProviders
        operation: getGuestSession
        notes: The sign-in methods linked to this account (code, password, Apple, Google, UAE Pass) and
          whether its contact is verified. No second factor is listed or offered (audit R167).
        provenance: contract identity.yaml GET /auth/guest/session
  states:
    loading: Content loads.
    error: Could not load. **Says what failed and offers one way onward**, never a bare failure.
    emptyFirstRun: '**Only this device is signed in.** The device list holds one row, this one, and the
      screen says that signing in elsewhere will add a row here.'
    emptyNoAccess: Shown when the caller lacks `GUEST_VIEW`, which `verifyGuestEmail` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Nothing here is offered offline, and the banner says so.** An erasure request or a device
      change queued and never sent is worse than one that could not be made — the legal clock starts when
      the platform receives it, and a device signed out offline is still signed in.'
  apis:
  - operationId: getGuestSession
    contract: identity
    purpose: The sign-in methods linked to the account and whether it is verified
    trigger: onLoad
  - operationId: guestLogout
    contract: identity
    purpose: Sign out on this device
    trigger: onAction
  - operationId: listGuestDevices
    contract: marketing-crm
    purpose: Which devices hold this guest's credentials
    trigger: onLoad
  - operationId: registerGuestDevice
    contract: marketing-crm
    purpose: Trust this device
    trigger: onAction
  - operationId: revokeGuestDevice
    contract: marketing-crm
    purpose: Sign a lost device out
    trigger: onAction
  - operationId: verifyGuestEmail
    contract: identity
    purpose: Confirm the address before it can recover an account
    trigger: onAction
  entryState:
    params:
    - name: subjectId
      from: session
    - name: deviceId
      from: session
    coldEntry: '**Resolves from the session.** A guest arriving cold is asked to sign in and returned
      here afterwards — never a 404, and never a screen that silently shows somebody else''s data (ADR-0030).'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P02 Guest App.dc.html#gst-073
  apisNote: Rebuilt 9 September 2026 from the 1 operation this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formRegisterGuestDevice
    component: modal
    trigger: Register guest device
    body: '**Collects what `registerGuestDevice` sends before it is called.** Required: `platform`, `token`.
      Optional: `appVersion`, `osVersion`, `deviceModel`, `locale`. Dismissing sends nothing; the screen
      behind is unchanged.'
    confirm:
      label: Register guest device
      operation: registerGuestDevice
    dismiss:
      label: Cancel
      discards:
      - platform
      - token
      - appVersion
      - osVersion
      - deviceModel
      - locale
    provenance: contract marketing-crm.yaml POST /guests/{subjectId}/devices
  - id: confirmRevokeGuestDevice
    component: confirmDialog
    trigger: Revoke guest device
    body: '**Names what `revokeGuestDevice` changes and what it leaves alone**, in the consequence rather
      than the verb. A security sign-in this affects should be identified in the dialog, not just counted.'
    provenance: contract marketing-crm.yaml DELETE /guests/{subjectId}/devices/{deviceId}
  - id: formVerifyGuestEmail
    component: modal
    trigger: Verify guest email
    body: '**Collects what `verifyGuestEmail` sends before it is called.** Required: `mode`. Optional:
      `token`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Verify guest email
      operation: verifyGuestEmail
    dismiss:
      label: Cancel
      discards:
      - mode
      - token
    provenance: contract identity.yaml POST /auth/guest/verify-email
