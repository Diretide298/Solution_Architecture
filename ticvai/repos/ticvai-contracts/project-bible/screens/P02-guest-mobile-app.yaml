  notes: States derived from the screen pattern on 17 August, not individually considered. Purpose derived
    from the screen name and its operations on 17 August, not from a requirement. Landing. **Declared
    only a health check.** Pranay asked for guest details and tickets; Chitrangi asked for search. All
    three existed and none were wired. **Rewired on the 20 August review.** **Venue selection added 28
    September** (decided 28 September, audit R267) — a venue picker on first open, remembered on the device,
    **Change venue**, and a visit-day suggestion from the guest's ticket (`listMyEntitlements`). Nothing
    in `getTenantAppStatus.venues` supplies the options, the tenant's active venues, public and cacheable.
  density: comfortable
  pattern: listDetail
  patternReason: '`listMyEntitlements` reads the population and `getTenantAppStatus` reads one of them
    — list, select, act'
  purpose: The screen this app sits on. Everything else is entered from here and returns to it.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: selectField
        label: Your venue
        bindsTo: TenantAppStatus.venues
        operation: getTenantAppStatus
        notes: '**The guest picks a venue on first open** (decided 28 September, audit R267): shown before
          anything else when the device has no venue remembered, and remembered on the device after that.
          The chosen `venueId` is what every screen that declares `venueId` `from: session` reads. The
          options are `getTenantAppStatus.venues` (venue id, name, city, today''s opening hours), the
          tenant''s active venues, returned without a session.'
        provenance: contract white-label.yaml GET /tenant-config/status (TenantAppStatus.venues, audit
          R267)
      - kind: secondaryButton
        label: Change venue
        notes: Reopens the venue picker; the new choice replaces the remembered one on this device and
          every venue-scoped screen reloads for it (decided 28 September, audit R267).
        provenance: decided 28 September 2026, audit R267
      - kind: banner
        label: Visiting today?
        bindsTo: Entitlement
        columns:
        - Entitlement.venueId
        - Entitlement.validFrom
        - Entitlement.validTo
        operation: listMyEntitlements
        notes: '**On a visit day the app suggests the ticket''s venue** (decided 28 September, audit R267):
          for a signed-in guest, an entitlement from `listMyEntitlements` (`state=upcoming`) valid today
          at a venue other than the chosen one offers **Switch to that venue**; the guest decides, the
          app never switches by itself.'
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: banner
        label: Sold out or closed today
        bindsTo: TenantAppStatus.availabilityMessage
        operation: getTenantAppStatus
        notes: From `getTenantAppStatus.availability` (`open`, `soldOut`, `closed`) and `availabilityMessage`
          (decided 28 September, audit R073 (f)); nothing shows while it is `open`.
        provenance: contract white-label.yaml GET /tenant-config/status
      - kind: selectField
        label: State
        operation: listMyEntitlements
        notes: Sends `?state=` to `listMyEntitlements`.
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: toggle
        label: Include shared
        operation: listMyEntitlements
        notes: Sends `?includeShared=` to `listMyEntitlements`.
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: dataTable
        label: Every entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.id
        - Entitlement.templateId
        - Entitlement.productId
        - Entitlement.orderId
        - Entitlement.orderLineId
        - Entitlement.subjectId
        - Entitlement.venueId
        - Entitlement.scopePath
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        operation: listMyEntitlements
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: dataTable
        label: Every money
        bindsTo: Money
        columns:
        - Money.amount
        - Money.currency
        - Money.scale
        operation: searchCatalogue
        provenance: contract catalogue.yaml GET /search
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected entitlement
        bindsTo: Entitlement
        columns:
        - Entitlement.id
        - Entitlement.templateId
        - Entitlement.productId
        - Entitlement.orderId
        - Entitlement.orderLineId
        - Entitlement.subjectId
        - Entitlement.venueId
        - Entitlement.scopePath
        - Entitlement.mediaCode
        - Entitlement.status
        - Entitlement.statusNote
        - Entitlement.validFrom
        - Entitlement.validTo
        - Entitlement.entriesUsed
        - Entitlement.entriesAllowed
        - Entitlement.lastEntryAt
        operation: listMyEntitlements
        provenance: contract access.yaml GET /guests/me/entitlements
      - kind: detailPanel
        label: The guest profile
        bindsTo: GuestProfileDetail
        columns:
        - GuestProfileDetail.id
        - GuestProfileDetail.subjectId
        - GuestProfileDetail.displayName
        - GuestProfileDetail.email
        - GuestProfileDetail.phone
        - GuestProfileDetail.preferredLanguage
        - GuestProfileDetail.preferredChannel
        - GuestProfileDetail.guestLinkId
        - GuestProfileDetail.tags
        - GuestProfileDetail.engagementScore
        - GuestProfileDetail.engagementTier
        - GuestProfileDetail.lifetimeValue
        - GuestProfileDetail.visitCount
        - GuestProfileDetail.lastVisitAt
        - GuestProfileDetail.isActive
        - GuestProfileDetail.mergedIntoSubjectId
        operation: getGuestProfile
        provenance: contract marketing-crm.yaml GET /guests/{subjectId}
      - kind: detailPanel
        label: The tenant config
        bindsTo: TenantConfig
        columns:
        - TenantConfig.isDraft
        - TenantConfig.brand
        - TenantConfig.appIcons
        - TenantConfig.bookingFlow
        - TenantConfig.theme
        - TenantConfig.fonts
        - TenantConfig.footer
        - TenantConfig.notificationBranding
        - TenantConfig.enabledPaymentMethods
        - TenantConfig.accessibility
        - TenantConfig.header
        - TenantConfig.navigation
        - TenantConfig.homepage
        - TenantConfig.modules
        - TenantConfig.features
        - TenantConfig.languages
        operation: getTenantConfig
        provenance: contract white-label.yaml GET /tenant-config
      - kind: detailPanel
        label: The tenant app status
        bindsTo: TenantAppStatus
        columns:
        - TenantAppStatus.isPublished
        - TenantAppStatus.publishedVersion
        - TenantAppStatus.publishedAt
        - TenantAppStatus.draftVersion
        - TenantAppStatus.hasUnpublishedChanges
        - TenantAppStatus.activeModuleCount
        - TenantAppStatus.licensedModuleCount
        - TenantAppStatus.activePageCount
        - TenantAppStatus.isInMaintenance
        - TenantAppStatus.maintenanceMessage
        - TenantAppStatus.expectedBackAt
        - TenantAppStatus.recentChanges
        operation: getTenantAppStatus
        provenance: contract white-label.yaml GET /tenant-config/status
  states:
    loading: The home default list.
    error: Could not load. Names which read failed and leaves the home default untouched.
    emptyFirstRun: No home default yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing matches the filter on state, includeShared and the home default are still
      there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `GUEST_VIEW`, which `getGuestProfile` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**The offline banner shows.** What was already loaded stays on screen, marked with its age.
      Anything that spends money, holds capacity or changes the account waits for the connection, and
      its button says so rather than failing.'
  apis:
  - operationId: getTenantAppStatus
    contract: white-label
    purpose: App status and recent changes
    trigger: onLoad
  - operationId: getGuestProfile
    contract: marketing-crm
    purpose: Read a guest profile
    trigger: onLoad
  - operationId: listMyEntitlements
    contract: access
    purpose: Every ticket, pass and membership this guest holds; on a visit day, the ticket's venue is
      suggested (decided 28 September, audit R267)
    trigger: onLoad
  - operationId: searchCatalogue
    contract: catalogue
    purpose: Find something by name
    trigger: onAction
  - operationId: getTenantConfig
    contract: white-label
    purpose: Branding, currency and what this venue enables
    trigger: onLoad
  entryState:
    params:
    - name: subjectId
      from: session
    coldEntry: 'Resolves from the session; a cold arrival is the ordinary case. **The venue comes from
      the device** (decided 28 September, audit R267): on first open the guest picks one, it is remembered
      on the device and changeable from this screen, and on a visit day the ticket''s venue is suggested.
      Every guest screen that declares `venueId` `from: session` reads that remembered choice.'
    preloaded:
    - Entitlement.id
    - Entitlement.templateId
    - Entitlement.productId
    - Entitlement.orderId
    - Entitlement.orderLineId
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P02 Guest App.dc.html#gst-001
  apisNote: Rebuilt 9 September 2026 from the 4 operations this screen declares, not from a workshop pack
