    offline: '**The offline banner shows.** Reports already loaded stay read-only with their age. **Reporting
      a loss and replying are disabled offline** — both need the connection (decided 28 September, audit
      R148) — and the screen says how to reach staff in person instead: the guest services desk or lost-property
      point, or any member of staff.'
