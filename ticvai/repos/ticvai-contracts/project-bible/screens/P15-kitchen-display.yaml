# P15 — Kitchen Display
#
# Board 3 of the client F&B design set, received 20 August 2026. Ten screens.
# Its own platform because a kitchen display is used standing, must survive the network
# going down, and nobody logs into it.
#
# Validated against _schema.yaml; component kinds from _components.yaml.

platform:
  code: P15
  formFactor: kiosk
  surface: staffFacing
  runtime: reactWeb
  themes:
  - dark
  directions:
  - ltr
  app: kitchen-display
  appStatus: not scaffolded
  operator: venue
  deployment:
    target: browser
    distribution: served from the cell
    bundleUpdate: on next idle
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: venue-owned, wall-mounted, never moved
    networkAssumption: venue LAN, and it must survive losing it
    releaseCadence: '**Deployed when the kitchen is closed, never during service.** A display that restarts
      mid-service loses the rail a chef is reading.'
  name: Kitchen Display — Pass and Stations
  shortName: Kitchen Display
  audience: staff
  offlineCapable: true
  screenCount: 10
  notes: '**Its own platform, and the placement rule is what put it here.** Three questions decide where
    a board screen rests, and a kitchen display answers all three differently from a back office: it
    is used standing, it **must survive the network going down because the kitchen still has to send
    food out**, and no existing platform does it — P08 had a `Kitchen Display` screen among 143 back-office
    screens, which is a rail buried in a configuration tool.


    **Nobody logs in.** It is on when the kitchen is open and resolves its station from the device assignment,
    which is why every screen here is cold-entry and none of them has a sign-in.


    **Dark theme only.** A kitchen is lit for cooking, not for reading, and a white screen at head height
    in a service window is a light source.


    **Depends on `offline-core`.**  refused the platform without it, and correctly — **an app that queues
    writes without it does not queue them anywhere**, and every bump on this platform is a write that
    has to survive a dropped network.'
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  wireframeBoard: wireframes/P15 Kitchen Display.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
screens:
- id: KIT-001
  name: Kitchen Operations Command Center
  module: Kitchen
  wave: 2
  purpose: Kitchen Operations Command Center — board 3 of the client F&B design set.
  density: touchLarge
  densityReason: '**Bumped by somebody with flour on their hands, read from two metres, in a room where
    nobody is sitting down.** A kitchen display is not a back office at a different width.'
  apis:
  - operationId: listKitchenTickets
    contract: fnb
    purpose: Kitchen ticket queue
    trigger: onLoad
  - operationId: listKitchenStations
    contract: fnb
    purpose: List preparation stations and their routing
    trigger: onLoad
  - operationId: listFnbOrders
    contract: fnb
    purpose: List F&B orders
    trigger: onLoad
  states:
    loading: The rail, oldest ticket first. **The count renders before the tickets** — a kitchen wants
      to know how deep it is before it reads anything.
    emptyFirstRun: '**No tickets. The kitchen is clear**, and that is worth saying plainly rather than
      showing a blank rail — a screen that looks broken and a screen that means nothing to do are the
      same picture otherwise.'
    emptyNoResults: Nothing matches this station or course filter. **The rail is not empty** — the filter
      is narrow, and on a kitchen screen that distinction is the difference between calm and panic.
    emptyNoAccess: This display is not assigned to a station. **Assignment is a back-office act** —
      a kitchen screen does not choose what it shows.
    error: Could not reach the platform. **The rail is still live from cache** and every bump is queued.
    offline: '**Amber, and it keeps working.** The kitchen still has to send food out — a display that
      blanks mid-service is worse than one that says it is behind, and every bump journals locally and
      syncs when the network returns.'
  entryState:
    params:
    - name: venueId
      from: session
    - name: stationId
      from: session
    coldEntry: '**Cold is the only way in.** Nobody logs into a kitchen display — it is on when the
      kitchen is open, and it resolves its station from the device assignment rather than from a person.'
  layout:
    template: board
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: KitchenTicket[]
        notes: '**One ticket per card, ordered by promise time not arrival.** A ticket due in two minutes
          sits above one that arrived first, because a kitchen works to when food is wanted.'
      - kind: metricTile
        notes: Depth, oldest ticket age, station load. **Three numbers, glanceable** — anything a chef
          has to read is a number they will not read.
      - kind: primaryButton
        label: Bump
  navigation:
    isEntryPoint: true
    exitTo:
    - KIT-002
    - KIT-003
    - KIT-004
    - KIT-005
    - KIT-006
    - KIT-007
    - KIT-008
    - KIT-009
    - KIT-010
  implementation:
    app: kitchen-display
    route: /kitchen/kitchen-operations-command-center
    component: apps/kitchen-display/src/routes/kitchen/KitchenOperationsCommandCenterBoard.tsx
    status: notStarted
  wireframe:
    status: designed
    board: wireframes/P15 Kitchen Display.dc.html#kit-001
    source: Claude Design F&B pack, 20 August
    note: '**Drawn as FNB-3A in the client pack.** The pack''s frame is the specification for this screen
      — it carries operations, states, entry params and exits, and it is better specified than anything
      derived from the screen file.'
    derivedFrom: wireframes/FnB Board 3.dc.html#fnb-3a
  provenance: client board, specified
  notes: '**Built 20 August from board 3 of the client F&B design set.** **Board repointed 24 August.**
    This screen pointed at `wireframes/FnB Board 3.dc.html#fnb-3a` — a frame in the client pack, which
    is where the design came from and not where this screen is drawn. **`P15 Kitchen Display.dc.html`
    and `P16 Venue Analytics.dc.html` carry one anchor per screen and nothing referenced either**, so
    both shipped correctly anchored and unreachable. The pack frame is kept in `derivedFrom` because
    provenance is worth more than the wrong pointer.'
  requiresModule: fnb
  boardFrames:
  - FNB-3A
