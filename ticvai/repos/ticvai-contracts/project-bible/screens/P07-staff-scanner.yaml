platform:
  code: P07
  audience: staff
  formFactor: handheld
  shortName: Venue Scanner
  name: Venue Scanner — Access Control
  surface: staffFacing
  runtime: reactNative
  app: venue-scanner
  appStatus: scaffolded
  offlineCapable: true
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: rugged handheld — Android
    distribution: MDM
    bundleUpdate: at shift start
    hosting: local, offline-first (ADR-0013)
    storeReview: false
    deviceOwnership: venue-owned, issued per shift
    networkAssumption: must function with none
    releaseCadence: monthly, never on an event day
  screenCount: 11
  designReferences:
  - path: sources/designs/TICVAI_Employee_App_UI_Reference_1.pdf
    note: Employee app reference. The scanner shares its visual language and its offline strip.
  operator: venue
  directions:
  - ltr
  - rtl
  densityNote: '**A gate device held in one hand while the other takes a ticket.** `compact` was assigned
    by platform code on 18 August and it was wrong — a scanner is not a desktop.'
  wireframeBoard: wireframes/P07 Venue Scanner.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-staff-mobile
    name: TICVAI Venue Staff
    shell: handheld
    siblings:
    - P06
    note: '**Both offline-capable, both carried rather than sat at.** They cannot fold into venue management,
      which is online desktop web, and they share 69% with each other.'
    decided: 10 September 2026
screens:
- id: SCN-001
  name: Sign in
  module: Access
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-scanner
    route: /access/sign-in
    component: apps/venue-scanner/src/routes/access/SignInDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - SCN-002
    - SCN-003
    inferred: true
    fromFlows: true
    isEntryPoint: true
    transitions:
    - to: SCN-002
      trigger: Confirms access point and direction
      provenance: flow F06 step 1→2, F61 step 1→2
    - to: SCN-003
      trigger: Ready to scan
      provenance: structural — SCN-001 is P07's home screen and its exits are its launcher
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **createCashMovement removed 18 August** — attached by module resemblance, not
    by what this screen does. A screen that does not handle money should not be able to move it (CF-87''s
    class). **Sign in.** The session carries the workstation, so the device cannot scan before it knows
    who is holding it. **Declared 20 August** — `isEntryPoint` existed in the schema and five platforms
    used none, so every screen in them read as unreachable. **`selectRole` and `resolvePermissions` wired
    24 August.** ADR-0002 makes authorisation user-driven and **a sign-in screen that does not resolve
    a role is a sign-in that grants nothing** — found by walking F61. **Removed 24 August**: acceptShiftVariance,
    approveShiftOpen, closeShift, forceLogout, getShift, listActiveSessions, listCashMovements, listShifts,
    openShift, recordNoSale, reopenShift, resumeShift, revokeAllSessions, suspendShift. **Bulk-attach
    residue** — the 18 August defect that put identical operation sets on unrelated screens. A till does
    not cancel a performance, a staff app does not create roles, and **a scanner does not run a cash shift.**'
  density: comfortable
  pattern: listDetail
  patternReason: '`listMfaMethods` reads the population and `getCurrentShift` reads one of them — list,
    select, act'
  purpose: PIN or badge. Session carries the workstation.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Every MFA method
        bindsTo: MfaMethod
        columns:
        - MfaMethod.id
        - MfaMethod.kind
        - MfaMethod.label
        - MfaMethod.maskedTarget
        - MfaMethod.isActive
        - MfaMethod.isPrimary
        - MfaMethod.enrolledAt
        - MfaMethod.lastUsedAt
        operation: listMfaMethods
        provenance: contract identity.yaml GET /auth/mfa/methods
      - kind: dataTable
        label: Every SSO provider
        bindsTo: SsoProvider
        columns:
        - SsoProvider.id
        - SsoProvider.displayName
        - SsoProvider.protocol
        - SsoProvider.iconAssetRef
        - SsoProvider.isEnforced
        - SsoProvider.scopePath
        operation: listSsoProviders
        provenance: contract identity.yaml GET /auth/sso/providers
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected MFA method
        bindsTo: MfaMethod
        columns:
        - MfaMethod.id
        - MfaMethod.kind
        - MfaMethod.label
        - MfaMethod.maskedTarget
        - MfaMethod.isActive
        - MfaMethod.isPrimary
        - MfaMethod.enrolledAt
        - MfaMethod.lastUsedAt
        operation: listMfaMethods
        provenance: contract identity.yaml GET /auth/mfa/methods
      - kind: detailPanel
        label: The session
        bindsTo: Session
        columns:
        - Session.sessionId
        - Session.principalId
        - Session.roleId
        - Session.displayName
        - Session.scope
        - Session.effectivePermissions
        - Session.permissionsByScope
        - Session.saleBoardId
        - Session.workstation
        - Session.openedAt
        - Session.expiresAt
        operation: getCurrentSession
        provenance: contract identity.yaml GET /auth/session
      - kind: detailPanel
        label: The shift
        bindsTo: Shift
        columns:
        - Shift.id
        - Shift.workstationId
        - Shift.venueId
        - Shift.scopePath
        - Shift.principalId
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        - Shift.openingFloat
        - Shift.salesTotal
        - Shift.refundsTotal
        - Shift.liftsTotal
        operation: getCurrentShift
        provenance: contract shift.yaml GET /shifts/current
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Login
        operation: login
        provenance: contract identity.yaml POST /auth/login
      - kind: secondaryButton
        label: Select role
        operation: selectRole
        provenance: contract identity.yaml POST /auth/select-role
      - kind: secondaryButton
        label: Resolve permissions
        operation: resolvePermissions
        provenance: contract identity.yaml POST /permissions/resolve
  states:
    loading: The sign list.
    error: Could not load. Names which read failed and leaves the sign untouched.
    emptyFirstRun: No sign yet. **Offers no create action** — this screen declares no operation that makes
      one — and says so rather than showing an empty table.
    emptyNoResults: 'Never shown: `listMfaMethods` takes no filter, so an empty list is always the first-run
      state above.'
    emptyNoAccess: Shown when the caller lacks `SHIFT_OPEN`, which `getCurrentShift` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Signs in against the cached principal list from the last bundle.** A steward locked out
      at 08:00 because the venue wifi is down is a gate that does not open'
  apis:
  - operationId: login
    contract: identity
    purpose: From the flow it appears in
    trigger: onAction
  - operationId: getCurrentShift
    contract: shift
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  - operationId: listMfaMethods
    contract: identity
    purpose: Enrolled MFA methods
    trigger: onLoad
  - operationId: listSsoProviders
    contract: identity
    purpose: Identity providers configured for this tenant
    trigger: onLoad
  - operationId: selectRole
    contract: identity
    purpose: Choose a role for a multi-role session
    trigger: onAction
    invalidates:
    - listMfaMethods
  - operationId: resolvePermissions
    contract: identity
    purpose: Simulate a principal's effective permissions
    trigger: onAction
    invalidates:
    - listMfaMethods
  entryState:
    params:
    - name: shiftId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - MfaMethod.id
    - MfaMethod.kind
    - MfaMethod.label
    - MfaMethod.maskedTarget
    - MfaMethod.isActive
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P07 Venue Scanner.dc.html#scn-001
  apisNote: Rebuilt 9 September 2026 from the 8 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formLogin
    component: modal
    trigger: Login
    body: '**Collects what `login` sends before it is called.** Required: `username`, `credential`, `workstationId`.
      Optional: `method`, `deviceFingerprint`. Dismissing sends nothing; the screen behind is unchanged.'
    bindsTo: LoginRequest
    confirm:
      label: Login
      operation: login
    dismiss:
      label: Cancel
      discards:
      - username
      - credential
      - workstationId
      - method
      - deviceFingerprint
    provenance: contract identity.yaml POST /auth/login
  - id: formSelectRole
    component: modal
    trigger: Select role
    body: '**Collects what `selectRole` sends before it is called.** Required: `roleId`. Dismissing sends
      nothing; the screen behind is unchanged.'
    confirm:
      label: Select role
      operation: selectRole
    dismiss:
      label: Cancel
      discards:
      - roleId
    provenance: contract identity.yaml POST /auth/select-role
  - id: formResolvePermissions
    component: modal
    trigger: Resolve permissions
    body: '**Collects what `resolvePermissions` sends before it is called.** Required: `principalId`,
      `roleId`. Optional: `atScopePath`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Resolve permissions
      operation: resolvePermissions
    dismiss:
      label: Cancel
      discards:
      - principalId
      - roleId
      - atScopePath
    provenance: contract identity.yaml POST /permissions/resolve
- id: SCN-002
  name: Access point & direction
  module: Access
  requiresModule: access
  wave: 1
  capability: C00
  implementation:
    app: venue-scanner
    route: /access/access-point-direction
    component: apps/venue-scanner/src/routes/access/AccessPointDirectionDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - SCN-001
    - SCN-003
    - SCN-013
    - SCN-015
    - SCN-016
    inferred: true
    fromFlows: true
    transitions:
    - to: SCN-015
      trigger: Loads the offline package
      provenance: flow F06 step 2→3, F61 step 2→3
    - to: SCN-001
      trigger: Sign in
      provenance: derived — SCN-001 declares entryState.params  and SCN-002 holds none of them, so the
        edge carries nothing and SCN-001 opens cold
    - to: SCN-003
      trigger: Ready to scan
      provenance: derived — SCN-003 declares entryState.params mediaCode, rightId and SCN-002 holds none
        of them, so the edge carries nothing and SCN-003 opens cold
    - to: SCN-016
      trigger: Gate mode
      carries:
      - accessPointId
      provenance: derived — SCN-016 declares entryState.params accessPointId and SCN-002 holds accessPointId,
        so an edge into it carries them
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Authoring operations removed 24 August**: createAccessPoint, setAccessPointGeofence,
    updateAccessPoint. **A scanner reads the gate configuration; it does not write it.** An access point
    is created in the back office and a geofence is a venue decision — a handheld at a lane that can redefine
    the lane is a handheld that can admit anywhere. **`setTurnstileMode` belongs here and flow F06 is
    why.** It was taken off on 4 September on the reasoning that this screen only reads — but F06 *guest
    enters the venue* step 2 is ''confirms access point and direction'', and confirming the direction
    IS setting the mode. The flow is the authority on the journey; the screen was right and the tidy-up
    was wrong.'
  density: comfortable
  pattern: listDetail
  patternReason: '`listAccessPoints` reads the population and `getAccessPoint` reads one of them — list,
    select, act'
  purpose: Confirm what this device is doing before it does it.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Venue id
        operation: listAccessPoints
        notes: Sends `?venueId=` to `listAccessPoints`.
        provenance: contract access.yaml GET /access-points
      - kind: dataTable
        label: Every access point
        bindsTo: AccessPoint
        columns:
        - AccessPoint.id
        - AccessPoint.code
        - AccessPoint.name
        - AccessPoint.venueId
        - AccessPoint.scopePath
        - AccessPoint.externalCredentialSources
        - AccessPoint.scanAnomalyRules
        - AccessPoint.operatingMode
        - AccessPoint.vehicleLocationCapture
        - AccessPoint.mode
        - AccessPoint.direction
        - AccessPoint.antiPassbackEnabled
        operation: listAccessPoints
        provenance: contract access.yaml GET /access-points
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected access point
        bindsTo: AccessPoint
        columns:
        - AccessPoint.id
        - AccessPoint.code
        - AccessPoint.name
        - AccessPoint.venueId
        - AccessPoint.scopePath
        - AccessPoint.externalCredentialSources
        - AccessPoint.scanAnomalyRules
        - AccessPoint.operatingMode
        - AccessPoint.vehicleLocationCapture
        - AccessPoint.mode
        - AccessPoint.direction
        - AccessPoint.antiPassbackEnabled
        - AccessPoint.isActive
        - AccessPoint.lastHeartbeatAt
        operation: getAccessPoint
        provenance: contract access.yaml GET /access-points/{accessPointId}
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save turnstile mode
        operation: setTurnstileMode
        provenance: contract access.yaml PUT /access-points/{accessPointId}/mode
  states:
    loading: The access point direction list.
    error: Could not load. Names which read failed and leaves the access point direction untouched.
    emptyFirstRun: No access point direction yet. **Offers no create action** — this screen declares no
      operation that makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing matches the filter on venueId and the access point direction are still there.
      Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `SCOPE_VIEW`, which `listAccessPoints` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: Fully offline. The access point list is in the bundle
  apis:
  - operationId: listAccessPoints
    contract: access
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: getAccessPoint
    contract: access
    purpose: Read an access point
    trigger: onAction
  - operationId: setTurnstileMode
    contract: access
    purpose: Confirm the direction this gate runs in
    trigger: onAction
    invalidates:
    - listAccessPoints
  entryState:
    params:
    - name: accessPointId
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `accessPointId`.'
    preloaded:
    - AccessPoint.id
    - AccessPoint.code
    - AccessPoint.name
    - AccessPoint.venueId
    - AccessPoint.scopePath
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P07 Venue Scanner.dc.html#scn-002
  apisNote: Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
    to the ones that matter is work a person still owes this screen.
  overlays:
  - id: formSetTurnstileMode
    component: modal
    trigger: Save turnstile mode
    body: '**Collects what `setTurnstileMode` sends before it is called.** Required: `mode`. Optional:
      `reason`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Save turnstile mode
      operation: setTurnstileMode
    dismiss:
      label: Cancel
      discards:
      - mode
      - reason
    provenance: contract access.yaml PUT /access-points/{accessPointId}/mode
- id: SCN-003
  name: Ready to scan
  module: Access
  requiresModule: access
  wave: 1
  capability: C00
  implementation:
    app: venue-scanner
    route: /access/ready-to-scan
    component: apps/venue-scanner/src/routes/access/ReadyToScanDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - SCN-001
    - SCN-002
    - SCN-003
    - SCN-007
    - SCN-008
    - SCN-009
    - SCN-011
    - SCN-014
    inferred: true
    fromFlows: true
    transitions:
    - to: SCN-007
      trigger: A school party of forty arrives on one booking
      provenance: flow F61 step 4→5
    - to: SCN-014
      trigger: Syncs the journal when signal returns
      provenance: flow F06 step 5→6, F19 step 3→4
    - to: SCN-001
      trigger: Sign in
      provenance: derived — SCN-001 declares entryState.params  and SCN-003 holds none of them, so the
        edge carries nothing and SCN-001 opens cold
    - to: SCN-002
      trigger: Access point & direction
      carries:
      - accessPointId
      provenance: derived — SCN-002 declares entryState.params accessPointId and SCN-003 holds accessPointId,
        so an edge into it carries them
    - to: SCN-003
      trigger: Ready to scan
      carries:
      - mediaCode
      - rightId
      provenance: derived — SCN-003 declares entryState.params mediaCode, rightId and SCN-003 holds mediaCode,
        rightId, so an edge into it carries them
    - to: PTR-015
      trigger: Reviews usage
      provenance: flow F10 step 4→5
      operation: validateAccess
      crossesDevice: true
      back: false
    - to: SCN-011
      trigger: Delegated right
      carries:
      - rightId
      provenance: derived — SCN-011 declares entryState.params rightId and SCN-003 holds rightId, so an
        edge into it carries them
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Absorbed SCN-004, SCN-005, SCN-006, SCN-010, SCN-012 on 18 August.** A scanner
    is one screen the device sits on all day, and an outcome is a state of it — **routing to `/access/admitted`
    for something gone in 1.5 seconds is a page load per guest**, and at a gate doing 40 a minute that
    is the whole problem. Every absorbed screen kept its copy as a named state. **Authoring operations
    removed 24 August**: addBlacklistEntry, removeBlacklistEntry. **A scanner reads the gate configuration;
    it does not write it.** An access point is created in the back office and a geofence is a venue decision
    — a handheld at a lane that can redefine the lane is a handheld that can admit anywhere.'
  density: comfortable
  pattern: listDetail
  patternReason: '`listScans` reads the population and `getOfflinePackage` reads one of them — list, select,
    act'
  purpose: The screen the device sits on all day.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Access point id
        operation: listScans
        notes: Sends `?accessPointId=` to `listScans`.
        provenance: contract access.yaml GET /access/scans
      - kind: textField
        label: Ticket id
        operation: listScans
        notes: Sends `?ticketId=` to `listScans`.
        provenance: contract access.yaml GET /access/scans
      - kind: textField
        label: Outcome
        operation: listScans
        notes: Sends `?outcome=` to `listScans`.
        provenance: contract access.yaml GET /access/scans
      - kind: datePicker
        label: Recorded from
        operation: listScans
        notes: Sends `?recordedFrom=` to `listScans`.
        provenance: contract access.yaml GET /access/scans
      - kind: datePicker
        label: Recorded to
        operation: listScans
        notes: Sends `?recordedTo=` to `listScans`.
        provenance: contract access.yaml GET /access/scans
      - kind: dataTable
        label: Every scan event
        bindsTo: ScanEvent
        columns:
        - ScanEvent.id
        - ScanEvent.accessPointId
        - ScanEvent.venueId
        - ScanEvent.scopePath
        - ScanEvent.ticketId
        - ScanEvent.mediaCode
        - ScanEvent.outcome
        - ScanEvent.denyReason
        - ScanEvent.direction
        - ScanEvent.operatorPrincipalId
        - ScanEvent.deviceId
        - ScanEvent.overriddenByPrincipalId
        operation: listScans
        provenance: contract access.yaml GET /access/scans
      - kind: dataTable
        label: Every blacklist entry
        bindsTo: BlacklistEntry
        columns:
        - BlacklistEntry.mediaCode
        - BlacklistEntry.reason
        - BlacklistEntry.addedAt
        - BlacklistEntry.addedByPrincipalId
        - BlacklistEntry.expiresAt
        - BlacklistEntry.scopePath
        operation: listBlacklist
        provenance: contract access.yaml GET /blacklist
      - kind: scanTarget
        derived: true
        impliedBy: listScans
        notes: '**A screen that validates a credential needs somewhere to point the camera.** `denied`
          and `hardwareError` look different because an operator facing a guest needs to know whether
          to try again or explain something.'
        provenance: carried from the previous definition
      - kind: searchField
        derived: true
        impliedBy: lookupTicket
        label: Search
        notes: A search that returns nothing must say so differently from a search not yet run.
        provenance: carried from the previous definition
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The selected scan event
        bindsTo: ScanEvent
        columns:
        - ScanEvent.id
        - ScanEvent.accessPointId
        - ScanEvent.venueId
        - ScanEvent.scopePath
        - ScanEvent.ticketId
        - ScanEvent.mediaCode
        - ScanEvent.outcome
        - ScanEvent.denyReason
        - ScanEvent.direction
        - ScanEvent.operatorPrincipalId
        - ScanEvent.deviceId
        - ScanEvent.overriddenByPrincipalId
        - ScanEvent.overrideReason
        - ScanEvent.recordedAt
        - ScanEvent.syncedAt
        operation: listScans
        provenance: contract access.yaml GET /access/scans
      - kind: detailPanel
        label: The offline package
        bindsTo: OfflinePackage
        columns:
        - OfflinePackage.generatedAt
        - OfflinePackage.validFrom
        - OfflinePackage.validTo
        - OfflinePackage.accessPointId
        - OfflinePackage.entitlements
        - OfflinePackage.delegatedRights
        - OfflinePackage.blacklist
        - OfflinePackage.admissionRules
        operation: getOfflinePackage
        provenance: contract access.yaml GET /access/offline-package
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Sync scans
        operation: syncScans
        provenance: contract access.yaml POST /access/scans
      - kind: secondaryButton
        label: Lookup ticket
        operation: lookupTicket
        provenance: contract access.yaml GET /access/lookup
      - kind: destructiveButton
        label: Override access
        operation: overrideAccess
        provenance: contract access.yaml POST /access/override
      - kind: secondaryButton
        label: Validate access
        operation: validateAccess
        provenance: contract access.yaml POST /access/validate
      - kind: secondaryButton
        label: Validate group access
        operation: validateGroupAccess
        provenance: contract access.yaml POST /access/group-validate
      - kind: secondaryButton
        label: Consume cross region entitlement
        operation: consumeCrossRegionEntitlement
        provenance: contract cross-region.yaml POST /cross-region-entitlements/{rightId}/consume
  overlays:
  - id: confirmOverrideAccess
    component: confirmDialog
    trigger: Override access
    body: '**Names what `overrideAccess` changes and what it leaves alone**, in the consequence rather
      than the verb. A ready scan this affects should be identified in the dialog, not just counted. **Collects
      what `overrideAccess` sends before it is called.** Required: `id`, `scanId`, `reason`, `recordedAt`.'
    provenance: contract access.yaml POST /access/override
  - id: formSyncScans
    component: modal
    trigger: Sync scans
    body: '**Collects what `syncScans` sends before it is called.** Required: `deviceId`, `scans`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Sync scans
      operation: syncScans
    dismiss:
      label: Cancel
      discards:
      - deviceId
      - scans
    provenance: contract access.yaml POST /access/scans
  - id: formValidateAccess
    component: modal
    trigger: Validate access
    body: '**Collects what `validateAccess` sends before it is called.** Required: `id`, `mediaCode`,
      `mediaKind`, `direction`, `recordedAt`. Optional: `groupSize`, `proximityToken`. Dismissing sends
      nothing; the screen behind is unchanged.'
    bindsTo: ValidateRequest
    confirm:
      label: Validate access
      operation: validateAccess
    dismiss:
      label: Cancel
      discards:
      - id
      - mediaCode
      - mediaKind
      - direction
      - recordedAt
      - groupSize
      - proximityToken
    provenance: contract access.yaml POST /access/validate
  - id: formValidateGroupAccess
    component: modal
    trigger: Validate group access
    body: '**Collects what `validateGroupAccess` sends before it is called.** Required: `id`, `mediaCode`,
      `admitCount`, `recordedAt`. Optional: `direction`. Dismissing sends nothing; the screen behind is
