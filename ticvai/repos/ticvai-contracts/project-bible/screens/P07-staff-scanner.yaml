    error: Could not load. Names which read failed and leaves the ready scan untouched.
    emptyFirstRun: No ready scan yet. **Offers no create action** — this screen declares no operation
      that makes one — and says so rather than showing an empty table.
    emptyNoResults: Nothing matches the filter on accessPointId, ticketId, outcome, recordedFrom, recordedTo
      and the ready scan are still there. Names the active filter and offers to clear it.
    emptyNoAccess: Shown when the caller lacks `REPORT_VIEW_VENUE`, which `listScans` requires, and names
      that permission. **Never an empty table** — that reads as *there is no data* and sends somebody
      to support with the wrong question.
    offline: '**Same loop, different truth. Amber says so.** Was a separate screen until 18 August, and
      the screen already had an `offline` state — two places describing one condition is two places to
      disagree.'
    admitted: '**Green, and gone in 1.5 seconds.** The absorbed SCN-004. Shows what was admitted and against
      which right; at a gate doing 40 a minute this is the state the device is in most of the time.'
    denied: Denied with the reason and the time of the previous scan. **The reason matters more than the
      refusal** — a steward has to explain it to somebody standing in front of them. The absorbed SCN-005.
    overrideRequired: A supervisor override, which requires a permission a steward may not hold, and records
      who, why and when. The absorbed SCN-006.
