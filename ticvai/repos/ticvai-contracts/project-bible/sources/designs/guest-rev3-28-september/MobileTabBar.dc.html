<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:0 0 auto; background:var(--nav, #ffffff); border-top:1px solid var(--line, #e6e1f5); padding:8px 8px 18px; display:grid; grid-template-columns:repeat(5, 1fr); gap:2px">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <button onClick="{{ it.tap }}" aria-label="{{ it.label }}" style="--cf:{{ it.fg }}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; min-height:48px; padding:0; background:transparent; border:0; cursor:pointer; color:var(--cf, #6b6684); font-family:inherit">
      <span style="position:relative; display:grid; place-items:center">
        <sc-if value="{{ it.live }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute; top:-3px; right:-7px; width:7px; height:7px; border-radius:999px; background:var(--accent, #1a92d8); box-shadow:0 0 0 2px var(--nav, #fff)"></span>
        </sc-if>
        <sc-if value="{{ it.isScan }}" hint-placeholder-val="{{ false }}">
          <span style="width:46px; height:46px; margin-top:-16px; border-radius:16px; background:var(--brand, #6a3fd4); box-shadow:0 10px 22px rgba(58,28,130,.32); display:grid; place-items:center; color:var(--onBrand, #fff)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3M3 12h18"></path>
            </svg>
          </span>
        </sc-if>
        <sc-if value="{{ it.isHome }}" hint-placeholder-val="{{ false }}">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ it.isTickets }}" hint-placeholder-val="{{ false }}">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"></path>
            <path d="M14 6v12" stroke-dasharray="2 3"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ it.isVenue }}" hint-placeholder-val="{{ false }}">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"></path>
            <circle cx="12" cy="10" r="2.6"></circle>
          </svg>
        </sc-if>
        <sc-if value="{{ it.isAccount }}" hint-placeholder-val="{{ false }}">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8.5" r="3.6"></circle>
            <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"></path>
          </svg>
        </sc-if>
      </span>
      <span style="font-size:10px; font-weight:600; letter-spacing:.01em; white-space:nowrap">{{ it.label }}</span>
    </button>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tickets&quot;,&quot;scan&quot;,&quot;venue&quot;,&quot;account&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;atVenue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const active = p.active || 'home';
    const pick = typeof p.onPick === 'function' ? p.onPick : () => { };
    const defs = [
      { key: 'home', label: 'Discover', isHome: true },
      { key: 'tickets', label: 'Tickets', isTickets: true },
      { key: 'scan', label: 'Scan', isScan: true },
      { key: 'venue', label: p.atVenue === true ? 'At venue' : 'Venues', isVenue: true },
      { key: 'account', label: 'Account', isAccount: true }
    ];
    return {
      items: defs.map(d => ({
        key: d.key, label: d.label,
        isHome: !!d.isHome, isTickets: !!d.isTickets, isScan: !!d.isScan,
        isVenue: !!d.isVenue, isAccount: !!d.isAccount,
        live: d.key === 'venue' && p.atVenue === true && active !== 'venue',
        fg: d.key === 'scan'
          ? 'var(--ink3, #6b6684)'
          : (active === d.key ? 'var(--brand, #6a3fd4)' : 'var(--ink3, #6b6684)'),
        tap: () => pick(d.key)
      }))
    };
  }
}

</script>
</body>
</html>
