# order.paid v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: order.paid
version: 1
publisher: orders
description: An order has been paid in full. The moment revenue is recognisable and entitlements may
  be issued.
aggregate: order
emittedWhen: OrderStatus pending or partiallyPaid to paid
emittedBy:
- orders.createPayment
- orders.capturePayment
- orders.syncOrders
- payments.receivePaymentProviderWebhook
# A pending payment resolved by inquiry captures the order as the webhook would (states/payment.yaml:
# pendingConfirmation -> captured by inquirePaymentStatus; CHG-R1S-009, found by check-write-lineage W-EMITS).
- orders.inquirePaymentStatus
payload:
- field: orderId
  type: uuid
- field: venueId
  type: uuid
- field: subjectId
  type: uuid
  notes: Null for an anonymous counter sale
- field: channel
  type: string
  notes: pos, kiosk, guestApp, guestWeb, callCentre, partner, api, backOffice
- field: total
  type: Money
- field: lines
  type: array
  notes: variantId, quantity, lineTotal
- field: paidAt
  type: timestamp
- field: sequence
  type: integer
  notes: Monotonic per order. Ordering is guaranteed within one order, never across orders
consumers:
- context: access
  purpose: Issue entitlements against the paid lines. AccessService owns access.entitlement, so it issues
    (system-design review SD-026, 29 September; was catalogue)
  operation: access.issueOrderEntitlements
  idempotencyKey: orderId + lineId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: ledger
  purpose: Post revenue and tax, once, against the clearing account the payment's cash-receipt entry
    credited. The payment path posts the cash receipt only (SD-026)
  operation: finance.postOrderRevenue
  idempotencyKey: orderId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: inventory
  purpose: Deplete stock for physical lines
  idempotencyKey: orderId + lineId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: marketing
  purpose: Record purchase behaviour and award loyalty
  idempotencyKey: orderId
  onFailure: retry
  isCritical: false
- context: reporting
  purpose: Update the sales read model
  idempotencyKey: orderId
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Recommendation attribution through the order lines' recommendationId, risk velocity and
    entity risk on the guest, device and channel, and forecasting actuals (AI system design section
    3.2)
  idempotencyKey: orderId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**The most consumed event in the platform.** Six consumers, three of them critical. A dead-lettered
  order.paid means a guest paid and holds nothing, so it pages rather than logs.


  **The saga** (system-design review SD-026, 29 September): the payment transaction converts the inventory
  holds (catalogue.convertInventoryHold), posts the cash receipt and writes this event; AccessService issues the
  tickets from it and publishes entitlement.issued; the orders consumer of entitlement.issued completes the
  order. A dead-lettered issuance is replayed, never compensated by an automatic refund.'
