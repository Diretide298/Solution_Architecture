# order.lapsed v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: order.lapsed
version: 1
publisher: orders
description: An order ended without being paid and without anybody voiding it — its payment was declined and not
  retried, its payment window passed, or a parked sale's hold expired.
aggregate: order
emittedWhen: OrderStatus pending to failed (createPayment, declined and not retried), pending to voided (the payment
  window passed; timer, CHG-GDL-003), or held to voided (the hold expired; timer)
emittedBy:
- orders.createPayment
payload:
- field: orderId
  type: uuid
- field: venueId
  type: uuid
- field: subjectId
  type: uuid
  required: false
  notes: Null for an anonymous counter sale
- field: fromStatus
  type: string
  notes: pending or held
- field: toStatus
  type: string
  notes: failed or voided
- field: at
  type: timestamp
consumers:
- context: identity
  purpose: Mark the order's row in identity.subject_holding failed or voided, so the order stops blocking
    deleteGuestAccount (open = pending, held, partiallyPaid, paid; orders#openOrdersForSubject). Without it an order
    whose payment was declined, or a checkout the guest abandoned, would block the guest's erasure for ever (ADAM CR-084,
    CHG-GDL-001, CHG-GDL-003)
  writes:
  - identity.subject_holding
  idempotencyKey: orderId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: '**Added 14 October 2026 (ADAM CR-084, CHG-GDL-001).** Identity keeps a projection of what each guest holds
  (identity.subject_holding) from the order and entitlement events, because Identity is Foundation and reads nothing
  above it (ADR-0028). Two ways out of an open order had no event: pending -> failed (createPayment, declined and not
  retried) and held -> voided (the hold timer). Every other way out already publishes one (order.completed,
  order.cancelled, order.refunded). CHG-GDL-003 added the third: pending -> voided when the payment window passes
  (states/order.yaml), so an abandoned checkout lapses too.


  **Not order.cancelled.** That event is a void somebody made, and the AI reads it as leakage against the cashier
  (events/order-cancelled.yaml: held -> voided by the timer deliberately does not emit it). A lapse is nobody''s act.
  The timer transitions are run by the orders hold-expiry job, which writes the outbox row in the same transaction as
  the status (ADR-0033).'
