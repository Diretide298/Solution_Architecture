# tenantDomain.mapped v2 — published by tenancy
# v2 (20 October 2026, r8 cause APPROVALS-TENANCY-C11): the payload is the domain row itself, so the control
# plane's consumer writes it whole; a refused hostname answers with tenantDomain.rejected.
# Versioning (r8 integration, CHG-R8INT-004; events/_schema.yaml): v2 is a major version (change, target,
# scopePath and at left the payload; the idempotency key is the eventId). Only version 2 is emitted: the one
# consumer (platform-ops) is built to v2 at r8 with its producer, so no v1 envelope is written (ADAM CR-205,
# option A, decided 25 October 2026; CHG-R10TEN-004).
# Checked by tools/check-states.py against states/ and the contracts.

name: tenantDomain.mapped
version: 2
publisher: tenancy
description: A hostname was routed to a tenant, re-routed, or detached.
aggregate: tenantDomain
emittedWhen: setTenantDomainMapping succeeds
emittedBy:
- setTenantDomainMapping
payload:
- field: id
  type: uuid
  notes: The domain's id, the event's aggregateId
- field: hostname
  type: string
- field: tenantId
  type: uuid
- field: kind
  type: string
  notes: platformSubdomain or customDomain, as TenantDomain.kind (ADAM CR-205)
- field: status
  type: string
  notes: The domain's status after the change, as TenantDomain.status, active or detached; a mapping that is removed
    is detached (ADAM CR-205)
- field: cellId
  type: uuid
- field: databaseName
  type: string
- field: channel
  type: string
  notes: The storefront or app the hostname serves
- field: isPrimary
  type: boolean
- field: redirectToHostname
  type: string
  required: false
- field: verifiedAt
  type: timestamp
  required: false
- field: lastValidatedAt
  type: timestamp
  required: false
consumers:
- context: platform-ops
  purpose: 'Write the hostname''s row on control.tenant_domain in the control database, which PlatformService owns
    (ADR-0039), so the edge can resolve the host to the tenant before any tenant database is chosen. v2: it writes
    the row whole, demotes the channel''s other primary when this one is primary, promotes the platform subdomain
    when a primary custom domain detaches, and decides hostnameHeldByAnotherTenant here (the final check under the
    partial unique index on active hostnames); a hostname another tenant holds is not written and
    tenantDomain.rejected is published instead'
  writes:
  - control.tenant_domain
  idempotencyKey: eventId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Added 12 October 2026 (ADAM CR-002, CHG-R6-020).** setTenantDomainMapping runs in TenancyService, in
  `commerce`, against the tenant database; control.tenant_domain is in the control database, owned by
  PlatformService in `operations`. The commerce role has no grant there, so the mapping reaches its owner as this
  event (ADR-0055 rule 4, ADR-0057).


  No state model emits this: a domain mapping has no status model.'
