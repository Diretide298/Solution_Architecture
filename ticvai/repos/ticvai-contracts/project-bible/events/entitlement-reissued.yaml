# entitlement.reissued v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: entitlement.reissued
version: 1
publisher: orders
description: An expired entitlement was reissued at zero value for a later date. The old one is superseded
  (cancellationKind superseded) and a new one is valid for the new date.
aggregate: entitlement
emittedWhen: reissueEntitlement succeeds
emittedBy:
- reissueEntitlement
payload:
- field: entitlementId
  type: uuid
  notes: The entitlement that is superseded
- field: newEntitlementId
  type: uuid
  notes: UUIDv7, allocated by OrderService, so a redelivery issues the same entitlement once
- field: orderId
  type: uuid
- field: performanceId
  type: uuid
  required: false
  notes: The later date, where the product is dated
- field: validFrom
  type: timestamp
- field: validTo
  type: timestamp
- field: reason
  type: string
  required: false
- field: scopePath
  type: string
- field: tenantId
  type: uuid
- field: at
  type: timestamp
consumers:
- context: access
  purpose: Supersede the old entitlement and issue the new one on access.entitlement, which Access owns, with its
    credential, and refresh the offline validation bundle
  writes:
  - access.entitlement
  idempotencyKey: newEntitlementId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: '**Added 12 October 2026 (ADAM CR-002, CHG-R6-020).** reissueEntitlement runs in OrderService, in
  `commerce`; access.entitlement is AccessService''s, in `access`. The DB-ROLES grants refuse the direct write, so
  the reissue reaches the owner as this event (ADR-0055 rule 4, ADR-0057).


  No state model emits this: the supersession is the `reissuedSuperseded` label of `cancelled`
  (states/entitlement-status.yaml pack_status_map), not a transition of its own.'
