# ledger.journalPosted v1 — published by ledger
# Checked by tools/check-states.py against states/ and the contracts.

name: ledger.journalPosted
version: 1
publisher: ledger
description: A journal entry has been posted and is now immutable.
aggregate: journalEntry
emittedWhen: JournalStatus draft or pendingApproval to posted
emittedBy:
- approveJournalEntry
payload:
- field: journalEntryId
  type: uuid
- field: legalEntityId
  type: uuid
- field: fiscalPeriodId
  type: uuid
- field: source
  type: string
  notes: sale, refund, shift, settlement, revaluation, manual
- field: sourceId
  type: uuid
- field: lineCount
  type: integer
- field: totalDebit
  type: Money
- field: totalCredit
  type: Money
  notes: Equal to totalDebit. A posted entry that does not balance was never posted
- field: postedAt
  type: timestamp
consumers:
- context: public-api
  purpose: Deliver to webhook subscriptions taking ledger.journalPosted, so a partner's finance system can follow
    posted journals (the lead, 2 November 2026, CHG-R13INT-010)
  idempotencyKey: journalEntryId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: Kept as a webhook (the lead, 2 November 2026, on lane s's question; CHG-R13INT-010). Its reporting consumer
  (Update the financial read model) was dropped with the other reporting read-model consumers (CHG-R13JOB-002);
  reporting reads the analytical replica (ADR-0016).
