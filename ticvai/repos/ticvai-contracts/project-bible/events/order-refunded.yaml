# order.refunded v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: order.refunded
version: 1
publisher: orders
description: Value has been returned to a guest, in whole or in part.
aggregate: order
emittedWhen: OrderStatus paid or completed to refunded or partiallyRefunded
emittedBy:
- createRefund
payload:
- field: orderId
  type: uuid
- field: refundId
  type: uuid
- field: venueId
  type: uuid
- field: amount
  type: Money
- field: isPartial
  type: boolean
- field: lineIds
  type: array
  notes: Which lines. Absent for an order-level refund
- field: reason
  type: string
- field: approvedByPrincipalId
  type: uuid
  notes: Null below the venue threshold
- field: refundedAt
  type: timestamp
consumers:
- context: catalogue
  purpose: Cancel or reduce the entitlements issued
  idempotencyKey: refundId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: ledger
  purpose: Post the reversal
  idempotencyKey: refundId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: inventory
  purpose: Return stock where goods came back
  idempotencyKey: refundId + lineId
  onFailure: retry
  isCritical: false
- context: marketing
  purpose: Adjust loyalty and lifetime value
  idempotencyKey: refundId
  onFailure: retry
  isCritical: false
- context: seating
  purpose: Return seats to sale
  idempotencyKey: refundId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: ai
  purpose: Reverse the recommendation attribution the refunded lines earned, refund-abuse velocity and
    entity risk, and net the forecasting actuals (AI system design section 3.2)
  idempotencyKey: refundId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: A refund that reaches the ledger and not the entitlement leaves a guest holding a valid ticket
  for something they were paid back for.
