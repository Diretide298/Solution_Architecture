# order.completed v1 — published by orders
# Checked by tools/check-states.py against states/ and the contracts.

name: order.completed
version: 1
publisher: orders
description: Everything an order promised has been delivered.
aggregate: order
emittedWhen: OrderStatus paid to completed
payload:
- field: orderId
  type: string
- field: venueId
  type: uuid
- field: completedAt
  type: timestamp
- field: entitlementIds
  type: array
  notes: What was issued
- field: lines
  type: array
  required: false
  notes: 'Added 29 September (build, AI system design 2.2 A step 8), optional so older consumers are
    unaffected: per order line `lineId`, `variantId`, `quantity`, `grossAmount` and `recommendationId`
    (the ai `decideRecommendations` trackingId the line came from, carried from the cart line; null when
    none)'
consumers:
- context: marketing
  purpose: Close the purchase journey and trigger post-visit campaigns
  idempotencyKey: orderId
  onFailure: retry
  isCritical: false
- context: reporting
  purpose: Fulfilment metrics
  idempotencyKey: orderId
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Recommendation attribution through the order lines' recommendationId, and forecasting actuals
    for delivered demand (AI system design section 3.2)
  idempotencyKey: orderId
  onFailure: retryThenDeadLetter
  isCritical: false
retention: 30 days after publication
notes: 'Distinct from order.paid. Paid is money; completed is delivery, and the gap between them is
  where fulfilment failures live.


  **Deliberately non-critical.** A lost post-visit campaign is a missed opportunity, not a failure a
  guest experiences.'
