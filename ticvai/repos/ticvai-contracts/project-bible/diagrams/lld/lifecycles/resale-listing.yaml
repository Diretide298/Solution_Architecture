transitions:
- from: pendingReview
  to: listed
  operation: approveListingModeration
  trigger: operation
  guard: '**Approved by a moderator.** A listing starts in `pendingReview` only when the venue''s `ResaleMarketplaceConfig.moderationMode`
    is `manual`, or `riskBased` and one of its `reviewTriggers` fired; otherwise it is created `listed`
    (DM5, 29 September). `requestInformation` leaves it here'
- from: pendingReview
  to: rejected
  operation: approveListingModeration
  trigger: operation
  guard: Rejected, with the reason recorded on the listing (`moderationReason`)
- from: pendingReview
  to: withdrawn
  operation: createResaleListing
  trigger: operation
  guard: The seller withdrew it before review finished
- from: pendingReview
  to: expired
  trigger: timer
  guard: Never reviewed before the performance started
- from: listed
  to: reserved
  operation: createResaleListing
  trigger: operation
  guard: A buyer is in checkout. **Held, because two buyers on one seat is the failure this prevents**
- from: reserved
  to: sold
  operation: createResaleListing
  trigger: operation
  guard: '**The buyer becomes the owner of the same entitlement; its media is re-issued and the transfer
    is logged** (MoM 1 Sep 4.14: the virtual ticket ID is preserved) — the media that admits is always
    one the venue issued'
  emits:
  - entitlement.transferred
- from: reserved
  to: listed
  operation: createResaleListing
  trigger: operation
  guard: Checkout abandoned. Back on the market
  isReversal: true
- from: listed
  to: withdrawn
  operation: createResaleListing
  trigger: operation
  guard: The seller changed their mind
- from: listed
  to: expired
  trigger: timer
  guard: The performance started. **A listing outliving its event is a listing that sells nothing**
notes: '**The seller is paid after the buyer is admitted, not after they pay** — a resale refunded at
  the gate for superseded media cannot be clawed back from a seller who already has the money.


  **`reserved` is what stops two buyers on one seat**, and it is the only reason this is a state machine
  rather than a flag.'
