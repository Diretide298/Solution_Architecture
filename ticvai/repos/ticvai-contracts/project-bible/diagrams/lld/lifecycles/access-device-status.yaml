notes: '**No terminal state, by design** (`terminal: []`): health is a reading, not a lifecycle, and
  any reading can follow any other. `status` is null until the first report, so every value is a possible
  first state. A decommissioned device is recorded by `lifecycleStatus` and `isActive`, not here.'
