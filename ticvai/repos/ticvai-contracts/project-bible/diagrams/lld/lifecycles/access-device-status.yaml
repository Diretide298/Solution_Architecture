description: The reported health of one access-control device, such as a turnstile, reader, handheld,
  podium unit or BLE beacon (declared 29 September, writers pass). **Health as reported by the device
  or vendor; TICVAI does not detect it.** Every move is the heartbeat ingest job recording the latest
  report, so no operation appears here. Provisioning (`provisioningStage`) and whether the device is
  configured on (`isActive`) are separate fields and are not modelled here.
