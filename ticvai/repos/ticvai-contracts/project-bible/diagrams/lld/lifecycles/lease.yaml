id: LLD-Inventory lease
title: Inventory lease — 4 transitions
generatedBy: tools/derive-diagrams.py
index: diagrams/hld/04-lifecycles.yaml
source: states/lease.yaml
entity: Inventory lease
contract: catalogue
enum: LeaseStatus
enumKind: named
enumSchema: LeaseStatus
owner: catalogue
initial:
- active
terminal:
- expired
- released
- forceReleased
- converted
transitions:
- from: active
  to: released
  operation: relinquishInventoryHold
  trigger: operation
  guard: Terminal returned what it did not sell
- from: active
  to: expired
  trigger: timer
  guard: TTL passed without renewal. **The capacity returns automatically** — a terminal that dies holding
    a lease must not strand its allocation
- from: active
  to: forceReleased
  operation: forceReleaseInventoryHold
  trigger: operation
  guard: A supervisor reclaimed it from an unreachable terminal. Recorded separately because it may
    double-sell what the terminal already sold offline
  requiresApproval: true
- from: active
  to: converted
  operation: convertInventoryHold
  trigger: operation
  guard: The order was paid. **The held units become sold** and never return to availability; a hold
    that merely expired after payment would have oversold (system-design review SD-023, 30 September)
notes: '`forceReleased` is deliberately distinct from `released`. One is a terminal reporting; the other
  is a human overriding a terminal that cannot report, and the reconciliation afterwards is different.'
offlineReachable:
- active
