notes: '**The application is not the partner** (decided 29 September, writers pass). `PartnerAccountStatus`
  (states/partner.yaml) says whether the company may trade; this says where its request to trade stands.
  `registerPartner` creates both, the partner `applicant` and the application `submitted`; `stage` says
  which departmental review it is in and is not a state.



  **`approved` ends the application.** What follows (agreement, rates, credit, access) is the partner''s
  `configuration` state, not more application. A refused or withdrawn application is never reopened:
  a company that applies again is a new application against the same partner record.


  **Writers (decided 29 September, writers pass; DM4).** registerPartner creates the row; actOnPartnerApplicationReview
  moves it through review; the approval is decided in approvals (decideApprovalRequest), whose outcome
  writes the application and the partner.'
