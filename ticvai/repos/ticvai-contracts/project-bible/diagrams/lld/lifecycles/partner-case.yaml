notes: '**A partner case is not a guest case** (decided 29 September, writers pass). `marketing.case`
  has a guest lifecycle; this one runs between TICVAI and a company it trades with, and a case about
  money (`commissionDispute`, `settlementDispute`, `invoiceDispute`) holds the commission line, batch
  or reconciliation exception it concerns `disputed` until it is resolved.



  **`resolved` is not `closed`.** A resolution can still be found not to have happened; `closed` is
  final and a case that comes back after it is a new case. createPartnerCase opens a case and actOnPartnerCase
  works it (decided 29 September, writers pass; DM4); `listPartnerDisputeCase` only reads.'
