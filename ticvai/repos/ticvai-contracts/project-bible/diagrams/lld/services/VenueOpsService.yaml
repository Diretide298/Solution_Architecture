  kind: cache
  columns: 4
  backing: redis
  owned: false
  why: '**Not a table and not owned by a service.** Derived from something already read, losable without
    consequence — no migration, no backup, no owner.'
  key: scope_path + what is being resolved — permissions, configuration, a price list
  eviction:
  - 'version: Bumped by the write that evicts it. **A config change nobody evicts is a stale permission**'
  writtenBy:
  - getVenueMapGraph
  - publishVenueMap
  - setPathClosure
  readBy:
  - getVenueMapGraph
  gap: '**The lineage names this store, not the key.** Which resolution entry each writer below evicts
    or bumps — permissions, configuration, a price list, and whether child scopes under its `scope_path`
    are affected — is not recorded for any operation, so a writer here cannot yet be implemented from
    the package alone.'
