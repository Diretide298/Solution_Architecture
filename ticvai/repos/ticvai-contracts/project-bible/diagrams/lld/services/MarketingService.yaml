why: '**275 operations and 132 tables — the biggest thing in the package, and probably two services
  eventually.** CRM and campaigns have different write patterns: a guest profile is read constantly
  and written rarely; a campaign send is a burst of millions of rows nobody reads again.


  **Kept as one for now** because splitting a service before it has a load profile is guessing.'
scale: Bursty on send, read-heavy otherwise. **The one to watch for a split.**
ifDown: Down stops campaigns and guest lookup. Neither stops trading.
