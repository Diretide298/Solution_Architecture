external:
- system: Payment gateway
  via:
  - OrderService
  - PlatformService
  reachedThrough: orders.payment
  note: '**Tenant as merchant of record for phase 1**; PayFac deferred. The highest-consequence unresolved
    payment assumption.'
- system: UAE Pass and tenant SSO
  via: IdentityService
  note: A guest arrives verified in a way an email never is.
- system: Messaging — SMS, WhatsApp, push, email
  via:
  - FnbService
  - IdentityService
  - MarketingService
  - OrderService
  - PlatformService
  - TenancyService
  reachedThrough: marketing.message_dispatch
  note: '**One dispatch table, six services.** A payment link from Order, a booking confirmation from
    Order, an OTP from Identity, a rota change from Tenancy, an allergen alert from F&B, a campaign
    from Marketing — **every one is somebody sending a message that was asked for.**


    **A ticket purchase reaches messaging twice**: the payment link before tender and the confirmation
    after. Neither goes through Marketing.'
- system: Queue systems
  via: VenueOpsService
  note: '**Adaptor-first** (ADR-0012). The platform holds what the venue''s own queue system reports.'
- system: AI providers
  via:
  - AiService
  - ReportingService
  reachedThrough: ai.activity
  note: 'BYOK, budgeted and metered. **Read-only against the transactional core** (ADR-0020).


    **Reporting reaches it too** — the governed pair. A natural-language query *is* an AI interaction,
    which is why `reporting` may write `ai.activity` and nothing else outside AiService may.'
- system: Webhooks out
  via:
  - PlatformService
  reachedThrough: control.webhook_subscription
  note: Third parties subscribe; replay is available.
regions:
  model: one cell per jurisdiction
  note: '**A cell is a deployment and a legal boundary at once** (ADR-0001). UAE data residency is required
    and DESC review shapes it.


    **Only CrossRegionService reaches another region**, and it moves a pseudonymous guest link rather
    than a guest (ADR-0010) — which is what makes a membership work in another country without moving
    anybody''s personal data.'
  unresolved: CF-64 — the cloud provider is undecided, and every concrete infrastructure artefact depends
    on it
