  operations: 2068
  contracts: 32
  tables: 629
  tablesNote: '**Postgres tables only.** `status.json` reports 379 because it counts five non-table
    stores. **They own no service and should not**: a cache entry is derived from something already
    read, invalidated by an event already consumed, and losable without consequence. **Both numbers
    are right and they count different things**, which is worth saying rather than letting a reader
    find the difference.'
