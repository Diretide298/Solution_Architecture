  owner: approvals
  service: TenancyService
  states: null
  transitions: 17
  initial:
  - draft
  terminal:
  - retired
  operations:
  - approveVersioningGovernance
  - setVisualWorkflow
  - simulateWorkflowTestingImpact
  guarded: 17
  ref: diagrams/lld/lifecycles/workflow-version.yaml
events:
- event: access-rejected
  description: Media was presented at an access point and refused, with the reason the gate gave.
- event: access-validated
  description: An entitlement was presented and admitted.
- event: accreditation-applicationDecided
  description: An accreditation application was approved, rejected, returned for information or escalated.
- event: accreditation-credentialIssued
  description: A badge, QR, mobile, NFC, RFID or wristband credential was issued to an accredited person,
    new or as a replacement.
- event: accreditation-holderStatusChanged
  description: An accredited person was suspended, reactivated, revoked, expired, archived or had their
    validity extended by a renewal.
- event: accreditation-renewalDue
  description: An accredited person's renewal window opened — their accreditation expires within the
    programme's renewalWindowDays.
- event: ai-capabilityPaused
  description: An AI capability was paused and now answers from its degradation mode.
- event: ai-ceilingApproaching
  description: AI spend has reached the configured warning threshold for a scope.
- event: ai-forecastPublished
  description: A forecast version was published and is now the one every consumer reads.
- event: ai-incidentOpened
  description: An AI governance incident was opened.
- event: ai-insightRaised
  description: An insight (an anomaly, a forecast deviation, a trend or an opportunity) was raised.
- event: ai-operationalRequirementIssued
  description: An operational requirement derived from a forecast was accepted and handed to the module
    that applies it.
- event: ai-planExecuted
  description: An approved action plan finished executing through the owning modules.
- event: ai-planFailed
  description: An action plan failed and was compensated or paused for a person.
- event: ai-riskAlertRaised
  description: A risk alert was raised on an entity or transaction.
- event: ai-riskCaseClosed
  description: A risk investigation was closed with an outcome.
- event: apiClient-anomalyDetected
  description: An API client's traffic breached an anomaly rule (volume against its own baseline or
    a ceiling, 4xx share, refusals from outside the allow-list, calls outside its usual operations),
    and the breach was recorded as an ApiAnomaly with the action taken.
- event: approval-escalated
  description: An approval request was escalated, by a person or because its SLA was breached.
- event: approval-expired
  description: An approval request stopped waiting because nobody decided it before the rule's expiry.
- event: approval-granted
  description: An approval request was granted at its final level.
- event: approval-rejected
  description: An approval request was refused.
- event: approval-requested
  description: An approval request entered routing and is waiting on its first level.
- event: approval-stepCompleted
  description: One level of a multi-level approval chain was approved and the request moved to the next
    level.
- event: assets-documentIndexed
  description: Text was extracted from an uploaded document and is ready to embed.
- event: cart-abandoned
  description: A cart lapsed without checking out.
- event: catalogue-productPublished
  description: A product is on sale, or has returned to sale.
- event: consent-deviceConsentClaimed
  description: A browser's cookie decision was attached to the guest who signed in or registered on
    it, and the guest's consent became the narrower of the two per category.
- event: consent-deviceConsentRecorded
  description: A visitor nobody has identified yet made a cookie decision on a banner or preference
    centre — accepted, rejected, saved preferences, withdrew or opted out of sale and sharing.
- event: conversation-handedOver
  description: An assistant conversation was passed to a human agent.
- event: device-enrolmentChanged
  description: A device moved through its lifecycle — enrolled, provisioned, activated, deactivated
    or retired.
- event: device-firmwareReleased
  description: A firmware or software release was cleared for the fleet.
- event: device-firmwareRolloutCompleted
  description: A firmware rollout finished — completed, halted on its failure threshold, or rolled back.
- event: device-statusChanged
  description: A registered device's reported status changed — it went offline, came back, reported
    a fault or ran low on a consumable.
- event: device-tamperDetected
  description: A device reported physical or logical interference and is now untrusted until someone
    clears it.
- event: entitlement-expiringSoon
  description: A ticket or pass a guest still holds expires within its template's notice period.
- event: entitlement-issued
  description: A right to admission, a meal, a locker or a rental now exists.
- event: entitlement-statusChanged
  description: An entitlement was frozen, suspended, reinstated or had its validity moved by a renewal.
- event: entitlement-transferred
  description: An entitlement changed holder — a guest's transfer was claimed, or a resale completed.
    The same entitlement, a new owner.
- event: fnb-kitchenTicketCreated
  description: A kitchen ticket exists for a preparation station, from a till sale or a guest order.
- event: fnb-menuPublished
  description: A menu is live at an outlet.
- event: fnb-orderReady
  description: Food is ready to hand over.
- event: identity-credentialResetRequested
  description: Somebody asked for a password or PIN to be reset — a guest asked for a reset code, or
    a supervisor reset a member of staff's credential.
- event: identity-loginRecorded
  description: Somebody tried to sign in — a staff or partner principal, or a guest — and it succeeded,
    failed, or was asked for a second factor.
- event: inventory-purchaseOrderReceived
  description: A purchase order is fully received.
- event: inventoryHold-expired
  description: An active inventory hold passed its expiry and its units went back to remaining.
- event: ledger-journalPosted
  description: A journal entry has been posted and is now immutable.
- event: ledger-periodClosed
  description: A fiscal period is closed. Figures for it will not move again without a reopen.
- event: maintenance-assetReturnedToService
  description: An asset is verified and back in service.
- event: maintenance-templatePublished
  description: An inspection or procedure template is available for use.
- event: maintenance-workOrderCompleted
  description: Work on an asset is finished and awaiting verification.
- event: marketing-caseClosed
  description: A service case was resolved and closed.
- event: order-cancelled
  description: An order was voided before any money was captured — the whole order, with its reason
    and who did it.
- event: order-chargebackRecorded
  description: A chargeback was taken in against a payment, or the provider's final answer on one was
    recorded.
- event: order-completed
  description: Everything an order promised has been delivered.
- event: order-created
  description: An order exists, pending payment, from a checkout, a till or a replayed offline sale.
- event: order-exchanged
  description: Lines on a paid order were exchanged for different products, dates or performances, settling
    only the difference.
- event: order-paid
  description: An order has been paid in full. The moment revenue is recognisable and entitlements may
    be issued.
- event: order-refunded
  description: Value has been returned to a guest, in whole or in part.
- event: payment-attemptFailed
  description: A call to a payment provider was declined or errored. One event per failed attempt, whether
    or not a payment record ever existed.
- event: payment-captured
  description: Money was taken against an order, by a till, the guest web, or a provider webhook confirming
    a 3-D Secure or terminal payment. One event per captured payment, whether or not the order is now
    paid in full.
- event: performance-cancelled
  description: A performance was cancelled and everyone holding a ticket must be made whole.
- event: promotions-recommendationStrategyPublished
  description: What a placement may recommend changed — a recommendation strategy went live or changed
    while live, or the product relationships or suppressions it ranks with were set.
- event: reporting-definitionPublished
  description: A report definition is available to run.
- event: retail-merchandisePublished
  description: Merchandise is on sale.
- event: seat-blocked
  description: A seat was blocked out of general sale (house seats, kills, production holds).
- event: seat-held
  description: A seat was held for a buyer and is not available to anyone else until the hold ends.
- event: seat-released
  description: A held or blocked seat became available again.
- event: seat-sold
  description: A specific seat is no longer available for a performance.
- event: seatMap-published
  description: A seat map version was published and is now the layout sold against.
- event: shift-closed
  description: A till has been counted and closed.
- event: stock-depleted
  description: Stock left a location — sold, wasted, transferred or counted out.
- event: storefront-sessionEvent
  description: A batch of browsing behaviour from one storefront or guest-app session — hashed, counted,
    and with no personal data.
- event: sync-rejectionRaised
  description: An entry replayed by an offline device was refused on its merits and quarantined.
- event: tenant-suspended
  description: A tenant has been suspended, in one of three modes.
- event: wallet-credited
  description: Money reached a wallet's available balance (top-up, refund, adjustment, a released hold).
- event: wallet-debited
  description: Money left a wallet's available balance, held for a spend or captured.
- event: whitelabel-contentPublished
  description: A tenant published content to their guest surfaces — a page, a banner, an FAQ or a policy.
