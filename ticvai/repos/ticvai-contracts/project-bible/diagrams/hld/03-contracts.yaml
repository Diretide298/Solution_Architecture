id: HLD-CONTRACTS
title: 35 contracts — the join between every other layer
generatedBy: tools/derive-diagrams.py
index: diagrams/hld/00-platform.yaml
about: '**The API is the join.** Screens name operations, operations resolve here, and this persists
  to the schemas — every other artefact in the package is drawn by resolving against these rather than
  being written twice.


  **Spine contracts are read by almost everything; satellites read down into them and never the reverse.**
  That direction is the property that makes the service split possible.'
tiers:
  spine: Read by nearly every satellite. A change here reaches the whole platform.
  satellite: A domain with its own schema and its own licence. **Reads down into the spine and is never
    read by it.**
  shared: Vocabularies — permissions, common parameters, problem shapes.
