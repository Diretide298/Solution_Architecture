  /shifts/current/overview:
    get:
      operationId: getWorkstationShift
      x-ticvai-consumed-by:
        - "P04 POS-025 Till Home"
        - "P06 EMP-003 Home — on duty"
      x-ticvai-read-via:
      - query: tenancy#workstationRecords
        route: in-process
        for: 'the session''s workstation (404 no-current-shift) (CHG-MOD-003)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s frozen trading currency and scale (currency_code, currency_scale) for the Money it answers: Shift.countedCash, Shift.expectedCash, Shift.liftsTotal, Shift.openingFloat and 3 more (naming-and-style 5.1, ADR-0018; CHG-R10GEN-002)'
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: primary   # the till home shows the live shift, not a replica's
      summary: Read the open or suspended shift on the session's workstation, without the right to open one
      description: >
        **A read needs a view permission, not the right to open a shift** (CHG-DOOR-005, Chinmay,
