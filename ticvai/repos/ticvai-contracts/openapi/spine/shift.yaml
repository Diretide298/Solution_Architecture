openapi: 3.1.0
info:
  title: TICVAI Shift & Deposit Box
  version: 1.0.0
  x-ticvai-screen-count: 26
  x-ticvai-tier: spine
  x-ticvai-module: "2 — Ticketing Sales (cash handling)"
  x-ticvai-capabilities: [C01]
  x-ticvai-platforms:
    - "P04 POS"
    - "P08 Venue Management"
  description: >
    ## What this contract covers

    **Cash reconciles to a drawer and a person.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 2 — Ticketing Sales (cash handling) |
    | **Capabilities** | C01 |
    | **Consumed by** | P04 POS · P08 Venue Management |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Shift lifecycle and cash handling at a workstation. Capability C01.

    Settled positions this encodes:

    - One user per workstation at a time. A user must log out or SUSPEND their shift before
      another logs in. Suspension is a first-class state, not a workaround — it exists so a
      break can be covered without a blind close-out.
    - Blind close-out: the operator counts without seeing the expected figure.
    - Cash lift: traced mid-shift removal from an open float, leaving the shift open.
    - Supervisor approval is configurable on close AND on open.
    - Over/short beyond a configured threshold requires explicit acceptance.

    Money carries an explicit scale throughout. Denomination counts are integers of a
    named denomination, never a derived total the client computed.

    **Where a workstation-scoped operation finds its workstation** (26 September, pull audit
    R100). The workstation is a scope *target*, never a permission source (ADR-0002,
    permission-resolution R5), so:

    - An operation that names a shift in its path (`/shifts/{shiftId}/…`) targets **that
      shift's workstation**, not the caller's session. A grant held at the venue or a
      department above it covers the workstation beneath it (permission-resolution V16), so a
      supervisor in a browser with no till session acts on the shift by its id.
    - `openShift` targets the `workstationId` in its body.
    - `getCurrentShift` alone reads **the session's workstation**. A session that has none — a
      P08 browser, a partner key, a guest — has no current shift, and gets the `404`.

    **Every listed error names its problem `type`** (RFC 9457, `common.yaml` Problem). Where
    one status covers more than one refusal, each refusal has its own type so the client can
    tell them apart.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: shift
  - name: cash

# **The rule questions Orders answers about shifts** (decided 14 October 2026, Chinmay: "ask the owner by a
# declared query", the ADR-0055 amendment; ADAM CR-083, CHG-TEN-004). Shift belongs to Orders
# (OrderService owns shift.yaml; handoff/service-decomposition.json). A module that refuses on an open shift
# asks one of these and never reads orders.pos_shift itself: in process inside its own transaction from the
# commerce deployable (ADR-0055 rule 2), through Orders' service operation from another deployable (rule 4).
x-ticvai-queries:
  openShiftForWorkstation:
    module: shift
    inputs:
      workstationId: { type: string, format: uuid }
    returns:
      type: object
      nullable: true
      description: The open shift on the workstation, or null when there is none.
      properties:
        shiftId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        principalId: { type: string, format: uuid }
    rule: >
      A shift is open on a workstation while its status is any state before closed or autoClosed in
      states/shift.yaml: pendingApproval, open, suspended, pendingClosure, pendingVariance. closed and
      autoClosed end it (closed is left only by the reversal reopenShift, which makes it open again). At most
      one such shift is returned: openShift refuses a second while one is open or suspended, and of several
      (a new shift beside one still pendingVariance or pendingClosure) the most recently opened is returned.
      The caller that changes the workstation locks its platform.workstation row (SELECT ... FOR UPDATE)
      before it asks, in the same transaction, so no shift opens between the answer and its write.
    served: [in-process]
  openShiftsInScope:
    module: shift
    inputs:
      scopePath: { type: string, description: 'The venue or tenant scope path; shifts at it or beneath it.' }
    returns:
      type: array
      items:
        type: object
        properties:
          shiftId: { type: string, format: uuid }
          workstationId: { type: string, format: uuid }
          principalId: { type: string, format: uuid }
          status: { $ref: '#/components/schemas/ShiftStatus' }
    rule: >
      Every shift at or beneath the scope path that is open by the rule of openShiftForWorkstation
      (pendingApproval, open, suspended, pendingClosure, pendingVariance), one entry per shift.
    served: [in-process, service]
  # Finance's period close asks this for its `noOpenShifts` check (ADAM CR-085, ticket 28411; CHG-FIN-012). Ledger is in
  # `commerce` with Orders, so it asks in process (ADR-0055 rule 2) and never reads orders.pos_shift itself.
  unclosedShiftsInPeriod:
    module: shift
    inputs:
      scopePath: { type: string, description: "The legal entity's scope path (ledger.legal_entity.scope_path); shifts of every venue at it or beneath it." }
      fromDate: { type: string, format: date, description: The period's first day (FiscalPeriod.startDate). }
      toDate: { type: string, format: date, description: The period's last day (FiscalPeriod.endDate). }
    returns:
      type: array
      description: The shifts that stop the period closing; empty when none does.
      items:
        type: object
        properties:
          shiftId: { type: string, format: uuid }
          venueId: { type: string, format: uuid }
          workstationId: { type: string, format: uuid }
          businessDate: { type: string, format: date }
          status: { $ref: '#/components/schemas/ShiftStatus' }
    rule: >
      A shift stops a period closing when its business date (Shift.businessDate: the venue-local date of openedAt
      against the venue's businessDayCutoff, set when it opens and never moved; CHG-R6-032) is on or between fromDate
      and toDate, its venue is at or beneath scopePath, and its status is open, suspended, pendingClosure or
      pendingVariance: still taking money, or counted and waiting for the close to be decided (finance's "open,
      suspended or awaiting close approval"). closed and autoClosed do not stop it. pendingApproval does not either: a
      shift waiting for its opening approval cannot transact (openShift), so it holds no money dated in the period,
      and its only exit is approveShiftOpen, so counting it would let an unanswered request hold the books open.
      One entry per shift, in businessDate then shiftId order.
    served: [in-process, service]
    # Machine-read by tools/check-error-sources.py (E-STUCK): every blocking state can be ended.
    states:
      model: states/shift.yaml
      blocking: [open, suspended, pendingClosure, pendingVariance]
      waitsOnActor:
        pendingVariance: a count beyond the venue's threshold is cash nobody has explained; only a supervisor accepting
          it (acceptShiftVariance) or a recount within the threshold (submitShiftCount) may end it, and a timer that
          closed it would close the books over an unexplained difference
  # **Data reads other modules ask this module for** (MOD audit, 14 October 2026, CHG-MOD-001): one query per
  # table, instead of a raw read of it (check-cross-module-reads XR-UNCOVERED; ADR-0055 rule 2, amended
  # 14 October). Rule questions keep queries of their own, above.
  posShiftRecords:
    module: shift
    table: orders.pos_shift
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The orders.pos_shift rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Orders stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/ShiftVarianceReasonRequest'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Orders answers with its orders.pos_shift rows, as it stores them and as the caller's scope lets
      it see them (the table's row-level security, under the caller's connection and transaction). It decides
      nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and a
      question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Orders implements.
    served: [in-process]

paths:
  /shifts:
    get:
      operationId: listShifts
      x-ticvai-consumed-by:
        - "P04 POS-007 Close Shift"
        - "P04 POS-009 Staff Roster"
        - "P04 POS-016 Till Configuration"
        - "P04 POS-019 Shift Templates & Policies"
        - "P04 POS-025 Till Home"
        - "P06 EMP-008 Shift summary"
        - "P06 EMP-009 End shift"
        - "P08 BO-039 Shift Directory"
        - "P08 BO-040 Variance Approval"
        - "P08 BO-041 Cash Movements"
        - "P08 BO-043 Daily Reconciliation"
        - "P08 BO-053 Staff Directory"
        - "P08 BO-100 Venue Home"
      x-ticvai-read-via:
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s frozen trading currency and scale (currency_code, currency_scale) for the Money it answers: Shift.countedCash, Shift.expectedCash, Shift.liftsTotal, Shift.openingFloat and 3 more (naming-and-style 5.1, ADR-0018; CHG-R10GEN-002)'
      description: >-
        **Order.** Newest first, by `recordedAt` where the device sent one and otherwise by `openedAt`, the
        server's open time: `coalesce(recorded_at, opened_at)` descending, then `id` (`ORDER BY coalesce(recorded_at, opened_at) DESC, id`), and `PageCursor`
        encodes that value and the id (ADAM CR-206, option A; Chinmay, 21 October 2026; CHG-R10ORD-004).
        `recordedAt` is optional on `openShift` and nullable on `orders.pos_shift`, so a shift opened online
        with no device time sorts by when the server opened it, and "newest first" holds for online and
        offline shifts alike.
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: primary   # open-shift state gates workstation actions
      summary: List shifts
      tags: [shift]
      x-ticvai-permission: REPORT_VIEW_WORKSTATION
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: workstationId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ShiftStatus' }
        - name: openedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: openedTo
          in: query
          schema: { type: string, format: date-time }
        - name: businessDate
          in: query
          required: false
          description: The shifts of one business date (`Shift.businessDate`, closing at the venue's
            `businessDayCutoff`; CHG-R6-032), as the daily reconciliation asks for them.
          schema: { type: string, format: date }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Shifts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: openShift
      x-ticvai-consumed-by:
        - "P04 POS-001 Begin Shift"
      x-ticvai-read-via:
      - query: tenancy#deviceRecords
        route: service
        for: 'its read of the registered device, Tenancy''s data, through Tenancy''s service route, the only one the query serves (CHG-MOD-001; R8 lineage request; CHG-R8INT-005)'
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'its read of platform.venue_settings, Tenancy''s data (CHG-MOD-001)'
      - query: tenancy#workstationRecords
        route: in-process
        for: 'its read of platform.workstation, Tenancy''s data (CHG-MOD-001)'
      - query: tenancy#denominationRecords
        route: in-process
        for: 'what its text calls "platform.denomination": platform.denomination, Tenancy''s data (CHG-R10GEN-001)'
      x-ticvai-audience: [staff]
      summary: Open a shift
      description: >
        Fails if another shift is already open on this workstation. Where the venue is
        configured to require approval on open (`TillShiftPolicy.requireOpenApproval`), the shift is
        created in `pendingApproval` and cannot transact until approved.

        **A shift waiting for review never blocks the next one** (decided 2 October 2026, Chinmay,
        batch 3 #1, POS-007, and batch 6 #173, BO-040: "The cashier may sign out, and the shift stays
        pending until the supervisor accepts. That must not stop the next cashier starting a shift";
        DEC-059, DEC-173; CHG-CSP-012; DI-805). Only a shift that is `open` or `suspended` on this
        workstation refuses a new one. A previous shift that is counted and waiting
        (`pendingVariance`, `pendingClosure`) has its own deposit box and its own count, so the next
        cashier opens with a new box and float while it waits; the outgoing cashier's till shows it
        as "Under review", and the supervisor resolves it at any till or in the daily cash
        reconciliation (BO-043).

        **Online only** (F32, 26 September pull audit R257). An opening float declared offline
        is a float nobody can reconcile against the safe; POS-001's own transition and
        `states/shift.yaml` already said so, and this flag said the opposite until 26 September.
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenShiftRequest' }
      responses:
        '201':
          description: Opened, or awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
          headers:
            X-Consistency-Token:
              schema: { type: string }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          x-ticvai-problem-types: [shift-already-open, required-device-absent]
          description: >
            A shift is already open or suspended on this workstation (problem type
            `shift-already-open`), or a required device is absent (`required-device-absent`). A
            shift that is counted and waiting for review is never the cause (CHG-CSP-012).
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venues/{venueId}/till-shift-policy:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTillShiftPolicy
      x-ticvai-consumed-by:
        - "P04 POS-019 Shift Templates & Policies"
        - "P08 BO-065 Venue Configuration"
      x-ticvai-read-via:
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s frozen trading currency and scale (currency_code, currency_scale) for the Money it answers: TillShiftPolicy.openingFloatTolerance (naming-and-style 5.1, ADR-0018; CHG-R10GEN-002)'
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: The rules every till in the venue opens and closes to
      description: >
        **What `setTillShiftPolicy` writes, read back** (CHG-CSP-020); a venue that has saved none reads the
        defaults. Tills read it at sign-in, so the open and close screens know whether to ask for a
        deposit box, a bag number or an approval.
      tags: [shift]
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The venue's till shift policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TillShiftPolicy' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setTillShiftPolicy
      x-ticvai-consumed-by:
        - "P04 POS-019 Shift Templates & Policies"
        - "P08 BO-065 Venue Configuration"
      x-ticvai-read-via:
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s frozen trading currency and scale (currency_code, currency_scale) for the Money it accepts or answers: TillShiftPolicy.openingFloatTolerance (naming-and-style 5.1, ADR-0018; CHG-R10GEN-002)'
      x-ticvai-audience: [staff]
      x-ticvai-config-scope: venue
      summary: Set the rules every till in the venue opens and closes to
      description: >
        **Shift templates and policies, as POS-019 is named** (design-notes correction on POS-019, Block A:
        "nothing reads or writes a shift template or close policy ... either add the shift-policy operations
        or rename the screen"; DI-309: opening and closing rules, exceptions and alerts; CHG-CSP-020). The
        contract has said since August that a shift waits for approval "where the venue is configured to
        require approval on open", that a deposit box or a bag number is required "where the venue configures
        it", and that an abandoned shift is closed "past the venue limit"; none of those had a setting.
        This is it.

        **Venue scope, never per till** (POS-019's own rule: a variance report compares tills against one
        rule set). The variance threshold and the drawer limit stay where they are
        (`tenancy.VenueSettings.shiftVarianceThreshold`, `cashDrawerLimit`); this holds the rest. PUT
        replaces the policy whole; a field left out returns to its default. A change applies to shifts
        opened after it; a shift already open keeps the rules it opened under.
      tags: [shift]
      x-ticvai-permission: WORKSTATION_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TillShiftPolicy' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TillShiftPolicy' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /denominations:
    get:
      operationId: listDenominations
      x-ticvai-consumed-by:
        - "P04 POS-001 Begin Shift"
        - "P04 POS-007 Close Shift"
        - "P04 POS-016 Till Configuration"
        - "P08 BO-1065 Currency, Timezone & Channels"
      x-ticvai-read-via:
      - query: tenancy#denominationRecords
        route: in-process
        for: 'its read of platform.denomination, Tenancy''s data (CHG-MOD-001)'
      - query: tenancy#regionSettingsRecords
        route: in-process
        for: 'its read of platform.region_settings, Tenancy''s data (CHG-MOD-001)'
      summary: The notes and coins a till counts
      description: >
        Raised by Tanmay in the 20 August review, and **the table was built and nothing read it** —
        found by auditing which tables no operation names.

        **Ordered for counting, not by value.** A cashier counts notes highest first and coins in
        the order they sit in the tray, and `sortOrder` is what makes the count screen match the
        physical drawer.

        **Inactive denominations are returned by default and marked**, because a till counting a
        note withdrawn last year still has to record the one in the drawer.

        **Whose denominations** (ADAM CR-219, option A, as built; Chinmay, 25 October 2026; CHG-R10ORD-002): the
        denominations of the trading currency of each region the caller can see (its own region for a venue
        caller, every region for the tenant root), each valued at its region's scale, read through
        `tenancy#regionSettingsRecords` under the caller's row-level security. A Dubai till gets AED's notes and
        coins, never Muscat's OMR.
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Denominations, in counting order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Denomination' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    put:
      operationId: setDenominations
      x-ticvai-consumed-by:
        - "P08 BO-1065 Currency, Timezone & Channels"
      x-ticvai-read-via:
      - query: tenancy#denominationRecords
        route: in-process
        for: 'its read of platform.denomination, Tenancy''s data (CHG-MOD-001)'
      x-ticvai-body-key: [currencyCode]
      x-ticvai-body-key-note: 'Keyed by the body''s `currencyCode`, not a singleton (r8 walk fix, CHG-R8WFC-001): one record per currency within the caller''s region; a PUT creates it or replaces it whole. There is no key in the path, so the key travels in the body.'
      summary: Set the notes and coins a region's tills count
      description: >
        **`listDenominations` read a table nothing wrote**, so every till's count screen was empty
        until somebody inserted rows by hand, and the UAE seed Tanmay supplied had no way in.

        **Region scope, because a currency is.** A note in circulation in the UAE is in circulation
        at every UAE venue; a venue that could set its own list could count a note its neighbour
        cannot, and the cash-ups would not add up across the region.

        **Replaces the list for one currency and never deletes.** A denomination left out is
        deactivated, not removed, because deleting it would rewrite every past cash-up that counted it.

        **PUT semantics** (26 September, pull audit R103). The set addressed is every
        denomination of `currencyCode`. Each entry is matched to an existing row on **`kind` and
        `value`** — the pair the `422` already requires to be unique. A match takes the entry's
        `displayName`, `sortOrder` and `isActive`; an entry with no match is created; an existing
        row of that currency that no entry matches is set `isActive: false`. Nothing is deleted.
        Always `200` with the whole list, never `201`, because the set exists whether or not it
        had rows.

        **The target region is named in the body** (pull audit R097). `scopePath` is the region
        whose `REGION_CONFIGURE` grant authorises the write; a caller holding it over several
        regions says which. `currencyCode` must be that region's trading currency or one a venue
        beneath it trades in (ADR-0018, amended 20 September); any other currency is refused, so
        one region cannot rewrite the notes another region counts.
      tags: [shift]
      x-ticvai-permission: REGION_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: region
      x-ticvai-config-scope: region
      x-ticvai-offline-capable: false
