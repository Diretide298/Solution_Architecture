  /deposit-boxes:
    get:
      operationId: listDepositBoxes
      x-ticvai-consumed-by:
        - "P04 POS-015 Cash Operations Dashboard"
        - "P04 POS-018 Safe Drop & Cash Transfer Management"
        - "P08 BO-042 Banking & Safe"
      x-ticvai-reads:
      - table: orders.payment
        for: 'the cash payments taken on a trading box''s shift and the change given, for overDrawerLimit (ADAM CR-218)'
      x-ticvai-read-via:
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      - query: tenancy#workstationRecords
        route: in-process
        for: 'overDrawerLimit: the box''s workstation''s cashDrawerLimit, from platform.workstation, Tenancy''s data (ADAM CR-218)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'overDrawerLimit: the venue''s cashDrawerLimit where the workstation has none, from platform.venue_settings, Tenancy''s data (ADAM CR-218)'
      x-ticvai-audience: [staff]
      summary: Cash boxes and who holds them
      description: >
        5.8.1. **A deposit box is allocated to a cashier, not to a till.** A cashier moving between
        workstations takes their float with them, and a workstation used by three people in a day
        has three boxes through it.

        That separation is what makes a variance attributable to a person rather than to a
        counter.

        **Order.** Sorted by `id` descending (a UUIDv7, so newest first).

        **Statuses.** Without `openOnly`, every `status` is returned, ended ones included (`closed`,
        `reconciled`). **`openOnly=true` returns the boxes not yet closed**: `allocated`, `open`, `suspended` and
        `closing` (ADAM CR-218, option A; Chinmay, 25 October 2026; CHG-R10ORD-001), which is how POS-015 and
        POS-018 use the list.

        **`overDrawerLimit` while a box trades** (ADAM CR-218). The box's expected cash is its opening float plus
        the cash payments taken on the box's shift (`orders.payment` of method cash on `shiftId`, in the box's
        currency) less the change given on them (`changeAmount`) less `withdrawnTotal`; once the box is counted
        it is `expectedTotal`. `overDrawerLimit` compares that figure against the workstation's
        `cashDrawerLimit` (`tenancy#workstationRecords`), else the venue's (`tenancy#venueSettingsRecords`);
        false where neither is set. The flag carries no figure.

        **The blind close holds for the box** (ADAM CR-218): `expectedTotal` and `variance` follow
        `Shift.expectedCash` (CHG-FIN-003). They are returned only to a caller holding OVERSHORT_ACCEPT or
        SHIFT_CLOSE_OTHER at the venue, and are null to everyone else, the box's own cashier included.
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
        - name: openOnly
          in: query
          description: 'True: only the boxes not yet closed (`allocated`, `open`, `suspended`, `closing`). False or
            absent: every status (ADAM CR-218).'
          schema: { type: boolean }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Boxes, one page at a time
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DepositBox' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: allocateDepositBox
      x-ticvai-consumed-by:
        - "P04 POS-016 Till Configuration"
      x-ticvai-read-via:
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      - query: tenancy#workstationRecords
        route: in-process
        for: 'its read of platform.workstation, Tenancy''s data (CHG-MOD-001)'
      - query: tenancy#denominationRecords
        route: in-process
        for: 'the face values of openingDenominations (ADAM CR-135)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s trading currency (currencyCode) and its cashDrawerLimit where the workstation has none (ADAM CR-135)'
      x-ticvai-audience: [staff]
      summary: Give a cashier a box and a float
      description: >
        5.8.1 and 5.8.3. **The opening float may be a total or a denomination breakdown** — the
        14 August MoM found POS-001 offered only denominations, and a supervisor handing over a
        counted bag should not have to re-count it into fields.

        **Either is accepted, and a denomination count takes precedence** (decided 28 September,
        audit R123 (9)). Where `openingDenominations` is sent, `openingFloat` is computed from it
        and any total sent alongside is ignored; where only `openingFloat` is sent, it is the
        float.

        **The box trades in the venue's currency** (ADAM CR-135, 17 October 2026; CHG-RTE-001). Its currency is
        the venue's frozen trading currency, venue settings' `currencyCode` (naming-and-style 5.1), asked of
        Tenancy through `tenancy#venueSettingsRecords`, which also gives the venue's `cashDrawerLimit` where the
        box's workstation has none; the face values of `openingDenominations` come from
        `tenancy#denominationRecords`. An `openingFloat` in another currency is refused `400`, and so is
        `foreignHoldings` on allocation: a box opens with no foreign cash.
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDepositBoxRequest' }
      responses:
        '400':
          description: >
            The body breaks a rule of the box (ADAM CR-135; CHG-RTE-001): `openingFloat` in a currency other than
            the venue's trading currency, with `errors[]` naming `openingFloat.currency`; or `foreignHoldings`
            sent at all, with `errors[]` naming `foreignHoldings` (a box opens with no foreign cash).
          x-ticvai-problem-types: [validation]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Allocated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositBox' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /deposit-boxes/{boxId}/adjust-float:
    parameters:
      - name: boxId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: adjustDepositBoxFloat
      x-ticvai-read-via:
      - query: tenancy#denominationRecords
        route: in-process
        for: 'what its text calls "denominations": platform.denomination, Tenancy''s data (CHG-RTE-001)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'what its text calls "venue''s cashDrawerLimit": platform.venue_settings, Tenancy''s data (CHG-RTE-001)'
      - query: tenancy#workstationRecords
        route: in-process
        for: 'what its text calls "tenancy.Workstation.cashDrawerLimit": platform.workstation, Tenancy''s data (CHG-R10GEN-001)'
      x-ticvai-audience: [staff]
      summary: Change the initial fund
      description: >
        5.8.4. **Gated on a right the cashier does not have**, because a cashier who can raise
        their own opening float can cover a shortfall by declaring one.

        **`amount` is a change, not the new total** (decided 28 September, audit R123 (3)):
        positive raises the float, negative lowers it, and the new `openingFloat` is the old one
        plus `amount`. A change that would take the float below zero is refused with 422
        `float-below-zero`.
      tags: [shift]
      x-ticvai-permission: CASH_ADD
      x-ticvai-permission-escalated: DEPOSIT_BOX_MODIFY_OTHER   # where the box is not the caller's own
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount:
                  allOf:
                    - $ref: '../shared/common.yaml#/components/schemas/Money'
                  description: >
                    The change to the float, signed. Positive adds, negative removes. Never the new
