        `pendingClosure`.

        Where the venue requires approval on close, the counted shift waits here for a supervisor.
        Approval moves it to `closed` when the variance is within the configured threshold, and
        to `pendingVariance` when it is beyond it — **approving the close is not accepting the
        over/short**, which still needs `acceptShiftVariance` (OVERSHORT_ACCEPT). The approving
        principal is recorded in `Shift.approvals` as kind `close`.

        **This never accepts a variance** (decided 28 September, audit R080 (e)): it releases a close
        the venue chose to supervise, and a variance above the threshold still goes to
        `acceptShiftVariance`, the only path for one.

        **It also releases a shift held for a variance reason** (CHG-R4-019): a difference within the
        threshold that came with no reason (`Shift.varianceReasonRequired`). The approver's `reason` is
        then recorded as the variance reason, so the close is never without one, and a client built
        before `giveShiftVarianceReason` existed still has a way to close the shift.
      tags: [shift]
      x-ticvai-permission: SHIFT_APPROVE_CLOSE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Released — `closed`, or `pendingVariance` where the variance needs acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: Shift is not `pendingClosure` (problem type `shift-not-pending-closure`)
          x-ticvai-problem-types: [shift-not-pending-closure]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /shifts/{shiftId}/no-sale:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recordNoSale
      x-ticvai-consumed-by:
        - "P04 POS-014 Sales Exceptions, Controls & Operational Actions"
        - "P04 POS-020 Shift Exceptions & Alerts"
      x-ticvai-audience: [staff]
      summary: Open the Deposit Box without a sale
      description: >
        Change for a guest, a dropped coin, correcting a float. Legitimate and routine.

        **Recorded because it is the classic cover for theft.** A drawer that opens forty times
        in a shift with four sales is a conversation, and it is only a conversation if someone
        can see the count. A reason is required for the same reason it is required on a manual
        discount — attributable, not forbidden.

        **The supervisor's approval, and its reject path** (r8 walk fix, CHG-R8WFC-005; POS-014's approved
        "AUTHORISATION REQUIRED" modal). A caller who holds `CASH_NO_SALE` acts alone and sends no step-up. A
        cashier who does not is not simply refused at the till: the modal asks a supervisor to approve, and
        the call carries `supervisorStepUp` (common.yaml `SupervisorStepUp`, verified by Identity in process:
        the supervisor holds `CASH_NO_SALE` at the till's venue and is not the caller); the act is recorded with
        that supervisor as `approvedByPrincipalId`. Without the permission and without a verified step-up the
        call is `403` (`supervisor-step-up-refused`) and nothing is written. **The supervisor declining is
        the modal's reject path and sends nothing**: the drawer stays shut and the till shows the reason the supervisor
        picked; no record is written for a request that was declined. A step-up needs the server, so offline
        only a caller who holds `CASH_NO_SALE` can do this.
      x-ticvai-step-up: pin
      x-ticvai-step-up-carrier: body:supervisorStepUp
      x-ticvai-step-up-reason: A cashier without CASH_NO_SALE opens the drawer only with a supervisor's PIN on the till (POS-014's approval modal).
      x-ticvai-read-via:
      - query: identity#verifySupervisorStepUp
        route: in-process
        for: 'the PIN step-up in `supervisorStepUp` is checked by Identity (r8 walk fix, CHG-R8WFC-005); same deployable (commerce)'
      tags: [shift]
      x-ticvai-permission: CASH_NO_SALE   # its own right, not SHIFT_SUSPEND (26 September, pull audit R199)
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, reason, recordedAt]
              properties:
                id: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [changeForGuest, correctFloat, retrieveDroppedCash, tillCheck, other]
                note: { type: string, maxLength: 300 }
                recordedAt: { type: string, format: date-time }
                supervisorStepUp:
                  allOf:
                    - $ref: '../shared/common.yaml#/components/schemas/SupervisorStepUp'
                  description: The supervisor approving for a cashier without CASH_NO_SALE (r8 walk fix, CHG-R8WFC-005).
                    Absent when the caller holds it. Its principal is stored as `NoSaleEvent.approvedByPrincipalId`.
                  x-ticvai-stored-as: orders.no_sale_event.approved_by_principal_id
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoSaleEvent' }
        '403':
          x-ticvai-problem-types: [supervisor-step-up-refused]
          description: The caller lacks CASH_NO_SALE and no supervisor step-up was sent, or it was refused (r8 walk fix, CHG-R8WFC-005)
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          x-ticvai-problem-types: [shift-not-open]
          description: Shift is not open (problem type `shift-not-open`)
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /shifts/{shiftId}/cash-movements:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCashMovements
      x-ticvai-consumed-by:
        - "P04 POS-007 Close Shift"
        - "P04 POS-015 Cash Operations Dashboard"
        - "P04 POS-017 Cash In / Cash Out Operations"
        - "P06 EMP-008 Shift summary"
        - "P06 EMP-009 End shift"
        - "P08 BO-039 Shift Directory"
        - "P08 BO-040 Variance Approval"
        - "P08 BO-041 Cash Movements"
      x-ticvai-read-via:
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s frozen trading currency and scale (currency_code, currency_scale) for the Money it answers: CreateCashMovementRequest.amount (naming-and-style 5.1, ADR-0018; CHG-R10GEN-002)'
      description: '**Order.** Newest first, by `recordedAt` descending, then by `id`.'
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: primary
      summary: Lifts, adds and the opening float
      tags: [cash]
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      x-ticvai-permission: REPORT_VIEW_WORKSTATION
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Movements in sequence, one page at a time
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CashMovement' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: createCashMovement
      x-ticvai-consumed-by:
        - "P04 POS-017 Cash In / Cash Out Operations"
        - "P04 POS-018 Safe Drop & Cash Transfer Management"
        - "P08 BO-041 Cash Movements"
        - "P08 BO-042 Banking & Safe"
      x-ticvai-read-via:
      - query: tenancy#denominationRecords
        route: in-process
        for: 'what its text calls "platform.denomination": platform.denomination, Tenancy''s data (CHG-R10GEN-001)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'what its text calls "tenancy.VenueSettings.cashDrawerLimit": platform.venue_settings, Tenancy''s data (CHG-R10GEN-001)'
      - query: tenancy#workstationRecords
        route: in-process
        for: 'what its text calls "tenancy.Workstation.cashDrawerLimit": platform.workstation, Tenancy''s data (CHG-R10GEN-001)'
      x-ticvai-audience: [staff]
      summary: Record a cash lift or add
      description: >
        A lift removes cash from an open float mid-shift without closing it — the supervisor
        takes the excess to the safe and the cashier keeps trading. Both directions are
        traced, both record the authorising principal, and both adjust the expected figure
        used at close.

        **What "exceeds the counted float" means** (decided 28 September, audit R123 (2)): the
        cash available to lift is the float counted at the shift's last count (the opening float,
        or the last `movement` count if one is later), less every lift recorded since, plus every
        add. A lift larger than that is refused with `lift-exceeds-float`. Cash taken in sales since
        the last count does not count towards it, because nobody has counted it.

        **The drawer limit offers the lift** (decided 2 October 2026, Chinmay, batch 6 #179, BO-042:
        "Add drawer limit setting (warn + offer cash lift)"; DEC-179; CHG-CSP-016; DI-274). When the cash
        a till has taken since its last count puts the drawer over the till's limit
        (`tenancy.Workstation.cashDrawerLimit`, else `tenancy.VenueSettings.cashDrawerLimit`), the till
        warns and offers a lift recorded here; `DepositBox.overDrawerLimit` flags the box on BO-042. The
        warning never blocks a sale, and the cashier is told only that the drawer is over its limit, not
        what it holds (CHG-FIN-003). A supervisor recording the lift counts what they take, which makes it
        counted cash.

        **Offline, the till journals the movement and replays this same call** (decided 20 October 2026,
        Chinmay, R8 blocker cause FOUNDATION-AI-C13, option A; CHG-R8SPN-021). On reconnect the journal calls
        `createCashMovement` itself, with the `Idempotency-Key` the movement was taken with and its
        `recordedAt` (when it happened at the till), so a replay sent twice records it once. It is not part
        of `syncOrders`. A replay refused `409 shift-not-open` or `lift-exceeds-float` is not retried: the till
        quarantines it through `recordSyncRejection` with `kind` `cashMovement` and the request body as the
        `payload`, and a supervisor resolves it on the sync rejections list like any other.
      tags: [cash]
      x-ticvai-permission: CASH_LIFT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCashMovementRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashMovement' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          x-ticvai-problem-types: [shift-not-open, lift-exceeds-float]
          description: >
            Shift is not open (problem type `shift-not-open`), or the lift exceeds the float
            counted at the last count less lifts since (`lift-exceeds-float`, audit R123 (2))
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  schemas:
    ShiftStatus:
      type: string
      enum:
        - pendingApproval    # awaiting SHIFT_APPROVE_OPEN where configured
        - open
        - suspended          # break cover; float intact, workstation released
        - pendingVariance    # counted, over/short beyond threshold; "Under review" to the cashier, never blocks the next shift (CHG-CSP-012)
        - pendingClosure     # awaiting approveShiftClose (SHIFT_APPROVE_CLOSE) where configured
        - closed
        - autoClosed         # closed by the inactivity job, supervisor notified

    TillShiftPolicy:
      x-ticvai-persistence: "orders.till_shift_policy"
      type: object
      description: >
        **The venue's opening, closing and exception rules for every till** (CHG-CSP-020; POS-019; DI-309).
        One per venue. Proposed defaults are ours, client to correct.
      required: [venueId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        venueId: { type: string, format: uuid, x-ticvai-references: platform.scope }
        scopePath: { type: string, readOnly: true }
        requireOpenApproval:
          type: boolean
          default: false
          description: >
            Every shift opens `pendingApproval` and waits for `approveShiftOpen` (SHIFT_APPROVE_OPEN). Off
            by default: only a float outside `openingFloatTolerance` waits.
        openingFloatTolerance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          nullable: true
          description: >
            How far a declared opening float may differ from the box's allocated float before the shift
            waits for approval (`states/shift.yaml`, pendingApproval). Null: any difference waits.
        depositBoxRequired:
          type: boolean
          default: true
          description: A shift cannot open without a deposit box (`OpenShiftRequest.depositBoxCode`); refused `400` otherwise.
        bagNumberRequired:
          type: boolean
          default: false
          description: A shift cannot open without a bag number (`OpenShiftRequest.bagNumber`).
        requireCloseApproval:
          type: boolean
          default: false
          description: >
            Every counted shift waits in `pendingClosure` for `approveShiftClose` (SHIFT_APPROVE_CLOSE), even
            within the variance threshold.
        autoCloseAfterHours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 48
          default: 14
          description: >
            Hours after which an open or suspended shift nobody closed is closed by the inactivity job as
            `autoClosed` and the supervisors are told (`states/shift.yaml`). Null never auto-closes.
        noSaleAlertCount:
          type: integer
          nullable: true
          minimum: 1
          default: 10
          description: >
            No-sales in one shift (`recordNoSale`) at which the supervisors are alerted on the venue's alerting
            channel; the count is on POS-020. Null sends no alert.
        updatedAt: { type: string, format: date-time, readOnly: true }

    DepositBoxStatus:
      type: string
      enum: [allocated, open, suspended, closing, closed, reconciled]

    CreateDepositBoxRequest:
      type: object
      x-ticvai-persistence: "none — request only; allocateDepositBox writes it as orders.deposit_box with its orders.deposit_box_opening_denomination rows, and answers with DepositBox"
      description: >
        **What `allocateDepositBox` takes** (R8 blocker fix, APPROVALS-TENANCY-C25). The cashier, the venue and **one of**
        `openingFloat` or `openingDenominations`: a denomination count alone is accepted and `openingFloat` is computed
        from it, as `allocateDepositBox` says. `DepositBox`, the response, keeps `openingFloat` required, because the
        stored box always has one. Every other property is the one `DepositBox` declares, by reference, so the server-set
        ones stay readOnly and are ignored on input, as before.
      required: [cashierPrincipalId, venueId]
      anyOf:
        - required: [openingFloat]
        - required: [openingDenominations]
      properties:
        id: { $ref: '#/components/schemas/DepositBox/properties/id' }
        cashierPrincipalId: { $ref: '#/components/schemas/DepositBox/properties/cashierPrincipalId' }
        cashierName: { $ref: '#/components/schemas/DepositBox/properties/cashierName' }
        venueId: { $ref: '#/components/schemas/DepositBox/properties/venueId' }
        workstationId: { $ref: '#/components/schemas/DepositBox/properties/workstationId' }
        shiftId: { $ref: '#/components/schemas/DepositBox/properties/shiftId' }
        status: { $ref: '#/components/schemas/DepositBox/properties/status' }
        openingFloat: { $ref: '#/components/schemas/DepositBox/properties/openingFloat' }
        openingDenominations: { $ref: '#/components/schemas/DepositBox/properties/openingDenominations' }
        withdrawnTotal: { $ref: '#/components/schemas/DepositBox/properties/withdrawnTotal' }
        overDrawerLimit: { $ref: '#/components/schemas/DepositBox/properties/overDrawerLimit', readOnly: true }  # computed on read, never sent (CHG-R8INT-015)
        foreignHoldings: { $ref: '#/components/schemas/DepositBox/properties/foreignHoldings' }
        expectedTotal: { $ref: '#/components/schemas/DepositBox/properties/expectedTotal' }
        countedTotal: { $ref: '#/components/schemas/DepositBox/properties/countedTotal' }
        variance: { $ref: '#/components/schemas/DepositBox/properties/variance' }
        closedByPrincipalId: { $ref: '#/components/schemas/DepositBox/properties/closedByPrincipalId' }
        allocatedAt: { $ref: '#/components/schemas/DepositBox/properties/allocatedAt' }
        closedAt: { $ref: '#/components/schemas/DepositBox/properties/closedAt' }
        recordedAt: { $ref: '#/components/schemas/DepositBox/properties/recordedAt' }

    DepositBox:
      type: object
      x-ticvai-persistence: "orders.deposit_box + orders.deposit_box_opening_denomination + orders.deposit_box_foreign_holding"
      description: >
        5.8. **Allocated to a cashier, not to a workstation.** A cashier moving between tills takes
        their float with them, which is what makes a variance attributable to a person.

        **`openingDenominations` and `foreignHoldings` are child rows** (26 September, pull audit
        R099): `orders.deposit_box_opening_denomination` and `orders.deposit_box_foreign_holding`,
        one row per item, keyed to the box. Until then the contract carried both and the table had
        nowhere to put either.
      required: [cashierPrincipalId, venueId, openingFloat]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        cashierPrincipalId: { type: string, format: uuid }
        cashierName: { type: string, readOnly: true }
        venueId: { type: string, format: uuid }
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: Where it is being used now. **Changes during a shift; the box does not.**
        shiftId:
          type: string
          format: uuid
          nullable: true
          description: The shift trading from this box. A UUIDv7, as `Shift.id` is.
        status: { $ref: '#/components/schemas/DepositBoxStatus' }
        openingFloat: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        openingDenominations:
          type: array
          description: >
            5.8.3. **Either this or a total** — a supervisor handing over a counted bag should not
            have to re-count it into fields. POS-001 offered only denominations until 14 August.
          items:
            type: object
            required: [denominationId, count]
            properties:
              denominationId:
                x-ticvai-references: platform.denomination
                type: string
                format: uuid
                description: >
                  References `platform.denomination`, as `CashCountLine.denominationId` does. Until
                  26 September this was `denomination: number` — a face value as a JSON float, which
                  naming-and-style 5.1 forbids and which could disagree with the note it named
                  (pull audit R122).
              count: { type: integer, minimum: 0 }
        withdrawnTotal:
          x-ticvai-column: withdrawn_amount
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          readOnly: true
          description: >
            **Reduces the expected close figure.** Cash skimmed for banking is not a shortfall, and
            a system that treats it as one makes every busy cashier look short.
        overDrawerLimit:
          type: boolean
          readOnly: true
          default: false
          x-ticvai-persisted: false
          x-ticvai-derived: onRead
          description: >
            **The box holds more than its till's drawer limit** (decided 2 October 2026, Chinmay, BO-042;
            DEC-179; CHG-CSP-016): computed on read from the box's expected cash against
            `tenancy.Workstation.cashDrawerLimit` or the venue's `cashDrawerLimit`. BO-042 flags the box and
            offers a lift; false where no limit is set. A flag, not a figure: it tells the cashier nothing
            about the expected cash (CHG-FIN-003).
        foreignHoldings:
          type: array
          description: >
            4.6.11 and 6.1.10. **Foreign cash accepted at this till, counted separately by currency.** A
            till taking USD and EUR alongside AED has three counts and three variances — collapsing them
            into a base-currency total makes a variance unattributable to the currency that caused it.

            **No opening float in a foreign currency and no change given in one.** Foreign cash only ever
            comes in, which is what keeps this to one number per currency rather than a full
            reconciliation each. Refused on allocateDepositBox (400): a box opens with no foreign cash (ADAM CR-135).
          items:
            type: object
            required: [currency, countedAmount]
            properties:
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
                description: >
                  **Stored, because it is the one thing that is not in the box's own currency.** A
                  foreign holding is by definition cash in a currency the till does not trade in, so it
                  cannot resolve the way the box's own amounts do (naming-and-style 5.1; ADAM CR-135);
                  it is the key of the row, one per currency per box. The amounts on this item are in
                  this currency, at its ISO 4217 minor units from the kernel's fixed list (ADAM CR-192;
                  common.yaml `Money.scale`).
              expectedAmount:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Money'
                description: The sum of tenders taken in this currency during the shift.
              countedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              variance: { $ref: '../shared/common.yaml#/components/schemas/Money', x-ticvai-column: variance_amount }
              baseEquivalent:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Money'
                description: >
                  **At the rates on the payments, not today's.** A shift closed on Friday and reviewed on
                  Monday is reviewed at Friday's rates (CF-37).
        expectedTotal:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          x-ticvai-column: expected_amount
          nullable: true
          description: >
            The figure the box's close count is measured against, filled when the box is counted. **Blind to its
            own cashier** (ADAM CR-218; as `Shift.expectedCash`, CHG-FIN-003): returned only to a caller holding
            OVERSHORT_ACCEPT or SHIFT_CLOSE_OTHER at the venue, null to everyone else on every read, the box's own
            cashier included.
        countedTotal: { $ref: '../shared/common.yaml#/components/schemas/Money', x-ticvai-column: counted_amount }
        variance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          x-ticvai-column: variance_amount
          nullable: true
          description: >
            Counted minus expected; negative is short. Null to every caller without OVERSHORT_ACCEPT or
            SHIFT_CLOSE_OTHER at the venue, as `expectedTotal` (ADAM CR-218; CHG-FIN-003).
        closedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Flagged where it is not the holder.** A box closed without its holder present is
            allowed — the cash is counted by somebody, and who counted it is the record.
        allocatedAt:
          type: string
          format: date-time
          description: >
            When the device recorded the allocation. `allocateDepositBox` is offline-capable, so
            for a box allocated offline this differs from the server's receipt time.
        closedAt: { type: string, format: date-time, nullable: true }
        recordedAt:
          type: string
          format: date-time
          description: '**When the device made the write** (R113; CHG-OFL-003): for an allocation, the same moment as
            `allocatedAt`, kept in `recorded_at`, the column every offline-written table carries for the sync to
            order replays by. Omitted online, the server sets it to the time it received the call.'

    Denomination:
      x-ticvai-rls: grant-holder-read   # MOD audit, CHG-MOD-007: read below the tenant by listDenominations, setDenominations
      x-ticvai-persistence: "platform.denomination"
      description: >
        **Raised in review by Tanmay: denominations belong in a table, not in JSON.** He is right,
        and the reason is stronger than storage tidiness — **`orders.cash_movement.denominations`
        was a jsonb blob, so a note that stops circulating has nothing to deactivate.**

        **The seed is `docs/active/seed-data-proposal.md` section 1** (audit R229, proposed, client to
        correct): notes 5, 10, 20, 50, 100, 200, 500 and 1000 AED; coins 25 fils, 50 fils and 1 AED.
        The zero-valued coin in the list first supplied (`Coin, 0, COIN`) is a transcription slip
        rather than a denomination, is not seeded, and is the kind of row a table refuses and a
        JSON blob accepts silently.

        **Oman: section 1a** (ADAM CR-159, 18 October 2026; proposed by us, client to correct, not client
        data): OMR at scale 3 (1 rial = 1,000 baisa); notes 100 baisa, half a rial, 1, 5, 10, 20 and 50
        rials; coins 5, 10, 25 and 50 baisa. The reference fixture's Muscat region seeds from it, so a shift
        count and a cash-up run in OMR.

        **Ordered for counting, not by value.** A cashier counts notes highest first and coins in
        the order they sit in the drawer, and `sortOrder` is what makes the count screen match the
        physical tray."
      type: object
      required: [currencyCode, kind, value, scopePath]
      properties:
        scopePath:
          type: string
          readOnly: true
          description: 'Where the row is owned: the path of the scope that wrote it (its venue, or the region or tenant that configured it), set by the server from the caller''s scope and never taken from a request. Row-level security reads it, so a venue writes and reads its own rows (MOD audit, 14 October 2026, CHG-MOD-007).'
        id: { type: string, format: uuid }
        currencyCode: { type: string }
        displayName:
          type: string
          description: What the cashier reads — *AED 500*, *Coin*. Localised, because a count screen is read at speed.
        kind: { type: string, enum: [note, coin] }
        sortOrder:
          type: integer
          description: >
            **Counting order, not value order.** Notes highest first, coins as they sit in the tray.
        isActive:
          type: boolean
          default: true
          description: >
            **The field that makes this a table.** A note withdrawn from circulation is deactivated
            and stays in the count history — **a JSON blob cannot deactivate anything**, and
            deleting the value would rewrite every past cash-up that used it.
        value:
          x-ticvai-column: face_value_amount
          $ref: '../shared/common.yaml#/components/schemas/Money'
    SetDenominationsRequest:
      type: object
      description: >
        Request only. One currency's complete list; anything not in it is deactivated. Entries
        match existing rows on `kind` and `value` (see `setDenominations`).
      required: [scopePath, currencyCode, denominations]
      properties:
        scopePath:
          type: string
          description: >
            The region the write is made at — the materialised path of a `region` scope node. The
            caller's `REGION_CONFIGURE` grant must cover it.
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        denominations:
          type: array
          minItems: 1
          items:
            type: object
            required: [displayName, kind, value, sortOrder]
            properties:
              displayName: { type: string, maxLength: 60 }
              kind: { type: string, enum: [note, coin] }
              value:
                $ref: '../shared/common.yaml#/components/schemas/Money'
              sortOrder: { type: integer, minimum: 0 }
              isActive: { type: boolean, default: true }

    DenominationCount:
      type: array
      description: >
        **A count is a list of lines and the line is the row.** Until 24 August this array carried
        the persistence hint itself, so `orders.cash_count_line` derived a single column —
        `shift_id` — and a count line had no denomination, no quantity and no variance.

        **The array is the transport; `CashCountLine` is the row.**
      items: { $ref: '#/components/schemas/CashCountLine' }
      minItems: 1

    CountedDenominationLine:
      type: object
      x-ticvai-persistence: none — request only; lands as `CashCountLine` rows
      description: >
        **One line of a cash count as the cashier types it: which note or coin, how many, and what
        they come to** (decided 29 September, readiness close-out; our build plan). The shape of the
        blind count on close (`closeShift`) and of the count columns on the till screens (POS-007,
        POS-011). It is the request side of `CashCountLine`, which is the stored row and adds the
        shift, the count kind, who counted and when.

        **`total` is shown to the cashier and checked, not trusted**: the server recomputes `count`
        times the denomination's face value and refuses a line whose `total` disagrees with 422
        `count-total-mismatch`. An inactive or unknown denomination is refused with 422
        `unknown-denomination`.
      required: [denominationId, count]
      properties:
        denominationId:
          type: string
          format: uuid
          description: "References `platform.denomination` (`Denomination.id`) — face value, kind and counting order live there."
        count:
          type: integer
          minimum: 0
          maximum: 100000
          description: "**How many of this note or coin were counted.** Zero is a line, not an omission: a denomination counted and found empty."
        total:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          x-ticvai-column: counted_value
          description: >
            `count` times the face value, in the denomination's currency. Optional on the way in (the
            server computes it) and checked when sent. Stored as `orders.cash_count_line.counted_value`
            (r8 integration, CHG-R8INT-005).

    CashCountLine:
      x-ticvai-persistence: "orders.cash_count_line"
      type: object
      description: >
        **One denomination, counted once, against one shift.** Raised in review on 24 August:
        the table was a stub.

        **The denomination is referenced rather than described** — `platform.denomination` already
        holds the note and coin definitions per currency, and a count line that repeats the face
        value is a count line that can disagree with the till it was counted on.

        **`countedQuantity` is a quantity and `expectedQuantity` is derived**, not stored: the
        expectation is the opening float plus every movement, and a stored expectation that drifts
        from the movements is a variance nobody can explain.
      required: [shiftId, denominationId, countedQuantity]
      properties:
        id: { type: string, format: uuid }
        shiftId:
          type: string
          format: uuid
          description: A UUIDv7, as `Shift.id` and `orders.pos_shift.id` are.
        depositBoxId: { type: string, format: uuid, nullable: true }
        countKind:
          type: string
          enum: [openingFloat, close, movement]
          description: >
            Which count this line belongs to — the opening float (`openShift`), the close
            (`closeShift`) or a lift or add (`createCashMovement`). **Until 26 September the three
            were indistinguishable on one shift** (pull audit R099). Set by the server from the
            operation that wrote the line.
        cashMovementId:
          type: string
          format: uuid
          nullable: true
          description: >
            The movement this line counts, where `countKind` is `movement`. How
            `listCashMovements` rebuilds each movement's `denominations`.
        denominationId:
          x-ticvai-references: platform.denomination
          type: string
          format: uuid
          description: "References `platform.denomination` — face value, kind and sort order live there."
        countedQuantity:
          type: integer
          minimum: 0
          description: "**How many of this note or coin were in the drawer.**"
        countedValue:
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            **Quantity times face value, stored.** Derivable, and stored anyway: a denomination
            revalued or deactivated later would silently rewrite a historical count.
        countedBy: { type: string, format: uuid, nullable: true }
        countedAt: { type: string, format: date-time }
        recountOf:
          type: string
          format: uuid
          nullable: true
          description: >
            **A recount points at what it replaces rather than overwriting it.** `requestRecount`
            exists because a variance is a question before it is a fact.

    OpenShiftRequest:
      type: object
      required: [workstationId, openingFloat]
      properties:
        workstationId: { type: string, format: uuid }
        openingFloat: { $ref: '#/components/schemas/DenominationCount' }
        depositBoxCode:
          type: string
          maxLength: 64
          description: >
            Physical container assigned to this shift. Required where the venue configures
            deposit box allocation.
        bagNumber:
          type: string
          maxLength: 64
          description: Required where the venue configures bag numbers as mandatory.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the device recorded it. `openShift` is online-only (F32), so this differs from
            server receipt time only by transit; it is kept because the shift's other device
            writes are ordered against it.

    CloseShiftRequest:
      type: object
      required: [countedCash, recordedAt]
      properties:
        countedCash:
          type: array
          minItems: 1
          description: >
            **The cashier's blind count, one line per denomination counted** (decided 29 September,
            readiness close-out; our build plan). The server writes each line as one `CashCountLine`
            (`countKind` close) against the shift, taking the face value from `platform.denomination`.
            A denomination may appear once; a repeat is refused with 422 `duplicate-denomination`.
          items: { $ref: '#/components/schemas/CountedDenominationLine' }
        nonCashDeclared:
          type: array
          description: >
            Declared totals per non-cash tender, for reconciliation against captured
            payments.
          items:
            type: object
            required: [tender, amount]
            properties:
              tender: { type: string }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        notes:
          type: string
          maxLength: 1000
          description: >
            The cashier's note on the count. Asked of every cashier on a blind count, never only
            after a variance is shown (CHG-FIN-003, DI-803).
        cashierReason:
          type: string
          nullable: true
          enum: [tillError, unrecordedRefund, miscount, other]
          description: >
            Anything the cashier knows went wrong in the shift (DI-803: till error, unrecorded refund,
            miscount, other). Optional and given without seeing the variance (CHG-FIN-003); the
            supervisor reads it beside the variance on BO-040. **Optional here, never skipped where it
            matters** (CHG-R4-019): if the count differs within the threshold and this is empty, the
            shift waits for `giveShiftVarianceReason` before it closes.
        releaseHeldLeases:
          type: boolean
          default: true
          description: >
            Return unsold inventory leases held by this workstation (ADR-0013 C103). Closing
            without releasing strands capacity until TTL expiry, which is visible at a gate
            during peak.
        recordedAt: { type: string, format: date-time }

    ShiftCloseResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [shift, expectedCash, countedCash, variance, requiresAcceptance]
      properties:
        shift: { $ref: '#/components/schemas/Shift' }
        expectedCash:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        countedCash:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        variance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Counted minus expected. Negative is short.
        requiresAcceptance:
          type: boolean
          description: >
            True when the variance exceeds the venue's `shiftVarianceThreshold` (audit R094). The
            shift is then `pendingVariance` and only `acceptShiftVariance` finalises it (audit
            R080 (e)).
        varianceReasonRequired:
          type: boolean
          default: false
          description: >
            True when the variance is non-zero and within the threshold and the body gave no
            `cashierReason`: the shift is held in `pendingClosure` until `giveShiftVarianceReason` or
            `approveShiftClose` records a reason (the client's policy of 6 October 2026, T10.1;
            CHG-R4-019).
        nonCashVariances:
          type: array
          items:
            type: object
            required: [tender, declared, captured, variance]
            properties:
              tender: { type: string }
              declared: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              captured: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              variance: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    ShiftCountReceipt:
      x-ticvai-persistence: "none — computed"
      type: object
      description: >
        **What `submitShiftCount` returns to the cashier: what happens next, never the figure**
        (CHG-FIN-003). No expected cash, no variance, no over or short.
      required: [shiftId, status, outcome, countedAt]
      properties:
        shiftId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        outcome:
          type: string
          enum: [closed, referredToSupervisor, awaitingCloseApproval]
          description: >
            `closed`: within the venue's threshold, the shift is closed. `referredToSupervisor`: a
            supervisor reviews the count (`pendingVariance`); the till says "Your count is with your
            supervisor" and nothing about the amount. `awaitingCloseApproval`: the venue supervises
            every close (`pendingClosure`), or, with `varianceReasonRequired` true, the shift waits for
            the cashier's reason for a difference within the threshold (CHG-R4-019).
        countedAt: { type: string, format: date-time }
        countNumber:
          type: integer
          minimum: 1
          description: 1 for the first count of the close, 2 for a recount the supervisor asked for, and so on.
        varianceReasonRequired:
          type: boolean
          default: false
          description: >
            **The count found a difference within the threshold and no reason came with it** (the client's
            policy of 6 October 2026, T10.1; CHG-R4-019). The shift is held in `pendingClosure` (outcome
            `awaitingCloseApproval`) and the till asks for a reason (`giveShiftVarianceReason`), which closes
            it. Says only that a difference exists: never its amount or direction, and the count is already
            locked (CHG-FIN-003). False when the count matched, when a `cashierReason` came with it, and
            beyond the threshold (`referredToSupervisor`).

    ShiftVarianceReasonRequest:
      x-ticvai-persistence: orders.pos_shift
      type: object
      description: >
        The reason for a difference within the threshold, given after the blind count is locked
        (`giveShiftVarianceReason`; the client's policy of 6 October 2026, T10.1; CHG-R4-019).
      required: [reason]
      properties:
        reason:
          type: string
          enum: [tillError, unrecordedRefund, miscount, other]
          x-ticvai-column: cashier_reason
          description: >
            The same reasons as `CloseShiftRequest.cashierReason` (DI-803), recorded as the shift's
            `cashierReason`.
        note:
          type: string
          maxLength: 1000
          x-ticvai-column: cashier_note
          description: >
            What happened, in the cashier's words; recorded as the shift's `cashierNote` (appended to a
            note given with the count). Required when `reason` is `other` (422 `reason-note-required`).

    Shift:
      x-ticvai-persistence: "orders.pos_shift + orders.pos_shift_approval + orders.pos_shift_incident"
      description: >
        **`approvals` and `incidents` are child rows** (26 September, pull audit R099):
        `orders.pos_shift_approval` and `orders.pos_shift_incident`, one row per item, keyed to the
        shift. Until then the contract carried both and `orders.pos_shift` had nowhere to put either.
      type: object
      required: [id, workstationId, venueId, scopePath, principalId, status, currency, currencyScale, openedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7. Also the idempotency key.
        workstationId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        principalId:
          type: string
          format: uuid
          description: Who opened it. Cash reconciles to a person and a drawer.
        principalDisplayName: { type: string }
        incidents:
          type: array
          description: >
            BL-097. **A till has exceptions and there was nowhere to write them** — a no-sale, a
            drawer opened without a transaction, a manager override, a guest dispute.

            **This is the log a cash-up investigation starts from**, and a shift that balances with
            four unexplained no-sales is not a shift that balanced.
          items:
            type: object
            properties:
              kind: { type: string, enum: [noSale, drawerOpen, override, voidAfterPayment, guestDispute, tillJam, priceQuery, other] }
              at: { type: string, format: date-time }
              principalId: { type: string, format: uuid }
              note: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          x-ticvai-persisted: false
          description: >
            **Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped and not overri
            dable below, so a row in a UAE region is AED and cannot be anything else. **Kept on the wire
            , removed from the table** — a client should not walk a hierarchy to read a figure, and the 
            database should not hold nine million copies of AED. Four tables genuinely differ from their
             region and keep a stored currency: `orders.payment.tender_currency`, `inventory.supplier`, 
            `ledger.account`, `control.partner_agreement`.
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          x-ticvai-persisted: false
          description: >
            **Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped and not overri
            dable below, so a row in a UAE region is AED and cannot be anything else — storing it per ro
            w is a copy of a fact that cannot differ. **Kept on the wire, removed from the table**: a cl
            ient reading a figure should not walk a hierarchy to know what it means, and the database sh
            ould not hold nine million copies of AED. Four tables genuinely differ from their region and
             keep a stored currency — `orders.payment.tender_currency`, `inventory.supplier`, `ledger.ac
            count`, `control.partner_agreement`. **A guest paying USD at an AED venue is a real row; a w
            orkstation with its own currency is a misconfiguration.**
        depositBoxCode: { type: string, nullable: true }
        bagNumber: { type: string, nullable: true }
        openingFloat: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        # Columns renamed 26 September (pull audit R177): naming-and-style 5.1 bans `total` alone,
        # and the N7 rename of 24 September missed this table. The wire keeps its names.
        salesTotal:
          x-ticvai-column: gross_sales_amount
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            What the till took in sales, as the guest paid it — tax included: the shift's takings, not
            Gross sales (CHG-FIN-002, CHG-FIN-010). **Shown to the shift's own cashier only as one total
            across every tender** ("Sales this shift" on POS-025; the lead, 3 October 2026, CHG-RONEC-002):
            with no cash share it cannot be turned into the expected cash, so the blind close holds
            (CHG-FIN-003). The cash share, the tender split, `expectedCash` and `variance` stay with the
            supervisor.
        refundsTotal:
          x-ticvai-column: gross_refunded_amount
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: What the till paid back, as the guest was refunded it — tax included.
        liftsTotal:
          x-ticvai-column: lifted_amount
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Cash taken out mid-shift by lifts and withdrawals. Cash, so neither gross nor net.
        expectedCash:
          x-ticvai-column: expected_cash_amount
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          readOnly: true
          nullable: true
          description: >
            26 September, pull audit R207. **The figure the blind count was measured against**,
            revealed once the count is in — null until then. Until this date only
            `ShiftCloseResult` carried it, returned once by `closeShift`, so BO-040 could not show
            the over/short it exists to accept.
            **Null to the shift's own cashier on every read** (CHG-FIN-003, 2 October): returned only to
            a caller holding OVERSHORT_ACCEPT or SHIFT_CLOSE_OTHER at the venue.
        countedCash:
          x-ticvai-column: counted_cash_amount
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          readOnly: true
          nullable: true
          description: What the close count found. Null until the shift is counted.
        variance:
          x-ticvai-column: variance_amount
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          readOnly: true
          nullable: true
          description: Counted minus expected, as `ShiftCloseResult.variance`. Negative is short.
            Null to the shift's own cashier, as `expectedCash` (CHG-FIN-003).
        cashierReason:
          type: string
          nullable: true
          readOnly: true
          enum: [tillError, unrecordedRefund, miscount, other]
          description: >
            What the cashier said went wrong, given with the blind count (`CloseShiftRequest.cashierReason`,
            DI-803) without seeing the variance; the supervisor reads it beside the variance on BO-040
            (CHG-FIN-003).
        cashierNote:
          type: string
          nullable: true
          readOnly: true
          maxLength: 1000
          description: The cashier's note with the count (`CloseShiftRequest.notes`; CHG-FIN-003).
        varianceReasonRequired:
          type: boolean
          readOnly: true
          x-ticvai-persisted: false
          description: >
            **Computed, not stored** (CHG-R4-019): true while the shift is `pendingClosure` because its count
            differs from the expected figure within the threshold and no `cashierReason` is recorded. The
            till shows "Give a reason to close" (POS-007, EMP-009), BO-040 and BO-043 list it as waiting for a
            reason; `giveShiftVarianceReason` or `approveShiftClose` clears it. Shown to the shift's own
            cashier, since it carries no figure (CHG-FIN-003).
        heldLeaseCount:
          type: integer
          description: >
            Inventory leases currently held by this workstation. Surfaced so an operator
            closing a shift can see what will be returned.
        openedAt: { type: string, format: date-time }
        businessDate:
          type: string
          format: date
          readOnly: true
          description: >
            **The business day the shift belongs to** (12 October 2026, CHG-R6-032): the venue-local date of
            `openedAt` taken against the venue's `businessDayCutoff` (tenancy `VenueSettings`, inheriting the
            tenant default, default 00:00). Set once when the shift opens and never moved, so a shift opened at
            23:00 and closed at 01:00 stays on the day it opened. The daily reconciliation (BO-043) lists the
            shifts of one business date, and the period close's `noOpenShifts` check reads it (finance).
        recordedAt:
          type: string
          format: date-time
          description: When the device recorded the open. `openedAt` is the server's time.
        suspendedAt: { type: string, format: date-time, nullable: true }
        suspendReason:
          type: string
          maxLength: 200
          nullable: true
          description: The `reason` given to `suspendShift`. Cleared on resume.
        closedAt: { type: string, format: date-time, nullable: true }
        closedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: >
            Who submitted the close count. `reopenShift` refuses an approver who is this principal,
            and until 26 September there was nothing to compare against (pull audit R099).
        recountRequestedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            **Set by `rejectShiftVariance`, cleared by the cashier's recount** (decided 2 October 2026,
            Chinmay; DEC-175; CHG-CSP-013; DI-804). While set, the shift is `pendingVariance` waiting for the
            cashier rather than the supervisor: the cashier's view says "Recount requested" instead of
            "Under review".
        recountRequestedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The supervisor who sent the count back (CHG-CSP-013).
        recountReason:
          type: string
          nullable: true
          readOnly: true
          maxLength: 500
          description: The supervisor's reason, shown to the cashier; never an amount (CHG-CSP-013, CHG-FIN-003).
        countNumber:
          type: integer
          minimum: 0
          readOnly: true
          description: >
            How many close counts the shift has had: 0 before the first, 1 after it, 2 after a recount
            (CHG-CSP-013). The latest is the one measured.
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the shift has unsynced operations.
        approvals:
          type: array
          items:
            type: object
            required: [kind, principalId, at]
            properties:
              kind:
                type: string
                enum: [open, close, variance, reopen]
                description: >
                  `open` from `approveShiftOpen`, `close` from `approveShiftClose`, `variance` from
                  `acceptShiftVariance`, `reopen` from `reopenShift` (the supervisor who signed it, the time and the
                  `reason`).
              principalId: { type: string, format: uuid, x-ticvai-references: identity.principal }
              at: { type: string, format: date-time }
              reason: { type: string }

    CashMovementKind:
      type: string
      enum: [openingFloat, lift, add]
      description: >
        `openingFloat` is written by `openShift`; `lift` by `createCashMovement` and by
        `withdrawFromDepositBox`, which is a lift from one cashier's box; `add` by
        `createCashMovement`.

    WithdrawalReason:
      type: string
      description: Why a supervisor took cash out of a box. Set only on lifts `withdrawFromDepositBox` records.
      enum: [banking, safeDrop, changeOrder, other]

    CreateCashMovementRequest:
      type: object
      required: [id, kind, amount, recordedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUIDv7.
        kind: { $ref: '#/components/schemas/CashMovementKind' }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money', x-ticvai-column: movement_amount }
        denominations:
          $ref: '#/components/schemas/DenominationCount'
          x-ticvai-persisted: false
          description: >
            **Stored as `orders.cash_count_line` rows** with `countKind: movement` and this
            movement's `cashMovementId`, not as a column. The jsonb blob this used to land in is
            what `Denomination` was created to replace (26 September, pull audit R099).
        reference:
          type: string
          maxLength: 64
          description: Safe drop reference or bag number.
        reason: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    NoSaleEvent:
      type: object
      x-ticvai-persistence: "orders.no_sale_event"
      required: [id, shiftId, reason, principalId, recordedAt]
      properties:
        approvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The supervisor whose step-up approved it for a cashier without CASH_NO_SALE; null when the
            cashier held it (r8 walk fix, CHG-R8WFC-005).
          x-ticvai-references: identity.principal
        id: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        workstationId: { type: string, format: uuid }
        reason: { type: string }
        note: { type: string, nullable: true }
        principalId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
        countThisShift:
          type: integer
          description: >
            Running count. Returned so the terminal can show it — a cashier who can see they
            are on their ninth no-sale behaves differently from one who cannot.

    CashMovement:
      x-ticvai-persistence: "orders.cash_movement"
      allOf:
        - $ref: '#/components/schemas/CreateCashMovementRequest'
        - type: object
          required: [shiftId, authorisedByPrincipalId, sequence]
          properties:
            shiftId:
              type: string
              format: uuid
            depositBoxId:
              type: string
              format: uuid
              nullable: true
              description: >
                The box the cash moved in or out of. Set on every lift `withdrawFromDepositBox`
                records (26 September, pull audit R099).
            witnessPrincipalId:
              type: string
              format: uuid
              nullable: true
              description: The cashier who countersigned a withdrawal. Null on other movements.
            withdrawalReason:
              allOf:
                - $ref: '#/components/schemas/WithdrawalReason'
              nullable: true
            authorisedByPrincipalId:
              type: string
              format: uuid
              description: The principal who authorised the movement, recorded for audit.
            sequence:
              type: integer
              description: Monotonic within the shift. Preserves order across an offline batch.
            syncedAt: { type: string, format: date-time, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
