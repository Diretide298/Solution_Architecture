      x-ticvai-permission: SHIFT_REOPEN
      x-ticvai-step-up: pin
      x-ticvai-read-via:
      - query: finance#fiscalPeriodRecords
        route: in-process
        for: 'the fiscal period containing the shift''s close, ledger.fiscal_period, Ledger''s data (CHG-MOD-001; R8 lineage request)'
      - query: identity#verifySupervisorStepUp
        route: in-process
        for: 'the PIN step-up in `supervisorStepUp` is checked by Identity, never by reading identity.* here (CHG-CRD-004, ADAM CR-078); same deployable (commerce): the C# query interface Identity implements, in the caller''s transaction (ADR-0055 rule 2)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s frozen trading currency and scale (currency_code, currency_scale) for the Money it accepts or answers: Shift.countedCash, Shift.expectedCash, Shift.liftsTotal, Shift.openingFloat and 3 more (naming-and-style 5.1, ADR-0018; CHG-R10GEN-002)'
      x-ticvai-step-up-reason: Reopening a counted shift is a reversal; a supervisor signs it in place (audit R144).
      x-ticvai-step-up-carrier: body:supervisorStepUp
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, supervisorStepUp]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                supervisorStepUp:
                  allOf:
                    - $ref: '../shared/common.yaml#/components/schemas/SupervisorStepUp'
                  description: >
                    The supervisor signing the reopen on this device (audit R144). Replaces the bare
                    `approverPrincipalId`, which named an approver without proving they were there.
                    May not be the principal who closed the shift.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Reopened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403':
          description: >
            The supervisor is the closing principal (problem type `approver-is-closer`), or the
            step-up failed: the PIN did not verify, or the principal does not hold `SHIFT_REOPEN` at
            this venue (`supervisor-step-up-refused`, audit R144).
          x-ticvai-problem-types:
            - approver-is-closer
            - supervisor-step-up-refused
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          x-ticvai-problem-types: [shift-not-closed, fiscal-period-closed, shift-already-open]
          description: >
            Shift is not closed (problem type `shift-not-closed`), the fiscal period has closed
            over it (`fiscal-period-closed`), or another shift is now open or suspended on the same
            till (`shift-already-open`: the check `openShift` makes on the shift rows, under the same lock,
            so two shifts are never open on one till)
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

