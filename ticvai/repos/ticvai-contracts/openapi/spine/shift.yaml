      summary: Give the reason for a difference within the threshold, and close the shift
      description: >
        **The client's policy for a variance within tolerance** (tracker answer T10.1, 6 October 2026,
        `sources/client/2026-10-06-tracker-answers.md`: "The system should support configurable cash
        variance tolerance. Variances within the permitted threshold may be closed with mandatory reason
        capture. Variances exceeding the threshold should require supervisor/manager approval. All
        variances and approvals must be fully audited and reported."; CHG-R4-019). Until 6 October a
        difference within `shiftVarianceThreshold` closed the shift with no reason at all
        (`CloseShiftRequest.cashierReason` was optional).

        **From `pendingClosure` with `Shift.varianceReasonRequired` true only**: the count found a
        difference within the threshold and no `cashierReason` came with it (`submitShiftCount`,
