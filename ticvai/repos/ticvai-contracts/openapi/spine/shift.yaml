  /shifts/{shiftId}/count:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: submitShiftCount
      x-ticvai-consumed-by:
        - "P04 POS-007 Close Shift"
        - "P06 EMP-009 End shift"
      x-ticvai-read-via:
      - query: finance#fxRateRecords
        route: in-process
        for: 'its read of ledger.fx_rate, Ledger''s data (CHG-MOD-001)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'its read of platform.venue_settings, Tenancy''s data (CHG-MOD-001)'
      - query: tenancy#denominationRecords
        route: in-process
        for: 'what its text calls "platform.denomination": platform.denomination, Tenancy''s data (CHG-R10GEN-001)'
      x-ticvai-audience: [staff]
      summary: The cashier's blind count, closing their own shift
      description: >
        **Blind close: the cashier never sees the expected cash** (decided 2 October 2026, Chinmay;
        CHG-FIN-003; MoM 12 Aug 2026 section 19, DI-271; MoM 9 Sep 2026 4.18, DI-803 to DI-806). The
        cashier counts the drawer by denomination and submits it. The server measures the count against
        the expected figure (opening float + cash takings − cash refunds paid out + float entries −
        lifts and withdrawals, `Shift.liftsTotal`) and records the variance, **and returns neither the
        expected figure nor the variance, nor whether the drawer is over or short**. The receipt says
        only what happens next: `closed` (within the venue's `shiftVarianceThreshold`),
        `referredToSupervisor` (beyond it: the shift is `pendingVariance`) or `awaitingCloseApproval`
        (the venue supervises every close: `pendingClosure`).

        **The variance goes to the supervisor, not the cashier.** Beyond the threshold an alert is
        raised to the supervisors holding OVERSHORT_ACCEPT at the venue, on the venue's alerting
        channel (`tenancy.VenueSettings.alerting`); the shift appears on BO-040 and on the till's
        exceptions list (POS-020) for a supervisor, and the supervisor sees counted, expected and
        variance there (`getShift`, `closeShift`, `acceptShiftVariance`). **The alert itself is read only by
        those it is for** (decided 20 October 2026, Chinmay, R8 blocker cause APPROVALS-TENANCY-C36, option A;
        CHG-R8SPN-020): reporting's `listAlerts` returns a shift-variance alert, with its observed value and
        threshold, only to a caller holding one of the alert rule's recipient roles or OVERSHORT_ACCEPT at the
        venue; any other caller, the shift's own cashier among them, gets no such alert at all (POS-025's
        banner simply shows fewer). The cashier may give a
        reason and a note with the count (`cashierReason`, `notes`; DI-803) without being told the
        amount. **A recount the supervisor asks for** (DI-804) is submitted the same way from
        `pendingVariance`; every count is kept (`CashCountLine`, `countKind` close) and the latest
        is the one measured.

        **The recount after a rejection** (decided 2 October 2026, Chinmay; DEC-175; CHG-CSP-013): once
        `rejectShiftVariance` has set `Shift.recountRequestedAt`, the cashier submits the recount here, at
        any till of the venue, because the till the shift was counted on may be the next cashier's by
        then (DEC-059). The receipt's `countNumber` rises and the request flags clear.

        `Shift.expectedCash` and `Shift.variance` stay null to the shift's own cashier on every read;
        they are returned to a caller holding OVERSHORT_ACCEPT or SHIFT_CLOSE_OTHER at the venue.

        **A difference within the threshold closes only with a reason** (the client's policy, tracker
        answer T10.1 of 6 October 2026, `sources/client/2026-10-06-tracker-answers.md`: "Variances within
        the permitted threshold may be closed with mandatory reason capture"; CHG-R4-019). Where the count
        differs from the expected figure at all, by no more than `shiftVarianceThreshold`, and no
        `cashierReason` came with the count, the shift does not close: it is held in `pendingClosure`, the
        receipt's outcome is `awaitingCloseApproval` with `varianceReasonRequired: true`, and the till asks
        for a reason, which `giveShiftVarianceReason` records and which closes the shift. **The count is
        locked before the reason is asked**, so the close stays blind: the cashier learns only that a
        difference was found, never its amount or whether the drawer is over or short. A count that
        matches exactly closes with no reason; one beyond the threshold goes to the supervisor as before.

        Online only, as `closeShift`: the expected figure is the server's.
      tags: [shift]
      x-ticvai-permission: SHIFT_CLOSE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseShiftRequest' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Count recorded; the receipt says what happens next and nothing about the variance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftCountReceipt' }
        '403':
          description: >
            The shift is not the caller's own (problem type `not-shift-operator`): a supervisor closing
            somebody else's shift uses `closeShift` (SHIFT_CLOSE_OTHER).
          x-ticvai-problem-types: [not-shift-operator]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: >
            The shift is neither `open`, `suspended` nor `pendingVariance` (problem type
            `shift-not-countable`).
          x-ticvai-problem-types: [shift-not-countable]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

