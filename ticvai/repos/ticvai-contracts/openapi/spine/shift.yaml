          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /deposit-boxes/{boxId}/withdraw:
    parameters:
      - name: boxId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: withdrawFromDepositBox
      x-ticvai-consumed-by:
        - "P04 POS-018 Safe Drop & Cash Transfer Management"
        - "P08 BO-042 Banking & Safe"
      x-ticvai-audience: [staff]
      summary: A supervisor takes cash out mid-shift
      description: >
        5.8.8. **A mid-day skim, and it is not a variance.** Cash removed from a till for banking
        must reduce the expected close figure, or every busy cashier ends the day apparently
        short by the amount that was taken from them.

        Two people sign: the supervisor taking it and the cashier it came from.

        **The cashier signs as witness with their own PIN on the same device** (decided 2 October 2026,
        Chinmay, batch 6 #178, BO-042: "PIN on the same device"; DEC-178; CHG-CSP-015). Until then the
        witness was a name the supervisor typed (`witnessPrincipalId` with no credential). The step-up
        below is answered by the witness, not the caller: the PIN must be that of `witnessPrincipalId`,
        or the call is refused `403 witness-not-verified`, and the supervisor may not witness their own
        withdrawal (`403 witness-is-caller`).

        **Recorded as one `CashMovement` of kind `lift`** (F32 step 4: a safe drop "is recorded as
        a movement so the settlement adds up"; 26 September, pull audit R099/R104). The row
        carries this box's `depositBoxId` and `shiftId`, the caller as `authorisedByPrincipalId`,
        the witness, `withdrawalReason` from `reason`, and `note` as its `reason` text. It is the
        box-level form of the same lift `createCashMovement` records — **one withdrawal is one
        movement**, so the expected close figure falls once, and `withdrawnTotal` is the sum of
        the box's lifts.

        **`recordedAt` is the device's time** (offline-and-sync: offline data keeps both
        `recorded_at` and `synced_at`), and `id` is the client UUIDv7 that doubles as the
        idempotency key.

        **The step-up travels in the body** (Chinmay, 3 October 2026, defaults taken; CHG-RUL-019), as on
        `reopenShift` and `rejectShiftVariance`: `witnessStepUp` carries the principal and PIN of the cashier the cash came from (`witnessPrincipalId`), who countersigns, entered on the
        device making this call, verified as `common.yaml` `SupervisorStepUp` says. Optional in the schema so a
        client built at r1 still validates, **refused without it** (`403 supervisor-step-up-refused`). The step-up's
        principal must be `witnessPrincipalId`; it is the witness's PIN, not a supervisor's, so the field is named
        for the witness.
      tags: [shift]
      x-ticvai-permission: CASH_LIFT
      x-ticvai-step-up: pin
      x-ticvai-read-via:
      - query: identity#verifySupervisorStepUp
        route: in-process
        for: 'the PIN step-up in `witnessStepUp` is checked by Identity, never by reading identity.* here (CHG-CRD-004, ADAM CR-078); same deployable (commerce): the C# query interface Identity implements, in the caller''s transaction (ADR-0055 rule 2)'
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'what its text calls "venue''s cashDrawerLimit": platform.venue_settings, Tenancy''s data (CHG-RTE-001)'
      - query: tenancy#denominationRecords
        route: in-process
        for: 'what its text calls "platform.denomination": platform.denomination, Tenancy''s data (CHG-R10GEN-001)'
      - query: tenancy#workstationRecords
        route: in-process
        for: 'what its text calls "tenancy.Workstation.cashDrawerLimit": platform.workstation, Tenancy''s data (CHG-R10GEN-001)'
      x-ticvai-step-up-reason: The cashier the cash came from countersigns the withdrawal with their own PIN on the same device (DEC-178; CHG-CSP-015).
      x-ticvai-step-up-carrier: body:witnessStepUp
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, amount, witnessPrincipalId, recordedAt]
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated UUIDv7 of the `CashMovement` this records.
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                witnessPrincipalId:
                  type: string
                  format: uuid
                  description: The cashier the cash came from. Kept as `CashMovement.witnessPrincipalId`.
                reason: { $ref: '#/components/schemas/WithdrawalReason' }
                note: { type: string, maxLength: 300 }
                recordedAt: { type: string, format: date-time }
                witnessStepUp:
                  allOf:
                    - $ref: '../shared/common.yaml#/components/schemas/SupervisorStepUp'
                  description: >
                    The witnessing cashier's countersignature on this device (CHG-RUL-019): `principalId` is
                    `witnessPrincipalId`, `credential` their PIN. Refused without it (`403
                    supervisor-step-up-refused`). Captured offline, it is verified when the withdrawal syncs.
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Withdrawn, and the expected close figure reduced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositBox' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403':
          description: The caller lacks CASH_LIFT, or the witness's step-up is missing, failed, or is not
            `witnessPrincipalId` (`supervisor-step-up-refused`; CHG-RUL-019).
          x-ticvai-problem-types: [supervisor-step-up-refused]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          x-ticvai-problem-types: [deposit-box-not-open]
          description: >
            The box is being counted or has been counted — `closing`, `closed` or `reconciled`
            (problem type `deposit-box-not-open`). A box being counted takes nothing in or out
            (`states/deposit-box.yaml`).
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /deposit-boxes/close:
    post:
      operationId: closeDepositBoxes
      x-ticvai-consumed-by:
        - "P08 BO-024 Payment Exceptions"
      x-ticvai-read-via:
      - query: finance#fxRateRecords
