      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Adjusted, and recorded against the person who authorised it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositBox' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            The box is being counted or has been counted — `closing`, `closed` or `reconciled`
            (problem type `deposit-box-not-open`). `closing` stops the till taking anything
            (`states/deposit-box.yaml`), and a float changed after the count is a variance nobody
            can explain.
          x-ticvai-problem-types: [deposit-box-not-open]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: >
            The change would leave the float below zero (problem type `float-below-zero`, audit
            R123 (3)).
