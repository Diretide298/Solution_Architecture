          application/json:
            schema:
              type: object
              required: [counts]
              properties:
                boxIds:
                  type: array
                  items: { type: string, format: uuid }
                allOpenAtVenue: { type: boolean }
                counts:
                  type: array
                  description: >
                    One count per box being closed that has traded (audit R123 (4)). Omitting a
                    box that needs one is refused with 422 `deposit-box-count-missing`.
                  items:
                    type: object
                    required: [boxId]
                    properties:
                      boxId: { type: string, format: uuid }
                      countedTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                      countedDenominations: { $ref: '#/components/schemas/DenominationCount' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Closed, with a variance per box
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DepositBox' }
        '422':
          x-ticvai-problem-types: [deposit-box-count-missing]
          description: >
            A box being closed has no entry in `counts`, or its entry has neither a total nor a
            denomination count (problem type `deposit-box-count-missing`, audit R123 (4)).
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

