  /shifts/{shiftId}/reopen:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reopenShift
      x-ticvai-consumed-by:
        - "P04 POS-025 Till Home"
      # The first count is left where the first close wrote it; reopening reads and writes no count line (r8 integration, CHG-R8INT-014; check-parameter-columns P-NAMED-TABLE).
      x-ticvai-names-for-context: [orders.cash_count_line]
      x-ticvai-audience: [staff]
      summary: Reopen a shift closed in error
      description: >
        A cashier who closed the wrong till, or a count submitted before the drawer was
        finished.

        **A reversal, and treated as one.** Requires an approver who is not the person who
        closed it, and the original close is retained — reopening does not erase the first
        count, because the difference between the two counts is the thing worth looking at.

        **The approver is a supervisor giving a step-up on the same device** (decided 28 September,
        audit R144): `supervisorStepUp` carries the supervisor's principal and PIN, entered on the
        till or browser making this call. The rule is `SupervisorStepUp` in `common.yaml`: the PIN is
        verified against the principal, who must hold `SHIFT_REOPEN` at this venue and must not be
        the principal who closed the shift; otherwise a `403` and nothing is written. It does not go
        through the approvals engine.

        **Where the reopen is kept, and what "retained" means** (R8 blocker fix, APPROVALS-TENANCY-C49). The reason,
        the supervisor and the time go in one `orders.pos_shift_approval` row of kind `reopen`
        (`reason`, `principal_id` the supervisor, `at`). The shift's `closed_at`, `closed_by_principal_id`,
        `counted_cash_amount` and `variance_amount` are left as the first close wrote them until the next close
        overwrites them, and the first count stays in `orders.cash_count_line` under its `count_number`; the next
        close adds the next count number. The first close is therefore always readable, from the shift and from
        its count lines.
