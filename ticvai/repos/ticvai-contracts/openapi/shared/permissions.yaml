x-ticvai-module-ai-publish:
  description: >
    **Which permission publishes each module's AI** (Chinmay, 2 October, workbook Q3 and Q7: "the permission holder
    for that module's AI"; CHG-FUP-003, CHG-FUP-004). An operation that publishes a model's output or promotes a
    model declares `x-ticvai-permission-by-module`: the server reads the module of the thing published (a forecast
    definition's or an AI release's `module`) and requires the permission this map names for it, at the
    operation's scope. There is no default role: whoever builds a role ticks a module's "Publish AI model" box.
    `developerApi` and `ai` have no AI models of their own and no entry; a target with no module is refused
    `409 module-required`. Replaces `AI_APPROVE` for model publishing; `AI_APPROVE` keeps the AI governance acts
    (proposals, plans, policies, incidents).
  modules:
    core: CORE_AI_PUBLISH
    ticketing: TICKETING_AI_PUBLISH
    access: ACCESS_AI_PUBLISH
    fnb: FNB_AI_PUBLISH
    retail: RETAIL_AI_PUBLISH
    inventory: INVENTORY_AI_PUBLISH
    seating: SEATING_AI_PUBLISH
    membership: MEMBERSHIP_AI_PUBLISH
    marketing: MARKETING_AI_PUBLISH
    resources: RESOURCES_AI_PUBLISH
    queue: QUEUE_AI_PUBLISH
    transport: TRANSPORT_AI_PUBLISH
    games: GAMES_AI_PUBLISH
    maintenance: MAINTENANCE_AI_PUBLISH
    accreditation: ACCREDITATION_AI_PUBLISH
    partner: PARTNER_AI_PUBLISH
    analytics: ANALYTICS_AI_PUBLISH
x-ticvai-permission-presets:
  description: >
    **Presets fill the checklist; they are not roles** (Chinmay, 2 October, pre-apply round: "default permission
    configs, so to speak ... if they select Viewer they can still give that viewer more permissions and rename
    it"; CHG-CSA-006). Picking a preset for a module ticks its permissions below; every box stays editable and
    the role can be renamed. `all` ticks every permission of the module (`x-ticvai-permission-modules`);
    `viewer` ticks the read permissions; `midLevel` ticks the read permissions and the day-to-day operating
    ones, leaving configuration, approval, publishing, overrides and personal-data exports unticked. So no preset
    but `all` ticks a module's `<MODULE>_AI_PUBLISH`, `BIOMETRIC_IMAGE_VIEW` (a logged view of biometric images,
    ADR-0063), `ACCESS_DIRECTION_SET` or `REPORT_GOVERNANCE_MANAGE` (CHG-FUP-003). The five starting
    configurations of the seed (`docs/active/seed-data-proposal.md` section 2: Cashier, Supervisor, Venue Manager,
    Finance, Tenant Admin) are named presets built the same way: they fill the checklist, every box stays
    editable, and the role is renamed freely (CHG-FUP-012).
