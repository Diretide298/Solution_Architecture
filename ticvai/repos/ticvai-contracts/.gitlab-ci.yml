# GitLab CI (the lead, 20 October 2026, r8 cause FOUNDATION-AI-C37, option A: GitLab CI with shared runners in every
# repository; ADR-0007 amendment). Replaces the GitHub Actions workflows this repository shipped.
# @ticvai/api-client is one package published to the ticvai-frontend group's GitLab npm registry on a v* tag, and
# each frontend repository pins it by exact version.

stages: [check, validate, publish]

bible-check:
  stage: check
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache git >/dev/null
    - test -f project-bible/overview.md || { echo "project-bible missing. Run ./update-bible.sh from the workspace root."; exit 1; }
    - echo "Bible synced at $(cat project-bible/.synced-at 2>/dev/null || echo unknown)"
    # project-bible/ is a copy of ticvai-docs: an edit here is overwritten by the next ./update-bible.sh run,
    # so it is flagged rather than lost.
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if git diff --name-only "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" | grep -q '^project-bible/'; then
        echo "WARNING: project-bible/ was modified. It is a copy of ticvai-docs and will be overwritten on the next sync. Change ticvai-docs instead."
      fi

validate:
  stage: validate
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    GIT_DEPTH: "0"
  script:
    - make lint
    - make bundle
    # Breaking change gate (oasdiff): against the merge request's target branch.
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        BASE_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" PR_LABELS="$CI_MERGE_REQUEST_LABELS" make diff
      fi

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm python3 python3-pip >/dev/null
    - make generate
    # The group's GitLab package registries; the job token authenticates, no inline credentials.
    - echo "@ticvai:registry=${CI_API_V4_URL}/groups/ticvai-frontend/-/packages/npm/" > dist/clients/typescript/.npmrc
    - echo "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> dist/clients/typescript/.npmrc
    - (cd dist/clients/typescript && npm publish)
    - echo "dotnet nuget push Ticvai.Contracts.*.nupkg to the GitLab NuGet registry"
    - echo "twine upload dist/clients/python/* to the GitLab PyPI registry"
