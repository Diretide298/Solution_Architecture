  # ---------------------------------------------------------------- floor
  /outlets/{outletId}/stock-check:
    parameters:
      - name: outletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOutletStock
      x-ticvai-consumed-by:
        - "P08 BO-044 F&B Outlets"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: primary
      summary: Stock across an outlet
      description: >
        Shaped for a handheld on a shop floor — low stock first, with sibling outlet
        availability so a colleague can be sent rather than the sale lost.
      tags: [floor]
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: lowStockFirst
          in: query
          schema: { type: boolean, default: true }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Stock
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OutletStockLine' }

  /shop-and-drop:
    post:
      operationId: createShopAndDrop
      x-ticvai-audience: [staff]
      summary: Buy now, collect on the way out
      description: >
        4.4.7 — a guest buys in store and leaves the goods behind rather than carrying them
        round a venue all day. The purchase is **linked to their entitlement**, which is what
        makes collection possible without a receipt: the ticket they are already carrying is
        the claim.

        The goods leave stock at purchase, not at collection. They are sold; they are merely
        somewhere else.

        Not a reservation. `reserveMerchandise` holds unsold stock for someone who has not
        paid; this is paid goods awaiting handover, and conflating the two produces a stock
        figure nobody can explain.
      tags: [floor]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, saleId, collectionPointId, recordedAt]
              properties:
                id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                saleId: { type: string }
                entitlementId:
                  type: string
                  nullable: true
                  description: >
                    The guest's ticket. Scanned at collection instead of a receipt — the
                    thing they cannot leave without is the thing that claims their shopping.
                collectionPointId: { type: string, format: uuid }
                lineIds:
                  type: array
                  description: Omit to drop the whole sale.
                  items: { type: string }
                collectBy:
                  type: string
                  format: date-time
                  description: >
                    Usually venue close. Uncollected goods after it become an exception, not
                    a permanent shelf occupant.
                recordedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Dropped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopAndDrop' }
        '409':
          description: >
            Sale already dropped, an item is non-droppable — chilled, fragile, oversized — or
            the collection point is closed before `collectBy`.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shop-and-drop/lookup:
    get:
      operationId: lookupShopAndDrop
      x-ticvai-consumed-by:
        - "P01 WEB-042 Retail & Shop and Drop"
        - "P02 GST-062 Shop & Drop Collection"
        - "P05 KSK-011 Collect a booking"
      x-ticvai-audience: [staff, guest]
      summary: Find a guest's dropped goods
      description: >
        Scanned at the collection point. Accepts the entitlement, the drop reference, or the
        original receipt — a guest arrives with whichever they still have.
      tags: [floor]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
        - name: entitlementId
          in: query
          schema: { type: string }
        - name: dropReference
          in: query
          schema: { type: string }
        - name: receiptNumber
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Awaiting collection
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ShopAndDrop' }
        '400':
          description: No identifier supplied
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shop-and-drop/{dropId}/collect:
    parameters:
      - name: dropId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: collectShopAndDrop
      x-ticvai-audience: [staff]
      summary: Hand the goods over
      description: >
        Records who handed over and against what. Partial collection is permitted — a guest
        may take some and leave the rest for a later trip on the same ticket.
      tags: [floor]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordedAt]
              properties:
                lineIds:
                  type: array
                  items: { type: string }
                verifiedBy:
                  type: string
                  enum: [entitlementScan, receipt, dropReference, staffOverride]
                note: { type: string, maxLength: 500 }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: Collected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopAndDrop' }
        '409':
          description: Already collected, or past the collection deadline
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /outlets/{outletId}/reserve:
    parameters:
      - name: outletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reserveMerchandise
      x-ticvai-consumed-by:
        - "P01 WEB-033 Shop"
        - "P01 WEB-042 Retail & Shop and Drop"
        - "P02 GST-026 Retail / Merchandise"
        - "P04 POS-012 Omnichannel Order & Fulfilment Center"
        - "P05 KSK-017 Shop"
        - "P06 EMP-068 Reservation, Allocation & Omnichannel Inventory"
        - "P08 BO-044 F&B Outlets"
      x-ticvai-audience: [staff, guest]
      summary: Reserve an item for collection
      description: >
        A guest who cannot carry a purchase around a venue collects it on the way out. The
        item is allocated but not sold, and the reservation expires.
      tags: [floor]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, lines, expiresAt]
              properties:
                id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                subjectId: { type: string, format: uuid }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [merchandiseId, quantity]
                    properties:
                      merchandiseId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                expiresAt: { type: string, format: date-time }
                collectionNote: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchandiseReservation' }
        '409':
          description: Insufficient stock
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/StockConflictProblem' }

  /store-rules:
    get:
      operationId: listStoreRules
      x-ticvai-consumed-by:
        - "P08 BO-142 Store Rules, Controls & Permissions"
      x-ticvai-audience:
      - staff
      summary: Rules and controls in force in the store
      description: '**Drafted 4 September as a stub.** BO-142 *Store Rules, Controls & Permissions* had nothing of its own, so wiring `listRoles` onto BO-106 on 4 September made the two screens identical. **The collision was a symptom** - BO-142 needs store rules and there were none to give it. The screen that needs it existed and this operation did not, so the screen shared a generic set with its neighbours and read as a duplicate of them. **The shape below is a proposal**: the fields are the minimum the screen has to show, and the request and response want confirming before anything is built against them.

        '
      tags:
      - retail
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - $ref: '../shared/common.yaml#/components/parameters/PageSize'
      - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Rules and controls in force in the store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreRule'
    put:
      operationId: setStoreRules
      x-ticvai-consumed-by:
        - "P08 BO-142 Store Rules, Controls & Permissions"
      x-ticvai-audience:
      - staff
      summary: Change a store rule
      description: '**Drafted 4 September as a stub.** **A control that stops a discount is also a control that stops a sale**, so the write is separately permissioned from the read. The screen that needs it existed and this operation did not, so the screen shared a generic set with its neighbours and read as a duplicate of them. **The shape below is a proposal**: the fields are the minimum the screen has to show, and the request and response want confirming before anything is built against them.

        '
      tags:
      - retail
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRule'
      responses:
        '200':
          description: Change a store rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreRule'
components:
  schemas:
    StoreRule:
      type: object
      x-ticvai-persistence: retail.store_rule
      description: '**Drafted 4 September.** One rule or control in force in a store - a discount
        limit, a refund threshold, an age check, a manager override. **A row rather than a config
        value** because somebody has to be able to say who changed a limit and when.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - discountLimit
          - refundThreshold
          - ageCheck
          - managerOverride
          - priceOverride
        thresholdMinor:
          type: integer
        requiresPermission:
          type: string
          description: The permission a person needs to act past this rule.
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    MerchandiseItem:
      x-ticvai-persistence: "retail.merchandise"
      type: object
      required: [id, sku, name, outletId, variantId, price, onHand, isActive]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        outletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        variantId:
          type: string
          format: uuid
          description: The catalogue variant sold. Price and tax come from there.
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
          description: >
            The stock item depleted on sale. Null means the item sells but never runs out,
            which is almost always a configuration error.
        price: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        onHand: { type: number }
        isReturnable: { type: boolean, default: true }
        returnWindowDays: { type: integer, nullable: true }
        requiresSerialNumber: { type: boolean, default: false }
        imageAssetRef: { type: string, nullable: true }
        isActive: { type: boolean }

    CreateMerchandiseRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [sku, name, outletId, variantId]
      properties:
        sku: { type: string, maxLength: 64 }
        barcode: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 200 }
        outletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        inventoryItemId: { type: string, format: uuid }
        isReturnable: { type: boolean, default: true }
        returnWindowDays: { type: integer }
        requiresSerialNumber: { type: boolean, default: false }
        imageAssetRef: { type: string }

    PriceCheck:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [merchandiseId, name, listPrice, effectivePrice, onHand]
      properties:
        merchandiseId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        listPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        effectivePrice:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: After any live promotion.
        appliedPromotionCode: { type: string, nullable: true }
        onHand: { type: number }
        isAvailable: { type: boolean }
        siblingOutlets:
          type: array
          description: Stock elsewhere in the venue, so a colleague can be sent.
          items:
            type: object
            properties:
              outletId: { type: string, format: uuid }
              outletName: { type: string }
              onHand: { type: number }

    CreateRetailSaleLine:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, merchandiseId, quantity]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        merchandiseId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        serialNumbers:
          type: array
          items: { type: string }
          description: Required where the item is serialised. One per unit.
        overridePrice:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Manual price override. Requires PRICE_OVERRIDE and records a reason.
        overrideReason: { type: string, maxLength: 200 }

    CreateRetailSaleRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, outletId, lines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        outletId: { type: string, format: uuid }
        shiftId: { type: string }
        subjectId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateRetailSaleLine' }
        couponCodes:
          type: array
          items: { type: string }
        recordedAt: { type: string, format: date-time }

    RetailSale:
      x-ticvai-persistence: "retail.sale + retail.sale_line"
      type: object
      required: [id, receiptNumber, orderId, outletId, lines, grossAmount, createdAt]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        orderId:
          type: string
          description: The order in the Order & Payment context. Retail does not keep its own ledger.
        outletId: { type: string, format: uuid }
        shiftId: { type: string, nullable: true }
        subjectId: { type: string, format: uuid, nullable: true }
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string }
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              discount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              lineTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              serialNumbers:
                type: array
                items: { type: string }
              returnedQuantity: { type: integer }
              isReturnable:
                type: boolean
                description: False once the window has passed or the line is fully returned.
              notReturnableReason: { type: string, nullable: true }
        subtotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        discountAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        reprintCount: { type: integer }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    StockConflictProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            lines:
              type: array
              items:
                type: object
                properties:
                  merchandiseId: { type: string, format: uuid }
                  name: { type: string }
                  requested: { type: number }
                  available: { type: number }
                  siblingOutletsWithStock:
                    type: array
                    items:
                      type: object
                      properties:
                        outletId: { type: string, format: uuid }
                        outletName: { type: string }
                        onHand: { type: number }

    ReturnCondition:
      type: string
      description: Determines whether stock is restored or written off.
      enum: [resaleable, opened, damaged, faulty, missingParts]

    ReturnReason:
      type: string
      enum: [changedMind, wrongSize, wrongItem, faulty, damagedInTransit, duplicatePurchase, giftReturn, other]

    CreateRetailReturnRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, saleId, lines, reason, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        saleId: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, quantity, condition]
            properties:
              lineId: { type: string }
              quantity: { type: integer, minimum: 1 }
              condition: { $ref: '#/components/schemas/ReturnCondition' }
              serialNumbers:
                type: array
                items: { type: string }
              note: { type: string, maxLength: 200 }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        refundTender:
          type: string
          description: >
            Defaults to the original tender. Cash refunds against a card sale usually need
            approval, per the outlet's return policy.
        secondaryAuthorisation:
          type: object
          description: Required above the outlet's self-authorise limit.
          properties:
            principalId: { type: string, format: uuid }
            credential: { type: string }
        recordedAt: { type: string, format: date-time }

    RetailReturn:
      x-ticvai-persistence: "retail.return + retail.return_line"
      type: object
      required: [id, saleId, lines, refundAmount, restockedQuantity, writtenOffQuantity, createdAt]
      properties:
        id: { type: string }
        returnNumber: { type: string }
        saleId: { type: string }
        refundId:
          type: string
          nullable: true
          description: The refund raised in the Order & Payment context.
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string }
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              condition: { $ref: '#/components/schemas/ReturnCondition' }
              wasRestocked:
                type: boolean
                description: >
                  False for opened, damaged or faulty goods, which are written off with a
                  reason rather than silently absent.
              refundAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        refundAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundTender: { type: string }
        restockedQuantity: { type: integer }
        writtenOffQuantity: { type: integer }
        acceptedByPrincipalId: { type: string, format: uuid }
        secondaryPrincipalId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    ReturnPolicyProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            refusedReason:
              type: string
              enum:
                - outsideReturnWindow
                - itemNotReturnable
                - alreadyReturned
                - requiresSecondUser
                - requiresApproval
                - receiptRequired
                - serialNumberMismatch
            windowDays: { type: integer }
            daysSincePurchase: { type: integer }
            threshold: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    ReturnPolicy:
      x-ticvai-persistence: "retail.return_policy"
      type: object
      required: [outletId, defaultWindowDays, requiresReceipt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        outletId: { type: string, format: uuid }
        defaultWindowDays: { type: integer, minimum: 0 }
        requiresReceipt: { type: boolean, default: true }
        allowCashRefundOnCardSale: { type: boolean, default: false }
        selfAuthoriseLimit:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Up to this, one cashier may accept a return alone.
        requiresSecondUserAbove: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        requiresApprovalAbove: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        restockableConditions:
          type: array
          description: Conditions that return stock to sale. Everything else is written off.
          items: { $ref: '#/components/schemas/ReturnCondition' }
        nonReturnableCategoryIds:
          type: array
          items: { type: string, format: uuid }

    CreateExchangeRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, saleId, returnLines, replacementLines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        saleId: { type: string }
        returnLines:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineId, quantity, condition]
            properties:
              lineId: { type: string }
              quantity: { type: integer, minimum: 1 }
              condition: { $ref: '#/components/schemas/ReturnCondition' }
        replacementLines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateRetailSaleLine' }
        recordedAt: { type: string, format: date-time }

    RetailExchange:
      x-ticvai-persistence: "retail.exchange"
      type: object
      required: [id, saleId, returnId, newSaleId, difference]
      properties:
        id: { type: string }
        saleId: { type: string }
        returnId: { type: string }
        newSaleId: { type: string }
        returnedValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        replacementValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        difference:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Positive means the guest pays; negative means a refund is due. Only the
            difference settles.
        createdAt: { type: string, format: date-time }






    OutletStockLine:
      x-ticvai-persistence: "none — projection over inventory"
      type: object
      required: [merchandiseId, name, onHand, isBelowReorderPoint]
      properties:
        merchandiseId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        categoryName: { type: string, nullable: true }
        onHand: { type: number }
        allocated:
          type: number
          description: Held by an unexpired collection reservation.
        available: { type: number }
        isBelowReorderPoint: { type: boolean }
        lastSoldAt: { type: string, format: date-time, nullable: true }

    ShopAndDrop:
      type: object
      x-ticvai-persistence: "retail.shop_and_drop + retail.shop_and_drop_line"
      required: [id, dropReference, saleId, collectionPointId, status, collectBy]
      properties:
        id: { type: string }
        dropReference:
          type: string
          description: Short and readable. Printed on the slip a guest may or may not keep.
        saleId: { type: string }
        entitlementId:
          type: string
          nullable: true
          description: >
            The ticket that claims these goods. The point of 4.4.7 — a guest does not have to
            keep a receipt safe for eight hours in a water park.
        subjectId: { type: string, format: uuid, nullable: true }
        collectionPointId: { type: string, format: uuid }
        collectionPointName: { type: string }
        status:
          type: string
          enum: [awaitingCollection, partiallyCollected, collected, uncollected, disposed]
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: { type: string }
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              collectedQuantity: { type: integer }
        droppedAt: { type: string, format: date-time }
        collectBy: { type: string, format: date-time }
        collectedAt: { type: string, format: date-time, nullable: true }
        collectedByPrincipalId: { type: string, format: uuid, nullable: true }
        verifiedBy: { type: string, nullable: true }

    MerchandiseReservation:
      x-ticvai-persistence: "retail.reservation + retail.reservation_line"
      type: object
      required: [id, outletId, lines, status, expiresAt]
      properties:
        id: { type: string }
        reservationNumber: { type: string }
        outletId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        lines:
          type: array
          items:
            type: object
            properties:
              merchandiseId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
        status:
          type: string
          enum: [reserved, collected, expired, cancelled]
        collectionNote: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        collectedAt: { type: string, format: date-time, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
