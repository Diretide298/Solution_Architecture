  /media-usage:
    get:
      operationId: getMediaUsageAnalytics
      x-ticvai-consumed-by:
        - "P13 CMS-061 Digital Asset Management Command Center"
        - "P13 CMS-070 Asset Activity, Recent Assets & Library Health"
        - "P13 CMS-071 AI Asset Intelligence Command Center"
        - "P13 CMS-080 AI Quality, Intelligence Review & Recommendations"
        - "P13 CMS-081 DAM Governance & Rights Command Center"
        - "P13 CMS-098 Delivery Monitoring & Integration Health"
        - "P13 CMS-099 Asset Usage & Performance Analytics"
        - "P13 CMS-100 Distribution Intelligence, AI Insights & Optimization"
      summary: Downloads, views, shares and library health
      description: 'Boards 1.10 and 4.9. **Storage used and assets never used are the two numbers that
        justify a DAM.** A library that only grows is a cost; one that can show which assets earn their
        keep is an asset itself.

        '
      tags:
