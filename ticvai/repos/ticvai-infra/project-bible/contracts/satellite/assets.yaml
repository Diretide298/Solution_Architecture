components:
  schemas:
    MediaTaxonomy:
      type: object
      x-ticvai-persistence: assets.taxonomy
      description: 'Boards 1.5 and 1.6. **Metadata fields are per asset type**, because an image has
        dimensions and a contract has an expiry.

        '
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              parentCategoryId:
                type: string
                format: uuid
                nullable: true
              applicableAssetTypes:
                type: array
                items:
                  type: string
        fields:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              label:
                type: string
              dataType:
                type: string
              applicableAssetTypes:
                type: array
                items:
                  type: string
              mandatory:
                type: boolean
              allowedValues:
                type: array
                items:
                  type: string
        keywordVocabularies:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              terms:
                type: array
                items:
                  type: string
              closed:
                type: boolean
                default: false
                description: '**A closed vocabulary refuses terms not in the list.** Open vocabularies
                  are how a library ends up with `logo`, `logos`, `Logo` and `brand-logo`.

                  '
        scopePath:
          type: string
    MediaTag:
      type: object
      x-ticvai-persistence: assets.tag
      description: 'Board 2.2. **A tag carries its origin and confidence**, so machine labels can be
        filtered without being deleted.

        '
      required:
      - value
      properties:
        value:
          type: string
        vocabulary:
          type: string
          nullable: true
        source:
          type: string
          enum:
          - human
          - autoTag
          - import
          - inherited
          default: human
        confidence:
          type: number
          nullable: true
        accepted:
          type: boolean
          default: true
          description: A proposed auto-tag below the promotion threshold sits here as false.
        addedBy:
          type: string
          format: uuid
          nullable: true
        addedAt:
          type: string
          format: date-time
        scopePath:
          type: string
    MediaSimilarity:
      type: object
      description: 'Boards 2.4 and 2.5. **Duplicate and related are one score at two thresholds.**'
      properties:
        assetId:
          type: string
          format: uuid
        similarity:
          type: number
        relation:
          type: string
          enum:
          - exactDuplicate
          - nearDuplicate
          - variant
          - related
        differingFields:
          type: array
          items:
            type: string
    MediaAssetVersion:
      type: object
      x-ticvai-persistence: assets.asset_version
      description: 'Boards 2.6 and 2.7. **Usage impact belongs to the version read**, because replacing a
        logo is routine or an incident depending on where it appears.

        '
      properties:
        assetId:
          type: string
          format: uuid
        version:
          type: integer
        fileName:
          type: string
        sizeBytes:
          type: integer
        checksum:
          type: string
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        isCurrent:
          type: boolean
        usageImpact:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              surface:
                type: string
                enum:
                - campaign
                - journey
                - ticketTemplate
                - screen
                - publishedPage
                - product
                - signage
              referenceId:
                type: string
                format: uuid
              label:
                type: string
              live:
                type: boolean
        scopePath:
          type: string
    MediaRendition:
      type: object
      x-ticvai-persistence: assets.rendition
      description: 'Boards 2.8 and 2.9. **Readiness is the fact that matters**, not existence.'
      required:
      - preset
      properties:
        id:
          type: string
          format: uuid
        preset:
          type: string
          description: 'e.g. `thumbnail`, `web1600`, `printCmyk`, `hls720`.'
        format:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - queued
          - processing
          - ready
          - failed
        failureReason:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        scopePath:
          type: string
    MediaAssetApproval:
      type: object
      x-ticvai-persistence: assets.approval
      description: 'Boards 3.4 and 3.5. **Publication eligibility is computed from four facts.**'
      properties:
        assetId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - draft
          - pendingApproval
          - approved
          - rejected
          - published
          - archived
        eligibility:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              check:
                type: string
                enum:
                - approved
                - rightsCurrent
                - renditionsReady
                - classificationComplete
              satisfied:
                type: boolean
              detail:
                type: string
                nullable: true
        approvedBy:
          type: string
          format: uuid
          nullable: true
        comment:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
        scopePath:
          type: string
    MediaShare:
      type: object
      x-ticvai-persistence: assets.share
      description: 'Board 3.7. **A licence grant with a link attached** — revocable, expiring and logged.'
      required:
      - assetIds
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        assetIds:
          type: array
          items:
            type: string
            format: uuid
        recipientEmail:
          type: string
          nullable: true
        recipientOrganisation:
          type: string
          nullable: true
        allowDownload:
          type: boolean
          default: false
        allowedRenditions:
          type: array
          items:
            type: string
        passwordProtected:
          type: boolean
          default: false
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          readOnly: true
        openedCount:
          type: integer
          readOnly: true
        scopePath:
          type: string
    MediaDistribution:
      type: object
      description: 'Boards 4.2 and 4.5. **The usage map that makes replacement safe.**'
      properties:
        assetId:
          type: string
          format: uuid
        deliveryUrls:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
              rendition:
                type: string
              url:
                type: string
              cdn:
                type: string
                nullable: true
        usedBy:
          type: array
          items:
            type: object
            properties:
              surface:
                type: string
              referenceId:
                type: string
                format: uuid
              label:
                type: string
              live:
                type: boolean
        lastDeliveredAt:
          type: string
          format: date-time
          nullable: true
    MediaDistributionChannel:
      type: object
      x-ticvai-persistence: assets.distribution_channel
      description: 'Boards 4.3, 4.4 and 4.6. **The fallback keeps a page from breaking.**'
      required:
      - code
      properties:
        code:
          type: string
        name:
          type: string
        cdnBaseUrl:
          type: string
          nullable: true
        signedUrls:
          type: boolean
          default: false
        signedUrlTtlSeconds:
          type: integer
          nullable: true
        defaultRendition:
          type: string
          nullable: true
        fallbackAssetId:
          type: string
          format: uuid
          nullable: true
          description: '**What renders when the real one cannot.** Rights expired, rendition failed, CDN
            unreachable — three causes, one visible outcome, and one place to decide it.

            '
        onRightsExpiry:
          type: string
          enum:
          - serveFallback
          - serveNothing
          - continueServing
          default: serveFallback
        scopePath:
          type: string
    MediaUsageRow:
      type: object
      description: 'Boards 1.10 and 4.9. **Assets never used is the number that justifies the library.**'
      properties:
        key:
          type: string
        label:
          type: string
        assetCount:
          type: integer
        storageBytes:
          type: integer
        downloads:
          type: integer
        views:
          type: integer
        shares:
          type: integer
        neverUsedCount:
          type: integer
        unclassifiedCount:
          type: integer
    MediaAuditRecord:
      type: object
      x-ticvai-persistence: assets.audit
      description: 'Board 3.9. **Distribution as well as edits** — the question asked afterwards is who
        had it.

        '
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        action:
          type: string
          enum:
          - uploaded
          - updated
          - retagged
          - versioned
          - approved
          - published
          - shared
          - downloaded
          - delivered
          - archived
          - deleted
        actorId:
          type: string
          format: uuid
          nullable: true
        recipient:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        scopePath:
          type: string
    LocalisedText:
      x-ticvai-persistence: "none — jsonb column"
      type: object
      additionalProperties: { type: string }

    MediaKind:
      type: string
      enum: [image, video, audio, document, vector, font, archive]

    MediaStatus:
      type: string
      enum: [processing, ready, quarantined, failed, archived]

    MediaRights:
      x-ticvai-persistence: "none — embedded in asset"
      type: object
      description: >
        Licensing terms. Tracked because an expired licence on a live surface is a legal
        exposure, not a housekeeping item.
      properties:
        licenceKind:
          type: string
          enum: [owned, royaltyFree, rightsManaged, creativeCommons, editorialOnly, unknown]
        licensor: { type: string, nullable: true }
        licenceReference: { type: string, nullable: true }
        validFrom: { type: string, format: date, nullable: true }
        validTo: { type: string, format: date, nullable: true }
        permittedUses:
          type: array
          items:
            type: string
            enum: [web, print, socialMedia, inVenue, advertising, internal]
        attributionRequired: { type: boolean, default: false }
        attributionText: { type: string, nullable: true }
        # Added 19 September, from DAM board 3.3. The shape above tracked *what the
        # licence is*; these four say *where it may go and who has to renew it*, which is
        # what `setMediaAssetRights` and the distribution fallback need.
        permittedTerritories:
          type: array
          items: { type: string }
          description: >
            ISO country or region codes. **Empty means unrestricted, which is a claim
            rather than an absence** — an unknown territory and a worldwide licence are
            not the same thing, and `licenceKind: unknown` is how the second is said.
        permittedChannels:
          type: array
          items: { type: string }
          description: >
            Distribution channel codes, checked by `setMediaDistributionChannels`.
            Narrower than `permittedUses`, which describes the medium rather than the
            route.
        modelReleaseHeld: { type: boolean, default: false }
        # **A photograph of an identifiable person without a release is a legal exposure**,
        # and the DAM is the only place that fact can sit next to the file.
        renewalOwner: { type: string, format: uuid, nullable: true }
        # `getExpiringRights` could always find the expiry and never say whose problem it
        # was, so the list went to everybody and therefore to nobody.

    MediaAsset:
      x-ticvai-persistence: "assets.media_asset"
      type: object
      required: [id, kind, status, filename, contentType, sizeBytes, referenceCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MediaKind' }
        status: { $ref: '#/components/schemas/MediaStatus' }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        title: { $ref: '#/components/schemas/LocalisedText' }
        altText:
          allOf:
            - $ref: '#/components/schemas/LocalisedText'
          description: Required before use in a guest-facing surface. WCAG 2.2 AA.
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        durationSeconds: { type: number, nullable: true }
        customMetadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            BL-178. **`assets` is a strong contract and its metadata was fixed** — kind, title, alt
            text, dimensions, rights. A venue photographing four thousand products wants its own
            fields: shoot date, photographer, model release, season.

            **Free-form and searchable, not a schema.** Every venue would want a different one, and
            a fixed set would be wrong for all of them.
        sharedWithTenantIds:
          type: array
          items: { type: string, format: uuid }
          description: >
            BL-178. **Cross-tenant sharing, and it is refused by default for a reason.** A brand
            operating three venues wants one logo library; two unrelated tenants sharing an asset
            store is the isolation breach ADR-0011 exists to prevent.

            **Only within one tenant's own scope tree.** A share naming a tenant outside it is
            refused rather than warned about — this is the one place where a permissive default
            would be a cross-tenant data leak.
        tags:
          type: array
          items: { type: string }
        venueId: { type: string, format: uuid, nullable: true }
        url:
