      responses:
        '200':
          description: Usage and delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDistribution'
  /media-distribution/channels:
    put:
      operationId: setMediaDistributionChannels
      x-ticvai-consumed-by:
        - "P13 CMS-093 Channel & Distribution Configuration"
        - "P13 CMS-094 Secure Delivery URL, CDN & Rendition Delivery"
        - "P13 CMS-096 Fallback, Expiry & Distribution Continuity"
      summary: CDN, delivery URLs, fallbacks and expiry behaviour
      description: 'Boards 4.3, 4.4 and 4.6. **The fallback is the part that keeps a page from breaking.**
        An asset whose rights expired, whose rendition failed or whose CDN is unreachable still has to
        render something, and deciding that at delivery time per channel is the only place it can be
        decided once.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaDistributionChannel'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDistributionChannel'
  /media-assets/bulk:
    post:
      operationId: bulkUpdateMediaAssets
      x-ticvai-consumed-by:
        - "P13 CMS-069 Bulk Asset Management Workspace"
      summary: Retag, reclassify, move or archive many assets at once
      description: 'Board 1.9. **The operation a library of 128 unclassified assets actually needs.**
        Doing it one at a time is why they are unclassified.

        Previewed before it is applied, because a bulk retag that matched the wrong filter is not
        undoable by hand.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assetIds
              properties:
                assetIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                mode:
