                $ref: '#/components/schemas/MediaRendition'
  /media-assets/{assetId}/rights:
    parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setMediaAssetRights
      x-ticvai-consumed-by:
        - "P13 CMS-083 Rights, License & Usage Policy Management"
        - "P13 CMS-088 Rights Expiry, Renewal & Usage Impact"
      summary: Licence, permitted use and expiry
      description: 'Boards 3.3 and 3.8. **`getExpiringRights` existed and nothing set them.** A licence
        with a territory, a channel restriction and an end date is the difference between a photograph
        the venue may use and one it may not, and an expiry nobody recorded is an expiry nobody honours.

        **Expiry blocks distribution rather than deleting the asset.** The photograph is still evidence
        of what was published; it is simply no longer publishable.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRights'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRights'
  /media-assets/{assetId}/approval:
    parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: setMediaAssetApproval
      x-ticvai-consumed-by:
        - "P13 CMS-084 Asset Approval Workflow Management"
        - "P13 CMS-085 Publication Eligibility & Governance Validation"
      summary: Submit, approve, reject or publish an asset
      description: 'Boards 3.4 and 3.5. **Publication eligibility is computed, not asserted.** An asset
        is publishable when it is approved, its rights are current, its renditions exist and its
        classification is complete — four facts that live in four places, and a boolean somebody ticked
        goes stale the moment any of them changes.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_APPROVE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - draft
                  - pendingApproval
                  - approved
                  - rejected
                  - published
                  - archived
                comment:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetApproval'
        '409':
          description: Not eligible to publish; the unmet conditions are listed
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /media-shares:
    post:
      operationId: createMediaShare
      x-ticvai-consumed-by:
        - "P13 CMS-087 Secure Internal & External Sharing"
      summary: Share assets with somebody outside the platform, on terms
      description: 'Board 3.7. **An external share is a licence grant with a link attached**, so it
        expires, it can be revoked, it records who opened it and it can refuse download while permitting
        view. A share that is just a URL is an asset that has left the building permanently.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_SHARE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaShare'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaShare'
  /media-distribution:
