      operationId: getMediaDistribution
      x-ticvai-consumed-by:
        - "P13 CMS-068 Digital Asset 360° Profile"
        - "P13 CMS-091 Asset Distribution & Delivery Command Center"
        - "P13 CMS-092 Asset Usage & Distribution Map"
        - "P13 CMS-095 Asset Replacement & Propagation Management"
        - "P13 CMS-097 DAM API & Integration Hub"
      summary: Where an asset is used and how it is delivered
      description: 'Boards 4.2 and 4.5. **The usage map is what makes replacement safe.** Board 4.5 is
        *asset replacement and propagation*, which is only possible if the platform knows every place the
        old one appears.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: assetId
