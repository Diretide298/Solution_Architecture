openapi: 3.1.0
info:
  title: TICVAI Digital Media Library
  version: 0.1.0
  x-ticvai-screen-count: 26
  x-ticvai-tier: satellite
  x-ticvai-module: "23 — Digital Asset Management"
  x-ticvai-requirements: 15
  x-ticvai-capabilities: [C77]
  x-ticvai-platforms:
    - "P08 Venue Management"
    - "P13 Venue CMS"
    - "P02 Guest App"
    - "P01 Guest Web"
  description: >
    ## What this contract covers

    **The single library every image, video and document is referenced from.**

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Matrix domain** | 23 — Digital Asset Management |
    | **Requirements** | ~15 |
    | **Capabilities** | C77 |
    | **Consumed by** | P08 Venue Management · P13 Venue CMS · P02 Guest App · P01 Guest Web |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not: `x-ticvai-permission`, `x-ticvai-scope-level`,
    `x-ticvai-offline-capable`, `x-ticvai-conflict-policy`.

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. Roughly 70% of the DDL derives from these; the rest — partitioning,
    RLS, the PII split — is storage design that lives in the migration scripts.

    ## This context

    Every `assetRef` appearing anywhere else in the platform — banners, product images,
    splash screens, work-order photographs, incident evidence — resolves here.

    **Named media, not assets.** `maintenance` owns `asset` — a ride, a chiller, a vehicle.
    In a venue "asset" means physical plant, and two contracts both claiming `/assets` with
    the same operation ids is a codegen collision waiting to happen. This one is `/media`.

    Positions this encodes:

    - **Assets are referenced, never embedded.** A contract carries `assetRef`, and this
      library resolves it to URLs. An image duplicated across three modules is three images
      to update when the brand changes.
    - **Deletion is refused while an asset is in use.** The reference count is maintained as
      assets are attached, so a marketing manager cannot delete the image on a live
      homepage.
    - **Rights and licensing expiry are tracked.** A stock photograph licensed for one
      season and still on a website two years later is a legal problem, not an oversight.
    - **Derivatives are generated, not uploaded.** Thumbnails and responsive sizes come from
      the original, so a new breakpoint is a re-render rather than a re-upload of everything.
    - Uploads go direct to object storage through a signed URL. Large media never passes
      through the API.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: asset
  - name: upload
  - name: collection
  - name: rights

paths:
  /media:
    get:
      operationId: searchMedia
      x-ticvai-consumed-by:
        - "P08 BO-838 Content, Media & Forms"
        - "P13 CMS-010 Media Library"
        - "P13 CMS-061 Digital Asset Management Command Center"
        - "P13 CMS-062 Central Digital Asset Library"
        - "P13 CMS-067 Advanced Search & Discovery"
        - "P13 CMS-073 Semantic & Natural-Language Asset Search"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Search the asset library
      description: >
        Filter by kind, tag, collection, venue or usage. `unusedOnly` surfaces assets nothing
        references — the working set for a library clear-out.
      tags: [asset]
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/MediaKind' }
        - name: tag
          in: query
          schema: { type: string }
        - name: collectionId
          in: query
          schema: { type: string, format: uuid }
        - name: venueId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Matches filename, title, description and tags.
          schema: { type: string }
        - name: unusedOnly
          in: query
          schema: { type: boolean, default: false }
        - name: rightsExpiringWithinDays
          in: query
          schema: { type: integer }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Assets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MediaAsset' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMediaAsset
      x-ticvai-consumed-by:
        - "P04 POS-010 Add to Existing Ticket"
        - "P06 EMP-036 Issue media"
        - "P08 BO-027 Reissue & Media Replacement"
        - "P13 CMS-010 Media Library"
        - "P13 CMS-068 Digital Asset 360° Profile"
        - "P13 CMS-082 Asset Ownership & Responsibility Management"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read an asset with derivatives and usage
      description: >
        Returns every generated size and every place the asset is referenced. Usage is what
        makes deletion safe to refuse and impact visible before a replacement.
      tags: [asset]
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-offline-note: >
        24 August: The asset is on the device before the shift; a media issue with no artwork is a
         blank card.
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAssetDetail' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateMediaAsset
      x-ticvai-consumed-by:
        - "P13 CMS-010 Media Library"
        - "P13 CMS-082 Asset Ownership & Responsibility Management"
      x-ticvai-audience: [staff]
      summary: Amend metadata, tags or rights
      tags: [asset]
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { $ref: '#/components/schemas/LocalisedText' }
                description: { $ref: '#/components/schemas/LocalisedText' }
                altText:
                  allOf:
                    - $ref: '#/components/schemas/LocalisedText'
                  description: >
                    Accessibility text. Required before an asset may be used in a
                    guest-facing surface — WCAG 2.2 AA is a stated target.
                tags:
                  type: array
                  items: { type: string }
                collectionIds:
                  type: array
                  items: { type: string, format: uuid }
                rights: { $ref: '#/components/schemas/MediaRights' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }

    delete:
      operationId: deleteMediaAsset
      x-ticvai-consumed-by:
        - "P13 CMS-010 Media Library"
        - "P13 CMS-075 Duplicate & Near-Duplicate Management"
      x-ticvai-audience: [staff]
      summary: Delete an asset
      description: >
        **Refused while the asset is referenced.** The response names every reference so the
        holder can be cleared first — deleting the image on a live homepage should not be one
        keystroke away.
      tags: [asset]
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '409':
          description: Asset is in use. Every reference is listed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/MediaInUseProblem' }

  /media/{mediaId}/replace:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: replaceMediaAsset
      x-ticvai-consumed-by:
        - "P08 BO-027 Reissue & Media Replacement"
        - "P13 CMS-010 Media Library"
        - "P13 CMS-076 Asset Version Control & Revision History"
        - "P13 CMS-095 Asset Replacement & Propagation Management"
      x-ticvai-audience: [staff]
      summary: Replace the file behind an asset
      description: >
        The reference is stable, so every surface using it updates at once. This is how a
        brand refresh happens without editing thirty screens.

        Derivatives regenerate. The previous version is retained for rollback.
      tags: [asset]
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              properties:
                uploadId: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Replaced, with affected surfaces reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaReplaceResult' }
        '409':
          description: Replacement is a different kind — an image cannot replace a document
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /media/uploads:
    post:
      operationId: createUpload
      x-ticvai-consumed-by:
        - "P13 CMS-002 Brand Kit"
        - "P13 CMS-010 Media Library"
        - "P13 CMS-063 Upload & Asset Ingestion Workspace"
      x-ticvai-audience: [staff]
      summary: Request a signed upload URL
      description: >
        Uploads go **direct to object storage**, not through this API. Large media passing
        through an application tier is latency, memory and a timeout waiting to happen.

        Confirm with `POST /media/uploads/{id}/complete` once the transfer finishes.
      tags: [upload]
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, sizeBytes]
              properties:
                filename: { type: string, maxLength: 256 }
                contentType: { type: string }
                sizeBytes: { type: integer, minimum: 1 }
                venueId: { type: string, format: uuid }
      responses:
        '201':
          description: Signed URL issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
        '400':
          description: >
            Content type not permitted, or size beyond the limit for that kind. Checked here
            rather than after a guest has uploaded two hundred megabytes.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /media/uploads/{uploadId}/complete:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeUpload
      x-ticvai-consumed-by:
        - "P13 CMS-002 Brand Kit"
        - "P13 CMS-010 Media Library"
        - "P13 CMS-063 Upload & Asset Ingestion Workspace"
      x-ticvai-audience: [staff]
      summary: Confirm an upload and create the asset
      description: >
        Verifies the transfer, reads dimensions and duration, generates derivatives, and
        registers the asset.

        Files are scanned before becoming available. An asset that fails scanning is quarantined,
        not published — a tenant uploading a compromised file must not have it served to guests.
      tags: [upload]
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { $ref: '#/components/schemas/LocalisedText' }
                altText: { $ref: '#/components/schemas/LocalisedText' }
                tags:
                  type: array
                  items: { type: string }
                collectionIds:
                  type: array
                  items: { type: string, format: uuid }
                rights: { $ref: '#/components/schemas/MediaRights' }
      responses:
        '201':
          description: Asset created. Derivatives may still be generating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '409':
          description: Upload incomplete, checksum mismatch, or the file failed scanning
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /media/collections:
    get:
      operationId: listCollections
      x-ticvai-consumed-by:
        - "P13 CMS-010 Media Library"
        - "P13 CMS-062 Central Digital Asset Library"
        - "P13 CMS-064 Folder, Collection & Workspace Management"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List collections
      description: >
        Folders — by campaign, venue, season or product line. An asset may sit in several.
      tags: [collection]
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Collection' }

    post:
      operationId: createCollection
      x-ticvai-consumed-by:
        - "P13 CMS-010 Media Library"
        - "P13 CMS-064 Folder, Collection & Workspace Management"
      x-ticvai-audience: [staff]
      summary: Create a collection
      tags: [collection]
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 1000 }
                venueId: { type: string, format: uuid }
                parentCollectionId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }

  /media/rights-expiring:
    get:
      operationId: getExpiringRights
      x-ticvai-consumed-by:
        - "P13 CMS-010 Media Library"
        - "P13 CMS-081 DAM Governance & Rights Command Center"
        - "P13 CMS-088 Rights Expiry, Renewal & Usage Impact"
        - "P13 CMS-090 Governance Risk, Compliance & AI Recommendations"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Assets whose licence is expiring or expired
      description: >
        A stock photograph licensed for one season and still on a website two years later is
        a legal problem. Expired assets in active use sort first.
      tags: [rights]
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: withinDays
          in: query
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: Expiring assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExpiringMedia' }
  /media-taxonomy:
    get:
      operationId: getMediaTaxonomy
      x-ticvai-consumed-by:
        - "P13 CMS-065 Metadata & Taxonomy Management"
        - "P13 CMS-066 Tags, Keywords & Classification"
      summary: The categories, metadata fields and controlled vocabularies
      description: 'Boards 1.5 and 1.6. **A DAM without a taxonomy is a shared drive with a search box.**
        The board counts *unclassified assets* as a headline metric, which only means anything if
        classification is defined somewhere.

        Metadata fields are per asset type — an image has dimensions, a video has a duration, a contract
        has an expiry — so the field set is configuration rather than a fixed column list.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: The taxonomy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaTaxonomy'
    put:
      operationId: setMediaTaxonomy
      x-ticvai-consumed-by:
        - "P13 CMS-065 Metadata & Taxonomy Management"
      summary: Define categories, fields and keyword vocabularies
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaTaxonomy'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaTaxonomy'
  /media-assets/{assetId}/tags:
    parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setMediaAssetTags
      x-ticvai-consumed-by:
        - "P13 CMS-066 Tags, Keywords & Classification"
        - "P13 CMS-072 AI Auto-Tagging & Content Understanding"
      summary: Tags and keywords, whoever or whatever supplied them
      description: 'Boards 1.6 and 2.2. **A tag carries its origin.** An auto-tag from content
        understanding and a tag a person typed look identical in a list and mean different things when
        somebody is deciding whether to trust the library — so `source` and `confidence` travel with
        every tag, and a low-confidence machine tag can be filtered out of a search without being
        deleted.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tags
              properties:
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/MediaTag'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTag'
  /media-assets/{assetId}/analyse:
    parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: analyseMediaAsset
      x-ticvai-consumed-by:
        - "P13 CMS-063 Upload & Asset Ingestion Workspace"
        - "P13 CMS-072 AI Auto-Tagging & Content Understanding"
      summary: Auto-tag, describe and classify an asset
      description: 'Board 2.2. **Proposes, never applies.** Auto-tagging writes suggestions with
        confidence scores and a person or a threshold promotes them — a library that silently accepts
        machine labels becomes a library nobody trusts the moment one is wrong in public.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '202':
          description: Queued; results arrive as proposed tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaTag'
  /media-assets/similar:
    get:
      operationId: findSimilarMediaAssets
      x-ticvai-consumed-by:
        - "P13 CMS-074 Visual Similarity & Related Asset Discovery"
        - "P13 CMS-075 Duplicate & Near-Duplicate Management"
      summary: Visually similar, near-duplicate and related assets
      description: 'Boards 2.4 and 2.5. **Similarity and duplication are one query read two ways.** Above
        a high threshold it is a duplicate to be merged; below it, it is a related asset to be offered.
        Splitting them into two searches means two indexes that disagree.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: assetId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: minSimilarity
        in: query
        schema:
          type: number
          default: 0.8
      responses:
        '200':
          description: Similar assets, with scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaSimilarity'
  /media-assets/{assetId}/versions:
    parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listMediaAssetVersions
      x-ticvai-consumed-by:
        - "P13 CMS-068 Digital Asset 360° Profile"
        - "P13 CMS-076 Asset Version Control & Revision History"
        - "P13 CMS-077 Version Comparison & Replacement Impact"
      summary: Every revision, and what replacing it would affect
      description: 'Boards 2.6 and 2.7. **`replaceMediaAsset` existed and nothing said what it would
        break.** An asset in a DAM is referenced by campaigns, tickets, screens and published pages, and
        replacing a logo is either a routine update or a live incident depending entirely on where it is
        used.

        So the impact list is part of the version read rather than a separate report nobody opens first.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Versions, with usage impact
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaAssetVersion'
  /media-assets/{assetId}/renditions:
    parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listMediaRenditions
      x-ticvai-consumed-by:
        - "P13 CMS-078 Transformation & Rendition Management"
        - "P13 CMS-079 Rendition Processing & Delivery Readiness"
        - "P13 CMS-094 Secure Delivery URL, CDN & Rendition Delivery"
      summary: The derived sizes and formats, and whether they are ready
      description: 'Boards 2.8 and 2.9. **Delivery readiness is the fact that matters.** An asset whose
        thumbnail has not been generated is an asset that renders as a broken image on a guest''s phone,
        and the library showing it as *Active* is showing the wrong thing.

        '
      tags:
      - assets
      x-ticvai-permission: ASSET_LIBRARY_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Renditions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaRendition'
    post:
