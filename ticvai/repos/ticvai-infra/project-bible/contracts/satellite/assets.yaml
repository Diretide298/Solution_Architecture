      summary: Who did what to this asset, and who received it
      description: 'Board 3.9. **Compliance evidence for a DAM is a distribution record**, not an edit
        log — the question asked afterwards is *who had this photograph and when*, and that is answered
        by shares and downloads rather than by metadata changes. Both are here.

        '
