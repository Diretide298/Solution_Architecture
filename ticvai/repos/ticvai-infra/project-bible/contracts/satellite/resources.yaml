          type: integer
    Resource:
      type: object
      x-ticvai-persistence: resources.resource
      description: '**A specific object, not a quantity of interchangeable ones.** A venue with forty
        identical strollers has forty resources, because guest number twelve returned stroller number
        twelve.

        '
      required:
      - id
      - code
      - name
      - kind
      - venueId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - cabana
          - locker
          - wheelchair
          - stroller
          - equipment
          - room
          - auditorium
          - vehicle
          - instructor
          - staff
          - table
          - pitch
          - studio
          - mealPlan
          - other
          description: 'BL-135. **`locker` was an entitlement kind in `orders` and nothing issued, assigned
            or released one.** A locker is a specific object checked out to a named guest and returned
            — which is this context exactly, and modelling it as an entitlement would have needed a second
            check-out mechanism.

            **`mealPlan` is the exception and is listed here to be refused**: 5.5.8b groups it with lockers
            and parking, and a meal plan is a balance rather than an object. It resolves to `retail.Wallet`
            with a `mealPlan` credit kind (CF-126), not to a resource.

            '
        venueId:
          type: string
          format: uuid
        scopePath:
          type: string
        parentResourceId:
          type: string
          format: uuid
          nullable: true
          description: '**A pool cabana belongs to the pool area; a seat belongs to an auditorium.** Booking
            a parent takes its children with it, which is the behaviour a venue expects and would otherwise
            have to enforce by hand.

            '
        principalId:
          type: string
          format: uuid
          nullable: true
          description: 'For a person resource. **`workforce` still owns their rota** — this says whether
            they are qualified and whether they are already committed.

            '
        attributes:
          type: object
          additionalProperties: true
          description: Configurable per kind — capacity, size, shade, power, poolside.
        setupMinutes:
          type: integer
          default: 0
          description: '**Before the booking, not inside it.** An auditorium booked 14:00–16:00 is unavailable
            from 13:30 with a 30-minute setup, and a calendar that cannot express that double-books every
            time.

            '
        teardownMinutes:
          type: integer
          default: 0
        requiresQualification:
          type: array
          items:
            type: string
          description: Qualification codes a person must hold to be assigned to this.
        depositAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        status:
          type: string
          enum:
          - available
          - booked
          - checkedOut
          - maintenance
          - retired
        isActive:
          type: boolean
          default: true
    ResourceAvailability:
      type: object
      description: '**Free windows, with setup and teardown already subtracted.** A client computing this
