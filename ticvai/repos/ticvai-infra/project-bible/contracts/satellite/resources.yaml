  /resource-allocations:
    post:
      operationId: allocateResources
      x-ticvai-consumed-by:
        - "P08 BO-871 Multi-Event Resource Planning"
        - "P08 BO-899 Customer / Cashier Resource Assignment Experience"
        - "P08 BO-900 Dynamic Resource Allocation Engine"
        - "P08 BO-916 Equipment & Asset Allocation"
      summary: Fill a requirement from the pool, rotating rather than repeating
      description: '**The 26 August decision is the whole of this operation.** *"resource allocation
        should rotate across all available resources (e.g., resource 1, then 2, then 3) rather than
        repeatedly reusing the same resource, to avoid overburdening any single resource while others
        remain unused."*

        A naive allocator picks the first free match and is correct on every individual booking while
        being wrong overall — the same instructor takes every lesson and the same cabana wears out first.
        **Rotation is therefore a property of the platform, not advice to an operator**, and this is the
        one place it can be enforced.

        Fills resource-type placeholders in a package, evaluates dependencies before confirming, and
        refuses naming what is missing rather than allocating a stage without its sound system.

