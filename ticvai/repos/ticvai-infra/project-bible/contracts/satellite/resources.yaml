      operationId: suggestResources
      x-ticvai-consumed-by:
        - "P08 BO-865 Calendar Filters, Search & Smart Discovery"
        - "P08 BO-877 Qualification & Assignment Rule Engine"
        - "P08 BO-894 Staff-to-Experience Qualification Mapping"
        - "P08 BO-898 Skill-Based & Smart Resource Selection"
        - "P08 BO-899 Customer / Cashier Resource Assignment Experience"
      summary: Resources matching a requirement, by attribute
      description: '**Deliberately not AI, and 26 August says so.** *"skill-based resource matching
        should rely on straightforward keyword/attribute matching (e.g., skill level, language) rather
        than a full AI-based matching system, to avoid unnecessary complexity."*

        Attributes come from the customer''s own attribute definitions, so matching a guest who wants an
        Arabic-speaking level-3 instructor needs no model and no training data — it is a query, and it is
        explainable to the operator who has to defend the result.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
