          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: attributes
        in: query
        description: 'Attribute code and value pairs, e.g. `language=ar,skillLevel=3`.'
