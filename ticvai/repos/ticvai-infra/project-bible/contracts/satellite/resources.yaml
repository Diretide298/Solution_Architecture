components:
  schemas:
    ResourceType:
      type: object
      x-ticvai-persistence: resources.resource_type
      description: 'Board 1.02. **The class, and the ten switches that decide which parts of the platform
        a resource of this class touches.** `Resource.kind` was an enum and this is the table behind it —
        a customer adding "Golf Buggy" does not need a release.

        '
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        displayColour:
          type: string
          nullable: true
        nature:
          type: string
          enum:
          - physical
          - human
          - virtual
          description: '**Human resources point at a principal and are rostered by `workforce`.** The
            nature decides which other context owns the thing, which is why it is not a free label.

            '
        reservable:
          type: boolean
          default: true
        rentable:
          type: boolean
          default: false
        capacityControlled:
          type: boolean
          default: false
        scheduleControlled:
          type: boolean
          default: true
        inventoryControlled:
          type: boolean
          default: false
        qualificationRequired:
          type: boolean
          default: false
        maintenanceControlled:
          type: boolean
          default: false
        checkInOutSupported:
          type: boolean
          default: false
        depositApplicable:
          type: boolean
          default: false
        customerSelectable:
          type: boolean
          default: false
          description: '**A ceiling, not a permission.** Whether a guest may actually choose is decided
            per ticket type by `setResourceSelectionPolicy`; a type with this false can never be
            choosable, and a type with it true still is not until a product says so.

            '
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    ResourceCategory:
      type: object
      x-ticvai-persistence: resources.resource_category
      description: 'Board 1.03. Beneath the type — *Equipment → AV → Lighting*, *Rental → Towels*.
        **Configuration cascades down the tree**, which is the reason it is a tree.

        '
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        parentCategoryId:
          type: string
          format: uuid
          nullable: true
        applicableResourceTypeIds:
          type: array
          items:
            type: string
            format: uuid
        displayOrder:
          type: integer
          default: 0
        tags:
          type: array
          items:
            type: string
        reportingGroup:
          type: string
          nullable: true
        costCentre:
          type: string
          nullable: true
        defaultAttributes:
          type: object
          additionalProperties: true
        defaultApprovalWorkflowId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    ResourceAttributeDefinition:
      type: object
      x-ticvai-persistence: resources.attribute_definition
      description: 'Board 1.05. **A typed, validated field the customer adds.** The alternative was a
        column per customer request, which is a release per customer.

        '
      required:
      - code
      - label
      - dataType
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        dataType:
          type: string
          enum:
          - text
          - number
          - decimal
          - currency
          - date
          - dateTime
          - boolean
          - singleSelect
          - multiSelect
          - lookup
          - attachment
          - url
          - measurement
          - formula
        applicableResourceTypeIds:
          type: array
          items:
            type: string
            format: uuid
        applicableCategoryIds:
          type: array
          items:
            type: string
            format: uuid
        mandatory:
          type: boolean
          default: false
        defaultValue:
          nullable: true
        allowedValues:
          type: array
          items:
            type: string
        minimum:
          type: number
          nullable: true
        maximum:
          type: number
          nullable: true
        validationExpression:
          type: string
          nullable: true
        searchable:
          type: boolean
          default: false
          description: '**The flag that decides whether `suggestResources` can use it.** An attribute
            nobody can filter by cannot take part in skill-based matching, which is the main reason the
            customer defined it.

            '
        scopePath:
          type: string
    ResourceHierarchy:
      type: object
      description: 'Board 1.06. Ancestors and the immediate subtree, with the relationship named.'
      properties:
        resourceId:
          type: string
          format: uuid
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRelation'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRelation'
    ResourceRelation:
      type: object
      x-ticvai-persistence: resources.resource_relation
      required:
      - resourceId
      - relation
      properties:
        resourceId:
          type: string
          format: uuid
        relation:
          type: string
          enum:
          - contains
          - belongsTo
          - locatedIn
          - operatedBy
          - supportedBy
          - partOf
          - dedicatedTo
        effectiveFrom:
          type: string
          format: date
          nullable: true
        priority:
          type: integer
          default: 0
        scopePath:
          type: string
    ResourceDependency:
      type: object
      x-ticvai-persistence: resources.resource_dependency
      description: 'Board 1.07. **Evaluated before an assignment is confirmed.** *Stage A requires Sound
        System A and Lighting Rig A.*

        '
      required:
      - kind
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - requires
          - requiresOneOf
          - requiresAll
          - conflictsWith
          - cannotOperateSimultaneously
          - preferredWith
          - substituteFor
          - backupFor
          - sharesCapacityWith
        targetResourceId:
          type: string
          format: uuid
          nullable: true
        targetResourceTypeId:
          type: string
          format: uuid
          nullable: true
        minimumQuantity:
          type: integer
          default: 1
        maximumQuantity:
          type: integer
          nullable: true
        mandatory:
          type: boolean
          default: true
        priority:
          type: integer
          default: 0
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        venueId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
    ResourcePackage:
      type: object
      x-ticvai-persistence: resources.resource_package
      description: 'Board 1.08. **A package may hold placeholders.** "One technician" is a slot, and
        naming a person would make the package unbookable whenever they are off.

        '
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        applicableVenueIds:
          type: array
          items:
            type: string
            format: uuid
        components:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRequirement'
        allocationPriority:
          type: integer
          default: 0
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        minimumMinutes:
          type: integer
          nullable: true
        maximumMinutes:
          type: integer
          nullable: true
        requiresApproval:
          type: boolean
          default: false
        internalCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        scopePath:
          type: string
    ResourceRequirement:
      type: object
      x-ticvai-persistence: resources.resource_requirement
      description: '**A type and a quantity, never a named resource.** This is what makes the 26 August
        rule enforceable — the product states what it needs and the platform decides which one.

        '
      required:
      - quantity
      properties:
        id:
          type: string
          format: uuid
        resourceTypeId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
          description: '**A fixed component, and the exception rather than the rule.** Meeting Room A
            really is Meeting Room A; the technician is not.

            '
        quantity:
          type: integer
          default: 1
        mandatory:
          type: boolean
          default: true
        requiredQualifications:
          type: array
          items:
            type: string
        requiredAttributes:
          type: object
          additionalProperties: true
        substituteResourceIds:
          type: array
          items:
            type: string
            format: uuid
        scopePath:
          type: string
    ResourceVenueAssignment:
      type: object
      x-ticvai-persistence: resources.venue_assignment
      description: 'Board 1.09. **The travel buffer is subtracted from availability**, like setup and
        teardown, so a shared instructor is not double-booked across a journey they cannot make.

        '
      required:
      - primaryVenueId
      properties:
        primaryVenueId:
          type: string
          format: uuid
        secondaryVenueIds:
          type: array
          items:
            type: string
            format: uuid
        sharedPool:
          type: boolean
          default: false
        crossVenueBookingAllowed:
          type: boolean
          default: false
        travelBufferMinutes:
          type: integer
          default: 0
        transferRequired:
          type: boolean
          default: false
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        scopePath:
          type: string
    ResourceSchedule:
      type: object
      x-ticvai-persistence: resources.resource_schedule
      description: 'Boards 2.03 and 2.04. **A recurring pattern with exceptions, not a list of dates.**
        A schedule written as concrete dates silently expires.

        '
      properties:
        resourceId:
          type: string
          format: uuid
        availabilityMode:
          type: string
          enum:
          - alwaysAvailable
          - scheduled
          - onRequest
        windows:
          type: array
          items:
            type: object
            properties:
              daysOfWeek:
                type: array
                items:
                  type: string
              from:
                type: string
              to:
                type: string
              effectiveFrom:
                type: string
                format: date
                nullable: true
              effectiveTo:
                type: string
                format: date
                nullable: true
        slotMinutes:
          type: integer
          nullable: true
          description: '**How finely this resource''s time can be cut**, which is a property of the
            resource and not of the product sold against it.

            '
        minimumBookingMinutes:
          type: integer
          nullable: true
        maximumBookingMinutes:
          type: integer
          nullable: true
        advanceBookingDays:
          type: integer
          nullable: true
        exceptions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              closed:
                type: boolean
              from:
                type: string
                nullable: true
              to:
                type: string
                nullable: true
        scopePath:
          type: string
    ResourceBlock:
      type: object
      x-ticvai-persistence: resources.resource_block
      description: 'Board 2.07. **A block is not a booking**, and the reason travels with it so an
        operator knows whether to wait or to look elsewhere.

        '
      required:
      - resourceId
      - from
      - to
      - reason
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        reason:
