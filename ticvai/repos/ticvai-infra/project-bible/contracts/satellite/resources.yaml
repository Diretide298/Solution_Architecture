    ResourceAllocationPolicy:
      type: object
      x-ticvai-persistence: resources.allocation_policy
      description: 'Board 5.08, and the 26 August rotation decision. **Named rather than hidden in the
        allocator**, so somebody can answer why cabana three never gets used.

        '
      properties:
        strategy:
          type: string
          enum:
          - rotate
          - leastUtilised
          - priorityOrder
          - nearestFirst
          default: rotate
          description: '**`rotate` is the default because 26 August made it one.** *"rotate across all
