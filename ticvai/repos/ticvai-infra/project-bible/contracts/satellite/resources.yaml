        - "P08 BO-912 Asset Lifecycle, Depreciation & Retirement"
      summary: Move a resource through its lifecycle, with a reason
      description: 'Board 1.10. **One operation, not seven.** Draft, pending approval, approved, active,
        temporarily unavailable, under maintenance, suspended, retired and archived are states of one
        machine, and *the allowed transitions are themselves configuration* — so `activateResource`,
        `suspendResource` and `retireResource` as separate operations would each re-implement the same
        transition table and still not cover a state the customer adds.

        **The reason is required on the states that need one.** Retirement carries disposal and
        depreciation references, suspension carries a cause, and either may name a replacement resource.
