openapi: 3.1.0
info:
  title: TICVAI — Resources
  version: 1.0.0
  x-ticvai-screen-count: 48
  x-ticvai-tier: satellite
  x-ticvai-module: 1 — Ticketing Catalogue
  x-ticvai-platforms:
  - P08 Venue Management
  description: '**A bookable resource is a specific object checked out to a named guest and returned.**
    A cabana, a locker, a wheelchair, a stroller, an AV rig, an instructor, an auditorium.

    ## Why this is not a product

    **A product with an availability envelope sells a slot.** It answers *"can somebody have a cabana
    at 2pm"* and it cannot answer *"which cabana, held by whom, returned when, with what deposit against
    it."*

    Ten requirements define the entity directly, 7.6 is fifteen rows of rentals with none served, and
    **the utilisation reporting behind them has no source** — you cannot report on the utilisation of
    something the model does not know exists.

    ## The three things that make it a context rather than a table

    **A calendar with conflict detection.** Two bookings on one cabana is not a pricing problem, it is
    a guest arriving to find somebody in their chair. **Conflict detection before assignment is the whole
    point**, and nothing in the package computed it.

    **Check-out and check-in.** A rental leaves with a guest and comes back, or does not. **A deposit
    is held against the object, not against the order** — which is why `orders` could not carry this:
    an order completes and a rental is still out.

    **Setup and teardown.** An auditorium booked 14:00–16:00 is unavailable 13:30–16:30, and a calendar
    that cannot express that double-books every time.

    ## What it deliberately does not own

    **Not staff scheduling.** `workforce` owns rotas. A resource of kind `person` points at a principal
    and the rota still says when they work — **this says whether they are qualified and whether they are
    already committed.**

    **Not stock.** `inventory` owns quantities of interchangeable things. **A resource is not interchangeable**
    — that is the whole distinction, and a venue with forty identical strollers has forty resources because
    guest number twelve returned stroller number twelve.

    '
servers:
- url: https://api.ticvai.com/v1
paths:
  /resources:
    get:
      operationId: listResources
      x-ticvai-consumed-by:
        - "P08 BO-095 Resources"
        - "P08 BO-854 Resource Management Command Center"
        - "P08 BO-874 Staff Resource Profile"
        - "P08 BO-903 Equipment & Asset Command Center"
        - "P08 BO-923 AI Resource Intelligence Command Center"
        - "P08 BO-943 Resource Analytics Command Center"
      summary: Resources at this venue
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      - name: availableFrom
        in: query
        schema:
          type: string
          format: date-time
      - name: availableTo
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      operationId: createResource
      x-ticvai-consumed-by:
        - "P08 BO-095 Resources"
        - "P08 BO-857 Resource Creation & Profile"
      summary: Define a bookable resource
      tags:
      - resources
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
  /resources/{resourceId}/availability:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getResourceAvailability
      x-ticvai-consumed-by:
        - "P01 WEB-031 My Reservations"
        - "P02 GST-070 Reserve a Table or Cabana"
        - "P08 BO-096 Resource Calendar"
      summary: When it is free, with conflicts already resolved
      description: '**Returns free windows, not a list of bookings for the caller to subtract.** A client
        computing availability from bookings will forget setup time, and a cabana booked 14:00–16:00 with
        a 30-minute turnaround is not free at 16:00.

        Includes maintenance windows and blackouts. **A resource under repair is unavailable for a different
        reason from one that is booked**, and the response says which — an operator looking for something
        free needs to know whether to wait or to look elsewhere.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Free windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAvailability'
  /resource-bookings:
    get:
      operationId: listResourceBookings
      x-ticvai-consumed-by:
        - "P08 BO-868 Advance Reservation Management"
        - "P08 BO-933 My Resource Operations Home"
        - "P08 BO-935 Assignment Detail & Operational Brief"
      summary: Bookings, filtered
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: resourceId
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceBooking'
    post:
      operationId: bookResource
      x-ticvai-consumed-by:
        - "P08 BO-096 Resource Calendar"
        - "P08 BO-864 Resource Calendar Command Center"
        - "P08 BO-868 Advance Reservation Management"
        - "P08 BO-869 Recurring Reservation Configuration"
        - "P08 BO-915 Venue & Space Allocation"
      summary: Reserve a specific resource for a window — staff only
      description: '**Refuses on conflict, including setup and teardown.** This is the operation the whole
        context exists for — **two bookings on one cabana is a guest arriving to find somebody in their
        chair**, and it must be impossible rather than unlikely.

        Where the caller does not care which one, `resourceId` may be omitted and a kind supplied: **the
        platform picks and tells you which.**

        ## Amended 19 September — no longer guest-callable

        This shipped with `x-ticvai-guest-callable: true`, and the 26 August minute says otherwise:

        > *"a guest always books a product or package — **never a resource directly, and never a specific
        room/vehicle/instructor by itself** — across all sales channels. The product''s configuration
        determines which resources are associated and get booked behind the scenes."*

        **The original reasoning was right and stopped one step short.** It argued a guest booking *a*
        cabana does not choose cabana seven; the minute goes further and says the guest does not address
        the cabana at all. They buy a product, the product declares what it needs
        (`setExperienceResourceRequirements`), and `allocateResources` fills it — rotating, per the same
        minute, so one cabana is not worn out while others sit empty.

        **This closes the open question on `F25-a-guest-rents-a-cabana`**, which recorded that the venue
        had not said whether a guest may book a cabana themselves. They had; it was minuted on 26 August
        and nothing read the minutes.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              - to
              properties:
                resourceId:
                  type: string
                  format: uuid
                  nullable: true
                resourceKind:
                  type: string
                  nullable: true
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                orderId:
                  type: string
                  format: uuid
                  nullable: true
                recurrence:
                  type: object
                  nullable: true
                  description: '**A weekly swimming lesson is one booking, not twelve.** Conflict detection
                    runs across every occurrence before any of them is written — booking eight of twelve
                    failing after seven succeeded is worse than the whole thing refusing.

                    '
                  properties:
                    pattern:
                      type: string
                      enum:
                      - daily
                      - weekly
                      - monthly
                    daysOfWeek:
                      type: array
                      items:
                        type: string
                    until:
                      type: string
                      format: date
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBooking'
        '409':
          description: '**Conflicts, and the response names them with times.** *"Not available"* on a
            resource a guest can see in front of them is not an answer.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /resource-bookings/{bookingId}/check-out:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: checkOutResource
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
        - "P08 BO-907 Guest & Resource Assignment"
        - "P08 BO-937 Resource Collection, Handover & Return"
      summary: Hand it over, with a deposit against it
      description: '7.6. **A rental leaves with a guest, and the deposit is held against the object rather
        than the order** — which is why `orders` could not carry this: an order completes and a rental
        is still out.

        Holds through `authoriseStoredValue` (CF-126) rather than taking payment. **A deposit taken and
        refunded is two transactions and a fee; a deposit held and released is neither**, and a guest
        who returns a stroller intact should not wait three days for their money.

        Records condition at handover. **The condition note taken on the way out is the only defence against
        a dispute on the way back.**

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subjectId
              properties:
                subjectId:
                  type: string
                  format: uuid
                depositAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                depositInstrument:
                  $ref: ../shared/common.yaml#/components/schemas/StoredValueKind
                conditionNote:
                  type: string
                  nullable: true
                conditionPhotoRefs:
                  type: array
                  items:
                    type: string
                dueBackAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBooking'
  /resource-bookings/{bookingId}/check-in:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: checkInResource
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
        - "P08 BO-937 Resource Collection, Handover & Return"
      summary: Take it back, and settle the deposit
      description: '**Releases the hold, or captures part of it against damage.** Partial capture is the
        normal case for a damaged item and the reason two-phase spend was worth building.

        **Marks the resource unavailable where it comes back broken**, so the next booking cannot take
        it. A returned item that goes straight back into the pool with a cracked wheel is how the second
        guest gets hurt.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - condition
              properties:
                condition:
                  type: string
                  enum:
                  - good
                  - minorDamage
                  - majorDamage
                  - notReturned
                captureAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                note:
                  type: string
                  nullable: true
                blockFurtherBookings:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceBooking'
  /resources/{resourceId}/qualifications:
    parameters:
    - name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setResourceQualifications
      x-ticvai-consumed-by:
        - "P08 BO-098 Qualifications"
        - "P08 BO-875 Skills & Competency Management"
        - "P08 BO-876 Certification & Expiry Management"
        - "P08 BO-877 Qualification & Assignment Rule Engine"
        - "P08 BO-894 Staff-to-Experience Qualification Mapping"
      summary: What a person resource is certified to do, and until when
      description: '1.2.36. **`RotaAssignment` carried `requiredRoleId` alone, and a role is not a skill.**

        The requirement is that the qualification is checked **before** the assignment is made — and **a
        lifeguard certificate that lapsed last month is a safety failure, not a data quality one.**

        Expiry is the field that matters. A certification with no expiry is a certification nobody renews.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - qualifications
              properties:
                qualifications:
                  type: array
                  items:
                    $ref: '#/components/schemas/Qualification'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Qualification'
  /sessions/{sessionId}/manifest:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSessionManifest
      x-ticvai-consumed-by:
        - "P08 BO-099 Session Manifest"
      summary: Who is in a session, in what order
      description: '1.3.44. **Distinct from duration, which variants already handle.**

        A session holding a mix of first-time and experienced participants needs a running order, **because
        the order is operational rather than administrative** — an instructor takes the beginners first,
        and a manifest sorted by booking time gives them a beginner between two advanced riders.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionParticipant'
    put:
      operationId: reorderSessionManifest
      x-ticvai-consumed-by:
        - "P08 BO-099 Session Manifest"
      summary: Change the running order
      tags:
      - resources
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order
              properties:
                order:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionParticipant'
  /resource-types:
    get:
      operationId: listResourceTypes
      x-ticvai-consumed-by:
        - "P08 BO-854 Resource Management Command Center"
        - "P08 BO-855 Resource Type Configuration"
      summary: The classes of resource this organisation supports
      description: 'Board 1.02. **A resource type is configuration, not code.** The board is explicit
        that administrators define staff, instructor, venue, room, hall, area, cabana, equipment, rental
        item, vehicle and locker *without requiring software development* — so the list is a table, and
        the `Resource.kind` enum that shipped first is a seed for it rather than the law.

        **The flags are the reason this is not just a label.** Reservable, rentable, capacity-controlled,
        schedule-controlled, inventory-controlled, qualification-required, maintenance-controlled,
        check-in/out supported, deposit-applicable and customer-selectable each switch on a different
        part of the platform. A locker is rentable and deposit-applicable and not schedule-controlled;
        an instructor is schedule-controlled and qualification-required and not rentable.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Resource types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceType'
    post:
      operationId: createResourceType
      x-ticvai-consumed-by:
        - "P08 BO-855 Resource Type Configuration"
      summary: Define a class of resource
      description: '**Tenant scope, because 26 August says it may be either.** *"some elements of resource
        management configuration may be controlled at the tenant level rather than only centrally"* —
        so the type vocabulary belongs to the tenant and a venue inherits it. A venue that needs its own
        class asks for one rather than minting it silently.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceType'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceType'
  /resource-types/{resourceTypeId}:
    parameters:
    - name: resourceTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateResourceType
      x-ticvai-consumed-by:
        - "P08 BO-855 Resource Type Configuration"
      summary: Change a class of resource
      description: '**Existing resources are re-evaluated when their type changes** (board 1.02,
        Governance). Turning off `checkInOutSupported` on a type whose resources are currently checked
        out is refused rather than applied, and the response names them.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceType'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceType'
        '409':
          description: Resources exist that the new definition would invalidate
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /resource-categories:
    get:
      operationId: listResourceCategories
      x-ticvai-consumed-by:
        - "P08 BO-856 Resource Category Management"
      summary: The classification tree beneath the types
      description: 'Board 1.03. **Categories inherit from their parent** — default attributes, default
        availability policies and the default approval workflow all cascade, which is what makes a tree
        worth having rather than a flat tag.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceCategory'
    post:
      operationId: createResourceCategory
      x-ticvai-consumed-by:
        - "P08 BO-856 Resource Category Management"
      summary: Add a category or subcategory
      tags:
      - resources
      x-ticvai-permission: RESOURCE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCategory'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCategory'
  /resource-categories/{categoryId}:
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateResourceCategory
      x-ticvai-consumed-by:
        - "P08 BO-856 Resource Category Management"
      summary: Change a category
      description: '**Warn before changing one that is in use** (board 1.03). The count of resources
        beneath it comes back with the refusal, so the warning can say how many.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCategory'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCategory'
  /resource-attributes:
    get:
      operationId: listResourceAttributes
      x-ticvai-consumed-by:
        - "P08 BO-858 Configurable Attribute Builder"
      summary: The customer-defined fields on a resource
      description: 'Board 1.05. **The customer extends the record; we do not ship their fields.** Skill
        level, height, seating capacity, equipment model, serial number, warranty expiry, language,
        certification level and rental condition are all one mechanism — a typed, validated, per-type
        attribute definition — and shipping them as columns would mean a release per customer.

        '
      tags:
      - resources
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Attribute definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceAttributeDefinition'
    post:
      operationId: createResourceAttribute
      x-ticvai-consumed-by:
        - "P08 BO-858 Configurable Attribute Builder"
      summary: Define a customer attribute
      tags:
      - resources
      x-ticvai-permission: RESOURCE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
