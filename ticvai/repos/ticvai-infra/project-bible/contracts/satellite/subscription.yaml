      summary: Plan moving a tenant to another cell
      description: '**The upgrade path a tenant buys.** A client on shared infrastructure who later wants
        isolation is migrated to their own cell — the shared start is not a decision they are stuck with,
        and saying so is what makes the cheaper package sellable.

        Also used to rebalance: a shared cell running hot moves a tenant to a newly launched cluster.

        Plans only. Reports what moves, how long the cutover window is, and what cannot move — an entitlement
        redeemable in another region has a cross-region link that must be re-pointed rather than copied.

        **Region cannot change.** Moving a tenant across a residency boundary is not a migration, it is
        an export, and it is refused here.

        '
