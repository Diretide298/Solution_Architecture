    DraftedRecord:
      type: object
      x-ticvai-provisional: true
      description: '**A provisional envelope, drafted 2026-09-04 from the workshop pack.** It carries
        what every one of these screens needs to address a row and nothing it has not earned. **There
        is deliberately no `x-ticvai-persistence`** - naming a table here would put a storage decision
        nobody made into the ER model and the DDL.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        updatedAt:
          type: string
          format: date-time
    PartnerQuote:
      type: object
      x-ticvai-persistence: subscription.partner_quote
      description: '**Drafted 4 September.** A priced offer to a partner, with an expiry. **Not the same
        as a procurement quotation** - `inventory.quotation` is what a supplier offers this venue, and
        this is what this venue offers a reseller.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        partnerId:
          type: string
          format: uuid
        agreementId:
          type: string
          format: uuid
        currency:
          type: string
          x-ticvai-persisted: false
          description: '**Not stored on the row.** Currency is region-scoped and resolves from the scope
            walk (ADR-0018); a quote that carries its own copy is a quote that disagrees with the region
            the moment one of them changes.'
        totalMinor:
          type: integer
        state:
          type: string
          enum:
          - draft
          - sent
          - accepted
          - declined
          - expired
        validUntil:
          type: string
          format: date-time
          description: '**Stored, not calculated** - an offer whose expiry moves when you read it is not
            an offer.'
        createdAt:
          type: string
          format: date-time
    LocalisedText:
      type: object
      additionalProperties:
        type: string
    ModuleKey:
      type: string
      description: 'What a tenant buys, and what a screen belongs to. **One vocabulary for both sides
        of the join**, because two lists that must agree are one list somebody forgets to update.

        **Grain chosen to match how a venue buys, not how the package is built.** `fnb` is one module
        even though it spans four contracts; `ticketing` and `access` are separate because a venue can
        run a museum with no gates and a stadium with no shop.

        '
      enum:
      - core
      - ticketing
      - access
      - fnb
      - retail
      - inventory
      - seating
      - membership
      - marketing
      - resources
      - queue
      - games
      - maintenance
      - accreditation
      - partner
      - developerApi
      - analytics
      - ai
      x-ticvai-note: '**`core` is listed and cannot be unlicensed.** It exists so a screen can say it
        belongs to no optional module rather than leaving the field empty — **an empty field and *always
        on* look identical, and only one of them is a decision.**

        '
    OnboardingApplication:
      type: object
      x-ticvai-persistence: control.onboarding_application
      description: 'BL-165. **`subscription` handles the operator-led path well and has no prospect-led
        one.** `createTenant` and `provisionCell` assume somebody at Softlabs decided this tenant exists.

        A prospect signing themselves up is a different shape: **nothing is provisioned until they are
        verified**, because an unverified application that provisions a cell is a cell somebody has to
        clean up.

        '
      required:
      - id
      - companyName
      - contactEmail
      - status
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          nullable: true
        countryCode:
          type: string
        venueTypeTemplateId:
          type: string
          format: uuid
          nullable: true
          description: '**A water park and a theatre need different defaults**, and asking a prospect
            to configure 300 settings from empty is asking them to leave.

            '
        requestedPlanId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - submitted
          - verifying
          - approved
          - provisioning
          - active
          - rejected
          - abandoned
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
          description: '**Trial is a state, not a plan.** A tenant on trial has the plan they will pay
            for and a date by which they must — modelling it as a separate plan means migrating them at
            conversion, which is the moment least worth adding risk to.

            '
        rejectionReason:
          type: string
          nullable: true
        provisionedTenantId:
          type: string
          format: uuid
          nullable: true
    VenueTypeTemplate:
      type: object
      x-ticvai-persistence: control.venue_type_template
      description: 'BL-165. **What a venue of this kind starts with.** Product kinds, price list structure,
        access profiles, roles, report set.

        **A template is a starting point and not a constraint** — everything it creates is editable the
        moment it lands, which is the difference between a template and a plan tier.

        '
      required:
      - id
      - name
      - venueKind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        venueKind:
          type: string
          enum:
          - themePark
          - waterPark
          - museum
          - theatre
          - stadium
          - arena
          - zoo
          - aquarium
          - cinema
          - attraction
          - mixed
        seedsProductKinds:
          type: array
          items:
            type: string
        seedsRoles:
          type: array
          items:
            type: string
        seedsAdmissionProfiles:
          type: array
          items:
            type: string
        seedsReports:
          type: array
          items:
            type: string
    PartnerUser:
      type: object
      x-ticvai-persistence: control.partner_user
      description: '2.7.51, BL-075. **A partner was a flat account** — `registerPartner` created one and
        nothing created a user beneath it.

        The requirement asks for Master Agency, Branch, Department and User with permissions, quotas and
        credit cascading down. **That is a scope tree, and `tenancy` already has one** — so this is a
        principal on a partner branch rather than a new hierarchy.

        **Quota and credit resolve the way configuration does: nearest ancestor wins.** A branch with
        no credit limit inherits the agency''s, which is the behaviour a partner expects and would otherwise
        have to be enforced by hand.

        '
      required:
      - id
      - partnerId
      - principalId
      - branchScopePath
      properties:
        id:
          type: string
          format: uuid
        partnerId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        branchScopePath:
          type: string
          description: 'The branch this user sits on. **An ltree, like every other scope path**, so a
            report at agency level rolls up its branches without anybody writing a join.

            '
        allocationQuota:
          type: integer
          nullable: true
          description: 'Units this branch may sell. **Null inherits the parent''s**, and a quota set at
            branch level below the agency''s is a deliberate restriction rather than an error.

            '
        creditLimitOverride:
          $ref: ../shared/common.yaml#/components/schemas/Money
        canManageUsers:
          type: boolean
          default: false
          description: '**Partner-managed access control** — 2.7.51 asks for it, and a venue administering
            every travel agent''s staff list is a venue doing the agency''s HR.

            '
    ChannelListing:
      type: object
      x-ticvai-persistence: control.channel_listing
      description: 'BL-076. **The integration register marks *Resellers & OTA* as covered, and that is
        true of the commercial model and not of the integration.** Agreements, allocations and credit
        exist; the exchange with Viator, Klook, Headout and GetYourGuide does not.

        **An OTA is not a partner portal.** A partner logs in and books; an OTA pulls a feed, caches it,
        and sells against the cache — **so the failure mode is a sale against stale inventory**, and everything
        below exists to bound that.

        '
      required:
      - id
      - channelName
      - productId
      - status
      properties:
        id:
          type: string
          format: uuid
        channelName:
          type: string
          enum:
          - viator
          - klook
          - headout
          - getYourGuide
          - tiqets
          - expedia
          - other
        productId:
          type: string
          format: uuid
        externalProductRef:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - live
          - paused
          - delisted
        allocationUnits:
          type: integer
          nullable: true
          description: '**Inventory published to this channel, not the venue''s whole capacity.** An OTA
            given the full envelope will sell it, and the venue discovers at the gate.

            '
        priceListId:
          type: string
          format: uuid
        adapter:
          type: string
          nullable: true
          enum:
          - viatorApi
          - klookApi
          - headoutApi
          - getYourGuideApi
          - tiqetsApi
          - octoStandard
          - generic
          description: 'BL-067. **The commercial model was complete and the wire was not** — `PartnerAgreement`
            carries rates, commission, credit and channels, and `alternative-codes` maps a partner SKU
            so an inbound order matches. What was missing is which protocol speaks to whom.

            **`octoStandard` is the one that matters.** OCTo is the open connectivity standard the OTAs
            converged on, and a venue that implements it once reaches several channels — **a per-OTA adapter
            is a per-OTA maintenance commitment**, and naming the standard first is what keeps that list
            from growing.

            '
        adapterCredentialRef:
          type: string
          nullable: true
          description: A vault reference. **Never the credential**, following the rule ADR-0020 set for
            AI providers.
        pushIntervalMinutes:
          type: integer
          default: 15
          description: 'How often availability is pushed. **The gap between pushes is the oversell window**,
            and a channel selling a high-demand slot needs a shorter one than a channel selling a museum
            on a Tuesday.

            '
        guestDataScope:
          type: string
          enum:
          - none
          - nameOnly
          - nameAndContact
          - full
          default: nameOnly
          description: '**What the OTA passes through, and it is usually less than the venue wants.**
            A ticket arriving with no contact detail cannot be reissued or notified of a cancellation,
            and the venue should know that at listing time rather than at the gate.

            '
        lastPushedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    PartnerAgreementStatus:
      type: string
      enum:
      - pendingApproval
      - active
      - expiringSoon
      - expired
      - suspended
      - terminated
    PartnerRateMode:
      type: string
      description: '**Alternatives, not both.** A partner buys at a net rate and keeps the margin, or
        sells at face value and is paid commission. Both is being paid twice for the same sale.

        '
      enum:
      - netRate
      - commission
    PartnerAgreement:
      type: object
      x-ticvai-persistence: control.partner_agreement
      required:
      - partnerId
      - rateMode
      - validFrom
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        partnerId:
          type: string
          format: uuid
        partnerName:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: '**Amending creates a version.** An order placed last week was placed under last
            week''s rate, and settlement must be able to say which.

            '
        status:
          $ref: '#/components/schemas/PartnerAgreementStatus'
        rateMode:
          $ref: '#/components/schemas/PartnerRateMode'
        commissionPercent:
          type: number
          nullable: true
        volumeTiers:
          type: array
          description: '2.7.57. **A tier that changes at a threshold needs the sale to look back at cumulative
            volume, and nothing did.** Flat net rates and per-channel price lists cover the simple case
            and stop there.

            **The window is the argument, not the tier.** A partner who sells 400 in January and 400 in
            February is either a 400-tier partner twice or an 800-tier partner once, and the two are different
            money. `volumeWindow` says which.

            '
          items:
            type: object
            required:
            - fromUnits
            - commissionPercent
            properties:
              fromUnits:
                type: integer
              commissionPercent:
                type: number
              appliesRetrospectively:
                type: boolean
                default: false
                description: '**Whether crossing a tier reprices what came before it.** Retrospective
                  is what a partner assumes and prospective is what a venue budgets for — it has to be
                  stated.

                  '
        volumeWindow:
          type: string
          nullable: true
          enum:
          - calendarMonth
          - calendarQuarter
          - calendarYear
          - agreementYear
          - rolling12Months
        seasonalRates:
          type: array
          description: 'Rates that change by date range. **Separate from the volume tier because they
            compound** — a peak-season rate at a high volume tier is both, and a single rate table cannot
            say so.

            '
          items:
            type: object
            properties:
              from:
                type: string
                format: date
              to:
                type: string
                format: date
              commissionPercent:
                type: number
        segmentTier:
          type: string
          nullable: true
        brandingAssetId:
          type: string
          format: uuid
          nullable: true
          description: '2.7.x, BL-078. **A reseller selling a venue''s tickets under their own brand is
            a second scope level white-label does not have** — `BrandIdentity` and `setTheme` are tenant-scoped
            throughout.

            **Co-branding rather than replacement.** The venue''s identity stays on the ticket because
            the ticket admits to the venue; the partner''s sits beside it.

            '
        storefrontSubdomain:
          type: string
          nullable: true
        sponsorship:
          type: object
          nullable: true
          description: 'BL-050. **Sponsorship inventory is sellable capacity of a different kind** — logo
            placements, hospitality allocations, naming rights. It is closer to a partner agreement than
            to a product: **a sponsor buys a relationship for a season, not a ticket for a date.**

            Modelled here rather than as a `ProductKind` because the commercial terms — the term, the
            exclusivity, the settlement — are the agreement''s, and duplicating them onto a product would
            mean two places to disagree.

            '
          properties:
            placements:
              type: array
              items:
                type: object
                properties:
                  surface:
                    type: string
                    enum:
                    - signage
                    - ticketFace
                    - appBanner
                    - emailFooter
                    - venueNaming
                    - zoneNaming
                    - uniform
                    - printedMap
                  quantity:
                    type: integer
                  exclusive:
                    type: boolean
                    default: false
                    description: '**Exclusivity is the expensive word.** A sponsor paying for category
                      exclusivity has bought the absence of a competitor, and a second agreement breaching
                      it is a legal problem rather than a scheduling one.

                      '
            hospitalityAllocation:
              type: integer
              nullable: true
              description: Tickets or cabanas included. **Issued as invitations, not sales** — no revenue
                attaches.
            categoryExclusivity:
              type: string
              nullable: true
        netRates:
          type: array
          description: Per product or category. Absent means the commission applies across the catalogue.
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
                nullable: true
              categoryId:
                type: string
                format: uuid
                nullable: true
              netPrice:
                $ref: ../shared/common.yaml#/components/schemas/Money
              maxDiscountPercent:
                type: number
                nullable: true
                description: '1.6.10. **What the partner may not undercut.** A reseller selling below
                  the venue''s own price damages the direct channel, and the venue usually cares more
                  about that than the margin.

                  '
        creditTermDays:
          type: integer
          description: 2.7.36. Net 30, net 60. Drives when an invoice becomes overdue.
        acceptedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: 'BL-079. **Electronic acceptance against a version**, following the `signatureRef`
            precedent. An agreement accepted with no version recorded is an agreement nobody can produce
            in a dispute.

            '
        acceptedVersion:
          type: integer
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        signatureRef:
          type: string
          nullable: true
        corporateAllocations:
          type: array
          description: 'BL-035. **`PartnerAgreement` covered commercial terms and not allocations.** A
            corporate account with fifty places for its staff is the same structure as a reseller with
            fifty to sell, and **the difference is that a corporate member does not pay.**

            '
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: integer
              usedQuantity:
                type: integer
                readOnly: true
              perMemberLimit:
                type: integer
                nullable: true
              validTo:
                type: string
                format: date
                nullable: true
        settlementCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          description: '**The currency this partner is billed and settles in**, which is often not the
            venue''s. A UK tour operator selling a Dubai attraction is invoiced in GBP against sales booked
            in AED, and the difference is somebody''s exposure.

            **`creditLimit` and `netRates` are expressed in this currency**, not the venue''s — a limit
            in the wrong currency is a limit that moves with the exchange rate.

            '
        fxPolicy:
          type: string
          enum:
          - rateAtSale
          - rateAtInvoice
          - fixedRate
          default: rateAtSale
          description: '**Which rate converts a sale into the settlement currency, and it is a commercial
            term.** `rateAtSale` puts the movement on the partner; `rateAtInvoice` puts it on the venue;
            `fixedRate` puts it on whoever guessed wrong when the agreement was signed.

            **Not a default to leave alone** — on a monthly statement across a moving rate the three produce
            materially different numbers, and the partner will have assumed one of them.

            '
        fixedRate:
          type: number
          nullable: true
          description: Where `fxPolicy` is `fixedRate`. **An amendment creates a version** so an old statement
            stays readable.
        creditLimit:
          $ref: ../shared/common.yaml#/components/schemas/Money
        allowedChannels:
          type: array
          items:
            $ref: ../shared/common.yaml#/components/schemas/SalesChannel
        allowedVenueIds:
          type: array
          items:
            type: string
            format: uuid
        requiresApprovalAboveValue:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
