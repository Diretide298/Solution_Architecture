    get:
      operationId: listLicensingModels
      x-ticvai-consumed-by:
        - "P09 ADM-389 Commercial Rules Engine Overview"
      summary: Billable units, minimum guarantees and overage
      description: 'Boards 3.6 and 3.7. **The billable unit is the single most consequential commercial
