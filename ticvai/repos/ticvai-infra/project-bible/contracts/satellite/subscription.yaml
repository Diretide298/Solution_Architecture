        the boards make it configurable rather than a price list: visitors, capacity, venues, channels,
        modules and operational complexity are weighted into a score, and the score falls into a tier.

        **The alternative is a sales conversation per customer**, which is what self-service is meant
        to remove. A prospect answering the board 2 questionnaire should reach a package without
        anybody picking up the phone.

