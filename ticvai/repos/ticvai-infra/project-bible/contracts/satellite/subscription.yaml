          type: string
          format: date-time
          nullable: true
        deploymentRef:
          type: string
          nullable: true
          description: '**A pointer to where this cell runs, not a description of it.** A Kubernetes namespace,
            an ECS cluster ARN, a stack name — whatever the orchestrator calls the thing.


            **The platform does not model instances, nodes or shards** (31 August). Kubernetes already
            holds instance counts and they change by the second; a table copying them drifts within minutes
            and the copy would win.


            **The line is: routing decisions belong to the platform, provisioning facts belong to the
            orchestrator.** Qdrant is the proof — ADR-0021 makes the tenant *the* shard key, so nine operations
            route without a lookup and **a stored shard assignment would be a second copy of something
            derivable.**


            **CF-161 needed a table after all, and this said it did not.** The claim here was that one
            database per cell or one per service is a build-time decision and the DDL is identical either
            way. **ADR-0038 answered it per tenant**, which drops `Cell.tenantId`, adds `CellTenant`,
            `RolloutTenant` and a per-tenant migration row, and takes `control` out of the tenant template.
            `tools/derive-ddl.py` carried the same claim in its docstring.


            **A claim that a question cannot affect your artefact is the one most likely to be left standing
            after it does**, which is why the correction is recorded here rather than the sentence simply
            deleted.'
    CellInstance:
      x-ticvai-persistence: control.cell_instance
      description: 'One Postgres instance serving a cell. **A cell is a region and a region may be served
        by more than one instance** (ADR-0040), so the instance is a thing a cell has rather than a thing
        it is.


        **This exists because a database name stopped being an address.** `CellTenant.databaseName` was
        complete while a cell had one instance; with several, the router has to be told which host holds
        the database, and guessing is the failure mode ADR-0042 was written to remove.


        **Every instance of a cell is in that cell''s region.** Residency is a property of the cell, and
        adding instances does not weaken it — which is why there is no country code here.

        '
      type: object
      required:
      - id
      - cellId
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        name:
          type: string
          description: Unique within the cell. The host a service connects to, and stable across restores
            — an instance rebuilt from a backup keeps its name, because the tenants pointing at it did
            not move.
        status:
          type: string
          enum:
          - provisioning
          - live
          - draining
          - retired
          description: '`draining` takes no new tenants and still serves the ones it has. **Placement
            and liveness are different questions** — an instance being emptied is not an instance being
            down, and collapsing them would either strand its tenants or send new ones to a host that
            is being retired.'
        role:
          type: string
          enum:
          - primary
          - archive
          - burst
          default: primary
          description: '**What the instance is for, which decides whether a tenant may be placed
            on it.** ADR-0042 provisions a new tenant onto the instance in its region with the
            most headroom, and until this column existed every instance was a candidate.


            **`archive` holds data past its active stage** (ADR-0047) and takes almost no
            connections, so an emptiest-first rule reads it as the best place in the region and
            would put the next tenant provisioned straight onto it.


            **`burst` is CF-162''s flash-sale environment and has no trailing history at all**,
            so its headroom reads as total — emptiest-first would send the most violent workload
            in the estate to whichever host has the least room for it.


            **Only `primary` is placed onto, and `archive` and `burst` enter no other instance''s
            headroom figure.** A sale that joined the trailing seven-day average would push
            tenants away from that host for a week after it had gone quiet.


            **Distinct from `status: draining`.** Draining is a state an instance passes through
            and is temporary; a role is permanent. Marking an archive as draining to keep tenants
            off it would make a healthy instance indistinguishable from one being retired.'
        supportsSynchronousReplication:
          type: boolean
          default: false
          description: >
            CF-64. **Whether this host has the standby and the link to offer a near-zero RPO**, and
            false is the honest default for an instance nobody has built one for.

            **Read rather than assumed**, the same way `maxConnections` is. A tenant selecting
            `replicationMode: synchronous` is refused where its instance reports false, so a
            durability promise cannot be made on behalf of a topology that does not exist.
        maxConnections:
          type: integer
          nullable: true
          description: The instance's own `max_connections`. **Read rather than assumed**, because the
            placement rule in ADR-0042 measures headroom as a fraction of it and instances in one region
            need not be the same size.
        createdAt:
          type: string
          format: date-time
          nullable: true
        retiredAt:
          type: string
          format: date-time
          nullable: true
          description: 'Set rather than the row deleted, for the reason `CellTenant.droppedAt` is: a migration
            run records the host it touched by name, and that record has to stay readable.'
    ReplicationMode:
      type: string
      description: >
        CF-64, decided 21 September. **What a tenant's data durability costs the write path**, and
        therefore what RPO it can be sold.

        `asynchronous` — **the default, and the floor.** A several-minute recovery point, streaming
        replication, one site with a standby. Every tenant gets this and nothing is required of
        them to get it.

        `synchronous` — near-zero recovery point, **selectable rather than standard**, and
        available only on a pinned instance. Every commit waits for a remote acknowledgement, so
        the cost lands inside `acquireInventoryHold` and `access.scan_event` — the two paths in
        this package with the least headroom to give.

        **The floor is a default, not a limit.** DR-11 asks the platform to *support configurable*
        recovery point objectives; a platform that offered exactly one would have answered a
        different requirement.
      enum:
      - asynchronous
      - synchronous

    CellTenant:
      x-ticvai-persistence: control.cell_tenant
      description: 'Which tenants a cell holds, and the database each one is. **The relation that replaced
        `Cell.tenantId`** when ADR-0038 made a cell a region: a cell holds many tenants, so a nullable
        column that is always null is the absence of a rule rather than a weaker version of one.


        **`databaseName` does not encode the region.** The instance is the region — a name that repeats
        it is a name that can contradict it, and residency is then two facts that have to agree instead
        of one.

        '
      type: object
      required:
      - id
      - cellId
      - tenantId
      - instanceId
      - databaseName
      - status
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
          description: Which instance of the cell holds this database. **Required, not nullable** — a
            cell with one instance still names it, because a column that is only populated once there
            are two is a column every reader has to guess about. **`cellId` and `instanceId` together
            are the address**; the database name alone has not been one since ADR-0040.
        replicationMode:
          allOf:
          - $ref: '#/components/schemas/ReplicationMode'
          description: >
            CF-64, decided 21 September. **Asynchronous by default; synchronous is a configuration
            a tenant selects and cannot select alone.**

            **`synchronous` requires `pinnedInstance: true`**, and that is not a restriction
            invented for this field. Synchronous replication puts a network round-trip inside
            every write transaction, and on a shared instance that cost is paid by every tenant on
            the host — including the ones who did not ask for it and are not paying for it.
            ADR-0042 already says the pin is what a dedicated client is buying, and a dedicated
            client is exactly who asks for near-zero. **One decision serves CF-64 and CF-168.**

            **Also requires `CellInstance.supportsSynchronousReplication` on the instance that
            holds this tenant.** A capability absent is a capability unavailable, not one
            assumed — the refusal happens when somebody selects it rather than silently at the
            next failover, which is the only other moment anybody would find out.
        pinnedInstance:
          type: boolean
          default: false
          description: 'True where this tenant was placed by hand and the balancer must leave it. The
            override in ADR-0042''s **emptiest-first with a pin** — a dedicated client is buying a quiet
            neighbour, and a rule that can silently rebalance them has sold something it does not deliver.
            **A pin survives migration**: moving a pinned tenant is an operator decision, never a placement
            one.'
        databaseName:
          type: string
          description: Unique within the cell. Derived from the tenant's stable code, never from its display
            name — a rename must not rename a database.
        status:
          type: string
          enum:
          - provisioning
          - live
          - suspended
          - draining
          - dropped
        provisionedAt:
          type: string
          format: date-time
          nullable: true
        droppedAt:
          type: string
          format: date-time
          nullable: true
          description: Set rather than the row deleted. **A migration run records what it touched by name**,
            and a dropped database whose row is gone leaves that record unreadable.
    CellDetail:
