  /burst-environments:
    get:
      operationId: listBurstEnvironments
      summary: On-sale environments
      description: '**What is running and what it is costing.** An environment nobody is watching is the
        one left up for a month.'
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_CELL_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/BurstEnvironment'
    post:
      operationId: requestBurstEnvironment
      summary: Stand one up for a performance
      description: '**Threshold-based, not manual.** Requested when a performance''s expected demand exceeds
        what the shared cell absorbs — `catalogue.performance` carries `onSaleFrom`, `onSaleTo` and capacity,
        so **the trigger data already exists**.


        **Provisioning takes minutes and a sale takes seconds.** Requesting at the moment demand arrives
        is requesting too late; this runs against the sale calendar.'
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - &id002
        $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - performanceId
              - priceDivergencePolicy
              properties:
                performanceId:
                  type: string
                  format: uuid
                priceDivergencePolicy:
                  type: string
                  enum:
                  - honourSnapshot
                  - honourCurrent
                  - reject
                expectedConcurrent:
                  type: integer
                  description: '**Sizes the environment.** 30,000 is the Bahrain number.'
                graceMinutes:
                  type: integer
                  default: 30
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: *id001
  /burst-environments/{burstEnvironmentId}/drain:
    post:
      operationId: drainBurstEnvironment
      summary: Stop taking orders, let in-flight ones finish
      description: '**Draining is not stopping.** A guest mid-checkout when the sale closes must be allowed
        to finish; a guest arriving after it must be told the sale has ended.


        **Automatic at `onSaleTo` plus the grace period** when `autoDecommission` is set. Manual drain
        exists for a sale cut short.'
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - &id003
        name: burstEnvironmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id002
      responses:
        '200':
          description: Draining
          content:
            application/json:
              schema: *id001
  /burst-environments/{burstEnvironmentId}/reconcile:
    post:
      operationId: reconcileBurstEnvironment
      summary: Move the orders into the permanent platform
      description: '**The open half of CF-162, and the reason an environment cannot simply be deleted.**


        **Same three properties as `syncOrders` one layer up**: an environment id in place of a device
        id, a monotonic sequence that orders the replay, and idempotent application so a retry is safe.
        **Rejections land in `sync.rejection`** and are worked afterwards — kept, because thirty thousand
        silently lost sales is worse than thirty thousand reported ones.


        **Resumable.** A reconciliation interrupted at order 18,000 of 30,000 continues from 18,000 rather
        than starting again — which is what the sequence is for.'
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - *id003
      - *id002
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromSequence:
                  type: integer
                  nullable: true
                  description: Resume point. Omitted means resume from the last applied.
                batchSize:
                  type: integer
                  default: 500
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: integer
                  rejected:
                    type: integer
                  lastSequence:
                    type: integer
                  complete:
                    type: boolean
  /burst-environments/{burstEnvironmentId}/decommission:
    post:
      operationId: decommissionBurstEnvironment
      summary: Tear it down
      description: '**Refused unless the environment is `reconciled`.** An environment torn down before
        its orders reach the permanent platform has lost real money and real tickets, and **`decommissioned`
        is only reachable through `reconciled`** for that reason.


        **Automatic when `autoDecommission` is set.** $24 for two hours, $282 for a day, $8,587 for a
        month — the risk is forgetting, so this is a mechanism rather than somebody''s job.'
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - *id003
      - *id002
      responses:
        '200':
          description: Decommissioned
          content:
            application/json:
              schema: *id001
        '409':
          description: Not reconciled — orders would be lost
