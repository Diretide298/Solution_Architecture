      type: string
      description: 'Two deployment locations (ADR-0017, amended by ADR-0046). `shared` is the default;
        the others exist because a client asked or a law requires it.


        **On-premise is two configurations, not one (ADR-0046).** `onPremiseIsolated` keeps no
        channel to TICVAI — updates are pull-initiated or physically delivered, licensing is a
        signed file, support is blind. `onPremiseConnected` keeps an outbound control channel and
        is reachable, updatable and licensable in the ordinary way. The channel carries control
        traffic only and no natural person (ADR-0043); **AI inference is data, not control**, so
        connectivity alone does not grant the assistant.


        There is no `hybrid`. The RFP''s third model is answered by `onPremiseConnected`; a genuine
        split workload has never been asked for and would be a new decision.



        **`burst` added 31 August.** An environment stood up for one on-sale and torn down after (CF-162
        scenario c). **It is not a jurisdiction and it is not permanent** — it holds a catalogue snapshot,
        three services of sixteen, and 17 tables of 380.


        **The other four are places data lives. This one is a place data passes through**, which is why
        it has its own lifecycle and a reconciliation obligation the others do not.'
      enum:
      - shared
      - dedicated
      - onPremiseIsolated
      - onPremiseConnected
      - controlPlane
      - burst
