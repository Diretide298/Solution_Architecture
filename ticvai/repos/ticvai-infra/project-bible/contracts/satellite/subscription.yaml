    BurstEnvironment:
      type: object
      x-ticvai-persistence: control.burst_environment
      description: '**A short-lived environment for one on-sale** (ADR-0035).


        **250,000 requests a day is 2.9 per second; 5,000 per second is 1,700 times that.** At peak the
        entire daily volume arrives in fifty seconds — this is not a bigger platform, it is the Bahrain
        shape, and it gets its own infrastructure for the duration.


        **Every order taken here must reach the permanent platform**, which is what `reconciledAt` and
        `ordersRejected` exist to prove.'
      required:
      - id
      - status
      - performanceId
      - cellName
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BurstEnvironmentStatus'
        performanceId:
          type: string
          format: uuid
          description: '**What is on sale.** `catalogue.performance` already carries `onSaleFrom` and
            `onSaleTo`, so **the trigger data exists** — this is what reads it.'
        cellName:
          type: string
          description: The permanent cell it reconciles back into.
        snapshotTakenAt:
          type: string
          format: date-time
          nullable: true
          description: "**A snapshot, not a replica.** \uD83D\uDD34 If the permanent platform changes\
            \ a price after this moment, reconciliation has to decide which one the guest paid. **That\
            \ policy is `priceDivergencePolicy` and it has no default** — somebody chooses per sale."
        priceDivergencePolicy:
          type: string
          enum:
          - honourSnapshot
          - honourCurrent
          - reject
          description: '**No default deliberately.** `honourSnapshot` is what a guest expects and may
            undercharge; `reject` is safe and turns a completed purchase into a support case.'
        sequenceHigh:
          type: integer
          description: '**The monotonic sequence, as `syncOrders` uses per device.** An environment id
            in place of a device id — the same mechanism one layer up, because a batch replay needs ordering
            rather than only deduplication.'
        ordersTaken:
          type: integer
        ordersReconciled:
          type: integer
        ordersRejected:
          type: integer
          description: '**Rejections are kept, never dropped.** `sync.rejection` exists because a till
            that loses a rejected sale silently is worse than one that reports it — the same holds for
            thirty thousand of them.'
        provisionedAt:
          type: string
          format: date-time
          nullable: true
        liveAt:
          type: string
          format: date-time
          nullable: true
        drainedAt:
          type: string
          format: date-time
          nullable: true
        reconciledAt:
          type: string
          format: date-time
          nullable: true
        decommissionedAt:
          type: string
          format: date-time
          nullable: true
        autoDecommission:
          type: boolean
          default: true
          description: '**Teardown is a mechanism, not a discipline.** $24 for a two-hour sale, $282 for
            a day, **$8,587 for a month** — the risk is not the cost, it is forgetting. Tied to `onSaleTo`
            plus a grace period rather than to somebody''s calendar.'
        graceMinutes:
          type: integer
          default: 30
          description: '**How long after the sale closes before draining.** A queue does not empty at
            the instant the last ticket sells.'
        teardownConfirmedAt:
          type: string
          format: date-time
          nullable: true
          description: '**Set by the orchestrator reporting back, not by the platform.**


            **`decommissioned` means the platform stopped caring; this means the machines are gone**,
            and those cost differently. An environment marked decommissioned whose containers are still
            billing is the $8,587 case wearing a green status.'
        usageRecordId:
          type: string
          format: uuid
          nullable: true
          description: '**What it cost, from `control.usage_record`.**


            `listBurstEnvironments` exists because *an environment nobody is looking at is the one left
            running for a month* — and **a status screen with no cost on it is a screen nobody acts on.**


            **Through the existing billing spine rather than a new one.** A burst environment is a usage
            event like any other.'
    BurstEnvironmentStatus:
      type: string
      description: '**Seven states, and `reconciling` is the one that matters.** An environment torn down
        before its orders reach the permanent platform has lost real money and real tickets — **`decommissioned`
        is only reachable through `reconciled`.**'
      enum:
      - requested
      - provisioning
      - warming
      - live
      - draining
      - reconciling
      - reconciled
      - decommissioned
      - failed
