  /visit-plans:
    post:
      operationId: generateVisitPlan
      x-ticvai-consumed-by:
        - "P01 WEB-050 Plan Your Visit"
        - "P02 GST-051 Plan"
        - "P02 GST-052 Suggested Itineraries"
      security:
      - guestAuth: []
      x-ticvai-agreed: '29 September: MOB-6 and the Block A re-plan (the Plan tab is Block A, rules planner first, AI planner agent on top; supersedes rev 3 GAP-C3 and audits R187, R209); shape follows createCart (guest-owned, permission null)'
      summary: Build a visit plan from the party, the dates and what they like
      description: >
        **The Plan tab's first answer, and it needs no AI** (29 September, MOB-6). The guest gives
        party size, each person's height or age, the dates, the pace (packed or relaxed), interests
        and cuisines; the planner returns one itinerary per day with timed items and add-ons such
        as Fast Track.

        **Each day is planned from its own venue, never from the tenant as a whole** (30 September
        client meeting, MoM 4.7, Allam's requirement). In a multi-venue tenant the guest may put
        each date at a different venue (`dayVenues`; a date not listed is at `venueId`). Every
        candidate for a day comes from **that day's venue's own published map**: its rides and
        attractions, its dining points (restaurant, cafe, food kiosk) and its retail points (shop,
        retail kiosk), and the performances dated at that venue. A preference is matched against
        the amenities of that venue only: when one park has the only Indian restaurant, a party
        that asked for `indian` gets it on that park's day and nowhere else, and a day at a park
        without one says so (`unmatchedPreferences`) rather than placing a restaurant the guest
        cannot walk to.

        **Rules, in order, per day.** (1) Candidates: the day venue's published map points that
        are destinations and have a `typicalDurationMinutes`, and the performances dated that day
        at that venue. **Retail is a candidate as F&B is** (30 September, MoM 4.7; until then only
        dining points were venue-linked): a `shop`, or a `kiosk` carrying `retailTags`, is placed
        as a `shop` stop. (2) Eligibility: a ride whose product's
        `catalogue.ProductEligibilityRule` excludes anyone in the party by height or age is
        dropped, and the reason is kept on the plan (`excluded`); a `mustIncludePointIds` point
        that is at none of the plan's venues is kept there with `notAtVenue`. (3) Scoring:
        interest tags matched, then the venue's featured order. (4) Layout: from opening time, the
        next item is the best-scoring one reachable by walking time over the published graph
        (`venuemap.path`), with the typical wait for that hour and its duration; a meal is placed
        at a dining point of the day's venue whose `cuisineTags` match, around 12:30 and 19:00, and
        where no dining point of that venue matches, at its best other dining point, with the
        unmatched cuisine recorded; a retail stop is placed when the party chose `shopping` or a
        `retailTags` value, at a retail point of the day's venue that matches, late in the day or
        on the way to the exit; `relaxed` leaves a 30-minute gap after every two items and stops
        by 18:00, `packed` fills to closing. (5) Add-ons: where the expected wait on a planned ride
        exceeds 30 minutes and the venue sells a Fast Track for it, the add-on is suggested on that
        item, never added.

        **The same inputs give the same plan**, so the guest can trust that a regenerate changes
        only what they changed. `presetKey` (or the older `preset`) gives the ready-made day
        plans of GST-052 (the same rules with preset interests and pace). **The AI planner agent refines a plan; it does
        not make the first one** (ai `requestSuggestion` kind `itinerary`): when AI is off or
        fails, this answer is the plan.

        **Owned by the guest session**, as a cart is: a signed-in guest's plan is theirs, an
        anonymous one is bound to the device session and claimed on sign-in. Nothing is held or
        sold here; `bookVisitPlan` turns the plan into cart lines.

        **Signed out, a guest builds and changes; signed in, they save, share and book** (Chinmay,
        3 October 2026, Block A business rules; CHG-RUL-003). This operation, `getVisitPlan`,
        `updateVisitPlan` and `listVisitPlanAlternatives` accept the anonymous guest session a
        device holds before sign-in (the `guestAuth` token `orders.createCart` uses), so the Plan
        tab works without an account. The plan is kept against that device session
        (`VisitPlan.sessionRef`) and is not saved to any account: it lapses with the session.
        **When the guest signs in on that device, every draft plan of the session moves to the
        account** (`subjectId` set, `sessionRef` cleared, `ownership` becomes `account`), in the
        same step as the cart is claimed, with no call from the client and with its versions
        intact. Booking (`bookVisitPlan`) needs a signed-in guest; sharing a plan is a signed-in
        act as well (no share operation is contracted yet).
      tags: [visitPlan]
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitPlanRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The plan, version 1, one day per date asked for.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitPlan' }
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '422':
          description: >
            A venue of the plan (`venueId` or a `dayVenues` venue) has no published map, or none
            of its points carries a planning duration (`venue-not-plannable`), so there is nothing
            to lay out; or a date is outside its venue's opening calendar (`venue-closed-on-date`);
            or `presetKey` names no ready-made plan of the venue (`unknown-preset`); or a
            `dayVenues` entry names a venue that is not an active venue of the caller's tenant, or
            a date that is not in `dates` (`venue-not-in-tenant`; 30 September, MoM 4.7). The
            problem names which, and for which date.
          x-ticvai-problem-types:
            - venue-not-plannable
            - venue-closed-on-date
            - unknown-preset
            - venue-not-in-tenant
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /visit-plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVisitPlan
      x-ticvai-consumed-by:
        - "P01 WEB-050 Plan Your Visit"
        - "P02 GST-053 Your Plan"
        - "P02 GST-054 AI Planner"
        - "P02 GST-059 Plan in Progress"
      security:
      - guestAuth: []
      x-ticvai-agreed: '29 September: MOB-6 (Plan tab Block A); shape follows getVenueMap (version query)'
      summary: A visit plan, at its current version or an earlier one
      description: >
        The plan with its days and items (29 September, MOB-6). **`version` reads an earlier
        version**, which is what lets GST-053 show what undo would restore before the guest
        commits to it. Only the guest session that owns the plan may read it (404 otherwise,
        never 403, so a plan id reveals nothing).
      tags: [visitPlan]
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: primary
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
          description: Absent means the current version.
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitPlan' }
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: updateVisitPlan
      x-ticvai-consumed-by:
        - "P01 WEB-050 Plan Your Visit"
        - "P02 GST-053 Your Plan"
        - "P02 GST-054 AI Planner"
        - "P02 GST-059 Plan in Progress"
      security:
      - guestAuth: []
      x-ticvai-agreed: '29 September: MOB-6 (swap, remove, add and undo on GST-053); shape follows setVenuePoint (optimistic version)'
      summary: Swap, remove, add, move or undo, as a new version
      description: >
        **Every change is a new version, so undo is a change too** (29 September, MOB-6). The body
        names the version it was made against (`baseVersion`) and a list of changes: `swap` an
        item for an alternative from `listVisitPlanAlternatives`, `remove`, `add` a point or a
        performance, `move` an item to another time, `addAddOn` or `removeAddOn` an add-on on an
        item, or `revertTo` an earlier version. The server
        re-lays the affected day with the same rules as `generateVisitPlan`, so the times after a
        change still add up, and returns the new current version.

        **A stale `baseVersion` is refused 409 `plan-version-conflict`** rather than merged: the
        AI planner agent and the guest can both change a plan, and a change made against a plan
        the guest no longer sees is a change they did not choose.

        **The AI planner agent calls this as the guest** (ai `setAiTool`, toolKey
        `venue-map.updateVisitPlan`): the agent's proposal becomes a version the guest can undo.
        AI never writes the plan tables itself (ADR-0020).

        **A day keeps to its venue** (30 September client meeting, MoM 4.7). An `add` or `swap`
        may only name a point on the published map of that day's venue, or a performance dated
        at that venue; anything else is refused 422 `point-not-at-day-venue`, whoever sends it.
        This is the backstop for the AI planner agent: a restaurant or shop it names from
        another park never reaches the plan. Moving a day to another venue is a new plan from
        changed answers (`generateVisitPlan` with `dayVenues`), not a change here.

        **Add-ons are changes too** (Chinmay, 3 October 2026, Block A business rules, GST-053;
        CHG-RUL-009). `addAddOn` puts an add-on the venue sells for that stop (`addOnProductId`,
        e.g. Fast Track on a ride, a photo pass) on an item, whether or not the planner
        suggested it; `removeAddOn` takes one off. `acceptAddOn` and `declineAddOn` still answer
        the planner's own suggestion (`addOnSuggestion`). An add-on not sold for that stop's
        product is refused 422 `add-on-not-offered`. **Nothing is priced on the plan**: the add-on
        is priced when the plan is booked (`bookVisitPlan`, by `addCartLine`). Allowed in an
        anonymous session, like every change here.
      tags: [visitPlan]
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitPlanUpdate' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The new current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitPlan' }
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '409':
          description: >
            `baseVersion` is not the current version (`plan-version-conflict`), or the plan is
            already `booked` (`plan-booked`; a booked plan is read-only, generate a new one).
          x-ticvai-problem-types:
            - plan-version-conflict
            - plan-booked
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: >
            A change names an item not on the plan, a `revertTo` version that does not exist, or a
            point the party is not eligible for (`item-not-eligible`, with the rule that excludes);
            or an `add` or `swap` names a point or performance that is not at that day's venue
            (`point-not-at-day-venue`, naming the day's venue; 30 September, MoM 4.7).
          x-ticvai-problem-types:
            - item-not-eligible
            - point-not-at-day-venue
            - add-on-not-offered
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /visit-plans/{planId}/items/{itemId}/alternatives:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listVisitPlanAlternatives
      x-ticvai-consumed-by:
        - "P01 WEB-050 Plan Your Visit"
        - "P02 GST-053 Your Plan"
        - "P02 GST-059 Plan in Progress"
      security:
      - guestAuth: []
      x-ticvai-agreed: '29 September: MOB-6 (swap on GST-053); shape follows listForecastDefinitions (paged)'
      summary: What could take this item's place
      description: >
        **The swap sheet** (29 September, MOB-6): points and performances the whole party is
        eligible for that fit the item's slot, best first by interest match, then by the time
        lost to walking and the expected wait. Each carries why it was offered, so the sheet can
        say *"Same thrill level, 4 minutes closer"*. Computed on read, never stored; choosing one
        is an `updateVisitPlan` `swap`.

        **Only from the item's day venue** (30 September client meeting, MoM 4.7): alternatives
        are points on that venue's published map and performances dated there, never another
        venue of the tenant, so a swap cannot move a meal or a shop to a park the party is not in
        that day. `kind=shop` returns the venue's retail points, shops and retail kiosks alike;
        `kind=meal` its dining points, food kiosks included.
      tags: [visitPlan]
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [attraction, show, meal, shop, rest] }
          description: >
            Only alternatives of this kind. Absent means the item's own kind. `shop` is retail
            (a shop or a retail kiosk), `meal` is dining (a restaurant, cafe or food kiosk).
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Alternatives, best first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/VisitPlanAlternative' }
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /visit-plans/{planId}/booking:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: bookVisitPlan
      x-ticvai-consumed-by:
        - "P01 WEB-050 Plan Your Visit"
        - "P02 GST-053 Your Plan"
      security:
      - guestAuth: []
      x-ticvai-agreed: '29 September: MOB-6 ("Book this plan" to GST-041); shape follows addCartLine, whose rules it applies line by line'
      summary: Book this plan — turn it into cart lines
      description: >
        **"Book this plan"** (29 September, MOB-6). For each item that is bought (an admission per
        day, a timed attraction, a show performance, a meal combo, an accepted Fast Track add-on)
        the server adds a line to the guest's cart **by the orders service's `addCartLine`, with
        its rules unchanged**: the 15-minute lease, the capacity refusal, the seat limit, the
        info-only refusal. Free items (a walk-up ride, a toilet, a photo spot) add nothing.
        Quantities come from the party: one admission per person by their age band's variant,
        per day, **for that day's venue** (`VisitPlan.days[].venueId`; 30 September, MoM 4.7), so
        a two-park plan books each park's own admission.

        **The cart handoff.** With `cartId`, lines are added to that cart; without it a cart is
        created for the venue and the guest channel (`orders.createCart`), exactly as the Buy
        tickets button would. The response is the cart id, the lines added and each item that
        could not be added with the `addCartLine` refusal it met (`soldOutForSession`,
        `productInfoOnly`, ...). **A partly booked plan is still a success**: the guest goes to
        GST-041 with what was added and the plan marks the rest, rather than losing the whole
        plan to one sold-out show. Nothing is paid here; checkout is `orders.checkoutCart`.

        The plan moves to `booked` and keeps `cartId`, so reopening it from Tickets shows what was
        bought. `baseVersion` must be current (409 as `updateVisitPlan`).

        **Sign in to book** (Chinmay, 3 October 2026, Block A business rules; CHG-RUL-003). An
        anonymous device session is refused `403 sign-in-required` and nothing is added; the app
        asks the guest to sign in, the plan moves to the account (`generateVisitPlan`), and the
        guest books it. Add-ons on the plan (`addOnProductIds`, `addOnAccepted`) are priced here, at
        booking, by the lines `addCartLine` creates; the plan itself carries no price.
      tags: [visitPlan]
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience: [guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion:
                  type: integer
                  minimum: 1
                  description: The version the guest is looking at.
                cartId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The guest's open cart. Null creates one.
                itemIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Only these items. Empty books every bookable item of every day.
                includeAddOns:
                  type: boolean
                  default: true
                  description: Also add the add-ons the guest accepted on the plan (`VisitPlanItem.addOnAccepted`).
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Lines added, and what could not be
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitPlanBooking' }
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '409':
          description: >
            `baseVersion` is not current (`plan-version-conflict`), or the cart is not the caller's
            or is no longer open (`cart-not-open`). Refusals of single lines are not a 409; they
            are listed in `VisitPlanBooking.notAdded`.
          x-ticvai-problem-types:
            - plan-version-conflict
            - cart-not-open
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: >
            Nothing on the plan could be added (`nothing-bookable`); the problem lists each item's
            refusal, so the guest is told why rather than taken to an empty cart.
          x-ticvai-problem-types:
            - nothing-bookable
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '403':
          description: >
            The caller is an anonymous device session (`sign-in-required`; CHG-RUL-003). Booking
            is for a signed-in guest; the plan moves to the account on sign-in.
          x-ticvai-problem-types:
            - sign-in-required
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (common.yaml bearerAuth). Added 29 September (system-design review SD-054).
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
  # **Server-owned fields are `readOnly`.** createVenueMap, setVenuePoint and the two accept
  # operations take these schemas as their body, and without the marks a client had to invent the
  # id, the status and the scope path. OpenAPI 3.1: a `readOnly` property listed in `required` is
  # required in responses only, and a client that sends one has it ignored. Status and versions
  # move through the operations that own them (publish, closure).
  #
  # **Draft and published are stored apart.** `venuemap.point` and `venuemap.path` hold the
  # working draft; each publish copies them into a `VenueMapVersion` snapshot, and a guest reads a
  # snapshot. Closures sit on the path row and apply to both.
  schemas:
    VisitPlanRequest:
      type: object
      x-ticvai-persistence: none — request only; kept as `inputs` on venuemap.visit_plan
      description: >
        What `generateVisitPlan` takes (29 September, MOB-6): the Plan tab's form on GST-051 and
        WEB-050.
      required: [venueId, dates, party]
      properties:
        venueId:
          type: string
          format: uuid
          description: >
            The venue the guest picked in the app (GST-001 / WEB-001), which scopes the plan. Every
            date is planned at this venue unless `dayVenues` puts it somewhere else.
        dayVenues:
          type: array
          maxItems: 7
          description: >
            **Which venue on which date, in a multi-venue tenant** (30 September client meeting,
            MoM 4.7, Allam's requirement). One entry per date that is not at `venueId`; each date
            of `dates` at most once. Each venue must be an active venue of the caller's tenant (the
            options `getTenantAppStatus.venues` lists), else 422 `venue-not-in-tenant`. **Each day
            is then planned from that venue's own published map only**: its rides, its dining and
            its retail points, never another venue's.
          items:
            type: object
            required: [date, venueId]
            properties:
              date: { type: string, format: date }
              venueId: { type: string, format: uuid }
        dates:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: string, format: date }
        party:
          type: array
          minItems: 1
          maxItems: 20
          description: >
            One entry per person. **Height where the guest knows it, age otherwise**: height is what
            ride eligibility rules test, and an age band is the fallback the rule may also state.
            Nothing here identifies a person.
          items:
            type: object
            properties:
              heightCm: { type: integer, minimum: 40, maximum: 230, nullable: true }
              ageYears: { type: integer, minimum: 0, maximum: 120, nullable: true }
        pace:
          type: string
          enum: [packed, relaxed]
          default: relaxed
        interestTags:
          type: array
          maxItems: 12
          description: The same closed list as `VenuePoint.interestTags`.
          items: { type: string }
        cuisineTags:
          type: array
          maxItems: 8
          description: >
            Matched per day against the `cuisineTags` of that day's venue's dining points only
            (30 September, MoM 4.7). A cuisine no dining point of the day's venue serves is not
            forced into the day; it is reported in `VisitPlan.unmatchedPreferences`.
          items: { type: string }
        retailTags:
          type: array
          maxItems: 8
          description: >
            **Shops the party would like to visit** (30 September client meeting, MoM 4.7: retail
            and kiosk shops join F&B as venue-linked planner options), e.g. `souvenirs`, `toys`,
            `apparel`, `essentials`. Matched per day against `VenuePoint.retailTags` of that day's
            venue's shops and retail kiosks; an unmatched tag is reported, as a cuisine is.
          items: { type: string, maxLength: 30 }
        mustIncludePointIds:
          type: array
          maxItems: 10
          description: >
            Placed on a day whose venue has the point. A point at none of the plan's venues is
            listed in `VisitPlan.excluded` with `notAtVenue`, never placed on another venue's day.
          items: { type: string, format: uuid }
        preset:
          type: string
          nullable: true
          enum: [highlights, family, thrillSeeker, waterDay, relaxed, showsAndDining]
          description: >
            A ready-made day plan (GST-052 Suggested Itineraries): the preset fixes the interests and
            the pace, and the party still decides eligibility.
        presetKey:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^[a-z][a-zA-Z0-9]*$'
          description: >
            The ready-made plan the guest took on GST-052 (30 September, second wave of the 29 September pass, MOB-6): one of the
            built-in `preset` keys above, or a key of a ready-made plan the venue defines. **The same
            rules planner runs**: the preset only supplies interests, pace and must-include points,
            and the party still decides eligibility. When both `preset` and `presetKey` are sent they
            must name the same plan; `presetKey` is the field new clients send. An unknown key is
            refused 422 `unknown-preset`.
        startTime:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: When the party arrives. Null means opening time.
        locale: { type: string, nullable: true }

    VisitPlan:
      type: object
      x-ticvai-persistence: venuemap.visit_plan
      description: >
        **A guest's visit plan** (29 September, MOB-6): the Plan tab. One row per plan; its items are
        `venuemap.visit_plan_item` rows carrying the version they belong to, so every earlier version
        stays readable and undo is a new version equal to an old one. **Owned by the guest session**,
        like a cart: `subjectId` when signed in, `sessionRef` for an anonymous device session, claimed
        on sign-in.
      required: [id, venueId, status, version, days]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        venueId: { type: string, format: uuid }
        scopePath:
          type: string
          readOnly: true
          description: Derived from `venueId`.
        subjectId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: marketing.guest_profile
          description: The signed-in guest. From the session, never from the body.
        sessionRef:
          type: string
          nullable: true
          readOnly: true
          description: The anonymous device session that owns the plan until sign-in.
        ownership:
          type: string
          enum: [anonymous, account]
          readOnly: true
          description: >
            `anonymous` while the plan belongs to a device session (built and changed only; it lapses
            with the session), `account` once the guest signed in and the plan moved to their account,
            where it is saved and can be shared and booked (CHG-RUL-003).
        status:
          type: string
          enum: [draft, booked, archived]
          readOnly: true
          description: '`booked` after `bookVisitPlan`; a booked plan is read-only. `archived` after its last date.'
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: The current version. Every `updateVisitPlan` adds one.
        source:
          type: string
          enum: [rules, preset, aiAgent]
          readOnly: true
          description: >
            What produced the current version: the rules planner, a preset, or the AI planner agent
            acting for the guest. **The guest sees which**, as every AI answer says what it is based on.
        inputs:
          $ref: '#/components/schemas/VisitPlanRequest'
        mapVersion:
          type: integer
          readOnly: true
          description: The published map version the plan was laid out on.
        cartId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: orders.cart
          description: The cart `bookVisitPlan` filled.
        excluded:
          type: array
          readOnly: true
          description: >
            **What was left out and why**, e.g. a coaster excluded because one of the party is under
            its 120 cm minimum. Shown on GST-053, so the planner never looks as if it forgot.
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid }
              productId: { type: string, format: uuid, nullable: true }
              reason:
                type: string
                enum: [heightRule, ageRule, closedOnDate, notInInterests, noTime, notAtVenue]
                description: >
                  `notAtVenue` (30 September, MoM 4.7): a must-include point that is at none of the
                  plan's venues, so no day could hold it.
        unmatchedPreferences:
          type: array
          readOnly: true
          x-ticvai-persisted: false
          x-ticvai-derived: onRead
          description: >
            **A preference a day's venue cannot meet is said, never faked** (30 September client
            meeting, MoM 4.7, Allam's requirement). One entry per day and preference that no point
            of that day's venue matches: a cuisine (`cuisineTags`), a shop (`retailTags`) or an
            interest (`interestTags`). `availableAtVenueIds` names the tenant's other active venues
            whose published map does match, so GST-053 and WEB-050 can say *Indian food is at
            the other park (day 2)* instead of quietly placing a restaurant the party cannot reach.
            Empty when every preference is met on every day. Worked out on read for the version
            read (a swap can meet or lose a preference), never stored.
          items:
            type: object
            required: [date, venueId, preference, tag]
            properties:
              date: { type: string, format: date }
              venueId:
                type: string
                format: uuid
                description: The day's venue, which has no match.
              preference: { type: string, enum: [cuisine, retail, interest] }
              tag: { type: string, maxLength: 30 }
              availableAtVenueIds:
                type: array
                items: { type: string, format: uuid }
                description: Other active venues of the tenant where the tag is matched. Empty when none is.
        days:
          type: array
          readOnly: true
          description: One per date, in order. The items of the version read.
          items:
            type: object
            required: [date, venueId, items]
            properties:
              date: { type: string, format: date }
              venueId:
                type: string
                format: uuid
                description: >
                  **The venue this day is planned at** (30 September, MoM 4.7): `VisitPlanRequest.dayVenues`
                  for the date, else `venueId`. Every item of the day is at this venue.
              opensAt: { type: string, nullable: true }
              closesAt: { type: string, nullable: true }
              items:
                type: array
                items: { $ref: '#/components/schemas/VisitPlanItem' }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    VisitPlanItem:
      type: object
      x-ticvai-persistence: venuemap.visit_plan_item
      description: >
        **One timed stop on a plan day** (29 September, MOB-6). Rows are kept per `planVersion`: a
        change writes the day's items again under the new version, and an older version's rows are
        never updated.
      required: [id, planId, planVersion, date, sequence, kind, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        planId:
          type: string
          format: uuid
          readOnly: true
          x-ticvai-references: venuemap.visit_plan
        planVersion: { type: integer, minimum: 1, readOnly: true }
        date: { type: string, format: date }
        sequence: { type: integer, minimum: 1 }
        kind:
          type: string
          enum: [attraction, show, meal, shop, rest, travel]
          description: >
            `meal` is a stop at a dining point (restaurant, cafe or food kiosk); `shop` is a retail
            stop at a shop or a retail kiosk (30 September client meeting, MoM 4.7: retail is
            placed from the day venue's own points, as dining is).
        venueId:
          type: string
          format: uuid
          readOnly: true
          x-ticvai-persisted: false
          x-ticvai-derived: onRead
          description: >
            **The venue of this stop** (30 September client meeting, MoM 4.7): always the day's
            venue, and the venue whose map `pointId` is on. Carried on the item so the screens,
            `bookVisitPlan` and the AI planner agent read it rather than infer it. **Worked out
            on read, not stored**: from the plan's `inputs` (`dayVenues` for the item's date, else
            `venueId`). A stored `venue_id` would move the item rows from the plan's own row-level
            policy to a venue policy and hide a second park's items from the guest who owns the plan.
        pointId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: venuemap.point
        productId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: catalogue.product
          description: What is bought for this stop, where it is bought. Null for a free stop.
        bundleId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: promotions.bundle
          description: A meal combo or package, from the point's `featuredOffer`.
        performanceId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: catalogue.performance
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        walkMinutesBefore: { type: integer, minimum: 0, nullable: true }
        expectedWaitMinutes:
          type: integer
          minimum: 0
          nullable: true
          description: The typical wait at that hour when the plan was laid out; GST-059 replaces it with the live one.
        addOnSuggestion:
          type: object
          nullable: true
          description: A suggested add-on for this stop, e.g. Fast Track where the wait is long. Never added by itself.
          properties:
            productId: { type: string, format: uuid }
            reason: { type: string }
        addOnAccepted:
          type: boolean
          default: false
        addOnProductIds:
          type: array
          readOnly: true
          description: >
            Add-ons the guest put on this stop with `addAddOn` (CHG-RUL-009), beside an accepted
            suggestion, as catalogue product ids. No price: priced at booking.
          items: { type: string, format: uuid }
        pinned:
          type: boolean
          default: false
          description: The guest fixed this stop; a re-lay moves other stops around it.
        note: { type: string, nullable: true, maxLength: 200 }

    VisitPlanUpdate:
      type: object
      x-ticvai-persistence: none — request only; lands as a new version of venuemap.visit_plan_item rows
      description: What `updateVisitPlan` takes (29 September, MOB-6).
      required: [baseVersion, changes]
      properties:
        baseVersion: { type: integer, minimum: 1 }
        changes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, enum: [swap, remove, add, move, pin, acceptAddOn, declineAddOn, addAddOn, removeAddOn, revertTo] }
              itemId: { type: string, format: uuid, nullable: true }
              date: { type: string, format: date, nullable: true }
              pointId: { type: string, format: uuid, nullable: true }
              performanceId: { type: string, format: uuid, nullable: true }
              startsAt: { type: string, format: date-time, nullable: true }
              addOnProductId:
                type: string
                format: uuid
                nullable: true
                description: >
                  For `addAddOn` and `removeAddOn` (CHG-RUL-009): the add-on product (a catalogue
                  product sold for the item's stop, e.g. Fast Track). Priced at booking, not here.
              version:
                type: integer
                nullable: true
                description: For `revertTo`, the earlier version to restore (undo).

    VisitPlanAlternative:
      type: object
      x-ticvai-persistence: none — computed on read
      description: One candidate for a swap (29 September, MOB-6).
      required: [kind, venueId, startsAt, reason]
      properties:
        kind: { type: string, enum: [attraction, show, meal, shop, rest] }
        venueId:
          type: string
          format: uuid
          description: The item's day venue; an alternative is never from another venue (30 September, MoM 4.7).
        pointId: { type: string, format: uuid, nullable: true }
        productId: { type: string, format: uuid, nullable: true }
        performanceId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        walkMinutes: { type: integer, nullable: true }
        expectedWaitMinutes: { type: integer, nullable: true }
        matchedInterests: { type: array, items: { type: string } }
        reason:
          type: string
          description: Why it is offered, in words the sheet shows, e.g. *Same thrill level, 4 minutes closer*.

    VisitPlanBooking:
      type: object
      x-ticvai-persistence: none — computed; the lines are orders.cart_line rows
      description: 'What `bookVisitPlan` returns (29 September, MOB-6): the cart handoff.'
      required: [planId, cartId, added, notAdded]
      properties:
        planId: { type: string, format: uuid }
        cartId: { type: string, format: uuid }
        added:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              cartLineId: { type: string, format: uuid }
              leaseExpiresAt: { type: string, format: date-time, nullable: true }
        notAdded:
          type: array
          description: Items that could not be added, with the `addCartLine` refusal each met.
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              reason:
                type: string
                description: The orders `CartProblem` code, e.g. `soldOutForSession`, `productInfoOnly`, `seatLimitExceeded`.
        freeItems:
          type: integer
          description: Stops that need nothing bought.
    BookableVenueMaps:
      type: object
      description: >
        What `listBookableVenueMaps` returns: the published maps of one venue that carry bookable
        spots (decided 29 September, readiness close-out). **Bounded by the venue**: a venue has a
        handful of maps, so the list is capped at 50 rather than paged.
      required: [venueId, maps]
      properties:
        venueId: { type: string, format: uuid }
        maps:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/BookableVenueMapRef' }
    BookableVenueMapRef:
      type: object
      description: >
        One published map with bookable spots on it: enough to pick it and call `getVenueMap`
        (with `publishedVersion`) and `resources.getMapResourceAvailability`.
      required: [mapId, name, kind, publishedVersion, placedResourceCount]
      properties:
        mapId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [park, floor, zone, parking] }
        floorLevel: { type: integer, nullable: true }
        publishedVersion:
          type: integer
          description: The `VenueMap.publishedVersion` a guest is served; send it to `getVenueMap` as `version`.
        placedResourceCount:
          type: integer
          minimum: 1
          description: Placed resources on the published version.
        kinds:
          type: array
          description: The kinds of spot on this map, e.g. `[cabana, lounger]`, for the picker's chips.
          items: { type: string, enum: [cabana, lounger, table, pitch, other] }
    VenueMap:
      type: object
      x-ticvai-persistence: "venuemap.map"
      description: >
        A park map, or a floor plan. **Several per venue** — a guest on the second floor should not
        be shown the ground floor's toilets.
      required: [id, name, venueId, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        venueId: { type: string, format: uuid }
        scopePath:
          type: string
          readOnly: true
          description: Derived from `venueId`. Not sent by a client.
        kind: { type: string, enum: [park, floor, zone, parking] }
        floorLevel: { type: integer, nullable: true }
        status:
          type: string
          enum: [draft, published, archived]
          readOnly: true
          description: >
            `draft` on create. Moves through `publishVenueMap` (`states/venue-map.yaml`), never by
            sending a value.
        publishedVersion:
          type: integer
          nullable: true
          readOnly: true
          description: >
            The `VenueMapVersion.version` guests are served. Null until the first publish.
        graphVersion:
          type: integer
          readOnly: true
          description: >
            **Bumped by a publish or a closure**, and returned as `VenueMapGraph.version`. Separate
            from `publishedVersion` because a closure changes the routes without creating a map
            version, and a closure that looked like a publish would lie about what changed.
        isGeoreferenced:
          type: boolean
          readOnly: true
          description: >
            **Whether a guest can be located on it.** Without a georeference the map is a picture —
            useful, and not navigable.
        baseAssetId:
          type: string
          format: uuid
          nullable: true
          description: >
            **The illustrated map a guest actually sees**, held in `assets` like any other media.

            **This is not the CAD drawing.** The drawing gives geometry — where things are, and how
            they connect. The base image is a designed illustration with the venue's own styling,
            and the two are different artefacts that happen to describe the same place. A park hands
            you an architect's plan and a beautiful painted map, and **the guest wants the second
            while the platform needs the first.**

            Null is valid. A map with geometry and no illustration renders as shapes — plain, and
            navigable.
          x-ticvai-references: assets.MediaAsset
        baseImageAlignment:
          type: object
          nullable: true
          description: >
            **How the illustration lines up with the geometry.** They are drawn at different scales
            by different people, and a point placed on the plan lands in the wrong place on the
            painting unless something reconciles them.

            Two known points is enough. **Without this the illustration is a picture behind the
            map rather than the map itself.**
          properties:
            imageWidthPx: { type: integer }
            imageHeightPx: { type: integer }
            anchors:
              type: array
              minItems: 2
              maxItems: 4
              items:
                type: object
                properties:
                  planX: { type: number }
                  planY: { type: number }
                  imageX: { type: number }
                  imageY: { type: number }
        tileSetRef:
          type: string
          nullable: true
          readOnly: true
          description: >
            Where a base image is large enough to need zoom levels. **A 12,000-pixel park map is
            not something a phone downloads on arrival**, and a guest opening the map on venue wifi
            at the gate is the worst moment to send twenty megabytes.

            Generated from the base asset. Null means the image is small enough to serve whole.
        boundsGeoJson: { type: string, nullable: true }
        graphStatus:
          type: string
          readOnly: true
          enum: [notBuilt, connected, disconnected, partial]
          description: >
            **Whether every public point can actually be reached.** Computed at publish.

            `disconnected` means a point has no path to it at all — a toilet nobody can walk to is
            a toilet that does not exist. `partial` means every point is reachable and at least one
            only by steps, which is a different and quieter failure: **the map works until a
            wheelchair user opens it.**

    VenueMapDetail:
      type: object
      description: 19.2.55. **The whole map in one call**, so a client caches it and filters locally.
      properties:
        version:
          type: integer
          nullable: true
          readOnly: true
          description: >
            **The published version these points and paths belong to**, which is the number a
            client caches and sends back as `version`. It can differ from `map.publishedVersion`
            when an older version was asked for. Null when the draft was read.
        map: { $ref: '#/components/schemas/VenueMap' }
        points:
          type: array
          items: { $ref: '#/components/schemas/VenuePoint' }
        paths:
          type: array
          items: { $ref: '#/components/schemas/VenuePath' }
        resources:
          type: array
          description: >
            The bookable resources placed on this version of the map (rev 3 REV3-15). Empty on a map
            that carries none.
          items: { $ref: '#/components/schemas/PlacedResource' }

    VenuePoint:
      type: object
      x-ticvai-persistence: "venuemap.point"
      description: >
        19.2.57 to 19.2.60. **What a venue places on the map**, and what a guest taps.
      required: [id, mapId, kind, name, position]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        mapId:
          type: string
          format: uuid
          readOnly: true
          description: From the path of the operation that writes the point.
        kind:
          type: string
          enum: [ride, attraction, show, restaurant, cafe, shop, kiosk, toilet, babyCare,
                 prayerRoom, firstAid, atm, lockers, entrance, exit, emergencyExit, assemblyPoint,
                 parking, guestServices, smokingArea, waterFountain, chargingPoint, photoSpot,
                 junction, other]
          description: >
            **A closed set, and `emergencyExit` is separate from `exit` on purpose.** An exit is
            where a guest leaves; an emergency exit is where they are sent, and a map that cannot
            tell them apart is a map that routes a normal departure through a fire door.

            **`junction` is the one that is not a point of interest.** A path connects two points,
            so a fork in a walkway with nothing at it still needs a node — otherwise every bend has
            to be named as a destination, and a guest browsing the map sees forty entries called
            *Path junction 12*.

            **Junctions are hidden from guests and present in the graph.** Generated by extraction
            where paths meet; a venue never places one by hand.
        name:
          type: string
          x-ticvai-unique: venue
          description: >
            **Unique per venue** (decided 28 September, audit R108). Two points on a venue's maps
            never share a name, compared without case, so *Toilets North* names one place;
            `setVenuePoint` refuses a duplicate with `409` `duplicate-code`. Junctions are named by
            extraction and are exempt.
        nameLocalised:
          type: object
          nullable: true
          additionalProperties: { type: string }
        position:
          type: object
          required: [x, y]
          description: >
            Drawing coordinates. **Latitude and longitude are derived from the georeference**, not
            stored, so a map that is re-georeferenced does not need every point moved.
          properties:
            x: { type: number }
            y: { type: number }
        outletId:
          type: string
          format: uuid
          nullable: true
          description: >
            For a restaurant, cafe, shop or kiosk. **Tapping it should open the menu**, and that
            only works if the map knows which outlet it is.
        productId:
          type: string
          format: uuid
          nullable: true
          description: >
            For a ride or show — links to wait times and to booking. **What a guest is offered
            from any point, including a restaurant or a shop, is `featuredOffer`** (29 September,
            MOB-4); this link stays for wait times.
        accessPointId:
          type: string
          format: uuid
          nullable: true
          description: >
            For an entrance or exit. **This is what makes 3.2.64 work** — live admission statistics
            drawn on the point they came from.
        isStepFree:
          type: boolean
          default: true
          description: >
            Whether the point itself can be reached without steps. **The same name as
            `VenuePath.isStepFree`, because it is the same concept** (it was `isAccessible` until the
            26 September audit). **Placed on the point rather than inferred from the path**, because
            a step-free route to a building with steps at the door is not a step-free route.
        openingHours: { type: string, nullable: true }
        iconRef: { type: string, nullable: true }
        isActive: { type: boolean, default: true }
        isNavigable:
          type: boolean
          default: true
          description: >
            Whether a route may pass through it. **False for a point that marks a place without
            being reachable** — a stage a guest cannot walk onto, a zone label.
        isDestination:
          type: boolean
          default: true
          description: >
            **Whether a guest may be routed *to* it, and whether it appears in a list of places.**
            False for a `junction`, which exists in the graph and nowhere else.

            Separate from `isNavigable` because the two differ: a junction is navigable and not a
            destination, and a fenced landmark is a destination you can be shown but not walked
            into.
        description:
          type: object
          nullable: true
          additionalProperties: { type: string, maxLength: 1000 }
          description: >
            **What the guest reads on Item Detail** (29 September, MOB-4). Keyed by locale, like
            `nameLocalised`. One screen now serves rides, shows, restaurants and shops (GST-004 and
            GST-006 merged), and it opens from the map pin, so the point carries the words rather
            than each kind borrowing them from a different module. Set on BO-094.
        media:
          type: array
          maxItems: 12
          description: >
            **The gallery on Item Detail** (29 September, MOB-4): images and short clips from the
            asset library, first `isPrimary` shown on the map card. Assets are referenced, never
            copied, so a replaced photo changes everywhere.
          items:
            type: object
            required: [assetId, kind]
            properties:
              assetId:
                type: string
                format: uuid
                x-ticvai-references: assets.media_asset
              kind: { type: string, enum: [image, video] }
              isPrimary: { type: boolean, default: false }
              altText: { type: string, nullable: true, maxLength: 200 }
        featuredOffer:
          type: object
          nullable: true
          required: [kind, id]
          description: >
            **The product card on Item Detail, for every kind of point** (29 September, MOB-4).
            `productId` above links a ride or show to its wait times; this is what the guest is
            offered from the point, and it may be a bundle: a restaurant offers *meal combo with
            admission* (`promotions` bundle with an admission and a meal component), which checks
            out in about three steps (GST-004 → GST-056 → GST-041). A point with none shows no card.
            **Referenced, not priced here**: the card reads `catalogue.getProduct` or
            `promotions.getBundle` for the live price and availability.
          properties:
            kind: { type: string, enum: [product, bundle] }
            id:
              type: string
              format: uuid
              description: The `catalogue.product` id or the `promotions.bundle` id, by `kind`.
            label:
              type: string
              nullable: true
              maxLength: 40
              description: The button text, e.g. *Buy meal combo*. Null uses the product's own call to action.
        typicalDurationMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 600
          description: >
            **How long a visit to this point usually takes**, ride time and queue excluded (29
            September, MOB-6). The visit planner lays out a day with it; the queue comes from
            `queue.getWaitTimes` on the day. Null for a point the planner never places (a toilet).
        interestTags:
          type: array
          maxItems: 12
          description: >
            **What a guest who says they like this would like here** (29 September, MOB-6): the
            planner matches the guest's interests against these. A closed list so that the
            Plan tab's interest chips and the venue's tags are the same words.
          items:
            type: string
            enum: [thrill, family, kids, water, animals, shows, culture, shopping, dining, relaxing,
                   photo, adventure, sport, nightlife, indoor]
        cuisineTags:
          type: array
          maxItems: 8
          description: >
            **For dining points** (restaurant, cafe, kiosk; 29 September, MOB-6). The planner places
            meals at points whose cuisine the party chose, at meal times. Free text codes such as
            `arabic`, `indian`, `italian`, `fastFood`, `vegetarian`, `halal` — cuisines are too many
            to close, and a wrong enum is worse than an unmatched tag. **Read per venue**: the planner
            matches a guest's cuisine only against the points of the venue that day is at (30
            September, MoM 4.7).
          items: { type: string, maxLength: 30 }
        retailTags:
          type: array
          maxItems: 8
          description: >
            **For retail points** (shop, and a kiosk that sells goods rather than food; 30 September
            client meeting, MoM 4.7: retail and kiosk shops join F&B as venue-linked planner options).
            The planner places a shop stop at points whose tags the party chose, on the day of this
            point's venue only. Free text codes such as `souvenirs`, `toys`, `apparel`, `photo`,
            `essentials`, for the same reason as `cuisineTags`. A kiosk may carry both lists.
          items: { type: string, maxLength: 30 }

    SetVenuePointRequest:
      description: >
        What `setVenuePoint` takes: a `VenuePoint` without its server-owned fields, plus the point
        to amend. **`pointId` absent places a new point; present amends that one**, and it must be a
        point on the map in the path.
      allOf:
        - $ref: '#/components/schemas/VenuePoint'
        - type: object
          properties:
            pointId:
              type: string
              format: uuid
              nullable: true
              description: The point to amend. Absent or null places a new point.

    PlacedResource:
      type: object
      x-ticvai-persistence: "venuemap.placed_resource"
      description: >
        **A bookable resource where it stands on the map** (decided 29 September, rev 3 REV3-15 and
        GAP-C2): cabana B09 on the Beach, 15 guests, Large. The resource itself, its bookings and its
        holds live in `resources`; this row says where it is drawn and what the guest sees. Written
        into the working draft by `importVenueGeometry` or `setPlacedResource`, copied into the
        `VenueMapVersion` snapshot at publish. A guest picks one on the published map, holds it with
        `resources.createResourceHold` and buys it. **Supersedes audit R073 (c) and the 26 August
        minute for resources on an ingested map.**
      required: [id, mapId, resourceId, label, kind, zone, capacity, priceBandCode, position]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        mapId:
          type: string
          format: uuid
          readOnly: true
          description: From the path of the operation that writes it.
        resourceId:
          type: string
          format: uuid
          x-ticvai-references: resources.Resource
          description: >
            The `resources.Resource` this is. **Availability, holds and bookings are keyed by this**,
            so a republished map with the cabana moved keeps its bookings.
        label:
          type: string
          maxLength: 40
          x-ticvai-unique: map
          description: >
            What the guest sees and taps, e.g. `B09`. **Unique on the map**, compared without case
            after digit normalisation; normally the resource's `code`.
        kind:
          type: string
          enum: [cabana, lounger, table, pitch, other]
          description: A subset of `resources.ResourceKind`, the kinds a guest books from a map. A `table`
            here is a non-dining spot (a beach or event table) sold like a cabana; restaurant tables stay
            `fnb` table reservations (decided 29 September, rev 3 GAP-C2).
        zone:
          type: string
          maxLength: 80
          description: The area the guest reads it by, e.g. `Beach`, `River`, `Terrace`.
        capacity:
          type: integer
          minimum: 1
          maximum: 500
          description: Guests it takes, e.g. 15. Shown on the map and checked against the party at hold.
        priceBandCode:
          type: string
          maxLength: 40
          description: >
            The band it sells in, e.g. `Large`, one of the `priceBands` given at import. The band's
            `variantId` prices it; the map holds no price.
        variantId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: catalogue.ProductVariant
          description: Resolved from the price band. What a cart line for this resource names.
        position:
          type: object
          required: [x, y]
          description: Drawing coordinates of its label anchor, as on `VenuePoint`.
          properties:
            x: { type: number }
            y: { type: number }
        boundary:
          type: array
          nullable: true
          description: The shape drawn, as a polygon in drawing coordinates. Null for a pin.
          items:
            type: object
            properties:
              x: { type: number }
              y: { type: number }
        isBookable:
          type: boolean
          default: true
          description: >
            False keeps it on the map and off sale, e.g. a cabana kept for staff use. Shown greyed.

    SetPlacedResourceRequest:
      description: >
        What `setPlacedResource` takes: a `PlacedResource` without its server-owned fields.
        **`placedResourceId` absent places a new one; present amends that one**, as `setVenuePoint`.
      allOf:
        - $ref: '#/components/schemas/PlacedResource'
        - type: object
          properties:
            placedResourceId:
              type: string
              format: uuid
              nullable: true
              description: The placed resource to amend. Absent or null places a new one.

    VenuePath:
      type: object
      x-ticvai-persistence: "venuemap.path"
      description: >
        19.2.56. **The navigation graph.** The map supplies it; routing over it is a client concern,
        because a phone with the map cached routes offline and a server round-trip per step does
        not.
      required: [id, mapId, fromPointId, toPointId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        mapId:
          type: string
          format: uuid
          readOnly: true
          description: From the path of the operation that writes the path.
        fromPointId: { type: string, format: uuid }
        toPointId: { type: string, format: uuid }
        geometry:
          type: string
          nullable: true
          description: >
            The centreline this edge follows, as an encoded polyline. **A walkway in a drawing is a
            polygon and a route is a line down the middle of it**, so extraction thins the polygon
            to a centreline and splits it at every fork.

            Null where the path was drawn on screen as a straight connection, which is normal for a
            venue with no walkway layer.
        distanceMetres:
          type: number
          nullable: true
          readOnly: true
          description: >
            Computed by the server from `geometry` and the georeference. **Along the centreline,
            not point to point.** A path that curves round a lake is longer
            than the distance between its ends, and a guest told 80 metres who walks 200 stops
            trusting the map.

            Requires a georeference for real units; without one, distances are in drawing units and
            routing still works because **only the ratios matter to a shortest path.**
        isStepFree:
          type: boolean
          default: true
          description: >
            **The single most important attribute on this object.** A wheelchair user routed up a
            staircase has been failed by the map, not by the venue.
        isIndoor: { type: boolean, default: false }
        restrictedByPointId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Where a path is one-way, it is because of a thing on it — not because of the path.**
            Removed `isOneWay` on 18 August: a pedestrian walkway has no direction, and the three
            cases that look one-way are all a gate or a queue.

            A turnstile is one-way and `access.AccessPoint.direction` already says so. A queue line
            is one-way and `queue` owns it. **Putting the restriction on the path duplicated both
            and would have drifted from them** — a gate reconfigured to bidirectional would leave a
            path still marked one-way, and nothing would have noticed.

            Set where a path passes through an access point. The router reads the direction from
            the point.
        closedReason:
          type: string
          nullable: true
          readOnly: true
          description: >
            Set by `setPathClosure` during works or an incident, never by sending it here. **A closed path removes routes rather than hiding the
            path**, so a guest sees why rather than wondering where it went.

    PointProposal:
      type: object
      description: >
        1.4.24. **What the assistant suggests, before anyone accepts it.** Written to
        `ai.proposed_action` under ADR-0020.
      required: [shapeRef, proposedKind, confidence]
      properties:
        shapeRef: { type: string }
        proposedKind: { type: string }
        proposedName: { type: string, nullable: true }
        confidence:
          type: number
          description: >
            **Shown to the operator, and low confidence is not filtered out.** A shape the assistant
            is unsure about is the one most worth a human looking at.
        sourceLayer: { type: string, nullable: true }
        reasoning:
          type: string
          nullable: true
          description: 8.1.5b. Why it thinks so, so an operator can disagree with the reason rather than the answer.


    VenueMapGraph:
      type: object
      description: >
        19.2.56. **What a client needs to route, and nothing more.** Small enough to cache, versioned
        so a stale route is detectable.
      required: [mapId, version, nodes, edges]
      properties:
        mapId: { type: string, format: uuid }
        version:
          type: integer
          description: >
            **Bumped by a publish or a closure**, and stored as `VenueMap.graphVersion`. A client
            holding an older version knows its route may cross something that closed, and asking
            for the graph is cheaper than asking whether the graph changed.
        generatedAt: { type: string, format: date-time }
        nodes:
          type: array
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid }
              x: { type: number }
              y: { type: number }
              kind: { type: string }
              isStepFree: { type: boolean }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              distanceMetres: { type: number }
              isStepFree: { type: boolean }
              throughPointId:
                type: string
                nullable: true
                description: >
                  Where an access point restricts this edge. **The direction lives on that point**,
                  not here, so a gate reconfigured to bidirectional changes routing without a map
                  edit.
              isClosed: { type: boolean }
        components:
          type: integer
          description: >
            How many disconnected parts. **One is the answer for a park.** More than one on a map
            that should be a single site means something is unreachable and the client can say so
            without walking the graph.

    GraphValidation:
      type: object
      description: >
        **What breaks before a guest finds it.** Run at publish and on demand.
      required: [isValid, components]
      properties:
        isValid: { type: boolean }
        components: { type: integer }
        unreachablePoints:
          type: array
          description: No path at all. **Usually a point placed after the paths were drawn.**
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string }
        stepOnlyPoints:
          type: array
          description: >
            Reachable, and only by steps. **The map works perfectly until a wheelchair user opens
            it**, and nothing in the drawing makes this visible — which is the whole reason for
            this list.
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid }
              name: { type: string }
        deadEndPaths:
          type: array
          items: { type: string, format: uuid }
        criticalUnreachable:
          type: array
          description: >
            **First aid, emergency exits and assembly points that cannot be reached.** Separated
            from the rest because an unreachable gift shop is a defect and an unreachable assembly
            point is a safety finding, and a single list of two hundred items buries it.
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string }
        resourceFindings:
          type: array
          description: >
            **Placed resources a guest could not buy** (rev 3 REV3-15), named by label. Any entry
            here makes `isValid` false, and `publishVenueMap` refuses with the matching blocker.
          items:
            type: object
            required: [placedResourceId, label, reason]
            properties:
              placedResourceId: { type: string, format: uuid }
              label: { type: string }
              reason:
                type: string
                enum: [resourceUnlinked, resourcePriceBandMissing, duplicateResourceLabel]

    VenueMapImportJob:
      type: object
      x-ticvai-persistence: "venuemap.import_job"
      description: >
        **Two-phase, following `seating.ImportJob`**, and carrying its lesson: a job that finds
        nothing is not a successful job.
      required: [id, status, outcome]
      properties:
        id: { type: string, format: uuid }
        mapId: { type: string, format: uuid }
        status: { type: string, enum: [parsing, previewReady, committed, failed] }
        outcome: { type: string, enum: [parsed, parsedWithFindings, nothingFound, noLayersMatched, unreadable] }
        shapesFound: { type: integer }
        layersFound:
          type: array
          description: >
            **Every layer name in the source, decoded.** Shown whether or not extraction worked, so
            an operator maps a role by reading rather than guessing.
          items: { type: string }
        unmappedLayers:
          type: array
          items: { type: string }
        manifestRowsRead: { type: integer, nullable: true }
        resourcesFound:
          type: integer
          nullable: true
          description: >
            Bookable resource shapes found on the resource layer (rev 3 REV3-15). Null where the map
            has none.
        resourceRowsJoined:
          type: integer
          nullable: true
          description: >
            Resource manifest rows that joined a shape and a `resources.Resource`. **The number to
            check against your own count**, as `manifestRowsJoined` is for seats: 34 cabanas on the
            plan and 30 joined is four labels that differ.
        manifestRowsJoined:
          type: integer
          nullable: true
          description: >
            **The number to check against your own count.** A manifest of 396 seats that joins 220
            is the digit problem in §4, or a section code that differs by a space — and both look
            like success without this figure.
        findings:
          type: array
          description: >
            **Named against the spec**, so a finding maps to a section of
            `handoff/venue-map-input-spec.md` rather than to a stack trace.
          items:
            type: object
            required: [code, severity, message]
            properties:
              code:
                type: string
                enum: [duplicateLayerName, geometryOnLayerZero, unmappedLayer, mixedLayerContent,
                       sectionCodeMismatch, digitScriptMismatch, mergedCells, totalRowDetected,
                       manifestSectionMissingFromPlan, planSectionMissingFromManifest,
                       exitLayerNotSplit, noGeoreference, layerNameUndecodable, rasterOnly,
                       resourceLabelMissing, resourceLabelDuplicate, resourceManifestMissingFromPlan,
                       resourcePlanMissingFromManifest, resourceCodeUnmatched, resourcePriceBandUnknown]
                description: >
                  **A closed set, and each one names a rule in the spec.** Free-text findings are
                  findings a drawing office cannot act on. The six `resource*` codes check placed
                  resources (rev 3 REV3-15): a shape with no label, two with one label, a manifest
                  row with no shape or the reverse, a label with no `resources.Resource`, and a
                  price band not in `priceBands`.
              severity:
                type: string
                enum: [error, warning, info]
                description: >
                  **`warning` is the important level here.** `rasterOnly` and `noGeoreference` are
                  warnings — the map still works, with less — and treating them as errors would
                  refuse a venue that sent everything it had.
              message: { type: string }
              specSection:
                type: string
                nullable: true
                description: Which part of the spec covers it — `§2 Layers`, `§4 Digits`.
              affected:
                type: array
                description: The layers, sections or rows involved. **Named, not counted.**
                items: { type: string }

    VenueMapVersion:
      type: object
      x-ticvai-persistence: "venuemap.map_version"
      description: >
        21.2.16. **One published version of a map, kept whole.** `publishVenueMap` writes one per
        publish by copying the working draft's points and paths into `snapshot`, and
        `getVenueMap?version=` reads it back. That is how the previous version stays readable while
        the draft is edited: the draft rows change, the snapshot does not.
      required: [id, mapId, version, publishedAt, publishedByPrincipalId, snapshot]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        mapId: { type: string, format: uuid }
        version:
          type: integer
          description: One more than the version before it. `VenueMap.publishedVersion` names the current one.
        publishedAt: { type: string, format: date-time }
        publishedByPrincipalId: { type: string, format: uuid }
        note:
          type: string
          nullable: true
          maxLength: 300
          description: The `note` sent to `publishVenueMap`.
        snapshot:
          type: object
          description: >
            **The points and paths as they were published**, stored as one document. Closures are
            not in it: they sit on the path row and are applied when the graph is served.
          properties:
            points:
              type: array
              items: { $ref: '#/components/schemas/VenuePoint' }
            paths:
              type: array
              items: { $ref: '#/components/schemas/VenuePath' }
            resources:
              type: array
              description: The placed resources as they were published (rev 3 REV3-15).
              items: { $ref: '#/components/schemas/PlacedResource' }

    PathClosureResult:
      description: >
        What `setPathClosure` returns: the path, and **what a forced closure cut off**, named.
      allOf:
        - $ref: '#/components/schemas/VenuePath'
        - type: object
          properties:
            strandedPoints:
              type: array
              readOnly: true
              description: >
                Points no longer reachable because of this closure. Empty unless `force` was used.
              items: { $ref: '#/components/schemas/StrandedPoint' }

    StrandedPoint:
      type: object
      x-ticvai-persistence: none — computed from the graph
      required: [pointId, name, kind, isCritical]
      properties:
        pointId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        isCritical:
          type: boolean
          description: >
            First aid, an emergency exit or an assembly point, the same set as
            `GraphValidation.criticalUnreachable`. **The one the operator must read first.**

    PathClosureProblem:
      x-ticvai-persistence: none — error shape
      description: >
        The `409` from `setPathClosure`. Names every point the closure would strand, so the operator
        can decide whether to force it.
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason, strandedPoints]
          properties:
            refusedReason:
              type: string
              enum: [wouldStrandPoints]
            strandedPoints:
              type: array
              items: { $ref: '#/components/schemas/StrandedPoint' }

    VenueMapPublishProblem:
      x-ticvai-persistence: none — error shape
      description: >
        The `409` from `publishVenueMap`. **One entry per blocker**, each naming the point or the
        proposal, because *"cannot publish"* on four hundred points is not actionable.
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [blockers]
          properties:
            blockers:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  reason:
                    type: string
                    enum: [unresolvedProposal, brokenLink, disconnectedArea, resourceUnlinked,
                           resourcePriceBandMissing, duplicateResourceLabel]
                    description: >
                      `disconnectedArea`: the point cannot be reached from the rest of the map
                      (audit R106 (8)); `pointId` and `name` name it. The three `resource*` and
                      `duplicateResourceLabel` reasons name a placed resource by `placedResourceId`
                      and its label in `name` (rev 3 REV3-15).
                  proposalId:
                    type: string
                    format: uuid
                    nullable: true
                    description: For `unresolvedProposal`, the `ai.proposed_action` still open.
                  pointId:
                    type: string
                    format: uuid
                    nullable: true
                    description: For `brokenLink`, the point whose link no longer resolves.
                  placedResourceId:
                    type: string
                    format: uuid
                    nullable: true
                    description: For the resource reasons, the `PlacedResource` that blocks.
                  name:
                    type: string
                    nullable: true
                    description: The point's name, or the proposed name, as the operator saw it.
                  linkField:
                    type: string
                    nullable: true
                    enum: [outletId, productId, accessPointId]
                    description: For `brokenLink`, which link on the point is broken.
