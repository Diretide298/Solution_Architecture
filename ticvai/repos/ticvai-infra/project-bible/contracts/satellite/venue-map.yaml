openapi: 3.1.0
info:
  title: TICVAI — Venue map
  version: 1.0.0
  x-ticvai-screen-count: 20
  x-ticvai-tier: satellite
  x-ticvai-module: "21 — Seat Management & Venue Mapping"
  x-ticvai-platforms:
    - P01 Guest Web
    - P02 Guest App
    - P06 Venue Staff App
    - P08 Venue Management
  # Derived from screens/*.yaml on 18 August — every platform with a screen that calls an
  # operation in this contract. **Six contracts declared none**, which the viewer reports as
  # missing taxonomy and no package checker tested for.
  description: >
    **A venue map is not a seat map, and conflating them is the mistake this contract exists to
    avoid.**

    A seat map is an auditorium: sections, rows, numbered seats, each one sellable inventory. A
    venue map is a park: rides, restaurants, shops, toilets, first aid, exits, parking. **Points and
    paths on a venue map are not sold** — they are what a guest navigates by and what an operator
    watches.

    **The exception is a placed resource** (decided 29 September, rev 3 REV3-15 and GAP-C2). A venue
    map can carry cabanas, loungers, tables and other bookable resources, each with a label (B09),
    a zone (Beach), a capacity (15) and a price band (Large). They arrive the way the stadium's seats
    do in `seating`: in the drawing and a manifest, through `importVenueGeometry`, checked by
    `validateVenueMapGraph`, and live at `publishVenueMap`. A guest picks one on the map, holds it
    with `resources.createResourceHold` (an expiring hold, like a seat hold) and buys it; the whole
    map's availability for a date is one call, `resources.getMapResourceAvailability`. **This
    supersedes audit R073 (c)** ("cabanas stay staff-booked", 28 September) and the 26 August minute
    ("never a specific room by itself") for resources on an ingested map. The object, its bookings
    and its holds stay in `resources`; this contract holds where it is and what it is labelled.

    `seating` already does the first. This does the second, and they share exactly one thing: both
    are drawn by an architect and arrive as a file nobody wants to retype.

    ---

    ## The pipeline

        upload ──► extract ──► propose ──► place ──► publish
        (venue)   (deterministic)  (AI)   (venue)   (venue)

    **The split between extract and propose is deliberate and is the load-bearing decision here.**

    `importVenueGeometry` reads the file and produces shapes with layer names. It is deterministic,
    it handles the four defects CF-122 found — layer roles as lists, Arabic-Indic digits, UTF-16BE
    names, native CAD — and **it fails loudly**: a file that yields nothing reports `nothingFound`
    rather than success.

    `proposeVenueLabels` reads those shapes and suggests what each is: *this polygon by the entrance
    with the toilet layer is a restroom; this one is a ride.* It writes a proposal and stops.

    **Two failure modes, kept apart.** A mis-parsed layer and a bad suggestion look identical to a
    user if one operation does both — *"the map is wrong"* with no way to tell whether the file was
    misread or the labelling was. Separated, the extraction reports which layers it found and the
    proposal reports its confidence.

    ---

    ## Publishing

    **A map is published, not saved.** Editing a live map under a guest standing in front of it is
    how a wayfinding route ends at a wall.

    A draft is worked on freely. Publishing makes it the version guests see, and the previous
    version stays readable — a guest mid-route on version 3 finishes on version 3.

    ---

    ## What it does not do

    **No turn-by-turn routing engine.** 19.2.56 asks for venue navigation, and the map supplies the
    graph — points, paths, and which paths are step-free. **Routing over that graph is a client
    concern**, because a phone with the map cached routes offline and a server round-trip per step
    does not.

    **No indoor positioning.** Where a venue has beacons, `access.setAccessPointGeofence` already
    carries them (CF-51).

    ---

    ## The visit planner (29 September, MOB-6)

    **The Plan tab is Block A**, decided 29 September: a rules planner with the AI planner agent on
    top, superseding rev 3 GAP-C3 and audits R187 and R209. It lives here because a plan is laid out
    on the map: points with a planning duration, interest and cuisine tags, walking times over the
    published graph. `generateVisitPlan` builds it with no AI, `updateVisitPlan` changes it as a new
    version (so undo works), `listVisitPlanAlternatives` offers swaps, and `bookVisitPlan` turns it
    into cart lines through the orders service's `addCartLine`. Plans are the guest's own
    (`venuemap.visit_plan`, `venuemap.visit_plan_item`), like a cart. The AI planner agent reaches
    them only as tools called for the guest, so AI still writes nothing outside `ai.*` (ADR-0020).

    **Each day is planned from the amenities of its own venue** (30 September client meeting, MoM
    4.7, Allam's requirement). In a multi-venue tenant a plan may put each date at a different venue
    (`VisitPlanRequest.dayVenues`), and a day's rides, dining and **retail (shops and kiosks, added
    alongside F&B the same day)** come only from that venue's published map. A preference a venue
    cannot meet is reported (`VisitPlan.unmatchedPreferences`), never filled from another venue;
    every item carries its `venueId`, and `updateVisitPlan` refuses a point from another venue.

    **A point also carries what Item Detail shows** (MOB-4): a description, a gallery and a featured
    offer (a product or a bundle, for any kind of point).

    ---

    ## What a venue sends

    **`handoff/venue-map-input-spec.md` is the venue-facing document** and this contract enforces
    it. Every rule in it exists because its absence produced a named failure, and every failure
    comes back as a `code` on `VenueMapImportJob.findings` pointing at the section that covers it.

    **The short version.** Native CAD if you have it, PDF if not, raster accepted and degrading
    gracefully. Layers named for what a thing *is* — `VC-Seats` is right. Western digits in codes,
    Arabic anywhere else. A manifest of Description, Section, Row, Seat with the header on row 3.
    Two georeference points far apart. The illustrated map separately, with four alignment points.

    **Each part is independently useful and none blocks the next**, which is the property that
    matters: a venue that can only send a manifest still gets sellable seats.

servers:
  - url: https://api.ticvai.com/v1

security:
- bearerAuth: []
paths:
  /venue-maps:
    get:
      operationId: listVenueMaps
      x-ticvai-consumed-by:
        - "P08 BO-092 Venue Maps"
        - "P08 BO-1061 Platform Command Center"
      summary: Maps for this venue
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Maps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VenueMap' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createVenueMap
      x-ticvai-consumed-by:
        - "P08 BO-092 Venue Maps"
      summary: Start a map
      description: >
        A venue may have several — **a park map and a floor plan per building are different maps,
        not layers of one**, because a guest on the second floor should not be shown the ground
        floor's toilets.

        **The server owns the id, the status and the scope path.** The map is created as a
        `draft` with a server-assigned id, and `scopePath` comes from `venueId`. Those fields are
        `readOnly` on `VenueMap`; a client that sends them has them ignored.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueMap' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created as a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMap' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVenueMap
      x-ticvai-consumed-by:
        - "P01 WEB-039 Venue Map & Wait Times"
        - "P01 WEB-047 Map Booking — Cabanas & Spots"
        - "P02 GST-004 Item Detail"
        - "P02 GST-021 Interactive Map"
        - "P02 GST-074 Map Booking — Cabanas & Spots"
        - "P06 EMP-030 Venue map"
        - "P08 BO-094 Map Editor & Publish"
      # Public, with an optional token (decided 2 October, GFIX-5): a visitor browses before signing in; a guest
      # or staff token is still accepted. `{}` makes the credential optional.
      security:
      - {}
      - guestAuth: []
      - bearerAuth: []
      summary: A map with its points and paths
      description: >
        19.2.55. **The whole map in one call.** A guest app opening the map should not make one
        request per category — it caches the map and filters locally, which is also what makes it
        work with no signal in the middle of a park.

        **Three things it can return, and the caller says which.** With no parameters, the
        published version guests see. With `version`, that published version, read from its
        `VenueMapVersion` snapshot. With `draft=true`, the working draft the editor changes, which
        is what BO-094 loads. `VenueMapDetail.version` says which published version came back,
        and is null for the draft.

        **Placed resources come back with the map** (decided 29 September, rev 3 REV3-15): each
        cabana, lounger or table with its label, zone, capacity, price band and shape. What is free
        on a date is not here, because it changes by the minute and the map by the month; that is
        `resources.getMapResourceAvailability`, one call for the whole map, keyed by `resourceId`.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: version
          in: query
          schema: { type: integer }
          description: >
            Absent means the published version. **A guest mid-route on version 3 finishes on
            version 3**, so the client sends the version it cached. Ignored when `draft` is true.
        - name: draft
          in: query
          schema: { type: boolean, default: false }
          description: >
            **Read the working draft instead of a published version.** Staff only, and it needs
            `VENUE_MAP_MANAGE`, because the draft is unfinished work that must never reach a guest.
            A guest session, or a caller with only `VENUE_MAP_VIEW`, gets 403.
      responses:
        '200':
          description: >
            The published version asked for, or the draft. **A map that has never been published
            has no published version**, so without `draft=true` it returns 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMapDetail' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}/import:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: importVenueGeometry
      x-ticvai-consumed-by:
        - "P08 BO-093 Map Import & Labelling"
      summary: Read a drawing into shapes
      description: >
        21.2.1 to 21.2.4 and 1.4.24. **Deterministic, and it fails loudly.**

        Accepts what a venue's drawing office actually holds: PDF, SVG, DWG, DXF and raster.
        **Converting CAD to PDF loses the layer names this depends on**, which is why native
        formats are accepted rather than requested as exports.

        Carries every lesson CF-122 taught on the seat importer, because it is the same problem:
        **layer roles are lists** — one real file had two distinct layers both named `Layer 1`;
        **section codes are digit-normalised** — `A١` and `A1` are one place to a person and two to
        a comparison; **layer names are decoded before matching** — PDF strings arrive UTF-16BE and
        read as mojibake taken as bytes.

        **A file that yields no shapes reports `nothingFound`, not success.**

        **The file is uploaded first, through `assets`.** The drawing does not travel in this
        request: the client calls `assets.createUpload`, sends the file to the signed URL, calls
        `assets.completeUpload`, and passes the `MediaAsset.id` that returns as `sourceRef` (and the
        manifest's as `manifestRef`). Uploading needs `ASSET_LIBRARY_MANAGE` as well as this
        operation's permission.

        **Returns `202` with the job, which is still `parsing`.** Poll `getVenueMapImportJob` until
        it is `previewReady` or `failed`. The shapes it extracts go into the working draft, never
        into the published map.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, sourceRef]
              properties:
                format: { type: string, enum: [pdfPlan, svgPlan, dwgPlan, dxfPlan, rasterPlan] }
                sourceRef:
                  type: string
                  format: uuid
                  description: >
                    **The drawing, as the `MediaAsset.id` from `assets.completeUpload`.** Not a URL
                    and not a storage path; the file itself is never posted through this API.
                  x-ticvai-references: assets.MediaAsset
                layerMapping:
                  type: object
                  description: >
                    **Each role takes a list.** A drawing office names layers by habit, not by
                    convention, and a single string keeps one and drops the rest silently.

                    **Optional.** Absent, the platform matches against the accepted names in
                    `handoff/venue-map-input-spec.md` — case-insensitive, `VC-` prefix ignored, so
                    `VC-Seats`, `seats` and `Seating` all resolve. Supply this only to override a
                    match that went wrong.
                  properties:
                    buildingLayer: { type: array, items: { type: string } }
                    pathLayer:
                      type: array
                      items: { type: string }
                      description: >
                        **Optional, and the platform derives paths without it.** Where a drawing has
                        no walkway layer — which is most drawings prepared for ticketing — walkable
                        space is the **negative space**: the site boundary minus buildings, seating,
                        water and anything on a `keepOut` layer.

                        **That is geometry, not intelligence, and it is better than intelligence
                        here.** Subtraction is exact and repeatable; a model asked to guess where
                        people walk will eventually route somebody into a lake.

                        Supply the layer where you have it — an explicit walkway beats a derived
                        one, because it knows about a path across a lawn that subtraction would
                        merge into open ground.
                    zoneLayer: { type: array, items: { type: string } }
                    labelLayer: { type: array, items: { type: string } }
                    boundaryLayer: { type: array, items: { type: string } }
                    exitLayer: { type: array, items: { type: string } }
                    emergencyExitLayer:
                      type: array
                      items: { type: string }
                      description: >
                        **Separate from `exitLayer`, and drawings usually blur them.** An exit is
                        where a guest leaves; an emergency exit is where they are sent. Merged, a
                        map routes a normal departure through a fire door.
                    poiLayers:
                      type: object
                      description: >
                        Where a drawing already marks toilets, first aid and the rest. Keyed by
                        `VenuePoint.kind`. **Absent is normal** — points are placed on screen after
                        import, and the assistant proposes most of them.
                    resourceLayer:
                      type: array
                      items: { type: string }
                      description: >
                        **The bookable resources drawn on the plan** — cabanas, loungers, tables
                        (decided 29 September, rev 3 REV3-15). Each shape becomes a draft
                        `PlacedResource`, its label read from the shape's text or joined from
                        `resourceManifestRef`. Absent, the platform matches `VC-Resources`,
                        `Cabanas`, `Loungers` and `Tables`.
                    keepOutLayer:
                      type: array
                      items: { type: string }
                      description: >
                        Water, planting, back-of-house, plant rooms. **Subtracted from the walkable
                        space along with buildings**, and the difference between a usable derived
                        path network and one that routes across a lake.
                digitNormalisation:
                  type: boolean
                  default: true
                  description: >
                    **`A١` and `A1` are one section to a person and two to a computer**, and the
                    failure is silent — the seats simply do not join, and you get geometry with no
                    seats or seats with no geometry.

                    Normalised before the join. Arabic in *names* is expected and untouched; only
                    codes are normalised.
                georeference:
                  type: object
                  nullable: true
                  description: >
                    19.2.56. **Two known points turn drawing coordinates into real ones**, and
                    without it the map is a picture rather than something a guest can be located
                    on. A venue that cannot supply them still gets a usable map — it just cannot
                    show a blue dot.
                  properties:
                    originLat: { type: number }
                    originLng: { type: number }
                    scaleMetresPerUnit: { type: number }
                    rotationDegrees: { type: number, default: 0 }
                    anchors:
                      type: array
                      minItems: 2
                      maxItems: 4
                      description: >
                        **Two points far apart.** Two close together give an accurate scale and a
                        rotation that drifts across the site — which reads as a map that is right
                        near the entrance and wrong at the far end.
                      items:
                        type: object
                        properties:
                          label: { type: string }
                          planX: { type: number }
                          planY: { type: number }
                          lat: { type: number }
                          lng: { type: number }
                manifestRef:
                  type: string
                  format: uuid
                  nullable: true
                  x-ticvai-references: assets.MediaAsset
                  description: >
                    The seating manifest, where this map has seats, as the `MediaAsset.id` from
                    `assets.completeUpload`, uploaded the same way as `sourceRef`. **One sheet per section, header
                    on row 3, four columns: Description, Section, Row, Seat** — the shape the sample
                    file already uses.

                    **`Section` must match the drawing character for character**, which is what §4
                    of the spec is about.
                resourceManifestRef:
                  type: string
                  format: uuid
                  nullable: true
                  x-ticvai-references: assets.MediaAsset
                  description: >
                    **The resource manifest, where this map carries bookable resources** (decided
                    29 September, rev 3 REV3-15), uploaded like `manifestRef`. One sheet, header on
                    row 3, five columns: **Label, Kind, Zone, Capacity, Price band** (`B09`, `cabana`,
                    `Beach`, `15`, `Large`). It is the seat manifest's pattern: the drawing gives
                    where, the manifest gives what, and `Label` must match the drawing character for
                    character after digit normalisation. `Price band` names a band in
                    `priceBands` below.
                priceBands:
                  type: array
                  nullable: true
                  description: >
                    **What each price band sells as**, so a placed resource can be bought: the band
                    code the manifest uses and the `catalogue.ProductVariant` that prices it (Family 6,
                    Medium 10, Large 15, XL 20 on the Coastal Aqua map). The price is the variant's;
                    the map never holds a price of its own.
                  items:
                    type: object
                    required: [code, variantId]
                    properties:
                      code: { type: string, maxLength: 40 }
                      name: { type: string, nullable: true }
                      variantId:
                        type: string
                        format: uuid
                        x-ticvai-references: catalogue.ProductVariant
                createMissingResources:
                  type: boolean
                  default: false
                  description: >
                    Where a manifest label has no `resources.Resource` with that `code` at this
                    venue, create one through `resources.createResource` (kind, capacity and zone as
                    attributes) instead of reporting `resourceCodeUnmatched`. **Off by default**:
                    a mistyped label must not quietly become a new cabana.
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: >
            Accepted and parsing. The job's `id` is what `getVenueMapImportJob` polls.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMapImportJob' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}/import/{jobId}:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: jobId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVenueMapImportJob
      x-ticvai-consumed-by:
        - "P08 BO-093 Map Import & Labelling"
      summary: Import progress and findings
      description: >
        **The read the `202` from `importVenueGeometry` points at**, following
        `seating.getImportJob`. The screen polls it until `status` leaves `parsing`, then shows
        `outcome`, `layersFound`, `unmappedLayers` and `findings`, so an operator can tell a
        misread file from an empty one before any proposal is reviewed.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMapImportJob' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}/proposals:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acceptVenueLabelProposals
      x-ticvai-consumed-by:
        - "P08 BO-093 Map Import & Labelling"
      summary: Accept, edit or reject what the assistant suggested
      description: >
        1.4.24. **The human half of the pair.** `ai.proposeVenueLabels` writes proposals and stops;
        this is what turns an accepted one into a point.

        **The proposing operation lives in `ai` and this one lives here**, because ADR-0020 says
        only the AI contract writes AI tables — and the boundary caught this contract trying to
        write `ai.proposed_action` on the day it was drafted.

        **Accepting writes a point and does not touch the proposal.** `ai.decideProposedAction`
        closes it, because ADR-0020 holds in both directions — this contract may read an AI table and
        may not write one, and the isolation check caught that on the second attempt as well.

        **Accepted points go into the working draft**, not the published map. Guests see them
        after `publishVenueMap`. On an `edit`, the `point` sent is the operator's corrected point;
        its `id` and `mapId` are `readOnly` and the server assigns them.

        Accepting is per proposal, not per map. **An operator who must take all four hundred or
        none will take all four hundred**, and a map with a mislabelled fire exit is worse than one
        that took an afternoon.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    required: [proposalId, decision]
                    properties:
                      proposalId: { type: string, format: uuid }
                      decision: { type: string, enum: [accept, edit, reject] }
                      point: { $ref: '#/components/schemas/VenuePoint' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Applied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VenuePoint' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}/points:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setVenuePoint
      x-ticvai-consumed-by:
        - "P08 BO-094 Map Editor & Publish"
      summary: Place or amend a point of interest
      description: >
        19.2.57 to 19.2.60. **The screen a venue actually uses** — placing booths, toilets, exits,
        rides, restaurants, shops, parking, first aid, ATMs, prayer rooms and baby-care rooms on the
        map.

        **A point may link to the thing it represents.** A restaurant point carries its outlet id,
        a ride point its product id, a gate its access point. That link is what makes the map
        useful rather than decorative: **tapping a restaurant on the map should open its menu, and
        that only works if the map knows which outlet it is.**

        Unlinked points are fine and expected — a toilet is a toilet.

        **Writes the working draft, never the published map.** A point placed or moved here reaches
        guests at the next `publishVenueMap`; until then the published version keeps serving.

        **Place or amend is decided by `pointId`.** Absent, a new point is placed on this map and
        the server assigns its id. Present, that point is amended; a `pointId` that is not a point
        on this map returns 404. `VenuePoint.id` and `mapId` are `readOnly`, so a client never
        makes up an id.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
