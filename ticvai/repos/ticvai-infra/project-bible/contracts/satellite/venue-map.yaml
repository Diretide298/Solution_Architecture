  /venue-maps/{mapId}/validate-graph:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: validateVenueMapGraph
      x-ticvai-consumed-by:
        - "P08 BO-094 Map Editor & Publish"
      summary: What is unreachable, before anyone publishes it
      description: >
        **Run before publishing, and `publishVenueMap` runs it too.** A map that publishes with an
        unreachable toilet is a map that fails the first guest who needs one.

        Reports four things, and the second is the one venues get wrong:

        **Unreachable points** — no path at all. Usually a point placed after the paths were drawn.

        **Points reachable only by steps** — the map works perfectly until a wheelchair user opens
        it, and nothing in the drawing makes this visible. **This is why the check exists.**

        **Dead-end paths** — an edge to a node with no other edge, which is normally a mis-drawn
        line rather than a real cul-de-sac.

        **Orphan components** — two parts of the venue with no route between them. **Never
        publishable** (decided 28 September, audit R106 (8)): `publishVenueMap` refuses a map with
        more than one component, so a site of two buildings is mapped as two maps.

        **Placed resources are checked too** (decided 29 September, rev 3 REV3-15), the way
        `seating.validateSeatMap` checks seats before a seat map publishes: every placed resource
        has a label unique on the map, a linked `resources.Resource` and a price band with a variant
        (capacity of at least 1 is enforced on the schema). Each failure is a `resourceFindings` entry naming the label.

        **Validates the working draft**, because that is what the next publish would make live.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphValidation' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}/paths/{pathId}/closure:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: pathId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setPathClosure
      x-ticvai-consumed-by:
        - "P08 BO-019 Closures & Blackouts"
        - "P08 BO-094 Map Editor & Publish"
      summary: Close a route during works or an incident
      description: >
        **A closure is an operational act, not a map edit.** Closing a walkway for maintenance must
        not require republishing the map, and it must take effect in seconds.

        **Bumps the graph version** (`VenueMap.graphVersion`, which is separate from
        `publishedVersion`), and that is how a cached client learns its route is stale. A guest
        holding an offline route across a path that closed this morning is the case this exists
        for.

        **The closure is held on the path, by path id**, so it applies to the published graph at
        once and to the draft as well. It does not create a map version.

        Refuses a closure that would strand a point, unless forced. **A forced closure that
        strands a first-aid point warns by name**: the `200` carries `strandedPoints`, with first
        aid, emergency exits and assembly points flagged `isCritical`. Sometimes an incident makes
        stranding unavoidable, and the operator should know what they just cut off.

        **Stranded means unreachable from any public entrance** (decided 28 September, audit
        R106 (7)). A point is stranded when, with the path closed, some point of kind `entrance`
        no longer has a route to it; reachable from one entrance and not another is still
        stranded. Junctions are not counted.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isClosed]
              properties:
                isClosed: { type: boolean }
                reason:
                  type: string
                  enum: [maintenance, incident, event, weather, crowding, other]
                  description: >
                    `other` is allowed only with a `note`, which it then requires (decided
                    28 September, audit R222); refused `400` without one, and the notes are reviewed
                    quarterly so the common ones become real reasons.
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Free text. Required where the reason is `other` (audit R222).
                force:
                  type: boolean
                  default: false
                  description: Close it even though something becomes unreachable.
                expectedReopenAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Closed or reopened, with what a forced closure cut off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathClosureResult' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409':
          description: >
            **Closing this strands a point, and the response names which** in `strandedPoints`.
            *"Cannot close"* on a park with two hundred paths is not actionable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/PathClosureProblem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /venue-maps/{mapId}/publish:
    parameters:
      - name: mapId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: publishVenueMap
      x-ticvai-consumed-by:
        - "P08 BO-094 Map Editor & Publish"
      summary: Make the draft the one guests see
      description: >
        21.2.16. **A map is published, not saved.** Editing a live map under a guest standing in
        front of it is how a wayfinding route ends at a wall.

        Publishing creates a version. **The previous version stays readable** so a guest mid-route
        finishes on the version they started with.

        **What publishing stores.** The working draft's points and paths are copied into a new
        `VenueMapVersion` snapshot, `publishedVersion` moves to it and `graphVersion` is bumped.
        The draft stays as the working copy for the next round of edits. Earlier snapshots are kept,
        which is what `getVenueMap?version=` reads.

        Refuses a draft with unresolved proposals or a point linked to something that no longer
        exists — **a restaurant point pointing at a closed outlet is worse than no point**, because
        a guest walks there.

        **Refuses a draft whose graph is disconnected** (decided 28 September, audit R106 (8)).
        Where `validateVenueMapGraph` finds more than one component, or a public point with no
        path to it, the publish is refused with a `disconnectedArea` blocker per unreachable point.
        A venue made of two sites is two maps.

        **Refuses a draft with a placed resource a guest could not buy** (decided 29 September,
        rev 3 REV3-15): no linked resource (`resourceUnlinked`), no price band or a band with no
        variant (`resourcePriceBandMissing`), or a label used twice (`duplicateResourceLabel`).
        Publishing copies placed resources into the snapshot with the points and paths; from then on
        a guest can pick them. Holds and bookings on a resource survive a republish because they
        are keyed by `resourceId`, not by the placement.
      tags: [venueMap]
      x-ticvai-permission: VENUE_MAP_PUBLISH
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMap' }
        '409':
          description: >
            Unresolved proposals, a broken link, or a disconnected area (audit R106 (8)). **The reason names which point**, in
            `blockers`, because *"cannot publish"* on a map with four hundred points is not
            actionable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/VenueMapPublishProblem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

