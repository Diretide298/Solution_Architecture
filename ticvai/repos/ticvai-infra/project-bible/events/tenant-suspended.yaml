# tenant.suspended v1 — published by subscription
# Checked by tools/check-states.py against states/ and the contracts.

name: tenant.suspended
version: 1
publisher: subscription
description: A tenant has been suspended, in one of three modes.
aggregate: tenant
emittedWhen: TenantStatus active to suspended
payload:
- field: tenantId
  type: uuid
- field: mode
  type: string
  notes: readOnly, noNewSales or fullLockout
- field: reason
  type: string
- field: effectiveAt
  type: timestamp
consumers:
- context: catalogue
  purpose: Stop publishing and stop new sales
  idempotencyKey: tenantId + effectiveAt
  onFailure: retryThenDeadLetter
  isCritical: true
- context: orders
  purpose: Refuse new orders per the mode
  idempotencyKey: tenantId + effectiveAt
  onFailure: retryThenDeadLetter
  isCritical: true
- context: white-label
  purpose: Show the tenant-branded suspension notice, not a generic error
  idempotencyKey: tenantId + effectiveAt
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: '**Access validation is deliberately not a consumer.** A commercial dispute must not strand guests
  at a gate holding valid tickets, under any mode.'
