# retail.merchandisePublished v1 — published by retail
# Checked by tools/check-states.py.

name: retail.merchandisePublished
version: 1
publisher: retail
description: Merchandise is on sale.
aggregate: merchandise
emittedWhen: Merchandise published or withdrawn
payload:
- field: merchandiseId
  type: uuid
- field: venueId
  type: uuid
- field: outletIds
  type: array
- field: isWithdrawn
  type: boolean
  notes: True on withdrawal. **The index must remove it**, not merely stop updating it
- field: publishedAt
  type: timestamp
consumers:
- context: ai
  purpose: Index or remove the description. **A delisted product stays searchable.** The removal half
    is what makes this critical — recommending something a guest cannot buy is worse than not recommending
    it
  idempotencyKey: merchandiseId + publishedAt
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Product dimension
  idempotencyKey: merchandiseId + publishedAt
  onFailure: retry
  isCritical: false
- context: cache
  purpose: Drop cached answers under the affected scope. **The same event that invalidates the index
    invalidates the answer** — a cached answer that outlives a price change has misled a guest on the
    venue’s behalf, which is worse than a slow one
  idempotencyKey: scopePath+eventId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: 'Withdrawal travels on the same event rather than a second one. A separate withdrawn event is
  one a consumer can forget to subscribe to, and the failure is a shop still advertising something it
  does not sell.


  No state model emits this: merchandise publication is a field on the record, not a status enum. Same
  shape as `fnb.menu`.'
