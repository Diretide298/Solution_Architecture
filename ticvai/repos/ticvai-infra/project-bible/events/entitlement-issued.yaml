# entitlement.issued v1 — published by access
# Checked by tools/check-states.py against states/ and the contracts.

name: entitlement.issued
version: 1
publisher: access
description: A right to admission, a meal, a locker or a rental now exists.
aggregate: entitlement
emittedWhen: Issued on order.paid, or appended to existing media
emittedBy:
- access.issueOrderEntitlements
payload:
- field: entitlementId
  type: uuid
- field: orderId
  type: uuid
- field: mediaCode
  type: string
  notes: What the guest carries. Several entitlements may share one
- field: templateId
  type: uuid
- field: venueId
  type: uuid
- field: subjectId
  type: uuid
- field: validFrom
  type: timestamp
- field: validTo
  type: timestamp
- field: crossesCells
  type: boolean
  notes: True where redeemable in another region. Cross-cell must hear about it
- field: issuedAt
  type: timestamp
consumers:
- context: orders
  purpose: Complete the order when every paid line holds its entitlements, and record the ids on the order
    line (SD-026, 29 September)
  idempotencyKey: entitlementId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: access
  purpose: Add to the offline validation bundle so a gate can admit it without a network
  idempotencyKey: entitlementId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: cross-region
  purpose: Publish a redemption right where crossesCells
  idempotencyKey: entitlementId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: marketing
  purpose: Attach to the guest profile
  idempotencyKey: entitlementId
  onFailure: retry
  isCritical: false
- context: ai
  purpose: Membership conversion (a membership entitlement issued closes the conversion the recommender
    or a campaign opened) (AI system design section 3.2)
  idempotencyKey: entitlementId
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: '**Published by AccessService** (system-design review SD-033, 29 September): access.entitlement is
  AccessService''s table, so the publisher was never catalogue.


  **The access consumer is why this is critical.** An entitlement that never reaches the offline
  bundle is a guest refused at a gate holding a valid ticket, and the terminal cannot tell them why.


  No state model emits this: an entitlement is **created** already issued, by the order that bought
  it. There is no from-state, so no transition can carry the emit — the event fires on creation. `states/entitlement.yaml`
  starts at `issued` for the same reason.'
