      provenance: flow F67 step 1→2
      carries:
      - queueId
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Removed 24 August**: createQueue, updateQueue. **A handheld reads a queue and
    records a wait; it does not create one.** A queue is a venue configuration — bulk-attach residue,
    and `EMP-031` and `EMP-032` carried identical sets.'
  density: comfortable
  pattern: listDetail
  patternReason: '`listQueues` reads the population and `getQueue` reads one of them — list, select, act'
  purpose: See the queue from the floor.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: textField
        label: Venue id
        operation: listQueues
        notes: Sends `?venueId=` to `listQueues`.
        provenance: contract queue.yaml GET /queues
      - kind: toggle
        label: Open only
        operation: listQueues
        notes: Sends `?openOnly=` to `listQueues`.
        provenance: contract queue.yaml GET /queues
      - kind: dataTable
        label: Every queue
        bindsTo: Queue
        columns:
        - Queue.code
        - Queue.name
        - Queue.kind
        - Queue.notifyBeforeCallMinutes
        operation: listQueues
        provenance: contract queue.yaml GET /queues
      - kind: dataTable
        label: Every waiting guest
        bindsTo: WaitingGuest
        columns:
        - WaitingGuest.queueName
        - WaitingGuest.partyNumber
        - WaitingGuest.status
        - WaitingGuest.estimatedCallAt
        operation: listQueueEntries
        provenance: contract queue.yaml GET /queues/{queueId}/entries
    - name: contextPanel
      slot: selection
      components:
