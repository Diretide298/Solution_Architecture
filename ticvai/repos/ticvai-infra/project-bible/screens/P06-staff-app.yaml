    **The card hold is a pre-authorisation on the payment terminal** (decided 2 October 2026, Chinmay,
    batch 6, EMP-078; DEC-304; CHG-CSA-029). The terminal returns the authorisation reference, the check-out
    carries it (`RentalCheckOut.depositAuthorisationId`) and the booking stores it; **check-out is blocked
    until the pre-authorisation succeeds** (`checkOutRental` answers 409 `deposit-not-authorised`), and
    the screen says so rather than offering to continue.'
