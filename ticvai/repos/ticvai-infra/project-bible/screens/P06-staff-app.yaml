    purpose: List entries in a queue
    trigger: onAction
  - operationId: setQueueStatus
    contract: queue
    purpose: Open, pause or close a queue
    trigger: onAction
    invalidates:
    - listQueues
  - operationId: setWaitTime
    contract: queue
    purpose: Manually set a wait time
    trigger: onAction
    invalidates:
    - listQueues
  - operationId: requestSuggestion
    contract: ai
    purpose: 'Queue-balancing suggestion (kind queueBalancing): return-slot allocation and redirection'
    trigger: onAction
    provenance: build, 29 September 2026
  entryState:
    params:
    - name: queueId
      from: deepLink
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen lists them with `listQueues`
        and the user picks one; an edge that holds one may still carry it to open on that record.'
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `queueId`.'
