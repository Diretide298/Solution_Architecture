      - guestMessage
      - expectedReopenAt
    provenance: contract queue.yaml PUT /queues/{queueId}/status
  - id: formSetWaitTime
    component: modal
    trigger: Save wait time
    body: '**Collects what `setWaitTime` sends before it is called.** Required: `waitMinutes`. Optional:
