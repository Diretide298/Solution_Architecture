      - severity
      - assignedToPrincipalId
      - investigationNote
      - rootCause
      - correctiveActions
      - correctiveWorkOrderId
      - attachmentRefs
    provenance: contract maintenance.yaml PATCH /incidents/{incidentId}
  states:
    loading: The home duty list.
    error: Could not load. Names which read failed and leaves the home duty untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: Nothing matches the filter on severity, status, isReportable and the home duty are
      still there. Names the active filter and offers to clear it.
    emptyNoAccess: 'Shown when the caller lacks `REPORT_VIEW_WORKSTATION`, which `getWorkstationShift`
      requires to show this screen, and names that permission (the screen''s other reads need `INCIDENT_VIEW`
      and say so in their own panels). **Never an empty table** — that reads as *there is no data* and
