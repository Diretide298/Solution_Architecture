      - kind: secondaryButton
        label: Save incident
        operation: updateIncident
        provenance: contract maintenance.yaml PATCH /incidents/{incidentId}
  overlays:
  - id: formRecordAuthorityNotification
    component: modal
    trigger: Record authority notification
    body: '**Collects what `recordAuthorityNotification` sends before it is called.** Required: `authority`,
      `notifiedAt`. Optional: `reference`, `notifiedByPrincipalId`, `attachmentRefs`. Dismissing sends
      nothing; the screen behind is unchanged.'
    confirm:
      label: Record authority notification
      operation: recordAuthorityNotification
    dismiss:
      label: Cancel
      discards:
      - authority
      - notifiedAt
      - reference
      - notifiedByPrincipalId
      - attachmentRefs
    provenance: contract maintenance.yaml POST /incidents/{incidentId}/notify-authority
  - id: formReportIncident
    component: modal
    trigger: Report incident
    body: '**Collects what `reportIncident` sends before it is called.** Required: `id`, `kind`, `severity`,
      `venueId`, `description`, `occurredAt`, `recordedAt`. Optional: `assetId`, `locationDescription`,
      `involvedSubjectIds`, `involvedStaffPrincipalIds`, `witnessCount`, `firstAidGiven`, `emergencyServicesCalled`,
      `attachmentRefs`. Dismissing sends nothing; the screen behind is unchanged.'
