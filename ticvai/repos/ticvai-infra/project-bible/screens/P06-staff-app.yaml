- id: EMP-059
  name: Table Order, Bill & Payment Management
  module: Floor Service
  requiresModule: fnb
  wave: 1
  implementation:
    app: venue-staff-app
    route: /operations/table-order-bill-payment-management
    component: apps/venue-staff-app/src/routes/operations/TableOrderBillPaymentManagementDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - EMP-003
    exitTo:
    - EMP-058
    transitions:
    - to: EMP-058
      trigger: Live Table & Service Management
      provenance: flow F80 step 1→2
      operation: transferOrderItems
      carries:
      - ticketId
      - visitId
    - to: KIT-002
      trigger: The kitchen makes the starters and bumps them
      provenance: flow F29 step 3→4
      operation: createFnbOrder
      crossesDevice: true
      back: false
      carries:
      - ticketId
      - visitId
  notes: '**Added 20 August from the client design board.** P06 had no table or stock operations at all
    — **twenty screens of floor work with nothing behind them** — and every operation these need already
    existed. **Named in the board contents and not written up in it.** **Operations from the 24 August
    F&B build wired here** — the contract grew and the screens had not caught up, which is how 92 operations
    reached 49% of screens.'
  density: comfortable
  boardFrames:
  - FnB Board 4.dc.html#fnb-4j
  pattern: statusTracker
  patternReason: '`getBill` reads one record and nothing reads a population — the screen is about that
    one thing'
  purpose: Table Order, Bill & Payment Management — from the client design board, 20 August.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The bill
        bindsTo: Bill
        columns:
        - Bill.covers
        - Bill.subtotal
        - Bill.taxAmount
        - Bill.discountAmount
        - Bill.total
        operation: getBill
        provenance: contract fnb.yaml GET /table-visits/{visitId}/bill
      - kind: searchField
        label: Search table order, bill
        provenance: carried from the previous definition
      - kind: cardList
        notes: '**Cards rather than a table.** One thumb, arm’s length, and a person who is walking.'
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Confirm
        provenance: carried from the previous definition
    - name: actionBar
      slot: rowActions
      components:
      - kind: destructiveButton
        label: Close table visit
        operation: closeTableVisit
        provenance: contract fnb.yaml POST /table-visits/{visitId}/close
      - kind: secondaryButton
        label: Create payment
        operation: createPayment
        provenance: contract orders.yaml POST /payments
        notes: No cash tender on a handheld; "Pay cash at the till" sends the guest's bill to a till instead
          (DEC-200).
      - kind: secondaryButton
        label: Create F&B order
        operation: createFnbOrder
        provenance: contract fnb.yaml POST /fnb-orders
      - kind: secondaryButton
        label: Split bill
        operation: splitBill
        provenance: contract fnb.yaml POST /table-visits/{visitId}/bill/split
      - kind: secondaryButton
        label: Comp item
        operation: compItem
        provenance: contract fnb.yaml POST /table-visits/{visitId}/comp
      - kind: secondaryButton
        label: Transfer order items
        operation: transferOrderItems
        provenance: contract fnb.yaml POST /table-visits/{visitId}/transfer-items
      - kind: primaryButton
        label: Request bill
        operation: requestBill
        provenance: contract fnb.yaml POST /table-visits/{visitId}/request-bill
  overlays:
  - id: confirmCloseTableVisit
    component: confirmDialog
    trigger: Close table visit
    body: '**Names what `closeTableVisit` changes and what it leaves alone**, in the consequence rather
      than the verb. A table order bill this affects should be identified in the dialog, not just counted.
      **Collects what `closeTableVisit` sends before it is called.** Required: `payments`. Optional: `gratuity`.'
    provenance: contract fnb.yaml POST /table-visits/{visitId}/close
  - id: formRequestBill
    component: modal
    trigger: Request bill
    body: '**Collects what `requestBill` sends before it is called.** Required: `recordedAt`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Request bill
      operation: requestBill
    dismiss:
      label: Cancel
      discards:
      - recordedAt
    provenance: contract fnb.yaml POST /table-visits/{visitId}/request-bill
  - id: formCreatePayment
    component: modal
    trigger: Create payment
    body: '**Card, contactless, wallet or room charge; never cash.** A handheld takes no cash payment:
      cash goes to a till (decided 2 October 2026, Chinmay, batch 6, EMP-009: "No cash on handhelds; cash
      goes to a till"; DEC-200; CHG-CSP-039), and `createPayment` refuses cash from a session with no
      till (409 `cashNotOnHandheld`). Required: `orderId`, `tender`, `amount`; `id` and `recordedAt` are
      set by the app. Dismissing sends nothing.'
    bindsTo: CreatePaymentRequest
    confirm:
      label: Create payment
      operation: createPayment
    dismiss:
      label: Cancel
      discards:
      - id
      - orderId
      - tender
      - amount
      - recordedAt
      - tenderCurrency
      - tenderAmount
      - walletAuthorisationId
      - deviceId
    provenance: contract orders.yaml POST /payments
  - id: formCreateFnbOrder
    component: modal
    trigger: Create F&B order
    body: '**Collects what `createFnbOrder` sends before it is called.** Required: `id`, `outletId`, `serviceMode`,
      `lines`, `recordedAt`. Optional: `tableVisitId`. Dismissing sends nothing; the screen behind is
      unchanged.'
    bindsTo: CreateFnbOrderRequest
    confirm:
      label: Create F&B order
      operation: createFnbOrder
    dismiss:
      label: Cancel
      discards:
      - id
      - outletId
      - serviceMode
      - lines
      - recordedAt
      - tableVisitId
    provenance: contract fnb.yaml POST /fnb-orders
  - id: formSplitBill
    component: modal
    trigger: Split bill
    body: '**Collects what `splitBill` sends before it is called.** Required: `recordedAt`, `method`.
      Optional: `parts`, `amounts`, `lineAssignments`, `categoryAssignments`. Dismissing sends nothing;
      the screen behind is unchanged.'
    bindsTo: SplitBillRequest
    confirm:
      label: Split bill
      operation: splitBill
    dismiss:
      label: Cancel
      discards:
      - recordedAt
      - method
      - parts
      - amounts
      - lineAssignments
      - categoryAssignments
    provenance: contract fnb.yaml POST /table-visits/{visitId}/bill/split
  - id: formCompItem
    component: modal
    trigger: Comp item
    body: '**Collects what `compItem` sends before it is called.** Required: `orderLineId`, `recordedAt`,
      `reason`. Optional: `note`. **When the reason is Other, `note` is required** — the operation refuses
      400 without it (decided 28 September, audit R222). Dismissing sends nothing; the screen behind is
      unchanged.'
    confirm:
      label: Comp item
      operation: compItem
    dismiss:
      label: Cancel
      discards:
      - orderLineId
      - recordedAt
      - reason
      - note
    provenance: contract fnb.yaml POST /table-visits/{visitId}/comp
  - id: formTransferOrderItems
    component: modal
    trigger: Transfer order items
    body: '**Collects what `transferOrderItems` sends before it is called.** Required: `toVisitId`, `lineIds`,
      `recordedAt`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
      label: Transfer order items
      operation: transferOrderItems
    dismiss:
      label: Cancel
      discards:
      - toVisitId
      - lineIds
      - recordedAt
    provenance: contract fnb.yaml POST /table-visits/{visitId}/transfer-items
  states:
    loading: The table order bill, read by `getBill`.
    error: Could not load. Names which read failed and leaves the table order bill untouched.
    emptyFirstRun: No table order bill yet. Offers Create payment (`createPayment`).
    emptyNoAccess: 'Shown when the caller lacks `ORDER_VIEW`, which `getBill` requires to show this screen,
      and names that permission. **Never an empty table** — that reads as *there is no data* and sends
      somebody to support with the wrong question. A caller who can see the screen but lacks what an action
      needs sees that action disabled, naming its permission: `ORDER_CREATE` for `closeTableVisit`, `createPayment`,
      `createFnbOrder`; `ORDER_MODIFY` for `splitBill`, `compItem`, `transferOrderItems`, `requestBill`.'
    offline: '**Works from cache and queues what it records.** Staff walk out of coverage constantly —
      a stock count in a warehouse corner and a table order on a terrace both happen where the signal
      does not reach, and a screen that blanks there is a screen nobody uses twice.'
  apis:
  - operationId: closeTableVisit
    contract: fnb
    purpose: Settle and close a visit
    trigger: onAction
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  - operationId: createFnbOrder
    contract: fnb
    purpose: Place an F&B order
    trigger: onAction
  - operationId: splitBill
    contract: fnb
    purpose: Split a bill
    trigger: onAction
  - operationId: getBill
    contract: fnb
    purpose: Bill for a visit
    trigger: onLoad
  - operationId: compItem
    contract: fnb
    purpose: Take a line off the bill, with a reason and a name
    trigger: onAction
  - operationId: transferOrderItems
    contract: fnb
    purpose: Move items to another table's bill
    trigger: onAction
  - operationId: requestBill
    contract: fnb
    purpose: The party asked to pay
    trigger: onAction
    provenance: wiring gap, 19 September 2026 — the screen showed the noun and could not act on it
    invalidates:
    - getTableVisit
  entryState:
    params:
    - name: venueId
      from: session
    - name: visitId
      from: EMP-003
    coldEntry: '**Resolves from the session and the shift.** A handheld is signed into at the start of
      a shift, not navigated to.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-059
    derivedFrom: wireframes/reference/FnB Board 4.dc.html
    source: Claude Design F&B pack, 24 August
    note: '**Drawn by Claude Design on `FnB Board 4.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: 'Rebuilt 9 September 2026 from the 7 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
