    loading: The issue media, read by `getMediaEntitlements`.
    error: Could not load. Names which read failed and leaves the issue media untouched.
    emptyFirstRun: Nothing is on this media yet. Offers Bind media to the ticket (`setMediaBindingActivation`)
      rather than showing an empty table.
    emptyNoAccess: 'Shown when the caller lacks `ORDER_VIEW`, which `getMediaEntitlements` requires to
      show this screen, and names that permission. **Never an empty table** — that reads as *there is
      no data* and sends somebody to support with the wrong question. A caller who can see the screen
      but lacks what an action needs sees that action disabled, naming its permission: `ORDER_CREATE`
      for `appendEntitlementToMedia`; `ACCESS_POINT_CONFIGURE` for `setMediaBindingActivation`.'
    offline: Issues from the local range allocated at shift start
  apis:
  - operationId: getMediaEntitlements
    contract: orders
    purpose: What is already on this media
    trigger: onLoad
  - operationId: appendEntitlementToMedia
    contract: orders
    purpose: Add something to a ticket the guest already holds
    trigger: onAction
  - operationId: setMediaBindingActivation
    contract: access
    purpose: Bind the wristband, RFID or NFC card the guest will wear to their ticket and activate it
    trigger: onAction
    provenance: 6 October 2026 (CHG-R4-013)
    invalidates:
    - getMediaEntitlements
  entryState:
    params:
    - name: mediaCode
      from: deepLink
    coldEntry: '**A staff link opened cold resolves the thing or says plainly that it is gone.** No silent
      redirect — a supervisor following a link from an alert needs to know whether the record moved, closed
      or never existed, because those are three different next actions. **The scope is resolved from the
      session, never from the link**: a link cannot move somebody to a venue they do not hold. Arrives
      with `mediaCode`.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-036
  apisNote: 'Rebuilt 9 September 2026 from the 3 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formAppendEntitlementToMedia
    component: modal
    trigger: Append entitlement to media
    body: '**Collects what `appendEntitlementToMedia` sends before it is called.** Required: `id`, `lines`,
      `recordedAt`. Optional: `paymentMethod`, `note`. Dismissing sends nothing; the screen behind is
      unchanged.'
    bindsTo: AppendEntitlementRequest
    confirm:
      label: Append entitlement to media
      operation: appendEntitlementToMedia
    dismiss:
      label: Cancel
      discards:
      - id
      - lines
      - recordedAt
      - paymentMethod
      - note
    provenance: contract orders.yaml POST /media/{mediaCode}/entitlements
  - id: formSetMediaBindingActivation
    component: modal
    trigger: Bind media to the ticket
    body: '**Collects what `setMediaBindingActivation` sends before it is called.** Required: `virtualTicketId`
      (the guest''s ticket), `mediaKind` (wristband, RFID, NFC, physical card, temporary credential) and
      `credentialIdUid` (read by tapping or scanning the medium, typed only as a fallback). Optional:
      `captureMethod`, `activationMode` (activate now by default), `provider`, `scheduledAt`. Dismissing
      sends nothing; the screen behind is unchanged (CHG-R4-013).'
    bindsTo: MediaBindingActivationAssignmentOperationsInput
    confirm:
      label: Bind media to the ticket
      operation: setMediaBindingActivation
    dismiss:
      label: Cancel
      discards:
      - virtualTicketId
      - mediaKind
      - credentialIdUid
      - captureMethod
      - activationMode
      - provider
      - scheduledAt
    provenance: contract access.yaml PUT /media-binding-activation (CHG-R4-013)
  gaps:
  - operation: getMediaAsset
    removed: true
    why: 'Removed 6 October 2026 (CHG-R4-013): getMediaAsset reads the digital-asset library (images,
      video, documents); the media this screen issues is what the guest wears (QR, wristband, RFID or
      NFC card). Issuing it is setMediaBindingActivation (access); what is already on it is getMediaEntitlements
      (orders). Left over from CF-114, which removed the rest of the assets contract from this screen
      on 18 August.'
    source: contracts/satellite/assets.yaml#getMediaAsset | contracts/spine/access.yaml#setMediaBindingActivation
