  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written.


    **Blind close (decided 2 October 2026, Chinmay; CHG-FIN-003).** The cashier never sees the expected
    cash: not while counting, not after submitting, not as a sales or takings total from which it could
    be worked out (MoM 12 Aug 2026 section 19, DI-271; MoM 9 Sep 2026 4.18, DI-806: "if a cashier knew
    they had a small surplus, they could pocket it"). The count is submitted with `submitShiftCount`,
    which answers only what happens next (closed, with your supervisor, or awaiting close approval); the
    variance alerts the supervisors on the venue''s alerting channel and appears on BO-040. The cashier
    may add a reason and a note with every count (DI-803). A recount the supervisor asks for is counted
    blind again (DI-804). Retail practice: docs/active/research-uae-vat-and-blind-close-2-october.md.


    **No cash count for a server** (decided 2 October 2026, Chinmay; DEC-200; CHG-CSP-039; CHG-SPO-009).
    A handheld takes no cash, so a server''s End shift has no drawer and no count: it closes the service
    day (unsynced orders, open tables). The blind count and the variance acceptance on this screen are
    for a cashier whose drawer is on a till.'
  density: comfortable
  pattern: approvalInbox
  patternReason: '`approveShiftOpen` decides items that `listCashMovements` queues — every row is waiting
    for a person, so the empty state is success'
  purpose: Close out cleanly, including anything unsynced.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: queue
      components:
      - kind: dataTable
        label: Waiting for a decision
        bindsTo: CashMovement
        columns:
        - CashMovement.reference
        - CashMovement.reason
        - CashMovement.recordedAt
        - CashMovement.syncedAt
        operation: listCashMovements
        provenance: contract shift.yaml GET /shifts/{shiftId}/cash-movements
      - kind: dataTable
        label: Every shift
        bindsTo: Shift
        columns:
        - Shift.principalDisplayName
        - Shift.status
        - Shift.depositBoxCode
        - Shift.bagNumber
        operation: listShifts
        provenance: contract shift.yaml GET /shifts
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected cash movement
        bindsTo: CashMovement
        columns:
        - CashMovement.kind
        - CashMovement.amount
        - CashMovement.reference
        - CashMovement.reason
        - CashMovement.recordedAt
        operation: listCashMovements
        provenance: contract shift.yaml GET /shifts/{shiftId}/cash-movements
      - kind: detailPanel
        label: The shift
        bindsTo: Shift
        columns:
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.depositBoxCode
        - Shift.bagNumber
        operation: getShift
        provenance: contract shift.yaml GET /shifts/{shiftId}
      - kind: detailPanel
        label: The shift
        bindsTo: Shift
        columns:
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.depositBoxCode
        - Shift.bagNumber
        operation: getCurrentShift
        provenance: contract shift.yaml GET /shifts/current
    - name: actionBar
      slot: decision
      components:
      - kind: destructiveButton
        label: Close shift
        operation: submitShiftCount
        provenance: contract shift.yaml POST /shifts/{shiftId}/close
      - kind: secondaryButton
        label: Accept shift variance
        operation: acceptShiftVariance
        provenance: contract shift.yaml POST /shifts/{shiftId}/accept-variance
        permission: OVERSHORT_ACCEPT
      - kind: primaryButton
        label: Give the reason and close
        operation: giveShiftVarianceReason
        permission: SHIFT_CLOSE
        notes: 'Shown when the count''s receipt says `varianceReasonRequired`: the count differed within
          the threshold and came with no reason. Opens the reason form; never the amount or the direction
          (the client''s policy of 6 October 2026, T10.1; CHG-R4-019; CHG-FIN-003).'
        provenance: contract shift.yaml POST /shifts/{shiftId}/variance-reason
      - kind: destructiveButton
        label: Suspend shift
        operation: suspendShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/suspend
  overlays:
  - id: confirmCloseShift
    component: confirmDialog
    trigger: Close shift
    body: '**Collects what `submitShiftCount` sends.** Required: `countedCash` (by denomination), `recordedAt`.
      Optional: `cashierReason`, `notes`, `nonCashDeclared`, `releaseHeldLeases`. Says "Your count is
      final once submitted" and shows no expected figure (CHG-FIN-003).'
    provenance: contract shift.yaml POST /shifts/{shiftId}/count (CHG-FIN-003)
    bindsTo: CloseShiftRequest
    confirm:
      carries:
      - shiftId
      - countedFloat
      - cashierReason
      label: Submit count
      operation: submitShiftCount
    dismiss:
      discards: []
      label: Not yet
  - id: confirmSuspendShift
    component: confirmDialog
    trigger: Suspend shift
    body: '**Names what `suspendShift` changes and what it leaves alone**, in the consequence rather than
      the verb. A end shift this affects should be identified in the dialog, not just counted. **Collects
      what `suspendShift` sends before it is called.** Required: `recordedAt`. Optional: `reason`.'
    provenance: contract shift.yaml POST /shifts/{shiftId}/suspend
  - id: formGiveShiftVarianceReason
    component: modal
    trigger: Give the reason and close
    body: '**Collects what `giveShiftVarianceReason` sends.** Required: `reason` (till error, unrecorded
      refund, miscount, other); `note`, required with other. Says "Your count found a difference. Give
      a reason to close your shift" and never the amount or whether it is over or short: the count is
      already locked (the client''s policy of 6 October 2026, T10.1; CHG-R4-019; CHG-FIN-003). Dismissing
      sends nothing; the shift stays waiting for the reason.'
    confirm:
      label: Close shift
      operation: giveShiftVarianceReason
    dismiss:
      label: Not yet
      discards:
      - reason
      - note
    bindsTo: ShiftVarianceReasonRequest
    provenance: contract shift.yaml POST /shifts/{shiftId}/variance-reason
  - id: formAcceptShiftVariance
    component: modal
    trigger: Accept shift variance
    body: '**Collects what `acceptShiftVariance` sends before it is called.** Required: `reason`. Dismissing
      sends nothing; the screen behind is unchanged.'
    confirm:
      label: Accept shift variance
      operation: acceptShiftVariance
    dismiss:
      label: Cancel
      discards:
      - reason
    provenance: contract shift.yaml POST /shifts/{shiftId}/accept-variance
  states:
    loading: The end shift list.
    error: Could not load. Names which read failed and leaves the end shift untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: 'Never shown: `listCashMovements` takes no filter, so an empty list is always the
      first-run state above.'
    emptyNoAccess: 'Shown when the caller lacks `SHIFT_OPEN`, which `getCurrentShift` requires to show
      this screen, and names that permission (the screen''s other reads need `REPORT_VIEW_WORKSTATION`
      and say so in their own panels). **Never an empty table** — that reads as *there is no data* and
      sends somebody to support with the wrong question. A caller who can see the screen but lacks what
      an action needs sees that action disabled, naming its permission: `OVERSHORT_ACCEPT` for `acceptShiftVariance`;
      `SHIFT_CLOSE` for `submitShiftCount`; `SHIFT_SUSPEND` for `suspendShift`.'
    offline: '**Cannot close.** Closing needs the server total, and a locally computed variance is not
      a variance'
    reasonRequired: '**"Give a reason to close".** `submitShiftCount` answered `awaitingCloseApproval`
      with `varianceReasonRequired`: the count differed within the venue''s threshold and no reason came
      with it. The count is locked; the screen asks for a reason and `giveShiftVarianceReason` closes
      the shift. No amount, no over or short (the client''s policy of 6 October 2026, T10.1; CHG-R4-019;
      CHG-FIN-003).'
  apis:
  - operationId: submitShiftCount
    contract: shift
    purpose: From the flow it appears in
    trigger: onAction
  - operationId: acceptShiftVariance
    contract: shift
    purpose: Accept an over/short beyond the threshold
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: giveShiftVarianceReason
    contract: shift
    purpose: The cashier's reason for a difference within the threshold, given after the blind count is
      locked; closes the shift (the client's policy of 6 October 2026, T10.1; CHG-R4-019)
    trigger: onAction
  - operationId: getCurrentShift
    contract: shift
    purpose: The open or suspended shift on the session's workstation
    trigger: onLoad
  - operationId: getShift
    contract: shift
    purpose: Read a shift
    trigger: onLoad
  - operationId: listCashMovements
    contract: shift
    purpose: Lifts, adds and the opening float
    trigger: onLoad
  - operationId: listShifts
    contract: shift
    purpose: List shifts
    trigger: onLoad
  - operationId: suspendShift
    contract: shift
    purpose: Suspend a shift so another user can log in
    trigger: onAction
    invalidates:
    - listCashMovements
  entryState:
    params:
    - name: shiftId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - CashMovement.id
    - CashMovement.kind
    - CashMovement.amount
    - CashMovement.denominations
    - CashMovement.reference
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-009
  apisNote: 'Rebuilt 9 September 2026 from the 13 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  gaps:
  - operation: approveShiftOpen
    removed: true
