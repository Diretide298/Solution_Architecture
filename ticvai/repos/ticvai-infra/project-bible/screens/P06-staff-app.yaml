    - to: EMP-003
      trigger: Home — on duty
      provenance: 'derived — EMP-003 declares entryState.params incidentId and EMP-036 holds none of them.
        The edge carries nothing: incidentId only pre-selects (deep link or optional), and EMP-003 opens
        on its own'
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **9 assets operations removed 18 August (CF-114).** The whole media contract
    was attached to this screen. **A till adding an item to a ticket does not manage a media library**
    — it reads the asset it needs and nothing else. Same shape as CF-87, one level up: that attached sibling
    operations, this attached a whole contract.'
  density: comfortable
  pattern: statusTracker
  patternReason: '`getMediaEntitlements` reads one record and nothing reads a population — the screen
    is about that one thing'
  purpose: Give the guest something the gate can read.
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: The media entitlements
        bindsTo: MediaEntitlements
        columns:
        - MediaEntitlements.mediaCode
        - MediaEntitlements.mediaKind
        - MediaEntitlements.isValid
        - MediaEntitlements.invalidReason
        - MediaEntitlements.entitlements
        operation: getMediaEntitlements
        provenance: contract orders.yaml GET /media/{mediaCode}/entitlements
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Bind media to the ticket
        operation: setMediaBindingActivation
        notes: '**Issuing media is binding it** (6 October 2026, CHG-R4-013): the wristband, RFID or NFC
          card the guest will wear is tapped or scanned, its UID is bound to the guest''s virtual ticket
          and activated, and from then on the gate reads it. A medium already bound to another ticket
          is refused and needs authorised resolution (access `setMediaBindingActivation`).'
        provenance: contract access.yaml PUT /media-binding-activation (CHG-R4-013)
      - kind: secondaryButton
        label: Append entitlement to media
        operation: appendEntitlementToMedia
