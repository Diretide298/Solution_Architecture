      an opening float or open the drawer; F72 step 3 needs closeShift, acceptShiftVariance and listCashMovements
      (R254; design-notes correction fnb-retail EMP-009).'
    source: R254 | F72 step 3 | F08 step 8
  - operation: recordNoSale
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-008): An end-of-shift screen does not open a shift, approve
