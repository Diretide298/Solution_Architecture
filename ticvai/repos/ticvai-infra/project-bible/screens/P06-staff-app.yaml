      - description
      - occurredAt
      - recordedAt
      - assetId
      - locationDescription
      - involvedSubjectIds
      - involvedStaffPrincipalIds
      - witnessCount
      - firstAidGiven
      - emergencyServicesCalled
      - attachmentRefs
    provenance: contract maintenance.yaml POST /incidents
  - id: formUpdateIncident
    component: modal
    trigger: Save incident
    body: '**Collects what `updateIncident` sends before it is called.** Nothing in the body is required.
      Optional: `status`, `severity`, `assignedToPrincipalId`, `investigationNote`, `rootCause`, `correctiveActions`,
      `correctiveWorkOrderId`, `attachmentRefs`. Dismissing sends nothing; the screen behind is unchanged.'
    confirm:
