platform:
  code: P06
  audience: staff
  formFactor: mobileApp
  shortName: Venue Staff App
  name: Venue Staff App — Operations
  surface: staffFacing
  runtime: reactNative
  app: venue-staff-app
  appStatus: scaffolded
  offlineCapable: true
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: iOS / Android native
    distribution: MDM, not a public store
    bundleUpdate: on launch
    hosting: in-cell
    storeReview: false
    deviceOwnership: venue-owned or BYOD
    networkAssumption: venue wifi, dead zones expected
    releaseCadence: fortnightly
  screenCount: 96
  designReferences:
  - path: sources/designs/TICVAI_Employee_App_UI_Reference_1.pdf
    note: Employee app reference — dark theme, and the Home · Tasks · Scan · AI · More nav that CF-41
      is about.
  operator: venue
  directions:
  - ltr
  - rtl
  wireframeBoard: wireframes/P06 Venue Staff App.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: venue-staff-mobile
    name: TICVAI Venue Staff
    shell: mobile
    siblings:
    - P07
    note: '**Both offline-capable, both carried rather than sat at.** They cannot fold into venue management,
      which is online desktop web, and they share 69% with each other.'
    decided: 10 September 2026
screens:
- id: EMP-001
  name: Sign in
  module: Operations
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-staff-app
    route: /operations/sign-in
    component: apps/venue-staff-app/src/routes/operations/SignInDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - EMP-002
    - EMP-003
    - EMP-048
    inferred: true
    fromFlows: true
    isEntryPoint: true
    transitions:
    - to: EMP-003
      trigger: Home — on duty
      provenance: structural — EMP-001 is P06's home screen and its exits are its launcher
    - to: EMP-048
      trigger: Opening checklist
      provenance: structural — EMP-001 is P06's home screen and its exits are its launcher
    - to: EMP-002
      trigger: Selects venue and role
      provenance: flow F08 step 1→2, F64 step 1→2
  notes: '**Rebuilt as a sign-in form on 2 October 2026 (CHG-DOOR-002/003; Chinmay, 2 October 2026: fix
    the Block A blockers now).** It was generated as a list over active sessions, MFA methods and SSO
    providers with Force logout and Revoke all sessions on the door, which a person who is not yet signed
    in can never use (platform-foundation process notes). The sequence is the same on every staff and
    partner door: credentials (or the organisation''s SSO) -> the authentication code only when a permission
    demands it (R135) -> the role prompt when several roles are held (ADR-0003) -> the landing. Managing
    sessions moved to the staff directory (BO-053); managing MFA methods stays on each app''s own security
    or profile screen. On the handheld the role and venue prompt is EMP-002, which follows when several
    roles or venues are held; one of each goes straight to EMP-003. Enrolling a method happens on EMP-042,
    not at a shared device.'
  density: comfortable
  pattern: form
  patternReason: 'A sign-in on a shared handheld: number and PIN, the venue''s SSO where it has one, the
    code only when a permission demands it - a form, not a list.'
  purpose: Get an employee onto a shared handheld fast, and resolve the session every other screen of
    the staff app reads.
  layout:
    template: form
    regions:
    - name: contentBody
      slot: form
      components:
      - kind: textField
        label: Employee number or username
        notes: Goes into `LoginRequest.username`.
      - kind: textField
        label: PIN or password
        notes: 'Goes into `LoginRequest.credential`, `method: pin` on the handheld (bounded by the device''s
          `workstationId`, which the device sends; CHG-DOOR-001) or `method: password` for a person with
          no PIN. Large keypad.'
      - kind: primaryButton
        label: Sign in
        operation: login
        notes: 'Sends `LoginRequest`. 409 means this person already holds a session elsewhere (audit R184):
          the screen says where and since when, and that only a holder of SESSION_FORCE_LOGOUT can end
          it; signing in never ends the other session.'
        provenance: contract identity.yaml POST /auth/login
      - kind: cardList
        label: Sign in with your organisation
        bindsTo: SsoProvider
        columns:
        - SsoProvider.displayName
        - SsoProvider.protocol
        - SsoProvider.isEnforced
        operation: listSsoProviders
        notes: One button per identity provider the venue configured; **absent, not disabled, when there
          is none.** Read before sign-in, unauthenticated. When a provider `isEnforced` for this person,
          the password field is hidden and only this remains.
        provenance: contract identity.yaml GET /auth/sso/providers
      - kind: secondaryButton
        label: Continue with your organisation
        operation: startSsoAuthorization
        notes: Hands off to the identity provider with this door's `redirectUri`; nothing is typed here.
          Staff and partner doors only, never a guest door (audit R167).
        provenance: contract identity.yaml GET /auth/sso/{providerId}/authorize
      - kind: progressIndicator
        label: Finishing sign-in with your organisation
        operation: completeSsoAuthorization
        notes: 'On the provider''s redirect back (`code` and `state` from the redirect, never typed).
          Returns the same `LoginResponse` as `login`, so the second factor and the role prompt follow
          exactly as below. 403: the provider proved who this is and no group maps to a role in this tenant,
          which grants nothing.'
        provenance: contract identity.yaml POST /auth/sso/{providerId}/callback
    - name: secondFactor
      slot: form
      components:
      - kind: textField
        label: Authentication code
        operation: verifyMfaChallenge
        notes: 'Shown only when the sign-in comes back `requiresMfa`: the person holds a permission in
          `PasswordPolicy.mfaRequiredForPermissions` (ROLE_MANAGE, LEDGER_APPROVE, every PLATFORM_* permission,
          or one the tenant added; audit R135). Six digits from the authenticator app.'
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: primaryButton
        label: Verify
        operation: verifyMfaChallenge
        notes: Completes the sign-in; the session is usable only after it. Five wrong codes lock step-up
          for the policy's lockout minutes, never permanently (audit R126 (6)), and the screen says until
          when.
        provenance: contract identity.yaml POST /auth/mfa/challenge/{challengeId}/verify
      - kind: secondaryButton
        label: Email me a code instead
        operation: createMfaChallenge
        notes: '`action: signIn`. The authenticator app is the primary method and an emailed code the
          fallback (audit R126 (5)).'
        provenance: contract identity.yaml POST /auth/mfa/challenge
    - name: actionBar
      slot: rowActions
      components:
      - kind: banner
        label: Signed in as
        operation: getCurrentSession
        notes: 'Read once the sign-in is complete (after the code and the role, where asked): the person''s
          name and role, then straight on. One role and one venue go to EMP-003; several go to EMP-002
          first.'
        provenance: contract identity.yaml GET /auth/session
      - kind: textField
        label: New PIN
        operation: changeOwnCredential
        notes: 'Only when the PIN was reset and is temporary: a new one twice before anything else; the
          last five cannot be reused (audit R132).'
        provenance: contract identity.yaml POST /auth/credential
      - kind: secondaryButton
        label: Choose venue and role
        operation: selectRole
        notes: 'Shown when `LoginResponse.requiresRoleSelection` is true: a steward takes a venue and
          a role (ADR-0003; F64 step 1; design-notes correction platform-foundation EMP-001). EMP-002
          is where the role is changed later.'
        provenance: contract identity.yaml POST /auth/select-role
  states:
    loading: Checking the credential. The form stays visible and disabled.
    emptyFirstRun: '**Nobody signed in** - the normal state of a door. A shared handheld between shifts
      shows nothing until somebody identifies themselves.'
    error: Identity could not be reached. **Says so rather than saying the password is wrong**, and keeps
      what was typed.
    denied: The credential does not match, or the account is locked. One message for both, with the attempts
      left before the lock; a locked account says when to try again.
    emptyNoAccess: Signed in, and the person holds no role in this app. Says who at the tenant grants
      access; distinct from a wrong password. A door has no permission of its own to name, because the
      person is not signed in until it succeeds.
    emptyNoResults: 'Never shown: `listSsoProviders` takes no filter; a tenant with no identity provider
      shows no SSO buttons at all, and the form is the whole door.'
    sessionHeld: '`login` answered 409: this person already holds a session elsewhere (audit R184, ADR-0004).
      Says where and since when; only a holder of SESSION_FORCE_LOGOUT ends it, on the staff directory
      (BO-053), and signing in never ends it by itself.'
    mfaRequired: '**Signed in, not yet through.** The principal holds a permission that requires MFA (ROLE_MANAGE,
      LEDGER_APPROVE, any PLATFORM_* permission, or one the tenant added), so the screen calls `createMfaChallenge`
      (`action: signIn`) and asks for the authentication code; `verifyMfaChallenge` completes the sign-in.
      **Email me a code instead** is the fallback. Five wrong codes lock step-up for the policy''s lockout
      minutes and the screen says until when (audit R135, R126). A person without such a permission never
      reaches this state.'
    offline: Signs in against the cached principal list from the last bundle; the status strip says offline.
      A steward at a gate at 08:00 still signs in.
  apis:
  - operationId: login
    contract: identity
    purpose: Authenticate at this handheld; the device sends its workstationId
    trigger: onAction
  - operationId: listSsoProviders
    contract: identity
    purpose: Which identity providers this door offers; unauthenticated, read before sign-in
    trigger: onLoad
  - operationId: startSsoAuthorization
    contract: identity
    purpose: Hand off to the identity provider where the tenant has SSO
    trigger: onAction
  - operationId: completeSsoAuthorization
    contract: identity
    purpose: Exchange the provider's code for the same LoginResponse as login, on the redirect back
    trigger: background
  - operationId: createMfaChallenge
    contract: identity
    purpose: Second factor after sign-in when the principal holds a permission in mfaRequiredForPermissions;
      action `signIn`, the authenticator app, or the email method as the fallback (audit R135, R126 (5))
    trigger: onAction
  - operationId: verifyMfaChallenge
    contract: identity
    purpose: Completes sign-in with the code; the session is usable only after it. Five wrong codes lock
      step-up (audit R126 (6))
    trigger: onAction
  - operationId: changeOwnCredential
    contract: identity
    purpose: Replace a temporary password or PIN at the first sign-in after a reset (audit R132)
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Read the session the sign-in just opened, for the landing
    trigger: onAction
  - operationId: selectRole
    contract: identity
    purpose: Choose the venue and role to work as when login returns more than one (ADR-0003; F64 step
      1)
    trigger: onAction
  entryState:
    params:
    - name: challengeId
      from: navigation
      optional: true
      notes: 'Optional (3 October 2026, CHG-SPF-004): opened without it, the screen makes one with `createMfaChallenge`;
        a link or an edge that holds one opens it instead.'
    - name: providerId
      from: deepLink
      optional: true
    coldEntry: '**The only screen of the staff app that needs nothing.** The handheld''s `workstationId`
      travels in the sign-in request from the device itself, not from a session (CHG-DOOR-001); `providerId`
      arrives only on an SSO redirect back.'
  apisNote: 'Declared by hand on 2 October 2026 (CHG-DOOR-003): sign-in, the venue''s SSO, the second
    factor, a temporary PIN''s replacement and the session read. The role and venue prompt is EMP-002
    (selectRole).'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-001
- id: EMP-002
  name: Select venue & role
  module: Operations
  requiresModule: core
  wave: 1
  capability: C00
  implementation:
    app: venue-staff-app
    route: /operations/select-venue-role
    component: apps/venue-staff-app/src/routes/operations/SelectVenueRoleDetail.tsx
    status: notStarted
  navigation:
    exitTo:
    - EMP-001
    - EMP-003
    - EMP-048
    inferred: true
    fromFlows: true
    transitions:
    - to: EMP-048
      trigger: Works the opening checklist
      provenance: flow F08 step 2→3, F64 step 2→3
    - to: EMP-001
      trigger: Sign in
      provenance: 'derived — EMP-001 declares entryState.params challengeId, providerId and EMP-002 holds
        none of them. The edge carries nothing: challengeId, providerId only pre-select (deep link or
        optional), and EMP-001 opens on its own'
    - to: EMP-003
      trigger: Home — on duty
      provenance: 'derived — EMP-003 declares entryState.params incidentId and EMP-002 holds none of them.
        The edge carries nothing: incidentId only pre-selects (deep link or optional), and EMP-003 opens
        on its own'
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Removed 24 August**: createRole, forceLogout, listActiveSessions, revokeAllSessions.
    **Bulk-attach residue** — the 18 August defect that put identical operation sets on unrelated screens.
    A till does not cancel a performance, a staff app does not create roles, and **a scanner does not
    run a cash shift.** ** restored** — a role-select screen must read the roles. Over-stripped and caught
    by F08.


    **Roles come from the login response EMP-001 holds (LoginResponse.availableRoles, preloaded) 4 October
    2026; selectRole sends the picked roleId. A role carries its venue scope, so there is no separate
    venue pick** (CHG-FXS-003)'
  density: comfortable
  pattern: listDetail
  patternReason: '`listMfaMethods` reads the population and `getCurrentSession` reads one of them — list,
    select, act'
  purpose: Confirm which hat this person is wearing today.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: collection
      components:
      - kind: cardList
        label: Choose your role for today
        bindsTo: LoginResponse.availableRoles
        columns:
        - RoleSummary.name
        - RoleSummary.code
        - RoleSummary.isPrimary
        notes: Handed over by EMP-001 from the login response (requiresRoleSelection true); nothing is
          fetched. The primary role is first. The venue is the role's scope, shown on the session after
          selectRole.
        provenance: defined 4 October 2026 (CHG-FXS-003)
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: The session
        bindsTo: Session
        columns:
        - Session.displayName
        - Session.scope
        - Session.effectivePermissions
        - Session.openedAt
        - Session.expiresAt
        operation: getCurrentSession
        provenance: contract identity.yaml GET /auth/session
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Select role
        operation: selectRole
        provenance: contract identity.yaml POST /auth/select-role
  states:
    loading: The select venue role list.
    error: Could not load. Names which read failed and leaves the select venue role untouched.
    emptyFirstRun: '**One venue and one role**: nothing to choose, so the app goes straight on. Shown
      only when the person holds no role at any venue, and says who at the tenant grants one.'
    emptyNoResults: 'Never shown: nothing on this screen filters its list, so an empty list is always
      the first-run state above.'
    emptyNoAccess: Shown when the caller lacks the permission the screen requires, and names it. **Never
      an empty table** — that reads as *there is no data* and sends somebody to support with the wrong
      question.
    offline: Cached from the last session
  apis:
  - operationId: selectRole
    contract: identity
    purpose: From the flow it appears in
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Current session and effective permissions
    trigger: onLoad
  entryState:
    params:
    - name: sessionId
      from: session
    coldEntry: Resolves from the session; a cold arrival is the ordinary case.
    preloaded:
    - LoginResponse.availableRoles
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P06 Venue Staff App.dc.html#emp-002
  apisNote: 'Rebuilt 9 September 2026 from the 6 operations this screen declares, not from a workshop
    pack — it has none. Columns narrowed on 3 October 2026 to the fields the screen is about (CHG-SPF-002):
    at most five on a phone or handheld, plumbing and foreign ids left to the record itself.'
  overlays:
  - id: formSelectRole
    component: modal
    trigger: Select role
    body: '**Collects what `selectRole` sends before it is called.** Required: `roleId`. Dismissing sends
      nothing; the screen behind is unchanged.'
    confirm:
      label: Select role
      operation: selectRole
    dismiss:
      label: Cancel
      discards:
      - roleId
    provenance: contract identity.yaml POST /auth/select-role
  gaps:
  - operation: listMfaMethods
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): Venue-and-role selection listed roles with listRoles (ROLE_MANAGE),
      which a steward never holds, and tables of MFA methods and SSO providers; the roles to choose from
      come from the login response (availableRoles) and selectRole takes the choice (design-notes correction
      platform-foundation EMP-002).'
    source: screens/P06-staff-app.yaml#EMP-002 | ADR-0003
  - operation: listRoles
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): Venue-and-role selection listed roles with listRoles (ROLE_MANAGE),
      which a steward never holds, and tables of MFA methods and SSO providers; the roles to choose from
      come from the login response (availableRoles) and selectRole takes the choice (design-notes correction
      platform-foundation EMP-002).'
    source: screens/P06-staff-app.yaml#EMP-002 | ADR-0003
  - operation: listSsoProviders
    removed: true
    why: 'Removed 2 October 2026 (CHG-WIR-021): Venue-and-role selection listed roles with listRoles (ROLE_MANAGE),
      which a steward never holds, and tables of MFA methods and SSO providers; the roles to choose from
      come from the login response (availableRoles) and selectRole takes the choice (design-notes correction
      platform-foundation EMP-002).'
    source: screens/P06-staff-app.yaml#EMP-002 | ADR-0003
