  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **createCashMovement removed 18 August** — attached by module resemblance, not
    by what this screen does. A screen that does not handle money should not be able to move it (CF-87''s
    class).


    **Blind close** (decided 2 October 2026, Chinmay; CHG-FIN-003): closing from here submits the cashier''s
    blind count with `submitShiftCount` (no expected cash, no variance shown; the supervisor is alerted
    beyond the threshold); `closeShift`, which returns the expected figure, is the supervisor''s path
    on BO-039 and BO-040.'
  density: comfortable
  pattern: approvalInbox
  patternReason: '`approveShiftOpen` decides items that `listIncidents` queues — every row is waiting
    for a person, so the empty state is success'
  purpose: The screen the device sits on between tasks.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: queue
      components:
      - kind: textField
        label: Severity
        operation: listIncidents
        notes: Sends `?severity=` to `listIncidents`.
        provenance: contract maintenance.yaml GET /incidents
      - kind: textField
        label: Status
        operation: listIncidents
        notes: Sends `?status=` to `listIncidents`.
        provenance: contract maintenance.yaml GET /incidents
      - kind: toggle
        label: Is reportable
        operation: listIncidents
        notes: Sends `?isReportable=` to `listIncidents`.
        provenance: contract maintenance.yaml GET /incidents
      - kind: dataTable
        label: Waiting for a decision
        bindsTo: Incident
        columns:
        - Incident.incidentNumber
        - Incident.severity
        - Incident.status
        - Incident.locationDescription
        operation: listIncidents
        provenance: contract maintenance.yaml GET /incidents
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected incident
        bindsTo: Incident
        columns:
        - Incident.incidentNumber
        - Incident.kind
        - Incident.severity
        - Incident.status
        - Incident.locationDescription
        operation: listIncidents
        provenance: contract maintenance.yaml GET /incidents
      - kind: detailPanel
        label: The incident
