    component: apps/accreditation-web/src/routes/reviewer-internal/ReviewerApplicationDetail.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-007
  resolvedQuestions:
  - Unblocked by the 7 September workshop (TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue),
    which this question said did not exist. Decided there - identity documents are OCR'd to auto-populate
    the form, and the extracted data is stored as structured fields rather than only the image, because
    expiry tracking and renewal prompts cannot read a scan; uniqueness is enforced on passport and Emirates
    ID and a duplicate submission is blocked; the web portal is primary with the mobile app a secondary
    route for individual applicants. And one decision removes screens rather than adding them - accreditation-
    holder monitoring is to be a filtered view inside general entitlement monitoring, not a separate system.
    Capability and API mapping can now be done; 74 pages of ACCREDITATION.pdf are also in the design corpus
    and no operation has been drafted from them yet.
- id: ACC-008
  name: Credential Register
  module: Reviewer (Internal)
  wave: 3
  requiresModule: accreditation
  pattern: listDetail
  density: compact
  purpose: 'Every credential issued this season, who holds it, where it is valid, and whether it has been
    used — and revoke one when it has to be revoked.

    '
  purposeNote: '**Rewritten 9 September.** The purpose read *"Get a guest into the app, fast, on a device
    that may be shared"*, which is a login screen''s purpose on a credential register. Found independently
    by Claude Design on the drawn frame and by this pass.

    '
  apis:
  - operationId: listAccreditationBadges
    contract: approvals
    purpose: Credentials issued for this programme
    trigger: onLoad
  gaps:
  - operation: revokeAccreditationBadge
    why: 'The register offers **Revoke** and nothing performs it. `AccreditationBadge.state` and `revokedReason`
      exist to record the outcome, so the schema is ready and the operation is not.

      '
    source: contract approvals.yaml AccreditationBadge.revokedReason
  - field: AccreditationBadge.lastUsedAt
    why: 'The register shows a **last used** column and the schema has no such field. *Not yet* is the
      value that matters — a credential issued and never presented is the one to ask about.

      '
    source: frame claude-design/Accreditation Board.dc.html#acc-008
  layout:
    template: split
    regions:
    - name: contentBody
      slot: filters
      components:
      - kind: searchField
        label: Holder or reference
      - kind: selectField
        label: Season
        notes: Defaults to the current season. **A register scoped to all time is a register nobody reads.**
        provenance: frame claude-design/Accreditation Board.dc.html#acc-008
    - name: contentBody
      slot: collection
      components:
      - kind: dataTable
        label: Credential register
        bindsTo: AccreditationBadge[]
        columns:
        - AccreditationBadge.holderName
        - AccreditationBadge.zones
        - AccreditationBadge.issuedAt
        - AccreditationBadge.state
        notes: 'Holder, valid for, issued, last used. **Revoked rows stay visible and read as revoked**
          — removing them from the register is how a revoked badge gets re-issued by mistake.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-008
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Credential
        bindsTo: AccreditationBadge
        provenance: frame claude-design/Accreditation Board.dc.html#acc-008
    - name: actionBar
      slot: rowActions
      components:
      - kind: destructiveButton
        label: Revoke
        permission: APPROVAL_DECIDE
      - kind: secondaryButton
        label: Export
        notes: The register is what a venue hands to a security team before a performance.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-008
  overlays:
  - id: confirmRevoke
    component: confirmDialog
    trigger: Revoke
    body: '**Names the holder and what stops working, and captures the reason.** A revocation takes somebody''s
      access to a building they may already be standing outside.

      '
    bindsTo: AccreditationBadge.revokedReason
    provenance: authored, from pattern listDetail
  states:
    loading: The register.
    emptyFirstRun: No credentials issued yet this season. Points at the queue.
    emptyNoResults: Nothing matches. The register is not empty.
    emptyNoAccess: You do not administer credentials for this programme.
    error: Could not load. **No credential is affected** by a failed read.
  entryState:
    params:
    - name: programmeId
      from: session
    preloaded: []
    coldEntry: Opens on the current season.
  navigation:
    entryFrom:
    - ACC-006
    - ACC-007
    exitTo:
    - ACC-006
    - ACC-007
    transitions:
    - to: ACC-006
      trigger: Reviewer Queue
