platform:
  code: P11
  audience: public
  formFactor: web
  shortName: Accreditation Web
  name: Accreditation Web — Applications
  surface: public
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 8
  app: accreditation-web
  appStatus: not scaffolded
  packages:
  - design-tokens
  - ui
  deployment:
    target: browser
    distribution: public, served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: applicant device, unmanaged
    networkAssumption: public internet
    releaseCadence: monthly
  reachesOtherPlatforms:
  - screen: SCN-003
    platform: P07
    board: P07 Venue Scanner.dc.html#scn-003
    note: A steward scans an accreditation credential at a service gate — the same handheld, a different
      credential kind
  operator: public
  wireframeBoard: wireframes/P11 Accreditation Web.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  targetApp:
    app: ticvai-control
    name: TICVAI Control
    shell: web
    siblings:
    - P09
    - P10
    - P14
    - P17
    note: '**TICVAI operates all five**, whoever signs in. The partner portal, the accreditation intake,
      the developer portal and the sign-up are outward faces of the control plane, not separate products
      — but their users are not TICVAI staff, and the permission model has to hold that line. **P17 added
      11 September 2026**: a prospect buying TICVAI has no tenant and no cell, so the control plane is
      the only thing that can serve them.'
    decided: 10 September 2026
screens:
- id: ACC-001
  name: Landing / Programme Overview
  module: Applicant Journey
  wave: 3
  requiresModule: accreditation
  pattern: publicPortalLanding
  density: compact
  purpose: 'Explain what accreditation at this venue is, what an application needs, and how long it takes
    — then offer the two ways in. **The explanation is the screen**, not a preamble to it.

    '
  apis: []
  apisNote: '**Zero operations is correct here and is not a gap.** The programme text is content, not
    data, and a landing page that fetches before it can say what it is has made an applicant wait to read
    a paragraph. Confirmed against the drawn frame, which reaches the same conclusion.

    '
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: introduction
      components:
      - kind: detailPanel
        label: What accreditation is, and is not
        notes: 'Programme, guidelines, and **what accreditation is not** — the section that prevents most
          refused applications, because the common failure is applying for the wrong thing.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-001
      - kind: detailPanel
        label: What you will need
        notes: 'Press card number if held, the performances they intend to cover, and a commission letter.
          **Listed before the form opens**, because an applicant who discovers on step three that they
          need a document from an editor abandons the application.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-001
      - kind: detailPanel
        label: How long it takes
        notes: 'Time to apply, time to a decision, and the cut-off before the performance. **Three numbers,
          stated** — CF and MoM both record that the absence of a stated turnaround is what generates
          the phone calls this screen exists to prevent.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-001
    - name: actionBar
      slot: entryActions
      components:
      - kind: primaryButton
        label: Start an application
        notes: Goes to ACC-002.
      - kind: secondaryButton
        label: Track an existing one
        notes: '**Resume is not optional.** An application abandoned partway is the common case, and `ACC-004`
          takes a reference rather than a login.

          '
  states:
    loading: The programme text, from the CMS bundle. Nothing is fetched per applicant.
    error: '**Content failed and the two actions still work.** An applicant who knows what they came to
      do should not be blocked by a paragraph that did not load.

      '
    emptyNoResults: 'No programme is open. Says when the next one opens rather than showing an empty page
      — *"accreditation for the winter season opens 4 November"* is an answer; a blank screen is not.

      '
    emptyFirstRun: No programme is open yet. Says when the next one opens rather than showing an empty
      page — a date is an answer, a blank screen is not.
  navigation:
    isEntryPoint: true
    exitTo:
    - ACC-002
    - ACC-004
    notes: '**Corrected 9 September.** The previous `exitTo` also listed `ACC-003`, which is the review
      step inside the application and cannot be reached from a landing page. Inferred navigation had made
      every P11 screen a child of this one.

      '
    transitions:
    - to: ACC-002
      trigger: Registration Form
      provenance: structural — ACC-001 is P11's home screen and its exits are its launcher
    - to: ACC-004
      trigger: Application Status Tracking
      provenance: structural — ACC-001 is P11's home screen and its exits are its launcher
  implementation:
    app: accreditation-web
    route: /applicant-journey/landing-programme-overview
    component: apps/accreditation-web/src/routes/applicant-journey/LandingProgrammeOverviewDetail.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-001
  resolvedQuestions:
  - Unblocked by the 7 September workshop (TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue),
    which this question said did not exist. Decided there - identity documents are OCR'd to auto-populate
    the form, and the extracted data is stored as structured fields rather than only the image, because
    expiry tracking and renewal prompts cannot read a scan; uniqueness is enforced on passport and Emirates
    ID and a duplicate submission is blocked; the web portal is primary with the mobile app a secondary
    route for individual applicants. And one decision removes screens rather than adding them - accreditation-
    holder monitoring is to be a filtered view inside general entitlement monitoring, not a separate system.
    Capability and API mapping can now be done; 74 pages of ACCREDITATION.pdf are also in the design corpus
    and no operation has been drafted from them yet.
- id: ACC-002
  name: Registration Form
  module: Applicant Journey
  wave: 3
  requiresModule: accreditation
  pattern: multiStepForm
  density: compact
  purpose: 'Collect who the applicant works for, what they intend to cover, and the documents that support
    it — in steps, with a draft that survives leaving.

    '
  apis: []
  gaps:
  - operation: createAccreditationApplication
    why: '**The registration form cannot register.** The screen declared `listApprovalRequests`, which
      is a reviewer''s read, and nothing that creates an application. Removed 9 September rather than
      left in place: an operation that is on a screen because it was nearby is the residue pattern this
      package has now found five times.

      '
    source: 7 September workshop — accreditation form builder, categories and programme setup
  - operation: saveAccreditationDraft
    why: 'The pattern requires a draft that autosaves. **A four-step form that loses everything to a dropped
      connection is a form people do not come back to**, and the drawn frame offers *"Save and finish
      later"* against nothing.

      '
    source: frame claude-design/Accreditation Board.dc.html#acc-002
  layout:
    template: wizard
    regions:
    - name: contentBody
      slot: progress
      components:
      - kind: progressIndicator
        label: Step 1 of 4 — Organisation
        notes: Organisation · Coverage · Documents · Check and submit.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
    - name: contentBody
      slot: fields
      components:
      - kind: textField
        label: Organisation
        notes: Who you work for. Free text — an outlet that is not on a list is still an outlet.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
      - kind: selectField
        label: Role
        notes: Photographer, writer, broadcast, technical. **Drives what coverage may be requested.**
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
      - kind: textField
        label: Press card number
        notes: Optional, and marked so. Its absence is a reviewer's signal, not a blocker.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
      - kind: textField
        label: Commissioning editor
        notes: Who commissioned the coverage, where there is one.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
      - kind: fileUpload
        label: Supporting documents
        notes: Commission letter and badge photo. Accepted formats stated before the picker opens.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
      - kind: consentBlock
        label: Consent
        notes: '**Stated once, unticked, and collected before documents rather than after.** The 2 September
          session recorded consent language as a live question for face data; the same principle applies
          to a press photograph. An accepted-by-default consent is not consent.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-002
    - name: actionBar
      slot: submit
      components:
      - kind: primaryButton
        label: Continue
      - kind: secondaryButton
        label: Save and finish later
  overlays:
  - id: saveAndExit
    component: confirmDialog
    trigger: Save and finish later
    body: '**Says what is kept and how to get back.** *"Your draft is saved. Return with reference ACC-4417"*
      — a dialog that says only *"saved"* leaves the applicant with nothing to return with.

      '
    provenance: authored, from pattern multiStepForm
  states:
    loading: The draft, where one exists.
    emptyFirstRun: A new application. Step one, nothing prefilled except what the account knows.
    error: '**The draft is safe and the step is not lost.** Errors on a long form must never clear entered
      fields.

      '
    denied: The programme is closed. Says when it reopens.
  entryState:
    params:
    - name: applicationRef
      from: deepLink
      optional: true
    preloaded:
    - programmeName
    coldEntry: '**Reached from the landing page, or resumed from a link in an acknowledgement email weeks
      later.** A reference that no longer resolves says the programme closed and offers the current one,
      rather than showing an empty form.

      '
  navigation:
    entryFrom:
    - ACC-001
    exitTo:
    - ACC-001
    - ACC-003
    - ACC-007
    transitions:
    - to: ACC-007
      trigger: A reviewer checks and approves
      provenance: flow F23 step 1→2
    - to: ACC-003
      trigger: Application Review & Submit
      carries:
      - applicationRef
      provenance: derived — ACC-003 declares entryState.params applicationRef, so an edge into it must
        carry them
  implementation:
    app: accreditation-web
    route: /applicant-journey/registration-form
    component: apps/accreditation-web/src/routes/applicant-journey/RegistrationForm.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-002
  resolvedQuestions:
  - Unblocked by the 7 September workshop (TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue),
    which this question said did not exist. Decided there - identity documents are OCR'd to auto-populate
    the form, and the extracted data is stored as structured fields rather than only the image, because
    expiry tracking and renewal prompts cannot read a scan; uniqueness is enforced on passport and Emirates
    ID and a duplicate submission is blocked; the web portal is primary with the mobile app a secondary
    route for individual applicants. And one decision removes screens rather than adding them - accreditation-
    holder monitoring is to be a filtered view inside general entitlement monitoring, not a separate system.
    Capability and API mapping can now be done; 74 pages of ACCREDITATION.pdf are also in the design corpus
    and no operation has been drafted from them yet.
- id: ACC-003
  name: Application Review & Submit
  module: Applicant Journey
  wave: 3
  requiresModule: accreditation
  pattern: multiStepForm
  density: compact
  purpose: 'Show everything the applicant entered, let them change any of it, say what happens next, and
    submit.

    '
  apis: []
  gaps:
  - operation: submitAccreditationApplication
    why: '**The submit button has nothing behind it.** The screen declared no operation at all, and submit
      is the one act it exists for.

      '
    source: frame claude-design/Accreditation Board.dc.html#acc-003
  layout:
    template: wizard
    regions:
    - name: contentBody
      slot: progress
      components:
      - kind: progressIndicator
        label: Step 4 of 4 — Check and submit
    - name: contentBody
      slot: review
      components:
      - kind: detailPanel
        label: Organisation
        notes: '**Every answer, each with its own Change link back to the step that owns it.** *Change*,
          not *Back* — an applicant on step four wants to fix one field, not walk backwards through three.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-003
      - kind: detailPanel
        label: Coverage requested
        notes: 'Named performances and named areas — *"stalls, pit"*. **Coverage is specific, and that
          is the point**: a badge that says *press* and nothing else is a badge a steward cannot act on,
          which is the same decision `ACC-005` renders.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-003
      - kind: detailPanel
        label: Documents
        notes: Each file with its accepted-or-not state, so a rejected upload is visible before submit.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-003
      - kind: detailPanel
        label: What happens next
        notes: 'An acknowledgement immediately, a decision within a stated number of working days. **Set
          before submit, not after** — this is where the expectation is formed.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-003
    - name: actionBar
      slot: submit
      components:
      - kind: primaryButton
        label: Submit application
  overlays:
  - id: submitConfirm
    component: confirmDialog
    trigger: Submit application
    body: 'Names what is being submitted and that it cannot be edited afterwards, only withdrawn.

      '
    provenance: authored, from pattern multiStepForm
  states:
    loading: The completed draft.
    error: '**Submission failed and nothing was lost.** The application stays a draft and the button stays
      available.

      '
    denied: The programme closed while the application was open. Says so plainly.
    emptyNoResults: 'No draft to review. Sends the applicant to `ACC-002` rather than showing an empty
      summary.

      '
    emptyFirstRun: No draft to review. Sends the applicant to ACC-002 rather than showing an empty summary.
  entryState:
    params:
    - name: applicationRef
      from: ACC-002
    preloaded:
    - everything entered on ACC-002
    coldEntry: '**Cannot be reached cold and should not be.** Opened directly, it loads the draft behind
      the reference or says the reference is unknown.

      '
  navigation:
    entryFrom:
    - ACC-002
    exitTo:
    - ACC-002
    - ACC-004
    transitions:
    - to: ACC-002
      trigger: Registration Form
      carries:
      - applicationRef
      provenance: derived — ACC-002 declares entryState.params applicationRef, so an edge into it must
        carry them
    - to: ACC-004
      trigger: Application Status Tracking
      carries:
      - applicationRef
      provenance: derived — ACC-004 declares entryState.params applicationRef, so an edge into it must
        carry them
  implementation:
    app: accreditation-web
    route: /applicant-journey/application-review-and-submit
    component: apps/accreditation-web/src/routes/applicant-journey/ApplicationReviewAndSubmitWizard.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-003
  resolvedQuestions:
  - Unblocked by the 7 September workshop (TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue),
    which this question said did not exist. Decided there - identity documents are OCR'd to auto-populate
    the form, and the extracted data is stored as structured fields rather than only the image, because
    expiry tracking and renewal prompts cannot read a scan; uniqueness is enforced on passport and Emirates
    ID and a duplicate submission is blocked; the web portal is primary with the mobile app a secondary
    route for individual applicants. And one decision removes screens rather than adding them - accreditation-
    holder monitoring is to be a filtered view inside general entitlement monitoring, not a separate system.
    Capability and API mapping can now be done; 74 pages of ACCREDITATION.pdf are also in the design corpus
    and no operation has been drafted from them yet.
- id: ACC-004
  name: Application Status Tracking
  module: Applicant Journey
  wave: 3
  requiresModule: accreditation
  pattern: statusTracker
  density: compact
  purpose: 'Tell an applicant where their application is and when they will hear — **with a date, not
    a queue position.**

    '
  apis: []
  gaps:
  - operation: getAccreditationApplicationByReference
    why: '**A status screen with no status read.** The screen declared no operation. It also cannot use
      the reviewer''s `listApprovalRequests`: an applicant is not authenticated as a principal with approval
      permissions, and **the reference is the credential** — which is a deliberate design decision and
      needs an operation shaped for it.

      '
    source: frame claude-design/Accreditation Board.dc.html#acc-004
  - operation: withdrawAccreditationApplication
    why: The screen offers *Withdraw this application* and nothing performs it.
    source: frame claude-design/Accreditation Board.dc.html#acc-004
  - operation: addAccreditationDocument
    why: The screen offers *Add a document* — the common reviewer request — and nothing performs it.
    source: frame claude-design/Accreditation Board.dc.html#acc-004
  layout:
    template: detail
    regions:
    - name: contentBody
      slot: state
      components:
      - kind: banner
        label: With a reviewer
        bindsTo: ApprovalRequest.status
        notes: 'Where it is now, and **the date a decision is due** — `ApprovalRequest.slaDueAt`. *"Fourth
          in the queue"* was considered and rejected on the frame: a position moves backwards and a date
          does not.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-004
      - kind: timeline
        label: Where it has been
        bindsTo: ApprovalRequest.decisions
        notes: Received, documents checked, decision — each with its date.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-004
    - name: contentBody
      slot: record
      components:
      - kind: detailPanel
        label: Application
        bindsTo: ApprovalRequest.summary
        notes: The reference, the performances, and what was requested.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-004
    - name: actionBar
      slot: actions
      components:
      - kind: secondaryButton
        label: Add a document
      - kind: destructiveButton
        label: Withdraw this application
  overlays:
  - id: confirmWithdraw
    component: confirmDialog
    trigger: Withdraw this application
    body: '**States that withdrawal is final and the programme may close before a new application can
      be made.** A withdrawal that can be made by accident is one the venue hears about by telephone.

      '
    provenance: authored, from pattern statusTracker
  states:
    loading: The application behind the reference.
    emptyNoResults: '**The reference is not recognised.** Says so without hinting whether it once existed
      — a status endpoint that distinguishes *never existed* from *withdrawn* is an enumeration oracle.

      '
    error: Could not load. The reference is unaffected and can be retried.
    denied: The reference has expired. Applications are readable for a stated period after the season.
    emptyFirstRun: No application behind this reference yet — a reference issued but not submitted. Points
      back at the draft.
  entryState:
    params:
    - name: applicationRef
      from: deepLink
    preloaded: []
    coldEntry: '**This screen is always reached cold** — from an acknowledgement email, usually weeks
      later and often on a different device. That is the design, and it is why the reference is the only
      thing it takes.

      '
  navigation:
    entryFrom:
    - ACC-001
    - ACC-003
    exitTo:
    - ACC-001
    - ACC-005
    transitions:
    - to: ACC-005
      trigger: Accreditation Badge
      carries:
      - applicationRef
      provenance: derived — ACC-005 declares entryState.params applicationRef, so an edge into it must
        carry them
  implementation:
    app: accreditation-web
    route: /applicant-journey/application-status-tracking
    component: apps/accreditation-web/src/routes/applicant-journey/ApplicationStatusTrackingDetail.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-004
  resolvedQuestions:
  - Unblocked by the 7 September workshop (TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue),
    which this question said did not exist. Decided there - identity documents are OCR'd to auto-populate
    the form, and the extracted data is stored as structured fields rather than only the image, because
    expiry tracking and renewal prompts cannot read a scan; uniqueness is enforced on passport and Emirates
    ID and a duplicate submission is blocked; the web portal is primary with the mobile app a secondary
    route for individual applicants. And one decision removes screens rather than adding them - accreditation-
    holder monitoring is to be a filtered view inside general entitlement monitoring, not a separate system.
    Capability and API mapping can now be done; 74 pages of ACCREDITATION.pdf are also in the design corpus
    and no operation has been drafted from them yet.
- id: ACC-005
  name: Accreditation Badge
  module: Applicant Journey
  wave: 3
  requiresModule: accreditation
  pattern: credentialView
  density: touchLarge
  densityReason: '**Held up at a stage door, at night, by somebody carrying equipment.** The same handheld
    that scans a ticket scans this, and the failure mode is a steward asking the holder to brighten their
    screen.

    '
  purpose: 'Present the issued badge so it can be scanned, and say exactly where it is valid.

    '
  apis:
  - operationId: listAccreditationBadges
    contract: approvals
    purpose: The badges issued against this application
    trigger: onLoad
  - operationId: issueAccreditationBadge
    contract: approvals
    purpose: Issue the badge
    trigger: onAction
  gaps:
  - operation: getAccreditationBadge
    why: 'The screen shows one badge and the only read is a list. **A holder opening their own badge should
      not fetch every badge issued** — and `listAccreditationBadges` carries a reviewer''s permission,
      which an applicant does not have.

      '
    source: contract approvals.yaml — listAccreditationBadges is the only badge read
  layout:
    template: fullscreen
    regions:
    - name: contentBody
      slot: credential
      components:
      - kind: credentialDisplay
        label: Your badge
        bindsTo: AccreditationBadge
        notes: 'The scannable credential, rendered large and bright. **Offline is required** — a stage
          door is the worst signal in the building, and the 2 September decision that a dynamic-QR ticket
          is redirected into the app exists for exactly this reason.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-005
    - name: contentBody
      slot: identity
      components:
      - kind: detailPanel
        label: Holder
        bindsTo: AccreditationBadge.holderName
        notes: Name, role and outlet, as printed. Photographer · The Northern Review.
        provenance: frame claude-design/Accreditation Board.dc.html#acc-005
      - kind: detailPanel
        label: Where it works
        bindsTo: AccreditationBadge.zones
        notes: '**Stage door, stalls and pit, named performances — and *any other door, refused*.** The
          negative case is stated on the badge because the steward reads this, not a policy.

          '
        provenance: frame claude-design/Accreditation Board.dc.html#acc-005
    - name: contentBody
      slot: validity
      components:
      - kind: banner
        label: Valid until
        bindsTo: AccreditationBadge.expiresAt
        notes: '**`expired` and `revoked` must be unmistakable and must not resemble `loading`.** `AccreditationBadge.state`
          carries both, and `revokedReason` says why.

          '
        provenance: contract approvals.yaml AccreditationBadge.state
    - name: actionBar
      slot: actions
      components:
      - kind: secondaryButton
        label: Add to phone
      - kind: secondaryButton
        label: Print
  states:
    loading: The badge.
    emptyNoResults: No badge yet — the application has not been approved. Points at `ACC-004`.
    error: Could not refresh. **The cached badge still displays and says when it was last checked.**
    offline: '**Serves the cached badge and says so.** A badge that will not render without a network
      is a badge that fails at the door it was issued for.

      '
    emptyFirstRun: No badge issued yet. The application has not been approved; points at ACC-004.
  entryState:
    params:
    - name: applicationRef
      from: ACC-004
      optional: true
    preloaded:
    - holderName
    coldEntry: 'Opened from a bookmark or a wallet pass. Loads the badge behind the reference, or explains
      that badges are issued only after approval.

      '
  navigation:
    entryFrom:
    - ACC-004
    - ACC-007
    exitTo:
    - ACC-004
    transitions:
    - to: ACC-004
      trigger: Application Status Tracking
      carries:
      - applicationRef
      provenance: derived — ACC-004 declares entryState.params applicationRef, so an edge into it must
        carry them
    - to: SCN-003
      trigger: A steward scans it at a service gate
      provenance: flow F23 step 3→4
      operation: issueAccreditationBadge
      crossesDevice: true
      back: false
  implementation:
    app: accreditation-web
    route: /applicant-journey/accreditation-badge
    component: apps/accreditation-web/src/routes/applicant-journey/AccreditationBadgeDetail.tsx
    status: notStarted
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P11 Accreditation Web.dc.html#acc-005
  resolvedQuestions:
  - Unblocked by the 7 September workshop (TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue),
    which this question said did not exist. Decided there - identity documents are OCR'd to auto-populate
