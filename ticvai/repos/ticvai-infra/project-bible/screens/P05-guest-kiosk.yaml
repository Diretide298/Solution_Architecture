- id: KSK-016
  name: Order Food
  module: Sell
  wave: 2
  purpose: Order food from the kiosk and collect it.
  apis:
  - operationId: getGuestMenu
    contract: fnb
    purpose: The menu for this outlet
    trigger: onLoad
  - operationId: createGuestFnbOrder
    contract: fnb
    purpose: Place the order
    trigger: onAction
  states:
    loading: The menu, with the first category open
    emptyFirstRun: Nothing is being served right now. **The state names the next service time** — a
      guest at a kiosk at 4pm needs to know whether to wait twenty minutes or go elsewhere.
    emptyNoResults: Nothing matches that filter. **Allergen filters narrow hard** — a guest filtering
      for nut-free at a nut-heavy outlet should be told that plainly rather than shown a blank menu.
    emptyNoAccess: Not applicable — a kiosk menu is public.
    error: Could not load the menu. **The kiosk still sells tickets** — one outlet being unreachable
      does not close the kiosk.
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: Menu
