  machine:
    key: dstep
    initial: detail
    provenance: prototype TICVAI POS Terminal, received 9 September 2026 · dstep · minute 2026-08-03 §Ticket
      Flow Variations by Product Type
    states:
      detail:
        operation: getProduct
        note: The ticket is chosen and its detail is open. Which step comes next is decided by the product,
          not by the cashier.
      datetime:
        note: Date, and for a timed product a session. **Dated products stop at the date**; timed ones
          carry on to the time.
      zone:
        note: Which part of the house, before any individual seat.
      seats:
        note: Individual seats within the chosen zone, held while the cashier decides.
      qty:
        note: Quantity by variant — adult, child, concession. **Every variant arrives here**, whatever
          route it took.
    transitions:
    - from: detail
      'on': product is admission
      to: qty
      note: Admission — straight to quantity, no date at all.
    - from: detail
      'on': product is dated or timed
      to: datetime
    - from: detail
      'on': product is seated
      to: zone
    - from: datetime
      'on': date and session chosen
      to: qty
    - from: zone
      'on': zone chosen
      to: seats
    - from: seats
      'on': seats picked
      to: qty
