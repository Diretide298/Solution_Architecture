    - to: POS-007
      trigger: Close Shift
      provenance: structural — POS-025 is P04's home screen and its exits are its launcher
  notes: '**P04 had no entry surface.** Eleven of its screens declared `entryFrom: POS-001`, which is
    the sign-in — so the model said a cashier signs in and is somehow already inside a sale. The prototype''s
    `home` is the missing step, and it is what makes the rail in `posPrimaryRail` mean something: **twelve
    screens named that set and shared no destination**, because the destination they share is this one.'
  density: touchLarge
  pattern: dashboard
  patternReason: '`getCurrentShift` reads the one thing that is true right now and the tiles read counts
    — a dashboard, not a list'
  purpose: The surface a cashier lands on after opening a shift, and the one they return to between sales.
  layout:
    template: split
    regions:
    - name: contentBody
      slot: summary
      components:
      - kind: metricTile
        label: Shift takings so far
        bindsTo: Shift
      - kind: metricTile
        label: Open holds
        bindsTo: Order
      - kind: metricTile
        label: Queue waiting
        bindsTo: Queue
      - kind: cardList
        label: Sale boards — tickets, F&B, retail
        bindsTo: SaleBoard
      - kind: cardList
        label: Peripheral health
        bindsTo: DeviceBinding
      - kind: banner
        label: Alerts for this workstation
        bindsTo: Alert
  states:
    loading: The saved till home.
    error: Could not load. Names which read failed and leaves the till home untouched.
    emptyFirstRun: No till home yet. Carries the create action and says what the till does in the meantime.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: '**Working from the local journal.** The tiles show what this workstation knows; the queue
      and alerts are last-known and say so.'
    denied: Names the permission the operator does not hold and who at this venue does. **Never a disabled
      tile with no explanation** — that reads as a broken till.
  apis:
