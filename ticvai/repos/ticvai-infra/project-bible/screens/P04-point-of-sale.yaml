platform:
  code: P04
  audience: staff
  formFactor: posTerminal
  shortName: Venue POS
  name: Venue POS — Terminal and Tablet
  surface: staffFacing
  runtime: reactNativeTablet
  offlineCapable: true
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 30
  app: venue-pos
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: POS terminal — Windows or Android
    distribution: device management push
    bundleUpdate: catalogue bundle applies at shift open; app on a scheduled window
    hosting: local, offline-first (ADR-0013)
    storeReview: false
    deviceOwnership: venue-owned, staffed
    networkAssumption: venue LAN with expected outages
    releaseCadence: monthly, never during trading
  designReferences:
  - path: sources/designs/TICVAI_POS_Terminal_client_approved.html
    note: Client-approved POS build, 30 screens, and the fidelity reference for every other platform.
      It replaced the two early Park_POS explorations, removed on purpose 11 September; screen notes that
      cite Park_POS_dc.html record where a decision came from, not a file to open.
  operator: venue
  wireframeBoard: wireframes/P04 Venue POS.dc.html
  wireframeBoardNote: '**The generated board for the whole platform.** Individual screens keep the client-pack
    anchor where one exists — a screen the client drew should open the client''s frame — and this renders
    every screen on the platform including the ones no pack covers.


    **Declared 24 August.** The file was written from the first generation and nothing pointed at it:
    `check-wireframes` has no unmatched-board concept, so the Python suite passed while the viewer flagged
    an orphan. **A board nobody references is a board nobody reviews.**'
  navigationSets:
    posPrimaryRail:
      members:
      - POS-002
      - POS-005
      - POS-007
      - POS-008
      - POS-009
      - POS-011
      - POS-012
      - POS-013
      - POS-015
      - POS-016
      - POS-021
      - POS-023
      destinations: []
      unrealised: '**Named by 12 screens and implemented by none of them.** They share no destination
        at all, so there is nothing here to call a rail. Either the shared exits are missing from those
        screens or the key is wrong — but a plausible membership invented here would read as fact.'
    posSaleToPayment:
      members:
      - POS-002
      - POS-003
      - POS-004
      - POS-010
      - POS-021
      - POS-022
      - POS-023
      destinations:
      - POS-005
      provenance: derived — every one of the 7 screens naming this set exits to all of them
  targetApp:
    app: venue-pos
    name: TICVAI POS
    shell: terminal
    siblings:
    - P15
    note: '**The kitchen display is the till, signed into differently.** Same software, same outlet, same
      orders — what changes is who is looking and what they may do, which is a permission, not an application.'
    decided: 10 September 2026
screens:
- id: POS-000
  name: Sign In
  module: Shift
  requiresModule: core
  wave: 1
  capability: C11
  purpose: Authenticate the operator at the terminal and resolve the session every other screen on this
    app reads.
  implementation:
    app: venue-pos
    route: /sign-in
    component: apps/venue-pos/src/routes/SignInTerminal.tsx
    status: notStarted
  density: touchLarge
  pattern: form
  patternReason: Two fields and a keypad. `listActiveSessions` reads who holds the till so the operator
    can take it over -- a form with one piece of context, not a list to browse
  entryState:
    params: []
    coldEntry: '**The only screen in venue-pos that needs nothing.** That is what makes it the door. `workstationId`
      travels in the login request and comes from the terminal itself, not from a session -- the contract
      says it identifies the device and is *NOT a permission source*.'
  states:
    loading: Checking the credential. The keypad stays visible and disabled.
    emptyFirstRun: '**A till nobody has signed into yet.** No recent operators, so the quick-login row
      is not there and the keypad is the whole screen. This is the state on the morning a terminal is
      first plugged in, and it is the one a venue sees when it opens - not a fault, and it must not read
      as one.'
    error: Identity could not be reached. **Says so rather than saying the PIN is wrong** -- telling an
      operator their PIN failed when the network did sends them to a supervisor with the wrong question.
    denied: The employee number and PIN do not match, or the account is locked. Names which, and how many
      attempts remain before the lock.
    emptyNoAccess: Authentication succeeded and the operator holds no role on this workstation. **A real
      outcome on a shared till** -- a steward badged for the gate is not a cashier -- and it is the session
      that succeeded and the authorisation that did not.
    offline: Signs in against the cached operator list and syncs when the link returns. **A till that
      cannot open because the network is down is a till that does not sell**, which is the same reasoning
      POS-001 applies to the float.
  navigation:
    entryFrom: []
    exitTo:
    - POS-001
    - POS-025
    - KIT-002
    transitions:
    - to: POS-001
      trigger: Begin Shift
      carries:
      - boxId
      - shiftId
      - workstationId
      provenance: derived — POS-001 declares entryState.params boxId, shiftId, workstationId, so an edge
        into it must carry them
    - to: POS-025
      trigger: Till Home
      carries:
      - workstationId
      provenance: derived — POS-025 declares entryState.params workstationId, so an edge into it must
        carry them
    - to: KIT-002
      trigger: Kitchen Display System (KDS)
      carries:
      - stationId
      - ticketId
      - venueId
      - visitId
      provenance: derived — KIT-002 declares entryState.params stationId, ticketId, venueId, visitId,
        so an edge into it must carry them
  layout:
    template: form
    regions:
    - name: contentBody
      slot: form
      components:
      - kind: numberField
        label: Employee number
        notes: Goes into `LoginRequest.username`.
      - kind: numberField
        label: PIN
        notes: 'Goes into `LoginRequest.credential` with `method: pin`.'
      - kind: primaryButton
        label: Sign in
        operation: login
        provenance: contract identity.yaml POST /auth/login
      - kind: cardList
        label: Recent operators on this till
        notes: '**Device-local and deliberately backed by no operation.** The terminal remembers who used
          it so an operator taps a face rather than typing a number; the PIN is still required. Putting
          this behind an endpoint would publish a staff list to an unauthenticated caller.'
    - name: contextPanel
      slot: selection
      components:
      - kind: detailPanel
        label: Signed in on this till now
        bindsTo: ActiveSession
        operation: listActiveSessions
        provenance: contract identity.yaml GET /auth/sessions
      - kind: destructiveButton
        label: Take the till over
        operation: forceLogout
        provenance: contract identity.yaml POST /auth/sessions/{sessionId}/force-logout
        notes: '**One principal, one active session per workstation** -- signing in while somebody else
          holds the till ends their session as `terminated`, not `signedOut`, so the registry can answer
          *what happened to till 4*. The `sessionId` is theirs, picked off the list above.'
      - kind: confirmDialog
        label: End the other operator's session?
        notes: Names who is being signed out and whether their shift is still open. **Their float does
          not move** -- the shift survives, the session does not.
    - name: actionBar
      slot: rowActions
      components:
      - kind: secondaryButton
        label: Choose role
        operation: selectRole
        provenance: contract identity.yaml
        notes: 'Shown when `LoginResponse.requiresRoleSelection` is true. **The role decides the surface**:
          a cashier lands on POS-001, kitchen staff on KIT-002. Same app, different door out.'
  apis:
  - operationId: login
    contract: identity
    purpose: Authenticate the operator at this terminal
    trigger: onAction
  - operationId: listActiveSessions
    contract: identity
    purpose: Who holds this till now
    trigger: onLoad
  - operationId: forceLogout
    contract: identity
    purpose: Take the till over from the operator holding it
    trigger: onAction
    invalidates:
    - listActiveSessions
  - operationId: selectRole
    contract: identity
    purpose: Choose which role to work as when login returns more than one
    trigger: onAction
  - operationId: getCurrentSession
    contract: identity
    purpose: Read the session the login just created
    trigger: onAction
  apisNote: '**No `listMfaMethods`, and that is deliberate.** ADM-001, PTR-001 and SUP-001 all carry it;
    a till does not. The bound on a PIN is the device - `workstationId` is required on every login and
    the terminal sits on a venue network in a staff area - not a second factor typed between guests.'
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P04 Venue POS.dc.html#pos-000
- id: POS-001
  name: Begin Shift
  module: Shift
  requiresModule: core
  wave: 1
  capability: C11
  implementation:
    app: venue-pos
    route: /shift/begin-shift
    component: apps/venue-pos/src/routes/shift/BeginShiftWizard.tsx
    status: notStarted
  navigation:
    isEntryPoint: true
    exitTo:
    - POS-002
    - POS-007
    - POS-009
    - POS-021
    - POS-022
    - POS-023
    - POS-024
    - POS-025
    transitions:
    - to: POS-002
      trigger: Open shift, after the four-digit PIN and the float count
      control: primaryButton#openShift
      precondition: pin.length == 4 and openingFloat.counted
      guard: sale.create
      carries:
      - shiftId
      - operatorId
      - operatorRole
      - openingFloat
      - workstationId
      - outletId
      - catalogueBundleVersion
      onFailure:
      - when: networkLost
        to: POS-001#offline
        note: '**Opening does not work offline** (F32) — a float declared offline is a float nobody can
          reconcile against the safe.'
      provenance: board TICVAI POS Terminal · submit (4867) + openShift (4885); flow F32 steps 1-2
    - to: POS-007
      trigger: Close shift
      control: iconButton#closeShift
      precondition: shift.status == 'open'
      guard: shift.reopen
      escalatable: true
      carries:
      - shiftId
      - expectedCash
      - cashMovements
      provenance: board TICVAI POS Terminal · goClose (4891); flow F32 step 6
    - to: POS-009
      trigger: Staff Roster
      provenance: structural — POS-001 is P04's home screen and its exits are its launcher
    - to: POS-021
      trigger: Sell — Food & Drink
      provenance: structural — POS-001 is P04's home screen and its exits are its launcher
    - to: POS-022
      trigger: Send to Kitchen
      provenance: structural — POS-001 is P04's home screen and its exits are its launcher
    - to: POS-023
      trigger: Sell — Merchandise
      provenance: structural — POS-001 is P04's home screen and its exits are its launcher
    - to: POS-024
      trigger: Outlet Setup
      provenance: structural — POS-001 is P04's home screen and its exits are its launcher
    - to: POS-025
      trigger: Till Home
      provenance: structural — POS-001 is P04's home screen and its exits are its launcher
  notes: 'Design: Park_POS_dc.html. The mockup warns "you will not be able to edit the float amount after
    the shift has started" — that is correct and deliberate. An editable opening float makes close-out
    variance meaningless. **Improved 20 August against the client design board**, answering 2 board screen(s):
    Opening Float Management; Shift Opening & Login. **Owns POS board frame(s) POS-2A, POS-3D** (client
    pack, 24 August). **Assigned by board purpose rather than by operation overlap** — three attempts
    at deriving that mapping produced plausible nonsense, and a reader who trusts a bad table is worse
    off than one who has none.'
  density: touchLarge
  boardFrames:
  - POS Board 3.dc.html#pos-3d
  - TICVAI Boards v2.dc.html#pos-2a
  pattern: approvalInbox
  patternReason: '`approveShiftOpen` decides items that `listCashMovements` queues — every row is waiting
    for a person, so the empty state is success'
  purpose: Count the opening float and open the till.
  gaps:
  - operation: getShift
    why: '**4 declared operations reach no component on this screen**: getShift, listShifts, getWorkstationHealth,
      listDenominations. Either the screen is missing what calls them, or the declaration is residue.'
    source: the screen's own declarations
  layout:
    template: split
    regions:
    - name: contentBody
      slot: queue
      components:
      - kind: dataTable
        label: Waiting for a decision
        bindsTo: CashMovement
        columns:
        - CashMovement.id
        - CashMovement.kind
        - CashMovement.amount
        - CashMovement.denominations
        - CashMovement.reference
        - CashMovement.reason
        - CashMovement.recordedAt
        - CashMovement.shiftId
        - CashMovement.authorisedByPrincipalId
        - CashMovement.sequence
        - CashMovement.syncedAt
        operation: listCashMovements
        provenance: contract shift.yaml GET /shifts/{shiftId}/cash-movements
    - name: contextPanel
      slot: item
      components:
      - kind: detailPanel
        label: The selected begin shift
        bindsTo: Shift
        columns:
        - Shift.id
        - Shift.workstationId
        - Shift.venueId
        - Shift.scopePath
        - Shift.principalId
        - Shift.principalDisplayName
        - Shift.incidents
        - Shift.status
        - Shift.currency
        - Shift.currencyScale
        - Shift.depositBoxCode
        - Shift.bagNumber
        - Shift.openingFloat
        - Shift.salesTotal
        - Shift.refundsTotal
        - Shift.liftsTotal
        operation: getCurrentShift
        provenance: contract shift.yaml GET /shifts/current
    - name: actionBar
      slot: decision
      components:
      - kind: primaryButton
        label: Open
        operation: openShift
        provenance: contract shift.yaml POST /shifts
      - kind: secondaryButton
        label: Accept
        operation: acceptShiftVariance
        provenance: contract shift.yaml POST /shifts/{shiftId}/accept-variance
      - kind: secondaryButton
        label: Approve
        operation: approveShiftOpen
        provenance: contract shift.yaml POST /shifts/{shiftId}/approve-open
      - kind: destructiveButton
        label: Close
        operation: closeShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/close
      - kind: secondaryButton
        label: Create
        operation: createCashMovement
        provenance: contract shift.yaml POST /shifts/{shiftId}/cash-movements
      - kind: secondaryButton
        label: Record
        operation: recordNoSale
        provenance: contract shift.yaml POST /shifts/{shiftId}/no-sale
      - kind: secondaryButton
        label: Reopen
        operation: reopenShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/reopen
      - kind: secondaryButton
        label: Resume
        operation: resumeShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/resume
      - kind: destructiveButton
        label: Suspend
        operation: suspendShift
        provenance: contract shift.yaml POST /shifts/{shiftId}/suspend
      - kind: secondaryButton
        label: Adjust
        operation: adjustDepositBoxFloat
        provenance: contract shift.yaml POST /deposit-boxes/{boxId}/adjust-float
      - kind: secondaryButton
        label: Select
        operation: selectRole
        provenance: contract identity.yaml POST /auth/select-role
    - name: contentBody
      slot: carried
      components:
      - kind: numberField
        label: Denomination count
        notes: Per denomination, from the region settings — the mockup shows AED 200 down to coins. Not
          a hardcoded list
        provenance: carried from the previous definition
      - kind: metricTile
        bindsTo: Shift.floatTotal
        notes: Computed, never typed
        provenance: carried from the previous definition
      - kind: textField
        label: Notes
        provenance: carried from the previous definition
      - kind: detailPanel
        notes: Suggested float from the venue default. Advisory, not prefilled — a prefilled count is
          not a count
        provenance: carried from the previous definition
    - name: actionBar
      slot: carried
      components:
      - kind: primaryButton
        label: Review & confirm
        provenance: carried from the previous definition
  overlays:
  - id: confirmCloseShift
    component: confirmDialog
    trigger: Close
    body: '**Names what `closeShift` changes and what it leaves alone**, in the consequence rather than
      the verb. A begin shift this affects should be identified in the dialog, not just counted.'
    provenance: contract shift.yaml POST /shifts/{shiftId}/close
    confirm:
      label: Close the shift
      operation: closeShift
      carries: &id003
      - shiftId
      - countedFloat
      - varianceReason
    dismiss:
      label: Not yet
      discards: &id004 []
  - id: confirmSuspendShift
    component: confirmDialog
    trigger: Suspend
    body: '**Names what `suspendShift` changes and what it leaves alone**, in the consequence rather than
      the verb. A begin shift this affects should be identified in the dialog, not just counted.'
    provenance: contract shift.yaml POST /shifts/{shiftId}/suspend
    confirm:
      label: Suspend
      operation: suspendShift
      carries: &id005
      - shiftId
    dismiss:
      label: Cancel
      discards: &id006 []
  states:
    loading: The begin shift list.
    error: Could not load. Names which read failed and leaves the begin shift untouched.
    emptyFirstRun: '**Nothing is waiting, which is the good outcome.** An empty queue means every item
      has been decided; it offers no create action, because creating work is not what it needs.'
    emptyNoResults: The filter narrowed it and the begin shift are still there. Names the active filter
      and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: Opens locally and syncs. A gate that cannot open a till because the network is down is a
      gate that does not sell
    denied: Sign-in succeeds and the shift will not open — the operator's role does not hold `sale.create`
      on this terminal. The float count is kept, not discarded, and a supervisor can open the shift against
      the same count.
  apis:
  - operationId: openShift
    contract: shift
    purpose: Open with the counted float
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: getCurrentShift
    contract: shift
    purpose: Whether a shift is already open here
    trigger: onLoad
  - operationId: acceptShiftVariance
    contract: shift
    purpose: Accept an over/short beyond the threshold
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: approveShiftOpen
    contract: shift
    purpose: Approve a shift opening outside tolerance
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: closeShift
    contract: shift
    purpose: Blind close-out
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: createCashMovement
    contract: shift
    purpose: Record a cash lift or add
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: getShift
    contract: shift
    purpose: Read a shift
    trigger: onLoad
  - operationId: listCashMovements
    contract: shift
    purpose: Lifts, adds and the opening float
    trigger: onLoad
  - operationId: listShifts
    contract: shift
    purpose: List shifts
    trigger: onLoad
  - operationId: recordNoSale
    contract: shift
    purpose: Open the drawer without a sale
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: reopenShift
    contract: shift
    purpose: Reopen a shift closed in error
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: resumeShift
    contract: shift
    purpose: Resume a suspended shift
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: suspendShift
    contract: shift
    purpose: Suspend a shift so another user can log in
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: adjustDepositBoxFloat
    contract: shift
    purpose: Change the initial fund
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: selectRole
    contract: identity
    purpose: Choose a role for a multi-role session
    trigger: onAction
    invalidates:
    - listCashMovements
  - operationId: getWorkstationHealth
    contract: tenancy
    purpose: getWorkstationHealth
    trigger: onLoad
  - operationId: listDenominations
    contract: shift
    purpose: listDenominations
    trigger: onLoad
  entryState:
    params:
    - name: workstationId
      from: session
    - name: boxId
      from: session
    - name: shiftId
      from: deepLink
    coldEntry: '**The deposit box allocated to this workstation for this shift**, resolved at shift open
      — a cashier does not choose a box.'
    preloaded:
    - Shift.id
    - Shift.workstationId
    - Shift.venueId
    - Shift.scopePath
    - Shift.principalId
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P04 Venue POS.dc.html#pos-001
    source: Claude Design POS pack, 24 August
    note: '**Drawn by Claude Design on `TICVAI Boards v2.dc.html`, archived 9 September 2026 to `_dump/wireframes-3-september/`.**
      The frame it points at now is the generated one. This screen has been designed once and is not starting
      from nothing.'
  apisNote: Rebuilt 9 September 2026 from the 17 operations this screen declares, not from a workshop
    pack — it has none. Columns are every field the response schema declares, plumbing aside — narrowing
    them to the ones that matter is work a person still owes this screen.
- id: POS-002
  name: Sell — Ticket Catalogue
  module: Sell
  requiresModule: ticketing
  wave: 1
  capability: C01
  implementation:
    app: venue-pos
    route: /sell/sell-ticket-catalogue
    component: apps/venue-pos/src/routes/sell/SellTicketCatalogueBoard.tsx
    status: notStarted
  navigation:
    entryFrom:
    - POS-001
    - POS-006
    - POS-025
    - POS-027
    exitTo:
    - POS-001
    - POS-003
    - POS-004
    - POS-005
    - POS-006
    - POS-007
    - POS-010
    - POS-011
    - POS-013
    - POS-020
    - BO-045
    fromFlows: true
    notes: '**flow F31 — the till picks up the new catalogue and the manager returns to the menu.** The
      flow is the authority on the journey and the navigation has to agree with it; marking this block
      non-inferred is what turned the disagreement from a warning into a failure.'
    transitions:
    - to: POS-003
      trigger: Choose a date and session for a timed product
      control: drawer#drawerDateAndSession
      precondition: product.timed
      carries:
      - productId
      - visitDate
      - sessionTime
      - quantityByVariant
      returnsTo: POS-002
      discards:
      - drawerSelection
      provenance: board TICVAI POS Terminal · openDrawer (4082) + dGo/pickShowTime (4276-4278)
    - to: POS-004
      trigger: Select seats on the plan
      control: drawer#drawerSeatSelection
      precondition: product.seats or product.evt
      carries:
      - productId
      - performanceId
      - seatPicks
      - zoneId
      - holdExpiresAt
      returnsTo: POS-002
      discards:
      - seatPicks
      onFailure:
      - when: soldOut
        to: POS-004#zoneUnavailable
        note: The board refuses the zone rather than the sale — `evPickZone` (4269).
      - when: overSelectionLimit
        to: POS-004
        note: '**Ten seats is the per-sale maximum** — `toggleSeat` (4106).'
      provenance: board TICVAI POS Terminal · toggleSeat (4106) + drawerConfirm (4118); seats are held
        for 8 minutes
    - to: POS-005
      trigger: Charge, or swipe the pay control
      control: primaryButton#charge
      precondition: cart.lineCount > 0
      guard: payment.take
      carries:
      - cart
      - guest
      - discount
      - orderType
      - table
      - taxTotals
      returnsTo: POS-002
      discards: []
      onFailure:
      - when: declined
        to: POS-005#paymentFailed
        note: Retry reuses the same idempotency key and transaction id — `retryPayment` (4645). A retry
          is never a new transaction.
      - when: timeout
        to: POS-005#paymentFailed
      - when: networkLost
        to: POS-005#paymentUnknown
        note: '**The branch that matters.** A card authorisation interrupted mid-flight has an outcome
          nobody knows yet. The board resolves it against the gateway (`checkPaymentStatus`, 4670) rather
          than guessing. `states/payment.yaml` has no `unknown` and should.'
      provenance: board TICVAI POS Terminal · goCheckout (5157) + launchPayment (4597)
    - to: POS-006
      trigger: Recall held
      control: iconButton#recallHeld
      guard: sale.resume
      provenance: board TICVAI POS Terminal · hold (3992) — hot key F2
    - to: BO-045
      trigger: The new price is wrong on eleven items
      provenance: flow F31 step 6→7
      operation: getLatestBundle
    - to: POS-011
      trigger: Three days later the guest returns one item
      provenance: flow F34 step 5→6
    - to: POS-013
      trigger: A guest wants cash back and the drawer is heavy
      provenance: flow F32 step 3→4
    - to: BO-084
      trigger: The manager sees it in their inbox
      provenance: flow F14 step 2→3
      operation: evaluateApprovalRequirement
      crossesDevice: true
      back: false
    - to: BO-130
      trigger: Four transactions are rejected — a product retired while the till was offline
      provenance: flow F33 step 6→7
      operation: syncOrders
      crossesDevice: true
      back: false
    - to: BO-133
      trigger: The venue's offline exposure crosses a ceiling
      provenance: flow F33 step 3→4
      crossesDevice: true
      back: false
    - to: GST-026
      trigger: Checks the balance in the app
      provenance: flow F18 step 1→2
      crossesDevice: true
      back: false
    - to: POS-001
      trigger: Begin Shift
      carries:
      - boxId
      - shiftId
      - workstationId
      provenance: derived — POS-001 declares entryState.params boxId, shiftId, workstationId, so an edge
        into it must carry them
    - to: POS-007
      trigger: Close Shift
      carries:
      - boxId
      - saleId
      - shiftId
      provenance: derived — POS-007 declares entryState.params boxId, saleId, shiftId, so an edge into
        it must carry them
    - to: POS-010
      trigger: Add to Existing Ticket
      carries:
