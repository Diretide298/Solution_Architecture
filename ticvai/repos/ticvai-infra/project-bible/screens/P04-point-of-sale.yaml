        - Outlet.costCenterId
        - Outlet.openingHours
        - Outlet.isActive
        operation: listOutlets
        provenance: contract tenancy.yaml GET /outlets
    - name: actionBar
      slot: rowActions
      components:
      - kind: primaryButton
        label: Save changes
        operation: setTableLayout
        provenance: contract fnb.yaml PUT /outlets/{outletId}/tables
      - kind: secondaryButton
        label: Save changes
        operation: setTableCombinations
        provenance: contract fnb.yaml PUT /outlets/{outletId}/table-combinations
      - kind: secondaryButton
        label: Save changes
        operation: setItemAvailability
        provenance: contract fnb.yaml PUT /menu-items/{itemId}/availability
    - name: contentBody
      slot: carried
      components:
      - kind: cardList
        bindsTo: TableDefinition[]
        label: Floor
        provenance: carried from the previous definition
      - kind: detailPanel
        label: Combinations
        notes: '**Declared, not inferred.** Two adjacent tables do not always combine — a pillar, a step,
          a service run. A host knows which pairs work and a floor plan does not.'
        provenance: carried from the previous definition
      - kind: multiSelect
        label: 86 an item
        provenance: carried from the previous definition
      - kind: primaryButton
        label: Apply
        provenance: carried from the previous definition
  states:
    loading: This outlet, its tables and its menu.
    error: Could not load configuration. **Selling is unaffected.**
    emptyFirstRun: '**A new outlet with no layout.** The one action that draws the first table.'
    emptyNoResults: Nothing matches.
    emptyNoAccess: '**You are signed in as a cashier.** Configuration needs a manager role — ADR-0002
      makes that the person, not the device, so signing in again on this same till is the way through.'
    offline: '**Configuration is refused offline.** A table layout edited on two disconnected tablets
      is two layouts, and the room only has one.'
  apis:
  - operationId: listOutlets
    contract: tenancy
    purpose: List outlets
    trigger: onLoad
  - operationId: setTableLayout
    contract: fnb
    purpose: Configure the table layout
    trigger: onAction
    invalidates:
    - listOutlets
  - operationId: setTableCombinations
    contract: fnb
    purpose: Which tables can be pushed together, and to what capacity
    trigger: onAction
    invalidates:
    - listOutlets
  - operationId: setItemAvailability
    contract: fnb
    purpose: Mark an item available or eighty-sixed
    trigger: onAction
    invalidates:
    - listOutlets
  - operationId: listMenus
    contract: fnb
    purpose: List menus
    trigger: onLoad
  entryState:
    params:
    - name: workstationId
      from: session
    - name: outletId
      from: session
    - name: itemId
      from: deepLink
    coldEntry: '**Resolves from the session, which carries the workstation and its outlet.** A till is
      signed into, not navigated to — and the outlet is a property of where the till is bolted down, not
      something a cashier picks.'
    preloaded:
    - Outlet.id
    - Outlet.code
    - Outlet.name
    - Outlet.venueId
    - Outlet.kind
  wireframe:
    status: notStarted
    provenance: generated
    board: wireframes/P04 Venue POS.dc.html#pos-024
  apisNote: Rebuilt 9 September 2026 from the 5 operations this screen declares, not from a workshop pack
    — it has none. Columns are every field the response schema declares, plumbing aside — narrowing them
