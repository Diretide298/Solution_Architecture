  states:
    loading: The sell ticket catalogue list.
    error: Could not load. Names which read failed and leaves the sell ticket catalogue untouched.
    emptyFirstRun: No sell ticket catalogue yet. Carries the create action; distinct from a filter that
      matched nothing.
    emptyNoResults: The filter narrowed it and the sell ticket catalogue are still there. Names the active
      filter and offers to clear it.
    emptyNoAccess: Names the missing permission. **Never an empty table** — that reads as *there is no
      data* and sends somebody to support with the wrong question.
    offline: Served from the local catalogue bundle (ADR-0013). One read path, always local — the terminal
      does not know whether it has a network.
    denied: The catalogue reads normally and **Charge is refused** without `payment.take`. The cart is
      held, not cleared, so a permitted operator can complete the same sale.
