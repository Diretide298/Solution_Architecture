    states:
      idle:
        note: Nothing has been sent to the terminal yet.
      processing:
        operation: createPayment
        note: Authorisation in flight. **The idempotency key is minted here and reused on every subsequent
          attempt** — it is what makes the inquiry path safe.
      unknown:
        note: '**The terminal charged a card and never answered.** Inquiry, never retry: a retry takes
          the money a second time, and the guest is standing there.'
      checking:
        operation: inquirePaymentStatus
        note: Asking the gateway what actually happened to the attempt.
      completed:
        terminal: true
        goes: POS-002
        note: Settled. The till returns to the catalogue for the next sale.
      failed:
        terminal: true
        retryTo: idle
        note: Declined or cancelled, and known to be so. Safe to take again.
    transitions:
    - from: idle
      'on': Charge
      to: processing
    - from: processing
      'on': approved
      to: completed
    - from: processing
      'on': declined or cancelled
      to: failed
    - from: processing
      'on': gatewayTimeout
      to: unknown
      note: The network dropped between the charge and the answer.
    - from: unknown
      'on': Check status
      to: checking
    - from: checking
      'on': settled
      to: completed
      note: Confirmed with the gateway — the payment succeeded and no duplicate was created.
    - from: checking
      'on': notFound
      to: failed
