# Tenant subscription — state model
# Contract: subscription.Subscription.status
# Checked by tools/check-states.py.

entity: Tenant subscription
contract: subscription
enum: Subscription.status
enumKind: inline
enumSchema: Subscription
enumProperty: status
owner: subscription
initial:
- trial
- active
terminal:
- expired
transitions:
- from: trial
  to: active
  operation: setSubscription
  trigger: operation
  guard: Converted to paying
- from: trial
  to: expired
  trigger: timer
  guard: Trial ended without converting
- from: active
  to: pastDue
  trigger: timer
  guard: '**Payment failed. Service continues** — CF-61’s principle: degrade, never stop. A gate refusing
    entry over an invoice is worse than an unpaid invoice'
- from: pastDue
  to: active
  operation: setSubscription
  trigger: operation
  guard: Paid
  isReversal: true
- from: pastDue
  to: cancelled
  operation: cancelSubscription
  trigger: operation
  guard: '**Terminated after the dunning period.** A commercial decision with a person behind it, never
    automatic'
- from: active
  to: cancelled
  operation: cancelSubscription
  trigger: operation
  guard: Cancelled by the tenant or by TICVAI
- from: cancelled
  to: active
  operation: setSubscription
  trigger: operation
  guard: '**Reactivated on the same record, within the paid period** (decided 28 September, audit
    STATE-SUBSCRIPTION). History and entitlements stay on the one subscription'
  isReversal: true
- from: cancelled
  to: expired
  trigger: timer
  guard: '**The paid period ended.** From here the subscription cannot be reactivated; the tenant starts
    a new one (decided 28 September, audit STATE-SUBSCRIPTION)'
notes: '**`pastDue` never stops service.** An unpaid invoice is a commercial problem and a closed gate
  is an operational one, and the second is worse for both parties.


  Termination is always a decision, never a timer.


  **`cancelled` is not terminal** (decided 28 September, audit STATE-SUBSCRIPTION). A cancelled
  subscription can be reactivated on the same record until its paid period ends; the timer then moves
  it to `expired`, and a returning tenant needs a new subscription.'
