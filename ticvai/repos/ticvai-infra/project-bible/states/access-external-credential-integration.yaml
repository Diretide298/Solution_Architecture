# Access external credential integration — state model
# Contract: access.AccessExternalCredentialIntegration.status
# Checked by tools/check-states.py.

entity: AccessExternalCredentialIntegration
contract: access
enum: AccessExternalCredentialIntegration.status
enumKind: inline
enumSchema: AccessExternalCredentialIntegration
enumProperty: status
owner: access
description: One external credential source, such as a hotel room card, hotel PMS, digital wallet or
  partner format (declared 29 September, writers pass). `setHotelWalletExternal` is an upsert keyed by
  `integrationId` and carries `status` in its body, so every move is that one write. **An integration
  cannot move to `active` without a `connectionSecretRef`** (`422`).
initial:
- draft
- active
terminal: []
transitions:
- from: draft
  to: active
  operation: setHotelWalletExternal
  trigger: operation
  guard: '`status` `active` and a `connectionSecretRef` is set (`422` without one)'
- from: draft
  to: inactive
  operation: setHotelWalletExternal
  trigger: operation
  guard: '`status` `inactive`; the integration is kept configured but not used'
- from: active
  to: inactive
  operation: setHotelWalletExternal
  trigger: operation
  guard: '`status` `inactive`; external credentials from this source stop resolving at the gate'
- from: inactive
  to: active
  operation: setHotelWalletExternal
  trigger: operation
  guard: '`status` `active` and a `connectionSecretRef` is set'
openQuestions:
- There is no delete. If a retired integration must be distinguishable from a paused one, the enum
  needs a closed state; until then `inactive` covers both.
notes: '**No terminal state, by design** (`terminal: []`): an inactive integration can be switched on
  again with the same write. Created `draft`, or `active` directly when the body already carries a
  secret reference.'
