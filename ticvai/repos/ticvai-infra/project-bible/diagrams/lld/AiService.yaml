id: LLD-AiService
title: AiService — 30 operations, 15 tables
generatedBy: tools/derive-diagrams.py
tier: engagement
index: diagrams/hld.yaml
why: '**Separate at any size, and not because of size.** ADR-0020 makes it a hard boundary: only this
  service writes AI tables, and it is read-only against the transactional core. **That boundary caught
  four wrongly-placed writes in one week** — it survives because it is enforced, and enforcing it across
  a shared deployment is harder than across a network.'
scale: Latency-tolerant, cost-sensitive, token-metered. Different hardware from everything else.
ifDown: Down degrades suggestions and the concierge. **Nothing that takes money depends on it.**
