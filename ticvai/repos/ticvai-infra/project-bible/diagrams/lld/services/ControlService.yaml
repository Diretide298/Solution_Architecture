why: '**Three contracts, one schema, 41 tables.** Subscription, platform operations and the public API
  all write `control.*` — **they are one bounded context that was split into three contracts for API-surface
  reasons, not for data reasons.**


  Splitting them would give three services writing one schema, which is the arrangement every distributed-data
  guide warns about.'
