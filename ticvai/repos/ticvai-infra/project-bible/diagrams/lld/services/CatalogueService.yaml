id: LLD-CatalogueService
title: CatalogueService — 132 operations, 40 tables
generatedBy: tools/derive-diagrams.py
tier: commerce
index: diagrams/hld/02-services.yaml
why: '**What is sold, at what price, in which seat.** Promotions and seating are folded in because both
  are pricing and availability against the same product — a promotion that cannot see a price list and
  a seat that cannot see a product are two round trips on the hot path of every sale.'
scale: Read-heavy, bundle-published to tills. **The catalogue bundle is this service's output** (ADR-0013).
ifDown: A bad publish reaches every workstation. Versioned and rollback-able for that reason.
coverage:
  operations: 132
  inAFlow: 57
  percent: 43%
  note: '**Flow coverage is how much of this service a journey has walked.** A service under 40% is
    unwalked rather than under-documented.'
