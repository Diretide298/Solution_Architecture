notes: 'A redemption right carries an entitlement reference and **no personal data**, which is what
  makes cross-border validation lawful under ADR-0009.


  The return from `exhausted` is the one that matters: two cells can both believe a single-entry pass
  was used, and only the owning cell can settle it. **Renamed 26 August.** `CrossRegionEntitlement`
  said nothing about what it holds — a right to redeem what, where? ** says it: an entitlement bought
  in one jurisdiction and honoured in another** (ADR-0010).'
