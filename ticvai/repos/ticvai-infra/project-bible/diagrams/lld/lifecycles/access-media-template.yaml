openQuestions: null
notes: '**The six designer operations create the template in `draft`** (each owns one `designer` value).
  Editing a published template takes the working design back to `draft` without touching the version
  in force. **A template `pendingApproval` or `scheduled` is in flight:** a designer write or `archiveMediaTemplate`
  on it is refused `409 template-in-flight` until the approval is decided or the schedule passes. Archiving
  is final; a new template is a new design.'
