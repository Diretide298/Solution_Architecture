description: One media design template and its working design document (declared 29 September, writers
  pass). The six designer operations write the draft; `approveMultiMediaPreview` submits it through
  the approvals engine, and a human approves. **Publishing creates a new `AccessMediaTemplateVersion`
  and never rewrites credentials already issued**; `status` here is the state of the working design,
  and `currentVersion` keeps pointing at the version in force.
