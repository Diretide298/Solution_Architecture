- from: expiringSoon
  to: expired
  trigger: timer
  guard: Lapsed. **Outstanding settlements survive** — the agreement ends, the money owed does not
- from: active
  to: suspended
  operation: updatePartnerAgreement
  trigger: operation
  guard: Halted without terminating. A payment dispute, or a compliance question
- from: suspended
  to: active
  operation: updatePartnerAgreement
  trigger: operation
  guard: Resolved
  isReversal: true
- from: active
  to: terminated
  operation: updatePartnerAgreement
  trigger: operation
  guard: Ended by either party
- from: suspended
  to: terminated
  operation: updatePartnerAgreement
  trigger: operation
  guard: Suspended and then ended
notes: '**`expiringSoon` is computed.** A partner whose agreement lapses without warning keeps selling
  on terms that no longer exist, and the first anyone knows is a settlement nobody can price.


  **Terminating does not settle.** Obligations outlive the agreement that created them, which is why
  `InterEntityObligation` has its own lifecycle.'
