<text class="sub" x="30" y="466">22 tables are written by more than one contract and all 22 are correct — the owner defines the row, a foreign writer may only append.</text>
<text class="sub" x="30" y="486">control is the largest schema at 41 tables and three writing contracts. It is the one worth splitting: developer accounts have a different audience and cadence.</text>
<text class="sub" x="30" y="512">pii is separate from identity deliberately — and it has three writers, not one: identity mints the subject, access enrols a face, marketing updates a profile the subject owns.</text>
