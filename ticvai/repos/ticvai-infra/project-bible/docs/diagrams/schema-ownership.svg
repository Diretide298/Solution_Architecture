<text class="hd" x="30" y="32">Twenty-six schemas, sixteen owners — and who else writes them</text>
<text class="sub" x="30" y="54">One Postgres per cell. Segregation by domain, partitioning by scope_path. Amber where more than one contract writes.</text>
