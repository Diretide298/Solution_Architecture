  screen: ADM-339
  action: Opens Governance & Compliance Command Center
  operations: []
  outcome: Provide administrators, auditors and security teams with an overview of approval governance
    health across the organization.
- step: 2
  screen: ADM-340
  action: Works in Segregation of Duties Policy Manager
  operations: []
  outcome: Define combinations of actions that the same person must not be allowed to perform. The matrix
    explicitly states that users shall be prevented from approving their own requests.
- step: 3
  screen: ADM-339
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 4
  screen: ADM-341
  action: Works in Four-Eyes & Dual-Control Policy
  operations: []
  outcome: Configure sensitive actions requiring approval from at least two independent authorized persons.
    The source explicitly requires dual approval capability for sensitive operations.
- step: 5
  screen: ADM-339
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 6
  screen: ADM-342
  action: Works in Authentication & MFA Policy Manager
  operations: []
  outcome: Define the authentication strength required before an approver can execute sensitive approval
    decisions. The source requires authentication before approval actions and supports MFA for sensitive
    approvals.
- step: 7
  screen: ADM-339
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 8
  screen: ADM-343
  action: Works in Sensitive Action Confirmation
  operations: []
  outcome: Configure the final confirmation requirements before a sensitive approval becomes binding.
