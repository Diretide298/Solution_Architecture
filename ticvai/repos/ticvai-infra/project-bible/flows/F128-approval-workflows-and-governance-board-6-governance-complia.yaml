- step: 9
  screen: ADM-339
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 10
  screen: ADM-344
  action: Works in Digital Signature Management
  operations: []
  outcome: Manage workflows where approval decisions require a digital signature. The matrix explicitly
    requires digital-signature support for sensitive approvals.
- step: 11
  screen: ADM-339
  action: Returns to the board's landing screen
  operations: []
  outcome: Ready for the next screen on this board
- step: 12
  screen: ADM-345
  action: Works in Immutable Approval Record & Tamper Detection
  operations: []
  outcome: Protect completed approval records from unauthorized modification. The matrix requires completed
