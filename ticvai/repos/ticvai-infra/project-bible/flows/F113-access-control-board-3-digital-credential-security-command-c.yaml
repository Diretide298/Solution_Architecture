id: F113
name: 'Access Control board 3: Digital Credential Security Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Access Control board 3. **This route is read from the screens'
    own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-164
  entryPoints:
  - Arrives at Digital Credential Security Command Center
steps:
- step: 1
  screen: BO-164
  action: Opens Digital Credential Security Command Center
  operations:
  - listDigitalCredentialSecurity
  outcome: Central configuration and monitoring page for all secure digital credentials.
- step: 2
  screen: BO-165
  action: Works in Dynamic QR Security Profile Builder
  operations:
  - setDynamicSecurityProfile
  outcome: Configure how a dynamic QR is generated and protected. The matrix requires a unique QR per
    issued ticket/pass and periodic QR refresh to reduce screenshot and duplication fraud.
- step: 3
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-166
  action: Works in Credential Activation & Display Rules
  operations:
  - listCredentialActivationDisplay
  outcome: Configure when the guest is permitted to see/use the credential. The matrix specifies that
    after registration, a ticket may appear as a blurred QR and only become clear and usable near the
    park entrance.
- step: 5
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-167
  action: Works in Device Binding & Session Security
  operations:
  - listDeviceBindingSession
  outcome: Prevent one credential from being shared across unauthorized devices. The source explicitly
    requires tickets to be linked to a specific device/user and suspicious patterns such as device sharing
    and multiple simultaneous sessions to be detected.
- step: 7
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-168
  action: Works in BLE Beacon & Geofence Configuration
  operations:
  - setBleBeaconGeofence
  outcome: Configure location-aware credential activation. This is a major requirement under 3.1.9. The
    matrix requires BLE beacon proximity and geofence boundaries to activate/deactivate credentials at
    venue, attraction, zone and gate level.
- step: 9
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-169
  action: Works in Credential Transfer & Rebinding
  operations:
  - listCredentialTransferRebinding
  outcome: Securely manage digital-ticket transfers. The matrix requires tickets to be transferable through
    email/app, with the recipient required to authenticate before accessing and activating the transferred
    QR.
- step: 11
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-170
  action: Works in Credential Revocation & Lifecycle Events
  operations:
  - listCredentialRevocationLifecycle
  outcome: Immediately invalidate credentials when the underlying ticket changes. Requirement 3.1.4 specifically
    requires dynamic QR invalidation after refunds, cancellations, transfers, exchanges, upgrades or reissues.
- step: 13
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 14
  screen: BO-171
  action: Works in Offline Cryptographic Validation Profile
  operations:
  - listOfflineCryptographicValidation
  outcome: Allow access devices to validate secure credentials without continuous backend connectivity.
    The matrix explicitly requires offline cryptographic validation and embedded entitlement validation
    without real-time backend connectivity.
- step: 15
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 16
  screen: BO-172
  action: Works in Embedded Entitlement Payload Designer
  operations:
  - setEmbeddedEntitlementPayload
  outcome: Determine what operational information can be securely carried by the credential for offline
    decisions. The matrix permits embedded information including ticket type, seat assignment, event ID,
    venue access rights, timeslot, reservations, locker assignments, membership entitlements, guest category
    and validity.
- step: 17
  screen: BO-164
  action: Returns to the board's landing screen
  operations:
  - listDigitalCredentialSecurity
  outcome: Ready for the next screen on this board
- step: 18
  screen: BO-173
  action: Works in Credential Security Simulation, Audit & Publication
  operations:
  - listCredentialSecurity
  outcome: Test the complete secure credential lifecycle before production deployment.
branches:
- at: 1
  condition: Nothing has been set up on Digital Credential Security Command Center yet
  behaviour: The screen declares `emptyFirstRun`. **On a new tenant this is the expected state**, and
    it is a different situation from an empty result on an established one.
  severity: expected
  resolvedBy: Automatic
- at: 1
  condition: The operator does not hold the permission this screen requires
  behaviour: The screen declares `emptyNoAccess`. **The journey stops here rather than failing later**,
    which is the right shape -- but the permission that would satisfy it is not granted by any role in
    `roles.yaml`.
  severity: requiresStaff
  resolvedBy: Unresolved -- see the permission join
exitStates:
- state: completed
  description: Every screen on Access Control board 3 visited
primaryContract: access
contracts:
- access
