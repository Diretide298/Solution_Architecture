$schema: ./_schema.yaml
id: F52
name: A guest books a cabana and uses it
actor: guest
capability: Resource booking
wave: 3
frequency: Routine.
criticality: revenue
primaryContract: resources
contracts:
- resources
- venue-map
- orders
- catalogue
platforms:
- P02
trigger:
  description: 'A guest wants a cabana for the day and **picks the one they want on the venue map** — B09 on
    the beach, not whichever cabana is free. **Rewritten 29 September** (decided 29 September, rev 3 REV3-15 and
    GAP-C2, superseding audit R073 (c) for resources on an ingested map): cabana maps work like the stadium
    seat map. Until then this flow sold a cabana by kind and assigned the unit (GST-058, GST-050), which stays
    the path at a venue with no map. The web runs the same flow on WEB-047.'
offlineBehaviour: '**Availability needs the network.** Contended inventory cannot be judged from a cache.'
steps:
- step: 1
  screen: GST-074
  action: They open the venue map for the day and see which cabanas are free.
  operations:
  - getVenueMap
  - getMapResourceAvailability
  outcome: '**Every spot in one call**, joined to the map on `resourceId`: number, zone, capacity, price
    band, and held, booked or unavailable ones greyed.'
- step: 2
  screen: GST-074
  action: They tap a cabana, hold it and add it to the basket.
  operations:
  - createResourceHold
  - addCartLine
  outcome: '**The guest chooses the unit** and it is held (`ResourceHold`, a remaining-time counter from
    `expiresAt`) until the order converts the hold into a booking, so nobody takes it in between.'
  crossesDevice: true
- step: 3
  screen: GST-016
  action: They see it in their reservations.
  operations:
  - listReservations
  - getReservation
  outcome: '**Alongside every other booking they hold**, not in a separate resource list.'
  crossesDevice: true
- step: 4
  screen: GST-017
  action: On the day, they arrive.
  operations:
  - getReservation
  outcome: '**The reservation is the credential.** No separate check-in — the same media that admits
    them opens the cabana.'
  crossesDevice: true
branches:
- at: 2
  condition: Someone else holds or books the tapped cabana first, or everything in the area is taken.
  behaviour: '**`409` names the cabana and the clash**; the map refreshes and offers another cabana, another
    area or another day, not an empty list (rev 3 REV3-15).'
  severity: medium
  resolvedBy: getMapResourceAvailability
- at: 2
  condition: The hold runs out before the guest pays.
  behaviour: 'The cabana is released and the guest is told; `extendResourceHold` keeps it longer while paying,
    within the seat-hold bounds (audit R169).'
  severity: medium
  resolvedBy: extendResourceHold
- at: 4
  condition: They cancel on the day.
  behaviour: '`cancelReservation` against the venue policy. **The unit returns to availability immediately**
    — a cancelled cabana held until the system notices is an afternoon lost.'
  severity: high
  resolvedBy: cancelReservation
exitStates:
- state: used
  description: Booked, assigned, used.
- state: cancelled
  description: Returned to availability.
- state: noShow
  description: '**Held then released.** The hold window is a venue decision.'
notes: '**Written 24 August.** F25 walks the staff side of resource rental; **the guest side — browse,
  book, hold, arrive — had never been walked.**'
openQuestions: null
