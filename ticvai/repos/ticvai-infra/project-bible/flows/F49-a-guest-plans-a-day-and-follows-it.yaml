$schema: ./_schema.yaml
id: F49
name: A guest plans a day and follows it
actor: guest
capability: Itinerary planning
wave: 1
frequency: Routine.
criticality: revenue
primaryContract: venue-map
contracts:
- venue-map
- ai
- catalogue
- orders
- queue
platforms:
- P02
- P01
trigger:
  description: A guest with a whole day and too many options. **Planning is the feature a venue sells
    a full-day ticket on.** On the app it is the Plan tab (GST-051); on the web, *Plan your visit* in
    the header (WEB-050).
  entryScreen: GST-051
offlineBehaviour: '**A saved plan reads offline; building or booking one does not.** The plan is worth
  having in a basement; making it needs availability nobody can cache.'
steps:
- step: 1
  screen: GST-051
  action: They answer six questions (party, heights, days, pace, interests, lunch) and choose Make my
    plan.
  operations:
  - generateVisitPlan
  outcome: '**The rules planner, no AI.** A plan per day that leaves out rides over a child''s height
    and plans lunch where the chosen cuisine is served. **Each day uses only its own park''s rides,
    dining and retail (shops and kiosks)** in a multi-venue tenant (client meeting 30 September, MoM
    4.7): a cuisine or shop the day''s park lacks is reported, never taken from another park.'
- step: 2
  screen: GST-053
  action: They swap, remove and add items, undo a change and add Fast Track.
  operations:
  - getVisitPlan
  - listVisitPlanAlternatives
  - updateVisitPlan
  outcome: '**Every change is a new version**, so undo is one step back. Swap candidates suit everyone
    in the party.'
- step: 3
  screen: GST-054
  action: They ask the AI planner to change the plan in their own words.
  operations:
  - sendAiMessage
  - requestSuggestion
  - updateVisitPlan
  outcome: '**The agent refines the rules plan** through the plan operations (`requestSuggestion` kind
    `itinerary`, guest-allowed since 29 September). With AI off or failing the rules plan stays.'
- step: 4
  screen: GST-053
  action: They choose Book this plan.
  operations:
  - bookVisitPlan
  outcome: The plan and its add-ons become cart lines; the guest confirms dates and tickets in the basket.
- step: 5
  screen: GST-041
  action: They check out.
  operations:
  - getCart
  - checkoutCart
  outcome: Paid like any other basket; the tickets land on the Tickets tab.
- step: 6
  screen: GST-059
  action: They follow it through the day.
  operations:
  - getVisitPlan
  - getWaitTimes
  - updateVisitPlan
  outcome: '**Re-ordered as waits change**, with the guest deciding. A plan fixed at 9am is a plan
    abandoned by 11.'
  crossesDevice: true
exitStates:
- state: followed
  description: Planned, booked and largely followed.
- state: planned
  description: Planned and saved but not booked; the plan stays on the Plan tab.
- state: abandoned
  description: '**Plans are abandoned constantly and that is normal** — the value is in what was attempted.'
branches:
- at: 1
  condition: Nothing suits the whole party on the chosen day (every ride is over a child's height, or
    the park is closed).
  behaviour: '**Refused with a reason**, naming the answer that ruled everything out, and the answers
    are kept so changing one costs nothing.'
  severity: recoverable
  resolvedBy: guest
- at: 1
  condition: A cuisine or shop the guest chose exists at none of the day's park's points (only one park
    has the Indian restaurant).
  behaviour: '**Said, not faked** (client meeting 30 September, MoM 4.7): the day is planned from that
    park''s own points, `unmatchedPreferences` names the park that has it, and the guest may move the day
    there by changing answers.'
  severity: recoverable
  resolvedBy: guest
- at: 3
  condition: AI is off for the venue, not licensed, or the call fails or times out.
  behaviour: '**Falls back to the rules plan, never to an error.** The planner chat says it is
    unavailable; everything on GST-053 keeps working.'
  severity: recoverable
  resolvedBy: Automatic
- at: 4
  condition: An item sold out after the plan was made.
  behaviour: The basket is not built for that item; the guest is told which one and offered a swap,
    and the rest of the plan is kept.
  severity: recoverable
  resolvedBy: guest
notes: '**Written 24 August.** **Deferred on 28 September** (audit R187) and **brought into Block A on
  29 September** (the 29 September re-plan, MOB-6): a rules-based Plan tab with the AI planner agent
  on top, superseding R187, the deferral half of R209 and rev 3 GAP-C3. The web runs the same planner
  on WEB-050 (questions, plan, Book this plan to the cart). The plan operations are venue-map
  `generateVisitPlan`, `getVisitPlan`, `updateVisitPlan`, `listVisitPlanAlternatives` and
  `bookVisitPlan` (tables `venuemap.visit_plan`, `venuemap.visit_plan_item`).'
openQuestions: null
