$schema: ./_schema.yaml
id: F78
name: A supplier is set up and a catalogue is priced and published
actor: venueManager
capability: A supplier is set up and a catalogue is priced and published
wave: 2
frequency: As the venue needs it.
criticality: revenue
primaryContract: catalogue
contracts:
- catalogue
- inventory
- promotions
platforms:
- P08
trigger:
  description: A new range arrives and has to become sellable.
offlineBehaviour: None of it offline. Publishing changes what every till charges.
steps:
- step: 1
  screen: BO-083
  action: The supplier is found or set up, and its quotation recorded.
  operations:
  - listSuppliers
  - createSupplier
  - recordQuotation
  outcome: '**Suppliers are the tenant''s; a venue records the quotation** (audit R183). The quoted
    price is what a purchase order line later prefills.'
- step: 2
  screen: BO-007
  action: The new range becomes products in the directory.
  operations:
  - createMerchandise
  - createProduct
  - setAlternativeCodes
  outcome: '**One product per sellable thing, with its barcodes.** A range that is not in the directory
    cannot be priced or scanned.'
  crossesDevice: true
- step: 3
  screen: BO-009
  action: The range is priced.
  operations:
  - listPriceLists
  - setPrices
  outcome: What the tills will charge, from when.
  crossesDevice: true
- step: 4
  screen: BO-014
  action: The priced range is published to the tills.
  operations:
  - transitionProductLifecycle
  - publishBundle
  outcome: '**Publishing is what changes what every till charges**, which is why it is its own step.'
  crossesDevice: true
branches:
- at: 1
  condition: A step in the chain is not licensed for this tenant.
  behaviour: '**The chain stops at the module boundary.** `requiresModule` on each screen decides —
    a tenant without the retail licence does not see the retail half, and the journey is shorter rather
    than broken.'
  severity: medium
  resolvedBy: getModuleEnablement
exitStates:
- state: completed
  description: The chain ran as the client drew it.
- state: stoppedAtModule
  description: '**A licence boundary, not a failure.**'
notes: '**Re-authored 28 September to follow the purpose of each screen it visits** (decided 28 September, audit R261): production planning (BO-112) left the journey, since a kitchen production sheet is no part of setting up a supplier and pricing a range, and the publish step now lands on Catalogue Publishing. **Supplier to shelf, as the client drew it.** `updateSupplier` and `getStockTransfer` were both
  built on 24 August because this board named them and nothing answered. **Derived from the client''s
  own `GOES TO` edges**, not from an inferred path — a pair of frames the client linked is evidence;
  a chain assembled from unrelated pairs is a guess.'
openQuestions: null
