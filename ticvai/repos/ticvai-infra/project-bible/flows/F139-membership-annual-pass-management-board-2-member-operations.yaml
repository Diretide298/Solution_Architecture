id: F139
name: 'Membership   Annual Pass Management board 2: Member Operations Command Center'
actor: venueManager
wave: 3
frequency: routine
criticality: operational
platforms:
- P08 Venue Management
provenance: derived-from-board
offlineBehaviour: Not stated by the board. **The client's reference does not say**, and this flow will
  not guess.
trigger:
  description: The work the client grouped as Membership   Annual Pass Management board 2. **This route
    is read from the screens' own navigation**, and the reason anyone walks it has still to be written.
  entryScreen: BO-294
  entryPoints:
  - Arrives at Member Operations Command Center
steps:
- step: 1
  screen: BO-294
  action: Opens Member Operations Command Center
  operations:
  - listMember
  outcome: Provide membership teams with a real-time operational dashboard for the complete active member
    population.
- step: 2
  screen: BO-295
  action: Works in Member 360° Membership Account Workspace
  operations:
  - setMemberMembershipAccount
  outcome: Provide a complete operational view of an individual member and their membership contract.
    This should be the primary screen an authorized membership-service agent opens when helping a member.
- step: 3
  screen: BO-294
  action: Returns to the board's landing screen
  operations:
  - listMember
  outcome: Ready for the next screen on this board
- step: 4
  screen: BO-296
  action: Works in Membership Activation, Assignment & Credential Management
  operations:
  - listMembershipActivationCredential
  outcome: Manage the operational process that turns a purchased membership product into an active membership
    assigned to a specific individual.
- step: 5
  screen: BO-294
  action: Returns to the board's landing screen
  operations:
  - listMember
  outcome: Ready for the next screen on this board
- step: 6
  screen: BO-297
  action: Works in Visit, Admission & Entitlement Usage Monitor
  operations:
  - listVisitAdmissionEntitlement
  outcome: Provide membership teams with complete visibility of how a member uses admission and other
    membership entitlements.
- step: 7
  screen: BO-294
  action: Returns to the board's landing screen
  operations:
  - listMember
  outcome: Ready for the next screen on this board
- step: 8
  screen: BO-298
  action: Works in Membership Freeze, Suspension & Reactivation Management
  operations:
  - listMembershipFreezeSuspension
  outcome: Manage temporary interruption of membership rights without necessarily terminating the membership
    contract.
- step: 9
  screen: BO-294
  action: Returns to the board's landing screen
  operations:
  - listMember
  outcome: Ready for the next screen on this board
- step: 10
  screen: BO-299
  action: Works in Membership Upgrade, Downgrade & Product Migration Operations
  operations:
  - listMembershipUpgradeDowngrade
  outcome: Manage operational movement of an active member between membership products or tiers.
- step: 11
  screen: BO-294
  action: Returns to the board's landing screen
  operations:
  - listMember
  outcome: Ready for the next screen on this board
- step: 12
  screen: BO-300
