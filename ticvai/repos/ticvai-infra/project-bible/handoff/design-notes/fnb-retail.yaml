  EMP-071:
    summary: 'The rental attendant''s start point at the counter (Kayak station, Beach Hut, Bike hub): who is arriving for
      a rental and what each booking still lacks before the equipment can go out. It must be a working queue of today''s
      bookings with a big "Scan voucher" action (DI-758), not eight KPI tiles over nothing. The one thing to get right is
      that each row shows its readiness at a glance, so the attendant fetches a signature or a supervisor before the guest
      reaches the counter, not after.

      '
    inputs:
    - field: Scan voucher / Search
      rule: 'Primary entry is the camera scan of the booking QR the guest received on confirmation (DI-757, DI-758); the
        search box takes the booking reference or the guest''s name or mobile. A scan that matches opens the check-out for
        that booking directly (EMP-072 is not a separate stop on the handheld; see the consolidation correction).

        '
      source: DI-758 | DI-757 | MoM 2026-09-09 4.7
    - field: Filters
      rule: 'Keep Location (defaults to the attendant''s own station), Product, Start time window, Group/Individual and
        Readiness. Drop "Venue" on the handheld: a staff session is already scoped to one venue. Status is a chip row (Awaiting
        arrival · Late arrival · Checked out today), not a multi-select.

        '
      source: contracts/satellite/rental.yaml#listRentalBookings | screens/P06-staff-app.yaml#EMP-071
    outputs:
    - element: Booking row
      rule: 'Reference, guest name, product x quantity (e.g. "Single kayak x2"), booked window in GST, location, group badge
        when the booking has more than one participant, and a readiness strip of four dots (Agreement · Requirements · Deposit
        · Equipment) from the computed readiness array, each green or amber. Sort by start time ascending; late arrivals
        pinned to the top in amber.

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalBooking | DI-758
    - element: Counters above the queue
      rule: 'Only counters the data can produce: Arriving next 30 min (awaitingArrival, from within 30 min), Ready for check-out
        (awaitingArrival with every readiness item satisfied), Missing requirements (any readiness item unsatisfied), Late
        arrivals (awaitingArrival, from in the past), Checked out today (checkedOut, checkedOutAt today). Each counter is
        a tap-to-filter chip, not a dashboard card.

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalBooking | DI-758
    actions:
    - action: Scan voucher
      result: 'Opens the camera; a recognised booking opens its check-out at the first unsatisfied step. Unknown code: "No
        rental booking found for this code" with Search as the fallback. A booking for another location: show it with "Booked
        at Beach Hut" and let the attendant continue (no silent refusal).

        '
      source: DI-758 | contracts/satellite/rental.yaml#getRentalBooking
