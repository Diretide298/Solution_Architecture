# fnb-retail process design notes. Authored by the fnb-retail process agent, 1 October 2026.
# Read by tools/export-design-batch.py into each screen's block of the batch BUNDLE.md.
# Schema: handoff/design-notes/README.md (the shared brief). Corrections go to the lead as change requests.
process: fnb-retail
title: Food, Beverage & Retail
owner: fnb-retail process agent (Claude), 1 October 2026
processSummary: 'Food & beverage, retail, rentals, inventory and procurement across the till (P04), the kitchen display
  (P15), the staff app (P06), Venue Management (P08), the guest web and app (P01/P02), the kiosk (P05) and the CMS (P13).
  COUNTER SERVICE (F108): the cashier takes the order on the Food & Drink board from the outlet''s menu in force (sections
  in the outlet''s order, option groups attached to the item), sends it to the kitchen, and only then charges — send to
  kitchen, then charge, for every POS F&B order (R261, upheld against the v2 frame by POSV2-4). The kitchen ticket is on
  the rail while the card is in the guest''s hand; an unpaid sent order is cancelled while ordered or accepted and voided
  with a reason after (R125(3), R091(5)); the guest gets an order number, and the customer-facing status board (numbers
  only) is the kitchen display''s KIT-007, mirrored on the till''s queue (POSV2-7). TABLE SERVICE (F29, F80, F94): a party
  is seated with its covers, orders across the visit, courses are fired by the pass (DI-333, DI-407), the bill is printed
  and settled at the end and split by amount, covers, category, item or seat (DI-106); the client''s table statuses are
  Available → Ordered → Table closed → Reserved with no cleaning status (DI-336); moving and merging tables stay on the
  staff app until after r2 (POSV2-8). GUEST ORDERING (F11, F48): a guest inside the venue orders in the app or web for pickup
  or delivery to a seat or a scanned location (DI-288, DI-291); F&B and retail are optional licensed modules completed inside
  TICVAI (DI-505), kept simple (DI-1091); no food without an admission ticket (DI-292); table reservations and the waitlist
  do not go through the cart and a dining deposit is a venue option, off by default (DI-1048, DI-1049, R077). KITCHEN (P15,
  F83, F88): TICVAI''s own display on commodity screens (19 September, replacing the 31 July "integration point only", DI-077);
  one kitchen ticket per preparation station from the outlet''s routing rules with a fallback display (DI-323); a fired
  timer counts up and resets per course, not shown for quick service (DI-334); displays are assigned to stations and filter
  by course, with no station-load tile in r1 (R277). 86 takes an item off sale on every till and guest menu immediately
  (R110(c)); guests always see "Sold out", never a missing dish. RETAIL (F17, F34, F51): scan and sell through the same
  cart, charge and payment as tickets and food (DI-795), one cart, one receipt and one QR per guest (DI-293); system stock
  per venue gates the sale (DI-294); returns by receipt or order number only in r1 (R139(c)), refund to the original tender
  with a reason code and note (DI-796, DI-797); Shop & Drop is paid online and collected on the way out (R236), a merchandise
  reservation lasts to the end of the visit day (R169, R215). TILL MONEY (F32, F73, F74, F87): the float is counted by denomination
  with note images and typed quantities (DI-775, DI-776, R229) while the hardware checks itself (DI-778); the close is a
  blind count — the cashier never sees the expected cash, and a supervisor accepts a variance above the threshold on the
  till with a PIN (R080(e), POSV2-3); cash out, cash in and safe drops adjust the expected figure (DI-274). INVENTORY AND
  PROCUREMENT (F15, F30, F35, F76, F92): configuration is per outlet (DI-330); requisition → approval → purchase order with
  RFQ (DI-348); counts are blind until submitted (R110(a)); available = on hand − allocated (R171(5)); no granular warehouse
  statuses (DI-346); weighted average and FIFO costing (DI-344). RENTALS (F197–F206): product set-up (serialised, pooled
  or combined, DI-740), availability, pricing, deposits, booking, check-out (handover), active rentals, return, damage and
  deposit settlement; a quick swap restarts the clock and a late swap earns only a free extension (DI-762); simplified item
  states (DI-500); AI only reports and recommends maintenance (DI-772). Staff devices carry TICVAI branding (DI-296); guest
  surfaces carry the venue''s. source: [F108, F29, F80, F94, F11, F48, F83, F88, F17, F34, F51, F32, F73, F74, F87, F15,
  F30, F35, F76, F92, F197, F202, F203, F204, R261, POSV2-1..8, R080, R110, R125, R139, R169, R171, R215, R236, R277, DI-077,
  DI-106, DI-293, DI-294, DI-323, DI-330, DI-333, DI-334, DI-336, DI-346, DI-740, DI-762, MoM 2026-08-18 4.1-4.13, MoM 2026-08-19
  4.1-4.9, MoM 2026-09-09 4.1-4.18]

  '
vocabulary:
- term: Send to kitchen
  meaning: Put the order on the kitchen rail. On the till it always comes before Charge.
  avoid:
  - Fire
  - Fire order
  - Submit order
  - kitchen fires on payment
  source: R261 | POSV2-4 | F108 step 3
- term: Charge
  meaning: The till's single tender step (Payment, POS-005); the button reads "Charge AED 110.25".
  avoid:
  - Checkout (on staff screens)
  - Pay now
  source: F108 step 4 | screens/P04-point-of-sale.yaml#POS-021
- term: Fire / Hold (a course)
  meaning: Kitchen-pass words for releasing or holding the next course of a table, and the "fired" timer.
  avoid:
  - using "fire" for sending an order from the till
  source: DI-333 | DI-334 | DI-407
- term: Kitchen ticket
  meaning: The slip on the kitchen display, one per preparation station.
  avoid:
  - Order (on the kitchen display)
  - KOT
  source: R210
- term: Ready · Served · Collected · Delivered
  meaning: How an order reaches the guest; a server marks Served, a counter Collected, a runner Delivered (with the location).
  avoid:
  - Done
  - Complete
  - Bumped (as a status)
  source: R125 | contracts/satellite/fnb.yaml#recordOrderHandover
- term: Recall (kitchen) / Recall held sale (till)
  meaning: Bring a mis-bumped kitchen ticket back to the rail; separately, bring a held cart back into a sale. Never "Recall"
    alone where both could apply.
  avoid:
  - Undo bump
  - Restore
  source: contracts/satellite/fnb.yaml#recallKitchenTicket | POSV2-6
- term: Unavailable (86) / Sold out
  meaning: Staff screens say "Unavailable" and may add "86"; guest screens say "Sold out". Immediate everywhere.
  avoid:
  - Out of stock (for food)
  - Disabled
  - Hidden
  source: R110 | contracts/satellite/fnb.yaml#getGuestMenu
- term: Order type
  meaning: Dine-in · Quick service · Takeaway · Delivery, chosen in the cart.
  avoid:
  - Service mode
  - Fulfilment source (on the till)
  source: DI-789 | contracts/satellite/fnb.yaml#/components/schemas/ServiceMode
- term: Covers
  meaning: The number of guests at a table, entered when seating; drives split-by-covers.
  avoid:
  - Pax (except as a small suffix on the floor plan)
  - Heads
  source: DI-104 | contracts/satellite/fnb.yaml#openTableVisit
- term: Vacant · Seated · Ordered · Bill requested · Table closed · Reserved
  meaning: Table statuses on every floor plan (till and staff app); "Table closed" is the client's word for after payment.
  avoid:
  - Cleaning
  - Needs clearing
  - Dirty
  source: DI-336 | DI-792
- term: Till · Cash drawer
  meaning: Staff copy may say "till" for the workstation; the cash drawer is the deposit box.
  avoid:
  - Terminal id as a heading
  - Deposit box (on staff screens)
  source: R156
- term: Float · Count · Blind count · Variance
  meaning: The opening float; the denomination count; the closing count made without seeing the expected cash; counted minus
    expected.
  avoid:
  - Expected in drawer
  - Discrepancy
  - Error
  source: R080 | POSV2-3
- term: Cash out · Cash in · Safe drop
  meaning: Taking cash out of the drawer mid-shift, adding change, and a supervisor moving cash to the safe with the cashier
    as witness.
  avoid:
  - Lift
  - Withdrawal (as button labels)
  source: DI-274 | contracts/spine/shift.yaml#createCashMovement | contracts/spine/shift.yaml#withdrawFromDepositBox
- term: Menu item · Merchandise item · Inventory item · SKU
  meaning: The scoped product words; SKU is a variant's code, Product stays the sellable thing.
  avoid:
  - SKU as the item's name
  - Article
  source: R131
- term: Stock on hand · Allocated · Available
  meaning: Available is on hand minus allocated.
  avoid:
  - Inventory (as a number)
  - Free stock
  source: R171 | DI-361
- term: Requisition · Purchase order · Goods receipt · Transfer · Count · Write-off
  meaning: The procurement and stock words, in that flow.
  avoid:
  - GRN as the only label
  - Indent
  source: DI-341 | DI-348 | DI-362 | DI-363
- term: Shop & Drop
  meaning: Bought and paid now, collected on the way out.
  avoid:
  - Click & collect
  source: R236
- term: Check-out (rental) · Return (rental)
  meaning: Handing equipment to the guest and taking it back. On the same screens payment is "Charge" or "Pay".
  avoid:
  - Checkout (for a handover)
  - Check-in (for a return)
  source: DI-758 | DI-765
- term: Deposit hold · Release · Capture
  meaning: A refundable deposit held, given back in full, or partly kept for damage with the rest released.
  avoid:
  - Charge deposit
  - Refund deposit
  source: DI-752 | R127
- term: Extension · Swap · Overdue · Late fee
  meaning: The active-rental words; a quick swap restarts the clock, a late swap earns a free extension.
  avoid:
  - Renewal
  - Exchange (for a swap)
  source: DI-761 | DI-762 | DI-764
screens:
  WEB-036:
    summary: 'The guest web''s food screen for someone already inside the venue. They scan the QR on a table, lounger, cabana
      or seat and land here in the browser, with no app needed. For outlets that offer it, the same screen also handles
      takeaway and delivery with a time slot, and booking a restaurant table or joining its waitlist (in the app those two
      live on GST-070). The one thing to get right: the guest learns where the food is going and whether it can come there
      before building a basket, and every refusal arrives before payment, never after.'
    inputs:
    - field: Where you are (location)
      rule: 'First step for in-venue ordering. A scanned code arrives with the link and is claimed at once; the guest is
        never shown the code. Fallback when the QR is damaged: a short text box for the human-readable location code ("Lounger
        B-14", "Table 12"), never a list of every location. At a seated event the seat comes from the guest''s ticket and
        is offered prefilled ("Deliver to Row H, Seat 4?"), not typed. Where several outlets serve the location, the guest
        picks the outlet next.'
      source: contracts/satellite/fnb.yaml#claimLocationSession | F11 step 1 | DI-288 | DI-291 | TRACKER Workshops/Actions
        row 56
    - field: Party size (at a table)
      rule: Asked only when the scanned location is a table (optional, minimum 1). Not asked at a lounger, cabana or seat,
        which have no table visit.
      source: contracts/satellite/fnb.yaml#/components/schemas/LocationSession | DI-1000
    - field: How you get it (order type)
      rule: Offer only what the chosen outlet supports. To my table, seat or lounger (orderingMethod appToTable, needs the
        location step). Collect from the counter (appToCollect, with collectionEnabled). Delivery to an address (deliveryEnabled).
        An outlet whose method is counterOnly or notAvailable shows its menu to read, with no Add buttons and the line "Order
        at the counter". The guest never sees the words "mode", "fulfilment" or "ordering method".
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderingMethod | contracts/satellite/fnb.yaml#/components/schemas/FnbDeliveryPolicy
        | DI-205
    - field: When (collection time or delivery window)
      rule: ASAP first, labelled with the policy's minutes ("About 25 min"; delivery "About 45 min"), then fixed slots of
        slotMinutes. Times are in the venue's time zone. Only open slots are listed, because a slot closes when the kitchen
        cannot make it. No date picker for same-day in-venue orders; a date appears only for advance takeaway or delivery.
        Up to three quick choices share one screen.
      source: contracts/satellite/fnb.yaml#listFulfilmentSlots | contracts/satellite/fnb.yaml#/components/schemas/FnbDeliveryPolicy
        | DI-1001
    - field: Delivery address
      rule: Building (required), unit, emirate and directions (500 characters at most). Emirate is a choice from the outlet's
        emiratesServed, not free text. Checked before the menu, so an address outside the area never reaches a basket.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderFulfilment | DI-1039
    - field: Cutlery
      rule: A checkbox "Add cutlery", off by default. Shown only where the outlet's cutleryOptIn is on.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderFulfilment | contracts/satellite/fnb.yaml#/components/schemas/FnbDeliveryPolicy
    - field: Quantity per dish
      rule: 1 to 20 per line. The stepper stops at 20 and says why; a quantity of 0 removes the line.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderLine
    - field: Note for the kitchen
      rule: Optional, 200 characters at most, one per dish, placeholder "Allergies or requests". Allergy notes belong here,
        and the kitchen ticket shows them prominently.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderLine
    - field: Payment
      rule: Card or digital wallet only on the guest web. "Add to my table's bill" appears only where the location session
        joined an open table visit and the outlet runs a tab. Room charge is not offered.
      source: contracts/spine/orders.yaml#createPayment | R080 | contracts/satellite/fnb.yaml#createGuestFnbOrder | decided
        2 October 2026 by Chinmay (CHG-NOTE-004)
    - field: Book a table (date, time, party size)
      rule: 'One screen: restaurant, date, time and party size, plus an optional note for allergies or requests. No table
        picking (a host seats the party on the night) and no duration field (the venue sets it). Name and contact are prefilled
        from the signed-in profile.'
      source: contracts/satellite/fnb.yaml#createTableReservation | REV3-8 | DI-1001 | DI-1048 | DI-688
    - field: Join the waitlist (party size, seating)
      rule: 'Party size and a seating preference: Any (default), Indoor, Outdoor, Bar, Booth, High chair needed. Two screens
        at most.'
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist | DI-1001
    - field: Where the outlet is (an outlet property)
      rule: Inside the venue (needs an admission ticket) or Standalone (no ticket). Ordering from an inside-the-venue outlet
        needs admission (a ticket or a claimed location in the venue); a standalone restaurant outside the venue sells takeaway
        and delivery without a ticket.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Outlet list
      rule: Only outlets open now, so a guest is never sent to a restaurant that closed an hour ago. Each card shows photo,
        name, zone, cuisine, how to order ("Order to your seat", "Collect", "Counter only") and the closing time. A wait
        estimate ("About 12 min") appears only when the outlet reports one; with none, show nothing and never invent a figure.
      source: contracts/satellite/fnb.yaml#listDiningOutlets | contracts/satellite/fnb.yaml#/components/schemas/DiningOutlet
    - element: Menu
      rule: Sections in the outlet's own order. Below the menu name, a small line from inForceUntil ("Lunch menu until 16:00"),
        because a guest browsing breakfast at 10:55 should know. Each dish shows photo, name as written (dish names are
        not translated), description, price and its allergens, always visible on the card. A dish with no allergens says
        "No allergens declared"; the list is never left out.
      source: contracts/satellite/fnb.yaml#getGuestMenu | contracts/satellite/fnb.yaml#/components/schemas/GuestMenu | F11
        step 2 | DI-975
    - element: Sold out
      rule: A dish with isAvailable false stays in its place, greyed, with a "Sold out" badge, its reason when given ("Back
        at 15:00"), and Add disabled. It is never hidden or filtered out by default. On guest screens the word is "Sold
        out", never "86" or "Out of stock".
      source: contracts/satellite/fnb.yaml#getGuestMenu | R110
    - element: Prices
      rule: 'Prices are formatted with the menu''s currency and currencyScale: AED with 2 decimals, and BHD or KWD with
        3, the third decimal never rounded.'
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestMenu | DI-306
    - element: Basket
      rule: Each line lists its choices ("Hot, Burnt butter rice"), with a quantity stepper and the line price. For delivery
        the basket adds the delivery fee, "Add AED 46.00 more for free delivery" while below freeDeliveryAbove, and the
        minimum order. The total shown is the quotedTotal sent with the order.
      source: DI-1039 | DI-1050 | contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderRequest
    - element: Order placed
      rule: 'The order number is large, because it gets called out across a counter. Below it: where the order is going
        ("Lounger B-14 · Pool deck") or the collection point, and the ready time as a clock time. The guest goes straight
        on to tracking (WEB-038).'
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderResult | R152
    - element: Table booked
      rule: 'Confirmed at once, with no basket: "Table for 4 · Thu 15 Oct · 19:30 · Oasis Bistro", then "No card needed",
        "Change" and "Cancel booking". Cancelling is free.'
      source: REV3-8 | DI-1048 | contracts/satellite/fnb.yaml#updateTableReservation
    - element: Deposit (only when the venue enabled it)
      rule: 'Shown only when the booking comes back awaitingDeposit. Show the amount and how it was worked out ("AED 100.00
        per guest × 6 = AED 600.00"), whether the card is only authorised or charged now, "Free to cancel until Wed 14 Oct,
        19:30" (refundableUntil), and what happens on a late cancel or a no-show. The deposit goes to the cart as its own
        line, and a countdown shows the 15-minute hold. Never draw a fixed AED 100: amount and basis are venue settings.'
      source: REV3-8b | DI-1049 | contracts/satellite/fnb.yaml#/components/schemas/TableReservationDeposit | contracts/spine/orders.yaml#/components/schemas/DiningDepositPolicy
        | R169
    - element: On the waitlist
      rule: The quoted wait ("About 25 min") and the status in plain words ("You're on the list", then "Your table is ready,
        come to the host stand by 19:42" when notified). "Leave the waitlist" is always visible.
      source: contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist | R073
    - element: Receipt
      rule: The F&B order has its own payment step and its own receipt; it does not join the guest's ticket receipt (DI-293's
        one receipt does not apply to F&B).
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Scan the code / Enter lounger or table number
      result: 'Claims the location. Success shows "Ordering to Lounger B-14". Where an open table visit exists, the guest
        joins it ("You''ve joined Table 12, one bill for the table"). A refusal names one cause: code expired ("This code
        has expired, scan the code on your lounger again"), location out of service, or nothing delivers here, which offers
        counter collection instead.'
      source: contracts/satellite/fnb.yaml#claimLocationSession | F11 step 1 | F48 step 4
    - action: Add
      result: A dish with no modifier groups goes straight into the basket. A dish with groups opens the modifier side panel
        (WEB-037). The panel appears whenever groups are attached; there is no venue on/off setting.
      source: REV3-9 | DI-1050
    - action: Place order and pay
      result: The order and the total the guest saw go to the server, which recomputes the price; then payment by card or
        wallet. The kitchen sees the order only once payment succeeds, unless it goes on an open table tab. The button reads
        "Pay AED 86.00", never "Send to the kitchen" (see corrections). While payment is unresolved the screen says "Checking
        your payment", and the kitchen is not told.
      source: contracts/satellite/fnb.yaml#createGuestFnbOrder | F11 step 3 | F11 step 4
    - action: Reserve
      result: Books the table. With no deposit the confirmation shows straight away, with nothing in the basket. With a
        deposit, the deposit line goes into the cart and the guest pays through the normal checkout; the booking is confirmed
        once the payment is authorised.
      source: contracts/satellite/fnb.yaml#createTableReservation | contracts/spine/orders.yaml#addCartLine | REV3-8 | REV3-8b
    - action: Join waitlist / Leave waitlist
      result: Joining confirms at once, with no payment and no basket. Leaving asks "Give up your place? The next party
        moves up.", names the restaurant and party size, and cannot be undone; joining again puts the party at the back.
      source: contracts/satellite/fnb.yaml#leaveRestaurantWaitlist | R073 | REV3-8
    edgeCases:
    - case: A dish sells out between browsing and paying
      expected: The order is refused (itemUnavailable) with the dishes named. Mark those basket lines "Sold out" and offer
        to remove them; the rest of the basket stays. Never drop a line silently.
      source: contracts/satellite/fnb.yaml#createGuestFnbOrder
    - case: The price changed (menu switch, promotion expired)
      expected: The order is refused (priceChanged). Show the new total and ask the guest to confirm it. The order is never
        placed silently at a different price.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderRequest
    - case: The menu changes over while the guest browses (breakfast to lunch at inForceUntil)
      expected: Reload the new menu and flag basket lines that are no longer on it. The guest removes them before paying.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestMenu
    - case: The location session expired (the guest moved, or came back the next day)
      expected: '"Scan the code where you''re sitting again." The basket is kept.'
      source: F11 step 1 | contracts/satellite/fnb.yaml#/components/schemas/LocationSession
    - case: Delivery rule broken
      expected: 'Below the minimum: checkout stays off with "Minimum order AED 90.00, add AED 12.50". Outside the area:
        "We don''t deliver to this address" with Change address and Switch to takeaway. Slot just closed: "That time just
        filled, pick another". Delivery or collection switched off: that option disappears.'
      source: DI-1039 | contracts/satellite/fnb.yaml#createGuestFnbOrder
    - case: The outlet refuses the order after payment (past last orders, out of an ingredient)
      expected: Tracking shows "Cancelled, refunded to your card" straight away, not after ten minutes. If one dish fails
        after the order was accepted, only that line is cancelled and refunded.
      source: F11 step 5
    - case: The scanned code belongs to a different venue from the one the guest picked
      expected: Offer to switch to that venue ("You're at Aqua Park, switch?"). The venue choice is the guest's, remembered
        on the device and changeable.
      source: R267 | designer default
    - case: The guest is somewhere nothing delivers
      expected: Delivery to their spot is not offered at all. Offer counter collection instead. The failure comes before
        the order, not after the payment.
      source: F48 step 4 | contracts/satellite/fnb.yaml#/components/schemas/DeliveryLocation
    - case: Table not available
      expected: 'The two refusals read differently. noTableForPartySize: "No table for 8 at 19:30, try a smaller party or
        another time". outletFullAtTime: "Fully booked at 19:30". Both offer other times.'
      source: contracts/satellite/fnb.yaml#createTableReservation
    - case: The deposit is not paid within the hold
      expected: After 15 minutes the table is released. Say so, and offer to book again.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservationDeposit | R169
    - case: Leaving a waitlist after being seated
      expected: Refused, with the current status named ("You've already been seated").
      source: contracts/satellite/fnb.yaml#leaveRestaurantWaitlist
    - case: Offline
      expected: The menu already loaded stays, with its age. The pay button reads "Offline, ordering is paused". Claiming
        a location and booking wait for the connection.
      source: screens/P01-guest-web-storefront.yaml#WEB-036 | F11 step 1
    consistency:
    - with: GST-024
      note: 'Must be functionally identical (DI-970, DI-1084): the same order types, sold-out and allergen display, delivery
        rules, refusals and wording. Mobile layout may differ (DI-1086). In the app, table booking and the waitlist are
        on GST-070; on the web they are here.'
    - with: GST-070
      note: The table booking, deposit and waitlist wording must match word for word ("No card needed", the deposit terms,
        "Leave the waitlist").
    - with: WEB-037
      note: The modifier side panel opened by Add is WEB-037's panel; the basket line format comes from it.
    - with: WEB-038
      note: Order placed leads to WEB-038, carrying the order; the order number shows the same way on both.
    - with: POS-021
      note: The till shows the same menu in force (getGuestMenu, staff audience since 1 October). A dish sold out at the
        till is sold out here immediately.
    - with: KIT-007
      note: The guest status board shows the same order number a guest sees here.
    - with: WEB-010
      note: The deposit line shows in the shared cart with the reservation date (23SEP-9). Table bookings with no deposit
        never appear in the cart.
