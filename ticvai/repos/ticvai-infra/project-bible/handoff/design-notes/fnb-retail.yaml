    - what: No start or cancel operation for a batch (see BO-113).
      why: '"Start" is when ingredients leave stock (R125 (8)) and cannot be drawn honestly.'
      source: R125
    - what: Overlap with BO-113 and BO-112 (same plan and complete operations).
      why: One Production screen with tabs (see BO-112).
      source: DI-987
  BO-139:
    summary: Logging waste where it happens - item, quantity, reason - and seeing what was wasted, where, and what it cost
      (FNB-5E). Waste depletes stock without a sale and is the ground truth for waste prediction, so the reason code matters
      more than it looks. The client asked for wastage and spoilage recorded per item. The one thing to get right is a fast
      entry (item, quantity, reason) that works offline and shows its value at current cost.
    inputs:
    - field: Outlet
      rule: Outlet picker (the user's outlet by default); never an id.
      source: contracts/satellite/fnb.yaml#recordWaste
    - field: Lines
      rule: One or more lines, each an item (search by name), quantity and unit; not a multi-select. Value at current cost
        is shown per line as it is typed.
      source: contracts/satellite/fnb.yaml#recordWaste | DI-341
    - field: Reason
      rule: Spoilage, Preparation error, Customer return, Breakage, Over-production, Expired. One reason per entry; mixed
        reasons are separate entries.
      source: contracts/satellite/fnb.yaml#recordWaste | MATRIX 4.6.31
    - field: Note
      rule: Optional, up to 500 characters.
      source: contracts/satellite/fnb.yaml#recordWaste
    outputs:
    - element: Recorded
      rule: '"Recorded - value AED 1,456.00 at current cost" after save, with the entry added to the list.'
      source: contracts/satellite/fnb.yaml#recordWaste
    - element: Waste list
      rule: Date, outlet, item, reason, quantity, value, logged by; filter by reason and period; value by reason as a split.
      source: screens/P08-venue-back-office.yaml#BO-139 | MATRIX 6.1.38
    actions:
    - action: Record waste
      result: Depletes stock for each line and records the value; offline it is kept on the device and sent in order.
      source: contracts/satellite/fnb.yaml#recordWaste
    edgeCases:
    - case: Offline
      expected: Recorded on the device with "Will sync"; the time recorded is when it was logged, not when it synced.
      source: contracts/satellite/fnb.yaml#recordWaste
    - case: A large write-off
      expected: 'Where the venue has switched its waste-approval policy on, an entry above a value band waits for approval
        and needs a photo above the photo threshold (FNB-5E: AED 100 / 500 / 2,000); with the policy off, no approval step
        is drawn.'
      source: screens/P08-venue-back-office.yaml#BO-139 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - case: A retail customer return
      expected: Not here - retail returns go through the till by receipt or order number; "Customer return" here is food
        sent back.
      source: R139 | contracts/satellite/fnb.yaml#recordWaste
    consistency:
    - with: EMP-067
      note: The same waste entry on the staff app (FNB-5E is mapped to EMP-067); same reasons, same fields.
    - with: BO-044
      note: F&B Outlets also records waste; one entry component.
    - with: BO-138
      note: Batch losses use Over-production or Preparation error.
    sampleData:
      entries:
      - date: 24 Oct 2026 21:40
        outlet: Oasis Bistro
        item: Fresh Sea Bass
        qty: 11.2 kg
        reason: Preparation error
        value: AED 1,456.00
        by: Priya Nair
      - date: 23 Oct 2026 09:15
        outlet: Bite & Go
        item: Brioche Bun
        qty: 104 pc
        reason: Breakage
        value: AED 218.40
        by: Omar Ziad
      - date: 22 Oct 2026 16:05
        outlet: Beach Hut kiosk
        item: Milk full fat
        qty: 12 L
        reason: Expired
        value: AED 86.00
        by: Aisha Rahman
    corrections:
    - what: The form shows an "Id" text field and a "Recorded at" date picker.
      why: The id is generated by the device (idempotency) and the time is the device's own; neither is typed.
      source: contracts/satellite/fnb.yaml#recordWaste | R254
    - what: '"Lines" is a multi-select.'
      why: A waste line is item plus quantity plus unit; a multi-select cannot carry quantities.
      source: contracts/satellite/fnb.yaml#recordWaste
    - what: No read of recorded waste exists, so the screen is a lone form (configEditor) with no list, history or totals.
      why: FNB-5E and DI-341 need the list of waste per item; MATRIX 6.1.38 promises count, value and a split by reason.
      source: screens/P08-venue-back-office.yaml#BO-139 | MATRIX 6.1.38 | DI-341
    - what: The attached frames are Inventory Board 3 inv-3g (Adjustment & Write-Off) and inv-3j (Shrinkage & Accuracy);
        the F&B frame FNB-5E (Wastage, Spoilage & Write-Off) is mapped to EMP-067.
      why: The inventory frames are adjustments across warehouses; the F&B waste frame is this screen's.
      source: screens/P08-venue-back-office.yaml#BO-139
    - what: The reasons the frames use (Trim, Re-fire, Equipment failure) are not in the reason list, and there is no "Other"
        with a note.
      why: Staff will pick the nearest wrong reason, which poisons the waste-prediction ground truth the contract warns
        about.
      source: contracts/satellite/fnb.yaml#recordWaste | screens/P08-venue-back-office.yaml#BO-139 | R222
    - what: The name says "Returns" but the screen records only food waste; retail returns are elsewhere.
      why: Rename to "Wastage, Spoilage & Write-Off" to avoid a cashier looking here for a refund.
      source: R139 | screens/P08-venue-back-office.yaml#BO-139
    decisions:
    - question: Does waste above a value need approval (FNB-5E draws AED 100 / 500 / 2,000 bands and photo evidence above
        AED 500)? R144 lists recounts and retail returns, not waste, and no setting or approval call exists.
      decision: A waste-approval policy the venue can switch on or off; when on, value bands and a photo above a value.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-192 | CHG-NOTE-004
      questionSource: R144 | screens/P08-venue-back-office.yaml#BO-139
  BO-140:
    summary: What is sellable right now at an outlet, and the kitchen's food-safety state beside it (FNB-5J, FNB-2H). Staff
      switch a dish off (86) with a reason and an optional automatic return time, and on again; the change is live on every
      till and guest menu of the outlet the moment it returns - there is no Save step. The HACCP side shows checks due and
      missed, open corrective actions and the temperature checkpoints. The one thing to get right is the immediacy of the
      toggle and the "Other needs a note" rule.
    inputs:
    - field: Outlet
      rule: Outlet picker by name; the list is that outlet's menu items grouped by section, with search.
      source: contracts/satellite/fnb.yaml#getMenu | DI-330
    - field: Available toggle
      rule: Off opens a short prompt - reason (Sold out, Ingredient unavailable, Equipment down, Seasonal, Other), note,
        and "Back on" (Next service, End of day, a chosen time, or By hand). Choosing Other makes the note required and
        the confirm button stays disabled until it is filled. On sends at once with no prompt.
      source: R110 | R222 | contracts/satellite/fnb.yaml#setItemAvailability
    - field: Temperature checkpoint
      rule: Label as staff call it (Walk-in 2, Dessert counter), kind (Fridge, Freezer, Holding cabinet, Blast chiller,
        Core probe, Delivery, Display counter, Ambient), safe range in degrees C (either end may be empty, not both), how
        often it must be read (minutes), whether a breach needs a corrective action, active.
      source: contracts/satellite/fnb.yaml#setTemperatureCheckpoint
    outputs:
    - element: Item status
      rule: Available, or "86" with reason, since when, who, and "back at 18:00" when a return time is set; guests see the
        same item as "Sold out".
      source: contracts/satellite/fnb.yaml#/components/schemas/MenuItem | contracts/satellite/fnb.yaml#getGuestMenu
    - element: 86 history
      rule: Time off, time back, who called it and refused orders, per item and outlet, for the day and 30 days.
      source: contracts/satellite/fnb.yaml#list86Events | screens/P08-venue-back-office.yaml#BO-140
    - element: Food-safety status
      rule: Checks due, checks missed, open corrective actions and unsigned findings; a missed check counts the same as
        a failed one. An open breach shows the unit, peak reading, limit and duration.
      source: contracts/satellite/fnb.yaml#getHaccpStatus | F28 step 1 | F28 step 6
    - element: Temperatures
      rule: Degrees Celsius with one decimal; a reading outside the range in danger colour, near the limit in warning.
      source: contracts/satellite/fnb.yaml#/components/schemas/TemperatureLog
    - element: Daily counts
      rule: An item can carry a daily count ("6 left"); at zero it goes Sold out automatically, until the next count.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: 86 now
      result: Live on every till and guest menu of the outlet when it returns; the row flips at once and the history adds
        the event. Other without a note is refused (400) and the prompt says why.
      source: R110 | R222 | contracts/satellite/fnb.yaml#setItemAvailability
    - action: Back on
      result: Immediate, no prompt.
      source: R110 | contracts/satellite/fnb.yaml#setItemAvailability
    - action: Save checkpoint
      result: Saves the unit and its range; past readings keep the range they were judged against (a range revised now does
        not re-judge January).
      source: contracts/satellite/fnb.yaml#setTemperatureCheckpoint
    edgeCases:
    - case: The device is offline when an item is 86'd
      expected: The toggle shows "Saved on this device - tills will update when it reconnects"; offline tills keep selling
        from the cached menu and the kitchen refuses an 86'd item before the guest pays.
      source: contracts/satellite/fnb.yaml#setItemAvailability | F108 step 3
    - case: Someone else changed the same item first
      expected: The row refreshes to the current state with "Changed by Omar Ziad at 19:42" (412).
      source: contracts/satellite/fnb.yaml#setItemAvailability
    - case: A checkpoint is not read in time
      expected: A minor corrective action opens on its own (missed check) and appears in the open list.
      source: R125 | contracts/satellite/fnb.yaml#logTemperature
    - case: Escalating a critical finding with no food-safety lead
      expected: Refused; the message links to F&B settings to name the lead.
      source: R096 | contracts/satellite/fnb.yaml#escalateCorrectiveAction
    consistency:
    - with: KIT-008
      note: The kitchen's unavailable-items view; same reasons, same "86" wording, same history.
    - with: POS-021
      note: The till greys the item with "86" the moment this returns.
    - with: EMP-062
      note: The staff app's availability and HACCP entry; same toggle behaviour and prompt.
    - with: BO-136
      note: The food-safety lead is named on F&B settings.
    sampleData:
      outlet: Bite & Go (Aqua Park)
      unavailable:
      - item: Chicken Machboos
        reason: Ingredient unavailable
        since: '11:05'
        by: Priya Nair
        backOn: Next service 18:00
      - item: Mango Lassi
        reason: Other
        note: Blender down, engineer called
        since: '12:20'
        by: Omar Ziad
        backOn: By hand
      breach:
        unit: Chiller 2 - Bite & Go
        peak: 8.4 C
        limit: 5.0 C
        duration: 40 min
        action: Open - assigned to Fatima Al Suwaidi
      haccp:
        roundsDone: 3 of 4
        missed: 1
        openActions: 2
        unsigned: 1
      checkpoints:
      - label: Walk-in 2
        kind: Fridge
        range: 0.0 to 5.0 C
        every: 120 min
      - label: Hot hold - pass
        kind: Holding cabinet
        range: 63.0 C and above
        every: 60 min
    corrections:
    - what: The population is listExpiringBatches (stock batches, lot numbers, supplier, "Within days") - the Available
        toggle has no menu item to bind to.
      why: The list must be the outlet's menu items with their availability (getMenu items carry isAvailable and the reason).
      source: screens/P08-venue-back-office.yaml#BO-140 | contracts/satellite/fnb.yaml#getMenu
      status: fixed
      by: CHG-WIR-008
    - what: list86Events, getHaccpStatus and listTemperatureCheckpoints are not declared; setTemperatureCheckpoint is, with
        no list to edit from.
      why: The 86 history, the HACCP status and the checkpoint list are what the frame FNB-5J and flow F28 show.
      source: contracts/satellite/fnb.yaml#list86Events | contracts/satellite/fnb.yaml#getHaccpStatus | F28 step 6
      status: fixed
      by: CHG-WIR-008
    - what: No board frame; FNB-5J ("Availability, 86 & Food Safety") is mapped to EMP-062 and FNB-2H ("Availability & 86
        Management") to nothing.
      why: Attach both so the designer starts from the client's drawing.
      source: screens/P08-venue-back-office.yaml#BO-140
    - what: Marking an item unavailable is on seven screens (POS-021, POS-024, EMP-062, BO-014, BO-049, BO-140, KIT-008)
        and HACCP status on three (EMP-062, BO-044, KIT-008).
      why: Make BO-140 the back-office home for F&B availability and food safety; the others are shortcuts with the same
        behaviour (DI-671).
      source: DI-671 | contracts/satellite/fnb.yaml#setItemAvailability
    - what: FNB-5J says a safety 86 cannot be cleared until its corrective action is signed, and FNB-2H distinguishes stock-driven
        86s that clear on receipt; the contract has no link between an 86 and a corrective action, and no stock-driven 86.
      why: The frame promises behaviour nothing implements; draw only manual 86 until decided.
      source: screens/P08-venue-back-office.yaml#BO-140 | contracts/satellite/fnb.yaml#setItemAvailability
    decisions:
    - question: Should a temperature breach automatically 86 the dishes that depend on that unit (FNB-5J "auto-86 on safety
        breach")?
      decision: 'Drawn default stands (answer: "Suggest, don''t auto: the breach banner offers ''86 affected items''"): No
        automatic 86; the breach banner suggests "86 affected items".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-193 | CHG-NOTE-004
      questionSource: screens/P08-venue-back-office.yaml#BO-140
    - question: Are daily counts ("6 left") with automatic 86 at zero in scope (FNB-2H "Count set")? No operation sets a count.
      decision: Daily counts ('6 left') on menu items; an item goes sold out automatically at zero.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-194 | CHG-NOTE-004
      questionSource: screens/P08-venue-back-office.yaml#BO-140
  BO-142:
    summary: 'Store Rules, Controls & Permissions lists the controls in force in a shop (discount limit, refund threshold,
      age check, manager override, price override) and who may act past each one. The one thing to get right is that a rule
      names a permission ("needs Supervisor"), and it is a row with who changed it and when. Roles themselves are managed
      elsewhere.

      '
    inputs:
    - field: Rule
      rule: Kind (Discount limit, Refund threshold, Age check, Manager override, Price override), outlet (or all outlets),
        limit (a percentage or an amount, chosen per limit by the venue, for a discount or price-override limit; an amount
        in AED for a refund threshold; years for an age check), "Needs" (a picker of permission names in plain words, e.g.
        "Supervisor approval"), Enabled toggle.
      source: contracts/satellite/retail.yaml#/components/schemas/StoreRule | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Rules table
      rule: 'Grouped by outlet: rule, limit, who may pass it, enabled, last changed by and when. Changing a rule takes effect
        on the tills of that outlet.'
      source: contracts/satellite/retail.yaml#listStoreRules
    actions:
    - action: Save rule
      result: Saves one rule. The audit (by whom, when) updates.
      source: contracts/satellite/retail.yaml#setStoreRules
    consistency:
    - with: POS-011
      note: The refund threshold here is what makes the till ask for a supervisor's PIN on a return above it.
    - with: BO-106
      note: Roles and their permissions are edited there. This screen only names them.
    sampleData:
    - outlet: Marina Bay Store
      rule: Refund threshold
      limit: AED 500.00
      needs: Supervisor PIN
      enabled: true
      changedBy: Daniel Brooks
      changedAt: 2026-10-02 10:14 GST
    - outlet: Marina Bay Store
      rule: Discount limit
      limit: 15%
      needs: Manager approval
      enabled: true
    - outlet: All outlets
      rule: Age check
      limit: 18 years
      needs: ID check
      enabled: false
    corrections:
    - what: 'Refund thresholds exist twice: StoreRule (refund threshold) and the outlet''s return policy (self-authorise
        limit, second-user limit, approval limit).

        '
      why: 'The till will read one and the back office will edit the other. One source should hold the retail return threshold
        (which needs a supervisor step-up).

        '
      source: R144 | contracts/satellite/retail.yaml#/components/schemas/ReturnPolicy | contracts/satellite/retail.yaml#/components/schemas/StoreRule
    - what: 'The screen binds the roles list (needs the role-management permission) and venue settings (no retail setting).
        The no-access state names TENANT_CONFIGURE, while the read needs a read permission. Saving a rule invalidates the
        roles list.

        '
      why: 'Roles and venue settings are not this screen''s data. Reading settings got its own read permission. The save
        should refresh the rules.

        '
      source: R091 | R254 | contracts/spine/tenancy.yaml#getVenueSettings | contracts/spine/identity.yaml#listRoles
      status: fixed
      by: CHG-WIR-008
    - what: listStoreRules and setStoreRules are stubs whose shape is "a proposal".
      why: The screen cannot be built against an unconfirmed shape.
      source: contracts/satellite/retail.yaml#setStoreRules
    decisions:
    - question: Is a discount or price-override limit an amount or a percentage?
      decision: A discount or price-override limit is a percentage or an amount, chosen per limit by the venue.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-195 | CHG-NOTE-004
      questionSource: contracts/satellite/retail.yaml#/components/schemas/StoreRule
