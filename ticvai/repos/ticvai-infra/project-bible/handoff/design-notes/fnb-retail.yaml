    corrections:
    - what: Board frames fnb-2m (Production Planning & Sheets), fnb-2n (Central Kitchen & Commissary) and fnb-5d (Production
        Execution & Batch) are attached to this settings screen; its own frame is FnB Board 1 fnb-1k ("F&B Global Settings
        & Controls").
      why: The production frames belong to BO-112, BO-113 and BO-138; this mis-mapping is why production operations landed
        here.
      source: screens/P08-venue-back-office.yaml#BO-136
      status: fixed
      by: CHG-SBO-018
    - what: Production operations (buildProductionPlan, releaseProductionPlan, listProductionRuns with status, location
        kind and from filters) and F85 step 1 are on BO-136.
      why: Move to BO-112 (planning); F85 step 1 should point there.
      source: F85 step 1 | R254 | screens/P08-venue-back-office.yaml#BO-112
      status: fixed
      by: CHG-WIR-008
    - what: The whole VenueSettings record is shown and editable - id, currency scale, support hours, quiet hours, biometrics,
        segregated access, alerting, cart and resale limits.
      why: Only the F&B group belongs on an F&B screen; the rest are other screens' settings.
      source: contracts/spine/tenancy.yaml#/components/schemas/VenueSettings | R254
