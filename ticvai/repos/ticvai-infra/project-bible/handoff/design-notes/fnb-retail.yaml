    - field: How you get it
      rule: One choice for the order, shown before paying. Collection points come with their hours ("Collect at the gate,
        main gate desk, open until 30 minutes after close"; "East car park kiosk, staff load the boot"). Or "Deliver to
        my home" with an address, and the shipping fee appears as soon as the address is entered, for the guest to accept
        before payment.
