        - equipment ok
      - reference: RNT-10479
        guest: Daniel Brooks
        product: Stand-up paddleboard x1
        window: 09:30-10:30
        status: Late arrival (+14 min)
    corrections:
    - what: 'The thirty staff-app screens EMP-071..EMP-100 are field-for-field copies of BO-544..BO-573 (same operations,
        layout, states, gaps and entry parameters; only id, route, density and navigation differ). Pairs: EMP-071/BO-544,
        EMP-072/BO-545, EMP-073/BO-546, EMP-074/BO-547, EMP-075/BO-548, EMP-076/BO-549, EMP-077/BO-550, EMP-078/BO-551,
        EMP-079/BO-552, EMP-080/BO-553, EMP-081/BO-554, EMP-082/BO-555, EMP-083/BO-556, EMP-084/BO-557, EMP-085/BO-558,
        EMP-086/BO-559, EMP-087/BO-560, EMP-088/BO-561, EMP-089/BO-562, EMP-090/BO-563, EMP-091/BO-564, EMP-092/BO-565,
        EMP-093/BO-566, EMP-094/BO-567, EMP-095/BO-568, EMP-096/BO-569, EMP-097/BO-570, EMP-098/BO-571, EMP-099/BO-572,
        EMP-100/BO-573. Keep both platforms (decided 11 Sep 2026: the attendant hands over and takes back on a handheld,
        a supervisor watches and settles from the back office), but specify ONE design per step shared by both platforms
        (platform = density and input variant), and give the back office only what a desk adds (supervisor approval, override,
        dispute, venue-wide view). Sixty screen definitions for one process is the board-per-screen mirroring the client
        asked us not to do.

        '
      why: DI-671 asks to minimise separate screens rather than mirror every workshop board; DI-474 and DI-987 ask the same
        for back-office screens. Duplicated definitions will drift and double the design and build work.
      source: screens/P06-staff-app.yaml#EMP-071 | DI-671 | DI-474 | DI-987
    - what: 'Board 6 is ten screens for one act at the counter. Consolidate to two per platform: (1) Check-out queue (EMP-071,
        with EMP-072''s scan as its main action) and (2) Check-out for one booking, a stepped flow Readiness (EMP-073) ->
        Equipment (EMP-074 + EMP-075 + EMP-079, one screen with one row per unit) -> Condition (EMP-076) -> Safety (EMP-077)
        -> Deposit (EMP-078) -> Confirm (EMP-080), ending in ONE check-out call.

        '
      why: 'checkOutRental is consumed by three screens (EMP-077, EMP-078, EMP-080) each with its own submit button, and
        assignRentalEquipment by three (EMP-074, EMP-075, EMP-079). A handover is one act; three submit buttons for it means
        the handover can be "completed" from the safety screen with no deposit step seen. DI-760 asks for a group''s items
        to go out in a single action.

        '
      source: contracts/satellite/rental.yaml#checkOutRental | contracts/satellite/rental.yaml#assignRentalEquipment | DI-671
        | DI-760
    - what: 'Labels use "Checkout" for the rental handover: screen names (Rental Checkout Command Center, Checkout Readiness
