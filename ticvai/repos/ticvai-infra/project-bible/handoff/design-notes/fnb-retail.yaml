      source: contracts/satellite/inventory.yaml#getCountVariance | screens/P08-venue-back-office.yaml#BO-137
    decisions:
    - question: Is "probable cause" (re-fires logged, trim yield, breakage) wanted in r1, and from which data?
      decision: 'Drawn default stands (answer: "No cause column; link to waste and production for the period"): Omit the column;
        link to waste and production for the same period.'
