      source: DEC-055 | CHG-NOTE-004
      questionSource: R277
  KIT-006:
    summary: 'The expeditor at the pass assembles orders whose parts come from several stations, chases a station that is
      holding the rest up, prints the bag label for takeaway and delivery, and hands over. The one thing to get right: for
      each order, which parts are ready and which are missing, and a label that always carries the allergen flags.

      '
    outputs:
    - element: Assembly cards
      rule: 'One card per order: parts ready (ticked) and missing (with station and age); complete orders rise to the top.'
      source: contracts/satellite/fnb.yaml#listKitchenTickets
