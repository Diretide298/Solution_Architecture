  EMP-073:
    summary: 'Step 1 of the check-out for one booking: what must be true before anything is handed over, with a fix for
      each failure. Five rows, each green or amber with the action that clears it. The server enforces the same gate at
      check-out, so this step is a guide, never the only check.

      '
    outputs:
    - element: Readiness rows
