    - case: Device offline
      expected: 'Banner "Offline - showing the queue as of 10:42", rows loaded before the drop stay openable, scan of an unloaded
        booking says it cannot be found offline.

        '
      source: DI-071 | DI-072 | screens/P06-staff-app.yaml#EMP-071
    consistency:
    - with: BO-544
      note: Same queue, same row anatomy and counters; the desk version adds the Venue filter and denser rows.
    - with: BO-534
      note: The booking board counts the same statuses (awaiting arrival, checked out); use the same status labels and colours.
    - with: EMP-081
      note: Same row component as the active-rentals list, with the readiness strip replaced by the due-back time.
    sampleData:
      station: Kayak station, Aqua Park Marina
      date: Sat 17 Oct 2026
      counters:
        arrivingNext30Min: 6
        readyForCheckOut: 4
        missingRequirements: 3
        lateArrivals: 1
        checkedOutToday: 27
      rows:
      - reference: RNT-10482
        guest: Aisha Rahman
