  BO-021:
    summary: 'Staff look up any order at the venue by its number or receipt and see where it is — for a guest at the counter
      asking "where is my food?", a runner confirming a hand-over, or a supervisor checking a disputed sale. One thing to
      get right: it is a search first (by order number, receipt number, guest), then one order''s status; today it binds
      only a single-order guest read with nothing to search by.

      '
    inputs:
    - field: Search
      rule: 'One box that accepts an order number (AQP-104582) or a receipt number, exact match; results list below. Returns
        in r1 are found by receipt or order number only, so the same identifiers must work here.

        '
      source: R139 | R152 | contracts/satellite/retail.yaml#lookupRetailSale
    - field: Hand-over outcome
      rule: 'Offer only the outcome that closes this order''s type: Dine-in closes Served; Quick service and Takeaway close
        Collected; Delivery and Room service close Delivered and require the delivery location (prefilled from the order).
        "Guest not found" and "Refused" are always available and make the note required (max 500).

        '
      source: R125 | contracts/satellite/fnb.yaml#recordOrderHandover
    outputs:
    - element: Order status
      rule: 'The nine-state status as a stepper (Ordered, Accepted, In preparation, Ready, then Served / Collected / Delivered),
        with each line''s kitchen status, because a guest waiting on one dish should see which. Estimated ready time shown;
        "Ready for collection" emphasised.

        '
      source: contracts/satellite/fnb.yaml#getGuestOrderStatus | MATRIX 5.1.11
    actions:
    - action: Record hand-over
      result: 'Enabled only when the order is Ready. Success moves it to the closing state; 409 "not ready or already closed";
        422 "this outcome does not close a <order type> order" or "delivery needs a location". Works offline (a runner loses
        signal crossing the venue).

        '
      source: contracts/satellite/fnb.yaml#recordOrderHandover | F11 step 7
    edgeCases:
    - case: Runner cannot find the guest
      expected: Record "Guest not found" with a note; the order stays Ready, held at the outlet, guest notified to collect.
      source: F11 step 7
    - case: Tenant without the retail or F&B licence
      expected: The search covers only licensed modules; the screen does not offer a module it cannot open.
      source: F81 step 1
    consistency:
    - with: POS-030
      note: Sales Journal on the till finds a sale by the same identifiers; same result row layout.
    - with: KIT-007
      note: The order number shown on a result is the one on the guest status board.
    - with: BO-022
      note: An order found here opens Order Detail for payment, refund and history.
    sampleData:
      search: AQP-104582
      result:
        number: AQP-104582
        outlet: Bite & Go quick-service counter
        type: Quick service
        buzzer: '841'
        status: Ready
        ready_since: 12:53 GST
        lines:
        - Chicken shawarma wrap — ready
        - Halloumi fries — ready
        - Fresh mint lemonade — ready
      handover:
        outcome: Collected
        by: Priya Nair
    corrections:
    - what: '"Order Search" binds only getGuestOrderStatus, a guest-audience read of one order by id, and has no search
        input or list; its states say "No order search yet. Offers Record order handover".

        '
      why: 'The purpose "Find any order taken at this venue" cannot be met. Needs a staff lookup by number: listFnbOrders
        (F&B), lookupRetailSale (receipt/order number, retail) and/or listOrders — none takes an F&B order number today.

        '
      source: screens/P08-venue-back-office.yaml#BO-021 | contracts/satellite/fnb.yaml#getGuestOrderStatus | R254
      status: fixed
      by: CHG-WIR-008
    - what: 'The board frame cited for BO-021 (Retail Board 3 RET-3A) and flow F81 step 1 are the "Retail Sales & POS Command
        Center" — a cross-store sales dashboard (sales today, tills open, tender mix), not an order search.

        '
      why: The frame mapping is wrong; the designer must not take RET-3A as this screen's layout.
      source: F81 step 1 | screens/P08-venue-back-office.yaml#BO-021
      status: fixed
      by: CHG-SBO-008
    - what: Navigation exits to POS-002 "Sell — Ticket Catalogue" carrying orderId (from F81).
      why: A back-office search does not open a till's sell screen on another device; follows from the wrong RET-3A mapping.
      source: F81 step 1 | R251
      status: fixed
      by: CHG-CLN-006
    decisions:
    - question: Is Order Search F&B-only, or every order at the venue (tickets, retail, F&B — one cart, one receipt)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw it venue-wide with a module chip on
        each result; F&B results open the F&B status view.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-030 | CHG-NOTE-004
      questionSource: DI-293 | screens/P08-venue-back-office.yaml#BO-021
  BO-039:
    summary: 'A directory of every till session at the venue — open, on break, counting, waiting for a variance to be accepted,
      closed, auto-closed — for the duty manager, cash office and finance. It watches tills; it does not run them. One thing
      to get right: the blind count binds the cashier, not the back office — once a shift is counted, expected, counted
      and variance are shown here (the expected figure stays hidden until the count is in).

      '
    inputs:
    - field: Till
      rule: A picker of till names grouped by outlet/department, not a "Workstation id" text field.
      source: contracts/spine/shift.yaml#listShifts | R156
    - field: Status
      rule: 'Chips with staff words for ShiftStatus: Awaiting approval (pendingApproval), Open, On break (suspended), Counting
        (pendingClosure), Variance to accept (pendingVariance), Closed, Auto-closed. Default all statuses.

        '
      source: contracts/spine/shift.yaml#/components/schemas/ShiftStatus
    - field: Opened between
      rule: One date-range control with presets Today (default), Yesterday, This week; times in GST.
      source: contracts/spine/shift.yaml#listShifts
    outputs:
    - element: Shift rows
      rule: 'Till, Cashier, Status, Opened, Closed, Opening float, Sales, Refunds, Cash out, Counted, Variance (signed;
        short in red as "AED −40.00 short", over as "AED +5.00 over"), Deposit box / bag number. No ids, venue, scope path
        or currency-scale columns. Amounts use the region currency and its decimals (3 for BHD/KWD, third decimal never
        rounded).

        '
      source: DI-273 | DI-306 | ADR-0018 | contracts/spine/shift.yaml#/components/schemas/Shift
    - element: Expected cash
      rule: 'Empty for a shift not yet counted, shown as "— (revealed after count)"; filled once the count is in, together
        with counted and variance. Variance beyond the venue threshold (proposed AED 20.00) is flagged.

        '
      source: R094 | contracts/spine/shift.yaml#closeShift
    - element: Exceptions badge
      rule: 'Count of incidents (no-sales, drawer opened without a sale, overrides) per shift; a high no-sale count against
        few sales is emphasised.

        '
      source: contracts/spine/shift.yaml#recordNoSale | contracts/spine/shift.yaml#/components/schemas/Shift
    - element: Shift detail
      rule: 'Cash movements in sequence (float, cash out/in, safe drops), approvals (who approved the open, who accepted
        the variance, reason), suspend reason, closed-by when not the holder, held inventory leases on an open shift, and
        an "unsynced sales" warning while syncedAt is empty.

        '
      source: contracts/spine/shift.yaml#listCashMovements | contracts/spine/shift.yaml#/components/schemas/Shift
    actions:
    - action: Approve opening float
      result: 'Only on Awaiting approval rows; reason required (3–300). The shift becomes Open and can trade. 409 when it
        is no longer waiting.

        '
      source: contracts/spine/shift.yaml#approveShiftOpen | F32 step 1 | MATRIX 5.9.8
    - action: Reopen shift
      result: 'Only on Closed rows. Needs a supervisor who did not close it to enter their PIN on this device, plus a reason.
        Refusals say which: "You closed this shift — another supervisor must reopen it", "PIN not accepted", or "The fiscal
        period is closed". The first count is kept.

        '
      source: R144 | contracts/spine/shift.yaml#reopenShift | MATRIX 5.9.5
    edgeCases:
    - case: A shift auto-closed after the venue limit
      expected: Labelled "Auto-closed — not counted"; it has no counted figure and is never shown as balanced.
      source: MATRIX 5.9.5
    - case: A shift closed with sales still journalled offline
      expected: '"Unsynced sales — settlement waits"; the variance is provisional until sync.'
      source: F32 step 8
    - case: A shift waiting for a variance with no supervisor at the till
      expected: Stays "Variance to accept" with time waiting; acceptance is not offered here.
      source: R080 | DI-805
    - case: One till, three cashiers in a day
      expected: Three rows; each cashier answers for their own box and variance.
      source: F32 step 6 | contracts/spine/shift.yaml#listDepositBoxes
    consistency:
    - with: POS-007
      note: Close, blind count and variance acceptance happen there; status words must match.
    - with: BO-040
      note: The "Variance to accept" rows are the same shifts BO-040 lists.
    - with: BO-041
      note: Shift detail movements use the same row format as Cash Movements.
    - with: POS-015
      note: The till-side live cash monitor; DI-273 asks for the same per-till view in both.
    sampleData:
      shifts:
      - till: Till 3 — Bite & Go
        cashier: Priya Nair
        status: Open
        opened: 06:58 GST
        float: AED 500.00
        sales: AED 6,240.00
        cash_out: AED 2,000.00
        expected: — (revealed after count)
      - till: Till 1 — Main Gate ticket office
        cashier: Khalid Al Mansoori
        status: Variance to accept
        opened: 07:02
        closed: '15:05'
        expected: AED 8,480.00
        counted: AED 8,440.00
        variance: AED −40.00 short
      - till: Till 2 — Marina Bay retail store
        cashier: Fatima Al Suwaidi
        status: Closed
        variance: AED +5.00 over
        accepted_by: none needed
    corrections:
    - what: 'Till acts are bound to the back-office directory: Open shift, Close shift, Suspend, Resume, Record no sale,
        Create cash movement, and getCurrentShift ("the shift on the session''s workstation" — a browser has none).

        '
      why: 'These are the cashier''s acts at the till (POS-001, POS-013, POS-020, POS-007); a directory''s purpose "See
        every till, open or closed" does not need them. Bulk attach.

        '
      source: R254 | F32 step 2 | F32 step 5 | F32 step 6 | contracts/spine/shift.yaml#getCurrentShift
      status: fixed
      by: CHG-WIR-008
    - what: '"Accept shift variance" (acceptShiftVariance) is a button on BO-039.'
      why: The one path past a variance is a supervisor on the till with a PIN step-up; the back office does not accept
        it.
      source: R080 | contracts/spine/shift.yaml#acceptShiftVariance | POSV2-3
      status: fixed
      by: CHG-WIR-008
    - what: 'Pattern approvalInbox, table "Waiting for a decision", empty state "Nothing is waiting, which is the good outcome".

        '
      why: It is a directory of all sessions; an empty list on a trading day is not success.
      source: screens/P08-venue-back-office.yaml#BO-039 | DI-273
    - what: 'Text fields "Workstation id" and "Status"; columns id, workstationId, venueId, scopePath, principalId, currency,
        currencyScale.

        '
      why: Plumbing on a user's screen.
      source: screens/P08-venue-back-office.yaml#BO-039
    - what: 'Navigation exits to BO-008 "Product Detail & Variants"; entry state takes shiftId from the session; no entry
        from the Orders & Money hub.

        '
      why: A shift directory has no product link, and a back-office user has no shift in the session.
      source: R251 | screens/P08-venue-back-office.yaml#BO-039
      status: fixed
      by: CHG-WIR-009
    - what: 'DI-273 asks for open and closed sessions "with expected cash and card totals" and a live till monitor; the
        contract withholds expectedCash until the count (R207) and Shift has no per-tender totals (salesTotal is not split
        by cash/card).

        '
      why: The agreed view cannot be drawn for open shifts from the contract; either the decision narrows or Shift gains
        per-tender totals.
      source: DI-273 | contracts/spine/shift.yaml#/components/schemas/Shift
      status: fixed
      by: CHG-WIR-008
    decisions:
    - question: May a supervisor approve an out-of-tolerance opening float remotely from the back office, or only at the till?
      decision: 'Drawn default stands (answer: "Back office too"): Draw "Approve opening float" here; the contract does not
        restrict it to the till.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-171 | CHG-NOTE-004
      questionSource: contracts/spine/shift.yaml#approveShiftOpen | F32 step 1
    - question: Allam asked to explore merging shift-closing and till-closing screens; is BO-039 also the place for BO-040's
        list?
      decision: 'Drawn default stands (answer: "Keep both"): Keep both (BO-040 is a filtered view of BO-039 with the variance
        columns first).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-172 | CHG-NOTE-004
      questionSource: DI-309 | TRACKER Workshops/Actions row 63
  BO-040:
    summary: 'Since R080 (e) this is a watch list, not an approval screen. It lists the shifts whose count left a variance
      beyond the venue threshold, waiting for a supervisor to accept it on the till, and the history of variances accepted
      (who, when, why) for finance. A duty manager uses it to chase tills still waiting; finance uses it before month-end
      and for the over/short report. The one thing to get right: there is no Accept or Refuse button here — the screen says
      where the act happens.

      '
    inputs:
    - field: View
      rule: 'Two tabs: "Waiting at the till" (status pendingVariance, default) and "Accepted" (closed shifts with a variance
        acceptance in their approvals). Optional "Waiting for close approval" (pendingClosure) where the venue supervises
        closes.

        '
      source: contracts/spine/shift.yaml#approveShiftClose
    - field: Period
      rule: Presets Today, This week, This fiscal period (for month-end); outlet/till picker; dates GST.
      source: F13 step 2 | contracts/spine/shift.yaml#listShifts
    outputs:
    - element: Waiting rows
      rule: 'Till, Cashier, Count submitted at, Expected, Counted, Variance (signed, "AED −40.00 short"), Over the threshold
        by (threshold proposed AED 20.00), Waiting for (minutes/hours), Cashier''s note from the close. Oldest first. A
        row in a past fiscal period is marked "Blocks period close".

        '
      source: R094 | DI-275 | F13 step 1 | contracts/spine/shift.yaml#closeShift
    - element: Non-cash variances
      rule: Card/wallet declared versus captured, per tender, beside the cash variance.
      source: contracts/spine/shift.yaml#closeShift
    - element: Accepted rows
      rule: Variance, accepted by (supervisor name), accepted at, reason; never the cashier's own name (approver-is-cashier).
      source: contracts/spine/shift.yaml#acceptShiftVariance
    - element: Where it is resolved
      rule: Each waiting row carries the instruction "A supervisor accepts this on any till (Close Shift) with their PIN,
        or asks for a recount", not a button.
      source: R080 | F32 step 7 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - element: Count breakdown
