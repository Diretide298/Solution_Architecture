  KIT-005:
    summary: 'A head chef moves work between stations mid-service when one is buried and another idle (a temporary rebalance
      that reverts at close), and sees each station''s queue depth to decide. The one thing to get right: a rebalance is
      visibly temporary — it shows when it reverts — and is never mistaken for changing the permanent routing.

      '
