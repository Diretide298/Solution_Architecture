  CMS-009:
    summary: 'Where a venue decides what appears in its website header and footer and in the mobile app''s tab bar, plus
      the Buy tickets button. From the food and retail side, Dining and Shop entries can exist only while those modules
      are enabled. The one thing to get right: every option visibly changes the preview, and an entry that would lead nowhere
      is refused before saving.'
    inputs:
    - field: Where (web header, web footer, mobile tab bar)
      rule: Web and mobile are configured independently (a different mobile arrangement is normal). The tab bar is the bottom
        navigation; the web uses tabs or a drawer.
      source: DI-285 | DI-1087 | contracts/satellite/white-label.yaml#/components/schemas/NavigationConfig
    - field: Items (label, icon, links to, visible, order)
      rule: The label in English and Arabic. Links to a module (Dining, Shop and so on), a content page, a product, an event,
        an outside link (the venue's own site), or an app section (Home, Explore, Plan, Tickets, Map, Account). Drag to
        reorder. At most 12 items, and at most 5 visible tabs, with the rest in "More".
      source: contracts/satellite/white-label.yaml#/components/schemas/LinkTarget | DI-397 | DI-424 | MATRIX 19.1.8 | MATRIX
        19.1.12
    - field: Buy tickets button
      rule: Raised in the centre (default), floating, flat or hidden, plus its label. It shows on every app screen except
        the booking and checkout steps.
      source: contracts/satellite/white-label.yaml#/components/schemas/NavigationConfig | DI-1081
    outputs:
    - element: Preview
      rule: A live web header and phone tab-bar preview with the venue's theme, switchable to Arabic (mirrored). The default
        set before the venue saves is Home, Explore, Plan, Tickets plus the Buy tickets button.
      source: DI-988 | DI-975 | contracts/satellite/white-label.yaml#/components/schemas/NavigationConfig
    - element: Module-gated entries
      rule: An entry linking to a module that is not enabled (Dining needs Dining & F&B, Shop needs Shop, Plan needs the
        visit planner, Map needs Map) is listed greyed with "Turn on Dining & F&B first" and a link to module settings.
      source: contracts/satellite/white-label.yaml#setNavigation | contracts/satellite/white-label.yaml#/components/schemas/ModuleKey
        | DI-193
    actions:
    - action: Save navigation
      result: Saved for the next publish. Refused with the reason named when a tab targets a disabled module or more than
        5 are visible; fix-ups are highlighted on the item.
      source: contracts/satellite/white-label.yaml#setNavigation
    edgeCases:
    - case: Someone tries to switch off Dining while a tab still links to it
      expected: Module settings refuse it and list the entries that still point at Dining (shown here as "Used by Dining
        tab").
      source: contracts/satellite/white-label.yaml#/components/schemas/ModuleEnablement
    - case: Header link to a non-booking page
      expected: It goes to the venue's own website as an outside link.
      source: DI-397
    consistency:
    - with: CMS-016
      note: Module enablement; the greyed entries link there.
    - with: GST-001
      note: The tab bar it renders.
    - with: WEB-001
      note: The header it renders.
    sampleData:
      mobileTabs:
      - Home
      - Explore
      - Buy tickets (raised)
      - Plan
      - Tickets
      webHeader:
      - Tickets
      - Dining
      - Shop
      - Plan your visit
      - 'About us (outside link: aquapark.example/about)'
      arabicLabels:
        Dining: المطاعم
        Shop: المتجر
        Tickets: التذاكر
    corrections:
    - what: 'The screen is wired to F&B menus: listMenus, getMenu, createMenu, setMenuSections and updateMenu, with an "Outlet
        id" text box, an "Active at" date picker, an "Every menu" table, a menuId entry parameter and states naming PRODUCT_VIEW.'
      why: '"Navigation & Menus" means site navigation menus. The F&B menu operations were attached by name resemblance
        and belong to the menu screens (BO-045, BO-109). Keep only getNavigation and setNavigation.'
      source: screens/P13-white-label-cms.yaml#CMS-009 | R254
      status: fixed
      by: CHG-WIR-008
    - what: The screen requires the fnb module.
      why: Every tenant needs navigation, so it should require only core (white label). Only Dining entries depend on F&B.
      source: screens/P13-white-label-cms.yaml#CMS-009 | DI-285
      status: fixed
      by: CHG-WIR-008
    decisions:
    - question: Is one navigation configuration held per surface (web header, web footer, mobile tabs), as DI-285 needs? The
        contract has one NavigationConfig with a kind.
      decision: Three navigation editors (header, footer, tab bar), each saved on its own. The DNS/custom-domain and landing-page-template
        parts of this answer are separate decisions (see related).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-049 | CHG-NOTE-004 | CHG-SGU-006
      questionSource: DI-285 | contracts/satellite/white-label.yaml#getNavigation
  KIT-001:
    summary: 'The kitchen supervisor''s or head chef''s overview of the whole kitchen during service: how deep each station''s
      rail is, the oldest ticket and how late it is against its target, held courses, refires and 86''d items, and a way
      into each working screen. It is not another rail. The one thing to get right: two glanceable numbers per station (tickets
      waiting, oldest age) and the exceptions that need a decision now, readable from two metres.

      '
    outputs:
    - element: Per-station strip
      rule: 'Each station (Grill, Fryer, Cold, Bar, Pastry) with tickets waiting and the age of the oldest, coloured against
        the outlet''s target for that order type (amber at the warning percentage, red past target). No load percentage
        or capacity gauge in the first release.

        '
      source: DI-332 | R277 | contracts/satellite/fnb.yaml#/components/schemas/KitchenSla
    - element: Orders by stage
      rule: Counts of orders Received, Preparing, Ready (waiting for pickup or a runner) for the outlet; Ready orders waiting
        longest listed first.
      source: DI-332 | contracts/satellite/fnb.yaml#listFnbOrders
    - element: Needs attention
      rule: Late tickets, held courses older than a few minutes, chased stations, items 86'd today with when they come back.
      source: contracts/satellite/fnb.yaml#holdCourse | contracts/satellite/fnb.yaml#chaseStation | contracts/satellite/fnb.yaml#list86Events
    actions:
    - action: Open a station's rail, the pass, collection, exceptions or rules
      result: Each tile opens its screen (KIT-002 for a station, KIT-006 the pass, KIT-007 collection, KIT-008 exceptions,
        KIT-009 rules).
      source: screens/P15-kitchen-display.yaml#KIT-001
    edgeCases:
    - case: Offline
      expected: Amber banner, numbers from cache with their age; every bump made on station screens is journaled and syncs.
      source: screens/P15-kitchen-display.yaml#KIT-001
    - case: No tickets
      expected: '"The kitchen is clear" stated plainly, not a blank screen.'
      source: screens/P15-kitchen-display.yaml#KIT-001
    consistency:
    - with: KIT-002
      note: Same ticket card and colours; this screen shows counts, the station screen the cards.
    - with: BO-046
      note: The back office's kitchen view reads the same numbers after the fact.
    sampleData:
      outlet: Oasis Bistro kitchen · dinner service
      stations:
      - Grill · 7 waiting · oldest 14 min (target 12) — red
      - Fryer · 3 · 6 min
      - Cold · 2 · 4 min
      - Bar · 5 · 3 min
      - Pastry · 1 · 2 min
      stages: Received 2 · Preparing 14 · Ready 3 (oldest ready 5 min)
      attention:
      - T4 mains held 7 min — table not ready
      - Grill chased twice
      - Kunafa unavailable until 18:00
    corrections:
    - what: 'The screen repeats the station rail (ticket cards, Bump, a course number field and a free-text "Status" filter)
        with states copied from the rail ("This display is not assigned to a station").

        '
      why: A command centre spans every station; the rail is KIT-002. Copying its states makes the supervisor screen look
        broken when unassigned.
      source: screens/P15-kitchen-display.yaml#KIT-001 | DI-332
      status: fixed
      by: CHG-SPO-017
    - what: 'The loading state says "oldest ticket first" while the cards say "ordered by promise time"; the contract says
        the rail order is the server''s, by priority weights.

        '
      why: Three orders for one rail. The design must keep the server's order and never re-sort.
      source: screens/P15-kitchen-display.yaml#KIT-001 | contracts/satellite/fnb.yaml#listKitchenTickets
      status: fixed
      by: CHG-SPO-017
    - what: The meeting input "Softlabs need not build a full KDS, only an integration point" (31 July) is still in force
        in the design-input index.
      why: The fnb contract records it as superseded on 19 September (the kitchen display is TICVAI's own); mark DI-077
        superseded so bundles stop carrying it.
      source: DI-077 | contracts/satellite/fnb.yaml#listKitchenTickets
      status: fixed
      by: CHG-CLN-012
  KIT-002:
    summary: 'The station display on the kitchen wall: the tickets this station must make, in the order the kitchen should
      make them, bumped with one touch or a bump bar by someone wearing gloves. The one thing to get right: each ticket
      card reads in a glance from two metres — order number or table, order type, items with options and allergy notes in
      red, and a fired timer counting up — and nothing is more than one action deep.

      '
    inputs:
    - field: Course filter
      rule: Chips with the outlet's course names (Starters · Mains · Desserts), not a number field; only that course's lines
        show.
      source: R277 | contracts/satellite/fnb.yaml#listKitchenTickets | contracts/satellite/fnb.yaml#setCourseRules
    - field: Station
      rule: Never picked on the display; the display shows the station it is assigned to in station setup.
      source: R277 | contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
    outputs:
    - element: Ticket card
      rule: 'Header: "order number (counter) or table and covers (dine-in), order type badge, server. Lines: quantity,"
        item, options indented, the note to the kitchen, allergen flags highlighted. A refire line is marked "REFIRE · overcooked".
        Priority tickets marked. Lines of a held course greyed with "Held".

        '
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket | contracts/satellite/fnb.yaml#refireItem
    - element: Fired timer
      rule: 'Counts up from when the ticket (or course) was sent — never a countdown; resets when a course is completed;
        not shown for quick-service outlets. Turns amber at the warning percentage and red past the target for that order
        type.

        '
      source: DI-334 | contracts/satellite/fnb.yaml#/components/schemas/KitchenSla
    - element: Rail order
      rule: Exactly as the server returns it (priority, then the outlet's weights for age, promise time, table stage, VIP);
        the display does not re-sort.
      source: contracts/satellite/fnb.yaml#listKitchenTickets
    - element: Header
      rule: Station name, tickets waiting and oldest age — two numbers.
      source: screens/P15-kitchen-display.yaml#KIT-002
    actions:
    - action: Start (tap a received ticket)
      result: Received → Preparing.
      source: contracts/satellite/fnb.yaml#setKitchenTicketStatus
    - action: Bump (ready)
      result: Preparing → Ready for the whole ticket or the tapped lines; the ticket leaves the rail and the counter or
        server sees it ready.
      source: contracts/satellite/fnb.yaml#setKitchenTicketStatus | F108 step 5
    - action: Recall
      result: Brings back a ticket bumped by mistake within the recall window (proposed 10 minutes); after it, the display
        offers a refire instead.
      source: contracts/satellite/fnb.yaml#recallKitchenTicket | R094
    - action: Refire line
      result: Remakes a line with a reason (overcooked, undercooked, wrong item, dropped, cold, allergy risk, guest changed
        mind, late add); not chargeable by default.
      source: contracts/satellite/fnb.yaml#refireItem | F29 step 6
    - action: Call server
      result: Notifies the table's assigned server (or the outlet supervisor if none) that food is ready, the guest is waiting,
        or there is an allergy query.
      source: contracts/satellite/fnb.yaml#notifyServer | R125 | F29 step 4
    edgeCases:
    - case: Offline
      expected: The rail stays live from cache with an amber banner; every bump is journaled and syncs; new orders from
        tills on the venue network still arrive.
      source: screens/P15-kitchen-display.yaml#KIT-002 | contracts/satellite/fnb.yaml#createFnbOrder
    - case: The primary display of a station is down
      expected: Tickets route to the station's fallback display; the fallback shows which station it is covering.
      source: DI-323 | contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
    - case: A move the ticket's state does not allow (e.g. bump a received ticket straight to served)
      expected: Refused with the ticket's current state; only Received→Preparing, Preparing→Ready, Ready→Recalled, Recalled→Preparing
        happen here.
      source: contracts/satellite/fnb.yaml#setKitchenTicketStatus
    - case: Recall after the window
      expected: '"Too late to recall — refire instead?" with the refire reasons.'
      source: contracts/satellite/fnb.yaml#recallKitchenTicket
    consistency:
    - with: POS-021
      note: The notes and allergen flags typed at the till appear here word for word.
    - with: KIT-003
      note: Held and fired courses look the same here and on the pass.
    - with: POS-022
      note: Ready on this display is Ready on the counter rail.
    sampleData:
      station: Grill · 7 waiting · oldest 14 min
      tickets:
      - header: T4 · 6 covers · Dine-in · Priya
        course: Mains
        fired: '11:42'
        lines:
        - 2 × Ribeye 300 g — medium rare, peppercorn
        - '1 × Ribeye 300 g — well done · ALLERGY: no butter (milk)'
      - header: BNG-004127 · Quick service
        lines:
        - 1 × Marina Smash Burger — medium, cheese · NO SESAME — allergy
      - header: T9 · 2 covers
        lines:
        - 1 × Lamb chops — REFIRE · undercooked
    corrections:
    - what: 'The layout has a number field "Course", a free-text "Status" filter, a table "Every kitchen ticket", and a
        "Save kitchen ticket status" modal asking for status, line ids and a recorded time.

        '
      why: Status changes are gestures on the card; the course filter is chips; times are device times.
      source: screens/P15-kitchen-display.yaml#KIT-002 | R254
      status: fixed
      by: CHG-SPO-017
    - what: Fire course and Hold course are on the station display.
      why: The pass fires and holds courses (DI-407); a station cook working one section should not release a table's next
        course.
      source: DI-407 | contracts/satellite/fnb.yaml#fireCourse
      status: fixed
      by: CHG-CLN-006
    - what: The cards say "ordered by promise time not arrival", the loading state "oldest ticket first".
      why: The rail order is the server's (priority weights); re-sorting on the device would disagree with every other display.
      source: contracts/satellite/fnb.yaml#listKitchenTickets
      status: fixed
      by: CHG-SPO-017
  KIT-003:
    summary: 'The pass (head chef or expeditor) for table service: courses of each table — starters before mains — and when
      the next course goes. The pass fires a held course when the table is ready, holds one when the table has gone quiet,
      and moves an urgent ticket up. The one thing to get right: per table, which course is out, which is held and for how
      long, and a single Fire button for the next course.

      '
    inputs:
    - field: Hold reason
      rule: Table not ready · Guest request · Kitchen backed up · Waiting for previous course · Other (needs a note).
      source: contracts/satellite/fnb.yaml#holdCourse | R222
    - field: Fire at (timed coursing)
      rule: Only for outlets using timed coursing; empty means now.
      source: contracts/satellite/fnb.yaml#fireCourse
    - field: Prioritise
      rule: A reason is required (3+ characters); no position given means top of the rail; recorded against the person.
      source: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | R125
    outputs:
    - element: Tables by course
      rule: 'One row per table: covers, server, each course as a chip — Sent · Preparing · Ready · Served · Held (with how
        long). A held course keeps its place and shows its waiting time.

        '
      source: contracts/satellite/fnb.yaml#holdCourse | DI-333
    - element: Coursing policy
      rule: The outlet's default (Hold & fire, Timed, Phased, Fire all at once) shown as a label, per order type.
      source: contracts/satellite/fnb.yaml#setCourseRules
    actions:
    - action: Fire next course
      result: Sends the held course to the stations; works offline and replays in order.
      source: contracts/satellite/fnb.yaml#fireCourse
    - action: Hold course
      result: Stops a course going out, with a reason; it keeps its place on the rail.
      source: contracts/satellite/fnb.yaml#holdCourse
    - action: Move up
      result: Puts the ticket at the top of the rail (or a chosen place) with a reason; online only.
      source: contracts/satellite/fnb.yaml#prioritiseKitchenTicket
    edgeCases:
    - case: Offline
      expected: Fire and hold work and replay in order; Move up needs the connection and is disabled with the reason.
      source: contracts/satellite/fnb.yaml#fireCourse | contracts/satellite/fnb.yaml#prioritiseKitchenTicket
    - case: Quick-service outlet
      expected: No courses and no fired timer; the screen is not offered.
      source: DI-334
    consistency:
    - with: EMP-058
      note: A server's "ready for mains" on the staff app reaches this screen; the server does not fire courses (DI-407).
    - with: KIT-002
      note: Held lines appear greyed with "Held" on the station rails.
    sampleData:
      tables:
      - table: T2
        covers: 4
        server: Priya Nair
        courses: Starters served 19:52 · Mains held 6 min (table not ready) · Desserts —
      - table: T4
        covers: 6
        courses: Starters served · Mains preparing (fired 20:03)
      policy: Hold & fire for dine-in · Fire all at once for room service
    corrections:
    - what: '"Save course rules" (setCourseRules, outlet configuration) sits on the live pass, and the layout exposes the
        status request fields "Status", "Recorded at", "Line ids" and "Station id".

        '
      why: Course rules are set up before service (BO-136/BO-134); request fields are not inputs.
      source: screens/P15-kitchen-display.yaml#KIT-003 | R254
      status: fixed
      by: CHG-WIR-008
    - what: Course rules and kitchen targets have setters (setCourseRules, setKitchenSla) but no read operation.
      why: An editor cannot load the current values; the pass cannot show the outlet's course names.
      source: contracts/satellite/fnb.yaml#setCourseRules | contracts/satellite/fnb.yaml#setKitchenSla
      status: fixed
      by: CHG-WIR-008
  KIT-004:
    summary: 'One order''s journey across stations for the pass or a supervisor: which of its kitchen tickets are ready,
