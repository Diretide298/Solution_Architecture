      questionSource: R110 | screens/P08-venue-back-office.yaml#BO-136
  BO-137:
    summary: 'What the recipes say should have been used against what the count found, per outlet and count period (FNB-5C,
      F30 step 8): theoretical, actual, variance %, its value, and the lines beyond the venue''s tolerance. The client asked
      for recipe-based ingredient consumption in the F&B stock view. The one thing to get right is that the variance is
      only shown once the count is submitted, never while counting.'
    inputs:
    - field: Outlet and count
      rule: Outlet picker, then a submitted count (by date, "Count 24 Oct 2026, Oasis Bistro kitchen"); not an id.
      source: contracts/satellite/inventory.yaml#getCountVariance | F30 step 8
    - field: Filter
      rule: All items / Over tolerance; sort by value (default) or by variance %.
      source: screens/P08-venue-back-office.yaml#BO-137
    outputs:
    - element: Variance table
      rule: Per ingredient - expected, counted, variance % (signed, one decimal), value in AED; lines beyond the tolerance
        (proposed 2%, venue setting) highlighted and counted in the header.
      source: contracts/satellite/inventory.yaml#getCountVariance | R094
    - element: Production yield
      rule: Runs in the period with planned, made and yield %, since a low batch yield explains part of the gap.
      source: contracts/satellite/fnb.yaml#listProductionRuns | F85 step 2
    actions:
    - action: Open the item
      result: Goes to the ingredient's product detail to fix a unit, a recipe line or a cost.
      source: screens/P08-venue-back-office.yaml#BO-137
    edgeCases:
    - case: The count is still open or being counted
      expected: '"Variance appears when the count is submitted" - never partial figures (409 from the read).'
      source: R110 | contracts/satellite/inventory.yaml#getCountVariance
    - case: A cancelled production run in the period
      expected: Its ingredients count as used; the run shows as cancelled with its consumption.
      source: contracts/satellite/fnb.yaml#planProductionRun
    consistency:
    - with: BO-079
      note: The count is entered on Stock Count; this screen only reads its variance.
    - with: BO-110
      note: Same units as the recipe lines.
    - with: BO-049
      note: DI-340 scopes both; the F&B stock command centre links here.
    sampleData:
      outlet: Oasis Bistro kitchen
      count: Submitted 25 Oct 2026, 07:40 GST by Daniel Brooks
      lines:
      - item: Beef Patty 150g
        expected: 1,842 pc
        counted: 1,914 pc
        variance: +3.9%
        value: AED 461.00
      - item: Fresh Sea Bass
        expected: 42.6 kg
        counted: 48.2 kg
        variance: +13.1%
        value: AED 728.00
      - item: Tomato
        expected: 73.6 kg
        counted: 74.4 kg
        variance: +1.1%
        value: AED 7.00
    corrections:
    - what: The board frame fnb-2f ("Recipe & BOM Costing") is attached here.
      why: It is BO-110's frame; this screen's frame is fnb-5c.
      source: screens/P08-venue-back-office.yaml#BO-137
    - what: The main population is "Every recipe" (listRecipes) with a "Menu item id" field and raw recipe columns, plus
        a raw production-run table with ids.
      why: The population is the count's variance lines; recipes are context, not the list.
