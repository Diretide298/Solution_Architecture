      questionSource: contracts/satellite/fnb.yaml#/components/schemas/Nutrition
  BO-112:
    summary: 'Tomorrow''s prep list: a plan built from the demand forecast through the recipes into quantities per item
      and per station, edited by the chef, then released into production runs grouped by station - one printable prep sheet
      per station (FNB-2M). The client asked that production planning aggregate recipe requirements to forecast prepared
      quantities. The one thing to get right is that a plan is a draft until released, and the suggested quantity stays
      visible beside the planned one.'
    inputs:
    - field: Kitchen and day
      rule: Outlet (kitchen) picker and the trading day (default tomorrow), a date in the Region's time zone.
      source: contracts/satellite/fnb.yaml#/components/schemas/ProductionPlan
    - field: Plan line
      rule: Item, suggested quantity (read-only, from the forecast), planned quantity (editable), unit, station. Editing
        planned does not overwrite suggested.
      source: contracts/satellite/fnb.yaml#buildProductionPlan
    - field: Direct run (outside a plan)
      rule: Recipe by name, planned quantity with its unit, where it is made, which outlets it is for, when. No id, status,
        actual quantity or variance fields at planning time.
      source: contracts/satellite/fnb.yaml#planProductionRun
    outputs:
    - element: Plan grid
      rule: Grouped by station (Grill, Cold, Pastry) with forecast covers in the header, on-hand beside to-make, and start
        times; total prep hours when known.
      source: screens/P08-venue-back-office.yaml#BO-112 | R125
    - element: Forecast badge
      rule: The suggestion's maturity stage and basis in plain words ("Baseline from last 4 weeks - starting") and its explanation;
        never a confidence number for a rule-based answer.
      source: contracts/satellite/ai.yaml#requestSuggestion
    - element: Prep sheet
      rule: One printable sheet per station for the day, listing items, quantities and start times (what releasing produces).
        Printed from a print template, to the kitchen printer or the browser.
      source: R125 | screens/P08-venue-back-office.yaml#BO-112 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Build plan
      result: Creates a draft plan from the forecast for the chosen day and kitchen; nothing is produced or issued.
      source: contracts/satellite/fnb.yaml#buildProductionPlan
    - action: Release plan
      result: Confirmation states "11 runs on 3 stations for Mon 2 Nov"; on success the plan reads Released and shows its
        runs. Ingredients leave stock only when each run starts.
      source: contracts/satellite/fnb.yaml#releaseProductionPlan | R125
    - action: Plan a run
      result: Creates a single planned run outside a plan (a central kitchen batch for several outlets).
      source: contracts/satellite/fnb.yaml#planProductionRun
    edgeCases:
    - case: A setting the forecast needs is missing
      expected: The forecast is refused and the message names the setting and the screen that sets it; the plan can still
        be built by hand.
      source: contracts/satellite/ai.yaml#requestSuggestion
    - case: Little or no sales history
      expected: The forecast still answers from the baseline with stage "starting"; do not show an error.
      source: contracts/satellite/ai.yaml#requestSuggestion
    - case: Yesterday's draft never released
      expected: It does not appear in today's prep list; it reads Draft for its own day and can be superseded or cancelled.
      source: contracts/satellite/fnb.yaml#releaseProductionPlan
    consistency:
    - with: BO-113
      note: Commissary runs are the same runs viewed across outlets; same run card.
    - with: BO-138
      note: Released runs appear on the batch screen for execution; same item names and units.
    - with: BO-136
      note: Plan building and release currently sit on BO-136; see corrections.
    sampleData:
      kitchen: Oasis Bistro kitchen
      day: Mon 2 Nov 2026 - forecast 418 covers (baseline, starting)
      lines:
      - item: Burger Sauce (SUB-0071)
        station: Cold
        suggested: 6.0 kg
        planned: 6.0 kg
        start: 06:30
      - item: Marinated Chicken (SUB-0102)
        station: Grill
        suggested: 10.0 kg
        planned: 12.0 kg
        start: 07:30
      - item: Luqaimat dough
        station: Pastry
        suggested: 8.0 kg
        planned: 8.0 kg
        start: 09:00
    corrections:
    - what: Board frame mapped to Retail Board 2 ret-2e ("Catalog Builder & Store Assortment"); the client's frame for this
        screen is FnB Board 2 fnb-2m ("Production Planning & Sheets"), which is mapped to BO-136.
      why: The title match went to the wrong board; the designer would draw a retail assortment grid.
      source: screens/P08-venue-back-office.yaml#BO-112
      status: fixed
      by: CHG-SBO-008
    - what: buildProductionPlan and releaseProductionPlan are declared on BO-136, not here; F85 step 1 lands planning on
        BO-136.
      why: Planning is this screen's job (DI-329 scopes BO-112); move both operations here.
      source: DI-329 | F85 step 1 | screens/P08-venue-back-office.yaml#BO-136
      status: fixed
      by: CHG-WIR-008
    - what: No read of plans exists (no list or get of production plans).
      why: A draft plan cannot be reopened, edited or released after the page is left.
      source: contracts/satellite/fnb.yaml#/components/schemas/ProductionPlan
      status: logged
      by: CHG-SBO-005
    - what: The form exposes id, recipeId, producingOutletId, forOutletIds, status, actualQuantity and varianceReason as
        text fields.
      why: Ids and status are server or client plumbing; actual quantity and variance belong to completing a run (BO-138).
      source: screens/P08-venue-back-office.yaml#BO-112 | R254
      status: fixed
      by: CHG-SBO-008
    - what: The transition to BO-009 (Pricing Rules) cites flow F78 step 3 to 4, but F78 has no BO-112 step.
      why: The navigation edge is invented; remove it.
      source: F78 step 3 | screens/P08-venue-back-office.yaml#BO-112
      status: fixed
      by: CHG-WIR-009
    - what: Production is split over BO-112, BO-113, BO-136, BO-137 and BO-138 with the same operations repeated (planProductionRun
        on three, completeProductionRun on two).
      why: Consolidate into one Production screen with tabs Plan | Commissary | Batches, consumption staying with stock
        (DI-987, DI-671).
      source: DI-987 | DI-671
      status: fixed
      by: CHG-SBO-021
    decisions:
    - question: Is the printed prep sheet a browser print of the station view, or does it need a print operation and template?
      decision: Prep sheets print from a print template, to kitchen printers and the browser.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-185 | CHG-NOTE-004
      questionSource: screens/P08-venue-back-office.yaml#BO-112
  BO-113:
    summary: 'One central kitchen producing for many outlets: outlet demand rolled up per item, batches sized and costed
      once, and each outlet''s share sent as a transfer (FNB-2N). A run is a stock movement in both directions - ingredients
      out when it starts, the made item in when it completes. The one thing to get right is the allocation of each batch
      to the outlets it is for, and the planned-against-made gap.'
    inputs:
    - field: Commissary and day
      rule: The producing kitchen (Central Commissary) and the day; runs listed are those made at a commissary.
      source: contracts/satellite/fnb.yaml#listProductionRuns
    - field: Batch
      rule: Recipe by name, planned quantity with unit, the outlets it is for (multi-select by name), scheduled start.
      source: contracts/satellite/fnb.yaml#planProductionRun
    - field: Complete batch
      rule: Made quantity in the item's unit; a variance reason is asked for when made differs from planned (optional in
        the contract). The time is the device's own and is not asked for.
      source: contracts/satellite/fnb.yaml#completeProductionRun | designer default
    outputs:
    - element: Consolidated demand
      rule: Per item - outlets asking, total demand, batch size, number of batches, unit cost (FNB-2N).
      source: screens/P08-venue-back-office.yaml#BO-113
    - element: Yield
      rule: Made over planned, as a percentage with one decimal, derived on read and never stored.
      source: contracts/satellite/fnb.yaml#getProductionRun
    actions:
    - action: Complete batch
      result: Moves the made quantity into stock; refused (409) if the batch is not running, with its current state named.
        Works offline and replays in order.
      source: contracts/satellite/fnb.yaml#completeProductionRun
    edgeCases:
    - case: A batch abandoned halfway
      expected: Its ingredients are already gone; it reads Cancelled with the variance kept, not as if it never happened.
      source: contracts/satellite/fnb.yaml#planProductionRun
    - case: An outlet's requisition arrives after the batch is planned
      expected: Show it as unmet demand for the day rather than silently enlarging a running batch.
      source: designer default
    consistency:
    - with: BO-112
      note: Same run card and units.
    - with: BO-138
      note: Batch execution and yield are the same view filtered to the commissary.
    - with: BO-078
      note: Outlet requisitions feed commissary demand (DI-341).
    sampleData:
      commissary: Central Commissary - Mon 2 Nov 2026 - 14 outlets
      demand:
      - item: Burger Sauce (SUB-0071)
        outlets: 9
        demand: 42.0 kg
        batch: 12.0 kg
        batches: 4
        unitCost: AED 26.10
      - item: Beef Patty 150g (ITM-1042)
        outlets: 6
        demand: 840 pc
        batch: 400 pc
        batches: 2
        unitCost: AED 6.10
      allocation:
        item: Burger Sauce 12.0 kg
        to:
        - Bite & Go 4.0 kg
        - Oasis Bistro 6.0 kg
        - Beach Hut kiosk 2.0 kg
    corrections:
    - what: Board frame mapped to Retail Board 2 ret-2d ("Category, Brand & Merchandise Hierarchy"); the client's frame
        is FnB Board 2 fnb-2n ("Central Kitchen & Commissary"), currently listed on BO-136.
      why: Wrong board; the designer would draw a merchandise tree.
      source: screens/P08-venue-back-office.yaml#BO-113
    - what: No read declared (listProductionRuns with location kind commissary), pattern configEditor, and a form of raw
        ProductionRun fields (id, status, actualQuantity, varianceReason).
      why: This is a list of batches with their allocation, not a settings form.
      source: contracts/satellite/fnb.yaml#listProductionRuns | R254
      status: fixed
      by: CHG-WIR-008
    - what: Each outlet's share "becomes a transfer" (FNB-2N), but no transfer operation (createStockTransfer) is wired.
      why: Without it the commissary's output never reaches the outlets in stock.
      source: screens/P08-venue-back-office.yaml#BO-113 | contracts/satellite/inventory.yaml#createStockTransfer
      status: fixed
      by: CHG-WIR-008
    - what: There is no operation to start or cancel a run - the state model gives planned to inProgress to planProductionRun
        and inProgress to cancelled to completeProductionRun.
      why: The screen cannot draw "Start batch" (the moment ingredients leave stock, R125 (8)) or "Cancel batch" with an
        honest call.
      source: R125
    decisions:
    - question: Is the commissary a kind of outlet (DI-330 outlet-level model) or a kitchen shared by outlets as FNB-1H draws
        ("Main Kitchen linked to 3 outlets")?
      decision: 'Drawn default stands (answer: "The commissary is an outlet that produces for others"): Treat the commissary
        as an outlet that produces for others (producing outlet plus for-outlets).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-186 | CHG-NOTE-004
      questionSource: DI-330 | screens/P08-venue-back-office.yaml#BO-113
  BO-114:
    summary: 'By its title this screen manages variants, attributes, barcodes and RFID for retail products. By its operations
      it is only a serialised-stock list with a barcode price check. The designer should draw the serialised-stock and barcode
      lookup it can actually do, and treat variants and attributes as living on Product Detail & Variants (BO-008). The
      one thing to get right is to trace an individual item by serial: where it is, its status and, if sold, on which sale.

      '
    inputs:
    - field: Serial search
      rule: 'Exact match, with scan support, first and prominent. A serial is unique within an item, not globally, so one
        serial can return several items. Show them all, with the item name.

        '
      source: contracts/satellite/inventory.yaml#listSerialisedItems
    - field: Status filter
      rule: 'Chips: In stock, Reserved, Sold, Returned, Damaged, Lost, In transit, Under warranty.'
      source: contracts/satellite/inventory.yaml#/components/schemas/SerialisedItem
    - field: Barcode price check
      rule: 'Scan or type a barcode or SKU. The result shows the price after any live promotion, stock at this outlet and
        stock at sibling outlets.

        '
      source: R215 | contracts/satellite/retail.yaml#lookupMerchandise
    outputs:
    - element: Serial record
      rule: Item, serial, batch, location, status, received date, warranty until, and the sale it was sold on (as a sale
        number, linked).
      source: DI-406 | contracts/satellite/inventory.yaml#/components/schemas/SerialisedItem
    consistency:
    - with: EMP-069
      note: The same serial lookup and statuses on the handheld.
    - with: BO-008
      note: Size/colour attributes and the barcode per variant are set there.
    sampleData:
    - item: Smartwatch kids GPS, pink
      serial: SW8K-2026-004417
      status: Sold
      location: Marina Bay Retail Floor
      soldOn: Sale MBR-20931
      warrantyUntil: '2027-10-12'
    - item: Action camera 4K
      serial: AC4K-88213
      status: In stock
      location: Main Store
    corrections:
    - what: 'The title promises variants, attributes, barcode and RFID management. The operations are only the serialised-item
        list and the barcode price check.

        '
      why: 'Variant attributes (configurable per product type) and a distinct barcode per variant are agreed, but their
        operations (setProductAttributes, listProductVariants, updateProductVariant) are on BO-008. RFID has no operation
        (open item). Either bind the variant operations here or retitle this screen "Serialised Stock & Barcode Lookup"
        and merge it with EMP-069''s back-office twin.

        '
      source: DI-354 | DI-365 | DI-474 | DI-987 | contracts/spine/catalogue.yaml#setProductAttributes
    - what: 'Attributes are set per product (setProductAttributes). The decision says attributes are configured per product
        type and appear dynamically when a product is added.

        '
      why: No per-product-type attribute template exists to drive "appear dynamically".
      source: DI-354 | contracts/spine/catalogue.yaml#setProductAttributes
    - what: The serial and status filters are text fields. The table is "Every serialised" with raw id columns.
      why: Plumbing. Use scan/search and status chips.
      source: screens/P08-venue-back-office.yaml#BO-114
    decisions:
    - question: Should BO-114 carry variant and attribute management, or is BO-008 the only place?
      decision: 'Drawn default accepted: Draw serialised lookup and price check here, and link to BO-008 for variants.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-296 | CHG-NOTE-004
      reviewable: true
      questionSource: DI-354 | DI-987
  BO-134:
    summary: 'One outlet''s kitchen set-up: its preparation stations (grill, fryer, cold, beverage, dessert), which kitchen
      displays show each station''s rail (a primary and fallbacks in order), which items each station makes, and the outlet''s
      kitchen targets per order type with the weights that order the rail (FNB-1H). The one thing to get right is the device-to-station
      assignment - it is how a kitchen display knows its station; there is no picker on the display.'
    inputs:
    - field: Outlet
      rule: Outlet picker by name (from the outlet list); stations are always one outlet's set. A kitchen that serves several
        outlets is set up once, as a producing outlet that produces for the others.
      source: contracts/satellite/fnb.yaml#setKitchenStations | DI-330 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - field: Station
      rule: Name (Grill Station), short code (GRL), active toggle.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
    - field: Kitchen displays
      rule: 'An ordered list of the outlet''s kitchen display devices by their names: first is primary, the rest are fallbacks
        in order. A display already assigned to another station shows greyed with that station''s name (assigning it twice
        is refused).'
      source: R277 | DI-323 | contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
    - field: Items made here
      rule: Pick by section and item name from the outlet's menu; bulk "whole section" selection.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenStation | MATRIX 4.6.33
    - field: Kitchen targets
      rule: Per order type (Dine-in, Quick service, Room service, Collection, Delivery) a target in minutes (at least 1)
        and the warn point as a percent of it (default 80).
      source: contracts/satellite/fnb.yaml#setKitchenSla | contracts/satellite/fnb.yaml#/components/schemas/KitchenSla
    - field: What pushes a ticket up the rail
      rule: Four weights (Age, Promise time, Table stage, VIP), whole numbers from 0, shown as sliders with their effect
        explained.
      source: contracts/satellite/fnb.yaml#setKitchenSla
    - field: Kitchen printers
      rule: 'In release 1: each station has its kitchen printers beside its displays (the printer models are still to be named
        on the hardware list).'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Station rows
      rule: Name, primary display and fallbacks, number of items routed, active. No live load percentage, open orders or
        average prep time.
      source: R277 | screens/P08-venue-back-office.yaml#BO-134
    actions:
    - action: Save stations
      result: Saves the outlet's whole station set; displays switch to their assigned station's rail. A 412 says someone
        else changed the stations and offers reload.
      source: contracts/satellite/fnb.yaml#setKitchenStations
    - action: Save kitchen targets
      result: The new targets colour the rail and the new weights order it from the next refresh.
      source: contracts/satellite/fnb.yaml#setKitchenSla
    edgeCases:
    - case: The primary display is offline
      expected: The next display in the list shows the station's rail; the station row shows which display is serving.
      source: DI-323 | contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
    - case: A station is deactivated while items are routed to it
      expected: Warn with the number of items that will have no station and require reassigning before save.
      source: designer default
    - case: A temporary move of work for tonight
      expected: Not done here; "Move work for this service" links to the station workload screen (it reverts at close).
      source: contracts/satellite/fnb.yaml#rebalanceStationLoad | screens/P15-kitchen-display.yaml#KIT-005
    consistency:
    - with: BO-135
      note: Routing rules and these stations are one configuration; see the overlap correction.
    - with: KIT-009
      note: KIT-009 also sets the kitchen targets (setKitchenSla); one owner, the other read-only.
    - with: KIT-002
      note: The display shows the station named here, with no station picker.
    sampleData:
      outlet: Oasis Bistro
      stations:
      - name: Grill Station
        code: GRL
        displays:
        - Grill KDS 1 (primary)
        - Pass KDS (fallback)
        items: 18
      - name: Fryer Station
        code: FRY
        displays:
        - Fryer KDS
        items: 9
      - name: Cold Kitchen
        code: CLD
        displays:
        - Cold KDS
        items: 14
      - name: Beverage
        code: BEV
        displays:
        - Bar KDS
        items: 28
      targets:
      - type: Dine-in
        minutes: 18
        warnAt: 80%
      - type: Quick service
        minutes: 8
        warnAt: 75%
      - type: Delivery
        minutes: 15
        warnAt: 80%
      weights:
        age: 5
        promiseTime: 3
        tableStage: 2
        vip: 4
    corrections:
    - what: A kitchen station has no printer and no category routing; displayEndpoint duplicates the newer displayWorkstationIds.
      why: DI-323 asks for stations mapped to printers or displays with routing by category or item; two device fields will
        disagree.
      source: DI-323 | contracts/satellite/fnb.yaml#/components/schemas/KitchenStation | TRACKER 30-Sep/Tracker row 28
    - what: Routing is held twice - KitchenStation.menuItemIds and MenuItem.stationId.
      why: An item could be routed to two stations or none depending on which is read; one must be the truth.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenStation | contracts/satellite/fnb.yaml#/components/schemas/MenuItem
        | MATRIX 4.6.22
    - what: Plumbing - "Outlet id" text field, table "Every kitchen station" with id, outletId, menuItemIds and device ids
        as columns.
      why: Users read station names, display names and item counts.
      source: screens/P08-venue-back-office.yaml#BO-134 | R254
    - what: BO-134 and BO-135 both save stations (setKitchenStations), and the client board draws them as two tabs of one
        area ("Kitchens & Stations | Routing Rules").
      why: Merge into one "Kitchen stations & routing" screen (DI-987 asks to merge 3-4 configuration screens into one).
      source: DI-987 | DI-671 | screens/P08-venue-back-office.yaml#BO-134
      status: fixed
      by: CHG-WIR-008
    - what: Kitchen targets are set on both BO-134 and KIT-009.
      why: Two writers of one setting; keep it here (back office) and show it read-only on the display side.
      source: contracts/satellite/fnb.yaml#setKitchenSla | screens/P15-kitchen-display.yaml#KIT-009
    decisions:
    - question: Are kitchen printers in the first release, and which models? The hardware list still says "decide later" for
        kitchen displays and printers.
      decision: Kitchen printers are in release 1.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-187 | CHG-NOTE-004
      questionSource: TRACKER 30-Sep/Tracker row 28 | DI-323
    - question: Can one kitchen serve several outlets (FNB-1H "Main Kitchen linked to 3 outlets") when the model is per outlet?
      decision: One kitchen serves several outlets through a producing outlet (one kitchen outlet produces for several).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-188 | CHG-NOTE-004
      questionSource: DI-330 | screens/P08-venue-back-office.yaml#BO-134
  BO-135:
    summary: 'Where each item''s kitchen ticket goes: the rules that send an item to a station and its display, and what
      happens when that station''s display is down. The client''s frame draws ordered rules (product, then category, then
      outlet, then the kitchen default as fallback; first match wins) with a "test a ticket" check. The contract today routes
      per item to a station and falls back across that station''s displays. The one thing to get right is that no item is
      ever left without a destination.'
    inputs:
    - field: Item routing
      rule: A matrix of the outlet's menu sections and items against stations; assign a whole section at once, override
        single items. Every item must land on exactly one station.
      source: contracts/satellite/fnb.yaml#setKitchenStations | MATRIX 4.6.33 | DI-323
    - field: Fallback
      rule: Per station, the order of displays to fall back to (from BO-134), and a fallback station (FNB-1J "else if station
        offline, route to Backup Grill Station").
      source: DI-323 | screens/P08-venue-back-office.yaml#BO-135 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - field: Test a ticket
      rule: Pick items and see which station and display each would go to now, including any fallback in force.
      source: screens/P08-venue-back-office.yaml#BO-135
    - field: Category rules
      rule: Route by category as well as by item; an item rule wins over its category's rule, and an item no rule covers goes
        to the outlet's default station.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Unrouted items
      rule: A count and list of menu items with no station, shown first, with a "Route them" action.
      source: designer default
    - element: Routing summary
      rule: Items per station; the station's displays with primary and fallback.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
    actions:
    - action: Save routing
      result: Saves the outlet's stations with their items; tickets from the next order follow the new routing.
