      - check: 'Requirements: minimum age 12'
        state: ok
      - check: Deposit
        state: AED 1,500.00 card hold to take
      - check: Equipment
        state: 10 available at Bike hub
    corrections:
    - what: Readiness items are free strings (readiness[].check), and the contract's set (agreement, requirements, deposit,
        equipment) omits payment, which DI-759 lists first.
      why: The designer and the build need a fixed list to draw and test; make check an enum including payment/confirmation.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalBooking | DI-759
  EMP-074:
    summary: 'Step 2: bind the physical units to the booking. One screen for one unit or a group of ten (EMP-074, EMP-075
      and EMP-079 are the same job): one row per unit the booking needs, each filled by scanning the unit''s tag, or by
      picking from the available units where the product allows it. Pooled items (towels, life jackets in a hybrid kit)
      are counted, not scanned.

      '
    inputs:
    - field: Unit rows
      rule: 'Number of rows = booking quantity for serialised products. Scan fills the row with the tag and model; "Pick
        from available" lists only free units for the window (turnaround already subtracted). If the product''s check-out
        scan rule is "required", manual pick is hidden. Substitution with another product is offered only if the product
        allows it.

        '
      source: contracts/satellite/rental.yaml#assignRentalEquipment | contracts/satellite/rental.yaml#/components/schemas/RentalOperationalRules
        | DI-760 | DI-740
    - field: Pooled accessories (hybrid kits)
      rule: '"Paddle x2, Life jacket x2" shown as counted lines with a stepper; no scan.'
      source: contracts/satellite/rental.yaml#setRentalInventoryModel
    outputs:
    - element: Assigned unit
      rule: Tag, name and last inspection date, e.g. "BIKE-014 · Mountain bike M · inspected 16 Oct". A unit picked manually
        carries a small "picked, not scanned" mark, because the record keeps that fact.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalEquipmentAssignment
    actions:
    - action: Continue to condition
      result: Saves all rows in one assignment call. A refused unit (already out, under maintenance, wrong product) turns
        its row red with that reason and keeps the others.
      source: contracts/satellite/rental.yaml#assignRentalEquipment
    consistency:
    - with: EMP-085
      note: The swap's "incoming unit" uses this same scan row.
    - with: BO-547
      note: Shared design.
    sampleData:
      booking: RNT-10487 (10 x Mountain bike M)
      rows:
      - BIKE-014 scanned
      - BIKE-022 scanned
      - BIKE-031 scanned
      - BIKE-040 picked
      - 6 to assign
    corrections:
    - what: The manual pick from available units (DI-760) has no operation behind it on this screen; getRentalAvailability
        (which returns available asset ids for a serialised product) is not bound.
      why: Without it the "select manually" path in DI-760 cannot be drawn.
      source: contracts/satellite/rental.yaml#getRentalAvailability | DI-760
      status: fixed
      by: CHG-WIR-008
  EMP-075:
    summary: 'The scan-and-validate behaviour of the equipment step (merge into EMP-074). Each scan resolves the tag and
      is checked before it is accepted: right product, free, in service, not overdue for maintenance. The point is that
      the wrong, unavailable or unsafe unit cannot be assigned by accident.

      '
    outputs:
    - element: Scan result
      rule: 'Green: tag, name, "In service". Red with the reason in words: "Under maintenance", "Already out on RNT-10466",
        "This is a Junior bike - booking is for Mountain bike M", "Maintenance overdue since 12 Oct". Show the asset''s
        status in the simplified words available / rented / faulty, not the six maintenance statuses.

        '
      source: contracts/satellite/maintenance.yaml#lookupAsset | contracts/satellite/rental.yaml#assignRentalEquipment |
        DI-500
    consistency:
    - with: EMP-074
      note: Same screen after consolidation.
    - with: BO-548
      note: Shared design.
    sampleData:
      scans:
      - tag: BIKE-014
        result: ok
      - tag: BIKE-019
        result: Under maintenance (brake pads)
      - tag: KAY-003
        result: Wrong product
  EMP-076:
    summary: 'Step 3: record the condition of each unit before it goes out - the only defence in a dispute at return. A
      short condition choice per unit, the product''s checklist, an optional note and optional photos.

      '
    inputs:
    - field: Condition
      rule: 'Good · Minor damage · Major damage · Faulty. "Not returned" is a return-only value and must not appear here.
        Faulty or Major damage blocks the unit: offer "Choose another unit" back in the equipment step.

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalInspection | DI-500
    - field: Photos
      rule: Optional by default (the client said photos are optional, not mandatory); required only where the product's
        photo-at-check-out rule says required.
      source: DI-766 | contracts/satellite/rental.yaml#/components/schemas/RentalOperationalRules
    - field: Checklist
      rule: Pass/fail per item with a note on fail (e.g. Brakes, Tyres, Chain, Seat clamp). Items come from the product
        configuration.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalInspection | DI-759
    consistency:
    - with: EMP-094
      note: Same component with phase "after return"; the comparison (EMP-095) relies on identical layout.
    - with: BO-549
      note: Shared design.
    sampleData:
      unit: BIKE-014
      checklist:
      - item: Brakes
        passed: true
      - item: Tyres
        passed: true
      - item: Chain
        passed: true
      - item: Bell
        passed: false
        note: missing
      condition: Minor damage
      note: Scratch on top tube, bell missing
    corrections:
    - what: The action bar has buttons "Asset", "Reservation" and "Checkout inspection" - these are values the operation
        sends (asset id, booking id, phase), not user actions.
      why: Plumbing leaking onto a user screen; the unit and booking are context, the phase is implicit in the step.
      source: screens/P06-staff-app.yaml#EMP-076
    - what: The condition before handover is captured twice - as a pre-rental inspection (recordRentalInspection) and again
        as conditionNote/photos on the check-out call.
      why: The attendant must record it once; decide which record is the evidence and drop the other from the screen.
      source: contracts/satellite/rental.yaml#recordRentalInspection | contracts/satellite/rental.yaml#/components/schemas/RentalCheckOut
  EMP-077:
    summary: 'Step 4: the safety handover - what the guest is given and told, ticked off with the guest present. The list
      depends on the product (kayak: life jacket, paddle, briefing, emergency procedure, restricted areas, swimming ability;
      bike: helmet, brake check, seat adjusted, briefing).

      '
    inputs:
    - field: Checklist items
      rule: Large tick rows; every item required unless configured optional. "Customer confirms swimming ability" is a guest
        confirmation, so it reads as a question to the guest.
      source: screens/P06-staff-app.yaml#EMP-077 | DI-759
    - field: Safety briefing given
      rule: Required where the product's safety-briefing rule is required; the check-out is refused without it.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalOperationalRules | contracts/satellite/rental.yaml#checkOutRental
    consistency:
    - with: BO-550
      note: Shared design.
    sampleData:
      product: Single kayak
      items:
      - Life jacket provided
      - Paddle provided
      - Safety briefing completed
      - Emergency procedure explained
      - Restricted areas explained (swim zone buoys)
      - Customer confirms swimming ability
    corrections:
    - what: The safety checklist items are not stored - the check-out request carries one boolean (safetyBriefingGiven)
        - and no product or category field holds the configurable list the screen's purpose says comes from Board 1.
      why: Ticks that are not recorded are no defence after an incident; the list needs a configuration field and a place
        in the check-out record.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalCheckOut | contracts/satellite/rental.yaml#/components/schemas/RentalOperationalRules
        | screens/P06-staff-app.yaml#EMP-077
    - what: This step submits the check-out (primary button bound to checkOutRental) although deposit and confirmation follow
        it.
      why: See the board 6 consolidation correction on EMP-071; only the final Confirm step submits.
      source: screens/P06-staff-app.yaml#EMP-077
  EMP-078:
    summary: 'Step 5: take the deposit hold and show the attendant the money position without opening Finance: what was
      paid for the rental, the deposit to hold, how, and anything outstanding. The deposit is held, not charged, and is
      never added into the rental price.

      '
    inputs:
    - field: Deposit method
      rule: 'Only the methods the deposit policy allows, as buttons: Card hold (pre-authorisation), Card charge, Cash, Wallet.
        Cash goes into the till drawer like any other cash taken at the station.

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalDepositPolicy | DI-752
    - field: Deposit amount
      rule: 'Pre-filled from the booking''s quote (fixed or percentage per policy, within its minimum and maximum); read-only
        for the attendant. Waiving or reducing it is an override with the original and adjusted amounts and a reason ("Other"
        needs a note).

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalQuote | contracts/satellite/rental.yaml#/components/schemas/RentalOverride
        | DI-752 | R222
    outputs:
    - element: Money panel
      rule: 'Two separate blocks, never summed: "Rental - paid AED 240.00 (order AQP-104582)" and "Deposit hold - AED 600.00
        to hold, released on return". Outstanding rental balance, if any, in red with "Charge".

        '
      source: contracts/satellite/rental.yaml#quoteRentalPrice | DI-757
    consistency:
    - with: EMP-099
      note: Same two-block layout at return, with Captured and Released added.
    - with: BO-551
      note: Shared design; the desk adds the override approval.
    sampleData:
      rental:
        paid: AED 240.00
        order: AQP-104582
      deposit:
        amount: AED 600.00
        basis: fixed 2 x 300.00
        method: Card hold
        card: Visa ending 4417
    corrections:
    - what: depositInstrument on the check-out is a free string while the deposit policy defines the instrument list (cardPreAuthorisation,
        cardCharge, cash, wallet).
      why: The method buttons need the enum; a free string invites values the settlement cannot release.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalCheckOut | contracts/satellite/rental.yaml#/components/schemas/RentalDepositPolicy
    - what: The staff-app role grants RENTAL_OPERATE but not RENTAL_OVERRIDE, so a deposit waiver or reduction, and any
        override of a failed readiness check, cannot be requested from the handheld.
      why: Either a supervisor step-up on the same device or a hand-off to the back office must be drawn; today neither
        is possible.
      source: contracts/satellite/rental.yaml#requestRentalCommercialOverride
    decisions:
    - question: How is the card hold taken and linked? The check-out carries the amount and method but no authorisation reference;
        the booking has depositAuthorisationId with no writer named.
      decision: 'Rental card hold: pre-authorisation on the payment terminal; the reference is stored on the booking; check-out
        is blocked until it succeeds.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-304 | CHG-NOTE-004
      questionSource: contracts/satellite/rental.yaml#/components/schemas/RentalCheckOut | contracts/satellite/rental.yaml#/components/schemas/RentalBooking
  EMP-079:
    summary: 'The group case of the equipment step (merge into EMP-074): ten bikes for a school group go out in one action,
      one row per participant with the unit assigned to each.

      '
    outputs:
    - element: Group table
      rule: Participant name, waiver signed (yes/no), unit tag. The group can leave only when every participant has a unit
        and a signature, or a supervisor overrides.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalParticipant | DI-755 | DI-760
    consistency:
    - with: EMP-089
      note: The active group view uses the same participant/unit rows.
    - with: BO-552
      note: Shared design.
    sampleData:
      group: RNT-10487, Al Mansoori school trip
      rows:
      - participant: Omar Ziad
        waiver: signed
        unit: BIKE-014
      - participant: Fatima Al Suwaidi
        waiver: not signed
        unit: BIKE-022
  EMP-080:
    summary: 'Final step: confirm and start the rental. A review of what is going out (units, condition, safety done, deposit
      held, due back time) and one "Check out" button that makes the booking active and starts the clock. The server re-checks
      every precondition here and names the one that failed.

      '
    inputs:
    - field: Due back
      rule: Pre-filled with the booked end time; shown large. Changing it is not a check-out edit - use Extend once the
        rental is active.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalCheckOut | DI-761
    - field: Send confirmation by
      rule: A segmented choice Email / SMS / App (pre-selected from the guest's contact details).
      source: screens/P06-staff-app.yaml#EMP-080
    actions:
    - action: Check out
      result: 'Success: booking becomes "Out", the guest sees the due-back time, the queue counter moves. Refusal (409)
        names the missing precondition and jumps to that step ("Agreement not signed by Daniel Brooks").

        '
      source: contracts/satellite/rental.yaml#checkOutRental
    consistency:
    - with: BO-553
      note: Shared design.
    sampleData:
      review:
        booking: RNT-10482
        units:
        - KAY-003
        - KAY-007
        kit: Paddle x2
        Life jacket x2: null
        deposit: AED 600.00 held
        dueBack: Sat 17 Oct 2026 11:00
    corrections:
    - what: The layout has a text field labelled "Email | SMS | App Notification", a select labelled with an arrow glyph,
        and pattern configEditor.
      why: Pack artefacts read literally - the first is a channel choice, the second has no meaning, and an activation step
        is not a configuration editor. No operation sends the confirmation either.
      source: screens/P06-staff-app.yaml#EMP-080
    decisions:
    - question: Does the rental clock start at the booked start or at handover? A guest who arrives 15 minutes late for a
        1-hour kayak - due back at the booked end or one hour after handover?
      decision: 'Drawn default accepted: Due back = booked end time; the attendant may set dueBackAt later only with a supervisor.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-305 | CHG-NOTE-004
      reviewable: true
      questionSource: contracts/satellite/rental.yaml#/components/schemas/RentalCheckOut | DI-761
  EMP-081:
    summary: 'Everything currently out, for the attendant and the station supervisor: who has what, when it is due back,
      and what is late. One list with chips for Due soon and Overdue (the contract makes them one query at two thresholds),
      replacing the separate due-soon, overdue and group screens.

      '
    outputs:
    - element: Active rental row
      rule: 'Guest, units (tags), due back time and a live countdown ("due in 12 min"), turning amber inside the due-soon
        threshold and red when overdue with the accruing late fee ("57 min late - AED 35.00 so far"). Sort: overdue first,
        then due soonest.

        '
      source: contracts/satellite/rental.yaml#listOverdueRentals | DI-761 | DI-764
    - element: Counters
      rule: Active rentals · Due within 30 min · Overdue · Group rentals out · Expected back next hour. Tap filters the
        list.
      source: contracts/satellite/rental.yaml#listRentalBookings | contracts/satellite/rental.yaml#listOverdueRentals
    consistency:
    - with: EMP-071
      note: Same row component.
    - with: BO-554
      note: Shared design; the desk adds the venue-wide view.
    sampleData:
      counters:
        active: 64
        dueWithin30Min: 9
        overdue: 3
        groupsOut: 2
        expectedNextHour: 21
      rows:
      - guest: Daniel Brooks
        units:
        - SUP-011
        due: '10:30'
        state: 57 min late - AED 35.00 so far
      - guest: Priya Nair
        units:
        - STR-P (pooled stroller)
        due: '13:00'
        state: due in 2 h 05 min
    corrections:
    - what: 'Board 7 is ten screens around one list and one rental. Consolidate to two per platform: Active rentals (EMP-081
        with EMP-087 Due soon and EMP-088 Overdue as filters and EMP-090''s alerts as a strip) and Rental detail (EMP-082
        with EMP-089 - a group is one booking with participants), with Extend (EMP-083 + EMP-084), Swap (EMP-085) and Report
        incident (EMP-086) as sheets on the detail.

        '
      why: listOverdueRentals is explicitly one query at two thresholds; a group rental is one booking; DI-671 asks for
        consolidation.
      source: contracts/satellite/rental.yaml#listOverdueRentals | contracts/satellite/rental.yaml#/components/schemas/RentalParticipant
        | DI-671
    - what: Tiles "Extensions Requested", "Equipment Swap Required" and "Active Incidents" have no data source; the Venue
        filter is meaningless on a venue-scoped handheld.
      why: An extension is applied immediately (no request state), no booking field flags a needed swap, and there is no
        operation listing incidents.
      source: contracts/satellite/rental.yaml#extendRental | contracts/satellite/rental.yaml#reportRentalIncident | contracts/satellite/rental.yaml#/components/schemas/RentalBooking
  EMP-082:
    summary: 'One rental while it is out: who, which units, when it went out, when it is due, what it is accruing, and the
      actions the attendant may take (Extend, Swap, Report incident, Start return). A timeline per item, as the client asked.

      '
    outputs:
    - element: Timeline
      rule: Booked at · Checked out at (by whom) · Extended to · Swapped (old/new unit) · Incident · Due back - each with
        the GST time; per item for a group.
      source: DI-761 | contracts/satellite/rental.yaml#/components/schemas/RentalBooking
    consistency:
    - with: BO-543
      note: The reservation detail before check-out; the same header and timeline component continue here.
    - with: BO-555
      note: Shared design.
    sampleData:
      booking: RNT-10482, Aisha Rahman
      timeline:
      - Booked 14 Oct 19:22 (guest app)
      - Checked out 10:04 by Priya Nair
      - Extended to 11:30 (+30 min, AED 25.00)
      - Due back 11:30
    corrections:
    - what: The booking read carries no equipment assignments and no events, so the per-item timeline (DI-761) and the per-unit
        states of a group cannot be drawn; there is also no booking creation time.
      why: getRentalBooking's summary promises "its timeline" but the schema has only checkedOutAt, dueBackAt and returnedAt.
      source: contracts/satellite/rental.yaml#getRentalBooking | contracts/satellite/rental.yaml#/components/schemas/RentalBooking
        | DI-761
  EMP-083:
    summary: '"Can I keep it another hour?" - first check that the units are free for the longer window, then price it.
      Opened from the rental detail as a sheet that continues straight into pricing (EMP-084). Get right: check availability
      before showing any price.

      '
    inputs:
    - field: Additional time
      rule: Chips in the venue's extension increment (default 30 min - +30, +60, +90) plus Custom; the new return time is
        computed and shown, not typed.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy | screens/P06-staff-app.yaml#EMP-083
    outputs:
    - element: Availability answer
      rule: '"Extension available until 12:00" in green, or "BIKE-014 is booked from 11:45" with the longest possible extension
        offered ("Extend to 11:30 instead").'
      source: contracts/satellite/rental.yaml#extendRental | contracts/satellite/rental.yaml#getRentalAvailability
    consistency:
    - with: BO-556
      note: Shared design.
    sampleData:
      current:
        start: '10:00'
        due: '11:00'
      request: +60 min
      answer: Available until 12:00
    corrections:
    - what: The "Extension check" table's columns are schema paths (RentalAvailability.windows[].availableQuantity, blockedWindows[].reason
        ...), and the screen has no bookingId entry parameter although it acts on one rental.
      why: Plumbing on a user screen; and for a serialised rental the check must be for the units already assigned, not
        the product in general.
      source: screens/P06-staff-app.yaml#EMP-083
  EMP-084:
    summary: 'Price the extension, get the guest''s yes and payment, then extend. The price is the venue''s extension price
      per increment, deliberately cheaper than paying late; show that comparison so the attendant can sell it.

      '
    outputs:
    - element: Price
      rule: '"+60 min - AED 50.00 (2 x 25.00)" with, beneath it, "If returned late instead: AED 70.00". No deposit line
        - the deposit already held does not change.'
      source: contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy | DI-753
    actions:
    - action: Charge and extend
      result: Takes payment through the usual Charge step, then extends with the accepted quote. Quote expired -> re-price
        with a note; conflict -> back to the availability answer.
      source: contracts/satellite/rental.yaml#extendRental
    - action: Extend free
      result: Only as an extension-fee waiver override (reason required); this is also how a late swap's compensation is
        given (DI-762).
      source: contracts/satellite/rental.yaml#/components/schemas/RentalOverride | DI-762
    consistency:
    - with: BO-557
      note: Shared design.
    sampleData:
      extension:
        from: '11:00'
        to: '12:00'
        price: AED 50.00
        vatIncluded: AED 2.38
        lateAlternative: AED 70.00
    corrections:
    - what: The extension is priced with quoteRentalPrice, which prices a new rental from the pricing profile and returns
        a deposit, while the fee policy defines the extension price per increment; and no payment step exists between quote
        and extend.
      why: The extension charge would come out at the base rental rate with a second deposit; the contract text itself says
        "take acceptance, take payment".
      source: contracts/satellite/rental.yaml#quoteRentalPrice | contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy
        | contracts/satellite/rental.yaml#extendRental
  EMP-085:
    summary: 'A unit fails mid-rental: take it back, give a replacement, keep the rental going. The client''s rule decides
      the time: a quick swap restarts the clock from the replacement, a later one keeps the clock and lets the attendant
      give that booking a free extension. The faulty unit goes to maintenance, not back to the pool.

      '
    inputs:
    - field: Reason
      rule: A short list (Brake fault, Puncture, Leak, Comfort/size, Other); "Other" needs a note.
      source: R222 | contracts/satellite/rental.yaml#swapRentalEquipment
    - field: Replacement unit
      rule: Scanned like the equipment step; may be left empty only to end that unit early.
      source: contracts/satellite/rental.yaml#swapRentalEquipment | DI-762
    - field: Time
      rule: 'Within the quick-swap threshold (e.g. 5 min since check-out) show "Clock restarts at 10:07". After it, show
        "Clock unchanged - due 11:00" with an optional "Add free time" (e.g. +15 min).

        '
      source: DI-762 | MoM 2026-09-09 4.8 | TRACKER Workshops/Actions row 267
    - field: Raise maintenance job
      rule: On by default for the outgoing unit.
      source: contracts/satellite/rental.yaml#swapRentalEquipment
    consistency:
    - with: BO-558
      note: Shared design.
    sampleData:
      out:
        unit: BIKE-014
        reason: Brake fault
      in: BIKE-031
      checkedOutAt: '10:04'
      swappedAt: '10:21'
      timeRule: Clock unchanged - due 12:15; free time +15 min granted
    corrections:
    - what: The swap operation says "the deposit, the agreement and the clock stay where they are" and has no field to restart
        the clock or grant free time; the quick-swap threshold is not a venue setting anywhere.
      why: Contradicts the agreed swap rule (DI-762); the threshold is a configured limit that should be a venue setting
        with a tenant default (R094).
      source: contracts/satellite/rental.yaml#swapRentalEquipment | DI-762 | R094
  EMP-086:
    summary: 'Log something that happened during a rental - injury, loss, theft, complaint, equipment failure, safety breach
      - against the booking and the unit. Distinct from damage at return: an incident may carry no charge and still be the
      most important event of the day.

      '
    inputs:
    - field: Kind
      rule: Large tiles; "Other" needs a note.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalIncident | R222
    - field: Severity
      rule: Low / Medium / High / Critical; High and Critical show "Authorities notified?" and the supervisor's call button.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalIncident
    - field: Photos
      rule: Optional.
      source: DI-766
    consistency:
    - with: BO-559
      note: Shared design.
    sampleData:
      incident:
        booking: RNT-10487
        unit: BIKE-022
        kind: Equipment failure
        severity: Medium
        description: Guest reports front brake slipping on the hill path; bike walked back to hub
    corrections:
    - what: The screen has no bookingId or assetId entry parameter, although it is opened for one rental and one unit.
      why: Without them the attendant would have to identify the booking again; pre-fill both from the rental detail.
      source: screens/P06-staff-app.yaml#EMP-086 | contracts/satellite/rental.yaml#reportRentalIncident
  EMP-087:
    summary: 'Rentals due back soon, so the guest can be reminded before they are late. After consolidation this is the
      "Due soon" filter of the active list with a "Send reminder" action per row; reminders are also sent automatically.

      '
    outputs:
    - element: Due-soon row
      rule: Guest, units, due time, minutes left, last reminder sent ("SMS 10:30").
      source: contracts/satellite/rental.yaml#listOverdueRentals | DI-763
    consistency:
    - with: EMP-081
      note: Same list, Due soon filter.
    - with: BO-560
      note: Shared design.
    sampleData:
      rows:
      - guest: Omar Ziad
        unit: KAY-007
        due: '11:00'
        left: 18 min
        reminder: SMS sent 10:45
    corrections:
    - what: The screen has no action at all, while the client asked for return reminders by SMS/app.
      why: A due-soon list nobody can act on; merge into EMP-081 with Send reminder (see EMP-088 for the message operation's
        own problem).
      source: screens/P06-staff-app.yaml#EMP-087 | DI-763
  EMP-088:
    summary: 'Rentals past due: how late, what it is accruing, and contact with the guest. After consolidation this is the
      "Overdue" filter of the active list. Show the point at which a late rental becomes "Not returned" (the deposit is
      then captured in full).

      '
    outputs:
    - element: Overdue row
      rule: '"57 min late - AED 35.00 so far" (grace already applied), guest mobile with Call, and "Becomes Not returned
        at 18:00" when the venue sets that threshold.'
      source: contracts/satellite/rental.yaml#listOverdueRentals | contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy
        | DI-764
    actions:
    - action: Send reminder
      result: Picks the venue's overdue template by name and the channel (SMS / WhatsApp / App); queued result shown on
        the row; "No mobile on file" when the guest has none.
      source: contracts/satellite/marketing-crm.yaml#sendTransactionalMessage
    consistency:
    - with: BO-561
      note: Shared design.
    sampleData:
      rows:
      - guest: Daniel Brooks
        unit: SUP-011
        due: '10:30'
        late: 57 min
        accrued: AED 35.00
        mobile: +971 50 412 8836
    corrections:
    - what: The message operation bound here (sendTransactionalMessage) declares the service and partner audiences, not
        staff, and asks for template and subject ids.
      why: A staff device cannot call it as declared; the screen needs a staff-callable "remind guest about rental" or the
        audience widened, with the template chosen by name.
      source: contracts/satellite/marketing-crm.yaml#sendTransactionalMessage | screens/P06-staff-app.yaml#EMP-088
      status: fixed
      by: CHG-WIR-008
  EMP-089:
    summary: 'A group rental while out - one booking, many units, each possibly in a different state (out, swapped, returned
      early, late). After consolidation this is the rental detail with one row per participant/unit.

      '
    outputs:
    - element: Group rows
      rule: Participant, unit, state (Out / Returned / Swapped / Late), due time; header shows "8 of 10 out, 2 back".
      source: contracts/satellite/rental.yaml#/components/schemas/RentalParticipant | DI-764 | DI-767
    consistency:
    - with: EMP-082
      note: Same screen after consolidation; the assignments gap noted there blocks this view too.
    - with: BO-562
      note: Shared design.
    sampleData:
      group: RNT-10487, 10 x Mountain bike M
      summary: 8 out, 2 returned early (Omar Ziad BIKE-014, Fatima Al Suwaidi BIKE-022)
  EMP-090:
    summary: 'Operational alerts for the station. On the handheld keep only what an attendant acts on now - rentals due
      in the next hour and late ones - as a strip on the active list. Predictions and trends belong to the back office''s
      rental analytics.

      '
    outputs:
    - element: Alert strip
      rule: '"9 due back in the next hour · 3 overdue" with tap-through.'
      source: contracts/satellite/rental.yaml#listOverdueRentals | DI-772
    consistency:
    - with: BO-563
      note: The desk version may keep the intelligence panel.
    - with: BO-584
      note: Rental executive analytics own utilisation and incident trends.
    sampleData:
      strip: 9 due back in the next hour - 3 overdue
    corrections:
    - what: 'The table is titled "Every active rental intelligence", the detail panel''s headings are sample values ("RNT-10482",
        "Confirmed", "Ready for Checkout"), and five of seven columns (predicted late returns, future conflicts, extension
        demand, return pressure, inventory shortage) have no operation behind them.

        '
      why: Generated plumbing and unbound predictions; and the client agreed AI's role in rentals is reporting and maintenance
        recommendations, with day-to-day operations staff-managed.
      source: screens/P06-staff-app.yaml#EMP-090 | DI-772 | DI-764
  EMP-091:
    summary: 'The return counter''s queue: what is expected back, what is late, what is part-returned and still owes units.
      The main action is "Scan item" to start a return (DI-765). Rows show the deposit held so the attendant knows what
      is at stake.

      '
    outputs:
    - element: Return row
      rule: Guest, units out (e.g. "8 of 10 still out"), due time with late state, deposit held. Sort overdue first, then
        due soonest.
      source: contracts/satellite/rental.yaml#listRentalBookings | DI-765 | DI-767
    - element: Counters
      rule: Expected back today · Due next 30 min · Overdue · Part-returned · Returned today. Drop the ones the data cannot
        count (see correction).
      source: contracts/satellite/rental.yaml#/components/schemas/RentalBooking
    consistency:
    - with: EMP-081
      note: Same list component; board 7's list and board 8's queue could be one list with an "Expected back" view.
    - with: BO-564
      note: Shared design.
    sampleData:
      counters:
        expectedToday: 88
        dueNext30Min: 12
        overdue: 3
        partReturned: 1
        returnedToday: 41
    corrections:
    - what: 'Board 8 is ten screens for one return. Consolidate to two per platform: Returns queue (EMP-091 with EMP-092''s
        scan) and Return for one booking, a stepped flow Units back (EMP-093 + EMP-097) -> Condition (EMP-094 with EMP-095''s
        before/after inline) -> Damage (EMP-096) -> Statement (EMP-098 + EMP-099) -> Done (EMP-100), ending in ONE return
        call.

        '
      why: returnRental is consumed by five screens (EMP-093, 097, 098, 099, 100) each with its own submit; the contract
        says settling separately means several authorisations against one hold and a guest charged twice.
      source: contracts/satellite/rental.yaml#returnRental | DI-767 | DI-671
    - what: Filters "Damage Status" and "Deposit Status" and tiles "Return in Progress", "Deposits Pending Settlement",
        "Equipment Awaiting Inspection" and "Maintenance Required" have no field in the booking.
      why: The booking has no damage, deposit-state or inspection-pending field and no return-in-progress status.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalBooking | screens/P06-staff-app.yaml#EMP-091
  EMP-092:
    summary: 'Find the rental from what comes back across the counter: scan the unit''s tag (or the guest''s QR), and the
      rental it belongs to opens with its units listed. Get right: a scanned tag that is not out on any rental says so,
      rather than opening nothing.

      '
    inputs:
    - field: Scan item or voucher
      rule: Accepts a unit tag or the booking QR; search by reference or guest name as fallback.
      source: DI-765 | MoM 2026-09-09 4.9
    consistency:
    - with: EMP-072
      note: Same scanner component and wording.
    - with: BO-565
      note: Shared design.
    sampleData:
      scanned: KAY-007
      found: RNT-10482, Aisha Rahman, KAY-003 and KAY-007, due 11:30
    corrections:
    - what: No operation finds the active rental from a scanned unit, and no search by reference or name exists; the screen's
        only read needs the booking id.
      why: DI-765 asks staff to scan or search; lookupAsset returns the asset but not the rental it is out on.
      source: contracts/satellite/rental.yaml#getRentalBooking | contracts/satellite/maintenance.yaml#lookupAsset | DI-765
  EMP-093:
    summary: 'Step 1 of the return: record when it came back and which units are here. The actual return time decides the
      extra-time charge against the grace period, so show the arithmetic now: booked vs actual, grace, chargeable minutes.

      '
    inputs:
    - field: Returned at
      rule: The scan time (GST), read-only for the attendant; correcting it is a supervisor action with a reason, because
        it changes the fee.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalReturn | designer default
    - field: Return location
      rule: Defaults to the attendant's station; if the product restricts the return location and this is not it, show a
        warning.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalOperationalRules
    outputs:
    - element: Time summary
      rule: '"Booked 10:00-11:00 · Back 11:52 · Grace 10 min · Chargeable 42 min" - the late/extra-time fee follows in the
        statement.'
      source: contracts/satellite/rental.yaml#/components/schemas/RentalSettlement | DI-765 | DI-499
    consistency:
    - with: BO-566
      note: Shared design.
    sampleData:
      booked: 10:00-11:00
      returnedAt: '11:52'
      grace: 10 min
      chargeable: 42 min
    corrections:
    - what: There is no way to show the settlement before committing it - returnRental takes everything and settles in one
        call, and nothing previews the statement.
      why: The client wants late fees, damage and final settlement calculated together before the deposit is released (DI-767);
        the guest must see and accept the statement first. Needs a preview (like explainRentalPrice for prices).
      source: contracts/satellite/rental.yaml#returnRental | DI-767
  EMP-094:
    summary: 'Step 2: condition of each returned unit, in exactly the layout used at check-out so the two can be compared.
      Photos optional unless the product requires them.

      '
    inputs:
    - field: Condition per unit
      rule: Good · Minor damage · Major damage · Faulty. Missing units are not inspected - they are declared missing in
        the units step.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalInspection | DI-500
    - field: Photos
      rule: Optional (client decision), required only by the product's photo-at-return rule.
      source: DI-766 | contracts/satellite/rental.yaml#/components/schemas/RentalOperationalRules
    consistency:
    - with: EMP-076
      note: Same component, phase after return.
    - with: BO-567
      note: Shared design.
    sampleData:
      units:
      - unit: KAY-003
        condition: Good
      - unit: KAY-007
        condition: Minor damage
        note: Crack on the stern hatch
        photos: 2
    corrections:
    - what: The return request carries a single inspection, but a group return has one condition per unit; and the condition
        is also recordable separately (recordRentalInspection), so it would be captured twice.
      why: Ten bikes back need ten conditions in the one return; one record per unit, captured once.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalReturn | contracts/satellite/rental.yaml#recordRentalInspection
  EMP-095:
    summary: 'Before and after side by side for a damaged unit, so the attendant can tell damage that was there at check-out
      from damage done during the rental. Read-only; its outcome is "Pre-existing - no charge" or "New - assess damage".

      '
    outputs:
    - element: Comparison
      rule: Two columns (At check-out 10:04 · At return 11:52) with condition, checklist items that changed highlighted,
        notes and photos paired.
      source: contracts/satellite/rental.yaml#recordRentalInspection | DI-766
    consistency:
    - with: EMP-096
      note: '"New - assess damage" opens damage with the evidence linked.'
    - with: BO-568
      note: Shared design; a dispute is usually reviewed here at the desk.
    sampleData:
      unit: KAY-007
      before:
        condition: Good
        photo: stern intact
      after:
        condition: Minor damage
        note: Crack on the stern hatch
    corrections:
    - what: The comparison screen is bound to the write (recordRentalInspection) and has no read of the booking's inspections.
      why: A comparison needs both inspections read back; there is no operation that returns them for a booking.
      source: screens/P06-staff-app.yaml#EMP-095 | contracts/satellite/rental.yaml#recordRentalInspection
  EMP-096:
    summary: 'Turn new damage into a charge: what is damaged, how much, the evidence, and the guest''s response. A charge
      above the venue''s threshold needs a second person, and a dispute is recorded, not deleted.

      '
    inputs:
    - field: Amount
      rule: Entered per damage (assessed, not tabulated), capped at the venue's maximum; above the approval threshold the
        button becomes "Send for approval".
      source: contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy | R197
    - field: Guest response
      rule: Accepted / Disputed / Not presented (default). Disputed keeps the charge on hold and the case open.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalDamageAssessment
    - field: Waive
      rule: Full or partial (amount or %) with a reason, e.g. the unit malfunctioned through no fault of the guest.
      source: DI-753 | contracts/satellite/rental.yaml#/components/schemas/RentalOverride
    consistency:
    - with: BO-569
      note: Shared design; the desk is where approval and disputes are decided.
    sampleData:
      damage:
        unit: KAY-007
        description: Crack on the stern hatch
        amount: AED 120.00
        guest: Accepted
        maintenance: WO-3318 raised
    corrections:
    - what: Damage is recordable twice - assessRentalDamage on this screen and the damage list inside the return call.
      why: One record per damage; the return should reference what was assessed, or this screen should only feed the return.
      source: contracts/satellite/rental.yaml#assessRentalDamage | contracts/satellite/rental.yaml#/components/schemas/RentalReturn
    - what: The approval above the threshold cannot happen on the handheld - the staff-app role has no RENTAL_APPROVE.
      why: Draw a supervisor step-up on the same device or a hand-off to the back office (BO-569).
      source: contracts/satellite/rental.yaml#assessRentalDamage
  EMP-097:
    summary: 'The units step when not everything comes back: what is returned now, what is still out and will come back
      later, and what is declared missing (charged). A partial return keeps the rental open - "8 of 10 back, 2 outstanding".

      '
    inputs:
    - field: Unit state
      rule: Three groups, each unit in exactly one - Returned now · Still out · Missing (charged at replacement cost or
        the fixed fee). Declaring missing needs a confirmation.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalReturn | contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy
        | DI-767
    consistency:
    - with: BO-570
      note: Shared design.
    sampleData:
      group: RNT-10487
      returnedNow: 8
      stillOut:
      - BIKE-031 (Daniel Brooks)
      missing:
      - unit: BIKE-040
        fee: AED 1
        450.00 replacement cost: null
    corrections:
    - what: Pooled items (paddles, life jackets, strollers) have no asset ids, so a partial return of a pooled quantity
        ("1 of 2 paddles back") cannot be expressed.
      why: The return carries returned and missing asset ids only; hybrid kits are common at a kayak station.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalReturn | contracts/satellite/rental.yaml#setRentalInventoryModel
    decisions:
    - question: On a partial group return, is part of the deposit released now, or is the whole hold kept until the last unit
        is back?
      decision: 'Drawn default stands (answer: "Hold the whole deposit until every unit is back"): Keep the whole hold until
        the booking closes; show "Deposit settles when all units are back".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-306 | CHG-NOTE-004
      questionSource: DI-767 | contracts/satellite/rental.yaml#returnRental
  EMP-098:
    summary: 'The statement: every charge from the return on one page, against one deposit - extra time, damage, missing
      items - then what is captured, released and, if charges exceed the deposit, still owed. This is what the guest is
      shown and agrees to.

      '
    outputs:
    - element: Statement lines
      rule: 'Extra time ("Booked 1 h, used 1 h 52 min - 42 min chargeable") · Damage · Missing items · Total charges · Deposit
        held · Captured · Released · Balance to pay. Money in the venue currency with its decimals (AED 2; BHD/KWD 3, never
        rounded).

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalSettlement | DI-499 | DI-306
    - element: Extra time
      rule: 'Usage beyond the paid time is charged at the normal rate (DI-499): a wheelchair paid for one hour and used for
        three is charged two more hours at the hourly rate.'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Waive extra-time fee
      result: An override with original and adjusted amounts and a reason; recorded, not silent.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalReturn | contracts/satellite/rental.yaml#/components/schemas/RentalOverride
    consistency:
    - with: BO-571
      note: Shared design.
    - with: BO-531
      note: The fee rules shown here are configured there; Board 8 consumes them and never re-creates them.
    sampleData:
      statement:
        extraTime: AED 35.00
        damage: AED 120.00
        missing: AED 0.00
        totalCharges: AED 155.00
        depositHeld: AED 600.00
        captured: AED 155.00
        released: AED 445.00
        balanceDue: AED 0.00
    corrections:
    - what: When charges exceed the deposit (balanceDue), the screen has no way to collect it.
      why: The settlement says a written-off bike against a AED 200 hold leaves a real debt; the statement needs a Charge
        path for the balance.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalSettlement
    decisions:
    - question: Is usage beyond the paid time charged at the normal rate (DI-499 - a wheelchair paid for one hour and used
        for three is charged two extra hours) or at the late-fee rate of the fee policy?
      decision: Usage beyond the paid time is charged at the normal rate (DI-499).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-307 | CHG-NOTE-004
      questionSource: DI-499 | contracts/satellite/rental.yaml#/components/schemas/RentalFeePolicy
  EMP-099:
    summary: 'Settle the deposit and give the guest the final statement: Release in full, or Capture part and release the
      rest, or capture in full when a unit is not returned. The deposit''s movements (held, captured, released) are listed
      as its history.

      '
    outputs:
    - element: Deposit outcome
      rule: '"Capture AED 155.00 · Release AED 445.00" in one line; the remainder of a partial capture always goes back
        to the guest. Card holds read "Released to Visa ending 4417"; a cash deposit is paid back from the till.'
      source: DI-752 | R127 | contracts/satellite/rental.yaml#/components/schemas/RentalDepositPolicy
    - element: Final statement
      rule: Sent by email/SMS/app and printable; the guest confirms on screen.
      source: screens/P06-staff-app.yaml#EMP-099 | DI-767
    consistency:
    - with: EMP-078
      note: Same money blocks as at check-out.
    - with: BO-572
      note: Shared design.
    sampleData:
      deposit:
        held: AED 600.00
        method: Card hold Visa ending 4417
        captured: AED 155.00
        released: AED 445.00
      history:
      - Held 10:04 AED 600.00
      - Captured 11:58 AED 155.00
      - Released 11:58 AED 445.00
    corrections:
    - what: The deposit history the screen's purpose requires is not bound; payments already has the deposit movement history
        (listDepositActivity).
      why: Without it the "transaction history" of the deposit cannot be shown.
      source: contracts/satellite/payments.yaml#listDepositActivity | screens/P06-staff-app.yaml#EMP-099
      status: fixed
      by: CHG-WIR-008
  EMP-100:
    summary: 'Close the return and decide what happens to each unit: back to available (after its turnaround), or faulty
      and off to maintenance. Ends with the rental completion summary the client asked for.

      '
    inputs:
    - field: Next for each unit
      rule: Two choices in the simplified states - "Available again" or "Faulty - send to maintenance"; Faulty is pre-selected
        when the condition was Faulty or Major damage.
      source: DI-500 | DI-770
    outputs:
    - element: Completion summary
      rule: Outcome badge (Returned · Returned with damage · Part-returned · Not returned), units and their next state,
        charges, deposit outcome, staff who handled check-out and return.
      source: contracts/satellite/rental.yaml#/components/schemas/RentalSettlement | DI-767
    consistency:
    - with: BO-573
      note: Shared design.
    - with: BO-581
      note: Return-to-service after maintenance happens there, not here.
    sampleData:
      outcome: Returned with damage
      units:
      - unit: KAY-003
        next: Available again from 12:07 (15 min turnaround)
      - unit: KAY-007
        next: Faulty - maintenance WO-3318
    corrections:
    - what: Disposition is bound to setAssetStatus, which needs ASSET_MANAGE (a configure-tier grant on the staff app),
        offers six maintenance statuses, and takes one asset per screen (assetId entry parameter).
      why: The attendant needs a per-booking choice in the two simplified states; the unit's next state should be part of
        the return, not a separate maintenance status change per unit.
      source: contracts/satellite/maintenance.yaml#setAssetStatus | DI-500 | screens/P06-staff-app.yaml#EMP-100
      status: fixed
      by: CHG-WIR-008
  BO-020:
    summary: 'The back-office order desk for an outlet manager or F&B supervisor: every live F&B order across the outlets
      the user may see, in the nine-state lifecycle, with the few acts a back office legitimately takes on an order (accept
      or refuse a guest order, cancel within the rules, move a kitchen ticket to the top, amend lines the kitchen has not
      started). Orders are taken and charged at the till (send to kitchen, then charge), not here. The one thing to get
      right is the cancel/void boundary: for each order the screen must show which act is available before anyone clicks
      it — refuse (ordered), cancel with void authority (accepted), or void in Order Corrections (in preparation onward).

      '
    inputs:
    - field: Outlet (filter)
      rule: 'A picker of outlet names (listOutlets), never a text field for an id. Defaults to the user''s own outlet when
        their access is restricted to one, otherwise "All outlets". F&B Director sees all outlets, an outlet manager only
        theirs.

        '
      source: contracts/satellite/fnb.yaml#listFnbOrders | DI-318 | DI-331
    - field: Status (filter)
      rule: 'Chips over the nine FnbOrderStatus values, grouped: Live (Ordered, Accepted, In preparation, Ready), Handed
        over (Served, Collected, Delivered), Cancelled, Refunded. Default is Live. The labels are the same nine words the
        till, kitchen display and guest app use.

        '
      source: MATRIX 4.6.35 | MATRIX 5.1.11 | contracts/satellite/fnb.yaml#/components/schemas/FnbOrderStatus
    - field: Table (filter)
      rule: 'Replaces the "Table visit id" text field. A picker of the outlet''s open tables by label (T12), resolved to
        the visit behind it. Hidden for outlets that do not offer table service.

        '
      source: contracts/satellite/fnb.yaml#listFnbOrders | DI-319
    - field: Cancel reason
      rule: 'Required. The contract''s cancel list, labelled for staff: Outlet refused (outletRefused), Guest cancelled
        (guestCancelled), Item unavailable (itemUnavailable), Taking too long (tooLong), Entered in error (error). Note
        optional, max 300 characters. "Record waste" toggle appears only when the order is Accepted (the kitchen may have
        started) and defaults off; it raises a waste movement instead of losing the cost.

        '
      source: contracts/satellite/fnb.yaml#cancelFnbOrder | R125
    - field: Accept order — estimated ready time
      rule: 'Optional time picker, prefilled from the outlet''s delivery policy: now + ASAP collection minutes (default
        25) for collection, now + ASAP delivery minutes (default 45) for delivery. Station is optional and defaults to the
        outlet''s routing rules; recordedAt is device time and never shown.

        '
      source: contracts/satellite/fnb.yaml#acceptFnbOrder | contracts/satellite/fnb.yaml#/components/schemas/FnbDeliveryPolicy
    - field: Move to top — reason
      rule: 'Reason required, 3 to 500 characters. Position is not asked by default: leaving it empty puts the ticket at
        the top of the rail. An optional "place at" (1–100) sits behind a secondary control.

        '
      source: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | R125 | MATRIX 4.6.34
    - field: Amend order — lines
      rule: 'Only lines the kitchen has not started can be removed or changed; lines In preparation or later are shown locked
        with "Already with the kitchen — void instead". Added lines follow the same modifier rules as the till. Online only.

        '
      source: contracts/satellite/fnb.yaml#amendFnbOrder | R125
    outputs:
    - element: Order list columns
      rule: 'Order number (venue prefix + sequence, e.g. AQP-104582), Outlet, Order type, Table or location, Status badge,
        Items, Total (AED, 2 decimals, VAT-inclusive with "incl. VAT" in the detail), Placed (time since, GST), Estimated
        ready. No ids, no kitchenTicketId, no recordedAt/syncedAt columns.

        '
      source: R152 | DI-039 | contracts/satellite/fnb.yaml#/components/schemas/FnbOrder
    - element: Order type label
      rule: 'Maps ServiceMode to the till''s words: tableService = Dine-in, quickService = Quick service, collection = Takeaway,
        delivery = Delivery, roomService = Room service. Never "Service mode".

        '
      source: contracts/satellite/fnb.yaml#/components/schemas/ServiceMode | POSV2-4
    - element: Selected order detail
      rule: 'Lines with modifiers and line notes; one kitchen ticket per preparation station with its own status (an order
        at the grill and the bar has two); a timeline of status changes; the sales order it fulfils as a link to Order Detail
        for payment and refund. A ticket moved up shows "Moved to top by Omar Ziad — VIP cabana guest".

        '
      source: contracts/satellite/fnb.yaml#/components/schemas/FnbOrder | MATRIX 10.1.1 | MATRIX 4.6.34
    - element: Not yet synced marker
      rule: 'An order whose syncedAt is empty came from a till that was offline; show "From an offline till — not yet synced"
        so a supervisor does not act on a stale status.

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder
    actions:
    - action: Accept
      result: 'Only on orders in Ordered that came from a guest channel (a till order at its own outlet is accepted in the
        same transaction). Success creates the kitchen tickets and the status becomes Accepted; 409 means already accepted,
        cancelled, or the outlet has stopped taking orders — say which.

        '
      source: contracts/satellite/fnb.yaml#acceptFnbOrder | F11 step 5
    - action: Refuse
      result: 'Cancel on an Ordered order: no approval, reason "Outlet refused" preselected. The guest is told at once rather
        than after ten minutes.

        '
      source: F11 step 5 | contracts/satellite/fnb.yaml#cancelFnbOrder
    - action: Cancel order (accepted)
      result: 'Destructive confirm naming the order, items and value ("Cancel AQP-104582 — 3 items, AED 96.50"). Needs void
        authority; without it the server answers 403 and the dialog says "Cancelling an accepted order needs void authority
        — ask a supervisor". Not offered from In preparation onward.

        '
      source: R091 | R125 | contracts/satellite/fnb.yaml#cancelFnbOrder
    - action: Void (in preparation or later)
      result: 'No cancel button. Show "Void in Order Corrections" which opens the order there; the server''s 409 names voidOrder
        as the next step.

        '
      source: R125 | contracts/satellite/fnb.yaml#cancelFnbOrder | contracts/spine/orders.yaml#voidOrder
    - action: Move to top
      result: 'The ticket takes the highest priority on the rail and records who and why. Rail order is the server''s; the
        screen shows tickets in the order returned and never re-sorts them.

        '
      source: R125 | contracts/satellite/fnb.yaml#listKitchenTickets
    - action: Advance kitchen ticket
      result: 'Only the next legal move is offered (Received to Preparing, Preparing to Ready, Ready to Recalled, Recalled
