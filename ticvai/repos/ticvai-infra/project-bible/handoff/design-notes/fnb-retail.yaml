    - action: Sign agreement
      result: Opens the waiver capture (signRentalAgreement, the BO-539 component); the signature-pad hardware is still
        open (DI-756).
      source: contracts/satellite/rental.yaml#signRentalAgreement | DI-756
    consistency:
    - with: BO-543
      note: The back office's reservation detail shows the same readiness rows; one component.
    - with: BO-546
