  EMP-065:
    summary: 'Receiving is the handheld screen at the delivery door: open the expected delivery (a supplier order or an
      inbound transfer), read the manifest before touching the goods, record the temperature of chilled deliveries, book
      in what arrived line by line with batch and expiry, and refuse what is damaged. The one thing to get right is order:
      manifest first, temperature before posting, refusal at the door.

      '
    inputs:
    - field: Delivery
      rule: 'Scan the delivery note or pick from today''s expected deliveries for this location: supplier orders that are
        sent or partly received, and inbound transfers in transit. Show supplier or sending store, reference and number
        of lines.

        '
      source: F35 step 2 | contracts/satellite/inventory.yaml#getStockTransfer
    - field: Temperature (chilled and frozen)
      rule: 'Reading in °C with the threshold shown, and a decision: Accept, Accept with note, Partly reject, Reject. Taken
        before posting. A breach opens a major corrective action automatically.

        '
      source: F28 step 1 | R125 | contracts/satellite/fnb.yaml#logColdChain
    - field: Received quantity per line
      rule: 'Big steppers; scan an item to jump to its line. "All as sent / as ordered" shortcut. The limit for a supplier
        order is outstanding plus the tolerance (proposed 5%).

        '
      source: R094 | contracts/satellite/inventory.yaml#createGoodsReceipt
    - field: Batch and expiry
      rule: 'Expiry required for perishable items. A date picker that defaults to empty, never to today. "Add batch" splits
        a line.

        '
      source: R171 | DI-345
    - field: Rejection
      rule: 'Per receipt line: quantity, reason (Damaged, Wrong item, Quality failure, Short-dated, Over-delivery, Other)
        and a note, required for Other.

        '
      source: R171 | R222 | contracts/satellite/inventory.yaml#rejectReceivedGoods
    outputs:
    - element: Manifest
      rule: 'Line by line, what is expected (ordered or sent) against what is being received. A running "Missing" count
        shows at the top.

        '
      source: F35 step 2 | contracts/satellite/inventory.yaml#getStockTransfer
    - element: Done
      rule: 'Receipt number (e.g. AQP-GR-000431) or "Transfer received", lines received, lines rejected, "Stock updated".
        If the device was offline: "Saved on this device, will sync" with the number from the device''s reserved range.

        '
      source: R152 | contracts/satellite/inventory.yaml#/components/schemas/GoodsReceipt
    actions:
    - action: Post receipt
      result: 'Adds stock. Offline-capable for supplier orders. Over-receipt is refused, naming the line and its maximum.

        '
      source: contracts/satellite/inventory.yaml#createGoodsReceipt | R094
    - action: Reject
      result: Reverses the stock on the chosen lines and raises a supplier return. Needs a connection.
      source: contracts/satellite/inventory.yaml#rejectReceivedGoods
    edgeCases:
    - case: Offline at the loading bay
      expected: 'The receipt and the temperature reading queue. Rejection waits for the connection, and the screen says
        "Reject when back online".

        '
      source: contracts/satellite/inventory.yaml#createGoodsReceipt | contracts/satellite/fnb.yaml#logColdChain | contracts/satellite/inventory.yaml#rejectReceivedGoods
    - case: Damage found after opening the cases
      expected: 'Received, then adjusted with a damage reason (Damage, Loss & Adjustment). It is no longer a door rejection.

        '
      source: F35 step 3
    consistency:
    - with: BO-052
      note: Same fields, reasons and tolerance message as the back-office receipt.
    - with: BO-080
      note: Same manifest and discrepancy wording for an inbound transfer.
    sampleData:
      delivery:
        supplier: Gulf Fresh Dairy LLC
        order: PO-AQP-000214
        deliveryNote: GFD-DN-778120
        expected: 16 Oct 2026, 07:00–09:00
      temperature:
        reading: 3.8 °C
        threshold: ≤ 5 °C
        decision: Accept
      lines:
      - item: Full-cream milk 2 L
        ordered: 60
        received: 60
        batches:
        - batch: L2610A
          expiry: '2026-10-23'
          qty: 36
        - batch: L2610B
          expiry: '2026-10-24'
          qty: 24
      - item: Greek yoghurt 1 kg
        ordered: 24
        received: 24
        rejected: 4
        reason: Damaged
      receiver: Khalid Al Mansoori
    corrections:
    - what: The title is "Receiving & Store Put-Away".
      why: 'The agreed simplicity principle excludes put-away (and picking, packing, dispatching) as statuses or steps.
        No put-away operation exists. Retitle "Receiving".

        '
      source: DI-346
      status: fixed
      by: CHG-SPO-018
    - what: 'The screen has no way to find the expected supplier order (no order list or read), and no "Receive" for an
        inbound transfer (receiveStockTransfer), although it opens transfer manifests.

        '
      why: 'A receipt needs a purchase order the handheld cannot look up, and a transfer manifest can be read but not received.

        '
      source: contracts/satellite/inventory.yaml#createGoodsReceipt | contracts/satellite/inventory.yaml#receiveStockTransfer
        | F35 step 2
      status: fixed
      by: CHG-WIR-008
    - what: 'F35 step 3 rejects damaged transfer cases "at the door, before the receipt is posted" with rejectReceivedGoods.

        '
      why: 'rejectReceivedGoods acts on a posted goods receipt (it reverses stock) and only for supplier orders. A transfer
        door refusal is a received quantity lower than sent, followed by close short.

        '
      source: F35 step 3 | contracts/satellite/inventory.yaml#rejectReceivedGoods | contracts/satellite/inventory.yaml#receiveStockTransfer
      status: fixed
      by: CHG-WIR-008
    - what: The rejection reasons are a fixed list.
      why: The client asked for a user-defined reason list that can be extended without development.
      source: DI-363
      status: logged
      by: CHG-SPO-019
  EMP-066:
    summary: 'The counter''s handheld. Open the count assigned to my location, walk the shelves and enter what is there,
      line by line, blind, offline if needed. Recount the lines a supervisor sends back. The daily count list lives here
      too. The one thing to get right is that the counter never sees the expected quantity or the variance on this device.

      '
    inputs:
    - field: Count line
      rule: 'Pre-filled item list (one card per item at the location) with a blank quantity. Scan to jump to an item. Unit
        selector (base or purchase unit). Optional batch and note. Entering a line again replaces the earlier entry.

        '
      source: R110 | R171 | contracts/satellite/fnb.yaml#enterCountLine
    - field: Daily count list
      rule: 'Choose the 20 or so items counted every day (high-value, high-variance) and the due time. "Adjust stock" stays
        off: a daily count is a check, not a correction.

        '
      source: F30 step 1 | contracts/satellite/inventory.yaml#setDailyCount
    outputs:
    - element: Progress
      rule: '"38 of 46 counted", and lines sent back for recount highlighted at the top with the supervisor''s reason.'
      source: F30 step 6 | contracts/satellite/fnb.yaml#requestRecount
    edgeCases:
    - case: No signal in the cellar
      expected: Lines save on the device and the count stays open. A small "12 lines waiting to sync" banner.
      source: F30 step 2
    sampleData:
      count:
        location: Main Store > Beverage Store
        type: Full
        lines: 212
        counted: 87
      line:
        item: Still water 500 ml bottle
        unit: case of 24
        counted: 18 case + 7 bottle
    corrections:
    - what: 'The handheld carries the variance panel, "Post stock count" and "Request recount". It has no list of open counts
        to choose from.

        '
      why: 'In F30, variance review, recount requests and posting are the supervisor''s steps on BO-079 (steps 4, 5 and
        7). A counter''s device showing variance weakens the blind count. Without the open-count list, the counter cannot
        find the count to enter lines on.

        '
      source: F30 step 4 | F30 step 5 | F30 step 7 | R110 | contracts/satellite/inventory.yaml#listStockCounts
      status: fixed
      by: CHG-WIR-008
    - what: The first-run state offers "Request recount".
      why: First run should offer "Start count" (or "No count assigned to you").
      source: screens/P06-staff-app.yaml#EMP-066
      status: fixed
      by: CHG-WIR-008
    - what: Bulk RFID counting is requested but has no operation or device.
      why: Open with the client. The RFID reader is still on the hardware list.
      source: DI-365 | TRACKER 30-Sep/Tracker row 28
  EMP-067:
    summary: 'Damage, Loss & Adjustment on the handheld: record that something broke, spoiled, went missing or was found,
      with a reason, so stock stays true and shrinkage is visible. The one thing to get right is a single, quick form (item,
      quantity, reason, note) that writes one movement.

      '
    inputs:
    - field: Item and quantity
      rule: Scan or search, positive quantity, unit. Direction from the choice "Remove from stock" (waste, damage, loss)
        or "Add to stock" (found).
      source: R171 | contracts/satellite/inventory.yaml#createStockMovement
    - field: Reason
      rule: 'From the venue''s reason list (e.g. Spoilage, Breakage, Expired, Preparation error, Over-production, Theft
        suspected, Found), with a note required for Other.

        '
      source: DI-363 | R222 | MATRIX 4.6.31
    sampleData:
    - item: Wine glass 350 ml
      qty: 6
      direction: Remove
      reason: Breakage
      location: Oasis Bistro Kitchen
      by: Aisha Rahman
    - item: Croissant, butter
      qty: 14
      direction: Remove
      reason: Over-production
      location: Bite & Go counter
    corrections:
    - what: 'Waste can be recorded two ways: the F&B waste operation (recordWaste, gated by the order-modify permission)
        and an inventory movement of kind waste.

        '
      why: 'Two paths for one event split the waste report. Gating waste by an order permission borrows from the wrong domain
        (procurement and stock got their own permissions).

        '
      source: R091 | contracts/satellite/fnb.yaml#recordWaste | contracts/satellite/inventory.yaml#createStockMovement
    - what: 'A raw "Id" text field and a "Recorded at" date picker are on the form. "Log temperature" and "Sign corrective
        action" (HACCP) are on this stock-adjustment screen.

        '
      why: 'The id and timestamp are plumbing set by the device. HACCP checks have no screen of their own on the staff app,
        so they were bolted onto two stock screens (EMP-062, EMP-067). Draw them, if kept, as a separate "Food safety" section,
        clearly not part of the stock form.

        '
      source: R254 | F28 step 2 | screens/P06-staff-app.yaml#EMP-067
      status: fixed
      by: CHG-WIR-008
    - what: The reason list is not configurable.
      why: The client asked for a user-defined reason list that can be extended without development.
      source: DI-363
  EMP-068:
    summary: 'Reservation & allocation on the handheld: hold stock for a guest to collect later today (or for a VIP), and
      see what is held against what is free. The one thing to get right is the hold length. A merchandise reservation runs
      from at least 15 minutes to no later than the end of the visit day, which is the default.

      '
    inputs:
    - field: Hold until
      rule: Default end of today's operating day. Earliest 15 minutes from now. Shown as a time, e.g. "until 22:00 today".
      source: R169 | R215 | contracts/satellite/retail.yaml#reserveMerchandise
    - field: Guest
      rule: Optional guest search (name or mobile). A collection note up to 200 characters.
      source: contracts/satellite/retail.yaml#reserveMerchandise
    outputs:
    - element: Held stock
      rule: 'Reservation number, guest, items, held until, status (Reserved, Collected, Expired, Cancelled). A held item
        is never handed over unpaid.

        '
      source: R236 | contracts/satellite/retail.yaml#reserveMerchandise
    sampleData:
    - reservation: RSV-MBR-002118
      guest: Fatima Al Suwaidi
      items:
      - Aqua Park logo T-shirt, green, M ×2
      holdUntil: 22:00 today
      status: Reserved
    corrections:
    - what: 'Allocation per sales channel ("50 units online, 50 on-site, each selling independently") is not modelled. The
        screen binds only the guest collection hold and stock positions.

        '
      why: 'The agreed decision has no operation or field (stock reservations have no channel; the reservation source types
        are work order, rental, order, transfer, other).

        '
      source: DI-364 | contracts/satellite/inventory.yaml#/components/schemas/StockReservationSourceType
    - what: There is no list, cancel or collect of reservations on the screen, although those operations exist.
      why: A hold that cannot be seen or released from the handheld is held until it expires.
      source: contracts/satellite/retail.yaml#cancelMerchandiseReservation | contracts/satellite/retail.yaml#collectMerchandiseReservation
      status: fixed
      by: CHG-WIR-008
    decisions:
    - question: Is a merchandise collection hold the same thing as an inventory stock reservation (and so counted in Allocated)?
      decision: 'Drawn default accepted: Yes, it reduces Available.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-301 | CHG-NOTE-004
      reviewable: true
      questionSource: R171 | DI-361
  EMP-069:
    summary: 'Barcode, serial and traceability on the handheld: scan a barcode for price and stock, or a serial to find
      exactly one item (a watch at the jewellery counter, a camera returned under warranty). The one thing to get right
      is serial-first search.

