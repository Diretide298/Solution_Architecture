    - what: Pattern configEditor (form) and the transition to BO-045 labelled "The draft is scheduled for Monday rather
        than published now"; F31 step 3 cites updateMenu for the re-verification.
      why: It is a per-dish detail screen; the way back is "Back to the menu"; re-verification is automatic after the change
