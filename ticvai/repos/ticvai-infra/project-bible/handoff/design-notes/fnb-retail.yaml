      by: CHG-WIR-008
    - what: '"Nutrition" is in the name but no operation writes nutrition; the Nutrition and Allergen (contains / may contain)
        schemas are referenced by nothing; MenuItem.allergens is a flat list, so "may contain" from a shared fryer cannot
        be declared although the verdict reports shared equipment.'
      why: The screen cannot do what its name says, and the cross-contact claim has nowhere to live.
      source: contracts/satellite/fnb.yaml#/components/schemas/Nutrition | contracts/satellite/fnb.yaml#/components/schemas/Allergen
