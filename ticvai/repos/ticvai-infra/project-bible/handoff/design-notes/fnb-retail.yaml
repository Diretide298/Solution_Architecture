  BO-136:
    summary: 'F&B policy for the venue (FNB-1K): which F&B actions need approval at which amount and by whom - voids, manual
      price changes, complimentary items, refunds, moving items between checks, re-opening a closed check - plus the venue''s
      F&B limits (comp escalation amount, kitchen recall window, the food-safety lead). The client asked for F&B controls
      that configure approval workflows by amount thresholds and user privileges. The one thing to get right is showing,
      beside every value, the tenant default it inherits when left empty.'
    inputs:
    - field: Comp escalation amount
      rule: Money in the venue currency; above it, comping a line needs the discount permission. Empty inherits the tenant
        default (proposed AED 100.00, client to correct).
      source: contracts/spine/tenancy.yaml#/components/schemas/VenueSettings | R197 | R094
    - field: Kitchen recall window
      rule: Minutes after a bump during which the kitchen can still recall (0 to 60, proposed 10); after it a recall is
        a re-fire.
      source: contracts/spine/tenancy.yaml#/components/schemas/VenueSettings | R094
    - field: Food-safety lead
      rule: A person picker (staff with food-safety rights). Required for escalations; while empty, escalating a corrective
        action is refused and the screen says so.
      source: R096 | contracts/satellite/fnb.yaml#escalateCorrectiveAction
    - field: Approval matrix
      rule: Rows per action (Void, Manual price change, Complimentary item, Refund, Move items between checks, Re-open closed
        check) with amount bands and the role that approves each band.
      source: DI-324 | screens/P08-venue-back-office.yaml#BO-136
    outputs:
    - element: Inherited values
      rule: '"Inherits AED 100.00 (tenant default)" in grey under an empty field; a set value shows "Venue value" and a
        reset link.'
      source: R094
    actions:
    - action: Save F&B settings
      result: The settings save replaces the venue's whole settings record; the screen must send every non-F&B setting back
        unchanged (they are not shown here), or they revert to defaults.
      source: contracts/spine/tenancy.yaml#setVenueSettings
    edgeCases:
    - case: No food-safety lead named
      expected: A warning banner on this screen and on the food-safety views - "Escalations will be refused until a food-safety
        lead is named".
      source: R096 | contracts/spine/tenancy.yaml#/components/schemas/VenueSettings
    - case: The user lacks venue-configuration rights
      expected: Read-only with the reason; never an empty page.
      source: contracts/spine/tenancy.yaml#setVenueSettings
    consistency:
    - with: POS-014
      note: The approval bands set here are what the till's supervisor step-up obeys (DI-324 scopes both).
    - with: BO-140
      note: The food-safety lead named here is who receives escalations from the food-safety views.
    sampleData:
      venue: Aqua Park
      compEscalation: AED 100.00 (inherits tenant default)
      recallWindow: 10 minutes
      foodSafetyLead: Fatima Al Suwaidi
      approvals:
      - action: Void
        upTo: AED 50.00
        role: Supervisor
      - action: Void
        above: AED 50.00
        role: Manager
      - action: Complimentary item
        upTo: AED 100.00
        role: Supervisor
      - action: Refund
        any: true
