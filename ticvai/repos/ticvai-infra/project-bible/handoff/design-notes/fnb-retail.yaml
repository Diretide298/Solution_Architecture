  BO-1065:
    summary: 'Region settings: the trading currency and its decimals, time zone, date and number formats, fiscal year start,
      and the notes and coins every till in the region counts. Written at region scope by someone who holds region configuration,
      and inherited by every venue beneath. One thing to get right: currency and decimals freeze once the region has traded,
      and denominations are never deleted — a note taken out of circulation is deactivated so past cash-ups still read.

      '
    inputs:
    - field: Region
      rule: When the user configures several regions, pick one first; the save names that region.
      source: contracts/spine/shift.yaml#setDenominations
    - field: Currency and decimals
      rule: 'ISO 4217 code with its decimals (AED 2; BHD, KWD, OMR 3), set together. Locked with the reason "This region
        has transactions" once it has traded (409).

        '
      source: contracts/spine/tenancy.yaml#updateRegionSettings | ADR-0008 | DI-306
    - field: Time zone
      rule: IANA zone picker (Asia/Dubai for the UAE). No separate daylight-saving setting — the zone carries it.
      source: contracts/spine/tenancy.yaml#/components/schemas/RegionSettings
    - field: Date and number format
      rule: Defaults dd/MM/yyyy and
      source: contracts/spine/tenancy.yaml#/components/schemas/RegionSettings
    - field: Denominations
      rule: 'Per currency: note or coin, face value above zero, unique per kind and value, display name (English and Arabic),
        counting order by drag (notes highest first, coins as they sit in the tray), active toggle. Removing a row deactivates
        it. UAE seed: notes 5, 10, 20, 50, 100, 200, 500, 1000 AED; coins 25 fils, 50 fils, 1 AED.

        '
      source: R229 | contracts/spine/shift.yaml#setDenominations | contracts/spine/shift.yaml#/components/schemas/Denomination
        | DI-306
    outputs:
    - element: Till count preview
      rule: The denomination list as the till's count screen will show it, in counting order, with note and coin images.
      source: DI-775 | contracts/spine/shift.yaml#listDenominations
    actions:
    - action: Save region settings
      result: Replaces the region's settings whole; 409 when a currency or decimals change is attempted after trading.
      source: contracts/spine/tenancy.yaml#updateRegionSettings
    - action: Save denominations
      result: 'Returns the full list including deactivated rows; 422 "zero or duplicate denomination" or "this currency
        is not traded in the region".

        '
      source: contracts/spine/shift.yaml#setDenominations
    edgeCases:
    - case: A note withdrawn from circulation
      expected: Deactivated, still listed (marked) so a till that finds one can record it.
      source: contracts/spine/shift.yaml#listDenominations
    - case: A venue in the region trading in a second currency
      expected: Its denominations are set here under that currency.
      source: contracts/spine/shift.yaml#setDenominations | ADR-0018
    consistency:
    - with: POS-001
      note: Begin Shift's float count uses this list and order.
    - with: POS-007
      note: Close Shift's blind count uses the same list.
    - with: BO-065
      note: The venue shows the currency read-only and chooses guest display currencies there.
    - with: BO-077
      note: Exchange rates per region are there, not here.
    sampleData:
      region: United Arab Emirates
      settings:
        currency: AED
        decimals: 2
        time_zone: Asia/Dubai
        date_format: dd/MM/yyyy
        number_format: '#,##0.00'
        fiscal_year_start: January
      denominations:
      - AED 1000 (note)
      - AED 500
      - AED 200
      - AED 100
      - AED 50
      - AED 20
      - AED 10
      - AED 5
      - AED 1 (coin)
      - 50 fils
      - 25 fils
      bahrain_example:
        currency: BHD
        decimals: 3
        note: no 1000 note
    corrections:
    - what: 'Placement — the screen sits in the F&B process list, its module is "Access & Venue" with requiresModule seating
        (from the seat-mapping pack, board 12), but every operation on it is region scope (REGION_CONFIGURE).

        '
      why: 'Currency, time zone and denominations are region settings every till needs (POS-001 reads listDenominations);
        a tenant without the seating licence could not set them. It is a core platform setting (platform/region), not F&B
        and not seating.

        '
      source: contracts/spine/shift.yaml#setDenominations | contracts/spine/tenancy.yaml#updateRegionSettings | screens/P08-venue-back-office.yaml#BO-1065
      status: fixed
      by: CHG-SBO-003
    - what: No read of the region's settings is declared (getRegionSettings), while updateRegionSettings replaces the whole
        record.
      why: The form cannot show current values and a save would reset fields it never loaded (e.g. allowed AI residencies).
      source: contracts/spine/tenancy.yaml#getRegionSettings | contracts/spine/tenancy.yaml#updateRegionSettings
      status: fixed
      by: CHG-WIR-008
    - what: '"Channels" — enabling web, mobile, POS, box office, call centre, B2B, partner API and marketplace per venue
        — has no operation, and RegionSettings has no channels.

        '
      why: The name promises a function the screen cannot perform; sales-channel set-up is a separate, venue-level capability.
