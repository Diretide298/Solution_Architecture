      status: fixed
      by: CHG-WIR-008
    - what: No board frame; the client's frame FNB-5D ("Production Execution & Batch") is listed on BO-136.
      why: The designer would draw this screen from nothing.
      source: screens/P08-venue-back-office.yaml#BO-138
    - what: The "Plan production run" modal requires id and status and offers actualQuantity, varianceReason and productionPlanId.
      why: Id and status are plumbing, the plan link is read-only, actual and variance belong to completion.
