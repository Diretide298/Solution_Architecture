  GST-024:
    summary: 'The app''s in-venue food ordering. A guest on a lounger, at a table or in a seat scans the code with the app''s
      camera, orders, pays and gets the food brought or calls at the counter (F11, F48). It can also be opened from the
      dining tab, from a virtual-queue wait (F48 step 4) or from a push offer. Keep it deliberately simple, not a full shopping
      flow (DI-1091). The one thing to get right: location first, then a menu where sold-out dishes and allergens are always
      visible, and every refusal before payment.'
    inputs:
    - field: Scan the code where you're sitting
      rule: The app's own camera scanner, with a "Type the number instead" link for a damaged QR (the human-readable location
        code). At a seated event the seat from the guest's ticket is offered prefilled. Codes rotate, so a screenshot of
        an old code is refused.
      source: F11 step 1 | DI-288 | DI-291 | contracts/satellite/fnb.yaml#claimLocationSession
    - field: Order type, time, address, cutlery, quantity, kitchen note, payment
      rule: Same rules as WEB-036. Only the order types the outlet supports. ASAP first, then open slots. Address emirate
        chosen from the outlet's list. Cutlery off by default. 1 to 20 per dish. Kitchen note up to 200 characters for allergies.
        Card or wallet, plus "Add to my table's bill" only on an open table tab.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderRequest | R080 | DI-1039
    outputs:
    - element: Outlets, menu, sold out, allergens, prices, basket
      rule: As WEB-036. Only outlets open now. Wait estimate only when reported. Sections in the outlet's order, with the
        menu's end time. Sold-out dishes greyed with "Sold out" and never hidden. Allergens on every dish card and never
        omitted. Money at the menu's currency scale. Basket lines list their choices, with the delivery fee and the free-delivery
        gap.
      source: contracts/satellite/fnb.yaml#getGuestMenu | contracts/satellite/fnb.yaml#listDiningOutlets | DI-1039 | DI-1050
    - element: Ordering-to banner
      rule: Once a location is claimed, a persistent strip shows "Ordering to Lounger B-14 · Pool Bar" with "Change". The
        session's expiry is not shown as a countdown; the guest is asked to rescan only when it has expired.
      source: contracts/satellite/fnb.yaml#/components/schemas/LocationSession | designer default
    - element: Order placed
      rule: Large order number, destination or collection point, and ready time; then GST-025. A push and the in-venue notifications
        feed (GST-030) carry later status changes.
      source: F48 step 5 | contracts/satellite/fnb.yaml#/components/schemas/GuestOrderResult
    - element: Payment and receipt
      rule: The F&B order keeps its own payment step and its own receipt; it never joins the ticket cart's one receipt (DI-293
        does not apply to F&B).
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Add
      result: A dish with modifier groups opens the GST-061 panel. A dish without them goes straight into the basket.
      source: REV3-9 | DI-1050
    - action: Place order and pay
      result: Places the order with the quoted total, then payment on GST-009 (card or wallet). The kitchen is not told
        until payment is resolved. Then GST-025.
      source: F11 step 3 | F11 step 4 | contracts/satellite/fnb.yaml#createGuestFnbOrder
    edgeCases:
    - case: Every refusal (sold out mid-order, price changed, session expired, not serviceable, below minimum, outside area,
        slot filled, payment declined)
      expected: Same messages and recovery as WEB-036. The basket is always kept; one cause is named, and one way on is
        offered.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderProblem | DI-1039
    - case: Opened from a virtual-queue wait (F48)
      expected: The queue place stays visible as a small strip, so the guest knows ordering does not lose it.
      source: F48 step 4 | designer default
    - case: The guest loses signal after ordering
      expected: The order is already placed; the confirmation stays and status resumes on reconnect.
      source: F11 step 6
    - case: The F&B module is off for the venue
      expected: No food entry appears in the app at all, rather than an empty screen. An empty state appears only when the
        module is on and nothing is open, and then it names the next opening time.
      source: DI-285 | DI-505 | TRACKER Workshops/Actions row 59
    consistency:
    - with: WEB-036
      note: Functionally identical (DI-970, DI-1084); wording, refusals and rules shared. Table booking and the waitlist
        are on GST-070 in the app.
    - with: GST-061
      note: The modifier panel.
    - with: GST-025
      note: Tracking, carrying the order.
    - with: GST-009
      note: The payment step (F11 step 4) uses the shared Review & Payment component; card or wallet only on guest channels.
    - with: GST-023
      note: F48 enters from a virtual-queue wait.
    sampleData:
      seeAlso: WEB-036 sampleData (same venue, outlets, menu and order)
      location: Lounger B-14 · Pool deck · served by Pool Bar
      guest: Omar Ziad
      order:
        number: AQP-104617
        total: AED 67.00
        readyAbout: '14:10'
        to: Lounger B-14
    corrections:
    - what: 'Plumbing on screen: data tables of outlets, slots, delivery locations and modifier groups with ids and scopePath,
        a "Mode" select and "Date" picker bound straight to query parameters, and modals collecting id and recordedAt behind
        "Claim location session", "Create guest F&B order" and "Claim table session".'
      why: The guest reads none of these.
      source: screens/P02-guest-mobile-app.yaml#GST-024 | R254
      status: fixed
      by: CHG-SGU-018
    - what: The states name a permission ("Shown when the caller lacks PRODUCT_VIEW") and the empty state offers "Create
        guest F&B order".
      why: 'For a guest caller, permission does not apply (ADR-0025): an operation with a staff and guest audience resolves
        to the guest''s own data. An empty outlet list has nothing to "create"; it should name the next opening time.'
      source: ADR-0025 | screens/P02-guest-mobile-app.yaml#GST-024
      status: fixed
      by: CHG-GST-004
    - what: claimTableSession and listModifierGroups are declared.
      why: claimTableSession was superseded by claimLocationSession on 26 September. Modifier groups come with each dish
        in getGuestMenu. Same correction as WEB-036.
      source: contracts/satellite/fnb.yaml#claimTableSession | contracts/satellite/fnb.yaml#/components/schemas/GuestMenu
      status: fixed
      by: CHG-SGU-018
    decisions:
    - question: Takeaway or delivery to an address versus "no F&B without admission"; one cart versus the F&B order's own
        payment.
      decision: A guest F&B order keeps its own payment step and its own receipt (DI-293's one receipt does not apply to F&B).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-052 | CHG-NOTE-004 | CHG-SGU-001
      questionSource: DI-292 | DI-1039 | DI-293 | F11 step 4
  GST-025:
    summary: 'App order tracking, functionally identical to WEB-038: the kitchen''s real status, a pickup card when it is
      ready, the per-dish state, and the table bill where the order is on a table visit. Push and the in-venue feed carry
