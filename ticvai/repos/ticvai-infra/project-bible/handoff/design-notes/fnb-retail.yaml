      rule: Order number, guest name, items with options, allergen flags — printed from the order, not composed on the device.
      source: contracts/satellite/fnb.yaml#printOrderLabel
    actions:
    - action: Chase station
      result: Asks the station where a line is; recorded as a chased exception (a station chased six times a service is
        a signal).
      source: contracts/satellite/fnb.yaml#chaseStation
    - action: Print label
      result: Prints the bag label for takeaway and delivery orders.
      source: contracts/satellite/fnb.yaml#printOrderLabel
    - action: Hand over
      result: Collected at the counter, or handed to a runner who records Delivered with the location.
      source: contracts/satellite/fnb.yaml#markOrderCollected | contracts/satellite/fnb.yaml#recordOrderHandover
    edgeCases:
    - case: Offline
      expected: Chase, label and hand-over work offline and sync.
      source: contracts/satellite/fnb.yaml#chaseStation | contracts/satellite/fnb.yaml#printOrderLabel
    consistency:
    - with: KIT-007
      note: An order assembled here moves to Ready for pickup on the guest board.
    - with: POS-029
      note: The till's queue shows the same ready orders.
    sampleData:
      card: BNG-004131 · Takeaway · Aisha Rahman — Grill ✓, Bar ✓, Fryer missing (6 min) → Chase
      label: 'BNG-004131 · Aisha Rahman · 1 × Loaded Fries · 1 × Smash Burger (no onions) · CONTAINS: gluten, milk, sesame'
    corrections:
    - what: The layout repeats the station rail (course number, status text field, "Every kitchen ticket", Bump).
