      source: F51 step 4 | contracts/satellite/retail.yaml#collectShopAndDrop
      status: fixed
      by: CHG-CLN-005
    - what: 'Plumbing: "Outlet id" and "Category id" boxes, a stock table (onHand, inventoryItemId, variantId), and modals
        collecting variantId and seatIds.'
      why: Guest kiosk; the guest projection carries none of these.
      source: screens/P05-guest-kiosk.yaml#KSK-017 | contracts/satellite/retail.yaml#/components/schemas/GuestMerchandiseItem
      status: fixed
      by: CHG-SGU-018
    decisions:
    - question: 'The size picker: GuestMerchandiseItem has no size or variant dimension. Is each size a separate item, as
        with SKUs like TSH-MB-GRN-M?'
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw size buttons that switch between sibling
        items.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-057 | CHG-NOTE-004
      questionSource: contracts/satellite/retail.yaml#/components/schemas/GuestMerchandiseItem
  EMP-003:
    summary: 'The screen a staff handheld sits on between tasks, and for a restaurant host or server it is the start of
      every service. It must be a role-based home: what this person needs now (open incidents first, then their own work)
      with the navigation filtered to their role, so a server sees the floor, their tables, reservations and the waitlist
      and not 50 unrelated destinations. The one thing to get right: it is a home and a launcher, not a till. It reads the
      current shift and the open incidents and moves no money.'
    inputs:
    - field: Role and venue in force
      rule: 'Comes from the session (sign-in, then venue and role on EMP-002). Nothing on this screen asks for a workstation,
        shift or venue id. One person per session on a device: a second person cannot sign in over an active session; they
        sign out or suspend first. Show the signed-in name and role in the header at all times, because handhelds are shared
        at a restaurant pass.'
      source: F64 step 4 | DI-245 | DI-227 | screens/P06-staff-app.yaml#EMP-003
    outputs:
    - element: Order of the home
      rule: 'Open incidents surface before anything else (yesterday''s unresolved problem before today''s first task), then
        the role''s work. For a host or server in an outlet that runs table service, the work block is a compact service
        strip: my tables by status (Vacant, Occupied, Bill requested, Reserved), the next arrivals, and the waitlist count,
        each a tap into EMP-052, EMP-054 and EMP-056. For other roles the strip is their tasks and work orders.'
      source: F64 step 4 | DI-227 | DI-335 | DI-792
    - element: Navigation set
      rule: Filtered by role and permission, and by the licensed modules (requiresModule fnb on every restaurant screen).
        A server sees Floor, My tables, Reservations, Waitlist, Notifications, Clock in/out, Venue map, Profile. Restaurant
        set-up (Table & seating configuration) appears only for a role that holds the configure permission. Group the restaurant
        destinations under one Restaurant heading rather than ten peer tiles copied from the client board.
      source: DI-227 | DI-228 | DI-400 | contracts/satellite/fnb.yaml#setTableLayout
    - element: Offline strip
      rule: Last synced view with its age; the pending count is always current because it is local. Tapping it opens the
        sync screen. Restaurant actions that are offline-capable (seat, order, move) stay enabled; the ones that are not
        (merge, close and settle) are shown disabled with the reason.
      source: screens/P06-staff-app.yaml#EMP-003 | F08 step 4 | DI-072 | F29 step 2
    - element: Kitchen calls
      rule: When the pass calls this server (food ready, guest waiting, bill requested, assistance, allergy query), it lands
        here as a notification with the table code, not as a broadcast to the room. With no server assigned, the call goes
        to the outlet's supervisor on duty.
      source: contracts/satellite/fnb.yaml#notifyServer | R125 | F29 step 4
    edgeCases:
    - case: Tenant licenses F&B but not maintenance
      expected: 'The home must still load: today it is gated on the maintenance module, which would leave a restaurant-only
        tenant with no home. Draw the home without the incident block when maintenance is not licensed.'
      source: screens/P06-staff-app.yaml#EMP-003 | F94 step 1
    - case: Server's shift changes mid-service with tables still open
      expected: The home shows a "You still have 3 open tables" banner before the person clocks out, linking to the table
        sheet (EMP-058) to change server.
      source: F08 step 8 | F29 step 6 | contracts/satellite/fnb.yaml#reassignServer
    consistency:
    - with: EMP-002
      note: The role picked there drives this home; the same role names.
    - with: EMP-052
      note: The service strip uses the same status names and colours as the floor plan.
    - with: EMP-037
      note: Kitchen calls (notify server) are the same notification items as the notifications list.
    sampleData:
      signedIn: Priya Nair · Server · Oasis Bistro dinner service
      incidents:
      - INC-2026-0412 · Spill near Terrace bar · Medium · Open
      myTables:
        vacant: 2
        occupied: 4
        billRequested: 1
        reserved: 1
      nextArrivals:
      - 19:30 Daniel Brooks · 2
      - 20:00 Fatima Al Suwaidi · 6 · nut allergy
      waitlist: 3 parties waiting
      kitchenCall: T12 · Food ready · 20:41
      pendingSync: 2 waiting to sync · last synced 20:38 GST
    corrections:
    - what: 'Remove the till and cash-shift writes from the home: openShift, closeShift, suspendShift, resumeShift, reopenShift,
        approveShiftOpen, acceptShiftVariance, recordNoSale, and the "Every cash movement" and "Every shift" data tables.'
      why: Bulk-attach residue. The screen's own notes removed createCashMovement because "a screen that does not handle
        money should not be able to move it", and the same reasoning applies to the rest. A variance is accepted on the
        till by a supervisor (R080(e)), not from a phone home screen. F08 step 4 and F64 step 4 need only getCurrentShift
        and listIncidents.
      source: R254 | R080 | F08 step 4 | F64 step 4 | screens/P06-staff-app.yaml#EMP-003
      status: fixed
      by: CHG-WIR-008
    - what: The pattern approvalInbox, driven by approveShiftOpen, and the empty state "Nothing is waiting, which is the
        good outcome" are wrong for a home.
      why: The purpose is "the screen the device sits on between tasks". It is a role dashboard and launcher, not a decision
        queue.
      source: DI-227 | screens/P06-staff-app.yaml#EMP-003
      status: fixed
      by: CHG-WIR-008
    - what: requiresModule maintenance should be core.
      why: Every staff member's home is gated on the maintenance licence today. A tenant that licenses only F&B would have
        no home.
      source: screens/P06-staff-app.yaml#EMP-003 | F94 step 1
    - what: 'Module placement: EMP-003 is the generic staff-app home (module Operations) and belongs to the core staff-app
        process. The F&B process contributes only the restaurant service strip and the restaurant navigation group, which
        is how it should be listed.'
      why: Its operations are shift and incident operations, and its flows (F08, F64) are steward flows. Placing it under
        F&B will make the restaurant design own a screen every role uses.
      source: F08 step 4 | F64 step 4 | DI-227
    - what: Filter fields with plumbing labels ("Severity", "Status" as free text fields, an "Is reportable" toggle) should
        be chips with the incident vocabulary, or removed from the home.
      why: The home shows the open incidents; filtering belongs on the incident list.
      source: screens/P06-staff-app.yaml#EMP-003 | contracts/satellite/maintenance.yaml#listIncidents
    decisions:
    - question: Which roles are the restaurant roles on the staff app (host, server, captain or supervisor), and which of
        the restaurant destinations does each see?
      decision: 'Drawn default stands (answer: "Host and Server variants; a supervisor sees both"): Draw two variants. The
        host sees Floor, Reservations, Waitlist and New reservation. The server sees Floor filtered to My tables, the table
        sheet and the bill. The supervisor sees both, plus Performance and Configuration.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-198 | CHG-NOTE-004
      questionSource: DI-227 | TRACKER Workshops/Actions row 89
  EMP-009:
    summary: 'End the person''s shift cleanly: push anything unsynced, hand over what is still open, then close. For a restaurant
      server, ending a shift means handing their open tables to another server and clocking out. Only a person who holds
      a till also does the blind cash count. The one thing to get right: the count is blind, and the variance is accepted
      by a supervisor, never by the cashier whose shift it is.'
    inputs:
    - field: Counted cash
      rule: One line per denomination, UAE notes 5 to 1000 AED and coins 25 fils, 50 fils and 1 AED, entered as quantities
        with the line total computed (count times face value). The expected figure is never on screen before submission.
        A duplicate or inactive denomination is refused, and so is a total that disagrees with the count.
      source: contracts/spine/shift.yaml#closeShift | R229 | R080 | MATRIX 5.9.2
    - field: Open tables to hand over (server)
      rule: Each open table this server holds is listed with a "Change server" picker defaulting to the section's incoming
        server. Reason "Shift change" is preset. Gratuity split follows the assignment. Nothing closes silently.
      source: F08 step 8 | F29 step 6 | contracts/satellite/fnb.yaml#reassignServer | contracts/satellite/fnb.yaml#transferTableVisit
    - field: Supervisor acceptance
      rule: Shown only when the close result says the variance needs acceptance. A supervisor enters their own PIN on this
        device and a reason of at least 3 characters. The cashier whose shift it is cannot accept (approver-is-cashier).
      source: contracts/spine/shift.yaml#acceptShiftVariance | R080 | R094
    outputs:
    - element: Close result
      rule: After submission, the expected, counted and variance figures, with negative shown as "short" and positive as
        "over". Within the venue threshold (proposed AED 20.00) the shift is closed. Above it, the shift waits for a supervisor
        ("Waiting for supervisor") and the screen says so plainly.
      source: contracts/spine/shift.yaml#closeShift | R094
    actions:
    - action: Close shift
      result: Online only; offline the button is disabled with "Closing needs a connection; your count is kept". A 409 for
        open orders lists the open orders or tables that must be settled or handed over first.
      source: contracts/spine/shift.yaml#closeShift | F72 step 2 | screens/P06-staff-app.yaml#EMP-009
    edgeCases:
    - case: No supervisor present to accept a variance above threshold
      expected: Draw the "Waiting for supervisor" state. Whether the cashier may sign out with it pending is still open
        (DI-805).
      source: DI-805 | TRACKER 30-Sep/Tracker row 30
    - case: Shift forgotten
      expected: Auto-closed after the venue limit and labelled "Auto-closed (not counted)", not "Closed".
      source: F08 step 8 | MATRIX 5.9.5
    - case: A server on a handheld
      expected: No cash is taken on a handheld; cash goes to a till. The server's End shift has no cash count.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    sampleData:
      cashier: Omar Ziad · Oasis Bistro bar till 2
      count:
        '1000': 0
        '500': 1
        '200': 4
        '100': 6
        '50': 8
        '20': 11
        '10': 9
        '5': 6
        1 AED: 13
        50 fils: 6
        25 fils: 4
      countedTotal: AED 2,128.00
      result:
        expected: AED 2,140.50
        variance: AED -12.50 short
        status: Closed (within AED 20.00)
      handover:
      - T12 · 4 covers · AED 620.24 open → Khalid Al Mansoori
      - T7 · 2 covers · AED 188.00 open → Khalid Al Mansoori
    corrections:
    - what: Remove openShift, approveShiftOpen, recordNoSale, resumeShift, reopenShift and createCashMovement from End shift.
      why: Bulk-attach. An end-of-shift screen does not open a shift, approve an opening float or open the drawer. F72 step
        3 needs closeShift, acceptShiftVariance and listCashMovements.
      source: R254 | F72 step 3 | F08 step 8
      status: fixed
      by: CHG-WIR-008
    - what: Pattern approvalInbox with "Waiting for a decision" over cash movements.
      why: Lifts and adds are not decisions waiting for anybody. The screen is a close-out sequence (sync, hand over, count,
        result).
      source: screens/P06-staff-app.yaml#EMP-009 | F72 step 3
    - what: acceptShiftVariance has only a reason in its request, with no supervisor step-up field.
      why: R080(e) and the operation's own description require a supervisor PIN step-up on the same device. reopenShift
        carries a supervisorStepUp object for the same kind of control.
      source: R080 | R144 | contracts/spine/shift.yaml#acceptShiftVariance | contracts/spine/shift.yaml#reopenShift
      status: fixed
      by: CHG-WIR-008
    - what: F08 step 8 has the steward end the shift with closeShift, and F72 step 3 has the supervisor close it ("closing
        and accepting a variance are supervisor acts"). closeShift is the cashier's own blind count.
      why: The flows contradict each other on who closes. A steward or server with no till cannot submit a count, because
        countedCash needs at least one line.
      source: F08 step 8 | F72 step 3 | contracts/spine/shift.yaml#closeShift
      status: fixed
      by: CHG-FIN-003
    - what: No hand-over of open tables and no clock-out on End shift, though F08 says "tasks reassigned, never silently
        closed" and DI-492 asks for shift closing on the employee app.
      why: For a server, the hand-over of open tables (reassignServer) and clock-out (recordAttendance on EMP-024) are what
        ending a shift means.
      source: F08 step 8 | DI-492 | contracts/satellite/workforce.yaml#recordAttendance
    - what: Module placement. EMP-009 is a core staff-app or till screen, not F&B.
      why: Its operations are the shift contract. F&B adds only the open-table hand-over step.
      source: TRACKER Workshops/Actions row 63 | F72 step 3
    decisions:
    - question: Does a server on a handheld ever hold cash (a payment taken in cash at the table on EMP-059), and if so, against
        whose drawer?
      decision: 'No cash on handhelds: a server''s handheld takes no cash payment; cash goes to a till. The server''s End
        shift has no cash count.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-200 | CHG-NOTE-004
      questionSource: contracts/spine/orders.yaml#createPayment | DI-805
  EMP-008:
    summary: 'A read-only summary of what this person did on their shift, read before the shift is closed by someone else.
      From the F&B angle the person is a server or a bar cashier. The bar cashier holds a till and has a cash shift. The
      server mostly does not, and wants covers, tables, sales and tips. The one thing to get right: it never reveals the
      cash figure that the blind close count is measured against.'
    inputs:
    - field: Which shift
      rule: The caller's own current shift from the session by default. Earlier shifts come from a short "My recent shifts"
        list (date and outlet), not from Workstation id, Status and Opened from/to text fields.
      source: F72 step 1 | contracts/spine/shift.yaml#getCurrentShift | contracts/spine/shift.yaml#listShifts
    outputs:
    - element: Cash figures
      rule: 'Before the close count has been submitted, show only counts and non-cash facts: number of sales, refunds, no-sales,
        lifts made and the times. Do not show the opening float plus sales, the lift totals or any total from which the
        expected cash in the drawer can be worked out. After the count, the expected, counted and variance figures may appear,
        read-only.'
      source: R080 | POSV2-3 | MATRIX 5.9.2 | DI-806 | contracts/spine/shift.yaml#/components/schemas/Shift
    - element: Unreconciled marker
      rule: Offline, local totals are shown and marked "Not yet synced, may change".
      source: screens/P06-staff-app.yaml#EMP-008 | F72 step 2
    - element: Exceptions
      rule: Shift incidents (no-sales, manager overrides) listed with time and reason, so the person sees what a reviewer
        will see.
      source: contracts/spine/shift.yaml#/components/schemas/Shift
    - element: Service summary (a server without a till)
      rule: Covers, tables, sales and tips for the server's service; no cash figures.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    sampleData:
      person: Omar Ziad · Bar cashier · Oasis Bistro bar till 2
      shift: Thu 15 Oct 2026 · 16:00 to 23:30 GST · Open
      sales: 64 sales · 3 refunds
      noSales: 2 (Change for guest 18:12; Till check 21:40)
      lifts: 1 safe drop at 20:15 · bag 004417
      afterCount:
        expected: AED 2,140.50
        counted: AED 2,128.00
        variance: AED -12.50 short
    corrections:
    - what: Remove "Suspend shift" (suspendShift) from the shift summary.
      why: F72 step 1 declares this screen read-only, because "the person being reviewed could sign off their own review".
        Suspending is the break mechanism and belongs on the till or the home, not on the summary.
      source: F72 step 1 | R254 | contracts/spine/shift.yaml#suspendShift
      status: fixed
      by: CHG-WIR-008
    - what: The summary shows openingFloat, salesTotal, refundsTotal and liftsTotal while the shift is open, which lets
        the cashier work out the expected cash before the blind count.
      why: Blind close (R080(e)). POSV2-3 removed "Expected in drawer", and whether the cashier sees expected sales at all
        is still open with the client (DI-806).
      source: R080 | POSV2-3 | DI-806 | TRACKER Workshops/Actions row 276
      status: fixed
      by: CHG-WIR-008
    - what: There is no source for a server's own summary (covers served, tables closed, sales by server, gratuity). The
        Shift record is a till (workstation) shift, so a server with no till sees an empty screen.
      why: Tips and sales attribution follow the server (transferTableVisit, reassignServer), and the matrix asks for waiter
        assignment for tips. No operation reads them back per person.
      source: contracts/satellite/fnb.yaml#reassignServer | contracts/satellite/fnb.yaml#transferTableVisit | MATRIX 4.9.7
    - what: 'Module placement: EMP-008 is a core staff-app or till screen (module Operations, requiresModule core), not
        an F&B screen.'
      why: Its data is the cash shift. F&B uses it only for bar and counter staff who hold a till. The tracker already asked
        to consolidate shift-closing and till-closing screens.
      source: TRACKER Workshops/Actions row 63 | F72 step 1
    - what: Raw data tables "Every shift" and "Every cash movement" with id, scopePath, currencyScale and principalId columns.
      why: Plumbing on a user's screen. The person reads their own shift, in words.
      source: screens/P06-staff-app.yaml#EMP-008
    decisions:
    - question: Does a server without a till get a shift summary (covers, sales, tips), and from which source?
      decision: 'A server without a till gets a service summary: covers, tables, sales, tips.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-199 | CHG-NOTE-004
      questionSource: MATRIX 4.9.7 | DI-492
  EMP-030:
    summary: 'Staff help a guest find a place: an outlet that is open now, a gate, toilets, the way to a lounger. From the
      F&B angle it answers "where can this guest eat right now, and how long is the wait", and, for a runner, "where is
      lounger B-14". The one thing to get right: an outlet that has closed must not be shown as open, because the map would
      send a guest to a locked door.'
    outputs:
    - element: Outlets on the map
      rule: Only outlets open now by default, each with its name, kind (restaurant, counter, bar), wait in minutes and how
        it takes orders ("Table service", "Order at counter", "Order in app for collection"). Closed outlets are greyed
        with their opening time, never hidden while the "Show closed" filter is on.
      source: contracts/satellite/fnb.yaml#listDiningOutlets | F70 step 2 | contracts/satellite/venue-map.yaml#getVenueMapLive
    - element: Delivery locations (runner view)
      rule: 'A search by location label (lounger, cabana, seat) giving the zone and the walk time. Unserviceable locations
        show their reason. These are delivery points, not bookable restaurant tables: dining tables never appear on the
        venue map.'
      source: contracts/satellite/fnb.yaml#listDeliveryLocations | contracts/satellite/fnb.yaml#createTableReservation
    edgeCases:
    - case: No signal in the middle of the park
      expected: The cached map and the text list of zones still work; live waits and closures are greyed with "as of 14:05".
      source: screens/P06-staff-app.yaml#EMP-030 | contracts/satellite/venue-map.yaml#getVenueMap
    sampleData:
      outlets:
      - name: Oasis Bistro
        kind: Restaurant
        zone: Main Plaza
        order: Table service
        wait: 15 min
        open: 12:00 to 23:00
      - name: Bite & Go
        kind: Counter
        zone: Wave Pool
        order: Order at counter
        wait: 5 min
      - name: Lagoon Bar
        kind: Bar
        zone: Lazy River
        state: Closed
        opens: '16:00'
      deliveryLocation:
        label: Lounger B-14
        zone: Wave Pool beach
        walk: 4 min
        servedBy: Bite & Go
    corrections:
    - what: listDiningOutlets and listDeliveryLocations are guest-audience operations with no permission, and they are listed
        as unpermissioned on the staff app.
      why: A staff screen calling guest operations bypasses the staff permission model. A staff-audience read, or the venue-map
        live state, is needed.
      source: contracts/satellite/fnb.yaml#listDiningOutlets | contracts/satellite/fnb.yaml#listDeliveryLocations
      status: fixed
      by: CHG-WIR-008
    - what: getVenueMapLive is declared and reaches no component (the screen's own gap).
      why: F70 step 2 depends on it for closures and queues, so the map otherwise shows an outlet that shut an hour ago.
      source: F70 step 2 | screens/P06-staff-app.yaml#EMP-030
    - what: '"Ordering method" free-text filter and the "Every dining outlet" and "Every delivery location" data tables
        with outletId, menuId, imageAssetRef and servingOutletIds columns.'
      why: Plumbing on a user's screen. Ordering method is a chip, and the lists are map pins and a search.
      source: screens/P06-staff-app.yaml#EMP-030
      status: fixed
      by: CHG-WIR-008
    - what: requiresModule ticketing, and module placement under F&B.
      why: The venue map is a core wayfinding screen (venue-map contract). Gating it on ticketing hides it from an F&B-only
        tenant, and F&B only adds the dining layer.
      source: screens/P06-staff-app.yaml#EMP-030 | DI-228
    - what: The purpose "Find a gate, an exit or a colleague" has no operation for colleagues.
      why: Nothing on the screen reads staff locations. Drop "or a colleague", or add the source.
      source: screens/P06-staff-app.yaml#EMP-030
  EMP-051:
    summary: 'The restaurant host''s and floor manager''s command centre for one service: how full the room is now, who
      arrives next, who is waiting, and what is stuck in the kitchen, at a glance on a handheld or tablet. Every tile drills
      into the screen that acts on it (floor plan, reservations, waitlist, table sheet). The one thing to get right: it
      compares what is booked with what is actually free, because those differ all evening.'
    inputs:
    - field: Outlet and service
      rule: The outlet comes from the person's shift or role. A user who works several outlets gets a picker by outlet name
        (Oasis Bistro, Terrace Grill), never an "Outlet id" text field. The date defaults to today in the venue's time zone
        (GST), with no free date picker on the live view.
      source: contracts/satellite/fnb.yaml#listTableReservations | screens/P06-staff-app.yaml#EMP-051
    outputs:
    - element: Room now
      rule: Covers seated against capacity, and tables by status (Vacant, Occupied, Bill requested, Reserved) in the floor-plan
        colours, from the live table map.
      source: contracts/satellite/fnb.yaml#getTableMap | DI-792 | DI-336
    - element: Next arrivals
      rule: 'Bookings in the next 60 minutes, ordered by time: name, party size, allergy marker from the booking notes,
        Confirmed or Booked, and a "Seat" shortcut into the table sheet. Late or no-show bookings are flagged once the grace
        period passes.'
      source: contracts/satellite/fnb.yaml#listTableReservations | contracts/satellite/fnb.yaml#seatTableReservation
    - element: Kitchen
      rule: A count of this outlet's table-service orders by kitchen state (In preparation, Ready and not yet served), with
        "Ready and not yet served" emphasised because food waiting goes out cold. Counts, not the "Every F&B order" table.
      source: contracts/satellite/fnb.yaml#listFnbOrders | contracts/satellite/fnb.yaml#notifyServer
    sampleData:
      outlet: Oasis Bistro · dinner service · Thu 15 Oct 2026
      roomNow:
        coversSeated: 38
        capacity: 64
        vacant: 5
        occupied: 9
        billRequested: 2
        reserved: 1
      nextArrivals:
      - 19:30 Daniel Brooks · 2 · Confirmed
      - 20:00 Fatima Al Suwaidi · 6 · Booked · nut allergy
      - 20:15 Aisha Rahman · 4 · Confirmed
      waiting: 3 parties · longest 22 min
      kitchen:
        inPreparation: 7
        readyNotServed: 2
    corrections:
    - what: '"Outlet id" text field, a free Date picker, raw data tables "Every table reservation" and "Every F&B order"
        with id, subjectId, salesOrderId and kitchenTicketId columns, and a "Confirm" primary button with no operation.'
      why: Plumbing on a user's screen. A command centre shows counts and the next things to act on.
      source: screens/P06-staff-app.yaml#EMP-051
    - what: The waiting-list tile has no source. There is no operation that lists an outlet's waitlist.
      why: The fnb contract has POST /waitlist and the quote, notify and leave actions, but no GET of the entries, so neither
        this tile nor EMP-056 can show who is waiting.
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist | DI-337
    - what: listFnbOrders is not offline-capable while the screen's offline state says "works from cache".
      why: The kitchen tile must show "as of" when offline rather than imply live data.
      source: contracts/satellite/fnb.yaml#listFnbOrders | screens/P06-staff-app.yaml#EMP-051
    - what: Reading the reservations needs ORDER_MODIFY.
      why: A read gated on a modify permission keeps a view-only manager off the command centre. A view permission would
        fit.
      source: contracts/satellite/fnb.yaml#listTableReservations
  EMP-052:
    summary: 'The live floor plan a host and the servers work from: a graphical, to-scale picture of each dining hall, with
      every table drawn in its real shape and seat count, coloured by status, and tagged when the guest is a VIP. Tapping
      a table opens its table sheet. The one thing to get right: the client''s four-status flow and nothing else on the
      map. No cleaning or "needs clearing" colour.'
    inputs:
    - field: Hall
      rule: Tabs per dining area (Main Hall, Terrace, Majlis), from the table zones, in the outlet's order. Swipe between
        halls on a handheld.
      source: DI-793 | DI-335 | contracts/satellite/fnb.yaml#/components/schemas/TableMap
    - field: Status filter
      rule: Chips Vacant, Occupied, Bill requested and Reserved, combinable. Filtering dims the other tables rather than
        removing them, so the room keeps its shape.
      source: DI-792 | screens/P04-point-of-sale.yaml#POS-028
    - field: My tables
      rule: A toggle that dims every table not assigned to the signed-in server. On by default for the server role, off
        for the host.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableState | DI-227
    outputs:
    - element: Table shape
      rule: Drawn from the table's shape (round, square, rectangle, booth, bar) and position, to scale, with one chair mark
        per seat, so a 2-seat and a 4-seat table are visibly different. The table code (T12) is unique in the venue and
        always readable.
      source: DI-104 | DI-793 | R108 | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    - element: Status colour
      rule: Vacant, Occupied (seated or ordered), Bill requested and Reserved, plus Table closed (paid) per the client's
        flow. The colour is always paired with a label or icon, never colour alone. A table out of service is hatched grey
        with "Not in use", outside the status colours.
      source: DI-336 | DI-792 | contracts/satellite/fnb.yaml#/components/schemas/TableStatus
    - element: Table detail on the tile
      rule: Covers against seats ("3/4"), minutes since seated, the server's initials, and on Bill requested the bill total
        in AED with 2 decimals. The VIP tag shows as a small badge.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableState | DI-335
    - element: Combined tables
      rule: Tables seated together for one party (a combination or a merged visit) are drawn with one outline around them
        and one status.
      source: contracts/satellite/fnb.yaml#setTableCombinations | contracts/satellite/fnb.yaml#mergeTableVisits
    actions:
    - action: Tap a table
      result: Opens the table sheet (EMP-058). On a vacant table the sheet opens on "Seat" with the covers stepper (cashier
        picks the table, then enters covers). On an occupied table it opens on the visit.
      source: DI-104 | F29 step 1
    edgeCases:
    - case: Offline on the terrace
      expected: The map stays usable from the cache with an "Offline, as of 20:31" strip. Seating and orders queue, and
        statuses changed by others are not seen until sync.
      source: contracts/satellite/fnb.yaml#getTableMap | DI-071 | DI-072
    - case: A booking with no table assigned
      expected: 'A table shows Reserved when the booking names it, or from N minutes (the venue''s setting) before a pre-allocated
        booking. Otherwise the next arrivals show in a side strip ("Next: 20:00 Al Suwaidi · 6").'
      source: contracts/satellite/fnb.yaml#createTableReservation | DI-689 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    consistency:
    - with: POS-028
      note: Same halls, same table glyphs, same status names, colours and filter chips (the v2 till has Main Hall, Terrace
        and Majlis rooms with vacant, occupied, bill requested and reserved). The two must read as one floor plan.
    - with: EMP-053
      note: Draws exactly what the configuration saved, the same shapes and positions.
    - with: EMP-058
      note: The tap target. Move and merge stay there (off POS-028 until after r2).
    sampleData:
      halls:
      - Main Hall
      - Terrace
      - Majlis
      tables:
      - code: T1
        shape: square
        seats: 2
        status: Vacant
      - code: T4
        shape: rectangle
        seats: 4
        status: Occupied
        covers: 3
        seatedMin: 42
        server: PN
      - code: T7
        shape: square
        seats: 4
        status: Bill requested
        covers: 4
        bill: AED 620.24
        server: KM
      - code: T9
        shape: round
        seats: 6
        status: Reserved
        booking: 20:00 Al Suwaidi · 6
      - code: M2
        shape: booth
        seats: 8
        status: Occupied
        covers: 7
        vip: true
        hall: Majlis
      - code: T15
        shape: square
        seats: 2
        state: Not in use (damaged leg)
    corrections:
    - what: TableStatus has needsClearing. closeTableVisit moves the table to needsClearing ("clearing is a separate act
        by a separate person"), getTableMap describes "needs clearing", and states/table.yaml says needsClearing exists
        so a paid table is not immediately sellable.
      why: The client decided that the flow is Available, Ordered, Table Closed and Reserved, with no cleaning status, because
        cleaning is a manual task deliberately left out. Rename it to the client's "Table closed" (or return the table to
        free on close) and drop the clearing wording, including clearTable's "Mark a table cleared".
      source: DI-336 | TRACKER Workshops/Actions row 89 | contracts/satellite/fnb.yaml#closeTableVisit | contracts/satellite/fnb.yaml#/components/schemas/TableStatus
    - what: TableStatus also has outOfService and seated, which are not in the client's four statuses.
      why: 'outOfService is a configuration flag (isOutOfService: damaged, or the section is closed), not a service status.
        Draw it as "Not in use", outside the status colours and filters, and confirm with the client. seated is drawn under
        Occupied.'
      source: DI-336 | DI-792 | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    - what: TableDefinition has only position x and y. There is no size, rotation or hall outline (walls, pillars, bar counter),
        so the plan cannot be drawn to scale.
      why: The client asked for a realistic, to-scale floor plan of the actual halls.
      source: DI-793 | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    - what: No customer-category or VIP tag on the table, the visit or the reservation.
      why: The client asked for tables tagged with a customer category so staff prioritise service. Only the kitchen SLA
        weights carry a VIP signal.
      source: DI-335 | contracts/satellite/fnb.yaml#/components/schemas/TableState
    - what: TableState carries no service stage and no server display name (only serverPrincipalId).
      why: setServiceStage calls itself "the floor plan colour that tells a manager everything", and the map cannot show
        it without a field. The tile needs the server's name or initials, not an id.
      source: contracts/satellite/fnb.yaml#setServiceStage | contracts/satellite/fnb.yaml#/components/schemas/TableState
    - what: '"Save table layout" (setTableLayout, PRODUCT_CONFIGURE) with a modal collecting tables, plus the leftover search
        field, card list and "Confirm" button.'
      why: Configuration on the live service map. Layout editing is EMP-053 (and BO-729, BO-044, POS-024), and F80 says
        configuration does not work offline while service does.
      source: F94 step 1 | R254 | screens/P06-staff-app.yaml#EMP-052
      status: fixed
      by: CHG-WIR-008
    - what: The pattern statusTracker ("reads one record") and an empty state that offers nothing.
      why: The floor plan is a spatial board of many tables. With no tables configured, the empty state points a manager
        to Table & seating configuration.
      source: screens/P06-staff-app.yaml#EMP-052
    decisions:
    - question: Does "Table closed" persist after payment until someone resets the table (which acts like the cleaning status
        DI-336 excluded), or does a paid table go straight back to Vacant?
      decision: 'Drawn default stands (answer: "A short ''Table closed'' state, then ''Make available''"): Draw "Table closed"
        as a short-lived state with a one-tap "Make available" on the tile. Avoid "clean", "clear" and "reset" wording.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-201 | CHG-NOTE-004
      questionSource: DI-336 | contracts/satellite/fnb.yaml#clearTable
    - question: 'When does a table show Reserved, given the host normally allocates the table at seating (DI-689)? Options:
        only when the booking names a table, or from N minutes before a pre-allocated booking.'
      decision: A table shows Reserved when the booking names it, or N minutes (venue-set) before a pre-allocated booking.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-202 | CHG-NOTE-004
      questionSource: DI-689 | DI-336 | contracts/satellite/fnb.yaml#createTableReservation
  EMP-053:
    summary: 'Where a restaurant manager lays out the room: tables drawn on each hall in their real shape, seats and position,
      grouped into sections with a server each, with the pairs of tables that can be pushed together. It is configuration
      done before service, not during it. The one thing to get right: a drag-and-drop floor-plan editor whose output is
      the same picture the live map (EMP-052) and the till (POS-028) draw, not a form of x and y numbers.'
    inputs:
    - field: Table code
      rule: Short code such as T12, up to 32 characters, unique across the whole venue (all outlets). A duplicate is refused
        at once with "T12 is already used in Lagoon Bar".
      source: R108 | contracts/satellite/fnb.yaml#createTable
    - field: Seats
      rule: Whole number of at least 1, set with a stepper. The glyph redraws with that many chairs. A change is refused
        while a party is seated at the table, with "Table T12 has an open table now. Change it after they leave."
      source: contracts/satellite/fnb.yaml#updateTable | contracts/satellite/fnb.yaml#setTableLayout | DI-104
    - field: Shape
      rule: Picked visually, not typed, from Round, Square, Rectangle, Booth and Bar seat.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableDefinition | DI-793
    - field: Hall
      rule: The dining area the table sits in (Main Hall, Terrace, Majlis). Drag the table between hall tabs or pick the
        hall.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableDefinition | DI-793
    - field: Position
      rule: Set by dragging on the canvas with a snap grid. Never typed coordinates.
      source: DI-793 | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    - field: Out of service
      rule: Toggle "Not in use (damaged or section closed)". The table stays on the plan, greyed, and cannot be seated.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    - field: Sections
      rule: Lasso tables into a named section and assign a server, per service period (lunch with three sections, Friday
        dinner with five). Every table belongs to at most one section in a period.
      source: contracts/satellite/fnb.yaml#setSectionLayout | F94 step 1
    - field: Combinations
      rule: Pick two or more tables and give the covers they seat together and the set-up minutes (default 5). Declared
        by the manager, not inferred from adjacency, because a pillar or a step can stop two neighbours combining.
      source: contracts/satellite/fnb.yaml#setTableCombinations | F29 step 2
    actions:
    - action: Save layout
      result: Saves the whole outlet in one write. If someone else saved meanwhile (412), say "The layout changed on another
        device. Reload to see it before saving." and keep the edits on screen. Online only; offline the editor is read-only.
      source: contracts/satellite/fnb.yaml#setTableLayout | F94 step 1
    consistency:
    - with: BO-729
      note: The back-office Create / Edit Outlet edits the same tables and sections. One editor component, one vocabulary.
    - with: POS-024
      note: The till's Outlet Setup writes the same layout and combinations.
    - with: EMP-052
      note: Renders exactly what is saved here.
    sampleData:
      outlet: Oasis Bistro
      halls:
      - Main Hall
      - Terrace
      - Majlis
      tables:
      - code: T6
        seats: 4
        shape: Square
        hall: Main Hall
      - code: T7
        seats: 4
        shape: Square
        hall: Main Hall
      - code: T9
        seats: 6
        shape: Round
        hall: Main Hall
      - code: M2
        seats: 8
        shape: Booth
        hall: Majlis
      - code: TR3
        seats: 2
        shape: Square
        hall: Terrace
        outOfService: true
      sections:
      - Dinner · Section A (T1 to T6) · Priya Nair
      - Dinner · Section B (T7 to T12) · Khalid Al Mansoori
      combinations:
      - T6 + T7 seat 9 · 5 min set-up
    corrections:
    - what: Text fields labelled "id", "label", "capacity", "zone", "position" and "shape", bound to raw schema fields.
      why: Plumbing on a user's screen. The id is generated, position and shape are set on the canvas, and the labels must
        be Table code, Seats and Hall.
      source: screens/P06-staff-app.yaml#EMP-053
    - what: 'Three ways to write the same table: setTableLayout (the whole outlet, matching on id) and createTable or updateTable
        (one table).'
      why: Two write paths for one row means two conflict behaviours on one screen. Pick one per screen (the editor saves
        the whole layout) and say which.
      source: contracts/satellite/fnb.yaml#setTableLayout | contracts/satellite/fnb.yaml#createTable | contracts/satellite/fnb.yaml#updateTable
      status: fixed
      by: CHG-WIR-008
    - what: setTableCombinations (PRODUCT_CONFIGURE) sits on the live service screen EMP-058 and not here, even though it
        is configuration.
      why: It is declared before service and saved with the layout. During service the host only uses a combination when
        seating.
      source: contracts/satellite/fnb.yaml#setTableCombinations | F94 step 1 | F29 step 2
      status: fixed
      by: CHG-WIR-008
    - what: The board frame fnb-4c is claimed by both EMP-053 and EMP-060.
      why: A frame drawn once cannot be the design of two screens. One of the two mappings is wrong.
      source: screens/P06-staff-app.yaml#EMP-053 | screens/P06-staff-app.yaml#EMP-060
    - what: TableDefinition lacks table size and rotation, and the hall has no outline, so the editor cannot place tables
        to scale.
      why: DI-793 asks for a to-scale plan of the actual hall layout.
      source: DI-793 | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    decisions:
    - question: Is the floor-plan editor meant for a phone at all, or a tablet or back office only?
      decision: 'Drawn default stands (answer: "Tablet (landscape) + back office; read-only on a phone"): Draw it for a tablet
        in landscape. On a phone, show the plan read-only with an "Edit on a tablet or in Back Office" note.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-203 | CHG-NOTE-004
      questionSource: DI-793 | screens/P06-staff-app.yaml#EMP-053
  EMP-054:
    summary: 'The host''s book for the restaurant: who is coming, when, how many, and for how long, as a day timeline on
      a tablet and an agenda list on a phone, with week and month views for looking ahead. The one thing to get right: bookings
      are mostly not on a table until the party is seated, so the timeline shows covers over time and unassigned bookings,
      not a grid of tables that looks falsely full or empty.'
    inputs:
    - field: View and date
      rule: Day (default today), week, month and agenda. The day view runs in hours from the venue's day start hour, in
        GST. A phone opens on the agenda.
      source: DI-919 | contracts/satellite/fnb.yaml#listTableReservations
    - field: Outlet
      rule: From the shift. A picker by name only for users with several outlets.
      source: contracts/satellite/fnb.yaml#listTableReservations
    - field: Status filter
      rule: Chips for Booked, Confirmed, Awaiting deposit (only where the venue's deposit is on), Seated, No-show and Cancelled.
        Cancelled is off by default.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservationStatus | DI-1049
    outputs:
    - element: Booking bar or row
      rule: Time, then name, party size (with the actual party size once seated, "6 → 4"), duration as bar length, status
        chip, an allergy icon when the notes carry one, and a link icon when the booking is one of a group across tables.
        Contact number on tap only.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservation | F29 step 1
    - element: Covers per slot
      rule: A small histogram of booked covers per 15-minute slot against the outlet's seats, so the host sees where the
        evening is tight.
      source: contracts/satellite/fnb.yaml#listTableReservations | contracts/satellite/fnb.yaml#getFnbReservationPolicy
    - element: No-show
      rule: Set by the system after the grace period, not by the host. Shown as "No-show" with a "Seat anyway" action if
        they turn up late.
      source: contracts/satellite/fnb.yaml#seatTableReservation | contracts/satellite/fnb.yaml#/components/schemas/TableReservationStatus
    edgeCases:
    - case: Two bookings on one table for the same hour
      expected: Flag the clash on both bookings with the options ranked by which party is easier to move (another table,
        earlier or later, combine, call the guest). The system never resolves it silently.
      source: contracts/satellite/fnb.yaml#resolveBookingConflict
    consistency:
    - with: EMP-055
      note: Tapping a slot opens New reservation prefilled with that time. Tapping a booking opens it for change.
    - with: EMP-058
      note: Seat on a booking opens the table sheet's seat step with the booking attached.
    sampleData:
      date: Thu 15 Oct 2026 · Oasis Bistro
      bookings:
      - time: '19:30'
        name: Daniel Brooks
        party: 2
        mins: 90
        status: Confirmed
      - time: '20:00'
        name: Fatima Al Suwaidi
        party: 6
        mins: 120
        status: Booked
        notes: Nut allergy (1 guest) · anniversary
      - time: '20:15'
        name: Aisha Rahman
        party: 4
        mins: 90
        status: Confirmed
      - time: '21:00'
        name: Khalid Al Mansoori
        party: 9
        mins: 150
        status: Booked
        tables: T6 + T7
      - time: '18:00'
        name: Omar Ziad
        party: 3
        status: No-show
    corrections:
    - what: listTableReservations takes a single date. Week and month views would need one call per day, and there is no
        status filter.
      why: DI-919 requires day, week, month and agenda views for every calendar. The read needs a date range.
      source: DI-919 | contracts/satellite/fnb.yaml#listTableReservations
    - what: '"Outlet id" text field, a free date picker, and the raw "Every table reservation" data table with id, outletId,
        subjectId and groupId columns.'
      why: Plumbing on a user's screen. The calendar view replaces the table.
      source: screens/P06-staff-app.yaml#EMP-054
    - what: The double-booking read (resolveBookingConflict, "Board 4D") is consumed by no screen, though this screen is
        the client's frame fnb-4d.
      why: An operation drawn for this board is not wired to it.
      source: contracts/satellite/fnb.yaml#resolveBookingConflict | screens/P06-staff-app.yaml#EMP-054
      status: fixed
      by: CHG-WIR-008
    - what: The host cannot cancel, move or change a booking from the calendar.
      why: updateTableReservation is guest-only and self-scoped (guestAuth). There is no staff operation to change or cancel
        a booking taken by phone.
      source: contracts/satellite/fnb.yaml#updateTableReservation | MATRIX 4.9.10
  EMP-055:
    summary: 'A host takes a booking, usually on the phone or at the podium: date and time, party size, guest name and contact,
      allergies and requests, and only optionally a table. While the name and number are typed, possible existing guests
      are proposed, so the restaurant does not create a second record for the same person. The one thing to get right: no
      table is committed by default and no deposit is asked for unless the venue has switched it on.'
    inputs:
    - field: Date and time
      rule: In the venue's time zone (GST), in slots of the outlet's interval. A time outside opening hours is refused with
        the hours shown.
      source: contracts/satellite/fnb.yaml#createTableReservation | DI-919
    - field: Party size
      rule: 'Whole number of at least 1. A refusal names the constraint: no table for this party size (offer combinations
        or another time) is a different message from the outlet being full at that time.'
      source: contracts/satellite/fnb.yaml#createTableReservation
    - field: Duration
      rule: Prefilled from the outlet's turn time for the party size. Editable by the host. It is what makes the second
        sitting bookable.
      source: contracts/satellite/fnb.yaml#getFnbReservationPolicy | contracts/satellite/fnb.yaml#/components/schemas/TableReservation
    - field: Guest name, mobile, email
      rule: 'Mobile in international format (+971 50 123 4567). As soon as a name plus a mobile or email is entered, matches
        appear under the fields: "Same mobile" ranks above "Similar name". Choosing one links the booking to that guest.
        Merging two records is not done here; it is done on the guest profile.'
      source: DI-808 | contracts/satellite/marketing-crm.yaml#matchGuest | contracts/satellite/marketing-crm.yaml#mergeGuests
    - field: Allergies and requests
      rule: Free text, shown on every later screen with an allergy icon. Prompt the host to ask about allergies.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservation
    - field: Table (optional)
      rule: Hidden behind "Request a specific table". By default the host allocates the table at seating. Where shown, recommend
        tables that fit the party, including declared combinations.
      source: DI-689 | DI-337 | contracts/satellite/fnb.yaml#createTableReservation | contracts/satellite/fnb.yaml#setTableCombinations
    - field: Deposit
      rule: Not shown at all while the venue's dining deposit is off (the default) or the party is below its threshold,
        and the confirmation then says no card is needed. When it applies, the booking is created "Awaiting deposit" with
        the amount, basis (per guest, per table or % of minimum spend), hold expiry (15 minutes), refund cut-off and late-cancel
        terms. It is paid through the till cart. Unpaid at expiry, the booking is cancelled.
      source: DI-1049 | REV3-8b | DI-1048 | R169 | contracts/satellite/fnb.yaml#/components/schemas/TableReservationDeposit
    - field: Seating preference and occasion
      rule: Seating area (indoor, terrace, majlis) and occasion (birthday, anniversary, business) are fields on the booking,
        not folded into the requests text.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Book table
      result: Creates the booking as Booked (or Awaiting deposit) and offers "Send confirmation" by SMS, WhatsApp or email,
        with an optional reconfirmation request.
      source: contracts/satellite/fnb.yaml#createTableReservation | contracts/satellite/fnb.yaml#sendBookingConfirmation
    edgeCases:
    - case: Offline at the podium
      expected: Booking is online only. Disable "Book table" with "Needs a connection" and keep the typed details.
      source: contracts/satellite/fnb.yaml#createTableReservation | DI-072
    consistency:
    - with: GST-070
      note: The guest-side Reserve a Table uses the same booking. Same status names and the same "no card needed" rule.
    - with: EMP-057
      note: The duplicate-match candidates look the same as on the guest profile, where the merge happens.
    sampleData:
      outlet: Oasis Bistro
      when: Thu 15 Oct 2026 · 20:00 GST · 120 min
      party: 6
      guest:
        name: Fatima Al Suwaidi
        mobile: +971 50 123 4567
        email: fatima.s@example.ae
      notes: Nut allergy (1 guest) · anniversary, quiet table if possible
      matches:
      - Fatima Al Suwaidi · same mobile · 4 visits
      - Fatima Alsuwaidi · similar name, same email
      depositWhenOn:
        amount: AED 50.00 per guest = AED 300.00
        holdUntil: 19:57 GST
        refundableUntil: Wed 14 Oct 20:00
    corrections:
    - what: createTableReservation is a guest operation (guestAuth, self-scoped to the subject, no permission). It is listed
        as unpermissioned on the staff app.
      why: A host booking for a caller is not the caller. The staff app needs a staff-audience create with a permission,
        which records who took the booking.
      source: contracts/satellite/fnb.yaml#createTableReservation
      status: fixed
      by: CHG-WIR-008
    - what: '"Edit" has no operation: updateTableReservation is guest-only.'
      why: The screen is Create / Edit, and the matrix asks for amendment and cancellation.
      source: contracts/satellite/fnb.yaml#updateTableReservation | MATRIX 4.9.10 | MATRIX 13.3.11
    - what: The form exposes id, outletId, subjectId, status, groupId, tableVisitId and actualPartySize as text fields,
        and the duplicate-match component is listed three times.
      why: Read-only and system fields on a user's form. One duplicate-match panel under the guest fields.
      source: screens/P06-staff-app.yaml#EMP-055
    - what: Neither sendBookingConfirmation ("Board 4E") nor getFnbReservationPolicy (the default duration) is wired to
        this screen, though this screen is the client's frame fnb-4e.
      why: The confirmation and reminder are what keep the no-show rate down, and the duration needs a default.
      source: contracts/satellite/fnb.yaml#sendBookingConfirmation | contracts/satellite/fnb.yaml#getFnbReservationPolicy
      status: fixed
      by: CHG-WIR-008
    - what: The deposit note says the deposit is adjusted against the final bill, and the Bill has no line for a deposit
        applied.
      why: DI-337 asks for the deposit to be adjusted against the final bill. See EMP-059.
      source: DI-337 | contracts/satellite/fnb.yaml#/components/schemas/Bill
    decisions:
    - question: Should a booking capture seating-area preference (indoor, terrace, majlis) and the occasion? The waitlist
        has seatingPreference and the reservation does not.
      decision: Seating preference and occasion are fields on a table booking.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-204 | CHG-NOTE-004
      questionSource: DI-791 | DI-337 | contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist
  EMP-056:
    summary: 'The host''s list of walk-in parties waiting for a table: add a party in a few taps, tell them a wait the system
      computed, message them when the table is ready, and take them off when they leave. A walk-in with a free table is
      seated straight away from the floor plan, not put on the list. The one thing to get right: a live, ordered list of
      who is waiting and for how long. Today the screen is a form that can only add one entry.'
    inputs:
    - field: Party size
      rule: Stepper starting at 2, minimum 1.
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist
    - field: Seating preference
      rule: Chips Any (default), Indoors, Outdoors, Bar, Booth and High chair needed.
      source: contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist
    - field: Name and mobile
      rule: Needed to call the party by SMS or WhatsApp. Run the same duplicate match as reservations.
      source: contracts/satellite/fnb.yaml#notifyWaitlistParty | DI-808
    - field: Quoted wait
      rule: Computed from turn times and the parties ahead, and shown with its basis ("3 parties ahead · based on tonight's
        turn times"). The host does not type it. A host override is possible and recorded as such.
      source: contracts/satellite/fnb.yaml#quoteWaitTime | F29 step 1
    outputs:
    - element: Waiting list
      rule: 'Ordered by time joined: name, party, preference, minutes waited against minutes quoted (red once past the quote),
        and status Waiting or Called. A called party shows a countdown to the hold expiry (default 10 minutes).'
      source: contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist | contracts/satellite/fnb.yaml#notifyWaitlistParty
    actions:
    - action: Call party
      result: Sends "Your table is ready" by SMS, WhatsApp or push, or records "Called in person". Starts the hold. A party
        can be called again, and each call is recorded.
      source: contracts/satellite/fnb.yaml#notifyWaitlistParty
    - action: Take off list
      result: Confirm names the party and their place ("Omar Ziad, party of 4, 2nd"), with an optional reason. It ends Cancelled,
        and a party already called releases its table at once. This is distinct from "Walked away" (left without telling
        us).
      source: contracts/satellite/fnb.yaml#leaveRestaurantWaitlist | R073
    edgeCases:
    - case: Offline at the door
      expected: Adding a party works offline and keeps the time on the device. Quoting, calling and taking off need a connection
        and show as disabled.
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist | contracts/satellite/fnb.yaml#quoteWaitTime | contracts/satellite/fnb.yaml#leaveRestaurantWaitlist
    - case: Guest asks about a deposit
      expected: The waitlist never takes a deposit, even when the venue's dining deposit is on, and never goes into a cart.
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist | DI-1048 | REV3-8
    sampleData:
      waiting:
      - name: Omar Ziad
        party: 4
        pref: Outdoors
        joined: '19:42'
        quoted: 25 min
        waited: 18 min
        status: Waiting
      - name: Priya Nair
        party: 2
        pref: Any
        joined: '19:51'
        quoted: 15 min
        status: Called via SMS
        holdUntil: '20:15'
      - name: Daniel Brooks
        party: 5
        pref: High chair needed
        joined: '20:02'
        quoted: 35 min
        status: Waiting
    corrections:
    - what: There is no operation that lists an outlet's waitlist.
      why: The screen cannot show who is waiting, and the pattern was set to configEditor because no read existed.
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist | DI-337 | screens/P06-staff-app.yaml#EMP-056
    - what: No operation seats a waiting party (links the entry to a table visit) or records "walked away". The state model
        uses joinRestaurantWaitlist as the trigger for waiting to notified, notified to seated, and waiting to walked away.
      why: The walkedAway status exists for the wait-time report, and nothing can set it. Notified should be notifyWaitlistParty.
      source: contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist
      status: fixed
      by: CHG-WIR-008
    - what: RestaurantWaitlist has no guest name or contact, only subjectId.
      why: A walk-in without a profile cannot be called by SMS or WhatsApp, and the host cannot read the list by name.
      source: contracts/satellite/fnb.yaml#notifyWaitlistParty | contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist
      status: fixed
      by: CHG-WIR-008
    - what: quoteWaitTime and notifyWaitlistParty are on EMP-058, not on the waitlist screen. The form exposes id, outletId,
        status, notifiedAt and holdExpiresAt as inputs.
      why: The quote and the call belong to the waitlist (F29 branch at 1). The status and times are system fields.
      source: F29 step 1 | screens/P06-staff-app.yaml#EMP-056 | R254
      status: fixed
      by: CHG-WIR-008
  EMP-058:
    summary: 'The table sheet for one table during service, opened by tapping it on the floor plan: seat the party (walk-in
      or booking), see where the table is in its meal, order, add a guest, change the server, move the party to another
      table or merge two tables, and follow the table''s activity. The one thing to get right: the client''s three named
      actions (Add guest, Change server, Transfer table) and an activity log, each as one clear action, instead of the 16
      buttons the operations produced.'
    inputs:
    - field: Covers (seat step)
      rule: Picked after the table, with a stepper defaulting to the booking's party size (or the table's seats for a walk-in).
        It drives split by covers at the end. For a booking, record the actual party when it differs ("Booked 6, arrived
        4").
      source: DI-104 | contracts/satellite/fnb.yaml#openTableVisit | contracts/satellite/fnb.yaml#seatTableReservation
    - field: Table(s) for a booking
      rule: At least one. The host picks on the mini floor plan, and a declared combination can be chosen as one choice.
        Seats from Booked, Confirmed or No-show (late arrival) only.
      source: contracts/satellite/fnb.yaml#seatTableReservation | DI-689 | contracts/satellite/fnb.yaml#setTableCombinations
    - field: Move reason
      rule: Guest request, Table fault, Party size changed, Service recovery, or Other. Other needs a note.
      source: contracts/satellite/fnb.yaml#moveTableVisit | R222
    outputs:
    - element: Service stage
      rule: A stepper from Seated through Drinks ordered, Food ordered, Starters away, Mains away, Dessert, Coffee, Bill
        requested and Paying, with minutes in the current stage. Stages are set by the act wherever an act exists (an order,
        a course). The server sets by hand only the ones nothing else observes.
      source: contracts/satellite/fnb.yaml#setServiceStage | F29 step 2
    - element: Activity log
      rule: 'Newest first, each line with the time and the person: seated, drinks ordered, food ordered, sent to kitchen,
        course served, guest added, server changed, moved from T4. The course lines show the kitchen''s fired time.'
      source: DI-338 | DI-334
    - element: Orders and running total
      rule: Orders on this visit grouped by course, with the running total in AED (2 decimals).
      source: contracts/satellite/fnb.yaml#getTableVisit
    actions:
    - action: Add guest
      result: Adds covers to the visit (the client's term). Allowed offline.
      source: DI-338 | contracts/satellite/fnb.yaml#updateTableVisit
    - action: Change server
      result: Pick the incoming server with reason (Shift change, Break, Section change, Escalation, or Other with a note).
        Gratuity splits between the two servers by default. The change is recorded, not silent.
      source: DI-338 | contracts/satellite/fnb.yaml#reassignServer | contracts/satellite/fnb.yaml#transferTableVisit | R222
    - action: Transfer table
      result: 'The client''s "Transfer table" is moving the party to another table: the bill, the kitchen tickets and the
        server follow. If the target is occupied, the refusal names who is there and offers "Merge with T9 instead".'
      source: DI-338 | contracts/satellite/fnb.yaml#moveTableVisit | POSV2-8
    - action: Merge tables
      result: Confirm names both tables and their covers and bills ("T6 (4, AED 212.00) joins T7 (5, AED 318.50) into one
        bill"). Online only. Refused if either visit is already closed.
      source: contracts/satellite/fnb.yaml#mergeTableVisits | POSV2-8
    - action: Order
      result: Opens the menu for this table (same order pad as the till), with the table and table service already set.
      source: contracts/satellite/fnb.yaml#createFnbOrder | F29 step 2
    edgeCases:
    - case: Seat on a table someone else just seated
      expected: The 409 names the visit at that table ("T9 was seated by Khalid at 20:02") and offers another table.
      source: contracts/satellite/fnb.yaml#openTableVisit
    - case: Order with a recipe-linked item while offline
      expected: Refused with "Can't order this offline; stock is tracked". Untracked items queue normally.
      source: contracts/satellite/fnb.yaml#createFnbOrder
    consistency:
    - with: POS-028
      note: Move and merge exist here and are off the till until after r2. The till's table list actions (Seat & order,
        Recall check, Settle bill, Seat booking) use the same words.
    - with: KIT-003
      note: The course state shown here is the kitchen pass's. The fired timer and course names match.
    - with: EMP-059
      note: The bill and payment live on EMP-059. This sheet links to it ("Bill").
    sampleData:
      table: T12 · Main Hall · 4 seats
      visit:
        covers: 4
        server: Priya Nair
        seatedAt: '19:58'
        stage: Starters away · 14 min
        runningTotal: AED 448.00
      log:
      - 20:31 Starters served · kitchen
      - 20:12 Food ordered · Priya
      - 20:03 Drinks ordered · Priya
      - 19:58 Seated, booking Al Suwaidi (6 → 4) · Aisha (host)
    corrections:
    - what: Three operations change the server (updateTableVisit.serverPrincipalId, transferTableVisit, reassignServer),
        and two move the table (updateTableVisit.tableId, moveTableVisit).
      why: 'One act, three records, three different audit trails, and only two of them split the gratuity. Use one operation
        per act: reassignServer or transferTableVisit for Change server, moveTableVisit for Transfer table. updateTableVisit
        covers only.'
      source: DI-338 | contracts/satellite/fnb.yaml#updateTableVisit | contracts/satellite/fnb.yaml#reassignServer | contracts/satellite/fnb.yaml#transferTableVisit
      status: logged
      by: CHG-SPO-019
    - what: Naming collision. The client's "Transfer table" means move the party to another table (moveTableVisit). The
        contract's transferTableVisit means hand the check to another server.
      why: A designer following the operation names will put "Transfer" on the wrong act.
      source: DI-338 | contracts/satellite/fnb.yaml#transferTableVisit | contracts/satellite/fnb.yaml#moveTableVisit
      status: fixed
      by: CHG-SPO-018
    - what: No operation or field gives a table's activity log.
      why: The client asked for a per-table activity log. TableVisit carries orders and no events.
      source: DI-338 | TRACKER Workshops/Actions row 89 | contracts/satellite/fnb.yaml#getTableVisit
      status: logged
      by: CHG-SPO-019
    - what: '"Fire course" and "Hold course" on the server''s handheld (F29 step 5), while the agreed decision says the
        kitchen pass fires courses and the vocabulary keeps "Fire" on the kitchen side.'
      why: Contradiction between the flow and DI-407. Either the server may release the next course from the floor, or only
        the pass does.
      source: DI-407 | DI-333 | F29 step 5 | contracts/satellite/fnb.yaml#fireCourse
      status: logged
      by: CHG-SPO-020
    - what: '"Notify server" as a button on the server''s own table sheet.'
      why: It is the kitchen calling the server to the pass. On the staff app it is an incoming notification, not an action.
      source: contracts/satellite/fnb.yaml#notifyServer | F29 step 4
      status: fixed
      by: CHG-SPO-018
    - what: '"Save table combinations" (setTableCombinations, PRODUCT_CONFIGURE) and the waitlist actions (join, quote wait,
        notify party) on the table sheet.'
      why: Combinations are pre-service configuration (EMP-053). The waitlist actions belong to EMP-056. R254 re-derives
        operations from purpose.
      source: R254 | F94 step 1 | F29 step 1 | contracts/satellite/fnb.yaml#setTableCombinations
      status: fixed
      by: CHG-WIR-008
    - what: The pattern configEditor with text fields for id, tableId, covers, serverPrincipalId, subjectId and recordedAt,
        and a "Create F&B order" modal collecting id, outletId, serviceMode and lines.
      why: Plumbing on a user's screen. recordedAt is device time, set by the app. Ordering is a menu, like the till's order
        pad.
      source: screens/P06-staff-app.yaml#EMP-058
      status: fixed
      by: CHG-SPO-018
    - what: F29 step 1 seats with seatTableReservation and openTableVisit, but the table state model moves a table from
        free to seated only by claimTableSession (the guest's claim).
      why: The host's seat has no transition on the table, so the map's state after a host seats is undefined.
      source: F29 step 1 | contracts/satellite/fnb.yaml#openTableVisit
      status: logged
      by: CHG-SPO-019
    decisions:
    - question: May a server release the next course from the handheld (F29 step 5), or does only the kitchen pass fire (DI-407)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Show the course strip read-only, plus a
        "Ready for mains" action that is drawn but marked pending the decision. Never label it "Fire" on the floor.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-050 | CHG-NOTE-004
      questionSource: DI-407 | F29 step 5 | DI-333
  EMP-059:
    summary: 'The table''s bill at the end of the visit: every line across every order, service charge and VAT, the split
      the party asks for, comps for service recovery, payment, and closing the table. The one thing to get right: the split
      is done at close and each part recomputes its own tax and service charge, so the parts always sum to the bill to the
      fils. A comp is never shown as a discount.'
    inputs:
    - field: Split
      rule: 'Methods in the client''s order: By amount, By covers (defaults to the table''s covers), By category (food to
        one guest, drinks to another), then By item and By seat. Every line goes to exactly one part. Amounts must sum to
        the total. A split that does not sum is refused, never rounded away. Remainders go to the minor unit, and 3-decimal
        currencies keep the third decimal.'
      source: DI-106 | contracts/satellite/fnb.yaml#splitBill | F29 step 8 | DI-306
    - field: Comp reason
      rule: Quality issue, Long wait, Wrong item, Allergy incident, Goodwill, Staff meal, Wastage, or Other (with a note).
        A comp on a line above the venue's comp limit (proposed AED 100.00) needs a manager with discount authority, by
        PIN on this device.
      source: contracts/satellite/fnb.yaml#compItem | R197 | R222
    - field: Tip
      rule: The guest's gratuity, entered at payment, separate from the service charge (which is revenue, not a tip).
      source: contracts/satellite/fnb.yaml#closeTableVisit | contracts/satellite/fnb.yaml#/components/schemas/TableVisit
    outputs:
    - element: Bill
      rule: Lines grouped by course (or by seat when split by seat), each with quantity and line total. Comped lines are
        struck through with "Comp · Long wait · Priya". Then subtotal, service charge, VAT 5%, total in AED with 2 decimals.
        A deposit paid on the booking is shown as a deduction above the amount to pay.
      source: contracts/satellite/fnb.yaml#getBill | DI-337 | contracts/satellite/fnb.yaml#compItem
    - element: Sub-bills
      rule: One card per part with its own subtotal, VAT, total and a Paid or To pay state. The table closes when every
        part is paid.
      source: contracts/satellite/fnb.yaml#/components/schemas/BillSplit | F29 step 9
    actions:
    - action: Request bill
      result: 'Marks the table "Bill requested" on the floor plan. The kitchen stops accepting additions for this table.
        Reversible: "Add more" puts the table back to ordering when the party orders another round.'
      source: contracts/satellite/fnb.yaml#requestBill | F29 step 8
    - action: Move items to another table
      result: Moves selected lines to another table's bill (a guest who moves from the bar). The kitchen is not asked to
        make them again.
      source: contracts/satellite/fnb.yaml#transferOrderItems | F29 step 8
    - action: Close table
      result: 'Takes the payments per part and closes. The 409 says why, either "AED 155.06 still to pay on part 3" or "2
        items not yet served: Umm Ali ×2". The table then goes to Table closed and the next waiting party can be called.'
      source: contracts/satellite/fnb.yaml#closeTableVisit | F29 step 9 | DI-336
    edgeCases:
    - case: Card payment with no answer from the terminal
      expected: Show "Waiting for the card terminal" and check the payment's status. Never assume it failed or take the
        card again.
      source: contracts/spine/orders.yaml#createPayment
    - case: Offline at the table
      expected: Ordering continues. Split, payment by card and close need a connection and show as disabled with that reason.
      source: F29 step 8 | contracts/satellite/fnb.yaml#closeTableVisit
    consistency:
    - with: POS-005
      note: Payment tenders and wording ("Charge AED x") match the till's single tender step.
    - with: POS-028
      note: The till's "Settle bill" on a table is the same bill, split and close.
    sampleData:
      table: T12 · 4 covers · Priya Nair
      lines:
      - item: Mezze platter
        qty: 1
        total: '62.00'
        course: Starters
      - item: Grilled hammour
        qty: 2
        total: '196.00'
        course: Mains
      - item: Lamb ouzi
        qty: 1
        total: '115.00'
        course: Mains
      - item: Fresh lemon mint
        qty: 4
        total: '88.00'
        course: Drinks
      - item: Umm Ali
        qty: 2
        total: '76.00'
        course: Dessert
      subtotal: AED 537.00
      serviceCharge: AED 53.70
      vat5: AED 29.54
      total: AED 620.24
      splitByCovers:
      - AED 155.06
      - AED 155.06
      - AED 155.06
      - AED 155.06
      comp: Grilled hammour ×1 · AED 98.00 · Long wait (under the AED 100.00 limit, no manager needed)
      orderNumbers:
      - OAS-104582
      - OAS-104590
    corrections:
    - what: Two ways to pay. closeTableVisit takes the payments inline (sub-bill, tender, amount), and the screen also offers
        "Create payment" (createPayment), which needs an orderId. The sales orders exist only after the visit is closed.
      why: F29 step 9 lists both, and the table state model moves the table on createPayment. Which act takes the money
        for a sub-bill is undefined.
      source: contracts/satellite/fnb.yaml#closeTableVisit | contracts/spine/orders.yaml#createPayment | F29 step 9
    - what: The Bill has no deposit line.
      why: DI-337 says a deposit is adjusted against the final bill, and REV3-8b applies a held deposit to the bill.
      source: DI-337 | REV3-8b | contracts/satellite/fnb.yaml#/components/schemas/Bill
    - what: closeTableVisit moves the table to needsClearing.
      why: The client's flow is Ordered, then Table Closed, with no cleaning status. See EMP-052.
      source: DI-336 | contracts/satellite/fnb.yaml#closeTableVisit
    - what: requestBill is described as reversible, but no operation reverses it. The state model returns from billRequested
        to open via openTableVisit, which refuses an occupied table.
      why: The design needs "Add more" to work.
      source: contracts/satellite/fnb.yaml#requestBill
    - what: splitBill, compItem and transferOrderItems are marked offline-capable while F29 says splitting and payment need
        the network.
      why: A split computed offline against a changed bill makes two guests pay for one item.
      source: F29 step 8 | contracts/satellite/fnb.yaml#splitBill
    - what: The "Create F&B order" modal collecting raw ids, a "Create payment" modal collecting id, orderId, tender and
        deviceId, and the transition to EMP-058 on transferOrderItems.
      why: Plumbing on a user's screen. Moving items keeps the server on the bill and does not navigate.
      source: screens/P06-staff-app.yaml#EMP-059
  EMP-060:
    summary: 'How the restaurant''s bookings and tables performed, for the floor manager during and after a service: booked
      against seated covers, no-shows, parties that arrived smaller than booked, and how long tables turned. The one thing
      to get right: show only what the data can support. Today only the bookings and the live table map are read, so turn
      times and quoted-against-actual waits have no source yet.'
    outputs:
    - element: Bookings performance
      rule: 'From the day''s bookings: booked, seated, no-show and cancelled counts and covers, and covers lost to smaller
        arrivals (booked 6, arrived 4 is two covers the restaurant could have sold). Compared with the same weekday last
        week only if a source exists.'
      source: contracts/satellite/fnb.yaml#listTableReservations | contracts/satellite/fnb.yaml#seatTableReservation
    - element: Tables now
      rule: Occupancy by hall from the live map, in the floor-plan colours.
      source: contracts/satellite/fnb.yaml#getTableMap | DI-792
    - element: Restaurant measures
      rule: Turn time, no-show rate, covers and wait accuracy, all from reporting (never computed on the device).
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    sampleData:
      service: Oasis Bistro dinner · Thu 15 Oct 2026
      bookings:
        booked: 24
        seated: 19
        noShow: 3
        cancelled: 2
      covers:
        booked: 92
        seated: 81
        lostToSmallerParties: 6
      occupancyNow:
        mainHall: 78%
        terrace: 50%
        majlis: 100%
    corrections:
    - what: No source for table performance (turn time, time per service stage, quoted against actual wait, revenue per
        cover).
      why: setServiceStage says the stage "is what makes a turn time real", and quoteWaitTime records quotes so the venue
        can compare them with actual waits, but no read returns these. A list of bookings is not a performance view.
      source: contracts/satellite/fnb.yaml#setServiceStage | contracts/satellite/fnb.yaml#quoteWaitTime | screens/P06-staff-app.yaml#EMP-060
    - what: The exit to EMP-061 Retail Inventory Command Center (F80 step 3 to 4, F94 step 2 to 3), and the flow labels
        "drawn by the client as FNB-4B, 4C, 4D" that disagree with the screens' board frames.
      why: A restaurant performance view does not lead to retail stock. F80 also runs bill, then live service, then performance,
        then retail, against its own name ("configured, reserved, seated and billed").
      source: F80 step 3 | F94 step 2 | screens/P06-staff-app.yaml#EMP-060
      status: fixed
      by: CHG-WIR-009
    - what: The board frame fnb-4c is the same as EMP-053's.
      why: One frame cannot be the design of two screens.
      source: screens/P06-staff-app.yaml#EMP-060 | screens/P06-staff-app.yaml#EMP-053
    - what: '"Outlet id" text field, a free date picker, the raw reservations table and detail panel, a "Confirm" button
        with no operation, and a read gated on ORDER_MODIFY.'
      why: Plumbing on a user's screen, and a manager who only views is refused.
      source: screens/P06-staff-app.yaml#EMP-060 | contracts/satellite/fnb.yaml#listTableReservations
    decisions:
    - question: Which restaurant measures does the client want on the staff app (turn time, no-show rate, covers, wait accuracy),
        and are they computed by reporting or on the device?
      decision: Turn time, no-show rate, covers and wait accuracy, all from reporting.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-205 | CHG-NOTE-004
      questionSource: DI-400 | TRACKER Workshops/Actions row 89
  EMP-062:
    summary: 'Store Stock & Availability is the shop-floor handheld lookup. A staff member scans or searches a product and
      sees on hand against available here (net of what is held for online orders and collections), plus stock at sibling
      stores, so a colleague can be sent to fetch a size rather than losing the sale. The one thing to get right is speed
      with one thumb: scan, see, act.

      '
    inputs:
    - field: Scan or search
      rule: 'Camera or scanner barcode first, with name search as fallback. A barcode that matches an inactive item says
        "Not found", the same as an unknown barcode.

        '
      source: DI-233 | DI-361 | R215 | contracts/satellite/retail.yaml#lookupMerchandise
    outputs:
    - element: Result card
      rule: 'Product name and variant (size/colour), price after promotion (AED), then three big numbers: On hand · Allocated
        · Available at this store. Below them: "Other stores", the sibling outlets with available stock, nearest first.

        '
      source: DI-361 | R171 | contracts/satellite/retail.yaml#lookupMerchandise
    - element: Store list view
      rule: 'Without a search, the store''s stock with low stock first (below reorder point), filterable by category. Cards,
        not a table.

        '
      source: contracts/satellite/retail.yaml#getOutletStock
    edgeCases:
    - case: Offline
      expected: 'Stock reads from cache with "Last updated hh:mm". The sibling-store check needs a connection; say so in
        place.

        '
      source: contracts/satellite/inventory.yaml#getStockPositions | contracts/satellite/retail.yaml#lookupMerchandise
    - case: Available is zero or negative while items are on the shelf
      expected: 'Say "All on hand is held for orders". The item cannot be sold at the till, because the sale is gated on
        system stock.

        '
      source: DI-294 | DI-361
    consistency:
    - with: BO-049
      note: Same three numbers and labels.
    - with: POS-023
      note: The till's price check returns the same price and sibling stock.
    sampleData:
      scan: '6291100456781'
      result:
        product: Aqua Park logo T-shirt
        variant: Green / M
        price: AED 89.00
        onHand: 5
        allocated: 3
        available: 2
        otherStores:
        - store: Beach Hut
          available: 6
        - store: Main Gate Kiosk
          available: 0
    corrections:
    - what: 'The screen carries the HACCP status and "Log temperature" (food safety) and the F&B 86 toggle. It requires
        the F&B module.

        '
      why: 'The client defined this screen as retail store stock and availability. Food-safety checks and menu 86 are other
        processes, attached through F28 and the F&B board. It should require the retail or inventory module.

        '
      source: DI-361 | R254 | F28 step 1 | screens/P06-staff-app.yaml#EMP-062
      status: fixed
      by: CHG-WIR-008
    - what: 'It reads stock positions (one record, status tracker) but not the shop-floor reads that exist for exactly this:
        getOutletStock ("shaped for a handheld on a shop floor, low stock first, with sibling outlet availability") and
        lookupMerchandise.

        '
      why: 'getOutletStock is consumed only by BO-044. This handheld screen is its natural consumer, and barcode lookup
        is the client''s first ask.

        '
      source: DI-233 | contracts/satellite/retail.yaml#getOutletStock | contracts/satellite/retail.yaml#lookupMerchandise
      status: fixed
      by: CHG-WIR-008
    decisions:
    - question: Do pending online purchases awaiting pickup or shipment count in Allocated?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Yes. Allocated covers everything held for
        an order or a collection.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-051 | CHG-NOTE-004
      questionSource: DI-361 | R171
  EMP-063:
    summary: 'The handheld side of requisitions: an outlet manager or storekeeper sees what is running low, raises a request
      (from a suggestion or from scratch) and tracks its status. Approval happens in the back office. The one thing to get
      right is the suggestion: the suggested quantity stays visible beside what was asked for.

      '
