        open a shift. The row stays waiting with its age until a supervisor resolves it, and the daily cash reconciliation
        lists it.
      source: DI-805 | TRACKER 30-Sep/Tracker row 30 | TRACKER Workshops/Client Inputs row 59 | decided 2 October 2026 by
        Chinmay (CHG-NOTE-004)
