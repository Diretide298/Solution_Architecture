      by: CHG-WIR-009
    decisions:
    - question: If no supervisor is available, may the cashier log out with the variance logged for later review?
      decision: 'As POS-007: the cashier signs out, the shift is pending (''Under review'') and the next cashier can start.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-173 | CHG-NOTE-004
      questionSource: DI-805 | TRACKER 30-Sep/Tracker row 30
    - question: Must the variance be accepted on the same till the shift was counted on, or any till at the venue?
      decision: 'Drawn default stands (answer: "Any till, with supervisor PIN"): Any till at the venue, with the supervisor''s
        PIN (the contract names the shift, not the device).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-174 | CHG-NOTE-004
      questionSource: contracts/spine/shift.yaml#acceptShiftVariance
    - question: 'The client asked that a supervisor can reject a variance so the cashier recounts and resubmits; the contract
        has accept only (reopen is the way back). Is reject needed?

        '
      decision: A supervisor can reject a variance so the cashier recounts and resubmits (DI-804).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-175 | CHG-NOTE-004
      questionSource: DI-804 | contracts/spine/shift.yaml#reopenShift
    - question: Which screen shows the denomination breakdown of the closing count for review (no read returns the count lines)?
      decision: Add a read for the closing count lines (denomination breakdown) for review.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-176 | CHG-NOTE-004
      questionSource: DI-272 | contracts/spine/shift.yaml#closeShift
  BO-041:
    summary: 'The log of cash that moves in or out of a till without a sale: opening float, cash out (lift), cash in (add),
      safe drops and banking taken from a box, and no-sales. A supervisor or the cash office reads it per shift to see who
      moved what, when, authorised by whom and witnessed by whom. One thing to get right: it is a log, read per shift, and
      every movement changes the expected figure at close — so a mistaken entry is corrected by a second movement with a
      reason, never edited.

      '
    inputs:
    - field: Shift
      rule: 'Pick the shift first (till, cashier, date) from the shift list; the movement list is per shift. Default: shifts
        open now at the user''s outlets.

        '
      source: contracts/spine/shift.yaml#listCashMovements | contracts/spine/shift.yaml#listShifts
    - field: Record cash out / cash in — type
      rule: Two choices only, Cash out (lift) and Cash in (add). Opening float is never chosen here (openShift writes it).
      source: contracts/spine/shift.yaml#/components/schemas/CashMovementKind | DI-274
    - field: Amount
      rule: 'Either a total or a denomination count (notes and coins of the region, counting order, note images, typed quantities);
        when both are given the denomination count wins. Cash out may not exceed the float counted at the last count, less
        cash out since, plus cash in since — cash taken in sales since the last count does not count towards it.

        '
      source: R123 | DI-775 | DI-776 | contracts/spine/shift.yaml#createCashMovement
    - field: Reference and reason
      rule: Reference is the safe-drop reference or bag number (max 64); reason max 500, required in practice for any back-office
        entry.
      source: contracts/spine/shift.yaml#createCashMovement | R222
    outputs:
    - element: Movement rows
      rule: 'In sequence order: time (GST), type (Opening float, Cash out, Cash in, Safe drop, Banking, Change order — from
        kind and withdrawal reason), amount signed (out negative), denominations summary, reference, reason, authorised
        by, witness (the cashier, on box withdrawals). A row recorded offline and not yet synced is marked.

        '
      source: contracts/spine/shift.yaml#/components/schemas/CashMovement
    - element: No-sales
      rule: 'Listed with reason (Change for guest, Correct float, Retrieve dropped cash, Till check, Other + note) and a
        running count per shift; "9 no-sales, 4 sales" is emphasised.

        '
      source: contracts/spine/shift.yaml#recordNoSale | F32 step 5
    - element: Shift header
      rule: Till, cashier, status, opening float, cash out total, cash in total; expected cash only after the shift is counted.
      source: contracts/spine/shift.yaml#getShift
    actions:
    - action: Record cash out / cash in
      result: 'Confirm names the till, cashier and amount ("Cash out AED 1,000.00 from Till 3 — Priya Nair"). Success adds
        the row and lowers/raises the expected close figure. Refusals: "The shift is not open"; "More than the counted float
        available (AED 1,250.00)".

        '
      source: contracts/spine/shift.yaml#createCashMovement | R123
    edgeCases:
    - case: Movements recorded on an offline till
      expected: Arrive later but keep their sequence; the list orders by sequence, not by arrival.
      source: contracts/spine/shift.yaml#/components/schemas/CashMovement
    - case: Shift already closed
      expected: No record action; a correction after close goes through Reopen shift (BO-039).
      source: contracts/spine/shift.yaml#createCashMovement | R144
    consistency:
    - with: POS-017
      note: Cash In / Cash Out at the till records the same movements; same type words.
    - with: BO-042
      note: A safe drop or banking from a box appears here as a lift with its reason.
    - with: POS-020
      note: No-sales are recorded at the till (Shift Exceptions & Alerts); this screen only lists them.
    - with: BO-039
      note: The shift detail there uses this row format.
    sampleData:
      shift:
        till: Till 3 — Bite & Go
        cashier: Priya Nair
        date: 14 Oct 2026
      movements:
      - seq: 1
        time: 06:58
        type: Opening float
        amount: AED 500.00
        denominations: 5 × 50, 10 × 20, 5 × 10
      - seq: 2
        time: '12:15'
        type: Safe drop
        amount: AED −2,000.00
        reference: SD-0451
        authorised_by: Omar Ziad
        witness: Priya Nair
      - seq: 3
        time: '14:40'
        type: Cash in
        amount: AED +200.00
        reason: 'Change top-up: 25 fils and 1 AED coins'
        authorised_by: Omar Ziad
      no_sales:
      - time: '10:02'
        reason: Change for guest
      - time: '11:47'
        reason: Till check
    corrections:
    - what: '"Record no sale" (recordNoSale) is an action on the back-office screen.'
      why: 'A no-sale is a drawer opening at a till (F32 step 5, POS-020); recorded from a browser it opens no drawer and
        fabricates an incident. Keep the no-sale log, drop the act.

        '
      source: F32 step 5 | R254 | contracts/spine/shift.yaml#recordNoSale
      status: fixed
      by: CHG-WIR-008
    - what: No read returns no-sales; listCashMovements returns lifts, adds and the float only.
      why: The purpose includes no-sales; they live as NoSaleEvent / Shift.incidents with no list operation bound.
      source: contracts/spine/shift.yaml#listCashMovements | contracts/spine/shift.yaml#recordNoSale
      status: fixed
      by: CHG-WIR-008
    - what: listCashMovements is per shift (path shiftId); there is no venue- or day-level movement list.
      why: '"Every cash movement" across tills cannot be shown; the design is shift-first until a venue-level read exists.'
      source: contracts/spine/shift.yaml#listCashMovements
    - what: Pattern approvalInbox with a table titled "Waiting for a decision" and "nothing waiting is the good outcome".
      why: Cash movements await no decision; this is a log.
      source: screens/P08-venue-back-office.yaml#BO-041
    - what: 'Button label "Create cash movement"; columns id, shiftId, sequence, syncedAt, authorisedByPrincipalId as raw
        ids; exit to BO-008 Product Detail; entry state shiftId from session.

        '
      why: Plumbing labels and derived navigation; use "Record cash out / cash in" and names.
      source: R251 | screens/P08-venue-back-office.yaml#BO-041
      status: fixed
      by: CHG-WIR-009
    decisions:
    - question: Should a lift or add be recordable from the back office at all, when the cash is at the till?
      decision: 'Drawn default stands (answer: "Yes: supervisor entry with mandatory reason"): Keep it (R276 kept createCashMovement
        here) as a supervisor entry with a mandatory reason.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-177 | CHG-NOTE-004
      questionSource: R276 | contracts/spine/shift.yaml#createCashMovement
  BO-042:
    summary: 'The cash office takes cash out of cashiers'' deposit boxes mid-shift — to the safe or for banking — so a busy
      drawer never holds more than it should. Each withdrawal is a lift that lowers the box''s expected close figure, so
      it is never a variance. Two people sign: the supervisor taking it and the cashier it came from. One thing to get right:
      a deposit box belongs to a cashier, not a till — the list is by cashier, with the till they are on now.

      '
    inputs:
    - field: Amount
      rule: 'Total in the region currency (AED 2 decimals; 3 for BHD/KWD). The contract carries no denomination lines for
        a withdrawal, so a denomination helper may only total into the amount.

        '
      source: contracts/spine/shift.yaml#withdrawFromDepositBox | DI-306
    - field: Reason
      rule: Banking, Safe drop (default), Change order, Other; Other makes the note required (max 300).
      source: contracts/spine/shift.yaml#/components/schemas/WithdrawalReason | R222
    - field: Cashier (witness)
      rule: Prefilled with the box holder; the cashier signs as witness with their PIN on the same device (step-up), and the
        withdrawal records them as the witness.
      source: contracts/spine/shift.yaml#withdrawFromDepositBox | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Boxes holding cash
      rule: 'Cashier, till now (changes during the shift), status (Open, On break), opening float, withdrawn so far, foreign
        cash held per currency where the till takes it. Boxes being counted, counted or reconciled are shown without the
        action.

        '
      source: contracts/spine/shift.yaml#listDepositBoxes | DI-282
    - element: Withdrawal history per box
      rule: Time, amount, reason, taken by, witnessed by, reference; the same rows appear in Cash Movements.
      source: contracts/spine/shift.yaml#withdrawFromDepositBox
    - element: Over the drawer limit
      rule: A box above the venue's drawer limit (a setting to be added) is flagged; the till warns the cashier and offers
        a cash lift.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Bank or safe-drop cash
      result: 'Confirm "Take AED 2,000.00 from Priya Nair''s box (Till 3, Bite & Go) to the safe". Success raises withdrawn-so-far
        and lowers the expected close figure. 409 "This box is being counted" when it is closing, closed or reconciled.

        '
      source: contracts/spine/shift.yaml#withdrawFromDepositBox | F32 step 4
    edgeCases:
    - case: Cashier moved to another till during the shift
      expected: The box follows the cashier; the row shows the new till.
      source: contracts/spine/shift.yaml#listDepositBoxes
    - case: Withdrawal recorded on an offline device
      expected: Accepted later in sequence; the box total updates when it syncs.
      source: contracts/spine/shift.yaml#withdrawFromDepositBox
    - case: Box on break (suspended shift)
      expected: Withdrawal still allowed; only closing/closed/reconciled boxes refuse.
      source: contracts/spine/shift.yaml#withdrawFromDepositBox
    consistency:
    - with: POS-018
      note: Safe Drop & Cash Transfer at the till records the same withdrawal; same reason words.
    - with: BO-041
      note: Each withdrawal appears there as a lift.
    - with: BO-043
      note: Daily Reconciliation compares expected against deposited; banking feeds it.
    sampleData:
      boxes:
      - cashier: Priya Nair
        till: Till 3 — Bite & Go
        status: Open
        float: AED 500.00
        withdrawn: AED 2,000.00
      - cashier: Khalid Al Mansoori
        till: Till 1 — Main Gate ticket office
        status: Open
        float: AED 1,000.00
        withdrawn: AED 0.00
        foreign: USD 120.00
      withdrawal:
        amount: AED 3,000.00
        reason: Banking
        reference: BAG-2026-1014-07
        taken_by: Omar Ziad
        witness: Khalid Al Mansoori
    corrections:
    - what: '"Banking & Safe" has no safe or bank side: no operation records the safe balance, a bank deposit (bag, slip,
        bank, date) or the transfer from safe to bank; F32 step 8 uses finance.settleDeposit, which settles a guest''s held
        deposit, not a cash banking.

        '
      why: 'The screen can only take cash out of boxes; the "deposited" figure DI-275 reconciles against has no source.

        '
      source: F32 step 8 | DI-275 | contracts/spine/finance.yaml#settleDeposit
    - what: 'Bulk tables "Waiting for a decision" (every cash movement) and "Every shift" with raw ids; approvalInbox empty
        state; exit to BO-008; entry state shiftId from session.

        '
      why: The box list is the queue; the rest is plumbing and derived navigation.
      source: R251 | screens/P08-venue-back-office.yaml#BO-042
      status: fixed
      by: CHG-WIR-009
    - what: listDepositBoxes requires SHIFT_OPEN.
      why: A cash-office supervisor reading boxes in the back office should not need the permission to open a till shift;
        a permission borrowed from the wrong act.
      source: contracts/spine/shift.yaml#listDepositBoxes | R091
    decisions:
    - question: How does the cashier sign as witness — PIN step-up on the same device, or named only?
      decision: The cashier signs as witness with a PIN on the same device (step-up).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-178 | CHG-NOTE-004
      questionSource: contracts/spine/shift.yaml#withdrawFromDepositBox | R144
    - question: Where is the drawer ceiling configured, so the screen can flag boxes over it?
      decision: 'Drawer limit setting: the till warns when the drawer is over the limit and offers a cash lift.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-179 | CHG-NOTE-004
      questionSource: DI-274 | F73 step 3
  BO-044:
    summary: 'The outlet register: every F&B outlet (and, under the retail licence, every shop) at the venue, whether it
      is trading now, and the outlet''s own configuration — name, code, kind, zone, stock location, cost centre, opening
      hours, active; ordering and delivery rules; floor plan for table-service outlets; return policy for shops; food-safety
      status. One thing to get right: configuration is per outlet, and the outlet''s type decides which panels it has (a
      quick-service counter has no floor plan; a fine-dining room does).

      '
    inputs:
    - field: Code and name
      rule: Code unique within the venue (max 64; 409 "Code already in use"); name max 200. Kind is fixed after creation (no
        edit field). The name is in English, plus the local-language name where the country requires it (Arabic in the UAE).
      source: contracts/spine/tenancy.yaml#createOutlet | contracts/spine/tenancy.yaml#updateOutlet | decided 2 October 2026
        by Chinmay (CHG-NOTE-004)
    - field: Kind
      rule: 'Under F&B: Restaurant, Bar, Café, Kiosk, Mobile. Under retail: Shop. Game floor and ticket office are not offered
        here.

        '
      source: contracts/spine/tenancy.yaml#/components/schemas/OutletKind | DI-350
    - field: Stock location and cost centre
      rule: Pickers by name; a bar drawing from a central cellar points at the cellar.
      source: contracts/spine/tenancy.yaml#/components/schemas/Outlet | DI-319
    - field: Opening hours
      rule: 'Weekly grid, several windows per day (lunch and dinner), local HH:MM in the region''s time zone. Saving an
        empty grid clears the hours — confirm before saving.

        '
      source: contracts/spine/tenancy.yaml#/components/schemas/OpeningHoursWindow | contracts/spine/tenancy.yaml#updateOutlet
    - field: Ordering and delivery
      rule: 'Collection on and delivery off by default; collection hold 20 min, ASAP collection 25 min, ASAP delivery 45
        min, slot 30 min; minimum order, delivery fee and free-delivery threshold in AED; radius km and emirates served
        appear only when delivery is on; cutlery only on request (default on).

        '
      source: contracts/satellite/fnb.yaml#setFnbDeliveryPolicy
    - field: Floor plan
      rule: 'Only for outlets offering table service. Table labels unique across the venue (T12 names one table); a capacity
        change is refused while a party is seated at that table.

        '
      source: contracts/satellite/fnb.yaml#setTableLayout | R108 | DI-319
    outputs:
    - element: Outlet list
      rule: 'Name, code, kind, zone, Trading now (from opening hours against now in GST), Active, and for F&B the unsigned
        food-safety actions count — the number that matters before service.

        '
      source: F28 step 6 | contracts/spine/tenancy.yaml#listOutlets
    - element: Outlet detail
      rule: Sections Overview, Opening hours, Ordering & delivery, Floor plan (table service), Returns (shops), Food safety.
      source: DI-330 | screens/P08-venue-back-office.yaml#BO-044
    actions:
    - action: Create outlet
      result: Adds the outlet (venue from the session); 409 names the duplicate code.
      source: contracts/spine/tenancy.yaml#createOutlet
    - action: Save delivery policy
      result: Replaces the outlet's policy; 412 when someone else saved first — re-read and show the difference.
      source: contracts/satellite/fnb.yaml#setFnbDeliveryPolicy
    - action: Sign corrective action
      result: Requires what was done (and disposal where food was discarded); the unsigned count drops.
      source: contracts/satellite/fnb.yaml#signCorrectiveAction | F28 step 6
    edgeCases:
    - case: Outlet made inactive while orders are live
      expected: Allowed, with a warning that names the live orders; the guest dining list stops showing the outlet.
      source: contracts/satellite/fnb.yaml#listDiningOutlets | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - case: Food-safety escalation with no food-safety lead set
      expected: Refused "no food-safety lead"; link to Venue Configuration where the lead is set.
      source: contracts/spine/tenancy.yaml#getVenueSettings | R096
    consistency:
    - with: BO-728
      note: The client pack's Outlet Management is the same register; one design, not two.
    - with: BO-729
      note: Create / Edit Outlet in the pack is this screen's form.
    - with: BO-065
      note: Delivery locations and which outlets serve them are venue-level there.
    - with: POS-028
      note: The till's floor plan reads the layout drawn here.
    - with: WEB-036
      note: Guests see the delivery rules set here (minimum order, fee, ASAP times).
    sampleData:
      outlets:
      - name: Oasis Bistro
        code: OAS-BIS
        kind: Restaurant
        zone: Lagoon
        trading_now: Open — dinner service 18:00–23:00
        unsigned_food_safety: 0
      - name: Bite & Go
        code: BTG-01
        kind: Kiosk
        zone: Aqua Park
        trading_now: Open
        unsigned_food_safety: 2
      - name: Pool Bar
        code: PLB-01
        kind: Bar
        zone: Wave Pool
        delivery: Cabanas 1–24, ASAP 15 min
      - name: Marina Bay retail store
        code: MBR-01
        kind: Shop
        returns: 14 days, receipt required
    corrections:
    - what: 'Reserve merchandise (reserveMerchandise), Record waste (recordWaste), the "Every F&B order" and "Every merchandise"
        tables, the outlet stock and guest menu panels.

        '
      why: 'Operational acts and reads attached by resemblance; a merchandise reservation is a guest/till act and waste
        is a stock act. The register''s purpose does not need them.

        '
      source: R254 | R236 | R215 | screens/P08-venue-back-office.yaml#BO-044
      status: fixed
      by: CHG-WIR-008
    - what: Text fields "Venue id" and "Kind"; columns id, venueId, stockLocationId, costCenterId.
      why: Plumbing; venue comes from the session, stock location and cost centre are names.
      source: screens/P08-venue-back-office.yaml#BO-044
      status: fixed
      by: CHG-SBO-008
    - what: 'The outlet has no type/service model or department link: OutletKind is restaurant/bar/cafe/kiosk/…, while DI-319
        types outlets (fine dining, quick service, coffee) to switch features and links each to department, sub-department,
        cost centre and status.

        '
      why: The "type switches panels" rule has no field to read; only the template (BO-730) carries a service model.
      source: DI-319 | contracts/spine/tenancy.yaml#/components/schemas/Outlet | contracts/satellite/fnb.yaml#setOutletTemplate
      status: fixed
      by: CHG-SBO-008
    - what: No-access state is keyed to PRODUCT_VIEW (getFnbDeliveryPolicy) although the list is listOutlets (SCOPE_VIEW).
      why: The state names the wrong gate and a permission key.
      source: screens/P08-venue-back-office.yaml#BO-044
      status: fixed
      by: CHG-SBO-008
    - what: BO-044 duplicates the client pack's BO-728 Outlet Management and BO-729 Create / Edit Outlet; R276 did not decide
        this pair.
      why: Two outlet registers will be built unless one is merged into the other.
      source: R276 | DI-319
      status: fixed
      by: CHG-SBO-021
    decisions:
    - question: Are outlet names bilingual (English and Arabic)?
      decision: 'Outlet names: English, plus the local language where the country requires it.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-031 | CHG-NOTE-004
      questionSource: contracts/spine/tenancy.yaml#/components/schemas/Outlet | DI-210
    - question: Can an outlet be deactivated while it has live orders?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Allow with a warning naming the live orders.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-032 | CHG-NOTE-004
      questionSource: designer default
    - question: Homogeneous venue-owned outlets set up once centrally — via templates or a bulk edit?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Via outlet templates (BO-730).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-033 | CHG-NOTE-004
      questionSource: DI-330
  BO-045:
    summary: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what is a draft,
      what is scheduled, and the history a refund dispute asks about ("what were we charging at noon"). From here the manager
      reprices or retires in bulk with a preview, publishes now or for a date, rolls back, manages modifier groups, and
      sees each dish''s allergen verdict. The one thing to get right is that the live version keeps selling while the draft
      is edited, and every publish says what goes live, on which tills and channels, and from when.'
    inputs:
    - field: Outlet
      rule: A picker of outlets by name (Oasis Bistro, Bite & Go), defaulting to the signed-in user's outlet; never a text
        field for an id. Menus are configured per outlet; an outlet manager sees only their own outlets, the F&B Director
        all of them.
      source: DI-330 | DI-331 | DI-318 | contracts/satellite/fnb.yaml#listMenus
    - field: In force at
      rule: Replaces the generated "Active at" date picker. A segmented control "Now / Choose a day and time" that filters
        to menus in force then (breakfast, lunch, happy hour). Read in the outlet's Region time zone (GST for the UAE),
        not UTC.
      source: contracts/satellite/fnb.yaml#listMenus | contracts/satellite/fnb.yaml#/components/schemas/MenuAvailability
    - field: Service period (menu availability)
      rule: Day chips Mon to Sun plus a start and end wall-clock time (24-hour, HH:MM) and optional valid-from and valid-to
        dates. Leaving it empty means "always". Show the result as a sentence ("Daily 18:00 to 23:00 from 1 Nov 2026") under
        the controls.
      source: contracts/satellite/fnb.yaml#/components/schemas/MenuAvailability
    - field: Menu code
      rule: Short code, up to 64 characters, shown as a small grey label next to the name (OB-DINNER). The name (up to 200
        characters) is what everybody reads.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateMenuRequest
    - field: Bulk change
      rule: 'One action per row: Reprice (by percent or amount), Retire, Activate, Move to section, Set availability, Set
        tax; each scoped to a section or a selection of items. "Preview" is the only first button; "Apply" appears only
        after the preview has named how many items each action touches.'
      source: contracts/satellite/fnb.yaml#applyMenuActions | contracts/satellite/fnb.yaml#/components/schemas/MenuActionResult
        | F31 step 2
    - field: Publish (when)
      rule: '"Now" or "On a date". A date publish takes effect at the outlet''s local midnight in its Region''s time zone,
        so the picker is a date only, never a time. One scheduled publish per menu per date.'
      source: contracts/satellite/fnb.yaml#scheduleMenuPublish | F31 step 4
    - field: Publish (where)
      rule: Channel checkboxes with people's words (Till, Kiosk, Guest app, Guest web, Call centre, Partner); none ticked
        means every channel the outlet sells on, and the dialog says so in words.
      source: contracts/satellite/fnb.yaml#publishMenu | contracts/shared/common.yaml#/components/schemas/SalesChannel
    - field: Roll back to
      rule: A pick from the version history (newest first), defaulting to the version before the live one. Never a typed
        version number.
      source: contracts/satellite/fnb.yaml#rollbackMenu | contracts/satellite/fnb.yaml#listMenuVersions
    - field: Modifier group
      rule: Minimum and maximum selections; a minimum above zero shows the group as Required (single-select when min = max
        = 1). Each option has a price change that may be 0.00 (free) or a charge. Maximum must be at least 1 and not below
        the minimum.
      source: contracts/satellite/fnb.yaml#createModifierGroup | DI-328 | screens/P08-venue-back-office.yaml#BO-045
    outputs:
    - element: Menu list
      rule: 'One row per menu: name, outlet, service period sentence, live version ("Live v7 since 28 Oct"), and a draft
        indicator when there are unpublished changes. No ids, no raw sections array.'
      source: contracts/satellite/fnb.yaml#/components/schemas/Menu | R254
    - element: Version and schedule status
      rule: Version badges Draft, Scheduled, Live, Superseded; a version written by a rollback reads "Restored from v5".
        Pending schedules are listed pending first, then by date, each with a Cancel link.
      source: contracts/satellite/fnb.yaml#listMenuVersions | contracts/satellite/fnb.yaml#listMenuSchedules | contracts/satellite/fnb.yaml#/components/schemas/MenuSchedule
    - element: Item flags
      rule: Each item row carries small flags the Command Center asks for - "No recipe" (item not stock-tracked), "86" (unavailable,
        with reason), and the allergen verdict state. Counts for the loaded menu may head the list; venue-wide attention
        counts are not drawn.
      source: DI-325 | R283 | contracts/satellite/fnb.yaml#/components/schemas/MenuItem
    - element: Allergen verdict
      rule: Undeclared allergens first, in danger colour, each with where it came from (ingredient, substitution, modifier,
        shared equipment) and the source line; over-declared second in amber ("safe, still worth fixing"); then "Checked
        14:02 after a recipe change" or "after a manual re-check". No check yet reads "Not checked yet", not an empty panel.
      source: R241 | contracts/satellite/fnb.yaml#getAllergenVerification | contracts/satellite/fnb.yaml#/components/schemas/AllergenVerdict
    - element: Prices
      rule: In the venue currency with its own scale (AED 46.00; BHD and KWD to 3 decimals, never rounded). Bulk repricing
        previews show old and new price side by side.
      source: DI-306 | contracts/satellite/fnb.yaml#applyMenuActions
    - element: Who owns the price
      rule: 'F&B owns its prices: the F&B service has its own catalogue table (prices were migrated into F&B so ticketing
        scales on its own), so the menu item''s price is F&B''s price, and an outlet may set its own. The central catalogue
        prices tickets and single-price booths only; never draw a central catalogue price beside the menu price.'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    actions:
    - action: Create menu
      result: Creates the menu for the chosen outlet with no sections. It reaches tills and guest menus only after it is
        published; the success message says so.
      source: contracts/satellite/fnb.yaml#createMenu
    - action: Save sections
      result: Saves section order and item order. The order here is the order the cashier sees on the counter till. If someone
        else saved first (412), say "Khalid changed this menu while you were editing - reload to see his changes" and keep
        the user's edits visible.
      source: contracts/satellite/fnb.yaml#setMenuSections
    - action: Preview, then Apply (bulk change)
      result: Preview shows per action the number of items touched and which; Apply runs the same actions and shows the
        same panel as the result. Never an Apply without a preview.
      source: contracts/satellite/fnb.yaml#applyMenuActions | F31 step 2
    - action: Publish now
      result: Confirmation names the menu, the version, the outlet and its tills, the channels, and that the current live
        version becomes superseded. After publish, tills pick it up with their next catalogue bundle; an offline till keeps
        selling the previous version until it reconnects.
      source: contracts/satellite/fnb.yaml#publishMenu | F31 step 5 | screens/P08-venue-back-office.yaml#BO-045
    - action: Schedule
      result: Writes a pending schedule shown in the list. A second schedule for the same date is refused and the message
        names the existing one with a "Cancel that schedule" link.
      source: contracts/satellite/fnb.yaml#scheduleMenuPublish | F31 step 4
    - action: Roll back
      result: Confirmation states that the restored version becomes a new version and that orders already taken at the wrong
        price stay as charged (corrections are refunds or comps, not a silent reprice).
      source: contracts/satellite/fnb.yaml#rollbackMenu | F31 step 7
    - action: Re-check allergens
      result: A manual re-check of one dish; the automatic check already runs after every recipe, substitution or modifier
        change. Updates the verdict panel with trigger "manual".
      source: R241 | contracts/satellite/fnb.yaml#verifyAllergens
    - action: Give an item its choices (attach modifier groups)
      result: Refused when a group adds an allergen the dish does not declare; the message names the group and the allergen
        and offers the two ways out - update the dish's allergen claim or remove the group.
      source: contracts/satellite/fnb.yaml#attachModifierGroup
    edgeCases:
    - case: The repricing crosses the venue's approval threshold
      expected: Publishing waits for approval; the change list shows which lines need approval and by whom (as FNB-2J draws),
        and Publish is disabled with that reason.
      source: F31 step 2 | screens/P08-venue-back-office.yaml#BO-045
    - case: A menu never published
      expected: Shows "Never published" instead of a live version; tills do not have it.
      source: contracts/satellite/fnb.yaml#/components/schemas/Menu
    - case: A recipe is added to an item
      expected: The item becomes stock-tracked and can no longer be sold on an offline till; the item row shows this so
        the manager is not surprised at the next outage.
      source: contracts/satellite/fnb.yaml#setRecipe | contracts/satellite/fnb.yaml#/components/schemas/MenuItem
    - case: Outlets in different Region time zones
      expected: A schedule for "1 Nov" goes live at each outlet's local midnight; the confirmation states the local time
        ("00:00 GST, 1 Nov 2026").
      source: contracts/satellite/fnb.yaml#scheduleMenuPublish
    consistency:
    - with: BO-109
      note: Same menu, same sections and item order; BO-109 is the visual arranger of the draft and must not publish on
        its own path. See corrections for the overlap.
    - with: BO-111
      note: The allergen verdict panel is the same component, same wording and order (undeclared first).
    - with: BO-140
      note: The "86" flag and reason on an item row read exactly as on the availability screen.
    - with: POS-021
      note: Section order and item order saved here are the order the cashier sees on the counter till.
    - with: BO-011
      note: Combos (DI-328) are configured on BO-011 (createCombo, setComboSlots); a combo tile in this menu links there.
    - with: WEB-036
      note: Guests see an unavailable item as "Sold out", never a missing item (getGuestMenu).
    sampleData:
      outlet: Oasis Bistro (table service, Main Hall)
      menus:
      - name: Dinner Menu
        code: OB-DINNER
        period: Daily 18:00 to 23:00
        live: v7 since 28 Oct 2026
        draft: 14 unpublished changes
      - name: Ramadan Iftar Menu
        code: OB-IFTAR
        period: Daily 17:30 to 20:00, 1 to 30 Nov 2026
        live: never published
      pendingSchedule:
        version: v8
        effective: Mon 2 Nov 2026, 00:00 GST
        by: Khalid Al Mansoori
      bulkPreview: Reprice Grill & Mains +5% - 16 items, AED 92.40 a day at last week's mix
      items:
      - name: Lamb Ouzi
        price: AED 95.00
        flags:
        - No recipe
      - name: Classic Beef Burger
        price: AED 46.00
        verdict: Undeclared soybeans via substitution (Burger Sauce supplier change)
      - name: Chicken Machboos
        price: AED 58.00
        flags:
        - 86 - Ingredient unavailable, back at 18:00
      modifierGroup:
        name: Cooking level
        rule: Required, choose 1
        options:
        - Medium rare 0.00
        - Medium 0.00
        - Well done 0.00
    corrections:
    - what: Plumbing on the screen - a text field "Outlet id", a date picker "Active at", a table "Every menu" with id,
        outletId, availability object and sections array as columns, and a detail panel showing Menu.id.
      why: Nothing a user reads may be an id or a raw field; draw the outlet picker, the in-force control and the list described
        above.
      source: screens/P08-venue-back-office.yaml#BO-045 | R254
      status: fixed
      by: CHG-SBO-008
    - what: The "Last allergen verdict" panel says the contract exposes no read of the automatic verdict; getAllergenVerification
        now exists (it names BO-045 and BO-111) and is not declared on the screen.
      why: Without it the panel only ever shows a manual re-check, which undoes R241's automatic check.
      source: contracts/satellite/fnb.yaml#getAllergenVerification | R241
      status: fixed
      by: CHG-WIR-008
    - what: listMenuVersions and listMenuSchedules are not declared on BO-045.
      why: Rollback needs the version list to pick from and cancelling a schedule needs the pending list; F31 steps 4 and
        7 cannot be drawn without them. Both were added 26 September for exactly this.
      source: contracts/satellite/fnb.yaml#listMenuVersions | contracts/satellite/fnb.yaml#listMenuSchedules | F31 step
        7
      status: fixed
      by: CHG-WIR-008
    - what: listModifierGroups is not declared, only createModifierGroup and attachModifierGroup.
      why: Attaching an existing group (the reusable "cooked how" on nine steaks) needs the list of groups to choose from.
      source: contracts/satellite/fnb.yaml#attachModifierGroup | contracts/satellite/fnb.yaml#listModifierGroups
      status: fixed
      by: CHG-WIR-008
    - what: The approval path for a repricing above threshold (createApprovalRequest) is not on the screen.
      why: F31 branch at 2 requires it before publish, and the client's FNB-2J draws per-change approval state.
      source: F31 step 2 | screens/P08-venue-back-office.yaml#BO-045
      status: fixed
      by: CHG-WIR-008
    - what: BO-045 and BO-109 overlap. Both list menus, both save menu sections, and both point at the same client frame
        fnb-2b; BO-045 sits under the F&B hub (BO-104) and BO-109 under Sell (BO-102).
      why: Two screens editing the same section order from two hubs is the one-screen-per-concept pattern the client asked
        to end. Proposal - BO-045 is the menu home (list, versions, publish, schedule, rollback, modifiers, bulk changes,
        verdicts; frames fnb-2a, 2e, 2j, 2k); BO-109 is the arranging canvas opened from a menu ("Open in builder"), with
        no menu list of its own and one hub entry.
      source: DI-671 | DI-987 | DI-474 | screens/P08-venue-back-office.yaml#BO-109
      status: fixed
      by: CHG-SBO-008
    decisions:
    - question: Where is an F&B price owned? MenuItem.price says pricing and tax come from the catalogue variant ("a menu
        is a presentation of the catalogue"), yet applyMenuActions reprices menu items and FNB-2J shows price changes as menu
        changes.
      decision: 'F&B prices are owned by F&B: the F&B service has its own catalogue table (prices migrated into F&B so ticketing
        scales in isolation); an outlet may set its own price. The central catalogue prices tickets and single-price booths.
        Fix the stale MenuItem text (''pricing and tax come from the catalogue variant''); withdraw the F&B notes'' correction
        asking to drop the menu''s own price; check BO-045 and the F&B screens read F&B''s catalogue.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-034 | CHG-NOTE-004
      questionSource: contracts/satellite/fnb.yaml#/components/schemas/MenuItem | contracts/satellite/fnb.yaml#applyMenuActions
    - question: R197 names menu publish and rollback as escalated actions, but publishMenu and rollbackMenu carry no escalated
        permission. Is the escalation dropped (R197's "no threshold makes sense") or still owed?
      decision: 'Not answered by Chinmay: the workbook cell repeats the superseded first BO-045 price answer. The question
        (R197 escalation of menu publish/rollback) takes its drawn default.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-035 | CHG-NOTE-004
      questionSource: R197 | contracts/satellite/fnb.yaml#publishMenu
    - question: Can a scheduled publish take a time of day? The contract fixes local midnight; the client's FNB-2J frame shows
        "Tomorrow at 06:00".
      decision: 'Not answered by Chinmay: the workbook cell repeats the superseded first BO-045 price answer. The question
        (scheduled menu publish time of day) takes its drawn default.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-036 | CHG-NOTE-004
      questionSource: contracts/satellite/fnb.yaml#scheduleMenuPublish | screens/P08-venue-back-office.yaml#BO-045
  BO-046:
    summary: 'The back-office view of the kitchen rail: a manager or F&B supervisor watching one outlet''s tickets from
      a desk, not the screen at the pass (that is P15). It is for seeing what is late and for owning a queue jump (prioritise,
      with a reason). The one thing to get right is that the rail order is the server''s - priority first, then the outlet''s
      weights - and the screen never re-sorts it by arrival or promise time.'
    inputs:
    - field: Outlet and station
      rule: Outlet picker, then station chips by name (Grill, Fryer, Cold, Beverage, Pastry) from the outlet's stations;
        "All stations" default. Never a "Station id" text field.
      source: contracts/satellite/fnb.yaml#listKitchenTickets | contracts/satellite/fnb.yaml#listKitchenStations
    - field: Status filter
      rule: Chips New, Preparing, Ready, Recalled (received, preparing, ready, recalled); not a free-text field.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket
    - field: Course
      rule: A course filter (Starters, Mains, Desserts by the outlet's course names) for table-service outlets only; hidden
        for quick service. With a course chosen, tickets show only that course's lines.
      source: R277 | contracts/satellite/fnb.yaml#listKitchenTickets | contracts/satellite/fnb.yaml#/components/schemas/CourseRules
    - field: Prioritise - reason
      rule: Required, 3 to 500 characters ("VIP table, owner's guests"). Position defaults to the top of the queue; no number
        is asked for.
      source: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | R125
    outputs:
    - element: Ticket card
      rule: Order number (AQP-104582) and table label or buzzer number, order type in the vocabulary (Dine-in, Quick service,
        Room service, Collection, Delivery), covers when known, lines grouped by course with modifiers under each line,
        and the station it belongs to.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket | R210
    - element: Fired timer
      rule: Counts up from when the order or course was sent (not a countdown), resets when a course is dished out, and
        is not shown for quick-service tickets. Colour turns to warning at the outlet's warn percentage of the service-mode
        target and to late beyond the target.
      source: DI-334 | contracts/satellite/fnb.yaml#/components/schemas/KitchenSla
    - element: Prioritised marker
      rule: A small marker with who jumped the queue and why, on the card and in the detail.
      source: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | MATRIX 4.6.34
    - element: Rail order
      rule: Rendered exactly in the order returned; no sort control.
      source: contracts/satellite/fnb.yaml#listKitchenTickets
    actions:
    - action: Prioritise
      result: Moves the ticket to the top of the rail on every display of that station; recorded against the person. Success
        shows the ticket at its new place with the marker.
      source: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | R125
    - action: Next move (Start, Mark ready, Recall)
      result: If the back office may advance tickets at all, only the one allowed next move is a button on the card; never
        a status dropdown. A refused move (409) names the ticket's current status and refreshes the card.
      source: contracts/satellite/fnb.yaml#setKitchenTicketStatus
    edgeCases:
    - case: Recall after the recall window
      expected: After the venue's recall window (proposed 10 minutes from the bump) the act is a re-fire, not a recall;
        the button changes its label accordingly.
      source: contracts/spine/tenancy.yaml#/components/schemas/VenueSettings | R094
    - case: Connection lost
      expected: The rail stays visible with "Last updated 20:14" and a reconnecting banner; actions queue only where offline-capable.
      source: contracts/satellite/fnb.yaml#listKitchenTickets | contracts/satellite/fnb.yaml#prioritiseKitchenTicket
    - case: The outlet has no stations configured
      expected: Says "No kitchen stations set up for Oasis Bistro" with a link to Kitchen & Preparation Stations (BO-134),
        not "No kitchen display yet".
      source: screens/P08-venue-back-office.yaml#BO-134
    - case: An order is cancelled while its ticket is on screen
      expected: The card shows Cancelled (struck through) for a moment and leaves the rail; cancelling is done on the order,
        not here.
      source: contracts/satellite/fnb.yaml#setKitchenTicketStatus | R125
    consistency:
    - with: KIT-002
      note: Same ticket card anatomy, order type words, timer behaviour and colours as the station display.
    - with: KIT-001
      note: KIT-001 is the kitchen command centre in P15; BO-046 must not become a second command centre.
    - with: BO-020
      note: F&B Order Management also reads the rail and prioritises; see the overlap correction.
    - with: BO-134
      note: Station and display assignment is configured on BO-134 only.
    sampleData:
      outlet: Oasis Bistro
      tickets:
      - number: AQP-104582
        table: T14
        type: Dine-in
        covers: 4
        course: Mains (course 2 of 3)
        fired: '12:40'
        station: Grill
        lines:
        - 2x Classic Beef Burger - medium rare, no pickles
        - 1x Lamb Ouzi
      - number: AQP-104590
        buzzer: 841
        type: Quick service
        station: Fryer
        lines:
        - 3x Fries
        - 1x Halloumi Wrap - extra sauce
      - number: AQP-104597
        table: T22
        type: Dine-in
        prioritised: Omar Ziad - VIP table, owner's guests
    corrections:
    - what: Station configuration on a monitoring screen - the table "Every kitchen station" and the "Save kitchen stations"
        action (setKitchenStations).
      why: Configuration lives on BO-134 (and BO-135); a desk view of the rail that also rewrites routing is the bulk-attachment
        R254 removes.
      source: R254 | screens/P08-venue-back-office.yaml#BO-134
      status: fixed
      by: CHG-WIR-008
    - what: '"Save kitchen ticket status" is a modal collecting a status from all six values plus "recordedAt" and a station
        id.'
      why: Only four moves are allowed (received to preparing, preparing to ready, ready to recalled, recalled to preparing);
        served comes from handover and cancelled from cancelling the order; recordedAt is the device's own time. Draw one
        next-move button.
      source: contracts/satellite/fnb.yaml#setKitchenTicketStatus
    - what: Plumbing columns and fields - "Station id" and "Status" text fields; columns id, orderId, outletId, prioritisedByPrincipalId,
        coursing as raw values.
      why: Users read order numbers, tables, people's names and the order-type words.
      source: screens/P08-venue-back-office.yaml#BO-046 | R254
    - what: Purpose reads "Show the kitchen what to make, in order" and emptyFirstRun reads "No kitchen display yet".
      why: The screen notes say it is the back-office view, not the kitchen's screen; an empty rail is "No open tickets",
        and an outlet without stations is a separate state.
      source: screens/P08-venue-back-office.yaml#BO-046
    - what: Overlap - BO-046, BO-020 (F&B Order Management) and KIT-001 (Kitchen Operations Command Center) all read the
        rail and prioritise tickets.
      why: Three rail views for one manager is what DI-671 asks to consolidate; propose folding BO-046 into BO-020 as its
        "Kitchen rail" tab.
      source: DI-671 | DI-987 | screens/P15-kitchen-display.yaml#KIT-001
    decisions:
    - question: Does the back office advance tickets at all, or only watch and prioritise? And with Allam's position that
        Softlabs need only an integration point to an existing KDS (DI-077) against the full P15 app, is a back-office rail
        view needed in r1?
      decision: 'Drawn default stands (answer: "Watch + prioritise only"): Draw read-only rail plus Prioritise; no status
        moves from the back office.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-180 | CHG-NOTE-004
      questionSource: DI-077 | contracts/satellite/fnb.yaml#listKitchenTickets
  BO-048:
    summary: 'Retail Products is where a venue manager sets up what each shop sells. A merchandise item links a catalogue
      variant (which carries the price and VAT) to an outlet and to the inventory item that a sale depletes. The one thing
      to get right is that link. An item with no stock link sells but never runs out, and the venue''s stock figures become
      fiction.

      '
    inputs:
    - field: Outlet
      rule: 'Picker of the venue''s retail outlets (Marina Bay Store, Beach Hut, Main Gate Kiosk). Merchandise rows are
        per outlet (outlet-level configuration), so the same T-shirt sold in two shops is two rows. Never a text field for
        an id.

        '
      source: DI-330 | DI-350 | contracts/satellite/retail.yaml#/components/schemas/MerchandiseItem
    - field: Product and variant
      rule: 'Chosen as product, then its size/colour combination (for example "Aqua Park logo T-shirt" → Green / M), from
        the catalogue. Price and VAT come from the variant and are shown read-only, with a link to edit pricing in the catalogue.
        The form never asks for a variant id.

        '
      source: DI-354 | contracts/satellite/retail.yaml#createMerchandise
    - field: Stock item
      rule: 'Picker of inventory items (name, SKU, base unit). It looks mandatory. Leaving it empty needs an explicit choice,
        "Not stock-tracked (sells without running out)", and shows a warning.

        '
      source: contracts/satellite/retail.yaml#/components/schemas/MerchandiseItem | DI-294
    - field: SKU / Barcode
      rule: 'SKU up to 64 characters, e.g. TSH-AQP-GRN-M. Barcode up to 128 characters, unique in the venue. On a duplicate
        the save fails inline with "This barcode is already used by another item in this venue". SKU and outlet cannot change
        after creation; show them read-only on edit.

        '
      source: contracts/satellite/retail.yaml#createMerchandise | contracts/satellite/retail.yaml#updateMerchandise
    - field: Returns
      rule: '"Returnable" on by default. When on, "Return window (days)" shows. When empty, the window is the outlet''s
        return policy default, and that default is shown as the placeholder.

        '
      source: contracts/satellite/retail.yaml#/components/schemas/ReturnPolicy | R215
    - field: Requires serial number
      rule: 'Off by default. On, the till asks for the serial at sale, and the item appears in serialised stock (BO-114
        / EMP-069).

        '
      source: DI-406 | contracts/satellite/retail.yaml#createMerchandise
    - field: Guest description and image
      rule: 'The description is the guest''s words and is indexed for guest-app search. Show a character count and a guest-card
        preview.

        '
      source: contracts/satellite/retail.yaml#/components/schemas/MerchandiseItem
    outputs:
    - element: Product list
      rule: 'Grouped by product, with outlet rows beneath: image thumbnail, name, variant (size/colour), SKU, barcode, outlet,
        price (AED, 2 decimals, VAT-inclusive as the shop shows it), on hand, status (Active / Inactive). Badges for "Not
        stock-tracked" and "Serialised". Filters: outlet, category, "In stock only", search.

        '
      source: contracts/satellite/retail.yaml#listMerchandise | DI-353
    - element: Inactive items
      rule: 'Shown in the list greyed with "Inactive". Explain that an inactive item scans as "not found" at the till.

        '
      source: R215 | contracts/satellite/retail.yaml#lookupMerchandise
    actions:
    - action: Add merchandise item
      result: 'Primary action. Saves and the row appears under its product. If the barcode is in use, nothing is saved and
        the field shows the error.

        '
      source: contracts/satellite/retail.yaml#createMerchandise
    - action: Save changes
      result: 'Edits name, description, barcode, category, stock item, image, returns and serial flag, or deactivates the
        item. Re-pointing the stock item asks for confirmation: "Sales from now on will deplete <new item>. Past sales keep
        their movements."

        '
      source: contracts/satellite/retail.yaml#updateMerchandise
    edgeCases:
    - case: Item has no stock link
      expected: 'Row badge "Not stock-tracked". Detail panel warning: "This item will sell without reducing stock." Offer
        "Link a stock item".

        '
      source: contracts/satellite/retail.yaml#/components/schemas/MerchandiseItem
    - case: Search returned nothing vs nothing set up
      expected: Two different empty states. A search that matches nothing names the search and offers to clear it.
      source: screens/P08-venue-back-office.yaml#BO-048
    consistency:
    - with: BO-008
      note: 'Variants (size/colour), price and the variant''s barcode are set in Product Detail & Variants. This screen
        picks them and shows them read-only.

        '
    - with: POS-023
      note: The barcode entered here is the one the till scans to price-check and sell.
    - with: BO-142
      note: The return window default comes from the outlet's return policy, the same rule the till applies.
    sampleData:
    - product: Aqua Park logo T-shirt
      variant: Green / M
      sku: TSH-AQP-GRN-M
      barcode: '6291100456781'
      outlet: Marina Bay Store
      price: AED 89.00
      onHand: 42
      returnable: true
      returnWindowDays: 14
    - product: Kids swim goggles
      variant: Blue
      sku: GOG-KID-BLU
      barcode: '6291100456798'
      outlet: Beach Hut
      price: AED 35.00
      onHand: 120
    - product: Waterproof phone pouch
      variant: Black
      sku: ACC-PCH-BLK
      outlet: Main Gate Kiosk
      price: AED 25.00
      stock: Not stock-tracked
    corrections:
    - what: 'The filters are text fields "Outlet id" and "Category id". The table is "Every merchandise" with id, variantId,
        inventoryItemId and outletId columns. The create modal collects variantId and inventoryItemId as raw fields.

        '
      why: These leak plumbing. They must be pickers and plain labels.
      source: screens/P08-venue-back-office.yaml#BO-048 | R254
      status: fixed
      by: CHG-SBO-008
    - what: The primary button is "Lookup merchandise" (the shop-floor price check).
      why: 'On a back-office product list, search covers lookup. The primary act is adding an item. The price check belongs
        to the till and the handheld.

        '
      source: contracts/satellite/retail.yaml#lookupMerchandise
      status: fixed
      by: CHG-WIR-008
    - what: 'A barcode exists in three places: the catalogue variant (updateProductVariant), the merchandise item and the
        inventory item.

        '
      why: 'The client agreed one distinct barcode per variant. The till''s lookup matches the merchandise barcode. Three
        writable copies will disagree. One should be the source of truth and the others derived or read-only.

        '
      source: DI-354 | contracts/spine/catalogue.yaml#updateProductVariant | contracts/satellite/retail.yaml#lookupMerchandise
        | contracts/satellite/inventory.yaml#/components/schemas/CreateInventoryItemRequest
      status: fixed
      by: CHG-WIR-008
    - what: 'The flow transition to GST-026 ("Guest tracks it in the app") and the F17 shop-and-drop steps are attached
        to this configuration screen.

        '
      why: 'Shop-and-drop collection is a till and guest journey. The F17 steps that name listMerchandise for "bag dropped"
        and "collected" belong to the shop-and-drop operations.

        '
      source: F17 step 3 | F17 step 5 | R251
      status: fixed
      by: CHG-CLN-005
    decisions:
    - question: 'Should a merchandise item require a stock link? Sales are gated on system stock per venue, and an unlinked
        item cannot be gated.

        '
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw the stock item as required, with an
        explicit "Not stock-tracked" escape and a warning.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-037 | CHG-NOTE-004
      questionSource: DI-294 | contracts/satellite/retail.yaml#createMerchandise
    - question: The client asked for a product command centre (products per store, top sellers, by category). Which reads
        feed it?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): No KPI tiles on this screen until a summary
        read exists.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-038 | CHG-NOTE-004
      questionSource: DI-353 | R283
  BO-049:
    summary: 'Stock Levels answers "what is on the shelf, and where" for one venue: on hand, allocated and available, by
      item and by stock location, valued where the user may see value. It is the storekeeper''s start screen (F92 step 1)
      and the place a short store raises a transfer (F35 step 1). The one thing to get right is that available is on hand
      minus allocated, and a negative position is shown as negative, never hidden or clamped to zero.

      '
    inputs:
    - field: Location
      rule: 'A tree picker over the venue''s stock locations, following the warehouse hierarchy (for example Main Store
        > Food Store > Cold Room). Choosing a parent includes its children. Default is "All locations". Never a text field
        for an id.

        '
      source: DI-345 | contracts/satellite/inventory.yaml#/components/schemas/StockLocation
    - field: Item search
      rule: 'Name, SKU or barcode, with scan support on a device that has a scanner. Sends the chosen item as the item filter.

        '
      source: contracts/satellite/inventory.yaml#lookupInventoryItem | DI-233
    - field: Show zero stock
      rule: Off by default. On, it lists items with nothing on hand at the location (the out-of-stock check).
      source: contracts/satellite/inventory.yaml#getStockPositions | DI-340
    outputs:
    - element: Stock table (the main list)
      rule: 'One row per item and location: item name, SKU, location, On hand, Allocated, Available, unit, value, last counted,
        last movement. Show Available most prominently, because it is what a sale or an issue can still draw on. Label the
        three numbers "On hand", "Allocated" and "Available", never "Inventory". Sort by Available ascending so problems
        come first.

        '
      source: R171 | DI-361 | contracts/satellite/inventory.yaml#/components/schemas/StockPosition
    - element: Negative positions
      rule: 'Shown with a minus sign and an alert colour, for example "-4 pcs". Never shown as 0. A position that cannot
        go negative hides an oversell that already happened.

        '
      source: F35 step 6
    - element: Low / out of stock flags
      rule: '"Below reorder point" when the item''s flag is set. "Out of stock" when on hand is zero or less. These are
        the client''s command-centre indicators.

        '
      source: DI-340 | DI-345 | contracts/satellite/inventory.yaml#/components/schemas/InventoryItem
    - element: Stock value panel
      rule: 'Total value as at today, by location and by category, in AED with 2 decimals. Visible only to users who hold
        the ledger-view right. For others the value column and panel are absent (not zero). Valued by each item''s own costing
        method, so the panel carries the note "Valued at each item''s costing method (weighted average or FIFO)".

        '
      source: contracts/satellite/inventory.yaml#getStockValuation | DI-344
    - element: In transit
      rule: 'Stock dispatched on a transfer and not yet received belongs to neither location. Show it as a separate "In
        transit" line in the value panel, so the totals reconcile.

        '
      source: contracts/satellite/inventory.yaml#createStockTransfer
    actions:
    - action: Transfer stock
      result: 'Opens the transfer form with the selected item and its location prefilled as the source (Stock Transfers,
        BO-080, owns the full form). The server refuses with "Not enough stock at <location>" when the source is short.
        Success shows the transfer number and the item as "In transit".

        '
      source: F35 step 1 | contracts/satellite/inventory.yaml#createStockTransfer
    - action: Adjust stock
      result: 'Opens the adjustment form (Stock Movements, BO-082, owns it): Adjustment in, Adjustment out, Waste or Issue,
        with a positive quantity and a required reason. The list refreshes with the new balance.

        '
      source: R171 | contracts/satellite/inventory.yaml#createStockMovement
    - action: Open item / Count this item
      result: 'Row links to the item record (BO-081) and to Stock Count (BO-079) to start a spot count on that item.

        '
      source: F92 step 1 | F35 step 8
    edgeCases:
    - case: The user has stock rights but not the ledger-view right
      expected: 'Quantities show and value is hidden. This is a partial-access state, not an error. The no-access state
        applies only when stock positions themselves are refused.

        '
      source: contracts/satellite/inventory.yaml#getStockValuation | contracts/satellite/inventory.yaml#getStockPositions
    - case: Online orders already took stock that a delivery was expected to cover (oversell)
      expected: 'The position goes negative and the row says so. Nothing on this screen refuses it. Resolution is a transfer
        from another store, or a refund recorded as an oversell.

        '
      source: F35 step 5 | F35 step 6
    - case: Offline device
      expected: 'Positions read from cache with a "Last updated hh:mm" stamp. Adjustments are not offered offline, because
        stock depletion is real time.

        '
      source: contracts/satellite/inventory.yaml#getStockPositions | contracts/satellite/inventory.yaml#createStockMovement
    consistency:
    - with: EMP-062
      note: The same three numbers with the same labels, in the same order (On hand · Allocated · Available).
    - with: POS-023
      note: 'Available here is what the till and web shop sell against. A sale is gated on system stock per venue, not physical
        stock.

        '
    - with: BO-050
      note: The value panel and BO-050 use one valuation read. Same figures, same "as at" date.
    sampleData:
      locations:
      - Main Store
      - Main Store > Food Store
      - Main Store > Beverage Store
      - Oasis Bistro Kitchen
      - Pool Bar
      - Marina Bay Retail Floor
      rows:
      - item: Coca-Cola 330 ml can
        sku: BEV-CC-330
        location: Pool Bar
        onHand: 182
        allocated: 0
        available: 182
        unit: can
        value: AED 345.80
      - item: Full-cream milk 2 L
        sku: DRY-MLK-2L
        location: Oasis Bistro Kitchen
        onHand: 6
        allocated: 0
        available: 6
        unit: bottle
        flag: Below reorder point
      - item: Aqua Park logo T-shirt, green, M
        sku: TSH-AQP-GRN-M
        location: Marina Bay Retail Floor
        onHand: 3
        allocated: 7
        available: -4
        unit: pcs
        flag: Negative
      valuation:
        asAt: '2026-10-14'
        total: AED 412,906.35
        inTransit: AED 3,120.00
    corrections:
    - what: 'The main list is "Every stock location" (location rows with id, code, parent id, active). Stock positions sit
        only in a side panel.

        '
      why: 'The screen''s purpose is what is on the shelf. Positions are the list; locations are a filter (tree). Raw id
        columns leak plumbing.

        '
      source: screens/P08-venue-back-office.yaml#BO-049 | R254
    - what: '"Save item availability" (the F&B 86 operation, setItemAvailability) is the primary button.'
      why: '86 acts on a menu item, not a stock item, and has its own screen (BO-140, Product Availability & 86). On Stock
        Levels it is attached by resemblance.

        '
      source: R254 | R110 | contracts/satellite/fnb.yaml#setItemAvailability
      status: fixed
      by: CHG-WIR-008
    - what: '"No results" is declared as never shown because the location list takes no filter.'
      why: 'Stock positions do take filters (location, item, include zero), so a filter that matches nothing is a real state.

        '
      source: contracts/satellite/inventory.yaml#getStockPositions
    - what: The first-run state offers "Create stock transfer".
      why: 'With no items or locations there is nothing to transfer. First run should point to setting up locations and
        items (BO-081).

        '
      source: designer default
    decisions:
    - question: 'The client''s command centre asks for "low-stock / critical / out-of-stock". The contract has only "below
        reorder point" and zero. What makes an item "critical"?

        '
      decision: 'Drawn default accepted: Draw two flags, "Below reorder point" and "Out of stock". No "Critical" badge until
        it is defined.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-284 | CHG-NOTE-004
      reviewable: true
      questionSource: DI-340
    - question: 'Does Allocated include merchandise held for collection and online orders awaiting pickup or shipment, or
        only inventory stock reservations?

        '
      decision: 'Drawn default accepted: Draw Allocated as one number, with a tooltip "Reserved for orders and collections".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-285 | CHG-NOTE-004
      reviewable: true
      questionSource: DI-361 | R171 | contracts/satellite/retail.yaml#reserveMerchandise
  BO-050:
    summary: 'Stock Position & Valuation is the finance-facing view of stock: what the venue''s stock is worth on a date,
      by location and by category, under each item''s costing method (weighted average or FIFO). It is read-only. The one
      thing to get right is that it is a valuation report, not a counting screen. The current definition is half renamed
      from "Stock Count".

      '
    inputs:
    - field: As at
      rule: A date. Default today. A past date gives the value on that date (served from the reporting replica, so allow
        for a short lag).
      source: contracts/satellite/inventory.yaml#getStockValuation
    - field: Location
      rule: Tree picker as on Stock Levels; default all locations.
      source: DI-345
    outputs:
    - element: Headline
      rule: 'Total stock value in AED with 2 decimals, the as-at date, and the item count. Out-of-stock item count beside
        it.

        '
      source: DI-342 | contracts/satellite/inventory.yaml#/components/schemas/StockValuation
    - element: Breakdown
      rule: 'Two tables: by location (value and item count) and by category (value). Sort by value, highest first. A bar
        per row is enough; no pie chart.

        '
      source: DI-342 | DI-041
    - element: Costing method note
      rule: 'One line under the headline: "Each item is valued at its own costing method: weighted average or FIFO." Name
        the method on the item rows when drilling in (from the item master).

        '
      source: DI-344 | contracts/satellite/inventory.yaml#/components/schemas/CostingMethod
    edgeCases:
    - case: User can see stock but not ledger value
      expected: The valuation needs the ledger-view right. Without it, say "Stock value is visible to finance roles", and
        link to Stock Levels for quantities.
      source: contracts/satellite/inventory.yaml#getStockValuation
    - case: As-at date before the venue's first stock movement
      expected: Show zero value with "No stock recorded on this date", not an error.
      source: designer default
    consistency:
    - with: BO-049
      note: Same valuation read and same totals as the Stock Levels value panel.
    - with: BO-081
      note: The costing method shown per item is the one set (and locked) on the item master.
    sampleData:
      asAt: '2026-10-31'
      total: AED 412,906.35
      itemCount: 1284
      outOfStock: 37
      byLocation:
      - location: Main Store
        value: AED 198,440.10
        items: 612
      - location: Oasis Bistro Kitchen
        value: AED 41,215.75
        items: 188
      - location: Marina Bay Retail Floor
        value: AED 96,780.00
        items: 341
      byCategory:
      - category: Beverages
        value: AED 88,302.40
      - category: Apparel
        value: AED 71,950.00
    corrections:
    - what: 'The route is /venue-operations/stock-count and the component StockCountDetail.tsx. The purpose reads "Count
        the shelf and account for the difference". The pattern is a single-record status tracker.

        '
      why: 'The 20 August rename stopped at the name. Stock counting is BO-079. This screen is a read-only valuation report,
        so it needs a valuation route and component name, a valuation purpose and a report pattern.

        '
      source: screens/P08-venue-back-office.yaml#BO-050
    - what: The no-access state names only the stock-view permission.
      why: 'Valuation needs the ledger-view permission. A user with only stock view sees a broken page rather than an explanation.

        '
      source: contracts/satellite/inventory.yaml#getStockValuation
    - what: 'The client asked for a breakdown by department and sub-department. The valuation returns only by location and
        by category.

        '
      why: Department is not a valuation dimension in the contract.
      source: DI-342 | contracts/satellite/inventory.yaml#/components/schemas/StockValuation
    decisions:
    - question: 'Item costing offers four methods (weighted average, FIFO, standard cost, last purchase price). The workshop
        agreed weighted average and FIFO. Should the other two be offered?

        '
      decision: 'Drawn default accepted: The note names weighted average and FIFO only. The item form (BO-081) offers those
        two.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-286 | CHG-NOTE-004
      reviewable: true
      questionSource: DI-344 | MATRIX 4.5.35
  BO-051:
    summary: 'Purchase Orders is where the buyer turns an approved requisition and its chosen quotation into an order, sends
      it, records the supplier''s acknowledgement, and later cancels it or closes it short. The one thing to get right is
      the chain: no order without an approved requisition and a selected quotation, with the price taken from the quotation
      and changed only with a reason. Cancelling or short-closing goes to a finance approver.

      '
    inputs:
    - field: Requisition
      rule: 'Picker limited to approved requisitions of this venue (number, department, required-by date, estimated total).
        It is the first field and drives the rest.

        '
      source: contracts/satellite/inventory.yaml#createPurchaseOrder | DI-348
    - field: Quotation
      rule: 'Picker of the quotations recorded for that requisition, showing supplier, total, lead time and validity. "Lowest
        total" and "Shortest lead time" badges as in the comparison. Choosing one sets the supplier, which is read-only
        on the order.

        '
      source: contracts/satellite/inventory.yaml#compareQuotations | R171
    - field: Lines
      rule: 'Prefilled from the quotation: item, quantity, unit, unit price. Quantity may be lowered, not raised beyond
        the approved quantity. If the unit price is changed, the line shows the quoted price beside it and asks for a price
        reason inline. Without the reason the order cannot be raised.

        '
      source: R171 | contracts/satellite/inventory.yaml#/components/schemas/CreatePurchaseOrderRequest
    - field: Deliver to
      rule: 'Location picker. Default is the venue''s main store. Choosing an outlet kitchen is allowed for fast-moving
        perishables received directly.

        '
      source: DI-345 | contracts/satellite/inventory.yaml#/components/schemas/PurchaseOrder
    - field: Expected delivery
      rule: 'Date, required, not in the past. It is the date supplier on-time performance is measured against.

        '
      source: contracts/satellite/inventory.yaml#createPurchaseOrder | contracts/satellite/reporting.yaml#getSupplierPerformance
    - field: Status filter / Supplier filter
      rule: Status as chips (see outputs). Supplier as a searchable picker of the tenant's suppliers. Not text fields.
      source: contracts/satellite/inventory.yaml#listPurchaseOrders
    outputs:
    - element: Order list
      rule: 'Columns: PO number (e.g. PO-AQP-000214), supplier, type, status, expected delivery, total (AED incl. 5% VAT),
        received progress ("12 of 20 lines"). A row awaiting a finance decision shows a "Pending approval" badge beside
        its status ("Cancellation pending approval" or "Close-short pending approval"). Never an approval id.

        '
      source: R144 | R171 | contracts/satellite/inventory.yaml#/components/schemas/PurchaseOrder
    - element: Status labels
      rule: 'Raised (not yet sent, still editable by us), Sent, Acknowledged, Partly received, Received, Closed short, Cancelled.
        Use exactly these words.

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/PurchaseOrderStatus | contracts/satellite/inventory.yaml#sendPurchaseOrder
    - element: Order detail
      rule: 'Header: supplier, supplier''s reference (once acknowledged), deliver-to, requisition number (linked), quotation
        (linked to the comparison). Lines: item, ordered, received, outstanding, unit price, quoted price (struck through
        with the reason, when overridden), line total. Footer: subtotal, VAT 5%, total.

        '
      source: contracts/satellite/inventory.yaml#getPurchaseOrder
    - element: Printable / sendable order
      rule: A clean PO document (venue legal name, TRN, supplier, lines, VAT, total, delivery address and date) for sending.
      source: designer default
    actions:
    - action: Raise purchase order
      result: 'Creates the order in Raised with its number assigned by the server (per venue, in sequence). Refused when
        the requisition is not approved or the quotation does not belong to it. Say which, and offer the requisition.

        '
      source: R171 | contracts/satellite/inventory.yaml#createPurchaseOrder
    - action: Send to supplier
      result: 'Confirm "Send PO-AQP-000214 to Gulf Fresh Dairy LLC? After sending, the order can no longer be changed."
        The status becomes Sent.

        '
      source: contracts/satellite/inventory.yaml#sendPurchaseOrder
    - action: Record acknowledgement
      result: 'Asks for the supplier''s own order reference. Optional in practice: goods often arrive without one. It feeds
        supplier performance.

        '
      source: contracts/satellite/inventory.yaml#acknowledgePurchaseOrder
    - action: Cancel order
      result: 'Only for Raised or Sent orders. Asks for a reason (at least 3 characters) and names the order, the supplier
        and the value not yet received. If finance approval is needed, the order stays as it is with "Cancellation pending
        approval". It cancels when the finance approver agrees, and the requester can never approve it. A partly received
        order offers "Close short" instead.

        '
      source: R144 | contracts/satellite/inventory.yaml#cancelPurchaseOrder
    - action: Close short
      result: 'For a partly received order. Asks for a reason and names the balance that will no longer be expected. It
        goes to a finance approver ("Close-short pending approval"). Closing writes off a committed cost.

        '
      source: R144 | contracts/satellite/inventory.yaml#closePurchaseOrderShort
    edgeCases:
    - case: Supplier put on hold after the quotation was recorded
      expected: 'A supplier on hold stops appearing in new orders. Show the quotation as not selectable, with "Supplier
        on hold".

        '
      source: contracts/satellite/inventory.yaml#updateSupplier
    - case: Quotation expired (valid-until passed)
      expected: Show it as expired in the picker. Raising against it is the buyer's call; show the warning.
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateQuotationRequest
    - case: Approval request rejected by finance
      expected: The badge clears and the order is unchanged. Show the approver's note in the order history.
      source: R144
    - case: Minimum order value
      expected: 'If the order total is below the supplier''s minimum order value, warn before raising. The contract does
        not refuse it.

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/Supplier
    consistency:
    - with: BO-078
      note: 'The requisition, its approved quantities and its quotation comparison come from Requisitions. "Raise purchase
        order" on an approved requisition opens this form prefilled.

        '
    - with: BO-052
      note: Received and outstanding quantities update from goods receipts. The same status words are used on both screens.
    - with: BO-084
      note: Cancel and close-short approvals appear in the finance approver's queue there.
    sampleData:
    - number: PO-AQP-000214
      supplier: Gulf Fresh Dairy LLC
      type: Regular
      status: Sent
      expectedDelivery: '2026-10-16'
      deliverTo: Oasis Bistro Kitchen
      lines:
      - item: Full-cream milk 2 L
        ordered: 60
        unit: bottle
        unitPrice: AED 12.50
        lineTotal: AED 750.00
      - item: Greek yoghurt 1 kg
        ordered: 24
        unit: tub
        unitPrice: AED 18.75
        quoted: AED 17.90
        priceReason: Supplier price increase from 1 Oct, confirmed by email
        lineTotal: AED 450.00
      subtotal: AED 1,200.00
      vat: AED 60.00
      total: AED 1,260.00
    - number: PO-AQP-000209
      supplier: Emirates Beverage Trading LLC
      status: Partly received
      badge: Close-short pending approval
      total: AED 8,412.60
    corrections:
    - what: 'PO types do not match the agreed decision. The client agreed three types: Regular (item, quantity, price),
        Contract (pre-agreed fixed price for a period, picked up automatically on later orders) and Service (non-inventory
        items and services). The contract''s PurchaseOrder.kind is standard / blanket / release / rfqAward.

        '
      why: 'Regular maps to standard. Contract maps only partly to blanket plus release: the supplier contract record has
        no price lines, so nothing can "auto-pick" a contract price. Service has no counterpart: every PO line needs an
        inventory item and every receipt adds stock. rfqAward is a sourcing origin, not a type, because every standard order
        already needs a quotation. Also, the create request has no type field and requires a requisition and a quotation,
        so blanket, release and rfqAward orders cannot be created at all, although the schema says they are "raised without
        one". Proposed: kind = regular / contract (with releases) / service, with RFQ kept as an origin (rfqId). Until decided,
        draw the Regular path fully. Show the type selector with Contract and Service as a second, clearly pending frame.
        Never show the labels "blanket" or "rfqAward".

        '
      source: DI-348 | TRACKER Workshops/Actions row 91 | contracts/satellite/inventory.yaml#/components/schemas/PurchaseOrder
        | contracts/satellite/inventory.yaml#/components/schemas/CreatePurchaseOrderRequest | contracts/satellite/inventory.yaml#/components/schemas/InventorySupplierContract
    - what: 'The list shows a match-status column (matched / price variance / quantity variance) and the order has a supplier
        invoice reference, but no operation records a supplier invoice or sets the match status.

        '
      why: 'Three-way match has only two legs. The column would always be empty. Hide it until an invoice-capture operation
        exists, or add one.

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/PurchaseOrder
    - what: The order is "still ours to change" while Raised, but no operation updates a raised order.
      why: A wrong line on a raised order can only be fixed by cancelling (which may need finance approval) and raising
        again.
      source: contracts/satellite/inventory.yaml#sendPurchaseOrder
    - what: The filters are text fields "Status" and "Supplier id". The list shows approvalRequestId as a column.
      why: These leak plumbing. Use status chips, a supplier picker and a "Pending approval" badge.
      source: screens/P08-venue-back-office.yaml#BO-051
    decisions:
    - question: 'How does "Send to supplier" reach the supplier: an emailed PDF from TICVAI, or a status change after the
        buyer sends it themselves?

        '
      decision: 'Drawn default accepted: Draw "Send" as emailing a PDF to the supplier''s contact email, with a "Download
        PDF" secondary action.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-287 | CHG-NOTE-004
      reviewable: true
      questionSource: contracts/satellite/inventory.yaml#sendPurchaseOrder
    - question: Is the proposed PO number format PO-<venue code>-<six-digit sequence> accepted?
      decision: 'Drawn default accepted: Use PO-AQP-000214 in all mock-ups.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-288 | CHG-NOTE-004
      reviewable: true
      questionSource: R171
  BO-052:
    summary: 'Goods Receipt is where the storekeeper books in what actually arrived against a purchase order. Partial deliveries
      are normal. Batch and expiry are captured per line. Over-delivery beyond the tolerance is refused, and damaged or
      wrong goods are rejected by receipt line. The one thing to get right is that a receipt records what arrived, line
      by line and batch by batch. It is not a confirmation of the order. The screen must not also be the purchase-order
      and transfer screen it currently is.

      '
    inputs:
    - field: Purchase order
      rule: 'Chosen from "Expected deliveries": orders that are Sent, Acknowledged or Partly received for this venue, soonest
        expected first. Searchable by PO number, supplier or delivery note.

        '
      source: contracts/satellite/inventory.yaml#listPurchaseOrders | contracts/satellite/inventory.yaml#createGoodsReceipt
    - field: Receive into
      rule: Location picker. Defaults to the order's deliver-to location.
      source: DI-345 | contracts/satellite/inventory.yaml#/components/schemas/CreateGoodsReceiptRequest
    - field: Delivery note number
      rule: Optional, up to 128 characters. Printed on the supplier's delivery note.
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateGoodsReceiptRequest
    - field: Received quantity (per line)
      rule: 'Blank by default, with a "Receive as ordered" shortcut per line and for all lines. Show ordered, already received
        and outstanding beside it. The maximum allowed is outstanding plus the venue''s over-receipt tolerance (proposed
        5%). Show the limit, e.g. "Up to 63".

        '
      source: R094 | contracts/satellite/inventory.yaml#createGoodsReceipt
    - field: Batch and expiry (per line)
      rule: 'Batch number up to 64 characters. The expiry date is required for perishable items (flagged on the item master).
        One order line can be split into several batch lines ("Add batch"), because one item can arrive on two batches with
        two expiry dates.

        '
      source: R171 | DI-345 | contracts/satellite/inventory.yaml#/components/schemas/CreateGoodsReceiptRequest
    outputs:
    - element: Receipt confirmation
      rule: 'Receipt number (venue prefix plus sequence, e.g. AQP-GR-000431), lines received, total value, and "Stock updated".
        "Accrual posted" shows as text, never as a journal id. The order''s status moves to Partly received or Received.

        '
      source: R152 | contracts/satellite/inventory.yaml#/components/schemas/GoodsReceipt
    - element: Receipt history
      rule: 'Per order: each receipt with date, receiver, delivery note, lines, rejected quantities with reasons.

        '
      source: contracts/satellite/inventory.yaml#listGoodsReceipts
    actions:
    - action: Post receipt
      result: 'Adds stock and creates the accrual. Refused for over-receipt beyond the tolerance. Name the line and the
        maximum. Refused if the order was closed meanwhile.

        '
      source: R094 | contracts/satellite/inventory.yaml#createGoodsReceipt
    - action: Reject lines
      result: 'Pick receipt lines (each batch or expiry line), the quantity rejected and a reason: Damaged, Wrong item,
        Quality failure, Short-dated, Over-delivery, Other. Other requires a note of at least 3 characters. The rejection
        reverses the stock and raises a supplier return. The dialog names the receipt and the lines.

        '
      source: R171 | R222 | contracts/satellite/inventory.yaml#rejectReceivedGoods
    edgeCases:
    - case: A chilled or frozen delivery arrives warm
      expected: 'The temperature is recorded before the receipt is posted, and the delivery is refused at the door. On the
        handheld this is Receiving (EMP-065). Here, show the cold-chain reading on the receipt if one was taken.

        '
      source: F28 step 1 | contracts/satellite/fnb.yaml#logColdChain
    - case: The same item arrives on two batches
      expected: Two receipt lines for one order line. A rejection can name one batch and leave the other.
      source: R171
    - case: Partial delivery and the rest will never come
      expected: The order stays Partly received. Link to Purchase Orders to close it short (finance approval).
      source: R144 | contracts/satellite/inventory.yaml#closePurchaseOrderShort
    consistency:
    - with: EMP-065
      note: 'The same receipt form in handheld layout: same fields, same reasons, same tolerance message. The handheld is
        where most receipts happen.

        '
    - with: BO-051
      note: Same status words. Order lifecycle actions (send, cancel, close short) live only on Purchase Orders.
    - with: BO-083
      note: Rejections and lateness feed supplier performance (on time in full, rejection reasons).
    sampleData:
      order: PO-AQP-000214 · Gulf Fresh Dairy LLC · expected 16 Oct 2026
      deliveryNote: GFD-DN-778120
      receivedAt: 2026-10-16 07:42 GST
      lines:
      - item: Full-cream milk 2 L
        ordered: 60
        received: 36
        batch: L2610A
        expiry: '2026-10-23'
      - item: Full-cream milk 2 L
        ordered: (same line)
        received: 24
        batch: L2610B
        expiry: '2026-10-24'
      - item: Greek yoghurt 1 kg
        ordered: 24
        received: 20
        rejected: 4
        reason: Damaged
      receiptNumber: AQP-GR-000431
      totalValue: AED 1,125.00
    corrections:
    - what: 'The screen carries the purchase-order lifecycle (raise, send, acknowledge, cancel, close short) and the transfer
        actions (close transfer short, read a transfer).

        '
      why: 'The order lifecycle belongs to BO-051, and transfers to BO-080. F76 step 5 and F92 step 5 attached them here
        before BO-051 existed in the chain. Keep receipt, rejection, the order list for picking, and receipt history.

        '
      source: R254 | F76 step 5 | F92 step 5 | screens/P08-venue-back-office.yaml#BO-051
      status: fixed
      by: CHG-WIR-008
    - what: 'F35 step 4 receives the remainder of a stock transfer with createGoodsReceipt. F15 branch at 4 answers a short
        delivery with closeTransferShort.

        '
      why: 'A goods receipt needs a purchase order. A transfer is received with receiveStockTransfer, and a short purchase
        order is closed with closePurchaseOrderShort. The flows mix the two chains.

        '
      source: F35 step 4 | F15 step 4 | contracts/satellite/inventory.yaml#receiveStockTransfer
      status: fixed
      by: CHG-WIR-008
    - what: The rejection reasons are a fixed list.
      why: The client asked for a user-defined reason list that can be extended in the backend without development.
      source: DI-363 | contracts/satellite/inventory.yaml#rejectReceivedGoods
    - what: The filters are text fields "Status" and "Supplier id". Both tables show every raw column (ids, scope path,
        journal id).
      why: These leak plumbing.
      source: screens/P08-venue-back-office.yaml#BO-052
    decisions:
    - question: Is the over-receipt tolerance of 5% accepted as the tenant default?
      decision: 'Drawn default accepted: Show "Up to <outstanding + 5%>".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-289 | CHG-NOTE-004
      reviewable: true
      questionSource: R094
  BO-065:
    summary: 'The venue''s own settings, which everything at the venue inherits: the configured limits (cart hold, resale/exchange/reschedule
      cut-offs, shift variance threshold, F&B recall window and comp escalation, food-safety lead, stock-count tolerances…),
      support and quiet hours, biometrics, segregated access, alerting, display currencies and guest two-step verification;
      the refund policy; and where food can be delivered. One thing to get right: every limit left empty inherits the tenant
      default, and the screen shows that default and where each value comes from.

      '
    inputs:
    - field: Every configured limit
      rule: 'Empty means "use the tenant default"; the placeholder shows that default ("Tenant default: 15 min") and a "Use
        default" control clears an override. Save replaces the whole record, so the form always sends every field it loaded.

        '
      source: R094 | contracts/spine/tenancy.yaml#setVenueSettings | contracts/spine/tenancy.yaml#getVenueSettingsDefaults
    - field: Shift variance threshold
      rule: Money in the venue currency, 0 to 1,000; proposed tenant default AED 20.00, over or short.
      source: R094 | contracts/spine/tenancy.yaml#/components/schemas/VenueSettings
    - field: Cart hold
      rule: Shown in minutes (stored as seconds, 30–3,600); default 15 min; extension 1–30 min (default 5), at most 0–5
        extensions (default 1).
      source: R169 | R094
    - field: F&B limits
      rule: 'Recall window 0–60 min (default 10); comp escalation amount (proposed AED 100.00); food-safety lead — a person
        picker with no default (escalations are refused while empty).

        '
      source: R094 | R096 | R197
    - field: Currency
      rule: Read-only, "Set by the region"; the trading currency and its decimals cannot change here.
      source: ADR-0018 | contracts/spine/tenancy.yaml#/components/schemas/VenueSettings
    - field: Display currencies
      rule: Currencies shown to guests, only those the region has an exchange rate for (e.g. AED, SAR, USD, INR, GBP).
      source: R120 | DI-1071
    - field: Refund policy thresholds
      rule: 'Self-authorise up to ≤ second user above ≤ approval above; inline error when they do not ascend. Refund window
        0 = day of purchase only, empty = no window. Partial refunds on by default.

        '
      source: R123 | contracts/spine/orders.yaml#setRefundPolicy
    - field: Guest two-step verification
      rule: Off by default; "actions that ask again" default to all except transfer tickets.
      source: contracts/spine/tenancy.yaml#setVenueSettings
    - field: Delivery location
      rule: 'Kind (table, seat, cabana, sunbed, poolside, box, suite, lawn, collection point, named location); a table location
        picks the table, a seat location the seat; label unique in the venue and is what the runner reads ("Cabana 12");
        walk time from the serving outlet; out of service with a reason.

        '
      source: contracts/satellite/fnb.yaml#createDeliveryLocation | contracts/satellite/fnb.yaml#updateDeliveryLocation
    outputs:
    - element: Settings sections
      rule: 'Grouped: Trading & calendar, Cart & changes, Cash (variance threshold), Food & beverage, Stock, Guests & privacy
        (two-step, biometrics, segregated access), Notifications (quiet hours, alerting), Refunds, Delivery locations. Each
        value shows "Venue" or "Tenant default".

        '
      source: R094 | contracts/spine/tenancy.yaml#/components/schemas/VenueSettings
    actions:
    - action: Save venue settings
      result: 'Success shows what changed; 422 names each missing item when biometrics are switched on without a DPIA reference
        and consent acknowledgement; 412 asks to reload.

        '
      source: contracts/spine/tenancy.yaml#setVenueSettings
    - action: Save refund policy
      result: 422 "thresholds must ascend" points at the field.
      source: R123 | contracts/spine/orders.yaml#setRefundPolicy
    - action: Assign serving outlets
      result: Sets which outlets deliver to each location; a location nothing serves shows "Not serviceable", not hidden.
      source: contracts/satellite/fnb.yaml#setDeliveryLocationOutletMapping
    edgeCases:
    - case: Shift rules changed while a shift is open
      expected: 'F73 says the change is refused (a shift must close under the rules it opened under); show which tills are
        open if refused.

        '
      source: F73 step 2
    - case: Delivery location label already used
      expected: 409 names the existing location.
      source: contracts/satellite/fnb.yaml#createDeliveryLocation
    consistency:
    - with: BO-1065
      note: Currency, decimals, time zone and denominations are region settings there; this screen shows currency read-only.
    - with: POS-019
      note: Shift Templates & Policies writes the same venue settings (F73 step 2); values must agree.
    - with: BO-063
      note: Venue opening hours and calendar are there, not here.
    - with: BO-044
      note: Outlet-level delivery rules are per outlet there; locations are venue-level here.
    - with: BO-1063
      note: seating.maxSeatsPerGuestOrder is set there, not here.
    sampleData:
      venue: Aqua Park Dubai
      limits:
        cart_hold: 15 min (tenant default)
        shift_variance_threshold: AED 20.00 (tenant default)
        fnb_recall_window: 10 min
        comp_escalation: AED 100.00
        food_safety_lead: Fatima Al Suwaidi
      display_currencies:
      - AED
      - SAR
      - USD
      - GBP
      refund_policy:
        self_authorise: AED 200.00
        second_user_above: AED 500.00
        approval_above: AED 1,000.00
        window_days: 14
      delivery_locations:
      - label: Cabana 12
        kind: cabana
        zone: Wave Pool
        serving:
        - Pool Bar
        walk_time: 6 min
      - label: Sunbed row C
        kind: sunbed
        serviceable: false
        reason: Section closed — weather
    corrections:
    - what: requiresModule ticketing.
      why: Venue configuration (variance threshold, F&B limits, refund policy) is needed by every tenant, including one
        without ticketing; it is core.
      source: screens/P08-venue-back-office.yaml#BO-065 | DI-505
      status: fixed
      by: CHG-SBO-003
    - what: 'The main list is "Every dining outlet" from listDiningOutlets (a guest read that returns only outlets open
        now) with an "Open now" toggle and an "Ordering method" text filter.

        '
      why: Not venue configuration; outlets are configured on BO-044. Bulk attach.
      source: R254 | contracts/satellite/fnb.yaml#listDiningOutlets
      status: fixed
      by: CHG-WIR-008
    - what: 'Only guest two-step is laid out; the venue-settings modal lists 18 raw property names with "nothing required",
        although they are the screen''s whole purpose.

        '
      why: The configured limits, hours, biometrics, segregated access and alerting need real sections.
      source: screens/P08-venue-back-office.yaml#BO-065 | R094
      status: fixed
      by: CHG-SBO-008
    - what: 'The cash settings agreed for this screen have no field anywhere: opening-float entry mode (total or by denomination,
        per venue), cash-drawer ceiling, approval required on open/close, mandatory bag number and deposit-box allocation
        (which openShift says "the venue configures"), and the expected float approveShiftOpen compares against.

        '
      why: DI-306/307/274 and openShift's conditional rules have nowhere to be set.
      source: DI-306 | DI-307 | DI-274 | contracts/spine/shift.yaml#openShift | contracts/spine/shift.yaml#approveShiftOpen
      status: fixed
      by: CHG-SBO-008
    - what: Exit to BO-008 Product Detail & Variants; module "Orders & Money".
      why: Derived navigation with no meaning; venue configuration belongs with the venue settings, not orders.
      source: R251 | screens/P08-venue-back-office.yaml#BO-065
      status: fixed
      by: CHG-WIR-009
    decisions:
    - question: Is the trading day configurable (midnight-to-midnight or 6am-to-6am)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw "Calendar day starts at 06:00" (calendarDayStartHour)
        as the calendar view setting only, and do not label it as the trading/business day.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-039 | CHG-NOTE-004
      questionSource: DI-149 | contracts/spine/tenancy.yaml#/components/schemas/VenueSettings
    - question: Who may read venue settings — TENANT_VIEW, or a dedicated read permission?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Read-only view for anyone who can open the
        screen; edit with the configure permission.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-040 | CHG-NOTE-004
      questionSource: R091
  BO-078:
    summary: 'Requisitions is the purchase request: a department asks to buy, its head approves, returns or rejects it,
      quotations are compared, and the approved request becomes a purchase order. It serves two people: the requester (raise,
      track, answer questions) and the approver (decide). The one thing to get right is that the approver is never the requester,
      and approval may only lower quantities, never raise them.

      '
    inputs:
    - field: Lines
      rule: 'Item picker (inventory items), quantity, unit. Units offer the item''s base unit and purchase unit ("can" or
        "case of 24"). When the request came from a suggestion, the suggested quantity stays visible beside the requested
        one. A different quantity asks for a short reason.

        '
      source: DI-343 | contracts/satellite/inventory.yaml#updateRequisitionLines | contracts/satellite/inventory.yaml#/components/schemas/Requisition
    - field: Required by
      rule: Date, required, today or later.
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateRequisitionRequest
    - field: Department / cost centre
      rule: Pickers. Department defaults to the requester's own. The cost centre is what finance books it to.
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateRequisitionRequest
    - field: Justification
      rule: Optional, up to 1,000 characters. It is what the approver reads first.
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateRequisitionRequest
    - field: Approver's amended quantity
      rule: 'On approval each line can be lowered, never raised above the requested quantity. Enforce it in the field (the
        maximum is the requested quantity).

        '
      source: contracts/satellite/inventory.yaml#approveRequisition
    - field: Filters
      rule: 'Status chips, plus "Raised by me" / "Waiting for my decision" tabs. Never a "Raised by principal id" text field.

        '
      source: contracts/satellite/inventory.yaml#listRequisitions
    outputs:
    - element: Two tabs
      rule: '"Waiting for my decision" (pending approval, not raised by me; an empty tab is the good outcome) and "Requests"
        (everything for the venue, filterable). The empty decision tab says "Nothing waiting for you".

        '
      source: screens/P08-venue-back-office.yaml#BO-078
    - element: Status labels
      rule: 'Pending approval, Approved, Returned for information, Rejected, Ordered, Closed, Cancelled. A returned request
        shows the approver''s question prominently to the requester. A rejected one shows the reason and offers "Copy to
        new request".

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/RequisitionStatus | contracts/satellite/inventory.yaml#rejectRequisition
        | contracts/satellite/inventory.yaml#returnRequisition
    - element: Suggestions panel
      rule: '"Below reorder point" items for a chosen location: on hand, reorder point, par level, average daily use, days
        of cover left, suggested quantity, preferred supplier, lead time. Sort by days of cover ascending. A suggestion
        is a draft for a person to review and is never raised automatically.

        '
      source: DI-234 | contracts/satellite/inventory.yaml#getSuggestedRequisitions
    - element: Quotation comparison
      rule: 'Side by side per supplier: total, lead time, valid until, and per line unit prices with the lowest per line
        highlighted. Badges "Lowest total" and "Shortest lead time". The cheapest total is not always the cheapest line.

        '
      source: contracts/satellite/inventory.yaml#compareQuotations | DI-348
    actions:
    - action: New request
      result: Raises the request straight into Pending approval. It shows in the approver's tab.
      source: contracts/satellite/inventory.yaml#createRequisition
    - action: Create from suggestions
      result: Opens a new request prefilled with the selected suggestions. The suggested quantities are kept beside any
        change.
      source: contracts/satellite/inventory.yaml#getSuggestedRequisitions | contracts/satellite/inventory.yaml#updateRequisitionLines
    - action: Edit lines
      result: 'Allowed until approval. After approval it is refused, and the message says a new request is needed.

        '
      source: R171 | contracts/satellite/inventory.yaml#updateRequisitionLines
    - action: Approve · Return with a question · Reject
      result: 'Three distinct buttons for the approver. Return asks a question and Reject asks a reason. The buttons are
        hidden on a request the user raised; the server refuses it anyway.

        '
      source: contracts/satellite/inventory.yaml#approveRequisition | contracts/satellite/inventory.yaml#returnRequisition
        | contracts/satellite/inventory.yaml#rejectRequisition
    - action: Cancel request
      result: Requester only, with a reason. The confirmation names the request number and its estimated total.
      source: contracts/satellite/inventory.yaml#cancelRequisition
    - action: Record quotation · Compare · Raise purchase order
      result: 'On an approved request: record supplier quotes against it, compare them, select one, then "Raise purchase
        order", which opens BO-051 prefilled.

        '
      source: DI-348 | contracts/satellite/inventory.yaml#recordQuotation | contracts/satellite/inventory.yaml#createPurchaseOrder
    edgeCases:
    - case: No supplier is set up for an item
      expected: 'The request can be approved but cannot become an order. Show "No supplier for <item>" with a link to Suppliers.

        '
      source: F15 step 2
    - case: Offline (handheld or weak signal)
      expected: Raising and editing a request queue offline. Approving, rejecting and returning need a connection.
      source: contracts/satellite/inventory.yaml#createRequisition | contracts/satellite/inventory.yaml#approveRequisition
    consistency:
    - with: EMP-063
      note: Same request form and status words in handheld layout.
    - with: BO-051
      note: '"Raise purchase order" carries the requisition and the selected quotation.'
    - with: BO-083
      note: Quotations recorded on Suppliers appear in this comparison, and the reverse.
    sampleData:
    - number: REQ-AQP-000118
      department: Oasis Bistro (F&B)
      raisedBy: Priya Nair
      requiredBy: '2026-10-18'
      status: Pending approval
      lines:
      - item: Full-cream milk 2 L
        suggested: 72
        requested: 60
        unit: bottle
        reason: Weekend menu change, less demand
      - item: Greek yoghurt 1 kg
        requested: 24
        unit: tub
      estimatedTotal: AED 1,180.00
      justification: Weekly dairy replenishment for Oasis Bistro dinner service
    - number: REQ-AQP-000117
      department: Marina Bay Store
      raisedBy: Omar Ziad
      status: Returned for information
      question: Why 300 T-shirts in size S when last month sold 40?
    corrections:
    - what: 'A requisition can only become a supplier purchase. The client also uses requisitions for outlets replenishing
        from the central warehouse, and for inter-store requests approved before a transfer. Flow F35 says "a requisition
        asks a supplier". Transfers have no approval state.

        '
      why: 'Internal replenishment has no model. Either the requisition gets a fulfilment type (buy from a supplier / transfer
        from a store) that ends in a transfer, or transfers get a request-and-approve step.

        '
      source: DI-341 | DI-362 | F35 step 1 | contracts/satellite/inventory.yaml#/components/schemas/Requisition | contracts/satellite/inventory.yaml#/components/schemas/TransferStatus
    - what: 'The approval of a requisition exists twice: approveRequisition on this screen (F76) and the generic approval
        queue on BO-084 (F15 step 3). Also, approveRequisition''s decision allows rejected and returnedForInfo, which duplicate
        rejectRequisition and returnRequisition.

        '
      why: One approval path per request, and one way to reject. Otherwise a request can be decided in two places.
      source: F15 step 3 | F76 step 3 | contracts/satellite/inventory.yaml#approveRequisition
    - what: 'F15 step 2 raises a requisition "against the work order" so the job and the purchase find each other. The request
        has no work-order field.

        '
      why: The link the flow promises cannot be stored.
      source: F15 step 2 | contracts/satellite/inventory.yaml#/components/schemas/CreateRequisitionRequest
    - what: 'The status "draft" exists, but nothing creates or submits a draft. Creating raises the request straight into
        approval, and suggestions are not drafts.

        '
      why: The client expects below-par-level stock to create a draft request for review. Today that state cannot be reached.
      source: DI-234 | contracts/satellite/inventory.yaml#/components/schemas/RequisitionStatus
    - what: 'The first-run state "offers no create action". The filters are text fields "Status" and "Raised by principal
        id". An "Every stock location" table is on the screen. There is no exit to Purchase Orders.

        '
      why: 'The purpose includes raising requests. Locations are only a picker for suggestions. The approved request''s
        next step is BO-051.

        '
      source: screens/P08-venue-back-office.yaml#BO-078 | R251
    decisions:
    - question: Should internal replenishment (outlet from warehouse, store to store) go through requisitions with approval,
        or through transfers with an approval step?
      decision: 'Drawn default accepted: Draw supplier purchase only. Mark internal replenishment as pending.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-290 | CHG-NOTE-004
      reviewable: true
      questionSource: DI-341 | DI-362
    - question: What is the requisition number format?
      decision: 'Drawn default accepted: REQ-<venue code>-<six-digit sequence>, as an example only.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-291 | CHG-NOTE-004
      reviewable: true
      questionSource: R152
  BO-079:
    summary: 'Stock Count is the supervisor''s side of counting: start a full, cycle or spot count at a location, watch
      progress, review the variance once counting is submitted, send lines back for recount, and post. Counting itself mostly
      happens on the handheld (EMP-066). The one thing to get right is blindness. While a count is open or counting, nobody
      sees the expected quantity or the variance. Variance appears only after submission, and then never as zero by default.

      '
    inputs:
    - field: Location
      rule: Location tree picker. Only one open count per location; locations with an open count show "Count in progress".
      source: contracts/satellite/inventory.yaml#startStockCount
    - field: Count type
      rule: 'Full (everything at the location), Cycle (chosen categories, on rota) or Spot (a few items, e.g. after a damaged
        delivery). Cycle asks for categories.

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/StartStockCountRequest | F35 step 8
    - field: Blind count
      rule: On by default. Turning it off asks for confirmation ("Counters will see expected quantities").
      source: R110 | contracts/satellite/inventory.yaml#/components/schemas/StartStockCountRequest
    - field: Recount reason and supervisor PIN
      rule: 'Sending a whole count back needs a reason and a supervisor''s PIN entered on this device. A refused PIN changes
        nothing.

        '
      source: R144 | contracts/satellite/inventory.yaml#recountStockCount
    outputs:
    - element: Count list
      rule: 'Location, type (Full / Cycle / Spot), status, progress "38 of 46 lines counted", started by, started at. Variance
        columns are blank (not zero) while Open or Counting. Status words: Open, Counting, Closed, Variance review, Posted,
        Cancelled.

        '
      source: R110 | contracts/satellite/inventory.yaml#/components/schemas/StockCount
    - element: Variance review
      rule: 'After submission: per line expected, counted, variance (quantity and %), variance value, times counted, note.
        Lines beyond the tolerance (proposed 2%) are flagged "Review" and sorted first. Header: total variance value (AED,
        signed) and the number of exceptions. Before submission the panel reads "Variance appears once the count is submitted".

        '
      source: R110 | R094 | contracts/satellite/inventory.yaml#getCountVariance
    - element: Clean count warning
      rule: 'A count with no variance at all is shown with a gentle prompt, "No differences found. Check every line was
        counted", rather than as a success.

        '
      source: F30 step 4
    actions:
    - action: Start count
      result: 'Creates the count with one line per item that has stock at the location (filtered by category for a cycle
        count). The count is blank. Refused if a count is already open there.

        '
      source: R171 | contracts/satellite/inventory.yaml#startStockCount
    - action: Send lines for recount
      result: 'Select lines and give a reason. Those lines reopen on the handheld. The original figure is kept beside the
        recount.

        '
      source: F30 step 5 | F30 step 6 | contracts/satellite/fnb.yaml#requestRecount
    - action: Post count
      result: 'Writes Count gain / Count loss movements for every variance and posts the value. Refused while any exception
        line is unreviewed. Above the venue''s approval amount (proposed AED 1,000.00 total variance) it needs approval.
        Show "Waiting for approval" rather than an error.

        '
      source: R094 | R171 | contracts/satellite/inventory.yaml#postStockCount | F30 step 4
    - action: Cancel count
      result: 'Only before counting starts, with a reason. Once lines are counted the count must be finished or recounted.
        Hide Cancel then.

        '
      source: contracts/satellite/inventory.yaml#cancelStockCount
    edgeCases:
    - case: Stock moved during the count (a sale, a transfer)
      expected: 'Variance uses the expected quantity snapshotted when each line was entered, not the current one. Say so
        in the variance header ("Expected = system quantity when each line was counted").

        '
      source: F30 step 7 | contracts/satellite/inventory.yaml#/components/schemas/CountLine
    - case: Counter is offline in a cellar
      expected: Lines queue on the handheld and the count stays Counting. Progress here updates when they sync.
      source: F30 step 2
    consistency:
    - with: EMP-066
      note: Same count, same line order, same status words. The handheld enters and this screen reviews and posts.
    - with: BO-082
      note: Posted variances appear in the movement ledger as Count gain / Count loss, linked to the count.
    - with: BO-137
      note: Posted variance feeds theoretical-against-actual for F&B.
    sampleData:
      count:
        location: Oasis Bistro Kitchen
        type: Cycle
        categories:
        - Dairy
        - Beverages
        blind: true
        status: Variance review
        lines: 46
        counted: 46
        startedBy: Khalid Al Mansoori
        startedAt: 2026-10-20 06:15 GST
      variance:
        total: -AED 412.75
        exceptions: 3
        lines:
        - item: Full-cream milk 2 L
          expected: 18
          counted: 12
          variance: -6
          pct: -33.3%
          value: -AED 75.00
          flag: Review
        - item: Coca-Cola 330 ml can
          expected: 240
          counted: 238
          variance: -2
          pct: -0.8%
          value: -AED 3.80
    corrections:
    - what: 'Two counting APIs exist side by side. The inventory one (submit counted quantities; recount the whole count
        with a supervisor PIN) and the F&B one (enter a line; send lines back for recount with no PIN). Flow F30 uses the
        F&B pair.

        '
      why: 'The decision says a stock recount needs a supervisor''s step-up on the same device. The line recount in F30
        has none. One counting model should be chosen, and the recount should carry the step-up.

        '
      source: R144 | F30 step 5 | contracts/satellite/fnb.yaml#requestRecount | contracts/satellite/inventory.yaml#recountStockCount
    - what: 'No operation ends counting. Statuses go Open → Counting → Closed → Variance review → Posted, but nothing moves
        a count from Counting to Closed. Variance is "hidden until the count is submitted".

        '
      why: 'The moment variance is revealed has no action behind it. Draw a "Finish counting" step; the contract needs the
        operation.

        '
      source: R110 | contracts/satellite/inventory.yaml#/components/schemas/CountStatus
    - what: 'Posting above the approval amount answers 409 "approval is required". F30''s branch says it routes through
        an approval request.

        '
      why: 'Other approvals (PO cancel) return a pending state with the request attached. Here the post just fails and nothing
        raises the approval.

        '
      source: F30 step 4 | contracts/satellite/inventory.yaml#postStockCount
    - what: 'The first-run state offers "Request recount". The location filter is a "Location id" text field. The status
        filter is a text field.

        '
      why: First run should offer "Start count". Filters are pickers.
      source: screens/P08-venue-back-office.yaml#BO-079
    decisions:
    - question: Which counting API is the build target, the inventory one or the F&B one?
      decision: 'Drawn default accepted: Draw per-line entry and per-line recount (F30), with the supervisor PIN on recount.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-292 | CHG-NOTE-004
      reviewable: true
      questionSource: R144 | F30 step 4
    - question: Are a 2% line tolerance and an AED 1,000.00 posting approval amount accepted?
      decision: 'Drawn default accepted: Use them in mock-ups.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-293 | CHG-NOTE-004
      reviewable: true
      questionSource: R094
  BO-080:
    summary: 'Stock Transfers moves stock between any two stock locations: outlet to outlet, warehouse to outlet, outlet
      to warehouse, and between venues. It shows both outbound and inbound transfers for the venue. Dispatch takes stock
      out at once and puts it in transit; the receiving store confirms what arrived. The one thing to get right is that
      a difference between sent and received stays visible at both ends until someone closes it short, with a reason and
      a supervisor PIN.

      '
    inputs:
    - field: From / To
      rule: 'Location pickers. From defaults to a location at this venue. To may be at another venue of the tenant, and
        the picker groups locations by venue. From and To cannot be the same.

        '
      source: DI-362 | DI-294 | R183 | contracts/satellite/inventory.yaml#/components/schemas/CreateStockTransferRequest
    - field: Lines
      rule: 'Item (scan or search), quantity and unit. Show available at the source beside each line; a quantity above it
        is refused by the server.

        '
      source: contracts/satellite/inventory.yaml#createStockTransfer
    - field: Received quantity (receiving)
      rule: 'Per line, blank with "Received as sent" shortcut. The difference from the dispatched quantity is shown live
        as a discrepancy.

        '
      source: contracts/satellite/inventory.yaml#receiveStockTransfer
    - field: Close-short reason and supervisor PIN
      rule: Reason required. A supervisor with stock-approval rights enters their PIN on this device.
      source: R144 | contracts/satellite/inventory.yaml#closeTransferShort
    outputs:
    - element: Transfer list
      rule: 'Direction badge (Outbound / Inbound), transfer number, from, to (venue name shown when different), lines, dispatched
        at, status. Direction is a filter tab: All · Outbound · Inbound. Status words: In transit, Partly received, Received,
        Closed short, Cancelled.

        '
      source: R183 | contracts/satellite/inventory.yaml#listStockTransfers | DI-346
    - element: Transfer manifest
      rule: 'What was sent, what arrived, what is missing, per line, plus the cold-chain reading where one was taken. Discrepancies
        sit with the transfer, not on another screen.

        '
      source: contracts/satellite/inventory.yaml#getStockTransfer
    actions:
    - action: Send stock (create transfer)
      result: 'Dispatches at once. The source decreases and the quantity is "In transit". Refused with "Not enough stock
        at <location>" when short.

        '
      source: contracts/satellite/inventory.yaml#createStockTransfer
    - action: Receive
      result: 'Offered only on inbound transfers that are In transit or Partly received. Received quantities may differ;
        the difference is recorded against both locations.

        '
      source: R183 | contracts/satellite/inventory.yaml#receiveStockTransfer
    - action: Close short
      result: 'Writes off the balance that will not arrive, with a reason and a supervisor PIN. A wrong PIN changes nothing.

        '
      source: R144 | contracts/satellite/inventory.yaml#closeTransferShort
    edgeCases:
    - case: Damage found only after the cases are opened
      expected: 'The transfer is received in full, and the damage is a separate adjustment with a damage reason. The claim
        against the sending store is a separate conversation.

        '
      source: F35 step 3
    - case: Transfer between two venues
      expected: Both venues see it. The sending venue cannot receive it and the receiving venue cannot dispatch it.
      source: R183
    consistency:
    - with: EMP-064
      note: Same transfer form, statuses and manifest on the handheld.
    - with: EMP-065
      note: Receiving a transfer at the door uses the same manifest and the same discrepancy wording.
    - with: BO-049
      note: In-transit stock appears in valuation as its own line.
    sampleData:
    - number: TRF-AQP-000087
      direction: Outbound
      from: Main Store
      to: Marina Bay Retail Floor
      status: In transit
      dispatchedAt: 2026-10-21 09:10 GST
      lines:
      - item: Aqua Park logo T-shirt, green, M
        sent: 24
    - number: TRF-WWD-000031
      direction: Inbound
      from: Wild Wadi Store (other venue)
      to: Main Store
      status: Partly received
      lines:
      - item: Kids swim goggles, blue
        sent: 100
        received: 92
        missing: 8
    corrections:
    - what: 'A transfer has no request or approval step. createStockTransfer dispatches immediately. The client and matrix
        say "transfer with approval workflow".

        '
      why: 'An outlet cannot ask the warehouse for stock and wait for approval. The person with the stock simply sends it.

        '
      source: DI-362 | MATRIX 4.5.5 | MATRIX 4.5.14 | contracts/satellite/inventory.yaml#/components/schemas/TransferStatus
    - what: 'The transfer statuses include both "dispatched" and "inTransit", and "cancelled", but no operation cancels
        a transfer.

        '
      why: 'Two words for one state goes against the simplicity principle (no granular dispatch statuses). A status no operation
        reaches is dead. Draw one "In transit" state and no Cancel.

        '
      source: DI-346 | contracts/satellite/inventory.yaml#/components/schemas/TransferStatus
    - what: '"Create goods receipt" is an action on this screen.'
      why: 'Transfers are received with "Receive". A goods receipt needs a supplier purchase order. Attached by resemblance.

        '
      source: R254 | contracts/satellite/inventory.yaml#createGoodsReceipt
      status: fixed
      by: CHG-WIR-008
    - what: The table shows fromVenueId, toVenueId and scopePath columns, and the status filter is a text field.
      why: These leak plumbing. Show venue names and a direction badge.
      source: screens/P08-venue-back-office.yaml#BO-080
    decisions:
    - question: 'Closing a transfer short with a supervisor PIN (rather than an approval request) was proposed by the coordinator.
        The R144 decision did not name this act.

        '
      decision: 'Drawn default accepted: Draw the supervisor PIN on the same device.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-294 | CHG-NOTE-004
      reviewable: true
      questionSource: R144 | contracts/satellite/inventory.yaml#closeTransferShort
    - question: What is the transfer number format?
      decision: 'Drawn default accepted: TRF-<venue code>-<six-digit sequence>, as an example only.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-295 | CHG-NOTE-004
      reviewable: true
      questionSource: R152
  BO-081:
    summary: 'Inventory Items is the item master: what the venue stocks, in which unit, how it is bought, how it is costed,
      when it needs reordering, and where it can be held (the location hierarchy). The one thing to get right is which fields
      lock once stock has moved. Base unit and costing method cannot change after the first movement, and the form must
      show this before someone tries.

      '
    inputs:
    - field: Base unit
      rule: 'The unit stock is held and counted in (piece, can, bottle, kg, litre, ml). Required. Locked with a lock icon
        and "Used in stock movements, cannot change" once the item has movements.

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/InventoryItem | contracts/satellite/inventory.yaml#updateInventoryItem
    - field: Purchase unit and factor
      rule: 'How the supplier sells it, written as a sentence the user completes: "1 [case] = [24] [can]". Default factor
        1.

        '
      source: DI-343 | contracts/satellite/inventory.yaml#/components/schemas/CreateInventoryItemRequest
    - field: Costing method
      rule: 'Weighted average or FIFO. Required at creation. Locked once the item has movements, with the reason shown.

        '
      source: DI-344 | contracts/satellite/inventory.yaml#createInventoryItem
    - field: Reorder point / Reorder quantity / Par level
      rule: 'Helper text: reorder point is when to reorder, reorder quantity is how much a suggestion orders, and par level
        is the level to top up to. All three are in the base unit. Reorder alerts and suggested requisitions run from them.

        '
      source: DI-345 | DI-234 | contracts/satellite/inventory.yaml#getSuggestedRequisitions
    - field: Preferred supplier
      rule: 'Picker of the tenant''s active suppliers. Suppliers on hold are not offered. Can be cleared with "None".

        '
      source: R171 | R183 | contracts/satellite/inventory.yaml#updateInventoryItem
    - field: Perishable and shelf life
      rule: 'Perishable off by default. On, "Shelf life (days)" shows, and every goods receipt of this item needs an expiry
        date.

        '
      source: DI-345 | contracts/satellite/inventory.yaml#/components/schemas/CreateGoodsReceiptRequest
    - field: Allow negative stock
      rule: 'Off by default. Turning it on shows "Only for bar items mid-service. Issues can exceed what is recorded on
        hand."

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateInventoryItemRequest
    - field: Kit components
      rule: 'For a retail bundle sold as one item: components and the quantity per kit. A component cannot itself be a kit,
        and an item with its own movements cannot become one. Kit availability is "fewest whole kits the components make".

        '
      source: MATRIX 4.4.20 | contracts/satellite/inventory.yaml#setInventoryKitDefinition
    - field: Stock location (setup)
      rule: 'Code, name, kind (Main store, Sub-store, Kitchen, Bar, Retail floor, Cellar) and parent location. Shown as
        an editable tree on its own "Locations" tab.

        '
      source: DI-345 | contracts/satellite/inventory.yaml#createStockLocation
    outputs:
    - element: Item list
      rule: 'Name, SKU, category, base unit, purchase unit ("case of 24"), costing method, on hand (all locations), reorder
        point, and a "Below reorder point" badge. Filters: category, below reorder point, search (name, SKU, barcode), scan.

        '
      source: contracts/satellite/inventory.yaml#listInventoryItems
    - element: Item detail
      rule: 'Stock by location (on hand, allocated, available), on order, in transit, average cost and last purchase price
        (AED), and an "In use since <date>, base unit and costing method locked" note when it has movements.

        '
      source: contracts/satellite/inventory.yaml#getInventoryItem
    actions:
    - action: Add item
      result: Refused when the SKU is already used in this venue. The SKU field shows the error.
      source: contracts/satellite/inventory.yaml#createInventoryItem
    - action: Save changes
      result: 'Changing a locked field is refused. The form never offers it once locked, so the refusal should not normally
        be reached.

        '
      source: contracts/satellite/inventory.yaml#updateInventoryItem
    - action: Add location
      result: Adds a node to the location tree under the chosen parent.
      source: contracts/satellite/inventory.yaml#createStockLocation
    edgeCases:
    - case: Item deactivated while stock is on hand
      expected: Warn "<n> still on hand at <locations>". Deactivation does not remove stock.
      source: designer default
    - case: Scan with no signal in a store room
      expected: Item lookup by barcode works offline from cache.
      source: contracts/satellite/inventory.yaml#lookupInventoryItem
    consistency:
    - with: BO-048
      note: A merchandise item links to an inventory item from this master. Retail and F&B share one item master.
    - with: BO-078
      note: The units offered on a requisition line are this item's base and purchase units.
    - with: BO-052
      note: The perishable flag here makes expiry mandatory at receipt.
    sampleData:
      items:
      - name: Coca-Cola 330 ml can
        sku: BEV-CC-330
        category: Beverages
        baseUnit: can
        purchase: 1 case = 24 can
        costing: Weighted average
        reorderPoint: 240
        reorderQuantity: 480
        parLevel: 720
        preferredSupplier: Emirates Beverage Trading LLC
        averageCost: AED 1.90
      - name: Full-cream milk 2 L
        sku: DRY-MLK-2L
        category: Dairy
        baseUnit: bottle
        purchase: 1 crate = 6 bottle
        costing: FIFO
        perishable: true
        shelfLifeDays: 7
        preferredSupplier: Gulf Fresh Dairy LLC
      - name: Beach day kit (towel + goggles + pouch)
        sku: KIT-BCH-01
        kit:
        - component: Beach towel, blue
          qty: 1
        - component: Kids swim goggles, blue
          qty: 1
        - component: Waterproof phone pouch
          qty: 1
      locations:
      - Main Store (main store)
      - '  Food Store (sub-store)'
      - '    Cold Room (sub-store)'
      - '  Beverage Store (sub-store)'
      - Oasis Bistro Kitchen (kitchen)
      - Pool Bar (bar)
      - Marina Bay Retail Floor (retail floor)
    corrections:
    - what: 'Only one purchase unit and factor per item. The client''s examples need several conversions ("1 carton = 24
        pieces"; "1 case = 2 litres = 2,000 ml").

        '
      why: A second pack size (carton and case of the same item) cannot be expressed.
      source: DI-343 | contracts/satellite/inventory.yaml#/components/schemas/CreateInventoryItemRequest
      status: logged
      by: CHG-SBO-005
    - what: The item master has no "item type" and no status beyond active.
      why: The client listed category, item type, status and UOM as the item master's fields.
      source: DI-343 | contracts/satellite/inventory.yaml#/components/schemas/InventoryItem
      status: logged
      by: CHG-SBO-005
    - what: 'The update operation cannot change barcode, purchase unit, factor, perishable, shelf life or allow-negative-stock.

        '
      why: 'A supplier changing pack size, or a barcode correction, would need a new item. These fields are not movement-sensitive
        and should be editable.

        '
      source: contracts/satellite/inventory.yaml#updateInventoryItem
      status: logged
      by: CHG-SBO-005
    - what: 'Stock locations can be created but never renamed, moved in the tree or deactivated. "Transit" is offered as
        a kind a user can create.

        '
      why: 'A customisable hierarchy needs editing. In-transit stock "belongs to neither location", so a user-made transit
        location contradicts the transfer model.

        '
      source: DI-345 | contracts/satellite/inventory.yaml#createStockLocation | contracts/satellite/inventory.yaml#createStockTransfer
      status: logged
      by: CHG-SBO-005
    - what: 'The filters are text fields "Venue id" and "Category id". An "Every stock location" table with raw columns
        sits beside the item table.

        '
      why: The venue comes from the session. Locations belong on their own tab as a tree.
      source: screens/P08-venue-back-office.yaml#BO-081
      status: fixed
      by: CHG-SBO-008
    decisions:
    - question: Offer only weighted average and FIFO (agreed), or also standard cost and last purchase price (in the contract)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Two options.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-041 | CHG-NOTE-004
      questionSource: DI-344 | MATRIX 4.5.35
  BO-082:
    summary: 'Stock Movements is the ledger. Every change to stock is a movement with a kind, a reason, a person and a source:
      receipts, sales, transfers, counts, waste, adjustments. On hand is derived from it. It is also where a manager records
      a manual adjustment, issue or waste. The one thing to get right is direction. Quantity is always entered positive,
      and the kind decides whether stock goes up or down.

      '
    inputs:
    - field: Kind (manual entry)
      rule: 'Offer only the kinds a person records by hand: Issue (to a cost centre), Waste, Adjustment in, Adjustment out,
        Return to supplier. Receipt, Sale, Transfer in/out, Count gain/loss and Production are written by their own screens
        and appear only in the ledger.

        '
      source: R171 | contracts/satellite/inventory.yaml#/components/schemas/MovementKind
    - field: Quantity
      rule: 'Positive number only; the field refuses a sign. Beside it, a live preview "Stock after: 42 → 36 can" in the
        item''s unit.

        '
      source: R171 | contracts/satellite/inventory.yaml#/components/schemas/CreateStockMovementRequest
    - field: Reason
      rule: 'Required for Adjustment in, Adjustment out and Waste (up to 500 characters). Draw it as a reason list plus
        a note, with "Other" requiring the note.

        '
      source: R171 | R222 | DI-363
    - field: Cost centre
      rule: Picker, shown for Issue. It decides where the cost is booked.
      source: contracts/satellite/inventory.yaml#/components/schemas/CreateStockMovementRequest
    - field: Ledger filters
      rule: 'Item (search or scan), location (tree), kind (multi-select of the words below), date range (Recorded from /
        to). Never id text fields.

        '
      source: contracts/satellite/inventory.yaml#listStockMovements
    outputs:
    - element: Ledger table
      rule: 'Date and time (GST), item, location, kind in words, signed quantity derived from the kind (green +12, red -6),
        balance after, unit cost and total cost (AED), reason, by whom, and source as a readable link ("Sale AQP-104582",
        "Count 20 Oct, Oasis Bistro Kitchen", "Transfer TRF-AQP-000087"). Newest first.

        '
      source: R171 | contracts/satellite/inventory.yaml#/components/schemas/StockMovement
    - element: Kind words
      rule: 'Receipt · Issue · Sale · Waste · Adjustment in · Adjustment out · Transfer out · Transfer in · Count gain ·
        Count loss · Return to supplier · Production.

        '
      source: contracts/satellite/inventory.yaml#/components/schemas/MovementKind | R131
    - element: Adjustments view
      rule: 'A saved filter "Adjustments and waste", because adjustments are reported separately. Frequent adjustments on
        one item are the shrinkage signal; sort that view by count per item.

        '
      source: contracts/satellite/inventory.yaml#createStockMovement
    actions:
    - action: Record movement
      result: 'Writes the movement and shows the new balance. Refused when stock is insufficient and the item does not allow
        negative stock; say "Only 4 on hand at Pool Bar". Not available offline.

        '
      source: contracts/satellite/inventory.yaml#createStockMovement
    edgeCases:
    - case: A returned retail item is resaleable, damaged or going back to the supplier
      expected: 'The retail return already restocks or writes off by condition. This screen records only the supplier return
        of written-off stock. It must not restock a second time.

        '
      source: F34 step 7 | contracts/satellite/retail.yaml#createRetailReturn
    - case: Kit sold
      expected: The ledger shows one Sale line per component, never a line for the kit itself.
      source: contracts/satellite/inventory.yaml#setInventoryKitDefinition
    consistency:
    - with: EMP-067
      note: The handheld's damage/loss form records the same kinds with the same reason list.
    - with: BO-139
      note: F&B wastage uses the same reason list and appears in this ledger as Waste.
    sampleData:
    - at: 2026-10-21 14:05 GST
      item: Coca-Cola 330 ml can
      location: Pool Bar
      kind: Sale
      qty: '-2'
      balanceAfter: 180
      source: Sale AQP-104582
    - at: 2026-10-21 11:30 GST
      item: Full-cream milk 2 L
      location: Oasis Bistro Kitchen
      kind: Waste
      qty: '-3'
      reason: Spoiled, fridge door left open
      by: Fatima Al Suwaidi
      totalCost: AED 37.50
    - at: 2026-10-20 18:40 GST
      item: Full-cream milk 2 L
      location: Oasis Bistro Kitchen
      kind: Count loss
      qty: '-6'
      source: Count 20 Oct, Oasis Bistro Kitchen
    corrections:
    - what: The reason is free text only (up to 500 characters).
      why: 'The client asked for a configurable, user-defined reason list that can be extended without development. It needs
        a reason code plus a note.

        '
      source: DI-363 | contracts/satellite/inventory.yaml#/components/schemas/CreateStockMovementRequest
      status: logged
      by: CHG-SBO-005
    - what: An "Every order" table (sales orders) and a "Create stock transfer" button sit on the ledger.
      why: 'Attached through F35 step 7 (sourcing orders from another store). On a ledger they are noise. Sourcing belongs
        with transfers and the order screens.

        '
      source: R254 | F35 step 7
      status: fixed
      by: CHG-WIR-008
    - what: 'F34 step 8 dispositions a returned item here with a manual movement. The retail return already restocks or
        writes off by condition.

        '
      why: A manual movement after the return would count the same item twice.
      source: F34 step 7 | contracts/satellite/retail.yaml#createRetailReturn
      status: fixed
      by: CHG-CLN-005
    - what: The item, location and kind filters are text fields ("Item id", "Location id", "Kind").
      why: These leak plumbing. Use pickers and a kind multi-select in words.
      source: screens/P08-venue-back-office.yaml#BO-082
      status: fixed
      by: CHG-SBO-008
  BO-083:
    summary: 'Suppliers is the tenant''s supplier master, read-only at venue level, together with what each supplier quoted,
      their contracts and their performance. The one thing to get right is ownership. Suppliers are created and edited at
      tenant level. A venue user sees them read-only and records quotations against them for the venue.

      '
    inputs:
    - field: Supplier details (tenant scope)
      rule: 'Code (unique in the tenant), name, contact, TRN (tax registration number), currency (ISO, default AED), payment
        terms in days, lead time in days, minimum order value. At venue scope every field is read-only and the edit button
        is absent.

        '
      source: R183 | R108 | contracts/satellite/inventory.yaml#createSupplier
    - field: Status
      rule: 'Active, On hold, Suspended, Terminated, with a reason when not active. On hold stops the supplier appearing
        in new requisitions and orders; history stays.

        '
      source: contracts/satellite/inventory.yaml#updateSupplier
    - field: Quotation
      rule: 'Recorded against an approved request: supplier''s reference, lines (item, quantity, unit price), lead time,
        valid until (required). Chosen from the request side (BO-078) or here with a request picker.

        '
      source: R183 | contracts/satellite/inventory.yaml#recordQuotation
    - field: Supplier contract
      rule: 'Number (unique per supplier), name, valid from / to, currency, payment terms, signed document. Created as Draft,
        or Active when the signed document is attached.

        '
      source: contracts/satellite/inventory.yaml#createSupplierContract
    outputs:
    - element: Supplier list
      rule: Code, name, status badge, currency, payment terms, lead time, active contracts count. No raw account or id columns.
      source: contracts/satellite/inventory.yaml#listSuppliers
    - element: Performance scorecard
      rule: 'For a chosen period: orders placed, on time in full %, average days late, short delivery %, rejection % with
        reasons, price variance % (quoted vs invoiced). OTIF is the headline number.

        '
      source: DI-347 | R158 | contracts/satellite/reporting.yaml#getSupplierPerformance
    - element: Contracts tab
      rule: Contracts sorted by expiry. "Expiring within 30 days" highlighted, because someone has to renew them.
      source: contracts/satellite/inventory.yaml#listSupplierContracts
    actions:
    - action: Add supplier / Save supplier
      result: Tenant scope only. A duplicate code is refused, and the code field says so.
      source: R183 | R108
    - action: End contract
      result: Terminate with a reason. A terminated or expired contract is never reopened; renewal is a new contract.
      source: contracts/satellite/inventory.yaml#updateSupplierContract
    edgeCases:
    - case: Venue user with no suppliers set up
      expected: Says "Suppliers are set up by your head office" rather than offering to add one.
      source: R183 | screens/P08-venue-back-office.yaml#BO-083
    consistency:
    - with: BO-078
      note: Quotations recorded here appear in the request's comparison.
    - with: BO-052
      note: Receipts and rejections there feed this scorecard.
    sampleData:
    - code: SUP-0042
      name: Gulf Fresh Dairy LLC
      status: Active
      currency: AED
      paymentTermsDays: 30
      leadTimeDays: 2
      otif: 91.4%
      rejection: 2.1% (Damaged, Short-dated)
    - code: SUP-0057
      name: Desert Rose Merchandise FZE
      status: On hold
      statusReason: Trade licence renewal pending
      currency: AED
    - code: SUP-0063
      name: Emirates Beverage Trading LLC
      contract:
        number: EBT-2026-07
        validFrom: '2026-01-01'
        validTo: '2026-12-31'
        paymentTermsDays: 45
    corrections:
    - what: 'The supplier has no category (F&B, retail, engineering), no linked item categories and no compliance documents.

        '
      why: 'The client''s supplier master and the matrix ("Supplier master with classification") need them, and spend by
        category depends on them.

        '
      source: DI-347 | MATRIX 15.3.1
    - what: 'The update request names the field "paymentTermDays" and takes a "contacts" array. The supplier record has
        "paymentTermsDays" and flat contact fields. Create takes both "isActive" and "status".

        '
      why: The names mismatch and the duplicated active flag will drift.
      source: contracts/satellite/inventory.yaml#updateSupplier | contracts/satellite/inventory.yaml#/components/schemas/Supplier
    - what: The supplier contract carries validity and terms but no prices or items.
      why: 'The agreed Contract PO type picks a pre-agreed price automatically on later orders. Without price lines nothing
        can be picked.

        '
      source: DI-348 | contracts/satellite/inventory.yaml#/components/schemas/InventorySupplierContract
    - what: Navigation exits to Stock Count and Stock Transfers.
      why: Inferred edges with no purpose. Navigation is re-derived from purpose.
      source: R251 | screens/P08-venue-back-office.yaml#BO-083
      status: fixed
      by: CHG-WIR-009
  BO-104:
    summary: 'The Food & Beverage section landing in the back office: today''s takings at the top, cards into every F&B
      screen (orders, order search, menus, kitchen display, stations, routing, global settings, outlets, outlet set-up)
      and a search across them. It carries no attention counts. One thing to get right: it is a hub, not a menu list — nothing
      on it should be a data table.

      '
    inputs:
    - field: Search food & beverage
      rule: Finds F&B screens and settings by name (Menus, Outlets, Kitchen stations); not a record search.
      source: screens/P08-venue-back-office.yaml#BO-104
    outputs:
    - element: KPI tiles
      rule: F&B takings today (the F&B outlets only), with movement against the previous period, from the seeded KPIs; the
        period is today in the venue time zone. Admissions are not on the F&B hub.
      source: R283 | contracts/satellite/reporting.yaml#getKpiValues | DI-041 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - element: Section cards
      rule: 'F&B Order Management, Order Search, Menu Management, Kitchen Display, Kitchen & Preparation Stations, Order
        Routing & KDS/Printer Rules, F&B Global Settings & Controls, F&B Outlets. No counts on the cards.

        '
      source: R283 | screens/P08-venue-back-office.yaml#BO-104
    actions:
    - action: New menu
      result: Opens Menu Management on a new menu (the outlet is picked there), not an inline create modal with an outlet
        id.
      source: screens/P08-venue-back-office.yaml#BO-045 | DI-330
    edgeCases:
    - case: Tenant without the F&B licence
      expected: The section is not shown in the shell at all.
      source: DI-505
    - case: Outlet manager restricted to one outlet
      expected: Cards open pre-filtered to their outlet; figures that cannot be outlet-scoped are labelled as venue figures.
      source: DI-318 | DI-331
    consistency:
    - with: BO-100
      note: Same KPI tile component and wording as Venue Home and the other hubs.
    - with: BO-727
      note: The client pack's F&B Command Center is a second F&B landing; one must link to the other.
    sampleData:
      tiles:
      - name: F&B takings today
        value: AED 48,960.00
        delta: +4.8% vs yesterday
      cards:
      - F&B Order Management
      - Order Search
      - Menu Management
      - Kitchen Display
      - Kitchen & Preparation Stations
      - Order Routing & KDS/Printer Rules
      - F&B Global Settings & Controls
      - F&B Outlets
    corrections:
    - what: 'The hub''s content is an "Every menu" table with an "Outlet id" text field and an "Active at" date picker,
        a menu detail panel, and a "venue settings" panel listing id, currency scale, biometrics and segregated access.

        '
      why: Plumbing and menu management on a hub; menus belong to BO-045.
      source: screens/P08-venue-back-office.yaml#BO-104 | R283
      status: fixed
      by: CHG-WIR-008
    - what: getVenueSettings is declared with purpose "What is enabled here".
      why: The contract says VenueSettings carries no module enablement (R279); the hub cannot learn licensed modules from
        it.
      source: contracts/spine/tenancy.yaml#getVenueSettings
      status: fixed
      by: CHG-WIR-008
    - what: requiresModule core on the F&B hub.
      why: F&B is an optional licensed module; a tenant without it should not see an F&B hub.
      source: DI-505 | screens/P08-venue-back-office.yaml#BO-104
    - what: No way to F&B Outlets (BO-044, reached only from Venue Operations) or the pack's outlet set-up screens (BO-727–BO-733).
      why: Outlet configuration is the first F&B task (DI-330) and is unreachable from the F&B section.
      source: R251 | screens/P08-venue-back-office.yaml#BO-044
    decisions:
    - question: Should the F&B hub show F&B takings rather than venue takings, and drop admissions?
      decision: The F&B hub shows F&B takings; admissions are dropped from it.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-181 | CHG-NOTE-004
      questionSource: R283 | DI-318
    - question: Is BO-104 or BO-727 (F&B Command Center) the F&B landing?
      decision: 'Drawn default stands (answer: "BO-104 is the landing hub; BO-727 is a card on it"): BO-104 is the section
        hub; BO-727 is a card on it.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-182 | CHG-NOTE-004
      questionSource: DI-400
  BO-105:
    summary: 'The Stock & Supply landing page in Venue Management. It is a hub: one card per stock and procurement screen,
      the two seeded KPI tiles, and nothing else. The one thing to get right is that it stays a launcher. It must not become
      a second item list and a second purchase-order list, which is what the generated definition shows.

      '
    outputs:
    - element: KPI tiles
      rule: 'Two tiles only, "Takings today" and "Admissions today", read for today in the venue''s time zone. Show no attention
        counts on the cards (for example "3 requisitions waiting") until a summary operation exists.

        '
      source: R283 | contracts/satellite/reporting.yaml#getKpiValues
    - element: Screen cards
      rule: 'Cards in the order a storekeeper works: Stock Levels, Inventory Items, Stock Count, Stock Movements, Requisitions,
        Purchase Orders, Goods Receipt, Stock Transfers, Suppliers, then the F&B stock screens (Recipe Consumption, Production,
        Wastage, Product Availability & 86, Alerts). Each card has a one-line plain purpose. A card whose module is not
        licensed for the tenant is not shown. The journey gets shorter; it does not look broken.

        '
      source: F76 step 1 | F92 step 1 | DI-342
    actions:
    - action: Add inventory item
      result: 'A shortcut that opens the same create form as Inventory Items (BO-081). Not a separate form.

        '
      source: contracts/satellite/inventory.yaml#createInventoryItem
    edgeCases:
    - case: Principal holds more than one venue
      expected: Ask which venue before the page renders. Never show the first venue by default.
      source: screens/P08-venue-back-office.yaml#BO-105
    - case: No permission for any stock screen
      expected: 'Say in plain words that this account has no access to Stock & Supply. Do not show an empty grid of cards.

        '
      source: screens/P08-venue-back-office.yaml#BO-105
    consistency:
    - with: BO-081
      note: The add-item form is the BO-081 form, field for field.
    - with: BO-102
      note: Same hub pattern as the Sell landing (two KPI tiles, cards, no attention counts).
    sampleData:
      venue: Aqua Park (AQP)
      kpis:
      - label: Takings today
        value: AED 184,320.50
        comparison: +6.2% vs yesterday
      - label: Admissions today
        value: 7,412
        comparison: -1.8% vs yesterday
      cards:
      - Stock Levels
      - Inventory Items
      - Stock Count
      - Stock Movements
      - Requisitions
      - Purchase Orders
      - Goods Receipt
      - Stock Transfers
      - Suppliers
    corrections:
    - what: 'The hub binds an inventory-item table, a purchase-order table and a venue-settings detail panel (biometrics,
        quiet hours, segregated access). It also has a "Venue id" text field.

        '
      why: 'These duplicate BO-081 and BO-051 and leak plumbing. Venue settings have nothing to do with stock. A hub''s
        operations should be the KPI read plus the add-item shortcut.

        '
      source: R254 | R283 | screens/P08-venue-back-office.yaml#BO-105
      status: fixed
      by: CHG-WIR-008
    - what: 'The hub declares getVenueSettings for "What is enabled here". The contract says it carries no module enablement
        and no retail setting.

        '
      why: 'The read cannot decide which cards to show. Card visibility needs the tenant''s licensed modules from another
        read.

        '
      source: contracts/spine/tenancy.yaml#getVenueSettings
      status: fixed
      by: CHG-WIR-008
  BO-109:
    summary: 'The arranging canvas for one outlet''s menu draft: sections on the left, the till grid in the middle, button
      properties on the right - what is arranged here is exactly what the cashier taps on the counter till (FNB-2B). The
      client agreed the Menu Builder defines the front-end POS layout per outlet, with categories, item tiles (image, name,
      price) and configurable button sizes for fast sellers. The one thing to get right is a faithful till preview and the
      rule that nothing reaches a till until the menu is published.'
    inputs:
    - field: Menu
      rule: 'Arrives with the menu chosen on BO-045 (menu and outlet in the header: "Dinner Menu - Oasis Bistro - draft
        v8"); no outlet id field, no date picker.'
      source: screens/P08-venue-back-office.yaml#BO-109 | DI-326
    - field: Sections and item order
      rule: Drag to reorder sections and items; an item sits in exactly one section; an "Unassigned items" tray holds items
        not yet placed. Hidden sections stay in the list with a Hidden tag.
      source: contracts/satellite/fnb.yaml#setMenuSections | contracts/satellite/fnb.yaml#/components/schemas/MenuItem
    - field: Grid
      rule: Columns by rows (4 x 4 default) per page with pages; drag from the tray onto a cell; snap on.
      source: screens/P08-venue-back-office.yaml#BO-109 | DI-157
    - field: Button properties
      rule: Display name (defaults to the item name), colour, show image on or off, size (1x1, 2x1, 2x2) for fast sellers,
        and "prompt modifiers" for items with required choices. Tile kinds are an item, a category jump, an action (system
        function) or a spacer.
      source: DI-326 | DI-157 | contracts/spine/tenancy.yaml#/components/schemas/SaleBoard
    - field: Layout scope
      rule: One layout per outlet; a till may override it (Workstation.saleBoard), and the editor says which tills use an
        override.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Till preview
      rule: Renders the tiles as POS-021 does - name, price in the venue currency, image when on, an "86" overlay on unavailable
        items - so the manager sees the till, not a form.
      source: DI-326 | screens/P08-venue-back-office.yaml#BO-109
    - element: Draft changes
      rule: A running list ("added Wagyu Slider to Burgers; moved Kids Menu to hidden") with a count, so the manager knows
        what Publish will carry.
      source: screens/P08-venue-back-office.yaml#BO-109 | F31 step 1
    actions:
    - action: Save draft
      result: Saves sections and item order (and the grid). The live menu keeps selling. A 412 conflict says who changed
        the menu and offers reload while keeping the user's arrangement visible.
      source: contracts/satellite/fnb.yaml#setMenuSections | F31 step 1
    - action: Save layout
      result: The layout save replaces the whole board - every page and tile; anything not on the canvas is removed. Changes
        reach tills with the next catalogue bundle, not immediately, and the success message says so.
      source: contracts/spine/tenancy.yaml#updateSaleBoard
    - action: Publish
      result: Hands over to the publish gate of BO-045 (what goes live, where, from when); the builder has no publish path
        of its own.
      source: contracts/satellite/fnb.yaml#publishMenu | F31 step 5
    edgeCases:
    - case: The user may edit menus but not workstation layouts
      expected: The layout save needs a different permission from the section save; the grid shows read-only with "You can
        arrange sections; ask a POS administrator to change the till layout".
      source: contracts/spine/tenancy.yaml#updateSaleBoard | contracts/satellite/fnb.yaml#setMenuSections
    - case: A page left empty
      expected: A board needs at least one page; deleting the last page is not offered.
      source: contracts/spine/tenancy.yaml#/components/schemas/SaleBoard
    - case: An item is 86'd while arranging
      expected: Its tile shows the 86 overlay in the preview; arranging is not blocked.
      source: R110 | screens/P08-venue-back-office.yaml#BO-109
    consistency:
    - with: BO-045
      note: Same menu and same draft; BO-109 is opened from it and returns to it.
    - with: POS-021
      note: Tile anatomy, sizes and section tabs must match the till exactly.
    - with: BO-124
      note: The ticketing sale-board designer (BO-124, BO-125) and this builder should share one designer component (DI-157
        scopes all three).
    sampleData:
      menu: Dinner Menu - Oasis Bistro - draft v8
      sections:
      - Starters 12
      - Grill & Mains 16
      - Burgers 18
      - Sides 14
      - Desserts 11
      - Beverages 28
      - Kids Menu (hidden)
      tiles:
      - label: Classic Beef Burger
        price: AED 46.00
        size: 2x1
        colour: '#0D6EFD'
      - label: Chicken Machboos
        price: AED 58.00
        size: 1x1
      - label: Karak Chai
        price: AED 12.00
        size: 1x1
      - label: Wagyu Slider
        price: AED 88.00
        overlay: '86'
      unassigned:
      - Truffle Fries
      - Luqaimat
      - Mango Lassi
    corrections:
    - what: Plumbing - "Outlet id" text field, "Active at" date picker, "Every menu" table with raw columns, and a "Save
        sale board" modal collecting id, code, venueId, kind and pages.
      why: The canvas is the input; nobody types a board's pages.
      source: screens/P08-venue-back-office.yaml#BO-109 | R254
      status: fixed
      by: CHG-SBO-008
    - what: Two sources of the till order. setMenuSections says its sequence is the sequence on the sale board, while updateSaleBoard
        stores its own pages and tiles (by catalogue variant, not menu item).
      why: The builder cannot tell which one the F&B till follows; one must govern (and a tile by variant cannot show menu-item
        availability or modifier prompts).
      source: contracts/satellite/fnb.yaml#setMenuSections | contracts/spine/tenancy.yaml#/components/schemas/SaleBoard
      status: logged
      by: CHG-SBO-005
    - what: The sale-board tile has no size or span, and a sale board is per venue, not per outlet.
      why: DI-326 (agreed) asks for configurable button sizes and a layout per outlet; FNB-2B draws Span.
      source: DI-326 | contracts/spine/tenancy.yaml#/components/schemas/SaleBoard | screens/P08-venue-back-office.yaml#BO-109
      status: logged
      by: CHG-SBO-005
    - what: emptyFirstRun says the screen offers no create action, yet createSaleBoard exists (on BO-124).
      why: An outlet with no board yet cannot start from the builder.
      source: contracts/spine/tenancy.yaml#createSaleBoard | screens/P08-venue-back-office.yaml#BO-124
      status: fixed
      by: CHG-WIR-008
    - what: Overlap with BO-045 (shared frame fnb-2b, both set sections) and with BO-124/BO-125 (the same sale-board update
        on seven screens).
      why: Consolidate - BO-109 as the canvas opened from BO-045, sharing one designer with BO-124/BO-125.
      source: DI-671 | DI-987 | DI-474 | DI-157
      status: fixed
      by: CHG-SBO-008
    - what: Purpose is a placeholder ("from the client design board, 20 August").
      why: Write the purpose - arrange one outlet's menu and till grid for the next publish.
      source: screens/P08-venue-back-office.yaml#BO-109
      status: fixed
      by: CHG-WIR-010
    decisions:
    - question: Is the till layout per outlet (DI-326) or per workstation (Workstation.saleBoard binds a board to a till,
        MATRIX 2.1.9)? Can two tills in one outlet differ?
      decision: Till layout per outlet, with a till override (Workstation.saleBoard).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-183 | CHG-NOTE-004
      questionSource: DI-326 | MATRIX 2.1.9
    - question: Which system functions may be placed on an F&B till grid (DI-157 lists ticket list, reservation list, transaction
        list, media lookup)?
      decision: 'Drawn default stands (answer: "F&B functions only"): Recall held sale, Table map, Order list as action tiles;
        no ticketing functions on an F&B grid.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-184 | CHG-NOTE-004
      questionSource: DI-157
  BO-110:
    summary: 'One dish''s recipe and bill of materials: the ingredient lines (inventory item, quantity, unit, optional),
      the yield, and the computed plate cost, with the selling price and food-cost percentage beside it. The recipe is what
      depletes stock when the dish sells and what makes it unavailable when an ingredient runs out. The one thing to get
      right is that cost is computed, never typed, and saving re-checks the dish''s allergens.'
    inputs:
    - field: Dish
      rule: A search by menu item name (with outlet), not a "Menu item id" text field; items without a recipe can be filtered
        ("No recipe").
      source: contracts/satellite/fnb.yaml#listRecipes | DI-325
    - field: Ingredient line
      rule: Inventory item by name and code (Beef Patty 150g, ITM-1042), quantity, unit from the item's units of measure
        and pack conversions, and an "optional" tick for garnish the guest can decline. At least one line.
      source: contracts/satellite/fnb.yaml#/components/schemas/Recipe | DI-343
    - field: Yield
      rule: Portions produced by one execution of the recipe (1 for a plated dish, 40 for a batch of soup); must be above
        zero.
      source: contracts/satellite/fnb.yaml#/components/schemas/Recipe
    outputs:
    - element: Plate cost
      rule: Read-only, computed from each line at its current inventory cost (weighted average or FIFO per the venue) divided
        by the yield; each line shows its unit cost and line cost. Labelled "Computed".
      source: R125 | contracts/satellite/fnb.yaml#setRecipe | DI-344
    - element: Price, food cost and margin
      rule: The dish's selling price, food cost % (plate cost over price before VAT) and margin in AED, as DI-329 asks;
        derived for display, not stored.
      source: DI-329 | screens/P08-venue-back-office.yaml#BO-110
    - element: Allergen verdict after save
      rule: The verdict panel refreshes with trigger "after a recipe change"; an undeclared allergen is shown first.
      source: R241 | contracts/satellite/fnb.yaml#getAllergenVerification
    actions:
    - action: Save recipe
      result: Saves the lines, recomputes plate cost, re-runs the allergen check and marks the dish stock-tracked. A 412
        says someone else changed this recipe and offers reload.
      source: contracts/satellite/fnb.yaml#setRecipe | R241 | R125
    edgeCases:
    - case: First recipe for a dish
      expected: Warn before saving that the dish becomes stock-tracked and can no longer be sold on a till while it is offline.
      source: contracts/satellite/fnb.yaml#setRecipe
    - case: An ingredient has no cost yet (never received)
      expected: The line cost reads "No cost yet" and the plate cost is marked incomplete rather than understated.
      source: designer default
    - case: An ingredient's purchase cost changes
      expected: Plate cost updates on its own (recomputed when an ingredient cost changes); no re-save needed.
      source: contracts/satellite/fnb.yaml#/components/schemas/Recipe
    consistency:
    - with: BO-111
      note: Same dish header and the same verdict panel; propose the two as tabs of one dish editor (see corrections).
    - with: BO-137
      note: Theoretical consumption comes from these lines; units must be the same.
    - with: BO-045
      note: The "No recipe" flag on a menu item links here.
    sampleData:
      dish: Classic Beef Burger (Oasis Bistro) - price AED 46.00
      yield: 1 portion
      lines:
      - item: Beef Patty 150g (ITM-1042)
        qty: 1
        unit: pc
        unitCost: AED 6.40
      - item: Brioche Bun (ITM-2201)
        qty: 1
        unit: pc
        unitCost: AED 2.10
      - item: Cheddar Slice (ITM-1188)
        qty: 1
        unit: pc
        unitCost: AED 1.35
      - item: Burger Sauce (SUB-0071)
        qty: 25
        unit: g
        unitCost: AED 0.028
      - item: Pickles (ITM-3110)
        qty: 15
        unit: g
        unitCost: AED 0.014
        optional: true
      plateCost: AED 13.06
      foodCost: 29.8% of AED 43.81 before VAT
    corrections:
    - what: The "Save recipe" modal collects costPerPortion.
      why: Cost per portion is computed and read-only (R125 (9)); a cost sent is ignored.
      source: R125 | contracts/satellite/fnb.yaml#setRecipe
      status: fixed
      by: CHG-SBO-008
    - what: Plumbing - "Menu item id" text field and a table "Every recipe" with menuItemId and the ingredients array as
        columns; two search fields.
      why: Users find a dish by name; ingredients are lines, not a column.
      source: screens/P08-venue-back-office.yaml#BO-110 | R254
      status: fixed
      by: CHG-SBO-008
    - what: The client frame for this screen (fnb-2f, "Recipe & BOM Costing") is mapped to BO-137; BO-110 has no board frame.
      why: The designer would draw BO-110 from nothing and BO-137 from the wrong frame.
      source: screens/P08-venue-back-office.yaml#BO-110 | screens/P08-venue-back-office.yaml#BO-137
      status: fixed
      by: CHG-SBO-008
    - what: Recipe yield allows 0 (minimum 0) although cost is divided by yield; waste % per line and recipe versions (both
        on FNB-2F) have no field or read; there is no way to remove a recipe.
      why: A zero yield breaks the cost; DI-329 and the frame ask for waste-adjusted costing and version history.
      source: contracts/satellite/fnb.yaml#/components/schemas/Recipe | DI-329 | screens/P08-venue-back-office.yaml#BO-110
      status: logged
      by: CHG-SBO-005
    - what: BO-110 and BO-111 both save the recipe (setRecipe) as separate screens under Sell.
      why: One dish's recipe, substitutions and allergens are one editing job; merge as tabs (Recipe | Substitutions & allergens).
      source: DI-987 | DI-474 | screens/P08-venue-back-office.yaml#BO-111
      status: fixed
      by: CHG-SBO-021
    decisions:
    - question: How is a sub-recipe (Burger Sauce SUB-0071) modelled - as an inventory item produced by a production run and
        used as an ingredient line?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw sub-recipes as ingredient lines with
        a "sub-recipe" tag that links to their own recipe.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-044 | CHG-NOTE-004
      questionSource: screens/P08-venue-back-office.yaml#BO-110 | contracts/satellite/fnb.yaml#planProductionRun
  BO-111:
    summary: 'For one dish, what is actually in it against what its label claims: allergens derived from the recipe lines,
      the approved substitutions for that recipe and the modifier groups, plus nutrition. The server re-checks the claim
      automatically after every recipe, substitution or modifier change; the manager can re-check by hand. The one thing
      to get right is the dangerous direction - an allergen present in the dish and missing from the label - shown first
      and impossible to miss.'
    inputs:
    - field: Dish
      rule: Arrives from the menu (BO-045) or the recipe with the dish chosen; otherwise a dish search by name. No id fields.
      source: screens/P08-venue-back-office.yaml#BO-111 | F31 step 3
    - field: Substitution rule
      rule: From ingredient, to ingredient, ratio (default 1; fresh to dried herbs is about 3 to 1), when it applies (Out
        of stock, Seasonal, Guest request, Cost saving, Always), active. A rule belongs to one recipe.
      source: contracts/satellite/fnb.yaml#/components/schemas/SubstitutionRule | R125
    - field: Needs approval
      rule: Switched on and locked whenever the swap adds or removes an allergen ("a chef may substitute freely within a
        claim; changing the claim is somebody else's decision").
      source: contracts/satellite/fnb.yaml#setSubstitutionRules
    - field: Declared allergens
      rule: The 14 declarable allergens as chips (gluten, crustaceans, eggs, fish, peanuts, soybeans, milk, nuts, celery,
        mustard, sesame, sulphites, lupin, molluscs) in English and Arabic.
      source: contracts/satellite/fnb.yaml#/components/schemas/AllergenCode | R096
    outputs:
    - element: Allergen verdict
      rule: Undeclared first (danger), each with its route - ingredient, substitution, modifier or shared equipment - and
        the line it came from; over-declared second (amber); "Matches the label" in neutral when clean; when it ran and
        why ("after a substitution change", "manual re-check").
      source: R241 | contracts/satellite/fnb.yaml#/components/schemas/AllergenVerdict
    - element: Allergens by ingredient line
      rule: A table of recipe lines with the allergens each brings and a "Changed" tag on a line whose allergens changed
        since the last check (FNB-2L).
      source: screens/P08-venue-back-office.yaml#BO-111
    actions:
    - action: Save substitutions
      result: Saves the recipe's whole substitution list and re-runs the check for every dish whose recipe the rules touch;
        the verdict panel refreshes. A rule pointing at a recipe that no longer exists is refused.
      source: contracts/satellite/fnb.yaml#setSubstitutionRules | R241
    - action: Re-check allergens
      result: Manual re-check; same panel, trigger "manual".
      source: R241 | contracts/satellite/fnb.yaml#verifyAllergens
    - action: Fix the label
      result: Takes the user to the dish on the menu to update its declared allergens (the claim is part of the menu item);
        then the next publish carries it.
      source: contracts/satellite/fnb.yaml#/components/schemas/MenuItem | contracts/satellite/fnb.yaml#setMenuSections
    edgeCases:
    - case: No check has run yet for this dish
      expected: '"Not checked yet" with a Re-check button, never an empty or green panel.'
      source: contracts/satellite/fnb.yaml#getAllergenVerification
    - case: A supplier change introduces an allergen into a sub-recipe
      expected: Every dish using it shows Undeclared, and the screen says how many dishes and menus are affected so the
        menus can be republished (FNB-2L "Dishes affected 18, menus to republish 6").
      source: screens/P08-venue-back-office.yaml#BO-111
    - case: An allergen-changing substitution is used at the till for a guest request
      expected: It is offered only if approved; otherwise it does not appear as a till option.
      source: contracts/satellite/fnb.yaml#/components/schemas/SubstitutionRule
    consistency:
    - with: BO-045
      note: Same verdict panel and wording.
    - with: BO-110
      note: Same dish header; propose one dish editor with tabs.
    - with: POS-021
      note: Allergen chips and words match what the cashier and the guest see on the item.
    sampleData:
      dish: Classic Beef Burger (PLU 100241)
      verdict: Undeclared - soybeans, via substitution (Burger Sauce SUB-0071, new mayonnaise supplier 22 Oct 2026). Over-declared
        - none. Checked 14:02 GST after a substitution change.
      rules:
      - from: Brioche Bun
        to: Gluten-free Bun
        ratio: 1
        when: Guest request
        needsApproval: true
      - from: Fresh Coriander
        to: Dried Coriander
        ratio: 0.33
        when: Out of stock
        needsApproval: false
      declared:
      - gluten
      - eggs
      - milk
      - mustard
      - sulphites
    corrections:
    - what: Two substitution models on one screen - setSubstitutionRules (SubstitutionRule, per recipe, allergens as lists,
        R125 (10)) and setIngredientSubstitutes (FnbIngredientSubstitute, from the 20 September workbook, allergens as JSON
        strings); listIngredientSubstitutes is used by no screen.
      why: The same rule kept twice will disagree; keep one model and one operation pair.
      source: contracts/satellite/fnb.yaml#setSubstitutionRules | contracts/satellite/fnb.yaml#setIngredientSubstitutes
      status: logged
      by: CHG-SBO-005
    - what: '"Needs approval" default contradicts itself - setSubstitutionRules says it defaults true wherever the swap
        changes an allergen; SubstitutionRule.requiresApproval defaults false.'
      why: The default decides whether an allergen-changing swap can be used unapproved.
      source: contracts/satellite/fnb.yaml#/components/schemas/SubstitutionRule
      status: logged
      by: CHG-SBO-005
    - what: Recipe fields as raw text fields (menuItemId, yield, ingredients, costPerPortion) and a "Save menu" (updateMenu
        - name, service period, active) action.
      why: updateMenu has nothing to do with allergens (attached by name, R254); recipe editing belongs to BO-110; cost
        is computed.
