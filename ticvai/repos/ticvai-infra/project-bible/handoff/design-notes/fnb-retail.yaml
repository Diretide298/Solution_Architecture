        method due) · Equipment available. Each amber row names its fix: "Sign agreement", "Capture ID", "Take deposit"
        (jumps to the deposit step), "Choose another unit". Rules marked "not applicable" for the product are not shown
        at all; "optional" ones are shown grey and never block.

        '
