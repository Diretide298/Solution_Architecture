  WEB-037:
    summary: 'One dish: what is in it, what may be changed, and the side panel where the guest chooses before adding. Allergens
      are read here more often than anywhere else in the platform, usually on a phone browser. In-venue ordering shows it
      as a dialog and takeaway or delivery as a side panel (the same thing rendered twice). The one thing to get right:
      allergens are complete and visible, and they update as options are chosen.'
    inputs:
    - field: Choose-one groups (spice level, drink size, ice)
      rule: A group whose minimum is above 0 is required and labelled "Required · choose 1". A group with a maximum of 1
        renders as radio choices. The default option (isDefault) is preselected. Add to order stays off until every required
        group has a choice, and says which one is missing.
      source: contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup | DI-1050 | TRACKER Workshops/Actions row 87
    - field: Optional add-ons and leave-outs (sides, dips, toppings, "No onions")
      rule: Checkboxes, with "Choose up to 3" from the group's maximum; further boxes disable at the limit. A priced option
        shows "+ AED 6.00"; a zero-priced one shows no price. An option that is unavailable stays visible, greyed, marked
        "Sold out", never hidden.
      source: contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup | DI-1050
    - field: Quantity
      rule: 1 to 20; the stepper sits at the foot of the panel beside the live total.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderLine
    - field: Note for the kitchen
      rule: Optional, 200 characters, placeholder "Allergies or requests"; printed prominently on the kitchen ticket.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderLine | DI-688
    outputs:
    - element: Allergens
      rule: The dish's allergens as icon plus word from the fourteen declarable allergens, in the guest's language, and
        never collapsed behind a tap. When a chosen option adds an allergen, it joins the list live, marked with its source
        ("Eggs, from Extra garlic sauce"). A dish with none says "No allergens declared".
      source: contracts/satellite/fnb.yaml#/components/schemas/AllergenCode | contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup
        | F11 step 2
    - element: Live total
      rule: Dish price plus the chosen options' price changes, times quantity, at the menu's currency scale. It updates
        on every tap.
      source: DI-1050 | contracts/satellite/fnb.yaml#/components/schemas/GuestMenu
    - element: Basket line it produces
      rule: The dish name, then the choices in group order separated by commas ("Hot, Burnt butter rice"), then quantity
        and price.
      source: DI-1050 | REV3-9
    - element: Sold-out dish
      rule: Still opens, so the guest can read the allergens. Add is disabled, and the reason is shown when given.
      source: contracts/satellite/fnb.yaml#getGuestMenu
    actions:
    - action: Add to order
      result: Adds the line with its choices and closes the panel. The basket count in the header updates. Nothing goes
        to the server until the order is placed (on WEB-036).
      source: screens/P01-guest-web-storefront.yaml#WEB-037 | DI-1050
    - action: Cancel / close
      result: Discards the choices; the basket is unchanged.
      source: screens/P01-guest-web-storefront.yaml#WEB-037
    edgeCases:
    - case: A required group has every option sold out
      expected: The dish cannot be ordered. Show it as "Sold out" with Add disabled, rather than a panel the guest cannot
        complete.
      source: contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup | designer default
    - case: The server refuses the choices (modifierConstraintUnmet) at order time
      expected: Reopen the panel for that line with the group highlighted.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderProblem
    - case: Offline
      expected: The dish stays, with "May be out of date" and its allergens in full. Add is disabled.
      source: screens/P01-guest-web-storefront.yaml#WEB-037
    consistency:
    - with: GST-061
      note: 'Functionally identical: same panel, rules, allergen display and basket-line format (DI-970, REV3-9).'
    - with: KSK-016
      note: The same allergen rendering on the kiosk card.
    - with: POS-021
      note: The same modifier groups and limits the till applies. A guest-built line and a till-built line read the same
        on the kitchen ticket.
    sampleData:
      dish: Chicken shawarma wrap · AED 38.00 · allergens gluten, sesame, milk
      groups:
      - name: Spice level
        rule: Required · choose 1
        options:
        - Mild (default)
        - Medium
        - Hot
      - name: Add-ons
        rule: Choose up to 3
        options:
        - Extra garlic sauce + AED 6.00 (adds eggs)
        - Burnt butter rice + AED 18.00
        - Gluten-free wrap + AED 10.00
        - Halloumi + AED 9.00 (Sold out)
      - name: Leave out
        rule: Optional
        options:
        - No onions
        - No pickles
      quantity: 2
      note: No sesame please, allergy
      liveTotal: AED 88.00
      basketLine: Chicken shawarma wrap ×2 · Hot, Extra garlic sauce · AED 88.00
    corrections:
    - what: The screen takes only outletId on entry, with no dish identifier, so a shared or deep link cannot open a particular
        dish.
      why: The page is a dish page; it needs the menuItemId (resolved inside the outlet's getGuestMenu) as an entry parameter.
      source: screens/P01-guest-web-storefront.yaml#WEB-037
      status: fixed
      by: CHG-SGU-018
    - what: The guest menu carries a dish's allergens as one flat list. The package's own Allergen model separates "contains"
        from "may contain" and carries vegetarian, vegan and halal flags, and the rev 3 prototype dish dialog shows a diet
        claim and kcal.
      why: '"Contains" and "may contain" are different claims; conflating them over-warns or under-warns. Halal and vegetarian
        matter to this venue''s guests. GuestMenu items should carry the Allergen object (contains, mayContain, dietary
        flags), and nutrition if the client wants kcal. Until then, draw "Contains" from the current list, and draw "May
        contain" and the diet badges as pending.'
      source: contracts/satellite/fnb.yaml#/components/schemas/Allergen | contracts/satellite/fnb.yaml#/components/schemas/GuestMenu
      status: logged
      by: CHG-SGU-024
    - what: listModifierGroups drives the screen (a "Every modifier group" table with scopePath, the pattern "list, select,
        act"), and the empty state for no access says "Sign in to see this".
      why: The dish's groups come inside getGuestMenu, and a menu is public; browsing a dish needs no sign-in.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestMenu | screens/P01-guest-web-storefront.yaml#WEB-037
      status: fixed
      by: CHG-SGU-018
  WEB-038:
    summary: 'Order tracking on the web: the guest watches the order the kitchen is actually making, and at a table sees
      the one bill for the sitting. Order to ready is the kitchen''s time; ready to collected is the counter''s. The one
      thing to get right: the status always moves with the kitchen. No timer counts down against nothing, and when it is
      ready the guest knows exactly where to go or that it is on its way.'
    outputs:
    - element: Status steps
      rule: 'The steps adapt to how the order reaches the guest. Collection: Ordered → Being made → Ready to collect → Collected.
        To a seat, lounger or cabana: Ordered → Being made → On its way → Delivered. At a table: Ordered → Being made →
        Served. "Ordered" reads "Waiting for the kitchen to accept" until the order is accepted. Cancelled and Refunded
        replace the steps with one plain message.'
      source: contracts/satellite/fnb.yaml#/components/schemas/FnbOrderStatus | contracts/satellite/fnb.yaml#/components/schemas/GuestOrderResult
        | F11 step 6
    - element: Ready to collect
      rule: 'When ready for collection, the screen turns into a pickup card: the order number very large, the collection
        point ("Hatch 3, Bite & Go") and how long it is held ("Held for 20 minutes").'
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderStatus | contracts/satellite/fnb.yaml#/components/schemas/FnbDeliveryPolicy
    - element: Ready time
      rule: A clock time in the venue's time zone ("Ready about 13:25"), from the kitchen's estimate. With no estimate,
        show nothing rather than a guess.
      source: contracts/satellite/fnb.yaml#getGuestOrderStatus | contracts/satellite/fnb.yaml#/components/schemas/DiningOutlet
    - element: Per-dish status
      rule: Each dish with its own state (Received, Being made, Ready, Served; Cancelled struck through with "refunded"),
        so a guest waiting on one dish sees which. A dish recalled by the kitchen reads "Being made".
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderStatus | contracts/satellite/fnb.yaml#/components/schemas/KitchenTicketStatus
    - element: Table bill
      rule: 'Only where the order is on a table visit. Every line ordered at the table this sitting, by app or by a server,
        as one bill: covers, lines, service charge, VAT, discounts and total.'
      source: contracts/satellite/fnb.yaml#getGuestBill
    actions:
    - action: (automatic) refresh
      result: The status is polled while the screen is open; no refresh button is needed. Changes also go to the in-venue
        notifications feed (WEB-046).
      source: screens/P01-guest-web-storefront.yaml#WEB-038
    - action: Order more
      result: Back to WEB-036 with the same location, so the next order goes to the same place.
      source: F11 step 1 | designer default
    edgeCases:
    - case: The runner cannot find the guest
      expected: 'The order is held at the outlet and the guest is told to collect it: "We couldn''t find you at Lounger
        B-14, collect it at Pool Bar." It is not thrown away.'
      source: F11 step 7
    - case: The outlet refused the order before accepting it
      expected: '"The kitchen couldn''t take your order, refunded to your card", shown at once.'
      source: F11 step 5
    - case: One dish became unavailable after acceptance
      expected: That dish shows "Cancelled, AED 29.00 refunded"; the rest carries on.
      source: F11 step 5
    - case: Signal lost
      expected: The last status stays, with its age ("Updated 3 min ago"), and is never presented as current.
      source: F11 step 6 | screens/P01-guest-web-storefront.yaml#WEB-038
    - case: The link is opened days later
      expected: The final state is shown (Collected, Delivered or Refunded) with one way on (order food again). Never a
        404.
      source: screens/P01-guest-web-storefront.yaml#WEB-038
    consistency:
    - with: GST-025
      note: Functionally identical, with the same step labels and messages (DI-970).
    - with: KIT-007
      note: Same order number and the same moment of "Ready" as the guest status board. The guest screen never runs ahead
        of the kitchen.
    - with: WEB-036
      note: Entered from Order placed.
    sampleData:
      order:
        number: AQP-104582
        outlet: Bite & Go
        collect: Hatch 3
        readyAbout: '13:25'
        held: 20 min
      lines:
      - name: Chicken shawarma wrap ×2
        status: Being made
      - name: Mango lassi
        status: Ready
      - name: Halloumi fries
        status: Cancelled · AED 29.00 refunded
      tableBill:
        outlet: Oasis Bistro
        table: Table 12
        covers: 4
        subtotal: AED 412.00
        serviceCharge: AED 41.20
        vat: AED 22.66
        total: AED 475.86
    corrections:
    - what: '"Claim table session" is the primary action of a tracking screen, on WEB-038 and GST-025.'
      why: Tracking claims nothing, and claimTableSession was superseded on 26 September. Remove it.
      source: contracts/satellite/fnb.yaml#claimTableSession | R254
      status: fixed
      by: CHG-SGU-018
    - what: The table bill (getGuestBill) is read through a TableSession id (/table-sessions/{sessionId}/bill), but guests
        now claim with claimLocationSession and hold a LocationSession with a visitId.
      why: A guest who scanned a table code under the current flow has no TableSession id to read the bill with. The bill
        should be readable by the location session or the visit.
      source: contracts/satellite/fnb.yaml#getGuestBill | contracts/satellite/fnb.yaml#/components/schemas/LocationSession
      status: logged
      by: CHG-SGU-024
    - what: The purpose says "settle the bill", but no payment operation is declared, and orders put on a table tab need
        a way to be paid.
      why: Either declare the payment of the visit's bill (card or wallet) or drop "settle the bill" and say "Pay at the
        table". The rev 3 prototype has no bill view at all.
      source: screens/P01-guest-web-storefront.yaml#WEB-038 | contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderRequest
      status: fixed
      by: CHG-SGU-018
    decisions:
    - question: Can a guest pay the table's bill from the web or app, or is the bill view read-only?
      decision: 'Drawn default accepted: Read-only bill with "Ask your server to pay"; no pay button.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-073 | CHG-NOTE-004
      questionSource: contracts/satellite/fnb.yaml#getGuestBill | F48 step 5
  WEB-042:
    summary: 'Buy merchandise on the web, pay online at checkout, and collect it on the way out (shop and drop) or have
      it delivered home. Later, find what is waiting and where. Paying creates the shop-and-drop; nothing is reserved unpaid
      on the web (R236). The one thing to get right: before paying, the guest knows where and until when to collect. After
      paying, they get one collection code, and their ticket also claims the goods.'
    inputs:
    - field: Shop
      rule: Optional, chosen by name ("Marina Bay retail store"), never typed as an id. Left empty, the screen browses every
        shop in the venue. Price and stock belong to the shop the item comes from.
