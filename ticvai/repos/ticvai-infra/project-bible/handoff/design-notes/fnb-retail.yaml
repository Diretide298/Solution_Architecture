      questionSource: screens/P08-venue-back-office.yaml#BO-137
  BO-138:
    summary: 'Today''s production batches being made: planned against made, yield, state, and the components issued (FNB-5D).
      The client asked for planned versus actual versus yield and batch losses. A batch that under-yields shows here before
      it shows up as stock variance. The one thing to get right is that yield is derived from made over planned, never typed
      or stored, and that ingredients left stock when the batch started.'
    inputs:
    - field: Kitchen and day
      rule: Kitchen or commissary picker and the day (today by default).
      source: contracts/satellite/fnb.yaml#listProductionRuns
    - field: Complete batch
      rule: Made quantity in the item's unit; a reason when made is below planned (optional in the contract); the time is
        the device's.
      source: contracts/satellite/fnb.yaml#completeProductionRun | designer default
    outputs:
    - element: Batch list
      rule: Item, planned, made, yield % (one decimal), state - Planned, Running, Complete, Cancelled - with a "Low yield"
        highlight on a complete batch well below plan; running batches show who started them and when.
      source: contracts/satellite/fnb.yaml#getProductionRun | screens/P08-venue-back-office.yaml#BO-138
    - element: Waste-risk suggestion
      rule: Items at risk with quantity, value and a recommended action (reduce prep, promote, transfer, use in a recipe),
        with its maturity badge and plain explanation; a person applies it elsewhere.
      source: MATRIX 4.8.15 | MATRIX 4.1.19 | contracts/satellite/ai.yaml#requestSuggestion
    actions:
    - action: Complete batch
      result: Moves the made quantity into stock; refused if the batch is not running, with its state named; works offline.
      source: contracts/satellite/fnb.yaml#completeProductionRun
    - action: New batch
      result: Plans a batch outside the day's plan.
      source: contracts/satellite/fnb.yaml#planProductionRun
    edgeCases:
    - case: Completed offline
      expected: Shows "Saved on this device, will sync" and replays in order when back online.
      source: contracts/satellite/fnb.yaml#completeProductionRun
    - case: A correction to the made quantity later
      expected: Yield recomputes from the corrected figure (it is never stored).
      source: contracts/satellite/fnb.yaml#getProductionRun
    consistency:
    - with: BO-113
      note: Commissary batches are the same list filtered to the commissary.
    - with: BO-139
      note: Batch losses recorded as waste use the reason Over-production or Preparation error.
    - with: BO-137
      note: Low yields here explain variance there.
    sampleData:
      kitchen: Central Commissary - Tue 3 Nov 2026
      batches:
      - batch: BAT-118
        item: Burger Sauce (SUB-0071)
        planned: 12.0 kg
        made: '-'
        state: Running - started 14:20 by Priya Nair
      - batch: BAT-116
        item: Beef Patty 150g (ITM-1042)
        planned: 400 pc
        made: 386 pc
        yield: 96.5%
        state: Complete
      - batch: BAT-115
        item: Sea Bass Fillets
        planned: 28.0 kg
        made: 16.8 kg
        yield: 60.0%
        state: Complete - low yield
    corrections:
    - what: The population is listExpiringBatches - supplier stock batches with lot numbers and expiry - not production
