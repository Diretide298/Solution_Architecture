  KIT-007:
    summary: 'Two faces of collection. (1) The **guest status board**: a customer-facing screen in the dining area showing
      order numbers only, under Preparing and Ready for pickup, readable across the room; this screen owns it and the till''s
      queue mirrors it (POSV2-7). (2) The collection point''s staff view: call the number, hand over, record it. The one
      thing to get right: the guest board shows numbers only — never a name — and is an unattended display with no buttons.

      '
    outputs:
    - element: Guest status board
      rule: 'Two columns, Preparing and Ready for pickup, large order numbers; a number moving to Ready animates once and
        may chime; numbers leave the board when collected. Only counter, takeaway and app-collection orders — never dine-in,
        delivery or partner orders. Venue branding allowed on this guest-facing display.

        '
      source: POSV2-7 | DI-790 | DI-794 | screens/P15-kitchen-display.yaml#KIT-007
    - element: Staff collection list
      rule: Ready orders with how long they have waited; buzzer number where pagers are used.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket | F108 step 6
    actions:
    - action: Handed over
      result: Records Collected (or Guest not found / Refused with a note, which leaves the order Ready).
      source: contracts/satellite/fnb.yaml#recordOrderHandover
    edgeCases:
    - case: Nobody collects a ready order
      expected: It stays on the board, then is recorded as uncollected rather than silently closed.
      source: F108 step 6
    - case: Offline
      expected: The board keeps showing from the venue network; a stale board shows a small "updating" marker, never a frozen
        list without notice.
      source: screens/P15-kitchen-display.yaml#KIT-007
    consistency:
    - with: POS-029
      note: The till's queue shows a mirror of this board with the same numbers and columns (POSV2-7).
    - with: GST-025
      note: The guest's app tracker says "Ready for pickup" at the same moment the number moves here.
    sampleData:
      board:
        preparing:
        - '841'
        - '847'
        - '850'
        readyForPickup:
        - '846'
        - '848'
    corrections:
    - what: 'The guest board is drawn inside a staff screen that also has the course number field, a status text field,
        "Every kitchen ticket" and Bump, with the station-assignment no-access state.

        '
      why: The board is an unattended customer display; staff controls and kitchen states must not appear on it.
      source: screens/P15-kitchen-display.yaml#KIT-007 | POSV2-7
      status: fixed
      by: CHG-SPO-017
    - what: The buzzer number exists on the ticket, but nothing writes it from the till and nothing dispatches to a pager.
      why: The screen promises "Buzzer" in its name; pagers cannot work as specified.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket | screens/P15-kitchen-display.yaml#KIT-007
      status: logged
      by: CHG-SPO-019
    decisions:
    - question: Does the guest board carry the venue's branding (it is guest-facing) or TICVAI branding (it runs on a staff
        device)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Venue branding on the guest board; TICVAI
        branding on the staff collection view.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-056 | CHG-NOTE-004
      questionSource: DI-296 | DI-084
  KIT-008:
    summary: 'What went wrong in the kitchen tonight and the controls for it: take an item off sale (86) at once on every
      till and guest menu, see what was 86''d today and for how long, log an equipment failure or a late delivery, and the
      food-safety position before and during service. The one thing to get right: 86 is one tap with a reason and an optional
      return time, and it says it is live everywhere.

      '
    inputs:
    - field: Take off sale (86)
      rule: Item, reason (Sold out · Ingredient unavailable · Equipment down · Seasonal · Other with a note), back at (optional).
        Immediate; works offline and replays.
      source: contracts/satellite/fnb.yaml#setItemAvailability | R110 | R222
    - field: Kitchen exception
      rule: Equipment down · Item ran out · Late delivery · Staff short · Power loss · Spillage · Other (note required);
        station and ticket optional; duration in minutes.
      source: contracts/satellite/fnb.yaml#logKitchenException | R222
    outputs:
    - element: Off sale today
      rule: Item, when it went off, who called it, reason, back at / came back, orders refused meanwhile.
      source: contracts/satellite/fnb.yaml#list86Events
    - element: Food safety
      rule: Checks due, checks missed, open corrective actions, unsigned findings, oldest open action; a missed check counts
        like a failed one.
      source: contracts/satellite/fnb.yaml#getHaccpStatus | R125
    edgeCases:
    - case: An item 86'd here while a till is offline
      expected: The offline till keeps selling it; the kitchen refuses it at send, before payment.
      source: F108 step 3
    consistency:
    - with: BO-140
      note: The back office's availability and food-safety screen shows the same 86 events; both apply immediately (R110(c)).
    - with: POS-021
      note: The till shows the item as Unavailable with the return time.
    sampleData:
      offSale:
      - Kunafa — Sold out · 17:10 by Chef Rami · back at 18:00
      - Grilled hammour — Supplier failure · 12:30 · back tomorrow
      exception: Fryer 2 down · 40 min · Fryer station · 'oil temperature fault'
      foodSafety: Checks due 3 · missed 1 · open actions 2 · oldest 5 h
    corrections:
    - what: The food-safety status read declares its response inline, so the panel cannot bind to a named shape.
      why: The screen's own gap; the contract should name the schema.
      source: screens/P15-kitchen-display.yaml#KIT-008 | contracts/satellite/fnb.yaml#getHaccpStatus
      status: logged
      by: CHG-SPO-019
    - what: A "From" date picker and a raw "Every eighty six event" table, plus "Save kitchen ticket status" on an exceptions
        screen.
      why: Plumbing; the screen shows today's events and has no ticket status to save.
      source: screens/P15-kitchen-display.yaml#KIT-008 | R254
      status: fixed
      by: CHG-WIR-008
  KIT-009:
    summary: 'The kitchen''s targets and priority rules for an outlet: how long a ticket may wait per order type before
      it is late, when it turns amber, and what pushes a ticket up the rail (age, promise time, table stage, VIP). Used
      by a head chef or F&B manager before service. The one thing to get right: the targets read as plain minutes per order
      type, with a preview of how tonight''s rail would look.

      '
    inputs:
    - field: Target per order type
      rule: Minutes (at least 1) for Dine-in, Quick service, Takeaway, Delivery, Room service; warn at a percentage (default
        80%).
      source: contracts/satellite/fnb.yaml#setKitchenSla | contracts/satellite/fnb.yaml#/components/schemas/KitchenSla
    - field: Priority weights
      rule: Relative weights for ticket age, promise time, table stage and VIP, shown as sliders with a plain explanation.
      source: contracts/satellite/fnb.yaml#setKitchenSla
    - field: Recall window
      rule: Minutes a bumped ticket can be recalled (proposed 10); a venue setting with a tenant default.
      source: R094 | contracts/satellite/fnb.yaml#recallKitchenTicket
    edgeCases:
    - case: Someone else saved the rules meanwhile
      expected: '"These rules changed since you opened them — reload."'
      source: contracts/satellite/fnb.yaml#setKitchenSla
    consistency:
    - with: BO-136
      note: The F&B global settings hold the venue-level defaults; this screen sets one outlet's targets.
    - with: KIT-002
      note: The amber/red colours on the rail come from these targets.
    sampleData:
      targets:
      - Dine-in mains 18 min (amber at 80%)
      - Quick service 8 min
      - Takeaway 12 min
      - Delivery 15 min
      weights: Age 3 · Promise time 5 · Table stage 2 · VIP 4
    corrections:
    - what: 'setVenueSettings (the whole venue settings record, TENANT_CONFIGURE — support hours, biometrics, segregated
        access) is on the kitchen screen as "Save venue settings".

        '
      why: A kitchen rules screen needs only the F&B recall window; exposing the whole venue record on a kitchen device
        is a permission leak.
      source: contracts/spine/tenancy.yaml#setVenueSettings | R254
      status: fixed
      by: CHG-WIR-008
    - what: Prioritising a single ticket ("Reason", "Priority" fields) is on a rules screen; there is no read of the current
        targets.
      why: Prioritising is a live act on the pass (KIT-003); a rules editor needs to load what is set.
      source: screens/P15-kitchen-display.yaml#KIT-009 | contracts/satellite/fnb.yaml#setKitchenSla
      status: fixed
      by: CHG-SPO-017
