      source: designer default | MoM 2026-09-09 4.7
    - what: Tiles "Checkout in Progress" and "Equipment Issues" have no data behind them.
      why: 'RentalBooking.status goes from awaitingArrival straight to checkedOut (no in-progress state) and no booking
        field records an equipment issue before handover. Drop both, or add a status the contract can count.

        '
      source: contracts/satellite/rental.yaml#/components/schemas/RentalBooking
    decisions:
    - question: 'What does the handheld do offline at the rental counter? All 30 staff-app rental screens have the offline
        state as TODO. check-out, equipment assignment, inspection, return and incident are offline-capable in the contract,
        but the reads they depend on (the booking list and one booking) are not, and a card deposit hold needs the payment
        network.

        '
      decision: 'Drawn default stands (answer: "Offline: check-out of bookings already loaded, with a cash deposit or supervisor
        approval; returns queue"): Draw an offline banner; allow check-out only for a booking already loaded, with a cash
        deposit or a supervisor override; queue the call and show "Will sync". Returns may be recorded offline with the statement
        marked "Settles when back online".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-302 | CHG-NOTE-004
      questionSource: DI-070 | DI-071 | DI-072 | contracts/satellite/rental.yaml#checkOutRental | contracts/satellite/rental.yaml#getRentalBooking
    - question: How long does an uncollected booking hold its equipment before it becomes a no-show? R169 sets hold lengths
        for seats, carts and merchandise but none for a rental.
      decision: 'Drawn default accepted: Show "Late arrival +N min" in amber from the booked start; offer "Mark no-show" only
        to a supervisor (it goes through the booking modification screen BO-542).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-303 | CHG-NOTE-004
      reviewable: true
      questionSource: R169 | contracts/satellite/rental.yaml#updateRentalBooking
  EMP-072:
    summary: 'Finding the guest''s booking from the QR voucher they show. On the handheld this is the scan action of the
      check-out queue and a result card, not a destination of its own; the card confirms the guest and booking before the
      attendant starts the handover. Get right: a failed scan must say why (not found, wrong venue, cancelled, already checked
      out) in one line.

      '
