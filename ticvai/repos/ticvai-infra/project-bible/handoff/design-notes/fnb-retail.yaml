    summary: 'Book a restaurant table, change or cancel it, or join and leave a restaurant''s waitlist, in the app. Restaurant
      tables only: cabanas, loungers and non-dining tables are picked on the venue map (GST-074). No card is needed unless
      the venue has switched on a dining deposit. The one thing to get right: the guest is told plainly, before confirming,
      whether money is involved and what cancelling costs.'
    inputs:
    - field: Restaurant, date, time, party size
      rule: One screen. Times are those the restaurant takes ("tonight's times" first). There is no availability read for
        guests, so a full time is learned when booking and answered with alternatives. No table picking and no duration.
      source: contracts/satellite/fnb.yaml#createTableReservation | DI-1001 | REV3-8 | screens/P02-guest-mobile-app.yaml#GST-070
    - field: Allergies or requests
      rule: Optional free text, sent as the booking note.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservation | DI-688
    - field: Seating preference and occasion
      rule: Asked for by the client and shown in the prototype, but with no field on the booking; see corrections. Draw
        seating as optional chips (Any, Indoor, Outdoor) and occasion as an optional choice, marked pending.
      source: DI-688
    - field: Waitlist (party size, seating)
      rule: 'Party size and seating: Any, Indoor, Outdoor, Bar, Booth, High chair needed. Name and contact come from the
        profile.'
      source: contracts/satellite/fnb.yaml#joinRestaurantWaitlist
    - field: Change booking
      rule: Only party size and time can change; the restaurant is fixed. With a per-guest deposit, a larger party is asked
        for the difference and a smaller one has the excess released, stated before saving.
      source: contracts/satellite/fnb.yaml#updateTableReservation
    outputs:
    - element: Booked
      rule: '"Table for 4 · Thu 15 Oct · 19:30 · Oasis Bistro", with "No card needed" and "Cancelling is free". It is confirmed
        straight away and never shown as a basket line.'
      source: REV3-8 | DI-1048 | contracts/satellite/fnb.yaml#updateTableReservation
    - element: Deposit (venue option, off by default)
      rule: Only when the booking comes back awaitingDeposit and the party is at or above the venue's starting size (the
        prototype uses 6+). Show amount × basis, whether it is an authorisation or a charge, "Free to cancel until …", what
        a late cancel or no-show costs, and whether it is released or put towards the bill on arrival. A 15-minute countdown
        runs while it is unpaid. The amount comes from venue settings, never a constant.
      source: REV3-8b | DI-1049 | contracts/spine/orders.yaml#/components/schemas/DiningDepositPolicy | contracts/satellite/fnb.yaml#/components/schemas/TableReservationDeposit
    - element: Booking status
      rule: Pay deposit to confirm (with time left) · Booked · Confirmed · Seated · Completed · Cancelled · No-show.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservation
    - element: Waitlist place
      rule: '"About 25 min" quoted. When notified: "Your table is ready, come to the host stand by 19:42" (the hold expiry).
        Leave is always visible.'
      source: contracts/satellite/fnb.yaml#/components/schemas/RestaurantWaitlist
    actions:
    - action: Reserve
      result: 'No deposit: confirmed at once. Deposit: the deposit line goes into the cart, the guest pays at GST-041, and
        the booking turns Booked when the payment is authorised.'
      source: contracts/satellite/fnb.yaml#createTableReservation | REV3-8b | contracts/spine/orders.yaml#checkoutCart
    - action: Cancel booking
      result: 'The confirmation says the consequence first: "Free to cancel", or "Your AED 600.00 deposit is released",
        or "Your deposit is kept (less than 24 hours before)". A smaller party releases seats at once.'
      source: contracts/satellite/fnb.yaml#updateTableReservation | REV3-8b
    - action: Leave the waitlist
      result: 'Confirm: "Give up your place? The next party moves up." Leaving after being called frees the table at once.'
      source: contracts/satellite/fnb.yaml#leaveRestaurantWaitlist | R073
    edgeCases:
    - case: No table for the party size versus fully booked
      expected: Two different messages, each with other times. "No table for 8 at 19:30" is not the same answer as "Fully
        booked at 19:30".
      source: contracts/satellite/fnb.yaml#createTableReservation
    - case: The deposit is not paid within 15 minutes
      expected: The table is released, the booking ends, and the guest is told and offered to try again.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableReservationDeposit | R169
    - case: The deposit card is declined
      expected: The booking stays "Pay deposit to confirm" until the hold runs out; retry or another card.
      source: contracts/spine/orders.yaml#createPayment | REV3-8b
    - case: The booking date is beyond what a card authorisation can hold
      expected: The deposit is charged now instead of authorised, and the guest is told so before paying.
      source: contracts/spine/orders.yaml#/components/schemas/DiningDepositPolicy
    - case: Leave the waitlist after being seated
      expected: Refused, with the status named.
      source: contracts/satellite/fnb.yaml#leaveRestaurantWaitlist
    - case: Offline
      expected: Booking and joining are not offered; nothing is held offline.
      source: screens/P02-guest-mobile-app.yaml#GST-070
    consistency:
    - with: WEB-036
      note: The web does table booking and the waitlist on WEB-036. The wording, deposit terms and refusals must match word
        for word, and the web must also be able to change and cancel (see corrections).
    - with: GST-074
      note: Cabanas, loungers and beach or event tables are booked on the map, not here (GAP-C2).
    - with: GST-041
      note: The deposit line in the shared cart shows the reservation date (23SEP-9).
    - with: GST-030
      note: '"Your table is ready" for a waitlist party also arrives as a notification.'
    sampleData:
      seeAlso: WEB-036 sampleData (reservation, deposit, waitlist)
      guest: Priya Nair
      reservation:
        outlet: Oasis Bistro
        party: 6
        when: Fri 6 Nov 2026, 20:00
        deposit: AED 100.00 per guest · AED 600.00 authorised
        freeToCancelUntil: Thu 5 Nov 2026, 20:00
        onArrival: Released
    corrections:
    - what: joinWaitlist and leaveWaitlist (the catalogue waitlist for a sold-out performance) are declared beside the restaurant
        waitlist.
      why: They were attached by name. A performance waitlist belongs to the event booking screens; on a table booking screen
        it gives the guest two "Join waitlist" buttons that mean different things.
      source: contracts/spine/catalogue.yaml#joinWaitlist | R254 | screens/P02-guest-mobile-app.yaml#GST-070
      status: fixed
      by: CHG-SGU-018
    - what: The screen requires only core, while WEB-036 and GST-024 require fnb. The route and component still say "reserve-table-cabana".
      why: It is the F&B table booking (tables only since R073(c), cabanas moved to GST-074 under GAP-C2).
      source: screens/P02-guest-mobile-app.yaml#GST-070
      status: fixed
      by: CHG-SGU-018
    - what: The wireframe differences note says the screen "has no deposit (R077a)".
      why: 'Stale: REV3-8b superseded R077(a) on 29 September, and the deposit is a venue option.'
      source: screens/P02-guest-mobile-app.yaml#GST-070 | REV3-8b
      status: fixed
      by: CHG-SGU-018
    - what: The booking and change forms collect id, status, tables, groupId, actualPartySize and tableVisitId; the waitlist
        form collects id, status, recordedAt, notifiedAt, syncedAt and holdExpiresAt.
      why: These are server-set or staff fields; the guest enters only the inputs above.
      source: screens/P02-guest-mobile-app.yaml#GST-070 | R254
      status: fixed
      by: CHG-SGU-018
    - what: No guest-callable read of one's own table bookings or waitlist place exists (listTableReservations is staff-only),
        yet the screen opens from reservationId and entryId links to change, cancel or leave.
      why: Without a read, the screen cannot show the booking it is changing, or the waitlist position and "your table is
        ready".
      source: contracts/satellite/fnb.yaml#listTableReservations | screens/P02-guest-mobile-app.yaml#GST-070
      status: logged
      by: CHG-SGU-024
    - what: TableReservation has no seating preference or occasion, which the client asked for and the prototype shows.
      why: See WEB-036.
      source: DI-688 | contracts/satellite/fnb.yaml#/components/schemas/TableReservation
      status: fixed
      by: CHG-SGU-018
    decisions:
    - question: Seating preference and occasion on a table booking, as fields or in the note?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw both as optional choices, marked pending
        a field.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-053 | CHG-NOTE-004
      questionSource: DI-688
    - question: The party size from which a deposit applies (prototype 6+, contract default 1, "client to correct").
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Show the rule as the venue sets it ("Deposit
        for parties of 6 or more").'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-054 | CHG-NOTE-004
      questionSource: contracts/spine/orders.yaml#/components/schemas/DiningDepositPolicy
  POS-001:
    summary: 'Shift opening on a till, used once per cashier shift (not on every sign-in or return from a break, DI-777):
      the cashier counts the opening float note by note and coin by coin while the till checks its own hardware in parallel,
      then opens the shift and starts selling. The one thing to get right: **the count is blind** — the cashier never sees
      the expected float or a live variance while counting (POSV2-3, R080(e)); and a broken device is found here, before
      the first guest, never mid-transaction (DI-778).

      '
    inputs:
    - field: Denomination count
      rule: 'One row per active denomination of the venue currency, in drawer order (notes highest first, then coins as
        they sit in the tray), each with the note or coin image, a − / + stepper and a typed quantity field (type "50" instead
        of tapping fifty times). The row total is computed, never typed. UAE: notes 1000, 500, 200, 100, 50, 20, 10, 5 AED;
        coins 1 AED, 50 fils, 25 fils. 3-decimal currencies keep the third decimal.

        '
      source: DI-775 | DI-776 | DI-306 | R229 | F32 step 2 | contracts/spine/shift.yaml#listDenominations
    - field: Total-only entry
      rule: Where the venue is set to take the float as a single amount instead of by denomination, one amount field replaces
        the rows.
      source: DI-307
    - field: Deposit box / bag number
      rule: Shown only where the venue requires deposit-box allocation or bag numbers; scanned or typed, up to 64 characters.
      source: contracts/spine/shift.yaml#openShift
    - field: Role (several roles)
      rule: 'A user holding several roles picks the one for this shift before the count (Cashier, Supervisor); a user with
        one role is never asked.

        '
      source: DI-249 | F32 step 1 | contracts/spine/identity.yaml#selectRole
    outputs:
    - element: Counted total
      rule: 'The running counted total and "7 notes · 10 coins counted". No expected float, no "matches / does not match",
        no variance while counting.

        '
      source: POSV2-3 | R080
    - element: Hardware check
      rule: 'Runs automatically when the screen opens, in parallel with the count: receipt printer, ticket and wristband
        printer, cash drawer, card terminal, scanner, network — each Pass / Attention / Failed with the reason in plain
        words ("Paper roll low — replace before peak"). Re-run on demand. A failure says what will not work ("Tickets cannot
        print at this till") and what to do.

        '
      source: DI-778 | DI-897 | F32 step 1 | contracts/spine/tenancy.yaml#getWorkstationHealth
    - element: Who and where
      rule: Till name and outlet, cashier name and role, date and time; TICVAI branding on staff devices.
      source: DI-779 | DI-296
    actions:
    - action: Open shift & start selling
      result: 'Opens the shift with the counted float and goes to the till''s sales board (Till Home or the board this till
        is linked to). Online only — a float declared offline cannot be reconciled against the safe.

        '
      source: contracts/spine/shift.yaml#openShift | F32 step 2 | DI-247
    - action: Supervisor approves the opening float
      result: 'Where the venue requires approval on open, or the float is outside tolerance, the shift waits as "Waiting
        for a supervisor". The supervisor enters their PIN on this till and a reason; only then can the cashier sell.

        '
      source: contracts/spine/shift.yaml#approveShiftOpen | MATRIX 5.9.8
    - action: Resume shift
      result: 'When this cashier''s own shift is suspended on this till (back from a break), the screen offers Resume instead
        of a new count.

        '
      source: DI-777 | DI-245 | contracts/spine/shift.yaml#resumeShift
    - action: Retry device test
      result: Re-runs the failed device only.
      source: DI-778
    edgeCases:
    - case: A shift is already open on this till
      expected: Refused; shows whose shift it is. A second user cannot sign in over it; a supervisor ends the other session.
      source: contracts/spine/shift.yaml#openShift | DI-245 | R184
    - case: A required device is missing or failed
      expected: 'The contract refuses the open ("required device absent"); the flow says a manager may approve opening anyway
        with a reason. Draw the refusal with "Ask a supervisor" until this is settled (see corrections).

        '
      source: contracts/spine/shift.yaml#openShift | F32 step 1
    - case: The network is down
      expected: Opening is refused with the reason; the count stays on screen so it is not lost.
      source: contracts/spine/shift.yaml#openShift | F32 step 2
    - case: The cashier's role cannot sell on this till
      expected: The count is kept, the shift does not open, and a supervisor can open it against the same count.
      source: screens/P04-point-of-sale.yaml#POS-001
    consistency:
    - with: POS-007
      note: The same denomination counter (images, stepper, typed quantity) is used for the blind close.
    - with: POS-000
      note: Sign-in happens on POS-000; this screen starts after it and only at the start of a shift.
    - with: POS-016
      note: The hardware list and device names come from the till's configuration.
    sampleData:
      till: Aqua Park Gate A · Till 14
      cashier: J. Smith · Senior Cashier
      count: AED 500 × 1, AED 200 × 1, AED 100 × 2, AED 50 × 1, AED 20 × 2, AED 5 × 0, AED 1 × 8, 50 fils × 4 → AED 1,000.00
        counted
      hardware:
      - 'Receipt printer — Attention: paper roll low'
      - Cash drawer — Pass
      - Card terminal — Pass
      - 'Ticket & wristband printer — Failed: not responding'
    corrections:
    - what: 'The screen is modelled as an approval inbox ("Waiting for a decision", "Every shift", "Every denomination"
        tables; empty state "Nothing is waiting, which is the good outcome").

        '
      why: Its purpose is "Count the opening float and open the till" — a count form with a hardware panel, not a queue.
      source: screens/P04-point-of-sale.yaml#POS-001 | R254
      status: fixed
      by: CHG-WIR-008
    - what: 'Thirteen operations that belong to other screens are attached, each with a button: Close shift, Accept shift
        variance, Reopen, Suspend, Create cash movement, Record no sale, Adjust deposit box float, and the shift lists.

        '
      why: 'Closing and variance acceptance are POS-007; cash in/out is POS-017; safe drops POS-018; no-sale and suspend
        belong on the till''s shift menu. Keep openShift, getCurrentShift, resumeShift, approveShiftOpen, listDenominations,
        getWorkstationHealth and selectRole.

        '
      source: R254 | R080
      status: fixed
      by: CHG-WIR-008
    - what: The offline state says "Opens locally and syncs".
      why: openShift is online only (F32, R257) and the screen's own transition says opening does not work offline.
      source: contracts/spine/shift.yaml#openShift | screens/P04-point-of-sale.yaml#POS-001
      status: fixed
      by: CHG-SPO-015
    - what: 'A panel shows the "Suggested float from the venue default", and the client-approved and v2 builds show "Expected
        float AED 1,000.00" with "Matches expected float — no variance".

        '
      why: POSV2-3 decided the expected float and the live variance are not shown while counting.
      source: POSV2-3 | R080
      status: fixed
      by: CHG-SPO-015
    - what: The edge to Close Shift is guarded by shift.reopen.
      why: Closing needs the close permission; reopen is a supervisor reversal of a closed shift.
      source: screens/P04-point-of-sale.yaml#POS-001 | contracts/spine/shift.yaml#closeShift
      status: fixed
      by: CHG-WIR-008
    - what: 'approveShiftOpen takes only a reason, while reopenShift carries a supervisor PIN step-up on the same device.

        '
      why: An opening approved without proof the supervisor was present is the control R144 replaced on reopen; use the
        same step-up.
      source: contracts/spine/shift.yaml#approveShiftOpen | contracts/spine/shift.yaml#reopenShift | R144
      status: fixed
      by: CHG-WIR-008
    - what: 'F32 says a till with a failed device can still open with a manager''s approval, but openShift refuses when
        a required device is absent.

        '
      why: The flow and the contract disagree; decide which wins.
      source: F32 step 1 | contracts/spine/shift.yaml#openShift
      status: logged
      by: CHG-SPO-020
    - what: The v2 frame's "Report to facilities" button on a failed device.
      why: No operation behind it; dropped (POSV2-8).
      source: POSV2-8
      status: fixed
      by: CHG-SPO-015
    decisions:
    - question: Is a float count needed for a cashier who does not handle cash (a card-only F&B counter)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Always count when the till has a cash drawer;
        skip the count only where the till has no drawer configured.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-058 | CHG-NOTE-004
      questionSource: designer default
  POS-007:
    summary: 'The end of a cashier''s shift: count the drawer blind, declare non-cash totals, give a reason if the count
      is off, and close. Above the venue''s threshold, a supervisor accepts the variance on this till with their PIN — the
      only path (R080(e)). The one thing to get right: **the expected cash is never shown before the count is submitted**,
      and a variance is recorded, never corrected away.

      '
    inputs:
    - field: Counted cash by denomination
      rule: Same counter as the opening float (note and coin images, stepper, typed quantity), in drawer order; the expected
        figure is withheld.
      source: DI-803 | DI-775 | DI-776 | contracts/spine/shift.yaml#closeShift
    - field: Non-cash totals
      rule: Declared total per non-cash tender (card terminal batch, wallet), reconciled against captured payments after
        submission.
      source: contracts/spine/shift.yaml#closeShift
    - field: Variance reason (cashier)
      rule: 'When the submitted count is off, the cashier picks a reason — Till error · Unrecorded refund · Miscount · Other
        — and adds a comment before the shift can close; Other needs the comment.

        '
      source: DI-803 | R222
    - field: Supervisor acceptance
      rule: Supervisor's PIN on any till at the venue (not the cashier whose shift it is) and a reason of at least 3 characters.
        Only when the variance is above the venue threshold (proposed AED 20.00).
      source: contracts/spine/shift.yaml#acceptShiftVariance | R080 | contracts/spine/tenancy.yaml#setVenueSettings | decided
        2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Result after submission
      rule: 'Within threshold: "Shift closed" with the closing receipt printing. Above threshold: "Over/short recorded — a
        supervisor must accept it" the cashier may sign out, and the cashier''s view shows "Under review"; the pending shift
        never blocks the next cashier opening a shift on this till. The amount appears only on the supervisor''s step. Per
        non-cash tender: declared vs captured.'
      source: contracts/spine/shift.yaml#closeShift | DI-806 | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - element: Closing receipt and report
      rule: 'Prints a closing receipt itemised by denomination; the closing report is emailed to finance automatically.

        '
      source: DI-272
    - element: Shift numbers for the supervisor
      rule: No-sale count, manual discounts, voids and refunds during the shift — the numbers a supervisor reviews before
        accepting.
      source: screens/P04-point-of-sale.yaml#POS-007
    actions:
    - action: Submit count
      result: Moves from the count to a summary of what was counted; "Back to count" returns.
      source: screens/P04-point-of-sale.yaml#POS-007
    - action: Close shift
      result: 'Submits the blind count. Returns unsold held capacity from this till by default. Closed within threshold,
        or pending a supervisor above it.

        '
      source: contracts/spine/shift.yaml#closeShift
    - action: Accept variance (supervisor)
      result: Supervisor PIN step-up and a reason; the shift is finalised and the acceptance is recorded against the supervisor's
        name.
      source: contracts/spine/shift.yaml#acceptShiftVariance | R080
    edgeCases:
    - case: Open orders remain (a held sale, an unpaid F&B order, an open table)
      expected: Close is refused and lists them, each with where to finish or cancel it.
      source: contracts/spine/shift.yaml#closeShift
    - case: The till is offline
      expected: Closing is refused; a locally computed variance is not a variance. The cashier is told to reconnect.
      source: screens/P04-point-of-sale.yaml#POS-007
    - case: The cashier tries to accept their own variance
      expected: Refused ("A different supervisor must accept this").
      source: contracts/spine/shift.yaml#acceptShiftVariance
    - case: A count line is mistyped (unknown denomination, duplicate, total not matching count × value)
      expected: Refused per row; the total is computed on the till so this should not arise from the UI.
      source: contracts/spine/shift.yaml#closeShift
    - case: The till runs another shift after this one
      expected: Each cashier closes their own drawer; the till stays usable for the next cashier.
      source: F32 step 6
    - case: No supervisor is free when the cashier closes
      expected: The cashier signs out; the shift stays pending ("Under review"). A supervisor resolves it later on any till
        with their PIN (closeShift on this screen) or in the daily cash reconciliation, which lists every shift and resolves
        them one by one. The next cashier can open a shift meanwhile.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    consistency:
    - with: POS-001
      note: Same denomination counter component and drawer order.
    - with: BO-040
      note: The back office reviews shift variances after the fact; acceptance itself happens only here on the till (R080(e)).
    - with: POS-025
      note: Close is reached from the On shift pill / shift panel; the panel shows no expected cash (POSV2-3).
    sampleData:
      cashier: J. Smith · Till 14 · shift 09:42–18:00
      counted: AED 8,460.00 cash counted · card declared AED 12,215.50 · wallet AED 1,040.00
      result: Over/short recorded · Under review
      supervisorView: 'Expected AED 8,480.00 · Counted AED 8,460.00 · Short AED 20.00 · reason: Miscount — ''2 × AED 10 notes
        in the coin tray'''
    corrections:
    - what: 'The screen is modelled as an approval inbox and carries fourteen bulk-attached operations with buttons (Open
        shift, Approve shift open, Reopen, Resume, Suspend, Create cash movement, Record no sale, Adjust deposit box float,
        Close deposit boxes, Reprint receipt), plus "Every shift" and "Every denomination" tables.

        '
      why: 'Its purpose is to count the drawer and close. Keep closeShift, acceptShiftVariance, getCurrentShift, listDenominations
        (and listCashMovements for the supervisor''s review); move the rest to their own screens.

        '
      source: screens/P04-point-of-sale.yaml#POS-007 | R254 | F87 step 4
      status: fixed
      by: CHG-WIR-008
    - what: 'The client asked for a cashier variance reason list (Till error, Unrecorded refund, Miscount, Other) and a
        comment, but closeShift has only free notes.

        '
      why: Reasons are the data (the same rule as R222); a code is needed for reporting.
      source: DI-803 | contracts/spine/shift.yaml#closeShift
      status: fixed
      by: CHG-FIN-003
    - what: 'The client asked that a supervisor can reject a flagged variance so the cashier recounts and resubmits; acceptShiftVariance
        only accepts, and a closed shift can only be reopened by a supervisor step-up.

        '
      why: There is no reject-and-recount path for DI-804.
      source: DI-804 | contracts/spine/shift.yaml#acceptShiftVariance | contracts/spine/shift.yaml#reopenShift
      status: fixed
      by: CHG-FIN-003
    - what: The client-approved build shows COUNTED and EXPECTED side by side while counting.
      why: Contradicts the blind count (R080(e), POSV2-3, DI-271).
      source: screens/P04-point-of-sale.yaml#POS-007 | R080 | POSV2-3
      status: fixed
      by: CHG-FIN-003
    decisions:
    - question: If no supervisor is available, may the cashier sign out with the variance logged for later review instead
        of being blocked?
      decision: A cashier may sign out with the variance pending; the shift shows "Under review" on the cashier's view and
        never blocks the next cashier opening a shift on that till. A supervisor resolves it with closeShift on POS-007 (supervisor
        PIN, any till) or in the daily cash reconciliation, which lists every shift and resolves them one by one (Pre-apply
        round, 2 October).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-059 | CHG-NOTE-004
      questionSource: DI-805 | TRACKER 30-Sep/Tracker row 30 | TRACKER Workshops/Actions row 276
    - question: After submission, does the cashier see the variance amount, or only the supervisor?
      decision: 'Blind close: the cashier sees only that a variance was recorded; the supervisor sees the amount.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-060 | CHG-FIN-003 | CHG-NOTE-004
      questionSource: DI-806 | R080
  POS-009:
    summary: 'Who is on duty right now, on which till, and their own clock: a supervisor sees the venue''s staff on shift
      (role, till, shift times, status), and any staff member clocks in or out and starts or ends a break here — the v2
      shift panel''s Clock Out and Start Break moved here (POSV2-3). The one thing to get right: attendance (clock) and
      the cash shift are separate — clocking out does not close a drawer.

      '
    inputs:
    - field: Clock in / out, Start / End break
      rule: One tap each; device time recorded and queued offline; at a venue that requires it, the access point or location
        is captured.
      source: contracts/satellite/workforce.yaml#recordAttendance | POSV2-3
    outputs:
    - element: Roster
      rule: 'Rows: staff name, role, till, rota time, attendance (on duty / on break / not clocked in), shift status (Open,
        Suspended, Waiting for supervisor). Sorted by till. A cashier without the view permission sees only themselves.

        '
      source: contracts/satellite/workforce.yaml#listRotaAssignments | contracts/spine/shift.yaml#listShifts
    - element: My shift
      rule: Start time, elapsed time and breaks taken today. No takings and no expected cash.
      source: POSV2-3 | DI-806
    actions:
    - action: Clock out
      result: Records attendance only; "Clocking out pauses selling but keeps the cash shift open — close the shift to count
        the drawer."
      source: POSV2-3 | contracts/satellite/workforce.yaml#recordAttendance
    edgeCases:
    - case: Clock-out with no clock-in, or a second clock-in
      expected: Refused and reported as out of sequence, not silently corrected.
      source: contracts/satellite/workforce.yaml#recordAttendance
    - case: Offline
      expected: Last known roster with its age; clock actions queue with device time.
      source: screens/P04-point-of-sale.yaml#POS-009
    consistency:
    - with: POS-025
      note: The On shift pill opens this panel; it carries no Expected in drawer (POSV2-3).
    - with: EMP-003
      note: Clock in/out uses the same attendance record as the staff app.
    sampleData:
      roster:
      - name: J. Smith
        role: Senior Cashier
        till: Gate A · Till 14
        rota: 09:30–18:00
        status: On duty · shift open since 09:42
      - name: Fatima Al Suwaidi
        role: Cashier
        till: Bite & Go · Till 3
        rota: 11:00–19:30
        status: On break since 14:05
      - name: Omar Ziad
        role: Supervisor
        till: —
        rota: 10:00–22:00
        status: On duty
    corrections:
    - what: 'Twelve shift operations (open, close, accept variance, approve open, reopen, resume, suspend, no-sale, cash
        movements) are attached with buttons, plus raw filter fields ("Workstation id", "Status", "Opened from") and tables
        "Every cash movement", "Every workstation", "Every alert".

        '
      why: A roster is a read plus attendance; money and shift lifecycle belong on POS-001/POS-007/POS-017.
      source: screens/P04-point-of-sale.yaml#POS-009 | R254
      status: fixed
      by: CHG-WIR-008
    - what: The screen notes describe foreign-currency counting at close ("Close counts each foreign currency separately").
      why: That note belongs to the close (POS-007); it misleads a roster design.
      source: screens/P04-point-of-sale.yaml#POS-009
      status: fixed
      by: CHG-SPO-015
    - what: createRotaAssignment ("Create rota assignment") is on the till.
      why: Rota planning is a back-office workforce task; the till shows the rota and takes attendance.
      source: contracts/satellite/workforce.yaml#createRotaAssignment | R254
      status: fixed
      by: CHG-WIR-008
  POS-011:
    summary: 'Returns, refunds and exchanges at the till: the cashier finds the sale from the receipt, the policy is checked
      **before** the goods are taken back, then a merchandise return (with the item''s condition), a refund to the original
      tender, or an exchange that settles only the difference. The one thing to get right: the screen starts from the receipt
      and shows what is returnable and why not, so the cashier never promises a refund the policy will refuse (F34 step
      6, F58 step 8).

      '
    inputs:
    - field: Find the sale
      rule: 'Scan the receipt barcode, or type the receipt or order number. Barcode wins, then receipt number, then order
        number; several matches show a pick list, newest first. No lookup by card, membership or item and date in the first
        release.

        '
      source: contracts/satellite/retail.yaml#lookupRetailSale | R215 | R139
    - field: Lines to return
      rule: Tick lines and quantities; each line shows if it is returnable and, if not, why ("Window closed on 28 Oct").
      source: contracts/satellite/retail.yaml#/components/schemas/RetailSale
    - field: Condition (merchandise)
      rule: Resaleable · Opened · Damaged · Faulty · Missing parts. Only the policy's restockable conditions go back to
        stock; the rest are written off with the reason.
      source: contracts/satellite/retail.yaml#createRetailReturn | contracts/satellite/retail.yaml#/components/schemas/ReturnPolicy
    - field: Reason
      rule: 'Preset reasons (merchandise: Changed mind · Wrong size · Wrong item · Faulty · Damaged in transit · Duplicate
        purchase · Gift return · Other) plus a free-text note for the circumstances; Other needs the note.

        '
      source: DI-796 | DI-797 | R222 | contracts/satellite/retail.yaml#createRetailReturn
    - field: Serial number
      rule: For serialised items the serial must match the sold unit.
      source: F34 step 7 | contracts/satellite/inventory.yaml#listSerialisedItems
    - field: Refund to
      rule: 'Original tender by default. Store credit or cash against a card sale only where the policy allows, usually
        with approval. Always in the base currency at the value recorded at sale, never the tendered foreign currency.

        '
      source: DI-796 | DI-282 | contracts/satellite/retail.yaml#/components/schemas/ReturnPolicy | F34 step 7
    - field: Supervisor approval
      rule: 'Above the outlet''s self-authorise limit a supervisor enters their PIN on this till (not the cashier). Above
        "second user" limits a second named user confirms.

        '
      source: R144 | contracts/satellite/retail.yaml#createRetailReturn | contracts/spine/orders.yaml#createRefund
    outputs:
    - element: The sale
      rule: Receipt number, date, outlet, lines with price paid, discount, VAT, already-returned quantities, tenders used
        (card shown masked, last four digits).
      source: contracts/satellite/retail.yaml#/components/schemas/RetailSale | DI-069
    - element: Policy panel
      rule: Window in days, receipt required, cash-on-card allowed, the three limits (self-authorise, second user, approval)
        in plain words.
      source: contracts/satellite/retail.yaml#getReturnPolicy
    - element: Refund summary
      rule: Original amount and VAT, refunded amount and VAT, to which tender; prints a refund receipt; a credit note is
        issued where a tax invoice existed.
      source: contracts/spine/finance.yaml#issueCreditMemo | screens/P04-point-of-sale.yaml#POS-011
    actions:
    - action: Accept return
      result: Records the return (restock or write-off by condition) and refunds per policy; a refused return names the
        reason (outside window, not returnable, already returned, needs a supervisor, no receipt, serial mismatch).
      source: contracts/satellite/retail.yaml#createRetailReturn
    - action: Refund
      result: 'For tickets and other lines: refunds the chosen lines or amount, ledger first then gateway; refused with
        the threshold named when a second authorisation is missing, the window is closed, or the amount exceeds what remains.'
      source: contracts/spine/orders.yaml#createRefund
    - action: Exchange
      result: The replacement is held before the original is released; only the difference is charged or refunded; refused
        if the replacement is unavailable, outside the exchange window, or the original was used.
      source: contracts/spine/orders.yaml#exchangeOrderLines
    edgeCases:
    - case: The till is offline
      expected: Refunds and returns are refused offline; the guest is directed to a connected till or the service desk.
      source: F58 step 8 | contracts/spine/orders.yaml#createRefund | contracts/satellite/retail.yaml#createRetailReturn
    - case: No receipt
      expected: Order number only; with neither, the policy decides whether a no-receipt return is allowed.
      source: F34 step 6 | R139
    - case: Return of a kit or bundle
      expected: The bundle's components are reversed together.
      source: contracts/satellite/retail.yaml#createRetailReturn
    consistency:
    - with: POS-030
      note: Refund or void from the Sales Journal hands the order to this screen (POSV2-1).
    - with: POS-026
      note: The receipt reprinted there carries the return policy (DI-366).
    - with: BO-082
      note: The returned item's disposition appears as a stock movement.
    sampleData:
      receipt: MBS-208114 · Marina Bay Store · 29 Oct 2026 16:22 · Visa •••• 4417
      lines:
      - Park T-Shirt M · AED 89.00 · returnable
      - Collector Mug · AED 55.00 · returnable
      - Sunscreen SPF50 · not returnable (category)
      return: 1 × Park T-Shirt M · Wrong size · Resaleable · refund AED 89.00 (VAT 4.24) to Visa •••• 4417
    corrections:
    - what: 'The layout carries a cash count ("Cash counted"), "Every denomination", "Every outlet", "Include inactive",
        and Adjust deposit box float; listOutlets and listDenominations are loaded.

        '
      why: None of these serve a return; bulk-attached by resemblance.
      source: screens/P04-point-of-sale.yaml#POS-011 | R254
      status: fixed
      by: CHG-WIR-008
    - what: The offline state says "Working from the local journal. The till keeps taking money".
      why: Refunds and returns are refused offline (F58 branch at 8); the state must say so.
      source: F58 step 8 | screens/P04-point-of-sale.yaml#POS-011
      status: fixed
      by: CHG-SPO-007
    - what: 'Two approval models on one screen: a merchandise return takes a supervisor PIN step-up (R144), a ticket refund
        takes a "second user names themselves" dual authorisation; the client asked that a POS refund be routed for approval
        before it reaches the bank.

        '
      why: The design cannot show one consistent approval step; confirm which applies to which refund.
      source: contracts/spine/orders.yaml#createRefund | contracts/satellite/retail.yaml#createRetailReturn | R144 | DI-253
      status: logged
      by: CHG-SPO-020
    - what: The purpose reads "Returns, Refunds & Exchanges — from the client design board, 20 August".
      why: Not a purpose a designer can act on.
      source: screens/P04-point-of-sale.yaml#POS-011
      status: fixed
      by: CHG-WIR-010
    decisions:
    - question: Which tender is "store credit" (DI-796) — a gift card, a voucher or the guest's wallet?
      decision: Store credit is a gift card issued at the refund amount (the drawn default).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-061 | CHG-NOTE-004
      questionSource: DI-796 | contracts/spine/orders.yaml#createRefund
    - question: Void of a sale still in the same shift vs refund — is void a separate action on this screen?
      decision: 'Not answered: the workbook cell repeats the sibling POS-011 answer (store credit = gift card). Void stays
        in the Sales Journal (POS-030) and the exceptions screen; this screen refunds (drawn default).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-062 | CHG-NOTE-004
      questionSource: POSV2-1
  POS-012:
    summary: 'Orders that did not start at this counter, fulfilled here: an online or app order collected at the counter
      (food, merchandise, Shop & Drop) and takeaway and delivery orders. The cashier finds the order, makes sure the goods
      are reserved, and records the handover. The one thing to get right: the handover outcome matches how the order is
      fulfilled — collected at a counter, delivered by a runner (with the location), served at a table.

      '
    inputs:
    - field: Find the order
      rule: By order number, guest name or the media the guest carries (QR, wristband); this outlet's open orders listed
        by due time.
      source: F60 step 1 | contracts/spine/orders.yaml#listOrders
    - field: Handover outcome
      rule: 'Collected · Delivered · Served, or Guest not found · Refused (these two need a note and leave the order Ready).
        Delivered requires the delivery location and records the runner.

        '
      source: contracts/satellite/fnb.yaml#recordOrderHandover | R125
    - field: Merchandise for collection
      rule: Reserved before handover, not after; a reservation lasts at least 15 minutes and at most to the end of the visit
        day.
      source: F60 step 2 | contracts/satellite/retail.yaml#reserveMerchandise | R169 | R215
    outputs:
    - element: Order list
      rule: 'Order number, channel (App, Web, Kiosk, Delivery partner), order type, guest name and masked mobile, items,
        due time, paid state; ready ones first.

        '
      source: contracts/spine/orders.yaml#listOrders | DI-790
    actions:
    - action: Hand over
      result: Records the outcome; offline-capable for a runner without signal.
      source: contracts/satellite/fnb.yaml#recordOrderHandover
    - action: Find elsewhere
      result: When the item is out at this counter, finds it in another store in the venue rather than refunding.
      source: F60 step 2
    edgeCases:
    - case: The order is not ready yet, or already closed
      expected: Refused with its current state.
      source: contracts/satellite/fnb.yaml#recordOrderHandover
    - case: Merchandise out of stock at this counter
      expected: Names the short lines; offer another store.
      source: contracts/satellite/retail.yaml#reserveMerchandise | F60 step 2
    consistency:
    - with: POS-029
      note: The till's Queue works the same F&B takeaway and delivery orders; the order type words match POS-021.
    - with: GST-062
      note: Shop & Drop collection codes shown to the guest are what the cashier scans here.
    - with: KSK-011
      note: The kiosk's self-collection finds the same orders.
    sampleData:
      orders:
      - order: AQP-104611
        channel: App
        type: Collection
        guest: Khalid Al Mansoori · +971 •• ••• 8813
        items: 2 × Chicken Bao, 1 × Lemonade
        due: '13:05'
        state: Ready
      - order: MBS-208230
        channel: Web
        type: Shop & Drop
        guest: Daniel Brooks
        items: 1 × Character Plush L
        state: Reserved · collect by 20:00
    corrections:
    - what: 'Raw filter fields ("Venue id", "Principal id", "Shift id", "Status", date pickers), "Every denomination", and
        Adjust deposit box float / Open shift are on the screen.

        '
      why: Bulk-attached; a collection counter needs the order list and the handover.
      source: screens/P04-point-of-sale.yaml#POS-012 | R254
      status: fixed
      by: CHG-WIR-008
    - what: 'The prototype and v2 use this screen as the cart''s order-type selector (Dine-in, Quick service, Takeaway,
        Delivery with Own delivery / Delivery partner), while the package defines it as an online-order collection centre
        (F60).

        '
      why: Two meanings for one screen id; delivery-partner capture (partner, reference, driver, fee) has no contract field.
      source: screens/P04-point-of-sale.yaml#POS-012 | F60 step 1
      status: fixed
      by: CHG-SPO-001
    - what: The v2 F&B delivery cart shows "Inventory held 4:56 · Extend +2 min".
      why: Food lines hold no capacity (a cart line's hold is null for products without capacity), so a hold timer on a
        food cart is false.
      source: contracts/spine/orders.yaml#/components/schemas/CartLine
      status: fixed
      by: CHG-SPO-001
  POS-013:
    summary: 'The till''s offline picture: whether it is online, what it sold while offline and has not yet synced, and
      the entries the server refused on replay that need a supervisor. Offline is switched automatically and synced automatically
      (DI-071, DI-798). The one thing to get right: the cashier never has to press Sync; the screen exists to show what
      is pending and to resolve the few refusals.

      '
    outputs:
    - element: Status
      rule: Online · Offline since 14:02 · Syncing 12 of 40 — always visible in the top bar; offline shown as a clear mode
        indicator.
      source: DI-072 | DI-071
    - element: Offline sales
      rule: While offline, the transaction view shows only sales completed locally in this offline period, with their local
        receipt numbers (from the till's reserved range).
      source: DI-798 | R152
    - element: Refused on replay
      rule: Entries the server refused (stock ran out, a lease expired, a stale catalogue), each with the reason and who
        must resolve it; the rest of the batch continued.
      source: contracts/spine/orders.yaml#syncOrders | screens/P04-point-of-sale.yaml#POS-013
    actions:
    - action: Resolve (supervisor)
      result: Opens the refused entry on the exceptions screen; needs a supervisor PIN in place.
      source: screens/P04-point-of-sale.yaml#POS-013
    edgeCases:
    - case: Price changed between the till's catalogue and the server
      expected: Accepted at the quoted price; the variance goes to finance and nothing is shown to the cashier.
      source: contracts/spine/orders.yaml#createOrder | contracts/spine/orders.yaml#syncOrders
    - case: Capacity products while offline
      expected: Blocked with a clear message; non-capacity products stay sellable.
      source: DI-074
    consistency:
    - with: POS-025
      note: The network pill opens this screen.
    - with: POS-020
      note: A refused entry is resolved on the exceptions screen.
    sampleData:
      status: Offline since 14:02 · 23 sales pending · last sync 14:01
      refused: Receipt G14-00877 · 1 × Park T-Shirt M · stock ran out while offline · needs a supervisor
    corrections:
    - what: '"Sync orders" is the primary button.'
      why: The client agreed sync is automatic with no manual action.
      source: DI-798 | DI-071
      status: fixed
      by: CHG-SPO-015
    - what: 'Cash operations (cash movements, withdraw, adjust float), "Every denomination", and getOfflinePackage (a gate
        scanner''s package needing ACCESS_VALIDATE) are attached; listSyncRejections is not.

        '
      why: The refused-on-replay list is the screen's job; cash and gate packages are other screens'.
      source: screens/P04-point-of-sale.yaml#POS-013 | MATRIX 2.3.1 | R254
      status: fixed
      by: CHG-WIR-008
    - what: The purpose reads "Mobile POS, Event Sales & Offline Operations — from the client design board, 20 August".
      why: The prototype covers only offline and sync; there is no mobile form factor or event-sales mode to draw.
      source: screens/P04-point-of-sale.yaml#POS-013
      status: fixed
      by: CHG-WIR-010
    decisions:
    - question: Does each offline till sell tickets from a pre-allocated quota (e.g. 100 per node), as agreed on 5 August?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Capacity products are blocked offline (DI-074);
        quotas are shown only if the venue configures them.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-063 | CHG-NOTE-004
      questionSource: DI-142 | DI-074
  POS-015:
    summary: 'A supervisor''s live view of cash on this till and outlet: the opening float, cash in and out, safe drops,
      and which cash drawers are open and who holds them. The one thing to get right: it is a supervisor view — a cashier
      must never see the expected cash in their own drawer here (R080(e), POSV2-3).

      '
    outputs:
    - element: Cash movements
      rule: Time, kind (Opening float · Cash out · Cash in · Safe drop), amount, who authorised, reference/bag number, reason.
        Newest first.
      source: contracts/spine/shift.yaml#listCashMovements | DI-308
    - element: Cash drawers
      rule: Each drawer's holder, till, status (Open · Suspended · Closing · Closed · Reconciled). A drawer belongs to a
        cashier, not a till.
      source: contracts/spine/shift.yaml#listDepositBoxes
    - element: Totals
      rule: Cash and card totals and variance tracking per till, for supervisors only.
      source: DI-273 | DI-308
    edgeCases:
    - case: A cashier opens the screen
      expected: Their own movements only, with no expected cash and no variance.
      source: POSV2-3 | R080
    - case: Offline
      expected: Shown from the local journal with "as of" time; reconciles on sync.
      source: screens/P04-point-of-sale.yaml#POS-015
    consistency:
    - with: POS-017
      note: Cash in and cash out recorded there appear here immediately.
    - with: POS-018
      note: Safe drops appear here with the witness.
    - with: BO-041
      note: The back-office cash movements list shows the same rows venue-wide.
    sampleData:
      movements:
      - time: 09:42
        kind: Opening float
        amount: AED 1,000.00
        by: J. Smith
      - time: '13:15'
        kind: Safe drop
        amount: AED 3,000.00
        by: Omar Ziad (witness J. Smith)
        bag: SD-0412
      - time: '15:40'
        kind: Cash in
        amount: AED 200.00
        reason: Change order
    corrections:
    - what: The purpose reads "Cash Operations Dashboard — from the client design board, 20 August" and the layout is two
        raw tables and a Confirm button.
      why: No purpose a designer can act on; the client asked for live cash status per till with expected cash and card
        totals for supervisors.
      source: screens/P04-point-of-sale.yaml#POS-015 | DI-273 | DI-308
      status: fixed
      by: CHG-WIR-010
    - what: 'DI-273 asks for expected cash per till on a screen of the till app, while the blind count forbids showing a
        cashier the expected cash.

        '
      why: The permission that sees expected figures must be named (supervisor only) so the screen cannot leak it to a cashier.
      source: DI-273 | R080 | POSV2-3
      status: fixed
      by: CHG-SPO-014
    - what: F73 step 3 says "cash limits and the drawer ceiling are set" here; no operation or setting holds a drawer limit.
      why: The configurable drawer limit (DI-274) has nowhere to live, so no safe-drop prompt can fire.
      source: F73 step 3 | DI-274
      status: fixed
      by: CHG-SPO-014
  POS-017:
    summary: 'Mid-shift cash in and cash out on this till: a cashier or supervisor records cash taken out of the drawer
      (a pickup when the drawer is heavy) or added (change). Both adjust the expected figure used at close, so a busy cashier
      does not end the day apparently short. The one thing to get right: two quick forms with the denomination breakdown
      and a reason — not a raw data form.

      '
    inputs:
    - field: Direction
      rule: Cash out or Cash in (lift / add). Opening float is never chosen here.
      source: contracts/spine/shift.yaml#createCashMovement
    - field: Amount by denomination
      rule: Same counter as the float; the amount is the counted total. Cash out cannot exceed the float counted at the
        last count less what has been lifted since.
      source: contracts/spine/shift.yaml#createCashMovement | R123
    - field: Reference
      rule: Safe-drop reference or bag number, up to 64 characters.
      source: contracts/spine/shift.yaml#createCashMovement
    - field: Reason
      rule: Free text up to 500 characters.
      source: contracts/spine/shift.yaml#createCashMovement
    edgeCases:
    - case: Cash out larger than the drawer can hold
      expected: Refused with the reason in plain words ("More than the drawer holds since the last count").
      source: contracts/spine/shift.yaml#createCashMovement | R123
    - case: Offline
      expected: Recorded locally with device time and synced; shown as pending.
      source: contracts/spine/shift.yaml#createCashMovement
    consistency:
    - with: POS-018
      note: 'A supervisor''s safe drop with a witness (POS-018) and a cash out here both record a cash out; draw them as
        one cash screen with two tabs if the client agrees (DI-309 asks to reduce screen count).

        '
    sampleData:
      cashOut: AED 2,000.00 · AED 500 × 2, AED 200 × 5 · bag SD-0413 · 'drawer heavy before lunch peak'
      cashIn: AED 200.00 · AED 5 × 20, AED 1 × 100 · 'change order'
    corrections:
    - what: The layout is text fields bound to the raw request (id, kind, amount, denominations, reference, reason, recordedAt).
      why: Ids and device times are generated; kind is a two-way choice; amounts are counted by denomination.
      source: screens/P04-point-of-sale.yaml#POS-017
      status: fixed
      by: CHG-SPO-014
    - what: The configurable drawer limit the client asked for has no setting in any contract.
      why: Without it the till cannot prompt a cash out when the drawer is heavy (DI-274, F32 step 4).
      source: DI-274 | F32 step 4
      status: fixed
      by: CHG-SPO-014
  POS-018:
    summary: 'A supervisor takes cash out of a cashier''s drawer for the safe or banking (a safe drop), with the cashier
      as witness; it reduces the expected close figure and is not a variance. The one thing to get right: two people sign
      on one device — the supervisor taking it and the cashier it came from.

      '
    inputs:
    - field: Drawer
      rule: Pick the open cash drawer (by cashier and till); drawers being counted or closed are not offered.
      source: contracts/spine/shift.yaml#listDepositBoxes | contracts/spine/shift.yaml#withdrawFromDepositBox
    - field: Amount
      rule: Counted by denomination where the venue counts drops; otherwise an amount.
      source: contracts/spine/shift.yaml#withdrawFromDepositBox
    - field: Reason
      rule: Banking · Safe drop · Change order · Other (Other needs a note).
      source: contracts/spine/shift.yaml#withdrawFromDepositBox | R222
    - field: Witness
      rule: The cashier whose drawer it is confirms on the same device.
      source: contracts/spine/shift.yaml#withdrawFromDepositBox
    edgeCases:
    - case: The drawer is being counted or is closed
      expected: Refused ("This drawer is being counted — nothing can go in or out").
      source: contracts/spine/shift.yaml#withdrawFromDepositBox
    consistency:
    - with: POS-017
      note: Same denomination counter; see the merge suggestion there.
    - with: BO-042
      note: The back office's banking and safe view receives these drops.
    sampleData:
      drop: Omar Ziad takes AED 3,000.00 from J. Smith's drawer (Till 14) · Safe drop · bag SD-0412 · 13:15
    corrections:
    - what: 'Attached operations and tables are unrelated: listPrincipals (needs USER_MANAGE), "Every principal" with a
        "Scope path" filter, "Every rota assignment" and "Create rota assignment".

        '
      why: A safe drop needs the open drawers and the withdraw operation; listDepositBoxes is missing.
      source: screens/P04-point-of-sale.yaml#POS-018 | R254
      status: fixed
      by: CHG-WIR-008
    - what: The purpose is "Safe Drop & Cash Transfer Management — from the client design board, 20 August".
      why: Not a purpose; and "cash transfer" between drawers has no operation.
      source: screens/P04-point-of-sale.yaml#POS-018
      status: fixed
      by: CHG-WIR-010
  POS-021:
    summary: 'The counter till for food and drink: a cashier at a quick-service counter, café or bar (Bite & Go, a pool
      bar) takes a guest''s order from the outlet''s menu in force, adds the dish options, picks the order type, then **sends
      the order to the kitchen and only then charges** (audit R261, upheld against the v2 frame by POSV2-4). One cashier
      handles both order-taking and payment (DI-076/105). The one thing to get right: the cart''s primary button is a two-step
      sequence (**Send to kitchen**, then **Charge AED x**), and the menu board is the outlet''s own menu, sections in the
      outlet''s order, with the dish options attached to each item.

      '
    inputs:
    - field: Order type
      rule: 'Segmented control in the cart: Dine-in · Quick service · Takeaway · Delivery (ServiceMode tableService, quickService,
        collection, delivery). Default comes from the outlet: a counter outlet opens on Quick service. Dine-in shows only
        where the outlet has a table layout (DI-107); choosing it routes to the floor (POS-028) to pick a table, since a
        table-service order needs a table visit. Quick service asks for no guest details (DI-790); Takeaway asks name, mobile
        and pickup time; Delivery also asks the location and is refused without one (R125(1)).

        '
      source: DI-789 | DI-790 | DI-107 | R125 | contracts/satellite/fnb.yaml#/components/schemas/ServiceMode | contracts/satellite/fnb.yaml#createFnbOrder
    - field: Dish options (modifiers)
      rule: 'Tapping an item with option groups opens a side panel (not a full-screen step) listing the item''s groups in
        order. A group with a minimum above zero is required and the Add button stays disabled until it is met; the maximum
        caps choices (single choice = radio, several = checkboxes with "choose up to 2"). Each option shows its price change
        ("+ AED 5.00") or "Free"; options flagged default are pre-ticked. The group belongs to the item, never chosen per
        sale ("How would you like it cooked" is one group on nine steaks). Items without groups add in one tap.

        '
      source: contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup | DI-328 | F108 step 2 | DI-102 | DI-1050
    - field: Quantity
      rule: Stepper on the cart line; setting it to 0 removes the line (no separate confirm).
      source: R123
    - field: Note to the kitchen
      rule: 'Optional free text per line, 200 characters. Allergy notes are allowed here and must be visually distinct (they
        are surfaced prominently on the kitchen ticket).

        '
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateFnbOrderLine
    - field: Meal from a ticket (combo redemption)
      rule: 'Scanning a guest''s ticket QR that carries a meal entitlement adds the meal at AED 0.00 with a "Included with
        ticket" tag. A second redemption is refused with the time it was used. For a group of 2–4 the cashier may assign
        each meal to a ticket; larger groups redeem centrally.

        '
      source: DI-287 | DI-290 | contracts/satellite/fnb.yaml#/components/schemas/CreateFnbOrderLine
    - field: Guest
      rule: Optional. "Link guest" is a search field in the cart (mobile or email) that finds or creates a profile inline.
      source: DI-783
    - field: Discount / promo code
      rule: Applied on the cart, never on the payment screen. Automatic promotions apply by themselves on every cart change.
      source: DI-786 | contracts/satellite/promotions.yaml#evaluatePromotions
    - field: Payment timing (an outlet setting)
      rule: Pay first, or Send to kitchen first then pay (R261 per outlet). Under Pay first the primary button is "Charge
        AED 110.25" and the kitchen receives the order once paid; under Send first the primary is "Send to kitchen", then
        "Charge".
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    outputs:
    - element: Menu board
      rule: 'Tabs are the menu''s sections in the outlet''s own order (not alphabetical), each with its item count. Item
        tiles: photo, name, short description, price; fast sellers may be configured larger (button sizes come from the
        Menu Builder). The header names the menu in force and when it ends: "All-day menu · until 23:00", "Breakfast · until
        11:00".

        '
      source: F108 step 1 | DI-326 | contracts/satellite/fnb.yaml#getGuestMenu
    - element: Unavailable items
      rule: 'Shown in place, greyed, labelled "Unavailable" with the return time where one is set ("Back at 18:00"); never
        removed and not tappable. A change made in the kitchen appears on this till immediately.

        '
      source: contracts/satellite/fnb.yaml#getGuestMenu | contracts/satellite/fnb.yaml#setItemAvailability | R110
    - element: Allergens
      rule: Allergen icons on the item's side panel (and a small marker on the tile); always present, never optional.
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestMenu
    - element: Cart
      rule: 'Each line shows its chosen options indented under it with their price changes, the note in italics, then Subtotal,
        Discount, VAT and Total. Money in the venue currency with its own scale (2 decimals AED; 3 for BHD/KWD, never rounding
        the third). After Send to kitchen the cart shows the order number and the lines lock (changes after sending are
        a cancel or void, not an edit).

        '
      source: DI-306 | R125
    - element: Header
      rule: 'Outlet name and order type ("Bite & Go · Quick service"). Never "kitchen fires on payment".

        '
      source: POSV2-4
    actions:
    - action: Send to kitchen
      result: Primary action while the order is unsent at an outlet set to Send first (at a Pay first outlet the order goes
        to the kitchen after Charge). Places the F&B order and its kitchen tickets (one per station) and shows the order number
        at once ("Order BNG-004127 · sent to Grill, Fryer"). The primary button then becomes "Charge AED 110.25". A refusal
        names the line (item unavailable, options incomplete, meal already redeemed) and offers Remove line.
      source: R261 | F108 step 3 | contracts/satellite/fnb.yaml#createFnbOrder | decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    - action: Charge AED x
      result: Goes to Payment (POS-005) with the cart, guest, discount, order type, table and tax totals. Needs payment.take.
      source: screens/P04-point-of-sale.yaml#POS-021 | F108 step 4
    - action: Mark unavailable (86)
      result: 'Long-press a tile (staff allowed to configure products only): reason Sold out · Ingredient unavailable ·
        Equipment down · Seasonal · Other (Other requires a note), optional "back at" time. Takes effect on every till and
        guest menu of the outlet when confirmed; there is no separate Save step.

        '
      source: contracts/satellite/fnb.yaml#setItemAvailability | R110 | R222
    - action: Hold sale · Link guest · Discount · new cart (+)
      result: Same cart controls as the ticket and merchandise tills; "+" opens a second concurrent cart.
      source: DI-782 | DI-795
    edgeCases:
    - case: The guest walks away after the order was sent and before paying
      expected: 'Cancel order on the unpaid order: allowed while the order is still ordered or accepted (accepted needs
        void authority, a supervisor PIN); once the kitchen is preparing it is a void with a reason. The ticket is never
        silently dropped and the waste is counted.

        '
      source: F108 step 3 | R125 | R091 | contracts/satellite/fnb.yaml#cancelFnbOrder
    - case: An item was marked unavailable while this till was offline
      expected: 'It is sold from the cached menu, then refused by the kitchen at Send to kitchen, before anyone pays: the
        line is flagged, the cashier removes it and the guest pays for what can be made. Nothing is refunded.

        '
      source: F108 step 3 | R125
    - case: The kitchen display cannot be reached
      expected: 'The order is journaled and retried; the cart shows "Sent · waiting for kitchen" in amber and Charge is
        still allowed. The order must never be lost after the guest has paid.

        '
      source: F108 step 3 | contracts/satellite/fnb.yaml#createFnbOrder
    - case: The till is offline
      expected: 'Selling continues from the cached menu with the offline banner. Items the contract treats as stock-tracked
        (recipe-linked) are refused offline today and must be shown as "Needs connection" rather than failing at Send (see
        corrections).

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder | DI-072 | DI-075
    - case: Required options not chosen
      expected: Add stays disabled with the group named ("Choose a cooking level"); never a server error after the fact.
      source: contracts/satellite/fnb.yaml#createFnbOrder | contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup
    - case: No menu published for this outlet
      expected: Says so and names where it is published (Menu Management in Venue Management), not an empty board.
      source: screens/P04-point-of-sale.yaml#POS-021
    - case: Cashier without payment.take
      expected: Send to kitchen is refused as well as Charge, so nothing is cooked for a sale that cannot be paid.
      source: screens/P04-point-of-sale.yaml#POS-021
    consistency:
    - with: POS-002
      note: Same cart component, same Link guest / Discount / Hold sale, same Charge button and order of totals (DI-795,
        DI-293 one cart and one receipt).
    - with: POS-023
      note: Same board layout (tabs with counts, tiles, Scan); retail shows stock where food shows options.
    - with: POS-022
      note: Send to kitchen is the POS-022 step; the order number and station chips it shows are the same here.
    - with: POS-028
      note: Dine-in orders are taken here with the table carried from the floor; the cart header shows "Table T4 · 4 covers".
    - with: WEB-037
      note: The option side panel behaves as on the guest web and app item detail (required groups, live total) so staff
        and guests see the same rules.
    - with: BO-109
      note: Tile sizes and section order come from the Menu Builder; the till does not reorder them.
    - with: KIT-002
      note: Line notes and allergen flags typed here are exactly what the kitchen ticket shows.
    sampleData:
      outlet: Bite & Go — Aqua Park (quick service)
      menuInForce: All-day menu · until 23:00
      sections:
      - Mains (4)
      - Sides (3)
      - Drinks (3)
      - Desserts (2)
      items:
      - name: Marina Smash Burger
        price: AED 68.00
        allergens:
        - gluten
        - milk
        - sesame
        options: 'Cooking (required, choose 1): Medium · Well done; Extras (up to 3): Cheese +5.00, Jalapeños +3.00, No
          onions (free)'
      - name: Chicken Nuggets · 8 pc
        price: AED 34.00
        options: 'Dip (required, choose 1): BBQ · Garlic mayo · Sweet chilli'
      - name: Loaded Fries
        price: AED 32.00
        allergens:
        - milk
      - name: Karak Chai
        price: AED 12.00
        options: 'Size: Regular · Large +4.00'
      - name: Kunafa
        price: AED 28.00
        state: Unavailable · back at 18:00
      cart: '1 × Marina Smash Burger (Medium, Cheese) 73.00 · note: NO SESAME — allergy; 1 × Loaded Fries 32.00 · Subtotal
        105.00 · VAT 5% 5.25 · Total AED 110.25'
      afterSend: Order BNG-004127 · sent to Grill, Fryer · Charge AED 110.25
    corrections:
    - what: 'The layout puts plumbing on the till: a text field "Outlet id", a date picker "Active at", tables titled "Every
        menu" and "Every modifier group" with raw columns, and a "The selected menu" panel. The outlet comes from the till''s
        session and the menu in force from the guest-menu read; none of these belong on screen.

        '
      why: A cashier never picks the outlet or a menu; the screen's own cold-entry note says so.
      source: screens/P04-point-of-sale.yaml#POS-021 | R254
      status: fixed
      by: CHG-WIR-008
    - what: listMenus (a back-office read needing PRODUCT_VIEW) and listModifierGroups are attached on load.
      why: 'The contract says "Back-office use. A terminal reads its menu from the catalogue bundle", and the guest-menu
        read already returns each item''s option groups. Re-derive the screen''s operations from its purpose.

        '
      source: contracts/satellite/fnb.yaml#listMenus | contracts/satellite/fnb.yaml#getGuestMenu | R254
      status: fixed
      by: CHG-WIR-008
    - what: '"Add cart line" opens a modal collecting variantId, quantity, performanceId, seatIds, parentLineId and attributes;
        "Evaluate promotions" opens a modal collecting venueId, channel and lines.

        '
      why: 'Adding is a tap on a tile; seat and performance fields are ticket fields. Promotions are evaluated automatically
        (re-evaluated on every cart read, locally on terminals) and are not a button.

        '
      source: contracts/spine/orders.yaml#addCartLine | contracts/satellite/promotions.yaml#evaluatePromotions | DI-102
      status: fixed
      by: CHG-SPO-016
    - what: 'A till cart line cannot carry dish options. AddCartLineRequest and CartLine have no modifier options, kitchen
        note, course or seat, and their price ignores the options'' price changes, while createFnbOrder needs menuItemId
        and modifierOptionIds per line. OrderLineAttributes defines only a transport shape.

        '
      why: 'Chargeable options (Cheese +5.00) cannot be priced in the cart, and options cannot reach the kitchen from a
        till cart. Change request: give cart lines the F&B line fields (or a defined F&B attributes shape) priced by the
        server.

        '
      source: contracts/spine/orders.yaml#/components/schemas/CartLine | contracts/spine/orders.yaml#/components/schemas/OrderLineAttributes
        | contracts/satellite/fnb.yaml#/components/schemas/CreateFnbOrderLine | DI-328
      status: logged
      by: CHG-SPO-019
    - what: 'Offline selling of recipe-linked items: the fnb contract refuses them offline ("F&B is blocked offline where
        inventory is tracked"), while the client agreed F&B sells offline with stock depleted at day end, and outlets choose
        real-time or end-of-day depletion.

        '
      why: 'On an end-of-day-depletion outlet the refusal has no reason and stops a counter in an outage. The rule should
        follow the outlet''s depletion setting.

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder | DI-075 | DI-320
      status: logged
      by: CHG-SPO-019
    - what: 'The v2 candidate shows "kitchen fires on payment" in the header, an "Open-dated · any day" validity chip on
        every food tile, REFINE chips "Today" and "Low capacity", and a "Reserve" button in a food-only cart.

        '
      why: 'The header contradicts R261. Validity, capacity and reservations are ticket concepts; a burger has no date and
        no capacity, and Reserve enters ticket reservations (POS-031).

        '
      source: screens/P04-point-of-sale.yaml#POS-021 | POSV2-4 | POSV2-2
      status: fixed
      by: CHG-SPO-016
    decisions:
    - question: 'The client still lists "F&B quick service vs dine-in" as an open policy item. Does every POS F&B order send
        before charging, or does quick service at some outlets charge first?

        '
      decision: 'Outlet setting ''Payment timing'': Pay first, or Send to kitchen first then pay. Refines R261 per outlet.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-064 | CHG-NOTE-004
      questionSource: TRACKER 30-Sep/Tracker row 30 | TRACKER Workshops/Actions row 275 | R261
    - question: 'When the menu in force changes (breakfast ends at 11:00) while a cart is open, do lines keep the price they
        were added at?

        '
      decision: 'Not answered: the workbook cell repeats the sibling POS-021 payment-timing answer. The question takes its
        drawn default.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-065 | CHG-NOTE-004
      questionSource: contracts/spine/orders.yaml#createOrder
    - question: The v2 board opens on a "Popular" tab. Nothing on the till ranks items. Is "Popular" a section the outlet
        curates?
      decision: 'Not answered: the workbook cell repeats the sibling POS-021 payment-timing answer. The question takes its
        drawn default.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-066 | CHG-NOTE-004
      questionSource: designer default
  POS-022:
    summary: 'The step that puts a till''s food order on the kitchen rail **before** the guest pays, gives the guest an
      order number (and buzzer where used), and later lets the counter hand over the ready order. It is not a place a cashier
      navigates to in the middle of a sale. Draw it as two things: the "sent" confirmation inside the POS-021 / POS-028
      cart, and a compact counter rail of this outlet''s orders (Preparing → Ready → Collected) shared with the till''s
      Queue (POS-029). The one thing to get right: the order number appears instantly after Send and the cashier goes straight
      on to Charge.

      '
    inputs:
    - field: What is sent
      rule: 'Everything comes from the cart: order type, lines with options and notes, the table visit for dine-in, and
        the course of each line for table service (starters, mains, desserts as the outlet names them). Nothing is typed
        on this step.

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder | DI-333
    - field: Buzzer number
      rule: Where the outlet hands out pagers, the cashier scans or keys the pager number at send; it prints on the receipt.
      source: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket
    - field: How the guest proved it was theirs (at collection)
      rule: 'One tap: Order number (default) · Buzzer · Name · QR · None. Recorded with the collection.'
      source: contracts/satellite/fnb.yaml#markOrderCollected
    outputs:
    - element: Sent confirmation
      rule: 'Large order number, the stations it went to as small chips (Grill · Fryer · Bar) and the estimated ready time
        ("Ready about 12:52"). Printed on the receipt with the buzzer number at Charge.

        '
      source: contracts/satellite/fnb.yaml#/components/schemas/FnbOrder | DI-790
    - element: Counter rail
      rule: 'This outlet''s orders, Ready for pickup first, then Preparing; each card shows the order number, order type,
        items, and the time since it became ready ("Ready 4 min"), which turns amber then red. Order to ready is the kitchen''s
        clock; ready to collected is the counter''s.

        '
      source: F108 step 6 | screens/P04-point-of-sale.yaml#POS-022
    - element: Wait to quote
      rule: Orders ahead and the age of the oldest, as two numbers, so a cashier quotes the wait the kitchen is actually
        working to.
      source: screens/P04-point-of-sale.yaml#POS-022
    actions:
    - action: Send to kitchen
      result: 'From the cart. Success: order number shown, Charge enabled. Failure names the cause: an item unavailable
        (Remove line), options incomplete, an item that cannot be ordered offline, a meal entitlement already used.

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder | R261
    - action: Collected
      result: On a ready order, closes it as collected and stops the counter's clock. Works offline and syncs.
      source: contracts/satellite/fnb.yaml#markOrderCollected | F108 step 6
    - action: Cancel order
      result: 'For an order sent but not paid (the guest left). Allowed while ordered or accepted; accepted needs a supervisor''s
        void authority; from preparing onwards it becomes a void with a reason and the waste is recorded. Reasons: Guest
        cancelled · Item unavailable · Took too long · Outlet refused · Error.

        '
      source: F108 step 3 | R125 | R091 | contracts/satellite/fnb.yaml#cancelFnbOrder
    edgeCases:
    - case: The kitchen display is unreachable when sending
      expected: The order is journaled and retried; the confirmation says "Waiting for kitchen" in amber; Charge still follows.
      source: F108 step 3
    - case: The till is offline
      expected: 'Sending still works over the venue network to the kitchen display; the server receives the order when it
        is replayed. How the till reaches the display offline is still an open architecture decision.

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder | F108 step 3
    - case: The kitchen refuses an item that was 86'd while the till was offline
      expected: The line is flagged on the sent order before payment; remove it and charge for the rest. Nothing is refunded.
      source: F108 step 3
    - case: Payment is declined after the order was sent
      expected: The order stays on the rail unpaid and flagged "Not paid"; retry the tender or cancel the order.
      source: R261 | R125
    - case: Nobody collects a ready order
      expected: It is recorded as uncollected, not silently closed; uncollected orders are counted.
      source: F108 step 6
    consistency:
    - with: POS-029
      note: The counter rail and the till's Queue are the same orders and the same stage words; the guest status board on
        POS-029 mirrors KIT-007 (POSV2-7).
    - with: KIT-002
      note: Kitchen ticket statuses (Received, Preparing, Ready) read the same on the till and on the kitchen display.
    - with: POS-021
      note: Send to kitchen is the cart's first primary action; Charge the second.
    sampleData:
      sent: Order BNG-004127 · Quick service · Grill, Fryer · ready about 12:52 · buzzer 17
      rail:
      - order: BNG-004125
        type: Quick service
        items: 2 × Chicken Nuggets, 1 × Karak Chai
        state: Ready 6 min
      - order: BNG-004126
        type: Takeaway
        guest: Aisha Rahman · +971 50 771 2210
        items: 1 × Loaded Fries
        state: Preparing · 4 min
      - order: BNG-004127
        type: Quick service
        items: 1 × Marina Smash Burger, 1 × Loaded Fries
        state: Preparing · 1 min
      waitToQuote: 5 ahead · oldest 9 min
    corrections:
    - what: 'The layout shows text fields "Station id" and "Status", a table "Every kitchen ticket", and a "Create F&B order"
        modal collecting id, outletId, serviceMode, lines and recordedAt; a "Save kitchen ticket status" modal asks for
        recordedAt.

        '
      why: The order comes from the cart; ids and device times are generated, never typed.
      source: screens/P04-point-of-sale.yaml#POS-022 | R254
      status: fixed
      by: CHG-SPO-016
    - what: 'createFnbOrder says "Quick service pays immediately" and its salesOrderId is "the order it took payment on".

        '
      why: 'Under R261 the F&B order is created before the payment, so no paid sales order exists yet at send. The contract
        needs to say how the sales order is linked after Charge (or that an unpaid one is created first).

        '
      source: contracts/satellite/fnb.yaml#createFnbOrder | R261 | POSV2-4
      status: logged
      by: CHG-SPO-019
    - what: There is no cancel on the screen, although F108 resolves "guest walks away" with cancelFnbOrder.
      why: Send-then-charge makes an unpaid sent order an everyday case; the counter needs Cancel order.
      source: F108 step 3 | contracts/satellite/fnb.yaml#cancelFnbOrder
      status: fixed
      by: CHG-WIR-008
    - what: F108's exit state "uncollected" has no operation; markOrderCollected only records a collection.
      why: The flow says uncollected orders are recorded and counted; nothing can record one from the counter.
      source: F108 step 6 | contracts/satellite/fnb.yaml#markOrderCollected
      status: logged
      by: CHG-SPO-019
    - what: 'createFnbOrder takes no guest name, mobile, pickup time, delivery location or delivery-partner reference, and
        nothing writes the kitchen ticket''s buzzer number from a till.

        '
      why: Takeaway and delivery need contact and timing details (DI-790) and a delivery needs a location (R125(1)); the
        buzzer is BL-128.
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateFnbOrderRequest | DI-790 | R125
      status: logged
      by: CHG-SPO-019
    - what: 'The v2 capture for this screen is the Queue (partner orders sent from Received); the counter still has no send-to-kitchen
        step.

        '
      why: POSV2-4 requires the send step at the counter before Charge.
      source: screens/P04-point-of-sale.yaml#POS-022 | POSV2-4
      status: fixed
      by: CHG-SPO-016
  POS-023:
    summary: 'The merchandise till: a cashier at a shop or a souvenir counter scans or taps items, picks the size or colour,
      and charges through the same cart and payment as tickets and food (DI-795). Stock is the outlet''s system stock and
      gates the sale (DI-294). The one thing to get right: a scan lands in the cart in one beep, with the right variant,
      and the board says plainly when a barcode is unknown or the item is out of stock.

      '
    inputs:
    - field: Scan or search
      rule: 'The scanner is always live on this screen; a barcode or SKU adds the item at this till''s outlet price. Search
        matches name, SKU, barcode and description. An inactive item answers like an unknown barcode.

        '
      source: contracts/satellite/retail.yaml#lookupMerchandise | R215
    - field: Variant (size, colour)
      rule: 'An item with variants opens a picker (S · M · L · XL) showing stock per variant; each variant has its own barcode,
        so scanning a variant barcode skips the picker.

        '
      source: DI-354
    - field: Add-on to a ticket (locker, towel)
      rule: Scan the guest's ticket QR to attach the add-on to it; no new QR is issued. Removing the ticket line removes
        the add-on.
      source: DI-295 | contracts/spine/orders.yaml#addCartLine
    - field: Serial number
      rule: Serialised items (electronics, jewellery) ask for the serial at sale; the sale is refused without it.
      source: contracts/satellite/retail.yaml#createRetailSale
    outputs:
    - element: Item tiles
      rule: 'Photo, name, variant summary, price (with was-price when on promotion), and stock at this outlet ("18 in stock",
        "Low stock · 6 left"). No validity or date chips.

        '
      source: contracts/satellite/retail.yaml#lookupMerchandise | designer default
    - element: Stock elsewhere
      rule: When this outlet is out, show the sibling outlets that have it ("Marina Bay Store has 4") so a colleague can
        fetch it.
      source: contracts/satellite/retail.yaml#lookupMerchandise
    actions:
    - action: Charge AED x
      result: Payment (POS-005) with the cart; one receipt for tickets, food and merchandise together.
      source: DI-293 | DI-795
    - action: Redeem a bundled item
      result: Scanning a ticket QR whose bundle includes a retail item hands it over at AED 0.00 and marks it redeemed.
      source: DI-351 | DI-458
    edgeCases:
    - case: The barcode is not in the catalogue
      expected: '"Not found: 6291041500213" stated once, plainly; offer search.'
      source: screens/P04-point-of-sale.yaml#POS-023
    - case: The item sold out between scan and charge
      expected: The line is flagged and the rest of the sale stands.
      source: screens/P04-point-of-sale.yaml#POS-023
    - case: The till is offline
      expected: 'Merchandise cannot be charged offline (real-time stock); the board says so in the offline banner and keeps
        tickets and food sellable. See corrections for the contradiction in the package.

        '
      source: contracts/satellite/retail.yaml#createRetailSale | DI-075
    - case: System stock is zero but the item is physically on the shelf
      expected: The sale is refused; system stock gates the sale. The cashier raises a stock adjustment with a supervisor.
      source: DI-294
    consistency:
    - with: POS-021
      note: Same board (tabs with counts, tiles, Scan) and same cart.
    - with: POS-011
      note: Returns of these sales start from the receipt barcode printed here.
    - with: GST-026
      note: The same merchandise items and prices as the guest shop.
    sampleData:
      outlet: Marina Bay Store — Aqua Park
      tabs:
      - All (12)
      - Apparel (3)
      - Souvenirs (3)
      - Essentials (4)
      - Lockers (2)
      items:
      - name: Park T-Shirt
        sku: TSH-MB-GRN-M
        price: AED 89.00
        variants: 'S · M · L · XL (M: 6 left)'
      - name: Marina Bay Hoodie
        price: AED 189.00
        wasPrice: AED 252.00
      - name: Sunscreen SPF50 · 200 ml
        price: AED 62.00
        stock: 41 in stock
      - name: Locker · full day
        price: AED 35.00
        note: attached to ticket AQP-104582
      unknownScan: 'Not found: 6291041500213'
    corrections:
    - what: 'The offline state says "Sells from the cached catalogue. Stock goes negative rather than refusing", while createRetailSale
        is not offline-capable ("a terminal without a connection cannot complete a retail sale").

        '
      why: 'The screen and its contract disagree. The client agreed offline retail risks overselling (DI-075) and that system
        stock gates the sale (DI-294). One rule must be chosen; the design follows the contract until then.

        '
      source: screens/P04-point-of-sale.yaml#POS-023 | contracts/satellite/retail.yaml#createRetailSale | DI-075 | DI-294
      status: logged
      by: CHG-SPO-020
    - what: 'Two sale paths are attached: the shared cart (addCartLine, then Payment) and createRetailSale, which creates
        its own order and stock depletion.

        '
      why: 'One cart and one receipt across tickets, food and merchandise (DI-293) means a mixed cart is paid once; the
        package must say which path depletes merchandise stock when it is paid with tickets.

        '
      source: contracts/satellite/retail.yaml#createRetailSale | contracts/spine/orders.yaml#addCartLine | DI-293
      status: logged
      by: CHG-SPO-020
    - what: 'The layout shows text fields "Outlet id" and "Category id", an "In stock only" toggle, a table "Every merchandise",
        and modals for "Add cart line", "Create retail sale" and "Evaluate promotions"; listMerchandise is loaded although
        "a terminal does not call this".

        '
      why: The till reads its catalogue from the local bundle and checks stock with the barcode lookup; the outlet comes
        from the session.
      source: contracts/satellite/retail.yaml#listMerchandise | R254
      status: fixed
      by: CHG-WIR-008
    - what: The v2 candidate has no size or variant picker, shows "Open-dated · any day" on merchandise and a "Low capacity"
        chip.
      why: Variants with their own barcodes and stock were agreed (DI-354); validity and capacity are ticket words (use
        "Low stock").
      source: screens/P04-point-of-sale.yaml#POS-023 | DI-354
      status: fixed
      by: CHG-SPO-001
  POS-024:
    summary: 'Outlet configuration from the floor, for a manager signed in on the same till a cashier uses: the table layout
      (halls, tables, shapes, capacity, position), which tables combine, and taking items off sale. The one thing to get
      right: it is a visual editor of the same floor POS-028 shows, and it is clearly a manager mode — a cashier sees why
      they cannot enter, not an empty screen.

      '
    inputs:
    - field: Table
      rule: 'Label (unique within the venue), capacity, shape (round, square, rectangle, booth, bar), hall, position by
        dragging on the plan, and Out of service. Capacity cannot change while a party is seated at the table.

        '
      source: contracts/satellite/fnb.yaml#setTableLayout | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
        | R108 | R194
    - field: Combination
      rule: Pick two or more tables on the plan and enter what they seat together and the set-up minutes; declared by a
        person, never inferred from adjacency.
      source: contracts/satellite/fnb.yaml#setTableCombinations
    - field: Take off sale (86)
      rule: Pick items, a reason (Other needs a note) and an optional "back at" time; immediate on every till and guest
        menu.
      source: contracts/satellite/fnb.yaml#setItemAvailability | R110 | R222
    actions:
    - action: Save layout
      result: Saves the hall's whole layout in one go; refused if someone else changed it meanwhile ("Reload to see the
        latest layout").
      source: contracts/satellite/fnb.yaml#setTableLayout
    edgeCases:
    - case: Offline
      expected: Editing is refused offline with the reason (two disconnected tablets would make two layouts); 86 still works
        offline.
      source: screens/P04-point-of-sale.yaml#POS-024 | contracts/satellite/fnb.yaml#setItemAvailability
    - case: A cashier opens the screen
      expected: '"You are signed in as a cashier. Sign in as a manager on this till to change the outlet."'
      source: screens/P04-point-of-sale.yaml#POS-024
    consistency:
    - with: POS-028
      note: The same plan component in edit mode.
    - with: EMP-053
      note: Table and seating configuration on the staff app edits the same layout; the two must not diverge.
    - with: BO-729
      note: The outlet itself (type, hours, channels) is set in Venue Management; the till edits only the floor and availability.
    sampleData:
      hall: Terrace · 5 tables
      tables:
      - T12 round · 2 · (x 2.0, y 1.5)
      - T14 rectangle · 6
      - T15 booth · 4 · out of service
      combination: T6 + T7 = 9 covers · 5 min set-up
    corrections:
    - what: Text fields "Venue id" and "Kind", tables "Every outlet" and "Every menu", and listMenus are on the screen.
      why: The outlet is the till's; the menu is not edited here (86 needs only the items). Plumbing on a manager's screen.
      source: screens/P04-point-of-sale.yaml#POS-024 | R254
      status: fixed
      by: CHG-WIR-008
    decisions:
    - question: setTableLayout matches tables by id (update or add). How is a table removed from the layout?
      decision: '''Remove table'' marks the table Out of service (setTableLayout never deletes).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-067 | CHG-NOTE-004
      questionSource: contracts/satellite/fnb.yaml#setTableLayout
  POS-028:
    summary: 'Table service from the till for a restaurant outlet (Oasis Bistro): a host or server sees the floor hall by
      hall, drawn to scale with real table shapes, seats a walk-in or a booking with its number of covers, recalls a table''s
      check to add items, prints the bill and settles it, then makes the table available again. The one thing to get right:
      the floor is the screen — every table shows its status, covers, time seated and check total at a glance, and every
      action starts from tapping a table. Moving and merging tables are not on the till until after r2.

      '
    inputs:
    - field: Covers
      rule: 'Required when seating (at least 1): "How many guests?" with quick buttons 1–8 and a number pad. For a booking
        it defaults to the booked party size and can be corrected. Covers drive split-by-covers at the end.

        '
      source: contracts/satellite/fnb.yaml#openTableVisit | contracts/satellite/fnb.yaml#seatTableReservation | DI-104
    - field: Server
      rule: Defaults to the signed-in user.
      source: contracts/satellite/fnb.yaml#openTableVisit
    - field: Table for a booking
      rule: 'The host picks the actual table(s) at seating; a booking does not hold a specific table unless the guest asked
        for one. A party larger than one table is offered the outlet''s declared combinations (tables 6 + 7 = 9 covers).

        '
      source: contracts/satellite/fnb.yaml#seatTableReservation | contracts/satellite/fnb.yaml#createTableReservation |
        contracts/satellite/fnb.yaml#setTableCombinations
    - field: Bill split
      rule: 'At settlement only (never while the party is still ordering): By amount · By covers (defaults to the visit''s
        covers) · By category (food / drinks) · By item · By seat. A split that does not add up to the total is refused,
        not rounded away.

        '
      source: DI-106 | contracts/satellite/fnb.yaml#splitBill
    outputs:
    - element: Halls
      rule: Tabs per hall (Main Hall, Terrace, Majlis rooms) with table and cover counts; the plan shows only tables of
        the selected hall.
      source: DI-335 | DI-793
    - element: Floor plan
      rule: 'Drawn to scale with the real shapes (round, square, rectangle, booth, bar) so a 2-seat and a 4-seat table look
        different; each table shows its label and covers. Colour by status with a legend and status filter chips with counts.
        Status words: Vacant · Seated · Ordered · Bill requested · Table closed · Reserved; out-of-service tables hatched.
        No "Cleaning" status.

        '
      source: DI-104 | DI-792 | DI-793 | DI-336 | contracts/satellite/fnb.yaml#/components/schemas/TableDefinition
    - element: Table list beside the plan
      rule: 'Same tables as rows: label, covers, status, check total and time seated ("AED 412.00 · 38 min"), with the one
        next action for that status (Seat & order, Recall check, Settle bill, Seat booking, Make available).

        '
      source: screens/P04-point-of-sale.yaml#POS-028
    - element: Bookings for this service
      rule: Time, guest name, party size, table held (if any), notes/occasion; arrived bookings disappear into their table.
      source: contracts/satellite/fnb.yaml#listTableReservations | DI-791
    - element: Bill
      rule: Every line across the visit's orders, service charge, VAT, discount and total; sub-bills each with their own
        total and paid state.
      source: contracts/satellite/fnb.yaml#getBill | contracts/satellite/fnb.yaml#/components/schemas/SubBill
    actions:
    - action: Seat & order
      result: Opens a visit on a vacant table with the covers, then opens the Food & Drink board in dine-in mode for that
        table.
      source: contracts/satellite/fnb.yaml#openTableVisit | DI-103
    - action: Seat booking
      result: Seats a booked party at the chosen table(s); allowed from booked, confirmed or no-show bookings only.
      source: contracts/satellite/fnb.yaml#seatTableReservation
    - action: Recall check
      result: Opens the table's visit on the Food & Drink board to add a round; each round is sent to the kitchen like any
        order.
      source: contracts/satellite/fnb.yaml#getTableVisit | R261
    - action: Print bill
      result: Marks the table Bill requested and prints the bill; reversible — another round can still be ordered.
      source: contracts/satellite/fnb.yaml#requestBill
    - action: Settle bill
      result: Optional split, then Payment (POS-005) for each part; when the bill is paid the visit closes and the table
        shows Table closed.
      source: contracts/satellite/fnb.yaml#closeTableVisit | F108 step 4
    - action: Make available
      result: Turns a closed table back to Vacant (offline-capable).
      source: contracts/satellite/fnb.yaml#clearTable | DI-336
    edgeCases:
    - case: Two tills seat the same table
      expected: The second is refused and told which party is already seated there; offline, the conflict surfaces on sync.
      source: contracts/satellite/fnb.yaml#openTableVisit
    - case: Settling while items are still unserved or payments do not cover the bill
      expected: Refused with the unserved lines named; the server serves or voids them first.
      source: contracts/satellite/fnb.yaml#closeTableVisit
    - case: The till is offline
      expected: Seating, booking arrival and Make available work offline; settling (closing the visit) needs the connection.
      source: contracts/satellite/fnb.yaml#closeTableVisit | contracts/satellite/fnb.yaml#clearTable
    - case: A party asks for the bill and then orders again
      expected: Allowed; the table goes back from Bill requested to Ordered.
      source: contracts/satellite/fnb.yaml#requestBill
    - case: The guest wants to move tables or join two tables mid-meal
      expected: Not on the till until after r2; staff use the staff app (EMP-058). Do not draw Move or Merge here.
      source: POSV2-8
    consistency:
    - with: EMP-058
      note: Same floor component, same status colours and words; the staff app keeps move and merge.
    - with: EMP-052
      note: The floor plan is one component on the till and the staff app (DI-104, DI-793).
    - with: POS-021
      note: Dine-in orders are taken on the Food & Drink board with the table and covers carried.
    - with: POS-005
      note: One tender flow for the whole till (F108 step 4); a split part is paid like any sale.
    - with: POS-024
      note: The layout and the table combinations drawn here are configured on POS-024.
    sampleData:
      outlet: Oasis Bistro · dinner service · last seating 22:30
      halls:
      - Main Hall · 11 tables · 48 covers
      - Terrace · 5 tables · 20 covers
      - Majlis rooms · 4 rooms · 36 covers
      tables:
      - table: T2
        covers: 4
        status: Ordered
        check: AED 412.00
        seated: 38 min
        server: Priya Nair
      - table: T4
        covers: 6
        status: Bill requested
        check: AED 1,284.50
        seated: 1 h 12 min
      - table: T5
        covers: 2
        status: Reserved
        booking: Al Suwaidi · 19:30 · anniversary
      - table: T7
        covers: 4
        status: Vacant
      split: 'T4 by covers: 6 × AED 214.08, last part 214.10'
    corrections:
    - what: 'The screen lacks the operations its own actions and the v2 frame need: reading the table''s visit (Recall check),
        the bill, splitting it and requesting it (Settle bill, Bill requested, split by amount/covers/category) exist only
        on the staff app''s EMP-059; the v2 Reservations tab needs createTableReservation.

        '
      why: DI-106 puts bill splitting on POS-028; without these the till cannot recall or settle a table.
      source: contracts/satellite/fnb.yaml#getTableVisit | contracts/satellite/fnb.yaml#getBill | contracts/satellite/fnb.yaml#splitBill
        | contracts/satellite/fnb.yaml#requestBill | DI-106
      status: fixed
      by: CHG-WIR-008
    - what: closeTableVisit takes its own payments list, a second tender path beside Payment (POS-005).
      why: '"A till has one tender flow, not one per module." The contract should say how payments taken on POS-005 settle
        and close the visit, and the screen''s "Close visit & charge" must go through POS-005.

        '
      source: contracts/satellite/fnb.yaml#closeTableVisit | F108 step 4
      status: logged
      by: CHG-SPO-019
    - what: 'The contract''s table status has needsClearing (closeTableVisit leaves a table needing clearing; clearTable
        frees it), while the client decided there is no cleaning status (Available → Ordered → Table closed → Reserved).

        '
      why: 'Align the words: show needsClearing as "Table closed" and the clear action as "Make available"; rename in the
        contract so no screen says "Cleaning".

        '
      source: DI-336 | contracts/satellite/fnb.yaml#closeTableVisit | contracts/satellite/fnb.yaml#/components/schemas/TableStatus
      status: fixed
      by: CHG-SPO-006
    - what: 'The table model cannot draw the agreed floor: TableDefinition has x/y position and shape but no size or rotation,
        zones are bare strings with no hall dimensions, and nothing tags a table or visit VIP.

        '
      why: DI-793 asks for a to-scale plan of each hall and DI-335 for VIP tagging.
      source: contracts/satellite/fnb.yaml#/components/schemas/TableDefinition | contracts/satellite/fnb.yaml#/components/schemas/TableMap
        | DI-793 | DI-335
      status: logged
      by: CHG-SPO-019
    - what: The offline state talks about "two tills moving the same party", but moving is deferred.
      why: POSV2-8 took move and merge off this screen.
      source: screens/P04-point-of-sale.yaml#POS-028 | POSV2-8
      status: fixed
      by: CHG-SPO-006
    decisions:
    - question: Should Add guest (covers change), Change server and Transfer table from the table activity log be on the till
        in r1?
      decision: Change covers and change server on the till in Block A (updateTableVisit, transferTableVisit); table transfer
        to another table only after r2.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-068 | CHG-NOTE-004
      questionSource: DI-338 | POSV2-8
    - question: Does a reservation taken at the till ask for a deposit?
      decision: 'Drawn default accepted: No deposit field unless the venue has switched dining deposits on; off by default
        and none in the first release.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-069 | CHG-NOTE-004
      questionSource: R077 | DI-1049 | DI-791
  KSK-011:
    summary: At the kiosk, a guest who booked online turns the booking reference into printed tickets or wristbands (on
      to KSK-012, Booking found). This is a ticket collection screen, not a retail one; it is on this list only because
      it is marked as needing retail.
    inputs:
    - field: Booking reference
      rule: Scan the QR on the confirmation email, or type the order number (venue prefix plus number, e.g. AQP-104582)
        on a large touch keypad.
      source: R152 | contracts/spine/orders.yaml#getOrder
    outputs:
    - element: Booking found
      rule: The guest's name, date and the items to print, in large type. No channel, scopePath, principal or price variance.
      source: contracts/spine/orders.yaml#getOrder | designer default
    sampleData:
      reference: AQP-104582
      guest: Daniel Brooks
      items:
      - Day pass adult ×2
      - Day pass child ×1
      - Fast Track ×2
    corrections:
    - what: The screen requires retail and declares lookupShopAndDrop. It was attached by the word "collect".
      why: Collecting a booking is ticketing (core). A kiosk cannot hand over shop-and-drop goods (collectShopAndDrop is
        staff-only). At most it could show where to collect them, which is a separate decision.
      source: screens/P05-guest-kiosk.yaml#KSK-011 | contracts/satellite/retail.yaml#collectShopAndDrop | R254
    - what: The order panel lists every Order field (scopePath, principalId, channel, totalPriceVariance), and the states
        name ORDER_VIEW.
      why: Plumbing on a guest kiosk.
      source: screens/P05-guest-kiosk.yaml#KSK-011
  KSK-016:
    summary: 'Order food at the kiosk and collect it at the counter. A guest at a kiosk with a queue behind them is not
      reading descriptions: photos, prices and allergens on the card, sold-out dishes visible, and an order number to listen
      for.'
    inputs:
    - field: Order type
      rule: 'Counter collection only: the kiosk has no location session. No address, slot or table.'
      source: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderRequest
    - field: Dish choices
      rule: 'Choices are made in a large-touch version of the modifier panel: required groups first, then up to the maximum,
        with the live total. Quantity 1 to 20.'
      source: contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup | DI-1050
    - field: Allergen filter
      rule: '"Without nuts" and similar filters narrow the menu on the kiosk itself. When a filter leaves little, say so
        plainly instead of showing a blank menu.'
      source: screens/P05-guest-kiosk.yaml#KSK-016
    outputs:
    - element: Menu cards
      rule: Large photo, name, price and allergens on the card, not behind a tap. Sold-out dishes stay, greyed, marked "Sold
        out".
      source: contracts/satellite/fnb.yaml#getGuestMenu | screens/P05-guest-kiosk.yaml#KSK-016
    - element: Order placed
      rule: The order number very large, the collection point and ready time, and the same number printed on the receipt.
        The same number shows on the guest status board (KIT-007).
      source: contracts/satellite/fnb.yaml#/components/schemas/GuestOrderResult | POSV2-7
    sampleData:
      outlet: Bite & Go
      order:
        number: AQP-104633
        collect: Hatch 2
        readyAbout: '12:40'
        total: AED 76.00
    edgeCases:
    - case: Food and tickets bought together
      expected: The kiosk is inside the venue, where F&B needs admission; the F&B order keeps its own payment and receipt,
        separate from the tickets.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
    corrections:
    - what: After "Create guest F&B order" there is no payment step and no confirmation; the only exit is to the Shop (KSK-017).
      why: Payment is required before the kitchen sees a guest order. The kiosk needs its review and payment steps (KSK-006,
        KSK-007) and an order-placed screen.
      source: contracts/satellite/fnb.yaml#createGuestFnbOrder | screens/P05-guest-kiosk.yaml#KSK-016
    - what: The allergen banner promises that "contains" and "may contain" are told apart, but the guest menu carries one
        flat allergen list.
      why: See WEB-037. GuestMenu should carry the Allergen object.
      source: contracts/satellite/fnb.yaml#/components/schemas/Allergen | contracts/satellite/fnb.yaml#/components/schemas/GuestMenu
    - what: The order modal collects id, recordedAt, quotedTotal, locationSessionId and fulfilment; the pattern is a status
        tracker.
      why: Plumbing; the screen is a menu, a basket and pay.
      source: screens/P05-guest-kiosk.yaml#KSK-016 | R254
    decisions:
    - question: Are F&B kiosks only inside the gate? A kiosk outside would sell food without admission (DI-292). Do food and
        tickets bought together at a kiosk go on one receipt (DI-293)?
      decision: Kiosks inside the venue need admission for F&B; F&B keeps its own receipt (from WEB-036).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-206 | CHG-NOTE-004 | CHG-SGU-001
      questionSource: DI-292 | DI-293
  KSK-017:
    summary: Buy merchandise at the kiosk in the same kiosk cart as tickets and food, or hold an item to pay for at the
      shop until the end of the visit day.
    inputs:
    - field: Category, size
      rule: Category tiles by name and size buttons. Never "Outlet id" or "Category id" boxes. The kiosk prices and counts
        at its own shop.
      source: contracts/satellite/retail.yaml#lookupMerchandise | R215
    - field: Hold until
      rule: Defaults to the venue's close today; an earlier time at least 15 minutes ahead may be chosen.
      source: R169 | R215 | contracts/satellite/retail.yaml#reserveMerchandise
    outputs:
    - element: Product tiles
      rule: In stock first. Sold-out items are shown marked, with "Available at Marina Bay retail store" when another shop
        has it.
      source: screens/P05-guest-kiosk.yaml#KSK-017 | DI-294
    - element: Hold confirmation
      rule: The hold number large and printed, "Pay and collect at Marina Bay retail store by 22:00", and the statement
        that this is not a purchase.
      source: contracts/satellite/retail.yaml#/components/schemas/MerchandiseReservation | R236
    sampleData:
      items:
      - Aqua Park tee, green, M · AED 95.00
      - Kids' swim goggles · AED 45.00
      - Beach towel · Sold out here · available at Marina Bay retail store
      hold:
        number: RSV-2307
        until: Sat 24 Oct 2026, 22:00
    corrections:
    - what: The notes say "a guest can browse and reserve and not buy", while the purpose is "Buy merchandise at the kiosk"
        and addCartLine is declared. No path leads to the kiosk's review and payment (KSK-006, KSK-007).
      why: The screen contradicts itself. Buying goes through the kiosk cart and its payment steps; add that navigation.
      source: screens/P05-guest-kiosk.yaml#KSK-017
      status: fixed
      by: CHG-SGU-018
    - what: Flow F51 step 4 ("Or they collect from a kiosk") uses KSK-017 with listMerchandise and reserveMerchandise.
      why: Neither operation collects a drop, and a kiosk cannot hand goods over (collectShopAndDrop is staff-only). The
