# The classes a change request can belong to, read by the CR watcher (tools/cr-watch.py; CHG-CRF-002).
#
# Authored. Add a class when the watcher's draft says "new: <name>" and the lead agrees; add its check once one exists,
# so its siblings are counted with no AI. The first nine are the 15 October triage's classes, in the order the post-r6
# plan fixes them (audit/ticvai/POST-R6-PARALLEL-PLAN.md, item 4); the last seven are the 18 October triage's new ones
# (audit/ticvai/cr-triage-1018/classes.json), with the requests of both triages listed under `crs`.
#
#   artefacts       ids a request names as its artefact (ADAM's `artefact` column) that belong to the class
#   words           words or phrases (any case) that mark the class in a request's title or problem
#   crs             requests already in the class; a request that names one of these is near it too, and an open
#                   blocking one of them blocks a new request of the class
#   checks          check -> rules whose baselined findings (handoff/audit-baseline.json) are the class's known members
#   branch          the class fix's branch (default fix/<id>)
#   default_ruling  {status: proposed|active, text: ...}: a ruling for the class. Only `active` (the lead sets it) puts
#                   its requests first in REVIEW.md under "approve all default-ruled"; a `proposed` ruling (one an
#                   implementer drafted) is shown in the facts and changes nothing. Either way a request is settled
#                   only when the lead marks it, and the mark covers only the draft the lead saw.
#   needs           who decides by default: lead or client
classes:
- id: read-routes
  name: Read routes between modules
  artefacts: [ADR-0055]
  words: [x-ticvai-read-via, read-via, readvia, read route, another module's, cross-module, x-ticvai-queries,
          declared query, routes to, no reads, declares only, undeclared read, declares no read]
  crs: [CR-096, CR-135, CR-161, CR-167, CR-218]
  checks:
    check-cross-module-reads: [XR-UNCOVERED, XR-QUERY, XR-ROUTE, XR-FOUNDATION, XR-LINEAGE, XR-VIEW-ACROSS, XR-FACT]
    check-error-sources: [E-READ-VIA, E-QUERY]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern e, CHG-R10GEN-008) Another module's fact is asked of its owner's query over that table
      (x-ticvai-read-via; in-process within one deployable, service across), declaring a per-table data read where
      the owner has none; a GET asks what its own words name or its response works out on read. Run
      python tools/fix-read-routes.py --apply, then tools/derive-lineage.py --apply. Identity above the foundation
      tier reads only by projection (ADR-0028), which is the lead's call.
  needs: lead
- id: row-security
  name: Row security fits its callers
  words: [row security, row-level security, rls, scope_path, read-beneath, apply_parent_rls, parent policy,
          security-definer, cannot reach the rows, scopes, tenant-root-only]
  crs: [CR-095, CR-108, CR-149]
  checks:
    check-rls-scope-fit: [RF-TENANT-ROOT, RF-OWNED-ABOVE]
  needs: lead
- id: foundation-module-test
  name: The Foundation module test
  words: [module test, table records, record in adam, database migrations module, dead_letter]
  crs: [CR-092, CR-093]
  default_ruling:
    status: proposed
    text: ADAM builds a table's record from the generated DDL plus the forward migrations (CR-092's fix); the module
      test lists only its own tickets' tables. Nothing for the developer to change in the package.
  needs: lead
- id: control-data
  name: Control data in the tenant database
  words: [control database, tenant database, plan catalogue, subscription_plan, move to control, control.]
  crs: [CR-097, CR-150]
  needs: lead
- id: stored-secrets
  name: Stored forms for secrets, tokens and hashes
  words: [secret, token, hash, credential, blind index, blind-index, adr-0063, adr-0071, writeonly, signing key]
  crs: [CR-098, CR-100, CR-107]
  checks:
    check-contract-storage: [ST-SECRET-FORM]
    check-stored-request-fields: [SR-SECRET-UNHASHED]
  needs: lead
- id: background-jobs
  name: Background jobs
  words: [background job, job, executor, worker, nothing drives, async work, scheduled, retry]
  crs: [CR-105, CR-106, CR-140]
  needs: lead
- id: contract-storage
  name: Contract against storage
  words: [no column, has no column, can't store, cannot store, no storage, not null, nullable, unique, has no table,
          no table, keyed to]
  crs: [CR-099, CR-104, CR-111, CR-112, CR-154, CR-155, CR-165]
  checks:
    check-contract-storage: [ST-FIELD-NO-COLUMN, ST-TABLE-MISSING, ST-TYPE-MISMATCH, ST-ENUM-CHECK,
                             ST-REQUIRED-MISMATCH]
    check-storage-promises: [SP-ARRAY-NOWHERE, SP-DUPLICATE-409, SP-REQUEST-NOT-NULL, SP-KEY-UNDECLARED]
    check-stored-request-fields: [SR-STORED-NO-COLUMN, SR-STUB-WRITE]
    check-request-fields-stored: [RF-REQUEST-NOT-STORED]
    check-ddl-conventions: [D-STUB-TABLE]
  needs: lead
- id: undecided-rules
  name: Undecided rules
  words: [no grammar, no state model, is not defined, undefined, leaves open, no rule, statutory, precondition,
          open question]
  crs: [CR-101, CR-102, CR-103, CR-109, CR-110, CR-141, CR-144, CR-162, CR-168, CR-169]
  needs: lead
- id: money-currency
  name: Money currency
  words: [currency, money, aed, denomination, currency source, trading currency, amount only, currency read,
          venue-currency, venue's currency, currency and scale]
  crs: [CR-094, CR-197, CR-202, CR-217, CR-234, CR-235]
  checks:
    check-contract-shapes: [C-MONEY-NUMBER]
    check-money-currency: [MC-NO-CURRENCY]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern a, CHG-R10GEN-008) Money takes its currency from what denominates the amount
      (naming-and-style 5.1, ADR-0018); a row that stores the amount only asks the venue's frozen trading currency
      (tenancy#venueSettingsRecords) or, with only a region, tenancy#regionSettingsRecords, in-process within commerce
      and service across (CR-234 option A). Run python tools/fix-money-currency.py --apply. A row that keeps only a
      scope_path goes through tenancy#scopeRecords (CR-217); a platform billing row stores its billing currency
      (CR-202).
  needs: client
- id: forward-migration
  name: The forward migration and its review lose what the generator derived
  words: [migration-review, review row, forward migration, partition, truncated, cut before, retired columns,
          x-ticvai-retired-columns, unique-together, required-when, generated object, statement dropped]
  crs: [CR-138, CR-139, CR-148, CR-156, CR-157]
  needs: lead
- id: description-vs-shape
  name: The description and the declared shape disagree
  words: [description says, the record says, still requires, still marks, was dropped, names no table,
          no foreign key, cannot hold, nullable because, contradicts]
  crs: [CR-145, CR-146, CR-147, CR-151, CR-158]
  needs: lead
- id: state-model
  name: The state model and the operations disagree
  words: [state model, transition, requiresapproval, emittedwhen, terminal, resume, rolledback, from failed,
          pendingconfirmation, two different rules]
  crs: [CR-160, CR-237]
  checks:
    check-state-refusals: [SR-ALLOWS-NO-MOVE, SR-TERMINAL-UNANSWERED]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern c, CHG-R10GEN-008) The state model is right: an operation's 409 refuses exactly the states
      states/*.yaml does not move it from, and its words name no allowed state the model lacks. Run
      python tools/fix-order-and-refusals.py --apply; where the operation's purpose contradicts the model (CR-237,
      an override admits), the lead rules which one changes.
  needs: lead
- id: build-place
  name: The ticket or platform record names the wrong place to build
  words: [ticvai-ai, ticvai-backend, assigned to, reassign, wrong board, component path, targetapp, scaffolded,
          which app]
  crs: [CR-137, CR-153]
  needs: lead
- id: screen-values
  name: A screen action needs a value nothing on the screen supplies
  words: [nothing on the screen, takes the id from, deep-link, deeplink, the screen declares no, consent block,
          no source, does not declare, declares no, no operation the screen, binds, screen cannot, cannot show,
          returns them]
  crs: [CR-142, CR-143, CR-186, CR-187, CR-220, CR-221, CR-233]
  checks:
    check-screen-value-sources: [SV-SCHEMA, SV-FIELD, SV-OPTIONS, SV-MEDIA, SV-PICK, SV-WRITE]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern d, CHG-R10GEN-008) A screen shows only what an operation in its apis answers, and declares
      every write its text describes. Add the existing read or write to the screen (wired to the component that
      uses it), or add the field to an answer the screen already reads (additive); never a value from nowhere.
  needs: lead
- id: list-order
  name: A list's order is not stated, or not total
  words: [ordered by, order by, sort order, nulls last, nulls first, no order, tiebreak, which comes first,
          keyset, cursor, nullable, no stated order, orders by, sorts]
  crs: [CR-190, CR-206, CR-236]
  checks:
    check-list-order: [LO-NULLABLE-KEY, LO-UNORDERED]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern b, CHG-R10GEN-008) Every list states its order and the order is total. A nullable key puts
      the rows without it after every row that has it, then id (CR-236 option A), unless the operation has a
      natural fallback key (CR-206, coalesce(recordedAt, openedAt)); a list with no order sorts by a never-null
      name then id, else newest createdAt then id. Run python tools/fix-order-and-refusals.py --apply.
  needs: lead
- id: guest-venue
  name: A public guest read of venue data names no venue
  words: [guestvenue, x-venue-id, venue-required, no venue, which venue, public read, unauthenticated, guestauth]
  crs: [CR-198]
  checks:
    check-business-rules: [BR-GUEST-VENUE]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern f, CHG-R10GEN-008) A GET a guest calls without a session at venue scope takes the shared
      GuestVenue parameter (X-Venue-Id) and declares 400 venue-required, unless its path or a required query names
      the venue (CR-198 option A). The generators write it (contract_shapes.add_guest_venue).
  needs: lead
- id: scope-authz
  name: A permission is checked against the flat set, not per scope
  words: [permissionsbyscope, effectivepermissions, per scope, per-scope, at the tenant root, sibling venue,
          scope paths, flattened]
  crs: [CR-189]
  checks:
    check-business-rules: [BR-SCOPE-AUTHZ]
  default_ruling:
    status: proposed
    text: >-
      (r10 pattern g, CHG-R10GEN-008) x-ticvai-permission is evaluated per scope from Session.permissionsByScope
      after deny resolution, never from effectivePermissions - at the node acted on or an ancestor; a list reaches
      the scope paths where it holds (outside is 403); a tenant-level operation needs it at the tenant root (CR-189
      option A). The kernel (#27692) owns the seam.
  needs: lead
- id: platform-plumbing
  name: Platform plumbing the kernel needs is not in the package
  words: [outbox, relay, inbox, dead letter, fan-out, migrator, root scope, release flag, feature flag, kernel,
          provisioning, routing]
  crs: [CR-152, CR-163, CR-164, CR-166]
  needs: lead
- id: seed-data
  name: Seed data does not cover the reference fixture
  words: [seed, fixture, omr, oman, muscat, reference fixture]
  crs: [CR-159]
  needs: lead
