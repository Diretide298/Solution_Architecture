    open:
    - question: Ticket age colour thresholds (amber/red) are not set anywhere in the package.
      default: Amber at the outlet target prep time, red at twice it; outlet-configurable later.
    - question: Does the client run counter service at all? The pack suggests their F&B is table service and kitchen,
        which would make this speculative rather than missing. Worth one question to Qossai before it is built.
      default: 'Yes, counter service is built: Chinmay answered POS-021 with two configurations, Pay first and Send
        first then pay (answers L8), so the flow draws both.'
