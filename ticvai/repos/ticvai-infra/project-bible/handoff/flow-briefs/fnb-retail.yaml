      failure_branches:
      - screen: KIT-001
        what_goes_wrong: Offline
        user_sees: Amber banner, numbers from cache with their age; every bump made on station screens is journaled
          and syncs.
      - screen: KIT-001
        what_goes_wrong: No tickets
        user_sees: '"The kitchen is clear" stated plainly, not a blank screen.'
    - screen: KIT-003
      name: Order Firing & Course Management
