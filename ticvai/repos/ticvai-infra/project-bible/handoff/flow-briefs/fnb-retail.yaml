          (with how long). A held course keeps its place and shows its waiting time.'
      - element: Coursing policy
        rule: The outlet's default (Hold & fire, Timed, Phased, Fire all at once) shown as a label, per order type.
      states:
        loading: The rail, oldest ticket first. The count renders before the tickets — a kitchen wants to know how
          deep it is before it reads anything.
        error: Could not reach the platform. The rail is still live from cache and every bump is queued.
        emptyFirstRun: No tickets. The kitchen is clear, and that is worth saying plainly rather than showing a blank
          rail — a screen that looks broken and a screen that means nothing to do are the same …
        emptyNoResults: Nothing matches this course filter. The rail is not empty — the filter is narrow, and on a
          kitchen screen that distinction is the difference between calm and panic (audit R277).
        emptyNoAccess: Without `ORDER_VIEW`, which `listKitchenTickets` requires, the screen does not load and this
          state names that permission. This display is not assigned to a station. Assignment is …
        offline: Amber, and it keeps working. The kitchen still has to send food out — a display that blanks mid-service
          is worse than one that says it is behind, and every bump journals locally …
      failure_branches:
      - screen: KIT-003
        what_goes_wrong: Offline
        user_sees: Fire and hold work and replay in order; Move up needs the connection and is disabled with the reason.
      - screen: KIT-003
        what_goes_wrong: Quick-service outlet
        user_sees: No courses and no fired timer; the screen is not offered.
    - screen: KIT-004
      name: Active Order Management & Fulfilment Journey
      shows:
      - element: Order header
        rule: Order number or table, order type, guest name only for takeaway/delivery, promised time, nine-state
          status in the shared words (Ordered, Accepted, Preparing, Ready, Served, Collected, Delivered, Cancelled,
          Refunded).
      - element: Parts by station
        rule: One row per kitchen ticket (station), with its status and age; the slowest part highlighted.
      states:
        loading: The order, then its tickets at each station.
        error: Could not reach the platform. The rail is still live from cache and every bump is queued.
        emptyFirstRun: No tickets. The kitchen is clear, and that is worth saying plainly rather than showing a blank
          rail — a screen that looks broken and a screen that means nothing to do are the same …
        emptyNoResults: Nothing matches this station or course filter. The rail is not empty — the filter is narrow,
          and on a kitchen screen that distinction is the difference between calm and panic.
        emptyNoAccess: Shown when the caller lacks ORDER_VIEW for this outlet, and names it.
        offline: Amber, and it keeps working. The kitchen still has to send food out — a display that blanks mid-service
          is worse than one that says it is behind, and every bump journals locally …
      failure_branches:
      - screen: KIT-004
        what_goes_wrong: Offline
        user_sees: The order is read from cache with its age.
    - screen: KIT-008
      name: Exceptions, Re-Fire & Unavailable Items
      shows:
      - element: Off sale today
        rule: Item, when it went off, who called it, reason, back at / came back, orders refused meanwhile.
      - element: Food safety
        rule: Checks due, checks missed, open corrective actions, unsigned findings, oldest open action; a missed
          check counts like a failed one.
      states:
        loading: The rail, oldest ticket first. The count renders before the tickets — a kitchen wants to know how
          deep it is before it reads anything.
        error: Could not reach the platform. The rail is still live from cache and every bump is queued.
        emptyFirstRun: No tickets. The kitchen is clear, and that is worth saying plainly rather than showing a blank
          rail — a screen that looks broken and a screen that means nothing to do are the same …
        emptyNoResults: Nothing matches this station or course filter. The rail is not empty — the filter is narrow,
          and on a kitchen screen that distinction is the difference between calm and panic.
        emptyNoAccess: This display is not assigned to a station. Assignment is a back-office act — a kitchen screen
          does not choose what it shows. A principal without `PRODUCT_VIEW` gets this state …
        offline: Amber, and it keeps working. The kitchen still has to send food out — a display that blanks mid-service
          is worse than one that says it is behind, and every bump journals locally …
      failure_branches:
      - screen: KIT-008
        what_goes_wrong: An item 86'd here while a till is offline
        user_sees: The offline till keeps selling it; the kitchen refuses it at send, before payment.
    - screen: KIT-002
      see: fnb-retail#F29
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: KIT-001
      screen_name: Kitchen Operations Command Center
      block_a: true
      user_sees: 'The kitchen supervisor''s or head chef''s overview of the whole kitchen during service: how deep
        each station''s rail is, the oldest ticket and how late it is against its target, held courses, refires and
        86''d items, and a way into each …'
      user_does: Kitchen Operations Command Center.
      operations:
      - fnb#listFnbOrders
      - fnb#listKitchenStations
      - fnb#listKitchenTickets
      result: Drawn by the client as FNB-3A. 3 operations on this step.
    - frame: 2
      screen: KIT-002
      screen_name: Kitchen Display System (KDS)
      block_a: true
      user_sees: 'The station display on the kitchen wall: the tickets this station must make, in the order the kitchen
        should make them, bumped with one touch or a bump bar by someone wearing gloves.'
      user_does: Kitchen Display System (KDS).
      operations:
      - fnb#listKitchenTickets
      - fnb#recallKitchenTicket
      result: Drawn by the client as FNB-3B. 2 operations on this step.
    - frame: 3
      screen: KIT-003
      screen_name: Order Firing & Course Management
      block_a: true
      user_sees: 'The pass (head chef or expeditor) for table service: courses of each table — starters before mains
        — and when the next course goes.'
      user_does: Order Firing & Course Management.
      operations:
      - fnb#prioritiseKitchenTicket
      result: Drawn by the client as FNB-3C. 2 operations on this step.
      crosses_device: true
    - frame: 4
      screen: KIT-004
      screen_name: Active Order Management & Fulfilment Journey
      block_a: true
      user_sees: 'One order''s journey across stations for the pass or a supervisor: which of its kitchen tickets
        are ready, which are still on which station, and how it will be handed over.'
      user_does: Active Order Management & Fulfilment Journey.
      operations:
      - fnb#getFnbOrder
      - fnb#listKitchenTickets
      result: Drawn by the client as FNB-3D. 2 operations on this step.
      crosses_device: true
    - frame: 5
      screen: KIT-008
      screen_name: Exceptions, Re-Fire & Unavailable Items
      block_a: true
      user_sees: 'What went wrong in the kitchen tonight and the controls for it: take an item off sale (86) at once
        on every till and guest menu, see what was 86''d today and for how long, log an equipment failure or a late
        delivery, and the food-safety …'
      user_does: Exceptions, Re-Fire & Unavailable Items.
      operations:
      - fnb#list86Events
      - fnb#logKitchenException
      - fnb#setItemAvailability
      result: Drawn by the client as FNB-3H. 3 operations on this step.
      crosses_device: true
    motion:
    - what: Kitchen rail (KIT-002)
      how: New tickets slide in at the right-hand end in server order; a bumped ticket collapses out and the rail
        closes the gap. Recalled tickets slide back in with a "Recalled" tag.
      timing: Arrives within 2 s of the send (poll/push from listKitchenTickets); slide 200 ms
    - what: Ticket age timer
      how: Each ticket header counts up mm:ss from fired time; the header turns amber, then red, against the outlet
        target time.
      timing: Ticks every 1 s
    - what: Line bump
      how: Tapped lines strike through; a whole-ticket bump flashes the header green before it leaves the rail.
      timing: 150 ms flash, 200 ms exit
    - what: 86 toggle
      how: Setting an item unavailable greys it on every menu surface and shows "Sold out" to guests; the toggle flips
        with a confirmation.
      timing: Immediate
    decisions:
    - 'answers-2-oct-batch1.md L175: an item with no station goes to a default station named per outlet'
    - 'answers-2-oct-batch1.md L176: no probable-cause column; link to waste and production'
    - 'answers-2-oct-batch1.md L167: kitchen printers in release 1'
    sources:
