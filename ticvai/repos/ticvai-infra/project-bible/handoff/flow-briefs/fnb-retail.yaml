      block_a: false
      writes: true
    - operation: inventory#recordQuotation
      what: Record a supplier quotation
      steps:
      - 1
      block_a: false
      writes: true
    - operation: retail#createMerchandise
      what: Create a merchandise item
      steps:
      - 2
      block_a: true
      writes: true
    - operation: catalogue#createProduct
      what: Create a product
      steps:
      - 2
      block_a: false
      writes: true
    - operation: catalogue#setAlternativeCodes
      what: Set external identifiers
      steps:
      - 2
      block_a: true
      writes: true
    - operation: catalogue#listPriceLists
      what: List price lists
      steps:
      - 3
      block_a: false
    - operation: catalogue#setPrices
      what: Set prices in bulk
      steps:
      - 3
      block_a: true
      writes: true
    - operation: catalogue#transitionProductLifecycle
      what: Move a product through its lifecycle
      steps:
      - 4
      block_a: false
      writes: true
    - operation: catalogue#publishBundle
      what: Compute, sign and publish a catalogue bundle
      steps:
      - 4
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: The chain ran as the client drew it.
        stoppedAtModule: A licence boundary, not a failure.
      failure_branches:
      - at_step: 1
        what_goes_wrong: A step in the chain is not licensed for this tenant.
        user_sees: The chain stops at the module boundary. `requiresModule` on each screen decides — a tenant without
          the retail licence does not see the retail half, and the journey is shorter rather than broken.
        recovery: medium; resolved by white-label#getModuleEnablement
    - screen: BO-007
      name: Product Directory
      shows:
      - element: product table
        rule: 'Columns in this order: name (English, with the Arabic underneath in RTL), code, kind, lifecycle state
          badge, channels as small chips, on sale from-to, ticket types count, last changed. Hide the ids, scopePath
          and principal ids the generated layout lists; they are not for a merchandiser.'
      - element: lifecycle summary strip
        rule: Above the table, counts by state (Draft, In review, Approved, Live, Withdrawn) that act as filters,
          as the client asked for a lifecycle dashboard filterable by department.
      states:
        loading: The product list.
        error: Could not load. Names which read failed and leaves the product untouched.
        emptyFirstRun: No product yet. Offers Create product (`createProduct`); distinct from a filter that matched
          nothing.
        emptyNoResults: Nothing matches the filter on venueId, kind, isSellable and the product are still there. Names
          the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listProducts` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* …
      failure_branches:
      - screen: BO-007
        what_goes_wrong: A shared link to a product that has since been retired
        user_sees: Show the retired product read-only with what replaced it, or the catalogue if nothing did; never
          a blank page.
      - screen: BO-007
        what_goes_wrong: Code already used at another venue of the tenant
        user_sees: Refused inline before submit, naming the other venue; the 409 from the server shows the same text.
    - screen: BO-009
      name: Pricing Rules
      shows:
      - element: price list list
        rule: Code, name, channels as chips, valid from-to, priority, status (Draft, Active, Inactive, Retired), currency
          read-only.
      - element: overlap warning
        rule: When two active lists share a channel and dates for the same ticket type, show which one wins under
          the hierarchy and why (no lowest-price default).
      states:
        loading: The pricing rules list.
        error: Could not load. Names which read failed and leaves the pricing rules untouched.
        emptyFirstRun: No pricing rules yet. Offers Create price list (`createPriceList`); distinct from a filter
          that matched nothing.
        emptyNoResults: Nothing matches the filter on channel and the pricing rules are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `PRICE_VIEW`, which `listPriceLists` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* …
      failure_branches:
      - screen: BO-009
        what_goes_wrong: A price in a currency the region does not use
        user_sees: Cannot be entered, because the currency is not editable; an imported file with another currency
          is rejected with the rows named.
      - screen: BO-009
        what_goes_wrong: A list valid from a future date
        user_sees: Shown as scheduled with its start date; today's prices still come from the current list.
    steps:
    - frame: 1
      screen: BO-083
      screen_name: Suppliers
      block_a: false
      user_sees: Suppliers is the tenant's supplier master, read-only at venue level, together with what each supplier
        quoted, their contracts and their performance.
      user_does: The supplier is found or set up, and its quotation recorded.
      operations:
      - inventory#listSuppliers
      - inventory#createSupplier
      - inventory#recordQuotation
      result: Suppliers are the tenant's; a venue records the quotation (audit R183). The quoted price is what a purchase
        order line later prefills.
    - frame: 2
      screen: BO-007
      screen_name: Product Directory
      block_a: true
      user_sees: 'The venue''s catalogue: every sellable product of every kind in one list, the entry point to product
        configuration (BO-008), pricing (BO-009), promotions (BO-010) and menus (BO-045).'
      user_does: The new range becomes products in the directory.
      operations:
      - retail#createMerchandise
      - catalogue#createProduct
      - catalogue#setAlternativeCodes
      result: One product per sellable thing, with its barcodes. A range that is not in the directory cannot be priced
        or scanned.
      crosses_device: true
    - frame: 3
      screen: BO-009
      screen_name: Pricing Rules
      block_a: true
      user_sees: 'Where the venue sets what each ticket type costs, per channel and per period: price lists, the prices
        in them, next season''s copy and the dynamic rules that move prices.'
      user_does: The range is priced.
      operations:
      - catalogue#listPriceLists
      - catalogue#setPrices
      result: What the tills will charge, from when.
      crosses_device: true
    - frame: 4
      screen: BO-014
      screen_name: Catalogue Publishing
      block_a: false
      user_sees: 'Push catalogue changes to the tills and devices now or on a schedule, and see what is pending: products
        approved but not released, price lists changed, items marked unavailable.'
      user_does: The priced range is published to the tills.
      operations:
      - catalogue#transitionProductLifecycle
      - catalogue#publishBundle
      result: Publishing is what changes what every till charges, which is why it is its own step.
      crosses_device: true
    motion:
    - none (static configuration screens; the only change on screen is the saved/validation state)
    decisions:
    - 'answers-2-oct-batch1.md L361: catalogue.bulkUpdateProducts added (BO-007 bulk edit)'
    - 'ids in the flow: R183, R261'
    - 'answers-2-oct-batch1.md L19: ADM-049 onward | Who uses the 410 workshop-pack screens on the TICVAI console
      (370 Commercial, 20 Catalogue lifecycle, 20 Rules and workflow)? | They are venue screens. | Move them to Venue
      Management (P08) and merge them with the …'
    - 'answers-2-oct-batch1.md L34: - They configure the same records the venue edits in Venue Management (P08): BO-009
      price matrix, BO-010 promotions, BO-011 bundles, BO-008 product.'
