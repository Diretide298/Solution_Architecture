      what: Mark an item available or eighty-sixed
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: The chain ran as the client drew it.
        stoppedAtModule: A licence boundary, not a failure.
      failure_branches:
      - at_step: 1
        what_goes_wrong: A step in the chain is not licensed for this tenant.
        user_sees: The chain stops at the module boundary. `requiresModule` on each screen decides — a tenant without
          the retail licence does not see the retail half, and the journey is shorter rather than broken.
        recovery: medium; resolved by white-label#getModuleEnablement
    - screen: KIT-001
      name: Kitchen Operations Command Center
      shows:
      - element: Per-station strip
        rule: Each station (Grill, Fryer, Cold, Bar, Pastry) with tickets waiting and the age of the oldest, coloured
          against the outlet's target for that order type (amber at the warning percentage, red past target). No load
          percentage or capacity gauge in the first release.
      - element: Orders by stage
        rule: Counts of orders Received, Preparing, Ready (waiting for pickup or a runner) for the outlet; Ready orders
          waiting longest listed first.
      - element: Needs attention
        rule: Late tickets, held courses older than a few minutes, chased stations, items 86'd today with when they
