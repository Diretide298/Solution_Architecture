# Flow design briefs, Block A: fnb-retail. Written 3 October 2026 by the fnb-retail brief agent (Claude) for Claude Design (TODO step 9b).
# Shared brief: audit/ticvai/apply/FLOW-BRIEF-BRIEF.md. Scope: flows whose steps touch a Block A screen or operation
# (handoff/service-docs/op-release.json, tickets under BLOCK-A), filed by the process of the trigger screen.
# Steps, outcomes, branches and states are lifted from flows/, screens/, handoff/design-notes/ and contracts/;
# file inputs, motion and open-question defaults are authored. Answers: audit/ticvai/answers-2-oct-batch1.md (Lnn = line).
process: fnb-retail
flows:
  F11:
    title: Guest orders food to a lounger
    process: fnb-retail
    block_a:
      screens:
      - GST-024
      - GST-009
      - BO-020
      - GST-025
      - BO-021
      operations:
      - fnb#acceptFnbOrder
      - fnb#claimLocationSession
      - fnb#createGuestFnbOrder
      - orders#createPayment
      - fnb#getGuestMenu
      - fnb#getGuestOrderStatus
      - fnb#recordOrderHandover
      - fnb#setKitchenTicketStatus
      screens_outside_block_a: []
    trigger:
      description: A guest on a sunbed opens the app, scans the QR on their lounger, orders, and a runner brings it.
        Described in detail by the client on 14 August.
      entry_screen: GST-024
      entry_points:
      - QR on the lounger
      - Dining tab in the app
      - Push notification offer
    actors:
      roles:
      - guest
      apps:
      - Guest App (P02)
      - Venue Management (P08)
    offline: 'The guest half needs a network — an order nobody received is worse than a queue. The kitchen half tolerates
      a drop: tickets already accepted keep moving.'
    inputs:
    - name: Location QR on the lounger/table/seat
      formats:
      - QR code scanned with the phone camera (rotating code)
      - typed fallback, e.g. "Lounger B-14", "Table 12"
      limits:
      - one active location session per guest; session expires (LocationSession expiry)
      validation:
      - 'Damaged/unreadable QR: offer the typed box'
      - 'Expired session: "Scan the code on your lounger again"'
      - 'No admission ticket for today at an in-venue outlet: ordering refused (DI-292)'
      source: Guest on GST-024 (camera)
    - name: Scan the code where you're sitting
      screen: GST-024
      formats:
      - CAMERA
      - QR
      validation: The app's own camera scanner, with a "Type the number instead" link for a damaged QR (the human-readable
        location code). At a seated event the seat from the guest's ticket is offered prefilled. Codes rotate, so
        a screenshot of an old code is refused.
      source: guest on GST-024 F&B – Browse & Order
      ref: F11 step 1 | DI-288 | DI-291 | contracts/satellite/fnb.yaml#claimLocationSession
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Order type, time, address, cutlery, quantity, kitchen note, payment
      screen: GST-024
      limits:
      - up to 200 characters for allergies
      validation: Same rules as WEB-036. Only the order types the outlet supports. ASAP first, then open slots. Address
        emirate chosen from the outlet's list. Cutlery off by default. 1 to 20 per dish. Kitchen note up to 200 characters
        for allergies. Card or wallet, plus "Add to my table's bill" only on an open table tab.
      source: guest on GST-024 F&B – Browse & Order
      ref: contracts/satellite/fnb.yaml#/components/schemas/CreateGuestOrderRequest | R080 | DI-1039
      formats:
      - time picker (derived)
    - name: signed in as
      screen: GST-009
      validation: Shows who the guest is signed in as ("Paying as fatima.h@example.ae") with Not you?; the T&C tick
        is required and payment waits for it.
      source: guest on GST-009 Review & Payment
      ref: AUDIT-29SEP (Booking engine, signed in); MoM 29 Sep W1
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: payment method
      screen: GST-009
      validation: Apple Pay or Google Pay as the device offers, card, and wallet balance where the guest has one (split
        with card allowed).
      source: guest on GST-009 Review & Payment
      ref: DI-1096; DI-079; DI-525
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Outlet (filter)
      screen: BO-020
      validation: A picker of outlet names (listOutlets), never a text field for an id. Defaults to the user's own
        outlet when their access is restricted to one, otherwise "All outlets". F&B Director sees all outlets, an
        outlet manager only theirs.
      source: guest on BO-020 F&B Order Management
      ref: contracts/satellite/fnb.yaml#listFnbOrders | DI-318 | DI-331
      formats:
      - pick list (select) (derived from the BO-020 layout)
      limits:
      - only theirs (derived)
    - name: Status (filter)
      screen: BO-020
      validation: 'Chips over the nine FnbOrderStatus values, grouped: Live (Ordered, Accepted, In preparation, Ready),
        Handed over (Served, Collected, Delivered), Cancelled, Refunded. Default is Live. The labels are the same
        nine words the till, kitchen display and guest app use.'
      source: guest on BO-020 F&B Order Management
      ref: MATRIX 4.6.35 | MATRIX 5.1.11 | contracts/satellite/fnb.yaml#/components/schemas/FnbOrderStatus
      formats:
      - multi-select list (derived from the BO-020 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Table (filter)
      screen: BO-020
      validation: Replaces the "Table visit id" text field. A picker of the outlet's open tables by label (T12), resolved
        to the visit behind it. Hidden for outlets that do not offer table service.
      source: guest on BO-020 F&B Order Management
      ref: contracts/satellite/fnb.yaml#listFnbOrders | DI-319
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Cancel reason
      screen: BO-020
      limits:
      - max 300 characters
      validation: 'Required. The contract''s cancel list, labelled for staff: Outlet refused (outletRefused), Guest
        cancelled (guestCancelled), Item unavailable (itemUnavailable), Taking too long (tooLong), Entered in error
        (error). Note optional, max 300 characters. "Record waste" toggle appears only when the order is Accepted
        (the kitchen may have started) and defaults off; it raises a waste movement instead of losing the cost.'
      source: guest on BO-020 F&B Order Management
      ref: contracts/satellite/fnb.yaml#cancelFnbOrder | R125
      formats:
      - text field (derived)
    - name: Accept order — estimated ready time
      screen: BO-020
      validation: 'Optional time picker, prefilled from the outlet''s delivery policy: now + ASAP collection minutes
        (default 25) for collection, now + ASAP delivery minutes (default 45) for delivery. Station is optional and
        defaults to the outlet''s routing rules; recordedAt is device time and never shown.'
      source: guest on BO-020 F&B Order Management
      ref: contracts/satellite/fnb.yaml#acceptFnbOrder | contracts/satellite/fnb.yaml#/components/schemas/FnbDeliveryPolicy
      formats:
      - time picker (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Move to top — reason
      screen: BO-020
      limits:
      - 500 characters
      validation: 'Reason required, 3 to 500 characters. Position is not asked by default: leaving it empty puts the
        ticket at the top of the rail. An optional "place at" (1–100) sits behind a secondary control.'
      source: guest on BO-020 F&B Order Management
      ref: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | R125 | MATRIX 4.6.34
      formats:
      - text field (derived)
    - name: Amend order — lines
      screen: BO-020
      validation: Only lines the kitchen has not started can be removed or changed; lines In preparation or later
        are shown locked with "Already with the kitchen — void instead". Added lines follow the same modifier rules
        as the till. Online only.
      source: guest on BO-020 F&B Order Management
      ref: contracts/satellite/fnb.yaml#amendFnbOrder | R125
      formats:
      - form field (derived)
      limits:
      - Only lines the kitchen has not started can be removed o (derived)
    - name: Search
      screen: BO-021
      validation: One box that accepts an order number (AQP-104582) or a receipt number, exact match; results list
        below. Returns in r1 are found by receipt or order number only, so the same identifiers must work here.
      source: guest on BO-021 Order Search
      ref: R139 | R152 | contracts/satellite/retail.yaml#lookupRetailSale
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Hand-over outcome
      screen: BO-021
      limits:
      - max 500
      validation: 'Offer only the outcome that closes this order''s type: Dine-in closes Served; Quick service and
        Takeaway close Collected; Delivery and Room service close Delivered and require the delivery location (prefilled
        from the order). "Guest not found" and "Refused" are always available and make the note required (max 500).'
      source: guest on BO-021 Order Search
      ref: R125 | contracts/satellite/fnb.yaml#recordOrderHandover
      formats:
      - text field (derived)
    processing:
    - operation: fnb#claimLocationSession
      what: Tell the platform where the guest is
      steps:
      - 1
      block_a: true
      writes: true
    - operation: fnb#getGuestMenu
      what: The menu a guest sees
      steps:
      - 2
      block_a: true
    - operation: fnb#createGuestFnbOrder
      what: A guest orders food
      steps:
      - 3
      block_a: true
      writes: true
    - operation: orders#createPayment
      what: Take a payment against an order
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#acceptFnbOrder
      what: The outlet takes the order
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#setKitchenTicketStatus
      what: Advance a kitchen ticket
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#getGuestOrderStatus
      what: Track an order
      steps:
      - 6
      block_a: true
    - operation: fnb#recordOrderHandover
      what: Record that an order reached the guest
      steps:
      - 7
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Delivered to the lounger
        deferred: Held at the outlet for collection
        abandoned: Cancelled before acceptance and refunded
      failure_branches:
      - at_step: 1
        what_goes_wrong: QR is damaged or unreadable
        user_sees: Manual location entry by lounger number. Every location has a human-readable code for this reason.
        recovery: recoverable; resolved by Guest (not in contracts)
      - at_step: 1
        what_goes_wrong: Location session expired
        user_sees: Re-scan. Sessions expire so that yesterday's guest cannot order to today's lounger.
        recovery: recoverable; resolved by Guest (not in contracts)
      - at_step: 3
        what_goes_wrong: The outlet is inside the venue and the guest holds no admission ticket for today
        user_sees: 'Refused before anything is held (decided 2 October 2026, Chinmay: "Inside the venue, a ticket
          is needed. A restaurant outside the venue (standalone) can sell without one"; DEC-070, DI-292 amended; CHG-CSA-011,
          CHG-CSP-004). `createGuestFnbOrder` answers `403 entry-ticket-required` and the screen offers the ticket
          purchase rather than an error. A standalone outlet takes the order with no ticket.'
        recovery: recoverable; resolved by Guest (not in contracts)
      - at_step: 5
        what_goes_wrong: Outlet refuses the order
        user_sees: Past last orders, out of an ingredient, too far behind. Refused immediately rather than after ten
          minutes — `cancelFnbOrder` before acceptance needs no approval for exactly this.
        recovery: recoverable; resolved by Automatic, guest refunded (not in contracts)
      - at_step: 5
        what_goes_wrong: Item unavailable after acceptance
        user_sees: Partial cancellation with a refund for the line. The rest is prepared.
        recovery: requiresStaff; resolved by Outlet (not in contracts)
      - at_step: 7
        what_goes_wrong: Runner cannot find the guest
        user_sees: The guest moved. The order is held at the outlet and the guest is notified to collect — not thrown
          away and not left in the sun.
        recovery: requiresStaff; resolved by Runner (not in contracts)
      - at_step: 6
        what_goes_wrong: Guest loses signal mid-order
        user_sees: The order is already placed. Status updates resume on reconnect, and the food arrives regardless.
        recovery: recoverable; resolved by Automatic (not in contracts)
      - at_step: 4
        what_goes_wrong: Payment unresolved
        user_sees: Held, inquired, and the kitchen is not told until it resolves. Preparing food against a payment
          that may not exist is a loss nobody records.
        recovery: recoverable; resolved by Automatic (not in contracts)
    - screen: GST-024
      name: F&B – Browse & Order
      shows:
      - element: Outlets, menu, sold out, allergens, prices, basket
        rule: As WEB-036. Only outlets open now. Wait estimate only when reported. Sections in the outlet's order,
          with the menu's end time. Sold-out dishes greyed with "Sold out" and never hidden. Allergens on every dish
          card and never omitted. Money at the menu's currency scale. Basket lines list their …
      - element: Ordering-to banner
        rule: Once a location is claimed, a persistent strip shows "Ordering to Lounger B-14 · Pool Bar" with "Change".
          The session's expiry is not shown as a countdown; the guest is asked to rescan only when it has expired.
      - element: Order placed
        rule: Large order number, destination or collection point, and ready time; then GST-025. A push and the in-venue
          notifications feed (GST-030) carry later status changes.
      - element: Payment and receipt
        rule: The F&B order keeps its own payment step and its own receipt; it never joins the ticket cart's one receipt
          (DI-293 does not apply to F&B).
      states:
        loading: The browse order list.
        error: Could not load. Names which read failed and leaves the browse order untouched.
        emptyFirstRun: No outlet takes orders here now. Names when the next one opens; a counter-only outlet's menu
          can still be read.
        emptyNoResults: 'No outlet open now matches: says so, with the next opening time.'
        emptyNoAccess: 'There is no permission to name — a guest holds none (ADR-0025: `x-ticvai-permission` is what
          a staff caller must hold; a guest call resolves to the guest''s own data; decided by …'
        offline: The offline banner shows. The menu already loaded stays with its age. Ordering, claiming a table
          and booking wait for the connection — an order placed offline is food nobody is …
      failure_branches:
      - screen: GST-024
        what_goes_wrong: Every refusal (sold out mid-order, price changed, session expired, not serviceable, below
          minimum, outside area, slot filled, payment declined)
        user_sees: Same messages and recovery as WEB-036. The basket is always kept; one cause is named, and one way
          on is offered.
      - screen: GST-024
        what_goes_wrong: Opened from a virtual-queue wait (F48)
        user_sees: The queue place stays visible as a small strip, so the guest knows ordering does not lose it.
      - screen: GST-024
        what_goes_wrong: The guest loses signal after ordering
        user_sees: The order is already placed; the confirmation stays and status resumes on reconnect.
      - screen: GST-024
        what_goes_wrong: The F&B module is off for the venue
        user_sees: No food entry appears in the app at all, rather than an empty screen. An empty state appears only
          when the module is on and nothing is open, and then it names the next opening time.
    - screen: GST-009
      name: Review & Payment
      shows:
      - element: currency
        rule: Charged in the selected currency where the venue charges it, with the AED amount and the locked rate
          beneath; a shown-only currency shows "approx." and the charged AED amount before paying (decided 2 October
          2026).
      states:
        loading: The review payment, read by `getCart`.
        error: Could not load. Names which read failed and leaves the review payment untouched.
        emptyFirstRun: No review payment yet. Offers Create payment (`createPayment`).
        emptyNoAccess: 'There is no permission to name — a guest holds none (ADR-0025: `x-ticvai-permission` is what
          a staff caller must hold; a guest call resolves to the guest''s own data; decided by …'
        offline: Not available, and the offline banner says why. A payment needs the gateway, and pretending otherwise
          takes money nobody can confirm. What was typed stays on screen so nothing is …
      failure_branches:
      - screen: GST-009
        what_goes_wrong: Offline
        user_sees: Payment unavailable with the reason; the basket is kept on the device.
    - screen: BO-020
      name: F&B Order Management
      shows:
      - element: Order list columns
        rule: Order number (venue prefix + sequence, e.g. AQP-104582), Outlet, Order type, Table or location, Status
          badge, Items, Total (AED, 2 decimals, VAT-inclusive with "incl. VAT" in the detail), Placed (time since,
          GST), Estimated ready. No ids, no kitchenTicketId, no recordedAt/syncedAt columns.
      - element: Order type label
        rule: 'Maps ServiceMode to the till''s words: tableService = Dine-in, quickService = Quick service, collection
          = Takeaway, delivery = Delivery, roomService = Room service. Never "Service mode".'
      - element: Selected order detail
        rule: Lines with modifiers and line notes; one kitchen ticket per preparation station with its own status
          (an order at the grill and the bar has two); a timeline of status changes; the sales order it fulfils as
          a link to Order Detail for payment and refund. A ticket moved up shows "Moved to top by Omar …
      - element: Not yet synced marker
        rule: An order whose syncedAt is empty came from a till that was offline; show "From an offline till — not
          yet synced" so a supervisor does not act on a stale status.
      states:
        loading: The order list.
        error: Could not load. Names which read failed and leaves the order untouched.
        emptyFirstRun: No order yet. Offers no create action — this screen declares no operation that makes one; distinct
          from a filter that matched nothing.
        emptyNoResults: Nothing matches the filter on outletId, tableVisitId, status and the order are still there.
          Names the active filter and offers to clear it.
        emptyNoAccess: You don't have access to F&B orders — ask your venue manager. Permission keys are never shown
          to the user; the screen names the access in words. Never an empty table — that reads …
      failure_branches:
      - screen: BO-020
        what_goes_wrong: An order with lines at several stations
        user_sees: Each station's ticket has its own status; the order is Ready only when every ticket is.
      - screen: BO-020
        what_goes_wrong: A tracked item ordered on an offline till and stock ran out meanwhile
        user_sees: The replayed order is refused (trackedItemOffline); show it as an exception on the order with the
          line named, not a silent disappearance.
      - screen: BO-020
        what_goes_wrong: Item unavailable after acceptance
        user_sees: Partial cancellation of that line with a refund; the rest is prepared.
      - screen: BO-020
        what_goes_wrong: Someone else changed the order while it was open (412)
        user_sees: Re-read the order and show what changed before the amend can be retried.
      - screen: BO-020
        what_goes_wrong: Guest not found or refused at handover
        user_sees: The order stays Ready with the attempt recorded; it is not closed or cancelled.
    - screen: GST-025
      name: F&B – Order Tracking
      shows:
      - element: Status steps, pickup card, ready time, per-dish status, table bill
        rule: As WEB-038. The steps adapt to collection, delivery to a location, or a table. "Ready to collect at
          Hatch 3" comes with the order number very large. The time is a clock time from the kitchen's estimate, never
          a guess.
      - element: Notifications
        rule: '"Ready" and "On its way" also arrive as a push and in GST-030, which is back in the first release.'
      states:
        loading: Loading the order.
        error: Availability unavailable. Selection is blocked — overselling is worse than waiting
        emptyFirstRun: 'The order is not found or was refunded (a cold link): says which, with the way back to ordering.'
        offline: The offline banner shows. The last status stays with its age ("Preparing, 2 min ago"); nothing refreshes
          until the connection returns.
      failure_branches:
      - screen: GST-025
        what_goes_wrong: Runner cannot find the guest; refused before acceptance; one dish cancelled; signal lost;
          old link
        user_sees: As WEB-038.
    - screen: BO-021
      name: Order Search
      shows:
      - element: Order status
        rule: The nine-state status as a stepper (Ordered, Accepted, In preparation, Ready, then Served / Collected
          / Delivered), with each line's kitchen status, because a guest waiting on one dish should see which. Estimated
          ready time shown; "Ready for collection" emphasised.
      states:
        loading: The order search, read by `listFnbOrders`.
        error: Could not load. Names which read failed and leaves the order search untouched.
        emptyFirstRun: No order search yet. Offers Record order handover (`recordOrderHandover`).
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listFnbOrders` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* …
      failure_branches:
      - screen: BO-021
        what_goes_wrong: Runner cannot find the guest
        user_sees: Record "Guest not found" with a note; the order stays Ready, held at the outlet, guest notified
          to collect.
      - screen: BO-021
        what_goes_wrong: Tenant without the retail or F&B licence
        user_sees: The search covers only licensed modules; the screen does not offer a module it cannot open.
    steps:
    - frame: 1
      screen: GST-024
      screen_name: F&B – Browse & Order
      block_a: true
      user_sees: The app's in-venue food ordering.
      user_does: Scans the QR on the lounger
      operations:
      - fnb#claimLocationSession
      result: The platform knows where they are. Codes rotate, so a photographed QR does not order to someone else's
        seat next week
    - frame: 2
      screen: GST-024
      screen_name: F&B – Browse & Order
      block_a: true
      user_sees: The app's in-venue food ordering.
      user_does: Browses the menu
      operations:
      - fnb#getGuestMenu
      result: Allergens are always present — 4.8.9
    - frame: 3
      screen: GST-024
      screen_name: F&B – Browse & Order
      block_a: true
      user_sees: The app's in-venue food ordering.
      user_does: Builds an order
      operations:
      - fnb#createGuestFnbOrder
      result: Priced with any membership benefit applied
    - frame: 4
      screen: GST-009
      screen_name: Review & Payment
      block_a: true
      user_sees: Review and pay in the app.
      user_does: Pays for the food order on its own
      operations:
      - orders#createPayment
      result: 'Card or wallet. The F&B order keeps its own payment step and its own receipt (decided 2 October 2026,
        Chinmay: "F&B has its own receipt"; DEC-052, CHG-CSA-011). It does not go through the shared cart (`addCartLine`,
        `checkoutCart`), and DI-293''s one cart, one receipt does not apply to F&B: a guest who bought tickets earlier
        gets a separate F&B receipt here.'
    - frame: 5
      screen: BO-020
      screen_name: F&B Order Management
      block_a: true
      user_sees: 'The back-office order desk for an outlet manager or F&B supervisor: every live F&B order across
        the outlets the user may see, in the nine-state lifecycle, with the few acts a back office legitimately takes
        on an order (accept or refuse a …'
      user_does: Kitchen accepts and prepares
      operations:
      - fnb#acceptFnbOrder
      - fnb#setKitchenTicketStatus
      result: A ticket appears at the right station
    - frame: 6
      screen: GST-025
      screen_name: F&B – Order Tracking
      block_a: true
      user_sees: 'App order tracking, functionally identical to WEB-038: the kitchen''s real status, a pickup card
        when it is ready, the per-dish state, and the table bill where the order is on a table visit.'
      user_does: Tracks the order
      operations:
      - fnb#getGuestOrderStatus
      result: Nine states, and the guest sees the ones that matter
    - frame: 7
      screen: BO-021
      screen_name: Order Search
      block_a: true
      user_sees: Staff look up any order at the venue by its number or receipt and see where it is — for a guest at
        the counter asking "where is my food?", a runner confirming a hand-over, or a supervisor checking a disputed
        sale.
      user_does: Runner delivers to the lounger
      operations:
      - fnb#recordOrderHandover
      result: Delivered, not merely served
    motion:
    - what: QR scan viewfinder
      how: Camera view with a framing square; on a read the square snaps green and the location chip ("Lounger B-14")
        drops into the header.
      timing: Snap 150 ms
    - what: Order tracking (GST-025)
      how: A progress line advances through the guest-facing states (received, preparing, on its way, delivered) as
        the status changes; the current step pulses.
      timing: Updates on poll/push of getGuestOrderStatus; pulse 1.2 s loop
    - what: Basket total
      how: Rolls to the new value as items are added or a membership benefit applies.
      timing: 150 ms
    decisions:
    - 'answers-2-oct-batch1.md L10: F&B keeps its own payment step and receipt (DI-293 one-receipt does not apply)'
    - 'ids in the flow: DEC-052, CHG-CSA-011, DEC-070, CHG-CSP-004'
    - 'GST-024: A guest F&B order keeps its own payment step and its own receipt (DI-293''s one receipt does not apply
      to F&B). (Chinmay 2026-10-02)'
    - 'BO-020: Drawn default stands (answer: "Default / recommended accepted"): Show Accept only on orders still in
      Ordered; no outlet setting is drawn (no contract field exists for "automatic where the outlet is configured").
      (Chinmay 2026-10-02)'
    - 'BO-020: Drawn default stands (answer: "Default / recommended accepted"): The outlet filter lists only outlets
      the user''s grants reach; no extra control. (Chinmay 2026-10-02)'
    - 'BO-021: Drawn default stands (answer: "Default / recommended accepted"): Draw it venue-wide with a module chip
      on each result; F&B results open the F&B status view. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L59: 19–25 | WEB-011, WEB-026, WEB-027, WEB-034, BO-020 (two), BO-021 | Recommended
      | Defaults.'
    sources:
    - flows/F11-guest-orders-food-to-a-lounger.yaml
    - DI-293
    - DI-292
    - DI-1091
    - DI-288
