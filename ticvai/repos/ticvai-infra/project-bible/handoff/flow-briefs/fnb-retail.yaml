        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listOrders` requires to show this screen,
          and names that permission (the screen's other reads need `SHIFT_OPEN` and say so in …
        offline: Working from the local journal. The till keeps taking money; this reconciles on sync.
      failure_branches:
      - screen: POS-012
        what_goes_wrong: The order is not ready yet, or already closed
        user_sees: Refused with its current state.
      - screen: POS-012
        what_goes_wrong: Merchandise out of stock at this counter
        user_sees: Names the short lines; offer another store.
    steps:
