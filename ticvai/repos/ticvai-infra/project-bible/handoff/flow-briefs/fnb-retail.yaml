        emptyFirstRun: No tickets. The kitchen is clear, and that is worth saying plainly rather than showing a blank
          rail — a screen that looks broken and a screen that means nothing to do are the same …
        emptyNoResults: Nothing matches the station chips; the kitchen is not empty.
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, the screen's permission, and names it. The command
          centre is not tied to one station, so it never says "not assigned to a station".
        offline: Amber, and it keeps working. The kitchen still has to send food out — a display that blanks mid-service
