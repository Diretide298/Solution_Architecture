    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: The chain ran as the client drew it.
        stoppedAtModule: A licence boundary, not a failure.
      failure_branches:
      - at_step: 1
        what_goes_wrong: A step in the chain is not licensed for this tenant.
        user_sees: The chain stops at the module boundary. `requiresModule` on each screen decides — a tenant without
          the retail licence does not see the retail half, and the journey is shorter rather than broken.
        recovery: medium; resolved by white-label#getModuleEnablement
    - screen: POS-011
      name: Returns, Refunds & Exchanges
      shows:
      - element: The sale
        rule: Receipt number, date, outlet, lines with price paid, discount, VAT, already-returned quantities, tenders
          used (card shown masked, last four digits).
      - element: Policy panel
        rule: Window in days, receipt required, cash-on-card allowed, the three limits (self-authorise, second user,
          approval) in plain words.
      - element: Refund summary
        rule: Original amount and VAT, refunded amount and VAT, to which tender; prints a refund receipt; a credit
          note is issued where a tax invoice existed.
      states:
        loading: The returns refunds exchanges list.
        error: Could not load. Names which read failed and leaves the returns refunds exchanges untouched.
        emptyFirstRun: No returns refunds exchanges yet. Offers Create refund (`createRefund`); distinct from a filter
          that matched nothing.
        emptyNoResults: Nothing matches the filter on includeInactive and the returns refunds exchanges are still
          there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listSerialisedItems` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
        offline: Refunds and returns are refused offline (F58 step 8; design-notes correction fnb-retail POS-011).
          The till keeps selling from the local journal; a refund needs the original sale …
      failure_branches:
      - screen: POS-011
        what_goes_wrong: The till is offline
        user_sees: Refunds and returns are refused offline; the guest is directed to a connected till or the service
          desk.
      - screen: POS-011
        what_goes_wrong: No receipt
        user_sees: Order number only; with neither, the policy decides whether a no-receipt return is allowed.
      - screen: POS-011
        what_goes_wrong: Return of a kit or bundle
        user_sees: The bundle's components are reversed together.
    - screen: POS-013
      name: Mobile POS, Event Sales & Offline Operations
      shows:
      - element: Status
        rule: Online · Offline since 14:02 · Syncing 12 of 40 — always visible in the top bar; offline shown as a
          clear mode indicator.
      - element: Offline sales
        rule: While offline, the transaction view shows only sales completed locally in this offline period, with
          their local receipt numbers (from the till's reserved range).
      - element: Refused on replay
        rule: Entries the server refused (stock ran out, a lease expired, a stale catalogue), each with the reason
          and who must resolve it; the rest of the batch continued.
      states:
        loading: The mobile pos event list.
        error: Could not load. Names which read failed and leaves the mobile pos event untouched.
        emptyFirstRun: No mobile pos event yet. Offers Create order (`createOrder`).
        emptyNoResults: 'Never shown: nothing on this screen filters its list, so an empty list is always the first-run
          state above.'
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listSyncRejections` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
        offline: Working from the local journal. The till keeps taking money; this reconciles on sync.
        denied: The sync queue is readable by anyone on shift. Resolving a conflict changes stock and needs `inventory.conflict.resolve`;
          a supervisor PIN unlocks it in place.
      failure_branches:
      - screen: POS-013
        what_goes_wrong: Price changed between the till's catalogue and the server
        user_sees: Accepted at the quoted price; the variance goes to finance and nothing is shown to the cashier.
      - screen: POS-013
        what_goes_wrong: Capacity products while offline
        user_sees: Blocked with a clear message; non-capacity products stay sellable.
    - screen: POS-012
      see: fnb-retail#F60
      note: outputs of this screen are detailed once, in that flow
    - screen: POS-007
      see: platform-foundation#F32
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: POS-011
      screen_name: Returns, Refunds & Exchanges
      block_a: true
      user_sees: 'Returns, refunds and exchanges at the till: the cashier finds the sale from the receipt, the policy
        is checked before the goods are taken back, then a merchandise return (with the item''s condition), a refund
        to the original tender, or an …'
      user_does: Returns, Refunds & Exchanges.
      operations:
      - inventory#listSerialisedItems
      result: Drawn by the client as POS-2B. 1 operations on this step.
    - frame: 2
      screen: POS-012
      screen_name: Omnichannel Order & Fulfilment Center
      block_a: true
      user_sees: 'Orders that did not start at this counter, fulfilled here: an online or app order collected at the
        counter (food, merchandise, Shop & Drop) and takeaway and delivery orders.'
      user_does: Omnichannel Order & Fulfilment Center.
      operations:
      - shift#getCurrentShift
      - orders#listOrders
      result: Drawn by the client as POS-2C. 4 operations on this step.
      crosses_device: true
    - frame: 3
      screen: POS-013
      screen_name: Mobile POS, Event Sales & Offline Operations
      block_a: true
      user_sees: 'The till''s offline picture: whether it is online, what it sold while offline and has not yet synced,
        and the entries the server refused on replay that need a supervisor.'
      user_does: Mobile POS, Event Sales & Offline Operations.
      operations:
      - orders#createOrder
      result: Drawn by the client as POS-2D. 4 operations on this step.
      crosses_device: true
    - frame: 4
      screen: POS-007
      screen_name: Close Shift
      block_a: true
      user_sees: 'The end of a cashier''s shift: count the drawer blind, declare non-cash totals, give a reason if
        the count is off, and close.'
      user_does: Close Shift.
      operations:
      - shift#submitShiftCount
      result: Drawn by the client as POS-2E. 4 operations on this step.
      crosses_device: true
    motion:
    - none (form screens; the only movement is the saved state and the offline banner)
    decisions:
