  F85:
    title: Production is planned, costed and released
    process: fnb-retail
    block_a:
      screens:
      - BO-112
      - BO-008
      - BO-007
      - BO-045
      operations:
      - fnb#buildProductionPlan
      - fnb#createMenu
      - retail#createMerchandise
      - catalogue#getProduct
      - catalogue#listProductVariants
      - fnb#releaseProductionPlan
      - fnb#setMenuSections
      - catalogue#updateProduct
      - fnb#verifyAllergens
      screens_outside_block_a:
      - BO-137
    trigger:
      description: A central kitchen decides what to make tomorrow.
    actors:
      roles:
      - supervisor
      apps:
      - Venue Management (P08)
    offline: Planning needs the network. A forecast is not a local computation.
    inputs:
    - name: Kitchen and day
      screen: BO-112
      validation: Outlet (kitchen) picker and the trading day (default tomorrow), a date in the Region's time zone.
      source: supervisor on BO-112 Production Planning & Production Sheets
      ref: contracts/satellite/fnb.yaml#/components/schemas/ProductionPlan
      formats:
      - date picker (derived)
      limits:
      - a valid date in the venue time zone (derived)
    - name: Plan line
      screen: BO-112
      validation: Item, suggested quantity (read-only, from the forecast), planned quantity (editable), unit, station.
        Editing planned does not overwrite suggested.
      source: supervisor on BO-112 Production Planning & Production Sheets
      ref: contracts/satellite/fnb.yaml#buildProductionPlan
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Direct run (outside a plan)
      screen: BO-112
      validation: Recipe by name, planned quantity with its unit, where it is made, which outlets it is for, when.
        No id, status, actual quantity or variance fields at planning time.
      source: supervisor on BO-112 Production Planning & Production Sheets
      ref: contracts/satellite/fnb.yaml#planProductionRun
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: attributes (setProductAttributes)
      screen: BO-008
      limits:
      - minimum 15
      validation: 'An attribute editor (Guest category: Adult, Child, Senior; Residency: Resident, Non-resident) that
        previews the ticket types it will generate before saving ("6 ticket types: 2 new, 1 retired"). Retired ticket
        types are never deleted because orders point at them. A time-window product sells by length: a Length attribute
        whose values carry minutes (60, 120, 240, 480; minimum 15), one per product.'
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/spine/catalogue.yaml#setProductAttributes | REV3-13 | DI-164 | DI-450
      formats:
      - number field (derived)
    - name: ticket type description
      screen: BO-008
      limits:
      - At most 300 characters per language
      validation: At most 300 characters per language; it is the text behind the (i) on the guest's ticket-type row
        when the booking flow shows card info. Setting "default" on one clears it on the others, so it is a radio
        across the ticket-type list, not a checkbox per row.
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/spine/catalogue.yaml#updateProductVariant
      formats:
      - text field (derived)
    - name: guestListing and notBookableLabel
      screen: BO-008
      limits:
      - at least one
      validation: 'Three options with their consequence written under each: Bookable (listed and added to the basket),
        Information only (listed with details and the not-bookable label, never added to a basket), Hidden (staff
        channels only). The not-bookable label and the sales contact (phone or email, at least one) appear only for
        Information only.'
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/spine/catalogue.yaml#/components/schemas/GuestListing | REV3-14
      formats:
      - form field (derived)
    - name: displayTags
      screen: BO-008
      limits:
      - At most six tags
      - at most 40 characters per language
      validation: At most six tags; each picks an icon kind (clock, height, free, calendar, id) and a label of at
        most 40 characters per language.
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/spine/catalogue.yaml#/components/schemas/ProductDisplayTag
      formats:
      - text field (derived)
    - name: media
      screen: BO-008
      validation: Picked from the asset library (ready assets only), exactly one primary, drag to order; alt text
        per language.
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/spine/catalogue.yaml#/components/schemas/ProductMedia
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: consentQuestionIds and dataMaskValues
      screen: BO-008
      validation: Consent questions are chosen from the venue's list (Are you able to swim?) and are not free text
        here; the data mask is the venue's custom fields (text, dropdown, radio, yes/no) with per-language labels
        and validation. Both decide what the guest is asked at booking.
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/satellite/marketing-crm.yaml#listConsentQuestions | REV3-26 | DI-155 | DI-434
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: bookingFlowId
      screen: BO-008
      validation: Optional; empty means the category's flow, then the venue's flow for this kind. Show which flow
        will actually apply.
      source: supervisor on BO-008 Product Detail & Variants
      ref: contracts/spine/catalogue.yaml#createProduct
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - screen: BO-007
      see: fnb-retail#F78
      note: inputs of this screen are detailed once, in that flow
    - screen: BO-045
      see: fnb-retail#F31
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: fnb#buildProductionPlan
      what: Turn a forecast into a prep list
      steps:
      - 1
      block_a: true
      writes: true
    - operation: fnb#listProductionRuns
      what: What is being made, and what was
      steps:
      - 1
      - 2
      block_a: false
      offline_capable: true
    - operation: fnb#releaseProductionPlan
      what: Make the plan real
      steps:
      - 1
      block_a: true
      writes: true
    - operation: fnb#getProductionRun
      what: One run — its plan, its output, and the gap
      steps:
      - 2
      block_a: false
      offline_capable: true
    - operation: catalogue#getProduct
      what: Read a product
      steps:
      - 3
      - 4
      block_a: true
      offline_capable: true
    - operation: catalogue#listProductVariants
      what: List generated variants
      steps:
      - 3
      block_a: true
      offline_capable: true
    - operation: catalogue#setProductAttributes
      what: Set the attribute axes for a product
      steps:
      - 3
      block_a: false
      writes: true
    - operation: catalogue#updateProduct
      what: Update a product
      steps:
      - 3
      block_a: true
      writes: true
    - operation: catalogue#bulkUpdateCatalogueProducts
      what: Change many products at once, with a preview
      steps:
      - 4
      block_a: false
      writes: true
    - operation: retail#createMerchandise
      what: Create a merchandise item
      steps:
      - 4
      block_a: true
      writes: true
    - operation: catalogue#createProduct
      what: Create a product
      steps:
      - 4
      block_a: false
      writes: true
    - operation: fnb#createMenu
      what: Create a menu
      steps:
      - 5
      block_a: true
      writes: true
    - operation: fnb#setMenuSections
      what: Set menu sections and their item ordering
      steps:
      - 5
      block_a: true
      writes: true
    - operation: fnb#verifyAllergens
      what: Does this dish still match its claim?
      steps:
      - 5
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: The chain ran as the client drew it.
        stoppedAtModule: A licence boundary, not a failure.
      failure_branches:
      - at_step: 1
        what_goes_wrong: A step in the chain is not licensed for this tenant.
        user_sees: The chain stops at the module boundary. `requiresModule` on each screen decides — a tenant without
          the retail licence does not see the retail half, and the journey is shorter rather than broken.
        recovery: medium; resolved by white-label#getModuleEnablement
    - screen: BO-112
      name: Production Planning & Production Sheets
      shows:
      - element: Plan grid
        rule: Grouped by station (Grill, Cold, Pastry) with forecast covers in the header, on-hand beside to-make,
          and start times; total prep hours when known.
      - element: Forecast badge
        rule: The suggestion's maturity stage and basis in plain words ("Baseline from last 4 weeks - starting") and
          its explanation; never a confidence number for a rule-based answer.
      - element: Prep sheet
        rule: One printable sheet per station for the day, listing items, quantities and start times (what releasing
          produces). Printed from a print template, to the kitchen printer or the browser.
      states:
        loading: The saved production planning production.
        error: Could not load. Names which read failed and leaves the production planning production untouched.
        emptyFirstRun: No production planning production configured. The form opens empty and `planProductionRun`
          saves the first one; it says what the platform does in the meantime.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listProductionRuns` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
      failure_branches:
      - screen: BO-112
        what_goes_wrong: A setting the forecast needs is missing
        user_sees: The forecast is refused and the message names the setting and the screen that sets it; the plan
          can still be built by hand.
      - screen: BO-112
        what_goes_wrong: Little or no sales history
        user_sees: The forecast still answers from the baseline with stage "starting"; do not show an error.
      - screen: BO-112
        what_goes_wrong: Yesterday's draft never released
        user_sees: It does not appear in today's prep list; it reads Draft for its own day and can be superseded or
          cancelled.
    - screen: BO-008
      name: Product Detail & Variants
      shows:
      - element: change impact panel
        rule: 'Before Save on a product that has sold: tickets issued, orders affected, future performances, open
          carts, and whether the change propagates or is blocked (with the blocker named).'
      - element: preview before publish
        rule: 'The client wants the reviewer to see every output: the B2C card, the PDF ticket and the Apple / Google
          Wallet pass, side by side.'
      - element: version history
        rule: Versions newest first with who, when and what changed; Restore creates a new version and says so.
      states:
        loading: The product variants list.
        error: Could not load. Names which read failed and leaves the product variants untouched.
        emptyFirstRun: No product variants yet. Offers no create action — this screen declares no operation that makes
          one — and says so rather than showing an empty table.
        emptyNoResults: 'Never shown: `listProductVariants` takes no filter, so an empty list is always the first-run
          state above.'
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `getProduct` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* and …
      failure_branches:
      - screen: BO-008
        what_goes_wrong: Product opened at an old version from a link
        user_sees: Read-only, labelled "Version 7 of 9, not current", with a link to the current version.
      - screen: BO-008
        what_goes_wrong: Arabic name or description missing at publish
        user_sees: Publish warns and names the fields (PR-8).
    - screen: BO-007
      see: fnb-retail#F78
      note: outputs of this screen are detailed once, in that flow
    - screen: BO-045
      see: fnb-retail#F31
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: BO-112
      screen_name: Production Planning & Production Sheets
      block_a: true
      user_sees: 'Tomorrow''s prep list: a plan built from the demand forecast through the recipes into quantities
        per item and per station, edited by the chef, then released into production runs grouped by station - one
        printable prep sheet per station …'
      user_does: F&B Global Settings & Controls.
      operations:
      - fnb#buildProductionPlan
      - fnb#listProductionRuns
      - fnb#releaseProductionPlan
      result: Drawn by the client as FNB-2M. 3 operations on this step.
    - frame: 2
      screen: BO-137
      screen_name: Recipe Consumption & Theoretical Inventory
      block_a: false
      user_sees: 'What the recipes say should have been used against what the count found, per outlet and count period
        (FNB-5C, F30 step 8): theoretical, actual, variance %, its value, and the lines beyond the venue''s tolerance.'
      user_does: Recipe Consumption & Theoretical Inventory.
      operations:
      - fnb#getProductionRun
      - fnb#listProductionRuns
      result: Drawn by the client as FNB-2F. 2 operations on this step.
      crosses_device: true
    - frame: 3
      screen: BO-008
      screen_name: Product Detail & Variants
      block_a: true
      user_sees: 'The one product configuration the client asked for (DI-465, DI-466): identity and classification,
        ticket types, what the guest sees, entitlement, eligibility, policies, channels and versions of one product,
        organised as sections of one …'
      user_does: Product Detail & Variants.
      operations:
      - catalogue#getProduct
      - catalogue#listProductVariants
      - catalogue#setProductAttributes
      - catalogue#updateProduct
      result: Drawn by the client as FNB-2D. 4 operations on this step.
      crosses_device: true
    - frame: 4
      screen: BO-007
      screen_name: Product Directory
      block_a: true
      user_sees: 'The venue''s catalogue: every sellable product of every kind in one list, the entry point to product
        configuration (BO-008), pricing (BO-009), promotions (BO-010) and menus (BO-045).'
      user_does: Product Directory.
      operations:
      - catalogue#bulkUpdateCatalogueProducts
      - retail#createMerchandise
      - catalogue#createProduct
      - catalogue#getProduct
      result: Drawn by the client as FNB-2C. 4 operations on this step.
    - frame: 5
      screen: BO-045
      screen_name: Menu Management
      block_a: true
      user_sees: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what
        is a draft, what is scheduled, and the history a refund dispute asks about ("what were we charging at noon").'
      user_does: Menu Management.
      operations:
      - fnb#createMenu
      - fnb#setMenuSections
      - fnb#verifyAllergens
      result: Drawn by the client as FNB-2B. 3 operations on this step.
      crosses_device: true
    motion:
    - none (static configuration screens; the only change on screen is the saved/validation state)
    decisions:
    - 'answers-2-oct-batch1.md L165: prep sheet is a print template (kitchen printers and browser)'
    - 'answers-2-oct-batch1.md L166, L173: the commissary is an outlet that produces for others'
    - 'BO-112: Prep sheets print from a print template, to kitchen printers and the browser. (Chinmay 2026-10-02)'
    - 'BO-008: Drawn default accepted: Show identity, guest view, channels and versions for every kind; ticket types,
      entitlement, eligibility and policies for admission, timed, dated, open-dated, seated, membership and rental.
      (Chinmay 2026-10-02)'
    - 'BO-045: F&B prices are owned by F&B: the F&B service has its own catalogue table (prices migrated into F&B
      so ticketing scales in isolation); an outlet may set its own price. The central catalogue prices tickets and
      single-price booths. Fix the stale MenuItem …'
    - 'BO-045: Not answered by Chinmay: the workbook cell repeats the superseded first BO-045 price answer. The question
      (R197 escalation of menu publish/rollback) takes its drawn default. (Chinmay 2026-10-02)'
    - 'BO-045: Not answered by Chinmay: the workbook cell repeats the superseded first BO-045 price answer. The question
      (scheduled menu publish time of day) takes its drawn default. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L11: BO-045 | Who owns the F&B price — menu or catalogue? | Corrected by Chinmay: the
      split was deliberate, so the ticketing service can scale on its own. F&B prices were migrated into F&B, and
      the F&B service has its own catalogue …'
    - 'answers-2-oct-batch1.md L19: ADM-049 onward | Who uses the 410 workshop-pack screens on the TICVAI console
      (370 Commercial, 20 Catalogue lifecycle, 20 Rules and workflow)? | They are venue screens. | Move them to Venue
      Management (P08) and merge them with the …'
    - 'answers-2-oct-batch1.md L22: ## BO-045, corrected by Chinmay (2 October)'
    - 'answers-2-oct-batch1.md L34: - They configure the same records the venue edits in Venue Management (P08): BO-009
      price matrix, BO-010 promotions, BO-011 bundles, BO-008 product.'
    - 'answers-2-oct-batch1.md L35: - The question is whether TICVAI staff use them on the console, acting for a venue,
      or whether they belong in Venue Management, merged with BO-008 to BO-011.'
    - 'answers-2-oct-batch1.md L176: 191 | BO-137 | Is "probable cause" (re-fires logged, trim yield, breakage) wanted
      in r1, and from which data? | No cause column; link to waste and production for the period'
    - 'answers-2-oct-batch1.md L361: BO-007 bulk edit | A new catalogue operation | catalogue.bulkUpdateProducts is
      added; the inventory one is deprecated and retired at the next major version.'
