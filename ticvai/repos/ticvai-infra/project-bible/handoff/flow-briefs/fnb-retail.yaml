  F72:
    title: A shift ends and the summary is read
    process: fnb-retail
    block_a:
      screens: []
      operations:
      - shift#acceptShiftVariance
      - shift#getCurrentShift
      - shift#getShift
      - shift#listCashMovements
      - shift#listShifts
      - orders#listSyncRejections
      - shift#submitShiftCount
      - access#syncScans
      screens_outside_block_a:
      - EMP-008
      - EMP-017
      - EMP-009
    trigger:
      description: A shift is ending. The person who worked it and the person who reviews it want different things
        from the same screen.
    actors:
      roles:
      - supervisor
      apps:
      - Staff App (P06)
    offline: Reading works offline; closing does not. A shift closed against an unsynced journal is a variance that
      is not a variance.
    inputs: []
    processing:
    - operation: shift#getCurrentShift
      what: The open or suspended shift on the session's workstation
      steps:
      - 1
      block_a: true
      offline_capable: true
    - operation: shift#getShift
      what: Read a shift
      steps:
      - 1
      block_a: true
      offline_capable: true
    - operation: shift#listShifts
      what: List shifts
      steps:
      - 1
      block_a: true
    - operation: access#syncScans
      what: Replay scans recorded offline
      steps:
      - 2
      block_a: true
      writes: true
    - operation: orders#listSyncRejections
      what: Entries the server refused
      steps:
      - 2
      block_a: true
    - operation: shift#submitShiftCount
      what: The cashier's blind count, closing their own shift
      steps:
      - 3
      block_a: true
      writes: true
    - operation: shift#acceptShiftVariance
      what: Accept an over/short beyond the threshold
      steps:
      - 3
      block_a: true
      writes: true
    - operation: shift#listCashMovements
      what: Lifts, adds and the opening float
      steps:
      - 3
      block_a: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        closed: Synced, reviewed, closed.
        heldOpen: Unresolved rejections. Settlement waits.
      failure_branches:
      - at_step: 2
        what_goes_wrong: Transactions are still rejected after sync.
        user_sees: The shift stays open. F33 step 8 resolves them, and a shift closed over rejections has settled
          against a number that will change.
        recovery: high; resolved by orders#listSyncRejections
    steps:
    - frame: 1
      screen: EMP-008
      screen_name: Shift summary
      block_a: false
      user_sees: A read-only summary of what this person did on their shift, read before the shift is closed by someone
        else.
      user_does: The steward reads their shift summary.
      operations:
      - shift#getCurrentShift
      - shift#getShift
      - shift#listShifts
      result: Read-only. This screen could close the shift and accept a variance until 24 August — the person being
        reviewed could sign off their own review.
    - frame: 2
      screen: EMP-017
      screen_name: Sync & reconciliation
      block_a: false
      user_sees: 'Staff App sync and reconciliation: what was journalled offline (scans, and other offline work such
        as attendance and work orders) is posted, and the person learns which items the server rejected so a supervisor
        can close them.'
      user_does: Anything unsynced is pushed first.
      operations:
      - access#syncScans
      - orders#listSyncRejections
      result: Sync before close, always. F33 exits at `openWithUnsynced` for exactly this.
      crosses_device: true
    - frame: 3
      screen: EMP-009
      screen_name: End shift
      block_a: false
      user_sees: 'End the person''s shift cleanly: push anything unsynced, hand over what is still open, then close.'
      user_does: The cashier submits a blind count; beyond the threshold the supervisor accepts the variance (CHG-FIN-003).
      operations:
      - shift#submitShiftCount
      - shift#acceptShiftVariance
      - shift#listCashMovements
      result: Closing and accepting a variance are supervisor acts and now live only here.
      crosses_device: true
    motion:
    - what: Sync before close
      how: Progress bar "Sending 12 of 40" drains the queue; rejected items list below in the error colour.
      timing: Live
    decisions:
    - 'answers-2-oct-batch1.md L194: a server without a till gets a service summary (covers, tables, sales, tips)'
    - 'ids in the flow: CHG-FIN-003'
    - 'answers-2-oct-batch1.md L195: 200 | EMP-009 | Does a server on a handheld ever hold cash (a payment taken in
      cash at the table on EMP-059), and if so, against whose drawer? | No cash on handhelds; cash goes to a till'
    sources:
    - flows/F72-a-shift-ends-and-the-summary-is-read.yaml
    open:
    - none
    inputs_note: 'none: the Block A screens of this flow only read'
