  F18:
    title: A guest plays an arcade game
    process: fnb-retail
    owner_note: Entry screen GST-026 sits in the fnb-retail design notes, so the flow is filed here; the game-card
      screens (BO-395) are venue-operations vocabulary.
    block_a:
      screens:
      - POS-002
      - GST-011
      - BO-395
      operations:
      - games#getGameCard
      - games#issueGameCard
      - games#listGames
      - wallet#loadGameCredits
      - games#updateGame
      screens_outside_block_a: []
    trigger:
      description: A guest taps a game card on a machine and plays.
      entry_screen: GST-026
      entry_points:
      - Buying a card
      - Topping up
      - Tapping a machine
    actors:
      roles:
      - guest
      apps:
      - Guest App (P02)
      - Venue POS (P04)
      - Venue Management (P08)
    offline: The play is offline by necessity — a game machine reader cannot wait for a network. Credits are on the
      card and the play journals.
    inputs:
    - name: Game card
      formats:
      - RFID/NFC card tapped on a reader
      - card number typed or scanned at the till
      limits:
      - credit balance per card
      validation:
      - 'No credits: reader shows "No credit - top up at a till or in the app"'
      source: Guest at the machine; cashier on POS-002
    - name: product
      screen: POS-002
      formats:
      - BARCODE
      validation: Category tiles (Attractions, Cinema, Events, Passes, Vouchers) then cards from the workstation's
        sale board; search box for events, tickets and customers; barcode scan of a partner code resolves to its product.
      source: guest on POS-002 Sell — Ticket Catalogue
      ref: DI-781; DI-247; contracts/spine/catalogue.yaml#resolveProductByCode
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: ticket drawer
      screen: POS-002
      validation: 'Selecting a ticket opens a drawer: inclusions and rules first, then by product type: admission
        → quantities; dated → date; timed → date then session (POS-003 content); seated → date, session, zone, seats
        (POS-004 content). Add-ons are offered after the tickets, with the upsell prompt.'
      source: guest on POS-002 Sell — Ticket Catalogue
      ref: DI-094; DI-116; DI-130; DI-096
      formats:
      - form field (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: link to sale
      screen: POS-002
      validation: A search on the cart by mobile number (or email) finds or creates the guest inline; name alone is
        not a key. When the ticket is for someone else (a child's lesson), the holder's name and date of birth go
        on the ticket and the purchaser on the sale.
      source: guest on POS-002 Sell — Ticket Catalogue
      ref: DI-783; DI-784; DI-787
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: discount and promo code
      screen: POS-002
      formats:
      - PIN
      validation: Applied on the cart only (percentage, amount, promo code, staff code), never on the payment screen;
        a manual discount above the cashier's limit asks for a supervisor PIN.
      source: guest on POS-002 Sell — Ticket Catalogue
      ref: DI-786; F58 step 5; DI-324
      limits:
      - only (percentage (derived)
    - name: ticket note
      screen: POS-002
      validation: A short note per ticket line (e.g. "wheelchair user, needs lift access").
      source: guest on POS-002 Sell — Ticket Catalogue
      ref: DI-005
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: search
      screen: BO-395
      validation: Matches attraction name (English and Arabic) and code; code match ranks first.
      source: guest on BO-395 Game & Ride Directory
      ref: designer default
      formats:
      - search text (derived from the BO-395 layout)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: filters
      screen: BO-395
      validation: Seven filters from the pack as chips - Zone, Attraction type, Reader type, Wallet enabled, Redemption
        enabled, Status (Venue comes from the venue switcher). Type and Reader type are closed sets (Ride, Skill game,
        Video game, Redemption game; reader types add Balance check), never free text.
      source: guest on BO-395 Game & Ride Directory
      ref: screens/P08-venue-back-office.yaml#BO-396
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Clone dialog (code, name, includeReaders, includePricing)
      screen: BO-395
      limits:
      - max 64
      - max 200
      validation: Code required and unique in the venue (max 64), name required (max 200). "Copy pricing" ticked by
        default, "Copy reader settings" unticked by default with the help "Reader settings are copied but assigned
        to no reader until you assign one". Plays and history are never copied - say so.
      source: guest on BO-395 Game & Ride Directory
      ref: contracts/satellite/games.yaml#cloneGame
      formats:
      - text field (derived)
    processing:
    - operation: games#issueGameCard
      what: Issue or activate a game card
      steps:
      - 1
      block_a: true
      writes: true
    - operation: wallet#loadGameCredits
      what: Load credits onto a card
      steps:
      - 1
      block_a: true
      writes: true
    - operation: games#getGameCard
      what: Read a card's balances
      steps:
      - 2
      block_a: true
      offline_capable: true
    - operation: games#listGames
      what: List games
      steps:
      - 3
      - 4
      block_a: true
      offline_capable: true
    - operation: games#createGame
      what: Register a game
      steps:
      - 3
      block_a: true
      writes: true
    - operation: games#updateGame
      what: Amend a game
      steps:
      - 3
      - 4
      block_a: true
      writes: true
    - operation: games#cloneGame
      what: Copy a game or ride as a new one
      steps:
      - 3
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Played, credit consumed
        deferred: Journalled offline, pending sync
        escalated: Disputed play
      failure_branches:
      - at_step: 3
        what_goes_wrong: The card has no credits
        user_sees: Refused at the machine. Offline, so the machine must know the balance — which means the balance
          is on the card as well as the server, and they will disagree.
        recovery: recoverable; resolved by Guest (not in contracts)
      - at_step: 3
        what_goes_wrong: The card balance and the server disagree after sync
        user_sees: The card wins for plays already taken — the guest played, and reversing it is not possible. The
          difference is a reconciliation item.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
      - at_step: 4
        what_goes_wrong: The machine fails mid-play
        user_sees: A credit was taken and no play happened. Refund or replay is a policy nobody has stated, and it
          happens often enough to matter.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
      - at_step: 2
        what_goes_wrong: Guest loses the card
        user_sees: Credits are on the card. A lost card is lost money unless it is linked to a guest, which is the
          argument for requiring a profile.
        recovery: requiresStaff; resolved by Guest services (not in contracts)
    - screen: POS-002
      name: Sell — Ticket Catalogue
      shows:
      - element: cart
        rule: Persistent on the right; lines as on the web ("Aqua Park Day Pass · Adult × 2"); seats and the booking
          fee as separate lines; automatic offers struck through; tabs for parked carts and "+" for a new cart.
      - element: header
        rule: Tickets sold and revenue for this shift; online or offline mode always visible.
      - element: stock and capacity
        rule: In, Low, Out on cards; capacity products marked "Online only" when offline.
      states:
        loading: The sell ticket catalogue list.
        error: Could not load. Names which read failed and leaves the sell ticket catalogue untouched.
        emptyFirstRun: No sell ticket catalogue yet. Offers Create order (`createOrder`); distinct from a filter that
          matched nothing.
        emptyNoResults: Nothing matches the filter on venueId, kind, isSellable and the sell ticket catalogue are
          still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listProducts` requires to show this screen,
          and names that permission (the screen's other reads need `ORDER_VIEW`, `PRICE_VIEW`, …
        offline: Served from the local catalogue bundle (ADR-0013). One read path, always local — the terminal does
          not know whether it has a network.
        denied: The catalogue reads normally and Charge is refused without `payment.take`. The cart is held, not cleared,
          so a permitted operator can complete the same sale.
      failure_branches:
      - screen: POS-002
        what_goes_wrong: Offline
        user_sees: Sells from the local catalogue; general admission keeps selling; a capacity-bound product (seats,
          timed slots without a local lease) is blocked with a clear notice, never let through.
      - screen: POS-002
        what_goes_wrong: Timed slot past its on-screen window
        user_sees: The slot drops off once its "minutes on screen" after start have passed.
      - screen: POS-002
        what_goes_wrong: Dynamic-QR event sold at the till
        user_sees: The ticket is delivered by email or SMS with app instructions, not printed as a static QR.
    - screen: GST-011
      name: Wallet Overview
      shows:
      - element: balance and lots
        rule: Total, cash and bonus split, lots with expiry; spent nearest expiry first, never chosen by the guest.
      - element: family
        rule: Linked children with their allowance; a child's view has no Top up.
      states:
        loading: The wallet overview list.
        error: Could not load. Names which read failed and leaves the wallet overview untouched.
        emptyFirstRun: No wallet overview yet. Offers no create action — this screen declares no operation that makes
          one — and says so rather than showing an empty table.
        emptyNoResults: 'Never shown: `listWalletTransactions` takes no filter, so an empty list is always the first-run
          state above.'
        emptyNoAccess: 'There is no permission to name — a guest holds none (ADR-0025: `x-ticvai-permission` is what
          a staff caller must hold; a guest call resolves to the guest''s own data; decided by …'
        offline: The offline banner shows. Balances and stored cards already loaded stay visible with their age, cards
          masked. Storing a card and transferring value need the server.
      failure_branches:
      - what_goes_wrong: error state on GST-011
        user_sees: Could not load. Names which read failed and leaves the wallet overview untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on GST-011
        user_sees: 'There is no permission to name — a guest holds none (ADR-0025: `x-ticvai-permission` is what a
          staff caller must hold; a guest call resolves to the guest''s own data; decided by …'
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on GST-011
        user_sees: The offline banner shows. Balances and stored cards already loaded stay visible with their age,
          cards masked. Storing a card and transferring value need the server.
        recovery: Reconnect; the screen picks up where it was (derived)
    - screen: BO-395
      name: Game & Ride Directory
      shows:
      - element: Main grid
        rule: Columns per the pack - Code, Name, Type, Zone, Reader type, Wallet (Enabled / Disabled), Redemption
          (Earn / Spend / N/A), Status. Attraction ID is never a column (system id, shown only in the detail footer).
          Redemption is a three-value chip, not the text field the generator drew.
      - element: Status chip
        rule: Pack statuses Active / Inactive / Maintenance map to inService / outOfService / maintenance; retired
          rows are hidden by default behind a "Show retired" toggle.
      states:
        loading: The game ride configuration as saved.
        error: Could not load. Names which read failed and leaves the game ride untouched.
        emptyFirstRun: No game ride configured yet. Carries the create action and says what the platform does in the
          meantime.
        emptyNoResults: The filter narrowed it and the game ride are still there. Names the active filter and offers
          to clear it.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-395
        what_goes_wrong: Bulk machines of one kind
        user_sees: Clone allows a quantity with an auto-incremented code suffix (VR-RACE-02, -03) only if the contract
          allows it; until then one clone per action.
      - screen: BO-395
        what_goes_wrong: Directory with hundreds of machines
        user_sees: Reference list, normal paging allowed (per VO-R12), sticky header, type grouping optional.
    steps:
    - frame: 1
      screen: POS-002
      screen_name: Sell — Ticket Catalogue
      block_a: true
      user_sees: 'The cashier''s ticket sale: category tiles, product cards and a persistent cart, with date, time
        and seats in a slide-in drawer so the cashier never leaves the sell screen.'
      user_does: Buys or tops up a card
      operations:
      - games#issueGameCard
      - wallet#loadGameCredits
      result: Credits loaded
    - frame: 2
      screen: GST-011
      screen_name: Wallet Overview
      block_a: true
      user_sees: 'The guest''s wallet in the app: balance with expiry lots, transactions, auto top-up, family allowances,
        and the exit settlement where the venue uses it.'
      user_does: Checks the card's balance in the app's wallet
      operations:
      - games#getGameCard
      result: What is on the card
      crosses_device: true
    - frame: 3
      screen: BO-395
      screen_name: Game & Ride Directory
      block_a: true
      user_sees: The master catalogue of games and rides - the one list a games administrator searches, filters, creates,
        clones, activates and deactivates attractions from.
      user_does: Machine records the play
      operations: []
      result: Offline, journalled, synced later
      crosses_device: true
    - frame: 4
      screen: BO-395
      screen_name: Game & Ride Directory
      block_a: true
      user_sees: The master catalogue of games and rides - the one list a games administrator searches, filters, creates,
        clones, activates and deactivates attractions from.
      user_does: Machine goes out of service
      operations:
      - games#listGames
      - games#updateGame
      result: The asset cascade closes it
    motion:
    - what: Balance after top-up
      how: The card balance rolls up to the new value on POS-002 and in the app wallet (GST-011).
      timing: 300 ms
    decisions:
    - 'ids in the flow: CHG-WIR-001'
    - 'POS-002: Drawn default accepted: Refund, Check transaction, Print last receipt, plus search. (Chinmay 2026-10-02)'
    - 'BO-395: Drawn default accepted: Venue-scoped from the switcher, as listGames is. (Chinmay 2026-10-02)'
    sources:
    - flows/F18-a-guest-plays-an-arcade-game.yaml
    - DI-781
    - DI-247
    - DI-094
    - DI-116
    - DI-130
    - DI-096
    - DI-783
    - DI-784
    - DI-787
    - DI-786
    - DI-324
    - DI-005
    - DI-782
    - DI-174
    - DI-090
    - DI-072
    - DI-074
    - DI-012
    - DI-169
    - DI-634
    - DI-132
    - DI-088
    - DI-523
    - DI-529
    - DI-509
    - DI-519
    - DI-517
    - DI-039
    - handoff/design-notes (screens POS-002, GST-011, BO-395)
    open:
    - question: What happens when a machine fails mid-play. Refund, replay, or nothing — and it is frequent enough
        that not deciding is a decision.
      default: A failed play refunds that play's credits to the card on a logged staff action (no automatic replay);
        the machine goes out of service through the asset cascade.
    - question: Whether a game card must be linked to a guest profile. Unlinked is simpler and means a lost card is
        lost money.
      default: Linking a card to a guest profile is optional; an unlinked card works as a bearer card and cannot be
        recovered if lost.
  F28:
    title: A temperature excursion is caught and signed off
    process: fnb-retail
    block_a:
      screens:
      - EMP-067
      - BO-044
      operations:
      - fnb#getHaccpStatus
      - fnb#logTemperature
      - fnb#signCorrectiveAction
      screens_outside_block_a: []
    trigger:
      description: A scheduled check falls due, or a delivery arrives at the door. The platform raises the check;
        nobody remembers to.
    actors:
      roles:
      - storekeeper
      apps:
      - Staff App (P06)
      - Kitchen Display (P15)
      - Venue Management (P08)
    offline: Steps 1 to 4 work offline and must. A walk-in freezer is where the signal is worst and the readings matter
      most — a check nobody can record is a check nobody takes. Readings journal locally and sync on return. Signing
      is online only. A signature is a named act with legal weight, and one applied against a stale corrective action
      is a signature on the wrong finding.
    inputs:
    - name: Temperature reading
      formats:
      - number in °C, one decimal
      - probe or display reading typed on EMP-067
      limits:
      - the unit's safe range set on the check
      validation:
      - 'Out of range is kept, never refused: banner "Out of range - corrective action opened"'
      source: Storekeeper on EMP-067
    - name: Item and quantity
      screen: EMP-067
      validation: Scan or search, positive quantity, unit. Direction from the choice "Remove from stock" (waste, damage,
        loss) or "Add to stock" (found).
      source: storekeeper on EMP-067 Damage, Loss, Shrinkage & Stock Adjustment
      ref: R171 | contracts/satellite/inventory.yaml#createStockMovement
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Reason
      screen: EMP-067
      validation: From the venue's reason list (e.g. Spoilage, Breakage, Expired, Preparation error, Over-production,
        Theft suspected, Found), with a note required for Other.
      source: storekeeper on EMP-067 Damage, Loss, Shrinkage & Stock Adjustment
      ref: DI-363 | R222 | MATRIX 4.6.31
      formats:
      - pick list (select) (derived from the EMP-067 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Code and name
      screen: BO-044
      limits:
      - max 64
      - max 200
      validation: Code unique within the venue (max 64; 409 "Code already in use"); name max 200. Kind is fixed after
        creation (no edit field). The name is in English, plus the local-language name where the country requires
        it (Arabic in the UAE).
      source: storekeeper on BO-044 F&B Outlets
      ref: contracts/spine/tenancy.yaml#createOutlet | contracts/spine/tenancy.yaml#updateOutlet | decided 2 October
        2026 by Chinmay (CHG-NOTE-004)
      formats:
      - text field (derived)
    - name: Kind
      screen: BO-044
      validation: 'Under F&B: Restaurant, Bar, Café, Kiosk, Mobile. Under retail: Shop. Game floor and ticket office
        are not offered here.'
      source: storekeeper on BO-044 F&B Outlets
      ref: contracts/spine/tenancy.yaml#/components/schemas/OutletKind | DI-350
      formats:
      - multi-select list (derived from the BO-044 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Stock location and cost centre
      screen: BO-044
      validation: Pickers by name; a bar drawing from a central cellar points at the cellar.
      source: storekeeper on BO-044 F&B Outlets
      ref: contracts/spine/tenancy.yaml#/components/schemas/Outlet | DI-319
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Opening hours
      screen: BO-044
      validation: Weekly grid, several windows per day (lunch and dinner), local HH:MM in the region's time zone.
        Saving an empty grid clears the hours — confirm before saving.
      source: storekeeper on BO-044 F&B Outlets
      ref: contracts/spine/tenancy.yaml#/components/schemas/OpeningHoursWindow | contracts/spine/tenancy.yaml#updateOutlet
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Ordering and delivery
      screen: BO-044
      limits:
      - 20 min
      - 25 min
      - 45 min
      - 30 min
      validation: Collection on and delivery off by default; collection hold 20 min, ASAP collection 25 min, ASAP
        delivery 45 min, slot 30 min; minimum order, delivery fee and free-delivery threshold in AED; radius km and
        emirates served appear only when delivery is on; cutlery only on request (default on).
      source: storekeeper on BO-044 F&B Outlets
      ref: contracts/satellite/fnb.yaml#setFnbDeliveryPolicy
      formats:
      - form field (derived)
    - name: Floor plan
      screen: BO-044
      validation: Only for outlets offering table service. Table labels unique across the venue (T12 names one table);
        a capacity change is refused while a party is seated at that table.
      source: storekeeper on BO-044 F&B Outlets
      ref: contracts/satellite/fnb.yaml#setTableLayout | R108 | DI-319
      formats:
      - number field (derived)
      limits:
      - Only for outlets offering table service (derived)
    processing:
    - operation: fnb#getHaccpStatus
      what: Where this venue stands, right now
      steps:
      - 1
      - 6
      block_a: true
      offline_capable: true
    - operation: fnb#logTemperature
      what: Record a temperature check, in range or not
      steps:
      - 2
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#signCorrectiveAction
      what: Say what was done, and put a name to it
      steps:
      - 4
      - 5
      - 6
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        inRange: The reading was in range and nothing else happened. The common case, and the flow is written so it
          is two steps.
        signed: A finding was raised, actioned and signed by a named principal. The signature is the record.
        escalated: A critical finding signed by a supervisor rather than by the person who found it.
        rejectedAtDoor: A delivery refused with the reading that refused it — taken before the receipt was posted,
          because a claim against a supplier needs it.
      failure_branches:
      - at_step: 3
        what_goes_wrong: The severity is critical and the person who found it is the person on shift.
        user_sees: Escalated rather than signed. A supervisor signs what a cook should not, and the refusal is in
          the state model rather than in a policy document — `signCorrectiveAction` returns 409 with the escalation
          path named.
        recovery: high; resolved by fnb#signCorrectiveAction
      - at_step: 2
        what_goes_wrong: The check was not taken at all.
        user_sees: Recorded as `notTaken`. A check that did not happen is itself a finding — the alternative is a
          gap, and a gap and a clean log look identical to an inspector.
        recovery: medium; resolved by fnb#logTemperature
      - at_step: 1
        what_goes_wrong: A delivery arrives warm rather than a scheduled check falling due.
        user_sees: Enters at `EMP-065` through `logColdChain` instead. The reading is taken before the receipt is
          posted — once stock is received it has entered the kitchen, and a claim against a supplier needs the reading
          that refused it.
        recovery: medium; resolved by fnb#logColdChain
      - at_step: 5
        what_goes_wrong: The device is offline when they try to sign.
        user_sees: The action stays `actioned` and the signature waits. Everything else in this flow queues offline;
          a signature does not, because one applied against a stale finding is a signature on the wrong thing.
        recovery: low; resolved by fnb#signCorrectiveAction
    - screen: EMP-067
      name: Damage, Loss, Shrinkage & Stock Adjustment
      states:
        loading: The saved damage loss shrinkage.
        error: Could not load. Names which read failed and leaves the damage loss shrinkage untouched.
        emptyFirstRun: No damage loss shrinkage configured. The form opens empty and `recordWaste` saves the first
          one; it says what the platform does in the meantime.
        emptyNoAccess: Shown when the caller lacks `INCIDENT_VIEW`, which `getHaccpStatus` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no …
        offline: Works from cache and queues what it records. Staff walk out of coverage constantly — a stock count
          in a warehouse corner and a table order on a terrace both happen where the …
      failure_branches:
      - what_goes_wrong: error state on EMP-067
        user_sees: Could not load. Names which read failed and leaves the damage loss shrinkage untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on EMP-067
        user_sees: Shown when the caller lacks `INCIDENT_VIEW`, which `getHaccpStatus` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no …
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on EMP-067
        user_sees: Works from cache and queues what it records. Staff walk out of coverage constantly — a stock count
          in a warehouse corner and a table order on a terrace both happen where the …
        recovery: Reconnect; the screen picks up where it was (derived)
    - screen: BO-044
      name: F&B Outlets
      shows:
      - element: Outlet list
        rule: Name, code, kind, zone, Trading now (from opening hours against now in GST), Active, and for F&B the
          unsigned food-safety actions count — the number that matters before service.
      - element: Outlet detail
        rule: Sections Overview, Opening hours, Ordering & delivery, Floor plan (table service), Returns (shops),
          Food safety.
      states:
        loading: The outlets list.
        error: Could not load. Names which read failed and leaves the outlets untouched.
        emptyFirstRun: No outlets yet. Offers Create outlet (`createOutlet`); distinct from a filter that matched
          nothing.
        emptyNoResults: Nothing matches the filter on venueId, kind and the outlets are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: You don't have access to outlets — ask your venue manager. Permission keys are never shown
          to the user; the screen names the access in words. Never an empty table — that reads as …
      failure_branches:
      - screen: BO-044
        what_goes_wrong: Outlet made inactive while orders are live
        user_sees: Allowed, with a warning that names the live orders; the guest dining list stops showing the outlet.
      - screen: BO-044
        what_goes_wrong: Food-safety escalation with no food-safety lead set
        user_sees: Refused "no food-safety lead"; link to Venue Configuration where the lead is set.
    steps:
    - frame: 1
      screen: EMP-067
      screen_name: Damage, Loss, Shrinkage & Stock Adjustment
      block_a: true
      user_sees: 'Damage, Loss & Adjustment on the handheld: record that something broke, spoiled, went missing or
        was found, with a reason, so stock stays true and shrinkage is visible.'
      user_does: The check falls due and appears on the storekeeper's list.
      operations:
      - fnb#getHaccpStatus
      result: Checks due, checks missed, and open actions. A missed check counts the same as a failed one — a log
        with a gap cannot be told apart from a log nobody kept.
    - frame: 2
      screen: EMP-067
      screen_name: Damage, Loss, Shrinkage & Stock Adjustment
      block_a: true
      user_sees: 'Damage, Loss & Adjustment on the handheld: record that something broke, spoiled, went missing or
        was found, with a reason, so stock stays true and shrinkage is visible.'
      user_does: They read the unit and record the temperature.
      operations:
      - fnb#logTemperature
      result: In range, and the flow ends here. This is what happens almost every time, and the flow is written so
        that the ordinary path is two steps.
    - frame: 3
      screen: EMP-067
      screen_name: Damage, Loss, Shrinkage & Stock Adjustment
      block_a: true
      user_sees: 'Damage, Loss & Adjustment on the handheld: record that something broke, spoiled, went missing or
        was found, with a reason, so stock stays true and shrinkage is visible.'
      user_does: The reading is out of range. The platform opens a corrective action against it.
      operations:
      - fnb#logTemperature
      result: The reading is kept, not refused. Deleting a bad reading is the one thing an inspector looks for, and
        an operation that rejects it teaches a kitchen to stop taking readings.
    - frame: 4
      screen: EMP-067
      screen_name: Damage, Loss, Shrinkage & Stock Adjustment
      block_a: true
      user_sees: 'Damage, Loss & Adjustment on the handheld: record that something broke, spoiled, went missing or
        was found, with a reason, so stock stays true and shrinkage is visible.'
      user_does: They act — discard, rework, quarantine — and record what they did.
      operations:
      - fnb#signCorrectiveAction
      result: '`open` becomes `actioned`. Not signed yet, and this is the state most findings sit in.'
    - frame: 5
      screen: EMP-067
      screen_name: Damage, Loss, Shrinkage & Stock Adjustment
      block_a: true
      user_sees: 'Damage, Loss & Adjustment on the handheld: record that something broke, spoiled, went missing or
        was found, with a reason, so stock stays true and shrinkage is visible.'
      user_does: They put their name to it.
      operations:
      - fnb#signCorrectiveAction
      result: '`actioned` becomes `signed`. The signature is the record — *discarded and reset* with nobody against
        it is not a corrective action.'
    - frame: 6
      screen: BO-044
      screen_name: F&B Outlets
      block_a: true
      user_sees: 'The outlet register: every F&B outlet (and, under the retail licence, every shop) at the venue,
        whether it is trading now, and the outlet''s own configuration — name, code, kind, zone, stock location, cost
        centre, opening hours, active; …'
      user_does: The venue manager reviews open and unsigned findings before service.
      operations:
      - fnb#getHaccpStatus
      - fnb#signCorrectiveAction
      result: Unsigned actions are the number that matters on this screen. A year of unsigned entries is what an inspection
        finds, and nobody notices until then.
    motion:
    - what: Out-of-range reading
      how: Reading field and the check row turn the error colour and a corrective-action card slides in below.
      timing: 200 ms
    - what: Corrective action status chip
      how: Chip changes open → actioned → signed with a colour cross-fade.
      timing: 200 ms
    decisions:
    - 'ids in the flow: CHG-WIR-008'
    - 'BO-044: Outlet names: English, plus the local language where the country requires it. (Chinmay 2026-10-02)'
    - 'BO-044: Drawn default stands (answer: "Default / recommended accepted"): Allow with a warning naming the live
      orders. (Chinmay 2026-10-02)'
    - 'BO-044: Drawn default stands (answer: "Default / recommended accepted"): Via outlet templates (BO-730). (Chinmay
      2026-10-02)'
    - 'answers-2-oct-batch1.md L60: 26 | BO-044 (bilingual outlet names) | Yes, where a country needs it: the local
      language plus English. | Outlet names in English, plus the local language where the region requires it.'
    - 'answers-2-oct-batch1.md L61: 27–30 | BO-044, BO-048 | Yes / recommended | Defaults.'
    sources:
    - flows/F28-a-temperature-excursion-is-caught.yaml
    - DI-363
    - MATRIX 4.6.31
    - DI-350
    - DI-319
    - DI-330
    - DI-210
    - handoff/design-notes (screens EMP-067, BO-044)
    open:
    - question: Who signs when a venue runs a single-person kitchen at night? The escalation rule assumes a supervisor
        is reachable, and a small outlet at 23:00 may have nobody. Worth a client answer before build rather than
        a default that either blocks the cook or lets them sign their own critical finding.
      default: If no supervisor is reachable, the action is recorded and stays "actioned" and visibly unsigned; the
        next supervisor on shift signs it, and it shows as overdue on BO-044 until then.
  F29:
    title: A table is seated, coursed and split
    process: fnb-retail
    block_a:
      screens:
      - EMP-058
      - EMP-059
      - KIT-002
      operations:
      - fnb#closeTableVisit
      - fnb#compItem
      - fnb#createFnbOrder
      - orders#createPayment
      - fnb#fireCourse
      - fnb#getBill
      - fnb#notifyServer
      - fnb#openTableVisit
      - fnb#refireItem
      - fnb#seatTableReservation
      - fnb#setKitchenTicketStatus
      - fnb#setServiceStage
      - fnb#splitBill
      screens_outside_block_a: []
    trigger:
      description: A booking arrives, or four people walk in and the host has a table. This flow covers both — a walk-in
        joins the waitlist and enters at step 2; a booking enters at step 1.
    actors:
      roles:
      - supervisor
      apps:
      - Staff App (P06)
      - Kitchen Display (P15)
      - Venue POS (P04)
    offline: Steps 2 to 8 work offline. A restaurant floor is where coverage is worst — a terrace, a basement, a marquee
      — and a handheld that stops taking orders mid-service is a handheld the staff put down and replace with paper.
      Splitting and payment need the network. A split computed offline against a bill that changed is two guests paying
      for one item, and the second payment is a refund somebody makes.
    inputs:
    - name: Covers (seat step)
      screen: EMP-058
      validation: Picked after the table, with a stepper defaulting to the booking's party size (or the table's seats
        for a walk-in). It drives split by covers at the end. For a booking, record the actual party when it differs
        ("Booked 6, arrived 4").
      source: supervisor on EMP-058 Live Table & Service Management
      ref: DI-104 | contracts/satellite/fnb.yaml#openTableVisit | contracts/satellite/fnb.yaml#seatTableReservation
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Table(s) for a booking
      screen: EMP-058
      limits:
      - At least one
      validation: At least one. The host picks on the mini floor plan, and a declared combination can be chosen as
        one choice. Seats from Booked, Confirmed or No-show (late arrival) only.
      source: supervisor on EMP-058 Live Table & Service Management
      ref: contracts/satellite/fnb.yaml#seatTableReservation | DI-689 | contracts/satellite/fnb.yaml#setTableCombinations
      formats:
      - form field (derived)
    - name: Move reason
      screen: EMP-058
      validation: Guest request, Table fault, Party size changed, Service recovery, or Other. Other needs a note.
      source: supervisor on EMP-058 Live Table & Service Management
      ref: contracts/satellite/fnb.yaml#moveTableVisit | R222
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Split
      screen: EMP-059
      validation: 'Methods in the client''s order: By amount, By covers (defaults to the table''s covers), By category
        (food to one guest, drinks to another), then By item and By seat. Every line goes to exactly one part. Amounts
        must sum to the total. A split that does not sum is refused, never rounded away. Remainders go to the minor
        unit, and 3-decimal currencies keep the third decimal.'
      source: supervisor on EMP-059 Table Order, Bill & Payment Management
      ref: DI-106 | contracts/satellite/fnb.yaml#splitBill | F29 step 8 | DI-306
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Comp reason
      screen: EMP-059
      formats:
      - PIN
      validation: Quality issue, Long wait, Wrong item, Allergy incident, Goodwill, Staff meal, Wastage, or Other
        (with a note). A comp on a line above the venue's comp limit (proposed AED 100.00) needs a manager with discount
        authority, by PIN on this device.
      source: supervisor on EMP-059 Table Order, Bill & Payment Management
      ref: contracts/satellite/fnb.yaml#compItem | R197 | R222
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Tip
      screen: EMP-059
      validation: The guest's gratuity, entered at payment, separate from the service charge (which is revenue, not
        a tip).
      source: supervisor on EMP-059 Table Order, Bill & Payment Management
      ref: contracts/satellite/fnb.yaml#closeTableVisit | contracts/satellite/fnb.yaml#/components/schemas/TableVisit
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Course filter
      screen: KIT-002
      validation: Chips with the outlet's course names (Starters · Mains · Desserts), not a number field; only that
        course's lines show.
      source: supervisor on KIT-002 Kitchen Display System (KDS)
      ref: R277 | contracts/satellite/fnb.yaml#listKitchenTickets | contracts/satellite/fnb.yaml#setCourseRules
      formats:
      - multi-select list (derived from the KIT-002 layout)
      limits:
      - only that course's lines show (derived)
    - name: Station
      screen: KIT-002
      validation: Never picked on the display; the display shows the station it is assigned to in station setup.
      source: supervisor on KIT-002 Kitchen Display System (KDS)
      ref: R277 | contracts/satellite/fnb.yaml#/components/schemas/KitchenStation
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    processing:
    - operation: fnb#seatTableReservation
      what: The party arrived and has been sat down
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#openTableVisit
      what: Seat a party and open a visit
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#setServiceStage
      what: Where this table is in its meal
      steps:
      - 2
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#createFnbOrder
      what: Place an F&B order
      steps:
      - 2
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#setKitchenTicketStatus
      what: Advance a kitchen ticket
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#notifyServer
      what: The kitchen calls the server to the pass
      steps:
      - 4
      block_a: true
      writes: true
    - operation: fnb#fireCourse
      what: Send a held course to the pass
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#refireItem
      what: Make it again
      steps:
      - 6
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#compItem
      what: Take a line off the bill, with a reason and a name
      steps:
      - 7
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#getBill
      what: Bill for a visit
      steps:
      - 8
      block_a: true
      offline_capable: true
    - operation: fnb#splitBill
      what: Split a bill
      steps:
      - 8
      block_a: true
      writes: true
      offline_capable: true
    - operation: orders#createPayment
      what: Take a payment against an order
      steps:
      - 9
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#closeTableVisit
      what: Settle and close a visit
      steps:
      - 9
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        served: Table seated, coursed, paid and cleared. The ordinary outcome.
        servedWithRecovery: A refire and a comp along the way. A separate exit state because it is a different night
          — the same revenue, a worse service, and only one of the two shows in a takings report.
        walkOut: The party left before paying. Visit closed unpaid against the shift, which is where a write-off begins.
      failure_branches:
      - at_step: 1
        what_goes_wrong: There is no booking — four people walk in.
        user_sees: 'Enters through the waitlist instead: `joinRestaurantWaitlist`, then `quoteWaitTime`, then `notifyWaitlistParty`
          when a table frees. The quote is computed, not typed — a host guesses low under pressure, and a quote wrong
          twice is a quote nobody believes.'
        recovery: low; resolved by fnb#quoteWaitTime
      - at_step: 2
        what_goes_wrong: The party is larger than the table.
        user_sees: '`setTableCombinations` says which tables push together and to what capacity. Declared rather than
          inferred — a pillar or a step means two adjacent tables do not always combine, and a host knows which pairs
          work where a floor plan does not.'
        recovery: medium; resolved by fnb#setTableCombinations
      - at_step: 5
        what_goes_wrong: The table has gone quiet and is not ready for mains.
        user_sees: '`holdCourse`. A held course keeps its place in the rail so the kitchen can see how long it has
          waited — a held course nobody fires becomes a cold course nobody wants.'
        recovery: low; resolved by fnb#holdCourse
      - at_step: 6
        what_goes_wrong: The shift changes mid-service.
        user_sees: '`reassignServer`, and the gratuity split follows the assignment. A table reassigned at 8pm and
          closed at 10pm has two servers with a claim on it.'
        recovery: medium; resolved by fnb#reassignServer
      - at_step: 8
        what_goes_wrong: A guest moves from the bar and their drinks should follow.
        user_sees: '`transferOrderItems` moves lines between bills. The kitchen is not re-fired — food already made
          does not get made again because the bill moved.'
        recovery: low; resolved by fnb#transferOrderItems
    - screen: EMP-058
      name: Live Table & Service Management
      shows:
      - element: Service stage
        rule: A stepper from Seated through Drinks ordered, Food ordered, Starters away, Mains away, Dessert, Coffee,
          Bill requested and Paying, with minutes in the current stage. Stages are set by the act wherever an act
          exists (an order, a course). The server sets by hand only the ones nothing else observes.
      - element: Activity log
        rule: 'Newest first, each line with the time and the person: seated, drinks ordered, food ordered, sent to
          kitchen, course served, guest added, server changed, moved from T4. The course lines show the kitchen''s
          fired time.'
      - element: Orders and running total
        rule: Orders on this visit grouped by course, with the running total in AED (2 decimals).
      states:
        loading: The saved live table service.
        error: Could not load. Names which read failed and leaves the live table service untouched.
        emptyFirstRun: No live table service configured. The form opens empty and `openTableVisit` saves the first
          one; it says what the platform does in the meantime.
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `getTableVisit` requires, and names that permission.
          Never an empty table — that reads as *there is no data* and sends somebody to …
        offline: Works from cache and queues what it records. Staff walk out of coverage constantly — a stock count
          in a warehouse corner and a table order on a terrace both happen where the …
      failure_branches:
      - screen: EMP-058
        what_goes_wrong: Seat on a table someone else just seated
        user_sees: The 409 names the visit at that table ("T9 was seated by Khalid at 20:02") and offers another table.
      - screen: EMP-058
        what_goes_wrong: Order with a recipe-linked item while offline
        user_sees: Refused with "Can't order this offline; stock is tracked". Untracked items queue normally.
    - screen: EMP-059
      name: Table Order, Bill & Payment Management
      shows:
      - element: Bill
        rule: Lines grouped by course (or by seat when split by seat), each with quantity and line total. Comped lines
          are struck through with "Comp · Long wait · Priya". Then subtotal, service charge, VAT 5%, total in AED
          with 2 decimals. A deposit paid on the booking is shown as a deduction above the amount to …
      - element: Sub-bills
        rule: One card per part with its own subtotal, VAT, total and a Paid or To pay state. The table closes when
          every part is paid.
      states:
        loading: The table order bill, read by `getBill`.
        error: Could not load. Names which read failed and leaves the table order bill untouched.
        emptyFirstRun: No table order bill yet. Offers Create payment (`createPayment`).
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `getBill` requires to show this screen, and
          names that permission. Never an empty table — that reads as *there is no data* and …
        offline: Works from cache and queues what it records. Staff walk out of coverage constantly — a stock count
          in a warehouse corner and a table order on a terrace both happen where the …
      failure_branches:
      - screen: EMP-059
        what_goes_wrong: Card payment with no answer from the terminal
        user_sees: Show "Waiting for the card terminal" and check the payment's status. Never assume it failed or
          take the card again.
      - screen: EMP-059
        what_goes_wrong: Offline at the table
        user_sees: Ordering continues. Split, payment by card and close need a connection and show as disabled with
          that reason.
    - screen: KIT-002
      name: Kitchen Display System (KDS)
      shows:
      - element: Ticket card
        rule: 'Header: "order number (counter) or table and covers (dine-in), order type badge, server. Lines: quantity,"
          item, options indented, the note to the kitchen, allergen flags highlighted. A refire line is marked "REFIRE
          · overcooked". Priority tickets marked. Lines of a held course greyed with "Held".'
      - element: Fired timer
        rule: Counts up from when the ticket (or course) was sent — never a countdown; resets when a course is completed;
          not shown for quick-service outlets. Turns amber at the warning percentage and red past the target for that
          order type.
      - element: Rail order
        rule: Exactly as the server returns it (priority, then the outlet's weights for age, promise time, table stage,
          VIP); the display does not re-sort.
      - element: Header
        rule: Station name, tickets waiting and oldest age — two numbers.
      states:
        loading: The rail. The count renders before the tickets. The server's order, never re-sorted on the device
          (`listKitchenTickets` orders by priority weights; design-notes correction …
        error: Could not reach the platform. The rail is still live from cache and every bump is queued.
        emptyFirstRun: No tickets. The kitchen is clear, and that is worth saying plainly rather than showing a blank
          rail — a screen that looks broken and a screen that means nothing to do are the same …
        emptyNoResults: Nothing matches this station or course filter. The rail is not empty — the filter is narrow,
          and on a kitchen screen that distinction is the difference between calm and panic.
        emptyNoAccess: This display is not assigned to a station. Assignment is a back-office act — a kitchen screen
          does not choose what it shows. A principal without `ORDER_VIEW` gets this state …
        offline: Amber, and it keeps working. The kitchen still has to send food out — a display that blanks mid-service
          is worse than one that says it is behind, and every bump journals locally …
      failure_branches:
      - screen: KIT-002
        what_goes_wrong: Offline
        user_sees: The rail stays live from cache with an amber banner; every bump is journaled and syncs; new orders
          from tills on the venue network still arrive.
      - screen: KIT-002
        what_goes_wrong: The primary display of a station is down
        user_sees: Tickets route to the station's fallback display; the fallback shows which station it is covering.
      - screen: KIT-002
        what_goes_wrong: A move the ticket's state does not allow (e.g. bump a received ticket straight to served)
        user_sees: Refused with the ticket's current state; only Received→Preparing, Preparing→Ready, Ready→Recalled,
          Recalled→Preparing happen here.
      - screen: KIT-002
        what_goes_wrong: Recall after the window
        user_sees: '"Too late to recall — refire instead?" with the refire reasons.'
    steps:
    - frame: 1
      screen: EMP-058
      screen_name: Live Table & Service Management
      block_a: true
      user_sees: 'The table sheet for one table during service, opened by tapping it on the floor plan: seat the party
        (walk-in or booking), see where the table is in its meal, order, add a guest, change the server, move the
        party to another table or merge …'
      user_does: The host seats the booking against a table.
      operations:
      - fnb#seatTableReservation
      - fnb#openTableVisit
      result: A visit opens on the table. The reservation becomes a visit rather than staying a reservation — a booking
        that is still a booking while people are sitting at it is a table the system thinks is free.
    - frame: 2
      screen: EMP-058
      screen_name: Live Table & Service Management
      block_a: true
      user_sees: 'The table sheet for one table during service, opened by tapping it on the floor plan: seat the party
        (walk-in or booking), see where the table is in its meal, order, add a guest, change the server, move the
        party to another table or merge …'
      user_does: The server marks them seated and takes drinks.
      operations:
      - fnb#setServiceStage
      - fnb#createFnbOrder
      result: Stage `seated`, then `drinksOrdered`. The stage is what makes a turn time real — a table `seated` fifty
        minutes and not ordered is a service problem, and open/closed cannot say so.
    - frame: 3
      screen: EMP-059
      screen_name: Table Order, Bill & Payment Management
      block_a: true
      user_sees: 'The table''s bill at the end of the visit: every line across every order, service charge and VAT,
        the split the party asks for, comps for service recovery, payment, and closing the table.'
      user_does: Food is ordered with courses.
      operations:
      - fnb#createFnbOrder
      result: A kitchen ticket with `coursing` set from the outlet's default. Starters fire; mains hold.
    - frame: 4
      screen: KIT-002
      screen_name: Kitchen Display System (KDS)
      block_a: true
      user_sees: 'The station display on the kitchen wall: the tickets this station must make, in the order the kitchen
        should make them, bumped with one touch or a bump bar by someone wearing gloves.'
      user_does: The kitchen makes the starters and bumps them.
      operations:
      - fnb#setKitchenTicketStatus
      - fnb#notifyServer
      result: The pass calls the server rather than waiting to be noticed. Food ready and nobody collecting it is
        the commonest reason a plate goes out cold.
      crosses_device: true
    - frame: 5
      screen: EMP-058
      screen_name: Live Table & Service Management
      block_a: true
      user_sees: 'The table sheet for one table during service, opened by tapping it on the floor plan: seat the party
        (walk-in or booking), see where the table is in its meal, order, add a guest, change the server, move the
        party to another table or merge …'
      user_does: Starters cleared. The server judges the table is ready and fires the mains.
      operations:
      - fnb#fireCourse
      - fnb#setServiceStage
      result: The act this whole flow exists to prove. `KitchenTicket.coursing` carried the policy until 24 August
        and nothing fired anything — a venue could configure coursing and never course a table.
      crosses_device: true
    - frame: 6
      screen: KIT-002
      screen_name: Kitchen Display System (KDS)
      block_a: true
      user_sees: 'The station display on the kitchen wall: the tickets this station must make, in the order the kitchen
        should make them, bumped with one touch or a bump bar by someone wearing gloves.'
      user_does: One main comes back wrong. The station refires it.
      operations:
      - fnb#refireItem
      result: '`chargeable` false by default. A refire the kitchen caused is not billable, and making it opt-in stops
        a busy service quietly charging for its own mistakes.'
      crosses_device: true
    - frame: 7
      screen: EMP-059
      screen_name: Table Order, Bill & Payment Management
      block_a: true
      user_sees: 'The table''s bill at the end of the visit: every line across every order, service charge and VAT,
        the split the party asks for, comps for service recovery, payment, and closing the table.'
      user_does: The server comps the delayed dish.
      operations:
      - fnb#compItem
      result: A comp is not a discount. Different budget, and a venue that cannot tell them apart cannot tell a generous
        manager from a leaking till.
      crosses_device: true
    - frame: 8
      screen: EMP-059
      screen_name: Table Order, Bill & Payment Management
      block_a: true
      user_sees: 'The table''s bill at the end of the visit: every line across every order, service charge and VAT,
        the split the party asks for, comps for service recovery, payment, and closing the table.'
      user_does: The table asks to split four ways.
      operations:
      - fnb#getBill
      - fnb#splitBill
      result: Four bills. Tax and service charge recompute per bill — a split that apportions VAT by percentage produces
        bills that do not sum, and the difference is a fils somebody explains.
    - frame: 9
      screen: EMP-059
      screen_name: Table Order, Bill & Payment Management
      block_a: true
      user_sees: 'The table''s bill at the end of the visit: every line across every order, service charge and VAT,
        the split the party asks for, comps for service recovery, payment, and closing the table.'
      user_does: Each guest pays their own.
      operations:
      - orders#createPayment
      - fnb#closeTableVisit
      result: The visit closes. Stage `cleared` releases the table to the floor plan, and the waitlist picks it up.
    motion:
    - what: Floor plan table tiles
      how: Tile colour and label change live with the table status (Available, Ordered, Table closed, Reserved, Out
        of service); a seated tile shows covers and the minutes since seating, counting up.
      timing: Status change cross-fades 200 ms; minutes tick each 60 s
    - what: Kitchen rail (KIT-002)
      how: New tickets slide in at the right-hand end in server order; a bumped ticket collapses out and the rail
        closes the gap. Recalled tickets slide back in with a "Recalled" tag.
      timing: Arrives within 2 s of the send (poll/push from listKitchenTickets); slide 200 ms
    - what: Ticket age timer
      how: Each ticket header counts up mm:ss from fired time; the header turns amber, then red, against the outlet
        target time.
      timing: Ticks every 1 s
    - what: Fire course
      how: Held course on the ticket changes from "Held" to "Fired" with a highlight on KIT-002 and on EMP-058.
      timing: 200 ms
    - what: Server notify
      how: Server handheld vibrates and a "Food ready, T4" banner drops from the top.
      timing: Banner 4 s
    - what: Split bill
      how: Choosing a split method redraws the bill into sub-bills; each sub-bill total recomputes tax and service
        and rolls to its value.
      timing: 250 ms
    decisions:
    - 'answers-2-oct-batch1.md L80: "Remove table" marks it Out of service'
    - 'answers-2-oct-batch1.md L81: change covers and change server in Block A; table transfer after r2'
    - 'answers-2-oct-batch1.md L196: short "Table closed" state, then "Make available"'
    - 'answers-2-oct-batch1.md L197: Reserved when a booking names the table, or N minutes (venue-set) before a pre-allocated
      booking'
    - 'answers-2-oct-batch1.md L195: no cash on handhelds; cash goes to a till'
    - 'answers-2-oct-batch1.md L373: split by amount, covers, category, item or seat; one SplitBill request'
    - 'EMP-058: Drawn default stands (answer: "Default / recommended accepted"): Show the course strip read-only,
      plus a "Ready for mains" action that is drawn but marked pending the decision. Never label it "Fire" on the
      floor. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L65: 42–50 | EMP-058, EMP-062, GST-070 (two), KIT-005, KIT-007, KSK-017, POS-001, POS-013
      | Yes / recommended | Defaults.'
    sources:
