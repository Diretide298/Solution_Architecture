  F87:
    title: A till handles a return, a collection and a safe drop
    process: fnb-retail
    block_a:
      screens:
      - POS-011
      - POS-012
      - POS-013
      - POS-007
      operations:
      - orders#createOrder
      - shift#getCurrentShift
      - orders#listOrders
      - inventory#listSerialisedItems
      - shift#submitShiftCount
      screens_outside_block_a: []
    trigger:
      description: The things that happen at a till that are not a sale.
    actors:
      roles:
      - cashier
      apps:
      - Venue POS (P04)
    offline: Returns need the network; collections and safe drops do not.
    inputs:
    - name: Find the sale
      screen: POS-011
      formats:
      - BARCODE
      validation: Scan the receipt barcode, or type the receipt or order number. Barcode wins, then receipt number,
        then order number; several matches show a pick list, newest first. No lookup by card, membership or item and
        date in the first release.
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: contracts/satellite/retail.yaml#lookupRetailSale | R215 | R139
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Lines to return
      screen: POS-011
      validation: Tick lines and quantities; each line shows if it is returnable and, if not, why ("Window closed
        on 28 Oct").
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: contracts/satellite/retail.yaml#/components/schemas/RetailSale
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Condition (merchandise)
      screen: POS-011
      validation: Resaleable · Opened · Damaged · Faulty · Missing parts. Only the policy's restockable conditions
        go back to stock; the rest are written off with the reason.
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: contracts/satellite/retail.yaml#createRetailReturn | contracts/satellite/retail.yaml#/components/schemas/ReturnPolicy
      formats:
      - text field (derived)
      limits:
      - Only the policy's restockable conditions go back to sto (derived)
    - name: Reason
      screen: POS-011
      validation: 'Preset reasons (merchandise: Changed mind · Wrong size · Wrong item · Faulty · Damaged in transit
        · Duplicate purchase · Gift return · Other) plus a free-text note for the circumstances; Other needs the note.'
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: DI-796 | DI-797 | R222 | contracts/satellite/retail.yaml#createRetailReturn
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Serial number
      screen: POS-011
      validation: For serialised items the serial must match the sold unit.
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: F34 step 7 | contracts/satellite/inventory.yaml#listSerialisedItems
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Refund to
      screen: POS-011
      validation: Original tender by default. Store credit or cash against a card sale only where the policy allows,
        usually with approval. Always in the base currency at the value recorded at sale, never the tendered foreign
        currency.
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: DI-796 | DI-282 | contracts/satellite/retail.yaml#/components/schemas/ReturnPolicy | F34 step 7
      formats:
      - form field (derived)
      limits:
      - only where the policy allows (derived)
    - name: Supervisor approval
      screen: POS-011
      formats:
      - PIN
      validation: Above the outlet's self-authorise limit a supervisor enters their PIN on this till (not the cashier).
        Above "second user" limits a second named user confirms.
      source: cashier on POS-011 Returns, Refunds & Exchanges
      ref: R144 | contracts/satellite/retail.yaml#createRetailReturn | contracts/spine/orders.yaml#createRefund
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - screen: POS-012
      see: fnb-retail#F60
      note: inputs of this screen are detailed once, in that flow
    - screen: POS-007
      see: platform-foundation#F32
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: inventory#listSerialisedItems
      what: Where each individual item is
      steps:
