  F30:
    title: A count is entered, varied and posted
    process: fnb-retail
    block_a:
      screens: []
      operations:
      - fnb#listRecipes
      screens_outside_block_a:
      - EMP-066
      - BO-079
      - BO-137
    trigger:
      description: A scheduled count falls due, or a supervisor opens one because a number looked wrong. `setDailyCount`
        names the twenty items that get counted every morning — high-value and high-variance, not a rotation, because
        a daily list that includes everything is a daily list nobody completes.
    actors:
      roles:
      - storekeeper
      apps:
      - Staff App (P06)
      - Venue Management (P08)
    offline: Steps 2 and 3 work offline and this is the flow that proves the rule. Counting happens in a store room,
      a cellar and a walk-in — the three places in a venue with no signal. Lines journal locally and sync on return.
      Posting needs the network, because a post writes movements against a theoretical figure that may have changed
      while the counter was in the cellar.
    inputs: []
    processing:
    - operation: inventory#startStockCount
      what: Start a stock count
      steps:
      - 1
      block_a: false
      writes: true
      offline_capable: true
    - operation: fnb#enterCountLine
      what: What was actually on the shelf
      steps:
      - 2
      - 3
      - 6
      block_a: false
      writes: true
      offline_capable: true
    - operation: inventory#getCountVariance
      what: Variance between counted and expected
      steps:
      - 4
      - 8
      block_a: false
      offline_capable: true
    - operation: fnb#requestRecount
      what: Send a line back to be counted again
      steps:
      - 5
      block_a: false
      writes: true
    - operation: inventory#postStockCount
      what: Post a count and adjust stock
      steps:
      - 7
      block_a: false
      writes: true
    - operation: fnb#listRecipes
      what: List recipes
      steps:
      - 8
      block_a: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        posted: Counted, varied, accepted and posted as movements. The ordinary outcome.
        postedAfterRecount: One or more lines recounted before posting. A separate exit because the pair matters —
          the original and the recount together say whether the problem was the counter or the shelf.
        heldForApproval: Variance above threshold. The count is complete and unposted until somebody with the authority
          signs it.
        abandoned: Opened and never finished. Kept rather than deleted — an abandoned count on a Friday is itself
          a signal, and deleting it removes the evidence that counting is not happening.
      failure_branches:
      - at_step: 4
        what_goes_wrong: The variance is above the venue's write-off threshold.
        user_sees: Routes through `createApprovalRequest` before it can post. One approval mechanism, not one per
          thing approved — CF-132 settled that, and a write-off is an approval request with a different subject.
        recovery: high; resolved by approvals#createApprovalRequest
      - at_step: 2
        what_goes_wrong: The counter is in a cellar with no signal.
        user_sees: Lines journal locally and the count stays open. This is the ordinary case, not the edge — and a
          count that cannot be entered where the stock is, is a count entered later from a piece of paper.
        recovery: low; resolved by fnb#enterCountLine
      - at_step: 7
        what_goes_wrong: Stock moved between entry and post — a sale, a transfer, a waste record.
        user_sees: The snapshotted theoretical is used, not the current one. The count measures what was on the shelf
          when somebody looked at it; re-deriving at post time would silently absorb the movement into the variance
          and hide a real discrepancy.
        recovery: high; resolved by inventory#postStockCount
      - at_step: 1
        what_goes_wrong: It is a daily count rather than a full one.
        user_sees: Same flow, twenty lines. `postsAdjustment` is false and should stay false — a daily count is a
          check, not a correction, and one that silently adjusts stock hides the shrinkage it exists to find.
        recovery: medium; resolved by inventory#setDailyCount
    steps:
    - frame: 1
      screen: EMP-066
      screen_name: Stock Count & Cycle Count Management
      block_a: false
      user_sees: The counter's handheld.
      user_does: The storekeeper opens the count.
      operations:
      - inventory#startStockCount
      result: A count in `open`, scoped to a location and an item set. The theoretical position is not snapshotted
        here — it is captured per line, at entry.
    - frame: 2
      screen: EMP-066
      screen_name: Stock Count & Cycle Count Management
      block_a: false
      user_sees: The counter's handheld.
      user_does: They count the shelf and enter each line.
      operations:
      - fnb#enterCountLine
      result: The theoretical quantity is snapshotted at entry, not at post. Stock moves during a count, and a variance
        computed at post time is measured against a different number from the one the counter was standing in front
        of.
    - frame: 3
      screen: EMP-066
      screen_name: Stock Count & Cycle Count Management
      block_a: false
      user_sees: The counter's handheld.
      user_does: A line is miskeyed. They count again and re-enter it.
      operations:
      - fnb#enterCountLine
      result: The second entry replaces the first. A counter who miskeys and re-counts is the normal case, and a model
        that refuses the second sends them to a supervisor to undo the first.
    - frame: 4
      screen: BO-079
      screen_name: Stock Count
      block_a: false
      user_sees: 'Stock Count is the supervisor''s side of counting: start a full, cycle or spot count at a location,
        watch progress, review the variance once counting is submitted, send lines back for recount, and post.'
      user_does: The supervisor reviews the variance.
      operations:
      - inventory#getCountVariance
      result: Variance by line and by value. A count with no variance is a count somebody did not do — real shelves
        are never exactly right, and a clean sheet is the first thing a stocktaker queries.
    - frame: 5
      screen: BO-079
      screen_name: Stock Count
      block_a: false
      user_sees: 'Stock Count is the supervisor''s side of counting: start a full, cycle or spot count at a location,
        watch progress, review the variance once counting is submitted, send lines back for recount, and post.'
      user_does: Three lines look wrong. They send them back.
      operations:
      - fnb#requestRecount
      result: Scoped to lines, not the whole count. Recounting four items is an hour; recounting a cellar is a shift,
        and a model that only offers the second gets neither.
    - frame: 6
      screen: EMP-066
      screen_name: Stock Count & Cycle Count Management
      block_a: false
      user_sees: The counter's handheld.
      user_does: The lines are recounted and re-entered.
      operations:
      - fnb#enterCountLine
      result: Status `recounted`. The original entry is kept beside the recount — the pair is what tells a venue whether
        the problem was the counter or the shelf.
    - frame: 7
      screen: BO-079
      screen_name: Stock Count
      block_a: false
      user_sees: 'Stock Count is the supervisor''s side of counting: start a full, cycle or spot count at a location,
        watch progress, review the variance once counting is submitted, send lines back for recount, and post.'
      user_does: The supervisor accepts and posts.
      operations:
      - inventory#postStockCount
      result: Movements are written, not levels. `inventory.stock_level` is derived — four operations wrote it directly
        until 20 August, and a stored level and a movement ledger that disagree is a stock count nobody can reconcile.
    - frame: 8
      screen: BO-137
      screen_name: Recipe Consumption & Theoretical Inventory
      block_a: false
      user_sees: 'What the recipes say should have been used against what the count found, per outlet and count period
        (FNB-5C, F30 step 8): theoretical, actual, variance %, its value, and the lines beyond the venue''s tolerance.'
      user_does: The variance feeds theoretical-against-actual.
      operations:
      - inventory#getCountVariance
      - fnb#listRecipes
      result: Recipes say 400 portions; the count says 380. The gap is waste, theft or a wrong recipe, and this is
        the only place a venue finds out which.
    motion:
    - what: Count progress
      how: Header counter "34 of 120 lines counted" increments as lines are entered; variance column fills per line.
      timing: Immediate
    decisions:
    - 'answers-2-oct-batch1.md L176: 191 | BO-137 | Is "probable cause" (re-fires logged, trim yield, breakage) wanted
      in r1, and from which data? | No cause column; link to waste and production for the period'
    sources:
    - flows/F30-a-count-is-entered-varied-and-posted.yaml
    - CF-132
    open:
    - none
    inputs_note: 'none: the Block A screens of this flow only read'
  F31:
    title: A menu is drafted, scheduled and rolled back
    process: fnb-retail
    block_a:
      screens:
      - BO-045
      - BO-111
      - POS-002
      operations:
      - fnb#applyMenuActions
      - fnb#getAllergenVerification
      - catalogue#getLatestBundle
      - fnb#getMenu
      - fnb#publishMenu
      - fnb#rollbackMenu
      - fnb#scheduleMenuPublish
      - fnb#updateMenu
      screens_outside_block_a: []
    trigger:
      description: Costs moved, a season changed, or a supplier stopped carrying an item. Until 24 August `updateMenu`
        was the only operation and a menu edited was a menu live — no draft, no schedule, no rollback, and a venue
        changing prices for next Monday had to do it on Monday.
    actors:
      roles:
      - venueManager
      apps:
      - Venue Management (P08)
      - Venue POS (P04)
      - Kitchen Display (P15)
    offline: None of this works offline and none of it should. Publishing a menu changes what every till in the venue
      charges — an offline publish is a price change that reaches some workstations and not others, which is the one
      outcome worse than not publishing at all. The tills receive it through the catalogue bundle they already poll.
    inputs:
    - name: Menu bulk action
      formats:
      - reprice by % or amount
      - move section
      - set availability
      limits:
      - 'scope: whole menu, a section, or selected items'
      validation:
      - 'Always previewed: "This changes 14 items" before Apply'
      - Repricing over the venue approval threshold goes to approval
      source: Venue manager on BO-045
    - name: Outlet
      screen: BO-045
      validation: A picker of outlets by name (Oasis Bistro, Bite & Go), defaulting to the signed-in user's outlet;
        never a text field for an id. Menus are configured per outlet; an outlet manager sees only their own outlets,
        the F&B Director all of them.
      source: venueManager on BO-045 Menu Management
      ref: DI-330 | DI-331 | DI-318 | contracts/satellite/fnb.yaml#listMenus
      formats:
      - pick list (select) (derived from the BO-045 layout)
      limits:
      - only their own outlets (derived)
    - name: In force at
      screen: BO-045
      validation: Replaces the generated "Active at" date picker. A segmented control "Now / Choose a day and time"
        that filters to menus in force then (breakfast, lunch, happy hour). Read in the outlet's Region time zone
        (GST for the UAE), not UTC.
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#listMenus | contracts/satellite/fnb.yaml#/components/schemas/MenuAvailability
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Service period (menu availability)
      screen: BO-045
      validation: Day chips Mon to Sun plus a start and end wall-clock time (24-hour, HH:MM) and optional valid-from
        and valid-to dates. Leaving it empty means "always". Show the result as a sentence ("Daily 18:00 to 23:00
        from 1 Nov 2026") under the controls.
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#/components/schemas/MenuAvailability
      formats:
      - date picker (derived)
      limits:
      - 00 to 23 (derived)
    - name: Menu code
      screen: BO-045
      limits:
      - up to 64 characters
      - up to 200 characters
      validation: Short code, up to 64 characters, shown as a small grey label next to the name (OB-DINNER). The name
        (up to 200 characters) is what everybody reads.
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#/components/schemas/CreateMenuRequest
      formats:
      - text field (derived)
    - name: Bulk change
      screen: BO-045
      validation: 'One action per row: Reprice (by percent or amount), Retire, Activate, Move to section, Set availability,
        Set tax; each scoped to a section or a selection of items. "Preview" is the only first button; "Apply" appears
        only after the preview has named how many items each action touches.'
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#applyMenuActions | contracts/satellite/fnb.yaml#/components/schemas/MenuActionResult
        | F31 step 2
      formats:
      - number field (derived)
      limits:
      - only first button (derived)
      - only after the preview has named how many items each ac (derived)
    - name: Publish (when)
      screen: BO-045
      validation: '"Now" or "On a date". A date publish takes effect at the outlet''s local midnight in its Region''s
        time zone, so the picker is a date only, never a time. One scheduled publish per menu per date.'
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#scheduleMenuPublish | F31 step 4
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Publish (where)
      screen: BO-045
      validation: Channel checkboxes with people's words (Till, Kiosk, Guest app, Guest web, Call centre, Partner);
        none ticked means every channel the outlet sells on, and the dialog says so in words.
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#publishMenu | contracts/shared/common.yaml#/components/schemas/SalesChannel
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Roll back to
      screen: BO-045
      validation: A pick from the version history (newest first), defaulting to the version before the live one. Never
        a typed version number.
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#rollbackMenu | contracts/satellite/fnb.yaml#listMenuVersions
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Modifier group
      screen: BO-045
      limits:
      - Minimum and maximum selections
      - minimum above zero shows the group as Required (
      - min = max = 1
      - Maximum must be at least 1 and not below the min
      validation: Minimum and maximum selections; a minimum above zero shows the group as Required (single-select
        when min = max = 1). Each option has a price change that may be 0.00 (free) or a charge. Maximum must be at
        least 1 and not below the minimum.
      source: venueManager on BO-045 Menu Management
      ref: contracts/satellite/fnb.yaml#createModifierGroup | DI-328 | screens/P08-venue-back-office.yaml#BO-045
      formats:
      - pick list (select) (derived)
    - name: Dish
      screen: BO-111
      validation: Arrives from the menu (BO-045) or the recipe with the dish chosen; otherwise a dish search by name.
        No id fields.
      source: venueManager on BO-111 Ingredient Substitution, Allergen & Nutrition
      ref: screens/P08-venue-back-office.yaml#BO-111 | F31 step 3
      formats:
      - pick list (select) (derived from the BO-111 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Substitution rule
      screen: BO-111
      validation: From ingredient, to ingredient, ratio (default 1; fresh to dried herbs is about 3 to 1), when it
        applies (Out of stock, Seasonal, Guest request, Cost saving, Always), active. A rule belongs to one recipe.
      source: venueManager on BO-111 Ingredient Substitution, Allergen & Nutrition
      ref: contracts/satellite/fnb.yaml#/components/schemas/SubstitutionRule | R125
      formats:
      - form field (derived)
      limits:
      - 3 to 1 (derived)
    - name: Needs approval
      screen: BO-111
      validation: Switched on and locked whenever the swap adds or removes an allergen ("a chef may substitute freely
        within a claim; changing the claim is somebody else's decision").
      source: venueManager on BO-111 Ingredient Substitution, Allergen & Nutrition
      ref: contracts/satellite/fnb.yaml#setSubstitutionRules
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Declared allergens
      screen: BO-111
      validation: The 14 declarable allergens as chips (gluten, crustaceans, eggs, fish, peanuts, soybeans, milk,
        nuts, celery, mustard, sesame, sulphites, lupin, molluscs) in English and Arabic.
      source: venueManager on BO-111 Ingredient Substitution, Allergen & Nutrition
      ref: contracts/satellite/fnb.yaml#/components/schemas/AllergenCode | R096
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - screen: POS-002
      see: fnb-retail#F18
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: fnb#getMenu
      what: Read a menu with sections and items
      steps:
      - 1
      block_a: true
    - operation: fnb#updateMenu
      what: Amend a menu
      steps:
      - 1
      block_a: true
      writes: true
    - operation: fnb#applyMenuActions
      what: Do the same thing to many items at once
      steps:
      - 2
      block_a: true
      writes: true
    - operation: fnb#getAllergenVerification
      what: The last allergen verdict recorded for a dish
      steps:
      - 3
      block_a: true
    - operation: fnb#scheduleMenuPublish
      what: Publish it on a date, not now
      steps:
      - 4
      block_a: true
      writes: true
    - operation: fnb#publishMenu
      what: Make the draft live, now or on a date
      steps:
      - 5
      block_a: true
      writes: true
    - operation: catalogue#getLatestBundle
      what: Pull the current bundle for this workstation's venue
      steps:
      - 6
      block_a: true
    - operation: fnb#rollbackMenu
      what: Put the previous version back
      steps:
      - 7
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        published: Drafted, scheduled, live on every till. The ordinary outcome.
        rolledBack: Published and reverted as a new version. The history shows both, which is the only way to answer
          what was being charged at any moment.
        heldForApproval: Repricing above threshold, drafted and waiting on a signature.
        scheduledPending: Drafted and dated, not yet live. Visible as pending rather than invisible — the state a
          venue could not see before `scheduleMenuPublish`.
      failure_branches:
      - at_step: 2
        what_goes_wrong: The repricing crosses the venue's approval threshold.
        user_sees: '`createApprovalRequest` before publish. The same mechanism as a stock write-off — one approval
          path, different subjects.'
        recovery: medium; resolved by approvals#createApprovalRequest
      - at_step: 4
        what_goes_wrong: A schedule already exists for that date.
        user_sees: Refused, with the existing schedule named. Two publishes on one date is a race, and the loser is
          silently discarded — a venue with three pending changes and no way to see them is the state `scheduleMenuPublish`
          was built to end.
        recovery: high; resolved by fnb#scheduleMenuPublish
      - at_step: 6
        what_goes_wrong: A workstation is offline when the bundle publishes.
        user_sees: 'It keeps the old catalogue and takes the new one on reconnect. That is correct and it is also
          a real exposure: a till offline across a price change sells at yesterday''s prices and nobody knows until
          the sync. `maxOfflineHours` bounds how long that can last.'
        recovery: high; resolved by tenancy#setOfflinePolicy
      - at_step: 7
        what_goes_wrong: Orders were taken at the wrong price before the rollback.
        user_sees: Rolling back does not correct them. The orders stand at what they were charged, and the correction
          is a refund or a goodwill comp — a system that silently reprices settled orders is a system that changes
          the past.
        recovery: high; resolved by orders#createRefund
    - screen: BO-045
      name: Menu Management
      shows:
      - element: Menu list
        rule: 'One row per menu: name, outlet, service period sentence, live version ("Live v7 since 28 Oct"), and
          a draft indicator when there are unpublished changes. No ids, no raw sections array.'
      - element: Version and schedule status
        rule: Version badges Draft, Scheduled, Live, Superseded; a version written by a rollback reads "Restored from
          v5". Pending schedules are listed pending first, then by date, each with a Cancel link.
      - element: Item flags
        rule: Each item row carries small flags the Command Center asks for - "No recipe" (item not stock-tracked),
          "86" (unavailable, with reason), and the allergen verdict state. Counts for the loaded menu may head the
          list; venue-wide attention counts are not drawn.
      - element: Allergen verdict
        rule: Undeclared allergens first, in danger colour, each with where it came from (ingredient, substitution,
          modifier, shared equipment) and the source line; over-declared second in amber ("safe, still worth fixing");
          then "Checked 14:02 after a recipe change" or "after a manual re-check". No check yet …
      - element: Prices
        rule: In the venue currency with its own scale (AED 46.00; BHD and KWD to 3 decimals, never rounded). Bulk
          repricing previews show old and new price side by side.
      - element: Who owns the price
        rule: 'F&B owns its prices: the F&B service has its own catalogue table (prices were migrated into F&B so
          ticketing scales on its own), so the menu item''s price is F&B''s price, and an outlet may set its own.
          The central catalogue prices tickets and single-price booths only; never draw a central catalogue …'
      states:
        loading: The menu list.
        error: Could not load. Names which read failed and leaves the menu untouched.
        emptyFirstRun: No menu yet. Offers Create menu (`createMenu`); distinct from a filter that matched nothing.
        emptyNoResults: Nothing matches the filter on outletId, activeAt and the menu are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listMenus` requires to show this screen,
          and names that permission (the screen's other reads need `SCOPE_VIEW` and say so in …
      failure_branches:
      - screen: BO-045
        what_goes_wrong: The repricing crosses the venue's approval threshold
        user_sees: Publishing waits for approval; the change list shows which lines need approval and by whom (as
          FNB-2J draws), and Publish is disabled with that reason.
      - screen: BO-045
        what_goes_wrong: A menu never published
        user_sees: Shows "Never published" instead of a live version; tills do not have it.
      - screen: BO-045
        what_goes_wrong: A recipe is added to an item
        user_sees: The item becomes stock-tracked and can no longer be sold on an offline till; the item row shows
          this so the manager is not surprised at the next outage.
      - screen: BO-045
        what_goes_wrong: Outlets in different Region time zones
        user_sees: A schedule for "1 Nov" goes live at each outlet's local midnight; the confirmation states the local
          time ("00:00 GST, 1 Nov 2026").
    - screen: BO-111
      name: Ingredient Substitution, Allergen & Nutrition
      shows:
      - element: Allergen verdict
        rule: Undeclared first (danger), each with its route - ingredient, substitution, modifier or shared equipment
          - and the line it came from; over-declared second (amber); "Matches the label" in neutral when clean; when
          it ran and why ("after a substitution change", "manual re-check").
      - element: Allergens by ingredient line
        rule: A table of recipe lines with the allergens each brings and a "Changed" tag on a line whose allergens
          changed since the last check (FNB-2L).
      states:
        loading: The saved ingredient substitution allergen.
        error: Could not load. Names which read failed and leaves the ingredient substitution allergen untouched.
        emptyFirstRun: No ingredient substitution allergen configured. The form opens empty and `setRecipe` saves
          the first one; it says what the platform does in the meantime.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `getAllergenVerification` requires to show
          this screen, and names that permission. Never an empty table — that reads as *there is …
      failure_branches:
      - screen: BO-111
        what_goes_wrong: No check has run yet for this dish
        user_sees: '"Not checked yet" with a Re-check button, never an empty or green panel.'
      - screen: BO-111
        what_goes_wrong: A supplier change introduces an allergen into a sub-recipe
        user_sees: Every dish using it shows Undeclared, and the screen says how many dishes and menus are affected
          so the menus can be republished (FNB-2L "Dishes affected 18, menus to republish 6").
      - screen: BO-111
        what_goes_wrong: An allergen-changing substitution is used at the till for a guest request
        user_sees: It is offered only if approved; otherwise it does not appear as a till option.
    - screen: POS-002
      see: fnb-retail#F18
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: BO-045
      screen_name: Menu Management
      block_a: true
      user_sees: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what
        is a draft, what is scheduled, and the history a refund dispute asks about ("what were we charging at noon").'
      user_does: The manager opens the live menu and starts a draft.
      operations:
      - fnb#getMenu
      - fnb#updateMenu
      result: A new version in `draft`. The live version keeps selling — an edit that takes effect as it is typed
        is an edit made under pressure at 11am on a Saturday.
    - frame: 2
      screen: BO-045
      screen_name: Menu Management
      block_a: true
      user_sees: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what
        is a draft, what is scheduled, and the history a refund dispute asks about ("what were we charging at noon").'
      user_does: They reprice a category rather than forty items.
      operations:
      - fnb#applyMenuActions
      result: Previewed before applied, always. The preview names how many items each action touches, because *reprice
        all* and *reprice all in this category* differ by four hundred dirhams a day.
    - frame: 3
      screen: BO-111
      screen_name: Ingredient Substitution, Allergen & Nutrition
      block_a: true
      user_sees: 'For one dish, what is actually in it against what its label claims: allergens derived from the recipe
        lines, the approved substitutions for that recipe and the modifier groups, plus nutrition.'
      user_does: An item's recipe changed, so its allergens are re-verified.
      operations:
      - fnb#getAllergenVerification
      result: A substituted ingredient changes the allergen claim. BL-127 built allergens without linking substitution,
        and `verifyAllergens` is the one remaining gap this step names.
    - frame: 4
      screen: BO-045
      screen_name: Menu Management
      block_a: true
      user_sees: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what
        is a draft, what is scheduled, and the history a refund dispute asks about ("what were we charging at noon").'
      user_does: The draft is scheduled for Monday rather than published now.
      operations:
      - fnb#scheduleMenuPublish
      result: Takes effect at the outlet's local midnight, not the tenant's. A venue in Dubai and one in London do
        not change menu at the same instant.
    - frame: 5
      screen: BO-045
      screen_name: Menu Management
      block_a: true
      user_sees: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what
        is a draft, what is scheduled, and the history a refund dispute asks about ("what were we charging at noon").'
      user_does: Monday arrives. The schedule fires and the version goes live.
      operations:
      - fnb#publishMenu
      result: The previous version stays readable, which is what makes step 7 possible — and a price change that cannot
        be undone is a price change nobody makes on a Friday.
    - frame: 6
      screen: POS-002
      screen_name: Sell — Ticket Catalogue
      block_a: true
      user_sees: 'The cashier''s ticket sale: category tiles, product cards and a persistent cart, with date, time
        and seats in a slide-in drawer so the cashier never leaves the sell screen.'
      user_does: The till picks it up in its next catalogue bundle.
      operations:
      - catalogue#getLatestBundle
      result: Every workstation on the new prices. A till mid-sale finishes at the old price — a catalogue that changes
        under an open cart is a guest charged something they were not shown.
      crosses_device: true
    - frame: 7
      screen: BO-045
      screen_name: Menu Management
      block_a: true
      user_sees: 'The F&B manager''s home for one outlet''s menus: which menus the outlet has, what is live, what
        is a draft, what is scheduled, and the history a refund dispute asks about ("what were we charging at noon").'
      user_does: The new price is wrong on eleven items. The manager rolls back.
      operations:
      - fnb#rollbackMenu
      result: The restored version becomes a new version rather than deleting the bad one. A menu history that can
        be edited cannot answer *what were we charging at noon*, and that is exactly what a refund dispute asks.
      crosses_device: true
    motion:
    - what: Draft preview diff
      how: Changed prices show old struck through beside the new value, highlighted until applied.
      timing: Static highlight
    - what: Scheduled publish
      how: A "Goes live Mon 00:00 (outlet time)" chip with a countdown in days/hours.
      timing: Updates each minute
    decisions:
    - 'answers-2-oct-batch1.md L11, L22-27: F&B owns its own catalogue table; menu price is the F&B price; an outlet
      may set its own price'
    - 'BO-045: F&B prices are owned by F&B: the F&B service has its own catalogue table (prices migrated into F&B
      so ticketing scales in isolation); an outlet may set its own price. The central catalogue prices tickets and
      single-price booths. Fix the stale MenuItem …'
    - 'BO-045: Not answered by Chinmay: the workbook cell repeats the superseded first BO-045 price answer. The question
      (R197 escalation of menu publish/rollback) takes its drawn default. (Chinmay 2026-10-02)'
    - 'BO-045: Not answered by Chinmay: the workbook cell repeats the superseded first BO-045 price answer. The question
      (scheduled menu publish time of day) takes its drawn default. (Chinmay 2026-10-02)'
    - 'BO-111: Drawn default stands (answer: "Default / recommended accepted"): Draw "Needs approval - head chef"
      as a state on the rule with no approve button until decided. (Chinmay 2026-10-02)'
    - 'BO-111: Drawn default stands (answer: "Default / recommended accepted"): Leave a Nutrition section drawn but
      marked "coming later". (Chinmay 2026-10-02)'
    - 'POS-002: Drawn default accepted: Refund, Check transaction, Print last receipt, plus search. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L63: 33–40 | BO-081, BO-1065, BO-110, BO-111, BO-136 | Yes / recommended | Defaults.'
    sources:
    - flows/F31-a-menu-is-drafted-scheduled-and-rolled-back.yaml
