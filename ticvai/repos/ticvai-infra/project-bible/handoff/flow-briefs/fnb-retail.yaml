      source: venueManager on BO-009 Pricing Rules
      ref: contracts/spine/catalogue.yaml#copyPriceList
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: dynamic rule
      screen: BO-009
      limits:
      - minimum and maximum price of each action shown b
