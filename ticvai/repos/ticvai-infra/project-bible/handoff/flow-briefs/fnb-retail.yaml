  F108:
    title: A guest orders food at a counter and collects it
    process: fnb-retail
    block_a:
      screens:
      - POS-021
      - POS-022
      - POS-005
      - KIT-002
      operations:
      - orders#addCartLine
      - fnb#createFnbOrder
      - orders#createOrder
      - orders#createPayment
      - promotions#evaluatePromotions
      - fnb#getGuestMenu
      - fnb#listKitchenTickets
      - fnb#markOrderCollected
      - fnb#setKitchenTicketStatus
      screens_outside_block_a: []
    trigger:
      description: A guest at a counter wants food. Until 24 August no till in the platform could take that order
        — the kitchen display received tickets, the back office configured the menu, and nothing sold.
    actors:
      roles:
      - cashier
      apps:
      - Venue POS (P04)
      - Kitchen Display (P15)
    offline: Selling and sending both work offline. The menu is cached and the kitchen display is on the same LAN,
      so a venue-wide outage stops both and a device outage stops neither. Configuration is refused offline. A table
      layout edited on two disconnected tablets is two layouts, and the room only has one.
    inputs:
    - name: Menu item tap with modifiers
      formats:
      - tap on a Food & Drink board tile; option groups as chips/radio per group
      limits:
      - groups and min/max selections as set on the item (getGuestMenu)
      validation:
      - 'A required option group blocks Add until chosen: the group header shows "Choose 1" in the error colour'
      - Sold-out (86) items show "Sold out" and cannot be added
      source: Cashier on POS-021
    - name: Tender
      formats:
      - card on the payment terminal
      - cash
      - gift card
      - wallet
      limits:
      - the order total
      validation:
      - 'Declined card: terminal message and "Try another tender"; the sent order stays on the rail'
      source: Guest via the cashier on POS-005
    - name: Order type
      screen: POS-021
      validation: 'Segmented control in the cart: Dine-in · Quick service · Takeaway · Delivery (ServiceMode tableService,
        quickService, collection, delivery). Default comes from the outlet: a counter outlet opens on Quick service.
        Dine-in shows only where the outlet has a table layout (DI-107); choosing it routes to the floor (POS-028)
        to pick a table, since a table-service order needs a table visit. Quick service asks for no guest …'
      source: cashier on POS-021 Sell — Food & Drink
      ref: DI-789 | DI-790 | DI-107 | R125 | contracts/satellite/fnb.yaml#/components/schemas/ServiceMode | contracts/satellite/fnb.yaml#createFnbOrder
      formats:
      - pick list (select) (derived)
      limits:
      - only where the outlet has a table layout (DI-107 (derived)
    - name: Dish options (modifiers)
      screen: POS-021
      limits:
      - minimum above zero is required and the Add butto
      - maximum caps choices (single choice = radio
      - up to 2"
      validation: Tapping an item with option groups opens a side panel (not a full-screen step) listing the item's
        groups in order. A group with a minimum above zero is required and the Add button stays disabled until it
        is met; the maximum caps choices (single choice = radio, several = checkboxes with "choose up to 2"). Each
        option shows its price change ("+ AED 5.00") or "Free"; options flagged default are pre-ticked. The group
        …
      source: cashier on POS-021 Sell — Food & Drink
      ref: contracts/satellite/fnb.yaml#/components/schemas/ModifierGroup | DI-328 | F108 step 2 | DI-102 | DI-1050
      formats:
      - number field (derived)
    - name: Quantity
      screen: POS-021
      validation: Stepper on the cart line; setting it to 0 removes the line (no separate confirm).
      source: cashier on POS-021 Sell — Food & Drink
      ref: R123
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Note to the kitchen
      screen: POS-021
      limits:
      - 200 characters
      validation: Optional free text per line, 200 characters. Allergy notes are allowed here and must be visually
        distinct (they are surfaced prominently on the kitchen ticket).
      source: cashier on POS-021 Sell — Food & Drink
      ref: contracts/satellite/fnb.yaml#/components/schemas/CreateFnbOrderLine
      formats:
      - text field (derived)
    - name: Meal from a ticket (combo redemption)
      screen: POS-021
      formats:
      - QR
      validation: Scanning a guest's ticket QR that carries a meal entitlement adds the meal at AED 0.00 with a "Included
        with ticket" tag. A second redemption is refused with the time it was used. For a group of 2–4 the cashier
        may assign each meal to a ticket; larger groups redeem centrally.
      source: cashier on POS-021 Sell — Food & Drink
      ref: DI-287 | DI-290 | contracts/satellite/fnb.yaml#/components/schemas/CreateFnbOrderLine
      limits:
      - 2–4 (derived)
    - name: Guest
      screen: POS-021
      validation: Optional. "Link guest" is a search field in the cart (mobile or email) that finds or creates a profile
        inline.
      source: cashier on POS-021 Sell — Food & Drink
      ref: DI-783
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Discount / promo code
      screen: POS-021
      validation: Applied on the cart, never on the payment screen. Automatic promotions apply by themselves on every
        cart change.
      source: cashier on POS-021 Sell — Food & Drink
      ref: DI-786 | contracts/satellite/promotions.yaml#evaluatePromotions
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Payment timing (an outlet setting)
      screen: POS-021
      validation: Pay first, or Send to kitchen first then pay (R261 per outlet). Under Pay first the primary button
        is "Charge AED 110.25" and the kitchen receives the order once paid; under Send first the primary is "Send
        to kitchen", then "Charge".
      source: cashier on POS-021 Sell — Food & Drink
      ref: decided 2 October 2026 by Chinmay (CHG-NOTE-004)
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: What is sent
      screen: POS-022
      validation: 'Everything comes from the cart: order type, lines with options and notes, the table visit for dine-in,
        and the course of each line for table service (starters, mains, desserts as the outlet names them). Nothing
        is typed on this step.'
      source: cashier on POS-022 Send to Kitchen
      ref: contracts/satellite/fnb.yaml#createFnbOrder | DI-333
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Buzzer number
      screen: POS-022
      validation: Where the outlet hands out pagers, the cashier scans or keys the pager number at send; it prints
        on the receipt.
      source: cashier on POS-022 Send to Kitchen
      ref: contracts/satellite/fnb.yaml#/components/schemas/KitchenTicket
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: How the guest proved it was theirs (at collection)
      screen: POS-022
      formats:
      - QR
      validation: 'One tap: Order number (default) · Buzzer · Name · QR · None. Recorded with the collection.'
      source: cashier on POS-022 Send to Kitchen
      ref: contracts/satellite/fnb.yaml#markOrderCollected
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: tender
      screen: POS-005
      validation: Card, cash, Apple Pay or Google Pay, gift card or voucher, wallet; split on any tender with Add
        to split, Exact, Half and quick amounts; Complete enables once the parts cover the total. Discounts are never
        applied here.
      source: cashier on POS-005 Payment
      ref: DI-788; POSV2-5; DI-786; DI-079
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: buyer details above AED 10,000
      screen: POS-005
      validation: Name, address and TRN for a full tax invoice.
      source: cashier on POS-005 Payment
      ref: screens/P04-point-of-sale.yaml#POS-005 gaps (Order.buyerTrn)
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - screen: KIT-002
      see: fnb-retail#F29
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: fnb#getGuestMenu
      what: The menu a guest sees
      steps:
      - 1
      block_a: true
    - operation: orders#addCartLine
      what: Add something
      steps:
      - 1
      block_a: true
      writes: true
    - operation: promotions#evaluatePromotions
      what: Evaluate promotions against a cart
      steps:
      - 2
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#createFnbOrder
      what: Place an F&B order
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#listKitchenTickets
      what: Kitchen ticket queue
      steps:
      - 3
      block_a: true
      offline_capable: true
    - operation: orders#createPayment
      what: Take a payment against an order
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: orders#createOrder
      what: Create an order
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#setKitchenTicketStatus
      what: Advance a kitchen ticket
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#markOrderCollected
      what: The guest took it
      steps:
      - 6
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        collected: Ordered, sent, paid, made, collected. The ordinary case.
        removedUnavailable: An 86’d item sold from cache, refused at the pass and taken off the order before payment.
        uncollected: Made and never taken. Real, recurring, and worth counting.
      failure_branches:
      - at_step: 3
        what_goes_wrong: An item was 86’d while the till was offline.
        user_sees: Sent, then refused by the kitchen, before anybody pays. Because the order reaches the pass before
          the charge (audit R261), the cashier removes the line and the guest pays for what can be made; nothing is
          refunded. Unavoidable that it happens at all — a cached menu cannot know what the kitchen decided thirty
          seconds ago, and refusing to sell from cache would stop the counter entirely.
        recovery: medium; resolved by fnb#setItemAvailability
      - at_step: 3
        what_goes_wrong: The kitchen display is unreachable.
        user_sees: The order is journaled and retries, and the charge still follows. A counter that loses an order
          the guest then pays for is the failure this prevents.
        recovery: high; resolved by fnb#createFnbOrder
      - at_step: 3
        what_goes_wrong: The outlet's payment timing is Pay first.
        user_sees: 'The guest pays before anything reaches the kitchen (decided 2 October 2026, Chinmay, POS-021:
          "Two configurations: one takes the bill (payment) first, the other sends first and charges after"; DEC-064,
          refines audit R261 per outlet; CHG-CSA-010, CHG-CSP-004, CHG-DOC-013). The outlet setting `Outlet.paymentTiming`
          is `payFirst`: `createFnbOrder` creates the order with no kitchen tickets and the till goes to payment …'
        recovery: recoverable; resolved by The outlet setting (BO-044); createFnbOrder honours it (not in contracts)
      - at_step: 4
        what_goes_wrong: The guest walks away without paying.
        user_sees: The kitchen ticket is cancelled while it is still `ordered` or `accepted`; once it is in preparation
          it is voided with a reason, never silently dropped (audit R125 (3)). The cost of sending first is the occasional
          ticket made for nobody, and it is counted.
        recovery: medium; resolved by fnb#cancelFnbOrder
      - at_step: 6
        what_goes_wrong: Nobody collects it.
        user_sees: Recorded as uncollected rather than closed. An uncollected rate at a counter is a calling or a
          signage problem, and closing it silently tells the venue nothing.
        recovery: low; resolved by fnb#markOrderCollected
    - screen: POS-021
      name: Sell — Food & Drink
      shows:
      - element: Menu board
        rule: 'Tabs are the menu''s sections in the outlet''s own order (not alphabetical), each with its item count.
          Item tiles: photo, name, short description, price; fast sellers may be configured larger (button sizes come
          from the Menu Builder). The header names the menu in force and when it ends: "All-day menu …'
      - element: Unavailable items
        rule: Shown in place, greyed, labelled "Unavailable" with the return time where one is set ("Back at 18:00");
          never removed and not tappable. A change made in the kitchen appears on this till immediately.
      - element: Allergens
        rule: Allergen icons on the item's side panel (and a small marker on the tile); always present, never optional.
      - element: Cart
        rule: Each line shows its chosen options indented under it with their price changes, the note in italics,
          then Subtotal, Discount, VAT and Total. Money in the venue currency with its own scale (2 decimals AED;
          3 for BHD/KWD, never rounding the third). After Send to kitchen the cart shows the order number …
      - element: Header
        rule: Outlet name and order type ("Bite & Go · Quick service"). Never "kitchen fires on payment".
      states:
        loading: The menu board, sections in the order the outlet set them.
        error: Could not load. The last published menu is still on the device — a till that stops selling because
          a panel failed is worse than a stale panel.
        emptyFirstRun: No menu published for this outlet. Names the back-office screen that publishes one rather than
          showing an empty board.
        emptyNoResults: Nothing matches this section.
        emptyNoAccess: You do not have permission to sell at this outlet.
        offline: Selling continues from the cached menu. 86 changes made while offline arrive on sync, which is why
          an item can be sold that the kitchen has just marked unavailable — the kitchen …
        denied: Ordering is refused without `payment.take`. The kitchen is not fired, so nothing is cooked against
          a sale that cannot be paid for.
        soldOutByCount: A dish whose daily count reached zero shows Sold out and cannot be added; the kitchen or the
          back office sets tomorrow's count (DEC-194; CHG-CSA-017).
      failure_branches:
      - screen: POS-021
        what_goes_wrong: The guest walks away after the order was sent and before paying
        user_sees: 'Cancel order on the unpaid order: allowed while the order is still ordered or accepted (accepted
          needs void authority, a supervisor PIN); once the kitchen is preparing it is a void with a reason. The ticket
          is never silently dropped and the waste is counted.'
      - screen: POS-021
        what_goes_wrong: An item was marked unavailable while this till was offline
        user_sees: 'It is sold from the cached menu, then refused by the kitchen at Send to kitchen, before anyone
          pays: the line is flagged, the cashier removes it and the guest pays for what can be made. Nothing is refunded.'
      - screen: POS-021
        what_goes_wrong: The kitchen display cannot be reached
        user_sees: The order is journaled and retried; the cart shows "Sent · waiting for kitchen" in amber and Charge
          is still allowed. The order must never be lost after the guest has paid.
      - screen: POS-021
        what_goes_wrong: The till is offline
        user_sees: Selling continues from the cached menu with the offline banner. Items the contract treats as stock-tracked
          (recipe-linked) are refused offline today and must be shown as "Needs connection" rather than failing at
          Send (see corrections).
      - screen: POS-021
        what_goes_wrong: Required options not chosen
        user_sees: Add stays disabled with the group named ("Choose a cooking level"); never a server error after
          the fact.
      - screen: POS-021
        what_goes_wrong: No menu published for this outlet
        user_sees: Says so and names where it is published (Menu Management in Venue Management), not an empty board.
    - screen: POS-022
      name: Send to Kitchen
      shows:
      - element: Sent confirmation
        rule: Large order number, the stations it went to as small chips (Grill · Fryer · Bar) and the estimated ready
          time ("Ready about 12:52"). Printed on the receipt with the buzzer number at Charge.
      - element: Counter rail
        rule: This outlet's orders, Ready for pickup first, then Preparing; each card shows the order number, order
          type, items, and the time since it became ready ("Ready 4 min"), which turns amber then red. Order to ready
          is the kitchen's clock; ready to collected is the counter's.
      - element: Wait to quote
        rule: Orders ahead and the age of the oldest, as two numbers, so a cashier quotes the wait the kitchen is
          actually working to.
      states:
        loading: The send kitchen list.
        error: Could not load. Names which read failed and leaves the send kitchen untouched.
        emptyFirstRun: No send kitchen yet. Offers Create F&B order (`createFnbOrder`); distinct from a filter that
          matched nothing.
        emptyNoResults: Nothing matches the filter on stationId, status and the send kitchen are still there. Names
          the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listKitchenTickets` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
        offline: Queued locally and sent on reconnect. The kitchen display is on the same LAN, so a venue-wide outage
          stops both and a device outage stops neither.
        denied: The rail is readable and Send to kitchen is refused without `payment.take`. Tickets already fired
          are unaffected.
      failure_branches:
      - screen: POS-022
        what_goes_wrong: The kitchen display is unreachable when sending
        user_sees: The order is journaled and retried; the confirmation says "Waiting for kitchen" in amber; Charge
          still follows.
      - screen: POS-022
        what_goes_wrong: The till is offline
        user_sees: Sending still works over the venue network to the kitchen display; the server receives the order
          when it is replayed. How the till reaches the display offline is still an open architecture decision.
      - screen: POS-022
        what_goes_wrong: The kitchen refuses an item that was 86'd while the till was offline
        user_sees: The line is flagged on the sent order before payment; remove it and charge for the rest. Nothing
          is refunded.
      - screen: POS-022
        what_goes_wrong: Payment is declined after the order was sent
        user_sees: The order stays on the rail unpaid and flagged "Not paid"; retry the tender or cancel the order.
      - screen: POS-022
        what_goes_wrong: Nobody collects a ready order
        user_sees: It is recorded as uncollected, not silently closed; uncollected orders are counted.
    - screen: POS-005
      name: Payment
      shows:
      - element: receipt and tickets
        rule: Receipt with VAT breakdown and booking reference; tickets printed (or emailed for dynamic-QR events);
          back to a new sale after a few seconds.
      states:
        loading: The payment list.
        error: Could not load. Names which read failed and leaves the payment untouched.
        emptyFirstRun: No payment yet. Offers Create payment (`createPayment`); distinct from a filter that matched
          nothing.
        emptyNoResults: 'Never shown: the payment screen completes one sale and has no list filter.'
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listRetailSales` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* …
        offline: Cash completes locally and journals. Card does not — an offline card approval the acquirer never
          saw is a sale that vanishes at settlement
      failure_branches:
      - screen: POS-005
        what_goes_wrong: Card outcome unknown
        user_sees: '"Check payment status", never a second charge.'
      - screen: POS-005
        what_goes_wrong: Offline
        user_sees: Cash only; card disabled with the reason.
    - screen: KIT-002
      see: fnb-retail#F29
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: POS-021
      screen_name: Sell — Food & Drink
      block_a: true
      user_sees: 'The counter till for food and drink: a cashier at a quick-service counter, café or bar (Bite & Go,
        a pool bar) takes a guest''s order from the outlet''s menu in force, adds the dish options, picks the order
        type, then sends the order to the …'
      user_does: The cashier takes the order from the menu board.
      operations:
      - fnb#getGuestMenu
      - orders#addCartLine
      result: Sections in the order the outlet set them, not alphabetical. A menu board that sorts by name puts Desserts
        above Mains forever.
    - frame: 2
      screen: POS-021
      screen_name: Sell — Food & Drink
      block_a: true
      user_sees: 'The counter till for food and drink: a cashier at a quick-service counter, café or bar (Bite & Go,
        a pool bar) takes a guest''s order from the outlet''s menu in force, adds the dish options, picks the order
        type, then sends the order to the …'
      user_does: Modifiers are chosen — no onions, large, extra shot.
      operations:
      - promotions#evaluatePromotions
      result: The group is attached to the item, not chosen per sale. *How would you like that cooked* is one group
        on nine steaks.
    - frame: 3
      screen: POS-022
      screen_name: Send to Kitchen
      block_a: true
      user_sees: The step that puts a till's food order on the kitchen rail before the guest pays, gives the guest
        an order number (and buzzer where used), and later lets the counter hand over the ready order.
      user_does: The order goes to the pass before the guest pays.
      operations:
      - fnb#createFnbOrder
      - fnb#listKitchenTickets
      result: 'Send to kitchen, then charge (decided 28 September, audit R261), as POS-022 says. A kitchen ticket
        on the rail while the card is still in the guest''s hand; this is the step that did not exist — `createFnbOrder`
        was reachable from the guest app and the staff app and from no till. That is the default, not the only order:
        an outlet set to *Pay first* charges before anything reaches the kitchen (decided 2 October 2026, …'
    - frame: 4
      screen: POS-005
      screen_name: Payment
      block_a: true
      user_sees: Payment at the till, shared by every sell board.
      user_does: The guest pays.
      operations:
      - orders#createPayment
      - orders#createOrder
      result: The same payment path as a ticket. A till has one tender flow, not one per module.
    - frame: 5
      screen: KIT-002
      screen_name: Kitchen Display System (KDS)
      block_a: true
      user_sees: 'The station display on the kitchen wall: the tickets this station must make, in the order the kitchen
        should make them, bumped with one touch or a bump bar by someone wearing gloves.'
      user_does: The kitchen makes it and bumps it.
      operations:
      - fnb#setKitchenTicketStatus
      result: Ready. The counter sees it on the same rail.
      crosses_device: true
    - frame: 6
      screen: POS-022
      screen_name: Send to Kitchen
      block_a: true
      user_sees: The step that puts a till's food order on the kitchen rail before the guest pays, gives the guest
        an order number (and buzzer where used), and later lets the counter hand over the ready order.
      user_does: The guest is called and takes it.
      operations:
      - fnb#markOrderCollected
      result: Order to ready is the kitchen’s number; ready to collected is the counter’s. Food under a lamp for nine
        minutes shows in neither alone.
      crosses_device: true
    motion:
    - what: Kitchen rail (KIT-002)
      how: New tickets slide in at the right-hand end in server order; a bumped ticket collapses out and the rail
        closes the gap. Recalled tickets slide back in with a "Recalled" tag.
      timing: Arrives within 2 s of the send (poll/push from listKitchenTickets); slide 200 ms
    - what: Ticket age timer
      how: Each ticket header counts up mm:ss from fired time; the header turns amber, then red, against the outlet
        target time.
      timing: Ticks every 1 s
    - what: Line bump
      how: Tapped lines strike through; a whole-ticket bump flashes the header green before it leaves the rail.
      timing: 150 ms flash, 200 ms exit
    - what: Cart line add
      how: The tapped item drops into the cart panel and the total rolls to the new value.
      timing: 150 ms
    - what: Modifier sheet
      how: Slides up over the board when an item with option groups is tapped; slides down on Add.
      timing: 200 ms
    - what: Order number board (KIT-007, mirrored on the till queue)
      how: Order number moves from Preparing to Ready column with a highlight pulse; disappears on collection.
      timing: Pulse 1 s, repeats every 30 s while uncollected (default)
    decisions:
    - 'answers-2-oct-batch1.md L8: POS-021 payment timing is an outlet setting, "Pay first" or "Send first then pay"
      (refines R261)'
    - 'answers-2-oct-batch1.md L380: KIT-007 read-only order numbers, preparing/ready, no buttons; handover on KIT-006'
    - 'answers-2-oct-batch1.md L373: payment timing follows POS-021, both configurations'
    - 'ids in the flow: R261, DEC-064, CHG-CSA-010, CHG-CSP-004, CHG-DOC-013, R125 (3)'
    - 'POS-021: Outlet setting ''Payment timing'': Pay first, or Send to kitchen first then pay. Refines R261 per
      outlet. (Chinmay 2026-10-02)'
    - 'POS-021: Not answered: the workbook cell repeats the sibling POS-021 payment-timing answer. The question takes
      its drawn default. (Chinmay 2026-10-02)'
    - 'POS-021: Not answered: the workbook cell repeats the sibling POS-021 payment-timing answer. The question takes
      its drawn default. (Chinmay 2026-10-02)'
