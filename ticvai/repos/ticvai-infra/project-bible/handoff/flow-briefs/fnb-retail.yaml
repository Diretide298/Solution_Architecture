      screen: BO-007
      validation: '"New product" offers the four creation paths the client asked for: start from scratch, from a saved
        template, clone an existing product, import a file (BO-117), plus "Describe it to the assistant" (BO-117).
        Kind is chosen first because it decides which sections the configuration shows.'
      source: venueManager on BO-007 Product Directory
      ref: DI-439 | DI-440 | TRACKER Actions row 124
