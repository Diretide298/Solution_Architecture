  F76:
    title: Stock is counted, requested, transferred and received
    process: fnb-retail
    block_a:
      screens:
      - BO-081
      operations:
      - inventory#createInventoryItem
      screens_outside_block_a:
      - BO-079
      - BO-078
      - BO-080
      - BO-051
    trigger:
      description: A store runs low, asks for stock, and it arrives from somewhere else in the venue.
    actors:
      roles:
      - storekeeper
      apps:
      - Venue Management (P08)
    offline: Counting and receiving work offline; requisitioning does not. A request nobody can see is a request nobody
      fills.
    inputs:
    - name: Base unit
      screen: BO-081
      validation: The unit stock is held and counted in (piece, can, bottle, kg, litre, ml). Required. Locked with
        a lock icon and "Used in stock movements, cannot change" once the item has movements.
      source: storekeeper on BO-081 Inventory Items
      ref: contracts/satellite/inventory.yaml#/components/schemas/InventoryItem | contracts/satellite/inventory.yaml#updateInventoryItem
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Purchase unit and factor
      screen: BO-081
      validation: 'How the supplier sells it, written as a sentence the user completes: "1 [case] = [24] [can]". Default
        factor 1.'
      source: storekeeper on BO-081 Inventory Items
      ref: DI-343 | contracts/satellite/inventory.yaml#/components/schemas/CreateInventoryItemRequest
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Costing method
      screen: BO-081
      validation: Weighted average or FIFO. Required at creation. Locked once the item has movements, with the reason
        shown.
      source: storekeeper on BO-081 Inventory Items
      ref: DI-344 | contracts/satellite/inventory.yaml#createInventoryItem
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Reorder point / Reorder quantity / Par level
      screen: BO-081
      validation: 'Helper text: reorder point is when to reorder, reorder quantity is how much a suggestion orders,
        and par level is the level to top up to. All three are in the base unit. Reorder alerts and suggested requisitions
        run from them.'
      source: storekeeper on BO-081 Inventory Items
      ref: DI-345 | DI-234 | contracts/satellite/inventory.yaml#getSuggestedRequisitions
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Preferred supplier
      screen: BO-081
      validation: Picker of the tenant's active suppliers. Suppliers on hold are not offered. Can be cleared with
        "None".
      source: storekeeper on BO-081 Inventory Items
      ref: R171 | R183 | contracts/satellite/inventory.yaml#updateInventoryItem
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Perishable and shelf life
      screen: BO-081
      validation: Perishable off by default. On, "Shelf life (days)" shows, and every goods receipt of this item needs
        an expiry date.
      source: storekeeper on BO-081 Inventory Items
      ref: DI-345 | contracts/satellite/inventory.yaml#/components/schemas/CreateGoodsReceiptRequest
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Allow negative stock
      screen: BO-081
      validation: Off by default. Turning it on shows "Only for bar items mid-service. Issues can exceed what is recorded
        on hand."
      source: storekeeper on BO-081 Inventory Items
      ref: contracts/satellite/inventory.yaml#/components/schemas/CreateInventoryItemRequest
      formats:
      - form field (derived)
      limits:
      - Only for bar items mid-service (derived)
    - name: Kit components
      screen: BO-081
      validation: 'For a retail bundle sold as one item: components and the quantity per kit. A component cannot itself
        be a kit, and an item with its own movements cannot become one. Kit availability is "fewest whole kits the
        components make".'
      source: storekeeper on BO-081 Inventory Items
      ref: MATRIX 4.4.20 | contracts/satellite/inventory.yaml#setInventoryKitDefinition
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Stock location (setup)
      screen: BO-081
      validation: Code, name, kind (Main store, Sub-store, Kitchen, Bar, Retail floor, Cellar) and parent location.
        Shown as an editable tree on its own "Locations" tab.
      source: storekeeper on BO-081 Inventory Items
      ref: DI-345 | contracts/satellite/inventory.yaml#createStockLocation
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    processing:
    - operation: inventory#cancelStockCount
      what: Abandon a count
      steps:
      - 1
      block_a: false
      writes: true
    - operation: inventory#listStockCounts
      what: List stock counts
      steps:
      - 1
      block_a: false
    - operation: inventory#recountStockCount
      what: Send a count back to be recounted
      steps:
      - 1
      block_a: false
      writes: true
    - operation: inventory#createInventoryItem
      what: Create an inventory item
      steps:
      - 2
      block_a: true
      writes: true
    - operation: inventory#createStockLocation
      what: Create a stock location
      steps:
      - 2
      block_a: false
      writes: true
    - operation: inventory#getInventoryItem
      what: Read an item with stock position
      steps:
      - 2
      block_a: false
      offline_capable: true
    - operation: inventory#listInventoryItems
      what: List inventory items
      steps:
      - 2
      block_a: false
      offline_capable: true
    - operation: inventory#listStockLocations
      what: List stock locations
      steps:
      - 2
      - 3
      block_a: false
      offline_capable: true
    - operation: inventory#lookupInventoryItem
      what: Look up by barcode or SKU
      steps:
      - 2
      block_a: false
      offline_capable: true
    - operation: inventory#approveRequisition
      what: Approve, reject or return a requisition
      steps:
      - 3
      block_a: false
      writes: true
    - operation: inventory#cancelRequisition
      what: Cancel a requisition
      steps:
      - 3
      block_a: false
      writes: true
    - operation: inventory#compareQuotations
      what: Compare quotations for a requisition
      steps:
      - 3
      block_a: false
    - operation: inventory#getSuggestedRequisitions
      what: Draft requisitions from reorder points
      steps:
      - 3
      block_a: false
    - operation: inventory#listRequisitions
      what: List requisitions
      steps:
      - 3
      block_a: false
      offline_capable: true
    - operation: inventory#listStockTransfers
      what: List transfers
      steps:
      - 4
      block_a: false
    - operation: inventory#receiveStockTransfer
      what: Receive a transfer
      steps:
      - 4
      block_a: false
      writes: true
    - operation: inventory#acknowledgePurchaseOrder
      what: Record the supplier acknowledgement
      steps:
      - 5
      block_a: false
      writes: true
    - operation: inventory#cancelPurchaseOrder
      what: Cancel a purchase order
      steps:
      - 5
      block_a: false
      writes: true
    - operation: inventory#closePurchaseOrderShort
      what: Close an order accepting the balance will not arrive
      steps:
      - 5
      block_a: false
      writes: true
    - operation: inventory#createPurchaseOrder
      what: Raise a purchase order
      steps:
      - 5
      block_a: false
      writes: true
    - operation: inventory#getPurchaseOrder
      what: Read a purchase order with receipt progress
      steps:
      - 5
      block_a: false
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: The chain ran as the client drew it.
        stoppedAtModule: A licence boundary, not a failure.
      failure_branches:
      - at_step: 1
        what_goes_wrong: A step in the chain is not licensed for this tenant.
        user_sees: The chain stops at the module boundary. `requiresModule` on each screen decides — a tenant without
          the retail licence does not see the retail half, and the journey is shorter rather than broken.
        recovery: medium; resolved by white-label#getModuleEnablement
    - screen: BO-081
      name: Inventory Items
      shows:
      - element: Item list
        rule: 'Name, SKU, category, base unit, purchase unit ("case of 24"), costing method, on hand (all locations),
          reorder point, and a "Below reorder point" badge. Filters: category, below reorder point, search (name,
          SKU, barcode), scan.'
      - element: Item detail
        rule: Stock by location (on hand, allocated, available), on order, in transit, average cost and last purchase
          price (AED), and an "In use since <date>, base unit and costing method locked" note when it has movements.
      states:
        loading: The inventory items list.
        error: Could not load. Names which read failed and leaves the inventory items untouched.
        emptyFirstRun: No inventory items yet. Offers Create inventory item (`createInventoryItem`); distinct from
          a filter that matched nothing.
        emptyNoResults: Nothing matches the filter on venueId, categoryId, belowReorderPoint, search and the inventory
          items are still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `listInventoryItems` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
      failure_branches:
      - screen: BO-081
        what_goes_wrong: Item deactivated while stock is on hand
        user_sees: Warn "<n> still on hand at <locations>". Deactivation does not remove stock.
      - screen: BO-081
        what_goes_wrong: Scan with no signal in a store room
        user_sees: Item lookup by barcode works offline from cache.
    steps:
    - frame: 1
      screen: BO-079
      screen_name: Stock Count
      block_a: false
      user_sees: 'Stock Count is the supervisor''s side of counting: start a full, cycle or spot count at a location,
        watch progress, review the variance once counting is submitted, send lines back for recount, and post.'
      user_does: Stock Count.
      operations:
      - inventory#cancelStockCount
      - inventory#listStockCounts
      - inventory#recountStockCount
      result: Drawn by the client as RET-4F. 3 operations on this step.
    - frame: 2
      screen: BO-081
      screen_name: Inventory Items
      block_a: true
      user_sees: 'Inventory Items is the item master: what the venue stocks, in which unit, how it is bought, how
        it is costed, when it needs reordering, and where it can be held (the location hierarchy).'
      user_does: Inventory Items.
      operations:
      - inventory#createInventoryItem
      - inventory#createStockLocation
      - inventory#getInventoryItem
      - inventory#listInventoryItems
      - inventory#listStockLocations
      - inventory#lookupInventoryItem
      result: Drawn by the client as RET-4B. 7 operations on this step.
    - frame: 3
      screen: BO-078
      screen_name: Requisitions
      block_a: false
      user_sees: 'Requisitions is the purchase request: a department asks to buy, its head approves, returns or rejects
        it, quotations are compared, and the approved request becomes a purchase order.'
      user_does: Requisitions.
      operations:
      - inventory#approveRequisition
      - inventory#cancelRequisition
      - inventory#compareQuotations
      - inventory#getSuggestedRequisitions
      - inventory#listRequisitions
      - inventory#listStockLocations
      result: Drawn by the client as RET-4C. 9 operations on this step.
    - frame: 4
      screen: BO-080
      screen_name: Stock Transfers
      block_a: false
      user_sees: 'Stock Transfers moves stock between any two stock locations: outlet to outlet, warehouse to outlet,
        outlet to warehouse, and between venues.'
      user_does: Stock Transfers.
      operations:
      - inventory#listStockTransfers
      - inventory#receiveStockTransfer
      result: Drawn by the client as RET-4D. 2 operations on this step.
    - frame: 5
      screen: BO-051
      screen_name: Purchase Orders
      block_a: false
      user_sees: Purchase Orders is where the buyer turns an approved requisition and its chosen quotation into an
        order, sends it, records the supplier's acknowledgement, and later cancels it or closes it short.
      user_does: Goods Receipt.
      operations:
      - inventory#acknowledgePurchaseOrder
      - inventory#cancelPurchaseOrder
      - inventory#closePurchaseOrderShort
      - inventory#createPurchaseOrder
      - inventory#getPurchaseOrder
      result: Drawn by the client as RET-4E. 7 operations on this step.
      crosses_device: true
    motion:
    - none (static configuration screens; the only change on screen is the saved/validation state)
    decisions:
    - 'answers-2-oct-batch1.md L385: one approveRequisition call with decision approve/reject/return'
    - 'BO-081: Drawn default stands (answer: "Default / recommended accepted"): Two options. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L63: 33–40 | BO-081, BO-1065, BO-110, BO-111, BO-136 | Yes / recommended | Defaults.'
    sources:
    - flows/F76-stock-is-counted-requested-transferred-and-recei.yaml
    - DI-343
    - DI-344
    - DI-345
    - DI-234
    - MATRIX 4.4.20
    - MATRIX 4.5.35
    - handoff/design-notes (screens BO-081)
    open:
    - none
