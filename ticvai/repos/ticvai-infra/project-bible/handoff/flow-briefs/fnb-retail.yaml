      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: price matrix (setPrices)
      screen: BO-009
      validation: Edit as a grid (ticket type rows, price list or channel columns) rather than a list of rows; amounts
        in the region's currency and scale with no currency picker (PR-2); an empty cell means "not sold on this list",
        distinct from 0.00, which must be typed and confirmed.
      source: venueManager on BO-009 Pricing Rules
      ref: contracts/spine/catalogue.yaml#setPrices | DI-140 | TRACKER Actions row 196 | ADR-0008
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: priority
      screen: BO-009
      validation: Integer with a stated direction; until the contract says which way it runs, label it "Higher number
        wins when two lists apply" and show the lists that overlap in date and channel.
      source: venueManager on BO-009 Pricing Rules
      ref: contracts/spine/catalogue.yaml#createPriceList | DI-595
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: copyPriceList adjustment
