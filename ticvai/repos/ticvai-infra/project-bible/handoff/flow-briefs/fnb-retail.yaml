    - handoff/design-notes (screens BO-045, BO-111, POS-002)
    open:
    - question: What happens to a scheduled publish when the menu it drafts is edited again before the date? The obvious
        answer is that the schedule carries the version rather than the menu, so a later edit makes a new draft and
        leaves the schedule alone — but it is not stated anywhere, and a venue that edits a …
      default: 'The schedule carries the version: editing the menu after scheduling makes a new draft and the schedule
        keeps the scheduled version; the screen warns "A newer draft exists and is not scheduled".'
  F32:
    see: platform-foundation#F32
    note: One copy per flow, kept in the owning process (the process of the trigger screen). The fnb-retail copy was
      merged into platform-foundation#F32 on 3 Oct.
  F35:
    title: Stock arrives short and an oversell is resolved
    process: fnb-retail
    block_a:
      screens:
      - EMP-065
      operations:
      - inventory#createStockMovement
      - fnb#logColdChain
      screens_outside_block_a:
      - BO-049
      - BO-080
      - BO-079
    trigger:
      description: A store is low on a line and another store has it. The client's own pack threads this — the transit
        damage on one transfer causes the oversell, the recount flags and the claim, across four frames of Board 4.
    actors:
      roles:
      - storekeeper
      apps:
      - Staff App (P06)
      - Venue Management (P08)
    offline: Receiving works offline — a loading bay is where coverage is worst and a delivery does not wait. Lines
      journal and post on sync. The claim and the approval do not. Both are commercial acts against a counterparty,
      and one raised offline against a transfer that never synced is a claim about nothing.
    inputs:
    - name: Received quantities and rejection
      formats:
      - quantity per manifest line
      - reason (damaged in transit, wrong item, short)
      - cold-chain temperature °C where the line is chilled
      limits:
      - received + rejected ≤ dispatched
      validation:
      - A chilled line out of range is rejected at the door with the reading kept
      source: Receiver on EMP-065
    - name: Delivery
      screen: EMP-065
      validation: 'Scan the delivery note or pick from today''s expected deliveries for this location: supplier orders
        that are sent or partly received, and inbound transfers in transit. Show supplier or sending store, reference
        and number of lines.'
      source: storekeeper on EMP-065 Receiving
      ref: F35 step 2 | contracts/satellite/inventory.yaml#getStockTransfer
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Temperature (chilled and frozen)
      screen: EMP-065
      validation: 'Reading in °C with the threshold shown, and a decision: Accept, Accept with note, Partly reject,
        Reject. Taken before posting. A breach opens a major corrective action automatically.'
      source: storekeeper on EMP-065 Receiving
      ref: F28 step 1 | R125 | contracts/satellite/fnb.yaml#logColdChain
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Received quantity per line
      screen: EMP-065
      validation: Big steppers; scan an item to jump to its line. "All as sent / as ordered" shortcut. The limit for
        a supplier order is outstanding plus the tolerance (proposed 5%).
      source: storekeeper on EMP-065 Receiving
      ref: R094 | contracts/satellite/inventory.yaml#createGoodsReceipt
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Batch and expiry
      screen: EMP-065
      validation: Expiry required for perishable items. A date picker that defaults to empty, never to today. "Add
        batch" splits a line.
      source: storekeeper on EMP-065 Receiving
      ref: R171 | DI-345
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Rejection
      screen: EMP-065
      validation: 'Per receipt line: quantity, reason (Damaged, Wrong item, Quality failure, Short-dated, Over-delivery,
        Other) and a note, required for Other.'
      source: storekeeper on EMP-065 Receiving
      ref: R171 | R222 | contracts/satellite/inventory.yaml#rejectReceivedGoods
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    processing:
    - operation: inventory#getStockPositions
      what: Stock on hand by item and location
      steps:
      - 1
      - 5
      block_a: false
      offline_capable: true
    - operation: inventory#createStockTransfer
      what: Send stock to another location
      steps:
      - 1
      - 7
      block_a: false
      writes: true
    - operation: inventory#getStockTransfer
      what: One transfer, its manifest and where it is
      steps:
      - 2
      block_a: false
      offline_capable: true
    - operation: inventory#receiveStockTransfer
      what: Receive a transfer
      steps:
      - 3
      - 4
      block_a: false
      writes: true
    - operation: fnb#logColdChain
      what: The temperature a delivery arrived at, and what was decided
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: inventory#closeTransferShort
      what: Close a transfer accepting the balance will not arrive
      steps:
      - 4
      block_a: false
      writes: true
    - operation: inventory#createStockMovement
      what: Record an issue, return or adjustment
      steps:
      - 6
      block_a: true
      writes: true
    - operation: inventory#startStockCount
      what: Start a stock count
      steps:
      - 8
      block_a: false
      writes: true
      offline_capable: true
    - operation: fnb#enterCountLine
      what: What was actually on the shelf
      steps:
      - 8
      block_a: false
      writes: true
      offline_capable: true
    - operation: inventory#getCountVariance
      what: Variance between counted and expected
      steps:
      - 8
      block_a: false
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        resolved: Short receipt claimed, oversell sourced from another store, position confirmed by count. The chain
          ran and the guest never knew.
        resolvedWithRefund: No alternative stock. Orders refunded as an oversell. A separate exit because the reason
          matters — this is a supply failure, and a venue that cannot count them cannot fix them.
        heldForApproval: The write-off crossed the threshold and waits on a signature.
        varianceUnexplained: The count still disagrees after everything was adjusted. The problem was never the delivery
          — and this exit is where a shrinkage investigation starts.
      failure_branches:
      - at_step: 3
        what_goes_wrong: The damage is not visible until the cases are opened.
        user_sees: Received, then adjusted. `createStockMovement` with a damage reason rather than a rejection — the
          transfer is closed and the claim is a separate conversation with the sending store, which is a worse position
          and the honest one.
        recovery: medium; resolved by inventory#createStockMovement
      - at_step: 5
        what_goes_wrong: No other store has the line.
        user_sees: The orders are refunded, and the reason is recorded as an oversell rather than a cancellation.
          A venue that logs both the same way cannot tell a supply failure from a change of mind.
        recovery: high; resolved by orders#createRefund
      - at_step: 6
        what_goes_wrong: The negative position crosses the venue's write-off threshold.
        user_sees: Routes through `createApprovalRequest`. One approval mechanism, different subjects — the same path
          a stock write-off, a menu repricing and a till variance all take.
        recovery: high; resolved by approvals#createApprovalRequest
      - at_step: 8
        what_goes_wrong: The count agrees with the adjusted position.
        user_sees: The loop closes and nothing else happens. Worth stating as an outcome, because a chain this long
          with a clean ending is the case a venue needs to be able to reach.
        recovery: low; resolved by inventory#getCountVariance
    - screen: EMP-065
      name: Receiving
      shows:
      - element: Manifest
        rule: Line by line, what is expected (ordered or sent) against what is being received. A running "Missing"
          count shows at the top.
      - element: Done
        rule: 'Receipt number (e.g. AQP-GR-000431) or "Transfer received", lines received, lines rejected, "Stock
          updated". If the device was offline: "Saved on this device, will sync" with the number from the device''s
          reserved range.'
      states:
        loading: The receiving store put-away, read by `getStockTransfer`.
        error: Could not load. Names which read failed and leaves the receiving store put-away untouched.
        emptyFirstRun: No receiving store put-away yet. Offers Create goods receipt (`createGoodsReceipt`).
        emptyNoAccess: Shown when the caller lacks `PRODUCT_VIEW`, which `getStockTransfer` requires to show this
          screen, and names that permission (the screen's other reads need `PROCUREMENT_VIEW` and …
        offline: Works from cache and queues what it records. Staff walk out of coverage constantly — a stock count
          in a warehouse corner and a table order on a terrace both happen where the …
      failure_branches:
      - screen: EMP-065
        what_goes_wrong: Offline at the loading bay
        user_sees: The receipt and the temperature reading queue. Rejection waits for the connection, and the screen
          says "Reject when back online".
      - screen: EMP-065
        what_goes_wrong: Damage found after opening the cases
        user_sees: Received, then adjusted with a damage reason (Damage, Loss & Adjustment). It is no longer a door
          rejection.
    steps:
    - frame: 1
      screen: BO-049
      screen_name: Stock Levels
      block_a: false
      user_sees: 'Stock Levels answers "what is on the shelf, and where" for one venue: on hand, allocated and available,
        by item and by stock location, valued where the user may see value.'
      user_does: The store is short. A transfer is raised against a store that has it.
      operations:
      - inventory#getStockPositions
      - inventory#createStockTransfer
      result: '`findNearbyStock` was the board''s word and `listStockLocations` is the operation. A transfer moves
        stock between locations; a requisition asks a supplier.'
    - frame: 2
      screen: EMP-065
      screen_name: Receiving
      block_a: true
      user_sees: 'Receiving is the handheld screen at the delivery door: open the expected delivery (a supplier order
        or an inbound transfer), read the manifest before touching the goods, record the temperature of chilled deliveries,
        book in what arrived …'
      user_does: The delivery arrives. The receiver opens the manifest before touching it.
      operations:
      - inventory#getStockTransfer
      result: Built 24 August because nothing read a transfer — `createStockTransfer`, `receiveStockTransfer` and
        `closeTransferShort` all existed, and the receiving store could accept a delivery it could not open first.
    - frame: 3
      screen: EMP-065
      screen_name: Receiving
      block_a: true
      user_sees: 'Receiving is the handheld screen at the delivery door: open the expected delivery (a supplier order
        or an inbound transfer), read the manifest before touching the goods, record the temperature of chilled deliveries,
        book in what arrived …'
      user_does: Two cases are damaged in transit. They are rejected at the door.
      operations:
      - inventory#receiveStockTransfer
      - fnb#logColdChain
      result: Rejected before the receipt is posted. Once stock is received it has entered the store, and a claim
        against the sender needs the reading that refused it.
    - frame: 4
      screen: BO-080
      screen_name: Stock Transfers
      block_a: false
      user_sees: 'Stock Transfers moves stock between any two stock locations: outlet to outlet, warehouse to outlet,
        outlet to warehouse, and between venues.'
      user_does: The rest is received and the transfer closes short.
      operations:
      - inventory#receiveStockTransfer
      - inventory#closeTransferShort
      result: Closing short records that the balance will not arrive — which is the claim. The board called it `raiseTransferClaim`;
        the contract calls it what it is.
    - frame: 5
      screen: BO-049
      screen_name: Stock Levels
      block_a: false
      user_sees: 'Stock Levels answers "what is on the shelf, and where" for one venue: on hand, allocated and available,
        by item and by stock location, valued where the user may see value.'
      user_does: The website has already sold four of the damaged units.
      operations:
      - inventory#getStockPositions
      result: An oversell, and it is nobody's mistake. The stock was committed against a delivery that was in transit
        and arrived broken — allocation against expected stock is what makes online selling possible and what makes
        this happen.
    - frame: 6
      screen: BO-049
      screen_name: Stock Levels
      block_a: false
      user_sees: 'Stock Levels answers "what is on the shelf, and where" for one venue: on hand, allocated and available,
        by item and by stock location, valued where the user may see value.'
      user_does: The stock goes negative and stays negative.
      operations:
      - inventory#createStockMovement
      result: A movement is written either way. A stock level that refuses to go negative is a stock level that hides
        what happened — the same rule F33 applies to an offline oversell.
    - frame: 7
      screen: BO-080
      screen_name: Stock Transfers
      block_a: false
      user_sees: 'Stock Transfers moves stock between any two stock locations: outlet to outlet, warehouse to outlet,
        outlet to warehouse, and between venues.'
      user_does: The four orders are sourced from another store instead.
      operations:
      - inventory#createStockTransfer
      result: Sourced rather than cancelled. A guest who ordered and paid does not care which store it came from,
        and cancelling is the outcome a venue reaches when it cannot see the alternative.
    - frame: 8
      screen: BO-079
      screen_name: Stock Count
      block_a: false
      user_sees: 'Stock Count is the supervisor''s side of counting: start a full, cycle or spot count at a location,
        watch progress, review the variance once counting is submitted, send lines back for recount, and post.'
      user_does: A cycle count on that line is triggered to confirm the position.
      operations:
      - inventory#startStockCount
      - fnb#enterCountLine
      - inventory#getCountVariance
      result: The count closes the loop. Theoretical against actual after a damaged delivery, a negative position
        and two transfers — and if it still disagrees, the problem was never the delivery.
    motion:
    - what: Negative stock badge
      how: A negative position shows a red badge on BO-049 that stays until a movement or count resolves it.
      timing: Static
    decisions:
    - 'ids in the flow: CHG-WIR-008'
    sources:
    - flows/F35-stock-arrives-short-and-an-oversell-is-resolved.yaml
    - DI-345
    - DI-346
    - DI-363
    - handoff/design-notes (screens EMP-065)
    open:
    - none
  F60:
    title: An online order is collected at the counter
    process: fnb-retail
    block_a:
      screens:
      - POS-012
      operations:
      - orders#listOrders
      - fnb#recordOrderHandover
      - retail#reserveMerchandise
      screens_outside_block_a: []
    trigger:
      description: A guest bought online and has come to collect. The order exists and the guest is standing there
        — the till is a handover point, not a sale point.
    actors:
      roles:
      - cashier
      apps:
      - Venue POS (P04)
    offline: Works offline against the cached order. A collection is a handover, and the handover is recorded locally
      and synced.
    inputs:
    - name: Order lookup
      formats:
      - order reference typed
      - guest name
      - scan of the media the guest carries
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      validation:
      - 'No match: "No order found for that reference" with search by name'
      source: Cashier on POS-012
    - name: Find the order
      screen: POS-012
      formats:
      - QR
      validation: By order number, guest name or the media the guest carries (QR, wristband); this outlet's open orders
        listed by due time.
      source: cashier on POS-012 Omnichannel Order & Fulfilment Center
      ref: F60 step 1 | contracts/spine/orders.yaml#listOrders
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Handover outcome
      screen: POS-012
      validation: Collected · Delivered · Served, or Guest not found · Refused (these two need a note and leave the
        order Ready). Delivered requires the delivery location and records the runner.
      source: cashier on POS-012 Omnichannel Order & Fulfilment Center
      ref: contracts/satellite/fnb.yaml#recordOrderHandover | R125
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Merchandise for collection
      screen: POS-012
      limits:
      - at least 15 minutes and at most to the end of the
      validation: Reserved before handover, not after; a reservation lasts at least 15 minutes and at most to the
        end of the visit day.
      source: cashier on POS-012 Omnichannel Order & Fulfilment Center
      ref: F60 step 2 | contracts/satellite/retail.yaml#reserveMerchandise | R169 | R215
      formats:
      - number field (derived)
    processing:
    - operation: orders#listOrders
      what: List orders
      steps:
      - 1
      block_a: true
      offline_capable: true
    - operation: retail#reserveMerchandise
      what: Reserve an item for collection
      steps:
      - 2
      block_a: true
      writes: true
    - operation: fnb#recordOrderHandover
      what: Record that an order reached the guest
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        collected: Handed over and recorded.
        sourcedElsewhere: Fulfilled from another location.
        refunded: Could not be fulfilled. Refunded at the counter rather than sent away.
      failure_branches:
      - at_step: 2
        what_goes_wrong: The item is out of stock at this counter.
        user_sees: '`sourceFromStore` finds it elsewhere in the venue. A collection that fails at the counter is a
          refund the venue did not need to make.'
        recovery: high; resolved by inventory#createStockTransfer
    - screen: POS-012
      name: Omnichannel Order & Fulfilment Center
      shows:
      - element: Order list
        rule: Order number, channel (App, Web, Kiosk, Delivery partner), order type, guest name and masked mobile,
          items, due time, paid state; ready ones first.
      states:
        loading: The omnichannel order fulfilment list.
        error: Could not load. Names which read failed and leaves the omnichannel order fulfilment untouched.
        emptyFirstRun: No omnichannel order fulfilment yet. Offers Record order handover (`recordOrderHandover`);
