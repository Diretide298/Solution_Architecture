  F83:
    title: A kitchen works a service from the rail to the exception
    process: fnb-retail
    block_a:
      screens:
      - KIT-001
      - KIT-002
      - KIT-003
      - KIT-004
      - KIT-008
      operations:
      - fnb#getFnbOrder
      - fnb#list86Events
      - fnb#listFnbOrders
      - fnb#listKitchenStations
      - fnb#listKitchenTickets
