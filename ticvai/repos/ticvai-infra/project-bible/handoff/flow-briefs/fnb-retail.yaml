      - fnb#setItemAvailability
      screens_outside_block_a: []
    trigger:
      description: A service starts and tickets arrive.
    actors:
      roles:
      - supervisor
      apps:
      - Kitchen Display (P15)
    offline: Entirely offline-capable. The kitchen still has to send food out.
    inputs:
    - name: Hold reason
      screen: KIT-003
      validation: Table not ready · Guest request · Kitchen backed up · Waiting for previous course · Other (needs
        a note).
      source: supervisor on KIT-003 Order Firing & Course Management
      ref: contracts/satellite/fnb.yaml#holdCourse | R222
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Fire at (timed coursing)
      screen: KIT-003
      validation: Only for outlets using timed coursing; empty means now.
      source: supervisor on KIT-003 Order Firing & Course Management
      ref: contracts/satellite/fnb.yaml#fireCourse
      formats:
      - form field (derived)
      limits:
      - Only for outlets using timed coursing (derived)
    - name: Prioritise
      screen: KIT-003
      validation: A reason is required (3+ characters); no position given means top of the rail; recorded against
        the person.
      source: supervisor on KIT-003 Order Firing & Course Management
      ref: contracts/satellite/fnb.yaml#prioritiseKitchenTicket | R125
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Take off sale (86)
      screen: KIT-008
      validation: Item, reason (Sold out · Ingredient unavailable · Equipment down · Seasonal · Other with a note),
        back at (optional). Immediate; works offline and replays.
      source: supervisor on KIT-008 Exceptions, Re-Fire & Unavailable Items
      ref: contracts/satellite/fnb.yaml#setItemAvailability | R110 | R222
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Kitchen exception
      screen: KIT-008
      validation: Equipment down · Item ran out · Late delivery · Staff short · Power loss · Spillage · Other (note
        required); station and ticket optional; duration in minutes.
      source: supervisor on KIT-008 Exceptions, Re-Fire & Unavailable Items
      ref: contracts/satellite/fnb.yaml#logKitchenException | R222
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - screen: KIT-002
      see: fnb-retail#F29
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: fnb#listFnbOrders
      what: List F&B orders
      steps:
      - 1
      block_a: true
    - operation: fnb#listKitchenStations
      what: List preparation stations and their routing
      steps:
      - 1
      block_a: true
      offline_capable: true
    - operation: fnb#listKitchenTickets
      what: Kitchen ticket queue
      steps:
      - 1
      - 2
      - 4
      block_a: true
      offline_capable: true
    - operation: fnb#recallKitchenTicket
      what: Bring back a ticket that was bumped by mistake
      steps:
      - 2
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#prioritiseKitchenTicket
      what: Move a ticket up the queue
      steps:
      - 3
      block_a: true
      writes: true
