  F88:
    title: An order is assembled, collected and notified
    process: fnb-retail
    block_a:
      screens:
      - KIT-006
      - KIT-002
      - KIT-003
      - KIT-004
      - KIT-001
      operations:
      - fnb#chaseStation
      - fnb#fireCourse
      - fnb#getFnbOrder
      - fnb#holdCourse
      - fnb#listFnbOrders
      - fnb#listKitchenStations
      - fnb#listKitchenTickets
      - fnb#markOrderCollected
      - fnb#notifyServer
      - fnb#printOrderLabel
      - fnb#prioritiseKitchenTicket
      screens_outside_block_a: []
    trigger:
      description: Food is ready and a guest has to be told and given it.
    actors:
      roles:
      - supervisor
      apps:
      - Kitchen Display (P15)
    offline: Offline-capable. A collection counter with no network still hands food over.
    inputs:
    - screen: KIT-002
      see: fnb-retail#F29
      note: inputs of this screen are detailed once, in that flow
    - screen: KIT-003
      see: fnb-retail#F83
      note: inputs of this screen are detailed once, in that flow
    - screen: KIT-004
      see: fnb-retail#F83
      note: inputs of this screen are detailed once, in that flow
    - screen: KIT-001
      see: fnb-retail#F83
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: fnb#chaseStation
      what: The pass asks a station where an item is
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#markOrderCollected
      what: The guest took it
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#printOrderLabel
      what: A label for the bag
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#listKitchenTickets
      what: Kitchen ticket queue
      steps:
      - 2
      - 4
      - 5
      block_a: true
      offline_capable: true
    - operation: fnb#notifyServer
      what: The kitchen calls the server to the pass
      steps:
      - 2
      block_a: true
      writes: true
    - operation: fnb#fireCourse
      what: Send a held course to the pass
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#holdCourse
      what: Stop a course going out
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: fnb#prioritiseKitchenTicket
      what: Move a ticket up the queue
      steps:
      - 3
      block_a: true
      writes: true
    - operation: fnb#getFnbOrder
      what: Read an F&B order
      steps:
      - 4
      block_a: true
      offline_capable: true
    - operation: fnb#listFnbOrders
      what: List F&B orders
      steps:
      - 5
      block_a: true
    - operation: fnb#listKitchenStations
      what: List preparation stations and their routing
      steps:
      - 5
      block_a: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: The chain ran as the client drew it.
        stoppedAtModule: A licence boundary, not a failure.
      failure_branches:
      - at_step: 1
        what_goes_wrong: A step in the chain is not licensed for this tenant.
        user_sees: The chain stops at the module boundary. `requiresModule` on each screen decides — a tenant without
          the retail licence does not see the retail half, and the journey is shorter rather than broken.
        recovery: medium; resolved by white-label#getModuleEnablement
    - screen: KIT-006
      name: Expeditor & Order Assembly
      shows:
      - element: Assembly cards
        rule: 'One card per order: parts ready (ticked) and missing (with station and age); complete orders rise to
          the top.'
      - element: Bag label
        rule: Order number, guest name, items with options, allergen flags — printed from the order, not composed
          on the device.
      states:
        loading: Whole orders, in the server's order.
        error: Could not reach the platform. The rail is still live from cache and every bump is queued.
        emptyFirstRun: No tickets. The kitchen is clear, and that is worth saying plainly rather than showing a blank
          rail — a screen that looks broken and a screen that means nothing to do are the same …
        emptyNoResults: Nothing matches this station or course filter. The rail is not empty — the filter is narrow,
          and on a kitchen screen that distinction is the difference between calm and panic.
        emptyNoAccess: This display is not assigned to a station. Assignment is a back-office act — a kitchen screen
          does not choose what it shows. A principal without `ORDER_VIEW` gets this state …
        offline: Amber, and it keeps working. The kitchen still has to send food out — a display that blanks mid-service
          is worse than one that says it is behind, and every bump journals locally …
      failure_branches:
      - screen: KIT-006
        what_goes_wrong: Offline
        user_sees: Chase, label and hand-over work offline and sync.
    - screen: KIT-002
      see: fnb-retail#F29
      note: outputs of this screen are detailed once, in that flow
    - screen: KIT-003
      see: fnb-retail#F83
      note: outputs of this screen are detailed once, in that flow
    - screen: KIT-004
      see: fnb-retail#F83
      note: outputs of this screen are detailed once, in that flow
    - screen: KIT-001
      see: fnb-retail#F83
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: KIT-006
      screen_name: Expeditor & Order Assembly
      block_a: true
      user_sees: The expeditor at the pass assembles orders whose parts come from several stations, chases a station
        that is holding the rest up, prints the bag label for takeaway and delivery, and hands over.
      user_does: Expeditor & Order Assembly.
      operations:
      - fnb#chaseStation
      - fnb#markOrderCollected
      - fnb#printOrderLabel
      result: Drawn by the client as FNB-3F. 3 operations on this step.
    - frame: 2
      screen: KIT-002
      screen_name: Kitchen Display System (KDS)
      block_a: true
      user_sees: 'The station display on the kitchen wall: the tickets this station must make, in the order the kitchen
        should make them, bumped with one touch or a bump bar by someone wearing gloves.'
      user_does: Kitchen Display System (KDS).
      operations:
      - fnb#listKitchenTickets
      - fnb#notifyServer
      result: Drawn by the client as FNB-3B. 4 operations on this step.
      crosses_device: true
    - frame: 3
      screen: KIT-003
      screen_name: Order Firing & Course Management
      block_a: true
      user_sees: 'The pass (head chef or expeditor) for table service: courses of each table — starters before mains
        — and when the next course goes.'
      user_does: Order Firing & Course Management.
      operations:
      - fnb#fireCourse
      - fnb#holdCourse
      - fnb#prioritiseKitchenTicket
      result: Drawn by the client as FNB-3C. 4 operations on this step.
      crosses_device: true
    - frame: 4
      screen: KIT-004
      screen_name: Active Order Management & Fulfilment Journey
      block_a: true
      user_sees: 'One order''s journey across stations for the pass or a supervisor: which of its kitchen tickets
        are ready, which are still on which station, and how it will be handed over.'
      user_does: Active Order Management & Fulfilment Journey.
      operations:
      - fnb#getFnbOrder
      - fnb#listKitchenTickets
      result: Drawn by the client as FNB-3D. 2 operations on this step.
      crosses_device: true
    - frame: 5
      screen: KIT-001
      screen_name: Kitchen Operations Command Center
      block_a: true
      user_sees: 'The kitchen supervisor''s or head chef''s overview of the whole kitchen during service: how deep
        each station''s rail is, the oldest ticket and how late it is against its target, held courses, refires and
        86''d items, and a way into each …'
      user_does: Kitchen Operations Command Center.
      operations:
      - fnb#listFnbOrders
      - fnb#listKitchenStations
      - fnb#listKitchenTickets
      result: Drawn by the client as FNB-3A. 3 operations on this step.
      crosses_device: true
    motion:
    - what: Kitchen rail (KIT-002)
      how: New tickets slide in at the right-hand end in server order; a bumped ticket collapses out and the rail
        closes the gap. Recalled tickets slide back in with a "Recalled" tag.
      timing: Arrives within 2 s of the send (poll/push from listKitchenTickets); slide 200 ms
    - what: Ticket age timer
      how: Each ticket header counts up mm:ss from fired time; the header turns amber, then red, against the outlet
        target time.
      timing: Ticks every 1 s
    - what: Line bump
      how: Tapped lines strike through; a whole-ticket bump flashes the header green before it leaves the rail.
      timing: 150 ms flash, 200 ms exit
    - what: Chase station
      how: A chased station's tile pulses on the expeditor view until the item is bumped.
      timing: Pulse 1 s loop
    - what: Order number board (KIT-007)
      how: Number moves Preparing → Ready with a highlight; leaves on collection.
      timing: Pulse 1 s
    decisions:
    - 'answers-2-oct-batch1.md L380: KIT-007 read-only order numbers in server order'
