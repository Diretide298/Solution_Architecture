        recovery: Reconnect; the screen picks up where it was (derived)
    steps:
    - frame: 1
      flowStep: 1
      screen: GST-042 Simple Registration & OTP
      block: A
      sees: >-
        Get a guest into the app, fast, on a device that may be shared: a one-time code to the email or mobile, a password,
        Apple or Google, or UAE Pass, or register a ...
      does: They register — social, UAE Pass, or an email (with a password if they want one).
      calls:
      - identity#guestSocialLogin
      - identity#guestUaePassLogin
      - identity#registerGuest
      result: >-
        Three doors, one subject. UAE Pass is the one that matters locally, and it arrives verified in a way an email never
        is.
    - frame: 2
      flowStep: 2
      screen: GST-042 Simple Registration & OTP
      block: A
      sees: >-
        Get a guest into the app, fast, on a device that may be shared: a one-time code to the email or mobile, a password,
        Apple or Google, or UAE Pass, or register a ...
      does: They prove the contact with a one-time code, and sign in with it or with their password later.
      calls:
      - identity#requestGuestOtp
      - identity#verifyGuestOtp
      - identity#guestPasswordLogin
      result: >-
        No enterprise SSO for guests (decided 28 September, audit R167 part 1): a guest signs in with a one-time code, a password
        (audit R073 (a)), a social provider or UAE Pass.
    - frame: 3
      flowStep: 3
      screen: WEB-016 Login / Register
      block: A
      sees: >-
        Get a guest into the site, fast, on a device that may be shared: a one-time code to the email or mobile, a password,
        Apple or Google, or UAE Pass, or register a ...
      does: A guest who checked out anonymously links their order.
      calls:
      - identity#linkGuestCheckout
      - orders#claimCart
      result: >-
        This is the operation that stops duplicates. A guest who bought without an account and registers afterwards is one
        person — and without this they are two, which is what mergeGuests then has to fix.
    - frame: 4
      flowStep: 4
      screen: GST-039 Profile
      block: A
      sees: What we hold about a guest, and what they can change.
      does: They set a profile.
      calls:
      - none
      result: Name, language, accessibility needs.
    - frame: 5
      flowStep: 5
      screen: GST-065 Newsletter & Preferences
      block: A
      sees: What we may send you, and how.
      does: And their marketing preferences.
      calls:
      - marketing-crm#recordConsent
      result: >-
        Consent is separate from preference and is never inherited. CF-160 made a merge take the narrower of two consents
        for exactly this reason.
    exits:
    - registered
    - registeredUnverified
    - linkedExisting
    motion:
    - Code boxes auto-advance; resend link counts down (duration not in package).
    - Session expired mid-booking returns to the kept screen with the basket intact.
    decisions:
    - id: R167
      says: no enterprise SSO for guests
    - id: R073
      says: password allowed for guests
    - ids:
      - R073
      - R167
    sources:
    - flows/F56
    - CF-160
    open:
    - q: Resend-code interval not in the package.
