    - name: Flow outcome (exit states)
      states:
        settled: Counted, variance accepted, deposit reconciled, ledger posted. The ordinary night.
        settledWithVariance: >-
          Above threshold and accepted on the till by a supervisor. A separate exit because it is a different conversation
          — the money reconciles either way and only one of the two gets looked at.
        forceClosed: >-
          A supervisor closed a shift the cashier did not. Recorded as such — a force-close is sometimes right and it is never
          routine.
        openWithUnsynced: >-
          The shift closed while transactions were still journalled offline. Settlement waits for the sync, and the exposure
          is visible rather than assumed away.
      failure_branches:
      - at_step: 1
        what_goes_wrong: The workstation health check fails — a dead printer, a stale bundle.
        user_sees: >-
          The shift can still open with a manager's approval, and the reason is recorded. A venue with one working till on
          a Saturday opens it; a system that refuses is a system somebody works around by selling on paper.
        recovery: medium; resolved by shift#approveShiftOpen
      - at_step: 3
        what_goes_wrong: The network drops mid-service.
        user_sees: >-
          The till keeps selling from its local journal (ADR-0013). `setOfflinePolicy` bounds what it may do and for how long:
          a refund offline is refused because the original sale cannot be verified, and after `maxOfflineHours` it refuses
          new sales rather than keep journalling.
        recovery: high; resolved by tenancy#setOfflinePolicy
      - at_step: 7
        what_goes_wrong: The variance is above the venue's threshold.
        user_sees: >-
          The blind count is submitted (`submitShiftCount`, which shows the cashier no figure; CHG-FIN-003) and the shift
          waits in `pendingVariance` while the supervisor is alerted. A supervisor accepts the variance with `acceptShiftVariance`
          (OVERSHORT_ACCEPT, PIN step-up): no approval request is raised and nothing holds the close for a Duty Manager PIN
          beforehand (decided 28 September, audit R080 (e)). Since 2 October the …
        recovery: high; resolved by acceptShiftVariance, or rejectShiftVariance and a recount (not in contracts)
      - at_step: 6
        what_goes_wrong: The cashier's shift ends and the till stays open for the next one.
        user_sees: >-
          `submitShiftCount` on the operator, not the workstation (the cashier's blind count; CHG-FIN-003). A workstation
          runs three shifts a day and each one settles its own drawer — conflating them means one cashier answering for another's
          variance.
        recovery: medium; resolved by shift#submitShiftCount
      merged: merged from the fnb-retail brief (3 Oct)
    - screen: POS-002
      see: fnb-retail#F18
      note: outputs of this screen are detailed once, in that flow
    failure_branches:
    - at_step: 12
      what: A shift was closed in error
      user_sees: Reopen on Till Home
      recovery: reopenShift with a supervisor PIN who is not the closer; the first count is kept
    steps:
    - frame: 1
      screen: POS-000 Sign In
      sees: >-
        venue co-branding (name, logo from the cached brand); Recent cashiers on this till, four tiles with their last shift;
        Cashier ID; PIN/password switch; 4-dot PIN keypad
      does: taps their tile (or types Cashier ID) and keys the PIN
      calls:
      - identity#login
      - identity#getCurrentSession
      result: session for this workstation; one role -> straight in
    - frame: 2
      screen: POS-000 Sign In
      sees: role prompt (only when several roles)
      does: picks Cashier
      calls:
      - identity#selectRole
      result: 'role decides the surface: cashier -> POS-001, kitchen -> KIT-002'
    - frame: 3
      screen: POS-001 Begin Shift
      sees: >-
        readiness strip (printer, drawer, bundle age) above the denomination rows in drawer order, total computed
      does: counts the float note by note, adds box/bag number
      calls:
      - tenancy#getWorkstationHealth
      - shift#listDenominations
      - shift#getCurrentShift
      result: readiness green; the counted total shown (the float is the cashier's own figure)
    - frame: 4
      screen: POS-001 Begin Shift
      sees: confirm "Open shift with AED 500.00?"
      does: confirms
      calls:
      - shift#openShift
      result: shift open (or pendingApproval if the venue requires open approval); lands on POS-025
    - frame: 5
      screen: POS-025 Till Home
      sees: shift chip "Shift open 08:02", quick actions, sale board tile
      does: starts selling
      calls:
      - shift#getWorkstationShift
      - tenancy#listSaleBoards
      result: POS-002 sells from the local bundle (F81)
    - frame: 6
      screen: POS-018 Safe Drop & Cash Transfer Management
      sees: drawer-over-limit warning with "Cash lift"
      does: drops AED 2,000.00 to the safe, reason Safe drop, confirms on the same device
      calls:
      - shift#createCashMovement
      - shift#withdrawFromDepositBox
      result: movement journalled; drawer back under its ceiling; never blocks a sale
    - frame: 7
      screen: POS-020 Shift Exceptions & Alerts
      sees: Record no sale with reason picker
      does: records "Change for customer"
      calls:
      - shift#recordNoSale
      result: no-sale counted on the shift timeline the supervisor reviews
    - frame: 8
      screen: POS-007 Close Shift (count)
      sees: 'denomination counter only: no expected, no running variance, no takings; reason + note offered'
      does: counts the drawer, adds "Miscount?" note optional
      calls:
      - shift#listDenominations
      - shift#listCashMovements
      result: closeStep count -> summary
    - frame: 9
      screen: POS-007 Close Shift (summary)
      sees: counted total and the lines; "Close and sign out"
      does: submits
      calls:
      - shift#submitShiftCount
      result: >-
        within threshold: "Shift closed" -> POS-001; beyond: "Your count is with your supervisor", chip "Under review", supervisors
        alerted
    - frame: 10
      screen: POS-000 Sign In (next cashier)
      sees: the till door again, the previous cashier signed out
      does: the next cashier signs in; POS-001 then counts their own float and opens the shift (frames 3 and 4 again,
        shift#openShift on POS-001, which binds it; flows/F32 steps 11 and 12)
      calls:
      - identity#login
      - identity#getCurrentSession
      result: 'signed in and on to POS-001: a pendingVariance shift never blocks the next one (DEC-059, DEC-173)'
    - frame: 11
      screen: POS-007 Close Shift (supervisor, any till)
      sees: 'supervisor PIN prompt; after it: counted, expected, variance and the count lines note by note. A different
        person from frame 10: the supervisor, signed in at any till, comes from Till Home (POS-025 to POS-007), never
        straight from the door, because a door lands only on screens anyone signed in may open (check-doors
        D-LANDING-READ; 3 Oct, CHG-RONEC-002)'
      does: >-
        enters PIN and reason; chooses Accept shift variance / Ask for a recount / Close shift for the cashier
      calls:
      - shift#getShiftCountLines
      - shift#acceptShiftVariance
      - shift#rejectShiftVariance
      - shift#closeShift
      result: >-
        accept -> closed, boxes reconciled; recount -> cashier sees "Recount requested"; close -> closed with expected and
        variance recorded
    - frame: 12
      screen: POS-025 Till Home (reopen)
      sees: closed shift row with Reopen (locked icon for a cashier)
      does: supervisor enters PIN and a reason
      calls:
      - shift#reopenShift
      result: shift reopened; the first count kept beside the new one
    - frame: 13
      screen: POS-000 Sign In (take over)
      sees: 'login refused 409: "This till is in use by Sara A."; Ask a supervisor'
      does: >-
        supervisor enters PIN in the session panel, sees who holds the till and whether their shift is open, taps Take the
        till over
      calls:
      - identity#listActiveSessions
      - identity#forceLogout
      result: the other session ends, their float and shift do not move; the new operator signs in
    exits:
    - settled
    - underReview (resolved later in BO-043)
    - recountRequested
    - forceClosed (supervisor closed it)
    - sessionTakenOver
    motion:
    - >-
      PIN dots fill one per digit (4 dots); on denied the dots clear and the denied line appears under them. No shake timing
      in the package.
    - Recent-cashier tiles page four at a time (horizontal swipe).
    - >-
      Supervisor session panel slides in from the context side after the PIN prompt; the Take the till over confirm dialog
      names who is signed out.
    - >-
      Float and close counters: the counted total recounts live as each denomination stepper changes (counted only; expected
      is never animated or shown to the cashier).
    - >-
      Shift chip changes colour state: Shift open -> Under review (amber) -> Recount requested / Shift closed.
    - Drawer-over-limit banner appears inline when the limit is crossed; it never covers the sale.
    - what: Readiness check (POS-001)
      how: >-
        Each check (printer, bundle age, terminal, drawer) ticks green in sequence; a failure stops the list red with the
        fix.
      timing: About 300 ms per item
    - what: Offline banner and unsynced counter
      how: >-
        Banner slides down when the network drops; a counter of unsynced sales increments and drains on reconnect.
      timing: Banner 200 ms
    decisions:
    - id: CHG-FIN-003
      says: >-
        blind close: the cashier never sees expected cash, a variance or takings from which it could be worked out
    - id: 'DEC-059 / DEC-173 (answers batch 3 #1, batch 6 #173)'
      says: >-
        cashier signs out, shift stays "Under review", never blocks the next cashier; the daily cash reconciliation resolves
        each shift
    - id: DEC-174 / PRE-1
      says: supervisor accepts or closes with their PIN on any till or in BO-043; closeShift declared on POS-007
    - id: DEC-175
      says: reject + recount, counted blind again (DI-804)
    - id: RUL-1, RUL-2, CHG-RUL-019
      says: >-
        supervisorStepUp travels in the body of closeShift, acceptShiftVariance, rejectShiftVariance and reopenShift; a deposit-box
        withdrawal carries witnessStepUp instead (the PIN of the cashier the cash came from, who countersigns on the same device;
        DEC-178); both optional in schema, refused without them (corrected 3 Oct, CHG-RONEC-002)
    - id: CHG-SPF-012 (answers 3 Oct, Block A business rules)
      says: >-
        session management stays on POS-000 behind a supervisor PIN step-up (reverses CHG-DOOR-003 for this door); BO-053
        keeps it too
    - id: R184
      says: a second sign-in is refused 409; only a supervisor ends the other session
    - id: POSV2-9, DEC-550
      says: >-
        POS-000 v2 accepted: co-branding, recent cashiers four at a time, cashier-ID entry, PIN/password switch
    - id: DEC-179
      says: drawer limit warns and offers a cash lift, never blocks
    - ids:
      - CHG-CSP-012
      - CHG-CSP-013
