    - input: Registration
      operations:
      - identity#registerGuest
      - identity#requestGuestOtp
      - identity#verifyGuestOtp
      - identity#guestPasswordLogin
      - identity#guestSocialLogin
      - identity#guestUaePassLogin
      does: one subject whatever the door; deviceId and venueId sent (venue decides guest 2-step)
    - input: Anonymous checkout link
      operations:
      - identity#linkGuestCheckout
      - orders#claimCart
      does: links an anonymous order to the account; unmatched is left unlinked
    - input: Consent
      operations:
      - marketing-crm#recordConsent
