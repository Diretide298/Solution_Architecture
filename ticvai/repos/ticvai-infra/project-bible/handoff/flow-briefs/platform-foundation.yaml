    open:
    - q: >-
        flows/F32-*.yaml carried the old steps (sign-in on POS-001, cashier sees expected, cashier accepts the variance).
        Done 3 October 2026 (CHG-RONEC-002): flows/F32 now walks this brief (POS-000 sign-in, blind close, Under review,
        next cashier never blocked, supervisor PIN for accept / reject / close / reopen, sessions on POS-000 behind the PIN).
      default: none needed; kept here so the storyboard and the flow are read together
    - q: Lock threshold and exact attempt count for PIN sign-in are not in the package.
      default: show "N attempts left" from the problem detail; 5 attempts
    - q: Idle lock (v2 prototype shows "Terminal locks after 90 s idle") has no contract field.
      default: draw the 90 s lock as drawn in v2, configurable later
    offline: >-
      Steps 3 to 6 work offline and the whole platform is built for it (ADR-0013 local-first). A till that stops selling because
      the network dropped is a queue at the door. Opening and settling do not. An opening float declared offline is a float
      nobody can reconcile against the safe, and a settlement computed against a stale catalogue is a variance that is not
      a variance.
    block_a:
      screens:
      - POS-001
      - POS-002
      - POS-018
      - POS-020
      - POS-007
      - BO-024
      operations:
      - shift#acceptShiftVariance
      - shift#closeDepositBoxes
      - shift#createCashMovement
      - orders#createOrder
      - orders#createPayment
      - catalogue#getLatestBundle
      - tenancy#getWorkstationHealth
      - shift#listCashMovements
      - shift#listDenominations
      - shift#openShift
      - shift#recordNoSale
      - identity#selectRole
      - finance#settleDeposit
      - shift#submitShiftCount
      - shift#withdrawFromDepositBox
      screens_outside_block_a: []
    merged_from:
    - the fnb-retail copy of this flow (3 Oct dedupe)
    merged_detail:
      from: >-
        the fnb-retail copy: its storyboard is the old flows/F32 walk (sign-in on POS-001, cashier sees expected, cashier
        accepts the variance), superseded by the decided flow above (answers L436); kept for the record, not to draw
      trigger:
        description: >-
          A cashier arrives for a shift and signs into a till. Nothing on this platform is navigated to — a till is signed
          into, which is why every entry state on P04 resolves from the session.
      steps:
      - frame: 1
        screen: POS-001
        screen_name: Begin Shift
        block_a: true
        user_sees: >-
          Shift opening on a till, used once per cashier shift (not on every sign-in or return from a break, DI-777): the
          cashier counts the opening float note by note and coin by coin while the till checks its own hardware in parallel,
          then opens …
        user_does: The cashier signs in and picks their role for the shift.
        operations:
        - identity#selectRole
        - tenancy#getWorkstationHealth
        result: >-
          The readiness check runs before the float, not after. A till with a dead printer or a stale catalogue is a till
          that should not open — and finding that out after the cash is counted means counting it twice.
      - frame: 2
        screen: POS-001
        screen_name: Begin Shift
        block_a: true
        user_sees: >-
          Shift opening on a till, used once per cashier shift (not on every sign-in or return from a break, DI-777): the
          cashier counts the opening float note by note and coin by coin while the till checks its own hardware in parallel,
          then opens …
        user_does: They count the opening float into the drawer.
        operations:
        - shift#listDenominations
        - shift#openShift
        result: >-
          Shift `open`. `listDenominations` orders the count for the drawer, not by value — a cashier counts notes highest
          first and coins as they sit in the tray, and a screen that matches the physical drawer is counted faster and wrong
          less often.
      - frame: 3
        screen: POS-002
        screen_name: Sell — Ticket Catalogue
        block_a: true
        user_sees: >-
          The cashier's ticket sale: category tiles, product cards and a persistent cart, with date, time and seats in a slide-in
          drawer so the cashier never leaves the sell screen.
        user_does: The till pulls its catalogue and starts selling.
        operations:
        - catalogue#getLatestBundle
        - orders#createOrder
        - orders#createPayment
        result: >-
          The bundle is the catalogue. Wired to this screen on 24 August — ADR-0013 makes the POS local-first and no P04 screen
          polled for one, so a published menu would have reached no till.
      - frame: 4
        screen: POS-018
        screen_name: Safe Drop & Cash Transfer Management
        block_a: true
        user_sees: >-
          A supervisor takes cash out of a cashier's drawer for the safe or banking (a safe drop), with the cashier as witness;
          it reduces the expected close figure and is not a variance.
        user_does: A guest wants cash back and the drawer is heavy. A safe drop is recorded.
        operations:
        - shift#createCashMovement
        - shift#withdrawFromDepositBox
        result: >-
          The drawer never holds more than the venue's ceiling. A safe drop mid-shift is a security control, not bookkeeping,
          and it is recorded as a movement so the settlement adds up.
      - frame: 5
        screen: POS-020
        screen_name: Shift Exceptions & Alerts
        block_a: true
        user_sees: >-
          The supervisor's queue at the till for things that need a decision now: cash variance and drawer limit alerts, voids
          and refunds above threshold, no-sales, and approval requests from cashiers.
        user_does: A no-sale is recorded — the drawer opened with nothing sold.
        operations:
        - shift#recordNoSale
        result: >-
          Every drawer opening is accounted for. A no-sale with no reason is the single most reliable indicator of till theft,
          and it is recorded rather than prevented.
      - frame: 6
        screen: POS-007
        screen_name: Close Shift
        block_a: true
        user_sees: >-
          The end of a cashier's shift: count the drawer blind, declare non-cash totals, give a reason if the count is off,
          and close.
        user_does: End of shift. The cashier counts the drawer.
        operations:
        - shift#listDenominations
        - shift#listCashMovements
        result: >-
          Counted against expected. Expected is float plus takings minus drops — computed server-side, never typed, because
          a cashier who can see the expected figure counts to it.
      - frame: 7
        screen: POS-007
        screen_name: Close Shift
        block_a: true
        user_sees: >-
          The end of a cashier's shift: count the drawer blind, declare non-cash totals, give a reason if the count is off,
          and close.
        user_does: There is a variance of 40 dirhams short.
        operations:
        - shift#acceptShiftVariance
        - shift#submitShiftCount
        result: >-
          The variance is accepted with a reason, not corrected. A till that balances every night is a till nobody is counting,
          and a variance silently adjusted away is the shrinkage the count exists to find.
      - frame: 8
        screen: BO-024
        screen_name: Payment Exceptions
        block_a: true
        user_sees: >-
          Payments that never resolved themselves: a card charged with no response, an authorisation never captured, a deposit
          not settled, deposit boxes left open at close.
        user_does: The supervisor reviews the shift and the deposit reconciles.
        operations:
        - shift#closeDepositBoxes
        - finance#settleDeposit
        result: >-
          Cash to the safe, shift `closed`, and the ledger posted. `shift` writes `ledger.posting` here — a till closing is
          a ledger act, which is why that cross-contract write is correct.
      processing:
      - operation: identity#selectRole
        what: Choose a role for a multi-role session
        steps:
        - 1
        block_a: true
        writes: true
      - operation: tenancy#getWorkstationHealth
        what: A score a manager can sort by, and what is dragging it down
        steps:
        - 1
        block_a: true
      - operation: shift#listDenominations
        what: The notes and coins a till counts
        steps:
        - 2
        - 6
        block_a: true
        offline_capable: true
      - operation: shift#openShift
        what: Open a shift
        steps:
        - 2
        block_a: true
        writes: true
      - operation: shift#createCashMovement
        what: Record a cash lift or add
        steps:
        - 4
        block_a: true
        writes: true
        offline_capable: true
      - operation: shift#withdrawFromDepositBox
        what: A supervisor takes cash out mid-shift
        steps:
        - 4
        block_a: true
        writes: true
        offline_capable: true
      - operation: shift#recordNoSale
        what: Open the Deposit Box without a sale
        steps:
        - 5
        block_a: true
        writes: true
        offline_capable: true
      - operation: shift#acceptShiftVariance
        what: Accept an over/short beyond the threshold
        steps:
        - 7
        block_a: true
        writes: true
      - operation: shift#submitShiftCount
        what: The cashier's blind count, closing their own shift
        steps:
        - 7
        block_a: true
        writes: true
      replaced_on_3_oct:
      - >-
        A count line is mistyped (unknown denomination, duplicate, total not matching count × value) -> Refused per row; the
        total is computed on the till so this should not arise from the UI. (derived)
      - Running total rolls as each denomination quantity is entered.
      - Immediate
      - >-
        the fnb-retail copy (lifted from flows/, screens/ and contracts/; the storyboard above is the one to draw)
    superseded:
    - >-
      fnb-retail brief input "Variance reason (cashier)" (a reason required before the shift can close when the count is off)
      is not merged: the decided blind close never tells the cashier the count is off (CHG-FIN-003, answers L436); the reason
      list lives on in "Count reason and note". Its text was: "When the submitted count is off, the cashier picks a reason
      — Till error · Unrecorded refund · Miscount · Other — and adds a comment before the shift can close; Other needs the
      comment." (DI-803 | R222)
    resolved:
    - q: >-
        The brief request says the supervisor PIN is only for reject/reopen; the contract (CHG-RUL-019, RUL-2) also requires
        it on closeShift and acceptShiftVariance.
      was_default: >-
        follow the contract: PIN on all four supervisor actions; the cashier's own submitShiftCount never asks for one
      resolved_by: >-
