      flowStep: 7
      screen: SCN-014 Sync & reconciliation
      block: A
      sees: The screen nobody designs and everybody needs.
      does: The session ends and the device syncs.
      calls:
      - access#syncScans
      result: >-
        Scans posted in sequence. A duplicate scan across two devices is resolved on sync, not at the gate — refusing a guest
        because another lane might have seen them is a queue nobody accepts.
    exits:
    - admitted
    - admittedOnOverride
    - refused
    - syncedWithDuplicates
    motion:
    - >-
