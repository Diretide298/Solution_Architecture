        reportBundleApplied closes the loop. A device that pulled a bundle and never confirmed it is a device the fleet view
        believes is current.
    - frame: 3
      flowStep: 3
      screen: EMP-049 Hand over the journal
      block: later
      sees: Move an unsynced journal off a device that is going flat.
