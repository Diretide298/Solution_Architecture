  F08:
    title: Steward works a shift on the employee app
    process: platform-foundation
    trigger: A member of venue staff arrives for a shift and works through it on their phone.
    actors:
      role: supervisor
      apps:
      - P06 Venue Staff App
    inputs:
    - name: Employee number / Cashier ID
      formats:
      - numeric keypad
      - badge tap fills it (method card or rfid)
      limits: digits only; the tenant's employee-number length
      validation:
      - empty -> "Enter your employee number"
      - >-
        login 401 -> "Employee number and PIN do not match. 2 attempts left before the account locks." (the screen names which
        and how many attempts remain; POS-000 denied state)
      source: the operator, at the device door; the device sends its own workstationId (CHG-DOOR-001)
    - name: PIN or password
      formats:
      - 4-digit PIN on a keypad (method pin)
      - password text field (method password) via the PIN/password switch
      limits: >-
        PIN exactly 4 digits; password minimum 8; a tenant whose password policy forbids PINs shows password only
      validation:
      - >-
        device-bound method without workstationId -> 400 workstation-required (never reachable from the device UI)
      - locked -> "This account is locked. Ask a supervisor." (names the lock, never "wrong PIN")
      - >-
        identity unreachable -> "Can't reach sign-in. Your PIN was not checked." (error state: says the network failed, not
        the PIN)
      - >-
        temporary PIN after a reset -> New PIN twice before anything else; the last five cannot be reused (changeOwnCredential,
        audit R132)
