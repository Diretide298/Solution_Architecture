      validation:
      - provider cancelled -> back to the door, nothing created
      source: guest
    - name: Profile and consents
      formats:
      - name, language (Arabic/English), accessibility needs
      - per-purpose consent toggles
      limits: consent is separate from preference and never inherited
      validation:
