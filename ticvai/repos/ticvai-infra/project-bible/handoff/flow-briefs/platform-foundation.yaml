      validation:
      - invalid -> "Enter an email or a mobile number"
      - >-
        existing identifier -> same "check your email/phone for a code" outcome; the code signs into the existing account
      source: guest on WEB-016 / GST-042
    - name: One-time code
      formats:
      - 6 digits, numeric keypad, paste and SMS autofill
      limits: exactly six; button enables at six
      validation:
      - wrong -> "That code didn't work"
      - too many -> "Try again later or use a one-time code instead" (never names a lock)
      source: guest
    - name: Password (optional)
      formats:
      - text, show/hide
      limits: minimum 8; never required (code-only by default)
      validation:
      - under 8 -> "At least 8 characters"
      source: guest
    - name: Social / UAE Pass
      formats:
      - Apple
      - Google
      - UAE Pass
