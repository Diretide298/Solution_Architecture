  F64:
    title: A steward signs in and takes a venue and a role
    process: platform-foundation
    trigger: Somebody arrives for a shift with a shared handheld. The device is shared and the authority is not.
    actors:
      role: supervisor
      apps:
      - P06
    inputs:
    - name: Employee number / Cashier ID
      formats:
      - numeric keypad
      - badge tap fills it (method card or rfid)
      limits: digits only; the tenant's employee-number length
      validation:
      - empty -> "Enter your employee number"
      - >-
        login 401 -> "Employee number and PIN do not match. 2 attempts left before the account locks." (the screen names which
        and how many attempts remain; POS-000 denied state)
      source: the operator, at the device door; the device sends its own workstationId (CHG-DOOR-001)
    - name: PIN or password
      formats:
      - 4-digit PIN on a keypad (method pin)
      - password text field (method password) via the PIN/password switch
      limits: >-
        PIN exactly 4 digits; password minimum 8; a tenant whose password policy forbids PINs shows password only
      validation:
      - >-
        device-bound method without workstationId -> 400 workstation-required (never reachable from the device UI)
      - locked -> "This account is locked. Ask a supervisor." (names the lock, never "wrong PIN")
      - >-
        identity unreachable -> "Can't reach sign-in. Your PIN was not checked." (error state: says the network failed, not
        the PIN)
      - >-
        temporary PIN after a reset -> New PIN twice before anything else; the last five cannot be reused (changeOwnCredential,
        audit R132)
      source: the operator
    - name: Authentication code (only in mfaRequired)
      formats:
      - 6 digits from the authenticator app
      - 6 digits by email (Email me a code instead)
      limits: 6 digits; five wrong codes lock step-up for the policy's lockout minutes, never permanently
      validation:
      - wrong code -> "That code didn't work. 4 tries left."
      - >-
        fifth wrong code -> "Too many attempts. Try again at 10:42." (ADM-001 design note; the session is not ended)
      - no method enrolled -> sent to enrol first (enrolMfaMethod)
      source: >-
        only a person holding ROLE_MANAGE, LEDGER_APPROVE, any PLATFORM_* or a tenant-added permission (audit R135); a cashier
        never sees it
    - name: Venue and role
      formats:
      - picker
      limits: only venues in Session.scope; one role goes straight in
      validation:
      - 'no role at this venue -> refused at role select: "You have no role at AquaCove Dubai."'
      source: the employee on EMP-002
    processing:
    - input: Sign-in on a shared handheld
      operations:
      - identity#login
      - identity#listSsoProviders
      - identity#startSsoAuthorization
      - identity#verifyMfaChallenge
      does: PIN bounded by the device's workstationId; SSO where the venue configured it; MFA by permission
    - input: Duty start
      operations:
      - identity#getCurrentSession
      - shift#getWorkstationShift
      - maintenance#listIncidents
      does: open incidents surface before tasks
    outputs:
    - output: EMP-001 Sign in
      states:
        loading: Checking the credential. The form stays visible and disabled.
        emptyFirstRun: >-
          Nobody signed in - the normal state of a door. A shared handheld between shifts shows nothing until somebody identifies
          themselves.
        error: >-
          Identity could not be reached. Says so rather than saying the password is wrong, and keeps what was typed.
        denied: >-
          The credential does not match, or the account is locked. One message for both, with the attempts left before the
          lock;
        emptyNoAccess: >-
          Signed in, and the person holds no role in this app. Says who at the tenant grants access; distinct from a wrong
          password.
        emptyNoResults: >-
          Never shown: listSsoProviders takes no filter; a tenant with no identity provider shows no SSO buttons at all, and
          the form is the whole door.
        sessionHeld: >-
          login answered 409: this person already holds a session elsewhere (audit R184, ADR-0004). Says where and since when;
        mfaRequired: >-
          Signed in, not yet through. The principal holds a permission that requires MFA (ROLE_MANAGE, LEDGER_APPROVE, any
          PLATFORM_* permission, or one the ten ...
        offline: >-
          Signs in against the cached principal list from the last bundle; the status strip says offline. A steward at a gate
          at 08:00 still signs in.
      failure_branches:
      - at_step: 1
        what: MFA is required and the phone is in a locker.
        user_sees: >-
          Refused, and the venue has a policy problem rather than a platform one. A bypass here is a bypass for everybody.
        recovery: listMfaMethods
    failure_branches:
    - at_step: 2
      what: The principal has no role at this venue.
      user_sees: >-
        Refused at role select, not at first action. A person who signs in and then cannot do anything has been told the wrong
        thing.
      recovery: listRoles
    steps:
    - frame: 1
      flowStep: 1
      screen: EMP-001 Sign in
      block: A
      sees: >-
        Get an employee onto a shared handheld fast, and resolve the session every other screen of the staff app reads.
      does: They sign in.
      calls:
      - identity#login
      - identity#listSsoProviders
      - identity#startSsoAuthorization
      - identity#verifyMfaChallenge
      result: >-
        SSO where the venue uses it, MFA where the role demands it. A gate steward and a finance controller do not need the
        same ceremony.
    - frame: 2
      flowStep: 2
      screen: EMP-002 Select venue & role
      block: later
      sees: Confirm which hat this person is wearing today.
      does: They pick a venue and a role for the shift.
      calls:
      - identity#getCurrentSession
      result: >-
        One person, several roles, one at a time (ADR-0002). A supervisor covering a lane takes the steward role and loses
        the supervisor one until they change back.
    - frame: 3
      flowStep: 3
      screen: EMP-048 Opening checklist
      block: later
      sees: Confirm a gate is fit to open before the first guest reaches it.
      does: The opening checklist is worked.
      calls:
      - none
      result: Tasks, not a paper list. A checklist nobody records is a checklist nobody did.
    - frame: 4
      flowStep: 4
      screen: EMP-003 Home — on duty
      block: later
      sees: The screen the device sits on between tasks.
      does: They go on duty.
      calls:
      - shift#getWorkstationShift
      - maintenance#listIncidents
      result: >-
        Open incidents surface before anything else. A steward starting a shift needs yesterday’s unresolved problem before
        today’s first task.
    exits:
    - onDuty
    - blockedAtMfa
    motion:
    - Offline status strip slides down when the cached principal list is used.
    - 'Home: open incidents card first; no animation specified.'
    decisions:
    - id: ADR-0002
      says: the person carries the authority, not the device
    - id: R135
      says: MFA by permission
    - id: CHG-DOOR-001
      says: device doors send workstationId
    - ids:
      - CHG-WIR-021
    sources:
    - flows/F64
    - ADR-0002
    open:
    - q: Biometric unlock on the staff app (F08 step 1 says "Biometric or SSO") has no contract method.
      default: draw PIN/password and SSO only; biometric later
