      failure_branches:
      - what_goes_wrong: error state on BO-070
        user_sees: Could not load. Names which read failed and leaves the work orders untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-070
        user_sees: >-
          Shown when the caller lacks `WORK_ORDER_VIEW`, which `listWorkOrders` requires to show this screen, and names that
          permission. **Never an empty table** — that reads as *there is no data* and sends somebody to support with the wrong
          question. A caller who can see the screen but lacks what an action needs sees that action disabled, naming its permission:
          `MAINTENANCE_APPROVE` for `closeWorkOrder`; `MAINTENANCE_EXECUTE` for `pauseWorkOrder`, `rejectWorkOrder`; `WORK_ORDER_MANAGE`
          for `createVendorServiceRequest`, `updateVendorServiceRequest`, `createWorkOrder`, `updateWorkOrder` and 2 more.
        recovery: Ask an administrator for the permission the state names (derived)
    steps:
    - frame: 1
      flowStep: 1
      screen: BO-128 Live Workstation Health Monitor
      block: later
      sees: Watch every workstation's health live and open the worst first.
      does: The fleet is watched.
      calls:
      - tenancy#getWorkstationHealth
      - tenancy#listWorkstations
      result: A workstation that stops reporting is itself the signal.
    - frame: 2
      flowStep: 2
      screen: BO-036 Device Registry
      block: later
      sees: Know which handheld is where, and whether it has synced.
      does: The failing till is found, with its alerts.
      calls:
      - tenancy#getWorkstation
      - reporting#listAlerts
      result: Which device, where, and what it last said.
    - frame: 3
      flowStep: 3
      screen: BO-070 Work Orders
      block: later
      sees: Get something fixed, and know it was.
      does: A work order is raised to fix it.
      calls:
      - maintenance#createWorkOrder
      - maintenance#completeWorkOrder
      result: Fixed, and known to be fixed. A printer swapped without a work order is a repair nobody can count.
    - frame: 4
      flowStep: 4
      screen: BO-036 Device Registry
      block: later
      sees: Know which handheld is where, and whether it has synced.
      does: The till is confirmed healthy again.
      calls:
      - tenancy#getWorkstationHealth
      result: Reporting again, and the alert clears.
    exits:
    - completed
    - stoppedAtModule
    motion:
    - Fleet health tiles change state as heartbeats stop; the alert clears when the station reports again.
    decisions:
    - ids:
      - R261
    sources:
