flows:
  F32:
    title: A till opens, trades and settles
    process: platform-foundation
    trigger: >-
      A cashier arrives for a shift and signs into a till at the door POS-000. Nothing on the till is navigated to; it is
      signed into, and every POS screen resolves from that session.
    actors:
      roles:
      - cashier
      - supervisor (holds SESSION_FORCE_LOGOUT, OVERSHORT_ACCEPT, SHIFT_CLOSE_OTHER, SHIFT_REOPEN)
      - the next cashier on the same till
      apps:
      - P04 Venue POS (till)
      - P08 Venue Management (BO-043, via F74/F98)
    note: >-
      Assigned here because the trigger is the sign-in at the till door POS-000 (platform-foundation); the package flow starts
      at POS-001 and still describes a cashier who sees the expected figure and accepts their own variance (steps 6-7). This
      brief draws the decided version: blind close (CHG-FIN-003), "Under review" (DEC-059), supervisor PIN on any till (DEC-174,
      PRE-1), recount (DEC-175). The daily reconciliation that ends it is F74/F98 in finance-insights.yaml. The fnb-retail
      brief may also claim F32 by its entry screen POS-001: dedupe on merge.
    inputs:
    - name: Employee number / Cashier ID
      formats:
      - numeric keypad
      - badge tap fills it (method card or rfid)
      limits: digits only; the tenant's employee-number length
      validation:
      - empty -> "Enter your employee number"
      - >-
        login 401 -> "Employee number and PIN do not match. 2 attempts left before the account locks." (the screen names which
        and how many attempts remain; POS-000 denied state)
      source: the operator, at the device door; the device sends its own workstationId (CHG-DOOR-001)
    - name: PIN or password
      formats:
      - 4-digit PIN on a keypad (method pin)
      - password text field (method password) via the PIN/password switch
      limits: >-
        PIN exactly 4 digits; password minimum 8; a tenant whose password policy forbids PINs shows password only
      validation:
      - >-
        device-bound method without workstationId -> 400 workstation-required (never reachable from the device UI)
      - locked -> "This account is locked. Ask a supervisor." (names the lock, never "wrong PIN")
      - >-
        identity unreachable -> "Can't reach sign-in. Your PIN was not checked." (error state: says the network failed, not
        the PIN)
      - >-
        temporary PIN after a reset -> New PIN twice before anything else; the last five cannot be reused (changeOwnCredential,
        audit R132)
      source: the operator
    - name: Authentication code (only in mfaRequired)
      formats:
      - 6 digits from the authenticator app
      - 6 digits by email (Email me a code instead)
      limits: 6 digits; five wrong codes lock step-up for the policy's lockout minutes, never permanently
      validation:
      - wrong code -> "That code didn't work. 4 tries left."
      - >-
        fifth wrong code -> "Too many attempts. Try again at 10:42." (ADM-001 design note; the session is not ended)
      - no method enrolled -> sent to enrol first (enrolMfaMethod)
      source: >-
        only a person holding ROLE_MANAGE, LEDGER_APPROVE, any PLATFORM_* or a tenant-added permission (audit R135); a cashier
        never sees it
    - name: Recent-cashier tile
      formats:
      - 'device-local tile: face/initials, name, last shift on this till'
      limits: >-
        four at a time; no operation behind it (publishing a staff list to an unauthenticated caller is refused by design)
      validation:
      - the PIN or password is still required after the tap
      source: the till remembers who used it (POSV2-9, DEC-550)
    - name: Supervisor PIN step-up (session panel on POS-000)
      formats:
      - supervisor employee number + 4-digit PIN, masked
      limits: >-
        never stored on the till; listActiveSessions carries it in X-Supervisor-Principal-Id / X-Supervisor-Pin, forceLogout
        in body supervisorStepUp
      validation:
      - >-
        PIN fails or no SESSION_FORCE_LOGOUT -> 403 supervisor-step-up-refused: "That PIN can't end sessions on this till."
      source: a supervisor standing at the till (CHG-SPF-012, CHG-RUL-015)
    - name: Role (several roles)
      formats:
      - role picker
      limits: only when LoginResponse.requiresRoleSelection; one role goes straight in
      validation:
      - no role on this workstation -> emptyNoAccess "Signed in, but you have no role on this till."
      - >-
        A user holding several roles picks the one for this shift before the count (Cashier, Supervisor); a user with one
        role is never asked.
      source:
      - the operator
      - cashier on POS-001 Begin Shift
      ref: DI-249 | F32 step 1 | contracts/spine/identity.yaml#selectRole
    - name: Opening float
      formats:
      - count per denomination (note/coin images, stepper, typed qty) in drawer order
      - or one total where the venue takes a total
      - count per denomination (notes highest first, then coins as in the tray)
      limits:
      - >-
        region currency scale (AED 2 dp; BHD/KWD/OMR 3 dp, never rounded); denominations from listDenominations, not hard-coded
      - denominations from listDenominations for the base currency
      validation:
      - 'shift already open on this till -> 409 shift-already-open: shows whose shift it is'
      - >-
        required device absent -> 409 required-device-absent: "Receipt printer not found. Ask a supervisor to open anyway."
        (approveShiftOpen with a reason)
      - >-
        offline -> "Opening the till needs a connection. Your count is kept." (openShift is online only, R257)
      - >-
        Out-of-tolerance float needs a supervisor (at the till or remotely from the back office, answers L146)
      - >-
        One row per active denomination of the venue currency, in drawer order (notes highest first, then coins as they sit
        in the tray), each with the note or coin image, a − / + stepper and a typed quantity field (type "50" instead of tapping
        fifty times). The row total is computed, never typed. UAE: notes 1000, 500, 200, 100, 50, 20, 10, 5 AED; coins 1 AED,
        50 fils, 25 fils. 3-decimal currencies keep the third decimal.
      source:
      - the cashier on POS-001
      - cashier on POS-001 Begin Shift
      also_named:
      - Opening float count
      - Denomination count
      ref: DI-775 | DI-776 | DI-306 | R229 | F32 step 2 | contracts/spine/shift.yaml#listDenominations
    - name: Deposit box / bag number
      formats:
      - scanned or typed
      limits: up to 64 characters; only where the venue requires boxes or bag numbers
      validation:
      - missing when required -> 400, field named
      - >-
        Shown only where the venue requires deposit-box allocation or bag numbers; scanned or typed, up to 64 characters.
      source:
      - the cashier on POS-001
      - cashier on POS-001 Begin Shift
      ref: contracts/spine/shift.yaml#openShift
    - name: Safe drop
      formats:
      - amount or count by denomination
      - 'reason: Banking / Safe drop / Change order / Other (+note)'
      limits: witness = the drawer owner on the same device
      validation:
      - drawer being counted or closed -> "This drawer is being counted. Nothing can go in or out."
      source: cashier on POS-018
    - name: No-sale reason
      formats:
      - 'preset: change for customer, wrong tender, drawer check, other (+note)'
      limits: required; Other needs the note
      validation:
      - no reason -> "Pick a reason for opening the drawer"
      - >-
        Required. Pick from preset reasons (change for customer, wrong tender, drawer check, other) plus an optional note;
        "Other" requires the note. Recorded even offline.
      source:
      - cashier on POS-020
      - cashier on POS-020 Shift Exceptions & Alerts
      ref: F32 step 5 | DI-797 | contracts/spine/shift.yaml#recordNoSale
    - name: Closing count (blind)
      formats:
      - count per denomination, same counter as the float
      - declared non-cash totals per tender (card batch, wallet)
      limits:
      - >-
        no expected total, no running variance, no takings figure at any step (CHG-FIN-003); count lines validated per row
      - expected is never shown to the cashier
      validation:
      - >-
        open orders remain -> close refused, lists each held sale / unpaid order / open table with where to finish it
      - offline -> "Closing needs a connection. A variance worked out on the till is not a variance."
      - unknown or duplicate denomination -> refused per row
      - 'Over-threshold variance: shift goes "Under review"; the next cashier can still start (answers L79)'
      - >-
        Same counter as the opening float (note and coin images, stepper, typed quantity), in drawer order; the expected figure
        is withheld.
      source:
      - the cashier on POS-007
      - cashier on POS-007 Close Shift
      also_named:
      - Closing blind count
      - Counted cash by denomination
      ref: DI-803 | DI-775 | DI-776 | contracts/spine/shift.yaml#closeShift
    - name: Count reason and note
      formats:
      - Till error / Unrecorded refund / Miscount / Other
      - free-text note
      limits: offered with every count, not only after a variance (DI-803); note up to 500
      validation:
      - >-
        "Other" needs the note; the reason is otherwise optional and offered with every count, so it never tells the cashier
        the count is off (CHG-FIN-003) (derived)
      - note over 500 characters -> refused at 500 (derived)
      source: the cashier on POS-007
    - name: Supervisor decision on an Under-review shift
      formats:
      - supervisor PIN (body supervisorStepUp)
      - reason, 3-500 characters
      limits:
      - >-
        any till of the venue or BO-043; the supervisor must not be the cashier; refused without the step-up (RUL-1, RUL-2,
        CHG-RUL-019)
      - at least 3 characters
      validation:
      - own shift -> "A different supervisor must accept this."
      - no step-up or wrong PIN -> 403 supervisor-step-up-refused
      - shift already decided -> 409, the row refreshes to who decided
      - >-
        Supervisor's PIN on any till at the venue (not the cashier whose shift it is) and a reason of at least 3 characters.
        Only when the variance is above the venue threshold (proposed AED 20.00).
      source:
      - the supervisor on POS-007 (accept / ask for a recount / close for the cashier) or POS-025 (reopen)
      - cashier on POS-007 Close Shift
      also_named:
      - Supervisor acceptance
      ref: >-
        contracts/spine/shift.yaml#acceptShiftVariance | R080 | contracts/spine/tenancy.yaml#setVenueSettings | decided 2
        October 2026 by Chinmay (CHG-NOTE-004)
    - name: Total-only entry
      screen: POS-001
      validation: >-
        Where the venue is set to take the float as a single amount instead of by denomination, one amount field replaces
        the rows.
      source: cashier on POS-001 Begin Shift
      ref: DI-307
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Drawer
      screen: POS-018
      validation: Pick the open cash drawer (by cashier and till); drawers being counted or closed are not offered.
      source: cashier on POS-018 Safe Drop & Cash Transfer Management
      ref: contracts/spine/shift.yaml#listDepositBoxes | contracts/spine/shift.yaml#withdrawFromDepositBox
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Amount
      screen: POS-018
      validation: Counted by denomination where the venue counts drops; otherwise an amount.
      source: cashier on POS-018 Safe Drop & Cash Transfer Management
      ref: contracts/spine/shift.yaml#withdrawFromDepositBox
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Reason
      screen: POS-018
      validation: Banking · Safe drop · Change order · Other (Other needs a note).
      source: cashier on POS-018 Safe Drop & Cash Transfer Management
      ref: contracts/spine/shift.yaml#withdrawFromDepositBox | R222
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Witness
      screen: POS-018
      validation: The cashier whose drawer it is confirms with their own PIN on the same device (body witnessStepUp, the
        witness's principal and PIN; never the supervisor's own; DEC-178, CHG-RUL-019).
      source: cashier on POS-018 Safe Drop & Cash Transfer Management
      ref: contracts/spine/shift.yaml#withdrawFromDepositBox
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Approval decision
      screen: POS-020
      formats:
      - PIN
      validation: >-
        Approve or Reject, with a reason for a rejection. The approver must not be the requester and confirms with their own
        PIN or second factor.
      source: cashier on POS-020 Shift Exceptions & Alerts
      ref: contracts/spine/approvals.yaml#decideApprovalRequest | DI-725
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Filters
      screen: POS-020
      validation: >-
        Severity (Critical, Warning, Info) and status; no free-text ids. Workstation and shift are picked from lists, defaulting
        to this till and this shift.
      source: cashier on POS-020 Shift Exceptions & Alerts
      ref: contracts/satellite/reporting.yaml#/components/schemas/AlertSeverity
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: Non-cash totals
      screen: POS-007
      validation: >-
        Declared total per non-cash tender (card terminal batch, wallet), reconciled against captured payments after submission.
      source: cashier on POS-007 Close Shift
      ref: contracts/spine/shift.yaml#closeShift
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: id
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.id
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: orderId
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.orderId
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: tender
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.tender
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: amount
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.amount
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: tenderedAmount
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.tenderAmount
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: walletAuthorisationId
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.walletAuthorisationId
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: deviceId
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.deviceId
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
      merged: merged from the fnb-retail brief (3 Oct)
    - name: recordedAt
      screen: BO-024
      formats:
      - textField
      binds: CreatePaymentRequest.recordedAt
      source: cashier on BO-024 Payment Exceptions
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
