      merged: merged from the fnb-retail brief (3 Oct)
    - screen: POS-002
      see: fnb-retail#F18
      note: inputs of this screen are detailed once, in that flow
    processing:
    - input: Credential
      operations:
      - identity#login
      - identity#selectRole
      - identity#getCurrentSession
      does: >-
        authenticates against the tenant's principals with the device's workstationId; one principal, one session per workstation:
        a second sign-in on a held till is refused 409, never ends the other session; offline signs in against the cached
        operator list
    - input: Second factor
      operations:
      - identity#createMfaChallenge
      - identity#verifyMfaChallenge
      does: only when requiresMfa (by permission, R135); enrolment is on EMP-042, not the till
    - input: Supervisor PIN at the door
      operations:
      - identity#listActiveSessions
      - identity#forceLogout
      does: >-
        verifies the supervisor's PIN against their principal (sessionless step-up), lists who holds this till, ends that
        session; the shift and float survive, only the session ends
    - input: Readiness and float
      operations:
      - tenancy#getWorkstationHealth
      - shift#listDenominations
      - shift#getCurrentShift
      - shift#openShift
      - shift#approveShiftOpen
      does: >-
        health check runs before the count; openShift creates the shift with its own deposit box; a previous shift that is
        pendingVariance/pendingClosure does NOT block it (only open or suspended does)
    - input: Cash movements
      operations:
      - shift#createCashMovement
      - shift#withdrawFromDepositBox
      - shift#recordNoSale
      does: >-
        journals drops, lifts and no-sales against the shift; the drawer limit warns and offers a lift, never blocks a sale
        (DEC-179)
    - input: Blind count
      operations:
      - shift#submitShiftCount
      does: >-
        server computes expected = float + cash takings - drops and the variance; answers only closed / referredToSupervisor
        / awaitingCloseApproval; beyond shiftVarianceThreshold (venue setting, proposed AED 20.00) the shift is pendingVariance
        and supervisors holding OVERSHORT_ACCEPT are alerted on the venue alerting channel
    - input: Supervisor resolution
      operations:
      - shift#getShiftCountLines
      - shift#acceptShiftVariance
      - shift#rejectShiftVariance
      - shift#closeShift
      - shift#reopenShift
      does: >-
        each verifies the body supervisorStepUp; accept -> closed and deposit boxes reconciled, over/short posts to the over/short
        account; reject -> recount requested (count 2, 3...); closeShift returns expectedCash and variance to the supervisor
        only; reopen keeps the first count
    - operation: catalogue#getLatestBundle
      what: Pull the current bundle for this workstation's venue
      steps:
      - 3
      block_a: true
    - operation: orders#createOrder
      what: Create an order
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: orders#createPayment
      what: Take a payment against an order
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: shift#listCashMovements
      what: Lifts, adds and the opening float
      steps:
      - 6
      block_a: true
      offline_capable: true
    - operation: shift#closeDepositBoxes
      what: Close one box or all of them
      steps:
      - 8
      block_a: true
      writes: true
    - operation: finance#settleDeposit
      what: Convert to revenue, return it, or forfeit it
      steps:
      - 8
      block_a: true
      writes: true
    outputs:
    - output: Session (POS-000)
      states:
        emptyFirstRun: no recent cashiers; keypad is the whole screen (not a fault)
        loading: keypad visible and disabled while checking
        denied: number and PIN do not match or account locked; names which and attempts left
        error: identity unreachable; says so, not "wrong PIN"
        mfaRequired: 'signed in, not yet through: authenticator code, Email me a code instead'
        emptyNoAccess: authenticated, no role on this till
        tillHeld: 'login 409: somebody holds this till; "Ask a supervisor" opens the PIN step-up'
        offline: signs in against the cached operator list
        ready: role resolved, lands on POS-001 (no shift) or POS-025 (shift open)
      failure_branches:
      - at_step: 1
        what: Somebody else is signed in on this till (login 409)
        user_sees: 'Signed in on this till now: hidden until a supervisor PIN; "Ask a supervisor"'
        recovery: >-
          supervisor PIN step-up -> listActiveSessions -> Take the till over (forceLogout) -> the next operator signs in;
          the old shift stays as it was
      - at_step: 1
        what: Supervisor PIN refused at the door
        user_sees: 403 supervisor-step-up-refused, the panel stays closed
        recovery: another supervisor, or BO-053 Staff Directory from a back-office session
    - output: Shift status chip (cashier view)
      states:
        open: Shift open
        closed: Shift closed
        pendingVariance: Under review (no amount, no over/short)
        recountRequested: Recount requested, with the supervisor's reason, never the amount
        awaitingCloseApproval: Waiting for close approval
      failure_branches:
      - what_goes_wrong: closed state
        user_sees: Shift closed
        recovery: Pick another option, day or time the screen offers (derived)
      - what_goes_wrong: pendingVariance state
        user_sees: Under review (no amount, no over/short)
        recovery: Follow the action the state offers (derived)
      - what_goes_wrong: recountRequested state
        user_sees: Recount requested, with the supervisor's reason, never the amount
        recovery: Follow the action the state offers (derived)
    - output: Count receipt banner (POS-007)
      states:
        closed: '"Shift closed"'
        referredToSupervisor: '"Your count is with your supervisor"'
        awaitingCloseApproval: '"Waiting for close approval"'
        loading: The close shift list.
        error: Could not load. Names which read failed and leaves the close shift untouched.
        emptyFirstRun: >-
          Nothing is waiting, which is the good outcome. An empty queue means every item has been decided; it offers no create
          action, because creating work is not what it needs.
        emptyNoResults: >-
          Never shown: `listCashMovements` takes no filter, so an empty list is always the first-run state above.
        emptyNoAccess: >-
          Shown when the caller lacks `SHIFT_OPEN`, which `getCurrentShift` requires to show this screen, and names that permission
          (the screen's other reads need `REPORT_VIEW_WORKSTATION` …
        offline: Cannot close. Closing requires the server total, and a locally computed variance is not a variance
        denied: >-
          `acceptShiftVariance` was refused: the caller lacks OVERSHORT_ACCEPT at this venue, or is the cashier whose shift
          it is. The shift stays `pendingVariance` against the same count, …
        pendingVariance: >-
          Counted; "Under review". `submitShiftCount` answered `referredToSupervisor`. The cashier sees "Under review" and
          no amount, and may sign out: the shift waits, and the next cashier …
        recountRequested: >-
          "Recount requested". A supervisor rejected the variance (`rejectShiftVariance`) with a reason the cashier reads;
          the shift is still pendingVariance with `recountRequestedAt` set. …
      failure_branches:
      - at_step: 8
        what: Variance beyond the threshold and no supervisor free
        user_sees: '"Your count is with your supervisor"; chip "Under review"'
        recovery: >-
          cashier signs out; supervisor resolves on any till with PIN or in BO-043; the next cashier opens a new shift meanwhile
      - at_step: 11
