        a shift under review); the cashier's own count never takes it
    - q: >-
        flows/F32 steps 1, 6 and 7 are stale (sign-in on POS-001, cashier sees expected, cashier accepts variance).
      was_default: draw this brief; raise a change to rewrite F32 against CHG-FIN-003 and add POS-000 as step 1
      resolved_by: >-
        answers-2-oct-batch1.md L436 (Chinmay, 3 Oct, r1 additions): F32 is the decided shift flow in r1: POS-000 sign-in,
        blind close, under review over the threshold, next cashier never blocked, supervisor PIN for accept / reject / close
        / reopen, sessions on POS-000 behind the PIN
  F104:
    title: A platform operator signs in under MFA
    process: platform-foundation
    trigger: Somebody with platform-wide authority signs in.
    actors:
      role: platformAdmin
      apps:
      - P09
      - P10
      - P12
    inputs:
    - name: Username / email
      formats:
      - text
      limits: tenant username rules; no workstationId is sent from a browser (CHG-DOOR-001)
      validation:
      - empty -> "Enter your username"
      - login 401 -> "Username or password is wrong."
      source: the person, at the browser door
    - name: Password
      formats:
      - text, show/hide
      limits: minimum 8; hidden when the tenant enforces SSO for this person (Continue with SSO only)
      validation:
      - under 8 -> "At least 8 characters"
      - temporary password -> New password twice, last five not reusable (changeOwnCredential, R132)
      source: the person
    - name: Authentication code
      formats:
      - 6 digits, authenticator app
      - 6 digits by email (fallback)
      limits: 6 digits; 5 wrong codes lock step-up for the lockout minutes
      validation:
      - fifth wrong code -> "Too many attempts. Try again at 10:42."
      - >-
        no method -> enrol first: authenticator QR plus text secret, confirmed by the first code; recovery codes shown once
        with copy and download
      source: >-
        asked by permission (R135): every platform operator, ROLE_MANAGE / LEDGER_APPROVE holders, tenant-added permissions
    processing:
    - input: Credential (browser door, no workstation)
      operations:
      - identity#login
      does: authenticates; requiresMfa is always true for a platform operator (every PLATFORM_* permission)
    - input: Second factor
      operations:
      - identity#createMfaChallenge
      - identity#verifyMfaChallenge
      - identity#enrolMfaMethod
      does: authenticator code or emailed code; enrolment first when no method
    - input: Session
      operations:
      - identity#getCurrentSession
      does: >-
        cross-tenant reach for an operator; partner scope from setPartnerBrandVenue; venue scope for Venue Management
    outputs:
    - output: Session
      states:
        mfaRequired: code step
        mfaLocked: '"Too many attempts. Try again at 10:42."'
        alreadySignedIn: >-
          refused with where (device, time); only a SESSION_FORCE_LOGOUT holder ends it, from a signed-in screen
        enrolFirst: QR + text secret, first code confirms, recovery codes once
        ready: Platform Dashboard / partner home / Venue Management home
      failure_branches:
      - what_goes_wrong: mfaRequired state
        user_sees: code step
        recovery: Complete the second factor and continue (derived)
    - output: ADM-001 Platform Login / MFA
      states:
        loading: Checking the credential. The form stays visible and disabled.
        emptyFirstRun: >-
          Nobody signed in - the normal state of a door. The form offers username and password and, where TICVAI uses one,
          its SSO.
        error: >-
          Identity could not be reached. Says so rather than saying the password is wrong, and keeps what was typed.
        denied: >-
          The credential does not match, or the account is locked. One message for both, with the attempts left before the
          lock;
        emptyNoAccess: >-
          Signed in, and the person holds no role in this app. Says who at the tenant grants access; distinct from a wrong
          password.
        emptyNoResults: >-
          Never shown: listSsoProviders takes no filter; a tenant with no identity provider shows no SSO buttons at all, and
          the form is the whole door.
        sessionHeld: >-
          login answered 409: this person already holds a session elsewhere (audit R184, ADR-0004). Says where and since when;
        mfaRequired: >-
          Signed in, not yet through. The principal holds a permission that requires MFA (ROLE_MANAGE, LEDGER_APPROVE, any
          PLATFORM_* permission, or one the ten ...
        mfaEnrolmentRequired: >-
          First sign-in, no method yet. A person who requires MFA and has no active method enrols the authenticator app (email
          as the fallback) with enrolMfaMet ...
        offline: 'Not available, and the offline banner says why: signing in needs a connection.'
      failure_branches:
      - at_step: 2
        what: The operator has no MFA method enrolled yet.
        user_sees: >-
          Enrolled before they get in. A platform operator cannot finish signing in without a method, so ADM-001 enrols an
          authenticator app (or email) with enrolMfaMethod and verifyMfaEnrolment first;
        recovery: enrolMfaMethod
      - at_step: 2
        what: Five wrong codes.
        user_sees: >-
          Step-up locks for the policy's lockout minutes, never permanently (audit R126 (6)). The screen says so and when
          it lifts; a permanent lock is a denial of service anybody can run.
        recovery: verifyMfaChallenge
      - at_step: 1
        what: The acting principal lacks the permission at this scope.
        user_sees: >-
          Refused at the first step, not the last. ADR-0002 makes authorisation user-driven — a person who gets three steps
          in and then cannot finish has been told the wrong thing.
