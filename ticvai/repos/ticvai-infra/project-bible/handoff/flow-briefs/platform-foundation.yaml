  F27:
    title: A developer integrates
    process: platform-foundation
    trigger: >-
      A CRM vendor wants to sync a venue's guest data. They have found the documentation and have no account, no credential
      and no relationship with Softlabs.
    actors:
      role: partner
      apps:
      - P14
    inputs:
    - name: Organisation
      formats:
      - name, contact email (verified), website, country
      limits: registrant becomes owner
      validation:
      - verification fails -> rejected with a reason; nothing provisioned
      source: developer on DEV-002
    - name: Sandbox client
      formats:
      - name, scopes {module}.read / .write
      limits: environment fixed to sandbox; unlicensed modules disabled
      validation:
      - scope not licensed -> no token issued, refused at issue
      source: DEV-003
    processing:
    - input: Developer programme
      operations:
      - public-api#registerDeveloper
      - public-api#createApiClient
      - public-api#createSandbox (not Block A)
      - public-api#createWebhookSubscription (not Block A)
      - public-api#getApiUsage (not Block A)
      - public-api#submitIntegrationListing (not Block A)
      does: sandbox only until certification (M17-06)
    outputs:
    - output: DEV-002 Register & Organisation
      states:
        loading: The organisation and its members.
        error: Could not load. Your credentials are unaffected.
        emptyFirstRun: >-
          You are the first member and you are the owner. An integration outlives the engineer who built it, so this is an
          organisation rather than a personal a ...
        emptyNoAccess: >-
          You are a member and not an owner. Stated plainly rather than shown as an empty list, because a developer who sees
          no colleagues assumes the page is b ...
      failure_branches:
      - at_step: 2
        what: Verification fails.
        user_sees: >-
          Rejected with a reason they can act on. Nothing was provisioned, so nothing needs cleaning up — which is the whole
          point of verifying before provisioning rather than alongside it.
        recovery: registerDeveloper
    - output: DEV-003 Clients & Credentials
      states:
        loading: Clients, sandbox first.
        error: Could not load clients. Existing credentials keep working.
        emptyFirstRun: >-
          No clients yet. Create a sandbox one — the action says sandbox because a first client should never be a production
          client, and defaulting the other wa ...
        emptyNoResults: No client matches this environment or scope.
        emptyNoAccess: You are a read-only member. Credentials are hidden, not absent.
      failure_branches:
      - at_step: 3
        what: They request a scope their target tenant has not licensed.
        user_sees: >-
          No token is issued, and the refusal happens at issue rather than at call time. An integrator whose tenant has not
          licensed the F&B API finds out once, in testing, rather than at 3am against a 403 on one endpoint.
        recovery: setApiLicensing
    failure_branches:
    - at_step: 4
      what: The sandbox expires mid-build.
      user_sees: >-
        Data goes and the record stays. A developer whose sandbox vanished entirely cannot tell it from one that never existed,
        and the expiry was counted in days on the screen before it happened.
      recovery: createSandbox
    - at_step: 5
      what: Their endpoint fails repeatedly.
      user_sees: >-
        failing before disabled, so they are told before it stops rather than after. And disabling is safe because replayEvents
        is the recovery path — nothing is lost, it is just not being pushed.
      recovery: replayEvents
    - at_step: 6
      what: They exceed their quota.
      user_sees: >-
        Throttled by default rather than rejected, and the 429 carries Retry-After. A limit with no guidance produces a client
        that retries immediately and makes it worse.
      recovery: setApiQuota
    - at_step: 7
      what: Certification is refused.
      user_sees: >-
        Sandbox access is unaffected; production stays closed. Production keys are issued only after certification (17 September
        minutes M17-06, decided again 29 September): the route is flow F36, sandbox, then certification, then a production
        clie ...
      recovery: certifyIntegration
    - at_step: 7
      what: The API version they built against is deprecated.
      user_sees: >-
        Twelve months' notice, and the notification names the operations they actually call. A generic *"v1 is retiring"*
        to somebody using three of two hundred endpoints is a message they will ignore.
      recovery: deprecateApiVersion
    steps:
    - frame: 1
      flowStep: 1
      screen: DEV-001 API Reference
      block: later
      sees: Read the contract, and call it without leaving the page.
      does: The developer reads the reference and tries an operation.
      calls:
      - public-api#listApiVersions (not Block A)
      result: >-
        Try-it runs against the sandbox, never production, and the button says so. A try-it that quietly hits production is
        how somebody refunds a real order while reading the docs.
    - frame: 2
      flowStep: 2
      screen: DEV-002 Register & Organisation
      block: A
      sees: Sign up as an organisation, and manage who at it may do what.
      does: They register their organisation.
      calls:
      - public-api#registerDeveloper
      result: >-
        Pending verification. Nothing is provisioned yet — an unverified account with live credentials is an open door.
    - frame: 3
      flowStep: 3
      screen: DEV-003 Clients & Credentials
      block: A
      sees: Create a client, choose its scopes, and rotate its secret without an outage.
      does: They create a sandbox client and take the secret.
      calls:
      - public-api#createApiClient
      result: >-
        issueApiToken is not on this screen and should not be — a token exchange is a call their code makes, not a button
        somebody presses. The flow named it here and the checker was right to refuse. The secret is returned once and never
        again.
    - frame: 4
      flowStep: 4
      screen: DEV-004 Sandbox
      block: later
      sees: Test against synthetic data, and reset to a known state.
      does: They provision a sandbox and build against it.
      calls:
      - public-api#createSandbox (not Block A)
      - public-api#resetSandbox (not Block A)
      result: >-
        Synthetic data, generated rather than sampled. No production data is cloned or masked, which is what removes the PDPL
        and DESC exposure entirely — and why this step needs no legal review at all.
    - frame: 5
      flowStep: 5
      screen: DEV-005 Webhooks
      block: later
      sees: Subscribe to events, see every delivery, and replay what was missed.
      does: They subscribe to the events they need and watch the deliveries.
      calls:
      - public-api#createWebhookSubscription (not Block A)
      - public-api#listWebhookDeliveries (not Block A)
      result: >-
        The endpoint is verified before the first delivery. An unverified endpoint is somebody else's server being sent a
        venue's ticket sales.
    - frame: 6
      flowStep: 6
      screen: DEV-006 Usage & Limits
      block: later
      sees: See whether the integration is healthy, and whose fault it is when it is not.
      does: They go live (production keys only after certification, flow F36), and watch whether it is healthy.
      calls:
      - public-api#getApiUsage (not Block A)
      result: >-
        Client errors and server errors on separate series. A 4xx is theirs and a 5xx is ours, and one combined rate lets
        both sides blame the other.
    - frame: 7
      flowStep: 7
      screen: DEV-007 Marketplace Listing
      block: later
      sees: Submit an integration for certification, and see where it is in review.
      does: They submit the integration for certification and listing.
      calls:
      - public-api#submitIntegrationListing (not Block A)
      result: >-
        Submitted for review. Certification is a Softlabs act on DEV-008, not something the developer does — the flow named
        both on one screen and the checker refused, correctly. Listed once certified.
    exits:
    - live
    - listed
    - abandoned
    - revoked
    motion:
    - Secret revealed once with Copy; never shown again.
    - 'Usage chart: 4xx and 5xx on separate series.'
    decisions:
    - >-
      DEV-002: Drawn default accepted: Developers sign in through the partner door with a developer account; draw a "Sign
      in to the Developer Portal" variant of PTR-001. (Chinmay 2026-10-02) (derived)
    sources:
    - flows/F27
    - M17-06
    open:
    - q: >-
        Package flow names screens and operations only ("N operations, N previously unwalked"); no inputs beyond the screens.
      default: inputs and states from the screens' design notes, as listed
  F36:
    title: A developer goes from sandbox to production
    process: platform-foundation
    trigger: >-
      A developer has an integration working against the sandbox and wants to call a live venue. They hold a sandbox client
      only; nothing they have can reach production.
    actors:
      role: partner
      apps:
      - P14
    inputs:
    - name: Production access request
      formats:
      - certified listing, tenants, scopes, IP allow-list (at least one address)
      limits: new production client issued by TICVAI
      validation:
      - 409 certification-required
      - 422 ip-allow-list-required
      - 422 unknown-scope
      source: developer on DEV-003
    - name: Decision
      formats:
      - approve / reject with reason; expiry default 365 days (1-730)
      limits: TICVAI only (DEVELOPER_ADMIN)
      validation:
      - 422 reject without reason
      - 409 already-decided
      source: TICVAI on DEV-008
    processing:
    - input: Certification and production
      operations:
      - public-api#certifyIntegration
      - public-api#requestProductionAccess (not Block A)
      - public-api#decideProductionAccess
      - public-api#rotateApiCredential
      does: requestProductionAccess is not Block A
    outputs:
    - output: DEV-008 Programme Administration
      states:
        loading: Pending certifications first.
        error: Could not load.
        emptyFirstRun: Nothing awaiting review.
        emptyNoAccess: >-
          This is a Softlabs screen and you are a developer. Said plainly — a blank administration page shown to a partner
          is worse than a refusal, because they ...
        emptyNoResults: No production access request with this status. Names the filter and offers to clear it.
      failure_branches:
      - at_step: 3
        what: Certification is refused.
        user_sees: >-
          Sandbox access is unaffected; production stays closed. The refusal gives the reason, and the developer resubmits
          from DEV-007 once it is fixed.
        recovery: submitIntegrationListing
      - at_step: 5
        what: TICVAI rejects the request.
        user_sees: >-
          The rejection carries the reason. The sandbox client and the certification stand; the developer corrects the request
          and asks again.
        recovery: requestProductionAccess
    - output: DEV-003 Clients & Credentials
      states:
        loading: Clients, sandbox first.
        error: Could not load clients. Existing credentials keep working.
        emptyFirstRun: >-
          No clients yet. Create a sandbox one — the action says sandbox because a first client should never be a production
          client, and defaulting the other wa ...
        emptyNoResults: No client matches this environment or scope.
        emptyNoAccess: You are a read-only member. Credentials are hidden, not absent.
      failure_branches:
      - at_step: 4
        what: The integration named is not certified, or its certification has lapsed.
        user_sees: >-
          Refused 409 certification-required. There is no route to production that skips certification, including creating
          a production client directly (createApiClient refuses it the same way unless TICVAI staff issue it against a certified
          listing) ...
        recovery: DEV-007
      - at_step: 4
        what: The request has no IP allow-list, or asks for a scope that does not exist.
        user_sees: >-
          Refused 422 (ip-allow-list-required, unknown-scope) naming the field, before anyone at TICVAI has to look at it.
          No scope opens a catalogue write (M17-04).
        recovery: DEV-003
      - at_step: 6
        what: The certification lapses or is withdrawn while the production client is live.
        user_sees: >-
          The production clients bound to it are suspended, and the developer and the tenants they serve are told; recertifying
          restores them. A lapsed certification never leaves a live key running unreviewed.
        recovery: certifyIntegration
    steps:
    - frame: 1
      flowStep: 1
      screen: DEV-004 Sandbox
      block: later
      sees: Test against synthetic data, and reset to a known state.
      does: They build and test against a sandbox with synthetic data.
      calls:
      - public-api#createSandbox (not Block A)
      result: >-
        Synthetic data only: nothing here can touch a live venue, so this is where every mistake is cheap. Their sandbox client
        carries module scopes (M17-05) and nothing else.
    - frame: 2
      flowStep: 2
      screen: DEV-007 Marketplace Listing
      block: later
      sees: Submit an integration for certification, and see where it is in review.
      does: They submit the integration for certification.
      calls:
      - public-api#submitIntegrationListing (not Block A)
      result: >-
        Submitted for review, with visibility public or private (M17-06): a private listing is certified for the tenants it
        serves and never appears in the marketplace.
    - frame: 3
      flowStep: 3
      screen: DEV-008 Programme Administration
      block: A
      sees: Set quotas, certify integrations and configure licensing.
      does: TICVAI reviews the integration and certifies it.
      calls:
      - public-api#certifyIntegration
      result: >-
        Certification is a TICVAI act, not the developer's, and it has an end date (certifiedUntil). The listing moves to
        certified.
    - frame: 4
      flowStep: 4
      screen: DEV-003 Clients & Credentials
      block: A
      sees: Create a client, choose its scopes, and rotate its secret without an outage.
      does: They request production access for the certified integration.
      calls:
      - public-api#requestProductionAccess (not Block A)
      result: >-
        The request names the certified listing, the tenants, the scopes and an IP allow-list (at least one address, M17-07).
        The sandbox client stays a sandbox client.
    - frame: 5
      flowStep: 5
      screen: DEV-008 Programme Administration
      block: A
      sees: Set quotas, certify integrations and configure licensing.
      does: TICVAI decides the request.
      calls:
      - public-api#decideProductionAccess
      result: >-
        Approval issues a new production client (issuedBy: ticvai, bound to the certified listing, with its own expiry). Nothing
        is promoted; the decision and who made it are recorded.
    - frame: 6
      flowStep: 6
      screen: DEV-003 Clients & Credentials
      block: A
      sees: Create a client, choose its scopes, and rotate its secret without an outage.
      does: They take the production secret once, with Rotate.
      calls:
      - public-api#rotateApiCredential
      result: >-
        The secret is shown once and never again. From here their production calls are watched by the anomaly rules (M17-07)
        and limited by the quota.
    exits:
    - completed
    - abandoned
    - failed
    motion:
    - Secret shown once with Copy and a "shown once" warning.
    decisions:
    - >-
      No decision in the package names this flow or its screens (DEV-004, DEV-007, DEV-008, DEV-003); checked flows/F36, the
      screens' design notes and answers-2-oct-batch1.md (derived)
    sources:
    - flows/F36
    - M17-04
    - M17-05
    - M17-06
    - M17-07
    open:
    - q: requestProductionAccess is not a Block A operation while decideProductionAccess is.
      default: draw the request frame as later; flag to the lead
