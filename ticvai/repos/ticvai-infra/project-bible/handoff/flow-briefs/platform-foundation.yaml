      - what_goes_wrong: offline state on SCN-001
        user_sees: >-
          Signs in against the cached principal list from the last bundle. A steward locked out at 08:00 because the venue
          wifi is down is a gate that does not ...
        recovery: Reconnect; the screen picks up where it was (derived)
    - output: SCN-003 Ready to scan
      states:
        loading: The ready scan list.
        error: Could not load. Names which read failed and leaves the ready scan untouched.
        emptyFirstRun: >-
          No ready scan yet. Offers no create action — this screen declares no operation that makes one — and says so rather
          than showing an empty table.
        emptyNoResults: >-
          Nothing matches the filter on accessPointId, ticketId, outcome, recordedFrom, recordedTo and the ready scan are
          still there.
        emptyNoAccess: Shown when the caller lacks TICKET_LOOKUP, which lookupTicket requires, and names that permission.
        offline: >-
          Same loop, different truth. Amber says so. Was a separate screen until 18 August, and the screen already had an
          offline state — two places describing ...
        admitted: >-
          Green, and gone in 1.5 seconds. The absorbed SCN-004. Shows what was admitted and against which right;
        denied: >-
          Denied with the reason and the time of the previous scan. The reason matters more than the refusal — a steward has
          to explain it to somebody standing ...
        overrideRequired: >-
          A supervisor override, which requires a permission a steward may not hold, and records who, why and when. The absorbed
          SCN-006.
        blocked: >-
          Blacklisted or otherwise barred. No override is offered on the device — this is not a judgement a steward makes
          at a lane. The absorbed SCN-010.
      failure_branches:
      - at_step: 5
        what: Entitlement already fully consumed
        user_sees: >-
          SCN-003 shows denied with the reason and the time of the previous scan. The reason matters more than the denial
          — a steward facing a guest needs to say what happened, not just no.
        recovery: Steward explains, or escalates to a supervisor override on SCN-003
      - at_step: 5
        what: Guest is blacklisted
        user_sees: >-
          SCN-003, handled differently from an ordinary denial: no override offered on the device, and a supervisor is summoned.
        recovery: Supervisor
      - at_step: 5
        what: Media unreadable — damaged QR, dead phone
        user_sees: >-
          SCN-008 manual entry by reference, or SCN-009 lookup by name. Both are slower and both are necessary.
        recovery: Steward
      - at_step: 5
        what: Party larger than the entitlement
        user_sees: >-
          SCN-007 group admission admits what is valid and states the shortfall, rather than refusing the whole party at a
          gate with a queue behind it.
        recovery: Steward
      - at_step: 5
        what: Steward believes the denial is wrong
        user_sees: >-
          Supervisor override on SCN-003, which requires a permission a steward may not hold and records who, why and against
          which scan.
        recovery: Supervisor
      - at_step: 5
        what: The attraction behind this access point is temporarily closed
        user_sees: >-
          Denied with the reason and the reopening time, plus a way back (decided 2 October 2026, Chinmay, BO-147: "Deny +
          reopening time + a virtual-queue return window where enabled"; DEC-228, CHG-CSP-026).
        recovery: Steward explains; the guest takes the return window (joinQueue) where offered
      - at_step: 5
        what: A time-bound entitlement is scanned after its window from first scan
        user_sees: >-
          Denied as expired, with when the window ended (decided 2 October 2026, BO-159: "Yes: add time-bound entitlements
          (validity from first scan)"; DEC-232, CHG-CSP-030). denyCause timeBoundWindowElapsed, denyReason expired;
        recovery: Steward explains, or sells an extension at a counter
      - at_step: 5
        what: The handheld has been offline longer than the venue allows
        user_sees: >-
          Offline taps are refused until it reconnects (decided 2 October 2026, BO-471: "Yes: the venue sets a maximum offline
          duration; readers then refuse offline taps"; DEC-426, CHG-CSP-035). denyCause offlineLimitExceeded;
        recovery: Steward moves to signal and syncs (SCN-014), or a supervisor swaps the device
      - at_step: 4
        what: No network at shift start
        user_sees: >-
          SCN-003 offline. The bundle from the previous sync is used and its age is shown. An old bundle is better than no
          gate, and the steward must be able to see how old.
        recovery: Automatic
    - output: SCN-014 Sync & reconciliation
      states:
        loading: The sync reconciliation list.
        error: Could not load. Names which read failed and leaves the sync reconciliation untouched.
        emptyFirstRun: >-
          No sync reconciliation yet. Offers no create action — this screen declares no operation that makes one — and says
          so rather than showing an empty tabl ...
        emptyNoResults: >-
          Nothing matches the filter on workstationId, kind, resolved and the sync reconciliation are still there.
        emptyNoAccess: >-
          Shown when the caller lacks ORDER_VIEW, which listSyncRejections requires to show this screen, and names that permission
          (the screen's other reads nee ...
        offline: Not applicable. This screen exists to end the offline period
      failure_branches:
      - at_step: 6
        what: Server rejects a scan the device already admitted
        user_sees: >-
          SCN-014 reconciliation. The guest is already inside. This is a revenue and audit event, not a gate event, and it
          is why the journal exists.
        recovery: Duty manager, after the fact
      - at_step: 6
        what: Journal too large to sync in one pass
        user_sees: >-
          Batched. The device keeps journalling while it syncs — a device that stops scanning to sync is a closed gate.
        recovery: Automatic
    failure_branches:
    - at_step: 2
      what: The gate's direction is switched live during the shift
      user_sees: >-
        The device picks up the new direction from the next push (decided 2 October 2026, BO-230: "Live direction switch with
        permission, logged; R221 amended"; DEC-255, CHG-CSP-032).
      recovery: Supervisor (setAccessPointDirection); the device follows on reconnect
    steps:
    - frame: 1
      flowStep: 1
      screen: SCN-001 Sign in
      block: A
      sees: >-
        PIN or badge, so every scan is attributable to a person at this gate. The scanner sends its workstation.
      does: Steward signs in with PIN or badge
      calls:
      - identity#login
      result: >-
        Session carries the workstation, so every scan is attributable. A scanner runs no cash shift, so the door reads none
        (CHG-DOOR-003)
    - frame: 2
      flowStep: 2
      screen: SCN-002 Access point & direction
      block: later
      sees: Confirm what this device is doing before it does it.
      does: Confirms access point and direction
      calls:
      - access#listAccessPoints (not Block A)
      result: The device knows what it is doing before it does it
    - frame: 3
      flowStep: 3
      screen: SCN-015 Offline package
      block: later
      sees: Rule changes land here, not instantly.
      does: Loads the offline package
      calls:
      - access#getOfflinePackage
      result: Entitlements, blacklist and admission profiles are local from here
    - frame: 4
      flowStep: 4
      screen: SCN-003 Ready to scan
      block: A
      sees: The screen the device sits on all day.
      does: Waits at the ready screen
      calls:
      - none
      result: >-
        The loop. The device sits here all day Calls nothing — the ready screen is idle by design, which is what makes the
        next scan instant.
    - frame: 5
      flowStep: 5
      screen: SCN-003 Ready to scan
      block: A
      sees: The screen the device sits on all day.
      does: Scans and admits
      calls:
      - access#validateAccess
      result: Green, party size, and the entitlement is consumed locally
    - frame: 6
      flowStep: 6
      screen: SCN-014 Sync & reconciliation
      block: A
      sees: The screen nobody designs and everybody needs.
      does: Syncs the journal when signal returns
      calls:
      - access#syncScans
      - orders#listSyncRejections
      result: The server accepts most and may reject some
    exits:
    - completed
    - escalated
    - deferred
    motion:
    - >-
      Admitted: full-screen green with party size, gone in 1.5 seconds back to ready (SCN-003 admitted state).
    - 'Denied: red with reason and previous-scan time, stays until dismissed.'
    - 'Offline: amber frame on the same loop.'
    - 'Group: live counter "38 of 40 admitted".'
    - 'Sync: progress count of journal entries posted.'
    decisions:
    - id: BO-147, BO-159, BO-471, BO-230 answers (2 Oct)
      says: >-
        closed attraction shows reopening time and return window; time-bound entitlement expiry; max offline duration; live
        direction change picked up on next push
    - ids:
      - CHG-CSP-026
      - CHG-CSP-030
      - CHG-CSP-032
      - CHG-CSP-035
      - CHG-DOOR-003
      - CHG-WIR-021
      - DEC-228
      - DEC-232
      - DEC-255
      - DEC-426
      - R221
    sources:
    - flows/F06
    - ADR-0068
    open:
    - q: F06 and F61 overlap (both walk SCN-001 -> SCN-003 -> SCN-014).
      default: draw once; F61 adds the group frames
  F56:
    title: A guest registers, verifies and sets preferences
    process: platform-foundation
    trigger: >-
      The front door of the platform. GST-042 declares 21 operations and 19 were in no flow; WEB-016 declares 22 with 20 uncovered.
    actors:
      role: guest
      apps:
      - P02
      - P01
    inputs:
    - name: Email or mobile
      formats:
      - one field; + or digit = mobile in E.164 (+971 prefilled)
      - else email
