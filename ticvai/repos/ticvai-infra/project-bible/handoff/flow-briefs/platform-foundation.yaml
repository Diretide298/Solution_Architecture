process: platform-foundation
title: 'Flow design briefs, Block A: Platform Foundation'
written: 2026-10-03, platform-foundation brief agent
scope:
  rule: >-
    Block A = builds of the tickets under BLOCK-A in handoff/service-docs/op-release.json; a flow belongs to the process
    of its trigger screen.
  covered:
