          No task yet. Offers Record work order parts (recordWorkOrderParts); distinct from a filter that matched nothing.
        emptyNoResults: >-
          Nothing matches the filter on assignedToPrincipalId, status, priority, assetId, overdueOnly and the task are still
          there.
        emptyNoAccess: >-
          Shown when the caller lacks WORK_ORDER_VIEW, which listWorkOrders requires to show this screen, and names that permission.
        offline: Editable offline. Findings and photos queue
      failure_branches:
      - at_step: 6
        what: Task is a safety incident
        user_sees: >-
          EMP-026 and EMP-027. A different severity, a different escalation, and it must reach a supervisor rather than sit
          in a list.
        recovery: Supervisor
      - at_step: 6
        what: Task needs a part that is not in stock
        user_sees: >-
          Blocks on awaitingParts rather than paused. The distinction matters — one is a person, the other is supply, and
          only one is chased by ordering something.
        recovery: Storekeeper
    failure_branches:
    - at_step: 4
      what: Signal lost in a plant room or basement
      user_sees: Queues locally. The status strip shows pending count, and EMP-017 reconciles on return.
      recovery: Automatic
    - at_step: 8
      what: Shift ends with tasks open
      user_sees: >-
        Reassigned or carried, never silently closed. An open task at handover is the thing handover exists for.
      recovery: Supervisor
    - at_step: 8
      what: Steward forgets to end the shift
      user_sees: >-
        Auto-closed after the venue limit, and recorded as autoClosed rather than closed — nobody counted it.
      recovery: Automatic
    - at_step: 3
      what: A gate needs covering mid-shift
      user_sees: >-
        EMP-010 through EMP-015 — the app scans too. Lower throughput than a handheld, and enough for a relief.
      recovery: Steward
    - at_step: 2
      what: Emergency declared
      user_sees: >-
        EMP-047 emergency mode overrides the home screen entirely. This is the one screen that outranks everything.
      recovery: Duty manager
    steps:
    - frame: 1
      flowStep: 1
      screen: EMP-001 Sign in
      block: A
      sees: >-
        Get an employee onto a shared handheld fast, and resolve the session every other screen of the staff app reads.
      does: Signs in
      calls:
      - identity#login
      result: Biometric or SSO
    - frame: 2
      flowStep: 2
      screen: EMP-002 Select venue & role
      block: later
      sees: Confirm which hat this person is wearing today.
      does: Selects venue and role
      calls:
      - identity#selectRole
      result: A person may hold several roles; the shift needs one
    - frame: 3
      flowStep: 3
      screen: EMP-048 Opening checklist
      block: later
      sees: Confirm a gate is fit to open before the first guest reaches it.
      does: Works the opening checklist
      calls:
      - maintenance#listInspectionTemplates (not Block A)
      - maintenance#submitInspection (not Block A)
      result: What must be true before the venue opens
    - frame: 4
      flowStep: 4
      screen: EMP-003 Home — on duty
      block: later
      sees: The screen the device sits on between tasks.
      does: Sees the home screen on duty
      calls:
      - shift#getWorkstationShift
      - maintenance#listIncidents
      result: Today, at a glance
    - frame: 5
      flowStep: 5
      screen: EMP-004 Task list
      block: A
      sees: See what is assigned, and what is overdue.
      does: Works the task list
      calls:
      - maintenance#listWorkOrders
      - maintenance#acceptWorkOrder
      result: Assigned and available work
    - frame: 6
      flowStep: 6
      screen: EMP-005 Task detail
      block: A
      sees: Do the task and record that it was done.
      does: Completes a task
      calls:
      - maintenance#startWorkOrder
      - maintenance#completeWorkOrder
      result: With findings, not just a tick
    - frame: 7
      flowStep: 7
      screen: EMP-007 Handover notes
      block: later
      sees: Tell the next shift what they are walking into.
      does: Writes handover notes
      calls:
      - maintenance#listWorkOrders
      result: What the next shift needs to know
    - frame: 8
      flowStep: 8
      screen: EMP-009 End shift
      block: later
      sees: Close out cleanly, including anything unsynced.
      does: Ends the shift with a blind count (no expected cash shown; CHG-FIN-003)
      calls:
      - shift#submitShiftCount
      result: Tasks reassigned, notes handed over
    exits:
    - completed
    - deferred
    - escalated
    motion:
    - Pending-sync count in the status strip ticks as offline actions queue and drain.
    - Emergency mode (EMP-047) takes over the home screen.
    decisions:
    - id: CHG-FIN-003
      says: blind count on the staff app too
    - id: 'answers batch 6 #199'
      says: a server without a till gets a service summary (covers, tables, sales, tips)
    - ids:
      - CHG-FIN-003
      - CHG-WIR-001
      - CHG-WIR-004
      - CHG-WIR-021
    sources:
    - flows/F08
    - CF-71
    open:
    - q: EMP-048 checklist and EMP-009 are not Block A screens.
      default: draw them greyed as later frames
  F109:
    title: A tenant gets its first administrator
    process: platform-foundation
    trigger: >-
      A tenant exists and nobody inside it can sign in yet. Someone has to issue the first identity, and that someone cannot
      be inside the tenant.
    actors:
      role: platformAdmin
      apps:
      - P09 TICVAI Web
    inputs:
    - name: Username / email
      formats:
      - text
      limits: tenant username rules; no workstationId is sent from a browser (CHG-DOOR-001)
      validation:
      - empty -> "Enter your username"
      - login 401 -> "Username or password is wrong."
      source: the person, at the browser door
    - name: Tenant pick
      formats:
      - search/pick list
      limits: tenant must exist and be licensed
      validation:
      - 'no grant -> grantRequired: "Open an access grant to act in this tenant"'
      source: operator on ADM-002
    - name: Access grant
      formats:
      - permissions (preselected to the screen's needs, never PLATFORM_*)
      - reason
      - expiry
      limits: time-boxed; step-up MFA first
      validation:
      - missing reason -> "Give a reason"
      source: operator
    - name: Role
      formats:
      - name, preset (All, Viewer, Mid-level...) that fills an editable per-module checklist
      limits: renamable; no fixed default roles (pre-apply round, Roles)
      validation:
      - >-
        Required as drawn; a value the server refuses is named inline with the server's reason and what was entered is kept
        (package error-state rule) (derived)
      source: operator on ADM-021
    - name: First principal
      formats:
      - name, email, role
      limits: email unique in tenant
      validation:
      - duplicate -> 409 named
      source: operator on ADM-020
    processing:
    - input: Grant
      operations:
      - identity#openPlatformStaffGrant
      does: audited, time-boxed; the tenant sees every action in its audit log
    - input: Role and principal
      operations:
      - identity#createRole
      - identity#createPrincipal (not Block A)
      does: createPrincipal is not in Block A
    outputs:
    - output: ADM-001 Platform Login / MFA
      states:
        loading: Checking the credential. The form stays visible and disabled.
        emptyFirstRun: >-
          Nobody signed in - the normal state of a door. The form offers username and password and, where TICVAI uses one,
          its SSO.
        error: >-
          Identity could not be reached. Says so rather than saying the password is wrong, and keeps what was typed.
        denied: >-
          The credential does not match, or the account is locked. One message for both, with the attempts left before the
          lock;
        emptyNoAccess: >-
          Signed in, and the person holds no role in this app. Says who at the tenant grants access; distinct from a wrong
          password.
        emptyNoResults: >-
          Never shown: listSsoProviders takes no filter; a tenant with no identity provider shows no SSO buttons at all, and
          the form is the whole door.
        sessionHeld: >-
          login answered 409: this person already holds a session elsewhere (audit R184, ADR-0004). Says where and since when;
        mfaRequired: >-
          Signed in, not yet through. The principal holds a permission that requires MFA (ROLE_MANAGE, LEDGER_APPROVE, any
          PLATFORM_* permission, or one the ten ...
        mfaEnrolmentRequired: >-
          First sign-in, no method yet. A person who requires MFA and has no active method enrols the authenticator app (email
          as the fallback) with enrolMfaMet ...
        offline: 'Not available, and the offline banner says why: signing in needs a connection.'
      failure_branches:
      - at_step: 1
        what: The seeded platform account cannot sign in
        user_sees: >-
          There is no second door. MFA unreachable or the identity provider down leaves nobody able to issue an identity to
          anybody. This is the single point at which the whole permission tree is unrecoverable from inside the product.
        recovery: Platform operations, out of band
    failure_branches:
    - at_step: 3
      what: No role exists yet for this tenant
      user_sees: >-
        ADM-021 shows emptyFirstRun rather than emptyNoResults. The distinction matters here more than anywhere — an empty
        role list on a brand-new tenant is the expected state, and an empty one on an established tenant means something was
        deleted.
      recovery: Automatic
    - at_step: 3
      what: The operator holds no key that satisfies ROLE_MANAGE
      user_sees: >-
        The screen shows emptyNoAccess. On the package as written this is every operator, because no role grants the key.
        Until the two permission vocabularies are joined, this branch is the happy path.
      recovery: Unresolved — see the permission join
    - at_step: 5
      what: The principal is created but the role was never attached
      user_sees: >-
        An identity that can sign in and do nothing. It reads as success on this screen and fails on the tenant's first real
        action, which is the worst place to discover it.
      recovery: Platform admin
    steps:
    - frame: 1
      flowStep: 1
      screen: ADM-001 Platform Login / MFA
      block: A
      sees: >-
        Get a TICVAI platform operator into the TICVAI Console: username and password (or TICVAI's own SSO), then always the
        authentication code, then the Platform Dash ...
      does: The platform operator signs in
      calls:
      - identity#login
      - identity#verifyMfaChallenge
      result: A session scoped to the platform, not to any tenant
    - frame: 2
      flowStep: 2
      screen: ADM-002 Platform Dashboard
      block: later
      sees: The screen this app sits on. Everything else is entered from here and returns to it.
      does: Opens the console and picks the tenant
      calls:
      - subscription#listTenants
      - subscription#getTenant (not Block A)
      result: The tenant exists, is licensed, and has no principals
    - frame: 3
      flowStep: 3
      screen: ADM-021 Platform Role Management
      block: later
      sees: Define the roles TICVAI's platform staff hold.
      does: Defines the role the first administrator will hold
      calls:
      - identity#listRoles
      - identity#createRole
      result: A role carrying the permissions a tenant administrator needs
    - frame: 4
      flowStep: 4
      screen: ADM-002 Platform Dashboard
      block: later
      sees: The screen this app sits on. Everything else is entered from here and returns to it.
      does: Returns to the console
      calls:
      - subscription#listTenants
      result: Role defined, no one holding it
    - frame: 5
      flowStep: 5
      screen: ADM-020 Platform User Directory
      block: later
      sees: Find TICVAI's platform staff and manage their accounts.
      does: Creates the first principal and grants it the role
      calls:
      - identity#listPrincipals
      - identity#createPrincipal (not Block A)
      result: One identity inside the tenant that can now create every other one
    exits:
    - completed
    - blocked
    motion:
    - Grant panel shows the remaining grant time; every tenant action disables at once when it expires.
    decisions:
    - id: R098 / pre-apply round
      says: console screens get the tenant picker and grant (ADM-412 pattern)
    - id: Roles (pre-apply round)
      says: preset permission configurations, editable and renamable
    sources:
    - flows/F109
    open:
    - q: createPrincipal is not in Block A builds, so step 5 cannot complete in Block A.
      default: draw it; flag to the lead as a Block A gap
    - q: Operation name for opening the grant was not checked in this pass.
      default: use the ADM-412 grant panel binding
  F16:
    title: A venue opens for the first time
    process: platform-foundation
    trigger: A tenant has signed and a venue must exist before anyone can configure or sell anything.
    actors:
      role: platformAdmin
      apps:
      - P09 TICVAI Web
      - P08 Venue Management
    inputs:
    - name: Tenant
      formats:
      - code (unique), legal name, billing email; optional address, account manager, plan
      limits: code unique
      validation:
      - duplicate code -> 409 named
      source: operator on ADM-005
    - name: Cell / region
      formats:
      - region pick
      limits: region decides the cell (ADR-0001)
      validation:
      - 409 "A cell already exists for this region"
      source: ADM-012
    - name: Scope tree
      formats:
      - region > venue > department (outlet beside department)
      limits: venue is the configuration floor (ADR-0018)
      validation:
      - >-
        Can read but not change (holds PLATFORM_CELL_VIEW, PLATFORM_TENANT_VIEW, SCOPE_VIEW, USER_MANAGE only) -> Everything
        reads; the actions needing another permission are not offered as live buttons: PLATFORM_TENANT_MANAGE for Save tenant;
        SCOPE_MANAGE for Create org unit. Where the person would reasonably expect the action, it shows disabled with the
        permission named. The server refuses with 403 forbidden regardless. (derived)
      source: ADM-006
    - name: Chart of accounts
      formats:
      - account code (A-Z 0-9 . _ -, max 64, unique per legal entity)
      - 'type: Asset/Liability/Equity/Revenue/Expense'
      - ERP code
      - suspense flag
      - or import ERP codes
      limits: legal entity currency 2 or 3 decimals
      validation:
      - first run -> "Create your chart or import your ERP codes"
      source: finance on BO-074
    - name: Account mapping
      formats:
      - event -> debit, credit, venue
      limits: one row per money event
      validation:
      - row removed -> "Refunds will post to suspense" before confirm
      source: finance on BO-075
    processing:
    - input: Provisioning
      operations:
      - subscription#createTenant
      - subscription#provisionCell
      - tenancy#createOrgUnit
      - subscription#getTenantLicences
      does: tenant, cell, scope tree, modules
    - input: Finance setup
      operations:
      - finance#listAccounts (not Block A)
      - finance#createAccount (not Block A)
      - finance#setAccountMappings (not Block A)
      does: no chart blocks the first sale
    outputs:
    - output: ADM-005 Tenant Directory
      states:
        loading: The tenant list.
        error: Could not load. Names which read failed and leaves the tenant untouched.
        emptyFirstRun: >-
          No tenants yet. Offers Create tenant, the first act of onboarding; distinct from a filter that matched nothing.
        emptyNoResults: >-
          Nothing matches the filter on status, planId and the tenant are still there. Names the active filter and offers
          to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks PLATFORM_TENANT_VIEW, which listTenants requires to show this screen, and names that
          permission (the screen's other reads ...
        grantRequired: >-
          No access into this tenant yet. A tenant is picked and no platform-staff grant into it is open, so every tenant
          action is disabled and the screen offe ...
      failure_branches:
      - what_goes_wrong: error state on ADM-005
        user_sees: Could not load. Names which read failed and leaves the tenant untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on ADM-005
        user_sees: >-
          Shown when the caller lacks PLATFORM_TENANT_VIEW, which listTenants requires to show this screen, and names that
          permission (the screen's other reads ...
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: grantRequired state on ADM-005
        user_sees: >-
          No access into this tenant yet. A tenant is picked and no platform-staff grant into it is open, so every tenant
          action is disabled and the screen offe ...
        recovery: Request the grant the state names (derived)
    - output: BO-074 Chart of Accounts
      states:
        loading: The chart accounts list.
        error: Could not load. Names which read failed and leaves the chart accounts untouched.
        emptyFirstRun: >-
          No chart accounts yet. Offers Create account (createAccount); distinct from a filter that matched nothing.
        emptyNoResults: >-
          Nothing matches the filter on legalEntityId, type, isPostable and the chart accounts are still there. Names the
          active filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccounts requires to show this screen, and names that permission.
      failure_branches:
      - at_step: 5
        what: No chart of accounts
        user_sees: >-
          Blocks the first sale, and it is the failure a venue discovers on opening morning rather than in setup.
        recovery: Finance
    - output: BO-075 Account Mapping
      states:
        loading: The account mapping figures; each tile loads on its own.
        error: Could not load. Names which read failed and leaves the account mapping untouched.
        emptyFirstRun: No account mapping yet. Offers Create tax code (createTaxCode).
        emptyNoResults: >-
          Never shown: listAccountMappings takes no filter, so an empty list is always the first-run state above.
        emptyNoAccess: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccountMappings requires to show this screen, and names that
          permission.
      failure_branches:
      - what_goes_wrong: error state on BO-075
        user_sees: Could not load. Names which read failed and leaves the account mapping untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-075
        user_sees: >-
          Shown when the caller lacks LEDGER_VIEW, which listAccountMappings requires to show this screen, and names that
          permission.
        recovery: Ask an administrator for the permission the state names (derived)
    failure_branches:
    - at_step: 2
      what: The region has no cell and residency forbids an existing one
      user_sees: >-
        A new cell is provisioned, which takes time and money. The commercial decision is upstream of the technical one —
        a venue in a new jurisdiction is a new cost line.
      recovery: Platform admin + commercial
    - at_step: 3
      what: The scope tree is built wrongly
      user_sees: >-
        Correctable, but cascade_scope_path rewrites every descendant and RLS starts answering a different question. The riskiest
        routine operation in the platform.
      recovery: Platform admin
    - at_step: 4
      what: A module is enabled that the tenant did not buy
      user_sees: >-
        Licensing catches it at use rather than at configuration. Degrade, never stop (CF-61) — a gate refusing entry over
        a licence is worse than running unlicensed.
      recovery: Billing
    - at_step: 7
      what: The first manager cannot sign in
      user_sees: >-
        SSO not configured, or the identity provider unreachable. There is no second path in — this is why a break-glass local
        account exists.
      recovery: Platform admin
    steps:
    - frame: 1
      flowStep: 1
      screen: ADM-005 Tenant Directory
      block: A
      sees: Find any tenant and act on its account, status, licences and cells.
      does: Creates the tenant
      calls:
      - subscription#listTenants
      - subscription#createTenant
      result: A tenant with no venues yet
    - frame: 2
      flowStep: 2
      screen: ADM-012 Tenant Isolation & Resource Pool
      block: later
      sees: Place each tenant in its cells, one per region, and watch the capacity of the pool.
      does: Provisions or assigns a cell
      calls:
      - subscription#provisionCell
      - subscription#listTenantCells
      result: Region decides the cell — data residency is not a preference (ADR-0001)
    - frame: 3
      flowStep: 3
      screen: ADM-006 Tenant Hierarchy Explorer
      block: later
      sees: Explore a tenant's organisation tree and add to it.
      does: Builds the scope tree
      calls:
      - tenancy#listOrgUnits
      - tenancy#createOrgUnit
      result: Region, venue, department. Venue is the configuration floor (ADR-0018)
    - frame: 4
      flowStep: 4
      screen: ADM-007 Module & Feature Entitlement
      block: later
      sees: See and change which modules and features a tenant is entitled to.
      does: Enables the modules the tenant bought
      calls:
      - subscription#getTenantLicences
      result: A venue with no F&B does not get F&B screens
    - frame: 5
      flowStep: 5
      screen: BO-074 Chart of Accounts
      block: A
      sees: Accounts, cost centres and legal entities.
      does: Finance sets the chart of accounts
      calls:
      - finance#listAccounts (not Block A)
      - finance#createAccount (not Block A)
      result: Before the first sale. Every sale posts somewhere
    - frame: 6
      flowStep: 6
      screen: BO-075 Account Mapping
      block: A
      sees: Which account each money event posts to, per venue, and the tax codes and exemptions that apply.
      does: Maps products to accounts
      calls:
      - finance#listAccountMappings (not Block A)
      - finance#setAccountMappings (not Block A)
      result: Or everything lands in suspense
    - frame: 7
      flowStep: 7
      screen: ADM-020 Platform User Directory
      block: later
      sees: Find TICVAI's platform staff and manage their accounts.
      does: Creates the first venue manager
      calls:
      - identity#listPrincipals
      - identity#createPrincipal (not Block A)
      result: Who then does everything else
    exits:
    - completed
    - deferred
    motion: none
    decisions:
    - 'ids in flows/F16-a-venue-opens-for-the-first-time.yaml: ADR-0001, ADR-0018 (derived)'
    - >-
      ADM-005: Drawn default accepted: Draw SSO configuration behind the grant on this screen, and the same card on the tenant's
      identity settings. (Chinmay 2026-10-02) (derived)
    - >-
      BO-074: Drawn default accepted: Draw an "Import" entry point marked later; the contract has no import operation. (Chinmay
      2026-10-02) (derived)
    - >-
      BO-075: Drawn default accepted: Event-type mapping as contracted; draw no product account picker. (Chinmay 2026-10-02)
      (derived)
    - >-
      answers-2-oct-batch1.md L434: Block A completes its apps: every operation a Block A screen binds is built in Block A
      or earlier (a new rule); getUnifiedReconciliation, createPrincipal, requestProductionAccess, closeFiscalPeriod / listFiscalPeriods,
      report scheduling and the BO-074/BO-075 writes move (derived)
    sources:
    - flows/F16
    - ADR-0001
    - ADR-0018
    - CF-61
    open:
    - q: >-
        BO-074/BO-075 writes (createAccount, setAccountMappings) are not Block A operations though the screens are.
      default: draw read-only Block A frames plus the write as later
