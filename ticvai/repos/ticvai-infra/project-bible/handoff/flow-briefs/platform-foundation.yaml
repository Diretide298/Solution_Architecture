  F71:
    title: A device is prepared, used and handed over
    process: platform-foundation
    trigger: >-
      A handheld comes off charge and has to be ready before a session. A device that is not ready is a lane that does not
      open.
    actors:
      role: technician
      apps:
      - P06
    inputs: []
    processing:
    - 'none: no operation on a Block A screen in this flow'
    outputs:
    - name: EMP-043 Device settings (derived)
      screen: EMP-043
      states:
        loading: The device settings list.
        error: Could not load. Names which read failed and leaves the device settings untouched.
        emptyFirstRun: >-
          No device settings yet. Offers Register device (`registerDevice`); distinct from a filter that matched nothing.
        emptyNoResults: >-
          Nothing matches the filter on workstationId, kind and the device settings are still there. Names the active filter
          and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks `DEVICE_VIEW`, which `listDevices` requires to show this screen, and names that permission.
          **Never an empty table** — that reads as *there is no data* and sends somebody to support with the wrong question.
          A caller who can see the screen but lacks what an action needs sees that action disabled, naming its permission:
          `DEVICE_CONFIGURE` for `registerDevice`.
        offline: '**Fully offline** — device settings are local by definition'
      failure_branches:
      - what_goes_wrong: error state on EMP-043
        user_sees: Could not load. Names which read failed and leaves the device settings untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on EMP-043
        user_sees: >-
          Shown when the caller lacks `DEVICE_VIEW`, which `listDevices` requires to show this screen, and names that permission.
          **Never an empty table** — that reads as *there is no data* and sends somebody to support with the wrong question.
          A caller who can see the screen but lacks what an action needs sees that action disabled, naming its permission:
          `DEVICE_CONFIGURE` for `registerDevice`.
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on EMP-043
        user_sees: '**Fully offline** — device settings are local by definition'
        recovery: Reconnect; the screen picks up where it was (derived)
    - name: EMP-018 Offline package (derived)
      screen: EMP-018
      states:
        loading: The offline package list.
        error: Could not load. Names which read failed and leaves the offline package untouched.
        emptyFirstRun: >-
          No offline package yet. **Offers no create action** — this screen declares no operation that makes one — and says
          so rather than showing an empty table.
        emptyNoResults: >-
          Never shown: `listCatalogueBundles` takes no filter, so an empty list is always the first-run state above.
        emptyNoAccess: >-
          Shown when the caller lacks `PRODUCT_VIEW`, which `listCatalogueBundles` requires, and names that permission. **Never
          an empty table** — that reads as *there is no data* and sends somebody to support with the wrong question.
        offline: Cannot refresh. The existing bundle continues and its age is shown
      failure_branches:
      - at_step: 2
        what: The bundle is stale and the network is gone.
        user_sees: >-
          The device is not issued. ADR-0013 makes the till and the scanner local-first, and local-first with a stale catalogue
          is worse than no device.
        recovery: getLatestBundle
    - name: EMP-049 Hand over the journal (derived)
      screen: EMP-049
      states:
        loading: The hand over the list.
        error: Could not load. Names which read failed and leaves the hand over the untouched.
        emptyFirstRun: >-
          No hand over the yet. **Offers no create action** — this screen declares no operation that makes one — and says
          so rather than showing an empty table.
        emptyNoResults: >-
          Nothing matches the filter on accessPointId, ticketId, outcome, recordedFrom, recordedTo and the hand over the are
          still there. Names the active filter and offers to clear it.
        emptyNoAccess: >-
          Shown when the caller lacks `REPORT_VIEW_VENUE`, which `listScans` requires to show this screen, and names that
          permission. **Never an empty table** — that reads as *there is no data* and sends somebody to support with the wrong
          question. A caller who can see the screen but lacks what an action needs sees that action disabled, naming its permission:
          `ACCESS_VALIDATE` for `syncScans`.
        offline: '**The point of the screen.** It exists because the journal outlives the shift'
      failure_branches:
      - at_step: 3
        what: The journal will not sync.
        user_sees: >-
          A technician job, not a supervisor one. Connectivity is IT; deciding whether a scan stands is not — CF-159 settled
          that split.
        recovery: syncScans
    steps:
    - frame: 1
      flowStep: 1
      screen: EMP-043 Device settings
      block: later
      sees: Set how this handheld behaves.
      does: The device is checked and registered.
