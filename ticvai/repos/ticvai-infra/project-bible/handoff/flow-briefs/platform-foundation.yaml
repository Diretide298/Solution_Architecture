      sees: Confirm what this device is doing before it does it.
      does: They pick an access point and a direction.
      calls:
      - access#listAccessPoints (not Block A)
      - access#getAccessPoint (not Block A)
      result: >-
        Direction is a choice and not an inference. The same lane runs entry in the morning and exit at close, and a scanner
        that guesses will count a departure as an arrival.
    - frame: 3
      flowStep: 3
      screen: SCN-015 Offline package
      block: later
      sees: Rule changes land here, not instantly.
      does: The device pulls its offline package for the session.
      calls:
      - access#getOfflinePackage
      result: >-
