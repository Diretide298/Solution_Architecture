          in is sent to, so it has no no-access ...
        signInRefused: >-
          One message for every refusal of a password sign-in: guestPasswordLogin answers 401 alike for a wrong password,
          an unknown identifier, an account with ...
        offline: >-
          Not available, and the offline banner says why. Signing in, registering and verifying a code need the server.
      failure_branches:
      - at_step: 1
        what: The email already exists.
        user_sees: >-
          Offered a login, not refused. A guest told *that email is taken* about their own email is a guest who makes a second
          account.
        recovery: guestSocialLogin
    - output: WEB-016 Login / Register
      states:
        loading: Checking whether this device already holds a guest session. The sign-in form stays visible.
        error: >-
          Identity could not be reached. Says so rather than saying the password or code is wrong, and keeps what was typed.
        emptyFirstRun: >-
          Nobody signed in on this device — the normal state. The form offers a code, a password, Apple or Google and UAE
          Pass, and Create an account (registerG ...
        emptyNoAccess: >-
          There is no permission to name — a guest holds none (ADR-0025), and this is the screen a guest who is not signed
