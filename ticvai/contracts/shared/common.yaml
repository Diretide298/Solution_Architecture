openapi: 3.1.0
info:
  title: TICVAI Shared Components
  version: 1.0.0
  description: '## How to read this file

    **Shared types. Every other contract references these rather than redefining them.**

    A type defined once and referenced everywhere is a type that cannot drift. `Money` declared separately
    in eleven contracts would be eleven chances to forget that some currencies use three decimal places.

    | Defined here | Why it is shared | |---|---| | `Money` | Amount, currency and **scale**. A fixed
    two-place type truncates 3dp currencies | | `ScopeRef` | A node in the seven-level hierarchy, with
    its ltree path | | `Problem` | RFC 9457 error shape with an enumerated `type`. Clients switch on it
    | | `Page` | Cursor pagination. Offset drifts under concurrent writes | | Parameters | `Idempotency-Key`,
    page size, page cursor | | **Security schemes** | The four authentication models — see below |

    ## Authentication

    | Scheme | Used by | |---|---| | `bearerAuth` | Staff sessions. Carries `sid`, validated against the
    session registry | | `guestAuth` | Guest sessions. No workstation, no role selection, 30 days sliding, one session
    per device (audit R126) | | `serviceAuth` | Cell-to-cell and cell-to-Control-Plane. mTLS plus a cell-identity token |
    | `apiKeyAuth` | Partner and developer. Deferred pending the Developer & API workshop |

    Authorisation is **not** expressed through OAuth scopes. Permissions resolve at login against a seven-level
    tree with deny-overrides-allow, which scopes cannot express — so they live in `x-ticvai-permission`
    and `x-ticvai-scope-level` on each operation instead.

    ## Guest app status (R8 blocker fix, WHITE-C09)

    **One rule for every guest app and kiosk that reads `getTenantAppStatus`** (WEB-029, GST-047, KSK-014 and any
    screen that shows a maintenance, upgrade, closed or sold-out page). **When it is read:** at launch, when the
    app returns to the foreground, and when any other call answers `503`. **Which page wins, in this order:**
    `minimumAppVersion` above the running version (forced upgrade), then `isInMaintenance` (maintenance), then
    `availability` `closed`, then `availability` `soldOut`, then the normal screen: the first that holds is shown and
    the rest are not. **Platform unavailable** means the status read itself answers `503` or times out. The client
    then shows the last status and brand it kept (the read is offline-capable, so it keeps a copy) and, if it has
    none, a neutral default brand and the generic wording; it retries after `Retry-After`. **Sold out** offers
    one onward link, to choose another day (the date picker of the listing screen opened, no id carried). A
    status page opened when nothing is wrong shows the Home screen instead.

    Components referenced by every TICVAI contract. Changes here are breaking changes to every consumer
    — treat accordingly.

    '
components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: 'Opaque cursor: the `nextCursor` of the previous page. Absent on first request.
        **A keyset position, not an offset.** It names the last item returned in the list''s order,
        with the item id as the tiebreak, so rows written between two page requests neither repeat
        nor go missing. That drift is the reason offset paging is refused. Clients never build or
        parse a cursor.

        '
      schema:
        type: string
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: '**Which tenant a call acts in, where one cell holds many tenant databases** (ADR-0038; R8 blocker fix,
        APPROVALS-TENANCY-C44). Sent by a platform operator on the operations that open or read access into a tenant
        (`openPlatformStaffGrant`, `listOwnPlatformStaffGrants`, `getModuleEnablement`, `setModuleEnablement`); the
        cell opens the grant, or reads, in that tenant''s database and refuses a tenant it does not hold (`404`). The
        cell''s address (`Tenant.cellHost`) comes from `listTenants`. A tenant''s own staff never send it: their token
        names the tenant. Optional in the schema so an r1 client still validates; **a platform operator''s call without it
        is `400 tenant-required`.**'
      schema:
        type: string
        format: uuid
    GuestVenue:
      name: X-Venue-Id
      in: header
      required: false
      description: '**The venue a guest app or site is browsing, named on every public read of venue data** (decided 25
        October 2026, Chinmay, ADAM CR-198 option A; CHG-R10ID-010; the rule is on `guestAuth`). The server checks it
        is one of the tenant''s venues (`404` when it is not) and runs the read under a read-only scope of that venue''s
        path, so row-level security stays the line of defence and browsing needs no session. Not declared where the
        path (`/venues/{venueId}/...`) or a required `venueId` query parameter already names the venue, which then serves
        the same purpose. Optional in the schema
        so an r1 client still validates.'
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated UUIDv7. Servers deduplicate on this value. Required on every mutating
        request because offline clients replay their outbox on reconnect.


        **One key per write, and it governs replay.**

        - **A replay gets the first answer.** A request that repeats a key the server has already
        completed gets the stored original response (status and body), and nothing is written a
        second time (backend-patterns: `IIdempotencyStore`).

        - **A body UUIDv7 `id` is the same key.** An edge-created entity''s client UUIDv7 "doubles as the
        idempotency key" (naming-and-style §4), so where a create body carries a client `id`, it
        must equal this header. A request whose header and body `id` differ is a `400` with problem
        type `validation`.

        - **A reused key with a different request is a `409`.** The same key sent with a different
        body, or a body `id` that already exists under another key, is the shared `Conflict`
        response with problem type `idempotency-conflict`. It never applies the second request.

        - **The record is durable** (system-design review SD-024, 29 September). The key, the operation, a
        hash of the request and the stored response are written to `platform.idempotency_record` **in the same
        transaction as the state change**, unique on (key, operation). Redis (`cache:idempotency`) is a
        read-through cache in front of it and never the guarantee, so a Redis failover during a retry storm
        cannot let `createPayment` or `syncOrders` apply twice.

        - **How the record is written** (ADAM CR-182, option A, decided 21 October 2026; CHG-R9CR-001). The unique
        index `platform.idempotency_record_operation_id_idempotency_key_uniq` on (`operation_id`, `idempotency_key`)
        is the guarantee. The row is written once, on completion, inside the change''s transaction, with
        `status` `completed` (its only value): a concurrent retry waits on the index, fails on it when the first
        commits, rolls back and replays. `scope_path` is the tenant root, so a replay is found whoever retries,
        and `expires_at` is `created_at` plus 24 hours, after which the maintenance job in the workers host purges
        the row (`tenancy.PlatformIdempotencyRecord`).

        '
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '**Optimistic concurrency for `serverWins`** (system-design review SD-013, 29 September;
        ADR-0031). The `ETag` of the version the caller read. A write whose row has moved since is refused
        with the shared `PreconditionFailed` response instead of silently overwriting. Absent, the write is
        unconditional, as before.'
      schema:
        type: string
    PreferValidateOnly:
      name: Prefer
      in: header
      required: false
      description: '**Validate, do not write** (29 September, AI system design 2.3 and 2.2 D step 4). With
        `Prefer: validate-only` the owner validates the request exactly as it would for a real write and
        returns what would change without writing: `200` with the would-be result, or the same `4xx` it
        would return. Nothing is persisted, no event is published, and no idempotency key is consumed, so
        the real write can follow with the same `Idempotency-Key`.

        Used by the AI executor to validate an action plan step against its owner before approval and again
        before execution. Only operations that name this parameter accept it; the tool registry records
        which (`ai.AiTool.validateOnly`). Absent, the request is an ordinary write.

        '
      schema:
        type: string
        enum:
        - validate-only
    ConsistencyToken:
      name: X-Consistency-Token
      in: header
      required: false
      description: 'Opaque token returned by a prior write: the database instance and its WAL LSN (SD-025,
        29 September; ADR-0040 allows several instances per region, so an LSN alone is ambiguous). When present
        the read is routed to a replica that has caught up past this position, or to the primary. Prevents a ticket sold at the gate being
        refused by a lagging replica seconds later.


        The value comes from the `X-Consistency-Token` response header of that write, declared once
        as the shared header `ConsistencyToken` below.

        '
      schema:
        type: string
    AdmissionToken:
      name: X-Admission-Token
      in: header
      required: false
      description: '**The on-sale waiting room''s admission token** (ADR-0066, accepted 1 October). A short-lived
        signed token (tenant, performance, expiry, a unique id; the signing key is a Key Vault secret) that catalogue
        `getWaitingRoomPosition` returns once the guest is admitted. **Required for a performance whose waiting room
        is on** (catalogue `WaitingRoomSetting`): the check is a signature check in middleware with no database read,
        and a missing, expired, forged or other-performance token is refused `403 admission-required` before
        anything is held. Ignored for a performance with the room off. A vendor''s token (the fallback, such as
        Queue-it) is checked the same way.

        '
      schema:
        type: string
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: '**The device a guest app or browser is** (ADAM CR-191, option A, decided 21 October 2026;
        CHG-R9CR-004): the client UUIDv7 the app mints once per installation and keeps, the same value it sends as
        `createCart`''s `deviceId`. `checkoutCart` binds the order access token it mints to it, and `getOrder` reads
        an order with `X-Order-Access-Token` only from the device the token names. Never stored on a row.'
      schema:
        type: string
        format: uuid
  headers:
    ConsistencyToken:
      description: 'WAL LSN of the write that produced this response. A client that reads its own
        write next passes it back as the `X-Consistency-Token` request parameter. Declared here so
        a write response references one definition, `$ref: ''../shared/common.yaml#/components/headers/ConsistencyToken''`,
        rather than repeating an untyped header.

        '
      schema:
        type: string
    RetryAfter:
      description: 'Whole seconds to wait before retrying. **A real figure, jittered** (ADR-0032). A fixed
        value synchronises every client into the same retry instant. An offline till treats a `429`
        as *retry later*, never as a sync rejection.

        '
      schema:
        type: integer
        minimum: 0
    RateLimitLimit:
      description: '**The request budget that refused the call** (ADR-0064): requests per second of the tenant''s
        bucket for the caller''s audience (`guest`/`public`, `staff`, `service` or `partner`), from the tenant''s plan
        (subscription `Plan.requestLimits`) or the platform default. Sent as `RateLimit-Limit`.

        '
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: 'Requests left in the bucket when the response was sent; `0` on a `429`. Sent as
        `RateLimit-Remaining` (ADR-0064).

        '
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: 'Whole seconds until the bucket has refilled enough for one request. Sent as `RateLimit-Reset`
        (ADR-0064). `Retry-After` is what a client obeys; this is what it may show.

        '
      schema:
        type: integer
        minimum: 0
  schemas:
    Id:
      type: string
      format: uuid
      x-ticvai-persistence-column: uuid
      description: '**Every id is a uuid, and every new one is a UUIDv7** (ADR-0056, 30 September): time-ordered,
        so a key in an index stays in insertion order, and minted by the service with the kernel''s `Id.New()`.
        A client that creates a record offline (a sale, a scan, a case raised on a device) generates the id
        itself **in the same format** with a UUIDv7 function, and that id doubles as the `Idempotency-Key`.
        Ids are opaque: a client never reads a time or anything else out of one. Human codes a person reads
        or types (order numbers, ticket, card, booking and voucher codes) are not ids and stay text; so do
        provider, external and partner ids, which are not ours.

        Inline `type: string, format: uuid` means the same thing; this component is for a contract that
        wants one name for it.'
      example: 01a0f18a-ca80-7c4e-9a3f-5b2d8e1f6a04
    StoredValueKind:
      type: string
      description: '**Six things in this package hold a balance and behave the same way** — a wallet,
        a gift card, a game card, a voucher, a loyalty position and a prepaid entitlement. They were built
        separately across three sessions and each grew its own balance, bonus balance, status, blocked
        reason and expiry (CF-126).

        **The concern is not tidiness. Only one of the six could hold an authorisation.** `authoriseWalletSpend`
        / `captureWalletAuthorisation` / `relinquishWalletAuthorisation` gave two-phase spend to the retail
        wallet alone, so **a guest with 200 game credits starting a play the machine then failed had no
        held balance** — the credits were either taken or not, with no third state.

        The entities stay distinct because their lifecycles genuinely differ — a gift card activates at
        a till, a loyalty position never expires the same way. **What is shared is the spend mechanism**,
        and this enum is what lets it be shared.

        '
      enum:
      - wallet
      - giftCard
      - gameCard
      - voucher
      - loyalty
      - prepaidEntitlement
    StoredValueAuthorisation:
      type: object
      x-ticvai-persistence: orders.stored_value_authorisation
      description: 'A hold against any stored-value instrument. **Two-phase by necessity, not by preference**
        — an arcade machine, a kitchen and a gate all take time between committing to a spend and knowing
        it succeeded, and a balance that cannot be held is a balance that gets double-spent or refunded
        by hand.

        '
      required:
      - id
      - kind
      - instrumentId
      - amount
      - status
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StoredValueKind'
        instrumentId:
          type: string
          format: uuid
          description: The wallet, card, voucher or position being held against.
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
          - held
          - partiallyCaptured
          - captured
          - released
          - expired
          description: '**Mirrors `cross-region.WalletAuthorisation` exactly**, which is the point — one
            lifecycle rather than six.

            '
        capturedAmount:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
          description: '**Released automatically.** A hold nobody releases is a guest whose balance is
            short with no explanation, and the arcade is where that happens most.

            '
        reference:
          type: string
          description: What the hold is for — an order, a play, a table visit.
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    SupervisorStepUp:
      type: object
      description: '**A supervisor signs the act in place, on the device making the call** (decided 28
        September, audit R144). Used where the decision is a same-device step-up rather than an
        approval request: reopening a shift, recounting a stock count, a retail return above the
        venue threshold, and (proposed by the coordinator, client to confirm) closing a stock transfer
        short and cancelling a performance.


        **The verification rule, the same on every operation that takes it:** the server checks
        `credential` against `principalId`; that principal must hold the operation''s
        `x-ticvai-permission` at the operation''s scope, must be active at that venue, and must not be
        the person whose act is being reversed where the operation says so. Any failure is a `403`
        (`supervisor-step-up-refused`) and nothing is written. **No approval request is raised**, and
        the operation declares `x-ticvai-step-up: pin`.


        **Where `principalId` comes from, on every operation that takes this** (decided 20 October 2026, Chinmay,
        R8 blocker cause GPS-C31, option A; CHG-R8SPN-035). The PIN prompt shows a picker filled by
        `identity.listStepUpSupervisors` with the operation''s permission: the active principals who hold it at the
        caller''s venue, by display name. The supervisor picks their own name and types their PIN; the prompt sends
        the picked `principalId` (or, where the prompt asks for an employee number instead, `supervisorUsername`).
        **Nobody signs their own act**: a `principalId` (or resolved `supervisorUsername`) equal to the caller''s own
        principal is refused `403 supervisor-step-up-refused`, even when the caller holds the permission, and the
        picker leaves the caller out.

        '
      required:
      - credential
      properties:
        principalId:
          type: string
          format: uuid
          description: The supervisor signing. Recorded against the act. **Exactly one of `principalId` or
            `supervisorUsername`** is sent (neither, or both, is `400`; not in the schema as a oneOf, so an r1 client still validates).
        supervisorUsername:
          type: string
          maxLength: 200
          description: '**The supervisor''s employee number**, which is what the step-up prompt asks for (R8 blocker fix,
            IDENTITY-C44). The server resolves it to the principal (`identity.principal.username`, within the tenant) before it
            checks the PIN; an unknown one is refused exactly as a wrong PIN, `403 supervisor-step-up-refused`, so the prompt
            does not reveal which employee numbers exist. The act is recorded against the resolved principal. Exactly one of
            this or `principalId`.'
        credential:
          type: string
          maxLength: 512
          writeOnly: true
          description: The supervisor's staff PIN, as they sign in at a till with it. **A PIN, never a
            password** (audit R123 (7)). Never stored or returned. Exactly the tenant's
            `PasswordPolicy.pinLength` digits (4, 6 or 8, the tenant's choice; CHG-CRD-002), which the prompt's
            keypad takes from `WorkstationContext.pinLength`. The operation never reads Identity's tables to
            check it; it asks Identity's `verifySupervisorStepUp` query (`x-ticvai-read-via`, CHG-CRD-004),
            and a wrong PIN counts towards `PasswordPolicy.pinLockoutAfterAttempts` as at sign-in.
    SalesChannel:
      type: string
      description: '**Where a sale came from.** Restored 24 August — this was lost in the `Money` rewrite
        and nine references across four contracts were pointing at nothing.

        **Not interchangeable with the local `Channel` enums.** `catalogue.Channel` and `orders.Channel`
        are byte-identical duplicates of each other listing `pos, kiosk, web, mobile, b2b, ota, callCentre`;
        `orders.OrderChannel` lists `guestApp, guestWeb, partner, api, backOffice` on top. **Pointing
        the nine at a local enum would silently narrow them** — and the duplication between the two `Channel`
        enums is the reason a shared one existed in the first place.

        **This is the reporting dimension**: attribution, promotion eligibility and settlement all group
        by it, which is why it has to mean the same thing in `orders`, `catalogue`, `subscription` and
        `marketing-crm` rather than four things that nearly line up.

        '
      enum:
      - pos
      - kiosk
      - guestApp
      - guestWeb
      - callCentre
      - partner
      - api
      - backOffice
      - b2b
      - ota
    ModuleKey:
      type: string
      description: 'What a tenant buys, and what a screen belongs to. **One vocabulary for both sides
        of the join**, because two lists that must agree are one list somebody forgets to update.

        **Grain chosen to match how a venue buys, not how the package is built.** `fnb` is one module
        even though it spans four contracts; `ticketing` and `access` are separate because a venue can
        run a museum with no gates and a stadium with no shop.

        **Moved here from `subscription` on 22 September**, which now references it. The dashboard
        command centre needed the same list to bind a dashboard to a module, and a satellite cannot
        reference another satellite — so the choice was a second copy or a shared one. **A second copy
        is the defect this schema''s own first sentence warns against**, and `SalesChannel` above
        exists for the same reason. A `$ref` is checked by `check-package` rule 34; a mirror is
        checked by nothing, which is the position `ScopeLevel` below is in.

        **The white-label app feature list (`white-label.ModuleKey`) is a different, finer vocabulary, and this is
        the map between them** (R8 blocker fix, IDENTITY-C31; **proposed from the screens'' `requiresModule`, the
        client confirms**). A feature is licensed when the licence module on its row is licensed, and
        `getModuleEnablement` / `setModuleEnablement` use this for `isLicensed` and for the "not licensed" refusal:

        | white-label feature | licence module here |
        |---|---|
        | `ticketsAndBooking`, `events`, `attractions` | `ticketing` |
        | `membership` | `membership` |
        | `virtualQueue` | `queue` |
        | `diningAndFnb` | `fnb` |
        | `shop` | `retail` |
        | `parking` | `access` |
        | `gamification` | `games` |
        | `loyalty` | `marketing` |
        | `photoGallery`, `wallet`, `lostAndFound`, `map`, `visitPlanner` | `core` (always licensed) |

        The two lists are **not** the same, so a licence position (`LicencePosition`) never lists a feature key.

        '
      enum:
      - core
      - ticketing
      - access
      - fnb
      - retail
      - inventory
      - seating
      - membership
      - marketing
      - resources
      - queue
      - transport
      - games
      - maintenance
      - accreditation
      - partner
      - developerApi
      - analytics
      - ai
      - poweredByRemoval
      x-ticvai-note: '**`poweredByRemoval` is an add-on key, never a plan module; no screen requires it** (r8,
        APPROVALS-TENANCY-C17, the lead''s answer B of 20 October 2026). A licence add-on names a ModuleKey
        (`addLicenceAddOn`), and the one add-on that lets a tenant switch off "Powered by TICVAI" is not a module a
        venue runs, so it is listed here and nowhere else: no plan, permission group or `requiresModule` names it.

        **`core` is listed and cannot be unlicensed.** It exists so a screen can say it
        belongs to no optional module rather than leaving the field empty — **an empty field and *always
        on* look identical, and only one of them is a decision.**

        '
    AiResidencyClass:
      type: string
      description: '**Where a tenant''s AI inference may run, chosen per tenant** (Chinmay, 2 October: the AI
        residency decision; amends AI-D02, ADR-0009 and ADR-0020; CHG-CSA-002). Shared because the tenant''s
        setting (tenancy) and the AI gateway (ai: `AiProvider`, `AiModel`) must use one list, for the reason
        `ModuleKey` above gives.

        `uaeOnly` is the **default** and is **mandatory for government, bank and health tenants**: inference stays
        in the UAE. The Small tier is Core42 Compass GPT-4.1 mini (or Seraj, if it wins the Arabic golden set), the
        Strong tier Compass GPT-5, reached through `AiProviderKind` `openaiCompatible`; the fallback is OpenAI UAE.
        **No in-cell model** (Chinmay, 3 October: "We are not hosting anything unless client asks it";
        CHG-R1S-002): the earlier in-cell gpt-oss-120b fallback is dropped.

        `globalAllowed`: a private venue that opts in under PDPL Art. 23 (a vendor contract, a DPIA and a notice
        to guests). Azure gpt-5-mini and gpt-6-sol on Global deployments, or the tenant''s own key (BYOK); the
        fallback is the `uaeOnly` chain. Every tenant in this class is listed in ADR-0009''s transfer register.
        BYOK fits this class only: a tenant key outside OpenAI UAE is a cross-border transfer.

        `onPrem`: inference on the tenant''s own hardware (Qwen3.5 or gpt-oss; Strong tier Qwen3.5-122B,
        Falcon-H1 Arabic or Jais 2), nothing leaves the site. Only where the client asks for it (CHG-R1S-002).

        **Whatever the class, every prompt is scrubbed first** (mandatory offline PII scrubbing, CHG-CSA-003):
        the class decides where a scrubbed prompt may go, never whether it is scrubbed.


        **Added 3 October 2026 (CHG-R1S-016; the legal research `docs/active/research/openai-key-uae-3-october.md`, "What this means
        for TICVAI"; Chinmay''s residency and hosting decisions).** **OpenAI''s UAE-region API project**
        (`ae.api.openai.com`, processing in the UAE, enabled by OpenAI sales on approval) is a `uaeOnly` provider
        beside Core42 Compass and Azure OpenAI UAE North; a BYOK OpenAI key fits `uaeOnly` only on that endpoint
        and a model from its UAE regional list. **Only a `private` tenant may take `globalAllowed`** (tenancy
        `RegionSettings.tenantCategory`). **Failover never widens residency**: a `uaeOnly` call never falls over to
        a global endpoint (`residencyRefused`, ADR-0034); `globalAllowed` may fall back to the UAE chain. **Global
        endpoints are stateless**: no Assistants, Threads or Conversations API, `store=false`, no file upload, no
        fine-tuning with tenant data.

        '
      enum:
      - uaeOnly
      - globalAllowed
      - onPrem
      default: uaeOnly
    OutletPaymentTiming:
      type: string
      description: '**When an F&B order is paid, set per outlet** (Chinmay, 2 October, workbook Q64; refines audit
        R261 per outlet; CHG-CSA-010). `sendFirst`, the default and R261''s rule: the order goes to the kitchen,
        then the till charges (table service, and quick service where the venue wants the kitchen started while
        the guest pays). `payFirst`: the till charges before anything reaches the kitchen; an unpaid order at a
        `payFirst` outlet is never sent (`fnb.createFnbOrder`, `fnb.fireCourse`). Shared because the outlet
        (tenancy `Outlet`) holds it and F&B enforces it.

        '
      enum:
      - sendFirst
      - payFirst
      default: sendFirst
    OutletSiting:
      type: string
      deprecated: true
      description: '**Deprecated alias** (2 October 2026, CHG-CLN-008): the canonical name is the outlet field
        `admissionContext`, typed `tenancy.OutletAdmissionContext`, with the same two values; no operation uses
        this schema and new references must not. Kept so an earlier reference resolves.

        **Whether an outlet is inside the venue''s gates or stands on its own** (Chinmay, 2 October,
        workbook Q70; amends DI-292 for standalone outlets; CHG-CSA-011). `insideVenue`, the default: a guest
        ordering online or at a kiosk needs a valid admission ticket for the venue (DI-292; the admission check
        stays in Access, ADR-0068). `standalone`: a restaurant outside the venue sells takeaway and delivery with
        no ticket. Shared because the outlet (tenancy `Outlet`) holds it and F&B enforces it
        (`fnb.createGuestFnbOrder`).

        '
      enum:
      - insideVenue
      - standalone
      default: insideVenue
    DeviceHardwareType:
      type: string
      description: '**The specific hardware under a device''s `kind`** (ADR-0067, accepted 1 October: one device
        register). Access''s hardware library (`AccessHardwareModel.hardwareType`) and the register of record
        (tenancy `RegisteredDevice.hardwareType`, `platform.device`) use this one list, so a turnstile is the same
        thing in both. Shared rather than copied for the reason `ModuleKey` above gives.

        Under which `kind`: the turnstiles, gates and lanes (`standardTurnstile` to `staffGate`) are
        `turnstileController`; `androidHandheld`, `iosDevice` and `tablet` are `handheldScanner`; `qrBarcodeReader`
        is `barcodeScanner`; `rfidReader`, `nfcReader` and `biometricReader` are the kinds of the same name;
        `multiTechnologyReader` and `externalAccessDevice` are `accessReader`; `podium` and `counter` are
        `accessPodium`; `beacon` is `bleBeacon`; `cameraController` is `camera`.

        '
      enum:
      - standardTurnstile
      - fullHeightTurnstile
      - tripodTurnstile
      - speedGate
      - wideLane
      - accessiblePodGate
      - buggyGate
      - vipGate
      - staffGate
      - androidHandheld
      - iosDevice
      - tablet
      - qrBarcodeReader
      - rfidReader
      - nfcReader
      - multiTechnologyReader
      - biometricReader
      - podium
      - counter
      - beacon
      - cameraController
      - externalAccessDevice
    ScopeLevel:
      type: string
      description: '**The eight organisational levels, plus `subject`.** Restored 24 August.

        `tenancy.yaml` holds the authoritative definition of the eight levels and this mirrors them so a contract can reference
        a level without depending on the whole tenancy surface. **Seven organisational levels plus `outlet`**
        — a commercial branch beside the organisational one (CF-138, ADR-0018). **A department has requisitions
        and rotas; an outlet has a menu and stock**, and modelling a restaurant as a department would
        put it in the staffing tree.


        **`subject` is the one value tenancy does not have, and it is not a level.** It is here because
        `check-package` reads this enum as the closed vocabulary for `x-ticvai-scope-level`, and some
        operations act on one guest''s own resources, which sit in no node of the venue hierarchy.
        So `subject` is valid as an operation''s scope level and never as a `ScopeRef.level`: every
        `ScopeRef` is a row of `platform.scope`, and those carry one of the eight.

        '
      enum:
      - tenant
      - brand
      - region
      - venue
      - department
      - subDepartment
      - workstation
      - outlet
      - subject
    ScopeRef:
      type: object
      description: '**A pointer to a node in the hierarchy, with enough on it to render.** Restored 24
        August — `identity.yaml` references this for `effectiveScopes` and it resolved to nothing.

        **The path is materialised**, so a client can test containment with a prefix match rather than
        walking parents. That is what lets navigation filter locally: a client checks its scopes against
        a screen''s requirement without a round trip, and `platform.scope` (renamed from `platform.org_unit`
        on 26 August) — reached by 304 of 379 tables — never has to be queried to answer it.

        '
      required:
      - id
      - level
      - path
      properties:
        id:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/ScopeLevel'
        path:
          type: string
          description: 'Materialised ltree path. **Prefix-comparable** — `uae.dubai` contains `uae.dubai.marina`.

            '
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    Money:
      type: object
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: numeric(18,4)
      description: '**On the wire this is three fields; in the database it is one column.**

        24 August. Every column typed `Money` was landing as `jsonb` — 129 of them, including `orders.shift.opening_float`,
        `inventory.purchase_order.total` and `promotions.voucher.balance`. **`orders.cash_movement.amount`
        was `numeric(18,4)` because somebody hand-typed that one**, and the inconsistency is what made
        it visible.

        **A jsonb price cannot be summed in SQL.** Every total, variance and reconciliation moves into
        application code — and a shift variance computed in .NET against a ledger computed in Postgres
        is two answers to one question. That is F13 month-end and F98 takings-to-ledger, both walked,
        both assuming the arithmetic is in the database.

        **`currency` and `scale` are not stored per row.** ADR-0018 makes them region-scoped and not overridable
        below, so they resolve from the scope walk — storing AED against nine million rows in a UAE region
        is nine million copies of a fact that cannot differ. A row that needed its own currency would
        be a row in the wrong region.

        **They stay on the wire** because a client reading a figure should not have to walk a hierarchy
        to know what it means.

        '
      required:
      - amount
      - currency
      - scale
      properties:
        amount:
          type: string
          description: 'Decimal string, never a float. Up to 4 decimal places. **Persisted as `numeric(18,4)`**
            — the string is a transport choice, so a JavaScript client cannot round a fare in transit.

            '
          pattern: ^-?\d+(\.\d{1,4})?$
        currency:
          type: string
          description: '**Resolved from the region, not stored on the row** (ADR-0018). OMR uses 3 decimal
            places and AED uses 2 — a venue on a different scale from its region is a ledger that cannot
            consolidate.

            '
          pattern: ^[A-Z]{3}$
        scale:
          type: integer
          description: 'Resolved from the region alongside `currency`. **A currency other than the venue''s or
            region''s trading currency** (a tourist''s USD cash at an AED till, `Payment.tenderAmount`; a
            guest-selected charge currency, `Order.chargeTotal`; a refund in the tender currency) **takes its ISO 4217
            minor units**, held as one fixed list in the kernel (`TICVAI.Domain`, beside Money), so every module
            resolves it the same way and no table, query or migration holds it (ADAM CR-192, option A; Chinmay, 21
            October 2026; CHG-R10ORD-018). The venue and region settings keep their own `currency_scale` for the
            trading currency.'
          minimum: 0
          maximum: 4
    Problem:
      type: object
      description: 'RFC 9457 problem details. Every error response uses this shape.


        **`type` is what a client switches on, so every cause has its own.** `status` says only how
        bad; one `409` can be a paid order, a closed period or an expiring hold, and a client that
        has to read `detail` to tell them apart is parsing prose. The rules:

        - **Shared types are catalogued here**, in `x-ticvai-problem-types` below, and each shared
        response names the types it can carry.

        - **An operation-specific error declares its own type**, one per cause. It lists the type
        slug in `x-ticvai-problem-types` on that response, beside its description. A response whose
        description names several causes lists several types.

        - **Every type URI has one form**: `https://api.ticvai.com/problems/<slug>`, the slug kebab-case.
        The URI identifies the type; clients compare it, never fetch it.

        - **Detail beyond these fields goes in an extension schema**, `allOf: [Problem, {...}]` with
        the extra members, as `StackingProblem` and `SeatConflictProblem` already do. An error whose
        description promises structured detail (which lines, which candidates, which conflict) and
        points at the bare `Problem` has nowhere to put it.

        - **`errors[]` is for field-level validation**, one entry per failing field, `code` naming
        the rule that failed.

        - **A uniqueness rule sits on the property**, as `x-ticvai-unique: tenant` or
        `x-ticvai-unique: venue`: no two rows in that scope share the value, and a clash is the shared
        `duplicate-code` type (audit R108). The value is the scope the index is built on, never a
        hierarchy level in between. **Text is compared case-insensitively**: a code, a name, a
        label, a number or a hostname a person types (`VIP` and `vip` are one role code, one
        promotion code), and so is each text member of an `x-ticvai-unique-together` set; the
        index is on `lower(column)` (CHG-GEN-001, ADAM CR-079, CR-066). **An opaque external id
        is compared exactly**: a value another system or a device issues and a person never types
        (the event id a payment provider sends, what a gate reads off a credential or a piece of
        media, the id of a game reader) says so with `x-ticvai-unique-compare: exact` beside `x-ticvai-unique`. The
        mark is the only exemption; an identifier (uuid) is never case-folded.

        '
      x-ticvai-problem-types:
        validation:
          status: 400
          title: Validation failed
          when: The request is malformed or breaks a schema rule. `errors[]` names each failing field.
        unauthenticated:
          status: 401
          title: Not signed in
          when: No session token, or one that is invalid or expired.
        session-superseded:
          status: 401
          title: Session ended
          when: The session was ended by a force-logout (ADR-0004). The client signs in again rather
            than refreshing.
        forbidden:
          status: 403
          title: Not permitted
          when: Authenticated, but the permission is not held at the requested scope.
        not-found:
          status: 404
          title: Not found
          when: The addressed resource does not exist or is outside the caller's scope. The two
            are deliberately indistinguishable.
        idempotency-conflict:
          status: 409
          title: Idempotency key reused
          when: An `Idempotency-Key` already used for a different request (see the `IdempotencyKey`
            parameter).
        concurrency-conflict:
          status: 409
          title: Changed since read
          when: An optimistic-concurrency check failed. The client re-reads and retries.
        rate-limited:
          status: 429
          title: Too many requests
          when: The concurrency or rate limit is exceeded (ADR-0032), including the tenant's request budget
            for the caller's audience and its share of a busy replica (ADR-0064). Carries `Retry-After` and the
            `RateLimit-*` headers. Never a sync rejection.
        admission-required:
          status: 403
          title: Waiting-room admission required
          when: The performance's on-sale waiting room is on and the request carries no valid admission token
            (`X-Admission-Token` missing, expired, forged or for another performance; ADR-0066). The client
            sends the guest to the waiting room; nothing was held or written.
        duplicate-code:
          status: 409
          title: Code already in use
          when: A create or update names a business code already used within its uniqueness scope
            (decided 28 September, audit R108). Configuration codes (roles, products, categories,
            events, suppliers, loyalty programmes, blacklist entries, media collections) are unique
            per tenant; asset tags, table codes and venue-map points are unique per venue. The
            property carries `x-ticvai-unique` naming its scope, and `detail` names the code and the
            record already holding it. Returned through the shared `DuplicateCode` response, or listed
            beside the operation's own types where one `409` has several causes.
        segregation-breach:
          status: 409
          title: Breaches a segregation rule
          when: A permission set or a grant would leave one role or one principal holding both permissions of a
            `SegregationRule` whose `severity` is `block` (decided 14 October 2026, ADAM CR-079; CHG-IDR-003).
            `detail` names the rule, both permissions and, where a parent role's edit is refused, the child role
            that inherits it. One type with one status wherever the rule is checked (`createRole`,
            `setRolePermissions`, `setPrincipalModuleAccess`, `createDelegatedAccess`, `createPrincipal`);
            `requireApproval` and `warn` never refuse.
        no-approval-route:
          status: 422
          title: No approval route
          when: An approval request that is not a draft matches no active approval rule for its kind and subject
            type (for subject type `tenant`, no active platform rule), so nobody could be asked. Nothing is written
            and the request is never approved automatically. Answered by approvals' `createApprovalRequest` and passed
            on unchanged by the operation that raised the request (`suspendTenant`, `reactivateTenant`; lead's ruling
            on lane H review 3 N-1, 20 October 2026; CHG-R8SPN-015).
        server-error:
          status: 500
          title: Server error
          when: An unexpected failure. `traceId` is what support asks for.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: 'The problem type URI, `https://api.ticvai.com/problems/<slug>`. The slug is one
            of the shared types in `x-ticvai-problem-types` on this schema, or one the operation''s own
            error response declares.

            '
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    Page:
      type: object
      required:
      - items
      - hasMore
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
        hasMore:
          type: boolean
  responses:
    BadRequest:
      description: Validation failed
      x-ticvai-problem-types:
      - validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or superseded session
      x-ticvai-problem-types:
      - unauthenticated
      - session-superseded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted at the requested scope
      x-ticvai-problem-types:
      - forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Idempotency conflict or optimistic concurrency failure. Two causes, so two types.
        The idempotency case can follow any mutating request, because every one carries an
        `Idempotency-Key`. An operation-specific `409` (a state that refuses the change) is not this
        response. The operation lists it with its own type.

        '
      x-ticvai-problem-types:
      - idempotency-conflict
      - concurrency-conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'The resource does not exist, or is outside the caller''s scope. **This includes
        a parent in the path.** A list or read under `/{parent}/{id}/...` whose parent id is unknown
        or out of scope is a `404`, not an empty page. The path addresses that parent. A query
        filter addresses nothing, so an unmatched filter value is an empty page, not a `404`.

        '
      x-ticvai-problem-types:
      - not-found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DuplicateCode:
      description: 'A business code the request names is already used within its uniqueness scope
        (the scope the property''s `x-ticvai-unique` names; decided 28 September, audit R108). Only
        for a `409` whose single cause is the duplicate. A `409` with other causes lists
        `duplicate-code` beside its own types instead.

        '
      x-ticvai-problem-types:
      - duplicate-code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 'Rate limit exceeded for this tenant, venue or principal. **Declared by every operation**
        (ADR-0064, accepted 1 October; SD-043): each tenant has a request budget per audience, a token bucket with
        a burst of twice the rate for ten seconds, and one tenant may hold at most 25% of a replica''s request
        slots once the replica is above 70% of its limit. Shedding order stays ADR-0032''s: `guest` and `public`
        first, `staff` and `service` last. Retry after `Retry-After`; nothing was written.

        '
      x-ticvai-problem-types:
      - rate-limited
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: '**The dependency is unavailable or its circuit breaker is open** (system-design review
        SD-043, 29 September; ADR-0032). Retry after `Retry-After`; nothing was written.'
      x-ticvai-problem-types:
      - service-unavailable
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdmissionRequired:
      description: 'The performance''s on-sale waiting room is on and the request has no valid admission token
        (ADR-0066). The client sends the guest to the waiting room (catalogue `enterWaitingRoom`); nothing was held.

        '
      x-ticvai-problem-types:
      - admission-required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The row changed since the `If-Match` version was read (SD-013). Re-read and retry.
      x-ticvai-problem-types:
      - precondition-failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    prospectAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Prospect sign-up session token** (decided 2 October 2026, Chinmay: DEC-167, "Email +
        one-time code"; CHG-CLN-010). The audience `prospect`: somebody signing their venue up to TICVAI
        through the public sign-up journey (P17) before any tenant exists. Issued once the prospect proves
        their email with a one-time code, and "Continue saved setup" signs back in the same way. **Scoped to
        one onboarding application**: it reads and writes only that application, its assessment, its package
        and its subscription choice, carries no tenant and no permission, and an operation''s
        `x-ticvai-permission` is what a staff caller must hold, never the prospect. Expires with the
        application''s activation or abandonment.

        '
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Staff session token. Carries `sid` (validated against the session registry), `tenant`,
        `cell` and the principal. Permissions are resolved at login and cached; the token itself does
        not carry them.


        **Lifetimes and signing (proposed, client to correct;** decided 20 October 2026, Chinmay, R8 blocker
        causes IDENTITY-C25 and FOUNDATION-AI-C27; CHG-R8SPN-014). The access token lives 15 minutes
        (`TokenPair.expiresIn` 900). The refresh token lives 12 hours, sliding: every use of it at `refreshToken`
        returns a new refresh token and retires the old one (rotation); a retired refresh token presented again
        is a reuse, and the server then ends the session and revokes every refresh token issued from the same
        sign-in (the family). The session ends when the shift on its workstation closes, or, for a session with no
        shift (a browser door, a staff handheld), when it reaches its maximum age (12 hours) or ends at
        `logout`. Each value is configurable per tenant on `PasswordPolicy` (`accessTokenMinutes`,
        `refreshTokenHours`, `sessionMaxHours`); the numbers here are the defaults. Tokens are signed **RS256**
        with **one key per cell**, held in the cell''s Key Vault and never exported; the token header carries the
        key''s `kid`. The key rotates yearly, and the previous key still verifies for 24 hours after a rotation.


        **A Control Plane platform-staff token** is accepted by a cell only for `openPlatformStaffGrant`,
        and for any other operation only while an open platform-staff grant exists for that tenant.
        The cell then resolves the caller''s permissions from the grant, not from a role in the tenant,
        and every action under it is audited and visible to the tenant (decided 28 September, audit
        R098).

        '
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Guest session token. Structurally different from a staff token: no workstation, no
        role selection, 30 days sliding, one session per device (decided 28 September, audit
        R126), and revoked independently. Scoped to the
        guest''s own resources — a guest token can never widen to another subject.


        **An anonymous guest session** (20 October 2026, R8 blocker cause GPS-C23; CHG-R8SPN-031) is a guest token with
        no subject, opened by `orders.createCart` for a visitor with no credential and bound to that cart; it reaches the
        cart operations and nothing that needs a known guest, and it ends when `claimCart` moves the cart to an account.


        **Every public guest read of venue data runs under the venue the request names** (decided 25 October 2026,
        Chinmay, ADAM CR-198 option A; CHG-R10ID-010). A guest app or site names its venue on the request: the path''s
        `{venueId}`, or a required `venueId` query parameter, where the operation has one, else the `X-Venue-Id` header
        (the `GuestVenue` parameter, declared on each such read). The server checks the venue is one of the tenant''s venues (a venue not of the tenant is
        `404`) and builds, for that request only, a read-only scope of the venue''s path (`ticvai.scope_paths` the
        venue''s path, nothing written), so row-level security stays the line of defence and browsing needs no session.
        A read that names no venue has no scope and finds nothing, as before. **An anonymous guest session (CR-183)
        carries the same venue scope**: the venue it was opened for, checked the same way; a signed-in guest''s read of
        public venue data takes the venue the request names in the same way, beside its own subject. This holds for
        every venue-level read callable without a session (`security` admitting `{}`); an operation does not repeat
        it, and needs only to declare `GuestVenue` when its request names no venue otherwise. Not such a read: one
        addressed by its own token (`getOrder` under an order access token, `getPaymentLink` by the link''s token), whose
        token gives its one-row reach, and `getWaitingRoomPosition`, which reads the waiting room''s own store
        (ADR-0066), not a venue table.

        '
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Cell-to-cell and cell-to-Control-Plane authentication. There is no user, so the permission
        model does not apply.

        The token is issued to a cell identity, carries `aud: cell` or `aud: control-plane`, names the
        calling cell in `sub`, and is short-lived. Transport is mTLS with per-cell client certificates;
        the token identifies **which** cell, the certificate proves it.

        A caller presenting a valid token from the wrong certificate is rejected. Neither alone is sufficient.

        **The connection context of a call with no user** (R8 blocker IDENTITY-C48, the lead''s option A; CHG-R8MIG-007;
        backend/MIGRATIONS.md "The connection context"; r8 integration, CHG-R8INT-024): the tenant comes from the cell
        token''s `tid` claim, `ticvai.scope_paths` is the tenant root, the calling cell is the audited actor, and its
        idempotency records are claimed under that context.

        '
    deviceAuth:
      type: http
      scheme: bearer
      description: '**A registered device, authenticated as itself** (decided 20 October 2026, Chinmay, R8 blocker
        cause APPROVALS-TENANCY-C27, option A; CHG-R8SPN-030). The credential is the one `enrolDevice` issued and
        `tenancy.device_credential` holds (`kind` `clientCertificate`, `deviceToken` or `mutualTls`): a device token is
        sent as the bearer value, a certificate is presented on the TLS connection (and the bearer value is then the
        device id). The server checks it against an active, unrevoked `device_credential` row, resolves the device
        (`platform.device`) and through it the workstation and scope the device is bound to, and acts as that device:
        no person, no role, no permission. A device can only report about itself; a call naming another device is
        `404`. A retired or unapproved device, or a revoked credential, is `401`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Partner and developer authentication. Keys are tenant-scoped, carry their own permission
        set, and are rate-limited per key. Deferred pending the Developer & API workshop.

        '
