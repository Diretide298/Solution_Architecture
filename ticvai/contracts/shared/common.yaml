openapi: 3.1.0
info:
  title: TICVAI Shared Components
  version: 1.0.0
  description: '## How to read this file

    **Shared types. Every other contract references these rather than redefining them.**

    A type defined once and referenced everywhere is a type that cannot drift. `Money` declared separately
    in eleven contracts would be eleven chances to forget that some currencies use three decimal places.

    | Defined here | Why it is shared | |---|---| | `Money` | Amount, currency and **scale**. A fixed
    two-place type truncates 3dp currencies | | `ScopeRef` | A node in the seven-level hierarchy, with
    its ltree path | | `Problem` | RFC 9457 error shape with an enumerated `type`. Clients switch on it
    | | `Page` | Cursor pagination. Offset drifts under concurrent writes | | Parameters | `Idempotency-Key`,
    page size, page cursor | | **Security schemes** | The four authentication models — see below |

    ## Authentication

    | Scheme | Used by | |---|---| | `bearerAuth` | Staff sessions. Carries `sid`, validated against the
    session registry | | `guestAuth` | Guest sessions. No workstation, no role selection, 30 days sliding, one session
    per device (audit R126) | | `serviceAuth` | Cell-to-cell and cell-to-Control-Plane. mTLS plus a cell-identity token |
    | `apiKeyAuth` | Partner and developer. Deferred pending the Developer & API workshop |

    Authorisation is **not** expressed through OAuth scopes. Permissions resolve at login against a seven-level
    tree with deny-overrides-allow, which scopes cannot express — so they live in `x-ticvai-permission`
    and `x-ticvai-scope-level` on each operation instead.

    Components referenced by every TICVAI contract. Changes here are breaking changes to every consumer
    — treat accordingly.

    '
components:
  parameters:
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      description: 'Opaque cursor: the `nextCursor` of the previous page. Absent on first request.
        **A keyset position, not an offset.** It names the last item returned in the list''s order,
        with the item id as the tiebreak, so rows written between two page requests neither repeat
        nor go missing. That drift is the reason offset paging is refused. Clients never build or
        parse a cursor.

        '
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated ULID. Servers deduplicate on this value. Required on every mutating
        request because offline clients replay their outbox on reconnect.


        **One key per write, and it governs replay.**

        - **A replay gets the first answer.** A request that repeats a key the server has already
        completed gets the stored original response (status and body), and nothing is written a
        second time (backend-patterns: `IIdempotencyStore`).

        - **A body ULID `id` is the same key.** An edge-created entity''s client ULID "doubles as the
        idempotency key" (naming-and-style §4), so where a create body carries a client `id`, it
        must equal this header. A request whose header and body `id` differ is a `400` with problem
        type `validation`.

        - **A reused key with a different request is a `409`.** The same key sent with a different
        body, or a body `id` that already exists under another key, is the shared `Conflict`
        response with problem type `idempotency-conflict`. It never applies the second request.

        - **The record is durable** (system-design review SD-024, 29 September). The key, the operation, a
        hash of the request and the stored response are written to `platform.idempotency_record` **in the same
        transaction as the state change**, unique on (key, operation). Redis (`cache:idempotency`) is a
        read-through cache in front of it and never the guarantee, so a Redis failover during a retry storm
        cannot let `createPayment` or `syncOrders` apply twice.

        '
      schema:
        type: string
        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: '**Optimistic concurrency for `serverWins`** (system-design review SD-013, 29 September;
        ADR-0031). The `ETag` of the version the caller read. A write whose row has moved since is refused
        with the shared `PreconditionFailed` response instead of silently overwriting. Absent, the write is
        unconditional, as before.'
      schema:
        type: string
    PreferValidateOnly:
      name: Prefer
      in: header
      required: false
      description: '**Validate, do not write** (29 September, AI system design 2.3 and 2.2 D step 4). With
        `Prefer: validate-only` the owner validates the request exactly as it would for a real write and
        returns what would change without writing: `200` with the would-be result, or the same `4xx` it
        would return. Nothing is persisted, no event is published, and no idempotency key is consumed, so
        the real write can follow with the same `Idempotency-Key`.

        Used by the AI executor to validate an action plan step against its owner before approval and again
        before execution. Only operations that name this parameter accept it; the tool registry records
        which (`ai.AiTool.validateOnly`). Absent, the request is an ordinary write.

        '
      schema:
        type: string
        enum:
        - validate-only
    ConsistencyToken:
      name: X-Consistency-Token
      in: header
      required: false
      description: 'Opaque token returned by a prior write: the database instance and its WAL LSN (SD-025,
        29 September; ADR-0040 allows several instances per region, so an LSN alone is ambiguous). When present
        the read is routed to a replica that has caught up past this position, or to the primary. Prevents a ticket sold at the gate being
        refused by a lagging replica seconds later.


        The value comes from the `X-Consistency-Token` response header of that write, declared once
        as the shared header `ConsistencyToken` below.

        '
      schema:
        type: string
  headers:
    ConsistencyToken:
      description: 'WAL LSN of the write that produced this response. A client that reads its own
        write next passes it back as the `X-Consistency-Token` request parameter. Declared here so
        a write response references one definition, `$ref: ''../shared/common.yaml#/components/headers/ConsistencyToken''`,
        rather than repeating an untyped header.

        '
      schema:
        type: string
    RetryAfter:
      description: 'Whole seconds to wait before retrying. **A real figure, jittered** (ADR-0032). A fixed
        value synchronises every client into the same retry instant. An offline till treats a `429`
        as *retry later*, never as a sync rejection.

        '
      schema:
        type: integer
        minimum: 0
  schemas:
    StoredValueKind:
      type: string
      description: '**Six things in this package hold a balance and behave the same way** — a wallet,
        a gift card, a game card, a voucher, a loyalty position and a prepaid entitlement. They were built
        separately across three sessions and each grew its own balance, bonus balance, status, blocked
        reason and expiry (CF-126).

        **The concern is not tidiness. Only one of the six could hold an authorisation.** `authoriseWalletSpend`
        / `captureWalletAuthorisation` / `relinquishWalletAuthorisation` gave two-phase spend to the retail
        wallet alone, so **a guest with 200 game credits starting a play the machine then failed had no
        held balance** — the credits were either taken or not, with no third state.

        The entities stay distinct because their lifecycles genuinely differ — a gift card activates at
        a till, a loyalty position never expires the same way. **What is shared is the spend mechanism**,
        and this enum is what lets it be shared.

        '
      enum:
      - wallet
      - giftCard
      - gameCard
      - voucher
      - loyalty
      - prepaidEntitlement
    StoredValueAuthorisation:
      type: object
      x-ticvai-persistence: orders.stored_value_authorisation
      description: 'A hold against any stored-value instrument. **Two-phase by necessity, not by preference**
        — an arcade machine, a kitchen and a gate all take time between committing to a spend and knowing
        it succeeded, and a balance that cannot be held is a balance that gets double-spent or refunded
        by hand.

        '
      required:
      - id
      - kind
      - instrumentId
      - amount
      - status
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StoredValueKind'
        instrumentId:
          type: string
          format: uuid
          description: The wallet, card, voucher or position being held against.
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
          - held
          - partiallyCaptured
          - captured
          - released
          - expired
          description: '**Mirrors `cross-region.WalletAuthorisation` exactly**, which is the point — one
            lifecycle rather than six.

            '
        capturedAmount:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
          description: '**Released automatically.** A hold nobody releases is a guest whose balance is
            short with no explanation, and the arcade is where that happens most.

            '
        reference:
          type: string
          description: What the hold is for — an order, a play, a table visit.
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    SupervisorStepUp:
      type: object
      description: '**A supervisor signs the act in place, on the device making the call** (decided 28
        September, audit R144). Used where the decision is a same-device step-up rather than an
        approval request: reopening a shift, recounting a stock count, a retail return above the
        venue threshold, and (proposed by the coordinator, client to confirm) closing a stock transfer
        short and cancelling a performance.


        **The verification rule, the same on every operation that takes it:** the server checks
        `credential` against `principalId`; that principal must hold the operation''s
        `x-ticvai-permission` at the operation''s scope, must be active at that venue, and must not be
        the person whose act is being reversed where the operation says so. Any failure is a `403`
        (`supervisor-step-up-refused`) and nothing is written. **No approval request is raised**, and
        the operation declares `x-ticvai-step-up: pin`.

        '
      required:
      - principalId
      - credential
      properties:
        principalId:
          type: string
          format: uuid
          description: The supervisor signing. Recorded against the act.
        credential:
          type: string
          maxLength: 512
          writeOnly: true
          description: The supervisor's staff PIN, as they sign in at a till with it. **A PIN, never a
            password** (audit R123 (7)). Never stored or returned.
    SalesChannel:
      type: string
      description: '**Where a sale came from.** Restored 24 August — this was lost in the `Money` rewrite
        and nine references across four contracts were pointing at nothing.

        **Not interchangeable with the local `Channel` enums.** `catalogue.Channel` and `orders.Channel`
        are byte-identical duplicates of each other listing `pos, kiosk, web, mobile, b2b, ota, callCentre`;
        `orders.OrderChannel` lists `guestApp, guestWeb, partner, api, backOffice` on top. **Pointing
        the nine at a local enum would silently narrow them** — and the duplication between the two `Channel`
        enums is the reason a shared one existed in the first place.

        **This is the reporting dimension**: attribution, promotion eligibility and settlement all group
        by it, which is why it has to mean the same thing in `orders`, `catalogue`, `subscription` and
        `marketing-crm` rather than four things that nearly line up.

        '
      enum:
      - pos
      - kiosk
      - guestApp
      - guestWeb
      - callCentre
      - partner
      - api
      - backOffice
      - b2b
      - ota
    ModuleKey:
      type: string
      description: 'What a tenant buys, and what a screen belongs to. **One vocabulary for both sides
        of the join**, because two lists that must agree are one list somebody forgets to update.

        **Grain chosen to match how a venue buys, not how the package is built.** `fnb` is one module
        even though it spans four contracts; `ticketing` and `access` are separate because a venue can
        run a museum with no gates and a stadium with no shop.

        **Moved here from `subscription` on 22 September**, which now references it. The dashboard
        command centre needed the same list to bind a dashboard to a module, and a satellite cannot
        reference another satellite — so the choice was a second copy or a shared one. **A second copy
        is the defect this schema''s own first sentence warns against**, and `SalesChannel` above
        exists for the same reason. A `$ref` is checked by `check-package` rule 34; a mirror is
        checked by nothing, which is the position `ScopeLevel` below is in.

        '
      enum:
      - core
      - ticketing
      - access
      - fnb
      - retail
      - inventory
      - seating
      - membership
      - marketing
      - resources
      - queue
      - transport
      - games
      - maintenance
      - accreditation
      - partner
      - developerApi
      - analytics
      - ai
      x-ticvai-note: '**`core` is listed and cannot be unlicensed.** It exists so a screen can say it
        belongs to no optional module rather than leaving the field empty — **an empty field and *always
        on* look identical, and only one of them is a decision.**

        '
    ScopeLevel:
      type: string
      description: '**The eight organisational levels, plus `subject`.** Restored 24 August.

        `tenancy.yaml` holds the authoritative definition of the eight levels and this mirrors them so a contract can reference
        a level without depending on the whole tenancy surface. **Seven organisational levels plus `outlet`**
        — a commercial branch beside the organisational one (CF-138, ADR-0018). **A department has requisitions
        and rotas; an outlet has a menu and stock**, and modelling a restaurant as a department would
        put it in the staffing tree.


        **`subject` is the one value tenancy does not have, and it is not a level.** It is here because
        `check-package` reads this enum as the closed vocabulary for `x-ticvai-scope-level`, and some
        operations act on one guest''s own resources, which sit in no node of the venue hierarchy.
        So `subject` is valid as an operation''s scope level and never as a `ScopeRef.level`: every
        `ScopeRef` is a row of `platform.scope`, and those carry one of the eight.

        '
      enum:
      - tenant
      - brand
      - region
      - venue
      - department
      - subDepartment
      - workstation
      - outlet
      - subject
    ScopeRef:
      type: object
      description: '**A pointer to a node in the hierarchy, with enough on it to render.** Restored 24
        August — `identity.yaml` references this for `effectiveScopes` and it resolved to nothing.

        **The path is materialised**, so a client can test containment with a prefix match rather than
        walking parents. That is what lets navigation filter locally: a client checks its scopes against
        a screen''s requirement without a round trip, and `platform.scope` (renamed from `platform.org_unit`
        on 26 August) — reached by 304 of 379 tables — never has to be queried to answer it.

        '
      required:
      - id
      - level
      - path
      properties:
        id:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/ScopeLevel'
        path:
          type: string
          description: 'Materialised ltree path. **Prefix-comparable** — `uae.dubai` contains `uae.dubai.marina`.

            '
        code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
    Money:
      type: object
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: numeric(18,4)
      description: '**On the wire this is three fields; in the database it is one column.**

        24 August. Every column typed `Money` was landing as `jsonb` — 129 of them, including `orders.shift.opening_float`,
        `inventory.purchase_order.total` and `promotions.voucher.balance`. **`orders.cash_movement.amount`
        was `numeric(18,4)` because somebody hand-typed that one**, and the inconsistency is what made
        it visible.

        **A jsonb price cannot be summed in SQL.** Every total, variance and reconciliation moves into
        application code — and a shift variance computed in .NET against a ledger computed in Postgres
        is two answers to one question. That is F13 month-end and F98 takings-to-ledger, both walked,
        both assuming the arithmetic is in the database.

        **`currency` and `scale` are not stored per row.** ADR-0018 makes them region-scoped and not overridable
        below, so they resolve from the scope walk — storing AED against nine million rows in a UAE region
        is nine million copies of a fact that cannot differ. A row that needed its own currency would
        be a row in the wrong region.

        **They stay on the wire** because a client reading a figure should not have to walk a hierarchy
        to know what it means.

        '
      required:
      - amount
      - currency
      - scale
      properties:
        amount:
          type: string
          description: 'Decimal string, never a float. Up to 4 decimal places. **Persisted as `numeric(18,4)`**
            — the string is a transport choice, so a JavaScript client cannot round a fare in transit.

            '
          pattern: ^-?\d+(\.\d{1,4})?$
        currency:
          type: string
          description: '**Resolved from the region, not stored on the row** (ADR-0018). OMR uses 3 decimal
            places and AED uses 2 — a venue on a different scale from its region is a ledger that cannot
            consolidate.

            '
          pattern: ^[A-Z]{3}$
        scale:
          type: integer
          description: Resolved from the region alongside `currency`.
          minimum: 0
          maximum: 4
    Problem:
      type: object
      description: 'RFC 9457 problem details. Every error response uses this shape.


        **`type` is what a client switches on, so every cause has its own.** `status` says only how
        bad; one `409` can be a paid order, a closed period or an expiring hold, and a client that
        has to read `detail` to tell them apart is parsing prose. The rules:

        - **Shared types are catalogued here**, in `x-ticvai-problem-types` below, and each shared
        response names the types it can carry.

        - **An operation-specific error declares its own type**, one per cause. It lists the type
        slug in `x-ticvai-problem-types` on that response, beside its description. A response whose
        description names several causes lists several types.

        - **Every type URI has one form**: `https://api.ticvai.com/problems/<slug>`, the slug kebab-case.
        The URI identifies the type; clients compare it, never fetch it.

        - **Detail beyond these fields goes in an extension schema**, `allOf: [Problem, {...}]` with
        the extra members, as `StackingProblem` and `SeatConflictProblem` already do. An error whose
        description promises structured detail (which lines, which candidates, which conflict) and
        points at the bare `Problem` has nowhere to put it.

        - **`errors[]` is for field-level validation**, one entry per failing field, `code` naming
        the rule that failed.

        - **A uniqueness rule sits on the property**, as `x-ticvai-unique: tenant` or
        `x-ticvai-unique: venue`: no two rows in that scope share the value, compared
        case-insensitively, and a clash is the shared `duplicate-code` type (audit R108). The value
        is the scope the index is built on, never a hierarchy level in between.

        '
      x-ticvai-problem-types:
        validation:
          status: 400
          title: Validation failed
          when: The request is malformed or breaks a schema rule. `errors[]` names each failing field.
        unauthenticated:
          status: 401
          title: Not signed in
          when: No session token, or one that is invalid or expired.
        session-superseded:
          status: 401
          title: Session ended
          when: The session was ended by a force-logout (ADR-0004). The client signs in again rather
            than refreshing.
        forbidden:
          status: 403
          title: Not permitted
          when: Authenticated, but the permission is not held at the requested scope.
        not-found:
          status: 404
          title: Not found
          when: The addressed resource does not exist or is outside the caller's scope. The two
            are deliberately indistinguishable.
        idempotency-conflict:
          status: 409
          title: Idempotency key reused
          when: An `Idempotency-Key` already used for a different request (see the `IdempotencyKey`
            parameter).
        concurrency-conflict:
          status: 409
          title: Changed since read
          when: An optimistic-concurrency check failed. The client re-reads and retries.
        rate-limited:
          status: 429
          title: Too many requests
          when: The concurrency or rate limit is exceeded (ADR-0032). Carries `Retry-After`. Never
            a sync rejection.
        duplicate-code:
          status: 409
          title: Code already in use
          when: A create or update names a business code already used within its uniqueness scope
            (decided 28 September, audit R108). Configuration codes (roles, products, categories,
            events, suppliers, loyalty programmes, blacklist entries, media collections) are unique
            per tenant; asset tags, table codes and venue-map points are unique per venue. The
            property carries `x-ticvai-unique` naming its scope, and `detail` names the code and the
            record already holding it. Returned through the shared `DuplicateCode` response, or listed
            beside the operation's own types where one `409` has several causes.
        server-error:
          status: 500
          title: Server error
          when: An unexpected failure. `traceId` is what support asks for.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: 'The problem type URI, `https://api.ticvai.com/problems/<slug>`. The slug is one
            of the shared types in `x-ticvai-problem-types` on this schema, or one the operation''s own
            error response declares.

            '
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    Page:
      type: object
      required:
      - items
      - hasMore
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
        hasMore:
          type: boolean
  responses:
    BadRequest:
      description: Validation failed
      x-ticvai-problem-types:
      - validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or superseded session
      x-ticvai-problem-types:
      - unauthenticated
      - session-superseded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not permitted at the requested scope
      x-ticvai-problem-types:
      - forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Idempotency conflict or optimistic concurrency failure. Two causes, so two types.
        The idempotency case can follow any mutating request, because every one carries an
        `Idempotency-Key`. An operation-specific `409` (a state that refuses the change) is not this
        response. The operation lists it with its own type.

        '
      x-ticvai-problem-types:
      - idempotency-conflict
      - concurrency-conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'The resource does not exist, or is outside the caller''s scope. **This includes
        a parent in the path.** A list or read under `/{parent}/{id}/...` whose parent id is unknown
        or out of scope is a `404`, not an empty page. The path addresses that parent. A query
        filter addresses nothing, so an unmatched filter value is an empty page, not a `404`.

        '
      x-ticvai-problem-types:
      - not-found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DuplicateCode:
      description: 'A business code the request names is already used within its uniqueness scope
        (the scope the property''s `x-ticvai-unique` names; decided 28 September, audit R108). Only
        for a `409` whose single cause is the duplicate. A `409` with other causes lists
        `duplicate-code` beside its own types instead.

        '
      x-ticvai-problem-types:
      - duplicate-code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded for this tenant, venue or principal
      x-ticvai-problem-types:
      - rate-limited
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: '**The dependency is unavailable or its circuit breaker is open** (system-design review
        SD-043, 29 September; ADR-0032). Retry after `Retry-After`; nothing was written.'
      x-ticvai-problem-types:
      - service-unavailable
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The row changed since the `If-Match` version was read (SD-013). Re-read and retry.
      x-ticvai-problem-types:
      - precondition-failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Staff session token. Carries `sid` (validated against the session registry), `tenant`,
        `cell` and the principal. Permissions are resolved at login and cached; the token itself does
        not carry them.


        **A Control Plane platform-staff token** is accepted by a cell only for `openPlatformStaffGrant`,
        and for any other operation only while an open platform-staff grant exists for that tenant.
        The cell then resolves the caller''s permissions from the grant, not from a role in the tenant,
        and every action under it is audited and visible to the tenant (decided 28 September, audit
        R098).

        '
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Guest session token. Structurally different from a staff token: no workstation, no
        role selection, 30 days sliding, one session per device (decided 28 September, audit
        R126), and revoked independently. Scoped to the
        guest''s own resources — a guest token can never widen to another subject.

        '
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Cell-to-cell and cell-to-Control-Plane authentication. There is no user, so the permission
        model does not apply.

        The token is issued to a cell identity, carries `aud: cell` or `aud: control-plane`, names the
        calling cell in `sub`, and is short-lived. Transport is mTLS with per-cell client certificates;
        the token identifies **which** cell, the certificate proves it.

        A caller presenting a valid token from the wrong certificate is rejected. Neither alone is sufficient.

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Partner and developer authentication. Keys are tenant-scoped, carry their own permission
        set, and are rate-limited per key. Deferred pending the Developer & API workshop.

        '
