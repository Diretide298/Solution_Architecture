openapi: 3.1.0
info:
  x-ticvai-tier: shared
  x-ticvai-module: "Cross-cutting — the single authorisation vocabulary"
  x-ticvai-platforms: ["All platforms"]
  title: TICVAI Permission Vocabulary
  version: 1.0.0
  description: >
    ## How to read this file

    **The single source of permission strings.** Backend authorisation, frontend navigation
    filtering and AI capability scoping all consume the enum below through generated code.
    It is never hand-typed anywhere.

    Every `x-ticvai-permission` in every contract is validated against this enum in CI. If a
    permission is not here, the contract does not build.

    **Why one file rather than per-context enums:** if the frontend spells a permission
    differently from the backend, a supervisor sees a button that returns 403 — invisible in
    code review, obvious in production, and impossible if both generate from the same source.

    ## What a permission is not

    A permission says *what*. It does not say *where* — that is `x-ticvai-scope-level`, and
    the two are resolved together against the seven-level hierarchy. Holding
    `ORDER_REFUND` means nothing until it is held at a scope that contains the order.

    ---

    The single source of permission strings.

    Backend authorisation, frontend navigation filtering and AI capability scoping all
    consume the enum below via generated code. It is never hand-typed anywhere.

    If the frontend spells a permission differently from the backend, a supervisor sees a
    button that returns 403 — invisible in code review, obvious in production.

    Format: <DOMAIN>_<ACTION>[_<QUALIFIER>]

    Resolution semantics are normative and defined in
    [docs/architecture/specs/permission-resolution.md](../../docs/architecture/specs/permission-resolution.md):
    deny-overrides-allow, downward inheritance only, default deny, resolved once at login.

    ## What `x-ticvai-permission-escalated` means

    **Decided 28 September, audit R197.** An operation may declare a second, higher permission
    beside its base one. **The escalated permission is required only above a configured value
    threshold** — an amount, a count or a percentage that the operation's own description names,
    and that the venue sets as policy (the way NOTE-1 below keeps the refund threshold out of the
    grant). Below the threshold the base permission is enough; above it the caller must also hold
    the escalated one at the same scope, or the call is refused `403`.

    **The escalated permission must be a different, manager-level permission from the base.** An
    escalation that repeats the base gates nothing. **Where no threshold makes sense, the operation
    declares no escalation at all** rather than a copy of its base. A condition that is not a value
    (the order is somebody else's, the box is not the caller's own) is written as a comment on the
    declaration, as `closeShift` does.

    **Who holds the escalated permission is role configuration**, not a contract fact: the seeded
    role templates give it to the manager roles, and a tenant may move it.

    ## Who must use MFA

    **By permission, not by role — decided 28 September, audit R135.** A principal holding any
    permission in `PasswordPolicy.mfaRequiredForPermissions` (contracts/spine/identity.yaml) must
    have an active MFA method. The platform floor is `ROLE_MANAGE`, `LEDGER_APPROVE` and every
    `PLATFORM_*` permission; a tenant may add to the list and never remove from the floor.

components:
  schemas:
    Permission:
      type: string
      enum:
        # --- Session and identity ---------------------------------------------
        - SESSION_FORCE_LOGOUT        # terminate another principal's session
        - USER_MANAGE                 # create, edit, deactivate principals
        - ROLE_MANAGE                 # create roles and attach grants
        - PERMISSION_GRANT            # assign grants to a principal
        - PERMISSION_VIEW             # view the grant set of others
        - PERMISSION_MANAGE           # author, approve and retire access policies
        # **Separate from `PERMISSION_GRANT` on purpose.** Granting a role to a person is a
        # daily act a duty manager performs; writing the policy that decides what any role
        # can do at three in the morning is not. 3.3.26 asks for approval on the second and
        # says nothing about the first.

        # --- Control Plane ---
        # Held by platform staff, never by tenant users. These operate outside any cell.
        - PLATFORM_TENANT_VIEW
        - PLATFORM_TENANT_MANAGE
        - PLATFORM_TENANT_TERMINATE   # deliberately separate from MANAGE
        - PLATFORM_PLAN_MANAGE
        - PLATFORM_CELL_VIEW
        - PLATFORM_CELL_MANAGE
        - PLATFORM_BILLING_VIEW
        - PLATFORM_BILLING_MANAGE
        - PLATFORM_RELEASE_VIEW
        - PLATFORM_RELEASE_MANAGE     # cut releases, register environments, schedule upgrades
        - PLATFORM_RELEASE_PROMOTE    # promote, pause, roll back. Separate from MANAGE
        - PLATFORM_MIGRATION_VIEW
        - PLATFORM_MIGRATION_APPLY    # apply a plan. Requires step-up
        - PLATFORM_TENANT_ACCESS      # open a time-boxed platform-staff grant into one tenant
        # **How a platform operator acts inside a tenant — decided 28 September, audit R098.** The
        # operator picks a tenant and opens a platform-staff grant (`openPlatformStaffGrant`,
        # contracts/spine/identity.yaml). The grant is time-boxed, names the permissions it carries,
        # and every action under it is audited and listed to the tenant. Holding this permission
        # grants nothing in a cell by itself.

        # --- Tenant experience ---
        - TENANT_CONFIGURE            # edit branding, content, navigation, modules
        - TENANT_VIEW                 # read venue settings and policies without being able to change them
        # **Decided 28 September, audit R091 (3).** `getVenueSettings`, `getOfflinePolicy` and
        # `getConnectivityPolicy` were gated by `TENANT_CONFIGURE`, so anybody who needed to *see*
        # a venue's settings had to be allowed to change them.
        - TENANT_PUBLISH              # publish a configuration version, restore a prior one

        # --- Organisation -----------------------------------------------------
        - SCOPE_VIEW                  # read the hierarchy
        - SCOPE_MANAGE                # create, move, deactivate scope nodes
        - REGION_CONFIGURE            # currency, decimals, time zone, fiscal year
        - WORKSTATION_CONFIGURE       # sale board, device bindings, access point

        # --- Catalogue --------------------------------------------------------
        - PRODUCT_VIEW
        - PRODUCT_CONFIGURE
        - PRODUCT_APPROVE             # move a product from review to approved
        - PRODUCT_PUBLISH             # make an approved product live
        # **Approving and publishing are different acts — decided 28 September, audit R091 (2).**
        # A product manager approves; an operator publishes. Both rode `PRODUCT_CONFIGURE`, so the
        # person who wrote a product could also approve and publish it.
        - PRICE_VIEW
        - PRICE_CONFIGURE
        - EVENT_CONFIGURE
        - PERFORMANCE_CONFIGURE
        - CAPACITY_CONFIGURE          # envelopes and allocation

        # --- Selling ----------------------------------------------------------
        - ORDER_VIEW
        - ORDER_VIEW_OTHER            # orders raised by other principals
        - ORDER_CREATE
        - ORDER_MODIFY
        - ORDER_DISCOUNT              # manual discount. Threshold and approver are venue policy
        - ORDER_CANCEL
        - ORDER_VOID
        - ORDER_REFUND                # initiate, subject to threshold
        - ORDER_REFUND_APPROVE        # authorise above threshold. See NOTE-1
        - ORDER_REFUND_BULK           # event- or date-level bulk refund
        - ORDER_EXCHANGE
        - ORDER_RESCHEDULE
        - ORDER_REPRINT
        - PRICE_OVERRIDE              # manual price adjustment at point of sale
        - DISCOUNT_APPLY
        - CREDIT_MANAGE               # partner credit limits and terms
        - CREDIT_OVERRIDE             # authorise one order beyond the limit. 2.7.39

        # --- Wallet and stored value ------------------------------------------
        - WALLET_VIEW                 # balances, lots, liability, disputes
        - WALLET_OPERATE              # adjust, reverse, freeze, relink a credential
        - WALLET_CONFIGURE            # wallet types, credit types, funding and risk rules

        # --- Payment orchestration --------------------------------------------
        - PAYMENT_VIEW                # methods, providers, routing, health, economics
        - PAYMENT_CONFIGURE           # methods, routing, failover, terminals, tender rules
        - PAYMENT_PROVIDER_MANAGE     # connect a gateway and hold its credentials
        - PAYMENT_DISPUTE             # assemble and submit chargeback evidence
        # **`PROVIDER_MANAGE` is separate from `CONFIGURE` because it holds keys.** Changing
        # which acquirer a venue routes to is an operational decision; possessing the
        # credentials that can move the money is not the same thing.
        # **`OPERATE` touches one guest's money; `CONFIGURE` decides the rules for
        # everybody's.** A duty manager reverses a mistaken top-up several times a week;
        # changing the consumption order decides, for every guest at once, whether their
        # bonus credit expires unused. Those are not the same authority.

        # --- Shift and cash ---------------------------------------------------
        - SHIFT_OPEN
        - SHIFT_CLOSE
        - SHIFT_SUSPEND               # suspend a shift for a break; float intact, workstation released
        - SHIFT_CLOSE_OTHER           # close a shift opened by another principal
        - SHIFT_APPROVE_OPEN          # where supervisor approval on open is configured
        - SHIFT_APPROVE_CLOSE         # release a shift held in pendingClosure, where configured
        - SHIFT_REOPEN                # after final close
        - CASH_LIFT                   # traced mid-shift removal from an open float
        - CASH_ADD
        - CASH_NO_SALE                # open the drawer without a sale. Reason required, counted per shift
        # **`CASH_NO_SALE` is not `SHIFT_SUSPEND`.** A no-sale opens the drawer on a live float
        # and is the classic cover for theft; suspending a shift hands the workstation over for
        # a break. One permission for both meant a role could not be allowed breaks without also
        # being allowed to open the drawer, and a review of who may open it read as a review of
        # who may take a break.
        - DEPOSIT_BOX_MODIFY_OWN
        - DEPOSIT_BOX_MODIFY_OTHER
        - OVERSHORT_ACCEPT            # accept a variance beyond the configured threshold

        # --- Access control ---------------------------------------------------
        - ACCESS_VALIDATE             # scan and admit
        - ACCESS_OVERRIDE             # admit against a failed validation, logged
        - ACCESS_POINT_CONFIGURE
        - TURNSTILE_MODE_SET          # the podium: operating mode, and free rotation or closed within it (R221)
        - TICKET_LOOKUP               # read-only validity check, no admission

        # --- Accreditation ----------------------------------------------------
        - ACCREDITATION_VIEW
        - ACCREDITATION_APPLY         # submit an application or a document
        - ACCREDITATION_APPROVE       # decide an application, verify a document
        - ACCREDITATION_ISSUE         # produce, encode and replace a credential
        - ACCREDITATION_MANAGE        # amend a holder, assign access, suspend, revoke
        - ACCREDITATION_CONFIGURE     # programmes, requirements, access profiles, badges
        # **Six, because accreditation separates duties more sharply than anything else in
        # the platform.** The person who prints a badge must not be the person who decided
        # what it opens, and neither should be the person who wrote the access profile.
        # 3.3.31 asks for segregation of duties; this is where it is most load-bearing.

        # --- Reporting --------------------------------------------------------
        - REPORT_VIEW_OWN             # self-scoped. Not resolved against the tree
        - REPORT_VIEW_WORKSTATION
        - REPORT_VIEW_VENUE
        - REPORT_VIEW_REGION
        - REPORT_VIEW_TENANT
        - REPORT_EXPORT
        - REPORT_EXPORT_PII           # include personal data in an export. Audited
        - REPORT_MANAGE               # create and amend report definitions and dashboards
        - REPORT_SCHEDULE             # schedules run under the owner's permissions

        # --- Finance ----------------------------------------------------------
        - LEDGER_VIEW
        - LEDGER_POST
        - LEDGER_APPROVE              # journal voucher approval
        - TAX_CONFIGURE
        - ACCOUNT_CONFIGURE           # chart of accounts
        - SETTLEMENT_VIEW
        - SETTLEMENT_RECONCILE

        # --- Guest engagement ---
        - GUEST_VIEW                  # profiles, behavioural attributes, consent state
        - GUEST_VIEW_PII              # personal fields. Distinct from GUEST_VIEW by design
        - GUEST_MANAGE                # amend, merge, configure consent purposes
        # A venue map is configuration a guest navigates by. **Publishing is separate from managing**
        # — editing a live map under a guest standing in front of it routes them into a wall.
        - VENUE_MAP_VIEW
        - VENUE_MAP_MANAGE             # place points, import geometry, accept proposals
        - VENUE_MAP_PUBLISH            # make a draft the version guests see
        # A bookable resource is a specific object checked out to a named guest. **Booking is
        # separate from managing** — a poolside attendant assigns a cabana and does not define one.
        - RESOURCE_VIEW
        - RESOURCE_BOOK                # reserve, check out, check in
        - RESOURCE_MANAGE              # define resources, set qualifications
        - RESOURCE_CONFIGURE           # types, categories, attributes, packages, policies
        # **`CONFIGURE` is separate from `MANAGE` because the blast radius differs.**
        # Managing a resource changes one cabana; configuring a resource type changes what
        # every resource of that class can do, and board 1.02 asks for approval on exactly
        # that boundary. One permission for both would give every duty manager the ability
        # to turn off check-in for the whole estate.
        - RENTAL_VIEW
        - RENTAL_BOOK                  # reserve a rental, sign the agreement
        - RENTAL_OPERATE               # check out, assign equipment, inspect, return
        - RENTAL_MANAGE                # blackouts, closures, capacity blocking
        - RENTAL_CONFIGURE             # products, categories, rules, durations, agreements
        - RENTAL_PRICE                 # pricing profiles, deposit and fee policies
        - RENTAL_APPROVE               # publish a product through maker/checker
        - RENTAL_OVERRIDE              # waive a deposit, a late fee or a damage charge
        # **`PRICE`, `APPROVE` and `OVERRIDE` are deliberately three.** Board 1.10 wants
        # maker/checker on publication, board 4.9 wants manager approval on a waiver, and
        # the person who sets the price list is rarely the person who forgives a charge at
        # the counter. Collapsing them would make the segregation of duties the boards ask
        # for unexpressible.
        # A developer is not a partner and not a tenant. **A partner resells tickets; a developer
        # writes software**, and one organisation may be both (CF-135, CF-135a).
        - DEVELOPER_VIEW
        - DEVELOPER_MANAGE             # own clients, credentials, sandboxes, subscriptions
        - DEVELOPER_ADMIN              # quotas, certification, licensing — TICVAI-side only
        # Loyalty points are money-adjacent and were riding LEDGER_POST or GUEST_MANAGE.
        # **Accrual is a machine act and redemption is a spend**, and neither belongs to
        # whoever may edit a profile.
        - LOYALTY_ACCRUE              # awarded by order completion, never by a person
        - LOYALTY_REDEEM              # spending points. Two-phase, like every stored value
        - LOYALTY_ADJUST              # a manual correction, and the one an auditor reads
        - MARKETING_VIEW              # segments, campaigns, loyalty, reviews
        - MARKETING_MANAGE            # create and amend
        - MARKETING_SEND              # launch or stop a campaign. Separate from MANAGE
        - CASE_VIEW
        - CASE_MANAGE

        # --- Digital assets ---
        - ASSET_LIBRARY_VIEW
        - ASSET_LIBRARY_MANAGE        # upload, replace, delete, amend rights
        - ASSET_LIBRARY_APPROVE       # approve and publish an asset for use
        - ASSET_LIBRARY_SHARE         # issue an external share link
        # **Publishing and external sharing are the two acts that leave the building.**
        # Board 3.7 makes a share a licence grant with an expiry; the person who uploads
        # a photograph is not automatically the person who may send it to an agency.

        # --- Queue ---
        - QUEUE_VIEW
        - QUEUE_MANAGE                # configure, open/pause/close, call next, set wait time
        - QUEUE_REDEEM                # admit a party at the ride
        - QUEUE_OVERRIDE              # admit against a failed redemption. Audited

        # --- Transport --- (decided 29 September, rev 3 REV3-21)
        - TRANSPORT_VIEW              # stations, routes, timetables, departure board, pass types, network imports: read
        - TRANSPORT_MANAGE            # stations, routes and stops, network import, timetables publish/withdraw, departure coach and capacity
        - TRANSPORT_PRICE             # fare tables, passenger types, pass types and their prices
        # **`PRICE` is separate from `MANAGE`** because the person who edits a timetable is
        # not the one who sets fares, the same split as `RENTAL_PRICE`. Guests need none of
        # these: guest reads of the published network are permission-null.

        # --- Maintenance & safety ---
        - ASSET_VIEW
        - ASSET_MANAGE                # register, amend, take out of / return to service
        - WORK_ORDER_VIEW
        - WORK_ORDER_MANAGE
        - WORK_ORDER_VERIFY           # second pair of eyes. Never the completing technician
        - INSPECTION_VIEW
        - INSPECTION_SUBMIT
        - INSPECTION_MANAGE           # author templates
        - INCIDENT_REPORT             # deliberately wide. An unreported near-miss recurs
        - INCIDENT_VIEW
        - INCIDENT_MANAGE             # investigate, close, notify an authority

        # --- Operations -------------------------------------------------------
        - KIOSK_ATTEND                # attendant access on an unattended device
        - DEVICE_VIEW
        - DEVICE_CONFIGURE
        - DEVICE_MANAGE               # enrol, assign, re-key, roll out firmware, retire
        # **`CONFIGURE` sets a device's settings; `MANAGE` decides whether it exists and
        # whether it is trusted.** 16.7.35 gives devices credentials, and the ability to
        # issue one has to be rarer than the ability to change a printer's paper size.
        - APPROVAL_ACT                # approve, reject, return, request info
        - APPROVAL_DELEGATE
        - AI_USE
        - AI_CONFIGURE
        - AI_APPROVE
        - AI_AUDIT_VIEW               # the AI activity and decision log only
        - AUDIT_VIEW                  # the platform audit log: who did what, where and when
        # **`AUDIT_VIEW` is separate from `AI_AUDIT_VIEW`.** The platform audit log records every
        # principal's actions across the estate; the AI log records what an assistant did. A
        # permission filed among the AI keys reads, on a role checklist, as an AI permission, and
        # the general audit trail was gated by it.
        - APPROVAL_VIEW
        - APPROVAL_REQUEST
        - APPROVAL_DECIDE
        - APPROVAL_CONFIGURE
        - MAINTENANCE_EXECUTE
        - MAINTENANCE_APPROVE
        - WORKFORCE_VIEW
        - WORKFORCE_MANAGE
        - ATTENDANCE_RECORD
        - ANNOUNCEMENT_PUBLISH
        - ANNOUNCEMENT_EMERGENCY      # declare an emergency announcement or an evacuation broadcast
        # **Decided 28 September, audit R091 (1).** Posting a staff notice must not carry the
        # ability to declare an emergency, which overrides every home screen and bypasses quiet hours.
        - PARTNER_VIEW
        - PARTNER_MANAGE
        - PARKING_CONFIGURE
        - PAYMENT_VOID

        # --- Procurement ---
        # **Procurement gets its own permissions — decided 28 September, audit R091 (4).** It was
        # borrowing `ORDER_*`, `PRODUCT_CONFIGURE` and `LEDGER_APPROVE`, so a role allowed to raise
        # a purchase order could also void a guest's order, and one allowed to reject a requisition
        # could approve journals. Deciding a requisition is `APPROVAL_ACT`, as every other approval.
        - PROCUREMENT_VIEW            # requisitions, suppliers, quotations, purchase orders, receipts
        - PROCUREMENT_REQUEST         # raise, amend and cancel a requisition
        - PROCUREMENT_MANAGE          # suppliers, quotations; raise, send, cancel and short-close a PO
        - PROCUREMENT_RECEIVE         # record and reject received goods

    PermissionSet:
      type: array
      items: { $ref: '#/components/schemas/Permission' }
      uniqueItems: true

    ScopedPermissions:
      type: object
      description: >
        Permissions effective at a given scope path, after deny resolution. Clients filter
        navigation on this and never compute permissions themselves.
      required: [scopePath, permissions]
      properties:
        scopePath:
          type: string
          pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
        permissions: { $ref: '#/components/schemas/PermissionSet' }

# NOTE-1 — ORDER_REFUND_APPROVE and thresholds
#
# Requirement 2.12.3 describes a cashier refunding "up to a value", with a second user
# naming themselves as audit control above it. That implies a monetary threshold, but the
# grant model has no amount dimension.
#
# Two candidate designs:
#   (a) grants carry an optional decimal constraint, evaluated during resolution
#   (b) thresholds are separate role configuration, and the permission is binary
#
# (b) was taken — a grant that carries a value stops being a boolean and every resolution
# path has to reason about amounts. CF-36 settled the refund threshold as venue policy
# (docs/adr/0018-configuration-scope.md), and the refund policy in contracts/spine/orders.yaml
# carries it as `requiresSecondUserAbove` and `requiresApprovalAbove`. ORDER_REFUND_APPROVE
# stays binary.
