openapi: 3.1.0
info:
  title: TICVAI — Public API and developer access
  version: 1.0.0
  x-ticvai-screen-count: 34
  x-ticvai-tier: satellite
  x-ticvai-module: "13 — Developer & API Management"
  x-ticvai-platforms:
    - P14 Developer
  # Derived from screens/*.yaml on 18 August — every platform with a screen that calls an
  # operation in this contract. **Six contracts declared none**, which the viewer reports as
  # missing taxonomy and no package checker tested for.
  description: >
    **The developer-facing surface: who may call TICVAI, with what credential, against which
    environment, and what happens when the contract changes.**

    This contract does not expose business capability. **Domain 13.3 asks for ticketing, membership,
    loyalty, wallet, access, F&B, retail and reporting APIs — and all of them already exist** across
    the other twenty-six contracts. What was missing is the layer in front: registration,
    credentials, a sandbox, webhooks, quotas and a deprecation lifecycle.

    ## The decisions this is built on

    **D1 — Extensible platform with third-party listings.** Developers register, obtain credentials
    and test in a sandbox. Certification (13.1.49) and marketplace publishing (13.1.50) are in.
    **This supersedes the earlier reading of the 10 August decision**, which settled integration
    direction and said nothing about onboarding or tooling.

    **D2 — Synthetic sandbox data only.** No cloning, no masking of production into developer
    environments. 13.2.13 is in; 13.2.12 is retained as a guard. **This removes the PDPL and DESC
    exposure entirely** and decouples the sandbox from the unresolved tenant-isolation question —
    **there is no production data to isolate.**

    **D3 — One shared TICVAI sandbox.** 13.2.2, tenant-specific sandboxes, is **declined and
    recorded rather than dropped.** Tenant-specific validation runs on the per-customer staging
    environment agreed 30 July: **development and certification are generic, acceptance is
    tenant-specific.**

    **D4 — This contract is `public-api`, not `platform`.** "Platform" already denotes TICVAI
    throughout the MoMs and ADRs, and a contract by that name would read as the whole product.

    **D5 — The commercial model is tenant-configurable by TICVAI.** Module licensing (13.3.24),
    listing fees and revenue share are configuration rather than code, **so rates and terms change
    without a release.** The mechanism is decided here; the rates are not (CF-135c).

    **D6 — Sandbox, certification, then production (17 September minutes, M17-05 to M17-07).**
    Sandbox keys and production keys are separate; a production key is issued by TICVAI only for a
    certified integration (`requestProductionAccess`, `decideProductionAccess`), carries an expiry
    and an IP allow-list, and is scoped by module (`listApiScopes`). Abnormal traffic is flagged by
    anomaly rules (`setApiAnomalyRule`, `listApiAnomalies`). **This supersedes "certification is a
    gate on listing, not on API access"** in the first version of this contract.

    ## What is deliberately not here

    **Third-party code does not run inside TICVAI.** A listing points at an integration running on
    the developer's own infrastructure. Recommended and stated rather than assumed — **executing
    submitted code inside a multi-tenant platform is a different product with a different threat
    model.**

    **Documentation is not generated here.** ADR-0024 makes the contract the deliverable and the 27
    OpenAPI files *are* the schema documentation. 13.1.1 to 13.1.5 ask for a portal that renders
    them, which is a frontend over artefacts that already exist.

servers:
  - url: https://api.ticvai.com/v1

security:
- bearerAuth: []
paths:
  /developers:
    post:
      operationId: registerDeveloper
      x-ticvai-consumed-by:
        - "P14 DEV-002 Register & Organisation"
      security: []
      summary: Register a developer or organisation
      description: >
        13.1.6 to 13.1.9. **An organisation, not a person** — an integration outlives the engineer
        who built it, and a credential tied to somebody's personal account dies when they leave.

        A developer account is **not a tenant and not a partner.** A partner resells tickets; a
        developer writes software. Conflating them was the confusion CF-135 opened on.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_VIEW
      x-ticvai-audience: [public]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeveloperAccount' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Registered, pending verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeveloperAccount' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /developers/{developerId}:
    get:
      operationId: getDeveloperAccount
      x-ticvai-consumed-by:
        - "P14 DEV-002 Register & Organisation"
      x-ticvai-audience: [partner, staff]
      x-ticvai-read-routing: replica
      summary: A registered developer organisation
      description: >
        **Added by the r1 gate fix of 3 October 2026 (CHG-R1S-004): the read this write was missing.**
        DEV-002 registers an organisation (`registerDeveloper`) and sets its members; it had no read of the
        organisation it then shows. A partner reads only its own (`x-ticvai-self-scoped`). Returns what the
        write stores, in the write's own shape.
      x-ticvai-permission: DEVELOPER_VIEW
      x-ticvai-self-scoped: principal
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: developerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A registered developer organisation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperAccount'
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /developers/{developerId}/members:
    parameters:
      - name: developerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setDeveloperMembers
      x-ticvai-consumed-by:
        - "P14 DEV-002 Register & Organisation"
      summary: Who at this organisation may do what
      description: |-
        13.1.10. **The organisation administers its own people**, because TICVAI maintaining every integrator's staff list is TICVAI doing their HR — the same reasoning as `PartnerUser`.

        **What the PUT does** (4 October 2026, CHG-FXC-005). Replaces the organisation's member list in
        `control.developer_member` (DeveloperMember): an email not on the list is invited, a listed email's role is
        updated, a member left off is `removed`. Exactly one `owner` must remain, or 409. Nothing is written to the tenant's
        identity tables; the portal signs a member in by the email.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      email: { type: string, format: email }
                      role: { type: string, enum: [owner, admin, developer, readOnly] }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperMember'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /api-clients:
    get:
      operationId: listApiClients
      x-ticvai-consumed-by:
        - "P08 ADM-351 Approval API Management"
        - "P08 ADM-356 Integration Security & Access Control"
        - "P08 BO-067 Integrations"
        - "P08 BO-1071 Integration Command Center"
        - "P08 BO-1073 API Access & OAuth"
        - "P08 BO-1076 Concurrency, Idempotency & Limits"
        - "P08 BO-1179 Integration Monitoring & Exception Workbench"
        - "P08 BO-691 Accreditation API Management"
        - "P09 ADM-015 API Rate Limit & Quota Management"
        - "P10 PTR-019 API Credentials & Integration"
        - "P14 DEV-003 Clients & Credentials"
      summary: Registered clients for this developer
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_VIEW
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiClient' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createApiClient
      x-ticvai-consumed-by:
        - "P08 BO-1177 API Security, Access & Integration Permissions"
        - "P10 PTR-019 API Credentials & Integration"
        - "P14 DEV-003 Clients & Credentials"
      summary: Create a client with scopes and an environment
      description: >
        13.1.11 to 13.1.13, and **CF-135a: the credential model was owned by nobody.** 2.7.52,
        7.1.25 and 7.1.30 each asserted their own, so a partner API key, a POS integration
        credential and a webstore credential were three unrelated things. **This is the one that
        exists.**

        **A client is bound to one environment.** A sandbox client cannot reach production, which is
        stated on the object rather than enforced by a naming convention — **a key that works in
        both is a key somebody will use in the wrong one.**

        **Production keys only after certification** (17 September minutes, M17-06; decided again 29
        September). A developer creates `sandbox` clients here freely. A `production` client is
        refused 409 `certification-required` unless it names a certified integration
        (`certificationListingId`, an `IntegrationListing` in `certified` within `certifiedUntil`) and
        the caller is TICVAI staff (`issuedBy: ticvai`). The developer's route is
        `requestProductionAccess`, which TICVAI decides with `decideProductionAccess`; approving it
        creates the production client. **A production client needs an IP allow-list** (M17-07): an
        empty `ipAllowList` on a production client is refused 422 `ip-allow-list-required`.

        **Scopes are module scopes** (M17-05): each is `{module}.read` or `{module}.write` from
        `listApiScopes`, so a CRM integration partner is granted CRM scopes and nothing else. An unknown
        scope is refused 422 `unknown-scope`. **No scope grants a catalogue write** (M17-04): partners
        read assigned products and partner prices; the product, price and capacity writes are open
        only through a platform-staff `ApiLicence.catalogueWriteException`. Keys expire: `credentialTtlDays` (default 365 for
        production, 90 for sandbox) sets `expiresAt`, and rotation renews it.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiClient' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: >
            Created. **The secret is returned once and never again** — a system that can show you a
            secret later is a system that stores one.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: '#/components/schemas/ApiClient' }
                  clientSecret: { type: string, format: password }
        '409':
          description: >
            A `production` client without a current certification, or asked for by a developer rather
            than issued by TICVAI (`certification-required`, M17-06). Use `requestProductionAccess`.
          x-ticvai-problem-types:
            - certification-required
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: >
            A `production` client with an empty `ipAllowList` (`ip-allow-list-required`, M17-07), or a
            scope that is not in the scope catalogue (`unknown-scope`, M17-05).
          x-ticvai-problem-types:
            - ip-allow-list-required
            - unknown-scope
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /api-clients/{clientId}/credentials:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rotateApiCredential
      x-ticvai-consumed-by:
        - "P10 PTR-019 API Credentials & Integration"
        - "P14 DEV-003 Clients & Credentials"
      summary: Issue a new secret, with an overlap window
      description: >
        13.1.15. **Rotation without an overlap is an outage.** Both secrets are valid until
        `oldSecretExpiresAt`, which gives the integrator time to deploy — and **a rotation with no
        overlap is one nobody performs until they are breached.**
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overlapHours: { type: integer, default: 72 }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret: { type: string, format: password }
                  oldSecretExpiresAt: { type: string, format: date-time }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    delete:
      operationId: revokeApiCredential
      x-ticvai-consumed-by:
        - "P10 PTR-019 API Credentials & Integration"
        - "P14 DEV-003 Clients & Credentials"
      summary: Revoke immediately
      description: >
        13.1.15. **No overlap, by definition** — revocation is what you reach for when a secret has
        leaked, and a grace period defeats it.

        **Active tokens are invalidated too.** Revoking the credential while leaving issued tokens
        alive is a revocation that takes an hour to mean anything.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Revoked
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /oauth/token:
    post:
      operationId: issueApiToken
      security:
      - apiKeyAuth: []
      - serviceAuth: []
      summary: Exchange a credential for an access token
      description: >
        13.1.13 and 13.1.14. **Client credentials grant** — machine to machine, no user present.

        **Scopes are the intersection of what the client was granted and what its tenant licenses**
        (13.3.24, D5). A client with a ticketing scope calling a venue that has not licensed the
        ticketing API gets nothing, and the token says so at issue rather than the call failing
        later.

        **The IP allow-list is checked here and on every call** (17 September minutes, M17-07): a
        request from an address outside `ApiClient.ipAllowList` is refused 403 `ip-not-allowed`, and a
        client past `expiresAt` gets no token (403 `client-expired`). Every refusal counts towards
        the anomaly rules (`setApiAnomalyRule`).
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_VIEW
      x-ticvai-audience: [partner, service]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantType, clientId, clientSecret]
              properties:
                grantType: { type: string, enum: [client_credentials] }
                clientId: { type: string }
                clientSecret: { type: string, format: password }
                scope: { type: string }
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string, format: password }
                  tokenType: { type: string }
                  expiresIn: { type: integer }
                  scope: { type: string }
        '403':
          description: >
            The request came from an address outside the client's `ipAllowList` (`ip-not-allowed`),
            or the client is past `expiresAt` (`client-expired`), suspended or revoked.
          x-ticvai-problem-types:
            - ip-not-allowed
            - client-expired
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /sandboxes:
    get:
      operationId: listSandboxes
      x-ticvai-consumed-by:
        - "P14 DEV-004 Sandbox"
      summary: Sandbox environments
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_VIEW
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Sandboxes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sandbox' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createSandbox
      x-ticvai-consumed-by:
        - "P14 DEV-004 Sandbox"
      summary: Provision a sandbox with synthetic data
      description: >
        13.2.1 and 13.2.13, decisions D2 and D3. **One shared TICVAI sandbox, synthetic data only.**

        **No production data is cloned or masked into it** — which removes the PDPL and DESC
        exposure entirely, and means the sandbox does not depend on the unresolved tenant-isolation
        question, because **there is no production data to isolate.**

        **13.2.2 (tenant-specific sandboxes) is declined**, recorded rather than dropped. Per-customer
        staging from 30 July does tenant-specific validation: **development and certification are
        generic, acceptance is tenant-specific.**
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dataProfile]
              properties:
                name: { type: string }
                dataProfile: { $ref: '#/components/schemas/SyntheticDataProfile' }
                expiresAfterDays: { type: integer, default: 90 }
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Provisioning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /sandboxes/{sandboxId}/reset:
    parameters:
      - name: sandboxId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resetSandbox
      x-ticvai-consumed-by:
        - "P14 DEV-004 Sandbox"
      summary: Back to a clean synthetic dataset
      description: >
        13.2.3. **Regression testing needs a known starting state**, and a sandbox that accumulates
        a year of a developer's experiments is one where a failing test proves nothing.

        Regenerates from the data profile. **Credentials survive a reset** — an integrator
        re-onboarding after every reset would stop resetting.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Resetting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      x-ticvai-consumed-by:
        - "P08 BO-067 Integrations"
        - "P08 BO-1074 Webhook Configuration"
        - "P08 BO-1077 Mapping & Transformation"
        - "P08 BO-1173 Wallet Integration Command Center"
        - "P08 BO-1176 Wallet Events, Webhooks & Notification Orchestration"
        - "P08 BO-1179 Integration Monitoring & Exception Workbench"
        - "P08 BO-692 Accreditation Webhook Management"
        - "P14 DEV-005 Webhooks"
      summary: The tenant's webhook subscriptions, filterable by API client
      description: >
        **Per tenant, filterable by API client** (decided 28 September, audit R214 (4)). Returns every
        webhook subscription in the tenant; `clientId` narrows it to what one API client is subscribed
        to. A partner caller sees only its own client's subscriptions whatever it sends.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_VIEW
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: clientId
          in: query
          required: false
          description: Only this API client's subscriptions (audit R214 (4)).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createWebhookSubscription
      x-ticvai-consumed-by:
        - "P08 BO-067 Integrations"
        - "P08 BO-1074 Webhook Configuration"
        - "P08 BO-1176 Wallet Events, Webhooks & Notification Orchestration"
        - "P08 BO-692 Accreditation Webhook Management"
        - "P14 DEV-005 Webhooks"
      summary: Subscribe to business events
      description: >
        13.1.26, 13.3.17, 13.3.18 and 13.3.22. **The events exist**, published through
        `platform.outbox`. What was missing is a way for anything outside TICVAI to receive one.

        **`eventTypes` come from the webhook event catalogue** (`WebhookEventType`, read with
        `listWebhookEventTypes`). A name not in it is `422`: a subscription to an event nobody
        publishes is a receiver waiting for nothing. Device, accreditation, approval-workflow and
        seat events joined the catalogue on 29 September (16.9.56, 12.1.53, 11.1.64, 11.1.66,
        21.13.4).

        **Filtered at subscription, not at delivery.** A subscriber taking every event and
        discarding 99% is a subscriber the platform pays to talk to.

        **The endpoint is verified before the first delivery.** An unverified endpoint is somebody
        else's server being sent a venue's ticket sales.
      tags: [publicApi]
      x-ticvai-permission: DEVELOPER_MANAGE
      x-ticvai-audience: [staff, partner]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscription' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
