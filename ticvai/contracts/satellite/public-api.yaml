components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (common.yaml bearerAuth). Added 29 September (system-design review SD-054).
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
  # **Server-owned fields are `readOnly`, secrets are `writeOnly`.** The create operations here
  # take the resource schema as their body, so without the marks a client had to invent the id
  # and the status. OpenAPI 3.1: a `readOnly` property listed in `required` is required in
  # responses only, and a client that sends one has it ignored. Status moves through the
  # operations that own it (verification, revocation, certification, endpoint verification).
  schemas:
    ApiScope:
      type: object
      x-ticvai-persistence: none — generated at release from x-ticvai-api-scope on each partner-callable operation
      description: >
        **One module scope** (17 September minutes, M17-05): `{module}.read` or `{module}.write`, and the
        operations it opens.

        **A write scope never opens a catalogue write** (M17-04): `ticketing.write` opens carts,
        orders and holds for a partner or developer client, and no product, price list, price,
        channel capacity, lifecycle or alternative-code write, since those operations are not
        partner-callable and carry no `x-ticvai-api-scope`. Only a platform-staff
        `ApiLicence.catalogueWriteException` opens one, for one named client.
      required: [scope, module, access]
      properties:
        scope: { type: string, description: 'e.g. `ticketing.read`.' }
        module: { $ref: '../shared/common.yaml#/components/schemas/ModuleKey' }
        access: { type: string, enum: [read, write] }
        description: { type: string }
        operations:
          type: array
          items:
            type: object
            properties:
              contract: { type: string }
              operationId: { type: string }
        licensed:
          type: boolean
          description: Whether the caller's tenant licenses the module (`ApiLicence.licensedModules`).

    ProductionAccessRequest:
      type: object
      x-ticvai-persistence: "control.production_access_request"
      description: >
        **A developer's request for production keys** (17 September minutes, M17-06): sandbox, then
        certification, then production.
      required: [id, developerId, sandboxClientId, listingId, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        developerId: { type: string, format: uuid, readOnly: true }
        sandboxClientId:
          type: string
          format: uuid
          readOnly: true
          x-ticvai-references: control.api_client
        listingId:
          type: string
          format: uuid
          x-ticvai-references: control.integration_listing
        scopes: { type: array, items: { type: string } }
        allowedTenantIds: { type: array, items: { type: string, format: uuid } }
        ipAllowList: { type: array, items: { type: string } }
        note: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, rejected, withdrawn], readOnly: true }
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: identity.principal
        decidedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        reason: { type: string, nullable: true, readOnly: true }
        productionClientId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: control.api_client
        requestedAt: { type: string, format: date-time, readOnly: true }

    ApiAnomalyRule:
      type: object
      x-ticvai-persistence: "control.api_anomaly_rule"
      description: >
        **When API traffic is abnormal** (17 September minutes, M17-07). Platform defaults ship for
        every tenant; TICVAI tightens them per tenant or per client.
      required: [ruleKey, measure, comparison, threshold, action]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ruleKey: { type: string }
        clientId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: control.api_client
          description: Null applies to every client of the tenant.
        measure:
          type: string
          enum: [callsPerMinute, clientErrorShare, allowListRefusals, unusualOperations, authFailures]
        comparison:
          type: string
          enum: [aboveBaselineMultiple, aboveFixed]
          description: '`aboveBaselineMultiple`: above `threshold` x the same hour over the last four weeks.'
        threshold: { type: number }
        windowMinutes: { type: integer, minimum: 1, default: 5 }
        action: { type: string, enum: [flag, throttle, suspend], default: flag }
        isActive: { type: boolean, default: true }
        tenantId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: '**The tenant a rule belongs to** (4 October 2026, CHG-FXC-003). Null for a platform default, which
            every tenant reads; `listApiAnomalyRules` returns the platform defaults and the caller tenant''s own rules.'
        scopePath:
          type: string
          nullable: true
          readOnly: true
          description: The tenant's root scope path for a tenant rule (scope row-level security); null for a platform default.

    DeveloperMember:
      type: object
      x-ticvai-persistence: control.developer_member
      description: '**One person at a developer organisation** (`setDeveloperMembers`, 4 October 2026, CHG-FXC-005).
        Developer-portal people are not tenant staff: they are kept here in the control database beside
        `control.developer_account`, keyed by email, and never become `identity.principal` or `identity.delegated_access`
        rows (the Sprint 1-2 judging found no email column on a principal and no permission a portal role could map to).
        A new email is invited (`status` `invited`) and becomes `active` when the person signs in to the portal with it.
        What each role may do in the portal: `owner` everything and the member list, `admin` everything but removing the
        owner, `developer` its own clients and credentials, `readOnly` view.'
      required: [email, role, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        developerAccountId: { type: string, format: uuid, readOnly: true }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, developer, readOnly] }
        status: { type: string, enum: [invited, active, removed], readOnly: true }
        invitedAt: { type: string, format: date-time, readOnly: true }
        activatedAt: { type: string, format: date-time, nullable: true, readOnly: true }
    ApiAnomaly:
      type: object
      x-ticvai-persistence: "control.api_anomaly"
      description: One flagged breach of an anomaly rule (M17-07).
      required: [id, ruleKey, clientId, detectedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ruleKey: { type: string }
        clientId:
          type: string
          format: uuid
          x-ticvai-references: control.api_client
        measure: { type: string }
        observed: { type: number }
        baseline: { type: number, nullable: true }
        actionTaken: { type: string, enum: [flag, throttle, suspend] }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    DeveloperAccount:
      type: object
      x-ticvai-persistence: "control.developer_account"
      description: >
        13.1.6 to 13.1.9. **An organisation, because an integration outlives the engineer who built
        it.** A credential tied to somebody's personal account dies when they leave.

        **Not a tenant and not a partner.** A partner resells tickets; a developer writes software,
        and one organisation may be both.
      required: [id, organisationName, contactEmail, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        organisationName: { type: string }
        contactEmail: { type: string, format: email }
        websiteUrl: { type: string, nullable: true }
        countryCode: { type: string }
        partnerId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where this developer is also a commercial partner. **The link exists and the two are not
            the same record**, which is what CF-135a was about.
        status: { type: string, enum: [pending, verified, suspended, closed], readOnly: true }
        verifiedAt: { type: string, format: date-time, nullable: true, readOnly: true }

    ApiClient:
      type: object
      x-ticvai-persistence: "control.api_client"
      description: >
        CF-135a. **The one credential model.** 2.7.52, 7.1.25 and 7.1.30 each asserted their own,
        so a partner API key, a POS integration credential and a webstore credential were three
        unrelated things with three lifecycles.
      required: [id, developerId, name, environment, scopes, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        developerId: { type: string, format: uuid }
        name: { type: string }
        clientId: { type: string, readOnly: true }
        environment:
          type: string
          enum: [sandbox, production]
          description: >
            **Bound to one, stated on the object rather than by naming convention.** A key that
            works in both is a key somebody will use in the wrong one.
        scopes:
          type: array
          description: >
            **Resolved against the tenant's licence at token issue** (13.3.24). A scope granted here
            and not licensed there produces no token — and the refusal is at issue rather than at
            call time, so an integrator finds out in testing. **Module scopes** (17 September minutes,
            M17-05): `{module}.read` or `{module}.write`, one of `listApiScopes`.
          items:
            type: string
            pattern: '^[a-zA-Z]+\.(read|write)$'
        issuedBy:
          type: string
          enum: [partner, ticvai]
          readOnly: true
          description: >
            Who generated the key (M17-06): a developer for a sandbox key, TICVAI for a production
            key issued on an approved `requestProductionAccess`.
        certificationListingId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: control.integration_listing
          description: For a production client, the certified integration it was issued against.
        credentialTtlDays:
          type: integer
          minimum: 1
          maximum: 730
          nullable: true
          description: Key lifetime. Default 365 for production, 90 for sandbox (M17-06, configurable expiry).
        expiresAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the key stops working unless rotated. No token is issued after it.
        allowedTenantIds:
          type: array
          description: >
            13.1.46. **Which tenants this client may act for.** A developer integrating for one
            venue must not reach another, and a client with an empty list reaches none.
          items: { type: string, format: uuid }
        ipAllowList:
          type: array
          description: >
            13.1.38. **Required on a production client** (17 September minutes, M17-07: endpoints are
            protected by IP allow-listing, not left open to the internet); optional in the sandbox.
            CIDR ranges. Checked at token issue and on every call.
          items: { type: string }
        status: { type: string, enum: [active, suspended, revoked], readOnly: true }
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            **A credential unused for a year is a credential nobody will notice being stolen.**

    Sandbox:
      type: object
      x-ticvai-persistence: "control.sandbox"
      description: >
        D2 and D3. **One shared TICVAI sandbox, synthetic data only.**
      required: [id, name, status, dataProfile]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        developerId: { type: string, format: uuid }
        status: { type: string, enum: [provisioning, active, resetting, expired, deleted], readOnly: true }
        dataProfile: { $ref: '#/components/schemas/SyntheticDataProfile' }
        containsProductionData:
          type: boolean
          default: false
          readOnly: true
          description: >
            **Always false, and stated rather than assumed** (D2). No cloning, no masking. It is a
            field so that a future reversal is a visible change rather than a silent one — and
            because **the whole PDPL and DESC argument for this contract rests on it.**
        expiresAt: { type: string, format: date-time, readOnly: true }
        lastResetAt: { type: string, format: date-time, nullable: true, readOnly: true }

    SyntheticDataProfile:
      type: object
      description: >
        13.2.5 and 13.2.13. **What the synthetic dataset contains**, so a developer can test against
        a shape that resembles a real venue without any of it being real.

        **Generated, not sampled.** Sampling production and calling it synthetic is masking with
        extra steps.
      properties:
        venueKind: { type: string, enum: [themePark, waterPark, museum, theatre, stadium, arena, mixed] }
        productCount: { type: integer, default: 200 }
        guestCount: { type: integer, default: 5000 }
        seatMapIncluded: { type: boolean, default: true }
        historicalMonths:
          type: integer
          default: 12
          description: >
            **Backdated synthetic orders**, because an integration reading a reporting API against an
            empty venue tests nothing.
        locale: { type: string, default: en-AE }

    WebhookEventType:
      type: string
      description: >
        **The webhook event catalogue: every event a subscription may name** (29 September, build
        pass). Each value is the `name` of an event in `events/` — `aggregate.pastTenseFact`,
        published through `platform.outbox` by exactly one context. A name is added here in the same
        change that adds its event file, and never before.

        **Added 29 September**, each closing a requirement that had the webhook mechanism and nothing
        to subscribe to:

        | Events | Publisher | Requirement |
        |---|---|---|
        | `device.statusChanged`, `device.tamperDetected`, `device.enrolmentChanged`, `device.firmwareReleased`, `device.firmwareRolloutCompleted` | tenancy | 16.9.56 |
        | `accreditation.applicationDecided`, `accreditation.holderStatusChanged`, `accreditation.credentialIssued`, `accreditation.renewalDue` | accreditation | 12.1.53 |
        | `approval.requested`, `approval.escalated`, `approval.stepCompleted`, `approval.expired` | approvals | 11.1.64, 11.1.66 |
        | `seat.held`, `seat.released`, `seat.blocked`, `seatMap.published` | seating | 21.13.4 |
        | `consent.deviceConsentRecorded`, `consent.deviceConsentClaimed` | marketing | 2.6.65 |
        | `order.chargebackRecorded` | orders | 8.3.11 to 8.3.15 (a tenant's own finance or fraud tooling) |
        | `entitlement.expiringSoon` | access | 5.5.30 (a tenant's own CRM) |
        | `apiClient.anomalyDetected` | public-api | 17 September minutes M17-07 (added 30 September with its event file) |

        **Deprecated** (1 October, ADR-0067 amendment): `device.enrolmentChanged` is still offered but nothing
        inside the platform consumes it any more; it is removed at the next major version of this API.
        Subscribers are told in the release note.

        **Published and deliberately not offered** (29 September, build pass, group G2):
        `identity.credentialResetRequested` and `identity.loginRecorded` are security signals, and a stream of
        them to an outside receiver is a map of which accounts are under attack; `storefront.sessionEvent` is
        high-volume fraud telemetry, not a business fact a receiver acts on.
      x-ticvai-deprecated-values: [device.enrolmentChanged]   # ADR-0067 amendment, 1 October
      enum:
        - access.validated
        - accreditation.applicationDecided
        - accreditation.credentialIssued
        - accreditation.holderStatusChanged
        - accreditation.renewalDue
        - ai.ceilingApproaching
        - apiClient.anomalyDetected
        - approval.escalated
        - approval.expired
        - approval.granted
        - approval.rejected
        - approval.requested
        - approval.stepCompleted
        - assets.documentIndexed
        - cart.abandoned
        - catalogue.productPublished
        - consent.deviceConsentClaimed
        - consent.deviceConsentRecorded
        - conversation.handedOver
        - device.enrolmentChanged
        - device.firmwareReleased
        - device.firmwareRolloutCompleted
        - device.statusChanged
        - device.tamperDetected
        - entitlement.expiringSoon
        - entitlement.issued
        - entitlement.statusChanged
        - fnb.menuPublished
        - fnb.orderReady
        - inventory.purchaseOrderReceived
        - ledger.journalPosted
        - ledger.periodClosed
        - maintenance.assetReturnedToService
        - maintenance.templatePublished
        - maintenance.workOrderCompleted
        - marketing.caseClosed
        - order.chargebackRecorded
        - order.completed
        - order.paid
        - order.refunded
        - performance.cancelled
        - reporting.definitionPublished
        - retail.merchandisePublished
        - seat.blocked
        - seat.held
        - seat.released
        - seat.sold
        - seatMap.published
        - shift.closed
        - stock.depleted
        - tenant.suspended
        - whitelabel.contentPublished

    WebhookEventCatalogueEntry:
      type: object
      x-ticvai-persistence: none — read from the event catalogue (events/*.yaml) shipped with the release
      description: >
        One event a webhook may subscribe to, as the event catalogue declares it. What a receiver
        needs to write a handler: the name, the version in the payload, who publishes it, what it is
        about and when, and the payload fields.
      required: [name, version, publisher]
      properties:
        name: { $ref: '#/components/schemas/WebhookEventType' }
        version: { type: integer, minimum: 1 }
        publisher:
          type: string
          description: The one context that publishes it.
        aggregate:
          type: string
          description: What the event is about. Delivery is ordered within one instance of it.
        description: { type: string }
        emittedWhen: { type: string, nullable: true }
        payload:
          type: array
          items:
            type: object
            required: [field, type]
            properties:
              field: { type: string }
              type: { type: string }
              required: { type: boolean, default: true }
              notes: { type: string, nullable: true }

    WebhookSubscription:
      type: object
      x-ticvai-persistence: "control.webhook_subscription"
      description: >
        13.1.26, 13.3.18 and 13.3.22. **The 29 events already exist and nothing outside could
        receive one.**
      required: [id, clientId, endpointUrl, eventTypes, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        clientId: { type: string, format: uuid }
        endpointUrl: { type: string }
        eventTypes:
          type: array
          description: >
            **Filtered at subscription, not at delivery.** A subscriber taking every event and
            discarding 99% is a subscriber the platform pays to talk to. Each entry is a name from
            the webhook event catalogue (`WebhookEventType`).
          items: { $ref: '#/components/schemas/WebhookEventType' }
        filters:
          type: object
          nullable: true
          description: 13.3.22. Tenant, venue, or a business condition on the payload.
          additionalProperties: true
        signingSecret:
          type: string
          format: password
          writeOnly: true
          description: >
            **How the receiver knows it was TICVAI.** Without a signature an endpoint accepts a
            ticket-sale event from anybody who learns the URL.

            **Write-only: accepted on create, never returned.** The same rule as `clientSecret` — a
            system that can show you a secret later is a system that hands it to whoever reads
            the subscription.
        status: { type: string, enum: [pendingVerification, active, paused, failing, disabled], readOnly: true }
        consecutiveFailures: { type: integer, readOnly: true }
        disabledReason:
          type: string
          nullable: true
          readOnly: true
          description: >
            13.1.29. **An endpoint failing for days is disabled rather than retried forever**, and
            the developer is told — a queue growing against a dead endpoint is a cost the platform
            carries silently.

    WebhookDelivery:
      type: object
      x-ticvai-persistence: "control.webhook_delivery"
      description: >
        13.1.30. **The log a developer needs most**, and without it every question becomes a support
        ticket.
      required: [id, subscriptionId, eventType, status]
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { type: string, enum: [pending, delivered, failed, retrying, abandoned] }
        attemptCount: { type: integer }
        responseCode: { type: integer, nullable: true }
        responseBodyExcerpt:
          type: string
          nullable: true
          description: >
            **Truncated, and it is what makes the log useful** — a 500 with the receiver's own error
            message in it answers the question without a conversation.
        isReplay: { type: boolean, default: false }
        isTest:
          type: boolean
          default: false
          description: >
            Sent by `testWebhookSubscription` (VM close-out, 29 September). Marked in the payload so a
            receiver never books it, and never counted towards `consecutiveFailures`.
        deliveredAt: { type: string, format: date-time, nullable: true }

    ApiQuota:
      type: object
      x-ticvai-persistence: "control.api_limit"
      description: >
        13.1.36 and 13.1.37. **A quota protects the venue, not the developer.**
      required: [clientId, sustainedPerMinute]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        clientId: { type: string, format: uuid }
        sustainedPerMinute: { type: integer }
        burstPerSecond:
          type: integer
          description: >
            **Separate from the sustained rate**, because a nightly sync is a legitimate spike and a
            flat per-second limit either blocks it or permits the flood it was meant to stop.
        dailyCap: { type: integer, nullable: true }
        perOperationOverrides:
          type: object
          additionalProperties: { type: integer }
          description: >
            **Availability checks and order creation deserve different limits** — one is cheap and
            polled, the other is expensive and rare.
        onBreach: { type: string, enum: [throttle, reject, queue], default: throttle }

    ApiUsageSummary:
      type: object
      description: >
        13.1.16 to 13.1.20, 13.1.41 to 13.1.45. **One endpoint because they are one question asked
        five ways.**
      properties:
        totalCalls: { type: integer }
        successRate: { type: number }
        clientErrorRate:
          type: number
          description: >
            **4xx — the integrator's problem.** Separated because a single error rate lets both
            sides blame the other.
        serverErrorRate:
          type: number
          description: 5xx — TICVAI's problem.
        p50LatencyMs: { type: number }
        p95LatencyMs: { type: number }
        p99LatencyMs: { type: number }
        quotaBreaches: { type: integer }
        byOperation:
          type: array
          items:
            type: object
            properties:
              operationId: { type: string }
              calls: { type: integer }
              errorRate: { type: number }

    ApiVersion:
      type: object
      x-ticvai-persistence: "control.api_version"
      description: >
        13.1.31 to 13.1.35, ADR-0026. **CF-141 is sharper under D1**: a single supported production
        version was tenable when only Softlabs called the API, and **with third parties a breaking
        change with no window breaks somebody else's business.**
      required: [version, status]
      properties:
        version: { type: string }
        status: { type: string, enum: [preview, current, deprecated, sunset] }
        releasedAt: { type: string, format: date-time }
        deprecatedAt: { type: string, format: date-time, nullable: true }
        sunsetAt: { type: string, format: date-time, nullable: true }
        minimumNoticeMonths:
          type: integer
          default: 12
          description: >
            **The commitment, not the intention.** A deprecation policy without a stated minimum is
            a policy that shortens under pressure.
        migrationGuideUrl: { type: string, nullable: true }
        activeClientCount: { type: integer, readOnly: true }
        changes:
          type: array
          description: >
            **The developer changelog for this version** (17 September minutes, M17-14): every operation
            added, changed, deprecated or removed, and whether the change is breaking under ADR-0026.
            Generated at release from the contract diff; shown on DEV-001.
          items:
            type: object
            required: [operationId, kind]
            properties:
              operationId: { type: string }
              contract: { type: string }
              kind: { type: string, enum: [added, changed, deprecated, removed] }
              breaking: { type: boolean, default: false }
              summary: { type: string }

    IntegrationListing:
      type: object
      x-ticvai-persistence: "control.integration_listing"
      description: >
        13.1.50, decision D1. **A listing, not an installation.** The integration runs on the
        developer's own infrastructure.

        **Third-party code does not execute inside TICVAI** — stated rather than assumed, because
        that is a different product with a different threat model.
      required: [id, developerId, name, category, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        developerId: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, enum: [crm, marketing, accounting, hotel, transport, analytics, accessibility, other] }
        description: { type: string }
        integrationUrl: { type: string }
        requiredScopes: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, submitted, inReview, certified, rejected, revoked, delisted], readOnly: true }
        certifiedUntil:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: >
            **Certification expires.** An integration certified against v1 and still listed after v3
            is TICVAI vouching for something it has not looked at in two years.
        certifiedAgainstVersion: { type: string, nullable: true, readOnly: true }
        listingFeeModel: { type: string, enum: [none, flat, revenueShare], nullable: true }
        visibility:
          type: string
          enum: [public, private]
          default: public
          description: >
            `private`: certified for production access and never shown in the marketplace (17 September
            minutes, M17-06). `public`: also listed once certified.

    ApiLicence:
      type: object
      x-ticvai-persistence: "control.api_licence"
      description: >
        13.3.24, decision D5. **Configuration, not code** — rates and terms change without a
        release.

        **The rates themselves are CF-135c and remain open.** This is the surface they will be set
        through.
      required: [tenantId, licensedModules]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        tenantId: { type: string, format: uuid }
        licensedModules:
          type: array
          description: >
            **The example in the requirement is the shape**: a venue licensing the ticketing API and
            not the F&B one. **The platform module list** (17 September minutes, M17-05), so the licence,
            the scope catalogue and the modules a tenant buys are one vocabulary.
          items: { $ref: '../shared/common.yaml#/components/schemas/ModuleKey' }
        callAllowancePerMonth: { type: integer, nullable: true }
        catalogueWriteException:
          type: object
          nullable: true
          description: >
            **M17-04: the one way a client reaches a catalogue write**, set by TICVAI platform staff
            only (`setApiLicensing` refuses anyone else 403 `platform-staff-only`). Null, the default,
            means no partner or developer client of this tenant can create or change products, price
            lists, prices, channel capacity, lifecycle or alternative codes.
          required: [clientId, operationIds, reason, grantedUntil]
          properties:
            clientId:
              type: string
              format: uuid
              x-ticvai-references: control.api_client
            operationIds:
              type: array
              minItems: 1
              items:
                type: string
                enum: [createProduct, updateProduct, setProductAttributes, createPriceList, updatePriceList, copyPriceList, setPrices, createChannelCapacity, updateChannelCapacity, setChannelAllocations, transitionProductLifecycle, setAlternativeCodes]
            reason: { type: string, maxLength: 500 }
            grantedByPrincipalId: { type: string, format: uuid, readOnly: true }
            grantedUntil: { type: string, format: date }
        overageRatePerThousand: { type: number, nullable: true }
        revenueSharePercent: { type: number, nullable: true }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
