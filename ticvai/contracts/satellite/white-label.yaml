  /content-blocks/{blockId}/publish:
    parameters:
    - name: blockId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: publishContentBlock
      x-ticvai-consumed-by:
        - "P13 CMS-007 Page Builder"
      x-ticvai-read-via:
      - query: identity#principalRecords
        route: service
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      x-ticvai-write-via:
      - table: approvals.request
        operation: createApprovalRequest
      summary: Publish now, or schedule it
      description: '**A seasonal banner needing somebody awake at midnight is the same defect `Product.onSaleFrom`
        fixed**, and the answer is the same: a date on the object rather than a person with an alarm.

        Approval is separate from authoring where the tenant requires it — **the approver may not be the
        author**, following the rule already enforced on products. **Whether it is required is the tenant''s
        publish-review policy** (`getPublishReviewPolicy`; Chinmay, 2 October, workbook Q156; CHG-CSA-042), off
        by default: a single publish by a `TENANT_PUBLISH` holder.

        **`expireAt` must follow `publishAt`** when both are sent (decided 28 September, audit R163), or
        400. A scheduled job makes the publish and the expiry at those times (audit R163).

        **The review path, as `publishTenantConfig` has it** (r8 walk of ticket 27919; ADAM CR-154). With the
        tenant''s publish-review policy off, the block is published or scheduled at once (200). With it on, this
        calls approvals'' `createApprovalRequest` (`x-ticvai-write-via`; kind `configurationChange`, the same matrix
        subject `whiteLabelPublication`, `subjectId` the block id; the request points at the block, and the block keeps no link back), leaves `status`
        as it is and sets `reviewStatus` `pending`, and answers 202. White-label''s consumer of `approval.granted`
        then publishes or schedules the block (`reviewStatus` `approved`); its consumer of `approval.rejected`
        sets `reviewStatus` `rejected` and the block stays a draft. While `pending`, a second publish of the block
        is refused with 409 `content-block-awaiting-review`. CMS-007 reads `getPublishReviewPolicy` to say whether
        review applies and shows `reviewStatus` on the block.

        '
      tags:
      - whiteLabel
      x-ticvai-permission: TENANT_PUBLISH
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publishAt:
                  type: string
                  format: date-time
                  nullable: true
                expireAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Published or scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBlock'
        '202':
          description: Submitted for review; the tenant's publish-review policy is on. The block keeps its `status`,
            carries `reviewStatus` `pending`, and is published or scheduled when the
            request is approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBlock'
        '409':
          description: 'The block is already `published` (`content-block-published`; a change goes through a new draft), is `archived` (`content-block-archived`), or is already waiting for review (`content-block-awaiting-review`). Nothing changes.'
          x-ticvai-problem-types: [content-block-published, content-block-archived, content-block-awaiting-review]
          content:
            application/problem+json:
              schema:
                $ref: '../shared/common.yaml#/components/schemas/Problem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
