    CustomDomain:
      type: object
      x-ticvai-persistence: whitelabel.custom_domain
      description: '24 August. **`ADM-017 Domain & Certificate Management` declared 41 operations and
        not one of them was about a domain** — it carried the same bulk-attached set as every other white-label
        screen, and **no domain or certificate operation existed anywhere in 1,010.**

        A white-label platform whose tenants cannot use their own domain is a white-label platform in
        name only.

        **Verification before issuance, always.** A certificate issued for a domain the tenant does not
        control is a certificate issued to whoever asked.

        '
      required:
      - id
      - tenantId
      - hostname
      - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          x-ticvai-references: none
          type: string
          format: uuid
        hostname:
          type: string
        kind:
          type: string
          enum:
          - guestWeb
          - guestApp
          - partnerPortal
          - developerPortal
        status:
          type: string
          enum:
          - pending
          - verifying
          - verified
          - issuing
          - active
          - failed
          - expired
          - revoked
        verificationMethod:
          type: string
          enum:
          - dnsTxt
          - cname
          - httpFile
        verificationToken:
          type: string
          readOnly: true
        verificationRecord:
          type: object
          readOnly: true
          description: '**The record the tenant must publish**, which `claimCustomDomain` promises and
            the claim had nowhere to hold. Set when the claim is made, from `hostname`, `verificationMethod`
            and `verificationToken`: a TXT record for `dnsTxt`, a CNAME for `cname`, and for `httpFile`
            the URL path to serve and the file''s content.

            '
          required:
          - type
          - name
          - value
          properties:
            type:
              type: string
              enum:
              - TXT
              - CNAME
              - httpFile
            name:
              type: string
              description: The DNS name to create, or for `httpFile` the URL path on `hostname`.
            value:
              type: string
              description: The record's value, CNAME target or file content.
        certificateExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**Renewal is a job, not a reminder.** A certificate that expires on a Saturday
            takes a tenant''s storefront down, and nobody reads a reminder email on a Saturday.

            '
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
          nullable: true
        routing:
          type: string
          enum:
          - cname
          - delegatedSubdomain
          - apex
          default: cname
          description: '**How the hostname reaches TICVAI** (Chinmay, 2 October: "subdomain plus CNAME"; CHG-CSA-043).
            `cname`, the default: a CNAME (e.g. `tickets.venue.com`) straight to the Front Door endpoint, validated by
            the TXT `_dnsauth` record, with a Front Door managed certificate. `delegatedSubdomain`: the tenant delegates
            a subdomain to TICVAI''s name servers (NS). `apex`: the bare domain, only on request. There is no path
            proxy.'
        dnsRecords:
          x-ticvai-persistence-kind: valueObject
          x-ticvai-persistence-column: jsonb
          type: array
          readOnly: true
          description: '**Every record the tenant must publish, with what is observed now** (CHG-CSA-043): the TXT
            `_dnsauth` record, the CNAME, and CAA or NS where they apply. CMS-017 lists them with their status.'
          items:
            type: object
            required:
            - type
            - name
            - expectedValue
            - status
            properties:
              type:
                type: string
                enum:
                - TXT
                - CNAME
                - CAA
                - NS
              name:
                type: string
              expectedValue:
                type: string
              observedValue:
                type: string
                nullable: true
              status:
                type: string
                enum:
                - ok
                - missing
                - wrong
        revalidation:
          type: string
          readOnly: true
          enum:
          - none
          - pendingRevalidation
          - timedOut
          default: none
          description: '**The two waits CMS-017 shows beside `status`** (CHG-CSA-043). `pendingRevalidation`: an `active`
            domain whose validation must be renewed (the managed certificate''s periodic revalidation, or a record that
            changed); it keeps serving while the job re-checks. `timedOut`: a claim whose records were not published
            within the validation window; `regenerateDomainToken` starts it again. Kept beside `status`, not inside it,
            because a new status value would break a client built at r1 (CHG-CSA-043 notes).'
        isCnameLost:
          type: boolean
          readOnly: true
          description: '**Takeover warning** (CHG-CSA-043). True when a scheduled check finds that an `active` or
            released hostname''s CNAME still points at TICVAI with no tenant serving it, or no longer points at us while
            `active`. Relinquishing a domain tells the tenant to remove the CNAME first, so nobody else can claim the
            dangling record.'
        isPrimary:
          type: boolean
          readOnly: true
          description: The tenant's primary domain for its `kind`; the others redirect to it (`setPrimaryDomain`).
        readiness:
          type: object
          readOnly: true
          description: '**Per-domain setup a guest needs** (CHG-CSA-043): the UAE Pass redirect URI registered for this
            hostname, the Apple Pay merchant domain verified, and the app links (Apple app-site association, Android
            asset links) served.'
          properties:
            uaePassRedirect:
              type: string
              enum:
              - ready
              - pending
              - notApplicable
            applePayDomain:
              type: string
              enum:
              - ready
              - pending
              - notApplicable
            appLinks:
              type: string
              enum:
              - ready
              - pending
              - notApplicable
