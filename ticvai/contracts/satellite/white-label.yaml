  /venues/{venueId}/kiosk-config:
    parameters:
    - name: venueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPublishedKioskConfig
      x-ticvai-consumed-by:
        - "P05 KSK-001 Attract Loop"
        - "P05 KSK-002 Language Select"
        - "P05 KSK-008 Payment unresolved"
        - "P05 KSK-010 Print failure"
        - "P05 KSK-013 Call staff"
        - "P05 KSK-014 Out of service"
        - "P13 CMS-105 Kiosk Builder"
      x-ticvai-read-via:
      - query: tenancy#workstationRecords
        route: service
        for: 'whether the workstation is in this venue (404 not-found) (CHG-MOD-003)'
      x-ticvai-agreed: '5 October 2026: decided by Chinmay (docs/active/decisions/answers-5-october.md, CHG-R4-001);
        the kiosk''s counterpart of getPublishedTenantConfig, served the same way'
      x-ticvai-audience:
      - anonymous
      - guest
      - device
      - staff
      x-ticvai-read-routing: replica
      summary: The published kiosk configuration a kiosk renders, before anyone touches it
      description: '**What the kiosk shell reads at start, at every return to the attract loop and offline from its
        cache** (decided 5 October 2026 by Chinmay, CHG-R4-001). The counterpart of `getPublishedTenantConfig`,
        which the kiosk still reads for the brand, theme, fonts, policies, accessibility and the published language
        list; this adds what differs on a kiosk.


        **The tenant comes from the host, never from the caller**, exactly as for `getPublishedTenantConfig`: the edge
        resolves the host to a tenant with `tenancy.resolveTenantHost`; an unknown host is 404. **Keyed by the kiosk or
        by the group:** `workstationId` (the kiosk''s workstation, from its enrolment) resolves through the kiosk''s
        assignment (`assignKiosk`) to its group''s configuration, and a kiosk in no group gets the venue''s default;
        `kioskConfigId` reads one group''s configuration directly (the builder''s preview, CMS-105). One of the two is
        required (400 otherwise); a workstation that is not in this venue is 404.


        **Published, non-sensitive fields only.** Read from the configuration''s current `KioskConfigVersion` (never
        the draft), plus the live `outOfService` state `setKioskOutOfService` writes and `isOpenNow` worked out from
        the opening hours in the venue''s time zone. Left out: the draft markers, `assignedKioskCount`, who published,
        and every principal id.


        **Cacheable.** No session is needed, so the answer is the same for every caller of a host, venue and kiosk and
        is cached at the edge, invalidated by `publishKioskConfigs`, `restoreKioskConfigVersion` (only once published),
        `assignKiosk` and `setKioskOutOfService`. A staff token is accepted too, for the builder''s preview.

        '
      tags:
      - kiosk
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-offline-note: '5 October 2026: **servable from the kiosk''s local cache.** A published configuration changes
        only on a publish, so the kiosk keeps the last answer (and the media of its attract loop) and renders from it
        offline: the last cached loop plays, with the `offline` message, and nothing is sold that needs the server.

        '
      x-ticvai-conflict-policy: serverWins
      security:
      - {}
      - guestAuth: []
      - bearerAuth: []
      parameters:
      - name: workstationId
        in: query
        required: false
        description: The kiosk's workstation (tenancy `Workstation.id`, from the kiosk's enrolment). Resolves to its
          group's configuration, or to the venue's default when it is in no group.
        schema:
          type: string
          format: uuid
      - name: kioskConfigId
        in: query
        required: false
        description: One kiosk configuration, read directly (the builder's preview). Ignored when `workstationId` is
          given.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The published kiosk configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedKioskConfig'
        '400':
          description: Neither `workstationId` nor `kioskConfigId` was given
          x-ticvai-problem-types:
          - kiosk-key-missing
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          description: The host belongs to no tenant (`not-found`), the workstation or configuration is not in this
            venue (`not-found`), or nothing is published for it yet (`not-configured`); the kiosk then shows KSK-014
            Out of service with the platform's neutral text.
          x-ticvai-problem-types:
          - not-found
          - not-configured
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
