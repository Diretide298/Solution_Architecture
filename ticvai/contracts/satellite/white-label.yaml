    HomepageSectionKind:
      type: string
      description: '**Which module each section needs, proposed, client to correct (decided 28 September,
        audit R163).** `tickets` needs `ticketsAndBooking`; `whatsOn` needs `events`; `attractions`
        needs `attractions`; `membership` needs `membership`; `dining` needs `diningAndFnb`; `shop`
        needs `shop`; `map` needs `map`. `heroBanner`, `quickActions`, `promotions`, `customContent`,
        `venueOverview` and `spacer` need no module. `venueOverview` (decided 29 September, MOB-3) is the
        mobile Home''s description, opening hours (from `getTenantAppStatus`) and type tiles. `setHomepageLayout` refuses a visible section whose module is not
        enabled, and `setModuleEnablement` refuses to disable a module a section still needs.


        **Which catalogue slice a type tile shows, and whose card count applies** (r8 walk of tickets 28335 and
        28682; lead decision of 20 October 2026, option 1, no schema change; DEC-152 and DEC-153 stand as they are).
        A Home type tile is a product category, and its highlights are `listProducts(venueId, categoryId, pageSize)`
        in `displayOrder`, the order `listProducts` documents. The card count (`maxItems`) is that of the section
        whose kind matches the tile: `attractions`, `dining` or `shop`; **every other category uses the count of the
        `whatsOn` section**. On GST-038 (At the Venue), Food is kind `fnb` (opens GST-024), Shop is kind `retail`
        (GST-026), Services opens GST-029, Shows is `listPerformances` of the venue for today, and Map and Waits
        show in place.


        **Where the Home overview, its quick actions and "Book a trip" come from in r8** (R8 blocker WHITE-C07, the
        lead''s answer of 20 October 2026: option 3, nothing new stored). The `venueOverview` description is the
        published content page its section names (`contentPageId`, read with `listPublishedContentPages`); none
        named, the line is left out. The `quickActions` tiles are a fixed list the app shows, one per enabled
        module (`enabledModules` of the published configuration), in the order of the approved frame; a venue does
        not configure them in r8. "Book a trip" shows when the venue has a published booking flow of type
        `transport` (`getPublishedBookingFlow`). Configurable tiles (a section''s own actions) come later, when the
        client asks for them.

        '
      enum:
      - heroBanner
      - quickActions
      - tickets
      - whatsOn
      - attractions
      - membership
      - dining
      - shop
      - promotions
      - map
      - customContent
      - venueOverview
      - spacer
