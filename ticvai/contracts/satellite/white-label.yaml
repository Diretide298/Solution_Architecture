openapi: 3.1.0
info:
  title: TICVAI White Label Builder
  version: 0.1.0
  x-ticvai-screen-count: 106
  x-ticvai-tier: satellite
  x-ticvai-module: 19 — Guest Mobile App & Branding (builder)
  x-ticvai-requirements: 107
  x-ticvai-capabilities:
  - C57
  - C105
  - C106
  x-ticvai-platforms:
  - P13 Venue CMS
  - P08 Venue Management
  description: "## What this contract covers\n**How a tenant configures their branded guest app. A CMS\
    \ plus an app builder.**\n| | | |---|---| | **Tier** | satellite | | **Matrix domain** | 19 — Guest\
    \ Mobile App & Branding (builder) | | **Requirements** | ~107 | | **Capabilities** | C57, C105, C106\
    \ | | **Consumed by** | P13 Venue CMS · P08 Venue Management |\n## How to read this file\n**This file\
    \ is a contract.** It is hand-authored and it is the source of truth for one bounded context: server\
    \ code, client code and mock servers are generated from it, never the other way round. If a field\
    \ is not here, it does not exist.\n**Contracts are split into two tiers.**\n- **Spine** — the eight\
    \ contexts everything else depends on: tenancy, identity,\n  catalogue, orders, shift, access, finance,\
    \ cross-region. Frozen first. A change here\n  requires a formal change request, because every satellite\
    \ has pinned against it.\n- **Satellite** — a domain that builds on the spine and can move independently.\n\
    \  Cheaper to change.\n\n**`paths` are operations.** Each one declares four TICVAI extensions, and\
    \ Redocly rejects any that does not:\n| Extension | Answers | |---|---| | `x-ticvai-permission` |\
    \ Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed\
    \ | | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held | |\
    \ `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this | | `x-ticvai-conflict-policy`\
    \ | How a replayed operation resolves — `append`, `serverWins`, `manual` |\nWhere `x-ticvai-permission`\
    \ is null, one of these says why: `x-ticvai-auth: service` (cell-to-cell), `x-ticvai-self-scoped`\
    \ (acts only on the caller's own resources), or `security: []` (genuinely public).\n**`components.schemas`\
    \ are API schemas — the shape of data on the wire.** They are not database tables. One API schema\
    \ may become three columns (`Money`) or five tables (`Order`); some have no table at all (`ValidationResult`,\
    \ `TrialBalance`). Roughly 70% of the DDL derives from these, and the rest — partitioning, RLS, the\
    \ PII split — is storage design that lives in the migration scripts.\n**`security` says who may call.**\
    \ An operation with no `security` of its own inherits the file-level `bearerAuth`, a staff session.\
    \ `security: []` on an operation removes that: the call is public and needs no token. A list naming\
    \ several schemes accepts any one of them, and an empty object `{}` in the list makes the token optional.\
    \ Inside a scheme the array holds OAuth scopes; TICVAI uses none, so it is always empty.\n\n## This\
    \ context\nHow a tenant configures\
    \ their branded guest app — identity, theme, navigation, homepage, content, module enablement, and\
    \ publishing. Capabilities C57, C105 and C106.\nTwenty screens in the client UI/UX reference. This\
    \ is not a settings page; it is a CMS plus an app builder, and no tenant goes live without it.\nPositions\
    \ this encodes:\n- **Build-time and runtime configuration are separated and enforced.** Every change\
    \ to a\n  build-time value costs a store review cycle, so the API marks those fields explicitly\n\
    \  and refuses to treat them as publishable config.\n- **Publishing is a workflow, not a save.** Draft\
    \ → review → preview → publish, with\n  version history and restore. A tenant editing their live app\
    \ in place is a tenant one\n  keystroke from a broken storefront.\n- **Configuration versions behave\
    \ like catalogue bundles.** Immutable, versioned,\n  atomically applied, restorable. Same problem,\
    \ so the same mechanism rather than a\n  second one.\n- **Module enablement is the licensing model\
    \ surfaced.** A module the tenant has not\n  licensed cannot be enabled here, and a disabled module\
    \ is hidden from the guest app\n  entirely rather than shown and refused.\n- **Arabic is a first-class\
    \ layout, not a translation layer.** Fonts pair Arabic with\n  Latin, preview toggles direction, and\
    \ content carries per-language versions.\n\n## Draft, published and live\n**One working draft per\
    \ tenant.** It is the tenant's `whitelabel.tenant_config` row (`isDraft` true) and the rows that hang\
    \ off it: brand, app icons, booking flow, theme, fonts, header, footer, navigation, homepage, module\
    \ enablement, feature toggles, languages and each venue's booking flows (29 September, W12). Every `set*` operation on those parts writes the draft,\
    \ and nothing a guest sees changes. The first `set*` call creates the draft row; until a part has\
    \ been saved once, its read returns 404 `not-configured`, which a screen shows as its first-run state.\n\
    **Published versions are snapshots.** `publishTenantConfig` copies the draft into a new `ConfigVersion`\
    \ (its `snapshot`) and makes that version current. Guests read the current version, never the draft.\
    \ `restoreConfigVersion` copies a snapshot back into the draft and does not publish.\n**Outside the\
    \ draft:** `setMaintenanceMode` (live at once, and neither published nor restored), `setPolicy` (each\
    \ call publishes a policy version), content blocks and banners (each has its own schedule), custom\
    \ domains, the Site Builder's progress, the client's store accounts and app builds (29 September, W12 and M24-08).\n\n## Fields the server owns\nA `readOnly` field (an id, a `status` or `state` that an operation\
    \ or a timer moves, `scopePath`, a computed field) is returned and never taken: a request that carries\
    \ one has it ignored. `x-ticvai-derived` says how a computed field is kept current: `onWrite` (in the\
    \ same transaction as the write that changes it), `onRead` (computed when read, never stored) or `sweeper`\
    \ (a timer).\n\n## Asset references\nA field named `*AssetRef` or `*AssetRefs` holds the `id` of a `MediaAsset`\
    \ in the `assets` library, produced there by `createUpload` then `completeUpload`.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: overview
- name: brand
- name: theme
- name: navigation
- name: homepage
- name: content
- name: modules
- name: publishing
- name: bookingFlows
- name: appPublishing
- name: kiosk
