paths:
  /tenant-domains:
    get:
      operationId: listCustomDomains
      x-ticvai-consumed-by:
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      summary: The domains this tenant has claimed
      description: '**Status per domain, not just the hostname.** `pending`, `verifying`, `verified`,
        `issuing`, `active`, `failed`, `expired` or `revoked` (`states/custom-domain.yaml`) — a tenant
        looking at this screen is almost always looking because something is wrong. A certificate close
        to lapsing is an `active` domain with an early `certificateExpiresAt`; there is no separate status
        for it.

        '
      tags:
      - white-label
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDomain'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: claimCustomDomain
      x-ticvai-consumed-by:
        - "P08 BO-835 Site, Brand & Domain Setup"
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      x-ticvai-read-via:
      - query: subscription#tenantRecords
        route: in-process
        for: 'its read of control.tenant, Platform''s data (CHG-MOD-001)'
      - query: platform-ops#hostnameHeldByAnotherTenant
        route: in-process
        for: 'refused where another tenant already holds the hostname (ADAM CR-096)'
      summary: Claim a domain and get a verification token
      description: '**Claiming is not owning.** The response carries the record the tenant must publish
        (`verificationRecord`), and nothing happens until it resolves.

        **Refused where another tenant already holds it** — with no detail about who, because telling
        one tenant that another owns a hostname is telling them something about a customer.

        **A CNAME to the Front Door endpoint is the default** (Chinmay, 2 October: "subdomain plus CNAME";
        CHG-CSA-043): the response lists every record to publish (`dnsRecords`: the TXT `_dnsauth` validation and
        the CNAME), and Front Door issues a managed certificate. `routing` asks for a delegated subdomain instead;
        the apex only on request. The tenant''s platform subdomain (`getPlatformSubdomain`) keeps working throughout.

        '
      tags:
      - white-label
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hostname
              - kind
              properties:
                hostname:
                  type: string
                kind:
                  type: string
                  enum:
                  - guestWeb
                  - guestApp
                  - partnerPortal
                  - developerPortal
                verificationMethod:
                  type: string
                  enum:
                  - dnsTxt
                  - cname
                  - httpFile
                  default: dnsTxt
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Claimed, with the record to publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDomain'
        '409':
          x-ticvai-problem-types: [domain-already-claimed]
          description: '**Already claimed.** Named as unavailable rather than attributed.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tenant-domains/{domainId}/verify:
    parameters:
    - name: domainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: verifyCustomDomain
      x-ticvai-consumed-by:
        - "P09 ADM-017 Domain & Certificate Management"
        - "P13 CMS-017 Domain & Certificate"
      x-ticvai-names-for-context: [control.tenant_domain]
      summary: Check the record and issue the certificate
      description: '**Verification and issuance are one act from the tenant''s point of view and two states
        in the model.** A tenant who has published the record wants a working domain, not a green tick.

        **Connected means the edge resolves it** (r8, APPROVALS-TENANCY-C11): after the mapping is sent
        (`setTenantDomainMapping`, which reaches the control plane as `tenantDomain.mapped`), the domain is shown
        connected only once `resolveTenantHost` answers the hostname with this tenant; a `tenantDomain.rejected`
        (hostname taken by another tenant) shows the refusal instead.

        **Retried by a job rather than by the tenant.** DNS propagation takes hours and a tenant clicking
        *verify* every ten minutes is a tenant who will give up before it resolves.


        **Verification routes the hostname** (system-design review SD-021, 29 September; applied 30
