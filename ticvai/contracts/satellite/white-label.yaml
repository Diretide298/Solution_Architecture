      description: '**The Site Builder''s saved progress, one row per tenant (decided 29 September, W12 and
        M24-05).** Not configuration and not published. `presetKey` is the starting point the operator picked;
        the builder pre-fills each step from it, which is what keeps the minimum path to a working site at
        about 30 minutes.

        '
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        presetKey:
          type: string
          nullable: true
          enum:
          - themePark
          - waterPark
          - museum
          - theatreAndArena
          - singleAttraction
          - playCentre
          - multiVenue
          - null
          description: 'The starting point. Each preset proposes the modules, the booking flow types (with
            their default step order), the homepage sections, the mobile tabs and a booking-flow `preset`;
            nothing is written until the operator accepts a step.


            **What each preset proposes** (r8 walk of tickets 27908, 27899 and 27905; lead decision of 20 October
            2026, option 2). `waterPark` is DEC-159: modules `ticketsAndBooking`, `diningAndFnb`, `shop`, `map`;
            flows `datedDayPass` and `cabanaMap`; sections `heroBanner`, `tickets`, `attractions`, `dining`; tabs Home,
            Explore, Map, Tickets. **Every other preset (`themePark`, `museum`, `theatreAndArena`,
            `singleAttraction`, `playCentre`, `multiVenue`) proposes the same neutral default until the client
            supplies its own values, which then arrive as data:** flow `datedDayPass`; theme primary `#1F4E79`,
            secondary `#5B6770`, accent `#B85C00`, background `#FFFFFF`, text `#1A1A1A` (all pass the contrast
            pairs of `Theme`); header layout `logoLeft` with logo, menu and notifications shown; footer with one
            column, "Information", holding the policy links, and the copyright line; homepage sections and tabs from
            `listLandingPageTemplates` for the preset. **These values are a placeholder, not a client decision**
            (DI-885 awaits the client''s feedback): the CMS marks them "placeholder" and must not present them as
            decided.'
        currentStep:
          allOf:
          - $ref: '#/components/schemas/SiteSetupStepKey'
          nullable: true
        steps:
          type: object
          description: One entry per `SiteSetupStepKey`.
          additionalProperties:
            type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - notStarted
                - inProgress
                - done
                - skipped
              completedAt:
                type: string
                format: date-time
                nullable: true
              completedByPrincipalId:
                type: string
                format: uuid
                nullable: true
        minimumPathDone:
          type: boolean
          readOnly: true
          x-ticvai-derived: onRead
          description: 'True once the minimum path is done: a logo, the four theme colours, at least one enabled
            valid booking flow and a published version. Everything else keeps its preset or schema default.'
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005). Written at `tenant` scope.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    StoreAccount:
      x-ticvai-persistence: whitelabel.store_account
      type: object
      description: '**One of the client''s own store accounts (decided 24 September, M24-08).** TICVAI never
        publishes under its own developer account.

        '
      required:
      - store
      - accountHolderName
      - developerAccountId
      - appIdentifier
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        store:
          type: string
          enum:
          - appleAppStore
          - googlePlay
        accountHolderName:
          type: string
          maxLength: 200
          description: The client's legal entity as the store knows it.
        dunsNumber:
          type: string
          nullable: true
          pattern: ^[0-9]{9}$
          description: Required for `appleAppStore`; Apple enrols an organisation only with its D-U-N-S number.
        developerAccountId:
          type: string
          maxLength: 64
          description: Apple Team ID, or the Google Play developer account id.
        appIdentifier:
          type: string
          maxLength: 155
          pattern: ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$
          description: The bundle id (Apple) or application id (Google) the app is signed with.
        apiCredentialSecretRef:
          x-ticvai-secret: vault-reference
          type: string
          nullable: true
          writeOnly: true
          description: 'App Store Connect API key or Play service-account key. **What the browser sends** (r8
            walk of ticket 27914): the request carries the secret itself once, as the key text (the .p8 text for
            Apple, the service-account JSON for Google); the server puts it in the cell''s Key Vault and the row
            keeps only the vault name. It is never returned: a read shows `hasApiCredential`, nothing else. Same
            rule as `ai.setAiCredential`. Needed only for `submitToStore`.'
        hasApiCredential:
          type: boolean
          readOnly: true
          x-ticvai-derived: onRead
        passTypeIdentifier:
          type: string
          nullable: true
          pattern: ^pass\.[A-Za-z0-9.-]+$
          description: '**The Apple Wallet Pass Type ID** (`pass.<reverse-domain>`), registered in the client''s own
            Apple Developer account, one per brand (Chinmay, 12 October 2026: the client owns the certificate;
            CHG-R6-033). Apple entry only; a Google entry sending it is refused with 400.'
        passCertificateSecretRef:
          x-ticvai-secret: vault-reference
          type: string
          nullable: true
          writeOnly: true
          description: '**The Pass Type ID certificate**, from the client''s Apple Developer account. **What the
            browser sends** (r8 walk of ticket 27914): the request carries the .p12 file itself, base64 text, in this
            field, and its password in `passCertificatePassword`; the server keeps both in Key Vault as one secret and
            the row keeps only the vault name, as for `apiCredentialSecretRef`. A read shows `hasPassCertificate`
            and `passCertificateExpiresAt`, never the certificate or the password. It signs
            every Apple pass the brand issues (orders `issueWalletPass`, `pushWalletPassUpdate`). On save the server
            reads the certificate''s Pass Type ID, team and expiry; a certificate whose Pass Type ID is not
            `passTypeIdentifier`, or whose team is not `developerAccountId`, is refused with 400 (CHG-R6-033).'
        passCertificatePassword:
          type: string
          format: password
          writeOnly: true
          nullable: true
          x-ticvai-persisted: false
          description: 'The password of the .p12 sent in `passCertificateSecretRef`. Required with it, refused
            without it (400). Kept with the certificate in Key Vault, never stored in the row, never returned, never
            logged, masked in any audit record.'
        hasPassCertificate:
          type: boolean
          readOnly: true
          x-ticvai-derived: onRead
        passCertificateExpiresAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: '**When the pass certificate expires**, read from the certificate when it is stored (CHG-R6-033).
            Apple passes stop signing at this instant, and a pass that cannot be signed cannot be issued or updated,
            so **30 days before it a daily job raises `whitelabel.passCertificateExpiring`**: the tenant admin is
            told, and TICVAI operations get an alert. The client renews it in its own Apple account and sends the
            new one here.'
        listing:
          type: object
          description: The store listing.
          properties:
            appName:
              $ref: '#/components/schemas/LocalisedText'
            subtitle:
              $ref: '#/components/schemas/LocalisedText'
            description:
              $ref: '#/components/schemas/LocalisedText'
            keywords:
              $ref: '#/components/schemas/LocalisedText'
            category:
              type: string
            supportUrl:
              type: string
              format: uri
            privacyPolicyUrl:
              type: string
              format: uri
            screenshotAssetRefs:
              type: array
              items:
                type: string
                format: uuid
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005). Written at `tenant` scope.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
