      x-ticvai-read-routing: replica
      summary: One app build, with its package and store status
      tags:
      - appPublishing
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The build
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppBuild'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /content-blocks/{blockId}:
    patch:
      operationId: updateContentBlock
      x-ticvai-consumed-by:
        - "P13 CMS-007 Page Builder"
      summary: Change a draft content block
      description: |-
        **Added 4 October 2026 (CHG-FXC-011; CMS-007).** Changes a block's `body`, `localeVariants`, `position`,
        `publishAt`, `expireAt` or `audienceSegmentId`. A published block is not edited in place: it is refused with 409
        (`content-block-published`) and changed by creating a new draft and publishing it, so what a guest saw stays on
        record.
      tags:
      - whiteLabel
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      - name: blockId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                body:
                  type: object
                  additionalProperties: true
                  description: As `ContentBlock.body`.
                localeVariants:
                  type: object
                  additionalProperties: true
                  description: As `ContentBlock.localeVariants`.
                position:
                  type: integer
                publishAt:
                  type: string
                  format: date-time
                  nullable: true
                expireAt:
                  type: string
                  format: date-time
                  nullable: true
                audienceSegmentId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentBlock'
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '409':
          description: The block is published (`content-block-published`).
          x-ticvai-problem-types:
          - content-block-published
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
components:
  schemas:
    WhiteLabelStorefrontSessionBatch:
      type: object
      x-ticvai-persistence: none — request only; published as storefront.sessionEvent through platform.outbox
      description: 'One beacon from the storefront or guest-app runtime (8.3.40; decided 29 September, build pass, group
        G2). **Closed shape** (`additionalProperties: false`): hashes, route families, product ids and counts only.'
      additionalProperties: false
      required:
      - batchId
      - sessionRef
      - surface
      - sessionStartedAt
      - interactions
      properties:
        batchId:
          type: string
          format: uuid
          description: UUIDv7 minted by the runtime; a retried beacon repeats it.
        sessionRef:
          type: string
          maxLength: 128
          description: The runtime's own session id, SHA-256 hashed in the browser; hashed again with the tenant key
            on arrival and published as `storefront.sessionEvent.sessionRef`. The checkout passes the same value to
            `ai.scoreTransactionRisk`.
        deviceIdHash:
          type: string
          maxLength: 128
          nullable: true
        surface:
          type: string
          enum:
          - guestWeb
          - guestApp
        venueId:
          type: string
          format: uuid
          nullable: true
        sessionStartedAt:
          type: string
          format: date-time
        interactions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - at
            properties:
              kind:
                type: string
                enum:
                - pageView
                - productView
                - seatMapOpened
                - addToCart
                - removeFromCart
                - checkoutStarted
                - paymentPageViewed
                - promoCodeTried
                - search
              pageKind:
                type: string
                nullable: true
                enum:
                - home
                - product
                - seatMap
                - cart
                - checkout
                - account
                - content
                - null
              productId:
                type: string
                format: uuid
                nullable: true
              at:
                type: string
                format: date-time
              dwellMs:
                type: integer
                minimum: 0
                nullable: true
        automationHints:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            webdriver:
              type: boolean
            headless:
              type: boolean
            pointerEvents:
              type: integer
              minimum: 0
            interactionsPerMinute:
              type: number
              minimum: 0
    StorefrontAnalyticsProvider:
      type: object
      x-ticvai-persistence: whitelabel.analytics_provider
      # One row per venue (or tenant-wide) and provider (R8 blocker IDENTITY-C09, CHG-R8STO-001).
      x-ticvai-unique-together:
      - [venueId, provider]
      x-ticvai-unique-nulls: not-distinct
      description: '**One analytics platform the storefront or app reports to** (22.10.29, 29 September build). Venue
        configuration: a null `venueId` is the tenant-wide default a venue''s own row replaces. One row per `venueId`
        and `provider`.'
      required:
      - provider
      - measurementId
      - surfaces
      - consentCategory
      - isEnabled
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venueId:
          type: string
          format: uuid
          nullable: true
        provider:
          type: string
          enum:
          - googleAnalytics4
          - googleTagManager
          - adobeAnalytics
          - metaPixel
          - matomo
          - other
        providerLabel:
          type: string
          maxLength: 100
          nullable: true
          description: The name, when `provider` is `other`.
        measurementId:
          type: string
          maxLength: 100
          description: 'What the tag or SDK reports to. Format by provider (proposed, client to confirm): googleAnalytics4
            `^G-[A-Z0-9]{6,12}$`, googleTagManager `^GTM-[A-Z0-9]{4,8}$`, metaPixel `^[0-9]{10,20}$`; adobeAnalytics,
            matomo and other length only. A mismatch is 422 `measurement-id-invalid` on `setAnalyticsProvider`.'
        surfaces:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - guestWeb
            - guestApp
        consentCategory:
          type: string
          enum:
          - functional
          - analytics
          - personalisation
          - marketing
          default: analytics
          description: The cookie category the visitor must grant before this provider loads (marketing-crm `CookieCategory`).
        isEnabled:
          type: boolean
          default: true
        reportingPropertyId:
          type: string
          maxLength: 100
          nullable: true
          description: The property `getStorefrontInsights` asks the reporting API about (a GA4 property id). Staff only.
        reportingCredentialRef:
          x-ticvai-secret: vault-reference
          type: string
          maxLength: 200
          nullable: true
          writeOnly: true
          description: The vault reference of the reporting credential. Accepted, never returned.
        hasReportingCredential:
          type: boolean
          readOnly: true
          description: Whether a reporting credential is held, since the reference itself is never returned.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005).'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    StorefrontPageInsights:
      type: object
      x-ticvai-persistence: none — read through from the connected analytics platform's reporting API at request time
      description: Page performance, engagement, conversion and visitor behaviour for a period (22.10.29).
      required:
      - from
      - to
      - provider
      - totals
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        provider:
          type: string
        asOf:
          type: string
          format: date-time
          description: When the platform last processed the data it answered with.
        totals:
          type: object
          properties:
            sessions:
              type: integer
            users:
              type: integer
            newUsers:
              type: integer
            pageViews:
              type: integer
            averageEngagementSeconds:
              type: number
            bounceRate:
              type: number
              description: 0 to 1.
            conversions:
              type: integer
            conversionRate:
              type: number
              description: Conversions per session, 0 to 1.
        topPages:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              title:
                type: string
                nullable: true
              pageViews:
                type: integer
              averageEngagementSeconds:
                type: number
              exitRate:
                type: number
              conversions:
                type: integer
        bySource:
          type: array
          description: Visitor behaviour by where they came from.
          items:
            type: object
            properties:
              source:
                type: string
              medium:
                type: string
                nullable: true
              sessions:
                type: integer
              conversions:
                type: integer
        byDevice:
          type: array
          items:
            type: object
            properties:
              deviceCategory:
                type: string
                enum:
                - desktop
                - mobile
                - tablet
                - app
              sessions:
                type: integer
              conversions:
                type: integer
    GuidedChoiceStatus:
      type: string
      description: '**Draft until a person publishes it (decided 29 September, rev 3 REV3-11).** Guests
        see only a `published` choice. An AI-proposed choice arrives as `draft` and is never published
        by the system. Moves as `states/guided-choice.yaml` says: `publishGuidedChoice` and `unpublishGuidedChoice`,
        and a publish returns the venue''s previously published choice to `draft`.

        '
      enum:
      - draft
      - published
      default: draft
    GuidedChoiceTarget:
      x-ticvai-persistence: none — embedded
      type: object
      description: '**What an answer opens (decided 29 September, rev 3 REV3-11).** A product (its kind
        picks the booking flow), a product category (its tickets, as `ticketCategories` shows them), an
        event, or a module such as `membership`. Each id must belong to the choice''s venue and be on sale
        or enabled when the choice is published, or `publishGuidedChoice` refuses it.

        '
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - product
          - productCategory
          - event
          - module
          - bookingFlow
        productId:
          type: string
          format: uuid
          nullable: true
          description: Required when `kind` is `product`. A catalogue `Product`.
        productCategoryId:
          type: string
          format: uuid
          nullable: true
          description: Required when `kind` is `productCategory`. A catalogue `ProductCategory`.
        eventId:
          type: string
          format: uuid
          nullable: true
          description: Required when `kind` is `event`.
        moduleKey:
          allOf:
          - $ref: '#/components/schemas/ModuleKey'
          nullable: true
          description: Required when `kind` is `module`. The module must be enabled.
        bookingFlowId:
          type: string
          format: uuid
          nullable: true
          description: Required when `kind` is `bookingFlow` (decided 29 September, W12; BUILD-YOUR-EXPERIENCE
            "each answer points to one booking flow"). One of the venue's enabled `BookingFlow`s.
    GuidedChoicePreviewRequest:
      x-ticvai-persistence: none — request only
      type: object
      description: 'What `previewGuidedChoice` takes: a draft set-up''s behaviour and questions, in
        `GuidedChoice`''s shape, saved or not (r8, WHITE-C26).'
      required: [behaviour, questions]
      properties:
        behaviour:
          type: string
          enum: [filter, recommend]
        questions:
          type: array
          minItems: 1
          maxItems: 4
          description: Same shape and bounds as `GuidedChoice.questions`.
          items:
            type: object
    GuidedChoicePreview:
      x-ticvai-persistence: none — computed on read
      type: object
      description: 'One row per combination of answers a guest can give (at most the product of the questions''
        answer counts, four questions of a few answers each), in question order (r8, WHITE-C26).'
      required: [combinations]
      properties:
        combinations:
          type: array
          items:
            type: object
            required: [answerKeys, productsLeft]
            properties:
              answerKeys:
                type: array
                items: { type: string }
                description: The answer picked on each question, in order.
              productsLeft:
                type: integer
                minimum: 0
                description: The venue's products the combination leaves (filter behaviour); 0 is the case to fix.
              sampleProductIds:
                type: array
                maxItems: 3
                items: { type: string, format: uuid }
              target:
                type: object
                nullable: true
                additionalProperties: true
                description: The result the combination ends on (recommend behaviour), as the last answer's `target`.
    GuidedChoice:
      x-ticvai-persistence: whitelabel.guided_choice + whitelabel.guided_choice_question + whitelabel.guided_choice_answer
      type: object
      description: '**Help me choose (decided 29 September, rev 3 REV3-11).** A venue''s short set of
        questions that ends on a result card opening the booking flow, product, category or event that
        fits. Each question has a few answers with a title, a one-line body, an icon and an optional badge;
        **the answer the guest picks on the last question decides the result**, and each earlier answer
        carries a target too, so a one-question setting still ends on a result. Venue configuration, never
        hard-coded: set up in Venue Management, off unless the venue publishes one.

        **Two sources, one review.** `manual` is written by staff; `aiSuggested` is proposed by the `ai`
        service from the venue''s uploaded products (a suggestion, reviewed and published by a person,
        never auto-published). Both arrive as `draft`.

        **Help me choose filters the catalogue (decided 29 September, W4).** With `behaviour` `filter`, the
        default, each answer''s `filter` narrows the products the guest sees (web, mobile and kiosk alike,
        through catalogue `listProducts` and `searchCatalogue` `guidedAnswerIds`), with a "Show everything"
        link; `recommend` keeps the rev 3 result card from the last answer''s `target`. **It is never a consent
        step**: an answer may pre-fill a REV3-26 consent question (`consentPrefill`), which the guest still
        confirms, so the question is not asked twice and the consent stays explicit.

        '
      required:
      - id
      - venueId
      - name
      - mode
      - questions
      - status
      - source
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: UUIDv7.
        venueId:
          x-ticvai-references: platform.scope
          type: string
          format: uuid
          readOnly: true
          description: From the path of `createGuidedChoice`.
        name:
          type: string
          maxLength: 80
          description: Staff-facing name, e.g. "Water park day planner". Not shown to guests.
        mode:
          type: string
          enum:
          - button
          - popupOnArrival
          - 'off'
          default: button
          description: '**How the guest reaches it (rev 3 REV3-11).** `button` puts a Help me choose button
            on the booking page; `popupOnArrival` also opens it once on the guest''s first arrival at the
            booking page (whether it was seen is kept on the device only); `off` keeps a published choice
            configured but not shown.

            '
        showBanner:
          type: boolean
          default: true
          description: The dark banner under the products ("Choose from the experiences above or let us
            help you decide") with a Help me choose button. Ignored when `mode` is `off`.
        behaviour:
          type: string
          enum:
          - filter
          - recommend
          default: filter
          description: '**`filter` (default) narrows the list; `recommend` ends on one result card (decided
            29 September, W4).** With `filter`, every answer needs a `filter` and `target` is optional; with
            `recommend`, every answer on the last question needs a `target`. `publishGuidedChoice` refuses
            the other case with 422.

            '
        showEverything:
          type: boolean
          default: true
          description: The "Show everything" link under a filtered list, which clears the answers (W4).
        questions:
          type: array
          minItems: 1
          maxItems: 4
          description: '**One to four questions** (decided 29 September, W4: the Deep Dive reference asks
            three or four; rev 3 REV3-11 allowed two). Shown in `sortOrder`.

            '
          items:
            type: object
            required:
            - title
            - sortOrder
            - answers
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
                description: UUIDv7. The row's own key.
              title:
                $ref: '#/components/schemas/LocalisedText'
              kind:
                type: string
                enum:
                - choice
                - yesNo
                - age
                - level
                - certification
                default: choice
                description: '**What the question asks (decided 29 September, W4).** `choice` free answers;
                  `yesNo` two answers (e.g. "Can everyone swim?"); `age` answers carrying an age range; `level`
                  answers carrying a level tag; `certification` answers saying whether the guest holds a certificate
                  (e.g. a diving licence). The kind decides which `filter` fields its answers use.

                  '
              sortOrder:
                type: integer
                minimum: 0
              answers:
                type: array
                minItems: 2
                maxItems: 4
                description: Two to four answers; the prototype shows three (proposed, client to correct,
                  rev 3 REV3-11).
                items:
                  type: object
                  required:
                  - title
                  - sortOrder
                  properties:
                    id:
                      type: string
                      format: uuid
                      readOnly: true
                      description: UUIDv7. The row's own key.
                    title:
                      $ref: '#/components/schemas/LocalisedText'
                    body:
                      allOf:
                      - $ref: '#/components/schemas/LocalisedText'
                      description: The one-liner under the title, at most 140 characters in each language.
                    icon:
                      type: string
                      maxLength: 40
                      nullable: true
                      description: An icon name from the guest app's icon set.
                    badge:
                      allOf:
                      - $ref: '#/components/schemas/LocalisedText'
                      nullable: true
                      description: Optional, e.g. "Best value". At most 24 characters in each language.
                    sortOrder:
                      type: integer
                      minimum: 0
                    target:
                      allOf:
                      - $ref: '#/components/schemas/GuidedChoiceTarget'
                      nullable: true
                      description: Required with `behaviour` `recommend` on the last question; optional with
                        `filter`, where it is the card shown above the filtered list.
                    filter:
                      type: object
                      nullable: true
                      description: '**What this answer keeps in the list (decided 29 September, W4).** Every
                        field set must hold; answers to different questions are combined with AND. Required with
                        `behaviour` `filter`. The server applies it (catalogue `guidedAnswerIds`), so web, mobile
                        and kiosk show the same list.

                        '
                      properties:
                        productIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                        productCategoryIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                        segmentTags:
                          type: array
                          description: Catalogue `Product.segmentTags`, e.g. a level tag.
                          items:
                            type: string
                        minAgeYears:
                          type: integer
                          minimum: 0
                          nullable: true
                        maxAgeYears:
                          type: integer
                          minimum: 0
                          nullable: true
                          description: With `minAgeYears`, checked against each product's age rule (catalogue
                            `ProductEligibilityRule`).
                        requiresSwimmer:
                          type: boolean
                          nullable: true
                          description: False hides products whose eligibility needs a swimmer; true keeps only
                            those.
                        certificationCode:
                          type: string
                          nullable: true
                          maxLength: 40
                          description: Keeps products that need this certificate, or with `holdsCertification`
                            false, hides them.
                        holdsCertification:
                          type: boolean
                          nullable: true
                    consentPrefill:
                      type: object
                      nullable: true
                      description: '**Pre-fills a REV3-26 consent question from this answer (decided 29 September,
                        W4).** The guest still ticks it at the consent step; nothing is recorded as consent until
                        they do.

                        '
                      required:
                      - consentQuestionId
                      - answer
                      properties:
                        consentQuestionId:
                          type: string
                          format: uuid
                        answer:
                          type: boolean
                    result:
                      type: object
                      nullable: true
                      description: The result card when this answer decides the result. Absent fields
                        fall back to the target's own name, summary and image.
                      properties:
                        title:
                          $ref: '#/components/schemas/LocalisedText'
                        body:
                          $ref: '#/components/schemas/LocalisedText'
                        imageAssetRef:
                          type: string
                          format: uuid
                          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/GuidedChoiceStatus'
          readOnly: true
        source:
          type: string
          enum:
          - manual
          - aiSuggested
          readOnly: true
          description: '`manual` when staff created it; `aiSuggested` when the `ai` service proposed it
            (a service caller). Kept after a person edits a suggestion, so a report can say how many AI
            proposals were published.'
        suggestionRef:
          type: string
          nullable: true
          readOnly: true
          description: For `aiSuggested`, the id of the `ai` job that proposed it. Null for `manual`.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        publishedBy:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The person who published it. Never a service.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    BookingFlowTypeKey:
      type: string
      description: '**The flow types the system catalogue offers (decided 29 September, W12; impact.md b).**
        `seatedFixedPerformance` and `seatedDateTimeSeatMap` are the two seated flows; `cabanaMap` is the one cabana flow
        (W6; `cabanaBySize` was removed in r8: a guest books a cabana from the map only, lead decision of 20
        October 2026); `experienceWorkshop` puts the product before the date (W8); `multiLocation`
        opens on the location switcher.

        '
      enum:
      - datedDayPass
      - timedEntry
      - openDated
      - seatedFixedPerformance
      - seatedDateTimeSeatMap
      - experienceWorkshop
      - surfSession
      - meetingRoomHourly
      - cabanaMap
      - guidedTourByLanguage
      - transport
      - tableReservation
      - membership
      - giftCard
      - multiLocation
    KioskPlacementKind:
      type: string
      description: '**Where a kiosk group''s kiosks stand** (decided 5 October 2026 by Chinmay, CHG-R4-001: kiosk
        groups by gate, zone or outlet). `accessPoint` is a gate (access `AccessPoint`), `operatingArea` a zone of the
        venue (tenancy), `outlet` an outlet (tenancy `Outlet`); `venue` is the venue''s default configuration, which
        every kiosk in no group takes, and names no place.'
      enum:
      - venue
      - accessPoint
      - operatingArea
      - outlet
    KioskFunction:
      type: string
      description: '**What a kiosk offers on its start screen** (decided 5 October 2026 by Chinmay, CHG-R4-001). Each
        opens an existing kiosk screen: `sellTickets` KSK-003, `collectReservation` KSK-011 (collect a booking),
        `orderFood` KSK-016, `shop` KSK-017, `membership` and `walletTopUp` the guest app''s membership and wallet
        screens drawn for the kiosk, `map` the venue map, `assistant` KSK-015. A function whose module the tenant has not
        enabled cannot be switched on (the tile is refused at publish, `tileWithoutProducts`).'
      enum:
      - sellTickets
      - collectReservation
      - orderFood
      - shop
      - membership
      - walletTopUp
      - map
      - assistant
    BookingFlowStepKey:
      type: string
      description: 'Every step a guest booking flow can hold (decided 29 September, W12). What each step does
        on WEB and MOB, and which screen draws it, is in the screen definitions of P01 and P02; which types
        carry which steps is `x-ticvai-system-catalogue` on `BookingFlowType`. `payment` is always last. Sign-in
        is not a step: it is asked where the flow''s `signInAt` says.

        '
      enum:
      - location
      - helpMeChoose
      - product
      - date
      - time
      - performance
      - level
      - language
      - duration
      - route
      - partySize
      - resourceMap
      - resourceSize
      - seatMap
      - tickets
      - attendees
      - membershipPlan
      - giftCardValue
      - recipient
      - consent
      - extras
      - review
      - payment
    BookingFlowType:
      x-ticvai-persistence: none — system catalogue, shipped with the service and the same for every tenant
      type: object
      description: '**A flow type from the system catalogue (decided 29 September, W12).** Read-only: a venue
        picks one (`createBookingFlowDefinition`) and orders its steps within `orderConstraints`. `requirement`
        is `required` (cannot be turned off), `optional` (the venue chooses) or `conditional` (shown to a guest
        only when `condition` holds; the venue may still turn it off where it is not also required by law or
