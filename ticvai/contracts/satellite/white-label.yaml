      description: '**Every guest booking-flow setting, once.** `BookingFlowConfig` is these at tenant level
        plus `venueOverrides`; a `BookingFlowVenueOverride` carries any subset of them for one venue
        (decided 29 September, rev 3 CFG-11). The Rev 3 settings (`timesPerPage` onwards) are the options
        the client''s rev 3 prototype shows under Config → Booking rules and Build your experience.

        **Venue-wide only (decided 29 September, W12).** The settings that belong to one flow moved to
        `BookingFlowLevelSettings` on each `BookingFlow`; `categoryDisplay` was removed (W7).

        '
      properties:
        preset:
          type: string
          enum:
          - auto
          - ticketBox
          - playCentre
          - venueSite
          - marketplace
          - singleEvent
          - season
          - custom
          default: auto
          description: L1 Ticket box … L6 Season. `auto` picks by venue type; `custom` applies none. The
            UI preset of the prototype's drawer (rev 3 CFG-1, no change).
        stepIndicator:
          type: string
          enum:
          - bar
          - numbered
          - dots
          - segmented
          - breadcrumb
          - pills
          - ticks
          - none
          default: bar
        cartLayout:
          type: string
          enum:
          - sidebarRight
          - sidebarLeft
          - slideInRight
          - slideUpBottom
          - singleColumn
          - floatingIcon
          default: sidebarRight
          description: '`floatingIcon` is a round basket button with the item count that opens the cart
            (decided 29 September, rev 3 REV3-10). Which side a sidebar or the icon sits on in a right-to-left
            language is `cartSideInRtl`.'
        cartSideInRtl:
          type: string
          enum:
          - keepRight
          - mirror
          default: keepRight
          description: '**The cart side when the guest reads Arabic or another right-to-left language
            (decided 29 September, rev 3 REV3-10).** `keepRight` keeps the cart (and the floating icon) on
            the right, as the client confirmed; `mirror` flips it to the left with the rest of the layout.

            '
        cardLayout:
          type: string
          enum:
          - stackedRows
          - splitRows
          - cardsAcross
          - posterCards
          default: stackedRows
          description: How ticket and product cards are laid out (decided 29 September, rev 3 DG-6). Was
            a free string; the four values are the design's Stacked rows, Split rows, Cards across and Poster
            cards.
        cardSize:
          type: string
          enum:
          - compact
          - standard
          - large
          - extraLarge
          default: compact
          description: Labels Compact, Standard, Large, Extra large (decided 29 September, rev 3 DG-6).
            `standard` replaces `regular`.
        seatPicker:
          type: string
          enum:
          - bowl
          - zonesThenSeats
          - zonesOnly
          - seatsOnly
          default: bowl
          description: Default `bowl`, as the prototype has it (decided 29 September, rev 3 CFG-6). Read
            only for a seated event.
        mapView:
          type: string
          enum:
          - 2d
          - 3d
          default: 3d
        density:
          type: string
          enum:
          - compact
          - standard
          - roomy
          default: compact
          description: Labels Compact, Standard, Roomy, default Compact as the design has it (decided 29
            September, rev 3 DG-6). `standard` and `roomy` replace `comfortable` and `airy`.
        embedMode:
          type: string
          enum:
          - fullPage
          - embedded
          default: fullPage
          description: '`embedded` hides the hero banner, event page and venue header, for a flow placed inside
            the venue''s own site.'
        heroBanner:
          type: boolean
          default: true
        searchInBanner:
          type: boolean
          default: false
          description: Off by default, as the prototype has it (decided 29 September, rev 3 CFG-6).
        eventBannerDates:
          type: boolean
          default: false
          description: '**Dates in event banner (decided 29 September, rev 3 23SEP-19).** On, the event
            banner lists the next dates; off by default. Either way the date picker sits at the top of the
            booking step.

            '
        singleEventPage:
          type: boolean
          default: false
        quantitiesOnAddOns:
          type: boolean
          default: true
        timesPerPage:
          type: string
          enum:
          - '8'
          - '12'
          - '24'
          - all
          default: '24'
          description: '**Times per page (decided 29 September, rev 3 REV3-1).** When an event has more
            performances on the chosen day than fit, WEB-006 and GST-007 show them as compact tiles paged
            this many at a time with Earlier and Later; `all` shows every one. A string because `all` is
            one of the values.

            '
        dayPartFilter:
          type: boolean
          default: true
          description: '**Morning, afternoon and evening chips with counts above the times (decided 29
            September, rev 3 REV3-1).** Where each part begins is `dayPartBoundaries`.

            '
        dayPartBoundaries:
          type: object
          description: '**Where the day parts divide, in the venue''s time zone (decided 29 September, rev
            3 REV3-1).** Morning is before `afternoonStartsAt`, afternoon runs to `eveningStartsAt`, evening
            is from `eveningStartsAt`. A venue sets its own through `venueOverrides`. `afternoonStartsAt`
            must be earlier than `eveningStartsAt`, or 400.

            '
          properties:
            afternoonStartsAt:
              type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              default: '12:00'
            eveningStartsAt:
              type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              default: '17:00'
        seatViewPosition:
          type: string
          enum:
          - bottom
          - right
          - left
          - top
          default: bottom
          description: '**Where the view-from-your-seat box sits around the seat map (decided 29 September,
            rev 3 REV3-5).** Web only; on mobile and on a narrow screen it is always below the map.

            '
        seatTimeBar:
          type: boolean
          default: true
          description: '**Time bar above the seat map (decided 29 September, rev 3 REV3-6).** Shows the
            chosen performance and lets the guest switch performance or change the date; switching releases
            the seats held for the previous one.

            '
        ticketCategories:
          type: string
          enum:
          - categoryThenSubcategory
          - flatList
          default: categoryThenSubcategory
          description: '**How tickets are grouped (decided 29 September, rev 3 REV3-16).** `categoryThenSubcategory`
            shows the venue''s top product categories as tiles, then the tickets in the chosen one;
            `flatList` lists every ticket at once.

            '
        ticketTags:
          type: boolean
          default: true
          description: '**Tags on tickets (decided 29 September, rev 3 23SEP-3).** Shows a product''s
            display tags (such as "2 Hours", "Min 1.10 m", "Valid 90 days") on its card.

            '
        cardInfo:
          type: boolean
          default: true
          description: '**Extra info on cards (decided 29 September, rev 3 23SEP-6).** Shows each ticket
            type''s description, who it is for and what it includes, under its name.

            '
        conciergeMascot:
          type: boolean
          default: true
          description: '**The concierge as mascot art or a plain button (decided 29 September, rev 3 CFG-5).**
            Read only where the `aiConciergeChat` feature is on.

            '
        showInfoOnly:
          type: boolean
          default: true
          description: '**Show info-only products (decided 29 September, rev 3 REV3-14).** On, a product
            with `guestListing` `infoOnly` (catalogue) is listed with its not-bookable label and opens its
            details; off, guests are not shown it.

            '
        locationSwitcher:
          type: boolean
          default: false
          description: '**Location switcher (decided 29 September, rev 3 REV3-18).** On, the booking screens
            carry a "Booking at" bar with Change location, reusing the guest''s venue choice (audit R267).
            Off unless the tenant or venue enables it; it has no effect for a tenant with one venue.

            '
        guestContactFields:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          default:
          - email
          items:
            type: string
            enum:
            - email
            - mobile
            - name
          description: '**What the guest-checkout pop-up asks, and nothing else (decided 29 September, W1).**
            The prototype''s Email only, + name and + mobile. Must include the contact the guest''s code is sent
            to and matched on (identity `GuestMatchPolicy.matchBy`), or 400. After the code is verified the
            guest is not asked for these again: the flow goes to the terms and payment, and the profile is
            completed later (WEB-020, GST-039). Read only where the `guestCheckout` feature is on.

            '
        dateStripDays:
          type: integer
          minimum: 3
          maximum: 31
          default: 7
          description: '**The date strip (decided 17 September, M17-08).** How many days from today the date
            step shows as a strip before the calendar icon that opens the full month; later dates are picked
            from the calendar.

            '
