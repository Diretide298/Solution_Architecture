    table: whitelabel.content_block
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The whitelabel.content_block rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as WhiteLabel stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/ContentBlock'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). WhiteLabel answers with its whitelabel.content_block rows, as it stores them and as the caller's
      scope lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within operations, through the C# query interface WhiteLabel implements, and asked from another
      deployable through WhiteLabel's service route (serviceAuth). Moved from platform-ops with the table (R8 blocker
