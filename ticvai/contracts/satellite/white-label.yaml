        `setTenantDomainMapping` for this hostname; when it was the primary custom domain, the control plane''s
        consumer promotes the platform subdomain, so no second call is made here.

        **A live app is an app with a published configuration (decided 28 September, audit R096)**: the
        tenant has a current `ConfigVersion` (`TenantAppStatus.isPublished` true) for the app the domain
        serves. Maintenance mode does not make an app less live.


        **Detaching unroutes the hostname** (SD-021, applied 30 September): the release calls tenancy
        `setTenantDomainMapping` with status `detached`, so the edge stops routing the host to this
        tenant in the same step; the row is kept for the audit trail, not deleted.

        **The takeover warning** (CHG-CSA-043): the confirmation tells the tenant to remove the CNAME (and the TXT
