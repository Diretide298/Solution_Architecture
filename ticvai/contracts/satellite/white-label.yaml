    FooterConfig:
      type: object
      x-ticvai-persistence: whitelabel.footer_config + whitelabel.footer_config_column + whitelabel.footer_config_social_link
      description: 'BL-002. **`setHeader` and `HeaderConfig` exist and the footer does not**, which looked
        like symmetry until you notice it is not: **a header is chrome and a footer is a link surface.**

        A footer carries the legal links — terms, privacy, accessibility statement, cookie preferences
        — and **those are the ones a regulator checks.** Treating it as a mirror of the header would have
        given it a logo and no way to reach a privacy notice.

        **Where it is stored.** `legalLinks` and `copyrightText` are columns of `whitelabel.footer_config`;
        each entry of `columns` is a `whitelabel.footer_config_column` row and each entry of `socialLinks`
        a `whitelabel.footer_config_social_link` row. Part of the working draft (see the header). **In
        the tenant''s own database, not the control plane (decided 28 September, audit R163)**: it moved
        from `control.footer_config` (renamed `whitelabel.footer_config`) and its two child tables.

        **Links and order** (R8 blocker WHITE-C24 and IDENTITY-C60): a column''s `links` are stored with the
        column, as one jsonb value in their array order; each column and each social link keeps its
        `sortOrder`, which `setFooter` writes from its position in the array (0 first), and every read returns
        `columns` and `socialLinks` ordered by it.

        '
      required:
      - id
      - scopePath
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005), written at `tenant` scope by the server.
        columns:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
              sortOrder:
                type: integer
                readOnly: true
                description: The column's position, written by `setFooter` from the array order (R8 blocker IDENTITY-C60).
              links:
                type: array
                x-ticvai-persistence-column: jsonb
                x-ticvai-persistence-kind: valueObject
                description: The column's links in display order, stored on the column row as one value (R8 blocker
                  WHITE-C24).
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    url:
                      type: string
                    opensCookiePreferences:
                      type: boolean
                      default: false
        legalLinks:
          type: object
          description: '**Required links, held separately from the free-form columns** — a tenant reorganising
            their footer must not be able to remove the privacy notice by accident.

            '
          properties:
            termsUrl:
              type: string
            privacyUrl:
              type: string
            accessibilityUrl:
              type: string
              nullable: true
            cookiePolicyUrl:
              type: string
              nullable: true
        copyrightText:
          type: string
        socialLinks:
          type: array
          items:
            type: object
            properties:
              platform:
                type: string
              url:
                type: string
              sortOrder:
                type: integer
                readOnly: true
                description: The link's position, written by `setFooter` from the array order (R8 blocker IDENTITY-C60).
    AccessibilitySettings:
      type: object
      description: 'BL-065, 2.1.27. **POS and kiosk accessibility, which is a legal obligation in most
        jurisdictions and was unstated.**

        **A kiosk is the hard case.** A guest with low vision using a website brings their own assistive
        technology; a guest at a kiosk gets whatever the kiosk offers, so the settings have to be on the
        device rather than in the browser.

        '
      properties:
        largeTextAvailable:
          type: boolean
          default: true
        highContrastAvailable:
          type: boolean
          default: true
        simplifiedNavigationAvailable:
          type: boolean
          default: true
        screenReaderSupported:
          type: boolean
          default: true
        reachableHeightModeAvailable:
          type: boolean
          default: false
          description: '**Moves the interface to the lower half of the screen** for a guest using a wheelchair.
            A kiosk mounted at standing height is unusable otherwise, and no software setting fixes the
            mounting — this is the mitigation.

            '
        sessionTimeoutMultiplier:
          type: number
          default: 1
          description: '**Timeouts are an accessibility barrier nobody counts.** A guest who needs three
            times as long to read a screen should not lose their basket to a 90-second inactivity timer.

            '
    ContentBlock:
      type: object
      # Tenant-authored content lives in the tenant database, owned by WhiteLabel (R8 blocker IDENTITY-C59, the lead's
      # answer of 20 October 2026; as the footer moved in R163). It was control.content_block.
      x-ticvai-persistence: whitelabel.content_block
      description: 'BL-172. **`white-label` is excellent as a configuration model and is not an authoring
        surface.** `HomepageLayout` with ordered sections, `Banner`, `PromoBlock` and `ContentPage` describe
        what a venue has chosen; **none of them lets a marketer write something new without a developer.**

        A block is a piece of authored content with a type, a body and a schedule. **The page builder
        is a frontend over this**, the same way the venue map''s canvas is a frontend over its graph.

        '
      required:
      - id
      - kind
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pageId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - richText
          - image
          - video
          - gallery
          - cta
          - faq
          - form
          - embed
          - productGrid
          - countdown
          - testimonial
        position:
          type: integer
        body:
          type: object
          additionalProperties: true
          description: 'Typed by `kind`, and validated against the block''s own schema at save. **The text a
            translation may fill** (R8 blocker FOUNDATION-AI-C40; the keys a body of each kind uses for its words, and
            the `fieldPath` a translation draft names, under `localeVariants.<locale>.`): richText `text`; image
            `altText`, `caption`; video `title`, `caption`; gallery `items[].altText`, `items[].caption`; cta
            `heading`, `text`, `label`; faq `items[].question`, `items[].answer`; form `title`, `fields[].label`,
            `submitLabel`; embed `title`; productGrid `heading`; countdown `heading`, `endedText`; testimonial
            `quote`, `author`. Every other key (links, ids, numbers, media references) is not translated.'
        localeVariants:
          type: object
          additionalProperties: true
          description: '**Per-locale bodies, not per-locale pages.** A venue running Arabic and English
            should not maintain two page trees that drift — the structure is shared and the words are
            not.

            '
        status:
          type: string
          readOnly: true
          description: Created as `draft`; moved by `publishContentBlock` and the `publishAt`/`expireAt`
            timer (`states/content-block.yaml`), never by the body of a create.
          enum:
          - draft
          - scheduled
          - published
          - expired
          - archived
        publishAt:
          type: string
          format: date-time
          nullable: true
          description: '**Content scheduling, which the configuration model had no room for.** A seasonal
            banner that needs somebody awake at midnight is the same defect `Product.onSaleFrom` fixed.

            '
        expireAt:
          type: string
          format: date-time
          nullable: true
        audienceSegmentId:
          type: string
          format: uuid
          nullable: true
          description: '**Personalisation, evaluated at render.** A block shown only to members, or only
            to first-time visitors. Null shows it to everybody, which is what every block does today.

            '
        approvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        reviewStatus:
          type: string
          readOnly: true
          enum:
          - notRequired
          - pending
          - approved
          - rejected
          default: notRequired
          description: The review step of `publishContentBlock`, where the tenant's publish-review policy is on (r8 walk
            of ticket 27919). `pending` from the 202 until the approval is decided; `status` does not change meanwhile.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
