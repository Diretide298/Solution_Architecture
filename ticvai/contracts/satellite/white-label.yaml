      x-ticvai-audience:
      - anonymous
      - guest
      - device
      x-ticvai-agreed: '2 October: decided by Chinmay, fix before Block A starts (GFIX-1); the public view of
        getTenantConfig, shaped like getTenantAppStatus'' public view and served like getCookieConsentRuntime'
      x-ticvai-read-routing: replica
      summary: The published guest-facing configuration, before anyone signs in
      description: '**What a first-time visitor''s storefront renders in** (decided 2 October by Chinmay, GFIX-1).
        `getTenantConfig` needs a guest or a staff session, so a visitor with neither could not load the
        tenant''s brand, theme, fonts, header, footer or navigation, and the home page (WEB-001, GST-001), the
        maintenance and sold-out pages (WEB-029, GST-047) and the kiosk (KSK-002) had nothing to style
        themselves with. This is that read with no session at all.


        **The tenant comes from the host, never from the caller.** The request carries no tenant: the edge
        resolves the host it arrived on to a tenant with `tenancy.resolveTenantHost` (SD-021), which is the
        tenant''s verified custom domain or its platform subdomain. The platform subdomain is the tenant slug
        the guest app and kiosk builds are configured with, so all three shells call the same path. An
        unknown host is `404` and never falls through to a default tenant.


        **Published, non-sensitive fields only.** Read from the current published `ConfigVersion` (never the
        working draft) plus the live status `setMaintenanceMode` writes. Left out, because a public and
        cacheable response must not carry them: the draft markers (`isDraft`, `version`, the draft booking
        flows), notification branding (sender addresses), the enabled payment methods (checkout reads what
        the gateway offers), licensing, and every CMS status field `getTenantAppStatus` keeps for staff.
        A module the tenant has not enabled is not listed, so a guest never learns what was not bought.


        **Cacheable.** With no session the answer is the same for every visitor of a host and venue and is
        cached at the edge, invalidated by `publishTenantConfig` and `setMaintenanceMode`; `publishedVersion`
        lets a client keep its copy when nothing changed. A signed-in guest gets the same answer.

