  /tenant-config/publish:
    post:
      operationId: publishTenantConfig
      x-ticvai-consumed-by:
        - "P08 BO-843 Publishing, Analytics & Audit"
        - "P09 ADM-016 White-Label Branding Management"
        - "P13 CMS-014 Publishing Workflow"
        - "P13 CMS-103 Booking Flows"
      x-ticvai-read-via:
      - query: tenancy#activeVenues
        route: service
        for: 'what its text calls "active venues": platform.scope, Tenancy''s data (CHG-RTE-001)'
      x-ticvai-write-via:
      - table: approvals.request
        operation: createApprovalRequest
      x-ticvai-audience:
      - staff
      x-ticvai-config-scope: tenant
      summary: Publish the working draft
      description: 'Validates, snapshots, versions and activates atomically: the draft is copied into
        the new version''s `snapshot`, and that version becomes the one guests read. Guests receive the new configuration
        on next launch — no store release, because runtime configuration is deliberately separated from
        build-time.

        The response names any build-time change in the draft that will **not** reach guests until the
        next release. A tenant who changed their app icon and published should be told plainly that the
        icon has not shipped.

        **Booking flows are published here (decided 29 September, W12).** Each venue''s enabled flows are copied
        into the snapshot with the rest of the draft; `getPublishedBookingFlow` reads them from the current
        version. An invalid enabled flow fails validation (409, `bookingFlowInvalid`).

        **Simulate, then a single publish by the permission holder; review only if the venue switches it on**
        (Chinmay, 2 October, workbook Q156; CHG-CSA-042). The simulate step is `createPreview`. With the tenant''s
        publish-review policy off (the default), a `TENANT_PUBLISH` holder publishes in one step (201). With it on
        (`setPublishReviewPolicy`), the version is validated and snapshotted and an approval request is raised; the
        response is 202 with `reviewStatus` `pending`, and the version becomes current when a reviewer (never the
        author, where the policy says so) approves it.

        **Platform staff publish a hosted tenant''s site** (Chinmay, 2 October, workbook Q144; R098; CHG-CSA-038)
        only under a platform-staff grant naming `TENANT_PUBLISH`, with step-up. A self-hosted tenant publishes first and then
        exports a site package (`exportSitePackage`, which needs a published version); both actions are always
        offered on CMS-014 and there is no hosting flag (r8 walk of ticket 27906; lead decision of 20 October 2026).

        **The server names the version** (ADAM CR-154, 18 October 2026; CHG-CRA-004). In the publish transaction it
        takes the next integer for the tenant (`1`, `2`, ...), as kiosk versions are numbered; that is the
        version''s `version`, and the draft''s `tenant_config.version` becomes the next label. `config_version` is
        unique on (`scope_path`, `version`) and has one current row per tenant (a partial unique index on
        `scope_path` where `is_current`), so a racing publish fails on the index and is retried with the next label.

        **The review path** (CR-154; CHG-CRA-004). The tenant''s publish-review policy decides: off, the version is
        current at once (201) and `whitelabel.contentPublished` goes out in the same transaction; on, this calls
        approvals'' `createApprovalRequest` (`x-ticvai-write-via`; kind `configurationChange`, subject
        `whiteLabelPublication`, `subjectId` the `config_version` id), records its `approvalRequestId` and answers
        202 with `reviewStatus` `pending`. White-label''s consumer of `approval.granted` makes the version current
        (`reviewStatus` `approved`) and then emits `contentPublished`; its consumer of `approval.rejected` sets
        `reviewStatus` `rejected` and the version never becomes current. A scheduled publish emits it when the job
        makes the version current. **The event goes out when a version becomes current, never before.**

        '
      tags:
      - publishing
      x-ticvai-permission: TENANT_PUBLISH
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
                  minLength: 3
                  maxLength: 500
                scheduledFor:
                  type: string
                  format: date-time
                  description: >-
                    Publish at a future time. Useful for a campaign launch. **A scheduled job
                    activates it (decided 28 September, audit R163)**: the version is validated and
                    snapshotted now, recorded with `isCurrent` false, and the job makes it current at
                    `scheduledFor`. It is validated again then; a failure leaves the current version
                    live and is reported on the version (`activationFailedAt`, `activationFailure`).
                    **The job** (R8 blocker IDENTITY-C63) runs in the workers host every minute: it takes the
                    versions whose `scheduledFor` has passed and that are not current and not failed,
                    validates each again and makes it current, which is when `contentPublished` is emitted
                    (CR-154); a version that fails validation keeps `isCurrent` false and records the
                    failure.
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
        '202':
          description: Submitted for review; the venue's publish-review policy is on (CHG-CSA-042). The version is
            snapshotted with `reviewStatus` `pending` and becomes current when approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigVersion'
        '409':
          description: Validation failed. Every finding is listed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfigValidationProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
