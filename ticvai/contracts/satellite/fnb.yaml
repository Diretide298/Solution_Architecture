      tags:
      - fnb
      x-ticvai-permission: INCIDENT_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Escalate a finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
  /food-safety/corrective-actions/{actionId}/close:
    parameters:
    - name: actionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: closeCorrectiveAction
      summary: Close a signed finding
      description: '**The transition that had no operation.** A signed finding stayed signed forever because
        nothing could close it — which for a food-safety corrective action means an inspector reads an
        open list that should be empty.


        **Separate from signing** so the closing party is recorded: signed by the chef, closed by the
        manager who verified it.'
      tags:
      - fnb
      x-ticvai-permission: INCIDENT_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Close a signed finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectiveAction'
components:
  schemas:
    TableReservationStatus:
      type: string
      enum:
      - booked
      - confirmed
      - seated
      - completed
      - cancelled
      - noShow
    SubstitutionRule:
      type: object
      x-ticvai-persistence: fnb.substitution_rule
      description: 'Board 2L, 24 August. **What may replace what, and under what conditions.** A kitchen
        substitutes constantly — a supplier is short, an item is 86''d, a guest asks — and the package
        had no way to say which swaps are allowed.

        **The rule exists so `verifyAllergens` has something to check against.** A substitution with no
        rule behind it is a decision made at the pass by whoever is standing there.

        **`allergenDelta` is the field this table is for.** Swapping butter for margarine removes dairy
        and may add soy — **and a dish still labelled dairy-free after a swap nobody checked is the failure
        this prevents.**

        '
      required:
      - id
      - fromIngredientId
      - toIngredientId
      properties:
        id:
          type: string
          format: uuid
        fromIngredientId:
          type: string
          format: uuid
        toIngredientId:
          type: string
          format: uuid
        ratio:
          type: number
          default: 1
          description: '**Not always one to one.** Fresh herbs to dried is roughly three to one, and a
            rule that assumes parity produces a dish nobody would serve.

            '
        allergensAdded:
          type: array
          items:
            type: string
        allergensRemoved:
          type: array
          items:
            type: string
        conditions:
          type: array
          items:
            type: string
            enum:
            - outOfStock
            - seasonal
            - guestRequest
            - costSaving
            - always
        requiresApproval:
          type: boolean
          default: false
          description: '**True where the swap changes an allergen.** A chef may substitute freely within
            a claim; changing the claim is somebody else''s decision.

            '
        isActive:
          type: boolean
          default: true
    ProductionPlan:
      type: object
      x-ticvai-persistence: fnb.production_plan
      description: 'Board 2M. **Forecast demand against recipes, producing a prep list.** Built from `requestSuggestion(kind=prepPlan)`
        and then edited — **a forecast a chef cannot overrule is a forecast a chef ignores.**

        **A plan is not a production run and the separation is deliberate.** A plan is drafted, argued
        over and edited; releasing it creates the runs. **A plan that creates runs as it is drafted creates
        runs nobody asked for.**

        '
      required:
      - id
      - forDate
      - status
      - lines
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        forDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - draft
          - released
          - superseded
          - cancelled
        basedOnSuggestionId:
          type: string
          format: uuid
          nullable: true
          description: '**The forecast it started from.** Kept so plan-against-forecast can be compared
            later — which is the label `recordSuggestionOutcome` needs.

            '
        lines:
          type: array
          items:
            type: object
            required:
            - itemId
            - plannedQuantity
            properties:
              itemId:
                type: string
                format: uuid
              suggestedQuantity:
                type: number
                nullable: true
              plannedQuantity:
                type: number
              uom:
                type: string
              stationId:
                type: string
                format: uuid
                nullable: true
        releasedRunIds:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
    Combo:
      type: object
      x-ticvai-persistence: fnb.combo
      description: 'Board 2G, 24 August. **A meal deal is one product with slots, not a bundle of products.**
        `listCatalogueBundles` bundles ticketing products — a ticket and a parking pass, both fixed —
        and **a burger with a choice of side and a choice of drink is a different shape entirely.**

        **The price is on the combo, not the sum of its parts.** That is the whole commercial point: a
        meal deal is cheaper than its items, and a model that prices by summing cannot express it.

        **Upcharges live on the slot options.** A large drink in a meal deal costs two dirhams more than
        a regular, and it is not a separate combo.

        '
      required:
      - id
      - name
      - price
      - slots
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        name:
          type: string
        nameLocalised:
          type: object
          additionalProperties:
            type: string
        price:
          $ref: ../shared/common.yaml#/components/schemas/Money
        slots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComboSlot'
        availability:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Service periods it sells in. **A lunch deal at 9pm is a margin leak** and the
            venue only notices at month end.

            '
        isActive:
          type: boolean
          default: true
    ComboSlot:
      type: object
      x-ticvai-persistence: fnb.combo_slot
      description: 'One choice within a combo. **`minSelect` and `maxSelect` are what make it a slot rather
        than a line** — a main is exactly one, a side is one of four, and a sauce might be none or two.

        '
      required:
      - id
      - name
      - options
      properties:
        id:
          type: string
          format: uuid
        comboId:
          type: string
          format: uuid
        name:
          type: string
        minSelect:
          type: integer
          default: 1
        maxSelect:
          type: integer
          default: 1
        sortOrder:
          type: integer
          default: 100
        options:
          type: array
          items:
            type: object
            required:
            - menuItemId
            properties:
              menuItemId:
                type: string
                format: uuid
              upcharge:
                $ref: ../shared/common.yaml#/components/schemas/Money
              isDefault:
                type: boolean
                default: false
                description: '**The one a cashier gets without asking.** A combo with no default is four
                  taps at every till in the venue.

                  '
    KitchenException:
      type: object
      x-ticvai-persistence: fnb.kitchen_exception
      description: 'Board 3, 24 August. **Something that cost the kitchen a service and left no other
        trace** — equipment down, an item run out mid-ticket, a late delivery, a station short.

        `refireItem` covers a dish. **This covers the reasons a venue looking at a bad Saturday needs**,
        and which currently live in somebody''s memory.

        '
      required:
      - id
      - kind
      - raisedAt
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
          nullable: true
        ticketId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - equipmentDown
          - itemRanOut
          - lateDelivery
          - staffShort
          - powerLoss
          - spillage
          - chased
          - other
        durationMinutes:
          type: integer
          nullable: true
        raisedAt:
          type: string
          format: date-time
        raisedByPrincipalId:
          type: string
          format: uuid
        note:
          type: string
          nullable: true
    EightySixEvent:
      type: object
      x-ticvai-persistence: fnb.eighty_six_event
      description: 'Board 5J. **`setItemAvailability` recorded the current state and not the history.**
        An item 86''d at 7pm on a Saturday is a lost-sales figure and a prep-planning signal, and the
        package kept only the flag.

        **`refusedOrderCount` is what makes it worth keeping.** *Off for ninety minutes* is a note; *off
        for ninety minutes and eleven guests asked for it* is a purchasing decision.

        '
      required:
      - id
      - menuItemId
      - offAt
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        menuItemId:
          type: string
          format: uuid
        offAt:
          type: string
          format: date-time
        backAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          enum:
          - ranOut
          - qualityIssue
          - equipmentDown
          - supplierFailure
          - seasonal
          - other
        calledByPrincipalId:
          type: string
          format: uuid
        refusedOrderCount:
          type: integer
          default: 0
          readOnly: true
    SubBill:
      type: object
      x-ticvai-persistence: fnb.sub_bill
      description: 'One bill from a split. **Tax and service charge recompute per bill rather than apportioning
        pro rata** — a split that divides VAT by percentage produces bills that do not sum to the original,
        and the difference is a fils somebody has to explain at close.

        '
      required:
      - id
      - visitId
      - total
      properties:
        id:
          type: string
          format: uuid
        visitId:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        lineIds:
          type: array
          items:
            type: string
            format: uuid
        subtotal:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        serviceCharge:
          $ref: ../shared/common.yaml#/components/schemas/Money
        total:
          $ref: ../shared/common.yaml#/components/schemas/Money
        status:
          type: string
          enum:
          - open
          - paid
          - voided
    TemperatureLog:
      type: object
      x-ticvai-persistence: fnb.temperature_log
      description: 'Board 5J of the client F&B pack, 20 August. **HACCP records are a UAE regulatory obligation,
        they are inspected, and nothing in 947 operations touched them** — a venue that cannot produce
        a temperature log has a compliance failure rather than a missing screen.

        **A reading out of range is not an error, it is a finding.** The log records it, opens a corrective
        action, and keeps the reading — **deleting a bad reading is the one thing an inspector looks for.**

        **Offline-capable and it must be.** A walk-in freezer is where the signal is worst and the readings
        matter most.

        '
      required:
      - id
      - checkPointId
      - recordedAt
      - valueCelsius
      - outcome
      properties:
        id:
          type: string
          format: uuid
        checkPointId:
          type: string
          format: uuid
          description: The unit, station or delivery being read.
        checkPointKind:
          type: string
          enum:
          - fridge
          - freezer
          - holdingCabinet
          - blastChiller
          - coreProbe
          - delivery
          - displayCounter
          - ambient
        recordedAt:
          type: string
          format: date-time
        recordedByPrincipalId:
          type: string
          format: uuid
        valueCelsius:
          type: number
        minCelsius:
          type: number
          nullable: true
        maxCelsius:
          type: number
          nullable: true
        outcome:
          type: string
          enum:
          - inRange
          - outOfRange
          - notTaken
          description: '**`notTaken` is a record, not an absence.** A check that did not happen is itself
            a finding, and a log with a gap cannot be told apart from a log nobody kept.

            '
        deviceReported:
          type: boolean
          default: false
          description: '**A probe reading and a person''s reading are different evidence.** An inspector
            treats them differently and so should the record.

            '
        correctiveActionId:
          type: string
          format: uuid
          nullable: true
    CorrectiveAction:
      type: object
      x-ticvai-persistence: fnb.corrective_action
      description: 'What was done about a finding, and who signed it. **Opened automatically by an out-of-range
        reading or a cold-chain breach**, because an action that depends on somebody remembering to raise
        it is an action that is not raised.

        **Signed by a named principal, and the signature is the record.** *Discarded and reset* with nobody
        against it is not a corrective action.

        '
      required:
      - id
      - raisedAt
      - source
      - status
      properties:
        id:
          type: string
          format: uuid
        raisedAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - temperatureExcursion
          - coldChainBreach
          - expiredStock
          - contamination
          - pestSighting
          - equipmentFailure
          - manual
        sourceRef:
          type: string
          format: uuid
          nullable: true
        severity:
          type: string
          enum:
          - observation
          - minor
          - major
          - critical
        actionTaken:
          type: string
          nullable: true
        disposal:
          type: string
          enum:
          - none
          - discarded
          - reworked
          - quarantined
          - returned
          nullable: true
        status:
          type: string
          enum:
          - open
          - actioned
          - signed
          - escalated
          - closed
        signedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        signedAt:
          type: string
          format: date-time
          nullable: true
        escalatedToPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**A critical finding a shift cannot close.** Escalation exists so a supervisor
            signs what a cook should not.

            '
    ColdChainEvent:
      type: object
      x-ticvai-persistence: fnb.cold_chain_event
      description: 'Board 5G. **A delivery arriving warm is a rejection decision made at the door**, and
        the package had `createGoodsReceipt` with nowhere to record the temperature it arrived at.

        **The reading is taken before the receipt is posted**, not after — once stock is received it has
        entered the kitchen, and a claim against a supplier needs the reading that refused it.

        '
      required:
      - id
      - recordedAt
      - valueCelsius
      - decision
      properties:
        id:
          type: string
          format: uuid
        goodsReceiptId:
          type: string
          format: uuid
          nullable: true
        transferId:
          type: string
          format: uuid
          nullable: true
        recordedAt:
          type: string
          format: date-time
        valueCelsius:
          type: number
        thresholdCelsius:
          type: number
        decision:
          type: string
          enum:
          - accepted
          - acceptedWithNote
          - partiallyRejected
          - rejected
        correctiveActionId:
          type: string
          format: uuid
          nullable: true
        supplierClaimRaised:
          type: boolean
          default: false
    Allergen:
      type: object
      description: 'BL-127. **Fourteen declarable allergens is a legal list in most jurisdictions, not
        a preference.** A menu item with no allergen data is one a venue cannot serve to somebody who
        asks.

        **`contains` and `mayContain` are different claims.** The first is a recipe fact; the second is
        a kitchen fact about shared equipment, and conflating them either over-warns everybody or under-warns
        the person it matters to.

        '
      properties:
        contains:
          type: array
          items:
            type: string
            enum:
            - gluten
            - crustaceans
            - eggs
            - fish
            - peanuts
            - soybeans
            - milk
            - nuts
            - celery
            - mustard
            - sesame
            - sulphites
            - lupin
            - molluscs
        mayContain:
          type: array
          description: '**Cross-contamination, which is about the kitchen rather than the recipe.** A
            fryer shared with breaded fish makes chips a fish risk and nothing in the recipe says so.

            '
          items:
            type: string
        isVegetarian:
          type: boolean
          default: false
        isVegan:
          type: boolean
          default: false
        isHalal:
          type: boolean
          default: false
    Nutrition:
      type: object
      description: BL-127. Per serving, and the serving size is part of the claim.
      properties:
        servingSizeGrams:
          type: number
        energyKcal:
          type: number
        fatGrams:
          type: number
        saturatedFatGrams:
          type: number
        carbohydrateGrams:
          type: number
        sugarGrams:
          type: number
        proteinGrams:
          type: number
        saltGrams:
          type: number
    ProductionRun:
      type: object
      x-ticvai-persistence: fnb.production_run
      description: 'BL-129. **A central kitchen makes 400 portions at 6am for four outlets**, and nothing
        modelled that — orders consume stock and no operation produced any.

        **Production converts ingredients into a sellable item**, which is a stock movement in both directions
        at once, and treating it as two unrelated adjustments loses the yield.

        '
      required:
      - id
      - recipeId
      - plannedQuantity
      - status
      properties:
        id:
          type: string
          format: uuid
        recipeId:
          type: string
          format: uuid
        producingOutletId:
          type: string
          format: uuid
        forOutletIds:
          type: array
          description: '**Where it goes.** A central kitchen produces for outlets that did not make it.

            '
          items:
            type: string
            format: uuid
        plannedQuantity:
          type: number
        actualQuantity:
          type: number
          nullable: true
          description: 'BL-126. **Theoretical against actual is the whole point of recording this.** A
            recipe says 400 portions from the ingredients issued; the run says how many were made, and
            the gap is waste, theft or a recipe that is wrong.

            '
        scheduledFor:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - planned
          - inProgress
          - completed
          - cancelled
        varianceReason:
          type: string
          nullable: true
    RestaurantWaitlist:
      type: object
      x-ticvai-persistence: fnb.waitlist_entry
      description: 'BL-130. **Distinct from `queue`, which is for rides.** A restaurant waitlist has a
        party size, a table preference and a walk-away point, and a guest who leaves is not the same as
        a guest who was served.

        '
      required:
      - id
      - outletId
      - partySize
      - status
      properties:
        id:
          type: string
          format: uuid
        outletId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        partySize:
          type: integer
        quotedWaitMinutes:
          type: integer
          nullable: true
        seatingPreference:
          type: string
          enum:
          - any
          - indoor
          - outdoor
          - bar
          - booth
          - highChair
          nullable: true
        status:
          type: string
          enum:
          - waiting
          - notified
          - seated
          - walkedAway
          - noShow
          - cancelled
        notifiedAt:
          type: string
          format: date-time
          nullable: true
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**How long a table waits for somebody who was called.** Too short and a guest
            returning from the bathroom loses it; too long and the table sits empty at peak — which is
            why it is a setting rather than a constant.

            '
    TableReservation:
      type: object
      x-ticvai-persistence: fnb.table_reservation
      required:
      - outletId
      - startsAt
      - partySize
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        outletId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        guestName:
          type: string
        contactPoint:
          type: string
        partySize:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          description: '**How long the cover is held.** An outlet turning tables twice an evening needs
            this to be real, or the second sitting cannot be booked.

            '
        tableIds:
          type: array
          description: 'Usually empty until seating. **Committing a specific table at booking time refuses
            later bookings against a constraint that did not need to exist.**

            '
          items:
            type: string
            format: uuid
        status:
          $ref: '#/components/schemas/TableReservationStatus'
        groupId:
          type: string
          format: uuid
          nullable: true
          description: 5.1.2. Several bookings managed as one party across adjacent tables.
        notes:
          type: string
          description: Allergies
          occasion: null
          accessibility.: null
        actualPartySize:
          type: integer
          nullable: true
          readOnly: true
        tableVisitId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
    GuestOrderingMethod:
      x-ticvai-persistence: none — enum
      type: string
      description: 'How a guest may order at this outlet. Varies within one venue, so it is per outlet
        rather than a venue setting.

        '
      enum:
      - tableService
      - appToTable
      - appToCollect
      - counterOnly
      - notAvailable
    DiningOutlet:
      type: object
      x-ticvai-persistence: none — projection over outlet, menu and table state
      required:
      - outletId
      - name
      - kind
      - isOpenNow
      - orderingMethod
      properties:
        outletId:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        zone:
          type: string
          nullable: true
        cuisine:
          type: array
          items:
            type: string
        isOpenNow:
          type: boolean
        opensAt:
          type: string
          format: date-time
          nullable: true
        closesAt:
          type: string
          format: date-time
          nullable: true
        orderingMethod:
          $ref: '#/components/schemas/GuestOrderingMethod'
        estimatedWaitMinutes:
          type: integer
          nullable: true
          description: 'From current kitchen ticket volume, not a fixed figure. Null where the outlet
            has no KDS reporting — an invented wait time is worse than none.

            '
        imageAssetRef:
          type: string
          nullable: true
        menuId:
          type: string
          format: uuid
          nullable: true
    GuestMenu:
      type: object
      x-ticvai-persistence: none — projection over menu, item and availability
      required:
      - outletId
      - menuId
      - name
      - inForceUntil
      - sections
      properties:
        outletId:
          type: string
          format: uuid
        menuId:
          type: string
          format: uuid
        name:
          type: string
        inForceUntil:
          type: string
          format: date-time
          nullable: true
          description: 'When this menu stops applying. The client shows it, because a guest browsing breakfast
            at 10:55 should know.

            '
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currencyScale:
          type: integer
        sections:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              sortOrder:
                type: integer
              items:
                type: array
                items:
                  type: object
                  required:
                  - menuItemId
                  - name
                  - price
                  - isAvailable
                  - allergens
                  properties:
                    menuItemId:
                      type: string
                      format: uuid
                    name:
                      type: string
                    description:
                      type: string
                      nullable: true
                    price:
                      $ref: ../shared/common.yaml#/components/schemas/Money
                    imageAssetRef:
                      type: string
                      nullable: true
                    isAvailable:
                      type: boolean
                      description: 'Marked, not removed. A guest who saw a dish yesterday and cannot find
                        it today assumes the app is broken; "sold out" is an answer.

                        '
                    unavailableReason:
                      type: string
                      nullable: true
                    allergens:
                      type: array
                      description: Always present. Not a field a tenant may choose to omit.
                      items:
                        type: string
                    preparationMinutes:
                      type: integer
                      nullable: true
                    modifierGroups:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModifierGroup'
    DeliveryLocationKind:
      type: string
      description: 4.6.26. One concept, because a runner needs one instruction.
      enum:
      - table
      - seat
      - cabana
