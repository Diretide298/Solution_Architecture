openapi: 3.1.0
info:
  title: TICVAI Platform Operations
  version: 0.1.0
  x-ticvai-screen-count: 32
  x-ticvai-tier: satellite
  x-ticvai-module: Cross-cutting — Control Plane release and environment management
  x-ticvai-capabilities:
  - C96
  x-ticvai-platforms:
  - P09 TICVAI Web
  description: "## What this contract covers\n**Releases, environments and the migration orchestrator.**\n\
    | | | |---|---| | **Tier** | satellite — Control Plane | | **Matrix domain** | None. This scope arrived\
    \ in the 30 July workshop and never reached the requirements matrix | | **Capabilities** | C96 | |\
    \ **Consumed by** | P09 TICVAI Web |\n## Why this contract exists\nThirteen screens in the Platform\
    \ Admin Console had no contract behind them: release and version management, staging promotion, the\
    \ upgrade scheduler, end-of-support notices, the deployment monitor, and the **database migration\
    \ console**.\nAll thirteen were raised on 30 July, minuted, and then never written into a requirement.\
    \ They were consequently absent from the matrix, from the capability register, and from every estimate\
    \ — which is why the Platform Admin Console was the largest platform nobody had counted.\nThis contract\
    \ closes that gap. **It should be reconciled against the matrix**, because a scope that reaches a\
    \ contract without passing through a requirement has skipped the step that would have caught it earlier.\n\
    ## How to read this file\n**This file is a contract.** Hand-authored, and the source of truth for\
    \ one bounded context — code is generated from it, never the reverse.\n**`paths` are operations.**\
    \ Each declares `x-ticvai-permission`, `x-ticvai-scope-level`, `x-ticvai-offline-capable` and `x-ticvai-conflict-policy`.\n\
    **`components.schemas` are API schemas — the shape of data on the wire.** Not database tables. Where\
    \ a mapping exists, `x-ticvai-persistence` records it.\n## Positions this encodes\n- **The orchestrator\
    \ fans out per region, not per tenant** (ADR-0014). A tenant in three\n  regions is three cells and\
    \ three applications, and they may legitimately sit at\n  different versions mid-rollout.\n- **A migration\
    \ is never applied blind.** Plan, then apply, then verify. The plan reports\n  what will run against\
    \ which cells and what the rollback costs, and it is computed\n  against the actual cell state rather\
    \ than assumed.\n- **Rollback is tested, not asserted.** Every migration carries a rollback that CI\
    \ runs\n  against a restored snapshot. A rollback nobody has executed is a comment.\n- **Promotion\
    \ is a workflow with an approver.** Staging to production is not a button. - **Version skew is expected\
    \ and visible.** During a rollout cells differ; the console\n  shows which and why, because unexplained\
    \ skew is a defect and explained skew is Tuesday.\n"
servers:
- url: https://{controlPlaneHost}/api/v1
  variables:
    controlPlaneHost:
      default: control.ticvai.local
security:
- bearerAuth: []
tags:
- name: release
- name: migration
- name: environment
- name: rollout
- name: notice
paths:
  /rollouts/{rolloutId}/cells/{cellId}/skip:
    parameters:
    - name: rolloutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: cellId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: skipRolloutCell
      x-ticvai-audience:
      - staff
      summary: Exclude a cell from this wave
      description: 'An on-premise cell TICVAI cannot reach, a venue in a blackout window, or a tenant
        who asked to be held back.

        **Recorded, not silent.** A cell skipped and forgotten runs an old version indefinitely, and the
        drift is discovered when an API it does not have is called.

        '
      tags:
      - platform-ops
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-scope-level: platform
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - onPremiseIsolated
                  - onPremiseConnected
                  - blackoutWindow
                  - tenantRequested
                  - unreachable
                  - knownIncompatibility
                note:
                  type: string
                  maxLength: 300
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Skipped, and recorded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /releases:
    get:
      operationId: listReleases
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
        - "P09 ADM-024 Release Notification Composer"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: List releases
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ReleaseStatus'
      - name: environment
        in: query
        schema:
          $ref: '#/components/schemas/EnvironmentKind'
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Release'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createRelease
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
      x-ticvai-audience:
      - staff
      summary: Cut a release
      description: 'A release names the component versions that ship together and the migrations they
        require. Nothing is deployed by creating one — it is a manifest, not an action.

        **It also carries the guest-facing "what''s new"** (decided 29 September, rev 3 GAP-B2):
        `guestReleaseNotes`, localised, written for guests and public. `note` stays internal. The notes of
        the releases a tenant''s cell is running are what the guest Help screen reads, through the public
        guest view of `white-label.getTenantAppStatus`; a release with no guest-visible change leaves them
        null and shows nothing.

        '
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReleaseRequest'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          description: 'A required migration is absent, or a component version does not exist in the registry.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /releases/{releaseId}:
    parameters:
    - name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getRelease
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: Read a release with its rollout state
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /releases/{releaseId}/reject:
    parameters:
    - name: releaseId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: rejectRelease
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
      x-ticvai-audience:
      - staff
      summary: Reject a release back a stage
      description: 'Staging promotion is where a bad release is stopped, and stopping it needs to be as
        easy as promoting it.

        '
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_PROMOTE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /releases/{releaseId}/withdraw:
    parameters:
    - name: releaseId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: withdrawRelease
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
      x-ticvai-audience:
      - staff
      summary: Withdraw a release
      description: 'Distinct from a rollback. The rollout state handles the mechanics of reversing a deployment;
        this records the decision that the artefact should never ship again.

        '
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /releases/{releaseId}/promote:
    parameters:
    - name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: promoteRelease
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
      x-ticvai-audience:
      - staff
      summary: Promote a release to the next environment
      description: 'Dev to staging to production, in order. Skipping an environment is refused.

        **Promotion to production requires an approver who is not the requester**, and the approval is
        recorded against the release. Staging to production is a workflow, not a button.

        '
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_PROMOTE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetEnvironment
              - note
              properties:
                targetEnvironment:
                  $ref: '#/components/schemas/EnvironmentKind'
                note:
                  type: string
                  minLength: 3
                  maxLength: 1000
                approverPrincipalId:
                  type: string
                  format: uuid
                  description: Required for production. May not be the requester.
                stepUpToken:
                  type: string
                  description: Required for production. Proves a factor was presented just now.
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Promotion started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
        '403':
          description: Approver is the requester, or the step-up token is absent or expired
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: 'Environment skipped, prior environment unhealthy, or the release has unapplied
            migrations in the target.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PromotionBlockedProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /releases/{releaseId}/readiness:
    parameters:
    - name: releaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getReleaseReadiness
      x-ticvai-consumed-by:
        - "P09 ADM-022 Release & Version Management"
        - "P09 ADM-023 Staging Promotion & Approval"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: Whether a release can be promoted, and what blocks it
      description: 'Run before promoting. Reports each gate and its state, so a blocked promotion is diagnosed
        before it is attempted rather than after.

        '
      tags:
      - release
      x-ticvai-permission: PLATFORM_RELEASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseReadiness'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /rollouts:
    get:
      operationId: listRollouts
      x-ticvai-consumed-by:
        - "P09 ADM-029 Deployment Monitor"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: List rollouts
      description: 'A rollout is one release reaching one environment across many cells. The deployment
        monitor reads this.

        '
      tags:
      - rollout
      x-ticvai-permission: PLATFORM_RELEASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/RolloutStatus'
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Rollouts
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Rollout'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /rollouts/{rolloutId}:
    parameters:
    - name: rolloutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getRollout
      x-ticvai-consumed-by:
        - "P09 ADM-029 Deployment Monitor"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: Rollout progress per cell
      description: 'Cells advance in waves — canary first, then the rest. Per-cell state is the only useful
        view, because "60% complete" says nothing about whether the failing 40% is one region or forty
        venues.

        '
      tags:
      - rollout
      x-ticvai-permission: PLATFORM_RELEASE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Rollout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutDetail'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /rollouts/{rolloutId}/start:
    parameters:
    - name: rolloutId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: startRollout
      x-ticvai-consumed-by:
        - "P08 BO-126 Deployment, Preview & Audit"
        - "P09 ADM-029 Deployment Monitor"
      x-ticvai-audience:
      - staff
      summary: Start or continue a rollout
      description: 'Begins at the canary and continues from it once held. **The canary should be a dedicated
        cell or the smallest shared one** — a canary that is itself a busy shared cell risks many tenants
        (ADR-0001 (retired — see ADR-0014 and ADR-0017)).

        **Needs the platform release manager''s approval** (decided 28 September, audit R144). Each start
        or continuation raises an approval request of kind `releasePromotion`, routed to a holder of
        `PLATFORM_RELEASE_PROMOTE` other than the requester, and answers `202` with the rollout unchanged
        and `approvalRequestId` set (the request is `pending`). The rollout moves to the requested stage
        when the request is approved. A requester may never approve their own promotion.

        '
      tags:
      - rollout
      x-ticvai-permission: PLATFORM_RELEASE_PROMOTE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stage
              properties:
                stage:
                  type: string
                  enum:
                  - canary
                  - partial
                  - full
                  description: >-
                    The stage to take the rollout to (decided 28 September, audit R096). `canary` is the
                    first cell only; `partial` is a wave of the remaining cells, and may be sent again to
                    continue with the next wave; `full` is every remaining cell. A stage behind the one the
                    rollout has reached is a 409.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Done
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Waiting for the platform release manager (audit R144). Nothing has moved yet.
          content:
            application/json:
              schema:
                type: object
                required:
                - rolloutId
                - approvalRequestId
                properties:
                  rolloutId:
                    type: string
                  stage:
                    type: string
                    enum:
                    - canary
                    - partial
                    - full
                    description: The stage requested, applied on approval.
                  approvalRequestId:
                    type: string
                    format: uuid
                    description: The pending `releasePromotion` request.
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /rollouts/{rolloutId}/pause:
    parameters:
    - name: rolloutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: pauseRollout
      x-ticvai-consumed-by:
        - "P09 ADM-029 Deployment Monitor"
      x-ticvai-audience:
      - staff
      summary: Halt a rollout in progress
      description: 'Stops before the next cell. Cells already updated stay updated — this is a pause,
        not a rollback, and the distinction matters when someone reaches for it at speed.

        '
      tags:
      - rollout
      x-ticvai-permission: PLATFORM_RELEASE_PROMOTE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Paused, with the cells already updated reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutDetail'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /rollouts/{rolloutId}/rollback:
    parameters:
    - name: rolloutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: rollbackRollout
      x-ticvai-consumed-by:
        - "P09 ADM-029 Deployment Monitor"
      x-ticvai-audience:
      - staff
      summary: Roll a rollout back
      description: 'Reverts application versions and, where the release carried migrations, runs their
        rollback sections against each affected cell.

        **Refused where any migration in the release is not reversible.** A destructive migration is a
        one-way door, and the console says so rather than half-reverting and leaving a cell in a state
        nobody has a name for.

        '
      tags:
      - rollout
      x-ticvai-permission: PLATFORM_RELEASE_PROMOTE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - stepUpToken
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                stepUpToken:
                  type: string
                cellIds:
                  type: array
                  description: Omit to roll back every cell in the rollout.
                  items:
                    type: string
                    format: uuid
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Rollback started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutDetail'
        '409':
          description: 'A migration in this release is irreversible. The response names it — a one-way
            door should be identified, not discovered.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IrreversibleProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /migrations:
    get:
      operationId: listMigrations
      x-ticvai-consumed-by:
        - "P09 ADM-027 Database Migration Console"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: The migration register
      description: 'Every migration, its module, whether it is reversible, and which cells have applied
        it. This is the migration console''s landing view.

        '
      tags:
      - migration
      x-ticvai-permission: PLATFORM_MIGRATION_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: appliedTo
        in: query
