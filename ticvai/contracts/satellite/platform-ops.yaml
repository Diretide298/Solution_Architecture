components:
  schemas:
    OutboxRelay:
      type: object
      x-ticvai-persistence: control.outbox_relay
      x-ticvai-primary-key:
      - cellTenantId
      description: '**Which worker replica relays which tenant database''s outbox** (ADR-0058). One row per tenant
        database in the region, in the regional control database. A replica holds a lease by renewing it every
        few seconds; when it dies the lease expires and another replica takes it, so exactly one publisher per
        tenant database keeps per-tenant order. pgbouncer runs in transaction mode, so this is a row and not a
        session advisory lock.'
      required:
      - cellTenantId
      - holder
      - leaseExpiresAt
      properties:
        cellTenantId:
          type: string
          format: uuid
          x-ticvai-references: control.cell_tenant
          description: The tenant database this lease covers (`control.cell_tenant`).
        holder:
          type: string
          maxLength: 200
          description: The worker replica holding the lease (pod name plus a start nonce).
        leaseExpiresAt:
          type: string
          format: date-time
          description: Another replica may take the lease after this instant.
        acquiredAt:
          type: string
          format: date-time
        renewedAt:
          type: string
          format: date-time
        lastPolledAt:
          type: string
          format: date-time
          nullable: true
          description: The end of the last poll, for the relay-lag dashboard.
    InboxEntry:
      type: object
      x-ticvai-persistence: kernel.inbox
      x-ticvai-primary-key:
      - consumer
      - eventId
      x-ticvai-append-only: eventId
      description: '**The consumer''s record of every event it has processed** (ADR-0058). Inserted in the same
        transaction as the effect, with `ON CONFLICT DO NOTHING`; no row inserted means already processed, so skip
        and acknowledge. One per tenant database, written by every consumer through the kernel''s inbox wrapper. Kept 30 days, longer than any redelivery window, and dropped a month at a
        time: partitioned by month on `eventId`, which is a UUIDv7 and so sorts by time (ADR-0056).'
      required:
      - consumer
      - eventId
      - processedAt
      properties:
        consumer:
          type: string
          maxLength: 200
          description: The consumer's stable name (`<service>.<handler>`); one event is processed once per consumer.
        eventId:
          type: string
          format: uuid
          description: The envelope's `eventId`, which is the producing outbox row's id (UUIDv7).
        processedAt:
          type: string
          format: date-time
    ScalingPolicy:
      type: object
      x-ticvai-persistence: control.scaling_policy
      description: '**Drafted 4 September.** What a cell scales on. **A floor and a ceiling are not
        symmetric** - the floor is the size the environment is stood up at before traffic arrives,
        and the ceiling is a cap on absorbing a peak nobody predicted (ADR-0035).'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        service:
          type: string
        replicaFloor:
          type: integer
        replicaCeiling:
          type: integer
          description: 'Null means no maximum, which is the correct setting for a burst cell.'
        targetUtilisationPct:
          type: integer
        scaleStepPct:
          type: integer
        updatedAt:
          type: string
          format: date-time
    ArchivalJob:
      type: object
      x-ticvai-persistence: control.archival_job
      description: '**Drafted 4 September.** One archival or retention run. Retention is a legal
        obligation, so a stalled job is a compliance failure rather than a housekeeping one.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        policyName:
          type: string
        targetTable:
          type: string
        rowsArchived:
          type: integer
        rowsPurged:
          type: integer
        state:
          type: string
          enum:
          - scheduled
          - running
          - succeeded
          - failed
        runAt:
          type: string
          format: date-time
        error:
          type: string
    BackupRun:
      type: object
      x-ticvai-persistence: control.backup_run
      description: '**Drafted 4 September.** One backup run. The question this answers is not *did it
        run* but *how old is the newest restorable copy* - a job that succeeds nightly against an
        empty database succeeds forever.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        scope:
          type: string
          enum:
          - cell
          - tenant
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - running
          - succeeded
          - failed
        sizeBytes:
          type: integer
        restoreTestedAt:
          type: string
          format: date-time
          description: '**A backup nobody has restored is a hypothesis.**'
        error:
          type: string
    WafRule:
      type: object
      x-ticvai-persistence: control.waf_rule
      description: '**Drafted 4 September.** One firewall rule, and the reason it is a row rather than
        a config file is that somebody has to be able to say who changed it and when.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        name:
          type: string
        action:
          type: string
          enum:
          - allow
          - block
          - rateLimit
          - challenge
        matchOn:
          type: string
          description: What the rule inspects - a path, a header, a source range.
        pattern:
          type: string
        enabled:
          type: boolean
        hitCount24h:
          type: integer
          description: '**A rule with no hits is either protecting nothing or blocking everything
            silently**, and both want looking at.'
        updatedAt:
          type: string
          format: date-time
    EnvironmentKind:
      type: string
      enum:
      - dev
      - staging
      - production
    ReleaseStatus:
      type: string
      enum:
      - draft
      - inDev
      - inStaging
      - inProduction
      - superseded
      - withdrawn
    RolloutStatus:
      type: string
      enum:
      - queued
      - canary
      - rolling
      - paused
      - complete
      - failed
      - rolledBack
    ComponentVersion:
      type: object
      required:
      - component
      - version
      properties:
        component:
          type: string
          enum:
          - backend
          - frontend
          - ai
          - infra
          - contracts
        version:
          type: string
