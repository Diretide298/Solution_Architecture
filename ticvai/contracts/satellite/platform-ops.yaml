          description: >
            **The public, localised "what's new" for guests** (decided 29 September, rev 3 GAP-B2), one
            short text per locale, written for a guest and naming no person. Public once the release
            reaches the tenant's cell; read by the guest Help screen (WEB-025, WEB-045, GST-040) through
            `white-label.getTenantAppStatus`. Distinct from the staff-only `TenantAppStatus.recentChanges`,
            which names the principal behind each change and stays staff only.
        breakingChanges:
          type: array
