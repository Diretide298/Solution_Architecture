        cellId:
          type: string
          format: uuid
        cellName:
          type: string
        regionName:
          type: string
        countryCode:
          type: string
        isCanary:
          type: boolean
        wave:
          type: integer
        status:
          type: string
          enum:
          - pending
          - running
          - complete
          - failed
          - skipped
          - rolledBack
        fromVersion:
          type: string
          nullable: true
        toVersion:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
