  /outbox-republishes:
    post:
      operationId: republishOutbox
      x-ticvai-consumed-by:
        - "P09 ADM-318 Dead Letters"
      summary: Republish one tenant database's outbox rows for a time range
      description: '**ADR-0058, amended 1 October (section 3).** When the broker is lost or rebuilt, or a
        DR failover starts an empty broker in the other region (ADR-0060), every message it held and no
        consumer had settled is gone. The outbox still has every row. This asks the relay loop holding the
        tenant''s lease to read that tenant database''s outbox rows with `created_at` in `[from, to)`,
        optionally only some event names, in `(created_at, id)` order and batches of `Relay:BatchSize`,
        and publish them through `IBrokerPublisher` **whether or not they were published before**. Every
        consumer''s inbox skips what it already handled.


        - **`published_at` is not touched**: the first publication stays on record.

        - **Live events come first**: the loop alternates one republish batch with each live batch.

        - **`from` must be early enough**: the moment the oldest message still held by the lost broker was
        published; when unknown, the time of the loss minus one hour, or the start of any consumer halt then
        in progress, whichever is earlier. Too early costs duplicates the inboxes absorb; too late loses
        events.

        - **`from` < `to` <= now**, else the shared `400` `validation`; so is an event name that is not in
        the catalogue.

        - **One republish per tenant at a time** (`409` `republish-in-progress`). A cancelled or failed job
        keeps its cursor, so a new request can start where it stopped.

        - **Only the hot outbox**: a range reaching into a monthly partition already archived to Blob
        (ADR-0047, ADR-0056) is refused (`422` `outbox-range-archived`).

        - **Recorded** in `control.outbox_republish` and in the audit trail. Carried out by the relay in the
        `workers` deployable; this operation only queues the job.

        '
      tags:
      - platform-ops
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: platform
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboxRepublishRequest'
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Queued. Follow it with `getOutboxRepublish` until it is `completed`, `failed` or
            `cancelled`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxRepublish'
          links:
            pollRepublish:
              operationId: getOutboxRepublish
              parameters:
                republishId: $response.body#/id
              description: Progress of the queued republish.
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          description: 'The tenant already has a republish `queued` or `running` (`republish-in-progress`;
            `detail` names it), or the `Idempotency-Key` was used for a different request
            (`idempotency-conflict`).

            '
          x-ticvai-problem-types:
          - republish-in-progress
          - idempotency-conflict
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: '`from` is older than the oldest hot outbox partition: that part of the range is
            archived to Blob and republishing from the archive is not built (`outbox-range-archived`;
            `detail` names the oldest `from` that would be accepted).

            '
          x-ticvai-problem-types:
          - outbox-range-archived
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    get:
      operationId: listOutboxRepublishes
      x-ticvai-consumed-by:
        - "P09 ADM-318 Dead Letters"
      summary: Outbox republishes, newest first
      description: ADR-0058 (amended 1 October). Every republish asked for, newest first by `requestedAt`
        with the id as the tiebreak, so an operator after a failover sees each promoted tenant's job and
        how far it has got.
      tags:
