        isReversible:
          type: boolean
          description: 'A rollback section exists and CI has executed it against a restored snapshot.
            A rollback nobody has run is a comment, not a rollback.

            '
        rollbackTestedAt:
          type: string
          format: date-time
          nullable: true
        checksum:
          type: string
          description: 'Compared on apply. A migration edited after it was applied somewhere is a defect
            the register catches, not a mystery to debug later.

            '
        estimatedLockMs:
          type: integer
          nullable: true
        touchesPartitionedTable:
          type: boolean
        appliedCellCount:
          type: integer
        pendingCellCount:
          type: integer
    MigrationPlan:
      type: object
      x-ticvai-persistence: control.migration_plan
      required:
      - id
      - targetVersion
      - computedAt
      - cells
      - allReversible
      properties:
        id:
          type: string
          format: uuid
        targetVersion:
          type: string
        computedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 'A plan is computed against cell state at a moment. Beyond this it is stale and
            apply refuses it rather than applying to a different world than it was made for.

            '
        allReversible:
          type: boolean
        irreversible:
          type: array
          items:
            type: string
        totalEstimatedLockMs:
          type: integer
        cells:
          type: array
          items:
            type: object
            properties:
              cellId:
                type: string
                format: uuid
              cellName:
                type: string
              tenantSelection:
                type: string
                description: 'Which of the cell''s tenant databases the plan targets. **A plan that can
                  only say "this region" cannot express the rollout ADR-0038 makes normal** — a cell is a
                  region holding many tenants, and a wave may be a subset of one.'
                enum:
                - all
                - named
              tenantIds:
                type: array
                description: 'Present only where `tenantSelection` is `named`. **Named rather than
                  counted**, for the reason `migration_run_cell` gives about partial failure: a set
                  recorded as a number cannot be checked against what actually ran.'
                items:
                  type: string
                  format: uuid
              currentVersion:
                type: string
              migrationsToApply:
                type: array
                items:
                  type: string
              estimatedLockMs:
                type: integer
              warnings:
                type: array
                description: 'A long lock on a partitioned table during trading hours is the output this
                  endpoint exists to produce.

                  '
                items:
                  type: string
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    MigrationRun:
      type: object
      x-ticvai-persistence: control.migration_run + control.migration_run_cell + control.migration_run_tenant
      description: 'One run, its per-region rollup, and its per-tenant outcomes. **The third table exists
        because ADR-0038 made a cell a region holding many tenants**, and `migration_run_cell`''s own note
        says it is there so *"a partial failure is named rather than counted"* — which is exactly what it
        stopped doing. A run that fails for twenty of two hundred tenants had one row saying `failed`.


        The rollup stays. *"How is the UAE doing"* is a real question and computing it from two hundred rows
        on every read is not.

        '
      required:
      - id
      - planId
      - status
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - canary
          - running
          - paused
          - complete
          - failed
          - rolledBack
        canaryCellId:
          type: string
          format: uuid
          nullable: true
          description: 'Which region the canary tenant is in. **The canary itself is a tenant** — a first
            cell holding two hundred databases is not a cheap failure, and cheap failure is the only thing
            a canary is for.'
        canaryTenantId:
          type: string
          format: uuid
          nullable: true
        tenantsTotal:
          type: integer
        tenantsComplete:
          type: integer
        tenantsFailed:
          type: integer
        cellsTotal:
          type: integer
        cellsComplete:
          type: integer
        cellsFailed:
          type: integer
        startedByPrincipalId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        cells:
          type: array
          items:
            $ref: '#/components/schemas/MigrationRunCell'
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/RolloutTenant'
    VersionSkewReport:
      type: object
      x-ticvai-persistence: none — computed from cell state
      required:
      - asAt
      - cells
      - hasUnexplainedSkew
      properties:
        asAt:
          type: string
          format: date-time
        hasUnexplainedSkew:
          type: boolean
          description: 'Skew during a rollout is expected. Skew outside one is a defect, and separating
            the two is the entire value of this report.

            **An on-premise cell is a third case: legitimately behind, indefinitely**, because the client
            has not scheduled the window and TICVAI cannot push. It is not counted here and must not appear
            as a defect (ADR-0017).

            '
        cells:
          type: array
          items:
            type: object
            properties:
              cellId:
                type: string
                format: uuid
              cellName:
                type: string
              schemaVersion:
                type: string
              applicationVersion:
                type: string
              isBehind:
                type: boolean
              versionsBehind:
                type: integer
              reason:
                type: string
                nullable: true
                enum:
                - midRollout
                - rolloutPaused
                - rolloutFailed
                - tenantDeferred
                - onPremiseNotScheduled
                - unexplained
    Environment:
      type: object
      x-ticvai-persistence: control.environment
      required:
      - id
      - kind
      - name
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/EnvironmentKind'
        name:
          type: string
        cellIds:
          type: array
          items:
            type: string
            format: uuid
        requiresApprovalToPromote:
          type: boolean
        soakHours:
          type: integer
          description: 'How long a release must sit here before it may be promoted. Zero for dev; a real
            number for staging, or staging is a formality.

            '
        currentReleaseVersion:
          type: string
          nullable: true
        isActive:
          type: boolean
    UpgradeSchedule:
      type: object
      x-ticvai-persistence: control.upgrade_schedule
      required:
      - tenantId
      - releaseVersion
      - scheduledFor
      properties:
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        releaseVersion:
          type: string
        scheduledFor:
          type: string
          format: date-time
        deferredByTenant:
          type: boolean
        deferralReason:
          type: string
          nullable: true
        maxDeferralUntil:
          type: string
          format: date-time
          description: 'Beyond this the platform proceeds. An indefinitely deferred tenant becomes a version
            nobody supports.

            '
        notifiedAt:
          type: string
          format: date-time
          nullable: true
    SupportNotice:
      type: object
      x-ticvai-persistence: control.support_notice
      required:
      - id
      - version
      - supportEndsAt
      - publishedAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        supportEndsAt:
          type: string
          format: date
        message:
          type: object
          additionalProperties:
            type: string
        affectedTenantIds:
          type: array
          readOnly: true
          description: Computed from cell versions, never typed. A notice to the wrong list is worse than
            none.
          items:
            type: string
            format: uuid
        publishedByPrincipalId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    DeadLetter:
      x-ticvai-append-only: createdAt
      type: object
      x-ticvai-persistence: platform.dead_letter
      description: 'ADR-0033. **An outbox row whose delivery failed after its retry budget.**


        **A financial posting is never dead-lettered** — `ledger.journal_entry` is append-only and a failed
        posting is an incident. **Nor is a DSAR**: `platform.dsar_request` carries a legal clock, and
        a dead-lettered erasure nobody works is a regulatory failure with a timestamp on it. Both halt
        and alert.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        outboxId:
          type: string
          format: uuid
          description: The row that would not deliver.
        eventName:
          type: string
        consumer:
          type: string
          description: Which consumer failed. **A dead letter you cannot attribute is a log entry with
            a table’s overhead.**
        payload:
          type: object
          description: The event as it was written. **Replay needs the payload, not a reference to a row
            that may have moved on.**
        attempts:
          type: integer
          description: '**Five, exponential from one second, jittered** (ADR-0033). Jitter because a thousand
            failures at the same instant retry at the same instant.'
        lastError:
          type: string
        lastAttemptAt:
          type: string
          format: date-time
        replayCount:
          type: integer
          default: 0
          description: '**A replay is a new attempt, not a reset.** An operator retrying the same poison
            message forty times should be able to see that they did.'
        scopePath:
          type: string
        createdAt:
          type: string
          format: date-time
    OutboxEntry:
      x-ticvai-append-only: createdAt
      type: object
      x-ticvai-persistence: platform.outbox
      description: '**Written in the same transaction as the state change** (ADR-0033). That is what makes
        it exactly-once — the row and the change commit together or neither does.


        **Not a queue write inside a transaction.** A broker acknowledging a publish that then rolls back
        is the exactly-once problem restated.


        **Declared 31 August.** The table was storage-only with no schema and therefore no columns, while
        20 operations wrote to it and `platform.dead_letter.outbox_id` referenced it — **twenty relationship
        edges pointing at a table the schema did not have.**'
      required:
      - id
      - eventId
      - eventName
      - tenantId
      - aggregateType
      - aggregateId
      - sequence
      - payload
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          description: '**The envelope''s event id, which is this row''s `id`** (ADR-0058; UUIDv7, ADR-0056). The
            consumer inbox key, so a redelivery is recognised as the same event. `events/_schema.yaml` defines
            the envelope.'
        eventName:
          type: string
          description: The `name` of an event in `events/` (`aggregate.pastTenseFact`).
        eventVersion:
          type: integer
          minimum: 1
          description: The event's `version`, carried in the envelope so a consumer on an older version can tell.
        tenantId:
          type: string
          format: uuid
          description: The tenant the change belongs to (envelope field, SD-030).
        aggregateType:
          type: string
          description: The table the change happened in.
        aggregateId:
          type: string
          format: uuid
          description: '**Which row changed** (ADR-0056: every id is a uuid, so every aggregate fits). Also the
            broker ordering key (ADR-0058): a partition key in Kafka, a consistent-hash or single-active-consumer key
            in RabbitMQ, so one aggregate''s events arrive in `sequence` order.'
        payload:
          type: object
          description: '**The event as it happened, not a reference to a row that may have moved on.**
            A consumer reading the current state instead would see the third change, not the first.'
        scopePath:
          type: string
          description: The partition key (ADR-0005).
        sequence:
          type: integer
          description: '**Monotonic per aggregate** (SD-030: was *per scope*), allocated in the writing
            transaction. A consumer that missed one knows it missed one — ordering is the difference between
            at-least-once and unusable — and ordering is only ever promised within one aggregate.'
        traceId:
          type: string
          maxLength: 64
          nullable: true
          description: The W3C trace id of the request that made the change (envelope field, SD-030), so a
            consumer's work joins the producer's trace.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the relay publishes it. **This column is the queue** — unpublished rows
            in sequence order are the work.
        attempts:
          type: integer
          default: 0
          description: '**Five, exponential from one second, jittered.** Then `platform.dead_letter`.'
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    OutboxRepublishRequest:
      type: object
      x-ticvai-persistence: none — request body
      description: '**What a person asks to republish** (ADR-0058, amended 1 October). One tenant
        database, a half-open range of `created_at`, optionally some event names, and why.'
      required:
      - tenantId
      - from
      - to
      - reason
      properties:
        tenantId:
          type: string
          format: uuid
          description: The tenant whose database's outbox is read (`control.tenant`).
        from:
          type: string
          format: date-time
          description: 'Inclusive. **Early enough**: when the oldest message still held by the lost broker
            was published; when unknown, the time of the loss minus one hour, or the start of any consumer
            halt then in progress, whichever is earlier. Must be before `to`.'
        to:
          type: string
          format: date-time
          description: Exclusive. No later than now; after a DR failover, the time of the request.
        eventNames:
          type: array
          description: Catalogue event names (`events/`) to republish; absent means every event. An unknown
            name is the shared `400` `validation`.
          items:
            type: string
        reason:
          type: string
          maxLength: 500
          description: Why, for the audit trail (e.g. "broker rebuilt after DR failover to the secondary
            region").
    OutboxRepublish:
      type: object
      x-ticvai-persistence: control.outbox_republish
      description: '**One republish of a tenant database''s outbox** (ADR-0058, amended 1 October). A job
        row in the regional control database beside the relay lease table `control.outbox_relay`. The relay
        loop holding the tenant''s lease carries it out, alternating one republish batch with each live
        batch, and moves `cursorAt` as it goes. **At most one `queued` or `running` per tenant.** A
        cancelled or failed job keeps its cursor, so a new request can start where it stopped. The rows
        republished keep their `published_at`.'
      required:
      - id
      - tenantId
      - from
      - to
      - reason
      - status
      - rowsPublished
      - requestedBy
      - requestedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
          x-ticvai-references: control.tenant
          description: The tenant whose database's outbox is republished.
        from:
          type: string
          format: date-time
          x-ticvai-column: range_starts_at
          description: Inclusive start of the outbox `created_at` range.
        to:
          type: string
          format: date-time
          x-ticvai-column: range_ends_at
          description: Exclusive end of the outbox `created_at` range.
        eventNames:
          type: array
          nullable: true
          description: The event names asked for; null means every event.
          items:
            type: string
        reason:
          type: string
          maxLength: 500
        status:
          type: string
          readOnly: true
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
          description: '`queued` until the lease holder picks it up; `completed` when the cursor reaches
            `to`; `failed` with `lastError` after the relay''s retry budget; `cancelled` by
            `cancelOutboxRepublish`.'
        cursorAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: How far it has got, the `created_at` of the last row published (with the row id as
            the keyset tiebreak, held by the relay). Null until the first batch.
        rowsPublished:
          type: integer
          minimum: 0
          default: 0
          readOnly: true
        lastError:
          type: string
          nullable: true
          readOnly: true
        requestedBy:
          type: string
          format: uuid
          readOnly: true
          x-ticvai-column: requested_by_principal_id
          description: The staff principal who asked.
        requestedAt:
          type: string
          format: date-time
          readOnly: true
        startedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Set on `completed`, `failed` or `cancelled`.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
