    RolloutDetail:
      allOf:
      - $ref: '#/components/schemas/Rollout'
      - type: object
        x-ticvai-persistence: none — projection over rollout and cell state
        properties:
          cells:
            type: array
            description: 'Per-cell state. "60% complete" says nothing about whether the failing 40% is
              one region or forty venues.

              '
            items:
              $ref: '#/components/schemas/RolloutCell'
    RolloutTenant:
      type: object
      x-ticvai-persistence: control.rollout_tenant
      description: 'What happened to one tenant database during one run. **The same shape as `RolloutCell`
        one level down**, and it serves the per-tenant rows of both a rollout and a migration run — the
        arrangement `RolloutCell` had with `rollout_cell` and `migration_run_cell` until `rollout_cell` needed
        its `rolloutId` parent key and the migration run''s cells moved to `MigrationRunCell`.


        **`databaseName` is denormalised on purpose.** After a drop the run record still has to say what it
        touched, and a join to a row that no longer exists says nothing.

        '
      required:
      - tenantId
      - cellId
      - status
      properties:
        tenantId:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        databaseName:
          type: string
        isCanary:
          type: boolean
        wave:
          type: integer
          description: 'A wave is now a set of tenants and may be a subset of one cell.'
        status:
          type: string
          enum:
          - pending
          - running
          - complete
          - failed
          - skipped
          - rolledBack
        fromVersion:
          type: string
          nullable: true
        toVersion:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    RolloutCell:
      type: object
      x-ticvai-persistence: control.rollout_cell
      description: 'One cell''s state within one rollout. **`rolloutId` is the row''s parent**: a cell takes part
        in many rollouts over its life, and `skipRolloutCell` addresses `/rollouts/{rolloutId}/cells/{cellId}`,
        so a row keyed on the cell alone cannot say which run it belongs to or be found by that path.


        A migration run''s per-cell rows are the same fields under a different parent, and use `MigrationRunCell`.

        '
      required:
      - rolloutId
      - cellId
      - status
      properties:
        rolloutId:
          type: string
          format: uuid
          description: 'The rollout this row belongs to (`control.rollout`).'
        cellId:
          type: string
          format: uuid
        cellName:
          type: string
        regionName:
          type: string
        countryCode:
          type: string
        isCanary:
          type: boolean
        wave:
          type: integer
        status:
          type: string
          enum:
          - pending
          - running
          - complete
          - failed
          - skipped
          - rolledBack
        fromVersion:
          type: string
          nullable: true
        toVersion:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    MigrationRunCell:
      type: object
      x-ticvai-persistence: none — rows of control.migration_run_cell, stored through MigrationRun
      description: 'One cell''s rollup within one migration run. **The fields of `RolloutCell` without its
        `rolloutId`**: a migration run is not a rollout, and its parent key `migration_run_id` comes from
        `MigrationRun.cells`.

        '
      required:
      - cellId
      - status
