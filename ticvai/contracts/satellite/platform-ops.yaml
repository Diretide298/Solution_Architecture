                  type: string
    Rollout:
      type: object
      x-ticvai-persistence: control.rollout
      required:
      - id
      - releaseId
      - environment
      - status
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        releaseId:
          type: string
          format: uuid
        environment:
          $ref: '#/components/schemas/EnvironmentKind'
        status:
          $ref: '#/components/schemas/RolloutStatus'
        cellsTotal:
          type: integer
