    post:
      operationId: actOnPartnerReconciliationException
      x-ticvai-consumed-by:
        - "P08 PTR-047 Partner Reconciliation & Exception Management"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: writers pass; DM4 (control.partner_reconciliation_exception had no owner
        action; rows come from the reconciliation job); pack ''B2B, Reseller & OTA Partner Management_Reference.pdf''
        pp.46-47 (Reconciliation Sources, Exception Types, Resolution Actions); shape follows finance resolveSettlementException'
      summary: Work a partner reconciliation exception
      description: 'The owner actions on PTR-047 (decided 29 September, writers pass; DM4); the rows themselves
        are created and re-matched by the reconciliation job. `assign` sets `assigneePrincipalId` and moves
        `open` -> `investigating`. From `investigating`: `markCorrected` (TICVAI''s record was wrong and has
        been corrected at source; `note` says what), `acceptDifference` (Finance writes the difference off; within
        tolerance or on the partner''s evidence), `adjust` (money moves: a commission adjustment line or a ledger
        adjustment through Finance, named in `adjustmentRef`), `dispute` (the partner contests TICVAI''s figure;
        opens a partner case of category `settlementDispute` or `commissionDispute` and returns its id), `escalate`.
        From `disputed` or `escalated` the three closing actions settle it. `matched` is the job''s, never an
        action. An action that does not fit the status answers 409; `acceptDifference` above the tenant''s write-off
        tolerance needs a `note` (422 without one).'
      tags:
      - subscription
      x-ticvai-permission: SETTLEMENT_RECONCILE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
