      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: writers pass; DM4 (control.partner_commission_line is written by the commission
        calculation job; single-line hold/dispute had no operation); pack ''B2B, Reseller & OTA Partner Management_Reference.pdf''
        pp.47-49 (Commission Calculation, Adjustments, Settlement Status)'
      summary: Hold, release, dispute or reverse a single commission line
      description: 'The line actions on PTR-048 (decided 29 September, writers pass; DM4). Lines are created
        by the commission calculation job, never by hand, and a line in a batch otherwise moves with the batch
        (actOnPartnerSettlementBatch). `hold` takes a line that is not yet paid out of the run (`onHold`) with
        a `reason`; `release` puts a held line back to `reconciled`; `dispute` marks it `disputed` against a
        partner case (`caseId`); `resolveDispute` puts a disputed line back to `reconciled` when the amount stands;
        `reverse` reverses a disputed line decided against it (a replacement line, where one is due, is the
        job''s). **A paid line is never reversed**: a correction after payment is a new adjustment line (409).'
