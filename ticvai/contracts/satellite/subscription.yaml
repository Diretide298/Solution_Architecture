            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - assign
                  - markCorrected
                  - acceptDifference
                  - adjust
                  - dispute
                  - escalate
                assigneePrincipalId:
                  type: string
                  format: uuid
                  nullable: true
                  description: For assign
                adjustmentRef:
                  type: string
                  nullable: true
                  description: For adjust, the commission line or ledger adjustment that settles it
                note:
                  type: string
                  nullable: true
                  description: What was done and why, kept on the audit trail
