openapi: 3.1.0
info:
  title: TICVAI Subscription & Licensing
  version: 0.1.0
  x-ticvai-screen-count: 130
  x-ticvai-tier: satellite
  x-ticvai-module: 20 — Subscription & Licensing Management
  x-ticvai-requirements: 59
  x-ticvai-capabilities:
  - C74
  - C75
  - C95
  - C96
  x-ticvai-platforms:
  - P09 TICVAI Web
  description: "## What this contract covers\n**Control Plane. Runs outside any cell, because it provisions\
    \ cells.**\n| | | |---|---| | **Tier** | satellite | | **Matrix domain** | 20 — Subscription & Licensing\
    \ Management | | **Requirements** | ~59 | | **Capabilities** | C74, C75, C95, C96 | | **Consumed by**\
    \ | P09 TICVAI Web |\n## How to read this file\n**This file is a contract.** It is hand-authored and\
    \ it is the source of truth for one bounded context: server code, client code and mock servers are\
    \ generated from it, never the other way round. If a field is not here, it does not exist.\n**Contracts\
    \ are split into two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy,\
    \ identity,\n  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n\
    \  requires a formal change request, because every satellite has pinned against it.\n- **Satellite**\
    \ — a domain that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths`\
    \ are operations.** Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n\
    | Extension | Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From\
    \ one enum in `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the\
    \ seven-level hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected\
    \ terminal may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`,\
    \ `serverWins`, `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth:\
    \ service` (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**`security` arrays hold OAuth scopes.** Empty means \"this scheme, no scopes\" — for\
    \ bearer tokens there is nothing to list. Empty is not the same as absent: absent means unauthenticated.\n\
    \n## This context\nTenant lifecycle, subscription plans, module licensing, cell provisioning, usage\
    \ metering and billing. Domain 18 — 59 requirements. Capabilities C74, C75, C95, C96.\n**This is a\
    \ Control Plane contract.** It runs outside any tenant cell, because a service that provisions cells\
    \ cannot live inside one.\nPositions this encodes:\n- **Licensing is the source of module enablement.**\
    \ The White Label Builder reads it and\n  cannot enable what a tenant has not licensed. Two places\
    \ deciding what a tenant may use\n  is one place too many.\n- **A subscription grants; it never enables.**\
    \ Licensing says *may*; the tenant's own\n  configuration says *does*. Downgrading a plan does not\
    \ silently switch off a module\n  a venue is trading on — it flags the conflict and waits.\n- **Cell\
    \ placement is per region** (ADR-0014), and every region in a different country\n  must be placed\
    \ in its own jurisdiction. Provisioning enforces that rather than trusting\n  the operator.\n- **Metering\
    \ is separate from billing.** Usage is recorded continuously and priced\n  periodically. Conflating\
    \ them means a pricing change rewrites history.\n- Suspension is graceful and reversible; termination\
    \ is neither, and is deliberately\n  harder to reach.\n"
servers:
- url: https://{controlPlaneHost}/api/v1
  variables:
    controlPlaneHost:
      default: control.ticvai.local
security:
- bearerAuth: []
tags:
- name: tenant
- name: plan
- name: subscription
- name: licensing
- name: cell
- name: metering
- name: billing
paths:
  /onboarding-applications:
    post:
      operationId: submitOnboardingApplication
      x-ticvai-consumed-by:
        - "P09 ADM-380 Customer & Organization Registration"
        - "P17 SGN-002 Customer & Organization Registration"
        - "P17 SGN-020 Billing & Legal Entity Information"
      summary: A prospect signs themselves up
      description: 'BL-165. **The operator-led path assumes somebody at Softlabs decided this tenant exists.**
        This is the other one.

        **Nothing is provisioned until verification passes** — an unverified application that provisions
        a cell is a cell somebody has to clean up, and cells are not cheap to clean up.

        **Trial is a state on the application, not a separate plan.** A prospect trials the plan they
        will pay for, so conversion is a date change rather than a migration — and conversion is the moment
        least worth adding risk to.

        **The billing entity is saved on the application** (Chinmay, 2 October, workbook Q223; CHG-CSA-030):
        `billingEntity` carries the company to be invoiced and its documents before verification; nothing is
        provisioned until it is verified.

        '
      tags:
      - subscription
      x-ticvai-permission: TENANT_CONFIGURE
      security:
      - bearerAuth: []
      - prospectAuth: []
      x-ticvai-audience:
      - public
      - prospect
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingApplication'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Submitted, pending verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingApplication'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /venue-type-templates:
    get:
      operationId: listVenueTypeTemplates
      x-ticvai-consumed-by:
        - "P09 ADM-425 Venue Template Application"
      summary: Starting configurations by venue kind
      description: '**A water park and a theatre need different defaults**, and asking a prospect to configure
        300 settings from empty is asking them to leave.

        **A template is a starting point and not a constraint** — everything it creates is editable the
        moment it lands.

        '
      tags:
      - subscription
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      - public
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueTypeTemplate'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /partners/{partnerId}/users:
    parameters:
    - name: partnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listPartnerUsers
      x-ticvai-api-scope: partner.read
      summary: Users beneath a partner, by branch
      tags:
      - subscription
      x-ticvai-permission: PARTNER_VIEW
      x-ticvai-audience:
      - staff
      - partner
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerUser'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createPartnerUser
      x-ticvai-consumed-by:
        - "P10 PTR-025 Partner Contacts & User Administration"
      x-ticvai-api-scope: partner.write
      summary: Add a user to a partner branch
      description: '2.7.51. **Quota and credit resolve nearest-ancestor-wins**, like configuration — a
        branch with no limit inherits the agency''s.

        **A partner with `canManageUsers` does this themselves**, because a venue administering every
        travel agent''s staff list is a venue doing the agency''s HR.


        **It also creates the user''s contact** (control.partner_contact, status `invited`, linked by `principalId`),
        which becomes `active` when the invitation is accepted (states/partner-contact.yaml); `partnerId` is
        the control.partner row (decided 29 September, writers pass; DM4).

        '
      tags:
      - subscription
      x-ticvai-permission: PARTNER_MANAGE
      x-ticvai-audience:
      - staff
      - partner
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUser'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerUser'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /channel-listings:
    get:
      operationId: listChannelListings
      x-ticvai-consumed-by:
        - "P08 BO-013 Channel & Distribution"
      summary: What is listed on which OTA
      tags:
      - subscription
      x-ticvai-permission: PARTNER_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelListing'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setChannelListing
      x-ticvai-consumed-by:
        - "P08 BO-013 Channel & Distribution"
      summary: List a product on a channel, with its own allocation
      description: 'BL-076. **An OTA pulls a feed, caches it and sells against the cache**, so the gap
        between pushes is the oversell window and the allocation is the bound on it.

        **Publishing the full envelope to an OTA means the OTA will sell it**, and the venue discovers
        at the gate.

        '
      tags:
      - subscription
      x-ticvai-permission: PARTNER_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelListing'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListing'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /partners/{partnerId}/invoice-export:
    parameters:
    - name: partnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: exportPartnerInvoice
      summary: Partner invoice and settlement, in an ERP format
      description: '2.7.41 and 5.12.7, BL-077. **`subscription.generateInvoice` bills a tenant for the
        platform — a different ledger from invoicing a partner for tickets sold.**

        SAP is named twice in the matrix. **The export is a format, not an integration**: `finance` already
        has the ledger, the legal entities and the tax codes, and what was missing was a way to get a
        partner''s month out of it in a shape SAP will read.

        **Idempotent on the period.** A month exported twice must produce one invoice, because the second
        import is what creates a duplicate liability in somebody else''s system.

        '
      tags:
      - subscription
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - periodFrom
              - periodTo
              - format
              properties:
                periodFrom:
                  type: string
                  format: date
                periodTo:
                  type: string
                  format: date
                format:
                  type: string
                  enum:
                  - sapIdoc
                  - csv
                  - json
                  - ubl
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /ai-usage/settle:
    post:
      operationId: settleAiUsage
      x-ticvai-consumed-by:
        - "P09 ADM-461 Consumption Reconciliation & Billing Approval"
      x-ticvai-audience:
      - staff
      summary: Turn metered AI interactions into a billable usage record
      description: '**The link between the meter and the invoice, and it did not exist.** It lives in
        `subscription` rather than `ai` because **AI meters and subscription bills** — an AI operation
        writing a billing record would break the read-only rule in ADR-0020, which is how this landed
        in the wrong contract on 17 August. `ai.interaction` recorded tokens and cost per call; `recordUsage`
        wrote a billing line; nothing joined them.

        Runs per tenant per period, aggregating from the interaction log and writing one `control.usage_record`
        per audience — **staff and guest billed as separate lines**, because they behave differently and
        a venue needs to see which one moved. The record carries the `audience`, and `generateInvoice` turns
        each into a `metered` invoice line (metric `aiTokens`) at the AI module''s metered price (decided 29
        September: AI token usage is a metered line).

        **Reads the primary, not the analytical replica.** `ai.interaction` sits on the analytical store
        (ADR-0020) and replica lag at period close would invoice a number that changes after it is sent.

        '
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_BILLING_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenantId
              - periodStart
              - periodEnd
              properties:
                tenantId:
                  type: string
                  format: uuid
                periodStart:
                  type: string
                  format: date
                periodEnd:
                  type: string
                  format: date
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Settled
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                    format: uuid
                  periodStart:
                    type: string
                    format: date
                  periodEnd:
                    type: string
                    format: date
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        audience:
                          type: string
                          enum:
                          - staff
                          - guest
                        interactions:
                          type: integer
                        promptTokens:
                          type: integer
                        completionTokens:
                          type: integer
                        providerCost:
                          allOf:
                          - $ref: ../shared/common.yaml#/components/schemas/Money
                          description: What the provider charged us.
                        billedAmount:
                          allOf:
                          - $ref: ../shared/common.yaml#/components/schemas/Money
                          description: 'What the tenant is charged. **Separate from cost**, so a margin,
                            a floor or a cap can be applied without losing what it actually cost.

                            '
                  capApplied:
                    type: boolean
                    description: '**Whether a cap or fair-use limit bit in this period.** A tenant cannot
                      stop guests asking questions, so an uncapped per-token charge is a bill they cannot
                      control — see CF-14.

                      '
        '409':
          description: 'Already settled for this period. **Settling twice would invoice twice**, and the
            idempotency key alone does not protect a re-run with a different key.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /subscriptions/{subscriptionId}/cancel:
    parameters:
    - name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelSubscription
      x-ticvai-audience:
      - staff
      summary: Terminate a tenant subscription
      description: '**Always a decision, never a timer.** A `pastDue` subscription continues to serve
        indefinitely (CF-61: degrade, never stop) and only a person ends it.

        The effective date matters: terminating at period end is ordinary, terminating immediately closes
        a venue that may have guests inside it.

        '
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_BILLING_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - effective
              properties:
                reason:
                  type: string
                  enum:
                  - tenantRequested
                  - nonPayment
                  - breachOfTerms
                  - migrated
                  - other
                effective:
                  type: string
                  enum:
                  - immediately
                  - atPeriodEnd
                  - onDate
                effectiveDate:
                  type: string
                  format: date
                dataRetentionDays:
                  type: integer
                  description: 'How long the cell is kept before decommissioning. **A tenant who returns
                    within the window keeps their data**; beyond it they do not.

                    '
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /partner-agreements:
    get:
      operationId: listPartnerAgreements
      x-ticvai-consumed-by:
        - "P10 PTR-011 Quote Management"
        - "P10 PTR-017 Commission Statement"
      x-ticvai-api-scope: partner.read
      x-ticvai-audience:
      - staff
      - partner
      summary: Commercial agreements with B2B partners
      description: '2.7.32. **The object every other partner operation assumes and none of them had.**
        Credit limits, channel allocations and settlement all existed; the agreement that says what a
        partner is entitled to did not.

        '
      tags:
      - subscription
      x-ticvai-permission: PARTNER_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: expiringWithinDays
        in: query
        description: '2.7.37. **An agreement that lapses silently keeps selling at rates nobody agreed
          to**, which is discovered at settlement rather than at sale.

          '
        schema:
          type: integer
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/PartnerAgreementStatus'
      responses:
        '200':
          description: Agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerAgreement'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createPartnerAgreement
      x-ticvai-audience:
      - staff
      summary: Agree commercial terms with a partner
      description: '2.7.31, 2.7.32, 2.7.36. Net rates or commission, credit terms, which products, which
        channels, and when it expires.

        **Rate and commission are alternatives, not both.** A partner buys at a net rate and keeps the
        margin, or sells at face value and is paid commission — and a partner on both is being paid twice
        for the same sale.

        '
      tags:
      - subscription
      x-ticvai-permission: PARTNER_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerAgreement'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreement'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /partner-agreements/{agreementId}:
    parameters:
    - name: agreementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updatePartnerAgreement
      x-ticvai-audience:
      - staff
      summary: Amend, suspend or terminate
      description: '**Amending creates a version; it does not overwrite.** An order placed last week was
        placed under last week''s rate, and settlement must be able to say which.

        '
      tags:
      - subscription
      x-ticvai-permission: PARTNER_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerAgreement'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Amended as a new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreement'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /partner-registrations:
    post:
      operationId: registerPartner
      security: []
      x-ticvai-agreed: '29 September: system-design review SD-056 (an anonymous write needs a challenge and a rate limit)'
      x-ticvai-audience:
      - anonymous
      summary: A business applies to become a partner
      description: '2.7.33. **Self-registration with approval**, not an account somebody creates by hand.
        Routes through `approvals`, because whether to trade with a company is a commercial decision with
        a threshold and an approver.


        **What it writes (decided 29 September, writers pass; DM4).** It creates the partner master row,
        control.partner, in status `applicant` (states/partner.yaml: a self-registered partner starts there,
        never at `lead`), and the onboarding application, control.partner_application with its first review
        tasks, at stage `application`, linked by `partnerId`. `companyName` lands in `legalEntityName` and
        `tradingName` (defaulting to `companyName`), `taxRegistrationNumber` in `taxVatNumber`, `contactName`/`contactEmail`
        become the application''s primary contact. The approvals request is raised against the application;
        no agreement is created here, the first one is drafted after approval (`setAgreementContractTerm`).
        **The 202 body is therefore the application** (status `submitted`, with `partnerId` and `approvalRequestId`),
        no longer a pending PartnerAgreement.


        **Anonymous, so challenged and rate-limited** (system-design review SD-056, 29 September). It
        stays unauthenticated (`security: []`: an applicant has no account yet), and every request
        carries `challengeToken`, the answer to the sign-up page''s bot challenge, verified server-side
        before anything is written; a missing, expired or failed token is refused 422 `challenge-failed`.
        Requests are limited per source address and per `contactEmail` domain, refused 429 with
        `Retry-After`, so a script cannot fill the partner review queue.

        '
      tags:
      - subscription
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
