      description: 'The case actions on PTR-049 (decided 29 September, writers pass; DM4), one `action` per call
        (states/partner-case.yaml): `assign` (`open` -> `assigned`, sets `ownerPrincipalId`), `startInvestigation`
        (`assigned` -> `investigating`), `waitForPartner` and `waitForInternal` (from `investigating`; time waiting
