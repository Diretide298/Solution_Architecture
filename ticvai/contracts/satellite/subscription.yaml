    OnboardingApplication:
      type: object
      x-ticvai-persistence: control.onboarding_application
      description: 'BL-165. **`subscription` handles the operator-led path well and has no prospect-led
        one.** `createTenant` and `provisionCell` assume somebody at Softlabs decided this tenant exists.

        A prospect signing themselves up is a different shape: **nothing is provisioned until they are
        verified**, because an unverified application that provisions a cell is a cell somebody has to
        clean up.

        '
      required:
      - id
      - companyName
      - contactEmail
      - status
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          nullable: true
        countryCode:
          type: string
        venueTypeTemplateId:
          type: string
          format: uuid
          nullable: true
          description: '**A water park and a theatre need different defaults**, and asking a prospect
            to configure 300 settings from empty is asking them to leave.

            '
        requestedPlanId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - submitted
          - verifying
          - approved
          - provisioning
          - active
          - rejected
          - abandoned
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
          description: '**Trial is a state, not a plan.** A tenant on trial has the plan they will pay
            for and a date by which they must — modelling it as a separate plan means migrating them at
            conversion, which is the moment least worth adding risk to.

            '
        rejectionReason:
          type: string
          nullable: true
        provisionedTenantId:
          type: string
          format: uuid
          nullable: true
        billingEntity:
          $ref: '#/components/schemas/BillingEntity'
          description: '**The company to be invoiced, saved on the application before verification** (Chinmay,
            2 October, workbook Q209 and Q223; CHG-CSA-030). Nothing is provisioned until the application is verified;
            on provisioning it becomes the tenant''s billing entity (`getBillingEntity`).'
    BillingEntity:
      type: object
      x-ticvai-persistence: control.billing_entity
      description: '**The company TICVAI invoices for a tenant, with its trade licence and VAT certificate** (Chinmay,
        2 October, workbook Q209: "a new billing-entity record in the subscription contract"; DI-830; CHG-CSA-030).
        One per tenant, mastered in the control plane. `legalName` and `countryCode` are required on save (400
        otherwise); they are not marked required here so the record can ride, optional, on an onboarding
        application. **Documents** (workbook Q210, the default): a trade licence always; a VAT certificate when a
        `trn` is entered. Which documents a country requires is configurable per country (tenancy `RegionSettings`);
        the default is that rule.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: Null while it rides on an onboarding application.
        legalName:
          type: string
          maxLength: 300
        tradeLicenceNumber:
          type: string
          maxLength: 100
          nullable: true
        trn:
          type: string
          maxLength: 30
          nullable: true
          description: The tax registration number; entering one makes the VAT certificate required.
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        address:
          type: string
          maxLength: 1000
          nullable: true
        invoiceEmail:
          type: string
          format: email
          nullable: true
        documents:
          x-ticvai-persistence-kind: valueObject
          x-ticvai-persistence-column: jsonb
          type: array
          description: The trade licence and, where a TRN is entered, the VAT certificate, each a stored file
            with its verification.
          items:
            type: object
            properties:
              documentType:
                type: string
                enum:
                - tradeLicence
                - vatCertificate
              fileRef:
                type: string
                nullable: true
              expiryDate:
                type: string
                format: date
                nullable: true
              verificationStatus:
                type: string
                enum:
                - missing
                - uploaded
                - verified
                - rejected
                - expired
        missingDocuments:
          type: array
          readOnly: true
          description: The documents the country's rule requires that are not yet uploaded and verified.
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    VenueTypeTemplate:
      type: object
      x-ticvai-persistence: control.venue_type_template
      description: 'BL-165. **What a venue of this kind starts with.** Product kinds, price list structure,
        access profiles, roles, report set.

        **A template is a starting point and not a constraint** — everything it creates is editable the
        moment it lands, which is the difference between a template and a plan tier.

        '
      required:
      - id
      - name
      - venueKind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        venueKind:
          type: string
          enum:
          - themePark
          - waterPark
          - museum
          - theatre
          - stadium
          - arena
          - zoo
          - aquarium
          - cinema
          - attraction
          - mixed
        seedsProductKinds:
          type: array
          items:
            type: string
        seedsRoles:
          type: array
          items:
            type: string
        seedsAdmissionProfiles:
          type: array
          items:
            type: string
        seedsReports:
          type: array
          items:
            type: string
    PartnerUser:
      type: object
      x-ticvai-persistence: control.partner_user
      description: '2.7.51, BL-075. **A partner was a flat account** — `registerPartner` created one and
        nothing created a user beneath it.

        The requirement asks for Master Agency, Branch, Department and User with permissions, quotas and
        credit cascading down. **That is a scope tree, and `tenancy` already has one** — so this is a
        principal on a partner branch rather than a new hierarchy.

        **Quota and credit resolve the way configuration does: nearest ancestor wins.** A branch with
        no credit limit inherits the agency''s, which is the behaviour a partner expects and would otherwise
        have to be enforced by hand.

        '
      required:
      - id
      - partnerId
      - principalId
      - branchScopePath
      properties:
        id:
          type: string
          format: uuid
        partnerId:
          x-ticvai-references: control.partner
          type: string
          format: uuid
          description: The partner (control.partner) the user belongs to. **Resolves to control.partner**, not
            to control.partner_agreement as the naming convention guessed before the partner master existed
            (decided 29 September, writers pass; DM4)
        principalId:
          type: string
          format: uuid
        role:
          type: string
          nullable: true
          description: 'The partner role shown for the user: Partner Administrator, Booking Agent, Supervisor,
            Finance User, Reporting User or API Administrator (pack p.12). The permissions the role grants stay
            RBAC data in identity; this is the label listPartnerContactUser shows (decided 29 September, writers
            pass; DM4)'
        salesLocation:
          type: string
          nullable: true
          description: The sales location (branch office or desk) the user sells from, shown on listPartnerContactUser
            (decided 29 September, writers pass; DM4)
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          nullable: true
          description: Currency the user sells in, ISO 4217; empty means the agreement's settlementCurrency
            (decided 29 September, writers pass; DM4)
        accountExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the user's account expires; empty for no expiry. An expired account cannot sign
            in and shows as `expired` on listPartnerContactUser (decided 29 September, writers pass; DM4)
        branchScopePath:
          type: string
          description: 'The branch this user sits on. **An ltree, like every other scope path**, so a
            report at agency level rolls up its branches without anybody writing a join.

            '
        allocationQuota:
          type: integer
          nullable: true
          description: 'Units this branch may sell. **Null inherits the parent''s**, and a quota set at
            branch level below the agency''s is a deliberate restriction rather than an error.

            '
        creditLimitOverride:
          $ref: ../shared/common.yaml#/components/schemas/Money
        canManageUsers:
          type: boolean
          default: false
          description: '**Partner-managed access control** — 2.7.51 asks for it, and a venue administering
            every travel agent''s staff list is a venue doing the agency''s HR.

            '
    ChannelListing:
      type: object
      x-ticvai-persistence: control.channel_listing
      description: 'BL-076. **The integration register marks *Resellers & OTA* as covered, and that is
        true of the commercial model and not of the integration.** Agreements, allocations and credit
        exist; the exchange with Viator, Klook, Headout and GetYourGuide does not.

        **An OTA is not a partner portal.** A partner logs in and books; an OTA pulls a feed, caches it,
        and sells against the cache — **so the failure mode is a sale against stale inventory**, and everything
        below exists to bound that.

        '
      required:
      - id
      - channelName
      - productId
      - status
      properties:
        id:
          type: string
          format: uuid
        channelName:
          type: string
          enum:
          - viator
          - klook
          - headout
          - getYourGuide
          - tiqets
          - expedia
          - other
        productId:
          type: string
          format: uuid
        externalProductRef:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - live
          - paused
          - delisted
        allocationUnits:
          type: integer
          nullable: true
          description: '**Inventory published to this channel, not the venue''s whole capacity.** An OTA
            given the full envelope will sell it, and the venue discovers at the gate.

            '
        priceListId:
          type: string
          format: uuid
        adapter:
          type: string
          nullable: true
          enum:
          - viatorApi
          - klookApi
          - headoutApi
          - getYourGuideApi
          - tiqetsApi
          - octoStandard
          - generic
          description: 'BL-067. **The commercial model was complete and the wire was not** — `PartnerAgreement`
            carries rates, commission, credit and channels, and `alternative-codes` maps a partner SKU
            so an inbound order matches. What was missing is which protocol speaks to whom.

            **`octoStandard` is the one that matters.** OCTo is the open connectivity standard the OTAs
            converged on, and a venue that implements it once reaches several channels — **a per-OTA adapter
            is a per-OTA maintenance commitment**, and naming the standard first is what keeps that list
            from growing.

            '
        adapterCredentialRef:
          type: string
          nullable: true
          description: A vault reference. **Never the credential**, following the rule ADR-0020 set for
            AI providers.
        pushIntervalMinutes:
          type: integer
          default: 15
          description: 'How often availability is pushed. **The gap between pushes is the oversell window**,
            and a channel selling a high-demand slot needs a shorter one than a channel selling a museum
            on a Tuesday.

            '
        guestDataScope:
          type: string
          enum:
          - none
          - nameOnly
          - nameAndContact
          - full
          default: nameOnly
          description: '**What the OTA passes through, and it is usually less than the venue wants.**
            A ticket arriving with no contact detail cannot be reissued or notified of a cancellation,
            and the venue should know that at listing time rather than at the gate.

            '
        lastPushedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    PartnerAgreementStatus:
      type: string
      enum:
      - pendingApproval
      - active
      - expiringSoon
      - expired
      - suspended
      - terminated
    PartnerRateMode:
      type: string
      description: '**Alternatives, not both.** A partner buys at a net rate and keeps the margin, or
        sells at face value and is paid commission. Both is being paid twice for the same sale.

        '
      enum:
      - netRate
      - commission
    PartnerAgreement:
      type: object
      x-ticvai-persistence: control.partner_agreement
      x-ticvai-retired-columns:
      - partner_name
      required:
      - partnerId
      - rateMode
      - validFrom
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        partnerId:
          x-ticvai-references: control.partner
          type: string
          format: uuid
          description: The partner (control.partner) this agreement is with. The agreement carries the terms;
            control.partner carries who the partner is and whether it may trade. **Resolves to control.partner**,
            not to platform.tenant as the naming convention guessed before the partner master existed (decided
            29 September, writers pass; DM4)
        partnerName:
          type: string
          readOnly: true
          x-ticvai-persisted: false
          description: The partner's trading name, **read from control.partner.trading_name** (Partner.tradingName)
            when the agreement is returned and never stored on the agreement, so a renamed partner cannot show
            two names (decided 29 September, writers pass; DM4)
        version:
          type: integer
          readOnly: true
          description: '**Amending creates a version.** An order placed last week was placed under last
            week''s rate, and settlement must be able to say which.

            '
        status:
          $ref: '#/components/schemas/PartnerAgreementStatus'
        rateMode:
          $ref: '#/components/schemas/PartnerRateMode'
        commissionPercent:
          type: number
          nullable: true
        volumeTiers:
          type: array
          deprecated: true
          x-ticvai-persisted: false
          description: '**Retired: the tiers are rows of control.partner_rate_volume_band** (`PartnerRate.volumeBands`,
            written by setPartnerRateNet), one set per rate row, so a tier can differ by product, venue or channel.
            Accepted and ignored on write; not returned once the bands exist. `volumeWindow` below still says
            over which window the bands count (decided 29 September, writers pass; DM4).


            2.7.57. **A tier that changes at a threshold needs the sale to look back at cumulative
            volume, and nothing did.** Flat net rates and per-channel price lists cover the simple case
            and stop there.

            **The window is the argument, not the tier.** A partner who sells 400 in January and 400 in
            February is either a 400-tier partner twice or an 800-tier partner once, and the two are different
            money. `volumeWindow` says which.

            '
          items:
            type: object
            required:
            - fromUnits
            - commissionPercent
            properties:
              fromUnits:
                type: integer
              commissionPercent:
                type: number
              appliesRetrospectively:
                type: boolean
                default: false
                description: '**Whether crossing a tier reprices what came before it.** Retrospective
                  is what a partner assumes and prospective is what a venue budgets for — it has to be
                  stated.

                  '
        volumeWindow:
          type: string
          nullable: true
          enum:
          - calendarMonth
          - calendarQuarter
          - calendarYear
          - agreementYear
          - rolling12Months
        seasonalRates:
          type: array
          deprecated: true
          x-ticvai-persisted: false
          description: '**Retired: a seasonal rate is a control.partner_rate row** with `seasonalRate: true`
            and its own `effectiveFrom`/`effectiveTo` (`PartnerRate`, written by setPartnerRateNet); the most
            specific row in force wins. Accepted and ignored on write (decided 29 September, writers pass; DM4).


            Rates that change by date range. **Separate from the volume tier because they
            compound** — a peak-season rate at a high volume tier is both, and a single rate table cannot
            say so.

            '
          items:
            type: object
            properties:
              from:
                type: string
                format: date
              to:
                type: string
                format: date
              commissionPercent:
                type: number
        segmentTier:
          type: string
          nullable: true
        brandingAssetId:
          type: string
          format: uuid
          nullable: true
          description: '2.7.x, BL-078. **A reseller selling a venue''s tickets under their own brand is
            a second scope level white-label does not have** — `BrandIdentity` and `setTheme` are tenant-scoped
            throughout.

            **Co-branding rather than replacement.** The venue''s identity stays on the ticket because
            the ticket admits to the venue; the partner''s sits beside it.

            '
        storefrontSubdomain:
          type: string
          nullable: true
        sponsorship:
          type: object
          nullable: true
          description: 'BL-050. **Sponsorship inventory is sellable capacity of a different kind** — logo
            placements, hospitality allocations, naming rights. It is closer to a partner agreement than
            to a product: **a sponsor buys a relationship for a season, not a ticket for a date.**

            Modelled here rather than as a `ProductKind` because the commercial terms — the term, the
            exclusivity, the settlement — are the agreement''s, and duplicating them onto a product would
            mean two places to disagree.

            '
          properties:
            placements:
              type: array
              items:
                type: object
                properties:
                  surface:
                    type: string
                    enum:
                    - signage
                    - ticketFace
                    - appBanner
                    - emailFooter
                    - venueNaming
                    - zoneNaming
                    - uniform
                    - printedMap
                  quantity:
                    type: integer
                  exclusive:
                    type: boolean
                    default: false
                    description: '**Exclusivity is the expensive word.** A sponsor paying for category
                      exclusivity has bought the absence of a competitor, and a second agreement breaching
                      it is a legal problem rather than a scheduling one.

                      '
            hospitalityAllocation:
              type: integer
              nullable: true
              description: Tickets or cabanas included. **Issued as invitations, not sales** — no revenue
                attaches.
            categoryExclusivity:
              type: string
              nullable: true
        netRates:
          type: array
          deprecated: true
          x-ticvai-persisted: false
          description: '**Retired: net rates are rows of control.partner_rate** (`PartnerRate` with `pricingModel:
            netRate`, `netRate` and the `maxDiscountPercent` guardrail), written by setPartnerRateNet. Per product or category; absent means the commission applies across the catalogue.
            Accepted and ignored on write (decided 29 September, writers pass; DM4)'
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
                nullable: true
              categoryId:
                type: string
                format: uuid
                nullable: true
              netPrice:
                $ref: ../shared/common.yaml#/components/schemas/Money
              maxDiscountPercent:
                type: number
