      summary: Clusters in a region
      description: 'A cluster is one or more identical cells serving a region. Scaling out is **launching
        another identical cluster and placing tenants on it** — not growing one indefinitely, because
        a single primary has a ceiling that arrives during an event rather than at a planning meeting.

        '
      tags:
      - cell
      x-ticvai-permission: PLATFORM_CELL_VIEW
