        '200':
          description: The validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipProductValidationApprovalPublicationVersioView'
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: approveMembershipProductValidation
      x-ticvai-consumed-by:
        - "P08 BO-284 Membership & Annual Pass Command Center"
        - "P08 BO-293 Membership Product Validation, Approval, Publication & Versioning"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: pack ''Membership___Annual_Pass_Management_Reference.pdf'' pp.17-18 (13.1.10
        Configuration Validation, Dependency Health, Preview, Approval Workflow, Effective Dating, Impact Analysis,
        Publication, Audit, AI Configuration Review); MoM silent; our build plan'
      summary: Membership Product Validation, Approval, Publication & Versioning
      description: '**Drafted from the workshop pack; the shape below is read out of it, not invented.** Membership   Annual
        Pass Management, page 17. The screen says: Provide the final governance layer before a membership/pass
        configuration becomes commercially available.


        **Agreed (decided 29 September, readiness close-out).** the twelve validation checks became validationChecks
        and dependency health became validationIssues; the eight publication targets became publicationTargets;
        impact figures typed; examples and stray words dropped; the input now carries only the decision (product,
        version, action, effective date, migration policy, reason). Approval Workflow (pack p.17): draft ->
        review -> commercial approval -> operational approval where required -> approved -> scheduled/published;
        a product cannot publish while a validationChecks entry fails. Audit (p.18) records who, what, previous
        and new version, reason, approval and effective date in the lifecycle history.


        **Suspend and reinstate (decided 29 September, writers pass; DM4).** The Suspend quick action on BO-284
        is `action: suspend` here: allowed only on an `active` version and only with a `reason`; the version
        moves to `suspended`, selling stops on every channel at once, and members already holding it keep
        their entitlements until their own expiry. `action: reinstate` moves a `suspended` version back to
        `active`; refused once its `effectiveTo` has passed (the retire job takes it from there). Neither goes
        through approvals: a suspension is an operational stop, reversible, and audited in subscription.membership_product_history
        like every other action. Any other action on the wrong status answers 409 `invalid-product-transition`.'
      tags:
      - drafted
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipProductValidationApprovalPublicationVersioInput'
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Membership Product Validation, Approval, Publication & Versioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipProductValidationApprovalPublicationVersioView'
        '409':
          description: The action is not allowed from the version's current status (`invalid-product-transition`,
            states/membership-product.yaml) (decided 29 September, writers pass; DM4)
          x-ticvai-problem-types:
          - invalid-product-transition
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: A suspend sent without a reason (`reason-required`) (decided 29 September, writers pass;
            DM4)
          x-ticvai-problem-types:
          - reason-required
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
      x-ticvai-step-up: mfa
      x-ticvai-step-up-carrier: session   # the MFA step-up verified on the caller's session (CHG-RUL-020)
      x-ticvai-step-up-reason: Platform-level product state, across tenants.
