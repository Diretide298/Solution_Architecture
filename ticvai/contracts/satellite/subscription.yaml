        cell holding forty small tenants may be quieter than one holding three, and a two-week event with
        30,000 attendees a day is a small tenant commercially and a large one here.

        Reported per dimension so the constrained one is visible. A cell short of connections and long
        on storage needs a different response from one short of both.

