      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '409':
          description: 'Downgrade conflicts with current usage. The response names every module and limit
            that would be violated. Or the subscription is `expired` and cannot be reactivated
            (`subscription-expired`, audit STATE-SUBSCRIPTION); start a new one.

            '
          x-ticvai-problem-types: [subscription-expired]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DowngradeConflictProblem'
        '422':
          description: '`effectiveFrom` was sent and is not the date the change must take effect: today for an
            upgrade, the next renewal for a downgrade (`effective-date-not-allowed`, audit R214 (1)). Or the plan
            is a custom package private to another tenant (`plan-not-offered`, decided 29 September).

            '
          x-ticvai-problem-types:
          - effective-date-not-allowed
          - plan-not-offered
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
