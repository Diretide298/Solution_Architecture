      summary: Create a subscription plan
      description: 'A plan bundles licensed modules, entitlement limits and a cell tier. Plans are versioned:
        existing subscriptions stay on the version they were sold, so a price change never applies retroactively.

        **A plan is a package, and billing is per module (decided 29 September, Chinmay).** TICVAI sells
        three standard packages (`packageKind` `standard`) and may make custom ones (`custom`); every package
        is invoiced one line per licensed module at the price TICVAI configured for that module on the
        platform (`setModuleListing`), plus `basePrice` as the package''s own fee where it has one (it may be
        zero). **A custom package can be private to one tenant** (`offeredToTenantId`): it is listed and sold
        to that tenant only. `offeredToTenantId` on a `standard` package is refused (422).

