components:
  schemas:
    SubscriptionPlanRecommendation:
      type: object
      x-ticvai-persistence: none — computed from control.usage_record, the plan, tier and add-on limits and capacity
        packs, priced as simulateCommercialPackage prices
      description: One plan-fit move for a tenant, priced against staying as it is (20.8.4, 20.8.5; decided 29
        September, build pass, group G2).
      required:
      - kind
      - reason
      - projectedMonthlyCost
      properties:
        kind:
          type: string
          enum:
          - upgrade
          - downgrade
          - addModule
          - removeModule
          - removeAddOn
          - capacityPack
        targetPlanId:
          type: string
          format: uuid
          nullable: true
          description: The tier to move to, for `upgrade` and `downgrade`.
        moduleCode:
          type: string
          nullable: true
          description: For `addModule` and `removeModule`.
        addOnCode:
          type: string
          nullable: true
          description: For `removeAddOn`.
        billableUnit:
          type: string
          nullable: true
          description: The unit that drives it (for `upgrade`, `downgrade` and `capacityPack`), as `getLicenceEnforcement`
            names it.
        capacityPackSize:
          type: integer
          nullable: true
          description: For `capacityPack`, the pack size that covers the projected overage.
        projectedMonthlyCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        projectedSaving:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          nullable: true
          description: Against staying as it is over the horizon, monthly. Set where the move saves money.
        projectedAddedCost:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          nullable: true
          description: Where the move costs more than today but less than the alternative named in `comparedWith`.
        comparedWith:
          type: string
          enum:
          - currentPackage
          - projectedOverage
          - nextTier
          - capacityPack
          description: What the move is cheaper than. An `upgrade` is compared with paying the projected overage; a
            `capacityPack` with the next tier.
        reason:
          type: string
          maxLength: 500
          description: One sentence a person can repeat to the customer.
        basis:
          type: object
          description: The numbers it rests on.
          properties:
            usageWindowDays:
              type: integer
            usedAverage:
              type: number
              nullable: true
            usedPeak:
              type: number
              nullable: true
            projectedPeak:
              type: number
              nullable: true
            currentLimit:
              type: number
              nullable: true
            targetLimit:
              type: number
              nullable: true
            lastUsedAt:
              type: string
              format: date-time
              nullable: true
              description: For `removeModule` and `removeAddOn`, the last metered use; null for never.
        applyWith:
          type: string
          enum:
          - setSubscription
          - addCapacityPack
          description: The operation a person uses to carry it out (after `previewSubscriptionChange` for
            `setSubscription`).
    IssueCreditNoteRequest:
      type: object
      x-ticvai-persistence: none — request only
      required:
      - reasonCode
      - settlement
      - lines
      properties:
        reasonCode:
          type: string
          enum:
          - billingError
          - serviceCredit
          - disputeResolution
          - goodwill
          - other
        reason:
          type: string
          maxLength: 500
          nullable: true
        settlement:
          type: string
          enum:
          - offsetNextInvoice
          - refund
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - invoiceLineIndex
            properties:
              invoiceLineIndex:
                type: integer
                minimum: 0
                description: The line of the invoice being credited, by its position in `SubscriptionInvoice.lines`.
              quantity:
                type: number
                minimum: 0
                nullable: true
                description: Part of the line's quantity; null with `amount`, or for the whole line.
