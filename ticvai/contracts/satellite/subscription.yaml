      x-ticvai-consumed-by:
        - "P09 ADM-378 Executive AI Commercial Intelligence"
        - "P09 ADM-452 Operational Usage & Threshold Monitor"
        - "P09 ADM-465 AI Upgrade, Downgrade & Commercial Right-Sizing"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (20.8.4, 20.8.5 plan-fit and cost-saving recommendations to
        existing tenants); shape follows getLicenceEnforcement, priced as simulateCommercialPackage prices'
      summary: Which plan, module or pack would fit this tenant better, and what it would cost or save
      description: '20.8.4, 20.8.5 (decided 29 September, build pass, group G2). **Plan fit from usage, for TICVAI
        staff.** For one tenant, the moves its usage argues for, each priced against staying as it is:

        - **`upgrade`**: projected usage over `horizonMonths` (the `getLicenceEnforcement` projection per billable
        unit) crosses the current tier''s allowance, and the next tier costs less than the projected overage. Names
        the tier (`targetPlanId`).

        - **`capacityPack`**: the same overage is cheaper covered by a capacity pack than by the next tier (a
        seasonal peak rather than growth); names the unit and pack size.

        - **`downgrade`**: usage sat below the next tier down''s allowance for the whole window and is projected to
        stay there.

        - **`addModule`**: the tenant repeatedly hits a capability a module provides (denied calls or feature
        requests against `getEntitlementUsage`) and the module costs less than the workaround it is paying for.

        - **`removeModule`** and **`removeAddOn`**: enabled and unused for the window (no metered use, no active
        configuration).


        **Every price is the one `simulateCommercialPackage` would quote** for the tenant''s package with that one
        change, so a recommendation and a quote cannot disagree. **Rules over the usage record, not a model**, so it
        is explainable line by line (`basis`).


        **A person acts**: an account manager applies an accepted recommendation through `previewSubscriptionChange`
        then `setSubscription`, or `addCapacityPack`; nothing is changed by this read and the tenant is not told by it.

        '
