      x-ticvai-audience:
      - staff
      summary: Generate an invoice for a period
      description: 'Prices the metered usage against the subscription''s plan version. Idempotent per
        tenant and period — running twice does not double-bill, which matters because it will be scheduled.

        **The lines, per module (decided 29 September, Chinmay).** One `module` line for each module the
        tenant licensed (the package''s modules and each add-on), at the module''s price set on the platform
        (`setModuleListing`); a `basePlan` line for the package''s own fee where it has one; `overage` for
        limits exceeded. **AI token usage is a `metered` line** (metric `aiTokens`, `moduleCode` the AI
        module): the tokens `settleAiUsage` recorded for the period beyond the plan''s `includedAiTokens`,
