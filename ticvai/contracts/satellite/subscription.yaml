      summary: Issue a credit note against a tenant invoice, in full or in part
      description: >
        **A credit note is its own tax document** (20.7.7): it has its own number from its own gapless
        sequence per issuing legal entity (the rule R152 set for invoices, applied to a second
        sequence), names the invoice it credits, and carries its own lines, tax and total. **The
        invoice is never edited**: it stays as issued, and what has been credited against it is the sum
        of its credit notes (`SubscriptionInvoice.creditedTotal`).

        **Full or partial.** Lines may credit whole invoice lines or part of one (a quantity or an
        amount); tax is recalculated on the credited lines at the invoice's rates. The credits against
        one invoice can never exceed its total (422). A draft or cancelled invoice cannot be credited
        (409): a draft is changed by regenerating it, and a cancellation already credited it in full
        (`cancelInvoice`). `settlement` says whether the credit reduces the tenant's next invoice or is
        refunded against a payment already received. A dispute resolved in the tenant's favour
        (`resolveInvoiceDispute`) is settled with one of these.
