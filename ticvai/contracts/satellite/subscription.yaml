  /burst-environments/{burstEnvironmentId}/reconcile:
    post:
      operationId: reconcileBurstEnvironment
      summary: Move the orders into the permanent platform
      description: '**The open half of CF-162, and the reason an environment cannot simply be deleted.**


        **Same three properties as `syncOrders` one layer up**: an environment id in place of a device
        id, a monotonic sequence that orders the replay, and idempotent application so a retry is safe.
        **Rejections land in `sync.rejection`** and are worked afterwards — kept, because thirty thousand
        silently lost sales is worse than thirty thousand reported ones.


        **Resumable.** A reconciliation interrupted at order 18,000 of 30,000 continues from 18,000 rather
        than starting again — which is what the sequence is for.'
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - *id003
      - *id002
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fromSequence:
                  type: integer
                  nullable: true
                  description: Resume point. Omitted means resume from the last applied.
                batchSize:
                  type: integer
                  default: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: integer
                  rejected:
                    type: integer
                  lastSequence:
                    type: integer
                  complete:
                    type: boolean
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /burst-environments/{burstEnvironmentId}/decommission:
    post:
      operationId: decommissionBurstEnvironment
      summary: Tear it down
      description: '**Refused unless the environment is `reconciled`.** An environment torn down before
        its orders reach the permanent platform has lost real money and real tickets, and **`decommissioned`
        is only reachable through `reconciled`** for that reason.


        **Automatic when `autoDecommission` is set.** $24 for two hours, $282 for a day, $8,587 for a
