          description: Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMigrationPlan'
        '409':
          description: 'Region mismatch, schema versions differ, or the tenant has open shifts. A tenant
            mid-trade cannot be moved — a cutover during a shift loses the drawer.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/MigrationBlockedProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tenant-migrations/{migrationId}/execute:
    parameters:
    - name: migrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: executeTenantMigration
      x-ticvai-audience:
      - staff
      summary: Move the tenant
      description: 'Copies the tenant''s data to the target, verifies row counts and checksums, re-points
        cross-region links, then cuts over and marks the source rows for retention rather than deleting
        them.

        **The source is retained, not dropped.** A cutover that goes wrong needs somewhere to go back
        to, and a tenant''s entire history is not something to delete on the same day it moved.

        Requires step-up and a stated cutover window.

        '
      tags:
      - cell
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cutoverWindowStart
              - cutoverWindowEnd
              - stepUpToken
              properties:
                cutoverWindowStart:
                  type: string
                  format: date-time
                cutoverWindowEnd:
                  type: string
                  format: date-time
                stepUpToken:
                  type: string
                retainSourceDays:
                  type: integer
                  default: 30
      responses:
        '202':
          headers:
            X-Consistency-Token:
