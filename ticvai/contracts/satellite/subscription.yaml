      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - retentionDays
              - confirmTenantCode
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                retentionDays:
                  type: integer
                  minimum: 30
                  maximum: 2555
                confirmTenantCode:
                  type: string
                  description: Must match the tenant's code. Guards against the wrong tenant.
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Termination scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminationSchedule'
        '400':
          description: Confirmation code does not match
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: Unsettled ledger balances exist
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
