      operationId: launchCellCluster
      x-ticvai-audience:
      - staff
      summary: Launch an identical cluster
      description: 'Provisions a cell identical in shape, region and schema version to an existing one,
        so tenants can be placed on it or moved to it.

        **Identical matters.** A cluster running a different schema version is not additional capacity
        — it is a second thing to maintain, and a tenant moved onto it lands on a version the platform
        did not intend.

        '
      tags:
      - cell
      x-ticvai-permission: PLATFORM_CELL_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - regionId
              - kind
              - modelledOnCellId
              properties:
                regionId:
                  type: string
                  format: uuid
                kind:
                  $ref: '#/components/schemas/CellKind'
                modelledOnCellId:
                  type: string
                  format: uuid
                  description: 'The cell to replicate — shape, tier and **schema version**. Copied rather
                    than specified, so the two cannot diverge at birth.

                    '
                name:
                  type: string
      responses:
        '202':
          headers:
            X-Consistency-Token:
