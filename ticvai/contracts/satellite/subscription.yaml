        '422':
          description: The credit would take the invoice's credited total above its total, or a line names no line of the invoice
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
