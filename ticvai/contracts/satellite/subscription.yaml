      operationId: setSubscription
      x-ticvai-consumed-by:
        - "P09 ADM-008 Subscription & Plan Management"
        - "P09 ADM-410 Contract & Billing Cycle Selection"
        - "P09 ADM-417 Subscription Confirmation & Commercial Activation"
        - "P09 ADM-463 Subscription & Commercial Change Management"
        - "P17 SGN-019 Contract & Billing Cycle Selection"
        - "P17 SGN-024 Subscription Confirmation & Commercial Activation"
      security:
      - bearerAuth: []
      - prospectAuth: []
      x-ticvai-audience:
      - staff
      - prospect
      summary: Assign or change a subscription
      description: 'Upgrades take effect immediately. **Downgrades are checked first**: if the target
        plan licenses fewer modules than the tenant currently has enabled, or lower limits than they are
        currently using, the change is refused and the conflicts are named.

        Silently switching off a module a venue is trading on is not an acceptable consequence of a billing
        change.

        **When a change takes effect, and what is prorated** (decided 28 September, audit R214 (1)). **An
        upgrade takes effect immediately and is always prorated**: the tenant pays the difference for the
        rest of the current term. **A downgrade takes effect at the next renewal** (`renewsAt`), is not
        prorated, and until then is held on `Subscription.scheduledChange`. `effectiveFrom` is therefore
        set by the server, today for an upgrade and `renewsAt` for a downgrade; a request that sends any
        other date is refused with 422 `effective-date-not-allowed`.

        **A tenant''s first plan starts `active`**, not in `trial`, with `startsAt` today and `renewsAt`
        one term (`billingPeriod`) after it (decided 28 September, audit R214 (2)). A trial is a separate,
        explicit choice.

        **A cancelled subscription is reactivated here, on the same record, only within its paid period**
        (decided 28 September, audit STATE-SUBSCRIPTION). After the period ends it is `expired` and this
        call refuses with 409 `subscription-expired`; the tenant needs a new subscription.

        '
      tags:
      - subscription
      x-ticvai-permission: PLATFORM_TENANT_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
