openapi: 3.1.0
info:
  title: TICVAI — Wallet Configuration
  version: 1.0.0
  x-ticvai-screen-count: 43
  x-ticvai-tier: satellite
  x-ticvai-module: 4 — Bundles and Promotions
  x-ticvai-platforms:
  - P08 Venue Management
  - P09 TICVAI Web
  description: '**Two vocabularies, and confusing them is why the wallet was built five times.**

    > `Wallet Type` — *who owns a wallet*: guest, registered customer, family, parent, child,
    corporate, school, employee.
    >
    > `Credit Type` — *what value sits inside one*: cash, refund, bonus, promotional, gift card,
    membership, loyalty, ride, attraction.

    The 27 August workshop settled this and the pack''s acceptance condition states the consequence:
    **"new wallet credit types can be introduced through configuration without development changes."**

    ## Why this is a contract and not part of `retail`

    **`retail` operates a wallet; this configures the system of them.** `getWallet`, `topUpWallet`,
    `adjustWallet`, `transferWalletBalance` and `listWalletTransactions` already exist and stay where
    they are — they move money in an account that exists.

    Nothing said **what kinds of account may exist, what value may sit in them, in what order it is
    spent, when it expires, who may spend somebody else''s, and what the unspent remainder is worth to
    the business.** Those are ten boards, and they are configuration.

    ## The three things the operating half cannot express

    **Consumption order.** A guest with bonus credit expiring Friday, a gift card and cash in one
    wallet pays with *something*, and which one is a commercial decision worth real money. Spend the
    cash first and the bonus expires unused, which is revenue the venue keeps and a guest who feels
    cheated; spend the bonus first and the opposite. **A balance is a number and cannot hold this.**

    **Credit lots.** Expiry is not a property of a wallet, it is a property of a tranche. Fifty
    dirhams of promotional credit issued in March and fifty issued in June expire on different days,
    and a single balance of one hundred cannot say which sixty are left. **FEFO across lots is the
    only model that survives a refund.**

    **Ownership that is not one person.** A parent allocating an allowance to a child, a corporate
    account with a spending policy per employee, a school group — the money is in one place and the
    authority to spend it is distributed, dated and capped.

    ## What it deliberately does not own

    **Not gameplay.** `games` owns readers, play pricing, what a reader accepts, how
    redemption credits are earned from a score, and the prize catalogue they are spent on.
    **The card is a credential, not a wallet** — blocking a lost card leaves the balance
    untouched (Game & Ride board 7.7). The value is here; the play is there.

    **Not loyalty accrual.** `marketing-crm` awards points against a completed order.
    Loyalty and redemption credit are different currencies earned by different events.

    **Not the money movement.** Authorisation, capture and release run through `orders`
    stored-value operations (CF-126). This decides the rules; those execute them.

    **Not the ledger.** `finance` owns the chart of accounts and the journals. **The wallet''s
    unspent balance is a liability owed to a customer** — 27 August minuted that explicitly — and
    this maps it to an account rather than keeping its own books.

    '
servers:
- url: https://api.ticvai.com/v1
paths:
  /wallet-types:
    get:
      operationId: listWalletTypes
      x-ticvai-consumed-by:
        - "P08 BO-1083 Wallet Command Center"
        - "P08 BO-1084 Wallet Type Library"
        - "P08 BO-1174 Wallet API Catalogue & Endpoint Configuration"
      summary: The kinds of wallet that may exist — who owns one
      description: 'Board 1.2. Guest, registered customer, family, parent, child, corporate, school,
        employee.

        **The type decides the rules, not the person.** A child wallet is not a customer wallet with a
        lower limit; it has an owner who is not the holder, a funding source that is somebody else, and
        spending controls a parent sets.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Wallet types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletType'
    post:
      operationId: createWalletType
      x-ticvai-consumed-by:
        - "P08 BO-1084 Wallet Type Library"
        - "P08 BO-1085 Wallet Creation & Provisioning Rules"
      summary: Define a kind of wallet
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletType'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletType'
  /wallet-types/{walletTypeId}:
    parameters:
    - name: walletTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateWalletType
      x-ticvai-consumed-by:
        - "P08 BO-1085 Wallet Creation & Provisioning Rules"
        - "P08 BO-1086 Wallet Ownership & Account Association"
        - "P08 BO-1087 Wallet Currency & Monetary Configuration"
        - "P08 BO-1089 Wallet Feature Profile"
        - "P08 BO-1090 Wallet Lifecycle Configuration"
        - "P08 BO-1091 Wallet Numbering, Identity & Digital Credentials"
      summary: Change a kind of wallet
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletType'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletType'
        '409':
          description: Live wallets exist that the change would invalidate
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /credit-types:
    get:
      operationId: listCreditTypes
      x-ticvai-consumed-by:
        - "P08 BO-1088 Credit & Balance Type Configuration"
        - "P08 BO-1103 Stored Value & Credit Command Center"
        - "P08 BO-415 Wallet & Credit Type Configuration"
        - "P08 BO-722 Prepaid Minute Package & Customer Balance Configuration"
      summary: The kinds of value that may sit in a wallet
      description: 'Board 1.6, and **the acceptance condition of the whole pack depends on this being a
        table:** *"new wallet credit types can be introduced through configuration without development
        changes."*

        Cash, refund, bonus, promotional, gift card, membership, loyalty, ride and attraction credit
        are rows. **Game credit is one of them and not a wallet system**, which is what the 27 August
        cross-check resolved — the six types scoped separately on the Softlabs side resolve into this
        list.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Credit types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditType'
    post:
      operationId: createCreditType
      x-ticvai-consumed-by:
        - "P08 BO-1088 Credit & Balance Type Configuration"
        - "P08 BO-1104 Credit Type Definition Studio"
        - "P08 BO-415 Wallet & Credit Type Configuration"
      summary: Define a kind of credit, without a release
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditType'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditType'
  /credit-types/{creditTypeId}:
    parameters:
    - name: creditTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateCreditType
      x-ticvai-consumed-by:
        - "P08 BO-1088 Credit & Balance Type Configuration"
        - "P08 BO-1104 Credit Type Definition Studio"
        - "P08 BO-1105 Credit Issuance Rule Configuration"
        - "P08 BO-1108 Expiry & Validity Policy Configuration"
        - "P08 BO-420 Bonus Validity & Expiry Configuration"
      summary: Change a kind of credit
      description: '**Changing expiry or refundability does not reach credit already issued.** A lot
        carries the terms it was issued under, because retro-expiring somebody''s gift card is the kind
        of change that ends up in a regulator''s inbox.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditType'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditType'
  /credit-types/{creditTypeId}/eligibility:
    parameters:
    - name: creditTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setCreditEligibilityRules
      x-ticvai-consumed-by:
        - "P08 BO-1106 Credit Usage & Eligibility Rules"
        - "P08 BO-399 Wallet & Credit Acceptance Mapping"
        - "P08 BO-419 Bonus Usage Restrictions"
      summary: Where this credit may be spent, and on what
      description: 'Board 3.4, and it supersedes the gaming pack''s *Wallet & Credit Acceptance
        Mapping* — **acceptance is where credit may be spent, not where it is loaded from.**

        Ride credit that buys a meal is a configuration error with a real cost; attraction credit that
        cannot buy the attraction is a queue at the desk. This is the rule that decides both.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditEligibility'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditEligibility'
  /credit-consumption-policy:
    get:
      operationId: getCreditConsumptionPolicy
      x-ticvai-consumed-by:
        - "P08 BO-1107 Consumption Priority Engine"
        - "P09 ADM-604 Stored Value, Gift Card & Voucher Tender Controls\t97"
      summary: Which credit is spent first
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditConsumptionPolicy'
    put:
      operationId: setCreditConsumptionPolicy
      x-ticvai-consumed-by:
        - "P08 BO-1107 Consumption Priority Engine"
        - "P08 BO-1110 Split Tender & Multi-Credit Consumption"
      summary: The order credit is drawn down in
      description: 'Boards 3.5 and 3.7. **A commercial decision worth real money, and a balance cannot
        hold it.**

        A guest with bonus credit expiring Friday, a gift card and cash in one wallet pays with
        something. Spend the cash first and the bonus expires unused — revenue the venue keeps and a
        guest who feels cheated. Spend the bonus first and the opposite. **There is no neutral default**,
        which is why this is configuration and why the default here is expiry-first: it is the one that
        does not quietly profit from the guest forgetting.

        **FEFO runs within a type, the priority list runs across types**, and both are needed — a
        promotional lot expiring Friday should go before one expiring in June whatever the type order
        says.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditConsumptionPolicy'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditConsumptionPolicy'
  /credit-lots:
    get:
      operationId: listCreditLots
      x-ticvai-consumed-by:
        - "P08 BO-1109 FEFO & Credit Lot Management"
        - "P08 BO-416 Wallet Account & Balance View"
      summary: The tranches behind a balance, with their expiry
      description: 'Board 3.7. **Expiry is a property of a tranche, not of a wallet.** Fifty dirhams of
        promotional credit issued in March and fifty issued in June expire on different days, and a
        single balance of one hundred cannot say which sixty are left.

        **This is also the only model that survives a refund.** Refunding a purchase made from two lots
        has to put the money back in the lots it came from, or the guest gains or loses expiry they were
        never given.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: walletId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: includeExhausted
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditLot'
  /credit-lots/expire:
    post:
      operationId: expireCreditLots
      x-ticvai-consumed-by:
        - "P08 BO-1111 Credit Expiry, Extension & Forfeiture Operations"
        - "P08 BO-1130 Gift Card & Voucher Expiry Management"
      summary: Expire, extend or forfeit credit that has run out of time
      description: 'Board 3.9. **Expiry is an act with an accounting consequence, not a clock.** The
        moment unspent credit expires it stops being a liability and becomes breakage — recognised
        revenue — and `finance` needs to be told on a date somebody can defend.

        Extension exists because a venue will want it: a goodwill gesture, a closure, a dispute. **It is
        recorded with a reason and an approver** rather than done by editing a date.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - expire
                  - extend
                  - forfeit
                lotIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                asOf:
                  type: string
                  format: date
                  nullable: true
                extendToDate:
                  type: string
                  format: date
                  nullable: true
                reason:
                  type: string
                  nullable: true
                mode:
                  type: string
                  enum:
                  - preview
                  - apply
                  default: preview
      responses:
        '200':
          description: What would happen, or what did
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditExpiryResult'
  /credit-consumption/simulate:
    post:
      operationId: simulateCreditConsumption
      x-ticvai-consumed-by:
        - "P08 BO-1110 Split Tender & Multi-Credit Consumption"
        - "P08 BO-1112 Consumption Simulator, Validation & Rule Publication"
        - "P08 BO-1122 Shared Wallet Simulator, Monitoring & Audit"
        - "P08 BO-1142 Wallet Transaction Simulator, Monitoring & Channel Audit"
        - "P08 BO-1161 Security Rules Testing, Simulation & AI Sandbox"
      summary: Which credit this purchase would actually use
      description: 'Board 3.10. **Split tender across several credit types and lots is hard to reason
        about and trivial to get wrong**, and the guest finds out at the till. Simulation takes a basket
        and a wallet and returns the allocation the policy would produce, lot by lot.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - walletId
              - amount
              properties:
                walletId:
                  type: string
                  format: uuid
                amount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                productIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                venueId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: The allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAllocation'
  /wallet-funding-rules:
    get:
      operationId: getWalletFundingRules
      x-ticvai-consumed-by:
        - "P08 BO-1093 Funding Command Center"
      summary: How a wallet may be topped up
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletFundingRules'
    put:
      operationId: setWalletFundingRules
      x-ticvai-consumed-by:
        - "P08 BO-1094 Funding Method Configuration"
        - "P08 BO-1095 Top-Up Rule Configuration"
        - "P08 BO-1096 Channel & Funding Source Mapping"
        - "P08 BO-1097 Auto-Reload Configuration"
        - "P08 BO-1098 Recurring Funding Schedule"
        - "P08 BO-1099 Funding Authorization & Approval Rules"
        - "P08 BO-1101 Funding Limits & Velocity Controls"
        - "P08 BO-417 Top-Up Configuration"
        - "P08 BO-418 Top-Up Bonus Rule Configuration"
      summary: Amounts, channels, bonuses, limits and velocity
      description: '**Board 2 is the 27 August minute, one screen for one**, and the matrix agrees on
        four of them: auto-reload on threshold (4.3.28), calendar-based recurring funding (4.3.29,
        *"distinct from auto-reload"*), minimum and maximum amounts with velocity controls (4.3.30) and
        the funding audit trail (4.3.35).

        **Auto-reload and recurring funding are genuinely different** and the minute says so. One fires
        when the balance drops; the other fires on a date. A venue that models the second as the first
        cannot give a parent a weekly allowance.

        **Velocity limits are a fraud control, not a commercial one.** Ten top-ups of ninety-nine in an
        hour is a card being tested, and a daily cap expressed only in total value does not catch it.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletFundingRules'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletFundingRules'
  /wallet-funding/reversals:
    post:
      operationId: reverseWalletFunding
      x-ticvai-consumed-by:
        - "P08 BO-1100 Funding Reversal & Correction Management"
        - "P08 BO-1148 Reversal & Transaction Correction Management"
      summary: Undo a top-up, in full or in part
      description: 'Board 2.8. **A reversal is not a spend and must not look like one.** A top-up taken
        on the wrong wallet, a card that later charged back, a duplicated recharge — all three put the
        balance back, and all three have to be distinguishable from the guest having spent the money,
        because only one of them is breakage-eligible and only one is a chargeback.

        **Refuses where the credit has already been spent below the reversal amount**, naming what is
        left; taking a wallet negative is how a guest discovers a problem at a turnstile.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fundingTransactionId
              - reason
              properties:
                fundingTransactionId:
                  type: string
                  format: uuid
                amount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                reason:
                  type: string
                kind:
                  type: string
                  enum:
                  - error
                  - chargeback
                  - duplicate
                  - goodwill
      responses:
        '200':
          description: Reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAdjustment'
        '409':
          description: Already spent below the reversal amount
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /shared-wallets:
    get:
      operationId: listSharedWallets
      x-ticvai-consumed-by:
        - "P08 BO-1113 Shared Wallet Command Center"
        - "P08 BO-1119 Corporate Wallet & Organizational Hierarchy"
        - "P08 BO-1122 Shared Wallet Simulator, Monitoring & Audit"
      summary: Family, household and corporate structures
      description: 'Board 4. **The money is in one place and the authority to spend it is distributed.**
        A parent funds, a child spends, and neither model works if the wallet belongs to exactly one
        person.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: kind
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Shared wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharedWallet'
    post:
      operationId: createSharedWallet
      x-ticvai-consumed-by:
        - "P08 BO-1114 Shared Wallet Model Configuration"
        - "P08 BO-1119 Corporate Wallet & Organizational Hierarchy"
      summary: Set up a family, household or corporate wallet
      tags:
      - wallet
      x-ticvai-permission: WALLET_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedWallet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedWallet'
  /shared-wallets/{sharedWalletId}/members:
    parameters:
    - name: sharedWalletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setSharedWalletMembers
      x-ticvai-consumed-by:
        - "P08 BO-1115 Family & Household Structure Configuration"
        - "P08 BO-1116 Parent–Child Stored Value Distribution"
        - "P08 BO-1117 Allowance & Budget Allocation Engine"
        - "P08 BO-1118 Member Spending Controls & Permissions"
        - "P08 BO-1120 Corporate Budget, Policy & Approval Rules"
      summary: Allowances, budgets and what each member may spend on
      description: 'Boards 4.5 and 4.6. **An allowance is a cap with a refresh, not a transfer.** Moving
        fifty dirhams into a child''s wallet every Monday is a transfer and a parent has to remember it;
        a weekly allowance is a rule that runs.

        **Spending controls are per member and per category.** A parent who can cap the arcade but not
        the food outlet has a control that does not do what they wanted, and a corporate account without
        per-employee limits is a single point of expense failure.

        '
      tags:
      - wallet
      x-ticvai-permission: WALLET_OPERATE
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
