                $ref: '#/components/schemas/WalletConfigurationVersion'
  /wallets/{walletId}/transfer:
    parameters:
      - name: walletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transferWalletBalance
      x-ticvai-consumed-by:
        - "P01 WEB-021 Wallet & Gift Cards"
        - "P02 GST-071 Payment Methods"
        - "P08 BO-1116 Parent–Child Stored Value Distribution"
        - "P08 BO-1121 Shared Wallet Transfers & Balance Reallocation"
      summary: Send balance to another guest
      description: >
        BL-121. **Peer-to-peer transfer was declared on the wallet and unreachable** — a field with
        no operation behind it.

        **Only `cash` credit transfers.** Bonus, redemption and goodwill credit stay put, because a
        promotion that can be moved between guests is a promotion that can be sold — **and a venue
        that gave 50 dirhams of bonus credit has just funded a secondary market.**

        Both wallets must belong to the same tenant. **A transfer across tenants is a payment**, and
        it belongs on the payment path with everything that implies.
      tags: [retail]
      x-ticvai-permission: WALLET_OPERATE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toSubjectId, amount]
              properties:
                toSubjectId: { type: string, format: uuid }
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                message: { type: string, maxLength: 140, nullable: true }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
