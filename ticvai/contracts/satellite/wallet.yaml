        - "P08 BO-1165 Wallet Sub-Ledger & Balance Control"
        - "P08 BO-1166 Multi-Source Reconciliation Configuration"
        - "P08 BO-1167 Reconciliation Exception & Resolution Workbench"
        - "P08 BO-1172 Finance Validation, Reporting & Audit Center"
        - "P08 BO-1178 Synchronization, Retry & Resilience Configuration"
      summary: The wallet sub-ledger against the general ledger and the acquirer
      description: 'Boards 9.4 and 9.5. **Three sources have to agree and routinely will not.** The
