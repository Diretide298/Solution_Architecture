    get:
      operationId: getWalletLiability
      x-ticvai-consumed-by:
        - "P08 BO-1083 Wallet Command Center"
        - "P08 BO-1103 Stored Value & Credit Command Center"
        - "P08 BO-1123 Gift Card & Digital Benefit Command Center"
        - "P08 BO-1131 Gift Card Balance, Liability & Breakage Control"
        - "P08 BO-1163 Wallet Finance & Liability Command Center"
        - "P08 BO-1168 Gift Card Liability Management"
        - "P08 BO-1170 Wallet Financial Period & Closing Controls"
        - "P08 BO-1171 Wallet Analytics & Management Reporting"
        - "P08 BO-1182 Wallet Platform Health, Audit & Administration Center"
      summary: What is outstanding, and what is breakage
      description: 'Boards 9.5, 9.6 and 9.9. **The number the finance director asks for and the package
        could not produce.** Outstanding balance by credit type, aged; the portion expiring in the
        period; and breakage — credit that expired unspent and became revenue.

        **Breakage is recognised on a policy, not on expiry.** Some jurisdictions require the liability
        to be held long after the printed expiry, and a system that books revenue on the expiry date
        makes that decision by accident.

        '
