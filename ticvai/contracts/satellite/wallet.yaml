  /wallet-risk-rules:
    put:
      operationId: setWalletRiskRules
      x-ticvai-consumed-by:
        - "P08 BO-1153 Wallet Security & Risk Command Center"
        - "P08 BO-1154 Wallet Risk Policy Configuration"
        - "P08 BO-1155 Transaction Risk Scoring Engine"
        - "P08 BO-1156 Velocity & Behavioral Rule Configuration"
        - "P08 BO-1158 AI Fraud & Anomaly Detection Studio"
        - "P08 BO-1159 Automated Security Action Orchestration"
        - "P08 BO-1176 Wallet Events, Webhooks & Notification Orchestration"
      summary: Velocity, behaviour and what happens when a rule trips
      description: 'Boards 8.2 to 8.7. **A risk rule with no action is a report.** Each rule names what
        it does — score only, challenge, hold the transaction, freeze the wallet, raise a case — because
        the value of detection is entirely in the response.

        **Automated freezing needs a floor.** A rule that can freeze a wallet on a false positive will
