            the wallet in the path, with its `balanceAfter`. The recipient's balance is theirs and
            is not returned to the sender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransaction' }
        '409':
          description: >
            **Insufficient cash credit**, distinct from insufficient balance — a guest with 200 of
