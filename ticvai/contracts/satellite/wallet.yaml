            application/json:
              schema: { $ref: '#/components/schemas/WalletAutoReloadSetting' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: The venue has auto-reload disabled for this wallet type, or the wallet is suspended or
            closed.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: An amount outside the venue's funding rules, or a payment token that is not the holder's.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /wallets/{walletId}/exit-balance:
    parameters:
      - name: walletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWalletExitBalance
      x-ticvai-consumed-by:
        - "P01 WEB-021 Wallet & Gift Cards"
        - "P02 GST-011 Wallet Overview"
        - "P08 BO-416 Wallet Account & Balance View"
        - "P08 BO-487 Customer Wallet & Balance Summary"
      security:
      - guestAuth: []
      - bearerAuth: []
      x-ticvai-agreed: '29 September: our build plan (retrace 4.3.4 exit settlement); shape follows getWalletBalance'
      summary: What the holder owes or is owed on leaving
      description: >
        4.3.4. **The check at exit.** The balance including transactions still held offline on terminals,
        what is due where it is short (spend taken offline beyond the balance, or a post-paid credential),
        and what may be refunded where it is in credit, under the wallet refund policy.
      tags: [retail]
      x-ticvai-permission: WALLET_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: primary
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Balance at exit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletExitBalance' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /wallets/{walletId}/exit-settlement:
    parameters:
      - name: walletId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: settleWalletAtExit
      x-ticvai-consumed-by:
        - "P01 WEB-021 Wallet & Gift Cards"
        - "P02 GST-011 Wallet Overview"
        - "P08 BO-416 Wallet Account & Balance View"
        - "P08 BO-487 Customer Wallet & Balance Summary"
      x-ticvai-note: >-
        **Through the one balance writer** (system-design review SD-027, 29 September): the `wallet.balance` row is
        locked for one guarded statement and every movement is a `wallet.wallet_transaction` with its `walletId`,
        written in the same transaction.
      x-ticvai-lock: rowExclusive
      x-ticvai-lock-excludes:
      - "cache:idempotency"
      security:
      - guestAuth: []
      - bearerAuth: []
      x-ticvai-agreed: '29 September: our build plan (retrace 4.3.4 exit settlement); shape follows adjustWallet'
      summary: Settle a short balance, or refund a credit, when the holder leaves
      description: >
        4.3.4. **A wallet that went short must be settled before the holder is gone.** `collect` takes the
        amount due by card, cash or the stored card and brings the balance to zero; `refund` returns the
        refundable credit under the wallet refund policy; `waive` writes a small shortfall off with a reason
        (approval above the venue's threshold, as `adjustWallet`). Each settlement is recorded with who did
        it, the method and the payment or refund it made, and posts through the ledger as its payment or
        refund does. The amount settled is the one `getWalletExitBalance` returns at the time of the call,
        never an amount typed.
      tags: [retail]
      x-ticvai-permission: WALLET_OPERATE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [collect, refund, waive]
                method:
                  type: string
                  enum: [card, cash, storedCard, originalPayment]
                  description: How money is collected or refunded. A guest may use `card` or `storedCard` only.
                paymentTokenId: { type: string, format: uuid, nullable: true }
                reason: { type: string, maxLength: 500, nullable: true, description: Required with `waive`. }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Settled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletExitSettlement' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: Nothing is due or refundable, or the action does not match the balance (`collect` on a
            wallet in credit), or `waive` by a guest.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: The card was declined, or `waive` without a reason.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
