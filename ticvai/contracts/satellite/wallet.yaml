        one row per area per version, so a version can be compared field by field and put back.
        Written by `publishWalletConfiguration` (`mode: publish`); read by
        `diffWalletConfigurationVersion` and `restoreWalletConfigurationVersion` (data model, 29
        September).

        '
      required:
      - configurationVersionId
      - area
      - values
      - capturedAt
      - scopePath
      properties:
        id:
          type: string
          format: uuid
        configurationVersionId:
          type: string
          format: uuid
          x-ticvai-references: wallet.configuration_version
        area:
          type: string
          enum:
          - walletTypes
          - creditTypes
          - consumptionPolicy
          - fundingRules
          - channelRules
          - authenticationPolicy
          - transferRules
          - refundPolicy
          - riskRules
          - accountingMapping
          - reconciliationSources
          - integrationMappings
          description: The areas `WalletConfigurationDiff` compares.
        values:
          type: object
          additionalProperties: true
          description: The area's rows as published, in that area's own schema. The diff `path` is a
            path into this document.
        capturedAt:
          type: string
          format: date-time
        scopePath:
          type: string
    Wallet:
      # `credits[]` is not a column of `wallet.wallet`: each entry is a live lot in
      # `wallet.credit_lot`, so the lot table is named here as the child and a read of the wallet
      # reads both.
      x-ticvai-persistence: "wallet.wallet + wallet.credit_lot"
      type: object
      required: [subjectId, balance, currency, status]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        subjectId: { type: string, format: uuid }
        balance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        credits:
          type: array
          description: >
            4.3.5 and 4.3.19. **One balance and one bonus balance with one expiry could not express
            what the requirement asks for** — cash, bonus and redemption credit, each with its own
            expiry.

            **The expiries are the reason this is a list.** Cash a guest paid for should outlive a
            promotional credit they were given, and a single `expiresAt` either expires the money
            they paid or never expires the promotion.

            **Consumed first-expiry-first-out across all three** (4.3.19), which is also the order
            that is fairest to the guest — spend what is about to die before what is not.

            **One entry per `active` lot in `wallet.credit_lot`** for this wallet: `amount` is the
            lot's `remaining_amount`, `expiresAt` its `expires_at`, `sourceRef` its
            `source_reference`. `kind` and `isRefundable` are not stored on the lot; they come from
            the lot's credit type (`listCreditLots` returns the lots themselves).
          items:
            type: object
            required: [kind, amount]
            properties:
              kind:
                type: string
                enum: [cash, bonus, redemption, refund, goodwill]
                description: >
                  **`cash` is money the guest paid and the others are not.** That distinction
                  decides what is refundable, what expires, and what shows as a liability.
                x-ticvai-persisted: false   # from the lot's credit type, not a lot column
              amount:
                x-ticvai-column: remaining_amount
                $ref: '../shared/common.yaml#/components/schemas/Money'
              expiresAt: { type: string, format: date-time, nullable: true }
              sourceRef:
                type: string
                nullable: true
                x-ticvai-column: source_reference
              isRefundable:
                type: boolean
                default: false
                x-ticvai-persisted: false   # the credit type's `refundable`
                description: >
                  **True only for `cash`.** A guest cannot cash out a promotional credit, and a
                  wallet that lets them has given away the promotion twice.
        bonusBalance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Promotional value. Typically non-refundable and spent first.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status:
          type: string
          enum: [active, suspended, closed]
        homeCellName:
          type: string
          nullable: true
          description: >
            Where the authoritative balance lives. Present when the guest is linked across
            cells.
        expiresAt: { type: string, format: date-time, nullable: true }
        lastActivityAt: { type: string, format: date-time, nullable: true }
    WalletTransaction:
      x-ticvai-persistence: "wallet.wallet_transaction"
      type: object
      required: [id, kind, amount, balanceAfter, recordedAt]
      properties:
        id: { type: string }
        walletId:
          type: string
          format: uuid
          x-ticvai-references: wallet.wallet
          description: The wallet this movement is on (SD-027, 29 September). A shared wallet has many
            subjects, so the subject alone cannot say which balance moved.
        walletHoldId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: wallet.hold
          description: The hold a spend settled, where it came through `holdWalletFunds`.
        kind: { $ref: '#/components/schemas/WalletTransactionKind' }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        balanceAfter: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        orderId: { type: string, nullable: true }
        venueId: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        principalId: { type: string, format: uuid, nullable: true }
        recordedAt: { type: string, format: date-time }
    WalletTransactionKind:
      type: string
      enum: [topUp, spend, refund, adjustment, bonus, expiry, transfer]
    GiftCard:
      x-ticvai-persistence: "wallet.gift_card"
      type: object
      required: [cardCode, faceValue, balance, status, issuedAt]
      properties:
        cardCode: { type: string }
        kind: { type: string }
        faceValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        balance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        status:
          type: string
          enum: [issued, active, partiallyRedeemed, redeemed, expired, blocked]
        blockedReason: { type: string, nullable: true }
        issuedAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    IssueGiftCardRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, faceValue, kind]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [physical, digital]
        cardCode:
          type: string
          description: Required for physical cards, which are pre-printed. Generated for digital.
        faceValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        recipientEmail: { type: string, nullable: true }
        recipientPhone: { type: string, nullable: true }
        message: { type: string, maxLength: 500 }
        validMonths: { type: integer, minimum: 1 }
    # **Refusals carry their reason.** Each 409 below names the state or rule that refused it in
    # `refusedReason`, so a till or an app switches on a value instead of parsing `detail`.
    WalletTransferProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason]
          properties:
            refusedReason:
              type: string
              enum:
                - insufficientCashCredit   # only `cash` credit moves
                - senderWalletNotActive    # the wallet in the path is suspended or closed
                - recipientWalletNotActive
                - peerToPeerNotAllowed     # WalletTransferRules.peerToPeerAllowed is false
                - outsideSharedWallet      # WalletTransferRules.withinSharedWalletOnly
                - aboveTransferLimit       # maximumPerTransfer
                - aboveDailyLimit          # maximumPerDay
            transferableAmount:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: >
                The cash credit the sender could move now. Present with
                `insufficientCashCredit`, so the guest is told 10, not 200.
    WalletStateProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason, walletStatus]
          properties:
            refusedReason:
              type: string
              enum:
                - walletClosed
                - walletNotSuspended
                - balanceRemaining          # close with a balance and no settlement
            walletStatus:
              type: string
              enum: [active, suspended, closed]
              description: The wallet's status when the request was refused, as on `Wallet`.
            balance:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: What is still owed to the guest. Present with `balanceRemaining`.
    GiftCardProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason, cardStatus]
          properties:
            refusedReason:
              type: string
              enum:
                - cardNotActivated
                - cardBlocked
                - cardExpired
                - cardRedeemed
                - insufficientBalance
            cardStatus:
              type: string
              enum: [issued, active, partiallyRedeemed, redeemed, expired, blocked]
              description: The card's status when the request was refused, as on `GiftCard`.
            balance:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: What is left on the card. Present with `insufficientBalance`.
    GameCardLoadProblem:
      x-ticvai-persistence: "none — error shape"
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          required: [refusedReason]
          properties:
            refusedReason:
              type: string
              enum:
                - cardBlocked
                - cardExpired
                - cardTransferred
              description: The card's `status` in `games`, which is not `active`.
            transferredToCardCode:
              type: string
              nullable: true
              description: Where the balances went. Present with `cardTransferred`.
