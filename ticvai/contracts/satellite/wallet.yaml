    Wallet:
      x-ticvai-persistence: "wallet.wallet"
      type: object
      required: [subjectId, balance, currency, status]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        subjectId: { type: string, format: uuid }
        balance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        credits:
          type: array
          description: >
            4.3.5 and 4.3.19. **One balance and one bonus balance with one expiry could not express
            what the requirement asks for** — cash, bonus and redemption credit, each with its own
            expiry.

            **The expiries are the reason this is a list.** Cash a guest paid for should outlive a
            promotional credit they were given, and a single `expiresAt` either expires the money
            they paid or never expires the promotion.

            **Consumed first-expiry-first-out across all three** (4.3.19), which is also the order
            that is fairest to the guest — spend what is about to die before what is not.
          items:
            type: object
            required: [kind, amount]
            properties:
              kind:
                type: string
                enum: [cash, bonus, redemption, refund, goodwill]
                description: >
                  **`cash` is money the guest paid and the others are not.** That distinction
                  decides what is refundable, what expires, and what shows as a liability.
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              expiresAt: { type: string, format: date-time, nullable: true }
              sourceRef: { type: string, nullable: true }
              isRefundable:
                type: boolean
                default: false
                description: >
                  **True only for `cash`.** A guest cannot cash out a promotional credit, and a
                  wallet that lets them has given away the promotion twice.
        bonusBalance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Promotional value. Typically non-refundable and spent first.
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status:
          type: string
          enum: [active, suspended, closed]
        homeCellName:
          type: string
          nullable: true
          description: >
            Where the authoritative balance lives. Present when the guest is linked across
            cells.
        expiresAt: { type: string, format: date-time, nullable: true }
        lastActivityAt: { type: string, format: date-time, nullable: true }
    WalletTransaction:
      x-ticvai-persistence: "wallet.wallet_transaction"
      type: object
      required: [id, kind, amount, balanceAfter, recordedAt]
      properties:
        id: { type: string }
