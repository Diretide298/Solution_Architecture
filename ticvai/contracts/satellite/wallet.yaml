components:
  schemas:
    WalletBalance:
      type: object
      x-ticvai-persistence: wallet.balance
      description: '**Taken from the backend workbook, 20 September.** Stores the current wallet balance for fast checkout: available amount, held amount, and total amount.'
      required:
      - walletBalanceId
      - walletId
      - availableBalance
      - holdBalance
      - totalBalance
      - currencyCode
      - version
      - updatedAt
      properties:
        walletBalanceId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        availableBalance:
          type: number
        holdBalance:
          type: number
        totalBalance:
          type: number
        currencyCode:
          type: string
          maxLength: 10
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    WalletHold:
      type: object
      x-ticvai-persistence: wallet.hold
      description: '**Taken from the backend workbook, 20 September.** Temporarily reserves wallet money while an order/payment is in progress so the same balance cannot be spent twice.'
      required:
      - walletHoldId
      - walletId
      - walletHoldAmount
      - currencyCode
      - walletHoldStatus
      - expiresAt
      - createdAt
      properties:
        walletHoldId:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
          nullable: true
        paymentId:
          type: string
          format: uuid
          nullable: true
        walletHoldAmount:
          type: number
        currencyCode:
          type: string
          maxLength: 10
        walletHoldStatus:
          type: string
          maxLength: 20
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        capturedAt:
          type: string
          format: date-time
          nullable: true
        releasedAt:
          type: string
          format: date-time
          nullable: true
    WalletType:
      type: object
      x-ticvai-persistence: wallet.wallet_type
      description: 'Board 1.2. **Who owns a wallet** — the first of the two vocabularies.'
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        ownerKind:
          type: string
          enum:
          - guest
          - registeredCustomer
          - family
          - parent
          - child
          - corporate
          - school
          - employee
        storedValueCapability:
          type: boolean
          default: true
          description: 'Board 1.2. Whether this wallet holds a balance at all. A pure
            entitlement wallet — passes and vouchers, no money — does not.

            '
        topUpCapability:
          type: boolean
          default: false
        transferCapability:
          type: boolean
          default: false
        refundCapability:
          type: boolean
          default: false
        giftCardSupport:
          type: boolean
          default: false
        voucherSupport:
          type: boolean
          default: false
        membershipCreditSupport:
          type: boolean
          default: false
        wearableSupport:
          type: boolean
          default: false
        usageChannels:
          type: array
          description: '**Where this wallet may be used, declared on the type itself.**
            Board 1.2 configures online, POS, mobile-app and API usage per wallet type,
            and this is what lets one `topUpWallet` serve every caller: the operation is
            shared and the type says which channel may reach it. `WalletChannelRules`
            still governs the per-credential detail — PIN thresholds, offline floor
            limits — and this governs whether the channel is open at all.

            '
          items:
            type: string
            enum:
            - online
            - pos
            - mobileApp
            - api
            - kiosk
            - reader
        presetName:
          type: string
          description: '**The client''s own name for this composition** — "Resort Wallet",
            "Cashless Venue Wallet", "Closed-Loop Wallet". Board 1.2 lists thirteen such
            names as examples, not as kinds: they are combinations of `ownerKind`,
            `allowedCreditTypeIds` and `scopePath`. Naming the preset keeps the client''s
            vocabulary without hard-coding it into an enum.

            '
        holderMayDifferFromOwner:
          type: boolean
          default: false
          description: '**A child wallet''s owner is the parent.** Without this the model has to
            pretend a seven-year-old holds an account.

            '
        requiresIdentification:
          type: boolean
          default: false
        maximumBalance:
          $ref: ../shared/common.yaml#/components/schemas/Money
        allowedCreditTypeIds:
          type: array
          items:
            type: string
            format: uuid
        allowNegativeBalance:
          type: boolean
          default: false
        sharedStructureAllowed:
          type: boolean
          default: false
        lifecycleStates:
          type: array
          items:
            type: string
        numberingPattern:
          type: string
          nullable: true
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    CreditType:
      type: object
      x-ticvai-persistence: wallet.credit_type
      description: 'Board 1.6. **What value sits inside a wallet** — the second vocabulary, and the one
        the acceptance condition requires to be a table.

        '
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
          - cash
          - refund
          - bonus
          - promotional
          - giftCard
          - membership
          - loyalty
          - ride
          - attraction
          - redemption
          - fnb
          - retail
          - parking
          - event
          - other
        monetary:
          type: boolean
          default: true
          description: '**Loyalty points are not money.** A non-monetary credit has a conversion rate to
            money or it cannot be spent, and treating points as currency puts them on the balance sheet.

            '
        conversionRate:
          type: number
          nullable: true
        refundable:
          type: boolean
          default: false
          description: '**Promotional credit is not refundable and cash credit is.** A venue that refunds
            promotional credit to a card has converted marketing spend into cash.

            '
        transferable:
          type: boolean
          default: false
        expires:
          type: boolean
          default: false
        validityDays:
          type: integer
          nullable: true
        breakageEligible:
          type: boolean
          default: false
        ledgerAccountCode:
          type: string
          nullable: true
        priority:
          type: integer
          default: 0
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    CreditEligibility:
      type: object
      x-ticvai-persistence: wallet.credit_eligibility
      description: 'Board 3.4. **Where credit may be spent** — acceptance, not funding.'
      properties:
        creditTypeId:
          type: string
          format: uuid
        allowedVenueIds:
          type: array
          items:
            type: string
            format: uuid
        allowedOutletKinds:
          type: array
          items:
            type: string
        allowedProductCategoryIds:
          type: array
          items:
            type: string
            format: uuid
        excludedProductIds:
          type: array
          items:
            type: string
            format: uuid
        allowedChannels:
          type: array
          items:
            type: string
        minimumSpend:
          $ref: ../shared/common.yaml#/components/schemas/Money
        maximumPercentOfBasket:
          type: number
          nullable: true
          description: '**Caps how much of a purchase one credit type may cover.** A venue that lets
            promotional credit pay for everything has run a free day it did not intend.

            '
        validDaysOfWeek:
          type: array
          items:
            type: string
        scopePath:
          type: string
    CreditConsumptionPolicy:
      type: object
      x-ticvai-persistence: wallet.consumption_policy
      description: 'Boards 3.5 and 3.7. **There is no neutral default**, which is why this is
        configuration.

        '
      properties:
        strategy:
          type: string
          enum:
          - expiringFirst
          - typePriority
          - nonRefundableFirst
          - manual
          default: expiringFirst
          description: '**`expiringFirst` is the default because it is the one that does not quietly
            profit from the guest forgetting.**

            '
        typeOrder:
          type: array
          items:
            type: string
            format: uuid
        withinTypeOrder:
          type: string
          enum:
          - fefo
          - fifo
          - lifo
          default: fefo
        allowSplitTender:
          type: boolean
          default: true
        allowGuestChoice:
          type: boolean
          default: false
          description: '**Whether a guest may override the order at the till.** Rarely enabled, and the
            venues that want it want it badly.

            '
        scopePath:
          type: string
    CreditLot:
      type: object
      x-ticvai-persistence: wallet.credit_lot
      description: 'Board 3.7. **The tranche behind a balance.** Expiry belongs here, not on the wallet.'
      required:
      - id
      - walletId
      - creditTypeId
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        creditTypeId:
          type: string
          format: uuid
        issuedAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        remainingAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        sourceKind:
          type: string
          enum:
