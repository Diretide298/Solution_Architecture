      - guestAuth: []
      - bearerAuth: []
      summary: Send balance to another guest
      description: >
        BL-121. **Peer-to-peer transfer was declared on the wallet and unreachable** — a field with
        no operation behind it.

        **Only `cash` credit transfers.** Bonus, redemption and goodwill credit stay put, because a
        promotion that can be moved between guests is a promotion that can be sold — **and a venue
        that gave 50 dirhams of bonus credit has just funded a secondary market.**

        Both wallets must belong to the same tenant. **A transfer across tenants is a payment**, and
        it belongs on the payment path with everything that implies. A recipient outside the
        tenant is therefore the shared 404, exactly as an unknown one is.

        **The recipient is named one way or the other, never both.** `toWalletId` names the
        receiving wallet outright — the only way to reach a shared wallet (BO-1121), because a
        subject can hold their own wallet and sit in a family or corporate one. `toSubjectId` is
