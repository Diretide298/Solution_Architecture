        - "P08 BO-1147 Refund Routing & Credit Restoration Engine"
        - "P09 ADM-612 Refund Allocation & Original Tender Manager\t119"
      summary: What a refund puts back, and where
      description: 'Boards 7.4 and 7.5. **A refund to a wallet and a refund to a card are different
        promises**, and which one a guest gets should not depend on who is at the counter.

        **Restoration is to the lot, not to the balance.** A purchase made from an expiring promotional
        lot and a gift card, refunded, has to put each part back where it came from — otherwise the
        guest either gains expiry they were never given or loses it.

        '
      tags:
