                - challenge
                - refuse
                - allowAndFlag
                - raiseCase
        lists:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              kind:
                type: string
                enum:
                - blockCard
                - blockBin
                - blockEmail
                - blockDevice
                - allowAlways
              entries:
