        bankAccountReference:
          type: string
          nullable: true
        scopePath:
          type: string
    PaymentRiskRules:
      type: object
      x-ticvai-persistence: payments.risk_rules
      description: 'Boards 8.2 to 8.4. **Distinct from `wallet` risk** — this watches card
        presentation.

        '
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              code:
