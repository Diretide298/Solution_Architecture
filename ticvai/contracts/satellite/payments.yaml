            exceptions every night.

            '
        netOfFees:
          type: boolean
          default: true
        autoResolveBelowMinor:
          type: integer
          default: 0
          description: '**Rounding differences of a fil are not worth a person.** Above this they are.'
        scopePath:
          type: string
    MerchantAccount:
      type: object
      x-ticvai-persistence: payments.merchant_account
      description: 'Board 7.7. **Which legal entity gets the money, and when.**'
      required:
      - code
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        legalEntityId:
          type: string
          format: uuid
        venueIds:
          type: array
          items:
            type: string
            format: uuid
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          x-ticvai-persisted: false
          description: '**Resolved from the region, not stored** (ADR-0018). Region-scoped and not
            overridable below it, so a row in a UAE region is AED and cannot be anything else. Kept on
            the wire, removed from the table.

            '
        settlementCalendar:
          type: string
          enum:
