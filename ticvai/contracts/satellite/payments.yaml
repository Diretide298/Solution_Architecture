            schools and corporates — e.g. a 20–30% deposit upfront with the balance due on or before
            arrival."*

            '
        balanceDue:
          type: string
          enum:
          - onArrival
          - beforeArrival
          - onTerms
          default: beforeArrival
        atLimit:
          type: string
          enum:
          - refuse
          - warn
          - allowWithOverride
          default: allowWithOverride
        overrideApprovalRole:
          type: string
          nullable: true
        scopePath:
          type: string
    ReconciliationSource:
      type: object
      x-ticvai-persistence: payments.reconciliation_source
      description: 'Board 7.2. **A file that did not arrive looks like a day with no settlements.**'
      required:
      - code
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        connectionId:
          type: string
          format: uuid
          nullable: true
        transport:
          type: string
          enum:
          - sftp
          - api
          - email
          - manualUpload
        format:
          type: string
          enum:
          - csv
          - fixedWidth
          - json
          - xml
          - camt053
        expectedSchedule:
          type: string
          nullable: true
        expectedByTime:
          type: string
          nullable: true
        alertIfMissing:
          type: boolean
          default: true
        fieldMapping:
          type: object
          additionalProperties:
            type: string
        scopePath:
          type: string
    ReconciliationMatchingRules:
      type: object
      x-ticvai-persistence: payments.matching_rules
      description: 'Board 7.3. **Exact matching was never enough.**'
      properties:
        primaryKey:
          type: string
          enum:
          - providerReference
          - platformReference
          - authorisationCode
          - retrievalReference
        fallbackKeys:
          type: array
          items:
            type: string
        amountToleranceMinor:
          type: integer
          default: 0
        dateWindowDays:
          type: integer
          default: 2
