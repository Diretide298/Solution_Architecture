openapi: 3.1.0
info:
  title: TICVAI — Payment Orchestration
  version: 1.0.0
  x-ticvai-screen-count: 31
  x-ticvai-tier: satellite
  x-ticvai-module: 4 — Bundles and Promotions
  x-ticvai-platforms:
  - P08 Venue Management
  - P09 TICVAI Web
  description: '**`orders` takes a payment. This decides how.**

    `createPayment`, `capturePayment`, `voidPayment`, `createRefund`, `payByLink` and
    `storePaymentToken` already exist and stay where they are. They execute a transaction against a
    provider.

    **Nothing said which provider, or what happens when it is down.** That is eight boards: the
    method catalogue, the gateway directory, routing and failover, terminals and card-present,
    hosted checkout and tokenisation policy, mixed tender and B2B credit, reconciliation and
    settlement configuration, and risk.

    ## Why orchestration is its own context

    **A payment has two failure modes and they need opposite responses.** A declined card is the
    guest''s problem and the till should ask for another one. **A gateway that is timing out is the
    venue''s problem and every till should already be somewhere else** — and a system that cannot
    tell them apart will queue a hundred guests behind an outage nobody noticed.

    Routing, health and failover are therefore platform state rather than transaction state, and a
    transaction-scoped contract is the wrong place for them.

    **Cost is a routing input.** The same card can often go through two acquirers at different
    rates, and a venue processing at scale cares. `orders` has no reason to know this and should
    not learn.

    ## What it deliberately does not own

    **Not the transaction.** `orders` owns payments, refunds and their statuses.

    **Not the money in the ledger.** `finance` owns settlements, journals, FX and the chart of
    accounts. This configures how reconciliation sources are read; `finance` posts the result.

    **Not the terminal as a device.** `tenancy` owns device enrolment, credentials, firmware and
    tamper state as of 19 September. A payment terminal is a device there with a payment
    configuration here, and duplicating the register would give a venue two answers to *is this
    terminal still trusted*.

    **Not stored value.** `wallet` configures credit; `orders` moves it. Mixed tender here decides
    only the order and combination in which tenders may be presented.

    '
servers:
- url: https://api.ticvai.com/v1
paths:
  /dunning-policy:
    get:
      operationId: getDunningPolicy
      summary: How a failed recurring charge is chased
      description: '2.14.19-2.14.23, BL-100. **Recurring guest billing had auto-renewal and no
        answer for the renewal that fails**, which is the case that actually happens.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningPolicy'
    put:
      operationId: setDunningPolicy
      summary: Set the retry schedule and what happens when it runs out
      description: '2.14.19-2.14.23, BL-100. **Dunning retry and gateway retry are different axes
        and must never share a counter.** `setPaymentFailoverPolicy` governs retry *inside* one
        attempt — a timeout or a 5xx moves to the next provider within seconds, and a decline is
        final there. This governs retry *across days*: a fresh authorisation, the same guest, a
        card that may since have been replaced. **Both are called retry, and treating a dunning
        attempt as a failover attempt is how a guest is charged twice.**

        **A hard decline exits immediately and is never scheduled.** A closed account, a stolen
        card or a do-not-honour retried on a timetable is how a merchant ID gets flagged by the
        scheme — so the classification is explicit rather than "anything that was not a success".

        **Dunning cannot revoke admission.** `terminalAction` tops out at `suspendBilling`, and
        the reason is a person rather than a principle: a guest at a gate on a family day out,
        refused because a card expired and a retry ran at 3am. Ending someone''s access stays a
        staff decision with a name attached to it.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DunningPolicy'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningPolicy'
        '422':
          description: '**An attempt schedule that would breach the policy''s own guard** — more
            attempts than `maxAttempts`, two attempts inside `minimumHoursBetweenAttempts`, or a
            `terminalAction` the caller is not permitted to set.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /dunning-cases:
    get:
      operationId: listDunningCases
      summary: Recurring charges currently being chased
      description: '2.14.19-2.14.23, BL-100. **The work queue, and the number a venue actually
        manages by.** A dunning policy with no view of what it is doing is a schedule running in
        the dark.

        **Ordered by attempts remaining rather than by age**, because the ones about to exhaust
        are the ones somebody can still save by calling the guest.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/DunningState'
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DunningCase'
  /dunning-cases/{caseId}/resolve:
    post:
      operationId: resolveDunningCase
      summary: Stop chasing, with a reason
      description: 'BL-100. **The manual exit, and it is an operation rather than a status edit
        because somebody has to own it.** A guest who paid at a counter, a card replaced over the
        phone, or a venue writing the balance off — three different reasons that must be told
        apart afterwards.

        **`writeOff` does not erase the case**, which is why this is not a delete: a dunning case
        that vanishes leaves the finance side unable to say what happened to the money.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resolution
              properties:
                resolution:
                  type: string
                  enum:
                  - paidByOtherMeans
                  - cardReplaced
                  - writeOff
                  - cancelledByGuest
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningCase'
  /payment-methods:
    get:
      operationId: listPaymentMethods
      x-ticvai-consumed-by:
        - "P09 ADM-559 Payment Command Center\t7"
        - "P09 ADM-560 Payment Method Catalogue\t8"
        - "P09 ADM-567 Payment Policy, Governance & Approval Manager\t15"
        - "P09 ADM-590 Digital & Alternative Payment Method Manager\t71"
      summary: The methods this tenant can offer, and where
      description: 'Board 1.2. **A method is not a provider.** *Apple Pay* is a method; the acquirer
        behind it is a routing decision, and a venue that models them as one thing cannot change
        acquirer without re-configuring every till.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      parameters:
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      - name: channel
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
    post:
      operationId: createPaymentMethod
      x-ticvai-consumed-by:
        - "P09 ADM-560 Payment Method Catalogue\t8"
      summary: Add a payment method to the catalogue
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethod'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
  /payment-methods/{methodId}:
    parameters:
    - name: methodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updatePaymentMethod
      x-ticvai-consumed-by:
        - "P09 ADM-561 Payment Method Configuration\t9"
        - "P09 ADM-562 Channel & Touchpoint Payment Configuration\t10"
        - "P09 ADM-563 Venue, Location & Business Unit Payment Assignment\t11"
        - "P09 ADM-564 Currency & Payment Currency Configuration\t12"
        - "P09 ADM-565 Payment Eligibility & Availability Rule Builder\t13"
        - "P09 ADM-566 Payment Fees, Surcharges & Commercial Rules\t14"
        - "P09 ADM-590 Digital & Alternative Payment Method Manager\t71"
        - "P09 ADM-591 Digital Wallet & Mobile Payment Configuration\t72"
      summary: Change availability, fees and eligibility
      description: 'Boards 1.4, 1.7 and 1.8. **Eligibility, fees and availability travel together
        because they are one commercial decision.** Offering a method that costs 2.9% on a five-dirham
        ice cream is a decision, and it is made by restricting the method below a threshold rather than
        by removing it.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
  /payment-providers:
    get:
      operationId: listPaymentProviderConnections
      x-ticvai-consumed-by:
        - "P09 ADM-569 Payment Orchestration Command Center\t27"
        - "P09 ADM-570 Gateway, PSP & Acquirer Directory\t28"
        - "P09 ADM-572 Gateway Capability & Payment Method Mapping\t30"
      summary: Gateways, PSPs and acquirers, and what each can do
      description: 'Boards 2.2 and 2.4. **Capability mapping is the part that gets skipped and then
        causes an incident.** Not every provider supports every method, currency, partial capture,
        multi-capture, or refund beyond a window — and routing that does not know this will send a
        transaction to a provider that cannot take it.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Provider connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentProviderConnection'
    post:
      operationId: createPaymentProviderConnection
      x-ticvai-consumed-by:
        - "P09 ADM-570 Gateway, PSP & Acquirer Directory\t28"
        - "P09 ADM-571 Provider Connection & Adapter Configuration\t29"
      summary: Connect a provider
      description: '**Credentials are written and never read back.** The response carries a fingerprint
        so somebody can confirm which key is in use without the key being retrievable from a screen.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_PROVIDER_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentProviderConnection'
      responses:
        '201':
          description: Connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProviderConnection'
  /payment-providers/{connectionId}/test:
    parameters:
    - name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: testPaymentProviderConnection
      x-ticvai-consumed-by:
        - "P09 ADM-571 Provider Connection & Adapter Configuration\t29"
        - "P09 ADM-588 Terminal Simulator, Certification & AI Operations Advisor\t59"
      summary: Prove the connection works before anybody pays through it
      description: 'Board 3.10. **A provider configured and never tested is a provider that fails on
        the first real transaction**, in front of a guest, at the busiest moment somebody chose to
        switch it on.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_PROVIDER_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      responses:
        '200':
          description: What worked and what did not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResult'
  /payment-routing-rules:
    get:
      operationId: listPaymentRoutingRules
      x-ticvai-consumed-by:
        - "P09 ADM-573 Payment Routing Rule Builder\t31"
      summary: Which provider takes which transaction
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Routing rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentRoutingRule'
    put:
      operationId: setPaymentRoutingRules
      x-ticvai-consumed-by:
        - "P09 ADM-573 Payment Routing Rule Builder\t31"
        - "P09 ADM-574 Routing Strategy, Priority & Load Distribution\t33"
      summary: Route by method, currency, venue, amount, cost or share
      description: 'Boards 2.5 and 2.6. **Priority and load distribution are both needed and they are
        not the same.** Priority says *this acquirer unless it cannot*; distribution says *sixty per
        cent here, forty there* — which is how a venue keeps a second acquirer warm enough to fail over
        to.

        **A rule that would route to a provider lacking the capability is refused at configuration
        time**, not discovered at the till.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rules
              properties:
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/PaymentRoutingRule'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentRoutingRule'
        '409':
          description: A rule routes to a provider that cannot take it
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /payment-routing/simulate:
    post:
      operationId: simulatePaymentRouting
      x-ticvai-consumed-by:
        - "P09 ADM-578 Payment Routing Simulator, Decision Trace & AI Advisor\t37"
      summary: Where would this transaction go, and why
      description: 'Board 2.10. **The decision trace, including the rules that did not match.** Routing
        is the configuration most likely to be subtly wrong and least likely to announce it — a
        transaction going to the expensive acquirer still succeeds.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingContext'
      responses:
        '200':
          description: The chosen provider and the trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingDecision'
  /payment-failover-policy:
    put:
      operationId: setPaymentFailoverPolicy
      x-ticvai-consumed-by:
        - "P09 ADM-575 Failover, Retry & Resilience Manager\t34"
      summary: What happens when a provider fails, and when to stop trying
      description: 'Board 2.7. **A declined card and a broken gateway need opposite responses, and this
        is where they are told apart.** A decline is final and the till asks for another card; a
        timeout, a 5xx or a connection refusal is retryable and should move to the next provider.

        **Retrying a decline is how a guest gets charged twice** — so the retryable set is explicit
        rather than "anything that was not a success".

        **The circuit breaker is the part that protects the venue.** After a threshold of failures the
        provider is taken out of rotation automatically, because a hundred tills each discovering the
        outage independently is a hundred queues.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentFailoverPolicy'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailoverPolicy'
  /payment-providers/health:
    get:
      operationId: getPaymentProviderHealth
      x-ticvai-consumed-by:
        - "P09 ADM-569 Payment Orchestration Command Center\t27"
        - "P09 ADM-576 Provider Health, SLA & Performance Monitor\t35"
      summary: Authorisation rate, latency and availability, per provider
      description: 'Board 2.8. **Authorisation rate is the number that matters and it is not an uptime
        figure.** A provider that is up and declining 30% of cards it should be approving is worse than
        one that is down, because nobody notices.

        Compared against the provider''s own baseline, so a drop is visible before it becomes a
        support call.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Health per provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderHealth'
  /payment-providers/economics:
    get:
      operationId: getPaymentProviderEconomics
      x-ticvai-consumed-by:
        - "P09 ADM-577 Provider Cost, Commercial & Routing Economics\t36"
        - "P09 ADM-624 Fees, Commission, FX & Settlement Economics\t145"
      summary: What each provider actually costs
      description: 'Board 2.9. **Cost per transaction is a routing input, not a finance report.** Scheme
        fees, interchange, acquirer margin, FX spread and chargeback costs differ per provider, per
        method and per card type, and at scale the difference pays for the orchestration.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Economics per provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderEconomics'
  /payment-terminals:
    get:
      operationId: listPaymentTerminals
      x-ticvai-consumed-by:
        - "P08 BO-1141 Device, Terminal & Acceptance Point Mapping"
        - "P09 ADM-579 Terminal & Card-Present Command Center\t48"
        - "P09 ADM-580 Payment Terminal & Device Inventory\t49"
        - "P09 ADM-585 Card-Present Transaction Monitor & Operations\t55"
      summary: Terminals, and the payment configuration on each
      description: 'Board 3.2. **The device register is `tenancy`''s; this is the payment layer on top
        of it.** Merchant id, terminal id, the acquirer it talks to, EMV configuration and its
        store-and-forward state — none of which belong in a device inventory, and all of which are
        meaningless without one.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Terminals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTerminal'
    put:
      operationId: setPaymentTerminalConfiguration
      x-ticvai-consumed-by:
        - "P09 ADM-581 Terminal Provisioning & Device Configuration\t51"
        - "P09 ADM-583 EMV & Card-Present Processing Configuration\t53"
        - "P09 ADM-586 Degraded, Offline & Store-and-Forward Manager\t56"
      summary: Merchant account, acquirer, EMV and offline behaviour
      description: 'Boards 3.3, 3.5 and 3.8. **Store-and-forward is the setting that decides whether a
        venue can trade when the line drops**, and it is a risk decision rather than a technical one: a
        floor limit, a cap on the total held offline, and a maximum age after which the terminal
        refuses rather than accumulating.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentTerminal'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTerminal'
  /payment-terminals/{terminalId}/forwarded:
    parameters:
    - name: terminalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listStoredForwardTransactions
      x-ticvai-consumed-by:
        - "P09 ADM-586 Degraded, Offline & Store-and-Forward Manager\t56"
      summary: What a terminal took offline and has not yet sent
      description: 'Board 3.8. **Money the venue has taken and the platform does not know about.** Until
        these land, the till total, the acquirer and the ledger all disagree, and a terminal that dies
        holding them has lost real revenue.

        This is the queue somebody has to be able to look at.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Held transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredForwardTransaction'
  /hosted-checkout-config:
    put:
      operationId: setHostedCheckoutConfiguration
      x-ticvai-consumed-by:
        - "P09 ADM-594 Hosted Checkout, Redirect & Return Flow Configuration\t75"
        - "P09 ADM-597 Digital Payment Exception, Recovery & Expiry Center\t79"
      summary: Redirect, return and the journey back
      description: 'Board 4.6. **The return leg is where hosted checkout goes wrong.** A guest who pays
        on a provider''s page and closes the tab before the redirect has paid, and the platform does not
        know — so the configuration names the webhook that settles it independently of the browser, and
        a reconciliation window for the ones that still fall through.

        '
      tags:
      - payments
      x-ticvai-permission: PAYMENT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
