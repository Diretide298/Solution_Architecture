      - staff
      summary: Generate codes in bulk
      description: 'Up to fifty thousand at a time. Generation is asynchronous and the batch is exported
        rather than returned inline — a hundred thousand codes is a file, not a response body.

        **Poll `getCouponCodeBatch` with the returned `batchId`** for progress, the failure reason and,
        once `complete`, the export''s download link. `listCouponCodes` filters by the same `batchId`.

        **Codes are single-use by default** (the campaign''s `isSingleUse` defaults to true), and **the
        number of assigned guests must not exceed `quantity`**. Fewer is allowed: the codes left over
        are anonymous (decided 28 September, audit R101).

        **Writes `promotions.promotion_audit`** in the same transaction, as every promotions
        configuration change does: one row per batch, not per code (entityType `couponCampaign`,
        eventType `modified`, newValue the batch id and quantity) (decided 29 September, writers pass).

        '
      tags:
