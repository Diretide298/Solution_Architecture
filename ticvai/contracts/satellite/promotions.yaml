          description: Generation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                    format: uuid
                  quantity:
                    type: integer
                  status:
                    type: string
                    enum:
                    - queued
                    - generating
                    - complete
                    - failed
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
