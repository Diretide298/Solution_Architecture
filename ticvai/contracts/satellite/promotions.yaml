openapi: 3.1.0
info:
  title: TICVAI Promotions & Bundles
  version: 0.1.0
  x-ticvai-screen-count: 133
  x-ticvai-tier: satellite
  x-ticvai-module: 4 — Bundles and Promotions
  x-ticvai-requirements: 229
  x-ticvai-capabilities:
  - C05
  - C06
  - C07
  - C37
  - C86
  - C87
  - C88
  - C89
  - C90
  x-ticvai-platforms:
  - P08 Venue Management
  - P04 POS
  - P01 Guest Web
  - P02 Guest App
  description: "## What this contract covers\n**Discounts, coupons, bundles and revenue allocation.**\n\
    | | | |---|---| | **Tier** | satellite | | **Matrix domain** | 4 — Bundles and Promotions | | **Requirements**\
    \ | ~229 | | **Capabilities** | C05, C06, C07, C37, C86, C87, C88, C89, C90 | | **Consumed by** |\
    \ P08 Venue Management · P04 POS · P01 Guest Web · P02 Guest App |\n## How to read this file\n**This\
    \ file is a contract.** It is hand-authored and it is the source of truth for one bounded context:\
    \ server code, client code and mock servers are generated from it, never the other way round. If a\
    \ field is not here, it does not exist.\n**Contracts are split into two tiers.**\n- **Spine** — the\
    \ eight contexts everything else depends on: tenancy, identity,\n  catalogue, orders, shift, access,\
    \ finance, cross-region. Frozen first. A change here\n  requires a formal change request, because every\
    \ satellite has pinned against it.\n- **Satellite** — a domain that builds on the spine and can move\
    \ independently.\n  Cheaper to change.\n\n**`paths` are operations.** Each one declares four TICVAI\
    \ extensions, and Redocly rejects any that does not:\n| Extension | Answers | |---|---| | `x-ticvai-permission`\
    \ | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed\
    \ | | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held | |\
    \ `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this | | `x-ticvai-conflict-policy`\
    \ | How a replayed operation resolves — `append`, `serverWins`, `manual` |\nWhere `x-ticvai-permission`\
    \ is null, one of these says why: `x-ticvai-auth: service` (cell-to-cell), `x-ticvai-self-scoped`\
    \ (acts only on the caller's own resources), or `security: []` (genuinely public).\n**`components.schemas`\
    \ are API schemas — the shape of data on the wire.** They are not database tables. One API schema\
    \ may become three columns (`Money`) or five tables (`Order`); some have no table at all (`ValidationResult`,\
    \ `TrialBalance`). Roughly 70% of the DDL derives from these, and the rest — partitioning, RLS, the\
    \ PII split — is storage design that lives in the migration scripts.\n**`security` arrays hold OAuth\
    \ scopes.** Empty means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty\
    \ is not the same as absent: absent means unauthenticated.\n\n## This context\nDiscounts, coupons,\
    \ vouchers, bundles, upsell rules and revenue allocation. Domain 4 — 229 requirements, plus the bundle\
    \ and upsell sub-domains of domain 3.\nPositions this encodes:\n- **Allocation splits are a finance\
    \ concern surfaced here** (12 Aug §16). A bundle sold\n  for one price must divide across its components\
    \ by percentage or fixed amount, because\n  each component may sit in a different venue, revenue account,\
    \ tax treatment or legal\n  entity. The split is defined with the bundle and consumed by the ledger.\n\
    - **Promotion evaluation is deterministic and explainable.** A cashier facing a guest\n  who expected\
    \ a discount needs to know which rule applied and which did not. Every\n  evaluation returns its working.\n\
    - **Stacking is explicit, never emergent.** Two promotions that each look reasonable can\n  combine\
    \ into a free ticket. Precedence and exclusivity are declared, not inferred from\n  the order rules\
    \ were created in.\n- **Coupons are issued, not invented.** A master coupon defines the offer; individual\n\
    \  codes are generated from it with their own redemption state. That is what makes\n  single-use enforceable.\n\
    - Promotions read from the local bundle at point of sale (ADR-0013). The evaluation\n  endpoint here\
    \ is for online channels and for the back office to test a rule before\n  publishing it.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: promotion
- name: coupon
- name: voucher
- name: bundle
- name: allocation
- name: upsell
- name: evaluation
paths:
  /promotions/{promotionId}/simulate:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: simulatePromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      summary: What this promotion would have cost on real history
      description: 'BL-114. **A promotion is priced by guessing until it runs.** Run it against a past
        period and the answer is arithmetic: how many orders would have qualified, what the discount would
        have totalled, and **how much of it would have gone to guests who were going to buy anyway.**

        That last number is the one nobody computes and the one that decides whether a campaign made money.

        **Dry run only — writes nothing.** Same shape as `assessProductChange` and `RecognitionRunResult`,
        which is the fourth place this pattern appears.

        '
      tags:
      - promotions
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: analytical
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - periodFrom
              - periodTo
              properties:
                periodFrom:
                  type: string
                  format: date
                periodTo:
                  type: string
                  format: date
      responses:
        '200':
          description: Simulation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordersQualifying:
                    type: integer
                  discountTotal:
                    $ref: ../shared/common.yaml#/components/schemas/Money
                  incrementalOrders:
                    type: integer
                    description: '**Orders that would not have happened without it**, estimated against
                      a comparable period. The rest of the discount went to guests who were buying anyway.

                      '
                  budgetBreach:
                    type: boolean
  /promotions/{promotionId}/variants:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setPromotionVariants
      summary: A/B test two versions against each other
      description: 'BL-114. **Split by a stable hash of the subject, not at random per request** — a guest
        who sees 10% on Monday and 15% on Tuesday has learned to wait.

        '
      tags:
      - promotions
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - variants
              properties:
                variants:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      trafficPercent:
                        type: integer
                      discountPercent:
                        type: number
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /recommendations:
    post:
      operationId: getRecommendations
      x-ticvai-consumed-by:
        - "P08 BO-1048 Seat Upsell Recommendations"
        - "P08 BO-119 Cross-Sell, Upsell & Recommendation Rules"
      summary: What else this guest might want
      description: 'BL-068. **Rule-based recommendation exists; profile-and-cart-driven does not**, and
        the difference is whether a guest who has already bought a family ticket is offered another one.

        **Deterministic fallback, always.** A recommender that returns nothing when the model is unavailable
        is a checkout with a hole in it, so rules answer when nothing better can.

        **Never recommends what is already in the cart, out of stock, or ineligible for this guest** —
        three checks that sound obvious and are the three most common defects in shipped recommenders.

        '
      tags:
      - promotions
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cartId:
                  type: string
                  format: uuid
                  nullable: true
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                surface:
                  type: string
                  enum:
                  - checkout
                  - productPage
                  - homepage
                  - postPurchase
                  - kiosk
                maxResults:
                  type: integer
                  default: 4
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    productId:
                      type: string
                      format: uuid
                    reason:
                      type: string
                      enum:
                      - frequentlyBoughtTogether
                      - completesVisit
                      - popularNow
                      - previouslyPurchased
                      - ruleBased
                    confidence:
                      type: number
  /vouchers/{voucherId}/void:
    parameters:
    - name: voucherId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: voidVoucher
      x-ticvai-audience:
      - staff
      summary: Cancel a voucher
      description: 'Issued in error, or fraud. **Voiding a partly-used voucher does not reverse what was
        already spent** — that redemption happened and the goods left.

        A voucher could be created and redeemed and never voided until 17 August.

        '
      tags:
      - promotions
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - issuedInError
                  - fraud
                  - campaignCancelled
                  - duplicated
                note:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /promotions:
    get:
      operationId: listPromotions
      x-ticvai-consumed-by:
        - "P01 WEB-032 Offers & Promotions"
        - "P01 WEB-043 Loyalty & Rewards"
        - "P02 GST-036 Loyalty & Rewards"
        - "P02 GST-037 Offers & Promotions"
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P08 BO-010 Promotions & Coupons"
        - "P09 ADM-138 Promotion Command Center Dashboard"
        - "P09 ADM-140 Promotion Overview"
        - "P09 ADM-145 Promotion Approval Inbox"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience:
      - staff
      - guest
      - partner
      x-ticvai-read-routing: replica
      summary: List promotions
      tags:
      - promotion
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-offline-note: '24 August: **servable from a local cache.** The device holds enough to answer
        without the  network and the answer may be stale — which is correct for a catalogue and wrong
        for conte nded state. `getSeatAvailability`, `getSeatHold` and `getPromotionUsage` are deliberately  excluded
        - **a stale seat is a seat sold twice.**

        '
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/PromotionStatus'
      - name: activeAt
        in: query
        schema:
          type: string
          format: date-time
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Promotions
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Promotion'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
    post:
      operationId: createPromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      - partner
      summary: Create a promotion
      description: 'Created in `draft`. A draft promotion never evaluates — publishing is the act that
        makes it live, and it appears at terminals with the next catalogue bundle.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
      responses:
        '201':
          description: Created in draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '400':
          description: Conditions are unsatisfiable, or the discount exceeds the configured cap
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /promotions/{promotionId}:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPromotion
      x-ticvai-consumed-by:
        - "P01 WEB-032 Offers & Promotions"
        - "P02 GST-037 Offers & Promotions"
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P08 BO-010 Promotions & Coupons"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience:
      - staff
      - guest
      - partner
      x-ticvai-read-routing: replica
      summary: Read a promotion
      tags:
      - promotion
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-offline-note: '24 August: **servable from a local cache.** The device holds enough to answer
        without the  network and the answer may be stale — which is correct for a catalogue and wrong
        for conte nded state. `getSeatAvailability`, `getSeatHold` and `getPromotionUsage` are deliberately  excluded
        - **a stale seat is a seat sold twice.**

        '
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Promotion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
    patch:
      operationId: updatePromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      - partner
      summary: Amend a promotion
      description: 'Amending a live promotion changes behaviour mid-sale. Conditions and discount are
        editable only in draft; a live promotion may be paused, extended or ended, nothing more.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  maxLength: 200
                validTo:
                  type: string
                  format: date-time
                isPaused:
                  type: boolean
                conditions:
                  $ref: '#/components/schemas/PromotionConditions'
                discount:
                  $ref: '#/components/schemas/Discount'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '409':
          description: Conditions or discount amended on a live promotion
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /promotions/{promotionId}/pause:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: pausePromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      - partner
      summary: Pause a live promotion
      description: '**Carts already priced keep their price.** A guest mid-checkout is not repriced —
        the discount they were shown is the one they pay.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /promotions/{promotionId}/end:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: endPromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      - partner
      summary: End a promotion early
      description: 'Distinct from expiry. `expired` means it ran its course; `ended` means somebody decided,
        and the register should be able to answer which after a bad month.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /promotions/{promotionId}/unschedule:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: unschedulePromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      - partner
      summary: Pull a scheduled promotion before it starts
      description: 'Returns it to draft. Nothing has priced against it yet, so nothing needs honouring.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Done
        '409':
          description: Not in a state that permits this
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /promotions/{promotionId}/publish:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: publishPromotion
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      - partner
      summary: Publish a promotion
      description: 'Runs conflict analysis first. A promotion that stacks with an existing one to produce
        a negative or near-zero line price is refused — that combination is discovered at a till otherwise,
        usually by a guest.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '409':
          description: Conflict analysis failed. The response names each conflicting promotion
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StackingProblem'
  /promotions/{promotionId}/conflicts:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: analysePromotionConflicts
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P08 BO-010 Promotions & Coupons"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience:
      - staff
      - partner
      x-ticvai-read-routing: replica
      summary: Analyse stacking against live promotions
      description: 'Run before publishing. Reports promotions that overlap on product and period, and
        what the combined discount would be.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictAnalysis'
  /promotions/{promotionId}/usage:
    parameters:
    - name: promotionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPromotionUsage
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P08 BO-010 Promotions & Coupons"
        - "P09 ADM-138 Promotion Command Center Dashboard"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience:
      - staff
      - partner
      x-ticvai-read-routing: analytical
      summary: Redemption count and discount given
      description: 'Also the enforcement surface for budget caps — a promotion may be configured to stop
        automatically once a total discount value is reached.

        '
      tags:
      - promotion
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionUsage'
  /coupon-campaigns:
    get:
      operationId: listCouponCampaigns
      x-ticvai-consumed-by:
        - "P08 BO-010 Promotions & Coupons"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: List coupon campaigns
      description: 'A campaign is the master definition. Individual codes are generated from it and carry
        their own redemption state.

        '
      tags:
      - coupon
      x-ticvai-permission: PRICE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
