        - "P08 ADM-195 Bundle Availability by Channel, Venue & Partner"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: writers pass; pack Promotions___Bundles_Management_Reference.pdf p.81 and p.85; no promotions minutes on file, so our build plan; shape follows setPromotionVariants (the set replaces the one before)'
      x-ticvai-config-scope: venue
      summary: Set a bundle's capacity policies
      description: 'Replaces the bundle''s `promotions.bundle_capacity_policy` rows with the set sent:
        a row sent with an `id` is updated, one without is created, and a stored row not sent is removed.
        `bundleId` is taken from the path.

        **Separate from createBundle and updateBundle on purpose** (decided 29 September, writers pass):
        how a bundle draws on capacity is adjusted while it is on sale, and updateBundle deliberately
        carries nothing but name, price, end date and on-sale flag once the bundle has sold. Changing a
        policy never releases or re-prices a hold already taken; it applies to the next reservation.

        **At most one row per (channel, venueId, partnerId)**, and exactly one default row (all three
        null) when any row is sent. **Writes `promotions.promotion_audit`** in the same transaction
        (entityType `bundle`, eventType `modified`).

