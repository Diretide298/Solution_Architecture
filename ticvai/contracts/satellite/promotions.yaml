components:
  schemas:
    CreateCommercialCampaignRequest:
      x-ticvai-persistence: none — request only; saved as a `promotions.campaign` row (CommercialCampaign)
      type: object
      description: 'What createCommercialCampaign takes: the campaign header only. Budget lines are set by
        setCampaignBudgetFinancial. (decided 29 September, writers pass)'
      required:
      - venueId
      - name
      properties:
        venueId:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 64
          nullable: true
          description: Unique at the venue when given.
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
          nullable: true
        ownerPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: The campaign (and budget) owner.
        legalEntityId:
          type: string
          format: uuid
          nullable: true
          description: The business entity that funds and books the campaign.
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
    RecommendationStrategy:
      type: object
      x-ticvai-persistence: promotions.recommendation_strategy
      description: 'Upsell board 1. **Objective, placement, ranking and guardrail in one record**, because
        any one of them alone produces a recommender that is either aimless or dangerous.

        '
      required:
      - code
      - name
      - objective
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        objective:
          type: string
          enum:
          - attachRevenue
          - averageOrderValue
          - upgradeRate
          - visitFrequency
          - inventoryBalance
          - guestSatisfaction
        kinds:
          type: array
          items:
            type: string
            enum:
            - upsell
            - upgrade
            - crossSell
            - bundle
            - nextBestOffer
            - reactivation
        itemKinds:
          type: array
          description: 'What the strategy may put in a slot (29 September, build pass, group G2, from group G1''s
            handoff; 8.6.30 to 8.6.36, 5.4.21, 22.6.18): `product` (the default and the behaviour before), `offer`
            (a live promotion marked `recommendable`), `reward` (a marketing-crm loyalty reward the guest can redeem)
            and `challenge` (a challenge they can join). Mirrors `ai.decideRecommendations` item kinds.'
          default:
          - product
          items:
            type: string
            enum:
            - product
            - offer
            - reward
            - challenge
        placements:
          type: array
          description: '`homepage` (8.6.10) and `loyalty` (5.4.21, 22.6.18) added 29 September (build pass, group G2),
            matching the placements `ai.decideRecommendations` fills.'
          items:
            type: string
            enum:
            - productPage
            - cart
            - checkout
            - postPurchase
            - preVisitEmail
            - inVenueApp
            - kiosk
            - pos
            - signage
            - callCentre
            - homepage
            - loyalty
        channels:
          type: array
          items:
            type: string
        maxRecommendations:
          type: integer
          default: 3
          description: '**A guardrail before it is a layout choice.** Nine upsells at checkout is not a
            denser page, it is an abandoned basket.

            '
        minConfidence:
          type: number
          nullable: true
        rankingWeights:
          type: object
          additionalProperties:
            type: number
          description: Propensity, margin, inventory pressure, affinity, recency.
        requireAvailability:
          type: boolean
          default: true
        excludeInBasket:
          type: boolean
          default: true
        guardrails:
          type: object
          properties:
            maxDiscountPercent:
              type: number
              nullable: true
            minMarginPercent:
              type: number
              nullable: true
            neverRecommendCategoryIds:
              type: array
              items:
                type: string
                format: uuid
            requireHumanApproval:
              type: boolean
              default: false
        status:
          type: string
          enum:
          - draft
          - active
          - paused
          - retired
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        scopePath:
          type: string
    ProductRelationship:
      type: object
      x-ticvai-persistence: promotions.product_relationship
      description: 'Upsell boards 2.2 and 3.2. **Declared, and distinguishable from measured affinity.**'
      required:
      - fromProductId
      - toProductId
      - kind
      properties:
        id:
          type: string
          format: uuid
        fromProductId:
          type: string
          format: uuid
        toProductId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - upgradesTo
          - downgradesTo
          - crossSell
          - accessory
          - substitute
          - requires
          - incompatibleWith
        ladderPosition:
          type: integer
          nullable: true
          description: '**For upgrade ladders only.** Standard → Premium → VIP is ordered, and an
            unordered set cannot answer *what is the next step up*.

            '
        source:
          type: string
          enum:
          - declared
          - measured
          - aiProposed
          default: declared
        strength:
          type: number
          nullable: true
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        scopePath:
          type: string
    ProductAffinity:
      type: object
      description: 'Upsell boards 3.3 and 3.4. **Support and lift together**, because high support with no
        lift is two popular products rather than a relationship.

        '
      properties:
        fromProductId:
          type: string
          format: uuid
        toProductId:
          type: string
          format: uuid
        basketsTogether:
          type: integer
        support:
          type: number
        confidence:
          type: number
        lift:
          type: number
        windowDays:
          type: integer
        computedAt:
          type: string
          format: date-time
    RecommendationContext:
      type: object
      description: '**One shape for runtime, explanation and simulation**, so all three see the same
        inputs.

        '
      required:
      - placement
      properties:
        guestId:
          type: string
          format: uuid
          nullable: true
        anonymousId:
          type: string
          nullable: true
          description: 'Board 5.8. **Most guests at a kiosk are not signed in.**'
        placement:
          type: string
        channel:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/SalesChannel
          nullable: true
        venueId:
          type: string
          format: uuid
          nullable: true
        basket:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: integer
        orderId:
          type: string
          format: uuid
          nullable: true
        visitState:
          type: string
          enum:
          - prePurchase
          - purchased
          - preVisit
          - inVenue
          - postVisit
          nullable: true
        locationScopePath:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
          nullable: true
        strategyId:
          type: string
          format: uuid
          nullable: true
    Recommendation:
      type: object
      description: '**Ranked, priced and explainable.** An offer with no reason attached cannot be
        defended by the person presenting it.

        '
      properties:
        recommendationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        kind:
          type: string
        rank:
          type: integer
        score:
          type: number
        confidence:
          type: number
          nullable: true
        price:
          $ref: ../shared/common.yaml#/components/schemas/Money
        priceDifference:
          $ref: ../shared/common.yaml#/components/schemas/Money
        reason:
          type: string
          description: 'Shown to the guest — *"guests who booked this also visited"*.'
        factors:
          type: array
          description: Shown to staff and analysts, not to the guest.
          items:
            type: object
            properties:
              factor:
                type: string
              contribution:
                type: number
        strategyId:
          type: string
          format: uuid
        experimentVariant:
          type: string
          nullable: true
    RecommendationTrace:
      type: object
      description: 'Boards 4.10 and 6.9. **Includes what was suppressed**, because that is usually the
        question.

        '
      properties:
        strategyId:
          type: string
          format: uuid
        candidatesConsidered:
          type: integer
        returned:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        suppressed:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              score:
                type: number
                nullable: true
              suppressedBy:
                type: string
                enum:
                - alreadyInBasket
                - unavailable
                - consent
                - eligibility
