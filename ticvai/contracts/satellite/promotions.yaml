      - staff
      - partner
      summary: Publish a promotion
      description: 'Runs conflict analysis first. A promotion that stacks with an existing one to produce
        a negative or near-zero line price is refused — that combination is discovered at a till otherwise,
        usually by a guest.

        **The floor is zero: a combined line price of zero or below is refused** (decided 28 September,
        audit R101). A line that stays above zero, however small, publishes. One that falls below the
        near-zero minimum (`ConflictAnalysis`, audit R096 (5)) publishes too, flagged rather than refused.

        **Writes `promotions.promotion_channel_publication` and `promotions.promotion_audit`.** One row
