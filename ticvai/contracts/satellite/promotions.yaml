      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set. The policies now stored for the bundle, replacing any set before.
          content:
            application/json:
              schema:
                type: object
                required:
                - bundleId
                - policies
                properties:
                  bundleId:
                    type: string
                    format: uuid
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/BundleCapacityPolicy'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '422':
          description: Two rows share a (channel, venueId, partnerId), there is no default row, or an `id`
            names a policy of another bundle.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
