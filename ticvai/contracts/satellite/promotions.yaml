      x-ticvai-audience:
      - staff
      summary: Create a bundle
      description: 'A bundle is a product whose price differs from the sum of its parts. **The allocation
        split is mandatory** — without it the ledger cannot divide the revenue, and each component may
        sit in a different venue, account, tax treatment or legal entity.

        **Allocation rule (decided 28 September, audit R101):** the bundle price is allocated to components
        in proportion to their list price, and **list price is the component variant''s current price**
        when the bundle is created. Rounding is to the currency''s minor unit, and **the rounding remainder
        goes to the first component**, so the allocated amounts always sum to the bundle price exactly.
        `proRataListPrice` is the default method; `percentage` and `fixedAmount` remain for an explicit
        split and follow the same remainder rule.

        **Writes `promotions.promotion_audit`** in the same transaction, as every promotions
        configuration change does (entityType `bundle`, eventType `created`). Capacity policies and
        partner product mappings are set afterwards by setBundleCapacityPolicy and
        setBundlePartnerProductMappings (decided 29 September, writers pass).

        **A meal combo with admission** (decided 29 September, MOB-4) is a bundle with an `admission`
        component and a `fnbMenuItem` component naming the menu item; a `fnbMenuItem` component with no
        `menuItemId`, or one whose menu item does not sell its `variantId`, is refused `422`.

