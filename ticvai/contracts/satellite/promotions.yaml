      x-ticvai-config-scope: venue
      summary: Set a bundle's partner product mappings
      description: 'Replaces the bundle''s `promotions.partner_bundle_product` rows with the set sent: a
        row sent with an `id` is updated, one without is created, and a stored row not sent is removed.
        Each `bundleComponentId` must be a component of this bundle, and a component maps to at most one
