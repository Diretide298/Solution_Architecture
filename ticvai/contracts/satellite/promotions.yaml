        - "P09 ADM-695 Recommendation Governance & Deployment Control"
      summary: The strategies deciding what gets offered where
      description: 'Upsell board 1. **A strategy is the unit, not an individual recommendation.** The
        board asks for objectives, placements, channels, ranking, suppression and guardrails — six things
