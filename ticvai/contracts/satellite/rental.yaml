openapi: 3.1.0
info:
  title: TICVAI — Rental
  version: 1.0.0
  x-ticvai-screen-count: 39
  x-ticvai-tier: satellite
  x-ticvai-module: 1 — Ticketing Catalogue
  x-ticvai-platforms:
  - P08 Venue Management
  description: '**A rental is a commercial agreement with a return date.** A bike goes out at ten, comes
    back at eleven-fifteen, and between those two times the venue is holding money against it and nobody
    else can have it.

    ## Why this is not `resources`, and not `catalogue`

    **`resources` owns the object.** Which cabana, held by whom, returned when. That context was built
    for exactly this and it stops at the object — it has no price, no deposit policy, no late fee, no
    grace period, no agreement and no damage charge.

    **`catalogue` owns what is sold.** It prices a slot and it has no opinion about what happens after
    the slot ends. A rental''s money is decided *after* the transaction the catalogue understands: the
    late fee depends on when the bike actually came back, and the damage charge depends on what it looked
    like.

    So the split is: `catalogue` sells it, `resources` holds the object, **and this owns the agreement
    between them** — duration and turnaround, the deposit and its settlement, the condition at both ends,
    and the money that only exists because something was returned late or broken.

    ## The three things that make it its own context

    **Price is not known at checkout.** *Expected return 14:00, actual return 15:12, grace 15 minutes,
    chargeable late time 57 minutes* (board 4.8). A context whose total is fixed when the order is placed
    cannot express that, and `orders` is such a context — an order completes and the rental is still out.

    **The deposit is held against the object and settled against its condition.** Board 4.7 runs
    authorised → held → active → inspection → partial capture or release. *Capture AED 120, release
    AED 380* is one act with two outcomes, and it is decided by an inspection rather than by a payment.

    **Turnaround feeds availability.** *Rental 10:00–11:00, turnaround 11:00–11:15, next available
    11:15* (board 1.7). **This is the same rule `resources` states for setup and teardown**, and it is
    stated in both places because a rental product can be pooled — a hundred and fifty lockers with no
    individual resource behind them still need the buffer.

    ## What it deliberately does not own

    **Not the physical asset register.** `maintenance.Asset` already carries serial, acquisition,
    warranty, condition and history, and `maintenance` carries the work orders, inspections and
    return-to-service approvals that rental board 9 draws. **Board 9 is a join, not a gap.**

    **Not stock movements.** `inventory` owns locations, transfers, adjustments and counts. Rental board
    2''s pooled inventory, transfer and adjustment screens are that context seen from here.

    **Not the payment.** Deposits authorise and capture through `orders` stored value (CF-126); this
    decides the amounts and when.

    '
servers:
- url: https://api.ticvai.com/v1
paths:
  /rental-products:
    get:
      operationId: listRentalProducts
      x-ticvai-consumed-by:
        - "P08 BO-494 Rental Product Command Center"
      summary: Rental products across venues and locations
      description: 'Board 1.1. Filterable by tenant, venue, rental location, category, status, **tracking
        model** and configuration status — the tracking model is a filter because it changes what the
        operator can do with the row.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      - name: locationId
        in: query
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
      - name: trackingModel
        in: query
        schema:
          type: string
          enum:
          - pooled
          - serialised
          - hybrid
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Rental products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalProduct'
    post:
      operationId: createRentalProduct
      x-ticvai-consumed-by:
        - "P08 BO-495 Create Rental Product Wizard"
      summary: Define a rental product
      description: 'Board 1.2. **Created as a draft and published separately.** The wizard has seven
        steps and a product half-configured is not sellable — `publishRentalProduct` is where the
        completeness check lives, so a draft can be saved at step three without the platform pretending
        it is a product.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalProduct'
      responses:
        '201':
          description: Created as a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalProduct'
  /rental-products/{productId}:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getRentalProduct
      x-ticvai-consumed-by:
        - "P08 BO-496 Rental Product Profile"
        - "P08 BO-904 Rental Resource Configuration"
      summary: The master configuration of one rental product
      description: 'Board 1.3. **The profile is the master reference every downstream board reads** —
        inventory, availability, pricing, booking and checkout all resolve their rules from here, so it
        returns the whole thing rather than a header the client then has to assemble.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalProduct'
    put:
      operationId: updateRentalProduct
      x-ticvai-consumed-by:
        - "P08 BO-496 Rental Product Profile"
      summary: Change a rental product
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalProduct'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalProduct'
  /rental-products/{productId}/validate:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: validateRentalProduct
      x-ticvai-consumed-by:
        - "P08 BO-495 Create Rental Product Wizard"
        - "P08 BO-503 Product Validation, Approval & Publication"
      summary: What is still missing before this can be sold
      description: 'Board 1.10 and 4.10. **The board draws this as a checklist and that is exactly what
        it is** — basic information, category, location, inventory model, duration, rules, customer
        requirements, agreement, pricing profile, deposit policy, availability, channels.

        **It returns findings, it does not refuse.** *"Kayak – Double has inventory assigned but no
        turnaround minutes"* (board 1.1) is a warning a venue may knowingly ship; *no pricing profile*
        is not. The severity travels with the finding so the publish gate can decide and the operator can
        see why.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalConfigurationFinding'
  /rental-products/{productId}/publish:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: publishRentalProduct
      x-ticvai-consumed-by:
        - "P08 BO-494 Rental Product Command Center"
        - "P08 BO-503 Product Validation, Approval & Publication"
      summary: Move a product through draft, review, approval and activation
      description: 'Board 1.10. *Draft → Configuration Review → Approval → Active → Suspended.*

        **Maker/checker, and the reason is recorded on both sides.** A rejection with no reason sends the
        configurer back to a screen with no idea which of forty fields was wrong.

        **Effective dating is why this is not a boolean.** A product approved today to go live on 1
        November is approved and not active, and a flag cannot hold both facts.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_APPROVE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              properties:
                state:
                  type: string
                  enum:
                  - draft
                  - configurationReview
                  - approved
                  - active
                  - suspended
                  - archived
                comment:
                  type: string
                  nullable: true
                rejectionReason:
                  type: string
                  nullable: true
                effectiveFrom:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalProduct'
        '409':
          description: Blocking findings remain; they are listed
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /rental-categories:
    get:
      operationId: listRentalCategories
      x-ticvai-consumed-by:
        - "P08 BO-497 Rental Category & Classification Setup"
      summary: Reusable categories, with the defaults products inherit
      description: 'Board 1.4. **Configure categories rather than hard-coding rental types.** A category
        carries a default inventory model, duration, turnaround, customer requirements, waiver and
        deposit behaviour, **and an individual product may override within a permitted set** — which is
        the part that makes inheritance safe to use.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalCategory'
    post:
      operationId: createRentalCategory
      x-ticvai-consumed-by:
        - "P08 BO-497 Rental Category & Classification Setup"
      summary: Define a category and its defaults
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCategory'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalCategory'
  /rental-products/{productId}/locations:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setRentalProductLocations
      x-ticvai-consumed-by:
        - "P08 BO-499 Rental Location Assignment"
      summary: Where it can be collected, and where it can be returned
      description: 'Board 1.6. **Pickup and return are configured separately and the board shows why** —
        *Adventure Zone: available ✓, pickup ✓, return —*. A station that hands out kayaks and has no way
        to receive them back is a real operating shape, and a single "enabled" flag cannot say it.

        **Cross-location return is the commercially interesting one.** Allowing it means inventory
        drifts between stations, which is a transfer `inventory` has to carry out; refusing it means a
        guest who paddles from Marina to North cannot get out of the boat there.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - locations
              properties:
                locations:
                  type: array
                  items:
                    $ref: '#/components/schemas/RentalLocationRule'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalLocationRule'
  /rental-products/{productId}/duration:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setRentalDurationRules
      x-ticvai-consumed-by:
        - "P08 BO-500 Rental Duration & Turnaround Configuration"
        - "P08 BO-517 Timeslot & Duration Availability Setup"
      summary: Minimum, maximum, increment, extension and turnaround
      description: 'Board 1.7. **The turnaround buffer feeds availability automatically** — *rental
        10:00–11:00, turnaround 11:00–11:15, next available 11:15.* A venue that has to remember to
        leave a gap will not, and the bike goes out wet.

        **Fixed and customer-defined durations are one model.** A fixed-duration product is one whose
        increment equals its default; splitting them into two shapes would double every downstream
        branch for nothing.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalDurationRules'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalDurationRules'
  /rental-products/{productId}/rules:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setRentalOperationalRules
      x-ticvai-consumed-by:
        - "P08 BO-501 Rental Rules & Operational Policy"
      summary: Who may rent it, how many, and what must happen at the counter
      description: 'Board 1.8. Age, height, weight, ID, guardian, membership, driving licence and safety
        briefing on the customer side; scan, inspection and photo requirements on the operational side.

        **Every rule is required, optional or not applicable — three states, not two.** *Not applicable*
        and *optional* look the same at the counter and are entirely different in an audit: one means the
        venue chose not to check, the other means there was nothing to check.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalOperationalRules'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalOperationalRules'
  /rental-products/{productId}/agreement:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setRentalAgreementRequirements
      x-ticvai-consumed-by:
        - "P08 BO-502 Customer Requirements, Agreement & Waiver"
      summary: The agreement, waiver and signature a rental needs
      description: 'Board 1.9. **The signed agreement is linked to the booking and the version is kept.**
        A waiver is only a defence if it can be shown that *this* guest signed *that* text, and a venue
        that updates its liability wording has changed the text under every prior signature unless the
        version travels with the signature.

        Group and guardian cases are first-class: a minor''s guardian signs, and a group may sign once or
        individually depending on configuration.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalAgreementRules'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAgreementRules'
  /rental-products/{productId}/inventory-model:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setRentalInventoryModel
      x-ticvai-consumed-by:
        - "P08 BO-498 Inventory Tracking Model"
        - "P08 BO-904 Rental Resource Configuration"
      summary: Pooled, serialised or hybrid
      description: 'Board 1.5, and **the single most load-bearing choice in this contract.**

        **Pooled** — a hundred and fifty lockers. The engine reserves quantity and never asks which one.

        **Serialised** — BIKE-001, BIKE-002. Every physical asset has an identity, and *the original
        requirements specifically call for a unique serial number*. These resolve to `resources`
        resources and to `maintenance.Asset`; this contract does not keep a third register of them.

        **Hybrid** — *one serialised kayak, two pooled paddles, two pooled life jackets.* One booking,
        two mechanisms, and the reason neither of the first two models can be the only one.

        **Changing the model on a product that has bookings is refused.** A pooled booking has no asset
        to hand over and a serialised one has nothing to count; converting between them under live
        bookings loses the answer to *which one did the guest take*.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalInventoryModel'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalInventoryModel'
        '409':
          description: Bookings exist under the current model
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /rental-products/import:
    post:
      operationId: importRentalCatalogue
      summary: Load a client's rental items and inventory at onboarding
      description: '**26 August, and it is the reason this operation exists at all:** *"rental item and
        inventory data is expected to be provided by each client during onboarding, with a screen
        provided to update inventory and item details thereafter."*

        So the first load is a file and everything after it is the ordinary edit screens. **Validated as
        a whole before any row is written** — a partial import of a rental catalogue leaves a venue
        selling half its kayaks, which is worse than selling none.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assetId
              properties:
                assetId:
                  type: string
                  format: uuid
                  description: The uploaded workbook, through `assets`.
                mode:
                  type: string
                  enum:
                  - validateOnly
                  - commit
                  default: validateOnly
      responses:
        '200':
          description: What it found, and what it wrote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalImportResult'
  /rental-availability:
    get:
      operationId: getRentalAvailability
      x-ticvai-consumed-by:
        - "P06 EMP-083 Rental Extension Request"
        - "P08 BO-514 Availability Command Center"
        - "P08 BO-518 Real-Time Availability Calendar"
        - "P08 BO-521 Overlap & Conflict Engine"
        - "P08 BO-523 Availability Intelligence & AI Forecasting"
        - "P08 BO-536 Availability Selection & Alternative Options"
        - "P08 BO-556 Rental Extension Request"
        - "P08 BO-905 Rental Inventory & Availability Control"
      summary: What can be rented, when, with turnaround already subtracted
      description: 'Board 3. **Free windows, not a booking list for the caller to subtract from.** A
        client computing this itself will forget the turnaround buffer, and a bike returned at 11:00 with
        a fifteen-minute clean is not available at 11:00.

        Holds, buffers and blackouts are included with their reason. **A pooled product answers with a
        count and a serialised one answers with assets** — the shape differs because the question does:
        *how many kayaks* against *which kayak*.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: locationId
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: quantity
        in: query
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAvailability'
  /rental-products/{productId}/availability-rules:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setRentalAvailabilityRules
      x-ticvai-consumed-by:
        - "P08 BO-515 Availability Rule Configuration"
        - "P08 BO-516 Operating Hours & Rental Windows"
        - "P08 BO-522 Inventory Holds, Buffers & Release Rules"
        - "P08 BO-905 Rental Inventory & Availability Control"
      summary: Operating hours, rental windows, buffers and release rules
      description: 'Boards 3.2, 3.3 and 3.9. **The buffer and the hold-release rule are the two that get
        forgotten.** An inventory buffer keeps a reserve back from online sale so the counter always has
        something; a hold that never releases quietly removes stock from the pool after every abandoned
        basket.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalAvailabilityRules'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalAvailabilityRules'
  /rental-blackouts:
    post:
      operationId: createRentalBlackout
      x-ticvai-consumed-by:
        - "P08 BO-520 Blackout, Closure & Capacity Blocking"
      summary: Close a product, location or window
      description: 'Board 3.7. **Closure and capacity reduction are the same act at different strengths**
        — a lake closed for weather and a lake down to half capacity both come from one operational
        decision, and modelling them separately means a venue reduces capacity in one screen and closes
        in another and the two disagree.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalBlackout'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalBlackout'
        '409':
          description: Bookings exist in the window; they are listed
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /rental-pricing-profiles:
    get:
      operationId: listRentalPricingProfiles
