        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outgoingAssetId
              - reason
              properties:
                outgoingAssetId:
                  type: string
                  format: uuid
                incomingAssetId:
                  type: string
                  format: uuid
                  nullable: true
                reason:
                  type: string
                raiseWorkOrder:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Swapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalBooking'
  /rental-bookings/{bookingId}/return:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: returnRental
      x-ticvai-consumed-by:
        - "P06 EMP-093 Return Summary & Actual Return Time"
        - "P06 EMP-097 Partial Return & Missing Equipment"
        - "P06 EMP-098 Late Fees, Damage Fees & Final Settlement"
        - "P06 EMP-099 Deposit Release, Capture & Customer Confirmation"
        - "P06 EMP-100 Return Completion & Equipment Disposition"
        - "P08 BO-566 Return Summary & Actual Return Time"
        - "P08 BO-570 Partial Return & Missing Equipment"
        - "P08 BO-571 Late Fees, Damage Fees & Final Settlement"
        - "P08 BO-572 Deposit Release, Capture & Customer Confirmation"
        - "P08 BO-573 Return Completion & Equipment Disposition"
        - "P08 BO-908 Rental Duration, Extension & Return Management"
      summary: Take it back, inspect it, and settle everything at once
      description: 'Board 8, and **this is the operation the whole contract is shaped around.**

        Actual return time decides the late fee against the grace period; condition decides the damage
        charge; partial return decides what is still missing. **All three land on one deposit**, and
        settling them as three separate acts means three authorisations against one hold and a guest
        charged twice for one dispute.

        *Capture AED 120, release AED 380* (board 4.7) is therefore one outcome of one operation.

        **A partial return does not complete the booking.** Two of three kayaks back is an open rental
        with one item outstanding, and marking it complete loses the venue a kayak quietly.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalReturn'
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalSettlement'
  /rental-bookings/{bookingId}/inspection:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: recordRentalInspection
      x-ticvai-consumed-by:
        - "P06 EMP-076 Pre-Rental Condition Inspection"
        - "P06 EMP-094 Post-Rental Condition Inspection"
        - "P06 EMP-095 Before vs After Condition Comparison"
        - "P08 BO-549 Pre-Rental Condition Inspection"
        - "P08 BO-567 Post-Rental Condition Inspection"
        - "P08 BO-568 Before vs After Condition Comparison"
        - "P08 BO-911 Inspection, Condition & Compliance Management"
      summary: Condition before or after, with evidence
      description: 'Boards 6.5 and 8.4. **Before and after are the same record with a different phase**,
        which is what makes board 8.5 — the before/after comparison — possible at all. Two differently
        shaped records could not be compared.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalInspection'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalInspection'
  /rental-bookings/{bookingId}/damage:
    parameters:
    - name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: assessRentalDamage
      x-ticvai-consumed-by:
        - "P06 EMP-096 Damage Assessment & Charge Workflow"
        - "P08 BO-569 Damage Assessment & Charge Workflow"
      summary: Price the damage, and say who approved it
      description: 'Board 8.6. **A damage charge is a commercial decision taken under pressure at a
        counter**, which is why it carries an assessor, an approver above the configured threshold, the
        evidence it rests on and the guest''s acknowledgement or dispute.

        A disputed charge is still recorded and still held — **the dispute is a state, not a deletion**,
        and a venue that resolves disputes by removing the record cannot report on them.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalDamageAssessment'
      responses:
        '201':
          description: Assessed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalDamageAssessment'
  /rental-bookings/overdue:
    get:
      operationId: listOverdueRentals
      x-ticvai-consumed-by:
        - "P06 EMP-081 Active Rental Operations Command Center"
        - "P06 EMP-087 Due Soon & Customer Notification Management"
        - "P06 EMP-088 Overdue Rental Management"
        - "P06 EMP-090 Active Rental Intelligence & Operational Alerts"
        - "P08 BO-554 Active Rental Operations Command Center"
        - "P08 BO-560 Due Soon & Customer Notification Management"
        - "P08 BO-561 Overdue Rental Management"
        - "P08 BO-563 Active Rental Intelligence & Operational Alerts"
      summary: What is late, by how long, and what it is accruing
      description: 'Boards 7.7 and 7.8. **Due-soon and overdue are one query at two thresholds**, because
        the venue''s action is the same — contact the guest — and only the tone changes.

        Carries the accruing late fee so the conversation can be specific. *"Your bike is late"* moves
        nobody; *"it is 57 minutes late and that is AED 35 so far"* moves people.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: dueWithinMinutes
        in: query
        schema:
          type: integer
      - name: locationId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Late and due-soon rentals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalBooking'
  /rental-incidents:
    post:
      operationId: reportRentalIncident
      x-ticvai-consumed-by:
        - "P06 EMP-086 Rental Incident & Operational Exception"
        - "P08 BO-559 Rental Incident & Operational Exception"
      summary: Something happened during a rental
      description: 'Board 7.6. Injury, loss, theft, a complaint, an equipment failure. **Distinct from
        damage**, which is assessed at return against a deposit — an incident may have no charge attached
        and still be the most important thing that happened that day.

        Raises a `maintenance` work order where equipment is involved, rather than keeping a second
        repair queue here.

        '
      tags:
      - rental
      x-ticvai-permission: RENTAL_OPERATE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalIncident'
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalIncident'
components:
  schemas:
    RentalProduct:
      type: object
      x-ticvai-persistence: rental.product
      description: 'Board 1.3. **The master reference every later board resolves against.**'
      required:
      - code
      - name
      - venueId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        internalName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        imageAssetId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        tenantId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        scopePath:
          type: string
        trackingModel:
          type: string
          enum:
          - pooled
          - serialised
          - hybrid
        catalogueProductId:
          type: string
          format: uuid
          nullable: true
          description: '**The thing the guest actually buys.** `catalogue` sells it and this configures
            how it behaves once sold; the link is here so a rental is never sold twice through two
            different product records.

            '
        resourceTypeId:
          type: string
          format: uuid
          nullable: true
          description: '**For serialised products, the `resources` type its assets belong to.** The
            individual bikes are resources and maintenance assets — this contract does not keep a third
            register of them.

            '
        status:
          type: string
          enum:
          - draft
          - configurationReview
          - approved
          - active
          - suspended
          - archived
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          default: 1
        isActive:
          type: boolean
          default: true
    RentalCategory:
      type: object
      x-ticvai-persistence: maintenance.asset_category
      description: 'Board 1.4. **Defaults cascade and products override within a permitted set.**'
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        parentCategoryId:
          type: string
          format: uuid
          nullable: true
        iconAssetId:
          type: string
          format: uuid
          nullable: true
        defaultTrackingModel:
          type: string
          nullable: true
        defaultDurationMinutes:
          type: integer
          nullable: true
        defaultTurnaroundMinutes:
          type: integer
          nullable: true
        defaultWaiverRequired:
          type: boolean
          default: false
        defaultDepositPolicyId:
          type: string
          format: uuid
          nullable: true
        overridableFields:
          type: array
          items:
            type: string
          description: '**Which defaults a product may override.** An empty list means the category is
            binding, which is the whole point of a category for a venue that wants consistency.

            '
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    RentalInventoryModel:
      type: object
      x-ticvai-persistence: rental.inventory_model
      description: 'Board 1.5. **Pooled, serialised or hybrid**, and the switches the counter obeys.'
      required:
      - trackingModel
      properties:
        trackingModel:
          type: string
          enum:
          - pooled
          - serialised
          - hybrid
        inventoryUnit:
          type: string
          nullable: true
        totalQuantity:
          type: integer
          nullable: true
          description: Pooled only. *150 lockers.*
        components:
          type: array
          description: '**Hybrid only** — *one serialised kayak, two pooled paddles, two pooled life
            jackets.* One booking, two mechanisms.

            '
          items:
            type: object
            properties:
              resourceTypeId:
                type: string
                format: uuid
                nullable: true
              label:
                type: string
              quantity:
                type: integer
              serialised:
                type: boolean
        assignmentRequiredAtCheckout:
          type: boolean
          default: false
        scanRequired:
          type: boolean
          default: false
        allowManualAssignment:
          type: boolean
          default: true
        allowSubstitution:
          type: boolean
          default: true
        allowEquipmentSwap:
          type: boolean
          default: true
        scopePath:
          type: string
    RentalLocationRule:
      type: object
      x-ticvai-persistence: rental.location_rule
      description: 'Board 1.6. **Pickup and return are separate flags**, because a station that hands out
        kayaks and cannot receive them is a real shape.

        '
      required:
      - locationId
      properties:
        locationId:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
        pickupAllowed:
          type: boolean
          default: true
        returnAllowed:
          type: boolean
          default: true
        crossLocationReturnAllowed:
          type: boolean
          default: false
        inventoryAllocation:
          type: integer
          nullable: true
        inventoryBuffer:
          type: integer
          default: 0
          description: '**Held back from online sale**, so the counter always has something to give the
            guest standing in front of it.

            '
        operatingHours:
          type: object
          nullable: true
          additionalProperties: true
        scopePath:
          type: string
    RentalDurationRules:
      type: object
      x-ticvai-persistence: rental.duration_rules
      description: 'Board 1.7. **Turnaround feeds availability automatically.** *10:00–11:00 rental,
        11:00–11:15 turnaround, next available 11:15.*

        '
      properties:
        minimumMinutes:
          type: integer
        maximumMinutes:
          type: integer
        incrementMinutes:
          type: integer
          default: 15
        defaultMinutes:
          type: integer
        turnaroundMinutes:
          type: integer
          default: 0
        extensionAllowed:
          type: boolean
          default: true
        maximumExtensionMinutes:
          type: integer
          nullable: true
        sameDayReturnRequired:
          type: boolean
          default: false
        overnightAllowed:
          type: boolean
          default: false
        scopePath:
          type: string
    RentalOperationalRules:
      type: object
      x-ticvai-persistence: rental.operational_rules
      description: 'Board 1.8. **Three states per rule — required, optional, not applicable.** *Optional*
        and *not applicable* look identical at the counter and are entirely different in an audit.

        '
      properties:
        minimumAge:
          type: integer
          nullable: true
        maximumAge:
          type: integer
          nullable: true
        minimumHeightCm:
          type: integer
          nullable: true
        maximumWeightKg:
          type: integer
          nullable: true
        idRequired:
          $ref: '#/components/schemas/RuleRequirement'
        guardianRequired:
          $ref: '#/components/schemas/RuleRequirement'
        membershipRequired:
          $ref: '#/components/schemas/RuleRequirement'
        drivingLicenceRequired:
          $ref: '#/components/schemas/RuleRequirement'
        safetyBriefingRequired:
          $ref: '#/components/schemas/RuleRequirement'
        checkoutScanRequired:
          $ref: '#/components/schemas/RuleRequirement'
        returnScanRequired:
          $ref: '#/components/schemas/RuleRequirement'
        conditionInspectionRequired:
          $ref: '#/components/schemas/RuleRequirement'
        photoAtCheckoutRequired:
          $ref: '#/components/schemas/RuleRequirement'
        photoAtReturnRequired:
          $ref: '#/components/schemas/RuleRequirement'
        maximumQuantityPerCustomer:
          type: integer
          nullable: true
        returnLocationRestricted:
          type: boolean
          default: false
        partialReturnAllowed:
          type: boolean
          default: true
        staffApprovalRequired:
          type: boolean
          default: false
        scopePath:
          type: string
    RuleRequirement:
      type: string
      enum:
      - required
      - optional
      - notApplicable
      default: notApplicable
    RentalAgreementRules:
      type: object
      x-ticvai-persistence: rental.agreement_rules
      description: 'Board 1.9. **The version is part of the rule**, because a signature against text
        nobody kept is not a defence.

        '
      properties:
        customerFields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RuleRequirement'
        agreementRequired:
          type: boolean
          default: false
        liabilityWaiverRequired:
          type: boolean
          default: false
        termsDocumentAssetId:
          type: string
          format: uuid
          nullable: true
        agreementVersion:
          type: string
          nullable: true
        eSignatureRequired:
          type: boolean
          default: false
        guardianSignatureForMinor:
          type: boolean
          default: true
        groupWaiverMode:
          type: string
          enum:
          - perParticipant
          - singleGroupWaiver
          default: perParticipant
        scopePath:
          type: string
    RentalConfigurationFinding:
      type: object
      description: 'Boards 1.10 and 4.10. **Severity travels with the finding**, so the publish gate can
        distinguish a missing turnaround buffer from a missing price.

        '
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - blocking
          - warning
          - advisory
        message:
          type: string
        field:
          type: string
          nullable: true
        source:
          type: string
          enum:
          - validation
          - ai
          default: validation
          description: '**AI findings are advisory unless the client configures otherwise** (board 1.10),
            so the origin is on the record rather than assumed by the reader.

            '
    RentalImportResult:
      type: object
      description: '26 August onboarding load. **Validated whole, written whole.**'
      properties:
        rowsRead:
          type: integer
        productsCreated:
          type: integer
        assetsCreated:
          type: integer
        rowsRejected:
          type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/RentalConfigurationFinding'
        committed:
          type: boolean
    RentalAvailability:
      type: object
      description: 'Board 3. **A pooled product answers with a count, a serialised one with assets.**'
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          nullable: true
        windows:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              availableQuantity:
                type: integer
              availableAssetIds:
                type: array
                items:
                  type: string
                  format: uuid
        blockedWindows:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              reason:
                type: string
                enum:
                - booked
                - turnaround
                - maintenance
                - blackout
                - closed
                - buffer
                - held
    RentalAvailabilityRules:
      type: object
      x-ticvai-persistence: rental.availability_rules
      description: 'Boards 3.2, 3.3 and 3.9. **The hold-release rule is the one that quietly loses
        stock.**

        '
      properties:
        operatingWindows:
          type: array
          items:
            type: object
            properties:
              daysOfWeek:
                type: array
                items:
                  type: string
              from:
                type: string
              to:
                type: string
        slotMinutes:
          type: integer
          nullable: true
        holdMinutes:
          type: integer
          default: 15
          description: '**How long an unconfirmed basket keeps stock.** A hold that never expires removes
            inventory from sale after every abandoned checkout.

            '
        releaseOnPaymentFailure:
          type: boolean
          default: true
        overbookPercent:
          type: number
          default: 0
        scopePath:
          type: string
    RentalBlackout:
      type: object
      x-ticvai-persistence: rental.blackout
      description: 'Board 3.7. **Closure and capacity reduction are one act at different strengths.**'
      required:
      - from
      - to
      - reason
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
        locationId:
          type: string
          format: uuid
          nullable: true
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        reason:
          type: string
        capacityPercent:
          type: integer
          default: 0
          description: Zero closes it; fifty halves it.
        scopePath:
          type: string
    RentalPricingProfile:
      type: object
      x-ticvai-persistence: rental.pricing_profile
      description: 'Board 4.2. **Several will apply at once**, and the precedence is configurable and
        auditable (board 4.10).

        '
      required:
      - code
      - name
      - model
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        productId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
          nullable: true
        locationIds:
          type: array
          items:
            type: string
            format: uuid
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          x-ticvai-persisted: false
          description: '**Resolved from the region, not stored** (ADR-0018). Region-scoped and not
            overridable below it, so a row in a UAE region is AED and cannot be anything else. Kept on
            the wire, removed from the table.

            '
        salesChannel:
          type: string
          nullable: true
        customerSegmentId:
          type: string
          format: uuid
          nullable: true
        model:
          type: string
          enum:
          - flat
          - durationBased
          - tiered
          - peakOffPeak
          - weekend
          - seasonal
          - dynamic
          - hybrid
        basePrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        durationTiers:
          type: array
          description: 'Board 4.3. *30 min AED 40, 60 min AED 60, 90 min AED 80, 120 min AED 95.*'
          items:
            type: object
            properties:
              minutes:
                type: integer
              price:
                $ref: ../shared/common.yaml#/components/schemas/Money
        minimumCharge:
          $ref: ../shared/common.yaml#/components/schemas/Money
        billingIncrementMinutes:
          type: integer
          nullable: true
        additionalIncrementPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        rounding:
          type: string
          enum:
          - exactUsage
          - roundUp15
          - roundUp30
          - roundUpHour
          default: exactUsage
        calendarRules:
          type: array
          description: 'Board 4.4. *Peak 16:00–20:00 AED 90/hr; off-peak 09:00–12:00 AED 50/hr; peak
            season 1 Nov – 31 Mar.*

            '
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - peak
                - offPeak
                - weekend
                - seasonal
                - special
              from:
                type: string
                nullable: true
              to:
                type: string
                nullable: true
              dateFrom:
                type: string
                format: date
                nullable: true
              dateTo:
                type: string
                format: date
                nullable: true
              adjustmentPercent:
                type: number
                nullable: true
              price:
                $ref: ../shared/common.yaml#/components/schemas/Money
        dynamicEnabled:
          type: boolean
          default: false
        dynamicMaxIncreasePercent:
          type: number
          default: 25
        dynamicMaxDecreasePercent:
          type: number
          default: 15
        priority:
          type: integer
          default: 0
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
          - draft
          - pendingApproval
          - active
          - scheduled
          - expired
        scopePath:
          type: string
    RentalQuoteRequest:
      type: object
      required:
      - productId
      - from
      - to
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          nullable: true
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        quantity:
          type: integer
          default: 1
        salesChannel:
          type: string
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        promotionCode:
          type: string
          nullable: true
    RentalQuote:
      type: object
      description: 'Board 4.10. **Rental amount and deposit are returned apart, because the deposit is
        not revenue.**

        '
      properties:
        quoteId:
          type: string
          format: uuid
        rentalAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        addOnAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        discountAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        totalPayable:
          $ref: ../shared/common.yaml#/components/schemas/Money
        depositAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        depositInstrument:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    RentalPriceExplanation:
      type: object
      description: 'Board 4.10 — *"show why the price was calculated."* **The ordered trace, including
        the rules that did not apply**, because *"why is it not the peak price"* is asked as often as
        *"why is it"*.

        '
      properties:
        quote:
          $ref: '#/components/schemas/RentalQuote'
        steps:
          type: array
          items:
            type: object
            properties:
              order:
                type: integer
              stage:
                type: string
                enum:
                - basePrice
                - locationRule
                - calendarRule
                - dynamicPricing
                - channelEligibility
                - promotion
                - manualOverride
                - tax
              ruleId:
                type: string
                format: uuid
                nullable: true
              ruleName:
                type: string
                nullable: true
              applied:
                type: boolean
              skippedBecause:
                type: string
                nullable: true
              amountBefore:
                $ref: ../shared/common.yaml#/components/schemas/Money
              amountAfter:
                $ref: ../shared/common.yaml#/components/schemas/Money
    RentalDepositPolicy:
      type: object
      x-ticvai-persistence: rental.deposit_policy
      description: 'Boards 4.6 and 4.7. **Held, not taken**, and settled against an inspection.'
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        required:
          type: boolean
          default: true
        basis:
          type: string
          enum:
          - fixed
          - percentage
          - riskBased
        fixedAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        percentage:
          type: number
          nullable: true
        minimumAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        maximumAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        instruments:
          type: array
          items:
            type: string
            enum:
            - cardPreAuthorisation
            - cardCharge
            - cash
            - wallet
        autoRelease:
          type: boolean
          default: true
        inspectionRequiredBeforeRelease:
          type: boolean
          default: false
        autoReleaseDelayHours:
          type: integer
          default: 0
        partialCapturePermitted:
          type: boolean
          default: true
        supervisorApprovalThreshold:
          $ref: ../shared/common.yaml#/components/schemas/Money
        waiverEligible:
          type: boolean
          default: false
        scopePath:
          type: string
    RentalFeePolicy:
      type: object
      x-ticvai-persistence: rental.fee_policy
      description: 'Board 4.8. **Extension is priced below late return on purpose** — *"this encourages
        customers to extend properly rather than returning late."*

        '
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
        gracePeriodMinutes:
          type: integer
          default: 0
        lateFeeBasis:
          type: string
          enum:
          - fixed
          - perMinute
          - per15Minutes
          - per30Minutes
          - perHour
          - tiered
        lateFeeAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        lateFeeTiers:
          type: array
          items:
            type: object
            properties:
              afterMinutes:
                type: integer
              amount:
                $ref: ../shared/common.yaml#/components/schemas/Money
        maximumDailyCharge:
          $ref: ../shared/common.yaml#/components/schemas/Money
        extensionPricePerIncrement:
          $ref: ../shared/common.yaml#/components/schemas/Money
        extensionIncrementMinutes:
          type: integer
          default: 30
        notReturnedAfterHours:
          type: integer
          nullable: true
          description: '**When a late rental becomes a lost one.** The deposit is captured in full and
            the asset retired; without a threshold the fee accrues forever and nobody decides.

            '
        scopePath:
          type: string
    RentalOverride:
      type: object
      x-ticvai-persistence: rental.override
      description: 'Board 4.9. **The original amount is recorded as well as the adjusted one.**'
      required:
      - kind
      - reason
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - priceOverride
          - complimentary
          - depositWaiver
          - depositReduction
          - lateFeeWaiver
          - damageFeeWaiver
          - extensionFeeWaiver
          - manualRefund
          - goodwill
        originalAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        adjustedAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        reason:
          type: string
        requestedBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
          nullable: true
        approvalRequestId:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time
        scopePath:
          type: string
    RentalBookingRequest:
      type: object
      required:
      - productId
      - from
      - to
      properties:
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        returnLocationId:
          type: string
          format: uuid
          nullable: true
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        quantity:
          type: integer
          default: 1
        customerId:
          type: string
          format: uuid
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RentalParticipant'
        acceptedQuoteId:
          type: string
          format: uuid
          nullable: true
    RentalBooking:
      type: object
      x-ticvai-persistence: rental.booking
      description: 'Board 5. **The booking outlives the order** — an order completes at payment and the
        rental is still out.

        '
      required:
      - id
      - productId
      - from
      - to
      - status
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        productId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        returnLocationId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        quantity:
          type: integer
        status:
          type: string
          enum:
          - draft
          - confirmed
          - awaitingArrival
          - checkedOut
          - overdue
          - partiallyReturned
          - completed
          - completedWithDamage
          - notReturned
          - cancelled
          - noShow
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        dueBackAt:
          type: string
          format: date-time
          nullable: true
        returnedAt:
          type: string
          format: date-time
          nullable: true
        depositAuthorisationId:
          type: string
          format: uuid
          nullable: true
        accruedLateFee:
          $ref: ../shared/common.yaml#/components/schemas/Money
        readiness:
          type: array
          readOnly: true
          description: '**Computed, not stored** — agreement, requirements, deposit, equipment.'
          items:
            type: object
            properties:
              check:
                type: string
              satisfied:
                type: boolean
              detail:
                type: string
                nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RentalParticipant'
        scopePath:
          type: string
    RentalParticipant:
      type: object
      x-ticvai-persistence: rental.participant
      description: 'Board 5.5. **A group rental is one booking with participants**, because the
        agreement, the deposit and the return are handled together.

        '
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isPrimaryRenter:
          type: boolean
          default: false
        dateOfBirth:
          type: string
          format: date
          nullable: true
        idNumber:
          type: string
          nullable: true
        guardianName:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        hasSignedWaiver:
          type: boolean
          readOnly: true
        customFields:
          type: object
          additionalProperties: true
    RentalAgreementSignature:
      type: object
      x-ticvai-persistence: rental.agreement_signature
      description: 'Boards 1.9 and 5.6. **The version signed travels with the signature.**'
      required:
      - agreementVersion
      properties:
        id:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
          nullable: true
        agreementVersion:
          type: string
        signatoryName:
          type: string
        signatoryRole:
          type: string
          enum:
          - renter
          - participant
          - guardian
        signatureAssetId:
          type: string
          format: uuid
          nullable: true
        documentAssetId:
          type: string
          format: uuid
          nullable: true
        signedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
          nullable: true
        scopePath:
          type: string
    RentalCheckOut:
      type: object
      description: 'Board 6. **The readiness gate is enforced server-side.**'
      properties:
        depositAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        depositInstrument:
          type: string
          nullable: true
        conditionNote:
          type: string
          nullable: true
        photoAssetIds:
          type: array
          items:
            type: string
            format: uuid
        safetyBriefingGiven:
          type: boolean
          default: false
        dueBackAt:
          type: string
          format: date-time
          nullable: true
        overrideId:
          type: string
          format: uuid
          nullable: true
          description: '**A supervisor override for a failed precondition**, which is recorded rather
            than allowed silently.

            '
    RentalEquipmentAssignment:
      type: object
      x-ticvai-persistence: rental.equipment_assignment
      description: 'Board 6.4. **The moment a serialised rental stops being a quantity.**'
      required:
      - assetId
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          description: A `maintenance.Asset`, which is also a `resources` resource where the product is
            schedule-controlled.
        serialNumber:
          type: string
          nullable: true
        scannedCode:
          type: string
          nullable: true
        assignedManually:
          type: boolean
          default: false
        assignedAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
    RentalInspection:
      type: object
      x-ticvai-persistence: rental.inspection
      description: 'Boards 6.5 and 8.4. **Before and after are one record shape with a phase**, which is
        what makes the comparison view possible.

        '
      required:
      - phase
      - condition
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          nullable: true
        phase:
          type: string
          enum:
          - preRental
          - postRental
        condition:
          type: string
          enum:
          - good
          - minorDamage
          - majorDamage
          - faulty
          - notReturned
          description: '**26 August: simplified state attributes.** *"rental/equipment items can be
            tracked with simplified state attributes (e.g., available, rented, faulty) rather than
            requiring granular custom attributes for this category — agreed by Allam."* So the condition
            is a short enum, and anything finer belongs in the note or the photographs.

            '
        checklist:
          type: array
          items:
            type: object
            properties:
              item:
                type: string
              passed:
                type: boolean
              note:
                type: string
                nullable: true
        note:
          type: string
          nullable: true
        photoAssetIds:
          type: array
          items:
            type: string
            format: uuid
        inspectedBy:
          type: string
          format: uuid
        inspectedAt:
          type: string
          format: date-time
        scopePath:
          type: string
    RentalDamageAssessment:
      type: object
      x-ticvai-persistence: rental.damage_assessment
      description: 'Board 8.6. **A dispute is a state, not a deletion.**'
      required:
      - amount
      - description
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        inspectionId:
          type: string
          format: uuid
          nullable: true
        assessedBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
          nullable: true
        customerAcknowledgement:
          type: string
          enum:
          - accepted
          - disputed
          - notPresented
          default: notPresented
        workOrderId:
          type: string
          format: uuid
          nullable: true
          description: Raised in `maintenance`, so the repair is tracked where every other repair is.
        scopePath:
          type: string
    RentalReturn:
      type: object
      description: 'Board 8. **Late fee, damage and partial return all land on one deposit.**'
      required:
      - returnedAt
      properties:
        returnedAt:
          type: string
          format: date-time
        returnLocationId:
          type: string
          format: uuid
          nullable: true
        returnedAssetIds:
          type: array
          items:
            type: string
            format: uuid
        missingAssetIds:
          type: array
          items:
            type: string
            format: uuid
        inspection:
          $ref: '#/components/schemas/RentalInspection'
        damage:
          type: array
          items:
            $ref: '#/components/schemas/RentalDamageAssessment'
        waiveLateFee:
          type: boolean
          default: false
        overrideId:
          type: string
          format: uuid
          nullable: true
    RentalSettlement:
      type: object
      x-ticvai-persistence: rental.settlement
      description: 'Board 8.8. **One statement, because there is one deposit.** *Capture AED 120, release
        AED 380.*

        '
      properties:
        bookingId:
          type: string
          format: uuid
        expectedReturnAt:
          type: string
          format: date-time
        actualReturnAt:
          type: string
          format: date-time
        gracePeriodMinutes:
          type: integer
        chargeableLateMinutes:
          type: integer
        lateFee:
          $ref: ../shared/common.yaml#/components/schemas/Money
        damageFee:
          $ref: ../shared/common.yaml#/components/schemas/Money
        missingItemFee:
          $ref: ../shared/common.yaml#/components/schemas/Money
        totalCharged:
          $ref: ../shared/common.yaml#/components/schemas/Money
        depositCaptured:
          $ref: ../shared/common.yaml#/components/schemas/Money
        depositReleased:
          $ref: ../shared/common.yaml#/components/schemas/Money
        balanceDue:
          $ref: ../shared/common.yaml#/components/schemas/Money
          description: '**Where the charges exceed the deposit.** A bike written off against a AED 200
            hold leaves a real debt, and netting it to zero hides it.

            '
        outcome:
          type: string
          enum:
          - completed
          - completedWithDamage
          - partiallyReturned
          - notReturned
        scopePath:
          type: string
    RentalIncident:
      type: object
      x-ticvai-persistence: rental.incident
      description: 'Board 7.6. **Distinct from damage** — an incident may carry no charge and still be
        the most important thing that happened.

        '
      required:
      - kind
      - description
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
          nullable: true
        assetId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - injury
          - loss
          - theft
          - complaint
          - equipmentFailure
          - safetyBreach
          - other
        description:
          type: string
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        reportedBy:
          type: string
          format: uuid
        reportedAt:
          type: string
          format: date-time
        photoAssetIds:
          type: array
          items:
            type: string
            format: uuid
        workOrderId:
          type: string
          format: uuid
          nullable: true
        authorityNotified:
          type: boolean
          default: false
        scopePath:
          type: string
