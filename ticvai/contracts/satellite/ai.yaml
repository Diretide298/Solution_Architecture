    get:
      operationId: listAiProviders
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience:
      - staff
      summary: Configured providers and their order
      description: '8.4.21–8.4.26. OpenAI, Gemini, Claude and a local model, several at once, with failover.

        **Order is configuration, not code.** A capability names what it needs — a model that reasons,
        a model that embeds — and the platform resolves which provider serves it. That is what makes "no
        provider SDK in capability code" enforceable rather than aspirational.

        **Per tenant** (decided 28 September, audit R203; ADR-0009). Platform staff read and set a
        tenant''s providers on ADM-037, acting inside the tenant under a platform-staff grant (audit
        R098); the tenant''s own staff read them with `AI_CONFIGURE`. Each row carries `residency`, which
        the tenant''s region may restrict (`tenancy.RegionSettings.allowedAiResidencies`). ADM-037 finds
        that region from `subscription.Tenant.regionId` and reads it with `tenancy.getRegionSettings`.

        '
      tags:
      - config
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProvider'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setAiProvider
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience:
      - staff
      summary: Configure a provider
      description: '**Per tenant, with a compliance gate (decided 28 September, audit R203), as ADR-0009
        says.** Inference is a data transfer: a prompt containing guest data leaves the jurisdiction the
        moment it reaches a provider hosted elsewhere. So **platform staff set a tenant''s provider on
        ADM-037**, and **a region may restrict the choice**: a provider whose `residency` is not in the
        allowed residencies of the tenant''s home region (`subscription.Tenant.regionId`, read through
        `tenancy.getRegionSettings` as `RegionSettings.allowedAiResidencies`; empty means no restriction)
        is refused with 409 `residency-refused`, which is the gate.

        **How the permission is honoured in the tenant''s cell** (decided 28 September, audit R203).
        `PLATFORM_TENANT_MANAGE` is a platform permission: it is read from the operator''s platform token,
        never from a platform-staff grant, which refuses `PLATFORM_*` values. The cell additionally
        requires the operator to have a grant into this tenant open (`openPlatformStaffGrant`, audit R098),
        so the change is audited against that grant (`AuditRecord.platformStaffGrantId`); without one it
        refuses `403 platform-grant-required`. A tenant''s own staff cannot set a provider, whatever they
        hold.

        Credentials are a key-vault reference, never the key.

        **What the PUT does.** The body is one whole provider configuration, matched on `id`. With
        an `id`, it replaces that provider''s configuration in full — a field left out takes its default
        or null, not its old value — and returns 200; an `id` that names no provider at the caller''s
        scope is a 404. Without an `id`, it creates a provider and returns 201 with the new id. The
        other providers are never touched: this is not a replace-the-list call.

        **Who pays, and bring-your-own-key** (AI design 5.9, decided 29 September). `managedBy: ticvai` is
        the default: TICVAI-managed Azure OpenAI in UAE North, metered per tenant and re-billed per token.
        `managedBy: tenant` is bring-your-own-key, which **TICVAI enables per tenant** with
        `setAiByokEnablement` (`PLATFORM_AI_MANAGE`); until it is enabled, a tenant-managed provider is
        refused with 409 `byok-not-enabled`, and a task outside `AiByokEnablement.allowedTasks` likewise.
        `modelId` names the model in the catalogue (`listAiModels`) the provider serves.

        **Per agent task, and checked for fitness** (21 September minutes, M21-03 and M21-09). `taskKeys`
        binds the provider to named agent tasks; the response carries `fitnessWarnings` where the model scores
        outside a task''s band in `AiModel.taskFitness` (underpowered, overpowered or never scored).

        **The client cannot change the model; TICVAI curates it** (Chinmay, 2 October, workbook Q2; amends AI-D18
        "warns, never blocks"; CHG-CSA-001). A cheaper model picked because it is cheap breaks the AI functions,
        so a `modelId` that is not in TICVAI''s curated range for every task in `taskKeys`
        (`AiModel.curatedRange`) is refused `422 model-not-curated`, whoever writes it.

        **Bring-your-own-key maps each task to the provider''s equivalent** (Chinmay, 2 October, workbook Q1;
        closes AI-D20; CHG-CSA-001). With BYOK the tenant names its provider and key; the gateway assigns, per
        task, that provider''s model from the curated range at the tier the task needs (Small, Strong, Reasoning;
        `AiByokEnablement.taskModelMap`). Usage is billed to the tenant''s own key. Platform-owned models
        (embeddings, reranking, moderation, PII detection, OCR, speech) are never BYOK.

        **Any provider, as long as there is an API key** (Chinmay, 2 October, contract follow-ups: "As long as we get
        an API key it can be any model; we just need to store it correctly"; CHG-FUP-008). A tenant-managed provider
        names its company in `vendor` (any provider: `mistral`, `cohere`, `deepseek` ...) and is reached through a
        native adapter (`kind` `openai`, `gemini`, `anthropic` or `azureOpenai`) or, for every other vendor, through
        `openaiCompatible` with the vendor''s `endpoint`. A vendor that offers neither is refused
        `422 provider-protocol-unsupported`. The key goes in through `setAiCredential` only (a per-tenant Key Vault
        secret, write-only). The curated task-to-tier map then picks that vendor''s equivalent model per task
        (`AiModel.vendor`, `AiModel.curatedRange`), and **a tenant-managed provider is activated only after a
        compatibility test passes** (`testAiProvider`, `AiProvider.compatibility`): `isActive: true` before then is
        refused `409 compatibility-test-required`. A task whose test fails stays on the TICVAI-managed model.

        **Residency class** (Chinmay, 2 October: the AI residency decision; CHG-CSA-002). A provider whose
        `residencyClasses` does not include the tenant''s class is refused `409 residency-class-refused`; BYOK fits
        the `globalAllowed` class only, because a tenant key outside OpenAI UAE is a cross-border transfer
        (ADR-0009 section 3).

        '
      tags:
      - config
      x-ticvai-permission: PLATFORM_TENANT_MANAGE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProvider'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Configured — an existing provider, named by `id`, replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '201':
          description: Created — the body carried no `id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '403':
          description: The caller lacks `PLATFORM_TENANT_MANAGE` on their platform token, or has no
            platform-staff grant into this tenant open (`platform-grant-required`, audit R203).
          x-ticvai-problem-types:
          - platform-grant-required
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: The provider's `residency` is not in the tenant's region's `allowedAiResidencies`
            (`residency-refused`, audit R203), or it is tenant-managed (`managedBy` is `tenant`) and bring-your-own-key is not
            enabled for the tenant (`byok-not-enabled`, decided 29 September), or its `residencyClasses` does not
            include the tenant's AI residency class (`residency-class-refused`, CHG-CSA-002), or it is tenant-managed,
            `isActive` is true and its compatibility test has not passed (`compatibility-test-required`, CHG-FUP-008).
          x-ticvai-problem-types:
          - residency-refused
          - byok-not-enabled
          - residency-class-refused
          - compatibility-test-required
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: The `modelId` is outside TICVAI's curated range for a task in `taskKeys` (`model-not-curated`,
            CHG-CSA-001), or a tenant-managed provider's `kind` is neither a native adapter nor `openaiCompatible` with
            an `endpoint` (`provider-protocol-unsupported`, CHG-FUP-008).
          x-ticvai-problem-types:
          - model-not-curated
          - provider-protocol-unsupported
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /policy:
