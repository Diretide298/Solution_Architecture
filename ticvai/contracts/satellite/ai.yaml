      x-ticvai-agreed: '29 September: AI system design 3.11 (Help me choose, decided 29 September); shape follows
        proposeVenueLabels'
      summary: Suggest a Help me choose set-up from the venue's catalogue
      description: '**The Help me choose job** (design 3.11, decided 29 September; C7 at autonomy "suggest"). Runs
        automatically when a venue''s products are uploaded (`catalogue.productPublished`), when a mapped product
        is withdrawn, or when new products are left out by every answer; this is the same job on request. **Rules
        first:** it reads the products through the catalogue API with the venue''s permissions, picks the one or
        two attributes that split them most evenly (dropping any where an answer would leave nothing bookable),
        maps each answer to a product, category or flow, and only then asks a language model to word the questions
        in the tenant''s languages from the attributes alone, never guest data. With no model, the attribute names
        are used as they are. The draft lands through `white-label.proposeGuidedChoice` with `source: aiSuggested`
        and this suggestion''s id as `suggestionRef`, and a decision record keeps the inputs, splits and versions.
        **Nothing is published**: publishing is `white-label.publishGuidedChoice`, by a person.


        **Filter questions, not a quiz** (decided 29 September, W4; applied 30 September). It proposes up
        to four questions, each with a `kind` (`choice`, `yesNo`, `age`, `level`, `certification`) and, for
        each answer, an `answer.filter` built from what the catalogue already states: age and height limits
        from `ProductEligibilityRule` (`minAgeYears`/`maxAgeYears`), segment tags (`segmentTags`),
        certifications (`certificationCode` against `ProductEligibilityRule.requiredCertificationCode`),
        swim consent questions (`requiresSwimmer`, with `consentPrefill` so the REV3-26 consent is pre-filled
        and still confirmed), and products or categories (`productIds`, `productCategoryIds`). The default
        behaviour it proposes is `filter` with *Show everything* on; an answer that would leave nothing
        bookable is dropped.

        '
