        (service)'
      summary: Score a pending approval request, as context for its reviewer (Approvals)
      description: '11.1.73, 11.1.74, 11.1.75. **Context for the reviewer, never a recommendation to approve or reject.**
        The minutes of 8 September keep AI in approvals at analytics: it must not recommend or influence the approve
        or reject decision (as `approvals.approveUnifiedDecision` says). **The response has no approve or reject field,
        by design, and none may be added.** What it gives is a risk assessment of the request, a priority score for
        ordering the work, and a suggested escalation for an SLA problem, each with the signals behind it.


        Called by Approvals (service audience) when a request is submitted or resubmitted and on each SLA tick. Rules-first
        (design 3.10): **risk** from the amount against the module''s and the requester''s history, the requester''s
        entity risk (`ai.entity_risk`, staff or account), unusual timing and whether the action is irreversible; **priority**
        from SLA time left, value, business impact and the approver''s queue; **escalation** from the pattern of breaches
        at the current step: `escalate` where the step breaches its SLA at this rate, `addBackupApprover` where the
        approver is unavailable or overloaded, otherwise `none`. A promoted model may replace a rule per tenant only
        after a shadow run, as everywhere.


        **What Approvals may do with it:** show it to the reviewer and order an inbox by `priorityScore`. The approvals
        matrix never routes on it (MoM 8 September: AI in approvals is analytics only). It never decides,
        never pre-selects an outcome, and a suggested escalation is carried out, if at all, by a person or by the
        tenant''s own SLA policy. Each score writes one decision record; the latest is kept per request.

        '
      tags:
      - risk
      x-ticvai-permission: null
      x-ticvai-auth: service
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-scope-level: venue
