openapi: 3.1.0
info:
  title: TICVAI — AI
  version: 1.0.0
  x-ticvai-screen-count: 131
  x-ticvai-module: 8 — Unified Operations Dashboard (AI)
  x-ticvai-platforms:
  - P01 Guest Web
  - P02 Guest App
  - P05 Guest Kiosk
  - P06 Venue Staff App
  - P08 Venue Management
  - P09 TICVAI Web
  - P12 Venue Support
  - P13 Venue CMS
  - P16 Venue Analytics
  x-ticvai-tier: satellite
  description: '**Retrieval and inference over data the platform already holds. Nothing here needs a trained
    model.**

    Scope was set on 14 August. Forecasting, fraud detection, dynamic pricing and recommendation all require
    operating history that does not exist before go-live, and a model trained on nothing predicts nothing.
    Those 194 requirements are parked with their front ends, back ends and tables buildable and their
    engines deferred.

    **Superseded on 29 September by the AI system design** (`docs/architecture/ai-system-design.md`,
    all sixteen decisions taken that day). The capabilities ship now with rules and statistics as their
    producers, labels are captured from day one, and a trained model replaces a rule per tenant only
    when a shadow run proves it better and a person promotes it (design 3.5, 3.12; ADR-0051). **The gate
    is evidence, not a calendar**, so the parked requirements come back into scope: this contract now
    carries governance, the action pipeline, the configuration assistant, forecasting, anomaly
    detection, risk, the recommendation engine, decision records and monitoring (design 2.3).

    What is left is the part that works on day one because it reads what is already there: a conversational
    assistant grounded in the tenant''s own catalogue and configuration (8.4.38 names RAG outright), semantic
    search across products and documents (8.4.39), configuration assistance that walks an admin through
    creating a product (CF-57, the client''s stated first priority), map and layout generation from an
    uploaded plan, and the governance that makes all of it auditable.

    ## Four rules this contract enforces

    **No provider SDK in capability code.** `AiProvider` is configuration. OpenAI, Gemini, Claude and
    a local model are interchangeable at the operation level (8.4.21–8.4.25), and failover between them
    is a platform concern rather than a caller''s (8.4.26).

    **Tenant isolation is enforced by the store** (ADR-0049, which amends ADR-0021). Vectors live in
    Qdrant from day one, one collection per tenant per embedding model behind the alias `tenant_<id>`,
    readable only with that tenant''s collection-scoped JWT. The tenant database keeps the point references
    (`ai.chunk_embedding`), not the vectors; there is no pgvector. Venue scope is a payload filter the
    single retrieval client always adds, and the client still takes no scope parameter.

    The rule this replaces said isolation must never be filter-level. **That was right about shared placement
    for the wrong stated reason, and reasoning from it produced a cross-tenant defect on 17 August (CF-97)**
    — which is why the corrected version lives here, in the file servers and clients are generated from,
    rather than only in the ADR.

    **Read-only against the transactional core.** An AI capability must never become a permission bypass.
    Retrieval runs as the calling principal and returns only what that principal could have read directly.
    An assistant that can see more than its user is a privilege escalation with a friendly interface.

    **Every capability passes one governance decision point and writes one decision record** (design
    3.8, 3.9). One autonomy scale, 0 to 4, applies to every capability (ADR-0050).

    **Nothing acts without approval.** The assistant drafts a product, a promotion or a pricing rule and
    a person applies it (8.3.61–8.3.66). Financial and pricing actions require approval before execution,
    and that is enforced here rather than assumed downstream.

    ## What is deliberately absent

    No fine-tuning of language models and no online learning anywhere (design 3.5). **Changed on 29
    September:** the model catalogue, prompt registry, evaluation and release pipeline now exist
    (tag `models`), because the parked capabilities have arrived. Models are our own, trained per tenant
    on that tenant''s data only (decision 1, AIP-149), and no language model sits on a path that takes
    money: recommendations and fraud scoring are rules plus classical models with hard time budgets.

    **Retention is not here.** All AI data retention is one tenant configuration with a period per data
    class (decision 5, 29 September), kept beside the tenant''s other data-retention settings in
    `tenancy`, not on `AiPolicy`.

    '
