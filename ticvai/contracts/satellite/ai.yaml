  /conversations/{conversationId}/messages:
    parameters:
    - name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: sendAiMessage
      x-ticvai-consumed-by:
        - "P01 WEB-044 AI Concierge – Home"
        - "P02 GST-031 AI Concierge – Home"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-033 AI Concierge – Contextual Help"
        - "P02 GST-054 AI Planner"
        - "P05 KSK-015 Assistant"
        - "P06 EMP-019 AI assistant — home"
        - "P06 EMP-020 AI assistant — answer"
        - "P08 BO-928 AI Conflict Resolution Assistant"
        - "P08 BO-929 Automatic Schedule Optimization"
        - "P08 BO-932 Conversational AI Resource Copilot"
        - "P09 ADM-533 Human Review, Challenge & AI Clarification Workspace"
        - "P13 CMS-104 App Build & Store Publishing"
      security:
      - guestAuth: []
      - bearerAuth: []
      x-ticvai-audience:
      - staff
      - guest
      summary: Ask
      description: '**The central operation.** Natural language in, a grounded answer out, with its sources
        (8.4.2, 8.4.10, 8.4.38).

        Retrieval runs **as the calling principal**. The assistant can see exactly what that person could
        have read directly and nothing more — no service account, no elevated query. This is the difference
        between an assistant and a privilege escalation with a friendly interface.

        Every response carries a trace id, the model and provider that produced it, token counts and its
        sources. Not for the user''s benefit: for cost attribution and for the grounding audit that 8.3.70
        requires.

        **Where the answer proposes an action, it is a draft.** The response carries a `proposedAction`
        the caller may apply through the owning contract, and applying it is a separate, permissioned,
        audited step (8.3.61–8.3.64).

        **Every message is scrubbed before it leaves the cell** (Chinmay, 2 October; ADR-0020 amended;
        CHG-CSA-003): the offline scrubber replaces personal data with reversible placeholders, the guard
        checks the input and the reply, and the reply is re-filled in the cell (`AiPolicy.scrubbing`). It
        applies whatever the tenant''s residency class. **The guard is the provider''s content-safety service,
        not a model we host** (Chinmay, 3 October: "We are not hosting anything unless client asks it";
        CHG-R1S-002): Azure AI Content Safety in UAE North for `uaeOnly`, the provider''s own moderation for
        BYOK and `globalAllowed`. The Presidio scrubber stays a CPU library inside our worker. With the scrubber
        or the safety service down the call is refused `503 scrubber-unavailable`, never sent raw; a message or
        reply the guard blocks is refused `422 guard-refused`.


        **The answer streams** (Chinmay, 3 October 2026, Block A business rules: "stream answers"; CHG-RUL-002).
        A client that sends `Accept: text/event-stream` gets server-sent events in this order: `token` events
        carrying the answer text as it is produced (`{delta}`), then one `sources` event (`AiSourceList`), then
        a `proposedAction` event only where the answer proposes one (`ProposedAction`, still a draft), then
        `done` carrying the stored `AiMessage`, the same body the JSON answer returns. **What is stored does not
        change**: the full message is written once, when the answer is complete, and `done` and the JSON
        answer are that row. Text reaches the client only after the cell has re-filled the scrubber''s
        placeholders and the guard has passed it, so the stream is released in short checked runs rather
        than raw tokens; where the guard blocks the reply part-way, an `error` event (`Problem`,
        `guard-refused`) ends the stream, the client discards the partial text, and nothing is stored as the
        answer. Refusals found before the first token (429, 503, 422) are ordinary HTTP answers, never a
        stream. A client that sends `Accept: application/json` (or no `Accept`) gets the whole `AiMessage`
        as before; clients built at r1 are unchanged.

        '
      tags:
      - assist
      x-ticvai-permission: AI_USE
      x-ticvai-self-scoped: subject
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      x-ticvai-streaming: sse
      x-ticvai-sse-events:
      - name: token
        data: '{delta: string} — the next run of answer text, already re-filled and passed by the guard'
      - name: sources
        data: AiSourceList — once, after the last token
      - name: proposedAction
        data: ProposedAction — only where the answer proposes one; a draft, never applied here
      - name: done
        data: AiMessage — the stored message, identical to the JSON answer; ends the stream
      - name: error
        data: Problem — `guard-refused` or `provider-unavailable` part-way; ends the stream, nothing stored
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
                collectionIds:
                  type: array
                  description: 'Restrict retrieval to named collections. Absent means every collection
                    the principal may read.

                    '
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: 'Answered. JSON by default; server-sent events when the client sends `Accept: text/event-stream` (CHG-RUL-002).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiMessage'
            text/event-stream:
              schema:
                type: string
                description: 'Server-sent events `token`*, `sources`, `proposedAction`?, then `done` (or `error`), as
                  `x-ticvai-sse-events` says. Each `data:` line is JSON of the shape named there.'
        '429':
          description: 'Usage limit reached (8.3.76). The limit is a cost control, and the response says
            which limit rather than failing opaquely.

            **Fires in three cases only**: the policy in force has `ceilingBehaviour: block` and `monthlyTokenCeiling`
            is reached; it has `warnThenDisable` and the assistant has been disabled at the ceiling; or
            the message would exceed `perRequestTokenCeiling`. **Never under the default `warn`** — there
            the ceiling sends the venue manager a notification and the assistant keeps answering
            (`AiPolicy.ceilingBehaviour`). There is no per-principal limit.

            '
          headers:
            Retry-After:
              $ref: '../shared/common.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UsageLimitProblem'
        '503':
          description: 'Every configured provider failed. **Reported rather than retried indefinitely**
            — an assistant that hangs is worse than one that says it cannot answer.

            Also `scrubber-unavailable`: the offline PII scrubber or the provider''s content-safety service (the
            guard) is down, so the call fails closed rather than sending an unscrubbed or unchecked prompt
            (CHG-CSA-003; the guard is the provider''s safety service, CHG-R1S-002).

            '
          x-ticvai-problem-types:
          - provider-unavailable
          - scrubber-unavailable
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: The guard (the provider''s content-safety service, CHG-R1S-002) blocked the message or the
            reply (`guard-refused`, CHG-CSA-003). Nothing unsafe is returned; the refusal is logged with the decision
            record.
          x-ticvai-problem-types:
          - guard-refused
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
