  /ai/venue-map/{mapId}/propose-walkways:
    parameters:
    - name: mapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: proposeWalkways
      x-ticvai-consumed-by:
        - "P08 BO-093 Map Import & Labelling"
      summary: Find walkable space in a drawing that has no vectors
      description: '**The last resort, and it says so.** Walkable space is normally derived by subtraction
        — the site minus buildings, seating, water and keep-out — which is exact, repeatable and needs
        no model.

        **This is for a raster plan only**: a scan, a photograph, an illustrated map with no geometry
        behind it. There is nothing to subtract, so the paths have to be seen.

        **Proposes a path network with a confidence per segment, and applies nothing.** The failure mode
        is why: **a wrongly seen path routes a guest into a lake or a service yard**, and unlike a mislabelled
        toilet that is not a cosmetic error.

        **Low-confidence segments are shown, not hidden.** A segment the model is unsure about is the
        one an operator must look at, and filtering them out produces a network that looks clean and has
        a hole in it.

        Writes `ai.proposed_action` and stops. `venue-map.acceptWalkwayProposals` is the human half.


        **A plan with hand-marked paths** (Chinmay, 3 October 2026, r1 additions). Where the import
        found marker strokes (`venue-map.VenueMapImportJob.handMarkedPaths`), the proposal follows the
        marks rather than guessing from the picture: one segment per marked stretch between junctions,
        `basis: handMarked`, its confidence saying how cleanly the stroke was traced. A gap in a mark is
        a gap in the network, proposed as two segments, never bridged silently. The operator accepts or
        rejects **each segment** (BO-093); nothing is a path until then. A scanned PDF read through the
        OCR step is a raster here too.

        '
      tags:
      - ai
      x-ticvai-permission: VENUE_MAP_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                importJobId:
                  type: string
                  format: uuid
                  description: The `venue-map` import job whose raster (and hand-marked strokes) to read.
                    Absent, the map's latest import.
                basis:
                  type: string
                  enum:
                  - auto
                  - handMarked
                  - seen
                  default: auto
                  description: '`auto` follows the hand marks where the import found any and sees the paths
                    otherwise; `handMarked` refuses (422) when there are no marks; `seen` ignores the marks.
                    Added 3 October 2026 (r1 additions).'
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Proposed walkways, for review. One entry per segment, each an `ai.proposed_action`
            row whose id `venue-map.acceptWalkwayProposals` takes as `proposalId`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalkwayProposal'
        '409':
          description: '**The map has vector geometry.** Refused deliberately — subtraction is available
            and better, and running a model where geometry exists is how a worse answer gets preferred
            because it arrived in a nicer format.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: '`basis: handMarked` on an import that found no hand-marked strokes (`hand-marks-not-found`).
            Re-import with `handMarkedPaths` (and the marker colour), or ask with `auto` (3 October 2026).'
          x-ticvai-problem-types:
          - hand-marks-not-found
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
