  /ai/suggestion-providers:
    put:
      operationId: setSuggestionProvider
      summary: Point a question at a rule, a model, or both
      description: '**The swap, and it is a configuration change.** Per `SuggestionKind`: which producer
        answers it, at which version, and with what guard rails.

        **Shadow mode is why this exists rather than a feature flag.** A new model runs alongside the
        rule, its answers are recorded and never shown, and **the venue compares six weeks of both before
        anything changes on a screen.** A model promoted without that is a model nobody can defend when
        it is wrong.

        **A guard rail is not optional for a `model` basis.** A price suggestion outside a stated band
        is refused and falls back to the rule — **an unbounded model in a pricing path is one bad inference
        from a free lunch for a thousand guests.**

        **Where it is kept.** The assignments are stored on the tenant''s `ai.policy` row, in `AiPolicy.suggestionProviders`,
        which is what `requestSuggestion` reads to route a kind to its producer. `setAiPolicy` does
        not change them; this operation is the only writer.

        **What the PUT does.** Each assignment is matched on `kind`. An assignment in the body replaces
        the stored one for that kind, or adds it where the kind had none; **a kind left out of the
        body keeps its current assignment** — a partial body never leaves a question with nobody to
        answer it. The response is the full set after the write.

        **Also written by `promoteAiRelease`** (AI design 2.3, 3.5). Shadow mode here is the release
        pipeline''s shadow stage: a `shadowProducerRef` is a release in `shadow`, and when it passes its
        gate a `promotionReady` governance alert is raised. **A person promotes it; nothing switches by
        itself** (decided 29 September). Setting a `model` basis here directly remains possible for a
        producer that has already been promoted.

