paths:
  /ai/translate:
    post:
      operationId: proposeTranslations
      x-ticvai-consumed-by:
        - "P08 BO-785 Template Library"
        - "P08 BO-793 AI Content, Translation & Audit"
      summary: Fill translation gaps with a first pass, for a human to edit
      description: |-
        BL-071, 2.6.34. **`setLanguages` already measures the gap** — `translationGaps` reports content missing a version. What was absent is filling it.
        **A first pass, never a publish.** Every proposal lands as a draft on the block it translates, and **a tenant's own words in a language nobody at the venue reads is exactly the content that must not go live unreviewed.**
        **Lives here rather than in `white-label` because it calls a model.** ADR-0020: only the AI contract writes AI tables — and the boundary caught this on the day it was written, for the third time in one session. **A rule I had just described in the description above and then broke in the lineage below it.**

        **Where a draft is stored** (4 October 2026, CHG-FXC-004; the Sprint 1-2 judging found "a draft on the block" and a
        lineage that never writes the block, which ADR-0020 forbids anyway). Each proposal is an `ai.proposed_action` row:
        the block or template it is for (`control.content_block`, `marketing.message_template`), the language, the proposed
        text. Nothing outside the AI schema is written. The CMS shows the proposal beside the block's field as an AI draft; an
        operator's save goes through the block's own operation (`white-label` or `marketing-crm`), which is when it becomes
        content; `getTranslationProposals` reads the rows back by job.
      tags:
      - ai
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetLocale
              properties:
                targetLocale:
                  type: string
                scope:
                  type: string
                  enum:
                  - allGaps
                  - contentBlocks
                  - productNames
                  - emailTemplates
                  - messageTemplates
                  description: '`messageTemplates` (29 September, build; 22.9.18) covers every channel of a marketing-crm
                    message template: email, SMS, push, WhatsApp and in-app. `emailTemplates` stays as the email-only
                    subset.'
                glossaryRef:
                  type: string
                  nullable: true
                  description: '**Terms that must not be translated** — a venue''s ride names, its brand,
                    its membership tiers. Without one, *Ladies Night* becomes a literal translation somebody
                    has to find and undo.

                    '
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Proposed as drafts, for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationProposals'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /ai/translate/{translationJobId}:
    parameters:
    - name: translationJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getTranslationProposals
      x-ticvai-consumed-by:
        - "P13 CMS-011 Translations"
      x-ticvai-agreed: '2 October: contract gap CHG-WIR-017 (CMS-011: no read follows a proposeTranslations job, which
        answers 202); shape follows proposeTranslations'
      summary: Follow a translation job
      description: |-
        The drafts a `proposeTranslations` job has written so far, and whether it has finished (contract gap logged in CHG-WIR-017 for CMS-011; built in CHG-CSA-045). The CMS polls it after the 202 to offer machine translation as a first pass for review (DI-081, DI-083); nothing is published from here.

        **Where a draft is stored** (4 October 2026, CHG-FXC-004; the Sprint 1-2 judging found "a draft on the block" and a
        lineage that never writes the block, which ADR-0020 forbids anyway). Each proposal is an `ai.proposed_action` row:
        the block or template it is for (`control.content_block`, `marketing.message_template`), the language, the proposed
        text. Nothing outside the AI schema is written. The CMS shows the proposal beside the block's field as an AI draft; an
        operator's save goes through the block's own operation (`white-label` or `marketing-crm`), which is when it becomes
        content; `getTranslationProposals` reads the rows back by job.
      tags:
      - ai
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: The job and its drafts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationProposals'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /ai/content-drafts:
    post:
      operationId: proposeMarketingContent
      x-ticvai-consumed-by:
        - "P08 BO-766 Campaign Builder"
        - "P08 BO-772 A/B & AI Optimization"
        - "P08 BO-785 Template Library"
        - "P08 BO-786 Newsletter Builder"
        - "P08 BO-787 Content Blocks & Product Feed"
        - "P08 BO-789 Transactional Notification Rules"
        - "P08 BO-793 AI Content, Translation & Audit"
        - "P13 CMS-007 Page Builder"
        - "P13 CMS-008 Content Blocks"
      x-ticvai-agreed: '29 September: AI system design 2.3 generate, 3.3 (language model through the gateway,
        no per-tenant training), 3.8 (L2 prepare for campaigns); our build plan, shape follows proposeTranslations'
      summary: Draft marketing content for a person to edit and apply
      description: '22.1.17, 22.3.18, 22.4.9, 22.4.10, 22.9.17, 22.10.14, 22.10.16, 22.10.17. **Drafts only, never
        a publish.** A language model, through the gateway (design 3.3), writes message bodies, subject lines and
        their variants, notification wording, content blocks, pages, banners, promo blocks and app homepage sections
        from a brief. Nothing is trained on the tenant''s content, and no language model sits on a path that takes
        money.


        **Each variant in each locale is one `ai.proposed_action`** (kind `content`). Its `targetOperation` is the
        owner''s own save operation and its `payload` that operation''s request body: `marketing-crm.createMessageTemplate`
        for an email, SMS, push, WhatsApp or in-app template and for notification wording; `marketing-crm.updateCampaign`
        (`CampaignContent.subjectOverride`) for a subject line; `white-label.createContentBlock`, `createContentPage`
        or `updateContentPage`, `createBanner` or `updateBanner`, `createPromoBlock` or `updatePromoBlock`, and
        `setHomepageLayout` for storefront and app content. **A person applies it in the owning screen**, editing
        first if they wish, under their own permission (`MARKETING_MANAGE`, `TENANT_CONFIGURE`), and `decideProposedAction`
        records which draft was used or why every draft was refused; that refusal is the label a better prompt
        is judged on. **Publishing stays the owner''s separate act** (`launchCampaign`, `publishContentBlock`,
        `publishTenantConfig`).


        **Grounded, not invented.** Product names, dates and offers come only from `groundingRefs`, read as the
        caller; a price is a Pricing reference placeholder the channel renders, never a number the model wrote.
        Glossary terms are kept verbatim, and a draft that breaks one comes back with the violation listed rather
        than silently fixed. Template placeholders (`{{guest.firstName}}`) are protected.


        **Variants are for testing, not for choosing on the person''s behalf**: up to five per locale, each with
        the objective it was written for. Testing them against each other is the owner''s (marketing-crm campaign
        variants).

        '
      tags:
      - generate
      x-ticvai-permission: AI_USE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetKind
              - brief
              - locales
              properties:
                targetKind:
                  type: string
                  enum:
                  - messageTemplate
                  - subjectLine
                  - notificationWording
                  - contentBlock
                  - contentPage
                  - banner
                  - promoBlock
                  - homepageSection
                targetRef:
                  type: string
                  nullable: true
                  description: The template, campaign, block, page, banner or promo block the draft is for. Null drafts
                    a new one.
                channel:
                  type: string
                  nullable: true
                  enum:
                  - email
                  - sms
                  - push
                  - whatsapp
                  - inApp
                  - web
                  - app
                  description: Sets the length and form limits (an SMS segment, a push title) the draft must meet.
                brief:
                  type: string
                  minLength: 10
                  maxLength: 4000
                  description: What the content is for, in the author's words.
                objective:
                  type: string
                  nullable: true
                  enum:
                  - awareness
                  - conversion
                  - retention
                  - reactivation
                  - information
                tone:
                  type: string
                  nullable: true
                  maxLength: 200
                locales:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                variants:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 1
                glossaryRef:
                  type: string
                  nullable: true
                  description: Terms that must not be changed or translated, as for `proposeTranslations`.
                groundingRefs:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                  description: Products, events, offers or pages the text may cite, read as the caller. Nothing
                    outside them is named.
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: ../shared/common.yaml#/components/headers/ConsistencyToken
          description: Drafted, for review. Each draft is an `ai.proposed_action` a person applies in the owning
            screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiContentDraftSet'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: 'Drafting is not allowed at this scope now: the capability is paused (`capability-paused`)
            or governance blocks it (`governance-blocked`, naming the policy and version).'
          x-ticvai-problem-types:
          - capability-paused
          - governance-blocked
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          description: A token ceiling was reached; same cases as `sendAiMessage` 429.
          headers:
            Retry-After:
              $ref: '../shared/common.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UsageLimitProblem'
  /ai/segment-suggestions:
    post:
      operationId: proposeLookalikeSegment
      x-ticvai-consumed-by:
        - "P08 BO-761 AI Audience Discovery"
        - "P08 BO-762 Predictive Audiences"
      x-ticvai-agreed: '29 September: AI system design 3.10 (rules-first), 4.2 (per-tenant isolation, no pooled
        data); our build plan, shape follows generateConfiguration'
      summary: Propose a lookalike segment from a seed, for a person to save
      description: '22.14.12. **Seed-based expansion inside the tenant''s own guests only**: no pooled or third-party
        data (design 4.2). From a seed segment or audience list the producer profiles the seed on segmentable attributes
        (visit frequency and recency, spend band, product and category affinity, membership tier, language, origin
        country), ranks the tenant''s other consented guests by similarity, and turns the top of that ranking into
        **explainable `SegmentCriterion` rules, not a list of people**, so a person can read, edit and save it and
        it stays current as guests change.


        Rules-first (design 3.10): similarity is a weighted distance over those attributes on day one; a promoted
        model replaces the ranking per tenant only after a shadow run. Sensitive data never becomes a feature (AIR-185),
        and consent to marketing is a hard filter.


        **Written as one `ai.proposed_action`** (kind `audience`, `targetOperation` `marketing-crm.createSegment`,
        `payload` the segment body). **A person saves it** with `marketing-crm.createSegment`, editing it first in
        the segment builder if they wish; nothing is created here. `estimatedReach` is a count computed as the caller
        on the analytical replica, never a list of guests.

        '
      tags:
      - generate
      x-ticvai-permission: AI_USE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: analytical
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetSize
              properties:
                seedSegmentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: A marketing-crm segment. One of `seedSegmentId` or `audienceListId` is required.
                audienceListId:
                  type: string
                  format: uuid
                  nullable: true
                  description: A marketing-crm static audience list.
                targetSize:
                  type: integer
                  minimum: 100
                  maximum: 1000000
                excludeSeed:
                  type: boolean
                  default: true
                maxCriteria:
                  type: integer
                  minimum: 1
                  maximum: 12
                  default: 6
                name:
                  type: string
                  nullable: true
                  maxLength: 200
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: ../shared/common.yaml#/components/headers/ConsistencyToken
          description: The proposed segment, as rules, with its reach and the proposal a person decides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiLookalikeSegmentProposal'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '422':
          description: Neither seed was sent (`seed-required`), or the seed has fewer than 50 consented guests (`seed-too-small`).
            A lookalike of almost nobody is refused rather than guessed.
          x-ticvai-problem-types:
          - seed-required
          - seed-too-small
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /ai/suggestions:
    post:
      operationId: requestSuggestion
      x-ticvai-consumed-by:
        - "P01 WEB-044 AI Concierge – Home"
        - "P02 GST-031 AI Concierge – Home"
        - "P02 GST-054 AI Planner"
        - "P06 EMP-031 Queue monitor"
        - "P08 ADM-047 AI Delivery Optimization & Communication Platform Diagnostics"
        - "P08 BO-005 Queue Monitor"
        - "P08 BO-139 Wastage, Spoilage, Returns & Write-Off"
        - "P08 BO-772 A/B & AI Optimization"
        - "P08 BO-782 AI Journey Optimization"
        - "P08 BO-925 AI Staff Recommendation & Workforce Matching"
        - "P09 ADM-511 Attraction Utilization & Queue Forecast"
        - "P16 ANL-001 Executive Command Center"
        - "P16 ANL-006 Inventory & Waste Intelligence"
        - "P16 ANL-010 Suggestions & Advice"
      security:
      - guestAuth: []
      - bearerAuth: []
      summary: Ask for an answer, however it is currently produced
      description: '**One operation for thirteen questions, and the reason is the swap.** The client F&B
        boards drew six of these as their own endpoints — `suggestPrice`, `suggestRequisition`, `suggestReplenishment`,
        `simulateScenario`, `simulateSlaPolicy`, `publishDemandPlan`. **Six endpoints means six places
        to change when a model changes**, and the model will change more often than the venue''s question
        does.

        **Ships answering from heuristics.** A price suggestion is a margin rule; a replenishment is par
        level minus on-hand plus lead time. **Every one of those is a stated rule that works on day one
        and is beaten by a model on day four hundred** — and the swap is a provider change, not a contract
        change.

        **The response always names its basis.** A manager must be able to see that today''s answer is
        arithmetic and next quarter''s is a trained model, on the same screen, without being told.

        **Never acts.** A suggestion that can order stock is a suggestion that will order stock wrongly
        at three in the morning — this proposes, and `decideProposedAction` decides.

        **Routed to the engines (AI design 2.3, 29 September).** `demandForecast`, `staffing` and `scenario`
        are answered by the forecasting service from the latest published version (`getForecast`,
        `listOperationalRequirements`, `createForecastScenario`); `anomaly` by the anomaly detectors
        (`listAiInsights`); `upsell` by the recommendation engine (`decideRecommendations`, placement
        `cart`). **The kinds and `SuggestionBasis` are unchanged; only the producer changes**, and the
        basis on the answer still says which producer it was.


        **Three kinds added 29 September (build)**, each answered from a stated rule first and applied by a
        person in the owning module: `sendTime` (22.3.19, 22.9.16) gives the best send hour and channel per
        recipient inside a send window, for marketing-crm to schedule; `wasteRisk` (4.1.19, 4.8.15) gives the
        items at risk of waste with quantity, value and a recommended action (reduce prep, promote, transfer,
        use in a recipe), applied through `fnb.planProductionRun`, promotions or `inventory.createStockTransfer`;
        `queueBalancing` (5.6.27, 8.9.9) gives per queue the forecast wait against capacity, a virtual-queue
        return-slot allocation by queue type and where to redirect guests, applied through `queue.updateQueue`.
        Rules and minimum history are on `SuggestionKind`. All three are staff-only.


        **Answers from day one, then learns (29 September, AI functions review, decided by the product
        owner).** Below a kind''s own-data threshold the answer is no longer a 422: it comes from the
        baseline producer (the venue''s AI settings entered at onboarding, `setAiVenueSettings`; the
        TICVAI starting pattern for the venue type; the UAE calendar; the weather) and says so. As the
        venue trades, the statistical producer blends own data in, weighting the starting value by k
        and own data by n observations, `(k x prior + n x own mean) / (k + n)`, re-estimated nightly
        and recorded as a new producer version; imported history (`importVenueHistory`) counts as own
        data. **Every answer carries `maturity`**: the stage (`starting`, `learning`, `established`,
        `learned`), what it is based on, how much of it is own data, and what the next stage needs.
        A trained model reaches `learned` only when an admin promotes it after a shadow run
        (`promotionReady`, AI-D16). **422 is kept for one case only**: a setting the kind cannot answer
        without (no current cost for `price`, no par level for `replenishment`, no ride capacity for
        `waitTime`), and the problem names the setting and the screen that sets it.


        **`itinerary` (added 29 September, MOB-6; supersedes the deferral in audits R187 and R209).**
        The AI planner agent refines a guest''s visit plan: `subjectRef` is the `venue-map` plan id,
        `context` carries the guest''s request in words (*"less walking after lunch"*), and `value` is
        `{planId, baseVersion, changes: [VisitPlanUpdate changes], rationale}`. **It proposes; it does
        not write the plan.** The app applies the changes with `updateVisitPlan` as the guest (or the
        planner agent does, through its registered tools, as the guest), so the change is a version the
        guest can undo and AI writes only `ai.suggestion` (ADR-0020). When AI is off or fails, the
        answer is the rules plan unchanged, with `basis` `heuristic`, never an error.


        **Grounded in each day''s venue** (30 September client meeting, MoM 4.7, Allam''s
        requirement). The agent proposes only points and performances that the plan operations
        return for that day (`getVisitPlan` and `listVisitPlanAlternatives`, which read the
        published map of the day''s venue, `VisitPlan.days[].venueId`): rides, dining and retail
        (shops and kiosks) of that venue, never one named from general knowledge or from another
        venue of the tenant. A wish the day''s venue cannot meet (*"Indian food on day 1"* at a
        park with no Indian restaurant) is answered as such, naming the venue where it exists
        from `VisitPlan.unmatchedPreferences`; moving a day to that venue is the guest''s change
        of answers, not a change the agent makes. `updateVisitPlan` refuses a point from another
        venue (422 `point-not-at-day-venue`) as the backstop.

        '
      tags:
      - ai
      x-ticvai-permission: AI_USE
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
