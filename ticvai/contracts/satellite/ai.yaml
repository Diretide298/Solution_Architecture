      description: 'A minimal call against the provider, using the stored credential.

        **And the compatibility test before activation** (Chinmay, 2 October, contract follow-ups; CHG-FUP-008). For a
        tenant-managed provider the call also runs the probes of `AiProviderCompatibility` for each task it would
        serve (or the `taskKeys` sent), against the vendor''s equivalent model the curated task-to-tier map picks,
