        configuration** — products, pricing, promotions, seating and the calendar. Five requirements,
        not twenty: 8.1''s "AI Configuration Assistant" heading sits over two unrelated blocks (CF-74).

        **It needs no training corpus and it is not context-free**, and those are different claims. The
        phasing paper calls this data-independent because it forecasts nothing and learns from no history
