  /risk/transaction-scores:
    post:
      operationId: scoreTransactionRisk
      x-ticvai-agreed: '29 September: AI system design 2.3 risk (service audience), 2.2 B; our build plan, shape
        follows white-label proposeGuidedChoice (service)'
      summary: Score a payment attempt (Orders)
      description: '**Called by `orders.checkoutCart` after its own rules, with an 80 ms timeout** (design 2.2 B).
        Reads entity risk and velocity counters from Redis, applies the tenant''s strategy, adds a promoted model''s
        score if any, and returns a composite 0..100 with band, the tenant''s outcome and reason codes. **No language
        model on this path.** On timeout Orders proceeds on its own rules (fail-open); a fail-closed tenant gets
        a hold, never a silent decline (AIP-110). Card data never arrives: token references and a hashed device
        id only (AIP-112).

        **Also called by `wallet` for a wallet operation** (29 September, build; 4.3.32): a top-up, spend or
        transfer sends `walletId` and `walletTransactionRef` in place of `orderId`, so the `aiRiskScore` signal
        of `setWalletRiskRules` has a producer; the wallet keeps its own rules and actions. One of `orderId` or
        `walletId` is required (`422`). An alert raised from a wallet score has `entityType` `wallet`.


        **Signals added 29 September (build)**, each rules-first and none decisive alone (M21). **IP** (`ipHash`,
        `ipCountry`; 8.3.8): velocity per IP hash, IP country against card and account country, and a shared-IP
        edge in the risk graph; a hash on the payments IP block list (list kind `blockIp`) is a strong signal here
        and a block there. **Chargebacks** (8.3.11, 8.3.14, 8.3.15): `ai-realtime` consumes `order.chargebackRecorded`,
        raises the chargeback count and rate on the customer, account, payment-token and device entities, raises
        an alert of kind `chargeback` where a customer or token repeats, and uses it as the training label for that
        order''s assessment (joined by `orderId` at snapshot time; the assessment row is never updated). **Password
        resets** (8.3.34): `identity.credentialResetRequested` feeds account-takeover signals (a reset followed by
        a new device or country, resets across many accounts from one device or IP). **Browsing behaviour** (8.3.40):
        the hashed `storefront.sessionEvent` stream gives session features (pages per minute, seat-map probing,
        checkout without browsing, headless patterns), joined through `sessionRef`.

        '
      tags:
      - risk
      x-ticvai-permission: null
      x-ticvai-auth: service
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-scope-level: venue
      x-ticvai-latency-budget-ms: 80
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - channel
              - attemptNumber
              properties:
                orderId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The order being paid. Required unless `walletId` is sent.
                walletId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The wallet a wallet operation acts on (4.3.32). Required unless `orderId` is sent.
                walletTransactionRef:
                  type: string
                  nullable: true
                  description: The wallet's own reference for the top-up, spend or transfer being scored.
                amount:
                  allOf:
                  - $ref: ../shared/common.yaml#/components/schemas/Money
                channel:
                  type: string
                productMix:
                  type: array
                  items:
                    type: object
                    properties:
                      categoryRef:
                        type: string
                      quantity:
                        type: integer
                paymentTokenRef:
                  type: string
                  nullable: true
                  description: Provider token reference, never a card number.
                deviceIdHash:
                  type: string
                  nullable: true
                ipHash:
                  type: string
                  nullable: true
                  description: 'Keyed hash of the client IP address (29 September, build; 8.3.8). The address itself
                    never arrives, as with the device id; the hash is what velocity, shared-IP edges and the payments
                    IP block list compare.'
                ipCountry:
                  type: string
                  nullable: true
                  description: ISO 3166-1 alpha-2 country the IP resolves to, compared with the card's and the account's
                    usual country.
                sessionRef:
                  type: string
                  nullable: true
                  description: The storefront session, so its browsing features (from `storefront.sessionEvent`)
                    join the score (8.3.40).
                accountId:
                  type: string
                  format: uuid
                  nullable: true
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                attemptNumber:
                  type: integer
                  minimum: 1
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: ../shared/common.yaml#/components/headers/ConsistencyToken
          description: Score a payment attempt (Orders)
          content:
