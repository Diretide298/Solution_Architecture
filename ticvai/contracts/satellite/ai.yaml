    AiProviderCompatibility:
      type: object
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: '**Whether a provider can serve the tasks it would take, before it takes them** (Chinmay, 2 October,
        contract follow-ups: BYOK accepts any provider, with a compatibility test before activation; CHG-FUP-008). For
        each task the provider would serve, the gateway calls the vendor''s equivalent model at the task''s tier (the
        curated task-to-tier map) with TICVAI''s probes: tool calling, structured output against a JSON schema,
        Arabic, the context window the task needs, the latency band and the residency of the endpoint. A task passes
        when every probe passes; the provider''s `status` is `passed` when at least one task passes, and only the
        passing tasks are routed to it.'
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - notTested
          - passed
          - failed
        testedAt:
          type: string
          format: date-time
          nullable: true
        tasks:
          type: array
          items:
            type: object
            required:
            - taskKey
            - passed
            properties:
              taskKey:
                type: string
              tier:
                type: string
              modelName:
                type: string
                nullable: true
                description: The vendor's model the curated map picked for this task and tier; null where the vendor
                  has no curated equivalent, and the task stays on the TICVAI-managed model.
              passed:
                type: boolean
              failedProbes:
                type: array
                items:
                  type: string
                  enum:
                  - toolCalling
                  - structuredOutput
                  - arabic
                  - contextWindow
                  - latency
                  - residency
    AiProviderKind:
      type: string
      enum:
      - openai
      - gemini
      - anthropic
      - azureOpenai
      - localLlm
      - openaiCompatible
      description: '`openaiCompatible` (added 29 September, AI design 3.3): a customer endpoint that speaks
        the OpenAI API, taken with no custom development (AIC-009). Any other protocol needs an adapter.

        **Core42 Compass is reached through `openaiCompatible`** (Chinmay, 2 October: the AI residency decision,
        amending AI-D02; CHG-CSA-002). Compass is the provider of the `uaeOnly` residency class (common
        `AiResidencyClass`): Small tier Compass GPT-4.1 mini (or Seraj), Strong tier Compass GPT-5, with OpenAI
        UAE as the fallback. OpenAI UAE is `openai` with a UAE `endpoint`: OpenAI''s UAE-region API project,
        `ae.api.openai.com` (in-country processing, on OpenAI sales approval), allowed under `uaeOnly` and the only
        endpoint a `uaeOnly` BYOK OpenAI key may use (CHG-R1S-016). **We host no model** (Chinmay,
        3 October, CHG-R1S-002): there is no in-cell open-weights fallback; `localLlm` is used only where a
        client asks for self-hosting and runs the model on the client''s estate (`onPrem`).

        **A kind is a protocol, not a vendor** (Chinmay, 2 October, contract follow-ups: BYOK accepts any provider;
        CHG-FUP-008). Any vendor is accepted, named in `AiProvider.vendor`: Mistral, Cohere or any other is reached
        through `openaiCompatible` where its API speaks it, which the compatibility test confirms before activation
        (`AiProviderCompatibility`). A new native adapter is a new value here, a breaking change for a client built
        earlier that goes out with an approval (`docs/active/breaking-changes.yaml`); until then a vendor without
        either protocol is refused `422 provider-protocol-unsupported`.

        '
    SuggestionKind:
      type: string
      description: 'What is being suggested. **A closed set, and the reason it is closed is the swap.**
        Every entry here is a question a venue asks that a model could answer better than a rule — and
        each one starts as a heuristic and becomes a model when there is data.

        **Six of these were drawn as their own endpoints on the client F&B boards** — `suggestPrice`,
        `simulateScenario`, `simulateSlaPolicy`, `suggestRequisition`, `suggestReplenishment`, `publishDemandPlan`.
        **Building six endpoints means six places to change when a model changes**, and the model will
        change more often than the venue''s question does.

        **What each kind is based on, and when the venue''s own data takes over. Proposed, client to
        correct (decided 28 September, audit R213; re-read 29 September, AI functions review).** The
        figure after each rule is **the point where own data takes over from the baseline, not a
        refusal**: below it the kind answers from the baseline (venue AI settings, the starting pattern
        for the venue type, the UAE calendar, the weather) with `maturity.stage` `starting`, and between
        it and about three months it blends the two (`learning`). The day-one baseline per kind:
        `replenishment`, `requisition`, `prepPlan`, `staffing`, `demandForecast` and `scenario` from the
        baseline forecast (typical attendance from the venue AI settings x the venue-type month curve x
        the calendar x weather, bookings on hand as a floor); `menuEngineering` ranked by margin with
        popularity marked learning; `slaTarget` a standard default; `waitTime` people ahead / configured
        capacity; `upsell` the relationship map and business priority; `segmentation` known guest
        attributes; `anomaly` the venue''s configured thresholds and actual against the forecast''s low
        end; `sendTime` the channel''s typical hour; `wasteRisk` shelf life and par against the forecast;
        `queueBalancing` configured capacity per queue. Only a missing setting refuses (422
        `AiMissingSettingProblem`).

        - `price`: unit cost plus the category''s target margin, held inside the price band. Minimum:
        a current cost, no history.

        - `replenishment`: par level minus on-hand plus expected use over the supplier lead time.
        Minimum: 14 days of stock movements.

        - `requisition`: the next service''s prep-plan ingredient needs minus kitchen stock. Minimum: 14
        days of sales.

        - `demandForecast`: the average of the same weekday over the last 8 weeks, adjusted by admissions
        already booked. Minimum: 8 weeks of sales.

        - `prepPlan`: forecast covers for the service times each item''s share of the last 4 same
        weekdays. Minimum: 4 weeks of sales.

        - `menuEngineering`: each item placed by popularity against margin, over 90 days. Minimum: 90
        days of sales.

        - `staffing`: forecast demand divided by the role''s standard covers per staff hour. Minimum: 8
        weeks of sales (the forecast it rests on).

        - `slaTarget`: the 80th percentile of actual times over the last 30 days. Minimum: 30 days of
        timed events.

        - `waitTime`: people ahead divided by the throughput of the last 30 minutes. Minimum: 30 minutes
        of throughput today.

        - `upsell`: the item most often bought with the basket''s items over 90 days. Minimum: 90 days of
        orders.

        - `segmentation`: recency, frequency and spend scores over 12 months. Minimum: 90 days of orders.

        - `anomaly`: a value outside three standard deviations of the same weekday over 8 weeks. Minimum:
        8 weeks of the measure.

        - `scenario`: the demand forecast re-run with the stated changes. Minimum: as `demandForecast`.

        - `sendTime` (added 29 September): per recipient, the hour inside `context.sendWindow` in which they
        have most often opened or clicked over the last 90 days (marketing-crm attribution touches), and where
        `context.channel` is `best`, the consented channel with the highest engagement. A recipient with fewer
        than three touches gets their segment''s modal hour, and one with none the window''s start. Asked with
        `subjectRef` a segment id or `context.subjectIds` (at most 10,000). `value` is `{recommendations: [{subjectId,
        sendAt, channel, basisTouches}]}`. Minimum: 90 days of message touches at the scope.

        - `wasteRisk` (added 29 September): per item at an outlet or store location, planned production and stock
        on hand minus forecast demand over the item''s shelf life, plus batches expiring inside the horizon (`inventory.listExpiringBatches`).
        `value` is `{items: [{itemRef, quantityAtRisk, valueAtCost, expiresAt, recommendedAction (reducePrep, promote,
        transfer, useInRecipe), transferTo}]}`. Minimum: 14 days of recorded waste and of sales.

        - `queueBalancing` (added 29 September): per queue or attraction at `subjectRef` (a venue) over `horizon`,
        the forecast wait (the `queue` forecast definition) against throughput capacity, a recommended virtual-queue
        return-slot allocation by queue type, and guest redirection from over-used to under-used attractions. `value`
        is `{queues: [{queueId, forecastWaitMinutes, capacityPerHour, returnSlotsPerInterval, redirectTo}]}`. Minimum:
        14 days of queue readings.

        - `itinerary` (added 29 September, MOB-6, guest-allowed): refines a `venue-map` visit plan the
        guest owns. `subjectRef` is the plan id; `value` is `{planId, baseVersion, changes, rationale}`,
        applied with `updateVisitPlan` as the guest. Minimum: none; the rules plan is the baseline.
        Every change names a point or performance of that day''s venue only, rides, dining and retail
        alike (30 September client meeting, MoM 4.7).

        '
      enum:
      - price
      - replenishment
      - requisition
      - demandForecast
      - prepPlan
      - menuEngineering
      - staffing
      - slaTarget
      - waitTime
      - upsell
      - segmentation
      - anomaly
      - scenario
      - sendTime
      - wasteRisk
      - queueBalancing
      - itinerary
    SuggestionBasis:
      type: string
      description: '**How the answer was reached, and this is the field the whole design exists for.**

        A venue must be able to see that today''s price suggestion is a margin rule and next quarter''s
        is a trained model — **the same operation, the same screen, a different basis** — and a screen
        that cannot say which is a screen that asks a manager to trust arithmetic it will not show.

        **Swapping a heuristic for a model is a provider change, not a contract change.** That is the
        point of the abstraction: the frontend, the audit record and the outcome capture all stay exactly
        as they are.

        '
      enum:
      - heuristic
      - statistical
      - model
      - hybrid
      - manual
    Suggestion:
      type: object
      x-ticvai-persistence: ai.suggestion
      description: 'One answer to one question, with its reasoning and its confidence. **Built 24 August
        so that machine learning can be swapped in without touching a screen.**

        **A suggestion is never an action.** It proposes; `ProposedAction` and its approval path decide.
        A model that can order stock is a model that will order stock wrongly at three in the morning.

        **`inputs` is recorded, not just referenced.** A suggestion that cannot be reproduced cannot be
        defended to a finance controller asking why the system said to order four hundred.

        '
      required:
      - id
      - kind
      - basis
      - maturity
      - producedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SuggestionKind'
        basis:
          $ref: '#/components/schemas/SuggestionBasis'
        scopePath:
          type: string
        subjectRef:
          type: string
          nullable: true
          description: What it is about — a product, an outlet, an item, a party.
        value:
          type: object
          additionalProperties: true
          description: The suggestion itself. Shape depends on `kind`.
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: '**Null for a heuristic and that is honest.** A rule has no confidence — dressing
            one up with 0.85 is the fastest way to make a manager trust a number that means nothing.

            '
        explanation:
          type: string
          description: '**Plain words, always present, whatever the basis.** *Because covers are up 12%
            on this day last year* — a suggestion a manager cannot explain to their own boss is a suggestion
            they will not action.

            '
        inputs:
          type: object
          additionalProperties: true
          description: 'What went in. **Recorded so the answer can be reproduced** — and so that when
            a model replaces the rule, the two can be run against the same inputs and compared.

            '
        producerRef:
          type: string
          description: 'The rule name or the model id and version. **A model version is part of the record**:
            *the model said so* is not an answer to *which model, when*.

            '
        maturity:
          $ref: '#/components/schemas/AiMaturity'
        producedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**A demand forecast for Saturday is worthless on Sunday.** An expired suggestion
            is hidden rather than shown stale.

            '
    SuggestionOutcome:
      type: object
      x-ticvai-persistence: ai.suggestion_outcome
      description: '**What actually happened, and this is the table that makes the swap possible at all.**

        A model needs labelled data and **the only source of labels is whether the venue took the advice
        and whether it worked.** A platform that suggests and never records the outcome has no training
        set a year later, and the swap he is planning for never happens.

        **Captured whether or not the suggestion was taken.** A rejected suggestion is a stronger signal
        than an accepted one — it is the case the rule got wrong.

        '
      required:
      - id
      - suggestionId
      - decision
      properties:
        id:
          type: string
          format: uuid
        suggestionId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - accepted
          - modified
          - rejected
          - ignored
          - expired
        actualValue:
          type: object
          nullable: true
          additionalProperties: true
          description: 'What the venue did instead. **The label.** A suggestion of 400 units, an order
            of 250, and a stockout on Saturday is one training example worth more than a hundred accepted
            ones.

            '
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
        realisedOutcome:
          type: object
          nullable: true
          additionalProperties: true
          description: '**Filled in later by a job, not by a person.** Whether the stockout happened,
            whether the covers arrived, whether the margin held — nobody comes back to record this by
            hand, so nothing that depends on them doing so should be designed.

            '
        note:
          type: string
          nullable: true
        scopePath:
          type: string
          readOnly: true
          description: '**Added 29 September (AI design 3.1):** `ai.suggestion_outcome` had no scope column and
            no declared owner, so no policy. The suggestion''s scope, copied when the outcome is recorded.

            '
    AiCapability:
      type: string
      description: 'What a capability needs, not which provider serves it. This indirection is what makes
        "no provider SDK in capability code" enforceable.

        **`speechToText` and `textToSpeech` added 18 August (BL-164)** — voice added rather than declined.
        **Speech is the capability where UAE residency is hardest to satisfy**: the major providers run
        it in fewer regions than text, and a guest speaking into a kiosk is producing personal data in
        the moment. `AiProvider.residency` already carries the constraint and **speech is the capability
        most likely to fail it**, which is why it is separate rather than folded into `chat`.

        '
      enum:
      - chat
      - embedding
      - vision
      - rerank
      - speechToText
      - textToSpeech
    AiProvider:
      type: object
      x-ticvai-persistence: ai.provider
      required:
      - kind
      - capability
      - priority
      - isActive
      properties:
        isStatelessOnly:
          type: boolean
          readOnly: true
          description: '**True for every endpoint outside the UAE** (3 October 2026, CHG-R1S-016; the legal research
            `docs/active/research/openai-key-uae-3-october.md`, item 8). The adapter calls it statelessly: no Assistants, Threads or
            Conversations API, `store=false` on Responses, no file upload, no fine-tuning with tenant data.
            **Failover never widens residency** (item 10): a `uaeOnly` tenant''s call never falls over to an
            endpoint where this is true. OpenAI''s UAE-region project (`ae.api.openai.com`) is a UAE endpoint.'
        id:
          type: string
          format: uuid
          description: Assigned on create. Sent to `setAiProvider` to replace that provider; left out
            to create one.
        kind:
          $ref: '#/components/schemas/AiProviderKind'
        vendor:
          type: string
          nullable: true
          pattern: ^[a-z0-9][a-z0-9-]{1,49}$
          description: '**The provider company, any provider** (Chinmay, 2 October, contract follow-ups: "As long as
            we get an API key it can be any model"; CHG-FUP-008), as a lower-case slug: `mistral`, `cohere`,
            `core42`, `openai`. `kind` says how it is reached (a native adapter, or `openaiCompatible` for every
            other vendor); `vendor` says whose models the curated task-to-tier map picks from (`AiModel.vendor`).
            Required for a tenant-managed provider; null on an older row, where `kind` names the vendor.'
        capability:
          $ref: '#/components/schemas/AiCapability'
        model:
          type: string
        failoverProviderId:
          type: string
          format: uuid
          nullable: true
          description: 'BL-151. **A provider outage with no fallback is every AI surface going dark at
            once**, and the surfaces most likely to be noticed are the guest-facing ones.

            **Failover is declared per capability because a provider is** — a fallback covering chat and
            not embedding leaves search broken while the concierge works, which reads as a stranger failure
            than a clean outage.

            '
        degradeGracefully:
          type: boolean
          default: true
          description: '**Where no fallback answers, the surface degrades rather than errors.** Semantic
            search falls back to keyword, the concierge offers a human, a recommendation returns the rule-based
            set — **an AI feature that returns a 500 is worse than one that quietly becomes ordinary software.**

            '
        priority:
          type: integer
          description: Failover order (8.4.26). Lower is tried first.
        scopeLevel:
          type: string
          enum:
          - platform
          - tenant
          - venue
          description: '**Where this provider configuration applies, and therefore whose token pays for
            it.** A tenant-scoped provider means that tenant''s usage bills against their own key at the
            provider — **an independent reconciliation source against our own meter**, which is the point
            of per-tenant tokens rather than one platform key.

            `venue` exists for the case where one venue''s volume justifies its own key, or where a venue
            is billed separately from the rest of its tenant.

            **`tenant` is the decided level** (audit R203, ADR-0009): a tenant''s provider is set per
            tenant, by platform staff on ADM-037. `venue` narrows inside a tenant; `platform` is only
            the platform''s fallback. **No provider is configured per region**: a region restricts the
            choice through `tenancy.RegionSettings.allowedAiResidencies` and nothing else, and the table''s
            `region_id` is the tenant''s home region, recorded so that gate can be re-checked.

            '
        scopePath:
          type: string
          description: Resolved scope node. Nearest ancestor wins (ADR-0018).
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: Null only where `scopeLevel` is `platform`.
        credentialRef:
          type: string
          description: 'A key-vault reference, never the key. A key typed into a form ends up in a screenshot.

            '
        credentialHint:
          type: string
          nullable: true
          readOnly: true
          maxLength: 4
          description: The last four characters of the stored key, so an operator can tell two keys apart. The key
            itself is never shown again after `setAiCredential` (CHG-FUP-008).
        credentialRotatedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        credentialExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: 'Where the provider issues expiring keys. **A key that lapses silently takes the
            assistant down without an error anyone reads** — the expiry is surfaced so it can be chased
            before it bites.

            '
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When `testAiProvider` last confirmed the key works.
        compatibility:
          allOf:
          - $ref: '#/components/schemas/AiProviderCompatibility'
          readOnly: true
          description: The last compatibility test of this provider (`testAiProvider`). A tenant-managed provider is
            activated only once its `status` is `passed` (CHG-FUP-008).
        endpoint:
          type: string
          nullable: true
        residency:
          type: string
          description: 'Where inference physically happens. **A prompt reaching a provider hosted elsewhere
            is a cross-border transfer** (ADR-0009), and this field is what makes that auditable rather
            than assumed.

            '
        residencyClasses:
          type: array
          items:
            $ref: ../shared/common.yaml#/components/schemas/AiResidencyClass
          description: '**The tenant residency classes this provider may serve** (Chinmay, 2 October: the AI
            residency decision; CHG-CSA-002). The gateway routes a call for a tenant only to a provider whose list
            holds the tenant''s class (tenancy, common `AiResidencyClass`, default `uaeOnly`); `setAiProvider`
            refuses a provider that cannot serve the tenant''s class (`409 residency-class-refused`). A `uaeOnly`
            call can only resolve to an in-UAE endpoint: Core42 Compass or OpenAI UAE (no in-cell model since 3 October,
            CHG-R1S-002). **Embedding calls route the same way** (CHG-R1S-026): the provider''s embedding model on the UAE
            route (OpenAI UAE `text-embedding-3-large` or Core42), scrubbed like any call; no embedding model is hosted.

            '
        maxTokens:
          type: integer
        isActive:
          type: boolean
        managedBy:
          type: string
          enum:
          - ticvai
          - tenant
          default: ticvai
          description: '**Who holds the provider account, and so who pays** (AI design 5.9, decided 29 September).
            `ticvai`: TICVAI-managed, metered per tenant and re-billed per token. `tenant`: bring-your-own-key,
            accepted only where TICVAI enabled it for the tenant (`setAiByokEnablement`); the tenant pays the
            provider and TICVAI meters for visibility.

            '
        modelId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: ai.model
          description: The model in the catalogue (`listAiModels`) this provider serves. Null for an older row
            that names its model only in `model`.
        taskKeys:
          type: array
          items:
            type: string
          description: '**Which agent tasks this provider serves** (21 September minutes, M21-03: different agents
            may use different models chosen for the task). Empty means every task of its `capability`. A task
            listed on two providers goes to the lower `priority`. **AI-D02 as amended on 2 October** (the AI residency
            decision, CHG-CSA-002): the managed provider depends on the tenant''s residency class (Core42 Compass for
            `uaeOnly`, the default), with a Small and a Strong model per task; a second provider or a tenant''s own
            key is added only where TICVAI enables it for the tenant (AI-D14, `setAiByokEnablement`). **Each task''s
            model comes from TICVAI''s curated range** (`AiModel.curatedRange`, CHG-CSA-001): the client cannot pick
            a model outside it.'
        fitnessWarnings:
          type: array
          readOnly: true
          description: '**The model-fitness check at the last write** (21 September minutes, M21-09). For each task
            in `taskKeys` whose model scores outside the task''s band in `AiModel.taskFitness`, or has no score, one
            warning, shown on ADM-037 and kept so the choice is auditable. **A model outside TICVAI''s curated range
            for a task is no longer a warning: it is refused** (`422 model-not-curated`; Chinmay, 2 October, workbook
            Q2, amending AI-D18; CHG-CSA-001). A warning now only describes a curated model''s fit.'
          items:
            type: object
            properties:
              taskKey:
                type: string
              score:
                type: number
                nullable: true
              floor:
                type: number
              direction:
                type: string
                enum:
                - underpowered
                - overpowered
                - unscored
    AiPolicy:
      type: object
      x-ticvai-persistence: ai.policy
      required:
      - scopeLevel
      - scopePath
      - enabledCapabilities
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        scopeLevel:
          type: string
          enum:
          - tenant
          - venue
          description: Tenant sets the default; a venue may narrow it and never widen it.
        scopePath:
          type: string
          description: '**The node this row belongs to, and the key it is written under** — the tenant''s
            node where `scopeLevel` is `tenant`, a venue''s where it is `venue`. One row per `scopePath`;
            `setAiPolicy` writes the row it names and `getAiPolicy` resolves nearest ancestor first
            (ADR-0018).

            '
        enabledCapabilities:
          type: array
          description: '**Extended on 29 September to the fourteen capabilities of the AI design** (section 1.1,
            `AiCapabilityFamily`). The six earlier values stay: they are finer switches inside `assistants`,
            `knowledgeRetrieval` and `configurationAssistant`, and a tenant that set them keeps them.
            `governance`, `decisionRecords` and `residencyPrivacy` cannot be switched off; listing them is
            accepted and changes nothing.

            '
          items:
            type: string
            enum:
            - assist
            - search
            - generateConfiguration
            - generateLayout
            - summarise
            - explain
            - gatewayAndModels
            - governance
            - actionPipeline
            - knowledgeRetrieval
            - assistants
            - analyticsInsights
            - configurationAssistant
            - forecasting
            - anomalyDetection
            - riskIntelligence
            - recommendations
            - decisionRecords
            - operationsEvaluation
            - residencyPrivacy
        allowedRoleIds:
          type: array
          items:
            type: string
            format: uuid
        maskedFields:
          type: array
          description: 'Redacted before a prompt leaves the platform (8.3.73). **Defaults to every field
            in the pii schema** — a masking list nobody filled in should send nothing rather than everything.

            Each entry is a column named `schema.table.column`, as the DDL names it — `pii.subject_contact.email`.
            **Omitted, null and an empty array all take the default**, because each of them is a list
            nobody filled in. An entry naming no column is refused at save rather than silently masking
            nothing.

            **Column masking is in addition to the gateway scrubber, never instead of it** (CHG-CSA-003): free
            text a guest types is not a column, so every prompt also passes the offline scrubber (`scrubbing`).

            '
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
        requiresApprovalFor:
          type: array
          description: 8.3.61–8.3.64. Nothing in this list executes without a decision.
          items:
            type: string
            enum:
            - pricing
            - promotion
            - operational
            - financial
            - configuration
        scrubbing:
          type: object
          readOnly: true
          description: '**Mandatory offline PII scrubbing and moderation on every LLM call** (Chinmay, 2 October: "we
            may need to scrub personal info no matter what"; ADR-0020 amended; CHG-CSA-003). Not a setting: it applies
            whatever the tenant''s residency class, and a tenant cannot switch it off. Before a prompt leaves the cell
            the gateway runs Microsoft Presidio (offline) with UAE recognisers (Emirates ID, UAE phone, passport, IBAN,
            Luhn-checked card, email) and an Arabic NER model; each value found becomes a reversible placeholder
            (`[GUEST_1]`) whose map never leaves the cell, and the reply is re-filled before it reaches the user. An
            input and output guard checks both directions: **the provider''s content-safety service, not a model we
            host** (Chinmay, 3 October: we host no LLM unless a client asks, and a guard model is an LLM;
            CHG-R1S-002): Azure AI Content Safety in UAE North for `uaeOnly`, the provider''s own moderation for BYOK
            and `globalAllowed`. The scrubber stays a CPU library in our own worker and is mandatory in every
            residency class. **Fails closed**: with the scrubber or the safety service down, the call is refused
            (`503 scrubber-unavailable`), never sent raw. This object reports what is in force.


            **A second, deterministic pass after Presidio** (3 October 2026, CHG-R1S-016; the legal research
            `docs/active/research/openai-key-uae-3-october.md`, item 5: Presidio itself says it will not find everything). Fixed
            patterns run over the scrubbed text: Emirates ID (`784-...`), `+971` numbers, Luhn-valid card numbers
            (PAN), IBAN and email. **Any survivor blocks the call**, fail closed, `503 scrubber-unavailable` with
            no provider fallback, never sent. The Presidio version is pinned (`scrubberVersion`): it is
            community-maintained now, so a release is taken on purpose, after the golden corpus passes.

            '
          properties:
            mode:
              type: string
              enum:
              - mandatory
            scrubberVersion:
              type: string
              readOnly: true
              description: The pinned Presidio release (and recogniser set) in force, e.g. `presidio-2.2.355+uae-1`
                (CHG-R1S-016). Recorded on every call's activity row.
            residualPatternCheck:
              type: array
              readOnly: true
              items:
                type: string
                enum:
                - emiratesId
                - uaePhone
                - cardPan
                - iban
                - email
              description: The deterministic patterns run after Presidio; a match blocks the call (fail closed,
                `503 scrubber-unavailable`). Always all five (CHG-R1S-016).
            recognisers:
              type: array
              items:
                type: string
              description: The recogniser set in force, e.g. `emiratesId`, `uaePhone`, `passport`, `iban`, `card`,
                `email`, `arabicPersonName`.
            reversibleTokens:
              type: boolean
              description: Always true; the placeholder map stays in the cell.
            guardModel:
              type: string
              description: The input and output guard in force, e.g. `azureContentSafety` (the provider''s
                content-safety service, CHG-R1S-002); a self-hosted guard model appears only where a client asked
                for self-hosting.
        globalEndpointExclusions:
          type: object
          readOnly: true
          description: '**What never goes to a global endpoint** (3 October 2026, CHG-R1S-016; the legal research
            `docs/active/research/openai-key-uae-3-october.md`, item 6). A field-level exclusion list applied by the prompt builders
            when the resolved endpoint is outside the UAE (`globalAllowed`): the fields are dropped from the
            prompt, not masked, and the media kinds are refused. Not a setting: it applies to every tenant.'
          properties:
            fieldCategories:
              type: array
              items:
                type: string
                enum:
                - allergy
                - accessibility
                - familyAndChildren
                - health
                - biometric
                - religion
                - payment
              description: Allergy, accessibility and family or children data in F&B and booking prompts,
                and health, biometric, religion and payment data anywhere.
            fields:
              type: array
              items:
                type: string
              description: The schema fields held under those categories, e.g. `Allergen.contains`,
                `Attendee.accessibilityNeeds`, `Attendee.dateOfBirth`.
            blockedMedia:
              type: array
              items:
                type: string
                enum:
                - image
                - audio
                - file
              description: Images, audio and files are never sent to a global endpoint.
        monthlyTokenCeiling:
          type: integer
          nullable: true
        ceilingBehaviour:
          type: string
          enum:
          - warn
          - warnThenDisable
          - block
          default: warn
          description: '**Decided 17 August: warn, and let the venue manager choose.** A cap that stops
            the assistant mid-visit turns a cost control into a guest-facing outage, and the venue has
            no warning it is about to happen.

            At the ceiling a notification reaches the venue manager with the spend and the remaining period,
            and **the assistant keeps answering until somebody decides otherwise**. `warnThenDisable`
            and `block` exist for a tenant who asks for a hard limit; neither is the default.

            **Now the default for capabilities without their own entry** in `ceilingBehaviourByCapability`
            (AI design 5.9).

            '
        ceilingBehaviourByCapability:
          type: array
          x-ticvai-persistence-kind: valueObject
          x-ticvai-persistence-column: jsonb
          description: '**Ceiling behaviour per capability** (AI design 5.9, AIC-227), so a budget never silently
            disables fraud scoring, which spends no tokens, or a critical capability. A capability not listed
            takes `ceilingBehaviour`. The guest concierge defaults to `warn` (decided 17 August).

            '
          items:
            type: object
            required:
            - capability
            - behaviour
            properties:
              capability:
                type: string
                description: An `AiCapabilityFamily` value, or a registered capability key.
              behaviour:
                type: string
                enum:
                - warn
                - warnThenDisable
                - block
                - neverRestrict
        autonomyOverrides:
          type: array
          x-ticvai-persistence-kind: valueObject
          x-ticvai-persistence-column: jsonb
          description: '**Tighten only** (AI design 3.8, AIC-151). A level per capability at or below the
            capability''s ceiling, and on a venue row at or below the tenant row''s. Autonomy is separate
            from user permission (AIC-154).

            '
          items:
            type: object
            required:
            - capabilityKey
            - autonomyLevel
            properties:
              capabilityKey:
                type: string
              autonomyLevel:
                $ref: '#/components/schemas/AiAutonomyLevel'
        ceilingWarningPercent:
          type: integer
          default: 80
          description: '**Warn before the ceiling, not at it.** A manager told at 100% has already spent
            it; one told at 80% can decide with a week left.

            '
        guestCapabilityScope:
          type: array
          description: '**What a guest-facing assistant may help with, and nothing else** (2.1.28). Bounding
            the capability is what makes the cost predictable and the safety posture tractable — an assistant
            that answers anything is one that can be asked anything.

            '
          items:
            type: string
            enum:
            - ticketSelection
            - promotions
            - faq
            - recommendations
            - checkout
            - waitTimes
            - wayfinding
            - visitPlanning
        retrieveTopK:
          type: integer
          default: 30
          description: How many chunks retrieval returns before reranking.
        rerankTopK:
          type: integer
          nullable: true
          default: 5
          description: 'How many survive the rerank and reach the model. **Reranking reduces cost as well
            as improving quality**, which is unusual — retrieval is cheap and the tokens sent to the model
            are not.

            Null disables reranking, and a venue with no rerank provider configured runs without it rather
            than failing.

            '
        cacheAnswers:
          type: boolean
          default: true
          description: '**The largest cost lever available at a kiosk.** Guest questions are extraordinarily
            repetitive — forty questions, thousands of times a day — where staff questions are diverse.

            **Invalidation runs on the same events that invalidate the index.** A cached answer that outlives
            a price change has misled a guest on the venue''s behalf, which is worse than a slow one.

            '
        cacheTtlMinutes:
          type: integer
          default: 60
          description: 'An upper bound on top of event invalidation, not instead of it. **The key carries
            `scope_path`** — a cache keyed on the question alone is a cross-venue leak wearing a performance
            hat.

            '
        retainInteractionsDays:
          type: integer
          deprecated: true
          description: 'How long prompts and responses are kept. **Deprecated 29 September (decision 5):** AI
            data retention is one tenant configuration with a period per data class, 90 days by default,
            kept with the tenant''s other data-retention settings in `tenancy`, not here. Read for one release
            and ignored once the tenant setting exists.

            '
        semanticCacheThreshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.95
          description: '**Similarity above which a cached answer serves a new question.** `cache:answer`
            is exact-match on question, scope and locale — *what time do you close* and *when do you shut*
            are two misses and two provider calls.


            **Per capability, not global.** A factual venue question tolerates 0.95; a recommendation
            tolerates nothing. **A tenant who finds it wrong can move it**, which is why it is policy
            rather than a constant.'
        negativeCacheTtlSeconds:
          type: integer
          default: 300
          description: '**How long *no answer found* is remembered.** A miss costs a full retrieval and
            a completion.


            **Shorter than a hit deliberately** — the answer may exist tomorrow because somebody indexed
            it.'
        cascade:
          type: object
          nullable: true
          description: '**A small model answers and escalates only below a confidence threshold.** `ai.suggestion.confidence`
            exists and nothing routes on it.'
          properties:
            smallModel:
              type: string
            largeModel:
              type: string
            escalateBelow:
              type: number
              default: 0.7
        chunking:
          type: object
          description: '**The single biggest lever on retrieval quality**, and currently nowhere. **A
            venue FAQ and a maintenance manual do not chunk the same way.** Per collection, not global.'
          properties:
            sizeTokens:
              type: integer
              default: 512
            overlapTokens:
              type: integer
              default: 64
            strategy:
              type: string
              enum:
              - fixed
              - sentence
              - semantic
              default: sentence
        quantisation:
          type: string
          enum:
          - none
          - scalar
          - binary
          default: none
          description: '**A decision, never a default.** `scalar` int8 is roughly four times smaller —
            49 GB becomes 12 — **and it costs recall**. `binary` is smaller again and needs rescoring
            against full vectors to be usable.


            **A creation decision**: changing it means a rebuild, which is what `shadow_collection` is
            for. **A tenant whose search quality drops after an infrastructure change should be able to
            find the line that did it.**'
        hnsw:
          type: object
          nullable: true
          description: '**Defaults are tuned for neither our recall nor our latency.** A collection built
            with the wrong ones needs a rebuild, which is why this is a creation decision like the sparse
            index.'
          properties:
            m:
              type: integer
              default: 16
            efConstruct:
              type: integer
              default: 128
            efSearch:
              type: integer
              default: 64
        perRequestTokenCeiling:
          type: integer
          nullable: true
          description: '**One runaway conversation can spend a tenant''s month.** `monthlyTokenCeiling`
            discovers that after it has happened.'
        streamsByCapability:
          type: array
          items:
            type: string
          description: '**Time to first token and total latency are separate targets.** A concierge that
            starts answering in 300 ms and finishes in 4 seconds is better than one silent for 2.


            **`chat` streams; `generateConfiguration` does not** — nobody watches a config draft assemble.'
        fallbackProviderId:
          type: string
          format: uuid
          nullable: true
          description: 'BL-151: **a provider outage with no fallback is every AI surface going dark at
            once.**


            **`residencyRefused` is never failed over.** It is a correct answer, and moving the call elsewhere
            would defeat the refusal.'
        guardrailShortCircuit:
          type: boolean
          default: true
          description: '**A refusal a rule can decide never reaches a model.** Cheaper, faster and more
            consistent than asking a model to refuse.'
        suggestionProviders:
          allOf:
          - $ref: '#/components/schemas/SuggestionProviderAssignments'
          readOnly: true
          description: '**Which producer answers each `SuggestionKind`**, and what `requestSuggestion`
            routes by. Written only by `setSuggestionProvider`; `setAiPolicy` leaves it as it was. Held
            on the tenant row — a venue row does not carry its own.

            '
    AiConversation:
      type: object
      x-ticvai-persistence: ai.conversation
      required:
      - id
      - principalId
      - module
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        scopePath:
          type: string
        module:
          $ref: ../shared/common.yaml#/components/schemas/ModuleKey
        locale:
          type: string
        messageCount:
          type: integer
        startedAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
    AiSource:
      type: object
      x-ticvai-persistence: none — stored as jsonb on the row that carries it (ai.message.sources, ai.activity.sources), through AiSourceList
      description: 'What the answer was grounded in (8.3.70). **An answer with no sources is a guess**,
        and the interface should show it as one.

        '
      properties:
        kind:
          type: string
          enum:
          - document
          - product
          - entitlement
          - report
          - record
        id:
          type: string
        title:
          type: string
        collectionId:
          type: string
          format: uuid
          nullable: true
        excerpt:
          type: string
        relevance:
          type: number
    AiMessage:
      type: object
      x-ticvai-persistence: ai.message
      required:
      - id
      - conversationId
      - role
      - content
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
          - system
        content:
          type: string
        sources:
          $ref: '#/components/schemas/AiSourceList'
        confidence:
          type: number
          nullable: true
          description: '8.1.5, 8.3.67. **Nullable on purpose** — a provider that does not report confidence
            must yield null rather than an invented number, and an interface showing 0.9 because the code
            defaulted it is worse than showing nothing.

            '
        rationale:
          type: string
          nullable: true
          description: 8.3.68, 8.3.69.
        proposedAction:
          allOf:
          - $ref: '#/components/schemas/ProposedAction'
          nullable: true
          description: Present where the answer suggests a change. **A draft, never applied here.**
        traceId:
          type: string
        provider:
          $ref: '#/components/schemas/AiProviderKind'
        model:
          type: string
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        latencyMs:
          type: integer
        createdAt:
          type: string
          format: date-time
    ProposedAction:
      type: object
      x-ticvai-persistence: ai.proposed_action
      required:
      - id
      - kind
      - targetContract
      - targetOperation
      - payload
      - status
      properties:
        id:
          type: string
          format: uuid
        interactionId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - pricing
          - promotion
          - operational
          - financial
          - configuration
          - content
          - audience
          description: '`content` (a marketing or storefront draft from `proposeMarketingContent`) and `audience` (a
            lookalike segment from `proposeLookalikeSegment`) added 29 September (build); both are applied by a person
            in the owning screen.'
        targetContract:
          type: string
          description: Which contract would perform it. The assistant never performs it itself.
        targetOperation:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: 'The request body a person would submit, ready to review. **Open on purpose: its
            shape is the request body of `targetOperation` in `targetContract`**, and it is validated
            against that operation, not restated here.

            '
        summary:
          type: string
        status:
          type: string
          description: '**Expiry (decided 28 September, audit R213)**: a `proposed` action expires 7 days
            after `proposedAt`; an `approved` action not applied expires 24 hours after `decidedAt`. Both
            are proposed values, client to correct, and `expiresAt` carries the one that applies.

            '
          enum:
          - proposed
          - approved
          - rejected
          - applied
          - expired
        expiresAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          x-ticvai-derived: onWrite
          description: When the expiry timer moves this action to `expired` — `proposedAt` plus 7 days
            while `proposed`, `decidedAt` plus 24 hours once `approved`, null once `rejected`, `applied`
            or `expired` (audit R213).
        approvalLevel:
          type: integer
          minimum: 1
          maximum: 2
          description: '8.3.65. Multi-level, because a discount and a pricing change differ in authority.
            **Two levels (decided 28 September, audit R213)**: `2` for anything touching prices or
            permissions (every `pricing` and `promotion` action, and any other whose payload sets a price,
            a discount, a role or a permission grant), which needs a manager other than the requester;
            `1` for everything else, which the requester approves themselves.

            '
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        decisionReason:
          type: string
          nullable: true
          description: 'Required on rejection. **The only signal the assistant is proposing badly**, and
            without it a poor model degrades silently.

            '
        proposedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
          readOnly: true
          description: '**Added 29 September (AI design 3.1):** `ai.proposed_action` had no policy — its only
            references were nullable. The scope it was proposed at, and the partition key row-level security
            reads.

            '
        planId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: ai.action_plan
          description: The plan this action presents for a decision (AI design 2.2 D, 3.8).
        approvalRequestId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The `approvals` request deciding a tier 2 or matrix-caught action (AI design 2.3).
        changeSetHash:
          type: string
          nullable: true
          readOnly: true
          description: Hash of the change set approved; execution refuses a plan whose hash differs (AIC-181).
    AiInteraction:
      type: object
      x-ticvai-persistence: ai.activity
      required:
      - id
      - principalId
      - capability
      - outcome
      - createdAt
      properties:
        scrubAudit:
          type: object
          readOnly: true
          x-ticvai-persistence-kind: valueObject
          x-ticvai-persistence-column: jsonb
          description: '**The audit of one call''s scrubbing and routing** (3 October 2026, CHG-R1S-016; the legal
            research `docs/active/research/openai-key-uae-3-october.md`, item 9). Counts of the entities found by type, **never
            the values**; the residency class, endpoint and region; the scrubber version; whether the call was
            allowed or blocked; and a hash of the outbound payload. Exportable to the tenant as controller.'
          properties:
            entityCounts:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
              description: Per entity type, e.g. emiratesId 1 and uaePhone 2. Counts only, never values.
            residencyClass:
              $ref: ../shared/common.yaml#/components/schemas/AiResidencyClass
            endpointRegion:
              type: string
              description: Where the call went, e.g. `uaeNorth`, `ae.api.openai.com`, `global`.
            scrubberVersion:
              type: string
            decision:
              type: string
              enum:
              - allowed
              - blocked
            outboundPayloadHash:
              type: string
              description: SHA-256 of the prompt as sent (after scrubbing), so a dispute can be checked without
                keeping the text.
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
          nullable: true
        principalId:
          type: string
          format: uuid
        audience:
          type: string
          enum:
          - staff
          - guest
          description: '**Billing divides on this.** Staff usage is bounded by headcount; guest usage
            is bounded by footfall and curiosity, and a venue cannot stop guests asking questions.

            '
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'The guest, where the audience is `guest`. `principalId` is null in that case —
            **a guest is not a principal**, and attributing their tokens to a staff member would be wrong
            twice.

            '
        billableToTenantId:
          type: string
          format: uuid
          description: 'Resolved from `scopePath` at write time, not derived later. **Billing must not
            depend on walking a scope tree that has since been reorganised.**

            '
        scopePath:
          type: string
        capability:
          type: string
        prompt:
          type: string
        response:
          type: string
        sources:
          $ref: '#/components/schemas/AiSourceList'
        outcome:
          type: string
          enum:
          - answered
          - refused
          - applied
          - rejected
          - failed
        refusalReason:
          type: string
          nullable: true
        provider:
          $ref: '#/components/schemas/AiProviderKind'
        model:
          type: string
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        cost:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          x-ticvai-column: cost_amount
          description: 'What the call cost at the provider. **Money like every other amount** (naming-and-style
            5.1) — it replaces an integer `costMinor` that carried no currency or scale, which AED and
            OMR read differently.

            '
        latencyMs:
          type: integer
        maskedFieldCount:
          type: integer
          description: How many fields were redacted. Zero on a prompt touching guest data is a defect.
        traceId:
          type: string
        decisionRecordId:
          type: string
          format: uuid
          nullable: true
          description: The `ai.decision_record` this call belongs to, where it was part of a governed decision
            (AI design 2.3, 3.9). Null for a call audited by this row alone.
        cacheLayer:
          type: string
          nullable: true
          enum:
          - guardrail
          - semantic
          - exact
          - negative
          - analytics
          description: Which cache answered, where one did (AI design 3.6). Null for a model call.
        createdAt:
          type: string
          format: date-time
    IndexSource:
      type: object
      x-ticvai-persistence: ai.index_source
      description: 'One declaration per indexed table. **The service that owns the table does not know
        this exists** — the AI service consumes the domain event the owner already publishes.

        '
      required:
      - table
      - textFields
      - collection
      - scopeLevel
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        table:
          type: string
          description: Schema-qualified, e.g. `whitelabel.content_page`.
        contract:
          type: string
          description: Which contract owns it, for tracing back.
        textFields:
          type: array
          minItems: 1
          description: 'The fields a person would read. **Only these are embedded** — indexing a whole
            row embeds ids and timestamps as though they were meaning, and a search for "annual pass"
            then matches a UUID.

            '
          items:
            type: string
        payloadFields:
          type: array
          description: 'Carried alongside the vector for filtering, not embedded. Always includes `scope_path`.
            **Since 29 September the vectors are in the tenant database under row-level security** (AI
            design 5.8), so scope is enforced by RLS; carrying it here as well keeps the filter correct on a
            Qdrant scale-out tenant.

            '
          items:
            type: string
        collection:
          type: string
          description: Which embedding table it lands in (`ai.chunk_embedding` for the default model; one table
            per embedding model, AI design 5.8). Was a Qdrant collection until 29 September.
        scopeLevel:
          type: string
          enum:
          - tenant
          - region
          - venue
        invalidatedBy:
          type: array
          description: 'Domain events that make an entry stale. `catalogue.product` names `catalogue.productPublished`,
            and the catalogue never learns AI exists.

            '
          items:
            type: string
        chunkStrategy:
          type: string
          enum:
          - wholeRecord
          - paragraph
          - fixedTokens
          - section
          - semanticSection
          - parentChild
          description: '**Changes what is stored, so it cannot be altered without a reindex.**

            `parentChild` retrieves on a small precise chunk and returns the parent section. **A refund
            policy paragraph retrieved without its heading answers the wrong question confidently**, which
            is the failure this exists to prevent.

            `semanticSection` splits on meaning rather than length. `fixedTokens` cuts a rule in half,
            and policies and FAQs are where that shows.

            '
        parentField:
          type: string
          nullable: true
          description: Which field carries the parent context, where `chunkStrategy` is `parentChild`.
        isActive:
          type: boolean
        entryCount:
          type: integer
          readOnly: true
        lastIndexedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        staleCount:
          type: integer
          readOnly: true
          description: Records changed since their last embedding. Non-zero for long is drift.
    IndexJob:
      type: object
      x-ticvai-persistence: ai.index_job
      required:
      - id
      - sourceId
      - status
      - startedAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - full
          - incremental
          - removal
        reason:
          type: string
        status:
          type: string
          enum:
          - queued
          - building
          - verifying
          - swapping
          - complete
          - failed
        recordsTotal:
          type: integer
        recordsEmbedded:
          type: integer
        recordsFailed:
          type: integer
          description: '**The number to watch.** A source silently failing on 3% of its rows is a search
            silently missing 3% of the answers, and nothing else in the system will say so.

            '
        failureSample:
          type: array
          items:
            type: string
        shadowCollection:
          type: string
          nullable: true
          description: 'A full rebuild writes here and swaps on completion. Reindexing in place leaves
            the assistant answering from a half-built index.

            '
        shardKey:
          type: string
          readOnly: true
          description: '**The tenant boundary on shared placement** (ADR-0021). A collection is shared
            by every tenant using the same embedding model, and the shard is what separates them — set
            at provisioning from the tenant, never from a request.

            On dedicated placement there is one shard and this is still populated, because a tenant moving
            from shared to dedicated moves a shard rather than being re-indexed.

            '
        embeddingModel:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    KnowledgeCollection:
      type: object
      x-ticvai-persistence: ai.knowledge_collection
      required:
      - name
      - scopeLevel
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        scopeLevel:
          type: string
          enum:
          - tenant
          - region
          - venue
        scopePath:
          type: string
          readOnly: true
        documentCount:
          type: integer
          readOnly: true
        shardKey:
          type: string
          readOnly: true
          description: '**The tenant boundary on shared placement** (ADR-0021). A collection is shared
            by every tenant using the same embedding model, and the shard separates them — set at provisioning
            from the tenant, never from a request.

            On dedicated placement there is one shard and this is still populated, because a tenant moving
            from shared to dedicated moves a shard rather than being re-indexed.

            '
        retrieval:
          type: string
          enum:
          - dense
          - hybrid
          default: hybrid
          description: '**Set at creation and not changeable.** A collection created dense-only cannot
            gain a sparse index without a full rebuild, which is why this is a creation decision rather
            than a query one.

            Hybrid is the default because **a venue corpus is mostly proper nouns** — Yas Waterworld,
            Bronze Annual Pass, a menu item name. Dense retrieval is good at meaning and poor at exact
            tokens, and half our queries are exact tokens.

            '
        sparseModel:
          type: string
          nullable: true
          description: The sparse signal, where `retrieval` is `hybrid`. BM25 unless a tenant needs otherwise.
        idfScope:
          type: string
          enum:
          - shard
          - tenant
          - venue
          default: tenant
          description: '**Which population the sparse score measures rarity against** (ADR-0021). Qdrant
            computes IDF statistics shard-wide by default, so a term common at one venue and rare at another
            gets one score for both. Shard-per-tenant fixes the cross-tenant case; **inside a dedicated
            cell the shard is the whole tenant and venues share it**, which is what this narrows.

            '
        embeddingModel:
          type: string
          readOnly: true
          description: '**This is what decides how many collections exist** (ADR-0021). A collection carries
            its own vector configuration and a shard cannot, so vectors from two models cannot share one.
            A tenant that residency forces onto a local model therefore has its own collection — forced
            by the model, not chosen for isolation.

            Read-only because **changing it invalidates every embedding in the collection**, and a collection
            silently searched with mismatched vectors returns plausible nonsense.

            '
