  /ai-providers/{providerId}/credential:
    parameters:
    - name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setAiCredential
      x-ticvai-consumed-by:
        - "P09 ADM-037 AI Provider & Credentials"
      x-ticvai-audience:
      - staff
      summary: Store or rotate a provider key
      description: '**The key goes to the vault and never to the database.** The request carries the secret
        once; what is stored is a `credentialRef`, and every read of this provider thereafter returns
        the reference rather than the value.

        **Stored correctly, whatever the provider** (Chinmay, 2 October, contract follow-ups; CHG-FUP-008). The key
        becomes one secret per tenant and provider in the cell''s Azure Key Vault (the tenant''s own secret, never
        shared between tenants), encrypted at rest under the vault''s HSM-backed key; only the AI gateway''s workload
        identity may read it. It is write-only: never returned, never shown again, never logged, never in an audit
        record or an `ai.interaction`; a reader sees `credentialHint` (the last four characters) and
        `credentialRotatedAt`. A new key resets `AiProvider.compatibility` to `notTested`; an active provider keeps
        serving on the previous key through the grace window while `testAiProvider` re-runs.

        **No surface ever holds a provider key.** A kiosk, an app and a browser all call TICVAI, and TICVAI
        calls the provider — because a token that reaches a client is a token that bills the tenant from
        somebody else''s machine.

        Rotation is the same operation. The previous key is revoked at the vault after a grace window,
        so an in-flight request does not fail mid-answer. **The window is 24 hours (decided 28 September,
        audit R096)**: a replaced key keeps working for `graceMinutes`, 1,440 unless a shorter window is
        sent — a compromised key is rotated with `graceMinutes: 0`.

        **Only a tenant-managed provider takes a key here** (AI design 5.9, decided 29 September). A
        provider with `managedBy: ticvai` runs on TICVAI''s Azure OpenAI subscription with a per-tenant key
        the platform provisions for attribution; nobody types it, and this refuses it with 409
        `provider-managed-by-ticvai`.

        '
      tags:
      - ai
      x-ticvai-permission: AI_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  format: password
                  description: '**Write-only, never returned, never logged, never in an `ai.interaction`.**
                    Masked in any audit record of this call.

                    '
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                graceMinutes:
                  type: integer
                  minimum: 0
                  maximum: 1440
                  default: 1440
                  description: How long the previous key stays valid, so in-flight requests survive. 24
                    hours by default (decided 28 September, audit R096); 0 revokes it at once.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Stored, with a reference and no secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProvider'
        '409':
          description: The provider is TICVAI-managed; its key is provisioned by the platform (`provider-managed-by-ticvai`).
          x-ticvai-problem-types:
          - provider-managed-by-ticvai
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
