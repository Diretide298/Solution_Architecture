        '200':
          description: Health per capability
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AiCapabilityHealth'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell, as `../shared/common.yaml` `serviceAuth`. Used by `evaluateAiGovernance`,
        `scoreTransactionRisk` and `simulateRecommendationDecision`.
  schemas:
    AiInboxEntry:
      type: object
      x-ticvai-persistence: ai.inbox
      x-ticvai-primary-key:
      - consumer
      - eventId
      x-ticvai-append-only: eventId
      description: '**The consumer''s record of every event it has processed** (ADR-0058). Inserted in the same
        transaction as the effect, with `ON CONFLICT DO NOTHING`; no row inserted means already processed, so skip
        and acknowledge. AI consumers write this rather than `kernel.inbox`, because only AI writes AI tables (ADR-0020). Kept 30 days, longer than any redelivery window, and dropped a month at a
        time: partitioned by month on `eventId`, which is a UUIDv7 and so sorts by time (ADR-0056).'
      required:
      - consumer
      - eventId
      - processedAt
      properties:
        consumer:
          type: string
          maxLength: 200
          description: The consumer's stable name (`<service>.<handler>`); one event is processed once per consumer.
        eventId:
          type: string
          format: uuid
          description: The envelope's `eventId`, which is the producing outbox row's id (UUIDv7).
        processedAt:
          type: string
          format: date-time
    AiMaturity:
      type: object
      x-ticvai-persistence: none — embedded as jsonb on ai.suggestion and ai.forecast_version
      description: '**Where an answer stands, on every answer** (29 September, AI functions review; baseline then learn).
        The customer sees a stage badge and a "Based on" chip, never a bare percentage (design 5.6), and "Limited
        historical data" while the starting pattern carries more than half the weight.'
      required:
      - stage
      - basedOn
      properties:
        stage:
          type: string
          enum:
          - starting
          - learning
          - established
          - learned
          description: '`starting`: the baseline (venue AI settings, the starting pattern for the venue type, the UAE
            calendar, weather). `learning`: own data carries short-range patterns (about 4 weeks). `established`: own
            level and trend lead, the baseline fills gaps such as a holiday not yet seen (about 3 months, or at once
            with 12+ months imported). `learned`: a model trained on this tenant''s data, promoted by an admin (AI-D16).'
        basedOn:
          type: string
          description: 'The "Based on" line, in words, e.g. *Based on: your venue profile, UAE calendar, weather, 23 days
            of your sales*. Always present.'
        sources:
          type: array
          items:
            type: object
            required:
            - source
            properties:
              source:
                type: string
                enum:
                - venueSettings
                - startingPattern
                - calendar
                - weather
                - bookingsOnHand
                - ownHistory
                - importedHistory
                - configuration
                - trainedModel
              detail:
                type: string
                nullable: true
                description: e.g. *23 days*, *water park pattern v3*, *Eid al-Adha 2027*.
              observations:
                type: integer
                nullable: true
        ownDataShare:
          type: number
          minimum: 0
          maximum: 1
          description: 'The weight own data carries, `n / (k + n)`. Below 0.5 the answer is marked "Limited historical
            data".'
        limitedHistory:
          type: boolean
        nextStage:
          type: object
          nullable: true
          description: What the next stage needs, e.g. *8 more Saturdays of sales*, or *an admin promotion*.
          properties:
            stage:
              type: string
              enum:
              - learning
              - established
              - learned
            needs:
              type: string
            expectedBy:
              type: string
              format: date
              nullable: true
    AiVenueSettings:
      type: object
      x-ticvai-persistence: ai.venue_settings
      description: '**The venue AI profile** (29 September, AI functions review): the figures a venue gives at onboarding
        so every data-driven answer is useful before it has history. One row per venue; configuration, not history.
        Defaults come from the starting pattern for `venueType`, which TICVAI writes from published sources and made-up
        example curves, **never from another tenant''s data** (AI-D01, AIP-149).'
      required:
      - venueId
      - venueType
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venueId:
          type: string
          format: uuid
        venueType:
          type: string
          enum:
          - waterPark
          - themePark
          - familyEntertainmentCentre
          - museum
          - arena
          - zooAquarium
          - other
        isOutdoor:
          type: boolean
          default: true
          description: Outdoor venues take the summer-heat and weather effects.
        capacity:
          type: integer
          minimum: 1
          nullable: true
        openingHours:
          type: array
          description: The usual week. Exceptions come from the venue calendar.
          items:
            type: object
            properties:
              dayOfWeek:
                type: integer
                minimum: 1
                maximum: 7
              opensAt:
                type: string
              closesAt:
                type: string
        typicalWeekdayAttendance:
          type: integer
          minimum: 0
          nullable: true
        typicalWeekendAttendance:
          type: integer
          minimum: 0
          nullable: true
        peakMonths:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
        averageSpend:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          nullable: true
        fnbAttachRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        staffProductivity:
          type: object
          additionalProperties:
            type: number
          description: 'Per role, units per staff hour, e.g. `{"cashier": 40, "gate": 300}`. Defaults from the pattern.'
        startingPatternKey:
          type: string
          readOnly: true
          description: The pattern and version in use, e.g. `waterPark@3`.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Row-level security compares it with `ticvai.scope_paths`
            (`platform.apply_scope_rls`), on the tenant database and on the AI log database alike (design 3.1).'
    AiHistoryImport:
      type: object
      x-ticvai-persistence: ai.history_import
      description: '**One import of a venue''s own history** (29 September, AI functions review). A job: validated, then
        loaded into `ai.history_observation`, never into the ledger.'
      required:
      - id
      - venueId
      - dataKind
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venueId:
          type: string
          format: uuid
        dataKind:
          type: string
          enum:
          - attendance
          - admissions
          - ticketSales
          - fnbSales
          - retailSales
          - queueReadings
          - staffShifts
        assetId:
          type: string
          format: uuid
          x-ticvai-references: assets.media_asset
        sourceSystem:
          type: string
          nullable: true
        columnMapping:
          type: object
          additionalProperties:
            type: string
        dryRun:
          type: boolean
          default: false
        status:
          type: string
          enum:
          - queued
          - validating
          - loading
          - completed
          - completedWithRejections
          - failed
          readOnly: true
        periodFrom:
          type: string
          format: date
          nullable: true
          readOnly: true
        periodTo:
          type: string
          format: date
          nullable: true
          readOnly: true
        monthsCovered:
          type: integer
          readOnly: true
        rowsRead:
          type: integer
          readOnly: true
        rowsLoaded:
          type: integer
          readOnly: true
        rowsRejected:
          type: integer
          readOnly: true
        findings:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              row:
                type: integer
              code:
                type: string
                enum:
                - badDate
                - badNumber
                - negativeValue
                - duplicateDay
                - unmappedColumn
                - outOfRange
              detail:
                type: string
        requestedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
          x-ticvai-references: identity.principal
        createdAt:
          type: string
          format: date-time
          readOnly: true
        completedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Row-level security compares it with `ticvai.scope_paths`
            (`platform.apply_scope_rls`), on the tenant database and on the AI log database alike (design 3.1).'
    AiHistoryObservation:
      type: object
      x-ticvai-persistence: ai.history_observation
      description: '**One imported observation** (29 September, AI functions review): a day''s (or an hour''s) value of
        one measure at the venue, from the venue''s own exports. Read by the statistical producers beside the snapshot of
        live trading; tagged `imported` on every answer that uses it. **Never a sale, never in a revenue report.** AI log
        database, append-only; a re-import of the same kind and period supersedes by `importId`.'
      required:
      - importId
      - venueId
      - dataKind
      - observedOn
      - value
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        importId:
          type: string
          format: uuid
          x-ticvai-references: ai.history_import
        venueId:
          type: string
          format: uuid
        dataKind:
          type: string
        observedOn:
          type: string
          format: date
        hour:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
        dimensionKey:
          type: string
          nullable: true
          description: The product, channel or outlet the value is for, as named in the export. Null for a venue total.
        value:
          type: number
        unit:
          type: string
          description: '`count`, `amount` or `minutes`.'
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Row-level security compares it with `ticvai.scope_paths`
            (`platform.apply_scope_rls`), on the tenant database and on the AI log database alike (design 3.1).'
    AiCapabilityMaturity:
      type: object
      x-ticvai-persistence: ai.capability_maturity
      description: '**The stage of each question the venue''s AI answers** (29 September, AI functions review). Written
        by the nightly re-estimate; a stage change is a new row, so the page can show when each answer moved.'
      required:
      - capabilityKey
      - stage
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        capabilityKey:
          type: string
        suggestionKind:
          allOf:
          - $ref: '#/components/schemas/SuggestionKind'
          nullable: true
        forecastDefinitionKey:
          type: string
          nullable: true
        stage:
          type: string
          enum:
          - starting
          - learning
          - established
          - learned
        maturity:
          $ref: '#/components/schemas/AiMaturity'
        producerRef:
          type: string
          description: The producer and version answering now.
        since:
          type: string
          format: date-time
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Row-level security compares it with `ticvai.scope_paths`
            (`platform.apply_scope_rls`), on the tenant database and on the AI log database alike (design 3.1).'
    AiTrainingRun:
      type: object
      x-ticvai-persistence: ai.training_run
      description: '**One per-tenant training run** (29 September, AI functions review; design 3.5): trained on the
        tenant''s own data only, backtested, then run in shadow. When its shadow period passes the gate, the release
        moves to `gatePassedAt` and a `promotionReady` alert goes to the admin (AI-D16).'
      required:
      - capabilityKey
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        capabilityKey:
          type: string
        suggestionKind:
          allOf:
          - $ref: '#/components/schemas/SuggestionKind'
          nullable: true
        forecastDefinitionKey:
          type: string
          nullable: true
        trainingWindowFrom:
          type: string
          format: date
        trainingWindowTo:
          type: string
          format: date
        dataCutoffAt:
          type: string
          format: date-time
        includesImportedHistory:
          type: boolean
          default: false
        featureSetVersion:
          type: string
        artefactRef:
          type: string
          nullable: true
          description: The model file in the tenant's Blob container.
        backtestRunId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: ai.eval_run
        releaseId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: ai.release
        status:
          type: string
          enum:
          - queued
          - training
          - backtesting
          - shadow
          - gatePassed
          - gateFailed
          - failed
        metrics:
          type: object
          additionalProperties: true
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Row-level security compares it with `ticvai.scope_paths`
            (`platform.apply_scope_rls`), on the tenant database and on the AI log database alike (design 3.1).'
    AiCapabilityHealth:
      type: object
      x-ticvai-persistence: none — computed from gateway telemetry, ai.activity and the breaker state in cache
      description: 'How one capability is running over the last hour (21 September minutes, M21-13).'
      required:
      - capabilityKey
      properties:
        capabilityKey:
          type: string
        availability:
          type: number
          minimum: 0
          maximum: 1
        p95LatencyMs:
          type: integer
        latencyBudgetMs:
          type: integer
          nullable: true
        errorRate:
          type: number
          minimum: 0
          maximum: 1
        breakerState:
          type: string
          enum:
          - closed
          - halfOpen
          - open
        degraded:
          type: boolean
          description: Answering from its degradation mode (rules only, search only, a person).
        dataFreshness:
          type: string
          nullable: true
          description: e.g. index lag, the last forecast published.
        requests:
          type: integer
        measuredAt:
          type: string
          format: date-time
    AiCapabilityFamily:
      type: string
      enum:
      - gatewayAndModels
      - governance
      - actionPipeline
      - knowledgeRetrieval
      - assistants
      - analyticsInsights
      - configurationAssistant
      - forecasting
      - anomalyDetection
      - riskIntelligence
      - recommendations
      - decisionRecords
      - operationsEvaluation
      - residencyPrivacy
      description: 'The fourteen capabilities of the AI system design (section 1.1), C1 to C14 in order: gateway
        and model registry, governance decision point, action pipeline and human oversight, knowledge and retrieval,
        assistants, analytics assistant and insights, configuration assistant, forecasting and operational requirements,
        anomaly detection, fraud and risk intelligence, recommendation and upsell engine, decision records and audit,
        operations/evaluation/cost, residency/privacy/tenancy. **Every registered capability belongs to exactly
        one**, which is what `AiPolicy.enabledCapabilities` and the usage report group by.'
    AiAutonomyLevel:
      type: integer
      minimum: 0
      maximum: 4
      description: '**One autonomy scale for every capability** (design 3.8 and 5.5, GOV 0 to 4; ADR-0050). 0 disabled;
        1 advisory (explains and recommends, nothing is drafted to run); 2 prepare (drafts a proposal a person applies
        in the owning screen); 3 execute with approval (the plan runs after approval, through owning APIs); 4 controlled
        auto (runs without approval, only for listed low-risk reversible actions inside pre-approved ranges). **Not
        the approval tier**: `ProposedAction.approvalLevel` is the tier.'
    AiRiskClass:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
      description: Business, customer, financial, operational, security and compliance impact of a capability or
        action type (AIC-144, ADM-521). The governance decision point scores against it.
    AiGovernanceOutcome:
      type: string
      enum:
      - allow
      - allowWithConditions
      - prepareOnly
      - approvalRequired
      - escalate
      - block
      description: What the governance decision point returns (design 3.8, AIC-166). Conflicts resolve to the more
        restrictive (AIC-161). `block` is an answer, not an error, and is logged as outcome `refused`.
    AiProvenance:
      type: string
      enum:
      - confirmed
      - aiRecommended
      - inferred
      - unknown
      description: '**Where a configuration value came from** (design 2.2 D, AIC-111): said by the administrator,
        recommended by the assistant, inferred from other answers, or not known yet. Shown beside every value; no
        confidence number is shown for configuration (design 5.6).'
    AiGovernanceRule:
      type: object
      x-ticvai-persistence: none — held in the jsonb rules column of ai.governance_policy_version, through AiGovernanceRuleList
      description: 'One rule of a governance policy version: which actions on which data, under which conditions,
        get which outcome (AIC-147..160).'
      required:
      - effect
      properties:
        effect:
          $ref: '#/components/schemas/AiGovernanceOutcome'
        capabilityKeys:
          type: array
          items:
            type: string
          description: Registered capabilities it applies to. Empty means every capability the policy names.
        actions:
          type: array
          items:
            type: string
            enum:
            - read
            - analyze
            - recommend
            - generate
            - prepare
            - create
            - modify
            - publish
            - execute
            - delete
          description: 'ADM-523: what AI may do, from reading to executing.'
        dataCategories:
          type: array
          items:
            type: string
          description: Data categories (ADM-524), e.g. `customerContact`, `payment`, `financial`, `operational`.
        purposes:
          type: array
          items:
            type: string
          description: Permitted purposes for those categories (AIC-156, AIR-182).
        maxAmount:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          nullable: true
          description: Above this value the effect escalates one step (for example to `approvalRequired`).
        roleIds:
          type: array
          items:
            type: string
            format: uuid
          description: Roles the rule applies to; empty means every role.
        environments:
          type: array
          items:
            type: string
            enum:
            - development
            - sandbox
            - staging
            - production
          description: 'ADM-525. Empty means every environment. **`sandbox`** (18 September minutes, M18-01): the
            developer sandbox and a tenant''s trial environment, governed apart from staging so a rule can allow in
            sandbox what it blocks in production.'
        conditions:
          type: object
          additionalProperties: true
          nullable: true
          description: Conditions attached to an `allowWithConditions` effect, for example `maskFields` or `requireCitation`.
    AiGovernanceRuleList:
      type: array
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: The rules of one policy version, stored with the version as one `jsonb` column.
      items:
        $ref: '#/components/schemas/AiGovernanceRule'
    AiEvidenceItem:
      type: object
      x-ticvai-persistence: none — held in jsonb on ai.decision_record.evidence, through AiEvidenceItemList
      description: 'One piece of evidence behind a decision, **labelled by origin** (AIC-197): read from a source
        system, derived by a rule or feature, or inferred by a model. An explanation is built from these, never
        from a model''s chain of thought (AIC-192).'
      required:
      - label
      - kind
      properties:
        label:
          type: string
          enum:
          - source
          - derived
          - modelInferred
        kind:
          type: string
          description: 'What it is: `feature`, `rule`, `document`, `metric`, `transaction`, `candidateSet`.'
        ref:
          type: string
          nullable: true
          description: 'Where it came from: a table and id, a document chunk, a metric key.'
        name:
          type: string
        value:
          type: object
          additionalProperties: true
          nullable: true
        observedAt:
          type: string
          format: date-time
          nullable: true
    AiEvidenceItemList:
      type: array
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: The evidence of one decision record, stored with it.
      items:
        $ref: '#/components/schemas/AiEvidenceItem'
    AiBlueprintIssue:
      type: object
      x-ticvai-persistence: none — held in jsonb on ai.blueprint.issues, through AiBlueprintIssueList
      description: 'A severity-graded problem found in a blueprint (AIC-114): incomplete, contradictory, ambiguous
        or inconsistent across modules.'
      required:
      - severity
      - message
      properties:
        severity:
          type: string
          enum:
          - blocking
          - warning
          - info
        kind:
          type: string
          enum:
          - missing
          - contradictory
          - ambiguous
          - crossModule
          - dependency
        decisionKey:
          type: string
          nullable: true
        module:
          type: string
          nullable: true
        message:
          type: string
    AiBlueprintIssueList:
      type: array
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: The issues of one blueprint version, stored with it.
      items:
        $ref: '#/components/schemas/AiBlueprintIssue'
    AiRecommendationItem:
      type: object
      x-ticvai-persistence: none — held in jsonb on ai.rec_decision.items, through AiRecommendationItemList
      description: One recommended item. **Carries a Pricing price reference, never a computed price** (AIR-029).
      required:
      - trackingId
      - rank
      properties:
        trackingId:
          type: string
          format: uuid
          description: Echoed on every `recordRecommendationEvents` event and as `orders.addCartLine.recommendationId`,
            so attribution never guesses.
        productId:
          type: string
          format: uuid
          nullable: true
          description: 'The product recommended. **Exactly one of `productId`, `promotionId` or `couponRef`, `rewardId`
            or `challengeId` is set, by `kind`** (29 September, build): `offer` carries a promotion or coupon, `reward`
            a loyalty reward, `challenge` a challenge, every other kind a product.'
        promotionId:
          type: string
          format: uuid
          nullable: true
          description: For `offer`, a published promotion the guest is eligible for. Promotions computes the discount
            at the basket, never the engine.
        couponRef:
          type: string
          nullable: true
          description: For `offer`, a coupon campaign; a code is assigned only when the guest takes it (`promotions.assignCoupon`).
        rewardId:
          type: string
          format: uuid
          nullable: true
          description: For `reward`, a marketing-crm loyalty reward the guest can redeem.
        challengeId:
          type: string
          format: uuid
          nullable: true
          description: For `challenge`, a marketing-crm challenge the guest can join.
        kind:
          type: string
          enum:
          - upsell
          - crossSell
          - upgrade
          - bundle
          - addOn
          - membership
          - nextBestOffer
          - offer
          - reward
          - challenge
        rank:
          type: integer
          minimum: 1
        priceRef:
          type: string
          nullable: true
          description: The Pricing reference the channel resolves to a price. AI never computes a price.
        reasonTemplateKey:
          type: string
          nullable: true
          description: 'The template reason (decided 29 September, decision 9): no model writes guest-visible reasons.'
        reasonText:
          type: string
          nullable: true
          description: The rendered template in the session locale, where the channel shows reasons.
        confidenceBand:
          type: string
          enum:
          - high
          - medium
          - low
          description: 'Design 5.6: a band, never a bare percentage.'
        score:
          type: number
          nullable: true
          description: Normalised score. **Returned to staff callers only**; a guest response omits it.
    AiRecommendationItemList:
      type: array
      x-ticvai-persistence-kind: valueObject
      x-ticvai-persistence-column: jsonb
      description: The final set of one recommendation decision, stored with it.
      items:
        $ref: '#/components/schemas/AiRecommendationItem'
    AiConfigurationQuestion:
      type: object
      x-ticvai-persistence: none — chosen per turn from the configuration knowledge model
      description: '**The next question, chosen by the configuration knowledge model, not by the language model**
        (design 2.2 D, AIC-111). The model only extracts a structured answer against `answerSchema`.'
      required:
      - questionKey
      - text
      - decisionClass
      properties:
        questionKey:
          type: string
        text:
          type: string
        module:
          type: string
          nullable: true
        decisionClass:
          type: string
          enum:
          - required
          - recommended
          - optional
        answerType:
          type: string
          enum:
          - freeText
          - singleChoice
          - multiChoice
          - number
          - date
          - confirm
        options:
          type: array
