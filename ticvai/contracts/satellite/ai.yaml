        role. `AI_APPROVE` no longer promotes; the switch is a logged breaking change against r1 (BC-007,
        CHG-FUP-004). **Refused to a service caller.** Where the
        capability answers a `requestSuggestion` kind, production rewrites that kind''s assignment in `AiPolicy.suggestionProviders`,
