    AiForecastDefinition:
      type: object
      x-ticvai-persistence: ai.forecast_definition
      description: '**What is forecast, at what grain, for what horizon, how often and by which producer** (design
        3.1 Forecast, 5.2; ADM-500). One forecasting service for the platform: BI''s extra subjects are definitions
        here, not a second forecaster (AIP-036, AIP-037).'
      required:
      - definitionKey
      - subject
      - grain
      - horizonDays
      - producer
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        definitionKey:
          type: string
        name:
          type: string
        subject:
          type: string
          enum:
          - attendance
          - arrivalPattern
          - productDemand
          - timeslotDemand
          - channelPace
          - revenue
          - occupancy
          - attractionUtilisation
          - queue
          - entryFlow
          - staffing
          - posDemand
          - fnbDemand
          - retailDemand
          - stockDemand
          - resourceDemand
          - refunds
          - cashCollection
          - membershipRenewals
          - churn
        module:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/ModuleKey
          description: '**Whose AI this forecast is, and so who publishes it** (Chinmay, 2 October, workbook Q3:
            "the permission holder for that module''s AI"; CHG-FUP-004). `publishForecastVersion` requires the
            permission `contracts/shared/permissions.yaml` `x-ticvai-module-ai-publish` names for this module.
            Absent on a write, the server takes it from `subject`: ticketing for `attendance`, `arrivalPattern`,
            `productDemand`, `timeslotDemand`, `channelPace`, `occupancy` and `refunds`; access for `entryFlow` and
            `attractionUtilisation`; queue for `queue`; fnb for `fnbDemand`; retail for `retailDemand`; inventory
            for `stockDemand`; resources for `resourceDemand`; membership for `membershipRenewals` and `churn`; core
            for `revenue`, `staffing`, `posDemand` and `cashCollection`. Proposed, client to correct; a venue may
            name the module itself. Always present on a read.'
        grain:
          type: string
          enum:
          - hour
          - day
          - week
          - month
        dimensions:
          type: array
          items:
            type: string
          description: 'Breakdowns forecast directly or reconciled to. **Documented keys (29 September, build; 8.2.12,
            8.2.14, 8.2.27):** `product`, `channel`, `timeslot`, `gate`, `outlet`, `customerSegment` and `originCountry`.
            `customerSegment` is the marketing-crm segment (of those in `segmentIds`, else the membership tier) the
            guest belonged to on the day of the booking; `originCountry` is the guest profile''s country, else the
            order''s billing country, else the channel''s market, recorded as `unknown` rather than guessed. **The nightly
            snapshot (design 2.2 C step 1) carries both for every booking and admission**, so a definition that names
            them is forecast and reconciled by them. Any other key is accepted and forecast only where the snapshot
            carries it.'
        segmentIds:
          type: array
          items:
            type: string
            format: uuid
          description: The marketing-crm segments `customerSegment` breaks down by, in priority order where a guest
            is in several. Empty means membership tiers.
        horizonDays:
          type: integer
          minimum: 1
          maximum: 730
        refreshCadence:
          type: string
          enum:
          - hourly
          - daily
          - weekly
        producer:
          type: string
          enum:
          - rule
          - statistical
          - model
          - ensemble
          description: 'Which producer is live (design 3.10). A model is promoted only through `promoteAiRelease`.
            **`ensemble`** (18 September minutes, M18-16): a weighted blend of the rule and statistical producers,
            and of a promoted model where one exists; the weights are recorded on each version. Setting `ensemble`
            never brings in an unpromoted model.'
        historyWindowMonths:
          type: integer
          minimum: 1
          maximum: 60
          default: 36
          description: 'How much of the venue''s own history the statistical producer reads (18 September minutes,
            M18-16: "36 months of history"). Imported history (`importVenueHistory`) counts. Less than the window is
            not an error: the cold-start setting fills the gap.'
        coldStart:
          type: object
          description: '**What the forecast stands on before the venue has history** (29 September, AI functions
            review; forecasting book p.27 "New Venue / New Product Problem"). Day one is never empty: the prior is
            the venue AI settings (typical weekday and weekend attendance, capacity, opening hours) x the starting
            pattern for the venue type x the UAE calendar x weather, with bookings on hand as a floor. The
            statistical producer blends own data in as `(k x prior + n x own) / (k + n)`, with `k` =
            `priorWeightObservations`. The version''s `maturity` says which stage it reached.'
          properties:
            strategy:
              type: string
              enum:
              - venueSettings
              - startingPattern
              - sisterVenue
              - categoryBaseline
              - importedHistory
              default: venueSettings
              description: '`venueSettings` uses the onboarding figures with the venue-type pattern; `sisterVenue`
                a venue of the same tenant; `categoryBaseline` a product category''s own history; `importedHistory`
                means an import covers the window and the prior only fills unseen holidays.'
            sisterVenueId:
              type: string
              format: uuid
              nullable: true
              description: For `sisterVenue`. Same tenant only (no data is pooled across tenants, AIP-149).
            priorWeightObservations:
              type: integer
              minimum: 1
              maximum: 52
              default: 4
              description: '`k`: how many own observations the prior is worth (4 same weekdays by default).'
            startingBandPercent:
              type: integer
              minimum: 5
              maximum: 80
              default: 40
              description: The width of the range while the prior carries most of the weight (about +/-40%).
        producerRef:
          type: string
          readOnly: true
        shadowProducerRef:
          type: string
          nullable: true
          readOnly: true
          description: Runs alongside and is recorded, never shown (design 3.5).
        autoPublish:
          type: boolean
