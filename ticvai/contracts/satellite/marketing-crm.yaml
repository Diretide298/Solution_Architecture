    PrivacyIncident:
      type: object
      x-ticvai-persistence: marketing.privacy_incident
      description: 'BL-176. **A personal-data breach has a regulator clock**, and UAE PDPL gives 72 hours
        from discovery. Nothing in the package recorded one.

        **Modelled on the maintenance incident pattern**, because the shape is the same — discovery, assessment,
        containment, notification, closure — and **the field that matters is the one that starts the clock.**

        '
      required:
      - id
      - discoveredAt
      - severity
      - status
      properties:
        id:
          type: string
          format: uuid
        discoveredAt:
          type: string
          format: date-time
          description: '**The clock starts here, not at occurrence.** 72 hours runs from discovery, which
            is why this is separate from `occurredAt` and why a discovery nobody recorded is a deadline
            nobody is counting.

            '
        occurredAt:
          type: string
          format: date-time
          nullable: true
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        affectedSubjectCount:
