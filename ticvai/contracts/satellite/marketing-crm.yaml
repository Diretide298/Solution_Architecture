            - identity
            - financial
            - biometric
            - health
            - location
            - behavioural
            - credentials
        containedAt:
          type: string
          format: date-time
          nullable: true
        regulatorNotifiedAt:
          type: string
          format: date-time
          nullable: true
          description: '**Or a recorded reason for not notifying.** Deciding a breach is not notifiable
            is a legitimate decision and an undocumented one is indistinguishable from having missed it.

            '
        subjectsNotifiedAt:
          type: string
          format: date-time
          nullable: true
        notNotifiedRationale:
          type: string
          nullable: true
        status:
          type: string
          enum:
