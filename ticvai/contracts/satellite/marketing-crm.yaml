openapi: 3.1.0
info:
  title: TICVAI Marketing & CRM
  version: 0.1.0
  x-ticvai-screen-count: 171
  x-ticvai-tier: satellite
  x-ticvai-module: 22 — Marketing & CRM
  x-ticvai-requirements: 319
  x-ticvai-capabilities:
  - C32
  - C33
  - C59
  - C60
  - C61
  - C62
  - C63
  - C64
  - C65
  - C66
  - C93
  x-ticvai-platforms:
  - P08 Venue Management
  - P12 Venue Support
  - P02 Guest App
  description: "## What this contract covers\n**Consent gates everything. A segment is a definition, not\
    \ a list.**\n| | | |---|---| | **Tier** | satellite | | **Matrix domain** | 22 — Marketing & CRM |\
    \ | **Requirements** | ~319 | | **Capabilities** | C32, C33, C59, C60, C61, C62, C63, C64, C65, C66,\
    \ C93 | | **Consumed by** | P08 Venue Management · P12 Venue Support · P02 Guest App |\n## How to\
    \ read this file\n**This file is a contract.** It is hand-authored and it is the source of truth for\
    \ one bounded context: server code, client code and mock servers are generated from it, never the\
    \ other way round. If a field is not here, it does not exist.\n**Contracts are split into two tiers.**\n\
    - **Spine** — the eight contexts everything else depends on: tenancy, identity,\n  catalogue, orders,\
    \ shift, access, finance, cross-region. Frozen first. A change here\n  requires a formal change request,\
    \ because every satellite has pinned against it.\n- **Satellite** — a domain that builds on the spine\
    \ and can move independently.\n  Cheaper to change.\n\n**`paths` are operations.** Each one declares\
    \ four TICVAI extensions, and Redocly rejects any that does not:\n| Extension | Answers | |---|---|\
    \ | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml`\
    \ — never hand-typed | | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission\
    \ must be held | | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this | |\
    \ `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual`\
    \ |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service` (cell-to-cell),\
    \ `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security: []` (genuinely public).\n\
    **`components.schemas` are API schemas — the shape of data on the wire.** They are not database tables.\
    \ One API schema may become three columns (`Money`) or five tables (`Order`); some have no table at\
    \ all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from these, and the rest\
    \ — partitioning, RLS, the PII split — is storage design that lives in the migration scripts.\n**`security`\
    \ arrays hold OAuth scopes.** Empty means \"this scheme, no scopes\" — for bearer tokens there is\
    \ nothing to list. Empty is not the same as absent: absent means unauthenticated.\n\n## This context\n\
    Guest profiles, segmentation, campaigns, consent, service cases, loyalty and feedback. Domain 20 —\
    \ 319 requirements.\nPositions this encodes:\n- **Consent gates everything.** No campaign sends to\
    \ a guest without a current, recorded\n  consent for that channel and purpose. Consent is checked\
    \ at send time, not at segment\n  build time, because a guest may withdraw between the two.\n- **Consent\
    \ management is Wave 1**, ahead of the rest of this context. It is the\n  precondition for AI-66 and\
    \ for any outbound message at all.\n- **A segment is a definition, not a list.** It is evaluated when\
    \ used. A materialised\n  list goes stale the moment a guest transacts, and stale audience lists are\
    \ how people\n  receive offers for things they already bought.\n- **Guest identity is separate from\
    \ entitlement.** A profile here references a Subject by\n  opaque ID; the personal data lives in the\
    \ erasable store, which is what makes erasure\n  possible against an append-only ledger.\n- Where\
    \ a guest is linked across cells, marketing operates on the **local** subject.\n  Cross-cell aggregation\
    \ happens in the warehouse, never by querying another cell.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: guest
- name: consent
- name: segment
- name: campaign
- name: message
- name: case
- name: loyalty
- name: feedback
paths:
  /my/cases:
    get:
      operationId: listMyCases
      x-ticvai-consumed-by:
        - "P01 WEB-034 Lost & Found"
        - "P02 GST-034 Lost & Found"
        - "P02 GST-040 Help & Support"
        - "P08 BO-804 Case Command Center"
        - "P08 BO-813 Case Analytics & Audit"
      summary: The cases this guest raised
      description: '24 August. **No case operation was guest-callable** — `createCase`, `getCase` and
        `addCaseMessage` all carry staff permissions, so a guest could raise nothing and read nothing.

        Found writing F54: `GST-034 Lost & Found` declared exactly one operation and it was `getGuestOrderStatus`
        — **order tracking on a lost-property screen.**

        **Scoped to the caller, not filtered by it.** A guest-facing list that takes a subject parameter
        is a list somebody will call with another subject.

        '
      tags:
      - marketing
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Cases, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
    post:
      operationId: raiseMyCase
      x-ticvai-consumed-by:
        - "P01 WEB-034 Lost & Found"
        - "P02 GST-034 Lost & Found"
        - "P02 GST-035 Feedback & Ratings"
        - "P02 GST-040 Help & Support"
        - "P08 BO-938 Employee Requests & Resource Support"
      summary: Report something — lost property, a complaint, a question
      description: '**Lost and found, a complaint and a query are one object.** That is what lets a single
        queue serve all three, and it is why `GST-034` and `GST-040` are the same mechanism at two entry
        points.

        **Works offline and queues.** A guest with a problem and no signal still has a problem.

        '
      tags:
      - marketing
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - summary
              properties:
                kind:
                  type: string
                  enum:
                  - lostProperty
                  - complaint
                  - question
                  - accessibility
                  - refundRequest
                  - other
                summary:
                  type: string
                detail:
                  type: string
                  nullable: true
                venueId:
                  type: string
                  format: uuid
                  nullable: true
                orderRef:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Raised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
  /my/cases/{caseId}/messages:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: replyToMyCase
      x-ticvai-consumed-by:
        - "P01 WEB-034 Lost & Found"
        - "P02 GST-034 Lost & Found"
        - "P02 GST-040 Help & Support"
      summary: Reply on a case the guest raised
      description: '**Threaded, so the guest sees what was said.** A support model where the venue can
        write and the guest cannot is an email address with extra steps.

        **Refused on a case the caller did not raise**, which is why this is scoped to `/my` rather than
        taking a subject.

        '
      tags:
      - marketing
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
  /guests/match:
    post:
      operationId: matchGuest
      x-ticvai-consumed-by:
        - "P06 EMP-055 Create / Edit Reservation"
        - "P06 EMP-057 Guest Profile & Dining History"
      summary: Is this the same person we already have?
      description: 'Board 4E, 24 August. **A restaurant creates a duplicate guest every time somebody
        books by phone with a different number**, and a CRM that cannot recognise them reports two visits
        as two guests forever.

        **Returns candidates and a score. Never merges.** An automatic merge on a name and a birthday
        joins two families, and the join is far harder to undo than to make.

        **Scores are explained.** *Same mobile* and *similar name, same postcode* are different levels
        of certainty, and a host deciding at a podium needs to see which.

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Candidates, strongest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    subjectId:
                      type: string
                      format: uuid
                    score:
                      type: number
                    matchedOn:
                      type: array
                      items:
                        type: string
  /guests/merge:
    post:
      operationId: mergeGuests
      x-ticvai-consumed-by:
        - "P06 EMP-057 Guest Profile & Dining History"
        - "P08 BO-746 Duplicate Review & Merge"
      summary: Two records, one person
      description: 'Board 4G. **Always a person''s decision, never the platform''s** — `matchGuest` proposes
        and this acts.

        **The losing record is superseded, not deleted.** Orders, entitlements and consents already point
        at it, and a merge that deletes leaves a year of history with a dangling reference. **A merge
        is reversible for thirty days for the same reason.**

        **Consent is the one thing that does not merge.** Two records with different marketing consents
        produce the narrower of the two — **inheriting the more permissive consent is how a merge becomes
        a regulatory finding.**

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-permission-escalated: GUEST_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - keepSubjectId
              - mergeSubjectIds
              properties:
                keepSubjectId:
                  type: string
                  format: uuid
                mergeSubjectIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                reason:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Merged, reversible for thirty days
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /guests/{subjectId}/notes:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: addGuestNote
      summary: What the floor needs to know about this table
      description: 'Board 4G. **Allergy, seating preference, a complaint last visit, a regular''s usual.**
        The package held a profile and no way for a server to write on it.

        **`isAllergy` is separated from every other note kind and it is not cosmetic.** An allergy note
        buried among *likes the window table* is an allergy note nobody reads, and it surfaces on the
        order screen rather than in a profile nobody opens mid-service.

        **Notes are personal data and attributed.** *Difficult guest* with nobody''s name against it is
        a note that should never have been written.

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - text
              properties:
                kind:
                  type: string
                  enum:
                  - allergy
                  - dietary
                  - seatingPreference
                  - occasion
                  - serviceRecovery
                  - vip
                  - general
                text:
                  type: string
                isAllergy:
                  type: boolean
                  default: false
                visibleToServer:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /guests/{subjectId}/preferences:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateGuestPreferences
      x-ticvai-consumed-by:
        - "P01 WEB-020 Profile & Preferences"
        - "P02 GST-066 Privacy & My Data"
        - "P08 BO-740 Family & Guardians"
      summary: The things a regular should not have to say twice
      description: 'Board 4G. **Table, drink, dietary needs, contact channel.** A guest who states an
        allergy on every visit is a guest the venue is not looking after.

        **Distinct from consent.** A preference is what they like; a consent is what they permit — **conflating
        the two means a preference update quietly grants marketing permission.**

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: subject
      x-ticvai-config-scope: subject
      x-ticvai-config-scope-note: '26 August: **`subject` — the guest''s own setting, not the venue''s.**
        It does not inherit dow n the scope tree and an operator cannot override it. `updateGuestPreferences`
        declared `tena nt` and `recordConsent` declared `venue` while both write the same guest profile
        row; **neit her was right, because the value belongs to the person.**

        '
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /invitation-campaigns:
    post:
      operationId: createInvitationCampaign
      summary: A quota-bounded, addressed invitation
      description: 'BL-150 and CF-74''s issuance half. **A campaign broadcasts; an invitation is addressed
        and expects a response.**

        **`quota` is places and `overInvitePercent` is invitations** — a press night invites 150 for 100
        seats because 60% come, and a system that refuses the 101st makes the venue do that arithmetic
        by hand.

        '
      tags:
      - marketing
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCampaign'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCampaign'
  /invitations/{token}/respond:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: respondToInvitation
      x-ticvai-consumed-by:
        - "P01 WEB-017 My Account Dashboard"
        - "P02 GST-072 Share & Group Booking"
      summary: Accept or decline
      description: '**The token is single-use.** An invitation link forwarded to a group chat is the failure
        mode, and a token that survives its first use ends up there.

        **Accepting issues the entitlement**, which is why this is not a marketing operation with a follow-up.

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      - public
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - response
              properties:
                response:
                  type: string
                  enum:
                  - accept
                  - decline
                plusOnes:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
  /privacy-incidents:
    post:
      operationId: recordPrivacyIncident
      x-ticvai-consumed-by:
        - "P08 BO-752 Privacy & AI Governance"
      summary: Log a personal-data breach and start the clock
      description: 'BL-176. **UAE PDPL gives 72 hours from discovery**, and nothing recorded one.

        **`discoveredAt` starts the clock, not `occurredAt`** — and a discovery nobody recorded is a deadline
        nobody is counting.

        **A decision not to notify is recorded with its reason.** Deciding a breach is not notifiable
        is legitimate; an undocumented decision is indistinguishable from having missed it.

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyIncident'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyIncident'
  /forms:
    post:
      operationId: createForm
      x-ticvai-consumed-by:
        - "P08 BO-618 Accreditation Form Builder"
        - "P08 BO-815 Survey Builder"
        - "P08 BO-817 NPS, CSAT & CES Configuration"
        - "P08 BO-838 Content, Media & Forms"
      summary: Define a waiver, survey or capture form
      description: 'CF-129. **One mechanism, three uses.** A waiver is this with a signature, a survey
        is this with a scale, a capture is this at the point of sale.

        Published as a version. **A change creates a new version and the old one stays readable forever**
        — 2.15.13 requires the exact accepted version retained.

        '
      tags:
      - marketing
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormDefinition'
      responses:
        '201':
          description: Created as a draft version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
  /form-submissions:
    post:
      operationId: submitForm
      summary: Sign a waiver, answer a survey, capture details
      description: '**Bound to the version accepted, not to the form.** A submission pointing at a form
        that has since changed is a submission proving nothing.

        **A guardian may sign for a minor** — `onBehalfOfSubjectId` names them, because an unsigned or
        self-signed minor waiver is worth nothing at the moment it matters.

        Where the form has an expiry, a live acceptance means **a returning participant does not sign
        again.**

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormSubmission'
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSubmission'
  /guests/{subjectId}/waiver-status:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getWaiverStatus
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-067 Refunds & Resale"
        - "P08 BO-852 Documents, Search & Retention"
      summary: Whether this guest may be issued a ticket that requires a waiver
      description: '2.15.9. **Ticket issuance is conditional on waiver acceptance**, which puts this in
        the purchase path rather than beside it — and means it must answer fast and offline.

        **Returns which waiver is missing, not just that one is.** A guest at a counter told *"you need
        to sign something"* is a guest asking which, and the operator should not have to guess.

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      - device
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: productId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSatisfied:
                    type: boolean
                  missingFormIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  expiringWithinDays:
                    type: integer
                    nullable: true
  /guest-documents:
    post:
      operationId: uploadGuestDocument
      x-ticvai-consumed-by:
        - "P01 WEB-011 Guest Details & Attendee Forms"
        - "P02 GST-066 Privacy & My Data"
        - "P08 BO-743 AI Guest Intelligence"
      summary: Store a guest photo, ID or signed document
      description: 'BL-133. **Deliberately not `assets`.** A guest''s passport scan is not a marketing
        asset — it has a different retention clock, a different access rule and a different reason to
        exist, and **one careless query against a shared store returns both.**

        `retainUntil` is required. **A guest document with no deletion date is a guest document kept forever.**

        '
      tags:
      - marketing
      x-ticvai-permission: GUEST_VIEW_PII
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestDocument'
      responses:
