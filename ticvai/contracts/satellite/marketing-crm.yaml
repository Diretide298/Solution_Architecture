      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: handoverToAgent
      x-ticvai-consumed-by:
        - "P01 WEB-044 AI Concierge – Home"
        - "P02 GST-031 AI Concierge – Home"
        - "P02 GST-032 AI Concierge – Chat"
        - "P05 KSK-015 Assistant"
        - "P08 BO-799 Agent Workspace"
      x-ticvai-audience:
      - guest
      summary: Pass an assistant conversation to a person
      description: '22.8.5. **The requirement that turns the concierge into a support channel** — somebody
        has to be on the other end.

        **The whole thread goes with it, and the guest does not repeat themselves.** A handover that loses
        context is worse than no assistant at all, because the guest has already spent the effort once.

        Triggered by the guest asking, by the assistant refusing or failing, by sentiment (22.8.16), or
        by a capability outside `guestCapabilityScope` — **an assistant bounded to ticket selection and
        checkout will meet questions it may not answer, and this is where those go.**

        **Where no agent is available it says so** and offers a case instead. Queuing a guest for a person
        who is not there is the failure this operation exists to avoid.

        '
      tags:
