    InvitationCampaign:
      type: object
      x-ticvai-persistence: marketing.invitation_campaign
      description: 'BL-150. **An invitation is not a campaign and not a comp**, and CF-74''s issuance
        half needed it too.

        A campaign broadcasts; an invitation is addressed, quota-bounded and expects a response. **A press
        night, a sponsor allocation, a members'' preview** — all three need to know who was asked, who
        accepted, and how many places are left.

        '
      required:
      - id
      - name
      - quota
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        eventId:
          type: string
          format: uuid
          nullable: true
        productId:
          type: string
          format: uuid
          nullable: true
        quota:
          type: integer
          description: '**Places held, not invitations sent.** Over-inviting against a known acceptance
            rate is normal and deliberate; **over-issuing against the quota is not**, and the two must
            not be the same number.

            '
        overInvitePercent:
          type: number
          default: 0
          description: 'How many more may be invited than there are places. **A press night invites 150
            for 100 seats because 60% come**, and a system that refuses the 101st invitation makes the
            venue do that arithmetic by hand.

            '
        issuedCount:
          type: integer
          readOnly: true
        acceptedCount:
          type: integer
          readOnly: true
        respondByAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - draft
          - open
          - closed
          - cancelled
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
