  /conversations:
    get:
      operationId: listConversations
      x-ticvai-consumed-by:
        - "P08 BO-794 Omnichannel Command Center"
        - "P08 BO-795 Unified Inbox"
        - "P12 SUP-002 Agent Dashboard"
        - "P12 SUP-004 Conversation Queue"
        - "P12 SUP-008 Agent Performance & SLA View"
      x-ticvai-audience:
      - staff
      summary: The omnichannel inbox
      description: '22.8.1. WhatsApp, web chat, in-app, email and SMS in one queue.

        **A conversation is not a case.** A case is a ticket — created, assigned, resolved, closed, measured
        in hours. A conversation is a live session with somebody waiting, and its service level is measured
        in seconds. The support screens were wired to `listCases` until 17 August, which made every message
        a case update and left the queue, the routing and the agent state with nowhere to live.

        A conversation may *create* a case (22.8.12). It is not one.

