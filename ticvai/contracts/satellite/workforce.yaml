          - missingExternally
          - venueChangedExternally
          - certificationExpired
          - terminatedExternally
          - fieldDisagreement
        employeeId:
          type: string
          format: uuid
          nullable: true
        externalReference:
          type: string
          maxLength: 200
          nullable: true
        detail:
          type: string
          maxLength: 1000
          nullable: true
        affectedAssignmentIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [open, retried, reprocessed, escalated, resolved, ignored]
        raisedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
          nullable: true
