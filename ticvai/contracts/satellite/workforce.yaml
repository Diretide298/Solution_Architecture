openapi: 3.1.0
info:
  title: TICVAI — Workforce
  version: 1.0.0
  x-ticvai-screen-count: 46
  x-ticvai-module: "18 — Employee Mobile App & AI Assistant (workforce)"
  x-ticvai-platforms:
    - P06 Venue Staff App
    - P08 Venue Management
  # Derived from screens/*.yaml on 18 August — every platform with a screen that calls an
  # operation in this contract. **Six contracts declared none**, which the viewer reports as
  # missing taxonomy and no package checker tested for.
  x-ticvai-tier: satellite
  description: >
    **Rota, attendance and announcements.** The three things the employee app needs that no
    contract owned.

    CF-71 called this "a task has no contract", and reading the fifty requirements showed the
    premise was half wrong: **18.2.x is Work Order Inbox, Accept, Reject, Start, Pause,
    Complete and Close** — a task in the employee app *is* a work order, and the fix there was
    seven lifecycle operations on `maintenance`, not a new Task object. Building one would have
    given a venue two inboxes for one job.

    What genuinely had no home is here.

    ## Rota is not a shift

    `orders.pos_shift` is a cash-handling session — a drawer opened, counted and closed, tied to a
    workstation. **A rota assignment is a person expected somewhere at a time**, and most of
    the people on a rota never touch a till.

    Conflating them is how a lifeguard becomes uncountable. The two link where they overlap: a
    cashier's assignment names the workstation their shift will open on.

    ## Attendance is not the rota either

    The rota says who *should* be there. Attendance says who *was*. **The gap between them is
    the entire operational value** — a venue with only the rota believes it is fully staffed
    every day.

    ## Dates are local

    **Every `format: date` parameter here is a calendar day in the Region's time zone**
    (`RegionSettings.timeZone`, which every venue inherits and cannot override), running from
    local midnight to local midnight. Not UTC: in the Gulf a UTC day starts at four in the
    morning, and a rota read by UTC days moves the night shift onto the wrong date. Instants
    (`startsAt`, `occurredAt`) stay `date-time` in UTC, as everywhere else.

    ## Deliberately not here

    **Payroll.** Attendance produces hours; what they are worth is a finance system's problem
    and almost certainly an existing one. This contract records the hours; it does not calculate
    pay, and it has **no export operation** — neither of hours nor of the rota.

    **Leave and absence approval.** Requests route through `approvals`, which already has
    delegation, escalation and segregation of duties. A second approval mechanism here would be
    the fifth one this platform has already collapsed.
  contact:
    name: TICVAI Platform
servers:
  - url: https://api.{region}.ticvai.com/workforce/v1
    variables:
      region:
        default: ae
security:
  - bearerAuth: []
tags:
  - name: rota
    description: Who is expected where, and when
  - name: attendance
    description: Who actually turned up
  - name: announcements
    description: Telling staff something
x-ticvai-queries:
  # Queries other modules ask this module (ADR-0055 amendment, 14 October 2026): module, inputs, returns, rule, served.
  # **Data reads other modules ask this module for** (MOD audit, 14 October 2026, CHG-MOD-001): one query per
  # table, instead of a raw read of it (check-cross-module-reads XR-UNCOVERED; ADR-0055 rule 2, amended
  # 14 October).
  employeeRecords:
    module: workforce
    table: workforce.employee
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The workforce.employee rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Tenancy stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/WorkforceEmployee'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Tenancy answers with its workforce.employee rows, as it stores them and as the caller's scope
      lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Tenancy implements.
    served: [in-process]
  shiftRecords:
    module: workforce
    table: workforce.shift
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The workforce.shift rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Tenancy stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/WorkforceShift'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Tenancy answers with its workforce.shift rows, as it stores them and as the caller's scope lets
      it see them (the table's row-level security, under the caller's connection and transaction). It decides
      nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and a
      question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked from
      another deployable through Tenancy's service route (serviceAuth).
    served: [service]
  workAssignmentRecords:
    module: workforce
    table: workforce.work_assignment
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The workforce.work_assignment rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Tenancy stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/WorkforceWorkAssignment'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Tenancy answers with its workforce.work_assignment rows, as it stores them and as the caller's
      scope lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Tenancy implements.
    served: [in-process]
  # **Whether a person is already rostered at that time anywhere, as a yes or no** (ADAM CR-336, option B, decided 29
  # October 2026; CHG-CR336-001). workforce.rota_assignment is under venue row security, so the overlap check of
  # createRotaAssignment and updateRotaAssignment saw only the caller's venue and a person could be booked at two
  # venues at once.
  principalHasOverlappingAssignment:
    module: workforce
    table: workforce.rota_assignment
    inputs:
      principalId: {type: string, format: uuid, description: 'The person rostered (RotaAssignment.principalId).'}
      startsAt: {type: string, format: date-time, description: 'Start of the assignment as it would stand (RotaAssignment.startsAt).'}
      endsAt: {type: string, format: date-time, description: 'End of the assignment as it would stand (RotaAssignment.endsAt).'}
      exceptAssignmentId: {type: string, format: uuid, nullable: true, description: 'The assignment being moved, which is not counted against itself (updateRotaAssignment); null on a create.'}
    returns:
      type: object
      required: [overlaps]
      properties:
        overlaps: {type: boolean, description: 'True when the person holds another assignment overlapping the times asked, at any venue of the tenant. Which assignment, at which venue and when are never returned.'}
    rule: >-
      A rule question (ADAM CR-336, option B; Chinmay, 29 October 2026: "All as recommended"). True when a
      workforce.rota_assignment row other than exceptAssignmentId has principal_id = principalId, a status other
      than `cancelled`, and times that overlap the asked ones (starts_at < endsAt and ends_at > startsAt; an
      assignment that ends when the next begins does not overlap), at any venue of the tenant. Workforce answers
      it with one statement under the routed tenant's root grant (ITenantRootGrant), so the person's assignments
      at venues outside the caller's scope are seen, and returns only `overlaps`; the caller's own grant is in
      force again for every other statement of its transaction, so no row, venue or time of another venue's rota
      reaches the caller. It is asked in process by createRotaAssignment and updateRotaAssignment, which refuse
      409 rota-assignment-overlap when it is true; the exclusion constraint on RotaAssignment
      (x-ticvai-exclude) holds the same rule when two writes race.
    served: [in-process]
paths:
  /rota-assignments:
    get:
      operationId: listRotaAssignments
      x-ticvai-consumed-by:
        - "P04 POS-009 Staff Roster"
        - "P06 EMP-021 Roster"
        - "P06 EMP-022 My rota"
        - "P06 EMP-023 Swap request"
        - "P08 BO-055 Rota & Scheduling"
        - "P08 BO-712 Staff & Role Assignment Configuration"
        - "P08 BO-714 Event Shift & Roster Configuration"
        - "P08 BO-883 Workforce Roster Command Center"
        - "P08 BO-884 Attraction & Operational Staffing Roster"
      x-ticvai-read-via:
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      x-ticvai-audience: [staff]
      summary: The rota
      description: >
        18.9.2. A supervisor sees the venue; a steward sees themselves. **The same operation,
        scoped by permission** — a steward without `WORKFORCE_VIEW` gets their own assignments
        and no one else's, which is what `EMP-022 My rota` renders.

        **Order.** Soonest first, by `startsAt` ascending, then by `id`.

        **Statuses.** Every `status` is returned, ended ones included (`cancelled`); a screen that shows only live rows filters on `status` itself.
      tags: [rota]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - name: from
          in: query
          description: First calendar day, in the Region's time zone, not UTC.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last calendar day, in the Region's time zone, not UTC.
          schema: { type: string, format: date }
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RotaAssignment' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

    post:
      operationId: createRotaAssignment
      x-ticvai-consumed-by:
        - "P08 BO-055 Rota & Scheduling"
        - "P08 BO-714 Event Shift & Roster Configuration"
      x-ticvai-read-via:
      - query: identity#principalHoldsRoleAtVenue
        route: in-process
        for: 'whether the person holds the required role at the venue or above it, as a yes or no answered under the
          tenant root grant, so a role granted above the caller''s scope is found (ADAM CR-336, option B;
          CHG-CR336-001): identity.delegated_access, Identity''s data'
      - query: workforce#principalHasOverlappingAssignment
        route: in-process
        for: 'whether the person already holds an overlapping assignment at any venue, as a yes or no answered under
          the tenant root grant, so no other venue''s rota reaches the caller (ADAM CR-336, option B; CHG-CR336-001)'
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      x-ticvai-reads:
      - table: workforce.staffing_rules
        for: 'the venue''s working-hour limits (maximum hours per day, per rolling 7 days, minimum rest between
          shifts) the assignment is measured against for breachesWorkingHourLimit (ADAM CR-334, option A; CHG-CR334-001)'
      x-ticvai-audience: [staff]
      summary: Put someone on the rota
      description: >
        Refused where the person already has an overlapping assignment, or lacks the role the
        position requires. **A rota that lets one person be in two places is a rota that gets
        ignored.**

        **Both checks look beyond the caller's venue, as a yes or no** (ADAM CR-336, option B, decided 29
        October 2026). The overlap is asked of `workforce#principalHasOverlappingAssignment`: any other
        assignment of the person, at any venue of the tenant, that is not `cancelled` and overlaps the new
        one's times (`409 rota-assignment-overlap`). The role is asked of
        `identity#principalHoldsRoleAtVenue`: a live grant of `requiredRoleId` to the person at the venue or
        at a scope above it, a tenant-root grant included (`409 person-lacks-required-role`; no check when
        `requiredRoleId` is null). Each is answered under the tenant root grant and returns only true or
        false, so the caller learns nothing of another venue's rota or of where a role was granted. **The
        overlap also holds under races**: the exclusion constraint on `workforce.rota_assignment` (one
        person, overlapping times, not `cancelled`; RotaAssignment `x-ticvai-exclude`) refuses the second of
        two writes that pass the check at the same moment, and that refusal is the same `409
        rota-assignment-overlap`.

        **The working-hour limit is flagged, not refused** (ADAM CR-334, option A, decided 29 October 2026):
        the venue's `workforce.staffing_rules` row is read and `breachesWorkingHourLimit` is set as that field
        says. The assignment is stored either way.

        Where the position needs a till, the assignment names the workstation their shift will
        open on — the link between a rota and a cash session, without merging the two.
      tags: [rota]
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotaAssignment' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotaAssignment' }
        '409':
          x-ticvai-problem-types: [rota-assignment-overlap, person-lacks-required-role]
          description: >
            Overlaps another assignment of the person at any venue of the tenant, or the person lacks the
            required role at the venue or above it (ADAM CR-336). The problem says which, and nothing of the
            other assignment or of where a role is held.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /guest-broadcast:
    post:
      operationId: broadcastToGuests
      x-ticvai-read-via:
      - query: access#entitlementRecords
        route: service
        for: 'its read of access.entitlement, Access''s data (CHG-MOD-001)'
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      - query: marketing-crm#guestProfileRecords
        route: service
        for: 'its read of marketing.guest_profile, Marketing''s data (CHG-MOD-001)'
      - query: venue-map#pointRecords
        route: service
        for: 'its read of venuemap.point, VenueOps''s data (CHG-MOD-001)'
      x-ticvai-write-via:
      - table: marketing.message_dispatch
        operation: sendTransactionalMessage
      summary: Venue-wide notice to every guest on site
      description: >
        BL-020. **`publishAnnouncement` carries an emergency kind and is staff-facing.** A venue-wide
        evacuation notice is not a marketing message and must not ride the marketing path — **consent
        and suppression do not apply to a fire.**

        Reaches every guest with a live entitlement at this venue, by every channel they have.
        **Bypasses quiet hours, journey throttling and channel preference**, which is the entire
        reason it is a separate operation rather than a campaign with a flag.

        **Requires two principals for `evacuation`.** A venue-wide alarm sent in error empties a
        park and it is not recallable.

        **`evacuation` requires `ANNOUNCEMENT_EMERGENCY`** (decided 28 September, audit R091 (1) and
        R197): any other kind needs `ANNOUNCEMENT_PUBLISH`, and an evacuation sent by a caller
        without `ANNOUNCEMENT_EMERGENCY` at this venue is a `403`. The escalation is by kind, not by
        a value threshold.
      tags: [workforce]
      x-ticvai-permission: ANNOUNCEMENT_PUBLISH
      x-ticvai-permission-escalated: ANNOUNCEMENT_EMERGENCY
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, message]
              properties:
                kind: { type: string, enum: [evacuation, weather, rideClosure, lostChild, operational, allClear] }
                message: { type: string, maxLength: 300 }
                messageLocalised:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    **Every enabled language, and a missing one is sent in the default rather than
                    withheld.** A guest who cannot read the notice is better served than a guest who
                    never receives it.
                assemblyPointIds:
                  type: array
                  description: >
                    For an evacuation. **The map resolves them to the nearest one per guest** where
                    the venue is georeferenced — a single assembly point named in text sends
                    everybody the same direction regardless of where they are standing.
                  items: { type: string, format: uuid }
                secondPrincipalId: { type: string, format: uuid, nullable: true }
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Broadcasting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestBroadcastAccepted'
        '403':
          description: >
            The caller lacks `ANNOUNCEMENT_PUBLISH` at this venue, or sent `kind` `evacuation`
            without `ANNOUNCEMENT_EMERGENCY` (problem type `emergency-permission-required`, audit
            R091 (1)).
          x-ticvai-problem-types:
            - forbidden
            - emergency-permission-required
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /rota-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRotaAssignment
      x-ticvai-consumed-by:
        - "P08 BO-055 Rota & Scheduling"
      x-ticvai-read-via:
      - query: identity#principalHoldsRoleAtVenue
        route: in-process
        for: 'whether the person holds the required role at the venue or above it after a move, as a yes or no under
          the tenant root grant, as createRotaAssignment asks it (ADAM CR-315, CR-336 option B; CHG-CR336-001):
          identity.delegated_access, Identity''s data'
      - query: workforce#principalHasOverlappingAssignment
        route: in-process
        for: 'whether the person holds another overlapping assignment at any venue after a move, this one left out
          (exceptAssignmentId), as createRotaAssignment asks it (ADAM CR-315, CR-336 option B; CHG-CR336-001)'
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001), as createRotaAssignment reads it (ADAM CR-315)'
      x-ticvai-reads:
      - table: workforce.staffing_rules
        for: 'the venue''s working-hour limits, read again after a move to set breachesWorkingHourLimit as
          createRotaAssignment does (ADAM CR-334, option A; CHG-CR334-001)'
      x-ticvai-audience: [staff]
      summary: Move or cancel an assignment
      description: >
        **A move is checked as a new assignment is** (ADAM CR-315, option A). Whenever the PATCH changes
        `principalId`, `venueId`, `startsAt`, `endsAt` or `requiredRoleId`, the assignment as it would stand
        is checked against the same two rules `createRotaAssignment` applies, asked of the same two queries
        (ADAM CR-336, option B): the person has no other assignment overlapping it at any venue of the
        tenant (`workforce#principalHasOverlappingAssignment` with this assignment as `exceptAssignmentId`;
        `409 rota-assignment-overlap`, which the exclusion constraint also gives under races), and the person
        holds the required role at the venue or above it (`identity#principalHoldsRoleAtVenue`; `409
        person-lacks-required-role`). Each answers only true or false. So a move cannot do what a create is
        refused. An assignment outside the caller's scope is the shared `404`.


        **The working-hour flag is set again on a move** (ADAM CR-334, option A): whenever the PATCH changes
        `principalId`, `venueId`, `startsAt`, `endsAt` or `breakMinutes`, `breachesWorkingHourLimit` is worked
        out as on create, from the venue's `workforce.staffing_rules`.


        **The status moves a PATCH may make** are the ones the state model gives this operation
        (states/rota-assignment.yaml): `planned` to `published` (the assignment becomes visible to the person
        rostered) or to `cancelled`; `published` to `confirmed` (the person acknowledged it) or to
        `cancelled`; and `swapPending` to `cancelled` (the swap was approved and a new assignment replaces
        this one). Any other `status` is refused with `409 rota-status-move-not-allowed`.
      tags: [rota]
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRotaAssignmentRequest' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotaAssignment' }
        '404':
          $ref: '../shared/common.yaml#/components/responses/NotFound'
        '409':
          x-ticvai-problem-types: [rota-assignment-overlap, person-lacks-required-role, rota-status-move-not-allowed]
          description: >
            Refused, and nothing changes (ADAM CR-315). `rota-assignment-overlap`: after the change the person
            would hold another assignment overlapping this one, at any venue of the tenant (ADAM CR-336).
            `person-lacks-required-role`: after the change the person lacks the required role at the venue or
            above it (ADAM CR-336). Both are checked, as on create, whenever the
            PATCH changes the person, the venue, the times or the required role.
            `rota-status-move-not-allowed`: the `status` sent is not a move the state model makes from the
            assignment's current status, or the assignment is already `cancelled`, `completed` or `noShow`.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /rota-assignments/{assignmentId}/swap:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestShiftSwap
      x-ticvai-consumed-by:
        - "P06 EMP-021 Roster"
        - "P06 EMP-022 My rota"
        - "P06 EMP-023 Swap request"
        - "P08 BO-055 Rota & Scheduling"
        - "P08 BO-939 Shift Change, Swap, Pickup & Release"
      x-ticvai-read-via:
      - query: identity#principalRecords
        route: in-process
        for: 'its read of identity.principal, Identity''s data (CHG-MOD-001)'
      x-ticvai-audience: [staff]
      summary: Ask someone to take your shift
      description: |-
        `EMP-023`. **Routes through `approvals`** rather than implementing its own — the supervisor approving a swap is the same mechanism as the one approving a refund, with the same audit trail and the same rule that a requester cannot approve themselves.
        Both parties must accept before the supervisor sees it. A swap approved against someone who never agreed is a gap in the rota nobody notices until the shift starts.
        **Who may swap with whom** (decided 28 September, audit R129 (6)): only two people holding the same role at the same venue. `toPrincipalId` must hold the assignment's `requiredRoleId` (or, where that is null, the requester's role for the assignment) at the assignment's venue; otherwise a `409` names which condition failed. **Every swap needs a supervisor's approval before it takes effect**: the request moves the rota assignment to `swapPending`, and the assignment changes hands only when the approval request is granted.

        **The approval request it raises** (4 October 2026, CHG-FXC-008): `approvals.createApprovalRequest` with kind
        `configurationChange`, `subjectType` `shiftSwap`, `subjectContract` `workforce` and `subjectId` the ShiftSwap's id,
