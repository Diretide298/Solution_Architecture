    RotaStatus:
      type: string
      enum: [planned, published, confirmed, swapPending, cancelled, completed, noShow]

    RotaAssignment:
      type: object
      x-ticvai-persistence: "workforce.rota_assignment"
      # **One person is never on two overlapping assignments, whatever venue and however two writes race** (ADAM
      # CR-336, option B, decided 29 October 2026; CHG-CR336-001): an exclusion constraint over principal_id and the
      # half-open range [starts_at, ends_at), for every row that is not cancelled. A constraint is not under row
      # security, so it sees every venue's rows; createRotaAssignment and updateRotaAssignment answer its violation
      # 409 rota-assignment-overlap. tools/derive-ddl.py writes it (EXCLUDE USING gist, btree_gist).
      x-ticvai-exclude:
      - equal: [principalId]
        during: [startsAt, endsAt]
        unless: {status: cancelled}
      required: [principalId, venueId, startsAt, endsAt, position]
      properties:
        overtimeMinutes:
          type: integer
          nullable: true
          readOnly: true
          description: >
            BL-044, 1.2.83. **UAE labour law limits working hours and mandates rest periods**, and
            nothing in the package counted either. Derived from attendance against the shift.
        restPeriodBefore:
          type: integer
          nullable: true
          description: >
            Minutes since the previous shift ended. **The check that stops a closing shift followed
            by an opening one**, which is legal in most places and unsafe in all of them.
        breachesWorkingHourLimit:
          type: boolean
          default: false
          readOnly: true
          description: >
            **Flagged at assignment, not discovered at payroll.** A rota that breaches a statutory
            limit is a rota somebody has to redo, and finding out a month later means it was worked.


            **The limit is the venue's working-hour rule** (ADAM CR-334, option A, decided 29 October
            2026): the `workforce.staffing_rules` row of the assignment's venue, read by
            `createRotaAssignment` and, after a move, by `updateRotaAssignment`. True when the person's
            assignments at that venue that are not `cancelled`, this one included, exceed any of its three
            limits: more
            than `maximumHoursPerDay` hours on one calendar day in the venue's time zone; more than
            `maximumHoursPerWeek` hours in any 7 consecutive days (a rolling window, not a calendar week)
            that include this assignment; or less than `minimumRestHours` between this assignment and the
            person's assignment just before or just after it. An assignment's hours are `endsAt` minus
            `startsAt`, less `breakMinutes`. A limit the venue has not set (null), or a venue with no
            staffing rules, is not checked, and the flag is false. Flagged, never refused: the assignment
            is stored and the manager sees the flag. The flag is this assignment's, set when it is written;
            the person's other assignments keep the flag they were written with.
        labourCost:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            **Cost at the point of scheduling.** A manager building a rota without seeing its cost is
            a manager who finds out from finance.
        id: { type: string, format: uuid, readOnly: true }
        principalId: { type: string, format: uuid }
        displayName: { type: string, readOnly: true }
        venueId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        position:
          type: string
          description: >
            What they are rostered to do — gate steward, cashier, lifeguard, technician. **Most
            positions never touch a till**, which is why a rota assignment is not a shift.

            **A position code, not a label.** It is the same value as
            `StaffingRules.minimumCover[].positionCode`, `OpenShift.positionCode` and
            `StaffingCoverage.positionCode`: coverage counts rostered people per position, so an
            assignment spelled differently from the rule it fills is counted against nothing and
            the gap stays open. Tenant-defined, which is why it is not an enum here.
        requiredRoleId:
          type: string
          format: uuid
          nullable: true
          description: Checked on assignment. A rota naming someone unqualified is a rota that gets overridden.
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the position needs a till. **The link between a rota and a cash session**,
            without merging the two.
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/RotaStatus' }
        breakMinutes: { type: integer, nullable: true }
        note: { type: string, nullable: true }
    UpdateRotaAssignmentRequest:
      type: object
      x-ticvai-persistence: none — request only; a partial update of workforce.rota_assignment
      description: '**A partial update of RotaAssignment** (the CR-089 pattern; CHG-SHP-008): `updateRotaAssignment` sends only what changes, and a field left out keeps its stored value. Nothing is required and nothing has a default, so a generated client never resends a value it did not mean to change. The server''s own fields (breachesWorkingHourLimit, displayName, id, overtimeMinutes) are not sendable.'
      minProperties: 1
      properties:
        restPeriodBefore:
          type: integer
          nullable: true
          description: >
            Minutes since the previous shift ended. **The check that stops a closing shift followed
            by an opening one**, which is legal in most places and unsafe in all of them.
        labourCost:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            **Cost at the point of scheduling.** A manager building a rota without seeing its cost is
            a manager who finds out from finance.
        principalId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        position:
          type: string
          description: >
            What they are rostered to do — gate steward, cashier, lifeguard, technician. **Most
            positions never touch a till**, which is why a rota assignment is not a shift.

            **A position code, not a label.** It is the same value as
            `StaffingRules.minimumCover[].positionCode`, `OpenShift.positionCode` and
            `StaffingCoverage.positionCode`: coverage counts rostered people per position, so an
            assignment spelled differently from the rule it fills is counted against nothing and
            the gap stays open. Tenant-defined, which is why it is not an enum here.
        requiredRoleId:
          type: string
          format: uuid
          nullable: true
          description: Checked on assignment. A rota naming someone unqualified is a rota that gets overridden.
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the position needs a till. **The link between a rota and a cash session**,
            without merging the two.
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/RotaStatus' }
        breakMinutes: { type: integer, nullable: true }
        note: { type: string, nullable: true }

