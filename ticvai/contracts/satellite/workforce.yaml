          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StaffingCoverage'
        approvalRequestId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
    LabourCostRow:
      type: object
      description: 'Resource board 4.9. **Rostered and actual diverge every day.**'
      properties:
        key:
          type: string
        label:
          type: string
        rosteredHours:
          type: number
        actualHours:
          type: number
        overtimeHours:
          type: number
        rosteredCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        actualCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        budget:
          $ref: ../shared/common.yaml#/components/schemas/Money
        variance:
          $ref: ../shared/common.yaml#/components/schemas/Money
        variancePercent:
          type: number
        headcount:
          type: integer
    WorkforceComplianceFinding:
      type: object
      description: 'Resource board 4.8. **Checked before the rota is published, not in an inspection.**'
      properties:
        code:
          type: string
          enum:
          - expiredQualification
          - missingQualification
          - exceededDailyHours
          - exceededWeeklyHours
          - insufficientRest
          - missedBreak
          - consecutiveDaysExceeded
          - underAgeNightShift
          - belowMinimumCover
        severity:
          type: string
          enum:
          - breach
          - warning
        principalId:
          type: string
          format: uuid
          nullable: true
        principalName:
          type: string
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        detail:
          type: string
        rotaAssignmentIds:
          type: array
          items:
            type: string
            format: uuid
    OpenShift:
      type: object
      x-ticvai-persistence: workforce.open_shift
      description: 'Resource board 4.6. **How a gap gets filled at nine on a Friday without a manager
        ringing round.**

        '
      properties:
        id:
          type: string
          format: uuid
        rotaAssignmentId:
          type: string
          format: uuid
          nullable: true
        shiftTemplateId:
          type: string
          format: uuid
          nullable: true
        venueId:
          type: string
          format: uuid
        positionCode:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        releasedBy:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        requiredQualifications:
          type: array
          items:
            type: string
        eligiblePrincipalCount:
          type: integer
          readOnly: true
        incentiveRateMultiplier:
          type: number
          nullable: true
        status:
          type: string
          enum:
          - open
          - claimed
          - pendingApproval
          - filled
          - expired
          - withdrawn
        claimedBy:
          type: string
          format: uuid
          nullable: true
        claimedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
    TrainingRecord:
      type: object
      x-ticvai-persistence: workforce.training_record
      description: '**Drafted 4 September.** One person, one course, one outcome. **The field that
        matters is the expiry** - a lapsed food-safety or first-aid certificate is a person who
        may not work a station, and a list without it is a list nobody can roster from.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        courseName:
          type: string
        required:
          type: boolean
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - notStarted
          - inProgress
          - passed
          - failed
          - expired
        evidenceRef:
          type: string
    RotaStatus:
      type: string
      enum: [planned, published, confirmed, swapPending, cancelled, completed, noShow]

    RotaAssignment:
      type: object
      x-ticvai-persistence: "workforce.rota_assignment"
      required: [principalId, venueId, startsAt, endsAt, position]
      properties:
        overtimeMinutes:
          type: integer
          nullable: true
          readOnly: true
          description: >
            BL-044, 1.2.83. **UAE labour law limits working hours and mandates rest periods**, and
            nothing in the package counted either. Derived from attendance against the shift.
        restPeriodBefore:
          type: integer
          nullable: true
          description: >
            Minutes since the previous shift ended. **The check that stops a closing shift followed
            by an opening one**, which is legal in most places and unsafe in all of them.
        breachesWorkingHourLimit:
          type: boolean
          default: false
          readOnly: true
          description: >
            **Flagged at assignment, not discovered at payroll.** A rota that breaches a statutory
            limit is a rota somebody has to redo, and finding out a month later means it was worked.
        labourCost:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            **Cost at the point of scheduling.** A manager building a rota without seeing its cost is
            a manager who finds out from finance.
        id: { type: string, format: uuid, readOnly: true }
        principalId: { type: string, format: uuid }
        displayName: { type: string, readOnly: true }
        venueId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        position:
          type: string
          description: >
            What they are rostered to do — gate steward, cashier, lifeguard, technician. **Most
            positions never touch a till**, which is why a rota assignment is not a shift.
        requiredRoleId:
          type: string
          format: uuid
          nullable: true
          description: Checked on assignment. A rota naming someone unqualified is a rota that gets overridden.
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where the position needs a till. **The link between a rota and a cash session**,
            without merging the two.
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/RotaStatus' }
        breakMinutes: { type: integer, nullable: true }
        note: { type: string, nullable: true }

    ShiftSwap:
      type: object
      x-ticvai-persistence: "workforce.shift_swap"
      required: [id, assignmentId, fromPrincipalId, toPrincipalId, status]
      properties:
        id: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        fromPrincipalId: { type: string, format: uuid }
        toPrincipalId: { type: string, format: uuid }
        status:
          type: string
          enum: [awaitingPeer, awaitingApproval, approved, rejected, withdrawn]
          description: >
            **Both parties before the supervisor.** A swap approved against someone who never
            agreed is a gap in the rota nobody notices until the shift starts.
        approvalRequestId:
          type: string
          nullable: true
          description: Routed through `approvals` rather than a second mechanism here.
        reason: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }

    AttendanceRecord:
      type: object
      x-ticvai-persistence: "workforce.attendance"
      required: [id, principalId, kind, occurredAt]
      properties:
        id: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid, nullable: true }
        venueId: { type: string, format: uuid }
        kind: { type: string, enum: [clockIn, clockOut, breakStart, breakEnd] }
        occurredAt:
          type: string
          format: date-time
          description: Device time — when it happened.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the server received it. **Both are kept**: a steward clocking in offline at a
            gate is not late because the sync was.
        accessPointId: { type: string, format: uuid, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        isAmended: { type: boolean, readOnly: true }
        amendedByPrincipalId: { type: string, format: uuid, nullable: true }
        amendmentReason: { type: string, nullable: true }
        originalOccurredAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **The original is never overwritten.** Attendance feeds pay, and a record that can be
            quietly rewritten is not evidence.
        exception:
          type: string
          nullable: true
          enum: [late, earlyLeave, missingClockOut, noShow, outOfGeofence, unscheduled]
          description: Computed against the rota. Null where the record matches what was expected.

    AnnouncementKind:
      type: string
      description: >
        `emergency` is not a louder `operational`. It overrides the home screen, bypasses quiet
        hours, requires acknowledgement, and carries a separate permission.
      enum: [operational, safety, emergency, hr, celebration]

    Announcement:
      type: object
      x-ticvai-persistence: "workforce.announcement"
      required: [title, body, kind, publishedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, maxLength: 140 }
        body: { type: string, maxLength: 4000 }
        kind: { $ref: '#/components/schemas/AnnouncementKind' }
        venueIds:
          type: array
          items: { type: string, format: uuid }
        departmentIds:
          type: array
          items: { type: string, format: uuid }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        requiresAcknowledgement: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        publishedByPrincipalId: { type: string, format: uuid, readOnly: true }
        publishedAt: { type: string, format: date-time }
        locale: { type: string, nullable: true }

    AnnouncementReach:
      type: object
      x-ticvai-persistence: "none — computed from workforce.announcement_receipt"
      properties:
        announcementId: { type: string, format: uuid }
        targeted: { type: integer }
        delivered: { type: integer }
        acknowledged: { type: integer }
        outstanding:
          type: array
          description: >
            **The list that matters.** For an operational notice it measures whether anyone read
            it; during an emergency it is the roll call.
          items:
            type: object
            properties:
              principalId: { type: string, format: uuid }
              displayName: { type: string }
              onShift: { type: boolean }
