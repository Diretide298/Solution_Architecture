          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Coverage and its gaps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffingCoverage'
  /leave-requests:
    get:
      operationId: listLeaveRequests
      x-ticvai-consumed-by:
        - "P08 BO-880 Break, Leave & Absence Configuration"
      summary: Leave, absence and their effect on cover
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequest'
    post:
      operationId: requestLeave
      x-ticvai-consumed-by:
        - "P08 BO-880 Break, Leave & Absence Configuration"
      summary: Ask for time off, against the cover it would cost
      description: 'Resource board 3.8. **Approving leave without seeing the resulting gap is how a
        venue discovers in July that four supervisors booked the same week.**

        The response carries the coverage impact, so the approver sees it before deciding rather than
        after.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequest'
      responses:
        '201':
          description: Requested, with the coverage impact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
  /labour-cost:
    get:
      operationId: getLabourCost
      x-ticvai-consumed-by:
        - "P08 BO-891 Labor Cost & Staffing Budget Control"
      summary: Rostered and actual labour cost against budget
      description: 'Resource board 4.9. **Rostered cost and actual cost diverge every single day**, and
        the difference is overtime, no-shows and cover. A venue that only sees one of them cannot
        explain its payroll.

        Compared against budget per venue, department and period, because that is the granularity a
        general manager is held to.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: groupBy
        in: query
        schema:
          type: string
          enum:
          - venue
          - department
          - role
          - day
          - person
      responses:
        '200':
          description: Cost against budget
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabourCostRow'
  /workforce-compliance:
    get:
      operationId: validateWorkforceCompliance
      x-ticvai-consumed-by:
        - "P08 BO-876 Certification & Expiry Management"
        - "P08 BO-890 Workforce Compliance Validation Center"
      summary: Where the rota breaks a rule
      description: 'Resource board 4.8. **Expired qualifications, exceeded hours, missed breaks,
        under-age rostering and minimum-rest breaches** — checked against the rota before it is
        published rather than discovered in an inspection.

        **A lapsed lifeguard certificate is a safety failure, not a data-quality one**, which is the
        line `resources` already takes on qualifications; this is where it reaches the rota.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Breaches and warnings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkforceComplianceFinding'
  /shift-marketplace:
    get:
      operationId: listOpenShifts
      x-ticvai-consumed-by:
        - "P08 BO-887 Shift Marketplace & Workforce Requests"
      summary: Shifts offered back, and who may take them
      description: 'Resource board 4.6. **`requestShiftSwap` needed a counterparty and there was
        nowhere to find one.** An open-shift marketplace lets somebody release a shift and somebody
        qualified pick it up, which is how a gap gets filled at nine on a Friday night without a
        manager ringing round.

        **Eligibility is enforced, not advisory.** A shift requiring a lifeguard qualification is not
        offered to somebody without one.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      responses:
        '200':
          description: Open shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenShift'
    post:
      operationId: claimOpenShift
      x-ticvai-consumed-by:
        - "P08 BO-887 Shift Marketplace & Workforce Requests"
      summary: Pick up a released shift
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - openShiftId
              properties:
                openShiftId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenShift'
        '409':
          description: Already taken, not eligible, or it would breach a working-hour rule
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WorkforceIntegrationSource:
      type: object
      x-ticvai-persistence: workforce.integration_source
      description: >
        **An external system that masters some of our workforce data.** Board 3 names HRMS,
        Workforce Management, Payroll, Time & Attendance, Identity Management and external
        staffing agencies. The six-state display Board 10 asks for lives on this row: what is
        connected, when it last synchronised, and whether its credentials still work.
      required:
      - code
      - name
      - kind
      - transport
      - status
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 150
        kind:
          type: string
          enum: [hrms, workforceManagement, payroll, timeAndAttendance, identity, staffingAgency]
        transport:
          type: string
          enum: [api, webhook, scheduled, manual, fileImport]
          description: >
            Board 3, Support. **`manual` and `fileImport` are in the list on purpose** — a
            staffing agency that sends a spreadsheet is still a system of record, and modelling
            only the API cases would leave the messiest source unmanaged.
        authenticationStatus:
          type: string
          enum: [healthy, expiring, expired, failed, notConfigured]
        lastSynchronisedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, degraded, suspended]
        scopePath:
          type: string
          nullable: true
    WorkforceFieldOwnership:
      type: object
      x-ticvai-persistence: workforce.field_ownership
      description: >
        **Which system owns a field, which is what prevents conflicting updates.** Board 3:
        *"For every field, administrators shall determine ... External System Master."* Without
        this, an employee record mastered in HRMS and edited here disagrees with its source and
        nothing can say which answer is right.

        One row per table and column. Absent means ours, so nothing has to be enumerated before
        it is decided.
      required:
      - tableName
      - columnName
      - master
      properties:
        id:
          type: string
          format: uuid
        tableName:
          type: string
          maxLength: 120
        columnName:
          type: string
          maxLength: 120
        master:
          type: string
          enum: [ticvai, external]
        sourceId:
          type: string
          format: uuid
          nullable: true
          description: The integration source that masters it, when `master` is `external`.
        onConflict:
          type: string
          enum: [externalWins, ticvaiWins, flagForReview]
        scopePath:
          type: string
          nullable: true
    WorkforceSyncRun:
      type: object
      x-ticvai-persistence: workforce.sync_run
      description: >
        **One synchronisation, and what it did.** Board 10 asks the page to show successful
        records, failed records, warnings and mapping errors rather than *"integration failed"* —
        and to say the operational consequence: *"12 employee availability updates could not be
        synchronised. Four employees have assignments within the next 24 hours."* That sentence
        needs counts on a row, not a log line.
      required:
      - sourceId
      - startedAt
      - status
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [running, succeeded, partial, failed]
        recordsRead:
          type: integer
        recordsApplied:
          type: integer
        recordsFailed:
          type: integer
        warningCount:
          type: integer
        mappingErrorCount:
          type: integer
        trigger:
          type: string
          enum: [scheduled, manual, webhook, fileImport]
        scopePath:
          type: string
          nullable: true
    WorkforceSyncConflict:
      type: object
      x-ticvai-persistence: workforce.sync_conflict
      description: >
        **A disagreement a person has to settle, and the assignments it puts at risk.** Board 3
        lists the cases by name: an employee in HR and not here, a venue changed externally, a
        certification expired, and *"employee terminated externally but has future TICVAI
        assignments"* — where *"the system shall flag affected downstream assignments"*.

        `affectedAssignmentIds` is deliberately an array and deliberately an exception: it is a
        snapshot of what was at risk when the conflict was raised, not a live relationship, and
        it must not change when a roster does.
      required:
      - sourceId
      - kind
      - status
      - raisedAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        syncRunId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - missingInTicvai
          - missingExternally
          - venueChangedExternally
          - certificationExpired
          - terminatedExternally
          - fieldDisagreement
        employeeId:
          type: string
          format: uuid
          nullable: true
        externalReference:
          type: string
          maxLength: 200
          nullable: true
        detail:
          type: string
          maxLength: 1000
          nullable: true
        affectedAssignmentIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [open, retried, reprocessed, escalated, resolved, ignored]
        raisedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
          nullable: true
    WorkforceEmployee:
      type: object
      x-ticvai-persistence: workforce.employee
      description: '**Taken from the backend workbook, 20 September.** Stores the main employee/staff master record.'
      required:
