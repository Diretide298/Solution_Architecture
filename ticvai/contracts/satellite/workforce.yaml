openapi: 3.1.0
info:
  title: TICVAI — Workforce
  version: 1.0.0
  x-ticvai-screen-count: 23
  x-ticvai-module: "18 — Employee Mobile App & AI Assistant (workforce)"
  x-ticvai-platforms:
    - P06 Venue Staff App
    - P08 Venue Management
  # Derived from screens/*.yaml on 18 August — every platform with a screen that calls an
  # operation in this contract. **Six contracts declared none**, which the viewer reports as
  # missing taxonomy and no package checker tested for.
  x-ticvai-tier: satellite
  description: >
    **Rota, attendance and announcements.** The three things the employee app needs that no
    contract owned.

    CF-71 called this "a task has no contract", and reading the fifty requirements showed the
    premise was half wrong: **18.2.x is Work Order Inbox, Accept, Reject, Start, Pause,
    Complete and Close** — a task in the employee app *is* a work order, and the fix there was
    seven lifecycle operations on `maintenance`, not a new Task object. Building one would have
    given a venue two inboxes for one job.

    What genuinely had no home is here.

    ## Rota is not a shift

    `orders.shift` is a cash-handling session — a drawer opened, counted and closed, tied to a
    workstation. **A rota assignment is a person expected somewhere at a time**, and most of
    the people on a rota never touch a till.

    Conflating them is how a lifeguard becomes uncountable. The two link where they overlap: a
    cashier's assignment names the workstation their shift will open on.

    ## Attendance is not the rota either

    The rota says who *should* be there. Attendance says who *was*. **The gap between them is
    the entire operational value** — a venue with only the rota believes it is fully staffed
    every day.

    ## Deliberately not here

    **Payroll.** Attendance produces hours; what they are worth is a finance system's problem
    and almost certainly an existing one. This contract exports; it does not calculate pay.

    **Leave and absence approval.** Requests route through `approvals`, which already has
    delegation, escalation and segregation of duties. A second approval mechanism here would be
    the fifth one this platform has already collapsed.
  contact:
    name: TICVAI Platform
servers:
  - url: https://api.{region}.ticvai.com/workforce/v1
    variables:
      region:
        default: ae
security:
  - bearerAuth: []
tags:
  - name: rota
    description: Who is expected where, and when
  - name: attendance
    description: Who actually turned up
  - name: announcements
    description: Telling staff something
paths:
  /rota-assignments:
    get:
      operationId: listRotaAssignments
      x-ticvai-consumed-by:
        - "P04 POS-009 Staff Roster"
        - "P04 POS-018 Safe Drop & Cash Transfer Management"
        - "P06 EMP-021 Roster"
        - "P06 EMP-022 My rota"
        - "P06 EMP-023 Swap request"
        - "P08 BO-055 Rota & Scheduling"
        - "P08 BO-882 Workforce Integration & Synchronization Center"
        - "P08 BO-883 Workforce Roster Command Center"
      x-ticvai-audience: [staff]
      summary: The rota
      description: >
        18.9.2. A supervisor sees the venue; a steward sees themselves. **The same operation,
        scoped by permission** — a steward without `WORKFORCE_VIEW` gets their own assignments
        and no one else's, which is what `EMP-022 My rota` renders.
      tags: [rota]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RotaAssignment' }

    post:
      operationId: createRotaAssignment
      x-ticvai-consumed-by:
        - "P04 POS-009 Staff Roster"
        - "P04 POS-018 Safe Drop & Cash Transfer Management"
        - "P08 BO-055 Rota & Scheduling"
        - "P08 BO-712 Staff & Role Assignment Configuration"
        - "P08 BO-884 Attraction & Operational Staffing Roster"
        - "P08 BO-917 Event Staff & Personnel Allocation"
      x-ticvai-audience: [staff]
      summary: Put someone on the rota
      description: >
        Refused where the person already has an overlapping assignment, or lacks the role the
        position requires. **A rota that lets one person be in two places is a rota that gets
        ignored.**

        Where the position needs a till, the assignment names the workstation their shift will
        open on — the link between a rota and a cash session, without merging the two.
      tags: [rota]
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotaAssignment' }
      responses:
        '201':
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotaAssignment' }
        '409':
          description: Overlaps an existing assignment, or the person lacks the required role
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /guest-broadcast:
    post:
      operationId: broadcastToGuests
      summary: Venue-wide notice to every guest on site
      description: >
        BL-020. **`publishAnnouncement` carries an emergency kind and is staff-facing.** A venue-wide
        evacuation notice is not a marketing message and must not ride the marketing path — **consent
        and suppression do not apply to a fire.**

        Reaches every guest with a live entitlement at this venue, by every channel they have.
        **Bypasses quiet hours, journey throttling and channel preference**, which is the entire
        reason it is a separate operation rather than a campaign with a flag.

        **Requires two principals for `evacuation`.** A venue-wide alarm sent in error empties a
        park and it is not recallable.
      tags: [workforce]
      x-ticvai-permission: ANNOUNCEMENT_PUBLISH
      x-ticvai-permission-escalated: ANNOUNCEMENT_PUBLISH
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, message]
              properties:
                kind: { type: string, enum: [evacuation, weather, rideClosure, lostChild, operational, allClear] }
                message: { type: string, maxLength: 300 }
                messageLocalised:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    **Every enabled language, and a missing one is sent in the default rather than
                    withheld.** A guest who cannot read the notice is better served than a guest who
                    never receives it.
                assemblyPointIds:
                  type: array
                  description: >
                    For an evacuation. **The map resolves them to the nearest one per guest** where
                    the venue is georeferenced — a single assembly point named in text sends
                    everybody the same direction regardless of where they are standing.
                  items: { type: string, format: uuid }
                secondPrincipalId: { type: string, format: uuid, nullable: true }
      responses:
        '202':
          description: Broadcasting
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /rota-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRotaAssignment
      x-ticvai-consumed-by:
        - "P08 BO-055 Rota & Scheduling"
      x-ticvai-audience: [staff]
      summary: Move or cancel an assignment
      tags: [rota]
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotaAssignment' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotaAssignment' }

  /rota-assignments/{assignmentId}/swap:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestShiftSwap
      x-ticvai-consumed-by:
        - "P06 EMP-021 Roster"
        - "P06 EMP-022 My rota"
        - "P06 EMP-023 Swap request"
        - "P08 BO-055 Rota & Scheduling"
        - "P08 BO-939 Shift Change, Swap, Pickup & Release"
      x-ticvai-audience: [staff]
      summary: Ask someone to take your shift
      description: >
        `EMP-023`. **Routes through `approvals`** rather than implementing its own — the
        supervisor approving a swap is the same mechanism as the one approving a refund, with
        the same audit trail and the same rule that a requester cannot approve themselves.

        Both parties must accept before the supervisor sees it. A swap approved against someone
        who never agreed is a gap in the rota nobody notices until the shift starts.
      tags: [rota]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toPrincipalId]
              properties:
                toPrincipalId: { type: string, format: uuid }
                reason: { type: string, maxLength: 300 }
      responses:
        '202':
          description: Awaiting the other party, then approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftSwap' }

  /attendance:
    get:
      operationId: listAttendance
      x-ticvai-consumed-by:
        - "P06 EMP-024 Clock in / out"
        - "P06 EMP-025 Break management"
        - "P08 BO-056 Time & Attendance"
        - "P08 BO-888 Attendance & Live Workforce Command Center"
      x-ticvai-audience: [staff]
      summary: Who was here
      description: >
        18.9.1. **Against the rota, not on its own.** A list of clock-ins says nothing; a list
        of clock-ins beside the assignments that expected them shows the no-shows, the late
        starts and the people who covered.
      tags: [attendance]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - name: exceptionsOnly
          in: query
          description: Late, absent, no clock-out. **The list a duty manager actually opens.**
          schema: { type: boolean }
      responses:
        '200':
          description: Attendance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecord' }

  /attendance/clock:
    post:
      operationId: recordAttendance
      x-ticvai-consumed-by:
        - "P06 EMP-024 Clock in / out"
        - "P06 EMP-025 Break management"
        - "P08 BO-056 Time & Attendance"
        - "P08 BO-889 Staff Check-In, Check-Out & Attendance Exceptions"
        - "P08 BO-936 Mobile Staff Check-In & Check-Out"
      x-ticvai-audience: [staff]
      summary: Clock in, clock out, or take a break
      description: >
        18.9.1 and `EMP-024`, `EMP-025`. **Offline-capable and timestamped on the device**, then
        reconciled. A steward clocking in at a gate with no signal must not be marked absent.

        Where the venue requires it, the record carries the access point or geofence the clock
        happened at — **a clock-in from a car park is a different fact from one at the staff
        entrance**, and the difference is what makes attendance evidence rather than
        self-report.

        A missing clock-out is not corrected automatically. It is flagged, because guessing when
        someone left is how a payroll dispute starts.
      tags: [attendance]
      x-ticvai-permission: ATTENDANCE_RECORD
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, occurredAt]
              properties:
                kind: { type: string, enum: [clockIn, clockOut, breakStart, breakEnd] }
                occurredAt:
                  type: string
                  format: date-time
                  description: Device time. The server records both this and when it arrived.
                assignmentId: { type: string, format: uuid, nullable: true }
                accessPointId: { type: string, format: uuid, nullable: true }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }
        '409':
          description: >
            Out of sequence — a clock-out with no clock-in, or a second clock-in. **Reported
            rather than silently corrected.**
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /attendance/{recordId}/amend:
    parameters:
      - name: recordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: amendAttendance
      x-ticvai-consumed-by:
        - "P06 EMP-024 Clock in / out"
        - "P08 BO-056 Time & Attendance"
        - "P08 BO-889 Staff Check-In, Check-Out & Attendance Exceptions"
      x-ticvai-audience: [staff]
      summary: A supervisor corrects a record
      description: >
        Forgotten clock-outs and phones that died. **The original is kept and the amendment is
        recorded against it** — attendance feeds pay, and a record that can be quietly rewritten
        is not evidence of anything.
      tags: [attendance]
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correctedAt, reason]
              properties:
                correctedAt: { type: string, format: date-time }
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Amended, with the original retained
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceRecord' }

  /announcements:
    get:
      operationId: listAnnouncements
      x-ticvai-consumed-by:
        - "P06 EMP-007 Handover notes"
        - "P06 EMP-037 Notifications"
        - "P06 EMP-038 Broadcast to team"
        - "P06 EMP-039 Announcements"
        - "P06 EMP-047 Emergency mode"
        - "P08 BO-066 Notification Settings"
        - "P08 BO-941 Operational Notifications & Live Alerts"
        - "P09 ADM-036 Platform Notification Broadcast"
      x-ticvai-audience: [staff]
      summary: What staff have been told
      description: 18.9.3 and 18.9.5. `EMP-039`.
      tags: [announcements]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
        - name: unacknowledgedOnly
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Announcement' }

    post:
      operationId: publishAnnouncement
      x-ticvai-consumed-by:
        - "P06 EMP-007 Handover notes"
        - "P06 EMP-037 Notifications"
        - "P06 EMP-038 Broadcast to team"
        - "P06 EMP-039 Announcements"
        - "P06 EMP-047 Emergency mode"
        - "P08 BO-066 Notification Settings"
        - "P09 ADM-036 Platform Notification Broadcast"
      x-ticvai-audience: [staff]
      summary: Tell staff something
      description: >
        18.9.3, 18.9.4, `EMP-038`. Targeted by venue, department or role.

        **`emergency` is not a louder `operational`.** It overrides the home screen (`EMP-047`),
        bypasses quiet hours, requires acknowledgement, and reports who has not acknowledged —
        because during an evacuation the useful list is the people who have not confirmed they
        know.

        A separate permission, so the ability to post a staff notice does not carry the ability
        to declare an emergency.
      tags: [announcements]
      x-ticvai-permission: ANNOUNCEMENT_PUBLISH
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Announcement' }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }

  /announcements/{announcementId}/acknowledge:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acknowledgeAnnouncement
      x-ticvai-consumed-by:
        - "P06 EMP-007 Handover notes"
        - "P06 EMP-037 Notifications"
        - "P06 EMP-038 Broadcast to team"
        - "P06 EMP-039 Announcements"
        - "P06 EMP-047 Emergency mode"
        - "P08 BO-066 Notification Settings"
      x-ticvai-audience: [staff]
      summary: Confirm you have read it
      description: >
        Queued offline. **An emergency acknowledgement that needs a network is one that does not
        arrive when it matters most.**
      tags: [announcements]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Acknowledged

  /announcements/{announcementId}/reach:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAnnouncementReach
      x-ticvai-consumed-by:
        - "P06 EMP-007 Handover notes"
        - "P06 EMP-037 Notifications"
        - "P06 EMP-038 Broadcast to team"
        - "P06 EMP-039 Announcements"
        - "P06 EMP-047 Emergency mode"
        - "P08 BO-066 Notification Settings"
      x-ticvai-audience: [staff]
      summary: Who has acknowledged, and who has not
      description: >
        **The second list is the one that matters.** For an operational notice it measures
        whether anyone read it; during an emergency it is the roll call.
      tags: [announcements]
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Reach
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementReach' }

  /training-records:
    get:
      operationId: listTrainingRecords
      x-ticvai-consumed-by:
        - "P06 EMP-041 Training"
      x-ticvai-audience:
      - staff
      summary: Training completed and what is expiring
      description: '**Drafted 4 September as a stub.** EMP-041 *Training* sat on `semanticSearch` alone, which made it identical to the knowledge base. **The F&B `fireCourse` / `holdCourse` / `setCourseRules` operations are meal courses, not training** - the name collision is why this gap survived a search. The screen that needs it existed and this operation did not, so the screen shared a generic set with its neighbours and read as a duplicate of them. **The shape below is a proposal**: the fields are the minimum the screen has to show, and the request and response want confirming before anything is built against them.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Training completed and what is expiring
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingRecord'
  /shift-swaps:
    get:
      operationId: listShiftSwapRequests
      x-ticvai-consumed-by:
        - "P06 EMP-023 Swap request"
        - "P08 BO-939 Shift Change, Swap, Pickup & Release"
      x-ticvai-audience:
      - staff
      summary: Swap requests and their state
      description: '**Drafted 4 September as a stub.** `requestShiftSwap` existed and nothing could read the requests back, so EMP-023 shared the roster''s operations. **A request nobody can list is a request nobody can approve.** Returns the existing `ShiftSwap` schema: a first draft of this added a `ShiftSwapRequest` of its own and derived a second table for the same rows, which is the modelling mistake this package exists to make visible. The screen that needs it existed and this operation did not, so the screen shared a generic set with its neighbours and read as a duplicate of them. **The shape below is a proposal**: the fields are the minimum the screen has to show, and the request and response want confirming before anything is built against them.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Swap requests and their state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftSwap'
  /shift-templates:
    get:
      operationId: listShiftTemplates
      x-ticvai-consumed-by:
        - "P08 BO-879 Shift Template & Assignment Configuration"
      summary: Named shift patterns a rota is built from
      description: 'Resource board 3.7. **`createRotaAssignment` placed one person in one slot and
        nothing described the slot.** A rota built assignment by assignment is a rota typed out every
        week; a template — early, late, split, double, on-call — is the unit a manager actually thinks
        in.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftTemplate'
    put:
      operationId: setShiftTemplate
      x-ticvai-consumed-by:
        - "P08 BO-714 Event Shift & Roster Configuration"
        - "P08 BO-879 Shift Template & Assignment Configuration"
      summary: Define a shift pattern, its breaks and its qualifications
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftTemplate'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftTemplate'
  /staffing-rules:
    put:
      operationId: setStaffingRules
      x-ticvai-consumed-by:
        - "P08 BO-881 Overtime & Working-Hour Rules"
        - "P08 BO-885 Minimum Staffing & Coverage Rule Configuration"
      summary: Minimum cover, working-hour limits and overtime
      description: 'Resource boards 4.3 and 3.9. **Minimum staffing is a safety rule before it is a
        cost rule.** A ride that requires two operators cannot run with one, and a rota that allows it
        has produced a closure or an incident.

        **Working-hour limits are law in most markets**, and a system that lets a manager roster
        somebody for fourteen hours has made the venue liable rather than the manager.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffingRules'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffingRules'
  /staffing-coverage:
    get:
      operationId: getStaffingCoverage
      x-ticvai-consumed-by:
        - "P08 BO-714 Event Shift & Roster Configuration"
        - "P08 BO-883 Workforce Roster Command Center"
        - "P08 BO-886 Staffing Gap & Coverage Control Center"
        - "P08 BO-892 AI Workforce Planner & Roster Optimization"
      summary: Where the rota is short, and by how much
      description: 'Resource board 4.4. **The gap is the product.** A rota screen showing who is on
        shows nothing a manager cannot see; a screen showing that the north gate is one short at
        fourteen hundred on Saturday is the reason the system exists.

        Computed against minimum staffing and the qualifications each position requires — a position
        filled by somebody not qualified for it is still a gap.

        '
      tags:
      - workforce
      x-ticvai-permission: WORKFORCE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
