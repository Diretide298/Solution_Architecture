            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WorkforceStaffConversation:
      type: object
      x-ticvai-persistence: workforce.staff_conversation
      description: '**One direct or group conversation between staff of a venue** (18.9.5 Internal Messaging;
        decided 29 September, build pass). Created by `sendStaffMessage` the first time colleagues are
        messaged; its participants are `workforce.staff_conversation_participant` rows. Announcements stay the
        one-to-many channel; this is the one-to-one and small-group one.'
      required:
      - id
      - venueId
      - kind
      - createdByPrincipalId
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venueId:
          x-ticvai-references: platform.scope
          type: string
          format: uuid
        scopePath:
          type: string
        kind:
          type: string
          enum:
          - direct
          - group
          description: A direct conversation has exactly two participants and at most one exists per pair.
        title:
          type: string
          maxLength: 120
          nullable: true
          description: Group conversations only; null on a direct one.
        createdByPrincipalId:
          x-ticvai-references: identity.principal
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    WorkforceStaffConversationParticipant:
      type: object
      x-ticvai-persistence: workforce.staff_conversation_participant
      description: One staff member in one conversation, with their read marker (decided 29 September, build
        pass). The unread count is the messages after `lastReadMessageId`.
      required:
      - staffConversationId
      - principalId
      - joinedAt
      properties:
        staffConversationId:
          x-ticvai-references: workforce.staff_conversation
          type: string
          format: uuid
        principalId:
          x-ticvai-references: identity.principal
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time
        lastReadMessageId:
          type: string
          format: uuid
          nullable: true
          description: Moved forward only, by `markStaffConversationRead`.
        mutedUntil:
          type: string
          format: date-time
          nullable: true
    WorkforceStaffMessage:
      type: object
      x-ticvai-persistence: workforce.staff_message
      description: One message in a staff conversation (decided 29 September, build pass). Never edited
        through the API, so a conversation reads the same to everyone in it afterwards.
      required:
      - id
      - staffConversationId
      - senderPrincipalId
      - body
      - sentAt
      properties:
        id:
          type: string
          format: uuid
          description: The client-generated UUIDv7 from the send, the key an offline replay deduplicates on.
        staffConversationId:
          x-ticvai-references: workforce.staff_conversation
          type: string
          format: uuid
        senderPrincipalId:
          x-ticvai-references: identity.principal
          type: string
