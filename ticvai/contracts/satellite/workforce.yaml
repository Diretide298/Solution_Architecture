      - resolution
      properties:
        conflictId:
          type: string
          format: uuid
        resolution:
          type: string
          enum:
          - acceptExternal
          - keepTicvai
          - retry
          - ignore
          - escalate
        note:
          type: string
          maxLength: 1000
          nullable: true
        releaseAffectedAssignments:
          type: boolean
          default: false
          description: >
            **For a termination conflict, what happens to the shifts already rostered.** Board 3
            requires the downstream consequence to be acted on rather than reported: releasing them
            puts the shifts back on the marketplace, and leaving them means a manager has decided
            to cover them another way.
    WorkforceIntegrationSource:
      type: object
      x-ticvai-persistence: workforce.integration_source
      description: >
        **An external system that masters some of our workforce data.** Board 3 names HRMS,
        Workforce Management, Payroll, Time & Attendance, Identity Management and external
        staffing agencies. The six-state display Board 10 asks for lives on this row: what is
        connected, when it last synchronised, and whether its credentials still work.
      required:
      - code
      - name
      - kind
      - transport
      - status
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 150
        kind:
          type: string
          enum: [hrms, workforceManagement, payroll, timeAndAttendance, identity, staffingAgency]
        transport:
          type: string
          enum: [api, webhook, scheduled, manual, fileImport]
          description: >
            Board 3, Support. **`manual` and `fileImport` are in the list on purpose** — a
            staffing agency that sends a spreadsheet is still a system of record, and modelling
            only the API cases would leave the messiest source unmanaged.
        authenticationStatus:
          type: string
          enum: [healthy, expiring, expired, failed, notConfigured]
        lastSynchronisedAt:
          type: string
          format: date-time
          nullable: true
        status:
          readOnly: true
          type: string
          enum: [active, degraded, suspended]
        scopePath:
          type: string
          nullable: true
    WorkforceFieldOwnership:
      type: object
