              schema:
                $ref: '#/components/schemas/GameKioskConfig'

components:
  schemas:
    AttractionType:
      type: object
      x-ticvai-persistence: games.attraction_type
      description: 'Board 1.4. **The type decides which settings apply.**'
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        family:
          type: string
          enum:
          - ride
          - arcadeGame
          - redemptionGame
          - crane
          - vrExperience
          - softPlay
          - attraction
          - show
        hasTicketPayout:
          type: boolean
          default: false
        hasDirectPay:
          type: boolean
          default: false
        hasCycleTime:
          type: boolean
          default: true
        hasHeightRestriction:
          type: boolean
          default: false
        supportsEntitlements:
          type: boolean
          default: true
        scopePath:
          type: string
    GameOperationalConfig:
      type: object
      x-ticvai-persistence: games.operational_config
      description: 'Board 1.5. **Cycle time is the number everything else derives from.**'
      properties:
        gameId:
          type: string
          format: uuid
        cycleSeconds:
          type: integer
          nullable: true
        riderCapacity:
          type: integer
          nullable: true
        throughputPerHour:
          type: integer
          readOnly: true
        minimumHeightCm:
          type: integer
          nullable: true
        maximumHeightCm:
          type: integer
          nullable: true
        minimumAge:
          type: integer
          nullable: true
        supervisionRequiredBelowAge:
          type: integer
          nullable: true
        healthRestrictions:
          type: array
          items:
            type: string
        staffPositions:
          type: integer
          nullable: true
        operatingHours:
          type: object
          nullable: true
          additionalProperties: true
        scopePath:
          type: string
    Reader:
      type: object
      x-ticvai-persistence: games.reader
      description: 'Board 2. **A `tenancy` device with a game configuration on it.**'
      required:
      - deviceId
      properties:
        deviceId:
          type: string
          format: uuid
          description: '`tenancy.RegisteredDevice`. **Enrolment, firmware and tamper state live
            there.**

            '
        gameId:
          type: string
          format: uuid
          nullable: true
        readerProfileId:
          type: string
          format: uuid
          nullable: true
        acceptedCreditTypeIds:
          type: array
          items:
            type: string
            format: uuid
        acceptsDirectPay:
          type: boolean
          default: false
        retapDelaySeconds:
          type: integer
          default: 3
          description: '**The setting that stops a guest paying twice for one go.** A wristband held
            against a reader for a second and a half is two taps to the hardware and one intention to
            the guest.

            '
        displayRules:
          type: object
          properties:
            freeGameGlow:
              type: boolean
              default: true
              description: '**What tells a guest their entitlement was used rather than their money.**
                Without it the complaint arrives at the desk.

                '
            showBalance:
              type: boolean
              default: true
            showPrice:
              type: boolean
              default: true
            themeCode:
              type: string
              nullable: true
            languages:
              type: array
              items:
                type: string
        ioMapping:
          type: object
          additionalProperties: true
          description: 'Board 9.6. Which output starts the game, which input reports it finished.'
        status:
          type: string
          enum:
          - unconfigured
          - active
          - offline
          - maintenance
          - disabled
        scopePath:
          type: string
    ReaderDeployment:
      type: object
      x-ticvai-persistence: games.reader_deployment
      description: 'Boards 9.5 and 9.8. **A change nobody deployed is a change that did not happen.**'
      properties:
        id:
          type: string
          format: uuid
        readerId:
          type: string
          format: uuid
        configurationVersion:
          type: integer
        edgePackageExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**A reader running a three-month-old rule set is charging last season''s
            prices.** The only safe end to that is one it enforces itself.

            '
        deployedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - queued
          - sent
          - acknowledged
          - failed
          - stale
        failureReason:
          type: string
          nullable: true
    ReaderTestResult:
      type: object
      description: 'Boards 2.10 and 9.9. **Each check separately**, because they send an engineer to
        different places.

        '
      properties:
        readerId:
          type: string
          format: uuid
        testedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            type: object
            properties:
              check:
                type: string
                enum:
                - connectivity
                - cardRead
                - balanceCheck
                - display
                - sound
                - gameTrigger
                - gameCompleteSignal
              passed:
                type: boolean
              detail:
                type: string
                nullable: true
        overall:
          type: string
          enum:
          - pass
          - partial
          - fail
    GameEntitlement:
      type: object
      x-ticvai-persistence: games.entitlement
      description: 'Board 4. **A right to play, not money** — consumed before money is.'
      required:
      - code
      - kind
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - allGamesPass
          - unlimitedSingleGame
          - limitedSingleGame
          - package
          - freePlay
        gameIds:
          type: array
          items:
            type: string
            format: uuid
        attractionTypeIds:
          type: array
          items:
            type: string
            format: uuid
        playCount:
          type: integer
          nullable: true
          description: 'For `limitedSingleGame` and `package`. Null means unlimited.'
        validityKind:
          type: string
          enum:
          - sameDay
          - days
          - untilDate
          - untilUsed
        validityDays:
          type: integer
          nullable: true
        activationKind:
          type: string
          enum:
          - onPurchase
          - onFirstUse
          - onDate
          default: onFirstUse
          description: '**On first use is what a guest expects from a day pass bought the night
            before.** On purchase is what a venue defaults to by accident, and it costs them a day.

            '
        dailyPlayCap:
          type: integer
          nullable: true
        cooldownMinutes:
          type: integer
          nullable: true
          description: '**Unlimited does not mean continuous.** A cooldown is how one child does not
            hold a popular ride all afternoon.

            '
        linkedProductId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    GameplayValidationRules:
      type: object
      x-ticvai-persistence: games.validation_rules
      description: 'Boards 4.2 and 4.3. **Must be an answer, stated once**, rather than whatever the
        firmware happens to do.

        '
      properties:
        deductionOrder:
          type: array
          items:
            type: string
            enum:
            - entitlement
            - freePlay
            - bonusCredit
            - promotionalCredit
            - gameCredit
            - cashCredit
            - directPay
        checkOrder:
          type: array
          items:
            type: string
            enum:
            - cardValid
            - cardNotExpired
            - cardNotBlocked
            - restrictionsMet
            - retapWindow
            - entitlementAvailable
            - fundsSufficient
        allowPartialEntitlement:
          type: boolean
          default: false
          description: '**Whether an entitlement covering part of the price may be topped up with
            credit.** Usually no, because a guest who thinks they have a pass does not expect a charge.

            '
        refuseBelowBalance:
          $ref: ../shared/common.yaml#/components/schemas/Money
        offlineDecisionAllowed:
          type: boolean
          default: true
        offlineMaximumValue:
          $ref: ../shared/common.yaml#/components/schemas/Money
        scopePath:
          type: string
    GameplayAuthorisationRequest:
      type: object
      required:
      - readerId
      properties:
        readerId:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
          nullable: true
        credentialIdentifier:
          type: string
          nullable: true
        gameId:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time
          nullable: true
        guestHeightCm:
          type: integer
          nullable: true
        offline:
          type: boolean
          default: false
    GameplayAuthorisation:
      type: object
      x-ticvai-persistence: games.authorisation
      description: 'Board 4.9. **The refusal reason is the product.**'
      properties:
        id:
          type: string
          format: uuid
        decision:
          type: string
          enum:
          - allow
          - refuse
        reason:
          type: string
          nullable: true
          enum:
          - ok
          - cardNotFound
          - cardExpired
          - cardBlocked
          - retapTooSoon
          - heightRestriction
          - ageRestriction
          - insufficientFunds
          - entitlementExhausted
          - entitlementNotValidHere
          - cooldownActive
          - dailyCapReached
          - readerNotConfigured
          - gameUnavailable
        guestMessage:
          type: string
          nullable: true
          description: '***"No plays left on your pass"* rather than *"Declined"*.** One is a guest who
            understands; the other is a member of staff walking over.

            '
        chargedFrom:
          type: string
          nullable: true
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        entitlementId:
          type: string
          format: uuid
          nullable: true
        remainingBalance:
          $ref: ../shared/common.yaml#/components/schemas/Money
        remainingPlays:
          type: integer
          nullable: true
        trace:
          type: array
          items:
            type: object
            properties:
              check:
                type: string
              passed:
                type: boolean
              detail:
                type: string
                nullable: true
        decidedOffline:
          type: boolean
          default: false
        scopePath:
          type: string
    GamePricing:
      type: object
      x-ticvai-persistence: games.pricing
      description: 'Board 5. **Priority is explicit**, because evaluation order is not a decision
        anybody made.

        '
      properties:
        gameId:
          type: string
          format: uuid
        standardPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        vipPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        groupPricing:
          type: array
          items:
            type: object
            properties:
              minimumPlayers:
                type: integer
              pricePerPlayer:
                $ref: ../shared/common.yaml#/components/schemas/Money
        peakPricing:
          type: array
          items:
            type: object
            properties:
              daysOfWeek:
                type: array
                items:
                  type: string
              from:
                type: string
              to:
                type: string
              price:
                $ref: ../shared/common.yaml#/components/schemas/Money
        calendarExceptions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              price:
                $ref: ../shared/common.yaml#/components/schemas/Money
              closed:
                type: boolean
                default: false
        retryPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        retryWindowSeconds:
          type: integer
          nullable: true
        priority:
          type: array
          items:
            type: string
            enum:
            - calendarException
            - peak
            - group
            - vip
            - retry
            - standard
        scopePath:
          type: string
    GamePriceResolution:
      type: object
      description: 'Board 5.9. **What will this actually charge.**'
      properties:
        gameId:
          type: string
          format: uuid
        effectivePrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        appliedRule:
          type: string
        trace:
          type: array
          items:
            type: object
            properties:
              rule:
                type: string
              applied:
                type: boolean
              price:
                $ref: ../shared/common.yaml#/components/schemas/Money
              skippedBecause:
                type: string
                nullable: true
    RedemptionRules:
      type: object
      x-ticvai-persistence: games.redemption_rules
      description: 'Board 6. **Ticket-based and ticketless are one currency arriving two ways.**'
      properties:
        ticketCreditTypeId:
          type: string
          format: uuid
          nullable: true
        earnRules:
          type: array
          items:
            type: object
            properties:
              gameId:
                type: string
                format: uuid
              ticketsPerPlay:
                type: integer
                nullable: true
              ticketsPerScorePoint:
                type: number
                nullable: true
              maximumPerPlay:
                type: integer
                nullable: true
        ticketEaterEnabled:
          type: boolean
          default: false
        ticketlessEnabled:
          type: boolean
          default: true
        ticketsExpire:
          type: boolean
          default: false
        ticketValidityDays:
          type: integer
          nullable: true
        counterApprovalAboveTickets:
          type: integer
          nullable: true
          description: '**A prize above a threshold needs a second person.** The alternative is a
            counter that can hand out the top shelf.

            '
        scopePath:
          type: string
    PrizeCost:
      type: object
      x-ticvai-persistence: games.prize_cost
      description: 'Boards 6.7 and 6.8. **Two numbers, one of them on the shelf.**'
      properties:
        prizeId:
          type: string
          format: uuid
        ticketPrice:
          type: integer
        unitCost:
          $ref: ../shared/common.yaml#/components/schemas/Money
        marginPercent:
          type: number
          readOnly: true
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
          description: '**Stock comes from `inventory`.** A prize catalogue with its own count is one
            that disagrees with the stockroom.

            '
        directPayPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        displayTier:
          type: string
          nullable: true
        scopePath:
          type: string
    GameCardExpiryRules:
      type: object
      x-ticvai-persistence: games.card_expiry_rules
      description: 'Boards 7.3 to 7.6. **Measured from last activity, and the warning is part of the
        rule.**

        '
      properties:
        basis:
          type: string
          enum:
          - fromIssue
          - fromLastActivity
          - fromLastRecharge
          default: fromLastActivity
        validityMonths:
          type: integer
        warnBeforeDays:
          type: array
          items:
            type: integer
          description: '**Expiring a balance with no notice is what ends up on social media.**'
        warningChannels:
          type: array
          items:
            type: string
        extendOnRecharge:
          type: boolean
          default: true
        onExpiry:
          type: string
          enum:
          - forfeit
          - holdForClaim
          - transferToBreakage
          default: holdForClaim
        holdForClaimDays:
          type: integer
          nullable: true
        scopePath:
          type: string
    GameplayTransaction:
      type: object
      x-ticvai-persistence: games.gameplay_transaction
      description: 'Boards 8.2 and 8.5. **The refused ones are the valuable half.**'
      properties:
        id:
          type: string
          format: uuid
        readerId:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
          nullable: true
        cardId:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - allowed
          - refused
          - reversed
        reason:
          type: string
          nullable: true
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        chargedFrom:
          type: string
          nullable: true
        entitlementId:
          type: string
          format: uuid
          nullable: true
        ticketsEarned:
          type: integer
          nullable: true
        decidedOffline:
          type: boolean
          default: false
        syncedAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
    ReaderSyncStatus:
      type: object
      description: 'Board 8.8. **Revenue the platform has not seen.**'
      properties:
        readerId:
          type: string
          format: uuid
        readerName:
          type: string
        pendingTransactions:
          type: integer
        pendingValue:
          $ref: ../shared/common.yaml#/components/schemas/Money
        oldestPendingAt:
          type: string
          format: date-time
          nullable: true
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        edgePackageVersion:
          type: integer
          nullable: true
        edgePackageStale:
          type: boolean
        status:
          type: string
          enum:
          - online
          - offline
          - degraded
          - unreachable
    GameEligibility:
      type: object
      description: 'Board 10.7 — *"What Can I Play?"*, and every fact in it lives somewhere different.'
      properties:
        gameId:
          type: string
          format: uuid
        name:
          type: string
        playable:
          type: boolean
        costKind:
          type: string
          enum:
          - freeWithEntitlement
          - credit
          - directPay
          - notPlayable
        price:
          $ref: ../shared/common.yaml#/components/schemas/Money
        entitlementId:
          type: string
          format: uuid
          nullable: true
        remainingPlays:
          type: integer
          nullable: true
        blockedReason:
          type: string
          nullable: true
        ticketsTypicallyEarned:
          type: integer
          nullable: true
    GameKioskConfig:
      type: object
      x-ticvai-persistence: games.kiosk_config
      description: 'Boards 10.2 and 10.10. **Used by a child holding a wristband.**'
      properties:
        kioskDeviceId:
          type: string
          format: uuid
        steps:
          type: array
          items:
            type: string
            enum:
            - identify
            - balance
            - topUp
            - entitlements
            - whatCanIPlay
            - redemption
            - history
        languages:
          type: array
          items:
            type: string
        themeCode:
          type: string
          nullable: true
        idleTimeoutSeconds:
          type: integer
          default: 30
        requiresPinForTopUp:
          type: boolean
          default: false
        scopePath:
          type: string
    GameStatus:
      type: string
      enum:
      - inService
      - outOfService
      - maintenance
      - retired
    ReaderProfile:
      type: object
      x-ticvai-persistence: games.reader_profile
      description: 'BL-153. **`games` is well built on the money and what is missing sits at the reader.**

        10.2.14 and 10.2.17 want a different colour for a free game and a different one for insufficient
        credit — **because a guest at an arcade machine cannot read a message, they can only see a light.**
        The whole interaction is a second long and happens across a noisy room.

        '
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        displayBehaviour:
          type: object
          description: '**What the reader shows, per outcome.** Colour and tone, because the guest is
            looking at a machine rather than a screen.

            '
          properties:
            accepted:
              type: string
            freeGame:
              type: string
            insufficientCredit:
              type: string
            cardBlocked:
              type: string
            readError:
              type: string
        retryPricing:
          type: object
          nullable: true
          description: '**A retry after a machine fault is not a second play.** Without this a guest whose
            game crashed pays twice, and the attendant refunds by hand — which is how an arcade loses
            money and goodwill at once.

            '
          properties:
            isFree:
              type: boolean
              default: true
            withinSeconds:
              type: integer
              default: 60
            maxRetries:
              type: integer
              default: 1
        rePlayWindowSeconds:
          type: integer
          nullable: true
          description: '**A second tap within this window is the same play, not a new one.** A guest tapping
            twice because nothing appeared to happen should not be charged twice.

            '
        entitlementProductIds:
          type: array
          description: '**Per-game entitlement.** A pass that includes ten specific rides needs the reader
            to know which, and a card that works everywhere is a different product.

            '
          items:
            type: string
            format: uuid
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    IssueGameCardRequest:
      x-ticvai-persistence: none — request only
      type: object
      required:
      - id
      - kind
      - venueId
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          type: string
          enum:
          - physical
          - digital
        cardCode:
          type: string
          description: Required for physical cards, which are pre-printed. Generated for digital.
        venueId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        initialCredits:
          type: integer
          minimum: 0
          default: 0
        validMonths:
          type: integer
          minimum: 1
    GameCard:
      x-ticvai-persistence: games.card
      type: object
      required:
      - cardCode
      - venueId
      - credits
      - bonusCredits
      - points
      - status
      - issuedAt
      properties:
        cardCode:
          type: string
        kind:
          type: string
        venueId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        credits:
          type: integer
          description: Bought with money. Buys plays.
        bonusCredits:
          type: integer
          description: 'From a promotion. Typically non-refundable and spent before paid credits.

            '
        points:
          type: integer
          description: 'Won by playing. Buys prizes. **Not interchangeable with credits** — a guest who
            wins should not simply be able to play more.

            '
        status:
          type: string
          enum:
          - active
          - blocked
          - expired
          - transferred
        blockedReason:
          type: string
          nullable: true
        transferredToCardCode:
          type: string
          nullable: true
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    Game:
      x-ticvai-persistence: games.game
      type: object
      required:
      - id
      - code
      - name
      - venueId
      - creditCost
      - status
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        venueId:
          type: string
          format: uuid
        zone:
          type: string
          nullable: true
        assetId:
          type: string
          format: uuid
          nullable: true
          description: 'The machine. Taken out of service by maintenance, the game stops accepting play
            rather than swallowing credits.

            '
        readerId:
          type: string
          format: uuid
          nullable: true
        creditCost:
          type: integer
          minimum: 1
        minPointsAwarded:
          type: integer
        maxPointsAwarded:
          type: integer
        heightRequirementCm:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/GameStatus'
        playsToday:
          type: integer
        creditsTakenToday:
          type: integer
        pointsAwardedToday:
          type: integer
    RecordPlayRequest:
      x-ticvai-persistence: none — request only
      type: object
      required:
      - id
      - cardCode
      - gameId
      - recordedAt
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        cardCode:
          type: string
        gameId:
          type: string
          format: uuid
        creditsUsed:
          type: integer
          minimum: 1
        pointsAwarded:
          type: integer
          minimum: 0
        sequence:
          type: integer
          description: Monotonic per reader. Preserves order across an offline batch.
        recordedAt:
          type: string
          format: date-time
    PlayResult:
      x-ticvai-persistence: games.play
      type: object
      required:
      - playId
      - creditsUsed
      - pointsAwarded
      - creditsRemaining
      - pointsBalance
      properties:
        playId:
          type: string
        cardCode:
          type: string
        gameId:
          type: string
          format: uuid
        creditsUsed:
          type: integer
        pointsAwarded:
          type: integer
        creditsRemaining:
          type: integer
        pointsBalance:
          type: integer
        recordedAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
          nullable: true
    Prize:
      x-ticvai-persistence: games.prize
      type: object
      required:
      - id
      - name
      - venueId
      - pointCost
      - onHand
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        venueId:
          type: string
          format: uuid
        merchandiseId:
          type: string
          format: uuid
          nullable: true
          description: 'Links to retail. Redemption depletes stock through the inventory ledger — a prize
            wall running out is a stock problem and should look like one.

            '
        pointCost:
          type: integer
          minimum: 1
        onHand:
          type: integer
        isAvailable:
          type: boolean
        tier:
          type: string
          nullable: true
          description: Small, medium, large, jackpot. Drives prize-wall layout.
        imageAssetRef:
          type: string
          nullable: true
        isActive:
          type: boolean
    PrizeConflictProblem:
      x-ticvai-persistence: none — error shape
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        properties:
          pointsRequired:
            type: integer
          pointsAvailable:
            type: integer
          outOfStock:
            type: array
            items:
              type: object
              properties:
                prizeId:
                  type: string
                  format: uuid
                name:
                  type: string
                requested:
                  type: integer
                onHand:
                  type: integer
    PrizeRedemption:
      x-ticvai-persistence: games.redemption + games.redemption_line
      type: object
      required:
      - id
      - cardCode
      - lines
      - pointsUsed
      - pointsRemaining
      - recordedAt
      properties:
        id:
          type: string
        redemptionNumber:
          type: string
        cardCode:
          type: string
        venueId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            properties:
              prizeId:
                type: string
                format: uuid
              name:
                type: string
              quantity:
                type: integer
              pointCost:
                type: integer
        pointsUsed:
          type: integer
        pointsRemaining:
          type: integer
        stockMovementIds:
          type: array
          description: Movements raised in the inventory ledger.
          items:
            type: string
        issuedByPrincipalId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
