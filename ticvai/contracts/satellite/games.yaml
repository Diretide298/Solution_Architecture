openapi: 3.1.0
info:
  title: TICVAI Games & Redemption
  version: 0.1.0
  x-ticvai-screen-count: 34
  x-ticvai-tier: satellite
  x-ticvai-module: 10 — Games & F&B Integration
  x-ticvai-requirements: 25
  x-ticvai-capabilities:
  - C07
  - C28
  x-ticvai-platforms:
  - P04 POS
  - P06 Venue Staff App
  - P08 Venue Management
  - P02 Guest App
  - Game readers
  - Ticket-eater machines
  description: "## What this contract covers\n**Arcade play, game credits and prize redemption.**\n| |\
    \ | |---|---| | **Tier** | satellite | | **Matrix domain** | 10 — Games & F&B Integration | | **Requirements**\
    \ | ~25 | | **Capabilities** | C07, C28 | | **Consumed by** | P04 POS · P06 Venue Staff App · P08\
    \ Venue Management · P02 Guest App · Game readers · Ticket-eater machines |\n## How to read this file\n\
    **This file is a contract.** It is hand-authored and it is the source of truth for one bounded context:\
    \ server code, client code and mock servers are generated from it, never the other way round. If a\
    \ field is not here, it does not exist.\n**Contracts are split into two tiers.**\n- **Spine** — the\
    \ eight contexts everything else depends on: tenancy, identity,\n  catalogue, orders, shift, access,\
    \ finance, cross-region. Frozen first. A change here\n  requires a formal change request, because every\
    \ satellite has pinned against it.\n- **Satellite** — a domain that builds on the spine and can move\
    \ independently.\n  Cheaper to change.\n\n**`paths` are operations.** Each one declares four TICVAI\
    \ extensions, and Redocly rejects any that does not: `x-ticvai-permission`, `x-ticvai-scope-level`,\
    \ `x-ticvai-offline-capable`, `x-ticvai-conflict-policy`.\n**`components.schemas` are API schemas\
    \ — the shape of data on the wire.** They are not database tables. Roughly 70% of the DDL derives\
    \ from these; the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n## This context\nPositions this encodes:\n- **Credits and prize points are two different\
    \ balances on one card.** Credits buy plays\n  and are bought with money; points are won by playing\
    \ and buy prizes. Conflating them\n  turns a guest who wins into a guest who can play more, which\
    \ is not the same deal.\n- **Both balances are stored value and post to the ledger on load, not on\
    \ spend.** The\n  liability exists the moment a guest pays.\n- **Game readers are a driver, not a\
    \ build.** Card readers on machines report plays\n  through an inbound API, and a named vendor adaptor\
    \ is bespoke work — the same pattern\n  as queue sensors (ADR-0012).\n- **Prize redemption depletes\
    \ retail stock** through the inventory movement ledger. A\n  prize wall running out is a stock problem,\
    \ and it should look like one in reporting.\n- Play recording is offline-capable; prize redemption\
    \ is not, because stock depletes in\n  real time.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: card
- name: game
- name: play
- name: prize
paths:
  /game-cards:
    post:
      operationId: issueGameCard
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
      x-ticvai-audience:
      - staff
      summary: Issue or activate a game card
      description: 'Physical cards are pre-printed and activated at sale; digital cards live in the guest
        app. Either way the card carries two balances, and they are not interchangeable.

        '
      tags:
      - card
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueGameCardRequest'
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCard'
        '409':
          description: Card already active, or the code is unknown
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /reader-profiles:
    put:
      operationId: setReaderProfile
      x-ticvai-consumed-by:
        - "P08 BO-406 Reader Profile & Device Setup"
        - "P08 BO-475 Reader Manufacturer & Model Profile"
        - "P08 BO-476 Communication Protocol Configuration"
      summary: How a reader behaves and what it shows
      description: 'BL-153. **A guest at an arcade machine cannot read a message, they can only see a
        light.**

        Display behaviour per outcome, retry pricing, and a re-tap window — **a second tap because nothing
        appeared to happen is the same play, not a new one.**

        '
      tags:
      - games
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderProfile'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderProfile'
  /game-cards/{cardCode}:
    parameters:
    - name: cardCode
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getGameCard
      x-ticvai-consumed-by:
        - "P01 WEB-021 Wallet & Gift Cards"
        - "P02 GST-026 Retail / Merchandise"
        - "P08 BO-396 Attraction Profile"
        - "P08 BO-454 Card Lifecycle Command Center"
        - "P08 BO-455 Card / Credential Profile"
        - "P08 BO-457 Last Recharge & Last Activity Tracking"
        - "P08 BO-462 Customer Balance & Credential Status View"
        - "P08 BO-486 Customer Card / Wallet Identification"
      x-ticvai-audience:
      - guest
      x-ticvai-read-routing: primary
      summary: Read a card's balances
      description: 'The reader path. Offline-capable so a machine can validate a card during a network
        blip — the balance may be stale, which is why spend is reconciled on sync.

        '
      tags:
      - card
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      security:
      - apiKeyAuth: []
      - bearerAuth: []
      - guestAuth: []
      responses:
        '200':
          description: Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCard'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
  /game-cards/{cardCode}/load:
    parameters:
    - name: cardCode
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: loadGameCredits
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
      x-ticvai-audience:
      - staff
      summary: Load credits onto a card
      description: 'Creates a liability, not revenue. Recognition happens as credits are played, or as
        breakage when the card expires.

        Bonus credits from a promotion are tracked separately because they are typically non-refundable
        and are spent first.

        '
      tags:
      - card
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - credits
              - recordedAt
              properties:
                id:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                credits:
                  type: integer
                  minimum: 1
                bonusCredits:
                  type: integer
                  minimum: 0
                  default: 0
                amountPaid:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                orderId:
                  type: string
                recordedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCard'
  /game-cards/{cardCode}/transfer:
    parameters:
    - name: cardCode
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: transferGameCard
      x-ticvai-audience:
      - staff
      summary: Move balances to another card
      description: 'A damaged or lost card. The source is blocked and its balances move whole — split
        transfers are not offered, because a card with a partial balance and a replacement with the rest
        is a dispute waiting to happen.

        '
      tags:
      - card
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetCardCode
              - reason
              properties:
                targetCardCode:
                  type: string
                reason:
                  type: string
                  enum:
                  - damaged
                  - lost
                  - faulty
                  - guestRequest
                  - upgrade
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Transferred; source blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCard'
        '409':
          description: Target already carries a balance, or either card is blocked
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /games:
    get:
      operationId: listGames
      x-ticvai-consumed-by:
        - "P08 BO-069 Asset Register"
        - "P08 BO-394 Game & Ride Operations Dashboard"
        - "P08 BO-395 Game & Ride Directory"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: List games
      tags:
      - game
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/GameStatus'
      responses:
        '200':
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
    post:
      operationId: createGame
      x-ticvai-audience:
      - staff
      summary: Register a game
      description: 'Bound to an asset where one exists, so a machine taken out of service by maintenance
        stops accepting play rather than swallowing credits.

        '
      tags:
      - game
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Game'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
  /games/{gameId}:
    parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateGame
      x-ticvai-consumed-by:
        - "P08 BO-069 Asset Register"
        - "P08 BO-396 Attraction Profile"
      x-ticvai-audience:
      - staff
      summary: Amend a game
      description: 'Changing credit cost or payout mid-session is refused where plays are in flight —
        a guest who paid three credits should not be charged four on the same visit.

        '
      tags:
      - game
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  maxLength: 200
                creditCost:
                  type: integer
                  minimum: 1
                minPointsAwarded:
                  type: integer
                  minimum: 0
                maxPointsAwarded:
                  type: integer
                  minimum: 0
                status:
                  $ref: '#/components/schemas/GameStatus'
                heightRequirementCm:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
  /game-plays:
    post:
      operationId: recordGamePlay
      x-ticvai-consumed-by:
        - "P08 BO-069 Asset Register"
      x-ticvai-audience:
      - guest
      summary: Record a play
      description: 'Posted by the machine''s card reader. Deducts credits and awards points in one operation.

        **Offline-capable.** An arcade floor loses signal, and a machine that stops taking a card because
        of it is a machine earning nothing. Plays replay on reconnect and are deduplicated on the play
        ID; a play against an exhausted balance is reported for reconciliation rather than silently accepted.

        '
      tags:
      - play
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      security:
      - apiKeyAuth: []
      - serviceAuth: []
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPlayRequest'
      responses:
        '200':
          description: Play recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResult'
        '409':
          description: 'Insufficient credits, card blocked, or the game is out of service.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /game-plays/sync:
    post:
      operationId: syncGamePlays
      x-ticvai-consumed-by:
        - "P08 BO-069 Asset Register"
      x-ticvai-audience:
      - device
      summary: Replay plays recorded offline
      description: 'Ordered batch per reader, idempotent on the play ID. Plays that would overdraw a card
        are reported as divergences rather than rejected outright — the guest already played, and the
        record should say so.

        '
      tags:
      - play
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      security:
      - apiKeyAuth: []
      - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - readerId
              - plays
              properties:
                readerId:
                  type: string
                  format: uuid
                plays:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/RecordPlayRequest'
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                  duplicates:
                    type: integer
                  divergences:
                    type: array
                    items:
                      type: object
                      properties:
                        playId:
                          type: string
                        cardCode:
                          type: string
                        detail:
                          type: string
  /prizes:
    get:
      operationId: listPrizes
      x-ticvai-consumed-by:
        - "P08 BO-445 Redemption Credit Rule Configuration"
        - "P08 BO-450 Prize Catalogue & Credit Cost Configuration"
        - "P08 BO-491 Redemption Balance & Prize Discovery"
      x-ticvai-audience:
      - staff
      x-ticvai-read-routing: replica
      summary: The prize catalogue
      description: 'Point cost and stock. Out-of-stock prizes stay visible with their availability shown
        — hiding them means a child asks for the one thing that vanished.

        '
      tags:
      - prize
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: venueId
        in: query
        schema:
          type: string
          format: uuid
      - name: maxPoints
        in: query
        description: What a guest can afford right now.
        schema:
          type: integer
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Prizes
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Prize'
    post:
      operationId: createPrize
      x-ticvai-consumed-by:
        - "P08 BO-451 Prize Inventory Integration"
      x-ticvai-audience:
      - staff
      summary: Add a prize
      description: 'Links to a merchandise item, so redemption depletes retail stock through the inventory
        ledger. A prize wall running out is a stock problem and should look like one in reporting.

        '
      tags:
      - prize
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prize'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prize'
  /prize-redemptions:
    post:
      operationId: redeemPrize
      x-ticvai-consumed-by:
        - "P08 BO-450 Prize Catalogue & Credit Cost Configuration"
      x-ticvai-audience:
      - staff
      summary: Redeem points for a prize
      description: 'Deducts points and issues the prize, depleting stock in one transaction.

        **Not offline-capable** — stock depletes in real time, the same reason retail is not. A prize
        handed over twice because two terminals both thought it was in stock is a problem no reconciliation
        fixes.

        '
      tags:
      - prize
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - cardCode
              - lines
              - recordedAt
              properties:
                id:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                cardCode:
                  type: string
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - prizeId
                    - quantity
                    properties:
                      prizeId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                recordedAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrizeRedemption'
        '409':
          description: Insufficient points, or a prize is out of stock
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PrizeConflictProblem'
  /game-cards/{cardCode}/adjust:
    parameters:
    - name: cardCode
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: adjustGameCard
      x-ticvai-audience:
      - staff
      summary: Manually adjust credits or points
      description: 'A machine that swallowed a play, a goodwill gesture, a correction. Requires a reason
        and is reported separately — manual adjustments to stored value get the same scrutiny here as
        they do on a wallet.

        '
      tags:
      - card
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                credits:
                  type: integer
                points:
                  type: integer
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCard'
  /attraction-types:
    get:
      operationId: listAttractionTypes
      x-ticvai-consumed-by:
        - "P08 BO-397 Attraction Type Configuration"
      summary: The classes of game and ride
      description: 'Board 1.4. **A type decides which operational settings apply.** A ride has a height
        restriction and a cycle time; a redemption game has a ticket payout; a crane has both a payout
        and a direct-pay price. Shipping one settings page for all three gives every operator the wrong
        form.

        '
      tags:
      - games
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Attraction types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttractionType'
    put:
      operationId: setAttractionType
      x-ticvai-consumed-by:
        - "P08 BO-397 Attraction Type Configuration"
      summary: Define a class of attraction
      tags:
      - games
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttractionType'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttractionType'
  /games/{gameId}/operations:
    parameters:
    - name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setGameOperationalConfiguration
      x-ticvai-consumed-by:
        - "P08 BO-398 Game & Ride Operational Configuration"
      summary: Capacity, cycle time, restrictions and staffing
      description: 'Board 1.5. **Cycle time is the number everything else derives from.** Throughput,
        queue estimates, staffing and the capacity a ticket is sold against all come from *how long one
        go takes and how many people go at once*, and a venue that leaves it blank gets a wait-time
        estimate of nothing.

        Height, age and health restrictions sit here because they are enforced at the reader, not at
        the till — a guest is stopped at the ride, and the rule has to be where the stopping happens.

        '
      tags:
      - games
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameOperationalConfig'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameOperationalConfig'
  /readers:
    get:
      operationId: listReaders
      x-ticvai-consumed-by:
        - "P08 BO-400 Attraction / Reader Mapping"
        - "P08 BO-404 Reader Management Dashboard"
