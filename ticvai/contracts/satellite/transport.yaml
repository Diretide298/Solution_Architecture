  /transport/timetables/{timetableId}/publish:
    parameters:
      - name: timetableId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: publishTransportTimetable
      x-ticvai-consumed-by:
        - "P08 BO-1186 Transport Timetables"
      x-ticvai-audience: [staff]
      summary: Publish a timetable and release its departures
      description: >
        **Generates the departures** for every date from `validFrom` to today plus
        `releaseHorizonDays` (proposed default 30, the prototype's "Timetables are released 30
        days ahead", client to correct (rev 3 REV3-21)), and a nightly job releases one more day
        after that. Each departure is created as a catalogue performance under the route's
        event with `seatCapacity` as its channel capacity (`createPerformances`,
        `createChannelCapacity`), and goes on sale.

        **A published timetable whose dates overlap this one is superseded from this one's
        `validFrom`**; its departures before that date are untouched, and its unsold departures
        on or after it are removed. **A departure with sold seats is never removed** — the
        publish is refused with a 409 listing them, and they are cancelled (`cancelPerformance`)
        or the new `validFrom` moved.

        The route must be `active` and have a fare table.
      tags: [timetable]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
