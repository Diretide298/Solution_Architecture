      summary: Define a multi-trip or unlimited pass
      description: >
        **Creates the catalogue product** (kind `openDated`) whose entitlement carries
        `entriesAllowed` = `trips` (null for unlimited) and a validity of `validityDays` from
        first use or purchase. Each boarding with the pass consumes one entry at the driver's
        scan (`access`).

        **Pass types are the venue's own configuration** (decided 29 September, rev 3 REV3-21: the network is operator configuration). The prototype's four are seed data
        for the demo tenant, not a default: 5-trip, valid 30 days, ×4.5 the single fare; 10-trip,
        valid 60 days, ×8.5; weekly unlimited, 7 days, ×11 (compared with 14 trips); monthly
        unlimited, 30 days, ×38 (compared with 60 trips). A pass is valid between the two stations it was bought for, either direction.
      tags: [pass]
      x-ticvai-permission: TRANSPORT_PRICE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
