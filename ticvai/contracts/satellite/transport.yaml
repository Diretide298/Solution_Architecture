openapi: 3.1.0
info:
  title: TICVAI Transport Ticketing
  version: 0.1.0
  x-ticvai-screen-count: 31
  x-ticvai-tier: satellite
  x-ticvai-module: "1 — Ticketing Catalogue (Transport)"
  x-ticvai-platforms:
    - "P01 Guest Web"
    - "P02 Guest App"
    - "P08 Venue Management"
  description: >
    ## What this contract covers

    **Scheduled transport ticketing: stations, routes, timetabled departures, fares, one-way
    tickets, multi-trip passes, favourite routes and a route map.** In scope as decided 29
    September, rev 3 REV3-21. The client drew it as a new venue type, *Emirates Link*
    (intercity coaches, Sharjah – Dubai – Abu Dhabi, line E101), in the rev 3 guest
    prototype (`sources/designs/guest-rev3-28-september`, client response item 21), laid out
    after the RTA booking screen: three steps (Route & Schedule, Seat Selection, Payment), the
    One-way Trip / Multi-Trip / Favourite tabs, one search row, **Search Trips** and **Next
    Available Trip**.

    | | |
    |---|---|
    | **Tier** | satellite |
    | **Service** | VenueOpsService (licensed as an optional module, venue-scoped, not the sale path) |
    | **Schema** | `transport` |
    | **Consumed by** | P01 Guest Web · P02 Guest App · P08 Venue Management |

    **The network is operator configuration, not an open value** (decided 29 September, rev 3
    REV3-21, restated the same day; this replaces the earlier "the client owes the real network").
    A venue enters its own stations, routes and stops, fares and passenger types, pass types and
    timetables in Venue Management through the setup operations below, like every other module,
    one at a time or in bulk with `importTransportNetwork` (a CSV bundle or a GTFS feed, validated
    into a preview and then applied, the import-then-publish pattern of the venue map). **The
    prototype's Emirates Link sample** — nine stations on E101, a fare of AED 5 plus AED 2.50 per
    stop, the four passenger types, the four pass types and 23 departures a day — is **seed data
    for the demo tenant, not a default**: a new venue starts with an empty network. Values below
    marked *proposed, client to correct* are behaviour defaults (release horizon, boarding close,
    time periods), not network data.

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or a
    guest/public read (`x-ticvai-audience: [guest, public]`), which returns published data only.

    ## Why this is its own context, and what it does not own

    **A trip is priced by where you get on and where you get off.** Nothing in `catalogue`
    prices by a pair of stops: a performance has one price list, and a fare that is a base
    plus a per-stop amount, times a passenger multiplier, is a fare table rather than a price
    list. A route with ordered stops and offsets, and a timetable that generates departures
    for a release horizon, have no home in `catalogue` either.

    **What it deliberately reuses, so there is one purchase path, not two:**

    - **A departure is a catalogue `Performance`.** Publishing a timetable creates one
      performance per departure under the route's catalogue `Event`, with the coach's seat
      count as its `ChannelCapacity`. Seats are held with `acquireInventoryHold` and sold
      through the cart like any timed ticket, seat maps included (the prototype's Seat
      Selection step is `seating` on that performance). **Seats left is catalogue's
      availability, read, never a second counter here.**
    - **A one-way ticket is a cart line and an order line.** The route owns one catalogue
      product (kind `timedAdmission`) with one variant per passenger type. The cart line
      carries `performanceId` (the departure) and, in `attributes.transport`, the route and
      the boarding and alighting stations; the order service prices it by calling
      `quoteTransportFare`. The ticket is an ordinary `access` entitlement shown as a QR to
      the driver.
    - **A multi-trip pass is a catalogue product of kind `openDated`.** Its entitlement
      carries `entriesAllowed` (5 or 10, null for unlimited) and a validity window — the
      mechanism `ProductKind.openDated` already describes. Its price is the fare between the
      two chosen stations times the pass type's multiplier, quoted here.
    - **Cancelling a departure is `cancelPerformance`** in `catalogue`, with its approval rule
      and its `performance-cancelled` event, which refunds and notifies the guests. This
      context moves the departure to `cancelled` on that event.

    **Not the vehicle.** A coach is a `resources` resource of kind `vehicle`; a departure may
    name one. **Not the refund or change policy** — "change your trip free up to two hours
    before departure" is the venue's order modification policy in `orders`.

    ## The seat is held for the whole run

    **Proposed, client to correct (rev 3 REV3-21).** A passenger from Union Square to Mall of
    the Emirates holds one seat on the departure from its origin to its end, not only between
    the two stops. It keeps one capacity per departure, which is what a catalogue performance
    has and what a seat map can show. Reselling a seat after a passenger alights is a per-leg
    inventory the prototype does not draw and the client has not asked for.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: station
  - name: route
  - name: fare
  - name: timetable
  - name: departure
  - name: pass
  - name: favourite
  - name: networkImport

paths:
  # ---------------------------------------------------------------- stations
  /transport/stations:
    get:
      operationId: listTransportStations
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-076 Intercity Trip — Route & Schedule"
        - "P02 GST-078 Intercity Trip — Multi-trip Passes"
        - "P08 BO-1183 Transport Stations"
        - "P08 BO-1184 Transport Routes & Stops"
      x-ticvai-audience: [guest, public, staff]
      x-ticvai-read-routing: replica
      summary: Stations of a venue's transport network
      description: >
        The From and To station menus (decided 29 September, rev 3 REV3-21). A guest or public
        caller sees active stations only, ordered by `name`. **`includeInactive` is honoured only
        for a caller holding `TRANSPORT_VIEW`** — the setup list in Venue Management — and is
        ignored for anyone else.

        **The station list is the venue's own configuration**, entered here or with
        `importTransportNetwork` (decided 29 September, rev 3 REV3-21: the network is operator configuration). The nine E101 stations of the prototype (Sharjah Al Jubail
        to Abu Dhabi Central) are seed data for the demo tenant, not a default.
      tags: [station]
      x-ticvai-permission: null   # guest/public read of published network data
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - name: venueId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Stations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Station' }

    post:
      operationId: createTransportStation
      x-ticvai-consumed-by:
        - "P08 BO-1183 Transport Stations"
      x-ticvai-audience: [staff]
      summary: Add a station
      description: >
        Venue Management transport setup (decided 29 September, rev 3 REV3-21). **A station
        carries coordinates** because the route map places it; a station without them is shown
        in the stop list and left off the map.
      tags: [station]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStationRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '../shared/common.yaml#/components/responses/DuplicateCode' }

  /transport/stations/{stationId}:
    parameters:
      - name: stationId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    patch:
      operationId: updateTransportStation
      x-ticvai-consumed-by:
        - "P08 BO-1183 Transport Stations"
      x-ticvai-audience: [staff]
      summary: Amend or deactivate a station
      description: >
        **A station on an active route cannot be deactivated** — the route would offer a stop
        nobody can book. Remove it from the route first, or suspend the route. The refusal is a
        409 naming the routes.
      tags: [station]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/LocalisedText' }
                shortName: { $ref: '#/components/schemas/LocalisedText' }
                latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
                longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
                active: { type: boolean }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: The station is a stop on one or more active routes and cannot be deactivated.
          x-ticvai-problem-types: [station-on-active-route]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- routes
  /transport/routes:
    get:
      operationId: listTransportRoutes
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-076 Intercity Trip — Route & Schedule"
        - "P08 BO-1184 Transport Routes & Stops"
        - "P08 BO-1185 Transport Fares & Passenger Types"
        - "P08 BO-1186 Transport Timetables"
        - "P08 BO-1187 Transport Departure Board"
        - "P08 BO-1188 Transport Pass Types"
      x-ticvai-audience: [guest, public, staff]
      x-ticvai-read-routing: replica
      summary: Routes, optionally those serving a pair of stations
      description: >
        With `fromStationId` and `toStationId`, returns the active routes on which the first
        station comes **before** the second — the direction of travel. A line run both ways is
        two routes (`E101` outbound and inbound) paired by `pairedRouteId`, so the swap button
        on the search row lands on the paired route (decided 29 September, rev 3 REV3-21).

        A guest or public caller sees `active` routes only; `status` is honoured only for a
        caller holding `TRANSPORT_VIEW`.
      tags: [route]
      x-ticvai-permission: null   # guest/public read of published network data
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - name: venueId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: fromStationId
          in: query
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        - name: toStationId
          in: query
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransportRouteStatus' }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Routes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TransportRoute' }

    post:
      operationId: createTransportRoute
      x-ticvai-consumed-by:
        - "P08 BO-1184 Transport Routes & Stops"
      x-ticvai-audience: [staff]
      summary: Define a route with its ordered stops
      description: >
        Created as `draft`. **Creating a route creates its catalogue side** — a catalogue
        `Event` its departures become performances of, and one product of kind
        `timedAdmission` whose variants are the fare table's passenger types — so a one-way
        ticket is sold through the ordinary cart (decided 29 September, rev 3 REV3-21). The
        catalogue ids come back on the route and are not written by the caller.

        **Stops are ordered and carry an offset** in minutes from the first stop; the first
        stop's offset is 0 and offsets strictly increase. Arrival time and duration on a
        departure card are the difference of two offsets.
      tags: [route]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransportRouteRequest' }
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created as draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportRoute' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '../shared/common.yaml#/components/responses/DuplicateCode' }
        '422':
          description: >
            Fewer than two stops, a station repeated, a station that is inactive or not in this
            venue, or offsets that do not start at 0 and strictly increase.
          x-ticvai-problem-types: [route-stops-invalid]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /transport/routes/{routeId}:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getTransportRoute
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-077 Intercity Trip — Route & Passengers"
        - "P08 BO-1184 Transport Routes & Stops"
      x-ticvai-audience: [guest, public, staff]
      x-ticvai-read-routing: replica
      summary: A route with its stops
      description: >
        The stop list from origin to end. A guest or public caller gets 404 for a route that is
        not `active`.
      tags: [route]
      x-ticvai-permission: null   # guest/public read of published network data
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      security:
        - guestAuth: []
        - bearerAuth: []
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportRoute' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    patch:
      operationId: updateTransportRoute
      x-ticvai-consumed-by:
        - "P08 BO-1184 Transport Routes & Stops"
      x-ticvai-audience: [staff]
      summary: Amend a route
      description: >
        **Stops can change only while no published timetable covers a future date.** Every
        departure already on sale was generated from the old stop offsets, and a ticket sold to
        a stop that no longer exists is a refund. Withdraw the timetable first; the refusal is
        a 409. Name, colour and booking cut-off change at any time.
      tags: [route]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/LocalisedText' }
                colour: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                pairedRouteId:
                  type: string
                  pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
                  nullable: true
                bookingCutoffMinutes: { type: integer, minimum: 0, maximum: 1440 }
                stops:
                  type: array
                  minItems: 2
                  items: { $ref: '#/components/schemas/RouteStopInput' }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportRoute' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: Stops changed while a published timetable covers a future date.
          x-ticvai-problem-types: [route-has-published-timetable]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: Invalid stops, as on `createTransportRoute`.
          x-ticvai-problem-types: [route-stops-invalid]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /transport/routes/{routeId}/status:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    put:
      operationId: setTransportRouteStatus
      x-ticvai-consumed-by:
        - "P08 BO-1184 Transport Routes & Stops"
      x-ticvai-audience: [staff]
      summary: Activate, suspend or retire a route
      description: >
        `draft` → `active` needs a fare table and at least two stops with coordinates or not
        (the map omits a stop without them). `active` → `suspended` stops new sales and keeps
        sold tickets valid. **Retiring is refused while a departure on sale has sold seats** —
        cancel those departures (`cancelPerformance`) first. See `states/transport-route.yaml`.

        **PUT semantics.** The target is the route in the path; this never creates one.
      tags: [route]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TransportRouteStatus' }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Status set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportRoute' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: >
            The transition is not allowed from the current status, the route has no fare table,
            or retiring a route with sold seats on a departure still on sale.
          x-ticvai-problem-types: [route-transition-refused, route-has-no-fare-table, route-has-sold-departures]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /transport/routes/{routeId}/map:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getTransportRouteMap
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-077 Intercity Trip — Route & Passengers"
      x-ticvai-audience: [guest, public]
      x-ticvai-read-routing: replica
      summary: The route drawn for a map, with the journey highlighted
      description: >
        The stop list from departure to arrival and the street map beside it (decided 29
        September, rev 3 REV3-21). Every stop comes back with its coordinates, its order and
        whether it lies on the journey; the boarding and alighting stops are flagged, so the
        client draws the departure pin, the arrival pin and the highlighted segment. With no
        `fromStationId`/`toStationId`, nothing is highlighted.

        **The map tiles are the client's, not this operation's.** The street map needs an
        internet connection and a third-party tile provider, which is an external dependency
        needing approval under audit R038; the stop list and the schematic line need neither and
        are what an offline device shows.
      tags: [route]
      x-ticvai-permission: null   # guest/public read of published network data
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      security:
        - guestAuth: []
        - bearerAuth: []
      parameters:
        - name: fromStationId
          in: query
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        - name: toStationId
          in: query
          schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Route map
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteMap' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '422':
          description: A station is not on this route, or the alighting stop comes before the boarding stop.
          x-ticvai-problem-types: [stations-not-on-route]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  # ---------------------------------------------------------------- fares
  /transport/routes/{routeId}/fare-table:
    parameters:
      - name: routeId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getTransportFareTable
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-077 Intercity Trip — Route & Passengers"
        - "P08 BO-1185 Transport Fares & Passenger Types"
      x-ticvai-audience: [guest, public, staff]
      x-ticvai-read-routing: replica
      summary: A route's fares and passenger types
      description: >
        The passenger picker reads its types from here (adult, child, student, person of
        determination), with the proof each asks for. 404 when the route has none yet.
      tags: [fare]
      x-ticvai-permission: null   # guest/public read of published network data
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      security:
        - guestAuth: []
        - bearerAuth: []
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Fare table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareTable' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

    put:
      operationId: setTransportFareTable
      x-ticvai-consumed-by:
        - "P08 BO-1185 Transport Fares & Passenger Types"
      x-ticvai-audience: [staff]
      summary: Set a route's fares and passenger types
      description: >
        Replaces the route's fare table as a whole (decided 29 September, rev 3 REV3-21). **A
        change applies to sales from `effectiveFrom`; a ticket already sold keeps its price.**
        Adding or removing a passenger type adds or retires the matching variant on the route's
        catalogue product.

