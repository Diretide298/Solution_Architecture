        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  # ---------------------------------------------------------------- favourites
  /transport/favourite-routes:
    get:
      operationId: listMyFavouriteRoutes
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-079 Intercity Trip — Favourite Routes"
      x-ticvai-audience: [guest]
      x-ticvai-read-routing: primary
      summary: The caller's saved routes
      description: >
        The Favourites tab (decided 29 September, rev 3 REV3-21): each saved pair of stations
        with its current adult fare and **Book this route**, which fills the one-way search.
        Scoped to the caller; newest first.
      tags: [favourite]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - name: venueId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Saved routes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FavouriteRoute' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }

    post:
      operationId: saveFavouriteRoute
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-077 Intercity Trip — Route & Passengers"
      x-ticvai-audience: [guest]
      summary: Save route
      description: >
        **Save route** on the one-way tab. One favourite per guest per pair of stations in this
        direction: saving it again returns the existing one with 200. **At most 20 per guest per
        venue, proposed, client to correct (rev 3 REV3-21)**; the 21st is a 409.
      tags: [favourite]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, fromStationId, toStationId]
              properties:
                venueId: { type: string, format: uuid }
                fromStationId: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                toStationId: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
                label: { type: string, maxLength: 60, nullable: true }
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          description: Already saved; the existing favourite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavouriteRoute' }
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavouriteRoute' }
        '409':
          description: The guest already has the maximum number of saved routes.
          x-ticvai-problem-types: [favourite-limit-reached]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '422':
          description: The stations are the same, or no active route serves them in this order.
          x-ticvai-problem-types: [stations-not-on-route]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /transport/favourite-routes/{favouriteId}:
    parameters:
      - name: favouriteId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    delete:
      operationId: deleteFavouriteRoute
      x-ticvai-consumed-by:
        - "P01 WEB-049 Transport — Route & Schedule"
        - "P02 GST-079 Intercity Trip — Favourite Routes"
      x-ticvai-audience: [guest]
      summary: Remove a saved route
      tags: [favourite]
      x-ticvai-permission: null   # a guest session. Reads and writes the guest’s own data only
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
        - guestAuth: []
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '204':
          description: Removed
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
  # ---------------------------------------------------------------- network import
  /transport/network-imports:
    post:
      operationId: importTransportNetwork
      x-ticvai-consumed-by:
        - "P08 BO-1189 Transport Network Import"
      x-ticvai-audience: [staff]
      summary: Read a network file into a preview
      description: >
        **Bulk entry of a venue's network** — stations, routes with their ordered stops, and
        timetables — for an operator with more than a handful to type (decided 29 September,
        rev 3 REV3-21: the network is operator configuration entered in Venue Management, not
        an open value from the client). The same import-then-publish pattern as the venue map
        (`venue-map.importVenueGeometry`): **nothing is written to the network until a person
        applies the preview**, and applying never puts anything on sale.

        **Two formats.** `csvBundle`: a zip of four CSV files, header on row 1, UTF-8 —
        `stations.csv` (code, name, nameAr, latitude, longitude), `routes.csv` (code, lineCode,
        name, pairedRouteCode), `route_stops.csv` (routeCode, sequence, stationCode,
        offsetMinutes) and `timetables.csv` (routeCode, validFrom, validTo, daysOfWeek,
        departureTimes, seatCapacity). `gtfs`: a GTFS static feed (`stops.txt`, `routes.txt`,
        `trips.txt`, `stop_times.txt`, `calendar.txt`); stops become stations, each route and
        direction a route (the two directions paired), a representative trip's stop times the
        stop offsets, and the trips' first departure times by service calendar the timetable
        runs. **Fares are not imported** — they are set with `setTransportFareTable` by a
        holder of `TRANSPORT_PRICE`, the same separation as the permissions.

        **The file is uploaded first, through `assets`** (`createUpload`, the signed URL,
        `completeUpload`), and its `MediaAsset.id` is `sourceRef`, as for the venue map.
        Uploading needs `ASSET_LIBRARY_MANAGE` as well.

        **Returns `202` with the import, which is `validating`.** Poll
        `getTransportNetworkImport` until it is `previewReady` or `failed`. Stations match
        existing ones by `code` and routes by `code`: a match is an update, anything else is
        new. A file that yields no station, route or timetable is `failed` with
        `nothingFound`, never an empty success.
      tags: [networkImport]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportTransportNetworkRequest' }
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Accepted; the file is being validated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportNetworkImport' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '422':
          description: The asset is not ready, not in this venue, or not a zip.
          x-ticvai-problem-types: [asset-not-ready, asset-not-a-zip]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /transport/network-imports/{importId}:
    parameters:
      - name: importId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getTransportNetworkImport
      x-ticvai-consumed-by:
        - "P08 BO-1189 Transport Network Import"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: primary
      summary: An import's status, preview counts and findings
      description: >
        What the file would change — stations, routes, stops and timetables to create and to
        update — and every finding, so the setup screen can show the preview before anyone
        applies it (rev 3 REV3-21). Read from the primary because it is polled while the
        import validates.
      tags: [networkImport]
      x-ticvai-permission: TRANSPORT_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportNetworkImport' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /transport/network-imports/{importId}/apply:
    parameters:
      - name: importId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: applyTransportNetworkImport
      x-ticvai-consumed-by:
        - "P08 BO-1189 Transport Network Import"
      x-ticvai-audience: [staff]
      summary: Apply a previewed import to the network
      description: >
        **A person applies; the import never applies itself** (rev 3 REV3-21, the venue-map
        pattern). Writes the preview in one transaction: stations created or updated, routes
        created as `draft` with their stops, a `draft` route's stops replaced, and timetables
        created as `draft`. **Nothing goes on sale**: a route is still activated with
        `setTransportRouteStatus`, it still needs a fare table, and a timetable is still
        published with `publishTransportTimetable`.

        **An `active` route's stops are never changed by an import** — a sold ticket names its
        stops. The preview reports `routeActiveStopsChanged` and the apply skips that route's
        stops, as `updateTransportRoute` would refuse them.

        Refused `409` while the import has any `error` finding, is not `previewReady`, or the
        network changed after validation (the preview no longer describes what would happen;
        import the file again).
      tags: [networkImport]
      x-ticvai-permission: TRANSPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Applied, with what was written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportNetworkImport' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: Not `previewReady`, has error findings, or the network changed since validation.
          x-ticvai-problem-types: [import-not-ready, import-has-errors, import-stale]
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

components:
  schemas:
    TransportNetworkImportStatus:
      type: string
      description: >
        `validating` → `previewReady` or `failed`; `previewReady` → `applied`, or `expired`
        after 7 days unapplied (proposed, client to correct). States in
        `states/transport-network-import.yaml` (rev 3 REV3-21).
      enum: [validating, previewReady, failed, applied, expired]

    ImportTransportNetworkRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [format, sourceRef]
      properties:
        format:
          type: string
          enum: [csvBundle, gtfs]
          description: A zip of the four CSV files described on `importTransportNetwork`, or a GTFS static feed.
        sourceRef:
          type: string
          format: uuid
          description: The uploaded file, as the `MediaAsset.id` from `assets.completeUpload`. Never a URL.
          x-ticvai-references: assets.MediaAsset
        include:
          type: array
          uniqueItems: true
          description: Which parts of the file to read. Absent reads all three.
          items: { type: string, enum: [stations, routes, timetables] }

    TransportNetworkImportFinding:
      x-ticvai-persistence: "none — stored as jsonb on transport.network_import.findings"
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum:
            - nothingFound
            - fileMissing
            - headerMismatch
            - stationCodeDuplicate
            - stationCoordinatesMissing
            - routeCodeDuplicate
            - routeStopUnknownStation
            - routeOffsetsNotIncreasing
            - routePairUnknown
            - routeActiveStopsChanged
            - timetableRouteUnknown
            - timetableTimeInvalid
            - timetableDatesInvalid
            - gtfsCalendarUnsupported
          description: >
            `stationCoordinatesMissing` is a warning (the station is listed and left off the
            map); `routeActiveStopsChanged` is a warning (those stops are skipped); every other
            code is an error and blocks the apply.
        severity: { type: string, enum: [error, warning] }
        file: { type: string, nullable: true, description: 'e.g. `route_stops.csv` or `stop_times.txt`.' }
        row: { type: integer, minimum: 1, nullable: true }
        reference: { type: string, nullable: true, description: The station, route or timetable code concerned. }
        message: { type: string, maxLength: 500 }

    TransportNetworkImport:
      x-ticvai-persistence: "transport.network_import"
      type: object
      required: [id, venueId, format, sourceRef, status]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        venueId: { type: string, format: uuid, readOnly: true }
        format: { type: string, enum: [csvBundle, gtfs] }
        sourceRef:
          type: string
          format: uuid
          x-ticvai-references: assets.MediaAsset
        status: { $ref: '#/components/schemas/TransportNetworkImportStatus' }
        preview:
          type: object
          nullable: true
          readOnly: true
          description: What applying would write. Null until `previewReady`.
          properties:
            stationsToCreate: { type: integer, minimum: 0 }
            stationsToUpdate: { type: integer, minimum: 0 }
            routesToCreate: { type: integer, minimum: 0 }
            routesToUpdate: { type: integer, minimum: 0 }
            stopsToWrite: { type: integer, minimum: 0 }
            timetablesToCreate: { type: integer, minimum: 0 }
        findings:
          type: array
          readOnly: true
          maxItems: 1000
          items: { $ref: '#/components/schemas/TransportNetworkImportFinding' }
        createdBy: { type: string, format: uuid, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        appliedBy: { type: string, format: uuid, nullable: true, readOnly: true }
        appliedAt: { type: string, format: date-time, nullable: true, readOnly: true }
    LocalisedText:
      type: object
      additionalProperties: { type: string }

    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      x-ticvai-persistence-column: text
      description: A ULID. **Stored as text, like every other ULID key in the package** (system-design review
        SD-009, 29 September); without this column type every transport key landed as jsonb.

    TransportRouteStatus:
      type: string
      enum: [draft, active, suspended, retired]

    TransportTimetableStatus:
      type: string
      enum: [draft, published, superseded, withdrawn]

    TransportDepartureStatus:
      type: string
      description: >
        Mirrors the catalogue performance behind the departure, in the words a coach operator
        uses. `soldOut` is computed from availability, never set.
      enum: [scheduled, onSale, soldOut, departed, cancelled]

    TimePeriod:
      type: string
      description: >
        Proposed, client to correct (rev 3 REV3-21): `morning` 05:00–11:59, `afternoon`
        12:00–16:59, `evening` 17:00–20:59, `night` 21:00–04:59.
      enum: [morning, afternoon, evening, night]

    FareModel:
      type: string
      description: >
        `stopCount`: base plus an amount per stop travelled — the prototype's rule. `matrix`: a
        fare for each pair of stops, for a network whose fares are zonal or negotiated. Which
        one a route uses is the venue's choice in `setTransportFareTable` (rev 3 REV3-21).
      enum: [stopCount, matrix]

    CreateStationRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [venueId, code, name]
      properties:
        venueId: { type: string, format: uuid }
        code:
          type: string
          maxLength: 32
          x-ticvai-unique: venue
          description: Short operator code, e.g. `SHJ-JUB`. Unique in the venue.
        name: { $ref: '#/components/schemas/LocalisedText' }
        shortName:
          $ref: '#/components/schemas/LocalisedText'
          description: The label on the route diagram and the map pin (`Union Sq`, `MoE`).
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }

    Station:
      x-ticvai-persistence: "transport.station"
      allOf:
        - $ref: '#/components/schemas/CreateStationRequest'
        - type: object
          required: [id, active]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            active: { type: boolean, default: true }

    RouteStopInput:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [stationId, offsetMinutes]
      properties:
        stationId: { $ref: '#/components/schemas/Ulid' }
        offsetMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: >
            Minutes after the departure from the first stop that the coach leaves this one. 0 on
            the first stop; strictly increasing along the route.
        boardingAllowed: { type: boolean, default: true }
        alightingAllowed: { type: boolean, default: true }

    RouteStop:
      x-ticvai-persistence: "transport.route_stop"
      allOf:
        - $ref: '#/components/schemas/RouteStopInput'
        - type: object
          required: [id, sequence]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            sequence: { type: integer, minimum: 1, description: 1 for the origin. }
            station: { $ref: '#/components/schemas/Station' }

    CreateTransportRouteRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [venueId, code, name, stops]
      properties:
        venueId: { type: string, format: uuid }
        code:
          type: string
          maxLength: 32
          x-ticvai-unique: venue
          description: The line and direction, e.g. `E101-Out`. Unique in the venue.
        lineCode:
          type: string
          maxLength: 16
          description: The public line number shared by both directions, e.g. `E101`.
        name: { $ref: '#/components/schemas/LocalisedText' }
        colour: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        pairedRouteId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          nullable: true
          description: The same line run the other way. The swap button lands on it.
        bookingCutoffMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 5
          description: >
            How long before a departure leaves the boarding stop that online sale stops.
            Proposed default 5, from the prototype's "Boarding closes five minutes before
            departure", client to correct (rev 3 REV3-21).
        stops:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: '#/components/schemas/RouteStopInput' }

    TransportRoute:
      x-ticvai-persistence: "transport.route + transport.route_stop"
      allOf:
        - $ref: '#/components/schemas/CreateTransportRouteRequest'
        - type: object
          required: [id, status]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            status: { $ref: '#/components/schemas/TransportRouteStatus' }
            stops:
              type: array
              items: { $ref: '#/components/schemas/RouteStop' }
            totalMinutes:
              type: integer
              readOnly: true
              description: The last stop's offset.
            catalogueEventId:
              type: string
              format: uuid
              readOnly: true
              description: The catalogue event its departures are performances of. Created with the route.
            catalogueProductId:
              type: string
              format: uuid
              readOnly: true
              description: >
                The one-way trip product (kind `timedAdmission`); one variant per passenger type.
                Created with the route.

    RouteMap:
      x-ticvai-persistence: "none — projection"
      type: object
      required: [routeId, stops]
      properties:
        routeId: { $ref: '#/components/schemas/Ulid' }
        lineCode: { type: string }
        colour: { type: string }
        stops:
          type: array
          description: Every stop in route order.
          items:
            type: object
            required: [stationId, sequence, name, onJourney]
            properties:
              stationId: { $ref: '#/components/schemas/Ulid' }
              sequence: { type: integer }
              name: { type: string, description: Localised to the caller. }
              shortName: { type: string }
              latitude: { type: number, nullable: true }
              longitude: { type: number, nullable: true }
              offsetMinutes: { type: integer }
              onJourney: { type: boolean, description: Between the boarding and alighting stops, inclusive. }
              isBoarding: { type: boolean }
              isAlighting: { type: boolean }
        intermediateStopCount:
          type: integer
          description: Stops between boarding and alighting — the number behind "Show full route (n stops)".
        bounds:
          type: object
          nullable: true
          description: The box around the stops with coordinates, for the map's initial view.
          properties:
            south: { type: number }
            west: { type: number }
            north: { type: number }
            east: { type: number }

    PassengerType:
      x-ticvai-persistence: "transport.fare_passenger_type"
      type: object
      required: [code, name, fareMultiplier]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-zA-Z0-9]{0,31}$'
          description: '`adult`, `child`, `student`, `determination`. Unique in the fare table.'
        name: { $ref: '#/components/schemas/LocalisedText' }
        description:
          $ref: '#/components/schemas/LocalisedText'
          description: What the picker shows under the name ("Age 5–11 · half fare").
        fareMultiplier:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the adult fare, set by the venue. The demo tenant's seed is 1 adult, 0.5 child and student, 0 person of determination (seed data, not a default).
        minAge: { type: integer, minimum: 0, nullable: true }
        maxAge: { type: integer, minimum: 0, nullable: true }
        proofRequired:
          $ref: '#/components/schemas/LocalisedText'
          nullable: true
          description: Checked by the driver at boarding ("Valid student card", "Sanad card").
        isDefault:
          type: boolean
          default: false
          description: The type a new search starts with, one of it. Exactly one per table.
        catalogueVariantId:
          type: string
          format: uuid
          readOnly: true
          description: The variant of the route's trip product this type is sold as.

    SetFareTableRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [model, passengerTypes, effectiveFrom]
      properties:
        model: { $ref: '#/components/schemas/FareModel' }
        baseFare:
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: '`stopCount` only. Set by the venue; AED 5 in the demo tenant''s seed data, not a default (rev 3 REV3-21).'
        perStopFare:
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: '`stopCount` only. Set by the venue; AED 2.50 in the demo tenant''s seed data, not a default (rev 3 REV3-21).'
        matrix:
          type: array
          description: '`matrix` only. One adult fare per ordered pair of stops the route serves; the reverse pair is its own row.'
          items:
            type: object
            required: [fromStationId, toStationId, fare]
            properties:
              fromStationId: { $ref: '#/components/schemas/Ulid' }
              toStationId: { $ref: '#/components/schemas/Ulid' }
              fare: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        passengerTypes:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/PassengerType' }
        effectiveFrom: { type: string, format: date-time }

    FareTable:
      x-ticvai-persistence: "transport.fare_table + transport.fare_passenger_type + transport.fare_matrix_cell"
      allOf:
        - $ref: '#/components/schemas/SetFareTableRequest'
        - type: object
          required: [id, routeId]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            routeId: { $ref: '#/components/schemas/Ulid' }

    FareQuoteRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [fromStationId, toStationId]
      properties:
        routeId:
          $ref: '#/components/schemas/Ulid'
          description: Omitted, the active route serving the two stations in this order.
        fromStationId: { $ref: '#/components/schemas/Ulid' }
        toStationId: { $ref: '#/components/schemas/Ulid' }
        passengers:
          type: array
          maxItems: 10
          description: Omitted, one of the default type. Ignored with `passTypeId`.
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer, minimum: 0, maximum: 99 }
        passTypeId: { $ref: '#/components/schemas/Ulid' }
        at:
          type: string
          format: date-time
          description: The sale instant the fare table is read at. Default now.

    FareQuote:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [routeId, stopsTravelled, adultFare, total]
      properties:
        routeId: { $ref: '#/components/schemas/Ulid' }
        stopsTravelled: { type: integer, minimum: 1 }
        adultFare: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        lines:
          type: array
          items:
            type: object
            required: [code, count, unitPrice, lineTotal]
            properties:
              code: { type: string }
              catalogueVariantId: { type: string, format: uuid }
              count: { type: integer }
              unitPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              lineTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        passTypeId: { $ref: '#/components/schemas/Ulid' }
        saving:
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: With `passTypeId`, single adult fare × `referenceTrips` minus the pass price.
        total: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    TimetableRun:
      x-ticvai-persistence: "transport.timetable_run"
      type: object
      required: [departsAt, days]
      properties:
        departsAt:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Venue local time, 24-hour `HH:MM`, at the route's first stop.
        days:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }

    CreateTimetableRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [name, validFrom, seatCapacity, runs]
      properties:
        name: { type: string, maxLength: 120 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date, nullable: true }
        releaseHorizonDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: >
            How many days ahead departures go on sale. Proposed default 30, from the prototype,
            client to correct (rev 3 REV3-21).
        seatCapacity:
          type: integer
          minimum: 1
          maximum: 200
          description: Seats per departure, unless a departure overrides it.
        seatMapId:
          type: string
          format: uuid
          nullable: true
          description: The coach seat map for Seat Selection (`seating`). Null sells unallocated seats.
        runs:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/TimetableRun' }

    Timetable:
      x-ticvai-persistence: "transport.timetable + transport.timetable_run"
      allOf:
        - $ref: '#/components/schemas/CreateTimetableRequest'
        - type: object
          required: [id, routeId, status]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            routeId: { $ref: '#/components/schemas/Ulid' }
            status: { $ref: '#/components/schemas/TransportTimetableStatus' }
            publishedAt: { type: string, format: date-time, nullable: true, readOnly: true }
            releasedThrough:
              type: string
              format: date
              nullable: true
              readOnly: true
              description: The last date whose departures have been generated.
            supersededById: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', nullable: true, readOnly: true }

    Departure:
      x-ticvai-persistence: "transport.departure"
      type: object
      required: [id, routeId, timetableId, performanceId, serviceDate, departsAt, status, seatCapacity]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        routeId: { $ref: '#/components/schemas/Ulid' }
        timetableId: { $ref: '#/components/schemas/Ulid' }
        performanceId:
          type: string
          format: uuid
          description: The catalogue performance this departure is sold as. Cart lines carry it.
        serviceDate: { type: string, format: date }
        departsAt:
          type: string
          format: date-time
          description: At the route's first stop.
        status: { $ref: '#/components/schemas/TransportDepartureStatus' }
        seatCapacity: { type: integer, minimum: 1 }
        seatsSold:
          type: integer
          readOnly: true
          x-ticvai-persisted: false
          description: From catalogue availability on read; not stored here.
        vehicleResourceId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }

    DepartureOffer:
      x-ticvai-persistence: "none — projection"
      type: object
      required: [departureId, performanceId, routeId, departsAt, arrivesAt, durationMinutes, seatsLeft, fare, period]
      properties:
        departureId: { $ref: '#/components/schemas/Ulid' }
        performanceId: { type: string, format: uuid }
        routeId: { $ref: '#/components/schemas/Ulid' }
        routeCode: { type: string, description: 'The price card''s label, e.g. `E101-Out`.' }
        departsAt: { type: string, format: date-time, description: At the boarding stop. }
        arrivesAt: { type: string, format: date-time, description: At the alighting stop. }
        durationMinutes: { type: integer, minimum: 0 }
        period: { $ref: '#/components/schemas/TimePeriod' }
        seatsLeft:
          type: integer
          minimum: 0
          description: Catalogue availability for the performance. Display only; the hold decides the sale.
        fitsParty: { type: boolean }
        fare:
          $ref: '../shared/common.yaml#/components/schemas/Money'
          description: One adult, one way.
        partyTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    CreatePassTypeRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [venueId, code, name, kind, fareMultiplier, referenceTrips, validityDays]
      properties:
        venueId: { type: string, format: uuid }
        code:
          type: string
          maxLength: 32
          x-ticvai-unique: venue
        name: { $ref: '#/components/schemas/LocalisedText' }
        description: { $ref: '#/components/schemas/LocalisedText' }
        kind:
          type: string
          enum: [multiTrip, unlimited]
        trips:
          type: integer
          minimum: 2
          maximum: 100
          nullable: true
          description: Journeys included. Required for `multiTrip`; null for `unlimited`.
        fareMultiplier:
          type: number
          minimum: 0
          maximum: 1000
          description: The pass price as a multiple of the single adult fare between its two stations.
        referenceTrips:
          type: integer
          minimum: 1
          maximum: 1000
          description: >
            The single trips the saving is measured against — `trips` for a multi-trip card, an
            number the venue sets for unlimited (14 a week, 60 a month in the demo seed data).
        validityDays: { type: integer, minimum: 1, maximum: 366 }
        routeIds:
          type: array
          description: Routes it is sold on. Empty means every active route in the venue.
          items: { $ref: '#/components/schemas/Ulid' }
        sortOrder: { type: integer, minimum: 0, default: 0 }

    PassType:
      x-ticvai-persistence: "transport.pass_type"
      allOf:
        - $ref: '#/components/schemas/CreatePassTypeRequest'
        - type: object
          required: [id, active]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            active: { type: boolean, default: true }
            catalogueProductId:
              type: string
              format: uuid
              readOnly: true
              description: The catalogue `openDated` product this pass is sold as.

    PassOffer:
      x-ticvai-persistence: "none — projection"
      type: object
      required: [passTypeId, catalogueProductId, name, price, validityDays]
      properties:
        passTypeId: { $ref: '#/components/schemas/Ulid' }
        catalogueProductId: { type: string, format: uuid }
        routeId: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [multiTrip, unlimited] }
        trips: { type: integer, nullable: true }
        validityDays: { type: integer }
        price: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        saving: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    FavouriteRoute:
      x-ticvai-persistence: "transport.favourite_route"
      type: object
      required: [id, venueId, fromStationId, toStationId, createdAt]
      description: Unique per guest, venue and ordered pair of stations.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        venueId: { type: string, format: uuid }
        fromStationId: { $ref: '#/components/schemas/Ulid' }
        toStationId: { $ref: '#/components/schemas/Ulid' }
        fromStationName: { type: string, readOnly: true }
        toStationName: { type: string, readOnly: true }
        label: { type: string, nullable: true }
        adultFare:
          $ref: '../shared/common.yaml#/components/schemas/Money'
          readOnly: true
          x-ticvai-persisted: false
          description: The current fare, read on list.
        createdAt: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
