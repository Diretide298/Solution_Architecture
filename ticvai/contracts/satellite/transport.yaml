        - "P02 GST-077 Intercity Trip — Route & Passengers"
        - "P08 BO-1185 Transport Fares & Passenger Types"
      x-ticvai-audience: [guest, public, service]
      summary: Price a one-way trip or a pass for a party
      description: >
        **Creates nothing; POST because the party is a body.** Returns the adult fare between the
        two stations, the price per passenger type and the total — or, with `passTypeId`, the
        pass price and its saving against single trips.

        **The order service calls this when a transport line is added to a cart** (a line whose
        `attributes.transport` names the route and stations), so the price a guest saw on the
        departure card and the price on the cart line come from one rule.

        Fare: `stopCount` is `baseFare + perStopFare × stops travelled`; `matrix` reads the pair.
