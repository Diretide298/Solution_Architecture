openapi: 3.1.0
info:
  title: TICVAI Reporting & Analytics
  version: 0.1.0
  x-ticvai-screen-count: 46
  x-ticvai-tier: satellite
  x-ticvai-module: 8 — Unified Operations Dashboard  ·  cross-cutting
  x-ticvai-requirements: 332
  x-ticvai-capabilities:
  - C21
  - C97
  - AI-57
  x-ticvai-platforms:
  - P08 Venue Management
  - P09 TICVAI Web
  description: "## What this contract covers\n**Reads a lag-tolerant replica, never the primary.**\n|\
    \ | | |---|---| | **Tier** | satellite | | **Matrix domain** | 8 — Unified Operations Dashboard  ·\
    \  cross-cutting | | **Requirements** | ~332 | | **Capabilities** | C21, C97, AI-57 | | **Consumed\
    \ by** | P08 Venue Management · P09 TICVAI Web |\n## How to read this file\n**This file is a contract.**\
    \ It is hand-authored and it is the source of truth for one bounded context: server code, client code\
    \ and mock servers are generated from it, never the other way round. If a field is not here, it does\
    \ not exist.\n**Contracts are split into two tiers.**\n- **Spine** — the eight contexts everything\
    \ else depends on: tenancy, identity,\n  catalogue, orders, shift, access, finance, cross-region. Frozen\
    \ first. A change here\n  requires a formal change request, because every satellite has pinned against\
    \ it.\n- **Satellite** — a domain that builds on the spine and can move independently.\n  Cheaper\
    \ to change.\n\n**`paths` are operations.** Each one declares four TICVAI extensions, and Redocly\
    \ rejects any that does not:\n| Extension | Answers | |---|---| | `x-ticvai-permission` | Which permission\
    \ the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level`\
    \ | Where in the seven-level hierarchy that permission must be held | | `x-ticvai-offline-capable`\
    \ | Whether a disconnected terminal may queue this | | `x-ticvai-conflict-policy` | How a replayed\
    \ operation resolves — `append`, `serverWins`, `manual` |\nWhere `x-ticvai-permission` is null, one\
    \ of these says why: `x-ticvai-auth: service` (cell-to-cell), `x-ticvai-self-scoped` (acts only on\
    \ the caller's own resources), or `security: []` (genuinely public).\n**`components.schemas` are API\
    \ schemas — the shape of data on the wire.** They are not database tables. One API schema may become\
    \ three columns (`Money`) or five tables (`Order`); some have no table at all (`ValidationResult`,\
    \ `TrialBalance`). Roughly 70% of the DDL derives from these, and the rest — partitioning, RLS, the\
    \ PII split — is storage design that lives in the migration scripts.\n**`security` arrays hold OAuth\
    \ scopes.** Empty means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty\
    \ is not the same as absent: absent means unauthenticated.\n\n## This context\nReport definitions,\
    \ execution, scheduling, exports and dashboards. Cross-cutting — every domain feeds it.\nPositions\
    \ this encodes:\n- **Reporting reads a lag-tolerant replica, never the primary.** A month-end report\n\
    \  running against the transactional database during a venue spike is the most likely\n  single cause\
    \ of an outage this platform has.\n- **Every report is scope-filtered by the caller's resolved permissions**,\
    \ not by\n  parameters. A venue manager cannot widen a filter to see another venue, because the\n\
    \  filter is not what constrains them.\n- **Definition and execution are separate.** A definition\
    \ is versioned and reusable; an\n  execution is a dated artefact with its own parameters and result.\
    \ A report someone can\n  no longer reproduce is not evidence.\n- **Large exports are asynchronous.**\
    \ A synchronous export of a year of scan events is a\n  timeout, and a retry of a timeout is two.\n\
    - Cross-cell and cross-tenant reporting comes from the central warehouse\n  (ADR-0001 (retired — see\
    \ ADR-0014 and ADR-0017), ADR-0014). **Cells are never queried directly**, and aggregates only.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: catalogue
- name: execution
- name: schedule
- name: export
- name: dashboard
- name: naturalLanguage
paths:
  /reports/seeded:
    get:
      operationId: listSeededReports
      x-ticvai-consumed-by:
        - "P16 ANL-031 Report Catalogue & Library"
      summary: The reports every venue starts with
      description: 'BL-053. **A venue opening on Monday does not want a report builder — it wants the
        reports every venue runs.**

        Seeded at provisioning and **clone-only (decided 28 September, audit R096)**: a system report
        cannot be amended or retired; a venue that wants it different clones it with `createReport` and
        changes the copy, so the seeded one stays the reference every venue shares.

        **The eight, proposed from the screens that need them, client to correct (decided 28 September,
        audit R282).** Code, what it shows, its data source, and the screen that runs it:

        - `terminalDayView`: sales, tenders, voids and refunds for one terminal today (`orders`); POS-008.
        **Its cash-tender figures are withheld from the cashier of an open shift** (CHG-FIN-003, 2 October
        2026): float plus cash takings is the expected drawer, so showing them would undo the blind count.
        What else a cashier sees of it is the per-role switch of DI-802.

        - `salesByChannel`: net sales per sales channel for the period (`orders`); BO-059.

        - `attendanceAndFootfall`: admissions per hour and per entry point, against capacity
        (`scanEvents`); BO-060.

        - `shiftSummary`: each till shift''s takings, expected against counted cash, and variance
        (`shifts`); POS-020. **Supervisors only**: the expected and variance columns need OVERSHORT_ACCEPT
        at the venue and are never shown to the cashier whose shift it is (CHG-FIN-003).

        - `refunds`: refunds by reason, operator and tender (`refunds`).

        - `voidsAndDiscounts`: voided lines and discounts by operator, reason and approver (`orderLines`);
        BO-133.

        - `stockValuation`: stock on hand at cost, by location and category (`stockBatches`).

        - `fnbSales`: F&B sales by outlet, item and hour (`orderLines`, F&B outlets only).

        Each is run with `runReport` naming its `reportId`; a screen that runs a report names which.

        **One reporting area, one set of numbers** (decided 2 October 2026, Chinmay; CHG-FIN-006; DI-721,
        DI-702). Analytics (P16) is the reporting area. The till reports (POS-008, POS-020) and the
        back-office report screens (BO-058, BO-059, BO-060, BO-1081 and the module report screens) are
        scoped windows onto the same seeded definitions and the same seeded KPIs (`ReportingSystemKpi`),
        run by `runReport` and `getKpiValues` against the same replica: a figure on a till or a back-office
        screen is the figure Analytics shows for the same scope, period and as-of time. A screen never
        computes a total of its own from another read, and a module never keeps a second definition of
        a measure.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Seeded reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeededReport'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /suppliers/{supplierId}/performance:
    parameters:
    - name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getSupplierPerformance
      x-ticvai-consumed-by:
        - "P08 BO-083 Suppliers"
      summary: On-time, in-full, and what was rejected
      description: '15.3.3 and 15.3.17. **Receipts and rejections recorded what arrived and nothing scored
        it** — so a venue could see every delivery and could not tell a good supplier from a bad one.

        **OTIF is the measure procurement actually uses**: on time *and* in full, because a delivery that
        is early and short is not a good delivery.

        **The definitions (decided 28 September, audit R158).** A purchase order line is **on time** when
        its goods receipt is recorded on or before the purchase order''s expected delivery date, and **in
        full** when the received quantity is at least the ordered quantity. `onTimeInFullPercent` is the
        share of lines that are both; `averageDaysLate` counts days from the expected date to the receipt
        for the late ones.

        **Rejection reasons are separated from short deliveries.** One is a quality problem and the other
        is a supply problem, and a single fill-rate number hides which.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: analytical
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordersPlaced:
                    type: integer
                  onTimeInFullPercent:
                    type: number
                  averageDaysLate:
                    type: number
                  shortDeliveryPercent:
                    type: number
                  rejectionPercent:
                    type: number
                  rejectionReasons:
                    type: object
                    additionalProperties:
                      type: integer
                    description: 'Rejected receipt lines counted by rejection reason, keyed by the
                      reason. **Sourced from the reason recorded against each rejected goods receipt
                      line in `inventory`.** Pull audit 26 September: `inventory.goods_receipt_line`
                      records only `rejected_quantity` and no reason, so until `inventory.yaml` carries
                      a rejection reason per line this map has no source and is returned empty.

                      '
                  priceVariancePercent:
                    type: number
                    description: 'Quoted against invoiced. **The number that finds a supplier quietly
                      raising prices**, which no delivery record shows.

                      '
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /alert-rules:
    get:
      operationId: listAlertRules
      summary: Thresholds being watched
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setAlertRule
      x-ticvai-consumed-by:
        - "P08 BO-133 Offline Alerts, Limits & Audit"
        - "P08 BO-886 Staffing Gap & Coverage Control Center"
        - "P16 ANL-009 AI Assistant & Action Center"
      summary: Watch a metric and tell somebody
      description: 'BL-152. **The metric comes from the closed set**, so a rule cannot watch something
        nothing produces.

        **PUT semantics — an upsert of one rule, keyed on the body''s `id`.** The collection path
        carries no id, so the body names the rule: a client-generated `id` that does not exist creates
        the rule (`201`); an `id` that exists replaces that rule whole (`200`). **Replace means every
        field** — an optional field left out of the body returns to its default, it does not keep its
        stored value. Other rules are never touched; removing a rule is `isActive: false`.

        **The target is the body''s `scopePath`**, which names the venue the rule watches and must
        lie inside the caller''s scope (`403` otherwise). An `id` that exists at a scope the caller
        cannot reach is also `403`, never a silent second rule with the same id.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Replaced — a rule with this id already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '201':
          description: Created — no rule with this id existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: An `outsideRange` rule without both `threshold` and `thresholdUpper`, or with the
            upper not above the lower (audit R158)
          x-ticvai-problem-types:
          - validation
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /alerts:
    get:
      operationId: listAlerts
      x-ticvai-consumed-by:
        - "P04 POS-020 Shift Exceptions & Alerts"
        - "P04 POS-025 Till Home"
        - "P06 EMP-061 Retail Inventory Command Center"
        - "P06 EMP-070 Inventory Exceptions, AI Replenishment & Action Center"
        - "P08 BO-036 Device Registry"
        - "P08 BO-133 Offline Alerts, Limits & Audit"
        - "P08 BO-141 Operational Alerts, AI Replenishment & Action Center"
        - "P08 BO-886 Staffing Gap & Coverage Control Center"
        - "P16 ANL-001 Executive Command Center"
        - "P16 ANL-003 Operational Performance"
        - "P16 ANL-009 AI Assistant & Action Center"
        - "P16 ANL-012 Live Operations Dashboard"
      summary: What is currently wrong
      description: '**The dashboard panel reads this.** Critical first, then unacknowledged, then by age
        — an alert list sorted by time puts a resolved info notice above an unacknowledged critical.

        **Venue scope is the rule; the filters below narrow inside it.** A till screen asks for its own
        workstation or shift, a replenishment screen for one item. Each alert carries its rule''s name
        and metric, so a list can be read without a second call to `listAlertRules`.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: status
        in: query
        description: '**Defaults to open alerts (decided 28 September, audit R158)**: with no `status`
          the list holds `raised` and `acknowledged` alerts, never `resolved` or `expired` ones. Send a
          status to read exactly that one.

          '
        schema:
          $ref: '#/components/schemas/AlertStatus'
      - name: severity
        in: query
        schema:
          $ref: '#/components/schemas/AlertSeverity'
      - name: workstationId
        in: query
        description: Only alerts raised for this workstation.
        schema:
          type: string
          format: uuid
      - name: shiftId
        in: query
        description: Only alerts raised during this till shift.
        schema:
          type: string
          format: uuid
      - name: itemId
        in: query
        description: Only alerts raised about this inventory item.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /alerts/{alertId}/acknowledge:
    parameters:
    - name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: acknowledgeAlert
      x-ticvai-consumed-by:
        - "P06 EMP-061 Retail Inventory Command Center"
        - "P06 EMP-070 Inventory Exceptions, AI Replenishment & Action Center"
        - "P08 BO-141 Operational Alerts, AI Replenishment & Action Center"
        - "P16 ANL-009 AI Assistant & Action Center"
      summary: Mark it seen
      description: 'CF-134. **Acknowledged, not dismissed** — the difference is that this records who
        saw it, and an alert nobody acknowledged is what escalation is for.

        **Acknowledging does not resolve.** The metric is still out of range; somebody is now dealing
        with it.

        The optional `note` is kept on the alert as `acknowledgementNote` and returned with it.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 300
                  description: Stored as `Alert.acknowledgementNote`.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /reports:
    get:
      operationId: listReports
      x-ticvai-consumed-by:
        - "P04 POS-008 Reports"
        - "P08 BO-029 Report Builder"
        - "P08 BO-058 Reporting Home"
        - "P08 BO-059 Sales Reports"
        - "P08 BO-060 Attendance & Footfall"
        - "P08 BO-262 Access Reports, Scheduled Reporting & Data Export"
        - "P10 PTR-018 Reports & Sales Performance"
        - "P12 SUP-008 Agent Performance & SLA View"
        - "P16 ANL-031 Report Catalogue & Library"
      x-ticvai-api-scope: analytics.read
      x-ticvai-audience:
      - staff
      - partner
      x-ticvai-read-routing: analytical
      summary: List available report definitions
      description: 'Only definitions the caller may run. A report requiring `REPORT_VIEW_TENANT` does
        not appear to a venue-scoped user at all — an empty result is a worse answer than an absent entry.

        '
      tags:
      - catalogue
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: category
        in: query
        schema:
          $ref: '#/components/schemas/ReportCategory'
      - name: search
        in: query
        schema:
          type: string
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Definitions
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReportDefinition'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createReport
      x-ticvai-consumed-by:
        - "P08 BO-029 Report Builder"
        - "P08 BO-058 Reporting Home"
        - "P08 BO-059 Sales Reports"
        - "P08 BO-060 Attendance & Footfall"
        - "P08 BO-1060 Report Builder, Export & Audit"
        - "P10 PTR-018 Reports & Sales Performance"
        - "P12 SUP-008 Agent Performance & SLA View"
        - "P16 ANL-032 Report Creation Wizard"
        - "P16 ANL-054 AI Report Generator"
      x-ticvai-api-scope: analytics.write
      x-ticvai-audience:
      - staff
      - partner
      summary: Create a custom report definition
      description: 'The self-service builder. A definition names its data source, columns, filters, grouping
        and the permission required to run it.

        **The author cannot grant a permission they do not hold.** A venue user building a report cannot
        mark it tenant-scoped and thereby see other venues.

        '
      tags:
      - catalogue
      x-ticvai-permission: REPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinition'
        '400':
          description: Unknown field, invalid filter, or estimated cost beyond the limit
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '403':
          description: Author does not hold the permission they assigned to the report
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /reports/{reportId}:
    parameters:
    - name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getReport
      x-ticvai-consumed-by:
        - "P04 POS-008 Reports"
        - "P08 BO-029 Report Builder"
        - "P08 BO-058 Reporting Home"
        - "P08 BO-059 Sales Reports"
        - "P08 BO-060 Attendance & Footfall"
        - "P10 PTR-018 Reports & Sales Performance"
        - "P12 SUP-008 Agent Performance & SLA View"
      x-ticvai-api-scope: analytics.read
      x-ticvai-audience:
      - staff
      - partner
      x-ticvai-read-routing: analytical
      summary: Read a report definition
      tags:
      - catalogue
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinition'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: updateReport
      x-ticvai-consumed-by:
        - "P08 BO-029 Report Builder"
        - "P08 BO-058 Reporting Home"
        - "P08 BO-059 Sales Reports"
        - "P08 BO-060 Attendance & Footfall"
        - "P10 PTR-018 Reports & Sales Performance"
        - "P12 SUP-008 Agent Performance & SLA View"
        - "P16 ANL-035 Filter & Parameter Builder"
        - "P16 ANL-036 Grouping, Aggregation & Calculation Builder"
        - "P16 ANL-037 Cross-Domain Report Composer"
        - "P16 ANL-038 Report Layout & Formatting Designer"
      x-ticvai-api-scope: analytics.write
      x-ticvai-audience:
      - staff
      - partner
      summary: Publish a new version of a definition
      description: 'Definitions are versioned. Historic executions keep the version they ran against,
        so a report produced last quarter remains reproducible after the definition changes.

        **Every publish keeps the version it replaces.** The definition as it stood is written to
        `reporting.report_definition_version` (`ReportDefinitionVersion`) keyed on the report and
        its version, and `reporting.report_definition` holds the current one. An execution''s
        `definitionVersion` resolves against that history, which is what makes the promise above
        true: the live row alone can hold one version only.

        **PUT semantics — a full replace of the definition, never a create.** The body is the whole
        new definition: columns, filters, grouping and parameters left out of it are not in the new
        version. An unknown `reportId` is `404`; there is no create-on-PUT, `createReport` makes
        definitions. The server assigns the new `version`.

        **A system report is refused (decided 28 September, audit R096)**: seeded reports are clone-only,
        so an `isSystem` definition answers 409 `system-report`. Clone it with `createReport`.

        '
      tags:
      - catalogue
      x-ticvai-permission: REPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: New version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinition'
        '409':
