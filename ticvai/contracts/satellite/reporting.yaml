            lacks what its mark requires:


            | Mark | Requires |
            |---|---|
            | `combo` | one `x` dimension; two or more measures, each with `axis` and `seriesType`; `unitLabel` on a secondary axis |
            | `matrix` | `row` dimensions (with `hierarchyLevel`), optional `column` dimensions, one or more `value` measures |
            | `funnel` | one `stage` dimension in order (`sortOrder`), one `value` measure |
            | `waterfall` | one `category` dimension of ordered steps, one `value` measure; the steps are a named measure set (for example Gross sales, Discounts, Refunds, Net revenue) and the last is the total |
