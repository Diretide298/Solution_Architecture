      summary: The denominators each site is benchmarked by
      description: 'The stored `reporting.site_normalisation_basis` rows inside the caller''s scope,
        newest period first (decided 29 September, writers pass). What `getAnalyticsBenchmark` divides
        by.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_TENANT
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: scopePath
        in: query
        description: Only this site.
        schema:
          type: string
      - name: periodFrom
        in: query
        description: Only bases whose period ends on or after this date.
        schema:
          type: string
          format: date
      - name: periodTo
        in: query
        description: Only bases whose period starts on or before this date.
        schema:
          type: string
          format: date
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Bases
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/SiteNormalisationBasis'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setSiteNormalisationBasis
      x-ticvai-consumed-by:
        - "P16 ANL-064 Benchmark & Comparative Analytics Configuration"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: writers pass; BI boards 7.9 and 10.4; data model DM6 open item on
        reporting.site_normalisation_basis; shape follows setKpiTargets'
      summary: Set the denominators a site is benchmarked by
      description: '**The writer of `reporting.site_normalisation_basis`** (decided 29 September, writers
        pass). **PUT semantics, as `setKpiTargets`.** Each basis is matched on (`scopePath`,
        `periodStart`, `periodEnd`): one in the body replaces the stored one whole and a new triple adds
        a basis. Bases the body leaves out are kept, because a basis is history a past benchmark was
        computed on. Two bases for the same site whose periods overlap are `422`; `periodEnd` before
        `periodStart` is `422`. A `scopePath` outside the caller''s scope is `403`.

        **A null denominator is not zero.** When `visitors` is null, `getAnalyticsBenchmark` uses the
        seeded `admissions` KPI for the site and period; when `operatingHours`, `staffedPositions` or
        `areaSquareMetres` is null, that site''s `normalisedValue` is null for that basis rather than
        a guess (our build plan).

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bases
              properties:
                bases:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/SiteNormalisationBasis'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteNormalisationBasis'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '422':
          description: A period ends before it starts, or overlaps another basis for the same site.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  schemas:

    ServiceSummary:
      x-ticvai-persistence: none — computed from fnb.table_visit, the orders and payments on it
      type: object
      description: One server's service day (`getServiceSummary`, CHG-CSA-020).
      required:
      - date
      - covers
      - tables
      properties:
        date:
          type: string
          format: date
        covers:
          type: integer
        tables:
          type: integer
          description: Table visits served.
        sales:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          description: Excluding VAT, as `grossSales` (CHG-FIN-007).
        tips:
          $ref: ../shared/common.yaml#/components/schemas/Money
        openTables:
          type: integer
          description: Visits still open, with their bills not yet settled.
    AnalyticsGovernancePolicy:
      type: object
      x-ticvai-persistence: reporting.analytics_governance_policy
      description: '**What analytics may show and where it may go** (Chinmay, 2 October, workbook Q225; CHG-CSA-021).
        One row per tenant.'
      properties:
        masking:
          type: object
          description: Masked fields, as `schema.table.column`, and who may see them unmasked.
          properties:
            maskedFields:
              type: array
              items:
                type: string
            unmaskedForPermissions:
              type: array
              items:
                type: string
        export:
          type: object
          properties:
            allowedFormats:
              type: array
              items:
                type: string
            personalDataNeedsPermission:
              type: boolean
              default: true
              description: An export carrying personal data needs `REPORT_EXPORT_PII`.
            maxRows:
              type: integer
              nullable: true
        retention:
          type: object
          properties:
            resultDays:
              type: integer
              minimum: 1
              nullable: true
              description: How long report results and exports are kept.
        sharing:
          type: object
          properties:
            externalLinks:
              type: boolean
              default: false
            allowedDomains:
              type: array
              items:
                type: string
        aiAndApiAccess:
          type: object
          properties:
            aiAssistant:
              type: boolean
              default: true
              description: The AI assistant may answer analytics questions through the semantic layer (ADR-0054).
            publicApi:
              type: boolean
              default: false
        scopePath:
          type: string
          readOnly: true
          description: The partition key (ADR-0005). Written at `tenant` scope.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    KpiDefinition:
      type: object
      x-ticvai-persistence: reporting.kpi_definition
      description: 'BI boards 2.5 and 10.2. **One definition, referenced everywhere** — otherwise
        *revenue* means two things in the same meeting.

        '
      required:
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: '`takings` and `admissions` are seeded for every tenant as system KPIs (decided 28
            September, audit R283), and the five accreditation KPIs for every tenant with the accreditation
            module (29 September, build pass). The seeded codes are `ReportingSystemKpi`.

            '
        name:
          type: string
        description:
          type: string
          nullable: true
        domain:
          type: string
          nullable: true
        formula:
          type: string
          description: '**Expressed against the semantic model, not against tables.** A KPI written in
            SQL is a KPI that breaks when the warehouse is reshaped.

            '
        unit:
          type: string
          enum:
          - currency
          - count
          - percentage
          - duration
          - ratio
          - score
        higherIsBetter:
          type: boolean
          default: true
          description: '**Refund rate and revenue both go up.** Without this the status colour is a
            coin toss.

            '
        defaultPeriod:
          type: string
          nullable: true
        owner:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        isActive:
          type: boolean
          default: true
    ReportingSystemKpi:
      type: string
      description: '**The KPIs seeded at provisioning**, as `reporting.kpi_definition` rows a hub can ask for
        by code without knowing an id. Each names its source, checked against the schema as `MetricSource`
        is.


        | Code | Unit | Source | Seeded for |
        |---|---|---|---|
        | `takings` | currency | **Money taken through the tills and channels, less money paid back** (CHG-FIN-010, 2 October 2026): captured `orders.payment.amount` (base currency) in the period less completed `orders.refund.amount` in the period, by tender; `groupBy=tender`, `workstationId` or `shiftId`. **A cash-control measure, not revenue**: it includes VAT, deposits and gift-card sales, and it is what a drawer and a settlement are reconciled against. For one shift, cash takings + opening float + float entries − lifts is the expected drawer, which the cashier never sees (CHG-FIN-003) | every tenant (R283) |
        | `grossSales` | currency | Sales at the price before discounts, **excluding VAT**: the sum of `orders.order_line.net_amount` plus its `orders.order_line_discount.amount`, on orders paid in the period (D-185 default; CHG-FIN-007) | every tenant |
        | `discounts` | currency | The sum of `orders.order_line_discount.amount` on orders paid in the period, excluding VAT (CHG-FIN-007) | every tenant |
        | `refunds` | currency | Completed `orders.refund.amount` in the period less the tax it reversed (`taxReversalEntryId`), excluding VAT (CHG-FIN-007) | every tenant |
        | `netRevenue` | currency | `grossSales` − `discounts` − `refunds` (D-185 default, BOARDREQ MOM-2760; client finance sign-off pending; CHG-FIN-007) | every tenant |
        | `recognisedRevenue` | currency | Credits less debits of `ledger.journal_line` on `revenue` accounts posted in the period: what the recognition rules (`RecognitionMethod`) released, POS sales on the day, tickets on the visit (CHG-FIN-007) | every tenant |
        | `deferredRevenue` | currency | The balance of the deferred-revenue liability accounts at period end (`finance.getDeferredRevenue`): paid and not yet recognised (CHG-FIN-007) | every tenant |
        | `taxCollected` | currency | Output tax: `orders.order_line.tax_amount` on orders paid in the period less the tax reversed by refunds completed in it; labelled with the jurisdiction''s tax name (VAT in the UAE) (CHG-FIN-007) | every tenant |
        | `admissions` | count | admitted in-direction `access.scan_event` in the period | every tenant (R283) |
        | `tableTurnTime` | duration | mean `closed_at` minus `opened_at` of `fnb.table_visit` closed in the period (`higherIsBetter` false; workbook Q205, CHG-CSA-020) | F&B module |
        | `noShowRate` | percentage | `fnb.table_reservation` marked no-show over those due in the period (`higherIsBetter` false) | F&B module |
        | `covers` | count | the sum of covers of `fnb.table_visit` opened in the period; `groupBy=serverPrincipalId` gives covers per server | F&B module |
        | `waitQuoteAccuracy` | percentage | waitlist parties seated within their quoted wait over those seated in the period (`fnb.restaurant_waitlist`) | F&B module |
        | `accreditationApplications` | count | `accreditation.application` submitted in the period; `groupBy=status` gives applications by status | accreditation module (12.1.50) |
        | `accreditationTimeToDecision` | duration | mean `decided_at` minus `submitted_at` of `accreditation.application` decided in the period (`higherIsBetter` false) | accreditation module |
        | `accreditationCredentialsIssued` | count | `accreditation.credential` with `issued_at` in the period; `groupBy=kind` | accreditation module |
        | `accreditationActiveHolders` | count | `accreditation.holder` with status `active` at period end; `groupBy=categoryCode` gives active holders by category | accreditation module |
        | `accreditationRenewalsDue` | count | `accreditation.holder` active whose `valid_to` falls inside the programme''s `accreditation.validity.renewal_window_days` at period end | accreditation module |


        **Seeded, not locked.** A tenant may set targets on them (`setKpiTargets`) and put them on any
        dashboard; the formula and source are the platform''s, so *time to decision* means the same thing on
        every screen that shows it.

        **Labels are fixed with the measures** (decided 2 October 2026, Chinmay; CHG-FIN-002): Takings,
        Gross sales, Discounts, Refunds, Net revenue, Recognised revenue, Deferred revenue, VAT (or the
        jurisdiction''s tax name). **Never a bare "Revenue"** on a tile, a column or a chart axis; a
        tile bound to one of these KPIs takes its label from the KPI.

        '
      enum:
      - takings
      - admissions
      - grossSales
      - discounts
      - refunds
      - netRevenue
      - recognisedRevenue
      - deferredRevenue
      - taxCollected
      - accreditationApplications
      - accreditationTimeToDecision
      - accreditationCredentialsIssued
      - accreditationActiveHolders
      - accreditationRenewalsDue
      - tableTurnTime
      - noShowRate
      - covers
      - waitQuoteAccuracy
    KpiTarget:
      type: object
      x-ticvai-persistence: reporting.kpi_target
      description: 'BI board 2.6. **The threshold is what turns a number into a status.**'
      required:
      - scopePath
      - period
      - target
      properties:
        kpiId:
          type: string
          format: uuid
        scopePath:
          type: string
          description: The scope this target applies to. With `period`, the key `setKpiTargets` matches
            on.
        period:
          type: string
        target:
          $ref: '#/components/schemas/MetricValue'
        amberAt:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
        redAt:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
        stretch:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
    KpiValue:
      type: object
      description: 'BI board 10.3. **Value, target, variance, direction and freshness in one read.**'
      properties:
        kpiId:
          type: string
          format: uuid
        code:
          type: string
        bucketStart:
          type: string
          format: date-time
          nullable: true
          description: The start of the bucket this value covers, when `getKpiValues` was asked for an
            `interval`; null otherwise.
        groupKey:
          type: string
          nullable: true
          description: The value of the `groupBy` dimension this row is for (a status, a category code, a
            tier); null when no `groupBy` was asked.
        name:
          type: string
        scopePath:
          type: string
        period:
          type: string
        value:
          $ref: '#/components/schemas/MetricValue'
        target:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
        comparison:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
        variancePercent:
          type: number
          nullable: true
        direction:
          type: string
          enum:
          - up
          - down
          - flat
        status:
          type: string
          enum:
          - green
          - amber
          - red
          - noTarget
        asOf:
          type: string
          format: date-time
        stale:
          type: boolean
          description: '**True when the pipeline behind it has not refreshed.** A number nobody flagged
            as stale is a number somebody will act on.

            '
    BenchmarkRow:
      type: object
      description: 'BI board 10.4. **The normalisation travels with the comparison.**'
      properties:
        scopePath:
          type: string
        label:
          type: string
        value:
          $ref: '#/components/schemas/MetricValue'
        normalisedValue:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
        normaliseBy:
          $ref: '#/components/schemas/BenchmarkNormalisation'
        rank:
          type: integer
        percentile:
          type: number
          nullable: true
    SiteNormalisationBasis:
      type: object
      x-ticvai-persistence: reporting.site_normalisation_basis
      description: 'BI boards 7.9 and 10.4. **The denominators a benchmark divides by**, per site and
        period: visitors, operating hours, staffed positions and area, one for each
        `BenchmarkNormalisation` other than `none`. Read by `getAnalyticsBenchmark` for the period that
        covers the benchmark (data model, 29 September).

        '
      required:
      - scopePath
      - periodStart
      - periodEnd
      properties:
        id:
          type: string
          format: uuid
        scopePath:
          type: string
          description: The site (venue scope) the basis applies to.
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        visitors:
          type: integer
          nullable: true
          minimum: 0
          description: '`perVisitor`.'
        operatingHours:
          type: number
          nullable: true
          minimum: 0
          description: '`perOperatingHour`.'
        staffedPositions:
          type: number
          nullable: true
          minimum: 0
          description: '`perStaffedPosition`. Average positions staffed over the period.'
        areaSquareMetres:
          type: number
          nullable: true
          minimum: 0
          description: '`perSquareMetre`. Operated area.'
    SemanticModel:
      type: object
      x-ticvai-persistence: reporting.semantic_model
      description: 'BI boards 3.3 and 10.6. **A vocabulary, not a schema.** Exposing joins to report
        authors produces reports that are wrong invisibly.

        '
      properties:
        version:
          type: integer
          readOnly: true
          description: Assigned by the server on each publish.
        domains:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              description:
                type: string
                nullable: true
              datasets:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    name:
                      type: string
                    grain:
                      type: string
                      description: '**What one row means.** The single most common cause of a wrong
                        report is a join that silently multiplied the grain.

                        '
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                          label:
                            type: string
                          dataType:
                            $ref: '#/components/schemas/FieldType'
                          aggregation:
                            allOf:
                            - $ref: '#/components/schemas/Aggregation'
                            nullable: true
                            description: The default aggregation for the field, where it has one.
                          sensitive:
                            type: boolean
                            default: false
                          description:
                            type: string
                            nullable: true
        relationships:
          type: array
          items:
            type: object
            properties:
              fromDataset:
                type: string
              toDataset:
                type: string
              cardinality:
                type: string
                enum:
                - oneToOne
                - oneToMany
                - manyToOne
                - manyToMany
        publishedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        scopePath:
          type: string
    AnalyticsPipeline:
      type: object
      x-ticvai-persistence: reporting.pipeline
      description: 'BI board 10.7. **Freshness decides whether a dashboard can be trusted.**'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceKind:
          type: string
        datasets:
          type: array
          items:
            type: string
        schedule:
          type: string
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        freshnessMinutes:
          type: integer
          nullable: true
        expectedFreshnessMinutes:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - healthy
          - degraded
          - stale
          - failed
          - paused
        lastError:
          type: string
          nullable: true
        rowsLastRun:
          type: integer
          nullable: true
        scopePath:
          type: string
    AnalyticsAnomaly:
      type: object
      x-ticvai-persistence: reporting.anomaly
      description: 'BI boards 9.5 and 9.6. **A departure from the series'' own behaviour**, which catches
        what no threshold was set for.

        '
      properties:
        id:
          type: string
          format: uuid
        kpiId:
          type: string
          format: uuid
          nullable: true
        metric:
          type: string
        scopePath:
          type: string
        detectedAt:
          type: string
          format: date-time
        observed:
          $ref: '#/components/schemas/MetricValue'
        expected:
          $ref: '#/components/schemas/MetricValue'
        deviationSigma:
          type: number
          nullable: true
        severity:
          $ref: '#/components/schemas/AnomalySeverity'
        candidateCauses:
          type: array
          description: '**The beginning of the question, not the end of it.**'
          items:
            type: object
            properties:
              dimension:
                type: string
              value:
                type: string
              contribution:
                type: number
        acknowledgedBy:
          type: string
          format: uuid
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
    ReportSubscription:
      type: object
      x-ticvai-persistence: reporting.subscription
      description: 'BI boards 4.3 and 4.4. **Not a schedule** — one schedule serves several of these.'
      required:
      - reportId
      properties:
        id:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
          nullable: true
        recipients:
          type: array
          items:
            type: object
            properties:
              principalId:
                type: string
                format: uuid
                nullable: true
              email:
                type: string
                nullable: true
              external:
                type: boolean
                default: false
        channel:
          type: string
          enum:
          - email
          - sftp
          - webhook
          - inPlatform
        format:
          type: string
          enum:
          - pdf
          - xlsx
          - csv
          - json
        includesPersonalData:
          type: boolean
          default: false
          description: '**Gates on `REPORT_EXPORT_PII` and is audited.** A report that leaves the tenant
            with personal data in it is a fact somebody will ask about.

            '
        runsAsPrincipalId:
          type: string
          format: uuid
          description: '**The report runs under the owner''s permissions, not the recipient''s.**'
        active:
          type: boolean
          default: true
        scopePath:
          type: string
    ReportDelivery:
      type: object
      x-ticvai-persistence: reporting.delivery
      description: 'BI boards 4.8 and 4.9. **A report that silently stopped arriving is worse than one
        that never existed.**

        '
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        attemptedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - delivered
          - failed
          - retrying
          - suppressed
        recipientCount:
          type: integer
        failureReason:
          type: string
          nullable: true
        retryCount:
          type: integer
          default: 0
        containedPersonalData:
          type: boolean
          default: false
        scopePath:
          type: string
    AnalyticsUsageRow:
      type: object
      description: 'BI board 10.9. **The number that lets a BI estate be pruned.**'
      properties:
        key:
          type: string
        label:
          type: string
        opens:
          type: integer
        distinctUsers:
          type: integer
        lastOpenedAt:
          type: string
          format: date-time
          nullable: true
        averageRuntimeMs:
          type: integer
          nullable: true
        rowsScanned:
          type: integer
          nullable: true
        neverOpened:
          type: boolean
    DashboardView:
      type: object
      x-ticvai-persistence: reporting.dashboard_view
      description: 'BI board 10.9. **One row each time a dashboard is opened.** Report runs are already
        recorded in `reporting.execution`; dashboard opens were not. Read by `getAnalyticsUsage` for
        `opens`, `distinctUsers` and `lastOpenedAt` per dashboard, user and venue (data model, 29
        September).

        '
      required:
      - dashboardId
      - viewedByPrincipalId
      - openedAt
      properties:
        id:
          type: string
          format: uuid
        dashboardId:
          type: string
          format: uuid
          x-ticvai-references: reporting.dashboard
        viewedByPrincipalId:
          type: string
          format: uuid
          x-ticvai-references: identity.principal
        venueId:
          type: string
          format: uuid
          nullable: true
          description: The venue the dashboard was narrowed to when opened, as `Dashboard.venueId`.
        openedAt:
          type: string
          format: date-time
    ReportCategory:
      type: string
      enum:
      - sales
      - admission
      - financial
      - inventory
      - guest
      - operations
      - marketing
      - workforce
      - compliance
      - custom
    SeededReport:
      type: object
      description: 'BL-053. **`ReportDefinition.isSystem` existed and nothing populated it.** Twenty-eight
        requirements asked for dashboards and analyses over data that was already there, and the answer
        to every one of them was *"the builder can do that"* — which is true and is not a deliverable.

        **A venue opening on Monday does not want a report builder. It wants the eight reports every venue
        runs**, and the ability to change them.

        Seeded at provisioning, `isSystem` true, and **clone-only (decided 28 September, audit R096)**:
        `updateReport` and `deleteReport` refuse a system report with 409, and a venue that wants one
        different clones it with `createReport`. The eight codes are listed on `listSeededReports`
        (proposed, audit R282).

        '
      required:
      - code
      - name
      - category
      - dataSource
      properties:
        code:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/ReportCategory'
        dataSource:
          $ref: '#/components/schemas/DataSource'
        appliesToVenueKinds:
          type: array
          description: '**A water park does not need a theatre''s seat-utilisation report.** Empty means
            every venue kind.

            '
          items:
            type: string
        defaultSchedule:
          $ref: '#/components/schemas/Cadence'
        rationale:
          type: string
          description: '**Why this report ships, in words a venue manager reads.** A seeded report with
            no rationale is one somebody deletes as clutter in the first week.

            '
    AlertRule:
      type: object
      x-ticvai-persistence: reporting.alert_rule
      description: 'BL-152, CF-134. **Six contracts detect their own trouble and none told a person.**

        Five sections ask for this and it is the same gap as `MessageTrigger`, seen from the operational
        side — **that one tells a guest something happened; this one tells an operator something is wrong.**

        **A threshold that nobody is watching is a threshold nobody set.** 6.1.57 wants an exception when
        a KPI leaves range, and an exception that arrives in a nightly report is an exception nobody acted
        on.

        '
      required:
      - id
      - name
      - metric
      - comparator
      - threshold
      - severity
      - isActive
      - scopePath
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metric:
          allOf:
          - $ref: '#/components/schemas/MetricSource'
          description: '**From the closed set**, so a rule cannot watch something nothing produces — the
            same discipline `MetricSource` exists for.

            '
        comparator:
          type: string
          enum:
          - above
          - below
          - outsideRange
          - changesBy
          - equals
        threshold:
          $ref: '#/components/schemas/MetricValue'
        thresholdUpper:
          allOf:
          - $ref: '#/components/schemas/MetricValue'
          nullable: true
          description: '**Required when `comparator` is `outsideRange`** (decided 28 September, audit R158):
            the range is `threshold` to `thresholdUpper`, and a rule missing either, or with the upper not
            above the lower, is refused by `setAlertRule` with 400. Ignored for every other comparator.

            '
        windowMinutes:
          type: integer
          default: 15
          description: '**The window is what stops an alert firing on noise.** A queue that spikes for
            ninety seconds is not a queue that needs a manager, and a rule with no window is a rule somebody
            mutes within a week.

            '
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        deliverTo:
          type: array
          description: 'CF-134. **The dashboard panel is the default and the only one that always applies.**
            Email or WhatsApp where the matrix names them — an operational alert arriving by email is
            an alert nobody sees in time.

            '
          items:
            type: string
            enum:
            - dashboardPanel
            - email
            - whatsapp
            - sms
            - push
          x-ticvai-push-note: '**`push` added 29 September** (6.1.56, 18.1.5, build pass): delivered to every
            staff-app handset registered for a recipient (tenancy `RegisteredDevice`, kind `mobileHandset`,
            with a push token). It is how a daily revenue alert reaches a manager''s phone, which a panel on a
            web dashboard does not.

            '
        recipientRoleIds:
          type: array
          items:
            type: string
            format: uuid
        cooldownMinutes:
          type: integer
          default: 30
          description: '**How long before the same rule may fire again.** Without it, a metric hovering
            on a threshold produces forty alerts an hour and the panel becomes something people close.

            '
        isActive:
          type: boolean
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**


            **Required, and it is the write target.** `setAlertRule` has no id in its path and a
            caller may hold several venues, so the rule names the venue it watches here — inside the
            caller''s scope, or the write is refused.'
    Alert:
      type: object
      x-ticvai-persistence: reporting.alert
      description: 'A raised alert. **Acknowledged rather than dismissed** — CF-134 asked for it markable,
        and the difference is that an acknowledgement records who saw it.

        '
      required:
      - id
      - ruleId
      - raisedAt
      - severity
      - status
      properties:
        id:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        ruleName:
          type: string
          description: '`AlertRule.name` as it stood when the alert was raised. **The line a person
            reads** — a list of rule ids is not an alert panel, and a screen should not need
            `listAlertRules` to label one.

            '
        metric:
          allOf:
          - $ref: '#/components/schemas/MetricSource'
          description: The rule's metric, carried so the alert says what went out of range.
        raisedAt:
          type: string
          format: date-time
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        status:
          $ref: '#/components/schemas/AlertStatus'
        observedValue:
          $ref: '#/components/schemas/MetricValue'
        threshold:
          $ref: '#/components/schemas/MetricValue'
        scopePath:
          type: string
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: The workstation the reading was taken for, where the metric is measured per
            workstation (`salesByWorkstation`). Null otherwise. `listAlerts` filters on it.
        shiftId:
          type: string
          format: uuid
          nullable: true
          description: The till shift (`orders.pos_shift`) the reading belongs to, where it was taken
            for a workstation with a shift open. Null otherwise. `listAlerts` filters on it.
        itemId:
          type: string
          format: uuid
          nullable: true
          description: 'The inventory item the reading is about, where the metric is measured per item
            (`stockAgeing`, `stockTurnover`, `wastageRate`, `inventoryValuation`). Null otherwise.
            **What a replenishment screen prefills a requisition from.**

            '
        acknowledgedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgementNote:
          type: string
          maxLength: 300
          nullable: true
          description: The `note` given to `acknowledgeAlert`. Kept, because an acknowledgement that
            says what is being done about it is the one escalation can skip.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: '**Set when the metric returns to range, automatically.** An alert that only a
            person can close is an alert list that only grows.

            '
        escalatedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Where `VenueSettings.alerting.escalateAfterMinutes` passed with no acknowledgement.
            **A critical alert nobody acknowledged is the case escalation exists for.**

            '
    MetricSource:
      type: string
      description: '**A named metric with a verified source.** BL-053, 75 requirement rows.

        `reporting` is a generic builder, and **a generic builder makes every reporting requirement look
        covered** — it will happily assemble a report over data nobody produces. That is the shape to
        watch across the whole walk, and this enum is the answer to it: each value below was checked against
        the schema before being named.

        | Metric | Source | |---|---| | `occupancy` | `catalogue.channel_capacity.sold` and `leased` against
        `capacity` | | `capacityUtilisation` | `catalogue.channel_capacity.remaining` over the same window
        | | `admissionRate` | `access.scan_event.outcome`, in-direction | | `noShowRate` | Entitlements
        issued against scans that never arrived | | `conversion` | `orders.cart` against `orders.sales_order`
        | | `salesByOperator` | `orders.sales_order.principal_id` | | `salesByWorkstation` | The workstation
        on the shift that took it | | `waitTime` | `queue.waiting_guest.estimated_call_at` against `called_at`
        | | `throughput` | `queue.waiting_guest` completions per hour | | `abandonmentRate` | Queue entries
        that left before being called |

        **`salesByInstructor` was deliberately absent from the first cut** because it needed the
        staff-assignment link CL-01 covers. It was added on 18 August once `resources.Resource`
        produced it — see `x-ticvai-extension-note` below. Naming a metric with no source is still
        the defect this enum exists to prevent.

        **Money-valued metrics are listed in `x-ticvai-money-valued`.** A reading or threshold on one
        of them is a `Money`, never a float (`MetricValue`).

        '
      enum:
