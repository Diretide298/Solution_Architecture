      summary: Natural-language reporting query
      description: '**This is an AI capability and is governed as one.** It resolves its provider through
        `ai.provider`, respects `ai.policy` including the masking list, and writes an `ai.activity`
        row with its prompt, response, model, tokens and cost — the same audit trail as the assistant (8.3.55–8.3.57).

        Distinct from `sendAiMessage`, which retrieves from documents. **It answers through the semantic
        layer, never free text-to-SQL** (ADR-0054, accepted 1 October): the model writes a semantic query
        spec, Reporting compiles and runs it on the analytical replica with RLS and the official metric
        definitions, and the answer returns the query it ran, so a finance user can check the number
        rather than trust it. Numbers come only from that query''s result, never from a document chunk
        (AI-D13); a mixed question takes its knowledge from the tenant''s Qdrant collection and its numbers
        from here.

        **Block A ships the screens bound to this without the free-text box**: their saved-report and KPI
        views work, and the box stays behind a feature flag until the assistant lands in S7 (8 to 26
        February, ADR-0059).

        AI-57, Phase 1. Queries data that already exists, so it works from day one — unlike forecasting,
        which needs history.

        **Returns the generated query alongside the answer.** An answer nobody can check is worse than
        no answer, and a finance user asked to trust an unexplained number will rightly refuse.

        Runs under the caller''s resolved permissions. The generated query cannot widen scope, because
        scope is applied after generation, not by it.

        **The generated query is kept, not just returned.** Each answer writes a
        `reporting.natural_language_query` row (`NaturalLanguageQuery`) against its `conversationId`,
        because `saveNaturalLanguageQuery` turns it into a definition in a later call and
        `ai.activity` holds only free-text prompt and response.

        **The model writes a semantic query spec, not SQL** (decided 29 September, AI system design 2.2 E
        and 5.7). It sees only the semantic-model metrics and dimensions this caller may see, and returns
        `semanticSpec` (metric, dimensions, filters, period, comparison). Reporting validates the spec
        against the published `SemanticModel` and compiles it deterministically, the same compile
        `runSemanticQuery` performs, so *revenue* in an answer is the dashboards'' revenue. **The compiled
        SQL is still returned**, in `generatedQuery.compiledSql`, beside `semanticSpec`, `dataAsOf` and a
        `reliability` category (`grounded`, `partial`, `conflictingSources`, `insufficientEvidence`), which
        replaces the bare `confidence` percentage (design 5.6). A follow-up in the same conversation edits
        the kept spec, and permissions are re-checked on every turn.

        **A question outside the semantic model answers "not available yet"**, never an improvised
        query: `200` with `reliability` `insufficientEvidence`, `unavailableReason` naming which part is
        not modelled, `interpretation` saying so in plain language, and `semanticSpec`, `generatedQuery`,
        `result` and `dataAsOf` null. No `NaturalLanguageQuery` is kept for it. The `ai` service records
        the question as an `ai.knowledge_gap` of `kind` `analytics`, so the semantic-model owner gets a
        task rather than a log line. A metric the caller may not see is treated as not modelled, so the
        answer does not reveal that it exists.

        '
