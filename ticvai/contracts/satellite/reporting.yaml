        **Takings and admissions are always offered (decided 28 September, audit R283).** Two system KPIs
        are seeded at provisioning for every tenant, so a hub can ask for them by code without knowing
        an id: `takings`, the money taken in the period less the money paid back (currency; defined in
        `ReportingSystemKpi`, CHG-FIN-010), and `admissions`, admitted in-direction scans in the period
        (count, from `access.scan_event`). With no `period`, the period is today in the venue''s time zone.
        The back-office hubs and the Queue Monitor read their takings and admissions tiles here.
        **Takings is not revenue** and never feeds a Gross sales, Net revenue, Recognised revenue or
        Deferred revenue tile (CHG-FIN-002).

        **The finance measures are seeded too** (decided 2 October 2026, Chinmay; CHG-FIN-007):
        `grossSales`, `discounts`, `refunds`, `netRevenue`, `recognisedRevenue`, `deferredRevenue` and
        `taxCollected`, each with its formula in `ReportingSystemKpi`. The formulas follow the D-185
        default (gross sales excluding VAT; net revenue is gross sales less discounts less refunds);
        **client finance sign-off is pending**. `groupBy` splits them by `venue`, `channel`, `product`,
        `attraction` or `businessUnit` (the dimensions their order lines carry), and `takings` also by
        `tender`, `workstationId` or `shiftId`.


        **Accreditation KPIs are seeded too, where the accreditation module is on** (12.1.50, 29 September,
        build pass): `accreditationApplications`, `accreditationTimeToDecision`,
        `accreditationCredentialsIssued`, `accreditationActiveHolders` and `accreditationRenewalsDue`.
        `ReportingSystemKpi` lists every seeded code with its source.


        **Trend and breakdown in the same read** (29 September, build pass). `interval` returns one value
        per bucket across `period` (`bucketStart` set on each), which is the time series a trend chart
        draws; `groupBy` splits each value by one dimension the KPI''s source carries — `status` and
        `categoryCode` for the accreditation KPIs, `tierCode` for the loyalty ones — with `groupKey` set.
        Without either, one value per KPI, as before.


        **One module''s takings** (Chinmay, 2 October, workbook Q181; CHG-CSA-020). `module` restricts a KPI to the
        sales of one module''s outlets and products: the F&B hub (BO-104) shows `takings` with `module=fnb`, and
        admissions are not on it. `takings` also splits by `saleBoardId`, the sales per till layout the POS
        experience dashboard shows (contract gap CHG-WIR-024, BO-122; errors per board stay a gap, CHG-CSA-047).


        **The restaurant measures are seeded where F&B is on** (Chinmay, 2 October, workbook Q205: "all four, from
        reporting"; DI-400; CHG-CSA-020): `tableTurnTime`, `noShowRate`, `covers` and `waitQuoteAccuracy`, each
        with its source in `ReportingSystemKpi`, so the staff app and the back office show the same numbers
        (CHG-FIN-006).


        **The finance dashboard is one P16 dashboard** (Chinmay, 2 October, workbook Q219; DI-721; CHG-CSA-022): the
        Finance standard dashboard is seeded per tenant from the finance measures above and lives in Analytics;
        Orders & Money (BO-1081) shows a link card to it rather than a second copy.

        '
      tags:
      - reporting
      x-ticvai-permission: REPORT_VIEW_VENUE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: kpiIds
        in: query
        schema:
          type: string
      - name: kpiCodes
        in: query
        description: Comma-separated KPI codes, as an alternative to `kpiIds` — `takings,admissions`
          for the seeded pair (audit R283).
        schema:
          type: string
      - name: scopePath
        in: query
        schema:
          type: string
      - name: period
        in: query
        schema:
          type: string
      - name: compareTo
        in: query
        schema:
          type: string
          enum:
          - previousPeriod
          - samePeriodLastYear
          - target
          - benchmark
      - name: interval
        in: query
        description: One value per bucket of this size across `period` — the trend read (12.1.50).
        schema:
          type: string
          enum:
          - hour
          - day
          - week
          - month
      - name: groupBy
        in: query
        description: Split each value by one dimension of the KPI's source, e.g. `status`, `categoryCode`,
          `tierCode`. A dimension the source does not carry is `400`.
        schema:
          type: string
      - name: module
        in: query
        description: Only the sales of this module's outlets and products, e.g. `fnb` for the F&B hub's takings
          (workbook Q181; CHG-CSA-020). A KPI whose source has no module is `400`.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/ModuleKey
      responses:
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '200':
          description: Values
          content:
            application/json:
              schema:
                type: array
                items:
