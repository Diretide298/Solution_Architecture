      - attributedRevenue
      - loyaltyPointsLiability
      x-ticvai-extended-29-september: '**Fourteen metrics added 29 September (build pass)**, each checked
        against the schema of the contract that produces it.


        | Metric | Source | Requirement |
        |---|---|---|
        | `loyaltyActiveMembers` | `marketing.loyalty_position` members with a `marketing.loyalty_points` movement in the period | 5.4.27 |
        | `loyaltyTierDistribution` | `marketing.loyalty_position.tier_id` against `marketing.programme_tier`, members per tier | 5.4.27 |
        | `loyaltyPointsLiability` | the balance of `ledger.journal_line` on each programme''s `pointsLiabilityAccountId`, where points post on accrual and release on redemption or expiry | 5.4.27 |
        | `loyaltyBreakageRate` | `marketing.loyalty_points` expiry movements over points earned, in the period | 5.4.27 |
        | `loyaltyMemberRetention` | members with a movement in the previous period who also have one in this period | 5.4.27 |
        | `challengeParticipationRate` | distinct `marketing.challenge_progress.subject_id` over active loyalty members | 22.6.20 |
        | `gamificationLoyaltyImpact` | points earned per member, challenge participants against non-participants (`marketing.loyalty_points` split by `marketing.challenge_progress`) | 22.6.20 |
        | `gamificationMembershipImpact` | joins and renewals in `identity.customer_membership`, participants against non-participants | 22.6.20 |
        | `gamificationRetention` | return visits (`access.scan_event`, in-direction) of participants against non-participants | 22.6.20 |
        | `accreditationApplications` | `accreditation.application` by `status` | 12.1.50 |
        | `accreditationTimeToDecision` | `accreditation.application.decided_at` minus `submitted_at` | 12.1.50 |
        | `accreditationCredentialsIssued` | `accreditation.credential.issued_at` | 12.1.50 |
        | `accreditationActiveHolders` | `accreditation.holder` `active`, by `category_code` | 12.1.50 |
        | `accreditationRenewalsDue` | `accreditation.holder.valid_to` inside `accreditation.validity.renewal_window_days` | 12.1.50 |


        **`staffingShortfall` added the same evening (build pass, group G2; 8.2.49)**: the largest gap in the
        window between the staff rostered and the staff the forecast requires, per venue and position, from
        `workforce.forecast_requirement` (the handed-over AI staff requirement) against `workforce.rota_assignment`
        and `workforce.open_shift`, computed as `workforce.getStaffingCoverage` with `basis`
        `forecastRequirement`. An `AlertRule` on it with `comparator` `above` and `threshold` 0 is the staffing
        shortage alert; `windowMinutes` looks ahead rather than back for this metric (the rota for the coming
        window), and `cooldownMinutes` stops one short shift alerting every quarter hour.


        **Points issued, points redeemed, campaign performance and reward redemption were already served**
        by the `loyalty` and `campaigns` sources, and challenge completion and revenue attribution by
        `challengeCompletionRate` and `attributedRevenue`.

        '
      x-ticvai-extended-2-october: '**Eight finance measures added 2 October 2026** (Chinmay; CHG-FIN-007,
        CHG-FIN-010), each with the source and formula of the seeded KPI of the same code in
        `ReportingSystemKpi`: `grossSales`, `discounts`, `refunds`, `netRevenue`, `recognisedRevenue`,
        `deferredRevenue`, `taxCollected` and `takings`, so an alert rule can watch them (a refund spike,
        takings below a target). Formulas are the D-185 default; client finance sign-off is pending.'
      x-ticvai-money-valued-note: '**`salesByOperator`, `salesByWorkstation` and `resaleVolume` are not
        listed because the package does not say whether they count sales or sum their value.** Until
        that is decided, a rule on them carries a plain number.

        '
      x-ticvai-extended: 18 August 2026
      x-ticvai-extension-note: '**Nineteen metrics added when their upstream models landed**, which is
        how BL-053 was always going to close — not by changing `reporting` but by building the things
        it wanted to report on.

        `inventoryValuation`, `stockTurnover`, `stockAgeing` and `wastageRate` came from `inventory.StockBatch`;
        `resaleVolume` and `resaleCommission` from `orders.ResaleListing`; **`salesByInstructor` from
        `resources.Resource`, which was the one metric this enum deliberately refused to name in the morning**
        because nothing produced it. `allocationUtilisation` from `PartnerUser` and `ChannelListing`,
        `membershipChurn` from `Journey`, `supplierDeliveryPerformance` from `ProductionRun`, `assetDowntime`
        and `meanTimeToRepair` from `WorkOrder.downtimeMinutes`, `challengeCompletionRate` from `ChallengeProgress`,
        `attributedRevenue` from `AttributionTouch`.

        **Each was checked against the schema before being named.** That rule has not changed — naming
        a metric with no source is the defect this enum exists to prevent.

        '
    DataSource:
      type: string
      description: 'What a report may be built over. **A closed set, and that is the point** — a builder
        that accepts any table will happily produce a report over data nobody maintains.

        **Eight sources added 18 August** (BL-143), each because the matrix asks for a report the builder
        could not source. `stockCounts` and `waste`: 6.1.21 wants count variance and `stockMovements`
        records the movement rather than **the count that found the discrepancy**. `workstations`, `devices`
        and `principals`: 6.1.28 — **who did what at which till** is the question an auditor asks first
        and it had no source. `loyalty`: 6.1.37, points earned, burned and expiring. `reviews`: 6.1.46.
        `queueEntries`: **wait times are already measured and nothing could report on them.**

        **Adding a source is a decision, not an omission.** `principals`, `guests`, `loyalty` and `reviews`
        all name a person, and `REPORT_EXPORT_PII` gates them.


        **`forecastPoints` added 29 September** (8.2.55, build pass, group G2): the points of published AI
        forecast versions; see `x-ticvai-forecast-points`.


        **Three accreditation sources added 29 September** (12.1.50, build pass): `accreditationApplications`,
        `accreditationHolders` and `accreditationCredentials`, over `accreditation.application`,
        `accreditation.holder` and `accreditation.credential`. They are what the accreditation KPIs and any
        accreditation report or export (`exportReportResult`, csv or xlsx) are built over. **All three name
        a person**, and `REPORT_EXPORT_PII` gates them as it gates `guests`.

        '
      enum:
      - orders
      - orderLines
      - payments
      - refunds
      - shifts
      - scanEvents
      - entitlements
      - products
      - inventory
      - stockMovements
      - stockCounts
      - waste
      - workstations
      - devices
      - principals
      - loyalty
      - reviews
      - queueEntries
      - guests
      - campaigns
      - cases
      - ledgerEntries
      - workOrders
      - approvals
      - purchaseOrders
      - receipts
      - requisitions
      - stockBatches
      - resourceBookings
      - delegations
      - forms
      - challenges
      - wallets
      - resaleListings
      - accreditationApplications
      - accreditationHolders
      - accreditationCredentials
      - forecastPoints
      x-ticvai-forecast-points: '**`forecastPoints` added 29 September (build pass, group G2; 8.2.55)**: one row per
        forecast point (`ai.forecast_point`) of a **published** forecast version (`ai.forecast_version` status
        `published`), with the definition it belongs to (`ai.forecast_definition`: subject, grain, unit), the
        period, the dimension key and the p10, p50 and p90 values. Draft, awaiting-approval and superseded versions are not
        reachable, and scenario points (`scenarioId` set) only with the scenario named as a filter: **a forecast
        leaves the platform as the one somebody published**. It is how a forecast is exported (`runReport` then
        `exportReportResult`, csv or xlsx), scheduled or put on a dashboard. Names no person, so `REPORT_EXPORT` is
        enough. Read from the reporting replica of the AI log database (design 2.4), never from the model service.

        '
