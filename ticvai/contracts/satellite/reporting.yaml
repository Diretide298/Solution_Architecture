            (29 September, design 2.2 E). **A follow-up edits this**, rather than asking the model to
            rewrite SQL. Null on rows kept before the semantic compile.

            '
        askedByPrincipalId:
          type: string
          format: uuid
        askedAt:
          type: string
          format: date-time
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). **Operations write it at `venue` scope.**'
    ReportQuestionProblem:
      x-ticvai-persistence: none — error shape
      description: '`askReportingQuestion` could not interpret the question. **The response suggests
        alternatives**, and this is where they are — the shared `Problem` has no field for them.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - suggestions
        properties:
          suggestions:
            type: array
            description: Questions close to the one asked that the service can answer, most likely
              first. May be empty.
            items:
              type: string
    ReportingSemanticQuerySpec:
      x-ticvai-persistence: none — embedded; stored whole in `reporting.natural_language_query`
      type: object
      description: '**A question in the semantic model''s own vocabulary** (decided 29 September, AI
        system design 2.2 E and 5.7). What the model returns for a live-number question instead of SQL,
        and what `runSemanticQuery` takes. Every code is a `SemanticModel` field code or a KPI code;
        Reporting validates the spec against the published model and compiles it deterministically, so
        the same spec compiles to the same SQL for the same model version.

        '
      required:
      - metric
      - period
      properties:
        metric:
          type: string
          description: A measure field code in the `SemanticModel`, or a `KpiDefinition.code`. The
            governed definition the dashboards use, so the number matches them.
        dimensions:
          type: array
          maxItems: 5
          description: Field codes to group by. Each must be reachable from the metric's dataset through
            a relationship the semantic model declares.
          items:
            type: string
        filters:
          type: array
          items:
            type: object
            required:
            - field
            - operator
            properties:
              field:
                type: string
                description: A `SemanticModel` field code.
              operator:
                type: string
                enum:
                - equals
                - notEquals
                - greaterThan
                - lessThan
                - between
                - in
                - notIn
                - isNull
                - isNotNull
              values:
                type: array
                description: '**Open on purpose; typed by the field.** One value for the comparison
                  operators, exactly two (from, to) for `between`, any number for `in` and `notIn`,
                  none for `isNull` and `isNotNull`.

                  '
                items: {}
        period:
          type: string
          description: ISO 8601 interval in the venue's time zone, e.g. `2026-09-21/2026-09-27`, the
            form `explainMetricChange` takes.
        comparison:
          type: string
          nullable: true
          description: As `getKpiValues` `compareTo`. With one, each row carries the metric for the
            comparison beside the current value.
          enum:
          - previousPeriod
          - samePeriodLastYear
          - target
          - benchmark
        semanticModelVersion:
          type: integer
          readOnly: true
          description: The `SemanticModel.version` the spec was validated and compiled against. Set by
            Reporting.
    ReportingSemanticQueryResult:
      x-ticvai-persistence: none — computed
      type: object
      description: What `runSemanticQuery` returns (29 September, design 2.2 E and 5.7).
      required:
      - spec
      - generatedQuery
      - result
      - dataAsOf
      properties:
        spec:
          $ref: '#/components/schemas/ReportingSemanticQuerySpec'
          description: The spec as validated, with `semanticModelVersion` set.
        generatedQuery:
          $ref: '#/components/schemas/GeneratedQuery'
          description: What the spec compiled to, with the SQL in `compiledSql`.
        result:
          $ref: '#/components/schemas/ReportResult'
        dataAsOf:
          type: string
          format: date-time
          description: Replica position the rows were read at, as `ReportResult.dataAsOf`.
    ReportingAnswerReliability:
      type: string
      description: '**How far an analytics answer can be relied on** (decided 29 September, AI system
        design 5.6): a category, never a bare percentage. `grounded`: every figure comes from a result
        of the compiled spec. `partial`: part of the question was answered and the rest was not
        modelled. `conflictingSources`: the result and a cited source disagree. `insufficientEvidence`:
        the question could not be answered, including "not available yet" outside the semantic model.
        The same four values as `ai.yaml`''s assistant answers.

        '
      enum:
      - grounded
      - partial
      - conflictingSources
      - insufficientEvidence
    ReportingUnavailableReason:
      type: string
      description: Which part of a question is outside the semantic model, so the answer is "not
        available yet" (design 5.7). A metric or field the caller may not see is reported as not
        modelled, so the reason does not reveal that it exists.
      enum:
      - metricNotModelled
      - dimensionNotModelled
      - filterNotModelled
      - comparisonNotAvailable
      - periodOutsideHistory
    ReportingSemanticQueryProblem:
      x-ticvai-persistence: none — error shape
      description: '`runSemanticQuery` could not resolve the spec against the semantic model. The shared
        `Problem` has no field for which part, so this carries it.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - unavailableReason
        properties:
          unavailableReason:
            $ref: '#/components/schemas/ReportingUnavailableReason'
          unresolvedCodes:
            type: array
            description: The metric, dimension or field codes that did not resolve, as given in the spec.
            items:
              type: string
    MetricValue:
      x-ticvai-persistence-column: numeric(18,4)
      description: '**A reading of a metric or KPI, or a threshold on one.** A `Money` where the metric
        is money-valued — `MetricSource` lists those in `x-ticvai-money-valued`, and a KPI is when its
        `unit` is `currency` — and a plain number otherwise. naming-and-style 5.1: money is never a
        float, at any layer.

        Stored as `numeric(18,4)` either way: a money value stores its amount, and currency and scale
        resolve from the scope as they do for every `Money`.

        '
      oneOf:
      - type: number
      - $ref: ../shared/common.yaml#/components/schemas/Money
    AlertSeverity:
      type: string
      description: How urgent an alert rule's breach is. Shared by `AlertRule`, `Alert` and the
        `listAlerts` filter.
      enum:
      - info
      - warning
      - critical
    AlertStatus:
      type: string
      description: Where a raised alert is. Shared by `Alert` and the `listAlerts` filter.
      enum:
      - raised
      - acknowledged
      - resolved
      - expired
    AnomalySeverity:
      type: string
      description: Shared by `AnalyticsAnomaly` and the `listAnalyticsAnomalies` filter.
      enum:
      - low
      - medium
      - high
    BenchmarkNormalisation:
      type: string
      description: The basis a benchmark is compared on. Shared by `getAnalyticsBenchmark` and
        `BenchmarkRow`.
      enum:
      - none
      - perVisitor
      - perOperatingHour
      - perStaffedPosition
      - perSquareMetre
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell, as `../shared/common.yaml` `serviceAuth`. Used by `runSemanticQuery`,
        which the `ai` service calls for a staff member named in the request.
