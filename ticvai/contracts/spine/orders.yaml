              type: string
              nullable: true
              x-ticvai-persisted: false
              description: "**Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped\
                \ and not overri dable below, so a row in a UAE region is AED and cannot be anything else\
                \ — storing it per ro w is a copy of a fact that cannot differ. **Kept on the wire, removed\
                \ from the table**: a cl ient reading a figure should not walk a hierarchy to know what\
                \ it means, and the database sh ould not hold nine million copies of AED. Four tables\
                \ genuinely differ from their region and\n keep a stored currency — `orders.payment.tender_currency`,\
                \ `inventory.supplier`, `ledger.ac\ncount`, `control.partner_agreement`. **A guest paying\
                \ USD at an AED venue is a real row; a w orkstation with its own currency is a misconfiguration.**\n"
            method:
              type: string
              nullable: true
            issuerCountry:
              type: string
              nullable: true
            minAmount:
              $ref: ../shared/common.yaml#/components/schemas/Money
            maxAmount:
              $ref: ../shared/common.yaml#/components/schemas/Money
        fallbackProviderId:
          type: string
          format: uuid
          nullable: true
          description: '**Where this provider declines or is unreachable.** A decline is not always a
            fallback case — an insufficient-funds decline should not be retried elsewhere, and a gateway
            timeout should.

            '
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    PaymentToken:
      type: object
      x-ticvai-persistence: payments.token
      description: 'BL-116. **A stored credential, held by the provider and referenced here.** The platform
        never sees a card number, which is what keeps PCI scope where it belongs.

        **A token is provider-scoped.** A card tokenised with one gateway does not work with another,
