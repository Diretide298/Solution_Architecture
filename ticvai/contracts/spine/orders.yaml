      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        addLines:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderLine'
        removeLineIds:
          type: array
          items:
            type: string
        reason:
          type: string
          maxLength: 500
        recordedAt:
          type: string
          format: date-time
    PaymentLink:
      type: object
      x-ticvai-persistence: orders.payment_link
      description: 'BL-072. **A booking taken at POS could not be paid later by the guest**, so a phone
        booking either took a card over the phone or was not taken.

        `createPaymentLink` was contracted on 18 August with no schema behind it and no guest-facing path.
        **The link existed and nobody could open it** — found on 20 August by walking the journey rather
        than the contract.

        **The link is the credential.** A guest holding one is anonymous: not signed in, and quite possibly
        without an account, because a phone booking is exactly the case where they have not registered.
        The token grants read of one order and payment against it, and nothing else.

        '
      required:
      - id
      - orderId
      - token
      - status
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        reservationId:
          type: string
          format: uuid
          nullable: true
          description: 'Where the link was issued against a reservation rather than an order. **A reservation
            holds inventory and carries no money**, which is the whole reason a link is needed.

            '
        token:
          type: string
          format: password
          description: '**Write-only, single purpose, and it is the only thing the guest presents.** Long
            enough not to be guessed and scoped to one order — **a token that can read a second order
            is a token that read somebody else''s booking.**

            '
        status:
          type: string
          enum:
          - issued
          - viewed
          - paid
          - expired
          - cancelled
          - superseded
        channel:
          type: string
          enum:
          - email
          - sms
          - whatsapp
          - printed
        sentTo:
          type: string
          nullable: true
          description: 'Masked. **The address it went to is how an operator answers *I never got it***
            — and it is personal data, so it is masked here and resolved from `pii` when somebody with
            permission asks.

            '
        expiresAt:
          type: string
          format: date-time
          description: '**The expiry releases the hold, not just the link.** An unpaid link holding inventory
            is inventory nobody can sell, and a link that outlives its hold sells a seat twice.

            '
        releaseHoldOnExpiry:
          type: boolean
          default: true
        viewedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        resendCount:
          type: integer
          default: 0
          description: '**A resend supersedes rather than duplicates.** Two live links against one order
            is two guests paying for the same booking, and the second payment is a refund somebody has
            to make.

            '
        issuedByPrincipalId:
          type: string
          format: uuid
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    PerformanceTarget:
      type: object
      description: 'BL-098, 2.14.3 and 2.14.4. **Performance targets existed nowhere in the package**,
        and `performance/SLA` was one of the three artefact classes still open — until CF-144 found the
        RFP stating 99.9% uptime, which had been there all along.

        **Latency budgets on the critical sale path only.** A budget on every operation is a budget nobody
        measures; **these are the six where a slow response loses a sale or holds a queue.**

        | Operation | Budget | |---|---| | `addCartLine` | 300ms p95 | | `createPayment` | 1500ms p95
        — **includes the gateway, which is most of it** | | `validateAccess` | 200ms p95 — **a turnstile,
        and the guest is walking** | | `getSeatAvailability` | 500ms p95 | | `identifyGuest` | 400ms p95
        | | `recordGamePlay` | 250ms p95 |

        **Measured at the edge, not in the service.** A 200ms service behind a 900ms gateway is a 900ms
        turnstile to the guest standing at it.

        '
      properties:
        operationId:
          type: string
        p95Ms:
          type: integer
        p99Ms:
          type: integer
        measuredAt:
          type: string
          enum:
          - edge
          - service
          default: edge
        isCriticalPath:
          type: boolean
    GroupBooking:
      type: object
      x-ticvai-persistence: orders.group_booking
      description: 'BL-028. **`BO-026 Group Bookings` ran on generic order operations** — no group size,
        no quota, no leader, no per-attendee capture.

        **The leader is the point.** A school booking forty places has one person who pays, one who is
        called if the coach is late, and forty who need names collecting — and a generic order has one
        guest.

        '
      required:
      - id
      - orderId
      - leaderSubjectId
      - expectedSize
      - status
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        leaderSubjectId:
          type: string
          format: uuid
        organisationName:
          type: string
          nullable: true
        expectedSize:
          type: integer
        confirmedSize:
          type: integer
          nullable: true
        minimumSize:
          type: integer
          nullable: true
          description: '**Below which the group rate does not apply.** A booking for forty that arrives
            as twelve is a pricing question somebody has to answer at the gate, and stating the threshold
            means answering it at booking instead.

            '
        attendeeCaptureRequired:
          type: boolean
          default: false
          description: '**Whether names are needed before admission.** A school trip usually needs them
            and a corporate day out usually does not, and the difference is a safeguarding requirement
            rather than a preference.

            '
        attendeeCaptureDueBy:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - provisional
          - confirmed
          - namesPending
          - complete
          - cancelled
    WalletPass:
      type: object
      x-ticvai-persistence: orders.wallet_pass
      description: 'BL-029. **`appleWallet` and `googlePay` are feature toggles on the native apps** —
        there is no pass generation, no update push, no serial and no authentication token.

        **A wallet pass is a live object, not a download.** The value over a PDF is that it updates: a
        changed gate, a cancelled performance, a time that moved. **A pass that cannot be pushed to is
        a screenshot with better rounding.**

        '
      required:
      - id
      - entitlementId
      - platform
      - serialNumber
      - status
      properties:
        id:
          type: string
          format: uuid
        entitlementId:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - apple
          - google
        serialNumber:
          type: string
        authenticationToken:
          type: string
          format: password
          description: '**Write-only.** How the device proves it may fetch an update, and the reason a
            leaked serial alone is not enough to read somebody''s ticket.

            '
        status:
          type: string
          enum:
          - issued
          - updated
          - voided
          - expired
        lastPushedAt:
          type: string
          format: date-time
          nullable: true
        deviceRegistrations:
          type: integer
          description: 'How many devices hold it. **A guest with the pass on a phone and a watch is one
            entitlement and two registrations**, and both need the update.

            '
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    ResaleListing:
      type: object
      x-ticvai-persistence: orders.resale_listing
      description: 'BL-060. **Smaller than it first looked** — most of the machinery exists. An entitlement
        can already be transferred, an order can already be created, and payment already routes. What
        was missing is the listing itself and a cart line that can point at one.

        **A resale is a transfer with money attached**, and the venue is in the middle: the seller''s
        entitlement is voided and a new one issued to the buyer, so **the ticket that admits is always
        one the venue issued.** That is what stops a screenshot at the gate.

        '
      required:
      - id
      - entitlementId
      - sellerSubjectId
      - askPrice
      - status
      properties:
        id:
          type: string
          format: uuid
        entitlementId:
          type: string
          format: uuid
        sellerSubjectId:
          type: string
          format: uuid
        askPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        priceCapPercent:
          type: number
          nullable: true
          description: '**A ceiling as a percentage of face value**, because uncapped resale is a venue
            watching its own tickets sold at four times the price with its name on them. Null means uncapped,
            which is a venue decision rather than a default.

            '
        sellerFeePercent:
          type: number
        buyerFeePercent:
          type: number
        status:
          type: string
          enum:
          - listed
          - reserved
          - sold
          - withdrawn
          - expired
        listedAt:
          type: string
          format: date-time
        soldToSubjectId:
          type: string
          format: uuid
          nullable: true
        payoutStatus:
          type: string
          enum:
          - pending
          - held
          - paid
          - failed
          description: '**The seller is paid after the buyer is admitted, not after they pay.** A resale
            refunded at the gate for a void ticket cannot be clawed back from a seller who has already
            been paid.

            '
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    TicketTemplate:
      type: object
      x-ticvai-persistence: orders.ticket_template
      description: 'BL-102. **A venue changing its ticket artwork had no path that was not a code change.**

        2.16.6 asks to print a proof without processing a sale — the equivalent of `white-label.createPreview`,
        and the same reason: **artwork is checked by looking at it, and the only way to look at it was
        to sell something.**

        '
      required:
      - id
      - name
      - mediaType
      - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isRecyclable:
          type: boolean
          default: false
          description: 'BL-103. **An RFID wristband handed back at the exit is stock, not waste** — and
            nothing released it, so a venue reissuing one had a card serving two entitlements.

            **Replacement disables the previous medium automatically**, following the F23 rule: a guest
            issued a replacement wristband must not walk in on the old one, and relying on somebody remembering
            to blacklist it is how they do.

            '
        recycleAfterDays:
          type: integer
          nullable: true
          description: '**A quarantine before reissue.** A wristband returned today and reissued tomorrow
            to a different guest is a support call waiting to happen when the first guest''s app still
            shows it.

            '
        mediaType:
          type: string
          enum:
          - thermalTicket
          - a4Pdf
          - wristband
          - rfidCard
          - walletPass
          - qrOnly
          - sms
        appliesToProductKinds:
          type: array
          items:
            type: string
        appliesToChannels:
          type: array
          items:
            $ref: ../shared/common.yaml#/components/schemas/SalesChannel
        selectionPriority:
          type: integer
          default: 100
          description: '2.16.x. **Automatic media-type selection**, which was absent — a kiosk with no
            printer and a guest with no smartphone need different answers, and neither should be chosen
            by the caller.

            '
        layoutRef:
          type: string
        localeVariants:
          type: object
          additionalProperties:
            type: string
        isActive:
          type: boolean
    Chargeback:
      type: object
      x-ticvai-persistence: orders.chargeback
      description: 'BL-118, CF-144. **A chargeback is not a refund**, and treating it as one is how a
        venue loses them by default.

        A refund is a decision the venue makes. **A chargeback is a decision a bank makes, on a clock
        the venue does not control** — evidence is due in days, a deadline missed is a case lost regardless
        of merit, and there is a fee either way.

        The money is already gone when this record is created. **Representment is an argument, not a reversal.**

        '
      required:
      - id
      - paymentId
      - amount
      - reason
      - status
      - evidenceDueBy
      properties:
        id:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        providerCaseReference:
          type: string
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        feeAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        reason:
          type: string
          enum:
          - fraudulent
          - productNotReceived
          - productUnacceptable
          - duplicate
          - subscriptionCancelled
          - creditNotProcessed
          - unrecognised
          - other
          description: '**The scheme''s reason code, mapped.** Which evidence wins depends entirely on
            it — a *product not received* case is answered by a scan record and a *fraudulent* case is
            not.

            '
        status:
          type: string
          enum:
          - received
          - underReview
          - evidenceSubmitted
          - won
          - lost
          - accepted
          - expired
        evidenceDueBy:
          type: string
          format: date-time
          description: '**The field the whole record exists for.** A deadline missed is a case lost on
            merit nobody read, and it is the one date that must reach a person rather than a report.

            '
        evidenceSubmittedAt:
          type: string
          format: date-time
          nullable: true
        evidence:
          type: array
          description: '**What the platform can prove**, assembled rather than typed: the order, the scan
            that admitted them, the delivery, the terms accepted, the IP and device. A venue answering
            a chargeback by hand is a venue answering it late.

            '
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - order
                - scanRecord
                - deliveryProof
                - termsAccepted
                - communication
                - deviceFingerprint
                - other
              reference:
                type: string
        outcomeAt:
          type: string
          format: date-time
          nullable: true
    FraudRule:
      type: object
      x-ticvai-persistence: orders.fraud_rule
      description: 'BL-118. **Evaluated before the charge, and it holds rather than refuses.**

        A rule that declines outright turns a false positive into a lost sale with an angry guest. **A
        rule that flags for review turns it into a delay** — and at a gate, review means a supervisor
        rather than a rejection.

        '
      required:
      - id
      - name
      - condition
      - action
      - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        condition:
          type: object
          description: Velocity, amount, issuer country, device reuse, mismatched billing.
          additionalProperties: true
        action:
          type: string
          enum:
          - allow
          - flagForReview
          - requireStepUp
          - hold
          - decline
        riskWeight:
          type: integer
        isActive:
          type: boolean
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    PaymentProvider:
      type: object
      x-ticvai-persistence: payments.provider
      description: 'BL-116, CF-131. **`Payment` carried `providerName` and `providerReference`, which
        records a provider and does not abstract one.**

        Two gateways are confirmed for Phase 1 — **Network International and Stripe** — and that is exactly
        the number that forces this: **one gateway can be hard-coded and two cannot.**

        Credentials live in the vault and never here, following `ai.AiProvider` (ADR-0020''s rule applied
        outside AI): **no surface ever holds a provider key.**

        '
      required:
      - id
      - name
      - kind
      - isActive
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - networkInternational
          - stripe
          - adyen
          - checkout
          - cash
          - wallet
          - other
        supportedMethods:
          type: array
          items:
            type: string
            enum:
            - card
            - applePay
            - googlePay
            - samsungPay
            - wallet
            - bankTransfer
            - cash
            - bnpl
