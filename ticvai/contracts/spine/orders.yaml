      description: '**Drafted from the workshop pack; the shape below is read out of it, not invented.**
        Ticket Resale Marketplace, page 54. The screen says: This is the key architecture/configuration
        screen It defines how each TICVAI client chooses to expose the resale marketplace to its customers.
        Deployment Model A — Embedded White-Label


        **Every property carries the sentence it came from.** 40 were read from the screen''s own bulleted
