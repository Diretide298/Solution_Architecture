    PaymentRouting:
      type: object
      x-ticvai-persistence: payments.routing_rule
      description: '**Which provider takes a given payment, and why.** With two gateways the question
        is live from day one: a UAE card may cost less through one and an international card less through
        the other.

        **Ordered rules, first match wins, and a fallback that is not optional.** A gateway outage with
        no fallback is a venue that cannot sell.

        '
      required:
      - id
      - priority
      - providerId
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
        providerId:
          type: string
          format: uuid
        conditions:
          type: object
          description: '**Match on what is known before the charge** — channel, currency, method, issuer
            country, amount band. Not on anything that requires asking the provider first.

            '
          properties:
            channel:
              $ref: ../shared/common.yaml#/components/schemas/SalesChannel
