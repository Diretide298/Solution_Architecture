      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: checkoutCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P02 GST-009 Review & Payment"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-041 Checkout Entry"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience:
      - guest
      - partner
      summary: Turn the cart into an order
      description: '**Transfers the leases to the order rather than releasing and re-acquiring them.**
        Releasing first would let another guest take the capacity between the two calls, which is the
        failure that makes a checkout feel unreliable at exactly the wrong moment.

        The cart is retained, not deleted — a checkout that fails at payment must be resumable, and a
        guest whose card was declined should still have their seats.

        **One cart, one order, one receipt** across ticketing, F&B and retail (14 August).

        **No order against an unproven contact on the guest web or app** (decided 17 September 2026;
        the rule is on `identity` `verifyGuestEmail`). A signed-in session must be verified; where the
        site''s `guestCheckout` feature is on, a guest without an account must have proved the email or
        mobile the tickets go to with a one-time code. **Kiosk walk-up orders are exempt** — the tickets
        are printed for the person standing there.

        **This operation is the gate, and the cart is not**
        ([ADR-0045](../../docs/adr/0045-every-order-carries-a-proven-contact.md), 18 September 2026,
        matrix 2.6.1 §2.4). Anyone may fill a cart. The fork between signing in and supplying guest
        details belongs to the checkout page — `WEB-011`, `GST-041` — and this call refuses until one
        of them has completed, keeping the cart so the guest resumes rather than restarts.

        '
      tags:
      - cart
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
