            and the settlement currency is the venue''s (CF-114 on multi-currency).

            '
          items:
            type: string
        supports3ds:
          type: boolean
          default: true
        terminal:
          type: object
          nullable: true
          description: 'BL-119. **Terminal behaviour, where this provider drives a physical device.**
