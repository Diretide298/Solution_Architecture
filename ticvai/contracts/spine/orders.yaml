openapi: 3.1.0
info:
  title: TICVAI Order & Payment
  version: 0.1.0
  x-ticvai-screen-count: 155
  x-ticvai-tier: spine
  x-ticvai-module: 2 — Ticketing Sales
  x-ticvai-requirements: 343
  x-ticvai-capabilities:
  - C02
  - C03
  - C04
  - C34
  - C47
  x-ticvai-platforms:
  - P04 POS
  - P01 Guest Web
  - P02 Guest App
  - P05 Guest Kiosk
  - P10 Partner Web
  - P12 Venue Support
  description: "## What this contract covers\n**Money moves here. One atomic transaction with entitlement\
    \ and ledger.**\n| | | |---|---| | **Tier** | spine | | **Matrix domain** | 2 — Ticketing Sales |\
    \ | **Requirements** | ~343 | | **Capabilities** | C02, C03, C04, C34, C47 | | **Consumed by** | P04\
    \ POS · P01 Guest Web · P02 Guest App · P05 Guest Kiosk · P10 Partner Web · P12 Venue Support |\n\
    ## How to read this file\n**This file is a contract.** It is hand-authored and it is the source of\
    \ truth for one bounded context: server code, client code and mock servers are generated from it,\
    \ never the other way round. If a field is not here, it does not exist.\n**Contracts are split into\
    \ two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy, identity,\n\
    \  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n  requires\
    \ a formal change request, because every satellite has pinned against it.\n- **Satellite** — a domain\
    \ that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths` are operations.**\
    \ Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n| Extension |\
    \ Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From one enum in\
    \ `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the seven-level\
    \ hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected terminal\
    \ may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`,\
    \ `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`\
    \ (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table\
    \ name, a list of tables, or `none` with a reason. It is documentation of the mapping, not a generator\
    \ input — the DDL lives in versioned SQL migrations, because partitioning, RLS policies, `ltree` indexes\
    \ and partial indexes have no expression in OpenAPI.\n**`security` arrays hold OAuth scopes.** Empty\
    \ means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty is not the\
    \ same as absent: absent means unauthenticated.\n\n## This context\nOrders, payments, refunds, voids\
    \ and reservations. Shift and till are separate (`shift.yaml`).\nPositions this encodes:\n- **The\
    \ server re-prices every line on ingest** (ADR-0013). The local price is the\n  guest's answer; the\
    \ server is authoritative for the ledger. Where they disagree the\n  quoted price is honoured and\
    \ a variance is posted — the guest has already paid and\n  left, so the ledger records what happened\
    \ rather than what should have.\n- **Refund thresholds are venue policy, not permission scope** (CF-36).\
    \ `ORDER_REFUND`\n  is binary. How much a holder may refund without a second authoriser is configured\
    \ per\n  venue, because venues run different policies.\n- **Dual-authorisation, not escalation** (2.12.3).\
    \ Above threshold a second user — cashier\n  or supervisor — names themselves as audit control. That\
    \ is a different mechanism from\n  escalating to a higher permission.\n- **Orders never span cells**\
    \ (ADR-0010). The selling cell owns the order; redemption\n  rights propagate.\n- Payment recovery\
    \ matters more than the happy path. A terminal that charged a card and\n  never received a response\
    \ is the normal failure, not the exotic one.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: order
- name: b2b
- name: payment
- name: refund
- name: reservation
- name: policy
- name: sync
paths:
  /carts:
    post:
      operationId: createCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
      x-ticvai-audience:
      - guest
      summary: Start a cart
      description: '**A cart holds leases; an order holds money.** Different lifetimes, different failure
        modes, and merging them is why this contract did not exist until 17 August — `createOrder` takes
        a whole basket at once, which is correct for a till and cannot be resumed on another device.

        Created against a guest subject where one is known, or an anonymous token where it is not. **The
        token is what lets a guest browse before signing in** and keep their cart when they do (2.1.31).

        **POS does not use this.** A till builds its sale locally and submits atomically, because it works
        offline and does not need a resumable cart. Same order contract, different channel.

        '
      tags:
      - cart
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - venueId
              - channel
              properties:
                venueId:
                  type: string
                  format: uuid
                channel:
                  $ref: ../shared/common.yaml#/components/schemas/SalesChannel
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                locale:
                  type: string
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
  /my/orders:
    get:
      operationId: listMyOrders
      x-ticvai-consumed-by:
        - "P01 WEB-019 Order History"
        - "P02 GST-019 Order History"
      summary: The orders this guest placed
      description: '**Raised in review 24 August** against `GST-019` and `WEB-019`. `listOrders` was on
        both screens and it is the staff-scoped one — a guest reading their own history through an operation
        that takes a venue filter is a guest one parameter away from somebody else''s.

        **Scoped to the caller, not filtered by it.** The same shape as `listMyCases` and `listMyEntitlements`:
        a guest-facing list that accepts a subject is a list somebody will call with another subject.

        '
      tags:
      - orders
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /fraud-rules:
    get:
      operationId: listFraudRules
      summary: The rules evaluated before a charge
      description: 'BL-118. **`orders.fraud_rule` existed with six columns and no operation read or wrote
        it** — found on 20 August by auditing which tables no operation names.

        **It holds rather than declines.** A rule that declines outright turns a false positive into a
        lost sale nobody hears about; a hold turns it into a review somebody can clear.

        `riskWeight` accumulates across rules, so **three weak signals can hold a transaction that no
        single rule would** — which is the point of a weight rather than a flag.

        '
      tags:
      - orders
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Rules, in evaluation order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    put:
      operationId: setFraudRules
      summary: Change what holds a transaction
      description: '**The whole set in one call**, because a rule set edited one rule at a time spends
        time in states nobody intended — a threshold lowered before its companion is raised.

        **Deactivated, never deleted.** A held transaction cites the rule that held it, and removing the
        rule leaves a hold nobody can explain.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-permission-escalated: ORDER_MODIFY
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /group-bookings/{groupBookingId}:
    parameters:
    - name: groupBookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getGroupBooking
      x-ticvai-consumed-by:
        - "P01 WEB-031 My Reservations"
        - "P02 GST-072 Share & Group Booking"
      summary: A group, its leader and its manifest
      description: 'BL-028. **`orders.group_booking` had ten columns and nothing read it** — a table built
        and never surfaced.

        **`confirmedSize` against `minimumSize` is the commercial edge.** A group that books for forty
        and confirms twenty-two has either a shortfall to pay or a release to make, and which one depends
        on a term nobody can see without this.

        **`attendeeCaptureRequired` is a legal act, not a preference** — a school group at a venue with
        a waiver requirement cannot admit an unnamed child.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBooking'
  /payment-links/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getPaymentLink
      x-ticvai-consumed-by:
        - "P01 WEB-014 Pay for a Booking"
        - "P02 GST-009 Review & Payment"
        - "P09 ADM-593 Payment Link Distribution & Customer Journey Manager\t74"
      summary: What a guest holding a link is being asked to pay for
      description: 'BL-072. **The operation the link needed and did not have.** `createPaymentLink` was
        contracted and nothing could open one.

        **The caller is anonymous.** No session, no account, and quite possibly no intention of creating
        one — a guest who booked by phone is the case where they have not registered. **The token is the
        credential**, scoped to one order.

        Returns the lines, the total and the deadline. **Never the guest''s other orders**, never their
        profile, and never enough to identify them beyond what they already know.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      - anonymous
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: What is owed, and until when
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/PaymentLink'
                  lines:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderLine'
                  amountDue:
                    $ref: ../shared/common.yaml#/components/schemas/Money
                  venueName:
                    type: string
                  expiresInSeconds:
                    type: integer
        '410':
          description: '**Expired, paid or superseded — and it says which.** A guest opening an email
            three days late is the ordinary case, not an edge: *expired, the hold is released, book again*
            is a different message from *already paid* and from *we sent you a newer link*.

            **404 is never returned for a real token.** Telling somebody their booking does not exist
            when it expired is how a support call starts.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /payment-links/{token}/pay:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: payByLink
      x-ticvai-consumed-by:
        - "P01 WEB-014 Pay for a Booking"
        - "P02 GST-009 Review & Payment"
      summary: Pay for a booking taken at a till
      description: 'BL-072. **Payment against the link, by somebody with no account.**

        **Converts on success, and that is a decision rather than a mechanism** (ADR-0027). The reservation
        becomes an order the moment the money lands, because there is no staff member present at 11pm
        to press a button — **and a paid reservation that is still a reservation is inventory the venue
        thinks it can sell.**

        **The card never reaches the platform.** Tokenised at the gateway like every other payment (CF-131),
        and the link carries no card data at any point.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      - anonymous
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - providerToken
              properties:
                providerToken:
                  type: string
                  format: password
                email:
                  type: string
                  format: email
                  nullable: true
                  description: '**Optional, and only to send the ticket.** Requiring an account before
                    taking money is how a paid booking becomes an abandoned one.

                    '
      responses:
        '200':
          description: Paid, and the reservation converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    format: uuid
                  entitlementIds:
                    type: array
                    items:
                      type: string
        '409':
          description: '**The hold went while they were paying.** Rare and real — a link near its expiry
            and a guest reading slowly. The response names what is no longer available rather than failing
            the whole basket, because **part of a booking is usually still worth having.**

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /payment-links/{linkId}/resend:
    parameters:
    - name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resendPaymentLink
      x-ticvai-consumed-by:
        - "P09 ADM-593 Payment Link Distribution & Customer Journey Manager\t74"
      summary: Send it again, and retire the old one
      description: '**A resend supersedes.** Two live links against one order is two guests paying for
        one booking, and the second payment is a refund somebody has to make.

        The old token stops working immediately and answers `410 superseded` — **not 404**, because a
        guest with the first email needs to know why it stopped rather than whether it was real.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum:
                  - email
                  - sms
                  - whatsapp
                extendExpiryHours:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
  /orders/{orderId}/convert-to-term:
    parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: convertToTermProduct
      summary: Turn a visit into a membership or season pass
      description: 'BL-031. **Not a line exchange, because the price treatment differs.** An exchange
        swaps one product for another at a price difference; a conversion **credits what the guest paid
        today against a term product and starts a new validity period.**

        The classic case: a guest at the gate told *"today''s ticket comes off an annual pass."* **That
        offer is the single most effective upsell a venue has**, and it needed an operation.

        **The credit window is bounded.** A ticket from three months ago is not a deposit, and `creditWithinDays`
        says how long the offer stands.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetProductId
              properties:
                targetProductId:
                  type: string
                  format: uuid
                creditWithinDays:
                  type: integer
                  default: 30
                startFrom:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Converted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /guest-credit-accounts:
    post:
      operationId: openGuestCreditAccount
      summary: A credit limit for an individual booking ahead
      description: 'BL-051, 1.3.51. **`orders.CreditPosition` is B2B only** — a partner with net terms.
        The requirement puts a 25,000 AED limit on an **individual** who books ahead and settles X days
        before.

        **Extending B2B credit to a guest is the same mechanism and a different risk.** A partner is a
        company with a contract; a guest is a person with a phone number, so **`requiresApproval` defaults
        true and the limit is per guest rather than per tier.**

        Where a venue does not want this, the answer is not to open accounts — the model does not force
        it on anybody.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-permission-escalated: ORDER_DISCOUNT
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subjectId
              - creditLimit
              properties:
                subjectId:
                  type: string
                  format: uuid
                creditLimit:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                settlementDaysBeforeVisit:
                  type: integer
                  default: 7
                requiresApproval:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /orders/{orderId}/split:
    parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: splitOrder
      x-ticvai-consumed-by:
        - "P06 EMP-034 Walk-up sale"
      summary: Break one order into independent orders
      description: 'BL-089. **A group that booked together and now pays separately**, or a corporate booking
        being invoiced per department.

        **Payments follow the lines they paid for.** A split that leaves one payment against two orders
        is a reconciliation nobody can do, so a partly-paid order refuses to split until the payment is
        allocated.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - groups
              properties:
                groups:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    properties:
                      lineIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                      subjectId:
                        type: string
                        format: uuid
                        nullable: true
      responses:
        '200':
          description: Split
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
  /entitlements/{entitlementId}/reissue:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reissueEntitlement
      x-ticvai-consumed-by:
        - "P04 POS-026 Receipt & Reprint"
      summary: Zero-value reissue of an expired entitlement for a later date
      description: 'BL-084. **A goodwill act with no money in it**, and treating it as a refund plus a
        sale puts two transactions through the ledger for a gesture that moved nothing.

        Voids the old, issues the new. **The reason is recorded and the original is traceable**, because
        a reissue with no audit is indistinguishable from a ticket appearing from nowhere.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_EXCHANGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - venueClosure
                  - weather
                  - goodwill
                  - systemError
                  - medicalIssue
                  - bereavement
                validFrom:
                  type: string
                  format: date
                  nullable: true
                note:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Reissued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /entitlements/{entitlementId}/share:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: shareEntitlement
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P02 GST-072 Share & Group Booking"
      summary: Let somebody else use this, without giving it away
      description: 'BL-014. **Transfer is contracted and sharing is not, and they are different acts.**
        A transfer changes the holder; a share lets a second person present the same entitlement while
        the first still owns it.

        **The owner can revoke; the recipient cannot transfer on.** That asymmetry is the whole point
        — a shared family pass should not become a resale chain.

        Governed by `EntitlementTemplate.canShareMedia`, which already exists and had nothing behind it.

        '
      tags:
      - orders
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
