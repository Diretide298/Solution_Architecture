          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AppendRefusedProblem'
        '404':
          description: Media not recognised at this venue
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
