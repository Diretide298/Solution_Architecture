          $ref: ../shared/common.yaml#/components/responses/NotFound
    post:
      operationId: appendEntitlementToMedia
      x-ticvai-consumed-by:
        - "P04 POS-010 Add to Existing Ticket"
        - "P06 EMP-036 Issue media"
        - "P08 BO-027 Reissue & Media Replacement"
        - "P13 CMS-010 Media Library"
      x-ticvai-audience:
      - staff
      summary: Add something to a ticket the guest already holds
      description: 'A guest arrives, buys admission, and an hour later wants a locker. They scan the QR
        they are already carrying and the locker attaches to it. **No second QR.**

        Named as important on 14 August: *"I don''t need to give another QR code for the locker. I will
        use the same QR code and I can go and scan it in the locker."*

        This creates a **new order** that issues entitlements onto **existing media**. The original order
        is untouched — it was paid, receipted and possibly reported on, and editing it to add a later
        purchase would make yesterday''s revenue move.

        The media is the join, not the order. That is why this operation is keyed on `mediaCode` rather
        than on an order id: the guest has the wristband in their hand and may not know which order issued
        it.

        '
      tags:
      - order
