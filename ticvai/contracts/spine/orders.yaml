      responses:
        '201':
          description: 'Appended. Returns the new order and the media''s full entitlement set, so the
            cashier can tell the guest what their QR now does.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendEntitlementResult'
        '409':
          description: 'Media expired, blocked, already surrendered at exit, or the entitlement cannot
            share media — a single-entry ticket surrendered at the gate is not a claim token for anything
            bought afterwards.

