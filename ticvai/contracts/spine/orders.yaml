          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: 'The contact the tickets would go to is not proven — an unverified session, or a
            guest checkout with no confirmed one-time code. **The client sends the guest to sign-in or to
            the code step and keeps the cart**; nothing is released.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
