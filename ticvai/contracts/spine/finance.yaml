        type: string
        format: uuid
    patch:
      operationId: updateTaxCode
      x-ticvai-consumed-by:
        - "P08 BO-075 Account Mapping"
      x-ticvai-audience:
      - staff
      summary: Amend a tax code
      description: 'Rate changes are versioned with an effective date, never applied retrospectively.
        Historic entries keep the rate that was in force when they were posted.

        **How a rate change is versioned.** A body carrying `rate` must carry `effectiveFrom`, a day later
        than today in the region''s time zone. The row addressed is closed from that day (its `effectiveTo`
        is set so the two windows meet without overlapping) and **a new row is inserted** with a new `id`,
        the same `code` and the new `rate`, in force from `effectiveFrom`; `compoundOnTaxCodeId`,
        `isInclusive`, `accountId` and `appliesTo` carry over. **The 200 returns the new row.** This is
        the same rule `setFxRate` follows: the old rate is never rewritten.

        `name` and `isActive` alone are not a rate change: they edit the addressed row in place and the
        200 returns it. Only the row in force (no `effectiveTo`) takes a rate change.

        '
      tags:
      - tax
      x-ticvai-permission: TAX_CONFIGURE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  maxLength: 200
                rate:
                  type: number
                  minimum: 0
                  maximum: 100
                effectiveFrom:
                  type: string
                  format: date
                  description: Required with `rate`, and only meaningful with it. A day in the region's
                    time zone, later than today.
                isActive:
                  type: boolean
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated. After a rate change, the new row; otherwise the row addressed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCode'
        '400':
          description: '`rate` without `effectiveFrom`, or `effectiveFrom` without `rate`. `errors[]` names
            the field.

            '
          x-ticvai-problem-types:
          - validation
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: 'A rate change whose `effectiveFrom` is today or earlier, which would reprice postings
            already made; or a rate change addressed to a row that is no longer in force.

            '
          x-ticvai-problem-types:
          - tax-rate-retrospective
          - tax-code-superseded
          content:
            application/problem+json:
