      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - sent
                  - accepted
                  - rejected
                  - failed
                providerMessageId:
                  type: string
                  maxLength: 200
                  nullable: true
                errorCodes:
                  type: array
                  items:
                    type: string
                errorMessage:
                  type: string
                  maxLength: 2000
                  nullable: true
                occurredAt:
                  type: string
                  format: date-time
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinEInvoiceTransmission'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: The transmission is already `accepted`.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /tax/vat-returns:
    get:
      operationId: getVatReturn
      x-ticvai-consumed-by:
        - "P08 BO-090 Period Close"
        - "P09 ADM-068 Tax, Fee & Calculation Command Center"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (retrace 6.1.23); shape follows getFinancialReport'
      x-ticvai-make-or-break: 'Is the FTA VAT 201 box layout (supplies by emirate, zero-rated, exempt, reverse
        charge, imports, tourist refunds, inputs) still the form the client files, and does the client''s tax
        adviser want the emirate taken from the venue address? The form is the regulator''s (CF-133).'
      x-ticvai-read-routing: analytical
      summary: A legal entity's VAT return for a tax period, in the FTA's boxes
      description: >
        6.1.23. **The tax summary laid out as the return is filed**: the FTA VAT 201 boxes, from the postings
        of the period, with standard-rated supplies split by emirate (from each venue's address), zero-rated,
        exempt and reverse-charge supplies, imports, tourist refunds, recoverable input tax and the net
        payable or refundable. Each box carries the tax codes and posting count behind it so it can be traced.
        `format` `csv` or `xlsx` returns the same boxes as a file link for the adviser; `json` for screens.
        Computed from the reporting replica; nothing is stored or filed by this call.
      tags:
      - reporting
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: legalEntityId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: periodFrom
        in: query
        required: true
        description: A day in the region's time zone, local midnight to local midnight.
        schema:
          type: string
          format: date
      - name: periodTo
        in: query
        required: true
        description: A day in the region's time zone, local midnight to local midnight.
        schema:
          type: string
          format: date
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - csv
          - xlsx
          default: json
      responses:
        '200':
          description: The return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinVatReturn'
        '422':
          description: The period is not whole tax months, or the legal entity has no tax registration number.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

components:
  schemas:
    FinTaxInvoiceType:
      type: string
      description: '5.7.93. `simplified` for one order with no recipient details, `full` for one order with
        them, `consolidated` for several paid orders of one buyer on one invoice.

        **When a simplified tax invoice is allowed in the UAE** (research 2 October 2026, CHG-FIN-011;
        Executive Regulation, Cabinet Decision 52 of 2017 as amended, Art. 59(5)): the recipient is not
        VAT-registered, or is registered and the consideration does not exceed AED 10,000, and the
        reverse charge does not apply. Otherwise the invoice is `full`. Both kinds carry the title
        "Tax Invoice" (Art. 59(1)(a), 59(2)(a)); a simplified one is issued on the date of supply
        (Art. 59(13)(1)), a full one within 14 days (Decree-Law Art. 67(1)).'
      enum:
      - simplified
      - full
      - consolidated
    FinTaxInvoiceStatus:
      type: string
      description: '`issued` until a credit memo is issued against it; `superseded` where a full invoice replaced
        a simplified one for the same supply (only if the law allows it; see issueTaxInvoice).'
      enum:
      - issued
      - partiallyCredited
      - fullyCredited
      - superseded
    FinTaxCategory:
      type: string
      description: How a line is treated for VAT. Taken from the tax code the line was posted with.
      enum:
      - standardRated
      - zeroRated
      - exempt
      - outOfScope
      - reverseCharge
    FinIssueTaxInvoiceRequest:
      x-ticvai-persistence: none — request only
      type: object
      required:
      - invoiceType
      - orderIds
      properties:
        invoiceType:
          $ref: '#/components/schemas/FinTaxInvoiceType'
        orderIds:
          type: array
          minItems: 1
          description: One order for `simplified` and `full`; one or more for `consolidated`. Every order must
            be paid, of one buyer, one legal entity and one currency.
          items:
            type: string
            format: uuid
        recipient:
          $ref: '#/components/schemas/FinTaxInvoiceRecipient'
        languages:
          type: array
          description: Overrides the template's languages for this document, within those the template offers.
          items:
            type: string
            pattern: ^[a-z]{2}(-[A-Z]{2})?$
        supersedesInvoiceId:
          type: string
          format: uuid
          nullable: true
          description: A simplified invoice this full invoice replaces for the same supply. Refused unless the law
            allows it (make-or-break on issueTaxInvoice).
        deliverToEmail:
          type: string
          format: email
          nullable: true
          description: Sends the PDF on issue as well as returning it.
    FinTaxInvoiceRecipient:
      x-ticvai-persistence: none — copied onto the invoice as buyer columns
      type: object
      description: Who the invoice is addressed to. Required for `full` and `consolidated`.
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 300
        address:
          type: string
          maxLength: 1000
          nullable: true
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        taxRegistrationNumber:
          type: string
          maxLength: 30
          nullable: true
          description: The recipient's TRN where they are VAT-registered.
        customerAccountId:
          type: string
          format: uuid
          nullable: true
          description: The B2B credit account (payments `B2bCreditAccount`) where a company is invoiced.
    FinTaxInvoiceLine:
      type: object
      description: One line as it was sold and taxed. Amounts are in the invoice currency.
      required:
      - lineNumber
      - description
      - quantity
      - netAmount
      - taxAmount
      - grossAmount
      - taxCategory
      properties:
        lineNumber:
          type: integer
          minimum: 1
        orderId:
          type: string
          format: uuid
        orderLineId:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          maxLength: 500
        quantity:
          type: number
        unitPrice:
          $ref: ../shared/common.yaml#/components/schemas/Money
        discountAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        netAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxCodeId:
          type: string
          format: uuid
          nullable: true
        taxRate:
          type: number
          minimum: 0
          maximum: 100
        taxCategory:
          $ref: '#/components/schemas/FinTaxCategory'
        taxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        grossAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        creditedAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        grossAmountInLegalCurrency:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          readOnly: true
          description: The amount payable for the line in the legal currency (AED), Executive Regulation
            Art. 59(1)(h); equal to `grossAmount` on an invoice in the legal currency (CHG-FIN-011).
    FinTaxInvoice:
      x-ticvai-persistence: ledger.tax_invoice + ledger.tax_invoice_line
      type: object
      description: '5.7.93, 5.10.3. **A guest tax invoice, as issued, never edited.** Corrections are credit
        memos. The supplier block is a snapshot of the legal entity at issue, so a later change of address does
        not change a document already given to a guest.'
      required:
      - id
      - invoiceNumber
      - invoiceType
      - status
      - legalEntityId
      - issuedAt
      - supplyDate
      - currency
      - netAmount
      - taxAmount
      - grossAmount
      - lines
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        invoiceNumber:
          type: string
          readOnly: true
          description: Server-assigned from the legal entity's series for the document kind, in sequence and
            without gaps, e.g. `INV-2026-000123`. Never reused.
        invoiceType:
          $ref: '#/components/schemas/FinTaxInvoiceType'
        status:
          $ref: '#/components/schemas/FinTaxInvoiceStatus'
        legalEntityId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
        venueId:
          type: string
          format: uuid
          nullable: true
        orderIds:
          type: array
          items:
            type: string
            format: uuid
        supplierName:
          type: string
        supplierAddress:
          type: string
          nullable: true
        supplierTaxRegistrationNumber:
          type: string
          nullable: true
        buyerSubjectId:
          type: string
          format: uuid
          nullable: true
          description: The guest the orders belong to; the key a guest's own reads filter on.
        buyerName:
          type: string
          nullable: true
        buyerAddress:
          type: string
          nullable: true
        buyerCountryCode:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        buyerTaxRegistrationNumber:
          type: string
          nullable: true
        customerAccountId:
          type: string
          format: uuid
          nullable: true
        issuedAt:
          type: string
          format: date-time
        supplyDate:
          type: string
          format: date
          description: The date of supply where it differs from the issue date (the latest order's payment date
            on a consolidated invoice). A day in the region's time zone.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        netAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        discountAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        grossAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxAmountInLegalCurrency:
          $ref: ../shared/common.yaml#/components/schemas/Money
          description: >-
            The tax in the legal entity's currency (AED in the UAE) where the invoice currency differs.
            **In the UAE the converted amounts use the UAE Central Bank rate at the date of supply** (Decree-Law
            Art. 69) and the rate is printed (`legalFxRate`, Executive Regulation Art. 59(1)(k));
            CHG-FIN-011.
        legalCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          readOnly: true
          description: The legal entity's currency (AED in the UAE), in which the law requires the tax and
            the gross amount (CHG-FIN-011).
        grossAmountInLegalCurrency:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          readOnly: true
          description: The gross amount payable in the legal currency (Executive Regulation Art. 59(1)(j);
            for a simplified invoice the total consideration, Art. 59(2)(e)). Equal to `grossAmount` when
            the invoice is in the legal currency (CHG-FIN-011).
        legalFxRate:
          allOf:
          - $ref: '#/components/schemas/FxRateValue'
          nullable: true
          readOnly: true
          description: Units of the legal currency per one unit of `currency`, printed with the tax where
            the invoice is not in the legal currency (Art. 59(1)(k)). Null when it is (CHG-FIN-011).
        legalFxRateSource:
          allOf:
          - $ref: '#/components/schemas/FxRateSource'
          nullable: true
          readOnly: true
          description: '`uaeCentralBank` for a UAE legal entity (Decree-Law Art. 69).'
        paidCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          nullable: true
          readOnly: true
          description: Where the guest paid in a currency they selected (`orders.Order.chargeCurrency`,
            CHG-FIN-001), printed as payment information with `paidAmount` and the charge rate. The
            invoice itself is in the base currency, so the AED amounts the law requires are the
            invoice's own figures (CHG-FIN-011).
        paidAmount:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          readOnly: true
          description: What the guest paid in `paidCurrency` (`orders.Order.chargeTotal`).
        reverseChargeStatement:
          type: string
          nullable: true
          readOnly: true
          description: Where the recipient must account for the tax, the statement saying so and the
            Decree-Law provision (Art. 59(1)(l), Art. 48). Null otherwise (CHG-FIN-011).
        creditedAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        languages:
          type: array
          items:
            type: string
        supersedesInvoiceId:
          type: string
          format: uuid
          nullable: true
        renditionAssetId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The PDF rendered at issue; read through getTaxDocumentRendition.
        eInvoiceStatus:
          $ref: '#/components/schemas/FinEInvoiceTransmissionStatus'
        issuedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: Null where the platform issued it.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FinTaxInvoiceLine'
        taxSummary:
          type: array
          x-ticvai-persisted: false
          description: VAT per rate and category, summed from the lines for the response.
          items:
            type: object
            properties:
              taxCategory:
                $ref: '#/components/schemas/FinTaxCategory'
              taxRate:
                type: number
              taxableAmount:
                $ref: ../shared/common.yaml#/components/schemas/Money
              taxAmount:
                $ref: ../shared/common.yaml#/components/schemas/Money
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Written at the scope of the venue the orders were sold
            at, or the region for a consolidated invoice across venues.'
    FinIssueCreditMemoRequest:
      x-ticvai-persistence: none — request only
      type: object
      required:
      - kind
      - reason
      properties:
        kind:
          type: string
          enum:
          - full
          - partial
        reason:
          type: string
          enum:
          - refund
          - cancellation
          - priceAdjustment
          - returnOfGoods
          - billingError
          - other
        refundId:
          type: string
          format: uuid
          nullable: true
        cancelledOrderId:
          type: string
          format: uuid
          nullable: true
        lines:
          type: array
          description: Required for `partial`. Each names an invoice line and the quantity or amount credited.
          items:
            type: object
            required:
            - lineNumber
            properties:
              lineNumber:
                type: integer
                minimum: 1
              quantity:
                type: number
                nullable: true
              netAmount:
                $ref: ../shared/common.yaml#/components/schemas/Money
        note:
          type: string
          maxLength: 500
          nullable: true
    FinCreditMemoLine:
      type: object
      required:
      - invoiceLineNumber
      - netAmount
      - taxAmount
      - grossAmount
      properties:
        invoiceLineNumber:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 500
        quantity:
          type: number
          nullable: true
        netAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxRate:
          type: number
        taxCategory:
          $ref: '#/components/schemas/FinTaxCategory'
        taxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        grossAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
    FinCreditMemo:
      x-ticvai-persistence: ledger.credit_memo + ledger.credit_memo_line
      type: object
      description: '5.7.94. **A tax credit note against one tax invoice**, with its own series. Never edited.'
      required:
      - id
      - creditMemoNumber
      - taxInvoiceId
      - kind
      - reason
      - legalEntityId
      - issuedAt
      - currency
      - netAmount
      - taxAmount
      - grossAmount
      - lines
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        creditMemoNumber:
          type: string
          readOnly: true
          description: Server-assigned from the legal entity's credit memo series, in sequence without gaps.
        taxInvoiceId:
          type: string
          format: uuid
        taxInvoiceNumber:
          type: string
          readOnly: true
        kind:
          type: string
          enum:
          - full
          - partial
        reason:
          type: string
          enum:
          - refund
          - cancellation
          - priceAdjustment
          - returnOfGoods
          - billingError
          - other
        refundId:
          type: string
          format: uuid
          nullable: true
        cancelledOrderId:
          type: string
          format: uuid
          nullable: true
        legalEntityId:
          type: string
          format: uuid
        buyerSubjectId:
          type: string
          format: uuid
          nullable: true
        issuedAt:
          type: string
          format: date-time
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        netAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        grossAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        taxAmountInLegalCurrency:
          $ref: ../shared/common.yaml#/components/schemas/Money
        legalFxRate:
          allOf:
          - $ref: '#/components/schemas/FxRateValue'
          nullable: true
          readOnly: true
          description: The invoice's own `legalFxRate`, never today's (CHG-FIN-011).
        invoiceSupplyValue:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          readOnly: true
          description: '**The value of the supply shown on the tax invoice** (Executive Regulation Art. 60(1)(e)),
            adjusted by any earlier credit note on the same invoice. With `correctedSupplyValue` and
            `netAmount` (the difference) and `taxAmountInLegalCurrency` (the tax on the difference in AED),
            the four figures the law requires (CHG-FIN-011).'
        correctedSupplyValue:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          readOnly: true
          description: The correct value of the supply after this credit note (Art. 60(1)(e)).
        supplierName:
          type: string
          readOnly: true
          description: Snapshot of the legal entity at issue, as on the invoice (Art. 60(1)(b)).
        supplierAddress:
          type: string
          nullable: true
          readOnly: true
        supplierTaxRegistrationNumber:
          type: string
          nullable: true
          readOnly: true
        buyerName:
          type: string
          nullable: true
          readOnly: true
          description: The recipient as on the invoice; name, address and TRN where they are registered
            (Art. 60(1)(c)).
        buyerAddress:
          type: string
          nullable: true
          readOnly: true
        buyerTaxRegistrationNumber:
          type: string
          nullable: true
          readOnly: true
        note:
          type: string
          nullable: true
          description: The brief explanation of why the credit note was issued, printed on it (Art. 60(1)(f));
            the reason's own wording when no note is given (CHG-FIN-011).
        renditionAssetId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        eInvoiceStatus:
          $ref: '#/components/schemas/FinEInvoiceTransmissionStatus'
        issuedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FinCreditMemoLine'
        scopePath:
          type: string
          readOnly: true
    FinTaxDocumentRendition:
      x-ticvai-persistence: none — a signed link to the stored PDF
      type: object
      required:
      - documentId
      - documentKind
      - url
      - expiresAt
      properties:
        documentId:
          type: string
          format: uuid
        documentKind:
          type: string
          enum:
          - taxInvoice
          - creditMemo
        documentNumber:
          type: string
        language:
          type: string
          nullable: true
        contentType:
          type: string
          default: application/pdf
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    FinTaxInvoiceTemplate:
      x-ticvai-persistence: ledger.tax_invoice_template
      type: object
      description: '5.7.93, 5.7.94. Also the `setTaxInvoiceTemplate` body. One per legal entity and document kind.'
      required:
      - legalEntityId
      - documentKind
      - numberPrefix
      - languages
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legalEntityId:
          type: string
          format: uuid
        documentKind:
          type: string
          enum:
          - taxInvoice
          - simplifiedTaxInvoice
          - creditMemo
        numberPrefix:
          type: string
          maxLength: 20
          description: e.g. `INV-`, `SINV-`, `CN-`. The year is added by the series when `resetsYearly`.
        resetsYearly:
          type: boolean
          default: true
          description: A new series per fiscal year of the legal entity.
        nextNumber:
          type: integer
          minimum: 1
          description: May be raised, never lowered below the last number issued.
        numberPadding:
          type: integer
          minimum: 1
          maximum: 12
          default: 6
        languages:
          type: array
          minItems: 1
          description: Rendered on one page in this order, e.g. `en`, `ar`.
          items:
            type: string
            pattern: ^[a-z]{2}(-[A-Z]{2})?$
        title:
          type: object
          description: 'The document title per language. **Prescribed wording is law** (CF-133, answered by
            research 2 October 2026, CHG-FIN-011): in the UAE "Tax Invoice" for both `taxInvoice` and
            `simplifiedTaxInvoice` (Executive Regulation Art. 59(1)(a), 59(2)(a)) and "Tax Credit Note" for
            `creditMemo` (Art. 60(1)(a)). Never "Receipt" or "VAT receipt" as the title; the Arabic title
            is the client''s tax adviser''s to confirm.'
          additionalProperties:
            type: string
        footerText:
          type: object
          additionalProperties:
            type: string
        logoAssetId:
          type: string
          format: uuid
          nullable: true
        layoutKey:
          type: string
          maxLength: 64
          nullable: true
        autoIssueOnPayment:
          type: boolean
          default: false
          description: 'For `simplifiedTaxInvoice`, issue one on every paid order (the VAT receipt).
            **Always on for a UAE VAT-registered legal entity** (research 2 October 2026, CHG-FIN-011): a
            registrant making a taxable supply issues and delivers a tax invoice (Decree-Law Art. 65(1)),
            and a simplified one on the date of supply (Executive Regulation Art. 59(13)(1)); a template
            for such an entity saved with this false is refused 422 `tax-invoice-required`. The till prints
            it as the receipt (POS-026); the guest web and app show it on the order.'
        simplifiedAllowedUpTo:
          allOf:
          - $ref: ../shared/common.yaml#/components/schemas/Money
          description: '**For a VAT-registered recipient only**: the consideration up to which a simplified
            invoice is still allowed (UAE AED 10,000, Executive Regulation Art. 59(5)(b)). A recipient who is
            not registered may always get a simplified one (Art. 59(5)(a)). Above it, or where the
            reverse charge applies, the till and the back office offer the full invoice only
            (CHG-FIN-011).'
        showLegalCurrencyTax:
          type: boolean
          default: true
          description: Show the tax in the legal entity's currency when the invoice currency differs.
        effectiveFrom:
          type: string
          format: date
        isActive:
          type: boolean
          default: true
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Operations write it at `tenant` scope.'
    FinEInvoiceTransmissionStatus:
      type: string
      description: 6.1.1. `notRequired` where the legal entity's provider is `disabled` or absent.
      enum:
      - notRequired
      - queued
      - sent
      - accepted
      - rejected
