  /fx-rates/ingest:
    post:
      operationId: ingestFxRates
      x-ticvai-consumed-by:
        - "P08 BO-077 FX Rates & Variances"
      summary: Pull rates from the configured provider
      description: '**Scheduled ingestion, which had no home.** `setFxRate` is a `PUT` carrying `setByPrincipalId`
        — a person setting a rate — so a daily provider pull had to be modelled as a person doing it,
        and the ledger could not tell an automated rate from a typed one.


        **Ingests per purpose, not per currency pair.** `FxRatePurpose` has four values and they are four
        different rates on the same day: `tender` is what a guest pays at, `reporting` is a period-end
        consolidation rate, `revaluation` restates open obligations, `interEntity` is a transfer price
        that is often deliberately not the market rate. **A feed that overwrites one number breaks the
        other three.**


        **Never overwrites.** A new rate is a new row with its own `effectiveFrom` — that is what lets
        a month-end be re-run and give the same answer, and why `runFxRevaluation` can be dry-run.


        **Refused if the provider is unreachable rather than falling back to the last rate.** A stale
        rate silently reused is worse than a missing one: the first is wrong and looks right.'
      tags:
      - finance
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-audience:
      - staff
      - service
      x-ticvai-scope-level: region
      x-ticvai-singleton: true
      x-ticvai-singleton-note: 'ADR-0031. **With three replicas, three instances wake up.** A Postgres
        advisory lock rather than Redis: the work is transactional against the same database, so the
        lock belongs there. **A Redis lock that expires mid-transaction leaves two writers and no error.**

        '
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - purpose
              properties:
                purpose:
                  $ref: '#/components/schemas/FxRatePurpose'
                pairs:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Z]{3}/[A-Z]{3}$
                  description: '`AED/USD` form. Omitted means every pair this region trades in.'
                effectiveFrom:
                  type: string
                  format: date
                  nullable: true
                  description: 'Defaults to the next business day in the region timezone. A day in the region''s
                    time zone: the rates written take effect at local midnight at the start of it, stored as
                    that instant in UTC on `FxRate.effectiveFrom`.

                    '
                dryRun:
                  type: boolean
                  default: false
                  description: '**Fetch and report without writing.** A rate that moved four percent overnight
                    is worth a person seeing before it prices anything.'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: What was fetched
          content:
            application/json:
              schema:
