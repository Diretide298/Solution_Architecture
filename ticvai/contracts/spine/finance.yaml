                    $ref: '#/components/schemas/FxRateSource'
                  purpose:
                    $ref: '#/components/schemas/FxRatePurpose'
                  ratesWritten:
                    type: integer
                  unchanged:
                    type: integer
                  largestMove:
                    type: string
                    pattern: ^-?\d+(\.\d{1,6})?$
                    nullable: true
                    description: '**The number a person reads.** A pair that moved sharply is the one
                      worth questioning before the day trades on it. The largest change against the
                      rate in force, in percent, as a decimal string like `FxRate.rate` (a rate is never
                      a float on the wire). Null when nothing was in force to compare with.'
                  rates:
                    type: array
                    items:
                      $ref: '#/components/schemas/FxRate'
        '409':
          description: No provider is assigned to this purpose in this region (`setFxProvider`).
          x-ticvai-problem-types:
          - fx-provider-not-assigned
          content:
            application/problem+json:
              schema:
