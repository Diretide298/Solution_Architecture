openapi: 3.1.0
info:
  title: TICVAI Finance & Ledger
  version: 0.1.0
  x-ticvai-screen-count: 62
  x-ticvai-tier: spine
  x-ticvai-module: 5 — F&B & Guest Management (accounting and revenue recognition)
  x-ticvai-requirements: 327
  x-ticvai-capabilities:
  - C41
  - C42
  - C43
  - C44
  - C45
  - C46
  - C47
  - C48
  - C49
  - C50
  x-ticvai-platforms:
  - P08 Venue Management
  description: "## What this contract covers\n**The append-only record of every posting. Corrections are\
    \ entries, never edits.**\n| | | |---|---|| **Tier** | spine | | **Matrix domain** | 5 — F&B & Guest\
    \ Management (accounting and revenue recognition) | | **Requirements** | ~327 | | **Capabilities**\
    \ | C41, C42, C43, C44, C45, C46, C47, C48, C49, C50 | | **Consumed by** | P08 Venue Management |\n\
    ## How to read this file\n**This file is a contract.** It is hand-authored and it is the source of\
    \ truth for one bounded context: server code, client code and mock servers are generated from it,\
    \ never the other way round. If a field is not here, it does not exist.\n**Contracts are split into\
    \ two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy, identity,\n\
    \  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n  requires\
    \ a formal change request, because every satellite has pinned against it.\n- **Satellite** — a domain\
    \ that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths` are operations.**\
    \ Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n| Extension |\
    \ Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From one enum in\
    \ `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the seven-level\
    \ hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected terminal\
    \ may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`,\
    \ `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`\
    \ (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table\
    \ name, a list of tables, or `none` with a reason. It is documentation of the mapping, not a generator\
    \ input — the DDL lives in versioned SQL migrations, because partitioning, RLS policies, `ltree` indexes\
    \ and partial indexes have no expression in OpenAPI.\n**`security` arrays hold OAuth scopes.** Empty\
    \ means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty is not the\
    \ same as absent: absent means unauthenticated.\n\n## This context\nChart of accounts, tax, revenue\
    \ recognition, journals, settlement and financial reporting. Settled by the 12 August finance deep-dive.\n\
    Positions this encodes:\n- **Journal entries and postings are append-only.** A posted entry is never\
    \ edited or deleted; corrections are new\n  entries (reversals), and the absence of DELETE is deliberate.\n\
    - **Configuration and status rows are not append-only, and say so.** Accounts, account mappings,\
    \ tax\n  codes, deposits, obligations, settlement exceptions and fiscal periods change in place:\
    \ a rename,\n  a replaced mapping set, a status moving along its state model. A tax or FX rate change\
    \ is the\n  exception: it closes the row in force and adds a new one, so history keeps the rate it\
    \ posted at.\n  Where a change carries a reason (reject, reverse, abandon, reopen), the reason is\
    \ stored with it.\n- **Dates are the region's calendar.** A `format: date` field or parameter (a period\
    \ boundary,\n  a report range, an effective date) is a day in the region's time zone\n  (`platform.region_settings.time_zone`;\
    \ a venue inherits its region's zone and cannot override it),\n  running from local midnight to\
    \ local midnight. Instants stay `date-time` in UTC (naming-and-style 5.2).\n-\
    \ **Dual ledger.** Transaction-level entries for reconciliation, journal entries for\n  trial balance,\
    \ P&L and balance sheet.\n- **Tax is computed per line item, not on the basket total**, with compound\
    \ tax support\n  and per-country structures.\n- **Multi-venue passes recognise on redemption**, not\
    \ at sale. Gift cards recognise on\n  redemption, annual passes straight-line or per visit, unredeemed\
    \ value as breakage on\n  expiry.\n- **Price variance is a first-class posting** (CF-38). The server\
    \ re-prices on ingest;\n  where it disagrees with the quoted price the quote is honoured and the difference\n\
    \  posted. Above the venue's threshold it becomes an exception requiring review.\n\nDEFERRED pending\
    \ CF-37 (FX policy): cross-currency allocation splits, inter-company settlement, FX revaluation at\
    \ period close, and consolidated multi-currency reporting. Those endpoints are listed in the repository\
    \ README and are not in this version.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: accounts
- name: tax
- name: recognition
- name: journal
- name: ledger
- name: settlement
- name: variance
- name: reporting
- name: fiscal
paths:
  /internal/order-postings:
    post:
      operationId: postOrderRevenue
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-auth: service
      x-ticvai-agreed: '29 September: system-design review SD-026 (ledger posts once, from the event)'
      summary: Post a paid order's revenue and tax
      description: '**The ledger''s `order.paid` consumer, modelled as an operation so it has lineage and a
        ticket** (system-design review SD-026, 29 September). Posts revenue and output tax for the order''s lines
        against the guest-order clearing account the payment''s cash-receipt entry credited
        (`orders.createPayment`), so the clearing account nets to zero and **revenue is posted exactly once**.
        Deferred revenue follows the recognition schedule of the product.


        **Idempotent on the order id**: the journal entry carries the order id as its source reference, and a
        redelivered `order.paid` finds it and returns it unchanged. An offline sale replayed by `orders.syncOrders`
        arrives by the same event and is dated by its `recordedAt`. Invoked by the event relay, never by a screen.

        '
      tags:
      - ledger
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-consumes:
      - order.paid
      x-ticvai-emits:
      - ledger.journalPosted
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - eventId
              - orderId
              properties:
                eventId:
                  type: string
                  description: The `order.paid` event id, for the consumer's inbox record.
                orderId:
                  type: string
                  format: uuid
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The revenue entry, posted now or already posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /write-offs:
    post:
      operationId: recordWriteOff
      summary: Write off an uncollectable balance
      description: '**Credit write-off was not a posting event type**, so a partner balance nobody will
        collect had nowhere to go and sat in receivables making the ledger look healthier than it is.

        **A write-off is not a refund and not a discount.** A refund returns money that was taken; a write-off
        recognises money that will never arrive. Booking one as the other misstates revenue in opposite
        directions.

        Requires approval above a configured value — **the amount is the whole risk**, and a write-off
        is the one posting that makes a problem disappear from a report.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_POST
      x-ticvai-permission-escalated: LEDGER_APPROVE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - reason
              - subjectRef
              properties:
                amount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                reason:
                  type: string
                  enum:
                  - uncollectable
                  - disputed
                  - goodwill
                  - partnerInsolvency
                  - timeBarred
                  - immaterial
                subjectRef:
                  type: string
                narrative:
                  type: string
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Written off. **The journal entry the write-off posted**, with `source` `writeOff`
            and its lines — a write-off is a posting, so it is read back as one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /recognition-schedules/validate:
    post:
      operationId: validateRecognitionSchedules
      x-ticvai-consumed-by:
        - "P08 BO-076 Revenue Recognition"
      summary: Find product kinds claimed by more than one schedule
      description: '**The defect this exists to catch is silent.** Two schedules claiming one product
        kind means revenue recognised twice, and the numbers look plausible — nothing fails, the period
        closes, and the error is found by an auditor months later.

        Run before a period close, and `closeFiscalPeriod` runs it too.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Overlaps
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  overlaps:
                    type: array
                    items:
                      type: object
                      properties:
                        productKind:
                          $ref: ../spine/catalogue.yaml#/components/schemas/ProductKind
                        scheduleIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                        samePriority:
                          type: boolean
                          description: '**True is the unresolvable case.** Different priorities resolve
                            deterministically; equal ones are a coin toss the ledger should never make.

                            '
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /deposits:
    post:
      operationId: recordDeposit
      x-ticvai-consumed-by:
        - "P08 BO-1029 Quote, Deposit & Payment"
      summary: Money taken before the sale is complete
      description: '**A deposit is not deferred revenue and the distinction is a balance-sheet one.**
        `deferredRevenue` covers a sold entitlement not yet consumed — the sale happened. A deposit is
        money held **against** a sale that has not happened, and it is a liability of a different kind:
        refundable in full until the thing is delivered.

        A reservation taking payment lands here (BL-139). So does a rental deposit, though `resources.checkOutResource`
        holds rather than takes where it can — **a held deposit never becomes a liability at all**, which
        is why holding is preferred.

        **Converts to revenue on completion, or returns.** Neither is a refund, and booking either as
        one misstates both.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_POST
      x-ticvai-audience:
      - staff
      - service
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - reason
              properties:
                amount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                reason:
                  type: string
                  enum:
                  - reservation
                  - rental
                  - event
                  - damageBond
                  - other
                subjectId:
                  type: string
                  format: uuid
                  nullable: true
                orderId:
                  type: string
                  format: uuid
                  nullable: true
                bookingId:
                  type: string
                  format: uuid
                  nullable: true
                refundableUntil:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Recorded as a liability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /deposits/{depositId}/settle:
    parameters:
    - name: depositId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: settleDeposit
      x-ticvai-consumed-by:
        - "P08 BO-024 Payment Exceptions"
      summary: Convert to revenue, return it, or forfeit it
      description: 'Four outcomes and **none of them is a refund**. Converting recognises revenue against
        the completed sale; returning discharges the liability; forfeiting recognises it as income under
        the cancellation terms; a partial forfeit keeps part as income and returns the rest.

        **Booking any of them as a refund misstates both the liability and the revenue**, which is
        why this is its own operation rather than a flag on `createRefund`.

        **Only a `held` deposit settles**, once. `forfeit` and `partialForfeit` are permitted only after
        `refundableUntil` (the deposit''s cancellation term); a deposit with no date is refundable
        indefinitely and cannot be forfeited. `amount` is required for `partialForfeit` and is the part
        kept as income, above zero and below the deposit, in the deposit''s currency; the other outcomes
        settle the whole deposit and ignore it.

        **A partial forfeit returns the remainder to the guest** (decided 28 September, audit R127 (2)):
        the deposit less `amount` is paid back as `return` would pay it, and only `amount` is income.

        **A table deposit settles here too** (decided 29 September, rev 3 REV3-8b: the dining deposit
        ships as a venue option, off by default). A deposit taken for a `fnb.TableReservation`
        (`orders.deposit.tableReservationId`) is settled by the service, under the venue''s
        `orders.DepositPolicy.dining`, when the booking ends: **`return`** on a cancel at least
        `refundableUntilHours` before the booking, or on arrival where `onArrival` is `releaseHold`;
        **`convertToRevenue`** when it is applied to the bill (`onArrival` `applyToBill`); **`forfeit`**
        on a later cancel or a `noShow` where `onLateCancelOrNoShow` is `forfeit` (`return` where it is
        `release`). An authorisation hold that is returned is released, never captured.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_POST
      x-ticvai-audience:
      - staff
      - service
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outcome
              properties:
                outcome:
                  type: string
                  enum:
                  - convertToRevenue
                  - return
                  - forfeit
                  - partialForfeit
                amount:
                  allOf:
                  - $ref: ../shared/common.yaml#/components/schemas/Money
                  description: The part kept as income. Required for `partialForfeit`, ignored otherwise.
                reason:
                  type: string
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
        '400':
          description: '`partialForfeit` without an `amount`, or with one that is not above zero and below
            the deposit, or in another currency. `errors[]` names the field.

            '
          x-ticvai-problem-types:
          - validation
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: 'The deposit is not `held` (it has already been settled), or a forfeit was asked
            for while the deposit is still refundable.

            '
          x-ticvai-problem-types:
          - deposit-not-held
          - deposit-still-refundable
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /reconciliation/unified:
    get:
      operationId: getUnifiedReconciliation
      x-ticvai-consumed-by:
        - "P08 BO-1081 Finance Dashboard"
        - "P08 BO-1172 Finance Validation, Reporting & Audit Center"
        - "P09 ADM-627 Reconciliation Audit, Trace & Evidence Center\t149"
        - "P09 ADM-628 Reconciliation Simulator, Forecast & AI Operations Advisor\t150"
      summary: Every money source against the ledger, in one view
      description: '4.2.19. **Reconciliation was per provider and the question is not per provider.**
        `ingestSettlementFile` and its siblings are good and gateway-scoped; **a venue closing a day needs
        POS cash, gateway settlements, bank movements and the ledger side by side**, because a discrepancy
        is usually the gap between two of them rather than inside one.

        Returns each source with its own total and the variance against the ledger. **The variance is
        the answer** — a reconciliation that shows four balanced sources and no comparison has not reconciled
        anything.

        **Reconciliation is daily, per venue** (decided 2 October 2026, Chinmay; CHG-FIN-009; confirms
        audit R110 (b)). The unit a finance user works and signs off is one venue-day: `from` equal to
        `to`. A longer range is a review of days already reconciled, never a reconciliation of its own;
        a provider that sends a monthly file (DI-268) is matched day by day against it.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: analytical
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          description: A day in the region's time zone, local midnight to local midnight.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          description: A day in the region's time zone, local midnight to local midnight.
      responses:
        '200':
          description: Sources with variances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedReconciliation'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /inter-entity-obligations/{obligationId}/settle:
    parameters:
    - name: obligationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: recordSettlement
      x-ticvai-consumed-by:
        - "P09 ADM-626 Settlement Posting, Finance Handoff & Close Manager\t148"
      x-ticvai-audience:
      - staff
      summary: One entity paid another
      description: '**The operation that closes an obligation, and it did not exist.** `listInterEntityObligations`
        could show what was owed between entities and nothing could mark it paid.

        Settled in base currency at the rate carried on the obligation, **not today''s rate** (CF-37).
        An obligation raised in March and settled in August settles at March''s rate, because the amount
        owed was fixed when the guest redeemed.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - settledAmount
              - settledAt
              properties:
                settledAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                settledAt:
                  type: string
                  format: date-time
                reference:
                  type: string
                note:
                  type: string
                  maxLength: 300
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Settled, and the journal posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterEntityObligation'
        '409':
          description: The obligation is already `settled`. An `outstanding` or `disputed` one settles.
          x-ticvai-problem-types:
          - obligation-settled
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /inter-entity-obligations/{obligationId}/dispute:
    parameters:
    - name: obligationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: disputeObligation
      x-ticvai-audience:
      - staff
      summary: One entity disagrees with the amount
      description: '**Disputing does not cancel the debt.** The obligation stays outstanding and stays
        on both balance sheets; what changes is that it is flagged and excluded from an automatic settlement
        run.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - amountDisputed
                  - notRedeemed
                  - rateDisputed
                  - duplicated
                  - other
                claimedAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterEntityObligation'
        '409':
          description: Only an `outstanding` obligation is disputed. It is already `disputed`, or it is
            `settled`.
          x-ticvai-problem-types:
          - obligation-already-disputed
          - obligation-settled
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /inter-entity-obligations/{obligationId}/resolve:
    parameters:
    - name: obligationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resolveObligationDispute
      x-ticvai-audience:
      - staff
      summary: Agree what is actually owed
      description: 'Returns the obligation to `outstanding`, possibly at a different figure. **The original
        amount is retained** — an obligation that quietly becomes a smaller number is one nobody can audit.

        '
      tags:
      - finance
      x-ticvai-permission: LEDGER_POST
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - agreedAmount
              properties:
                agreedAmount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Resolved
          content:
            application/json:
              schema:
