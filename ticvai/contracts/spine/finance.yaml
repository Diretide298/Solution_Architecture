      - name: asAt
        in: query
        description: Rates in force at this instant. Defaults to now.
        schema:
          type: string
          format: date-time
      - name: purpose
        in: query
        schema:
          $ref: '#/components/schemas/FxRatePurpose'
      - name: venueId
        in: query
        description: Narrows the region's rates to the currencies this venue shows. The venue picks the
          currencies and the region sets the rates (audit R120 (a)).
        schema:
          type: string
          format: uuid
      - name: chargeable
        in: query
        description: With `venueId`, only the currencies a guest may select and pay in at that venue
          (`tenancy.VenueSettings.chargeCurrencies`; CHG-FIN-001).
        schema:
          type: boolean
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Rates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/FxRate'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setFxRate
      x-ticvai-consumed-by:
        - "P08 BO-077 FX Rates & Variances"
      x-ticvai-audience:
      - staff
      x-ticvai-config-scope: region
      summary: Set a rate
      description: 'Rates are **configured, not fetched live**. A published market rate moving mid-shift
        would mean two guests paying different dirham amounts for the same product minutes apart, and
        a cashier unable to explain either.

        A rate change is a new row with its own effective window; the old one''s rate is never edited. A
        transaction posted last Tuesday must still reconcile at last Tuesday''s rate.

        **Tender rates carry a spread.** The rate a venue accepts dollars at is not the interbank rate,
        and pretending otherwise makes every foreign-tender sale look like a small loss.

        **A new rate supersedes the one in force.** Where the rate in force for the same pair and purpose
        is open-ended (no `effectiveTo`) and started before the new `effectiveFrom`, that row is closed at
        the new `effectiveFrom`, which is the only change ever made to an existing row; its rate is not
        touched. A new window that overlaps a bounded window, or starts at or before the start of the rate
        in force, is refused. Without this an open-ended rate would block every later rate.

        The server sets `source` to `manual` and `setByPrincipalId` to the caller; `fetchedAt` and
        `providerReference` belong to `ingestFxRates` and are ignored here.

        **A rate set by hand is `manual` and carries a note** (decided 28 September, audit R127 (4)).
        No other source may be recorded through this call, and a rate without `note` is refused with 400.

        '
      tags:
      - ledger
      x-ticvai-permission: LEDGER_APPROVE
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxRate'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRate'
        '400':
          description: No `note` was given. A manual rate says where the figure came from (audit R127 (4)).
          x-ticvai-problem-types:
          - validation
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: Effective window overlaps an existing bounded rate for the same pair and purpose, or
            does not start after the rate in force
          x-ticvai-problem-types:
          - fx-rate-window-overlap
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
