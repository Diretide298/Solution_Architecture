          type: array
          minItems: 1
          description: The product kinds this schedule claims, from the catalogue's `ProductKind`.
          items:
            # `type: string` beside the `allOf` keeps this a `text[]` column: an array whose items
            # are a bare `$ref` derives as a child table.
            type: string
            allOf:
            - $ref: ../spine/catalogue.yaml#/components/schemas/ProductKind
        deferredAccountId:
          type: string
          format: uuid
        recognisedAccountId:
          type: string
          format: uuid
        breakageAccountId:
          type: string
          format: uuid
          nullable: true
        noShowTrigger:
          type: string
          nullable: true
          enum:
          - performanceEnd
          - validityEnd
          - none
          description: '8.1.1. **A no-show is breakage with a known moment**, and the mechanism already
            existed — `breakageAfterDays` moves deferred revenue to earned after a period. A ticket for
            a performance that has finished does not need a waiting period: **the guest cannot arrive
            any more.**

            `performanceEnd` recognises when the performance completes. `validityEnd` recognises when
            an open-dated entitlement lapses, which is where `breakageAfterDays` still applies.

            **`none` keeps the current behaviour** — recognise on the schedule and nothing else — so no
            existing schedule changes.

            '
        noShowAccountId:
          type: string
          format: uuid
          nullable: true
          description: 'Where no-show revenue lands. **Separate from `recognisedAccountId` by default**,
            because revenue from a guest who came and revenue from one who did not are different lines
            to whoever reads the P&L — and 8.1.2 asks for a report on exactly that distinction.

            '
        breakageAfterDays:
          type: integer
          nullable: true
          description: Days after expiry at which unredeemed value becomes breakage.
        isActive:
          type: boolean
