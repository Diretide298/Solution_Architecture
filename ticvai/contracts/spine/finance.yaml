      description: 'Also the `createLegalEntity` body. **`id` and `scopePath` are server-owned** (`readOnly`)
        and ignored if sent.

        '
      required:
      - id
      - code
      - name
      - countryCode
      - currency
      - currencyScale
      - fiscalYearStartMonth
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
        taxRegistrationNumber:
          type: string
          nullable: true
        fiscalYearStartMonth:
          type: integer
          minimum: 1
          maximum: 12
        regionIds:
          type: array
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope.**'
    PeriodStatus:
      type: string
      enum:
      - open
      - closing
      - closed
    FiscalPeriod:
      x-ticvai-persistence: ledger.fiscal_period + ledger.fiscal_period_event
      type: object
      description: '`startDate` and `endDate` are days in the region''s time zone: a posting belongs to the
        period when its `postedAt`, in that zone, falls on or between them.

        '
      required:
      - id
      - legalEntityId
      - name
      - startDate
      - endDate
      - status
      properties:
        id:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
          description: A day in the region's time zone, local midnight to local midnight.
        endDate:
          type: string
          format: date
          description: A day in the region's time zone, local midnight to local midnight.
        status:
          $ref: '#/components/schemas/PeriodStatus'
        closedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        approvalRequestId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: The approval request a close or reopen is waiting on (`approvals`), routed to a finance
            approver (decided 28 September, audit R144). Null when nothing is waiting.
        events:
          type: array
          description: '**Every step of the period''s close, oldest first**: begin, abandon, close and reopen,
            each with who, when and (for abandon and reopen) why. A reopened period restates figures
            somebody has already reported, so the reason is kept, not just the latest status.

            '
          items:
            $ref: '#/components/schemas/FiscalPeriodEvent'
    FiscalPeriodEvent:
      type: object
      description: One step in a fiscal period's close. Written by the operation that took the step; never
        edited.
      required:
      - action
      - principalId
      - occurredAt
      properties:
        action:
          type: string
          enum:
          - beginClose     # beginPeriodClose
          - abandonClose   # abandonPeriodClose
          - close          # closeFiscalPeriod
          - reopen         # reopenPeriod
        reason:
          type: string
          nullable: true
          description: Required by `abandonPeriodClose` and `reopenPeriod`; null for the other steps.
        principalId:
          type: string
          format: uuid
          description: Who took the step.
        approverPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: The approver of a `reopen`. Null for the other steps.
        occurredAt:
          type: string
          format: date-time
    PeriodCloseProblem:
      x-ticvai-persistence: none — error shape
      description: '`closeFiscalPeriod` 409. For `period-close-checks-failed`, **names each check that
        failed**, in the shape `PeriodCloseResult.checks` uses; empty for `fiscal-period-closed`.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        properties:
          failedChecks:
            type: array
            items:
              type: object
              required:
              - check
              - passed
              properties:
                check:
                  type: string
                  enum:
                  - trialBalanceBalances
                  - noUnapprovedJournals
                  - noOpenShifts
                  - settlementsReconciled
                  - recognitionRunComplete
                  - priorPeriodClosed
                  - varianceExceptionsReviewed
                passed:
                  type: boolean
                  description: Always false here.
                detail:
                  type: string
                blockingCount:
                  type: integer
    PeriodCloseResult:
      x-ticvai-persistence: none — computed
      type: object
      required:
      - fiscalPeriodId
      - dryRun
      - passed
      - checks
      properties:
        fiscalPeriodId:
          type: string
          format: uuid
        dryRun:
          type: boolean
        passed:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required:
            - check
            - passed
            properties:
              check:
                type: string
                enum:
                - trialBalanceBalances
                - noUnapprovedJournals
                - noOpenShifts
                - settlementsReconciled
                - recognitionRunComplete
                - priorPeriodClosed
                - varianceExceptionsReviewed
              passed:
                type: boolean
              detail:
                type: string
              blockingCount:
                type: integer
    FinancialReport:
      x-ticvai-persistence: none — computed from replica
      type: object
      required:
      - report
      - fiscalPeriodId
      - currency
      - generatedAt
      - sections
      properties:
        report:
          $ref: '#/components/schemas/FinancialReportKind'
        fiscalPeriodId:
          type: string
          format: uuid
        legalEntityId:
          type: string
          format: uuid
          nullable: true
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currencyScale:
          type: integer
        generatedAt:
          type: string
          format: date-time
        sections:
          type: array
          items:
            type: object
            required:
            - name
            - lines
            - total
            properties:
              name:
                type: string
              lines:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    accountCode:
                      type: string
                      nullable: true
                    amount:
                      $ref: ../shared/common.yaml#/components/schemas/Money
                    priorPeriodAmount:
                      allOf:
                      - $ref: ../shared/common.yaml#/components/schemas/Money
                      description: The same line for **the same period last year** (decided 28 September,
                        audit R127 (3)). Absent where that period did not exist.
              total:
                $ref: ../shared/common.yaml#/components/schemas/Money
    FinancialReportKind:
      type: string
      description: The report `getFinancialReport` returns. One vocabulary for the query and the response.
      enum:
      - profitAndLoss
      - balanceSheet
      - cashFlow
      - revenueByVenue
      - revenueByProduct
      - taxSummary
    FxProviderAssignment:
      x-ticvai-persistence: ledger.fx_provider_assignment
      type: object
      description: '**Which provider serves one FX purpose in one region**, as `setFxProvider` sets it and
        `ingestFxRates` reads it. One row per region and purpose. Region-scoped (ADR-0018): currency is a
        region property, so the feed that prices it is too.

        '
      required:
      - purpose
      - source
      properties:
        purpose:
          $ref: '#/components/schemas/FxRatePurpose'
        source:
          $ref: '#/components/schemas/FxRateSource'
        credentialRef:
          type: string
          nullable: true
          description: BYOK — the key lives in the secret store, never here. This is the store's reference
            to it, not the key.
        schedule:
          type: string
          nullable: true
          description: Cron in the region timezone. **A daily pull at 06:00 Gulf time is
            not the same instant as 06:00 UTC**, and a rate stamped with the wrong business
            day is a reconciliation nobody can close.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). **Operations write it at `region` scope.**

            '
    FxRateSource:
      type: string
      description: '**Where the rate came from, and which provider specifically.** `source: provider`
        said a feed set it and not which one — two tenants on different feeds were indistinguishable in
        the ledger, and a rate cannot be defended in an audit without naming its origin.


        **`uaeCentralBank` is the default for AED pairs.** The UAE Central Bank publishes an official
        daily rate and it is what a UAE auditor expects to see — a commercial feed is defensible for tender
        and awkward for statutory reporting.


        **`openExchangeRates` and `ecb` are the commercial and reference options.** ECB publishes daily
        reference rates free and is the usual fallback for non-AED pairs; Open Exchange Rates is the common
        commercial feed with intraday granularity. **The choice is per purpose, not per platform** — a
        tender rate wants intraday, a reporting rate wants the official daily close.'
      enum:
      - manual
      - uaeCentralBank
      - ecb
      - openExchangeRates
      - cardScheme
      - provider
  securitySchemes:
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
