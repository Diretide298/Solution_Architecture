      type: string
      description: 'A venue does not accept dollars at the rate it books an intercompany balance at. Separating
        them is what stops a spread on the counter appearing as a loss in the accounts.

        '
      enum:
      - tender
      - interEntity
      - reporting
      - revaluation
    FxRateValue:
      x-ticvai-persistence-column: numeric(18,6)
      type: string
      pattern: ^\d+(\.\d{1,6})?$
      description: '**An exchange rate: a decimal string, never a float**, for the reason `Money.amount`
        is one (naming-and-style 5.1). Up to six decimal places — a two-place rate on a three-place
        currency loses money on every transaction, quietly — and stored as `numeric(18,6)` so the six
        places the wire carries survive the database.

        '
    FxRate:
      type: object
      x-ticvai-persistence: ledger.fx_rate
      description: 'Also the `setFxRate` body. **Server-owned fields are `readOnly`** and ignored if sent:
        `id`, `setByPrincipalId`, and the provenance `ingestFxRates` writes (`source`, `providerReference`,
        `fetchedAt`). A rate set through `setFxRate` has `source` `manual`.

        '
      required:
      - fromCurrency
      - toCurrency
      - rate
      - purpose
      - effectiveFrom
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fromCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        toCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        rate:
          allOf:
          - $ref: '#/components/schemas/FxRateValue'
          description: 'Units of `toCurrency` per one `fromCurrency`. Six decimal places — a two-place
            rate on a three-place currency loses money on every transaction, quietly.

            '
        purpose:
          $ref: '#/components/schemas/FxRatePurpose'
        source:
          allOf:
          - $ref: '#/components/schemas/FxRateSource'
          readOnly: true
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: 'A rate change is a new row. The old one is never edited — a transaction posted
            last Tuesday must still reconcile at last Tuesday''s rate.

            '
        setByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Why this rate, and from where. **Required when `source` is `manual`** (decided 28
            September, audit R127 (4)); null on a rate `ingestFxRates` fetched.
        providerReference:
          type: string
          nullable: true
          readOnly: true
          description: The provider's own identifier for this quote. **What makes a rate reproducible**
            — an auditor asking why a payment converted at 3.6725 gets an answer that is checkable against
            the source rather than a number somebody typed.
        fetchedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the rate was pulled. **Distinct from `effectiveFrom`**, which is when it applies
            — a rate fetched at 06:00 for a business day starting at 00:00 has two different times and
            conflating them makes a late feed look like a backdated rate.
        chargeable:
          type: boolean
          readOnly: true
          x-ticvai-persisted: false
          description: With `venueId`, true where a guest may select this currency and pay in it at that
            venue (`tenancy.VenueSettings.chargeCurrencies`), false where it is shown as an approximate
            price only (CHG-FIN-001).
