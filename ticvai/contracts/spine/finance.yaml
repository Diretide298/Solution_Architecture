  /fx-rates:
    get:
      operationId: listFxRates
      x-ticvai-consumed-by:
        - "P01 WEB-035 Multi-Currency & Pricing"
        - "P02 GST-044 Multi-Currency & Pricing"
        - "P08 BO-077 FX Rates & Variances"
      # Public, with an optional token (decided 2 October, GFIX-5): a visitor browses before signing in; a guest
      # or staff token is still accepted. `{}` makes the credential optional.
      security:
      - {}
      - guestAuth: []
      - bearerAuth: []
      x-ticvai-audience:
      - staff
      - guest
      summary: The rates in force
      description: '**Policy, settled 14 August: every transaction is stored in the base currency of the
        region it was transacted in.**

        A guest paying USD 100 in a UAE venue has the dirham equivalent stored at the configured rate.
        The foreign amount is retained for the cashier''s declaration and for the foreign-tender report
        — it is never what the ledger holds.

        The consequence is that most of the questions FX usually raises do not arise. There is no rate
        to lock at redemption, none at expiry, and none at refund, because the stored amount was never
        in a foreign currency. Allam: *"the value of the currency doesn''t matter whether it goes high
        or down. They are purchasing a product equivalent to that currency… at the end they are paying
        that base currency value, and they get a refund for the base currency value."*

        **Rates are set per region; each venue picks which currencies it shows** (decided 28 September,
        audit R120 (a)). A guest screen passes `venueId` and gets the region''s rates narrowed to the
        currencies that venue has chosen to display (`tenancy.VenueSettings.displayCurrencies`); the
        rate itself is never set per venue.

        **Superseded in part, 2 October 2026 (Chinmay; CHG-FIN-001): the guest may now pay in a
        currency they select.** The ledger still holds base currency only, but a guest-selected
        currency is charged at the gateway at the region''s `tender` rate, locked on the order
        (`orders.Order.chargeFxRate`), and a refund goes back in the currency paid at the sale rate,
        so the venue never refunds at today''s rate. The quotation above (Allam, 10 August) describes
        the display-only option this replaces for card and wallet; it still holds for foreign cash at
        a till (DI-282). `chargeable=true` with `venueId` narrows the list to the currencies the venue
        lets a guest pay in (`tenancy.VenueSettings.chargeCurrencies`); each rate says `chargeable`.

        '
      tags:
      - ledger
      x-ticvai-permission: LEDGER_VIEW
      x-ticvai-scope-level: region
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
