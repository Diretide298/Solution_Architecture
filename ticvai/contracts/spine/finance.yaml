    post:
      operationId: issueTaxInvoice
      x-ticvai-consumed-by:
        - "P01 WEB-019 Order History"
        - "P02 GST-019 Order History"
        - "P04 POS-026 Receipt & Reprint"
        - "P04 POS-030 Sales Journal"
        - "P08 BO-022 Order Detail"
      x-ticvai-audience:
      - staff
      - guest
      - service
      x-ticvai-agreed: '29 September: our build plan (retrace 5.7.93, 5.10.3; CF-133 open on the legal field set only); shape follows createJournalEntry'
      x-ticvai-make-or-break: 'Which fields must a UAE tax invoice and a simplified tax invoice show, in which
        language, and may a simplified tax invoice already issued be replaced by a full one for the same supply
        or must it be credited first? The shape carries the Executive Regulation Article 59 set (supplier and
        recipient TRN, sequential number, dates, per-line rate and tax, totals and tax in AED); the list is law
        and CF-133 is still open with the client and their tax adviser.'
      summary: Issue a tax invoice for one or more paid orders
      description: >
        5.7.93, 5.10.3. **The document a guest or a company can reclaim or file VAT against**, which a
        billing statement (`isTaxInvoice` false) and a receipt are not. Three kinds:

        - `simplified`: one order, no recipient details required. Issued by the platform (`service`) when
          an order is paid and the venue's template says so; this is the receipt that carries VAT.
        - `full`: one order, with the recipient's name, address and, where registered, their TRN. Asked for
          by the guest (their own order), at a till or from the back office.
        - `consolidated`: several paid orders of one buyer, one legal entity and one currency on one
          invoice, for a corporate account or a group booking. Each order may be on one consolidated
          invoice only.

        The server takes the lines, rates and tax from the orders as they were posted (`calculateTax` at
        sale); **nothing on an invoice is re-priced**. The number is assigned from the legal entity's series
        for the document kind (`setTaxInvoiceTemplate`), in sequence and without gaps, when the invoice is
        issued; it is never reused. The supplier block is a snapshot of the legal entity at issue.
        The PDF, in the template's languages, is produced at issue (`getTaxDocumentRendition`).

        An invoice is never edited or deleted: a correction is a credit memo (`issueCreditMemo`) and, where
        needed, a new invoice. A guest may call this for their own paid orders only.

        **What the UAE requires on each kind** (research 2 October 2026, CHG-FIN-011; Executive
        Regulation Art. 59, Cabinet Decision 52 of 2017 as amended by Cabinet Decision 100 of 2024;
        the note is docs/active/research-uae-vat-and-blind-close-2-october.md). A full tax invoice:
        the words "Tax Invoice"; the supplier's name, address and TRN; the recipient's name, address and
        TRN where registered; a sequential number; the date of issue and the date of supply where
        different; a description; per line the unit price, quantity, tax rate and amount payable in AED;
        any discount; the gross amount in AED; the tax in AED with the exchange rate where converted;
        and the reverse-charge statement where it applies. A simplified tax invoice: "Tax Invoice"; the
        supplier's name, address and TRN; the date of issue; a description; the total consideration and
