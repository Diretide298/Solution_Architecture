        route: service
        for: 'the names of the venues the session may act at, and that each is active: platform.scope, Tenancy''s data'
      x-ticvai-self-service: true
      x-ticvai-audience:
      - staff
      tags:
      - identity
      x-ticvai-read-routing: primary
      security:
      - bearerAuth: []
      x-ticvai-self-scoped: principal
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      summary: Which venue this back-office session is working in, and which it may switch to
      description: >-
        **The back office shows which venue you are in** (16 October 2026 minutes, 4.8: Allam noted there is nowhere
        on screen to see which venue the user is working in; CHG-R8PRD-006). This is the session's **working venue**:
        the venue the back office shows and works in.

        **Where it comes from.** A till or handheld session acts at its workstation's venue; a session whose
        selected role is granted at one venue works in that venue; both are fixed (`fixedBy`). A session whose grants reach several venues, such as one administrator for
        every venue of the tenant (4.8: both models must be supported), acts at the venue last chosen with
        `setSessionVenue`, or at none until one is chosen; `availableVenues` lists the venues it may choose,
        those of `Session.scope` at venue level and every active venue under a wider scope node, in name order.

        **Which operations use it** (CHG-R8PRD-010, CHG-R8PRD-011): exactly seven, each by its own text, as the venue they act at when
        no `venueId` is sent: catalogue `listProductTags`, `setProductTagDefinition`, `listProductCategoryUsage`,
        `listOwnerFormCandidates`, `listSalePermissionTargets`, `getProductDashboard` and `listProductAttentionItems`.
        Every other operation resolves the caller's venue as before; the back office sends the working venue as their
        `venueId` where they take one. How it reaches those seven is said once, in `setSessionVenue`.
        It is kept in a column of its own (`identity.session.working_venue_id`), not in `venue_id`, so
        `ActiveSession.venueId` and what `listActiveSessions` and `forceLogout` reach keep their meaning.

        A session that is not yet usable answers `409 session-pending`, as `getCurrentSession` does.
      responses:
        '200':
          description: The session's venue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionVenue'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '409':
          description: The session is pending (`session-pending`); `pending` names the steps left.
          x-ticvai-problem-types:
          - session-pending
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionPendingProblem'
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
    put:
      operationId: setSessionVenue
      x-ticvai-singleton: true
      x-ticvai-singleton-note: 'One per session, the caller''s own: a PUT replaces it. There is no key in the path.'
      x-ticvai-read-via:
      - query: tenancy#activeVenues
        route: service
        for: 'the chosen venue must be an active venue the session''s grants reach: platform.scope, Tenancy''s data'
      x-ticvai-self-service: true
      x-ticvai-audience:
      - staff
      tags:
      - identity
      security:
      - bearerAuth: []
      x-ticvai-self-scoped: principal
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      summary: Switch the back-office session to another venue it may act at
      description: >-
        **The venue switcher of the back office's top bar** (CHG-R8PRD-006). Sets the session's working venue, kept
        on the session (`identity.session.working_venue_id`) until it ends or is switched again. It changes no grant: what the
        caller may do at the new venue is what `Session.permissionsByScope` already says for it, so the back office
        filters its navigation again after the switch.

        **How it travels: with the caller's session, as the session's scope does** (ADR-0004; permission-resolution R7;
        `bearerAuth`). The access token carries `sid`, and every service validates that `sid` per request against the
        session registry, the cache in front of `identity.session` that already carries the session's resolved scope
        and workstation. This operation writes the new working venue to the session row and to its registry entry in
        one step, so the very next request made with the same token carries it; no token is reissued. A service that
        falls back to it (the seven operations `getSessionVenue` lists) reads it from the caller's validated session,
        as it reads the caller's scope, never from `identity.session` through a query. **Sign-in writes it too**
        (CHG-R8PRD-012): when the session has exactly one venue, fixed by its workstation or the only venue its grants
        reach, sign-in (and role selection) writes that venue into `working_venue_id` and the registry entry, so a
        session that cannot call this operation (`409 venue-fixed`) still carries its venue.

        **Refused** when the venue is not one of `availableVenues`, that is not an active venue the session's grants
        reach (`403 venue-not-in-grants`), when the session's venue is fixed by its workstation or its role
        (`409 venue-fixed`), and while the session is pending (`409 session-pending`). **Audited:** a switch changes
        the security context the screens show, so it writes one entry to the security audit log that `listAuditRecords`
        reads (the session, the venue before and after).
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSessionVenueRequest'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionVenue'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          description: The venue is not one the session's grants reach, or not active (`venue-not-in-grants`).
          x-ticvai-problem-types:
          - venue-not-in-grants
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: The session's venue is fixed by its workstation or its role (`venue-fixed`), or the session is
            pending (`session-pending`).
          x-ticvai-problem-types:
          - venue-fixed
          - session-pending
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (common.yaml bearerAuth). Added 29 September (system-design review SD-054).
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
    prospectAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Prospect sign-up session token (common.yaml prospectAuth), issued by verifyProspectSignupCode; DEC-167, CHG-CLN-019.
  schemas:
    ConsentIdentifierCapture:
      type: object
      x-ticvai-persistence: none — request only; lands on pii.consent_identifier
      description: What `marketing-crm.recordDeviceConsent` sends Identity (CHG-XDW-004); the row is
        marketing-crm's `ConsentCaptureIdentifier`.
      required:
      - deviceConsentId
      - capturedAt
      - scopePath
      properties:
        deviceConsentId:
          type: string
          format: uuid
        scopePath:
          type: string
          description: '**The decision''s scope path** (R8 blocker fix, IDENTITY-C02; `pii.consent_identifier.scope_path`
            is NOT NULL and under row-level security). Sent by `marketing-crm.recordDeviceConsent`, which holds it as
            `marketing.device_consent.scope_path`; Identity may not read that table across deployables and so takes it
            from the caller, refusing a path outside the caller''s scope.'
        ipAddress:
          type: string
          maxLength: 45
          nullable: true
        userAgent:
          type: string
          maxLength: 500
          nullable: true
        capturedAt:
          type: string
          format: date-time
    GuestDeviceSessionsEnd:
      type: object
      x-ticvai-persistence: none — request only; ends sessions in the session registry (identity.guest_session)
      description: What `marketing-crm.revokeGuestDevice` sends `endGuestDeviceSessions` (CHG-MOD-009).
      required:
      - subjectId
      - deviceId
      properties:
        subjectId:
          type: string
          format: uuid
          description: The guest whose device was revoked (pii.subject), from the revoking guest's own session.
        deviceId:
          type: string
          maxLength: 64
          description: The revoked device's `GuestDevice.installationId`, which the app sent as `deviceId` when it
            signed in. A device registered without an installationId has none, and the call is not made.
        reason:
          type: string
          enum:
          - deviceRevoked
          default: deviceRevoked
          description: Why the sessions end, kept on the ended session for the guest's security history.
    GuestDeviceSessionsEnded:
      type: object
      x-ticvai-persistence: none — computed
      required:
      - endedSessions
      properties:
        endedSessions:
          type: integer
          minimum: 0
          description: How many of the guest's sessions on that device ended, each with its refresh token.
    GuestSubjectDetailsUpdate:
      type: object
      x-ticvai-persistence: none — request only; lands on pii.subject
      description: The part of `marketing-crm.updateMyProfile` that is the guest's subject (CHG-XDW-005).
        At least one field.
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 200
        preferredLanguage:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 639-1, as `pii.subject.preferred_language`.
    StartProspectSignupRequest:
      type: object
      x-ticvai-persistence: none — request only (DEC-167; CHG-CLN-019)
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 256
          description: The prospect's work email; the one-time code goes here.
        locale:
          type: string
          maxLength: 16
          nullable: true
          description: The language the code message is written in (BCP 47), default English.
    ProspectSignupChallenge:
      type: object
      x-ticvai-persistence: none — the challenge is held by identity for its lifetime (CHG-CLN-019)
      required:
      - challengeId
      - expiresInSeconds
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
        resendAfterSeconds:
          type: integer
    VerifyProspectSignupCodeRequest:
      type: object
      x-ticvai-persistence: none — request only (CHG-CLN-019)
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: The six-digit one-time code sent to the email.
    ProspectSignupSession:
      type: object
      x-ticvai-persistence: none — a session token, not a table the package reads (CHG-CLN-019)
      required:
      - token
      - expiresAt
      - resumed
      properties:
        token:
          type: string
          description: The `prospectAuth` bearer token, scoped to one onboarding application.
        expiresAt:
          type: string
          format: date-time
        onboardingApplicationId:
          type: string
          format: uuid
          nullable: true
          description: The application in progress for this email, or null until the first `submitOnboardingApplication`.
        resumed:
          type: boolean
          description: True when the email already had an application in progress ("Continue saved setup").
    IdentityRoleSuggestion:
      type: object
      x-ticvai-persistence: none — computed from workforce.work_assignment peers, identity.delegated_access and
        identity.access_decision
      description: One role suggested for a person because peers with the same job title and posting hold it (7.1.35,
        7.1.56; decided 29 September, build pass, group G2).
      required:
      - roleId
      - scopePath
      - peersHoldingPercent
      - recommendation
      properties:
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        roleName:
          type: string
        scopePath:
          type: string
          description: Where the peers hold it, and so where it would be granted.
        peerCount:
          type: integer
          description: Principals with the same job title at the same posting.
        peersHolding:
          type: integer
        peersHoldingPercent:
          type: number
          minimum: 0
          maximum: 100
        peersUsingPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Of the peers holding it, the share with a permit using one of its permissions in `lookbackDays`.
        alreadyHeld:
          type: boolean
        recommendation:
          type: string
          enum:
          - grant
          - review
          - held
          description: '`grant` where most peers hold and use it; `review` where they hold it and do not use it;
            `held` where the person has it already.'
        evidence:
          type: object
          description: What the suggestion rests on, so the person granting can check it.
          properties:
            jobTitleId:
              type: string
              format: uuid
            postingScopePath:
              type: string
            samplePeerPrincipalIds:
              type: array
              maxItems: 5
              items:
                type: string
                format: uuid
            requiresApproval:
              type: boolean
              description: Whether granting this role raises an approval (a role carrying permission or price
                authority, ApprovalKind level 2).
    IdentityAccessReviewCampaign:
      type: object
      x-ticvai-persistence: identity.access_review_campaign
      description: '**A periodic access review** (7.1.35, 7.1.56; decided 29 September, build pass, group G2): which
        grants, reviewed by whom, by when. Its items are `identity.access_review_item`. Lifecycle in
        `states/access-review-campaign.yaml`.'
      required:
      - name
      - scopePath
      - reviewerMode
      - dueAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        scopePath:
          readOnly: true
          type: string
          description: '**The partition key** (ADR-0005), and what is reviewed: every grant at or below it. Inside the
            caller''s own scope. Operations write it at `venue` scope.'
        roleIds:
          type: array
          nullable: true
          description: Only grants of these roles; null reviews every grant in scope.
          items:
            type: string
            format: uuid
        reviewerMode:
          type: string
          enum:
          - lineManager
          - named
          description: '`lineManager`: each item goes to the holder''s manager from their primary work assignment,
            falling back to the named reviewers where none is found. `named`: the named reviewers share the items.'
        reviewerPrincipalIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        dueAt:
          type: string
          format: date-time
        recurrence:
          type: string
          enum:
          - none
          - quarterly
          - semiAnnual
          - annual
          default: none
        prefillFromFindings:
          type: boolean
          default: true
        lookbackDays:
          type: integer
          minimum: 7
          maximum: 365
          default: 90
        status:
          type: string
          enum:
          - open
          - completed
          - expired
          readOnly: true
        itemCount:
          type: integer
          readOnly: true
        decidedCount:
          type: integer
          readOnly: true
          description: Kept by `decideAccessReviewItem` in the same write, so the campaign list needs no count query.
        revokedCount:
          type: integer
          readOnly: true
        createdByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    IdentityAccessReviewItem:
      type: object
      x-ticvai-persistence: identity.access_review_item
      description: One grant under review in a campaign, with the finding that pre-filled it and the reviewer's decision
        (decided 29 September, build pass, group G2). Lifecycle in `states/access-review-item.yaml`.
      required:
      - campaignId
      - delegatedAccessId
      - principalId
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaignId:
          type: string
          format: uuid
          x-ticvai-references: identity.access_review_campaign
        delegatedAccessId:
          type: string
          format: uuid
          x-ticvai-references: identity.delegated_access
          description: The grant under review.
        principalId:
          type: string
          format: uuid
          x-ticvai-references: identity.principal
        roleId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: identity.role
        scopePath:
          type: string
          description: The grant's scope. **The partition key** (ADR-0005).
        reviewerPrincipalId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: identity.principal
        findingKind:
          type: string
          enum:
          - none
          - excessive
          - conflicting
          default: none
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        recommendation:
          type: string
          enum:
          - certify
          - revoke
          - review
        status:
          type: string
          enum:
          - pending
          - certified
          - revoked
          - notReviewed
          readOnly: true
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        reason:
          type: string
          maxLength: 1000
          nullable: true
    AuthorisationPolicyEffectiveness:
      type: object
      x-ticvai-persistence: none — computed from identity.access_decision and identity.access_override over the
        requested period
      description: One `AuthorisationPolicy` over a period (3.3.48; decided 29 September, build pass).
      required:
      - policyId
      - evaluations
      properties:
        policyId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - draft
          - pendingApproval
          - active
          - suspended
          - retired
        versionsInPeriod:
          type: array
          items:
            type: integer
          description: The versions that decided anything in the period.
        evaluations:
          type: integer
          minimum: 0
          description: Decisions that evaluated this policy.
        matched:
          type: integer
          minimum: 0
          description: Evaluations in which every condition held (or one, for `anyMayMatch`).
        decisivePermits:
          type: integer
          minimum: 0
          description: Permits this policy decided.
        decisiveDenies:
          type: integer
          minimum: 0
          description: Denies this policy decided, deny winning over any permit.
        overridesAtScope:
          type: integer
          minimum: 0
          description: Emergency overrides opened in the period at or beneath the policy's scope for a
            permission it speaks to - the times people had to go around it.
        lastMatchedAt:
          type: string
          format: date-time
          nullable: true
        neverMatched:
          type: boolean
          description: True when the policy was evaluated and never matched in the period, the usual sign of a
            condition written backwards or a policy nobody needs.
        trend:
          type: array
          description: One point per day in the period.
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              evaluations:
                type: integer
              decisiveDenies:
                type: integer
    IdentityPermissionFinding:
      type: object
      x-ticvai-persistence: none — computed from grants (roles, delegations, policies) against
        identity.access_decision and identity.segregation_rule
      description: One excessive, missing or conflicting permission (7.1.47; decided 29 September, build pass).
      required:
      - kind
      - principalId
      - permission
      properties:
        kind:
          type: string
          enum:
          - excessive
          - missing
          - conflicting
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
          nullable: true
          description: The role that grants it, for excessive and conflicting; the role whose peers hold it, for
            missing.
        permission:
          type: string
        conflictingPermission:
          type: string
          nullable: true
          description: The other half of the pair, for conflicting.
        segregationRuleId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
        grantedBy:
          type: string
          enum:
          - role
          - delegation
          - policy
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: The last permit that used it; null when never used in the window.
        deniedCount:
          type: integer
          nullable: true
          description: For missing, the denials in the window.
        peersHoldingPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: For missing, the share of the role's holders at the same scope who hold the permission.
        recommendation:
          type: string
          enum:
          - revoke
          - grant
          - review
        asDraft:
          type: boolean
          default: false
          description: True when the finding exists only because of the `draftPolicyId` evaluated.
    IdentityGuestDocumentSubmission:
      type: object
      x-ticvai-persistence: none — request only; the document goes to pii.subject_document and the verification to
        identity.guest_identity_verification
      required:
      - documentKind
      - documentNumber
      - documentAssetId
      properties:
        documentKind:
          type: string
          enum:
          - passport
          - emiratesId
          - nationalId
          - drivingLicence
          - residencePermit
          - other
          description: The vocabulary of `pii.subject_document.kind`.
        documentNumber:
          type: string
          format: password
          writeOnly: true
          maxLength: 64
          description: '**Write-only, never returned.** Hashed on arrival; only the last four are kept in clear.'
        issuingCountry:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        expiresOn:
          type: string
          format: date
          nullable: true
        documentAssetId:
          type: string
          format: uuid
          description: The uploaded scan or photo of the document. **A guest makes it** with assets
            `createGuestUpload` and `completeGuestUpload` (purpose `identityDocument`); this is the completed upload's
            `uploadId`, which must be the caller's own (R8 blocker IDENTITY-C66, CHG-R8MIG-027).
        selfieAssetId:
          type: string
          format: uuid
          nullable: true
          description: A live photo for the reviewer to compare, where the policy asks for one. Deleted with the
            scan. The caller's own completed guest upload with purpose `selfie`; required when the policy's
            `selfieRequired` is true (422 `selfie-required`).
        reason:
          type: string
          enum:
          - policyRequired
          - ageRestrictedPurchase
          - residentPricing
          - accountRecovery
          default: policyRequired
          description: What the guest is verifying for; the review queue shows it.
    IdentityGuestVerification:
      type: object
      x-ticvai-persistence: identity.guest_identity_verification
      description: '**One guest identity-document verification** (5.3.21; decided 29 September, build pass):
        the document it checks, its status, the method and who decided. The document itself is
        `pii.subject_document`; this row holds no document number.'
      required:
      - id
      - subjectId
      - status
      - submittedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subjectId:
          x-ticvai-references: pii.subject
          type: string
          format: uuid
        subjectDocumentId:
          type: string
          format: uuid
          description: The `pii.subject_document` row submitted.
        documentKind:
          type: string
          enum:
          - passport
          - emiratesId
          - nationalId
          - drivingLicence
          - residencePermit
          - other
        documentNumberLast4:
          type: string
          maxLength: 4
          nullable: true
          readOnly: true
        reason:
          type: string
          enum:
          - policyRequired
          - ageRestrictedPurchase
          - residentPricing
          - accountRecovery
        status:
          type: string
          enum:
          - pending
          - verified
          - rejected
          - resubmissionRequested
          readOnly: true
        method:
          type: string
          enum:
          - manualReview
          - documentScanner
          - provider
          nullable: true
          readOnly: true
        decisionReason:
          type: string
          maxLength: 300
          nullable: true
          readOnly: true
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        submittedAt:
          type: string
          format: date-time
          readOnly: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        documentImageDeletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the scan (and any selfie) was deleted under the policy's retention.
        selfieUploadId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: none
          description: '**The selfie sent with the document** (R8 blocker IDENTITY-C66, CHG-R8MIG-027): the
            `assets.guest_upload` id of the request''s `selfieAssetId`, kept for the reviewer and deleted with the scan
            (`documentImageDeletedAt`, then null). Null when none was sent.'
    IdentityGuestVerificationPolicy:
      type: object
      x-ticvai-persistence: identity.guest_verification_policy
      description: '**The tenant''s configurable identity workflow for guests** (5.3.21; decided 29 September,
        build pass). Which verifications registration needs, which moments need a verified ID document, what is
        accepted and who reviews it. Proposed defaults are ours (our build plan).'
      required:
      - registrationRequires
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: 'The tenant, written by the server (`x-ticvai-config-scope: tenant`).'
        registrationRequires:
          type: array
          description: Verifications a new account must pass before it is usable. Proposed default
            `[mobileOtp]`.
          items:
            type: string
            enum:
            - email
            - mobileOtp
        idDocumentRequiredFor:
          type: array
          description: The moments that need a verified ID document. Empty (the default) asks for none.
          items:
            type: string
            enum:
            - accountCreation
            - ageRestrictedPurchase
            - residentPricing
            - accountRecovery
            - walletTopUpAboveLimit
        walletTopUpLimit:
          $ref: ../shared/common.yaml#/components/schemas/Money
        acceptedDocumentKinds:
          type: array
          description: Proposed default passport, emiratesId, nationalId.
          items:
            type: string
            enum:
            - passport
            - emiratesId
            - nationalId
            - drivingLicence
            - residencePermit
            - other
        uaePassSatisfiesIdDocument:
          type: boolean
          default: true
          description: A guest signed in with UAE Pass (`guestUaePassLogin`) counts as ID-verified, since the
            national identity has already checked the person.
        socialLoginCountsAsEmailVerified:
          type: boolean
          default: true
        selfieRequired:
          type: boolean
          default: false
        reviewMode:
          type: string
          enum:
          - manual
          - provider
          - providerThenManual
          default: manual
          description: Who checks a document. `provider` and `providerThenManual` need the client's verification
            provider (make-or-break on `setGuestVerificationPolicy`).
        verificationProvider:
          type: string
          nullable: true
          enum:
          - icp
          description: '**The government verification service behind `reviewMode` `provider`** (decided 2 October
            2026, Chinmay; DEC-457; CHG-CSP-034): the UAE Federal Authority for Identity, Citizenship, Customs and
            Port Security (ICP), integrated in release 1 once the client provides access. Null runs manual review
            only. A verification it decides records `method` `provider`.

            '
        documentImageRetention:
          type: string
          enum:
          - deleteOnDecision
          - keepUntilDocumentExpiry
          default: deleteOnDecision
          description: How long the scan is kept. The outcome and the hashed number are kept either way.
        maxResubmissions:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    MembershipDetail:
      type: object
      x-ticvai-persistence: none — composed from the membership and three related tables
      description: >
        **One cross-cell round trip instead of three.** A membership lives in the guest's home
        cell and its status history and benefit usage live beside it, in the same service. A venue
        in another cell asking why a pass was refused needs all three, and asking three times is
        three round trips at a counter with somebody waiting.

        The hot path is not this: `EntitlementTemplate.crossesCells` propagates the redemption
        right on issue (ADR-0010), so *is this valid* stays local. This is the cold path, where
        somebody is asking why.
      required:
      - membership
      properties:
        membership:
          $ref: '#/components/schemas/IdentityCustomerMembership'
        history:
          type: array
          description: Status changes, most recent first.
          items:
            $ref: '#/components/schemas/IdentityMembershipHistory'
        benefitUsage:
          type: array
          items:
            $ref: '#/components/schemas/IdentityBenefitUsage'

      # **Renewals are deliberately not here, and the reason is the cross-cell criterion itself.**
      # `orders.membership_renewal` belongs to OrderService; this schema belongs to
      # IdentityService. **The package has no cross-contract `$ref` anywhere** — every contract is
      # self-contained, one per service — so including them would make IdentityService call
      # OrderService to build every membership read.
      #
      # That trades one in-cell service hop on EVERY read for one cross-cell call on the rare
      # read where somebody is disputing a renewal. `history` already records the lapse
      # transition, so the common question is answered without leaving the service. When the
      # renewal attempts themselves are wanted, `listMembershipRenewals` is one more call and
      # only then.
    IdentityBenefitUsage:
      type: object
      x-ticvai-persistence: identity.benefit_usage
      description: '**Taken from the backend workbook, 20 September.** Tracks each use of a customer''s membership benefit and the remaining allowance.'
      required:
      - customerMembershipId
      - membershipBenefitId
      - quantity
      - usedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customerMembershipId:
          x-ticvai-references: identity.customer_membership
          type: string
          format: uuid
        membershipBenefitId:
          x-ticvai-references: catalogue.membership_benefit
          type: string
          format: uuid
        quantity:
          type: number
