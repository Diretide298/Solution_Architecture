    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/RolePermission'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.role_permission rows, as it stores them and as the caller's
      scope lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
