      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      summary: Change the caller's own password or PIN
      description: '**`createPrincipal` defaults `mustChangeCredential` to true and nothing could change
        a credential**, so every new member of staff was issued an initial secret they could never
        replace: the first sign-in could not complete. `identity.principal_credential` was read by
        `login` and written by nothing after creation.

        **The current credential is required even inside a session.** A till left signed in is a
        session somebody else can use, and changing its PIN without knowing the old one is how that
        session becomes theirs permanently.

        Held to `setPasswordPolicy` (length, breach check); a PIN is held to the tenant''s PIN settings only
        (`PasswordPolicy.pinLength` digits, `pinReusePrevention`; CHG-CRD-002), because it is valid only on a
        registered workstation (see `LoginRequest.method`). **Every other session of the principal is ended** on
        success, since a credential changed because it leaked is not fixed while the leaked one is still signed in.

        **What it writes** (14 October 2026, CHG-CRD-001, ADAM CR-078): the principal''s `identity.principal_credential`
        row for `method` takes the new PHC hash (ADR-0071), `setAt` now, `failedAttempts` 0 and `lockedUntil` null; the
        replaced hash goes to `identity.principal_credential_history`, which the reuse check reads; and a successful
        change **clears `Principal.mustChangeCredential`**, so the session that signed in with a temporary credential
        becomes usable. **A wrong `currentCredential` is 422 `current-credential-wrong`, not 401**: the session is valid
        and stays signed in; the wrong attempt counts towards the lockout like a wrong sign-in, and at the threshold the
        method locks (429 `credential-locked`). A principal provisioned by single sign-on (`Principal.ssoProviderId`)
        has no local password to change: `method: password` is 409 `credential-managed-by-sso` (a PIN issued to them by
        `resetPrincipalCredential` is changed here like anyone''s).

        '
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCredentialRequest'
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Changed. Other sessions of this principal are ended.
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '409':
          description: 'A `password` change for a principal provisioned by single sign-on, who has no local password
            (`Principal.ssoProviderId` set; 14 October 2026, CHG-CRD-001). The password is changed at the identity
            provider; nothing is written.'
          x-ticvai-problem-types:
          - credential-managed-by-sso
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: 'One problem type per cause (14 October 2026, CHG-CRD-001, ADAM CR-078; common.yaml `Problem`):
            `current-credential-wrong`, `currentCredential` does not match the stored hash (a 422, not a 401, because
            the session is valid and stays signed in; the attempt counts towards the lockout);
            `policy-not-met`, the new credential fails the policy (a password: `minLength`, the breach check; a PIN:
            not exactly `PasswordPolicy.pinLength` digits), with `errors[]` naming the rule;
            `credential-reused`, it matches the current one or one the policy keeps (a password: the previous
            `PasswordPolicy.reusePreventionCount`, 5 unless the tenant sets another, audit R132; a PIN:
            `PasswordPolicy.pinReusePrevention`). The server keeps a hash of each replaced credential in
            `identity.principal_credential_history` for that purpose and never the credential itself.

            '
          x-ticvai-problem-types:
          - current-credential-wrong
          - policy-not-met
          - credential-reused
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          description: The request budget is exceeded (`rate-limited`), or wrong current credentials reached the
            lockout threshold and the method is locked until `PrincipalCredential.lockedUntil` (`credential-locked`,
            CHG-CRD-001); `Retry-After` says when.
          x-ticvai-problem-types:
          - rate-limited
          - credential-locked
          headers:
            Retry-After:
              $ref: '../shared/common.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
