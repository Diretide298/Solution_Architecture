        - "P06 EMP-001 Sign in"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P09 ADM-699 My Account & Security"
        - "P10 PTR-001 Partner Login / MFA"
