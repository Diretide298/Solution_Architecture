                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityAccessReviewCampaign'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createAccessReviewCampaign
      x-ticvai-consumed-by:
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-read-via:
      - query: workforce#employeeRecords
        route: in-process
        for: 'its read of workforce.employee, Tenancy''s data (CHG-MOD-001)'
      - query: workforce#workAssignmentRecords
        route: in-process
        for: 'its read of workforce.work_assignment, Tenancy''s data (CHG-MOD-001)'
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56 periodic access reviews, pre-filled from
        listPermissionFindings); shape follows createDelegatedAccess'
      summary: Start an access review, one item per grant in scope
      description: '7.1.35, 7.1.56 (decided 29 September, build pass, group G2). **A periodic re-certification of who
        holds what.** Creating the campaign snapshots, in the same transaction, one `IdentityAccessReviewItem` per
        grant (`identity.delegated_access`, allow, in force) inside `scopePath`, narrowed to `roleIds` where given.
        Each item names its reviewer (`reviewerMode`: the principal''s line manager from their primary work
        assignment, or the named reviewers in turn) and, with `prefillFromFindings`, carries what
        `listPermissionFindings` says about that grant (`excessive`: unused in `lookbackDays`, recommendation
        `revoke`; `conflicting`: a segregation pair, `review`; otherwise `certify`).


        **The reviewer decides; the findings only pre-fill** (`decideAccessReviewItem`). At `dueAt` undecided items
        become `notReviewed` and the grant is left as it is: **an access review that silently revokes what nobody
        looked at locks people out of their work**, so the report says what was not reviewed rather than acting on
        it. `recurrence` repeats the campaign on the same terms (a job creates the next one at the end of this one).

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAccessReviewCampaign'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Created, with its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAccessReviewCampaign'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '422':
          description: '`dueAt` not in the future, `reviewerMode` `named` with no `reviewerPrincipalIds`, a
            `scopePath` outside the caller''s own, or no grant in scope to review (`nothing-to-review`).

            '
          x-ticvai-problem-types:
          - nothing-to-review
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /access-review-campaigns/{campaignId}/items:
    parameters:
    - name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listAccessReviewItems
      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56); shape follows listPermissionFindings'
      summary: The grants a campaign asks somebody to certify or revoke
      description: 'One row per grant in the campaign, with the finding that pre-filled it and the decision so far.
        `assignedToMe` is the reviewer''s own queue. Ordered by `recommendation` (revoke first), then principal; keyset
        cursor.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - certified
          - revoked
          - notReviewed
      - name: assignedToMe
        in: query
        schema:
          type: boolean
      - name: findingKind
        in: query
        schema:
          type: string
          enum:
          - none
          - excessive
          - conflicting
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Review items
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityAccessReviewItem'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /access-review-items/{itemId}/decision:
    parameters:
    - name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: decideAccessReviewItem
      x-ticvai-consumed-by:
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-audience:
      - staff
      x-ticvai-agreed: '29 September: our build plan (7.1.35, 7.1.56 certify or revoke each grant); shape follows
        createDelegatedAccess'
      summary: Certify a grant, or revoke it
      description: '**`certify`** records that the reviewer confirmed the grant is still needed. **`revoke`** ends the
        grant in the same transaction (`identity.delegated_access` ends now, as when a grant is withdrawn any other
        way) and ends the holder''s live sessions, so it applies at once (audit R126). `reason` is required for
        `revoke`, and for `certify` where the item''s recommendation was `revoke` (overriding the evidence is what an
        auditor asks about).


        **Segregation of duties**: nobody decides an item for a grant they hold themselves (403). The reviewer must
        hold `PERMISSION_GRANT` at the grant''s scope, as they would to change it any other way.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_GRANT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - certify
                  - revoke
                reason:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAccessReviewItem'
        '400':
          x-ticvai-problem-types: [revoke-reason-required, certify-override-reason-required]
          description: '`revoke` without a `reason`, or `certify` against a `revoke` recommendation without one.'
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '403':
          x-ticvai-problem-types: [reviewer-holds-grant, forbidden]
          description: The item is for a grant the caller holds, or the caller lacks `PERMISSION_GRANT` at its scope.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: Already decided, or the campaign is no longer `open` (`campaign-closed`).
          x-ticvai-problem-types:
          - item-decided
          - campaign-closed
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

  /auth/prospect/signup:
    post:
      operationId: startProspectSignup
      x-ticvai-consumed-by:
        - "P09 ADM-380 Customer & Organization Registration"
        - "P17 SGN-002 Customer & Organization Registration"
      x-ticvai-audience:
      - public
      - prospect
      summary: Start (or resume) a TICVAI sign-up with an email and a one-time code
      description: '**The door of the prospect sign-up session** (decided 2 October 2026, Chinmay: DEC-167, "Email +
        one-time code"; CHG-CLN-019). A prospect on the public sign-up journey (P17) gives a work email; a one-time
        code is sent to it. "Continue saved setup" is the same call: an email that already has an onboarding
        application in progress receives a code that resumes it.


        **The response never reveals whether the email has an application.** It is the same either way; only the
        message differs, and only the owner of the mailbox receives it. Rate-limited per email and per source
        address. Nothing is provisioned and no tenant exists yet.

        '
      tags:
      - prospectAuth
      x-ticvai-permission: null
      x-ticvai-scope-level: platform
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProspectSignupRequest'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: A code was sent if the email is deliverable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectSignupChallenge'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
  /auth/prospect/signup/{challengeId}/verify:
    parameters:
    - name: challengeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: verifyProspectSignupCode
      x-ticvai-consumed-by:
        - "P09 ADM-380 Customer & Organization Registration"
        - "P17 SGN-002 Customer & Organization Registration"
      x-ticvai-audience:
      - public
      - prospect
      summary: Prove the email with the one-time code and receive the prospect sign-up session
      description: '**Issues the `prospectAuth` session** (DEC-167; CHG-CLN-019, CHG-CLN-010). A right code returns a
        token scoped to one onboarding application: the application already in progress for this email, or a new
        one the prospect''s first `submitOnboardingApplication` creates. It carries no tenant and no permission;
        the sign-up operations accept it as their `prospectAuth` alternative. It expires with the application''s
        activation or abandonment, or at `expiresAt`, whichever is first; "Continue saved setup" starts again at
        `startProspectSignup`.


        A wrong code answers 422 (`codeInvalid`) and counts against the challenge; after five, once the code has
        expired, or once it was used, the challenge is spent (409 `codeExpired`) and a new one is started. A retry
        with the same `Idempotency-Key` (a lost response) returns the same session, not 409.

        '
      tags:
      - prospectAuth
      x-ticvai-permission: null
      x-ticvai-scope-level: platform
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyProspectSignupCodeRequest'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The prospect sign-up session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectSignupSession'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: The challenge is spent (`codeExpired`) because the code expired, five wrong codes were tried
            or it was already used; start a new one with startProspectSignup
          x-ticvai-problem-types:
          - codeExpired
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: The code is wrong (`codeInvalid`); it counts against the challenge
          x-ticvai-problem-types:
          - codeInvalid
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff session token (common.yaml bearerAuth). Added 29 September (system-design review SD-054).
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
    prospectAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Prospect sign-up session token (common.yaml prospectAuth), issued by verifyProspectSignupCode; DEC-167, CHG-CLN-019.
  schemas:
    ConsentIdentifierCapture:
      type: object
      x-ticvai-persistence: none — request only; lands on pii.consent_identifier
      description: What `marketing-crm.recordDeviceConsent` sends Identity (CHG-XDW-004); the row is
        marketing-crm's `ConsentCaptureIdentifier`.
      required:
      - deviceConsentId
      - capturedAt
      properties:
        deviceConsentId:
          type: string
          format: uuid
        ipAddress:
          type: string
          maxLength: 45
          nullable: true
        userAgent:
          type: string
          maxLength: 500
          nullable: true
        capturedAt:
          type: string
          format: date-time
    GuestDeviceSessionsEnd:
      type: object
      x-ticvai-persistence: none — request only; ends sessions in the session registry (identity.guest_session)
      description: What `marketing-crm.revokeGuestDevice` sends `endGuestDeviceSessions` (CHG-MOD-009).
      required:
      - subjectId
      - deviceId
      properties:
        subjectId:
          type: string
          format: uuid
          description: The guest whose device was revoked (pii.subject), from the revoking guest's own session.
        deviceId:
          type: string
          maxLength: 64
          description: The revoked device's `GuestDevice.installationId`, which the app sent as `deviceId` when it
            signed in. A device registered without an installationId has none, and the call is not made.
        reason:
          type: string
          enum:
          - deviceRevoked
          default: deviceRevoked
          description: Why the sessions end, kept on the ended session for the guest's security history.
    GuestDeviceSessionsEnded:
      type: object
      x-ticvai-persistence: none — computed
      required:
      - endedSessions
      properties:
        endedSessions:
          type: integer
          minimum: 0
          description: How many of the guest's sessions on that device ended, each with its refresh token.
    GuestSubjectDetailsUpdate:
      type: object
      x-ticvai-persistence: none — request only; lands on pii.subject
      description: The part of `marketing-crm.updateMyProfile` that is the guest's subject (CHG-XDW-005).
        At least one field.
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 200
        preferredLanguage:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 639-1, as `pii.subject.preferred_language`.
    StartProspectSignupRequest:
      type: object
      x-ticvai-persistence: none — request only (DEC-167; CHG-CLN-019)
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 256
          description: The prospect's work email; the one-time code goes here.
        locale:
          type: string
          maxLength: 16
          nullable: true
          description: The language the code message is written in (BCP 47), default English.
    ProspectSignupChallenge:
      type: object
      x-ticvai-persistence: none — the challenge is held by identity for its lifetime (CHG-CLN-019)
      required:
      - challengeId
      - expiresInSeconds
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
        resendAfterSeconds:
          type: integer
    VerifyProspectSignupCodeRequest:
      type: object
      x-ticvai-persistence: none — request only (CHG-CLN-019)
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: The six-digit one-time code sent to the email.
    ProspectSignupSession:
      type: object
      x-ticvai-persistence: none — a session token, not a table the package reads (CHG-CLN-019)
      required:
      - token
      - expiresAt
      - resumed
      properties:
        token:
          type: string
          description: The `prospectAuth` bearer token, scoped to one onboarding application.
        expiresAt:
          type: string
          format: date-time
        onboardingApplicationId:
          type: string
          format: uuid
          nullable: true
          description: The application in progress for this email, or null until the first `submitOnboardingApplication`.
        resumed:
          type: boolean
          description: True when the email already had an application in progress ("Continue saved setup").
    IdentityRoleSuggestion:
      type: object
      x-ticvai-persistence: none — computed from workforce.work_assignment peers, identity.delegated_access and
        identity.access_decision
      description: One role suggested for a person because peers with the same job title and posting hold it (7.1.35,
        7.1.56; decided 29 September, build pass, group G2).
      required:
      - roleId
      - scopePath
      - peersHoldingPercent
      - recommendation
      properties:
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        roleName:
          type: string
        scopePath:
          type: string
          description: Where the peers hold it, and so where it would be granted.
        peerCount:
          type: integer
          description: Principals with the same job title at the same posting.
        peersHolding:
          type: integer
        peersHoldingPercent:
          type: number
          minimum: 0
          maximum: 100
        peersUsingPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Of the peers holding it, the share with a permit using one of its permissions in `lookbackDays`.
        alreadyHeld:
          type: boolean
        recommendation:
          type: string
          enum:
          - grant
          - review
          - held
          description: '`grant` where most peers hold and use it; `review` where they hold it and do not use it;
            `held` where the person has it already.'
        evidence:
          type: object
          description: What the suggestion rests on, so the person granting can check it.
          properties:
            jobTitleId:
              type: string
              format: uuid
            postingScopePath:
              type: string
            samplePeerPrincipalIds:
              type: array
              maxItems: 5
              items:
                type: string
                format: uuid
            requiresApproval:
              type: boolean
              description: Whether granting this role raises an approval (a role carrying permission or price
                authority, ApprovalKind level 2).
    IdentityAccessReviewCampaign:
      type: object
      x-ticvai-persistence: identity.access_review_campaign
      description: '**A periodic access review** (7.1.35, 7.1.56; decided 29 September, build pass, group G2): which
        grants, reviewed by whom, by when. Its items are `identity.access_review_item`. Lifecycle in
        `states/access-review-campaign.yaml`.'
      required:
      - name
      - scopePath
      - reviewerMode
      - dueAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        scopePath:
          readOnly: true
          type: string
          description: '**The partition key** (ADR-0005), and what is reviewed: every grant at or below it. Inside the
            caller''s own scope. Operations write it at `venue` scope.'
        roleIds:
          type: array
          nullable: true
          description: Only grants of these roles; null reviews every grant in scope.
          items:
            type: string
            format: uuid
        reviewerMode:
          type: string
          enum:
          - lineManager
          - named
          description: '`lineManager`: each item goes to the holder''s manager from their primary work assignment,
            falling back to the named reviewers where none is found. `named`: the named reviewers share the items.'
        reviewerPrincipalIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
        dueAt:
          type: string
          format: date-time
        recurrence:
          type: string
          enum:
          - none
          - quarterly
          - semiAnnual
          - annual
          default: none
        prefillFromFindings:
          type: boolean
          default: true
        lookbackDays:
          type: integer
          minimum: 7
          maximum: 365
          default: 90
        status:
          type: string
          enum:
          - open
          - completed
          - expired
          readOnly: true
        itemCount:
          type: integer
          readOnly: true
        decidedCount:
          type: integer
          readOnly: true
          description: Kept by `decideAccessReviewItem` in the same write, so the campaign list needs no count query.
        revokedCount:
          type: integer
          readOnly: true
        createdByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    IdentityAccessReviewItem:
      type: object
      x-ticvai-persistence: identity.access_review_item
      description: One grant under review in a campaign, with the finding that pre-filled it and the reviewer's decision
        (decided 29 September, build pass, group G2). Lifecycle in `states/access-review-item.yaml`.
      required:
      - campaignId
      - delegatedAccessId
      - principalId
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaignId:
          type: string
          format: uuid
          x-ticvai-references: identity.access_review_campaign
        delegatedAccessId:
          type: string
          format: uuid
          x-ticvai-references: identity.delegated_access
          description: The grant under review.
        principalId:
          type: string
          format: uuid
          x-ticvai-references: identity.principal
        roleId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: identity.role
        scopePath:
          type: string
          description: The grant's scope. **The partition key** (ADR-0005).
        reviewerPrincipalId:
          type: string
          format: uuid
          nullable: true
          x-ticvai-references: identity.principal
        findingKind:
          type: string
          enum:
          - none
          - excessive
          - conflicting
          default: none
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        recommendation:
          type: string
          enum:
          - certify
          - revoke
          - review
        status:
          type: string
          enum:
          - pending
          - certified
          - revoked
          - notReviewed
          readOnly: true
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        reason:
          type: string
          maxLength: 1000
          nullable: true
    AuthorisationPolicyEffectiveness:
      type: object
      x-ticvai-persistence: none — computed from identity.access_decision and identity.access_override over the
        requested period
      description: One `AuthorisationPolicy` over a period (3.3.48; decided 29 September, build pass).
      required:
      - policyId
      - evaluations
      properties:
        policyId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - draft
          - pendingApproval
          - active
          - suspended
          - retired
        versionsInPeriod:
          type: array
          items:
            type: integer
          description: The versions that decided anything in the period.
        evaluations:
          type: integer
          minimum: 0
          description: Decisions that evaluated this policy.
        matched:
          type: integer
          minimum: 0
          description: Evaluations in which every condition held (or one, for `anyMayMatch`).
        decisivePermits:
          type: integer
          minimum: 0
          description: Permits this policy decided.
        decisiveDenies:
          type: integer
          minimum: 0
          description: Denies this policy decided, deny winning over any permit.
        overridesAtScope:
          type: integer
          minimum: 0
          description: Emergency overrides opened in the period at or beneath the policy's scope for a
            permission it speaks to - the times people had to go around it.
        lastMatchedAt:
          type: string
          format: date-time
          nullable: true
        neverMatched:
          type: boolean
          description: True when the policy was evaluated and never matched in the period, the usual sign of a
            condition written backwards or a policy nobody needs.
        trend:
          type: array
          description: One point per day in the period.
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              evaluations:
                type: integer
              decisiveDenies:
                type: integer
