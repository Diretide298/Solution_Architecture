          description: Wildcard on an ALLOW, or scope outside the caller's own grants, or a grant naming both a
            permission and a role, or neither (`validation`; ADAM CR-158)
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: The ALLOW would leave a principal holding both permissions of a segregation rule whose
            severity is `block` (`segregation-breach`, naming the rule, both permissions and the principal).
          x-ticvai-problem-types:
          - segregation-breach
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
