            no `password` row in `identity.principal_credential`, a `password` `login` is refused 401
            `sso-sign-in-required` (the door offers `startSsoAuthorization` instead), and `changeOwnCredential` with
            `method: password` is refused 409 `credential-managed-by-sso`. A till PIN may still be issued to them by
            `resetPrincipalCredential` (`method: pin`); until it is, a `pin` sign-in is refused the same way. Null for a
