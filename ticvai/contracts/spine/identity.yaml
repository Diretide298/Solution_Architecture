        once** (decided 28 September, audit R126 (1)): the person signs in again and is resolved afresh.
        A change to `displayName` alone ends nothing.


        **Every session and refresh token, at every venue, through one function** (accepted 21 October 2026,
        Chinmay, ADAM CR-180 option A; CHG-R10ID-006). The caller acts at a venue, but `identity.refresh_token` is
        tenant-root and `identity.session` venue-isolated, so ending them with the caller''s own row security
