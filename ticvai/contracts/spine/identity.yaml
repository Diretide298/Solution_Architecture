        **One guest data export, as stored** (ADAM CR-101, accepted 15 October 2026; CHG-R10ID-016). One row per
        `exportSubjectData` request, keyed by the Approvals request id, written by `exportSubjectData` (status
        `awaitingApproval` where a request was raised, else `running`, the default) and by the export job, which runs when the request is approved (`approval.granted`) or at
        once where the tenant's matrix asks for no approval step, assembles the file and writes it to the tenant's
        private object storage (never a public or CDN path; encrypted at rest under the tenant's keys, ADR-0063).
        The file is deleted 7 days after `readyAt` and the row becomes `expired` (the lead, 25 October 2026, r10 round
        3; CHG-R10ID-024).
