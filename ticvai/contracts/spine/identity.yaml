        fileSizeBytes:
          type: integer
          format: int64
          nullable: true
        failureReason:
          type: string
          maxLength: 500
          nullable: true
        requestedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
