      x-ticvai-rls: grant-holder-read
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          x-ticvai-unique: tenant
          description: '**Unique within the tenant** (decided 28 September, audit R108). A seeded role''s
            code is reserved in every tenant. Unique per tenant, not per venue, because a grant names a
            role anywhere in the tree; `createRole` refuses a duplicate with `409 duplicate-code`.

            **Compared case-insensitively** (`common.yaml`, `x-ticvai-unique`; ADAM CR-079, CHG-IDR-003):
            `ADMIN` and `admin` are one code, and the second is the duplicate. The code is kept as it was
            typed.

