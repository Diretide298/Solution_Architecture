        two share a booking**, which is the case that makes this harder than a table dump.


        **The orders and entitlements it lists come from Identity''s own projection** (ADAM CR-084, decided
        14 October 2026, CHG-GDL-002): `identity.subject_holding` (`SubjectHolding`), kept from the order and
