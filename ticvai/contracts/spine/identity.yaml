            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: 'One problem type per cause (14 October 2026, CHG-CRD-001, ADAM CR-078; common.yaml `Problem`):
            `current-credential-wrong`, `currentCredential` does not match the stored hash (a 422, not a 401, because
            the session is valid and stays signed in; the attempt counts towards the lockout);
            `policy-not-met`, the new credential fails the policy (a password: `minLength`, the breach check; a PIN:
            not exactly `PasswordPolicy.pinLength` digits), with `errors[]` naming the rule;
            `credential-reused`, it matches the current one or one the policy keeps (a password: the previous
            `PasswordPolicy.reusePreventionCount`, 5 unless the tenant sets another, audit R132; a PIN:
            `PasswordPolicy.pinReusePrevention`). The server keeps a hash of each replaced credential in
            `identity.principal_credential_history` for that purpose and never the credential itself.

            '
          x-ticvai-problem-types:
          - current-credential-wrong
          - policy-not-met
          - credential-reused
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
