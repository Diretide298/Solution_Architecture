    served: [in-process]
  subjectRecords:
    module: identity
    table: pii.subject
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The pii.subject rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {type: object, description: 'A pii.subject row: the columns handoff/schema-reference.json lists for it.'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its pii.subject rows, as it stores them and as the caller's scope lets it
