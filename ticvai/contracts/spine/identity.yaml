          description: The decision, with its reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /authorisation-policies/bundle:
    get:
      operationId: getAuthorisationPolicyBundle
      summary: The policies a device needs to decide for itself
      description: '3.3.28 and 3.3.30. **Caching and offline evaluation are the same mechanism at two
        durations.** A signed, versioned bundle of the policies relevant to this device and scope, with a
        validity window — so a device that loses the network keeps deciding, and stops deciding when
        the bundle expires rather than drifting indefinitely.

        **Staff permissions only** (ADR-0068, 1 October): what a staff principal may do on the device, such
        as a supervisor authorising an override at a gate. Whether a guest may pass the gate is decided from
        access''s `getOfflinePackage`, which carries the active admission policy version.

        **Expiry is the safety property.** A cached policy with no end date is a policy that outlives its
        own revocation.

