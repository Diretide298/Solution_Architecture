paths:
  /internal/step-up/verify:
    post:
      operationId: verifySupervisorStepUp
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-auth: service
      summary: Verify a supervisor's PIN step-up for another deployable
      description: '**The `service` route of the `verifySupervisorStepUp` query** (14 October 2026, CHG-CRD-004, ADAM
        CR-078; ADR-0055 rule 4). Nine operations take a `SupervisorStepUp` and the rule says the server checks the PIN
        against the principal, but the PIN is Identity''s and two of those operations (`recountStockCount`,
        `closeTransferShort`) run in the `operations` deployable, which may not read `identity.*`. They call this,
        cell-internal over mTLS, before they write; the `commerce` operations call the same query in-process.


        **Answers, never decides.** It returns whether the step-up holds and, when it does not, why; the asking
        operation answers its own caller 403 `supervisor-step-up-refused` and writes nothing. A wrong PIN is counted
        against the supervisor''s `pin` credential (`PrincipalCredential.failedAttempts`, `pinLockoutAfterAttempts`),
        which is the only thing this operation writes. The PIN is never logged, stored or echoed.

        '
      tags:
      - identity
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorStepUpCheck'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The verdict. `verified` false is a normal answer, not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorStepUpVerdict'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: The calling workload's token is missing or invalid (`unauthenticated`).
          x-ticvai-problem-types:
          - unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /internal/consent-identifiers:
    post:
      operationId: recordConsentIdentifier
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-auth: service
      summary: Keep the IP address and user agent a cookie decision was made from
      description: '**The owner''s write of `pii.consent_identifier`** (14 October 2026, CHG-XDW-004; ADR-0055 rule
        4). The two values are personal data, so they live in `pii`, Identity''s schema in `commerce`, and an event
        would copy them into the outbox; this writes no event. `marketing-crm.recordDeviceConsent` (in `operations`) calls this,
        cell-internal over mTLS, after it has recorded the decision and only where the published banner design has
        `recordIpAddress` on, with the `Idempotency-Key` it was called with. Erasure reaches the row with the rest
        of `pii`; the decision itself, which `recordDeviceConsent` keeps, survives as evidence without it.

        '
      tags:
      - identity
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentIdentifierCapture'
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Kept.
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: The calling workload's token is missing or invalid (`unauthenticated`).
          x-ticvai-problem-types:
          - unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /internal/guest-subjects/{subjectId}/details:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      operationId: updateGuestSubjectDetails
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-auth: service
      summary: Correct a guest's own name and language on their subject
      description: '**The owner''s write of `pii.subject`** (14 October 2026, CHG-XDW-005; ADR-0055 rule 4). A guest
        correcting their own details calls `marketing-crm.updateMyProfile` (in `operations`); the name and
        language are personal data in `pii.subject`, Identity''s, in `commerce`, and an event would copy them into
        the outbox; this writes no event. `updateMyProfile` calls this, cell-internal over mTLS, with the guest''s own
        `subjectId` from their session and the `Idempotency-Key` it was called with, and writes the rest of the
        profile itself. Only the fields sent change. An erased subject (`is_erased`) is not found.

        '
      tags:
      - identity
      x-ticvai-permission: null
      x-ticvai-scope-level: subject
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSubjectDetailsUpdate'
      responses:
        '204':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Updated.
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: The calling workload's token is missing or invalid (`unauthenticated`).
          x-ticvai-problem-types:
          - unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /internal/guest-sessions/end-for-device:
    post:
      operationId: endGuestDeviceSessions
      security:
      - serviceAuth: []
      x-ticvai-audience:
      - service
      x-ticvai-auth: service
      summary: Sign a guest's revoked device out
      description: '**The owner''s end of a guest''s sessions on one device** (14 October 2026, the lead''s decision on
        ticket 27741: revoking a guest device also signs that device out; CHG-MOD-009; ADR-0055 rule 4).
        `marketing-crm.revokeGuestDevice` (in `operations`) calls this, cell-internal over mTLS, after it has revoked
        the device row, with the guest''s own `subjectId` from their session, the device''s `installationId` as
        `deviceId`, and the `Idempotency-Key` it was called with. The guest sessions live in Identity''s session
        registry (`GuestSession`, `identity.guest_session`), in `commerce`.


        **What ends**: every live session of that subject whose sign-in named this `deviceId` (the app sends its
        `installationId` as `deviceId` on `verifyGuestOtp`, `guestPasswordLogin`, `guestSocialLogin` and
        `guestUaePassLogin`), and the refresh token each holds (`TokenPair.refreshToken`), so the device''s next
        `refreshToken` call is `401` and its access token is refused at its next request (the session registry is
        read on every request). Sessions of the same guest on other devices stay. Nothing to end is not an error:
        `endedSessions` is 0, and a repeat of the same call ends nothing more.

        '
      tags:
      - identity
      x-ticvai-permission: null
      x-ticvai-scope-level: subject
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestDeviceSessionsEnd'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: The device's sessions ended (none, if it had none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestDeviceSessionsEnded'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: The calling workload's token is missing or invalid (`unauthenticated`).
          x-ticvai-problem-types:
          - unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /auth/login:
    post:
      operationId: login
      x-ticvai-consumed-by:
        - "P04 POS-000 Sign In"
        - "P06 EMP-001 Sign in"
        - "P07 SCN-001 Sign in"
        - "P09 ADM-001 Platform Login / MFA"
        - "P10 PTR-001 Partner Login / MFA"
        - "P12 SUP-001 Venue Management Sign In"
      x-ticvai-audience:
      - anonymous
      - partner
      tags:
      - identity
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      summary: Authenticate and open a session
      description: 'One sign-in for every staff and partner door. **A browser door sends no
        `workstationId`** (the TICVAI Console ADM-001, Venue Management SUP-001, the partner portal
        PTR-001): a desk browser is not a registered device, and requiring one locked every web door
        out (CHG-DOOR-001, Chinmay, 2 October 2026: fix the Block A blockers now). **A device door
        sends it** (the till POS-000, the staff handheld EMP-001, the scanner SCN-001), and a
        device-bound `method` (`pin`, `card`, `rfid`) without it is refused 400 (problem type
        `workstation-required`), because the device is what bounds a PIN. Nothing else about the
        sign-in changes: the second factor is asked by permission (audit R135), five wrong codes lock
        step-up (R126), a second sign-in is refused 409 (R184), and several roles mean a role prompt
        (ADR-0003). Where the tenant has SSO, the same doors offer `startSsoAuthorization` /
        `completeSsoAuthorization`, which return the same `LoginResponse`.

        **The credential is checked against `identity.principal_credential`** (`PrincipalCredential`, 14 October 2026,
        CHG-CRD-001, ADAM CR-078): the row for the principal and `method`, its PHC hash (ADR-0071), and its lockout.
        A wrong password or PIN adds to `failedAttempts`; at `PasswordPolicy.lockoutAfterAttempts` (password) or
        `pinLockoutAfterAttempts` (PIN) the method is locked until `lockedUntil`, and a locked method is refused 429
        `credential-locked` without the credential being checked. A PIN must be `PasswordPolicy.pinLength` digits.
        **A principal provisioned by single sign-on** (`Principal.ssoProviderId`) has no local password: a `password`
        sign-in, or a `pin` sign-in before `resetPrincipalCredential` has issued a PIN, is refused 401
        `sso-sign-in-required`, and the door offers `startSsoAuthorization`. A temporary
        credential (`Principal.mustChangeCredential`) signs in with `LoginResponse.mustChangeCredential` true.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: 'Authenticated. When the user holds exactly one role the response is complete.
            When the user holds several, `requiresRoleSelection` is true and `availableRoles` is populated
            — the caller must call /auth/select-role before the session becomes usable.

            **When `requiresMfa` is true the session is not usable until the second factor is presented**
            (decided 28 September, audit R135): the client calls `createMfaChallenge` with `action: signIn`,
            then `verifyMfaChallenge`. A principal with `requiresMfa` and no active method
            (`hasMfaMethod: false`) may only enrol one (`enrolMfaMethod`, `verifyMfaEnrolment`) before that.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: 'The username and credential do not match (`unauthenticated`; one answer for an unknown
            username and a wrong credential), or the principal signs in only through the tenant''s single sign-on
            (`sso-sign-in-required`, 14 October 2026, CHG-CRD-001): `detail` names the provider so the door can offer
            `startSsoAuthorization`.'
          x-ticvai-problem-types:
          - unauthenticated
          - sso-sign-in-required
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          x-ticvai-problem-types: [session-active-elsewhere, workstation-in-use]
          description: 'An active session already exists for this principal on another device. Per §3.1.3
            the new login is refused. A supervisor with the SESSION_FORCE_LOGOUT permission may terminate
            the existing session. **The same holds on a till somebody else is signed in to**: the sign-in
            is refused until a supervisor ends the other session with `forceLogout`; signing in never ends
            it (confirmed 28 September, audit R184).

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          description: 'The request budget is exceeded (`rate-limited`), or this principal''s password or PIN is
            locked after too many wrong attempts (`credential-locked`, 14 October 2026, CHG-CRD-001):
            `PrincipalCredential.lockedUntil` is in the future, and `Retry-After` says when it ends. The lock is
            temporary (`PasswordPolicy.lockoutMinutes`) and per method: a locked PIN leaves a password sign-in open.'
          x-ticvai-problem-types:
          - rate-limited
          - credential-locked
          headers:
            Retry-After:
              $ref: '../shared/common.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /auth/guest/verify-email:
    post:
      operationId: verifyGuestEmail
      x-ticvai-consumed-by:
        - "P01 WEB-013 Booking Confirmation"
        - "P01 WEB-020 Profile & Preferences"
        - "P02 GST-010 Booking Confirmation"
        - "P02 GST-073 Security & Sign-in"
      x-ticvai-write-via:
      - table: marketing.message_dispatch
        operation: sendTransactionalMessage
      security:
      - guestAuth: []
      - {}
      summary: Send a verification link, or consume one
      description: '**Raised in review by Deep.** `registerGuest` creates an account and nothing verifies
        the address on it — and **a guest account with an unverified email can receive somebody else''s
        tickets**, because a transfer is offered to an address.

        Two modes on one operation: **`send` issues a single-use token; `confirm` consumes it.** One operation
        because they are one act with two halves, and splitting them invites a `confirm` that works without
        a `send`.

        **An unverified account does not buy — decided 17 September 2026**, replacing *unverified accounts
        still buy*, which this description said while `registerGuest` and `GuestSession.isVerified` said
        the opposite. Tickets go to an address, and an unproven address is how somebody receives a
        stranger''s tickets.

        **On the guest web and the guest app, the site''s `guestCheckout` feature decides the route**
        (requirement matrix 2.6.28 and 2.6.67 — guest checkout, configurable per site). It is **off by
        default**.

        **The gate is the checkout page, not the cart** ([ADR-0045](../../docs/adr/0045-every-order-carries-a-proven-contact.md),
        18 September 2026, matrix 2.6.1 §2.4: *"On the check out page, users can log in or manually
        fill in the following details"*). The cart is open to anyone; `checkoutCart` refuses until one
        of the two routes has completed.

        - **Off:** the guest signs in, verified, at checkout. `WEB-011` and `GST-041` carry the fork.

        - **On:** the guest may check out without an account, and proves the email or mobile the tickets
        go to with a one-time code at checkout (`requestGuestOtp`, purpose `verify`) — the *dual OTP
        validation* of the reference checkout the client walked through.

        **Both routes produce a guest profile**, because the tickets have to go somewhere and the order
        has to belong to something. **A one-time checkout profile carries no credential** — recalling
        previous transactions needs access set up separately (matrix 2.6.29), which is what
        `linkGuestCheckout` does from the other direction.

        **A returning verified contact attaches to the profile already held** (matrix 22.2.8) — the new
        order, its tickets and its history, automatically, with no duplicate record. **It does not open
        that profile.** The guest sees the order just placed and nothing earlier until they authenticate
        as its owner: a code proves someone controls the mailbox today, which is enough to route a ticket
        there and not enough to hand over a history. **Any match that is not a verified contact** —
        passport, national id, an unproved phone, a similar name — **is a suggestion for the staff review
        of matrix 7.3.7**, with its audit log and rollback. A merge takes the narrower of two consents
        (CF-160).

        **The kiosk is exempt.** A walk-up pays at the kiosk and takes printed tickets, so there is no
        address to prove (matrix 2.1.10). An unverified account also cannot *receive a transfer* or
        *reset a password*, for the same reason.

        '
      tags:
      - identity
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      - anonymous
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - send
                  - confirm
                token:
                  type: string
                  nullable: true
                  description: 'For `confirm`. **Single use and short-lived** — a verification link that
                    works forever is a verification link in an old inbox. **Valid for 24 hours and sent by
                    email only** (decided 28 September, audit R126); after that `confirm` answers `410`
                    and `send` issues a new one.

                    '
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Sent, or verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVerified:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
        '410':
          x-ticvai-problem-types: [verification-token-expired, verification-token-used]
          description: '**The token expired or was already used.** Distinct from an invalid one — a guest
            who clicked an old link should be offered a new one rather than told they are wrong.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /password-policy:
    get:
      operationId: getPasswordPolicy
      x-ticvai-consumed-by:
