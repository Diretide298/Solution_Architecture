        CR-100; CHG-R10ID-009; BC-482). A read never issues or rotates a token, so it stays a read and stays
        offline-capable; `GuestSession` (a sign-in''s answer) is this plus `tokens`.'
      required:
      - subjectId
      - isVerified
      - expiresAt
      properties:
        subjectId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        isVerified:
          type: boolean
          description: 'False until an OTP or a verified provider identity confirms ownership. An unverified
            account may browse and fill a cart but not transact: the gate is the checkout page
            (ADR-0045), where `checkoutCart` refuses it until the guest verifies or proves the contact by
            code. UAE Pass returns a verified identity, so it starts true. Rule on `verifyGuestEmail`,
            decided 17 September 2026.

            '
        identityProviders:
          type: array
          description: Linked providers. Several may resolve to one account. Read from `pii.subject_identity`
            (apple, google, uaePass), `identity.guest_credential` (password) and a verified contact (otp) (CHG-R8MIG-015).
          items:
            type: string
            enum:
            - password
            - otp
            - apple
            - google
            - uaePass
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells (ADR-0010).
        requiresMfa:
          type: boolean
          default: false
          description: >
            True only where the sign-in venue enabled guest two-step verification
            (`VenueSettings.identity.guestTwoStep`, in tenancy) and this guest has an active method
            (decided 29 September, rev 3 GAP-B1, per venue). The session is then
            not usable until `verifyMfaChallenge` succeeds on a `signIn` challenge. Always false for a UAE
            Pass sign-in, which is already a verified two-factor identity (proposed, client to correct).
        mfaMethods:
          type: array
          description: The guest's active methods, so the client can offer the right one. Empty when
            `requiresMfa` is false.
          items:
            $ref: '#/components/schemas/MfaMethod'
        homeCellName:
          type: string
          nullable: true
        preferredLanguage:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          description: '**30 days, sliding** (decided 28 September, audit R126 (2)): each use of the session
            moves this to 30 days from now, and 30 days unused ends it. **One session per device**: a guest
            may be signed in on a phone and a laptop at once, and a new sign-in on the same `deviceId` ends
            that device''s previous session.

            '
    ChangeCredentialRequest:
      type: object
      description: 'Request only. The credential itself is stored hashed in `identity.principal_credential`
        (`PrincipalCredential`, CHG-CRD-001) and is never returned by any operation (`handoff/schema-storage-only.md`).

        '
      required:
      - method
      - currentCredential
      - newCredential
      properties:
        method:
          type: string
          enum:
          - password
          - pin
          description: Which credential is being changed (`PrincipalCredential.method`). Card, RFID and SSO are not
            secrets the principal holds, so they are not changed here.
        currentCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-persisted: false
          description: Compared with the current `credentialHash` and never stored. A wrong one is 422
            `current-credential-wrong`, and counts towards the lockout like a wrong sign-in.
        newCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-stored-as: identity.principal_credential.credential_hash
          description: Stored as the new `credentialHash` (a PHC string, ADR-0071); the replaced hash moves to
            `identity.principal_credential_history`. A PIN is digits only, exactly `PasswordPolicy.pinLength` long.
    ResetCredentialRequest:
      type: object
      description: Request only; see `ChangeCredentialRequest`.
      required:
      - method
      - temporaryCredential
      - reason
      properties:
        method:
          type: string
          enum:
          - password
          - pin
        temporaryCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-stored-as: identity.principal_credential.credential_hash
          description: Issued to the principal out of band. Must be changed at next sign-in. Stored as the
            `credentialHash` of the principal's row for `method` (ADR-0071), and `Principal.mustChangeCredential`
            is set (CHG-CRD-001).
        reason:
          type: string
          minLength: 3
          maxLength: 500
    PasswordPolicy:
      type: object
      x-ticvai-persistence: identity.password_policy
      # CHG-R6G-008: written at tenant, read beneath it: a venue's createPrincipal, forceLogout and
      # resetPrincipalCredential hold the PIN and password they set or check to the tenant's policy.
      x-ticvai-rls: read-beneath
      description: 'BL-144. **Written by `setPasswordPolicy`, which returns it**, at tenant scope. Before BL-144
        the package had no password policy, no lockout and no forced change at first logon anywhere.

        **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition, and forced rotation
        on a schedule makes passwords worse — people increment a digit. Rotation is here because some
        tenants are contractually required to have it, **not because it helps.**

        '
      required:
      - id
      - scopePath
      - minLength
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server. Required in the response only; ignored if a request sends it.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005), written by the server from the caller''s tenant
            (`x-ticvai-config-scope: tenant`). Required in the response only; ignored if a request sends it.'
        minLength:
          type: integer
          default: 12
          minimum: 8
          description: A tenant may raise the length and never set it below 8 (decided 28 September, audit
            R126 (7)). **A password rule**; a PIN's length is `pinLength` (CHG-CRD-002).
        requireBreachCheck:
          type: boolean
          default: true
          description: '**The single most effective rule.** Refusing a password known to be breached stops
            more account takeovers than every composition rule combined.


            **Where the breach list comes from** (decided 20 October 2026, Chinmay, R8 blocker cause IDENTITY-C06,
            option B; CHG-R8SPN-019; audit R117). A local corpus file shipped with each release: the SHA-1 hashes of
            known breached passwords, sorted and indexed by their first five hex characters, held inside the region
            with the service and never sent anywhere, so no credential hash leaves the region and there is no
            outage mode. Identity reads it through one adapter, `checkPasswordBreached(passwordSha1Prefix)`, which
            returns the corpus''s full hashes under that prefix with their counts; the service compares the full
            hash itself. A match refuses the password `422 policy-not-met` (`changeOwnCredential`, and any
            other operation that sets a password under this policy). The corpus is refreshed with the release, not at run
            time. The client may still name a vendor under R117, which would be a second adapter behind the same
            interface (handoff/integration-register.md row 20).

            '
        maxAgeDays:
          type: integer
          nullable: true
          description: '**Null is the recommended value.** Forced rotation produces `Summer2026!` becoming
            `Summer2027!`, and it is offered because some tenants are contractually obliged to have it
            rather than because it works.

            '
        recoveryMethods:
          type: array
          description: 'BL-132. **A guest locked out had no path back** — lockout existed and recovery
            did not, which turns a forgotten password into a support call.

            **Ordered by strength, and the venue chooses which it offers.** Email is weakest and universal;
            a verified phone is stronger; an in-person check at a desk is strongest and only available
            to a guest who is already at the venue.

            '
          items:
            type: string
            enum:
            - email
            - sms
            - securityQuestions
            - inPersonVerification
            - supportAssisted
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: 'BL-145. **Null, and that is the decision.** A staff principal has one live session,
            full stop: ADR-0004 keeps a server-side session registry (the `sid` claim, `ActiveSession`), and
            §3.1.3 refuses a second sign-in rather than counting towards a limit (confirmed 28 September,
            audit R184). A number here would only ever mean 1.

            The requirement asked for it configurable. **Configurable to null is still an answer.**

            '
        deviceRestriction:
          type: object
          nullable: true
          description: 'BL-146. **Device, browser, IP and location restriction on access.** Applies to
            staff principals, not guests — a guest restricted to one device is a guest who cannot use
            their new phone.

            **Warn before block by default.** An IP restriction that blocks silently is a venue manager
            locked out on the day their ISP rotates an address.

            '
          properties:
            allowedIpRanges:
              type: array
              items:
                type: string
            allowedCountries:
              type: array
              items:
                type: string
            requireRegisteredDevice:
              type: boolean
              default: false
            onViolation:
              type: string
              enum:
              - warn
              - requireStepUp
              - block
              default: requireStepUp
        lockoutAfterAttempts:
          type: integer
          default: 10
          description: Wrong passwords before a staff password is locked for `lockoutMinutes`, counted in
            `PrincipalCredential.failedAttempts` (14 October 2026, CHG-CRD-001). A guest's in
            `GuestCredential.failedAttempts`. A PIN counts against `pinLockoutAfterAttempts`.
        lockoutMinutes:
          type: integer
          default: 15
          description: '**A temporary lockout, not a permanent one.** Permanent lockout on failed attempts
            is a denial-of-service anybody can run against a known username.

            '
        forceChangeOnFirstLogon:
          type: boolean
          default: true
        reusePreventionCount:
          type: integer
          default: 5
          minimum: 0
          maximum: 24
          description: '**How many previous passwords a staff member may not reuse** — the last 5 unless
            the tenant sets another (decided 28 September, audit R132). `changeOwnCredential` refuses a
            match with `422` `credential-reused`. **Passwords only**: a PIN follows `pinReusePrevention`
            (14 October 2026, CHG-CRD-002).

            '
        pinLength:
          type: integer
          enum: [4, 6, 8]
          default: 4
          x-ticvai-persistence-column: integer
          description: '**How many digits a staff PIN has, chosen by the tenant from a drop-down** (decided by
            Chinmay, 14 October 2026, ADAM CR-078: "Give those as options that they select as a drop down";
            CHG-CRD-002). The package does not fix the PIN rule; the tenant picks 4, 6 or 8. Every PIN keypad
            (POS-000, EMP-001, SCN-001 and the supervisor step-up prompts) takes exactly this many digits, read from
            `WorkstationContext.pinLength`; `changeOwnCredential` and `resetPrincipalCredential` refuse a PIN of
            another length (422 `policy-not-met`). **Raising it does not invalidate PINs already set**: a shorter PIN
            still signs in, and its holder is asked for a new one (`mustChangeCredential`) at the next sign-in.
            `minLength`, `requireBreachCheck` and the R126 floor are password rules and never apply to a PIN, which
            is valid only on a registered workstation.'
        pinReusePrevention:
          type: string
          enum: [none, last3, last5]
          default: last5
          description: '**Whether a new PIN may repeat an old one, chosen by the tenant from a drop-down** (decided
            by Chinmay, 14 October 2026, ADAM CR-078; CHG-CRD-002): `none` lets a PIN be reused, `last3` and `last5`
            refuse the current PIN and the previous 3 or 5 (422 `credential-reused`), read from
            `identity.principal_credential_history`. Audit R132 asked for reuse prevention on passwords and stays
            there (`reusePreventionCount`); for PINs it is this setting. The default keeps what the sign-in screens
            promised (the last five).'
        pinLockoutAfterAttempts:
          type: integer
          enum: [3, 5, 10]
          default: 5
          x-ticvai-persistence-column: integer
          description: '**Wrong PINs before the PIN is locked, chosen by the tenant from a drop-down** (decided by
            Chinmay, 14 October 2026, ADAM CR-078; CHG-CRD-002). At this many consecutive wrong PINs (at sign-in,
            in `changeOwnCredential`, or as a supervisor''s step-up PIN) `PrincipalCredential.lockedUntil` is set to
            now plus `lockoutMinutes`. A password counts against `lockoutAfterAttempts` instead.'
        mfaRequiredForPermissions:
          type: array
          description: '**Step-up rather than blanket MFA.** Requiring it for a refund approval and not
            for reading a rota is what stops people sharing devices to avoid it.

            **MFA is required by permission, not by role** (decided 28 September, audit R135). A principal
            holding any permission listed here must keep an active method (`removeMfaMethod` refuses to
            remove the last one). **The default is the platform floor**: `ROLE_MANAGE`, `LEDGER_APPROVE`
            and every `PLATFORM_*` permission. A tenant may add to the list and never remove a floor entry;
            a body that drops one is refused `400`.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
          default:
          - ROLE_MANAGE
          - LEDGER_APPROVE
          - PLATFORM_TENANT_VIEW
          - PLATFORM_TENANT_MANAGE
          - PLATFORM_TENANT_TERMINATE
          - PLATFORM_TENANT_ACCESS
          - PLATFORM_PLAN_MANAGE
          - PLATFORM_CELL_VIEW
          - PLATFORM_CELL_MANAGE
          - PLATFORM_BILLING_VIEW
          - PLATFORM_BILLING_MANAGE
          - PLATFORM_RELEASE_VIEW
          - PLATFORM_RELEASE_MANAGE
          - PLATFORM_RELEASE_PROMOTE
          - PLATFORM_MIGRATION_VIEW
          - PLATFORM_MIGRATION_APPLY
          - PLATFORM_AI_MANAGE
        accessTokenMinutes:
          type: integer
          default: 15
          minimum: 5
          maximum: 60
          description: 'How long a staff access token lives (`TokenPair.expiresIn`). **15 minutes, proposed, client
            to correct** (decided 20 October 2026, Chinmay, IDENTITY-C25; CHG-R8SPN-014). Staff tokens only; a
            guest token follows `guestAuth`.'
        refreshTokenHours:
          type: integer
          default: 12
          minimum: 1
          maximum: 24
          description: 'How long a staff refresh token lives without use. Sliding: each refresh issues a new one
            and retires the old, and a retired one presented again ends the session and revokes its family (see
            `bearerAuth`). **12 hours, proposed, client to correct** (IDENTITY-C25; CHG-R8SPN-014).'
        sessionMaxHours:
          type: integer
          default: 12
          minimum: 1
          maximum: 24
          description: 'The longest a staff session lives (`Session.expiresAt`). A till session ends sooner, when
            the shift on its workstation closes. **12 hours, proposed, client to correct** (IDENTITY-C25;
            CHG-R8SPN-014).'
    SegregationViolation:
      type: object
      x-ticvai-persistence: none — computed from identity.grant against identity.segregation_rule
      description: 'BL-110, 3.3.31, 3.3.38. **One principal currently holding both halves of a
        rule.**

        **Computed rather than stored.** A violation row that survived the grant behind it would be
        a queue item nobody could close, and a compliance queue that cannot reach zero is one
        people stop opening.

        '
      required:
      - ruleId
      - principalId
      - permissionA
      - permissionB
      properties:
        ruleId:
          type: string
          format: uuid
        ruleName:
          type: string
        severity:
          type: string
          enum:
          - block
          - requireApproval
          - warn
          description: '**From the rule.** A `warn` violation and a `block` violation are the same
            finding with very different urgency, and a queue that does not carry it sorts by
            nothing useful.

            '
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        atScopePath:
          type: string
          nullable: true
          description: '**Where the two overlap**, and the field that makes a finding actionable:
            the answer is usually to narrow one grant rather than to remove it.

            **Null where the rule is not `scopeSensitive`**, which is the estate-wide case.

            '
        compensatingControlNoted:
          type: boolean
          default: false
          description: '**True where `allowWithCompensatingControl` covers this one.** Flagged
            rather than filtered out — a small venue that cannot separate duties is a fact somebody
            accepted, and it should stay visible rather than disappearing from the count.

            '
        detectedAt:
          type: string
          format: date-time
          description: When the principal came to hold both halves, the latest of the moments that made the pair
            (a grant's `createdAt`, a role permission's `grantedAt`, a module-access change); the list's order
            (14 October 2026, ADAM CR-077; CHG-IDR-002).

    ModuleCapability:
      type: object
      x-ticvai-persistence: none — derived from contracts/shared/permissions.yaml and every contract
      description: >
        BL-110. **One tickable thing a person can be allowed to do in a module.** Derived rather
        than authored, so an operation added with a permission appears on the right checklist by
        existing rather than by somebody remembering.
      required:
      - key
      properties:
        key:
          type: string
          description: >
            **The permission string, and the only vocabulary there is.** `roles.yaml` holds 44
            lowercase keys sharing none of these; that file is a saved tick-set for the POS
            surface which was mistaken for the alphabet, and it becomes a `CapabilityTemplate`.
        label:
          type: string
          nullable: true
          description: >
            **Null where the permission has no description yet, and the client renders the key.**
            72 of them are in that state. **A generated sentence would read like a label and mean
            nothing** — and a checklist item nobody understands is ticked anyway, which is worse
            than one that visibly needs explaining.
        group:
          type: string
          nullable: true
          description: The heading it sits under in the vocabulary — Selling, Access control, Shift
            and cash. **How a checklist of forty items stays readable.**
        operationCount:
          type: integer
          description: >
            **How much this tick actually grants.** A capability behind ninety operations and one
            behind two are different decisions, and the number is the only honest way to say so on
            a screen.
        elevated:
          type: boolean
          default: false
          description: >
            **Derived: at least one operation behind it declares `x-ticvai-step-up`.** Not a rank
            and not a judgement about the name — the operation already said it needs a second
            factor. Ticking one raises an approval rather than taking effect.
        segregationConstrained:
          type: boolean
          default: false
          description: >
            **Named in a `SegregationRule`.** Ticking it may conflict with something the principal
            already holds, and `setPrincipalModuleAccess` answers 409 rather than letting it
            through.

    ModuleCapabilitySet:
      type: object
      description: BL-110. One module and everything a person could be allowed to do in it.
      properties:
        module:
          type: string
        title:
          type: string
        unguardedOperations:
          type: integer
          description: >
            **Operations in this module that carry no permission, and so appear on no checklist.**
            94 across the package — guest-facing, service-to-service or self-scoped. Stated
            because a checklist that silently omits a third of a module reads as complete.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModuleCapability'

    ModuleAccess:
      x-ticvai-persistence: identity.module_access
      type: object
      description: >
        BL-110. **What one principal may do in one module, at one scope.** The unit the grant
        screen writes and reads back unchanged.
      required:
      - module
      - scopePath
      - capabilities
      properties:
        principalId:
          type: string
          format: uuid
          readOnly: true
        module:
          type: string
        scopePath:
          type: string
          description: >
            **Where, and it is half the grant** (ADR-0018). A capability means nothing until it is
            held at a scope containing the thing it acts on — holding `ORDER_REFUND` at one venue
            is not holding it at another, and the checklist is per scope for that reason.
        capabilities:
          type: array
          items:
            type: string
          description: >
            **Permission keys, ticked.** The complete set for this module and scope: what is
            absent is not granted, which is what makes the write replaceable and the read
            verifiable.
        appliedTemplate:
          type: string
          nullable: true
          description: >
            **Which saved tick-set this was copied from, for the record only.** It is not a
            binding: the ticks are the grant, and editing the template afterwards changes nothing
            here. A grant that silently follows a template is a grant nobody can audit at a point
            in time.
        grantedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        grantedAt:
          type: string
          format: date-time
          readOnly: true

    CapabilityTemplate:
      x-ticvai-persistence: identity.capability_template
      # CHG-GEN-005: presets sit at the tenant's path; a venue's ROLE_MANAGE reads them to build a role (CR-076).
      x-ticvai-rls: read-beneath
      type: object
      description: >
        3.3.23, BL-110. **A named tick-set — a role, with nothing depending on the name.**
      required:
      - code
      - name
      - capabilities
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        module:
          type: string
          nullable: true
          description: '**The module a per-module preset belongs to** (a contract name, as
            `listModuleCapabilities`; CHG-CSP-003). Null for a template that spans modules, such as the
            Cashier starting configuration.

            '
        presetLevel:
          type: string
          nullable: true
          enum:
          - all
          - viewer
          - midLevel
          description: '**Which of the three per-module presets this is** (decided 2 October 2026, Chinmay;
            DEC-007; CHG-CSP-003): All, Viewer or Mid-level. Null on a template a tenant saved itself and on
            a cross-module starting configuration.

            '
        isPreset:
          type: boolean
          default: false
          readOnly: true
          description: '**Seeded by the platform, not saved by the tenant** (CHG-CSP-003). A preset is offered
            when a role is created and cannot be deleted; a tenant saves its own tick-sets beside them with
            `setCapabilityTemplate`.

            '
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Written by the server at `tenant` scope; ignored
            if a request sends it.'

    SegregationRule:
      type: object
      x-ticvai-persistence: identity.segregation_rule
      # CHG-GEN-005: rules sit at the tenant's path; a venue's createRole and grant checks read them (CR-076).
      x-ticvai-rls: read-beneath
      description: 'BL-147, 3.3.31 and 11.1.24. **The package enforced segregation of duties in exactly
        one place** — the product lifecycle guard requiring the approver not be the author — and there
        was no general rule.

        **A conflict is between two permissions held by one principal**, and the check runs at grant time
        rather than at use time: **discovering the conflict when somebody exercises it means the conflict
        already existed.**

        '
      required:
      - id
      - permissionA
      - permissionB
      - severity
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server. Required in the response only; ignored if a request sends it.
        name:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        severity:
          type: string
          description: '**What each severity does** (decided 14 October 2026, ADAM CR-079; CHG-IDR-003). `block`
            refuses, with `409 segregation-breach`, a role set (`createRole`, `setRolePermissions`, including a
            parent role''s edit that would breach in a role inheriting it) and a grant (`createDelegatedAccess`,
            `createPrincipal` with `roleIds`, `setPrincipalModuleAccess`) that would hold both permissions.
            `requireApproval` and `warn` refuse nothing: the role or grant is saved, and every principal left
            holding both appears in `listSegregationViolations` with this severity.


            **Role time and grant time differ only in scope.** A role''s own and inherited permissions are one
            set granted at one scope, so at role time every rule applies whatever `scopeSensitive` says; at grant
            time a `scopeSensitive` rule conflicts only where the two grants'' scopes overlap.

            '
          enum:
          - block
          - requireApproval
          - warn
        rationale:
          type: string
          description: '**Why these two conflict, in words an auditor reads.** A rule with no rationale
            is a rule somebody removes when it becomes inconvenient.

            '
        scopeSensitive:
          type: boolean
          default: true
          description: '**Whether the two permissions must overlap in scope to conflict**, and this
            is not `scopePath` below — that one is the partition key and says where the rule *row*
            lives (ADR-0005), not where the *conflict* applies.

            **True, and it should rarely be false.** `ACCREDITATION_ISSUE` at Yas Island beside
            `ACCREDITATION_MANAGE` at Warner Bros is two jobs at two sites; flagging it is a
            control crying wolf, and the first thing a venue does with one of those is switch it
            off. The comparison walks `scopePath` prefixes the same way `resolvePermissions`
            already does — `uae.dubai` contains `uae.dubai.marina`, so one is an overlap and two
            siblings are not.

            **False is for conflicts that are genuinely estate-wide**, such as holding both sides
            of a financial reconciliation anywhere at all.

            '
        allowWithCompensatingControl:
          type: boolean
          default: false
          description: '**A small venue cannot always separate duties**, and pretending otherwise means
            the rule gets disabled entirely. A named compensating control is better than no rule.

            '
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope**; the server sets it and ignores it in a request.'
    RegisterGuestRequest:
      type: object
      required:
      - identifier
      properties:
        identifier:
          type: string
          maxLength: 256
          description: Email address or mobile number in E.164.
        channel:
          type: string
          enum:
