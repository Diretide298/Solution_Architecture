      description: '**How a P09 screen finds a grant already open after a reload** (decided 28 September,
        audit R098). Callable with `PLATFORM_TENANT_ACCESS`, the permission that opens a grant, so the
        operator needs no tenant grant to read it; `listPlatformStaffGrants` needs `AUDIT_VIEW`, which
        the operator only has if a grant carries it. Returns only grants whose `operatorPrincipalId` is
        the caller, most recent first: **ordered by `openedAt` descending, `id` as the tiebreak** (decided
        14 October 2026, ADAM CR-077; CHG-IDR-002).


        **The caller is the verified Control Plane token''s `sub`** (ADAM CR-175 option A; ADR-0072; CHG-R10ID-007),
        admitted as `openPlatformStaffGrant` admits it: no tenant session, no tenant principal.

