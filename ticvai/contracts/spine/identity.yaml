          description: Consecutive wrong attempts since the last correct one. Reset to 0 by a correct credential or a reset.
        lockedUntil:
          type: string
          format: date-time
          nullable: true
          description: '**A temporary lock, never a permanent one** (`PasswordPolicy.lockoutMinutes`). Until then `login`
