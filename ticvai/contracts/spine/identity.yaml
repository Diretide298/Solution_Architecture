        for: 'its read of platform.workstation, Tenancy''s data (CHG-MOD-001; R8 IDENTITY-C10)'
      - query: identity#verifySupervisorStepUp
        route: in-process
        for: 'the PIN step-up in the X-Supervisor-Principal-Id and X-Supervisor-Pin headers is checked by Identity, never by reading identity.* here (CHG-CRD-004, ADAM CR-078); same deployable (commerce): the C# query interface Identity implements, in the caller''s transaction (ADR-0055 rule 2)'
      x-ticvai-step-up-reason: On the POS-000 door nobody at the till has a session, so a supervisor's own PIN on the device authorises seeing who holds it (CHG-RUL-015; audit R184).
      x-ticvai-step-up-carrier: header:X-Supervisor-Principal-Id,X-Supervisor-Pin
