        requestId:
          type: string
          format: uuid
          x-ticvai-column: id
          description: The Approvals request id `exportSubjectData` answered with; one export per request.
        subjectId:
          type: string
          format: uuid
          x-ticvai-references: pii.subject
          description: The guest whose data is exported.
        format:
          type: string
          enum: [json, csv, pdf]
        status:
          type: string
          enum: [awaitingApproval, running, ready, failed, rejected, expired]
          default: running
          description: '`running` by default: **no matrix means it runs at once** (the lead, 25 October 2026, r10
            round 3; CHG-R10ID-024), so a row written with no approval request starts with the job running.
            `exportSubjectData` writes `awaitingApproval` where Approvals raised a request, until it is approved;
