      properties:
        principalId:
          type: string
          format: uuid
          description: The principal this credential signs in. Required; a credential that belongs to nobody is never stored.
        method:
          type: string
          enum: [password, pin]
          description: Which secret this row holds. Card, RFID and SSO are not secrets the principal holds and have no row.
        credentialHash:
          x-ticvai-secret: argon2id-phc
          type: string
          writeOnly: true
          description: '**A self-describing PHC string**, `$argon2id$v=19$m=<KiB>,t=<passes>,p=<lanes>$<salt>$<hash>`
            (ADR-0071): the algorithm and its parameters travel with the hash, so raising the parameters re-hashes at the
            next successful sign-in and never strands an old row. A PIN is hashed with the tenant''s Key Vault pepper as
            well (ADR-0071). Never the credential itself.'
        setAt:
          type: string
          format: date-time
          description: When this credential was set; `PasswordPolicy.maxAgeDays`, where a tenant sets it, counts from here.
        failedAttempts:
          type: integer
          minimum: 0
          default: 0
          description: Consecutive wrong attempts since the last correct one. Reset to 0 by a correct credential or a reset.
