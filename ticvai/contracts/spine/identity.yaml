        **`ROLE_MANAGE` must hold at the tenant root** (decided 25 October 2026, Chinmay, ADAM CR-189 option A;
        CHG-R10ID-001; the rule on `Session.permissionsByScope`), read from the per-scope set: a caller holding
        `ROLE_MANAGE` only below the root is `403`, even when it holds another permission (for example
        `REPORT_VIEW`) at the root, which puts the root among its scope paths. Nothing is written.

