    SessionStatus:
      type: string
      description: >
        **The life of one signed-in session, which is not the life of a shift.** A shift holds the
        float and survives a break; a session holds the person and does not. `ShiftStatus.suspended`
        is where a break lives — *break cover; float intact, workstation released* — and the release
        of the workstation is exactly why the session ends rather than pausing: the next person
        opens their own.

        **One principal, one active session per workstation.** Enforced by the `ActiveSession`
        registry rather than by a state, because it is a fact about the set of sessions and not
        about any one of them.
      enum:
        - active            # signed in and working; the only non-terminal state
        - signedOut         # the principal ended it themselves
        - terminated        # a supervisor ended an abandoned session somebody else needed
        - expired           # idle past the timeout; the registry dropped it and freed the workstation

    ActiveSession:
      x-ticvai-persistence: identity.session
      # ADAM CR-242, option A, accepted 26 October 2026 (CHG-R10CRF-002): an ended session always says when it ended.
      x-ticvai-null-exactly-when:
        endedAt: {status: active}
      description: '**The session record, in `identity.session`** (3 October 2026, CHG-R1S-008; the HLD/LLD
        cross-check and the r1 gate). Until then it was "none — Redis session registry", and 11 operations
        wrote a session no SQL created: nothing defined its columns, so `listActiveSessions` could not page,
        filter by workstation or venue, or run under row-level security. The row is the record of record,
        tenant-scoped and under RLS like every identity table; Redis stays the token cache in front of it
        (ADR-0004: a session is a token with a validity window, and the cache answers that check). The
        names and `hasOpenShift` are read with it, not stored.'
      type: object
      required:
      - sessionId
      - principalId
      - status
      - startedAt
      - lastSeenAt
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/SessionStatus'
          description: >
            **A registry that only holds live sessions cannot answer why one ended.** Kept on the
            record so a supervisor asking *what happened to till 4* gets `terminated` or `expired`
            rather than an absence.
        sessionId:
          type: string
          description: '**The session''s `identity.session.id`, written as text, and the key `forceLogout` takes in its
            path** (R8 blocker fix, IDENTITY-C02). A client lists sessions, picks one and passes this value as `sessionId`;
            nothing else names a session on the wire. The server opens a session with `session_id` set to its `id` as text,
            so the stored `session_id` (the token''s `sid`) and the id are one value and a lookup by either finds the row.
            It stays `type: string` here so a client built at r1 still validates; it is always a uuid, as `Session.sessionId`
            declares.'
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
          x-ticvai-persisted: false
          description: Read from `identity.principal` with the row.
        endedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the session ended; null exactly while `active`, and set on every other status (R8
            blocker IDENTITY-C46, CHG-R8MIG-015; a table CHECK since ADAM CR-242, 26 October 2026).
        endedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: identity.principal
          description: Who ended it (`forceLogout`'s caller or supervisor; the principal itself when
            `changeOwnCredential` ended its other sessions); null when the principal signed out or it expired.
        endReason:
          type: string
          minLength: 3
          maxLength: 500
          nullable: true
          readOnly: true
          description: Why it was ended, as `forceLogout` was given it (or `supervisor-takeover` from the till door, or
            `credential-changed` when `changeOwnCredential` ended it; ADAM CR-242).
        roleId:
          type: string
          format: uuid
          nullable: true
        roleName:
          type: string
          nullable: true
          x-ticvai-persisted: false
          description: Read from `identity.role` with the row.
        workstationId:
          type: string
          format: uuid
          nullable: true
        workstationName:
          type: string
          nullable: true
          x-ticvai-persisted: false
          description: Read from the workstation with the row.
        venueId:
          type: string
          format: uuid
          nullable: true
        ipAddress:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        hasOpenShift:
          type: boolean
          x-ticvai-persisted: false
          x-ticvai-derived: onRead
          description: 'Revoking this session leaves cash unreconciled. **Computed on read, from Identity''s own
            projection** (decided 20 October 2026, Chinmay, R8 blocker cause IDENTITY-C51, option A; CHG-R8SPN-036):
            true when `identity.open_shift_marker` (`OpenShiftMarker`) holds a row for this principal at this
            session''s workstation. Identity is Foundation and never reads `orders.pos_shift` (ADR-0028), so the
            marker is fed by Shift''s events, as `identity.subject_holding` is fed by Orders''. BO-053 and POS-000
            read it here; never stored on the session.'
        mfaSatisfied:
          type: boolean
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
