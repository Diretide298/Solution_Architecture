          format: date-time
          nullable: true
          description: For an entitlement, the end of its validity; null for an order.
        lastEventAt:
          type: string
          format: date-time
          description: The `occurredAt` of the event last applied to the row; an older redelivery changes nothing.
        updatedAt:
          type: string
          format: date-time
