            True only where the sign-in venue enabled guest two-step verification
            (`VenueSettings.identity.guestTwoStep`, in tenancy) and this guest has an active method
            (decided 29 September, rev 3 GAP-B1, per venue). The session is then
            not usable until `verifyMfaChallenge` succeeds on a `signIn` challenge. Always false for a UAE
            Pass sign-in, which is already a verified two-factor identity (proposed, client to correct).
        mfaMethods:
          type: array
          description: The guest's active methods, so the client can offer the right one. Empty when
            `requiresMfa` is false.
          items:
            $ref: '#/components/schemas/MfaMethod'
        homeCellName:
          type: string
          nullable: true
        preferredLanguage:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          description: '**30 days, sliding** (decided 28 September, audit R126 (2)): each use of the session
            moves this to 30 days from now, and 30 days unused ends it. **One session per device**: a guest
            may be signed in on a phone and a laptop at once, and a new sign-in on the same `deviceId` ends
            that device''s previous session.

            '
    ChangeCredentialRequest:
      type: object
      description: 'Request only. The credential itself is stored hashed in `identity.principal_credential`
        (`PrincipalCredential`, CHG-CRD-001) and is never returned by any operation (`handoff/schema-storage-only.md`).

        '
      required:
      - method
      - currentCredential
      - newCredential
      properties:
        method:
          type: string
          enum:
          - password
          - pin
          description: Which credential is being changed (`PrincipalCredential.method`). Card, RFID and SSO are not
            secrets the principal holds, so they are not changed here.
        currentCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-persisted: false
          description: Compared with the current `credentialHash` and never stored. A wrong one is 422
            `current-credential-wrong`, and counts towards the lockout like a wrong sign-in.
        newCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-stored-as: identity.principal_credential.credential_hash
          description: Stored as the new `credentialHash` (a PHC string, ADR-0071); the replaced hash moves to
            `identity.principal_credential_history`. A PIN is digits only, exactly `PasswordPolicy.pinLength` long.
    ResetCredentialRequest:
      type: object
      description: Request only; see `ChangeCredentialRequest`.
      required:
      - method
      - temporaryCredential
      - reason
      properties:
        method:
          type: string
          enum:
          - password
          - pin
        temporaryCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-stored-as: identity.principal_credential.credential_hash
          description: Issued to the principal out of band. Must be changed at next sign-in. Stored as the
            `credentialHash` of the principal's row for `method` (ADR-0071), and `Principal.mustChangeCredential`
            is set (CHG-CRD-001).
        reason:
          type: string
          minLength: 3
          maxLength: 500
    PasswordPolicy:
      type: object
      x-ticvai-persistence: identity.password_policy
      # CHG-R6G-008: written at tenant, read beneath it: a venue's createPrincipal, forceLogout and
      # resetPrincipalCredential hold the PIN and password they set or check to the tenant's policy.
      x-ticvai-rls: read-beneath
      description: 'BL-144. **Written by `setPasswordPolicy`, which returns it**, at tenant scope. Before BL-144
        the package had no password policy, no lockout and no forced change at first logon anywhere.

        **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition, and forced rotation
        on a schedule makes passwords worse — people increment a digit. Rotation is here because some
        tenants are contractually required to have it, **not because it helps.**

        '
      required:
      - id
      - scopePath
      - minLength
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server. Required in the response only; ignored if a request sends it.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005), written by the server from the caller''s tenant
            (`x-ticvai-config-scope: tenant`). Required in the response only; ignored if a request sends it.'
        minLength:
          type: integer
          default: 12
          minimum: 8
          description: A tenant may raise the length and never set it below 8 (decided 28 September, audit
            R126 (7)). **A password rule**; a PIN's length is `pinLength` (CHG-CRD-002).
        requireBreachCheck:
          type: boolean
          default: true
          description: '**The single most effective rule.** Refusing a password known to be breached stops
            more account takeovers than every composition rule combined.

            '
        maxAgeDays:
          type: integer
          nullable: true
          description: '**Null is the recommended value.** Forced rotation produces `Summer2026!` becoming
            `Summer2027!`, and it is offered because some tenants are contractually obliged to have it
            rather than because it works.

            '
        recoveryMethods:
          type: array
          description: 'BL-132. **A guest locked out had no path back** — lockout existed and recovery
            did not, which turns a forgotten password into a support call.

            **Ordered by strength, and the venue chooses which it offers.** Email is weakest and universal;
            a verified phone is stronger; an in-person check at a desk is strongest and only available
            to a guest who is already at the venue.

            '
          items:
            type: string
            enum:
            - email
            - sms
            - securityQuestions
            - inPersonVerification
            - supportAssisted
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: 'BL-145. **Null, and that is the decision.** A staff principal has one live session,
            full stop: ADR-0004 keeps a server-side session registry (the `sid` claim, `ActiveSession`), and
            §3.1.3 refuses a second sign-in rather than counting towards a limit (confirmed 28 September,
            audit R184). A number here would only ever mean 1.

            The requirement asked for it configurable. **Configurable to null is still an answer.**

            '
        deviceRestriction:
          type: object
          nullable: true
          description: 'BL-146. **Device, browser, IP and location restriction on access.** Applies to
            staff principals, not guests — a guest restricted to one device is a guest who cannot use
            their new phone.

            **Warn before block by default.** An IP restriction that blocks silently is a venue manager
            locked out on the day their ISP rotates an address.

            '
          properties:
            allowedIpRanges:
              type: array
              items:
                type: string
            allowedCountries:
              type: array
              items:
                type: string
            requireRegisteredDevice:
              type: boolean
              default: false
            onViolation:
              type: string
              enum:
              - warn
              - requireStepUp
              - block
              default: requireStepUp
        lockoutAfterAttempts:
          type: integer
          default: 10
          description: Wrong passwords before a staff password is locked for `lockoutMinutes`, counted in
            `PrincipalCredential.failedAttempts` (14 October 2026, CHG-CRD-001). A guest's in
            `GuestCredential.failedAttempts`. A PIN counts against `pinLockoutAfterAttempts`.
        lockoutMinutes:
          type: integer
          default: 15
          description: '**A temporary lockout, not a permanent one.** Permanent lockout on failed attempts
            is a denial-of-service anybody can run against a known username.

            '
        forceChangeOnFirstLogon:
          type: boolean
          default: true
        reusePreventionCount:
          type: integer
          default: 5
          minimum: 0
          maximum: 24
          description: '**How many previous passwords a staff member may not reuse** — the last 5 unless
            the tenant sets another (decided 28 September, audit R132). `changeOwnCredential` refuses a
            match with `422` `credential-reused`. **Passwords only**: a PIN follows `pinReusePrevention`
            (14 October 2026, CHG-CRD-002).

            '
        pinLength:
          type: integer
          enum: [4, 6, 8]
          default: 4
          x-ticvai-persistence-column: integer
          description: '**How many digits a staff PIN has, chosen by the tenant from a drop-down** (decided by
            Chinmay, 14 October 2026, ADAM CR-078: "Give those as options that they select as a drop down";
            CHG-CRD-002). The package does not fix the PIN rule; the tenant picks 4, 6 or 8. Every PIN keypad
            (POS-000, EMP-001, SCN-001 and the supervisor step-up prompts) takes exactly this many digits, read from
            `WorkstationContext.pinLength`; `changeOwnCredential` and `resetPrincipalCredential` refuse a PIN of
            another length (422 `policy-not-met`). **Raising it does not invalidate PINs already set**: a shorter PIN
            still signs in, and its holder is asked for a new one (`mustChangeCredential`) at the next sign-in.
            `minLength`, `requireBreachCheck` and the R126 floor are password rules and never apply to a PIN, which
            is valid only on a registered workstation.'
        pinReusePrevention:
          type: string
          enum: [none, last3, last5]
          default: last5
          description: '**Whether a new PIN may repeat an old one, chosen by the tenant from a drop-down** (decided
            by Chinmay, 14 October 2026, ADAM CR-078; CHG-CRD-002): `none` lets a PIN be reused, `last3` and `last5`
            refuse the current PIN and the previous 3 or 5 (422 `credential-reused`), read from
            `identity.principal_credential_history`. Audit R132 asked for reuse prevention on passwords and stays
            there (`reusePreventionCount`); for PINs it is this setting. The default keeps what the sign-in screens
            promised (the last five).'
        pinLockoutAfterAttempts:
          type: integer
          enum: [3, 5, 10]
          default: 5
          x-ticvai-persistence-column: integer
          description: '**Wrong PINs before the PIN is locked, chosen by the tenant from a drop-down** (decided by
            Chinmay, 14 October 2026, ADAM CR-078; CHG-CRD-002). At this many consecutive wrong PINs (at sign-in,
            in `changeOwnCredential`, or as a supervisor''s step-up PIN) `PrincipalCredential.lockedUntil` is set to
            now plus `lockoutMinutes`. A password counts against `lockoutAfterAttempts` instead.'
        mfaRequiredForPermissions:
          type: array
          description: '**Step-up rather than blanket MFA.** Requiring it for a refund approval and not
            for reading a rota is what stops people sharing devices to avoid it.

            **MFA is required by permission, not by role** (decided 28 September, audit R135). A principal
            holding any permission listed here must keep an active method (`removeMfaMethod` refuses to
            remove the last one). **The default is the platform floor**: `ROLE_MANAGE`, `LEDGER_APPROVE`
            and every `PLATFORM_*` permission. A tenant may add to the list and never remove a floor entry;
            a body that drops one is refused `400`.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
          default:
          - ROLE_MANAGE
          - LEDGER_APPROVE
          - PLATFORM_TENANT_VIEW
          - PLATFORM_TENANT_MANAGE
          - PLATFORM_TENANT_TERMINATE
          - PLATFORM_TENANT_ACCESS
          - PLATFORM_PLAN_MANAGE
          - PLATFORM_CELL_VIEW
          - PLATFORM_CELL_MANAGE
          - PLATFORM_BILLING_VIEW
          - PLATFORM_BILLING_MANAGE
          - PLATFORM_RELEASE_VIEW
          - PLATFORM_RELEASE_MANAGE
          - PLATFORM_RELEASE_PROMOTE
          - PLATFORM_MIGRATION_VIEW
          - PLATFORM_MIGRATION_APPLY
    SegregationViolation:
      type: object
      x-ticvai-persistence: none — computed from identity.grant against identity.segregation_rule
      description: 'BL-110, 3.3.31, 3.3.38. **One principal currently holding both halves of a
        rule.**

        **Computed rather than stored.** A violation row that survived the grant behind it would be
        a queue item nobody could close, and a compliance queue that cannot reach zero is one
        people stop opening.

        '
      required:
      - ruleId
      - principalId
      - permissionA
      - permissionB
      properties:
        ruleId:
          type: string
          format: uuid
        ruleName:
          type: string
        severity:
          type: string
          enum:
          - block
          - requireApproval
          - warn
          description: '**From the rule.** A `warn` violation and a `block` violation are the same
            finding with very different urgency, and a queue that does not carry it sorts by
            nothing useful.

            '
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        atScopePath:
          type: string
          nullable: true
          description: '**Where the two overlap**, and the field that makes a finding actionable:
            the answer is usually to narrow one grant rather than to remove it.

            **Null where the rule is not `scopeSensitive`**, which is the estate-wide case.

            '
        compensatingControlNoted:
          type: boolean
          default: false
          description: '**True where `allowWithCompensatingControl` covers this one.** Flagged
            rather than filtered out — a small venue that cannot separate duties is a fact somebody
            accepted, and it should stay visible rather than disappearing from the count.

            '
        detectedAt:
          type: string
          format: date-time
          description: When the principal came to hold both halves, the latest of the moments that made the pair
            (a grant's `createdAt`, a role permission's `grantedAt`, a module-access change); the list's order
            (14 October 2026, ADAM CR-077; CHG-IDR-002).

    ModuleCapability:
      type: object
      x-ticvai-persistence: none — derived from contracts/shared/permissions.yaml and every contract
      description: >
        BL-110. **One tickable thing a person can be allowed to do in a module.** Derived rather
        than authored, so an operation added with a permission appears on the right checklist by
        existing rather than by somebody remembering.
      required:
      - key
      properties:
        key:
          type: string
          description: >
            **The permission string, and the only vocabulary there is.** `roles.yaml` holds 44
            lowercase keys sharing none of these; that file is a saved tick-set for the POS
            surface which was mistaken for the alphabet, and it becomes a `CapabilityTemplate`.
        label:
          type: string
          nullable: true
          description: >
            **Null where the permission has no description yet, and the client renders the key.**
            72 of them are in that state. **A generated sentence would read like a label and mean
            nothing** — and a checklist item nobody understands is ticked anyway, which is worse
            than one that visibly needs explaining.
        group:
          type: string
          nullable: true
          description: The heading it sits under in the vocabulary — Selling, Access control, Shift
            and cash. **How a checklist of forty items stays readable.**
        operationCount:
          type: integer
          description: >
            **How much this tick actually grants.** A capability behind ninety operations and one
            behind two are different decisions, and the number is the only honest way to say so on
            a screen.
        elevated:
          type: boolean
          default: false
          description: >
            **Derived: at least one operation behind it declares `x-ticvai-step-up`.** Not a rank
            and not a judgement about the name — the operation already said it needs a second
            factor. Ticking one raises an approval rather than taking effect.
        segregationConstrained:
          type: boolean
          default: false
          description: >
            **Named in a `SegregationRule`.** Ticking it may conflict with something the principal
            already holds, and `setPrincipalModuleAccess` answers 409 rather than letting it
            through.

    ModuleCapabilitySet:
      type: object
      description: BL-110. One module and everything a person could be allowed to do in it.
      properties:
        module:
          type: string
        title:
          type: string
        unguardedOperations:
          type: integer
          description: >
            **Operations in this module that carry no permission, and so appear on no checklist.**
            94 across the package — guest-facing, service-to-service or self-scoped. Stated
            because a checklist that silently omits a third of a module reads as complete.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/ModuleCapability'

    ModuleAccess:
      x-ticvai-persistence: identity.module_access
      type: object
      description: >
        BL-110. **What one principal may do in one module, at one scope.** The unit the grant
        screen writes and reads back unchanged.
      required:
      - module
      - scopePath
      - capabilities
      properties:
        principalId:
          type: string
          format: uuid
          readOnly: true
        module:
          type: string
        scopePath:
          type: string
          description: >
            **Where, and it is half the grant** (ADR-0018). A capability means nothing until it is
            held at a scope containing the thing it acts on — holding `ORDER_REFUND` at one venue
            is not holding it at another, and the checklist is per scope for that reason.
        capabilities:
          type: array
          items:
            type: string
          description: >
            **Permission keys, ticked.** The complete set for this module and scope: what is
            absent is not granted, which is what makes the write replaceable and the read
            verifiable.
        appliedTemplate:
          type: string
          nullable: true
          description: >
            **Which saved tick-set this was copied from, for the record only.** It is not a
            binding: the ticks are the grant, and editing the template afterwards changes nothing
            here. A grant that silently follows a template is a grant nobody can audit at a point
            in time.
        grantedByPrincipalId:
          type: string
          format: uuid
          readOnly: true
        grantedAt:
          type: string
          format: date-time
          readOnly: true

    CapabilityTemplate:
      x-ticvai-persistence: identity.capability_template
      # CHG-GEN-005: presets sit at the tenant's path; a venue's ROLE_MANAGE reads them to build a role (CR-076).
      x-ticvai-rls: read-beneath
      type: object
      description: >
        3.3.23, BL-110. **A named tick-set — a role, with nothing depending on the name.**
      required:
      - code
      - name
      - capabilities
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        capabilities:
          type: array
          items:
            type: string
        module:
          type: string
          nullable: true
          description: '**The module a per-module preset belongs to** (a contract name, as
            `listModuleCapabilities`; CHG-CSP-003). Null for a template that spans modules, such as the
            Cashier starting configuration.

            '
        presetLevel:
          type: string
          nullable: true
          enum:
          - all
          - viewer
          - midLevel
          description: '**Which of the three per-module presets this is** (decided 2 October 2026, Chinmay;
            DEC-007; CHG-CSP-003): All, Viewer or Mid-level. Null on a template a tenant saved itself and on
            a cross-module starting configuration.

            '
        isPreset:
          type: boolean
          default: false
          readOnly: true
          description: '**Seeded by the platform, not saved by the tenant** (CHG-CSP-003). A preset is offered
            when a role is created and cannot be deleted; a tenant saves its own tick-sets beside them with
            `setCapabilityTemplate`.

            '
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Written by the server at `tenant` scope; ignored
            if a request sends it.'

    SegregationRule:
      type: object
      x-ticvai-persistence: identity.segregation_rule
      # CHG-GEN-005: rules sit at the tenant's path; a venue's createRole and grant checks read them (CR-076).
      x-ticvai-rls: read-beneath
      description: 'BL-147, 3.3.31 and 11.1.24. **The package enforced segregation of duties in exactly
        one place** — the product lifecycle guard requiring the approver not be the author — and there
        was no general rule.

        **A conflict is between two permissions held by one principal**, and the check runs at grant time
        rather than at use time: **discovering the conflict when somebody exercises it means the conflict
        already existed.**

        '
      required:
      - id
      - permissionA
      - permissionB
      - severity
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Assigned by the server. Required in the response only; ignored if a request sends it.
        name:
          type: string
        permissionA:
          type: string
        permissionB:
          type: string
        severity:
          type: string
          description: '**What each severity does** (decided 14 October 2026, ADAM CR-079; CHG-IDR-003). `block`
            refuses, with `409 segregation-breach`, a role set (`createRole`, `setRolePermissions`, including a
            parent role''s edit that would breach in a role inheriting it) and a grant (`createDelegatedAccess`,
            `createPrincipal` with `roleIds`, `setPrincipalModuleAccess`) that would hold both permissions.
            `requireApproval` and `warn` refuse nothing: the role or grant is saved, and every principal left
            holding both appears in `listSegregationViolations` with this severity.


            **Role time and grant time differ only in scope.** A role''s own and inherited permissions are one
            set granted at one scope, so at role time every rule applies whatever `scopeSensitive` says; at grant
            time a `scopeSensitive` rule conflicts only where the two grants'' scopes overlap.

            '
          enum:
          - block
          - requireApproval
          - warn
        rationale:
          type: string
          description: '**Why these two conflict, in words an auditor reads.** A rule with no rationale
            is a rule somebody removes when it becomes inconvenient.

            '
        scopeSensitive:
          type: boolean
          default: true
          description: '**Whether the two permissions must overlap in scope to conflict**, and this
            is not `scopePath` below — that one is the partition key and says where the rule *row*
            lives (ADR-0005), not where the *conflict* applies.

            **True, and it should rarely be false.** `ACCREDITATION_ISSUE` at Yas Island beside
            `ACCREDITATION_MANAGE` at Warner Bros is two jobs at two sites; flagging it is a
            control crying wolf, and the first thing a venue does with one of those is switch it
            off. The comparison walks `scopePath` prefixes the same way `resolvePermissions`
            already does — `uae.dubai` contains `uae.dubai.marina`, so one is an overlap and two
            siblings are not.

            **False is for conflicts that are genuinely estate-wide**, such as holding both sides
            of a financial reconciliation anywhere at all.

            '
        allowWithCompensatingControl:
          type: boolean
          default: false
          description: '**A small venue cannot always separate duties**, and pretending otherwise means
            the rule gets disabled entirely. A named compensating control is better than no rule.

            '
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope**; the server sets it and ignores it in a request.'
    RegisterGuestRequest:
      type: object
      required:
      - identifier
      - channel
      properties:
        identifier:
          type: string
          maxLength: 256
          description: Email address or mobile number in E.164.
        channel:
          type: string
          enum:
          - email
          - sms
          - whatsapp
        displayName:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
          x-ticvai-stored-as: identity.guest_credential.password_hash
          description: Optional. OTP-only accounts are supported and are the default. Stored only as
            `GuestCredential.passwordHash`, the PHC string of ADR-0071 (CHG-CRD-003).
        preferredLanguage:
          type: string
          pattern: ^[a-z]{2}$
        consents:
          type: array
          description: Consent captured at registration, recorded with the notice version.
          items:
            type: object
            properties:
              purpose:
                type: string
              granted:
                type: boolean
              noticeVersion:
                type: string
    SsoProtocol:
      type: string
      enum:
      - oidc
      - saml2
    SsoProvider:
      x-ticvai-persistence: identity.sso_provider
      type: object
      required:
      - id
      - displayName
      - protocol
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        protocol:
          $ref: '#/components/schemas/SsoProtocol'
        iconAssetRef:
          type: string
          nullable: true
        isEnforced:
          type: boolean
          description: True disables password login for principals covered by this provider.
        scopePath:
          type: string
          readOnly: true
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `tenant` scope**; the server sets it and ignores it in a request.'
    SsoGroupMapping:
      x-ticvai-persistence: identity.sso_group_mapping
      type: object
      required:
      - externalGroup
      - roleId
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The table had no key at all — the response returned the external
            group, the role and the scope, which is everything a caller needs and not the row own identity.

            **(provider, external_group) is unique and would serve**, but a mapping is edited and revoked
            by an administrator, and **a row addressed by the values it holds cannot be corrected** —
            changing the group means deleting a mapping and creating another, which loses who granted
            it and when.

            '
        externalGroup:
          type: string
        roleId:
          type: string
          format: uuid
        scopePath:
          type: string
          description: Scope the mapped role is granted at.
    SsoProviderConfig:
      x-ticvai-persistence: identity.sso_provider
      type: object
      required:
      - id
      - displayName
      - protocol
      - groupMappings
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
        displayName:
          type: string
        protocol:
          $ref: '#/components/schemas/SsoProtocol'
        metadataUrl:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        clientId:
          type: string
          nullable: true
        clientSecretRef:
          type: string
          nullable: true
          description: Key vault reference. The secret itself is never returned.
        groupMappings:
          type: array
          minItems: 1
          description: '**A group with no mapping grants nothing.** No default role, ever — otherwise
            the identity provider becomes a way to mint access nobody configured.

            '
          items:
            $ref: '#/components/schemas/SsoGroupMapping'
        autoProvisionPrincipals:
          type: boolean
          default: false
          description: Create a principal on first successful sign-in.
        isEnforced:
          type: boolean
          default: false
        isActive:
          type: boolean
    MfaKind:
      type: string
      enum:
      - totp
      - smsOtp
      - emailOtp
      - biometric
      - hardwareToken
    MfaMethod:
      x-ticvai-persistence: identity.mfa_method
      type: object
      required:
      - id
      - kind
      - isActive
      - enrolledAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MfaKind'
        label:
          type: string
          nullable: true
        maskedTarget:
          type: string
          nullable: true
          description: Partially masked destination, so a person can tell two methods apart.
        isActive:
          type: boolean
        isPrimary:
          type: boolean
        enrolledAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    MfaEnrolment:
      x-ticvai-persistence: none — transient
      type: object
      required:
      - methodId
      - kind
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The table had no key at all — no id, no parent and no natural
            key, so **no row could be addressed, updated or deleted.** The response schema returned everything
            a caller needs and not the row''s own identity, which is the difference between an API response
            and a table.

            '
        methodId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MfaKind'
        secret:
          type: string
          nullable: true
          description: TOTP shared secret. Returned once, at enrolment, and never again.
        qrCodeUri:
          type: string
          nullable: true
        recoveryCodes:
          type: array
          description: 'Returned once, in this enrolment response (`enrolMfaMethod` writes them, hashed,
            to `identity.mfa_recovery_code`). Not retrievable afterwards — `verifyMfaEnrolment` does not
            return them.

            '
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    SessionStatus:
      type: string
      description: >
        **The life of one signed-in session, which is not the life of a shift.** A shift holds the
        float and survives a break; a session holds the person and does not. `ShiftStatus.suspended`
        is where a break lives — *break cover; float intact, workstation released* — and the release
        of the workstation is exactly why the session ends rather than pausing: the next person
        opens their own.

        **One principal, one active session per workstation.** Enforced by the `ActiveSession`
        registry rather than by a state, because it is a fact about the set of sessions and not
        about any one of them.
      enum:
        - active            # signed in and working; the only non-terminal state
        - signedOut         # the principal ended it themselves
        - terminated        # a supervisor ended an abandoned session somebody else needed
        - expired           # idle past the timeout; the registry dropped it and freed the workstation

    ActiveSession:
      x-ticvai-persistence: identity.session
      description: '**The session record, in `identity.session`** (3 October 2026, CHG-R1S-008; the HLD/LLD
        cross-check and the r1 gate). Until then it was "none — Redis session registry", and 11 operations
        wrote a session no SQL created: nothing defined its columns, so `listActiveSessions` could not page,
        filter by workstation or venue, or run under row-level security. The row is the record of record,
        tenant-scoped and under RLS like every identity table; Redis stays the token cache in front of it
        (ADR-0004: a session is a token with a validity window, and the cache answers that check). The
        names and `hasOpenShift` are read with it, not stored.'
      type: object
      required:
      - sessionId
      - principalId
      - status
      - startedAt
      - lastSeenAt
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/SessionStatus'
          description: >
            **A registry that only holds live sessions cannot answer why one ended.** Kept on the
            record so a supervisor asking *what happened to till 4* gets `terminated` or `expired`
            rather than an absence.
        sessionId:
          type: string
        principalId:
          type: string
          format: uuid
        principalName:
          type: string
          x-ticvai-persisted: false
          description: Read from `identity.principal` with the row.
        roleId:
          type: string
          format: uuid
          nullable: true
        roleName:
          type: string
          nullable: true
          x-ticvai-persisted: false
          description: Read from `identity.role` with the row.
        workstationId:
          type: string
          format: uuid
          nullable: true
        workstationName:
          type: string
          nullable: true
          x-ticvai-persisted: false
          description: Read from the workstation with the row.
        venueId:
          type: string
          format: uuid
          nullable: true
        ipAddress:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        hasOpenShift:
          type: boolean
          x-ticvai-persisted: false
          x-ticvai-derived: onRead
          description: Revoking this session leaves cash unreconciled. **Computed on read** from the shift the
            principal holds open at the workstation (`orders.pos_shift`), never stored here.
        mfaSatisfied:
          type: boolean
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    Principal:
      x-ticvai-persistence: identity.principal
      # CHG-GEN-005: any staff grant reads principals; writes stay at the tenant root (CR-076).
      x-ticvai-rls: grant-holder-read
      type: object
      required:
      - id
      - username
      - displayName
      - isActive
      properties:
        id:
          type: string
          format: uuid
        username:
          x-ticvai-unique: tenant
          type: string
        displayName:
          type: string
        isActive:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
          description: Past this, resolution returns DENY regardless of grants.
        primaryRoleId:
          type: string
          format: uuid
          nullable: true
          description: 'Determines the landing screen when the principal holds several roles and picks
            one at login.

            '
        roles:
          type: array
          x-ticvai-persisted: false
          description: '**Read with the principal, never stored on it** (decided 14 October 2026, ADAM CR-077;
            CHG-IDR-002): one item per role the principal holds through a live grant, an
            `identity.delegated_access` row with this `principal_id`, a `role_id`, `effect` ALLOW, `revoked_at`
            null and now inside `valid_from`..`valid_to` (an open end is open), joined to `identity.role` for
            `code` and `name`. A role granted at several scopes appears once. `isPrimary` is
            `role.id = principal.primary_role_id`. Ordered by `name` ascending.'
          items:
            $ref: '#/components/schemas/RoleSummary'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        mustChangeCredential:
          type: boolean
          default: true
          description: '**The principal must replace their credential before the session is usable** (14 October 2026,
            CHG-CRD-001, ADAM CR-078; `createPrincipal` took it and nothing stored it). Set by `createPrincipal` (from
            `CreatePrincipalRequest.mustChangeCredential`, true unless the creator says otherwise) and by
            `resetPrincipalCredential` (always true: a reset credential is temporary). **Cleared only by a successful
            `changeOwnCredential`.** `login` returns it in `LoginResponse.mustChangeCredential`, and while it is true the
            session may call `changeOwnCredential`, `logout` and nothing else.'
        ssoProviderId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: identity.sso_provider
          description: '**Set when single sign-on provisioned this principal** (`completeSsoAuthorization`, from the
            tenant''s `identity.sso_provider`; 14 October 2026, CHG-CRD-001). Such a principal has **no local password**:
            no `password` row in `identity.principal_credential`, a `password` `login` is refused 401
            `sso-sign-in-required` (the door offers `startSsoAuthorization` instead), and `changeOwnCredential` with
            `method: password` is refused 409 `credential-managed-by-sso`. A till PIN may still be issued to them by
            `resetPrincipalCredential` (`method: pin`); until it is, a `pin` sign-in is refused the same way. Null for a
            principal created with `createPrincipal`.'
    CreatePrincipalRequest:
      type: object
      required:
      - username
      - displayName
      properties:
        username:
          type: string
          maxLength: 256
        displayName:
          type: string
          maxLength: 200
        initialCredential:
          type: string
          maxLength: 512
          writeOnly: true
          x-ticvai-stored-as: identity.principal_credential.credential_hash
          description: '**Stored hashed, never as sent** (14 October 2026, CHG-CRD-001): `createPrincipal` writes one
            `identity.principal_credential` row with `method: password` and `credentialHash` the PHC string of this value
            (ADR-0071). Held to `setPasswordPolicy`. Omitted for a principal who will sign in only through the tenant''s
            single sign-on, who then has no local credential until `resetPrincipalCredential` issues one.'
        mustChangeCredential:
          type: boolean
          default: true
          description: Stored on the principal (`Principal.mustChangeCredential`, CHG-CRD-001) and returned at `login`;
            cleared by the principal's first successful `changeOwnCredential`.
        validTo:
          type: string
          format: date-time
        homeScopePath:
          type: string
          x-ticvai-persisted: false
          description: 'The `platform.scope` path the person works from. **Resolved, not kept:** the path is
            resolved to the `platform.scope` row at it, whose id is `identity.principal.home_scope_id`; the path
            itself has no column (CHG-R6G-009). Omitted: the caller''s own home scope. At or beneath a node where
            the caller holds `USER_MANAGE`, or `403` (14 October 2026, ADAM CR-077; CHG-IDR-002).'
        roleIds:
          type: array
          description: 'Roles granted at once. **Each becomes one `identity.delegated_access` row** (ALLOW, at
            the home scope''s path, granted by the caller), as `createDelegatedAccess` writes it and under the
            same segregation check; the first is the principal''s `primaryRoleId` (14 October 2026, ADAM CR-077;
            CHG-IDR-002).'
          items:
            type: string
            format: uuid
    Role:
      x-ticvai-persistence: identity.role
      # CHG-GEN-005: roles are tenant-wide (R108): any staff grant reads them, writes stay at the tenant root; role_permission follows the role (CR-076).
      x-ticvai-rls: grant-holder-read
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          x-ticvai-unique: tenant
          description: '**Unique within the tenant** (decided 28 September, audit R108). A seeded role''s
            code is reserved in every tenant. Unique per tenant, not per venue, because a grant names a
            role anywhere in the tree; `createRole` refuses a duplicate with `409 duplicate-code`.

            **Compared case-insensitively** (`common.yaml`, `x-ticvai-unique`; ADAM CR-079, CHG-IDR-003):
            `ADMIN` and `admin` are one code, and the second is the duplicate. The code is kept as it was
            typed.

            '
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: '**A role that grants no permissions is not a role.** `Role` carried a code, a
            name and two counts until 18 August, and `identity.role_permission` derived from it with exactly
            one column — `role_id`. **A join table that joins to nothing**, found by Hrushikant in review
            and missed by the schema audit that ran the same day.

            **The audit asked whether every table had columns, a relationship and an owner, and this table
            had all three.** What it did not ask is whether a table with one column can do the job its
            name claims.

            **The role''s own set, not revoked** (decided 14 October 2026, ADAM CR-077; CHG-IDR-002): the
            `identity.role_permission` rows of this role with `is_active` true. A revoked row is history, not
            a permission. **Inherited permissions are not merged in**: a client reads `inheritsFromRoleId` and
            that role, the same shape `setRolePermissions` returns (`permissions` beside `inheritsFromRoleId`).
            The segregation check is the one place the two are taken together (ADAM CR-079).

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
        inheritsFromRoleId:
          type: string
          format: uuid
          nullable: true
          description: '**Role composition, one level deep and no deeper.** A supervisor role that is
            a cashier plus three permissions is how venues actually describe them.

            **Cycles are refused and depth is capped at one**, because a permission set nobody can read
            off the screen is a permission set nobody audits.

            '
        isSystem:
          type: boolean
          default: false
          description: '**Seeded roles ship and are editable; deleting one is refused.** A venue that
            removes `cashier` and rebuilds it has two roles with one name in the audit log.

            **The seeded system roles are Cashier, Supervisor, Venue Manager, Finance and Tenant Admin**
            (proposed in `docs/active/seed-data-proposal.md` section 2, client to correct; audit R229).


            **Superseded 2 October 2026: no fixed default roles** (Chinmay; DEC-007; CHG-CSP-003). The five
            are presets (`CapabilityTemplate`, `isPreset`) a role starts from, not roles a tenant is given.
            The field stays for clients built at r1 and is false on every role created from 2 October.

            '
        presetCode:
          type: string
          nullable: true
          readOnly: true
          maxLength: 64
          description: '**The preset this role was started from, for the record only** (decided 2 October 2026,
            Chinmay; DEC-007; CHG-CSP-003): the first of `createRole.presetCodes`, or null for a role ticked
            by hand. It binds nothing; a later edit of the preset never changes this role.

            '
        principalCount:
          type: integer
          readOnly: true
          x-ticvai-persisted: false
          description: '**Computed on read, never stored** (decided 14 October 2026, ADAM CR-077; CHG-IDR-002):
            the distinct principals holding this role through a live grant (`identity.delegated_access` with
            this `role_id`, a `principal_id`, `effect` ALLOW, `revoked_at` null, now inside its validity
            window). **Counted under row-level security**, so only the grants the caller''s own grants let it
            read are counted: a venue manager sees the venue''s holders, not the tenant''s.'
        grantCount:
          type: integer
          readOnly: true
          x-ticvai-persisted: false
          description: '**Computed on read, never stored** (decided 14 October 2026, ADAM CR-077; CHG-IDR-002):
            the live grants of this role (the rows `principalCount` counts, one per grant, so a principal
            granted the role at two scopes counts twice). Counted under row-level security, as
            `principalCount`.'
    RolePermission:
      x-ticvai-persistence: identity.role_permission
      type: object
      description: '**The grant is a row, not a value in an array.** Raised again in review on 24 August:
        `identity.role_permission` held `role_id` and `permission` and nothing else — **no record of who
        granted a permission or when.**

        Hrushikant found the first half on 18 August, when the table had one column. **The fix added the
        permission and stopped**, which is how a half-repair survives: the table now joined, so nothing
        looked wrong.

        **A permission grant is the most audited act in the platform** and it was the one write with no
        audit trail. `listAuditRecords` was built on 20 August because `platform.audit_record` was written
        by nothing — this is the other end of the same gap.

        '
      required:
      - roleId
      - permission
      properties:
        roleId:
          type: string
          format: uuid
        permission:
          $ref: ../shared/permissions.yaml#/components/schemas/Permission
        grantedAt:
          type: string
          format: date-time
        grantedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**Null for a system role.** A seeded role is granted by the platform and naming
            a person there would be a fiction.

            '
        isActive:
          type: boolean
          default: true
          description: '**Revoked rather than deleted.** A permission that vanishes from the table takes
            its history with it, and *who could do this last Tuesday* is the question an incident asks.

            '
    DelegatedAccess:
      x-ticvai-persistence: identity.delegated_access
      # **A grant names exactly one of a permission or a role** (ADAM CR-158, option A, 18 October 2026;
      # CHG-CRA-002): a table CHECK, `num_nonnulls(permission, role_id) = 1`, NOT VALID then VALIDATE.
      x-ticvai-exactly-one-of: [[permission, roleId]]
      type: object
      required:
      - id
      - permission
      - scopePath
      - effect
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: string
          format: uuid
          nullable: true
          description: 'The role this grant gives, with its own and inherited permissions. **Exactly one of
            `roleId` and `permission` is set** (ADAM CR-158; CHG-CRA-002): a role grant carries no permission.'
        permission:
          type: string
          nullable: true
          description: 'From the permission enum. `*` permitted on DENY only. **Null on a role grant** (ADAM
            CR-158, 18 October 2026; CHG-CRA-002): a grant names exactly one of a permission or a role (`roleId`),
            so a role grant stores `role_id` and no permission. Nullable in responses since then, a breaking change
            approved by the lead (BC-370).'
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'CF-132, CL-05. **A grant held by a guest rather than a staff principal.**

            Section 5.5 asks for portfolios — a primary holder assigning entitlements, transfer between
            linked accounts, shared wallets with individual tracking — and it appears ten times across
            ten sections. **Every one of those reduces to the same question: who may act on whose behalf,
            over what, and until when.**

            **That is a grant, not a household table.** A primary holder assigning an entitlement is a
            grant. A group leader holding tickets for twelve is a grant. A corporate account enrolling
            members is a grant with a quota. **A shared wallet with individual tracking is a grant over
            a balance, and the transaction log already records who spent.**

            **A household table would answer one of those four.**

            '
        overSubjectId:
          type: string
          format: uuid
          nullable: true
          description: 'Whose behalf. **Null for a staff grant, which is the existing behaviour** — every
            grant written before 18 August means exactly what it meant before.

            '
        overObjectRef:
          type: string
          nullable: true
          description: '**Where the authority is over a thing rather than a scope** — a wallet, an entitlement,
            a booking. `scopePath` answers *where*; this answers *what*, and a guest''s authority is almost
            always over a specific object rather than a branch of the tree.

            '
        delegationKind:
          type: string
          nullable: true
          enum:
          - primaryHolder
          - familyMember
          - groupLeader
          - attendee
          - corporateAdmin
          - corporateMember
          - carer
          description: '**What kind of relationship this expresses**, for display and for reporting. The
            mechanism does not branch on it — a family member and a group attendee are the same grant
            with different words around them, which is the point.

            '
        quota:
          type: integer
          nullable: true
          description: '2.14.15 and 4.3.11. **How many the holder may assign.** A corporate account with
            fifty allocations and a family with four are the same structure with different numbers.

            '
        isRevocableBySubject:
          type: boolean
          default: true
          description: '**Whether the person it is over can end it.** A guest who linked a family member
            should be able to unlink them; a corporate member should not be able to revoke their employer''s
            oversight — and **a delegation nobody can end is a delegation somebody will regret.**

            '
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        permissionId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Taken from `identity.user_access`, 20 September, when that table was collapsed into
            this one.** `permission` above is free text; this names a row in
            `identity.permission`, the catalogue wired the same day. A grant that names a
            catalogue row can be checked against the keys the contracts actually enforce — which
            is the whole point of a catalogue that reported *154 on operations, 35 in roles.yaml,
            0 shared*.

            Nullable because a role grant carries no permission at all.
        revokedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            Taken from `identity.user_access`. This table recorded `revokedBy` and not when, so
            it could say who revoked a grant and not whether it was before or after the thing
            somebody is asking about.
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        createdByPrincipalId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateGrantRequest:
      type: object
      description: '**A grant names exactly one of `permission` and `roleId`** (ADAM CR-158, option A, 18 October
        2026; CHG-CRA-002): a single permission, or a role with its own and inherited permissions. Both, or neither,
        is refused 400 `validation`. `*` stays DENY-only.'
      required:
      - scopePath
      - effect
      oneOf:
      - required: [permission]
      - required: [roleId]
      properties:
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        permission:
          type: string
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    LoginRequest:
      type: object
      description: '**`workstationId` is required for a device door and absent from a browser door**
        (CHG-DOOR-001, 2 October 2026). It was required on every login, so no browser could sign in:
        the TICVAI Console (ADM-001), Venue Management (SUP-001) and the partner portal (PTR-001) have no
        workstation. Optional in the schema is additive against r1; the rule moved to where it belongs,
        the device-bound methods: `pin`, `card` and `rfid` without a `workstationId` are refused 400
        (`workstation-required`). A `password` sign-in from a till, handheld or scanner still sends it,
        because the workstation decides the Sale Board, the hardware and the till identity (never a
        permission, ADR-0002).

        '
      required:
      - username
      - credential
      properties:
        username:
          type: string
          maxLength: 256
        credential:
          type: string
          description: 'Password, PIN, card token or RFID token depending on `method`. Compared with the
            principal''s `PrincipalCredential.credentialHash` and never stored (ADR-0071, CHG-CRD-003).

            '
          maxLength: 512
          writeOnly: true
          x-ticvai-persisted: false
        method:
          type: string
          description: '**`pin` is how a till is actually used.** A cashier signs in at a shared
            terminal between guests, and a password on a touchscreen with somebody waiting is a
            password that gets shortened, shared or written on the drawer. The employee number
            goes in `username` and the PIN in `credential`, so the shape of the request does not
            change — only what the operator types.


            **A PIN is weaker than a password and the difference is bounded by the device, not by
            the secret.** A `pin` (like `card` and `rfid`) is accepted only with a `workstationId`,
            refused 400 `workstation-required` without one (CHG-DOOR-001), and the workstation is *NOT
            a permission source*: it says which till, and the till is on a venue network in a staff area. A PIN
            is a reasonable credential there and nowhere else, which is why this is an enum value
            and not a policy flag — a surface that wants it has to ask for it by name.


            Added 10 September 2026 for `POS-000 Sign In`.

            '
          enum:
          - password
          - pin
          - card
          - rfid
          - sso
          default: password
        workstationId:
          type: string
          format: uuid
          description: 'Identifies the device. Determines Sale Board, connected hardware, till identity
            and Access Point inheritance. NOT a permission source.


            **Sent by a device door, never by a browser** (CHG-DOOR-001, 2 October 2026). Required in
            effect for the device-bound methods `pin`, `card` and `rfid` (400 `workstation-required`
            without it); absent on the TICVAI Console, Venue Management and partner portal sign-ins,
            which have no workstation.

            '
        deviceFingerprint:
          type: string
          maxLength: 256
    LoginResponse:
      x-ticvai-persistence: none — computed
      allOf:
      - $ref: '#/components/schemas/TokenPair'
      - type: object
        required:
        - requiresRoleSelection
        - requiresMfa
        - mustChangeCredential
        properties:
          mustChangeCredential:
            type: boolean
            description: '**The credential just used is temporary** (14 October 2026, CHG-CRD-001, ADAM CR-078): the
              principal''s `Principal.mustChangeCredential`, set at creation and by `resetPrincipalCredential`. While it is
              true the session may call `changeOwnCredential` and `logout` and nothing else; the door asks for the new
              password or PIN (ADM-001, SUP-001, PTR-001, EMP-001, SCN-001, POS-000) before the role prompt and the landing.
              A successful `changeOwnCredential` clears it. Always false for a single sign-on principal.'
          requiresRoleSelection:
            type: boolean
          requiresMfa:
            type: boolean
            description: True when the principal holds any permission listed in
              `PasswordPolicy.mfaRequiredForPermissions` (decided 28 September, audit R135). The session
              is not usable until `verifyMfaChallenge` succeeds on a `signIn` challenge.
          hasMfaMethod:
            type: boolean
            description: Whether the principal has an active MFA method. With `requiresMfa` true and this
              false, the client must enrol one first (audit R135, R126 (5)).
          mfaMethods:
            type: array
            description: The principal's active methods, so the client can offer the right one for the
              `signIn` challenge. Empty when `requiresMfa` is false.
            items:
              $ref: '#/components/schemas/MfaMethod'
          availableRoles:
            type: array
            items:
              $ref: '#/components/schemas/RoleSummary'
          session:
            $ref: '#/components/schemas/Session'
    TokenPair:
      x-ticvai-persistence: none — transient
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT carrying `sid`, validated per request against the session registry.
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds
    RoleSummary:
      x-ticvai-persistence: none — projection over role
      type: object
      required:
      - id
      - code
      - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        isPrimary:
          type: boolean
          description: True for the role that is the principal's `primaryRoleId` (`identity.principal.primary_role_id`);
            false for the others (14 October 2026, ADAM CR-077; CHG-IDR-002).
    Session:
      type: object
      required:
      - sessionId
      - principalId
      - roleId
      - scope
      - effectivePermissions
      properties:
        sessionId:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        displayName:
          type: string
        scope:
          type: array
          description: 'Scope nodes this session may act within, resolved once at login from the ltree
            hierarchy with deny-overrides-allow. Clients filter navigation against this — they never compute
            it.

            '
          items:
            $ref: ../shared/common.yaml#/components/schemas/ScopeRef
        effectivePermissions:
          allOf:
          - $ref: ../shared/permissions.yaml#/components/schemas/PermissionSet
          description: 'Flattened set across all granted scopes, after deny resolution. Convenience for
            coarse checks. Anything scope-sensitive must use `permissionsByScope`.

            '
        permissionsByScope:
          type: array
          description: 'Permissions effective at each granted scope path. Clients filter navigation on
            this and never compute permissions themselves.

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/ScopedPermissions
        saleBoardId:
          type: string
          format: uuid
          description: 'Landing surface, derived from the WORKSTATION, not the role (12 Aug 2026 §3).
            Ticketing, F&B or Retail board.


            **Optional since 2 October 2026: only a till session carries it** (Chinmay, door follow-ups;
            CHG-CSP-002; breaking change against r1 approved as BC-001 to BC-005 in
            `docs/active/breaking-changes.yaml`). A browser door (ADM-001, SUP-001, PTR-001) and a staff
            handheld (EMP-001) sign in with no workstation since CHG-DOOR-001, so they have no board to
            land on and the field is absent. On a till it is the workstation''s effective board: the
            outlet''s board unless the till overrides it (`tenancy.Workstation.saleBoardSource`; CHG-CSP-006).
            A client reads its landing from this field when present and from its own platform otherwise.

            '
        workstation:
          $ref: '#/components/schemas/WorkstationContext'
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    WorkstationContext:
      type: object
      required:
      - id
      - code
      - venueId
      - regionId
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        venueId:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        accessPointId:
          type: string
          format: uuid
          description: Inherited from the workstation, never selected by the operator.
        devices:
          type: array
          items:
            type: object
            required:
            - kind
            - driver
            properties:
              kind:
                type: string
                enum:
                - receiptPrinter
                - ticketPrinter
                - cashDrawer
                - barcodeScanner
                - rfidReader
                - paymentTerminal
                - customerDisplay
              driver:
                type: string
              identifier:
                type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
        timezone:
          type: string
        cellName:
          type: string
          description: 'The cell this workstation''s region is served from, which is the cell the commerce host
            answering this request is deployed in (one cell per tenant per region, ADR-0014): the host fills it
            from its own configuration and reads no table (ADAM CR-096, CHG-RTE-001). A client uses this only for
            diagnostics and telemetry tagging — never for routing, which the Control Plane resolves.

            '
        deploymentProfile:
          type: string
          enum:
          - terminalLocal
          - venueEdge
          - thin
          description: 'Whether this surface reads catalogue locally (ADR-0013). Determines which flows
            the client enables offline.

            '
        pinLength:
          type: integer
          enum: [4, 6, 8]
          readOnly: true
          description: '**The tenant''s `PasswordPolicy.pinLength`, carried to the device** (14 October 2026,
            CHG-CRD-002, ADAM CR-078). A device door draws its PIN keypad, and its supervisor step-up prompt, at this
            many digits; the device keeps it with the workstation context of the last session on it, so the door
            needs nothing fetched before sign-in. A device that has never had a session accepts 4 to 8 digits and the
            server decides. Read from `identity.password_policy`, not stored on the workstation.'
