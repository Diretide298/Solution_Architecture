    post:
      operationId: restoreAuthorisationPolicyVersion
      x-ticvai-consumed-by:
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-agreed: '29 September: our build plan (7.1.46 "allow rollback to previous approved versions");
        shape follows access rollbackAccessPolicy and restoreProductVersion'
      summary: Put a previously approved policy version back, as a new version
      description: '7.1.46 (decided 29 September, build pass). **Restoring writes a new version with the old
        content; it never rewinds.** The version being replaced stays in `listAuthorisationPolicyHistory`, because a
        decision taken under it (`listAccessDecisions` names the version) must still be explainable.


        **Only a version that was approved can be restored** (`AuthorisationPolicyVersion.approvedBy` set): a draft
        that never passed approval is not a known-good state to go back to. The new version is
        `pendingApproval` and goes through the same approval route as any policy change (`setAuthorisationPolicyState`,
        routed to `approvals`); the current version stays in force until it is approved. `409` when the target
        version was never approved, is the current version, or the policy is `retired`.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targetVersion
              - reason
              properties:
                targetVersion:
                  type: integer
                  minimum: 1
                  description: The approved version whose content is restored.
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
                  description: Kept on the new version as `AuthorisationPolicyVersion.reason`.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Restored as a new version, pending approval
          content:
            application/json:
              schema:
