      items: {$ref: '#/components/schemas/SegregationRule'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.segregation_rule rows, as it stores them and as the caller's
