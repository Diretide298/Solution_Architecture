  /access-decisions:
    post:
      operationId: evaluateAccess
      x-ticvai-conflict-policy: serverWins
      summary: Decide, now, and say why
      description: '3.3.27 and 3.3.29. **One decision point, called by everything.** Gates, turnstiles,
        back-office screens and APIs all ask the same question, and a second evaluator anywhere means two
        answers that diverge silently.

        **The reason is part of the answer, not a log line.** 3.3.38 wants access investigations to be
        reportable, and an investigation into a denial needs to know *which condition failed* — a bare
        DENY sends somebody to read forty policies by hand.

        **What it decides is a permission** (clarified 29 September, build pass): may this principal use
        this permission here, now. Admission at a gate or turnstile is decided by the access contract''s
        validation against `AccessDynamicPolicy`; a gate calls this only where a staff principal''s
        permission is the question (a supervisor authorising an override at the gate).
        See `AuthorisationPolicy` for the split.

        **Offline is a different operation on purpose.** 3.3.30 wants local evaluation when offline, and
        that is `getAuthorisationPolicyBundle` plus a device-side evaluator — not this call with a longer
        timeout. A gate that waits for the network is a gate that stops working when the network does.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: primary
