              label, or the browser).'
    SessionPendingProblem:
      x-ticvai-persistence: none — error shape
      description: '`getCurrentSession`''s 409 (IDENTITY-C04): the shared Problem and the steps the session still has to do.'
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required: [pending]
        properties:
