        **No fixed default roles: the seeded sets are presets** (decided 2 October 2026, Chinmay, batch 1
        ADM-554 and the pre-apply round; DEC-007; CHG-CSP-003). Chinmay: *"Default permission configs, so
        to speak. We still have checklists: if they select Viewer, for example, they can still give that
        viewer more permissions and rename it."* A new tenant starts with no roles. Creating one shows the
