          x-ticvai-persisted: false
          description: '**The roles the principal may choose, one per grant** (IDENTITY-C45, CHG-R8SPN-032), resolved on
            read as `LoginResponse.availableRoles` is, so EMP-002 can list them on a cold open or after a relaunch
            (`getCurrentSession`) without signing in again.'
          items:
            $ref: '#/components/schemas/RoleSummary'
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 'When the session ends at the latest: `openedAt` plus `PasswordPolicy.sessionMaxHours` (12
            hours by default; proposed, client to correct). A till session ends earlier, when the shift on its
            workstation closes; any session ends at `logout` or a revocation. Refreshing the access token never
            moves this time (IDENTITY-C25, FOUNDATION-AI-C27; CHG-R8SPN-014).'
