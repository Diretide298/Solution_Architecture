      - bearerAuth: []
      - {}
      parameters:
      - name: X-Supervisor-Principal-Id
        in: header
        required: false
        description: With no session (POS-000), the supervisor signing the step-up (CHG-RUL-015). Ignored with a session.
        schema:
          type: string
          format: uuid
      - name: X-Supervisor-Username
        in: header
        required: false
        description: With no session (POS-000), the supervisor's employee number, **instead of** `X-Supervisor-Principal-Id`
