            at the scope the operation acts on, from the per-scope set (the node acted on or one of its
            ancestors); `effectivePermissions` is for coarse checks only. A list''s reach is the scope paths
            where its permission holds, and a filter outside it is `403`; a tenant-level operation needs its
            permission at the tenant root. The request kernel''s seam carries this set beside the flat one
            (#27692 owns the field) and sign-in (#27666) fills it from the same resolution that fills this
            property; tests fill the seam until sign-in lands. The full statement is
            `docs/architecture/specs/permission-resolution.md` section 7.2. No wire shape changes.

