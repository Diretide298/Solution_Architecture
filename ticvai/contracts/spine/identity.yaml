  /auth/guest/account:
    delete:
      operationId: deleteGuestAccount
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-066 Privacy & My Data"
      x-ticvai-singleton: true
      x-ticvai-singleton-note: 'The caller''s own account: one per signed-in guest, so there is no key in the path.'
      x-ticvai-audience:
      - guest
      summary: Self-service account deletion
      description: >-
        Raises an erasure request rather than deleting immediately. PII is removed from the
        erasable store; ledger entries keep their opaque subject reference and stay intact.


        **What blocks it, and where Identity reads it from** (ADAM CR-084, decided 14 October 2026,
        CHG-GDL-001). The request is refused with `409` while the guest still holds something a deletion
        would strand: an **open order** (`open-orders-remain`: an order whose status is `pending`, `held`,
        `partiallyPaid` or `paid`, the rule `orders#openOrdersForSubject` states) or a **live entitlement**
        (`live-entitlement-remains`: an entitlement whose status is `issued` or `partiallyConsumed` and whose
        `validTo` is still ahead, the rule `access#liveEntitlementsForSubject` states; a frozen or suspended
        pass is still `issued`). Identity is Foundation and reads nothing above it (ADR-0028), and Access is
        another deployable (ADR-0055 rule 4), so neither orders.sales_order nor access.entitlement is
        read: Identity answers from `identity.subject_holding`, its own projection of the order and
        entitlement events (`SubjectHolding`). **The erasure job checks the same two conditions again when it
        runs**, against the projection as it stands then; if a blocking holding appeared after the `202`, it
        erases nothing and closes the request unfulfilled, naming the problem type that held.


        **The request is an Approvals request.** `requestId` is the `approvals.request` id, raised in the
        same transaction through Approvals' in-process `createApprovalRequest` (Approvals is in the Tenancy
        module, in `commerce` with Identity; ADR-0055 rule 3). A guest's own erasure needs no human approval
        step (ADR-0047 section 7); the tenant's approval matrix may add one, and then the erasure job waits
        for the decision.


        **Every guest is erased locally; only a linked guest fans out.** The job tombstones the guest's
        `pii.subject` row (`is_erased`, `erased_at`, and `erasure_request_id` = `requestId`; ADR-0047), for
        every guest. Only where the guest is linked across cells (the session's
        `GuestSession.guestLinkId` is set; ADR-0010) does it also call cross-region `createDsarRequest`
        (`kind: erasure`, `serviceAuth`), which raises the cross-cell sync.dsar_request and fans out. A
        guest who never transacted across regions has no link (cross-region.yaml) and raises no DSAR record.

      x-ticvai-read-via:
      - query: access#liveEntitlementsForSubject
        route: projection
        for: 409 live-entitlement-remains (and the erasure job's re-check)
      - query: orders#openOrdersForSubject
        route: projection
        for: 409 open-orders-remain (and the erasure job's re-check)
      tags:
      - guestAuth
      x-ticvai-permission: null
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-self-scoped: subject
      security:
      - guestAuth: []
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: >-
            Erasure request raised. The same shape `exportSubjectData` returns for an export, so a guest's
            two privacy requests read alike.
          content:
            application/json:
              schema:
                type: object
                required:
                - requestId
                properties:
                  requestId:
                    type: string
                    description: >-
                      The `approvals.request` id of the erasure request (raised through Approvals'
                      `createApprovalRequest`), which the tombstone records as `pii.subject.erasure_request_id`.
                  estimatedCompletionAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: >-
                      Null until a response period reaches Identity. The package's response periods are the
                      privacy request types' per-jurisdiction `deadlines[].responseDays` (marketing-crm
                      `setPrivacyRequestTypes`, which give `PrivacyRequest.dueAt`); Identity, as Foundation,
                      does not read them, so today this is always null and the deadline a venue works to is
                      the privacy queue's `dueAt`.
        '409':
          description: >-
            The guest still holds something a deletion would strand. An open order remains
            (`open-orders-remain`: status `pending`, `held`, `partiallyPaid` or `paid`), or a live entitlement
            remains (`live-entitlement-remains`: status `issued` or `partiallyConsumed` with `validTo` still
            ahead). Deleting an account with a valid ticket in it strands the guest at a gate. Read from
            `identity.subject_holding`, never from the orders or access tables; `detail` names the order or
            entitlement ids that block.
          x-ticvai-problem-types: [open-orders-remain, live-entitlement-remains]
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
