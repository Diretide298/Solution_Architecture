      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
        - "P09 ADM-021 Platform Role Management"
      x-ticvai-audience:
      - staff
      summary: Create a role
      description: '**Start from a preset, then edit the checklist** (decided 2 October 2026, Chinmay; DEC-007;
        CHG-CSP-003). `presetCodes` names one or more presets (`listCapabilityTemplates`); their permissions
        are copied into the new role, unioned with any `permissions` sent, and the copy binds to nothing:
        changing a preset later never widens a role made from it. With neither, the role starts empty and
        the checklist is ticked by hand. An unknown preset code is `422 unknown-preset`.


        **The role-time segregation check** (decided 14 October 2026, ADAM CR-079; CHG-IDR-003). The initial
        set is checked as `setRolePermissions` checks it: every `SegregationRule` is evaluated against the
        role''s permissions, **whatever its `scopeSensitive`**, because every permission of one role is granted
        together at one scope, so a pair inside a role always overlaps. Only a rule whose `severity` is
        `block` refuses, with `409 segregation-breach` (`common.yaml`) naming the rule and both permissions;
