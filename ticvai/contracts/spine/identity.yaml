        2026, Block A business rules: "POS-000: session management stays on the door"; CHG-RUL-015, which
        reverses CHG-DOOR-003 for this). Somebody else is signed in to the till, so nobody at it has a
        session: the till calls this with no token (`security` admits `{}`), names itself (`workstationId`),
        and carries the supervisor''s own principal and PIN (the `X-Supervisor-Principal-Id` and `X-Supervisor-Pin` headers, since a GET has no body). The PIN is verified against the
        principal as `common.yaml` `SupervisorStepUp` says; that principal must hold `SESSION_FORCE_LOGOUT`
        at the till''s venue, and the call reaches only the sessions at that one till (`workstationId` is required then). Anything else is `403
        supervisor-step-up-refused` and nothing is read or written. **No session is opened** by the step-up:
        it authorises this one call. With a session (BO-053 Staff Directory) the caller''s own
        `SESSION_FORCE_LOGOUT` applies as before and no step-up is asked.


        **Ordered by `startedAt` descending, `sessionId` as the tiebreak** (decided 14 October 2026, ADAM
        CR-077; CHG-IDR-002): the session that began last is first, which on a till is the one somebody is
        asking about.

        '
