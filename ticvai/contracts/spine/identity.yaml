openapi: 3.1.0
info:
  title: TICVAI Identity & Authorisation
  version: 1.0.0
  x-ticvai-screen-count: 80
  x-ticvai-tier: spine
  x-ticvai-module: 19 — Guest Mobile App & Branding (auth) + cross-cutting staff auth
  x-ticvai-requirements: 107
  x-ticvai-capabilities:
  - C35
  - C36
  - C56
  x-ticvai-platforms:
  - All platforms
  description: "## What this contract covers\n**Defines who is asking, and what they may do.**\n| | |\
    \ |---|---| | **Tier** | spine | | **Matrix domain** | 19 — Guest Mobile App & Branding (auth) + cross-cutting\
    \ staff auth | | **Requirements** | ~107 | | **Capabilities** | C35, C36, C56 | | **Consumed by**\
    \ | All platforms |\n## How to read this file\n**This file is a contract.** It is hand-authored and\
    \ it is the source of truth for one bounded context: server code, client code and mock servers are\
    \ generated from it, never the other way round. If a field is not here, it does not exist.\n**Contracts\
    \ are split into two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy,\
    \ identity,\n  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n\
    \  requires a formal change request, because every satellite has pinned against it.\n- **Satellite**\
    \ — a domain that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths`\
    \ are operations.** Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n\
    | Extension | Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From\
    \ one enum in `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the\
    \ seven-level hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected\
    \ terminal may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`,\
    \ `serverWins`, `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth:\
    \ service` (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table\
    \ name, a list of tables, or `none` with a reason. It is documentation of the mapping, not a generator\
    \ input — the DDL lives in versioned SQL migrations, because partitioning, RLS policies, `ltree` indexes\
    \ and partial indexes have no expression in OpenAPI.\n**`security` arrays hold OAuth scopes.** Empty\
    \ means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty is not the\
    \ same as absent: absent means unauthenticated.\n\n## This context\nAuthentication, session lifecycle\
    \ and effective-permission resolution.\nTwo positions from the Project Direction shape this contract:\n\
    - §3.1.1 Authorisation is user/role-driven. A user logs in from any device and\n  carries their access.\
    \ Workstation determines presentation, hardware binding,\n  till identity and reporting dimension\
    \ — never authorisation.\n- §3.1.3 Single session per user. A second login is REJECTED (409), not\n\
    \  auto-terminating the first, because auto-terminate can orphan an open cart\n  or an unclosed cash\
    \ drawer.\n\nClients never compute permissions locally. They consume `effectivePermissions` returned\
    \ at login and refreshed on demand.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
      description: Resolved per tenant from the Control Plane. Never hardcoded.
security:
- bearerAuth: []
# **The rule questions Identity answers for other modules** (14 October 2026, the cross-module query pattern of the
# r6 settlement, ADR-0055 amendment; CHG-CRD-004, ADAM CR-078). An asking operation names one with
# `x-ticvai-read-via`; it never reads `identity.*` tables itself.
x-ticvai-queries:
  verifySupervisorStepUp:
    module: identity
    inputs:
      principalId: uuid, the supervisor signing (SupervisorStepUp.principalId); or supervisorUsername (SupervisorStepUp.supervisorUsername, the employee number), exactly one of the two, resolved to the principal here
      credential: string, the supervisor's PIN (SupervisorStepUp.credential); compared, never stored or logged
      permission: Permission, the asking operation's x-ticvai-permission (contracts/shared/permissions.yaml)
      scopePath: ltree, the scope the asking operation acts at (its venue or workstation)
      reversedPrincipalId: uuid or null, whose act is being reversed, where the asking operation forbids self-approval
    returns:
      verified: boolean
      refusal: one of credentialWrong, credentialLocked, noPin, permissionNotHeld, notActiveHere, selfApproval; null when verified
      lockedUntil: date-time or null, when refusal is credentialLocked
    rule: 'common.yaml SupervisorStepUp: the PIN matches the principal''s current `pin` row in identity.principal_credential
      (PHC hash with the tenant''s Key Vault pepper, ADR-0071) and the row is not locked; the principal is active, holds
      `permission` at `scopePath` through a live grant, and is not `reversedPrincipalId`. A wrong PIN counts towards
      PasswordPolicy.pinLockoutAfterAttempts exactly as at sign-in. Any refusal is the asking operation''s 403
      `supervisor-step-up-refused` and nothing is written by it.'
    served: [in-process, service]
    operation: verifySupervisorStepUp
  # **The anonymous guest session, opened and ended for Orders** (ADAM CR-183, option A, decided 21 October 2026;
  # CHG-R9CR-002). Identity mints and keeps its own sessions; Orders only asks, in process within commerce (ADR-0055
  # rule 3: another module writes only through the owner's in-process API).
  openAnonymousGuestSession:
    module: identity
    inputs:
      cartId: uuid, the orders.cart createCart has just written in the same transaction (Cart.id)
      deviceId: uuid, the client UUIDv7 the app sent as createCart's deviceId; the token is bound to it
    returns:
      sessionId: uuid, the new session's id, the token's `sid`
      token: string, the guestAuth access token createCart returns as Cart.anonymousSessionToken
    rule: 'Called by orders.createCart only, for a caller with no credential (CHG-R8SPN-031). Identity opens a guest
      session with **no subject**, bound to `cartId` and `deviceId`, and signs its token with the key every guestAuth
      token is signed with (Orders never holds it). The session is kept where every guest session is, in Identity''s
      session registry (GuestSession, Redis, persistence none), with its cart and device beside it; no row is written to
      identity.guest_session or identity.session, which both need a subject or a principal. It slides like any guest
      session (30 days, guestAuth). Its token reaches the cart operations and nothing that needs a known guest
      (guestAuth); a call under it acts on its own cart only: Orders runs that cart''s statements under the routed
      tenant''s root grant once Identity has verified the token and its cart, as a verified order access token reads its
      one order (getOrder, ADAM CR-191). A second call for the same cart and device returns the session already open
      (the createCart Idempotency-Key makes a retry return the first answer anyway).'
    served: [in-process]
  endAnonymousGuestSession:
    module: identity
    inputs:
      cartId: uuid, the anonymous cart claimCart has just moved to the signed-in guest
    returns:
      endedSessions: integer, 0 or 1; 0 when no anonymous session is open for that cart (not an error)
    rule: 'The other half of openAnonymousGuestSession, on the same in-process API (ADAM CR-183, option A; CHG-R9CR-002).
      Called by orders.claimCart once the cart is the guest''s: Identity ends the anonymous session bound to `cartId`
      in its session registry, so its token is refused at its next request (the registry is read on every request).
      The guest''s own signed-in session is not touched.'
    served: [in-process]
  # **Data reads other modules ask this module for** (MOD audit, 14 October 2026, CHG-MOD-001): one query per
  # table, instead of a raw read of it (check-cross-module-reads XR-UNCOVERED; ADR-0055 rule 2, amended
  # 14 October). Rule questions keep queries of their own, above.
  delegatedAccessRecords:
    module: identity
    table: identity.delegated_access
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The identity.delegated_access rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/DelegatedAccess'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.delegated_access rows, as it stores them and as the caller's
      scope lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Identity implements, and asked from another
      deployable through Identity's service route (serviceAuth).
    served: [in-process, service]
  principalRecords:
    module: identity
    table: identity.principal
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The identity.principal rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/Principal'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.principal rows, as it stores them and as the caller's scope
      lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Identity implements, and asked from another
      deployable through Identity's service route (serviceAuth).
    served: [in-process, service]
  roleRecords:
    module: identity
    table: identity.role
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The identity.role rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/Role'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.role rows, as it stores them and as the caller's scope lets
      it see them (the table's row-level security, under the caller's connection and transaction). It decides
      nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and a
      question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Identity implements, and asked from another
      deployable through Identity's service route (serviceAuth).
    served: [in-process, service]
  rolePermissionRecords:
    module: identity
    table: identity.role_permission
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The identity.role_permission rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/RolePermission'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.role_permission rows, as it stores them and as the caller's
      scope lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
      process within commerce, through the C# query interface Identity implements.
    served: [in-process]
  segregationRuleRecords:
    module: identity
    table: identity.segregation_rule
    inputs:
      ids: {type: array, items: {type: string, format: uuid}, description: 'The identity.segregation_rule rows asked for, by id.'}
      where: {type: object, additionalProperties: true, description: 'Or the rows whose columns equal these values (a key the asker holds, such as subjectId, orderId or venueId); ids and where together narrow.'}
    returns:
      type: array
      description: 'The rows found, each as Identity stores it; an id with no visible row is absent.'
      items: {$ref: '#/components/schemas/SegregationRule'}
    rule: >-
      A data read, not a rule question (MOD audit of 14 October 2026, CHG-MOD-001; ADR-0055 rule 2 as amended 14
      October). Identity answers with its identity.segregation_rule rows, as it stores them and as the caller's
      scope lets it see them (the table's row-level security, under the caller's connection and transaction). It
      decides nothing: an asker that refuses or chooses on these rows states that rule in its own operation, and
      a question with a rule of its own (open, live, sellable) is declared as a query of its own. It is asked in
