        **No fixed default roles: the seeded sets are presets** (decided 2 October 2026, Chinmay, batch 1
        ADM-554 and the pre-apply round; DEC-007; CHG-CSP-003). Chinmay: *"Default permission configs, so
        to speak. We still have checklists: if they select Viewer, for example, they can still give that
        viewer more permissions and rename it."* A new tenant starts with no roles. Creating one shows the
        per-module permission checklist (`listModuleCapabilities`) and the presets
        (`listCapabilityTemplates`: All, Viewer and Mid-level for each module, and the five starting
        configurations Cashier, Supervisor, Venue Manager, Finance and Tenant Admin that
        `docs/active/seed-data-proposal.md` section 2 drafted as roles, audit R229). **Picking a preset
        fills the checklist and binds nothing**: every tick stays editable (`setRolePermissions`), the role
        is renamed with `updateRole`, and `Role.presetCode` only records where it started. Who may promote
        or publish an AI model is whichever role holds that module''s permission (ADR-0051, AI-D16).


        `Role.isSystem` stays on the wire for clients built at r1 and is false on every role a tenant
        creates from 2 October.


        **Roles are tenant-wide; a venue-scoped caller reads them all, read-only** (decided 14 October 2026,
        ADAM CR-076; CHG-IDR-001). A role is defined once for the tenant (`Role.code` is unique per tenant)
        and granted anywhere in the tree, so a venue manager holding `ROLE_MANAGE` at the venue lists every
        role of the tenant, with its own permissions, in order to grant it. Creating, renaming or changing
        the permissions of a role (`createRole`, `updateRole`, `setRolePermissions`) needs `ROLE_MANAGE` at
        the tenant scope; a screen shows those controls disabled to a caller whose `ROLE_MANAGE` is held
        only beneath the tenant.


        **`principalCount` and `grantCount` are computed on read under row-level security** (ADAM CR-077;
        CHG-IDR-002): from the role''s live grants in `identity.delegated_access`, counting only the grants
        and principals the caller''s grants let it read. A venue manager''s count is the venue''s, not the
        tenant''s.


        **Ordered by `name` ascending, `id` as the tiebreak** (ADAM CR-077; CHG-IDR-002).

        '
