      required:
      - attribute
      - operator
      properties:
        attribute:
          type: string
          enum:
          - user.attribute
          - employee.attribute
          - employee.onShift
          - membership.tier
          - membership.status
          - accreditation.type
          - accreditation.status
          - customer.segment
          - resource.classification
          - venue.attribute
          - venue.id
          - attraction.attribute
          - device.kind
          - device.id
          - device.trusted
          - time.ofDay
          - time.dayOfWeek
          - time.season
          - time.withinOperatingHours
          - event.id
          - event.status
          - capacity.utilisationPercent
          - occupancy.level
          - risk.score
          - ticket.status
          - location.scopePath
        key:
          type: string
          nullable: true
          description: For the `*.attribute` forms — which attribute, by code.
        operator:
          type: string
          enum:
          - equals
          - notEquals
          - in
          - notIn
          - greaterThan
          - lessThan
          - between
          - contains
          - startsWith
          - exists
        value:
          nullable: true
          description: 'The single comparand for `equals`, `notEquals`, `greaterThan`, `lessThan`,
            `contains` and `startsWith` — a string, number or boolean, by the attribute. Null for
            `exists`; `in`, `notIn` and `between` use `values`.

            '
        values:
          type: array
          items:
            type: string
