        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          description: 'The username and credential do not match (`unauthenticated`; one answer for an unknown
            username and a wrong credential), or the principal signs in only through the tenant''s single sign-on
            (`sso-sign-in-required`, 14 October 2026, CHG-CRD-001): `detail` names the provider so the door can offer
            `startSsoAuthorization`. **Every wrong-credentials 401 (`unauthenticated`) carries `attemptsRemaining`**
            (ADAM CR-170, option D, decided 19 October 2026; CHG-CRA-009; the lead''s reading of 19 October 2026,
            narrowed and confirmed on 20 October 2026, CHG-R8DEC-001: every wrong-credentials 401 `login` returns, never
            `sso-sign-in-required`; `verifyMfaChallenge` carries it on its wrong-code 422, not on its 401): the wrong attempts left before the lock, **counted per
            submitted username whether or not a principal has it, and per sign-in method** (password, PIN, card,
            RFID), so an unknown username has its own counter and its own lock for each method, as a known one
            does, and nothing in the answer reveals which usernames exist. `sso-sign-in-required` checks no
            credential, spends no attempt and does not carry `attemptsRemaining`.'
          x-ticvai-problem-types:
          - unauthenticated
          - sso-sign-in-required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/LoginDeniedProblem'
        '409':
          x-ticvai-problem-types: [session-active-elsewhere, workstation-in-use]
          description: 'An active session already exists for this principal on another device. Per §3.1.3
            the new login is refused. A supervisor with the SESSION_FORCE_LOGOUT permission may terminate
            the existing session. **The same holds on a till somebody else is signed in to**: the sign-in
            is refused until a supervisor ends the other session with `forceLogout`; signing in never ends
            it (confirmed 28 September, audit R184). **The answer says since when and on what**
            (`SessionHeldProblem`: `openedAt` and `deviceLabel` of the session held; ADAM CR-170, CHG-CRA-009).

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SessionHeldProblem'
        '429':
          description: 'The request budget is exceeded (`rate-limited`), or this principal''s password or PIN is
            locked after too many wrong attempts (`credential-locked`, 14 October 2026, CHG-CRD-001; an unknown
            username is locked the same way after its own wrong attempts, ADAM CR-170, so the lock reveals nothing):
            `PrincipalCredential.lockedUntil` is in the future, and `Retry-After` says when it ends. The lock is
            temporary (`PasswordPolicy.lockoutMinutes`) and per method: a locked PIN leaves a password sign-in open.
            An unknown username has no `PrincipalCredential`; its lock is held with its own counter, per method,
            for the same time, and answers the same way.'
          x-ticvai-problem-types:
          - rate-limited
          - credential-locked
          headers:
            Retry-After:
              $ref: '../shared/common.yaml#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /auth/guest/verify-email:
    post:
      operationId: verifyGuestEmail
      x-ticvai-consumed-by:
        - "P01 WEB-013 Booking Confirmation"
        - "P01 WEB-016 Login / Register"
        - "P01 WEB-020 Profile & Preferences"
        - "P02 GST-010 Booking Confirmation"
        - "P02 GST-042 Simple Registration & OTP"
        - "P02 GST-073 Security & Sign-in"
      x-ticvai-read-via:
      - query: tenancy#venueSettingsRecords
        route: in-process
        for: 'the venue''s guest code attempt limit (VenueSettings.identity), Tenancy''s data (r8 integration, CHG-R8INT-014)'
      x-ticvai-write-via:
      - table: marketing.message_dispatch
        operation: sendTransactionalMessage
      security:
      - guestAuth: []
      - {}
      summary: Send a verification link, or consume one
      description: '**Two ways to prove the address, one operation** (R8 blocker fix, IDENTITY-C38). The approved screens
        (WEB-013, GST-010, GST-073) ask for a **six-digit code**, so `mode` `code` takes it in `code`: checked against the
        guest''s `identity.otp_challenge` row with purpose `emailVerification` and channel `email`, within the venue''s attempt
        limit (`VenueSettings.identity.guestOtpMaxAttempts`); a wrong code is `422 email-code-invalid` with
        `attemptsRemaining`, as `verifyMfaChallenge` answers, and the last wrong one voids the code (`410
        verification-token-expired`; ask for a new `send`). The session is the guest''s own (`guestAuth`), so the code needs no
        address. The link path (`send` an emailed single-use link, `confirm` its `token`) stays for emailed links.

        **Raised in review by Deep.** `registerGuest` creates an account and nothing verifies
        the address on it — and **a guest account with an unverified email can receive somebody else''s
        tickets**, because a transfer is offered to an address.

        Two modes on one operation: **`send` issues a single-use token; `confirm` consumes it.** One operation
        because they are one act with two halves, and splitting them invites a `confirm` that works without
        a `send`.

        **An unverified account does not buy — decided 17 September 2026**, replacing *unverified accounts
        still buy*, which this description said while `registerGuest` and `GuestSession.isVerified` said
        the opposite. Tickets go to an address, and an unproven address is how somebody receives a
        stranger''s tickets.

        **On the guest web and the guest app, the site''s `guestCheckout` feature decides the route**
        (requirement matrix 2.6.28 and 2.6.67 — guest checkout, configurable per site). It is **off by
        default**.

        **The gate is the checkout page, not the cart** ([ADR-0045](../../docs/adr/0045-every-order-carries-a-proven-contact.md),
        18 September 2026, matrix 2.6.1 §2.4: *"On the check out page, users can log in or manually
        fill in the following details"*). The cart is open to anyone; `checkoutCart` refuses until one
        of the two routes has completed.

        - **Off:** the guest signs in, verified, at checkout. `WEB-011` and `GST-041` carry the fork.

        - **On:** the guest may check out without an account, and proves the email or mobile the tickets
        go to with a one-time code at checkout (`requestGuestOtp`, purpose `verify`) — the *dual OTP
        validation* of the reference checkout the client walked through.

        **Both routes produce a guest profile**, because the tickets have to go somewhere and the order
        has to belong to something. **A one-time checkout profile carries no credential** — recalling
        previous transactions needs access set up separately (matrix 2.6.29), which is what
        `linkGuestCheckout` does from the other direction.

        **A returning verified contact attaches to the profile already held** (matrix 22.2.8) — the new
        order, its tickets and its history, automatically, with no duplicate record. **It does not open
        that profile.** The guest sees the order just placed and nothing earlier until they authenticate
        as its owner: a code proves someone controls the mailbox today, which is enough to route a ticket
        there and not enough to hand over a history. **Any match that is not a verified contact** —
        passport, national id, an unproved phone, a similar name — **is a suggestion for the staff review
        of matrix 7.3.7**, with its audit log and rollback. A merge takes the narrower of two consents
        (CF-160).

        **The kiosk is exempt.** A walk-up pays at the kiosk and takes printed tickets, so there is no
        address to prove (matrix 2.1.10). An unverified account also cannot *receive a transfer* or
        *reset a password*, for the same reason.

        '
      tags:
      - identity
      # No staff permission: a guest or a visitor proves their own address (ADR-0025; R8 blocker cause IDENTITY-C28,
      # CHG-R8SPN-025). GUEST_VIEW was a staff permission no guest holds, so nothing could be refused for lacking it.
      x-ticvai-permission: null
      x-ticvai-audience:
      - guest
      - anonymous
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - send
                  - confirm
                  - code
                code:
                  type: string
                  nullable: true
                  pattern: '^[0-9]{6}$'
                  description: For `code`. The six digits emailed by `send` or by `registerGuest` with channel `email`.
                token:
                  type: string
                  nullable: true
                  description: 'For `confirm`. **Single use and short-lived** — a verification link that
                    works forever is a verification link in an old inbox. **Valid for 24 hours and sent by
                    email only** (decided 28 September, audit R126); after that `confirm` answers `410`
                    and `send` issues a new one.

                    '
      responses:
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Sent, or verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  isVerified:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
        '422':
          description: 'A wrong code (`mode` `code`), attempts one up to the limit; `attemptsRemaining` says how many are left.'
          x-ticvai-problem-types: [email-code-invalid]
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/MfaCodeInvalidProblem' }
        '410':
          x-ticvai-problem-types: [verification-token-expired, verification-token-used]
          description: '**The token expired or was already used.** Distinct from an invalid one — a guest
            who clicked an old link should be offered a new one rather than told they are wrong.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
