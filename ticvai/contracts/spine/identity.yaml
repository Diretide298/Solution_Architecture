    SubjectHolding:
      x-ticvai-persistence: identity.subject_holding
      # One row per order or entitlement: an entitlement has one holder at a time (CHG-GDL-001).
      x-ticvai-unique-together:
      - [holdingKind, holdingId]
      type: object
      description: >-
        **What a guest still holds, as Identity knows it** (ADAM CR-084, decided 14 October 2026, CHG-GDL-001).
        A projection Identity keeps of the orders and entitlements each subject holds, so that
        `deleteGuestAccount` can refuse while an open order or a live entitlement remains, and
        `exportSubjectData` can list them, without reading `orders.sales_order` or `access.entitlement`
        (Identity is Foundation and reads nothing above it, ADR-0028; Access is another deployable, ADR-0055 rule
        4). **Never returned by any operation**: this schema exists to say where the projection lives, like
        `GuestCredential`. No operation writes it; Identity's consumers of the order and entitlement events do,
        as `identity.membership_history` is written from `entitlement.statusChanged`.


        **Fed by** (each event file lists the identity consumer): `order.created` (a `pending` row, when the
        order names a subject, or with no subject yet for a guest checkout), `order.linkedToGuest` (the subject
        set on a guest-checkout order's row and its entitlements' rows when `linkGuestCheckout` attaches it,
        CHG-GDL-003), `order.paid` (`paid`), `order.completed` (`completed`), `order.cancelled`
        (`voided`), `order.lapsed` (`failed`, or `voided` when the payment window passed or a parked sale
        expired), `order.refunded`
        (`refunded` or `partiallyRefunded`, and the refunded lines' entitlement rows `cancelled`),
        `entitlement.issued` (an `issued` row with `validTo`), `entitlement.voided` (`cancelled`),
        `entitlement.transferred` (the row moves to the new holder), `entitlement.reissued` (the old row
        `cancelled`, a new `issued` row for the same holder), `entitlement.statusChanged` (the new `validTo`)
        and `guest.merged` (the merged subject's rows move to the survivor). Status changes no event carries
        (a scan using up a pass, an expiry) are left to `validTo`: a pass used up before its `validTo` still
        counts as live until then, which errs on the side of not stranding a guest.


        **The rules are the owners'**: `orders#openOrdersForSubject` (open = `pending`, `held`,
        `partiallyPaid`, `paid`) and `access#liveEntitlementsForSubject` (live = `issued` or
        `partiallyConsumed` with `validTo` ahead), declared in their contracts with `served: [projection]`.
      required: [holdingKind, holdingId, status, updatedAt]
      properties:
        subjectId:
          type: string
          format: uuid
          nullable: true
          # A declared reference, so the derived DDL gives subject_id its foreign key and its index: the erasure
          # check and the export look rows up by subject (CHG-GDL-003). pii.subject is tombstoned, never deleted.
          x-ticvai-references: pii.subject
          description: The guest who holds it (`pii.subject`). Null only for a guest-checkout order, and the
            entitlements issued from it, not yet attached to an account; `order.linkedToGuest` sets it. The table
            is under subject row-level security, so a row with no subject is seen only by a tenant-root session,
            which is how the event consumers run.
        holdingKind:
          type: string
          enum: [order, entitlement]
        holdingId:
          type: string
          format: uuid
          description: The order id (`orders.sales_order.id`) or the entitlement id (`access.entitlement.id`).
        orderId:
          type: string
          format: uuid
          nullable: true
          description: For an entitlement, the order it was issued from (null for one an invitation issued), so a
            refund of that order reaches its entitlements.
        orderLineId:
          type: string
          format: uuid
          nullable: true
          description: For an entitlement, the order line it was issued from, so a partial refund reaches only its lines.
        orderNumber:
          type: string
          maxLength: 40
          nullable: true
          description: For an order, its number as the confirmation shows it (`order.created` `orderNumber`), so
            `linkGuestCheckout` finds a guest''s booking here, never in `orders.sales_order` (r10 ruling; CHG-R10ID-018).
        verifiedContactRef:
          type: string
          maxLength: 128
          nullable: true
          description: For a guest-checkout order, the keyed hash of its verified checkout contact (`order.created`
            `verifiedContactRef`, ADR-0045); `linkGuestCheckout` compares the caller''s verified identifier with it.
        status:
          type: string
          maxLength: 40
          description: The owner's status value as the last event applied gave it, an `OrderStatus` value for an
            order and an `EntitlementStatus` value for an entitlement.
        validTo:
          type: string
          format: date-time
          nullable: true
          description: For an entitlement, the end of its validity; null for an order.
        lastEventAt:
          type: string
          format: date-time
          description: The `occurredAt` of the event last applied to the row; an older redelivery changes nothing.
        updatedAt:
          type: string
          format: date-time
    AccessCondition:
      type: object
      description: '**One attribute, one operator, one value** — and the attribute names are an enum
        rather than free text, because a policy that reads `venu.type` silently never matches.

        The enum is the matrix, row by row: user (3.3.7), employee (3.3.8), membership (3.3.9),
        accreditation (3.3.10), customer segment (3.3.11), resource classification (3.3.12), venue
        (3.3.13), attraction (3.3.14), device (3.3.15), day of week (3.3.16), season (3.3.17), event
        (3.3.18), capacity (3.3.19), occupancy (3.3.20), risk score (3.3.21), location (3.3.2) and time
        (3.3.3).

