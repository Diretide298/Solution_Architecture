      x-ticvai-step-up: pin
      x-ticvai-read-via:
      - query: identity#verifySupervisorStepUp
        route: in-process
        for: 'the PIN step-up in the X-Supervisor-Principal-Id and X-Supervisor-Pin headers is checked by Identity, never by reading identity.* here (CHG-CRD-004, ADAM CR-078); same deployable (commerce): the C# query interface Identity implements, in the caller''s transaction (ADR-0055 rule 2)'
      x-ticvai-step-up-reason: On the POS-000 door nobody at the till has a session, so a supervisor's own PIN on the device authorises seeing who holds it (CHG-RUL-015; audit R184).
      x-ticvai-step-up-carrier: header:X-Supervisor-Principal-Id,X-Supervisor-Pin
      x-ticvai-step-up-when: sessionless
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      # No session on the POS-000 door (CHG-RUL-015): `{}` admits the call without a token, under the step-up.
      security:
      - bearerAuth: []
      - {}
      parameters:
      - name: X-Supervisor-Principal-Id
        in: header
        required: false
        description: With no session (POS-000), the supervisor signing the step-up (CHG-RUL-015). Ignored with a session.
        schema:
          type: string
          format: uuid
      - name: X-Supervisor-Pin
        in: header
        required: false
        description: With no session (POS-000), the supervisor's staff PIN, as `SupervisorStepUp.credential`
          (CHG-RUL-015). Never logged, stored or echoed. Ignored with a session.
        schema:
          type: string
          maxLength: 512
          format: password
      - name: venueId
        in: query
        description: Exact match on `ActiveSession.venueId`.
        schema:
          type: string
          format: uuid
      - name: principalId
        in: query
        description: Exact match on `ActiveSession.principalId`.
        schema:
          type: string
          format: uuid
      - name: workstationId
        in: query
        description: 'Exact match on `ActiveSession.workstationId` — **who holds this till**, which
          `POS-000 Sign In` asks before offering a force-logout, without paging through every session
          in the venue.

          '
        schema:
          type: string
          format: uuid
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ActiveSession'
        '403':
          description: The caller lacks SESSION_FORCE_LOGOUT, or, with no session, the supervisor step-up is
            missing or failed, or `workstationId` is missing (`supervisor-step-up-refused`; CHG-RUL-015).
          x-ticvai-problem-types:
