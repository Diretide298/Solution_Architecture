        lives, as `GuestCredential` does for guests.


        **One current row per principal and method** (`password`, `pin`), unique on the pair. `createPrincipal` writes
        the first one from `initialCredential`; `resetPrincipalCredential` and `changeOwnCredential` replace the hash in
        place and move the replaced hash into `history`. `login` (and `forceLogout`, and `verifySupervisorStepUp` for a
        supervisor''s PIN) reads it, counts failures in `failedAttempts` and, at the tenant''s threshold
        (`PasswordPolicy.lockoutAfterAttempts` for a password, `PasswordPolicy.pinLockoutAfterAttempts` for a PIN), sets
        `lockedUntil` to now plus `PasswordPolicy.lockoutMinutes`; a correct credential resets the count. **A principal
        provisioned by single sign-on** (`Principal.ssoProviderId` set) has no `password` row here, and a `pin` row only
        once `resetPrincipalCredential` issues a till PIN.'
      required: [principalId, method, credentialHash, setAt, failedAttempts]
      properties:
