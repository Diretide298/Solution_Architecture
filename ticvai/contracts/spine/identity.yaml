        conflict at use time catches it too late — but a rule that only polices future grants
        leaves the venue holding the control and not the finding.

        **This is deliberately a report and not an action.** The two automatic answers are both
        wrong: revoking on rule creation strands a venue mid-shift, and doing nothing leaves real
        exposure unreported. **A person decides, and this is what they read.**

        **Violations covered by `allowWithCompensatingControl` are flagged rather than filtered.**
        A queue that hides what has been excused stops measuring the thing it exists to measure.

        **Where `requireApproval` and `warn` surface** (decided 14 October 2026, ADAM CR-079; CHG-IDR-003).
        Only a `block` rule refuses a role edit or a grant; the other two severities are accepted, and every
        principal they leave holding both halves (through a role, its parent role, a direct grant or module
        access) is listed here from the moment the grant is made. A pair held inside one role always overlaps,
        because a role is granted at one scope.

        **Ordered by `detectedAt` descending, then `ruleId` and `principalId` as the tiebreak** (decided
        14 October 2026, ADAM CR-077; CHG-IDR-002): a violation is computed and has no id of its own, and
        `detectedAt` is the latest moment that made the pair, so the newest exposure comes first.

        '
