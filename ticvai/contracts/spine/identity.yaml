          check-cross-module-reads XR-FACT)'
      x-ticvai-audience:
      - staff
      - partner
      summary: Assign a grant
      description: 'Resolution is deny-overrides-allow. A DENY at any node suppresses the permission at
        that node and everything beneath it, and is never overridden by a more specific ALLOW — so a deny
        is a guarantee rather than a default.

        Wildcard is permitted on DENY only. A wildcard allow is an accident waiting to happen.


        **Segregation is checked when a grant is made** (decided 14 October 2026, ADAM CR-079; CHG-IDR-003).
        An ALLOW to a principal is evaluated against every `SegregationRule` with everything the principal
        would then hold: this grant (a single permission, or a role''s own and inherited permissions), its other
        live grants and their roles, and its module access; a `scopeSensitive` rule conflicts only where the
        two scopes overlap (one path contains the other), any other rule wherever both are held. An ALLOW to a
        role is checked the same way for every principal holding the role. **Only `severity: block`
        refuses**, with `409 segregation-breach` naming the rule and both permissions, and nothing is written;
        `requireApproval` and `warn` are accepted and the pair appears in `listSegregationViolations` at once.
