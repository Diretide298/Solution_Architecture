  /guests/{subjectId}/data-export:
    parameters:
    - name: subjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: exportSubjectData
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-066 Privacy & My Data"
      security:
      - guestAuth: []
      - bearerAuth: []
      summary: Everything the platform holds about one guest
      description: 'BL-149. **A subject access request has a statutory clock**, and answering it by hand
        across twenty-seven contracts is how a venue misses it.

        **Assembled from the lineage, not from a hand-written list.** `api-data-lineage.json` already
        knows which tables hold subject data, so the export is derived rather than maintained — **a hand-maintained
        list of personal data is a list that drifts the first time somebody adds a column.**

        Includes what is held and where it came from. **Excludes another guest''s data even where the
        two share a booking**, which is the case that makes this harder than a table dump.


        **The orders and entitlements it lists come from Identity''s own projection** (ADAM CR-084, decided
        14 October 2026, CHG-GDL-002): `identity.subject_holding` (`SubjectHolding`), kept from the order and
        entitlement events, gives each order and entitlement the guest holds with its status and validity.
        Identity is Foundation and reads nothing above it (ADR-0028), and Access is another deployable
        (ADR-0055 rule 4), so the export reads neither orders.sales_order nor access.entitlement.


        **The request is an Approvals request, as for `deleteGuestAccount`.** `requestId` is the
        `approvals.request` id, raised through Approvals'' in-process `createApprovalRequest` (ADR-0055 rule
        3); the guest''s own export needs no human approval step and the tenant''s matrix may add one. Only
        where the guest is linked across cells (`GuestSession.guestLinkId`; ADR-0010) does the export job also
        call cross-region `createDsarRequest` (`kind: access`, `serviceAuth`), which raises the cross-cell
        sync.dsar_request; an unlinked guest raises no DSAR record.


        **Which request, and who raised it** (ADAM CR-101, accepted 15 October 2026; CHG-R10ID-016). Kind
        `configurationChange`, `subjectContract` `identity`, subject type `subjectDataExport`, `subjectId` the guest''s
        `pii.subject` id (`ApprovalKind`). A guest caller is recorded as the request''s `requestedBySubjectId`, with
        `requestedByPrincipalId` null; a staff caller (`GUEST_VIEW_PII`) as `requestedByPrincipalId`.


        **The export job and the file** (CR-101). The call writes an `identity.subject_data_export` row
        (`SubjectDataExport`, status `awaitingApproval`; `running` where no request is raised) beside the request. The job runs when the request is approved
        (Identity consumes `approval.granted` for subject type `subjectDataExport`), or at once where the tenant''s
        matrix asks for no approval step; a rejected, withdrawn or expired request ends the row `rejected` with no file.
        **No matrix means it runs at once** (the lead, 25 October 2026, r10 round 3; CHG-R10ID-024): where Approvals
        answers `createApprovalRequest` with `no-approval-route` (no rule of the tenant''s matrix matches the subject
        type), no request is raised, the job runs at once, and `requestId` is the export''s own id (a UUIDv7 Identity
        mints), used the same way by the privacy case.
        The job writes the file in the asked format to the tenant''s private object storage and sets the row `ready`.
        **The file is kept 7 days** from `readyAt` (r10 round 3): then the job deletes it and the row becomes `expired`;
        a guest who needs it again asks again.
        **The guest and staff read where it has got to, and download it, with `getSubjectDataExport`**, which issues
        a short-lived signed link to a `ready` file; no link is ever stored or sent by message.


        **The statutory clock** (CR-101). The call emits `identity.privacyRequestRaised`, which Marketing turns into a
        privacy case in its queue (request type `access`), so the request sits in the privacy queue and its `dueAt`
        (the jurisdiction''s configured response period) applies. **The jurisdiction is the country of the venue the
        request is raised at** (the request''s venue, CR-198; the lead, 25 October 2026, r10 round 3), carried on the
        event, and **the case carries the request id** (`approvalRequestId`), so the queue and the request are one. **The statutory period itself is the client''s to
        give** (`setPrivacyRequestTypes` `deadlines[].responseDays`); until it is configured the queue shows no
        deadline, and `estimatedCompletionAt` stays null.


        **Which tables it reads** (CR-101). The table set comes from the derived subject-data marker, not from a list
        kept by hand: a table holds a guest''s data when its declared storage has a `subject_id` column, and
        `handoff/subject-data-register.json` (derived each refresh by `tools/derive-subject-data-register.py`, r8 cause
        IDENTITY-C65, CHG-R8GEN-015) lists every such table under the module that owns it, so a new table joins the
        export by its own column. Identity reads its own tables directly; every other owner answers through its
        `subjectDataRecords(subjectId)` query, which this operation asks in turn as each owner declares it. Until an
        owner has declared it, the export assembles that owner''s data from what the lineage lists for this operation
        today.


        **An erased guest** (CR-101). A subject whose `pii.subject` row is tombstoned (`is_erased` true) is answered
        `410 subject-erased` and nothing is raised: there is nothing left to export, and the tombstone is the record
        that the erasure was done.

        '
      x-ticvai-read-via:
      - query: access#liveEntitlementsForSubject
        route: projection
        for: which entitlements the export reports as live
      - query: orders#openOrdersForSubject
        route: projection
        for: which orders the export reports as open
      x-ticvai-writes:
      - table: identity.subject_data_export
        for: 'the export''s row, status awaitingApproval where a request was raised, else running (no matrix means it
          runs at once, CHG-R10ID-024), which the export job moves on (ADAM CR-101, CHG-R10ID-016, CHG-R10GFC-001)'
      tags:
      - identity
      x-ticvai-emits:
      - identity.privacyRequestRaised
      x-ticvai-permission: GUEST_VIEW_PII
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                  - json
                  - csv
                  - pdf
                  default: json
      responses:
        '202':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: 'Export started, as an Approvals request (and, for a guest linked across cells, a
            cross-cell sync.dsar_request raised by `createDsarRequest`). The same shape
            `deleteGuestAccount` returns for an erasure request, so a guest''s two privacy requests read
            alike.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - requestId
                - format
                properties:
                  requestId:
                    type: string
                    description: The `approvals.request` id of the export request (raised through Approvals'
                      `createApprovalRequest`), CHG-GDL-002.
                  format:
                    type: string
                    enum:
                    - json
                    - csv
                    - pdf
                    description: The format asked for, or `json` when the request named none.
                  estimatedCompletionAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Null until a response period reaches Identity, as for `deleteGuestAccount`
                      (the periods are marketing-crm `setPrivacyRequestTypes` `deadlines[].responseDays`, which
                      Identity does not read).
        '404':
          description: 'No such guest, or a guest caller naming a subject that is not its own (never 403, which would
            confirm the subject exists). Nothing is raised (ADAM CR-101; CHG-R10ID-016).'
          x-ticvai-problem-types: [not-found]
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '410':
          description: 'The guest was erased (`pii.subject.is_erased` true): there is no data left to export, and nothing
            is raised (`subject-erased`; ADAM CR-101, CHG-R10ID-016).'
          x-ticvai-problem-types: [subject-erased]
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
