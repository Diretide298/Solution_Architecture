        properties:
          attemptsRemaining:
            type: integer
            minimum: 0
            description: Wrong attempts left for this username and this sign-in method before they are locked.
              Present on every `unauthenticated` 401 `login` returns, for a known and an unknown username alike;
              absent on `sso-sign-in-required`.
    SessionHeldProblem:
      x-ticvai-persistence: none — error shape
      description: '**`login`''s 409** (ADAM CR-170, CHG-CRA-009): the session that refuses this sign-in, so the
        door says since when and on what (PTR-001''s sessionHeld state). With `session-active-elsewhere` it is this
        person''s own session on another device; with the other cause (the till is in use) it is the session
