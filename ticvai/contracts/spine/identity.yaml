              enum: [credentialChange, mfa, roleSelection]
    MfaCodeInvalidProblem:
      x-ticvai-persistence: none — error shape
      description: '**`verifyMfaChallenge`''s 422** (ADAM CR-170, CHG-CRA-009): the shared Problem and the wrong
