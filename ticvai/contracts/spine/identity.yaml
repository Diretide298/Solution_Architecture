      x-ticvai-persistence: identity.subject_holding
      # One row per order or entitlement: an entitlement has one holder at a time (CHG-GDL-001).
      x-ticvai-unique-together:
      - [holdingKind, holdingId]
      type: object
      description: >-
        **What a guest still holds, as Identity knows it** (ADAM CR-084, decided 14 October 2026, CHG-GDL-001).
        A projection Identity keeps of the orders and entitlements each subject holds, so that
        `deleteGuestAccount` can refuse while an open order or a live entitlement remains, and
        `exportSubjectData` can list them, without reading `orders.sales_order` or `access.entitlement`
        (Identity is Foundation and reads nothing above it, ADR-0028; Access is another deployable, ADR-0055 rule
        4). **Never returned by any operation**: this schema exists to say where the projection lives, like
        `GuestCredential`. No operation writes it; Identity's consumers of the order and entitlement events do,
        as `identity.membership_history` is written from `entitlement.statusChanged`.


        **Fed by** (each event file lists the identity consumer): `order.created` (a `pending` row, when the
        order names a subject, or with no subject yet for a guest checkout), `order.linkedToGuest` (the subject
        set on a guest-checkout order's row and its entitlements' rows when `linkGuestCheckout` attaches it,
        CHG-GDL-003), `order.paid` (`paid`), `order.completed` (`completed`), `order.cancelled`
        (`voided`), `order.lapsed` (`failed`, or `voided` when the payment window passed or a parked sale
        expired), `order.refunded`
        (`refunded` or `partiallyRefunded`, and the refunded lines' entitlement rows `cancelled`),
        `entitlement.issued` (an `issued` row with `validTo`), `entitlement.voided` (`cancelled`),
        `entitlement.transferred` (the row moves to the new holder), `entitlement.reissued` (the old row
        `cancelled`, a new `issued` row for the same holder), `entitlement.statusChanged` (the new `validTo`)
        and `guest.merged` (the merged subject's rows move to the survivor). Status changes no event carries
        (a scan using up a pass, an expiry) are left to `validTo`: a pass used up before its `validTo` still
        counts as live until then, which errs on the side of not stranding a guest.


        **The rules are the owners'**: `orders#openOrdersForSubject` (open = `pending`, `held`,
        `partiallyPaid`, `paid`) and `access#liveEntitlementsForSubject` (live = `issued` or
        `partiallyConsumed` with `validTo` ahead), declared in their contracts with `served: [projection]`.
