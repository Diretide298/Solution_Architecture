  /permission-findings:
    get:
      operationId: listPermissionFindings
      x-ticvai-consumed-by:
        - "P08 BO-054 Role Assignment"
        - "P08 BO-1066 Roles, Permissions & Masking"
      x-ticvai-agreed: '29 September: our build plan (7.1.47 "identify conflicts, missing permissions and excessive
        permissions"); shape follows listSegregationViolations, paged with the Page envelope'
      summary: Excessive, missing and conflicting permissions, per principal or role
      description: '7.1.47 (decided 29 September, build pass). **The analysis half of the sandbox**:
        `simulateAuthorisationPolicy` shows what a draft would decide, and this says what is wrong with the grants as
        they stand, or as they would stand with a draft policy active (`draftPolicyId`).


        Three kinds of finding, each with the evidence that produced it:

        - **`excessive`**: a permission a principal holds (by role, delegation or policy) that no decision in
        `lookbackDays` used. Recommendation `revoke`.

        - **`missing`**: a permission the principal was denied `deniedThreshold` times or more in the window,
        which most holders of the same role at the same scope do hold. Recommendation `grant` or `review`.

        - **`conflicting`**: a pair a `SegregationRule` forbids, held together (the same test
        `listSegregationViolations` runs), so one screen shows all three.


        **The thresholds and the sources** (decided 25 October 2026, Chinmay, ADAM CR-210 option A;
        CHG-R10ID-003):

        - **`missing`, by peer share.** The principal was denied the permission `deniedThreshold` times or more
        in the window, and of the peers with the same role at the same scope (`peersHoldingPercent`): **at least
        50%** hold it -> a finding with recommendation `grant`; **25% to under 50%** -> recommendation `review`;
        **under 25%** -> no finding.

        - **`excessive`, by recorded use.** Usage is read from `identity.access_decision`. **Every authorisation
        check the host makes writes an `access_decision` row** (the per-scope check of every operation, not only
        `evaluateAccess`; summarised per principal, permission, scope and day where the volume needs it), so a
        permission used by ordinary operations is never flagged.

        - **Held by policy** means the permissions an active `AuthorisationPolicy` allows for the principal at the
        scope (with `draftPolicyId`, that draft as if active), beside those held by role and by delegation.


        **Advisory.** Nothing is revoked or granted by this read; a change goes through `createDelegatedAccess`,
        the role, or a policy, with their approvals.


        **Ordered by `kind` (`conflicting`, then `missing`, then `excessive`), then `permission` ascending, with
        `principalId`, `roleId` and `scopePath` as the tiebreak** (decided 14 October 2026, ADAM CR-077;
        CHG-IDR-002): a finding is computed and has no id of its own, and BO-054 and BO-1066 put the conflicts
        a person must act on before the clean-up.

        '
      tags:
      - administration
      x-ticvai-permission: PERMISSION_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: principalId
        in: query
        schema:
          type: string
          format: uuid
      - name: roleId
        in: query
        schema:
          type: string
          format: uuid
      - name: scopePath
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - excessive
          - missing
          - conflicting
      - name: lookbackDays
        in: query
        description: The usage window for `excessive` and `missing`. Proposed default 90 (our build plan).
        schema:
          type: integer
          minimum: 7
          maximum: 365
          default: 90
      - name: deniedThreshold
        in: query
        schema:
          type: integer
          minimum: 1
          default: 3
      - name: draftPolicyId
        x-ticvai-column: identity.authorisation_policy.id
        in: query
        description: Evaluate as if this draft `AuthorisationPolicy` were active, so a policy can be checked for the
          grants it would widen or leave missing before it is submitted.
        schema:
          type: string
          format: uuid
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Findings
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/IdentityPermissionFinding'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
