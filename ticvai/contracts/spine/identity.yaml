      summary: Length, breach check, lockout and step-up
      description: 'BL-144. **Modelled on NIST SP 800-63B rather than on habit.** Length beats composition,
        and `requireBreachCheck` stops more account takeovers than every composition rule combined.

        **`maxAgeDays` defaults to null on purpose** — forced rotation produces `Summer2026!` becoming
        `Summer2027!`. It exists because some tenants are contractually obliged to have it.

        **The PIN rule is the tenant''s choice, from three drop-downs** (decided by Chinmay, 14 October 2026, ADAM
        CR-078; CHG-CRD-002): `pinLength` (4, 6 or 8 digits), `pinReusePrevention` (none, last 3, last 5) and
        `pinLockoutAfterAttempts` (3, 5 or 10). This operation and `getPasswordPolicy` carry them with the rest of the
        policy. **The floor rules apply to passwords only** (audit R126: `minLength` never below 8, the
        `mfaRequiredForPermissions` floor); a value outside a PIN setting''s options is a 400 like any other enum.

        '
      tags:
