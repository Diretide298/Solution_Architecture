      summary: A platform operator opens a time-boxed grant into this tenant
      description: '**How a TICVAI operator acts inside a tenant — decided 28 September, audit R098.** The
        Platform Console (P09) runs outside every cell, and its tenant screens call operations that live
        in the tenant''s cell. The operator **picks a tenant, then opens a grant here**, in that tenant''s
        cell: it names the permissions it carries, a reason and a window. Until it is open, a platform
        token carries no tenant permission at all; while it is open, the cell resolves the operator''s
        permissions from the grant, at tenant scope, and nothing else.

        **`PLATFORM_*` permissions never ride in a grant; they are read from the platform token** (decided
        28 September, audit R203). A cell honours one only on the few operations that name it: this one
        (`PLATFORM_TENANT_ACCESS`), `listOwnPlatformStaffGrants`, and `ai.setAiProvider`
        (`PLATFORM_TENANT_MANAGE`), which in addition requires a grant into the tenant to be open so
        the change is audited against it.

        **Time-boxed at opening and never open-ended**: `expiresAt` is at most 8 hours ahead (proposed,
        client to correct). **Every action under the grant is audited** with the grant''s id
        (`AuditRecord.platformStaffGrantId`) and **the grant itself is listed to the tenant**
        (`listPlatformStaffGrants`). A tenant never has to grant a support role for this, and cannot
        see a platform action that is not tied to a grant.

        Requires step-up: the operator holds `PLATFORM_*` permissions, which require MFA (audit R135).

        **How the cell admits the operator here and in `listOwnPlatformStaffGrants`** (R8 blocker IDENTITY-C20,
        CHG-R8MIG-006; the lead''s answer, option A). The operator is not a principal of this tenant: the cell
        validates the Control Plane token, takes its subject as `operatorPrincipalId` (a plain uuid, no foreign
        key) and reads the MFA step-up from the token''s `amr` claim, never from a tenant session. The transaction
        runs with `ticvai.scope_paths` set to the tenant root and the operator as the audited actor
        (`AuditRecord.platformStaffGrantId` once the grant exists).


        **The token and where the step-up lives** (ADAM CR-175 option A, accepted 21 October 2026; ADR-0072;
        CHG-R10ID-007). The Control Plane token is a JWT signed by the Control Plane, verified against its JWKS
        (trusted by configuration), with this cell as its audience; `sub` is the operator
        (a Control Plane operator, ADR-0072), `ticvai_platform_permissions` the `PLATFORM_*` set, `sid` the platform
        session. The MFA step-up is recorded in the Control Plane on the operator''s platform session and carried
        as `ticvai_step_up` (`{action, at}`) beside `amr`: this operation accepts it when its action names this
        operation and it is at most 5 minutes old, in a token that lives at most 15 minutes (ADR-0072), and never reads `identity.mfa_challenge` for an operator. The
        verification is built in the cell hosts by the platform-auth ticket; until it lands this ticket waits.

        '
      tags:
      - administration
      # Named only to say the operator's step-up is NOT read from it (ADR-0072; CHG-R10ID-007).
      x-ticvai-names-for-context: [identity.mfa_challenge]
      x-ticvai-permission: PLATFORM_TENANT_ACCESS
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-step-up: mfa
      x-ticvai-step-up-carrier: session   # the MFA step-up on the caller's Control Plane token, its amr claim (CHG-R8MIG-006)
      x-ticvai-step-up-reason: Opens a platform operator's access into a tenant's data.
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/TenantId
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - permissions
              - reason
              - expiresAt
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated UUIDv7 for the grant.
                permissions:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: What the operator may do in this tenant while the grant is open. Tenant
                    permissions only; a `PLATFORM_*` value is refused `400`.
                  items:
                    $ref: ../shared/permissions.yaml#/components/schemas/Permission
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                ticketRef:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: The support case this access serves, where there is one.
                expiresAt:
                  type: string
                  format: date-time
                  description: At most 8 hours after opening (proposed, client to correct).
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Open. The operator's calls into this tenant resolve against it until `expiresAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStaffGrant'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
