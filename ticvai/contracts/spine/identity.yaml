        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: '**A role that grants no permissions is not a role.** `Role` carried a code, a
            name and two counts until 18 August, and `identity.role_permission` derived from it with exactly
            one column — `role_id`. **A join table that joins to nothing**, found by Hrushikant in review
            and missed by the schema audit that ran the same day.

            **The audit asked whether every table had columns, a relationship and an owner, and this table
            had all three.** What it did not ask is whether a table with one column can do the job its
            name claims.

            **The role''s own set, not revoked** (decided 14 October 2026, ADAM CR-077; CHG-IDR-002): the
            `identity.role_permission` rows of this role with `is_active` true. A revoked row is history, not
            a permission. **Inherited permissions are not merged in**: a client reads `inheritsFromRoleId` and
            that role, the same shape `setRolePermissions` returns (`permissions` beside `inheritsFromRoleId`).
            The segregation check is the one place the two are taken together (ADAM CR-079).

            '
          items:
            $ref: ../shared/permissions.yaml#/components/schemas/Permission
        inheritsFromRoleId:
          type: string
          format: uuid
          nullable: true
          description: '**Role composition, one level deep and no deeper.** A supervisor role that is
            a cashier plus three permissions is how venues actually describe them.

            **Cycles are refused and depth is capped at one**, because a permission set nobody can read
            off the screen is a permission set nobody audits.

            '
        isSystem:
          type: boolean
          default: false
          description: '**Seeded roles ship and are editable; deleting one is refused.** A venue that
            removes `cashier` and rebuilds it has two roles with one name in the audit log.

            **The seeded system roles are Cashier, Supervisor, Venue Manager, Finance and Tenant Admin**
            (proposed in `docs/active/seed-data-proposal.md` section 2, client to correct; audit R229).


            **Superseded 2 October 2026: no fixed default roles** (Chinmay; DEC-007; CHG-CSP-003). The five
            are presets (`CapabilityTemplate`, `isPreset`) a role starts from, not roles a tenant is given.
            The field stays for clients built at r1 and is false on every role created from 2 October.

            '
        presetCode:
          type: string
          nullable: true
          readOnly: true
          maxLength: 64
          description: '**The preset this role was started from, for the record only** (decided 2 October 2026,
            Chinmay; DEC-007; CHG-CSP-003): the first of `createRole.presetCodes`, or null for a role ticked
            by hand. It binds nothing; a later edit of the preset never changes this role.

            '
        principalCount:
          type: integer
          readOnly: true
          x-ticvai-persisted: false
          description: '**Computed on read, never stored** (decided 14 October 2026, ADAM CR-077; CHG-IDR-002):
            the distinct principals holding this role through a live grant (`identity.delegated_access` with
            this `role_id`, a `principal_id`, `effect` ALLOW, `revoked_at` null, now inside its validity
            window). **Counted under row-level security**, so only the grants the caller''s own grants let it
            read are counted: a venue manager sees the venue''s holders, not the tenant''s.'
        grantCount:
          type: integer
          readOnly: true
          x-ticvai-persisted: false
          description: '**Computed on read, never stored** (decided 14 October 2026, ADAM CR-077; CHG-IDR-002):
            the live grants of this role (the rows `principalCount` counts, one per grant, so a principal
            granted the role at two scopes counts twice). Counted under row-level security, as
            `principalCount`.'
    RolePermission:
      x-ticvai-persistence: identity.role_permission
      type: object
      description: '**The grant is a row, not a value in an array.** Raised again in review on 24 August:
        `identity.role_permission` held `role_id` and `permission` and nothing else — **no record of who
        granted a permission or when.**

        Hrushikant found the first half on 18 August, when the table had one column. **The fix added the
        permission and stopped**, which is how a half-repair survives: the table now joined, so nothing
        looked wrong.

        **A permission grant is the most audited act in the platform** and it was the one write with no
        audit trail. `listAuditRecords` was built on 20 August because `platform.audit_record` was written
        by nothing — this is the other end of the same gap.

        '
      required:
      - roleId
      - permission
      properties:
        roleId:
          type: string
          format: uuid
        permission:
          $ref: ../shared/permissions.yaml#/components/schemas/Permission
        grantedAt:
          type: string
          format: date-time
        grantedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**Null for a system role.** A seeded role is granted by the platform and naming
            a person there would be a fiction.

            '
        isActive:
          type: boolean
          default: true
          description: '**Revoked rather than deleted.** A permission that vanishes from the table takes
            its history with it, and *who could do this last Tuesday* is the question an incident asks.

            '
    DelegatedAccess:
      x-ticvai-persistence: identity.delegated_access
      # **A grant names exactly one of a permission or a role** (ADAM CR-158, option A, 18 October 2026;
      # CHG-CRA-002): a table CHECK, `num_nonnulls(permission, role_id) = 1`, NOT VALID then VALIDATE.
      x-ticvai-exactly-one-of: [[permission, roleId]]
      # Who granted it: a principal, a guest or the system, and the matching column set (R8 blocker IDENTITY-C42,
      # CHG-R8MIG-021).
      # A guest reads the grants it is party to and the account holder writes them (CHG-R8MIG-021; IDENTITY-C48).
      x-ticvai-rls: scope-or-subject
      x-ticvai-required-when:
        grantedByPrincipalId: {grantedByKind: principal}
        grantedBySubjectId: {grantedByKind: subject}
        revokedBySubjectId: {revokedByKind: subject}
      type: object
      required:
      - id
      - permission
      - scopePath
      - effect
      properties:
        grantedByKind:
          type: string
          enum: [principal, subject, system]
          default: principal
          readOnly: true
          description: Who made the grant (CHG-R8MIG-021). `system` is the SSO callback's group-to-role grant.
        grantedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: identity.principal
          description: The staff member who made the grant; set when `grantedByKind` is `principal`.
        grantedBySubjectId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: pii.subject
          description: The guest who made the grant (the account holder); set when `grantedByKind` is `subject`.
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: string
          format: uuid
          nullable: true
          description: 'The role this grant gives, with its own and inherited permissions. **Exactly one of
            `roleId` and `permission` is set** (ADAM CR-158; CHG-CRA-002): a role grant carries no permission.'
        permission:
          type: string
          nullable: true
          description: 'From the permission enum. `*` permitted on DENY only. **Null on a role grant** (ADAM
            CR-158, 18 October 2026; CHG-CRA-002): a grant names exactly one of a permission or a role (`roleId`),
            so a role grant stores `role_id` and no permission. Nullable in responses since then, a breaking change
            approved by the lead (BC-370).'
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'CF-132, CL-05. **A grant held by a guest rather than a staff principal.**

            Section 5.5 asks for portfolios — a primary holder assigning entitlements, transfer between
            linked accounts, shared wallets with individual tracking — and it appears ten times across
            ten sections. **Every one of those reduces to the same question: who may act on whose behalf,
            over what, and until when.**

            **That is a grant, not a household table.** A primary holder assigning an entitlement is a
            grant. A group leader holding tickets for twelve is a grant. A corporate account enrolling
            members is a grant with a quota. **A shared wallet with individual tracking is a grant over
            a balance, and the transaction log already records who spent.**

            **A household table would answer one of those four.**

            '
        overSubjectId:
          type: string
          format: uuid
          nullable: true
          description: 'Whose behalf. **Null for a staff grant, which is the existing behaviour** — every
            grant written before 18 August means exactly what it meant before.

            '
        overSubjectName:
          type: string
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          description: The display name of the guest acted for (`pii.subject.display_name`), read with the grant;
            null for a staff grant. Not stored (R8 blocker ORDERS-MONEY-C20, CHG-R8MIG-009).
        overSubjectIsMinor:
          type: boolean
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          description: Whether the guest acted for is under the region's `RegionSettings.minorAgeThreshold` today,
            computed from their date of birth, which is never returned; null when no date of birth is held. Not
            stored (CHG-R8MIG-009).
        overObjectRef:
          type: string
          nullable: true
          description: '**Where the authority is over a thing rather than a scope** — a wallet, an entitlement,
            a booking. `scopePath` answers *where*; this answers *what*, and a guest''s authority is almost
            always over a specific object rather than a branch of the tree.


            **Written as `<kind>:<id>`.** An entitlement share is `entitlement:<entitlementId>` (decided 25
            October 2026, Chinmay, ADAM CR-209 option A; CHG-R10ID-004).

            '
        delegationKind:
          type: string
          nullable: true
          enum:
          - primaryHolder
          - familyMember
          - groupLeader
          - attendee
          - corporateAdmin
          - corporateMember
          - carer
          - sharedEntitlement
          description: '**What kind of relationship this expresses**, for display and for reporting. The
            mechanism does not branch on it — a family member and a group attendee are the same grant
            with different words around them, which is the point.


            **`sharedEntitlement` is the row an entitlement share is** (decided 25 October 2026, Chinmay, ADAM
            CR-209 option A; CHG-R10ID-004). `shareEntitlement` writes exactly: `overObjectRef`
            `entitlement:<entitlementId>`, `subjectId` the recipient, `overSubjectId` the owner, `permission`
            `ENTITLEMENT_USE` with `roleId` null, `delegationKind` `sharedEntitlement`, `effect` ALLOW, `validTo`
            the request''s `validUntil`, `grantedByKind` `subject` with `grantedBySubjectId` the owner. `revokeEntitlementShare` finds the row by the path''s `shareId`
            and matches it to the path''s `entitlementId` through `overObjectRef`; a row that does not match is
            404. Orders'' `EntitlementShare` is this row seen through the share.

            '
        quota:
          type: integer
          nullable: true
          description: '2.14.15 and 4.3.11. **How many the holder may assign.** A corporate account with
            fifty allocations and a family with four are the same structure with different numbers.

            '
        isRevocableBySubject:
          type: boolean
          default: true
          description: '**Whether the person it is over can end it.** A guest who linked a family member
            should be able to unlink them; a corporate member should not be able to revoke their employer''s
            oversight — and **a delegation nobody can end is a delegation somebody will regret.**

            '
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        permissionId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Taken from `identity.user_access`, 20 September, when that table was collapsed into
            this one.** `permission` above is free text; this names a row in
            `identity.permission`, the catalogue wired the same day. A grant that names a
            catalogue row can be checked against the keys the contracts actually enforce — which
            is the whole point of a catalogue that reported *154 on operations, 35 in roles.yaml,
            0 shared*.

            Nullable because a role grant carries no permission at all.
        revokedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            Taken from `identity.user_access`. This table recorded `revokedBy` and not when, so
            it could say who revoked a grant and not whether it was before or after the thing
            somebody is asking about.
        revokedByKind:
          type: string
          enum: [principal, subject, system]
          nullable: true
          readOnly: true
          description: '**Who revoked the grant** (decided 25 October 2026, Chinmay, ADAM CR-209 option A;
            CHG-R10ID-004): a staff member (`revoked_by_principal_id`), a guest (`revokedBySubjectId`, for
            example the owner taking back an entitlement share) or the system (an expiry sweep). Null while
            the grant is live.'
        revokedBySubjectId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          x-ticvai-references: pii.subject
          description: The guest who revoked the grant; set when `revokedByKind` is `subject` (ADAM CR-209), since a
            guest is not a principal and cannot fill `revoked_by_principal_id`.
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        createdByPrincipalId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateGrantRequest:
      type: object
      description: '**A grant names exactly one of `permission` and `roleId`** (ADAM CR-158, option A, 18 October
        2026; CHG-CRA-002): a single permission, or a role with its own and inherited permissions. Both, or neither,
        is refused 400 `validation`. `*` stays DENY-only.'
      required:
      - scopePath
      - effect
      oneOf:
      - required: [permission]
      - required: [roleId]
      properties:
        principalId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        permission:
          type: string
        scopePath:
          type: string
        effect:
          type: string
          enum:
          - ALLOW
          - DENY
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    LoginRequest:
      type: object
      description: '**`workstationId` is required for a device door and absent from a browser door**
        (CHG-DOOR-001, 2 October 2026). It was required on every login, so no browser could sign in:
        the TICVAI Console (ADM-001), Venue Management (SUP-001) and the partner portal (PTR-001) have no
        workstation. Optional in the schema is additive against r1; the rule moved to where it belongs,
        the device-bound methods: `pin`, `card` and `rfid` without a `workstationId` are refused 400
        (`workstation-required`). A `password` sign-in from a till, handheld or scanner still sends it,
        because the workstation decides the Sale Board, the hardware and the till identity (never a
        permission, ADR-0002).

        '
      required:
      - username
      - credential
      properties:
        username:
          type: string
          maxLength: 256
        credential:
          type: string
          description: 'The password for `password`; the PIN for `pin`, `card` and `rfid`. Compared with the
            principal''s `PrincipalCredential.credentialHash` (method `password` or `pin`) and never stored (ADR-0071,
            CHG-CRD-003). A badge carries no secret: see `method`.

            '
          maxLength: 512
          writeOnly: true
          x-ticvai-persisted: false
        method:
          type: string
          description: '**`pin` is how a till is actually used.** A cashier signs in at a shared
            terminal between guests, and a password on a touchscreen with somebody waiting is a
            password that gets shortened, shared or written on the drawer. The employee number
            goes in `username` and the PIN in `credential`, so the shape of the request does not
            change — only what the operator types.


            **A PIN is weaker than a password and the difference is bounded by the device, not by
            the secret.** A `pin` (like `card` and `rfid`) is accepted only with a `workstationId`,
            refused 400 `workstation-required` without one (CHG-DOOR-001), and the workstation is *NOT
            a permission source*: it says which till, and the till is on a venue network in a staff area. A PIN
            is a reasonable credential there and nowhere else, which is why this is an enum value
            and not a policy flag — a surface that wants it has to ask for it by name.


            Added 10 September 2026 for `POS-000 Sign In`.


            **`card` and `rfid` say how the username was entered, not a credential of their own** (R8 blocker
            IDENTITY-C36, CHG-R8MIG-006; the lead''s answer, option C). A badge tap at POS-000 or SCN-001 fills
            `username` with the employee number the badge carries, and the operator still types the PIN in
            `credential`, which is checked against the principal''s `pin` credential exactly as for `pin`. No badge
            token is stored and `PrincipalCredential.method` stays `password` or `pin`. **`sso` is not a login
            method**: an SSO sign-in goes through `startSsoAuthorization` and `completeSsoAuthorization`, and a
            `login` with `method` `sso` is refused 400.

            '
          enum:
          - password
          - pin
          - card
          - rfid
          - sso
          default: password
        workstationId:
          type: string
          format: uuid
          description: 'Identifies the device. Determines Sale Board, connected hardware, till identity
            and Access Point inheritance. NOT a permission source.


            **Sent by a device door, never by a browser** (CHG-DOOR-001, 2 October 2026). Required in
            effect for the device-bound methods `pin`, `card` and `rfid` (400 `workstation-required`
            without it); absent on the TICVAI Console, Venue Management and partner portal sign-ins,
            which have no workstation.

            '
        deviceFingerprint:
          type: string
          maxLength: 256
    LoginDeniedProblem:
      x-ticvai-persistence: none — error shape
      description: '**`login`''s 401** (ADAM CR-170, option D, 19 October 2026; CHG-CRA-009): the shared Problem
        and, on every wrong-credentials 401 (`unauthenticated`) `login` returns, the wrong attempts left before the
        lock (`429 credential-locked` with `Retry-After`), counted per submitted username whether or not a principal
        has it, and per sign-in method. **Not on `sso-sign-in-required`**, which checks no credential (the lead,
