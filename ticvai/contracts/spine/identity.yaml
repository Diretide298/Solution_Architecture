      # One current credential per principal and method; the replaced ones are the history rows (CHG-CRD-001).
      x-ticvai-unique-together:
      - [principalId, method]
      type: object
      description: '**A staff or partner principal''s password or PIN, as stored** (14 October 2026, CHG-CRD-001, ADAM
        CR-078). `identity.principal_credential` held only `id` and a nullable `principal_id`, so `createPrincipal`,
        `changeOwnCredential` and `resetPrincipalCredential` wrote a credential nowhere and `login` had nothing to compare.
