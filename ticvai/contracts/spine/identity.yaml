        - "P08 BO-1066 Roles, Permissions & Masking"
        - "P08 BO-1177 API Security, Access & Integration Permissions"
        - "P13 CMS-086 Role-Based Asset Access & Permission Management"
        - "P16 ANL-047 Report Access & Sharing Control"
      summary: Attribute-based authorisation policies
      description: '3.3.1. **Staff authorisation only, and named so** (ADR-0068, accepted 1 October): these
        were "access policies" until then, beside access''s `AccessDynamicPolicy`, which decides guest
        admission at a gate. The tables are `identity.authorisation_policy` and its versions, and every
        operation here says *authorisation*, so "access policy" means one thing in the package.

        **`Grant` is principal → role → scope, and forty-two matrix rows ask for
        something it cannot express.** *"Allows permissions to be granted dynamically based on attributes
        and context rather than fixed roles only."*

        A role grant answers *who you are*. These answer *who you are, where, when, on what device,
        under what occupancy, at what risk* — and none of that is a property of the person, so none of it
        can be baked into a role without inventing a role per combination.

        **The role model is not replaced.** Roles remain the coarse grant and a policy narrows or extends
