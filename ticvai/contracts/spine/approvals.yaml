      x-ticvai-agreed: '29 September: re-trace 11.1.65 (external workflow connector: endpoint, mapping,
        callback into the decision); MoM 8 Sep (external workflow integration with data mapping and retry);
        our build plan; shape follows setApprovalSlaPolicy'
      x-ticvai-audience:
      - staff
      summary: Register a third-party workflow system as an approver
      description: '11.1.65. **A client that already runs approvals in ServiceNow, SAP or its own workflow
        tool can have a level decided there**, instead of re-keying the same decision in two systems. A rule
        names the provider (`ApprovalRule.externalProviderId`); when a request reaches that level, TICVAI
        sends the provider the request mapped through `requestMapping`, signed, with retry, and waits for
        the provider to call `recordExternalApprovalDecision`.


        **The provider decides a level; it does not replace the controls.** Segregation of duties, the
        reason on a rejection and the immutability of a completed record hold exactly as for a person. If the
        provider does not answer inside `timeoutMinutes`, `onTimeout` says what happens — by default the
        level falls back to the rule''s `approverRoleIds`, so a dead integration cannot hold a refund for
        ever.


        **PUT semantics — an upsert keyed on `code`**, as `setApprovalSlaPolicy`. Where no provider has that
        `code` one is created (`201`); where one does, the body replaces it whole (`200`). `id`, `status`
        changes by the platform, and `lastSuccessAt` are the server''s. `outboundCredential` and
        `signingSecret` are write-only; omitting them on a replace keeps the stored ones. An `endpointUrl`
        that is not `https`, an `apiClientId` that is not an active API client of the tenant, or a
        `decisionMapping` that maps no value to `approve` and `reject` is `422`.

        '
