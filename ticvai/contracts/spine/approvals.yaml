openapi: 3.1.0
info:
  title: TICVAI — Approvals
  version: 1.0.0
  x-ticvai-screen-count: 46
  x-ticvai-module: 11 — Approval Workflows and Governance
  x-ticvai-platforms:
  - P04 POS
  - P08 Venue Management
  - P11 Accreditation Web
  x-ticvai-tier: spine
  description: '**One approval mechanism, not five.**

    Approval was implemented four times before this contract existed — refund thresholds, shift variance,
    release promotion, manual discount — and a fifth was about to be written for AI proposed actions.
    Each was correct in isolation and none shared a rule, an audit trail or a delegation model, so "who
    approved this and why" had four different answers and "I am on leave, route my approvals to Sara"
    had none.

    This is the shared object those four collapse into. **The requesting contract does not implement approval;
    it asks whether one is required, and blocks until it is granted.**

    **Shift variance is the exception and is not an engine subject** (decided 28 September, audit R080 (e)):
    a variance above the threshold is accepted by a supervisor on the till (`shift.acceptShiftVariance`,
    PIN step-up on the same device) and never raises a request here, so `ApprovalKind` has no
    `shiftVariance`.

    ## The four rules that are not configurable

    **Segregation of duties.** A requester may never approve their own request (11.1.24). This is enforced
    here, in the platform, not left to a workflow definition somebody might write wrongly. **A level 1 AI
    proposal is not a request here** (decided 28 September, audit R213 (3)): the requester approves it
    themselves in `ai.decideProposedAction`, and only a level 2 proposal (prices or permissions) needs a
    manager other than the requester.

    **A rejection carries a reason** (11.1.21). Without it a rejected request tells the requester nothing
    and the analytics tell the business nothing.

    **A completed record is immutable** (11.1.56). Approvals are evidence. Amending one is not a correction,
    it is a different fact, and reopening (11.1.54) creates a new decision linked to the old rather than
    overwriting it.

    **Approval records an authorisation; it does not perform the action.** The requesting contract executes,
    under the approver''s permission, after the grant. An approval endpoint that also executed would let
    a person authorise something they could not do themselves, and the whole control depends on them being
    the same person.

    ## What routes a request

    A matrix, resolved up the scope tree the way everything else resolves (ADR-0018): tenant default,
    region override, venue override. Rules match on **value** (11.1.11), **organisational level** (11.1.38–11.1.42)
    and **condition** (11.1.13), and the first matching rule wins so that adding a rule cannot silently
    change an unrelated one.

    ## Deliberately absent

    **AI recommendations on the decision itself** (11.1.72). The MoM of 8 September settled that AI in
    approvals is analytics only: **AI never recommends, influences or makes an approve or reject.**


    ## AI context for the reviewer (29 September, build pass, group G2)

    **11.1.73 to 11.1.75, inside that rule.** When a request is submitted (`createApprovalRequest` without
    saving a draft, `submitApprovalRequest`, `resubmitApprovalRequest`) and on every SLA tick of a pending
    request, approvals calls `ai.scoreApprovalRequest` (service audience, trigger `submitted`, `resubmitted`
    or `slaTick`, 300 ms, fail-open) and stores what comes back on the request as `aiAssessment`: a risk score and band for
    the request (the requester''s entity risk, the amount against the requester''s history, the subject''s
    own signals), a priority score, a suggested escalation (`escalate`, `addBackupApprover` or `none`, with
    the reason) and the decision record id. **It is context for the person, never an input to the
    decision**: it is shown beside the request, it can order the inbox (`listApprovalRequests`
    `sort=aiPriority`), and a person may act on the escalation suggestion through
    `escalateApprovalRequest`. It does not approve, reject, route or escalate anything by itself, and
    `ApprovalRule.riskScoreAbove` does not read it (see there). If AI is off or the call fails, the
    request is routed and decided exactly as before, with `aiAssessment` null.

    '
  contact:
    name: TICVAI Platform
servers:
- url: https://api.{region}.ticvai.com/approvals/v1
  variables:
    region:
      default: ae
security:
- bearerAuth: []
tags:
- name: request
  description: Raising, deciding and tracking an approval
- name: matrix
  description: What requires approval, and who grants it
- name: delegation
  description: Standing in for an approver who is away
- name: analytics
  description: Volumes, times and bottlenecks
paths:
  /approval-requests:
    get:
      operationId: listApprovalRequests
      x-ticvai-consumed-by:
        - "P06 EMP-037 Notifications"
        - "P08 BO-084 Approval Inbox"
        - "P08 BO-085 Approval Request"
        - "P08 BO-1181 Approval, Publication & Change Management"
        - "P08 BO-364 Approval Command Center Dashboard"
        - "P08 BO-366 Team / Shared Approval Queue"
        - "P08 BO-367 Approval Request Detail"
        - "P08 BO-368 AI Decision Support"
        - "P08 BO-369 High Priority & Risk Queue"
        - "P08 BO-371 Completed Approval History"
        - "P08 BO-374 Approval Decision Workspace"
        - "P08 BO-375 Business Context & Evidence Viewer"
        - "P08 BO-393 AI SLA & Escalation Advisor"
        - "P08 BO-940 Manager Mobile Approval Center"
        - "P09 ADM-130 Approval Review & Decision Workspace"
        - "P09 ADM-145 Promotion Approval Inbox"
        - "P09 ADM-224 Approval Inbox & Decision Workspace"
        - "P09 ADM-249 Unified Approval Inbox & Decision Workspace"
      x-ticvai-audience:
      - staff
      - public
      summary: Requests awaiting a decision, or already decided
      description: '11.1.16. The approver''s queue and the requester''s history are the same list filtered
        differently, so they are one operation.

        Sorted by SLA proximity rather than age. **A request breaching in ten minutes matters more than
        one raised yesterday with a week to run**, and sorting by age buries it.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
      - name: assignedToMe
        in: query
        schema:
          type: boolean
      - name: raisedByMe
        in: query
        schema:
          type: boolean
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApprovalStatus'
      - name: kind
        in: query
        schema:
          $ref: '#/components/schemas/ApprovalKind'
      - name: breachingWithinMinutes
        in: query
        description: 11.1.15. What is about to miss its SLA.
        schema:
          type: integer
      - name: sort
        in: query
        description: '`slaProximity` (the default, as before) or `aiPriority`: highest `aiAssessment.priorityScore`
          first, requests with no assessment after them in SLA order (29 September, build pass, group G2;
          11.1.74). Ordering the inbox is the only thing the score does.'
        schema:
          type: string
          enum:
          - slaProximity
          - aiPriority
          default: slaProximity
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                allOf:
                - $ref: ../shared/common.yaml#/components/schemas/Page
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApprovalRequest'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    post:
      operationId: createApprovalRequest
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P04 POS-020 Shift Exceptions & Alerts"
        - "P08 BO-045 Menu Management"
        - "P08 BO-1010 Hold Approval Workflow"
        - "P08 BO-1031 Contracts & Approval Workflow"
        - "P08 BO-1080 Integration Approval & Compliance"
        - "P08 BO-1181 Approval, Publication & Change Management"
        - "P08 BO-163 Rule Simulation, Conflict Check & Publication"
        - "P08 BO-243 Policy Approval, Audit, Analytics & AI Optimization"
        - "P08 BO-301 Member Exceptions, Overrides & Service Recovery"
        - "P08 BO-718 Event Change Request Configuration"
        - "P08 BO-771 Budget, Goals & Forecast"
        - "P08 BO-922 Event Resource Approval & Readiness Gate"
        - "P09 ADM-567 Payment Policy, Governance & Approval Manager\t15"
      x-ticvai-audience:
      - staff
      summary: Raise a request
      description: 'Called by the contract that needs the authorisation, not by a person. `createRefund`
        asks `evaluateApprovalRequirement` first, and where one is required it raises this and holds the
        refund at `pendingApproval`.

        **The subject is a reference, never a copy.** The request points at the order, the shift or the
        proposed action; it does not embed it. A copy goes stale between raising and deciding, and an
        approver reading a stale copy approves something that no longer exists.

        Draft is supported (11.1.51) for the case where a person raises it themselves and wants to gather
        detail first.

        **A draft is saved, not routed — decided 28 September, audit R129 (3).** `isDraft: true` stores
        the request at `draft`: nobody is asked, no SLA runs, and it does not count as an open request
        for the `409` below, so a person may keep a draft while a contract raises the real one. The
        draft is sent with `submitApprovalRequest`, which is when the matrix is read, the approvers are
        resolved and `matrixVersion` is fixed. A contract raising a request never drafts.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_REQUEST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRequest'
      responses:
        '201':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Raised, and routed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '409':
          description: 'An open request already exists for this subject. Two approvals for one refund
            is how a refund gets paid twice. `refusedReason` is `openRequestExists` and `requestId`
            names the open request, so the caller can point at it rather than raise another. A draft
            is not an open request.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalStateProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /approval-requests/{requestId}/submit:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: submitApprovalRequest
      x-ticvai-audience:
      - staff
      summary: Send a saved draft, or a returned request, for approval
      description: '11.1.51. **Decided 28 September, audit R129 (3): a person may save a draft and submit
        it later.** Only the requester who saved the draft submits it.

        Submitting is the moment the request is routed: the matrix in force now is read, its version is
        fixed on the request as `matrixVersion`, the approver chain is resolved and the SLA starts. **The
        draft''s saving time decides nothing** — a draft saved last week is decided by this week''s rules,
        because nobody was asked under last week''s.

        The body may amend the summary, amount, attributes and justification in the same call; a field
        left out keeps the draft''s value.

        **Also answers a returned request or a request for information (decided 29 September, readiness
        close-out).** From `returned` or `informationRequested` it resubmits the same request: routing
        resumes at the level that sent it back, on the matrix version already fixed on the request (R129),
        and the SLA clock restarts.

        **Asks AI for reviewer context, after routing** (29 September, build pass, group G2; 11.1.73 to
        11.1.75). Once the request is routed, approvals calls `ai.scoreApprovalRequest` and stores the answer
        as `aiAssessment`; the same call is repeated on each SLA tick while the request is pending. The call is
        outside the routing decision and the transaction: a slow or failed call leaves `aiAssessment` null
        and changes nothing else. **Context only (MoM 8 September)**.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_REQUEST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  maxLength: 300
                amount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                attributes:
                  type: object
                  additionalProperties: true
                justification:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Submitted and routed. `status` is `pending` and `matrixVersion` is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: 'Not submitted. `refusedReason` is `notDraft` where the request is no longer a draft
            (`currentStatus` says what it is), or `openRequestExists` where another request for the same
            subject went out while this one was a draft (`requestId` names it).

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalStateProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /approval-requests/evaluate:
    post:
      operationId: evaluateApprovalRequirement
      x-ticvai-consumed-by:
        - "P04 POS-002 Sell — Ticket Catalogue"
        - "P09 ADM-337 Routing Simulator & Conflict Detection"
        - "P09 ADM-530 AI Approval Requirement & Routing Configuration"
        - "P09 ADM-532 Conditional Approval & Approval Conditions"
      x-ticvai-audience:
      - staff
      summary: Does this need approval, and from whom
      description: '**The operation every other contract calls.** It answers before the action, not after,
        so a cashier learns a discount needs a manager while the guest is still at the counter.

        Returns the matching rule and the resolved approver chain, so the caller can say *"this needs
        Sara, and she has four hours"* rather than *"this needs approval"*.

        Read-only and deliberately cheap. It runs on the hot path — every refund, every discount, every
        price override — and a slow answer here is a slow till.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - scopePath
              properties:
                kind:
                  $ref: '#/components/schemas/ApprovalKind'
                scopePath:
                  type: string
                amount:
                  $ref: ../shared/common.yaml#/components/schemas/Money
                attributes:
                  type: object
                  additionalProperties: true
                  description: Whatever the conditional rules match on (11.1.13).
      responses:
        '200':
          description: Whether approval is required, and who would grant it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequirement'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /approval-requests/{requestId}/decide:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: decideApprovalRequest
      x-ticvai-consumed-by:
        - "P04 POS-020 Shift Exceptions & Alerts"
        - "P08 BO-084 Approval Inbox"
        - "P08 BO-085 Approval Request"
        - "P08 BO-133 Offline Alerts, Limits & Audit"
        - "P08 BO-243 Policy Approval, Audit, Analytics & AI Optimization"
        - "P08 BO-367 Approval Request Detail"
        - "P08 BO-374 Approval Decision Workspace"
        - "P08 BO-377 Approve & Sensitive Action Confirmation"
        - "P08 BO-378 Reject / Return / Request Information"
        - "P08 BO-940 Manager Mobile Approval Center"
        - "P09 ADM-145 Promotion Approval Inbox"
        - "P09 ADM-249 Unified Approval Inbox & Decision Workspace"
      x-ticvai-audience:
      - staff
      - public
      summary: Approve, reject, return or ask for information
      description: '**Records an authorisation. Does not perform the action.** The requesting contract
        executes afterwards under the approver''s permission.

        Refused where the approver is the requester (11.1.24), where they do not hold the permission the
        rule demands, or where the rule requires MFA and the step-up token is absent (11.1.60).

        A rejection requires a reason (11.1.21). An approval may carry a comment (11.1.20) and usually
        should — six months later the comment is the only record of why the exception was allowed.

        **Return and request information (decided 29 September, readiness close-out; MoM 10 Aug §5.5:
        Approve, Reject, Return, Request More Information).** `return` sends the request back to the
        requester to amend (`returned`); `requestInformation` asks the requester a question and pauses the
        SLA clock (`informationRequested`). Neither is a rejection and neither counts against the
        requester in the rejection rate. Both need a comment saying what is wanted. The requester answers
        with `submitApprovalRequest` on the same request, and routing resumes at the level that sent it
        back.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_DECIDE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                  - return
                  - requestInformation
                comment:
                  type: string
                  maxLength: 1000
                reason:
                  type: string
                  maxLength: 500
                  description: Required on rejection.
                stepUpToken:
                  type: string
                  description: Where the rule demands MFA (11.1.60).
                signature:
                  type: string
                  description: 11.1.57. Where the rule demands a digital signature.
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: 'Decided. On a multi-level chain the request advances to the next level rather
            than completing.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '403':
          description: 'The approver may not decide this request. **Always carries `refusedReason`**,
            one value per cause — the approver is the requester (`approverIsRequester`), is not in the
            resolved chain (`notInApproverChain`), lacks the permission the rule demands
            (`insufficientPermission`), gave no step-up token where the rule requires MFA
            (`mfaRequired`) or no signature where it requires one (`signatureRequired`), is deciding
            through a delegation that has ended (`delegationExpired`), or has already decided at this
            level (`alreadyDecidedAtThisLevel`), or the level is waiting on an external workflow system
            (`levelDecidedExternally`, 11.1.65). The shared `Forbidden`, with no `refusedReason`, is the
            caller lacking `APPROVAL_DECIDE` at all.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalRefusedProblem'
        '409':
          description: 'The request is no longer open for a decision. `refusedReason` says which:
            `alreadyDecided` (approved or rejected), `withdrawn`, `expired` or `cancelled`, and
            `currentStatus` carries the status it is in.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalStateProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /approval-requests/{requestId}/withdraw:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: withdrawApprovalRequest
      x-ticvai-consumed-by:
        - "P08 BO-085 Approval Request"
        - "P08 BO-380 Withdrawal, Cancellation, Expiration & Reopening"
      x-ticvai-audience:
      - staff
      summary: The requester takes it back
      description: '11.1.22. Distinct from a rejection: nobody refused it, and the analytics must not
        read it as one. A cashier who realises the discount is wrong should be able to pull the request
        without it counting against the approver''s rejection rate.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_REQUEST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '409':
          description: 'Already decided. `refusedReason` is `alreadyDecided` and `currentStatus` says
            whether it was approved or rejected.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalStateProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /approval-requests/{requestId}/cancel:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelApprovalRequest
      x-ticvai-audience:
      - staff
      summary: An administrator cancels a request nobody should decide any more
      description: '**Cancellation, beside the requester''s withdrawal** (design-notes correction on BO-380, Block B:
        "The purpose names four lifecycle actions; only withdrawApprovalRequest exists, and cancellation, expiry and
        reopening have no operation"; CHG-CSP-043). An approvals administrator cancels a request that is still
        waiting (`pending`, `escalated`, `returned` or `informationRequested`) because its subject went away: the
        order was voided, the product retired. Moves it to `cancelled`; like a withdrawal it is never counted as a
        rejection. The reason is required and kept. **Expiry stays the timer** set by `ApprovalRule.expiresAfterMinutes`;
        no operation forces it.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '409':
          description: 'Already decided or closed. `refusedReason` is `alreadyDecided` and `currentStatus` names the status.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalStateProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
  /approval-requests/{requestId}/reopen:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reopenApprovalRequest
      x-ticvai-audience:
      - staff
      summary: Reopen an expired or cancelled request as a new one
      description: '**Reopening creates a new request that points back** (design-notes correction on BO-380, Block B;
        CHG-CSP-043; the rule this contract already states on `ApprovalRequest.reopenedFrom`: editing a decision in
        place destroys the record). A request that `expired` (nobody answered) or was `cancelled` is reopened by its
        requester or an approvals administrator: a new request at `pending`, with the same subject and the current
        matrix, and `reopenedFrom` naming the old one, which stays as it was. A `rejected` request is resubmitted
        (`resubmitApprovalRequest`), and an `approved` one is never reopened.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_REQUEST
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
