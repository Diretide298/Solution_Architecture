  /approval-requests/{requestId}/external-decision:
    parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: recordExternalApprovalDecision
      x-ticvai-api-scope: core.write
      x-ticvai-agreed: '29 September: re-trace 11.1.65 (decision callback into the approval); our build
        plan; shape follows decideApprovalRequest'
      x-ticvai-no-screen: machine-to-machine callback from a registered external workflow system; people
        decide through decideApprovalRequest
      x-ticvai-audience:
      - partner
      summary: An external workflow system returns its decision on a level
      description: '11.1.65. **The callback.** The provider named on the request''s current level answers
        here, authenticated as its API client (`ApprovalExternalProvider.apiClientId`, holding
        `APPROVAL_DECIDE`). Its own outcome value is translated through `decisionMapping` into approve,
        reject, return or request information, and the level is then decided exactly as
        `decideApprovalRequest` decides it — the chain advances, completes or goes back to the requester.


        **The same controls as a person.** A rejection needs a `reason`; a decision naming the requester as
        approver (`externalApproverRef` matching the requester''s reference sent in the mapped payload) is
        refused `approverIsRequester`; a caller that is not the provider for the current level is refused
        `notExternalProvider`. The external approver is recorded on the decision, so *who approved this* has
        an answer even when it was somebody in another system.


        **Idempotent on `externalReference`.** A provider retrying its callback gets the same answer, not a
        second decision.

        '
      tags:
      - request
      x-ticvai-permission: APPROVAL_DECIDE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalExternalDecision'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Decided. On a multi-level chain the request advances to the next level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '403':
          description: '`notExternalProvider` (the caller is not the provider the current level was sent
            to) or `approverIsRequester`. Carries `refusedReason`.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalRefusedProblem'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: The request is no longer open for a decision (`alreadyDecided`, `withdrawn`,
            `expired`, `cancelled`), or the level already fell back to people on timeout.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalStateProblem'
        '422':
          description: The `outcome` is not in the provider's `decisionMapping`, or a rejection came with no
            `reason`.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
