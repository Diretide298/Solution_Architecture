  /step-up-policies:
    get:
      operationId: listStepUpPolicies
      x-ticvai-consumed-by:
        - "P08 BO-377 Approve & Sensitive Action Confirmation"
        - "P09 ADM-342 Authentication & MFA Policy Manager"
        - "P09 ADM-343 Sensitive Action Confirmation"
      x-ticvai-audience:
      - staff
      summary: What needs a second factor here
      description: 'Every action that can demand step-up, the strength the contract sets as its floor,
        and the strength in force here. Resolves up the scope tree the way the approval matrix does (ADR-0018):
        tenant default, region override, venue override.

        '
      tags:
      - matrix
      x-ticvai-permission: APPROVAL_CONFIGURE
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      parameters:
      - name: effective
        in: query
        description: Show the strength as it applies here, rather than the rules set at this level.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Step-up policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepUpPolicy'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
    put:
      operationId: setStepUpPolicy
      x-ticvai-consumed-by:
        - "P09 ADM-342 Authentication & MFA Policy Manager"
        - "P09 ADM-343 Sensitive Action Confirmation"
      x-ticvai-audience:
      - staff
      summary: Raise what needs a second factor
      description: 'Raise the authentication strength required before an action may be executed.


        **A policy may raise a requirement and never lower it.** The value on the operation is a floor:
        `mfa` cannot be configured down to `pin` or `none`, in the same way a venue may tighten a refund
        threshold and never loosen one. A tenant able to switch MFA off `approveJournalEntry` would have
        a policy manager that manages the control away.


        **Changing a policy does not change a decision already in flight.** A request keeps the requirement
        it was raised under, for the reason `setApprovalMatrix` gives: an approver must not be answering
        a question that changed while they read it.


        **Set at tenant level, and that is forced by what it governs.** The policy covers actions declared
        at venue, region and tenant scope - `approveMembershipProductValidation` and `approvePartnerStatuLifecycle`
