            type: object
            properties:
              atPercentOfTarget:
                type: integer
              notify:
                type: string
                enum:
                - approver
                - approverManager
                - requester
                - escalationGroup
        firstReminderAtPercent:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: '**Percent of `targetMinutes` at which the first reminder goes** (decided 29 September,
            readiness close-out: the reminder steps are percentages of target). A column so the SLA, Escalation,
            Reminder & Timeout Rules screen reads it rather than unpacking `reminders`; the reminder in
            `reminders` at this percentage says whom it notifies (data model for the agreed operations, 29 September).'
        secondReminderAtPercent:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Percent of `targetMinutes` at which the second reminder goes; above `firstReminderAtPercent`
        escalateAtPercent:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Percent of `targetMinutes` at which the request or workflow escalates; at or above `secondReminderAtPercent`
        onBreach:
          type: string
          enum:
          - notifyOnly
          - escalate
          - autoApprove
          - autoReject
          default: escalate
        autoActionAllowed:
          type: boolean
          default: false
          description: '**Auto-approval on breach is off unless somebody says otherwise, in writing.**
            A queue that approves itself when nobody looks is not an approval process.

            '
        escalationGroupId:
          type: string
          format: uuid
          nullable: true
        scopePath:
          type: string
    ApproverAvailability:
      type: object
      x-ticvai-persistence: approvals.approver_availability
      description: 'Approvals boards 5.3 and 5.4. **Dated, so nobody has to remember to turn it off.**'
      properties:
        id:
          type: string
          format: uuid
          description: 'One period of absence. The key `setApproverAvailability` replaces by; absent on
            input to record a new period. Already the table''s key (`approvals.approver_availability.id`),
            and until 26 September missing from the wire, so no period could be addressed.

            '
        principalId:
          type: string
          format: uuid
        unavailableFrom:
          type: string
