          format: date-time
        substitutePrincipalId:
          type: string
          format: uuid
          nullable: true
        delegationId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        appliesToRequestKinds:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalKind'
        scopePath:
          type: string
    ApprovalExternalProvider:
      type: object
      x-ticvai-persistence: approvals.external_provider
      description: '11.1.65 (29 September, build pass). **A third-party workflow system registered to decide
        approval levels**: where TICVAI sends a request, how its fields are mapped, how the answer comes
        back and what happens when it does not.

        '
      required:
      - code
      - name
      - endpointUrl
      - apiClientId
      - decisionMapping
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          x-ticvai-unique: tenant
          description: The provider's stable name, and the key `setApprovalExternalProvider` upserts on.
        name:
          type: string
        endpointUrl:
          type: string
          description: '`https` only. Where a request level is sent.'
        outboundAuth:
          type: string
          enum:
          - bearerToken
          - basic
          - oauthClientCredentials
          - mutualTls
          default: oauthClientCredentials
        outboundCredential:
          type: string
          format: password
          writeOnly: true
          nullable: true
          description: The credential TICVAI presents to the provider. Write-only, never returned, kept on a
            replace that omits it.
        signingSecret:
          type: string
          format: password
          writeOnly: true
          nullable: true
          description: 'Signs every request TICVAI sends, as webhook deliveries are signed, so the provider
            can tell it came from TICVAI. Write-only.

            '
        apiClientId:
          type: string
          format: uuid
          description: 'The public-api client the provider calls back as. It must hold `APPROVAL_DECIDE`;
            `recordExternalApprovalDecision` from any other client is refused.

            '
        requestMapping:
          type: array
          description: 'Which request fields go to the provider, under which names. **Only mapped fields
            leave TICVAI** — a provider receives the amount and the subject it needs, not the whole
            request.

            '
          items:
            type: object
            required:
            - from
            - to
            properties:
              from:
                type: string
                description: A field of `ApprovalRequest`, e.g. `amount`, `kind`, `subjectId`,
                  `requestedByPrincipalId`.
              to:
                type: string
                description: The provider's field name.
        decisionMapping:
          type: array
          minItems: 2
          description: The provider's outcome values and the decision each means. At least one maps to
            `approve` and one to `reject`.
          items:
            type: object
            required:
            - externalValue
            - decision
            properties:
              externalValue:
                type: string
              decision:
                type: string
                enum:
                - approve
                - reject
                - return
                - requestInformation
        timeoutMinutes:
          type: integer
          default: 1440
          description: How long a level waits for the provider before `onTimeout` applies.
        onTimeout:
          type: string
          enum:
          - fallBackToRoles
          - escalate
          - reject
          default: fallBackToRoles
        maxAttempts:
          type: integer
          default: 5
          description: Delivery attempts, with backoff, before a dispatch is `failed` and the level falls
            back as on timeout.
        status:
          type: string
          enum:
          - active
          - paused
          - disabled
          default: active
          description: '`paused` sends nothing and every level that names it falls back at once; the
            platform sets `disabled` after repeated failures, as it disables a failing webhook.

            '
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        scopePath:
          type: string
          readOnly: true
    ApprovalExternalDispatch:
      type: object
      x-ticvai-persistence: approvals.external_dispatch
      description: '11.1.65 (29 September, build pass). **One request level sent to an external workflow
        system**, and what became of it. Written by the platform when a level that names a provider is
        reached, and closed by `recordExternalApprovalDecision` or by the timeout.

        '
      required:
      - id
      - requestId
      - providerId
      - level
      - status
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        level:
          type: integer
        status:
          type: string
          enum:
          - pending
          - sent
          - failed
          - decided
          - timedOut
          - cancelled
        attemptCount:
          type: integer
          default: 0
        externalReference:
          type: string
          nullable: true
          description: The provider's own id for the item, as it acknowledged or called back with.
        lastResponseCode:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true
        externalOutcome:
          type: string
          nullable: true
          description: The provider's own outcome value, before mapping.
        externalApproverRef:
          type: string
          nullable: true
          description: Who decided in the provider's system, as it named them.
        scopePath:
          type: string
    ApprovalExternalDecision:
      type: object
      x-ticvai-persistence: none — request only; closes approvals.external_dispatch and writes approvals.decision
      required:
      - externalReference
      - outcome
      properties:
        externalReference:
          type: string
          description: The provider's id for the item. What makes a retried callback the same call.
        outcome:
          type: string
          description: The provider's own outcome value, translated through `decisionMapping`.
        externalApproverRef:
          type: string
          nullable: true
          description: Who decided, in the provider's terms.
        externalApproverName:
          type: string
          nullable: true
        comment:
          type: string
          maxLength: 1000
          nullable: true
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: Required when the outcome maps to `reject`.
        decidedAt:
          type: string
          format: date-time
          nullable: true
    ApprovalRetentionPolicy:
      type: object
      x-ticvai-persistence: approvals.retention_policy
      description: 'Approvals board 6.7. **Approval records outlive what they approved.**'
      properties:
        id:
          type: string
          format: uuid
        appliesToRequestKinds:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalKind'
        retainYears:
          type: integer
          nullable: true
          description: '**Null takes the tenant''s `approvalRecord` retention setting** (tenancy
            `setDataRetentionSetting`; decided 29 September, all data retention is tenant configuration).
            A value here applies to the request kinds this policy names and may only lengthen what the tenant
            setting keeps.

            '
        retainSignatures:
          type: boolean
          default: true
        retainAttachments:
          type: boolean
          default: false
        onExpiry:
          type: string
          enum:
          - delete
          - anonymise
          - archive
          default: archive
        overridesPrivacyDeletion:
          type: boolean
          default: true
          description: '**Can extend, never shorten, what privacy retention would delete.** The
            interaction is decided once here instead of argued per data-subject request.

            '
        legalBasis:
          type: string
          nullable: true
        scopePath:
          type: string
    ApprovalEvidencePackage:
      type: object
      x-ticvai-persistence: approvals.evidence_package
      description: 'Approvals board 6.9. **Decisions and the policy versions behind them**, because the
        auditor asks whether the rule was followed and the rule has changed.

        '
      properties:
        id:
          type: string
          format: uuid
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        requestCount:
          type: integer
          readOnly: true
        integrityFailures:
          type: integer
          readOnly: true
          description: '**Counted and reported rather than quietly excluded.** A package that drops the
            records that failed verification is the one an auditor should not be given.

            '
        status:
          type: string
          enum:
          - assembling
          - ready
          - failed
        assetId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
    DraftedRecord:
      type: object
      x-ticvai-provisional: true
      description: '**A provisional envelope, drafted 2026-09-04 from the workshop pack.** It carries
        what every one of these screens needs to address a row and nothing it has not earned. **There
        is deliberately no `x-ticvai-persistence`** - naming a table here would put a storage decision
        nobody made into the ER model and the DDL.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        updatedAt:
          type: string
          format: date-time
    AccreditationBadge:
      type: object
      x-ticvai-persistence: approvals.accreditation_badge
      description: '**Drafted 4 September.** The credential an approved application produces. **Its lifetime
        is not the approval''s** - a badge is revoked, lost or expires while the decision that authorised
        it still stands.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        approvalRequestId:
          type: string
          format: uuid
        holderName:
          type: string
        zones:
          type: array
          items:
            type: string
          description: Where this badge admits, which is the whole point of it.
        state:
          type: string
          enum:
          - issued
          - collected
          - suspended
          - revoked
          - expired
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedReason:
          type: string
    ApprovalKind:
      type: string
      description: '11.1.7 and 11.1.30–11.1.37. **The first four already exist as bespoke implementations**
        and this contract is what they collapse into.

        **Which actions route here — decided 28 September, audit R144.** Finance and procurement acts go
        through this engine to a **finance approver**: closing a fiscal period (`periodClose`), reopening
        one (`periodReopen`), cancelling a purchase order (`purchaseOrderCancel`) and closing one short
        (`purchaseOrderShortClose`). The tenant default matrix for each of these names the finance
        approver role; a venue may tighten it and never loosen it. Starting a release rollout routes
        through `releasePromotion` to the platform release manager (a holder of
        `PLATFORM_RELEASE_PROMOTE`). **Not every `requiresApproval` goes here:** reopening a shift,
        recounting a stock count and a retail return above the venue threshold take a supervisor''s
        step-up on the same device instead, and never raise a request.

        **Catalogue change requests route through `productChange` and `pricingChange`** (decided 29 September,
        writers pass): a product change and a price or pricing change raised in `catalogue` ask for approval
        under these two kinds, so a venue can route product edits and price edits to different approvers.


        **Optional review steps a venue switches on, decided 2 October 2026** (Chinmay; CHG-CSP-036, CHG-CSP-028,
        CHG-CSP-031). Each is an existing kind narrowed by the rule''s `subjectTypes`, so no kind is added (a new
        value here would be a breaking change against r1) and each is off until the venue saves an active matrix
        for it:

        - **Publishing white-label content** (`configurationChange`, subject `whiteLabelPublication`): simulate, then a
          single publish by a holder of the permission; a review step only where the venue sets one up (batch 1,
          CMS-014; DEC-156).
        - **Recording F&B waste above a value** (`stockWriteOff`, subject `fnbWaste`): the venue''s waste-approval
          policy, value bands as `minAmount` and `maxAmount`, photo evidence above a value held by fnb (batch 6 #192,
          BO-139; DEC-192; R144).
        - **Publishing an access topology** (`configurationChange`, subject `topologyPublication`): second-person
          approval when the venue switches it on (batch 6 #230, BO-153; DEC-230).
        - **A permanent identity lock, a whitelist entry, or releasing a full-identity or permanent lock**
          (`accessPermissionChange`, subjects `identityLock`, `whitelistEntry`, `identityLockRelease`): always a
          second approver, never for an until-end-of-day lock (critical set 1, BO-229 and BO-247; DEC-254, DEC-260);
          the tenant default matrix names the security approver role and a venue may tighten it, never remove it.

        '
      enum:
      - refund
      - priceOverride
      - discountOverride
      - complimentaryTicket
      - membershipCancellation
      - accessPermissionChange
      - configurationChange
      - aiRecommendation
      - releasePromotion
      - requisition
      - stockWriteOff
      - journalEntry
      - periodClose
      - periodReopen
      - purchaseOrderCancel
      - purchaseOrderShortClose
      - tenantMigration
      - productChange
      - pricingChange
    ApprovalStatus:
      type: string
      enum:
      - draft
      - pending
      - escalated
      - returned
      - informationRequested
      - approved
      - rejected
      - withdrawn
      - expired
      - cancelled
    ApprovalMode:
      type: string
      description: '11.1.43–11.1.46. **Sequential** asks one at a time, **parallel** asks everyone at
        once, **consensus** needs all of them, **majority** needs more than half.

        Parallel and consensus differ in when it completes: parallel completes on the first approval,
        consensus waits for all. Conflating them is how a four-eyes rule turns into a one-eye rule.

        '
      enum:
      - sequential
      - parallel
      - consensus
      - majority
    ApprovalRule:
      type: object
      x-ticvai-persistence: approvals.rule
      required:
      - order
      - approverRoleIds
      - mode
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        order:
          type: integer
          description: '**First match wins.** Explicit ordering is what makes a matrix reviewable — an
            unordered set of overlapping rules is one nobody can reason about.

            '
        minAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        maxAmount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        riskScoreAbove:
          type: number
          nullable: true
          description: '11.1.12. **Not matched against the AI risk score** (29 September, build pass, group G2).
            The AI assessment on a request (`ApprovalRequest.aiAssessment`, from `ai.scoreApprovalRequest`) is
            context for the reviewer only (MoM 8 September: AI never influences approve or reject), and routing
            a request to more approvers because of it would be influence. A rule with this set matches only a
            `riskScore` the requesting contract passes in `attributes` from its own deterministic rules (a
            payment''s rule score, for example). Using the AI score here needs the client to say so.

            '
        condition:
          type: string
          nullable: true
          description: '11.1.13. Evaluated against the attributes the caller supplied.


            **No condition language is defined yet** (pull audit R104, 26 September): the grammar, the
            attributes it may name and how two conditions are compared for `unreachableRule` are an
            open decision, not something to infer from this field.

            '
        approverRoleIds:
          type: array
          minItems: 1
          description: 'Role ids from `identity.listRoles` (`Role.id`), which is where an editor gets the
            names to show and pick from. This contract stores the ids only.

            '
          items:
            type: string
            format: uuid
        approverScopeLevel:
          type: string
          enum:
          - venue
          - department
          - region
          - tenant
          description: 11.1.39. Which organisational level the approver must sit at.
        mode:
          $ref: '#/components/schemas/ApprovalMode'
        levels:
          type: integer
          default: 1
          description: 11.1.3. Multi-level chains ask each level in turn.
        requiresMfa:
          type: boolean
          default: false
        requiresSignature:
          type: boolean
          default: false
        slaMinutes:
          type: integer
          nullable: true
          description: 11.1.14. Null means no SLA, which is different from a long one.
        escalateAfterMinutes:
          type: integer
          nullable: true
        escalateToRoleIds:
          type: array
          description: Role ids from `identity.listRoles`, as `approverRoleIds`.
          items:
            type: string
            format: uuid
        expiresAfterMinutes:
          type: integer
          nullable: true
          description: 11.1.53. An unanswered request eventually stops waiting.
        subjectTypes:
          type: array
          description: '**Which subjects of the kind this rule matches** (decided 2 October 2026, Chinmay; CHG-CSP-028,
            CHG-CSP-036, CHG-CSP-031): the `CreateApprovalRequest.subjectType` values, for example `topologyPublication`
            or `whiteLabelPublication` under `configurationChange`. Empty matches every subject of the kind. It is how a
            venue switches an optional review step on for one kind of act without routing every act of the kind.'
          items:
            type: string
            maxLength: 64
        signatureMethods:
          type: array
          description: '**The signature methods this level accepts, where `requiresSignature` is true** (design-notes
            correction on ADM-344, Block B: "Configuring which stages need a signature is a policy write";
            CHG-CSP-045). Values of `ApprovalSignature.method`. Empty accepts any of them. With `requiresSignature`
            this makes the rule the signature policy: which levels of which kinds need a signature, and how it is
            given; `signApprovalDecision` refuses a method the level does not accept.'
          items:
            type: string
            enum:
            - platformKey
            - uaePass
            - externalCertificate
            - drawnSignature
        externalProviderId:
          type: string
          format: uuid
          nullable: true
          description: '11.1.65 (29 September). **This level is decided in an external workflow system**
            (`ApprovalExternalProvider`) rather than by a person in TICVAI. `approverRoleIds` stay required:
            they are who decides if the provider does not answer in time and its `onTimeout` is
            `fallBackToRoles`.

            '
    ApprovalMatrix:
      type: object
      x-ticvai-persistence: approvals.matrix
      required:
      - kind
      - scopeLevel
      - rules
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        scopeLevel:
          type: string
          enum:
          - tenant
          - region
          - venue
        scopePath:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
          description: '11.1.80. **A request is decided by the rules it was raised under.** Changing the
            matrix mid-flight would mean an approver answering a question that changed while they read
            it.

            **(`kind`, `scopePath`, `version`) is unique**, and a stored version is never edited: a
            request''s `matrixVersion` names exactly one rule set (decided 28 September, audit R129 (2)).

            '
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRule'
        isActive:
          type: boolean
    ApprovalRequirement:
      type: object
      x-ticvai-persistence: none — computed
      description: The answer to "does this need approval", returned before the action.
      required:
      - isRequired
      properties:
        isRequired:
          type: boolean
        matchedRule:
          allOf:
          - $ref: '#/components/schemas/ApprovalRule'
          nullable: true
        matrixVersion:
          type: integer
          nullable: true
        approvers:
          type: array
          description: 'Resolved, with delegations applied. **Named so the caller can say "this needs
            Sara"** rather than "this needs approval".

            '
          items:
            type: object
            properties:
              principalId:
                type: string
                format: uuid
              displayName:
                type: string
              level:
                type: integer
              isDelegate:
                type: boolean
              delegatedFrom:
                type: string
                format: uuid
                nullable: true
        slaMinutes:
          type: integer
          nullable: true
        noApproverAvailable:
          type: boolean
          description: '**The case that must not fail silently.** A rule requiring a role nobody at this
            venue holds means the action is blocked forever, and the caller needs to know that now rather
            than after raising a request nobody can decide.

            '
    CreateApprovalRequest:
      type: object
      x-ticvai-persistence: none — request only
      required:
      - id
      - kind
      - subjectContract
      - subjectType
      - subjectId
      - scopePath
      - summary
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        subjectContract:
          type: string
          description: Which contract owns the thing being approved.
        subjectType:
          type: string
        subjectId:
          type: string
          description: '**A reference, never a copy.** A copy goes stale between raising and deciding,
            and an approver reading a stale copy approves something that no longer exists.

            '
        scopePath:
          type: string
        summary:
          type: string
          maxLength: 300
          description: What the approver sees in their queue before opening it.
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
        attributes:
          type: object
          additionalProperties: true
        justification:
          type: string
          maxLength: 1000
        isDraft:
          type: boolean
          default: false
          description: 'True saves the request at `draft` without routing it; `submitApprovalRequest`
            sends it later (decided 28 September, audit R129).

            '
    ApprovalDecision:
      type: object
      x-ticvai-persistence: approvals.decision
      required:
      - level
      - principalId
      - decision
      - decidedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        level:
          type: integer
        principalId:
          type: string
          format: uuid
        displayName:
          type: string
        isDelegate:
          type: boolean
        delegatedFrom:
          type: string
          format: uuid
          nullable: true
        decision:
          type: string
          enum:
          - approve
          - reject
        comment:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        usedMfa:
          type: boolean
        signatureRef:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
    ApprovalRequest:
      type: object
      x-ticvai-persistence: approvals.request
      required:
      - id
      - kind
      - status
      - requestedByPrincipalId
      - requestedAt
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        rerouteOnNoApprover:
          type: boolean
          default: true
          description: 'BL-154. **An approver on leave is an approval that waits for them to come back.**
            Reroutes to the next in the chain rather than stalling — `workforce` already knows who is
            on leave, and an approval queue nobody is watching is the thing that stops a venue.

            '
        outOfOfficeDelegateId:
          type: string
