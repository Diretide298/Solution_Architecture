    put:
      operationId: setApprovalMatrix
      x-ticvai-consumed-by:
        - "P08 BO-086 Approval Matrix"
        - "P08 BO-1120 Corporate Budget, Policy & Approval Rules"
        - "P08 BO-1149 Administrative Balance Adjustment Studio"
        - "P08 BO-639 Reviewer Assignment & Delegation"
        - "P08 BO-863 Resource Lifecycle, Governance & Audit"
        - "P09 ADM-242 Approval Matrix & Multi-Level Approval Configuration"
        - "P09 ADM-243 Roles, Authority, Delegation & Approval Limits"
        - "P09 ADM-330 Approval Authority Matrix"
        - "P09 ADM-331 Organizational Hierarchy Routing"
        - "P09 ADM-332 Department-Based Approval Matrix"
        - "P09 ADM-333 Venue & Tenant Approval Matrix"
        - "P09 ADM-334 Value & Threshold Routing"
        - "P09 ADM-335 Risk-Based & Conditional Routing"
        - "P09 ADM-530 AI Approval Requirement & Routing Configuration"
      x-ticvai-audience:
      - staff
      summary: Configure what requires approval
      description: '11.1.2. Rules are ordered and **the first match wins**, so adding a rule cannot silently
        change an unrelated one. A matrix with overlapping unordered rules is a matrix nobody can reason
        about, and the ordering is the thing that makes it reviewable.

        Changing a matrix creates a version (11.1.80). Requests in flight keep the version they were raised
        under — **a request must be decided by the rules it was raised under**, or an approver is answering
        a question that changed while they read it (confirmed 28 September, audit R129 (2)).


        **What counts as loosening — decided 28 September, audit R129 (1).** A rule set here loosens the
        rule it inherits from the level above when it does **any one** of three things for the same
        `kind` and an overlapping amount range: **a higher threshold** (a larger `minAmount`, so fewer
        requests need approval); **fewer approvers** (a smaller `levels`, or `parallel` or `majority`
        where the parent asks for `sequential` or `consensus`); or **a different approver role** (an
        `approverRoleIds` entry the parent rule does not name). Dropping a `requiresMfa` or
        `requiresSignature` the parent sets is loosening too. Any of them is refused `409`
        `loosensParentRule`.


        **Which level a caller sets — decided 28 September, audit R183.** A caller sets only the matrix
        of the scope node they act at: a venue sets the venue matrix, a region the region matrix and the
        tenant the tenant default. The body''s `scopeLevel` must be that node''s level, or the call is
        refused `400`; nobody writes a matrix for a level above or below their own through this call.


        **PUT semantics — keyed on `kind` and the scope, never on an id.** There is no id in the path
        and `ApprovalMatrix.id` is read-only, so the body names its target: the matrix for `kind` at
        `scopeLevel`, on the scope node the caller is acting at (`scopePath` is read-only and set from
        it). Where no matrix exists for that pair, this creates version 1 and answers `201`; where one
        does, it stores a new version and answers `200`. **The body replaces the rule set whole**: the
        new version holds exactly the rules in `rules`, in their `order`, and a rule omitted from the
        body is not in the new version. Rule `id`s are read-only and ignored on input — each version
        carries its own rule rows. The previous version is kept, never edited, because requests in
        flight still point at it.

        '
      tags:
      - matrix
      x-ticvai-permission: APPROVAL_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalMatrix'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: '../shared/common.yaml#/components/headers/ConsistencyToken'
          description: Set, as a new version of the existing matrix for this `kind` and scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalMatrix'
        '201':
          description: Created — no matrix existed for this `kind` and scope, so this is version 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalMatrix'
        '400':
          description: 'Validation failed. Includes a `scopeLevel` that is not the level of the scope node
            the caller acts at (audit R183); `errors[]` names `scopeLevel`.

            '
          x-ticvai-problem-types:
          - validation
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '409':
          description: 'Refused, and nothing is stored. `refusedReason` says which: `loosensParentRule`
            — the matrix would loosen a rule set at a higher scope (a higher threshold, fewer approvers
            or a different approver role; audit R129); or `unreachableRule` — a rule can
            never match because an earlier one always does. `ruleOrder` names the offending rule, and
            `blockingRuleOrder` or `parentScopePath` names what it collides with.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApprovalMatrixRefusedProblem'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
