            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    ApprovalRefusedProblem:
      description: 'Why `decideApprovalRequest` refused this approver. **`refusedReason` is always
        present**, one value per cause, so a client can tell "you raised it" from "you need a second
        factor" without reading `detail`. The shared `Forbidden` carries no `refusedReason`.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        x-ticvai-persistence: none — error shape
        required:
        - refusedReason
        properties:
          refusedReason:
            type: string
            description: '`levelDecidedExternally` (29 September): the current level waits on an external
              workflow system and a person cannot decide it until it falls back on timeout.
              `notExternalProvider`: `recordExternalApprovalDecision` called by a client that is not the
              provider the level was sent to.

              '
            enum:
            - approverIsRequester
            - notInApproverChain
            - insufficientPermission
            - mfaRequired
            - signatureRequired
            - delegationExpired
            - alreadyDecidedAtThisLevel
            - levelDecidedExternally
            - notExternalProvider
    ApprovalStateProblem:
      x-ticvai-persistence: none — error shape
      description: 'A request is not in a state that allows the call. Returned as `409` by
        `createApprovalRequest` (`openRequestExists`), `submitApprovalRequest` (`notDraft`,
        `openRequestExists`), `decideApprovalRequest` (`alreadyDecided`,
        `withdrawn`, `expired`, `cancelled`) and `withdrawApprovalRequest` (`alreadyDecided`). One
        value per cause, so "someone already approved it" and "it timed out" are told apart.
        Since 2 October 2026 also `cancelApprovalRequest` (`alreadyDecided`, `withdrawn`, `expired`,
        `cancelled`) and `reopenApprovalRequest` (`openRequestExists`, `alreadyDecided`, `withdrawn`),
        with the values above (CHG-CSP-043).

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - refusedReason
        properties:
          refusedReason:
            type: string
            enum:
            - openRequestExists
            - notDraft
            - alreadyDecided
            - withdrawn
            - expired
            - cancelled
          requestId:
            type: string
            format: uuid
            description: 'The request the refusal is about. With `openRequestExists`, the open request
              already raised for this subject.

              '
          currentStatus:
            allOf:
            - $ref: '#/components/schemas/ApprovalStatus'
            description: The status that request is in now.
    ApprovalMatrixRefusedProblem:
      x-ticvai-persistence: none — error shape
      description: 'Why `setApprovalMatrix` stored nothing. One value per cause: `loosensParentRule`
        (a venue or region may tighten what it inherits and never loosen it; a higher threshold, fewer
        approvers or a different approver role each loosens, decided 28 September, audit R129) or
        `unreachableRule` (first match wins, so a rule behind one that always matches first can never
        apply).

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - refusedReason
        - ruleOrder
        properties:
          refusedReason:
            type: string
            enum:
            - loosensParentRule
            - unreachableRule
          ruleOrder:
            type: integer
            description: '`order` of the rule in the body that was refused.'
          blockingRuleOrder:
            type: integer
            nullable: true
            description: With `unreachableRule`, the `order` of the earlier rule that always matches first.
          parentScopePath:
            type: string
            nullable: true
            description: With `loosensParentRule`, the scope whose matrix sets the rule being loosened.
    DelegationRefusedProblem:
      x-ticvai-persistence: none — error shape
      description: 'Why `createApprovalDelegation` stored nothing. `invalidWindow` and
        `delegateIsDelegator` come with `400`; `delegateLacksPermission` and
        `exceedsDelegatorAuthority` with `403`.

        '
      allOf:
      - $ref: ../shared/common.yaml#/components/schemas/Problem
      - type: object
        required:
        - refusedReason
        properties:
          refusedReason:
            type: string
            enum:
            - invalidWindow
            - delegateIsDelegator
            - delegateLacksPermission
            - exceedsDelegatorAuthority
    StepUpPolicyRefusedProblem:
