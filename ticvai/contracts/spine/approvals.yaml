        shape follows resolveApprovedActionExecution'
      summary: An operator's intervention in a running workflow
      description: '**The monitors'' action buttons, as one operation** (decided 29 September, writers pass).
        The Workflow Instance Monitor, the Exception, Failure & Recovery Center and the SLA, Escalation &
        Bottleneck Monitor list instances; this is what an operator does to one. **Every action carries a
        reason and is kept** as an `approvals.workflow_intervention` row with the acting principal and the
        values before and after, because an intervention in a running workflow is evidence of the same kind
        as a decision.


        - `reassign` hands the waiting task step (`workflowStepExecutionId`) to `assigneePrincipalId`. On an
        approval step it re-routes the pending approver of the step''s `approvals.request`; the requester can
        never be the assignee (segregation of duties, `422`).

        - `retryStep` re-runs the failed step, or the step named by `workflowStepExecutionId` (Retry From Step);
        the instance goes `failed` to `running` and its open exception to `retrying`.

        - `skipStep` moves past the step to the next node, or to `alternativeNodeId` (Use Approved Alternative),
        **only where the published version''s graph marks the node skippable or the alternative as an allowed
        edge** (`422` otherwise). **An approval node is never skipped** (`409`): skipping it would grant
        an approval nobody gave.

        - `resume` continues a `failed` instance from its recorded step; `correctedInput` (Correct Data) replaces
        the step''s input, and the original is kept on the intervention row.

        - `cancel` ends the instance (`cancelled`). An open approval request it raised is withdrawn, and partial
        executions are compensated where the trigger says `compensate`.

        - `extendSla` moves `slaDueAt` on by `extendByMinutes` (1 to 43,200). A breach already recorded stays
        recorded: extending the clock does not rewrite `slaBreached`.

        - `addBackupApprover` adds `assigneePrincipalId` to the pending approval request of the step. **It
        adds an approver and replaces nobody**, as `escalateApprovalRequest` does.

        - `changePriority` sets the instance''s `priority`.

        - `escalateException` passes the exception `workflowExceptionId` to `assigneePrincipalId` (`escalated`).


        A `completed` or `cancelled` instance cannot be acted on (`409`). When the action is taken from the
        exception center, `workflowExceptionId` names the exception, and it is `resolved` when the instance
        continues or `cancelled` with the instance. **The engine still executes**: this records the operator''s
        instruction and the engine carries it out, re-checking the called action''s authority as it does
        for every call (pack 13.1.8). Transitions in `states/workflow-instance.yaml`.

        '
      tags:
      - approvals
      x-ticvai-permission: APPROVAL_ACT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInstanceActionInput'
      responses:
        '200':
          headers:
            X-Consistency-Token:
              $ref: ../shared/common.yaml#/components/headers/ConsistencyToken
          description: Intervention recorded; the instance as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          description: The instance is completed or cancelled, the action does not apply in its current status
            (for example `resume` on an instance that has not failed), or the step to skip is an approval node
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: A field the action needs is missing (assigneePrincipalId, extendByMinutes, priority,
            workflowExceptionId), the node is not skippable or the alternative is not an allowed edge, or the
            assignee is the requester of the approval
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'

