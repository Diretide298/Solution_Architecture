    AccessAccessChange:
      type: object
      x-ticvai-persistence: access.access_change
      description: '**Taken from the backend workbook, 20 September.** Audits ticket/access replacement during an upgrade. The old access should normally be marked UPGRADED/REPLACED and the new access becomes ACTIVE; old records should not be deleted.'
      required:
      - oldAccessId
      - type
      - changedAt
      properties:
        id:
          type: string
          format: uuid
        oldAccessId:
          type: string
          format: uuid
        newAccessId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          maxLength: 30
        orderId:
          type: string
          format: uuid
          nullable: true
        upgradeId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 500
          nullable: true
        changedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        changedAt:
          type: string
          format: date-time
    AccessEntryRulePoint:
      type: object
      x-ticvai-persistence: access.entry_rule_point
      description: '**Taken from the backend workbook, 20 September.** Maps the access points that are allowed for an admission profile.'
      required:
      - admissionProfileId
      - accessPointId
      - isActive
      - createdAt
      properties:
        admissionProfileId:
          type: string
          format: uuid
        accessPointId:
          type: string
          format: uuid
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
    DraftedRecord:
      type: object
      x-ticvai-provisional: true
      description: '**A provisional envelope, drafted 2026-09-04 from the workshop pack.** It carries
        what every one of these screens needs to address a row and nothing it has not earned. **There
        is deliberately no `x-ticvai-persistence`** - naming a table here would put a storage decision
        nobody made into the ER model and the DDL.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        updatedAt:
          type: string
          format: date-time
    CreateAccessPointRequest:
      type: object
      required:
      - code
      - name
      - venueId
      - direction
      properties:
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        venueId:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/Direction'
        antiPassbackEnabled:
          type: boolean
          default: false
        requiresExitBeforeReentry:
          type: boolean
          default: false
        driver:
          type: string
    Entitlement:
      type: object
      x-ticvai-persistence: access.entitlement
      description: '**What a guest actually holds.** Found missing on 18 August by the schema audit —
        33 tables in `orders`, seven in `access`, and none of them stored an issued ticket.

        The package sold products, defined `EntitlementTemplate`, recorded `ScanEvent.ticketId`, transferred
        `ticket_transfer.ticketIds` and issued `wallet_pass.entitlementId` — **five artefacts referring
        to a thing that did not exist.** `validateAccess` read the *template* and never the instance,
        and `suspendEntitlement` suspended the template, **which would have suspended it for every guest
        who held one.**

        **The template is the definition and this is the instance.** A template says *an annual pass admits
        once a day for a year*; this says *this guest''s annual pass, bought on 3 March, used eleven times,
        frozen for two weeks in July, valid until 2 March.*

        '
      required:
      - id
      - templateId
      - productId
      - orderId
      - subjectId
      - status
      - validFrom
      - validTo
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: 'A ULID, matching `TicketStatus.ticketId` — **stable for the life of the ticket
            and independent of the media carrying it.** A guest whose wristband broke keeps the same entitlement
            with a new `mediaCode`.

            '
        templateId:
          type: string
          format: uuid
          description: 'The definition it was issued against. **Pinned at issue** — a template edited
            next month must not change what this guest bought.

            '
        productId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        orderLineId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: 'Who holds it. **Null is legitimate** — a ticket bought as a gift or sold at a
            till to somebody who gave no details has no subject until it is claimed.

            '
        venueId:
          type: string
          format: uuid
        scopePath:
          type: string
        mediaCode:
          type: string
          description: 'What is scanned — a QR payload, a wristband serial, a card number. **Rotatable
            without reissuing**, because a guest whose wristband broke should not need a new ticket.

            '
        status:
          $ref: ../spine/orders.yaml#/components/schemas/EntitlementStatus
        statusNote:
          type: string
          nullable: true
          description: '**Not `TicketStatus` — that is a validation result with a misleading name**, computed
            at scan time and carrying `isValid` and `isInsideVenue`. The lifecycle is `orders.EntitlementStatus`,
            and `states/entitlement-status.yaml` has modelled it since before this table existed.

            **Which is the finding in one line: the package had the lifecycle, the state model and the
            validation result, and no row to hang them on.**

            '
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
          description: '**Resolved at issue from the template, then owned here.** A freeze extends it,
            a reissue replaces it, and neither reaches back to the template.

            '
        entriesUsed:
          type: integer
          default: 0
          description: '**The number `validateAccess` decrements and nothing was decrementing.** A ten-entry
            pass with no counter is a ten-entry pass that admits forever.

            '
        entriesAllowed:
          type: integer
          nullable: true
        lastEntryAt:
          type: string
          format: date-time
          nullable: true
        frozenDays:
          type: integer
          default: 0
          description: 'Days added by a freeze. **Held here rather than computed from a freeze log**,
            because a gate has to answer in under 300ms and cannot replay a history to decide validity.

            '
        suspendedReason:
          type: string
          nullable: true
        isNameBound:
          type: boolean
          default: false
        holderName:
          type: string
          nullable: true
        sharedWithSubjectIds:
          type: array
          description: '`shareEntitlement`. **The owner keeps it and a second person may present it**
            — the asymmetry that stops a shared family pass becoming a resale chain.

            '
          items:
            type: string
            format: uuid
        issuedVia:
          type: string
          enum:
          - sale
          - invitation
          - reissue
          - transfer
          - resale
          - membership
          - groupBooking
          description: '**How it came to exist, and it matters to finance.** A sold entitlement carries
            deferred revenue; an invitation carries a marketing cost; a reissue carries neither.

            '
        supersedesEntitlementId:
          type: string
          format: uuid
          nullable: true
          description: 'For a reissue or a resale. **The chain is traceable** — a ticket appearing from
            nowhere is indistinguishable from a fraudulent one.

            '
        walletValueId:
          type: string
          format: uuid
          nullable: true
          description: 'Where the template carries stored value. **A `retail.Wallet` bound to the entitlement,
            not a balance on it** (CF-126).

            '
    FacePassEnrolment:
      type: object
      x-ticvai-persistence: pii.subject_biometric
      description: '3.2.43. **Metadata about a facial profile. Never the profile.**

        '
      required:
      - id
      - subjectId
      - entitlementId
      - source
      - capturedAt
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        entitlementId:
          type: string
          format: uuid
        source:
          type: string
          enum:
          - guestApp
          - ticketCounter
          - annualPassCounter
        capturedAt:
          type: string
          format: date-time
        consentPurposeId:
          type: string
          format: uuid
        consentGivenAt:
          type: string
          format: date-time
        guardianSubjectId:
          type: string
          format: uuid
          nullable: true
          description: Where the subject is a minor (3.2.12).
        isActive:
          type: boolean
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: '**Bounded by the entitlement it belongs to.** A face outliving the pass it was
            enrolled for is a biometric held for no stated purpose, which CF-64 has to settle.

            '
    ParkingIntegrationMode:
      type: string
      description: 'CF-52, settled 14 August. **Not variations of one thing** — each decides what happens
        at sale and what a guest presents at the barrier.

        '
      enum:
      - none
      - plateWhitelist
      - qrHandoff
    ParkingFacility:
      type: object
      x-ticvai-persistence: access.parking_facility
      required:
      - name
      - venueId
      - mode
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        venueId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/ParkingIntegrationMode'
        capacity:
          type: integer
          nullable: true
        takesPayment:
          type: boolean
          readOnly: true
          default: false
          description: '**Always false, and stated rather than assumed** (19.2.78, CF-124). The requirement
            asks the guest app to take parking payments; the client decided on 14 August that it does
            not.

            All three integration models are entitlement-based — the ticket carries the parking right
            and the platform pushes a plate or a code. **Pay-per-hour parking unrelated to a ticket runs
            on the parking system''s own POS**, because taking that money here would make the venue an
            acquirer for parking, with a settlement path and a tax treatment nobody has designed.

            The field exists so that a future reversal is a value change with a visible blast radius,
            rather than a silent gap somebody rediscovers.

            '
        vendorSwapTargetDays:
          type: integer
          readOnly: true
          default: 5
          description: '**A new parking vendor should take days, not weeks** — Qossai, 14 August. The
            team has integrated parking APIs before and the architecture is expected to make the next
            one cheap.

            Recorded as a design constraint rather than a runtime value: **everything vendor-specific
            lives in `vendorName`, `endpoint` and `credentialRef`**, and the three modes are the adaptor
            surface (ADR-0012). A vendor needing a fourth mode is the signal this has been violated.

            '
        vendorName:
          type: string
          nullable: true
        endpoint:
          type: string
          nullable: true
        credentialRef:
          type: string
          nullable: true
          description: A vault reference, never the credential.
        pushLeadMinutes:
          type: integer
          nullable: true
          description: 'How far ahead of the visit a plate is pushed. **Too early and the whitelist fills
            with cars that will not arrive; too late and the guest is at the barrier.**

            '
        accessPointIds:
          type: array
          description: Where the platform validates its own code, in `none` and `qrHandoff` modes.
          items:
            type: string
            format: uuid
        isActive:
          type: boolean
    ParkingEntitlementStatus:
      type: string
      enum:
      - pending
      - pushed
      - pushFailed
      - active
      - used
      - expired
      - revoked
    ParkingEntitlement:
      type: object
      x-ticvai-persistence: access.parking_entitlement
      required:
      - facilityId
      - orderId
      - validFrom
      - validTo
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        facilityId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        plateNumber:
          type: string
          nullable: true
          description: 'Required in `plateWhitelist` mode, meaningless in the others. **Personal data**
            — a plate identifies a person, so it lives under the same rules as a contact point.

            '
        plateCountry:
          type: string
          nullable: true
        mediaCode:
          type: string
          nullable: true
          description: The code presented in `none` and `qrHandoff` modes.
        status:
          $ref: '#/components/schemas/ParkingEntitlementStatus'
        pushedAt:
          type: string
          format: date-time
          nullable: true
        pushFailureReason:
          type: string
          nullable: true
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    AdmissionRules:
      x-ticvai-persistence: access.admission_rules
      type: object
      required:
      - id
      - code
      - name
      - openMinutesBefore
      - closeMinutesAfter
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 64
        perProductRules:
          type: array
          description: 'BL-059. **Transaction rules were per profile and a ticket type could not state
            its own.** An annual pass allowing one entry per day and a single ticket allowing one entry
            ever are different rules, and forcing a profile per product multiplies profiles instead.

            '
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              entriesPerDay:
                type: integer
                nullable: true
              minimumGapMinutes:
                type: integer
                nullable: true
                description: '**Anti-passback in minutes rather than a boolean.** A guest leaving for
                  lunch and returning in forty minutes is normal; the same scan twice in ten seconds is
                  a card being passed back over a fence.

                  '
              allowedAccessPointIds:
                type: array
                items:
                  type: string
                  format: uuid
        name:
          type: string
          maxLength: 200
        openMinutesBefore:
          type: integer
          description: How long before a performance validation opens.
        closeMinutesAfter:
          type: integer
        maxDurationMinutes:
          type: integer
          nullable: true
        requiresExitBeforeReentry:
          type: boolean
          default: false
        maxReentries:
          type: integer
          nullable: true
        allowedAccessPointIds:
          type: array
          items:
            type: string
            format: uuid
          description: Empty means any access point in the venue.
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    BlacklistEntry:
      x-ticvai-persistence: access.blacklist
      type: object
      required:
      - mediaCode
      - reason
      - addedAt
      - addedByPrincipalId
      properties:
        mediaCode:
          type: string
        reason:
          type: string
        addedAt:
          type: string
          format: date-time
        addedByPrincipalId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          nullable: true
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    MediaKind:
      type: string
      enum:
      - qr
      - barcode
      - rfid
      - nfc
      - magstripe
      - mobileWallet
      - biometric
      - manual
    Direction:
      type: string
      enum:
      - entry
      - exit
      - reentry
      - crossover
    TurnstileMode:
      type: string
      enum:
      - entry
      - reentry
      - crossover
      - exit
      - freeRotation
      - closed
    ScanOutcome:
      type: string
      enum:
      - admitted
      - denied
      - overridden
    DenyReason:
      type: string
      description: 'Enumerated so the client can render an appropriate operator prompt. A gate operator
        facing a queue needs a reason and a next action, not a boolean.

        '
      enum:
      - notFound
      - notYetValid
      - expired
      - alreadyUsed
      - reentryLimitReached
      - exitRequiredBeforeReentry
      - wrongAccessPoint
      - wrongPerformance
      - outsideAdmissionWindow
      - entitlementSuspended
      - blacklisted
      - capacityReached
      - waiverRequired
      - accompanimentRequired
      - mediaDeactivated
      - unpaid
      - delegatedRightExhausted
      - delegatedRightRevoked
    ValidateRequest:
      type: object
      required:
      - id
      - mediaCode
      - mediaKind
      - direction
      - recordedAt
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Client-generated ULID. Also the idempotency key and dedupe key.
        mediaCode:
          type: string
          maxLength: 256
          description: 'What was read from the media. NOT the ticket id — media can be re-linked over
            a ticket''s life.

            '
        mediaKind:
          $ref: '#/components/schemas/MediaKind'
        direction:
          $ref: '#/components/schemas/Direction'
        groupSize:
          type: integer
          minimum: 1
          description: For group media admitting several holders on one read.
        proximityToken:
          type: string
          description: 'BLE proximity assertion where the venue requires the operator to be physically
            at the gate. Absent where not configured.

            '
        recordedAt:
          type: string
          format: date-time
          description: Device time of the read. Authoritative for ordering, not for validity.
    ValidationResult:
      x-ticvai-persistence: none — computed, persisted as scan_event
      type: object
      required:
      - scanId
      - outcome
      - accessPointId
      - recordedAt
      properties:
        scanId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        outcome:
          $ref: '#/components/schemas/ScanOutcome'
        denyReason:
          $ref: '#/components/schemas/DenyReason'
        denyDetail:
          type: string
          description: Human-readable, localised. For operator display, never for logic.
        accessPointId:
          type: string
          format: uuid
        ticket:
          $ref: '#/components/schemas/TicketStatus'
        admittedCount:
          type: integer
          description: Holders admitted on this read. Differs from groupSize on partial admission.
        recordedAt:
          type: string
          format: date-time
        serverEvaluatedAt:
          type: string
          format: date-time
    TicketStatus:
      x-ticvai-persistence: none — computed from entitlement and scans
      description: '**A validation result, not a lifecycle**, despite the name. Computed at scan time
        from the entitlement and its scan history — `isValid`, `entriesUsed`, `isInsideVenue`.

        **The name misled a state model into anchoring on it** (`states/entitlement.yaml`, removed 18
        August): six lifecycle states were checked against an object with no values, and `check-states`
        warned about it for a day before anyone read the schema.

        The entitlement''s lifecycle is `orders.EntitlementStatus`. **This is what a gate learns when
        it scans**, which is a different question with a similar name.

        '
      type: object
      required:
      - ticketId
      - isValid
      properties:
        ticketId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Stable for the life of the ticket, independent of the media carrying it.
        mediaCode:
          type: string
          nullable: true
        productName:
          type: string
        holderName:
          type: string
          nullable: true
          description: 'Present only where the entitlement is name-bound. Identity and entitlement are
            separate concerns; most entitlements carry no holder.

            '
        isValid:
          type: boolean
        validFrom:
          type: string
          format: date-time
          nullable: true
        validTo:
          type: string
          format: date-time
          nullable: true
        performanceId:
          type: string
          format: uuid
          nullable: true
        entriesUsed:
          type: integer
        entriesAllowed:
          type: integer
          nullable: true
          description: Null means unlimited.
        reentryAllowed:
          type: boolean
        isInsideVenue:
          type: boolean
          description: Derived from the last scan. Drives anti-passback evaluation.
        issuingCellId:
          type: string
          nullable: true
          description: 'Present when this entitlement was issued in a different cell and is being redeemed
            here as a delegated right (ADR-0010). Null for locally issued tickets.

            '
        guestLinkId:
          type: string
          nullable: true
          description: 'Pseudonymous cross-region guest reference. Present only on delegated rights. Carries
            no personal data.

            '
        admissionRulesId:
          type: string
          format: uuid
        denyReason:
          $ref: '#/components/schemas/DenyReason'
    OfflineScan:
      x-ticvai-persistence: none — client-side journal
      allOf:
      - $ref: '#/components/schemas/ValidateRequest'
      - type: object
        required:
        - sequence
        - localOutcome
        properties:
          sequence:
            type: integer
            minimum: 1
            description: Monotonic per device. The server processes in this order.
          localOutcome:
            allOf:
            - $ref: '#/components/schemas/ScanOutcome'
            description: 'What the device decided offline. The server is authoritative and may disagree;
              disagreements are returned for reconciliation, not discarded.

              '
          localDenyReason:
            $ref: '#/components/schemas/DenyReason'
          overriddenByPrincipalId:
            type: string
            format: uuid
            nullable: true
          overrideReason:
            type: string
            nullable: true
    ScanSyncResult:
      x-ticvai-persistence: none — computed
      type: object
      required:
      - accepted
      - results
      properties:
        accepted:
          type: integer
          description: Entries processed before any stop.
        stoppedAtSequence:
          type: integer
          nullable: true
          description: 'Sequence of the first entry that could not be processed. Null when the whole batch
            succeeded. The client retries from here — never past it.

            '
        results:
          type: array
          items:
            type: object
            required:
            - id
            - sequence
            - status
            properties:
              id:
                type: string
              sequence:
                type: integer
              status:
                type: string
                enum:
                - accepted
                - duplicate
                - reconciled
                - rejected
              serverOutcome:
                $ref: '#/components/schemas/ScanOutcome'
              divergence:
                type: string
                nullable: true
                description: 'Present when `reconciled` — the device admitted and the server would have
                  denied, or vice versa. Surfaced to the operator, not swallowed.

                  '
              error:
                $ref: ../shared/common.yaml#/components/schemas/Problem
    ScanEvent:
      x-ticvai-persistence: access.scan_event
      type: object
      required:
      - id
      - accessPointId
      - venueId
      - outcome
      - direction
      - recordedAt
      properties:
        id:
          type: string
        accessPointId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
        scopePath:
          type: string
        ticketId:
          type: string
          nullable: true
        mediaCode:
          type: string
          nullable: true
        outcome:
          $ref: '#/components/schemas/ScanOutcome'
        denyReason:
          $ref: '#/components/schemas/DenyReason'
        direction:
          $ref: '#/components/schemas/Direction'
        operatorPrincipalId:
          type: string
          format: uuid
          nullable: true
        deviceId:
          type: string
          format: uuid
          nullable: true
        overriddenByPrincipalId:
          type: string
          format: uuid
          nullable: true
        overrideReason:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while pending. Differs from recordedAt for offline scans.
    AccessPoint:
      x-ticvai-persistence: access.access_point
      type: object
      required:
      - id
      - code
      - name
      - venueId
      - mode
      - isActive
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        venueId:
          type: string
          format: uuid
        scopePath:
          type: string
        externalCredentialSources:
          type: array
          description: 'BL-108. **A hotel room card admitting a guest to a water park** — externally issued,
            and the platform validates it without having sold it.

            **The entitlement is created on first use, not on check-in.** A hotel with 400 rooms does
            not want 400 entitlements a night for guests who never visit.

            '
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - hotelRoomCard
                - corporateBadge
                - cityPass
                - transitCard
                - partnerToken
              providerName:
                type: string
              endpoint:
                type: string
              credentialRef:
                type: string
              grantsProductId:
                type: string
                format: uuid
        scanAnomalyRules:
          type: array
          description: 'BL-104. **Rule-based scan anomalies, separated from the parked model-based engine**
            — device sharing, simultaneous entries at two gates, an impossible walking time between them.

            **These are deterministic and need no model**, which is why they are here and not in `ai`:
            two entries eight seconds apart at gates four hundred metres apart is arithmetic.

            '
          items:
            type: object
            properties:
              rule:
                type: string
                enum:
                - simultaneousEntry
                - impossibleTravelTime
                - rapidReentry
                - sharedDevice
                - velocityBreach
              action:
                type: string
                enum:
                - log
                - flag
                - requireSupervisor
                - deny
              thresholdSeconds:
                type: integer
                nullable: true
        operatingMode:
          type: string
          enum:
          - normal
          - freeFlow
          - dropArm
          - closed
          - podium
          - maintenance
          default: normal
          description: 'BL-107 and BL-109. **A closed turnstile and one in emergency drop-arm mode look
            the same in the model and are opposite in meaning.** Closed refuses everybody; drop-arm lets
            everybody through, and it is the state that exists for an evacuation.

            **`podium` is a supervised validation position** — a member of staff directing a group through
            a lane, validating by eye against a list. It scans nothing and it is how school parties actually
            enter.

            **`freeFlow` counts without validating.** Useful at a free event, and a mode that must be
            visibly distinct from a broken reader.

            '
        vehicleLocationCapture:
          type: boolean
          default: false
          description: 'BL-023. **Nothing helped a guest find their vehicle.** Where the access point
            is a car park entry, the level and zone are captured against the visit so the app can answer
            it — **the guest who cannot find their car at 11pm is the last impression of the day.**

            '
        mode:
          $ref: '#/components/schemas/TurnstileMode'
        direction:
          $ref: '#/components/schemas/Direction'
        antiPassbackEnabled:
          type: boolean
        isActive:
          type: boolean
        lastHeartbeatAt:
          type: string
          format: date-time
          nullable: true
