openapi: 3.1.0
info:
  title: TICVAI Access Control
  version: 1.0.0
  x-ticvai-screen-count: 177
  x-ticvai-tier: spine
  x-ticvai-module: 3 — Admission and Access
  x-ticvai-requirements: 201
  x-ticvai-capabilities:
  - C09
  - C10
  - C23
  - C25
  - C26
  - C29
  x-ticvai-platforms:
  - P07 Venue Scanner
  - P04 POS
  - P06 Venue Staff App
  description: "## What this contract covers\n**The highest-frequency operation in a venue. Must work\
    \ with no network.**\n| | | |---|---| | **Tier** | spine | | **Matrix domain** | 3 — Admission and\
    \ Access | | **Requirements** | ~201 | | **Capabilities** | C09, C10, C23, C25, C26, C29 | | **Consumed\
    \ by** | P07 Venue Scanner · P04 POS · P06 Venue Staff App |\n## How to read this file\n**This file\
    \ is a contract.** It is hand-authored and it is the source of truth for one bounded context: server\
    \ code, client code and mock servers are generated from it, never the other way round. If a field\
    \ is not here, it does not exist.\n**Contracts are split into two tiers.**\n- **Spine** — the eight\
    \ contexts everything else depends on: tenancy, identity,\n  catalogue, orders, shift, access, finance,\
    \ cross-region. Frozen first. A change here\n  requires a formal change request, because every satellite\
    \ has pinned against it.\n- **Satellite** — a domain that builds on the spine and can move independently.\n\
    \  Cheaper to change.\n\n**`paths` are operations.** Each one declares four TICVAI extensions, and\
    \ Redocly rejects any that does not:\n| Extension | Answers | |---|---| | `x-ticvai-permission` |\
    \ Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed\
    \ | | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held | |\
    \ `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this | | `x-ticvai-conflict-policy`\
    \ | How a replayed operation resolves — `append`, `serverWins`, `manual` |\nWhere `x-ticvai-permission`\
    \ is null, one of these says why: `x-ticvai-auth: service` (cell-to-cell), `x-ticvai-self-scoped`\
    \ (acts only on the caller's own resources), or `security: []` (genuinely public).\n**`components.schemas`\
    \ are API schemas — the shape of data on the wire.** They are not database tables. One API schema\
    \ may become three columns (`Money`) or five tables (`Order`); some have no table at all (`ValidationResult`,\
    \ `TrialBalance`). Roughly 70% of the DDL derives from these, and the rest — partitioning, RLS, the\
    \ PII split — is storage design that lives in the migration scripts.\n**Where a schema maps to storage,\
    \ `x-ticvai-persistence` says so.** The value is a table name, a list of tables, or `none` with a\
    \ reason. It is documentation of the mapping, not a generator input — the DDL lives in versioned SQL\
    \ migrations, because partitioning, RLS policies, `ltree` indexes and partial indexes have no expression\
    \ in OpenAPI.\n**`security` arrays hold OAuth scopes.** Empty means \"this scheme, no scopes\" — for\
    \ bearer tokens there is nothing to list. Empty is not the same as absent: absent means unauthenticated.\n\
    \n## This context\nEntitlement validation at an access point, and the sync path for scans recorded\
    \ offline. Capability C09.\nSettled positions this encodes:\n- Identity and entitlement are separate.\
    \ Validation answers *does this media carry a\n  valid entitlement for this access point right now*,\
    \ not *who is this*.\n- Ticket ID and Media Code are different things. Media can be re-linked; the\
    \ ticket ID\n  does not change.\n- Validation reads the primary unconditionally. A ticket sold at\
    \ the front gate and\n  scanned twenty metres later must not be refused by a lagging replica.\n- Scans\
    \ recorded offline are appended, never conflicting, deduplicated on the\n  client-generated ULID.\n\
    - Deny is always explained. A gate operator facing a queue needs a reason, not a\n  boolean.\n\nCross-cell\
    \ (ADR-0014, ADR-0010): entitlements cross cells. A ticket issued in one cell is validated in another\
    \ as a REDEMPTION RIGHT — a narrow projection carrying only what a gate needs, with no personal data.\
    \ Redemption is authoritative in the consuming cell and reconciled back to the issuer, exactly as\
    \ offline scans are authoritative on the device and reconciled to the server. The gate must work when\
    \ the inter-cell link is down.\nNOT in this contract: turnstile hardware control. That is a driver\
    \ concern, and the vendor SDK is outstanding. The API surface above is independent of it.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: validation
- name: sync
- name: accessPoint
paths:
  /access/validate:
    post:
      operationId: validateAccess
      x-ticvai-consumed-by:
        - "P06 EMP-010 Scan — ready"
        - "P06 EMP-015 Group scan"
        - "P06 EMP-017 Sync & reconciliation"
        - "P07 SCN-003 Ready to scan"
        - "P07 SCN-007 Group admission"
        - "P07 SCN-008 Manual entry"
        - "P07 SCN-009 Ticket lookup"
        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      x-ticvai-audience:
      - staff
      summary: Validate media at an access point and admit or deny
      description: 'The access point is inherited from the session''s workstation and is not a request
        parameter — an operator cannot validate against a gate they are not at.

        This operation is offline-capable. When executed offline the client evaluates the cached entitlement
        and deny rules locally, records the outcome, and replays through /access/scans on reconnect. The
        server is authoritative on replay and may downgrade a local `admitted` to `denied`; the client
        surfaces that as a reconciliation item rather than silently discarding it.

        '
      tags:
      - validation
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: 'Validation completed. Check `outcome` — a denial is a successful validation, not
            an error.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          description: Media not recognised in this cell
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /my/entitlements/all:
    get:
      operationId: listEntitlements
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P02 GST-012 My Tickets"
      summary: Every entitlement this guest holds, including expired
      description: '**Raised in review 24 August** against `WEB-018`. `listMyEntitlements` returns what
        is currently usable; the web account page shows a history — used, expired, transferred away.

        **Two operations rather than a flag**, because the hot path is the gate. `listMyEntitlements`
        is read at admission and must stay narrow; a history query that scans every entitlement a guest
        has ever held does not belong on the same endpoint.

        '
      tags:
      - access
      x-ticvai-permission: null
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - guest
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: includeExpired
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Entitlements, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entitlement'
  /guests/me/entitlements:
    get:
      operationId: listMyEntitlements
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P02 GST-001 Home – Default"
        - "P02 GST-012 My Tickets"
        - "P04 POS-002 Sell — Ticket Catalogue"
      summary: Every ticket, pass and membership this guest holds
      description: '**Raised in review by Pranay and Deep, independently, on four screens.** `GST-012
        My Tickets`, `GST-013 Ticket Details`, `GST-019 Order History` and `WEB-018` each declared one
        operation — `transferOrderTickets` — so **a guest could give a ticket away and could not read
        it.**

        `getMediaEntitlements` and `lookupTicket` both exist and are both staff-only. **The read surface
        a guest needs was never built**, which only became visible once `access.entitlement` existed at
        all.

        **Grouped by validity, not by purchase date.** A guest opening this at a gate wants what works
        today at the top; the order they bought things in is the operator''s question.

        '
      tags:
      - access
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - usableNow
          - upcoming
          - expired
          - all
          default: usableNow
      - name: includeShared
        in: query
        schema:
          type: boolean
          default: true
        description: '**Entitlements shared with this guest by somebody else** (`shareEntitlement`). Shown
          by default and marked as shared — **a guest who cannot see a pass shared with them will ask
          for it again.**

          '
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entitlement'
  /entitlements/{entitlementId}:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getEntitlement
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P02 GST-012 My Tickets"
        - "P02 GST-013 Ticket Details"
      summary: One entitlement, with what remains on it
      description: '**Entries used against entries allowed, and the validity after any freeze.** A guest
        looking at a ten-entry pass wants the number left, and until `access.entitlement` existed nothing
        counted.

        **A guest may read their own and one shared with them, and nothing else.** The share is one-way:
        the recipient sees the entitlement and not the owner''s other entitlements.

        '
      tags:
      - access
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The entitlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '404':
          description: '**Not found and not permitted return the same response.** A distinct *"exists
            but not yours"* tells anybody with an id whether it is real.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /entitlements/{entitlementId}/credential:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getEntitlementCredential
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P02 GST-012 My Tickets"
        - "P02 GST-013 Ticket Details"
      summary: The thing that gets scanned
      description: 'The QR payload, wallet pass reference or wristband serial. **Separated from `getEntitlement`
        because it is the sensitive half** — a list of a guest''s tickets is a convenience, and the credential
        admits somebody.

        **Rotates without reissuing.** A guest whose phone was stolen gets a new payload against the same
        entitlement, and the old one stops scanning.

        '
      tags:
      - access
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: rotate
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaCode:
                    type: string
                  payload:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
  /entitlements/{entitlementId}/history:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getEntitlementHistory
      x-ticvai-consumed-by:
        - "P01 WEB-018 My Tickets"
        - "P02 GST-012 My Tickets"
        - "P02 GST-013 Ticket Details"
      summary: Every scan, freeze, share and reissue against it
      description: '**The screen a support agent opens when a guest says it did not work.** Scans with
        their outcome and deny reason, freezes with their dates, shares, reissues and the chain back through
        `supersedesEntitlementId`.

        **A guest sees their own history too**, because *"it says I already used it"* is answered by showing
        them when.

        '
      tags:
      - access
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: History, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at:
                      type: string
                      format: date-time
                    kind:
                      type: string
                      enum:
                      - issued
                      - scanned
                      - denied
                      - frozen
                      - unfrozen
                      - shared
                      - unshared
                      - reissued
                      - transferred
                      - suspended
                      - reinstated
                    accessPointName:
                      type: string
                      nullable: true
                    denyReason:
                      type: string
                      nullable: true
                    byPrincipalName:
                      type: string
                      nullable: true
  /face-pass/enrolments:
    post:
      operationId: enrolFacePass
      x-ticvai-consumed-by:
        - "P02 GST-069 Face Pass"
      x-ticvai-audience:
      - staff
      - guest
      summary: Register a facial profile against an entitlement
      description: '3.2.43. **Registrable only through the app, a ticket counter or the annual pass counter**
        — never at a gate, and never at a kiosk. The requirement names the three surfaces and the omission
        is the point: enrolment is a considered act with consent attached, not something done in a queue.

        **One facial profile may not be associated with more than one annual pass.** The refusal is explicit
        rather than a unique constraint, because the reason matters to the person at the counter — a duplicate
        means either a mistake or a pass being shared.

        **Consent is captured in the same transaction and is not implied by enrolment.** Under PDPL a
        biometric is a special category, and a consent record written afterwards is a consent record for
        something that already happened.

        **A minor''s consent is given by a guardian**, and the guardian is recorded. The child-protection
        journey (3.2.12) sits above this.

        No image is stored — a template is. **The template cannot reconstruct the face**, and that is
        the property that makes retention defensible at all (CF-35, CF-64).

        '
      tags:
      - access
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subjectId
              - entitlementId
              - template
              - capturedAt
              - consent
              - source
              properties:
                subjectId:
                  type: string
                  format: uuid
                entitlementId:
                  type: string
                  format: uuid
                template:
                  type: string
                  format: password
                  description: '**Write-only, never returned.** A template, not an image — the derived
                    vector a matcher compares against, from which no face can be reconstructed.

                    '
                capturedAt:
                  type: string
                  format: date-time
                source:
                  type: string
                  enum:
                  - guestApp
                  - ticketCounter
                  - annualPassCounter
                  description: '**The three surfaces 3.2.43 allows.** A gate and a kiosk are absent deliberately.

                    '
                consent:
                  type: object
                  required:
                  - purposeId
                  - givenAt
                  properties:
                    purposeId:
                      type: string
                      format: uuid
                    givenAt:
                      type: string
                      format: date-time
                    guardianSubjectId:
                      type: string
                      format: uuid
                      nullable: true
                      description: Required where the subject is a minor.
                    guardianRelationship:
                      type: string
                      nullable: true
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacePassEnrolment'
        '409':
          description: '**This face is already on another annual pass.** Returned with the reason and
            without naming the other pass — a counter agent needs to know it is a duplicate, not whose.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
        '422':
          description: Capture quality too low to enrol. Retake rather than store something that will
            not match.
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /face-pass/enrolments/{enrolmentId}:
    parameters:
    - name: enrolmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getFacePassEnrolment
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-069 Face Pass"
      x-ticvai-audience:
      - staff
      - guest
      summary: Whether a pass has a face registered, and when
      description: '**Returns metadata and never the template.** Whether one exists, when it was captured,
        which surface enrolled it, and the consent behind it.

        '
      tags:
      - access
      x-ticvai-permission: GUEST_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: Enrolment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacePassEnrolment'
    delete:
      operationId: revokeFacePass
      x-ticvai-consumed-by:
        - "P01 WEB-024 Devices, Wishlist & Consent"
        - "P02 GST-069 Face Pass"
      x-ticvai-audience:
      - staff
      - guest
      summary: Remove a facial profile
      description: 'Withdrawn by the guest, ended with the pass, or erased under a DSAR.

        **The template is destroyed, not flagged.** A biometric marked inactive is a biometric still held,
        and under PDPL that is the same as holding it — which is why this is a delete rather than a status
        change.

        **The entitlement survives.** A guest who withdraws their face still has their annual pass and
        enters another way (3.2.9 allows the check to be deactivated per ticket type).

        '
      tags:
      - access
      x-ticvai-permission: GUEST_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '204':
          description: Destroyed
  /parking-facilities:
    get:
      operationId: listParkingFacilities
      x-ticvai-consumed-by:
        - "P01 WEB-041 Parking – Reserve & Pay"
        - "P02 GST-027 Parking – Reserve & Pay"
        - "P02 GST-028 Parking – Reservation Confirmed"
        - "P08 BO-006 Parking Configuration"
      x-ticvai-audience:
      - staff
      - guest
      summary: Car parks at a venue, and how each integrates
      description: '3.2.30 and CF-52, settled 14 August. **Three integration modes**, and the mode decides
        what the platform must do at sale.

        '
      tags:
      - access
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      x-ticvai-permission: ACCESS_POINT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: replica
      responses:
        '200':
          description: Facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingFacility'
    put:
      operationId: setParkingFacility
      x-ticvai-consumed-by:
        - "P08 BO-006 Parking Configuration"
      x-ticvai-audience:
      - staff
      summary: Configure a car park and its integration
      description: '**The mode is the decision, and the three are not variations of one thing.**

        `none` — TICVAI issues its own QR and security verifies it by eye. No integration, and the guest
        experience depends on a person.

        `plateWhitelist` — the guest gives a plate at checkout and the platform pushes it to the parking
        system''s whitelist. **The barrier opens without anything being presented**, which is the best
        experience and the only mode that needs a plate captured at sale.

        `qrHandoff` — TICVAI sends a code the barrier validates. No plate needed, and it fails the way
        any code fails: a dead phone at a barrier with a queue behind it.

        A fourth case is out of scope: pay-per-hour parking unrelated to a ticket runs on the parking
        system''s own POS (14 August).

        '
      tags:
      - access
      x-ticvai-permission: PARKING_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingFacility'
      responses:
        '200':
          description: Configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingFacility'
  /parking-entitlements:
    post:
      operationId: createParkingEntitlement
      x-ticvai-consumed-by:
        - "P01 WEB-041 Parking – Reserve & Pay"
        - "P02 GST-027 Parking – Reserve & Pay"
        - "P02 GST-028 Parking – Reservation Confirmed"
      x-ticvai-audience:
      - service
      - guest
      x-ticvai-audience-note: '24 August: widened to include guest. **A guest reserves their own parking.**
        Declared `s ervice` only, on two guest screens — `updateParkingEntitlement` was already `guest`,
        whi ch made the asymmetry an omission rather than a design.

        '
      summary: A guest bought parking
      description: '**Pushes the plate to the parking system where the mode is `plateWhitelist`**, and
        that push is the operation that was missing — CF-52 settled the direction on 14 August and nothing
        implemented it.

        Where the push fails the entitlement is still valid. **The guest paid**, and a barrier that will
        not open is a staffed problem rather than a refund.

        '
      tags:
      - access
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkingEntitlement'
      responses:
        '201':
          description: Created, and pushed where the mode requires it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingEntitlement'
        '502':
          description: '**The parking system rejected the push. The entitlement is still created** and
