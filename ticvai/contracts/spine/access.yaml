        - "P07 SCN-013 Offline journal"
        - "P07 SCN-014 Sync & reconciliation"
        - "P07 SCN-015 Offline package"
        - "P08 BO-034 Scan Activity"
        - "P08 BO-035 Override Audit"
        - "P08 BO-060 Attendance & Footfall"
      x-ticvai-audience:
      - staff
      summary: Admit a group on one read
      description: 'A school party or tour group entering on a single credential. Partial admission is
        normal — thirty booked, twenty-eight arrived — and the remainder stays available.

        Each admission decrements the group''s counter, so a group cannot re-enter beyond its size by
        scanning repeatedly.

        '
      tags:
      - validation
      x-ticvai-permission: ACCESS_VALIDATE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - mediaCode
              - admitCount
              - recordedAt
              properties:
                id:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                mediaCode:
                  type: string
                  maxLength: 256
                admitCount:
                  type: integer
                  minimum: 1
                direction:
                  $ref: '#/components/schemas/Direction'
                recordedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Group admission outcome
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ValidationResult'
                - type: object
                  properties:
                    groupSize:
                      type: integer
                    totalAdmitted:
                      type: integer
                    remainingAdmissions:
                      type: integer
        '409':
          description: Requested count exceeds the remaining group allowance
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /access-points/{accessPointId}/geofence:
    parameters:
    - name: accessPointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setAccessPointGeofence
      x-ticvai-consumed-by:
        - "P08 BO-064 Zones & Areas"
      x-ticvai-audience:
      - staff
      summary: Set a geofence for handheld validation
      description: 'Constrains where a handheld may validate for this access point. A roaming scanner
        used two hundred metres from the gate it claims to be at is either an error or something worse.

        Enforcement is configurable — warn, or deny — because GPS accuracy indoors is not a thing to build
        a hard block on without thought.

        '
      tags:
      - accessPoint
      x-ticvai-permission: ACCESS_POINT_CONFIGURE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enforcement
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                radiusMetres:
                  type: integer
                  minimum: 5
                  maximum: 5000
                enforcement:
                  type: string
                  enum:
                  - false
                  - warn
                  - deny
                allowProximityBeacon:
                  type: boolean
                  description: Accept a BLE proximity assertion in place of GPS. Better indoors.
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPoint'
