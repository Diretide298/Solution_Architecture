    ChannelCapacity:
      x-ticvai-persistence: catalogue.channel_capacity
      type: object
      required:
      - id
      - performanceId
      - capacity
      - sold
      - leased
      - remaining
      - isSeated
      properties:
        id:
          type: string
          format: uuid
        performanceId:
          type: string
          format: uuid
        name:
          type: string
        seatCategoryId:
          type: string
          format: uuid
          nullable: true
        oversellAllowance:
          type: integer
          default: 0
          description: 'BL-046, 1.3.13. **The guard existed in one direction** — an envelope could be
            raised freely and refused reduction below what had sold.

            **Free events oversell deliberately because no-show rates are known.** An allowance on the
            envelope rather than an admission policy, because **the gate must still refuse when actual
            capacity is reached** — overselling is a sales decision and admission is a safety one, and
            they must not share a number.

            '
        oversellBasis:
          type: string
          nullable: true
          enum:
          - fixedCount
          - historicNoShowRate
          - percentage
        capacity:
          type: integer
          minimum: 0
        sold:
          type: integer
        leased:
          type: integer
        remaining:
          type: integer
        hasChannelAllocations:
          type: boolean
          description: 'True where capacity is divided across channels. Leases then draw from a channel
            allocation rather than from raw capacity.

            '
        isSeated:
          type: boolean
          description: 'Seated envelopes cannot be leased and are blocked offline. A seat map is not a
            count.

            '
    CreateEnvelopeRequest:
      type: object
      required:
      - performanceId
      - name
      - capacity
      properties:
        performanceId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        seatCategoryId:
          type: string
          format: uuid
        capacity:
          type: integer
          minimum: 0
    ChannelAllocation:
      x-ticvai-persistence: catalogue.channel_allocation
      type: object
      required:
      - channel
      - allocatedUnits
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: '**Added 20 August.** The schema reference derives table columns from API response
            schemas, and a response is not a table — this one returned everything a caller needs and not
            the row''s own identity, so the table had no key and no row could be addressed, updated or
            deleted. Found by an audit of all 365 tables, not by a reader.

            '
        channel:
          $ref: '#/components/schemas/Channel'
        allocatedUnits:
          type: integer
          minimum: 0
        soldUnits:
          type: integer
          readOnly: true
        leasedUnits:
          type: integer
          readOnly: true
          description: Held by terminals on this channel but not yet sold.
        remainingUnits:
          type: integer
          readOnly: true
        releaseAt:
          type: string
          format: date-time
          nullable: true
          description: 'Unsold units return to the general pool at this time. How distribution holds are
            freed close to a performance without someone remembering to do it.

            '
    ChannelAllocationSet:
      x-ticvai-persistence: none — projection
      type: object
      required:
      - channelCapacityId
      - capacity
      - allocations
      - generalPoolUnits
      properties:
        channelCapacityId:
          type: string
          format: uuid
        capacity:
          type: integer
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/ChannelAllocation'
        generalPoolUnits:
          type: integer
          description: 'Unallocated remainder. Any channel may draw from it once its own allocation is
            exhausted.

            '
        totalSold:
          type: integer
        totalRemaining:
          type: integer
    BundleSummary:
