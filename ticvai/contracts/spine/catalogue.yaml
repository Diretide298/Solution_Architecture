        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    post:
      operationId: suspendEntitlement
      x-ticvai-audience:
      - staff
      summary: Suspend or reinstate an entitlement
      description: 'Fraud, a chargeback, a behavioural ban. Denies at the gate with a stated reason rather
        than a generic failure, so an operator facing the guest knows what to say.

        Suspension is reversible; it does not revoke.

        '
      tags:
      - entitlement
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - isSuspended
              - reason
              properties:
                isSuspended:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                denyMessage:
                  type: string
                  maxLength: 200
                  description: Shown to the operator at the gate.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlementId:
                    type: string
                  isSuspended:
                    type: boolean
                  propagatedToCells:
                    type: array
                    description: Cross-cell rights revoked alongside (ADR-0010).
                    items:
                      type: string
