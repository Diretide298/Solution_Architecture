      x-ticvai-consumed-by:
        - "P01 WEB-006 Date & Session Selection"
        - "P04 POS-003 Sell — Timed Entry"
        - "P05 KSK-005 Choose a session"
        - "P08 BO-018 Allocation & Holds"
      x-ticvai-audience:
      - staff
      - guest
      summary: Acquire an inventory lease
      description: 'Grants the caller N units of a capacity envelope for a TTL. The holder may sell against
        them without further server contact, including offline.

        Unsold units return automatically on expiry. Requesting more than remains returns a partial grant
        — the caller decides whether that is enough.

        A `venueEdge` workstation acquires through its edge node, which holds the venue lease and sub-leases
        to terminals.

        '
      tags:
      - lease
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-scope-level: workstation
      x-ticvai-lock: rowExclusiveSkipLocked
      x-ticvai-lock-excludes:
        - "cache:idempotency"
        - "platform.workstation"
      x-ticvai-lock-excludes-note: >
        ADR-0037. **Resolved before the transaction opens, never inside the lock.** A Postgres row l
        ock costs microseconds and this one measured six milliseconds — the difference was a Redis r
        ound trip and a read the decision does not use. **A lock held across a hop is a lock held fo
        r the latency of the slowest thing on the path.**
      x-ticvai-lock-note: 'ADR-0031. **Two callers want the same row and both cannot have it.** Optimistic
        retry under  contention is worse than a lock — at 5,000 RPS every retry is another read, and the
        retry st orm is the outage. **SKIP LOCKED turns contention into throughput**: a buyer who cannot
        get  seat 14 gets seat 15 in the same query rather than failing and retrying.

        '
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
