          application/json:
            schema:
              type: object
              required:
              - transition
              - reason
              properties:
                transition:
                  type: string
                  enum:
                  - submitForReview
                  - approve
                  - reject
                  - publish
                  - withdraw
                  - archive
                  - restore
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                effectiveAt:
                  type: string
                  format: date-time
