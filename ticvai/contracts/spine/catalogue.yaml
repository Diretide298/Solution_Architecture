      - contentHash
      - staleAfter
      - payload
      properties:
        version:
          type: string
        venueId:
          type: string
          format: uuid
        isDelta:
          type: boolean
        baseVersion:
          type: string
          nullable: true
          description: Present when `isDelta`. The version this delta applies to.
        signature:
          type: string
          description: 'Detached signature over `contentHash`. The terminal verifies before applying and
