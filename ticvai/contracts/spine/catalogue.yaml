      description: 'Draft → review → approved → live → withdrawn → archived.

        **Approval is separate from publication.** An approved product is not sellable until a bundle
        carries it, which is why the two are different acts with different permissions — a product manager
        approves, an operator publishes.

        Withdrawal stops new sales and leaves existing entitlements intact. Archiving is refused while
        entitlements remain unexpired.

        '
      tags:
      - product
