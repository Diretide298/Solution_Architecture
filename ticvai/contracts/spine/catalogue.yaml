openapi: 3.1.0
info:
  title: TICVAI Catalogue & Entitlement
  version: 0.1.0
  x-ticvai-screen-count: 161
  x-ticvai-tier: spine
  x-ticvai-module: 1 — Ticketing Catalogue
  x-ticvai-requirements: 312
  x-ticvai-capabilities:
  - C20
  - C79
  - C80
  - C81
  - C84
  - C85
  - C102
  - C103
  - C104
  x-ticvai-platforms:
  - P08 Venue Management
  - P04 POS
  - P01 Guest Web
  - P02 Guest App
  - P05 Guest Kiosk
  - P10 Partner Web
  description: "## What this contract covers\n**Defines what can be sold and what it grants.**\n| | |\
    \ |---|---| | **Tier** | spine | | **Matrix domain** | 1 — Ticketing Catalogue | | **Requirements**\
    \ | ~312 | | **Capabilities** | C20, C79, C80, C81, C84, C85, C102, C103, C104 | | **Consumed by**\
    \ | P08 Venue Management · P04 POS · P01 Guest Web · P02 Guest App · P05 Guest Kiosk · P10 Partner\
    \ Web |\n## How to read this file\n**This file is a contract.** It is hand-authored and it is the\
    \ source of truth for one bounded context: server code, client code and mock servers are generated\
    \ from it, never the other way round. If a field is not here, it does not exist.\n**Contracts are\
    \ split into two tiers.**\n- **Spine** — the eight contexts everything else depends on: tenancy, identity,\n\
    \  catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here\n  requires\
    \ a formal change request, because every satellite has pinned against it.\n- **Satellite** — a domain\
    \ that builds on the spine and can move independently.\n  Cheaper to change.\n\n**`paths` are operations.**\
    \ Each one declares four TICVAI extensions, and Redocly rejects any that does not:\n| Extension |\
    \ Answers | |---|---| | `x-ticvai-permission` | Which permission the caller needs. From one enum in\
    \ `shared/permissions.yaml` — never hand-typed | | `x-ticvai-scope-level` | Where in the seven-level\
    \ hierarchy that permission must be held | | `x-ticvai-offline-capable` | Whether a disconnected terminal\
    \ may queue this | | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`,\
    \ `manual` |\nWhere `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`\
    \ (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or `security:\
    \ []` (genuinely public).\n**`components.schemas` are API schemas — the shape of data on the wire.**\
    \ They are not database tables. One API schema may become three columns (`Money`) or five tables (`Order`);\
    \ some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70% of the DDL derives from\
    \ these, and the rest — partitioning, RLS, the PII split — is storage design that lives in the migration\
    \ scripts.\n**Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table\
    \ name, a list of tables, or `none` with a reason. It is documentation of the mapping, not a generator\
    \ input — the DDL lives in versioned SQL migrations, because partitioning, RLS policies, `ltree` indexes\
    \ and partial indexes have no expression in OpenAPI.\n**`security` arrays hold OAuth scopes.** Empty\
    \ means \"this scheme, no scopes\" — for bearer tokens there is nothing to list. Empty is not the\
    \ same as absent: absent means unauthenticated.\n\n## This context\nProducts, pricing, events, capacity\
    \ — and the two mechanisms local-first point of sale depends on: signed catalogue bundles and inventory\
    \ leases.\nPositions this encodes:\n- Point of sale reads the catalogue from a local bundle, always\
    \ (ADR-0013). The\n  endpoints here that a terminal calls are bundle pull and lease acquisition. It\
    \ does\n  NOT call product or price endpoints on the transaction path.\n- Contended inventory uses\
    \ leases, not replication. A terminal holds N units for a TTL\n  and refuses the sale on exhaustion\
    \ rather than overselling.\n- Seated inventory is blocked offline. A seat map is not a count. - Adding\
    \ an attribute value generates sellable variants. The variant table is\n  materialised, not computed\
    \ at read time.\n- Identity and entitlement are separate. Ticket ID and Media Code are different things.\n\
    DEFERRED from this version: product lifecycle and approval (C79), ticket resale marketplace (C80,\
    \ no MoM coverage), portfolio management (C81), alternative codes for third-party systems.\n"
servers:
- url: https://{cellHost}/api/v1
  variables:
    cellHost:
      default: cell.ticvai.local
security:
- bearerAuth: []
tags:
- name: product
- name: entitlement
- name: pricing
- name: event
- name: capacity
- name: bundle
- name: lease
- name: entitlement
paths:
  /product-categories:
    get:
      operationId: listProductCategories
      x-ticvai-consumed-by:
        - "P08 BO-115 Category, Brand & Merchandise Hierarchy"
      summary: The merchandise hierarchy — categories, brands, collections
      description: 'Retail Board 2. **`listSeatCategories` existed and a product category did not** —
        a seat category prices a seat; this groups a catalogue.

        **Returned as a tree, not a flat list with parent ids.** A merchandiser reading a hierarchy five
        levels deep should not have to reassemble it, and every caller that does will reassemble it differently.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
    put:
      operationId: setProductCategories
      x-ticvai-consumed-by:
        - "P08 BO-115 Category, Brand & Merchandise Hierarchy"
      summary: Define the hierarchy, in the order a guest sees it
      description: '**The whole tree in one call.** A hierarchy edited node by node is a hierarchy that
        spends time in states nobody intended — a category reparented before its new parent exists.

        **Refuses a cycle**, and refuses deleting a category that names products: **a category with a
        season behind it still names what was sold under it**, and removing it rewrites last year''s report.
        Deactivate instead.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - categories
              properties:
                categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductCategory'
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
  /products/import/{jobId}/commit:
    parameters:
    - name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: commitCatalogueImport
      summary: Apply a parsed catalogue import
      description: '1.4.2. The second phase. **An operator has seen the findings and accepted them** —
        two-phase exists so nobody commits 2,847 products sight-unseen.

        Refuses a job whose `outcome` is `nothingFound` or `unreadable`. **A commit that applies nothing
        and reports success is the defect CF-122 fixed in `seating`**, and it is not being rebuilt here.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueImportJob'
        '409':
          description: 'The job found nothing, or was already committed. **Partial application is reported
            rather than rolled back** — three thousand products half-created is a state somebody has to
            see to repair.

            '
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /guests/me/memberships:
    get:
      operationId: getMyMemberships
      x-ticvai-consumed-by:
        - "P01 WEB-022 Membership Plans"
        - "P01 WEB-023 Membership Management"
        - "P02 GST-015 Memberships"
      summary: A guest's own memberships, benefits and history
      description: '19.2.26 to 19.2.28. **`membership` is a `ProductKind`, so purchase and renewal already
        ride the order path — and nothing returned a guest their own membership.** No active list, no
        tier benefits, no prior terms.

        Three requirements and one operation, because they are one screen: **what I have, what it gets
        me, and what I used to have.**

        Includes lapsed terms. **A guest deciding whether to renew is comparing against what they had**,
        and a membership that vanishes on expiry makes that impossible.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: includeLapsed
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestMembership'
  /products/import:
    post:
      operationId: importProductCatalogue
      x-ticvai-consumed-by:
        - "P08 BO-117 Product Import, Governance & AI Configuration Assistant"
      summary: Parse a catalogue file into a preview
      description: '1.4.2 and 1.4.3. **`seating` has a two-phase import built for exactly this shape of
        problem and validated against real client files; `catalogue` had nothing**, so a venue with three
        thousand products creates them one at a time.

        Two-phase for the same reason it is in `seating`: **an operator should see "2,847 products, 14
        with no price, 3 duplicate codes" before anything is written.**

        Also the export half of 1.4.3 — the same file moves a catalogue between environments, which is
        how a staging venue gets real data without hand-entry.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - format
              - sourceRef
              properties:
                format:
                  type: string
                  enum:
                  - csv
                  - xlsx
                  - json
                sourceRef:
                  type: string
                mode:
                  type: string
                  enum:
                  - createOnly
                  - upsert
                  - replaceCategory
                  default: createOnly
                  description: '**`replaceCategory` is the dangerous one and is named so it can be refused.**
                    Replacing a category with live orders against it is not an import, it is a migration.

                    '
      responses:
        '202':
          description: Parsed to a preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueImportJob'
  /guest/memberships:
    get:
      operationId: listGuestMemberships
      x-ticvai-consumed-by:
        - "P01 WEB-022 Membership Plans"
        - "P01 WEB-023 Membership Management"
        - "P02 GST-015 Memberships"
      summary: A guest's memberships, benefits and history
      description: '19.2.26 to 19.2.28. **`membership` is a `ProductKind`, so purchase and renewal already
        ride the order path — and nothing returned a guest their own memberships.**

        Three requirements and one operation, because they are one screen: what I hold, what it entitles
        me to, and what I held before.

        **Tier benefits come from the product, not from a separate benefits table** (5.4.31). A benefit
        nobody can trace to the thing that grants it is a benefit nobody can honour at a gate.

        Lapsed terms are included — **a guest who let a pass expire is the guest most worth showing a
        renewal to**, and hiding the history hides the reason.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - name: includeLapsed
        in: query
        schema:
          type: boolean
          default: true
      - $ref: ../shared/common.yaml#/components/parameters/PageSize
      - $ref: ../shared/common.yaml#/components/parameters/PageCursor
      responses:
        '200':
          description: Memberships, current first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestMembership'
  /products/{productId}/versions:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listProductVersions
      x-ticvai-consumed-by:
        - "P09 ADM-131 Product Version Management"
      summary: What this product used to be
      description: '1.1.47, 1.4.9. **The fourth appearance of one mechanism** — product versioning at
        1.1, event templates at 1.3, version-restore at 1.4, and `white-label` already implements the
        whole pattern for tenant configuration.

        `ProductVariant` is never deleted because orders reference it, which is version discipline without
        a version record. **This is the record.**

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVersion'
  /products/{productId}/versions/{version}/restore:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: version
      in: path
      required: true
      schema:
        type: integer
    post:
      operationId: restoreProductVersion
      summary: Put a previous version back
      description: '1.4.10. **Restoring creates a new version rather than rewinding to an old one**, following
        `restoreConfigVersion`. A price that was wrong for three days stays visible in the history, because
        a finance query run next quarter has to reproduce what was charged.

        **Orders are untouched.** They reference the variant they were sold against and always will.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Restored as a new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{productId}/change-impact:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: assessProductChange
      summary: What a change would touch, before making it
      description: '1.4.4 and 1.4.16. **The package already knows how to do this and does it in four places**
        — `PerformanceCancellationResult`, `RecognitionRunResult`, `FxRevaluationResult` and `PeriodCloseResult`
        all carry a dry run with an impact count.

        Changing a product that has sold is the same shape of act: **somebody needs to know how many tickets
        are affected before they press the button, not after.**

        Answers both halves of 1.4 — the impact, and **whether the change propagates to what has already
        been sold.** A name correction should; a price change must not.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - change
              properties:
                change:
                  type: object
                  additionalProperties: true
                  description: The proposed patch, in the shape `updateProduct` accepts.
      responses:
        '200':
          description: Impact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductChangeImpact'
  /products/bulk-price:
    post:
      operationId: bulkChangePrices
      summary: Reprice a category or a whole catalogue
      description: '2.9.9. **`BulkUpdateSeatsRequest` is the only bulk operation in the package** and
        it takes a selection plus the attribute to set — a usable precedent, applied here.

        Repricing every adult admission before a season is routine and currently means one call per product.
        **Runs as a dry run first**, for the reason `assessProductChange` exists.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-permission-escalated: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - selection
              - adjustment
              properties:
                dryRun:
                  type: boolean
                  default: true
                selection:
                  type: object
                  description: '**A selection, not a list of ids.** A category, a product kind, a channel
                    or a price list — the same shape `BulkUpdateSeatsRequest` takes.

                    '
                  properties:
                    categoryId:
                      type: string
                      format: uuid
                      nullable: true
                    productKind:
                      type: string
                      nullable: true
                    priceListId:
                      type: string
                      format: uuid
                      nullable: true
                    channel:
                      $ref: ../shared/common.yaml#/components/schemas/SalesChannel
                adjustment:
                  type: object
                  required:
                  - mode
                  - value
                  properties:
                    mode:
                      type: string
                      enum:
                      - percentage
                      - absolute
                      - setTo
                    value:
                      type: number
                    roundTo:
                      type: number
                      nullable: true
                      description: '**A 7% rise gives 53.61 and nobody prices a ticket at 53.61.** Rounding
                        is part of the act, not a follow-up.

                        '
                effectiveFrom:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Impact, or the applied result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPriceResult'
  /entitlements/{entitlementId}/reinstate:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: reinstateEntitlement
      summary: Lift a suspension
      description: '1.1.100. **`suspendEntitlement` had no inverse**, so a membership suspended for a
        chargeback that was later resolved stayed suspended.

        `retail.suspendWallet` and `reinstateWallet` are the precedent for a pair in this package.

        **Validity is not extended.** A suspension is a sanction and the time lost is part of it — that
        is what distinguishes this from `freezeEntitlement` below.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  enum:
                  - disputeResolved
                  - chargebackReversed
                  - banLifted
                  - suspendedInError
                note:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Reinstated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /entitlements/{entitlementId}/freeze:
    parameters:
    - name: entitlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: freezeEntitlement
      summary: Pause a membership at the guest's request
      description: '2.14.13. **The opposite act to a suspension, and it needed its own operation.** `suspendEntitlement`
        is a sanction — its own description names fraud, a chargeback and a behavioural ban, and it denies
        at the gate with a reason an operator can read out.

        A guest pausing an annual pass for three months abroad has done nothing wrong. **Consumption stops
        and validity extends by the frozen days**, so they get the year they paid for.

        A frozen entitlement is refused at a gate with a different message from a suspended one, and the
        guest can unfreeze it themselves.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-guest-callable: true
      x-ticvai-audience:
      - staff
      - guest
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
                  nullable: true
                  description: 'Open-ended where absent. **A freeze with no end date needs a maximum**,
                    or a membership is paused indefinitely and the venue carries the liability.

                    '
                reason:
                  type: string
                  enum:
                  - travelling
                  - injury
                  - personal
                  - seasonal
                  - other
      responses:
        '200':
          description: Frozen, with the new validity window
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /products/{productId}/clone:
    parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: cloneProduct
      summary: Copy a product as a new draft
      description: '1.1.47 and 1.1.48. `copyPriceList` and `cloneSeatMap` are the precedents and **the
        product equivalent did not exist**, so a seasonal variant was built by hand each year.

        The clone starts as a draft with a new code. **Variants come with it; orders do not** — a clone
        has no history, which is the point of it being a clone rather than a version.

        '
      tags:
      - catalogue
      x-ticvai-permission: PRODUCT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - name
              properties:
                code:
                  type: string
                name:
                  type: string
                includeVariants:
                  type: boolean
                  default: true
                includePrices:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Cloned as a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /search:
    get:
      operationId: searchCatalogue
      x-ticvai-consumed-by:
        - "P01 WEB-002 Event & Attraction Listing"
        - "P01 WEB-003 Search Results"
        - "P02 GST-001 Home – Default"
        - "P02 GST-003 Event & Attraction Listing"
        - "P02 GST-063 Search"
      x-ticvai-audience:
      - guest
      summary: Find something by name
      description: '**The guest app browses by category and cannot search.** On a venue with two hundred
        products that is the difference between finding a thing and giving up.

