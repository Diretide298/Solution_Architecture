    LeaseStatus:
      type: string
      enum:
      - active
      - expired
      - released
      - forceReleased
    AcquireLeaseRequest:
      type: object
      required:
      - id
      - channelCapacityId
      - requestedUnits
      - ttlSeconds
      properties:
        channel:
          allOf:
          - $ref: '#/components/schemas/Channel'
          description: 'Which channel''s allocation to draw from. Defaults to the session''s channel.
            A lease is granted against a channel allocation, not against raw capacity.

            '
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: Client-generated ULID. Also the idempotency key.
        channelCapacityId:
          type: string
          format: uuid
        requestedUnits:
          type: integer
          minimum: 1
        ttlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: 'Short TTLs limit stranding when a terminal dies; long TTLs survive longer outages.
            The venue''s default balances the two.

            '
    InventoryHold:
      x-ticvai-persistence: catalogue.inventory_hold
      type: object
      required:
