components:
  schemas:
    DraftedRecord:
      type: object
      x-ticvai-provisional: true
      description: '**A provisional envelope, drafted 2026-09-04 from the workshop pack.** It carries what
        every one of these screens needs to address a row and nothing it has not earned. **There is
        deliberately no `x-ticvai-persistence`** - naming a table here would put a storage decision
        nobody made into the ER model and the DDL.'
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        updatedAt:
          type: string
          format: date-time
    ProductLifecycleState:
      type: string
      enum:
      - draft
      - inReview
      - approved
      - live
      - withdrawn
      - archived
    ProductCategory:
      type: object
      x-ticvai-persistence: catalogue.product_category
      description: 'Retail Board 2 of the client''s design set, 20 August. **`listSeatCategories` existed
        and a product category did not** — a seat category prices a seat, and a merchandise hierarchy
        groups a catalogue.

        **Brand sits here rather than as its own entity.** A venue with four brands and a hierarchy five
        levels deep can express that with a parent; a venue with one brand should not have to maintain
        a table containing one row.

        **`displayOrder` is not alphabetical and that is the point.** A retail category list runs in the
        order the merchandiser wants a guest to see it, and sorting by name puts *Accessories* above *Apparel*
        forever.

        '
      required:
      - id
      - name
      - kind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nameLocalised:
          type: object
          additionalProperties:
            type: string
        kind:
          type: string
          enum:
          - category
          - brand
          - collection
          - season
          - department
        parentId:
          type: string
          format: uuid
          nullable: true
          description: '**One tree, not four.** A brand under a department under a category is how a real
            merchandise hierarchy runs, and separate tables for each level cannot express a venue that
            nests them differently.

            '
        scopePath:
          type: string
        displayOrder:
          type: integer
          default: 100
        imageAssetId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
          default: true
          description: '**Deactivated rather than deleted.** A category with a season behind it still
            names the products sold under it, and removing it rewrites last year''s report.

            '
    CatalogueImportJob:
      type: object
      x-ticvai-persistence: catalogue.import_job
      description: '1.4.2. **Two-phase, following `seating.ImportJob`** — and carrying the same lesson:
        a job that parses zero products is not a parsed job.

        '
      required:
      - id
      - status
      - parsedCount
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - parsing
          - previewReady
          - committing
          - committed
          - failed
        outcome:
          type: string
          enum:
          - parsed
          - parsedWithFindings
          - nothingFound
          - unreadable
        parsedCount:
          type: integer
        createCount:
          type: integer
        updateCount:
          type: integer
        findings:
          type: array
          description: '**What an operator sees before committing** — missing prices, duplicate codes,
            unknown categories, codes that do not match the tenant''s schema.

            '
          items:
            type: object
            properties:
              row:
                type: integer
              severity:
                type: string
                enum:
                - error
                - warning
              message:
                type: string
        scopePath:
          type: string
          description: '**The partition key** (ADR-0005). Added 31 August: the operations that write this
            table declare a scope and the table carried no column for it — **49 tables were in that state**,
            so a row could be written at venue scope and then read by anything that could reach the table.


            **`scope_path` rather than a specific id** because it is prefix-comparable: `uae.dubai` contains
            `uae.dubai.marina`, and one index answers every level of the walk.


            **Operations write it at `venue` scope.**'
    GuestMembership:
      type: object
      description: '19.2.26 to 19.2.28. **A view, not a table** — assembled from the entitlement, the
        product that granted it and the order that bought it.

        '
      required:
      - entitlementId
      - productId
      - name
      - status
      properties:
        entitlementId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        tier:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - frozen
          - suspended
          - expired
          - cancelled
          description: '**Derived from the entitlement, not held here.** This schema is a view assembled
            from the entitlement, the product that granted it and the order that bought it — the lifecycle
            lives in `states/entitlement-status.yaml` and `frozen` is what `freezeEntitlement` sets.

            No state model of its own, deliberately: **two models over one lifecycle drift.**

            '
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        frozenDays:
          type: integer
          description: 'Days lost to a freeze and added back to `validTo`. **Shown because a guest who
            paused a pass will check the maths**, and a validity date that moved without explanation is
            a support call.

            '
        benefits:
          type: array
          description: '5.4.31. From the product''s entitlement template. **Traceable to what grants them**,
            so a gate can honour what the app promised.

            '
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              value:
                type: string
                nullable: true
        renewsOn:
          type: string
          format: date
          nullable: true
        previousTerms:
          type: array
          description: Prior terms, including lapsed ones.
          items:
            type: object
            properties:
              validFrom:
                type: string
                format: date
              validTo:
                type: string
                format: date
              endedBecause:
                type: string
                enum:
                - expired
                - renewed
                - cancelled
                - upgraded
    ProductVersion:
      type: object
      x-ticvai-persistence: catalogue.product_version
      description: '1.1.47, 1.4.9 to 1.4.11. **Follows `white-label.ConfigVersion`** — the same pattern
        for the same reason, and the fourth place this mechanism was asked for.

        '
      required:
      - version
      - publishedAt
      - publishedByPrincipalId
      properties:
        version:
          type: integer
        productId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        publishedByPrincipalId:
          type: string
          format: uuid
        note:
          type: string
          nullable: true
        isCurrent:
          type: boolean
        contentHash:
          type: string
          description: '**Lets a diff be cheap and a no-op change be recognised.** Republishing an unchanged
            product should not create a version.

            '
        restoredFromVersion:
          type: integer
          nullable: true
          description: 'Set where this version was created by a restore. **A restore is a new version,
            not a rewind** — a price that was wrong for three days stays visible, because a finance query
            run next quarter has to reproduce what was charged.

            '
    ProductChangeImpact:
      type: object
      description: '1.4.4 and 1.4.16. What a proposed change would touch. **Modelled on `PerformanceCancellationResult`**,
        which does this for a cancellation.

        '
      required:
      - entitlementsIssued
      - ordersAffected
      - propagates
      properties:
        entitlementsIssued:
          type: integer
          description: How many live entitlements came from this product.
        ordersAffected:
          type: integer
        futurePerformances:
          type: integer
        openCarts:
          type: integer
          description: '**A guest with this product in a cart while its price changes underneath them**
            is the case nobody thinks about until it happens.

            '
        propagates:
          type: boolean
          description: 'Whether the change reaches what has already been sold. **A name correction should;
            a price change must not**, and the difference is the whole reason this operation exists.

            '
        blockedBy:
          type: array
          description: Reasons the change would be refused outright.
          items:
            type: string
    BulkPriceResult:
      type: object
      description: 2.9.9. Dry run or applied — the shape is the same, `applied` says which.
      required:
      - applied
      - productsMatched
      properties:
        applied:
          type: boolean
        productsMatched:
          type: integer
        pricesChanged:
          type: integer
        skipped:
          type: array
          description: '**Products the selection matched and the adjustment could not touch** — a fixed-price
            bundle, a partner net rate, a product in an open period. Named rather than counted, because
            whoever ran this will be asked why the total is short.

            '
          items:
            type: object
            properties:
              productId:
