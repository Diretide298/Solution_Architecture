      - acquiredAt
      - expiresAt
      properties:
        id:
          type: string
        channelCapacityId:
          type: string
          format: uuid
        holderWorkstationId:
          type: string
          format: uuid
        parentLeaseId:
          type: string
          nullable: true
          description: Present when sub-leased from a venue edge node.
        requestedUnits:
          type: integer
        channel:
          allOf:
          - $ref: '#/components/schemas/Channel'
          description: Allocation this lease draws from.
        grantedUnits:
          type: integer
          description: 'May be less than requested — a partial grant is not an error. Constrained by the
            channel''s remaining allocation plus the general pool, never by raw capacity.

