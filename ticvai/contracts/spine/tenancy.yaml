      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: setDeviceAssignment
      x-ticvai-consumed-by:
        - "P09 ADM-582 POS, Kiosk & Terminal Assignment Manager\t52"
      summary: Who owns it, who holds it, and where it is
      description: '16.2.9, 16.2.10 and 16.2.11. **Ownership, custody and location are three facts and
        the package carried none of them.** A device bound to a workstation has a venue, which answers
        none of the three: the venue owns it, a named supervisor is carrying it, and it is currently at
        the north gate.

        **Custody is what makes a loss investigable.** A scanner that disappears is a scanner somebody
        last had, and a model that only knows its workstation cannot say who.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
