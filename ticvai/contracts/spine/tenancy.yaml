        shape follows public-api setApiClientStatus'
      summary: Release, deprecate or withdraw a firmware release
      description: '16.6.30. **The decision that the fleet may run an image.** `draft` → `released` →
        `deprecated` → `withdrawn`, and `draft` → `withdrawn` for an image that never shipped. Nothing
        goes back to `draft`, and `withdrawn` is terminal (409).


        **Withdrawing is not rolling back.** A withdrawn release cannot start a new rollout, and a running
        rollout of it is halted; devices already on it stay on it until `rollbackDeviceFirmware` or a
        newer release moves them. `reason` is required for `deprecated` and `withdrawn` and is written to
