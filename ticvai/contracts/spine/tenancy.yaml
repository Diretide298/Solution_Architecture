          type: integer
          nullable: true
        charging:
          type: boolean
          nullable: true
        signalStrength:
          type: integer
          nullable: true
        cpuPercent:
          type: number
          nullable: true
        memoryPercent:
          type: number
          nullable: true
        storageFreeMb:
          type: integer
          nullable: true
        consumables:
          type: object
          additionalProperties: true
          description: Paper, ribbon, wristband stock — whatever the device kind reports.
        uptimeSeconds:
          type: integer
          nullable: true
        scopePath:
          type: string
    DeviceFirmware:
      type: object
      x-ticvai-persistence: tenancy.device_firmware
      description: '16.6.30 and 16.6.32. **A release, and how much of the fleet is on it.** Written by
