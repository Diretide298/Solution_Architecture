        level: { $ref: '#/components/schemas/ScopeLevel' }
        parentId: { type: string, format: uuid, nullable: true }
        path:
          type: string
          description: Materialised ltree path, e.g. `t_ref.b_alpha.r_north.v_alpha1`.
          pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        isActive:
          type: boolean
          description: >
            False causes every permission query at or beneath this node to resolve to DENY.
        childCount: { type: integer, minimum: 0 }

    CreateScopeNodeRequest:
