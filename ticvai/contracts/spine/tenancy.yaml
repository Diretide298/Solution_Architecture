        - "P08 BO-065 Venue Configuration"
        - "P08 BO-1063 Venue-Specific Configuration"
        - "P08 BO-116 Merchandising & Product Presentation"
        - "P08 BO-136 F&B Global Settings & Controls"
        - "P08 BO-143 Retail Global Settings & Controls"
        - "P08 BO-600 Venue, Calendar & Operational Setup"
        - "P15 KIT-009 SLA, Priority & Service Rules"
      summary: Set support hours, quiet hours, segregated access and alerting
      description: >
        **The four things a venue answers and no other level can** (CF-100, CF-130, CF-134).

        Support hours were an open conflict for eleven days and were never a design question — the
        code is identical whether a desk runs 24/7 or nine to six, and **what was missing was
        somewhere to put the answer.**

        **PUT semantics** (pull audit R103, R175). The target is the venue in the path, and a
        venue has one settings row. The first save creates it and later saves replace it whole;
        the answer is `200` either way, because before the first save the venue already had
        settings — the defaults `getVenueSettings` returns. **An omitted property returns to its
        default or to null.** `id`, `venueId`, `currencyCode`, `currencyScale`,
        `segregatedAccess.entitlementGated` and `biometrics.acknowledgedByPrincipalId` are
        `readOnly` and ignored on input.

        **The configured limits** (audit R094) are set here as venue overrides. A null limit
        inherits the tenant default (`setVenueSettingsDefaults`); a value outside the field's
        `minimum` and `maximum` is refused `400` with `errors[]` naming the field.

        **Refused with `422`** (pull audit R078) where the body asks for something the venue
        cannot evidence: `biometrics.isEnabled` true without both `dpiaReference` and
        `consentNoticeAcknowledgedAt`, or `segregatedAccess.genderVerification: deviceAssisted`
        where no device in the venue reports the `genderClassification` capability.
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
