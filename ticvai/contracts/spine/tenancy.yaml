        deviceId:
          type: string
          format: uuid
          readOnly: true
          description: From the path of `setDeviceAssignment`.
        ownerOrgUnitId:
          type: string
          format: uuid
          nullable: true
          description: Who the device belongs to — the cost centre that replaces it when it breaks.
        custodianPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**Who is holding it right now.** The fact a loss investigation needs.'
        assignedWorkstationId:
          type: string
          format: uuid
          nullable: true
        locationScopePath:
          type: string
          nullable: true
        lastSeenLocation:
          type: string
          nullable: true
          readOnly: true
          description: Reported by the heartbeat; distinct from where it is supposed to be.
        assetTag:
          type: string
          nullable: true
        acquiredAt:
          type: string
          format: date
          nullable: true
          description: A calendar date in the region's time zone.
        warrantyExpiresAt:
          type: string
          format: date
          nullable: true
          description: A calendar date in the region's time zone.
        assignedAt:
          type: string
          format: date-time
          readOnly: true
        scopePath:
          type: string
          readOnly: true
    DeviceTelemetryPoint:
      type: object
      x-ticvai-persistence: tenancy.device_telemetry
      description: '16.4.21 and 16.4.22. **A series, because degradation is not visible in a
