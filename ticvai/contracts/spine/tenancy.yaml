          headers:
            X-Consistency-Token: { $ref: '../shared/common.yaml#/components/headers/ConsistencyToken' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '422':
          description: >
            **An enable the venue cannot evidence.** Biometrics switched on without a DPIA
            reference and a consent-notice acknowledgement, or device-assisted gender
            verification where no device in the venue reports `genderClassification`. `errors[]`
            names each missing field or the missing capability.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

