  /device-firmware/rollouts:
    post:
      operationId: startDeviceFirmwareRollout
      summary: Push an update to a fleet, in waves
      description: '16.6.31 and 16.6.33. **Staged, never all at once.** A firmware update that bricks a
        scanner has bricked one scanner if it went to a canary and the whole estate if it did not — and
        gate hardware failing simultaneously across a venue is an evacuation problem rather than an IT
        one.

        **A device is updated when it is not in use.** The rollout carries a window, because pushing
        firmware to a turnstile at the top of the hour is how a queue becomes an incident.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_MANAGE
      x-ticvai-audience:
