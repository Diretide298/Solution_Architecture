        - "P08 BO-142 Store Rules, Controls & Permissions"
        - "P08 BO-143 Retail Global Settings & Controls"
      summary: Operational settings for this venue
      description: >
        **What this returns, and what it does not.** `VenueSettings` holds the venue's trading
        currency, support hours, quiet hours, biometrics, segregated access and alerting — the
        things `setVenueSettings` writes. It carries **no module enablement and no retail setting**,
        so a section landing that wants *what is enabled here*, or a store settings screen, does not
        get it from this read (pull audit R279). **Since 28 September it does carry the configured
        limits** (audit R094), the F&B ones among them (`fnb.recallWindowMinutes`,
        `fnb.compEscalationAmount`, `fnb.foodSafetyLeadPrincipalId`). A limit the venue has not set
        is null and resolves to the tenant default, which `getVenueSettingsDefaults` returns. It is gated by
