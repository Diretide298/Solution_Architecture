      properties:
        level: { $ref: '#/components/schemas/ScopeLevel' }
        parentId:
          type: string
          format: uuid
          description: Required for every level except tenant, which the cell creates at provisioning.
        code:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
          description: Becomes the final ltree segment. Immutable once created.
        name: { type: string, maxLength: 200 }


    VenueSettings:
      type: object
      x-ticvai-persistence: "platform.venue_settings"
      description: >
        **Venue-level operational configuration that no other level can answer.**

        Region owns currency, tax regime and fiscal year (ADR-0011). Venue owns the things that
        vary between two venues in one region — **opening hours, support hours, and what the local
        law requires of the gate.**

        **And the configured limits** (decided 28 September, audit R094): every limit the contracts
        call *configured* is a field here, from `displayCurrencies` and `cartLeaseSeconds` down to
        the grouped `catalogue`, `inventory`, `seating`, `promotions`, `fnb`, `queue`, `reporting`,
        `marketing` and `identity` settings. **Each has a tenant-level default**: the tenant sets it
        once with `setVenueSettingsDefaults`, a venue overrides it within the field's bounds, and a
        null field here inherits it. Each field's `default` is the proposed tenant default, marked
        proposed, client to correct (audit R094); `docs/active/configured-limits-proposal.md` is the
        sheet the client corrects, and where the two differ this contract is what runs.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        venueId:
          type: string
          format: uuid
          readOnly: true
          description: From the path of `setVenueSettings`.
        calendarDayStartHour:
          type: integer
          minimum: 0
          maximum: 23
          nullable: true
          default: 6
          description: >
            **Where the venue's calendar day starts** (17 September minutes M17-03, added 30 September):
            the first hour row of every day and week calendar view (`calendarView` in
            `screens/_components.yaml`), so a venue open 06:00 to 02:00 sees its night on the day it
            belongs to. Display only: it moves no booking, slot or business date. Null inherits the tenant
            default (proposed 6, client to correct).
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
          nullable: true
          readOnly: true
          description: >
            **`readOnly` is the freeze.** `setVenueSettings` takes this whole schema as its
            request body, so without it any settings save could rewrite the currency of a venue
            that had already traded — which is the one thing ADR-0018's amendment forbids. It is
            set when the venue is provisioned, defaulted from the region, and changed only by an
            operation whose precondition is that the venue has not yet traded.

            **The venue's trading currency, defaulted from its region and frozen once the venue
            has traded** (ADR-0018, amended 20 September). Currency was a region-only fact,
            grouped with tax rates on the reasoning that *"a venue cannot choose its VAT"* --
            true of tax and over-applied to currency, because a free-zone unit, a duty-free shop
            and a cruise terminal genuinely trade in a currency their region does not.

            **This column exists because the freeze needs somewhere to live.** A venue that
            resolved purely from its region would silently follow a region currency change after
            it had already traded, and every dated artefact beneath it -- a price list is a
            `validFrom`/`validTo` range -- would render retrospectively wrong. Null means
            "resolve from the region", which is the answer for every venue that has not
            overridden.
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
          readOnly: true
          description: >
            **Scale travels with currency** (ADR-0008), and so does the freeze. OMR is three decimal places because Oman
            says so; overriding the currency without the scale gets rounding wrong. Set together
            or not at all.
        supportHours:
          type: object
          description: >
            CF-100. **A venue decides whether its support desk is 24/7 or bounded, and the platform
            does not.** This was recorded as an open question for eleven days and was never one —
            the code is identical either way, and what was missing was somewhere to put the answer.
          properties:
            mode: { type: string, enum: [alwaysOn, businessHours, custom, none] }
            timezone:
              type: string
              description: >
                IANA zone the `windows` are read in. Absent, they are read in the region's
                `timeZone`, like every other wall-clock time in this contract.
            windows:
              type: array
              items:
                type: object
                properties:
                  day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                  from: { type: string, description: Wall-clock time the desk opens. }
                  to: { type: string, description: Wall-clock time the desk closes. }
            outOfHoursMessage: { type: string, nullable: true }
        quietHours:
          type: object
          nullable: true
          description: >
            **When the platform does not send.** A wallet low-balance alert at 3am is a complaint,
            and journeys and message triggers both respect this.

            **Operational messages ignore it** — a queue-turn alert is why a guest is holding the
            phone.
          properties:
            from: { type: string, description: Wall-clock time sending stops, in the region's time zone. }
            to: { type: string, description: Wall-clock time sending resumes, in the region's time zone. }
        biometrics:
          type: object
          nullable: true
          description: >
            CF-35, BL-096, BL-105, BL-106. **The venue-level master switch, and the one place a
            person is asked whether the paperwork exists.** Biometric data is sensitive under
            PDPL (Federal Decree-Law 45/2021) — heightened protection, explicit consent, and an
            Article 21 assessment before the processing rather than after it.

            **Nothing below this switch operates while it is off.** `AdmissionRules` may carry a
            `biometricPolicy` per ticket type and those rules are inert until a venue enables
            biometrics here, which means a profile copied between venues cannot start capturing
            faces at the destination.

            **Venue level because that is where the assessment is filed.** Region owns tax and
            currency; the DPIA, the consent notice and the hardware are a venue's.
          properties:
            isEnabled:
              type: boolean
              default: false
              description: >
                **Off by default, and turning it on is refused without the two fields below.**
                `setVenueSettings` answers 422 rather than accepting an enable it cannot
                evidence — **a DPIA nobody can name is a DPIA nobody did**, and the point of the
                refusal is that the person switching this on is asked at the moment they switch
                it on rather than by an auditor a year later.
            dpiaReference:
              type: string
              nullable: true
              maxLength: 200
              description: >
                **The venue's own reference for its Article 21 assessment.** The platform does
                not hold the document and does not judge it; it records that one was named, by
                whom, and when — which is what an audit asks for and what the venue can produce.
            consentNoticeAcknowledgedAt:
              type: string
              format: date-time
              nullable: true
              description: >
                **When somebody confirmed the consent forms are in place at the point of
                capture.** A guest consenting in an app is a record; a guest consenting at a
                ticket counter is a notice somebody has to have printed and a question somebody
                has to have asked.
            acknowledgedByPrincipalId:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: >
                **Who confirmed it.** An acknowledgement with no name behind it cannot be
                followed up, and this is the field that makes the switch an act rather than a
                setting. Recorded by the server as the caller whose save carried the
                acknowledgement, so it cannot name somebody else.
            faceTagPurgeMinutesAfterClose:
              type: integer
              nullable: true
              default: 0
              description: >
                BL-106. **How long a same-visit Face Tag survives past the close of the
                operating day**, and zero is the default because that is what 3.2.44 describes.
                A non-zero value is an operational allowance for a late reconciliation, not a
                retention period — **`facePass` ignores this entirely** and is bounded by its
                entitlement.
        segregatedAccess:
          type: object
          nullable: true
          description: >
            CF-130. **Configured at venue level because it changes by region and the venue is where
            it is known** — a Ladies Night, a family session, a prayer-time closure.

            **The platform does not infer gender.** 3.2.45 asks for automatic gender recognition and
            3.2.46 for rule-based facial recognition validation, and neither is built. Two reasons,
            and the second is the one that decided it:

            **A Ladies Night ticket is already gendered at the point of sale**, so the gate checks
            the entitlement the platform issued rather than the face in front of it — deterministic,
            auditable, and already contracted through `admissionRules`.

            **And these events are staffed.** A steward at the entrance is making the judgment
            anyway, and a classifier that overrules a person who can see more than it can is a
            machine and a human disagreeing while a guest waits.

            **`genderVerification` is a switch, not an implementation.** Where a venue's access
            hardware offers the capability and the venue chooses to use it, this turns it on —
            following ADR-0015's standards-first driver model, where the device does what the
            device does. **Not everything needs to be built.**
          properties:
            isEnabled: { type: boolean, default: false }
            appliesToAccessPointIds:
              type: array
              items: { type: string, format: uuid }
            schedule:
              type: array
              items:
                type: object
                properties:
                  day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                  from: { type: string, description: Wall-clock time, in the region's time zone. }
                  to: { type: string, description: Wall-clock time, in the region's time zone. }
                  admits: { type: string, enum: [all, women, womenAndChildren, families, members] }
            entitlementGated:
              type: boolean
              default: true
              readOnly: true
              description: >
                **Always true, and stated rather than assumed.** The gate admits on the entitlement.
                Everything below is advisory on top of that, and nothing replaces it.
            genderVerification:
              type: string
              # 'off' is quoted: unquoted, YAML 1.1 reads it as boolean false (pull audit R150, R238).
              enum: ['off', staffAssisted, deviceAssisted]
              default: 'off'
              description: >
                `off` — the entitlement decides and a steward handles exceptions. **The default, and
                what is contracted.**

                `staffAssisted` — the steward's screen shows the ticket type so they can ask. No
                inference anywhere.

                `deviceAssisted` — **the venue's access hardware performs the check, not the
                platform.** Available only where the driver reports the capability, and the result
                is **advisory to the steward rather than decisive at the turnstile** (3.2.45 asks
                for rejection; this deviates deliberately).
            overrideRateAlertThreshold:
              type: number
              nullable: true
              description: >
                Where `deviceAssisted` is on. **An override rate near zero means the steward has
                stopped deciding**, and that is the number that says whether the human safeguard is
                working or decorative.
        alerting:
          type: object
          description: >
            CF-134. **On-platform notification, marked as read.** Six contracts detect their own
            trouble and none told a person.

            **The panel is the default and email or WhatsApp only where the matrix names them** —
            an operational alert that arrives by email is an alert nobody sees in time.
          properties:
            channel: { type: string, enum: [dashboardPanel, dashboardAndEmail, dashboardAndWhatsapp], default: dashboardPanel }
            acknowledgementRequired: { type: boolean, default: true }
            escalateAfterMinutes: { type: integer, nullable: true }

        # ---- Configured limits (decided 28 September, audit R094). Each is a venue setting with a
        # tenant-level default: null here inherits the tenant default (`getVenueSettingsDefaults`),
        # and each `default` below is the proposed tenant default, client to correct. The client
        # sheet is docs/active/configured-limits-proposal.md; where the two differ this contract runs.
        displayCurrencies:
          type: array
          nullable: true
          description: >
            **Which currencies this venue shows guests** (decided 28 September, audit R120 (a)).
            ISO 4217 codes, each one its region holds an `FxRate` for; the rate itself stays per
            region and is never set here. `finance.listFxRates` with `venueId` narrows the region's
            rates to these. Null or empty shows the trading currency only. A code the region has no
            rate for is refused `400`.
          items: { type: string, pattern: '^[A-Z]{3}$' }
        cartLeaseSeconds:
          type: integer
          nullable: true
          minimum: 30
          maximum: 3600
          default: 900
          description: >
            **How long a cart holds capacity** (decided 28 September, audit R169): 15 minutes,
            the default `catalogue.acquireInventoryHold` takes for `ttlSeconds`. Proposed, client to correct (audit R094).
        cartHoldExtensionMinutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 30
          default: 5
          description: How long one `orders.extendCart` extension adds. Proposed, client to correct (audit R094).
        cartMaxExtensions:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          default: 1
          description: How many extensions a cart may take before `extensionCapReached` (`Cart.maxExtensions`). Proposed, client to correct (audit R094).
        resaleCutoffHours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 168
          default: 24
          description: Hours before the performance after which a ticket can no longer be listed for resale (`orders.createResaleListing`). Proposed, client to correct (audit R094).
        exchangeCutoffHours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 720
          default: 24
          description: Hours before the original performance after which lines can no longer be exchanged (`orders.exchangeOrderLines`, `outsideExchangeWindow`). Proposed, client to correct (audit R094).
        rescheduleCutoffHours:
          type: integer
          nullable: true
          minimum: 0
          maximum: 720
          default: 24
          description: Hours before the original performance after which an order can no longer be rescheduled (`orders.rescheduleOrder`, `outsideRescheduleWindow`). Proposed, client to correct (audit R094).
        reservationMaxExtensions:
          type: integer
          nullable: true
          minimum: 0
          maximum: 5
          default: 1
          description: How many times `orders.extendReservation` may extend one reservation. Proposed, client to correct (audit R094).
        shiftVarianceThreshold:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          nullable: true
          description: >
            Over or short at shift close beyond which the shift waits in `pendingVariance` for
            `shift.acceptShiftVariance`. **Proposed tenant default AED 20.00, bounds 0 to 1,000 in
            the venue currency; client finance to correct (audit R094).**
        catalogue:
          type: object
          nullable: true
          properties:
            maxVariantsPerProduct:
              type: integer
              nullable: true
              minimum: 1
              maximum: 2000
              default: 200
              description: Variants one product may generate from its attributes (`setProductAttributes` refuses above it). Proposed, client to correct (audit R094).
            waitlistOfferHoldMinutes:
              type: integer
              nullable: true
              minimum: 1
              maximum: 1440
              default: 30
              description: How long a waitlist offer holds the released capacity for the guest it was offered to. Proposed, client to correct (audit R094).
            bulkPriceChangeEscalationPercent:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              default: 10
              description: A `bulkChangePrices` run changing any price by more than this percentage needs `PRICE_CONFIGURE` (audit R197). Proposed, client to correct (audit R094).
            bulkPriceChangeEscalationCount:
              type: integer
              nullable: true
              minimum: 1
              default: 50
              description: A `bulkChangePrices` run touching more prices than this needs `PRICE_CONFIGURE` (audit R197). Proposed, client to correct (audit R094).
        inventory:
          type: object
          nullable: true
          properties:
            overReceiptTolerancePercent:
              type: number
              nullable: true
              minimum: 0
              maximum: 25
              default: 5
              description: Percent above the outstanding ordered quantity a goods receipt line may record (`createGoodsReceipt`). Proposed, client to correct (audit R094).
            countVarianceTolerancePercent:
              type: number
              nullable: true
              minimum: 0
              maximum: 25
              default: 2
              description: Percent difference between counted and expected quantity before a count line is an exception (`getCountVariance`). Proposed, client to correct (audit R094).
            countVarianceApprovalAmount:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              nullable: true
              description: >
                Total variance value of a count above which posting it needs approval
                (`postStockCount`). **Proposed tenant default 1,000.00 in the venue currency, client
                finance to correct (audit R094).**
        seating:
          type: object
          nullable: true
          properties:
            seatHoldExtensionSeconds:
              type: integer
              nullable: true
              minimum: 60
              maximum: 1800
              default: 300
              description: What one `extendSeatHold` adds. No hold outlives 30 minutes in all (audit R169). Proposed, client to correct (audit R094).
            seatHoldMaxExtensions:
              type: integer
              nullable: true
              minimum: 0
              maximum: 5
              default: 2
              description: How many times a seat hold may be extended. Proposed, client to correct (audit R094). A resource hold on a venue map (`resources.extendResourceHold`) uses the same two bounds (decided 29 September, rev 3 REV3-15).
            maxSeatsPerGuestOrder:
              type: integer
              nullable: true
              minimum: 1
              maximum: 50
              default: 10
              description: >
                **Seats one guest may take in one booking on a guest channel** (Guest Web, Guest App),
                decided 29 September, rev 3 REV3-7. `seating.createSeatHold` counts the seats in the
                request plus the seats the same guest already holds on the same performance, and
                refuses above this with `422` `seat-limit-exceeded`, naming the limit. Default 10,
                bounds 1 to 50; a venue sets its own in Venue Management. Staff and POS sales keep
                10 per sale (audit R080 (c)) and do not read this field.
        promotions:
          type: object
          nullable: true
          properties:
            maxDiscountPercent:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              default: 30
              description: The largest discount one promotion may give (`createPromotion` refuses above it). Proposed, client to correct (audit R094).
            nearZeroLinePrice:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              nullable: true
              description: >
                Net line price below which a stacked combination is flagged near-zero in
                `analysePromotionConflicts` (audit R096 (5)); a warning, not a refusal. **Proposed
                tenant default AED 1.00, client to correct (audit R094).**
        fnb:
          type: object
          nullable: true
          properties:
            recallWindowMinutes:
              type: integer
              nullable: true
              minimum: 0
              maximum: 60
              default: 10
              description: Minutes after a bump during which `recallKitchenTicket` still recalls; after it the act is a refire. Proposed, client to correct (audit R094).
            compEscalationAmount:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              nullable: true
              description: >
                Line value above which `compItem` needs `ORDER_DISCOUNT` (audit R197). **Proposed
                tenant default AED 100.00, client to correct (audit R094).**
            foodSafetyLeadPrincipalId:
              type: string
              format: uuid
              nullable: true
              description: >
                **The venue's food-safety lead**, to whom `escalateCorrectiveAction` sends every
                escalation (decided 28 September, audit R096 (9)). A venue fact, so it has no tenant
                default; while it is null an escalation is refused `409 no-food-safety-lead`.
        queue:
          type: object
          nullable: true
          properties:
            crossQueueLimit:
              type: integer
              nullable: true
              minimum: 1
              maximum: 10
              default: 2
              description: Virtual queues one guest party may wait in at once (`joinQueue`, `crossQueueLimitReached`). Proposed, client to correct (audit R094).
        reporting:
          type: object
          nullable: true
          properties:
            inlineRunRowLimit:
              type: integer
              nullable: true
              minimum: 1000
              maximum: 100000
              default: 5000
              description: Estimated rows above which `runReport` answers `202` and runs in the background. Proposed, client to correct (audit R094).
            dashboardRefreshBudgetPerMinute:
              type: integer
              nullable: true
              minimum: 1
              default: 24
              description: Tile refreshes per minute, summed over a dashboard's tiles, that `createDashboard` allows. Proposed, client to correct (audit R094).
        marketing:
          type: object
          nullable: true
          properties:
            attributionWindowDays:
              type: integer
              nullable: true
              minimum: 1
              maximum: 30
              default: 7
              description: Days after a campaign touch within which a booking is attributed to it (`getCampaignPerformance`). Proposed, client to correct (audit R094).
        identity:
          type: object
          nullable: true
          properties:
            guestOtpMaxAttempts:
              type: integer
              nullable: true
              minimum: 3
              maximum: 10
              default: 5
              description: >
                Wrong entries allowed per guest one-time code before `verifyGuestOtp` invalidates it.
                A guest code is tenant-scoped, so the tenant default is the value used. Proposed, client to correct (audit R094).
            guestTwoStep:
              type: object
              nullable: true
              description: >
                **Guest two-step verification: a venue option, off unless the venue enables it in Venue
                Management** (decided 29 September, rev 3 GAP-B1, per venue, superseding the second part
                of audit R167, "no guest MFA"; an earlier draft of the same day put it on the tenant's
                `PasswordPolicy`, which no longer carries it). **The guest's enrolment stays tenant-wide**:
                one guest account across the tenant's venues, so a method enrolled once is used in every
                venue that has this on, and is never asked in a venue that has it off. Identity learns the
                venue from `venueId` on the guest sign-in (`verifyGuestOtp`, `guestPasswordLogin`,
                `guestSocialLogin`, `guestUaePassLogin`) and on `createMfaChallenge`: the venue the guest
                app or booking is in; with no venue given, an enrolled guest is asked when any venue of
                the tenant has it on. Guests may enrol `totp` with `emailOtp` as the fallback, as staff
                do (audit R126 (5)); it is never forced. Guests still never use enterprise SSO (R167, first
                part). A null inherits the tenant default set with `setVenueSettingsDefaults`.
              properties:
                enabled:
                  type: boolean
                  default: false
                  description: Off unless the venue enables it. While no venue of the tenant has it on,
                    guests cannot enrol (`enrolMfaMethod` answers 403 `guest-two-step-disabled`).
                stepUpActions:
                  type: array
                  uniqueItems: true
                  description: >
                    The guest actions in this venue that ask an enrolled guest for the factor again,
                    whatever the age of the session. The service performing the action passes this venue
                    to `createMfaChallenge`. Proposed, client to correct (rev 3 GAP-B1).
                  items:
                    type: string
                    enum:
                    - changeContactDetails
                    - changePassword
                    - managePaymentMethods
                    - transferTickets
                    - deleteAccount
                  default:
                  - changeContactDetails
                  - changePassword
                  - managePaymentMethods
                  - deleteAccount

    RegionSettings:
      x-ticvai-persistence: "platform.region_settings"
      type: object
      required: [countryCode, currencyCode, currencyScale, timeZone, fiscalYearStartMonth]
      properties:
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2. Determines the jurisdiction, and therefore the cell.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          description: >
            Decimal places for this region's currency. Varies by currency — some use 2, some
            use 3. Money columns are numeric(18,4) and carry the scale explicitly, because a
            fixed 2-place type silently truncates 3-place currencies.
        timeZone:
          type: string
          description: IANA zone, e.g. `Asia/Dubai`.
        dateFormat: { type: string, default: 'dd/MM/yyyy' }
        numberFormat: { type: string, default: '#,##0.00' }
        fiscalYearStartMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: Varies by country.
        allowedAiResidencies:
          type: array
          description: >
            **The region's compliance gate on AI providers** (decided 28 September, audit R203;
            ADR-0009). The `AiProvider.residency` values a tenant in this region may use; empty
            means no restriction. `ai.setAiProvider` refuses any other residency with
            `409 residency-refused`. A prompt carrying guest data that reaches a provider hosted
            elsewhere is a cross-border transfer, and this is where a region says which it allows.
          default: []
          items: { type: string }
        placement:
          $ref: '#/components/schemas/Placement'
        cellName:
          type: string
          readOnly: true
          description: >
            The cell serving this region. One cell per tenant per region (ADR-0014).

    Placement:
      x-ticvai-persistence: "none — embedded in region_settings"
      type: object
      description: >
        Read-only here. Set by the Control Plane at provisioning.

        Every region is its own logical cell. Placement determines the infrastructure
        backing it, which is how cost is controlled without varying the split rule:
        `shared` puts several regions' databases on one cluster; `dedicated` and `isolated`
        give a region its own. Regions in different countries MUST have placements in their
        respective jurisdictions.
      readOnly: true
      required: [mode]
      properties:
        mode:
          type: string
          enum: [shared, dedicated, isolated, clientHosted]
        cellName: { type: string }
        cloudRegion: { type: string }

    DeploymentProfile:
      type: string
      description: >
        How this workstation obtains catalogue and inventory (ADR-0013).

        - `terminalLocal` — own SQLite, leases direct from the cell. Small venues, 4G sites
        - `venueEdge` — own SQLite, distributed via the venue edge node which holds the
          venue lease and sub-leases to terminals. Mid and large venues, stadium gates
        - `thin` — no local catalogue, server reads. Non-transactional surfaces only
      enum: [terminalLocal, venueEdge, thin]

    CatalogueState:
      x-ticvai-persistence: "none — computed from workstation bundle_version"
      type: object
      description: >
        The workstation's local catalogue position. A terminal beyond `staleAfter` must
        refuse to trade rather than transact against stale prices.
      required: [appliedBundleVersion, appliedAt, staleAfter, isStale]
      properties:
        appliedBundleVersion: { type: string }
        appliedAt: { type: string, format: date-time }
        staleAfter:
          type: string
          format: date-time
          description: Beyond this the terminal refuses to trade.
        isStale: { type: boolean }
        pendingBundleVersion:
          type: string
          nullable: true
          description: Published but not yet applied.

    SaleBoardKind:
      type: string
      enum: [ticketing, fnb, retail, mixed]

    DeviceKind:
      type: string
      enum:
        - receiptPrinter
        - ticketPrinter
        - labelPrinter
        - cashDrawer
        - barcodeScanner
        - rfidReader
        - nfcReader
        - cardReader
        - idReader
        - biometricReader
        - accessReader
        - paymentTerminal
        - customerDisplay
        - signageDisplay
        - kitchenDisplay
        - turnstileController
        - wristbandEncoder
        - signaturePad
        - scale
        - camera
        - mobileHandset
      description: >
        `mobileHandset` (18.1.5, added 29 September): a staff phone or tablet running the staff app,
        registered for push and bound to no workstation.

    DeviceBinding:
      x-ticvai-persistence: "platform.device"
      type: object
      required: [kind, driver]
      properties:
        kind: { $ref: '#/components/schemas/DeviceKind' }
        driver:
          type: string
          description: >
            Driver identifier. Adding a vendor is a driver plus configuration, never a core
            change — every venue arrives with hardware not previously seen.
        identifier: { type: string, description: Serial, port or network address. }
        isRequired:
          type: boolean
          default: false
          description: >
            When true, the workstation refuses to open a shift if the device is absent.

    Workstation:
      x-ticvai-persistence: "platform.workstation"
      type: object
      required: [id, code, name, venueId, regionId, scopePath, saleBoard, currency, currencyScale, timeZone]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        scopePath: { type: string }
        saleBoard:
          type: object
          description: >
            Determines which front end loads. Bound to the workstation, not the role — the
            F&B terminal opens the F&B board. What the operator may then DO within it is
            governed by their permissions.
          required: [id, kind]
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: '#/components/schemas/SaleBoardKind' }
            name: { type: string }
        accessPointId:
          type: string
          format: uuid
          nullable: true
          description: >
            Inherited from the workstation, never selected by the operator. Null where the
            workstation is not at an access point.
        devices:
          type: array
          items: { $ref: '#/components/schemas/DeviceBinding' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          x-ticvai-persisted: false
          description: >
            **Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped and not overri
            dable below, so a row in a UAE region is AED and cannot be anything else. **Kept on the wire
            , removed from the table** — a client should not walk a hierarchy to read a figure, and the 
            database should not hold nine million copies of AED. Four tables genuinely differ from their
             region and keep a stored currency: `orders.payment.tender_currency`, `inventory.supplier`, 
            `ledger.account`, `control.partner_agreement`.
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          x-ticvai-persisted: false
          description: >
            **Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped and not overri
            dable below, so a row in a UAE region is AED and cannot be anything else — storing it per ro
            w is a copy of a fact that cannot differ. **Kept on the wire, removed from the table**: a cl
            ient reading a figure should not walk a hierarchy to know what it means, and the database sh
            ould not hold nine million copies of AED. Four tables genuinely differ from their region and
             keep a stored currency — `orders.payment.tender_currency`, `inventory.supplier`, `ledger.ac
            count`, `control.partner_agreement`. **A guest paying USD at an AED venue is a real row; a w
            orkstation with its own currency is a misconfiguration.**
        timeZone: { type: string }
        deploymentProfile:
          $ref: '#/components/schemas/DeploymentProfile'
        edgeNodeId:
          type: string
          format: uuid
          nullable: true
          description: Present when `deploymentProfile` is `venueEdge`.
        healthScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          readOnly: true
          description: >
            Board 1 of the client's POS set. **A number a manager can sort by** — the package held
            `lastHeartbeatAt` and a heartbeat timestamp is not a score.

            The client's board shows 1,248 workstations at 96% healthy, and **the value of that
            figure is that it ranks**: a fleet dashboard exists so somebody can open the worst one
            first.

            **Derived from its devices, its heartbeat age, its firmware currency and its error
            rate.** Read-only, because a workstation that could set its own score would.

            **The formula, proposed, client to correct (audit R096 (2)):** score = 40% device online
            share (the share of its devices reporting online) + 25% heartbeat freshness (100 at one
            minute old or less, 0 at 15 minutes or more, linear between) + 20% firmware and profile
            currency (100 on the latest, 50 one version behind, 0 older) + 15% error rate (100 at 0
            errors an hour, 0 at 10 or more, linear between), rounded to a whole number. **Below 80
            is a warning and below 60 a failure.**
        configurationProfileId:
          type: string
          format: uuid
          nullable: true
          description: >
            Which profile this workstation runs, and at which version. **The client's board shows a
            fleet split four ways — 72% latest, 18.8% one behind, 6.1% outdated** — and the package
            had a firmware version field and no profile.

            **A profile is what a venue changes; a version is what it deploys.** Conflating them
            means a venue cannot say *roll the ticketing counters back and leave the kiosks*.
        catalogueState:
          $ref: '#/components/schemas/CatalogueState'
        offlineCapable:
          type: boolean
          description: >
            Derived from `deploymentProfile`. False only for `thin`. Under local-first,
            catalogue READS are always local on transactional surfaces; this flag governs
            whether WRITES can be queued.
        isActive: { type: boolean }

    ConfigureWorkstationRequest:
      type: object
      required: [name, saleBoardId]
      properties:
        cashierInputMode:
          type: string
          enum: [keyboard, touch, scanner, hybrid]
          default: hybrid
          description: >
            BL-061. **A till operator who touch-types is slower on a touchscreen and a new starter is
            faster.** The mode is per workstation because the operator is.
        guestDisplayContent:
          type: array
          description: >
            **What the guest-facing screen shows while a sale is in progress.** Line items always;
            the rest is the venue's choice — and **a second screen showing nothing is a second screen
            the guest ignores when it does show something that matters.**
          items: { type: string, enum: [lineItems, total, loyaltyBalance, promotions, branding, upsell, queuePosition] }
        loadedMediaStockId:
          type: string
          format: uuid
          nullable: true
          description: >
            BL-095. **Neither which stock a printer is loaded with nor how much is left.** A till that
            runs out of wristbands mid-queue is an outage nobody predicted, and the stock is inventory
            like anything else — this names which.
        mediaStockRemaining:
          type: integer
          nullable: true
          readOnly: true
          description: >
            Decremented on issue. **The number that turns a surprise into a reorder**, and it is
            read-only because the count comes from what was printed rather than from somebody's
            estimate.
        name: { type: string, maxLength: 200 }
        saleBoardId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        accessPointId: { type: string, format: uuid, nullable: true }
        devices:
          type: array
          items: { $ref: '#/components/schemas/DeviceBinding' }
        deploymentProfile:
          $ref: '#/components/schemas/DeploymentProfile'
        edgeNodeId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean, default: true }

  securitySchemes:
    guestAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Guest session token (common.yaml guestAuth). Scoped to the guest's own resources.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cell-to-cell workload token over mTLS (common.yaml serviceAuth).
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Partner, developer and device key (common.yaml apiKeyAuth).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
