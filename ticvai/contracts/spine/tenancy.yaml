    OutletKind:
      type: string
      enum: [shop, restaurant, bar, cafe, kiosk, gameFloor, ticketOffice, mobile]

    ConfigurationProfile:
      type: object
      x-ticvai-persistence: "platform.configuration_profile"
      description: >
        Board 1 of the client's POS design set, 20 August. **The board shows 1,248 workstations
        across four versions and the package modelled none of it** — a firmware version field on the
        workstation, and nothing that says what a workstation is configured to be.

        **A profile is what a venue changes; a version is what it deploys.** Conflating them means a
        venue cannot say *roll the ticketing counters back and leave the kiosks alone*, which is the
        only reason to version a profile at all.
      required: [id, name, venueKindScope, version, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopePath: { type: string }
        venueKindScope:
          type: array
          description: >
            Which workstation types it applies to. **A ticketing counter and a kitchen display do
            not share a profile**, and a profile that claims to is a profile somebody deploys to the
            wrong fleet.
          items: { type: string }
        version:
          type: integer
          readOnly: true
          description: >
            **Immutable once deployed anywhere.** A change makes a new version, and the old one
            stays readable — a workstation still running v2.3 must be able to say what v2.3 was.
            Assigned by the server: 1 on create, and one more each time a change lands on a
            published version (see `setConfigurationProfile`).
        settings:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, published, deploying, deployed, superseded, rolledBack]
          description: >
            On input only `draft` or `published`; sending `published` publishes this version. The
            other four are set by deployment and refused on input.
        deployedCount: { type: integer, readOnly: true }
        publishedAt: { type: string, format: date-time, nullable: true, readOnly: true }

    ProfileDeployment:
      type: object
      x-ticvai-persistence: "platform.profile_deployment"
      description: >
        **A deployment is an event with a date, a target and an outcome** — the client's board shows
        recent deployments with all three and the package had no record of any.

        **Staged rather than all-at-once by default.** Pushing a profile to 1,248 workstations
        simultaneously is how a venue discovers a bad profile at every till at the same moment.
      required: [id, profileId, version, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        profileId:
          type: string
          format: uuid
          readOnly: true
          description: Taken from the path of `deployConfigurationProfile`.
        version:
          type: integer
          description: The published version to deploy.
        targetWorkstationIds: { type: array, items: { type: string, format: uuid } }
        targetFilter:
          type: object
          nullable: true
          description: >
            By department, type or venue, where the target is a set rather than a list.
          properties:
            venueIds: { type: array, items: { type: string, format: uuid } }
            departmentIds: { type: array, items: { type: string, format: uuid } }
            workstationTypes:
              type: array
              description: The same workstation-type values `ConfigurationProfile.venueKindScope` holds.
              items: { type: string }
        strategy: { type: string, enum: [immediate, staged, onNextIdle], default: onNextIdle }
        status: { type: string, enum: [queued, inProgress, completed, partiallyFailed, rolledBack], readOnly: true }
        succeededCount: { type: integer, readOnly: true }
        failedCount: { type: integer, readOnly: true }
        failureReasons:
          type: object
          readOnly: true
          additionalProperties: { type: integer }
          description: >
            **Grouped, because 40 workstations failing for one reason is one problem** and a list of
            40 rows is forty.
        startedAt: { type: string, format: date-time, readOnly: true }
        completedAt: { type: string, format: date-time, nullable: true, readOnly: true }

    OfflinePolicy:
      type: object
      x-ticvai-persistence: "platform.offline_policy"
      description: >
        Board 5 of the client's POS set. **ADR-0013 makes the POS local-first and nothing configured
        the policy** — one of only two things in 36 board screens the package genuinely could not do.

        CF-115 reframed offline into three data classes: catalogue and policy always local, contended
        inventory leased, transactional facts journalled. **This is where a venue says how far that
        goes for them.**

        **One per scope node, keyed on `scopePath`** (pull audit R162). `id` is server-owned and
        absent where `getOfflinePolicy` returns the defaults for a node with nothing saved.

        **The `minimum` and `maximum` on each field are proposed, client to correct (decided 28
        September, audit R129).** A value outside them is refused `400`, `errors[]` naming the field.
      required: [scopePath]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        scopePath:
          type: string
          pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
          description: >
            **The node this policy is for, and the key `setOfflinePolicy` upserts on.** The body
            names its target here, because the path does not.
        maxOfflineHours:
          type: integer
          default: 24
          minimum: 1
          maximum: 72
          description: >
            **After which the workstation refuses to sell rather than keep journalling.** A till
            three days offline holding 900 unsynced sales is a reconciliation nobody can do and a
            fraud nobody can detect. Bounds 1 to 72 hours: proposed, client to correct (audit R129).
        allowedOffline:
          type: array
          description: >
            **What may happen with no network**, by data class. Selling from a cached catalogue is
            safe; issuing a refund is not, because the original sale cannot be verified.
          items:
            type: string
            enum: [sale, refund, exchange, entitlementIssue, entitlementValidate, loyaltyAccrual,
                   loyaltyRedemption, walletSpend, priceOverride, discount, voidLine, noSale]
        offlineValueCeiling:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Above zero, and in the currency of the venue the policy resolves to; a ceiling in another
            currency is refused `400` (decided 28 September, audit R129).
        offlineTransactionCeiling:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5000
          description: >
            **A ceiling on count as well as value.** Nine hundred small sales and one large one are
            different risks, and a value ceiling alone catches only the second. Bounds 1 to 5,000:
            proposed, client to correct (audit R129).
        onCeilingBreach: { type: string, enum: [warn, blockNewSales, blockAll], default: blockNewSales }
        requiresManagerToExtend: { type: boolean, default: true }

    ConnectivityPolicy:
      type: object
      x-ticvai-persistence: "platform.connectivity_policy"
      description: >
        Board 5 of the client's POS set, and the second of the two genuine gaps. **Nothing in the
        package held a threshold**, so a device that flips offline on one dropped packet and one that
        waits five minutes were the same product.

        **Going offline and coming back need different thresholds.** Symmetric ones produce a
        workstation that flaps — offline, online, offline — across a marginal connection, and each
        flap is a sync.

        **One per scope node, keyed on `scopePath`.** `id` is server-owned and absent where
        `getConnectivityPolicy` returns the defaults for a node with nothing saved.

        **The `minimum` and `maximum` on each field are proposed, client to correct (decided 28
        September, audit R129).** A value outside them, or a broken cross-field rule, is refused
        `400` with `errors[]` naming the field.
      required: [scopePath]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        scopePath:
          type: string
          pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
          description: >
            **The node these thresholds are for, and the key `setConnectivityThresholds` upserts
            on.** The body names its target here, because the path does not.
        failuresBeforeOffline:
          type: integer
          default: 3
          minimum: 1
          maximum: 10
          description: >
            **Consecutive, not cumulative.** One dropped request on a busy till is normal; three in a
            row is a network.
        probeIntervalSeconds: { type: integer, default: 15, minimum: 5, maximum: 300 }
        probeTimeoutMs:
          type: integer
          default: 2000
          minimum: 500
          maximum: 30000
          description: Shorter than `probeIntervalSeconds`, or the body is refused `400` (audit R129).
        successesBeforeOnline:
          type: integer
          default: 5
          minimum: 1
          maximum: 20
          description: >
            **Higher than the offline threshold, deliberately.** Coming back is where the cost is —
            a workstation that returns online and immediately fails has resynced for nothing.
            **Never below `failuresBeforeOffline`**, or the body is refused `400` (audit R129).
        minimumStableSeconds:
          type: integer
          default: 30
          minimum: 10
          maximum: 600
          description: >
            How long the connection must hold before the workstation trusts it. **This is what stops
            the flapping**, and it is the field a venue with poor wifi will actually tune.
        autoSwitch: { type: boolean, default: true }


    Outlet:
      type: object
      x-ticvai-persistence: "platform.outlet"
      required: [id, code, name, venueId, kind]
