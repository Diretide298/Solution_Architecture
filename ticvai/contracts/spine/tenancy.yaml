    RegisteredDevice:
      x-ticvai-persistence: "platform.device"
      type: object
      description: >
        **The device register of record** (decided 29 September, build pass). Identity, enrolment,
        credential, firmware and push registration for every device in the estate live on this row.
        `access.access_device` places access-control devices in the gate topology and repeats
        serial, versions, health and lifecycle; the two are not merged yet, and where they disagree
        this row wins.
      required: [id, kind, driver]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        driver:
          type: string
          description: >
            Built to an open standard where one exists — ESC/POS, UnifiedPOS, OSDP. Adding a
            vendor is a driver plus configuration, not a core change (ADR-0015).
        identifier: { type: string, nullable: true }
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: >
            Required for every kind except `mobileHandset`, which is bound to no workstation
            (18.1.5, 29 September); `registerDevice` refuses either mistake with `422`.
        model: { type: string, nullable: true }
        pushToken:
          type: string
          format: password
          nullable: true
          writeOnly: true
          description: >
            BL-163. **Guest devices register for push and staff devices did not** —
            `registerGuestDevice` exists with a token, platform and failure count, and a scanner
            that cannot be told anything is a scanner somebody has to walk to.

            Write-only, and marked `writeOnly`: accepted by `registerDevice` and never returned by
            `listDevices` or `getDevice`. **A push token is a credential**, and the rule that no
            surface holds a provider key applies here too.
        pushPlatform:
          type: string
          nullable: true
          enum: [ios, android, web, windows]
        pushFailureCount:
          type: integer
          default: 0
          readOnly: true
          description: >
            **Consecutive failures.** A token that has failed repeatedly is a device that was wiped
            or reassigned, and continuing to push to it is how a notification queue fills with
            nothing.
        offlineScope:
          type: string
          nullable: true
          enum: [none, readOnly, sellAndScan, fullVenue]
          description: >
            BL-163. **What this device may do with no connection**, which was unstated for the staff
            app while `venue-pos` and `venue-scanner` had it settled.

            **`fullVenue` on a personal handset is a decision, not a default** — a device that can
            do everything offline is a device that carries the whole venue's data in somebody's
            pocket.
        firmwareVersion:
          type: string
          nullable: true
          readOnly: true
          description: As the device last reported it on its heartbeat.
        isRequired:
          type: boolean
          description: True blocks shift open when the device is unreachable.
        status:
          type: string
          readOnly: true
          enum: [online, offline, error, consumableLow, needsAttention, unknown]
          description: What the device last said on its heartbeat; `unknown` until it has.
        batteryPercent:
          type: integer
          nullable: true
          readOnly: true
          minimum: 0
          maximum: 100
          description: >
            Board 1 of the client's POS design set, 20 August. **A wristband encoder at 8% is a
            gate that stops working in an hour**, and nothing in the package carried it.

            **Null where the device has no battery**, which is most of them — a receipt printer
            reporting 100% forever is worse than one reporting nothing.
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            **Distinct from `lastHeartbeatAt`.** A heartbeat is the workstation saying the device
            is attached; a check is the device answering. **A printer with no paper heartbeats
            perfectly**, which is why the client's board shows both columns.
        health:
          type: string
          enum: [healthy, warning, degraded, offline, unknown]
          default: unknown
          readOnly: true
          description: >
            **Derived, not reported.** Computed from heartbeat age, battery, firmware currency and
            error rate — a device does not know whether it is healthy, and asking it produces a
            fleet that is 100% healthy and 12% broken.
        lastHeartbeatAt: { type: string, format: date-time, nullable: true, readOnly: true }
        capabilities:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/DeviceCapability'
          description: >
            BL-179. **What this driver reports it can do, beyond reading media.** ADR-0015 is
            standards-first — the device does what the device does — and until now a venue could
            switch on a feature that depended on hardware without anything being able to say
            whether the hardware was there.

            **A capability absent is a capability unavailable**, not a capability assumed. A
            venue setting that requires one is refused where no device in scope reports it,
            rather than silently doing nothing at the gate.
        enrolmentState:
          type: string
          enum: [registered, enrolled, provisioned, active, deactivated, retired]
          default: registered
          readOnly: true
          description: >
            BL-160. **Where the device is in its life, which is not the same question as whether
            it is answering.** `enrolDevice` has taken the whole matrix — registered, enrolled,
            provisioned, active, deactivated, retired — since 16.1.2, and until now there was no
            column for it to land in, so the operation read this table and wrote nothing.

            **Distinct from `status` and from `health`.** `status` is what the device last said
            and `health` is what we computed from it; a decommissioned turnstile still sitting on
            the network is `online` and `retired` at once, and neither column contradicts the
            other. **A device that is `retired` is refused at the gate whatever its status says.**

            The transition itself — who moved it, from what, and why — is a
            `tenancy.device_audit` record. It is not repeated here, because the latest transition
            stored in two places is one place to go stale.
        retiredAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            **Set when `enrolmentState` reaches `retired`, and null otherwise.** Derivable from
            `tenancy.device_audit`, and kept as a column for the same reason
            `maintenance.asset.retired_on` is one: a retirement date you reconstruct from an audit
            log is a date nobody filters a fleet by.
        configurationProfileId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >
            **The profile this device was provisioned with.** `enrolDevice` has accepted one since
            16.1.3 and there was nowhere to keep it, so the answer to *"what is this reader
            configured as"* lived only in the request that set it.

    DeviceEnrolment:
      x-ticvai-persistence: "platform.device"
      type: object
      description: >
        BL-160. **The body `enrolDevice` accepts, named so that it writes.**

        It was an anonymous inline object, and `derive-lineage` reads writes from the schema an
        operation accepts — so the one operation that moves a device through its whole lifecycle
        recorded no writes at all, and `platform.device` looked like a table only
        `registerDevice` touched.

        **Provisioning is inside enrolment rather than beside it**, which is why
        `configurationProfileId` is here: a device that is enrolled but unprovisioned is a device
        that will fail at the gate on its first morning.
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - enrolled
          - provisioned
          - active
          - deactivated
          - retired
          description: >
            **The target state, not the current one.** `registered` is absent because
            `registerDevice` is what produces it and nothing transitions back to it.
        configurationProfileId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
          description: >
            **Recorded on the `tenancy.device_audit` row, not on the device.** Required in
            practice for `deactivated` and `retired`, where an investigation six months later
            needs to know why a gate stopped working.

    DeviceCapability:
      type: string
      description: >
        BL-179. **Something a driver reports, not something the platform provides.** The list
        grows as vendors are added, which is ADR-0015's whole position: adding a vendor is a
        driver plus configuration rather than a core change.

        **`genderClassification` is here because `VenueSettings.segregatedAccess.
        genderVerification` already offers `deviceAssisted` and nothing answered it** — a switch
        with no driver behind it. Where a venue's access hardware performs the check and the
        venue chooses to use it, the result is **advisory to the steward and never decisive at
        the turnstile** (`ValidationResult.advisory`). 3.2.45 asks for rejection; the package
        deviates deliberately and CF-130 records why.
      enum:
      - genderClassification

    ScopeLevel:
      type: string
      description: >
        **Seven organisational levels, confirmed binding (ADR-0011), plus `outlet`.** Region owns
        currency, decimal scale, time zone and fiscal year, inherited by every venue beneath and
        not overridable at venue level.

        **`outlet` was added on 18 August and is a sibling of `department`, not a child of it** —
        a commercial branch beside the organisational one. A department has requisitions, rotas
        and workstations; an outlet has a menu, stock and opening hours. **Modelling a restaurant
        as a department would put it in the staffing tree**, which is why the two cannot be
        collapsed (CF-138, ADR-0018).

        Only F&B and retail configuration resolves at outlet. Everything else has no outlet on
        its path and resolves from venue exactly as before.

        **The shared copy in `common.yaml` adds `subject`, and that is not a ninth level**
        (pull audit R105). It is valid only as an operation's `x-ticvai-scope-level`, for
        operations on one guest's own resources, which sit in no node of this hierarchy. Every
        `OrgUnit.level` is one of the eight here.
      enum: [tenant, brand, region, venue, department, subDepartment, workstation, outlet]

    OrgUnit:
      x-ticvai-persistence: "platform.scope"
      type: object
      required: [id, level, path, code, name, isActive]
