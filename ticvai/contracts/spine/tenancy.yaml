        floor is refused); AI system design section 8 decision 5; ADR-0047; shape follows
        setApprovalRetentionPolicy'
      x-ticvai-make-or-break: 'What is the lawful retention limit for Face Pass and Face Tag biometric data
        in each region the client operates? — why: biometric data protection law sets it and the client''s
        counsel must confirm it (MoM 2 Sep open item; the same question as access
        setBiometricLifecycleRetention). Until answered, the biometric classes carry no legal limit and
        nothing is refused on them.'
      summary: Set how long the tenant keeps one class of data
      description: '**Decided 29 September (Chinmay): all data retention is a tenant configuration, one
        setting per data class.** The tenant may set a period longer or shorter than the platform default.
        **The only refusal is a legal limit** — a period below a floor the law sets (payment records, 4.3.4;
        financial records, 6.1.78) is `422`, and so is one above a legal maximum once one is confirmed for
        the biometric classes (make-or-break, above). Nothing else is refused, including a period shorter
        than ADR-0047''s proposed default.


        **PUT semantics — the path names the class; the body replaces the setting whole.** The first call
        for a class creates the tenant''s row and later calls replace it, answered `200` either way.
        `retainAmount: null` with no `followsDataClass` returns the class to its platform default.
        `followsDataClass` makes the class keep whatever another class keeps — `aiDecisionRecords` follows
        `auditRecord` by default and a tenant may break the link by sending a period. **`aiMetadataIndex`
        always follows `aiDecisionRecords`** and takes no period of its own (`422`): the index is what
        answers a question once the raw text has gone, so it must outlive it (AI system design section 3.9).
        A chain of follows that loops is `422`.


        **What reads it.** Every retention job resolves its period here: marketing `setDataRetentionPolicy`
        rules (guest data by category and jurisdiction) and access `setBiometricLifecycleRetention` rules may
        only shorten the tenant''s period for their class, never lengthen it; `setApprovalRetentionPolicy`
        takes `approvalRecord` as its default; the AI service reads the four `ai*` classes.

        '
      tags:
      - tenancy
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDataRetentionSetting'
      responses:
        '200':
          description: Set — the class's setting as now applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDataRetentionSetting'
          headers:
            X-Consistency-Token:
              $ref: ../shared/common.yaml#/components/headers/ConsistencyToken
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '422':
          description: A period below the class's legal minimum or above its legal maximum, a period sent
            for `aiMetadataIndex`, or a `followsDataClass` chain that loops
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /cells/{cellId}/endpoints:
    get:
      operationId: listCellEndpoints
      summary: Where each service answers inside a cell
      description: >
        **A cross-cell call needs an address and the addresses were not readable.**
        `contract_version` is on the row because two cells can run different versions of the same
        contract during a rollout, and a caller that assumes otherwise fails in the least debuggable
        way.
      tags:
      - tenancy
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      parameters:
      - name: cellId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Where each service answers inside a cell
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformCellEndpoint'
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
components:
  # **Server-owned fields are `readOnly`, secrets are `writeOnly`** (pull audit R079, R164).
  # createOutlet, createSaleBoard, updateSaleBoard, registerDevice, deployConfigurationProfile,
  # the policy PUTs and setVenueSettings take these schemas as their body, and without the marks
  # a client had to invent the id and send back what the device reports or the server derives.
  # OpenAPI 3.1: a `readOnly` property listed in `required` is required in responses only, and a
  # client that sends one has it ignored. A `writeOnly` property is accepted and never returned.
  #
  # **Wall-clock times and calendar dates are the region's** (pull audit R143). Region owns the
  # time zone, inherited by every venue and not overridable (RegionSettings.timeZone). So an
  # wall-clock time in an opening-hours window, a support or quiet-hours window, a segregated-
  # access schedule or a maintenance window, and a `format: date`, are read in the time zone of the
  # region the row sits in — except where a schema names its own zone, as `supportHours.timezone`
  # does. `format: date-time` fields are instants in UTC, as naming-and-style 5.2 says.
  schemas:
    TenantDataRetentionClass:
      type: string
      description: >
        **The data classes a tenant sets a retention period for** (decided 29 September, Chinmay: all
        data retention is tenant configuration, one setting per class). Defaults are ADR-0047's and the
        AI system design's (section 8, decision 5); a legal limit is the only thing the platform
        enforces.

        | Class | Default | Counted from | Legal limit (refused) |
        |---|---|---|---|
        | `guestProfile` | 5 years | last activity | none |
        | `paymentRecord` | 10 years | created | at least 10 years (4.3.4) |
        | `financialRecord` | 7 years | created | at least 7 years (6.1.78) |
        | `auditRecord` | 2 years (authorisation and device audit) | created | none |
        | `approvalRecord` | 7 years (approvals board 6.7) | decided | none |
        | `complianceInspection` | 7 years | created | none |
        | `faceTagBiometric` | 7 days | ticket expiry | make-or-break |
        | `facePassBiometric` | follows `guestProfile` | last activity | make-or-break |
        | `aiPrompts` | 90 days (prompts and responses) | created | none |
        | `aiConversations` | 90 days | last activity | none |
        | `aiDecisionRecords` | follows `auditRecord` (decision records and the approvals of AI actions) | decided | none |
        | `aiMetadataIndex` | always follows `aiDecisionRecords` (summaries, entities, embeddings) | created | none |

        **ADR-0047's floors and ceilings that are not law are defaults now, not refusals** (the audit
        floor of one year, the proposed seven-year guest-profile ceiling, the Face Tag thirty-day
        ceiling). Platform-owned copies — the burst environment copy, a decommissioned cell — are not
        tenant data classes and are not here.
      enum:
      - guestProfile
      - paymentRecord
      - financialRecord
      - auditRecord
      - approvalRecord
      - complianceInspection
      - faceTagBiometric
      - facePassBiometric
      - aiPrompts
      - aiConversations
      - aiDecisionRecords
      - aiMetadataIndex
    TenantDataRetentionSetting:
      type: object
      x-ticvai-persistence: tenancy.data_retention_setting
      description: >
        **One tenant's retention period for one data class** (decided 29 September, Chinmay). One row
        per tenant and class, written by `setDataRetentionSetting`; a class with no row takes the
        platform default. The limit and default fields are the platform's catalogue, computed for the
        response and not stored on the row.
      required:
      - dataClass
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        dataClass:
          allOf:
          - $ref: '#/components/schemas/TenantDataRetentionClass'
          x-ticvai-unique: tenant
          description: One row per class per tenant. On a write it comes from the path; a body value is
            ignored.
        retainAmount:
          type: integer
          nullable: true
          minimum: 0
          description: >
            The tenant's period. Null with no `followsDataClass` means the platform default applies.
            Zero means the data is not kept past the transaction that produced it.
        retainUnit:
          type: string
          nullable: true
          enum:
          - days
          - months
          - years
          description: Required with `retainAmount`.
        followsDataClass:
          allOf:
          - $ref: '#/components/schemas/TenantDataRetentionClass'
          nullable: true
          description: >
            Keep this class for as long as another class is kept. Set by default for
            `aiDecisionRecords` (follows `auditRecord`), `facePassBiometric` (follows `guestProfile`)
            and `aiMetadataIndex` (follows `aiDecisionRecords`, and cannot be changed).
        onExpiry:
          type: string
          enum:
          - archive
          - anonymise
          - delete
          default: archive
          description: >
            ADR-0047's stages. `archive` moves the data to the archive instance, from where it is
            erased on the class's own schedule; derived stores (the AI index, search) purge at
            archive, not later.
        anchor:
          type: string
          readOnly: true
          x-ticvai-persisted: false
          enum:
          - createdAt
          - lastActivity
          - decidedAt
          - ticketExpiry
          description: What the period is counted from. Fixed per class by the platform.
        effectiveAmount:
          type: integer
          readOnly: true
          x-ticvai-persisted: false
          description: The period actually applied, after follows and defaults are resolved.
        effectiveUnit:
          type: string
          readOnly: true
          x-ticvai-persisted: false
          enum:
          - days
          - months
          - years
        isDefault:
          type: boolean
          readOnly: true
          x-ticvai-persisted: false
          description: True when the tenant has not set this class and the platform default applies.
        defaultAmount:
          type: integer
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
        defaultUnit:
          type: string
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          enum:
          - days
          - months
          - years
        legalMinimumAmount:
          type: integer
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          description: A floor the law sets. A shorter period is refused (`422`).
        legalMaximumAmount:
          type: integer
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          description: A maximum the law sets. A longer period is refused (`422`). Null for every class
            until the biometric make-or-break is answered.
        legalLimitUnit:
          type: string
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          enum:
          - days
          - months
          - years
        legalBasis:
          type: string
          nullable: true
          readOnly: true
          x-ticvai-persisted: false
          description: The law or requirement the limit comes from, e.g. `4.3.4`.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedByPrincipalId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        scopePath:
          type: string
          readOnly: true
          description: The tenant. Retention is set at tenant scope only.
    AuditRecord:
      x-ticvai-append-only: occurredAt
      type: object
      x-ticvai-persistence: "platform.audit_record"
      description: >
        26 September, pull audit R198. **One row of the platform audit trail, as `listAuditRecords`
        returns it.** It was a free-form object, so nothing said what an audit row carries. These
        are the fields the operation already filters on — who, where, on which workstation, what
        action, on what, and when — and nothing more. Written by the operations that audit
        themselves; never edited and never deleted.
      required: [id, action, occurredAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        principalId:
          type: string
          format: uuid
          description: Who acted.
        orgUnitId:
          type: string
          format: uuid
          nullable: true
          description: The scope node the action happened in.
        workstationId:
          type: string
          format: uuid
          nullable: true
          description: The workstation it was done from, where there was one.
        action:
          type: string
          description: What was done, as the writing operation names it.
        subjectRef:
          type: string
          nullable: true
          description: >
            **The thing acted on** — a profile, a shift, an order. The same value the `subjectRef`
            filter matches.
        occurredAt:
          type: string
          format: date-time
          description: When. The list is ordered by this, most recent first.
        platformStaffGrantId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Set when a TICVAI platform operator acted, naming the grant they acted under**
            (`identity.openPlatformStaffGrant`; decided 28 September, audit R098). Null for the
            tenant's own staff. Every platform action in a tenant carries one, so the tenant can
            see all of them.

    OpeningHoursWindow:
      type: object
      description: >
        26 September, pull audit R088. **One weekly window an outlet is open.** `Outlet.openingHours`
        was an array of untyped objects. The shape is the one `supportHours.windows` already uses —
        a day and a from/to — with the times as local `HH:MM` in the region's time zone. Several
        windows on one day are a split shift, such as lunch and dinner.
      required: [day, from, to]
      properties:
        day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        from:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time, 24-hour `HH:MM`, when the outlet opens.
        to:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time, 24-hour `HH:MM`, when the outlet closes.

    TenantDomain:
      type: object
      x-ticvai-persistence: control.tenant_domain
      x-ticvai-agreed: '29 September: system-design review SD-021'
      description: '**Hostname to tenant, outside every tenant database** (SD-021, 29 September). In the control
        database, because the edge must answer it before it knows which tenant database to open.
        `whitelabel.custom_domain` stays the tenant''s own record of its domain and its verification.'
      required:
      - hostname
      - tenantId
      - kind
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        hostname:
          type: string
          maxLength: 253
          x-ticvai-unique: tenant
        tenantId:
          type: string
          format: uuid
          x-ticvai-references: control.tenant
        cellId:
          type: string
          format: uuid
          nullable: true
          description: The cell serving the tenant, so the edge routes to the right region.
        databaseName:
          type: string
          maxLength: 63
          nullable: true
          description: The tenant database on the cell's instance (ADR-0038).
        kind:
          type: string
          enum:
          - platformSubdomain
          - customDomain
        channel:
          type: string
          nullable: true
          enum:
          - guestWeb
          - backOffice
          - partnerPortal
          - developerPortal
        status:
          type: string
          enum:
          - active
          - detached
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    PlatformIdempotencyRecord:
      type: object
      x-ticvai-persistence: platform.idempotency_record
      x-ticvai-agreed: '29 September: system-design review SD-024 (durable idempotency store)'
      description: '**The durable idempotency record** (SD-024, 29 September): written in the same transaction as
        the state change a keyed write makes, unique on (`idempotencyKey`, `operationId`). A replay returns the
        stored response; Redis is a cache in front of this table. Rows expire after `expiresAt` (a sweeper
        deletes them in batches; offline clients replay within the offline bound, so the window covers it).'
      required:
      - id
      - idempotencyKey
      - operationId
      - requestHash
      - status
      - createdAt
      - expiresAt
      - scopePath
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          format: uuid
        operationId:
          type: string
          maxLength: 100
        requestHash:
          type: string
          maxLength: 64
          description: SHA-256 of the canonical request, so the same key with a different body is a `409`.
        status:
          type: string
          enum:
          - inProgress
          - completed
        responseStatus:
          type: integer
          nullable: true
        responseBody:
          type: object
          nullable: true
          additionalProperties: true
        principalId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        scopePath:
          type: string
          description: The partition key (ADR-0005).
    PlatformCellEndpoint:
      type: object
      x-ticvai-persistence: platform.cell_endpoint
      description: '**Taken from the backend workbook, 20 September.** Stores how another Cell/service can securely reach a particular Cell, especially its CrossCell service endpoint.'
      required:
      - cellId
      - serviceName
      - url
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        serviceName:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 1000
        contractVersion:
          type: string
          maxLength: 50
          nullable: true
        authenticationType:
          type: string
          maxLength: 50
          nullable: true
        credentialReference:
          type: string
          maxLength: 500
          nullable: true
        status:
          type: string
          maxLength: 30
        lastHealthCheckAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    DeviceAssignment:
      type: object
      x-ticvai-persistence: tenancy.device_assignment
      description: '16.2.9 to 16.2.11. **Ownership, custody and location are three facts, not one.**'
