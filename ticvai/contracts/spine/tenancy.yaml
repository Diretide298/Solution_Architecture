  /devices/{deviceId}/enrolment:
    parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: enrolDevice
      x-ticvai-consumed-by:
        - "P08 BO-407 Reader Credit & Payment Configuration"
        - "P09 ADM-581 Terminal Provisioning & Device Configuration\t51"
      summary: Take a registered device through enrolment to activation
      description: '16.1.2, 16.1.3, 16.1.6. **`registerDevice` created a row; nothing turned it into a
        device you could trust.** Registration is an assertion — *this serial exists* — and enrolment is
        the process that issues it an identity, gives it a configuration and lets it talk.

        **Provisioning is inside enrolment rather than beside it**, because a device that is enrolled but
        unprovisioned is a device that will fail at the gate on its first morning, and the two states are
        never usefully apart.

        The transitions are the matrix''s own: registered → enrolled → provisioned → active →
        deactivated → retired. **Retirement revokes the credential** — a retired device whose certificate
        still validates is a spare key in a drawer.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
