        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileDeployment' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDeployment' }
          headers:
            X-Consistency-Token: { $ref: '../shared/common.yaml#/components/headers/ConsistencyToken' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
        '409':
          description: >
            **The named version is not deployable** — it is still a `draft`, or this profile has no
            such version. Names the version and its status.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /offline-policy:
    get:
      operationId: getOfflinePolicy
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: The offline policy saved at one scope node
      description: >
        26 September, pull audit R162 and R280. **The policy could be written and not read**, so
        BO-130 had no way to show the values it was about to change.

        **`scopePath` names the node**, the same key `setOfflinePolicy` upserts on. Where nothing
        has been saved there the answer is still `200`: the schema defaults, with no `id`. A
        policy that has never been set is the default policy, not a missing resource.

