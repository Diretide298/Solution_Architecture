  /configuration-profiles/{profileId}/deploy:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: deployConfigurationProfile
      x-ticvai-consumed-by:
        - "P08 BO-036 Device Registry"
        - "P08 BO-1068 Lifecycle & Environment Promotion"
        - "P08 BO-124 Layout & Journey Builder"
        - "P08 BO-126 Deployment, Preview & Audit"
        - "P08 BO-129 Software, Configuration & Version Management"
      summary: Push a version to a fleet, in stages
      description: >
        Board 1 of the client's POS set. **The board shows recent deployments with a date, a target
        and an outcome, and the package had no record of any.**

        **`onNextIdle` is the default and it is the important one.** A profile that lands mid-sale is
        a guest standing at a till watching it restart — a workstation takes the change when it is
        between transactions.

        **Staged rather than all-at-once**, because pushing to 1,248 workstations simultaneously is
        how a venue discovers a bad profile at every till at the same moment.

        **Failures group by reason.** Forty workstations failing for one cause is one problem, and
        forty rows is forty.

        **The client names the version, the target and the strategy; the server owns the rest.**
        `profileId` comes from the path, and `id`, `status`, the counts, `failureReasons`,
        `startedAt` and `completedAt` are `readOnly` and ignored on input. **Only a published
        version deploys** — a draft is still editable, and a version edited underneath its
        deployments is what publishing exists to prevent.
