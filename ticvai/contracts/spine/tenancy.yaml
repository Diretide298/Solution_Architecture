          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEnrolment'
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredDevice'
        '409':
          description: The transition is not allowed from the current state
          content:
            application/problem+json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/Problem
  /devices/{deviceId}/assignment:
