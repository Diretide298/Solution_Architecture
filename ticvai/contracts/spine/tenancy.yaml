        '201':
          description: Created — no policy was saved at this `scopePath`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflinePolicy' }
          headers:
            X-Consistency-Token: { $ref: '../shared/common.yaml#/components/headers/ConsistencyToken' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

