openapi: 3.1.0
info:
  title: TICVAI Tenancy & Organisation
  version: 1.0.0
  x-ticvai-screen-count: 30
  x-ticvai-tier: spine
  x-ticvai-module: "Cross-cutting — organisation hierarchy"
  x-ticvai-capabilities: [C95, C20]
  x-ticvai-platforms:
    - "P08 Venue Management"
    - "P04 POS"
    - "P07 Venue Scanner"
    - "P09 TICVAI Web"
  description: >
    ## What this contract covers

    **Defines where everything else lives.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | Cross-cutting — organisation hierarchy |
    | **Capabilities** | C95, C20 |
    | **Consumed by** | P08 Venue Management · P04 POS · P07 Venue Scanner · P09 TICVAI Web |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-region. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    The scope hierarchy, region settings and workstation configuration.

    Three positions shape this contract:

    - A cell serves exactly one tenant in one REGION (ADR-0014). Every path here operates
      within the current cell; there is no cross-region read. Jurisdiction is a placement
      constraint on regions, not the split rule.
    - Region owns currency, decimal scale, time zone, date format and fiscal year.
      These inherit to every venue beneath and are not overridable at venue level.
    - Point of sale is local-first (ADR-0013). A workstation reads its catalogue from a
      signed bundle held locally, so `Workstation` carries the deployment profile and the
      applied bundle version. Those fields are what a terminal needs at boot.

    The hierarchy is binding (ADR-0011): seven levels, Tenant through Workstation. The
    example populating the original client diagram was illustrative; the structure was not.
    Scope paths are variable-length ltree, so the model is depth-tolerant, but the level
    names below are now settled and a change to them is a breaking contract change.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local
        description: Resolved per tenant from the Control Plane. Never hardcoded in a client.

security:
  - bearerAuth: []

tags:
  - name: scope
  - name: region
  - name: workstation

paths:
  /org-units:
    get:
      operationId: listOrgUnits
      x-ticvai-consumed-by:
        - "P08 BO-064 Zones & Areas"
        - "P09 ADM-006 Tenant Hierarchy Explorer"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: List scope nodes visible to the session
      tags: [scope]
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: under
          in: query
          description: Return descendants of this path only. Omit for the full visible set.
          schema: { type: string }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/ScopeLevel' }
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Nodes at or beneath the session's granted scopes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OrgUnit' }
        '401': { $ref: '../shared/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createOrgUnit
      x-ticvai-consumed-by:
        - "P08 BO-064 Zones & Areas"
        - "P09 ADM-006 Tenant Hierarchy Explorer"
        - "P09 ADM-420 Tenant & Organization Provisioning"
      x-ticvai-audience: [staff]
      summary: Create a scope node
      tags: [scope]
      x-ticvai-permission: SCOPE_MANAGE
      x-ticvai-scope-level: brand
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScopeNodeRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgUnit' }
          headers:
            X-Consistency-Token:
              schema: { type: string }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../shared/common.yaml#/components/responses/Conflict' }

  /audit-records:
    get:
      operationId: listAuditRecords
      x-ticvai-consumed-by:
        - "P08 BO-035 Override Audit"
        - "P08 BO-036 Device Registry"
        - "P08 BO-068 Audit Log"
        - "P08 BO-124 Layout & Journey Builder"
        - "P08 BO-126 Deployment, Preview & Audit"
        - "P08 BO-133 Offline Alerts, Limits & Audit"
      summary: Who did what, where, and when
      description: >
        POS board 1 and 4, 24 August. **`platform.audit_record` existed and nothing read it** —
        fifteen operations write an audit trail and no operation, screen or flow could show one.
        `BO-068 Audit Log` had zero operations declared.

        Found by mapping the POS pack: four separate frames wanted an audit view — station events,
        profile deployments, limit unlocks, override history — and **every one of them is this
        operation with a filter.**

        **Reading the audit log is itself audited.** `platform.audit_read` exists for that reason:
        a trail nobody can inspect is useless, and one anybody can inspect without trace is a
        different problem.

        **Never deletes and never edits.** The only operations on an audit record are write and
        read — which is why there is no `updateAuditRecord` here and never will be.
      tags: [tenancy]
      x-ticvai-permission: AI_AUDIT_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: analytical
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: orgUnitId
          in: query
          schema: { type: string, format: uuid }
        - name: principalId
          in: query
          schema: { type: string, format: uuid }
        - name: workstationId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: subjectRef
          in: query
          description: >
            **The thing acted on.** A profile, a shift, an order — one filter rather than a
            different endpoint per subject, which is what four board frames were asking for.
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Records, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /roles/{roleId}/permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setRolePermissions
      x-ticvai-consumed-by:
        - "P08 BO-071 Planned Maintenance"
        - "P08 BO-116 Merchandising & Product Presentation"
      summary: What this role may do
      description: >
        POS board 4B. **`Role.permissions` was added on 20 August after Hrushikant found
        `identity.role_permission` with one column** — and nothing wrote it.

        A role that grants no permissions is not a role, and until now a venue could create one and
        never give it anything.

        **The whole set in one call.** A permission added one at a time leaves a role briefly
        holding a combination nobody intended, and **a segregation-of-duties rule evaluated against
        that intermediate state either fires wrongly or misses.**

        **Refused where it breaches a `SegregationRule`.** The refusal names the rule and the two
        permissions in conflict — a venue told only *not allowed* will grant it another way.
      tags: [identity]
      x-ticvai-permission: ROLE_MANAGE
      x-ticvai-permission-escalated: ROLE_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items: { $ref: '../shared/permissions.yaml#/components/schemas/Permission' }
                inheritsFromRoleId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          description: >
            **Breaches a segregation rule.** Names the rule and both permissions.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /workstations/{workstationId}/health:
    parameters:
      - name: workstationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWorkstationHealth
      x-ticvai-consumed-by:
        - "P04 POS-001 Begin Shift"
        - "P04 POS-025 Till Home"
        - "P08 BO-036 Device Registry"
        - "P08 BO-1069 Platform Health & Observability"
        - "P08 BO-125 Product & Category Button Configuration"
        - "P08 BO-128 Live Workstation Health Monitor"
        - "P08 BO-129 Software, Configuration & Version Management"
      summary: A score a manager can sort by, and what is dragging it down
      description: >
        Board 1 of the client's POS design set. **The package held `lastHeartbeatAt` and a heartbeat
        timestamp is not a score** — a fleet dashboard exists so somebody can open the worst
        workstation first, and that needs a ranking.

        **Derived, never reported.** A workstation does not know whether it is healthy, and asking
        it produces a fleet that is 100% healthy and 12% broken.

        **Returns the contributors, not just the number.** A score of 62 tells a manager to look; the
        three things dragging it down tell them what to do.
      tags: [tenancy]
      x-ticvai-permission: DEVICE_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  score: { type: integer }
                  status: { type: string, enum: [healthy, warning, degraded, offline] }
                  contributors:
                    type: array
                    items:
                      type: object
                      properties:
                        factor: { type: string, enum: [heartbeatAge, deviceOffline, deviceBattery, firmwareOutdated, syncBacklog, errorRate, profileDrift] }
                        detail: { type: string }
                        weight: { type: integer }

  /configuration-profiles:
    put:
      operationId: setConfigurationProfile
      x-ticvai-consumed-by:
        - "P08 BO-1070 Setup, Clone & Inheritance"
        - "P08 BO-123 POS Profile Management"
        - "P08 BO-129 Software, Configuration & Version Management"
      summary: What a class of workstation is configured to be
      description: >
        Board 1 of the client's POS set. **A profile is what a venue changes; a version is what it
        deploys**, and the package had a firmware version field and no profile at all.

        **Publishing makes the version immutable.** A workstation still running v2.3 must be able to
        say what v2.3 was, and a profile edited underneath its deployments cannot.
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-config-scope: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurationProfile' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationProfile' }

  /configuration-profiles/{profileId}/deploy:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: deployConfigurationProfile
      x-ticvai-consumed-by:
        - "P08 BO-036 Device Registry"
        - "P08 BO-1068 Lifecycle & Environment Promotion"
        - "P08 BO-124 Layout & Journey Builder"
        - "P08 BO-126 Deployment, Preview & Audit"
        - "P08 BO-129 Software, Configuration & Version Management"
      summary: Push a version to a fleet, in stages
      description: >
        Board 1 of the client's POS set. **The board shows recent deployments with a date, a target
        and an outcome, and the package had no record of any.**

        **`onNextIdle` is the default and it is the important one.** A profile that lands mid-sale is
        a guest standing at a till watching it restart — a workstation takes the change when it is
        between transactions.

        **Staged rather than all-at-once**, because pushing to 1,248 workstations simultaneously is
        how a venue discovers a bad profile at every till at the same moment.

        **Failures group by reason.** Forty workstations failing for one cause is one problem, and
        forty rows is forty.
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: tenant
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileDeployment' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDeployment' }

  /offline-policy:
    put:
      operationId: setOfflinePolicy
      x-ticvai-consumed-by:
        - "P08 BO-037 Offline Package Status"
        - "P08 BO-128 Live Workstation Health Monitor"
        - "P08 BO-130 Offline Policy & Rules Configuration"
        - "P08 BO-206 Offline Validation Policy Builder"
      summary: What a workstation may do with no network, and for how long
      description: >
        Board 5 of the client's POS set, and **one of only two things in 36 board screens the package
        could not do.** ADR-0013 makes the POS local-first and nothing configured the policy.

        **A ceiling on count as well as value.** Nine hundred small sales and one large one are
        different risks, and a value ceiling alone catches only the second.

        **A till three days offline holding 900 unsynced sales is a reconciliation nobody can do**,
        which is what `maxOfflineHours` prevents — after it, the workstation refuses to sell rather
        than keep journalling.
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfflinePolicy' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflinePolicy' }

  /connectivity-policy:
    put:
      operationId: setConnectivityThresholds
      x-ticvai-consumed-by:
        - "P08 BO-129 Software, Configuration & Version Management"
        - "P08 BO-131 Connectivity & Auto-Switch Settings"
      summary: When a workstation decides it is offline, and when it is back
      description: >
        Board 5 of the client's POS set, and the second genuine gap. **Nothing held a threshold**, so
        a device that flips offline on one dropped packet and one that waits five minutes were the
        same product.

        **Going offline and coming back use different thresholds, deliberately.** Symmetric ones
        produce a workstation that flaps across a marginal connection, and every flap is a sync.

        `minimumStableSeconds` is what stops it, and **it is the field a venue with poor wifi will
        actually tune.**
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectivityPolicy' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectivityPolicy' }

  /venues/{venueId}/settings:
    parameters:
      - name: venueId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVenueSettings
      x-ticvai-consumed-by:
        - "P04 POS-019 Shift Templates & Policies"
        - "P08 BO-063 Opening Hours & Calendar"
        - "P08 BO-100 Venue Home"
        - "P08 BO-101 Orders & Money"
        - "P08 BO-102 Sell"
        - "P08 BO-103 Access & Venue"
        - "P08 BO-104 Food & Beverage"
        - "P08 BO-105 Stock & Supply"
        - "P08 BO-106 People & Access Rights"
        - "P08 BO-1063 Venue-Specific Configuration"
        - "P08 BO-107 Guests & Marketing"
        - "P08 BO-108 Venue Operations"
        - "P08 BO-136 F&B Global Settings & Controls"
        - "P08 BO-142 Store Rules, Controls & Permissions"
        - "P08 BO-143 Retail Global Settings & Controls"
      summary: Operational settings for this venue
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueSettings' }
    put:
      operationId: setVenueSettings
      x-ticvai-consumed-by:
        - "P04 POS-019 Shift Templates & Policies"
        - "P08 BO-065 Venue Configuration"
        - "P08 BO-1063 Venue-Specific Configuration"
        - "P08 BO-116 Merchandising & Product Presentation"
        - "P08 BO-136 F&B Global Settings & Controls"
        - "P08 BO-143 Retail Global Settings & Controls"
        - "P08 BO-600 Venue, Calendar & Operational Setup"
        - "P15 KIT-009 SLA, Priority & Service Rules"
      summary: Set support hours, quiet hours, segregated access and alerting
      description: >
        **The four things a venue answers and no other level can** (CF-100, CF-130, CF-134).

        Support hours were an open conflict for eleven days and were never a design question — the
        code is identical whether a desk runs 24/7 or nine to six, and **what was missing was
        somewhere to put the answer.**
      tags: [tenancy]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueSettings' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueSettings' }

  /org-units/{orgUnitId}:
    parameters:
      - name: orgUnitId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrgUnit
      x-ticvai-consumed-by:
        - "P08 BO-064 Zones & Areas"
        - "P08 BO-1062 Tenant & Brand Context"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read a scope node
      tags: [scope]
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgUnit' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }
    patch:
      operationId: updateOrgUnit
      x-ticvai-consumed-by:
        - "P08 BO-064 Zones & Areas"
      x-ticvai-audience: [staff]
      summary: Rename or deactivate a scope node
      description: >
        Deactivating a node causes every permission query at or beneath it to resolve to
        DENY. It does not delete data.
      tags: [scope]
      x-ticvai-permission: SCOPE_MANAGE
      x-ticvai-scope-level: brand
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                isActive: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgUnit' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /regions/{regionId}/settings:
    parameters:
      - name: regionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRegionSettings
      x-ticvai-consumed-by:
        - "P08 BO-1064 Naming, Numbering & Localization"
      x-ticvai-audience: [staff]
      x-ticvai-read-routing: replica
      summary: Read region settings
      description: >
        Currency, decimal scale, time zone, date format and fiscal year. These inherit to
        every venue beneath and are not overridable at venue level.
      tags: [region]
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-scope-level: region
