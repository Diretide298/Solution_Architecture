      operationId: rollbackDeviceFirmware
      summary: Put the fleet back on the previous version
      description: '16.6.34. **The requirement that makes the rest safe.** A staged rollout is only a
        containment strategy if there is a way back, and the previous image has to still be on the device
        for that to be true — which is a constraint on the rollout, not on the rollback.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                deviceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Omit to roll back every device the rollout touched.
      responses:
        '200':
          description: Rolling back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFirmwareRollout'
  /devices/{deviceId}/credentials:
    parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: issueDeviceCredential
      summary: Give the device an identity it can prove
      description: '16.7.35, 16.7.36 and 16.7.37. **A device that authenticates with a shared key is a
        device that cannot be revoked alone.** Per-device credentials with an expiry are what make
        retirement (16.1.6) mean anything and what let one compromised scanner be cut off without
        re-keying an estate.

        **Rotation is routine rather than exceptional.** A credential that never expires is one nobody
        has practised replacing, and it will be replaced for the first time during an incident.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                validForDays:
                  type: integer
                  default: 90
                revokePrevious:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredential'
    delete:
      operationId: revokeDeviceCredential
      summary: Cut a device off now
      tags:
      - devices
      x-ticvai-permission: DEVICE_MANAGE
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      parameters:
      - name: reason
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked
  /devices/{deviceId}/audit:
    parameters:
    - name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listDeviceAuditRecords
      summary: What was done to this device, and what it did
      description: '16.7.38 and 16.7.39. **Two logs, one read.** The device audit is what administrators
        did to it — enrolled, reconfigured, re-keyed, retired. The access log is what it did — who signed
        in on it and what they scanned. An investigation almost always needs both interleaved, and
        joining them at read time is the only way to get the order right.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - administration
          - access
          - security
      responses:
        '200':
          description: The timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceAuditRecord'
  /device-tamper-events:
    get:
      operationId: listDeviceTamperEvents
      summary: Devices that report having been interfered with
      description: '16.7.40. **Tamper detection is only useful if somebody is told.** A turnstile
        controller whose enclosure was opened at two in the morning has reported a fact that means
        nothing sitting in a table — so these raise an alert and hold a state, and a device in a tamper
        state is untrusted until somebody clears it explicitly.

        '
      tags:
      - devices
      x-ticvai-permission: DEVICE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      parameters:
      - name: unresolvedOnly
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Tamper events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceTamperEvent'
    post:
      operationId: recordDeviceTamperEvent
      summary: A device reports interference
      tags:
      - devices
      x-ticvai-permission: DEVICE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTamperEvent'
      responses:
        '201':
          description: Recorded, and the device marked untrusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTamperEvent'

  /cells/{cellId}/endpoints:
    get:
      operationId: listCellEndpoints
      summary: Where each service answers inside a cell
      description: >
        **A cross-cell call needs an address and the addresses were not readable.**
        `contract_version` is on the row because two cells can run different versions of the same
        contract during a rollout, and a caller that assumes otherwise fails in the least debuggable
        way.
      tags:
      - tenancy
      x-ticvai-permission: SCOPE_VIEW
      x-ticvai-audience:
      - staff
      x-ticvai-scope-level: tenant
      x-ticvai-read-routing: replica
      parameters:
      - name: cellId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Where each service answers inside a cell
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlatformCellEndpoint'
components:
  schemas:
    PlatformCellEndpoint:
      type: object
      x-ticvai-persistence: platform.cell_endpoint
      description: '**Taken from the backend workbook, 20 September.** Stores how another Cell/service can securely reach a particular Cell, especially its CrossCell service endpoint.'
      required:
      - cellId
      - serviceName
      - url
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        cellId:
          type: string
          format: uuid
        serviceName:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 1000
        contractVersion:
          type: string
          maxLength: 50
          nullable: true
        authenticationType:
          type: string
          maxLength: 50
          nullable: true
        credentialReference:
          type: string
          maxLength: 500
          nullable: true
        status:
          type: string
          maxLength: 30
        lastHealthCheckAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    DeviceAssignment:
      type: object
      x-ticvai-persistence: tenancy.device_assignment
      description: '16.2.9 to 16.2.11. **Ownership, custody and location are three facts, not one.**'
      properties:
        deviceId:
          type: string
          format: uuid
        ownerOrgUnitId:
          type: string
          format: uuid
          nullable: true
          description: Who the device belongs to — the cost centre that replaces it when it breaks.
        custodianPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: '**Who is holding it right now.** The fact a loss investigation needs.'
        assignedWorkstationId:
          type: string
          format: uuid
          nullable: true
        locationScopePath:
          type: string
          nullable: true
        lastSeenLocation:
          type: string
          nullable: true
          description: Reported by the heartbeat; distinct from where it is supposed to be.
        assetTag:
          type: string
          nullable: true
        acquiredAt:
          type: string
          format: date
          nullable: true
        warrantyExpiresAt:
          type: string
          format: date
          nullable: true
        assignedAt:
          type: string
          format: date-time
        scopePath:
          type: string
    DeviceTelemetryPoint:
      type: object
      x-ticvai-persistence: tenancy.device_telemetry
      description: '16.4.21 and 16.4.22. **A series, because degradation is not visible in a
        point-in-time reading.**

        '
      properties:
        deviceId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        batteryPercent:
          type: integer
          nullable: true
        batteryHealthPercent:
          type: integer
          nullable: true
        charging:
          type: boolean
          nullable: true
        signalStrength:
          type: integer
          nullable: true
        cpuPercent:
          type: number
          nullable: true
        memoryPercent:
          type: number
          nullable: true
        storageFreeMb:
          type: integer
          nullable: true
        consumables:
          type: object
          additionalProperties: true
          description: Paper, ribbon, wristband stock — whatever the device kind reports.
        uptimeSeconds:
          type: integer
          nullable: true
        scopePath:
          type: string
    DeviceFirmware:
      type: object
      x-ticvai-persistence: tenancy.device_firmware
      description: '16.6.30 and 16.6.32. **A release, and how much of the fleet is on it.**'
      properties:
        id:
          type: string
          format: uuid
        deviceKind:
          type: string
        version:
          type: string
        releaseNotes:
          type: string
          nullable: true
        artefactAssetId:
          type: string
          format: uuid
          nullable: true
        checksum:
          type: string
          nullable: true
        minimumPreviousVersion:
          type: string
          nullable: true
          description: '**Some updates cannot be applied from any starting point.** Naming the floor is
            how a two-step upgrade stays possible instead of bricking the devices that skipped one.

            '
        releasedAt:
          type: string
          format: date-time
          nullable: true
        installedCount:
          type: integer
          readOnly: true
        status:
          type: string
          enum:
          - draft
          - released
          - deprecated
          - withdrawn
    DeviceFirmwareRollout:
      type: object
      x-ticvai-persistence: tenancy.device_rollout
      description: '16.6.31, 16.6.33 and 16.6.34. **Staged, windowed and reversible.**'
      required:
      - firmwareId
      properties:
        id:
          type: string
          format: uuid
        firmwareId:
          type: string
          format: uuid
        targetScopePath:
          type: string
          nullable: true
        targetDeviceIds:
          type: array
          items:
            type: string
            format: uuid
        waves:
          type: array
          description: '**A canary first.** Gate hardware failing across a venue at once is an
            evacuation problem rather than an IT one.

            '
          items:
            type: object
            properties:
              name:
                type: string
              percent:
                type: integer
              startAt:
                type: string
                format: date-time
                nullable: true
              haltOnFailurePercent:
                type: integer
                default: 5
        maintenanceWindow:
          type: object
          nullable: true
          properties:
            from:
              type: string
            to:
              type: string
        previousVersionRetained:
          type: boolean
          default: true
          description: '**Rollback is only possible if the old image is still there**, so this is a
            property of the rollout rather than of the rollback.

            '
        status:
          type: string
          enum:
          - scheduled
          - running
          - paused
          - completed
          - halted
          - rolledBack
        succeededCount:
          type: integer
          readOnly: true
        failedCount:
          type: integer
          readOnly: true
        scopePath:
          type: string
    DeviceCredential:
      type: object
      x-ticvai-persistence: tenancy.device_credential
      description: '16.7.35 to 16.7.37. **Per device, with an expiry**, which is what makes retirement
        and revocation mean anything.

        '
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - clientCertificate
          - deviceToken
          - mutualTls
        fingerprint:
          type: string
          description: '**The identifier, never the secret.** The credential material is returned once at
            issue and is not readable afterwards.

            '
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revocationReason:
          type: string
          nullable: true
        scopePath:
          type: string
    DeviceAuditRecord:
      type: object
      x-ticvai-persistence: tenancy.device_audit
      description: '16.7.38 and 16.7.39. **Administration and access interleaved**, because an
        investigation needs the order.

        '
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum:
          - administration
          - access
          - security
        action:
          type: string
        actorPrincipalId:
          type: string
          format: uuid
          nullable: true
        previousValue:
          nullable: true
        newValue:
          nullable: true
        sourceIp:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        scopePath:
          type: string
    DeviceTamperEvent:
      type: object
      x-ticvai-persistence: tenancy.device_tamper_event
      description: '16.7.40. **A state, not a log line.** A device that reported tampering is untrusted
        until somebody clears it by hand.

        '
      required:
      - deviceId
      - kind
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - enclosureOpened
          - locationAnomaly
          - credentialMismatch
          - firmwareUnsigned
          - clockSkew
          - physicalRemoval
        detectedAt:
          type: string
          format: date-time
        detail:
          type: string
          nullable: true
        deviceTrusted:
          type: boolean
          default: false
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          format: uuid
          nullable: true
        resolution:
          type: string
          nullable: true
        scopePath:
          type: string
    OutletKind:
      type: string
      enum: [shop, restaurant, bar, cafe, kiosk, gameFloor, ticketOffice, mobile]

    ConfigurationProfile:
      type: object
      x-ticvai-persistence: "platform.configuration_profile"
      description: >
        Board 1 of the client's POS design set, 20 August. **The board shows 1,248 workstations
        across four versions and the package modelled none of it** — a firmware version field on the
        workstation, and nothing that says what a workstation is configured to be.

        **A profile is what a venue changes; a version is what it deploys.** Conflating them means a
        venue cannot say *roll the ticketing counters back and leave the kiosks alone*, which is the
        only reason to version a profile at all.
      required: [id, name, venueKindScope, version, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopePath: { type: string }
        venueKindScope:
          type: array
          description: >
            Which workstation types it applies to. **A ticketing counter and a kitchen display do
            not share a profile**, and a profile that claims to is a profile somebody deploys to the
            wrong fleet.
          items: { type: string }
        version:
          type: integer
          description: >
            **Immutable once deployed anywhere.** A change makes a new version, and the old one
            stays readable — a workstation still running v2.3 must be able to say what v2.3 was.
        settings:
          type: object
          additionalProperties: true
        status: { type: string, enum: [draft, published, deploying, deployed, superseded, rolledBack] }
        deployedCount: { type: integer, readOnly: true }
        publishedAt: { type: string, format: date-time, nullable: true }

    ProfileDeployment:
      type: object
      x-ticvai-persistence: "platform.profile_deployment"
      description: >
        **A deployment is an event with a date, a target and an outcome** — the client's board shows
        recent deployments with all three and the package had no record of any.

        **Staged rather than all-at-once by default.** Pushing a profile to 1,248 workstations
        simultaneously is how a venue discovers a bad profile at every till at the same moment.
      required: [id, profileId, version, status]
      properties:
        id: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        version: { type: integer }
        targetWorkstationIds: { type: array, items: { type: string, format: uuid } }
        targetFilter:
          type: object
          nullable: true
          description: By department, type or venue, where the target is a set rather than a list.
          additionalProperties: true
        strategy: { type: string, enum: [immediate, staged, onNextIdle], default: onNextIdle }
        status: { type: string, enum: [queued, inProgress, completed, partiallyFailed, rolledBack] }
        succeededCount: { type: integer, readOnly: true }
        failedCount: { type: integer, readOnly: true }
        failureReasons:
          type: object
          additionalProperties: { type: integer }
          description: >
            **Grouped, because 40 workstations failing for one reason is one problem** and a list of
            40 rows is forty.
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    OfflinePolicy:
      type: object
      x-ticvai-persistence: "platform.offline_policy"
      description: >
        Board 5 of the client's POS set. **ADR-0013 makes the POS local-first and nothing configured
        the policy** — one of only two things in 36 board screens the package genuinely could not do.

        CF-115 reframed offline into three data classes: catalogue and policy always local, contended
        inventory leased, transactional facts journalled. **This is where a venue says how far that
        goes for them.**
      required: [id, scopePath]
      properties:
        id: { type: string, format: uuid }
        scopePath: { type: string }
        maxOfflineHours:
          type: integer
          default: 24
          description: >
            **After which the workstation refuses to sell rather than keep journalling.** A till
            three days offline holding 900 unsynced sales is a reconciliation nobody can do and a
            fraud nobody can detect.
        allowedOffline:
          type: array
          description: >
            **What may happen with no network**, by data class. Selling from a cached catalogue is
            safe; issuing a refund is not, because the original sale cannot be verified.
          items:
            type: string
            enum: [sale, refund, exchange, entitlementIssue, entitlementValidate, loyaltyAccrual,
                   loyaltyRedemption, walletSpend, priceOverride, discount, voidLine, noSale]
        offlineValueCeiling:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        offlineTransactionCeiling:
          type: integer
          nullable: true
          description: >
            **A ceiling on count as well as value.** Nine hundred small sales and one large one are
            different risks, and a value ceiling alone catches only the second.
        onCeilingBreach: { type: string, enum: [warn, blockNewSales, blockAll], default: blockNewSales }
        requiresManagerToExtend: { type: boolean, default: true }

    ConnectivityPolicy:
      type: object
      x-ticvai-persistence: "platform.connectivity_policy"
      description: >
        Board 5 of the client's POS set, and the second of the two genuine gaps. **Nothing in the
        package held a threshold**, so a device that flips offline on one dropped packet and one that
        waits five minutes were the same product.

        **Going offline and coming back need different thresholds.** Symmetric ones produce a
        workstation that flaps — offline, online, offline — across a marginal connection, and each
        flap is a sync.
      required: [id, scopePath]
      properties:
        id: { type: string, format: uuid }
        scopePath: { type: string }
        failuresBeforeOffline:
          type: integer
          default: 3
          description: >
            **Consecutive, not cumulative.** One dropped request on a busy till is normal; three in a
            row is a network.
        probeIntervalSeconds: { type: integer, default: 15 }
        probeTimeoutMs: { type: integer, default: 2000 }
        successesBeforeOnline:
          type: integer
          default: 5
          description: >
            **Higher than the offline threshold, deliberately.** Coming back is where the cost is —
            a workstation that returns online and immediately fails has resynced for nothing.
        minimumStableSeconds:
          type: integer
          default: 30
          description: >
            How long the connection must hold before the workstation trusts it. **This is what stops
            the flapping**, and it is the field a venue with poor wifi will actually tune.
        autoSwitch: { type: boolean, default: true }


    Outlet:
      type: object
      x-ticvai-persistence: "platform.outlet"
      required: [id, code, name, venueId, kind]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/OutletKind' }
        zone: { type: string, nullable: true }
        stockLocationId:
          type: string
          format: uuid
          nullable: true
          description: >
            Where this outlet draws stock from. A shop and its stockroom are one location; a
            bar drawing from a central cellar is not.
        costCenterId:
          type: string
          format: uuid
          nullable: true
          description: Revenue and cost attribution. Outlet is the natural grain for both.
        openingHours:
          type: array
          items: { type: object }
        isActive: { type: boolean }

    SaleBoard:
      x-ticvai-persistence: "platform.sale_board"
      type: object
      required: [id, code, name, venueId, kind, pages]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SaleBoardKind' }
        pages:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, sortOrder, tiles]
            properties:
              name: { type: string }
              sortOrder: { type: integer }
              tiles:
                type: array
                items:
                  type: object
                  required: [position, kind]
                  properties:
                    position: { type: integer }
                    kind:
                      type: string
                      enum: [product, category, action, spacer]
                    variantId: { type: string, format: uuid, nullable: true }
                    label: { type: string }
                    colour: { type: string, nullable: true }
                    imageAssetRef: { type: string, nullable: true }
        isActive: { type: boolean }

    RegisteredDevice:
      x-ticvai-persistence: "platform.device"
      type: object
      required: [id, kind, driver, workstationId]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        driver:
          type: string
          description: >
            Built to an open standard where one exists — ESC/POS, UnifiedPOS, OSDP. Adding a
            vendor is a driver plus configuration, not a core change (ADR-0015).
        identifier: { type: string, nullable: true }
        workstationId: { type: string, format: uuid }
        model: { type: string, nullable: true }
        pushToken:
          type: string
          format: password
          nullable: true
          description: >
            BL-163. **Guest devices register for push and staff devices did not** —
            `registerGuestDevice` exists with a token, platform and failure count, and a scanner
            that cannot be told anything is a scanner somebody has to walk to.

            Write-only. **A push token is a credential**, and the rule that no surface holds a
            provider key applies here too.
        pushPlatform:
          type: string
          nullable: true
          enum: [ios, android, web, windows]
        pushFailureCount:
          type: integer
          default: 0
          description: >
            **Consecutive failures.** A token that has failed repeatedly is a device that was wiped
            or reassigned, and continuing to push to it is how a notification queue fills with
            nothing.
        offlineScope:
          type: string
          nullable: true
          enum: [none, readOnly, sellAndScan, fullVenue]
          description: >
            BL-163. **What this device may do with no connection**, which was unstated for the staff
            app while `venue-pos` and `venue-scanner` had it settled.

            **`fullVenue` on a personal handset is a decision, not a default** — a device that can
            do everything offline is a device that carries the whole venue's data in somebody's
            pocket.
        firmwareVersion: { type: string, nullable: true }
        isRequired:
          type: boolean
          description: True blocks shift open when the device is unreachable.
        status:
          type: string
          enum: [online, offline, error, consumableLow, needsAttention, unknown]
        batteryPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            Board 1 of the client's POS design set, 20 August. **A wristband encoder at 8% is a
            gate that stops working in an hour**, and nothing in the package carried it.

            **Null where the device has no battery**, which is most of them — a receipt printer
            reporting 100% forever is worse than one reporting nothing.
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **Distinct from `lastHeartbeatAt`.** A heartbeat is the workstation saying the device
            is attached; a check is the device answering. **A printer with no paper heartbeats
            perfectly**, which is why the client's board shows both columns.
        health:
          type: string
          enum: [healthy, warning, degraded, offline, unknown]
          default: unknown
          description: >
            **Derived, not reported.** Computed from heartbeat age, battery, firmware currency and
            error rate — a device does not know whether it is healthy, and asking it produces a
            fleet that is 100% healthy and 12% broken.
        lastHeartbeatAt: { type: string, format: date-time, nullable: true }
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCapability'
          description: >
            BL-179. **What this driver reports it can do, beyond reading media.** ADR-0015 is
            standards-first — the device does what the device does — and until now a venue could
            switch on a feature that depended on hardware without anything being able to say
            whether the hardware was there.

            **A capability absent is a capability unavailable**, not a capability assumed. A
            venue setting that requires one is refused where no device in scope reports it,
            rather than silently doing nothing at the gate.
        enrolmentState:
          type: string
          enum: [registered, enrolled, provisioned, active, deactivated, retired]
          default: registered
          description: >
            BL-160. **Where the device is in its life, which is not the same question as whether
            it is answering.** `enrolDevice` has taken the whole matrix — registered, enrolled,
            provisioned, active, deactivated, retired — since 16.1.2, and until now there was no
            column for it to land in, so the operation read this table and wrote nothing.

            **Distinct from `status` and from `health`.** `status` is what the device last said
            and `health` is what we computed from it; a decommissioned turnstile still sitting on
            the network is `online` and `retired` at once, and neither column contradicts the
            other. **A device that is `retired` is refused at the gate whatever its status says.**

            The transition itself — who moved it, from what, and why — is a
            `tenancy.device_audit` record. It is not repeated here, because the latest transition
            stored in two places is one place to go stale.
        retiredAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **Set when `enrolmentState` reaches `retired`, and null otherwise.** Derivable from
            `tenancy.device_audit`, and kept as a column for the same reason
            `maintenance.asset.retired_on` is one: a retirement date you reconstruct from an audit
            log is a date nobody filters a fleet by.
        configurationProfileId:
          type: string
          format: uuid
          nullable: true
          description: >
            **The profile this device was provisioned with.** `enrolDevice` has accepted one since
            16.1.3 and there was nowhere to keep it, so the answer to *"what is this reader
            configured as"* lived only in the request that set it.

    DeviceEnrolment:
      x-ticvai-persistence: "platform.device"
      type: object
      description: >
        BL-160. **The body `enrolDevice` accepts, named so that it writes.**

        It was an anonymous inline object, and `derive-lineage` reads writes from the schema an
        operation accepts — so the one operation that moves a device through its whole lifecycle
        recorded no writes at all, and `platform.device` looked like a table only
        `registerDevice` touched.

        **Provisioning is inside enrolment rather than beside it**, which is why
        `configurationProfileId` is here: a device that is enrolled but unprovisioned is a device
        that will fail at the gate on its first morning.
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - enrolled
          - provisioned
          - active
          - deactivated
          - retired
          description: >
            **The target state, not the current one.** `registered` is absent because
            `registerDevice` is what produces it and nothing transitions back to it.
        configurationProfileId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
          description: >
            **Recorded on the `tenancy.device_audit` row, not on the device.** Required in
            practice for `deactivated` and `retired`, where an investigation six months later
            needs to know why a gate stopped working.

    DeviceCapability:
      type: string
      description: >
        BL-179. **Something a driver reports, not something the platform provides.** The list
        grows as vendors are added, which is ADR-0015's whole position: adding a vendor is a
        driver plus configuration rather than a core change.

        **`genderClassification` is here because `VenueSettings.segregatedAccess.
        genderVerification` already offers `deviceAssisted` and nothing answered it** — a switch
        with no driver behind it. Where a venue's access hardware performs the check and the
        venue chooses to use it, the result is **advisory to the steward and never decisive at
        the turnstile** (`ValidationResult.advisory`). 3.2.45 asks for rejection; the package
        deviates deliberately and CF-130 records why.
      enum:
      - genderClassification

    ScopeLevel:
      type: string
      description: >
        **Seven organisational levels, confirmed binding (ADR-0011), plus `outlet`.** Region owns
        currency, decimal scale, time zone and fiscal year, inherited by every venue beneath and
        not overridable at venue level.

        **`outlet` was added on 18 August and is a sibling of `department`, not a child of it** —
        a commercial branch beside the organisational one. A department has requisitions, rotas
        and workstations; an outlet has a menu, stock and opening hours. **Modelling a restaurant
        as a department would put it in the staffing tree**, which is why the two cannot be
        collapsed (CF-138, ADR-0018).

        Only F&B and retail configuration resolves at outlet. Everything else has no outlet on
        its path and resolves from venue exactly as before.
      enum: [tenant, brand, region, venue, department, subDepartment, workstation, outlet]

    OrgUnit:
      x-ticvai-persistence: "platform.scope"
      type: object
      required: [id, level, path, code, name, isActive]
      properties:
        id: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/ScopeLevel' }
        parentId: { type: string, format: uuid, nullable: true }
        path:
          type: string
          description: Materialised ltree path, e.g. `t_ref.b_alpha.r_north.v_alpha1`.
          pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        isActive:
          type: boolean
          description: >
            False causes every permission query at or beneath this node to resolve to DENY.
        childCount: { type: integer, minimum: 0 }

    CreateScopeNodeRequest:
      type: object
      required: [level, parentId, code, name]
      properties:
        level: { $ref: '#/components/schemas/ScopeLevel' }
        parentId:
          type: string
          format: uuid
          description: Required for every level except tenant, which the cell creates at provisioning.
        code:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
          description: Becomes the final ltree segment. Immutable once created.
        name: { type: string, maxLength: 200 }


    VenueSettings:
      type: object
      x-ticvai-persistence: "platform.venue_settings"
      description: >
        **Venue-level operational configuration that no other level can answer.**

        Region owns currency, tax regime and fiscal year (ADR-0011). Venue owns the things that
        vary between two venues in one region — **opening hours, support hours, and what the local
        law requires of the gate.**
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: >
            **Added 20 August.** The schema reference derives table columns from API response schemas, and a response is not a table — this one returned everything a caller needs and not the row's own identity, so the table had no key and no row could be addressed, updated or deleted. Found by an audit of all 365 tables, not by a reader.
        venueId: { type: string, format: uuid }
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
          nullable: true
          readOnly: true
          description: >
            **`readOnly` is the freeze.** `setVenueSettings` takes this whole schema as its
            request body, so without it any settings save could rewrite the currency of a venue
            that had already traded — which is the one thing ADR-0018's amendment forbids. It is
            set when the venue is provisioned, defaulted from the region, and changed only by an
            operation whose precondition is that the venue has not yet traded.

            **The venue's trading currency, defaulted from its region and frozen once the venue
            has traded** (ADR-0018, amended 20 September). Currency was a region-only fact,
            grouped with tax rates on the reasoning that *"a venue cannot choose its VAT"* --
            true of tax and over-applied to currency, because a free-zone unit, a duty-free shop
            and a cruise terminal genuinely trade in a currency their region does not.

            **This column exists because the freeze needs somewhere to live.** A venue that
            resolved purely from its region would silently follow a region currency change after
            it had already traded, and every dated artefact beneath it -- a price list is a
            `validFrom`/`validTo` range -- would render retrospectively wrong. Null means
            "resolve from the region", which is the answer for every venue that has not
            overridden.
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          nullable: true
          readOnly: true
          description: >
            **Scale travels with currency** (ADR-0008), and so does the freeze. OMR is three decimal places because Oman
            says so; overriding the currency without the scale gets rounding wrong. Set together
            or not at all.
        supportHours:
          type: object
          description: >
            CF-100. **A venue decides whether its support desk is 24/7 or bounded, and the platform
            does not.** This was recorded as an open question for eleven days and was never one —
            the code is identical either way, and what was missing was somewhere to put the answer.
          properties:
            mode: { type: string, enum: [alwaysOn, businessHours, custom, none] }
            timezone: { type: string }
            windows:
              type: array
              items:
                type: object
                properties:
                  day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                  from: { type: string }
                  to: { type: string }
            outOfHoursMessage: { type: string, nullable: true }
        quietHours:
          type: object
          nullable: true
          description: >
            **When the platform does not send.** A wallet low-balance alert at 3am is a complaint,
            and journeys and message triggers both respect this.

            **Operational messages ignore it** — a queue-turn alert is why a guest is holding the
            phone.
          properties:
            from: { type: string }
            to: { type: string }
        biometrics:
          type: object
          nullable: true
          description: >
            CF-35, BL-096, BL-105, BL-106. **The venue-level master switch, and the one place a
            person is asked whether the paperwork exists.** Biometric data is sensitive under
            PDPL (Federal Decree-Law 45/2021) — heightened protection, explicit consent, and an
            Article 21 assessment before the processing rather than after it.

            **Nothing below this switch operates while it is off.** `AdmissionRules` may carry a
            `biometricPolicy` per ticket type and those rules are inert until a venue enables
            biometrics here, which means a profile copied between venues cannot start capturing
            faces at the destination.

            **Venue level because that is where the assessment is filed.** Region owns tax and
            currency; the DPIA, the consent notice and the hardware are a venue's.
          properties:
            isEnabled:
              type: boolean
              default: false
              description: >
                **Off by default, and turning it on is refused without the two fields below.**
                `setVenueSettings` answers 422 rather than accepting an enable it cannot
                evidence — **a DPIA nobody can name is a DPIA nobody did**, and the point of the
                refusal is that the person switching this on is asked at the moment they switch
                it on rather than by an auditor a year later.
            dpiaReference:
              type: string
              nullable: true
              maxLength: 200
              description: >
                **The venue's own reference for its Article 21 assessment.** The platform does
                not hold the document and does not judge it; it records that one was named, by
                whom, and when — which is what an audit asks for and what the venue can produce.
            consentNoticeAcknowledgedAt:
              type: string
              format: date-time
              nullable: true
              description: >
                **When somebody confirmed the consent forms are in place at the point of
                capture.** A guest consenting in an app is a record; a guest consenting at a
                ticket counter is a notice somebody has to have printed and a question somebody
                has to have asked.
            acknowledgedByPrincipalId:
              type: string
              format: uuid
              nullable: true
              description: >
                **Who confirmed it.** An acknowledgement with no name behind it cannot be
                followed up, and this is the field that makes the switch an act rather than a
                setting.
            faceTagPurgeMinutesAfterClose:
              type: integer
              nullable: true
              default: 0
              description: >
                BL-106. **How long a same-visit Face Tag survives past the close of the
                operating day**, and zero is the default because that is what 3.2.44 describes.
                A non-zero value is an operational allowance for a late reconciliation, not a
                retention period — **`facePass` ignores this entirely** and is bounded by its
                entitlement.
        segregatedAccess:
          type: object
          nullable: true
          description: >
            CF-130. **Configured at venue level because it changes by region and the venue is where
            it is known** — a Ladies Night, a family session, a prayer-time closure.

            **The platform does not infer gender.** 3.2.45 asks for automatic gender recognition and
            3.2.46 for rule-based facial recognition validation, and neither is built. Two reasons,
            and the second is the one that decided it:

            **A Ladies Night ticket is already gendered at the point of sale**, so the gate checks
            the entitlement the platform issued rather than the face in front of it — deterministic,
            auditable, and already contracted through `admissionRules`.

            **And these events are staffed.** A steward at the entrance is making the judgment
            anyway, and a classifier that overrules a person who can see more than it can is a
            machine and a human disagreeing while a guest waits.

            **`genderVerification` is a switch, not an implementation.** Where a venue's access
            hardware offers the capability and the venue chooses to use it, this turns it on —
            following ADR-0015's standards-first driver model, where the device does what the
            device does. **Not everything needs to be built.**
          properties:
            isEnabled: { type: boolean, default: false }
            appliesToAccessPointIds:
              type: array
              items: { type: string, format: uuid }
            schedule:
              type: array
              items:
                type: object
                properties:
                  day: { type: string }
                  from: { type: string }
                  to: { type: string }
                  admits: { type: string, enum: [all, women, womenAndChildren, families, members] }
            entitlementGated:
              type: boolean
              default: true
              readOnly: true
              description: >
                **Always true, and stated rather than assumed.** The gate admits on the entitlement.
                Everything below is advisory on top of that, and nothing replaces it.
            genderVerification:
              type: string
              enum: [off, staffAssisted, deviceAssisted]
              default: off
              description: >
                `off` — the entitlement decides and a steward handles exceptions. **The default, and
                what is contracted.**

                `staffAssisted` — the steward's screen shows the ticket type so they can ask. No
                inference anywhere.

                `deviceAssisted` — **the venue's access hardware performs the check, not the
                platform.** Available only where the driver reports the capability, and the result
                is **advisory to the steward rather than decisive at the turnstile** (3.2.45 asks
                for rejection; this deviates deliberately).
            overrideRateAlertThreshold:
              type: number
              nullable: true
              description: >
                Where `deviceAssisted` is on. **An override rate near zero means the steward has
                stopped deciding**, and that is the number that says whether the human safeguard is
                working or decorative.
        alerting:
          type: object
          description: >
            CF-134. **On-platform notification, marked as read.** Six contracts detect their own
            trouble and none told a person.

            **The panel is the default and email or WhatsApp only where the matrix names them** —
            an operational alert that arrives by email is an alert nobody sees in time.
          properties:
            channel: { type: string, enum: [dashboardPanel, dashboardAndEmail, dashboardAndWhatsapp], default: dashboardPanel }
            acknowledgementRequired: { type: boolean, default: true }
            escalateAfterMinutes: { type: integer, nullable: true }

    RegionSettings:
      x-ticvai-persistence: "platform.region_settings"
      type: object
      required: [countryCode, currencyCode, currencyScale, timeZone, fiscalYearStartMonth]
      properties:
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2. Determines the jurisdiction, and therefore the cell.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          description: >
            Decimal places for this region's currency. Varies by currency — some use 2, some
            use 3. Money columns are numeric(18,4) and carry the scale explicitly, because a
            fixed 2-place type silently truncates 3-place currencies.
        timeZone:
          type: string
          description: IANA zone, e.g. `Asia/Dubai`.
        dateFormat: { type: string, default: 'dd/MM/yyyy' }
        numberFormat: { type: string, default: '#,##0.00' }
        fiscalYearStartMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: Varies by country.
        placement:
          $ref: '#/components/schemas/Placement'
        cellName:
          type: string
          readOnly: true
          description: >
            The cell serving this region. One cell per tenant per region (ADR-0014).

    Placement:
      x-ticvai-persistence: "none — embedded in region_settings"
      type: object
      description: >
        Read-only here. Set by the Control Plane at provisioning.

        Every region is its own logical cell. Placement determines the infrastructure
        backing it, which is how cost is controlled without varying the split rule:
        `shared` puts several regions' databases on one cluster; `dedicated` and `isolated`
        give a region its own. Regions in different countries MUST have placements in their
        respective jurisdictions.
      readOnly: true
      required: [mode]
      properties:
        mode:
          type: string
          enum: [shared, dedicated, isolated, clientHosted]
        cellName: { type: string }
        cloudRegion: { type: string }

    DeploymentProfile:
      type: string
      description: >
        How this workstation obtains catalogue and inventory (ADR-0013).

        - `terminalLocal` — own SQLite, leases direct from the cell. Small venues, 4G sites
        - `venueEdge` — own SQLite, distributed via the venue edge node which holds the
          venue lease and sub-leases to terminals. Mid and large venues, stadium gates
        - `thin` — no local catalogue, server reads. Non-transactional surfaces only
      enum: [terminalLocal, venueEdge, thin]

    CatalogueState:
      x-ticvai-persistence: "none — computed from workstation bundle_version"
      type: object
      description: >
        The workstation's local catalogue position. A terminal beyond `staleAfter` must
        refuse to trade rather than transact against stale prices.
      required: [appliedBundleVersion, appliedAt, staleAfter, isStale]
      properties:
        appliedBundleVersion: { type: string }
        appliedAt: { type: string, format: date-time }
        staleAfter:
          type: string
          format: date-time
          description: Beyond this the terminal refuses to trade.
        isStale: { type: boolean }
        pendingBundleVersion:
          type: string
          nullable: true
          description: Published but not yet applied.

    SaleBoardKind:
      type: string
      enum: [ticketing, fnb, retail, mixed]

    DeviceKind:
      type: string
      enum:
        - receiptPrinter
        - ticketPrinter
        - labelPrinter
        - cashDrawer
        - barcodeScanner
        - rfidReader
        - nfcReader
        - cardReader
        - idReader
        - biometricReader
        - accessReader
        - paymentTerminal
        - customerDisplay
        - signageDisplay
        - kitchenDisplay
        - turnstileController
        - wristbandEncoder
        - signaturePad
        - scale
        - camera

    DeviceBinding:
      x-ticvai-persistence: "platform.device"
      type: object
      required: [kind, driver]
      properties:
        kind: { $ref: '#/components/schemas/DeviceKind' }
        driver:
          type: string
          description: >
            Driver identifier. Adding a vendor is a driver plus configuration, never a core
            change — every venue arrives with hardware not previously seen.
        identifier: { type: string, description: Serial, port or network address. }
        isRequired:
          type: boolean
          default: false
          description: >
            When true, the workstation refuses to open a shift if the device is absent.

    Workstation:
      x-ticvai-persistence: "platform.workstation"
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      type: object
      required: [id, code, name, venueId, regionId, scopePath, saleBoard, currency, currencyScale, timeZone]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        venueId: { type: string, format: uuid }
        regionId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid, nullable: true }
        scopePath: { type: string }
        saleBoard:
          type: object
          description: >
            Determines which front end loads. Bound to the workstation, not the role — the
            F&B terminal opens the F&B board. What the operator may then DO within it is
            governed by their permissions.
          required: [id, kind]
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: '#/components/schemas/SaleBoardKind' }
            name: { type: string }
        accessPointId:
          type: string
          format: uuid
          nullable: true
          description: >
            Inherited from the workstation, never selected by the operator. Null where the
            workstation is not at an access point.
        devices:
          type: array
          items: { $ref: '#/components/schemas/DeviceBinding' }
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          x-ticvai-persisted: false
          description: >
            **Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped and not overri
            dable below, so a row in a UAE region is AED and cannot be anything else. **Kept on the wire
            , removed from the table** — a client should not walk a hierarchy to read a figure, and the 
            database should not hold nine million copies of AED. Four tables genuinely differ from their
             region and keep a stored currency: `orders.payment.tender_currency`, `inventory.supplier`, 
            `ledger.account`, `control.partner_agreement`.
        currencyScale:
          type: integer
          minimum: 0
          maximum: 4
          x-ticvai-persisted: false
          description: >
            **Resolved from the region, not stored** (ADR-0018, 24 August). Region-scoped and not overri
            dable below, so a row in a UAE region is AED and cannot be anything else — storing it per ro
            w is a copy of a fact that cannot differ. **Kept on the wire, removed from the table**: a cl
            ient reading a figure should not walk a hierarchy to know what it means, and the database sh
            ould not hold nine million copies of AED. Four tables genuinely differ from their region and
             keep a stored currency — `orders.payment.tender_currency`, `inventory.supplier`, `ledger.ac
            count`, `control.partner_agreement`. **A guest paying USD at an AED venue is a real row; a w
            orkstation with its own currency is a misconfiguration.**
        timeZone: { type: string }
        deploymentProfile:
          $ref: '#/components/schemas/DeploymentProfile'
        edgeNodeId:
          type: string
          format: uuid
          nullable: true
          description: Present when `deploymentProfile` is `venueEdge`.
        healthScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          readOnly: true
          description: >
            Board 1 of the client's POS set. **A number a manager can sort by** — the package held
            `lastHeartbeatAt` and a heartbeat timestamp is not a score.

            The client's board shows 1,248 workstations at 96% healthy, and **the value of that
            figure is that it ranks**: a fleet dashboard exists so somebody can open the worst one
            first.

            **Derived from its devices, its heartbeat age, its firmware currency and its error
            rate.** Read-only, because a workstation that could set its own score would.
        configurationProfileId:
          type: string
          format: uuid
          nullable: true
          description: >
            Which profile this workstation runs, and at which version. **The client's board shows a
            fleet split four ways — 72% latest, 18.8% one behind, 6.1% outdated** — and the package
            had a firmware version field and no profile.

            **A profile is what a venue changes; a version is what it deploys.** Conflating them
            means a venue cannot say *roll the ticketing counters back and leave the kiosks*.
        catalogueState:
          $ref: '#/components/schemas/CatalogueState'
        offlineCapable:
          type: boolean
          description: >
            Derived from `deploymentProfile`. False only for `thin`. Under local-first,
            catalogue READS are always local on transactional surfaces; this flag governs
            whether WRITES can be queued.
        isActive: { type: boolean }

    ConfigureWorkstationRequest:
      type: object
      required: [name, saleBoardId]
      properties:
        cashierInputMode:
          type: string
          enum: [keyboard, touch, scanner, hybrid]
          default: hybrid
          description: >
            BL-061. **A till operator who touch-types is slower on a touchscreen and a new starter is
            faster.** The mode is per workstation because the operator is.
        guestDisplayContent:
          type: array
          description: >
            **What the guest-facing screen shows while a sale is in progress.** Line items always;
            the rest is the venue's choice — and **a second screen showing nothing is a second screen
            the guest ignores when it does show something that matters.**
          items: { type: string, enum: [lineItems, total, loyaltyBalance, promotions, branding, upsell, queuePosition] }
        loadedMediaStockId:
          type: string
          format: uuid
          nullable: true
          description: >
            BL-095. **Neither which stock a printer is loaded with nor how much is left.** A till that
            runs out of wristbands mid-queue is an outage nobody predicted, and the stock is inventory
            like anything else — this names which.
        mediaStockRemaining:
          type: integer
          nullable: true
          readOnly: true
