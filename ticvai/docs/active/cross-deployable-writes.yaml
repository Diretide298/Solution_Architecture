    setAlertRule, setAssetStatus, setBillingEntity, setCaseInvestigationResolution, setCaseResolution, setComboSlots,
    setDeliveryLocationOutletMapping, setFamilyHouseholdDependent, setFnbDeliveryPolicy, setFnbServiceChargePolicy,
    setGamePricing, setGameplayValidationRules, setItemAvailability, setKitchenRoutingRules, setKpiTargets,
    setMenuItemDailyCount, setMenuSections, setPrizeCost, setRecipe, setRefundCompensationService,
    setRentalDepositPolicy, setRentalFeePolicy, setResourceLifecycleState, setReturnPolicy, setServiceStage,
    setStoreRules, setTableLayout, setTransportFareTable, setVenuePoint, setWasteApprovalPolicy,
    simulateGameplayAuthorisation, simulateRentalPricing, splitBill, startStockCount, stopCampaign,
    submitOnboardingApplication, suggestResources, swapRentalEquipment, transferOrderItems, transferTableVisit,
    unscheduleCampaign, updateAsset, updateCampaign, updateDashboard, updateGuestProfile, updateMenu,
    updateMerchandise, updateMyProfile, updateRentalBooking, updateRentalPricingProfile, updateRequisitionLines,
    updateResource, updateResourcePackage, updateTableReservation, updateTableVisit, updateVendorServiceRequest,
    updateVisitPlan]
  added: '2026-10-25'
  decision_ref: ADAM CR-234, option A, Chinmay, 25 October 2026; widened to every operations-host operation by ADAM
    CR-296, option A, Chinmay, 29 October 2026
  why: 'F&B runs in operations and answers Money (a table visit''s runningTotal, an order''s amounts, a menu''s prices)
    whose currency and scale are the venue''s frozen trading currency, Tenancy''s data in commerce (naming-and-style
    5.1, ADR-0018). The service route between deployables is not built (CR-174, CR-196), so the build had no allowed
    way to put a currency on the Money it answers. The operations host registers Tenancy''s in-process queries as the
    workers host does (IModuleQueries); the read runs in the caller''s transaction under the caller''s row-level
    security. mergeTableVisits raised it (CR-234); every F&B operation that answers Money reads it the same way.
    platform.outlet and tenancy#outletRecords were added on 26 October 2026 (ADAM CR-260, which the lead answered as
    already decided and carried by r10): a menu reaches its venue only through fnb.menu.outlet_id, so getMenu,
    setMenuItemDailyCount and the other menu operations read the outlet''s venue in process too.
    listProductStartTimes (resources, in operations) reads the venue''s stepMinutes the same way (ADAM CR-253).
    **Widened to the operations host, 29 October 2026** (ADAM CR-296, option A, as a ruling for the whole class;
    Chinmay: "Yes, all 141"; CHG-R11RUL-001): every operation the operations deployable hosts reads Tenancy''s
    settings in process wherever it needs them, through Tenancy''s own query classes and never through its SQL:
    tenancy#scopeRecords (platform.scope, which every host may read since CR-002, so no grant is added for it),
    tenancy#venueSettingsRecords, tenancy#regionSettingsRecords and tenancy#outletRecords (the three tables above,
    granted by V0116). SELECT only, row security unchanged, no migration. The 141 operations whose only reads
    across deployables were these four, Reporting''s alert operations among them, and every other read of the four
    by an operations-host operation moved from service to in-process (195 reads on 172 operations), so the list
    above is every operations-host operation that asks one of the four. getSupplierPerformance reads
    tenancy#regionSettingsRecords for each order''s time zone (ADAM CR-297, option A).'
- id: XDR-005
  reader: commerce
  tables: [assets.media_asset]
  privileges: [SELECT]
  queries: [assets#mediaAssetRecords]
  operations: [searchCatalogue, listProducts, getProduct]
  added: '2026-10-25'
  decision_ref: ADAM CR-221, option A; the lead's answer to r10 question 14 (recommended answer accepted), Chinmay, 25 October 2026
  why: 'The guest product reads (catalogue, commerce) answer each ProductMedia''s url and thumbnailUrl, the asset''s
    stable CDN address, and the assets are Assets'' (VenueOps, operations). The service route between deployables is not
    built (CR-174), and a call on it would run at the tenant root and lose the caller''s scope; read in process instead,
    as XDR-001 and XDR-002, a plain select on the same tenant database under the caller''s own connection, so the
    table''s row-level security scopes it.'
- id: XDR-006
  reader: commerce
  tables: [control.api_client]
  privileges: [SELECT]
  queries: [public-api#apiClientRecords]
  operations: [setApprovalExternalProvider]
  added: '2026-10-26'
  decision_ref: ADAM CR-243, option A, Chinmay, 26 October 2026
  why: 'approvals setApprovalExternalProvider (Tenancy, commerce) refuses an apiClientId that is not an active API
    client of the tenant with 422 api-client-not-active, and the API clients are Platform''s (operations), in the
    control database. The service route between deployables is not built (CR-174), so there was no allowed way to
    answer the 422. Commerce reads control.api_client in process over the control connection it already holds for
    routing (#27692, CR-161), served in-process as well as service. The grant is written into the control database''s
    forward migration, not the tenant''s (tools/derive-ddl.py). control.api_client has no row-level security, so the
    asker names the rows it may see (the client''s allowed_tenant_ids holds the caller''s tenant).'
- id: XDR-007
  reader: operations
  tables: [catalogue.variant, catalogue.product, catalogue.product_media, catalogue.price, catalogue.price_assignment,
    catalogue.price_list, catalogue.performance, platform.venue_settings]
  privileges: [SELECT]
  queries: [catalogue#variantsSellableAt, catalogue#variantListingFacts, tenancy#venueSettingsRecords]
  operations: [addToWishlist, getWishlist]
  added: '2026-10-28'
  decision_ref: ADAM CR-270, option A, Chinmay, 28 October 2026 (the narrow read, as for CR-243 and CR-234); getWishlist
    by ADAM CR-273, settled with CR-270 the same day
  why: 'Marketing (operations) asks whether a saved variant is sellable (catalogue#variantsSellableAt, the 404) and what
    its saved row shows (catalogue#variantListingFacts), and the currency of the Money it answers
    (tenancy#venueSettingsRecords); Catalogue and Tenancy are in commerce. Catalogue published neither query over HTTP
    and the service route between deployables is not built (CR-174, CR-241), so neither addToWishlist (#30705) nor
    getWishlist (#30706) could be built. The operations host asks the three in process, through Catalogue''s and
    Tenancy''s own query classes as the workers host does, never through Marketing SQL: a plain select on the same
    tenant database under the caller''s own connection, so every table''s row-level security scopes it and FORCE RLS
    stays on. SELECT only, on exactly the tables the three queries answer over: the variant, its product and the
    product''s primary media, the price-list resolution (price, price_assignment, price_list), the performance, and
    platform.venue_settings, whose inheritance reads the tenant''s own row of the same table and nothing else.'
- id: XDR-008
  reader: operations
  tables: [catalogue.variant, catalogue.product, catalogue.product_media, catalogue.product_category]
  privileges: [SELECT]
  queries: [catalogue#variantRecords, catalogue#productRecords, catalogue#productCategoryRecords]
  operations: [createFnbOrder]
  added: '2026-10-28'
  decision_ref: ADAM CR-277, option A, Chinmay, 28 October 2026 (the narrow read); catalogue.product_media and
    catalogue.product_category added by the lead on 29 October 2026, as the reads touch them
  why: 'createFnbOrder (F&B, operations) routes each line to a kitchen station, and an outlet''s category rules
    (KitchenRoutingRules.categoryRules, matchKind productCategory) match a catalogue product category code: the menu
    item''s catalogue variant (fnb.menu_item.product_variant_id, catalogue#variantRecords), its product
    (catalogue#productRecords, which reads catalogue.product_media for Product.media[] as well) and the product''s
    category (Product.categoryId, catalogue#productCategoryRecords, whose code the rule matches). Catalogue is in
    commerce and the service route between deployables is not built (CR-174, CR-241). The operations host asks the
    three in process, through Catalogue''s own query classes, in the caller''s transaction under the caller''s
    row-level security: SELECT only, on exactly the four tables they touch. The outlet read for paymentTiming is
    XDR-004''s.'
- id: XDR-009
  reader: operations
  tables: [platform.workstation]
  privileges: [SELECT]
  queries: [tenancy#workstationRecords]
  operations: [createFnbOrder]
  added: '2026-10-29'
  decision_ref: ADAM CR-293, option A, Chinmay, 29 October 2026
  why: 'createFnbOrder accepts a till order at its outlet in the same transaction and creates its kitchen tickets there
    (SD-046); an order from anywhere else waits for acceptFnbOrder. The till''s outlet is
    platform.workstation.outlet_id, Tenancy''s data in commerce, and the service route between deployables is not built
    (CR-241), so the build had no allowed way to tell a till at the outlet from one elsewhere. The operations host asks
    tenancy#workstationRecords for the caller''s workstation in process, through Tenancy''s own query classes, under the
    caller''s row-level security. The decision names it as XDR-004 gaining the table; it is recorded as its own entry
    so the outlet and settings grant XDR-004 holds is not edited by two changes at once.'
- id: XDR-010
  reader: access
  tables: [pii.subject]
  privileges: [SELECT]
  queries: [identity#subjectRecords]
  operations: [listDeviceBindingSession]
  # `narrow`: this entry grants its query to its own operations only, as its why says ("No other Access operation reads
  # pii.subject in process under this entry"); tools/check-cross-module-reads.py XR-ROUTE and XR-INPROCESS-HOST and
  # tools/contract_shapes.py read_route hold it so (r13, CHG-R13INP-001).
  narrow: true
  added: '2026-10-29'
  decision_ref: ADAM CR-302, option A, Chinmay, 29 October 2026
  why: 'access listDeviceBindingSession (Access, access host, BO-167) answers each device binding''s user, and the
    binding keeps only its holder''s subject_id; the name is pii.subject.display_name, Identity''s data in commerce. The
    service route between deployables is not built (CR-281; the kernel''s service sign-in, #37051), no grant let the
    access role read pii.subject, and the read is guest personal data. The lead chose the narrow in-process read already
    chosen for the same gap (XDR-001, XDR-003, CR-296): the access host asks identity#subjectRecords through
    Identity''s own query class, in the caller''s transaction under the caller''s own connection, so the table''s
    row-level security scopes it, and reads one column, display_name, and nothing else of the subject. SELECT only.
    Leaving user out until service sign-in (CR-302 option B) is the fallback if guest names should not cross into
    Access; copying the name onto access.device_binding (option C) copies PII and was not chosen. No other Access
    operation reads pii.subject in process under this entry.'
- id: XDR-011
  reader: operations
  tables: [catalogue.product_media, catalogue.product]
  privileges: [SELECT]
  queries: [catalogue#productMediaRecords]
  operations: [deleteMediaAsset]
  added: '2026-10-29'
  decision_ref: ADAM CR-309, option (b), Chinmay, 29 October 2026
  why: 'assets deleteMediaAsset (Assets, operations host) refuses 409 in-use while a product lists the asset
    (MediaUsage surface product), and a product''s media are catalogue.product_media rows, Catalogue''s data in
    commerce. catalogue#productRecords was asked over the service route, which nothing builds (CR-174, CR-241,
    CR-281), and cannot be asked which products list an asset without reading every product. Catalogue declares
    catalogue#productMediaRecords (catalogue.product_media by asset id, the product_id per asset), and the
    operations host asks it in process through Catalogue''s own query class, as CR-260 and XDR-004 serve Tenancy''s,
    in the caller''s transaction under the caller''s row-level security. SELECT on exactly the two tables it touches:
    catalogue.product_media and catalogue.product, whose policy product_media''s parent row security reads. Products
    recording their use as assets.media_usage rows (CR-309 option (a)) is the cleaner long-term rule and changes
    Catalogue''s product writers, which are other tickets.'
- id: XDR-020
  reader: operations
  tables: [platform.venue_settings, platform.region_settings]
  privileges: [SELECT]
  queries: [tenancy#venueSettingsRecords, tenancy#regionSettingsRecords]
  operations: [setMaintenanceMode]
  added: '2026-10-29'
  decision_ref: ADAM CR-338, city and openingHoursToday (a), Chinmay, 29 October 2026 ("As recommended"), under the
    ruling of ADAM CR-296 (XDR-004)
  why: 'white-label setMaintenanceMode (operations host) answers TenantAppStatus, as getTenantAppStatus does, and CR-338
    gives each venue in it a city and today''s opening hours from the venue''s settings (platform.venue_settings, read
    through tenancy#venueSettingsRecords) and today in the venue''s region time zone (platform.region_settings, through
    tenancy#regionSettingsRecords), Tenancy''s data in commerce. The operations host asks both in process, as CR-296
    ruled for every operations-host operation that asks them (XDR-004, which already lists getTenantAppStatus), through
    Tenancy''s own query classes, SELECT only, row security unchanged; both tables are granted to operations by V0116,
    so no grant is new. Recorded as its own entry, as XDR-009 was, so XDR-004 is not edited by two changes at once.'
- id: XDR-021
  reader: operations
  tables: [identity.sso_provider]
  privileges: [SELECT]
  queries: [identity#guestSignInProviders]
  operations: [getPublishedTenantConfig]
  added: '2026-10-29'
  decision_ref: ADAM CR-327, part (1), Chinmay, 29 October 2026 ("Kind column on sso_provider")
  why: 'white-label getPublishedTenantConfig (operations host) answers guestSignIn, the public client ids of the
    tenant''s enabled guest sign-in providers, before anyone signs in, and the providers are identity.sso_provider
    rows, Identity''s data in commerce. The service route between deployables is not built (CR-281; #37051). The
    lead marked the guest rows (audience guest, guestProvider apple, google or uaePass) and chose a narrow Identity
    query: the operations host asks identity#guestSignInProviders in process, through Identity''s own query class,
    under the caller''s connection, so the table''s row-level security scopes it, and it answers provider and
    display data only, never client_secret_ref. SELECT only, on the one table.'
- id: XDR-022
  reader: operations
  tables: [catalogue.product, catalogue.product_media]
  privileges: [SELECT]
  queries: [catalogue#productRecords, tenancy#activeVenues]
  operations: [validateTenantConfig, publishTenantConfig, restoreConfigVersion, setAnalyticsProvider,
    setMaintenanceMode, setBookingFlowConfig]
  added: '2026-10-30'
  decision_ref: ADAM CR-343, Chinmay, 30 October 2026 (A's sellable rule and in-process read, narrowed, and with the
    venue read in process too)
  why: 'white-label validateTenantConfig (operations host, #30778) reports bookingFlowMissing per active venue and
    ProductKind, and publishTenantConfig (#30774) runs the same rule. It needs each active venue''s sellable bookable
    products (catalogue.product, with catalogue.product_media for Product.media[], Catalogue''s data in commerce) and
    the active venues (tenancy#activeVenues, platform.scope). Both were declared on the service route between
    deployables, which is not built (CR-281; the kernel''s service sign-in, #37051). The operations host asks both in
    process, through the owning module''s own query class, in the caller''s transaction under the caller''s
    row-level security: catalogue#productRecords where {venueId} for each active venue, on the SELECT V0118 already
    grants the operations role on catalogue.product and catalogue.product_media (as for createFnbOrder under
    XDR-008), and tenancy#activeVenues, whose platform.scope is a kernel table every host may read (CR-002), as
    CR-296 ruled for Tenancy''s other reads, so no grant is added for it. restoreConfigVersion,
    setAnalyticsProvider (#30765) and setMaintenanceMode (#30766) ask tenancy#activeVenues in process under the same
    ruling; the two tickets CR-281 left waiting for service sign-in waited only for this read. setBookingFlowConfig
    (#31043) asks tenancy#activeVenues in process under the same ruling, to check each active venue''s guest contact
    fields against the GuestMatchPolicy in force there (ADAM CR-430, Chinmay, 31 October 2026; CHG-CR430-001). Not
    covered: publishTenantConfig and restoreConfigVersion still ask orders#venueChargeCurrencies over the service
    route, and getTenantConfig still asks tenancy#activeVenues over it.'
- id: XDR-023
  reader: operations
  tables: [access.entitlement]
  privileges: [SELECT]
  queries: [access#liveEntitlementSubjects]
  operations: [sendGuestBroadcast]
  added: '2026-10-31'
  decision_ref: ADAM CR-379, Chinmay, 31 October 2026 ("as you recommended", with the audience query, the venue and the
    second-principal rule stated; CHG-CR379-001)
  why: 'marketing-crm sendGuestBroadcast (operations host), the relay-invoked consumer of workforce.guestBroadcastAccepted,
    sends a venue-wide broadcast to every guest with a live entitlement at the venue, and the entitlements are
    access.entitlement rows, Access''s data in its own deployable. The service route between deployables is not built
    (CR-174, CR-281). The operations host asks access#liveEntitlementSubjects in process, through Access''s own query
    class, in the caller''s transaction under the caller''s row-level security, as commerce does under XDR-001. SELECT
    only, on the one table.'
- id: XDR-027
  reader: operations
  tables: [platform.workstation]
  privileges: [SELECT]
  queries: [tenancy#workstationRecords]
  operations: [assignKiosk, listKioskConfigs, getKioskConfig, listKioskAssignments]
  added: '2026-10-31'
  decision_ref: ADAM CR-383 (not as recommended, A on CR-384's channel) and ADAM CR-384 (as recommended, the values
    named as catalogue's Channel), Chinmay, 31 October 2026
  why: 'White Label''s kiosk operations (operations host) need to know which workstations are kiosks. CR-384 marks one:
    platform.workstation.channel, pos or kiosk, Tenancy''s data in commerce. assignKiosk (#35614) reads the workstation
    in the path for its 404 (not in the venue) and 409 not-a-kiosk (channel not kiosk); listKioskConfigs (#35618) and
    getKioskConfig (#35617) count assignedKioskCount from the venue''s kiosks, and listKioskAssignments (#35625)
    answers one item per kiosk of the venue (CR-383), all asking tenancy#workstationRecords where {venueId, channel:
    kiosk, isActive: true}. The service route between deployables is not built (CR-281; #37051). The operations host
    asks the query in process, through Tenancy''s own query class, in the caller''s transaction under the caller''s
    row-level security. SELECT only, on the one table, which V0118 already grants the operations role (as for
    createFnbOrder under XDR-009), so no grant is new. Recorded as its own entry beside XDR-009, so XDR-009 is not
    edited by two changes at once. Nothing writes a whitelabel.kiosk_assignment row from enrolment or
    configureWorkstation (CR-383 option B was not chosen).'
- id: XDR-028
  reader: operations
  tables: [catalogue.product, catalogue.product_media, payments.method]
  privileges: [SELECT]
  queries: [catalogue#productRecords, payments#paymentMethodRecords]
  operations: [getKioskConfigValidation, publishKioskConfigs]
  added: '2026-10-31'
  decision_ref: ADAM CR-385, Chinmay, 31 October 2026 (as recommended)
  why: 'White Label''s getKioskConfigValidation (#35623) and publishKioskConfigs (#35619) run the kiosk publish checks.
    tileWithoutProducts needs the venue''s sellable bookable products (catalogue.product, with catalogue.product_media
    for Product.media[], Catalogue''s data in commerce), asked of catalogue#productRecords where {venueId} in process
    as CR-343 ruled for the tenant configuration (XDR-022), on the SELECT V0118 already grants. paymentMethodUnavailable
    needs the accepted methods'' payments.method rows (Orders'' data in commerce), which no query served and no grant
    reached: Orders declares payments#paymentMethodRecords, and the operations host asks it in process through
    Orders'' own query class, in the caller''s transaction under the caller''s row-level security. SELECT only; the
    grant on payments.method is new (with USAGE on schema payments where the role lacks it). The service route between
    deployables is not built (CR-281; #37051). The media check''s assets#mediaAssetRecords is served in the same host
    (Assets runs in operations with White Label) and needs no entry. Recorded as its own entry, so XDR-022 is not
    edited by two changes at once.'
- id: XDR-031
  reader: access
  tables: [platform.device]
  privileges: [SELECT]
  queries: [tenancy#deviceRecords]
  operations: [setBleBeaconGeofence, getBleBeaconGeofence]
  added: '2026-10-31'
  decision_ref: ADAM CR-389, Chinmay, 31 October 2026 (not as recommended - A, with a centre for the circle and the
    reads named)
  why: 'access setBleBeaconGeofence (#30955) keeps one access.device_placement row (role proximity) per beacon, found by
    device_id = beaconId, and a beaconId that names no registered platform.device is 404; its view and
    getBleBeaconGeofence answer health and lastDetected, which are platform.device.health and last_heartbeat_at,
    Tenancy''s register (ADR-0067) in commerce. The service route between deployables is not built (CR-281; the
    kernel''s service sign-in, #37051), and the access role had no SELECT on platform.device. The access host asks
    tenancy#deviceRecords in process, through Tenancy''s own query class, in the caller''s transaction under the
    caller''s row-level security: a narrow read, as XDR-003 is. SELECT only, on the one table; the access role
    already has USAGE on platform.'
- id: XDR-032
  reader: access
  tables: [platform.venue_settings]
  privileges: [SELECT]
  queries: [tenancy#venueSettingsRecords]
  operations: [setFaceTagTemporaryEnrollment, listFaceTagTemporary]
  added: '2026-10-31'
  decision_ref: ADAM CR-390, Chinmay, 31 October 2026 (not as recommended - A, without a form version on the profile)
  why: 'access setFaceTagTemporaryEnrollment (#30956) falls back to the venue''s biometric consent form
    (VenueSettings.biometrics.consentFormId) when the profile names none, else 422 consent-form-required, and its view
    and listFaceTagTemporary answer templatesHeldByTicvai from the same settings: platform.venue_settings, Tenancy''s
    data in commerce. Both read it over the service route between deployables, which is not built (CR-281; #37051),
    and the access role had no SELECT on platform.venue_settings. The access host asks tenancy#venueSettingsRecords
    in process, through Tenancy''s own query class, in the caller''s transaction under the caller''s row-level
    security: a narrow read, as XDR-003 is. SELECT only. Not covered by this decision: seven other access operations
    (enrolFaceTag, enrolFacePass, createAdmissionRules, updateAdmissionRules, setRfidNfcCard,
    listBiometricConsentGuardian, listSecurityDetectionGovernance) still ask venueSettingsRecords over the service
    route.'
- id: XDR-033
  reader: operations
  tables: [catalogue.event, catalogue.product, catalogue.product_media, catalogue.product_category]
  privileges: [SELECT]
  queries: [catalogue#productRecords, catalogue#productCategoryRecords, catalogue#eventRecords]
  operations: [createGuidedChoice, proposeGuidedChoice, publishGuidedChoice]
  added: '2026-10-31'
  decision_ref: ADAM CR-394, Chinmay, 31 October 2026 (not as recommended - A, on the queries that already exist, with
    a rule stated for each kind)
  why: 'white-label createGuidedChoice (#30924) and proposeGuidedChoice (#30931) refuse a target not in the choice''s
    venue (400 target-not-in-venue), and publishGuidedChoice (#30932) refuses a target not on sale (422
    answer-target-not-on-sale). Product, category and event targets are Catalogue''s rows in commerce, and none of the
    three operations declared a read of them. The operations host asks catalogue#productRecords,
    catalogue#productCategoryRecords and catalogue#eventRecords in process, through Catalogue''s own query classes,
    in the caller''s transaction under the caller''s row-level security. The SELECT on catalogue.product,
    catalogue.product_media and catalogue.product_category is the one V0118 already grants the operations role
    (XDR-008, XDR-022); SELECT on catalogue.event is new, and the operations role already has USAGE on schema
    catalogue.'
- id: XDR-035
  reader: access
  tables: [identity.delegated_access]
  privileges: [SELECT]
  queries: [identity#principalHoldsRoleAtVenue]
  operations: [setTurnstileMode]
  added: '2026-10-31'
  decision_ref: 'ADAM CR-396, Chinmay, 31 October 2026 (posted on 30967: "not as recommended", keep whoCanActivate and
    ask identity#principalHoldsRoleAtVenue in process)'
  why: 'access setTurnstileMode (Access, access host, #30967) refuses freeFlow or dropArm to a caller who holds none of
    the governing gate mode policy''s whoCanActivate roles at the access point''s venue (403 gate-mode-role-required).
    Whether a person holds a role at a venue is identity.delegated_access, Identity''s data in commerce, and
    identity#principalHoldsRoleAtVenue already answers it as a yes or no (ADAM CR-336, CR-344; built by #32338). The
    lead chose to ask it in process, as the access host already asks identity#subjectRecords (XDR-010): through
    Identity''s own query class, which answers the one statement under the routed tenant''s root grant and returns only
    `holds`, never which grant or where. The service route between deployables is not built (CR-281; #37051). SELECT
    only, on the one table; no grant, role or scope is returned to Access.'
- id: XDR-036
  reader: access
  tables: [platform.scope]
  privileges: [SELECT]
  queries: [tenancy#scopeRecords]
