    tenancy#scopeRecords by id, in process, through Tenancy''s own query class, in the caller''s transaction under the
    caller''s row-level security, as XDR-003 does for the access host''s other Tenancy read and CR-296 ruled for the
    operations host (XDR-004). platform.scope is a kernel table every host may already SELECT (CR-002), so the grant
    derive-ddl writes for it adds no privilege. The service route between deployables is not built (CR-281; #37051).'
- id: XDR-051
  reader: operations
  tables: [catalogue.product, catalogue.product_media, catalogue.product_category]
  privileges: [SELECT]
  queries: [catalogue#productRecords, catalogue#productCategoryRecords]
  operations: [deleteBookingFlow, getPublishedBookingFlow]
  added: '2026-10-31'
  decision_ref: ADAM CR-426 (as recommended) and CR-427 (the reads and the 400 as recommended, the tie rule not),
    Chinmay, 31 October 2026
  why: 'white-label deleteBookingFlow (operations host, #31031) refuses 409 flow-in-use while a product or category
    names the flow, or while it is the venue''s default for its type and a product on sale would fall back to it;
    getPublishedBookingFlow (#31033) resolves a product''s or category''s flow. Both need Catalogue''s products
    (catalogue.product, with catalogue.product_media for Product.media[]) and categories (catalogue.product_category),
    Catalogue''s data in commerce, and both were declared on the service route between deployables, which is not
    built (CR-174; the kernel''s service sign-in, #37051). The operations host asks catalogue#productRecords and
    catalogue#productCategoryRecords in process, through Catalogue''s own query classes registered in the
    operations host, in the caller''s transaction under the caller''s row-level security, with their where input,
    as createFnbOrder does under XDR-008 and validateTenantConfig under XDR-022. The SELECT on the three tables is
    the one V0118 already grants the operations role (XDR-008); no grant or migration is added.'
- id: XDR-055
  reader: operations
  tables: [catalogue.rate]
  privileges: [SELECT]
  queries: [catalogue#variantListingFacts]
  operations: [addToWishlist, getWishlist]
  added: '2026-11-02'
  decision_ref: ADAM CR-439 (Chinmay, 1 November 2026) and CR-455 (Chinmay, 2 November 2026), on #35288
  why: 'variantListingFacts'' listPrice is now catalogue#variantPriceRecords for the one variant (CR-439), and that rule
    replaces price.amount with the winning assignment''s category rate, a catalogue.rate row, when the variant has a
    price category (CR-455). The operations host runs variantListingFacts in process for Marketing''s addToWishlist and
    getWishlist under XDR-007, which grants SELECT on the price-list resolution tables of CR-270 (price,
    price_assignment, price_list) but not on catalogue.rate, so the category rate would be refused at runtime. SELECT
    only on that one table, under the caller''s row-level security, through Catalogue''s own query class; derive-ddl
    writes the guarded grant into the next forward migration.'
- id: XDR-071
  reader: operations
  tables: [orders.order_line]
  privileges: [SELECT]
  queries: [orders#orderLineRecords]
  operations: [createShopAndDrop]
