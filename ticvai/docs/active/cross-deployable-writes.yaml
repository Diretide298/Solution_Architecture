    getCountVariance, getFnbDeliveryPolicy, getFnbOrder, getFnbServiceChargePolicy, getGameEligibility,
    getGamePricing, getGameplaySyncStatus, getGameplayValidationRules, getGuestBill, getGuestMenu, getGuestProfile,
    getKpiValues, getMapResourceAvailability, getMenu, getMyChallenges, getMyProfile, getNextTransportDeparture,
    getOutletStock, getRentalBooking, getResource, getResourceCostAnalytics, getResourceHold, getRetailSale,
    getReturnPolicy, getServiceSummary, getSupplierPerformance, getTableMap, getTableVisit, getTenantAppStatus,
    getTransportDeparture, getTransportFareTable, getVisitPlan, getWasteApprovalPolicy, getWishlist, getWorkOrder,
    joinQueue, joinRestaurantWaitlist, list86Events, listAlertRules, listAlerts, listAnalyticsAnomalies, listAssets,
    listBookableOutlets, listCampaigns, listCaseResolutionClosure, listChallenges, listCombos,
    listDeliveryCommunicationPlatform, listDiningOutlets, listFnbOrders, listFulfilmentSlots,
    listGameplayTransactions, listMenuVersions, listMenus, listMerchandise, listModifierGroups, listMyFavouriteRoutes,
    listMyTableReservations, listMyVisitPlans, listOverdueRentals, listProductStartTimes, listProductionRuns,
    listProviderHealthUsage, listRecipes, listRentalBookings, listRentalPricingProfiles, listRequisitions,
    listResourceCosts, listResourcePackages, listResources, listRetailReturns, listRetailSales, listSegmentMembers,
    listStockCounts, listStockMovements, listStoreRules, listTableReservations, listTransportPassOffers,
    listVendorServiceRequests, lookupAsset, lookupMerchandise, lookupRetailSale, markOrderCollected, mergeTableVisits,
    moveTableVisit, openTableVisit, pauseCampaign, planProductionRun, postStockCount, publishMenu, publishVenueMap,
