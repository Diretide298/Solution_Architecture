# Cross-deployable writes: the kernel grants and the dated exceptions. AUTHORED: a person writes every entry.
#
# DB-ROLES (docs/active/block-a-extra-tasks.json) gives each deployable's PostgreSQL role DML only on the schemas
# its own modules own (handoff/service-decomposition.json, ADR-0055). A write into another deployable's schema made
# with the caller's own SQL is therefore refused at runtime. ADR-0055 rule 4 says how it travels instead: by event
# (ADR-0057, events/) consumed by the owning module, or by a call to the owner's published HTTP operation. The
# operation states its route as `x-ticvai-write-via` in its contract, and tools/derive-lineage.py copies it into
# handoff/api-data-lineage.json as `writeVia` (ADAM CR-002, decided by Chinmay on 12 October 2026, CHG-R6-020).
#
# This file holds the three things that are not routed:
#
#   kernel       the shared-kernel tables every host needs, granted to every deployable role directly. Exactly
#                these five; tools/check-cross-deployable-writes.py fails on any other entry or privilege.
#   exceptions   writes that cannot route yet, each with its reason, the date it was added and the release that
#                removes it. The check fails on an unrouted write that is not here, on an entry here for a write
#                that is not cross-deployable or that is also routed, and on an entry whose removal release has
#                been tagged.
#   reads        a table one deployable's role may SELECT although another deployable owns it, decided by the lead
#                (ADAM CR-196, 21 October 2026, CHG-R9CR-005; ADR-0055 rule 4 and DB-ROLES as amended that day). The
#                owner serves the named queries in process as well, and only these queries may be asked in process
#                across the two deployables (tools/check-cross-module-reads.py XR-ROUTE). tools/derive-ddl.py writes
#                each grant, guarded on the role and the table, into the next forward migration; row-level security
#                still applies to every row. Fields: id (XDR-nnn, never reused), reader (the deployable role),
#                tables, privileges (SELECT only), queries, operations, added, decision_ref, why.
#
#   id               XDW-001, XDW-002, ... never reused
#   operation        the operationId that writes
#   table            the table it writes, <schema>.<table>
#   kind             misplaced-table (the table sits in a schema another deployable owns, and its writer is its real
#                    owner: the lead decides between moving it and a table-level grant) or owner-operation-missing
#                    (the owner publishes no operation to call, and an event would carry personal data)
#   reason           why it cannot route yet, and what removes it
#   added            the date the entry was added
#   removal_release  the release that removes it (r<N>); until then DB-ROLES grants the writer's role DML on this
#                    one table
#
# The readable table for the backend developer is handoff/cross-deployable-writes.md, written by
# `python tools/check-cross-deployable-writes.py --write`.

kernel:
- table: platform.outbox
  privileges: [INSERT]
  why: 'Every host writes the events it emits in the same transaction as the change they report (ADR-0033, ADR-0058).'
- table: platform.scope
  privileges: [SELECT]
  why: 'Every host resolves the caller''s scope and its row-level security reads it (ADR-0005). Read only: a write to
    platform.scope from another deployable is not exempt.'
- table: platform.audit_record
  privileges: [INSERT]
  why: 'Every operation that audits itself appends its audit row in its own transaction (CHG-R6-002).'
- table: platform.idempotency_record
  privileges: [SELECT, INSERT, UPDATE]
  why: 'Every host claims, completes and replays an Idempotency-Key in the transaction of the write it guards.'
- table: platform.outbox_sequence
  privileges: [SELECT, INSERT, UPDATE]
  why: 'Every host allocates the next sequence of the aggregate it changes, in the transaction that writes the outbox
    row (INSERT ... ON CONFLICT DO UPDATE ... RETURNING), so a sequence survives the outbox''s monthly partitions
    leaving (ADAM CR-166, 18 October 2026; CHG-CRA-005; ADR-0057 and ADR-0058 as amended). DB-ROLES grants it to
    commerce, access, operations and workers.'


# The 17 exceptions CR-002 dated for removal at r5 (XDW-001 to XDW-017) were removed on 14 October 2026, in r6, when
# Chinmay asked "Remove them now ?" (CHG-XDW-001 to CHG-XDW-005). CrossRegionService's four records moved from
# platform into sync, its own schema, so their writes no longer cross a deployable (XDW-001 to XDW-011); every other
# write now calls the owner's service operation: sync.rejection through cross-region recordSyncRejection and
# recordSyncRejectionResolution (XDW-013 to XDW-015), platform.dead_letter through tenancy requeueDeadLetter
# (XDW-012), pii.consent_identifier and pii.subject through identity recordConsentIdentifier and
# updateGuestSubjectDetails (XDW-016, XDW-017). Ids are never reused; a new exception takes XDW-018.
exceptions: []

reads:
- id: XDR-001
  reader: commerce
  tables: [access.entitlement, access.scan_event]
  privileges: [SELECT]
  queries: [access#entitlementRecords, access#scanEventRecords]
  operations: [getMediaEntitlements, listDeviceAuditRecords]
  added: '2026-10-21'
  decision_ref: ADAM CR-196, option B, Chinmay, 21 October 2026; listDeviceAuditRecords added by ADAM CR-232, option A,
    Chinmay, 25 October 2026 (CHG-R10TEN-005)
  why: 'orders getMediaEntitlements (commerce) answers from Access''s entitlements on a media code and their scans. The
    service route between deployables (serviceAuth inside a cell) is not built and has no ticket (CR-174), and a call
    on it would run at the tenant root and lose the caller''s scope, so a venue cashier would see every venue''s
    entitlements. Read in process instead, as a plain select on the same tenant database under the caller''s own
    connection, so the tables'' row-level security scopes it. The lead chose in-process reads for the same kind of
    cross-module read in CR-167 (the workers host). Removed when the service route is built, if the lead wants the
    deployables kept apart (CR-196 option A).'
- id: XDR-002
  reader: commerce
  tables: [access.media_encoding_profile]
  privileges: [SELECT]
  queries: [access#mediaEncodingProfileRecords]
  operations: [setChannelFeePayment, addToWishlist, getWishlist]
  added: '2026-10-25'
  decision_ref: ADAM CR-212, option A, Chinmay, 25 October 2026
  why: 'catalogue setChannelFeePayment (commerce) reports mediaProfileMissing for an RFID, NFC or wristband fulfilment
    method the venue has no active media encoding profile for, and the profiles are Access''s. The decision declares
    the read in process, as XDR-001 does for the same reason: the service route between deployables is not built
    (CR-174), and a call on it would run at the tenant root and lose the caller''s scope. A plain select on the same
    tenant database under the caller''s own connection, so the table''s row-level security scopes it.'
- id: XDR-003
  reader: access
  tables: [platform.workstation, catalogue.entitlement_template]
  privileges: [SELECT]
  queries: [tenancy#workstationRecords, catalogue#entitlementTemplateRecords]
  operations: [validateAccess, listMyEntitlements, getEntitlement, lookupTicket, getOfflinePackage,
    validateGroupAccess, listVirtualTicket, setVirtualTicketCredential, listAccessValidityTime,
    publishRuleConflictCheck, listCredentialTransferRebinding, listVirtualCredentialMedia, listOfflineEdge,
    simulateOfflineResilienceTesting, listFamilyChildPod, listFastPassAttraction, listTicketCredentialInvestigation,
    listAccessMonitoring, listAttendanceAdmission, listGuestDwellTime, simulateGuestJourney]
  added: '2026-10-25'
  decision_ref: ADAM CR-240, option A, Chinmay, 25 October 2026
  why: 'getOfflinePackage needs the session''s access point (platform.workstation.access_point_id) and each
    entitlement''s template values (catalogue.entitlement_template.is_reentry_allowed, admission_rules_id), which
    Access does not store. The access host composes TenancyModuleQueries and CatalogueModuleQueries in process, as
    CR-167 lets the workers host (same tenant database, the caller''s transaction and row security). Every other
    Access operation reading the entitlement template asked it by a service route that is not built; it reads in
    process the same way (the sibling sweep). Pinning the template values onto access.entitlement at issue (CR-240
    option C) is a later change and removes the template read from getOfflinePackage.'
- id: XDR-004
  reader: operations
  tables: [platform.venue_settings, platform.region_settings, platform.outlet]
  privileges: [SELECT]
  queries: [tenancy#venueSettingsRecords, tenancy#regionSettingsRecords, tenancy#outletRecords]
  operations: [listProductStartTimes, getFnbServiceChargePolicy, setFnbServiceChargePolicy, buildProductionPlan, releaseProductionPlan,
    resolveBookingConflict, applyMenuActions, listCombos, createCombo, setComboSlots, attachModifierGroup,
    list86Events, markOrderCollected, setServiceStage, transferOrderItems, publishMenu, rollbackMenu,
    listMenuVersions, moveTableVisit, reassignServer, compItem, listProductionRuns, transferTableVisit, requestBill,
    listTableReservations, createTableReservation, updateTableReservation, seatTableReservation, listBookableOutlets,
    listMyTableReservations, getGuestMenu, getFnbDeliveryPolicy, setFnbDeliveryPolicy, listFulfilmentSlots,
    createGuestFnbOrder, getGuestBill, listMenus, createMenu, getMenu, updateMenu, setMenuSections,
    setItemAvailability, setMenuItemDailyCount, listModifierGroups, createModifierGroup, listFnbOrders,
    createFnbOrder, acceptFnbOrder, cancelFnbOrder, getFnbOrder, amendFnbOrder, getTableMap, setTableLayout,
    openTableVisit, getTableVisit, updateTableVisit, mergeTableVisits, getBill, splitBill, closeTableVisit,
    clearTable, listRecipes, setRecipe, recordWaste, escalateCorrectiveAction, getWasteApprovalPolicy,
    setWasteApprovalPolicy, createTableReservationForGuest]
  added: '2026-10-25'
  decision_ref: ADAM CR-234, option A, Chinmay, 25 October 2026
  why: 'F&B runs in operations and answers Money (a table visit''s runningTotal, an order''s amounts, a menu''s prices)
    whose currency and scale are the venue''s frozen trading currency, Tenancy''s data in commerce (naming-and-style
    5.1, ADR-0018). The service route between deployables is not built (CR-174, CR-196), so the build had no allowed
    way to put a currency on the Money it answers. The operations host registers Tenancy''s in-process queries as the
    workers host does (IModuleQueries); the read runs in the caller''s transaction under the caller''s row-level
    security. mergeTableVisits raised it (CR-234); every F&B operation that answers Money reads it the same way.
    platform.outlet and tenancy#outletRecords were added on 26 October 2026 (ADAM CR-260, which the lead answered as
    already decided and carried by r10): a menu reaches its venue only through fnb.menu.outlet_id, so getMenu,
    setMenuItemDailyCount and the other menu operations read the outlet''s venue in process too.
    listProductStartTimes (resources, in operations) reads the venue''s stepMinutes the same way (ADAM CR-253).'
- id: XDR-005
  reader: commerce
  tables: [assets.media_asset]
  privileges: [SELECT]
  queries: [assets#mediaAssetRecords]
  operations: [searchCatalogue, listProducts, getProduct]
  added: '2026-10-25'
  decision_ref: ADAM CR-221, option A; the lead's answer to r10 question 14 (recommended answer accepted), Chinmay, 25 October 2026
  why: 'The guest product reads (catalogue, commerce) answer each ProductMedia''s url and thumbnailUrl, the asset''s
    stable CDN address, and the assets are Assets'' (VenueOps, operations). The service route between deployables is not
    built (CR-174), and a call on it would run at the tenant root and lose the caller''s scope; read in process instead,
    as XDR-001 and XDR-002, a plain select on the same tenant database under the caller''s own connection, so the
    table''s row-level security scopes it.'
- id: XDR-006
  reader: commerce
  tables: [control.api_client]
  privileges: [SELECT]
  queries: [public-api#apiClientRecords]
  operations: [setApprovalExternalProvider]
  added: '2026-10-26'
  decision_ref: ADAM CR-243, option A, Chinmay, 26 October 2026
  why: 'approvals setApprovalExternalProvider (Tenancy, commerce) refuses an apiClientId that is not an active API
    client of the tenant with 422 api-client-not-active, and the API clients are Platform''s (operations), in the
    control database. The service route between deployables is not built (CR-174), so there was no allowed way to
    answer the 422. Commerce reads control.api_client in process over the control connection it already holds for
    routing (#27692, CR-161), served in-process as well as service. The grant is written into the control database''s
    forward migration, not the tenant''s (tools/derive-ddl.py). control.api_client has no row-level security, so the
    asker names the rows it may see (the client''s allowed_tenant_ids holds the caller''s tenant).'
- id: XDR-007
  reader: operations
  tables: [catalogue.variant, catalogue.product, catalogue.product_media, catalogue.price, catalogue.price_assignment,
    catalogue.price_list, catalogue.performance, platform.venue_settings]
  privileges: [SELECT]
  queries: [catalogue#variantsSellableAt, catalogue#variantListingFacts, tenancy#venueSettingsRecords]
  operations: [addToWishlist, getWishlist]
  added: '2026-10-28'
  decision_ref: ADAM CR-270, option A, Chinmay, 28 October 2026 (the narrow read, as for CR-243 and CR-234); getWishlist
    by ADAM CR-273, settled with CR-270 the same day
  why: 'Marketing (operations) asks whether a saved variant is sellable (catalogue#variantsSellableAt, the 404) and what
    its saved row shows (catalogue#variantListingFacts), and the currency of the Money it answers
    (tenancy#venueSettingsRecords); Catalogue and Tenancy are in commerce. Catalogue published neither query over HTTP
    and the service route between deployables is not built (CR-174, CR-241), so neither addToWishlist (#30705) nor
    getWishlist (#30706) could be built. The operations host asks the three in process, through Catalogue''s and
    Tenancy''s own query classes as the workers host does, never through Marketing SQL: a plain select on the same
    tenant database under the caller''s own connection, so every table''s row-level security scopes it and FORCE RLS
    stays on. SELECT only, on exactly the tables the three queries answer over: the variant, its product and the
    product''s primary media, the price-list resolution (price, price_assignment, price_list), the performance, and
    platform.venue_settings, whose inheritance reads the tenant''s own row of the same table and nothing else.'
- id: XDR-008
  reader: operations
  tables: [catalogue.variant, catalogue.product, catalogue.product_media, catalogue.product_category]
  privileges: [SELECT]
  queries: [catalogue#variantRecords, catalogue#productRecords, catalogue#productCategoryRecords]
  operations: [createFnbOrder]
  added: '2026-10-28'
  decision_ref: ADAM CR-277, option A, Chinmay, 28 October 2026 (the narrow read); catalogue.product_media and
    catalogue.product_category added by the lead on 29 October 2026, as the reads touch them
  why: 'createFnbOrder (F&B, operations) routes each line to a kitchen station, and an outlet''s category rules
    (KitchenRoutingRules.categoryRules, matchKind productCategory) match a catalogue product category code: the menu
    item''s catalogue variant (fnb.menu_item.product_variant_id, catalogue#variantRecords), its product
    (catalogue#productRecords, which reads catalogue.product_media for Product.media[] as well) and the product''s
    category (Product.categoryId, catalogue#productCategoryRecords, whose code the rule matches). Catalogue is in
    commerce and the service route between deployables is not built (CR-174, CR-241). The operations host asks the
    three in process, through Catalogue''s own query classes, in the caller''s transaction under the caller''s
    row-level security: SELECT only, on exactly the four tables they touch. The outlet read for paymentTiming is
    XDR-004''s.'
- id: XDR-009
  reader: operations
  tables: [platform.workstation]
  privileges: [SELECT]
  queries: [tenancy#workstationRecords]
  operations: [createFnbOrder]
  added: '2026-10-29'
  decision_ref: ADAM CR-293, option A, Chinmay, 29 October 2026
  why: 'createFnbOrder accepts a till order at its outlet in the same transaction and creates its kitchen tickets there
    (SD-046); an order from anywhere else waits for acceptFnbOrder. The till''s outlet is
    platform.workstation.outlet_id, Tenancy''s data in commerce, and the service route between deployables is not built
    (CR-241), so the build had no allowed way to tell a till at the outlet from one elsewhere. The operations host asks
    tenancy#workstationRecords for the caller''s workstation in process, through Tenancy''s own query classes, under the
    caller''s row-level security. The decision names it as XDR-004 gaining the table; it is recorded as its own entry
    so the outlet and settings grant XDR-004 holds is not edited by two changes at once.'
