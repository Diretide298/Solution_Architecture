# Planned tasks the lead holds: they stay in the plan and the release push keeps their tickets On hold.
#
# Plan input (changes/schema.yaml plan_files; CHG-R8DEC-004): a change here is a change of kind plan. Read by
# tools/op-release.py, which marks each held task and its sub-tasks in the release bundle with the hold's comment;
# tools/op-release.rb then sets a held New ticket On hold, off the board (no assignee, no sprint, as op-retire's
# Deferred), keeps a held On hold one there, never puts a held ticket back to New ("Back in the plan"), and lists a
# started one without touching it. A held task keeps its key and its row in tasks.csv: a pushed key never changes.
# A hold lifts when its keys leave this file: the next release puts the tickets back to New in the plan's sprint.
#
# One hold per decision: reason (the comment the ticket gets), until (what lifts it), decided (who, when, his words,
# a later confirmation, the change entry) and keys (planned tasks only; the comment after each key is its subject and the plan's person).

