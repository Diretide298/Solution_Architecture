  # BC-076, BC-077 and BC-079 (CHG-IDR-001, CHG-IDR-003) are numbered after their ADAM CRs, apart from the BC entries
  # other r6 batches add in parallel, so the branches merge as a union. All three are breaking in declaration only:
  # check-contract-compat compares neither x-ticvai-scope-level nor 4xx codes, so it reports them as matching nothing.
  - id: BC-076
    contract: identity
    operation: createRole
    change: "x-ticvai-scope-level venue -> tenant"
    reason: >-
      ADAM CR-076 (ticket 27764): roles are tenant-wide (Role.code unique per tenant, audit R108) and identity.role /
      identity.role_permission rows are written only at the tenant root, so a venue-scoped createRole could never
      insert. The lead kept role writes at the tenant root and moved createRole to the tenant scope, matching
      setRolePermissions, which was always tenant; venue grants read the roles (CHG-IDR-001). Breaking in
      declaration: a caller holding ROLE_MANAGE only at a venue is now refused.
    approved-by: 'Chinmay Parab, 14 October 2026 (r6 settlement of CR-076: "move createRole and updateRole to scope-level tenant")'
    tag: r6
