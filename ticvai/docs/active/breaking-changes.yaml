# BC-034 to BC-037 are one decision (CHG-R6-030): the ticket media designers take the product permission. The
# ticket-template operations BO-344 binds (listTicketTemplates PRODUCT_VIEW; create, update, clone and import
# PRODUCT_CONFIGURE) and the designers that draw a template's artwork were gated apart, so a product manager could
# create a template and not design it (Vivaticket comparison, 6 October: "the designer is gated on a permission the ops
# don't accept"). Chinmay, 12 October 2026: "Approve (Recommended)". BO-349 (setRfidNfcCard) keeps
# ACCESS_POINT_CONFIGURE: a reader-side chip profile is access configuration.
  - id: BC-034
    contract: access
    operation: getPdfPrintablePos
    change: 'x-ticvai-permission changed "ACCESS_POINT_CONFIGURE" -> "PRODUCT_VIEW"'
