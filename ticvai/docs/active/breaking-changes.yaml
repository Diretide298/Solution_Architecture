# Breaking contract changes after r1, approved. AUTHORED: a person writes every entry; no tool does.
#
# From the release tag `r1` on, tools/check-contract-compat.py compares every contract with its text at
# r1 and labels each change additive or breaking (an operation removed or moved, a field removed, a type
# changed, a new required request field, an enum value removed, a value added to a response enum, or a
# change to an operation's permission, conflict policy, read routing, security or emitted events).
# **A breaking change fails the check unless an entry here approves it.**
#
# A ticket records the release tag it was pulled at, so the producer and the consumers of one operation
# can be building against different tags. A breaking change is only safe when they all move to the same
# tag, so an entry says which tag and which tickets (council of 1 October; plan item 1C).
#
# Every field is required except `change`; an entry missing one approves nothing and fails the check.
#
#   id                BC-001, BC-002, ... never reused
#   contract          the contract's file name without .yaml (orders, marketing-crm, ...)
#   operation         the operationId the change is reported against
#   change            optional: text the reported change must contain (e.g. "is now required"); leave it
#                     out to approve every breaking change to that operation
#   reason            why the change cannot be made additive
#   approved-by       the person who decided, and when
#   tag               the release tag the producer and consumer tickets move to together (r2, ...)
#   producer-tickets  the OpenProject keys of the tickets that build the operation
#   consumer-tickets  the keys of the tickets that call it (screens, other services)
#
# Example:
#
#   - id: BC-001
#     contract: orders
#     operation: checkoutCart
#     change: "request `contactId` is now required"
#     reason: a guest order without a verified contact cannot be refunded (audit R120)
#     approved-by: Chinmay Parab, 12 October 2026
#     tag: r2
#     producer-tickets: [SVC-ORDERS-CHECKOUT-1]
#     consumer-tickets: [APP-POS-SCN-020, APP-WEB-GST-031]

# BC-001 to BC-005 are one decision (CHG-CSP-002): `Session.saleBoardId` is no longer required, so every
# operation that returns a Session reports it. Chinmay, 2 October 2026, door follow-ups: "Make it optional;
# log the breaking change." Only a till session carries a board; a browser or handheld session has none.
changes:
  - id: BC-001
    contract: identity
    operation: login
    change: "`session.saleBoardId` is no longer guaranteed"
    reason: >-
      A browser door (ADM-001, SUP-001, PTR-001) and the staff handheld (EMP-001) sign in with no workstation
      since CHG-DOOR-001, and the board is derived from the workstation, so a required saleBoardId forced the
      server to invent one. Only a till session carries it (CHG-CSP-002).
    approved-by: Chinmay Parab, 2 October 2026 (door follow-ups)
    tag: r2
    producer-tickets: [SVC-IDENTITY-IDENTITY-2]
    consumer-tickets: [APP-POS-POS-000, APP-STAFF-EMP-001, APP-SCANNER-SCN-001, APP-CONSOLE-ADM-001,
                       APP-PARTNER-PTR-001, APP-SUPPORT-SUP-001]
  - id: BC-002
    contract: identity
    operation: selectRole
    change: "`saleBoardId` is no longer guaranteed"
    reason: As BC-001; the role prompt returns the same Session (CHG-CSP-002).
    approved-by: Chinmay Parab, 2 October 2026 (door follow-ups)
    tag: r2
    producer-tickets: [SVC-IDENTITY-IDENTITY-3]
    consumer-tickets: [APP-POS-POS-000, APP-POS-POS-001, APP-STAFF-EMP-002, APP-SCANNER-SCN-001,
                       APP-CONSOLE-ADM-001, APP-PARTNER-PTR-001, APP-SUPPORT-SUP-001]
  - id: BC-003
    contract: identity
    operation: getCurrentSession
    change: "`saleBoardId` is no longer guaranteed"
    reason: As BC-001; a session read back from a browser or a handheld has no board (CHG-CSP-002).
    approved-by: Chinmay Parab, 2 October 2026 (door follow-ups)
    tag: r2
    producer-tickets: [SVC-IDENTITY-IDENTITY-1]
    consumer-tickets: [APP-POS-POS-000, APP-STAFF-EMP-001, APP-STAFF-EMP-002, APP-STAFF-EMP-042,
                       APP-SCANNER-SCN-001, APP-CONSOLE-ADM-001, APP-PARTNER-PTR-001, APP-SUPPORT-SUP-001]
  - id: BC-004
    contract: identity
    operation: completeSsoAuthorization
    change: "`session.saleBoardId` is no longer guaranteed"
    reason: As BC-001; SSO is offered only on browser doors and the staff handheld, none of which has a till
      (CHG-DOOR-002, CHG-CSP-002).
    approved-by: Chinmay Parab, 2 October 2026 (door follow-ups)
    tag: r2
    producer-tickets: [SVC-IDENTITY-IDENTITY]
    consumer-tickets: [APP-STAFF-EMP-001, APP-CONSOLE-ADM-001, APP-PARTNER-PTR-001, APP-SUPPORT-SUP-001]
  - id: BC-005
    contract: identity
    operation: verifyMfaChallenge
    change: "`session.saleBoardId` is no longer guaranteed"
    reason: As BC-001; the second factor completes the same sign-in and returns the same Session (CHG-CSP-002).
    approved-by: Chinmay Parab, 2 October 2026 (door follow-ups)
    tag: r2
    producer-tickets: [SVC-IDENTITY-MFA-2]
    consumer-tickets: [APP-POS-POS-000, APP-STAFF-EMP-001, APP-SCANNER-SCN-001, APP-CONSOLE-ADM-001,
                       APP-PARTNER-PTR-001, APP-SUPPORT-SUP-001, APP-SETUP-BO-053]

# BC-006 and BC-007 are one decision (CHG-FUP-004): publishing a module's AI moves from `AI_APPROVE` to that
# module's `<MODULE>_AI_PUBLISH`. Chinmay, 2 October 2026, workbook Q3 and Q7 (DEC-003, DEC-007) and the contract
# follow-ups: "per-module AI publish (replacing AI_APPROVE for model publishing)". No ticket has started (Block A
# starts Monday 5 October), so producer and consumers move to r2 together before anything is built at r1.
  - id: BC-006
    contract: ai
    operation: publishForecastVersion
    reason: >-
      Who publishes a forecast is the holder of that module's AI publish permission, with no default role
      (DEC-003). A permission that depends on the forecast's module cannot be expressed by keeping AI_APPROVE;
      the base permission becomes AI_USE (the forecast reads) and the module permission is declared in
      x-ticvai-permission-by-module (CHG-FUP-004).
    approved-by: Chinmay Parab, 2 October 2026 (contract follow-ups; workbook Q3)
    tag: r2
    producer-tickets: [SVC-AI-FORECAST-2]
    consumer-tickets: [APP-SETUP-ADM-508]
  - id: BC-007
    contract: ai
    operation: promoteAiRelease
    reason: >-
      AI release promotion goes to whoever holds the module's "Publish AI model" permission (DEC-007). As BC-006:
      the base permission becomes AI_USE and the release's module permission is declared in
      x-ticvai-permission-by-module; a platform release still needs PLATFORM_AI_MANAGE (CHG-FUP-004).
    approved-by: Chinmay Parab, 2 October 2026 (contract follow-ups; workbook Q7)
    tag: r2
    producer-tickets: [SVC-AI-MODELS-1]
    consumer-tickets: [APP-SETUP-ADM-554]

