    reason: >-
      As BC-076 (ADAM CR-076; CHG-IDR-001): updateRole writes identity.role, a tenant-root row, so it is called at the
      tenant scope like createRole and setRolePermissions.
    approved-by: 'Chinmay Parab, 14 October 2026 (r6 settlement of CR-076)'
    tag: r6
