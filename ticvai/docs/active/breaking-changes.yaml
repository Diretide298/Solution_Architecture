    change: "`permission` is now nullable"
    reason: 'ADAM CR-158, option A (published answer of 18 October 2026; CHG-CRA-002): a grant names exactly one of a
      permission or a role, so DelegatedAccess.permission is null on a role grant. A response field that was never null
      becomes nullable, which a strict client can reject. **check-contract-compat cannot see this change**: it does not
      compare nullability, so this entry matches nothing it reports (it prints a NOTE) and approves nothing else on the
      four operations; it is the record of the lead''s approval. CreateGrantRequest requires one of permission and
      roleId (relaxing the request is additive).'
