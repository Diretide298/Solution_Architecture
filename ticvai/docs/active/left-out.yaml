# The left-out list: everything a release leaves out or defers, in one place.
#
# **The rule** (the council of 20 October 2026, night; accepted by the lead, Chinmay): an item left out of a release
# or deferred exists only once it is on this one list, with where it came from, why, and the release it is targeted
# at. A deferral written only in a report, a ledger or a change notice does not count. Settled items that become
# developer work still go to OpenProject as tickets; this list is what is still left out.
#
# This file is the package's copy of that list, in git, so a check can read it (CHG-R9UI-003). tools/check-state-views.py
# reads its `design-gap` items: a client-verified screen's state with no view (screens/_state-patterns.yaml, written into
# the screen as wireframe.stateViews) must be named here by platform and state, or the check fails. A design gap is
# never filled with an invented look.
#
# **The r9 design gaps were drawn, not left out** (CHG-R9UI-005; the lead, 21 October 2026: "290 of them were ingested
# and never built we need to built them for r9"). The 290 states of P01, P02 and P04 that the approved prototypes never
# drew (LO-R9UI-001 to -020 when this list was made) are drawn by the package in each app's approved look
# (wireframes/states/, tools/draw-state-frames.py) and left this list; showing them to the client is LO-R9UI-025.
# LO-R9UI-021 to -024 stay: those apps have no client-approved design at all, so their look is the app shells' to
# carry on the shared tokens until the client approves one (CHG-R9UI-001).
#
# Fields: id (LO-<batch>-<nnn>), kind (design-gap, or deferred for any other left-out item), platform, states
# (the state names it covers, for a design gap), screens (the client-verified screens that have the state), what,
# source (where it was found), reason (why it is left out), target (the release or event it waits for), owner,
# added (date), change (the change entry that added it).
version: 1

