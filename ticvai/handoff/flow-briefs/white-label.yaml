  # ---------------------------------------------------------------------------------------------------------------
  F103:
    title: A tenant claims a domain and gets a certificate
    process: white-label
    trigger: >-
      A tenant wants their storefront on their own hostname (tickets.venue.com) rather than the platform subdomain every
      tenant already has (venue.<cell>.ticvai.app). Also covers the guest web app (CMS-017 coverage check, answers line 87).
    actors:
    - {role: 'Tenant admin (TENANT_CONFIGURE)', app: 'P13 CMS-017'}
    - {role: 'Tenant IT at their DNS provider (outside TICVAI)', app: 'their DNS console'}
    - {role: 'Platform job (verification, certificate issuance and revalidation)', app: 'background'}
    - {role: 'Platform support under a staff grant', app: 'P09 ADM-017'}
    inputs:
    - name: Hostname
      formats: ['fully qualified host, lowercase, no scheme, no path (tickets.coastalaqua.ae)']
      limits: 'One primary per kind; apex only on request; no path proxy'
      validation:
      - {rule: 'Scheme, path, uppercase or not a FQDN', message: '"Enter a hostname like tickets.venue.com, without https:// or a path."'}
      - {rule: 'Already held by another tenant (409)', message: '"This domain is not available." (never says who)'}
      - {rule: 'Not permitted at this scope', message: 'Refused at step 1, permission named'}
      source: 'Tenant admin, CMS-017 formClaimCustomDomain'
    - name: Kind
      formats: ['guestWeb | guestApp (app links) | partnerPortal | developerPortal']
      limits: ["one of the four kinds (CMS-017 design note) (derived)"]
      validation: ["hostname already routed to another tenant at verify -> 409 hostname-taken: \"This domain is in use elsewhere. Contact support.\" (CMS-017 edge case) (derived)"]
      source: CMS-017
    - name: Routing / verification method
      formats: ['routing: cname (default, CNAME to Front Door, validated by TXT _dnsauth, managed certificate) | delegatedSubdomain (NS) | apex (on request)', 'verificationMethod enum dnsTxt (default) | cname | httpFile']
      limits: 'A validation window; on timeout the token must be regenerated'
      validation:
      - {rule: 'Records not published within the window (revalidation timedOut)', message: '"We could not see your records in time. Get a new record and publish it again."'}
      source: CMS-017
    - name: DNS records published by the tenant
      formats: ['TXT _dnsauth.<host> = token', 'CNAME <host> -> Front Door endpoint', 'CAA / NS where they apply']
      limits: 'DNS propagation can take hours'
      validation:
      - {rule: 'Record missing or wrong (dnsRecords[].status missing|wrong)', message: 'Row shows expected value vs observed value: "Expected X, found Y."'}
      - {rule: 'CAA forbids the certificate authority', message: 'CAA row flagged with the value to add'}
      source: 'Tenant IT, at their DNS provider'
    processing:
    - {does: 'Show the always-live platform subdomain and the claimed domains', ops: ['white-label#getPlatformSubdomain', 'white-label#listCustomDomains']}
    - {does: 'Claim: returns verificationRecord and every dnsRecord to publish', ops: ['white-label#claimCustomDomain']}
    - {does: 'Verify by a retrying job (button only triggers an early check); routes the hostname (tenancy#setTenantDomainMapping) and Front Door issues the managed certificate', ops: ['white-label#verifyCustomDomain']}
    - {does: 'Make primary per kind; others and the platform subdomain redirect to it', ops: ['white-label#setPrimaryDomain']}
    - {does: 'New token after time-out or revalidation', ops: ['white-label#regenerateDomainToken']}
    - {does: 'Release; unroutes at once; takeover warning', ops: ['white-label#relinquishCustomDomain']}
    outputs:
    - name: Default address panel
      states: {ready: '"Your site is at aquaventure.ae.ticvai.app" (wildcard certificate), Primary while no custom domain is'}
      failure_branches: []
    - name: Domain row and records table
      states: {emptyFirstRun: 'No custom domain yet + Claim custom domain', pending: 'Records to publish with copy buttons', verifying: 'Last checked <time>; "DNS can take hours"', verified: 'Records ok', issuing: 'Issuing certificate', active: 'Active; certificate expiry date, amber within 30 days', failed: 'failureReason', expired: 'Expired', revoked: 'Revoked', pendingRevalidation: 'Still serving; waiting shown beside status', timedOut: 'Get a new record', cnameLost: 'Takeover/lost-routing warning naming the record to restore or remove'}
      failure_branches:
      - {what: 'Hostname routed to another tenant at verify (409 hostname-taken)', user_sees: '"This domain is in use elsewhere. Contact support."', recover: 'Platform support on ADM-017 under a grant'}
      - {what: 'Certificate renewal fails (e.g. weekend)', user_sees: 'Failed with reason and expiry countdown', recover: 'Job retries; fix the named record'}
      - {what: 'CNAME no longer points at TICVAI while active', user_sees: 'cnameLost flag: guests on that host no longer reach the storefront', recover: 'Restore the record'}
    - name: Readiness checklist per domain
      states: {ready: 'UAE Pass redirect registered / Apple Pay merchant domain verified / app links served (AASA, assetlinks) each ok or pending'}
      failure_branches:
      - {what: 'Readiness item pending', user_sees: 'Item pending with what it blocks (sign-in with UAE Pass, Apple Pay, app links)', recover: 'Wait for the job or contact support'}
    - name: Release confirmation
      states: {confirm: 'Takeover warning: "Remove the CNAME and the TXT record from your DNS"', refused: '409 only active domain for a live app, naming what would break', released: '204, unrouted'}
      failure_branches:
      - {what: 'CNAME left in place after release', user_sees: 'cnameLost on the released host until removed', recover: 'Remove the record'}
    steps:
    - {frame: 1, screen: CMS-017, sees: 'Default address panel; empty custom-domain list; Claim custom domain', does: 'Claims tickets.coastalaqua.ae, kind Guest website, routing CNAME', op: 'white-label#getPlatformSubdomain, white-label#listCustomDomains, white-label#claimCustomDomain', result: '201 with records: TXT _dnsauth and CNAME to Front Door, each with copy buttons'}
    - {frame: 2, screen: CMS-017, sees: 'Records table expected vs observed, status Verifying, last checked', does: 'Publishes the records at the DNS provider; optionally Check now', op: 'white-label#verifyCustomDomain, white-label#listCustomDomains', result: 'Verified -> Issuing certificate -> Active (job-driven)'}
    - {frame: 3, screen: CMS-017, sees: 'Active domain with certificate expiry, readiness checklist (UAE Pass, Apple Pay, app links), Make primary', does: 'Makes it primary (confirmSetPrimaryDomain)', op: 'white-label#setPrimaryDomain, white-label#listCustomDomains', result: 'Primary; the platform subdomain redirects to it'}
    - {frame: 3b, screen: CMS-017, variant: 'timed out', sees: 'revalidation timedOut, the record never observed highlighted', does: 'Get a new record (confirmRegenerateDomainToken)', op: 'white-label#regenerateDomainToken', result: 'New token, window restarts; old token stops validating'}
    - {frame: 4, screen: CMS-017, sees: 'Release confirmation with the takeover warning', does: 'Releases a domain no longer used', op: 'white-label#relinquishCustomDomain', result: '204 released, or 409 naming what would break'}
    motion:
    - {what: 'Status progression', how: 'Stepper Pending -> Verifying -> Verified -> Issuing -> Active advances as the job reports; spinner on the current step with "last checked" relative time ticking'}
    - {what: 'Record rows', how: 'Row status chip flips missing -> ok when observed; copy button confirms with a check for 1.5 s'}
    - {what: 'Certificate expiry', how: 'Amber countdown within 30 days'}
    decisions: [DEC-547 (subdomain plus CNAME, TXT _dnsauth, Front Door managed certificate, delegated subdomain option, apex on request, no path proxy, DNS records list, revalidation, takeover warning, readiness), CHG-CSA-043, CHG-SOT-006, CHG-WIR-015, 'answers-2-oct-batch1.md lines 64, 87, 135']
    sources: [flows/F103, 'handoff/design-notes/white-label.yaml#CMS-017,ADM-017', 'contracts/satellite/white-label.yaml#/components/schemas/CustomDomain', SD-021, DI-283, R096, ADR-0002]
    open:
    - {q: 'verificationMethod (dnsTxt|cname|httpFile) vs routing (cname|delegatedSubdomain|apex): the design note shows a method picker, DEC-547 makes TXT _dnsauth + CNAME the default', default: 'Show routing as the choice (CNAME default, delegated subdomain option, apex "on request"); hide verificationMethod behind Advanced.'}
    - {q: 'Validation window length and job retry interval', default: '7 days window; re-check every 15 min for the first hour, then hourly.'}
    - {q: 'How apex "on request" is requested', default: 'A link "Need the bare domain? Contact support" (no self-serve).'}
