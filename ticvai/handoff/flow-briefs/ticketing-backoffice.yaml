# Flow design briefs: ticketing-backoffice (Ticketing & Guest Commerce on Venue Management P08 and the
# TICVAI Console P09). Block A flows only. Written 3 October 2026 for the Claude Design storyboards and
# wireframes (TODO step 9b), from the shared brief audit/ticvai/apply/FLOW-BRIEF-BRIEF.md.
#
# Read with: flows/F*.yaml (the flow), screens/P08 and P09 (the screen), handoff/design-notes/
# ticketing-backoffice.yaml (rules PR-1 to PR-10 and per-screen notes), the contracts named in each
# `processing` entry. Where this file and a contract disagree, the contract wins and the gap is under `open`.
#
# Scope rule used. A flow is in scope when its trigger belongs to ticketing-backoffice (its entry screen,
# or its first step's screen, is a ticketing-backoffice screen in the design notes) AND at least one of its
# steps is on a Block A screen (a `screen` build under BLOCK-A in handoff/service-docs/op-release.json).
# Steps on screens that are not Block A are kept in the storyboard where the flow passes through them, and
# are marked `blockA: false` so Claude Design draws them as context frames only.
process: ticketing-backoffice
written: 2026-10-03
writtenBy: flow-brief agent (Claude) for ticketing-guest and ticketing-backoffice
coverage:
  covered: ["F09", "F26", "F77", "F86", "F89", "F90", "F156", "F169", "F234", "F240", "F257", "F260", "F270"]
