        listApprovalRequests, decideApprovalRequest; F155 evaluatePromotions; F174
        createUpgradeCredentialRegeneration, listBulkGroupAssisted, listPersonTypeProduct). Those operations
        are drawn on the Block A screen that owns them (BO-010, BO-023, POS-002 and the guest checkout), which
        the covered briefs carry. Lead can override by asking for them.
    - flows: [F126, F136, F143, F144, F146, F147, F148, F149, F152, F153, F157, F158, F159, F160, F161, F162,
              F163, F166, F167, F171, F172, F173, F189, F192, F235, F236, F237, F238, F239, F241, F242, F256,
              F258, F259, F261, F263, F274, F275, F276, F277, F278, F279, F280, F281, F282, F283, F284, F285,
              F287, F288, F289, F290, F291, F292, F293, F294, F295, F296, F297, F298, F299, F300, F301]
      reason: No step touches a Block A screen or a Block A operation.
  ownershipNotes:
    - F145, F246, F247 pass through ticketing-backoffice screens but their entry screens belong to finance-insights and customer-marketing; left to those processes.
    - F26 ends on the guest app (GST-021); its trigger (a venue maps its site on BO-092) is back office, so it is here and not in ticketing-guest.

flows:

  F09:
    title: Event is cancelled and refunded
    process: ticketing-backoffice
    trigger: >-
      A performance is cancelled (weather, a technical failure, an artist). Every ticket sold for it needs
      handling, and guests must be told before they travel. Entry points: duty manager cancels; automatic on a
      safety closure; promoter withdraws. Entry screen BO-015.
    actors:
      - {role: "venueManager (duty manager)", app: "P08 Venue Management (venue-management-web)", screens: ["BO-015", "BO-023"]}
      - {role: "supervisor", app: "P08", does: "enters the supervisor PIN on the device for the real cancellation run"}
      - {role: "financeController", app: "P08", does: "second approver when the refund is above the venue threshold (CF-36)"}
      - {role: "guest", app: "P01 Guest Web / P02 Guest App", does: "receives the cancellation notice and the refund"}
    inputs:
      - name: performance to cancel
        formats: ["selection on the BO-015 calendar (day, week, month, agenda views)"]
        limits: one performance per cancellation run
        validation: A performance that has already happened offers the next performance of the same event instead.
        source: venue manager, BO-015
      - name: cancellation form (confirmCancelPerformance)
        formats: ["reason text", "guest message text", "refund percentage", "alternative performance (picker)"]
        limits: reason 3 to 1000 characters (required); refundPercentage 0 to 100; credential up to 512 characters (required)
        validation: >-
          Dry run first: shows affected orders, guests and refund exposure before anything changes. The real run
          needs a supervisor PIN on the device (the `credential` field). Reason under 3 characters is refused.
        source: venue manager on BO-015, PIN by supervisor
      - name: bulk refund (formCreateBulkRefund, "Refund every order")
        formats: ["scope (this performance)", "percentage", "reason"]
        limits: percentage 0 to 100; reason 3 to 500 characters (required)
        validation: >-
          Amount proposed from the venue refund policy (getRefundPolicy). Above the venue's approval threshold the
          refund is submitted for approval (status pendingApproval) and names the approver; above the "second user
          above" threshold a second user signs in inline.
        source: venue manager on BO-023
    processing:
      - {input: "performance to cancel", does: "lists performances with sold of capacity", operation: "catalogue#listPerformances"}
      - {input: "cancellation form", does: "stops sales at once, cancels the performance and returns sold seats to available; posts to the current fiscal period with a reference when the original period is closed", operation: "catalogue#cancelPerformance"}
      - {input: "performance id", does: "counts orders, money and cross-venue redemptions exposed; reads the refund bands", operation: ["orders#listOrders", "orders#getRefundPolicy"]}
      - {input: "bulk refund", does: "queues a refund for every order against the original payment method (async, 202): pendingApproval, processing, completed, failed", operation: "orders#createBulkRefund"}
    outputs:
      - name: cancelled performance on the calendar
        states: {loading: "calendar skeleton", ready: "slot shows Cancelled with the reason and the sold count frozen", error: "names the read that failed and keeps the calendar", emptyNoAccess: "permission named (PERFORMANCE_CONFIGURE), never an empty calendar"}
        failure_branches:
          - {what: "performance is part of a bundle", sees: "only the bundle component is cancelled; the rest of the bundle stands (ticket lost, not the evening)", recover: "Finance handles component refund"}
          - {what: "fiscal period closed over the original sale", sees: "refund posts to the current period with a reference", recover: "automatic"}
      - name: refund exposure summary
        states: {loading: "counting", ready: "orders, money (AED), guests, and how many redeem at other venues", partial: "cross-cell counts pending when another cell is unreachable"}
        failure_branches:
          - {what: "refund exceeds the manager threshold", sees: "second approver required (finance controller)", recover: "approval in the approvals inbox"}
      - name: bulk refund job
        states: {pendingApproval: "awaiting the named approver", processing: "progress count of orders refunded", completed: "all refunded", failed: "list of failed refunds"}
        failure_branches:
          - {what: "original payment method no longer valid (card expired, account closed)", sees: "those refunds fall to a manual queue", recover: "Finance refunds by another tender"}
          - {what: "some tickets already scanned (show abandoned at the interval)", sees: "flow escalates: partial-performance policy is a decision, not a rule", recover: "venue manager decides the split"}
          - {what: "entitlement redeemable at another venue", sees: "revoke pending in the other cell", recover: "platform admin when the cell is reachable"}
      - name: guest notification confirmation
        states: {ready: "confirmation that guests were told", empty: "no read exists yet (see open)"}
        failure_branches:
          - {what: "guest has no contact details (anonymous counter sale)", sees: "nothing to notify", recover: "venue signage only"}
    steps:
      - {frame: 1, screen: "BO-015", blockA: true, sees: "calendar of performances, each slot a fill bar sold/capacity and its status", does: "finds the performance", operation: "catalogue#listPerformances", result: "what is sold and what it is worth"}
      - {frame: 2, screen: "BO-015", blockA: true, sees: "Cancel performance dialog: reason, guest message, refund %, alternative performance; Dry run", does: "runs the dry run", operation: "none (dry run)", result: "affected orders, guests, refund exposure"}
      - {frame: 3, screen: "BO-015", blockA: true, sees: "dry-run figures and a supervisor PIN field", does: "supervisor enters PIN and confirms", operation: "catalogue#cancelPerformance", result: "sales stop immediately; slot shows Cancelled"}
      - {frame: 4, screen: "BO-023", blockA: true, sees: "refund exposure (orders, AED, cross-venue count) and the policy band applied", does: "reviews", operation: "orders#listOrders, orders#getRefundPolicy", result: "exposure understood"}
      - {frame: 5, screen: "BO-023", blockA: true, sees: "Refund every order dialog: percentage, reason; approver named if above threshold", does: "authorises the bulk refund", operation: "orders#createBulkRefund", result: "refunds queued against the original payment methods (pendingApproval or processing)"}
      - {frame: 6, screen: "BO-023", blockA: true, sees: "job progress and the manual queue of failed refunds", does: "confirms guests were notified", operation: "none (no dispatch read exists, CHG-WIR-004)", result: "told before they travel"}
    motion:
      - Bulk refund progress counter (orders refunded of total) while the job is processing; poll, no animation beyond the count and a progress bar.
      - Calendar slot changes to Cancelled in place after the call returns (no page reload).
    decisions: ["CHG-WIR-001 (steps repointed from queue screens to BO-015 and BO-023)", "CHG-WIR-004 (no dispatch read yet)", "CF-36 (refund approval threshold at venue level)", "DI-995 (preview before creating slots on BO-015)"]
    sources: ["flows/F09-*.yaml", "screens/P08-venue-back-office.yaml#BO-015 and BO-023", "design-notes ticketing-backoffice BO-015 and BO-023", "contracts/spine/catalogue.yaml#cancelPerformance", "contracts/spine/orders.yaml#createBulkRefund"]
    open:
      - {question: "Which operation sends and lists the transactional cancellation notice?", default: "Frame 6 shows a static confirmation line 'Guests with contact details will be emailed and sent an SMS' and no list; contract gap CHG-WIR-004 stays open."}
      - {question: "Exact error copy for a dry run with no affected orders or a PIN refused", default: "'No tickets were sold for this performance; cancelling stops sales only.' and 'Supervisor PIN not recognised. Try again.'"}
      - {question: "Partial performance (some tickets scanned) refund split", default: "escalate; frame shows 'Referred for a policy decision' with the scanned count"}

  F26:
    title: A venue maps its site
    process: ticketing-backoffice
    trigger: A venue is opening, or has rebuilt an area. Somebody has a drawing and needs guests to be able to find
      a toilet. Entry screen BO-092.
    actors:
    - role: venueManager (map author)
      app: P08 Venue Management
      screens:
      - BO-092
      - BO-093
      - BO-094
      permissions:
      - VENUE_MAP_MANAGE
      - VENUE_MAP_PUBLISH
      - ASSET_LIBRARY_MANAGE for uploads
    - role: AI labelling assistant
      app: server (ai contract)
      does: proposes what each extracted shape is
    - role: guest
      app: P02 Guest App
      screens:
      - GST-021
    inputs:
    - name: new map record
      formats:
      - 'form: name'
      - kind (park, floor, zone, parking)
      - floor level
      limits: id, status and scope are the server's and are not shown; anchors 2 to 4 points
      validation:
      - Only name, kind and floor level are asked. A park map and a building floor are separate maps, never layers
        of one.
      - Only name, kind and floor level are asked; id, status and scope are the server's. The upload happens next
        on BO-093.
      source:
      - map author, BO-092 (formCreateVenueMap)
      - venueManager on BO-092 Venue Maps
      also_named:
      - new map
      ref: contracts/satellite/venue-map.yaml#createVenueMap | F26 step 1
    - name: the plan (drawing)
      formats:
      - DWG or DXF preferred (native CAD, layer names kept)
      - 'PDF: a vector PDF is read by its layer names; a scanned PDF goes through the OCR step (r1, answers L435)'
      - SVG
      - 'PNG/JPG, including a plan with hand-marked paths: the AI proposes the path network from the marks and each
        segment is accepted or rejected one at a time (r1, answers L435)'
      - DXF (format dwgPlan / dxfPlan)
      limits:
      - format enum pdfPlan, svgPlan, dwgPlan, dxfPlan, rasterPlan; uploaded first through assets#createUpload / completeUpload
        (signed URL, maxSizeBytes returned by the server); passed as sourceRef
      - one file per map (park, floor, zone, parking)
      - layers named by role (venue-map-input-spec §2); each role accepts a list of layer names
      - 'size: not set in the contract (see open)'
      validation:
      - 'Layers matched by role, case-insensitive, VC- prefix ignored (Paths/Walkways/Circulation/Footpath; Water/Planting/BackOfHouse/Plant
        keep-out; Steps/VC-Steps/Stairs; Buildings; Seats; Accessible; Sections; Stage; Exits; EmergencyExits/FireExits;
        VC-Resources/Cabanas/Loungers/Tables). Each role takes a list. Outcomes: parsed, parsedWithFindings, nothingFound,
        noLayersMatched, unreadable. A file that yields no shapes says "nothing found" with the layers it did see,
        never an empty success. rasterOnly is a warning, not an error. Findings include duplicateLayerName, geometryOnLayerZero,
        unmappedLayer, mixedLayerContent, sectionCodeMismatch, digitScriptMismatch.'
      - 'File yields no shapes → outcome nothingFound: "We read the file and found no shapes. Check it is the plan,
        not a cover sheet."'
      - 'No layer matched any role → noLayersMatched: "None of the layer names matched. Map them below." with every
        decoded layer listed (layersFound)'
      - 'Findings by code, each with severity error/warning/info: duplicateLayerName, geometryOnLayerZero, unmappedLayer,
        mixedLayerContent, exitLayerNotSplit, layerNameUndecodable, noGeoreference (warning)'
      - Native CAD (DWG, DXF) preferred because PDF loses layer names; PDF and raster accepted with a note that results
        will be weaker.
      source:
      - venue drawing office via the map author, BO-093
      - Venue manager / drawing office, uploaded on BO-093 through assets.createUpload → completeUpload, then importVenueGeometry(sourceRef)
      - venueManager on BO-093 Map Import & Labelling
      also_named:
      - Site plan, native CAD
      - import file
      ref: contracts/satellite/venue-map.yaml#importVenueGeometry | DI-145
    - name: seating manifest
      formats:
      - XLSX
      - one sheet per section
      - header on row 3
      - columns Description / Section / Row / Seat
      - 'XLSX, one sheet per section, header on row 3: Description, Section, Row, Seat'
      limits:
      - Description one of Seating, Wheelchair, Companion, Restricted view, House seat (others import as plain seat
        and are reported)
      - Section must match the drawing character for character after digit normalisation
      validation:
      - Section must match the drawing's section label character for character after digit normalisation (A١ = A1).
      - sectionCodeMismatch, digitScriptMismatch, mergedCells, totalRowDetected, manifestSectionMissingFromPlan, planSectionMissingFromManifest
      - manifestRowsJoined shown against manifestRowsRead ("396 read, 220 joined")
      source:
      - venue, BO-093 (manifestRef)
      - Venue on BO-093 (manifestRef)
    - name: resource manifest (cabanas, loungers, tables)
      formats:
      - XLSX
      - one sheet
      - header on row 3
      - columns Label / Kind / Zone / Capacity / Price band
      - 'XLSX, one sheet, header on row 3: Label, Kind, Zone, Capacity, Price band'
      limits:
      - Kind cabana, lounger, table, pitch, other; capacity 1 to 500; label up to 40 characters in Western digits
      - 'Kind: cabana, lounger, table, pitch …; Price band must name a band in priceBands'
      validation:
      - 'Findings: resourceLabelMissing, resourceLabelDuplicate, resourceManifestMissingFromPlan, resourcePlanMissingFromManifest,
        resourceCodeUnmatched, resourcePriceBandUnknown'
      - resourcesFound vs resourceRowsJoined shown ("38 on the plan, 36 joined")
      source:
      - venue, BO-093 (resourceManifestRef)
      - Venue on BO-093 (resourceManifestRef)
    - name: georeference points
      formats:
      - two rows (drawing X, drawing Y, latitude, longitude)
      - '2-4 anchors: drawing X/Y with latitude/longitude'
      limits:
      - anchors 2 to 4; pick two points far apart
      - anchors far apart (entrance and a far corner)
      validation:
      - Without them the map is a picture (no "you are here"); the map is still accepted.
      - 'Missing → noGeoreference (warning): "No georeference: guests will not see their own position."'
      - 'Two anchors close together: flagged'
      source:
      - venue, BO-093
      - Venue on BO-093
    - name: illustrated base map
      formats:
      - PNG or JPG plus source if available
      - PNG or JPG, plus four alignment points (pixel ↔ plan)
      limits:
      - up to about 12,000 px wide; the platform tiles it; four alignment points between illustration and plan
      - 12,000 px wide is fine; the platform tiles it
      validation:
      - Without alignment points a placed toilet can land in a lake; a guidance panel shows the placeholder recommendation
        (DEC-103).
      - Without alignment points a plan-placed point can land off the illustration
      source:
      - venue design agency, BO-093
      - Venue (spec §6); screen for it not identified (see open)
      also_named:
      - Illustrated map
    - name: 3D venue model and navigation file (ADR-0069)
      formats:
      - GLB (binary glTF 2.0)
      - plus a JSON pathway/location metadata file
      - GLB (binary glTF 2.0), metres, +Y up, Draco or meshopt geometry, KTX2 textures, zones as named nodes with
        __LOD0/1/2 meshes
      - 'navigation JSON (formatVersion 1.0): anchor (originLat, originLng, headingDegrees, scale, 2-8 controlPoints),
        nodes, edges (polyline, isStepFree, isIndoor, throughAccessPointCode), locations (ref, kind, name, nodeId,
        catalogue codes)'
      - one per venue map
      limits:
      - ≤ 25 MB compressed per map (a zone ≤ 6 MB), over 40 MB refused at import; ≤ 300,000 triangles at LOD0, ≤ 1.5
        million across LODs; ≤ 150 draw calls; textures ≤ 2048 px, ≤ 128 MB after KTX2
      - GLB ≤ 25 MB per map (zone ≤ 6 MB); over 40 MB refused at import
      - ≤ 300k triangles on screen at LOD0, ≤ 1.5 M park-wide; ≤ 150 draw calls; textures ≤ 2048 px, ≤ 128 MB after
        transcoding
      - node id pattern ^[A-Za-z0-9_-]{1,64}$; edges ≥ 1; nodes ≥ 2
      validation:
      - The import measures the budget and reports an over-budget file as a finding with the number. No embedded cameras,
        lights or animations are relied on.
      - Uncompressed textures refused at import
      - Over-budget file is a finding naming the number (triangles, draw calls, texture size)
      - 'Anchor residual > 3 m at a control point: warning; > 10 m: the 3D layer will not publish (2D still publishes)'
      - 'Unresolved productCode/outletCode/facilityCode: import finding, never a silent drop'
      - 'Two control points close together: flagged'
      source: venue or a commissioned 3D studio; uploaded on BO-093 in its own "3D model + navigation file" slot (.glb
        plus the pathway .json), supported in r1 (answers L435)
      also_named:
      - 3D venue model + navigation file (ADR-0069)
    - name: label decisions
      formats:
      - per proposal Accept / Edit (move point or change kind) / Reject; bulk "accept all above 90%"
      limits: bulk selection still lists what it accepts
      validation:
      - Low-confidence proposals are shown, not filtered. emergencyExit is its own kind, never merged with exit.
      - Per proposal Accept, Edit (move the point or change the kind) or Reject; never all-or-nothing, though "accept
        all above 90%" is allowed as a bulk selection that still lists what it accepts.
      source:
      - map author, BO-093 (formAcceptVenueLabelProposals)
      - venueManager on BO-093 Map Import & Labelling
      also_named:
      - decisions
      ref: contracts/satellite/venue-map.yaml#acceptVenueLabelProposals | R275
    - name: points and placed resources
      formats:
      - point form (kind, name EN/AR, link, isStepFree, media up to 12, typical duration 1-600 min, interest tags
        up to 12); place form (label, kind, zone up to 80 chars, capacity 1-500, price band)
      limits: point name unique per venue across all its maps, compared without case
      validation:
      - 'Link depends on kind: outlet (restaurant, cafe, shop, kiosk), product (ride, show), access point (entrance,
        exit). isStepFree defaults yes. Bookable place label unique on the map; ''not bookable'' keeps it greyed;
        the map holds no price.'
      - The link field depends on the kind (outlet for restaurant, cafe, shop, kiosk; product for ride and show; access
        point for entrance and exit); a featured offer (product or bundle) can be set on any kind.
      - Unique per venue across all its maps, compared without case; English and Arabic.
      - The field to get right; default yes, and the validator reports points reachable only by steps.
      - Label unique on the map (B09), kind, zone, capacity 1 to 500, price band from the import's bands; "not bookable"
        keeps it on the map greyed. The map holds no price.
      source:
      - map author, BO-094 (formSetVenuePoint, formSetPlacedResource)
      - venueManager on BO-094 Map Editor & Publish
      also_named:
      - point link
      - point name
      - isStepFree
      - bookable place
      ref: contracts/satellite/venue-map.yaml#setVenuePoint | F26 step 4 | contracts/satellite/venue-map.yaml#setVenuePoint
        | R108 | contracts/satellite/venue-map.yaml#validateVenueMapGraph | contracts/satellite/venue-map.yaml#setPlacedResource
        | REV3-15
    - name: path closure
      formats:
      - reason maintenance
      - incident
      - event
      - weather
      - crowding
      - other (note required); expected reopen time
      limits: note up to 500 characters
      validation:
      - Refused with wouldStrandPoints when the closure leaves a point unreachable.
      - Maintenance, incident, event, weather, crowding, other (note required); expected reopen time.
      source:
      - map author or duty manager, BO-094 (formSetPathClosure)
      - venueManager on BO-094 Map Editor & Publish
      also_named:
      - path closure reason
      ref: contracts/satellite/venue-map.yaml#setPathClosure | R222
    - name: Site plan, PDF
      formats:
      - 'PDF (pdfPlan): vector PDF read by layer names (decoded from UTF-16BE)'
      - 'scanned PDF: read through the OCR step (r1, answers L435); recognised text and labels feed the label proposals
        (ai#proposeVenueLabels), and the geometry is proposed as for a raster plan'
      limits:
      - layer names flatten if CAD was exported to PDF; native CAD preferred
      validation:
      - Undecodable layer names → layerNameUndecodable
      - 'No vector geometry → rasterOnly (warning, not an error): "This plan is an image. Seats and the map still
        work; paths will be proposed for you to check."'
      source: Venue manager on BO-093
      merged: merged from the venue-operations brief (3 Oct)
    - name: Raster plan with hand-marked paths
      formats:
      - PNG
      - JPG (rasterPlan)
      - paths hand-marked on the image
      - supported in r1 (answers L435)
      limits:
      - largest size available; 12,000 px wide is fine (spec §6)
      validation:
      - Always rasterOnly (warning)
      - ai.proposeWalkways proposes a path network with a confidence per segment; refuses to run where vector geometry
        exists
      - Each segment accepted or rejected one at a time (acceptWalkwayProposals); low-confidence segments shown, not
        hidden
      source: Venue manager on BO-093
      merged: merged from the venue-operations brief (3 Oct)
    - name: SVG plan
      formats:
      - SVG (svgPlan)
      limits:
      - 'as CAD: layers/groups named by role'
      validation:
      - as CAD
      source: Venue manager on BO-093
      merged: merged from the venue-operations brief (3 Oct)
    processing:
    - input: new map record
      does: creates a draft map (server-owned id, status draft, scope)
      operation: venue-map#createVenueMap
    - input: plan + manifests + anchors
      does: 'extracts shapes deterministically into the working draft (202 job: parsing → previewReady or failed);
        derives walkways from negative space when no path layer exists; reports every layer found, mapped or not'
      operation: venue-map#importVenueGeometry
    - input: extracted shapes
      does: AI proposes a kind per shape with a confidence
      operation: ai#proposeVenueLabels
    - input: label decisions
      does: creates points from accepted or edited proposals
      operation: venue-map#acceptVenueLabelProposals
    - input: points and resources
      does: places and links points and bookable resources
      operation:
      - venue-map#setVenuePoint
      - venue-map#setPlacedResource
    - input: draft graph
      does: 'builds and validates the navigation graph: unreachable points, dead ends, orphan components, points reachable
        only by steps'
      operation: venue-map#validateVenueMapGraph
    - input: validated draft
      does: publishes a new version; the previous version stays readable
      operation: venue-map#publishVenueMap
    - input: published map
      does: guest reads the whole map and the routable graph (cached, offline-capable)
      operation:
      - venue-map#getVenueMap
      - venue-map#getVenueMapGraph
    - input: path closure
      does: bumps the graph version so cached clients know a route may cross a closure
      operation: venue-map#setPathClosure
    - input: scanned PDF
      does: 'OCR step inside the import (r1): reads text and labels off the image; the labels feed the label proposals
        and the geometry is proposed as for a raster plan'
      operation:
      - venue-map#importVenueGeometry
      - ai#proposeVenueLabels
    - input: PNG/JPG with hand-marked paths
      does: AI proposes the path network from the marks with a confidence per segment; each segment is accepted or
        rejected one at a time (r1)
      operation:
      - ai#proposeWalkways
      - venue-map#acceptWalkwayProposals
    - input: GLB + pathway file
      does: imports the 3D model and the navigation graph (nodes, edges, locations, anchor); measures the budget and
        reports over-budget numbers as findings; the 3D layer publishes only when the anchor residual is within 10
        m (r1, ADR-0069)
      operation: venue-map#importVenueGeometry
    outputs:
    - name: map list (BO-092)
      states:
        loading: table skeleton
        emptyFirstRun: No maps yet. Create your first map
        ready: name, kind, status, published version, graph status (Connected, Partial, Disconnected, Not built),
          georeferenced (guests can be located)
        error: names the failed read
        emptyNoResults: 'Never shown: `listVenueMaps` takes no filter, so an empty list is always the first-run state
          above.'
        emptyNoAccess: Shown when the caller lacks `VENUE_MAP_VIEW`, which `listVenueMaps` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no …
      failure_branches: []
      shows:
      - element: map list
        rule: Name, kind (Park, Floor and level, Zone, Parking), status, published version, graph status (Connected,
          Partial, Disconnected, Not built) and whether it is georeferenced ("guests can be located").
      package_states:
        loading: The venue maps list.
        error: Could not load. Names which read failed and leaves the venue maps untouched.
        emptyFirstRun: No venue maps yet. Offers Create venue map (`createVenueMap`).
      also_named:
      - Venue Maps
    - name: import result (BO-093)
      states:
        parsing: job running with layer count so far
        previewReady: shapes over the plan with the layer report
        nothingFound: Nothing found, with the layers it did see
        noLayersMatched: layers listed with a role-mapping control
        unreadable: file could not be read
        parsedWithFindings: findings grouped by severity
        loading: The saved map import labelling.
        error: Could not load. Names which read failed and leaves the map import labelling untouched.
        emptyNoResults: An import that read no resources on a map meant to carry them says so (`resourcesFound` 0)
          and names the resource layer it looked for, rather than showing an empty price-band …
        emptyFirstRun: No map import labelling configured. The form opens empty and `importVenueGeometry` saves the
          first one; it says what the platform does in the meantime.
        emptyNoAccess: Shown when the caller lacks `VENUE_MAP_MANAGE`, which `importVenueGeometry` requires, and names
          that permission. Never an empty table — that reads as *there is no data* and sends …
      failure_branches:
      - what: scan or photo with no vector geometry (rasterOnly)
        sees: amber warning; manifest still gives seats; image still works as a map
        recover: propose walkways (proposeWalkways) or continue as picture map
      - what: no layer matched any role
        sees: noLayersMatched with every layer listed
        recover: map a layer to a role (layerMapping) and re-import
      - screen: BO-093
        what_goes_wrong: File yields nothing
        user_sees: Says "nothing found" or "no layers matched" with the layers it did see, not an empty success.
      - screen: BO-093
        what_goes_wrong: Walkway proposals
        user_sees: A stricter gate than labels; accepted walkways are validated as paths immediately and any unreachable
          point is reported.
      shows:
      - element: extraction report
        rule: Outcome (parsed, parsed with findings, nothing found, no layers matched, unreadable), shapes found,
          layers found and unmapped layers as chips, manifest rows read and joined.
      - element: proposals
        rule: Each with the proposed kind and its confidence; low-confidence proposals are shown, not filtered, sorted
          to the top.
      also_named:
      - Map Import & Labelling
    - name: label proposals (BO-093)
      states:
        loading: proposing
        ready: each shape with a proposed kind and confidence
        partial: some decided
      failure_branches:
      - what: assistant proposes a fire exit as an ordinary exit
        sees: proposal with its confidence
        recover: reject and place as emergencyExit
    - name: graph validation report (BO-094)
      states:
        ready-clean: connected
        ready-findings: lists unreachable points, dead ends, orphan components and separately points reachable only
          by steps
        loading: The map editor publish, read by `getVenueMap`.
        error: Could not load. Names which read failed and leaves the map editor publish untouched.
        emptyFirstRun: No map editor publish yet. Offers no create action — this screen declares no operation that
          makes one — and says so rather than showing an empty table.
        emptyNoAccess: Shown when the caller lacks `VENUE_MAP_VIEW`, which `getVenueMap` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* …
      failure_branches:
      - what: point reachable only by steps
        sees: listed apart from unreachable points
        recover: add a step-free path or mark the point
      shows:
      - element: validation
        rule: Unreachable points, points reachable only by steps, dead-end paths and critical unreachable points (exits,
          first aid) listed with "show on map".
      - element: draft vs published
        rule: A persistent banner "Editing draft. Guests see version 7 (published 2 Oct)" with the number of unpublished
          changes.
      also_named:
      - Map Editor & Publish
    - name: publish result (BO-094)
      states:
        published: new version number
        publishedNotNavigable: published with points and no paths (shows a picture map with points)
        refused: reason named
      failure_branches:
      - what: point links to a closed outlet
        sees: publish refused (brokenLink) naming the point
        recover: relink or remove the point
      - what: placed cabana has no linked resource, no price band, or a duplicate label
        sees: refused with resourceUnlinked, resourcePriceBandMissing or duplicateResourceLabel naming the place
        recover: fix on BO-094
      - what: unresolved proposals or a disconnected area
        sees: refused (unresolvedProposal, disconnectedArea)
        recover: decide proposals; connect the area
    - name: guest interactive map (GST-021)
      states:
        loading: map loading
        ready: 3D or 2D map with points
        offline: cached map and graph stay usable; waits marked out of date
        map3dUnavailable: 2D map with the same route; 2D/3D toggle hidden
        weakGps: dot dims, ring labelled 'Position approximate', 'I am at…' re-anchor
        emptyFirstRun: no published map
        error: Could not load. Names which read failed and leaves the interactive map untouched.
        emptyNoResults: No point of that category on this map; the other categories stay.
        emptyNoAccess: 'There is no permission to name — a guest holds none (ADR-0025: `x-ticvai-permission` is what
          a staff caller must hold; a guest call resolves to the guest''s own data; decided by …'
      failure_branches:
      - what: path closed after the guest cached the graph
        sees: route flagged as possibly crossing a closure
        recover: re-route on the newer graph version when signal returns
      - screen: GST-021
        what_goes_wrong: No 3D model, a weak phone or rendering below 20 fps
        user_sees: The 2D map with the same route; never an error.
      shows:
      - element: navigation mode
        rule: 'After Start on a destination card: a banner with the next turn and its distance, metres to go, arrival
          time and a progress bar; the dot moves along the route; End navigation stops it.'
      - element: weak position
        rule: The dot dims with an approximate ring labelled "Position approximate"; the turn list stays; "I am at…"
          lets the guest tap a nearby place.
      package_states:
        loading: The interactive map list.
        emptyFirstRun: No interactive map yet. Offers no create action — this screen declares no operation that makes
          one — and says so rather than showing an empty table.
        offline: The offline banner shows. A map and route graph already loaded stay usable, so directions do not
          need a signal. Wait times show their last reading marked out of date, never as …
        map3dUnavailable: 'No 3D model for this map: the 2D map, same route (ADR-0069; client meeting 30 September,
          MoM 4.8). The venue has not published a GLB model for this map (the default for every …'
        weakGps: 'Position approximate (ADR-0069, section 4): reported GPS accuracy worse than 30 metres, or the route
          runs along an indoor path. The dot dims and an approximate-position ring is …'
    - name: Flow outcome (exit states)
      states:
        published: The map is live, the graph is connected, and guests can route on it.
        publishedNotNavigable: Published with points and no paths. A legitimate outcome — the map shows a guest where
          things are and cannot tell them how to get there, which is better than no map and should be visible rather
          than silent.
        draft: Imported and never published. The current map keeps serving.
      failure_branches:
      - at_step: 1
        what_goes_wrong: The plan is a scan or a photograph with no vector geometry.
        user_sees: '`rasterOnly` is a warning, not an error. The manifest still gives seats and the image still works
          as a map; only automatic geometry is lost. Refusing a venue that sent everything it had is the wrong answer.
          Where there is nothing to subtract, `ai.proposeWalkways` sees the paths instead — and it refuses to run
          where vector geometry exists, because running a model where subtraction is available is how a worse answer
          …'
        recovery: recoverable; resolved by ai#proposeWalkways
      - at_step: 1
        what_goes_wrong: No layer matched any role.
        user_sees: '`noLayersMatched`, separated from `nothingFound` deliberately. It almost always means a role needed
          a second entry or a name needed decoding, not that the file is wrong — and `layersFound` lists every decoded
          name so an operator maps a role by reading rather than guessing.'
        recovery: recoverable; resolved by venue-map#importVenueGeometry
      - at_step: 3
        what_goes_wrong: The assistant proposes a fire exit as an ordinary exit.
        user_sees: The operator rejects it and places it correctly. A map that cannot tell them apart routes a normal
          departure through a fire door, which is why `emergencyExit` is a separate kind and why proposals are accepted
          one at a time rather than in bulk.
        recovery: requiresStaff; resolved by venue-map#acceptVenueLabelProposals
      - at_step: 5
        what_goes_wrong: A point is reachable only by steps.
        user_sees: Listed separately from unreachable points. The map works perfectly until a wheelchair user opens
          it, and nothing in the drawing makes it visible — which is the whole reason this check runs before publication
          rather than after.
        recovery: requiresStaff; resolved by venue-map#validateVenueMapGraph
      - at_step: 6
        what_goes_wrong: A point links to an outlet that has closed.
        user_sees: Publish is refused and the response names which point. A restaurant point pointing nowhere is worse
          than no point, because a guest walks there.
        recovery: recoverable; resolved by venue-map#publishVenueMap
      - at_step: 6
        what_goes_wrong: A placed cabana has no linked resource or no price band, or two places share a label.
        user_sees: Publish is refused with `resourceUnlinked`, `resourcePriceBandMissing` or `duplicateResourceLabel`,
          naming the place (decided 29 September, rev 3 REV3-15). A cabana a guest can tap and cannot buy is worse
          than no cabana on the map. `validateVenueMapGraph` reports the same before anyone presses Publish.
        recovery: recoverable; resolved by venue-map#setPlacedResource
      - at_step: 7
        what_goes_wrong: A path closes after the guest cached the graph.
        user_sees: '`setPathClosure` bumps the graph version, and the client holding an older version knows its route
          may cross something closed. A guest holding an offline route across a path that closed this morning gets
          told, rather than walking into a barrier.'
        recovery: recoverable; resolved by venue-map#setPathClosure
      merged: merged from the venue-operations brief (3 Oct)
    steps:
    - frame: 1
      screen: BO-092
      blockA: true
      sees: map list with status and graph status
      does: 'Create venue map: name, kind, floor level'
      operation: venue-map#createVenueMap
      result: a draft map; nothing is live
    - frame: 2
      screen: BO-093
      blockA: true
      sees: 'upload panel with four source kinds: DWG/DXF (preferred), PDF (vector, or scanned via OCR), PNG/JPG with
        hand-marked paths, and 3D model (GLB) + navigation file; the format guidance says what each gives'
      does: uploads plan, manifests and anchors
      operation: assets#createUpload, assets#completeUpload, venue-map#importVenueGeometry
      result: import job parsing
    - frame: 3
      screen: BO-093
      blockA: true
      sees: 'shapes over the plan; layer report: every layer found, mapped or not; findings by severity'
      does: reviews extraction
      operation: venue-map#importVenueGeometry (job poll)
      result: previewReady or nothingFound / noLayersMatched
    - frame: 4
      screen: BO-093
      blockA: true
      sees: proposals list with confidence (low-confidence shown, not filtered)
      does: Accept / Edit / Reject per shape, or accept all above 90%
      operation: ai#proposeVenueLabels, venue-map#acceptVenueLabelProposals
      result: points created
    - frame: 5
      screen: BO-094
      blockA: true
      sees: map editor with point palette and bookable places
      does: places toilets, exits, prayer rooms and links each point (outlet, product, access point); places cabanas
        with price band
      operation: venue-map#setVenuePoint, venue-map#setPlacedResource
      result: linked points
    - frame: 6
      screen: BO-094
      blockA: true
      sees: validation panel
      does: Validate graph
      operation: venue-map#validateVenueMapGraph
      result: unreachable, dead-end, orphan and steps-only findings highlighted on the map
    - frame: 7
      screen: BO-094
      blockA: true
      sees: publish dialog with an optional note (300 chars)
      does: Publish
      operation: venue-map#publishVenueMap
      result: new version live; previous stays readable
    - frame: 8
      screen: GST-021
      blockA: true
      sees: the guest map (3D where a model exists, else 2D) with points
      does: taps Nearest toilets then Start
      operation: venue-map#getVenueMap, venue-map#getVenueMapGraph
      result: routed on the device, works with no signal
    motion:
    - what: Import job progress (BO-093)
      how: Status chip parsing → previewReady (or failed) while polling getVenueMapImportJob; shapes and layers counters
        roll up as the job reports; the layer list reveals row by row with mapped/unmapped tags.
      timing: Poll about every 2 s (default); reveal 30 ms per row
    - what: Label proposals
      how: Each proposed shape outlines on the plan in the proposal colour with a confidence bar; Accept fills it
        solid, Reject fades it out; low-confidence ones are drawn dashed, not hidden.
      timing: 150 ms per decision
    - what: Graph validation (BO-094)
      how: Unreachable points pulse red on the map; step-only points pulse amber; critical points (first aid, exits,
        assembly) listed apart.
      timing: Validation returns under 5 s; pulse 1 s loop until fixed
    - what: Publish
      how: Version badge increments (v3 → v4) and the Draft ribbon clears.
      timing: 300 ms
    - what: Guest route line (GST-021)
      how: Route drawn along the graph edges from the snapped position to the destination, then a dash pattern flows
        along it in the walking direction.
      timing: Draw-on about 600 ms; dash flow continuous
    - what: Position dot
      how: Blue dot follows GPS snapped to the nearest edge (hysteresis, prefers the route); accuracy halo; dims and
        shows an approximate ring when accuracy is worse than 30 m or indoors.
      timing: Per GPS fix (about 1 s in walking mode)
    - what: Camera follow
      how: In walking navigation the camera follows the dot, heading-up, and eases ahead of the next turn; with no
        location permission it follows the route from the chosen start.
      timing: Ease 300-500 ms
    - what: 3D ↔ 2D transition
      how: Toggle tilts the camera from top-down 2D to a perspective 3D view (and back) with the same route and dot;
        automatic fallback to 2D below 20 fps or without a GLB, with the toggle hidden and nothing said. The layers
        crossfade during the tilt.
      timing: About 600 ms tilt; LOD drops below 24 fps for 5 s
    - what: Turn banner
      how: '"Turn left at Canyon Rapids · 60 m" banner above the map updates distance continuously and slides to the
        next instruction at each turn. Metres to go, arrival time and a progress bar update as the guest walks.'
      timing: Slide 200 ms
    - what: Re-route
      how: 'Off route > 20 m for > 5 s, or a newer graphVersion with a closure on the route: route redraws and a banner
        says why.'
      timing: Redraw 400 ms
    - what: Layer and proposal hover (BO-093)
      how: Hover over a layer row highlights its shapes on the plan; hover a proposal highlights its shape.
      timing: immediate
    - what: Finding focus (BO-094)
      how: Validation findings pulse once on the map where they are; clicking a finding pans and zooms to it.
      timing: pan and zoom about 300 ms
    - what: Walkway proposals (BO-093, hand-marked PNG/JPG)
      how: Proposed segments draw over the marks with a confidence colour; Accept turns a segment solid, Reject fades
        it; one segment at a time.
      timing: 150 ms per decision
    - what: Guest map performance (GST-021)
      how: 30 fps sustained while walking, 60 where the device allows; LOD changes are invisible (LOD0 within 80 m);
        first render from cache <= 3 s.
      timing: below 24 fps for 5 s drop a LOD; below 20 fps fall back to 2D
