        limits: "at least one change; name optional, default 'What-if: <event> <date>'"
        validation: Never changes production.
        source: venue manager, BO-919 (formCreateForecastScenario, 'Run a what-if')
    processing:
      - {input: "event date", does: "reads the forecast and operational requirements", operation: ["ai#getForecast", "ai#listOperationalRequirements"]}
      - {input: "scenario", does: "computes the scenario (202: computing → ready or failed)", operation: "ai#createForecastScenario"}
    outputs:
      - name: configured vs AI recommended
        states: {loading: "reading", ready: "two columns per resource (lifeguards, cashiers, gate lanes, golf carts, cabanas): configured, and recommended at most-likely with busy case P90 beside it, e.g. '14 (busy case 17)'; differences highlighted, not corrected", emptyFirstRun: "no published forecast for the date: says so and offers to run one", stale: "'Forecast is out of date' with the publication time (more than 36 hours)", computing: "scenario running"}
        failure_branches:
          - {what: "venue profile missing a setting (e.g. no productivity standard for a role)", sees: "the row names the missing setting and links to the AI venue profile; other rows still show", recover: "set it in the venue profile"}
      - name: basis and maturity
        states: {ready: "'Starting - Based on: your venue profile, water-park pattern, UAE calendar, weather. Limited historical data.' with a range, not a single number"}
        failure_branches: []
    steps:
      - {frame: 1, screen: "BO-913", blockA: false, sees: "event resource planning hub", does: "opens the forecast", operation: "none in Block A", result: "navigates"}
      - {frame: 2, screen: "BO-919", blockA: true, sees: "configured vs recommended table with busy case and the basis line", does: "reads", operation: "ai#getForecast, ai#listOperationalRequirements", result: "gaps highlighted"}
      - {frame: 3, screen: "BO-919", blockA: true, sees: "Run a what-if dialog", does: "adds 'rain' and '+20% attendance'", operation: "ai#createForecastScenario", result: "What-if column beside the base, changes listed"}
      - {frame: 4, screen: "BO-919", blockA: true, sees: "Open in staffing requirements", does: "opens BO-927 for the staff rows", operation: none, result: "navigates to accept, modify or reject"}
    motion:
      - Scenario computing state (spinner on the What-if column) until ready.
    decisions: ["DEC-009 (forecast covers every requirement kind, curated model per task with 3-4 alternatives)", "TBF-2 (Block A forecast baseline runs on the calendar only; weather joins in Block B)"]
    sources: ["flows/F270-*.yaml", "design-notes ai BO-919", "answers 2 Oct line 50", "contracts/satellite/ai.yaml#createForecastScenario"]
