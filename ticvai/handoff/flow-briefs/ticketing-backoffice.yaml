    merged_detail:
      from: the venue-operations copy (lifted from flows/, screens/ and contracts/; the storyboard above is the one
        to draw)
      trigger:
        description: A venue is opening, or has rebuilt an area. Somebody has a drawing and needs guests to be able
          to find a toilet.
        entry_screen: BO-092
      steps:
      - frame: 1
        screen: BO-092
        screen_name: Venue Maps
        block_a: true
        user_sees: Every venue map of the venue (park map, a floor per building, zones, parking) and which version
          guests see.
        user_does: The manager creates a map.
        operations:
        - venue-map#createVenueMap
        result: A draft, with the kind and floor level set. Nothing is live.
      - frame: 2
        screen: BO-093
        screen_name: Map Import & Labelling
        block_a: true
        user_sees: Upload a drawing, see what was read, then review what the assistant suggests each shape is.
        user_does: The plan is uploaded and read.
        operations:
        - venue-map#importVenueGeometry
        result: Shapes extracted, deterministically. Every layer name reported back, decoded, mapped or not — and
          a file that yields nothing says `nothingFound` rather than reporting success, which is the defect CF-122
          found in the seat importer. Where the map carries bookable places (decided 29 September, rev 3 REV3-15 and
          GAP-C2), the resource layer and the resource manifest (label, kind, zone, capacity, price band) are read
          too, …
      - frame: 3
        screen: BO-093
        screen_name: Map Import & Labelling
        block_a: true
        user_sees: Upload a drawing, see what was read, then review what the assistant suggests each shape is.
        user_does: The assistant proposes what each shape is; the operator accepts, edits or rejects.
        operations:
        - ai#proposeVenueLabels
        - venue-map#acceptVenueLabelProposals
        result: Points created from accepted proposals. Low-confidence proposals are shown, not filtered — the shape
          the assistant is unsure about is the one most worth a human looking at.
      - frame: 4
        screen: BO-094
        screen_name: Map Editor & Publish
        block_a: true
        user_sees: Place and link what the drawing did not carry (toilets, exits, rides, restaurants, shops, prayer
          rooms, first aid) and the cabanas, loungers and tables guests book, then validate and publish.
        user_does: The operator places what the drawing did not carry and links each point to what it is.
        operations:
        - venue-map#setVenuePoint
        - venue-map#setPlacedResource
        result: A restaurant point carries its outlet id, a ride its product id, a gate its access point. Tapping
          a restaurant on the map should open its menu, and that only works if the map knows which outlet it is. A
          cabana, lounger or table is placed with `setPlacedResource` and linked to its `resources.Resource`, so a
          guest can pick that one on the map and buy it (rev 3 REV3-15, superseding audit R073 (c) for resources on
          an …
      - frame: 5
        screen: BO-094
        screen_name: Map Editor & Publish
        block_a: true
        user_sees: Place and link what the drawing did not carry (toilets, exits, rides, restaurants, shops, prayer
          rooms, first aid) and the cabanas, loungers and tables guests book, then validate and publish.
        user_does: The graph is validated before anybody publishes.
        operations:
        - venue-map#validateVenueMapGraph
        result: Unreachable points, dead-end paths, orphan components — and points reachable only by steps, which
          is the finding nothing in the drawing makes visible.
        timing: under 5s
      - frame: 6
        screen: BO-094
        screen_name: Map Editor & Publish
        block_a: true
        user_sees: Place and link what the drawing did not carry (toilets, exits, rides, restaurants, shops, prayer
          rooms, first aid) and the cabanas, loungers and tables guests book, then validate and publish.
        user_does: The manager publishes.
        operations:
        - venue-map#publishVenueMap
        result: A new version. The previous one stays readable so a guest mid-route on version 3 finishes on version
          3.
      - frame: 7
        screen: GST-021
        screen_name: Interactive Map
        block_a: true
        user_sees: The venue map with walking navigation (the Map view of At the Venue, one implementation with GST-038).
        user_does: A guest opens the map and is routed.
        operations:
        - venue-map#getVenueMap
        - venue-map#getVenueMapGraph
        result: The whole map in one call, cached, and the graph small enough to route over on the device. The platform
          guarantees the graph and the client walks it — a phone with it cached routes with no signal.
      processing:
      - operation: venue-map#createVenueMap
        what: Start a map
        steps:
        - 1
        block_a: true
        writes: true
      - operation: venue-map#importVenueGeometry
        what: Read a drawing into shapes
        steps:
        - 2
        block_a: true
        writes: true
      - operation: ai#proposeVenueLabels
        what: Suggest what each extracted shape is
        steps:
        - 3
        block_a: true
        writes: true
      - operation: venue-map#acceptVenueLabelProposals
        what: Accept, edit or reject what the assistant suggested
        steps:
        - 3
        block_a: true
        writes: true
      - operation: venue-map#setVenuePoint
        what: Place or amend a point of interest
        steps:
        - 4
        block_a: true
        writes: true
      - operation: venue-map#setPlacedResource
        what: Place or amend a bookable resource on the map
        steps:
        - 4
        block_a: true
        writes: true
      - operation: venue-map#validateVenueMapGraph
        what: What is unreachable, before anyone publishes it
        steps:
        - 5
        block_a: true
        writes: true
      - operation: venue-map#publishVenueMap
        what: Make the draft the one guests see
        steps:
        - 6
        block_a: true
        writes: true
      - operation: venue-map#getVenueMap
        what: A map with its points and paths
        steps:
        - 7
        block_a: true
        offline_capable: true
      - operation: venue-map#getVenueMapGraph
        what: The navigation graph, ready to route over
        steps:
        - 7
        block_a: true
        offline_capable: true
      ticketing_backoffice_motion_before_merge:
      - BO-093 import progress while the job is parsing (indeterminate bar, then the layer count), polling getVenueMapImportJob.
      - BO-093 hover over a layer row highlights its shapes on the plan; hover a proposal highlights its shape.
      - BO-094 validation findings pulse once on the map where they are; clicking a finding pans and zooms to it.
      - 'GST-021 3D route line drawn along the path from the guest''s dot to the destination; the dot moves along
        the snapped route; camera follows the route (not the guest) when location is off; 3D↔2D toggle crossfades
        and keeps the same route; LOD changes are invisible (no pop-in by design target: LOD0 within 80 m).'
      - GST-021 navigation banner updates the next turn and its distance, metres to go, arrival time and a progress
        bar as the guest walks; re-route when more than 20 m off route for more than 5 s.
      - 'GST-021 weak GPS: the dot dims and an approximate ring fades in (accuracy worse than 30 m).'
      - 'Performance targets: 30 fps sustained while walking, 60 where the device allows; below 24 fps for 5 s drop
        a LOD; below 20 fps fall back to 2D; first render from cache ≤ 3 s.'
      open_not_kept:
      - question: Upload size limits for plans, manifests and the illustrated map are not in assets.createUpload.
        default: Plans and manifests ≤ 50 MB, illustrated map ≤ 100 MB, GLB ≤ 40 MB (ADR-0069); state the limit before
          the picker opens.
      replaced_on_3_oct:
      - PDF (via text/vector read; layer names often lost)
      - raster PNG/JPG scan or photo (no vector geometry)
      - venue or a commissioned 3D studio; upload screen not yet specified (see open)
      - Venue (or its 3D contractor), uploaded on BO-093; contract support pending (see open)
      - 'scanned PDF: treated as raster (see open on OCR)'
      - upload panel with format guidance (DWG/DXF preferred; PDF and raster weaker) and the 3D model note
    resolved:
    - q: GLB and the navigation JSON are not yet accepted by importVenueGeometry (format enum is pdf/svg/dwg/dxf/raster);
        VenueMap.modelAssetId/modelTransform and an assets model3d kind are ADR-0069 action items 3-5, still open.
      was_default: Draw BO-093 with a fourth source kind, "3D model + navigation file", two upload slots and the budget/anchor
        findings from ADR-0069; mark it pending the contract change.
      resolved_by: 'answers-2-oct-batch1.md L435 (Chinmay, 3 Oct, r1 additions): venue map in r1; the import accepts
        DXF/DWG, PDF with an OCR step, PNG/JPG with hand-marked paths (AI path proposal, accepted segment by segment)
        and GLB plus a pathway (navigation) file; ADR-0069 open items closed'
    - q: '"PDF via OCR": the contract reads PDF layer names and has no OCR step; a scanned PDF has no layers.'
      was_default: A scanned PDF is imported as a raster plan (rasterOnly warning); text in the image feeds the label
        proposals (proposeVenueLabels) as hints. No separate OCR screen.
      resolved_by: 'answers-2-oct-batch1.md L435 (Chinmay, 3 Oct, r1 additions): venue map in r1; the import accepts
        DXF/DWG, PDF with an OCR step, PNG/JPG with hand-marked paths (AI path proposal, accepted segment by segment)
        and GLB plus a pathway (navigation) file; ADR-0069 open items closed'
    - q: Hand-marked paths on a PNG are not described as an input distinct from a plain raster.
      was_default: Treat as rasterPlan; proposeWalkways uses the marks as the visible paths; every segment accepted
        one at a time.
      resolved_by: 'answers-2-oct-batch1.md L435 (Chinmay, 3 Oct, r1 additions): venue map in r1; the import accepts
        DXF/DWG, PDF with an OCR step, PNG/JPG with hand-marked paths (AI path proposal, accepted segment by segment)
        and GLB plus a pathway (navigation) file; ADR-0069 open items closed'
    - q: Where is the GLB and navigation file uploaded? ADR-0069 action items 3-5 (VenueMap.modelAssetId, a model3d
        media kind, the input-spec section) are not done.
      was_default: Draw a '3D model (optional)' upload slot on BO-093 beside the plan, accepting .glb plus .json,
        with the budget figures as helper text; mark the frame 'contract pending'.
      resolved_by: 'answers-2-oct-batch1.md L435 (Chinmay, 3 Oct, r1 additions): venue map in r1; the import accepts
        DXF/DWG, PDF with an OCR step, PNG/JPG with hand-marked paths (AI path proposal, accepted segment by segment)
        and GLB plus a pathway (navigation) file; ADR-0069 open items closed'

  F77:
    title: A promotion is built, bundled, published and measured
    process: ticketing-backoffice
    trigger: A venue wants to shift stock or fill a quiet Tuesday. (Client chain RET-5G, RET-5H, RET-5K, RET-5A.)
    actors:
      - {role: "marketer", app: "P08 Venue Management", screens: ["BO-013", "BO-011", "BO-010"]}
      - {role: "marketer", app: "P16 Venue Analytics", screens: ["ANL-009"]}
    inputs:
      - name: channel capacity and allocations
        formats: ["per channel a number of units; OTA listing (Viator, Klook, Headout, GetYourGuide, Tiqets, Expedia, other) with external product reference", "allocation", "price list", "push interval"]
        limits: total cannot exceed capacity; push interval default 15 minutes
        validation: "Reducing a channel below what it has sold is refused with the sold count named, e.g. 'B2B has sold 42; minimum 42'."
        source: marketer, BO-013
      - name: bundle definition
        formats: ["code (≤ 64)", "name (≤ 200)", "description (≤ 1000)", "kind fixed / dynamic / mandatory / optional / promotional", "price", "components", "choice groups (\"choose 3 of 5\")", "allocation"]
        limits: "component quantity ≥ 1; choice group choose ≥ 1 from ≥ 2 options; redeem at up to 20 outlets"
        validation: "Allocation required before save; defaults proportional to list prices and must total the bundle price exactly (rounding remainder shown on one line). A bundle that has sold locks components and allocation ('sold since 12 Oct')."
        source: marketer, BO-011 (formCreateBundle)
      - name: promotion
        formats: ["code (≤ 64, A-Z a-z 0-9 _ -), name (≤ 200), kind first: Percentage, Fixed amount off, Fixed price, Buy X get Y, Free item, Tiered percentage; stacking mode; budget cap; A/B variants"]
        limits: percentage 0 to 100; buy/get quantities ≥ 1; A/B traffic totals exactly 100
        validation: "Only the chosen kind's inputs show. Stacking mode is required and never defaulted (Exclusive, Stackable, Best only, Stack within group + group name). A live promotion locks conditions and discount (pause, extend or end only)."
        source: marketer, BO-010 (formCreatePromotion)
      - name: coupon campaign and codes
        formats: ["one shared code with a redemption limit", "or a batch of unique single-use codes"]
        limits: up to 50,000 codes per generation; prefix ≤ 16; length 6 to 32
        validation: Generation is asynchronous and produces a file to download.
        source: marketer, BO-010 (formCreateCouponCampaign, formGenerateCouponCodes)
      - name: reporting question
        formats: ["natural-language text"]
        limits: 3 to 1000 characters
        validation: Under 3 characters refused (400).
        source: marketer, ANL-009
    processing:
      - {input: "allocations", does: "sets channel envelopes and OTA listings", operation: ["catalogue#createChannelCapacity", "catalogue#updateChannelCapacity", "catalogue#relinquishChannelAllocation", "subscription#setChannelListing", "subscription#listChannelListings"]}
      - {input: "bundle", does: "creates the sellable bundle", operation: "promotions#createBundle"}
      - {input: "question", does: "answers from reporting data; raises and acknowledges alerts; AI proposes actions to approve or reject", operation: ["reporting#askReportingQuestion", "reporting#setAlertRule", "reporting#acknowledgeAlert", "ai#listProposedActions", "ai#decideProposedAction"]}
      - {input: "promotion and campaign", does: "creates the promotion, the coupon campaign and its codes; reads cost on the dashboard", operation: ["promotions#createPromotion", "promotions#createCouponCampaign", "promotions#generateCouponCodes", "promotions#getPromotion", "promotions#endPromotion", "reporting#getDashboard"]}
    outputs:
      - name: channel allocation bar
        states: {ready: "stacked bar against capacity, remainder labelled 'General pool, any channel once its own share is used'", error: "refusal with sold count"}
        failure_branches: [{what: "reduce below sold", sees: "'B2B has sold 42; minimum 42'", recover: "set ≥ sold"}]
      - name: bundle
        states: {draft: "saved", onSale: "sellable", soldLocked: "components read-only"}
        failure_branches: [{what: "combo slot with no default", sees: "warning that every till needs extra taps", recover: "set a default per slot"}]
      - name: promotion and codes
        states: {draft: "created", live: "locked except pause/extend/end", generating: "code batch progress (queued, generating, complete, failed)", complete: "download file"}
        failure_branches: [{what: "code generation failed", sees: "failed status on the batch", recover: "retry generation"}]
      - name: dashboard / AI answer
        states: {loading: "answering", ready: "figures and the answer", empty: "no data yet for a new promotion"}
        failure_branches: [{what: "a step not licensed for the tenant", sees: "chain stops at the module boundary (stoppedAtModule)", recover: "none needed; licence boundary, not a failure"}]
    steps:
      - {frame: 1, screen: "BO-013", blockA: true, sees: "channel allocation bars and OTA listings", does: "sets channel capacity for the quiet Tuesday", operation: "catalogue#createChannelCapacity / updateChannelCapacity", result: "envelopes per channel"}
      - {frame: 2, screen: "BO-011", blockA: true, sees: "bundle canvas (components, choice groups, allocation)", does: "builds ticket + meal bundle", operation: "promotions#createBundle", result: "bundle drafted"}
      - {frame: 3, screen: "ANL-009", blockA: false, sees: "AI assistant and action centre", does: "asks a question and decides a proposed action", operation: "reporting#askReportingQuestion, ai#decideProposedAction", result: "answer and decision"}
      - {frame: 4, screen: "BO-010", blockA: true, sees: "promotion form (kind first) and coupon campaign", does: "creates promotion, campaign, generates codes; reads cost", operation: "promotions#createPromotion, promotions#createCouponCampaign, promotions#generateCouponCodes, reporting#getDashboard", result: "promotion live and measured"}
    motion:
      - Code generation progress (queued → generating → complete) with a count; the download button appears on complete.
      - Channel allocation stacked bar resizes live as numbers are typed.
    decisions: ["CHG-WIR-025 (publishBundle is the catalogue release, not the sellable bundle)", "Answers 2 Oct line 19 and 34: workshop-pack commercial screens are venue screens merged with BO-008 to BO-011"]
    sources: ["flows/F77-*.yaml", "client boards RET-5G", "RET-5H", "RET-5K", "RET-5A", "design-notes BO-010", "BO-011", "BO-013", "contracts/satellite/promotions.yaml"]
    open:
      - {question: "Is the reporting answer on ANL-009 streamed?", default: "Static reply with a typing indicator; ANL-009 is not Block A."}
      - {question: "Step 1's publishBundle on BO-013 publishes the catalogue release (CHG-WIR-025); should it stay on this step?", default: "Draw 'Publish catalogue release' as a secondary action on BO-014, not on BO-013."}

  F86:
    title: A POS layout is designed, previewed and deployed
    process: ticketing-backoffice
    trigger: A venue wants its tills to look different (new buttons, a new tender, a new discount rule). Client chain POS-4A to POS-4F.
    actors:
      - {role: "venueManager", app: "P08 Venue Management", screens: ["BO-115", "BO-116", "BO-117", "BO-118", "BO-126"]}
      - {role: "AI configuration assistant", app: "server (ai contract)", screens: ["BO-117"]}
    inputs:
      - name: catalogue import file
        formats: ["CSV", "XLSX", "JSON"]
        limits: "mode createOnly, upsert, replaceCategory; uploaded through assets first (sourceRef)"
        validation: "Preview reports counts before any commit ('2,847 products, 14 with no price, 3 duplicate codes'); findings grouped by severity with row number and field; errors block commit, warnings do not; commit refused when nothing was found or the file was unreadable."
        source: venue manager, BO-117 (formImportProductCatalogue)
      - name: assistant prompt
        formats: ["conversational text; images (OCR)"]
        limits: description 5 to 4000 characters; kind product, membership, pass, promotion, discountRule, pricingCalendar, seatingZone, operatingHours, campaign
        validation: The assistant asks for the type, validity, dates and capacity and refuses to proceed while required information is missing.
        source: venue manager, BO-117 (formGenerateConfiguration)
      - name: categories, merchandise, campaign, deployment target
        formats: ["category tree", "merchandise presentation", "campaign", "configuration profile + workstations"]
        limits: per contract
        validation: none beyond the contracts (screens not Block A)
        source: venue manager, BO-115, BO-116, BO-118, BO-126
    processing:
      - {input: "import file", does: "parses into a preview job (parsing → previewReady → committing → committed or failed; outcome parsed, parsedWithFindings, nothingFound, unreadable); commit creates or updates drafts", operation: ["catalogue#importProductCatalogue", "catalogue#commitCatalogueImport"]}
      - {input: "assistant prompt", does: "drafts a configuration blueprint: what will be created, assumptions (each editable), clarifications needed, confidence", operation: "ai#generateConfiguration"}
      - {input: "categories and layout", does: "sets categories, merchandise, campaign; deploys the profile to workstations", operation: ["catalogue#listProductCategories", "catalogue#setProductCategories", "retail#updateMerchandise", "marketing-crm#createCampaign", "tenancy#deployConfigurationProfile", "tenancy#listSaleBoards", "tenancy#listWorkstations", "tenancy#listAuditRecords"]}
    outputs:
      - name: import preview and findings
        states: {parsing: "progress", previewReady: "counts + findings table", nothingFound: "commit refused, 'nothing found'", unreadable: "commit refused", committed: "counts of drafts created and updated"}
        failure_branches: [{what: "errors in rows", sees: "error findings with row and field", recover: "fix the file and re-import"}]
      - name: assistant blueprint
        states: {asking: "follow-up question", ready: "blueprint with 'Create as draft'", partial: "clarifications still needed"}
        failure_branches: [{what: "proposal touches prices", sees: "shown with who suggested it; approval and publication follow the normal path", recover: "approve via normal path"}]
      - name: deployment
        states: {ready: "deployed to selected tills", partial: "some tills pending"}
        failure_branches: [{what: "a step not licensed for the tenant", sees: "chain stops at the module boundary", recover: "none (licence boundary)"}]
    steps:
      - {frame: 1, screen: "BO-115", blockA: false, sees: "category and brand hierarchy", does: "sets categories", operation: "catalogue#setProductCategories", result: "categories saved"}
      - {frame: 2, screen: "BO-116", blockA: false, sees: "merchandising presentation", does: "updates merchandise", operation: "retail#updateMerchandise", result: "presentation saved"}
      - {frame: 3, screen: "BO-117", blockA: true, sees: "two tabs: Import file and Configuration assistant", does: "imports a file or describes the products to the assistant", operation: "catalogue#importProductCatalogue, ai#generateConfiguration", result: "preview or blueprint; nothing is live"}
      - {frame: 4, screen: "BO-117", blockA: true, sees: "findings by severity or blueprint with assumptions", does: "commits import or 'Create as draft'", operation: "catalogue#commitCatalogueImport", result: "drafts created with counts"}
      - {frame: 5, screen: "BO-118", blockA: false, sees: "campaign and audience", does: "creates a campaign", operation: "marketing-crm#createCampaign", result: "campaign"}
      - {frame: 6, screen: "BO-126", blockA: false, sees: "deployment preview and audit", does: "deploys the profile", operation: "tenancy#deployConfigurationProfile", result: "tills updated together"}
    motion:
      - Import job progress bar while parsing and committing.
      - Assistant replies appear as a chat; streaming is not specified for generateConfiguration (see open).
    decisions: ["CHG-WIR-021 (setRolePermissions moved off BO-116)"]
    sources: ["flows/F86-*.yaml", "client boards POS-4A to POS-4F", "design-notes BO-117", "contracts/spine/catalogue.yaml#importProductCatalogue", "contracts/satellite/ai.yaml#generateConfiguration"]
    open:
      - {question: "Does the configuration assistant stream its replies like the concierge (SSE)?", default: "Show a typing indicator, then the full reply; streaming decided only for sendAiMessage (answers 3 Oct)."}
      - {question: "Import file size and row limits", default: "Helper text 'CSV, XLSX or JSON, up to 50,000 rows'; the server's maxSizeBytes governs."}

  F89:
    title: Offline policy is set, cached, monitored and reconciled
    process: ticketing-backoffice
    trigger: A venue decides how much trading it will tolerate with no network.
    actors:
      - {role: "technician / venue manager", app: "P08 Venue Management", screens: ["BO-130", "BO-131", "BO-037", "BO-128"]}
      - {role: "supervisor", app: "P08", does: "resolves refused offline sales remotely"}
    inputs:
      - name: offline policy
        formats: ["checklist grouped Safe offline (sale, entitlement validate, no sale) and Risky offline (refund, exchange, price override, discount, wallet spend, loyalty redemption); ceilings; action at breach; manager may extend"]
        limits: maximum hours offline 1 to 72 (default 24); transaction ceiling 1 to 5,000; value ceiling in the venue currency; scope path ^[a-z0-9_]+(\.[a-z0-9_]+)*$
        validation: Risky group unticked by default with a one-line reason each. Policy set at a node (venue, department, workstation group) and inherited below (PR-4).
        source: technician, BO-130 (formSetOfflinePolicy)
      - name: connectivity thresholds
        formats: ["thresholds for when a device counts as offline rather than slow"]
        limits: per contract
        validation: per contract (screen not Block A)
        source: technician, BO-131
      - name: rejection resolution
        formats: ["Resolve rejection per refused offline entry"]
        limits: one entry at a time
        validation: none
        source: supervisor, BO-130 (formResolveSyncRejection)
    processing:
      - {input: "offline policy", does: "stores the policy for the node and its children", operation: "tenancy#setOfflinePolicy"}
      - {input: "thresholds", does: "sets when a device switches to offline", operation: "tenancy#setConnectivityThresholds"}
      - {input: none, does: "lists each device's cached package (what it enforces now) and fleet health", operation: ["catalogue#listCatalogueBundles", "tenancy#getWorkstationHealth", "tenancy#listWorkstations"]}
      - {input: "rejections", does: "lists and resolves offline sales the server refused", operation: ["orders#listSyncRejections", "orders#syncOrders"]}
    outputs:
      - name: offline policy
        states: {ready: "policy with inherited-from label", error: "refused (403 or 404)"}
        failure_branches: [{what: "a step not licensed for the tenant", sees: "chain stops at the module boundary", recover: none}]
      - name: sync rejections
        states: {emptyFirstRun: "no refused offline sales", ready: "each refused entry with device, time recorded, product, amount and the reason (a to-do, never retried)", resolved: "removed from the unresolved view"}
        failure_branches: [{what: "sale against a retired product", sees: "Resolve posts it against the retired product at the price paid", recover: "Resolve rejection"}]
      - name: fleet health
        states: {ready: "which tills are offline and since when", partial: "some devices unreported"}
        failure_branches: []
    steps:
      - {frame: 1, screen: "BO-130", blockA: true, sees: "Safe / Risky offline checklist and ceilings", does: "sets the policy for the venue node", operation: "tenancy#setOfflinePolicy", result: "what a till may do offline and for how long"}
      - {frame: 2, screen: "BO-131", blockA: false, sees: "connectivity thresholds", does: "sets thresholds", operation: "tenancy#setConnectivityThresholds", result: "offline vs slow defined"}
      - {frame: 3, screen: "BO-037", blockA: false, sees: "offline package per device", does: "checks what each device enforces", operation: "catalogue#listCatalogueBundles", result: "enforced package visible"}
      - {frame: 4, screen: "BO-128", blockA: false, sees: "live workstation health", does: "monitors the fleet", operation: "tenancy#getWorkstationHealth, tenancy#listWorkstations", result: "offline tills and since when"}
      - {frame: 5, screen: "BO-130", blockA: true, sees: "sync rejections list", does: "resolves each refused sale", operation: "orders#listSyncRejections, orders#syncOrders", result: "every rejected offline sale seen by a person"}
    motion:
      - Fleet health on BO-128 refreshes live (status dots change colour; 'offline since' timer counts up).
    decisions: ["CHG-WIR-021 (thresholds on BO-131)", "CHG-WIR-025 and CHG-WIR-027 (package read is listCatalogueBundles)", "PR-4 (policy inheritance)"]
    sources: ["flows/F89-*.yaml", "design-notes BO-130", "contracts/spine/tenancy.yaml#setOfflinePolicy", "ADR-0013 (POS offline position)"]
    open:
      - {question: "Flow step 5 resolves on BO-037 but the resolve form lives on BO-130; which screen draws it?", default: "Draw the rejections list and Resolve on BO-130 (Block A)."}

  F90:
    title: An audience is built, offered to, and the result is judged
    process: ticketing-backoffice
    trigger: A venue wants to reach a particular kind of guest with a particular offer. Client chain RET-5D, RET-5E, RET-5C.
    actors:
      - {role: "marketer", app: "P08 Venue Management", screens: ["BO-119", "BO-010"]}
      - {role: "marketer", app: "P16 Venue Analytics", screens: ["ANL-009"]}
    inputs:
      - name: upsell rule and recommendation decisions
        formats: ["rule form; approve or reject recommendations"]
        limits: per contract
        validation: per contract (BO-119 not Block A)
        source: marketer, BO-119
      - name: promotion publish / pause / simulate
        formats: ["Publish", "Pause", "Simulate on a promotion"]
        limits: one promotion at a time
        validation: Publish refused (409) when it conflicts; a live promotion locks conditions and discount.
        source: marketer, BO-010
      - name: reporting question
        formats: ["natural-language text"]
        limits: 3 to 1000 characters
        validation: Under 3 characters refused.
        source: marketer, ANL-009
    processing:
      - {input: "rule", does: "creates an upsell rule; decides AI recommendations", operation: ["promotions#createUpsellRule", "ai#decideRecommendations"]}
      - {input: "promotion", does: "simulates, publishes, pauses; reads usage, campaigns and codes", operation: ["promotions#simulatePromotion", "promotions#publishPromotion", "promotions#pausePromotion", "promotions#getPromotionUsage", "promotions#listCouponCampaigns", "promotions#listCouponCodes"]}
      - {input: "question", does: "answers and lists alerts; AI proposed actions decided", operation: ["reporting#askReportingQuestion", "reporting#listAlerts", "reporting#acknowledgeAlert", "ai#decideProposedAction"]}
    outputs:
      - name: promotion usage
        states: {loading: "reading", empty: "no redemptions yet", ready: "redemptions and discount given against the budget cap"}
        failure_branches: [{what: "a step not licensed", sees: "chain stops at the module boundary", recover: none}]
      - name: simulation result
        states: {ready: "projected effect before publishing"}
        failure_branches: [{what: "publish conflict", sees: "refusal names the conflict", recover: "change stacking or end the other promotion"}]
    steps:
      - {frame: 1, screen: "BO-119", blockA: false, sees: "cross-sell and upsell rules", does: "builds an audience rule and decides recommendations", operation: "promotions#createUpsellRule, ai#decideRecommendations", result: "who gets the offer"}
      - {frame: 2, screen: "BO-010", blockA: true, sees: "promotion with Simulate and Publish", does: "simulates then publishes; later reads usage", operation: "promotions#simulatePromotion, promotions#publishPromotion, promotions#getPromotionUsage", result: "offer live; usage visible"}
      - {frame: 3, screen: "ANL-009", blockA: false, sees: "AI assistant and alerts", does: "asks how it performed; acknowledges alerts", operation: "reporting#askReportingQuestion, reporting#listAlerts", result: "result judged"}
    motion:
      - Usage counters on BO-010 update on refresh (no live push specified).
    decisions: ["Answers 2 Oct line 19 and 34 (commercial pack screens merge into BO-008 to BO-011)"]
    sources: ["flows/F90-*.yaml", "client boards RET-5D", "RET-5E", "RET-5C", "design-notes BO-010"]
    open:
      - {question: "Where is the audience (segment) itself built in Block A?", default: "BO-119 is later; draw the audience as the promotion's eligibility conditions on BO-010."}

  F156:
    title: "Promotions & Bundles board 3: Coupon & Promo Code Command Center (Block A segment: code distribution)"
    process: ticketing-backoffice
    trigger: Client board walk-through (derived from the screens' navigation; the business reason is not written). Block A touches only ADM-164 Code Distribution & Assignment Manager, reached from the board hub ADM-158.
    actors:
      - {role: "venueManager / marketer", app: "P08 Venue Management (ADM- workshop screens moved to the venue, answers 2 Oct line 19)", screens: ["ADM-158", "ADM-164"]}
    inputs:
      - name: code assignment
        formats: ["assignee type first (individual customer, customer segment, membership account, B2B company, reseller, travel agency, school, hotel, bank, corporate partner, marketing campaign), then a picker of that type's records; quantity; channel (email, SMS, WhatsApp, mobile app, CRM journey, guest portal, B2B portal, partner portal, POS, call centre, API, exported batch)"]
        limits: quantity cannot exceed the unassigned codes in the batch
        validation: "Over-quantity refused; default message 'Only {n} codes are unassigned in this batch.' (see open)"
        source: marketer, ADM-164
    processing:
      - {input: "code assignment", does: "assigns codes and records the distribution channel", operation: "promotions#setCodeDistributionManager"}
      - {input: none, does: "lists the batch's codes", operation: "promotions#listCouponCodes"}
    outputs:
      - name: distribution funnel
        states: {loading: "reading", emptyFirstRun: "no batches yet (expected on a new tenant)", ready: "Generated, assigned, sent, delivered, viewed, redeemed, expired, cancelled as a horizontal funnel per batch", emptyNoAccess: "permission named (PRICE_CONFIGURE)"}
        failure_branches: [{what: "operator lacks the permission", sees: "emptyNoAccess", recover: "an admin grants PRICE_CONFIGURE"}]
    steps:
      - {frame: 1, screen: "ADM-158", blockA: false, sees: "board hub with coupon activity", does: "opens Code Distribution", operation: "promotions#listCouponCodes", result: "navigates"}
      - {frame: 2, screen: "ADM-164", blockA: true, sees: "batches with the distribution funnel", does: "picks assignee type, records, quantity and channel; saves", operation: "promotions#setCodeDistributionManager", result: "codes assigned; funnel moves"}
    motion:
      - Funnel bars animate to new widths after an assignment (300 ms ease).
    decisions: ["Answers 2 Oct line 19 (ADM workshop screens are venue screens, P08)"]
    sources: ["flows/F156-*.yaml", "design-notes ADM-164", "contracts/satellite/promotions.yaml#setCodeDistributionManager"]
    open:
      - {question: "The board's reason for walking it is unwritten; other ten frames are later blocks.", default: "Storyboard only the hub and ADM-164."}
      - {question: "Exact over-quantity message", default: "'Only {n} codes are unassigned in this batch.'"}

  F169:
    title: "Ticket Media & Credential board 2: Media Design Studio (Block A segment: PDF, printable and POS ticket designer)"
    process: ticketing-backoffice
    trigger: Client board walk-through (reason not written). Block A touches BO-346 PDF, Printable & POS Ticket Designer, reached from the hub BO-344.
    actors:
      - {role: "venueManager", app: "P08 Venue Management", screens: ["BO-344", "BO-346"]}
