    open:
    - question: Exact layout of the 3D model upload on BO-093 (r1 supports GLB plus the pathway file, answers L435).
      default: A "3D model + navigation file" slot on BO-093 beside the plan, accepting .glb plus .json, with the
        ADR-0069 budget figures as helper text.
    - question: Maximum upload size for the plan and the illustrated map
      default: Show the server's maxSizeBytes from createUpload; helper text 'Up to 200 MB; 12,000 px wide images
        are fine'. (The venue-operations brief proposed plans and manifests <= 50 MB and the illustrated map <= 100
        MB; the GLB refusal over 40 MB is ADR-0069's and stands.)
    - question: Exact error copy for unreadable and wouldStrandPoints
      default: '''We could not read this file. Send it as DWG or DXF if you can.'' and ''Closing this path would leave
        {n} points unreachable: {names}.'''
    - question: No screen is named for the illustrated map upload and its four alignment points.
      default: A section on BO-094 "Guest map artwork" with the upload and four alignment-point pairs.
    - question: Exact copy for the finding codes is not in the package (the server sends message).
      default: Use the wording drafted in inputs.validation; one line per finding, linked to the spec section.
    offline: The authoring side cannot go offline and the guest side must. Import, labelling and publish are back-office
      acts at a desk. The published map, its points and its graph ship in the offline package — a guest standing in
      the middle of a park with no signal is the guest who most needs directions.
