      result: Configure the temporary biometric model separately from Face Pass. The matrix describes Face Tag as
        temporarily stored facial data, enrollable at ticket counters or entry gates, with biometric data permanently
        deleted once the associated ticket is fully redeemed.
    - frame: 10
      screen: BO-189
      screen_name: Face Matching & Verification Thresholds
      block_a: true
      user_sees: 'Sets how a face match is judged per access context (main entry, child protection, attraction): decision
        bands (high confidence = allow if other rules pass; review range = amber operator check; below = deny), liveness,
        duplicate-face check, …'
      user_does: Works in Face Matching & Verification Thresholds
      operations:
      - access#listFaceMatchingVerification
      result: Configure biometric verification behavior. The source requires a configurable Biometric Check Level
        determining the scoring of biometric comparison.
