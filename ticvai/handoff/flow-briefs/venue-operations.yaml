      - resources#getResourceUtilisation
      result: Provide administrators and operational managers with the main entry point for Resource Management and
        an instant overview of the organization's complete resource inventory.
    - frame: 6
      screen: BO-857
      screen_name: Resource Creation & Profile
      block_a: true
      user_sees: 'The workspace for one resource: identity, organisation, operational settings, location, commercial
        and integration sections as tabs, plus setup, teardown and the cleaning policy with a day preview, and the
