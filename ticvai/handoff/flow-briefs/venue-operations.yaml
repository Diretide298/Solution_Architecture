# Flow design briefs, Block A: venue-operations. Written 3 October 2026 by the venue-operations brief agent (Claude) for Claude Design (TODO step 9b).
# Shared brief: audit/ticvai/apply/FLOW-BRIEF-BRIEF.md. Scope: flows whose steps touch a Block A screen or operation
# (handoff/service-docs/op-release.json, tickets under BLOCK-A), filed by the process of the trigger screen.
# Steps, outcomes, branches and states are lifted from flows/, screens/, handoff/design-notes/ and contracts/;
# file inputs, motion and open-question defaults are authored. Answers: audit/ticvai/answers-2-oct-batch1.md (Lnn = line).
process: venue-operations
flows:
  F12:
    title: Asset fails and closes a queue
    process: venue-operations
    block_a:
      screens:
      - EMP-026
      - EMP-004
      - EMP-005
      - BO-030
      - BO-069
      operations:
      - maintenance#completeWorkOrder
      - maintenance#listWorkOrders
      - maintenance#reportIncident
      - maintenance#updateAsset
      - maintenance#verifyWorkOrder
      screens_outside_block_a: []
    trigger:
      description: A ride stops. A technician is dispatched, works on it, and it returns to service — or does not.
        The guest app must stop advertising a queue for a ride nobody can board.
      entry_screen: EMP-026
      entry_points:
      - Operator reports a fault
      - Sensor or alarm
      - Scheduled inspection finds it
    actors:
      roles:
      - technician
      apps:
      - Staff App (P06)
      - Venue Management (P08)
      - Guest App (P02)
    offline: The employee app half works offline — a technician in a plant room has no signal and still needs to record
      what they found. The cascade to the queue and the guest app does not.
    inputs:
    - name: Kind
      screen: EMP-026
      validation: Large tiles with icons, in this order - Guest injured, Staff injured, Near miss, Property damage,
        Equipment failure, Security, Fire or evacuation, Food safety, Environmental, Other. Equipment failure offers
        "Also raise a fault for repair" after sending.
      source: technician on EMP-026 Incident report
      ref: contracts/satellite/maintenance.yaml#/components/schemas/IncidentKind | F69 step 1
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Severity
      screen: EMP-026
      validation: Four chips Minor, Moderate, Major, Critical with one-line meanings under each; when the kind is
        Near miss the severity is set to Near miss and hidden. Critical turns the Send button red and adds "Your supervisor
        will be called".
      source: technician on EMP-026 Incident report
      ref: contracts/satellite/maintenance.yaml#/components/schemas/IncidentSeverity | F08 step 6
      formats:
      - text field (derived from the EMP-026 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: When
      screen: EMP-026
      limits:
      - limited to today and yesterday (occurredAt cannot b
      validation: Defaults to now in venue time; "Earlier" opens a time picker limited to today and yesterday (occurredAt
        cannot be in the future).
      source: technician on EMP-026 Incident report
      ref: contracts/satellite/maintenance.yaml#reportIncident
      formats:
      - pick list (select) (derived)
    - name: Where
      screen: EMP-026
      limits:
      - max 500
      validation: Scan an asset tag, or pick the zone on a short list, or type a location (max 500). Never an id.
      source: technician on EMP-026 Incident report
      ref: screens/P06-staff-app.yaml#EMP-026 | contracts/satellite/maintenance.yaml#reportIncident
      formats:
      - pick list (select) (derived)
    - name: What happened
      screen: EMP-026
      limits:
      - at least 3 characters
      - max 10
      validation: Required, at least 3 characters, max 10,000; voice-to-text offered. This text is the original report
        and is never edited afterwards - say so under the field.
      source: technician on EMP-026 Incident report
      ref: contracts/satellite/maintenance.yaml#updateIncident | F69 step 2
      formats:
      - text field (derived)
    - name: People involved
      screen: EMP-026
      validation: '"Add a guest" (scan their ticket or wristband, or name and phone held in the protected store) and
        "Add a colleague" (staff picker); the incident keeps references only. Witness count as a stepper. First aid
        given and Emergency services called as two yes/no switches, off by default.'
      source: technician on EMP-026 Incident report
      ref: contracts/satellite/maintenance.yaml#/components/schemas/IncidentInvolvedParty | contracts/satellite/maintenance.yaml#reportIncident
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Photos
      screen: EMP-026
      formats:
      - CAMERA
      validation: At the top, camera first, as on Raise a task; optional but prompted.
      source: technician on EMP-026 Incident report
      ref: DI-232 | contracts/satellite/maintenance.yaml#reportIncident
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: View switch (replaces the id and text filters)
      screen: EMP-004
      validation: Three segments at the top - "Mine" (assigned to me, default), "Available" (open, unassigned, my
        venue), "Overdue". Status and priority are chips under a filter icon (Open, Assigned, In progress, Paused,
        Awaiting parts, Completed; Emergency to Low), never text boxes. "Assigned to principal id" and "Asset id"
        are not drawn; the asset is filtered by scanning its tag.
      source: technician on EMP-004 Task list
      ref: contracts/satellite/maintenance.yaml#listWorkOrders | DI-229
      formats:
      - on/off toggle (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Scan to filter
      screen: EMP-004
      validation: A scan button in the header resolves the asset by tag (works offline) and shows only that asset's
        open work orders - the way a technician arriving at a pump finds the job for it.
      source: technician on EMP-004 Task list
      ref: screens/P06-staff-app.yaml#EMP-004 | contracts/satellite/maintenance.yaml#lookupAsset
      formats:
      - scan (QR / barcode) (derived)
      limits:
      - only that asset's open work orders - the way a technici (derived)
    - name: Start
      screen: EMP-005
      validation: 'One big Start button; if the asset has a tag, offer "Scan the asset to confirm" first (pack: correct
        asset confirmed where many similar assets stand together). startedAt is the device time, sent even when offline;
        never asked.'
      source: technician on EMP-005 Task detail
      ref: screens/P06-staff-app.yaml#EMP-005 | contracts/satellite/maintenance.yaml#startWorkOrder
      formats:
      - scan (QR / barcode) (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Pause reason
      screen: EMP-005
      limits:
      - max 300
      validation: Bottom sheet with the closed list Awaiting parts, Awaiting permit, Awaiting outage window, Awaiting
        specialist, End of shift, Safety concern, Other (note required, max 300). Awaiting parts moves the job to
        Awaiting parts and offers "Link the requisition"; all others to Paused. One Pause button only (see corrections
        on the second timer).
      source: technician on EMP-005 Task detail
      ref: contracts/satellite/maintenance.yaml#pauseWorkOrder | F15 step 1
      formats:
      - text field (derived)
    - name: Evidence
      screen: EMP-005
      formats:
      - CAMERA
      - SIGNATURE
      validation: Camera opens directly; each capture is tagged Before / During / After / Sign-off by the job state
        (Before until Start, During while in progress, After at completion) and can be changed. Video, document, note
        and signature are in a "More" menu. Captures queue offline with a thumbnail and a clock icon.
      source: technician on EMP-005 Task detail
      ref: contracts/satellite/maintenance.yaml#attachWorkOrderEvidence | MATRIX 18.5.1 | DI-232
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Parts used
      screen: EMP-005
      validation: Pre-listed from the parts reserved for this job (from the work order's parts with reservedQuantity)
        with a stepper for quantity used; "Add a part" searches the inventory item list. Hidden offline with "Parts
        are recorded when you are back online" (stock moves in real time).
      source: technician on EMP-005 Task detail
      ref: contracts/satellite/maintenance.yaml#recordWorkOrderParts | DI-925 | TRACKER Actions row 304
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Complete
      screen: EMP-005
      formats:
      - CAMERA
      limits:
      - max 5000
      - max 1000
      validation: A completion sheet - Resolution code as chips (Repaired, Part replaced, Adjusted, Cleaned, No fault
        found, Referred to vendor, Replaced, Deferred), resolution text (required, max 5000), completion photos (required
        where the category demands; the sheet says so before the camera opens), "Follow-up needed" toggle revealing
        a note (max 1000). recordedAt is the device time, never asked.
      source: technician on EMP-005 Task detail
      ref: contracts/satellite/maintenance.yaml#completeWorkOrder | MATRIX 17.4.6
    - name: Filters
      screen: BO-030
      validation: Default "Completed, awaiting verification" for the venue; filter by asset category, technician (name
        picker), priority, overdue - no id text fields.
      source: technician on BO-030 Work Order Verification
      ref: contracts/satellite/maintenance.yaml#listWorkOrders
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Verification outcome and note
      screen: BO-030
      validation: Verify or Reject; Reject requires a note (what is still wrong) and sends the work order back to
        the technician.
      source: technician on BO-030 Work Order Verification
      ref: contracts/satellite/maintenance.yaml#verifyWorkOrder
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: assetTag
      screen: BO-069
      formats:
      - QR
      limits:
      - max 64
      validation: Unique per venue (max 64); duplicate refused with the existing asset named; printed as a QR label.
      source: technician on BO-069 Asset Register
      ref: contracts/satellite/maintenance.yaml#createAsset
    - name: criticality
      screen: BO-069
      validation: Safety critical / Revenue critical / Standard / Low, as a coloured select; Safety critical defaults
        "Inspection required to return to service" on.
      source: technician on BO-069 Asset Register
      ref: contracts/satellite/maintenance.yaml#createAsset
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Fault priority override
      screen: BO-069
      validation: Optional select of the work-order priorities (Low, Normal, High, Urgent, Emergency) with the hint
        "If this asset goes down, raise this priority"; empty means the venue's scoring applies.
      source: technician on BO-069 Asset Register
      ref: DI-909 | DI-923 | contracts/satellite/maintenance.yaml#updateAsset
      formats:
      - pick list (select) (derived from the BO-069 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Links
      screen: BO-069
      validation: Linked products (a fault can stop them selling) and linked access point (out of service blocks it),
        as pickers.
      source: technician on BO-069 Asset Register
      ref: contracts/satellite/maintenance.yaml#createAsset
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Documents
      screen: BO-069
      validation: Upload with a name and kind (Manual, SOP, Certificate, Warranty, Drawing, Risk assessment); replaces
        the list as a whole on save.
      source: technician on BO-069 Asset Register
      ref: contracts/satellite/maintenance.yaml#updateAsset | MATRIX 17.1.6
      formats:
      - file upload (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Status change
      screen: BO-069
      validation: In service / Out of service / Under maintenance / Awaiting parts / Retired / Disposed with a required
        reason; returning to In service asks for the inspection when the asset requires one; optional "Raise a work
        order".
      source: technician on BO-069 Asset Register
      ref: contracts/satellite/maintenance.yaml#setAssetStatus
      formats:
      - multi-select list (derived from the BO-069 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    processing:
    - operation: maintenance#reportIncident
      what: Report an incident
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#listWorkOrders
      what: List work orders
      steps:
      - 2
      block_a: true
      offline_capable: true
    - operation: maintenance#completeWorkOrder
      what: Complete a work order
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#verifyWorkOrder
      what: Supervisor verification
      steps:
      - 4
      block_a: true
      writes: true
    - operation: maintenance#updateAsset
      what: Amend an asset
      steps:
      - 5
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Repaired, verified, back in service, queue reopened
        deferred: Awaiting parts, asset out of service
        escalated: Safety incident referred
      failure_branches:
      - at_step: 1
        what_goes_wrong: Asset is not safety-critical
        user_sees: Verification is still required but does not block return. The distinction is on the asset, not
          the judgement of whoever is on shift.
        recovery: recoverable; resolved by Supervisor (not in contracts)
      - at_step: 3
        what_goes_wrong: Part not in stock
        user_sees: Blocks on awaitingParts, and a requisition is raised. The queue stays closed — an asset waiting
          for a part is not an asset in service.
        recovery: requiresStaff; resolved by Storekeeper (not in contracts)
      - at_step: 3
        what_goes_wrong: Technician has no signal in the plant room
        user_sees: Findings queue locally. The work order state moves on sync, and the queue stays closed until it
          does.
        recovery: recoverable; resolved by Automatic (not in contracts)
      - at_step: 4
        what_goes_wrong: Verifier is the person who did the work
        user_sees: Refused. This is the control, and it is enforced rather than trusted.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
      - at_step: 5
        what_goes_wrong: Queue does not reopen after the asset returns
        user_sees: The cascade failed. `maintenance.assetReturnedToService` has two critical consumers for this reason
          — a ride verified and back in service whose queue never reopened is a closed attraction nobody closed.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
      - at_step: 1
        what_goes_wrong: Fault is reported during trading with a full queue
        user_sees: Waiting parties are released rather than silently dropped, and told. A guest holding a virtual
          queue place for a closed ride will come back to ask.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
      - at_step: 3
        what_goes_wrong: Second fault found during the work
        user_sees: A new work order linked to the first rather than expanding the original. The asset history has
          to show both.
        recovery: recoverable; resolved by Technician (not in contracts)
    - screen: EMP-026
      name: Incident report
      shows:
      - element: Sent
        rule: '"Reported - INC-2026-0213. Fatima Al Hashimi (duty supervisor) has been told." Offline "Saved - this
          will be sent first when you are back online" with a red count on the home screen.'
      - element: Immediate actions prompt
        rule: After sending, a short checklist the reporter can tick - Area blocked off, Supervisor called, First
          aider called - recorded by the supervisor later as an investigation note, not as fields here.
      states:
        loading: The incident report list.
        error: Could not load. Names which read failed and leaves the incident report untouched.
        emptyFirstRun: Nothing reported yet by you today. Offers Report incident.
        emptyNoResults: Nothing matches the filter on severity, status, isReportable and the incident report are still
          there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `INCIDENT_VIEW`, which `listIncidents` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* …
        offline: Queues locally with the highest sync priority
      failure_branches:
      - screen: EMP-026
        what_goes_wrong: Offline
        user_sees: The report queues ahead of every other pending item; photos upload after the record so the incident
          exists even if a photo fails.
      - screen: EMP-026
        what_goes_wrong: Reporter is not a supervisor
        user_sees: The reporter sees only their own report afterwards; investigation and authority notification are
          not offered (INCIDENT_MANAGE).
      - screen: EMP-026
        what_goes_wrong: Two stewards report the same event
        user_sees: Both are kept; the supervisor links them on EMP-027. The second reporter is not blocked.
    - screen: EMP-004
      name: Task list
      shows:
      - element: Task card
        rule: 'Priority badge with its source in small text (Emergency - asset override / High - scored 78 / Normal
          - manual), title, asset name and location, status step, due time with a red Overdue flag, and the running
          timer. Two timers are different things: "Open 1 h 12 min" (since raised - the resolution …'
      - element: Assigned but not accepted
        rule: Cards assigned to me that I have not accepted show an outlined style with "New - accept or decline"
          and the two buttons on the card itself; accepted work is drawn solid. The gap between assigned and accepted
          is the point of the accept step.
      - element: Sort order
        rule: Emergency and Urgent first, then overdue, then due time; never by arrival. Within equal priority, the
          work nearest to me where location allows (see decisions).
      - element: Sync strip
        rule: Offline, a persistent strip "Offline - 3 actions waiting to sync, list from 10:12"; cards changed offline
          carry a small clock icon until the server confirms them.
      states:
        loading: The task list list.
        error: Could not load. Names which read failed and leaves the task list untouched.
        emptyFirstRun: No task list yet. Offers no create action — this screen declares no operation that makes one;
          distinct from a filter that matched nothing.
        emptyNoResults: Nothing matches the filter on assignedToPrincipalId, status, priority, assetId, overdueOnly
          and the task list are still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `WORK_ORDER_VIEW`, which `listWorkOrders` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
        offline: Local queue. Tasks completed offline sync on return
      failure_branches:
      - screen: EMP-004
        what_goes_wrong: Offline at shift start
        user_sees: The cached list is shown with its age; Accept, Decline and opening a task all work offline; the
          Available segment says "May be out of date - someone else may have taken these".
      - screen: EMP-004
        what_goes_wrong: Two people take the same available task
        user_sees: The second gets "Taken by Maria Santos at 10:14" and the card leaves Available; nothing is lost.
      - screen: EMP-004
        what_goes_wrong: Steward without maintenance rights
        user_sees: Sees their own raised and assigned tasks; Decline and Accept still work (MAINTENANCE_EXECUTE);
          supervisor-only actions are absent on this screen rather than disabled.
      - screen: EMP-004
        what_goes_wrong: Nothing assigned
        user_sees: Empty state "Nothing assigned to you" with a link to the Available segment and its count.
    - screen: EMP-005
      name: Task detail
      shows:
      - element: Header
        rule: Work order number, priority badge with source, asset name and location, status step, the two timers
          (Open since raised; Working while the labour timer runs) and the due time. Safety instructions from the
          asset's SOP document pinned under the header for safety-critical assets.
      - element: Asset panel
        rule: Tap the asset to open its documents (manual, SOP, drawings) and the last five history entries - "Assigned,
          with the asset history attached". Documents open offline only if cached.
      - element: Timeline
        rule: Raised, Assigned, Accepted, Started, Paused (reason), Part reserved, Part issued, Completed - each with
          time and name, newest at the bottom; offline entries marked "on device 10:12, synced 10:40".
      - element: Parts reserved
        rule: Part name, quantity reserved, used so far, status (Reserved, Issued, Released, Expired). Read from the
          work order so it shows offline; the inventory list is the online refresh.
      states:
        loading: The task list.
        error: Could not load. Names which read failed and leaves the task untouched.
        emptyFirstRun: No task yet. Offers Record work order parts (`recordWorkOrderParts`); distinct from a filter
          that matched nothing.
        emptyNoResults: Nothing matches the filter on assignedToPrincipalId, status, priority, assetId, overdueOnly
          and the task are still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `WORK_ORDER_VIEW`, which `listWorkOrders` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
        offline: Editable offline. Findings and photos queue
      failure_branches:
      - screen: EMP-005
        what_goes_wrong: Completing offline
        user_sees: Allowed (completion is offline-capable); parts cannot be recorded offline, so the sheet warns "2
          parts not yet recorded - they will be asked for when you reconnect" and keeps a reminder on the card.
      - screen: EMP-005
        what_goes_wrong: Parts recorded on reconnect but stock has gone
        user_sees: The 409 is shown on the job as "Part not issued - Seal kit SK-24 out of stock" with Request transfer;
          the completion stands.
      - screen: EMP-005
        what_goes_wrong: Safety-critical job completed without after-photos
        user_sees: Complete is refused before sending with "This job needs completion photos" and the camera opens.
      - screen: EMP-005
        what_goes_wrong: Second fault found during the work
        user_sees: '"Raise a linked task" opens EMP-006 pre-filled with the asset; the original job is not expanded.'
      - screen: EMP-005
        what_goes_wrong: Supervisor rejected the completion
        user_sees: The job comes back In progress with a banner showing the verifier's note at the top.
    - screen: BO-030
      name: Work Order Verification
      shows:
      - element: Queue
        rule: Work order number, asset, priority with source, technician, completed at, time waiting for verification,
          safety-critical flag first.
      - element: Evidence panel
        rule: Resolution and code, before/during/after photos in stage order, parts used, sign-off signature; downtime
          minutes.
      states:
        loading: The work order verification list.
        error: Could not load. Names which read failed and leaves the work order verification untouched.
        emptyFirstRun: No work order verification yet. Offers no create action — this screen declares no operation
          that makes one; distinct from a filter that matched nothing.
        emptyNoResults: Nothing matches the filter on assignedToPrincipalId, status, priority, assetId, overdueOnly
          and the work order verification are still there. Names the active filter and offers to …
        emptyNoAccess: Shown when the caller lacks `WORK_ORDER_VIEW`, which `listWorkOrders` requires to show this
          screen, and names that permission. Never an empty table — that reads as *there is no …
      failure_branches:
      - screen: BO-030
        what_goes_wrong: Verifier is the technician who completed it
        user_sees: Verify disabled with "You completed this job - another supervisor must verify".
      - screen: BO-030
        what_goes_wrong: Safety-critical job completed without completion photos
        user_sees: Flag "Missing completion evidence"; Verify still possible only with a note.
    - screen: BO-069
      name: Asset Register
      shows:
      - element: Register
        rule: Tag, name, category, location, criticality, status chip, warranty expiry (amber within 60 days), maintenance
          due flag, open work orders count; filter by category per team (DI-908).
      - element: Asset 360
        rule: As BO-031 summary - documents, warranty, lifecycle history in sequence, location view.
      states:
        loading: The asset register list.
        error: Could not load. Names which read failed and leaves the asset register untouched.
        emptyFirstRun: No asset register yet. Offers Create asset (`createAsset`); distinct from a filter that matched
          nothing.
        emptyNoResults: Nothing matches the filter on venueId, categoryId, status, maintenanceDue and the asset register
          are still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `ASSET_VIEW`, which `listAssets` requires to show this screen,
          and names that permission. Never an empty table — that reads as *there is no data* and …
      failure_branches:
      - screen: BO-069
        what_goes_wrong: Return to service without an inspection on an asset that needs one
        user_sees: Refused with "Complete the inspection first" and a link to start it.
      - screen: BO-069
        what_goes_wrong: Asset retired with open work orders
        user_sees: Warn and list them.
    steps:
    - frame: 1
      screen: EMP-026
      screen_name: Incident report
      block_a: true
      user_sees: Any member of staff records something that happened to a person or a place - an injury, a near miss,
        damage, a fire alarm, a security event - from where it happened, in under a minute, offline if need be.
      user_does: Reports the fault
      operations:
      - maintenance#reportIncident
      result: The asset goes out of service. The queue closes with it — nobody has to remember
    - frame: 2
      screen: EMP-004
      screen_name: Task list
      block_a: true
      user_sees: 'The technician''s and steward''s queue on the Staff App: what is assigned to me, what is waiting
        for someone to take it, and what is overdue, worked one-handed on a phone and offline in a plant room.'
      user_does: Technician picks up the work order
      operations:
      - maintenance#listWorkOrders
      result: Assigned, with the asset history attached
    - frame: 3
      screen: EMP-005
      screen_name: Task detail
      block_a: true
      user_sees: 'The task itself on the Staff App: the technician (or steward for a simple task) accepts, starts,
        works, records what they found, the parts and the time, attaches before and after evidence, and completes
        - offline if the plant room has no …'
      user_does: Works and records findings
      operations:
      - maintenance#completeWorkOrder
      result: Parts and time recorded. Completed, not yet in service
    - frame: 4
      screen: BO-030
      screen_name: Work Order Verification
      block_a: true
      user_sees: 'The supervisor''s verification queue: work orders the technician has completed that need a second
        person to confirm before the asset may return to service.'
      user_does: Supervisor verifies
      operations:
      - maintenance#verifyWorkOrder
      result: By someone other than the person who did the work. Safety-critical assets cannot return without it
    - frame: 5
      screen: BO-069
      screen_name: Asset Register
      block_a: true
      user_sees: 'The venue''s asset register: every ride, turnstile, plant item, vehicle and IT device with its criticality,
        status, warranty, documents and full history, and the fault priority override that says "if this goes down,
        raise this priority".'
      user_does: Asset returns to service
      operations:
      - maintenance#updateAsset
      result: The queue reopens and the guest app offers it again
    motion:
    - what: Guest app queue card
