      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: parentGroupId
      screen: BO-151
      limits:
      - limited to groups of the same venue
      validation: '"Inside group" picker limited to groups of the same venue; a group cannot be placed inside itself
        or its own children.'
      source: venueManager on BO-151 Access Location Grouping
      ref: screens/P08-venue-back-office.yaml#BO-151 | contracts/spine/access.yaml#setAccessPointGroup
      formats:
      - pick list (select) (derived)
    - name: accessPointIds
      screen: BO-151
      validation: Pick from the venue topology tree (park > zone > access point). Show direction icons so a group
        mixing entry and exit gates is visible (entries and exits both roll up).
      source: venueManager on BO-151 Access Location Grouping
      ref: screens/P08-venue-back-office.yaml#BO-151 | contracts/spine/access.yaml#/components/schemas/AccessAccessPointGroup
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    processing:
    - operation: access#listAccessLocationGrouping
      what: Access Location Grouping
      steps:
      - 14
      block_a: false
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Every screen on Access Control board 1 visited
      failure_branches:
      - at_step: 1
        what_goes_wrong: Nothing has been set up on Access Control Command Center yet
        user_sees: The screen declares `emptyFirstRun`. On a new tenant this is the expected state, and it is a different
          situation from an empty result on an established one.
        recovery: expected; resolved by Automatic (not in contracts)
      - at_step: 1
        what_goes_wrong: The operator does not hold the permission this screen requires
        user_sees: The screen declares `emptyNoAccess`. The journey stops here rather than failing later, which is
          the right shape -- but the permission that would satisfy it is not granted by any role in `roles.yaml`.
        recovery: requiresStaff; resolved by Unresolved -- see the permission join (not in contracts)
    - screen: BO-151
      name: Access Location Grouping
      shows:
      - element: Group tree with roll-ups
        rule: Each group row shows Entries, Exits, Current occupancy, Throughput per hour and Capacity as the pack
          lists; where the read does not return them, show the tree and grey the figures with "Live figures on the
          Live Operations board".
      states:
        loading: The access location grouping list.
        error: Could not load. Names which read failed and leaves the access location grouping untouched.
        emptyFirstRun: No access location grouping yet. Carries the create action; distinct from a filter that matched
          nothing.
        emptyNoResults: The filter narrowed it and the access location grouping are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-151
        what_goes_wrong: Access point deactivated after being grouped
        user_sees: Shown struck-through inside the group with "Inactive".
    steps:
    - frame: 1
      screen: BO-144
      screen_name: Access Control Command Center
      block_a: false
      user_sees: 'The landing page of the whole Access Control module and of board 1 (topology): an access manager
        or duty manager sees the estate (venues, access points, gates, devices) and its live state (devices online,
        gates open, occupancy, admission …'
      user_does: Opens Access Control Command Center
      operations:
      - access#listAccess
      result: Central operational/configuration landing page for the complete Access Control module.
    - frame: 14
      screen: BO-151
      screen_name: Access Location Grouping
      block_a: true
      user_sees: Groups access points into named, nestable groups (Main Entrance = Gates 01-04; Adventure Zone = Coaster,
        Drop Tower, Adventure Hall gates) whose scans roll up into one occupancy, entries, exits and throughput figure.
      user_does: Works in Access Location Grouping
      operations:
      - access#listAccessLocationGrouping
      result: Group multiple access points for operational and capacity purposes.
    steps_note: 'Board flow: a hub-and-spoke walk of the client board. Only the landing frame and the Block A frames
      are listed; the other spokes are in block_a.screens_outside_block_a and are not drawn for Block A.'
    motion:
    - what: Command-centre metric tiles
      how: Counts refresh in place (number roll) with the delta against the same time last week (answers L241 rule,
        where the board uses it).
      timing: Refresh on load and on the screen poll interval; no animation beyond the number change
    decisions:
    - 'answers-2-oct-batch1.md L241: 226 | BO-144 | Over what period are Failed scans, Overrides and Security alerts
      counted - today since the venue day start, or a rolling window? | Today since the day start, with the delta
      against the same time last week'
    sources:
    - flows/F111-access-control-board-1-access-control-command-center.yaml
    - derived-from-board
    - handoff/design-notes (screens BO-151)
    open:
    - none
