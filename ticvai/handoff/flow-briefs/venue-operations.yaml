      - resources#getResource
      - resources#getResourceQualifications
      - resources#createResource
      - resources#updateResource
      - resources#setResourceLifecycleState
      - resources#cloneResource
      result: Provide the principal workspace for creating and maintaining an individual resource.
    - frame: 14
      screen: BO-861
      screen_name: Resource Package & Bundle Configuration
      block_a: true
      user_sees: 'Reusable resource packages: a named combination of fixed resources, resource types with quantities,
        and skill-based placeholders ("1 x Technician with AV Level 2") that is booked as one (VIP Cabana = cabana
        + towels + locker + attendant).'
      user_does: Works in Resource Package & Bundle Configuration
      operations:
      - resources#listResourcePackages
      - resources#createResourcePackage
      - resources#updateResourcePackage
      result: Allow commonly used combinations of resources to be predefined and assigned as a single operational
        package.
    steps_note: 'Board flow: a hub-and-spoke walk of the client board. Only the landing frame and the Block A frames
      are listed; the other spokes are in block_a.screens_outside_block_a and are not drawn for Block A.'
    motion:
