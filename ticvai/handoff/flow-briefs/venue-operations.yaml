    - name: Flow outcome (exit states)
      states:
        completed: Every screen on Resource Management Configuration board 1 visited
      failure_branches:
      - at_step: 1
        what_goes_wrong: Nothing has been set up on Resource Management Command Center yet
        user_sees: The screen declares `emptyFirstRun`. On a new tenant this is the expected state, and it is a different
          situation from an empty result on an established one.
        recovery: expected; resolved by Automatic (not in contracts)
      - at_step: 1
        what_goes_wrong: The operator does not hold the permission this screen requires
        user_sees: The screen declares `emptyNoAccess`. The journey stops here rather than failing later, which is
          the right shape -- but the permission that would satisfy it is not granted by any role in `roles.yaml`.
        recovery: requiresStaff; resolved by Unresolved -- see the permission join (not in contracts)
    - screen: BO-857
      name: Resource Creation & Profile
      shows:
      - element: Day preview
        rule: A one-day timeline for a chosen date with bookings, holds, setup/teardown and the cleanings the policy
          places (dotted bands), recalculated as the policy fields change, before saving.
      - element: Readiness checklist
        rule: Right-hand panel "Before this can be activated" listing missing mandatory attributes, no venue assignment,
          no schedule, no category; each line links to the section or screen.
      states:
        loading: The resource creation profile configuration as saved.
        error: Could not load. Names which read failed and leaves the resource creation profile untouched.
        emptyFirstRun: No resource creation profile configured yet. Carries the create action and says what the platform
          does in the meantime.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
        emptyNoResults: Nothing matched. The filter or the scope narrowed it — naming which is what stops somebody
          concluding the record does not exist
      failure_branches:
      - screen: BO-857
        what_goes_wrong: N times a day without a count, or a window ending before it starts
        user_sees: Refused against the field ("Enter how many cleanings a day"; "Window must end after it starts").
      - screen: BO-857
        what_goes_wrong: Possible duplicate (same name and type at the venue)
        user_sees: An AI suggestion banner "Looks like Projector P-17 already exists" with Open and Ignore (VO-R11);
          never blocks save.
    - screen: BO-861
