      source: venueManager on BO-857 Resource Creation & Profile
      ref: screens/P08-venue-back-office.yaml#BO-859 | contracts/satellite/resources.yaml#listResourceAttributes
      formats:
      - number field (derived)
      limits:
      - a number within the contract field bounds (derived)
    - name: Setup and teardown
