  F15:
    title: A part is needed and ordered
    process: venue-operations
    block_a:
      screens:
      - EMP-005
      - BO-084
      operations:
      - maintenance#completeWorkOrder
      - inventory#createGoodsReceipt
      - approvals#decideApprovalRequest
      - approvals#listApprovalRequests
      - maintenance#pauseWorkOrder
      - maintenance#resumeWorkOrder
      screens_outside_block_a:
      - BO-078
      - BO-052
    trigger:
      description: A technician opens a machine, finds the fault, and the part is not on the shelf.
      entry_screen: EMP-005
      entry_points:
      - Work order in progress
      - Stock count found a shortfall
      - Planned maintenance
    actors:
      roles:
      - technician
      apps:
      - Staff App (P06)
      - Venue Management (P08)
    offline: The technician half works offline; procurement does not. A requisition raised in a plant room queues
      and submits on reconnect.
    inputs:
    - name: Filters
      screen: BO-084
      validation: Assigned to me on by default; Raised by me as the other tab. Kind and status are pick-lists of the
        approval kinds and statuses, never free text; Breaching within (minutes) as quick chips 15 / 60 / today.
      source: technician on BO-084 Approval Inbox
      ref: contracts/spine/approvals.yaml#listApprovalRequests
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Decision comment and reason
      screen: BO-084
      limits:
      - 500 characters
      validation: 'Reason required on reject (500 characters), comment optional on approve (1000) and encouraged:
        six months later it is the only record of why the exception was allowed.'
      source: technician on BO-084 Approval Inbox
      ref: contracts/spine/approvals.yaml#decideApprovalRequest
      formats:
      - text field (derived)
    - name: stepUpToken
      screen: BO-084
      validation: Never a visible field. It is what verifyMfaChallenge returns after the in-place challenge, short-lived
        and single-purpose; the form shows the challenge step, not a token box.
      source: technician on BO-084 Approval Inbox
      ref: contracts/spine/identity.yaml#verifyMfaChallenge
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - screen: EMP-005
      see: venue-operations#F12
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: maintenance#pauseWorkOrder
      what: Stopped, and why
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: inventory#createRequisition
      what: Raise a requisition
      steps:
      - 2
      block_a: false
      writes: true
      offline_capable: true
    - operation: approvals#listApprovalRequests
      what: Requests awaiting a decision, or already decided
      steps:
      - 3
      block_a: true
    - operation: approvals#decideApprovalRequest
      what: Approve, reject, return or ask for information
      steps:
      - 3
      block_a: true
      writes: true
    - operation: inventory#createGoodsReceipt
      what: Receive goods against a purchase order
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: inventory#listPurchaseOrders
      what: List purchase orders
      steps:
      - 4
      block_a: false
    - operation: maintenance#resumeWorkOrder
      what: Back to work
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#completeWorkOrder
      what: Complete a work order
      steps:
      - 5
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Part fitted, asset verified, queue reopened
        deferred: Awaiting delivery, asset out of service
        escalated: Superseded by replacement
      failure_branches:
      - at_step: 1
        what_goes_wrong: The part is in stock at another venue
        user_sees: Inter-venue transfer rather than a purchase (14 August). Faster and cheaper, and the destination
          venue’s system-recorded stock gates whether it can be promised.
        recovery: recoverable; resolved by Storekeeper (not in contracts)
      - at_step: 2
        what_goes_wrong: No supplier is set up for the part
        user_sees: Blocks. `BO-083` — a requisition naming a supplier nobody has onboarded cannot become a purchase
          order.
        recovery: requiresStaff; resolved by Storekeeper (not in contracts)
      - at_step: 3
        what_goes_wrong: The requisition is returned for more information
        user_sees: Not a rejection. The technician amends and resubmits without starting again, which is why `approveRequisition`
          has a return decision (CHG-SPF-010).
        recovery: recoverable; resolved by Technician (not in contracts)
      - at_step: 4
        what_goes_wrong: The delivery is short
        user_sees: '`closeTransferShort` or a partial receipt. The difference is a discrepancy to investigate, not
          a silent adjustment.'
        recovery: requiresStaff; resolved by Storekeeper (not in contracts)
      - at_step: 4
        what_goes_wrong: The wrong part arrived
        user_sees: Received and rejected as a separate movement. The work order stays blocked and the requisition
          is raised again.
        recovery: requiresStaff; resolved by Storekeeper (not in contracts)
      - at_step: 5
        what_goes_wrong: The asset was replaced while waiting
        user_sees: '`closeWorkOrder` with outcome supersededByReplacement. A work order that can only end by being
          completed stays open forever when the answer is "never mind".'
        recovery: recoverable; resolved by Supervisor (not in contracts)
      - at_step: 1
        what_goes_wrong: The asset is safety-critical and out of service
        user_sees: The queue stays closed and the guest app stops offering it, for however long the part takes. This
          is the cascade working, and it is why the pause reason matters.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
    - screen: BO-084
      name: Approval Inbox
      shows:
      - element: Queue rows
        rule: Kind as words (Refund above threshold), the subject summary, amount with currency, requester name, venue,
          raised time and SLA remaining; overdue rows red and on top. AI risk band and priority shown as context only,
          never as an approve/reject suggestion.
      - element: Money columns (amount)
        rule: 'Money in the region''s currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3,
          the third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure.'
      states:
        loading: The approval list.
        error: Could not load. Names which read failed and leaves the approval untouched.
        emptyFirstRun: Nothing is waiting, which is the good outcome. An empty queue means every item has been decided;
          it offers no create action, because creating work is not what it needs.
        emptyNoResults: Nothing matches the filter on assignedToMe, raisedByMe, status, kind, breachingWithinMinutes
          and the approval are still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `APPROVAL_VIEW`, which `listApprovalRequests` requires to show
          this screen, and names that permission. Never an empty table — that reads as *there is …
      failure_branches:
      - screen: BO-084
        what_goes_wrong: The request was decided by someone else while open on screen
        user_sees: The decision is refused 409 alreadyDecided; the row updates to who decided and how, nothing is
          lost.
      - screen: BO-084
        what_goes_wrong: A person whose grants cover only some venues, or a link to a record in another venue
        user_sees: The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in);
          a record outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not
          see venue X' message.
      - screen: BO-084
        what_goes_wrong: Can read but not change (holds APPROVAL_VIEW only)
        user_sees: 'Everything reads; the actions needing another permission are not offered as live buttons: APPROVAL_DECIDE
          for Decide approval request; APPROVAL_REQUEST for Escalate approval request. Where the person would reasonably
          expect the action, it shows disabled with the permission named. The server refuses with 403 forbidden …'
      - screen: BO-084
        what_goes_wrong: decideApprovalRequest answers 403
        user_sees: 'Show it as something the person can act on, not a failure: The approver may not decide this request.
          Always carries `refusedReason`, one value per cause — the approver is the requester (`approverIsRequester`),
          is not in the resolved chain (`notInApproverChain`), lacks the permission the rule demands …'
      - screen: BO-084
        what_goes_wrong: decideApprovalRequest answers 409
        user_sees: 'Show it as something the person can act on, not a failure: The request is no longer open for a
          decision. `refusedReason` says which: `alreadyDecided` (approved or rejected), `withdrawn`, `expired` or
          `cancelled`, and `currentStatus` carries the status it is in.'
      - screen: BO-084
        what_goes_wrong: The approver raised the request, or sits outside the resolved chain
        user_sees: Decide is refused 403 with refusedReason (approverIsRequester, notInApproverChain, missing permission
          or step-up); show the reason in words and who can decide instead. Segregation of duties survives delegation.
    - screen: EMP-005
      see: venue-operations#F12
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: EMP-005
      screen_name: Task detail
      block_a: true
      user_sees: 'The task itself on the Staff App: the technician (or steward for a simple task) accepts, starts,
        works, records what they found, the parts and the time, attaches before and after evidence, and completes
        - offline if the plant room has no …'
      user_does: 'Pauses the work order, reason: awaiting parts'
      operations:
      - maintenance#pauseWorkOrder
      result: The reason decides the state. awaitingParts is chased by ordering; paused is chased by asking someone
    - frame: 2
      screen: BO-078
      screen_name: Requisitions
      block_a: false
      user_sees: 'Requisitions is the purchase request: a department asks to buy, its head approves, returns or rejects
        it, quotations are compared, and the approved request becomes a purchase order.'
      user_does: Raises a requisition against the work order
      operations:
      - inventory#createRequisition
      result: Linked, so the job and the purchase find each other
    - frame: 3
      screen: BO-084
      screen_name: Approval Inbox
      block_a: true
      user_sees: 'The approver''s queue in Venue Management: everything waiting on this person (and, toggled, what
        they raised), sorted by what breaches its SLA soonest, with the decision taken in place.'
      user_does: A manager approves it
      operations:
      - approvals#listApprovalRequests
      - approvals#decideApprovalRequest
      result: Value-based routing — a bearing and a compressor are not the same decision
    - frame: 4
      screen: BO-052
      screen_name: Goods Receipt
      block_a: false
      user_sees: Goods Receipt is where the storekeeper books in what actually arrived against a purchase order.
      user_does: The goods arrive and are received
      operations:
      - inventory#createGoodsReceipt
      - inventory#listPurchaseOrders
      result: Stock rises at the venue
    - frame: 5
      screen: EMP-005
      screen_name: Task detail
      block_a: true
      user_sees: 'The task itself on the Staff App: the technician (or steward for a simple task) accepts, starts,
        works, records what they found, the parts and the time, attaches before and after evidence, and completes
        - offline if the plant room has no …'
      user_does: The technician resumes
      operations:
      - maintenance#resumeWorkOrder
      - maintenance#completeWorkOrder
      result: The part is consumed and the movement posts
    motion:
    - none (static configuration screens; the only change on screen is the saved/validation state)
    decisions:
    - 'ids in the flow: CHG-SPF-010'
    - 'EMP-005: Drawn default accepted: Draw Accept and Start only; Travelling/Arrived not drawn. (Chinmay 2026-10-02)'
    - 'EMP-005: Drawn default accepted: Draw a "Checks" section with pass/fail items above Complete, greyed "Not configured
      for this job" when empty. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L385: - Requisitions: one approveRequisition call with its decision (approve / reject
      / return); separate reject/return operations dropped from BO-078.'
    sources:
    - flows/F15-a-part-is-needed-and-ordered.yaml
    - MATRIX 18.5.1
    - DI-232
    - DI-925
    - TRACKER Actions row 304
    - MATRIX 17.4.6
    - DI-231
    - DI-911
    - MATRIX 17.4.8
    - MATRIX 18.2.5
    - ADR-0008
    - ADR-0011
    - DI-306
    - handoff/design-notes (screens EMP-005, BO-084)
    open:
    - none
  F21:
    title: A ride queue fills and a guest is redirected
    process: venue-operations
    block_a:
      screens:
      - GST-022
      - GST-003
      - BO-005
      - EMP-032
      operations:
      - queue#callNextParties
      - queue#getWaitTimes
      - catalogue#listProducts
      - queue#listQueues
      - queue#setWaitTime
      screens_outside_block_a: []
    trigger:
      description: A guest opens the app to decide what to do next, and the ride they wanted has an hour's wait.
      entry_screen: GST-022
      entry_points:
      - Guest app map
      - Signage
      - A push after joining
    actors:
      roles:
      - guest
      apps:
      - Guest App (P02)
      - Venue Management (P08)
      - Staff App (P06)
    offline: Wait times are cached with their age on the guest app. A wait time from twenty minutes ago presented
      as current is worse than none, so the age is always shown (audit R080 (b)).
    inputs:
    - name: Manual wait time
      formats:
      - minutes, whole number
      limits:
      - 0-600 min (default)
      validation:
      - Shown with "Entered by staff, 2 min ago"
      source: Supervisor on EMP-032
    - name: Filters
      screen: GST-022
      validation: Area/zone chips, category, and "Suitable for my party" using heights where known.
      source: guest on GST-022 Attraction Wait Times
      ref: contracts/satellite/queue.yaml#getWaitTimes
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Help me choose
      screen: GST-003
      validation: A banner or button; the answers filter this list (Show everything clears); never a consent step.
        Questions per venue, one to four, three answers each.
      source: guest on GST-003 Buy Tickets
      ref: MoM 29 Sep W4; contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Status
      screen: BO-005
      formats:
      - textField
      validation: Sends `?status=` to `listQueueEntries`.
      source: guest on BO-005 Queue Monitor
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Wait and valid for
      screen: EMP-032
      limits:
      - 60 minutes
      validation: As BO-004 (5-minute stepper, 15/30/60 minutes validity, note).
      source: guest on EMP-032 Manual wait entry
      ref: contracts/satellite/queue.yaml#setWaitTime
      formats:
      - number field (derived)
    processing:
    - operation: queue#getWaitTimes
      what: Wait times across a venue
      steps:
      - 1
      - 2
      block_a: true
      offline_capable: true
    - operation: catalogue#listProducts
      what: List products
      steps:
      - 2
      block_a: true
      offline_capable: true
    - operation: queue#listQueues
      what: List queues
      steps:
      - 3
      block_a: true
      offline_capable: true
    - operation: queue#setWaitTime
      what: Manually set a wait time
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: queue#callNextParties
      what: Call the next parties forward
      steps:
      - 5
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Guest redirected and rode something
        deferred: In a virtual queue
        abandoned: Queue closed, place released
      failure_branches:
      - at_step: 1
        what_goes_wrong: No feed at this attraction
        user_sees: Manual entry, or nothing. A venue with no sensors still has queues, and the platform must not require
          hardware to show a wait.
        recovery: recoverable; resolved by Supervisor (not in contracts)
      - at_step: 1
        what_goes_wrong: The reading is stale
        user_sees: Shown with a caveat, never hidden (decided 28 September, audit R080 (b)). A stale reading comes
          back with `WaitTime.isStale` true and its `asOf`, and the screen shows the wait with its age and a note
          that it may be out of date, as queue.yaml says. A twenty-minute-old wait presented as current sends guests
          to the wrong ride; one presented as twenty minutes old is still worth reading.
        recovery: recoverable; resolved by Automatic (not in contracts)
      - at_step: 4
        what_goes_wrong: The feed dies mid-day
        user_sees: '`getQueueFeedHealth` flags it. Manual entry takes over, and the guest app shows a wait typed by
          a person rather than nothing.'
        recovery: recoverable; resolved by Supervisor (not in contracts)
      - at_step: 3
        what_goes_wrong: The asset goes out of service
        user_sees: The queue closes and waiting parties are released, not silently dropped. A guest holding a place
          for a closed ride will come back to ask.
        recovery: requiresStaff; resolved by Duty manager (not in contracts)
      - at_step: 5
        what_goes_wrong: A called party does not arrive
        user_sees: Held for a window then skipped. Their place is not restored — unlike a waitlist, where being asleep
          is not declining, a called queue place expires because the ride is running.
        recovery: recoverable; resolved by Automatic (not in contracts)
      - at_step: 2
        what_goes_wrong: The guest joins two virtual queues at once
        user_sees: Allowed or not is a venue policy nobody has stated. Allowing it lets one guest hold two places
          while standing in neither.
        recovery: requiresStaff; resolved by Venue manager (not in contracts)
    - screen: GST-022
      name: Attraction Wait Times
      shows:
      - element: Wait list
        rule: Ride name, wait minutes large, source badge (Live, Estimated from throughput, Set by staff, Unavailable),
          "updated n min ago", status (Open, Paused, Closed, Full), height rule; sort by shortest wait with a toggle
          for distance.
      - element: Stale reading
        rule: Minutes shown greyed with "may be out of date"; never hidden.
      states:
        loading: The attraction wait times, read by `getWaitTimes`.
        error: Could not load. Names which read failed and leaves the attraction wait times untouched.
        emptyFirstRun: No attraction wait times yet. Offers no create action — this screen declares no operation that
          makes one — and says so rather than showing an empty table.
        offline: The offline banner shows. A map and route graph already loaded stay usable, so directions do not
          need a signal. Wait times show their last reading marked out of date, never as …
      failure_branches:
      - screen: GST-022
        what_goes_wrong: Offline
        user_sees: Last readings marked out of date, never as live.
    - screen: GST-003
      name: Buy Tickets
      shows:
      - element: product list
        rule: Grouped by the venue's categories, each card with its primary image or clip, tags and from-price; info-only
          products show their label and Call sales / Email sales instead of Book. Transport shows Popular routes first.
      states:
        loading: The event attraction listing list.
        error: Could not load. Names which read failed and leaves the event attraction listing untouched.
        emptyFirstRun: No event attraction listing yet. Offers no create action — this screen declares no operation
          that makes one — and says so rather than showing an empty table.
        emptyNoResults: Nothing matches what was typed or picked; the other tickets are still there. Names it and
          offers to clear it.
        emptyNoAccess: 'There is no permission to name — a guest holds none (ADR-0025: `x-ticvai-permission` is what
          a staff caller must hold; a guest call resolves to the guest''s own data; decided by …'
        offline: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
      failure_branches:
      - screen: GST-003
        what_goes_wrong: Help me choose leaves nothing
        user_sees: Says which answers ruled everything out, with Show everything.
    - screen: BO-005
      name: Queue Monitor
      shows:
      - element: Notified guests after a close or pause
        rule: Show how many waiting guests were released and notified, with the message they received, from the queue
          status result.
      - element: Called parties
        rule: After Call next, show which parties were called and how many remain; each called party is notified in
          their app (and signage where configured).
      states:
        loading: The queue list.
        error: Could not load. Names which read failed and leaves the queue untouched.
        emptyFirstRun: No queue yet. Offers Create queue (`createQueue`); distinct from a filter that matched nothing.
        emptyNoResults: Nothing matches the filter on status and the queue are still there. Names the active filter
          and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `REPORT_VIEW_VENUE`, which `getKpiValues` requires to show this
          screen, and names that permission (the screen's other reads need `QUEUE_VIEW` and say …
      failure_branches:
      - what_goes_wrong: error state on BO-005
        user_sees: Could not load. Names which read failed and leaves the queue untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-005
        user_sees: Shown when the caller lacks `REPORT_VIEW_VENUE`, which `getKpiValues` requires to show this screen,
          and names that permission (the screen's other reads need `QUEUE_VIEW` and say …
        recovery: Ask an administrator for the permission the state names (derived)
    - screen: EMP-032
      name: Manual wait entry
      states:
        loading: The manual wait entry list.
        error: Could not load. Names which read failed and leaves the manual wait entry untouched.
        emptyFirstRun: No manual wait entry yet. Offers no create action — this screen declares no operation that
          makes one — and says so rather than showing an empty table.
        emptyNoResults: Nothing matches the filter on status and the manual wait entry are still there. Names the
          active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `QUEUE_VIEW`, which `getQueue` requires, and names that permission.
          Never an empty table — that reads as *there is no data* and sends somebody to …
        offline: Queues locally. Manual entry exists because a feed died, so it must not need the network the feed
          lost
      failure_branches:
      - screen: EMP-032
        what_goes_wrong: Offline
        user_sees: Queued locally and applied with the device time.
    steps:
    - frame: 1
      screen: GST-022
      screen_name: Attraction Wait Times
      block_a: true
      user_sees: 'The Waits view of At the Venue: every ride''s current wait with where the number comes from and
        how old it is, filtered by area and suitability, leading to joining a virtual queue or picking something shorter.'
      user_does: Guest sees the waits
      operations:
      - queue#getWaitTimes
      result: With the age of each reading
    - frame: 2
      screen: GST-003
      screen_name: Buy Tickets
      block_a: true
      user_sees: 'Buy Tickets: every bookable product and booking flow of the venue, opened from the persistent Buy
        tickets button on every screen (raised centre button, floating or flat per venue).'
      user_does: Picks something shorter from the attractions list
      operations:
      - queue#getWaitTimes
      - catalogue#listProducts
      result: Or joins a virtual queue for the long one. Repointed from GST-059 Plan My Day on 17 August (CF-101)
        — the itinerary planner is deferred to a later release (wave 4, decided 28 September, audit R187) and this
        flow is Wave 2, and choosing a shorter queue does not need a saved plan. No step here reaches GST-059.
    - frame: 3
      screen: BO-005
      screen_name: Queue Monitor
      block_a: true
      user_sees: The supervisor watches queues during operation and calls parties forward.
      user_does: A supervisor sees the queue building
      operations:
      - queue#listQueues
      result: Before guests complain
    - frame: 4
      screen: EMP-032
      screen_name: Manual wait entry
      block_a: true
      user_sees: 'Take over when the wait feed dies: a supervisor at the queue sets the wait by hand, valid for a
        stated time, recorded as a manual reading.'
      user_does: The feed dies and a supervisor types the wait
      operations:
      - queue#setWaitTime
      result: Manual entry is first-class (ADR-0012), not a fallback bolted on
    - frame: 5
      screen: BO-005
      screen_name: Queue Monitor
      block_a: true
      user_sees: The supervisor watches queues during operation and calls parties forward.
      user_does: Parties are called
      operations:
      - queue#callNextParties
      result: From the virtual queue
    motion:
    - what: Wait times
      how: Wait values update in place with the age of each reading ("updated 2 min ago"); stale readings grey out.
      timing: Refresh on poll; age ticks each 60 s
    - what: Party called
      how: 'Push notification and an in-app banner "Your time to ride: return by 14:20" with a countdown.'
      timing: Countdown each 1 s
    decisions:
    - 'ids in the flow: R080 (b), R187'
    sources:
    - flows/F21-a-ride-queue-fills-and-a-guest-is-redirected.yaml
    - CF-101
    - ADR-0012
    - DI-204
    - DI-299
    - DI-1084
    - DI-1111
    - DI-019
    - handoff/design-notes (screens GST-022, GST-003, BO-005, EMP-032)
    open:
    - question: Bounds for a manually entered wait are not in the contract (setWaitTime).
      default: 0-600 minutes, whole minutes; the guest app labels it "Entered by staff".
    - question: Whether a guest may hold two virtual queue places at once. Allowing it means one guest occupies two
        positions while standing in neither.
      default: One virtual queue place per guest at a time (default); joining a second asks to leave the first.
  F23:
    title: A contractor gets a badge and uses it
    process: venue-operations
    block_a:
      screens:
      - SCN-003
      operations:
      - accreditation#decideAccreditationApplication
      - accreditation#getAccreditationApplication
      - access#validateAccess
      screens_outside_block_a:
      - ACC-002
      - ACC-007
      - ACC-005
    trigger:
      description: A contractor needs access to a plant room for a week, and a steward at a service gate must be able
        to check it.
      entry_screen: ACC-002
      entry_points:
      - Contractor applies
      - A sponsor applies on their behalf
      - Bulk upload for an event
    actors:
      roles:
      - contractor
      apps:
      - Accreditation Portal (P11)
      - Staff Scanner (P07)
      - Venue Management (P08)
    offline: The gate half is offline like every other scan. An accreditation is validated from the bundle, which
      is what makes it work at a service entrance with no signal.
    inputs:
    - name: Supporting documents and photo
      formats:
      - 'commission letter: PDF, JPG, PNG'
      - 'badge photo: JPG or PNG'
      limits:
      - accepted formats stated before the picker opens; size not set (default 10 MB per file)
      validation:
      - 'Wrong format: "Upload a PDF, JPG or PNG"'
      - Duplicate applicant is blocked
      source: Contractor on ACC-002 (P11 portal)
    - name: Read
      screen: SCN-003
      formats:
      - CAMERA
      - NFC
      - RFID
      limits:
      - up to SCN-009
      - up to SCN-007
      validation: Camera or RFID/NFC reader always armed; no typing on this screen. A manual-entry button leads to
        SCN-008, lookup to SCN-009, group to SCN-007.
      source: contractor on SCN-003 Ready to scan
      ref: F06 step 4 | contracts/spine/access.yaml#validateAccess
    processing:
    - operation: accreditation#getAccreditationApplication
      what: One application, with where each requirement stands
      steps:
      - 2
      block_a: true
    - operation: accreditation#decideAccreditationApplication
      what: Approve, reject, return for more, or escalate
      steps:
      - 2
      block_a: true
      writes: true
    - operation: accreditation#listMyAccreditationCredentials
      what: The credentials this person holds, with where each is valid
      steps:
      - 3
      block_a: false
    - operation: access#validateAccess
      what: Validate media at an access point and admit or deny
      steps:
      - 4
      - 5
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Badge issued, used and expired cleanly
        deferred: Awaiting a background check
        escalated: Revoked early
      failure_branches:
      - at_step: 2
        what_goes_wrong: Background check required and not complete
        user_sees: Blocks issue. 12.1.x implies verification and names no provider — CF-21, and the workshop question.
        recovery: requiresStaff; resolved by Reviewer (not in contracts)
      - at_step: 4
        what_goes_wrong: The contractor arrives outside their hours
        user_sees: Denied with the reason, which is the hours. A steward needs to say when they may come back, not
          just no.
        recovery: recoverable; resolved by Steward (not in contracts)
      - at_step: 4
        what_goes_wrong: They try a zone the badge does not cover
        user_sees: Denied. Zone-based access is what an admission profile already does — an accreditation is an entitlement
          with a different issuance path.
        recovery: recoverable; resolved by Steward (not in contracts)
      - at_step: 5
        what_goes_wrong: The contract ends early
        user_sees: Revoked, and the blacklist reaches the gate on the next bundle. Until then the badge works — which
          is the argument for short bundle intervals at service gates.
        recovery: requiresStaff; resolved by Venue manager (not in contracts)
      - at_step: 1
        what_goes_wrong: The sponsor company is not registered
        user_sees: Blocks. A contractor with no sponsor is a person with no accountable employer, and that is the
          point of accreditation.
        recovery: requiresStaff; resolved by Reviewer (not in contracts)
      - at_step: 3
        what_goes_wrong: The badge is lost
        user_sees: Reissued, and the old one blacklisted. Both must happen — reissuing without revoking leaves two
          valid badges.
        recovery: requiresStaff; resolved by Reviewer (not in contracts)
    - screen: SCN-003
      name: Ready to scan
      shows:
      - element: Admitted state
        rule: Full-screen green, product and holder name where name-bound, "Admits 3", entries left; tier colour where
          the venue sets it (e.g. orange for child).
      - element: Denied state
        rule: Red, the VO-R06 label in large type plus detail ("Already used 09:58 at Main Plaza Gate 1"), and the
          next action (Lookup, Call supervisor).
      - element: Blocked state
        rule: Distinct from denied (black/red with a shield), no override button, "Call a supervisor".
      - element: Status strip
        rule: Online/offline, package age, scans waiting to sync, access point and direction - always visible.
      states:
        loading: The ready scan list.
        error: Could not load. Names which read failed and leaves the ready scan untouched.
        emptyFirstRun: No ready scan yet. Offers no create action — this screen declares no operation that makes one
          — and says so rather than showing an empty table.
        emptyNoResults: Nothing matches the filter on accessPointId, ticketId, outcome, recordedFrom, recordedTo and
          the ready scan are still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `TICKET_LOOKUP`, which `lookupTicket` requires, and names that
          permission. Never an empty table — that reads as *there is no data* and sends somebody …
        offline: Same loop, different truth. Amber says so. Was a separate screen until 18 August, and the screen
          already had an `offline` state — two places describing one condition is two places …
        admitted: Green, and gone in 1.5 seconds. The absorbed SCN-004. Shows what was admitted and against which
          right; at a gate doing 40 a minute this is the state the device is in most of the …
        denied: Denied with the reason and the time of the previous scan. The reason matters more than the refusal
          — a steward has to explain it to somebody standing in front of them. The …
        overrideRequired: A supervisor override, which requires a permission a steward may not hold, and records who,
          why and when. The absorbed SCN-006.
        blocked: Blacklisted or otherwise barred. No override is offered on the device — this is not a judgement a
          steward makes at a lane. The absorbed SCN-010.
      failure_branches:
      - screen: SCN-003
        what_goes_wrong: Offline
        user_sees: Same loop in amber; validation from the bundle; every scan journalled.
      - screen: SCN-003
        what_goes_wrong: Venue at maximum live occupancy
        user_sees: Denied "Venue full - entry resumes as guests leave".
      - screen: SCN-003
        what_goes_wrong: Waiver incomplete
        user_sees: Denied "Waiver not completed" with where to complete it.
      - screen: SCN-003
        what_goes_wrong: Exit without matching check-out
        user_sees: Next re-entry denied "Exit scan missing - see supervisor".
      - screen: SCN-003
        what_goes_wrong: Accreditation credential presented
        user_sees: Shows the person's photo, organisation, category and zones allowed now.
      - screen: SCN-003
        what_goes_wrong: Face review range
        user_sees: Amber "Check the guest's face" with operator confirm where face thresholds put the match in review.
    steps:
    - frame: 1
      screen: ACC-002
      screen_name: Registration Form
      block_a: false
      user_sees: The application form itself, for an individual applying for themselves or a coordinator applying
        for a member of their organisation.
      user_does: Applies with documents and a photo
      operations: []
      result: Identity, company, what access is needed
    - frame: 2
      screen: ACC-007
      screen_name: Reviewer Application Detail
      block_a: false
      user_sees: 'One application with everything the decision needs: who the person is (photo against their ID document),
        what they applied for, each document and its verification, what this venue knows about them already, and when
        the decision is due.'
      user_does: A reviewer checks and approves
      operations:
      - accreditation#getAccreditationApplication
      - accreditation#decideAccreditationApplication
      result: Through `approvals` — one mechanism, not a fifth
      crosses_device: true
    - frame: 3
      screen: ACC-005
      screen_name: Accreditation Badge
      block_a: false
      user_sees: The holder's own credential, presented at a gate or a service door and read by a steward.
      user_does: The badge is issued
      operations:
      - accreditation#listMyAccreditationCredentials
      result: QR, NFC or printed — `MediaKind` already covers all four
      crosses_device: true
    - frame: 4
      screen: SCN-003
      screen_name: Ready to scan
      block_a: true
      user_sees: 'The screen a scanner sits on all day: a camera/reader target, the access point and direction, the
        offline and package status, and each outcome as a state of the same screen - Admitted (green, gone in 1.5
        s, party size and the right used), …'
      user_does: A steward scans it at a service gate
      operations:
      - access#validateAccess
      result: Against an admission profile with zones and hours
    - frame: 5
      screen: SCN-003
      screen_name: Ready to scan
      block_a: true
      user_sees: 'The screen a scanner sits on all day: a camera/reader target, the access point and direction, the
        offline and package status, and each outcome as a state of the same screen - Admitted (green, gone in 1.5
        s, party size and the right used), …'
      user_does: Revoked immediately when the contract ends
      operations:
      - access#validateAccess
      result: The blacklist is in the bundle, so revocation works offline
    motion:
    - what: Scan result (SCN-003)
      how: Full-screen green (admit) or red (deny, with reason and next action) wash with icon, haptic and tone; returns
        to Ready to scan by itself.
      timing: Result held about 1.5 s, then back to ready
    decisions:
    - 'answers-2-oct-batch1.md L304: one review queue/workspace component used in P11 and P08'
    - 'ids in the flow: CHG-WIR-002, CHG-WIR-001'
    - 'SCN-003: Drawn default accepted: Show name only; photo for accreditation credentials. (Chinmay 2026-10-02)'
    sources:
    - flows/F23-a-contractor-gets-a-badge-and-uses-it.yaml
    - CF-21
    - DI-644
    - DI-627
    - DI-072
    - DI-649
    - DI-013
    - DI-646
    - DI-650
    - DI-574
    - DI-461
    - DI-129
    - handoff/design-notes (screens SCN-003)
    open:
    - question: ACC-002 (and ACC-005, ACC-007) are not in Block A; only the gate scan (SCN-003) is.
      default: Draw the scan frames for Block A; keep the portal frames as the storyboard context, marked "later block".
    - question: File size limit for accreditation documents is not stated (assets.createUpload has none).
      default: 10 MB per file, PDF/JPG/PNG, stated before the picker opens.
    - question: Who runs a background check, and against what. 12.1.x implies verification and names no provider (CF-21).
      default: 'No background-check provider in Block A: the reviewer records the check result manually on ACC-007.'
    - question: Whether an accreditation grants zones directly or names an admission profile that does. Decides whether
        this is 25 operations or 40.
      default: The accreditation names an admission profile (zones and hours come from the profile).
  F26:
    see: ticketing-backoffice#F26
    note: One copy per flow, kept in the owning process (the process of the trigger screen). The venue-operations
      copy was merged into ticketing-backoffice#F26 on 3 Oct.
  F49:
    title: A guest plans a day and follows it
    process: venue-operations
    block_a:
      screens:
      - GST-051
      - GST-053
      - GST-054
      - GST-041
      - GST-059
      operations:
      - venue-map#bookVisitPlan
      - orders#checkoutCart
      - venue-map#generateVisitPlan
      - orders#getCart
      - venue-map#getVisitPlan
      - queue#getWaitTimes
      - venue-map#listVisitPlanAlternatives
      - ai#requestSuggestion
      - ai#sendAiMessage
      - venue-map#updateVisitPlan
      screens_outside_block_a: []
    trigger:
      description: A guest with a whole day and too many options. Planning is the feature a venue sells a full-day
        ticket on. On the app it is the Plan tab (GST-051); on the web, *Plan your visit* in the header (WEB-050).
      entry_screen: GST-051
    actors:
      roles:
      - guest
      apps:
      - Guest App (P02)
      - Guest Web (P01)
    offline: A saved plan reads offline; building or booking one does not. The plan is worth having in a basement;
      making it needs availability nobody can cache.
    inputs:
    - name: Six planning answers
      formats:
      - party (adults, children), heights, days, pace, interests, lunch
      limits:
      - plan per day for the chosen days
      validation:
      - 'Nothing suits the whole party: "Nothing suits everyone on that day" with Change answers'
      source: Guest on GST-051
    - name: Plan request in the guest's own words
      formats:
      - free text or voice to the AI planner
      limits:
      - AI only where the venue has it on and licensed
      validation:
      - 'AI off or failing: the rules plan stays and the AI entry is hidden or shows "The planner is not available
        right now"'
      source: Guest on GST-054
    - name: Party
      screen: GST-051
      validation: Adults 1-8 (age 12+), children 0-8 (3-11); heights per child in bands (under 1.0 m, 1.0-1.2, 1.2-1.4,
        1.4+); the heights step is skipped when no children come.
      source: guest on GST-051 Plan
      ref: screens/P02-guest-mobile-app.yaml#GST-051 | contracts/satellite/venue-map.yaml#generateVisitPlan
      formats:
      - form field (derived)
      limits:
      - 1-8 (derived)
      - 0-8 (derived)
      - 3-11 (derived)
      - 0-1 (derived)
    - name: Days and park per day
      screen: GST-051
      limits:
      - Up to three days
      validation: Up to three days; "Which park each day?" appears only in a multi-venue tenant, one choice per day.
      source: guest on GST-051 Plan
      ref: DI-1112
      formats:
      - date picker (derived)
    - name: Pace
      screen: GST-051
      validation: Packed / Balanced / Relaxed as three cards.
      source: guest on GST-051 Plan
      ref: DI-1098
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Interests, shops, lunch
      screen: GST-051
      validation: Interest chips from the venue's tags; shops shown only when Shopping is chosen; lunch cuisines list
        only those served at the chosen parks and name them ("Indian - Summit Peaks only").
      source: guest on GST-051 Plan
      ref: DI-1100 | DI-1113
      formats:
      - pick list (select) (derived)
      limits:
      - only when Shopping is chosen (derived)
      - only those served at the chosen parks and name them ("I (derived)
    - name: Day tabs
      screen: GST-053
      formats:
      - selectField
      binds: VisitPlan
      validation: Day 1 · Fri 2 Oct · Summit Peaks … one tab per chosen day; the park is the day's `VisitPlan.days[].venueId`
        (client meeting 30 September, MoM 4.7).
      source: guest on GST-053 Your Plan
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Add Fast Track
      screen: GST-053
      formats:
      - toggle
      validation: An add-on from the plan's `addOnSuggestions` (the product GST-048 sells), priced per guest, with
        the queuing time it saves. Sends `updateVisitPlan` with the change kind `addAddOn` (on) or `removeAddOn` (off);
        the add-on is priced at booking (decided by Chinmay, 3 October 2026 (CHG-SPF-012)).
      source: guest on GST-053 Your Plan
      limits:
      - on or off (derived)
    - name: request (chat)
      screen: GST-054
      validation: A chat input with example requests on first open ("Fewer queues", "We have a 4-year-old", "Indian
        food for lunch", "Finish by 5 pm"). The party, dates and pace from GST-053 are context, not re-asked.
      source: guest on GST-054 AI Planner
      ref: screens/P02-guest-mobile-app.yaml#GST-054 (states.emptyFirstRun) | DI-1021
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: promo code
      screen: GST-041
      validation: Same field and the same two refusal messages as the web basket.
      source: guest on GST-041 Checkout Entry
      ref: contracts/spine/orders.yaml#applyCartPromoCode; WEB-010
      formats:
      - text field (derived from the GST-041 layout)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: ticket holder names
      screen: GST-041
      validation: 'Only where a product needs them (season and family passes: first and last name per pass holder;
        resident tickets: Emirates ID number); never for plain day passes. Prefilled for the signed-in guest''s linked
        family.'
      source: guest on GST-041 Checkout Entry
      ref: DI-429; DI-443; DI-434
      formats:
      - form field (derived)
      limits:
      - Only where a product needs them (season and family pass (derived)
    processing:
    - operation: venue-map#generateVisitPlan
      what: Build a visit plan from the party, the dates and what they like
      steps:
      - 1
      block_a: true
      writes: true
    - operation: venue-map#getVisitPlan
      what: A visit plan, at its current version or an earlier one
      steps:
      - 2
      - 6
      block_a: true
      offline_capable: true
    - operation: venue-map#listVisitPlanAlternatives
      what: What could take this item's place
      steps:
      - 2
      block_a: true
    - operation: venue-map#updateVisitPlan
      what: Swap, remove, add, move or undo, as a new version
      steps:
      - 2
      - 3
      - 6
      block_a: true
      writes: true
    - operation: ai#sendAiMessage
      what: Ask
      steps:
      - 3
      block_a: true
      writes: true
    - operation: ai#requestSuggestion
      what: Ask for an answer, however it is currently produced
      steps:
      - 3
      block_a: true
      writes: true
    - operation: venue-map#bookVisitPlan
      what: Book this plan — turn it into cart lines
      steps:
      - 4
      block_a: true
      writes: true
    - operation: orders#getCart
      what: The cart, priced and checked, right now
      steps:
      - 5
      block_a: true
    - operation: orders#checkoutCart
      what: Turn the cart into an order
      steps:
      - 5
      block_a: true
      writes: true
    - operation: queue#getWaitTimes
      what: Wait times across a venue
      steps:
      - 6
      block_a: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        followed: Planned, booked and largely followed.
        planned: Planned and saved but not booked; the plan stays on the Plan tab.
        abandoned: Plans are abandoned constantly and that is normal — the value is in what was attempted.
      failure_branches:
      - at_step: 1
        what_goes_wrong: Nothing suits the whole party on the chosen day (every ride is over a child's height, or
          the park is closed).
        user_sees: Refused with a reason, naming the answer that ruled everything out, and the answers are kept so
          changing one costs nothing.
        recovery: recoverable; resolved by guest (not in contracts)
      - at_step: 1
        what_goes_wrong: A cuisine or shop the guest chose exists at none of the day's park's points (only one park
          has the Indian restaurant).
        user_sees: 'Said, not faked (client meeting 30 September, MoM 4.7): the day is planned from that park''s own
          points, `unmatchedPreferences` names the park that has it, and the guest may move the day there by changing
          answers.'
        recovery: recoverable; resolved by guest (not in contracts)
      - at_step: 3
        what_goes_wrong: AI is off for the venue, not licensed, or the call fails or times out.
        user_sees: Falls back to the rules plan, never to an error. The planner chat says it is unavailable; everything
          on GST-053 keeps working.
        recovery: recoverable; resolved by Automatic (not in contracts)
      - at_step: 4
        what_goes_wrong: An item sold out after the plan was made.
        user_sees: The basket is not built for that item; the guest is told which one and offered a swap, and the
          rest of the plan is kept.
        recovery: recoverable; resolved by guest (not in contracts)
    - screen: GST-051
      name: Plan
      shows:
      - element: Not-at-this-park notice
        rule: A chip or day banner "No Indian restaurant at Summit Peaks. Indian food is at Aqua Park (day 2)."
      states:
        loading: The plan builds in place; the inputs stay on screen.
        error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
        emptyFirstRun: 'No plan yet: the first question is shown. Nothing is saved until *Make my plan*.'
        emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s height):
          says so and offers to change the answers.'
        preferenceNotAtVenue: 'A preference no chosen park can meet (client meeting 30 September, MoM 4.7): a cuisine
          or shop tag with no matching point at any park of the plan is marked on its chip (*Not at …'
        emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose it is;
          a signed-out guest can still build a plan and is asked to sign in only to save or book …
        offline: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
      failure_branches:
      - screen: GST-051
        what_goes_wrong: Offline
        user_sees: Answers kept; Make my plan waits for the connection and says so.
    - screen: GST-053
      name: Your Plan
      shows:
      - element: day timeline
        rule: Arrive, then timed rides and shows with their zone and walking time, lunch at a restaurant serving the
          chosen cuisine, shop or kiosk stops; Fast Track marked on the rides it covers; live waits next to today's
          rides.
      - element: left out
        rule: Items left out for a child's height with the limit; a must-see none of the chosen parks has.
      - element: Not at this park
        rule: Per day, names the cuisine or shop and the park that has it, or says no park has it; lunch is then the
          park's best other restaurant, marked as such.
      - element: estimated total
        rule: For the group and days, labelled an estimate; confirmed in the basket.
      states:
        loading: The plan builds in place; the inputs stay on screen.
        error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
        emptyFirstRun: 'No plan yet: offers the questions (GST-051) or a ready-made plan (GST-052).'
        emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s height):
          says so and offers to change the answers.'
        preferenceNotAtVenue: 'A day whose park cannot meet a preference (client meeting 30 September, MoM 4.7): the
          day is shown in full with the *Not at this park* banner naming the cuisine or shop and where …'
        emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose it is;
          a signed-out guest can still build a plan and is asked to sign in only to save or book …
        offline: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
      failure_branches:
      - what_goes_wrong: error state on GST-053
        user_sees: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on GST-053
        user_sees: A guest holds no permission. A plan that is not theirs says so without saying whose it is; a signed-out
          guest can still build a plan and is asked to sign in only to save or book …
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on GST-053
        user_sees: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
        recovery: Reconnect; the screen picks up where it was (derived)
    - screen: GST-054
      name: AI Planner
      shows:
      - element: proposed change
        rule: Shown as a before/after on the day timeline (items swapped, moved, removed or added highlighted), with
          one line why and the new wait-time estimates; "Apply this change" commits it, "Not this" leaves the plan
          untouched.
      - element: '"Not at this park" banner'
        rule: 'A preference the day''s park cannot meet is said, not filled: e.g. "No Indian restaurant at Summit
          Peaks. Indian food is at Aqua Park (day 2)." Every suggested ride, dining or retail point (shops and kiosks
          included) comes from that day''s park only.'
      - element: wait times on the plan
        rule: Each ride shows "about 20 min" with its basis on tap; estimates are labelled estimates.
      states:
        loading: The plan builds in place; the inputs stay on screen.
        error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
        emptyFirstRun: 'No conversation yet: the plan is shown with example requests.'
        emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s height):
          says so and offers to change the answers.'
        emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose it is;
          a signed-out guest can still build a plan and is asked to sign in only to save or book …
        offline: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
        aiUnavailable: 'Falls back to the rules plan, never to an error (MOB-6): the plan from `getVisitPlan` stays
          on screen with a short note, and the guest carries on editing it on GST-053.'
      failure_branches:
      - screen: GST-054
        what_goes_wrong: AI unavailable, paused, over budget or not licensed
        user_sees: The plan stays on screen with a short note "The planner can't chat right now - you can still edit
          your plan" and the manual edit controls; never an error page.
      - screen: GST-054
        what_goes_wrong: Nothing suits the whole party (e.g. every ride over a child's height)
        user_sees: Says so and offers to change the answers.
      - screen: GST-054
        what_goes_wrong: The guest asks the planner to book or pay
        user_sees: The agent may prepare the booking but the guest must press Book in the app; it never checks out.
      - screen: GST-054
        what_goes_wrong: Signed-out guest
        user_sees: Can chat and build a plan; asked to sign in only to save or book.
    - screen: GST-041
      name: Checkout Entry
      shows:
      - element: lines
        rule: Same wording as the web; the visit date on each line; a cabana or room line counts down from its own
          hold.
      states:
        loading: Terminal or gateway state, shown plainly
        error: Declined reads differently from unresolved. An unresolved payment inquires rather than retries, and
          nothing is issued until it resolves
        emptyFirstRun: —
        emptyNoResults: 'Never shown: the basket has no filter; an empty basket is the first-run state.'
        emptyNoAccess: This is the checkout page, and it is where identity is settled (ADR-0045, 18 September 2026).
          An unverified or anonymous guest is not turned away — they are offered sign-in or, …
        offline: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
      failure_branches:
      - screen: GST-041
        what_goes_wrong: Consent question unanswered or an answer blocks a line
        user_sees: Checkout returns the guest to the questions; the blocked line is named.
    - screen: GST-059
      name: Plan in Progress
      shows:
      - element: today
        rule: Done, now and next; each ride with its live wait; a stale wait marked "as of".
      - element: waits changed
        rule: '"Vortex is now 50 min. Swap with Lazy River (5 min) and come back at 15:30?" with Re-order my day and
          Keep.'
      states:
        loading: The plan builds in place; the inputs stay on screen.
        error: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
        emptyFirstRun: 'No plan for today: offers to make one (GST-051).'
        emptyNoResults: 'Nothing suits the whole party on that day (for example every ride is over a child''s height):
          says so and offers to change the answers.'
        emptyNoAccess: A guest holds no permission. A plan that is not theirs says so without saying whose it is;
          a signed-out guest can still build a plan and is asked to sign in only to save or book …
        offline: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
      failure_branches:
      - what_goes_wrong: error state on GST-059
        user_sees: Could not load the plan. Names what failed; the inputs are kept so trying again costs nothing.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on GST-059
        user_sees: A guest holds no permission. A plan that is not theirs says so without saying whose it is; a signed-out
          guest can still build a plan and is asked to sign in only to save or book …
        recovery: Ask an administrator for the permission the state names (derived)
      - what_goes_wrong: offline state on GST-059
        user_sees: The offline banner shows. What was already loaded stays on screen, marked with its age. Anything
          that spends money, holds capacity or changes the account waits for the connection, …
        recovery: Reconnect; the screen picks up where it was (derived)
    steps:
    - frame: 1
      screen: GST-051
      screen_name: Plan
      block_a: true
      user_sees: 'The Plan tab: six questions (party, children''s heights, days, park per day in a multi-park tenant,
        pace, interests and shops, lunch cuisine) produce a rules-based day-by-day plan (no AI).'
      user_does: They answer six questions (party, heights, days, pace, interests, lunch) and choose Make my plan.
      operations:
      - venue-map#generateVisitPlan
      result: 'The rules planner, no AI. A plan per day that leaves out rides over a child''s height and plans lunch
        where the chosen cuisine is served. Each day uses only its own park''s rides, dining and retail (shops and
        kiosks) in a multi-venue tenant (client meeting 30 September, MoM 4.7): a cuisine or shop the day''s park
        lacks is reported, never taken from another park.'
    - frame: 2
      screen: GST-053
      screen_name: Your Plan
      block_a: true
      user_sees: 'Your Plan, day by day: swap, remove, add, undo, add Fast Track, then Book this plan.'
      user_does: They swap, remove and add items, undo a change and add Fast Track.
      operations:
      - venue-map#getVisitPlan
      - venue-map#listVisitPlanAlternatives
      - venue-map#updateVisitPlan
      result: Every change is a new version, so undo is one step back. Swap candidates suit everyone in the party.
    - frame: 3
      screen: GST-054
      screen_name: AI Planner
      block_a: true
      user_sees: 'The AI planner: on the Plan tab, the guest asks in their own words to change the rules-built day
        plan ("less walking", "lunch near the wave pool", "add a show after 4") and the planner agent proposes a change
        the guest applies as a new …'
      user_does: They ask the AI planner to change the plan in their own words.
      operations:
      - ai#sendAiMessage
      - ai#requestSuggestion
      - venue-map#updateVisitPlan
      result: The agent refines the rules plan through the plan operations (`requestSuggestion` kind `itinerary`,
        guest-allowed since 29 September). With AI off or failing the rules plan stays.
    - frame: 4
      screen: GST-053
      screen_name: Your Plan
      block_a: true
      user_sees: 'Your Plan, day by day: swap, remove, add, undo, add Fast Track, then Book this plan.'
      user_does: They choose Book this plan.
      operations:
      - venue-map#bookVisitPlan
      result: The plan and its add-ons become cart lines; the guest confirms dates and tickets in the basket.
    - frame: 5
      screen: GST-041
      screen_name: Checkout Entry
      block_a: true
      user_sees: The app's basket and the start of checkout.
      user_does: They check out.
      operations:
      - orders#getCart
      - orders#checkoutCart
      result: Paid like any other basket; the tickets land on the Tickets tab.
    - frame: 6
      screen: GST-059
      screen_name: Plan in Progress
      block_a: true
      user_sees: 'Plan in progress: today''s plan while in the venue, re-ordered against live waits.'
      user_does: They follow it through the day.
      operations:
      - venue-map#getVisitPlan
      - queue#getWaitTimes
      - venue-map#updateVisitPlan
      result: Re-ordered as waits change, with the guest deciding. A plan fixed at 9am is a plan abandoned by 11.
      crosses_device: true
    motion:
    - what: Plan builds in place (GST-051 → GST-053)
      how: Plan cards appear one after another in time order while the inputs stay visible.
      timing: About 80 ms stagger per card
    - what: Swap / undo
      how: Swapped item cross-fades to the alternative; Undo restores the previous version with the reverse animation.
      timing: 200 ms
    - what: AI planner answer (GST-054)
      how: Answer streams in token by token (server-sent events), then sources and any proposed plan change appear
        as a card to accept.
      timing: Streaming; card 200 ms
    - what: Plan in progress (GST-059)
      how: Live wait times on each item update in place; when waits change the order, cards re-order with a move animation
        after the guest accepts.
      timing: Waits refresh on the screen poll; move 300 ms
    - what: Walk to the next item
      how: 'Uses the GST-021 navigation: route line along the paths, position dot, camera follow, 3D ↔ 2D (see F26
        motion).'
      timing: As F26
    decisions:
    - 'answers-2-oct-batch1.md L374: AI concierge/chat answers stream (SSE) then sources and proposed action'
    - 'answers-2-oct-batch1.md L384: visit plan add-ons via updateVisitPlan addAddOn/removeAddOn, priced at booking'
    - ADR-0069 (navigation within the plan)
    - 'ids in the flow: R187, MOB-6, R209, GAP-C3'
    - 'GST-053: Drawn default accepted: Draw a Share button; leave it out of the build until confirmed. (Chinmay 2026-10-02)'
    - 'GST-054: Drawn default stands (answer: "Default / recommended accepted"): An item that costs money shows its
      price on the proposal and is added to the cart only when the guest books the plan. (Chinmay 2026-10-02)'
    - 'answers-2-oct-batch1.md L55: 12–15 | GST-054, WEB-008, WEB-044, loyalty (GST-036, WEB-043, BO-827) | Recommended
      | Defaults.'
