  F62:
    title: A ticket will not scan
    process: venue-operations
    block_a:
      screens:
      - SCN-003
      operations:
      - access#listScans
      - access#lookupTicket
      - access#validateAccess
      screens_outside_block_a:
      - SCN-008
      - SCN-009
    trigger:
      description: A guest presents something the scanner cannot read — a damaged code, a screenshot of a screenshot,
        the wrong day.
    actors:
      roles:
      - gateOperator
      apps:
      - Staff Scanner (P07)
    offline: Entirely offline-capable, and it must be. The exception path is the one most likely to be needed when
      the network is worst, because a busy gate and a strained network arrive together.
    inputs:
    - screen: SCN-003
      see: venue-operations#F23
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: access#lookupTicket
      what: Read-only validity check without admitting
      steps:
      - 1
      - 2
      block_a: true
      offline_capable: true
    - operation: access#listScans
      what: List scan events
      steps:
      - 2
      block_a: true
    - operation: access#validateAccess
      what: Validate media at an access point and admit or deny
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        admittedManually: Found and admitted by hand.
        admittedOnOverride: Allowed against the rules, with a name.
        refused: Refused with a stated reason.
      failure_branches:
      - at_step: 3
        what_goes_wrong: It is not valid and the guest disputes it.
        user_sees: '`overrideAccess` with a name against it. A steward at a gate needs a decision recorded, not a
          rule that leaves them arguing.'
        recovery: high; resolved by access#overrideAccess
    - screen: SCN-003
      see: venue-operations#F23
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: SCN-008
      screen_name: Manual entry
      block_a: false
      user_sees: 'Manual entry when media will not read (damaged QR, dead phone, printed slip): the steward types
        the ticket or media reference exactly - no fuzzy matching - and the result is the same as a scan.'
      user_does: The steward types the reference by hand.
      operations:
      - access#lookupTicket
      result: Typed, not guessed. A lookup that fuzzy-matches will admit the wrong guest at a gate.
    - frame: 2
      screen: SCN-009
      screen_name: Ticket lookup
      block_a: false
      user_sees: 'Read-only ticket lookup: validity, entries used and left, and the complete scan history (gate and
        time of every attempt, outcome and reason) so security can resolve "it says I already used it" - for example
        a scan that marked the ticket …'
      user_does: The ticket is found and its history read.
      operations:
      - access#lookupTicket
      - access#listScans
      result: When and where it was used, if it was. *Already scanned* with no detail is an argument; *scanned at
        North Gate at 10:14* is an answer.
    - frame: 3
      screen: SCN-003
      screen_name: Ready to scan
      block_a: true
      user_sees: 'The screen a scanner sits on all day: a camera/reader target, the access point and direction, the
        offline and package status, and each outcome as a state of the same screen - Admitted (green, gone in 1.5
        s, party size and the right used), …'
      user_does: It is valid. The guest is admitted.
      operations:
      - access#validateAccess
      result: Recorded as a manual admission. The manual rate at a gate is a hardware signal — one lane doing forty
        a day has a broken reader.
    motion:
    - what: Scan result (SCN-003)
      how: Full-screen green (admit) or red (deny, with reason and next action) wash with icon, haptic and tone; returns
        to Ready to scan by itself.
      timing: Result held about 1.5 s, then back to ready
    decisions:
    - 'SCN-003: Drawn default accepted: Show name only; photo for accreditation credentials. (Chinmay 2026-10-02)'
    sources:
    - flows/F62-a-ticket-will-not-scan.yaml
    - DI-644
    - DI-627
    - DI-072
    - DI-649
    - DI-013
    - DI-646
    - DI-650
    - DI-574
    - DI-461
    - DI-129
    - handoff/design-notes (screens SCN-003)
    open:
    - none
  F63:
    title: A gate goes offline and reconciles
    process: venue-operations
    block_a:
      screens:
      - SCN-014
      operations:
      - access#getOfflinePackage
      - access#syncScans
      screens_outside_block_a:
      - SCN-015
      - SCN-013
    trigger:
      description: The network drops at a gate mid-session. Nobody decides this — the device notices and keeps admitting.
    actors:
      roles:
      - gateOperator
      apps:
      - Staff Scanner (P07)
    offline: This flow is the offline behaviour. The package was pulled before the session; every decision is local.
    inputs:
    - name: Workstation id
      screen: SCN-014
      formats:
      - textField
      validation: Sends `?workstationId=` to `listSyncRejections`.
      source: gateOperator on SCN-014 Sync & reconciliation
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Kind
      screen: SCN-014
      formats:
      - selectField
      validation: Sends `?kind=` to `listSyncRejections`.
      source: gateOperator on SCN-014 Sync & reconciliation
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Resolved
      screen: SCN-014
      formats:
      - toggle
      validation: Sends `?resolved=` to `listSyncRejections`.
      source: gateOperator on SCN-014 Sync & reconciliation
      limits:
      - on or off (derived)
    - name: Search
      screen: SCN-014
      formats:
      - searchField
      validation: A search that returns nothing must say so differently from a search not yet run.
      source: gateOperator on SCN-014 Sync & reconciliation
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    processing:
    - operation: access#getOfflinePackage
      what: Entitlement and rule set for offline validation
      steps:
      - 1
      block_a: true
    - operation: access#syncScans
      what: Replay scans recorded offline
      steps:
      - 3
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        syncedClean: All scans posted.
        syncedWithDuplicates: Occupancy was wrong and by how much is visible.
      failure_branches:
      - at_step: 2
        what_goes_wrong: The same guest is scanned at two lanes, both offline.
        user_sees: Both post and the duplicate is a reconciliation task. The guest is inside either way; the question
          is which lane counted them, and occupancy was wrong for a period.
        recovery: medium; resolved by access#syncScans
      - at_step: 2
        what_goes_wrong: The offline window exceeds the venue policy.
        user_sees: The gate keeps admitting. Unlike a till, a gate that stops is a crowd — `maxOfflineHours` warns
          here rather than blocking.
        recovery: high; resolved by tenancy#setOfflinePolicy
    - screen: SCN-014
      name: Sync & reconciliation
      shows:
      - element: Sync summary
        rule: Sent, accepted, rejected counts with recorded and synced times.
      - element: Rejections
        rule: Each rejected scan with ticket, gate, device time and the server's reason; marked "for the duty manager"
          (resolved in BO-038).
      states:
        loading: The sync reconciliation list.
        error: Could not load. Names which read failed and leaves the sync reconciliation untouched.
        emptyFirstRun: No sync reconciliation yet. Offers no create action — this screen declares no operation that
          makes one — and says so rather than showing an empty table.
        emptyNoResults: Nothing matches the filter on workstationId, kind, resolved and the sync reconciliation are
          still there. Names the active filter and offers to clear it.
        emptyNoAccess: Shown when the caller lacks `ORDER_VIEW`, which `listSyncRejections` requires to show this
          screen, and names that permission (the screen's other reads need `ACCESS_VALIDATE`, …
        offline: Not applicable. This screen exists to end the offline period
      failure_branches:
      - screen: SCN-014
        what_goes_wrong: Cross-region pass redeemed here
        user_sees: Shown when the issuing cell later disagrees; surfaced, not silently resolved.
    steps:
    - frame: 1
      screen: SCN-015
      screen_name: Offline package
      block_a: false
      user_sees: 'The offline package on the device: when it was built, its validity window, what it holds (entitlements,
        blacklist, admission profiles, active policy version, accreditation credentials) and a refresh.'
      user_does: The package is already on the device from before the session.
      operations:
      - access#getOfflinePackage
      result: Pulled before, not during. A gate that fetches at first scan has already queued.
    - frame: 2
      screen: SCN-013
      screen_name: Offline journal
      block_a: false
      user_sees: 'The offline journal: every decision the device made while disconnected - admissions and refusals
        - in sequence, waiting to be posted.'
      user_does: Scans journal locally while the network is gone.
      operations: []
      result: Every scan is kept, including the refusals. A refusal offline is as much a record as an admission.
    - frame: 3
      screen: SCN-014
      screen_name: Sync & reconciliation
      block_a: true
      user_sees: 'Ends the offline period: the journal posts in sequence, the server accepts most and may reject some,
        and the steward sees which admissions the server disagreed with (the guest is already inside) so a duty manager
        can deal with them.'
      user_does: The network returns and the journal posts.
      operations:
      - access#syncScans
      result: In sequence, not by timestamp. Two handhelds with clocks a minute apart produce an order nobody can
        reconstruct.
    motion:
    - what: Offline journal
      how: Offline banner with a counter of journalled scans that increments per scan.
      timing: Immediate
    - what: Sync
      how: Counter drains as the journal posts in sequence; duplicates listed after.
      timing: Live
    decisions:
    - 'ids in the flow: CHG-WIR-001'
    sources:
    - flows/F63-a-gate-goes-offline-and-reconciles.yaml
    - DI-065
    - handoff/design-notes (screens SCN-014)
    open:
    - none
  F65:
    title: A task is raised, worked and handed over
    process: venue-operations
    block_a:
      screens:
      - EMP-004
      - EMP-005
      operations:
      - maintenance#acceptWorkOrder
      - maintenance#attachWorkOrderEvidence
      - maintenance#completeWorkOrder
      - maintenance#createWorkOrder
      - maintenance#getWorkOrder
      - maintenance#listWorkOrders
      screens_outside_block_a:
      - EMP-006
      - EMP-007
    trigger:
      description: Somebody notices something — a spill, a broken reader, a queue building. The person who notices
        is rarely the person who fixes it.
    actors:
      roles:
      - supervisor
      apps:
      - Staff App (P06)
    offline: Raising works offline; accepting does not. A task raised on a device with no signal is still a task;
      a task accepted offline is two people walking to the same spill.
    inputs:
    - screen: EMP-004
      see: venue-operations#F12
      note: inputs of this screen are detailed once, in that flow
    - screen: EMP-005
      see: venue-operations#F12
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: maintenance#createWorkOrder
      what: Raise a work order
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#listWorkOrders
      what: List work orders
      steps:
      - 2
      block_a: true
      offline_capable: true
    - operation: maintenance#acceptWorkOrder
      what: The assignee takes the job
      steps:
      - 3
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#getWorkOrder
      what: Read a work order
      steps:
      - 3
      block_a: true
      offline_capable: true
    - operation: maintenance#attachWorkOrderEvidence
      what: Photo, video, document, note or signature
      steps:
      - 3
      - 4
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#completeWorkOrder
      what: Complete a work order
      steps:
      - 4
      block_a: true
      writes: true
      offline_capable: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Done, with evidence.
        handedOver: Open at shift end and visible to the next shift.
        cancelled: No longer needed, with a reason.
      failure_branches:
      - at_step: 3
        what_goes_wrong: The task needs a skill this steward does not have.
        user_sees: Released back to the list with a reason. A task returned is better than a task done badly, and
          the reason is what fixes the routing.
        recovery: medium; resolved by maintenance#pauseWorkOrder
      - at_step: 4
        what_goes_wrong: It cannot be completed this shift.
        user_sees: Paused, not cancelled. A paused task carries into the handover; a cancelled one disappears.
        recovery: medium; resolved by maintenance#pauseWorkOrder
    - screen: EMP-004
      see: venue-operations#F12
      note: outputs of this screen are detailed once, in that flow
    - screen: EMP-005
      see: venue-operations#F12
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: EMP-006
      screen_name: Raise a task
      block_a: false
      user_sees: 'Raise a task from where the problem is, in seconds: a steward sees water on the stairs, a cashier
        sees a dead turnstile, a technician finds a leaking valve.'
      user_does: A steward raises a task.
      operations:
      - maintenance#createWorkOrder
      result: Raised in seconds, from where the problem is. A form that takes a minute is a spill somebody steps around
        instead.
    - frame: 2
      screen: EMP-004
      screen_name: Task list
      block_a: true
      user_sees: 'The technician''s and steward''s queue on the Staff App: what is assigned to me, what is waiting
        for someone to take it, and what is overdue, worked one-handed on a phone and offline in a plant room.'
      user_does: It appears on the list for whoever is free.
      operations:
      - maintenance#listWorkOrders
      result: Ordered by urgency and proximity, not by arrival — a spill on the concourse outranks a bulb in a store
        room raised an hour earlier.
      crosses_device: true
    - frame: 3
      screen: EMP-005
      screen_name: Task detail
      block_a: true
      user_sees: 'The task itself on the Staff App: the technician (or steward for a simple task) accepts, starts,
        works, records what they found, the parts and the time, attaches before and after evidence, and completes
        - offline if the plant room has no …'
      user_does: Someone accepts it and works it.
      operations:
      - maintenance#acceptWorkOrder
      - maintenance#getWorkOrder
      - maintenance#attachWorkOrderEvidence
      result: Accepting is the lock. Two stewards walking to the same task is the failure the list exists to prevent.
    - frame: 4
      screen: EMP-005
      screen_name: Task detail
      block_a: true
      user_sees: 'The task itself on the Staff App: the technician (or steward for a simple task) accepts, starts,
        works, records what they found, the parts and the time, attaches before and after evidence, and completes
        - offline if the plant room has no …'
      user_does: It is completed with evidence.
      operations:
      - maintenance#completeWorkOrder
      - maintenance#attachWorkOrderEvidence
