      ref: screens/P08-venue-back-office.yaml#BO-155 | screens/P08-venue-back-office.yaml#BO-156 | ADR-0068
      formats:
      - text field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: decision (THEN)
      screen: BO-155
      validation: Four large choices with colour - Allow (green), Deny (red), Refer to operator (amber), Override
        eligible (amber outline).
      source: venueManager on BO-155 Visual Access Rule Builder
      ref: contracts/spine/access.yaml#setVisualAccessRule
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: consequences (AND)
      screen: BO-155
      validation: Ordered chips from a closed list (Consume 1 entry, Update attendance +1, Record scan, Trigger alert).
      source: venueManager on BO-155 Visual Access Rule Builder
      ref: screens/P08-venue-back-office.yaml#BO-155
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: AI drafting
      screen: BO-155
      validation: A prompt box "Describe the rule" (e.g. "Allow annual-pass holders into Adventure Park twice per
        day and permit one re-entry if they previously exited"); AI fills the builder for review; nothing saves until
        a person presses Save (VO-R11).
      source: venueManager on BO-155 Visual Access Rule Builder
      ref: screens/P08-venue-back-office.yaml#BO-156
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: age range
      screen: BO-161
      limits:
      - min 3
      - max 11
      validation: Derived from the guest categories chosen (Child 3-11 gives min 3, max 11); editing the numbers directly
        warns if they no longer match the category names.
      source: venueManager on BO-161 Guest, Companion & Eligibility Rules
      ref: contracts/spine/catalogue.yaml#setProductEligibilityRule | R275
      formats:
      - form field (derived)
    - name: heightBandsCm
      screen: BO-161
      validation: Band edges as a slider with labels ("under 1.20 m, 1.20 to 1.40 m, 1.40 m and over"), 50 to 250
        cm.
      source: venueManager on BO-161 Guest, Companion & Eligibility Rules
      ref: contracts/spine/catalogue.yaml#/components/schemas/ProductEligibilityRule
      formats:
      - form field (derived)
      limits:
      - 20 to 1 (derived)
      - 50 to 250 (derived)
    - name: swim ability
      screen: BO-161
      validation: Not a field here any more; it is a consent question attached to the product (link to the consent
        questions).
      source: venueManager on BO-161 Guest, Companion & Eligibility Rules
      ref: REV3-26 | contracts/spine/catalogue.yaml#/components/schemas/ProductEligibilityRule
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: requiredCertificationCode
      screen: BO-161
      validation: For dives and similar, e.g. PADI Open Water; empty means none.
      source: venueManager on BO-161 Guest, Companion & Eligibility Rules
      ref: contracts/spine/catalogue.yaml#/components/schemas/ProductEligibilityRule
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    processing:
    - operation: access#setVisualAccessRule
      what: Visual Access Rule Builder
      steps:
      - 2
      block_a: true
      writes: true
    - operation: access#listGuestCompanionEligibility
      what: Guest, Companion & Eligibility Rules
      steps:
      - 14
      block_a: false
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Every screen on Access Control board 2 visited
      failure_branches:
      - at_step: 1
        what_goes_wrong: Nothing has been set up on Access Rule Command Center yet
        user_sees: The screen declares `emptyFirstRun`. On a new tenant this is the expected state, and it is a different
          situation from an empty result on an established one.
        recovery: expected; resolved by Automatic (not in contracts)
      - at_step: 1
        what_goes_wrong: The operator does not hold the permission this screen requires
        user_sees: The screen declares `emptyNoAccess`. The journey stops here rather than failing later, which is
          the right shape -- but the permission that would satisfy it is not granted by any role in `roles.yaml`.
        recovery: requiresStaff; resolved by Unresolved -- see the permission join (not in contracts)
    - screen: BO-155
      name: Visual Access Rule Builder
      shows:
      - element: Rule as a sentence
        rule: A plain-language rendering above the builder that updates as blocks change ("When an Adventure Day Pass
          is presented at Main Entrance, if visit date is today and entries remain, allow entry and consume 1 entry").
      - element: Test panel
        rule: Virtual scan (product, gate, date-time, prior scans) showing the decision and which condition decided
          it, before publishing.
      states:
        loading: The visual access rule list.
        error: Could not load. Names which read failed and leaves the visual access rule untouched.
        emptyFirstRun: No visual access rule yet. Carries the create action; distinct from a filter that matched nothing.
        emptyNoResults: The filter narrowed it and the visual access rule are still there. Names the active filter
          and offers to clear it.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-155
        what_goes_wrong: Two rules give opposite decisions for the same scan
        user_sees: The test panel shows both and which wins (deny overrides allow); warn before saving.
      - screen: BO-155
        what_goes_wrong: AI draft uses an attribute not in the catalogue
        user_sees: Shown red with "Not available - add it in the attribute catalogue first".
    - screen: BO-161
      name: Guest, Companion & Eligibility Rules
      shows:
      - element: rule summary
        rule: 'Rendered as the guest will read it: "Ages 8 and over; under 12 with an adult; minimum height 1.20 m;
          waiver required".'
      states:
        loading: The guest companion eligibility configuration as saved.
        error: Could not load. Names which read failed and leaves the guest companion eligibility untouched.
        emptyFirstRun: No guest companion eligibility configured yet. Carries the create action and says what the
          platform does in the meantime.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-161
        what_goes_wrong: Product with no rule set
        user_sees: Shown as "Anyone may take part" (the read answers with every limit empty, not an error).
      - screen: BO-161
        what_goes_wrong: Guest found ineligible at the gate
        user_sees: Whether the ticket is refundable then is a setting on this rule (refundableIfIneligibleAtGate);
          show it.
    steps:
    - frame: 1
      screen: BO-154
      screen_name: Access Rule Command Center
      block_a: false
      user_sees: 'The hub of board 2, the admission decision engine: twelve KPI tiles about the rules themselves (active,
        draft, scheduled, pending approval, venues and products covered, conflicts, biometric, override-allowing,
        offline-compatible, recently …'
      user_does: Opens Access Rule Command Center
      operations:
      - access#listAccessRule
      result: Central configuration dashboard for all access and entitlement rules.
    - frame: 2
      screen: BO-155
      screen_name: Visual Access Rule Builder
      block_a: true
      user_sees: 'The no-code access rule builder: WHEN a guest presents (product, membership, pass, credential type)
        AT (venue, park, zone, attraction, gate) IF (conditions) THEN (Allow, Deny, Refer to operator, Override eligible)
        AND (actions such as …'
      user_does: Works in Visual Access Rule Builder
      operations:
      - access#setVisualAccessRule
      result: Provide a no-code rule engine. This is where TICVAI should become significantly easier to configure
        than traditional access-control systems.
    - frame: 14
      screen: BO-161
      screen_name: Guest, Companion & Eligibility Rules
      block_a: true
      user_sees: 'Who may take part in a product: age range, height limits and bands, an accompanying adult below
        an age, guardian signature ages, waiver, required certification.'
      user_does: Works in Guest, Companion & Eligibility Rules
      operations:
      - access#listGuestCompanionEligibility
      result: Apply access conditions based on guest characteristics and relationships.
    steps_note: 'Board flow: a hub-and-spoke walk of the client board. Only the landing frame and the Block A frames
      are listed; the other spokes are in block_a.screens_outside_block_a and are not drawn for Block A.'
    motion:
    - what: Command-centre metric tiles
      how: Counts refresh in place (number roll) with the delta against the same time last week (answers L241 rule,
        where the board uses it).
      timing: Refresh on load and on the screen poll interval; no animation beyond the number change
    decisions:
    - 'ids in the flow: CHG-WIR-001'
    - 'BO-155: Drawn default accepted: Draw the prompt box enabled, with the drafted rule always requiring review.
      (Chinmay 2026-10-02)'
    sources:
    - flows/F112-access-control-board-2-access-rule-command-center.yaml
    - derived-from-board
    - ADR-0068
    - DI-629
    - DI-722
    - ADR-0002
    - TRACKER Actions row 324
    - DI-924
    - ADR-0059
    - handoff/design-notes (screens BO-155, BO-161)
    open:
    - none
  F113:
    title: 'Access Control board 3: Digital Credential Security Command Center'
    process: venue-operations
    block_a:
      screens:
      - BO-166
      - BO-167
      - BO-168
      operations:
      - access#setBleBeaconGeofence
      screens_outside_block_a:
      - BO-164
      - BO-165
      - BO-169
      - BO-170
      - BO-171
      - BO-172
      - BO-173
    trigger:
      description: The work the client grouped as Access Control board 3. This route is read from the screens' own
        navigation, and the reason anyone walks it has still to be written.
      entry_screen: BO-164
      entry_points:
      - Arrives at Digital Credential Security Command Center
    actors:
      roles:
      - venueManager
      apps:
      - Venue Management (P08)
    offline: Not stated by the board. The client's reference does not say, and this flow will not guess.
    inputs:
    - name: beforeActivationDisplay
      screen: BO-166
      limits:
      - at least one
      validation: Multi-select of Hide code, Blur code, Show countdown, Show "Available at the venue", Show directions
        to the venue; at least one.
      source: venueManager on BO-166 Credential Activation & Display Rules
      ref: screens/P08-venue-back-office.yaml#BO-166 | contracts/spine/access.yaml#setCredentialActivationDisplay
      formats:
      - pick list (select) (derived)
    - name: activeDisplay
      screen: BO-166
      formats:
      - QR
      validation: Multi-select of Dynamic QR, Activation timer, Credential status, Remaining entitlements; Dynamic
        QR on by default.
      source: venueManager on BO-166 Credential Activation & Display Rules
      ref: contracts/spine/access.yaml#setCredentialActivationDisplay
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: activationTriggers
      screen: BO-166
      limits:
      - between geofence and beacon
      validation: Condition rows from the pack - Visit date must equal ticket date AND (Inside geofence AND/OR Beacon
        detected) AND Ticket valid AND Registered device - with the AND/OR switch between geofence and beacon. Geofences
        and beacons are picked from BO-168, not typed.
      source: venueManager on BO-166 Credential Activation & Display Rules
      ref: screens/P08-venue-back-office.yaml#BO-166 | contracts/spine/access.yaml#setCredentialActivationDisplay
      formats:
      - on/off toggle (derived)
    - name: maximumActiveDevices / concurrentSessions
      screen: BO-167
      limits:
      - min 1
      validation: Steppers min 1, default 1, as the pack shows.
      source: venueManager on BO-167 Device Binding & Session Security
      ref: screens/P08-venue-back-office.yaml#BO-167 | contracts/spine/access.yaml#setDeviceBindingPolicy
      formats:
      - form field (derived)
    - name: deviceChangePolicy
      screen: BO-167
      validation: Single choice of the five options, default OTP verification required, each with who acts (guest,
        service agent, supervisor).
      source: venueManager on BO-167 Device Binding & Session Security
      ref: screens/P08-venue-back-office.yaml#BO-167 | contracts/spine/access.yaml#setDeviceBindingPolicy | DI-636
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Release reason
      screen: BO-167
      limits:
      - max 500
      validation: Required, max 500, in the Release dialog (e.g. "Lost phone - verified by Emirates ID at Guest Services").
      source: venueManager on BO-167 Device Binding & Session Security
      ref: contracts/spine/access.yaml#releaseCredentialDevice
      formats:
      - text field (derived)
    - name: venueId
      screen: BO-167
      validation: From the session (VO-R03); one policy per venue.
      source: venueManager on BO-167 Device Binding & Session Security
      ref: contracts/spine/access.yaml#setDeviceBindingPolicy
      formats:
      - form field (derived)
      limits:
      - no size or count limit in the package; the bound contract field applies (derived)
    - name: Beacon registry
      screen: BO-168
      validation: Beacon name, beacon id (hardware UUID/major/minor as one string), placement (venue, park, zone,
        attraction, gate pickers that cascade), proximity threshold in metres, Active/Inactive. Health and last detected
        are read-only.
      source: venueManager on BO-168 BLE Beacon & Geofence Configuration
      ref: screens/P08-venue-back-office.yaml#BO-168 | contracts/spine/access.yaml#setBleBeaconGeofence
      formats:
      - pick list (select) (derived)
      limits:
      - one of the listed values; nothing typed free (derived)
    - name: Geofence
      screen: BO-168
      validation: Draw a circle (radius in metres) or polygon on the map; the radius field and the drawn shape stay
        in sync; one or the other, not both.
      source: venueManager on BO-168 BLE Beacon & Geofence Configuration
      ref: contracts/spine/access.yaml#setBleBeaconGeofence
      formats:
      - pick list (select) (derived from the BO-168 layout)
      limits:
      - one of the listed values; nothing typed free (derived)
    processing:
    - operation: access#listCredentialActivationDisplay
      what: Credential Activation & Display Rules
      steps:
      - 4
      block_a: false
    - operation: access#listDeviceBindingSession
      what: Device Binding & Session Security
      steps:
      - 6
      block_a: false
    - operation: access#setBleBeaconGeofence
      what: BLE Beacon & Geofence Configuration
      steps:
      - 8
      block_a: true
      writes: true
    outputs:
    - name: Flow outcome (exit states)
      states:
        completed: Every screen on Access Control board 3 visited
      failure_branches:
      - at_step: 1
        what_goes_wrong: Nothing has been set up on Digital Credential Security Command Center yet
        user_sees: The screen declares `emptyFirstRun`. On a new tenant this is the expected state, and it is a different
          situation from an empty result on an established one.
        recovery: expected; resolved by Automatic (not in contracts)
      - at_step: 1
        what_goes_wrong: The operator does not hold the permission this screen requires
        user_sees: The screen declares `emptyNoAccess`. The journey stops here rather than failing later, which is
          the right shape -- but the permission that would satisfy it is not granted by any role in `roles.yaml`.
        recovery: requiresStaff; resolved by Unresolved -- see the permission join (not in contracts)
    - screen: BO-166
      name: Credential Activation & Display Rules
      shows:
      - element: Phone preview
        rule: Two phone frames side by side, "Before activation" and "Active", rendering the guest screen (GST-055)
          with the chosen options.
      - element: Credential states
        rule: Show the state chain Registered > Hidden/Blurred > Eligible > Active > Validated > Expired/Consumed/Revoked
          as a legend.
      states:
        loading: The credential activation display list.
        error: Could not load. Names which read failed and leaves the credential activation display untouched.
        emptyFirstRun: No credential activation display yet. Carries the create action; distinct from a filter that
          matched nothing.
        emptyNoResults: The filter narrowed it and the credential activation display are still there. Names the active
          filter and offers to clear it.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-166
        what_goes_wrong: Rule requires a beacon but the venue has none registered
        user_sees: Warn "No beacons registered - guests could never activate" and link to BO-168.
      - screen: BO-166
        what_goes_wrong: Guest phone offline
        user_sees: The preview notes the code still activates by time and geofence on the device; activation must
          not depend on the network.
    - screen: BO-167
      name: Device Binding & Session Security
      shows:
      - element: Policy card
        rule: The policy in force from the read's summary ("1 device, 1 session, OTP to change"), with Edit.
      - element: Bindings list
        rule: Titled "Device bindings"; columns Guest, Credential (ticket number), Device (model and a masked reference),
          OS, Registered, Last activation, Last venue, Status. Status Normal / Suspicious (amber) / Blocked (red);
          default sort Blocked and Suspicious first. Cursor paging (VO-R12) - the list grows …
      states:
        loading: The device binding session list.
        error: Could not load. Names which read failed and leaves the device binding session untouched.
        emptyFirstRun: No device binding session yet. Carries the create action; distinct from a filter that matched
          nothing.
        emptyNoResults: The filter narrowed it and the device binding session are still there. Names the active filter
          and offers to clear it.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-167
        what_goes_wrong: Second simultaneous device
        user_sees: Activation blocked and a security alert raised; the row shows Blocked with both devices.
      - screen: BO-167
        what_goes_wrong: Guest changes phone before first use under "allowed before first use"
        user_sees: Self-service rebinding; the row shows the device change in its history.
    - screen: BO-168
      name: BLE Beacon & Geofence Configuration
      shows:
      - element: Map
        rule: Venue map from the topology, geofences as translucent shapes labelled with name and radius, beacons
          as pins coloured by health (Healthy, Degraded, Offline) with last detected time.
      states:
        loading: The ble beacon geofence configuration as saved.
        error: Could not load. Names which read failed and leaves the ble beacon geofence untouched.
        emptyFirstRun: No ble beacon geofence configured yet. Carries the create action and says what the platform
          does in the meantime.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-168
        what_goes_wrong: Beacon offline
        user_sees: Pin red; any activation rule that depends only on it is flagged on BO-166.
    steps:
    - frame: 1
      screen: BO-164
      screen_name: Digital Credential Security Command Center
      block_a: false
      user_sees: 'The command centre of the digital credential security board: KPI tiles (active digital credentials,
        dynamic QR enabled, device-bound, location-protected, offline-ready, revoked today, transfers, security alerts,
        suspicious sessions) and …'
      user_does: Opens Digital Credential Security Command Center
      operations:
      - access#listDigitalCredentialSecurity
      result: Central configuration and monitoring page for all secure digital credentials.
    - frame: 4
      screen: BO-166
      screen_name: Credential Activation & Display Rules
      block_a: true
      user_sees: 'Rules for when a guest may see and use their digital credential: what the app shows before activation
        (hidden, blurred, countdown, "available at the venue", directions) and once active (dynamic QR, activation
        timer, status, remaining …'
      user_does: Works in Credential Activation & Display Rules
      operations:
      - access#listCredentialActivationDisplay
      result: Configure when the guest is permitted to see/use the credential. The matrix specifies that after registration,
        a ticket may appear as a blurred QR and only become clear and usable near the park entrance.
    - frame: 6
      screen: BO-167
      screen_name: Device Binding & Session Security
      block_a: true
      user_sees: 'Stops one credential being used on several phones: the venue''s binding policy (maximum active devices,
        concurrent sessions, what a device change needs - not allowed, allowed before first use, OTP, operator approval,
        supervisor approval) …'
      user_does: Works in Device Binding & Session Security
      operations:
      - access#listDeviceBindingSession
      result: Prevent one credential from being shared across unauthorized devices. The source explicitly requires
        tickets to be linked to a specific device/user and suspicious patterns such as device sharing and multiple
        simultaneous sessions to be detected.
    - frame: 8
      screen: BO-168
      screen_name: BLE Beacon & Geofence Configuration
      block_a: true
      user_sees: Registers the venue's BLE beacons and draws geofences on the venue map, at venue, park, zone, attraction
        or gate level, so credentials can activate or deactivate by location.
      user_does: Works in BLE Beacon & Geofence Configuration
      operations:
      - access#setBleBeaconGeofence
      result: Configure location-aware credential activation. This is a major requirement under 3.1.9. The matrix
        requires BLE beacon proximity and geofence boundaries to activate/deactivate credentials at venue, attraction,
        zone and gate level.
    steps_note: 'Board flow: a hub-and-spoke walk of the client board. Only the landing frame and the Block A frames
      are listed; the other spokes are in block_a.screens_outside_block_a and are not drawn for Block A.'
    motion:
    - what: Command-centre metric tiles
      how: Counts refresh in place (number roll) with the delta against the same time last week (answers L241 rule,
        where the board uses it).
      timing: Refresh on load and on the screen poll interval; no animation beyond the number change
    decisions:
    - 'BO-166: Drawn default accepted: Offer both triggers with AND/OR as the pack shows. (Chinmay 2026-10-02)'
    - 'BO-167: Drawn default accepted: Draw the venue policy with a greyed "Per profile" option. (Chinmay 2026-10-02)'
    sources:
