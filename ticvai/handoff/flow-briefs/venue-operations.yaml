      ref: contracts/satellite/resources.yaml#/components/schemas/Resource
      formats:
      - number field (derived)
      limits:
      - 00-16 (derived)
      - 30-16 (derived)
    - name: Cleaning
      screen: BO-857
      validation: None / After every booking / N times a day. After every booking - minutes per cleaning (5-240, default
        15), added after teardown. N times a day - minutes per cleaning, cleanings per day (1-24) and an optional
        window from-to as time pickers (empty = the resource's opening and closing). Fields appear only for the chosen
        mode.
      source: venueManager on BO-857 Resource Creation & Profile
      ref: contracts/satellite/resources.yaml#/components/schemas/ResourceCleaningPolicy | DI-1012
      formats:
      - pick list (select) (derived from the BO-857 layout)
      limits:
      - 5-240 (derived)
      - 1-24 (derived)
      - only for the chosen mode (derived)
    - name: Deposit and qualifications
      screen: BO-857
      validation: Deposit in AED only for types with deposit applicable; required qualification codes only for types
