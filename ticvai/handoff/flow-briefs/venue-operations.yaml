          approval flag.
      states:
        loading: The resource package bundle configuration as saved.
        error: Could not load. Names which read failed and leaves the resource package bundle untouched.
        emptyFirstRun: No resource package bundle configured yet. Carries the create action and says what the platform
          does in the meantime.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
        emptyNoResults: Nothing matched. The filter or the scope narrowed it — naming which is what stops somebody
          concluding the record does not exist
      failure_branches:
      - what_goes_wrong: error state on BO-861
        user_sees: Could not load. Names which read failed and leaves the resource package bundle untouched.
        recovery: Retry; nothing entered is lost (derived)
      - what_goes_wrong: emptyNoAccess state on BO-861
        user_sees: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
        recovery: Ask an administrator for the permission the state names (derived)
    steps:
    - frame: 1
      screen: BO-854
      screen_name: Resource Management Command Center
      block_a: false
      user_sees: 'The landing page of resource master data for administrators and operations managers: how big the
        permitted resource estate is, what state it is in, where configuration is incomplete, and one-click entry
        to every board 1 screen.'
      user_does: Opens Resource Management Command Center
      operations:
