      states:
        loading: The biometric verification profile configuration as saved.
        error: Could not load. Names which read failed and leaves the biometric verification profile untouched.
        emptyFirstRun: No biometric verification profile configured yet. Carries the create action and says what the
          platform does in the meantime.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
