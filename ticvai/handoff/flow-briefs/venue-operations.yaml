  F67:
    title: A queue is monitored and capacity is held
    process: venue-operations
    block_a:
      screens:
      - EMP-032
      operations:
      - queue#getQueue
      - queue#getWaitTimes
      - queue#listQueueEntries
      - queue#listQueues
      - queue#setWaitTime
      screens_outside_block_a:
      - EMP-031
      - EMP-033
    trigger:
      description: An attraction is filling up and somebody has to decide whether to keep letting people in.
    actors:
      roles:
      - supervisor
      apps:
      - Staff App (P06)
    offline: Readings work offline; capacity decisions do not. A venue-wide capacity call made on one device with
      no signal is a call made without the other lanes.
    inputs:
    - screen: EMP-032
      see: venue-operations#F21
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: queue#listQueues
      what: List queues
      steps:
      - 1
      block_a: true
      offline_capable: true
    - operation: queue#getQueue
      what: Read a queue with live position
      steps:
      - 1
      block_a: true
      offline_capable: true
    - operation: queue#getWaitTimes
      what: Wait times across a venue
      steps:
      - 1
      - 2
      block_a: true
      offline_capable: true
    - operation: queue#listQueueEntries
      what: List entries in a queue
      steps:
      - 1
      block_a: true
    - operation: queue#setWaitTime
      what: Manually set a wait time
      steps:
      - 2
      block_a: true
      writes: true
      offline_capable: true
    - operation: catalogue#listChannelCapacities
      what: List channel capacities
      steps:
      - 3
      block_a: false
    - operation: catalogue#getChannelAllocations
      what: Capacity allocated to each channel
      steps:
      - 3
      block_a: false
    outputs:
    - name: Flow outcome (exit states)
      states:
        withinCapacity: Normal operation.
        holdingAdmission: Venue-wide, not lane-local.
        sensorDistrusted: A manual reading overrode a sensor. Recorded — a beam overridden three times a day is a
          beam to fix.
      failure_branches:
      - at_step: 3
        what_goes_wrong: Occupancy reaches the safety limit.
        user_sees: Channel allocations are pulled back rather than a lane refusing. A capacity limit enforced per
          lane is not a limit — releasing the allocation stops every channel at once, including the web.
        recovery: high; resolved by catalogue#relinquishChannelAllocation
    - screen: EMP-032
      see: venue-operations#F21
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: EMP-031
      screen_name: Queue monitor
      block_a: false
      user_sees: 'A supervisor on the floor sees each ride''s queue: current wait with source, general and virtual-queue
        waits separately, now serving, throughput, no-shows, and alerts (express queue growing, overall wait unusually
        long); can call the next …'
      user_does: The supervisor reads the queue.
      operations:
      - queue#listQueues
      - queue#getQueue
      - queue#getWaitTimes
      - queue#listQueueEntries
      result: 'Adaptor-first (ADR-0012): the reading comes from whatever queue system the venue runs, and the platform
        holds what it reports.'
    - frame: 2
      screen: EMP-032
      screen_name: Manual wait entry
      block_a: true
      user_sees: 'Take over when the wait feed dies: a supervisor at the queue sets the wait by hand, valid for a
        stated time, recorded as a manual reading.'
      user_does: The sensor is wrong, so a wait is entered by hand.
      operations:
      - queue#setWaitTime
      - queue#getWaitTimes
      result: A manual reading is a reading. A supervisor standing at the queue is a better sensor than a broken beam,
        and the source is recorded so nobody trusts the two equally later.
      crosses_device: true
    - frame: 3
      screen: EMP-033
      screen_name: Capacity view
      block_a: false
      user_sees: 'Capacity view: can the next session take a walk-up?'
      user_does: Capacity is checked against occupancy.
      operations:
      - catalogue#listChannelCapacities
      - catalogue#getChannelAllocations
      result: Capacity is an envelope, not a headcount. allocates capacity across channels — holding admission means
        taking it off the channels, which is a venue-wide act rather than a lane one.
      crosses_device: true
    motion:
    - what: Queue monitor
      how: Queue length and wait update in place; a capacity gauge fills toward the safety limit and turns red at
        it.
      timing: Refresh on poll
    decisions:
    - none recorded beyond the flow text
    sources:
    - flows/F67-a-queue-is-monitored-and-capacity-is-held.yaml
    - ADR-0012
    - handoff/design-notes (screens EMP-032)
    open:
    - none
  F68:
    title: A rota is published, worked and swapped
    process: venue-operations
    block_a:
      screens: []
      operations:
      - workforce#listRotaAssignments
      - workforce#recordAttendance
      screens_outside_block_a:
      - EMP-021
      - EMP-022
      - EMP-023
      - EMP-024
      - EMP-025
    trigger:
      description: Next week needs covering, and somebody will want to swap a shift once it is published.
    actors:
      roles:
      - supervisor
      apps:
      - Staff App (P06)
    offline: Clocking in works offline; publishing does not. A rota published from a device with no signal is a rota
      nobody else can see.
    inputs: []
    processing:
    - operation: workforce#listRotaAssignments
      what: The rota
      steps:
      - 1
      - 2
      block_a: true
      offline_capable: true
    - operation: workforce#requestShiftSwap
      what: Ask someone to take your shift
      steps:
      - 3
      block_a: false
      writes: true
    - operation: workforce#recordAttendance
      what: Clock in, clock out, or take a break
      steps:
      - 4
      - 5
      block_a: true
      writes: true
      offline_capable: true
    - operation: workforce#listAttendance
      what: Who was here
      steps:
      - 4
      block_a: false
    outputs:
    - name: Flow outcome (exit states)
      states:
        worked: Rota published, shift worked, attendance recorded.
        swapped: Both consents and an approval recorded.
        noShow: Recorded rather than inferred from silence.
      failure_branches:
      - at_step: 3
        what_goes_wrong: Nobody accepts the swap.
        user_sees: The original assignment stands. An unaccepted swap that silently vacates a shift leaves a lane
          unstaffed.
        recovery: high; resolved by workforce#requestShiftSwap
      - at_step: 4
        what_goes_wrong: They clock in at the wrong venue.
        user_sees: Refused against the rota. A steward at the wrong site is a steward the right site is waiting for.
        recovery: medium; resolved by workforce#recordAttendance
    steps:
    - frame: 1
      screen: EMP-021
      screen_name: Roster
      block_a: false
      user_sees: 'The team roster on the Staff App: a supervisor on the floor sees who is on, where and when - today
        by hour, the week, the month - and who is late or missing.'
      user_does: The steward reads the published rota.
      operations:
      - workforce#listRotaAssignments
      result: Read, not authored. `createRotaAssignment` and `updateRotaAssignment` were on this screen until 24 August
        — a handheld that could write the rota it is showing. The rota is published from the back office; the app
        reads it.
    - frame: 2
      screen: EMP-022
      screen_name: My rota
      block_a: false
      user_sees: 'My rota: a steward''s own shifts - today, the next shift, the week and the month - so they know
        when and where to turn up and see at once when a manager moves them.'
      user_does: A steward reads their own shifts.
      operations:
      - workforce#listRotaAssignments
      result: Read-only, deliberately. `createRotaAssignment` was on this screen until 24 August — a rota a steward
        can rewrite is not a rota.
      crosses_device: true
    - frame: 3
      screen: EMP-023
      screen_name: Swap request
      block_a: false
      user_sees: 'Swap request: a steward asks a named colleague to take one of their published shifts, and follows
        it through the colleague''s acceptance and the supervisor''s approval.'
      user_does: They ask to swap one.
      operations:
      - workforce#requestShiftSwap
      result: A request, not a swap. The other person has to agree and a supervisor has to allow it — two consents,
        and the approval path is the one mechanism CF-132 settled.
      crosses_device: true
    - frame: 4
      screen: EMP-024
      screen_name: Clock in / out
      block_a: false
      user_sees: 'Clock in and out from the phone already in hand: one big button that knows which shift the person
        is on, records the device time, and works with no signal.'
      user_does: On the day, they clock in.
      operations:
      - workforce#recordAttendance
      - workforce#listAttendance
      result: Attendance is not the shift. A rota says who should be there; attendance says who was, and the gap is
        the number a venue manages.
      crosses_device: true
    - frame: 5
      screen: EMP-025
      screen_name: Break management
      block_a: false
      user_sees: 'Break management: a steward takes a break without leaving a gate or counter unstaffed.'
      user_does: They take a break and come back.
      operations:
      - workforce#recordAttendance
      result: Breaks are attendance events. `amendAttendance` is a supervisor act and was on this screen — removed.
      crosses_device: true
    motion:
    - what: Clock in
      how: Clock-in button confirms with a tick and the time.
      timing: 200 ms
    decisions:
    - none recorded beyond the flow text
    sources:
    - flows/F68-a-rota-is-published-worked-and-swapped.yaml
    - CF-132
    open:
    - none
    inputs_note: 'none: the Block A screens of this flow only read'
  F69:
    title: An incident is reported, escalated and closed
    process: venue-operations
    block_a:
      screens:
      - EMP-026
      operations:
      - maintenance#getIncident
      - maintenance#recordAuthorityNotification
      - maintenance#reportIncident
      screens_outside_block_a:
      - EMP-027
      - EMP-038
    trigger:
      description: Something happened — an injury, an evacuation, a theft. The first minutes matter and the record
        matters later.
    actors:
      roles:
      - supervisor
      apps:
      - Staff App (P06)
    offline: Reporting works offline and must. An incident happens where it happens, and a steward who has to walk
      to a signal is a steward not dealing with it.
    inputs:
    - name: Incident photos
      formats:
      - camera or gallery images, several at once
      limits:
      - size not set (default 10 MB each)
      validation:
      - Photos upload after the record so the incident exists even if a photo fails
      source: Steward on EMP-026 (uploadIncidentMedia)
    - screen: EMP-026
      see: venue-operations#F12
      note: inputs of this screen are detailed once, in that flow
    processing:
    - operation: maintenance#reportIncident
      what: Report an incident
      steps:
      - 1
      block_a: true
      writes: true
      offline_capable: true
    - operation: maintenance#getIncident
      what: Read an incident
      steps:
      - 2
      block_a: true
    - operation: maintenance#updateIncident
      what: Investigate, escalate, close or reopen an incident
      steps:
      - 2
      block_a: false
      writes: true
    - operation: maintenance#recordAuthorityNotification
      what: Record notification to an external authority
      steps:
      - 3
      block_a: true
      writes: true
    - operation: workforce#publishAnnouncement
      what: Tell staff something
      steps:
      - 4
      block_a: false
      writes: true
    - operation: workforce#getAnnouncementReach
      what: Who has acknowledged, and who has not
      steps:
      - 4
      block_a: false
    outputs:
    - name: Flow outcome (exit states)
      states:
        closed: Reported, actioned, recorded.
        escalatedToAuthorities: With time and name.
        linkedToCase: A guest is involved and the conversation continues elsewhere.
      failure_branches:
      - at_step: 2
        what_goes_wrong: It involves a guest and becomes a case.
        user_sees: '`createCase` links the incident to the guest record. An incident is what happened; a case is the
          conversation afterwards, and conflating them puts operational detail in a guest-facing thread.'
        recovery: high; resolved by marketing-crm#createCase
      - at_step: 4
        what_goes_wrong: Staff do not acknowledge the announcement.
        user_sees: Escalated by name, not re-broadcast. A second identical message to everybody is a message everybody
          ignores.
        recovery: high; resolved by workforce#getAnnouncementReach
    - screen: EMP-026
      see: venue-operations#F12
      note: outputs of this screen are detailed once, in that flow
    steps:
    - frame: 1
      screen: EMP-026
      screen_name: Incident report
      block_a: true
      user_sees: Any member of staff records something that happened to a person or a place - an injury, a near miss,
        damage, a fire alarm, a security event - from where it happened, in under a minute, offline if need be.
      user_does: A steward reports it from where it happened.
      operations:
      - maintenance#reportIncident
      result: Kind, location, people involved, time. Typed in under a minute or it is typed later and wrongly.
    - frame: 2
      screen: EMP-027
      screen_name: Incident detail
      block_a: false
      user_sees: 'The duty supervisor''s follow-up of an incident on the Staff App: read the original report (never
        edited), add what was found as dated notes, adjust severity, assign an investigator, link a repair, and notify
        the authority where the …'
      user_does: A supervisor reads it and adds detail.
      operations:
      - maintenance#getIncident
      - maintenance#updateIncident
      result: Appended, never overwritten. An incident record edited after the fact is a record that cannot be relied
        on.
      crosses_device: true
    - frame: 3
      screen: EMP-027
      screen_name: Incident detail
      block_a: false
      user_sees: 'The duty supervisor''s follow-up of an incident on the Staff App: read the original report (never
        edited), add what was found as dated notes, adjust severity, assign an investigator, link a repair, and notify
        the authority where the …'
      user_does: Where required, the authorities are notified.
      operations:
      - maintenance#recordAuthorityNotification
      result: The notification is itself a record. *We told the police* with no time and no name is not evidence.
      crosses_device: true
    - frame: 4
      screen: EMP-038
      screen_name: Broadcast to team
      block_a: false
      user_sees: 'Broadcast to team: a supervisor on the floor tells their people something now ("Gate 3 exit-only
        from 17:00") from the phone, targeted by department and role at this venue, and then watches who has read
        it.'
      user_does: If it is a venue-wide event, an announcement goes out.
      operations:
      - workforce#publishAnnouncement
      - workforce#getAnnouncementReach
      result: Reach is measured. An evacuation announcement nobody acknowledged is an evacuation nobody heard.
      crosses_device: true
    motion:
    - what: Critical incident send
      how: Send button turns red with "Your supervisor will be called" when severity is Critical.
      timing: Immediate
    - what: Announcement reach
      how: Acknowledged count rolls up live on EMP-038 ("38 of 52 acknowledged").
      timing: Live
    decisions:
    - 'answers-2-oct-batch1.md L393: EMP-026 binds media upload for photos and a person-involved entry'
    - 'answers-2-oct-batch1.md L297: another supervisor must close a critical incident'
    - 'ids in the flow: CHG-WIR-001, R139 (d)'
    - 'EMP-026: Drawn default accepted: Draw the contract''s ten kinds. (Chinmay 2026-10-02)'
    - 'EMP-026: Drawn default accepted: Draw "Name and phone" fields marked "Stored separately and protected"; offline
      they queue with the report. (Chinmay 2026-10-02)'
    sources:
    - flows/F69-an-incident-is-reported-escalated-and-closed.yaml
    - DI-232
    - MATRIX 17.5.3
    - handoff/design-notes (screens EMP-026)
    open:
    - question: Photo size and count limits for incident media are not stated.
      default: Up to 10 photos, 10 MB each, compressed on the device before upload.
  F111:
    title: 'Access Control board 1: Access Control Command Center'
    process: venue-operations
    block_a:
      screens:
      - BO-151
      operations: []
      screens_outside_block_a:
      - BO-144
      - BO-145
      - BO-146
      - BO-147
      - BO-148
      - BO-149
      - BO-150
      - BO-152
      - BO-153
    trigger:
      description: The work the client grouped as Access Control board 1. This route is read from the screens' own
        navigation, and the reason anyone walks it has still to be written.
      entry_screen: BO-144
      entry_points:
      - Arrives at Access Control Command Center
    actors:
      roles:
      - venueManager
      apps:
      - Venue Management (P08)
    offline: Not stated by the board. The client's reference does not say, and this flow will not guess.
    inputs:
    - name: name
      screen: BO-151
      validation: Required; staff-facing, Arabic variant (VO-R10); e.g. "Main Entrance".
      source: venueManager on BO-151 Access Location Grouping
      ref: contracts/spine/access.yaml#setAccessPointGroup
