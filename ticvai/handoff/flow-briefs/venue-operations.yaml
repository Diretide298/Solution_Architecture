        recovery: expected; resolved by Automatic (not in contracts)
      - at_step: 1
        what_goes_wrong: The operator does not hold the permission this screen requires
        user_sees: The screen declares `emptyNoAccess`. The journey stops here rather than failing later, which is
          the right shape -- but the permission that would satisfy it is not granted by any role in `roles.yaml`.
        recovery: requiresStaff; resolved by Unresolved -- see the permission join (not in contracts)
    - screen: BO-911
      name: Inspection, Condition & Compliance Management
      shows:
      - element: Compliance schedule
        rule: Columns Resource, Type, Last inspection, Next inspection, Frequency, Responsible person, Compliance
          status (Compliant, Due soon, Overdue, Non-compliant), Automatic status (Available or Blocked). Overdue and
          non-compliant first.
      - element: Inspection history
        rule: Per resource, inspections with result, inspector and time, retained for seven years.
      - element: AI pattern note
        rule: '"Projector P-17 failed three power-related inspections in 60 days - consider replacement assessment",
          advisory.'
      states:
        loading: The inspection condition compliance list.
        error: Could not load. Names which read failed and leaves the inspection condition compliance untouched.
        emptyFirstRun: No inspection condition compliance yet. Carries the create action; distinct from a filter that
          matched nothing.
        emptyNoResults: The filter narrowed it and the inspection condition compliance are still there. Names the
          active filter and offers to clear it.
        emptyNoAccess: Names the missing permission. Never an empty table — that reads as *there is no data* and sends
          somebody to support with the wrong question.
      failure_branches:
      - screen: BO-911
        what_goes_wrong: Resource booked when it fails inspection
        user_sees: Blocking lists the future assignments affected and triggers the replacement flow of the resource
          board.
      - screen: BO-911
        what_goes_wrong: Inspection done offline
        user_sees: Queues; the block applies on the device that did it at once and on the server at sync.
