  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.14 Guest Website UX Review — Upsell/Cross-Sell Placement & Reference
      Sites}
  text: >-
    Allam's model reference: a simple card-based family-entertainment-centre site with minimal clicks,
    a right-side cart drawer, "help me choose", clear categories, video that autoplays when a guest taps
    "read more", adapting seamlessly between desktop and mobile. Allam and Qossai want this simplicity
    to guide the guest experience.
  topic: [layout, components, motion]
  scope: [P01, P02]
  status: client-requested
- id: DI-953
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: M18-13}
  text: >-
    Single-event mode page: banner or video hero, a brief description, and a date strip of the next seven
    days with a calendar for later dates.
  topic: [layout, configurability]
  scope: [WEB-004]
  status: agreed
  note: from screen notes
