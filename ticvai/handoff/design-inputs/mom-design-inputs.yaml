  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.12 Virtual Queue - Concept & Lane/Allocation Model}
  text: >-
    Per-ride hourly capacity (e.g. 600/hour) split across express/fast-lane, virtual queue and walk-in
    (illustrative 75% general split walk-in/VQ, 25%/150 express); allocation adjusts dynamically if one
    lane is disproportionately busy.
  topic: [configurability]
  scope: [BO-002, BO-231]
  status: client-requested
