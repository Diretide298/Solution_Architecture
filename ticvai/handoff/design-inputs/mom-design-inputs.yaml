  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.1 AI Governance — Capability Registration, Risk & Autonomy Configuration'}
  text: >-
    AI policy testing lets administrators preview what would be allowed or blocked before a governance
    policy is published; policy conflicts (e.g. an AI price increase above a configured maximum) are flagged,
    never applied silently.
  topic: [states, flow]
  scope: [ADM-526, ADM-527]
  status: client-requested
