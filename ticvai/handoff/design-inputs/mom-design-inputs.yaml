    can reach nearly the same functionality on the web; mobile mirrors the web workflows, adding venue,
    map and service features for the in-venue context.
  topic: [flow, navigation]
  scope: [P01, P02]
  status: agreed
  note: >-
    Revised on 29 Sep (mobile redesign) and 30 Sep (mobile flow deliberately different from web); see
    M6-070, M6-081.
- id: DI-971
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 'M21-03, M21-09'}
  text: >-
    The AI provider screen binds a provider to named agent tasks; model fitness warnings (underpowered
