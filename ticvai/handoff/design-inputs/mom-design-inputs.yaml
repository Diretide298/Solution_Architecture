- id: DI-444
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.2
      Ticket Configuration Reference; 5. Key Decisions}
  text: >-
    The preview/publish step shows how the ticket appears on the B2C front end and — at Chinmay's request
    — also the PDF ticket layout and Apple Wallet / Google Wallet formats, so the reviewer sees every
    output format.
  topic: [components, flow]
  scope: [ADM-130, BO-008, BO-353]
  status: agreed
- id: DI-445
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.3
      Ticket Type Deep-Dive}
  text: >-
    Open-dated ticket: name, description, price and validity period (e.g. 1 day, 1 month, 6 months), with
    a configurable reservation rule controlling whether customer details (name, email, phone) are captured
    at point of sale.
  topic: [configurability, flow]
  scope: [BO-008, POS-002]
  status: client-requested
- id: DI-446
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.3
      Ticket Type Deep-Dive; 5. Key Decisions}
  text: >-
    Decision (raised by Chinmay): date-change/reschedule is a product-level on/off setting with its own
    policy rules (e.g. allowed up to 24 hours before the visit, denied within 24 hours), not a separate
    screen. Typically off for special-day tickets (e.g. New Year, 1 January only), on for standard GA.
  topic: [configurability, density]
  scope: [BO-008, GST-013, GST-017, WEB-018]
  status: agreed
  note: >-
    Guest ticket/reservation screens offer the reschedule action only when the product allows it and within
    the window.
- id: DI-447
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.3
      Ticket Type Deep-Dive}
  text: >-
    Time-slot (performance) tickets configure early/late entry and an entry window (e.g. from 30 minutes
    before start until a cut-off). Multi-day tickets are consecutive-day or flexible within a range (e.g.
    any 3 days within a month).
  topic: [configurability]
  scope: [BO-008, BO-016, WEB-006, GST-007]
  status: client-requested
- id: DI-448
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.3
      Ticket Type Deep-Dive}
  text: >-
    Membership/pass tickets: seasonal, monthly or annual classes with renewal/auto-renewal using a tokenised
    card-on-file billed ahead of expiry, subject to the guest's consent to terms and conditions.
  topic: [flow, copy]
  scope: [BO-285, BO-292, GST-015, WEB-022, WEB-023]
  status: client-requested
- id: DI-449
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.3
      Ticket Type Deep-Dive}
  text: >-
    Camping/lesson-based tickets: when buying a multi-lesson package (e.g. ski or snowboard lessons on
    a regular schedule) the guest selects the specific class dates/performances.
  topic: [flow, components]
  scope: [WEB-006, GST-007]
  status: client-requested
- id: DI-450
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.4
      Product Combination Matrix & Ownership}
  text: >-
    Products are classified by configurable components (e.g. resident/non-resident → standard/VIP tier
    → adult/child/youth), not a fixed structure; components can be added and a simple venue may use only
    guest category. Tickets can be anonymous or require captured guest details.
  topic: [configurability, data-display]
  scope: [BO-008, ADM-119]
  status: client-requested
- id: DI-451
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.5
      Validity Management & Expiry Rules}
  text: >-
    Validity types: fixed date range, rolling (e.g. 90 days from issue) and first-use activation (starts
    at first scan). Confirmed: first-use tickets need a fallback expiry (e.g. issue date + 30 days) if
    never scanned.
  topic: [configurability]
  scope: [BO-008, BO-287]
  status: agreed
- id: DI-452
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.5
      Validity Management & Expiry Rules}
  text: >-
    Weekday/calendar rules give different validity and pricing to weekday-only vs. all-days products (e.g.
    Global Village). Blockout dates exclude some ticket types (e.g. memberships) on public holidays/special
    days, requiring a separate ticket for those dates.
  topic: [configurability, states]
  scope: [BO-019, BO-008, WEB-006, GST-007]
  status: client-requested
- id: DI-453
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.6
      Performances & Capacity Management}
  text: >-
    Performances are created individually or from a reusable time-slot template (e.g. every 30 minutes
    between start and end) that auto-generates the schedule. Capacity set at event level is inherited
    by performances, with per-performance override (e.g. evening slots).
  topic: [flow, configurability]
  scope: [BO-016, BO-721, BO-017, BO-704]
  status: client-requested
- id: DI-454
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.6
      Performances & Capacity Management}
  text: >-
    AI suggestions from sales forecasts: add/remove time slots, merge under-sold adjacent slots (with
    guest notification of the time change), and dynamic pricing (raise when a slot is >~80% sold, lower
    when <~20–30%).
  topic: [components, data-display]
  scope: [BO-697, BO-017, ADM-503]
  status: client-requested
- id: DI-455
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.6
      Performances & Capacity Management}
  text: >-
    Two capacity types shown distinctly: sales capacity (tickets sellable per performance) and admission
    capacity (a real-time, scan-based count of guests inside via entry/exit turnstiles), capping on-site
    attendance independent of tickets sold.
  topic: [data-display]
  scope: [BO-017, BO-255]
  status: client-requested
- id: DI-456
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.6
      Performances & Capacity Management; 5. Key Decisions}
  text: >-
    Decision: venue-level admission capacity supersedes event-level capacity; a system prompt/validation
    prevents configuring or selling an event beyond the remaining venue capacity. Overriding is an authorisation-gated
    (RBAC) action for authorised users only.
  topic: [states, flow]
  scope: [BO-017, BO-704]
  status: agreed
- id: DI-457
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.6
      Performances & Capacity Management; 4.11 UX Simplification & Distributed Inventory}
  text: >-
    Inventory pools split capacity by ticket type (e.g. 50% GA, 30% child, 20% senior) and/or sales channel
    (e.g. 50% online, 50% on-site), configurable at venue/event level, under a hierarchy global → attraction
    → product → variant → time slot. On cancel/refund/reschedule the business chooses whether capacity
    is released or held.
  topic: [configurability, data-display]
  scope: [BO-018, BO-017, ADM-191, ADM-262]
  status: agreed
- id: DI-458
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.7
      Entitlements & Access Control}
  text: >-
    Entitlements go beyond admission — e.g. a combo of park admission + an F&B item + a retail item, each
    redeemed by QR scan at its counter. Admission entitlements cap entries per ticket (e.g. max 2); product
    entitlements give a time-bound window (e.g. 60 minutes from first scan).
  topic: [flow, hardware]
  scope: [BO-159, BO-158, POS-021, POS-023, SCN-003]
  status: client-requested
- id: DI-459
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.7
      Entitlements & Access Control}
  text: >-
    A combo product can bundle admission with stored-value credit the guest draws down on F&B or retail
    purchases (wallet mechanics in a dedicated session).
  topic: [flow, data-display]
  scope: [BO-1104, GST-011, WEB-021]
  status: client-requested
- id: DI-460
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.7
      Entitlements & Access Control; 5. Key Decisions}
  text: >-
    Referral rewards may be credited as currency/points directly into the guest's wallet (like Swiggy),
    in addition to discount vouchers — a business-configurable option.
  topic: [configurability, data-display]
  scope: [BO-830, GST-011, WEB-021]
  status: agreed
- id: DI-461
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.7
      Entitlements & Access Control}
  text: >-
    If a guest exits without a matching checkout scan (e.g. a manually opened door), the system flags
    it and blocks the next re-entry scan until check-in/check-out is reconciled.
  topic: [states, hardware]
  scope: [SCN-003, BO-156]
  status: client-requested
- id: DI-462
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.7
      Entitlements & Access Control}
  text: >-
    Ticket look-up shows the ticket's full consumption history: transaction date/time, number of scans,
    expiry, and (if applicable) wallet balance and F&B/retail spend against that ticket.
  topic: [data-display]
  scope: [SCN-009, EMP-014, BO-226, POS-027]
  status: client-requested
- id: DI-463
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.8
      Eligibility Rules, Special Products & Memberships'}
  text: >-
    Eligibility rules are configurable: residency/nationality/geography (e.g. UAE-resident-only with Emirates
    ID capture), minimum age (date-of-birth check), guest-profile category (e.g. VIP-only) and minimum
    loyalty points/spend for a membership tier.
  topic: [configurability, flow]
  scope: [ADM-199, BO-008, WEB-011]
  status: client-requested
- id: DI-464
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.8
      Eligibility Rules, Special Products & Memberships'}
  text: >-
    Quantity/purchase limits can be set per order, per guest, per account category and per sales channel
    (e.g. maximum 6 tickets per transaction).
  topic: [configurability, components]
  scope: [BO-008, WEB-005, GST-008, POS-002, KSK-004]
  status: client-requested
  note: Limits the ticket quantity steppers on sale screens.
- id: DI-465
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.8
      Eligibility Rules, Special Products & Memberships; 5. Key Decisions'}
  text: >-
    Decision: special product types — group (min/max size, single or multiple QR codes), family (min/max
    composition) and corporate/allocation tickets — are configured within the same unified product configuration
    screen, not separate screens.
  topic: [layout, density, configurability]
  scope: [BO-008, ADM-119]
  status: agreed
- id: DI-466
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.9
      Bundles, Add-Ons, Donations & Policies; 5. Key Decisions'}
  text: >-
    Decision: all policy types — reschedule, exchange, refund, cancellation, upgrade/downgrade, ownership
    transfer, membership-to-pass conversion — are managed centrally within the unified product configuration,
    not separate screens. Each product also maps pricing, GL account code, promotions and channel availability.
  topic: [layout, density, configurability]
  scope: [BO-008, ADM-119]
  status: agreed
- id: DI-467
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.8
      Eligibility Rules, Special Products & Memberships'}
  text: >-
    Membership lifecycle: upgrade, downgrade, suspend (freezes validity until re-enabled), deactivate
    and cancel, with configurable timing windows (e.g. upgrade allowed only in the final two months before
    expiry).
  topic: [states, flow, configurability]
  scope: [BO-298, BO-299, GST-015, WEB-023]
  status: client-requested
- id: DI-468
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.8
      Eligibility Rules, Special Products & Memberships'}
  text: >-
    Stored value configuration: minimum stored value, maximum top-up balance, expiry of stored balance,
    and refund destination (original payment method or back to wallet balance).
  topic: [configurability]
  scope: [BO-1095, BO-1108, BO-1146]
  status: client-requested
- id: DI-469
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.9
      Bundles, Add-Ons, Donations & Policies'}
  text: >-
    Multi-park / multi-attraction / multi-venue bundles are visually mapped, showing which venues, meal
    vouchers, VIP parking or upgrade options a bundle includes.
  topic: [components, data-display]
  scope: [BO-011, ADM-180, ADM-661]
  status: client-requested
- id: DI-470
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.9
      Bundles, Add-Ons, Donations & Policies'}
  text: >-
    Add-ons attached to a main product can be mandatory or optional; cross-sell offers related add-on
    products, upsell proposes a higher tier (e.g. adult admission → membership).
  topic: [flow, components]
  scope: [WEB-008, GST-048, ADM-655]
  status: client-requested
- id: DI-471
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.9
      Bundles, Add-Ons, Donations & Policies'}
  text: >-
    Donation campaigns: fixed or variable amounts, enabled per sales channel, triggered on a specific
    product or across all products, proceeds tracked to a separate account code.
  topic: [configurability, components]
  scope: [BO-1190, WEB-012, GST-009, POS-005]
  status: client-requested
- id: DI-472
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: '4.9
      Bundles, Add-Ons, Donations & Policies; 6. Open Items'}
  text: >-
    Open: whether donations are taxable. Allam believes they are typically not, but the system should
    allow enabling/disabling a tax or service fee on donations; Chinmay to confirm treatment.
  topic: [configurability, data-display]
  scope: [BO-1190]
  status: open-question
- id: DI-473
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.10
      AI Governance & Publish Workflow}
  text: >-
    Governance view shows product counts by status (draft, pending approval, approved, published); each
    price, terms or policy revision is a new version; publish rights are restricted to the authorised
    user/department; version history supports rollback to a prior published version.
  topic: [data-display, states, flow]
  scope: [ADM-128, ADM-129, ADM-131, ADM-132]
  status: client-requested
- id: DI-474
  source: {file: sources/mom/TICVAI_MoM_2026-08-25_Ticketing_ProductConfig.docx, date: '2026-08-25', section: 4.11
      UX Simplification & Distributed Inventory}
  text: >-
    Chinmay: reduce the number of configuration screens/pages and consolidate related settings/toggles
    to avoid a long, click-heavy admin flow; Allam agreed, citing the previous system's demo as a starting
    reference.
  topic: [density, layout, navigation]
  scope: [P08/Sell, P08/Catalogue]
  status: agreed
- id: DI-475
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.1
      Resource Management Overview}
  text: >-
    Resource management command centre: calendar-based overview of all resources' booking status (e.g.
    an instructor booked for a lesson, date and time), filterable by resource type and venue, with a switchable
    revenue view; view by day, week, month or custom period (planner style).
  topic: [layout, components, data-display]
  scope: [BO-854, BO-864]
  status: client-requested
- id: DI-476
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.2
      Resource Master Data Configuration}
  text: >-
    Resource types (rooms, staff, equipment, vehicles, etc.) carry capacity control and a reservable flag;
    the command centre shows total vs. active/assigned resources and current availability.
  topic: [configurability, data-display]
  scope: [BO-855, BO-854]
  status: client-requested
- id: DI-477
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.2
      Resource Master Data Configuration}
  text: >-
    Categories/subcategories are configurable hierarchies (e.g. staff → employee/operations/instructor;
    equipment → lighting/sound; vehicles → SUV). Resource profile: name, category, capacity, active/inactive,
    images, category-specific details and custom attributes (e.g. a vehicle's plate number).
  topic: [configurability, data-display]
  scope: [BO-856, BO-857, BO-858]
  status: client-requested
- id: DI-478
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.2
      Resource Master Data Configuration}
  text: >-
    Resources link as main/sub-resources (e.g. "vehicle" with individual vehicles beneath). Dependency
    rules per product (e.g. a private ski lesson needs at least two resources, or at least one vehicle)
    are enforced when a resource-linked product is configured or sold.
  topic: [configurability, states]
  scope: [BO-859, BO-860]
  status: client-requested
- id: DI-479
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.2
      Resource Master Data Configuration}
  text: >-
    Multiple resources can be bundled to one product (e.g. a VIP Cabana package = room + attendant) so
    the system knows every resource needed when it is booked.
  topic: [configurability]
  scope: [BO-861]
  status: client-requested
- id: DI-480
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.3
      Resource Calendar & Scheduling}
  text: >-
    Resource calendar is an inquiry/planning screen showing availability by date range (e.g. which of
    10 vehicles are free between a start and end time), filterable and searchable across resource types.
    Schedules set each resource's working pattern (e.g. Monday–Friday, off weekends).
  topic: [components, data-display]
  scope: [BO-864, BO-865, BO-866]
  status: client-requested
- id: DI-481
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.3
      Resource Calendar & Scheduling}
  text: >-
    Clarified: time slots are not created for resources; they are created for performances/events, and
    resources are associated with those performance time slots.
  topic: [flow, configurability]
  scope: [BO-867, BO-721]
  status: agreed
  note: >-
    Resource time-slot screens should associate resources to performance slots, not create slots.
- id: DI-482
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.4
      Resource Assignment Models; 5. Key Decisions}
  text: >-
    Decision: two assignment models — pre-assigned (named vehicle/instructor/room mapped to a time slot
    in advance) and dynamic (only type + quantity, e.g. "one SUV and one guide", with an available resource
    auto-assigned at sale).
  topic: [configurability, flow]
  scope: [BO-900, BO-893, BO-711]
  status: agreed
- id: DI-483
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.4
      Resource Assignment Models}
  text: >-
    Resources are normally booked automatically as a consequence of selling the associated package; manually
    reserving/blocking a specific resource outside a sale is only for exceptional cases (e.g. holding
    it for a future booking).
  topic: [flow]
  scope: [BO-868, BO-870]
  status: agreed
- id: DI-484
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.4
      Resource Assignment Models}
  text: >-
    The system must prevent the same resource being double-booked or assigned to overlapping bookings
    (conflict detection and resolution). Multi-event planning and drag-and-drop allocation assign resources
    visually, alongside rule-based automatic assignment.
  topic: [components, states]
  scope: [BO-871, BO-872, BO-921]
  status: agreed
- id: DI-485
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.5
      Staff / Personnel Resource Management}
  text: >-
    Personnel (cashiers, trainers, drivers, other staff) are a resource type; command-centre view shows
    total personnel and how many are on duty, available or on leave. A staff profile's operational summary
    lists associated bookings.
  topic: [data-display]
  scope: [BO-873, BO-874]
  status: client-requested
- id: DI-486
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.5
      Staff / Personnel Resource Management}
  text: >-
    Skills & competency define qualifications required for a role (e.g. level 1/2/3 ski-instructor certification
    for an advanced trainer); certification expiry tracking flags when recertification is due (e.g. annual
    renewal).
  topic: [data-display, states]
  scope: [BO-875, BO-876]
  status: client-requested
- id: DI-487
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.5
      Staff / Personnel Resource Management}
  text: >-
    Shift templates (morning/afternoon/evening) define working patterns; the system recognises which shift
    a staff member has logged into from the configured shift timings. Leave/absence types and quotas work
    as a lightweight HR module, optionally integrated with an external HR/time-and-attendance system.
  topic: [configurability, flow]
  scope: [BO-879, BO-880, BO-882, EMP-024]
  status: client-requested
- id: DI-488
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.6
      Workforce Rostering, Attendance & Staffing Control'}
  text: >-
    Staffing dashboard shows checked-in, on-shift, on-leave, open-shift and closed-shift counts from check-in/out
    logs, plus staffing cost including overtime.
  topic: [data-display]
  scope: [BO-883, BO-888, BO-891]
  status: client-requested
- id: DI-489
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.6
      Workforce Rostering, Attendance & Staffing Control'}
  text: >-
    Roster view per resource shows required vs. scheduled vs. checked-in counts for the day, surfacing
    discrepancies (e.g. 10 ski trainers scheduled, only 8 checked in). Minimum staffing/coverage rules
    are set per venue and day (e.g. minimum instructors per level).
  topic: [data-display, states]
  scope: [BO-884, BO-885, BO-886]
  status: client-requested
- id: DI-490
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.6
      Workforce Rostering, Attendance & Staffing Control'}
  text: >-
    If a scheduled resource fails to check in, the shortfall is flagged for operations and AI can recommend
    reassigning that resource's bookings. A compliance/validation centre flags events where required staffing
    is not met, with labour cost tracked.
  topic: [states, components]
  scope: [BO-886, BO-890, BO-930]
  status: client-requested
- id: DI-491
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.6
      Workforce Rostering; 4.9 AI Optimization, Mobile App & Analytics'}
  text: >-
    Staff can request a swap (e.g. break coverage) from another resource; attendance exceptions are marked
    manually (active, not active, absent, other).
  topic: [flow, states]
  scope: [BO-887, BO-889, BO-939, EMP-023, EMP-025]
  status: client-requested
- id: DI-492
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.5
      Staff / Personnel; 4.9 AI Optimization, Mobile App & Analytics'}
  text: >-
    Employee mobile app: staff see their assigned bookings and tasks for the day, perform check-in/check-out
    and shift closing, and request swaps directly from the app — mirroring the booking info on their back-office
    profile.
  topic: [data-display, flow, devices]
  scope: [EMP-003, EMP-004, EMP-022, EMP-024, EMP-009, EMP-023, BO-933, BO-934, BO-936]
  status: client-requested
- id: DI-493
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.7
      Dynamic Resource Assignment for Experience Tickets}
  text: >-
    An event can require a specific qualification level (e.g. advanced instructor only, excluding intermediate/beginner),
    enforced by the system. The resource combination builder sets required types, quantities and mandatory/optional
    per event (e.g. instructor, area, equipment set).
  topic: [configurability]
  scope: [BO-894, BO-895]
  status: client-requested
- id: DI-494
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.7
      Dynamic Resource Assignment for Experience Tickets}
  text: >-
    Resource allocation is fixed-quantity or ratio-based/dynamic — e.g. one tour guide covers up to 10
    tickets, and resources are added as sales grow. Whether resources are auto-assigned by type or specifically
    allocated can vary by sales channel.
  topic: [configurability]
  scope: [BO-896, BO-897, BO-899]
  status: client-requested
- id: DI-495
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.7
      Dynamic Resource Assignment; 5. Key Decisions}
  text: >-
    Decision (Chinmay): skill-based resource matching uses straightforward attribute/keyword matching
    (skill level, language), not a full AI-matching system.
  topic: [configurability, components]
  scope: [BO-898]
  status: agreed
- id: DI-496
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.7
      Dynamic Resource Assignment for Experience Tickets}
  text: >-
    Resources are one-to-one (dedicated to a booking) or shared (e.g. a meeting room with bookable pods,
    a vehicle across sequential slots); further sales are blocked once a shared resource's capacity/slot
    is full and reopened if a booking is cancelled.
  topic: [states, configurability]
  scope: [BO-900, BO-855, WEB-048, GST-075]
  status: client-requested
- id: DI-497
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.7
      Dynamic Resource Assignment; 5. Key Decisions}
  text: >-
    Decision: allocation rotates across all available resources (resource 1, then 2, then 3) rather than
    reusing the same one; if an assigned resource becomes unavailable the system automatically replaces/reassigns
    it.
  topic: [configurability]
  scope: [BO-901, BO-902]
  status: agreed
- id: DI-498
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.8
      Equipment, Assets & Rental Management'}
  text: >-
    Rental items (e.g. strollers, wheelchairs, towels): inventory and quantity per day, check-out and
    check-in, with inventory updated automatically on return; a refundable deposit (with guest details)
    is captured at rental and refunded on return.
  topic: [flow, data-display]
  scope: [BO-904, BO-905, BO-906, BO-909, EMP-078, EMP-099]
  status: client-requested
- id: DI-499
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.8
      Equipment, Assets & Rental Management'}
  text: >-
    Usage-based billing at return: excess charged on actual vs. paid duration (e.g. a wheelchair paid
    for one hour but used for three is charged two extra hours at return).
  topic: [flow, data-display]
  scope: [BO-908, EMP-093, EMP-098]
  status: client-requested
- id: DI-500
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.8
      Equipment, Assets & Rental Management; 5. Key Decisions'}
  text: >-
    Rental/equipment items use simplified states — available, rented, faulty/out-of-maintenance (excluded
    from available inventory until resolved) — not granular custom attributes. Clients supply item data
    at onboarding; a screen lets them update inventory and item details afterwards.
  topic: [states, density]
  scope: [BO-904, BO-905, BO-910, BO-508]
  status: agreed
- id: DI-501
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: '4.9
      AI Optimization, Mobile App & Analytics'}
  text: >-
    AI forecasting from historical bookings recommends staffing levels for upcoming periods (e.g. "you
    will need this many resources over the next week") so leave and availability can be planned. Analytics
    show total cost and revenue by resource and by event.
  topic: [reporting, data-display, copy]
  scope: [BO-927, BO-892, BO-945]
  status: client-requested
- id: DI-502
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.10
      Guest-Facing Behaviour & Configuration Q&A; 5. Key Decisions}
  text: >-
    Confirmed: a guest always books a product or package — never a resource (a specific room, vehicle
    or instructor by itself) directly — on every sales channel, including the guest/mobile app; the product's
    configuration determines which resources are booked behind the scenes.
  topic: [flow, navigation]
  scope: [P01, P02, P05, P04]
  status: agreed
  note: 'Exception: private-session products may expose instructor choice (see M3-180).'
- id: DI-503
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.10
      Guest-Facing Behaviour & Configuration Q&A}
  text: >-
    A bookable resource such as a meeting room can be priced per hour: total price is calculated from
    the booked duration and the room is blocked for that window so no other guest can book it.
  topic: [flow, data-display, states]
  scope: [WEB-048, GST-075]
  status: client-requested
- id: DI-504
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.10
      Guest-Facing Behaviour & Configuration Q&A; 5. Key Decisions}
  text: >-
    Decision (Qossai, Ski Dubai): instructor choice is a per-ticket-type setting — private-session products
    may let the guest pick a specific instructor; group-session products auto-assign without showing a
    choice. Private and group are separate, separately priced products (a private request on a group instructor
    is its own product).
  topic: [configurability, flow, components]
  scope: [BO-897, BO-899, WEB-005, GST-008]
  status: agreed
- id: DI-505
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.10
      Guest-Facing Behaviour & Configuration Q&A; 5. Key Decisions}
  text: >-
    Decision (raised by Aishwarya): F&B and retail/merchandise online sale are optional back-office-enabled
    modules; where enabled, the whole purchase (browse, cart, checkout, pickup-at-venue or ship-to-guest)
    completes inside TICVAI — guests are never sent to download a separate app.
  topic: [flow, configurability]
  scope: [WEB-036, WEB-033, WEB-042, GST-024, GST-026, GST-062]
  status: agreed
- id: DI-506
  source: {file: sources/mom/TICVAI_MoM_2026-08-26_ResourceManagement.docx, date: '2026-08-26', section: 4.10
      Guest-Facing Behaviour & Configuration Q&A; 6. Open Items}
  text: >-
    UX reference: House of Wisdom (Sharjah library) meeting-room/"pod" booking and tiered membership plans
    — a simple duration-based booking flow without fixed performances/time slots — to be reviewed by Chinmay/Aishwarya.
  topic: [flow, layout]
  scope: [WEB-048, GST-075, WEB-022, GST-015]
  status: client-requested
- id: DI-507
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.1
      Wallet Foundation & Dashboard}
  text: >-
    Wallet dashboard gives an overview of all live wallet balances: total wallet value, total spend and
    total recharge activity.
  topic: [data-display, reporting]
  scope: [BO-1083]
  status: client-requested
- id: DI-508
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.2
      Wallet Type Library, Ownership & Account Association'}
  text: >-
    Wallet type library: multiple wallet types (guest, family, membership wallet), each assigned to a
    category (individual, corporate, member). Provisioning rules set the trigger that creates a wallet
    (membership purchase, first top-up); two patterns: gift-card style (pre-defined value products listed
    on the website) and open-ended "add money to wallet".
  topic: [configurability, flow]
  scope: [BO-1084, BO-1085, WEB-021, GST-011]
  status: client-requested
- id: DI-509
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.2
      Wallet Ownership / 4.8 Family Permission Rules}
  text: >-
    Ownership and access rules are configurable per wallet type. Family default: only the parent/guardian
    can top up; children can view balance and transactions and spend, but cannot top up unless permissions
    are explicitly reconfigured. Guest wallet screens must hide or disable top-up for members without
    the right.
  topic: [configurability, states]
  scope: [BO-1086, BO-1118, GST-011, WEB-021]
  status: agreed
- id: DI-510
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.3
      Currency, Credit Types & Wallet Feature Profile'}
  text: >-
    Currency config sets supported currencies and maximum balance; foreign-currency top-up (e.g. USD)
    is converted at a configured exchange rate and credited in local currency. Credit types (cash, bonus,
    gift-card credit) are each classified monetary or non-monetary (e.g. a meal voucher redeemable only
    for a specific item).
  topic: [configurability, data-display]
  scope: [BO-1087, BO-1088]
  status: client-requested
- id: DI-511
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.3
      Wallet Feature Profile}
  text: >-
    Wallet feature profile (global, optionally per wallet type) lists permitted actions such as top-up
    allowed, refund allowed. Example: a AED 100 membership-benefit voucher is spendable but not refundable/cashable-out.
  topic: [configurability]
  scope: [BO-1089]
  status: client-requested
- id: DI-512
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.4
      Wallet Lifecycle, Numbering & Publish Flow'}
  text: >-
    Wallet statuses: active, suspended, blocked, closed. Every wallet must have a validity period (never
    open-ended); on lapse the remaining balance, monetary or non-monetary, is automatically swept to a
    finance-designated account.
  topic: [states, configurability]
  scope: [BO-1090, BO-1108]
  status: agreed
- id: DI-513
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.4
      Wallet Numbering / 4.9 Wallet-to-media linking}
  text: >-
    Each wallet gets a unique wallet code (like a ticket number) with configurable association to physical/digital
    media: QR code, RFID/wristband or other media types, usable across channels.
  topic: [configurability, hardware]
  scope: [BO-1091, BO-1137]
  status: client-requested
- id: DI-514
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.4
      Wallet Lifecycle, Numbering & Publish Flow'}
  text: >-
    A final review/publish screen summarises the completed wallet-type configuration (rules, applicable
    channels) before it goes live.
  topic: [flow]
  scope: [BO-1092]
  status: client-requested
- id: DI-515
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.5
      Funding, Top-Up & Reload Management'}
  text: >-
    Top-up dashboard shows all top-ups (successful or failed) and funding-by-source breakdown (credit
    card, debit card, cash, etc.) with totals by day, month and year.
  topic: [reporting, data-display]
  scope: [BO-1093]
  status: client-requested
- id: DI-516
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.5
      Funding, Top-Up & Reload Management'}
  text: >-
    Funding methods: cash, card, online, POS, kiosk self-service, plus manual admin funding used to issue
    a goodwill/service-recovery credit to a guest's wallet. Chinmay raised role-based permission for staff
    funding wallets.
  topic: [configurability, flow]
  scope: [BO-1094, BO-1149]
  status: client-requested
- id: DI-517
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.5
      Funding, Top-Up & Reload Management'}
  text: >-
    Top-up rules set minimum and maximum amounts per transaction; channel/funding-source mapping restricts
    which payment methods each channel offers (e.g. cash top-up on-site only, not online), so each channel's
    top-up screen offers only its allowed methods.
  topic: [configurability, data-display]
  scope: [BO-1095, BO-1096, WEB-021, GST-011, P04, P05]
  status: client-requested
- id: DI-518
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.5
      Funding, Top-Up & Reload Management'}
  text: >-
    Auto-reload (tops up a configured amount when balance falls below a threshold) and a separate recurring
    funding schedule (calendar-based, e.g. a fixed amount every Monday). Allam: auto-reload is a nice-to-have
    without a confirmed use case; Chinmay: keep it for high-value/frequent guests.
  topic: [configurability]
  scope: [BO-1097, BO-1098]
  status: client-requested
  note: 'Auto-reload listed as open item: real-world demand still to be validated.'
- id: DI-519
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.5
      Funding / 5. Key Decisions}
  text: >-
    Guests must be able to configure auto-reload and recurring funding schedules themselves in the guest
    web/app, not only venue admins in the back office.
  topic: [flow, configurability]
  scope: [GST-011, WEB-021]
  status: agreed
- id: DI-520
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.5
      Funding, Top-Up & Reload Management'}
  text: >-
    Funding approval rules: a top-up above a configured threshold requires supervisor or finance approval
    via supervisor login. Top-up reversal (full or partial, back to the original payment method) requires
    manual verification/authorisation before processing.
  topic: [flow, configurability]
  scope: [BO-1099, BO-1100, P04]
  status: agreed
- id: DI-521
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.5
      Funding, Top-Up & Reload Management'}
  text: >-
    Funding limits and velocity controls (daily, monthly, min and max transaction thresholds), and a funding
    audit trail listing all top-up transactions for any period or account.
  topic: [configurability, data-display]
  scope: [BO-1101, BO-1102]
  status: client-requested
- id: DI-522
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.6
      Stored Value, Credit Consumption & FEFO Logic'}
  text: >-
    Credit usage restrictions scope a credit to spend categories (e.g. usable for food & beverage, not
    retail), fully configurable; with no restriction the balance is spendable on anything offered.
  topic: [configurability]
  scope: [BO-1106]
  status: client-requested
- id: DI-523
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.6
      Stored Value, Credit Consumption & FEFO Logic'}
  text: >-
    Consumption is fully automatic FEFO (nearest expiry first). Guests see their balance and the expiry
    breakdown per top-up lot in their profile but cannot choose which lot is drawn down; no lot picker
    at payment.
  topic: [data-display, flow]
  scope: [GST-011, WEB-021, BO-1107, BO-1109]
  status: agreed
- id: DI-524
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.6
      Stored Value, Credit Consumption & FEFO Logic'}
  text: >-
    Bonus credit tiers (e.g. AED 100 top-up earns AED 20 bonus; AED 200 earns AED 60). Bonus credit is
    consumed before base top-up credit and carries its own separate validity period.
  topic: [configurability, data-display]
  scope: [BO-1105, BO-1107, BO-418]
  status: agreed
- id: DI-525
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.7
      Split-Tender, Redemption Rules & Configuration Simulation'}
  text: >-
    Split tender: one purchase paid with wallet balance plus another method, e.g. AED 500 from the wallet
    and the remaining AED 200 of a AED 700 purchase on a credit card.
  topic: [flow]
  scope: [BO-1110, POS-005, WEB-012, GST-009, KSK-007]
  status: agreed
- id: DI-526
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.7
      Split-Tender, Redemption Rules & Configuration Simulation'}
  text: >-
    Partial vs full redemption is configurable per wallet/gift-card type: some allow spending part and
    keeping the remainder, others require full redemption in a single transaction.
  topic: [configurability]
  scope: [BO-1127, BO-1135]
  status: agreed
- id: DI-527
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.7
      Split-Tender, Redemption Rules & Configuration Simulation'}
  text: >-
    Credit expiry and extension operations give admins a customer-level view of all wallet balances and
    their expiry dates to manage upcoming expiries.
  topic: [data-display]
  scope: [BO-1111]
  status: client-requested
- id: DI-528
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.7
      Configuration simulation tool}
  text: >-
    Configuration simulation/test mode lets an admin run sample transactions against a wallet configuration
    (e.g. spend-category restrictions) before publishing, instead of discovering errors live.
  topic: [flow]
  scope: [BO-1112, BO-1122, BO-1132, BO-1142]
  status: agreed
- id: DI-529
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.8
      Family, Parent-Child & Corporate Wallets'}
  text: >-
    A parent's wallet funds linked child wristbands/wallets with per-child spending allowances, e.g. of
    a AED 500 family balance one child is capped at AED 200 and another at AED 200.
  topic: [configurability, data-display]
  scope: [BO-1116, BO-1117, GST-011, WEB-021]
  status: agreed
- id: DI-530
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.8
      Family, Parent-Child & Corporate Wallets'}
  text: >-
    Guests can create family-member profiles themselves and set spending limits directly from their own
    guest account, in addition to venue-side configuration.
  topic: [flow]
  scope: [GST-011, WEB-021, GST-039]
  status: agreed
- id: DI-531
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.8
      Family, Parent-Child & Corporate Wallets'}
  text: >-
    Corporate/group wallets: funds loaded and segregated across departments (e.g. marketing, operations)
    for company accounts.
  topic: [data-display, configurability]
  scope: [BO-1119, BO-1120]
  status: client-requested
- id: DI-532
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: 4.8
      Shared wallet transfer}
  text: >-
    Balance can move between linked family/group wallets in either direction (parent to child, child to
    parent); a venue-controlled toggle, not always enabled.
  topic: [configurability, flow]
  scope: [BO-1121, GST-011, WEB-021]
  status: agreed
- id: DI-533
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.9
      Gift Cards, Vouchers & Wallet Payments'}
  text: >-
    Two variants: monetary gift card (value usable on anything the venue offers) and product-specific
    gift voucher (redeemable only for a named product, e.g. a dolphin-show voucher). Redemption channel
    is configurable: online, on-site or both.
  topic: [configurability, data-display]
  scope: [BO-1124, BO-1126, BO-1127, WEB-021, GST-011]
  status: client-requested
- id: DI-534
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.9
      Gift Cards, Vouchers & Wallet Payments'}
  text: >-
    Wallet spend reported by department/category (F&B, attractions, retail, partners) and by channel (B2C,
    POS); payment/redemption policy can set rules such as a minimum spend to use the wallet as a payment
    method.
  topic: [reporting, configurability]
  scope: [BO-1133, BO-1135, BO-1171]
  status: client-requested
- id: DI-535
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.10
      Transfers, Fraud/Risk Controls'}
  text: >-
    End-of-visit unload/refund: a guest can unload the remaining balance at a counter after a balance
    check. Configurable venue-level toggle, not always on.
  topic: [flow, configurability]
  scope: [BO-1146, POS-011, POS-027]
  status: agreed
- id: DI-536
  source: {file: sources/mom/TICVAI_MoM_2026-08-27_WalletConfiguration.docx, date: '2026-08-27', section: '4.10
      Transfers, Fraud/Risk Controls'}
  text: >-
    Peer-to-peer transfer from one guest's wallet to another guest's wallet; a configurable venue-level
    toggle (allowed or not), not a default feature.
