  text: >-
    Qossai: walk-in, virtual-queue and VIP guests must be distinguished at the ride; VQ guests are never
    merged into the VIP line (would erode paid value); VQ arrivals need their own handling, e.g. a separate
    line or a QR scan within the arrival window.
