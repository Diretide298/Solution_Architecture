  text: >-
    Sign-in (or the guest code when guest checkout is on) is asked when the guest leaves the Add-ons step;
    the basket is kept. Setting "Ask to sign in": After add-ons (default) or At payment.
  topic: [flow, configurability]
  scope: [WEB-008, WEB-011, WEB-012, WEB-016, GST-041, GST-042, CMS-103]
  status: agreed
  ref: REV3-3
- id: DI-1044
  source:
    file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md
    date: '2026-09-29'
    section: >-
      REV3-4 · 4. Flow 1 (fixed date and time) and Flow 2 (select date, then time, then seat map)
  text: >-
    Seated events with one on-sale performance go straight to the seat map (Flow 1). Otherwise date and
    time come first (Flow 2), either as an inline step (timed-ticket style, default) or as a pop-up dialog
    over the seat map. Setting "Date & time on seat events".
  topic: [flow, configurability, components]
  scope: [WEB-006, WEB-007, GST-007, GST-049, CMS-103]
  status: agreed
  ref: REV3-4
- id: DI-1045
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-5 · 5. CMS option to show the seat view right, left, top or bottom'}
  text: >-
    The 'view from your seat' box can sit Bottom (default), Right, Left or Top of the seat map (web only);
    on narrow screens and mobile it is always below the map. Setting "Seat view box".
  topic: [layout, configurability, devices]
  scope: [WEB-007, GST-049, CMS-103]
  status: agreed
  ref: REV3-5
- id: DI-1046
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-6 · 6. Time selection on top, configurable'}
  text: >-
    A time bar above the seat map shows the chosen performance, lets the guest switch show and has Change
    date; switching releases held seats. Setting "Time bar above seat map", default on. On the selection
    step, time sits directly under the date, above language & format and tickets.
  topic: [layout, components, configurability]
  scope: [WEB-006, WEB-007, GST-049, CMS-103]
  status: agreed
  ref: REV3-6
- id: DI-1047
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-7 · 7. Theatre flow should be similar to the stadium flow}
  text: >-
    Theatre has its own auditorium seat map: stage (or screen for cinema) at front, Stalls/Circle/Balcony
    with curved rows, aisles and Premium/Standard/Economy pricing. Date, time, show (plus language & format
    for cinema) and the seat map sit on one page. Seats per guest booking default 10 (venue setting);
    basket lists each seat.
  topic: [components, layout, flow]
  scope: [WEB-006, WEB-007, GST-007, GST-049]
  status: agreed
  ref: REV3-7
  note: Basket line example 'Stalls · Row F, Seat 9'. Max seats is a venue setting, bounds 1–50.
- id: DI-1048
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-8 · 8. Unable to complete the table booking flow}
  text: >-
    Table reservations and the waitlist do not go into the cart: after date, time and party size the guest
    gets a confirmation straight away ("no card needed").
  topic: [flow, states]
  scope: [WEB-036, GST-070]
  status: agreed
  ref: REV3-8
  note: The prototype's 'Table for 4 · 19:30 · no card needed' basket line is prototype-only.
- id: DI-1049
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-8b · 8. deposit hold flow}
  text: >-
    Dining deposit hold is a venue option, off unless enabled in Venue Management; amount and basis (per
    guest, per table, percentage) are venue configuration, never a hard-coded AED 100. Show the deposit
    step only when enabled.
  topic: [configurability, flow]
  scope: [WEB-036, GST-070]
  status: agreed
  ref: REV3-8b
- id: DI-1050
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-9 · 9. Add-ons and modifiers for F&B menu items}
  text: >-
    In takeaway, delivery and café menus, Add opens a side panel for the dish: choose-one options (spice
    level, drink size, ice), optional priced add-ons (sides, dips, toppings, leave-outs) and quantity;
    total updates live and the basket line lists the choices. Shown whenever the item has modifier groups
    (no toggle).
  topic: [components, flow, data-display]
  scope: [WEB-036, WEB-037, GST-024, GST-061]
  status: agreed
  ref: REV3-9
- id: DI-1051
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-10 · 10. Cart display: fixed on right, slide bar, icon, bottom; right for Arabic'}
  text: >-
    Cart & summary options: sidebar fixed right, sidebar left, slide-in right, slide-up bottom, floating
    cart icon (round basket button with item count opening the slide-in basket), single column. In Arabic
    the basket stays on the right by default (client confirmed); "Cart side in Arabic" can mirror to left.
  topic: [layout, configurability, rtl, components]
  scope: [WEB-005, WEB-006, WEB-008, WEB-010, GST-041, CMS-103]
  status: agreed
  ref: REV3-10
- id: DI-1052
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-11 · 11. Show products based on questions (Help me choose)}
  text: >-
    Help me choose is a venue configuration: 1–2 questions, answers, and the flow each answer opens, with
    a result card. Shown as a button, a pop-up on arrival, or off, and as a dark banner under the products
    ("Choose from the experiences above or let us help you decide", HELP ME CHOOSE). AI proposes sections;
    venue reviews.
  topic: [flow, components, configurability, copy]
  scope: [WEB-004, WEB-005, GST-004, GST-008, CMS-101]
  status: agreed
  ref: REV3-11
- id: DI-1053
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-13 · 13. House of Wisdom: meeting room flow'}
  text: >-
    Meeting rooms by the hour are in scope: date → start time → length (1 hour, 2 hours, half day, full
    day) → room (focus pod, majlis room, boardroom, auditorium) → attendees → add-ons (coffee break, working
    lunch, AV technician). Price = room rate × length; the cart line shows the booked time window.
  topic: [flow, data-display]
  scope: [WEB-048, GST-075]
  status: agreed
  ref: REV3-13
  note: >-
    rev3-decisions.json lists no screens; WEB-048 / GST-075 'Book a Space by the Hour' are the matching
    screens.
- id: DI-1054
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-14 · 14. Show a ticket category with details, with booking on or off in the CMS'}
  text: >-
    A product can be listed as info only (or hidden): it keeps details and photo, shows an "Info only"
    / "Not bookable online" label (venue-editable text) and opens its details instead of adding to the
    basket. Setting "Show info-only products", default on.
  topic: [states, copy, configurability]
  scope: [WEB-002, WEB-003, WEB-004, WEB-005, GST-003, GST-004, GST-063, CMS-103]
  status: agreed
  ref: REV3-14
- id: DI-1055
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-15 · 15. Book the product from the map (e.g. pick an available cabana)}
  text: >-
    Cabanas are picked on the venue's ingested map, like stadium seats: numbered cabanas by zone (e.g.
    R01–R10, T01–T08, S01–S06, B01–B10) showing guests seated, sold-out greyed and marked. Tapping one
    adds it (e.g. "Cabana B09 · Large cabana · Beach, AED 1,855") and starts a remaining-time counter.
    Map on the first screen.
  topic: [components, flow, states]
  scope: [GST-050, GST-058, GST-070, WEB-047, GST-074]
  status: agreed
  ref: REV3-15
  note: >-
    Cabana numbering and prices (Family 6 = 995, Medium 10 = 1,295, Large 15 = 1,855, XL 20 = 2,295) still
    to be confirmed by the client.
- id: DI-1056
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-16 · 16. Choose category, then subcategory, configurable in the CMS'}
  text: >-
    Category tiles (e.g. Permanent exhibition, Temporary exhibitions, Guided tours, Courses & workshops),
    then that category's tickets with Adult / Child / Student counters. Setting "Ticket categories": Category
    → subcategory (default) or Flat list (all tickets under category headings).
  topic: [flow, layout, configurability]
  scope: [WEB-002, WEB-005, GST-002, GST-003, CMS-103]
  status: agreed
  ref: REV3-16
- id: DI-1057
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-17 · 17. Guided tour times based on the tour language}
  text: >-
    The guest picks a tour language (e.g. English, العربية, Français, Deutsch, 中文, Русский) and only tours
    in that language are listed. Cinema performances show language and format (2D/3D/subtitled) to pick
    from.
  topic: [flow, data-display, components]
  scope: [WEB-006, GST-007]
  status: agreed
  ref: REV3-17
- id: DI-1058
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-18 · 18. One tenant with an attraction in several locations; change location}
  text: >-
    Multi-location attractions: the guest picks a location first (e.g. Al Barsha, Mirdif, Yas Island,
    Sharjah); a "Booking at" bar on later booking steps has Change location. On a switch, times and prices
    refresh and the selection is cleared unless the products share a family. Setting "Location switcher".
  topic: [navigation, flow, configurability]
  scope: [WEB-001, WEB-005, WEB-006, GST-001, GST-007, GST-008, CMS-103]
  status: agreed
  ref: REV3-18
- id: DI-1059
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-19 · 19. Surf sessions with filters (as on The Wave)}
  text: >-
    Surf sessions: dropdowns "Choose your experience" (surf, lessons and coaching, swim and play, sauna)
    and "Select surf level" (beginner to expert), each option with a short description, plus Reset, day-part
    chips and paging. A four-day calendar (arrows move a week) stacks sessions by time with places left
    and price per surfer; sold-out greyed.
  topic: [components, layout, states]
  scope: [WEB-005, WEB-006, GST-007]
  status: agreed
  ref: REV3-19
- id: DI-1060
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: REV3-20 · 20. Enable or disable a Quick Tour that describes the customer journey}
  text: >-
    On a guest's first booking visit, a four-step coach-mark tour highlights date, time, tickets and basket,
    with Back, Next / Done and End tour; a "Quick tour" button on the booking page replays it. Setting
    "Quick tour", default off; first-visit flag kept on the device only.
  topic: [components, configurability, flow]
  scope: [WEB-005, WEB-006, GST-007, CMS-103]
  status: agreed
  ref: REV3-20
- id: DI-1061
  source:
    file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md
    date: '2026-09-29'
    section: >-
      REV3-21 · 21. Sell transport tickets (one trip, multi trip, favourites, stations, route map)
  text: >-
    Transport (intercity coach) follows the RTA layout: "3 Simple Steps" (Route & Schedule → Seat Selection
    → Payment), tabs One-way Trip / Multi-Trip / Favourite, one row with From (swap), To, Date & Time,
    Passengers; departure cards (arrival, duration, seats left, fare); price card beside a street map
    of the route.
  topic: [layout, flow, components]
  scope: [WEB-049, GST-076, GST-077, GST-078, GST-079]
  status: agreed
  ref: REV3-21
  note: >-
    Passenger types: adult, child and student half fare, person of determination free. Multi-trip: 5-trip,
    10-trip, weekly and monthly unlimited with saving shown. Street map needs internet. Network is venue-configured
    (BO-1183..BO-1189) with bulk import; E101 is demo seed data.
- id: DI-1062
  source: {file: sources/designs/guest-rev3-30-september/CLIENT-RESPONSE-REV3-25SEP.md, date: '2026-09-29',
    section: 'REV3-26 · Built to match your examples: Swim question (water park)'}
  text: >-
    Swim ability is a consent question a venue attaches to a product or flow (e.g. "Are you able to swim?",
    "Do you hold a scuba certification?", "I accept the risk"), each with its own text and per-person
    or once-per- booking setting. Shown as a pop-up in the venue's theme after session/date; answers recorded.
  topic: [flow, components, configurability, copy]
  scope: [WEB-006, GST-007]
  status: agreed
  ref: REV3-26
