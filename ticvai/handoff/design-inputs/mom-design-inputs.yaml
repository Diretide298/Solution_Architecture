  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.12 Guest Website UX Review — Category Display Formats & Cart Interaction
      Patterns}
  text: >-
    Allam: ticket/product categories must be displayable in both a horizontal/row layout and a grid layout,
    chosen by the business in the CMS rather than fixed to one pattern.
  topic: [layout, configurability]
  scope: [WEB-001, WEB-002, CMS-102]
  status: agreed
