  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.11 Guest Website UX Review — Page Structure & Hero Banner Flexibility}
  text: >-
    Allam's standard page structure for white-labelled sites: header (logo, navigation tabs, language
    selector, cart, account), a category/tab layer (e.g. day tickets, special offers, memberships, F&B,
    retail), a progress-bar layer, the product selection and summary area, help/policy links, and a footer.
  topic: [layout, navigation]
  scope: [P01]
  status: client-requested
