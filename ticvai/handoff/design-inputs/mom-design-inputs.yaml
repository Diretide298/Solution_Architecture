- id: DI-931
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.2 AI Governance — Approval, Human Oversight & Intervention'}
  text: >-
    The AI approval review workspace gives the approver everything needed to decide: current vs proposed
    value, impact, risk and affected objects (e.g. a weekend price increase shown with the channels it
    publishes to and whether future bookings are affected).
  topic: [data-display, layout]
  scope: [ADM-531]
  status: client-requested
- id: DI-932
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.2 AI Governance — Approval, Human Oversight & Intervention'}
  text: >-
    Approval is not binary: conditional approval lets an approver approve with restrictions, e.g. a commercial
    manager may approve price increases only up to a ceiling, anything higher escalates. An approver can
    also challenge a proposal and request evidence or alternatives.
  topic: [flow, components]
  scope: [ADM-532, ADM-533, ADM-531]
  status: agreed
- id: DI-933
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.2 AI Governance — Approval, Human Oversight & Intervention'}
  text: >-
    Live AI execution oversight lets a user watch an in-progress AI process step by step (e.g. the configuration
    assistant creating a venue, then products, then performances), and an authorised person can reject,
    modify or replace an AI decision at any point, with full intervention history.
  topic: [data-display, states, flow]
  scope: [ADM-535, ADM-536, ADM-537]
  status: client-requested
- id: DI-934
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.3 AI Governance — Explainability, Decision Trace & Audit'}
  text: >-
    Every AI decision is searchable in an AI decision explorer by customer, venue or AI capability, showing
    the data/model behind it, the governing rule, any human override, who approved it and when it was
    published.
  topic: [data-display, components]
  scope: [ADM-540, ADM-541, ADM-543, ADM-545]
  status: agreed
