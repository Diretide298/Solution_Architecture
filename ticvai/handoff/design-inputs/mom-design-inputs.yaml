  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.11 Guest Website UX Review — Page Structure & Hero Banner Flexibility}
  text: >-
    The hero banner and marketing layer (images, video, search, browse-by-venue, venue info) is optional
    and toggled in the white-label builder: on for clients without their own marketing site (Qossai: roughly
    30%), off for a lean direct-to-ticket flow.
  topic: [layout, configurability, branding]
  scope: [WEB-001, CMS-102, CMS-007]
  status: agreed
