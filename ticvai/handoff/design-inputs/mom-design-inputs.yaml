  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.7 AI Configuration Assistant — Approval, Execution & Audit Trail'}
  text: >-
    AI-prepared configuration keeps full version history, e.g. every price change shows who suggested
    it, who approved it and when it was published.
  topic: [data-display]
  scope: [ADM-498, BO-117]
  status: client-requested
- id: DI-939
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.8 Guest Checkout & Profile Deduplication — Extended Discussion}
  text: >-
    Checkout options are configurable per venue: guest checkout, registered checkout (login or create
    account) or single sign-on, often several together. Guest checkout captures minimum details (name,
    mobile, email) without credentials, so a returning guest re-enters details each time.
  topic: [configurability, flow]
  scope: [WEB-011, WEB-016, GST-041, GST-042]
  status: agreed
- id: DI-940
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.8 Guest Checkout & Profile Deduplication — Extended Discussion}
  text: >-
    Qossai: a guest-checkout customer may not have opted into marketing the way a registered customer
    accepting full terms has; how marketing consent is captured at guest checkout is unresolved.
  topic: [flow, copy]
  scope: [WEB-011, GST-041]
  status: open-question
- id: DI-941
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.8 Guest Checkout & Profile Deduplication — Extended Discussion}
  text: >-
    Repeat guest checkouts with the same email (or phone) consolidate into one profile automatically;
    a manual merge-customer-profile function remains for edge cases (e.g. slightly different name spelling
    under the same email). Allam cited a system where 10 transactions created 10 profiles.
  topic: [data-display, flow]
  scope: [BO-746, BO-737]
  status: agreed
- id: DI-942
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.9 AI Forecasting — Model Strategies & Signal Configuration}
  text: >-
    Forecast signal configuration defines which data sources and coverage periods the AI may use, e.g.
    historical sales over the last 36 months, real-time bookings and attendance history; seasonality,
    festivities and weather (e.g. forecast rain) are factored in.
  topic: [configurability, data-display]
  scope: [ADM-107, ADM-103]
  status: client-requested
