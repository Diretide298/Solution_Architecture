  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.5 AI Configuration Assistant — Conversational Requirement Gathering}
  text: >-
    The AI configuration assistant is conversational and iterative: on "I want to create a product" it
    asks follow-ups (ticket type, validity, date/time) and, if required information such as capacity is
    missing, asks for it rather than proceeding, before showing a configuration blueprint and dependency
    map.
  topic: [flow, components]
  scope: [ADM-481, BO-117]
  status: agreed
