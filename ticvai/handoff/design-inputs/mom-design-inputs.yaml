  scope: [WEB-004, WEB-006]
  status: client-requested
- id: DI-950
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.13 Guest Website UX Review — Ticket Type Flows & Seat Map Selection}
  text: >-
    On 3D venue maps, selecting a section takes the guest straight into that section's seats in one motion
    by zooming in, not via a separate pop-up, modal or new window.
