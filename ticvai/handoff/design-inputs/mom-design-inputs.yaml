  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.4 AI Governance — Risk, Compliance & Continuous Monitoring'}
  text: >-
    Open: should AI monitoring live in one centralised AI command dashboard or be distributed as widgets
    in each functional module's own dashboard? Allam: Softlabs' call; the current proposal is illustrative
    and Softlabs may propose a better structure.
  topic: [layout, navigation]
  scope: [P09/Platform, P08]
  status: open-question
