  text: >-
    Allam: water-park guests rarely carry phones, so a kiosk at the ride lets a guest scan their wristband
    to book a queue slot and get a return time, then scan the wristband again to enter.
  topic: [devices, hardware, flow]
  scope: [P05, BO-002]
  status: agreed
