  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.14 Guest Website UX Review — Upsell/Cross-Sell Placement & Reference
      Sites}
  text: >-
    Upsell/cross-sell offers (e.g. a family pass after 2 adult + 2 child tickets are added) are a distinct
    "extras" step after main product selection, not inline on the ticket selection page, where guests
    would miss them.
