  text: >-
    VQ configuration: rides enabled/disabled per day, queue/express split, target wait time and return-window
    duration, and handling of early or late arrivals at the ride's entry scanner.
  topic: [configurability]
  scope: [BO-001, BO-002]
  status: client-requested
- id: DI-677
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
