- id: DI-959
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: '4.3 Recommendation Strategy — Business Priority, Conflict Suppression & Fallback'}
  text: >-
    Recommendations stay within business limits, e.g. at most three recommendations shown at checkout
    and never a product the customer already owns; AI recommendations never override hard business rules
    or eligibility constraints.
  topic: [data-display, configurability]
  scope: [WEB-008, GST-048, BO-119]
  status: agreed
- id: DI-960
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.2 / 4.3 / 4.5 Recommendation Strategy and Decisioning}
  text: >-
    What a guest is offered depends on context: a member is not offered another membership (F&B or retail
    add-ons instead); general admission is not offered once VIP/fast pass is selected; an expiring membership
    prompts a renewal rather than a new product; similar offers are not shown back-to-back (alternate
    F&B and experience upsells).
  topic: [data-display, flow]
  scope: [WEB-008, GST-048, BO-119]
  status: client-requested
- id: DI-961
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.6 Personalized Offer Delivery & Omni-Channel Orchestration}
  text: >-
    Recommendation touchpoints are configurable (cart, checkout or post-purchase, per channel), and a
    presentation/experience preview visually simulates how a recommendation will look to the guest before
    it is published.
  topic: [configurability, components]
  scope: [BO-119, BO-120]
  status: client-requested
- id: DI-962
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.6 Personalized Offer Delivery & Omni-Channel Orchestration}
  text: >-
    A guest is not repeatedly re-offered something already declined (e.g. a fast pass rejected three times),
    and an offer ignored online is not re-presented on another channel, e.g. at POS after the guest bought
    it there.
  topic: [data-display, flow]
  scope: [WEB-008, GST-048, P04/Sell, P05/Sell]
  status: agreed
- id: DI-963
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.7 Recommendation Performance Analytics}
  text: >-
    Recommendation analytics show response rates, drop-offs, successful purchases and conversion per recommendation,
    broken down by strategy type (AI-based vs rule-based).
  topic: [reporting, data-display]
  scope: [BO-119, BO-121]
  status: client-requested
- id: DI-964
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.8 Core AI Platform — AI Assistant (Query & Knowledge)}
  text: >-
    The AI assistant answers natural-language business queries (e.g. "what was yesterday's ticketing revenue?")
    only within the user's role (a CEO sees full revenue, a cashier does not), shows grounded citations
    naming the policy or document an answer came from, and keeps conversation context ("compare that to
    this week").
  topic: [data-display, components, states]
  scope: [EMP-019, EMP-020, ANL-009, SUP-018]
  status: client-requested
- id: DI-965
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: '4.9 Core AI Platform — AI Tools, Agents & Action Orchestration'}
  text: >-
    AI actions in progress are shown step by step in an AI action command center; if a process only partly
    completes (e.g. missing information) it rolls back rather than leaving a product half-configured,
    and a full change history records everything AI modified.
  topic: [states, data-display]
  scope: [ADM-535, ADM-257, BO-598]
  status: client-requested
- id: DI-966
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.10 Core AI Platform — Multi-Provider AI Model Strategy}
  text: >-
    Model selection per agent is system-managed by default (end users do not choose a model per task);
    a client may override the pre-selected model for an agent with its own API key, every change logged
    for audit. A client-hosted/private model plugs in the same way: API key plus endpoint address.
  topic: [configurability, data-display]
  scope: [ADM-037]
  status: agreed
- id: DI-967
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.10 Core AI Platform — Multi-Provider AI Model Strategy}
  text: >-
    Proposed (Chinmay), not finalised: each pre-configured agent carries a complexity/fitness score; when
    a client switches models, an assessment flags whether the new model is under- or over-powered for
    that agent and recommends an adjustment. Exact end-user control over model switching is still open.
  topic: [states, data-display]
  scope: [ADM-037]
  status: open-question
- id: DI-968
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.11 Core AI Platform — Operations & Consumption Monitoring}
  text: >-
    AI operations monitoring shows health, cost/budget tracking and which AI agents consume the most resources
    and for what purpose, so the business can manage AI spend.
  topic: [data-display, reporting]
  scope: [BO-091, ADM-037]
  status: client-requested
- id: DI-969
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.12 / 4.13 AI Risk & Fraud Intelligence}
  text: >-
    Fraud monitoring shows a composite risk score per customer built from several signals: attempts and
    success/failure ratio (e.g. 10 attempts, 3 successes), distinct cards under one identity, refund volume
    or value, device/login anomalies, and repeated attempts to use an expired ticket at access control.
  topic: [data-display]
  scope: [BO-244, BO-245, BO-250]
  status: agreed
- id: DI-970
  source: {file: sources/mom/TICVAI_MoM_2026-09-21_AI_Recommendation_CorePlatform_Fraud.docx, date: '2026-09-21',
    section: 4.15 Planning — Shift to Build Readiness & UI/UX Sign-Off}
  text: >-
