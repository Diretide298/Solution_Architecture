  source: {file: sources/designs/guest-rev3-30-september/CLAUDE-CODE-GAP-FIX.md, date: '2026-09-29', section: 'GAP-B1
      · B. Login: set up two-step verification; C. Security & Sign-in (step-up auth)'}
  text: >-
    Guest two-step verification is a per-venue setting, off by default. Enrolment lives on the guest's
