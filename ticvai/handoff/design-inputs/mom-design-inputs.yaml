  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.12 Guest Website UX Review — Category Display Formats & Cart Interaction
      Patterns}
  text: >-
    Adding a product to cart must support both a slide-in-from-the-right panel and a slide-up-from-the-bottom
    panel; the business chooses which pattern fits its site.
  topic: [components, motion, configurability]
  scope: [WEB-010, CMS-102]
  status: agreed
- id: DI-948
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.13 Guest Website UX Review — Ticket Type Flows & Seat Map Selection}
  text: >-
    Each ticket type gets its own flow: open-dated (no calendar step, straight to guest category/quantity,
    valid e.g. 30-60 days), dated (date, then product), dated-with-time (date, time, product) and seated
    (date, time, seat selection).
  topic: [flow]
  scope: [P01/Booking & Selection, P02/Booking & Selection, CMS-103]
  status: client-requested
- id: DI-949
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: 4.13 Guest Website UX Review — Ticket Type Flows & Seat Map Selection}
  text: >-
    A venue selling a single event gets a dedicated page with a banner/video and brief description, showing
    only the near-term available dates (e.g. next 7 days) by default.
