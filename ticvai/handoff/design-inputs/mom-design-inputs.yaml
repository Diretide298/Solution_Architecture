  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: '4.10 AI Forecasting — Attendance, Demand, Revenue & Capacity Forecasting'}
  text: >-
    Demand forecasts show current sales pace, forecast and remaining opportunity broken down by sales
    channel; revenue forecasts show drivers and confidence levels. A forecast simulator models a hypothetical
    change (e.g. a 10% price decrease, reduced operating hours, staffing changes) before it is made.
  topic: [data-display, reporting]
  scope: [ADM-104, ADM-110, ADM-112, ANL-008, ADM-517]
  status: client-requested
