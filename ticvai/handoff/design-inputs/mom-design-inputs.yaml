  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.11 Sales schedule & validity}
  text: >-
    Start/stop-sell per channel: e.g. a distant desert safari allows no same-day online booking (next
    day minimum), while onsite stays open to sell-out or a cutoff (e.g. 15 minutes before a timed show).
    Guest date/time pickers must reflect the channel's window.
  topic: [configurability, states]
  scope: [ADM-263, WEB-006, GST-007, KSK-005, POS-003]
  status: client-requested
- id: DI-584
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.12 Resale Marketplace}
  text: >-
    Resale lets a guest resell a ticket through a secured channel with configurable commission and eligibility
    (e.g. minimum time before validity date, no expired tickets). Open: TICVAI-owned secure portal vs
    inside each client's own B2C site/app.
  topic: [flow, configurability]
  scope: [ADM-279, ADM-283, GST-067]
  status: open-question
- id: DI-585
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.13 UX Reference Walkthrough (Little Explorer)}
  text: >-
    Allam's UX benchmark (Little Explorer, Dubai): multi-location selector, a horizontal near-term date
    picker with full-calendar fallback, and tabbed browsing (passes / workshops / packages) on one page
    rather than multiple screens.
  topic: [layout, components, navigation]
  scope: [WEB-002, WEB-004, WEB-006, GST-003, GST-007]
  status: client-requested
- id: DI-586
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.13 UX Reference Walkthrough (Little Explorer)}
  text: >-
    Reference details: sibling/multi-buy discount shown with a struck-through original price; workshop
    add-ons inline with theme/cuisine sub-selection feeding time-slot availability; a package builder
    for bundled experiences.
  topic: [components, data-display]
  scope: [WEB-005, WEB-008, GST-008, GST-056]
  status: client-requested
- id: DI-587
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.13 UX Reference Walkthrough (Little Explorer)}
  text: >-
    Date-change flow detects conflicts across an existing multi-ticket cart and lets the guest shift the
    whole booking to a new date in one action.
  topic: [flow]
  scope: [WEB-010, WEB-006, GST-007, GST-009]
  status: client-requested
- id: DI-588
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.13 UX Reference Walkthrough (Little Explorer)}
  text: >-
    At checkout guests can sign in, register (with a visible loyalty-points incentive) or continue as
    guest; terms acceptance is implied by proceeding to payment, with no separate checkbox.
  topic: [flow, copy]
  scope: [WEB-012, WEB-016, GST-041, GST-009]
  status: client-requested
- id: DI-589
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: 4.13 Payment gateway approach}
  text: >-
    Support both redirect to the gateway's hosted page and embedded/iframe capture (card, Apple Pay, Tabby)
    on the platform's own checkout preserving its look and feel, for Network International and Stripe;
    embedded needs extra security certification to reassure guests.
  topic: [flow, branding]
  scope: [WEB-012, GST-009]
  status: agreed
- id: DI-590
  source: {file: sources/mom/TICVAI_MoM_2026-08-31_CS_B2B_Groups_Waivers_SalesChannel.docx, date: '2026-08-31',
    section: Key Decisions}
  text: >-
    Group check-in is a status distinct from the access scan: the group arrival screen records "Record
    group check in" separately.
  topic: [flow, data-display]
  scope: [BO-280]
  status: agreed
  note: from screen notes
- id: DI-591
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.1 Pricing Foundation & Structure}
  text: >-
    Pricing module (~7 sub-screens): overview dashboard of all pricing setups and status; price lists
    per channel, segment or product category (several can coexist); price categories/rate types (adult,
    child, member); rate structure; product-rate association; bundle/add-on pricing; multi-market/currency
    pricing.
  topic: [layout, navigation]
  scope: [ADM-048, ADM-049, ADM-050, ADM-052, ADM-053, ADM-054]
  status: client-requested
- id: DI-592
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.1 Pricing Foundation & Structure}
  text: >-
    Price hierarchy screen sets which level (category, item, segment) takes precedence; price lists can
    be cloned (e.g. B2C copied and discounted for B2B); a final validation screen confirms setup is complete.
  topic: [flow, configurability]
  scope: [ADM-055, ADM-056, ADM-057]
  status: client-requested
- id: DI-593
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.2 Pricing Rules}
  text: >-
    Pricing rules overview shows all rules, status and conflicts. Rule types: customer segment (regular,
    school, corporate, group), membership, residency/nationality (UAE resident vs non-resident), channel
    (POS, B2C, kiosk, B2B), venue/attraction/event.
  topic: [data-display, configurability]
  scope: [ADM-058, ADM-059, ADM-060, ADM-061, ADM-062, ADM-063]
  status: client-requested
- id: DI-594
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.3 / 4.4 Volume, Seasonal & Time-slot Pricing'}
  text: >-
    Tiered volume bands (up to 1,000 tickets, 1,000-5,000, above 5,000) applied automatically; seasonal
    pricing (low season to 30 September, high season from 1 October); date-based and time-slot/performance
    pricing.
  topic: [configurability]
  scope: [ADM-064, ADM-065, ADM-066]
  status: client-requested
- id: DI-595
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.4 Seasonal & Date-Based Pricing; Rule Priority}
  text: >-
    When several rules apply to one sale (e.g. summer rate plus school-group discount) the configurable
    pricing hierarchy decides; there is no automatic lowest-price-wins default.
  topic: [configurability]
  scope: [ADM-067, ADM-055]
  status: agreed
- id: DI-596
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.5 Taxes, Fees & Price Calculation'}
  text: >-
    Taxes inclusive or exclusive at product or category level; tax profiles combine several taxes incl.
    tax-on-tax (e.g. Egypt); per-product/transaction tax exemption flag.
  topic: [configurability]
  scope: [ADM-069, ADM-070, ADM-073]
  status: client-requested
- id: DI-597
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.5 Taxes, Fees & Price Calculation'}
  text: >-
    Fees are separate from taxes: e.g. a call-center convenience fee, or a shipping fee varying by destination
    (Dubai, Abu Dhabi, Ras Al Khaimah, international) calculated from the checkout address; applied at
    transaction, item or ticket level. Checkout must show the fee once the address is entered.
  topic: [data-display, configurability]
  scope: [ADM-071, ADM-072, WEB-012, GST-009]
  status: client-requested
- id: DI-598
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.5 Taxes, Fees & Price Calculation'}
  text: >-
    Region-configurable tax on pre-discount price (e.g. Egypt: AED 100 ticket with 20% off is paid at
    AED 80 but taxed on AED 100). Rounding must support up to three decimal places without dropping the
    third decimal where the currency requires it.
  topic: [data-display, configurability]
  scope: [global]
  status: agreed
  note: >-
    Three-decimal amounts affect every price display (guest, POS, kiosk, back office, receipts).
- id: DI-599
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.6 Price Governance}
  text: >-
    Price changes go through approval before publishing with version control (AED 100 > 110 > 120 tracked
    as versions 1.0, 1.1, 1.2); bulk updates (e.g. flat % across all retail or F&B items), bulk import,
    and rollback with full change history.
  topic: [flow, data-display]
  scope: [ADM-080, ADM-081, ADM-083, ADM-086, ADM-087]
  status: client-requested
- id: DI-600
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.7 Dynamic Pricing Strategies}
  text: >-
    Dynamic strategies: buy 2 get the 3rd free / BOGO, sibling tiers (first child full price, later children
    reduced), early-bird phases (e.g. 20% off a AED 200 base for the first 200 of 500, then 10% for the
    next 100, then full; discount and quota per phase), and price steps as capacity sells (e.g. at 50%).
  topic: [configurability]
  scope: [ADM-089, ADM-094, ADM-172]
  status: client-requested
- id: DI-601
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.8 AI Demand Forecasting & Pricing Simulation}
  text: >-
    AI forecasting recommends pricing/promotional action ahead of demand shifts (e.g. forecast rain >
    recommend a discount); a simulation tool previews the likely impact of a price change before it goes
    live.
  topic: [data-display, flow]
  scope: [ADM-106, ADM-109]
  status: client-requested
- id: DI-602
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.9 Ticket Upgrade & Downgrade Configuration}
  text: >-
    Upgrade dashboard shows upgrade/exchange volume and upgrade revenue for a period. Paths define which
    product upgrades to which (adult ticket to membership; lower to higher membership tier), with downgrade
    paths where allowed.
  topic: [reporting, configurability]
  scope: [ADM-308, ADM-309]
  status: client-requested
- id: DI-603
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.9 Ticket Upgrade & Downgrade Configuration}
  text: >-
    Upgrade eligibility checks validity/usage. Cases: seated ticket to a better section same day, paying
    the difference at the counter; general admission to season pass with the amount paid credited. Windows:
    before use, after use within a window, or until a cutoff (event ticket until the guest exits).
  topic: [flow, configurability]
  scope: [ADM-310, ADM-311, ADM-312, POS-010]
  status: client-requested
- id: DI-604
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.9 Upgrade financial treatment}
  text: >-
    Usage-based upgrades are pro-rata: e.g. 2 months used of a 1-year silver membership is credited and
    only the balance to the higher tier is charged. Attribute upgrades: a child ticket (sold by height)
    found to be adult on arrival is upgraded with the difference charged.
  topic: [data-display, flow]
  scope: [ADM-312, ADM-313, ADM-314]
  status: agreed
- id: DI-605
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.9 Ticket Upgrade & Downgrade Configuration}
  text: >-
    Staff can upgrade multiple tickets in one action. "Quick upgrade" is a direct single-path upgrade
    (gold > platinum); "flexible upgrade" lets the guest choose among several eligible targets.
  topic: [flow, components]
  scope: [ADM-315, ADM-316, GST-013, WEB-018]
  status: client-requested
- id: DI-606
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.9 / 5. Key Decisions}
  text: >-
    Upgrades must be available in the guest mobile/web app: guests view eligible upgrade options and complete
    the upgrade online without visiting on-site.
  topic: [flow]
  scope: [GST-012, GST-013, WEB-018]
  status: agreed
- id: DI-607
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.9 Clarified (group upgrades)}
  text: >-
    Group ticket upgrades are business-configurable (off by default); where allowed a group raises an
    upgrade request (e.g. via chat/support) rather than self-serving like an individual.
  topic: [flow, configurability]
  scope: [GST-068, ADM-315, SUP-014]
  status: agreed
- id: DI-608
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.10 Media & Credentials (QR, RFID, NFC & Wallets)'}
  text: >-
    Media = any identifier a ticket is presented by (QR, RFID/wristband, facial recognition, other). Virtual
    ticket media IDs configurable by prefix, suffix and length; several media can link to one ticket (e.g.
    a season pass by face, QR or RFID as fallbacks).
  topic: [configurability]
  scope: [BO-335, BO-337, BO-338, BO-341]
  status: client-requested
- id: DI-609
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.10 Media & Credentials (QR, RFID, NFC & Wallets)'}
  text: >-
    Apple/Google Wallet configuration covers template design (background colour, header, footer) and the
    guest-facing "Add to Apple Wallet" flow after an online purchase.
  topic: [branding, flow]
  scope: [BO-347, BO-348, WEB-013, GST-010, GST-013]
  status: client-requested
- id: DI-610
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.10 Media & Credentials (QR, RFID, NFC & Wallets)'}
  text: >-
    Open: NFC inside a wallet pass needs Apple certification (works with any reader) vs HID SDK on the
    guest phone (likely HID readers only). QR-based wallet passes are straightforward. Chinmay leans to
    direct Apple certification unless it is a hard blocker.
  topic: [hardware]
  scope: [BO-347, BO-348, GST-013]
  status: open-question
- id: DI-611
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.11 Order & Reservation Management}
  text: >-
    Sales team creates bookings for any customer type and sends a confirmation; on arrival the guest presents
    it to collect physical media or scans directly at access control. Dashboard: today's orders/ reservations,
    confirmed guests, booking status; order detail shows customer and items.
  topic: [data-display, flow]
  scope: [BO-304, BO-305, BO-308, KSK-011]
  status: client-requested
- id: DI-612
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.11 Order & Reservation Management}
  text: >-
    Booking statuses: draft > reserved (awaiting payment) > completed, with cancelled or expired paths.
    Hold policy sets how long a capacity booking is held pending payment before release to inventory.
  topic: [states]
  scope: [BO-306, BO-307, WEB-031, GST-016, GST-017]
  status: client-requested
- id: DI-613
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.11 Order & Reservation Management}
  text: >-
    Channel rules govern which actions each channel can perform (create, upgrade, cancel) and whether
    checkout is guest checkout (name, phone, email only) or full registration/sign-in. Customer category
    (corporate, travel agent/B2B, school) determines extra information collected.
  topic: [configurability, flow]
  scope: [BO-308, BO-309, WEB-011, GST-041]
  status: client-requested
- id: DI-614
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.11 Order & Reservation Management}
  text: >-
    Order lines show all contents (tickets, retail, F&B) with inventory hold/availability; a completeness
    check confirms payment, customer and capacity before finalising; an at-risk view flags bookings nearing
    expiry (e.g. payment not completed).
  topic: [data-display, states]
  scope: [BO-310, BO-312, BO-313]
  status: client-requested
- id: DI-615
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: '4.12 Amendment, Cancellation & Booking Status'}
  text: >-
    Amendments/cancellations/reschedules are checked against the applicable policy before being allowed.
    A booking's financial status (deposit required, partial payment, full payment) is tracked; schools
    and corporates can pay a 20-30% deposit with the balance due on or before arrival.
  topic: [states, data-display]
  scope: [BO-314, BO-316, BO-277, WEB-014, PTR-009]
  status: agreed
- id: DI-616
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.13 Privacy Consent & Cookie Policy}
  text: >-
    Checkout captures marketing/newsletter opt-in and preferred contact method (email vs phone).
  topic: [components, data-display]
  scope: [WEB-012, GST-009, CMS-027]
  status: client-requested
- id: DI-617
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.13 Privacy Consent & Cookie Policy}
  text: >-
    Configurable cookie consent banner (accept/reject) per website; some cookies flagged mandatory (non-rejectable),
    others optional; templated and configurable in the system.
  topic: [components, configurability]
  scope: [CMS-025, CMS-026, P01]
  status: client-requested
- id: DI-618
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.14 Resale Marketplace - Detailed Follow-Up}
  text: >-
    Three resale access models: (1) the client's own B2C site, where a guest requests resale within an
    admin-set price range (e.g. 10-20% below original); (2) a TICVAI-hosted white-label resale portal
    (e.g. museum.tickvai.com) for clients without B2C; (3) API for clients' own resale markets.
  topic: [branding, flow]
  scope: [ADM-298, ADM-300, ADM-303, ADM-307, GST-067]
  status: agreed
- id: DI-619
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.14 Resale Marketplace - Board 1 / Board 2}
  text: >-
    Board 1 resale rules: eligibility, allowed price range, venue/tenant fees and commission, optional
    approval step. Board 2 resale purchase: payment, ownership transfer and settlement to the seller.
  topic: [configurability, flow]
  scope: [ADM-279, ADM-282, ADM-283, ADM-284, ADM-289, ADM-290, ADM-294]
  status: client-requested
- id: DI-620
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.14 Decision (ticket ID on resale)}
  text: >-
    Resale keeps the original virtual ticket ID; only owner name and media (QR) change. An ownership change
    log shows the history against one ID (e.g. VT0010: Qossai > Allam > Chinmay).
  topic: [data-display]
  scope: [ADM-290, ADM-296, BO-355]
  status: agreed
- id: DI-621
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.14 Resale Marketplace - Board 3}
  text: >-
    White-label resale page: guest lists a ticket and sets a price within the allowed range; buyer searches,
    browses and receives the new ticket after purchase; the resale summary shows the market fee TICVAI
    retains.
  topic: [flow, data-display]
  scope: [ADM-299, ADM-300, ADM-301, ADM-303, ADM-304, ADM-305, ADM-306, GST-067]
  status: client-requested
- id: DI-622
  source: {file: sources/mom/TICVAI_MoM_2026-09-01_Pricing_Upgrades_Media_Reservations_Resale.docx, date: '2026-09-01',
    section: 4.14 Resale Marketplace - Detailed Follow-Up}
  text: >-
    Resale listing dashboard with active / sold / expired / pending listings. Qossai: resale is expected
    almost exclusively for event tickets (concerts, sports), not open-dated admission tickets.
  topic: [data-display, states]
  scope: [ADM-288, ADM-302]
  status: client-requested
- id: DI-623
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.1
      Access Control Overview & Gate/Device Visualization}
  text: >-
    Venue-wide attendance overview (open/closed gates, offline/maintenance status, graphed) and a visual
    map of all access-control locations across venues/tenants, including entry and exit turnstile layouts
    that vary by venue.
  topic: [data-display, components, layout]
  scope: [BO-144, BO-150, BO-256]
  status: client-requested
- id: DI-624
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.1
      Access Control Overview & Gate/Device Visualization}
  text: >-
    Gate & zone management shows gates per location (e.g. three at a main entry plaza, two at a main entry
    zone); device inventory lists turnstiles and handhelds assignable per gate; a device is added by choosing
    an integrated turnstile model and entering connection details (IP address).
  topic: [data-display, hardware]
  scope: [BO-148, BO-149, BO-195, BO-196]
  status: client-requested
- id: DI-625
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.1
      / 4.2 Health Monitoring & Alerts}
  text: >-
    Real-time health view of device connectivity. Device-pushed events (anti-passback attempts, power
    loss, network loss) are surfaced as alerts and reports, e.g. notifying the operations team when a
    turnstile goes offline.
  topic: [states, data-display]
  scope: [BO-194, BO-203, BO-224, EMP-037]
  status: agreed
- id: DI-626
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: '4.3
      Access Rules - Entry/Exit, Anti-Passback & Validity'}
  text: >-
    Access rules dashboard shows active rules, drafts and status. Rules: one entry per day vs unlimited
    or limited re-entry; exit scan required or exit in free rotation; turnstile modes (free rotation,
    entry, exit); anti-passback window with exit-before-re-entry option.
  topic: [configurability]
  scope: [BO-154, BO-156, BO-157, BO-197, BO-201]
  status: client-requested
- id: DI-627
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.3
      Decision (scan without physical passage)}
  text: >-
    A successful scan marks the ticket used even if the guest did not pass (stroller, turnstile re-locked).
    Genuine cases are resolved manually by security from the ticket's scan-history log, so scanner lookup
    must show it.
  topic: [states, flow]
  scope: [SCN-003, SCN-009, BO-226]
  status: agreed
- id: DI-628
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: '4.3
      / 4.4 Validity, Crossover & Companion Rules'}
  text: >-
    Validity date range plus blockout dates (e.g. public holidays, special event days); entry allowance
    consumption blocks use once exhausted; multi-park crossover (how many parks, same-day or one per day,
    consecutive or flexible days); companion rules (child ticket needs a qualifying adult).
  topic: [configurability, states]
  scope: [BO-152, BO-158, BO-159, BO-160, BO-161]
  status: client-requested
- id: DI-629
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.5
      Rule Simulation Tool}
  text: >-
    Simulation tool validates a rule (e.g. ticket allowed in Zone A and B, not C or D) via a virtual scan
    before publishing, without a real transaction.
  topic: [flow]
  scope: [BO-163]
  status: client-requested
- id: DI-630
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.6
      Dynamic QR Code - Concept & Generation Approach}
  text: >-
    Dynamic QR refreshes periodically to cut fraud/resale. Open: beacon-based (code hidden until the phone
    is near a gate beacon via Bluetooth, then refreshes ~every 2 minutes; Qossai: more secure) vs app-generated;
    GPS geofencing also raised. Chinmay to propose.
  topic: [motion, states, hardware]
  scope: [GST-055, BO-165, BO-168]
  status: open-question
- id: DI-631
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.6
      Hard requirement (offline)}
  text: >-
    Qossai: the dynamic QR must appear and work without internet, since crowded events (10,000+) suffer
    severe congestion; it must work offline via Bluetooth/beacon or an equivalent local mechanism.
  topic: [offline, states]
  scope: [GST-055, BO-171]
  status: agreed
- id: DI-632
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.6
      Credential activation and display rules}
  text: >-
    The dynamic QR stays blurred until beacon proximity is detected, then activates and refreshes on a
    short interval (e.g. every 6-12 seconds); screenshot capture of the active code is prevented.
  topic: [motion, states]
  scope: [GST-055, BO-166]
  status: client-requested
  note: >-
    Refresh interval stated as ~2 minutes in 4.6 generation approach and 6-12 seconds here; confirm.
- id: DI-633
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.7
      Dynamic QR Code - Business Flexibility & Exceptions}
  text: >-
    Dynamic QR is chosen per event (fully dynamic, normal, or mixed); a per-product override disables
    it for exceptions such as physically delivered VIP invitations and B2B/reseller tickets, which fall
    back to standard QR or RFID.
  topic: [configurability]
  scope: [BO-165, BO-166]
  status: agreed
  note: B2B/reseller handling under a fully-dynamic policy still listed as unresolved edge case.
- id: DI-634
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.7
      Dynamic QR Code - Business Flexibility & Exceptions}
  text: >-
    For a fully dynamic-QR event, even POS-purchased tickets are delivered by email/SMS with instructions
    to download the app and link the ticket, not printed as a static QR on the spot.
  topic: [flow, hardware]
  scope: [POS-005, POS-026]
  status: agreed
- id: DI-635
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.7
      Confirmed (Pradnya's question)}
  text: >-
    Any online purchase for a dynamic-QR event must be linked to the mobile app to show the working code;
    web/desktop purchases are redirected into the app for activation, not exempted.
  topic: [flow, copy]
  scope: [WEB-013, WEB-018, GST-012, GST-055]
  status: agreed
- id: DI-636
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: '4.8
      Device Binding, Credential Transfer & Revocation'}
  text: >-
    Once activated in the app a digital ticket is bound to one approved device; moving to a new device
    requires deactivating the prior binding. Credential transfer moves a ticket to another person's device
    and invalidates the original holder's copy.
  topic: [flow, states]
  scope: [GST-055, GST-014, WEB-030, BO-167, BO-169]
  status: client-requested
- id: DI-637
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.9
      Media swap}
  text: >-
    Media swap: zero-value transaction converting a ticket's media on-site, e.g. scanning an online QR
    at a kiosk to issue a physical wristband instead.
  topic: [flow, hardware]
  scope: [BO-179, KSK-011, EMP-036]
  status: client-requested
- id: DI-638
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.9
      Hotel/PMS integration}
  text: >-
    Affiliated-hotel guests get a zero-value ticket/wristband after room-number lookup and identity verification,
    or charge on-site purchases to their room via the same lookup (PMS such as Opera).
  topic: [flow]
  scope: [BO-182, POS-005, POS-027]
  status: client-requested
- id: DI-639
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.9
      Media & Credential Configuration}
  text: >-
    Media compatibility testing validates that each supported media type works at each gate/device before
    go-live.
  topic: [hardware, flow]
  scope: [BO-183, BO-203]
  status: client-requested
- id: DI-640
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: '4.10
      Facial Recognition - Face Pass, Face Tag & Enrollment'}
  text: >-
    Two face credentials: Face Pass (long-term, renewable, for memberships/season passes) and Face Tag
    (short-lived, single day or event). Retention is venue-configurable per tier.
  topic: [data-display, configurability]
  scope: [GST-069, BO-186, BO-188, BO-192]
  status: agreed
- id: DI-641
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: '4.10
      Facial Recognition - Face Pass, Face Tag & Enrollment'}
  text: >-
    Face enrollment via mobile app, website, POS, self-service kiosk, or at the turnstile itself (scan
    the ticket, then look at the reader on first use), covering e.g. B2B/reseller tickets. Re-enrollment
    and fallback to QR/RFID if face fails at the gate.
  topic: [flow, hardware]
  scope: [GST-069, P01, P04, P05, BO-190, BO-191]
  status: agreed
- id: DI-642
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.11
      Privacy & Biometric Data Retention}
  text: >-
    Qossai: use an existing major venue-group client's live app and published privacy policy as the model
    for how facial-recognition consent, data use and retention are explained to guests.
  topic: [copy]
  scope: [GST-069, GST-066, BO-187]
  status: client-requested
- id: DI-643
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.12
      Media as a Payment Method}
  text: >-
    The same wristband or enrolled face works as stored-value payment for F&B and retail: balance checked
    and deducted automatically at the point of sale; top-up via the same credential.
  topic: [hardware, flow]
  scope: [POS-005, POS-021, POS-023, BO-1137]
  status: client-requested
- id: DI-644
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.13
      Turnstile Hardware & Handheld Scanner Configuration}
  text: >-
    Turnstile light/sound feedback is configurable: e.g. green light for an adult ticket, orange for a
    child ticket as a quick visual fraud check; some models play audio, including celebratory sounds (e.g.
    birthday visit).
  topic: [hardware, configurability]
  scope: [BO-197, BO-198]
  status: client-requested
- id: DI-645
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.13
      Turnstile Hardware & Handheld Scanner Configuration}
  text: >-
    A custom welcome message and the venue's branding/logo show on the reader on a successful scan.
  topic: [branding, hardware]
  scope: [BO-198, BO-202]
  status: client-requested
- id: DI-646
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.13
      / 4.14 Handheld Scanners & Offline Mode}
  text: >-
    Handheld scanners read QR, RFID or other supported media. Offline, devices validate locally from data
    embedded in the credential, queue the transactions and auto-sync when connectivity returns.
  topic: [offline, devices]
  scope: [SCN-003, SCN-013, SCN-014, BO-200, BO-211]
  status: agreed
- id: DI-647
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: '4.15
      Guest Journey, Group/B2B Profiles & Live Operations Dashboard'}
  text: >-
    Group/B2B admission profile view shows entry statistics by category (general admission, group, re-entry,
    crossover) and attendance breakdowns for schools and other groups from scanned tickets.
  topic: [reporting, data-display]
  scope: [BO-215, BO-217, BO-258]
  status: client-requested
- id: DI-648
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.15
      Live Operations Dashboard}
  text: >-
    Live operations dashboard: real-time attendance by venue and gate with each gate's online/offline
    status and entry count. Turnstile mode can be switched through the day (more entry gates in the morning,
    more exit in the evening).
  topic: [data-display, configurability]
  scope: [BO-224, BO-230, SCN-016]
  status: client-requested
- id: DI-649
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.16
      Ticket Lookup & Manual Override}
  text: >-
    Ticket lookup shows the complete scan history: purchaser, gate and timestamp for every attempt. Security
    can manually override to admit a guest despite a scan issue; every override is logged against the
    visitor's record.
  topic: [data-display, flow]
  scope: [SCN-008, SCN-009, EMP-014, BO-226, BO-228]
  status: client-requested
- id: DI-650
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.16
      Attribute-Based Access Control}
  text: >-
    Access decisions consider who, ticket type, where, when and context; e.g. an otherwise valid unused
    ticket is denied once the venue's maximum live occupancy is reached, until guests exit. Scanners need
    a venue-full denial state.
  topic: [states]
  scope: [BO-237, BO-255, SCN-003]
  status: agreed
- id: DI-651
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 4.16
      Fraud Detection & Live Monitoring}
  text: >-
    Fraud assessment view flags suspicious usage patterns or threats; live monitoring shows current attendance,
    in-park counts and entry/exit/crossover activity per venue in real time.
  topic: [data-display]
  scope: [BO-244, BO-254, BO-255]
  status: client-requested
- id: DI-652
  source: {file: sources/mom/TICVAI_MoM_2026-09-02_AccessControl.docx, date: '2026-09-02', section: 5.
      Key Decisions & Agreements}
  text: >-
    A ticket is always one virtual record; QR, RFID, NFC, face and future credentials (e.g. hotel room
    key, city transit card) are interchangeable media linked to it. Screens should show one ticket with
    its linked media, not separate tickets per medium.
  topic: [data-display]
  scope: [BO-334, BO-338, BO-355, GST-013]
  status: agreed
- id: DI-653
  source: {file: screens/P08-venue-back-office.yaml, date: '2026-09-04', section: BO-144 and the other
      board hubs}
  text: >-
    Workshop packs group screens ten to a board, each opened by a command centre; that grouping is the
    navigation: the nine detail screens are reached from the board's hub and return to it.
  topic: [navigation]
  scope: [ADM-038, ADM-048, ADM-058, ADM-068, ADM-078, ADM-088, ADM-098, ADM-108, ADM-118, ADM-128, ADM-138,
    ADM-148, ADM-158, ADM-168, ADM-178, ADM-188, ADM-198, ADM-208, ADM-218, ADM-228, ADM-238, ADM-248,
    ADM-258, ADM-268, ADM-278, ADM-288, ADM-298, ADM-308, BO-144, BO-154, BO-164, BO-174, BO-184, BO-194,
    BO-204, BO-214, BO-224, BO-234, BO-244, BO-254, BO-264, BO-274, BO-284, BO-294, BO-304, BO-314, BO-324,
    BO-334, BO-344, BO-354, CMS-021, CMS-031, CMS-041, CMS-051, PTR-022, PTR-032, PTR-042, SUP-009, SUP-019]
  status: agreed
  note: >-
    from screen notes; ids are the 59 hubs; about 530 child screens carry "Reached from <hub>". "Stated
    on 4 September" in the notes; same pattern recorded in docs/active/client-design-boards-audit.md.
- id: DI-654
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.1 Accreditation Overview & Application Directory}
  text: >-
    Accreditation: applicant fills a customisable form, goes through approval (with documents), and receives
    a credential (photo badge, QR or RFID) for event access. Dashboard shows total registered, pending
    review and expired documents; directory searches applications by name, company or business info.
  topic: [flow, data-display]
  scope: [ACC-001, ACC-002, ACC-005, BO-615, BO-616]
  status: client-requested
- id: DI-655
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.2 Accreditation Form Builder, Categories & Program Setup'}
  text: >-
    The venue creates a partner/company account (main or sub-accounts) whose users log in and submit accreditation
    for their members; entry can be done by the end user or by the admin team on their behalf.
  topic: [flow]
  scope: [BO-617, BO-632, ACC-002, P11]
  status: client-requested
- id: DI-656
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.2 Accreditation Form Builder, Categories & Program Setup'}
  text: >-
    Drag-and-drop form builder sets exactly which fields each form collects; categories (media, corporate,
    individual guest) each have their own form; programmes link a category to an event, venue or season;
    a requirement matrix sets documents per category (e.g. contractors need company authorisation).
  topic: [components, configurability]
  scope: [BO-618, BO-619, BO-620, BO-621, BO-622, ACC-002]
  status: client-requested
- id: DI-657
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.3 Application Requirements, Document Validation & OCR Auto-Fill'}
  text: >-
    Submission tracking shows submitted, pending and missing-document applications. Upload accepts PDF,
    JPEG, PNG and enforces file-size/quality limits at upload time.
  topic: [states, components]
  scope: [BO-623, ACC-002, ACC-004]
  status: client-requested
- id: DI-658
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.3 OCR Auto-Fill / 5. Key Decisions}
  text: >-
    Allam asked, Chinmay confirmed: uploading an ID (e.g. Emirates ID image or PDF from phone or laptop)
    auto-fills form fields (ID number, expiry) via OCR; data is stored as structured fields to track expiry
    and prompt renewal.
  topic: [flow, components]
  scope: [ACC-002, BO-627, BO-629]
  status: agreed
- id: DI-659
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.4 Accreditation Profile, Identity Verification & Duplicate Prevention'}
  text: >-
    Staff open an application to review the photo and all details and verify documents are correct, legible
    and valid. Duplicate passport/Emirates ID numbers are blocked, prompting the applicant to resolve
    or resubmit rather than silently creating a duplicate.
  topic: [states, data-display]
  scope: [BO-626, BO-627, BO-631, ACC-003, ACC-007]
  status: agreed
- id: DI-660
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.4 Accreditation Profile, Identity Verification & Duplicate Prevention'}
  text: >-
    A main account holder (company/agent) sees the status of every application under their organisation
    (approved, rejected, requires resubmission), whether the credential is collected physically or sent
    as a soft copy by email.
  topic: [data-display, states]
  scope: [ACC-004, BO-632, P11]
  status: client-requested
- id: DI-661
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.5 Approval Workflow, SLA & Escalations'}
  text: >-
    Multi-level approval chains per category (e.g. government vs private/corporate/media); SLA turnaround
    per category with alerts as backlog builds (e.g. pending media passes); auto-escalation when unactioned.
  topic: [configurability, flow]
  scope: [BO-635, BO-637, BO-638, BO-641]
  status: client-requested
- id: DI-662
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.6 Credential Issuance, Access Rights & Lifecycle Management'}
  text: >-
    Approved credential: printed photo badge, QR or RFID depending on the event's configured media; collected
    physically or delivered digitally to a mobile device. Access rights set zones per category (media
    all zones; corporate limited).
  topic: [hardware, configurability]
  scope: [BO-645, BO-647, BO-648, BO-649, BO-656, ACC-005]
  status: client-requested
- id: DI-663
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.6 / 4.7 Lifecycle & Notifications}
  text: >-
    Lifecycle: activation, expiry, renewal, suspension; if a document (e.g. Emirates ID) expires before
    the event, a resubmission request is raised and the credential is blocked if unresolved. Applicants
    are notified at each status change (approved, rejected, needs validation).
  topic: [states]
  scope: [ACC-004, BO-664, BO-673, BO-675]
  status: client-requested
- id: DI-664
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.7 Notifications, Bulk Operations & Analytics'}
  text: >-
    Bulk: a company with many members (e.g. 1,000) gets an Excel template to submit all details and documents
    at once; each imported record still goes through profile, documents and approval.
  topic: [flow]
  scope: [BO-680, P11]
  status: client-requested
- id: DI-665
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.7 Notifications, Bulk Operations & Analytics'}
  text: >-
    Accreditation analytics: approvals, upcoming expiries, per-category detail, attended vs issued (e.g.
    1,000 passes issued, 700 scanned), and year-over-year or venue-over-venue comparisons.
  topic: [reporting]
  scope: [BO-684, BO-685, BO-686, BO-688]
  status: client-requested
- id: DI-666
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.8 Accreditation Channel Placement & API Access}
  text: >-
    Accreditation is primarily completed in the web portal (document upload and photo checks suit a larger
    screen); the same submission is also available in the guest mobile app as a secondary option for individuals.
  topic: [devices, layout]
  scope: [P11, P02]
  status: agreed
- id: DI-667
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.9 Entitlements Portfolio - Structure, Family/Group & Assignment'}
  text: >-
    Entitlements portfolio is used both by the guest (mobile app) and by customer service: one view of
    restrictions, wallet balance and all entitlements; a unified list across a visit (e.g. four admissions,
    two fast passes, a meal package, a parking entitlement).
  topic: [layout, data-display]
  scope: [GST-012, WEB-018, SUP-010, BO-737]
  status: client-requested
- id: DI-668
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: '4.9 Entitlements Portfolio - Structure, Family/Group & Assignment'}
  text: >-
    Family/dependent view shows a family ticket's composition (e.g. two adults, two children) with each
    dependent's entitlements; equivalent views for school and corporate bookings.
  topic: [data-display]
  scope: [GST-012, GST-013, SUP-010, BO-273]
  status: client-requested
- id: DI-669
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.9 Ownership and transfer}
  text: >-
    A purchased ticket can be transferred to another guest (e.g. a friend); the system keeps the original
    purchaser and full transfer history.
  topic: [flow, data-display]
  scope: [GST-014, WEB-030, BO-355]
  status: client-requested
- id: DI-670
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.10 / 4.11 Entitlements Lifecycle & Usage}
  text: >-
    Entitlement statuses: active, reserved, consumed, transferred, expired, refunded/cancelled; views
    show entitlements nearing expiry, real-time consumption per customer, and whether a ticket has been
    upgraded.
  topic: [states, data-display]
  scope: [GST-012, GST-013, BO-297, BO-336, SUP-010]
  status: client-requested
- id: DI-671
  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.10 Screen consolidation / 5. Key Decisions}
  text: >-
