# The client's design inputs from the meetings -- AUTHORED. Edit this file; nothing regenerates it.
#
# One entry per design-relevant statement in the minutes (sources/mom/), the 30 September tracker MoM,
# the client's design-review responses (sources/designs/guest-rev3-30-september/), the Decisions
# Register's rev 3 sheet (handoff/rev3-decisions.json), the Design Vision Book and the meeting
# decisions the screen files cite. Built 1 October 2026.
#
# How it is used: tools/build-design-inputs.py validates it and writes README.md beside it and the
# app guides' blocks; tools/export-design-batch.py puts the inputs that apply into every batch's
# BRIEF.md and BUNDLE.md ("Design inputs from the client meetings"). Superseded entries stay here
# as history and are left out of every bundle.
#
# HOW TO ADD ONE (a new MoM, workshop output or design review):
#   - id:       the next free DI-nnn; never reuse or renumber one.
#   - source:   file (relative to ticvai/; ../ for the repository root), date (YYYY-MM-DD), section.
#   - text:     short and faithful: the client's specifics, numbers and examples; who asked if known.
#   - topic:    any of layout navigation components branding configurability flow states copy
#               accessibility rtl offline devices motion density data-display hardware reporting other
#   - scope:    the narrowest true one: [global] | a platform [P04] | a module ["P02/Booking & Selection"]
#               (spelled as in screens/P*.yaml) | screen ids [GST-004, WEB-004]. Mixed lists are fine.
#   - status:   agreed | client-requested | open-question (state the question and the default to build)
#   - supersedes: [DI-nnn] when it changes an earlier input; the old one drops out of the bundles.
#   - ref, note: optional.
#   Then run: python3 tools/build-design-inputs.py   (validates every scope against the screens)

