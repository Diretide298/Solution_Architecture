  source: {file: sources/mom/TICVAI_MoM_2026-09-07_Accreditation_Entitlements_VirtualQueue.docx, date: '2026-09-07',
    section: 4.13 Virtual Queue - Mobile Journey & Configuration}
  text: >-
    In the app a guest with a valid ticket browses rides, sees the current wait (e.g. 60 minutes), joins
    the virtual queue for their party and gets a return window (e.g. 4:50-5:00 PM). Missing the window
    can auto-release the slot.
