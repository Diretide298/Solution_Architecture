  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: M18-15}
  text: >-
    Marketing opt-in ("Send me offers and news") sits beside the T&Cs at checkout and is never pre-ticked.
    Open: whether a guest-checkout customer may be marketed on it; until confirmed it stays unticked and
    nothing is sent without it.
  topic: [components, copy]
  scope: [WEB-012, GST-009]
  status: agreed
  note: from screen notes
- id: DI-955
  source: {file: sources/mom/TICVAI_MoM_2026-09-18_AI_Governance_ConfigAssistant_Forecasting_UX.docx,
    date: '2026-09-18', section: M18-01}
  text: >-
    The AI policy screen shows each conflict and the more restrictive result it resolved to; a plan step
    failing a module limit is shown as governance-blocked and never applied.
  topic: [data-display, states]
