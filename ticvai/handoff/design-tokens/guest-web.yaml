- 'A variable''s `default` is what the markup falls back to before the theme is applied (the prototype''s own default
  venue): build the shell so it is never seen, by applying the tenant''s theme first.'
- Colours are mixed by the rules (`mix`, `rgba`, `inkOn`, `onColor` in the prototype); the shell implements the
