    - field: compareTo (shown as "Compare with")
      rule: Previous period, Same period last year, Target, Benchmark.
      source: contracts/satellite/reporting.yaml#getKpiValues
    outputs:
    - element: scorecard row
      rule: 'KPI, actual, target, % of target with a progress bar, variance %, direction arrow, status word (On
        track, Warning, Critical, No target), as-of time; Critical first. Money in the venue currency at its scale.

        '
      source: contracts/satellite/reporting.yaml#KpiValue | MATRIX 6.1.45 | MATRIX 6.1.78
    - element: stale value
      rule: '"Data delayed - as of 09:02" replaces the status colour; the value is still shown.'
      source: contracts/satellite/reporting.yaml#KpiValue
    actions:
    - action: Save targets
      result: Replaces the KPI's target set inside the caller's scope; rows left out are removed, so the grid always
        sends every row it shows and confirms removals.
      source: contracts/satellite/reporting.yaml#setKpiTargets
    edgeCases:
    - case: Retail outlet monthly target
      expected: Target versus achieved with variance per outlet per month is a target at the outlet's venue scope
        for that month.
      source: DI-368 | MoM 2026-08-19 4.9 Retail Intelligence & Reporting
    consistency:
    - with: ANL-026
      note: Same band editor and status words.
    - with: ANL-064
      note: The "Compare with Benchmark" option uses the normalisation set there.
    sampleData:
    - kpi: Takings
      scope: Aquaventure Waterpark
      period: Sep 2026
      actual: AED 11,842,300.25
      target: AED 12,500,000.00
      ofTarget: 94.7%
      variance: -5.3%
      status: Warning
    - kpi: Admissions
      scope: Aquaventure Waterpark
      period: Sep 2026
      actual: 158,402
      target: 150,000
      ofTarget: 105.6%
      status: On track
    - kpi: Takings
      scope: Lost Paradise of Dilmun
      period: Sep 2026
      actual: BHD 171,204.375
      target: BHD 185,500.000
      ofTarget: 92.3%
      status: Warning
    corrections:
    - what: Product, Channel, Attraction and Business Unit drawn as target dimensions
      why: A target is keyed on scope and period only.
      source: contracts/satellite/reporting.yaml#KpiTarget | screens/P16-venue-analytics.yaml#ANL-063
    - what: Scorecards assume finance KPIs (net revenue, refund rate, average ticket value)
      why: None exists as a governed measure; only Takings and Admissions are seeded.
      source: contracts/satellite/reporting.yaml#MetricSource | contracts/satellite/reporting.yaml#ReportingSystemKpi
  ANL-064:
    summary: 'Defines how sites are compared fairly: per visitor, per operating hour, per staffed position or per
      square metre, using denominators recorded per site and period. A water park and a museum differ on revenue
      per visitor for reasons that are not performance, so the basis always travels with the comparison. This is
      the one screen in the set with fully bound data.

      '
    inputs:
    - field: site (pack "Scope path")
      rule: A site picker; never a typed path.
      source: contracts/satellite/reporting.yaml#SiteNormalisationBasis
    - field: periodStart, periodEnd
      rule: Required; one basis per site per period. Periods for one site should not overlap (see decisions).
      source: contracts/satellite/reporting.yaml#SiteNormalisationBasis
    - field: visitors, operatingHours, staffedPositions, areaSquareMetres
      rule: Whole visitors; hours, positions (average staffed over the period) and area to one decimal; none negative;
        leave empty when not applicable (a ride-only site has no meaningful area).
      source: contracts/satellite/reporting.yaml#SiteNormalisationBasis
    - field: KPI to benchmark
      rule: Required before any comparison loads; the benchmark read needs a KPI.
      source: contracts/satellite/reporting.yaml#getAnalyticsBenchmark
    outputs:
    - element: comparison
      rule: Per site - value, normalised value with its basis in the label ("AED 96.40 per visitor"), rank and percentile.
      source: contracts/satellite/reporting.yaml#BenchmarkRow
    actions:
    - action: Save basis
      result: Saves the denominators for the selected sites and periods.
      source: contracts/satellite/reporting.yaml#setSiteNormalisationBasis
    edgeCases:
    - case: A site with no basis for the period
      expected: Its normalised value is empty with "No visitors recorded for Sep 2026 - add a basis"; it is not
        ranked.
      source: contracts/satellite/reporting.yaml#BenchmarkRow
    consistency:
    - with: ANL-020
      note: The multi-site comparison screen reads these comparisons; same basis wording.
    sampleData:
      bases:
      - site: Aquaventure Waterpark
        period: Sep 2026
        visitors: 158402
        operatingHours: 300
        staffedPositions: 214.5
        area: 102,000 m²
      - site: House of Wisdom, Sharjah
        period: Sep 2026
        visitors: 41250
        operatingHours: 330
        staffedPositions: 38.0
        area: 15,000 m²
      comparison:
      - site: Aquaventure Waterpark
        kpi: Takings
        value: AED 11,842,300.25
        perVisitor: AED 74.76
        rank: 1
      - site: House of Wisdom, Sharjah
        kpi: Takings
        value: AED 1,212,950.00
        perVisitor: AED 29.40
        rank: 2
    corrections:
    - what: Columns labelled with schema paths (SiteNormalisationBasis.id, .scopePath ...) and a free-text Scope
        path field
      why: Spec leak onto the screen; labels must be Site, From, To, Visitors, Operating hours, Staffed positions,
        Area, and the id is not shown.
      source: screens/P16-venue-analytics.yaml#ANL-064
    - what: The pack's measures drawn as metric tiles (Revenue per Visitor, Entries per Gate per Hour, Incidents
        per 10,000 Visitors ...)
      why: They are comparison choices, not values; and gates and incidents are not normalisation bases, so two
        of the seven cannot be computed. Revenue per visitor needs a revenue KPI, which today is Takings only.
      source: contracts/satellite/reporting.yaml#BenchmarkNormalisation | contracts/satellite/reporting.yaml#ReportingSystemKpi
    - what: The benchmark read is triggered on load with no KPI
      why: It requires a KPI id; the screen needs a KPI picker first.
      source: contracts/satellite/reporting.yaml#getAnalyticsBenchmark
    decisions:
    - question: Is saving bases a replace of the whole set or an upsert per site and period, and may periods overlap?
      decision: 'Drawn default accepted: Upsert per site and period; overlapping periods refused.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-352 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#setSiteNormalisationBasis
  ANL-065:
    summary: 'The register of every source feeding analytics, its refresh state and its health. Read-only: sources
      are connected by the platform, not added here. The thing to get right is the security principle the pack calls
      out: connection details and credentials are never displayed, only whether the connection works.

      '
    outputs:
    - element: row
      rule: 'Source name, kind (operational replica, Google Analytics, file import ...), refresh schedule in words,
        last successful sync, last attempt, rows in the last run, status, last error in words, the datasets it feeds.
        Failed and stale first.

        '
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline | contracts/satellite/reporting.yaml#listAnalyticsPipelines
    - element: Owner, Connection, Authentication method, Data classification
      rule: Not stored; Authentication is never shown beyond "Connected" or "Credential expired".
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
    edgeCases:
    - case: Google Analytics conversion source fails
      expected: Conversion tiles show "Data delayed"; the row names the affected datasets.
      source: MoM 2026-09-08 4.2 Command Center Overview (Board 1) | contracts/satellite/reporting.yaml#AnalyticsPipeline
    consistency:
    - with: ANL-067
      note: Same rows; ANL-067 adds the time view and quality checks.
    sampleData:
    - name: Ticketing and orders (replica)
      kind: Operational replica
      schedule: Continuous
      lastSuccess: Updated 40 sec ago
      rows: 18240
      status: Healthy
      feeds:
      - Orders
      - Order lines
      - Payments
    - name: Google Analytics - web sessions
      kind: External
      schedule: Every hour
      lastSuccess: 30 Sep 2026 22:00
      status: Failed
      error: Credential expired
      feeds:
      - Web sessions
    corrections:
    - what: Empty first-run state "carries the create action"
      why: There is no operation to add or edit a source; the registry is read-only.
      source: contracts/satellite/reporting.yaml#listAnalyticsPipelines | screens/P16-venue-analytics.yaml#ANL-065
    - what: One row per source assumed; the data is one row per pipeline
      why: A source with two pipelines shows twice; group rows by source name.
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
  ANL-066:
    summary: 'The governed business layer between raw data and dashboards, reports and AI: domains, datasets with
      their grain, fields with labels, types, default aggregation and a personal-data flag, and how datasets relate.
      The one thing to get right: publishing replaces the whole model, so anything left out disappears from every
      report that used it; the design must show what a publish removes.'
    inputs:
    - field: Dataset grain
      rule: A required sentence "One row is one …" for each dataset; the most common cause of a wrong report is
        a silently multiplied grain.
      source: contracts/satellite/reporting.yaml#/components/schemas/SemanticModel
    - field: Field
      rule: Code, business label, data type, default aggregation, description, and Personal data on or off.
      source: contracts/satellite/reporting.yaml#/components/schemas/SemanticModel
    - field: Relationship
      rule: From dataset, to dataset, cardinality (one-to-one, one-to-many, many-to-one, many-to-many); many-to-many
        shown with a warning.
      source: contracts/satellite/reporting.yaml#/components/schemas/SemanticModel
    outputs:
    - element: Catalogue tree
      rule: Domain → dataset → fields, with the published version number and date.
      source: contracts/satellite/reporting.yaml#getSemanticModel
    - element: Publish preview
      rule: Added, changed and removed datasets and fields, and the reports and KPIs that use each removed one.
      source: contracts/satellite/reporting.yaml#setSemanticModel
    actions:
    - action: Publish
      result: Replaces the model and assigns the next version; reports resolve their fields against it.
      source: contracts/satellite/reporting.yaml#setSemanticModel
    edgeCases:
    - case: A personal-data field is added to a dataset used by scheduled reports
      expected: Warn that exports of it need the personal-data export permission and are audited.
      source: contracts/shared/permissions.yaml#/components/schemas/Permission | MATRIX 8.3.73
    consistency:
    - with: ANL-033
      note: The dataset selector shows exactly this catalogue.
    - with: ANL-025
      note: KPI formulas reference these fields.
    sampleData:
      domains:
      - 'Sales · dataset Sales lines (one row is one order line) · fields: sale date, channel, product, gross amount,
        discount, VAT, net amount'
      - 'Admissions · dataset Scans (one row is one admitted scan) · fields: scan time, gate, product, guest (personal
        data)'
      - 'Finance · dataset Postings (one row is one journal line) · fields: posted at, account, cost centre, debit,
        credit'
    corrections:
    - what: The gap says the operations return no schema with described properties.
      why: The semantic model is fully described (domains, datasets, grain, fields, relationships); the columns
        can be bound.
      source: screens/P16-venue-analytics.yaml#ANL-066 | contracts/satellite/reporting.yaml#/components/schemas/SemanticModel
      status: fixed
      by: CHG-SOT-012
    - what: There is no certification, owner or lineage on a dataset or field.
      why: The client spec asks for certified badges with owner, glossary and lineage; the model has none of these
        fields.
      source: contracts/satellite/reporting.yaml#/components/schemas/SemanticModel
      status: logged
      by: CHG-SOT-016
  ANL-067:
    summary: 'Watches data moving from operations into analytics so stale or failed data is caught before anyone
      decides on it. The thing to get right: name what is affected ("Ticketing dataset delayed - affects Revenue
      Pulse and 4 other dashboards") and how late it is against what was expected.

      '
    outputs:
    - element: headline counters
      rule: 'Stale datasets (freshness beyond expected), failed pipelines, worst latency ("38 min late"), rows processed
        in last runs. "Pipelines running" and "average refresh duration" have no source (see corrections).

        '
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
    - element: pipeline row
      rule: Status, freshness against expected, last success, last error, datasets; Stale when freshness exceeds
        expected.
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
    - element: replica lag
      rule: The reporting replica's lag is part of freshness; reports state the replica position they read.
      source: contracts/satellite/reporting.yaml#ReportResult | TRACKER Actions row 255
    edgeCases:
    - case: A KPI over a stale pipeline
      expected: The KPI shows "Data delayed" everywhere it appears.
      source: contracts/satellite/reporting.yaml#KpiValue
    consistency:
    - with: ANL-030
      note: Same freshness wording on the dashboard health panel.
    - with: ANL-061
      note: Same status words.
    sampleData:
      alert: Ticketing dataset delayed - last refreshed 09:02, expected every 15 min (38 min late)
      pipelines:
      - name: Ticketing orders to replica
        status: Stale
        freshness: 38 min (expected 15)
        lastSuccess: 01 Oct 2026 09:02
        datasets:
        - Orders
        - Order lines
      - name: Access scans
        status: Healthy
        freshness: 1 min (expected 5)
        rowsLastRun: 6214
    corrections:
    - what: Pipelines Running and Average Refresh Duration
      why: Pipeline status has no running value and no duration is recorded.
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
    - what: Completeness, accuracy checks, duplicates, missing values, schema changes, reconciliation status
      why: None is measured; only timeliness exists.
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline | MATRIX 8.7.21
    - what: Affected dashboards cannot be computed
      why: A pipeline lists dataset codes, a report reads a data area from a different list and a tile reads a report;
        nothing links a stale dataset to the dashboards that show it.
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline | contracts/satellite/reporting.yaml#DataSource
        | contracts/satellite/reporting.yaml#DashboardTile
  ANL-068:
    summary: 'Workspace settings for analytics inside the tenant: default dashboard per role, theme from the tenant''s
      brand, language, mobile and full-screen behaviour. The thing to get right: TICVAI''s BI is native, there is
      no third-party BI engine to embed, and a tenant never sees or chooses another tenant.

      '
    inputs:
    - field: Default dashboard
      rule: Chosen from shared dashboards of the tenant; shown first in the command centre for that role.
      source: contracts/satellite/reporting.yaml#listDashboards | ADR-0041
    - field: Theme, Branding
      rule: From the tenant's white-label tokens (logo, colours, fonts, status colours); not edited here.
      source: MATRIX 6.1.78
    - field: Full-screen mode, Mobile behaviour
      rule: Presentation mode (wall display, large type, auto-refresh) and phone layout for executives on the move.
      source: MATRIX 8.7.23 | DI-696
    - field: Language
      rule: English and Arabic; Arabic is right to left throughout.
      source: DI-019
    consistency:
    - with: ANL-001
      note: The default dashboard is what the executive command centre opens.
    sampleData:
      defaults:
      - role: Executive
        dashboard: Executive Performance
      - role: Operations manager
        dashboard: Operations Control Room
        presentation: Wall display, refresh every 60 s
      language:
      - English
      - Arabic
    corrections:
    - what: The screen's premise is embedding a BI technology
      why: The decision is a native BI platform with no Power BI or other engine; the screen is workspace settings.
      source: TRACKER Actions row 253 | MoM 2026-09-08 4.1 Rationale for a Native BI/Reporting Platform
    - what: None of the seven settings has a field or operation
      why: The screen only lists dashboards; default dashboard, theme, language, mobile and full-screen settings
        cannot be saved.
      source: contracts/satellite/reporting.yaml#listDashboards | screens/P16-venue-analytics.yaml#ANL-068
    decisions:
    - question: Where is the default dashboard per role stored?
      decision: 'Drawn default accepted: Draw the setting; mark pending.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-353 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.1 | MATRIX 8.7.21 | MATRIX 6.1.78 | ADR-0041
  ANL-069:
    summary: 'Shows which dashboards and reports are actually used, by whom, and how heavy they are, so the estate
      can be pruned: four hundred reports of which thirty are opened is four hundred things to maintain. The thing
      to get right: "cost" is a load indicator (rows scanned, runtime, refresh load), not money.

      '
    inputs:
    - field: groupBy (shown as "By")
      rule: Dashboard, Report, User, Venue.
      source: contracts/satellite/reporting.yaml#getAnalyticsUsage
    - field: from
      rule: Default last 30 days.
      source: contracts/satellite/reporting.yaml#getAnalyticsUsage
    outputs:
    - element: usage table
      rule: Name, opens or runs, distinct users, last opened, average runtime, rows scanned, "Never opened" badge.
        Sort by opens; a "Never opened" filter for pruning.
      source: contracts/satellite/reporting.yaml#AnalyticsUsageRow
    - element: load
      rule: '"Load" column - dashboard refresh load (Low, Medium, High) and report estimated cost - never a currency
        amount.'
      source: contracts/satellite/reporting.yaml#Dashboard | contracts/satellite/reporting.yaml#ReportDefinition
    edgeCases:
    - case: Usage by user
      expected: Shows people by name to tenant-level administrators only.
      source: contracts/satellite/reporting.yaml#getAnalyticsUsage
    consistency:
    - with: ANL-021
      note: Usage counts in the dashboard library are these numbers.
    sampleData:
    - name: Operations Control Room
      kind: Dashboard
      opens: 1840
      users: 22
      lastOpened: 01 Oct 2026 10:41
      avgRuntime: 1.2 s
      load: High
    - name: Shift summary
      kind: Report
      runs: 612
      users: 31
      avgRuntime: 0.9 s
      rowsScanned: 2.1 M
    - name: Locker rentals by hour
      kind: Report
      runs: 0
      neverOpened: true
    corrections:
    - what: The usage read promises "what they cost" and returns no cost
      why: Rows carry opens, users, runtime and rows scanned only.
      source: contracts/satellite/reporting.yaml#getAnalyticsUsage | contracts/satellite/reporting.yaml#AnalyticsUsageRow
    - what: AI Queries, Exports, API Requests, Peak Concurrent Users, Dashboard Load Time, Failed Queries, Dataset
        Size, Refresh Duration, Embedded BI Availability
      why: No source records them; draw as pending.
      source: contracts/satellite/reporting.yaml#AnalyticsUsageRow | screens/P16-venue-analytics.yaml#ANL-069
  SGN-020:
    summary: 'The self-service twin of ADM-411 for a prospect buying TICVAI with no account yet: the same billing
      and legal entity details, in plain language, with save-and-resume. The prospect must understand why each item
      is asked (it prints on their tax invoice) and leave able to come back.'
    inputs:
    - field: billing company vs venue operator
      rule: Same switch as ADM-411, phrased "The company paying TICVAI is different from the company running the
        venue."
      source: screens/P17-ticvai-signup.yaml#SGN-020 | DI-830
    - field: TRN and certificate
      rule: Helper text "Shown on every tax invoice we send you"; upload accepts PDF, JPG or PNG.
      source: DI-830
    outputs:
    - element: progress
      rule: Step position in the purchase journey (after contract and billing cycle, before payment method).
      source: screens/P17-ticvai-signup.yaml#SGN-020
    actions:
    - action: Save and continue
      result: Saves to the application and moves to payment method; leaving keeps what was entered.
      source: screens/P17-ticvai-signup.yaml#SGN-020
    edgeCases:
    - case: a returning prospect without access to the saved setup
      expected: Offered "Continue saved setup" or "Sign in", as on the welcome step.
      source: screens/P17-ticvai-signup.yaml#SGN-020
    consistency:
    - with: ADM-411
      note: Identical fields and validation; only the tone of the help text differs.
    sampleData:
      billingCompany: Al Majaz Leisure Parks LLC · TRN 100398275100003 · Al Qasba, Sharjah · finance@almajazparks.ae
      invoicing: Annual · card
    corrections:
    - what: The screen calls createLegalEntity (a tenant-scoped, staff-only ledger operation needing the account-configuration
        permission), but a prospect on P17 has no tenant and no cell.
      why: The call cannot succeed for this user; the details belong on the onboarding application or a subscription
        billing record.
      source: contracts/spine/finance.yaml#createLegalEntity | screens/P09-platform-admin-console.yaml#ADM-411 |
        contracts/satellite/subscription.yaml#submitOnboardingApplication
      status: fixed
      by: CHG-SOT-017
    decisions:
    - question: Is the billing entity saved on the onboarding application (public) before verification?
      decision: 'Drawn default stands (answer: "Yes: saved on the application; nothing provisioned until verified"): Yes;
        nothing is provisioned until verification passes.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-223 | CHG-NOTE-003
      questionSource: contracts/satellite/subscription.yaml#submitOnboardingApplication
