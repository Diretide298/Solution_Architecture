      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-325 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/shared/common.yaml#/components/schemas/Money
  ANL-021:
    summary: 'The one catalogue of dashboards, inside the single permission-based reporting area (no copies of it
      inside each module). A login sees only the dashboards of modules it is entitled to, narrowed to its own scope;
      a module the tenant has not licensed never appears, not even as an empty filter. The thing to get right: the
      pack''s Status, Version, Last Published and AI-generated columns have no source yet, so the library must not
      invent them; draw what exists (shared or private, archived, area, owner, refresh load) and show lifecycle
      as pending until ANL-029 has a contract.

      '
    inputs:
    - field: module (shown as the "Area" filter chips)
      rule: 'One chip per module the login is entitled to (Finance, Sales, Operations, F&B, Retail ...). Asking
        for a module the caller cannot see returns an empty list, so never render a chip for an unentitled module;
        a hidden module disappears from navigation rather than showing greyed.

        '
      source: contracts/satellite/reporting.yaml#listDashboards | DI-721 | DI-387
    - field: includeArchived (shown as "Show archived")
      rule: Off by default. Archived rows carry "Archived 12 Sep 2026" and are read-only; there is no restore operation,
        so draw no Restore button.
      source: contracts/satellite/reporting.yaml#Dashboard
    - field: search
      rule: listDashboards has no search parameter and is not paged; search filters the returned list on the client
        by name and description.
      source: contracts/satellite/reporting.yaml#listDashboards
    outputs:
    - element: list row
      rule: 'Name, area, owner, venue ("All my venues" when no venue is set), Shared or Private badge, created date.
        Shared dashboards first within an area, then alphabetical. Usage count and data freshness come from tenant-level
        reads, so show those two columns only to tenant-level users; never a column of blanks.

        '
      source: contracts/satellite/reporting.yaml#Dashboard | contracts/satellite/reporting.yaml#getAnalyticsUsage
        | contracts/satellite/reporting.yaml#listAnalyticsPipelines
    - element: refresh load badge (authors only)
      rule: aggregateCost low / medium / high, worded "Refresh load - High"; it is the summed refresh of every tile,
        a hint that the dashboard is near the per-venue refresh budget.
      source: contracts/satellite/reporting.yaml#createDashboard | R094
    - element: standard versus custom
      rule: Seeded command-centre dashboards are rows like any other (a command centre is a saved dashboard). Mark
        them "Standard"; a venue copies and changes the copy.
      source: ADR-0041 | DI-697
    actions:
    - action: Open
      result: Reads the dashboard with tile data, then records one view in the background; a failed view record
        never blocks rendering.
      source: contracts/satellite/reporting.yaml#recordDashboardView
    - action: Duplicate
      result: 'No clone operation exists. The client reads the dashboard and creates a new one named "Copy of ..."
        with new tile ids, Private, owned by the caller. A tile id that belongs to another dashboard is refused.

        '
      source: contracts/satellite/reporting.yaml#updateDashboard | MATRIX 7.1.46
    - action: Archive
      result: 'Archives, never deletes. Refused while the dashboard is shared, because it is on other people''s
        screens: disable the action on a shared row with the reason "Stop sharing it first".

        '
      source: contracts/satellite/reporting.yaml#deleteDashboard
    edgeCases:
    - case: A tenant-wide shared dashboard opened by a venue manager
      expected: Every tile shows only that manager's venue; the header says "Showing Aquaventure Waterpark only".
        The scope comes from permissions, not from a filter the viewer could widen.
      source: DI-061 | contracts/satellite/reporting.yaml#CreateDashboardRequest
    - case: Login entitled to no analytics module
      expected: The no-access state names the missing permission in words ("You need access to venue reports");
        never an empty table.
      source: DI-387 | contracts/satellite/reporting.yaml#listDashboards
    consistency:
    - with: ANL-023
      note: Open and New lead to the lead's canvas; the same Shared/Private and Standard badges appear in its header.
    - with: ANL-029
      note: Status and version shown here must be the lifecycle ANL-029 defines once it has a contract.
    - with: ANL-053
      note: AI-generated dashboards are created through the same create operation; nothing on the record says so
        (see corrections).
    sampleData:
      rows:
      - name: Daily Sales & Channel
        area: Sales
        owner: Rahul Menon
        venue: Aquaventure Waterpark
        sharing: Shared
        created: 14 Sep 2026
        load: Medium
      - name: Finance & Reconciliation
        area: Finance
        owner: Fatima Al Mansoori
        venue: All my venues
        sharing: Shared
        created: 02 Sep 2026
        load: Low
      - name: Operations Control Room
        area: Operations
        owner: Standard
        venue: All my venues
        sharing: Shared
        created: 08 Sep 2026
        load: High
      - name: Motiongate peak hours (draft)
        area: Operations
        owner: Omar Haddad
        venue: Dubai Parks - Motiongate
        sharing: Private
        created: 29 Sep 2026
        load: Low
    corrections:
    - what: The gap says the screen's operations return no schema with described properties
      why: listDashboards returns Dashboard (name, module, description, venueId, isShared, ownerPrincipalId, aggregateCost,
        archivedAt, createdAt); Name, Owner, Sites/Venues and Category can bind today.
      source: contracts/satellite/reporting.yaml#Dashboard | screens/P16-venue-analytics.yaml#ANL-021
    - what: 18 of the 31 "columns" are category and type values (Executive ... Custom; System, Custom and AI-Generated
        Dashboard)
      why: They are filter values of one Area dimension and one origin dimension, not columns; drawn as columns
        the table is 31 wide and mostly empty.
      source: screens/P16-venue-analytics.yaml#ANL-021
    - what: Status, Version, Last Modified, Last Published and origin (system, custom, AI-generated) have no field
        on Dashboard
      why: ReportDefinition has isSystem and versions; Dashboard has neither, so the library cannot tell a seeded
        dashboard from a custom one or show a published version.
      source: contracts/satellite/reporting.yaml#Dashboard | contracts/satellite/reporting.yaml#ReportDefinition
        | MATRIX 7.1.46
    decisions:
    - question: Does Dashboard gain an origin flag (standard, custom, AI-generated) and a lifecycle status with a version,
        as ReportDefinition has?
      decision: 'Drawn default accepted: Draw Shared/Private and Archived, which exist; draw the Status and Version columns
        in a visibly pending style tied to ANL-029.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-326 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 7.4.45 | MATRIX 11.1.2 | DI-706
  ANL-022:
    summary: 'A short wizard (Basics, Scope, Data areas, Starting point) that ends in the canvas. Nothing is saved
      until Finish, because a dashboard cannot be created without at least one tile: the Starting point step supplies
      the first tiles (a standard template, or "Blank - one KPI card"). The thing to get right is what the wizard
      must not ask: the tenant, a default currency and an owner are not choices.

      '
    inputs:
    - field: module (shown as "Business area")
      rule: Required. Only modules the tenant licenses and the login holds a permission in; "General" for a dashboard
        that belongs to no optional module. A module outside entitlement is refused by the server, so do not list
        it.
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest
    - field: name, description
      rule: Name required, up to 200 characters; description up to 1,000. Name must be unique in the caller's library
        for usability (not enforced by the contract; warn, do not block).
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest
    - field: venueId (shown as "Venue")
      rule: 'Optional, one venue. Default "All venues I am allowed to see": each viewer then sees their own scope
        and never beyond it. The pack''s multi-select Site(s), Attraction(s) and Business Unit(s) have no field;
        draw one venue picker.

        '
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest | DI-061
    - field: Tenant (pack field)
      rule: Remove. The tenant is applied at the security level and is never a user-editable choice; the platform
        never trusts a client-supplied tenant.
      source: MATRIX 6.1.78
    - field: Owner (pack field)
      rule: Not a choice. The creator is the owner; show "Owner - you" read-only.
      source: contracts/satellite/reporting.yaml#Dashboard
    - field: isShared (shown as "Share with my team")
      rule: Off by default; a private dashboard is visible to its owner only.
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest
    outputs:
    - element: Starting point step
      rule: 'Offer the client''s standard boards as templates: Executive Performance, Sales & Channel, Admissions
        & Capacity, Product & Pricing, Customer & Membership, Finance & Reconciliation, Operations Control Room,
        B2B / OTA Partner, F&B / Retail. Each card states its tile count and how many of its tiles use a mark that
        cannot bind data yet (combo, waterfall, matrix, funnel, scatter ...), so the user is not surprised in the
        canvas.

        '
      source: MATRIX 8.7.1 | MATRIX 8.7.34 | MATRIX 6.1.41 | MATRIX 8.7.21 | contracts/satellite/reporting.yaml#DashboardTile
    - element: Refresh load summary on the last step
      rule: Show "Refreshes per minute - 18 of 24 allowed" computed as the sum over tiles of 60 / refresh seconds;
        tiles refresh no faster than every 30 seconds.
      source: contracts/satellite/reporting.yaml#createDashboard | contracts/satellite/reporting.yaml#DashboardTile
        | R094
    actions:
    - action: Finish
      result: Creates the dashboard and opens it in the canvas. Over the refresh budget is refused with the budget
        named; a module outside entitlement is refused; both keep the wizard filled in.
      source: contracts/satellite/reporting.yaml#createDashboard
    - action: Cancel
      result: Discards everything; nothing was saved.
      source: contracts/satellite/reporting.yaml#createDashboard
    edgeCases:
    - case: A template with 13 tiles at 30-second refresh (26 per minute)
      expected: Finish is refused with the venue budget (24 per minute proposed). Offer "Slow the live tiles to
        60 seconds" rather than a bare error.
      source: R094 | contracts/satellite/reporting.yaml#createDashboard
    - case: A template with more than 24 tiles
      expected: Not possible; a dashboard holds at most 24 tiles, so no template may exceed it.
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest
    consistency:
    - with: ANL-023
      note: Finish lands in the lead's canvas with the new dashboard id.
    - with: ANL-032
      note: Same step pattern and wording as the report wizard (Basics, Scope, Data, Starting point).
    sampleData:
      basics:
        name: Waterpark daily pulse
        area: Operations
        description: Admissions, capacity and F&B by hour for the duty manager
        share: 'Off'
      scope:
        venue: Aquaventure Waterpark
      startingPoint:
        template: Admissions & Capacity
        tiles: 9
        notYetAvailable: 0
        refreshesPerMinute: 14 of 24
    corrections:
    - what: The gap says the wizard declares no write operation
      why: It declares createDashboard. The gap text is stale.
      source: screens/P16-venue-analytics.yaml#ANL-022 | contracts/satellite/reporting.yaml#createDashboard
    - what: Tenant, Organization and Default Currency fields
      why: The tenant is never user-selectable; records and display are in the venue's base currency, so a dashboard-level
        default currency implies a conversion the platform does not do.
      source: DI-211
    - what: The label "Queue - Accreditation" is a fragment of the pack's domain list collapsed into one select,
        and step titles are drawn as text fields
      why: Step 3 is a multi-select of data areas; step titles are headings, not inputs.
      source: screens/P16-venue-analytics.yaml#ANL-022
    - what: Category, Tags and Language have no field on the dashboard
      why: Only name, module, description, venueId and isShared are stored; these three cannot be saved.
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest
    decisions:
    - question: Does a dashboard carry an Arabic name and description, or one name shown in both languages?
      decision: 'Drawn default accepted: One name field; flag the Arabic layout of the wizard RTL but do not draw a second
        name field.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-327 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-019
  ANL-023:
    summary: 'The canvas where a dashboard is laid out: tiles on a grid, each bound to a report and drawn as one
      visual. The one thing to get right: the canvas may only offer what can actually be drawn and bound, and saving
      replaces the whole dashboard, so the designer must see what will be removed.'
    inputs:
    - field: Grid and tile position
      rule: A 12-column grid (the client's spec; not yet fixed in the contract); tiles snap to whole columns and
        rows; position is row, column, width, height. At most 24 tiles per dashboard.
      source: MATRIX 8.7.12 | contracts/satellite/reporting.yaml#/components/schemas/CreateDashboardRequest
    - field: Visual per tile
      rule: One of the contracted marks (number, line, area, bar, stacked bar, 100% stacked bar, combo, pie, donut,
        table, matrix, gauge, heatmap, funnel, waterfall, treemap, scatter, map, ribbon, decomposition tree). Slicers,
        narrative text and cohorts are not visuals. A gauge only where the KPI has a target or range.
      source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile | MATRIX 8.7.21
    - field: Refresh
      rule: Per tile, 30 seconds minimum; the dashboard shows its combined load (low, medium, high).
      source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile | contracts/satellite/reporting.yaml#/components/schemas/Dashboard
    - field: Module and audience
      rule: The module the dashboard belongs to decides who may see it (required; "Core" when it belongs to none);
        shared or personal; optionally one venue.
      source: contracts/satellite/reporting.yaml#/components/schemas/CreateDashboardRequest | DI-702
    outputs:
    - element: Tile preview
      rule: Live data in edit mode with loading, empty, error and stale states per tile; one failing tile never
        blanks the canvas.
      source: MATRIX 6.1.78
    actions:
    - action: Save
      result: Replaces the dashboard with what is on the canvas; tiles removed since opening are listed in the confirmation
        ("3 tiles will be removed").
      source: contracts/satellite/reporting.yaml#updateDashboard
    - action: Archive
      result: Hides it from the library; configuration is kept and can be restored by an administrator.
      source: contracts/satellite/reporting.yaml#/components/schemas/Dashboard
    edgeCases:
    - case: The chosen visual needs more than one dimension and one measure (combo, scatter, map, matrix…)
      expected: 'Not bindable yet: report columns carry no axis, series, size or colour role. Show these visuals
        in the gallery as unavailable with that reason until the field-well model exists.'
      source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - case: Mobile layout
      expected: Tiles stack in reading order at narrow widths; a CEO opening it on a phone sees the KPIs first.
      source: DI-696
    consistency:
    - with: ANL-024
      note: The visual gallery and its availability come from the widget library.
    - with: ANL-029
      note: Publishing and approval happen there, not on the canvas.
    - with: ANL-025
      note: KPI tiles reference a library KPI; the formula is never edited on a tile.
    sampleData:
      dashboard: Finance – Daily close · module Finance · shared · Aquaventure Waterpark
      tiles:
      - Takings today (number) · row 1, col 1, 3×2 · refresh 60 s
      - Takings by hour (bar) · row 1, col 4, 6×4
      - Tender mix (donut) · row 1, col 10, 3×4
      - Unresolved settlement exceptions (table) · row 5, col 1, 12×4
    corrections:
    - what: The layout has only Save, Cancel and an unlabelled detail panel; the gaps say the pack gives nothing
        to draw.
      why: The client's dashboard specification describes the canvas in detail (grid, gallery, data pane, field
        wells, formatting).
      source: screens/P16-venue-analytics.yaml#ANL-023 | MATRIX 8.7.12
      status: fixed
      by: CHG-SOT-010
    - what: No undo or redo, and no draft or version of a dashboard.
      why: Every save overwrites the live dashboard; the client spec asks for draft, preview, publish and rollback.
      source: MATRIX 7.1.46 | contracts/satellite/reporting.yaml#updateDashboard
      status: logged
      by: CHG-SOT-016
    decisions:
    - question: Which visuals ship bindable in the first release?
      decision: Build all chart types, including the nine complex ones.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-080 | CHG-FIN-007 | CHG-NOTE-003
      questionSource: MATRIX 8.7.1 | MATRIX 8.7.2 | MATRIX 8.7.12
  ANL-024:
    summary: 'The bounded catalogue of visuals the canvas drags from, as the client asked: an itemised list, like
      a bounded Power BI or Zoho canvas. Its contents are the contract''s twenty marks, not a server collection.
      The thing to get right: nine of the twenty cannot bind data yet (no encoding role on report columns), and
      three things the client listed (slicer, narrative, cohort) are deliberately not marks.

      '
    outputs:
    - element: gallery groups
      rule: 'Cards and status (KPI card, gauge); Compare (bar, stacked bar, 100% stacked bar); Trend (line, area,
        combo); Part of whole (pie, donut, treemap, waterfall); Detail (table, matrix); Flow and spread (funnel,
        heatmap, scatter, map, ribbon, decomposition tree). Searchable, with a preview per card.

        '
      source: contracts/satellite/reporting.yaml#DashboardTile | DI-707
    - element: pack card names (KPI Card, Target Card, Variance Card, Scorecard, Progress Indicator)
      rule: These are presets of the KPI card (comparison, variance, sparkline and status icon are its settings)
        and of the gauge; show them as variants inside the KPI card and gauge, not as six marks.
      source: contracts/satellite/reporting.yaml#DashboardTile | MATRIX 8.7.21 | MATRIX 8.7.25
    - element: per-card guidance
      rule: '"Best for" and "Needs" lines from the client''s selection guide, e.g. Line - change over time; needs
        a date or category axis and at least one number. Gauge - only when the KPI has a target or range; otherwise
        the KPI card is the default. Pie - few categories; prefer bar for many.

        '
      source: MATRIX 8.7.21
    - element: availability state
      rule: 'Combo, matrix, funnel, waterfall, treemap, scatter, map, ribbon and decomposition tree show a "Not
        yet available" ribbon and cannot be dragged, with the reason in a tooltip ("This visual needs axis and series
        roles the data model does not have yet"). Area, donut and 100% stacked bar bind as their parent marks and
        are available.

        '
      source: contracts/satellite/reporting.yaml#DashboardTile | MATRIX 8.7.12
    - element: refused components
      rule: 'No slicer card: a filter on the canvas is a report parameter, offered from the filter pane. No narrative
        card: written insights come from the AI insight panel. No cohort card: use matrix or heatmap over a cohort
        dimension. Searching "slicer" or "cohort" shows that pointer instead of no results.

        '
      source: contracts/satellite/reporting.yaml#DashboardTile
    edgeCases:
    - case: User looks for a way to add a custom visual
      expected: None exists; custom visuals (sandboxed, signed, allow-listed) are not in scope, so draw no import
        button.
      source: MATRIX 6.1.78
    - case: User drags a pie onto a field with 14 categories
      expected: The pie renders the largest categories and groups the rest as "Other" (limit to be decided), with
        a hint suggesting a bar chart.
      source: MATRIX 8.7.1
    consistency:
    - with: ANL-023
      note: The canvas's visual gallery is this list, same groups, same availability states and same names.
    - with: ANL-028
      note: Visuals that support drill (bar, line, matrix, treemap, decomposition tree) say so on their card.
    sampleData:
      cards:
      - name: KPI card
        group: Cards and status
        bestFor: Current value with change
        example: Net revenue AED 412,860.50, up 6.2% vs last Tuesday
        state: Available
      - name: Gauge
        group: Cards and status
        bestFor: Value against a target or band
        example: Capacity 86% - Warning
        state: Available
      - name: Waterfall
        group: Part of whole
        bestFor: Gross sales to net revenue bridge
        state: Not yet available
    corrections:
    - what: The empty state "carries the create action"
      why: Nobody creates visual types; the list is the contract's fixed set. An empty library is impossible; drop
        the create action.
      source: screens/P16-venue-analytics.yaml#ANL-024 | contracts/satellite/reporting.yaml#DashboardTile
    - what: The six "columns" (KPI Card ... Progress Indicator) are not marks and none is a column
      why: They are presets of number and gauge; the twenty marks are the catalogue.
      source: contracts/satellite/reporting.yaml#DashboardTile
    - what: handoff/board-dashboard-requirements.md still says eight marks
      why: The enum went from eight to twenty on 22 September; a designer reading that summary would draw too few.
      source: contracts/satellite/reporting.yaml#DashboardTile
    decisions:
    - question: Which wells (Axis, Legend, Values, Small multiples, Tooltips, Filters) does each mark accept, so the nine
        unavailable marks can bind?
      decision: 'Drawn default accepted: Show them as "Not yet available"; do not draw well layouts for them.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-328 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.12 | MATRIX 8.7.1 | MATRIX 8.7.2
    - question: Default category limit for pie and donut, and is the remainder grouped as Other?
      decision: 'Drawn default accepted: Six slices plus Other.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-329 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.1 | MATRIX 8.7.24
  ANL-025:
    summary: 'Where an authorised business user defines a company-wide KPI once, so "revenue" means the same on
      every dashboard. The one thing to get right: the formula is written against the business catalogue, not tables,
      and the direction (higher or lower is better) is a single choice that decides every status colour.'
    inputs:
    - field: Code and name
      rule: Code unique in the company; the seeded system KPIs (takings, admissions and the accreditation ones)
        are shown read-only.
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
    - field: Formula
      rule: Built from catalogue measures and fields with a formula editor that validates as you type; no SQL.
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition | MATRIX 8.7.11 | MATRIX 6.1.78
    - field: Unit
      rule: Currency, Count, Percentage, Duration, Ratio, Score. Currency takes the region's currency and decimals;
        it is not chosen here.
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition | ADR-0018
    - field: Direction
      rule: One toggle "Higher is better" (on by default). Refund rate, queue time and gate rejection rate set it
        off.
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition
    - field: Domain, default period, owner, active
      rule: Domain from the catalogue's domains; default period (today, week, month); owner is a person.
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition
    outputs:
    - element: Definition card
      rule: Business definition in words beside the formula ("Net revenue = Gross sales − Discounts − Refunds"),
        its unit, direction and owner; this is what a dashboard tooltip shows.
      source: MATRIX 8.7.21
    actions:
    - action: Create KPI
      result: Adds it to the library; targets and bands are set on the targets screen.
      source: contracts/satellite/reporting.yaml#createKpi
    edgeCases:
    - case: Someone defines "Revenue" without saying gross or net, or with or without tax
      expected: The form requires the definition text to say whether tax and fees are included.
      source: MATRIX 5.12.6
    consistency:
    - with: ANL-062
      note: The enterprise KPI library lists what is created here.
    - with: ANL-026
      note: Targets and warning/critical bands are set there.
    sampleData:
      kpis:
      - NET_REVENUE · Net revenue · currency · higher is better · Gross sales − Discounts − Refunds, excluding VAT
        · owner Layla Haddad, Finance
      - 'REFUND_RATE · Refund rate · percentage · higher is better: off · Refunds ÷ Gross sales'
      - ATV · Average ticket value · currency · Ticket revenue ÷ paid tickets (complimentary excluded)
    corrections:
    - what: '"Higher = Better" and "Lower = Better" are two fields, and "Revenue ↑", "Conversion ↑", "Refund Rate
        ↓", "Gate Rejection Rate ↓", "Queue Time ↓" are drawn as fields.'
      why: Direction is one yes/no; the arrows are the pack's examples, not inputs.
      source: screens/P16-venue-analytics.yaml#ANL-025 | contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition
      status: fixed
      by: CHG-SOT-012
    - what: Currency, decimal precision, measure, aggregation, data source, effective date and status are drawn
        as KPI fields.
      why: None is on the KPI definition; currency and decimals follow the region, the rest live in the formula
        and the active flag.
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition
      status: fixed
      by: CHG-SOT-012
    - what: The gap says the screen declares no write operation.
      why: It declares the create operation; the gap is stale. There is no update or retire operation for a KPI,
        so a mistake cannot be corrected.
      source: screens/P16-venue-analytics.yaml#ANL-025 | contracts/satellite/reporting.yaml#createKpi
      status: logged
      by: CHG-SOT-016
    - what: The catalogue has no finance measures (gross sales, net revenue, refunds, tax).
      why: The KPIs every finance and executive board needs cannot be expressed until those measures exist.
      source: contracts/satellite/reporting.yaml#/components/schemas/MetricSource
      status: fixed
      by: CHG-FIN-007
  ANL-026:
    summary: 'Where a KPI''s target and its Warning and Critical bands are set, so every dashboard shows the same
      status for the same number. A target is per scope (tenant, region, venue) and per period. The thing to get
      right is direction: a band means "below" for revenue and "above" for refund rate or capacity, taken from the
      KPI''s higher-is-better flag, and the bands must not leave a gap.

      '
    inputs:
    - field: target, amberAt, redAt, stretch (shown as Target, Warning at, Critical at, Stretch)
      rule: 'For a higher-is-better KPI, Critical < Warning < Target <= Stretch; for a lower-is-better KPI the order
        reverses. Validate the order before saving and say which value is out of place. Bands are contiguous by
        construction (Warning applies from its value to Critical), which avoids the client example''s undefined
        90-95% capacity gap. Money targets in the venue''s base currency at its scale (AED 2 decimals, BHD 3); percentages
        to one decimal.

        '
      source: contracts/satellite/reporting.yaml#KpiTarget | contracts/satellite/reporting.yaml#KpiDefinition |
        DI-704 | MATRIX 8.2.36 | MATRIX 1.1.40 | DI-306
    - field: scopePath (shown as "Applies to")
      rule: A picker of the caller's own scope (organisation, region, venue), never typed. A scope outside the caller's
        is refused.
      source: contracts/satellite/reporting.yaml#setKpiTargets
    - field: period
      rule: A period picker (month, quarter, year) defaulting to the KPI's default period; January and July differ,
        so targets are per period.
      source: contracts/satellite/reporting.yaml#setKpiTargets
    outputs:
    - element: status preview
      rule: 'Beside the bands, a live strip showing the current value and the status it would get: On track, Warning,
        Critical, or No target. Status always carries a word and an icon, never colour alone.

        '
      source: contracts/satellite/reporting.yaml#KpiValue
    - element: pack columns Minimum, Maximum, Benchmark, Tolerance, Evaluation frequency
      rule: Not stored; do not draw them as editable. Benchmark comparison lives on ANL-064.
      source: contracts/satellite/reporting.yaml#KpiTarget
    actions:
    - action: Save targets
      result: 'Replaces this KPI''s whole target set inside the caller''s scope: a row the editor leaves out is
        deleted. The editor therefore always sends every row it shows, and removing a row asks "Remove the October
        target for Aquaventure Waterpark?". Rows outside the caller''s scope are never touched.

        '
      source: contracts/satellite/reporting.yaml#setKpiTargets
    - action: If Critical - alert, notify, create task, ask AI (pack buttons)
      result: 'No operation ties a KPI status to an alert. Alerts are separate rules on a closed list of metrics.
        Draw a link "Set up an alert for this metric" that opens the alert-rule screen when the KPI''s metric is
        on that list, and nothing for task creation.

        '
      source: contracts/satellite/reporting.yaml#AlertRule | contracts/satellite/reporting.yaml#MetricSource
    edgeCases:
    - case: The pipeline behind the KPI has not refreshed
      expected: The preview shows the status with a "Data delayed" marker and its as-of time; a stale number is
        never shown as plainly On track.
      source: contracts/satellite/reporting.yaml#KpiValue | MATRIX 8.7.22
    - case: A venue manager edits a tenant-level KPI
      expected: They see and edit only their venue's targets; tenant rows are shown read-only for context.
      source: contracts/satellite/reporting.yaml#setKpiTargets
    consistency:
    - with: ANL-063
      note: Same band editor and same status words; ANL-063 is the admin grid across scopes and periods, this is
        one KPI.
    - with: ANL-025
      note: The higher-is-better flag set in the KPI builder decides the band direction here.
    sampleData:
    - kpi: Capacity utilisation
      direction: lower is better
      scope: Aquaventure Waterpark
      period: Oct 2026
      target: 75%
      warningAt: 80%
      criticalAt: 95%
      now: 86% - Warning
    - kpi: Net revenue
      direction: higher is better
      scope: Aquaventure Waterpark
      period: Oct 2026
      target: AED 4,200,000.00
      warningAt: AED 3,780,000.00
      criticalAt: AED 3,360,000.00
      now: AED 3,912,440.75 - Warning
    - kpi: Net revenue
      scope: Lost Paradise of Dilmun, Bahrain
      period: Oct 2026
      target: BHD 185,500.000
      warningAt: BHD 166,950.000
      criticalAt: BHD 148,400.000
    - kpi: Refund rate
      direction: lower is better
      scope: All venues
      period: Q4 2026
      target: 1.5%
      warningAt: 2.0%
      criticalAt: 3.0%
    corrections:
    - what: Four Critical actions (generate alert, notify, create task, trigger AI) with no operation
      why: KpiTarget has no action; AlertRule watches a MetricSource value, not a KPI code, so "if Critical then
        alert" cannot be configured from a KPI.
      source: screens/P16-venue-analytics.yaml#ANL-026 | contracts/satellite/reporting.yaml#AlertRule
    - what: KpiTarget.period is an untyped string
      why: Month, quarter and fiscal year (which varies by country) cannot be validated or picked consistently.
      source: contracts/satellite/reporting.yaml#KpiTarget | DI-263
    - what: Finance KPIs to target do not exist yet
      why: 'The metric list has no gross sales, net revenue, refunds, refund rate or average ticket value, and the
        only seeded money KPI is Takings (payments less refunds). The Net revenue and Refund rate rows in the sample
        data are tenant-defined KPIs that need a governed formula first.

        '
      source: contracts/satellite/reporting.yaml#MetricSource | contracts/satellite/reporting.yaml#ReportingSystemKpi
        | MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities
    decisions:
    - question: What is the period format, and does a fiscal-year target follow the tenant's fiscal calendar?
      decision: 'Drawn default accepted: Month, quarter and calendar year pickers.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-330 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-263 | MATRIX 5.7.89
  ANL-027:
    summary: 'Sets what data a dashboard''s tiles read and which filters a viewer gets. In the contract a tile reads
      a report definition, so dataset, measure and aggregation belong to that report; this screen sets the dashboard-wide
      venue, each tile''s run values, and which report parameters appear as viewer filters. The thing to get right
      is filter scope: every filter says where it applies (this visual, this dashboard, the report itself), and
      the tenant is never a filter.

      '
    inputs:
    - field: filter scope
      rule: 'Three scopes, each labelled on the chip. "This visual" - the tile''s own run values. "Whole dashboard"
        - the dashboard venue plus a shared parameter applied to every tile that has it. "Report" - a fixed filter
        in the report definition, edited only in the report builder because changing it publishes a new report version
        for every dashboard that uses it.

        '
      source: contracts/satellite/reporting.yaml#DashboardTile | contracts/satellite/reporting.yaml#ReportFilter
    - field: Mandatory, Optional, Defaulted (pack filter kinds)
      rule: Mandatory = the parameter is required; Defaulted = it has a default value; both come from the report's parameter
        definition. Hidden has no field (see decisions).
      source: contracts/satellite/reporting.yaml#ReportParameter
    - field: Date range
      rule: When no dates are given a run covers today in the venue's time zone; a range longer than the report's
        limit (366 days unless set) is refused, so the picker caps it.
      source: contracts/satellite/reporting.yaml#RunReportRequest | R158
    - field: Site, Venue, Attraction, Channel, Product, Customer segment
      rule: Offered only where the tile's report has that field as a filterable parameter. Values narrow the viewer's
        scope, never widen it.
      source: contracts/satellite/reporting.yaml#ReportFilter | DI-705
    - field: Relationship (pack field)
      rule: Remove. Joins are not shown to authors; the semantic model owns relationships.
      source: contracts/satellite/reporting.yaml#SemanticModel | contracts/satellite/reporting.yaml#getSemanticModel
    - field: Currency (pack field)
      rule: Remove as a choice. Figures are in each venue's base currency; there is no conversion to choose.
      source: DI-211
    outputs:
    - element: active-filter breadcrumb
      rule: The viewer always sees which filters are applied, with Clear and Reset to the designed default.
      source: MATRIX 6.1.78
    actions:
    - action: Save
      result: Saves the whole dashboard (full replace of the dashboard and its tiles). Concurrent edits are last-write-wins,
        so show "Saved 10:42 by you".
      source: contracts/satellite/reporting.yaml#updateDashboard
    edgeCases:
    - case: A whole-dashboard filter (Channel) where some tiles' reports have no channel parameter
      expected: Those tiles show "Not filtered by channel" on their header instead of silently ignoring it.
      source: MATRIX 6.1.78
    - case: Relative dates (last 7 days, month to date) and Top N
      expected: Not expressible as filter operators; draw relative-date presets that resolve to from/to dates at
        run time, and no Top N.
      source: contracts/satellite/reporting.yaml#ReportFilter
    consistency:
    - with: ANL-035
      note: Report-scope filters are authored there; this screen links to it rather than duplicating the editor.
    - with: ANL-023
      note: The canvas's filter pane uses the same scope chips and wording.
    sampleData:
      filters:
      - label: Visit date
        scope: Whole dashboard
        value: Today
        mandatory: true
      - label: Channel
        scope: Whole dashboard
        values:
        - POS
        - Web
        - App
        mandatory: false
      - label: Venue
        scope: Whole dashboard
        value: Aquaventure Waterpark
      - label: Outlet
        scope: This visual
        tile: F&B sales by hour
        value: Poolside Grill
    corrections:
    - what: Relationship and Currency selectors
      why: The semantic model deliberately hides joins from authors; currency is the venue's base currency with
        no conversion.
      source: contracts/satellite/reporting.yaml#SemanticModel | DI-211
    - what: Data Domain, Dataset, Measure, Dimension, Aggregation and Calculation drawn as dashboard fields
      why: A tile references a report definition; these are that report's columns and grouping, saved by the report
        operations, not by updateDashboard.
      source: contracts/satellite/reporting.yaml#DashboardTile | contracts/satellite/reporting.yaml#CreateReportRequest
    - what: getSemanticModel requires tenant-level reporting permission
      why: A venue-level author (REPORT_MANAGE at venue) cannot read the catalogue this screen loads.
      source: contracts/satellite/reporting.yaml#getSemanticModel | contracts/satellite/reporting.yaml#createReport
    decisions:
    - question: Where do page scope, locked filters and hidden filters live, given dashboards have no pages and tiles have
        untyped parameters?
      decision: 'Drawn default accepted: Two scopes (visual, dashboard) plus report; no lock or hide toggles.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-331 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 6.1.78
    - question: Does dragging a dataset field onto the canvas create a hidden report definition per tile?
      decision: 'Drawn default accepted: Yes, as the lead decides for ANL-023; this screen then shows that report''s parameters.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-332 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-703 | contracts/satellite/reporting.yaml#DashboardTile
  ANL-028:
    summary: 'Configures how a viewer moves from a headline number to the transactions behind it: drill down and
      up a real hierarchy, drill through to a detail page that keeps the filters and has a visible Back, and how
      a click on one visual filters or highlights the others. The thing to get right: drill only where the data
      has a genuine hierarchy, and a drill that lands on 10,000 transactions must page, not freeze.

      '
    inputs:
    - field: Drill-down path
      rule: 'Chosen from declared hierarchies only, e.g. Year > Month > Day > Channel > Transaction > Detail, or
        Region > Venue > Product > Performance. A level the data does not support is not offered.

        '
      source: DI-709 | MATRIX 8.7.28 | TRACKER Actions row 256
    - field: Interaction per pair of visuals (pack "Cross-filtering", "Click behavior")
      rule: A small matrix, source visual by target visual, each cell Filter, Highlight or None. Highlight keeps
        the target's totals and emphasises the selected part.
      source: MATRIX 6.1.78
    - field: Drill-through target (pack "Detail page", "Related dashboard", "Underlying report")
      rule: A dashboard or report the viewer could open anyway; the target receives the clicked values as filters
        and shows a Back control naming where it came from.
      source: MATRIX 8.7.28 | MATRIX 2.12.13
    - field: Tooltip
      rule: Default tooltip shows the value and its comparison; rich tooltip adds fields (sales, tickets, average
        ticket value, variance for a hovered date).
      source: MATRIX 6.1.78 | MATRIX 8.7.28 | MATRIX 6.1.66
    outputs:
    - element: path preview
      rule: A breadcrumb preview of the path with sample values ("2026 > October > 01 Oct > Web > Order 2026-104311")
        so the designer sees each step.
      source: DI-709
    actions:
    - action: Save
      result: Saves the dashboard as a whole; see corrections for where these settings have to live.
      source: contracts/satellite/reporting.yaml#updateDashboard
    edgeCases:
    - case: Drill to transaction level returns 10,000 rows for one day
      expected: The detail opens as a paged result (cursor pages, virtualised table); above the inline row limit
        (5,000 proposed) it runs in the background with progress and a Cancel.
      source: DI-710 | contracts/satellite/reporting.yaml#runReport | contracts/satellite/reporting.yaml#ReportResult
        | R094
    - case: Drill-through target the viewer cannot open (a module they are not entitled to)
      expected: The drill-through option is not rendered for that viewer, not shown as an error after the click.
      source: DI-387 | MATRIX 8.9.10
    - case: Hierarchy level with an unknown member (sales with no channel)
      expected: Shown as "Unknown" at that level, with its total, never dropped.
      source: MATRIX 8.7.28 | MATRIX 7.1.31
    consistency:
    - with: ANL-040
      note: Drill to transactions ends in the same results viewer, paging and totals.
    - with: ANL-024
      note: Only marks that support drill show drill options.
    sampleData:
      drillPath:
      - Region
      - Venue
      - Product
      - Performance
      exampleTrail: UAE > Aquaventure Waterpark > Day pass - Adult > 01 Oct 2026 10:00
      interactions:
      - from: Sales by channel (bar)
        to: Orders (table)
        behaviour: Filter
      - from: Sales by channel (bar)
        to: Monthly sales (line)
        behaviour: Highlight
      drillThrough:
        from: Refund rate KPI
        to: Refund transactions report
        carries:
        - Venue
        - Visit date
    corrections:
    - what: The gap says the screen declares no write operation
      why: It declares updateDashboard; the gap text is stale.
      source: screens/P16-venue-analytics.yaml#ANL-028
    - what: Drill paths, interactions, drill-through targets and tooltips have no field
      why: DashboardTile has only an untyped parameters object; the interaction framework is meant to be central,
        not per chart, and the semantic model declares no hierarchies.
      source: contracts/satellite/reporting.yaml#DashboardTile | contracts/satellite/reporting.yaml#SemanticModel
    decisions:
    - question: Where are hierarchies declared (semantic model) and where is a tile's interaction setting stored?
      decision: 'Drawn default accepted: Draw the editor; mark it pending the interaction-framework decision.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-333 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.28
  ANL-029:
    summary: 'Governs who sees a dashboard and how a change reaches production: draft, preview and validate, approval,
      publish, with versions and rollback. The client asked for an approval step before publishing. The thing to
      get right: none of this lifecycle exists in the contract today (a dashboard is saved live by a full replace),
      so the design is the specification and must be flagged as such; access today is area (module) entitlement
      plus Shared or Private.

      '
    inputs:
    - field: Access (pack "Assign dashboards to")
      rule: 'What exists: the dashboard''s area decides which logins can see it, and Shared/Private decides whether
        anyone but the owner can. Each viewer then sees only their own scope. Draw assignment to roles or users
        as pending.

        '
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest | DI-702 | DI-721
    - field: Change description
      rule: Required when submitting for approval, so the version list explains itself.
      source: MATRIX 7.4.45 | MATRIX 11.1.2 | MATRIX 7.1.46
    outputs:
    - element: version list
      rule: Version, changed by, date and time, change description, approval status (Draft, In review, Approved,
        Published, Rejected), and which version is live. Newest first; the live version pinned on top.
      source: screens/P16-venue-analytics.yaml#ANL-029 | MATRIX 7.1.46
    - element: compare
      rule: A side-by-side of two versions listing tiles added, removed and changed, so a reviewer approves a difference,
        not a whole dashboard.
      source: MATRIX 7.1.46
    actions:
    - action: Submit for approval
      result: Moves the draft to In review; the author cannot approve their own change.
      source: DI-706 | DI-732
    - action: Approve and publish / Reject
      result: Human decision only; AI may show analytics about approvals but never recommends approve or reject.
      source: DI-735 | TRACKER Actions row 261
    - action: Roll back
      result: Republishes an earlier version as a new version (history is never rewritten); confirmation names the
        version and its date.
      source: MATRIX 7.1.46 | contracts/satellite/reporting.yaml#ReportDefinitionVersion
    - action: Stop sharing
      result: Makes the dashboard private; required before it can be archived, because it is on other people's screens.
      source: contracts/satellite/reporting.yaml#deleteDashboard
    edgeCases:
    - case: A published dashboard whose tile report was retired
      expected: The tile shows "This report was retired" and the version cannot be re-published until the tile is
        replaced.
      source: contracts/satellite/reporting.yaml#deleteReport
    - case: Viewers' permissions change after publishing
      expected: Tiles the viewer may no longer read render the no-permission state; the dashboard never shows them
        stale data.
      source: MATRIX 7.1.50 | MATRIX 7.1.51
    consistency:
    - with: ANL-039
      note: Reports already keep every published version; dashboard versions should read the same (version label,
        published by, published at).
    - with: ANL-030
      note: Submit for approval is offered only when validation on ANL-030 has no blocking issue.
    sampleData:
      versions:
      - version: v4 (draft)
        changedBy: Omar Haddad
        at: 01 Oct 2026 09:12
        change: Added F&B sales by hour heatmap
        status: Draft
      - version: v3
        changedBy: Rahul Menon
        at: 22 Sep 2026 16:40
        change: Capacity gauge now uses venue target
        status: Published
        live: true
      - version: v2
        changedBy: Rahul Menon
        at: 15 Sep 2026 11:05
        change: Removed duplicate revenue tile
        status: Superseded
      approver: Fatima Al Mansoori
    corrections:
    - what: No draft, version, approval, publish or rollback exists for dashboards
      why: Dashboard has no status or version and updateDashboard replaces the live dashboard; DI-706 and the builder
        spec cannot be met. The workbook marks MOM-1480 and MOM-2741 Covered, which the contract does not support.
      source: contracts/satellite/reporting.yaml#Dashboard | contracts/satellite/reporting.yaml#updateDashboard
        | MoM 2026-09-08 4.3 Dashboard Designer (Board 2) | MATRIX 7.4.45 | MATRIX 11.1.2 | DI-706
    - what: Approval has no kind for publishing a dashboard
      why: The approval kinds cover refunds, price, configuration and more, but not a dashboard or report publish.
      source: contracts/spine/approvals.yaml#ApprovalKind
    - what: The gap says no schema with described properties
      why: Dashboard is described; the missing part is a version history schema, which is the real gap.
      source: screens/P16-venue-analytics.yaml#ANL-029
    decisions:
    - question: Is dashboard publishing a configurationChange approval or its own approval kind, and who may approve?
      decision: 'Drawn default accepted: Draw an approver picker limited to people who can manage reports, excluding the author.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-334 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-706 | MATRIX 8.7.1 | MATRIX 8.7.21 | MATRIX 6.1.78
    - question: Is promotion between environments (staging to production) in scope?
      decision: 'Drawn default accepted: Not drawn.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-335 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 7.1.46
  ANL-030:
    summary: 'Two jobs: validate a dashboard before it is published, and show its health after. Validation stops
      a dashboard with a blocking problem from being submitted; health tells the owner whether viewers are seeing
      fresh, fast, complete data. The thing to get right: preview runs with the designer''s own access, so it must
      say that viewers with less access will see less, and a preview must not count as a view.

      '
    outputs:
    - element: validation checklist
      rule: 'Blocking: more than 24 tiles; a tile refreshing faster than every 30 seconds; refresh load over the
        venue budget; a tile whose report is retired or missing; a mark that cannot bind its data. Warning: a tile
        whose report needs higher access than some viewers of a shared dashboard have (they will see a no-permission
        tile); personal-data fields on a shared dashboard; a dataset whose pipeline is stale. Each issue names the
        tile and offers "Go to tile".

        '
      source: contracts/satellite/reporting.yaml#CreateDashboardRequest | contracts/satellite/reporting.yaml#DashboardTile
        | contracts/satellite/reporting.yaml#createDashboard | contracts/satellite/reporting.yaml#ReportField |
        MATRIX 7.4.45 | MATRIX 11.1.24
    - element: health panel
      rule: 'Data last refreshed (per pipeline behind the tiles, worded "Updated 4 min ago"), dataset status (Healthy,
        Degraded, Stale, Failed, Paused), failed tiles from the last load, average query time, viewers and opens.
        Thresholds from the client''s targets - shell 2 s, cached visual 2 s, uncached query 5 s at p95 - colour
        the timings.

        '
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline | contracts/satellite/reporting.yaml#DashboardData
        | contracts/satellite/reporting.yaml#AnalyticsUsageRow
    - element: preview modes
      rule: Desktop, tablet, phone (a CEO on a phone) and full-screen presentation; one tile failing never blanks
        the page.
      source: DI-696
    actions:
    - action: Preview
      result: Reads the dashboard with tile data under the designer's own access; banner "Previewing with your access".
      source: contracts/satellite/reporting.yaml#getDashboard
    - action: Submit for approval
      result: Enabled only with no blocking issues; leads to ANL-029.
      source: MATRIX 7.4.45 | MATRIX 11.1.2
    edgeCases:
    - case: One tile errors in preview
      expected: That tile shows its error and a Retry; the others render; validation lists it.
      source: contracts/satellite/reporting.yaml#DashboardData
    - case: Tiles served from cache
      expected: Show "Cached - as of 10:41" on the tile so a designer does not mistake cache for live.
      source: contracts/satellite/reporting.yaml#DashboardData
    consistency:
    - with: ANL-067
      note: Pipeline status words and freshness wording are the same.
    - with: ANL-029
      note: Validation result gates submit.
    sampleData:
      validation:
      - severity: Blocking
        tile: Margin bridge
        issue: Waterfall cannot bind its data yet
      - severity: Warning
        tile: Guest list
        issue: Contains personal data on a shared dashboard
      - severity: Warning
        tile: Admissions by hour
        issue: Ticketing dataset delayed - last refreshed 38 min ago (expected 15)
      health:
        lastRefreshed: Updated 4 min ago
        datasets: 5 healthy, 1 stale
        failedTiles: 0
        avgQuery: 1.8 s
        viewers30d: 42
        opens30d: 611
    corrections:
    - what: Background "record a view" on this screen
      why: Designer previews would count as viewer opens and inflate the usage figures used to prune dashboards;
        preview must not record a view.
      source: contracts/satellite/reporting.yaml#recordDashboardView | contracts/satellite/reporting.yaml#getAnalyticsUsage
    - what: Widget load time and API status columns
      why: No operation measures client render time per tile or an API status for a dashboard.
      source: contracts/satellite/reporting.yaml#AnalyticsUsageRow | MATRIX 8.7.32
    - what: Validate-then-publish has nothing to gate
      why: There is no validate, submit, approve or publish operation for a dashboard; the only write is a full
        replace of the live dashboard, so "prevents dashboards with critical errors from being published" cannot
        be enforced.
      source: contracts/satellite/reporting.yaml#updateDashboard | DI-706 | MATRIX 7.4.45 | MATRIX 11.1.2 | screens/P16-venue-analytics.yaml#ANL-030
    decisions:
    - question: Is "preview as a role" (see what a venue manager would see) in scope?
      decision: 'Drawn default accepted: Not drawn; preview is with the designer''s access and says so.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-336 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.1 | MATRIX 8.7.21 | MATRIX 6.1.78
  ANL-031:
    summary: 'The report library: the eight standard reports every venue starts with, plus the venue''s own. It
      lists only reports the login may run; a report needing tenant-level access is absent for a venue user, not
      shown empty. The thing to get right: standard reports are copy-only (Make a copy, never Edit or Delete), and
      "scheduled" or "AI-generated" are properties of a report, not report types.

      '
    inputs:
    - field: category (shown as "Category" chips)
      rule: Sales, Admissions, Financial, Inventory, Guests, Operations, Marketing, Workforce, Compliance, Custom.
      source: contracts/satellite/reporting.yaml#ReportCategory | contracts/satellite/reporting.yaml#listReports
    - field: search
      rule: Server-side search on the paged list; cursor paging, never page numbers.
      source: contracts/satellite/reporting.yaml#listReports
    outputs:
    - element: row
      rule: 'Name, category, data area, Standard or Custom badge, who can run it (in words: "Venue reports" / "Region
        reports" / "All venues"), last run, current version, Retired badge. Standard reports first, then custom
        by last run. Report ID is not shown.

        '
      source: contracts/satellite/reporting.yaml#ReportDefinition | R096
    - element: standard reports
      rule: 'The eight seeded reports with their one-line rationale: Terminal day view, Sales by channel, Attendance
        and footfall, Shift summary, Refunds, Voids and discounts, Stock valuation, F&B sales. A water park does
        not get a theatre''s report: seeded reports apply to venue kinds.

        '
      source: contracts/satellite/reporting.yaml#listSeededReports | contracts/satellite/reporting.yaml#SeededReport
        | R282
    - element: usage count
      rule: From tenant-level usage; show to tenant-level users only.
      source: contracts/satellite/reporting.yaml#getAnalyticsUsage
    actions:
    - action: Run
      result: Opens ANL-040 for the report.
      source: contracts/satellite/reporting.yaml#runReport
    - action: Make a copy (standard reports)
      result: Creates a custom copy the venue can change; the standard report stays the shared reference.
      source: contracts/satellite/reporting.yaml#listSeededReports | R096
    - action: Retire
      result: 'Refused while an active schedule uses the report ("Pause or delete its 2 schedules first"). A report
        with past runs is retired, not removed, so its history still resolves; confirmation says which will happen.

        '
      source: contracts/satellite/reporting.yaml#deleteReport
    edgeCases:
    - case: Venue user and a tenant-level report
      expected: Absent from the list, not shown with a lock.
      source: contracts/satellite/reporting.yaml#listReports
    - case: Edit or Retire on a standard report
      expected: Not offered; the server refuses both.
      source: contracts/satellite/reporting.yaml#updateReport | R096
    consistency:
    - with: ANL-032
      note: New report starts the wizard; Make a copy opens the copy in the same builder steps.
    - with: ANL-021
      note: Same Standard/Custom badges and list layout as the dashboard library.
    sampleData:
      rows:
      - name: Shift summary
        category: Financial
        area: Shifts
        type: Standard
        runBy: Venue reports
        lastRun: 01 Oct 2026 07:00
        version: '3'
      - name: Sales by channel
        category: Sales
        area: Orders
        type: Standard
        runBy: Venue reports
        lastRun: 01 Oct 2026 08:15
      - name: Foreign-currency collections by cashier
        category: Financial
        area: Payments
        type: Custom
        owner: Fatima Al Mansoori
        runBy: Venue reports
        lastRun: 30 Sep 2026 23:05
        version: '2'
      - name: Locker rentals by hour (retired)
        category: Operations
        type: Custom
        status: Retired
    corrections:
    - what: The gap says listReports returns no described schema
      why: It returns paged ReportDefinition (name, description, category, dataSource, version, isSystem, isRetired,
        lastRunAt, createdAt, requiredPermission); most columns can bind.
      source: contracts/satellite/reporting.yaml#listReports | screens/P16-venue-analytics.yaml#ANL-031
    - what: Report Type values Standard, Custom, Scheduled, AI-generated
      why: Standard/Custom is isSystem; Scheduled is whether a schedule exists; AI-generated (saved from a natural-language
        answer) is not recorded on the definition.
      source: contracts/satellite/reporting.yaml#ReportDefinition | contracts/satellite/reporting.yaml#saveNaturalLanguageQuery
  ANL-032:
    summary: 'Starts a report: Basics, Data area, Type, then the builder steps (fields, filters, grouping, layout,
      preview). A report can only be created once it has a data area, at least one column and the access level needed
      to run it, so the wizard keeps everything on the client until the first save. The thing to get right is the
      access level: an author can only give a report an access level they hold.

      '
    inputs:
    - field: name, description
      rule: Name required, up to 200 characters; description up to 1,000.
      source: contracts/satellite/reporting.yaml#CreateReportRequest
    - field: category (shown as "Type")
      rule: One of the ten categories. The pack's step 3 "Report type" is this field.
      source: contracts/satellite/reporting.yaml#ReportCategory
    - field: dataSource (shown as "Data area")
      rule: One area per report (Orders, Order lines, Payments, Refunds, Shifts, Admissions scans ...). Areas that
        name a person (guests, staff, loyalty, reviews, accreditation) carry a "Personal data" badge.
      source: contracts/satellite/reporting.yaml#DataSource
    - field: requiredPermission (shown as "Who can run it")
      rule: Choices in words, only those the author holds - "Anyone with venue reports", "Region reports", "All
        venues". Choosing a level not held is refused.
      source: contracts/satellite/reporting.yaml#CreateReportRequest | contracts/satellite/reporting.yaml#createReport
    - field: maxDateRangeDays (shown as "Longest date range")
      rule: Default 366 days; guards against a query over years of scan events.
      source: contracts/satellite/reporting.yaml#CreateReportRequest | R158
    - field: Owner, Tags, Language (pack fields)
      rule: The creator is recorded automatically; tags and language have no field. Show owner read-only, omit the
        other two.
      source: contracts/satellite/reporting.yaml#ReportDefinition
    actions:
    - action: Save
      result: Creates version 1 and returns to the builder; an unknown field or an estimated cost beyond the limit
        is refused with the field named.
      source: contracts/satellite/reporting.yaml#createReport
    edgeCases:
    - case: User leaves the wizard before choosing a column
      expected: Nothing can be saved (a report needs at least one column); warn "Your report has not been saved
        yet".
      source: contracts/satellite/reporting.yaml#CreateReportRequest
    consistency:
    - with: ANL-022
      note: Same step pattern and wording.
    - with: ANL-054
      note: The AI report generator creates through the same operation; its draft lands in these steps for review.
    sampleData:
      basics:
        name: Daily closing - Aquaventure
        type: Financial
        dataArea: Payments
        whoCanRun: Anyone with venue reports
        longestRange: 31 days
    corrections:
    - what: The gap says the wizard declares no write operation
      why: It declares createReport; the gap text is stale.
      source: screens/P16-venue-analytics.yaml#ANL-032
    - what: Labels "Inventory - Resources - Marketing" and "Step 2 - Business Domain" drawn as text fields
      why: A fragment of the pack's domain list and a step heading; the step is one data-area choice.
      source: screens/P16-venue-analytics.yaml#ANL-032
    - what: No draft state for a report
      why: A definition exists only once it has columns, and every later save publishes a version, so the builder's
        "save draft" has nowhere to go.
      source: contracts/satellite/reporting.yaml#CreateReportRequest | contracts/satellite/reporting.yaml#updateReport
        | MATRIX 7.4.45 | MATRIX 11.1.2
  ANL-033:
    summary: 'Picks the governed data a report is built from, in business words, with no database access. The catalogue
      shows each dataset''s meaning, its grain (what one row is) and whether it holds personal data. The thing to
      get right: show grain prominently, because a report over the wrong grain is wrong in ways nobody can see;
      and only certified, published datasets are offered.

      '
    outputs:
    - element: domain groups
      rule: Ticketing, Sales, Finance, Payments, Access, Customer and the other domains of the published model;
        each with its datasets.
      source: contracts/satellite/reporting.yaml#SemanticModel | screens/P16-venue-analytics.yaml#ANL-033
    - element: dataset card
      rule: 'Name, description, "One row = one order line" (grain), field count, "Contains personal data" when any
        field is sensitive, last refreshed and expected freshness from the pipeline that feeds it ("Updated 6 min
        ago - expected every 15 min").

        '
      source: contracts/satellite/reporting.yaml#SemanticModel | contracts/satellite/reporting.yaml#AnalyticsPipeline
    - element: available history
      rule: State the history in words ("From 1 Jan 2024"); financial records are kept at least 7 years, and archived
        periods are still reachable by reports.
      source: ADR-0047 | DI-018 | MATRIX 6.1.43
    edgeCases:
    - case: Dataset whose pipeline is stale or failed
      expected: Still selectable, with a "Data delayed" warning; never hidden.
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
    - case: Forecast points
      expected: Only published forecast versions are reachable; the card says "Published forecasts only".
      source: contracts/satellite/reporting.yaml#DataSource
    consistency:
    - with: ANL-066
      note: Dataset names, descriptions and grain are the lead's catalogue, word for word.
    - with: ANL-024
      note: The canvas data pane lists the same datasets.
    sampleData:
      datasets:
      - domain: Sales
        name: Order lines
        grain: One row = one line on an order
        personalData: false
        refreshed: Updated 3 min ago
        history: From 1 Jan 2024
      - domain: Access
        name: Admission scans
        grain: One row = one scan at a gate
        personalData: false
        refreshed: Updated 40 sec ago
      - domain: Customer
        name: Guests
        grain: One row = one guest profile
        personalData: true
        refreshed: Updated 12 min ago
    corrections:
    - what: Two vocabularies for "what a report reads"
      why: The catalogue lists semantic-model datasets (codes), but a report stores one value of the DataSource
        list and fields are fetched per DataSource; nothing maps one to the other, so a dataset picked here cannot
        be saved on the report.
      source: contracts/satellite/reporting.yaml#SemanticModel | contracts/satellite/reporting.yaml#DataSource |
        contracts/satellite/reporting.yaml#listReportFields
    - what: getSemanticModel requires tenant-level access while report authoring is venue-level
      why: A venue report author cannot load this screen.
      source: contracts/satellite/reporting.yaml#getSemanticModel | contracts/satellite/reporting.yaml#createReport
    - what: Data Owner, Security Classification and certification are not in the model
      why: The client wants certified badges with owner and lineage; the model has a sensitive flag per field only.
      source: contracts/satellite/reporting.yaml#SemanticModel | MATRIX 8.7.11 | MATRIX 6.1.78
    decisions:
    - question: Is the report's data area the semantic-model dataset or the DataSource list, and who maps them?
      decision: 'Drawn default accepted: Draw datasets from the catalogue; show the data area name on the report.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-337 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#DataSource | ADR-0054
  ANL-034:
    summary: 'Chooses the report''s columns from the data area''s fields, in business names, and sets each column''s
      label, order, sort and format. The thing to get right: what a field allows (group by, total, filter) decides
      what the user can do with it, and personal-data fields are marked because exporting them needs separate permission.

      '
    inputs:
    - field: column list
      rule: At least one column. Order on screen is the report's column order (drag to reorder).
      source: contracts/satellite/reporting.yaml#CreateReportRequest
    - field: label (shown as "Column heading")
      rule: Defaults to the field's business name; rename freely.
      source: contracts/satellite/reporting.yaml#ReportColumn
    - field: aggregation
      rule: Offered only for aggregatable fields - Count, Distinct count, Sum, Average, Min, Max; Sum and Average
        only for numbers and money.
      source: contracts/satellite/reporting.yaml#ReportField | contracts/satellite/reporting.yaml#Aggregation
    - field: sortOrder, sortDirection (shown as "Sort 1, 2, 3" with ascending/descending)
      rule: Sort priority, not position. Default newest first for date-time columns.
      source: contracts/satellite/reporting.yaml#ReportColumn
    - field: format
      rule: Money columns are not given a decimal choice; they follow the venue currency (AED 2, BHD 3). Dates follow
        the reader's locale and the venue time zone.
      source: contracts/satellite/reporting.yaml#ReportColumn | DI-306 | MATRIX 6.1.78
    outputs:
    - element: field list
      rule: Grouped by type with icons (text, number, money, date, yes/no, list); badges "Personal data" and "Restricted"
        (needs a permission the user lacks - shown locked with the permission named in words).
      source: contracts/satellite/reporting.yaml#ReportField | contracts/satellite/reporting.yaml#listReportFields
    edgeCases:
    - case: User adds a personal-data field (guest email)
      expected: Allowed in the report for people who may see it; a note says exports including it need personal-data
        export permission and are recorded.
      source: contracts/satellite/reporting.yaml#ReportField | contracts/satellite/reporting.yaml#exportReportResult
    consistency:
    - with: ANL-036
      note: Aggregation chosen here is the same control as on the grouping step.
    - with: ANL-038
      note: Labels set here are the headings ANL-038 formats.
    sampleData:
      columns:
      - field: Business date
        heading: Date
        sort: 1 descending
      - field: Workstation
        heading: Till
      - field: Payment method
        heading: Tender
      - field: Amount
        heading: Amount (AED)
        aggregation: Sum
      - field: Order count
        heading: Orders
        aggregation: Count
    corrections:
    - what: Four pack actions drawn as buttons with no operation (reorder, rename, set width, configure formatting)
      why: Reorder, rename and format are edits to the report columns saved with the report; they are not separate
        operations. Column width has no field.
      source: screens/P16-venue-analytics.yaml#ANL-034 | contracts/satellite/reporting.yaml#ReportColumn
    - what: The screen has no content region
      why: listReportFields gives a full field list to draw (type, groupable, aggregatable, filterable, personal
        data, required permission).
      source: contracts/satellite/reporting.yaml#listReportFields
    - what: ReportColumn.format is an unspecified string
      why: The format grammar (percent, decimals, date pattern) is not defined, so the builder cannot offer valid
        choices.
      source: contracts/satellite/reporting.yaml#ReportColumn
  ANL-035:
    summary: 'Defines which records the report includes, without SQL: fixed filters, and parameters the person running
      it is asked for. The thing to get right: parameters narrow, they never widen; a venue manager cannot widen
      a filter to another venue because the filter is not what constrains them.

      '
    inputs:
    - field: filter rows
      rule: 'Field, operator, value. Operators by field type - text: is, is not, contains, is one of, is not one
        of, is empty, is not empty; number, money, date: is, greater than, less than, between. Between takes exactly
        two values (from, to); "is one of" takes a list; "is empty" takes none. Only filterable fields are offered.
        All rows apply together (and).

        '
      source: contracts/satellite/reporting.yaml#ReportFilter
    - field: isParameter (shown as "Ask when running")
      rule: Turns a filter into a prompt. Each prompt has a label, a type, required or optional, and a default;
        a required prompt with no default blocks the run.
      source: contracts/satellite/reporting.yaml#ReportFilter | contracts/satellite/reporting.yaml#ReportParameter
        | contracts/satellite/reporting.yaml#runReport
    - field: date range
      rule: Every run has a date range; when none is given it is today in the venue's time zone, capped at the report's
        longest range.
      source: contracts/satellite/reporting.yaml#RunReportRequest | R158
    - field: Site, Venue, Cashier, POS, Payment method, Transaction status ... (pack chips)
      rule: Present only where the data area has the field. Site and venue values list only places inside the author's
        scope.
      source: contracts/satellite/reporting.yaml#listReportFields | DI-183 | DI-151
    outputs:
    - element: plain-language summary
      rule: Under the rows, the filter read back as a sentence ("Payments at Aquaventure Waterpark, tender is Cash
        or Card, on the date you choose").
      source: DI-708
    actions:
    - action: Save
      result: Publishes a new version of the whole definition; see correction on saving per step.
      source: contracts/satellite/reporting.yaml#updateReport
    edgeCases:
    - case: An OR condition (Cash or Card) across two fields
      expected: Only "is one of" on a single field is expressible; across fields it is not. Draw no OR builder.
      source: contracts/satellite/reporting.yaml#ReportFilter
    - case: Relative dates (last 7 days)
      expected: Offered as presets on the run-time date prompt, not as stored filter operators.
      source: contracts/satellite/reporting.yaml#ReportFilter
    consistency:
    - with: ANL-027
      note: Parameters defined here are what a dashboard offers as viewer filters.
    - with: ANL-040
      note: The run screen's prompts are these parameters, same labels.
    sampleData:
      filters:
      - field: Payment method
        operator: is one of
        values:
        - Cash
        - Card
        - Foreign cash
      - field: Workstation
        operator: is
        askWhenRunning: true
        label: Till
        required: false
      - field: Business date
        operator: between
        askWhenRunning: true
        required: true
        default: Today
    corrections:
    - what: Each builder step (filters, grouping, cross-domain, layout) saves with updateReport
      why: Every update publishes a new version (full replace); four steps saved separately produce four published
        versions of a half-built report. The builder must save the whole definition once.
      source: contracts/satellite/reporting.yaml#updateReport | screens/P16-venue-analytics.yaml#ANL-035
    - what: The gap says no write operation
      why: updateReport is declared; the gap text is stale.
      source: screens/P16-venue-analytics.yaml#ANL-035
  ANL-036:
    summary: 'Turns detail into management summaries: group by fields, choose totals, and (where it exists) derived
      measures. The thing to get right is what the contract can express today: grouping by fields and seven aggregations
      with server totals. Ratios, percent of total, running totals, ranking and period-over-period are not expressible
      in a report yet, so draw them as pending, not as working controls.

      '
    inputs:
    - field: groupBy
      rule: Ordered list of groupable fields; the order is the subtotal hierarchy (Venue, then Channel).
      source: contracts/satellite/reporting.yaml#CreateReportRequest | contracts/satellite/reporting.yaml#ReportField
    - field: aggregation per measure
      rule: Count, Distinct count, Sum, Average, Min, Max. Average of money is rounded to the currency's scale.
      source: contracts/satellite/reporting.yaml#Aggregation | DI-306
    - field: time grain (pack Date, Week, Month, Year)
      rule: Only where the data area offers a week or month field; there is no bucketing option on the report.
      source: contracts/satellite/reporting.yaml#CreateReportRequest
    outputs:
    - element: totals
      rule: Server-computed totals for aggregated columns only; a grand total row at the bottom, bold.
      source: contracts/satellite/reporting.yaml#ReportResult
    - element: grain warning
      rule: Averaging an already averaged measure, or summing across a grain the data area does not have, shows
        a warning naming the grain.
      source: contracts/satellite/reporting.yaml#SemanticModel
    edgeCases:
    - case: Tenant-wide sum of money across an AED venue and a BHD venue
      expected: Never one total; group by venue (or currency) and show a total per currency.
      source: DI-211
    - case: Net revenue built by hand from gross minus discounts
      expected: Use the governed KPI instead; a report must not create a second definition of Net revenue.
      source: MATRIX 8.7.21
    consistency:
    - with: ANL-025
      note: Derived business measures belong in the KPI builder, not in a report.
    - with: ANL-063
      note: Period-over-period comparison exists for KPIs (previous period, same period last year), not for reports.
    sampleData:
      groupBy:
      - Venue
      - Sales channel
      measures:
      - field: Net amount
        aggregation: Sum
        heading: Net revenue (AED)
      - field: Order id
        aggregation: Distinct count
        heading: Orders
      result:
      - venue: Aquaventure Waterpark
        channel: POS
        net: AED 182,440.25
        orders: 3112
      - venue: Aquaventure Waterpark
        channel: Web
        net: AED 241,090.00
        orders: 2874
    corrections:
    - what: Calculation builder and the Period-over-Period Change button
      why: ReportColumn holds field, label, aggregation and format only; ratios, percent of total, running totals,
        moving averages, rank and period comparison have no field.
      source: contracts/satellite/reporting.yaml#ReportColumn | MATRIX 6.1.78
    - what: The gap says no write operation
      why: updateReport is declared; the gap text is stale.
      source: screens/P16-venue-analytics.yaml#ANL-036
    decisions:
    - question: Do reports get calculated columns and period comparison, or do those stay KPI-only?
      decision: 'Drawn default accepted: Show them disabled with "Available for KPIs".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-338 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 6.1.78
  ANL-037:
    summary: 'The client calls cross-domain reporting one of the most important capabilities of the report builder:
      ticket sales with F&B spend per visitor, admissions with membership, and so on. The thing to get right: today
      a report reads exactly one data area, so nothing on this screen can be saved; the design is the specification,
      and it must keep relationships governed (declared joins only) and grain visible.

      '
    inputs:
    - field: primary dataset
      rule: The dataset whose grain the report keeps; every other dataset joins to it.
      source: contracts/satellite/reporting.yaml#SemanticModel
    - field: related datasets
      rule: 'Only datasets with a declared relationship to the primary one. Many-to-one joins are safe; one-to-many
        shows "This repeats each order once per line - totals may multiply"; many-to-many is not offered.

        '
      source: contracts/satellite/reporting.yaml#SemanticModel | contracts/satellite/reporting.yaml#getSemanticModel
    - field: access per domain
      rule: The author must hold the access of every domain combined; a domain they cannot read is not offered.
      source: contracts/satellite/reporting.yaml#createReport
    edgeCases:
    - case: Two domains refreshed at different times
      expected: Each joined dataset shows its own "as of" time on the result.
      source: contracts/satellite/reporting.yaml#ReportResult | contracts/satellite/reporting.yaml#AnalyticsPipeline
    consistency:
    - with: ANL-066
      note: Relationships shown are the catalogue's, with the same cardinality wording.
    - with: ANL-033
      note: The primary dataset is chosen with the same cards.
    sampleData:
      primary: Admission scans
      related:
      - dataset: Order lines
        via: Visit
        cardinality: one visit to many lines
        note: per-visit totals
      - dataset: Memberships
        via: Guest
        cardinality: many scans to one membership
      example: 'Spend per guest by visit day - Aquaventure Waterpark, September 2026: AED 96.40 average'
    corrections:
    - what: A report has exactly one data area
      why: CreateReportRequest.dataSource is a single value and listReportFields is per data area, so a cross-domain
        report cannot be defined; relationships in the semantic model are never used by a report.
      source: contracts/satellite/reporting.yaml#CreateReportRequest | MATRIX 8.7.11
    - what: The gap says no write operation, and the screen has no content region
      why: updateReport is declared; the content (primary dataset, related datasets, cardinality) is drawable from
        the semantic model.
      source: screens/P16-venue-analytics.yaml#ANL-037
    decisions:
    - question: How does a definition name more than one dataset - a list of sources with declared joins, or a cross-domain
        dataset published in the semantic model?
      decision: 'Drawn default accepted: Draw primary plus related datasets; mark Save as pending.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-339 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.11 | MATRIX 8.7.14 | MATRIX 6.1.78
  ANL-038:
    summary: 'How the finished report looks on screen, in Excel and in PDF, in English and in Arabic. The thing
      to get right is money and language: money keeps the currency''s decimals (AED 2, BHD/KWD/OMR 3, never rounded
      away), exports carry numbers as numbers, and an Arabic PDF is laid out right to left.

      '
    inputs:
    - field: Column labels
      rule: From the field step; one heading per column (see correction on Arabic headings).
      source: contracts/satellite/reporting.yaml#ReportColumn
    - field: Number, Percentage, Decimal precision
      rule: Percent to one decimal by default; counts with no decimals; money precision is not a user choice.
      source: DI-306
    - field: Currency
      rule: Not a choice. Each venue's base currency; a multi-venue report shows the currency per row.
      source: DI-211
    - field: Date format
      rule: Locale-aware, in the venue's time zone; the PDF header states the zone ("Times in Gulf Standard Time").
      source: MATRIX 6.1.78
    - field: Conditional formatting
      rule: Rule plus icon or text, never colour alone (e.g. variance below zero shows a down arrow and the word
        Short).
      source: MATRIX 8.7.1
    outputs:
    - element: PDF
      rule: 'Header with tenant logo and report name, venue, period, parameters used, "Data as of 07:00" and version;
        footer with page x of y and generated-by. Arabic: mirrored layout, Arabic headings, right-aligned text,
        numbers left-to-right inside cells.

        '
      source: DI-019 | contracts/satellite/reporting.yaml#ReportResult | contracts/satellite/reporting.yaml#ReportExecution
    - element: Excel
      rule: Money as numeric cells with the currency format and its decimals (BHD 0.000); totals as values computed
        by the server, not spreadsheet formulas; frozen header row.
      source: contracts/satellite/reporting.yaml#ReportResult | DI-306
    consistency:
    - with: ANL-044
      note: The logo and branding used here are the tenant's white-label assets, the same as on emails.
    sampleData:
      header:
        report: Daily closing - Aquaventure Waterpark
        period: 30 Sep 2026
        asOf: 01 Oct 2026 07:00
        version: '4'
        zone: Gulf Standard Time
      rows:
      - till: POS-03 Main Gate
        tender: Cash
        amount: AED 8,460.00
        variance: AED -20.00 Short
      - till: POS-07 Wave Bar
        tender: Card
        amount: AED 12,915.50
      bahrainRow:
        venue: Lost Paradise of Dilmun
        amount: BHD 2,013.125
      arabicHeading: تقرير الإغلاق اليومي
    corrections:
    - what: Only a column label and a free-text format exist
      why: Page layout, orientation, header, footer, logo, language and conditional formatting have no field on
        the report; the pack's branding and logo buttons have nothing to save to.
      source: contracts/satellite/reporting.yaml#ReportColumn | screens/P16-venue-analytics.yaml#ANL-038
    - what: A column has one label string
      why: Arabic reports are a core requirement; one label cannot carry an English and an Arabic heading.
      source: contracts/satellite/reporting.yaml#ReportColumn | DI-019
    - what: Decimal precision and Currency drawn as free selects
      why: Money precision follows the currency (3 decimals for BHD/KWD/OMR) and records are in base currency; letting
        a user pick 2 decimals for BHD drops the third.
      source: DI-306 | DI-211
    decisions:
    - question: Is the report language chosen per run, per schedule, or by the reader's profile?
      decision: 'Drawn default accepted: By the reader''s language; the schedule''s recipients get the owner''s choice.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-340 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-019
    - question: Western or Arabic-Indic digits in Arabic PDFs?
      decision: 'Drawn default accepted: Western digits.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-341 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-019
  ANL-039:
    summary: 'Checks a report before it is saved or shared: run it, see what came back, how long it took, what constrained
      it, and whether totals look right. The thing to get right: there is no sample mode - a test run is a real
      run under the author''s own access - so a large range may run in the background and must be cancellable.

      '
    outputs:
    - element: run summary
      rule: 'Rows returned, time taken, version tested, data as of, the parameters used (defaults filled in), and
        "What limited this result" in words ("Your access: Aquaventure Waterpark").

        '
      source: contracts/satellite/reporting.yaml#ReportExecution | contracts/satellite/reporting.yaml#ReportResult
    - element: checks
      rule: 'Blocking: a required prompt with no value or default; a date range over the longest allowed. Warning:
        estimated cost High (will always run in the background); personal-data columns present; totals that do not
        match the standard report for the same period (e.g. Sales by channel).

        '
      source: contracts/satellite/reporting.yaml#runReport | contracts/satellite/reporting.yaml#ReportDefinition
    - element: sample rows
      rule: The first page of the result (cursor-paged), with totals.
      source: contracts/satellite/reporting.yaml#getReportResult
    actions:
    - action: Test run
      result: Up to the inline limit (5,000 rows proposed) results return at once; beyond it, or for a High-cost
        report, it queues and shows Queued, Running with a Cancel.
      source: contracts/satellite/reporting.yaml#runReport | R094
    - action: Cancel run
      result: Stops a running test; status Cancelled.
      source: contracts/satellite/reporting.yaml#cancelReportExecution
    edgeCases:
    - case: Run fails
      expected: Shows the error in words and keeps the definition unchanged.
      source: contracts/satellite/reporting.yaml#ReportExecution
    - case: Results expired
      expected: The result is kept for a limited time; an old test shows "Results expired - run again".
      source: contracts/satellite/reporting.yaml#ReportExecution | contracts/satellite/reporting.yaml#ExecutionStatus
    consistency:
    - with: ANL-040
      note: Same result table and header as the run screen.
    sampleData:
      summary:
        rows: 1284
        took: 2.4 s
        version: draft of v5
        asOf: 01 Oct 2026 10:41
        limitedTo: Aquaventure Waterpark
        parameters: Business date 30 Sep 2026; Till - all
      checks:
      - severity: Warning
        text: Includes guest email - exports need personal-data permission
      - severity: Pass
        text: Total AED 412,860.50 matches Sales by channel for 30 Sep 2026
    corrections:
    - what: '"Run it against a sample"'
      why: A run has no row limit or sample option; it is a full run under the author's access. Design a capped
        date range, not a sample.
      source: contracts/satellite/reporting.yaml#RunReportRequest | screens/P16-venue-analytics.yaml#ANL-039
    - what: Testing a change means publishing it first
      why: runReport runs a saved definition and every save publishes a version, so an unsaved change cannot be
        tested.
      source: contracts/satellite/reporting.yaml#runReport | contracts/satellite/reporting.yaml#updateReport
    decisions:
    - question: Can a draft definition be test-run before it is published?
      decision: 'Drawn default accepted: Draw "Test run" on the draft; mark it pending.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-342 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 7.4.45 | MATRIX 11.1.2
  ANL-040:
    summary: 'Runs a report and shows the result: prompts, the table with totals, and exports. The header states
      exactly what was run, so a figure can be reproduced months later. The thing to get right: large results run
      in the background and page, never freeze; exports are permission-gated and personal data needs a separate
      permission and a stated purpose.

      '
    inputs:
    - field: prompts
      rule: The report's parameters with their labels and defaults; required ones marked; date range defaults to
        today in the venue's time zone.
      source: contracts/satellite/reporting.yaml#RunReportRequest | contracts/satellite/reporting.yaml#ReportParameter
        | R158
    - field: venueId (shown as "Venue")
      rule: Narrows to one venue; it cannot reach beyond the user's access.
      source: contracts/satellite/reporting.yaml#RunReportRequest
    outputs:
    - element: result header
      rule: 'Report name and version, period, parameters used, "What limited this result" in words, "Data as of
        10:41" (the replica position), run by and when, and "Results kept until 08 Oct 2026".

        '
      source: contracts/satellite/reporting.yaml#ReportExecution | contracts/satellite/reporting.yaml#ReportResult
    - element: table
      rule: Virtualised, cursor-paged; server totals pinned at the bottom; money in the venue currency at its scale;
        labels Gross sales, Discounts, Refunds, Net revenue never shortened to "Revenue".
      source: contracts/satellite/reporting.yaml#ReportResult | DI-710
    - element: export menu
      rule: 'Excel, PDF, CSV (and JSON for systems). Shown only with export permission. "Include personal data"
        appears only with personal-data export permission and then requires a purpose; the dialog says the export
        is recorded.

        '
      source: contracts/satellite/reporting.yaml#exportReportResult | contracts/satellite/reporting.yaml#ExportFormat
    actions:
    - action: Run
      result: Small results show at once; large ones queue with Queued and Running states and a Cancel; when complete
        the table loads.
      source: contracts/satellite/reporting.yaml#runReport | contracts/satellite/reporting.yaml#getReportExecution
    - action: Export
      result: Always in the background; a progress chip then a Download link that expires.
      source: contracts/satellite/reporting.yaml#exportReportResult | contracts/satellite/reporting.yaml#getReportExport
    - action: Schedule
      result: Opens ANL-042 with this report and the current prompt values.
      source: contracts/satellite/reporting.yaml#CreateReportScheduleRequest
    edgeCases:
    - case: Date range longer than the report allows
      expected: Refused before running, naming the limit ("This report covers at most 31 days").
      source: contracts/satellite/reporting.yaml#runReport
    - case: AI-assisted building on a finance report
      expected: Finance AI reporting is phase two; do not draw the AI prompt on financial reports in phase one.
      source: DI-278
    consistency:
    - with: ANL-045
      note: Exports started here appear in the export centre with the same statuses.
    - with: ANL-052
      note: The "Ask TICVAI to build my report" entry hands off to the natural-language screen; its saved answer
        becomes a report run here.
    sampleData:
      header:
        report: Shift summary
        version: '3'
        period: 30 Sep 2026
        limitedTo: Aquaventure Waterpark
        asOf: 01 Oct 2026 07:00
        runBy: Fatima Al Mansoori
        keptUntil: 08 Oct 2026
      rows:
      - till: POS-03 Main Gate
        cashier: Rahul Menon
        expected: AED 8,480.00
        counted: AED 8,460.00
        variance: AED -20.00 Short
      - till: POS-05 Kids Zone
        cashier: Omar Haddad
        expected: AED 3,215.50
        counted: AED 3,215.50
        variance: AED 0.00
      totals:
        expected: AED 11,695.50
        counted: AED 11,675.50
        variance: AED -20.00
    corrections:
    - what: XML export
      why: The client's export list includes XML, but the export formats are CSV, Excel, PDF and JSON.
      source: contracts/satellite/reporting.yaml#ExportFormat | MATRIX 6.1.20 | screens/P16-venue-analytics.yaml#ANL-045
    - what: Export permissions are listed as an unclaimed banner
      why: The export controls are the ones that claim them; draw them on the export menu (export, then personal-data
        export), not as a banner.
      source: screens/P16-venue-analytics.yaml#ANL-040 | contracts/satellite/reporting.yaml#exportReportResult
  ANL-041:
    summary: 'The reporting administrator''s overview: what runs, what was delivered, what failed, what left the
      platform with personal data in it. The thing to get right: lead with failures and personal-data deliveries,
      because a report that silently stopped arriving is worse than one that never existed; and several pack counters
      have no source yet, so draw them as pending rather than as zeros.

      '
    outputs:
    - element: headline counters (available)
      rule: 'Active schedules and paused schedules; schedules with consecutive failures; deliveries today, delivered
        and failed; deliveries that contained personal data; external recipients. Failed and personal-data counters
        first, linking to ANL-048 and ANL-049.

        '
      source: contracts/satellite/reporting.yaml#ReportSchedule | contracts/satellite/reporting.yaml#ReportDelivery
        | contracts/satellite/reporting.yaml#listReportDeliveries
    - element: headline counters (pending)
      rule: Active reports and published dashboards (no count operation; lists only), pending approvals (no report
        or dashboard approval), exports today and large exports (no export list), API report requests (no source),
        governance exceptions (undefined). Draw greyed with "Not yet available".
      source: contracts/satellite/reporting.yaml#listReports | contracts/satellite/reporting.yaml#getReportExport
    - element: recent lists
      rule: Failed deliveries (newest first, with reason), recently changed schedules, permission changes from the
        platform audit trail.
      source: contracts/satellite/reporting.yaml#listReportDeliveries | contracts/spine/tenancy.yaml#listAuditRecords
    edgeCases:
    - case: Venue-level user opens the board
      expected: Delivery data needs tenant-level access; a venue user sees schedules only and a note naming the
        missing access.
      source: contracts/satellite/reporting.yaml#listReportDeliveries | contracts/satellite/reporting.yaml#listReportSchedules
    consistency:
    - with: ANL-061
      note: Same health words and counters style as the BI administration command centre.
    sampleData:
      counters:
        activeSchedules: 37
        paused: 4
        failingSchedules: 2
        deliveredToday: 112
        failedToday: 3
        withPersonalData: 6
        externalRecipients: 9
      failed:
      - report: Daily closing - Aquaventure
        route: Email
        at: 01 Oct 2026 07:00
        reason: Mailbox full - finance@aquaventure.ae
        retries: 2
      - report: F&B sales by outlet
        route: SFTP
        at: 01 Oct 2026 06:30
        reason: SFTP login rejected
        retries: 3
    corrections:
    - what: Exports Today, Large Exports, Pending Approvals and API Report Requests have no source
      why: There is no operation listing exports, no approval for reports or dashboards, and no record of API report
        calls.
      source: contracts/satellite/reporting.yaml#getReportExport | contracts/spine/approvals.yaml#ApprovalKind |
        screens/P16-venue-analytics.yaml#ANL-041
  ANL-042:
    summary: 'Schedules a report to run and be sent, e.g. the client''s "daily closing sales report emailed each
      morning to finance". A schedule runs under its owner''s permissions, not the recipients'', so it is a standing
      grant of whatever the owner can see; the screen must make that plain. The thing to get right: the frequencies
      the platform supports are not the pack''s list.

      '
    inputs:
    - field: cadence.frequency
      rule: 'Daily, Weekly, Monthly, Quarterly, At shift close, At period close. Daily needs a time; weekly a day
        and time; monthly a day of the month and time (31 runs on the month''s last day); quarterly a day and time
        in the first month of each quarter; the two event cadences need nothing else. Once, Hourly, Yearly and Custom
        are not supported.

        '
      source: contracts/satellite/reporting.yaml#Cadence | R158
    - field: timeOfDay, timeZone
      rule: Time is entered in the venue's time zone; the zone is shown, not chosen ("07:00 Gulf Standard Time").
        Heavy schedules are spread across the window, so say "around 07:00".
      source: contracts/satellite/reporting.yaml#Cadence | contracts/satellite/reporting.yaml#createReportSchedule
    - field: parameters
      rule: The report's prompts, fixed for every run; date prompts offered as "the previous day", "the previous week" (see
        decisions).
      source: contracts/satellite/reporting.yaml#CreateReportScheduleRequest
    - field: recipients
      rule: People in the tenant, email addresses, SFTP or webhook destinations; at least one. Recipients outside
        the tenant are flagged "External".
      source: contracts/satellite/reporting.yaml#Recipient
    - field: format
      rule: PDF, Excel, CSV or JSON.
      source: contracts/satellite/reporting.yaml#ExportFormat
    - field: includePersonalData
      rule: Off by default; offered only to an owner with personal-data export permission; turning it on shows "Recorded
        in the audit trail".
      source: contracts/satellite/reporting.yaml#CreateReportScheduleRequest | contracts/shared/permissions.yaml#/components/schemas/Permission
    - field: skipIfEmpty (shown as "Don't send an empty report")
      rule: On by default; an empty report every morning trains people to ignore it.
      source: contracts/satellite/reporting.yaml#CreateReportScheduleRequest
    outputs:
    - element: owner banner
      rule: '"Runs with your access. Recipients receive everything you can see in this report."'
      source: contracts/satellite/reporting.yaml#ReportSchedule
    - element: schedule list
      rule: Name, report, cadence in words ("Every day around 07:00"), next run, last run and its status, consecutive
        failures, Paused badge.
      source: contracts/satellite/reporting.yaml#ReportSchedule
    actions:
    - action: Schedule
      result: Creates the schedule; a cadence missing a field it needs, or sending one it does not take, is refused
        with the field named; no recipients is refused.
      source: contracts/satellite/reporting.yaml#createReportSchedule
    - action: Pause, Resume, Edit, Delete
      result: Exist in the contract (cadence, recipients, format, pause); see correction - this screen does not
        declare them.
      source: contracts/satellite/reporting.yaml#updateReportSchedule | contracts/satellite/reporting.yaml#deleteReportSchedule
    edgeCases:
    - case: The owner loses access or leaves
      expected: The schedule keeps the owner's (now reduced) access; flag schedules whose owner is inactive for reassignment
        (see decisions).
      source: contracts/satellite/reporting.yaml#ReportSchedule
    - case: The report is retired
      expected: A report with an active schedule cannot be retired; the schedule list shows which reports are pinned
        by schedules.
      source: contracts/satellite/reporting.yaml#deleteReport
    consistency:
    - with: ANL-043
      note: A subscription can point at a schedule; one schedule can serve several subscriptions.
    - with: BO-061
      note: The venue back-office Scheduled Reports screen uses the same schedule operations and must use the same
        cadence words.
    sampleData:
    - name: Daily closing - finance
      report: Daily closing - Aquaventure
      cadence: Every day around 07:00 GST
      parameters: Business date - previous day
      recipients:
      - Fatima Al Mansoori
      - finance@aquaventure.ae
      format: PDF
      skipIfEmpty: true
      nextRun: 02 Oct 2026 07:00
    - name: Shift close - cash variance
      report: Shift summary
      cadence: At shift close
      recipients:
      - Omar Haddad
      format: PDF
    - name: Bahrain weekly sales
      report: Sales by channel
      cadence: Every Sunday around 08:00 AST
      recipients:
      - sales@dilmun.bh
      format: Excel
      note: BHD amounts keep 3 decimals
    corrections:
    - what: Frequencies Once, Hourly, Yearly and Custom; fields Start Date, End Date, Time Zone, Run immediately,
        Retry on failure, Maximum retries, Timeout, Skip if stale, Wait for source refresh, Report Version
      why: Cadence supports daily, weekly, monthly, quarterly, shift close and period close only; the time zone
        is always the venue's and read-only; the other fields do not exist (a schedule runs the report's current
        version).
      source: contracts/satellite/reporting.yaml#Cadence | contracts/satellite/reporting.yaml#CreateReportScheduleRequest
        | screens/P16-venue-analytics.yaml#ANL-042
    - what: The screen declares only list and create
      why: Pause, resume, amend and delete exist and the scheduler cannot work without them.
      source: contracts/satellite/reporting.yaml#updateReportSchedule | contracts/satellite/reporting.yaml#deleteReportSchedule
    - what: Recipient groups and email templates
      why: The client wants schedules to defined recipient groups using configurable email templates; Recipient
        is one person or address and nothing holds a template.
      source: DI-714 | MoM 2026-09-08 4.8 Report Distribution & Scheduling | contracts/satellite/reporting.yaml#Recipient
    - what: dayOfWeek 0 to 6 does not say which day is 0
      why: UAE weeks start on Monday; an off-by-one sends the weekly report on the wrong day.
      source: contracts/satellite/reporting.yaml#Cadence
    decisions:
    - question: Do recipient groups (Finance team, Operations leads) and email templates join the schedule?
      decision: 'Drawn default accepted: Pick people and addresses individually; show the default email text read-only.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-343 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-714 | TRACKER Actions row 257
    - question: How does a scheduled run express "the previous day" when parameters are fixed values?
      decision: 'Drawn default accepted: Draw relative presets; flag pending.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-344 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#CreateReportScheduleRequest
  ANL-043:
    summary: 'Who receives which report, in what format, by which route, and under whose access. A subscription
      is not a schedule: the schedule says when, the subscription says who and how, and one schedule can feed several.
      The thing to get right: personal data going out, especially to external addresses, is visible on every row,
      because someone will ask about it later.

      '
    inputs:
    - field: report
      rule: Required. Dashboards and KPI summaries cannot be subscribed to (see correction).
      source: contracts/satellite/reporting.yaml#ReportSubscription
    - field: schedule
      rule: Optional link to an existing schedule; without one the subscription has no timing of its own (see decisions).
      source: contracts/satellite/reporting.yaml#ReportSubscription
    - field: recipients
      rule: A person in the tenant or an email address; addresses outside the tenant are marked External.
      source: contracts/satellite/reporting.yaml#ReportSubscription
    - field: channel (shown as "Send by")
      rule: Email, SFTP, Webhook, In TICVAI (notification centre).
      source: contracts/satellite/reporting.yaml#ReportSubscription
    - field: includesPersonalData
      rule: Needs personal-data export permission; recorded.
      source: contracts/satellite/reporting.yaml#ReportSubscription
    outputs:
    - element: list
      rule: Report, recipients (count plus first two names), route, format, "Runs as Fatima Al Mansoori", Personal
        data and External badges, Active or Inactive. Cursor-paged.
      source: contracts/satellite/reporting.yaml#listReportSubscriptions | contracts/satellite/reporting.yaml#ReportSubscription
    actions:
    - action: Add subscription
      result: Creates it; the confirmation repeats "Recipients receive what Fatima Al Mansoori can see".
      source: contracts/satellite/reporting.yaml#createReportSubscription
    edgeCases:
    - case: Personal data to an external address
      expected: Requires an explicit second confirmation naming the address; recorded.
      source: contracts/satellite/reporting.yaml#ReportSubscription
    consistency:
    - with: ANL-042
      note: Schedule recipients and subscription recipients must not become two separate lists people maintain (see
        correction).
    - with: ANL-044
      note: The route and format chosen here are configured in detail on ANL-044.
    sampleData:
    - report: Daily closing - Aquaventure
      recipients:
      - Fatima Al Mansoori
      - cfo@aquaventure.ae
      route: Email
      format: PDF
      runsAs: Fatima Al Mansoori
      personalData: false
      active: true
    - report: Guest arrivals - VIP
      recipients:
      - concierge@partnerhotel.ae (External)
      route: Email
      format: Excel
      runsAs: Omar Haddad
      personalData: true
      active: true
    corrections:
    - what: No way to edit, deactivate or remove a subscription
      why: Only list and create exist; a subscription cannot be stopped from the platform.
      source: contracts/satellite/reporting.yaml#listReportSubscriptions | contracts/satellite/reporting.yaml#createReportSubscription
    - what: Subscriptions to dashboards and KPI summaries
      why: The screen's purpose names them; a subscription references a report only.
      source: screens/P16-venue-analytics.yaml#ANL-043 | contracts/satellite/reporting.yaml#ReportSubscription
    - what: Two recipient models
      why: A schedule carries its own recipients, format and personal-data flag, and a subscription carries another
        set (and different route values) for the same thing.
      source: contracts/satellite/reporting.yaml#CreateReportScheduleRequest | contracts/satellite/reporting.yaml#ReportSubscription
    - what: The gap says no write operation and nothing drawable
      why: createReportSubscription is declared and the subscription schema gives a full row.
      source: screens/P16-venue-analytics.yaml#ANL-043
    decisions:
    - question: Is a subscription without a schedule allowed, and when does it send?
      decision: 'Drawn default accepted: Require a schedule.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-345 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#ReportSubscription
    - question: Can a recipient unsubscribe themselves from an email link?
      decision: 'Drawn default accepted: Not drawn.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-346 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#ReportSubscription
  ANL-044:
    summary: 'Configures how a generated report reaches people: route, format, file and message. The thing to get
      right: the pack''s four "buttons" are delivery routes, not actions, and most of the pack''s settings (subject,
      body template, naming, password, expiry, priority, language) have no field yet; draw what can be stored and
      keep the rest visibly pending.

      '
    inputs:
    - field: route (pack buttons Notification Center, Secure Download, API, External approved destination)
      rule: In TICVAI, Email, Webhook, SFTP - a single choice, drawn as a segmented control.
      source: contracts/satellite/reporting.yaml#ReportSubscription
    - field: format
      rule: PDF, Excel, CSV, JSON.
      source: contracts/satellite/reporting.yaml#ReportSubscription
    - field: attachment or secure link
      rule: Exports are produced as signed, expiring download links; personal data should go by link only (see decisions).
      source: contracts/satellite/reporting.yaml#ReportExport
    - field: Time zone
      rule: Not a choice; the venue's zone.
      source: contracts/satellite/reporting.yaml#Cadence
    - field: Branding
      rule: The tenant's white-label logo and colours; "Powered by TICVAI" footer.
      source: MATRIX 6.1.78
    outputs:
    - element: email preview
      rule: Subject and body as the recipient sees them, in English and Arabic (right to left), with the period
        and "Data as of" in the body.
      source: DI-714 | DI-019
    consistency:
    - with: ANL-043
      note: This is the detail view of a subscription's route and format.
    - with: ANL-038
      note: The attached PDF is the layout designed there.
    sampleData:
      route: Email
      format: PDF
      subject: Daily closing - Aquaventure Waterpark - 30 Sep 2026
      body: 'Attached: daily closing for 30 Sep 2026. Data as of 01 Oct 2026 07:00 GST. Net revenue AED 412,860.50.'
      subjectAr: الإغلاق اليومي - أكوافنتشر - 30 سبتمبر 2026
    corrections:
    - what: Email subject, body template, file naming, password policy, expiration, delivery priority, language
        and recipient fields
      why: A subscription holds route, format, recipients and the personal-data flag only.
      source: contracts/satellite/reporting.yaml#ReportSubscription | screens/P16-venue-analytics.yaml#ANL-044
    - what: The four channel buttons are drawn as actions with no operation
      why: They are values of the route; there is nothing to call.
      source: contracts/satellite/reporting.yaml#ReportSubscription
    decisions:
    - question: Must reports with personal data go by secure link only, never as an attachment?
      decision: 'Drawn default accepted: Link only for personal data; attachment allowed otherwise.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-347 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#ReportExport
  ANL-045:
    summary: 'Where people collect exports and administrators see what data left the platform. Exports are always
      asynchronous: requested, generating, ready (with a signed link that expires), failed or expired. The thing
      to get right: personal-data exports are visibly different (who, why, when) and the purpose given is shown;
      and there is no list of exports to draw from yet.

      '
    inputs:
    - field: format
      rule: Excel, PDF, CSV, JSON.
      source: contracts/satellite/reporting.yaml#ExportFormat
    - field: includePersonalData, purpose
      rule: Only with personal-data export permission; purpose required (up to 500 characters) when on.
      source: contracts/satellite/reporting.yaml#exportReportResult
    outputs:
    - element: export row
      rule: Report, requested by, venue, format, requested at, size, rows (from the run), status, link expiry ("Link
        expires in 23 h"), Personal data badge with purpose on hover.
      source: contracts/satellite/reporting.yaml#ReportExport | contracts/satellite/reporting.yaml#ReportExecution
    actions:
    - action: Download
      result: Shown only while Ready; after expiry, "Export again" re-runs the export of the same result if the
        result is still kept, otherwise asks to run the report again.
      source: contracts/satellite/reporting.yaml#ReportExport | contracts/satellite/reporting.yaml#ReportExecution
    edgeCases:
    - case: Personal data requested without permission
      expected: Refused; the toggle should not have been offered.
      source: contracts/satellite/reporting.yaml#exportReportResult
    - case: Seven years of financial history in one export
      expected: A single run covers the report's longest range (366 days unless set); draw a year picker and say
        "Export one year at a time".
      source: ADR-0047 | contracts/satellite/reporting.yaml#CreateReportRequest
    consistency:
    - with: ANL-040
      note: Same statuses and same export dialog.
    - with: ANL-049
      note: Personal-data exports appear in the audit trail.
    sampleData:
    - report: Guest arrivals - VIP
      requestedBy: Omar Haddad
      venue: Aquaventure Waterpark
      format: Excel
      requested: 01 Oct 2026 09:02
      size: 184 KB
      rows: 212
      status: Ready
      expires: in 23 h
      personalData: true
      purpose: Concierge welcome calls for 2 Oct arrivals
    - report: Sales by channel
      requestedBy: Rahul Menon
      venue: All my venues
      format: PDF
      requested: 01 Oct 2026 08:40
      status: Generating
    corrections:
    - what: No operation lists exports
      why: Exports can be created and read by id only; the centre has no list to show, and the administrator view
        of what left the platform has no source.
      source: contracts/satellite/reporting.yaml#getReportExport | screens/P16-venue-analytics.yaml#ANL-045
    - what: XML in the required formats
      why: Export formats are CSV, Excel, PDF and JSON; XML is missing.
      source: contracts/satellite/reporting.yaml#ExportFormat | MATRIX 6.1.20
    - what: Site, Record Count and Completed Time are not on the export
      why: The export holds format, status, size, requester, requested and expiry times; rows come from the execution,
        venue from the run.
      source: contracts/satellite/reporting.yaml#ReportExport
  ANL-046:
    summary: 'Lets an approved external system read reporting data without database access. In the platform this
      is an API client with the analytics read scope calling the report run, result and export operations, plus
      webhook or SFTP subscriptions for pushed data. The thing to get right: credentials are managed where every
      other API client is, not on this screen.

      '
    outputs:
    - element: consumers
      rule: API clients that hold the analytics read scope - name, environment (sandbox or production), status,
        key expiry.
      source: contracts/satellite/public-api.yaml#ApiClient | contracts/satellite/reporting.yaml#listReports | MATRIX
        13.3.14
    - element: pushed deliveries
      rule: Subscriptions whose route is webhook or SFTP, with their report and format.
      source: contracts/satellite/reporting.yaml#listReportSubscriptions
    edgeCases:
    - case: A consumer asks for another tenant's data
      expected: Impossible by construction; the tenant comes from the credential, never from a parameter.
      source: MATRIX 6.1.78
    consistency:
    - with: BO-1073
      note: API Access & OAuth owns client creation, scopes and key rotation; this screen links there.
    sampleData:
      consumers:
      - name: Aquaventure finance ERP
        environment: Production
        scope: Analytics read
        status: Active
        keyExpires: 14 Sep 2027
      pushes:
      - report: Daily closing - Aquaventure
        route: SFTP
        format: CSV
        destination: sftp.erp.aquaventure.ae
    corrections:
    - what: The screen reads subscriptions but describes API client configuration (API name, consumer, authentication,
        allowed sites, allowed fields, rate limit, status)
      why: API clients are the public-API client model; allowed sites and fields per consumer have no field anywhere
        (scope comes from the credential's principal).
      source: contracts/satellite/public-api.yaml#ApiClient | screens/P16-venue-analytics.yaml#ANL-046
    - what: The gap says no write operation
      why: True, and correct for this screen; writes belong to the API client screens.
      source: contracts/satellite/public-api.yaml#createApiClient
  ANL-048:
    summary: 'Monitors scheduled runs and deliveries and helps an administrator act on failures without server logs.
      The thing to get right: failure reasons in plain words, retries visible, and personal-data deliveries flagged;
      the pack''s six actions have no operation yet.

      '
    inputs:
    - field: failedOnly, from
      rule: Defaults to failed in the last 24 hours.
      source: contracts/satellite/reporting.yaml#listReportDeliveries
    outputs:
    - element: delivery row
      rule: 'Report, route, attempted at, recipients count, status (Delivered, Failed, Retrying, Not sent), reason
        in words, retries so far, Personal data badge. Failed first, then Retrying.

        '
      source: contracts/satellite/reporting.yaml#ReportDelivery
    - element: schedule health
      rule: Schedules with consecutive failures, with the last run status and next run.
      source: contracts/satellite/reporting.yaml#ReportSchedule
    edgeCases:
    - case: Status suppressed
      expected: Shown as "Not sent - report was empty" when the schedule skips empty reports (see decisions).
      source: contracts/satellite/reporting.yaml#ReportDelivery | contracts/satellite/reporting.yaml#CreateReportScheduleRequest
    consistency:
    - with: ANL-041
      note: Failure counters link here with the same filter.
    sampleData:
    - report: Daily closing - Aquaventure
      route: Email
      attempted: 01 Oct 2026 07:00
      recipients: 2
      status: Failed
      reason: Mailbox full - finance@aquaventure.ae
      retries: 2
      personalData: false
    - report: Guest arrivals - VIP
      route: Email
      attempted: 01 Oct 2026 06:00
      recipients: 1
      status: Delivered
      personalData: true
    - report: Weekly F&B sales
      route: SFTP
      attempted: 01 Oct 2026 06:30
      status: Retrying
      reason: SFTP login rejected
      retries: 1
    corrections:
    - what: Retry, Cancel, View Error, Change Destination, Notify Owner and Escalate, and the Cancel confirmation
        overlay
      why: No delivery action exists; the only reads are the delivery list and the schedule list.
      source: screens/P16-venue-analytics.yaml#ANL-048 | contracts/satellite/reporting.yaml#listReportDeliveries
    - what: Job ID, Schedule, Start and Completion columns
      why: A delivery carries its subscription, report, one attempted time and counts, not a job id, a schedule
        or start and end times.
      source: contracts/satellite/reporting.yaml#ReportDelivery
    decisions:
    - question: What does a suppressed delivery mean, and how many retries happen before Failed?
      decision: 'Drawn default accepted: Suppressed = empty report skipped; three retries.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-348 | CHG-NOTE-003
      reviewable: true
      questionSource: contracts/satellite/reporting.yaml#ReportDelivery
  ANL-049:
    summary: 'Reconstructs who did what with reports: created, changed, published, ran, viewed, exported, shared,
      scheduled, subscribed, changed permissions, archived. It is a read-only trail, newest first, that nobody can
      edit, and reading it is itself recorded. The thing to get right: it reads the platform audit trail, not the
      delivery list, and personal-data exports stand out.

      '
    inputs:
    - field: filters
      rule: Person, report (the thing acted on), action, date range, venue. Business unit, export type and status
        have no filter.
      source: contracts/spine/tenancy.yaml#listAuditRecords
    outputs:
    - element: event row
      rule: 'When (venue time), who, what in words ("Exported Guest arrivals - VIP to Excel, with personal data,
        purpose given"), on what, where (venue, workstation). Actions by TICVAI support staff carry a "TICVAI support"
        badge.

        '
      source: contracts/spine/tenancy.yaml#AuditRecord | R098
    - element: personal-data events
      rule: Exports and deliveries with personal data are highlighted and filterable on their own.
      source: contracts/satellite/reporting.yaml#exportReportResult | contracts/satellite/reporting.yaml#ReportDelivery
    edgeCases:
    - case: Auditor opens the trail
      expected: Their reading is recorded too; say so in the header ("Your access to this trail is recorded").
      source: contracts/spine/tenancy.yaml#listAuditRecords
    consistency:
    - with: BO-068
      note: Same audit row layout as the back-office audit log.
    - with: ANL-045
      note: Same personal-data badge and purpose text.
    sampleData:
    - when: 01 Oct 2026 09:02
      who: Omar Haddad
      action: Exported to Excel with personal data
      subject: Guest arrivals - VIP
      where: Aquaventure Waterpark
      purpose: Concierge welcome calls
    - when: 30 Sep 2026 17:20
      who: Rahul Menon
      action: Published version 4
      subject: Sales by channel (copy)
    - when: 30 Sep 2026 11:03
      who: Support - Sara K.
      action: Viewed schedule
      subject: Daily closing - Aquaventure
      badge: TICVAI support
    corrections:
    - what: The screen reads the delivery list
      why: The reporting audit trail is the platform audit read (who, where, action, subject, when), gated by audit
        permission; deliveries cover only what was sent.
      source: contracts/spine/tenancy.yaml#listAuditRecords | contracts/satellite/reporting.yaml#listReportDeliveries
    - what: Pattern configEditor with 14 select fields (Report Created ... Report Deleted)
      why: These are event types to filter by in a read-only list, not settings.
      source: screens/P16-venue-analytics.yaml#ANL-049
    - what: Action names are free strings "as the writing operation names it"
      why: Without a fixed list the human labels above cannot be mapped reliably.
      source: contracts/spine/tenancy.yaml#AuditRecord
  ANL-051:
    summary: 'The landing for AI analytics: the prioritised list of what the models noticed — anomalies, trends,
      opportunities, forecast deviations — across the domains the user may see, each leading to "why" (root cause),
      "what to do" (recommendations) or "evidence". The one thing to get right: an insight is a prompt for a person,
      with its evidence and its reliability, never an automatic action.

      '
    outputs:
    - element: insight list
      rule: 'Sorted by priority (Critical, High, Medium, Low) then newest; each card shows kind (Anomaly, Trend,
        Opportunity, Forecast deviation), the metric, observed vs expected, scope and detected time, and its status
        (New, Reviewed, Accepted, Rejected, Actioned, Measured).

        '
      source: contracts/satellite/ai.yaml#/components/schemas/AiInsight | contracts/satellite/reporting.yaml#/components/schemas/AnalyticsAnomaly
    - element: evidence
      rule: Each figure in a narrative links to its evidence; evidence is labelled Source, Derived or Model-inferred.
      source: contracts/satellite/ai.yaml#/components/schemas/AiEvidenceItem
    - element: maturity
      rule: Detectors in their first weeks show "Limited historical data" on their insights.
      source: contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    actions:
    - action: Why did this change?
      result: Opens root-cause analysis with metric, period and comparison carried.
      source: screens/P16-venue-analytics.yaml#ANL-056
    - action: What should we do?
      result: Opens recommendations filtered to the insight.
      source: screens/P16-venue-analytics.yaml#ANL-058
    edgeCases:
    - case: New tenant, no history
      expected: '"Insights appear once your venue has a few weeks of trading" — not an empty table.'
      source: DI-280 | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    - case: A finance user in phase one
      expected: No AI panels on finance reporting; revenue anomalies are still shown on the analytics side.
