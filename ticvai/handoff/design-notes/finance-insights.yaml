  ANL-056:
    summary: 'Root-cause explorer: from a KPI change ("net revenue down 14% on Tuesday") to the contributing factors
      — which channels, products, venues or hours moved it, and by how much. The client calls it one of the most
      important AI capabilities. The one thing to get right: the breakdown is arithmetic over governed metrics;
      the AI only words it, and the screen says "contributing factors", never "causes".

      '
    inputs:
    - field: metric and period
      rule: Metric from the governed KPI list; period as a date range; comparison Previous period (default), Same
        period last year, or Forecast.
      source: contracts/satellite/ai.yaml#explainMetricChange
    - field: dimensions
      rule: Channel, product, venue, hour (user may choose up to the dimensions the metric carries).
      source: contracts/satellite/ai.yaml#explainMetricChange | MATRIX 8.4.18 | MATRIX 8.7.28
    outputs:
    - element: change header
      rule: '"Net revenue −AED 61,240.00 (−14.2%) vs previous Tuesday" with "Data as of" and reliability word.'
      source: contracts/satellite/ai.yaml#/components/schemas/AiMetricChangeExplanation
    - element: drivers
      rule: 'Bar of contributions sorted by absolute size, negatives left in red, positives right; each driver links
        to its evidence. Decomposition tree and waterfall cannot bind yet.

        '
      source: contracts/satellite/ai.yaml#/components/schemas/AiMetricChangeExplanation | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - element: narrative
      rule: Two or three sentences whose figures all come from the drivers; labelled "Contributing factors".
      source: contracts/satellite/ai.yaml#explainMetricChange
    actions:
    - action: Keep this analysis
      result: Saved as a root-cause insight visible in insight history.
      source: contracts/satellite/ai.yaml#explainMetricChange
    - action: Ask a follow-up
      result: Opens the assistant with the metric and period carried.
      source: contracts/satellite/reporting.yaml#askReportingQuestion
    edgeCases:
    - case: The change is within normal variation
      expected: '"No single factor stands out" with the drivers still listed, reliability "Partly answered".'
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingAnswerReliability
    - case: The comparison period predates the venue's history
      expected: '"Not enough history for this comparison".'
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingUnavailableReason
    consistency:
    - with: ANL-019
      note: AI Management Insights' "possible reasons" opens this screen; same driver bars.
    sampleData:
      header: Net revenue Tue 29 Sep −AED 61,240.00 (−14.2%) vs Tue 22 Sep · Aquaventure
      drivers:
      - Channel OTA −AED 38,900.00
      - Product Wave Pool Cabana −AED 14,200.00
      - Hour 15:00–17:00 −AED 9,800.00 (rain)
      - Channel Web +AED 1,660.00
      reliability: Grounded · data as of 30 Sep 06:00
    corrections:
    - what: The derived primary action is askReportingQuestion; explainMetricChange is listed as an action but no
        control is drawn for it.
      why: The act this screen exists for is "explain this change".
      source: screens/P16-venue-analytics.yaml#ANL-056 | contracts/satellite/ai.yaml#explainMetricChange
    - what: The comparison options differ from the KPI read (forecast here; target and benchmark there).
      why: A user arriving from a KPI tile compared "vs target" cannot carry that comparison into the explanation.
      source: contracts/satellite/ai.yaml#explainMetricChange | contracts/satellite/reporting.yaml#getKpiValues
  ANL-058:
    summary: 'Recommendations and next-best actions: insights turned into prioritised, explained and measurable
      recommendations for management, each with expected impact and evidence. The one thing to get right: a recommendation
      never acts — Review, Simulate or "Open in …" takes the person to the owning module to make the change, and
      every recommendation''s effect is measured afterwards.

      '
    outputs:
    - element: recommendation card
      rule: 'Domain (Revenue, Production, Operations, Pricing, Menu), what to do, expected impact as a range ("AED
        4,200 – 6,800 a month"), basis and maturity, evidence; sorted by priority then impact.

        '
      source: MATRIX 8.6.19 | MATRIX 8.3.68 | MATRIX 8.6.21 | MATRIX 3.6.37 | contracts/satellite/ai.yaml#/components/schemas/AiInsight
        | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    - element: lifecycle
      rule: New → Reviewed → Accepted / Rejected → Actioned → Measured, with the measured effect once known.
      source: contracts/satellite/ai.yaml#/components/schemas/AiInsight
    actions:
    - action: Accept / Reject
      result: Records the decision; a rejection asks for a reason (the false-alarm signal). Accepting does not change
        anything in trading.
      source: contracts/satellite/ai.yaml#listAiInsights | DI-719
    - action: Open in pricing / F&B / inventory
      result: Opens the owning module with a draft prepared; the change is made and approved there.
      source: contracts/satellite/ai.yaml#/components/schemas/Suggestion | MATRIX 11.1.37 | MATRIX 3.6.37
    edgeCases:
    - case: A recommendation touches an approval request
      expected: Not produced — AI does not recommend approving or rejecting requests.
      source: DI-735
    - case: Starting maturity
      expected: '"Limited historical data" on each card; impact range wider.'
      source: contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    consistency:
    - with: ANL-009
      note: Recommendations here are insights (decided via the insight lifecycle); proposals on ANL-009 are approval-gated
        actions. Different words — "Accept" vs "Approve".
    - with: ADM-236
      note: Pricing next-best actions are shown in P09; the same impact format.
    sampleData:
      recommendations:
      - High · Pricing · Raise Fast Pass at Motiongate from AED 75.00 to AED 85.00 on Fri–Sat · expected AED 4,200
        – 6,800 a month
      - Medium · Production · Prepare 120 fewer burger portions on Thu at Central Kitchen · expected waste saving
        AED 540 – 820
      - Medium · Revenue · Launch a member offer for inactive annual pass holders · expected AED 18,000 – 31,000
    corrections:
    - what: The table is implied by listNextBestAction, which the screen does not declare.
      why: listNextBestAction is a promotions read gated by price-view permission and bound to ADM-236; the screen's
        declared reads are listAnalyticsAnomalies and listAiInsights.
      source: screens/P16-venue-analytics.yaml#ANL-058 | contracts/satellite/promotions.yaml#listNextBestAction
    - what: Accept / reject is not declared (decideAiInsight).
      why: The lifecycle and measured effect need the insight decision operation.
      source: contracts/satellite/ai.yaml#listAiInsights
    - what: The client asks for a confidence percentage and a single AED impact per recommendation.
      why: The contract shows impact as a range and forbids a bare percentage; the client should be told why.
      source: MATRIX 8.6.19 | MATRIX 8.3.68 | MATRIX 8.6.21 | MATRIX 3.6.37 | contracts/satellite/ai.yaml#/components/schemas/AiInsight
    decisions:
    - question: What is the impact shape (amount, unit, basis, period) used to rank and total recommendations?
      decision: 'Drawn default accepted: A range on a named metric per month.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-350 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.6.21 | MATRIX 3.6.37
  ANL-061:
    summary: 'The analytics administrator''s one view of platform health: data freshness, failed refreshes, usage,
      KPIs in force, open alerts. The thing to get right: freshness first, because a revenue figure that stopped
      updating at nine this morning looks exactly like a low number; and counters with no source (data quality score,
      BI service health, AI analytics health) are drawn as pending, not invented.

      '
