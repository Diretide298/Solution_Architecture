    consistency:
    - with: ANL-019
      note: AI Management Insights shows the same insights inside Board 1; one card component, same priority words.
    - with: ANL-018
      note: Alerts (thresholds someone set) and anomalies (departures from the series) are different; keep separate
        lists and words.
    sampleData:
      insights:
      - High · Anomaly · Net revenue at Beach Kiosk 38% below expected (AED 6,210.00 vs AED 10,050.00) · 29 Sep
      - Medium · Opportunity · Fast Pass sells out by 11:00 on Fridays at Motiongate
      - Low · Trend · Average basket at Coffee House up 6% over 4 weeks
    corrections:
    - what: The only read is listAnalyticsAnomalies; the insight layer (listAiInsights) is not declared.
      why: Trends, opportunities, forecast deviations and the insight lifecycle live in ai.listAiInsights; anomalies
        alone cannot fill a command centre.
      source: screens/P16-venue-analytics.yaml#ANL-051 | contracts/satellite/ai.yaml#listAiInsights
    - what: Three severity vocabularies meet here (anomaly low/medium/high, insight priority low–critical, alert
        info/warning/critical).
      why: One screen must not show three scales; map anomaly severity onto insight priority for display.
      source: contracts/satellite/reporting.yaml#/components/schemas/AnomalySeverity | contracts/satellite/ai.yaml#/components/schemas/AiInsight
    - what: A 20-column unbound table and "Carries the create action" in emptyFirstRun.
      why: Nothing is created here; the content is a card list.
      source: screens/P16-venue-analytics.yaml#ANL-051
  ANL-052:
    summary: 'Ask TICVAI: a business user asks in plain English or Arabic and gets a governed answer — the number,
      how it was worked out, how far it can be relied on, and suggested follow-ups — without knowing report names
      or fields. The one thing to get right: when the question lacks a timeframe, venue or metric, the assistant
      asks a clarifying question instead of guessing, and every answer is limited to what the user''s role may see.

      '
    inputs:
    - field: question
      rule: 3–1,000 characters; Arabic input renders right-to-left; conversation context is kept for follow-ups.
      source: contracts/satellite/reporting.yaml#askReportingQuestion | DI-019 | DI-964
    - field: venue
      rule: Optional narrowing; omitted answers over everything the user's scope permits, never beyond.
      source: contracts/satellite/reporting.yaml#askReportingQuestion
    outputs:
    - element: answer card
      rule: 'Answer sentence, a small result table or chart, "What I understood" (interpretation), "Data as of",
        and a reliability word: Grounded / Partly answered / Sources disagree / Not enough evidence.

        '
      source: contracts/satellite/reporting.yaml#/components/schemas/NaturalLanguageAnswer | contracts/satellite/reporting.yaml#/components/schemas/ReportingAnswerReliability
    - element: how it was calculated
      rule: Metric, dimensions, filters and period in words; the query itself behind "Show query" for finance users
        who want to check.
      source: contracts/satellite/reporting.yaml#/components/schemas/GeneratedQuery | contracts/satellite/reporting.yaml#askReportingQuestion
    - element: not available yet
      rule: Names the missing part (metric, breakdown, filter, comparison, or period before history starts) and
        says the data owner has been told.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingUnavailableReason
    - element: citations
      rule: Document-based parts name the policy or document; numbers only from the query result.
      source: DI-964 | contracts/satellite/reporting.yaml#askReportingQuestion
    actions:
    - action: Save as report
      result: Saves the latest answer in the conversation as a report definition (name required); offered only to
        users who manage reports.
      source: contracts/satellite/reporting.yaml#saveNaturalLanguageQuery
    - action: Did you mean…
      result: When the question cannot be interpreted, up to three close questions are offered as chips.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportQuestionProblem
    edgeCases:
    - case: '"Show me the top 10 products" (no period)'
      expected: The assistant asks "For which period — yesterday, last week, this month?" with chips; nothing is
        run until answered.
      source: DI-712
    - case: A question about a metric outside the user's role
      expected: Answered as "not available", without revealing that the metric exists.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingUnavailableReason | DI-964
    consistency:
    - with: ANL-009
      note: Same answer card and reliability words.
    - with: ANL-054
      note: Saving an answer here and generating a report on ANL-054 produce the same kind of report definition.
    sampleData:
      question: What was yesterday's net revenue at Aquaventure by channel?
      understood: Net revenue · by channel · Tue 29 Sep 2026 · Aquaventure Waterpark
      answer: AED 1,104,220.40 — Web AED 498,300.00, POS AED 352,910.40, OTA AED 201,010.00, Kiosk AED 52,000.00
      reliability: Grounded · data as of 30 Sep 06:00
      clarifying: 'Q: Show me the top 10 products → A: For which period: yesterday, last week or this month?'
      arabic: ما هو صافي الإيرادات أمس؟
    corrections:
    - what: The answer contract has no clarifying-question shape.
      why: DI-712 (agreed) requires the AI to ask when timeframe, venue or metric is missing; askReportingQuestion
        returns only an answer, a 400 with suggestions, or "insufficient evidence".
      source: DI-712 | contracts/satellite/reporting.yaml#/components/schemas/NaturalLanguageAnswer | TRACKER Actions
        row 258
    - what: The screen has no content region and no answer state is drawn.
      why: The gap stands; the answer card above is the content.
      source: screens/P16-venue-analytics.yaml#ANL-052
  ANL-053:
    summary: 'AI-generated dashboard studio: a user describes a dashboard ("a weekly sales board for F&B outlets")
      and gets a draft of tiles to review, adjust and save. The one thing to get right: the draft obeys the same
      rules as a hand-built dashboard — certified measures only, marks that can bind, at most 24 tiles, refresh
      no faster than 30 seconds, a module, and approval before it is published to others.

      '
    inputs:
    - field: request
      rule: Plain-language description; the AI asks back when audience, period or measures are missing.
      source: DI-712
    - field: module
      rule: Required; only modules the user may author for are offered ("Core" when it belongs to none).
      source: contracts/satellite/reporting.yaml#/components/schemas/CreateDashboardRequest | contracts/satellite/reporting.yaml#/components/schemas/CommandCentre
    outputs:
    - element: draft preview
      rule: 'Live preview of the proposed tiles with real data, each tile showing its measure, mark and refresh;
        tiles whose mark cannot bind yet (combo, scatter, waterfall, treemap, funnel, map, ribbon, matrix, decomposition
        tree) are not proposed.

        '
      source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile | MATRIX 7.4.45 | MATRIX 11.1.2
    actions:
    - action: Save dashboard
      result: Saves as a private dashboard; sharing goes through the approval step. Refused for a module the user
        may not author (409) with that reason.
      source: contracts/satellite/reporting.yaml#createDashboard | DI-706
    edgeCases:
    - case: The request implies more than 24 tiles
      expected: The AI proposes 24 and lists what it left out.
      source: contracts/satellite/reporting.yaml#/components/schemas/CreateDashboardRequest
    - case: The request asks for "live every second"
      expected: Tiles set to 30 seconds, with a note.
      source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    consistency:
    - with: ANL-022
      note: Output lands in the same structure as the dashboard creation wizard; the user can continue there.
    sampleData:
      request: Weekly F&B sales board for the Aquaventure outlets
      draft:
      - Net revenue this week · number · vs last week
      - Net revenue by outlet · bar
      - Orders by hour × day · heatmap
      - Top 10 products · table
    corrections:
    - what: No operation generates a dashboard draft from a request; only createDashboard (which persists) is declared.
      why: The screen's purpose cannot be met; the gap note already says the write is missing.
      source: screens/P16-venue-analytics.yaml#ANL-053 | contracts/satellite/reporting.yaml#createDashboard
    - what: Approval before publishing (DI-706) has no operation — no publish, approve or version operation on dashboards,
        only create / update / delete and isShared.
      why: A generated dashboard can be shared without the agreed approval step.
      source: DI-706 | contracts/satellite/reporting.yaml#/components/schemas/Dashboard | contracts/satellite/reporting.yaml#updateDashboard
    decisions:
    - question: Until an approval operation exists, may a generated dashboard be shared at all?
      decision: 'Drawn default accepted: Save private only; the share control is shown disabled with "Needs approval".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-349 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-706
  ANL-054:
    summary: 'AI report generator: a user describes a report ("weekly refunds by venue and reason") and gets a report
      built on the same semantic model, permissions and calculations as a hand-built one, to preview, save and schedule.
      The one thing to get right: the user sees the dimensions and measures the AI chose and can correct them before
      saving, and a missing period or measure is asked for, not guessed.

      '
    outputs:
    - element: interpretation
      rule: '"You asked", Dimensions, Measures, Filters, Period shown as editable chips before the preview runs.'
