        8.9.4
    - element: outlet performance table
      rule: 'Columns Outlet, Net revenue (AED), Orders, Average order value (AED), Margin %, Service level %, Availability,
        with a Total / Average row; sorted by Net revenue. A performance-score column and its Excellent / Good /
        At risk band appear only once the score is defined.

        '
      source: MATRIX 4.5.25 | MATRIX 8.7.1
    - element: hourly heatmap
