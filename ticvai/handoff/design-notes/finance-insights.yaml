      source: contracts/satellite/reporting.yaml#setAlertRule
    edgeCases:
    - case: A refused card payment for goods already handed over
      expected: Flag as money at risk with the amount; resolution choices explain the ledger effect.
      source: contracts/spine/orders.yaml#/components/schemas/SyncRejection
    - case: Month end is closing with refused entries open
      expected: Show "Open shifts or unresolved entries block the close" with a link to BO-090.
      source: F13 step 1
