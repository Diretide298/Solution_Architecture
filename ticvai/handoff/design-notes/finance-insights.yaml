      source: contracts/satellite/reporting.yaml#AnalyticsPipeline | screens/P16-venue-analytics.yaml#ANL-061
    - what: Active Alerts tile with no alert read declared
      why: Alerts exist (list of current alerts) but the screen does not call it.
