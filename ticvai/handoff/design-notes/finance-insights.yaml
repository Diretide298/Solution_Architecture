  ANL-062:
    summary: 'The authoritative catalogue of KPIs: one definition, referenced everywhere, so "revenue" means the
      same thing on every dashboard. Each KPI has a business name, a formula written against the semantic model
      (never SQL), a unit, a direction, an owner and a default period. The thing to get right: finance labels -
      Gross sales, Net revenue, Recognised and Deferred revenue are different measures - and today the only seeded
      money KPI is Takings.

      '
