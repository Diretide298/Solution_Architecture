process: finance-insights
title: Finance, Ledger & Tax · Reporting & Analytics
owner: finance-insights process agent, 1 October 2026
processSummary: 'Finance and insights run underneath every sale. A sale at a till (P04), kiosk, web storefront (P01)
  or guest app (P02) is priced and taxed per line at the moment of sale, recorded in the venue''s base currency
  (AED in the UAE; 2 decimals, or 3 for BHD, KWD and OMR, never rounded away), and posted to an append-only
  dual ledger through account mappings per money event; anything unmapped lands in suspense. Tax follows the jurisdiction''s
  tax profile: inclusive or exclusive, compound where a tax applies on another, zero-rated or exempt with verified
  evidence, and computed on the discounted price by default or on the price before discount where the region requires
  it (Egypt). A guest may select a currency the venue charges and pay in it: the rate is locked on the order, the
  payment partner is asked in that currency, the ledger keeps the base amount with the rate, and a refund goes back
  in the currency paid (decided 2 October 2026, Chinmay); a currency shown but not charged is an approximate price.
  Foreign cash at a till is recorded at its base equivalent and change is given in base currency. A paid order can carry a VAT receipt (simplified tax invoice),
  a full tax invoice with the buyer''s TRN, or a consolidated invoice for a company, each numbered without gaps
  and never edited; corrections are credit memos. Revenue is recognised by rule: POS-style immediate, tickets on
  the visit, gift cards and wallet on use, annual passes straight-line or per visit, breakage on expiry; deferred
  revenue is a balance that ages. Each venue''s day is reconciled (POS cash, gateways, bank, wallet against the
  ledger, provider files matched automatically, only genuine mismatches to a person); chargebacks are defended against
  the bank''s deadline; month end runs seven close checks and goes to a finance approver. Nothing posted is deleted:
  a correction is a reversal, an approver is never the preparer, and ledger approval needs a second factor. Back-office
  finance lives in Venue Management (P08: chart of accounts, mapping, FX, journals, recognition, reconciliation,
  period close, chargebacks); tax profiles, calculation validation and platform reconciliation in the TICVAI Console
  (P09); partner settlement in P10. Reporting is one consolidated, permission-based area (Analytics, P16): seeded
  standard dashboards and reports plus no-code builders over a governed business catalogue; the P08 report screens,
  the POS terminal day view and the kitchen performance view are scoped windows onto the same definitions and must
  show the same numbers. Every figure is read from a lag-tolerant reporting copy and shows its "as of" time; scope
  comes from the person''s rights, never from a filter; AI explains and recommends but never acts, answers only
  within the person''s role, labels forecasts, and is phase two for finance ledgers.'
