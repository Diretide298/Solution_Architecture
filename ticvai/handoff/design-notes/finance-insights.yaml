        other. Every headline money tile on this board is unbound until these KPIs are defined.

        '
      source: contracts/satellite/reporting.yaml#/components/schemas/MetricSource | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
        | contracts/satellite/reporting.yaml#getKpiValues | MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards,
