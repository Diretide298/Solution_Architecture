    - field: code, name, description, domain
      rule: Code is system-facing and never shown; the name is the label every tile uses. Domain is the grouping
        (Executive, Sales, Finance, Operations, Access, Customer, Membership, Loyalty, Marketing, F&B, Retail, Inventory,
        Resources).
      source: contracts/satellite/reporting.yaml#KpiDefinition
    - field: formula
      rule: Built from semantic-model measures with a formula editor that offers only catalogue names; no free SQL.
      source: contracts/satellite/reporting.yaml#KpiDefinition | MATRIX 8.7.11 | MATRIX 6.1.78
    - field: unit, higherIsBetter
      rule: Currency, count, percentage, duration, ratio, score. Higher-is-better decides whether Warning means
        below or above target.
      source: contracts/satellite/reporting.yaml#KpiDefinition
    outputs:
    - element: KPI row
      rule: Name, domain, unit, direction arrow, owner, default period, Active/Inactive, Standard badge for seeded
        KPIs, and a "Used on 7 dashboards" count where known.
      source: contracts/satellite/reporting.yaml#KpiDefinition | contracts/satellite/reporting.yaml#ReportingSystemKpi
    - element: definition panel
      rule: Formula in words, source, owner and a worked example ("Net revenue = Gross sales - Discounts - Refunds,
        per finance policy").
      source: MATRIX 8.7.21
    actions:
    - action: Add KPI
      result: Creates the definition tenant-wide.
      source: contracts/satellite/reporting.yaml#createKpi
    edgeCases:
    - case: Someone defines a second "Net revenue"
      expected: Warn on duplicate names and point to the existing KPI; the model must hold one Net revenue across
        POS, B2C, B2B and OTA.
      source: MATRIX 8.7.21
    consistency:
    - with: ANL-025
      note: The lead's KPI builder creates the same definition; this is the library view.
    - with: ANL-066
      note: Formulas name catalogue measures exactly as the catalogue spells them.
    sampleData:
    - name: Takings
      domain: Finance
      unit: Currency
      direction: up
      standard: true
      definition: Payments taken in the period less refunds
      example: AED 418,230.50 today
    - name: Admissions
      domain: Access
      unit: Count
      direction: up
      standard: true
      example: 6,214 today
    - name: Capacity utilisation
      domain: Operations
      unit: Percentage
      direction: down
      owner: Omar Haddad
    - name: Net revenue (proposed)
      domain: Finance
      unit: Currency
      owner: Fatima Al Mansoori
      status: Awaiting formula
    corrections:
    - what: No finance measures exist to build finance KPIs from
      why: The closed metric list has no gross sales, net revenue, refunds, refund rate, tax or average ticket value;
        the only seeded money KPI is Takings. Finance tile formulas are an open decision.
      source: contracts/satellite/reporting.yaml#MetricSource | contracts/satellite/reporting.yaml#ReportingSystemKpi
        | MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities
    - what: Takings is described both as "gross value of payments" and as "payments less refunds"
      why: Less refunds is not gross; a tile labelled from either description would mislead, and neither is Net
        revenue.
      source: contracts/satellite/reporting.yaml#getKpiValues | contracts/satellite/reporting.yaml#ReportingSystemKpi
        | R283
    - what: No edit, deactivate or delete for a KPI, and no KPI status beyond active
      why: Only list and create exist; the pack's KPI Status (draft, certified, deprecated) and a deprecation workflow
        have no field or operation.
      source: contracts/satellite/reporting.yaml#listKpis | contracts/satellite/reporting.yaml#createKpi | MATRIX
        13.1.32
    - what: The 14 "columns" are domain values
      why: Executive ... Resources are values of the KPI's domain, a filter, not columns.
      source: screens/P16-venue-analytics.yaml#ANL-062
    decisions:
    - question: Which finance KPIs ship (gross sales, net revenue, recognised and deferred revenue, refunds) and with what
        formulas?
      decision: Finance KPIs seeded with formulas.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-351 | CHG-FIN-007 | CHG-NOTE-003
      questionSource: MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities | DI-260
  ANL-063:
    summary: 'Central targets and scorecards: set targets per scope and period, and see every KPI against target
      with variance, direction and status. The thing to get right: targets exist for organisation, region and venue
      scopes and for a period - not per product or channel - and a stale value is marked as stale, never shown as
      a confident status.

      '
