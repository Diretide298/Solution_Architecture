    corrections:
    - what: The screen does not declare getKpiValues, yet every headline tile needs target, variance, status and
        asOf/stale, which only that read returns.
      why: getDashboard returns report results per tile with no target or status; the exec tiles cannot show bands
        or "vs target" without the KPI read.
      source: contracts/satellite/reporting.yaml#getKpiValues | screens/P16-venue-analytics.yaml#ANL-001
    - what: The alert filters are raw text fields "Workstation id", "Shift id", "Item id" on an executive screen.
      why: They expose identifiers (spec leak) and are till/replenishment filters; an executive filters alerts by
        severity and status only.
      source: screens/P16-venue-analytics.yaml#ANL-001 | contracts/satellite/reporting.yaml#listAlerts
    - what: The "Request suggestion" modal asks the user for kind, subjectRef, horizon and context.
      why: An executive cannot pick an internal suggestion kind; the request must be pre-scoped from the tile or
        alert it is launched from.
      source: screens/P16-venue-analytics.yaml#ANL-001 | contracts/satellite/ai.yaml#requestSuggestion
    - what: emptyNoResults says "last week and last month are the useful defaults, not today".
      why: The client's executive boards are explicitly "today vs forecast / vs yesterday"; the default period for
        this board is Today.
