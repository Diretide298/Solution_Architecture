  ANL-005:
    summary: 'Cost, margin and profitability for F&B and retail managers: food cost %, gross margin %, and a bridge
      from gross sales to contribution margin, plus promotion and pricing margin erosion. It answers the packs''
      "Food Cost, Margin & Profitability" and "Promotion, Pricing & Margin" frames. The one thing to get right:
      every stage of the bridge is a named, ordered measure in base currency, excluding VAT, reconcilable to the
      P&L.

      '
    outputs:
    - element: margin bridge
      rule: 'Ordered stages: Gross sales → Discounts → Refunds → Net revenue → Food cost → Waste → Contribution
        margin, with the margin % at the end. The client draws it as a waterfall; until waterfall binds, draw a
        bar with signed values in that fixed order and the running total labelled.

        '
      source: MATRIX 4.1.16 | MATRIX 8.7.28 | MATRIX 6.1.47 | MATRIX 6.1.67 | MATRIX 8.7.25 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - element: KPI cards
      rule: Food cost % and Gross margin % against forecast in percentage points (pp), not percent change.
      source: MATRIX 4.6.36 | MATRIX 8.7.1 | MATRIX 4.1.16
    - element: stock valuation
      rule: Stock value by location and category at the period end, labelled "Stock on hand (value)" — a balance,
        not a cost of the period.
      source: contracts/satellite/inventory.yaml#getStockValuation
    - element: promotion margin
      rule: Per promotion, net revenue, discount cost and margin % before/after; erosion shown in pp.
      source: screens/P16-venue-analytics.yaml#ANL-005
    edgeCases:
    - case: An Egypt venue where VAT is levied on the pre-discount price
      expected: 'The bridge uses the tax actually charged (EGP 100 ticket, 20% off, paid EGP 80, VAT on EGP 100),
        so net revenue excl. VAT is lower than the discounted price suggests; the screen never recomputes VAT from
        the shown price.

        '
      source: DI-598 | contracts/spine/catalogue.yaml#/components/schemas/TaxProfile
    - case: A Bahrain venue
      expected: All bridge values to 3 decimals (BHD 1,204.375); the third decimal is never rounded away in totals.
      source: DI-306 | DI-598
    - case: Waste recorded after the period closed
      expected: The figure lands in the open period by reversal/adjustment (a closed period is locked), and the
        bridge notes "Includes a prior-period adjustment"; nothing is silently edited.
      source: DI-263 | contracts/spine/finance.yaml#getFinancialReport
    consistency:
    - with: ANL-004
      note: Same margin % per item.
    - with: BO-1081
      note: Net revenue and cost of sales must reconcile to the finance P&L (revenue per category less cost of sales).
    sampleData:
      venue: Aquaventure Waterpark — F&B (AED)
