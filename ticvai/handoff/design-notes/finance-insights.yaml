        | contracts/satellite/reporting.yaml#listKpis | contracts/satellite/reporting.yaml#getAnalyticsUsage
    - element: headline counters (pending)
      rule: Data refresh success % over a period (only each pipeline's latest state is known), data quality score,
        BI service health, AI analytics health; active reports (no count). Greyed, "Not yet available".
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline
    - element: component health list
      rule: 'One row per pipeline and its datasets, worded with the pipeline statuses, worst first, each with "Updated
        38 min ago - expected every 15 min". The pack''s Healthy / Warning / Critical / Offline maps to Healthy
        / Degraded or Stale / Failed / Paused.

        '
      source: contracts/satellite/reporting.yaml#AnalyticsPipeline | screens/P16-venue-analytics.yaml#ANL-061
    - element: why a KPI is failing
      rule: KPIs in Critical link to their explanation (AI explains why a metric moved and suggests actions); AI
        never decides approvals.
      source: DI-720 | DI-719 | DI-735
    consistency:
    - with: ANL-067
      note: Same pipeline rows and status words.
    - with: ANL-041
      note: Same counter style as the reporting governance board.
