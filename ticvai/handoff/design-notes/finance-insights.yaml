      rule: Waste % (vs yesterday), Stock on hand (value, AED), Items below par, Batches expiring in 7 days.
      source: MATRIX 6.1.38 | MATRIX 8.7.1 | contracts/satellite/inventory.yaml#getStockValuation | MATRIX 4.4.17
        | MATRIX 8.9.4
    - element: expiring batches
      rule: Sorted by expiry date ascending, then by value at risk descending; expiry shown in the venue's time
        zone with "in 2 days".
      source: contracts/satellite/inventory.yaml#listExpiringBatches
    - element: count variance
      rule: Counted vs expected per item with variance in units and value; variance before posting is the discrepancy
        report and is labelled "Not yet posted".
      source: MATRIX 6.1.21 | contracts/satellite/inventory.yaml#getCountVariance
    - element: waste-risk suggestions
      rule: 'Items at risk with quantity and a recommended action (reduce prep, promote, transfer, use in a recipe),
        with the "Based on" line and maturity badge; buttons open the owning module, never apply.

        '
      source: MATRIX 4.1.19 | MATRIX 4.8.15 | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    edgeCases:
    - case: A venue in its first weeks
      expected: Waste-risk shows the "Starting" badge and "Limited historical data", not an empty panel and not
        a confident figure.
      source: contracts/satellite/ai.yaml#/components/schemas/AiMaturity | DI-280
    - case: A batch already expired but still on hand
      expected: Shown at the top in Critical style with "Expired 1 day ago".
      source: designer default
    consistency:
    - with: ANL-004
      note: Reached from Product Performance with the product carried (F82 step 3→4).
    - with: BO-058
      note: Continues to Reporting Home to schedule the report (F82 step 4→5).
    sampleData:
      venue: Aquaventure Waterpark — Central Kitchen (AED)
      cards: Waste 3.8% (+0.6 pp vs yesterday) · Stock on hand AED 412,580.00 · 14 items below par · 9 batches expiring
        in 7 days
      batches:
      - Chicken breast, batch CK-2209 · 42 kg · expires Thu 01 Oct · AED 1,134.00 at risk
      - Brioche buns, batch BK-0930 · 600 units · expires Fri 02 Oct · AED 720.00 at risk
      suggestion: 'Reduce burger prep by 120 portions on Thu (forecast 410, stock 530) · Based on: venue profile,
        UAE calendar, weather, 23 days of your sales'
    corrections:
    - what: The states say "this reads and writes nothing" but the screen offers a waste-risk suggestion request.
      why: The request writes an ai.suggestion row; the state text should say trading is unaffected, not that nothing
        is written.
      source: screens/P16-venue-analytics.yaml#ANL-006 | contracts/satellite/ai.yaml#requestSuggestion
    - what: Theoretical vs actual usage has no declared read.
      why: The notes call it "the whole analysis" but only expiring batches and count variance are bound; consumption
        against recipe needs a report over stock movements and production.
      source: screens/P16-venue-analytics.yaml#ANL-006
  ANL-007:
    summary: 'Guest and conversion intelligence for a commercial or CRM manager: how visits convert to purchases,
      where carts are abandoned, basket size, and which guest segments buy what. The one thing to get right: there
      are two conversion measures — web visit-to-purchase (from web analytics) and checkout conversion (paid orders
      over checkout sessions) — and they must never share one label.

      '
    outputs:
    - element: conversion
      rule: '"Visit-to-purchase conversion" (site visits to completed purchase, from the web analytics integration)
        and "Checkout conversion" (completed paid orders over checkout sessions) as separate tiles, each stating
        its source; "Cart abandonment" beside them.

        '
      source: DI-700 | MoM 2026-09-08 4.2 Command Center Overview (Board 1) | MATRIX 1.1.40 | MATRIX 6.1.66 | contracts/satellite/reporting.yaml#/components/schemas/MetricSource
    - element: funnel
      rule: Visits → cart → checkout → payment → tickets issued; funnel cannot bind yet, so draw a horizontal bar
        of stage counts with the step conversion % between bars.
      source: MATRIX 1.1.40 | MATRIX 6.1.66 | MATRIX 8.7.1 | MATRIX 8.7.2 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - element: segments
      rule: Segment list shows size and reachable count only (aggregates); no guest names on this screen.
      source: contracts/satellite/marketing-crm.yaml#previewSegment | MATRIX 8.3.73
    actions:
    - action: Save as segment
      result: 'Saves the current filter as a dynamic segment (a definition, resolved at send time). Offered only
        to users holding the CRM segment permission; hidden otherwise.

        '
      source: MATRIX 22.14.1 | MATRIX 5.4.24 | DI-387
    edgeCases:
    - case: The web analytics integration is not connected
      expected: Visit-to-purchase tiles show "Web analytics not connected" with a link for an admin; checkout conversion
        still shows.
      source: MoM 2026-09-08 4.2 Command Center Overview (Board 1)
    consistency:
    - with: ANL-017
      note: ANL-007 owns purchase behaviour (conversion, basket, segments' buying); ANL-017 owns membership, loyalty
        and retention. Same segment names on both.
    - with: ANL-016
      note: Conversion and basket size also appear on the Sales & Channel scorecard; same definitions and labels.
    sampleData:
      venue: Aquaventure Waterpark — Web (AED)
      period: Last 7 days
      tiles: Visit-to-purchase 3.4% · Checkout conversion 61.2% · Cart abandonment 38.8% · Average basket AED 486.30
      funnel: Visits 182,400 → Cart 21,950 → Checkout 10,140 → Paid 6,206 → Tickets issued 6,198
      segment: Families with annual pass, Dubai · 4,812 guests · 4,120 reachable by email
    corrections:
    - what: The notes say the screen answers "Kitchen, Service & Fulfilment Performance".
      why: No kitchen, service-time or fulfilment operation is declared; that board belongs with kitchen performance,
        not guest conversion.
      source: screens/P16-venue-analytics.yaml#ANL-007
    - what: The states say "this reads and writes nothing" while the screen offers Create segment.
      why: createSegment writes a CRM record; the state text is wrong and the action needs the CRM permission check.
      source: screens/P16-venue-analytics.yaml#ANL-007 | contracts/satellite/marketing-crm.yaml#createSegment
    - what: No conversion or basket read is declared — only segment operations.
      why: The tiles need getKpiValues (conversion is a MetricSource) or a report; listSegments alone draws none
        of them.
      source: contracts/satellite/reporting.yaml#getKpiValues
    decisions:
    - question: Which stages count in the funnel, and is "visits" sourced from web analytics?
      decision: 'Drawn default accepted: Five stages as drawn, visits labelled "from web analytics".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-316 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.1 | MATRIX 8.7.2
  ANL-008:
    summary: 'Demand forecasting for operations, F&B and retail planners: expected attendance, demand and revenue
      by day, hour, channel or product, as a range, so someone orders, staffs or prepares differently. The one thing
      to get right: every projected figure is labelled Forecast, shown as a range (p10–p90) with its basis and maturity,
      and an honest "limited history" state — the forecast is never presented as fact or as a bare percentage.

      '
    inputs:
    - field: forecast for
      rule: 'Selector of published forecast definitions in plain words (Attendance, Ticket demand by time slot,
        F&B demand, Retail demand, Revenue); with horizon (Next 7 days default) and grain (day / hour).

        '
      source: contracts/satellite/ai.yaml#getForecast | MATRIX 8.2.1 | MATRIX 4.1.17 | MATRIX 8.2.29
    - field: breakdown
      rule: Venue, attraction, channel, product or time slot, one at a time.
      source: MATRIX 8.2.2 | MATRIX 8.2.3 | MATRIX 8.2.5 | MATRIX 8.2.13
    outputs:
    - element: forecast chart
      rule: 'Line of the median (p50) with a shaded p10–p90 band, actuals solid up to today and forecast dashed
        after; legend "Forecast (likely range)". No confidence percentage.

        '
      source: MATRIX 8.2.17 | contracts/satellite/ai.yaml#/components/schemas/AiForecastPoint | DI-973 | MATRIX
        8.2.29 | MATRIX 8.2.33
    - element: basis and maturity
      rule: 'A stage badge (Starting / Learning / Established / Learned) and the "Based on" line on every forecast;
        "Limited historical data" while the starting pattern carries most of the weight.

        '
      source: contracts/satellite/ai.yaml#/components/schemas/AiMaturity | contracts/satellite/ai.yaml#/components/schemas/SuggestionBasis
    - element: pace and remaining opportunity
      rule: Per channel, sales to date (actual), forecast for the period and remaining opportunity (forecast minus
        actual), all labelled.
      source: DI-750
    - element: drivers
      rule: The top drivers of the forecast in words (e.g. "UAE school holiday", "Weekend"), largest first.
      source: contracts/satellite/ai.yaml#/components/schemas/AiForecastPoint
    actions:
    - action: Plan from this forecast
      result: Opens the replenishment or staffing screen with the forecast carried; nothing is ordered or rostered
        from here.
      source: MATRIX 15.4.1 | MATRIX 15.4.2 | contracts/satellite/ai.yaml#/components/schemas/Suggestion
    - action: Ask a question
      result: Opens the assistant pre-scoped to this forecast; hidden until the assistant is enabled for the tenant.
      source: contracts/satellite/reporting.yaml#askReportingQuestion
    edgeCases:
    - case: No forecast version has been published for the definition
      expected: '"No forecast published yet" with what is needed (a definition and its first nightly run) — not
        a zero line.'
      source: contracts/satellite/ai.yaml#getForecast | DI-280
    - case: The last publication is more than 36 hours old
      expected: Stale banner "Forecast last published Mon 28 Sep 02:00 — may be out of date"; numbers stay visible.
      source: contracts/satellite/ai.yaml#getForecast
    - case: A user with report permission but without AI use
      expected: The forecast area shows "Forecasts need AI access" rather than an empty chart.
      source: contracts/satellite/ai.yaml#getForecast
    consistency:
    - with: ANL-057
      note: ANL-057 is the forecasting studio (definitions, scenarios, accuracy); ANL-008 is the read-only planner
        view. Same band style and labels.
    - with: ADM-505
      note: Revenue forecast figures must match the P09 revenue forecast for the same definition and version.
    sampleData:
      venue: Aquaventure Waterpark (AED)
      forecastFor: Attendance, next 7 days, by day
      points:
      - Thu 01 Oct · Forecast 8,900 (likely 8,100 – 9,650)
      - 'Fri 02 Oct · Forecast 12,400 (likely 11,200 – 13,500) · driver: Weekend'
      - Sat 03 Oct · Forecast 13,100 (likely 11,800 – 14,300)
      maturity: 'Learning · Based on: your venue profile, UAE calendar, weather, 54 days of your sales'
      pace: Web · sold 41,200 · forecast 58,000 · remaining opportunity 16,800
    corrections:
    - what: getForecast requires a definition key, but the screen has no selector or entry parameter for it.
      why: Without it the forecast cannot be read at all.
      source: contracts/satellite/ai.yaml#getForecast | screens/P16-venue-analytics.yaml#ANL-008
    - what: The primary button is "Ask reporting question".
      why: The screen exists to read a forecast; asking is secondary, and the label is a spec phrase. Use "Ask a
        question" as a secondary action.
      source: screens/P16-venue-analytics.yaml#ANL-008
    - what: Client frames ask for a "confidence percentage" on the demand forecast.
      why: The contract and design 5.6 forbid a bare percentage — a range and a maturity stage are shown instead;
        the client should be told.
      source: MATRIX 8.2.29 | MATRIX 8.2.33 | contracts/satellite/ai.yaml#/components/schemas/AiForecastPoint
    decisions:
    - question: DI-280 says data-dependent forecasting cannot be delivered in phase one; the 29 Sep design ships a baseline-first
        forecast with maturity stages. Which applies to this screen?
      decision: Baseline-first forecast with maturity stages.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-317 | CHG-NOTE-003
      questionSource: DI-280 | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
  ANL-009:
    summary: 'The assistant and action centre for managers: ask a business question in plain words, see what is
      raised, acknowledge alerts, and approve or reject what the assistant has proposed. It collapses five client
      board screens. The one thing to get right: answers stay inside the user''s role and show how they were calculated,
      and nothing the assistant proposes happens until a person with the right authority approves it.

      '
    inputs:
    - field: question
      rule: '3–1,000 characters, English or Arabic; follow-ups keep the conversation ("compare that to this week").
        When timeframe, venue or metric is missing, the assistant asks instead of guessing.

        '
      source: contracts/satellite/reporting.yaml#askReportingQuestion | DI-964 | DI-712 | DI-019
    - field: acknowledgement note
      rule: Optional, up to 300 characters, prompted as "What is being done about it?".
      source: contracts/satellite/reporting.yaml#/components/schemas/Alert
    - field: rejection reason
      rule: Asked when rejecting a proposal.
      source: contracts/satellite/ai.yaml#decideProposedAction
    outputs:
    - element: answer
      rule: 'The answer, then "How this was worked out" (metric, filters, period in words; the query behind a disclosure),
        "Data as of 14:32", and a reliability label in words — Grounded, Partly answered, Sources disagree, Not
        enough evidence. Never a percentage.

        '
      source: contracts/satellite/reporting.yaml#/components/schemas/NaturalLanguageAnswer | contracts/satellite/reporting.yaml#/components/schemas/ReportingAnswerReliability
    - element: citations
      rule: When an answer draws on a policy or document, the document is named and linked; numbers never come from
        a document.
      source: DI-964 | contracts/satellite/reporting.yaml#askReportingQuestion
    - element: proposals queue
      rule: 'Users with approval rights see every open proposal at their scope; others see only their own. Each
        shows what it would change, its approval level, who proposed it and when it expires.

        '
      source: contracts/satellite/ai.yaml#listProposedActions
    actions:
    - action: Approve / Reject a proposal
      result: 'Offered only where the rule allows (own level-1 proposal; level 2 or someone else''s needs approval
        rights; never one''s own level 2); hidden otherwise. Refusals show the named rule in words; an expired or
        already decided proposal shows "Already decided" (409).

        '
      source: contracts/satellite/ai.yaml#decideProposedAction
    - action: Acknowledge alert
      result: Records who saw it and the note; the alert stays until its metric returns to range.
      source: contracts/satellite/reporting.yaml#acknowledgeAlert | contracts/satellite/reporting.yaml#/components/schemas/Alert
    edgeCases:
    - case: A cashier asks for yesterday's total revenue
      expected: The assistant answers only within the cashier's scope; a metric they may not see is answered "not
        available", without revealing it exists.
      source: DI-964 | contracts/satellite/reporting.yaml#askReportingQuestion
    - case: The question is outside what is modelled
      expected: '"This isn''t available yet" naming the missing part; the gap is logged for the data owner; no improvised
        figure.'
      source: contracts/satellite/reporting.yaml#askReportingQuestion
    - case: A proposal relates to an approval request (refund, discount)
      expected: The assistant shows turnaround and bottleneck analytics only; it never recommends approve or reject.
      source: DI-735
    consistency:
    - with: ANL-052
      note: Same answer card, reliability words and "How this was worked out" disclosure as Ask TICVAI.
    - with: ANL-018
      note: Alert severity labels (Info / Warning / Critical) identical to the alert centre.
    sampleData:
      venue: Dubai Parks — Motiongate (AED)
      question: What was yesterday's net revenue by channel?
      answer: 'Net revenue on Tue 29 Sep was AED 386,410.50: Web AED 201,300.00, OTA AED 98,214.50, POS AED 86,896.00.'
      howWorkedOut: Net revenue · by channel · 29 Sep 2026 · Motiongate · data as of 30 Sep 06:00 · Grounded
      followUps:
      - Compare that to last Tuesday
      - Which OTA partner sold most?
      proposal: Raise Fast Pass price from AED 75.00 to AED 85.00 for Fri–Sat · level 2 · proposed by Omar Haddad
        · expires 02 Oct 18:00
    corrections:
    - what: '"Save alert rule" opens a form requiring id, scopePath, metric, comparator, isActive and more.'
      why: An id and a scope path are spec leaks; alert-rule authoring belongs to the alert/KPI configuration screens,
        not the assistant.
      source: screens/P16-venue-analytics.yaml#ANL-009 | contracts/satellite/reporting.yaml#setAlertRule
    - what: The screen lists every order (listOrders, 10 columns).
      why: A full order list has no role on an assistant screen and exposes guest data; orders are reached by drill-through
        from an answer.
      source: screens/P16-venue-analytics.yaml#ANL-009 | MATRIX 8.3.73
    - what: Alert filters "Workstation id", "Shift id", "Item id" are free-text ids.
      why: Spec leak; use severity and status filters.
      source: screens/P16-venue-analytics.yaml#ANL-009
    decisions:
    - question: DI-278 makes AI-assisted finance reporting phase two. Should finance-ledger questions (deferred revenue, journals)
        be refused in phase one?
      decision: 'Drawn default stands (answer: "From ADM-068: AI finance reporting in phase two; ledger questions answer ''not
        available yet''"): Answer sales and attendance questions; finance-ledger metrics answer "not available yet".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-318 | CHG-NOTE-003
      questionSource: DI-278
  ANL-012:
    summary: 'The operations control room: what is happening right now across every venue the user may see — people
      on site, entries and exits, occupancy, gate status, active tills, queues, incidents and device exceptions.
      It implements the client''s Operations Control Room board and DI-699, and must stay legible on a wall display.
      The one thing to get right: freshness — every tile says how old it is, and a stalled feed is shown as stale,
      not as a low number.

      '
    inputs:
    - field: venue
      rule: All venues in scope by default (multi-tenant/multi-venue grid); one venue on a wall display preset.
      source: DI-699
    outputs:
    - element: people on site
      rule: 'On site = entries minus exits today; Occupancy % = on site over configured capacity; Capacity remaining
        = capacity minus on site. Bands Normal below 80%, Warning from 80%, Critical from 95%.

        '
      source: MATRIX 3.2.65 | MATRIX 8.2.36 | MATRIX 1.1.40 | DI-704 | DI-698
    - element: gate status
      rule: Status grid per gate — Open, Closed, Offline — with counts; Offline sorts first and is red with an icon
        and text.
      source: DI-699 | MATRIX 8.7.33 | MATRIX 8.9.1
    - element: live sales
      rule: Gross sales today and per venue, plus Active POS terminals; same Gross sales definition as the executive
        board.
      source: DI-699
    - element: queues and incidents
      rule: Current wait per queue (minutes), open incidents and device exceptions as counts that drill through.
      source: MATRIX 8.9.1 | MATRIX 16.4.18 | contracts/satellite/reporting.yaml#/components/schemas/MetricSource
    - element: freshness
      rule: '"Updated 40 sec ago" per tile; refresh no faster than every 30 seconds; stale warning past the dataset
        threshold.'
      source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile | MATRIX 8.7.22 | DI-711
    actions:
    - action: open a gate, occupancy or device tile
      result: Drill-through to the live access, occupancy or device screen with the venue carried; incidents open
        the alert centre.
      source: MATRIX 2.12.1 | MATRIX 16.9.58 | MATRIX 8.9.10 | MATRIX 8.7.28
    - action: Presentation mode
      result: Full screen, large type, simplified controls, auto-refresh; for the control-room wall.
      source: MATRIX 8.7.23
    edgeCases:
    - case: A venue does not scan exits
      expected: On site and visit duration show "Exit scanning not configured" instead of treating entries as people
        on site.
      source: MATRIX 3.2.65
    - case: Occupancy is between 90% and 95%
      expected: Warning (amber); DI-704's example leaves this band undefined, the 80/95 rule applies.
      source: MATRIX 8.2.36 | MATRIX 1.1.40 | DI-704
    - case: The replica lags by minutes during a spike
      expected: Tiles keep their last values with the stale warning; nothing reads the live transactional database.
      source: MoM 2026-09-08 4.6 Real-Time Reporting Architecture | DI-711
    consistency:
    - with: ANL-014
      note: ANL-012 is today and now; ANL-014 is history and trends of the same counts with the same definitions.
    - with: BO-224
      note: Gate status words and colours identical to Live Access Operations.
    sampleData:
      asOf: Updated 35 sec ago · 14:32
      venues:
      - Aquaventure Waterpark · on site 7,140 of 10,000 (71.4%, Normal) · entries 8,876 · exits 1,736 · gates 11
        open, 1 offline
      - Dubai Parks — Motiongate · on site 12,050 of 14,000 (86.1%, Warning) · entries 13,402 · exits 1,352
      - House of Wisdom, Sharjah · on site 640 of 1,200 (53.3%) · gates 3 open
      queues: Slither's Slides 35 min · Poseidon's Revenge 20 min
      incidents: 2 open · 1 device exception (Kiosk 4 printer)
    corrections:
    - what: Gate status, active gates, active POS terminals, queues and device exceptions have no declared source.
      why: The screen reads only getKpiValues (seeded takings and admissions) and listAlerts; gate and occupancy
        sources exist in access (listLiveAccess, listLiveVenueOccupancy), devices in tenancy (listDevices), queues
        in queue (getWaitTimes).
      source: screens/P16-venue-analytics.yaml#ANL-012 | contracts/spine/access.yaml#listLiveAccess | contracts/spine/access.yaml#listLiveVenueOccupancy
        | contracts/satellite/queue.yaml#getWaitTimes
    - what: The states describe "the live operations list" with "Carries the create action".
      why: A live dashboard has no list and nothing to create; first run is "No live data yet — gates and tills
        will appear once they report".
      source: screens/P16-venue-analytics.yaml#ANL-012
    - what: The Operations preset bookmark (today, all venues, live) is absent.
      why: The client asks for it for the control room; the screen should open in it.
      source: MATRIX 6.1.78
    - what: '"Map or venue layout" is asked for on this board.'
      why: The map mark cannot bind yet; use the gate status grid meanwhile.
      source: MATRIX 8.7.33 | MATRIX 8.9.1 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    decisions:
    - question: What is the stale threshold for live tiles (60 s, 2 min)?
      decision: 'Drawn default accepted: Stale after 2 minutes without a refresh.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-319 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-711
  ANL-013:
    summary: 'Revenue pulse: intraday revenue tempo with its comparisons and breakdowns, drillable from consolidated
      revenue to site, business unit, channel, product and transaction. The one thing to get right: every "Revenue"
      tile the pack draws is relabelled with its real measure — this is an operational sales view (Gross sales /
      Net revenue), not recognised revenue — and breakdowns are charts, not single-number tiles.

      '
    inputs:
    - field: comparison
      rule: Yesterday, Same day last week, Same period last year, Target — one at a time beside the headline.
      source: screens/P16-venue-analytics.yaml#ANL-013 | contracts/satellite/reporting.yaml#getKpiValues
    outputs:
    - element: headline
      rule: '"Net revenue today" and "Net revenue this hour" as number marks with sparkline; Gross sales shown beneath
        in smaller type.'
      source: MATRIX 5.12.6 | MATRIX 8.7.21
    - element: breakdowns
      rule: 'By site, attraction, product, business unit: sorted bar (top 10 + Other). By channel: donut with at
        most six slices plus Other. By payment method: donut labelled "Takings by payment method" (payments, not
        sales).

        '
      source: MATRIX 8.7.4 | MATRIX 8.7.1 | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
    - element: hourly tempo
      rule: Line of net revenue per hour today against the comparison day's curve (dashed), venue time zone.
      source: MATRIX 8.7.4 | MATRIX 8.7.8 | MATRIX 8.7.25
    actions:
    - action: drill
      result: Consolidated → site → business unit → channel → product → transaction, each level only where a real
        hierarchy exists; transaction detail respects the viewer's permissions.
      source: DI-709 | screens/P16-venue-analytics.yaml#ANL-013
    edgeCases:
    - case: Tenant spans AED and BHD venues
      expected: Consolidated revenue is shown per base currency; never summed across currencies.
      source: contracts/shared/common.yaml#/components/schemas/Money
    - case: Today is a partial day being compared to a full day
      expected: '"vs yesterday" compares to yesterday up to the same time, labelled "to 14:32".'
      source: designer default
    consistency:
    - with: ANL-001
      note: Same Net revenue and Gross sales numbers as the executive tiles at the same moment; ANL-013 is their
        drill target.
    - with: ANL-016
      note: Channel split here must equal ANL-016's for the same period.
    sampleData:
      venue: All venues in scope (AED)
      headline: Net revenue today AED 2,904,180.25 (vs same day last week AED 2,711,930.00, +7.1%) · this hour AED
        312,450.00
      bySite: Aquaventure AED 1,169,690.00 · Motiongate AED 1,402,300.25 · House of Wisdom AED 332,190.00
      byChannel: Web 44% · POS 27% · OTA 18% · B2B 7% · Kiosk 4%
      byPayment: Card AED 1,986,400.00 · Cash AED 402,115.50 · Wallet AED 210,300.00
    corrections:
    - what: Twelve tiles are labelled bare "Revenue ...".
      why: Gross sales, net revenue and recognised revenue are different measures and must never share a label.
      source: MATRIX 5.12.6
      status: fixed
      by: CHG-FIN-002
    - what: '"Revenue by Site / Attraction / Product / Channel / Business Unit / Payment Method" are drawn as single
        metric tiles.'
      why: They are breakdowns; draw them as bar or donut marks.
      source: screens/P16-venue-analytics.yaml#ANL-013 | MATRIX 8.7.4
    - what: '"Revenue vs Same Day Last Week" has no comparison in the KPI read.'
      why: compareTo offers previousPeriod, samePeriodLastYear, target and benchmark only; same weekday last week
        needs a value or a period convention.
      source: contracts/satellite/reporting.yaml#getKpiValues
    - what: No revenue KPI is seeded; only "takings" (payments less refunds).
      why: Binding the revenue tiles to takings would show cash received as revenue; Gross sales and Net revenue
        KPIs must be defined.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi | MoM 2026-08-12 14. Finance
        Module Walkthrough — Dashboards, Chart of Accounts & Entities
    decisions:
    - question: What is a "business unit" in the drill path — department, a tenancy scope node, or a cost centre?
      decision: 'Drawn default accepted: Treat business unit as department.'
