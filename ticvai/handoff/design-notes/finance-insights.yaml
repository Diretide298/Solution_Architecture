    consistency:
    - with: ANL-002
      note: ANL-016 owns the channel scorecard; ANL-002 the product-by-channel detail and recognition. Same definitions.
    - with: PTR-002
      note: Partner commission must match the partner's own dashboard for the same period.
    sampleData:
      venue: All venues in scope (AED)
