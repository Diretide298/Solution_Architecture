vocabulary:
- term: Base currency
  meaning: The venue's region currency; the currency every record and ledger posting is in. A guest may pay in a
    currency they select (where the venue charges it); the books still hold the base amount and the rate.
  avoid:
  - Home currency
  - Local price
  - Default currency
  source: DI-211 | DI-282 | contracts/spine/orders.yaml#/components/schemas/Order
- term: Pay in USD (a currency the venue charges)
  meaning: The guest's selected payment currency; the card is charged in it at the rate locked on the order, and
    refunds go back in it.
  avoid:
  - Converted price
  - Approx. (for a charged currency)
  source: contracts/spine/orders.yaml#checkoutCart | contracts/spine/finance.yaml#listFxRates
- term: ≈ (approx.) price in USD / SAR / …
  meaning: A conversion of a base-currency price for a currency the venue shows but does not charge, always next to
    the base price.
  avoid:
  - Converted price
  - USD price
  source: DI-211 | screens/P02-guest-mobile-app.yaml#GST-044
- term: Takings
  meaning: Money received in the period less refunds (cash-basis); the seeded KPI on hubs.
  avoid:
  - Revenue
  - Sales
  - Income
  source: contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi | R283
- term: Gross sales
  meaning: Issued sales before discounts and refunds; whether tax is included must be stated on the tile.
  avoid:
  - Revenue
  - Turnover
  source: MATRIX 6.1.78
- term: Net revenue
  meaning: Gross sales less discounts less refunds, adjusted per finance policy.
  avoid:
  - Net sales
  - Revenue
  - Income
  source: MATRIX 6.1.78
- term: Recognised revenue / Deferred revenue
  meaning: Earned under the recognition rules / paid for but not yet earned. Kept distinct from sales.
  avoid:
  - Realised revenue
  - Unearned income
  - Wallet revenue
  source: MATRIX 5.12.6 | DI-260 | contracts/spine/finance.yaml#getDeferredRevenue
- term: VAT receipt
  meaning: The simplified tax invoice issued on a paid order.
  avoid:
  - Receipt (when it is a tax document)
  - Bill
  source: contracts/spine/finance.yaml#issueTaxInvoice
- term: Tax invoice / Combined tax invoice
  meaning: A full invoice with the buyer's details / one invoice for several paid orders of one buyer.
  avoid:
  - Bill
  - Statement
  source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceType
- term: Credit memo
  meaning: The document that corrects an issued invoice after a refund; the invoice itself is never edited.
  avoid:
  - Credit note (until the client's tax adviser chooses "Tax credit note")
  - Edit invoice
  source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoice
- term: VAT (or the jurisdiction's tax name)
  meaning: Use the tax profile's own name on every surface; "Tax" only where several kinds are summed.
  avoid:
  - GST in UAE
  - Service charge for a tax
  source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
- term: Price before discount
  meaning: The taxable base where the jurisdiction taxes the undiscounted price.
  avoid:
  - Gross price
  - List tax
  source: DI-598
- term: Post / Reverse
  meaning: A journal reaches the ledger when approved and posted; a correction is a reversal, never an edit or delete.
  avoid:
  - Edit entry
  - Delete entry
  - Undo
  source: contracts/spine/finance.yaml#reverseJournalEntry
- term: Period (Open / Closing / Closed)
  meaning: A fiscal period's state; closing stops postings, closed locks them.
  avoid:
  - Month locked
  - Frozen
  source: contracts/spine/finance.yaml#/components/schemas/PeriodStatus
- term: Variance (Over / Short)
  meaning: The difference between expected and counted or recorded, always saying between which two figures.
  avoid:
  - Discrepancy
  - Error
  - Loss
  source: DI-275 | contracts/spine/finance.yaml#/components/schemas/UnifiedReconciliation
- term: Settlement / Exception / Resolve
  meaning: A provider's file for a day / a line that did not match / the recorded explanation.
  avoid:
  - Payout file
  - Error
  - Close
  source: contracts/spine/finance.yaml#/components/schemas/SettlementException
- term: Chargeback
  meaning: A bank-initiated reversal with an evidence deadline; not a refund.
  avoid:
  - Dispute refund
  - Reversal
  source: contracts/spine/orders.yaml#/components/schemas/Chargeback
- term: Report / Dashboard / Tile / KPI
  meaning: A runnable, exportable, schedulable definition / a page of tiles / one visual bound to a report / a company-wide
    measure defined once.
  avoid:
  - Widget (outside the builder's library)
  - Board (for a user-facing dashboard)
  source: contracts/satellite/reporting.yaml#/components/schemas/DashboardTile | contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition
- term: Warning / Critical
  meaning: KPI status bands set by a target's amber and red thresholds; always words plus colour.
  avoid:
  - Amber
  - Red (alone)
  - Bad
  source: contracts/satellite/reporting.yaml#/components/schemas/KpiTarget
- term: As of HH:MM / Updated N sec ago
  meaning: The freshness of every figure read from the reporting copy; stale shows a warning.
  avoid:
  - Live (unless refreshed)
  - Real-time
  source: MATRIX 8.7.22
- term: Forecast
  meaning: Any projected figure, with its range; never shown as a fact.
  avoid:
  - Expected
  - Will be
  source: DI-973
- term: Outlet / Workstation (till)
  meaning: A sales point / the device; staff copy may say "till" for the workstation.
  avoid:
  - Store
  - POS (in copy)
  - Drawer (for the device)
  source: R156
- term: Channel
  meaning: POS, Web, App, Kiosk, B2B, OTA, from one closed list.
  avoid:
  - Source
  - Platform
  source: MoM 2026-08-18 4.2 Recipes, Operating Hours & Service Channels | MATRIX 1.4.7
screens:
  WEB-035:
    summary: 'An overseas guest picks their currency before booking. Where the venue charges that currency the
      guest pays in it: the rate is locked at checkout, the card is charged in that currency, refunds come back in
      it, and the venue''s books stay in AED with the rate recorded (decided 2 October 2026, Chinmay). Where the
      venue only shows a currency, prices in it are approximate and the guest pays in AED. The one thing to get
      right: the guest always knows which currency the card will be charged in, and an approximate figure never
      looks like a charge.'
    inputs:
    - field: Currency (the only guest control)
      rule: Options are the currencies this venue shows; the region sets the rates and the venue picks which appear
        and which of them a guest can pay in (`chargeable`). Base currency first, then in the order returned. The
        choice changes every displayed price (DI-1071) and, for a chargeable currency, becomes the payment currency
        sent at checkout (`chargeCurrency`); for a shown-only currency it stays a display preference.
      source: contracts/spine/finance.yaml#listFxRates | contracts/spine/orders.yaml#checkoutCart | R120 | DI-1071 | DI-211
    - field: Venue
      rule: Not a guest control. The venue is the one the guest already picked on the home screen and is sent silently.
        Remove the venue picker from the drawing.
      source: screens/P01-guest-web-storefront.yaml#WEB-035
    - field: As at / Purpose
      rule: 'Not guest controls. "As at" is always now. "Purpose" is always the guest-facing rate (tender: "what
        a guest pays at"). Interbank, reporting, revaluation and inter-entity rates are internal treasury figures
        a guest must never see.'
      source: contracts/spine/finance.yaml#ingestFxRates | contracts/spine/finance.yaml#/components/schemas/FxRatePurpose
    outputs:
    - element: Converted price
      rule: Shown as "≈ USD 81.42" under or beside "AED 299.00". Computed as base price ÷ the rate, rounded to the
        shown currency's own decimals (2 for USD/GBP/SAR/INR, 3 for KWD/BHD/OMR). Never larger or bolder than the
        AED price.
      source: DI-211 | DI-306 | DI-598 | contracts/spine/finance.yaml#/components/schemas/FxRateValue
    - element: Rate line
      rule: '"1 USD = 3.6725 AED · updated 06:00 today". Use the time the rate was fetched where the provider supplied
        it, otherwise the time it took effect. A rate more than a day old shows its date, not "today".'
      source: DI-1074 | contracts/spine/finance.yaml#/components/schemas/FxRate
    - element: '"You pay in" statement'
      rule: 'In the body next to the selector, never a footnote. Chargeable currency: "You pay in USD. Refunds go back
        in USD." Shown-only currency: "Prices in EUR are a guide. You pay in AED."'
      source: contracts/spine/orders.yaml#/components/schemas/Refund | contracts/spine/finance.yaml#listFxRates
    - element: Products
      rule: Photo, name and the "from" price in AED with its approximate conversion. Show none of the rate table's
        internal columns (who set it, provider reference, the rate note, which can state the venue's margin over
        market).
      source: contracts/spine/finance.yaml#/components/schemas/FxRate | DI-026
    actions:
    - action: Change currency
      result: Re-renders every price instantly from the rates already loaded. Nothing is saved to the server and
        nothing is added to the order.
      source: contracts/spine/finance.yaml#listFxRates
    - action: Book (any product)
      result: The selected currency carries through the cart to checkout. A chargeable currency is locked at checkout
        and charged; a shown-only currency stays approximate and checkout charges AED.
      source: contracts/spine/orders.yaml#checkoutCart | contracts/spine/orders.yaml#/components/schemas/Order | DI-211
    edgeCases:
    - case: The venue shows no other currency
      expected: The entry point to this screen is not offered and no selector is drawn. Never an empty table titled
        "No multi-currency pricing yet".
      source: contracts/spine/finance.yaml#listFxRates | screens/P01-guest-web-storefront.yaml#WEB-035
    - case: Offline or the rates could not be refreshed
      expected: Keep the last rates with their age ("Rates from 06:00, may have changed"). An undated rate is never
        shown.
      source: screens/P01-guest-web-storefront.yaml#WEB-035
    - case: The provider feed failed this morning
      expected: The previous rate is still in force; show its date plainly. The platform refuses a feed that cannot
        be reached rather than reusing a stale rate silently, so the date is the warning.
      source: contracts/spine/finance.yaml#ingestFxRates
    - case: Arabic (right-to-left)
      expected: Layout mirrors; currency codes and figures stay left-to-right inside the line ("AED 299.00").
      source: DI-019
    consistency:
    - with: GST-044
      note: Same component, rules and wording on web and app (one product, two renderings). Web is wave 1 and app
        wave 2 until the client aligns them (REV3 GAP-D2).
    - with: WEB-012
      note: Checkout shows the total in the selected chargeable currency with the AED amount and the locked rate
        beneath; for a shown-only currency it shows AED with the approximate figure under it.
    - with: POS-005
      note: The till applies the same display rule for foreign-currency guests and records the base equivalent (DI-213).
    sampleData:
      venue: Aquaventure Waterpark, Dubai (base AED, 2 decimals)
      currencies:
      - AED
      - USD
      - SAR
      - GBP
      - INR
      rates:
      - 1 USD = 3.6725 AED · updated 06:00 today
      - 1 SAR = 0.9793 AED
      - 1 GBP = 4.6610 AED
      - 1 INR = 0.0440 AED
      products:
      - Day Pass Adult · AED 299.00 · ≈ USD 81.42 · ≈ SAR 305.32
      - Day Pass Child · AED 249.00 · ≈ USD 67.80
      - Cabana for 4 · AED 1,250.00 · ≈ GBP 268.18
      threeDecimalExample: 'A Kuwait-facing venue showing KWD: AED 299.00 ≈ KWD 25.032'
    corrections:
    - what: Venue, As at and Purpose are drawn as guest controls.
      why: 'They are fixed parameters: venue from the home screen, as-at now, purpose tender. A purpose picker would
        let a guest browse internal treasury rates.'
      source: screens/P01-guest-web-storefront.yaml#WEB-035 | contracts/spine/finance.yaml#/components/schemas/FxRatePurpose
      status: fixed
      by: CHG-FIN-001
    - what: The rate table and detail panel bind every FX rate field.
      why: Fields such as the manual-rate note (which may state the margin over market), the person who set it and
        the provider reference are internal. The guest needs currency, rate and time only.
      source: contracts/spine/finance.yaml#/components/schemas/FxRate | R127
      status: fixed
      by: CHG-FIN-001
    - what: The empty first-run state ("No multi-currency pricing yet… offers no create action").
      why: For a guest this situation means the venue shows no other currency; the screen should not be reachable
        then.
      source: screens/P01-guest-web-storefront.yaml#WEB-035
      status: fixed
      by: CHG-FIN-001
    decisions:
    - question: Is gateway-level currency conversion (the guest is charged in their own currency) in scope?
      decision: The guest selects the currency and is charged in it.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-092 | CHG-FIN-001 | CHG-NOTE-003
      questionSource: MoM 2026-08-10 4.7 Account Creation, Localisation & Multi-Currency | DI-211
    - question: Which wave do web and app multi-currency ship in together?
      decision: Web and app multi-currency are built now.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-093 | CHG-FIN-001 | CHG-NOTE-003
      questionSource: screens/P01-guest-web-storefront.yaml#WEB-035
  GST-019:
    summary: 'The signed-in guest''s own orders at this venue, with the tax documents that belong to them: the VAT
      receipt (simplified tax invoice), a full tax invoice on request with a company name and TRN, and any credit
      memo issued after a refund. From here the guest transfers tickets or asks for a refund. The one thing to get
      right: the list is the caller''s own and nothing on it can show anyone else''s order; there are no staff filters
      on this screen.'
    inputs:
    - field: Request a full tax invoice (form)
      rule: 'Offered only on a paid order that has no full invoice yet. Fields: company or person name (required),
        address, country, tax registration number (optional; only where the buyer is VAT-registered), email to send
        it to (prefilled with the guest''s email). Language is limited to the template''s languages; default is
        the bilingual English and Arabic layout.'
      source: contracts/spine/finance.yaml#/components/schemas/FinIssueTaxInvoiceRequest | contracts/spine/finance.yaml#issueTaxInvoice
    - field: Tax registration number
      rule: Free text up to 30 characters, validated as the legal entity's country requires. The field set follows UAE law
        (CHG-FIN-011); the client's tax adviser confirms only the Arabic titles.
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceRecipient | contracts/spine/finance.yaml#issueTaxInvoice
        | decided 2 October 2026 by Chinmay (CHG-NOTE-003)
    outputs:
    - element: Order list
      rule: 'Newest first. Each row: visit date, venue, order number, total in AED, status (Paid, Partly refunded,
        Refunded) and a small document badge ("Tax invoice"). Where the guest paid in another currency, the amount
        paid in it shows under the AED total.'
      source: contracts/spine/orders.yaml#listMyOrders | DI-211
    - element: Tax document detail
      rule: 'Invoice number (e.g. SINV-2026-000123), type in words (VAT receipt / Tax invoice / Combined tax invoice), supplier
        name and TRN, issue and supply date, lines with VAT rate, a VAT summary per rate, and net, VAT and total. A document
        is never edited: corrections appear as tax credit notes listed under the invoice with negative amounts and the status
        "Partly credited" or "Fully credited".'
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoice | contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceStatus
        | decided 2 October 2026 by Chinmay (CHG-NOTE-003)
    - element: E-invoicing status
      rule: Not shown to guests. Transmission to the tax authority's network is an internal concern.
      source: contracts/spine/finance.yaml#/components/schemas/FinEInvoiceTransmissionStatus
    - element: PDF
      rule: The document as issued, never re-rendered. Fetch the link when the guest taps Download; the link is
        short-lived, so never store or share it.
      source: contracts/spine/finance.yaml#getTaxDocumentRendition
    actions:
    - action: Get a tax invoice
      result: Issues a full invoice and shows it with its number. If the order is already on an invoice, say "This
        order already has a tax invoice" and show it, rather than an error.
      source: contracts/spine/finance.yaml#issueTaxInvoice
    - action: Download / Email PDF
      result: Opens or sends the PDF in the template's languages.
      source: contracts/spine/finance.yaml#getTaxDocumentRendition
    - action: Transfer tickets
      result: Opens the transfer form for this order's tickets (recipient, optional message).
      source: screens/P02-guest-mobile-app.yaml#GST-019
    - action: Ask for a refund
      result: Hands the order to GST-067.
      source: screens/P02-guest-mobile-app.yaml#GST-019
    edgeCases:
    - case: Order not yet paid, or payment still being confirmed
      expected: No tax document actions; the row says "Payment being confirmed".
      source: contracts/spine/finance.yaml#issueTaxInvoice
    - case: The order is part of a combined (consolidated) invoice for a company
      expected: Show "Included in tax invoice INV-2026-000481" and open that invoice; no new invoice can be requested.
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceType
    - case: A full invoice would replace a VAT receipt already issued
      expected: Only if the law allows it. If refused, say the venue will issue it and give the order number; do
        not show a technical error.
      source: contracts/spine/finance.yaml#issueTaxInvoice
    - case: Offline
      expected: The cached list shows with its age; Download, Get a tax invoice and Transfer wait for the connection
        and say so.
      source: screens/P02-guest-mobile-app.yaml#GST-019
    - case: Opened weeks later from a link
      expected: Shows the order if it still resolves; if refunded or the visit passed, says which.
      source: screens/P02-guest-mobile-app.yaml#GST-019
    consistency:
    - with: WEB-019
      note: Same named screen on web; same operations, labels and document rules.
    - with: POS-026
      note: The same invoice kinds and numbering a cashier issues at the counter.
    - with: GST-067
      note: Refund request hand-off; a refund later appears here as a credit memo.
    sampleData:
      orders:
      - 12 Oct 2026 · Aquaventure Waterpark · ORD-7F3K2 · AED 897.00 · Paid · VAT receipt SINV-2026-004812
      - 28 Sep 2026 · Aquaventure Waterpark · ORD-6Q1PA · AED 299.00 · Refunded · Tax credit note CN-2026-000233
      invoiceDetail:
        number: INV-2026-000123
        buyer: Al Mansoori Trading LLC · TRN 100234567800003
        lines:
        - 2 × Day Pass Adult · AED 284.76 net · VAT 5% AED 14.24 · AED 299.00 each
        - 1 × Day Pass Child · AED 237.14 net · VAT 5% AED 11.86 · AED 249.00
        totals: Net AED 806.66 · VAT AED 40.34 · Total AED 847.00
    corrections:
    - what: The staff order list (venue id, principal id, shift id, status filters and the staff order table) is
        still on this guest screen, and the no-access state names a staff permission.
      why: The screen's own notes say a guest-facing list must be scoped to the caller. Keep only the guest's own
        orders; remove the staff list, its filters and the staff permission message.
      source: screens/P02-guest-mobile-app.yaml#GST-019
      status: fixed
      by: CHG-GST-003
    - what: Five tax-document operations are declared but no component uses them.
      why: There is no invoice list, no request-invoice form and no download in the layout; the design must add
        them.
      source: screens/P02-guest-mobile-app.yaml#GST-019
    - what: The purpose still says "order history (wallet)".
      why: The screen was renamed on 31 August; the purpose was not updated.
      source: screens/P02-guest-mobile-app.yaml#GST-019
    decisions:
    - question: Which fields must a UAE tax invoice and a VAT receipt show, and may a receipt be replaced by a full invoice?
      decision: UAE tax invoice / VAT receipt fields from the law (researched).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-085 | CHG-FIN-011 | CHG-NOTE-003
      questionSource: contracts/spine/finance.yaml#issueTaxInvoice
    - question: Should the correcting document be labelled "Credit memo" or "Tax credit note" for UAE guests?
      decision: The correcting document is the UAE 'tax credit note' (from the law).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-086 | CHG-FIN-011 | CHG-NOTE-003
      questionSource: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceTemplate
  GST-044:
    summary: 'The app version of WEB-035, used before the visit and during it. Same rule: the guest pays in the
      selected currency where the venue charges it, and sees an approximate price otherwise. In the app the selector lives in the header (storyboard
      board 8) and the choice persists for the guest''s next sessions.'
    inputs:
    - field: Display currency
      rule: 'The venue''s shown currencies only; base currency first. Persist the choice on the device. The storyboard
        drew AED, USD, EUR, GBP and SAR; the engine prototype drew AED, SAR, USD, INR and GBP; neither list is fixed:
        the venue configures it.'
      source: screens/P02-guest-mobile-app.yaml#GST-044 | DI-1071 | R120
    - field: Venue / As at / Purpose
      rule: Not guest controls (same correction as WEB-035).
      source: screens/P02-guest-mobile-app.yaml#GST-044
    outputs:
    - element: Header currency chip
      rule: Shows the selected currency ("USD", or "EUR ≈" for a shown-only currency). Tapping opens the selector
        sheet with the rate line and the sentence "You pay in USD" or "Prices in EUR are a guide. You pay in AED".
      source: screens/P02-guest-mobile-app.yaml#GST-044
    - element: Prices everywhere in the app
      rule: For a chargeable currency, that currency first with AED beneath; for a shown-only currency, AED first
        with the approximate conversion second; always the currency's own decimals.
      source: DI-211 | DI-598 | contracts/spine/finance.yaml#listFxRates
    actions:
    - action: Pick currency
      result: Converts every displayed price; saves nothing on the server.
      source: contracts/spine/finance.yaml#listFxRates
    edgeCases:
    - case: Guest is in the venue and offline
      expected: Last rates with their age stay; the selector still works on cached rates.
      source: screens/P02-guest-mobile-app.yaml#GST-044
    - case: Guest tops up their wallet in a foreign currency
      expected: The top-up is converted at the configured rate and credited in AED; the wallet balance is always
        AED. Do not show a USD wallet balance.
      source: DI-510
    consistency:
    - with: WEB-035
      note: Same rules, wording and rounding (see WEB-035).
    - with: GST-019
      note: Order totals and tax invoices are in AED; an order paid in another currency also shows the amount paid,
        the currency and the rate.
    sampleData:
      header: USD ≈ · 1 USD = 3.6725 AED · updated 06:00
      line: Family Pass (2+2) · AED 899.00 · ≈ USD 244.79
      note: You pay in USD. Refunds go back in USD.
    corrections:
    - what: Venue, As at and Purpose drawn as controls; full FX rate columns bound.
      why: Same as WEB-035.
      source: screens/P02-guest-mobile-app.yaml#GST-044 | contracts/spine/finance.yaml#/components/schemas/FxRate
      status: fixed
      by: CHG-FIN-001
  POS-008:
    summary: 'How the day is going, seen from the terminal: the till''s own sales, tenders, voids and refunds today,
      and the foreign-currency cash it took. What a person may see is set by role: some venues let a cashier see
      only what they billed, others limited figures, and an outlet manager may see the outlet. The one thing to
      get right: a cashier must not see the drawer''s expected cash total during the shift (the blind close), whatever
      else is on this screen.'
    inputs:
    - field: Period
      rule: Today (default) or "This shift". A cashier cannot widen it; a supervisor may pick a past day for this
        terminal.
      source: DI-181 | contracts/satellite/reporting.yaml#runReport
    - field: Scope (My sales / This terminal / This outlet)
      rule: Shows only the scopes the signed-in role may read; hidden, not greyed. The server already limits what
        a role sees; the control only switches between allowed views.
      source: DI-802 | DI-387 | contracts/shared/permissions.yaml#/components/schemas/Permission
    - field: Question to the assistant
      rule: Free text. Answered only within the person's role; if the question needs data they cannot see, the answer
        is narrower, not refused outright. Asks back when the period or measure is missing.
      source: DI-964 | DI-712 | F20 step 1
    outputs:
    - element: Headline tiles
      rule: 'Gross sales, transactions, average basket, voids and refunds (count and value). Each tile carries "as
        of HH:MM". Labels follow the process vocabulary: "Gross sales", not "Revenue".'
      source: screens/P04-point-of-sale.yaml#POS-008 | DI-181
    - element: Sales mix
      rule: By line of business (Tickets, Food & drink, Retail, Other) and by hour. Bars start at zero.
      source: DI-799
    - element: Tenders
      rule: Cash, card, wallet, gift card and foreign currency. Foreign currency shows the amount taken in that
        currency and its AED equivalent at the rate applied; only the AED figure adds to totals.
      source: DI-213 | DI-282 | contracts/spine/finance.yaml#/components/schemas/ForeignTenderReport
    - element: Expected cash in drawer
      rule: Never shown to a cashier. Supervisors see it on the shift close and POS-020, not here.
      source: MoM 2026-08-12 19. Cash/Shift and Till Management | DI-806
    - element: Top products
      rule: Units, sales and share for this terminal; at most ten rows.
      source: screens/P04-point-of-sale.yaml#POS-008
    actions:
    - action: Refresh
      result: Re-runs the terminal day view; the tiles update and the as-of time moves.
      source: contracts/satellite/reporting.yaml#runReport | R282
    - action: Ask
      result: Shows the answer with what it was based on; never changes anything.
      source: F20 step 2 | DI-964
    edgeCases:
    - case: Offline
      expected: '"Reports need a connection. Your sales are safe and will sync." No figures from the terminal''s
        local journal: they would disagree with the back office.'
      source: screens/P04-point-of-sale.yaml#POS-008
    - case: Another till at the outlet has not closed yet (outlet scope)
      expected: The day view says so ("2 tills still open") rather than presenting a partial figure as the day's
        total.
      source: F74 step 2
    - case: A three-decimal currency venue
      expected: All amounts at three decimals (BHD 1,284.375); never rounded to two.
      source: DI-306
    - case: A cashier asks the assistant for venue revenue
      expected: The answer covers only what they may see ("Your sales today were AED 6,240.00").
      source: DI-964 | F20 step 1
    consistency:
    - with: POS-030
      note: The sales journal lists the transactions behind these totals; tapping a tile may open it filtered.
    - with: POS-007
      note: Shift close is where the counted cash and variance live; this screen never pre-empts the count.
    - with: ANL-013
      note: Same measure names and definitions as the analytics revenue screens; a terminal figure must equal the
        same filter in P16.
    sampleData:
      header: Till 3 · Main Gate · Sara Al Hashimi · Today, as of 15:42
      tiles:
      - Gross sales AED 18,640.00
      - Transactions 212
      - Average basket AED 87.92
      - Voids 4 · AED 356.00
      - Refunds 2 · AED 598.00
      tenders:
      - Card AED 12,905.00
      - Cash AED 4,880.00
      - Wallet AED 655.00
      - USD 54.00 taken = AED 198.32 at 3.6725
    corrections:
    - what: Retire report and Save natural-language query are on the till.
      why: The screen's own notes say a till does not author reports (authoring was removed on 24 August); these
        are authoring too.
      source: screens/P04-point-of-sale.yaml#POS-008 | F74 step 2
    - what: The profit and loss / balance sheet / cash-flow report is loaded here.
      why: A terminal day view has no use for statutory statements, and they need ledger permissions a cashier does
        not hold.
      source: screens/P04-point-of-sale.yaml#POS-008 | contracts/spine/finance.yaml#getFinancialReport
    - what: The Export button has no operation behind it.
      why: Either wire it to the report export or remove it; the POS v2 decision also deferred CSV and Excel export
        at the till.
      source: screens/P04-point-of-sale.yaml#POS-008 | POSV2-1
    - what: The foreign-currency collections report is not wired.
      why: The MoMs require a per-cashier report of foreign-currency activity at the POS; the operation exists in
        finance.
      source: DI-213 | DI-282 | contracts/spine/finance.yaml#/components/schemas/ForeignTenderReport
    - what: The no-access state names the venue-level report permission.
      why: A cashier's figures are their own or their terminal's; the right tiers are the own and workstation report
        permissions.
      source: screens/P04-point-of-sale.yaml#POS-008 | contracts/shared/permissions.yaml#/components/schemas/Permission
    - what: The approved prototype draws a cross-venue command dashboard.
      why: Broader than "from the terminal" and than what a cashier may see; do not copy its cross-outlet panels.
      source: screens/P04-point-of-sale.yaml#POS-008
    decisions:
    - question: May the POS show a cashier any running total (tickets sold, own sales), and which roles see revenue?
      decision: 'Drawn default accepted: Cashier sees own transactions count and own sales only; never expected cash.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-088 | CHG-NOTE-003
      questionSource: DI-802 | DI-806
    - question: Are the eight seeded reports right (terminal day view among them)?
      decision: 'Drawn default accepted: Use the proposed set until the client corrects it.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-089 | CHG-NOTE-003
      questionSource: R282
  POS-020:
    summary: 'The supervisor''s queue at the till for things that need a decision now: cash variance and drawer
      limit alerts, voids and refunds above threshold, no-sales, and approval requests from cashiers. The one thing
      to get right: an alert about a cashier''s own variance goes to their supervisor, not to them; a variance alert
      that reaches the cashier defeats the blind close.'
    inputs:
    - field: No-sale reason
      rule: Required. Pick from preset reasons (change for customer, wrong tender, drawer check, other) plus an
        optional note; "Other" requires the note. Recorded even offline.
      source: F32 step 5 | DI-797 | contracts/spine/shift.yaml#recordNoSale
    - field: Approval decision
      rule: Approve or Reject, with a reason for a rejection. The approver must not be the requester and confirms
        with their own PIN or second factor.
      source: contracts/spine/approvals.yaml#decideApprovalRequest | DI-725
    - field: Filters
      rule: Severity (Critical, Warning, Info) and status; no free-text ids. Workstation and shift are picked from
        lists, defaulting to this till and this shift.
      source: contracts/satellite/reporting.yaml#/components/schemas/AlertSeverity
    outputs:
    - element: Alert row
      rule: What went out of range in words ("Cash in drawer above AED 5,000 limit"), observed value against threshold,
        till, cashier, time raised, and whether it was escalated. Critical first, then oldest.
      source: contracts/satellite/reporting.yaml#/components/schemas/Alert
    - element: Shift summary (supervisor only)
      rule: Takings, expected against counted cash and the variance per shift. Shown only to a supervisor; a cashier
        signed in on this till does not see it.
      source: R282 | MoM 2026-08-12 19. Cash/Shift and Till Management
    actions:
    - action: Acknowledge
      result: Records who saw it and an optional note; the alert stays until its figure is back in range.
      source: contracts/satellite/reporting.yaml#/components/schemas/Alert
    - action: Record no sale
      result: Opens the drawer and records the reason; appears in the voids and discounts report.
      source: F32 step 5 | contracts/spine/shift.yaml#recordNoSale
    - action: Approve / Reject a request
      result: The cashier's screen continues or shows the rejection reason.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    edgeCases:
    - case: Offline
      expected: Alerts are not shown (they come from the reporting service), but Record no sale still works and
        queues; say so on the screen.
      source: screens/P04-point-of-sale.yaml#POS-020 | contracts/spine/shift.yaml#recordNoSale
    - case: The supervisor is the cashier who raised the request
      expected: Approve is disabled with "Another supervisor must approve".
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: The drawer passes its cash limit mid-shift
      expected: A warning alert offering a cash lift; whether it blocks sales is not decided.
      source: DI-274 | MATRIX 5.9.8 | MATRIX 5.8.4
    consistency:
    - with: POS-007
      note: Variance figures here are the same numbers the shift close records.
    - with: BO-133
      note: The back-office view of the same alerts across tills.
    sampleData:
      alerts:
      - Critical · Till 3 · Cash in drawer AED 6,120.00 above AED 5,000.00 limit · 14:05
      - Warning · Till 1 · 3 voids in 10 minutes · Omar Haddad · 13:52
      - Warning · Till 2 · No-sale without a sale before or after · 13:40
      request: 'Refund AED 598.00 · Day Pass Adult × 2 · requested by Rahul Menon · reason: wrong date'
    corrections:
    - what: The raise-approval form asks for system fields (record ids, contract and subject type, scope path).
      why: A person at a till cannot know these; they come from the transaction the request is about.
      source: screens/P04-point-of-sale.yaml#POS-020
    - what: Workstation, shift and item filters are free-text id fields.
      why: Pick lists or defaults, never ids typed by hand.
      source: screens/P04-point-of-sale.yaml#POS-020
    - what: The shift summary report (expected against counted cash) has no role restriction on a shared till.
      why: Shown to a cashier it defeats the blind close; restrict to supervisors.
      source: MoM 2026-08-12 19. Cash/Shift and Till Management | DI-806
      status: fixed
      by: CHG-FIN-003
    decisions:
    - question: Who receives a cash variance alert, and does breaching the drawer limit warn or block?
      decision: 'Drawn default accepted: Supervisor and finance only; warn, offer a cash lift.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-090 | CHG-NOTE-003
      questionSource: MATRIX 5.9.8 | MATRIX 5.8.4
  POS-026:
    summary: 'Right after payment, or when the guest comes back to the counter: print the receipt again, issue a
      full tax invoice with the guest''s company details, or reissue a ticket or wristband. One cart gives one unified
      receipt for tickets, food and retail. The one thing to get right: the receipt is a tax document where the
      venue issues VAT receipts automatically, so its content is legally fixed and the reprint is the same document,
      never a recalculated one.'
    inputs:
    - field: Full tax invoice details
      rule: Company or person name (required), address, country, tax registration number where registered, email.
        Available only for a paid order with no full invoice yet.
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceRecipient | contracts/spine/finance.yaml#issueTaxInvoice
    - field: Reissue reason
      rule: Required (lost, damaged, wristband cut); a reissue cancels the old ticket or wristband at the gate.
      source: screens/P04-point-of-sale.yaml#POS-026
    outputs:
    - element: Receipt
      rule: One receipt for the whole order (tickets, food and drink, retail), in English and Arabic, showing VAT
        per rate, the VAT receipt number when one was issued, the order number and QR, and the return policy text
        for retail items.
      source: DI-293 | DI-019 | DI-366 | contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceTemplate
    - element: Order as sold
      rule: Items, customer, payment method and taxes exactly as recorded at the sale; nothing re-priced.
      source: DI-179 | contracts/spine/finance.yaml#issueTaxInvoice
    actions:
    - action: Reprint receipt
      result: Prints the same receipt again; works offline.
      source: screens/P04-point-of-sale.yaml#POS-026
    - action: Tax invoice
      result: Issues a full invoice and prints or emails it; needs a connection.
      source: contracts/spine/finance.yaml#issueTaxInvoice
    - action: Reissue ticket or wristband
      result: Issues new media and invalidates the old; needs a connection.
      source: screens/P04-point-of-sale.yaml#POS-026
    edgeCases:
    - case: Offline
      expected: Reprint works; Tax invoice and Reissue are disabled with "Needs a connection".
      source: screens/P04-point-of-sale.yaml#POS-026 | contracts/spine/finance.yaml#issueTaxInvoice
    - case: The order is already on a tax invoice
      expected: Offer to reprint or email that invoice instead of issuing another.
      source: contracts/spine/finance.yaml#issueTaxInvoice
    - case: The order total is above the amount allowed on a simplified receipt
      expected: The till prompts for a full tax invoice with buyer details.
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceTemplate
    - case: Paid partly in foreign currency
      expected: The receipt shows the foreign amount tendered, the rate and the AED equivalent; change is given
        in AED.
      source: DI-282
    consistency:
    - with: POS-030
      note: The sales journal offers the same reprint and email-invoice actions for past orders (POSV2-1).
    - with: GST-019
      note: Same invoice kinds, numbering and wording as the guest app.
    - with: POS-011
      note: Refunds start from here and produce a credit memo, never an edited receipt.
    sampleData:
      receipt:
        header: Aquaventure Waterpark · TRN 100123456700003 · VAT receipt SINV-2026-004812
        lines:
        - 2 × Day Pass Adult · AED 598.00
        - 1 × Chicken shawarma meal · AED 45.00
        - 1 × Aquaventure towel · AED 85.00
        vat: VAT 5% included AED 34.67 · Total AED 728.00
        tender: Card AED 528.00 · USD 54.00 at 3.6725 = AED 198.32 · Change AED 0.32
        policy: Retail items may be returned within 7 days with this receipt at Guest Services.
    corrections:
    - what: The screen declares no read of the template, so it cannot know whether the receipt is a VAT receipt.
      why: Whether a VAT receipt is issued automatically is a template setting that defaults to off; the design
        must show both cases.
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceTemplate
    decisions:
    - question: Must a reprinted VAT receipt be marked as a copy?
      decision: 'Drawn default accepted: Print "Copy" under the title.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-091 | CHG-NOTE-003
      questionSource: designer default
  EMP-061:
    summary: On a handheld, a retail lead checks stock on hand, allocated and available by item and location and
      the latest movements, one thumb, walking. Today's takings and alerts are secondary.
    outputs:
    - element: stock card
      rule: Item, location, on hand, allocated, available (bold), value in base currency, last counted, last movement.
      source: MATRIX 15.1.9
    edgeCases:
    - case: out of coverage
      expected: Stock from cache with "As of 10:12"; takings and alerts say "Needs connection".
      source: screens/P06-staff-app.yaml#EMP-061 | contracts/satellite/reporting.yaml#getKpiValues
    consistency:
    - with: P16 ANL-006 Inventory & Waste, ANL-012 Live Operations
      note: Same stock and takings figures.
    sampleData:
    - Shrek plush 30 cm · Motiongate Main Street Store · on hand 46 · allocated 6 · available 40 · AED 1,840.00
      · counted 28 Sep
    corrections:
    - what: Filters are free-text "Item id" and "Location id" fields, and a "Confirm" button has no operation.
      why: Spec leak and a dead control; an item search and a location picker are needed.
      source: screens/P06-staff-app.yaml#EMP-061
    decisions:
    - question: Do takings and a store manager's mobile dashboard belong on a stock screen, or in the reporting area on mobile?
      decision: 'Drawn default accepted: Keep a single takings figure at the top; the dashboard lives in the reporting area.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-361 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-696 | DI-721
  EMP-070:
    summary: 'Inventory alerts a floor lead must act on (low stock, expiring, count variance): acknowledge it and,
      where stock is low, raise a requisition from the alert in two taps.'
    actions:
    - action: Create requisition
      result: Prefilled from the alert (item, location, suggested quantity to par, required by); confirmation shows
        the requisition number.
      source: contracts/satellite/inventory.yaml#createRequisition | MATRIX 17.6.5
    consistency:
    - with: P16 ANL-018 Alerts & Exception Center
      note: Same alert record and acknowledgement.
    sampleData:
    - Low stock · Aquaventure beach towel · Splash Shop · 8 left, par 40 · requisition 60 units by 3 Oct
    corrections:
    - what: Filters are free-text "Workstation id", "Shift id" and "Item id"; no operation supplies the "AI replenishment"
        the name promises.
      why: Spec leak, and an AI label with nothing behind it.
      source: screens/P06-staff-app.yaml#EMP-070
  BO-025:
    summary: 'A chargeback is a bank''s decision on a clock the venue does not control: the money is already gone,
      evidence is due by a date, and a missed date loses the case regardless of merit. This screen lists cases by
      that deadline, assembles evidence the platform already holds, records the bank''s answer, and shows whether
      things are getting worse. The one thing to get right: sort and colour by "evidence due", not by date received.'
    inputs:
    - field: Record a chargeback (from an acquirer portal)
      rule: Provider, provider case reference, amount, reason, evidence due date; matched to the payment by reference.
        A repeat of the same reference returns the existing case.
      source: contracts/spine/orders.yaml#recordChargeback
    - field: Assign
      rule: An investigator and a note; notes build an append-only investigation log.
      source: contracts/spine/orders.yaml#assignChargeback | contracts/spine/orders.yaml#/components/schemas/Chargeback
    - field: Respond
      rule: 'Represent (send evidence) or Accept the loss. Evidence picked from what exists: the order, the admitting
        scan, delivery, the terms accepted, communications, device fingerprint. Accepting is a legitimate, recorded
        decision.'
      source: contracts/spine/orders.yaml#respondToChargeback | contracts/spine/orders.yaml#/components/schemas/Chargeback
    - field: Outcome
      rule: Won, Lost or Expired, as the bank decided.
      source: contracts/spine/orders.yaml#recordChargebackOutcome
    outputs:
    - element: Case list
      rule: Evidence due (countdown, red under 48 hours), amount and fee, reason in words (Fraudulent, Not received,
        Not as described, Duplicate, Subscription cancelled, Credit not processed, Unrecognised), status, investigator.
        Soonest due first.
      source: contracts/spine/orders.yaml#listChargebacks | contracts/spine/orders.yaml#/components/schemas/Chargeback
    - element: Evidence suggestion per reason
      rule: For "Not received", lead with the scan record; for "Fraudulent", lead with device and terms; the reason
        decides which evidence wins.
      source: contracts/spine/orders.yaml#/components/schemas/Chargeback
    - element: Ledger effect
      rule: The debit and fee posted at intake, and the reversal if won; each links to its journal entry.
      source: contracts/spine/orders.yaml#recordChargeback | contracts/spine/orders.yaml#recordChargebackOutcome
    - element: Analytics panel
      rule: Chargeback rate by count and by value against card payments in the period, win rate, fees, cases lost
        to a missed deadline, by reason, product or customer; customers with repeated chargebacks show names only
        to holders of guest personal-data rights.
      source: contracts/spine/orders.yaml#getChargebackAnalytics | MATRIX 4.2.21
    actions:
    - action: Represent
      result: Status Evidence submitted; the deadline countdown stops.
      source: contracts/spine/orders.yaml#respondToChargeback
    - action: Accept loss
      result: Status Accepted; the debit stands.
      source: contracts/spine/orders.yaml#respondToChargeback
    - action: Record outcome
      result: Won posts the money back; Lost leaves the debit; the case closes.
      source: contracts/spine/orders.yaml#recordChargebackOutcome
    edgeCases:
    - case: The deadline passed with no response
      expected: The case shows Expired (treated as lost) and counts in "lost to a missed deadline".
      source: contracts/spine/orders.yaml#recordChargebackOutcome
    - case: Responding after the case was decided
      expected: Refused with "This case is already closed (won/lost/accepted/expired)".
      source: contracts/spine/orders.yaml#respondToChargeback
    consistency:
    - with: ADM-634
      note: The platform's chargeback command centre uses the same case model and wording.
    - with: BO-043
      note: Settlement exceptions are a different thing; do not mix the two lists.
    sampleData:
      cases:
      - Due in 1 day 6 h · AED 598.00 + fee AED 55.00 · Not received · NI case 7712093 · Fatima Al Mansoori investigating
      - Due in 9 days · AED 1,250.00 · Fraudulent · Stripe dp_3Nx… · unassigned
      analytics: September · 14 cases · 0.09% of card payments by count · win rate 64% · fees AED 770.00 · 1 lost
        to deadline
    corrections:
    - what: The layout shows settlement batches and exceptions only, with no chargeback list or detail.
      why: The chargeback operations are declared but nothing binds them; the screen duplicates BO-043 instead of
        showing cases.
      source: screens/P08-venue-back-office.yaml#BO-025
    - what: The case list and the respond operation are not declared here.
      why: They exist and are consumed only by the platform console; the venue cannot see its cases by deadline
        or send evidence from its own back office.
      source: contracts/spine/orders.yaml#listChargebacks | contracts/spine/orders.yaml#respondToChargeback
    - what: The chargeback analytics read is declared twice.
      why: Duplicate entry in the operations list.
      source: screens/P08-venue-back-office.yaml#BO-025
    - what: The no-access state names the settlement permission.
      why: The chargeback operations require the refund-approval permission.
      source: contracts/spine/orders.yaml#recordChargeback
  BO-029:
    summary: 'A venue user builds a report nobody wrote down, without a release: pick a dataset from the business
      catalogue, choose columns, filters, grouping and run-time prompts, preview, save, run. The one thing to get
      right: it is the same builder as the analytics app''s report builder, not a second one, and it never exposes
      tables, joins or SQL.'
    inputs:
    - field: Dataset
      rule: From the published business catalogue only (certified datasets such as Sales, Orders, Admissions); shows
        what one row means.
      source: contracts/satellite/reporting.yaml#getSemanticModel | DI-708 | MATRIX 8.7.11 | MATRIX 6.1.78
    - field: Who can see this report
      rule: A plain choice (Own figures / Workstation / Venue / Region / Whole company) that maps to the report-view
        permission tier; never a permission key typed by the user.
      source: contracts/satellite/reporting.yaml#createReport | contracts/shared/permissions.yaml#/components/schemas/Permission
    - field: Maximum date range
      rule: In days; bounds every run of this report so a year-long query cannot be started by accident.
      source: MATRIX 6.1.19
    - field: Prompts (parameters)
      rule: Filters marked "ask when run" become the inputs a runner fills (date range, channel, operating area).
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportParameter | DI-183
    outputs:
    - element: Preview
      rule: First page of results with column totals; currency at its region decimals; "as of" time because results
        come from the reporting copy.
      source: contracts/satellite/reporting.yaml#runReport | DI-306
    - element: Versions
      rule: Saving publishes a new version; earlier runs keep the version they used, so a past result stays reproducible.
      source: contracts/satellite/reporting.yaml#updateReport | MATRIX 6.1.43
    actions:
    - action: Save
      result: Creates or versions the definition; it appears in the report library.
      source: contracts/satellite/reporting.yaml#createReport
    - action: Retire
      result: Removes it from the library; past runs and their files remain. The confirmation names the schedules
        that use it.
      source: contracts/satellite/reporting.yaml#deleteReport
    - action: Ask in plain language
      result: Returns an answer with the query it used; "Save as report" turns it into a definition.
      source: F20 step 3 | contracts/satellite/reporting.yaml#saveNaturalLanguageQuery
    edgeCases:
    - case: A chosen field is personal data
      expected: Marked as such; exporting it later needs the personal-data export permission and is audited.
      source: contracts/satellite/reporting.yaml#/components/schemas/SemanticModel | contracts/shared/permissions.yaml#/components/schemas/Permission
    - case: The run would return a very large result
      expected: It runs in the background and notifies when ready; the screen never freezes.
      source: DI-710 | contracts/satellite/reporting.yaml#runReport
    consistency:
    - with: ANL-032
      note: 'One reporting area: this screen should open the analytics report builder (or embed the same component)
        rather than be drawn twice.'
    - with: BO-058
      note: Saved reports appear in the report library there.
    sampleData:
      report: 'Sales by operating area and payment method · dataset Sales · columns: date, operating area, workstation,
        payment method, gross sales, discounts, refunds · prompt: date range (max 31 days)'
    corrections:
    - what: The no-access state names the venue report-view permission, and the screen loads a P&L.
      why: Building and saving need the report-management permission; statutory statements are not part of a report
        builder.
      source: screens/P08-venue-back-office.yaml#BO-029 | contracts/satellite/reporting.yaml#createReport
    - what: A second report builder in the back office.
      why: The 8 September decision is one consolidated, permission-based reporting area, not duplicated screens
        in each module.
      source: DI-721 | DI-702
    decisions:
    - question: Do advanced users get SQL or scripting templates (12 August) or is it strictly no-code (8 September)?
      decision: 'Drawn default accepted: No-code only, as the later decision says.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-081 | CHG-NOTE-003
      questionSource: DI-184 | DI-708
  BO-043:
    summary: 'Finance proves each venue''s day balances: every money source (till cash, card gateway settlements,
      bank, wallet) set against the ledger, with the differences named and the unmatched settlement lines to resolve.
      Reconciliation is daily per venue. Provider files are matched automatically (ingest, parse, match, classify,
      auto-resolve) so a person only sees genuine mismatches. The one thing to get right: a variance always says
      between which two sources it sits ("gateway against ledger: AED 500.00 short"), because "out by 500" is not
      actionable.'
    inputs:
    - field: Day and venue
      rule: One day (yesterday by default) and one venue; the day runs midnight to midnight in the region's time
        zone.
      source: R110 | contracts/spine/finance.yaml#/components/schemas/Settlement
    - field: Upload settlement file
      rule: Provider (Stripe, Network International…), the day it covers, the file, and its format (CSV, fixed width,
        XML, JSON) if not detected. Parsing runs in the background; the row shows Ingesting, Parsing, Matching,
        then Matched or Has exceptions.
      source: contracts/spine/finance.yaml#ingestSettlementFile | contracts/spine/finance.yaml#/components/schemas/SettlementStatus
    - field: Resolve an exception
      rule: Outcome (Matched by hand, Write off, Dispute raised, Provider error, Timing difference), a required
        note, and the matching payment when matching by hand.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementResolution | contracts/spine/finance.yaml#resolveSettlementException
    outputs:
    - element: Sources against the ledger
      rule: One row per source (POS cash, each gateway, bank, wallet, ledger) with its total and count, and below
        them each variance with the two sources it lies between, the amount and the likely cause. A day with no
        variance says "Balanced" in words.
      source: contracts/spine/finance.yaml#getUnifiedReconciliation | contracts/spine/finance.yaml#/components/schemas/UnifiedReconciliation
    - element: Settlement batches
      rule: Provider, day, status, lines, matched, exceptions, provider gross, fees, net, ledger gross, difference.
        Differences in red with sign; fees shown separately so fees are never mistaken for a shortfall.
      source: contracts/spine/finance.yaml#/components/schemas/Settlement | DI-268
    - element: Exceptions
      rule: Kind in words (In provider file but not in our records; In our records but not in the file; Amount differs;
        Duplicate in file; Fee not explained), provider reference, amount against expected. Open first.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementException
    - element: Cash
      rule: Expected against deposited per till and the over/short, which posts to the over/short account visible
        at month end.
      source: DI-275
    actions:
    - action: Upload file
      result: The batch appears with its progress; the page updates when matching finishes.
      source: contracts/spine/finance.yaml#ingestSettlementFile
    - action: Resolve
      result: The exception closes with who and why; the batch becomes Resolved when none are open.
      source: contracts/spine/finance.yaml#resolveSettlementException
    - action: Open ledger entries
      result: Shows the postings behind a figure for that day, read-only.
      source: contracts/spine/finance.yaml#listLedgerEntries
    edgeCases:
    - case: The file is for a different currency than the venue trades in
      expected: Show both currencies and refuse to compute a difference that means nothing.
      source: contracts/spine/finance.yaml#/components/schemas/Settlement
    - case: A file arrives for a day already reconciled
      expected: A new batch; never overwrites the earlier one.
      source: contracts/spine/finance.yaml#ingestSettlementFile
    - case: Parsing fails
      expected: Status Failed with the reason and an "Upload again" action.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementStatus
    - case: Exceptions still open at month end
      expected: They block the period close; the close screen links back here.
      source: F13 step 1
    consistency:
    - with: BO-090
      note: '"Settlements reconciled" is one of the close checks; same counts.'
    - with: BO-025
      note: A chargeback found in a settlement file is defended there.
    - with: BO-1081
      note: The finance dashboard shows the same variance figures.
    sampleData:
      day: Tue 29 Sep 2026 · Aquaventure Waterpark
      sources:
      - POS cash AED 8,460.00 deposited (expected AED 8,480.00) · short AED 20.00
      - 'Network International AED 9,500.00 · ledger AED 10,000.00 · gateway against ledger AED 500.00 short · likely
        cause: 3 refunds settled next day'
      - Stripe AED 41,322.50 · matched
      exception: Amount differs · ref NI-88231907 · AED 449.00 against AED 499.00
    corrections:
    - what: The read that sets POS cash, gateway, bank, wallet and ledger side by side is not declared on this screen.
      why: It exists for exactly this purpose ("a venue closing a day needs them side by side") but only the finance
        dashboard and audit screens declare it.
      source: contracts/spine/finance.yaml#getUnifiedReconciliation | screens/P08-venue-back-office.yaml#BO-043
    - what: The trial balance is shown on a daily screen.
      why: A trial balance is per fiscal period and belongs to the period close; for a day it says nothing.
      source: contracts/spine/finance.yaml#/components/schemas/TrialBalance | F13 step 5
    - what: Provider and status filters are free text.
      why: Pick lists of the providers the venue uses and the settlement statuses.
      source: screens/P08-venue-back-office.yaml#BO-043
    decisions:
    - question: Daily per venue (R110) against the weekly or monthly runs in the 12 August minutes. Is a monthly roll-up also
        needed?
      decision: Daily per venue (applied by CHG-FIN-009), plus a month view listing the days.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-215 | CHG-NOTE-003
      questionSource: R110 | DI-258
  BO-058:
    summary: 'The report library: find the report rather than build it, run it with its prompts, see recent runs,
      and schedule it to people. The standard reports (end-of-day, sales by channel, payment summary, shift, refunds,
      voids and discounts, attendance) come seeded; custom ones appear beside them. The one thing to get right:
      a person only sees reports they may run, and a report never shows data outside their scope whatever its filters
      say.'
    inputs:
    - field: Search and category
      rule: Category is a pick list of report categories, not free text.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportCategory
    - field: Run prompts
      rule: 'Date range within the report''s maximum, and the report''s own prompts: site, operating area, sales
        channel, workstation, user.'
      source: DI-183 | DI-151 | MATRIX 6.1.19
    - field: Schedule
      rule: Cadence (e.g. daily 07:00 region time), recipients or recipient groups, format (PDF, Excel, CSV), include
        personal data (only for holders of the personal-data export right), skip if empty. The schedule runs with
        the owner's permissions.
      source: contracts/satellite/reporting.yaml#createReportSchedule | DI-714 | contracts/shared/permissions.yaml#/components/schemas/Permission
    outputs:
    - element: Library
      rule: Seeded reports marked "Standard"; each row shows what it answers, last run and its owner.
      source: R282 | contracts/satellite/reporting.yaml#listSeededReports
    - element: Recent runs
      rule: Status (queued, running, done, failed), parameters used, who ran it, file links; large runs finish in
        the background.
      source: contracts/satellite/reporting.yaml#listReportExecutions
    actions:
    - action: Run
      result: Opens the result; very large results run in the background and notify.
      source: contracts/satellite/reporting.yaml#runReport | DI-710
    - action: Schedule
      result: Creates the schedule; the first delivery time is shown.
      source: contracts/satellite/reporting.yaml#createReportSchedule
    - action: Ask
      result: A plain-language answer with its sources; "Save as report" adds it to the library.
      source: F20 step 1 | F20 step 3
    edgeCases:
    - case: Reports older than the live window
      expected: Archived transactions are still retrievable; a run over them may take longer and says so.
      source: DI-018
    - case: Arabic users
      expected: Reports render right-to-left in Arabic with the same numbers.
      source: DI-019 | MATRIX 6.1.78
    consistency:
    - with: ANL-031
      note: One report catalogue; this is the venue view of the same library (DI-721).
    - with: BO-059
      note: Sales reports open from here filtered; they are not a second library.
    - with: BO-061
      note: Scheduled reports are managed there.
    sampleData:
      reports:
      - Standard · End of day consolidated · last run today 06:00 by schedule
      - Standard · Payment summary by cashier
      - Standard · Sales by channel
      - Custom · Cabana bookings by weekday · owner Omar Haddad
      schedule: Daily closing summary · every day 07:00 · PDF · Finance team, Operations managers
    corrections:
    - what: BO-058 and BO-059 declare almost the same operations, including authoring and P&L.
      why: The 28 September duplicate-screens decision listed this pair but settled others only; the library and
        the sales report need distinct jobs.
      source: R276 | screens/P08-venue-back-office.yaml#BO-059
    - what: The report library loads a P&L.
      why: Statutory statements are one report in the library, not part of it on load.
      source: screens/P08-venue-back-office.yaml#BO-058
  BO-059:
    summary: 'What sold, through which channel: the seeded sales-by-channel report with the end-of-day breakdowns
      the finance team asked for (payment methods, totals, voids, deposits, itemised ticket sales). Scope can narrow
      to an operating area, showing all transactions from its workstations. The one thing to get right: the measures
      are labelled as what they are (gross sales, discounts, refunds, net revenue), and channels use one fixed list
      so two reports never bucket a day differently.'
    inputs:
    - field: Filters
      rule: Date range, site, operating area, sales channel, workstation, user; defaults to yesterday for the user's
        venue.
      source: DI-183 | DI-151
    outputs:
    - element: Channel table
      rule: 'One row per channel (POS, Web, App, Kiosk, B2B, OTA): orders, gross sales, discounts, refunds, net
        revenue, share; totals row. Drill a channel to its workstations, then transactions.'
      source: R282 | DI-709 | MATRIX 8.7.4
    - element: Payment summary
      rule: By payment method and by cashier; foreign currency shown with the AED equivalent.
      source: DI-183 | DI-282
    actions:
    - action: Run
      result: Runs the seeded sales-by-channel report with the filters.
      source: contracts/satellite/reporting.yaml#runReport | R282
    - action: Export
      result: PDF or Excel of exactly what is on screen.
      source: DI-708
    edgeCases:
    - case: A till not yet closed in the range
      expected: Banner "2 tills still open; figures may change" rather than a silent partial total.
      source: F74 step 2
    consistency:
    - with: ANL-016
      note: Same channel names and the same net revenue definition as the analytics sales board.
    - with: BO-058
      note: Opened from the library; not a library itself.
    sampleData:
      range: 29 Sep 2026 · Aquaventure Waterpark · all areas
      rows:
      - POS · 1,204 orders · gross AED 186,420.00 · discounts AED 4,120.00 · refunds AED 1,196.00 · net AED 181,104.00
      - Web · 812 · gross AED 241,700.00 · net AED 236,880.00
      - OTA · 96 · gross AED 28,704.00 · net AED 28,704.00
    corrections:
    - what: Authoring actions (create, save, retire report, save a natural-language query) and a P&L load are on
        a sales report.
      why: Authoring is the builder's and the library's job; this screen runs one report.
      source: screens/P08-venue-back-office.yaml#BO-059 | R276
    - what: The channel list differs across the catalogue, F&B and retail contracts.
      why: Sales by channel is reported three ways today; one closed list is needed.
      source: MoM 2026-08-18 4.2 Recipes, Operating Hours & Service Channels | MATRIX 1.4.7
    decisions:
    - question: Does net revenue here include VAT?
      decision: Net revenue excludes VAT.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-354 | CHG-FIN-007 | CHG-FIN-006 | CHG-NOTE-003
      questionSource: MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities
  BO-060:
    summary: 'How many people actually came in: admissions by hour and by entry point against capacity, a live headcount
      of who is inside, and the group breakdown (general admission, group, re-entry). The one thing to get right:
      this is a report screen; it admits nobody and changes no gate.'
    inputs:
    - field: Period and gates
      rule: Today (live) or a past range; entry points from the venue's list; by hour or day.
      source: R282 | DI-182
    outputs:
    - element: Inside now
      rule: Admitted minus exited, refreshed at least every 30 seconds with "Updated 40 sec ago"; capacity percentage
        beside it.
      source: DI-182 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - element: Admissions by hour and gate
      rule: Heat map of hour against gate, values readable without colour; bars per gate.
      source: R282 | MATRIX 6.1.69
    - element: Category breakdown
      rule: General admission, group, re-entry, crossover; schools and groups listed by booking.
      source: DI-647
    actions:
    - action: Run report
      result: Runs the seeded attendance and footfall report for the range.
      source: R282
    edgeCases:
    - case: A gate offline
      expected: 'Its scans arrive late when it syncs; the hour shows "incomplete: Gate 3 offline" until then.'
      source: DI-625
    consistency:
    - with: ANL-014
      note: The analytics attendance board uses the same admission definition (admitted, in-direction scans).
    - with: BO-100
      note: The admissions tile is the same figure.
    sampleData:
      now: Inside now 6,214 · capacity 8,500 · 73% · Updated 40 sec ago
      hourly: 10:00 1,842 · 11:00 2,310 · 12:00 1,166 · Main Gate 62% · North Gate 38%
    corrections:
    - what: Gate operations (validate access, group admit, override, sync scans, offline package) and a scan target
        are on this report screen.
      why: Admitting or overriding a guest is a scanner's job (P07); a back-office report must not admit anyone.
      source: screens/P08-venue-back-office.yaml#BO-060
    - what: Report authoring and a P&L load are on this screen.
      why: Same as BO-059.
      source: screens/P08-venue-back-office.yaml#BO-060
  BO-061:
    summary: 'A list of report schedules: which report goes to whom, how often, in what format, and whether the
      last delivery worked. A schedule runs under its owner''s access, not the recipients'', so the owner is accountable
      for who gets the data.'
    inputs:
    - field: cadence
      rule: Daily (time), weekly (day and time), monthly (day and time; 31 runs on the last day), quarterly (day
        in the first month and time), on shift close, on period close. Times are in the venue's time zone, shown
        next to the field.
      source: contracts/satellite/reporting.yaml#/components/schemas/Cadence | R158
    - field: recipients
      rule: People in the system, email addresses, SFTP or webhook; at least one. External addresses show a warning
        that the data leaves the system.
      source: contracts/satellite/reporting.yaml#/components/schemas/Recipient
    - field: include personal data
      rule: Off by default; only offered to users allowed to export personal data, and recorded.
      source: contracts/satellite/reporting.yaml#/components/schemas/CreateReportScheduleRequest | contracts/shared/permissions.yaml#/components/schemas/Permission
    - field: skip if empty
      rule: On by default, explained as "Don't send an empty report".
      source: contracts/satellite/reporting.yaml#/components/schemas/CreateReportScheduleRequest
    outputs:
    - element: schedule row
      rule: Report, cadence in words ("Every Monday 08:00, Dubai time"), recipients count, format, owner, next run,
        last run with status; a failing schedule shows its consecutive failures in red.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportSchedule
    - element: delivery history
      rule: Each run with time, status, rows, and the error in words, so "I never got it" can be answered.
      source: F107 step 3 | MATRIX 6.1.15
    actions:
    - action: Pause or resume
      result: Stops future runs without deleting; paused rows are greyed with "Paused by …".
      source: contracts/satellite/reporting.yaml#updateReportSchedule
    - action: Delete
      result: Confirmation names the schedule and who stops receiving it; history stays.
      source: screens/P08-venue-back-office.yaml#BO-061
    edgeCases:
    - case: the owner leaves or loses access
      expected: The schedule fails and says why; it never silently continues under someone else.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportSchedule
    - case: changing a schedule's parameters
      expected: Not editable after creation; offer "Duplicate with new parameters".
      source: contracts/satellite/reporting.yaml#updateReportSchedule
    consistency:
    - with: P16 ANL-042 Report Scheduler, ANL-043 Subscription Manager, ANL-048 Delivery Monitoring
      note: Same operations and same list; DI-721 wants this in the one reporting area.
    sampleData:
    - Daily takings by outlet · every day 07:00 Dubai time · 4 recipients · PDF · owner Fatima Al Mansoori · last
      run 1 Oct 07:00 delivered, 38 rows
    - Month-end deferred revenue · on period close · finance@aquaventure.ae · Excel · last run 2 Sep delivered
    - Weekly admissions by channel · Mondays 08:00 · 3 recipients · CSV · 3 failures · 'Mailbox rejected the message
      (550)'
    corrections:
    - what: BO-061 duplicates P16 ANL-042 Report Scheduler (same list and create operations).
      why: DI-721 (agreed) is one consolidated reporting area, not schedulers per module.
      source: DI-721 | screens/P16-venue-analytics.yaml#ANL-042
    - what: A transition to BO-008 Product Detail & Variants is declared.
      why: Inferred edge with no meaning for scheduling.
      source: screens/P08-venue-back-office.yaml#BO-061
    - what: Export formats are CSV, Excel, PDF and JSON; XML, which the reporting requirement lists, is missing.
      why: The requirement names PDF, Excel, delimited text and XML.
      source: contracts/satellite/reporting.yaml#/components/schemas/ExportFormat | screens/P16-venue-analytics.yaml#ANL-045
  BO-074:
    summary: 'Finance sets up the chart of accounts, cost centres and legal entities before the first sale (every
      sale posts somewhere). The chart is either built natively or mirrors the client''s ERP chart through an external
      code per account. The one thing to get right: the chart is a hierarchy read by type, and what may change after
      an account has been posted to is limited, so the design must show what is locked and why.'
    inputs:
    - field: Account code
      rule: 'Letters, digits, dot, underscore, hyphen; up to 64 characters; unique within the legal entity. Editable
        only until the first posting; after that the field is locked with "Posted to: code is fixed".'
      source: contracts/spine/finance.yaml#/components/schemas/CreateAccountRequest | contracts/spine/finance.yaml#updateAccount
    - field: Type
      rule: Asset, Liability, Equity, Revenue, Expense (closed list). A finer grouping such as "Deferred revenue
        – Annual pass" is a sub-type, not a sixth type. Type is fixed from the account's first posting.
      source: contracts/spine/finance.yaml#/components/schemas/AccountType | contracts/spine/finance.yaml#/components/schemas/Account
        | R127
    - field: Parent account
      rule: Optional; a parent is a header that aggregates and cannot be posted to ("Postable" off). Pick from accounts
        of the same type in the same legal entity.
      source: DI-262 | contracts/spine/finance.yaml#/components/schemas/Account
    - field: External (ERP) code
      rule: The code in the client's own chart; used on every export so their team sees their codes. The only field
        that can change on a posted account.
      source: DI-259 | contracts/spine/finance.yaml#updateAccount
    - field: Suspense account flag
      rule: At most one suspense account per legal entity is the working expectation; it catches postings with no
        mapping and is shown with its balance as a work queue that should trend to zero.
      source: contracts/spine/finance.yaml#/components/schemas/Account
    - field: Legal entity (create)
      rule: Code, name, country, currency, currency decimals (2 or 3), fiscal year start month (January for UAE,
        April for India), tax registration number. Currency and decimals come from the region the entity trades
        in and cannot differ from it.
      source: DI-263 | DI-261 | contracts/shared/common.yaml#/components/schemas/Money | ADR-0018
    - field: Cost centre
      rule: Code, name, optional parent and venue; used as a dimension on journal lines (profit centre, outlet).
      source: DI-262 | contracts/spine/finance.yaml#/components/schemas/CostCenter
    outputs:
    - element: Chart
      rule: 'A tree grouped by type in accounting order (Assets, Liabilities, Equity, Revenue, Expenses), each row:
        code, name, external code, postable, active, balance. Inactive accounts dimmed and filterable, never hidden
        by default.'
      source: DI-262 | contracts/spine/finance.yaml#/components/schemas/Account
    - element: Legal entities
      rule: Every entity with country, currency and active status, as the 12 August walkthrough showed.
      source: DI-261
    actions:
    - action: Create account / cost centre / legal entity
      result: Adds the row; the tree opens on it.
      source: contracts/spine/finance.yaml#createAccount
    - action: Deactivate account
      result: Stops new postings and keeps history; the confirmation names the mappings that point at it, because
        those postings would go to suspense.
      source: contracts/spine/finance.yaml#updateAccount | contracts/spine/finance.yaml#setAccountMappings
    edgeCases:
    - case: First run, no chart
      expected: A setup panel ("Create your chart or import your ERP codes") rather than an empty table; selling
        cannot start until mappings exist.
      source: F16 step 5 | F16 step 6
    - case: Two legal entities in different countries
      expected: The chart is per legal entity; the entity switcher is at the top and each tree shows its own currency.
      source: contracts/spine/finance.yaml#/components/schemas/Account
    consistency:
    - with: BO-075
      note: Mappings pick accounts from this chart; an account shown here lists the event types that post to it.
    - with: BO-089
      note: Journal lines pick postable, active accounts only.
    sampleData:
      legalEntity: Aquaventure Leisure LLC · AE · AED · 2 decimals · year starts January · TRN 100123456700003
      accounts:
      - 1000 Assets (header)
      - 1100 Cash on hand – Main Gate · ERP 110010 · balance AED 48,210.00
      - 1120 Card clearing – Network International · ERP 110250
      - 2300 Deferred revenue – Annual pass · ERP 230010 · balance AED 1,284,600.00
      - 2400 VAT payable · ERP 240100
      - 4100 Ticket revenue · ERP 410000
      - 6900 Cash over/short · ERP 690050
      - 9999 Suspense · balance AED 0.00
      costCentres:
      - CC-FNB-01 Surf Café
      - CC-RET-02 Beach Shop
    corrections:
    - what: Filters are typed ids ("Legal entity id") and a type text field.
      why: 'Pick lists: the entity switcher and the five account types.'
      source: screens/P08-venue-back-office.yaml#BO-074
    decisions:
    - question: Must a client's chart be importable from a CSV file?
      decision: 'Drawn default accepted: Draw an "Import" entry point marked later; the contract has no import operation.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-082 | CHG-NOTE-003
      questionSource: MoM 2026-08-12 13. Chart of Accounts and Account Mapping
  BO-075:
    summary: 'Which account each money event posts to, and the tax codes and exemptions those postings use. Without
      a mapping a sale posts to suspense. The one thing to get right: saving replaces the whole mapping set for
      the region, and four events must be mapped before any venue can trade, so the screen edits a complete set
      and shows what changes before saving.'
    inputs:
    - field: Mapping row (event → debit account, credit account, venue)
      rule: One row per money event (card received, cash received, refund issued, price variance, ticket, food,
        retail and rental revenue, VAT payable, deferred, recognised and breakage revenue, cash over/short, settlement
        fees, chargebacks…). Venue empty means every venue in the region; a venue row overrides it. Card received,
        cash received, refund issued and price variance are required and marked so.
      source: contracts/spine/finance.yaml#/components/schemas/PostingEventType | contracts/spine/finance.yaml#/components/schemas/AccountMapping
        | R127
    - field: Tax code
      rule: 'Code, name, country, rate 0–100 (0% is a valid rate, e.g. donations where untaxed), the account the
        tax posts to, effective from (future-dated: a rate change is a new row, history keeps the old rate), inclusive
        or exclusive, and optionally "applies on top of" another code for tax on tax. Show the application order
        explicitly.'
      source: contracts/spine/finance.yaml#/components/schemas/TaxCode | DI-596 | DI-472
    - field: Tax exemption
      rule: Scope (customer account, product kind, channel, legal entity), the tax code, reason, exemption type
        (diplomatic, export, business-to-business, charity, government, free zone, zero-rated, other), certificate
        reference, evidence document, validity. Only verified or not-required exemptions take effect; pending, rejected
        or expired ones do not.
      source: contracts/spine/finance.yaml#/components/schemas/TaxExemption
    outputs:
    - element: Mapping set
      rule: 'Grouped: receipts, revenue, tax, deferral and recognition, variances, settlement, chargebacks. Unmapped
        events show "Posts to suspense" in amber; the four required ones in red until mapped.'
      source: contracts/spine/finance.yaml#/components/schemas/PostingEventType
    - element: Tax codes
      rule: Active codes with rate, inclusive or exclusive, compounding and effective dates; future rates listed
        under the current one.
      source: contracts/spine/finance.yaml#/components/schemas/TaxCode
    - element: Exemptions waiting for verification
      rule: Pending evidence first, with its expiry; a verify action with a note (required when rejecting).
      source: contracts/spine/finance.yaml#/components/schemas/TaxExemption | contracts/spine/finance.yaml#verifyTaxExemption
    actions:
    - action: Save mappings
      result: Shows the change list (added, changed, removed) and saves the full set; postings already made keep
        their accounts. Refused, with the missing event named, if a required event is unmapped.
      source: contracts/spine/finance.yaml#setAccountMappings
    - action: Verify exemption
      result: Records verified or rejected with who and when; a rejection needs a note.
      source: contracts/spine/finance.yaml#/components/schemas/TaxExemption
    edgeCases:
    - case: A row is left out of the set when saving
      expected: The change list shows it as removed ("Refunds will post to suspense") before confirming.
      source: contracts/spine/finance.yaml#setAccountMappings
    - case: Suspense balance is not zero
      expected: A banner with the balance and the events that fed it, linking to the chart.
      source: contracts/spine/finance.yaml#/components/schemas/Account
    consistency:
    - with: ADM-069
      note: The tax profile (type, jurisdiction, taxable base) lives on ADM-069 in the catalogue; the tax code (rate,
        account, compounding) lives here in finance. Use the same tax names on both.
    - with: BO-074
      note: Account pickers show the chart's codes and names.
    sampleData:
      mappings:
      - Card received · Dr 1120 Card clearing · Cr 1190 Sales control · all venues
      - Ticket revenue · Dr 1190 Sales control · Cr 2300 Deferred revenue · all venues
      - Cash over/short · Dr 6900 Cash over/short · Cr 1100 Cash on hand
      - Price variance · not mapped (required)
      taxCodes:
      - VAT-AE-5 · UAE VAT standard · 5% · inclusive · posts to 2400 · from 1 Jan 2018
      - VAT-AE-0 · Zero-rated export · 0%
      - EG-VAT-14 · Egypt VAT · 14% · exclusive
      exemption: Free zone · VAT-AE-5 · Dubai Silicon Oasis Authority · certificate DSOA-2026-1142 · pending · valid
        to 31 Dec 2026
    corrections:
    - what: The purpose says "which product or movement posts to which account".
      why: Mappings are per money event and venue, not per product; the 25 August decision says each product maps
        a GL account code, and the catalogue carries no such field.
      source: screens/P08-venue-back-office.yaml#BO-075 | DI-466 | contracts/spine/finance.yaml#/components/schemas/AccountMapping
    - what: The mapping set is drawn as tiles and a table with a single "Save" that takes only the mappings.
      why: The save replaces the region's whole set; the design needs the full editable set and a change preview.
      source: contracts/spine/finance.yaml#setAccountMappings
    - what: The create-exemption form asks for an id.
      why: The exemption id is server-owned; the client never sends it.
      source: contracts/spine/finance.yaml#/components/schemas/TaxExemption
    - what: Two switches decide whether tax is computed before or after discount.
      why: The catalogue tax profile carries the taxable base (discounted or pre-discount price, set per jurisdiction)
        and the finance tax calculation takes a separate venue-policy flag. One of them must be the source of truth.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction | contracts/spine/finance.yaml#/components/schemas/CalculateTaxRequest
        | DI-598
    decisions:
    - question: Is a product-level GL code (DI-466) needed, or is event-type mapping enough?
      decision: 'Drawn default accepted: Event-type mapping as contracted; draw no product account picker.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-083 | CHG-NOTE-003
      questionSource: DI-466
  BO-076:
    summary: 'Deferred revenue (paid for, not yet earned), when it will unwind, and the rules that release it: ticket
      revenue on the visit, gift cards and wallet on use, annual passes straight-line or per visit, unredeemed value
      as breakage on expiry, no-shows when the performance ends. The one thing to get right: a product kind may
      be claimed by only one rule, because two rules claiming it recognise the same revenue twice and the numbers
      still look plausible.'
    inputs:
    - field: Recognition rule
      rule: 'Name, method (Immediately, On redemption, Straight line, Per visit, On expiry), product kinds claimed,
        priority (lower wins; equal priority on the same kind is refused), where revenue is earned (Sale, Admission,
        Consumption: a ticket sold at one venue and admitted at another earns at the gate; a wallet top-up earns
        when spent), how often it runs (default at period close), deferred, recognised, breakage and no-show accounts,
        breakage after N days, no-show trigger.'
      source: contracts/spine/finance.yaml#/components/schemas/RecognitionSchedule | contracts/spine/finance.yaml#/components/schemas/RecognitionMethod
    - field: Run recognition
      rule: A fiscal period and a dry run first; the dry run shows recognised and breakage totals by method before
        posting.
      source: contracts/spine/finance.yaml#runRecognition | contracts/spine/finance.yaml#/components/schemas/RecognitionRunResult
    outputs:
    - element: Deferred balance
      rule: One total per currency, never summed across currencies, then ageing bands by expected recognition date,
        each with items and method. A chart of recognised against still-deferred (wallet and passes) by month.
      source: contracts/spine/finance.yaml#getDeferredRevenue | DI-266
    - element: Rules list
      rule: Method, kinds, priority, site, frequency, accounts; conflicts found by validation flagged in red.
      source: contracts/spine/finance.yaml#validateRecognitionSchedules
    actions:
    - action: Validate rules
      result: Lists product kinds claimed by more than one rule.
      source: contracts/spine/finance.yaml#validateRecognitionSchedules
    - action: Run recognition
      result: Posts the moves; running the same period again finds nothing left and says "Nothing to recognise",
        not an error.
      source: contracts/spine/finance.yaml#runRecognition
    edgeCases:
    - case: A pass's validity is extended by three months
      expected: Its deferred balance re-times; the ageing moves out.
      source: contracts/spine/finance.yaml#/components/schemas/RecognitionSchedule
    - case: The period is closing
      expected: Run is still allowed for the closing period until it is closed; the close check "Recognition run
        complete" turns green.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult
    consistency:
    - with: BO-090
      note: Recognition run complete is a close check.
    - with: BO-1081
      note: Recognised and deferred figures must be the same numbers on the finance dashboard.
    sampleData:
      deferred: AED 1,842,350.00 deferred · 0–30 days AED 612,400.00 (8,214 items, on redemption) · 31–90 AED 498,950.00
        · 91–365 AED 731,000.00 (annual passes, straight line)
      rules:
      - Admission tickets · On redemption · site Admission · priority 100
      - Annual pass · Straight line · AED 1,800.00 → AED 150.00 a month · priority 50
      - Gift cards and wallet · On redemption · site Consumption · breakage 365 days after expiry
    corrections:
    - what: Rules can be created and validated but not edited or deactivated.
      why: No update operation exists, although the rule carries an active flag.
      source: contracts/spine/finance.yaml#/components/schemas/RecognitionSchedule | screens/P08-venue-back-office.yaml#BO-076
    - what: The create form lists the rule id as required.
      why: The id is server-owned.
      source: contracts/spine/finance.yaml#/components/schemas/RecognitionSchedule
    - what: The revenue allocation split builder from 12 August is not on this screen or any contract.
      why: Splitting a combo or two-venue pass across products or legal entities was agreed; fixed against percentage
        is still open.
      source: DI-267 | MoM 2026-08-12 16. Revenue Recognition Rules and Allocation Splits
    decisions:
    - question: POS sales recognise immediately (12 August) but rules are per product kind, not per channel. How is a POS-sold
        dated ticket treated?
      decision: 'Drawn default stands (answer: "By the product kind''s rule (a dated ticket is recognised at admission)"):
        By its product kind''s rule; recognised at admission the same day.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-216 | CHG-NOTE-003
      questionSource: MoM 2026-08-12 8. Deferred Revenue and Ledger Flow | contracts/spine/finance.yaml#/components/schemas/RecognitionSchedule
  BO-077:
    summary: 'Two finance queues in one place: the exchange rates in force for the region (set by hand with a margin,
      or pulled from a provider), and the price variances waiting for review, where a till priced a sale differently
      from the server. The one thing to get right: a rate change never edits a rate; it adds a new one from a date,
      so the screen shows rates as a timeline and every manual rate carries a reason.'
    inputs:
    - field: Set a rate
      rule: From currency, to currency, rate (up to six decimals), purpose (Tender = what guests pay at, Reporting,
        Revaluation, Inter-entity), effective from, optional end, and a required note saying why and from where.
        The new rate closes the open-ended one in force at its start; a window that overlaps a bounded one is refused.
      source: contracts/spine/finance.yaml#setFxRate | contracts/spine/finance.yaml#/components/schemas/FxRate |
        R127
    - field: Margin helper
      rule: 'Optional: show the latest provider rate as a reference beside the typed rate and the resulting spread
        ("market 3.68 · venue 3.80 · +3.3%"); the stored value is the rate itself.'
      source: DI-212
    - field: Pull rates now
      rule: Purpose (required), currency pairs (default all the region trades), effective date (default next business
        day), and a dry run option that shows the rates without saving.
      source: contracts/spine/finance.yaml#ingestFxRates
    - field: Variance review outcome
      rule: Accepted, Investigated, or Catalogue corrected, with a required note.
      source: contracts/spine/finance.yaml#/components/schemas/PriceVariance | contracts/spine/finance.yaml#reviewPriceVariance
    outputs:
    - element: Rates
      rule: 'Per pair and purpose: rate in force, source in words (Manual, UAE Central Bank, ECB, Open Exchange
        Rates, Card scheme), effective from, fetched at, who set it and the note. Earlier rates listed beneath,
        never edited.'
      source: contracts/spine/finance.yaml#/components/schemas/FxRateSource | contracts/spine/finance.yaml#/components/schemas/FxRate
    - element: Variances waiting
      rule: 'Only exceptions above the venue threshold that are pending review: order, quoted against server price,
        difference, and the catalogue bundle the till priced from ("till was two bundles behind"). Oldest first.'
      source: contracts/spine/finance.yaml#/components/schemas/PriceVariance
    actions:
    - action: Save rate
      result: Adds the rate from its effective time; the timeline shows the previous one closed at that moment.
      source: contracts/spine/finance.yaml#setFxRate
    - action: Pull rates now
      result: Writes new rows; refused with "Provider unreachable, no rates changed" rather than reusing old ones.
      source: contracts/spine/finance.yaml#ingestFxRates
    - action: Review variance
      result: Records the outcome; the row leaves the queue.
      source: contracts/spine/finance.yaml#reviewPriceVariance
    edgeCases:
    - case: The person holds the venue role but rates are set per region
      expected: Rates are read-only for them, with "Rates are set for the region by finance".
      source: contracts/spine/finance.yaml#setFxRate | R120
    - case: A three-decimal currency pair
      expected: Rates always show their six decimals; amounts use the currency's three.
      source: contracts/spine/finance.yaml#/components/schemas/FxRateValue
    consistency:
    - with: WEB-035
      note: The tender rate set here is what guests see as the approximate conversion.
    - with: POS-008
      note: Foreign tender is converted at the tender rate in force at the time of sale.
    sampleData:
      rates:
      - 'USD → AED · Tender · 3.800000 · Manual · from 1 Oct 2026 00:00 · note: market 3.68, counter spread per
        finance policy'
      - USD → AED · Reporting · 3.672500 · UAE Central Bank · fetched 06:00
      - SAR → AED · Tender · 0.979300 · Open Exchange Rates · fetched 06:00
      variance: ORD-8K21P · Day Pass Adult · quoted AED 279.00 · server AED 299.00 · −AED 20.00 · bundle 2026.09.30-2
        (current .10.01-1)
    corrections:
    - what: The queue "Waiting for a decision" binds exchange rates.
      why: Rates are not waiting for anyone; the queue is the price variances pending review.
      source: screens/P08-venue-back-office.yaml#BO-077
    - what: The set-rate form offers server-owned fields (id, source, set-by, provider reference, fetched at) and
        omits the note.
      why: Those are written by the server; the note is required for a manual rate and the call is refused without
        it.
      source: contracts/spine/finance.yaml#setFxRate | R127
    - what: The screen is wave 2 while it is in the Block A set-up tickets.
      why: Guest multi-currency (WEB-035, wave 1) needs a tender rate to show anything.
      source: screens/P08-venue-back-office.yaml#BO-077 | screens/P01-guest-web-storefront.yaml#WEB-035
    decisions:
    - question: Should the margin over market be stored, or only the resulting rate?
      decision: 'Drawn default accepted: Only the rate, with the margin stated in the note.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-084 | CHG-NOTE-003
      questionSource: DI-212 | contracts/spine/finance.yaml#/components/schemas/FxRate
  BO-089:
    summary: 'The journal: every posting, and the manual entries waiting for a finance manager. A finance user prepares
      a voucher, a different person approves it, and only then it reaches the ledger. Nothing posted is ever edited
      or deleted: a correction is a reversal. The one thing to get right: the approver can never be the preparer,
      and the screen must make that visible before anyone tries.'
    inputs:
    - field: Journal entry
      rule: Fiscal period (open periods only), posting date, description (3–500 characters), reference, and at least
        two lines, each with account (postable, active), debit or credit, venue, cost centre and line description.
        A running "Debits AED x · Credits AED y · Difference" bar; saving is refused while unbalanced.
      source: contracts/spine/finance.yaml#/components/schemas/CreateJournalEntryRequest | contracts/spine/finance.yaml#createJournalEntry
    - field: Reject
      rule: A required comment the preparer will read; the entry returns to draft.
      source: contracts/spine/finance.yaml#rejectJournal
    - field: Reverse
      rule: A required reason and the period to post the reversal into (default the current open period).
      source: contracts/spine/finance.yaml#reverseJournalEntry
    outputs:
    - element: Two views
      rule: '"Waiting for approval" (pending entries, oldest first; empty means all done) and "All entries" (filter
        by period, status and source: manual, order, refund, void, shift, recognition, settlement, variance, reversal,
        write-off, chargeback).'
      source: contracts/spine/finance.yaml#/components/schemas/JournalSource | contracts/spine/finance.yaml#/components/schemas/JournalStatus
    - element: Entry detail
      rule: Number, status, source, preparer, approver, lines with account code and name, totals; for a reversal,
        a link to the original and back; a rejected draft shows the rejection comment.
      source: contracts/spine/finance.yaml#/components/schemas/JournalEntry | contracts/spine/finance.yaml#/components/schemas/JournalStatus
    actions:
    - action: Approve and post
      result: Posts to the ledger; needs the approver's second factor.
      source: contracts/spine/finance.yaml#approveJournalEntry | R135
    - action: Reject
      result: Back to draft with the comment.
      source: contracts/spine/finance.yaml#rejectJournal
    - action: Reverse
      result: Creates the mirror entry referencing the original; the original stays as posted and is marked Reversed.
        The confirmation states the accounts and amounts that will move.
      source: contracts/spine/finance.yaml#reverseJournalEntry
    edgeCases:
    - case: The preparer opens their own pending entry
      expected: Approve is not offered; "Waiting for another approver" with the routing.
      source: contracts/spine/finance.yaml#approveJournalEntry
    - case: The period stopped taking postings after the entry was prepared
      expected: Approve is refused with "Period is closing; choose an open period".
      source: contracts/spine/finance.yaml#approveJournalEntry
    - case: The approver is on leave at month end
      expected: Delegation routes it to a delegate for a limited time.
      source: F13 step 3
    consistency:
    - with: BO-090
      note: '"No unapproved journals" is a close check linking here.'
    - with: BO-074
      note: Account pickers show code, name and type.
    sampleData:
      pending:
      - 'JV-2026-000418 · Accrual: September cleaning contract · Dr 6200 Facilities AED 42,000.00 · Cr 2100 Accruals
        AED 42,000.00 · prepared by Rahul Menon'
      posted:
      - 'JE-2026-091233 · Source: shift · Till 3 close · Dr 6900 Cash over/short AED 20.00 · Cr 1100 Cash on hand
        AED 20.00'
    corrections:
    - what: The whole journal list is titled "Waiting for a decision" and the empty state says "nothing is waiting…
        offers no create action", yet the screen creates entries.
      why: Two views are needed (the ledger and the approval queue); the create action is the point of the screen
        for a preparer.
      source: screens/P08-venue-back-office.yaml#BO-089
      status: fixed
      by: CHG-FIN-005
    - what: There is no way to edit a draft or send a rejected draft back for approval.
      why: The journal state model moves draft to pending only when the entry is created; after a rejection the
        draft can only be approved directly or abandoned.
      source: contracts/spine/finance.yaml#/components/schemas/JournalStatus | contracts/spine/finance.yaml#rejectJournal
    - what: The state model says approval is needed only "above the venue threshold".
      why: The 12 August minutes and the operation say every manual voucher is approved by a manager before it posts.
      source: contracts/spine/finance.yaml#/components/schemas/JournalStatus | DI-265 | contracts/spine/finance.yaml#createJournalEntry
    - what: Period, status and source filters are free text.
      why: Pick lists of periods and the two closed enumerations.
      source: screens/P08-venue-back-office.yaml#BO-089
  BO-090:
    summary: 'Close a fiscal period and see exactly what is stopping it. Beginning the close stops postings to the
      period (sales continue, posting to the next period); the close runs seven checks and, when they pass, goes
      to a finance approver; reopening is rare and approved. The one thing to get right: the checklist is the screen;
      every failing check names how many items block it and links to where they are fixed.'
    inputs:
    - field: Legal entity and period
      rule: Entity switcher, then the periods by year with status Open, Closing, Closed. Periods follow the entity's
        fiscal year (January or April start).
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriod | DI-263
    - field: Abandon or reopen reason
      rule: Required text; kept in the period's history.
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriodEvent
    - field: VAT return range
      rule: Its own date range (the tax period), which need not be the fiscal period.
      source: contracts/spine/finance.yaml#getVatReturn
    outputs:
    - element: Close checklist
      rule: Trial balance balances; no unapproved journals; no open shifts; settlements reconciled; recognition
        run complete; prior period closed; variance exceptions reviewed. Each with pass or fail, the blocking count
        and a link (BO-089, shifts, BO-043, BO-076, BO-077). Run as a dry run any time.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult | F13 step 1
    - element: Trial balance
      rule: 'Accounts with debit, credit and balance; total debits and credits; "Balanced" or "Not balanced: this
        is a defect" in words.'
      source: contracts/spine/finance.yaml#/components/schemas/TrialBalance
    - element: VAT return
      rule: The return boxes as filed (standard-rated supplies by emirate, zero-rated, exempt, reverse charge, imports,
        tourist refunds, recoverable input tax, net payable), each traceable to its tax codes and postings; download
        CSV or Excel for the adviser.
      source: contracts/spine/finance.yaml#getVatReturn
    - element: History
      rule: Every begin, abandon, close and reopen with who, when, why and the approver.
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriodEvent
    actions:
    - action: Begin close
      result: Status Closing; postings to the period stop; new sales post to the next period with a reference.
      source: contracts/spine/finance.yaml#beginPeriodClose | F13 step 4
    - action: Close
      result: Runs the checks; if they pass, raises an approval to another finance approver and shows "Close pending
        finance approval"; locks when approved. Failing checks are listed instead.
      source: contracts/spine/finance.yaml#closeFiscalPeriod | R144
    - action: Abandon close
      result: Back to Open with the reason.
      source: contracts/spine/finance.yaml#abandonPeriodClose
    - action: Request reopen
      result: '"Reopen pending finance approval"; when approved the period goes back to Closing.'
      source: contracts/spine/finance.yaml#reopenPeriod | R144
    edgeCases:
    - case: The trial balance does not balance
      expected: The close stops; recommend abandoning and investigating rather than closing over it.
      source: F13 step 5
    - case: A correction is needed after closing
      expected: Recommend a reversal in the current period; reopening invalidates reports already issued.
      source: F13 step 6
    - case: FX revaluation of cross-currency balances
      expected: Not available yet; show it as a pending step, not a passed check.
      source: contracts/spine/finance.yaml#closeFiscalPeriod
    consistency:
    - with: BO-089
      note: Same wording for unapproved journals.
    - with: BO-043
      note: Same settlement exception counts.
    sampleData:
      period: September 2026 · Aquaventure Leisure LLC · Closing since 1 Oct 09:12 by Layla Haddad
      checks:
      - Trial balance balances · passed · Dr AED 18,442,910.25 = Cr AED 18,442,910.25
      - No unapproved journals · failed · 2 waiting
      - No open shifts · failed · Till 7 Surf Café
      - Settlements reconciled · passed
      - Recognition run complete · passed
      vatReturn: Jul–Sep 2026 · Standard-rated supplies Dubai AED 9,812,400.00 · VAT AED 490,620.00 · net payable
        AED 431,905.40
    corrections:
    - what: Legal entity and status filters are free text.
      why: An entity switcher and the three statuses.
      source: screens/P08-venue-back-office.yaml#BO-090
    - what: The close checks are not drawn; the screen shows a period list and a trial balance.
      why: The close returns seven named checks with blocking counts; that checklist is what "see what is stopping
        it" means.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult | screens/P08-venue-back-office.yaml#BO-090
  BO-100:
    summary: 'The screen a venue manager opens every morning and the way into everything else: today''s takings
      and admissions, open shifts, alerts, and the sections they may use. The one thing to get right: the tiles
      show only what the platform computes (takings and admissions), with their freshness; the Vision Book''s other
      cards wait for a source rather than showing invented numbers.'
    inputs:
    - field: Venue
      rule: Asked first for someone with more than one venue; remembered.
      source: screens/P08-venue-back-office.yaml#BO-100
    outputs:
    - element: Greeting and date
      rule: '"Good morning, Ahmed" with the venue and today''s date in the venue''s time zone.'
      source: DI-028
    - element: Takings tile
      rule: '"Takings today" (money received less refunds), never "Revenue"; comparison with the same weekday last
        week, the target status where a target exists, and "as of" with a stale warning.'
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi | contracts/satellite/reporting.yaml#/components/schemas/KpiValue
        | R283
    - element: Admissions tile
      rule: Admitted today; same comparison and freshness.
      source: R283
    - element: Open shifts
      rule: Count of shifts open now, from the shift list.
      source: screens/P08-venue-back-office.yaml#BO-100
    - element: Sections
      rule: Only sections the person may open; no attention counts.
      source: R283 | DI-387
    actions:
    - action: Open a tile
      result: Takings opens the sales report; admissions opens attendance.
      source: DI-709
    edgeCases:
    - case: First morning of a new venue
      expected: The opening checklist instead of zero tiles.
      source: screens/P08-venue-back-office.yaml#BO-100 | DI-038
    - case: A manager without finance rights
      expected: The takings tile and the finance section are absent, not greyed.
      source: DI-387 | DI-248
    consistency:
    - with: ANL-001
      note: The executive board carries the wider KPI set; the same takings figure appears there.
    - with: BO-106
      note: Hubs reuse these two tiles.
    sampleData:
      greeting: Good morning, Ahmed · Aquaventure Waterpark · Thursday 1 October 2026
      tiles:
      - Takings today AED 142,880.00 · +6.4% vs last Thursday · as of 11:42
      - Admissions 6,214 · +3.1%
      - Open shifts 14
    corrections:
    - what: The takings definition says both "gross value of payments" and "payments less refunds".
      why: The label and tooltip need one definition; also whether VAT, wallet top-ups and gift-card sales are included.
      source: contracts/satellite/reporting.yaml#getKpiValues | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
      status: fixed
      by: CHG-FIN-010
    decisions:
    - question: The Vision Book shows net profit, average order value, live visitors with capacity, AI insights and sales
        by channel on this screen. Which come back, and from what?
      decision: 'Drawn default accepted: Takings and admissions only (R283); the others as an open placeholder list.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-355 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-031 | R283
  BO-106:
    summary: 'Section landing for people and access rights: roles and who holds them, and the way into users, roles
      and rights screens. From this process''s angle it decides who can see finance and reports: rights can be set
      by site, operating area (for example a finance department), role or user, and a module can be edit, view-only
      or hidden. The one thing to get right: hidden really is hidden, and a finance user signing in anywhere sees
      only finance.'
    outputs:
    - element: Roles list
      rule: Each role with holders and, for reporting, the report scope it carries (own, workstation, venue, region,
        company) and whether it can export personal data.
      source: contracts/shared/permissions.yaml#/components/schemas/Permission | DI-148
    - element: Takings and admissions tiles
      rule: Shown only to people who may read reports; otherwise absent.
      source: R283 | DI-387
    actions:
    - action: Open a section
      result: Goes to the users, roles or rights screen.
      source: screens/P08-venue-back-office.yaml#BO-106
    edgeCases:
    - case: A people administrator with no report rights
      expected: No takings tile on their hub.
      source: DI-387
    consistency:
    - with: BO-100
      note: Same tiles and freshness.
    sampleData:
      roles:
      - 'Finance controller · 2 people · reports: whole company · ledger approval · personal-data export'
      - 'Cashier · 46 people · reports: own figures'
    decisions:
    - question: Which roles are the analytics personas (executive viewer, operations manager, analyst, dashboard designer,
        data admin)?
      decision: 'Drawn default accepted: Show the five as proposed role templates bound to the report tiers.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-356 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.7.1 | MATRIX 8.7.21 | MATRIX 6.1.78
  BO-133:
    summary: 'The venue''s control over offline trading: what the server refused when tills synced back, which offline
      limits were crossed, and who did what. From the finance angle the screen is about money that exists in the
      till but not yet in the books. The one thing to get right: every refused sale, payment, refund or void stays
      visible until a supervisor resolves it, because an unresolved one is cash with no ledger entry.'
    inputs:
    - field: Resolution of a refused entry
      rule: Post it, void it, or refund it, with a note; the entry is shown exactly as the till recorded it, never
        retyped.
      source: contracts/spine/orders.yaml#/components/schemas/SyncRejection | contracts/spine/orders.yaml#resolveSyncRejection
    - field: Alert rule (offline exposure)
      rule: 'A ceiling on value and a ceiling on count of offline sales per till, severity, who is told, and a cool-down.
        Both ceilings matter: nine hundred small sales and one large one are different risks.'
      source: F33 step 4 | contracts/satellite/reporting.yaml#setAlertRule
