      bridge:
      - Gross sales AED 48,620.00
      - Discounts (AED 3,410.00)
      - Refunds (AED 260.00)
      - Net revenue AED 44,950.00
      - Food cost (AED 13,935.00)
      - Waste (AED 1,124.00)
      - Contribution margin AED 29,891.00 · 66.5%
      cards: Food cost 31.0% (+1.2 pp vs forecast) · Gross margin 69.0% (−1.2 pp)
    corrections:
    - what: The only cost read declared is getStockValuation.
      why: Stock value is a balance at a date; margin needs cost of sales for the period (recipe cost × units sold)
        and waste, which come from the finance P&L or a report, not from stock valuation.
      source: contracts/satellite/inventory.yaml#getStockValuation | contracts/spine/finance.yaml#getFinancialReport
        | DI-276
    - what: The margin bridge's stages are not a defined measure set and waterfall cannot bind.
      why: A bridge that cannot be totalled cannot be reconciled to the P&L.
      source: MATRIX 4.1.16 | MATRIX 8.7.28 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    decisions:
