    - what: The benchmark read has no period or comparison parameter.
      why: DI-701 asks for this month vs last month / same period last year; getAnalyticsBenchmark takes only kpiId,
        scopePaths and normaliseBy.
      source: contracts/satellite/reporting.yaml#getAnalyticsBenchmark | DI-701
    - what: The board's flow names a venue manager as the actor, but the benchmark needs tenant scope.
      why: A venue manager can never open the comparison; either the actor or the scope is wrong.
      source: F175 step 1 | contracts/satellite/reporting.yaml#getAnalyticsBenchmark
    - what: Filters are "Scope path", "Period from", "Period to" and a normalisation-basis table is listed.
      why: A scope path is a spec leak; the basis table is configuration data owned by ANL-064.
      source: screens/P16-venue-analytics.yaml#ANL-020
    - what: '"Customer Satisfaction", "Operational Exceptions", "Revenue", "Revenue Growth", "Refund %" and "Average
        Transaction Value" have no metric source (only revenuePerVisitor exists).'
      why: Draw them only once defined as KPIs; "outlet performance score" is also undefined; bare "Revenue" must
        become Net revenue.
      source: contracts/satellite/reporting.yaml#/components/schemas/MetricSource | MATRIX 4.5.25 | MATRIX 8.7.1
    decisions:
    - question: Group comparison across currencies — converted at what rate, or kept per currency?
