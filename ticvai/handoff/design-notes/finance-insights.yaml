  BO-1081:
    summary: 'The finance team''s one-glance position for one legal entity and one period: Gross sales, Discounts,
      Refunds, Net revenue, Recognised revenue and Deferred revenue as six separate tiles, then where the money
      stands (POS, gateway, bank and wallet each against the ledger) and the health of tax documents. The one thing
      to get right: the six measures are different numbers with different sources and must never share a label or
      be stacked into one bar. Gross and net are operational sales facts; recognised and deferred are ledger facts
      that move on visit, redemption and expiry, not on sale.'
    inputs:
    - field: period
      rule: Month is the default (the pack shows "August 2026"), with day, week, month, quarter, year and a custom
        range. "Year" means the legal entity's fiscal year, which varies by country (UAE January to December, India
        April to March). Charts re-draw for the chosen period without leaving the page.
      source: DI-260 | DI-263 | MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts &
        Entities | contracts/spine/finance.yaml#/components/schemas/LegalEntity
    - field: legal entity (the pack's "Company UAE01")
      rule: Required, single choice, first in the filter bar. It fixes the base currency, so the pack's "Currency
        AED" is shown as read-only text next to it, not offered as a choice. Records are only ever in base currency;
        there is nothing to convert.
      source: DI-211 | DI-282 | contracts/spine/finance.yaml#/components/schemas/LegalEntity
    - field: venue (the pack's "Site All Sites")
      rule: Lists only the venues the signed-in user may see; a venue manager arrives locked to their venue and
        the control is shown as text. Scope comes from the caller's permissions, not from what the filter sends.
      source: DI-061 | DI-248 | contracts/satellite/reporting.yaml#getKpiValues
    outputs:
    - element: headline tiles
      rule: Fixed order Gross sales, Discounts, Refunds, Net revenue, Recognised revenue, Deferred revenue (balance
        at period end). Each tile shows the base-currency value at the currency's scale (AED 2 decimals; BHD, KWD
        and OMR 3 decimals, third decimal never dropped), the comparison with the previous period, and a status
        colour only when a target exists (no target = no colour, not green). Discounts and Refunds are shown as
        positive amounts with a minus sign in the bridge, never as negative tiles.
      source: MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities | contracts/satellite/reporting.yaml#/components/schemas/KpiValue
        | DI-598
    - element: tile definitions (info popover on each tile)
      rule: 'Gross sales = issued sales before discounts and refunds, with the footnote saying whether VAT and fees
        are included. Net revenue = Gross sales minus Discounts minus Refunds, adjusted for cancellations and voids
        per finance policy. Recognised revenue = posted to revenue accounts in the period: POS sales at sale, online
        tickets on visit or redemption, gift cards on redemption, annual passes straight-line or per visit, breakage
        on expiry. Deferred revenue = paid for and not yet earned at period end.'
      source: MATRIX 5.12.6 | MoM 2026-08-12 8. Deferred Revenue and Ledger Flow
    - element: revenue chart
      rule: 'One chart under the tiles, period-selectable: recognised and deferred by month as two series, and a
        Gross sales to Net revenue bridge (gross, minus discounts, minus refunds, equals net). The bridge uses the
        waterfall mark; never stack gross and net in one bar.'
      source: DI-260 | MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities
        | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - element: where the money stands
      rule: 'A strip of five sources (POS, Gateway, Bank, Wallet, Ledger), each with its total and transaction count,
        then the variances: each one names the two sources that disagree, the amount and the likely cause ("Gateway
        vs Ledger, short AED 500.00, likely a refund not yet settled"). No variance reads "Balanced". The variance
        is the answer; four balanced totals with no comparison is not a reconciliation.'
      source: contracts/spine/finance.yaml#/components/schemas/UnifiedReconciliation | DI-268
    - element: tax documents
      rule: 'Three small counts: Tax invoices issued, Credit memos (count and value), E-invoice transmissions failed.
        Failed is red above zero and links to the transmission log. Use "Credit memo", not "Tax credit note", until
        the label is decided.'
      source: contracts/spine/finance.yaml#listTaxInvoices | contracts/spine/finance.yaml#listCreditMemos | contracts/spine/finance.yaml#listEInvoiceTransmissions
    - element: freshness
      rule: '"As of 09:40 · Updated 40 sec ago" under the title; a stale banner when any value comes back stale.
        Do not promise a refresh faster than 30 seconds per tile.'
      source: MATRIX 8.7.22 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    actions:
    - action: drill from a tile
      result: Net revenue opens year, month, day, channel, transaction list, then the order; Recognised revenue
        opens the revenue account's ledger entries (Admissions revenue is BO-1082). Drill only where a real hierarchy
        exists; a 10,000-row day pages and never freezes.
      source: DI-709 | DI-710
    - action: Export
      result: PDF or Excel of the view as filtered, with the filter values printed in the header. Needs the export
        permission.
      source: contracts/shared/permissions.yaml#/components/schemas/Permission | DI-019
    edgeCases:
    - case: the recognition run for the period has not completed
      expected: Recognised and Deferred tiles say "Recognition for September not yet run" instead of showing a low
        number.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult
    - case: the legal entity trades in two currencies
      expected: One figure per currency on each tile, never a cross-currency sum.
      source: contracts/spine/finance.yaml#/components/schemas/Settlement | contracts/spine/finance.yaml#/components/schemas/DeferredRevenueReport
    - case: user can view reports but not the ledger
      expected: The money-position strip shows "Not available with your access" in place of zeros; finance users
        see only finance; a role with Finance hidden never sees this page in navigation.
      source: DI-248 | DI-387 | contracts/spine/finance.yaml#getUnifiedReconciliation
    - case: the period was closed and later reopened
      expected: 'A banner "Restated: September reopened on 6 Oct by Omar Haddad" because issued figures have changed.'
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriod | F13 step 6
    consistency:
    - with: P16 ANL-013 Revenue Pulse, ANL-002 Sales Revenue & Channel, ANL-005 Cost Margin & Profitability
      note: Same KPI codes and the same labels for gross, net and refunds; DI-721 wants one consolidated reporting
        area, so this is the Finance standard dashboard of that area, reached from Orders & Money.
    - with: BO-076 Revenue Recognition
      note: The deferred balance must equal getDeferredRevenue for the same as-at date and venue.
    - with: BO-043 Daily Reconciliation
      note: Same variance sentence ("between Gateway and Ledger") and the same source names.
    sampleData:
      venue: Aquaventure Waterpark, Dubai
      legalEntity: UAE01 · Aquaventure Leisure LLC · TRN 100354829700003 · base currency AED
      period: September 2026
      tiles:
        grossSales: AED 4,812,450.00 (excl. VAT 5%)
        discounts: AED 312,600.00
        refunds: AED 96,240.00
        netRevenue: AED 4,403,610.00
        recognisedRevenue: AED 3,968,210.00
        deferredRevenue: AED 1,742,380.00 at 30 Sep (annual passes 1,104,500.00; dated tickets not yet visited 563,880.00;
          gift cards 74,000.00)
      moneyPosition:
      - POS AED 1,284,320.50 · 6,912 transactions
      - Gateway (Network International) AED 3,119,289.50 · 18,406
      - Ledger AED 4,403,610.00
      - 'Variance: Gateway vs Ledger, short AED 500.00, likely a refund issued 30 Sep and settled 1 Oct'
      taxDocuments: Tax invoices 25,318 · Credit memos 412 (AED 96,240.00) · E-invoice transmissions failed 3
      bahrainVariant: 'Dilmun Waterpark, Bahrain: Net revenue BHD 182,406.125; Deferred BHD 41,230.750'
      freshness: As of 09:40 · Updated 40 sec ago
    corrections:
    - what: 'The screen carries only a filter bar: no tiles, no chart, no definitions. The client''s tile set (gross,
        net, recognised, deferred, refunds) has no KPI code or formula; getKpiValues seeds only takings and admissions,
        and no metric source names gross sales, net revenue, recognised or deferred revenue.'
      why: The finance board cannot be built or reconciled to the ledger until D-185 is decided.
      source: MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
        | contracts/satellite/reporting.yaml#/components/schemas/MetricSource
      status: fixed
      by: CHG-FIN-007
    - what: The seeded "takings" KPI (payments taken less refunds) must not be bound to the Gross sales or the Net
        revenue tile as a stop-gap.
      why: 'Takings is cash-basis and refund-netted, and it ignores discounts; labelling it gross or net breaks
        the rule that the measures never share a label. The contract itself contradicts itself: getKpiValues calls
        takings "the gross value of payments taken" while the seeded-KPI table says "payments less refunds". Until
        D-185 lands, the real reads are getDeferredRevenue (deferred) and getUnifiedReconciliation (money position);
        the other tiles stay "Definition pending".'
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi | contracts/satellite/reporting.yaml#getKpiValues
        | contracts/spine/finance.yaml#getDeferredRevenue | MATRIX 5.12.6 | R283
      status: fixed
      by: CHG-FIN-007
    - what: Pattern fell back to listDetail, with a "Search finance" field and an empty state that "carries the
        create action".
      why: A dashboard has no population to search and nothing to create; the empty state should say no postings
        exist for the period yet.
      source: screens/P08-venue-back-office.yaml#BO-1081
    - what: A Finance Dashboard inside Orders & Money duplicates the consolidated reporting area.
      why: DI-721 (agreed) says one permission-based dashboards area, not dashboard screens inside each module;
        DI-260's content stands, its location moves.
      source: DI-721 | DI-260 | screens/P16-venue-analytics.yaml#ANL-013
    decisions:
    - question: Is Gross sales shown excluding VAT, and are service fees inside it or a separate line?
      decision: 'Drawn default stands (answer: "Excluding VAT; fees on their own line with a footnote"): Draw excluding VAT,
        with fees as their own line under Gross sales and a footnote saying so.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-217 | CHG-NOTE-003
      questionSource: MoM 2026-08-12 14. Finance Module Walkthrough — Dashboards, Chart of Accounts & Entities | DI-597
    - question: What is the pack's "Attraction" filter in scope terms (a scope node below venue, or a product category)?
      decision: 'Drawn default stands (answer: "Product category (venue + category filters)"): Leave it out; offer Venue plus
        Product category.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-218 | CHG-NOTE-003
      questionSource: screens/P08-venue-back-office.yaml#BO-1081
    - question: Does BO-1081 stay as its own P08 screen (DI-260) or become the Finance standard dashboard in P16 opened from
        Orders & Money (DI-721)?
      decision: One P16 Finance dashboard; Orders & Money (P08) shows a link card to it.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-219 | CHG-NOTE-003
      questionSource: DI-260 | DI-721
  BO-1082:
    summary: 'The ledger view of one revenue account: the pack''s number 410000 is the Admissions revenue GL account,
      and its drill path runs GL entry, then journal, then the TICVAI transaction that caused it. A finance user
      must see what was recognised this period on visits, what is still deferred for tickets not yet used, and what
      became breakage on expiry, and be able to trace any line to the order and the scan behind it.'
    inputs:
    - field: period
      rule: A fiscal period of the legal entity, defaulting to the current open one; recognition follows the visit
        date, so a ticket sold in August and used in September is September revenue.
      source: MoM 2026-08-12 8. Deferred Revenue and Ledger Flow | MATRIX 1.1.40 | MATRIX 8.8.3 | contracts/spine/finance.yaml#/components/schemas/FiscalPeriod
    - field: venue and cost centre
      rule: Optional narrowing; venue managers are locked to their venue.
      source: contracts/spine/finance.yaml#listLedgerEntries | DI-061
    outputs:
    - element: headline
      rule: 'Three figures for the period: Recognised on visit, Deferred at period end (sold, not yet visited) and
        Breakage recognised (expired unused). Each labelled exactly so; never just "Revenue".'
      source: MoM 2026-08-12 8. Deferred Revenue and Ledger Flow | MATRIX 5.12.6
    - element: ledger lines
      rule: Posting date, journal number, description, debit, credit, running balance, source (Visit, Breakage,
        Reversal), newest first. Reversals show as their own lines with a link to the entry they reverse; nothing
        is ever edited.
      source: contracts/spine/finance.yaml#listLedgerEntries
    actions:
    - action: open a line
      result: Opens the journal (all its legs, balanced), then the order and the admitting scan for that ticket.
      source: screens/P08-venue-back-office.yaml#BO-1082 | DI-709
    - action: Export
      result: Excel or CSV of the lines for the period, asynchronous when large; 7 years of history are available.
      source: contracts/satellite/reporting.yaml#runReport | ADR-0047
    edgeCases:
    - case: a refunded ticket that was already recognised
      expected: Shown as a reversal line in the current period, not a deletion of the original.
      source: MoM 2026-08-12 8. Deferred Revenue and Ledger Flow | contracts/spine/finance.yaml#listLedgerEntries
    - case: a never-scanned dated ticket
      expected: Stays deferred until it expires, then appears as Breakage; it never sits deferred forever.
      source: MoM 2026-08-12 8. Deferred Revenue and Ledger Flow | TRACKER Actions row 132
    consistency:
    - with: BO-1081
      note: The Recognised revenue tile drills here for admissions; the figures must match for the same period.
    - with: BO-076 Revenue Recognition
      note: Same recognition rule names (on visit, straight-line, per visit, on redemption, breakage).
    sampleData:
      account: 410000 Admissions revenue · Aquaventure Leisure LLC
      period: September 2026
      recognisedOnVisit: AED 2,184,600.00
      deferredAtPeriodEnd: AED 863,250.00
      breakageRecognised: AED 21,400.00
      line: 30 Sep 2026 · JE-2026-09-018442 · Visit 30 Sep, order WEB-0098123, Rahul Menon, 2 x Day Pass Adult ·
        Cr AED 590.00
      reversal: 30 Sep 2026 · JE-2026-09-018517 · Reversal of JE-2026-09-017902 (refund, order POS-0441871) · Dr
        AED 295.00
    corrections:
    - what: The screen reads getKpiValues and runReport, but the pack describes a ledger drill (GL entry, journal,
        transaction) on account 410000; the operations that serve it are listLedgerEntries with the account, then
        getJournalEntry, then the order.
      why: No KPI or report definition returns ledger lines with their journal.
      source: screens/P08-venue-back-office.yaml#BO-1082 | contracts/spine/finance.yaml#listLedgerEntries | contracts/spine/finance.yaml#getJournalEntry
    - what: The seeded "admissions" KPI is a count of admitted scans, not admissions revenue; it must not feed a
        money tile here.
      why: Same word, different unit and source.
      source: contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
    decisions:
    - question: Is 410000 a fixed platform account code or the tenant's own chart-of-accounts code?
      decision: 'Drawn default accepted: Show the tenant''s account code and name as read from the chart of accounts.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-357 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-259 | contracts/spine/finance.yaml#listLedgerEntries
  BO-1170:
    summary: 'Month-end for wallet money: a roll-forward of the wallet liability from opening to closing balance,
      the checks that must pass before the period closes, and the close itself. Wallet balances are a liability
      to customers until redeemed or recognised as breakage under policy; the finance manager must see every movement
      that explains the change and every blocker that stops the close.'
    inputs:
    - field: period and legal entity
      rule: The fiscal period being closed, chosen from the legal entity's periods; close is per legal entity and
        region, so "close by tenant / venue / currency" are views of the roll-forward, not separate closes.
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriod | contracts/spine/finance.yaml#closeFiscalPeriod
    - field: Reopen with approval
      rule: Reopening needs a reason (kept in the period's history) and a finance approver who is not the requester;
        reopening restates figures already reported, so the default advice is a reversal in the open period instead.
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriod | F13 step 6 | R144
    outputs:
    - element: liability roll-forward
      rule: 'A vertical statement, read-only: Opening liability, plus Funding (top-ups), plus Credits issued, minus
        Redemption, minus Refunds, plus or minus Transfers, plus or minus Adjustments, minus Breakage recognised,
        equals Closing liability. Expired-this-period is a memo line, because breakage is recognised on policy,
        not on expiry. The check line "Opening + movements = Closing" shows a tick or the unexplained difference.'
      source: contracts/satellite/wallet.yaml#getWalletLiability | contracts/satellite/wallet.yaml#/components/schemas/WalletLiabilityRow
        | TRACKER Actions row 164
    - element: liability breakdown
      rule: Grouping switch by credit type, wallet type, venue and age band; one figure per currency.
      source: contracts/satellite/wallet.yaml#getWalletLiability
    - element: period status
      rule: Open, Closing, Closed. "Awaiting approval" is Closing with an approval request waiting, shown with the
        approver's name; "Reopened" is an event in the history, not a status.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodStatus | contracts/spine/finance.yaml#/components/schemas/FiscalPeriod
    - element: pre-close checks
      rule: One row per check with pass or the blocking count and a link to fix it. The ledger's checks are trial balance
        balances, no unapproved journals, no open shifts, settlements reconciled, recognition run complete, prior period closed
        and variance exceptions reviewed. The wallet pre-close checks join them, read from a wallet movement summary (an operation
        to be added), so none is drawn greyed.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult | F13 step 1 | decided 2 October 2026 by
        Chinmay (CHG-NOTE-003)
    actions:
    - action: Export close package
      result: PDF and Excel of the roll-forward, the checks and the period history, stamped with who and when.
      source: screens/P08-venue-back-office.yaml#BO-1170 | ADR-0047
    - action: Carry exceptions forward
      result: Only an exception reviewed and accepted may be carried; it stays visible in the next period's checks
        with its age.
      source: screens/P08-venue-back-office.yaml#BO-1170 | contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult
    edgeCases:
    - case: the roll-forward does not tie (opening plus movements differs from closing)
      expected: The difference is shown in red with the wallet-to-ledger and wallet-to-acquirer reconciliation one
        click away; close is not offered.
      source: contracts/satellite/wallet.yaml#getWalletReconciliation
    - case: a negative wallet balance exists
      expected: Listed as a blocker with the wallet count; it cannot be netted against other balances.
      source: screens/P08-venue-back-office.yaml#BO-1170
    consistency:
    - with: BO-090 Period Close and BO-1172
      note: One close, three doors. The close operations live on BO-090 (F13) and BO-1172; this screen must use
        the same status words and the same check names, and hand off rather than run a second close.
    - with: BO-076 Revenue Recognition
      note: Breakage recognised here equals the breakage posted to revenue there.
    sampleData:
      entity: Aquaventure Leisure LLC · September 2026 · Closing (awaiting approval from Fatima Al Mansoori)
      rollForward:
        openingLiability: AED 1,250,000.00
        funding: AED 486,300.00
        creditsIssued: AED 18,750.00
        redemption: − AED 512,940.00
        refunds: − AED 9,860.00
        transfers: AED 0.00
        adjustments: − AED 1,200.00
        breakageRecognised: − AED 6,200.00
        closingLiability: AED 1,224,850.00
        memoExpired: AED 14,500.00 expired this period, 6,200.00 recognised as breakage under policy, 8,300.00 still
          held
      checks: 'Settlements reconciled: 2 open exceptions · No open shifts: passed · Recognition run complete: passed'
    corrections:
    - what: The 18 fields are selectFields under a configEditor pattern, but most of them (Opening liability, Funding,
        Redemption, Breakage, Closing liability) are figures of a statement, not settings.
      why: A designer would draw dropdowns for amounts.
      source: screens/P08-venue-back-office.yaml#BO-1170
    - what: The purpose lists statuses Open, Closing, Under Review, Closed, Reopened; the contract has open, closing
        and closed only.
      why: Under review is closing with an approval waiting; reopened is a history event.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodStatus | R144
    - what: getWalletLiability returns outstanding, expiring and breakage at a date; it returns none of the movements
        (funding, credits issued, redemption, refunds, transfers, adjustments) the roll-forward needs.
      why: The roll-forward cannot be built from the declared reads.
      source: contracts/satellite/wallet.yaml#/components/schemas/WalletLiabilityRow
    - what: '"Close by tenant", "Close by venue" and "Close by currency" imply separate closes; a fiscal period
        belongs to a legal entity and closes at region scope.'
      why: There is no per-venue or per-currency close in the contract.
      source: contracts/spine/finance.yaml#/components/schemas/FiscalPeriod | contracts/spine/finance.yaml#closeFiscalPeriod
    - what: The wallet pre-close validations (pending refunds, pending reversals, negative balances, missing accounting
        mappings, failed integrations, unprocessed expirations, breakage candidates) are not values of the close-check
        list.
      why: The close cannot block on them, so the screen would show checks nothing runs.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult | screens/P08-venue-back-office.yaml#BO-1170
    decisions:
    - question: Which wallet-specific checks join the period-close checks, and does a wallet movement summary operation get
        added?
      decision: Add a wallet movement summary operation and wallet pre-close checks.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-220 | CHG-NOTE-003
      questionSource: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult | contracts/satellite/wallet.yaml#getWalletLiability
  BO-1172:
    summary: 'The finance controls centre (DI-277): one place that shows the transactions and balances with exceptions
      or variances needing review, proves that wallet balances, the wallet sub-ledger, the general ledger and the
      acquirer agree, and moves the period through submit and approve. Get right: the person who submits the close
      is never the one who approves it, and every check names what to fix.'
    inputs:
    - field: period
      rule: Arrives with the period from navigation; otherwise the oldest period that is open or closing.
      source: contracts/spine/finance.yaml#listFiscalPeriods
    outputs:
    - element: finance health check
      rule: 'Three tie-outs, each with a tick or the difference: customer wallet balances vs wallet sub-ledger liability;
        wallet sub-ledger vs general ledger; general ledger vs acquirer. A difference names the pair, the amount,
        the transactions involved and the likely cause.'
      source: contracts/satellite/wallet.yaml#/components/schemas/WalletReconciliation | DI-277
    - element: money sources vs ledger
      rule: POS, gateway, bank, wallet and ledger totals with each named variance, same layout as BO-1081's strip.
      source: contracts/spine/finance.yaml#/components/schemas/UnifiedReconciliation
    - element: close checks
      rule: The seven close checks with pass, or the blocking count and a link to the screen that fixes it.
      source: contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult | MATRIX 5.7.89
    actions:
    - action: Run checks
      result: Runs the close checks without locking anything and lists what fails. It changes nothing, so no confirmation.
      source: contracts/spine/finance.yaml#closeFiscalPeriod | MATRIX 5.7.89
    - action: Begin close
      result: Confirmation "Postings to September stop now. Sales continue and post to October." The period moves
        to Closing.
      source: contracts/spine/finance.yaml#beginPeriodClose | F13 step 4
    - action: Request approval to close
      result: Runs the checks; if they pass, an approval request goes to a finance approver who is not the caller
        and the period stays Closing with "Awaiting approval from …". If a check fails, the failed checks are listed
        and nothing is sent.
      source: contracts/spine/finance.yaml#closeFiscalPeriod | R144
    - action: Generate liability report
      result: The wallet liability by credit type, age band and venue as at period end, exportable.
      source: contracts/satellite/wallet.yaml#getWalletLiability
    edgeCases:
    - case: the user has wallet view but not ledger approval
      expected: Tie-outs visible; Begin close and Request approval are absent, with "Needs ledger approval access"
        in their place.
      source: contracts/spine/finance.yaml#beginPeriodClose | contracts/satellite/wallet.yaml#getWalletReconciliation
        | DI-387
    - case: the approver is on leave at month end
      expected: The request follows the approver's time-bounded delegation; the screen shows the delegate's name.
      source: F13 step 3
    - case: a trial balance that does not balance
      expected: The close stops and is abandoned with a reason; the period reopens for posting.
      source: F13 step 5
    consistency:
    - with: BO-090 Period Close
      note: Same three verbs (Begin close, Request approval, Reopen period) and the same check names; F13 runs there.
    - with: BO-1170
      note: The liability figure here equals that screen's closing liability.
    sampleData:
      period: September 2026 · Aquaventure Leisure LLC · Closing
      tieOuts:
      - Customer wallet balances AED 1,224,850.00 vs wallet sub-ledger AED 1,224,850.00 · tied
      - Wallet sub-ledger vs general ledger · tied
      - Wallet sub-ledger vs acquirer · short AED 2,450.00 · 3 top-ups captured 30 Sep, credited 1 Oct (timing)
      checks: Settlements reconciled · 2 exceptions open (Stripe, 29 Sep) · Fix in Daily Reconciliation
      approval: Requested by Omar Haddad 1 Oct 10:12 · awaiting Fatima Al Mansoori
    corrections:
    - what: '"Run Finance Validation" is mapped to getUnifiedReconciliation; the contract''s validation is the dry-run
        close, which returns the failed checks.'
      why: A reconciliation read does not tell the user whether the period can close.
      source: screens/P08-venue-back-office.yaml#BO-1172 | contracts/spine/finance.yaml#closeFiscalPeriod | MATRIX
        5.7.89
    - what: '"Approve Close" is mapped to closeFiscalPeriod, but that operation raises an approval request to a
        different finance approver and returns with the period still closing; the approval is decided in approvals.'
      why: A button labelled Approve that only requests approval misleads, and invites self-approval.
      source: contracts/spine/finance.yaml#closeFiscalPeriod | R144
    - what: The table's column list includes "against", a fragment of the pack sentence, as a column.
      why: Parsing artefact.
      source: screens/P08-venue-back-office.yaml#BO-1172
    - what: The purpose carries board 10's integration-governance text (APIs, webhooks, synchronisation) after "Finance
        Health Check".
      why: Page bleed from the pack; this screen is the finance health check only.
      source: screens/P08-venue-back-office.yaml#BO-1172
    decisions:
    - question: Which approval inbox does the finance approver use to decide a period close?
      decision: 'Drawn default stands (answer: "The approvals inbox, with a deep link to the close checks"): The approvals
        inbox, with a deep link back to this screen showing the checks.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-221 | CHG-NOTE-003
      questionSource: R144 | contracts/spine/finance.yaml#closeFiscalPeriod
  ADM-031:
    summary: 'The platform''s security and compliance picture: who holds sensitive rights without a second factor,
      open platform-staff access into tenants, unusual sign-in patterns and override rates, personal-data exports,
      and retention. It is where an investigation starts and hands over to the audit logs. The one thing to get
      right: a platform operator sees a tenant only after picking it and opening an audited, time-boxed grant, and
      the grant is always visible.'
    inputs:
    - field: Tenant
      rule: Picked first; every figure below is for that tenant, and nothing tenant-specific shows until a grant
        is open.
      source: R098 | screens/P09-platform-admin-console.yaml#ADM-031
    - field: Open access grant
      rule: Reason, permissions (preselected to what this screen reads), expiry; asks for the second factor first.
      source: R098 | R135
    outputs:
    - element: Tiles
      rule: Principals holding MFA-required rights without an active second factor (the floor is role management,
        ledger approval and every platform right); open platform-staff grants with time left; failed sign-ins and
        lockouts; personal-data exports in the period; override rate at gates and tills; segregation-of-duties conflicts.
      source: contracts/shared/permissions.yaml#/components/schemas/Permission | DI-732 | F106 step 1
    - element: Grant banner
      rule: Tenant, permissions, reason, time left; at expiry every tenant action disables and the screen returns
        to "grant required".
      source: R098
    actions:
    - action: Investigate
      result: Opens the platform audit log (ADM-004) or the tenant audit log (BO-068) filtered to the figure clicked.
      source: F106 step 2 | F106 step 3
    edgeCases:
    - case: The grant expires during an investigation
      expected: Figures stay visible as last loaded but labelled; actions disable; a new grant is a new reason.
      source: R098
    consistency:
    - with: ANL-069
      note: Usage and cost of analytics is there; security events are here.
    sampleData:
      tenant: Dubai Parks & Resorts
      grant: 'Read security dashboards · reason: quarterly access review · 1 h 42 min left'
      tiles:
      - 7 people with ledger approval have no second factor
      - 2 open platform-staff grants
      - Failed sign-ins 184 (last 24 h) · 3 accounts locked
      - Personal-data exports 5 this month
      - Gate overrides 0.8% of scans
    corrections:
    - what: The purpose ("the screen this app sits on; everything else is entered from here") is the console home's
        purpose.
      why: It was derived from the name; the security dashboard is entered from ADM-002 and is not the app's entry
        point.
      source: screens/P09-platform-admin-console.yaml#ADM-031
    - what: The operations are generic dashboard create/list/update, gated by a venue report permission, and none
        of the tiles has a metric source.
      why: The metric list has no security measures (second-factor coverage, failed sign-ins, grants, exports);
        the screen says "no contract — not specified".
      source: screens/P09-platform-admin-console.yaml#ADM-031 | contracts/satellite/reporting.yaml#/components/schemas/MetricSource
    decisions:
    - question: Which security measures does the platform compute, and from which logs?
      decision: 'Drawn default accepted: Draw the tiles above as the intended set, marked "awaiting source".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-077 | CHG-NOTE-003
      questionSource: DI-732 | F106 step 1
  ADM-068:
    summary: 'The hub of the tax, fee and calculation board: how many tax profiles, jurisdictions, fees, surcharges,
      exemptions and calculation profiles are active, what is broken (products with no tax, conflicts, validation
      issues) and what changes soon. Administrators must see at a glance which jurisdiction taxes on the pre-discount
      price, which currency rounds to three decimals, and what each change will touch before it is published.'
    inputs:
    - field: filter by type
      rule: Tax, Fee, Surcharge, Waiver, Exemption, Calculation profile, Rounding profile; multi-select, all selected
        by default.
      source: contracts/spine/catalogue.yaml#/components/schemas/TaxFeeCalculationCommandCenterView
    - field: country and legal entity
      rule: Country first, then the legal entities in it; the currency is read from the entity, not chosen.
      source: contracts/spine/catalogue.yaml#/components/schemas/TaxFeeCalculationCommandCenterView | contracts/spine/finance.yaml#/components/schemas/LegalEntity
    outputs:
    - element: headline counts
      rule: 'Health first: Products missing tax, Products missing calculation profile, Configuration conflicts,
        Validation issues are the first row and turn red above zero; the inventory counts (active profiles, jurisdictions,
        fees, surcharges, exemption rules) come second. Upcoming tax changes shows the nearest effective date.'
      source: contracts/spine/catalogue.yaml#/components/schemas/TaxFeeCalculationCommandCenterSummary
    - element: profile row
      rule: 'Name, type, country, legal entity, currency, scope, status (draft, active, inactive, expired), effective
        from and to (empty = open-ended), owner. A tax profile row shows its tax base: "Taxed on discounted price"
        (default) or "Taxed on full price before discount"; tax-inclusive or exclusive; compound "tax on tax" where
        set. Fees always appear apart from taxes.'
      source: contracts/spine/catalogue.yaml#/components/schemas/TaxFeeCalculationCommandCenterView | DI-596 | DI-597
        | DI-598
    - element: dependencies
      rule: Selecting a profile shows how many products and venues use it, read-only, before anyone edits it.
      source: contracts/spine/catalogue.yaml#/components/schemas/TaxFeeCalculationCommandCenterView
    - element: VAT return and tax invoices
      rule: Where shown, the VAT return is laid out in the FTA VAT 201 boxes (supplies by emirate, zero-rated, exempt,
        reverse charge, imports, tourist refunds, recoverable tax, net payable), each box traceable to its tax codes.
      source: MATRIX 6.1.23 | contracts/spine/finance.yaml#getVatReturn
    actions:
    - action: open a detail screen
      result: Each of the nine detail screens opens from here and returns here.
      source: DI-653 | F145 step 1
    edgeCases:
    - case: a 3-decimal currency
      expected: Every amount and every rounding preview shows three decimals (BHD 0.413, not 0.41).
      source: DI-306 | DI-598 | contracts/spine/catalogue.yaml#setCurrencyRoundingRule
    - case: a donation product with no tax
      expected: A 0% tax code is valid and is not counted as "missing tax".
      source: DI-472
    consistency:
    - with: ADM-069 to ADM-077
      note: Same type names and status words; the hub's counts equal the detail screens' lists. Tax base (discounted
        or full price) is set on ADM-069 and the rounding preview on ADM-075; the hub only reports them. See the
        ADM-069 and ADM-077 notes from the lead.
    - with: BO-075 Account Mapping (tax codes)
      note: Tax code names shown here match the venue's tax codes.
    sampleData:
      counts: Active tax profiles 14 · Jurisdictions 6 · Active fees 9 · Surcharges 3 · Exemption rules 5 · Calculation
        profiles 7 · Products missing tax 7 · Conflicts 2 · Validation issues 4 · Upcoming changes 1 (1 Jan 2027)
      rows:
      - UAE VAT standard 5% · Tax · AE · UAE01 Aquaventure Leisure LLC · AED · All products · Active · from 1 Jan
        2018 · Owner Fatima Al Mansoori · Taxed on discounted price · exclusive
      - Egypt VAT 14% · Tax · EG · EG01 Cairo Festival Parks SAE · EGP · Tickets · Active · Taxed on full price
        before discount (EGP 500.00 ticket, 20% off, pays 400.00 + VAT 70.00 = 470.00)
      - Bahrain VAT 10% · Tax · BH · BH01 Dilmun Leisure WLL · BHD · All · Active · BHD 4.125 x 10% = 0.4125, rounds
        to 0.413
      - Venue service fee 2.5% → 3.0% · Fee · AE · Draft · from 1 Jan 2027
    corrections:
    - what: 'Two sources of truth for discount treatment: the tax profile''s tax base (discounted or pre-discount
        price, set per jurisdiction) and the tax calculation request''s "discounts are tax-inclusive" flag described
        as venue policy.'
      why: Egypt's pre-discount rule can be set one way here and the opposite way at calculation.
      source: contracts/spine/catalogue.yaml#/components/schemas/TaxProfile | contracts/spine/finance.yaml#/components/schemas/CalculateTaxRequest
        | DI-598
    - what: A platform console screen (operator TICVAI, hosted on the control plane) reads one tenant's tax invoices
        and VAT return, which are LEDGER_VIEW reads of a legal entity in its cell.
      why: The VAT return belongs to the tenant's finance area; on the platform hub it is either a cross-tenant
        leak or unreachable.
      source: screens/P09-platform-admin-console.yaml#ADM-068 | contracts/spine/finance.yaml#getVatReturn
    - what: The board's tax profiles are written under the product-configuration permission at venue scope (setTaxProfileJurisdiction),
        not the tax-configuration permission, and the hub reads under product view at venue scope.
      why: Anyone who may edit products may change a jurisdiction's tax; the "Create Tax Profile" quick action inherits
        that gap.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction | contracts/spine/catalogue.yaml#listTaxFeeCalculation
        | contracts/shared/permissions.yaml#/components/schemas/Permission
    decisions:
    - question: Who uses ADM-068, TICVAI staff maintaining jurisdiction templates, or tenant finance administrators?
      decision: 'Drawn default stands (answer: "TICVAI staff maintain country tax templates; tenants run VAT returns and invoices
        in VM"): TICVAI staff maintaining templates per country; the VAT return and invoices are drawn on the tenant''s finance
        screens instead.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-207 | CHG-NOTE-003
      questionSource: screens/P09-platform-admin-console.yaml#ADM-068 | contracts/spine/catalogue.yaml#listTaxFeeCalculation
    - question: The aiInsights field on the summary, is it in phase one, given AI-assisted finance reporting is phase two?
      decision: 'Drawn default stands (answer: "Leave the AI panel out of phase one"): Leave the AI panel out of phase one.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-208 | CHG-NOTE-003
      questionSource: DI-278 | contracts/spine/catalogue.yaml#/components/schemas/TaxFeeCalculationCommandCenterSummary
  ADM-069:
    summary: 'Define reusable tax profiles per legal entity, country and jurisdiction: tax type, rate, where the
      profile applies, and the taxable base, including the region-configurable rule that tax is charged on the price
      before discount (Egypt). Also where the invoice templates, number series and e-invoicing connection are set.
      The one thing to get right: a rate or base change is a new, future-dated version; transactions already made
      keep the version they were calculated with.'
    inputs:
    - field: Tax type
      rule: 'One select: VAT, GST, Sales tax, Entertainment tax, Tourism tax, Municipality tax, Service tax, Custom
        regulatory tax. Not five buttons.'
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - field: Rate
      rule: Percent (e.g. 5 for UAE VAT); empty when the tax is a fixed amount set on the tax rule.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - field: Taxable base
      rule: "Discounted price (default) or Price before discount. Explain with a live example under the control:\
        \ >-\n  \"AED 100 ticket, 20% off: guest pays AED 80; VAT is charged on AED 100\"."
      source: DI-598 | contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - field: Jurisdiction level and applicability
      rule: Country, region or municipality; applies to legal entity, country, market, venue, product category,
        product, service or channel (a channel only where legally applicable). Multiple applicability rows allowed.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - field: Effective from / to
      rule: Dates, not selects. From must be in the future for a change to an active profile; empty "to" means open-ended.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - field: Tax registration number, legal entity, currency
      rule: Text and pick lists; currency follows the legal entity.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - field: Invoice template (per legal entity and document kind)
      rule: Number prefix (INV-, SINV-, CN-), yearly reset, next number (may be raised, never lowered below the
        last issued), padding, languages in order (en, ar), title per language (prescribed wording is law), footer,
        logo, "issue a VAT receipt on every paid order", the amount up to which a simplified receipt is allowed,
        show tax in the legal currency.
      source: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceTemplate
    - field: E-invoicing provider
      rule: Provider name, endpoint and test endpoint, credential reference (never the secret), participant id,
        format, mode Disabled / Test / Live, transmit-within hours.
      source: contracts/spine/finance.yaml#/components/schemas/FinEInvoicingProvider
    outputs:
    - element: Dependencies
      rule: '"Used by 214 products at 3 venues", read-only, beside the profile; a change shows who it will affect
        from its effective date.'
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - element: Worked preview
      rule: 'Line-level preview of one sample basket: base, discount, taxable base, each tax in application order
        (tax on tax visible), rounding, payable.'
      source: DI-596 | DI-598 | contracts/spine/finance.yaml#/components/schemas/TaxCalculation
    actions:
    - action: Save profile
      result: Saves a new version from its effective date; the previous version stays for history.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - action: Switch e-invoicing to Live
      result: Only after a test document was accepted; until then Live is disabled with the reason.
      source: contracts/spine/finance.yaml#/components/schemas/FinEInvoicingProvider
    edgeCases:
    - case: Two profiles apply to the same product and channel
      expected: Flag the conflict before saving; the validation centre (ADM-077) lists it as overlapping.
      source: contracts/spine/catalogue.yaml#listCalculationValidationReconciliation
    - case: A three-decimal currency legal entity
      expected: Preview and examples at three decimals (BHD 12.500 + VAT 10% = BHD 13.750).
      source: DI-306 | DI-598
    consistency:
    - with: ADM-068
      note: The command centre lists these profiles and opens this screen to create or edit one.
    - with: BO-075
      note: The finance tax codes (rate, account, compounding) must carry the same names as these profiles.
    - with: POS-026
      note: Receipt and invoice layout comes from the template set here.
    sampleData:
      profiles:
      - UAE VAT Standard · VAT · AE · federal · 5% · discounted price · Aquaventure Leisure LLC · TRN 100123456700003
        · from 1 Jan 2018
      - 'Egypt VAT · VAT · EG · 14% · price before discount · Cairo Festival City venue · EGP 500.00 ticket, 20%
        off: pays EGP 400.00 + VAT EGP 70.00 = EGP 470.00'
      - 'Dubai Tourism Dirham · Tourism tax · AE · municipality · fixed amount · venue: Atlantis Aquaventure'
      template: 'SINV- · resets yearly · next 004813 · English + Arabic · VAT receipt on every paid order: on ·
        simplified up to AED 10,000.00'
    corrections:
    - what: Every field is drawn as a select, including name, registration number and dates.
      why: Text and date inputs; selects only for type, country, level and status.
      source: screens/P08-venue-back-office.yaml#ADM-069
    - what: Five tax types are action buttons with no operation.
      why: They are values of one tax-type list (eight values, VAT and GST included).
      source: screens/P08-venue-back-office.yaml#ADM-069 | contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - what: The taxable base, rate, jurisdiction level and applicability are missing from the layout.
      why: The taxable base is the field that implements tax on the pre-discount price; without it the 1 September
        rule cannot be configured.
      source: DI-598 | contracts/spine/catalogue.yaml#setTaxProfileJurisdiction
    - what: The screen declares no read of existing profiles.
      why: Its "as saved" state has nothing to load; the profile list is read by the command centre's list operation.
      source: screens/P08-venue-back-office.yaml#ADM-069 | contracts/spine/catalogue.yaml#listTaxFeeCalculation
    - what: Saving a tax profile is gated by the product-configuration permission at venue scope.
      why: The permission set has a tax-configuration right, used by the finance tax operations; a tax profile is
        a legal setting.
      source: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction | contracts/shared/permissions.yaml#/components/schemas/Permission
    decisions:
    - question: 'Who configures tax profiles: platform staff in the console under a grant, or the client''s finance team?'
      decision: 'Drawn default accepted: The client''s finance team enters rates and registrations (the contract says so);
        platform staff only under a grant.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-078 | CHG-NOTE-003
      questionSource: contracts/spine/catalogue.yaml#setTaxProfileJurisdiction | R098
    - question: Is the VAT receipt issued automatically on every paid order?
      decision: 'Drawn default accepted: On for UAE legal entities (the template default is off).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-079 | CHG-NOTE-003
      questionSource: contracts/spine/finance.yaml#/components/schemas/FinTaxInvoiceTemplate
  ADM-077:
    summary: 'The last check before pricing and tax changes go live: configuration findings (missing profiles, invalid
      rates, overlapping rules, rounding problems) and the results of stored test scenarios, each compared against
      expected totals. It also records which e-invoices were sent, accepted or failed. The one thing to get right:
      a critical finding blocks progress, so critical items are first and say exactly what to fix.'
    inputs:
    - field: Filters
      rule: Findings or scenario results; area (Tax, Fees, Formula, Currency, Reconciliation, Test suite); severity;
        passed or failed.
      source: contracts/spine/catalogue.yaml#listCalculationValidationReconciliation
    outputs:
    - element: Findings
      rule: Severity, area, what was checked in words (Missing tax profile, Invalid rate, Overlapping rule, Rounding
        difference…), the message, and a link to the profile, rule or currency concerned. Critical first.
      source: contracts/spine/catalogue.yaml#/components/schemas/CalculationValidationReconciliationServiceInterfaceView
    - element: Scenario results
      rule: Scenario (standard web sale, POS sale, member sale, group booking, B2B sale, refund, reschedule, multi-product
        order, package sale, multi-currency sale), passed or failed, and expected against actual for line, tax,
        fee, discount and final totals, with the difference highlighted; the calculation version used.
      source: contracts/spine/catalogue.yaml#/components/schemas/CalculationValidationReconciliationServiceInterfaceView
    - element: E-invoice transmissions
      rule: Document, status (Queued, Sent, Accepted, Rejected, Failed), attempts, provider message; failed and
        rejected first.
      source: contracts/spine/finance.yaml#/components/schemas/FinEInvoiceTransmissionStatus
    actions:
    - action: Resend e-invoices
      result: Queues the selected failed or rejected documents again.
      source: contracts/spine/finance.yaml#transmitEInvoices
    edgeCases:
    - case: A rounding difference of one fil on a scenario
      expected: Shown as a failure with the exact difference (AED 0.01); never hidden by display rounding.
      source: contracts/spine/catalogue.yaml#/components/schemas/CalculationValidationReconciliationServiceInterfaceView
    - case: A critical finding exists
      expected: A banner "Changes cannot be published until 1 critical issue is fixed".
      source: contracts/spine/catalogue.yaml#listCalculationValidationReconciliation
    consistency:
    - with: ADM-068
      note: '"Validate configuration" on the command centre opens this screen.'
    - with: ADM-069
      note: Findings link back to the profile to fix.
    sampleData:
      findings:
      - Critical · Tax · Overlapping rule · 'UAE VAT Standard' and 'Free zone 0%' both apply to Retail at Beach
        Shop
      - Warning · Currency · Invalid precision · BHD price list has 2 decimals
      scenarios:
      - POS sale · passed · total AED 728.00 = AED 728.00 · version calc-2026.10.01-3
      - Package sale · failed · tax expected AED 34.67, actual AED 34.68 · difference AED 0.01
    corrections:
    - what: The screen has a blank table and unlabelled buttons, and its gaps say the pack gives nothing to draw.
      why: The 29 September close-out defined the rows (findings and scenario results with expected against actual
        totals); the layout should be rebuilt from that shape.
      source: screens/P08-venue-back-office.yaml#ADM-077 | contracts/spine/catalogue.yaml#listCalculationValidationReconciliation
    - what: Nothing runs the test suite or re-validates; the screen only lists results.
      why: The pack's regression run before major changes has no trigger operation on this screen.
      source: contracts/spine/catalogue.yaml#listCalculationValidationReconciliation
  ADM-411:
    summary: 'The operator-led step where TICVAI staff capture who TICVAI invoices: the legal name, tax registration
      (TRN) and its certificate, billing address and contact, invoicing frequency and payment method. The company
      that pays may not be the company that operates the venue, and the invoice must carry the payer''s legal details
      exactly.'
    inputs:
    - field: the company we invoice is different from the venue operator
      rule: A switch, off by default. On reveals a second block for the operating company; the invoice goes to the
        billing company, the licence to the operator.
      source: screens/P09-platform-admin-console.yaml#ADM-411 | DI-830
    - field: legal name, trade licence number, TRN, TRN certificate
      rule: Legal name exactly as on the trade licence. TRN shown for VAT-registered countries; the certificate is uploaded
        as a PDF or image and checked against the typed number. Not registered for VAT is an explicit choice, not a blank.
        Saved on a billing-entity record (the invoiced company and its TRN certificate) in the subscription contract. The
        required documents are configurable per country; the default is the trade licence always and the VAT certificate when
        a TRN is entered.
      source: DI-830 | contracts/satellite/subscription.yaml#/components/schemas/PartnerDocument | contracts/spine/finance.yaml#/components/schemas/LegalEntity
        | decided 2 October 2026 by Chinmay (CHG-NOTE-003)
    - field: country, currency, fiscal year start
      rule: Country first; currency and its decimals follow from it; fiscal year start defaults to January (UAE)
        and April for India.
      source: MATRIX 5.7.38 | DI-263
    - field: invoicing frequency and payment method
      rule: Monthly or annual; bank transfer or card. Values come from the commercial model already accepted on
        the previous step.
      source: DI-830
    outputs:
    - element: invoice preview
      rule: A small preview of the invoice header as it will print (legal name, address, TRN), so a typo is caught
        before the first invoice.
      source: designer default
    actions:
    - action: Validate and continue
      result: Checks required fields and the TRN format; saves; continues to payment method. Errors name the field.
      source: screens/P09-platform-admin-console.yaml#ADM-411
    edgeCases:
    - case: the TRN on the certificate does not match the typed TRN
      expected: Blocks continue with "The TRN on the certificate is different from the one entered."
      source: designer default
    - case: a group with several venues in two countries
      expected: One billing entity per country, because each invoice carries one country's tax.
      source: MATRIX 5.7.38
    consistency:
    - with: SGN-020
      note: Same fields, same order and same words; SGN-020 is the self-service twin and the two are kept in step.
    sampleData:
      billingCompany: Sharjah Leisure Holding PJSC · TRN 100217384600003 · PO Box 26300, Sharjah · accounts@shleisure.ae
      operator: Al Majaz Leisure Parks LLC · operates Al Majaz Waterfront Fun Zone
      invoicing: Monthly · bank transfer · AED
    corrections:
    - what: The screen calls createLegalEntity, which creates the tenant's own ledger entity (chart of accounts,
        fiscal periods) and has no billing address, billing contact or TRN certificate.
      why: The customer TICVAI invoices is a commercial-account record on the subscription side, not a ledger entity
        in the tenant's cell; the onboarding application carries no TRN or billing address either.
      source: contracts/spine/finance.yaml#createLegalEntity | contracts/satellite/subscription.yaml#submitOnboardingApplication
        | DI-830
    - what: '"Commercial Customer ≠ Operating Venue" is drawn as the primary button.'
      why: It is a rule about the data (payer may differ from operator), so it is a switch, not an action.
      source: screens/P09-platform-admin-console.yaml#ADM-411
    decisions:
    - question: Which record holds the invoiced company (billing entity) and its TRN certificate?
      decision: A new billing-entity record (invoiced company and TRN certificate) in the subscription contract.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-209 | CHG-NOTE-003
      questionSource: contracts/satellite/subscription.yaml#submitOnboardingApplication | DI-830
    - question: Which document types are mandatory per country (trade licence, VAT certificate)?
      decision: Trade licence always; VAT certificate when a TRN is entered; configurable per country.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-210 | CHG-NOTE-003
      questionSource: contracts/satellite/subscription.yaml#/components/schemas/PartnerDocument
  ADM-619:
    summary: 'The hub of the reconciliation and settlement board: how much TICVAI recorded against what providers
      reported, how much matched, what did not, what settlement was expected against what arrived, and how many
      exceptions are open. Reconciliation runs ingest, parse, match, classify, auto-resolve, so a person only sees
      genuine mismatches; the hub must make that visible as a funnel, not a wall of numbers.'
    inputs:
    - field: day, venue, provider
      rule: Settlement is one provider, one venue, one trading day; the default view is yesterday for all venues
        and providers, with a range for trends.
      source: contracts/spine/finance.yaml#ingestSettlementFile | R110
    outputs:
    - element: headline tiles
      rule: 'In this order: TICVAI transaction value, Provider transaction value, Matched transactions and Match
        rate (matched over lines, 2 decimals), Unmatched transactions and value, Settlement expected, Settlement
        received, Settlement variance (Over or Short), Provider fees, Refund settlement value, Open exceptions.
        Variance and open exceptions are emphasised.'
      source: screens/P09-platform-admin-console.yaml#ADM-619 | contracts/spine/finance.yaml#/components/schemas/Settlement
    - element: reconciliation funnel
      rule: Lines ingested, parsed, matched automatically, auto-resolved, left for review; the last number is the
        one a person acts on.
      source: DI-258 | MoM 2026-08-12 11. Settlement and Reconciliation Process
    - element: feeds
      rule: Each source with its last file time and freshness; a late feed is amber, a failed one red.
      source: contracts/satellite/payments.yaml#listReconciliationSources
    actions:
    - action: open a settlement
      result: Opens the exception centre for that settlement.
      source: screens/P09-platform-admin-console.yaml#ADM-619
    edgeCases:
    - case: the provider file has not arrived
      expected: The day shows "File not received" rather than a 100% unmatched day.
      source: contracts/satellite/payments.yaml#listReconciliationSources
    - case: a provider file in a different currency from the ledger
      expected: The difference is not computed; the row says the currencies differ.
      source: contracts/spine/finance.yaml#/components/schemas/Settlement
    consistency:
    - with: BO-043 Daily Reconciliation
      note: The venue's own daily screen uses the same settlement records and must use the same status words and
        match-rate formula.
    sampleData:
      day: 30 Sep 2026 · Aquaventure Waterpark · Network International
      tiles: TICVAI AED 612,480.00 · Provider AED 610,030.00 · Matched 8,912 of 8,941 (99.68%) · Unmatched 29, AED
        2,450.00 · Expected AED 594,265.60 · Received AED 594,265.60 · Fees AED 12,104.40 · Open exceptions 4
      shortRow: 29 Sep 2026 · Motiongate Dubai · Stripe · expected AED 48,212.75 · received AED 47,712.75 · Short
        AED 500.00
    corrections:
    - what: The names of ADM-619 to ADM-628, their transitions, flow F262 and the contracts' consumed-by lists carry
        a literal tab and the pack page number ("Command Center\t139").
      why: Parsing artefact that will print on screen titles and breadcrumbs.
      source: screens/P09-platform-admin-console.yaml#ADM-619 | F262 step 1 | contracts/spine/finance.yaml#listSettlements
    - what: The pack's settlement states (Expected, Pending, Received, Partially received, Variance, Overdue) describe
        the payout; the contract's settlement status describes processing the file (ingesting, parsing, matching,
        matched, has exceptions, resolved, failed), and the record has no expected date or received amount.
      why: Settlement expected, received and overdue cannot be shown from the declared data.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementStatus | screens/P09-platform-admin-console.yaml#ADM-619
    decisions:
    - question: Whose settlements does this platform screen show, TICVAI's own payment orchestration across tenants or one
        tenant's?
      decision: 'Drawn default stands (answer: "Cross-tenant ops view: amounts per tenant, no guest data"): Cross-tenant operational
        view for TICVAI payment operations, amounts per tenant, no guest data.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-211 | CHG-NOTE-003
      questionSource: screens/P09-platform-admin-console.yaml#ADM-619 | contracts/spine/finance.yaml#listSettlements
    - question: The 12 August minutes say monthly file reconciliation; the contract decided daily per venue. Confirm daily.
      decision: Reconciliation is daily per venue.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-212 | CHG-FIN-009 | CHG-NOTE-003
      questionSource: DI-268 | MoM 2026-08-12 17. Payments Reconciliation | R110
  ADM-622:
    summary: 'The queue of reconciliation exceptions that the automatic steps could not explain: each with what
      TICVAI recorded, what the provider reported, the difference and the likely cause, and a resolution that is
      recorded with who, when and why. Nothing is ever edited; resolving explains, it does not change the payment.'
    inputs:
    - field: resolution
      rule: One of Matched manually (requires choosing the payment), Write-off, Dispute raised, Provider error,
        Timing difference; a note is always required.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementResolution | contracts/spine/finance.yaml#resolveSettlementException
    - field: filters
      rule: Exception kind, provider, venue, age, amount band; oldest and largest first by default.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementException
    outputs:
    - element: exception row
      rule: Kind in words (Not in provider file, Not in our records, Amount differs, Duplicate in provider file,
        Unexplained fee), provider reference, our payment, amount, expected amount, difference with Over or Short,
        age in days.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementException
    actions:
    - action: Resolve
      result: Records the resolution; the row leaves the open list and shows in the settlement's history with the
        resolver's name.
      source: contracts/spine/finance.yaml#resolveSettlementException
    edgeCases:
    - case: two people resolve the same exception
      expected: The second sees "Already resolved by Omar Haddad at 10:41" and nothing is overwritten.
      source: contracts/spine/finance.yaml#resolveSettlementException
    - case: an unresolved exception at month end
      expected: It blocks the period close ("Settlements reconciled").
      source: F13 step 1 | contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult
    consistency:
    - with: BO-043 Daily Reconciliation and BO-025 Chargebacks & Disputes
      note: Same five resolution words and the same exception kind wording.
    sampleData:
    - Amount differs · NI ref 4471-0930-88213 · payment POS-0441871 · AED 1,200.00 vs AED 1,250.00 · Short AED 50.00
      · likely partial refund · 1 day
    - Not in provider file · Stripe · order WEB-0098340, Fatima Al Mansoori · AED 385.00 · 2 days
    corrections:
    - what: The exception list is read per settlement (the path needs a settlement), so a centralised queue across
        settlements and providers has no read; the screen also loads it on action, not on arrival.
      why: The screen's purpose is the cross-settlement queue.
      source: contracts/spine/finance.yaml#listSettlementExceptions | screens/P08-venue-back-office.yaml#ADM-622
    - what: The pack's columns (order, merchant account, related refund or reversal, match result) are not on the
        exception record, which carries a payment reference only.
      why: Columns cannot bind.
      source: contracts/spine/finance.yaml#/components/schemas/SettlementException
  ADM-623:
    summary: 'Expected against actual settlement per provider, merchant account and day: gross sales, minus refunds,
      chargebacks, fees, adjustments and any reserve held back, gives net expected; net received is what reached
      the bank. The gap between them, and how long it has been open, is what this screen is for.'
    outputs:
    - element: settlement row
      rule: Provider, merchant account, legal entity, settlement day, then the bridge Gross sales, Refunds, Chargebacks,
        Fees, Adjustments, Reserve, Net expected, Net received, and the variance as Over or Short. Currency on every
        amount.
      source: screens/P08-venue-back-office.yaml#ADM-623
    - element: ordering
      rule: Unsettled and short first, then by age.
      source: designer default
    edgeCases:
    - case: settlement arrives in two payments
      expected: Shown as Partially received with both receipts listed.
      source: screens/P09-platform-admin-console.yaml#ADM-619
    consistency:
    - with: ADM-619
      note: Same tiles as the hub's settlement expected, received and variance.
    sampleData:
    - Network International · MID 4471-AQV · UAE01 · 30 Sep · Gross 612,480.00 · Refunds 4,860.00 · Chargebacks
      1,250.00 · Fees 12,104.40 · Net expected AED 594,265.60 · Received 594,265.60 · Settled
    - Stripe · acct_MGD · UAE02 · 29 Sep · Net expected AED 48,212.75 · Received 47,712.75 · Short AED 500.00 ·
      2 days
    corrections:
    - what: Of the 16 pack columns, acquirer, merchant account, legal entity, refunds, chargebacks, adjustments,
        reserve, net expected, net received and settlement date have no field on the settlement record (it carries
        provider gross, fees, net and ledger gross).
      why: The payout bridge cannot be drawn from the contract.
      source: contracts/spine/finance.yaml#/components/schemas/Settlement
  ADM-626:
    summary: 'The gate between reconciliation and the ledger: which reconciled settlements are ready to post, which
      are held by open exceptions, what was posted, and whether the period can close. Posting is append-only; a
      wrong posting is reversed, never edited.'
    outputs:
    - element: posting queue
      rule: Ready to post, Held (with the reason), Posted (with the journal number); counts and values per day.
      source: screens/P08-venue-back-office.yaml#ADM-626 | contracts/spine/finance.yaml#/components/schemas/PeriodCloseResult
    actions:
    - action: Post
      result: Posts the selected ready settlements; each gets a journal number; confirmation names the total and
        the period.
      source: designer default
    edgeCases:
    - case: posting into a period that is closing
      expected: The posting goes to the next open period with a reference to the trading date.
      source: F13 step 4
    sampleData:
    - 30 Sep 2026 · 14 settlements ready · AED 3,112,940.25 · 2 held (open exceptions)
    corrections:
    - what: The only operation is recordSettlement, which settles an inter-entity obligation (one entity paying
        another, at the obligation's rate), and the screen expects an obligation id.
      why: Nothing here posts reconciled provider settlements; the screen's operation serves a different process.
      source: contracts/spine/finance.yaml#recordSettlement | screens/P08-venue-back-office.yaml#ADM-626
    decisions:
    - question: Do settlement postings happen automatically after reconciliation, or through this release gate?
      decision: 'Drawn default stands (answer: "Automatic when fully matched; the screen shows status and held days"): Automatic
        for fully matched days; this screen shows status and the held ones.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-213 | CHG-NOTE-003
      questionSource: DI-258
  ADM-627:
    summary: 'The evidence trail of how one payment became reconciled and closed: ingested from which file, matched
      how, which exception, who resolved it with what reason and approval, and which journal posted it. Read-only
      and exportable for auditors.'
    outputs:
    - element: trail
      rule: 'A timeline, oldest first: file ingested, line matched or exception raised, resolution (user, action,
        previous state, new state, reason, time, approval), journal posted, period closed. Each step links to its
        record.'
      source: screens/P08-venue-back-office.yaml#ADM-627 | contracts/spine/finance.yaml#/components/schemas/SettlementException
    actions:
    - action: Export evidence
      result: PDF of the trail with the source file reference; retained with payment records for 10 years.
      source: ADR-0047
    sampleData:
    - '30 Sep 22:10 file NI-20260930-AQV.csv ingested · 1 Oct 02:14 amount differs AED 50.00 · 1 Oct 10:41 Omar
      Haddad: Timing difference, note ''partial refund settles 2 Oct'' · 2 Oct 06:00 matched · JE-2026-10-000311'
    corrections:
    - what: The audit columns (user, action, previous state, new state, reason, timestamp, approval) are drawn as
        select fields under a configuration pattern.
      why: They are a read-only trail, not settings.
      source: screens/P08-venue-back-office.yaml#ADM-627
    - what: getUnifiedReconciliation returns totals and variances for a date range; it returns no trail.
      why: The evidence comes from the exception's resolver, time and note and from the audit log.
      source: contracts/spine/finance.yaml#/components/schemas/UnifiedReconciliation
  ADM-628:
    summary: 'Forward look at settlement cash: expected settlement and cash receipt by date, after provider fees,
      refund and chargeback deductions and conversion, plus a what-if simulator. Every projected figure is labelled
      Forecast; with too little history the screen says so instead of drawing a line.'
    outputs:
    - element: forecast table
      rule: Expected settlement, Expected cash receipt, Provider fees, Refund deductions, Chargeback deductions,
        Currency conversion, Merchant account payout, by expected settlement date; values labelled "Forecast" with
        the basis period.
      source: screens/P08-venue-back-office.yaml#ADM-628 | DI-973
    - element: not enough history
      rule: '"Not enough settlement history to forecast yet (needs 90 days; 23 days so far)" with the actuals shown
        instead.'
      source: DI-280
    edgeCases:
    - case: AI advice
      expected: Explains why a figure moved and suggests an action; never posts, resolves or approves anything.
      source: DI-719 | DI-735
    sampleData:
    - Forecast · Fri 4 Sep · expected settlement AED 980,000 · basis last 8 Fridays
    - Forecast · Sun 6 Sep · AED 760,000
    corrections:
    - what: The forecast is served by getUnifiedReconciliation, which returns past totals and variances only.
      why: No operation returns a settlement forecast.
      source: contracts/spine/finance.yaml#/components/schemas/UnifiedReconciliation
    decisions:
    - question: Is the reconciliation simulator and AI advisor in phase one, given AI finance reporting is phase two?
      decision: 'Drawn default stands (answer: "Actuals now; forecast and advisor drawn but switched off"): Build the actuals
        view; forecast and advisor drawn but switched off.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-214 | CHG-NOTE-003
      questionSource: DI-278 | DI-280
  PTR-014:
    summary: 'A partner''s own money with the venue: how it pays (credit account invoiced monthly, prepaid wallet
      drawn down per sale, or card per transaction), what it has paid, what is due, and its statement of account.
      The partner sees only its own records and can download them; it never sees the venue''s acquirer settlements.'
    inputs:
    - field: period
      rule: Daily, weekly, monthly or a custom range for the statement.
      source: contracts/satellite/subscription.yaml#listPartnerStatementAccount
    outputs:
    - element: payment model card
      rule: 'One card for the partner''s model. Credit: limit, used (including booked but not yet invoiced), available,
        payment terms, next invoice date. Prepaid: wallet balance and last top-up. Card: "Paid at each booking",
        last 5 payments.'
      source: DI-555 | contracts/satellite/payments.yaml#listB2bCreditAccounts
    - element: statement of account
      rule: Opening balance, invoices, payments received, credit memos, closing balance, then the dated lines; an
        ageing summary (current, 30, 60, 90+ days) beside it for credit partners.
      source: DI-557 | contracts/satellite/subscription.yaml#listPartnerStatementAccount
    - element: payment history
      rule: Date, method (bank transfer, cheque, card, wallet top-up), reference, amount, allocated to which invoices.
      source: DI-555
    actions:
    - action: Download statement
      result: PDF or Excel of the statement for the period.
      source: contracts/satellite/subscription.yaml#listPartnerStatementAccount
    - action: Raise a query on a line
      result: Opens a dispute case on that line (Partner Disputes, Cases & Service).
      source: DI-557
    edgeCases:
    - case: a link to another partner's settlement
      expected: Refused within the partner's scope; offers the partner's own list.
      source: screens/P10-partner-reseller-portal.yaml#PTR-014
    - case: credit nearly used up
      expected: Amber at the warning level, with "Bookings above AED 8,500.00 will need prepayment".
      source: contracts/satellite/payments.yaml#listB2bCreditAccounts
    consistency:
    - with: PTR-013 Credit Limit & Balance, PTR-046 Partner Statement & Account Activity, PTR-017 Commission Statement
      note: The same balance figures; PTR-014 is the partner's summary of what those screens show in detail.
    sampleData:
      partner: Desert Rose Tours LLC · credit account · limit AED 250,000.00 · 30 days
      statement: September 2026 · Opening AED 118,450.00 · Invoiced 96,200.00 · Payments 120,000.00 (bank transfer,
        15 Sep) · Credit memos 3,150.00 · Closing AED 91,500.00
      ageing: Current 62,300.00 · 31–60 days 29,200.00 · 61–90 0.00 · 90+ 0.00
      prepaidPartner: Al Noor Travel & Tourism · prepaid · balance AED 42,300.00 · last top-up 20,000.00 on 28 Sep
    corrections:
    - what: The screen binds the payment-provider settlement records and offers "Ingest settlement file" and "Resolve
        settlement exception"; those operations declare the partner audience and partner write scope.
      why: A settlement there is an acquirer file for a venue's trading day; a partner must neither ingest it nor
        resolve the venue's acquirer exceptions. Partner settlement is the three payment models and the statement
        of account.
      source: contracts/spine/finance.yaml#ingestSettlementFile | contracts/spine/finance.yaml#resolveSettlementException
        | DI-555 | DI-557 | TRACKER Actions row 185
    - what: Flow F99 (a chargeback is defended) routes step 3 through this partner screen.
      why: Chargebacks are defended by finance (BO-025 for the venue; the chargeback operations are consumed by
        ADM-633 and ADM-634); partners take no part.
      source: F99 step 3 | contracts/spine/orders.yaml#listChargebacks | contracts/spine/orders.yaml#respondToChargeback
    - what: The purpose "Take the money, and be unambiguous about whether it worked" is a checkout purpose.
      why: Derived from the name, not from a requirement.
      source: screens/P10-partner-reseller-portal.yaml#PTR-014
    decisions:
    - question: Does PTR-014 survive next to PTR-013, PTR-046 and PTR-017, or merge into PTR-046?
      decision: 'Drawn default stands (answer: "Keep as the partner''s Payments summary"): Keep it as the partner''s "Payments"
        summary with links into the statement.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-222 | CHG-NOTE-003
      questionSource: DI-557
  PTR-018:
    summary: 'A partner''s own sales performance: bookings, tickets, gross sales, commission earned, cancellations,
      by product and period, in a fixed set of partner reports. The partner sees only what it sold.'
    outputs:
    - element: performance
      rule: Tickets sold, gross sales, commission (from the commission statement), cancellations and refunds, top
        products; comparison with the previous period.
      source: DI-557 | contracts/satellite/subscription.yaml#getCommissionStatement
    sampleData:
    - Desert Rose Tours · September 2026 · 3,420 tickets · gross sales AED 820,800.00 · commission 8% AED 65,664.00
      · top product Aquaventure Day Pass Adult
    corrections:
    - what: The partner screen loads the venue's financial statements (profit and loss, balance sheet, cash flow),
        and that operation declares the partner audience.
      why: A partner must never see the venue's financial statements.
      source: contracts/spine/finance.yaml#getFinancialReport | screens/P10-partner-reseller-portal.yaml#PTR-018
    - what: Partners are given create, change and delete of report definitions and saving of natural-language queries.
      why: Definitions run over the tenant's data sources; a partner gets a fixed partner-scoped set.
      source: screens/P10-partner-reseller-portal.yaml#PTR-018 | contracts/satellite/reporting.yaml#createReport
  SUP-008:
    summary: 'A support supervisor''s view of agents: cases handled, SLA met and breached, first response and resolution
      times, workload and quality, by agent, queue and channel.'
    outputs:
    - element: agent row
      rule: Agent, cases handled, SLA met % (2 decimals), breached, median first response, median resolution, open
        now.
      source: TRACKER Actions row 179 | TRACKER Actions row 181 | contracts/satellite/marketing-crm.yaml#listCases
    sampleData:
    - Mariam Al Suwaidi · 142 cases · SLA met 92.96% (132 of 142) · 10 breached · first response 4 min · resolution
      3 h 20 min · 6 open
    corrections:
    - what: The screen is bound to report definitions, the venue's financial statements and the conversation inbox;
        no case or SLA read is declared, although cases filter by agent and by breached SLA.
      why: Nothing on the screen can show agent performance or SLA; the financial statements do not belong here.
      source: contracts/satellite/marketing-crm.yaml#listCases | contracts/satellite/marketing-crm.yaml#listSlaPolicies
        | contracts/spine/finance.yaml#getFinancialReport
  KIT-010:
    summary: 'Kitchen performance over a period: where time is lost, by station and by hour, with forecast demand
      beside it and a few recommendations, each with its expected effect. This is a manager''s analytical view,
      not the live ticket rail. The one thing to get right: a recommendation is something to judge, so each shows
      its expected effect, its cost and its confidence, and nothing is applied from here.'
    inputs:
    - field: Period
      rule: Last 7 / 30 / 90 days; default 30.
      source: screens/P15-kitchen-display.yaml#KIT-010
    - field: Kitchen
      rule: The kitchens the person may see; default the device's kitchen.
      source: screens/P15-kitchen-display.yaml#KIT-010
    outputs:
    - element: Headline tiles
      rule: Tickets (with change against the prior period), average preparation time in minutes, on-time percentage
        against its target, re-fire rate, peak throughput in tickets per hour.
      source: screens/P15-kitchen-display.yaml#KIT-010
    - element: Preparation time against demand by hour
      rule: Bars for ticket volume and a line for average preparation time, with the target as a reference line;
        a caption names when preparation time crosses the target ("19:30–21:00"). Two axes need their units stated.
      source: screens/P15-kitchen-display.yaml#KIT-010 | MATRIX 8.7.1
    - element: Station table
      rule: Station, tickets, average preparation, on-time, re-fires; the constraint station is called out in words.
      source: screens/P15-kitchen-display.yaml#KIT-010
    - element: Demand forecast, next 7 days
      rule: Labelled Forecast, against last week's actual; shows the peak hour against current capacity.
      source: DI-973 | screens/P15-kitchen-display.yaml#KIT-010
    - element: Recommendations
      rule: At most three, each with expected effect ("+6.2 pts on-time"), cost or risk ("labour AED 180 per service",
        "4% waste risk") and confidence.
      source: screens/P15-kitchen-display.yaml#KIT-010 | MATRIX 8.6.21 | MATRIX 3.6.37
    actions:
    - action: Review all recommendations
      result: Opens the recommendation list; accepting one is done by a person on the routing or rota screen it
        names.
      source: screens/P15-kitchen-display.yaml#KIT-010 | F20 step 2
    edgeCases:
    - case: Not enough history (first weeks after go-live)
      expected: '"Not enough history yet: forecasts start after 4 weeks of service." Tiles show what exists; the
        forecast panel is empty with that sentence.'
      source: DI-280 | screens/P15-kitchen-display.yaml#KIT-010
    - case: Offline
      expected: Not available; the live rail on KIT-001 is what keeps working.
      source: screens/P15-kitchen-display.yaml#KIT-010
    consistency:
    - with: KIT-001
      note: The live rail owns bumping tickets and ticket cards; this screen owns analysis only.
    - with: ANL-003
      note: The same preparation-time and on-time definitions as the operational performance board.
    sampleData:
      header: Main Kitchen · last 30 days · 12,486 tickets
      tiles:
      - Tickets 12,486 +8.2%
      - Avg prep 12.8 min +0.6
      - On-time 92.6% · target 95%
      - Re-fire rate 1.4% −0.3 pts
      - Peak 96 tickets/hour
      stations:
      - Grill · 4,286 · 15.4 min · 86.2% · 72 re-fires
      - Fryer · 3,142 · 8.6 min · 95.4% · 24
      - Cold Kitchen · 1,884 · 9.8 min · 96.8% · 11
      recommendations:
      - Add a second grill cook 19:00–21:30 · +6.2 pts on-time · labour AED 180 per service · confidence 91%
      - Pre-sear patties at 18:45 · −2.1 min · 4% waste risk · confidence 78%
    corrections:
    - what: The layout and states describe the live rail (ticket cards, Bump, "No tickets, the kitchen is clear").
      why: The client pack frame for this screen (FNB-3K) is the performance and AI analysis drawn above; the rail
        and Bump belong to KIT-001.
      source: screens/P15-kitchen-display.yaml#KIT-010
    - what: The screen reads a generic dashboard, while the pack names kitchen performance, station performance,
        demand forecast and recommendation reads, and an "insufficient data" state.
      why: The tiles above have no declared source until those reads exist or a seeded dashboard is defined for
        them.
      source: screens/P15-kitchen-display.yaml#KIT-010
    decisions:
    - question: Is this shown on the kitchen display device (no one signed in) or only to a signed-in kitchen manager?
      decision: 'Drawn default accepted: A signed-in manager; the assistant and recommendations need a person whose role scopes
        the answer.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-087 | CHG-NOTE-003
      questionSource: DI-964 | screens/P15-kitchen-display.yaml#KIT-010
  ANL-001:
    summary: 'The executive home of the one consolidated reporting area: a CEO or GM opens it (often on a phone)
      and in ten seconds knows today''s gross sales, net revenue, visitors, transactions and occupancy against target
      and against the comparison period, plus the few things raised that need a person. It implements the client''s
      Executive Performance board and the Board 1 command-centre first section, and the F&B / Retail / POS executive
      command centres through one domain selector. The one thing to get right: every money tile names its measure
      (Gross sales, Net revenue, Takings) and carries its comparison, status band and "as of" time.

      '
    inputs:
    - field: domain
      rule: 'Multi-select of the modules this login is entitled to (licensed and holding a permission), never a
        fixed list; a module the tenant has not licensed is not shown, not greyed. A user with F&B, retail and ticketing
        sees one combined view by default (all selected).

        '
      source: contracts/satellite/reporting.yaml#getCommandCentre | MoM 2026-09-08 4.11 Dashboard & Reporting Module
        Consolidation Strategy | DI-721 | DI-387
    - field: period
      rule: 'Defaults to Today in the venue''s time zone for this board (the client''s executive tiles are "today
        vs forecast / vs yesterday"); offers Yesterday, This week, This month, Custom. The generic "last week by
        default" state text does not apply here (see corrections).

        '
      source: MATRIX 8.7.1 | MATRIX 8.9.8 | MATRIX 8.2.34 | MATRIX 8.7.21 | MATRIX 6.1.78 | MATRIX 8.7.24
    - field: compareTo
      rule: 'One comparison per view, chosen from Previous period, Same period last year, Target. Default Previous
        period; the delta and its arrow follow the KPI''s "higher is better" flag (refund % going up is red).

        '
      source: contracts/satellite/reporting.yaml#getKpiValues | contracts/satellite/reporting.yaml#/components/schemas/KpiDefinition
    outputs:
    - element: headline KPI row
      rule: 'In this order: Gross sales, Net revenue, Visitors (admissions), Transactions, Occupancy %. Then a second
        row: Tickets sold, Average ticket value, Refund %, Variance to target. Each is a number mark with comparison,
        variance, sparkline and status icon as tile parameters. Occupancy % is admitted-on-site over the configured
        park capacity, not tickets sold over capacity.

        '
      source: DI-698 | MATRIX 8.7.1 | MATRIX 5.12.72 | MATRIX 8.7.27 | MATRIX 8.7.21 | MATRIX 8.7.25
    - element: measure labels
      rule: 'Gross sales = issued sales before discounts and refunds; Net revenue = Gross sales minus Discounts
        minus Refunds (adjusted per finance policy). Never a bare "Revenue" tile. The seeded "takings" KPI is payments
        less refunds — show it only as "Takings", never as Net revenue. Recognised revenue does not belong on this
        board''s operational row; if shown, it is its own labelled tile.

        '
      source: MATRIX 5.12.6 | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
    - element: status band
      rule: 'KPI status green / amber / red renders as Normal / Warning / Critical with an icon and text, never
        colour alone; "no target" shows no band at all rather than a neutral colour that reads as fine.

        '
      source: contracts/satellite/reporting.yaml#/components/schemas/KpiValue | DI-704
    - element: freshness
      rule: 'Each tile shows "As of HH:MM" (or "Updated 40 sec ago" when live) from its own asOf; a stale tile keeps
        its last number with a "Stale — last updated 09:12" warning instead of blanking. Tiles load independently.

        '
      source: MATRIX 8.7.22 | contracts/satellite/reporting.yaml#/components/schemas/KpiValue
    - element: trend chart
      rule: 'Line mark: Actual, Forecast, Last year across the day (Day / Week / Month toggle). The forecast series
        is dashed and labelled "Forecast" with its range band; it never extends the actual line.

        '
      source: MATRIX 8.2.26 | MATRIX 8.7.1 | MATRIX 8.7.25 | MATRIX 8.2.34 | MATRIX 6.1.78 | DI-973 | contracts/satellite/ai.yaml#/components/schemas/AiForecastPoint
    - element: alerts panel
      rule: 'Critical first, then unacknowledged, then by age; each line shows the rule''s name, what went out of
        range and the observed value against the threshold. Max five on the home, "View all" opens the alert centre.

        '
      source: contracts/satellite/reporting.yaml#listAlerts | contracts/satellite/reporting.yaml#/components/schemas/Alert
    - element: AI executive summary
      rule: 'Short narrative insights with the time last updated; every figure in a sentence comes from a query
        result and links to its evidence. Shown as a panel, not as a tile mark (narrative is refused as a mark).

        '
      source: MATRIX 8.4.14 | MATRIX 8.7.31 | MATRIX 8.9.9 | MATRIX 8.7.1 | contracts/satellite/ai.yaml#listAiInsights
        | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    actions:
    - action: open a KPI tile
      result: 'Drill-through to the owning dashboard with the filter context (domain, venue, period) carried and
        a visible Back: Net revenue opens Revenue Pulse, Visitors opens Attendance & Footfall, Occupancy opens Capacity
        & Utilization, Refund % opens refund transaction detail.

        '
      source: MATRIX 8.7.28 | MATRIX 2.12.13 | MATRIX 6.1.78 | MATRIX 8.9.10
    - action: Ask for a suggestion
      result: 'Opens the AI panel pre-scoped to the selected tile or alert; the suggestion is advice only, applied
        by a person in the owning module. Nothing on this screen changes trading.

        '
      source: contracts/satellite/ai.yaml#/components/schemas/Suggestion | DI-719
    edgeCases:
    - case: The CEO opens the bookmarked link on a phone
      expected: KPI row becomes a 2-column stack, charts full-width, alerts collapse to a count; same numbers and
        freshness labels as desktop.
      source: DI-696 | MoM 2026-09-08 4.1 Rationale for a Native BI/Reporting Platform
    - case: The login holds venue scope only
      expected: Figures cover only that venue; no tenant total and no venue switcher entries beyond its scope; hidden
        sections are absent, not greyed.
      source: DI-061 | contracts/satellite/reporting.yaml#getCommandCentre
    - case: A tenant with an AED venue and a BHD venue selects "All venues"
      expected: Money tiles show one subtotal per base currency (AED 2 dp, BHD 3 dp); they are never summed into
        one figure.
      source: contracts/shared/common.yaml#/components/schemas/Money | DI-306
    - case: One tile's source pipeline has not refreshed
      expected: That tile shows its stale warning; the rest render normally; the page is never blanked.
      source: MATRIX 6.1.78
    consistency:
    - with: ANL-013
      note: 'ANL-001 owns the headline numbers only; ANL-013 Revenue Pulse owns the revenue breakdowns and intraday
        comparisons. The Gross sales and Net revenue tiles must use the same KPI definitions and labels on both.

        '
    - with: ANL-020
      note: ANL-001 is the single-scope home; site-against-site comparison belongs to ANL-020, not a second table
        here.
    - with: BO-100
      note: The back-office venue hub reads the same seeded takings/admissions KPIs; same labels and same "as of"
        pattern.
    sampleData:
      venue: Aquaventure Waterpark, Dubai (base currency AED)
      asOf: Wed 30 Sep 2026, as of 14:32
