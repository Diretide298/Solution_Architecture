  ANL-002:
    summary: 'The sales board for a commercial or F&B/retail manager: how products and attractions sell by channel,
      what discounts and upsell/cross-sell did, deferred against recognised revenue, and sales forecast against
      target. It answers the 8 Sep "Sales board" input and the client packs'' FNB-6B / RET-6L frame. The one thing
      to get right: sales measures (gross, net) and accounting measures (recognised, deferred) sit in separate,
      labelled sections and are never added together or drawn on one axis.

      '
    inputs:
    - field: channel filter
      rule: 'Channel values are the platform''s closed list — POS, Kiosk, Web, Mobile app, B2B, OTA, Call centre.
        When the client''s "B2C" grouping is used, it is a named group of Web + Mobile app + Kiosk, shown as such
        in the legend.

        '
      source: contracts/spine/catalogue.yaml#/components/schemas/Channel | MATRIX 8.7.4 | MoM 2026-08-18 4.2 Recipes,
        Operating Hours & Service Channels | MATRIX 1.4.7
    - field: domain
      rule: Ticketing, F&B, Retail; the same product-by-channel analysis whatever the domain, only the item vocabulary
        differs.
      source: screens/P16-venue-analytics.yaml#ANL-002 | DI-721
    outputs:
    - element: product / attraction by channel
      rule: 'Table (or stacked bar for the top 10) of Net revenue and units per product by channel, sorted by Net
        revenue descending, with a totals row computed server-side. Top 10 by default, "Show all" pages.

        '
      source: DI-715 | MoM 2026-09-08 4.9 Sales, Finance, Operations & CRM Boards
    - element: discounts and upsell / cross-sell
      rule: 'Discounts shown as a negative bridge item against Gross sales, not as revenue. Upsell and cross-sell
        revenue is attributed revenue and labelled "Attributed to upsell" so it is not read as additional sales
        on top of Net revenue.

        '
      source: DI-715 | MoM 2026-09-08 4.9 Sales, Finance, Operations & CRM Boards | contracts/satellite/reporting.yaml#/components/schemas/MetricSource
    - element: deferred vs recognised
      rule: 'Separate section "Revenue recognition": Recognised revenue and Deferred revenue for the period, by
        channel. POS sales recognise at sale; online tickets on visit or redemption; gift cards on redemption; annual
        passes straight-line or per visit; breakage on expiry. Say "Recognised", never "Realised".

        '
      source: MoM 2026-09-08 4.9 Sales, Finance, Operations & CRM Boards | MATRIX 5.12.6 | contracts/spine/finance.yaml#/components/schemas/RecognitionMethod
    - element: forecast vs target
      rule: 'Line: Actual net revenue to date, Forecast (dashed, with its p10–p90 range band) and Target. The forecast
        series is always labelled "Forecast".

        '
      source: MoM 2026-09-08 4.9 Sales, Finance, Operations & CRM Boards | DI-973 | contracts/satellite/ai.yaml#/components/schemas/AiForecastPoint
    actions:
    - action: click a channel in any visual
      result: Cross-filters every subscribed visual and the product table to that channel; a filter breadcrumb shows
        it with Clear.
      source: MATRIX 6.1.78 | MATRIX 8.7.28 | MATRIX 8.9.10
    - action: drill a product row
      result: Product → performance/time slot → orders (drill-through to the order list with filters carried and
        Back visible).
      source: MATRIX 8.7.28 | MATRIX 8.9.10 | DI-709
    - action: Run report
      result: Runs the underlying report for export; large results return asynchronously with "We'll notify you
        when it is ready".
      source: contracts/satellite/reporting.yaml#runReport
    edgeCases:
    - case: A day with 10,000+ order lines is drilled to transactions
      expected: Paged, virtualised table; the UI stays responsive; totals come from the server, not summed on screen.
      source: DI-710
    - case: Refunds exceed sales for a product in the period
      expected: Net revenue shows as a negative value in red with a minus sign; bars below zero baseline.
      source: MATRIX 6.1.78
    consistency:
    - with: ANL-016
      note: 'Overlap (DI-715 is scoped to both). Proposed split: ANL-016 owns the cross-channel KPI scorecard and
        channel mix (gross, net, transactions, conversion, basket, discount use); ANL-002 owns product/attraction-by-channel
        detail, upsell/cross-sell and the revenue-recognition section. Both read the same KPI definitions.

        '
    - with: BO-1081
      note: Recognised and deferred figures must equal the Finance Dashboard's for the same period and scope.
    sampleData:
      venue: Dubai Parks — Motiongate (AED)
      period: September 2026 to date
      rows:
      - Motiongate 1-Day Pass · Web · 21,406 units · Net revenue AED 6,250,552.00
      - Motiongate 1-Day Pass · OTA · 9,880 units · Net revenue AED 2,617,212.00
      - Fast Pass add-on · POS · 3,114 units · Net revenue AED 404,820.00 · attributed to upsell
      recognition: Recognised revenue AED 7,912,400.00 · Deferred revenue AED 1,355,164.00 (tickets dated after
        today)
      forecast: 'Forecast for 30 Sep: AED 412,000.00 (range AED 368,000.00 – AED 451,000.00)'
    corrections:
    - what: The screen declares no KPI read, but the board must show forecast vs target and variance.
      why: getDashboard tiles carry report results only; target, variance and status come from getKpiValues, and
        the forecast from ai.getForecast.
      source: screens/P16-venue-analytics.yaml#ANL-002 | contracts/satellite/reporting.yaml#getKpiValues | contracts/satellite/ai.yaml#getForecast
    - what: The notes say the screen answers "Sales, Revenue & Channel Analytics" twice and is the same as the F&B
        and retail frames, but DI-715 scopes it together with ANL-016.
      why: Two sales boards with no stated ownership will drift; the split must be decided (see consistency).
      source: DI-715 | screens/P16-venue-analytics.yaml#ANL-002
    decisions:
    - question: Is "B2C" a reporting group (Web + Mobile + Kiosk) or should Channel gain a b2c value?
      decision: 'Drawn default accepted: Show the platform channels, with B2C as a labelled group.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-310 | CHG-NOTE-003
      reviewable: true
      questionSource: MoM 2026-08-18 4.2 Recipes, Operating Hours & Service Channels | MATRIX 1.4.7 | MATRIX 8.7.4
    - question: Merge ANL-002 into ANL-016, or keep both with the split proposed?
      decision: 'Drawn default accepted: Keep both with the split proposed.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-311 | CHG-NOTE-003
      reviewable: true
      questionSource: DI-715
  ANL-003:
    summary: 'Period performance of operating units — outlet, store, venue or department — for an operations or
      F&B / retail manager: revenue, transactions, items sold, attachment rate, service and stock exceptions, ranked
      by unit. It answers the client''s F&B / Retail board and the packs'' outlet/store/venue operations frames
      (four board screens, one screen filtered by scope level). The one thing to get right: one table of units with
      the same columns at every scope level, drillable down the hierarchy, not four different layouts.

      '
