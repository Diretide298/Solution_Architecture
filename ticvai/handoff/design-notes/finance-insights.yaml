  ANL-020:
    summary: 'Multi-site comparison for enterprise management: compare sites, venues, attractions or business units
      on like-for-like KPIs, this month against last month or the same period last year, and drill into why they
      differ. It is also the landing of the client''s Board 1. The one thing to get right: the normalisation basis
      (per visitor, per operating hour, per staffed position, per m²) travels with every comparison.

      '
    inputs:
    - field: sites
      rule: Multi-select of sites in scope (labelled by name; never a scope path).
      source: contracts/satellite/reporting.yaml#getAnalyticsBenchmark
    - field: normalise by
      rule: None, Per visitor, Per operating hour, Per staffed position, Per square metre; default Per visitor for
        money KPIs.
      source: contracts/satellite/reporting.yaml#/components/schemas/BenchmarkNormalisation
    - field: period and comparison
      rule: This month vs last month (default) or vs same period last year.
      source: DI-701
    outputs:
    - element: comparison table
      rule: 'Rows = sites, columns = KPIs; each cell shows the normalised value with the raw value beneath, the
        rank and the change vs the comparison period; the basis is in the column header ("Net revenue per visitor").

        '
      source: contracts/satellite/reporting.yaml#/components/schemas/BenchmarkRow
    - element: ranking chart
      rule: Sorted bar per KPI; ribbon (rank over time) cannot bind yet.
      source: MATRIX 8.7.25 | contracts/satellite/reporting.yaml#/components/schemas/DashboardTile
    - element: AI reasons
      rule: '"Possible reasons" panel for the selected gap, opening root-cause analysis.'
      source: DI-701
    edgeCases:
    - case: A site has no basis for the period (visitors not recorded)
      expected: '"No basis for this period" in its cells; it is not ranked.'
      source: contracts/satellite/reporting.yaml#/components/schemas/SiteNormalisationBasis
    - case: Sites in different base currencies
      expected: Money KPIs are not ranked across currencies unless converted; shown per currency group.
      source: contracts/shared/common.yaml#/components/schemas/Money
    - case: A venue manager opens the board
      expected: The comparison needs tenant scope; the screen says "Site comparison needs group access" rather than
        showing one site against itself.
      source: contracts/satellite/reporting.yaml#getAnalyticsBenchmark
    consistency:
    - with: ANL-001
      note: The single-scope numbers on ANL-001 must equal the same site's raw value here.
    - with: ANL-064
      note: Normalisation bases are maintained on ANL-064; ANL-020 only shows them as footnotes per site.
    sampleData:
      period: September 2026 vs August 2026
      rows:
      - Aquaventure Waterpark · Net revenue per visitor AED 131.80 (rank 1, +4.2%) · F&B spend per visitor AED 34.20
      - Dubai Parks — Motiongate · AED 97.45 (rank 2, −1.8%) · AED 22.10
      - House of Wisdom, Sharjah · AED 42.10 (rank 3, +0.6%) · AED 8.90
      basis: 'Visitors: Aquaventure 284,100 · Motiongate 402,560 · House of Wisdom 31,780'
