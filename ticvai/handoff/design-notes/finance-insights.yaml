    outputs:
    - element: scorecard
      rule: 'Gross sales, Discounts, Refunds, Net revenue, Transactions, Tickets sold, Average order value, Conversion,
        Cancellations, Commission (B2B/OTA), Attributed to upsell, Attributed to cross-sell. Discounts, refunds
        and commission shown as negatives in brackets.

        '
