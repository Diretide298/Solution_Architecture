  ANL-014:
    summary: 'Attendance and footfall: how many people came, when, through which gates, on what tickets, and how
      that compares with what was sold and with the forecast. It implements the admissions half of the client''s
      Admissions & Capacity board and the access-control part of the Operations board. The one thing to get right:
      attendance is counted by visit date (scans), not by sale date, and ticketed vs actual uses the same visit
      date.

      '
    inputs:
    - field: period
      rule: Visit date range, default Last 7 days; labelled "Visit date" so it is not confused with sale date.
      source: MATRIX 1.1.40 | MATRIX 8.8.3
    outputs:
    - element: counts
      rule: Total visitors (admitted entries), Entries, Exits, Current visitors on site, Repeat visits, No-show
        %.
      source: MATRIX 1.1.40 | MATRIX 6.1.69 | MATRIX 8.1.2 | MATRIX 3.2.65 | contracts/satellite/reporting.yaml#/components/schemas/ReportingSystemKpi
    - element: admission conversion
      rule: '"Ticketed vs actual" = admitted tickets over valid issued tickets for the visit period, as a %, with
        both counts shown.'
      source: MATRIX 1.1.40 | MATRIX 8.7.21
    - element: hourly footfall
      rule: Heatmap hour × weekday of entries; Peak entry time stated in words ("Peak 10:00–11:00, 1,912 entries").
      source: MATRIX 6.1.69 | MATRIX 6.1.70
    - element: by gate
      rule: Entries by gate/turnstile as a sorted bar.
      source: DI-717
    - element: forecast
      rule: Next 7 days attendance as a dashed Forecast line with its range, after the actuals.
      source: screens/P16-venue-analytics.yaml#ANL-014 | DI-973 | MATRIX 8.2.1
    - element: average visit duration
      rule: From the time between entry and exit scans; shown only where exits are scanned.
      source: MATRIX 3.2.65
    actions:
    - action: drill
      result: Venue → attraction → ticket type → time slot → scan detail.
      source: MATRIX 8.7.28 | DI-709
    edgeCases:
    - case: Complimentary tickets
      expected: Counted in attendance; excluded from average ticket value where policy says so; the exclusion is
        stated.
      source: MATRIX 8.1.3 | MATRIX 6.1.66
    - case: Daylight-saving or time-zone boundary venue (multi-country tenant)
      expected: Hours are local to each venue; the heatmap never mixes time zones.
      source: MATRIX 6.1.78
    consistency:
    - with: ANL-012
      note: Same entry/exit/on-site definitions; ANL-012 is live, ANL-014 is the period view.
    - with: ANL-015
      note: ANL-014 owns people counts; ANL-015 owns capacity and utilisation. No-show % appears on both and must
        match.
    sampleData:
      venue: Aquaventure Waterpark
      period: Visit date 23–29 Sep 2026
      counts: Visitors 58,214 · Exits 55,902 · Repeat visits 9,840 · No-show 4.1%
      ticketedVsActual: Admitted 58,214 of 60,705 valid tickets (95.9%)
      peak: Peak 10:00–11:00 Fri, 1,912 entries
      byGate: 'Main Gate 1: 22,410 · Main Gate 2: 19,880 · Beach Gate: 15,924'
      forecast: Forecast Thu 01 Oct 8,900 (likely 8,100 – 9,650)
    corrections:
    - what: The forecast attendance the purpose promises has no declared read.
      why: Forecast visitors come from ai.getForecast (subject attendance); only getKpiValues is declared.
      source: screens/P16-venue-analytics.yaml#ANL-014 | contracts/satellite/ai.yaml#getForecast
    - what: Per-gate (turnstile) breakdown is not among the tiles.
      why: DI-717 asks for per-turnstile breakdowns explicitly.
      source: DI-717
    - what: '"Attendance by Site / Attraction / Ticket Type / Product / Timeslot" are single metric tiles.'
      why: They are breakdowns; bar or table marks.
      source: screens/P16-venue-analytics.yaml#ANL-014
  ANL-015:
    summary: 'Capacity and utilisation: where capacity is under-used, filling up or full, by attraction, time slot
      and inventory item, and what is still available to sell. It implements the capacity half of the Admissions
      & Capacity board and DI-700''s capacity section. The one thing to get right: utilisation''s definition (consumed
      or reserved over sellable) and how holds and blocked inventory are treated must be visible on the screen.

      '
    outputs:
    - element: capacity cards
      rule: Sellable capacity, Booked, Held, Used (admitted), Remaining (available to sell), Utilisation %, No-show
        %, Peak utilisation.
      source: MATRIX 6.1.70 | MATRIX 8.2.36 | MATRIX 1.1.40 | MATRIX 8.9.2 | contracts/satellite/reporting.yaml#/components/schemas/MetricSource
    - element: utilisation by attraction / slot
      rule: Gauge only for the headline (a target range exists); per attraction a sorted bar with the 80% and 95%
        reference lines; per time slot a heatmap.
      source: MATRIX 1.1.40 | MATRIX 8.2.36 | MATRIX 8.7.21 | MATRIX 6.1.69
    - element: status bands
      rule: Normal under 80%, Warning 80–95%, Critical 95% and above; tenant-configurable via KPI targets.
      source: MATRIX 8.2.36 | MATRIX 1.1.40 | contracts/satellite/reporting.yaml#/components/schemas/KpiTarget |
        DI-704
    - element: forecast utilisation
      rule: Labelled "Forecast", dashed, with range.
      source: DI-973 | MATRIX 8.2.36
    actions:
    - action: open a time slot
      result: Drill-through to capacity configuration for that product and slot (an authorised workflow link, permission-checked).
      source: MATRIX 2.12.1 | MATRIX 16.9.58 | MATRIX 8.9.10
    edgeCases:
    - case: Capacity reduced mid-day (a ride closes)
      expected: Utilisation recomputes against the new sellable capacity; the change is marked on the chart.
      source: designer default
    - case: Holds exceed 10% of capacity
      expected: Held shown as its own segment so utilisation is not overstated.
      source: MATRIX 8.2.36 | MATRIX 1.1.40
    consistency:
    - with: ANL-012
      note: ANL-012's occupancy (people on site now) is not ANL-015's utilisation (sold or reserved over sellable);
        different labels.
    - with: ANL-014
      note: No-show % identical.
    sampleData:
      venue: Dubai Parks — Motiongate, Sat 03 Oct 2026
      cards: Sellable 14,000 · Booked 11,620 · Held 480 · Remaining 1,900 · Utilisation 86.4% (Warning)
      slots:
      - 10:00 Dreamworks Tour · 98% · Critical
      - 14:00 Hunger Games Mockingjay · 72% · Normal
      forecast: Forecast utilisation Sat 89% (likely 84% – 93%)
    corrections:
    - what: Two utilisation-like metrics exist (occupancy = sold + leased vs capacity; capacityUtilisation = remaining
        over the window) and the screen does not say which "Utilization %" is.
      why: Two definitions under one label is the drift the KPI register exists to prevent.
      source: contracts/satellite/reporting.yaml#/components/schemas/MetricSource | MATRIX 8.2.36 | MATRIX 1.1.40
        | MATRIX 8.9.2
    - what: Forecast utilisation has no declared read.
      why: It comes from ai.getForecast (subject attractionUtilisation / occupancy).
      source: contracts/satellite/ai.yaml#getForecast | MATRIX 8.2.35 | MATRIX 8.2.36
    - what: DI-704's example leaves 90–95% undefined (80–90 warning, above 95 critical).
      why: The board spec's 80/95 rule closes the gap; DI-704's example should be corrected.
      source: DI-704 | MATRIX 8.2.36 | MATRIX 1.1.40
    decisions:
    - question: Do holds and blocked inventory count as consumed in utilisation?
      decision: 'Drawn default accepted: Count holds as reserved (in utilisation), exclude blocked from sellable.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-322 | CHG-NOTE-003
      reviewable: true
      questionSource: MATRIX 8.2.36 | MATRIX 1.1.40
  ANL-016:
    summary: 'Sales and channel performance: one scorecard of commercial performance across POS, B2C (web, app,
      kiosk), B2B and OTA, with conversion, basket size, discount use and channel mix. It implements the client''s
      Sales & Channel board and DI-700''s channel section. The one thing to get right: Net revenue (not "Net Sales")
