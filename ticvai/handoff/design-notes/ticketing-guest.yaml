        status: fixed
        by: CHG-GST-003
      - what: '"Keep ownership and rename the holder" (DI-200) has no operation.'
        why: transferOrderTickets moves ownership; renaming the holder is not declared.
        source: DI-200; contracts/spine/orders.yaml#transferOrderTickets

