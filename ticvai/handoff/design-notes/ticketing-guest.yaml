        source: screens/P02-guest-mobile-app.yaml#GST-052 transitions
    edgeCases:
      - case: A preset includes rides a child is too short for
        expected: The plan leaves them out and says so ("Freefall Tower needs 1.40 m").
        source: screens/P02-guest-mobile-app.yaml#GST-053 (Left out for your group)
    consistency:
      - with: GST-053
        note: The preset opens as an ordinary editable plan.
      - with: WEB-050
        note: The web planner has no presets; it asks the six questions.
    sampleData:
      presets:
        - {name: Thrill day, park: Summit Peaks, pace: Packed, highlights: ["Freefall Tower", "Summit Coaster", "The Drop"], from: "AED 410 pp with Fast Track"}
        - {name: Family day, park: Summit Peaks, pace: Balanced, highlights: ["Junior Circuit", "Sunset Parade", "Adventure Play Area"]}
        - {name: Relaxed day, park: Coastal Aqua, pace: Relaxed, highlights: ["Lazy River", "Cabana Row", "Poolside Bar"]}
    corrections:
      - what: The presets are bound to listProducts and a raw "Every bundle" table.
        why: No operation returns the venue's preset plans; listProducts returns products, not presets. A source for presets (configuration or an operation) is missing.
        source: screens/P02-guest-mobile-app.yaml#GST-052 layout
      - what: No prototype frame (match none).
        why: Needs a frame.
        source: screens/P02-guest-mobile-app.yaml#GST-052 wireframe
    decisions:
    - question: Who defines the ready-made plans per venue, and where?
      decision: 'Drawn default accepted: The venue configures presets as saved planner inputs per park.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-111 | CHG-NOTE-007
      questionSource: screens/P02-guest-mobile-app.yaml#GST-052 (Ready-made plans notes)

  GST-053:
    summary: >-
      Your Plan, day by day: swap, remove, add, undo, add Fast Track, then Book this plan. Block A. The 30
      September rules: each day tab names its park and every item, swap and suggestion comes from that
      park only; retail shops and kiosks join dining as stops; a preference a park cannot meet is said in a
      "Not at this park" banner, never filled from another park.
    outputs:
      - element: day timeline
        rule: >-
          Arrive, then timed rides and shows with their zone and walking time, lunch at a restaurant serving
          the chosen cuisine, shop or kiosk stops; Fast Track marked on the rides it covers; live waits next
          to today's rides.
        source: DI-1098; DI-1100; screens/P02-guest-mobile-app.yaml#GST-053 (The day)
      - element: left out
        rule: Items left out for a child's height with the limit; a must-see none of the chosen parks has.
        source: screens/P02-guest-mobile-app.yaml#GST-053 (Left out for your group)
      - element: Not at this park
        rule: Per day, names the cuisine or shop and the park that has it, or says no park has it; lunch is then the park's best other restaurant, marked as such.
        source: DI-1113; screens/P02-guest-mobile-app.yaml#GST-053 (Not at this park)
      - element: estimated total
        rule: For the group and days, labelled an estimate; confirmed in the basket.
        source: DI-1098 (associated costing)
    actions:
      - action: Swap / Add / Remove / Undo
        result: A sheet of candidates that suit everyone, from that day's park; each change a new version, Undo goes back one; arrival and lunch cannot be removed.
        source: screens/P02-guest-mobile-app.yaml#GST-053 layout
      - action: Book this plan
        result: Tickets, Fast Track and meal combos as basket lines, then the basket (GST-041).
        source: contracts/satellite/venue-map.yaml#bookVisitPlan
      - action: Share
        result: An in-app QR a friend scans to join the plan.
        source: DI-241; DI-218
      - action: Refine with the AI planner
        result: Opens the chat (GST-054) when the venue has AI on; its suggestions also stay within the day's park.
        source: DI-1112
    consistency:
      - with: WEB-050
        note: Same plan rules; the web has no AI chat.
      - with: GST-059
        note: The same plan followed on the day.
    sampleData:
      day1: "Day 1 · Fri 2 Oct · Summit Peaks"
      items: ["09:30 Arrive · Main Gate", "09:45 Summit Coaster · Fast Track · 5 min", "11:00 Sky Swing", "12:30 Lunch · The Crater Grill (Emirati)", "14:00 Summit Store", "16:00 Sunset Parade"]
      banner: "No Indian restaurant at Summit Peaks. Indian food is at Aqua Park (day 2)."
      estimate: Estimated AED 1,840 for 2 adults and 2 children
    corrections:
      - what: Group sharing (in-app QR, agreed 10 August) is not drawn and no operation backs it.
        why: The notes say sharing was agreed but do not say whether it is in the Block A planner.
        source: DI-241; screens/P02-guest-mobile-app.yaml#GST-053 notes
    decisions:
    - question: Is plan sharing by QR in the Block A planner?
      decision: 'Drawn default accepted: Draw a Share button; leave it out of the build until confirmed.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-112 | CHG-NOTE-007
      questionSource: DI-241

  GST-059:
    summary: >-
      Plan in progress: today's plan while in the venue, re-ordered against live waits. Block A.
      Rules-based; the guest always decides a re-order.
    outputs:
      - element: today
        rule: Done, now and next; each ride with its live wait; a stale wait marked "as of".
        source: screens/P02-guest-mobile-app.yaml#GST-059 (Today); screens/P01-guest-web-storefront.yaml#WEB-039 (wait time notes, R080 b)
      - element: waits changed
        rule: '"Vortex is now 50 min. Swap with Lazy River (5 min) and come back at 15:30?" with Re-order my day and Keep.'
        source: screens/P02-guest-mobile-app.yaml#GST-059 (Waits changed)
    actions:
      - action: Directions
        result: Opens the map with walking navigation to the next item.
        source: screens/P02-guest-mobile-app.yaml#GST-059 transitions; DI-1102
    consistency:
      - with: GST-053
        note: Same plan, today's day only.
      - with: GST-021
        note: Directions use the map's walking navigation.
    sampleData:
      now: "Now · Sky Swing · 15 min"
      next: "Next · 12:30 Lunch · The Crater Grill · 6 min walk"
    corrections:
      - what: No prototype frame (match none).
        why: Needs a frame.
        source: screens/P02-guest-mobile-app.yaml#GST-059 wireframe

  GST-021:
    summary: >-
      The venue map with walking navigation (the Map view of At the Venue, one implementation with
      GST-038). Block A. 3D from the venue's model where supplied, with turn-by-turn and the guest's dot
      moving along the route; the 2D map with the same route otherwise. Built natively, no external
      mapping service.
    outputs:
      - element: navigation mode
        rule: >-
          After Start on a destination card: a banner with the next turn and its distance, metres to go,
          arrival time and a progress bar; the dot moves along the route; End navigation stops it.
        source: AUDIT-29SEP (At venue, mobile map Start); DI-1102
      - element: weak position
        rule: The dot dims with an approximate ring labelled "Position approximate"; the turn list stays; "I am at…" lets the guest tap a nearby place.
        source: screens/P02-guest-mobile-app.yaml#GST-021 states.weakGps
    actions:
      - action: Nearest food / toilets / first aid
        result: Picks the nearest open point and starts navigation.
        source: DI-1102
    edgeCases:
      - case: No 3D model, a weak phone or rendering below 20 fps
        expected: The 2D map with the same route; never an error.
        source: screens/P02-guest-mobile-app.yaml#GST-021 states.map3dUnavailable; DI-1103
    consistency:
      - with: WEB-039
        note: Same points and waits; navigation is app-only.
      - with: GST-004
        note: An item's pin opens here.
    sampleData:
      destination: "The Crater Grill · 240 m · 4 min"
      banner: "Turn left at Canyon Rapids · 60 m"
    corrections:
      - what: Product filters "Venue id", "Kind", "Is sellable" and an "Every product" table on the map.
        why: The map filters by point category; the filters are generated.
        source: screens/P02-guest-mobile-app.yaml#GST-021 layout
        status: fixed
        by: CHG-GST-003
      - what: A transition to BO-096 (an attendant checks what is free) from flow F25.
        why: A guest app does not navigate to the back office.
        source: screens/P02-guest-mobile-app.yaml#GST-021 navigation
      - what: The 3D-unavailable and weak-GPS states are not drawn.
        why: Both need frames.
        source: screens/P02-guest-mobile-app.yaml#GST-021 wireframe.prototype.differences

  GST-027:
    summary: >-
      Reserve and pay for parking in the app; same rules as WEB-041 (through the basket, no live bay count,
      plate only for ANPR car parks). Block A (wave 3).
    inputs:
      - field: plate
        rule: Only for ANPR car parks, with the emirate; editable until entry.
        source: DI-300
    edgeCases:
      - case: Full for the day
        expected: Said after trying, with the other car parks.
        source: screens/P02-guest-mobile-app.yaml#GST-027 states.soldOutForDay
    consistency:
      - with: WEB-041
        note: Same car parks and messages.
      - with: GST-028
        note: Confirmation next.
    sampleData:
      carPark: "Premium · by the gate · AED 80 · Fri 2 Oct · Dubai K 48213"
    corrections:
      - what: 'The purpose reads "Take the money, and be unambiguous about whether it worked."'
        why: A generic payment purpose; this screen chooses a car park and adds it to the basket.
        source: screens/P02-guest-mobile-app.yaml#GST-027 purpose
      - what: Separate Check out and Pay buttons and a plate form exposing status.
        why: Checkout is the basket's; status is not a guest field.
        source: screens/P02-guest-mobile-app.yaml#GST-027 layout

  GST-028:
    summary: >-
      Parking confirmed: the pass to show or scan, with car park, date and plate. Block A (wave 3). Reads
      the paid order; never creates anything.
    outputs:
      - element: parking pass
        rule: Car park and directions to it, date, plate, the QR (where the barrier or security reads one), and Change plate.
        source: screens/P02-guest-mobile-app.yaml#GST-028 (The order the parking was paid on); DI-300
    consistency:
      - with: GST-027
        note: Previous step.
    sampleData:
      pass: "Premium · by the gate · Fri 2 Oct · Dubai K 48213 · Order YAS1-000125"
    corrections:
      - what: '"Venue id" text field and an "Every parking facility" table on a confirmation screen.'
        why: The confirmation shows one order's parking.
        source: screens/P02-guest-mobile-app.yaml#GST-028 layout
        status: fixed
        by: CHG-GST-003

  GST-032:
    summary: >-
      The AI concierge chat: answers about tickets, food, shops, timings and the guest's own bookings,
      grounded in the venue's data, with a hand-over to a person. Block A (wave 2). Shown as mascot art
      (Sahli) or a plain button per the venue.
    inputs:
      - field: message
        rule: Free text in English or Arabic; suggested questions as chips ("What's open now?", "Where is my booking?").
        source: DI-207; DI-388
    outputs:
      - element: answer
        rule: Short answers with cards the guest can act on (a product to book, a food order to track, a map pin); "Was this helpful?" on each answer.
        source: DI-207; screens/P02-guest-mobile-app.yaml#GST-032 apis (recordAnswerFeedback)
    actions:
      - action: Talk to a person
        result: Hands the conversation to an agent with a summary; the guest sees "Connecting you to our team".
        source: contracts/satellite/marketing-crm.yaml#handoverToAgent
    edgeCases:
      - case: The venue has no AI or the guest's scope excludes a request
        expected: Says what it cannot do and offers the manual route (book from Buy tickets, help centre), never an error.
        source: screens/P02-guest-mobile-app.yaml#GST-032 notes (degrades to the manual planner); DI-1069
      - case: Offline
        expected: Unavailable with the reason; past conversations readable.
        source: screens/P02-guest-mobile-app.yaml#GST-032 states.offline
    consistency:
      - with: GST-033
        note: Contextual help opens the same conversation.
    sampleData:
      guest: Is the Lazy River open today?
      answer: "Yes, until 18:00. The wait is about 5 minutes. Want directions?"
    corrections:
      - what: '"Create guest F&B order" is the primary action with a form exposing id, lines, quotedTotal, recordedAt.'
        why: An order made from the chat is confirmed on a card in the conversation; the raw form is not a guest screen.
        source: screens/P02-guest-mobile-app.yaml#GST-032 overlays.formCreateGuestFnbOrder
        status: fixed
        by: CHG-GST-003
      - what: Purpose "Add ai concierge – chat for this venue" and no prototype frame.
        why: The purpose is generated and the screen needs a frame; DI-195 deferred the chat design to the AI workshop.
        source: screens/P02-guest-mobile-app.yaml#GST-032 purpose; DI-195
    decisions:
    - question: Is the concierge chat design settled after the AI workshop?
      decision: 'Drawn default accepted: Draw the chat with grounded answers and hand-over; leave billing out of the guest
        UI.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-109 | CHG-NOTE-007
      questionSource: DI-195

  GST-037:
    summary: >-
      Offers and promotions in the app; same content as WEB-032, plus entering a code to see what it
      gives. Block A.
    inputs:
      - field: code
        rule: '"Have a code?" shows what it offers and its terms; it is applied in the basket, not here.'
        source: screens/P02-guest-mobile-app.yaml#GST-037 apis (getCouponCode); screens/P02-guest-mobile-app.yaml#GST-037 notes
    consistency:
      - with: WEB-032
        note: Same offers.
      - with: GST-041
        note: Codes are applied in the basket.
    sampleData:
      offers: ["Family Friday · 2 adults + 2 children AED 899", "15% off your next visit (members)"]
    corrections:
      - what: Filters Venue id, Status, Active at and a raw promotions table.
        why: Active offers for the venue only.
        source: screens/P02-guest-mobile-app.yaml#GST-037 layout
      - what: The prototype applies codes here; the package applies them in the basket.
        why: One place to apply a code (GST-041).
        source: screens/P02-guest-mobile-app.yaml#GST-037 wireframe.prototype.differences

  GST-067:
    summary: >-
      Ask for a refund or list a ticket for resale from the app. Block A. The venue's refund policy decides
      what is offered; the screen shows the answer (e.g. 100% more than 48 hours before, 50% 24 to 48
      hours, none within 24) and a refund is always a request until operations approve it.
    outputs:
      - element: refund policy line
        rule: The tier that applies now, before the guest asks ("You'll get 50% back, your visit is in 30 hours").
        source: DI-192; contracts/spine/orders.yaml#getRefundPolicy
      - element: where the money goes
        rule: Original payment method or wallet credit, as the venue allows; the guest picks when both are offered.
        source: DI-673
      - element: resale listing
        rule: >-
          Price within the venue's allowed range (e.g. 10 to 20% below the original), the market fee and what
          the guest receives; the ticket stays usable until sold, then the guest's QR stops working.
        source: DI-618; DI-621; contracts/spine/orders.yaml#createResaleListing
    edgeCases:
      - case: Ticket partly used, name-bound or past the resale window
        expected: Resale is not offered, with the reason.
        source: contracts/spine/orders.yaml#createResaleListing
    consistency:
      - with: WEB-019
        note: Same refund request on the web.
      - with: WEB-030
        note: Same resale rules.
    sampleData:
      refund: "2 park ticket × 3 · Fri 2 Oct · 50% back = AED 712.50 to Visa •••• 4242"
      resale: "List at AED 400 (range AED 380-427) · fee AED 20 · you receive AED 380"
    corrections:
      - what: A Waiver status panel bound to getWaiverStatus, whose response has no named schema.
        why: Unrelated to refunds and resale, and it cannot bind until the contract names the shape.
        source: screens/P02-guest-mobile-app.yaml#GST-067 gaps

  GST-071:
    summary: >-
      Payment methods: saved cards (masked), gift cards, wallet transfer and loyalty points, because to a
      guest they are all how I pay. Block A. The screen exists so a guest can see and remove a stored card.
    outputs:
      - element: saved card
        rule: Brand and last four ("Visa •••• 4242, expires 08/28"), default marked; never the full number.
        source: DI-069
    actions:
      - action: Add a card
        result: Through the gateway's card form with consent to store it.
        source: contracts/spine/orders.yaml#storePaymentToken
      - action: Redeem points
        result: Shows points, the rewards they buy and the value; redeeming confirms what is spent.
        source: contracts/satellite/marketing-crm.yaml#redeemLoyaltyPoints
    consistency:
      - with: WEB-021
        note: Same saved cards and gift card balance.
    sampleData:
      cards: ["Visa •••• 4242 · default", "Mastercard •••• 8810"]
      points: 2,450 points · worth AED 24.50
    corrections:
      - what: No operation removes a saved card, yet the screen's purpose is that a guest can remove one.
        why: Only listPaymentTokens and storePaymentToken exist in orders.yaml.
        source: screens/P02-guest-mobile-app.yaml#GST-071 purpose; contracts/spine/orders.yaml#listPaymentTokens
      - what: The redeem form asks for subjectId and programmeId; the transfer is bound to retail.yaml.
        why: The guest is the caller; the transfer is wallet.yaml's.
        source: screens/P02-guest-mobile-app.yaml#GST-071 overlays.formRedeemLoyaltyPoints; screens/P02-guest-mobile-app.yaml#GST-071 layout
      - what: The prototype's Account → Payment methods row opens Engine settings.
        why: A prototype wiring slip; the frame must open this screen.
        source: screens/P02-guest-mobile-app.yaml#GST-071 wireframe.prototype.differences

  GST-076:
    summary: >-
      Intercity trip, route and schedule, the first of four transport screens on the app. Block A (wave 3).
      On mobile Popular routes (route cards with a from-fare and Book) is the first transport product;
      a route opens with its stations filled in and departures listed at once, the time-period chips
      filter them, and passengers come after a departure is chosen.
    inputs:
      - field: stations
        rule: Prefilled from the route, changeable, with swap.
        source: DI-1109
      - field: time period
        rule: Chips with counts as filters; tap again to show all; no Search Trips.
        source: DI-1109
    outputs:
      - element: departures
        rule: Departs, arrives, duration, seats left, fare; full ones greyed.
        source: REV3-21
    actions:
      - action: Choose a departure
        result: Opens GST-077 for passengers and the route.
        source: DI-1110
    consistency:
      - with: WEB-049
        note: Same order and data; the app splits it across four screens.
    sampleData:
      route: "E201 · Abu Dhabi Central Bus Station → Al Ain Central Bus Station"
      departures: ["06:30 → 08:10 · 22 seats", "07:30 → 09:10 · 18 seats", "09:00 → 10:40 · Full"]
    corrections:
      - what: The action bar keeps a primary "Search Trips" button.
        why: Since 30 September departures load without a search.
        source: screens/P02-guest-mobile-app.yaml#GST-076 layout; DI-1109

  GST-077:
    summary: >-
      The chosen departure's route and passengers, then pay. Block A (wave 3). Passengers are asked here,
      never before a departure is chosen; the v4 build draws it as one scrolling Plan your trip screen
      with the departures above.
    inputs:
      - field: passengers
        rule: Adult; child 5-11 and student half fare; person of determination free with one companion at adult fare; proof checked at boarding.
        source: screens/P02-guest-mobile-app.yaml#GST-077 (Passengers)
    outputs:
      - element: price card
        rule: Line and direction, departs, arrives, seats, fare per type and total; route map (internet) or the stop list offline.
        source: screens/P02-guest-mobile-app.yaml#GST-077 layout
    edgeCases:
      - case: The departure has left or was cancelled
        expected: Says which and offers the next departure on the route.
        source: screens/P02-guest-mobile-app.yaml#GST-077 entryState.coldEntry
    consistency:
      - with: GST-049
        note: Seat choice on a departure with a seat map.
    sampleData:
      departure: "E201-Out · 07:30 → 09:10 · Adult × 2, Child × 1 · AED 70"
    corrections:
      - what: The screen's emptyNoResults says "No departure in that period" on a screen opened on one departure.
        why: The state belongs to GST-076.
        source: screens/P02-guest-mobile-app.yaml#GST-077 states.emptyNoResults

  GST-078:
    summary: >-
      Multi-trip passes for a station pair: 5-trip, 10-trip, weekly and monthly unlimited, each with its
      saving. Block A (wave 3).
    outputs:
      - element: pass card
        rule: Trips or validity, price, saving against single fares ("Save AED 35"), valid days.
        source: REV3-21; AUDIT-29SEP (Multi-trip)
    consistency:
      - with: WEB-049
        note: Same passes on the web's Multi-trip tab.
    sampleData:
      passes: ["5-trip · AED 125 · save AED 15", "10-trip · AED 230 · save AED 50", "Weekly unlimited · AED 180", "Monthly unlimited · AED 620"]
    corrections:
      - what: emptyNoResults says "No departure in that period".
        why: The empty state here is "No passes for this route".
        source: screens/P02-guest-mobile-app.yaml#GST-078 states.emptyNoResults

  GST-079:
    summary: >-
      Favourite routes: rebook a saved route in two taps, or remove it. Block A (wave 3). Signed-in guests
      only.
    outputs:
      - element: saved route
        rule: From and To, line, last booked; Book this route prefills the one-way search with departures listed.
        source: screens/P02-guest-mobile-app.yaml#GST-079 (Favourite routes); DI-1109
    consistency:
      - with: WEB-049
        note: Same favourites on the web.
    sampleData:
      routes: ["Dubai → Abu Dhabi · E101", "Abu Dhabi → Al Ain · E201"]
    corrections:
      - what: emptyNoResults says "No departure in that period".
        why: The empty state here is "No saved routes yet" with how to save one.
        source: screens/P02-guest-mobile-app.yaml#GST-079 states.emptyNoResults
  POS-002:
    summary: >-
      The cashier's ticket sale: category tiles, product cards and a persistent cart, with date, time and
      seats in a slide-in drawer so the cashier never leaves the sell screen. Block A. TICVAI-branded,
      large touch targets, dimmed background when a drawer opens. From the ticketing angle get right the
      drawer order by product type and the cart rules (link to sale by mobile, discounts on the cart
      only, several carts at once).
    inputs:
      - field: product
        rule: >-
          Category tiles (Attractions, Cinema, Events, Passes, Vouchers) then cards from the workstation's
          sale board; search box for events, tickets and customers; barcode scan of a partner code resolves
          to its product.
        source: DI-781; DI-247; contracts/spine/catalogue.yaml#resolveProductByCode
      - field: ticket drawer
        rule: >-
          Selecting a ticket opens a drawer: inclusions and rules first, then by product type: admission →
          quantities; dated → date; timed → date then session (POS-003 content); seated → date, session,
          zone, seats (POS-004 content). Add-ons are offered after the tickets, with the upsell prompt.
        source: DI-094; DI-116; DI-130; DI-096
      - field: link to sale
        rule: >-
          A search on the cart by mobile number (or email) finds or creates the guest inline; name alone is
          not a key. When the ticket is for someone else (a child's lesson), the holder's name and date of
          birth go on the ticket and the purchaser on the sale.
        source: DI-783; DI-784; DI-787
      - field: discount and promo code
        rule: Applied on the cart only (percentage, amount, promo code, staff code), never on the payment screen; a manual discount above the cashier's limit asks for a supervisor PIN.
        source: DI-786; F58 step 5; DI-324
      - field: ticket note
        rule: A short note per ticket line (e.g. "wheelchair user, needs lift access").
        source: DI-005
    outputs:
      - element: cart
        rule: >-
          Persistent on the right; lines as on the web ("Aqua Park Day Pass · Adult × 2"); seats and the
          booking fee as separate lines; automatic offers struck through; tabs for parked carts and "+" for
          a new cart.
        source: DI-782; DI-174; screens/P04-point-of-sale.yaml#POS-004 notes (booking fee a separate line)
      - element: header
        rule: Tickets sold and revenue for this shift; online or offline mode always visible.
        source: DI-090; DI-072
      - element: stock and capacity
        rule: In, Low, Out on cards; capacity products marked "Online only" when offline.
        source: screens/P04-point-of-sale.yaml#POS-002 wireframe.prototype.differences; DI-074
    actions:
      - action: Charge
        result: Opens Payment (POS-005) with the cart; refused without the take-payment permission, the cart held, not cleared.
        source: screens/P04-point-of-sale.yaml#POS-002 states.denied
      - action: Hold (F2)
        result: Parks the sale with a label; recall from Held Orders (POS-006).
        source: screens/P04-point-of-sale.yaml#POS-002 transitions
      - action: Reserve
        result: Holds the cart without payment as a reservation (POS-031); no tickets are issued.
        source: POSV2-2
      - action: History
        result: Opens the Sales Journal (POS-030) for this terminal and today.
        source: POSV2-1
    edgeCases:
      - case: Offline
        expected: >-
          Sells from the local catalogue; general admission keeps selling; a capacity-bound product (seats,
          timed slots without a local lease) is blocked with a clear notice, never let through.
        source: DI-012; DI-074; screens/P04-point-of-sale.yaml#POS-002 states.offline
      - case: Timed slot past its on-screen window
        expected: The slot drops off once its "minutes on screen" after start have passed.
        source: DI-169
      - case: Dynamic-QR event sold at the till
        expected: The ticket is delivered by email or SMS with app instructions, not printed as a static QR.
        source: DI-634
    consistency:
      - with: WEB-005
        note: Same guest-type pricing (counters belong to the chosen ticket) and the same purchase limits.
      - with: POS-021
        note: The F&B sell board shares the cart and checkout (one receipt, one QR per customer); owned by the F&B process.
    sampleData:
      cashier: Rania · Main Gate till 3 · shift 14:00-22:00 · 86 tickets · AED 19,420
      cart: ["Aqua Park · Day Pass · Adult × 2 · AED 490", "Aqua Park · Day Pass · Child × 1 · AED 165", "Locker · Large × 1 · AED 45"]
      guest: "+971 50 123 4567 · Mohammed Al Suwaidi · Gold member"
    corrections:
      - what: The approved build shows a cart-hold countdown of 300 seconds with up to two extensions; the contract's cart window is 15 minutes with one 5-minute extension proposed, and seats are held 8 minutes.
        why: Three different hold clocks for one sale; the till should show the contract's.
        source: screens/P04-point-of-sale.yaml#POS-002 wireframe.prototype.differences; contracts/spine/orders.yaml#extendCart; contracts/spine/orders.yaml#addCartLine
        status: fixed
        by: CHG-SPO-015
      - what: Raw filters (Venue id, Kind, Is sellable) and twelve "Every …" tables, and some 25 operation buttons (game cards, retail returns, exchanges, sync orders) on the sell screen.
        why: The sell screen is tiles, cards and the cart; post-sale actions live on POS-011, POS-026 and POS-030, and the hot functions are Refund, Check transaction and Print last receipt.
        source: screens/P04-point-of-sale.yaml#POS-002 layout; DI-132
        status: fixed
        by: CHG-WIR-018
      - what: Cross-device edges to BO-045, BO-130, BO-133, BO-084 and GST-026 remain in navigation.
        why: A till does not navigate to the back office or the guest app; the notes say these were removed.
        source: screens/P04-point-of-sale.yaml#POS-002 navigation; screens/P04-point-of-sale.yaml#POS-002 notes
        status: fixed
        by: CHG-WIR-019
      - what: The approved build adds a waitlist for sold-out events, gift-voucher face-value sales and group bundles with no declared operations.
        why: Either declare them or leave them out of the design.
        source: screens/P04-point-of-sale.yaml#POS-002 wireframe.prototype.differences
        status: fixed
        by: CHG-SPO-015
    decisions:
    - question: Which hot functions sit always visible beside the search ("magic banner")?
      decision: 'Drawn default accepted: Refund, Check transaction, Print last receipt, plus search.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-113 | CHG-NOTE-007
      questionSource: DI-132; DI-088

  POS-003:
    summary: >-
      Timed entry at the till: date, session and quantities. Block A. Since 3 August this is step two of
      the POS-002 drawer, not a page; design it as the drawer step and keep the id.
    inputs:
      - field: date
        rule: Seven-day strip in the region's date format; calendar for later.
        source: screens/P04-point-of-sale.yaml#POS-003 (datePicker notes)
      - field: session
        rule: Slots with remaining count and a demand indicator (High, Medium, Low, Sold out); the counter keeps selling to sell-out or the cutoff (e.g. 15 minutes before a timed show), unlike online.
        source: screens/P04-point-of-sale.yaml#POS-003 (cardList notes); DI-583
    edgeCases:
      - case: Offline
        expected: Sells only within the terminal's allocated lease and refuses beyond it, saying how many are left offline.
        source: screens/P04-point-of-sale.yaml#POS-003 states.offline
    consistency:
      - with: POS-002
        note: The drawer step.
      - with: WEB-006
        note: Same slots; the till's window differs per channel.
    sampleData:
      product: Aqua Park · Day Pass
      slots: ["10:00 · 42 left · Medium", "12:00 · 8 left · High", "14:00 · Sold out"]
    corrections:
      - what: Acquire, Release and Renew inventory hold buttons on the step.
        why: The hold is taken when the line is added; the cashier sees a countdown, not hold controls (the approved build has none).
        source: screens/P04-point-of-sale.yaml#POS-003 wireframe.prototype.differences
        status: fixed
        by: CHG-WIR-018
      - what: The screen is modelled as a page, while the 3 August decision made it a drawer step.
        why: Recorded gap; the design should draw the drawer.
        source: screens/P04-point-of-sale.yaml#POS-003 gaps
        status: fixed
        by: CHG-SPO-015

  POS-004:
    summary: >-
      Seats at the window: the seat plan inside the POS-002 drawer, with the guest watching. Block A. Four
      seat states exactly (available, selected, sold, accessible), category filter, zoom and legend; seats
      held 8 minutes and extendable while the guest decides.
    inputs:
      - field: seats
        rule: Tap to hold; "Keep the party together" and Best available for a group; up to 10 seats per sale on the till.
        source: F59 step 2; DI-095; contracts/satellite/seating.yaml#/components/schemas/CreateSeatHoldRequest
    outputs:
      - element: hold countdown
        rule: '"Seats held 7:42" with Extend; extends up to 30 minutes in all.'
        source: F59 step 3; contracts/satellite/seating.yaml#/components/schemas/CreateSeatHoldRequest (ttlSeconds max 1800)
      - element: cart
        rule: Seat total plus booking fee as its own line.
        source: screens/P04-point-of-sale.yaml#POS-004 notes
    edgeCases:
      - case: The zone sells out while choosing
        expected: The zone is struck out, the map reloads, the cart stays.
        source: screens/P04-point-of-sale.yaml#POS-004 states.zoneUnavailable
      - case: Offline
        expected: Not available; seats need the server.
        source: screens/P04-point-of-sale.yaml#POS-004 states.offline; DI-074
    consistency:
      - with: WEB-007
        note: Same statuses and colours as the guest map.
    sampleData:
      event: "Skyline Cinema · Standard · Fri 20:30"
      seats: ["Row F, Seat 9 · AED 55", "Row F, Seat 10 · AED 55", "Booking fee · AED 5"]
    corrections:
      - what: '"Save performance" (updatePerformance) and "Evaluate approval requirement" on the seat map.'
        why: A till does not edit performances; approval is asked when a discount needs it, not as a button.
        source: screens/P04-point-of-sale.yaml#POS-004 layout
        status: fixed
        by: CHG-WIR-018
      - what: The approved build has a zone-priced general-admission flow (zones, tiers, keep the party together) with no screen.
        why: Draw it in the drawer as the zone-only seat model.
        source: screens/P04-point-of-sale.yaml#POS-004 wireframe.prototype.differences; DI-410
        status: fixed
        by: CHG-SPO-001

  POS-005:
    summary: >-
      Payment at the till, shared by every sell board. Block A. From the ticketing angle: the cart's
      tickets are issued only when the payment completes, a dynamic-QR event's tickets are sent rather
      than printed, and the receipt (with the booking reference) is the most-reached screen after it.
    inputs:
      - field: tender
        rule: >-
          Card, cash, Apple Pay or Google Pay, gift card or voucher, wallet; split on any tender with Add to
          split, Exact, Half and quick amounts; Complete enables once the parts cover the total. Discounts
          are never applied here.
        source: DI-788; POSV2-5; DI-786; DI-079
      - field: buyer details above AED 10,000
        rule: Name, address and TRN for a full tax invoice.
        source: screens/P04-point-of-sale.yaml#POS-005 gaps (Order.buyerTrn)
    outputs:
      - element: receipt and tickets
        rule: Receipt with VAT breakdown and booking reference; tickets printed (or emailed for dynamic-QR events); back to a new sale after a few seconds.
        source: screens/P04-point-of-sale.yaml#POS-005 gaps; DI-634; DI-177
    edgeCases:
      - case: Card outcome unknown
        expected: '"Check payment status", never a second charge.'
        source: screens/P04-point-of-sale.yaml#POS-005 wireframe.prototype.differences
      - case: Offline
        expected: Cash only; card disabled with the reason.
        source: DI-078
    consistency:
      - with: WEB-012
        note: Same unknown-outcome rule.
    sampleData:
      total: AED 700 · Wallet AED 500 + Visa AED 200
    corrections:
      - what: Receipt has no screen in P04 and the success branch has nowhere to go.
        why: Recorded gap; POS-026 Receipt & Reprint should be the exit.
        source: screens/P04-point-of-sale.yaml#POS-005 gaps
        status: fixed
        by: CHG-WIR-019
      - what: Raw retail-sale filters (Outlet id, Shift id, Created from/to) on the payment screen.
        why: Payment completes one sale; no list.
        source: screens/P04-point-of-sale.yaml#POS-005 layout
        status: fixed
        by: CHG-SPO-015

  POS-006:
    summary: >-
      Find and resume a parked sale. Block A. The approved build has a held-sales modal for this terminal
      and up to four parked cart tabs; POSV2-6 keeps modify, refund, exchange and reschedule on the
      specification as a design gap.
    outputs:
      - element: held sale row
        rule: Label, time held, cashier, total, expiry; held sales expiring within the hour flagged.
        source: screens/P04-point-of-sale.yaml#POS-006 (banner notes); contracts/spine/orders.yaml#/components/schemas/Order (holdLabel, heldUntil)
    actions:
      - action: Recall into sale
        result: Back into the cart on POS-002; another terminal's hold needs the server.
        source: POSV2-6; screens/P04-point-of-sale.yaml#POS-006 states.offline
      - action: Print hold slip / Discard hold
        result: Slip with the label and a barcode to recall; discard confirms what is released.
        source: POSV2-6
    consistency:
      - with: POS-002
        note: Parked cart tabs are the same holds; show the same label.
    sampleData:
      rows: ["Family at gate 2 · 14:32 · Rania · AED 655 · expires 15:32"]
    corrections:
      - what: Staff list filters typed as text (Venue id, Principal id, Shift id, Status).
        why: The list is this terminal's holds with a search; ids are not typed.
        source: screens/P04-point-of-sale.yaml#POS-006 layout
        status: fixed
        by: CHG-SPO-015
      - what: Parked cart tabs (max 4) and held orders are two hold mechanisms in the approved build.
        why: One concept for the cashier; decide whether tabs are held orders.
        source: screens/P04-point-of-sale.yaml#POS-006 wireframe.prototype.differences
        status: fixed
        by: CHG-SPO-015

  POS-010:
    summary: >-
      Add something (a locker, Fast Track, a meal) to a ticket the guest already holds, by scanning it.
      Block A. The add-on joins the existing QR, never a new one; surrendered, expired or blocked media
      is refused before money is taken.
    inputs:
      - field: ticket scan
        rule: Scan or type the ticket's code; shows what it already includes and what can be added.
        source: DI-295; F58 step 7
    outputs:
      - element: upgrade price
        rule: Upgrades show the difference to pay (e.g. a better section the same day), within the product's upgrade window.
        source: DI-603
    edgeCases:
      - case: Offline
        expected: Not available; the entitlements must be read live.
        source: screens/P04-point-of-sale.yaml#POS-010 states.offline
    consistency:
      - with: POS-005
        note: Pays as a normal sale.
    sampleData:
      ticket: "YAS1-000123-02 · Aqua Park Day Pass · Adult"
      addOn: "Locker · Large · AED 45"
    corrections:
      - what: No prototype frame (match none).
        why: Needs a frame.
        source: screens/P04-point-of-sale.yaml#POS-010 wireframe
        status: logged
        by: CHG-SPO-020

  POS-014:
    summary: >-
      Sales exceptions at the till: no-sale drawer opens, voids and supervisor approvals. Block A. The
      approved build spreads these over overlays; the drawer open there takes no reason and writes no
      audit, which is the gap this screen closes.
    inputs:
      - field: reason
        rule: A preset reason code plus a free-text note for audit, for no-sale, void and refund.
        source: DI-797; contracts/spine/shift.yaml#recordNoSale
      - field: supervisor approval
        rule: PIN prompt when a void or refund crosses the configured threshold, with Approve and Reject.
        source: DI-324; screens/P04-point-of-sale.yaml#POS-014 wireframe.prototype.differences
    consistency:
      - with: POS-002
        note: The prompt appears over the sale.
    sampleData:
      noSale: "No sale · Change for float · 15:04 · Rania"
    corrections:
      - what: The no-sale form asks the cashier for "Id" and "Recorded at".
        why: Both are set by the till.
        source: screens/P04-point-of-sale.yaml#POS-014 layout
        status: fixed
        by: CHG-SPO-015
      - what: The approval modal's reject path is not modelled.
        why: The design draws it; the screen should declare it.
        source: screens/P04-point-of-sale.yaml#POS-014 wireframe.prototype.differences
        status: fixed
        by: CHG-SPO-015

  POS-030:
    summary: >-
      The till's sales journal (and the cart's History): find a sale and reprint, email the tax invoice,
      reload it into the cart or hand it to returns. Block A (POS v2, 1 October). Default this terminal,
      today; nothing is refunded here.
    outputs:
      - element: sale row
        rule: Time, order number, guest, items in one line, tenders (a split sale under each tender), total and pay status.
        source: screens/P04-point-of-sale.yaml#POS-030 layout
      - element: gross tile
        rule: Count and gross of the filtered sales, labelled as not the shift's takings.
        source: screens/P04-point-of-sale.yaml#POS-030 (metricTile notes)
    actions:
      - action: Reload this cart
        result: The sale's lines go into the current cart at today's prices and availability.
        source: POSV2-1
      - action: Tax invoice
        result: Issues or opens the full invoice, in English or Arabic, to print or email.
        source: screens/P04-point-of-sale.yaml#POS-030 layout
    consistency:
      - with: POS-011
        note: Refund or void hands over.
      - with: POS-026
        note: Opens the receipt.
    sampleData:
      rows: ["15:12 · YAS1-000431 · Mohammed Al Suwaidi · 3 × Day Pass · Card · AED 655 · Paid"]
    corrections:
      - what: No CSV or Excel export, although the v2 build draws both.
        why: Decided as a later change; the design must not show export.
        source: screens/P04-point-of-sale.yaml#POS-030 notes

  POS-031:
    summary: >-
      Reservations and group arrivals at the till: hold a sale without payment, then convert and take
      payment when the guest or group arrives. Block A (POS v2, 1 October). A reservation holds capacity
      and issues nothing; tickets are issued when payment completes.
    outputs:
      - element: reservation row
        rule: Guest, what is held, expiry soonest first; "expiring within the hour" toggle.
        source: screens/P04-point-of-sale.yaml#POS-031 layout
      - element: groups due today
        rule: Leader, expected and arrived counts, deposit and balance, the group's order.
        source: screens/P04-point-of-sale.yaml#POS-031 layout; TRACKER 30-September Old rows row 131 (A185)
    actions:
      - action: Take payment
        result: Converts and opens Payment; tickets issued on completion.
        source: POSV2-2
      - action: Check the group in
        result: Records the arrival count against the group.
        source: contracts/spine/orders.yaml#recordGroupCheckIn
    edgeCases:
      - case: Offline
        expected: Reservations unavailable; the screen says so.
        source: screens/P04-point-of-sale.yaml#POS-031 states.offline
    consistency:
      - with: WEB-031
        note: The same group request the guest sent online arrives here.
    sampleData:
      groups: ["Al Noor Private School · 45 + 4 supervisors · deposit AED 1,631 paid · balance AED 4,894"]
    corrections:
      - what: The v2 build encodes a group's tickets as inactive before payment; that is not built.
        why: Nothing is encoded before payment; the design must not show "Encode tickets" before Take payment.
        source: screens/P04-point-of-sale.yaml#POS-031 notes
      - what: No prototype frame (match none).
        why: Needs a frame from the v2 Bookings view.
        source: screens/P04-point-of-sale.yaml#POS-031 wireframe
  KSK-001:
    summary: >-
      The kiosk's attract loop: what the screen shows when nobody is standing there, to pull a guest out
      of the ticket queue. After Block A. Kiosks are guest-facing and white-labelled to the client's
      brand with a kiosk-specific layout, "Powered by TICVAI" kept.
    outputs:
      - element: loop content
        rule: The venue's product clips (6 to 12 s, no audio) and "Touch to buy tickets" in English and Arabic; a short line for collecting an online booking.
        source: DI-298; DI-297; DI-1080; F07 step 1
    actions:
      - action: Touch anywhere
        result: Language choice, then What are you buying (KSK-003).
        source: F07 step 1-3
    edgeCases:
      - case: Offline or the catalogue is stale
        expected: Out of service (KSK-014), never a cached sale.
        source: screens/P05-guest-kiosk.yaml#KSK-001 states.offline
    consistency:
      - with: WEB-004
        note: Same product media and the no-loader rule.
    sampleData:
      loop: ["Summit Coaster clip · 'Skip the queue: buy here'", "Aqua Park Day Pass from AED 245"]
    corrections:
      - what: The screen declares no operation; nothing fills the loop.
        why: The loop needs the venue's products and media (listProducts with Product.media) or a configured playlist.
        source: screens/P05-guest-kiosk.yaml#KSK-001 gaps

  KSK-003:
    summary: >-
      What are you buying: one touch to a product, or to Collect a booking, or Order food. After Block A.
      Large tiles a gloved or wet hand can hit; Help me choose answers filter the same way as web and app.
    outputs:
      - element: tiles
        rule: Category tiles with image and from-price; Collect my booking as its own tile; at most two levels before a product.
        source: F07 step 3; screens/P05-guest-kiosk.yaml#KSK-003 transitions; contracts/spine/catalogue.yaml#searchCatalogue (guidedAnswerIds "web, mobile and kiosk show the same list for the same answers")
    consistency:
      - with: WEB-002
        note: Same products and filter results.
    sampleData:
      tiles: ["Day passes · from AED 245", "Fast Track · from AED 75", "Collect my booking", "Order food"]
    corrections:
      - what: Raw filters "Venue id", "Kind", "Is sellable".
        why: A kiosk is bound to its venue; generated filters must not reach the design.
        source: screens/P05-guest-kiosk.yaml#KSK-003 layout
        status: fixed
        by: CHG-GST-003

  KSK-004:
    summary: >-
      Choose tickets and quantities with large steppers. After Block A. Same pricing model as the web: the
      guest types belong to the chosen ticket and take its prices; purchase limits stop the plus button.
    inputs:
      - field: quantities
        rule: Steppers at least 64 px; plus disabled at the channel's purchase limit with the reason ("Up to 6 tickets per purchase").
        source: DI-464; DI-172; DI-1106
      - field: Order of steps
        rule: 'Tickets first, then date and time: the kiosk differs from web and app (REV3-2 is superseded for the kiosk only).'
        source: decided 2 October 2026 by Chinmay (CHG-NOTE-007)
    consistency:
      - with: WEB-005
        note: Same one-line-per-ticket rule.
    sampleData:
      lines: ["Day Pass · Adult × 2 · AED 490", "Day Pass · Child × 1 · AED 165"]
    corrections:
      - what: The kiosk order is tickets (KSK-004) then session (KSK-005), against the guest-channel rule of date, then time, then tickets.
        why: REV3-2 applies to guest booking; the kiosk is guest-facing. Confirm whether the kiosk follows it.
        source: F07 step 4-5; REV3-2
        status: withdrawn
        by: CHG-NOTE-007
      - what: Availability is bound to getAvailability's inline response with no schema.
        why: Recorded gap; REV3-1 names the page response.
        source: screens/P05-guest-kiosk.yaml#KSK-004 gaps
    decisions:
    - question: Does the kiosk follow date, then time, then tickets like web and app?
      decision: The kiosk keeps tickets first, then date and time (unlike web and app). Supersedes REV3-2 for the kiosk only.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-170 | CHG-NOTE-007
      questionSource: REV3-2; DI-116

  KSK-005:
    summary: >-
      Pick a session that still has room. After Block A. Onsite sales stay open to sell-out or the venue's
      cutoff (e.g. 15 minutes before a timed show).
    outputs:
      - element: session tile
        rule: Time and places left; sold out greyed; past the cutoff removed.
        source: DI-583; DI-169
    consistency:
      - with: WEB-006
        note: Same tiles.
    sampleData:
      sessions: ["14:00 · 18 left", "15:00 · 4 left", "16:00 · Sold out"]
    corrections:
      - what: '"Acquire inventory hold" as the primary button.'
        why: The hold is taken when the tickets are added; the guest taps a session.
        source: screens/P05-guest-kiosk.yaml#KSK-005 layout
        status: fixed
        by: CHG-GST-003

  KSK-006:
    summary: >-
      Review before money moves: lines, totals, and any purchase-gating question the product needs (e.g.
      "I confirm I am not pregnant"). After Block A.
    outputs:
      - element: review
        rule: Same line wording as the web basket; total in AED; a countdown for the held capacity.
        source: DI-156; WEB-010
    actions:
      - action: Pay
        result: Card at the terminal (KSK-007).
        source: F07 step 7
    consistency:
      - with: WEB-010
        note: Same lines.
    sampleData:
      total: "AED 655 · Day Pass Adult × 2, Child × 1"
    corrections:
      - what: '"Add cart line" and "Evaluate promotions" buttons on the review.'
        why: Lines are added before; promotions apply automatically.
        source: screens/P05-guest-kiosk.yaml#KSK-006 layout

  KSK-007:
    summary: >-
      Payment by card (tap with Apple Pay or Google Pay included) at the attached terminal, and nothing
      else: no cash, no foreign notes. After Block A.
    outputs:
      - element: terminal prompt
        rule: '"Tap, insert or swipe your card below" with an arrow to the reader and the amount; then Approved or Declined.'
        source: screens/P05-guest-kiosk.yaml#KSK-007 notes (card only); DI-079
    edgeCases:
      - case: Outcome unknown
        expected: Goes to Payment unresolved (KSK-008), never charging again.
        source: F57 step 2
    sampleData:
      amount: AED 655
    corrections:
      - what: The screen lays out eight raw CreatePaymentRequest text fields (id, orderId, tender, amount, tenderedAmount, walletAuthorisationId, deviceId, recordedAt).
        why: A guest never types these; the terminal and the kiosk fill them.
        source: screens/P05-guest-kiosk.yaml#KSK-007 layout
        status: fixed
        by: CHG-GST-003

  KSK-008:
    summary: >-
      Payment unresolved, with nobody standing next to the guest. After Block A. Check with the bank, show
      the order reference, and call staff; never charge again.
    outputs:
      - element: message
        rule: '"We''re checking your payment. Please don''t pay again." with the reference and Call staff.'
        source: F57 step 2-4
    sampleData:
      message: "We're checking your payment of AED 655. Please don't pay again. Reference YAS1-000512."
    corrections:
      - what: inquirePaymentStatus declares no request body, so the screen's editor has nothing to edit.
        why: Recorded gap; the screen is a status, not an editor.
        source: screens/P05-guest-kiosk.yaml#KSK-008 gaps

  KSK-009:
    summary: >-
      Ticket issued: take the printed ticket (or, for a dynamic-QR event, the instructions to link it in
      the app). After Block A.
    outputs:
      - element: issued
        rule: Order number, what printed, where to enter; email or SMS a copy.
        source: F07 step 8; DI-634
    consistency:
      - with: WEB-013
        note: Same order number.
    sampleData:
      order: YAS1-000512 · 3 tickets printed
    corrections:
      - what: '"Transfer order tickets" is the primary action.'
        why: A kiosk does not transfer tickets; sending a copy is reprintOrder by email or SMS.
        source: screens/P05-guest-kiosk.yaml#KSK-009 layout
        status: fixed
        by: CHG-GST-003

  KSK-010:
    summary: >-
      The printer failed after payment: the tickets are paid for and must reach the guest another way.
      After Block A.
    actions:
      - action: Send to my phone
        result: Email or SMS the tickets (resend), or call staff to print at the desk.
        source: F57 step 3-4; contracts/spine/orders.yaml#reprintOrder
    sampleData:
      message: "Your 3 tickets are paid but did not print. Send them to +971 50 ••• 4567?"
    corrections:
      - what: The recovery is modelled as a ticket transfer with ticketIds and recipient fields.
        why: It is a resend of the guest's own tickets (reprintOrder by email or SMS), not a change of owner.
        source: screens/P05-guest-kiosk.yaml#KSK-010 layout; contracts/spine/orders.yaml#transferOrderTickets
        status: fixed
        by: CHG-GST-003

  KSK-012:
    summary: >-
      Collect a booking made online or by the sales team: confirm it is the right booking, then print (or
      swap the QR for a wristband). After Block A.
    outputs:
      - element: booking
        rule: Name (masked), date, tickets, and which will print.
        source: DI-611; DI-637
    sampleData:
      booking: "YAS1-000123 · F. Al H••••• · Fri 2 Oct · 3 × 2 park ticket · print 3"
    corrections:
      - what: Modelled as a ticket transfer form.
        why: Collecting is printing or a media swap, not a transfer.
