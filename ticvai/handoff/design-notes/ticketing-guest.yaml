      - what: '"Every wallet transaction" bound to retail.yaml in one region and wallet.yaml in another.'
        why: The transactions are wallet.yaml's.
        source: screens/P02-guest-mobile-app.yaml#GST-011 layout
      - what: No prototype frame (match none).
        why: Needs a frame.
        source: screens/P02-guest-mobile-app.yaml#GST-011 wireframe

  GST-014:
    summary: >-
      Send tickets to someone and claim tickets sent to you. Block A. One implementation with GST-045
      (and the old GST-008 transfer reading). The recipient claims here from the link; ownership moves
      only on claim, and a device-bound ticket moves to the recipient's device.
    inputs:
      - field: tickets and recipient
        rule: Per ticket; email, SMS or WhatsApp with the address; message up to 500 characters; contacts picker allowed.
        source: contracts/spine/orders.yaml#transferOrderTickets
    outputs:
      - element: incoming claim
        rule: '"Fatima sent you 2 tickets for Fri 2 Oct" with Accept; once accepted the tickets appear in the Tickets tab on this device.'
        source: F55 step 5; DI-636
      - element: sent list
        rule: Waiting to be claimed, Claimed, Expired and returned, Cancelled; full history kept.
        source: contracts/spine/orders.yaml#/components/schemas/TicketTransfer; DI-669
    actions:
      - action: Accept (claim)
        result: Ownership moves, the sender's copy stops admitting, the QR is re-issued to this device.
        source: contracts/spine/orders.yaml#claimTicketTransfer; DI-636
    edgeCases:
      - case: Claim link expired or already claimed
        expected: Says which, and that the tickets went back to the sender.
        source: contracts/spine/orders.yaml#/components/schemas/TicketTransfer (expiresAt)
    consistency:
      - with: WEB-030
        note: Same statuses; the web sender, the app recipient (F55).
      - with: GST-045
        note: One implementation.
    sampleData:
      incoming: "Fatima sent you 2 × 2 park ticket · Fri 2 Oct"
    corrections:
      - what: Staff filters (Venue id, Principal id, Shift id, Status, Created from/to) over listOrders.
        why: Guest screens use listMyOrders; staff filters must not appear.
        source: screens/P02-guest-mobile-app.yaml#GST-014 layout
        status: fixed
        by: CHG-GST-003
      - what: '"Claim ticket transfer" as a button with a claimToken form.'
        why: Claiming happens from the link; the token is never typed.
        source: screens/P02-guest-mobile-app.yaml#GST-014 overlays.formClaimTicketTransfer
        status: fixed
        by: CHG-GST-003

  GST-045:
    summary: >-
      Ticket delivery and sharing: the same implementation as GST-014, reached from a ticket's Send or
      Share. Block A. Adds the delivery choices (wallet, email, SMS, WhatsApp) and email to a third party.
    inputs:
      - field: delivery
        rule: Add to Wallet; resend by email, SMS or WhatsApp; email a copy to someone else (no ownership change) versus Send (transfer).
        source: DI-198; DI-200
    consistency:
