# Design notes for the ticketing-guest process: Ticketing and Guest Commerce as the guest and the
# partner meet it. AUTHORED, not generated. Read with the screen's generated specification in its
# batch BUNDLE.md; these notes add the rules, edge cases, sample data and corrections the package data
# does not say. Schema: scratchpad brief (process agents), 1 October 2026.
process: ticketing-guest
title: Ticketing & Guest Commerce (guest web, guest app, kiosk, partner portal, POS ticket sale)
owner: ticketing-guest process agent (Claude), 1 October 2026
processSummary: >-
  A guest finds something to do, picks when and how many, holds capacity, pays, and receives a ticket
  they can show at the gate, transfer or resell. The same booking engine serves the guest website (P01,
  WEB-), the guest app (P02, GST-) and, through the same catalogue, cart and order operations, the kiosk
  (P05), the cashier at the till (P04) and the staff handheld (P06); partners book on credit through the
  partner portal (P10). Guest surfaces are white-label (venue logo, colours, fonts, card layouts, step
  indicator style, cart placement) with "Powered by TICVAI" kept; the till and handheld stay TICVAI-branded.
  The booking runs in a fixed order that the client set on 29 September and confirmed on 30 September:
  for a dated product, the date first, then the time (hidden until a date), then the tickets (hidden
  until a time); undated products go straight to the tickets; product-first flows (workshops) pick the
  product, then the date; seated events with one performance open on the seat map, sections first, zoom
  into a section, pinch out to compare. Choosing a date, time or session commits nothing; capacity is held
  only when a quantity is set (a 15-minute basket window, 8 minutes for seats and cabanas, one extension).
  The guest counters (adult, child, senior, infant, person of determination) belong to the chosen ticket
  and take its prices, so a basket line is "<ticket> · <guest type> × <n>"; group and school products
  start from group ticket cards and a typed headcount (minus, plus, and +10 on the app), supervisors free.
  Help me choose filters the catalogue on the server (never a consent step) with Show everything; consent
  questions such as "Are you able to swim?" are asked once after the session is picked and never again
  where the page already asked. Sign-in or the six-digit guest code is asked when the guest leaves
  Add-ons (or at payment, per venue), only the fields the venue configured; after the code, only the T&Cs
  tick remains (W1). Payment creates the order first and treats an unknown outcome as "checking with your
  bank", never a second charge; tickets issue on payment, go to Apple or Google Wallet, and a dynamic-QR
  event's ticket lives in the app. The guest app is deliberately not a copy of the website (30 September):
  its structure is Home, Explore, Plan and Tickets tabs with a persistent Buy tickets button, item pages
  that propose the right product (a restaurant's meal combo that includes admission), ride videos that
  play with no loader, a visit planner that plans each day at one park from that park's rides, dining and
  shops only, and in-park walking navigation; the booking flow inside it is functionally identical to the
  web. Vocabulary in guest copy follows the glossary's recorded exceptions (Booking, Session, QR).
  source: [F01, F02, F03, F07, F49, F52, F55, F57, F58, F59, MoM 29 Sep 1 (W1-W12), MoM 29 Sep 2, MoM 29 Sep 3, MoM 30 Sep 4.4-4.8, CLIENT-RESPONSE-30SEP 1-6, CLIENT-RESPONSE-REV3-25SEP, REV3-1, REV3-2, REV3-3, REV3-4, REV3-26, DI-1086, DI-1092, DI-1093, DI-1101, DI-1105, DI-1106, DI-1112, DI-296, DI-298, contracts/spine/orders.yaml#addCartLine, contracts/satellite/seating.yaml#createSeatHold, TRACKER 30-September Tracker row 13 (S9)]
vocabulary:
  - term: Booking
    meaning: An order or reservation as the guest reads it (Booking Confirmation, Group Booking, My bookings). Code says Order or Reservation.
    avoid: [Order (in guest copy), Purchase record, Transaction]
    source: docs/glossary.md (Recorded exceptions, Booking, audit R145)
  - term: Session
    meaning: A dated, timed performance as the guest reads it (Pick a session, Surf sessions). Staff screens (POS, back office) keep Performance.
    avoid: [Slot, Showtime, Performance (in guest copy)]
    source: docs/glossary.md (Recorded exceptions, Session, rev 3 CFG-10); DI-1064
  - term: Basket
    meaning: The guest's unpaid selection with its held capacity (Add to basket, Your basket). Never a paid order. The till and staff screens say Cart.
    avoid: [Cart (in guest copy), Bag, Order (for an unpaid selection)]
    source: CLIENT-RESPONSE-REV3-25SEP (Basket, 10); screens/P01-guest-web-storefront.yaml#WEB-048 (Add to basket); DI-782 (POS cart)
  - term: Ticket
    meaning: The issued instrument a guest shows at the gate. Product names from the catalogue keep their own words (Day Pass, Annual pass, 2 park ticket); the interface around them says ticket.
    avoid: [Admission, Voucher (for a ticket), Pass (in interface copy)]
    source: docs/glossary.md (Ticket)
  - term: Adult, Child, Senior, Infant, Person of determination
    meaning: The guest types of a ticket, each with its age or height band shown under it (Child 3-12, Under 1.20 m). A companion of a person of determination is its own free type where the product has one.
    avoid: [Disabled, Handicapped, Kid, Pax]
    source: DI-686; screens/P01-guest-web-storefront.yaml#WEB-049 (Passengers notes); sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html (guest types)
  - term: Held for
    meaning: The countdown on held capacity ("Your seats are held for 7:42"); the release is Release hold.
    avoid: [Lease, Reserved for (a reservation is a different thing), Locked]
    source: contracts/spine/orders.yaml#/components/schemas/CartLine (leaseExpiresAt); docs/glossary.md (Release hold)
  - term: Reservation
    meaning: Booked and not yet paid; holds capacity and expires (My Reservations). Paid tickets are in Tickets or My Tickets.
    avoid: [Booking (for an unpaid hold in lists), Pending order]
    source: docs/glossary.md (Reservation); DI-199
  - term: Help me choose
    meaning: The venue's questions whose answers filter the products; Show everything clears them.
    avoid: [Quiz, Wizard, Experience builder, Consent]
    source: MoM 29 Sep W4; REV3-11
  - term: Info only / Not bookable online
    meaning: A product listed with full details that cannot be booked online; it shows Contact sales to book with Call sales and Email sales.
    avoid: [Unavailable, Sold out, Coming soon]
    source: REV3-14; MoM 29 Sep W3
  - term: Guest code
    meaning: The six-digit code sent to the guest's email or mobile to prove the contact at guest checkout; the copy says six digits.
    avoid: [OTP, PIN, Token, Verification key]
    source: DI-1034; MoM 29 Sep W1
  - term: How many people
    meaning: The typed headcount of a group or school booking (number box with minus and plus; +10 on the app), with Supervisors listed separately and free.
    avoid: [Group size (the removed dropdown), Pax]
    source: DI-1104; DI-1105; CLIENT-RESPONSE-30SEP 1
  - term: Waiting room
    meaning: The on-sale queue in front of a high-demand performance's sale (WEB-015, GST-046).
    avoid: [Virtual queue (that is the ride queue), Lobby]
    source: screens/P01-guest-web-storefront.yaml#WEB-015 notes (ADR-0066)
  - term: QR
    meaning: The code a guest shows, in guest copy only (Dynamic QR). Staff screens say Media code.
    avoid: [Barcode, Serial, Media code (in guest copy)]
    source: docs/glossary.md (Recorded exceptions, QR, audit R210)
  - term: Not at this park
    meaning: The planner's per-day notice that the day's park cannot meet a preference, naming the park that can.
    avoid: [Unavailable, No results]
    source: DI-1113
  - term: Book this plan
    meaning: Turns the whole visit plan (tickets, Fast Track, meal combos) into basket lines.
    avoid: [Checkout plan, Buy itinerary]
    source: screens/P02-guest-mobile-app.yaml#GST-053 (Book this plan)
screens:
  WEB-002:
    summary: >-
      The storefront's catalogue: every bookable thing at the venue the guest picked, as cards they can
      book from without leaving the page. Block A. The thing to get right is that a card goes straight
      into booking: Book opens the ticket counters as a side panel on this listing (no separate "Select
      tickets" page), and a dated product's panel starts with the date, not the counters.
    inputs:
      - field: venue
        rule: >-
          Never a field on this page. The venue comes from the guest's venue choice (session) and the
          "Booking at" bar where the location switcher is on; the contract's venueId query is filled
          silently.
        source: screens/P01-guest-web-storefront.yaml#WEB-002 entryState; REV3-18
      - field: category
        rule: >-
          With ticketCategories = categoryThenSubcategory (default) the guest first sees category tiles
          (e.g. Day passes, Multi-park, Group and school, Annual passes) and then that category's
          products; with flatList all products show under category headings. Tiles carry the
          category's one-line description. There is no "Dated day pass" in-between step: the ticket
          categories show directly.
        source: REV3-16; DI-976; contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings
      - field: search
        rule: >-
          Free text, at least 2 characters before a search is sent; results replace the cards in place
          with the query shown as a removable chip. The hero search box shows only when searchInBanner
          is on (default off).
        source: contracts/spine/catalogue.yaml#searchCatalogue (q minLength 2); CFG-6
      - field: date
        rule: >-
          Optional "visiting on" filter. Uses the venue's region date format (dd/MM/yyyy for UAE
          tenants), never a browser-locale guess. Leaving it empty lists everything on sale.
        source: screens/P01-guest-web-storefront.yaml#WEB-002 (datePicker notes)
    outputs:
      - element: product card
        rule: >-
          Own primary photo (or the video poster), name, one-line summary, up to six display tags with
          icons (e.g. "2 Hours", "Min 1.10 m", "Valid 6 days"), and a "from" price in AED with no
          decimals when whole (AED 245). A sold-out product stays listed and says Sold out; it is never
          hidden.
        source: REV3 23SEP-3; REV3 23SEP-4; contracts/spine/catalogue.yaml#searchCatalogue (isAvailable "shown rather than filtered out")
      - element: info-only product card
        rule: >-
          Same card, with the notBookableLabel (default "Info only / Not bookable online") where the
          price and Book would be, and "Contact sales to book" showing Call sales / Email sales from
          Product.salesContact. Opens the details, never the basket. Hidden entirely when showInfoOnly
          is off.
        source: REV3-14; DI-1004; MoM 29 Sep W3
      - element: card layout
        rule: >-
          Four layouts the venue picks: Stacked rows (default), Split rows, Cards across, Poster cards;
          sizes Compact (default), Standard, Large, Extra large; density Compact (default), Standard,
          Roomy. Design all four layouts at Compact; the client liked the compact size.
        source: DI-1040; DI-991; REV3 DG-6
      - element: wait time
        rule: >-
          On attraction cards only, when the venue publishes a live wait: "25 min wait" with a clock
          icon. Omitted (not "0 min") when the queue feed has no reading.
        source: contracts/satellite/queue.yaml#getWaitTimes; TRACKER 30-September Old rows row 60 (A57)
    actions:
      - action: Book
        result: >-
          Opens WEB-005 as a side panel on the listing (counters for an undated product; for a dated
          product the panel opens on the date strip, then time, then tickets). Seated events with one
          on-sale performance go straight to the seat map (WEB-007); a cabana or spot on a venue map
          goes to WEB-047; a space by the hour to WEB-048. Book never adds to the basket by itself.
        source: REV3 23SEP-5; REV3-2; REV3-4; screens/P01-guest-web-storefront.yaml#WEB-004 transitions
      - action: Read more
        result: Opens WEB-004 (or its pop-up rendering) with the product's video playing in place.
        source: DI-1026; DI-1101
      - action: Help me choose / Show everything
        result: >-
          Answers filter this list on the server (guidedAnswerIds), so web, app and kiosk show the same
          products for the same answers. Show everything clears the answers and restores the full list.
          It is never a consent step.
        source: MoM 29 Sep W4; contracts/spine/catalogue.yaml#searchCatalogue (guidedAnswerIds)
    edgeCases:
      - case: The answers of Help me choose leave no product
        expected: >-
          "Nothing matches your answers" with the answers listed as chips and Show everything; never an
          empty grid.
        source: screens/P01-guest-web-storefront.yaml#WEB-002 states.emptyNoResults
      - case: A guest arrives on a deep link to an event that has finished or is withdrawn
        expected: >-
          The listing opens with a one-line notice ("That event has ended") and the venue's other
          products; never a 404.
        source: screens/P01-guest-web-storefront.yaml#WEB-002 entryState.coldEntry
      - case: Online allocation is sold out while the gate still has capacity
        expected: >-
          The card says Sold out online; this is per-channel allocation and correct behaviour, not a
          defect.
        source: F01 step 3 (branch "sold out online while counter allocation remains")
    consistency:
      - with: GST-002
        note: >-
          Same products, same filters and the same Help me choose result for the same answers; the app
          lays them out in its own Explore structure (mobile flow deliberately differs from web).
      - with: WEB-005
        note: The side panel is WEB-005; it must look identical whether opened here or on WEB-004.
      - with: KSK-003
        note: The kiosk filters with the same guidedAnswerIds, so a product hidden here for an answer is hidden there too.
    sampleData:
      venue: Summit Peaks (theme park), Yas Island; Arabic name قمم القمة
      categories: [Day passes, Multi-park, Group and school, Annual passes, Fast Track]
      cards:
        - {name: Summit Peaks Day Pass, tags: ["Min 1.10 m", "Valid 1 day"], from: AED 245, badge: Popular}
        - {name: 2 park ticket, tags: ["Valid 6 days"], from: AED 475, summary: "Any two Yas-side parks. Second visit within 6 days."}
        - {name: Courses and workshops (info only), label: "Info only / Not bookable online", contact: "Call sales +971 2 555 0142"}
        - {name: Intermediate surf (Coastal Aqua), tags: ["55 min"], from: AED 345, waitTime: "25 min wait"}
    corrections:
      - what: >-
          The layout lists staff-style filter fields "Venue id", "Kind" (free text) and an "Is sellable"
          toggle, plus raw tables "Every product", "Every performance" and "Every money".
        why: >-
          They are the generated query parameters and response tables. A guest never types a venue id,
          never sees unsellable products (the guest call is scoped to what is on sale), and "Every money"
          binds the search result's fromPrice as if it were a list. They must not reach the design.
        source: screens/P01-guest-web-storefront.yaml#WEB-002 layout; contracts/spine/catalogue.yaml#searchCatalogue
        status: fixed
        by: CHG-GST-003
    decisions:
    - question: Should the category tiles show a product count ("Day passes · 4"), as in the 29 July selling reference?
      decision: 'Drawn default accepted: Show the count on desktop tiles only.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-114 | CHG-NOTE-007
      questionSource: DI-026

  WEB-003:
    summary: >-
      Search for a guest who does not know what a thing is called. Block A. The prototype has no
      separate results page: results appear as a type-ahead under the search box and Enter lands on the
      listing (WEB-002) filtered by the query. Design it that way and treat WEB-003 as the type-ahead
      and the filtered state of WEB-002.
    inputs:
      - field: q
        rule: >-
          Starts searching from the 2nd character, debounced; Arabic and English both match (product
          names may be Arabic-only). Kind is a chip row (All, Events, Attractions, Memberships, Shop,
          Food), not a free-text field.
        source: contracts/spine/catalogue.yaml#searchCatalogue (q minLength 2, kind); DI-082
    outputs:
      - element: result row
        rule: >-
          Thumbnail (primaryMedia), name, kind, summary, from-price. A sold-out result stays in the list
          with "Sold out" (isAvailable false); an info-only result shows its not-bookable label and
          opens the details.
        source: contracts/spine/catalogue.yaml#searchCatalogue
      - element: no results
        rule: >-
          Names the query ("No results for 'snorkel'"), offers Clear and the category tiles; when a
          Help me choose filter is active, says so and offers Show everything.
        source: screens/P01-guest-web-storefront.yaml#WEB-003 states.emptyNoResults
    actions:
      - action: Select a result
        result: Opens WEB-004 for that product; Enter without a selection opens WEB-002 filtered by the query.
        source: screens/P01-guest-web-storefront.yaml#WEB-003 wireframe.prototype.differences
    edgeCases:
      - case: Offline or the search call fails
        expected: Results only from what was already loaded, with a note that newer items may exist.
        source: screens/P01-guest-web-storefront.yaml#WEB-003 states.offline
    consistency:
      - with: GST-063
        note: Same search, same ranking and the same sold-out and info-only treatment on the app.
    sampleData:
      query: surf
      results:
        - {name: Beginner surf, kind: Attraction, from: AED 295}
        - {name: Intermediate surf, kind: Attraction, from: AED 345}
        - {name: Expert barrels, kind: Attraction, from: AED 495, availability: Sold out}
    corrections:
      - what: The layout shows "Venue id" as a text field and raw "Every money" / "Every product" tables.
        why: Generated parameters; the venue is the session's and results are rows, not tables.
        source: screens/P01-guest-web-storefront.yaml#WEB-003 layout

  WEB-004:
    summary: >-
      The product page where a guest decides to book. Block A. It is rendered three ways in the
      prototype (a Read more pop-up per product, the listing's preview aside, and the single-event page
      behind its setting) and all three must carry the same content. The one thing to get right: the
      video plays in place with no loader in front of it (client, 30 September).
    inputs:
      - field: date strip (single-event page only)
        rule: >-
          The next dateStripDays days (default 7, venue range 3 to 31) as a strip with a calendar icon
          for later dates; sold-out days disabled with the reason on hover, not hidden. The event
          banner lists dates only when eventBannerDates is on (default off).
        source: DI-920; M17-08; REV3 23SEP-19
    outputs:
      - element: media
        rule: >-
          Primary video (6 to 12 s mp4, no audio) or photo at the top. The poster frame (primary image,
          else the video's first frame) fills the area while it buffers; playback starts in place. No
          spinner, no overlay, no "loading" screen, and a video that cannot play just leaves the poster.
          The info button reveals the details and starts the video.
        source: DI-1101; MoM 30 Sep 4.8; TRACKER 30-September Tracker row 13 (S9); DI-1080
      - element: tags and eligibility
        rule: >-
          Up to six display tags with kind icons (clock, height, free, calendar, id). Height and age
          limits from the eligibility rule are shown as tags ("Min 1.10 m", "Ages 3+"), not as a
          separate rules table.
        source: REV3 23SEP-3; screens/P01-guest-web-storefront.yaml#WEB-004 wireframe.prototype.differences
      - element: availability hint
        rule: >-
          For a dated product, the next available date and "11 left" style scarcity only when remaining
          is low; per-channel remaining, never the venue total.
        source: DI-026; F01 step 3
      - element: withdrawn product
        rule: >-
          A banner "This is no longer on sale" with the product kept readable and a link to similar
          products; Book is absent, not disabled.
        source: screens/P01-guest-web-storefront.yaml#WEB-004 (banner bound to Product.lifecycleState)
    actions:
      - action: Book
        result: >-
          Routes by product type: undated → counters side panel (WEB-005); dated → date, then time, then
          tickets (WEB-006 then WEB-005); seated with one on-sale performance → seat map (WEB-007);
          map-placed spot (cabana) → WEB-047; space by the hour → WEB-048; info-only → no Book, Contact
          sales instead.
        source: screens/P01-guest-web-storefront.yaml#WEB-004 transitions; DI-948; REV3-4; MoM 29 Sep W3
      - action: Call sales / Email sales
        result: Phone and email links (tel and mailto) from Product.salesContact, falling back to the venue contact.
        source: MoM 29 Sep W3; DI-1004
    edgeCases:
      - case: The video cannot play (no video, failed stream, data saver)
        expected: The poster stays, details unaffected; no error message in the media area.
        source: screens/P01-guest-web-storefront.yaml#WEB-004 states.videoUnavailable
      - case: The product is not sellable today (sold out online, outside the sales window)
        expected: >-
          Book stays visible but disabled with the stated reason ("Online sales close 15 minutes before
          the show"; "Sold out online for today, tomorrow has space").
        source: DI-583; screens/P01-guest-web-storefront.yaml#WEB-004 actionBar (Disabled with a stated reason)
    consistency:
      - with: GST-004
        note: >-
          Same content and the same no-loader video behaviour. The app adds the item's map location and
          the proposed product (e.g. "Buy meal combo" which brings its admission); the web page may show
          the map pin when the product has a venue-map location.
      - with: GST-006
        note: Event and exhibition details on the app follow this page's single-event rules (date strip, banner dates off).
    sampleData:
      product: Summit Peaks Day Pass
      media: Ride clip "The Drop" 10 s, poster frame the tower at sunset
      tags: ["Min 1.10 m", "Valid 1 day", "Free under 3"]
      prices: Adult AED 325, Child (3-12) AED 250, Senior (60+) AED 250, Infant (under 3) free
      description: Full-day entry to every ride and show at Summit Peaks. Fast Track sold as an add-on.
    corrections:
      - what: The layout puts From/To date pickers and an "Every performance" table on the details page.
        why: >-
          A guest does not pick a date range here; the single-event page uses the 7-day strip and the
          dated booking picks the date on WEB-006. The range pickers are listPerformances parameters.
        source: screens/P01-guest-web-storefront.yaml#WEB-004 layout; DI-920
        status: fixed
        by: CHG-GST-003
      - what: The prototype labels this screen WEB-003b.
        why: Its id is WEB-004; the label will confuse the handoff to the front-end team.
        source: screens/P01-guest-web-storefront.yaml#WEB-004 wireframe.prototype.differences
  WEB-005:
    summary: >-
      The ticket counters: which ticket and how many of each guest type. Block A. In the dated flow it
      is the last stage of one staged step (date, then time, then tickets) and in the prototype it is the
      same page; on a listing it opens as a side panel. Get right the pricing model the client corrected
      on 30 September: the guest counters belong to the chosen ticket and take its prices, so a
      multi-park ticket with three adults is ONE basket line.
    inputs:
      - field: ticket choice
        rule: >-
          Ticket cards first (e.g. 1 park, 2 park, 3 park ticket), then the guest counters for the chosen
          ticket. Before a ticket (or, in a session product, a session) is chosen the counter area shows
          the hint "Choose a ticket above, then set how many of each guest." and no counters.
        source: DI-1106; CLIENT-RESPONSE-30SEP 2; sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html (waitText)
      - field: guest counters (Adult, Child, Senior, Infant, Person of determination)
        rule: >-
          Each counter is a variant of the chosen ticket and is priced from it (listProductVariants), so
          child and senior scale from the chosen ticket and infant stays free where the ticket says so.
          Steppers start at 0, minus disabled at 0, plus disabled at the purchase limit with the reason
          ("Up to 6 tickets per booking"). Each row has an (i) with who it is for and what it includes
          (up to 300 characters) when cardInfo is on.
        source: DI-1106; DI-464; DI-172; REV3 23SEP-6
      - field: group headcount (Group and school booking)
        rule: >-
          Group products start from group ticket cards (School group, Corporate group, Tour operator
          group, Community group), each with a per-person price and its minimum group size. Then "How
          many people" is a number box the guest can type into (e.g. 45) with minus and plus; there is
          no Group size dropdown. Supervisors are a separate, free row ("One free for every 10 guests").
          Values below the card's minimum are refused inline ("School groups start at 10 guests").
        source: DI-1104; DI-1105; DI-1114; DI-1116; CLIENT-RESPONSE-30SEP 1
      - field: experience and level filters
        rule: >-
          "Choose your experience" and "Select level" dropdowns where the venue uses them (surf, lessons,
          swim, sauna; beginner to expert), each option with its one-line description, and Reset. They
          narrow the products, they are not answers stored on the booking.
        source: REV3-19
      - field: promotion code
        rule: >-
          Not entered here. The guest enters codes in the basket (WEB-010); this step only shows
          near-miss offers ("Add one more child for the family rate") from the promotion evaluation.
        source: screens/P01-guest-web-storefront.yaml#WEB-005 wireframe.prototype.differences; F01 step 5
    outputs:
      - element: running total and basket line preview
        rule: >-
          One line per ticket per guest type, written "<ticket> · <guest type> × <n> = AED <total>", e.g.
          "2 park ticket · Adult × 3 = AED 1,425". Never a ticket line plus a separate guest line. AED
          with a thousands separator and no decimals for whole amounts.
        source: DI-1106; CLIENT-RESPONSE-30SEP 2
      - element: session tickets
        rule: >-
          For a session product the panel title names the session ("Tickets for Intermediate surf ·
          19:30") with its own guest types (Surfer at the session price, Junior surfer 10-15 with a
          paying adult, Spectator AED 35). Choosing the session adds nothing to the basket; a line
          appears only when a quantity is set.
        source: DI-1107; CLIENT-RESPONSE-30SEP 3; MoM 29 Sep W5
      - element: group estimate
        rule: >-
          The enquiry panel reads "<group ticket> · Guests × <n>" with the per-person price and the
          estimate; supervisors are listed with "Free". A group booking is a request (requestGroupBooking
          with the group ticket and the headcount), so the button says Send request, not Pay.
        source: DI-1105; screens/P01-guest-web-storefront.yaml#WEB-005 notes (30 September)
      - element: step indicator
        rule: >-
          The published flow's steps in their order with this one highlighted, drawn in the venue's
          style (Bars, Dots, Counter "Step 2 of 4", Step names). A step the flow turned off is not drawn
          and is skipped.
        source: DI-1093; MoM 30 Sep 4.6; screens/P01-guest-web-storefront.yaml#WEB-005 (progressIndicator)
    actions:
      - action: Continue
        result: >-
          Off until a ticket and at least one guest are set (and, in the dated flow, a date and time).
          Goes to Add-ons (WEB-008) when the flow has an Extras step; otherwise to sign-in or the guest
          code (WEB-016) when signInAt is afterAddOns and the guest is anonymous; otherwise the basket.
          The basket is kept through sign-in.
        source: REV3-2; REV3-3; F01 branch at step 4
      - action: Help me choose
        result: >-
          Pop-up of one to four questions, three answers each; the answers filter the products in place
          (behaviour filter) or end on one result card (behaviour recommend). Show everything clears it.
          A swimmer answer pre-fills the swim consent, which the guest still confirms once.
        source: MoM 29 Sep W4; contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice; REV3-26
      - action: Change location (Booking at bar)
        result: >-
          Shown only when locationSwitcher is on. Switching venue clears the selection except lines whose
          product shares a familyKey at the new venue, which move; times and prices refresh. Confirm
          first when it would clear lines ("Changing to Mirdif clears 2 tickets").
        source: REV3-18; DI-1058
    edgeCases:
      - case: Water park swim answer
        expected: >-
          "All of us" keeps the full ride list at standard prices; "Some of us" changes the ride notes
          and shows a "Swim vests needed" counter; "None of us" switches the tickets to the splash and
          river pass (Adult AED 175, Junior AED 135, Child AED 125, Senior AED 135) and removes slides
          from the ride notes. The swim pop-up is not shown again where the question is on the page.
        source: DI-1108; CLIENT-RESPONSE-30SEP 4; DI-1118
      - case: An info-only product is chosen
        expected: Its details open with "Contact sales to book"; it can never reach the basket (the server refuses it with 409).
        source: REV3-14
      - case: The guest raises a quantity past what is left
        expected: >-
          The plus button stops at the remaining count with "Only 4 left for 19:30"; the line is
          refused rather than added and removed later.
        source: contracts/spine/orders.yaml#addCartLine ("Refused rather than added where capacity has gone")
    consistency:
      - with: GST-008
        note: >-
          Same pricing model, same one-line-per-ticket rule, same group headcount box. The app adds a +10
          button to the headcount stepper; the web does not.
      - with: WEB-006
        note: In the dated flow this is the third stage of the same staged page; the time hint and this hint use the same component.
      - with: KSK-004
        note: The kiosk counters follow the same ticket-then-guest-type rule and the same purchase limits.
    sampleData:
      flow: Summit Peaks, Multi-park combo, Friday
      tickets:
        - {name: 1 park ticket, price: AED 325}
        - {name: 2 park ticket, price: AED 475, sub: "Valid 6 days", badge: Popular}
      counters: Adult × 3 (AED 475 each), Child × 0, Senior × 0, Infant × 0 (free)
      basketLine: "2 park ticket · Adult × 3 = AED 1,425"
      groupCards:
        - {name: School group, sub: "Ages 5-18 · minimum 10", price: AED 145 per person, note: "One teacher free for every 10 students"}
        - {name: Corporate group, sub: "Adults · minimum 15", price: AED 225 per person}
        - {name: Tour operator group, sub: "Any age · minimum 20", price: AED 195 per person}
        - {name: Community group, sub: "Charities and clubs · minimum 10", price: AED 125 per person}
      groupEstimate: "School group · Guests × 45 = AED 6,525; Supervisors × 4 Free"
    corrections:
      - what: The action bar has a primary "Evaluate promotions" button and a modal that collects venueId, channel and lines.
        why: >-
          Promotions are evaluated automatically on every change (and codes are typed in the basket);
          a guest never fills a promotions form. The near-miss banner is the only visible part.
        source: screens/P01-guest-web-storefront.yaml#WEB-005 overlays.formEvaluatePromotions; F01 step 4
      - what: A raw "Every product variant" table (id, sku, axisValues, isActive) and a selected-variant detail panel.
        why: Plumbing columns; the guest sees counters per guest type. Inactive variants are never shown.
        source: screens/P01-guest-web-storefront.yaml#WEB-005 layout
      - what: Supervisors (free, one per N guests) and a water-park group choosing a session are not in the contract.
        why: The 30 September build draws both; requestGroupBooking has only packageProductId and expectedSize.
        source: screens/P01-guest-web-storefront.yaml#WEB-005 notes (30 September); DI-1114; DI-1117
      - what: The prototype's Read more panel on the multi-park flow still prices guests at single-park rates (Adult AED 325, Infant AED 475).
        why: A prototype defect; the counters on the page are the reference. Do not copy the Read more prices.
        source: screens/P01-guest-web-storefront.yaml#WEB-005 wireframe.prototype.differences
    decisions:
    - question: How many supervisors are free per group, and is it per group ticket?
      decision: 'Drawn default accepted: A separate free guest type, up to 1 per 10 guests.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-115 | CHG-NOTE-007
      questionSource: DI-1114
    - question: Is each group card's minimum set per group ticket?
      decision: 'Drawn default accepted: Each group ticket carries its own minimum, default 10.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-116 | CHG-NOTE-007
      questionSource: DI-1116
    - question: Is the swim vest an add-on product and the splash and river pass a separate product?
      decision: 'Drawn default accepted: The vest is an add-on; the splash and river pass is its own product filtered by the
        swim answer.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-117 | CHG-NOTE-007
      questionSource: DI-1118

  WEB-006:
    summary: >-
      Pick a date and then a time that has capacity. Block A. It comes BEFORE the tickets in every dated
      flow (date, then time, then tickets), and in the prototype the three stages are one staged page
      where each stage stays hidden until the previous one is chosen. Get right that choosing a time or
      session commits nothing: capacity is held only when a quantity is set.
    inputs:
      - field: date
        rule: >-
          A strip of the next dateStripDays days (default 7) with a calendar icon for the full month.
          Days with no performance or sold out online are disabled with the reason, not hidden. Days
          outside the channel's sales window are disabled ("Online booking closes the day before" for a
          next-day-minimum product).
        source: DI-920; DI-583; screens/P01-guest-web-storefront.yaml#WEB-006 (datePicker notes)
      - field: time
        rule: >-
          Hidden until a date is picked, with the hint "Choose a date to see times". Up to 8 times as
          large tiles; more than 8 as compact tiles paged timesPerPage at a time (default 24) with
          Earlier and Later, and Morning, Afternoon, Evening chips with counts (venue time zone, default
          split at 12:00 and 17:00). Tapping a selected chip again shows all times. Sold-out times are
          greyed, not removed.
        source: REV3-1; REV3-2; DI-1041
      - field: tour language
        rule: >-
          For guided tours the order is date, then language, then time slot; only tours in that language
          are listed. Languages are shown in their own script (English, العربية, Français, Deutsch, 中文,
          Русский). Cinema times show language and format (2D, 3D, subtitled).
        source: REV3-17; MoM 29 Sep W11; DI-1057
      - field: party ages and heights
        rule: >-
          Asked once, on leaving selection, only for products with an age or height rule: each person
          declares an age band and a height band. A person who does not qualify is flagged "Can't take
          part, too short" with Remove this guest or Choose another activity; Continue stays off until
          everyone qualifies. Height bands already chosen on a water-park day pass are the check and are
          not asked again.
        source: DI-1037; REV3 DG-3; DI-1000
    outputs:
      - element: time tile
        rule: >-
          Start time in 24-hour venue time (19:30), places left when low ("6 left"), price per person
          when it differs by time; a surf-style four-day calendar shows sessions stacked by time in each
          day column with places left and price per surfer.
        source: REV3-19; DI-1041
      - element: hint in place of the next stage
        rule: >-
          Until a session is chosen the ticket area says "Choose a session above to see its tickets and
          prices." Continue is off until date and time are both chosen.
        source: DI-1107; REV3-2
    actions:
      - action: Choose a time or session
        result: >-
          Reveals that session's tickets (WEB-005 stage). Adds nothing to the basket and holds nothing.
          If the cart's products ask consent questions they pop up once now, in the venue's theme, unless
          the page already asked the same question.
        source: DI-1107; F01 step 3; REV3-26; CLIENT-RESPONSE-30SEP 4
      - action: Set a quantity
        result: >-
          addCartLine takes the capacity for the cart's 15-minute window; the basket shows the line and
          the countdown. Refused with the next available time offered if the session filled meanwhile.
        source: contracts/spine/orders.yaml#addCartLine ("the window is 15 minutes"); F01 branch at step 3
    edgeCases:
      - case: The session sells out between loading and choosing
        expected: '"19:30 has just sold out" with the next available time pre-selected; nothing in the basket changes.'
        source: F01 branch at step 3
      - case: Online share sold out while the gate still sells
        expected: '"Sold out online" on the tile; correct per-channel behaviour, worth showing so it is not reported as a bug.'
        source: F01 branch at step 3
      - case: The event has exactly one on-sale performance
        expected: This step is skipped; a seated event opens straight on the seat map.
        source: REV3-4
      - case: The performance has a branded waiting room on
        expected: Adding tickets routes through WEB-015 before the line is taken.
        source: screens/P01-guest-web-storefront.yaml#WEB-006 transitions (ADR-0066)
    consistency:
      - with: GST-007
        note: >-
          Same reveal order, same day-part chips and the same consent pop-up. The app's own setting has
          times per page default 12 in the v4 build against 24 on the contract; use the contract default
          until the client says otherwise.
      - with: WEB-007
        note: For seated events this step and the seat map may render as one page; the time bar on the map is this step's time list.
      - with: KSK-005
        note: The kiosk's performance picker uses the same tiles and sold-out treatment.
    sampleData:
      venue: Coastal Aqua (water park), Surf sessions with filters
      dates: Fri 2 Oct to Thu 8 Oct, calendar for later
      dayParts: "Morning 6 · Afternoon 8 · Evening 4"
      sessions:
        - {time: "09:00", name: Beginner surf, place: "Bay 1 · 55 min", price: AED 295, left: 12}
        - {time: "19:30", name: Intermediate surf, place: "Bay 2 · 55 min", price: AED 345, left: 6}
        - {time: "17:00", name: Expert barrels, place: "Reef · 55 min", price: AED 495, left: 0}
      tourLanguages: [English, العربية, Français, Deutsch, 中文, Русский]
    corrections:
      - what: The primary action is labelled "Acquire inventory hold" with a modal collecting variantId, quantity, seatIds.
        why: >-
          The hold is taken by addCartLine when the guest sets a quantity; the guest never sees the word
          hold or a form. Since 30 September, choosing a session must add nothing.
        source: screens/P01-guest-web-storefront.yaml#WEB-006 actionBar; DI-1107
        status: fixed
        by: CHG-GST-003
      - what: '"Check booking eligibility" is a secondary button with a modal collecting productIds and party.'
        why: >-
          Eligibility is the per-person age and height declaration asked once on leaving selection, not a
          button; it should be drawn as that panel.
        source: DI-1037; REV3 DG-3
        status: fixed
        by: CHG-GST-003
      - what: The 30 September swim answer is three options for the party (All of us, Some of us, None of us) changing the products and prices, while REV3-26 models swim as a Yes/No consent per person or per booking.
        why: >-
          Two models for one question; the guidedAnswerIds filter has only requiresSwimmer true/false and
          no "some of us" vest counter. Needs one model before the build.
        source: DI-1108; REV3-26; contracts/spine/catalogue.yaml#searchCatalogue (guidedAnswerIds "leaves out products whose consent questions include the swim question")
    decisions:
    - question: Is the swim question a party-level three-way answer (filter) or a per-person consent, or both?
      decision: 'Drawn default accepted: Draw the on-page three-way question (All, Some, None of us) as the filter, and record
        the consent once per booking from it; no second pop-up.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-118 | CHG-NOTE-007
      questionSource: DI-1118; DI-1108

  WEB-007:
    summary: >-
      Choose seats on the stadium or theatre map. Block A. The client's rule is sections first: the map
      opens with every section coloured by its price band, a tap zooms into that section on the same map
      to show its seats, and pinch or scroll out (or Whole map) returns to compare sections. Get right
      that each tapped seat is held at once and goes into the basket with section, row, seat and price.
    inputs:
      - field: section
        rule: >-
          Colour-coded by price band with the price on the map itself (no separate tier list). Tap zooms
          in place, never a modal or a new page. Mixed maps show standing sections ("fan pit") as a block
          with a quantity stepper instead of seats.
        source: MoM 29 Sep W2; DI-916; DI-950; DI-411
      - field: seat
        rule: >-
          Zoomed in, every nearby section shows equal-size dots: available in the section's price
          colour, taken in grey, picked highlighted. Tap picks and holds; tap again releases. At most
          maxSeatsPerGuestOrder seats (default 10); the 11th tap says "Up to 10 seats per booking".
          Zoom in, Zoom out and Whole map buttons sit under the map.
        source: DI-983; DI-982; REV3-7; contracts/satellite/seating.yaml#/components/schemas/CreateSeatHoldRequest
      - field: performance (time bar)
        rule: >-
          Above the map when seatTimeBar is on (default): the chosen performance, the event's other
          times and Change date. Switching shows a confirmation when seats are held ("Changing the show
          releases your 4 seats") and then releases them.
        source: REV3-6; DI-1046
    outputs:
      - element: view from this section
        rule: >-
          The section's photo if supplied, else a render from the geometry (closer sections see a larger
          stage and fewer rows ahead). Placed bottom (default), right, left or top on wide screens;
          always below the map on narrow screens.
        source: REV3 23SEP-14; REV3-5; DI-1030
      - element: hold countdown
        rule: >-
          Always visible once a seat is held: "Your seats are held for 7:42". Seats are held 8 minutes by
          default (extendable to 30 minutes in all); the basket shows the earliest expiry. Turns amber
          under 2 minutes.
        source: contracts/satellite/seating.yaml#/components/schemas/CreateSeatHoldRequest (ttlSeconds default 480, max 1800); contracts/spine/orders.yaml#/components/schemas/CartLine (leaseExpiresAt); AUDIT-29SEP (8-minute countdown banner, amber under 2 minutes)
      - element: basket line per seat
        rule: >-
          One line per seat with section, row, seat and price, e.g. "Section 101 · Row A, Seat 4 · AED
          165" or, at the theatre, "Stalls · Row F, Seat 9".
        source: DI-982; DI-1047
      - element: fixture strip
        rule: The fixture (teams, date, kick-off) as a strip at the top, so a single-performance fixture opens straight on the map.
        source: REV3 23SEP-16
    actions:
      - action: Best available
        result: >-
          The guest picks a section and a party size and the system proposes seats together (accessible
          count and maximum price optional); accepting holds them like taps do. Shown as a link above the
          map, not a primary button.
        source: contracts/satellite/seating.yaml#recommendSeats; DI-410
      - action: Continue
        result: Off until at least one seat is held; goes to Add-ons, sign-in or the basket as the flow says.
        source: F02 step 2; REV3-3
    edgeCases:
      - case: The map has no geometry (imported from a manifest only)
        expected: >-
          The step sells from price categories and best-available groups as a list, saying so; it never
          shows an empty frame or refuses the seated flow.
        source: contracts/satellite/seating.yaml#/components/schemas/SeatAvailability (renderMode list); screens/P01-guest-web-storefront.yaml#WEB-007 notes
      - case: A seat is taken by someone else between drawing and tapping
        expected: '"Seat A4 was just taken" and the dot turns grey; other held seats are kept.'
        source: contracts/satellite/seating.yaml#createSeatHold
      - case: The hold expires
        expected: Seats return to the map, the basket lines are removed with a notice, and the guest can pick again.
        source: DI-422
      - case: A seating rule would leave a single empty seat
        expected: The tap is refused with the reason ("Please don't leave a single seat between bookings").
        source: DI-416
      - case: Date and time asked as a pop-up (seatEventDateMode popupOnSeatMap)
        expected: The map opens with a dialog for date then time; closing it keeps the performance already shown.
        source: REV3-4
    consistency:
      - with: GST-049
        note: Same section-first zoom and the same pinch in and out behaviour (agreed 30 September); the app always puts the view box below the map.
      - with: POS-004
        note: The till uses the same seat statuses and colours; the guest hold and the cashier hold are the same hold kinds.
      - with: WEB-049
        note: Transport seat selection (RTA layout, step 2 of 3) enters this screen; its map is a coach plan, not a bowl.
    sampleData:
      venue: Union Arena (stadium), Desert Nights concert, Sat 10 Oct 20:00
      priceBands: [VIP Box AED 650, Lower Tier AED 245, Upper Tier AED 165, Accessible bay AED 130 + companion free]
      picked: ["Section 101 · Row A, Seat 4 · AED 165", "Section 101 · Row A, Seat 5 · AED 165"]
      theatre: Grand Playhouse, Stalls rows A-K AED 245, Circle A-E AED 165, Balcony A-D AED 95
      countdown: "Your seats are held for 7:42"
    corrections:
      - what: The action bar shows "Create seat hold" as a primary button with a modal collecting id, performanceId, seatIds and ttlSeconds.
        why: >-
          A tap on a seat is the hold; the guest never chooses a hold length. ttlSeconds is the server
          default (480 s) and is never a guest input.
        source: screens/P01-guest-web-storefront.yaml#WEB-007 overlays.formCreateSeatHold; contracts/satellite/seating.yaml#/components/schemas/CreateSeatHoldRequest
        status: fixed
        by: CHG-GST-003
      - what: The seat hold lasts 8 minutes but the cart's lease window is 15 minutes, and the screens show both as a countdown.
        why: Two clocks on one booking confuse the guest; show one countdown, Cart.expiresAt (the earliest lease).
        source: contracts/spine/orders.yaml#addCartLine; contracts/spine/orders.yaml#/components/schemas/Cart (expiresAt)
  WEB-010:
    summary: >-
      The basket. Block A. In the prototype it is not a page: it is the persistent cart beside every
      booking step (sidebar right by default; left, slide-in right, slide-up bottom, floating basket icon
      or single column per venue), and it opens as a full review before payment. Get right that every
      line names what, for when and for whom, that the hold countdown is visible, and that a refused
      promo code says why.
    inputs:
      - field: promo code
        rule: >-
          One text field with Apply; applied to the cart at once. Two refusals read differently: "This
          code doesn't exist or has been used up" (promoCodeInvalid) and "This code is valid, but nothing
          in your basket qualifies" (promoCodeNotApplicable); an expired code says "expired on 30 Sep".
          Accepted codes show as removable chips and are re-checked on every read.
        source: contracts/spine/orders.yaml#applyCartPromoCode; DI-1074; F01 branch at step 5
      - field: line quantity
        rule: >-
          A stepper per line; lowering to 0 removes the line after a confirm that names it. Seats are
          removed one by one (each seat is its own line), not by a stepper. Removing a ticket also removes
          its add-ons (a locker with no admission is not a sale) and the confirm says so.
        source: contracts/spine/orders.yaml#/components/schemas/CartLine (parentLineId); DI-982
    outputs:
      - element: line
        rule: >-
          Product and guest type in one line ("2 park ticket · Adult × 3"), the visit date (the match
          date for a fixture, "Fri 2 Oct"), seat or cabana where held ("Stalls · Row F, Seat 9";
          "Cabana B09 · Large cabana · Beach"), and the line total in AED. Fees are their own lines
          (booking fee, delivery), never folded into the ticket price.
        source: DI-1106; DI-1029; REV3 23SEP-9; contracts/spine/orders.yaml#/components/schemas/CartLine (feeKind)
      - element: automatic offers
        rule: >-
          A buy-2-get-1 style offer adds its discounted item automatically with the price struck through
          (AED 245 → AED 0) and a short reason; a promotion that lapsed while the cart sat disappears on
          the next read with a notice.
        source: DI-174; DI-586; contracts/spine/orders.yaml#/components/schemas/Cart (appliedPromotionIds "re-evaluated on every read")
      - element: hold countdown
        rule: >-
          One countdown for the basket, from Cart.expiresAt (the earliest lease: 15 minutes for tickets,
          8 for seats and cabanas). Under 2 minutes it turns amber and offers "More time" once; the
          button says it is the last extension.
        source: contracts/spine/orders.yaml#extendCart ("5 minutes, and 1 extension"); contracts/spine/orders.yaml#addCartLine ("the window is 15 minutes"); AUDIT-29SEP (amber under 2 minutes)
      - element: upgrades
        rule: '"Upgrade your day" appears only once a main ticket is in the basket.'
        source: DI-978
      - element: totals
        rule: Subtotal, discounts, VAT (5%, shown as included or added per the venue's tax profile) and total in AED.
        source: contracts/spine/orders.yaml#/components/schemas/Cart (subtotal, discountTotal, taxTotal, total)
    actions:
      - action: Checkout
        result: >-
          Anonymous guest with signInAt atPayment, or guest checkout on, goes to sign-in or the guest
          code (WEB-016); a guest who proved the contact or is signed in goes straight to payment
          (WEB-012), skipping the details form unless the cart needs attendee forms or consents (WEB-011).
          Refused with the questions reopened when a required consent is unanswered.
        source: F01 step 6; MoM 29 Sep W1; screens/P01-guest-web-storefront.yaml#WEB-010 notes (consentRequired)
      - action: Empty basket
        result: Confirm names what is released ("Release 3 tickets and 2 seats?"); the holds are given back at once.
        source: DI-1074; contracts/spine/orders.yaml#abandonCart
    edgeCases:
      - case: A line became unavailable while the cart sat (lease expired or sold out)
        expected: >-
          The line is marked "No longer available" with Remove, and Checkout stays off until it is
          removed or re-added; a lapsed lease says "Your hold ended" not "Sold out".
        source: contracts/spine/orders.yaml#/components/schemas/CartLine (isAvailable)
      - case: The cart expired (410 cartExpired)
        expected: '"Your basket has expired" with Start again that returns to the product; nothing is half-kept.'
        source: screens/P01-guest-web-storefront.yaml#WEB-010 (Promo code notes)
      - case: Arabic
        expected: The cart stays on the right unless the venue chose Mirror to left; the rest of the layout flips.
        source: REV3-10; DI-1051
    consistency:
      - with: GST-041
        note: >-
          Same lines, same countdown, same promo messages. The app keeps the cart as a header button with
          a count during booking and a "save and finish later" option that keeps the order on the device.
      - with: KSK-006
        note: The kiosk review uses the same line wording.
    sampleData:
      lines:
        - "2 park ticket · Adult × 3 · Fri 2 Oct · AED 1,425"
        - "Fast Track · × 3 · AED 225"
        - "Cabana B09 · Large cabana · Beach · Fri 2 Oct · AED 1,855"
        - "Booking fee · AED 10"
      promo: "SUMMER10 applied · −AED 142.50"
      countdown: "Held for 12:41"
      total: AED 3,372.50 incl. VAT AED 160.60
    corrections:
      - what: The action bar shows eight raw operations (Add cart line, Save cart line, Create cart, Checkout cart, Evaluate promotions, Abandon cart, Extend cart, Remove cart line) with forms for createCart, addCartLine, checkoutCart.
        why: >-
          A guest never creates a cart or fills a checkout form; lines are added on the booking steps,
          promotions are evaluated on every read. The basket needs Checkout, Empty basket, More time,
          per-line quantity and remove, and the promo field only.
        source: screens/P01-guest-web-storefront.yaml#WEB-010 overlays
      - what: The glossary bans "Basket" as a synonym of Order and has no term for the cart, while guest screens and the client's responses say basket.
        why: Record Basket as the guest-facing word for the unpaid cart (a recorded exception), or pick Cart; the design uses Basket until decided.
        source: docs/glossary.md (Order, never say Basket); CLIENT-RESPONSE-REV3-25SEP (Basket)
      - what: The extend action is not in the prototype; only the seat step has a timer.
        why: extendCart is declared and the countdown with "More time" must be drawn on the basket.
        source: screens/P01-guest-web-storefront.yaml#WEB-010 wireframe.prototype.differences

  WEB-012:
    summary: >-
      Pay and create the order. Block A. After the 29 September decision (W1) a guest who proved their
      contact with the six-digit code, or is signed in, arrives here straight from the basket and only
      ticks the T&Cs; nothing is asked twice. Design for the unknown outcome first: a payment taken but
      not confirmed must offer "we're checking with your bank", never a retry that could charge twice.
    inputs:
      - field: guest contact (guest checkout)
        rule: >-
          Only the fields the venue configured (email only by default; or email + name; or email + mobile
          + name), then a code of exactly six digits; the copy says six. After the code nothing about the
          guest is asked again; the profile is created and completed later. With guest checkout off, the
          sign-in screen says "This venue requires an account for checkout. Your basket is kept."
        source: MoM 29 Sep W1; DI-1002; DI-1034; contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings (guestContactFields)
      - field: Terms and conditions
        rule: >-
          A required tick with the venue's T&Cs link; Pay stays off until ticked. Beside it "Send me offers
          and news", never pre-ticked; nothing is sent without it.
        source: MoM 29 Sep W1; DI-954; screens/P01-guest-web-storefront.yaml#WEB-012 x-ticvai-make-or-break
      - field: payment method
        rule: >-
          Card (embedded Stripe or Network International fields, or the hosted page) with Apple Pay and
          Google Pay as the device's wallet buttons. Wallet balance as a tender for signed-in guests with
          a balance, and split with card (e.g. AED 500 from the wallet, AED 200 on card).
        source: DI-079; DI-589; DI-525; screens/P01-guest-web-storefront.yaml#WEB-012 notes (card or wallet, R080)
      - field: delivery address (shop items only)
        rule: The shipping fee appears as its own line once the emirate is chosen (Dubai, Abu Dhabi, Ras Al Khaimah, international), before Pay.
        source: DI-360; DI-597
    outputs:
      - element: order summary
        rule: Stays visible throughout, never collapsed behind a link; same lines as the basket.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 (cartPanel notes)
      - element: currency note
        rule: >-
          Charged in the currency the guest selected where the venue charges it ("You'll be charged USD 388.02.
          AED 1,425.00 at 3.6725, rate held until 14:25."); otherwise charged in AED with "Shown in EUR for
          reference only." before Pay. Decided 2 October 2026 (Chinmay).
        source: contracts/spine/orders.yaml#checkoutCart; contracts/spine/orders.yaml#/components/schemas/Order; DI-211; DI-1071
    actions:
      - action: Pay
        result: >-
          Creates the order first, then the payment, so an unknown outcome has an order to attach to.
          3-D Secure or the hosted page opens as the provider asks. Paid → WEB-013. Declined → the
          provider's reason in plain words and the holds released at once; the guest may try another
          card on a fresh hold.
        source: F01 step 7; DI-422; contracts/spine/orders.yaml#/components/schemas/Payment (nextAction)
    edgeCases:
      - case: The payment outcome is unknown (timeout, closed tab, no webhook yet)
        expected: >-
          "We're checking with your bank. You won't be charged twice." The page inquires
          (inquirePaymentStatus) and lands on paid, declined or still unknown; still unknown says the result
          will be emailed and shows the order reference, never a Pay again button.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 notes; DI-1074
      - case: A hold lapsed before Pay
        expected: The line is re-acquired before the card is charged, or refused with the reason; the card is never charged for capacity that is gone.
        source: F01 step 7
      - case: Offline
        expected: Pay is unavailable with the reason; what was typed stays on screen.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 states.offline
    consistency:
      - with: GST-009
        note: Same W1 rule and the same unknown-outcome wording; the app's checkout is 4 steps with Apple Pay and adds the ticket to Apple or Google Wallet.
      - with: WEB-016
        note: The sign-in or guest-code gate is here only when signInAt is atPayment; otherwise it was passed on leaving Add-ons.
    sampleData:
      guest: Fatima Al Hashimi, fatima.h@example.ae, code sent to f•••@example.ae
      total: AED 1,660 (2 park ticket · Adult × 3 AED 1,425; Fast Track × 3 AED 225; booking fee AED 10)
      card: Visa •••• 4242
      declined: '"Your bank declined this payment (insufficient funds). Try another card."'
    corrections:
      - what: '"Transfer order tickets" is the primary action on the payment screen.'
        why: Transfers happen after purchase from the tickets (WEB-030); on this screen it would offer to give away tickets not yet paid for.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 actionBar; F55 step 4
        status: fixed
        by: CHG-GST-003
      - what: '"Create order", "Create payment" and "Inquire payment status" are buttons with forms that collect id, venueId, channel, lines, tender, recordedAt.'
        why: All three happen behind Pay; the inquiry is automatic in the unknown-outcome state.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 overlays
        status: fixed
        by: CHG-GST-003
      - what: The prototype offers Tabby split-in-4, pay on arrival and invoice/PO, against the 28 September decision of card or wallet only.
        why: Not in the first release; draw card, Apple Pay, Google Pay and wallet only.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 wireframe.prototype.differences; R080
      - what: DI-1035 (29 September) keeps a match prompt after the code ("Use this profile" / "Not me"), while the screen removed the "is this you?" step on 28 September (R120 b, matches attach automatically).
        why: Contradictory decisions; the W1 rule (straight to T&Cs after the code) supports the automatic match.
        source: DI-1035; screens/P01-guest-web-storefront.yaml#WEB-012 notes (R120 b); REV3 DG-1
    decisions:
    - question: May a guest-checkout customer be marketed on the opt-in taken at checkout?
      decision: 'Drawn default stands (answer: "Same as WEB-011: default accepted (batch 2)"): Unticked by default; nothing
        sent without it.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-119 | CHG-NOTE-007
      questionSource: DI-954
    - question: Is the post-code match prompt (DI-1035) still wanted after W1 and R120 (b)?
      decision: 'Drawn default accepted: No prompt; a verified match attaches automatically.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-120 | CHG-NOTE-007
      questionSource: DI-1035; MoM 29 Sep W1

  WEB-013:
    summary: >-
      The confirmation and the tickets. Block A. The order number is the first thing read, the tickets
      are deliverable from here (wallet, email, SMS, WhatsApp), and a dynamic-QR event bought on the web
      says the working code is in the app.
    outputs:
      - element: order number
        rule: >-
          Prominent, in the venue's format (venue prefix and sequence, e.g. YAS1-000123), with copy and
          "Sent to f•••@example.ae". It is the reference the venue's support asks for.
        source: contracts/spine/orders.yaml#/components/schemas/Order (orderNumber); F01 step 8
      - element: tickets
        rule: >-
          One card per ticket with guest type, visit date and its QR; for a dynamic-QR event no code is
          shown on the web, but "Your tickets activate in the app" with app store links and a link that
          opens the order in the app.
        source: DI-635
      - element: what happens next
        rule: Opening hours on the visit date, where to enter, what to bring (ID for resident tickets), and the cancellation policy line.
        source: designer default
    actions:
      - action: Add to Apple Wallet / Add to Google Wallet
        result: One button for the device's wallet (Apple on iOS and Safari, Google elsewhere).
        source: DI-198; DI-609
      - action: Resend tickets
        result: Choose email, SMS or WhatsApp and the address (prefilled from the order); confirms "Sent to +971 50 ••• 1234".
        source: DI-198; contracts/spine/orders.yaml#reprintOrder
      - action: Send to a friend
        result: Opens WEB-030 for chosen tickets of this order.
        source: F55 step 4
    edgeCases:
      - case: The confirmation is opened weeks later from the email
        expected: Shows the order as it is now (refunded, partly used, performance passed) with the reason, never an error.
        source: screens/P01-guest-web-storefront.yaml#WEB-012 entryState.coldEntry
      - case: The booking is unpaid (a reservation with a payment link)
        expected: An "Unpaid, pay by 14:32" banner with Pay now opening WEB-014.
        source: screens/P01-guest-web-storefront.yaml#WEB-013 wireframe.prototype.differences
    consistency:
      - with: GST-010
        note: Same content; the app shows the code directly and adds to wallet and calendar.
      - with: KSK-009
        note: Same order number format on the printed ticket.
    sampleData:
      orderNumber: YAS1-000123
      tickets: "3 × 2 park ticket · Adult · Fri 2 Oct"
      sentTo: f•••@example.ae
    corrections:
      - what: '"Transfer order tickets" is the primary action, with a form collecting ticketIds and recipient.'
        why: The primary action here is the tickets themselves (wallet, resend); transfer is secondary and opens WEB-030.
        source: screens/P01-guest-web-storefront.yaml#WEB-013 actionBar
        status: fixed
        by: CHG-GST-003
      - what: The prototype allows editing attendee details after purchase and Reissue QR; neither is declared on this screen.
        why: Either declare the operations or leave them out of the design.
        source: screens/P01-guest-web-storefront.yaml#WEB-013 wireframe.prototype.differences

  WEB-014:
    summary: >-
      Pay for a booking the venue's sales team made (a school trip, a corporate day, a phone booking),
      from a link in an email, SMS or WhatsApp, with no account. Block A. Cold entry is the only way in.
      Show what is being paid for before how to pay, and the deadline as time remaining.
    inputs:
      - field: email for your tickets
        rule: Optional and only to send the tickets; never an account step.
        source: screens/P01-guest-web-storefront.yaml#WEB-014 (textField notes)
      - field: payment
        rule: The gateway's card or Apple Pay fields; the provider token is never something the guest types.
        source: contracts/spine/orders.yaml#payByLink
    outputs:
      - element: booking summary
        rule: >-
          Venue, lines, visit date, total and, for a deposit link, what this payment is ("Deposit 25% ·
          AED 1,631 of AED 6,525; balance due by 14 Oct").
        source: DI-567; DI-615
      - element: deadline
        rule: '"Expires in 46 minutes" (or "in 2 days"), never only a timestamp; at expiry the hold is released and the booking cancels.'
        source: screens/P01-guest-web-storefront.yaml#WEB-014; contracts/spine/orders.yaml#/components/schemas/PaymentLink (expiresAt "the expiry releases the hold")
    edgeCases:
      - case: The link has expired, been superseded by a resend, or was already paid
        expected: >-
          Each says which ("This link was replaced by a newer one sent on 1 Oct"; "Already paid on 30 Sep,
          your tickets were sent to f•••@example.ae") with the venue's contact.
        source: contracts/spine/orders.yaml#/components/schemas/PaymentLink (status, resendCount)
    consistency:
      - with: WEB-012
        note: Same payment component and the same unknown-outcome state.
    sampleData:
      booking: "Al Noor Private School · School group · Guests × 45 · Tue 21 Oct"
      amount: Deposit AED 1,631.25 of AED 6,525
      expires: Expires in 2 days
    corrections:
      - what: Two pay buttons (Pay now, and Pay by link with a form collecting providerToken).
        why: One Pay button; the provider token comes from the gateway, not a form.
        source: screens/P01-guest-web-storefront.yaml#WEB-014 layout
        status: fixed
        by: CHG-GST-003
      - what: No prototype frame exists (match none).
        why: The screen needs a frame before build; it reuses WEB-012's payment component.
        source: screens/P01-guest-web-storefront.yaml#WEB-014 wireframe

  WEB-015:
    summary: >-
      The branded on-sale waiting room for one high-demand performance. Block A. It is reached only when
      adding tickets is refused because the room is on; the guest presses Take my place, sees their
      position and an estimated wait, and is sent back to the tickets when admitted. Branded with the
      venue's logo and theme, and the place survives a refresh.
    inputs:
      - field: Take my place
        rule: A pressed button, never fired on page load, so a prefetch or a bot takes no place; hidden once the guest has one.
        source: screens/P01-guest-web-storefront.yaml#WEB-015 actionBar
    outputs:
      - element: position
        rule: >-
          "You're number 1,284 · about 6 minutes", with a progress bar and "This is an estimate". Updated
          every pollAfterSeconds; the page says refreshing keeps your place.
        source: contracts/spine/catalogue.yaml#/components/schemas/WaitingRoomEntry; DI-016; ADR-0066
      - element: admitted
        rule: '"It''s your turn" with Continue to your tickets and how long the admission lasts; admission unused in time expires and the guest enters again.'
        source: contracts/spine/catalogue.yaml#/components/schemas/WaitingRoomEntry (admitted, expired)
    edgeCases:
      - case: The room is switched off or the sale closes while waiting
        expected: '"The waiting room has closed" with the event page; never a 404.'
        source: contracts/spine/catalogue.yaml#/components/schemas/WaitingRoomEntry (closed); screens/P01-guest-web-storefront.yaml#WEB-015 entryState
      - case: Offline
        expected: The last position stays with its age; polling resumes with the same place when the connection returns.
        source: screens/P01-guest-web-storefront.yaml#WEB-015 states.offline
    consistency:
      - with: GST-046
        note: Same room, same wording; the app may notify when admitted.
      - with: WEB-040
        note: Not the ride queue; do not reuse the ride queue's visuals or wording.
    sampleData:
      event: Desert Nights, Union Arena, Sat 10 Oct 20:00
      position: "You're number 1,284 · about 6 minutes"
    corrections:
      - what: The prototype keeps the place only while the page is open ("refreshing puts you at the back").
        why: The room keeps the place across a refresh (same entry for the same idempotency key); the copy must not tell guests the opposite.
        source: screens/P01-guest-web-storefront.yaml#WEB-015 wireframe.prototype.differences; ADR-0066
      - what: The prototype's waiting room is unreachable from the Config drawer.
        why: Reviewers cannot see it; it needs a reachable frame.
        source: screens/P01-guest-web-storefront.yaml#WEB-015 wireframe.prototype.view
  WEB-019:
    summary: >-
      The signed-in guest's orders at this venue, newest first, with each order's tickets, tax invoice
      and the two after-sales actions a guest may start (send tickets to someone, ask for a refund).
      Block A. Get right that it lists only the caller's own orders and that a refund is a request,
      not a refund.
    inputs:
      - field: since
        rule: A simple period filter (Last 30 days, This year, All), not a raw date field; default All.
        source: contracts/spine/orders.yaml#listMyOrders
      - field: refund request
        rule: >-
          Choose the lines (all by default), a reason of at least 3 characters (a short list plus "Other"),
          and send. Copy says "We'll review your request" and when the venue usually answers; it never says
          "refunded".
        source: contracts/spine/orders.yaml#createRefundRequest; DI-254
    outputs:
      - element: order row
        rule: >-
          Order number, visit date, what was bought in one line ("3 × 2 park ticket"), total in AED and
          status in guest words (Paid, Partly refunded, Refunded, Cancelled, Used).
        source: contracts/spine/orders.yaml#/components/schemas/Order
      - element: tax invoice
        rule: View or download the tax invoice PDF, and credit memos for refunds, per order.
        source: screens/P01-guest-web-storefront.yaml#WEB-019 apis (listTaxInvoices, getTaxDocumentRendition)
    actions:
      - action: View tickets
        result: Opens My Tickets (WEB-018) on that order.
        source: screens/P01-guest-web-storefront.yaml#WEB-019 transitions
      - action: Request a refund
        result: Enters the venue's approval queue; the row shows "Refund requested" until operations approve, reject or ask for more information.
        source: DI-254; contracts/spine/orders.yaml#createRefundRequest
    edgeCases:
      - case: An order bought as a guest checkout before the account existed
        expected: >-
          Appears once the contact was verified (matches attach automatically); an unverified one does not
          appear and the page offers "Can't find an order? Link a booking" (GAP-B3 link guest checkout).
        source: DI-1074; screens/P01-guest-web-storefront.yaml#WEB-012 notes (R120 b)
    consistency:
      - with: GST-016
        note: Same order wording and status words on the app.
    sampleData:
      rows:
        - {order: YAS1-000123, date: "Fri 2 Oct", items: "3 × 2 park ticket", total: "AED 1,660", status: Paid}
        - {order: YAS1-000098, date: "Sat 12 Sep", items: "Cabana B09", total: "AED 1,855", status: Refunded}
    corrections:
      - what: The layout carries both "Every order" from listMyOrders and "Every order" from listOrders (the staff-scoped list).
        why: A guest screen must use only the caller-scoped listMyOrders; listOrders was removed from guest screens for that reason on 24 August and came back with the 31 August parity pass.
        source: screens/P01-guest-web-storefront.yaml#WEB-019 notes; contracts/spine/orders.yaml#listMyOrders
        status: fixed
        by: CHG-GST-003
      - what: issueTaxInvoice (a staff operation) is declared on a guest screen.
        why: The guest views and downloads invoices; issuing is not a guest action.
        source: screens/P01-guest-web-storefront.yaml#WEB-019 apis

  WEB-021:
    summary: >-
      The guest's stored value: wallet balance with its expiry breakdown, transactions, gift cards
      (balance check by code), game cards, saved cards and auto top-up. Block A. Get right that the
      guest sees the expiry lots but never chooses which is spent (nearest expiry first), and that top-up
      and transfer appear only where the venue and the guest's family role allow them.
    inputs:
      - field: gift card code
        rule: Check balance by code (the 16-character code on the card); shows balance, expiry and where it can be used (online, on site or both).
        source: contracts/satellite/wallet.yaml#getGiftCard; DI-533
      - field: auto top-up
        rule: >-
          "When my balance drops below AED 50, add AED 200" with the saved card; minimum and maximum per
          top-up come from the venue's rules. Off by default.
        source: DI-519; DI-517; contracts/satellite/wallet.yaml#setWalletAutoReloadSetting
      - field: transfer
        rule: >-
          To a linked family member's wallet, or to another guest only where the venue allows peer-to-peer;
          amount and optional message. Hidden when the venue toggle is off.
        source: DI-532; DI-536
    outputs:
      - element: balance
        rule: >-
          Total in AED, split into cash and bonus credit, with the expiry lots ("AED 150 expires 31 Dec");
          bonus credit is spent first under its own validity.
        source: DI-523; TRACKER 30-September Old rows row 118 (A167)
      - element: family
        rule: Each linked child with their allowance ("Omar · AED 200 of AED 500"); a child account sees balance and spending but no Top up.
        source: DI-529; DI-509
      - element: saved cards
        rule: Masked only ("Visa •••• 4242, expires 08/28"); never the full number.
        source: DI-069
    actions:
      - action: Top up
        result: Only the payment methods the venue allows online for top-up; a top-up above the venue's approval threshold is not offered online.
        source: DI-517; DI-520
      - action: Save a card
        result: Through the gateway's card form with the consent to store it; the guest never sees a token.
        source: contracts/spine/orders.yaml#storePaymentToken
    edgeCases:
      - case: Wallet settled at exit (resort-style wallets)
        expected: Shows the refundable or due balance at exit and Settle; for venues without exit settlement the block is absent.
        source: screens/P01-guest-web-storefront.yaml#WEB-021 apis (getWalletExitBalance, settleWalletAtExit)
    consistency:
      - with: GST-011
        note: Same balance, lots and family layout; the app adds wristband and NFC.
      - with: WEB-012
        note: The wallet tender at payment shows the same balance figure.
    sampleData:
      balance: AED 420 (cash AED 350, bonus AED 70 expires 31 Dec)
      giftCard: "GC-7Q4M-2KX9-PL3A · AED 250 · online and on site"
      family: ["Omar · AED 200 of AED 500", "Layla · AED 150 of AED 500"]
      savedCard: Visa •••• 4242
    corrections:
      - what: Raw "Store payment token" primary button with a form collecting providerId, providerToken, consentPurposeId.
        why: A guest saves a card through the gateway form; the token fields are never shown.
        source: screens/P01-guest-web-storefront.yaml#WEB-021 overlays
        status: fixed
        by: CHG-GST-003
      - what: '"Every wallet transaction" is bound to retail.yaml in one region and wallet.yaml in another.'
        why: The transactions are wallet.yaml's listWalletTransactions; the retail reference is a generator slip.
        source: screens/P01-guest-web-storefront.yaml#WEB-021 layout

  WEB-022:
    summary: >-
      The membership and annual pass plans on sale, compared side by side, and the guest's own plan if
      they hold one. Block A. In the prototype plans are sold through a booking flow (Annual pass /
      membership), so this page is a comparison that hands off to that flow.
    outputs:
      - element: plan card
        rule: >-
          Name, price per year (or month), validity by dates, the benefits as a short list (free entry,
          F&B discount, guest passes, Fast Track), blockout days named ("Not valid on public holidays").
        source: DI-138; DI-452; DI-201
      - element: current plan
        rule: The guest's plan is marked "Your plan" with its expiry; upgrade shows only inside the venue's upgrade window.
        source: DI-467; contracts/spine/catalogue.yaml#getMyMemberships
    actions:
      - action: Choose a plan
        result: >-
          Opens the membership booking flow with a quantity stepper once selected (a family buying two),
          profile capture of each member, and auto-renewal with card-on-file consent.
        source: DI-980; DI-448; DI-138
    consistency:
      - with: GST-015
        note: Same plans and benefits wording on the app's Memberships.
    sampleData:
      plans:
        - {name: Summit Peaks Annual Pass, price: "AED 1,295 / year", benefits: ["Unlimited entry", "10% off food", "2 guest passes"]}
        - {name: Kids Club Membership, price: "AED 149 / month", benefits: ["Unlimited weekday play", "Free socks"]}
    corrections:
      - what: Filter fields "Venue id", "Kind" and "Is sellable" and a raw product table.
        why: The page lists membership products only, for the guest's venue; the filters are generated parameters.
        source: screens/P01-guest-web-storefront.yaml#WEB-022 layout
        status: fixed
        by: CHG-GST-003
      - what: Both getMyMemberships and listGuestMemberships are declared.
        why: One guest-scoped read is enough; listGuestMemberships is the staff-shaped list.
        source: screens/P01-guest-web-storefront.yaml#WEB-022 apis
        status: fixed
        by: CHG-GST-003

  WEB-023:
    summary: >-
      Manage the membership the guest holds: card, benefits, linked members, billing statements and the
      declined-renewal recovery. Block A. The decline states decided on 29 September are the core of the
      design.
    outputs:
      - element: membership card
        rule: Member name and photo, membership ID, validity, tier, QR for entry; linked members listed (view only).
        source: DI-201
      - element: billing statement
        rule: >-
          Line by line, with VAT, invoice number and member savings; send as PDF or CSV. States: soft
          decline (Retry now + Use another card), hard decline (Use another card only), declined again (Use
          another card + the next automatic retry date), paid ("Your membership continues").
        source: DI-1036; REV3 DG-2; AUDIT-29SEP (Account and services)
      - element: instalments
        rule: Where the plan allows, the instalment schedule with paid and upcoming instalments.
        source: screens/P01-guest-web-storefront.yaml#WEB-023 apis (listInstalmentPlans)
    actions:
      - action: Retry now / Use another card
        result: Retries the declined renewal on the same or a saved card; success shows paid, failure the next state.
        source: contracts/satellite/payments.yaml#retryMyDunningPayment; DI-1036
      - action: Upgrade, suspend, cancel
        result: Each offered only within the venue's timing windows (e.g. upgrade only in the final two months); cancel confirms what is lost and when.
        source: DI-467
    consistency:
      - with: GST-015
        note: The app shows the same decline states and statement.
    sampleData:
      member: Ahmed Al Mansoori, SP-AP-0042317, valid to 30 Sep 2027
      statement: "1 Oct 2026 · Annual pass renewal AED 1,295 (incl. VAT AED 61.67) · Declined (soft)"
    corrections:
      - what: '"Transfer order tickets" is the primary action on Membership Management.'
        why: It has no use on this screen (the prototype's membership transfer to a family member is a different operation).
        source: screens/P01-guest-web-storefront.yaml#WEB-023 wireframe.prototype.differences
        status: fixed
        by: CHG-GST-003

  WEB-030:
    summary: >-
      Send tickets to someone else and see what you have sent. Block A. Per ticket, not per order (a
      family splitting tickets between phones is the normal case); ownership moves only when the friend
      claims the link, so a mistyped address expires rather than losing the ticket.
    inputs:
      - field: tickets
        rule: Tick the individual tickets of an order (guest type and date shown); used, name-bound or already-offered tickets are disabled with the reason.
        source: contracts/spine/orders.yaml#transferOrderTickets
      - field: recipient
        rule: Channel (email, SMS, WhatsApp) and the address; a message up to 500 characters.
        source: contracts/spine/orders.yaml#transferOrderTickets
    outputs:
      - element: sent transfers
        rule: >-
          Each with tickets, masked recipient, status in guest words (Waiting to be claimed, Claimed, Expired
          and returned to you, Cancelled) and when an unclaimed offer expires.
        source: contracts/spine/orders.yaml#/components/schemas/TicketTransfer
    actions:
      - action: Send
        result: The friend gets a claim link; the tickets show "Offered to s•••@example.com" until claimed.
        source: F55 step 4
      - action: Cancel transfer
        result: Allowed while unclaimed; the tickets come back at once.
        source: screens/P01-guest-web-storefront.yaml#WEB-030 wireframe.prototype.differences
      - action: Sell on resale
        result: >-
          Lists a ticket at an asking price within the venue's resale window; the ticket ID stays and the
          buyer gets new media, so the seller's QR stops working once sold. Refused for partly used or
          name-bound tickets.
        source: contracts/spine/orders.yaml#createResaleListing; TRACKER 30-September Old rows row 146 (A211)
    edgeCases:
      - case: A dynamic-QR ticket bound to the sender's device
        expected: The transfer moves the credential to the recipient's device and the sender's copy stops admitting; the copy says so before sending.
        source: DI-636
    consistency:
      - with: GST-014
        note: The friend claims in the app (GST-014); the sender's view and statuses match.
    sampleData:
      order: YAS1-000123
      tickets: ["2 park ticket · Adult · Fri 2 Oct (1 of 3)", "2 park ticket · Adult · Fri 2 Oct (2 of 3)"]
      recipient: "WhatsApp +971 55 ••• 0198"
      message: Enjoy the day, see you at the gate!
    corrections:
      - what: Staff list filters "Venue id", "Principal id", "Shift id", "Status", created from/to over listOrders.
        why: A guest picks among their own orders (listMyOrders) and their tickets; staff filters must not appear.
        source: screens/P01-guest-web-storefront.yaml#WEB-030 layout; contracts/spine/orders.yaml#listMyOrders
        status: fixed
        by: CHG-GST-003
      - what: '"Claim ticket transfer" sits on the sender''s screen with a claimToken form.'
        why: The recipient claims from the link (in the app, GST-014, or a claim landing); the token is never typed.
        source: screens/P01-guest-web-storefront.yaml#WEB-030 overlays.formClaimTicketTransfer
        status: fixed
        by: CHG-GST-003
      - what: Not on the wireframe board.
        why: Needs a frame before build.
        source: screens/P01-guest-web-storefront.yaml#WEB-030 notes

  WEB-031:
    summary: >-
      The guest's reservations (booked, not yet paid: held bookings, table reservations with deposits,
      group requests) and, since 29 September, the web's Group Booking view. Block A. Get right the
      difference from My Tickets: a reservation holds capacity, expires and carries no money until paid.
    inputs:
      - field: group request
        rule: >-
          Choose the group ticket (School, Corporate, Tour operator, Community, each with per-person price
          and minimum), the date (and, for session products, a session), then How many people as a typed
          number box with minus and plus, supervisors separate and free. School adds the school name, year
          group, access and dietary needs; a party adds the child's name and turning age (1 to 18) and
          allergies. Headcount, child's name and age already entered are prefilled, never asked twice.
        source: DI-1104; DI-1105; DI-1117; contracts/spine/orders.yaml#/components/schemas/GroupBookingRequest; DI-1000
    outputs:
      - element: reservation row
        rule: >-
          What, when, status in guest words (Awaiting payment, Confirmed, Expired, Cancelled), pay-by
          deadline as time remaining; a table deposit shows the amount, refundable until, and late-cancel
          and no-show terms.
        source: DI-612; screens/P01-guest-web-storefront.yaml#WEB-031 notes (REV3-8b)
      - element: group request status
        rule: >-
          Provisional with the held date; school "Quote and risk assessment within 2 working days, final
          headcount due 5 days before"; party "Deposit AED 100 per AED 400, refundable up to 24 hours before".
        source: contracts/spine/orders.yaml#requestGroupBooking; REV3 DG-4
    actions:
      - action: Pay now
        result: Opens the payment for that reservation (WEB-014's payment component) before its deadline.
        source: screens/P01-guest-web-storefront.yaml#WEB-031 wireframe.prototype.differences
      - action: Cancel reservation
        result: The confirm names what is released and any deposit kept ("Cancel table for 4 on Fri 19:30? Your AED 100 deposit is not refundable after 24 hours.").
        source: screens/P01-guest-web-storefront.yaml#WEB-031 overlays.confirmCancelReservation
    edgeCases:
      - case: The headcount is over the package's cap, or the date has gone
        expected: Over-cap and date-gone states with the nearest alternative date.
        source: REV3 DG-4
    consistency:
      - with: GST-072
        note: Same group request and headcount box; the app adds a +10 step.
      - with: WEB-005
        note: The prototype draws the group request as a booking flow (group tickets, then headcount); it must be the same component here.
      - with: GST-016
        note: Same reservation statuses.
    sampleData:
      reservations:
        - {what: "Table for 4 · Saffron Table", when: "Fri 2 Oct 19:30", status: Confirmed, deposit: "AED 100, refundable until Thu 19:30"}
        - {what: "School group · Guests × 45 · Al Noor Private School", when: "Tue 21 Oct", status: "Provisional · quote within 2 working days"}
    corrections:
      - what: GroupBookingRequest.kind is general, school, corporate or party; the 30 September build shows Tour operator and Community as their own group types.
        why: Either the enum gains them or the cards map to general; the design shows four cards.
        source: contracts/spine/orders.yaml#/components/schemas/GroupBookingRequest; DI-1115
      - what: The screen is named My Reservations but is also the web's Group Booking view (GAP-D3), and the prototype labels the group request dialog WEB-031.
        why: Two jobs on one id; the designer should treat the request form as a flow opened from here and from the booking listing.
        source: DI-1078; screens/P01-guest-web-storefront.yaml#WEB-031 wireframe.prototype.differences
      - what: '"Save table reservation" with a form exposing outletId, tables, status, tableVisitId, actualPartySize.'
        why: Staff fields; a guest may change party size and time, or cancel.
        source: screens/P01-guest-web-storefront.yaml#WEB-031 overlays.formUpdateTableReservation
        status: fixed
        by: CHG-GST-003
    decisions:
    - question: Are water-park groups booked into a session?
      decision: 'Drawn default accepted: Group requests take a date and, for session products, a session.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-121 | CHG-NOTE-007
      questionSource: DI-1117

  WEB-032:
    summary: >-
      What offers are on at the venue, in guest language, each with a way to use it. Block A. The page
      has no basket, so it explains and links; the price effect is shown where the basket is.
    outputs:
      - element: offer card
        rule: >-
          Image, the rule in plain words ("Buy 2 adult day passes, get a child pass free"), valid dates,
          where it applies (online, at the gate), and whether it needs a code (shown with Copy) or applies
          automatically. Member-only offers say "Members" and show for signed-in members only.
        source: DI-174; contracts/satellite/promotions.yaml#listPromotions
    actions:
      - action: Use this offer
        result: Opens the qualifying product's booking (or the listing filtered to it); a code is applied to the basket automatically.
        source: screens/P01-guest-web-storefront.yaml#WEB-032 wireframe.prototype.differences
    consistency:
      - with: GST-037
        note: Same offers and wording on the app.
    sampleData:
      offers:
        - {title: Family Friday, rule: "2 adults + 2 children for AED 899", valid: "Fridays to 31 Dec", applies: Automatically}
        - {title: SUMMER10, rule: "10% off day passes booked online", valid: "to 31 Oct", applies: Code}
    corrections:
      - what: Filters "Venue id", "Status", "Active at" and a raw promotions table.
        why: A guest sees active offers for their venue only; status and venue are not guest inputs.
        source: screens/P01-guest-web-storefront.yaml#WEB-032 layout
        status: fixed
        by: CHG-GST-003

  WEB-033:
    summary: >-
      Merchandise to browse before arriving, paid online and collected at the venue (or delivered).
      Block A. The 29 September build put the shop under At the venue with a choice of collection point
      (Collect at the gate, car park kiosk, home delivery) and a collection code after paying; use that
      as the pattern.
    inputs:
      - field: collection point
        rule: Collect at the gate, car park kiosk, or home delivery; home delivery shows the shipping fee by emirate before payment.
        source: AUDIT-29SEP (At venue, Shop); DI-597; DI-505
      - field: quantity and options
        rule: Size and colour as variant chips; quantity stepper; out-of-stock variants disabled.
        source: contracts/satellite/retail.yaml#listMerchandise
    outputs:
      - element: product card
        rule: Square photo, name, price in AED, in stock or "Only 3 left"; combo packs show the bundle price against the separate prices.
        source: DI-358; DI-1080 (square shot per shop item)
      - element: collection code
        rule: After payment, the collection code and where to collect ("Show code 4827 at the Main Gate shop, open until 22:00").
        source: AUDIT-29SEP (At venue, Shop); contracts/spine/orders.yaml#checkoutCart ("each retail line marked for collection becomes a shop-and-drop"); contracts/satellite/retail.yaml#createShopAndDrop
    actions:
      - action: Add to basket
        result: Joins the same basket as tickets; one checkout, one receipt.
        source: DI-293; DI-141
    consistency:
      - with: GST-026
        note: The app reserves in the venue; the web always pays online first (R236).
      - with: WEB-042
        note: Shop and drop in the venue uses the same collection code.
    sampleData:
      items:
        - {name: Summit Peaks hoodie, price: AED 149, variants: [S, M, L, XL]}
        - {name: Plush falcon mascot, price: AED 79}
        - {name: "Tee + cap combo", price: AED 119, was: AED 138}
      collectionCode: "4827 · Main Gate shop"
    corrections:
      - what: '"Outlet id" and "Category id" text fields, an "In stock only" toggle and a "Lookup merchandise" primary button (a barcode price check).'
        why: Barcode lookup is a till operation; a guest browses categories and an outlet chosen from names.
        source: screens/P01-guest-web-storefront.yaml#WEB-033 layout
        status: fixed
        by: CHG-GST-003
      - what: No browsable shop frame before arrival in the prototype; not on the wireframe board.
        why: Needs a frame; the At the venue shop is the nearest reference.
        source: screens/P01-guest-web-storefront.yaml#WEB-033 wireframe
  WEB-039:
    summary: >-
      The venue map with live wait times, for a guest at the venue without the app. Block A. The 30
      September build draws a 3D view with the 2D plan one tap away and walking directions; the screen
      must keep a stale wait time visible but marked, never hidden and never shown as live.
    outputs:
      - element: wait time
        rule: >-
          Per ride on its map pin and in the list ("41 min"); a stale reading keeps its minutes greyed with
          "as of 14:05". A closed ride says Closed, not 0 min. Long waits are coloured against nearby
          shorter ones so the guest can choose.
        source: contracts/satellite/queue.yaml#getWaitTimes; screens/P01-guest-web-storefront.yaml#WEB-039 (wait time notes, R080 b); DI-204; DI-682
      - element: map
        rule: >-
          3D view by default where the venue supplied a model, 2D plan one tap away ("Same plan, drawn two
          ways"); points for rides, dining, shops, restrooms, first aid and gates with category filters.
        source: screens/P01-guest-web-storefront.yaml#WEB-039 wireframe.prototype; DI-891; DI-203
    actions:
      - action: Directions
        result: >-
          From the chosen gate or "you are here" (with location permission) to a point, as a route on the
          map and a step list; the route graph works offline once loaded.
        source: screens/P01-guest-web-storefront.yaml#WEB-039 states.offline; AUDIT-29SEP (turn-by-turn banner)
    edgeCases:
      - case: The venue has no 3D model, or the device cannot render it
        expected: Opens on the 2D plan with no error.
        source: DI-1103 (our reading adds a 2D fallback)
      - case: Location is denied or weak
        expected: Directions start from a chosen gate; no blue dot.
        source: DI-1103 (weak-GPS state)
    consistency:
      - with: GST-021
        note: Same pins, categories and wait-time treatment; the app adds live walking navigation.
    sampleData:
      waits: ["The Drop · 41 min", "Vortex · 25 min", "Lazy River · 5 min", "Falcon Coaster · Closed"]
      staleNote: "as of 14:05"
    corrections:
      - what: '"Venue id" text field, "Open only" toggle and an "Every queue" table.'
        why: The map is the venue's; a guest filters by category (rides, dining) not by queue records.
        source: screens/P01-guest-web-storefront.yaml#WEB-039 layout
        status: fixed
        by: CHG-GST-003
      - what: No map3dUnavailable or weak-GPS state is drawn.
        why: Both need frames.
        source: screens/P01-guest-web-storefront.yaml#WEB-039 wireframe.prototype.differences

  WEB-041:
    summary: >-
      Reserve and pay for parking before arriving, through the normal basket. Block A. There is no live
      space count in the first release: never show free bays; a full car park is the "full for that day"
      refusal when the guest tries.
    inputs:
      - field: car park
        rule: Cards per car park with its price and walking time (Premium by the gate, Standard East, Accessible bays, Coach and minibus).
        source: sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html (parking options); contracts/spine/access.yaml#listParkingFacilities
      - field: plate number
        rule: >-
          Asked only for a car park on the ANPR model (plate pushed to the barrier whitelist), with the
          emirate or country; changeable later until entry. Not asked where security checks the QR.
        source: DI-300; DI-316; contracts/spine/access.yaml#updateParkingEntitlement
      - field: date
        rule: The visit date, prefilled from tickets already in the basket.
        source: designer default
    outputs:
      - element: parking pass
        rule: After payment, the pass with car park, date, plate (if any) and the QR the barrier or security reads.
        source: contracts/spine/orders.yaml#addCartLine ("the parking entitlement is issued at payment")
    actions:
      - action: Add to basket
        result: Adds the car park's parking product as a basket line; paid with the tickets in one checkout.
        source: contracts/spine/orders.yaml#addCartLine; R166
    edgeCases:
      - case: The car park is full for the day
        expected: '"Premium is full on Fri 2 Oct" with the other car parks; shown only after trying.'
        source: screens/P01-guest-web-storefront.yaml#WEB-041 states.soldOutForDay
    consistency:
      - with: GST-027
        note: Same car parks and the same full-for-the-day message.
    sampleData:
      carParks:
        - {name: "Premium · by the gate", sub: "Under cover · 2 minutes on foot", price: AED 80}
        - {name: "Standard · East", sub: "Open air · 7 minutes on foot", price: AED 40}
        - {name: Accessible bays, sub: "Beside the accessible entrance", price: Free}
      plate: "Dubai · K 48213"
    corrections:
      - what: The prototype shows live free-bay counts and pays with "Reserve and pay" directly.
        why: No live count in the first release, and parking goes through the basket (R166); the design must not show bays left.
        source: screens/P01-guest-web-storefront.yaml#WEB-041 wireframe.prototype.differences
      - what: Separate "Check out" and "Pay" buttons and a "Save parking entitlement" form exposing status.
        why: Checkout is the basket's; a guest may change the plate, not set an entitlement status.
        source: screens/P01-guest-web-storefront.yaml#WEB-041 layout
        status: fixed
        by: CHG-GST-003
    decisions:
    - question: Which wave do web and app parking ship in?
      decision: 'Drawn default accepted: Draw both now; the wave is the client''s pick.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-122 | CHG-NOTE-007
      questionSource: REV3 GAP-D2

  WEB-048:
    summary: >-
      Book a meeting room or other space by the hour (House of Pages). Block A. A staged booking: date,
      start time, length, room type, attendees, add-ons. The guest picks a room type, never a specific
      room; availability is checked on date, start and length together.
    inputs:
      - field: start time
        rule: >-
          Starts every 15 minutes where the venue sets it, between the venue's hours; each shows how many
          rooms of the type are left. Changing date, start or length re-checks every room; a busy room type
          says "free from 11:15".
        source: MoM 29 Sep W9; DI-1011; screens/P01-guest-web-storefront.yaml#WEB-048 notes
      - field: how long
        rule: 1 hour, 2 hours, half day (4 h), full day (8 h), each priced on its own with the saving shown (Save 10%, Save 15%).
        source: REV3-13; screens/P01-guest-web-storefront.yaml#WEB-048 (selectField How long)
      - field: attendees
        rule: A number; room types smaller than the party are not offered.
        source: screens/P01-guest-web-storefront.yaml#WEB-048 (numberField Attendees)
    outputs:
      - element: cleaning buffer
        rule: >-
          Not shown as a separate slot; it shapes availability. Fixed buffer after each booking (e.g. 15
          minutes) or N cleanings a day placed by the system.
        source: MoM 29 Sep W10; DI-1012
      - element: basket line
        rule: '"Boardroom · Tue 6 Oct 10:00-12:00 · 2 hours · AED 600" with add-ons under it.'
        source: DI-1053
    edgeCases:
      - case: The time fills while the guest is choosing
        expected: '"10:00 has just been taken" with the next free start offered.'
        source: screens/P01-guest-web-storefront.yaml#WEB-048 notes (409 windowUnavailable)
    consistency:
      - with: GST-075
        note: Same staged order and the same "free from" wording on the app.
    sampleData:
      venue: House of Pages (library and rooms), Sharjah
      roomTypes: ["Focus pod · 1-2 people", "Majlis room · up to 8", "Boardroom · up to 12", "Auditorium · up to 80"]
      lengths: ["1 hour AED 300", "2 hours AED 540 (Save 10%)", "Half day AED 1,020 (Save 15%)", "Full day"]
      addOns: ["Coffee break AED 35 pp", "Working lunch AED 85 pp", "AV technician AED 250"]
    corrections:
      - what: No wireframe frame yet (status notStarted), though the prototype covers it.
        why: Needs a frame before build.
        source: screens/P01-guest-web-storefront.yaml#WEB-048 wireframe

  WEB-049:
    summary: >-
      Buy intercity coach travel (Emirates Link): a one-way trip, a multi-trip or unlimited pass, or a
      saved favourite route. Block A. The 30 September feedback changed the order: a route opens with its
      stations filled in, departures list at once without a search, and passengers appear only after a
      departure is chosen. The proposed Popular routes card view (route cards with a from-fare and Book)
      is the first transport screen.
    inputs:
      - field: Popular routes
        rule: >-
          Route cards styled like the dated ticket cards, each with its from-fare, image or badge and Book.
          Book, then the date, then that route's departures, then passengers.
        source: DI-1111; CLIENT-RESPONSE-30SEP 6; DI-1119
      - field: From and To
        rule: >-
          Prefilled with the route's first and last stops when entered from a route (e.g. E201 Abu Dhabi
          Central Bus Station to Al Ain Central Bus Station); still changeable, with a swap button that also
          picks the paired route the other way.
        source: DI-1109; CLIENT-RESPONSE-30SEP 5
      - field: time period
        rule: >-
          Morning, Afternoon, Evening, Night chips with their departure counts acting as filters; tapping the
          selected chip again shows all departures. Departures load on open and on every change; no Search
          Trips needed.
        source: DI-1109
      - field: passengers
        rule: >-
          Only after a departure is chosen. Adult; child 5-11 and student at half fare; person of
          determination free with one companion at the adult fare; proof checked at boarding.
        source: DI-1110; screens/P01-guest-web-storefront.yaml#WEB-049 (Passengers notes)
      - field: travel date
        rule: Timetables are released 30 days ahead; later dates are disabled with that reason.
        source: screens/P01-guest-web-storefront.yaml#WEB-049 (Travel date notes)
    outputs:
      - element: departure card
        rule: Departs and arrives (24-hour), duration, seats left, fare from; a full departure greyed, not hidden.
        source: REV3-21; DI-1061
      - element: price card and route
        rule: >-
          Line and direction (E101-Out), departs, arrives, seats available, fare per passenger type and
          total; the stop list with "Show full route (n stops)" and a street map that needs the internet
          (hidden offline, the stop list and schematic line remain).
        source: screens/P01-guest-web-storefront.yaml#WEB-049 contextPanel
      - element: multi-trip cards
        rule: 5-trip, 10-trip, weekly and monthly unlimited for the station pair, each with the saving against single fares.
        source: REV3-21; AUDIT-29SEP (Transport)
      - element: change policy line
        rule: '"Change your trip free up to two hours before departure" (proposed default, client to correct).'
        source: screens/P01-guest-web-storefront.yaml#WEB-049 notes
    actions:
      - action: Next available trip
        result: Selects the first departure with room for the party.
        source: contracts/satellite/transport.yaml#getNextTransportDeparture
      - action: Choose seats
        result: For a departure with a seat map, step 2 of 3 opens the seat map (WEB-007) on that departure.
        source: screens/P01-guest-web-storefront.yaml#WEB-049 transitions
      - action: Save route
        result: Adds to Favourites (signed-in only); Book this route prefills the one-way tab.
        source: REV3-21
    edgeCases:
      - case: No departure in the chosen period
        expected: Names the period and offers Next available trip, another period or date.
        source: screens/P01-guest-web-storefront.yaml#WEB-049 states.emptyNoResults
    consistency:
      - with: GST-076
        note: Same route cards first, same prefilled stations and passengers-after-departure order.
      - with: GST-077
        note: The app splits route and passengers onto their own screen; the order is the same.
      - with: GST-078
        note: Multi-trip passes, same cards.
      - with: GST-079
        note: Favourites, same Book this route.
    sampleData:
      routes:
        - {route: "Dubai to Abu Dhabi · E101", from: "AED 25"}
        - {route: "Sharjah to Dubai", from: "AED 10"}
        - {route: "Abu Dhabi to Al Ain · E201", from: "AED 28"}
        - {route: "Dubai to Fujairah · E700", from: "AED 30"}
      departure: "E201-Out · 07:30 → 09:10 · 1 h 40 m · 18 seats left"
      passengers: Adult × 2, Child × 1 (half fare)
    corrections:
      - what: The layout keeps Passengers in the top filter row and a primary "Search Trips" button.
        why: Since 30 September passengers come after a departure is chosen and departures list without a search.
        source: screens/P01-guest-web-storefront.yaml#WEB-049 layout; DI-1109; DI-1110
    decisions:
    - question: Are each popular route's from-fare, featured order and image set per route in the back office?
      decision: 'Drawn default accepted: Routes carry a featured order and an image; the from-fare is the lowest fare.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-123 | CHG-NOTE-007
      questionSource: DI-1119
    - question: Who approves the street-map tile provider?
      decision: 'Drawn default accepted: Draw the map; hide it offline.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-124 | CHG-NOTE-007
      questionSource: screens/P01-guest-web-storefront.yaml#WEB-049 openQuestions

  WEB-050:
    summary: >-
      Plan a visit on the website: six short questions, a day-by-day plan to edit, and Book this plan.
      Block A. Opened from "Plan your visit" in the header, full screen. Since 30 September the planner
      is per venue: in a multi-park tenant each day is at one park and uses only that park's rides,
      dining and shops; a preference a park cannot meet is said, never filled from another park.
    inputs:
      - field: who
        rule: Adults 1-8 (12+), children 0-8 (3-11).
        source: screens/P01-guest-web-storefront.yaml#WEB-050 (Adults and children)
      - field: heights
        rule: Per child, as height bands; skipped when there are no children. Rides above a child's band are left out.
        source: screens/P01-guest-web-storefront.yaml#WEB-050 progress notes
      - field: days and park per day
        rule: >-
          Up to three days. "Which park each day?" only in a multi-venue tenant, one choice per day,
          defaulting to the venue picked in the header.
        source: DI-1112
      - field: pace
        rule: Packed, Balanced or Relaxed.
        source: DI-1098
      - field: interests and shops
        rule: The venue's interest tags; "Any shops you'd like to visit?" appears when Shopping is chosen, from the chosen parks' shops and kiosks.
        source: DI-1100; screens/P01-guest-web-storefront.yaml#WEB-050 (multiSelect shops)
      - field: lunch
        rule: >-
          Cuisines of the chosen parks' restaurants, cafes and food kiosks only; in a multi-park plan each
          names its parks ("Indian · Summit Peaks only"). A preference no chosen park offers is marked "Not
          at the parks you chose" before Make my plan.
        source: DI-1113; screens/P01-guest-web-storefront.yaml#WEB-050 states.preferenceNotAtVenue
    outputs:
      - element: plan
        rule: >-
          Day tabs naming their park; arrival, timed rides and shows, lunch and shop stops in time order with
          walking time between; Fast Track per guest with the queuing time saved; the estimated total for the
          group, labelled an estimate.
        source: DI-1098; DI-1112; screens/P01-guest-web-storefront.yaml#WEB-050 review
      - element: Not at this park banner
        rule: '"No Indian restaurant at Summit Peaks. Indian food is at Aqua Park (day 2)." Per day, hidden when every preference is met.'
        source: DI-1113
    actions:
      - action: Swap / Add something / Remove / Undo
        result: Swap candidates suit everyone in the group and come from that day's park only; each change is a new version so Undo goes back one.
        source: screens/P01-guest-web-storefront.yaml#WEB-050 review
      - action: Book this plan
        result: Turns the plan and chosen add-ons into basket lines and opens the basket (WEB-010); tickets, Fast Track and meal combos in one checkout.
        source: contracts/satellite/venue-map.yaml#bookVisitPlan; STATUS-29SEP (Visit planner on web)
    edgeCases:
      - case: Nothing suits the whole group on a day
        expected: Says which answer ruled everything out (e.g. "No rides for under 1.10 m at Summit Peaks on Fri") and offers to change it.
        source: screens/P01-guest-web-storefront.yaml#WEB-050 states.emptyNoResults
    consistency:
      - with: GST-053
        note: Same plan and editing rules; the app adds the AI planner chat (GST-054), web is rules-only.
      - with: GST-059
        note: The booked plan is followed on the day in the app.
    sampleData:
      party: 2 adults, 2 children (1.05 m and 1.30 m)
      days: ["Fri 2 Oct · Summit Peaks", "Sat 3 Oct · Aqua Park"]
      pace: Balanced
      lunch: "Emirati · both parks; Indian · Aqua Park only"
      plan: ["09:30 Arrive Main Gate", "09:45 Falcon Coaster (Fast Track)", "12:30 Lunch · Al Bait Kitchen", "14:00 Toy Box shop"]
      estimate: Estimated AED 1,840 for the group
    corrections:
      - what: The Visit Planner prototype is single-park (no park-per-day step, no shops, no preferenceNotAtVenue).
        why: The 30 September requirements are specified but not drawn; the design must add them.
        source: screens/P01-guest-web-storefront.yaml#WEB-050 wireframe.prototype.differences
      - what: The 29 September MoM names pace as packed or relaxed; the 30 September MoM as packed, balanced or relaxed.
        why: Three options is the later and the built set; keep three.
        source: MoM 29 Sep 2 (Plan); DI-1098
  GST-002:
    summary: >-
      The Explore tab: search the venue, browse its categories and preview items with their own short
      clips playing muted in place. Block A. The app's structure deliberately differs from the web
      (30 September): Explore is a browse-and-discover tab, not a ticket list; buying starts from the
      persistent Buy tickets button or an item's product card.
    inputs:
      - field: search
        rule: >-
          At the top of Explore; results replace the tiles in place (GST-063 is this state). At least 2
          characters; recent searches below the box when empty.
        source: screens/P02-guest-mobile-app.yaml#GST-002 notes (MOB-1); contracts/spine/catalogue.yaml#searchCatalogue
      - field: category
        rule: >-
          The venue's types as tiles (Rides, Shows, Dining, Shops, Experiences), then the items of a type;
          rows or grid per the venue's card layout. Carousel, video poster and split are the app's card
          styles.
        source: DI-1089; MoM 29 Sep 2 (Home / Discover types); REV3-16
    outputs:
      - element: item card
        rule: >-
          The item's own 6 to 12 s clip plays muted in place when visible (one at a time while scrolling);
          the primary image otherwise. Wait time on rides, opening state on dining and shops ("Open until
          22:00").
        source: DI-921; DI-1080; contracts/satellite/queue.yaml#getWaitTimes
    actions:
      - action: Open an item
        result: Item Detail (GST-004), whose product card is how the guest buys.
        source: screens/P02-guest-mobile-app.yaml#GST-002 transitions
    edgeCases:
      - case: Data saver or slow connection
        expected: Clips do not autoplay; posters stay; nothing shows a loader.
        source: DI-1101 (no loader in front of video)
    consistency:
      - with: WEB-002
        note: Same products and Help me choose results; different structure (Explore by type on the app, a booking listing on the web).
      - with: GST-063
        note: One implementation; GST-063 is the results state.
      - with: GST-001
        note: The tab bar arrangement is the venue's choice (home, explore, map, buy tickets in different orders); Explore keeps its place in the venue's chosen set.
    sampleData:
      types: [Rides, Shows, Dining, Shops, Experiences]
      cards:
        - {name: Summit Coaster, type: Ride, wait: "35 min", clip: "8 s, muted"}
        - {name: Night of Nine, type: Show, when: "Tonight 20:00"}
        - {name: The Crater Grill, type: Dining, state: "Open until 22:00"}
        - {name: Summit Store, type: Shop}
    corrections:
      - what: Raw filter fields "Venue id", "Kind", "Is sellable" and an "Every product" table.
        why: Generated parameters; the tab is scoped to the venue the guest picked.
        source: screens/P02-guest-mobile-app.yaml#GST-002 layout
        status: fixed
        by: CHG-GST-003
      - what: No wireframe frame (status notStarted) although the v4 prototype draws Explore.
        why: Needs a frame from the v4 build.
        source: screens/P02-guest-mobile-app.yaml#GST-002 wireframe

  GST-003:
    summary: >-
      Buy Tickets: every bookable product and booking flow of the venue, opened from the persistent Buy
      tickets button on every screen (raised centre button, floating or flat per venue). Block A. Every
      web flow stays bookable here (cabanas, surf, stadium and theatre seats, meeting rooms, transport),
      each with its own step order.
    inputs:
      - field: Help me choose
        rule: >-
          A banner or button; the answers filter this list (Show everything clears); never a consent step.
          Questions per venue, one to four, three answers each.
        source: MoM 29 Sep W4; contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice
    outputs:
      - element: product list
        rule: >-
          Grouped by the venue's categories, each card with its primary image or clip, tags and from-price;
          info-only products show their label and Call sales / Email sales instead of Book. Transport shows
          Popular routes first.
        source: DI-1084; MoM 29 Sep W3; DI-1111
    actions:
      - action: Book
        result: >-
          Dated product → GST-007 (date, time, tickets); undated or product-first (workshop) → GST-008;
          seated single-performance fixture → GST-049; spot on a venue map → GST-074; space by the hour →
          GST-075; meal combo with admission → GST-056. The booking steps hide the Buy tickets button.
        source: screens/P02-guest-mobile-app.yaml#GST-003 transitions; screens/P02-guest-mobile-app.yaml#GST-003 notes (MOB-2)
    edgeCases:
      - case: Help me choose leaves nothing
        expected: Says which answers ruled everything out, with Show everything.
        source: screens/P02-guest-mobile-app.yaml#GST-003 states.emptyNoResults
    consistency:
      - with: WEB-002
        note: Same product set and the same server-side Help me choose filter.
      - with: GST-001
        note: The Buy tickets button sits in the venue's tab bar style (raised, floating, flat).
    sampleData:
      groups:
        - {group: Park admission, items: ["Dated day pass · from AED 245", "Multi-park combo · from AED 475", "Group and school · from AED 125 pp"]}
        - {group: Water park, items: ["Surf sessions · from AED 295", "Cabana and locker rentals · from AED 650"]}
        - {group: Transport, items: ["Popular routes", "Dubai to Abu Dhabi · from AED 25"]}
    corrections:
      - what: Raw filters (Venue id, Kind, Is sellable) and tables "Every product", "Every performance", "Every money".
        why: Generated parameters and response tables; not guest content.
        source: screens/P02-guest-mobile-app.yaml#GST-003 layout
        status: fixed
        by: CHG-GST-003
      - what: A transition to BO-005 (a supervisor sees the queue building) from flow F21.
        why: A guest app never navigates to the back office; the notes already say cross-platform navigation was removed, yet the edge remains.
        source: screens/P02-guest-mobile-app.yaml#GST-003 navigation; screens/P02-guest-mobile-app.yaml#GST-003 notes

  GST-004:
    summary: >-
      One Item Detail for a ride, show, restaurant or shop: what it is, where it is on the map, and the
      product to buy for it. Block A. Two rules from the client: the ride video plays directly with no
      loader in front of it (30 September), and the product card proposes the relevant purchase, e.g. a
      restaurant's "Buy meal combo" that brings the admission ticket with it (checkout in about three
      steps).
    outputs:
      - element: video
        rule: >-
          The info button reveals the details and plays the clip in place, like the header video; poster
          frame while buffering, never a spinner, overlay or loading screen; a clip that cannot play leaves
          the poster.
        source: DI-1101; MoM 30 Sep 4.8; TRACKER 30-September Tracker row 13 (S9)
      - element: where it is
        rule: The item's pin on the 2D or 3D venue map (the venue's setting); tap opens the map with directions.
        source: DI-1082; screens/P02-guest-mobile-app.yaml#GST-004 (seatMap Where it is)
      - element: the product for it
        rule: >-
          From the point's featured offer: a ride offers Fast Track or the day pass; a restaurant "Buy meal
          combo" (meal plus admission in one bundle); a show its tickets. The card states that admission is
          included where it is.
        source: DI-1019; screens/P02-guest-mobile-app.yaml#GST-004 (cardList The product for it)
      - element: eligibility
        rule: Height and age limits as tags ("Min 1.20 m"); wait time on rides.
        source: REV3 23SEP-3; contracts/satellite/queue.yaml#getWaitTimes
    actions:
      - action: Buy meal combo
        result: Opens GST-056 with the combo; admission is a component of the bundle, so no separate ticket step.
        source: DI-1082; screens/P02-guest-mobile-app.yaml#GST-004 transitions
      - action: Book
        result: Routes by product type as on Buy Tickets.
        source: screens/P02-guest-mobile-app.yaml#GST-004 transitions
    edgeCases:
      - case: The guest already holds an admission for that day
        expected: The meal combo still includes admission; say "Includes park admission" so the guest can choose a meal-only product where the venue offers one.
        source: designer default
      - case: Product retired (shared link)
        expected: Shows the successor where one exists, else the catalogue.
        source: screens/P02-guest-mobile-app.yaml#GST-004 entryState.coldEntry
    consistency:
      - with: WEB-004
        note: Same content and the same no-loader video; the web page has no featured-offer card.
      - with: GST-006
        note: One implementation; GST-006 is the event and exhibition reading.
    sampleData:
      item: The Crater Grill (restaurant, Summit Peaks)
      offer: "Buy meal combo · Lunch + park ticket · AED 295"
      ride: "Summit Coaster · Min 1.20 m · 35 min wait · clip 10 s"
    corrections:
      - what: From/To date pickers and an "Every performance" table on the item page.
        why: Generated listPerformances parameters; the item page has no date range.
        source: screens/P02-guest-mobile-app.yaml#GST-004 layout
        status: fixed
        by: CHG-GST-003

  GST-005:
    summary: >-
      What's On: the venue's shows, events and exhibitions by day. Block A. Its prototype frame is the
      old Mobile v2 "All screens" board; in the v4 app it is the dated reading of Explore (Shows), so
      design it as a day strip over the Explore cards rather than a separate table.
    inputs:
      - field: day
        rule: Today, Tomorrow, then the next 7 days as a strip with a calendar for later; default Today.
        source: DI-920
    outputs:
      - element: event row
        rule: Time, name, location in the park, poster or clip, from-price, "11 left" when low; past performances of today drop off.
        source: DI-026
    actions:
      - action: Open
        result: Item Detail (GST-006); Book goes to the date and time step with the day preselected.
        source: screens/P02-guest-mobile-app.yaml#GST-006 transitions
    consistency:
      - with: GST-002
        note: Same cards and video behaviour.
    sampleData:
      day: Fri 2 Oct
      rows: ["16:00 Sunset Parade · Main Street · free", "20:00 Night of Nine · Canyon Stage · from AED 95", "20:30 Jazz on the Terrace · Terrace Café"]
    corrections:
      - what: The frame reference is the 28 September Mobile v2 board, not the v4 app.
        why: The v4 app has no What's On screen of its own; the frame should be redrawn in the v4 structure.
        source: screens/P02-guest-mobile-app.yaml#GST-005 wireframe

  GST-006:
    summary: >-
      Item Detail for an event or exhibition (one implementation with GST-004). Block A. Adds the date
      handling an event needs: the next dates as a strip (banner dates off by default), and Book follows
      the event's published booking flow.
    outputs:
      - element: event header
        rule: Poster or clip (no loader), name, venue location, duration, age guidance, language and format for cinema.
        source: DI-1101; REV3-17
      - element: next dates
        rule: Only when the venue turns on dates in the event banner; otherwise the date picker is on the booking step.
        source: REV3 23SEP-19
    actions:
      - action: Book
        result: GST-007 (date, time, tickets), or the seat map for a seated event with one performance.
        source: screens/P02-guest-mobile-app.yaml#GST-006 transitions; REV3-4
    edgeCases:
      - case: A link to a performance that has happened
        expected: Offers the next performance of the same event.
        source: screens/P02-guest-mobile-app.yaml#GST-006 entryState.coldEntry
    consistency:
      - with: GST-004
        note: One implementation.
    sampleData:
      event: "Night of Nine · Canyon Stage · 75 min · Ages 6+"
      priceBands: [Stalls AED 245, Circle AED 165, Balcony AED 95]

  GST-007:
    summary: >-
      Select date and time in the app's booking. Block A. The booking flow is functionally identical to
      the web (30 September): date, then time (hidden until a date), then tickets; the app runs the same
      booking engine with each flow's own step order and can switch to one decision per screen. Choosing
      a session commits nothing.
    inputs:
      - field: date
        rule: >-
          Strip of the next 7 days with a calendar icon, or the grid or list style the venue picked for the
          app's date picker; days with nothing on sale online disabled with the reason.
        source: DI-920; sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html (Booking group, Date picker Grid/Strip/List)
      - field: time
        rule: >-
          Hidden until a date; compact tiles paged with Earlier and Later, day-part chips with counts;
          sold-out greyed. Surf sessions show their levels only after a slot is chosen.
        source: REV3-1; REV3-2; MoM 29 Sep W5
      - field: party ages and heights
        rule: Asked once on leaving selection, only for products with a rule; never asked twice (height bands on a water-park pass are the check).
        source: DI-1037; DI-1000
    outputs:
      - element: step indicator
        rule: >-
          In the venue's style (Bars, Dots, Counter, Step names, Line in the v4 build), same as the web;
          the Continue button as a bottom bar, floating pill or full-width block per the venue.
        source: DI-1093; sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html (Booking group)
      - element: basket
        rule: A bottom bar with the running total and a cart button with the count in the booking header that opens the cart.
        source: AUDIT-29SEP (Booking engine, add-on quantities); screens/P02-guest-mobile-app.yaml#GST-008 notes (REV3-10)
    actions:
      - action: Choose a session
        result: Reveals its tickets (GST-008); nothing goes to the basket until a quantity is set; consent questions pop up once unless already asked on the page.
        source: DI-1107; REV3-26
      - action: Save and finish later
        result: Keeps the in-progress order on the device; reopening the app offers to resume (holds may have lapsed, prices re-read).
        source: DI-1094; MoM 30 Sep 4.6
    edgeCases:
      - case: The guest returns to a saved booking after its holds lapsed
        expected: The selection is kept, availability and prices are re-read, and anything gone is flagged before the basket.
        source: DI-1094; contracts/spine/orders.yaml#/components/schemas/CartLine (isAvailable)
      - case: Kids Club (several branches)
        expected: Starts with "Which location?" (Al Barsha, Mirdif, Yas Island, Sharjah) and keeps a Change bar on later steps.
        source: AUDIT-29SEP (Location switcher); REV3-18
    consistency:
      - with: WEB-006
        note: Same order, chips and consent behaviour; one engine.
      - with: GST-049
        note: Seated events may show this step and the seat map as one.
    sampleData:
      flow: Summit Peaks · Timed entry
      dates: Fri 2 Oct to Thu 8 Oct
      windows: ["09:30-12:00 Morning", "12:00-15:00 Midday", "15:00-18:00 Afternoon"]
    corrections:
      - what: The v4 build's Times per page default is 12; the contract default is 24.
        why: Two defaults for one setting; the app reads the same BookingFlowSettings.
        source: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html (Booking rules, perfPage default 12 per page); contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings (timesPerPage default 24)
      - what: The app's step-indicator styles (Bars, Dots, Counter, Step names, Line), date picker style (Grid, Strip, List) and Continue button style (Bottom bar, Floating pill, Full-width block) are settings in the v4 build; the contract's stepIndicator enum is bar, numbered, dots, segmented, breadcrumb, pills, ticks, none and there is no date picker or Continue button setting.
        why: The 30 September meeting agreed step-indicator styles are configurable the same as on the web (bars, dots, counters, step names); the enum and labels need aligning and the two missing settings adding or dropping.
        source: DI-1093; contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings (stepIndicator)
      - what: A primary "Check booking eligibility" button and a From/To range with an "Every performance" table.
        why: Eligibility is the once-asked party panel; the range is a generated parameter.
        source: screens/P02-guest-mobile-app.yaml#GST-007 layout
        status: fixed
        by: CHG-GST-003

  GST-008:
    summary: >-
      Tickets (and, where the flow puts them here, add-ons) for the chosen date and time. Block A.
      Rewritten 29 September from a misdefined transfer screen. The counters belong to the chosen ticket
      and take its prices (one basket line per ticket and guest type), and group products use a typed
      headcount box with a +10 step on the app.
    inputs:
      - field: guest counters
        rule: >-
          Same as the web: the chosen ticket's variants with its prices, (i) descriptions, purchase limits
          on the plus button; infant free where the ticket says so. Season and membership packages show a
          quantity stepper once selected.
        source: DI-1106; DI-980; REV3 23SEP-6
      - field: group headcount
        rule: >-
          After a group ticket card, "How many people" is a number box: type it (e.g. 45) or use minus,
          plus and +10; supervisors a separate free row ("One free for every 10 guests"). Water park groups
          pick a session first, then swimmers and supervisors. The hint before a card is chosen reads
          "Choose a group ticket above, then enter how many people are coming."
        source: DI-1105; CLIENT-RESPONSE-30SEP 1; sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html (inc10, Add ten); sources/designs/guest-rev3-30-september/TICVAI Guest Booking v2.dc.html (waitText)
      - field: add-on quantities
        rule: When quantities on add-ons are on, a ticked extra shows a minus and plus stepper and its price multiplies.
        source: AUDIT-29SEP (Booking engine); DI-1070
    outputs:
      - element: basket line
        rule: '"2 park ticket · Adult × 3 = AED 1,425"; never a ticket line plus a separate guest line.'
        source: DI-1106
      - element: session title
        rule: '"Tickets for Intermediate surf · 19:30" with Surfer, Junior surfer 10-15 and Spectator AED 35.'
        source: DI-1107
    actions:
      - action: Continue
        result: >-
          To Add-ons when the flow has an Extras step, else to sign-in or the guest code (GST-042) when the
          guest is anonymous and signInAt is afterAddOns, else the basket (GST-041). The basket is kept.
        source: REV3-3; screens/P02-guest-mobile-app.yaml#GST-008 transitions
      - action: Send request (group)
        result: The group request (GST-072) with the ticket and headcount carried; no payment now.
        source: screens/P02-guest-mobile-app.yaml#GST-008 transitions; contracts/spine/orders.yaml#requestGroupBooking
    edgeCases:
      - case: Swim answer None of us
        expected: The tickets switch to the splash and river pass at lower prices; Some of us adds a Swim vests needed counter.
        source: DI-1108
      - case: A headcount typed below the group card's minimum
        expected: Inline "Corporate groups start at 15 guests"; Send request off.
        source: DI-1116
    consistency:
      - with: WEB-005
        note: Same pricing and group rules; only the +10 button is app-only.
      - with: GST-072
        note: The group request screen receives this headcount; do not ask it again.
    sampleData:
      tickets: ["1 park ticket AED 325", "2 park ticket AED 475 · Popular", "3 park ticket"]
      counters: Adult × 3, Child × 1 (AED 360), Infant × 1 (free)
      group: "School group · Guests × 45 · Supervisors × 4 Free · AED 6,525"
    corrections:
      - what: The add-ons list sits on this step ("All add-ons on this one step, as the prototype does"), but the v4 build puts add-ons on step 3 and the client asked for add-ons only on the Add-ons / Extras step.
        why: Contradicts DI-979 and the v4 frame; add-ons belong on their own step unless the flow has no Extras step.
        source: screens/P02-guest-mobile-app.yaml#GST-008 layout (Add-ons notes); screens/P02-guest-mobile-app.yaml#GST-008 wireframe.prototype.view; DI-979
      - what: The Help me choose overlay says one or two questions; the 29 September W4 decision allows one to four.
        why: GuidedChoice.questions is one to four; the overlay text is stale.
        source: screens/P02-guest-mobile-app.yaml#GST-008 overlays.helpMeChoose; contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice
      - what: Supervisors and a water-park group's session are not in the contract.
        why: Drawn in the 30 September build; requestGroupBooking has packageProductId and expectedSize only.
        source: screens/P02-guest-mobile-app.yaml#GST-008 notes; DI-1114; DI-1117
    decisions:
    - question: Free supervisors per N guests, per group ticket?
      decision: 'Drawn default accepted: Up to 1 per 10 guests, a separate free row.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-108 | CHG-NOTE-007
      questionSource: DI-1114
  GST-041:
    summary: >-
      The app's basket and the start of checkout. Block A. On mobile the basket is a bottom bar with the
      running total and a header cart button with a count during booking; this screen is the full review.
      Several paths land here directly: Book this plan, Buy meal combo, cabana and room bookings,
      transport passes. Checkout completes in 4 steps with Apple Pay or card.
    inputs:
      - field: promo code
        rule: Same field and the same two refusal messages as the web basket.
        source: contracts/spine/orders.yaml#applyCartPromoCode; WEB-010
      - field: ticket holder names
        rule: >-
          Only where a product needs them (season and family passes: first and last name per pass holder;
          resident tickets: Emirates ID number); never for plain day passes. Prefilled for the signed-in
          guest's linked family.
        source: DI-429; DI-443; DI-434
    outputs:
      - element: lines
        rule: Same wording as the web; the visit date on each line; a cabana or room line counts down from its own hold.
        source: DI-1029; screens/P02-guest-mobile-app.yaml#GST-041 notes (REV3-15)
    actions:
      - action: Checkout
        result: >-
          Anonymous guest → sign in or guest code (GST-042) when signInAt is atPayment (with afterAddOns it
          was asked already); then payment (GST-009) with no details form. 4 steps in all from the basket
          to the ticket.
        source: REV3-3; MoM 29 Sep W1; DI-1096
      - action: Continue on another device
        result: A basket started on the web can be picked up in the app after sign-in (claim); the copy says which device it came from.
        source: contracts/spine/orders.yaml#claimCart
      - action: Save and finish later
        result: Keeps the order on the device; the basket shows "Saved, finish by" with the hold time left.
        source: DI-1094
    edgeCases:
      - case: Consent question unanswered or an answer blocks a line
        expected: Checkout returns the guest to the questions; the blocked line is named.
        source: screens/P02-guest-mobile-app.yaml#GST-041 notes (REV3-26)
    consistency:
      - with: WEB-010
        note: Same lines, promo messages and countdown; the app has no sidebar or floating-icon options (bottom bar only).
      - with: GST-009
        note: Next step.
    sampleData:
      lines: ["2 park ticket · Adult × 3 · Fri 2 Oct · AED 1,425", "Meal combo · Lunch + park ticket × 2 · AED 590"]
      bottomBar: "2 items · AED 2,015 · Held for 13:20"
    corrections:
      - what: A raw "Every product variant" table and forms for checkoutCart and updateCartLine.
        why: Plumbing; the basket shows lines with steppers.
        source: screens/P02-guest-mobile-app.yaml#GST-041 layout

  GST-009:
    summary: >-
      Review and pay in the app. Block A. Same W1 rule as the web: after the six-digit code (or signed
      in) only the T&Cs tick and the unticked marketing opt-in remain. Apple Pay first on iOS, Google
      Pay on Android, then card; the ticket goes straight to Apple or Google Wallet afterwards. Also the
      payment step of in-app food orders.
    inputs:
      - field: signed in as
        rule: Shows who the guest is signed in as ("Paying as fatima.h@example.ae") with Not you?; the T&C tick is required and payment waits for it.
        source: AUDIT-29SEP (Booking engine, signed in); MoM 29 Sep W1
      - field: payment method
        rule: Apple Pay or Google Pay as the device offers, card, and wallet balance where the guest has one (split with card allowed).
        source: DI-1096; DI-079; DI-525
    outputs:
      - element: currency
        rule: Charged in the selected currency where the venue charges it, with the AED amount and the locked rate
          beneath; a shown-only currency shows "approx." and the charged AED amount before paying (decided 2 October 2026).
        source: DI-211; contracts/spine/orders.yaml#checkoutCart; screens/P02-guest-mobile-app.yaml#GST-009 notes
    actions:
      - action: Pay
        result: Paid → Booking Confirmation (GST-010); declined → the reason and another method, holds released; unknown → "We're checking with your bank", never a second charge.
        source: F01 step 7; screens/P01-guest-web-storefront.yaml#WEB-012 notes
    edgeCases:
      - case: Offline
        expected: Payment unavailable with the reason; the basket is kept on the device.
        source: screens/P02-guest-mobile-app.yaml#GST-009 states.offline; DI-1094
    consistency:
      - with: WEB-012
        note: Same rules and wording.
      - with: GST-041
        note: Previous step.
    sampleData:
      payingAs: fatima.h@example.ae
      total: AED 2,025 incl. VAT AED 96.43
      methods: [Apple Pay, Visa •••• 4242, Wallet AED 420]
    corrections:
      - what: The screen has no transition to Booking Confirmation (GST-010); its only exits are Home and Explore, and its only entry is Home.
        why: The checkout path GST-041 → GST-009 → GST-010 is missing from navigation.
        source: screens/P02-guest-mobile-app.yaml#GST-009 navigation
