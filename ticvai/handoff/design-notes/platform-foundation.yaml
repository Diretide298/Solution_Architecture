  PTR-048:
    block: B
    summary: Calculate, approve and settle commission; acting on a settlement batch requires a second factor.
    actions:
    - action: Act on partner settlement batch
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends actOnPartnerSettlementBatch with its single-use
        stepUpToken. Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the
        policy's lockout minutes and the screen says when it lifts. Why the control exists: Approves paying commission
        to a partner.
      source: >-
