  ADM-003:
    block: A
    summary: >-
      For a TICVAI platform operator: the health of every cell (one tenant in one jurisdiction) — reachability,
      schema lag, replication lag, backups and restore drills, capacity against headroom — with the jobs running
      in each, and the tier and decommission controls. The rule: health is per cell, so a tenant in two regions
      appears twice.
    inputs:
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setWalletAllocationPolicy: set per
        region (money, tax, ledger); venues inherit and cannot override. Nearest ancestor wins; a workstation is
        assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/cross-region.yaml#setWalletAllocationPolicy
    outputs:
    - element: Cell list
      rule: >-
        Tenant name, region and country, tier, status, reachable or last contact, schema behind (yes/no), replication
        lag in seconds, last backup and last restore drill (older than 30 days amber), constrained dimension and
        forecast breach date. Times in the operator's time zone with the zone named.
      source: >-
        contracts/satellite/subscription.yaml#getCellHealth; contracts/satellite/subscription.yaml#getCellCapacity;
        ADR-0060
    - element: Jobs
      rule: Provisioning, migration and maintenance jobs with progress percent, message and error, newest first.
      source: contracts/satellite/subscription.yaml#listCellJobs
    actions:
    - action: Decommission cell
      result: >-
        Confirmation names the tenant, region and what stops ("Marina Leisure Group's Oman cell stops serving AquaCove
        Muscat"); requires a reason; Cancel decommission halts it while it runs.
      source: >-
        contracts/satellite/subscription.yaml#decommissionCell; contracts/satellite/subscription.yaml#cancelDecommission
    - action: Change tier
      result: Tier with an optional scheduled time; the change is a job, shown in the jobs list.
      source: contracts/satellite/subscription.yaml#updateCellTier
    edgeCases:
    - case: Can read but not change (holds ORDER_VIEW, PLATFORM_CELL_VIEW, TICKET_LOOKUP only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PLATFORM_CELL_MANAGE
        for Cancel decommission, Decommission cell, Save cell tier; REGION_CONFIGURE for setWalletAllocationPolicy.
        Where the person would reasonably expect the action, it shows disabled with the permission named. The server
        refuses with 403 forbidden regardless.
      source: contracts/satellite/subscription.yaml#cancelDecommission
    - case: cancelDecommission answers 409
      expected: 'Show it as something the person can act on, not a failure: Not in a state that permits this'
      source: contracts/satellite/subscription.yaml#cancelDecommission
    - case: decommissionCell answers 409
      expected: 'Show it as something the person can act on, not a failure: Not in a state that permits this'
      source: contracts/satellite/subscription.yaml#decommissionCell
    - case: propagateCrossRegionEntitlement answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Right already propagated. Idempotent — returns
        the existing right.
      source: contracts/spine/cross-region.yaml#propagateCrossRegionEntitlement
    consistency:
    - with: ADM-002
      note: The Platform Dashboard is the home; this is the cell health drill-down from it.
    - with: ADM-005
      note: The tenant's cells shown there link here.
    sampleData:
      cells:
      - tenant: Marina Leisure Group
        region: UAE
        tier: dedicated
        reachable: true
        schemaBehind: false
        replicationLag: 0.4 s
        lastBackup: 01/10/2026 03:00
        lastRestoreDrill: 14/09/2026
      - tenant: Marina Leisure Group
        region: Oman
        tier: shared
        reachable: false
        lastContact: 01/10/2026 08:51
        schemaBehind: true
    corrections:
    - what: Purpose says "The screen this app sits on. Everything else is entered from here".
      why: ADM-002 is the dashboard and ADM-003 is entered from it; the purpose is cross-tenant cell health.
      source: screens/P09-platform-admin-console.yaml#ADM-003
      status: fixed
      by: CHG-WIR-023
    - what: Propagate cross region entitlement and Reconcile redemptions are buttons with forms.
      why: >-
        Both are service-audience operations between cells (F19); no operator calls them. Show cross-region status
        read-only if wanted.
      source: >-
        contracts/spine/cross-region.yaml#propagateCrossRegionEntitlement; contracts/spine/cross-region.yaml#reconcileRedemptions;
        F19 step 2
      status: fixed
      by: CHG-WIR-021
    - what: >-
        getCrossRegionEntitlement, getWalletAllocation and setWalletAllocationPolicy (tenant permissions TICKET_LOOKUP,
        ORDER_VIEW, REGION_CONFIGURE) on a cell health screen.
      why: >-
        Tenant data and a region money policy do not belong on platform cell health and would need an R098 grant.
      source: R098; contracts/spine/cross-region.yaml#setWalletAllocationPolicy
      status: fixed
      by: CHG-WIR-021
    - what: 'Tables show every schema field, plumbing included: ''Every cell job'' drop id.'
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P09-platform-admin-console.yaml#ADM-003
      status: fixed
      by: CHG-SBO-004
    - what: requiresModule is 'membership' on a TICVAI Console screen.
      why: >-
        requiresModule ties a screen to what a tenant licensed; a platform operator's console does not depend on
        any tenant's modules (and 'membership' is the guest annual-pass module, not TICVAI's subscription). Should
        be core.
      source: screens/_schema.yaml#requiresModule; screens/P09-platform-admin-console.yaml#ADM-003
      status: fixed
      by: CHG-SBO-003
  ADM-005:
    block: A
    summary: >-
      The platform operator's tenant list: find a tenant, see its plan, cells, venues, status and licence position,
      and act on it (create, amend, suspend, reactivate, terminate, license an add-on, provision a cell, configure
      its SSO) without opening a separate page. Actions on the tenant record itself are control-plane acts; configuring
      the tenant's SSO happens inside the tenant and needs a platform-staff grant.
    inputs:
    - field: Create tenant
      rule: >-
        Code (unique), legal name, billing email required; billing address, account manager and plan optional. A
        new tenant has no venues yet.
      source: contracts/satellite/subscription.yaml#createTenant; F16 step 1
    - field: Suspend
      rule: >-
        Mode and reason required; optional effective time and a notice message the tenant's staff will see. Suspended
        tenants may still be amended; terminated tenants may not.
      source: contracts/satellite/subscription.yaml#suspendTenant; R214
    - field: Terminate
      rule: >-
        Reason, retention days and a typed confirmation of the tenant code; the confirmation states the retention
        date and that it cannot be undone after it.
      source: contracts/satellite/subscription.yaml#terminateTenant; ADR-0047
    - field: Open access grant (permissions, reason, expiry)
      rule: >-
        Permissions preselected to exactly what this screen's tenant calls need (USER_MANAGE), never PLATFORM_*
        (those ride on the platform token); reason required and shown to the tenant; expiry at most 8 hours ahead
        (proposed). The tenant must be picked first.
      source: R098; contracts/spine/identity.yaml#openPlatformStaffGrant
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setSsoConfig: tenant-wide only, no
        region or venue override is offered. Nearest ancestor wins; a workstation is assigned a profile, never configured.
      source: ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/identity.yaml#setSsoConfig
    outputs:
    - element: Tenant rows
      rule: >-
        Name and code, plan, status chip (active, suspended with mode, terminating with date), cells, venues, billing
        email, account manager by name.
      source: contracts/satellite/subscription.yaml#listTenants
    - element: Licence position
      rule: >-
        Licensed modules and limits with usage against each (usage/limit, percent), add-ons marked separately from
        the plan.
      source: >-
        contracts/satellite/subscription.yaml#getTenantLicences; contracts/satellite/subscription.yaml#getEntitlementUsage
    actions:
    - action: Terminate tenant
      result: >-
        Requires PLATFORM_TENANT_TERMINATE (distinct from manage) and the step-up; the tenant's staff are notified
        with the retention date.
      source: >-
        contracts/satellite/subscription.yaml#terminateTenant; contracts/spine/identity.yaml#createMfaChallenge
    - action: Open access grant
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends openPlatformStaffGrant with its single-use stepUpToken.
        Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the policy's lockout
        minutes and the screen says when it lifts. Why the control exists: Opens a platform operator's access into
        a tenant's data.
      source: >-
        contracts/spine/identity.yaml#openPlatformStaffGrant; R126; contracts/spine/identity.yaml#createMfaChallenge
    edgeCases:
    - case: Configuring SSO without an open grant into the tenant
      expected: >-
        The SSO card shows grantRequired with Open access grant; tenant-record actions (suspend, add-on) stay available
        because they are control-plane.
      source: R098; contracts/spine/identity.yaml#setSsoConfig
    - case: The platform-staff grant expires while the operator is mid-edit
      expected: >-
        Every tenant action disables at once, the grantRequired state returns with Open access grant, and anything
        typed is kept so it can be sent after a new grant; the countdown in the grant panel warns before expiry.
      source: R098; screens/P09-platform-admin-console.yaml#ADM-412
    - case: Can read but not change (holds PLATFORM_CELL_VIEW, PLATFORM_TENANT_VIEW, USER_MANAGE only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PLATFORM_TENANT_ACCESS
        for Open access grant; PLATFORM_TENANT_MANAGE for Add licence add on, Create tenant, Reactivate tenant;
        PLATFORM_CELL_MANAGE for Provision cell; PLATFORM_TENANT_TERMINATE for Terminate tenant. Where the person
        would reasonably expect the action, it shows disabled with the permission named. The server refuses with
        403 forbidden regardless.
      source: contracts/spine/identity.yaml#openPlatformStaffGrant
    - case: provisionCell answers 409
      expected: 'Show it as something the person can act on, not a failure: A cell already exists for this region'
      source: contracts/satellite/subscription.yaml#provisionCell
    - case: reactivateTenant answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Tenant is terminated, not suspended. Termination
        is not reversible here
      source: contracts/satellite/subscription.yaml#reactivateTenant
    - case: removeLicenceAddOn answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Module is currently enabled by the tenant. Disable
        it there first
      source: contracts/satellite/subscription.yaml#removeLicenceAddOn
    - case: terminateTenant answers 409
      expected: 'Show it as something the person can act on, not a failure: Unsettled ledger balances exist'
      source: contracts/satellite/subscription.yaml#terminateTenant
    consistency:
    - with: ADM-008
      note: Plan and subscription changes live there; the tenant row links to it.
    - with: ADM-003
      note: Cells link to cell health.
    - with: ADM-412
      note: >-
        Same tenant picker, grant panel and grantRequired state on every P09 screen that acts in a tenant (R098).
    sampleData:
      tenants:
      - name: Marina Leisure Group
        code: MLG
        plan: Enterprise
        status: active
        cells: 2
        venues: 3
        billingEmail: finance@marinaleisure.ae
        accountManager: Sara Khalil
      - name: Gulf Fun Parks LLC
        code: GFP
        plan: Growth
        status: suspended (read-only) since 20/09/2026
        cells: 1
        venues: 1
    corrections:
    - what: emptyFirstRun offers Add licence add on as the create action.
      why: With no tenants the action is Create tenant.
      source: screens/P09-platform-admin-console.yaml#ADM-005
      status: fixed
      by: CHG-SBO-011
    - what: requiresModule is 'membership'.
      why: Control-plane screen; core.
      source: screens/P09-platform-admin-console.yaml#ADM-005
      status: fixed
      by: CHG-SBO-003
    - what: formSetSsoConfig asks the person for id.
      why: >-
        Status and timestamps are the server's; an id is a client UUIDv7 generated silently. A form that asks for
        them invites nonsense values. Keep them out of the form.
      source: screens/P09-platform-admin-console.yaml#ADM-005
      status: fixed
      by: CHG-SBO-004
    - what: >-
        Tables show every schema field, plumbing included: 'Every tenant' drop id, planId, accountManagerPrincipalId;
        'Every cell' drop id, clusterId, regionId.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P09-platform-admin-console.yaml#ADM-005
      status: fixed
      by: CHG-SBO-004
    decisions:
    - question: Is opening a grant needed for getSsoConfig/setSsoConfig only, or does TICVAI configure tenant SSO at all (versus
        the tenant's own admin in Venue Management)?
      decision: 'Drawn default accepted: Draw SSO configuration behind the grant on this screen, and the same card on the
        tenant''s identity settings.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-094 | CHG-NOTE-005
      questionSource: R098; contracts/spine/identity.yaml#setSsoConfig
  ADM-008:
    block: A
    summary: >-
      Plans and subscriptions for TICVAI's own commercial offer: the plan catalogue (modules, limits, base price,
      cell tier, AI tokens, branded app), new plan versions, a tenant's subscription with a preview before any change,
      usage and invoices. The rule: upgrades take effect now with proration, downgrades at the next renewal, and
      the preview shows the money before the change is made.
    inputs:
    - field: Change subscription
      rule: >-
        Plan (and version), effective from and prorate; the form always calls the preview first and shows the prorated
        amount and the new renewal date; a downgrade's effective date is fixed to the renewal and the field says
        so.
      source: contracts/satellite/subscription.yaml#previewSubscriptionChange; R214
    - field: Plan
      rule: >-
        Code unique, modules from the module list, limits per metric, base price with currency and billing period.
        Editing a published plan creates a new version; subscribers stay on theirs until changed.
      source: contracts/satellite/subscription.yaml#createPlanVersion
    outputs:
    - element: Invoices
      rule: Number, period, status, subtotal, tax and total with currency, and the plan version used.
      source: contracts/satellite/subscription.yaml#listSubscriptionInvoices
    - element: Money columns (basePrice, currentPrice, subtotal, taxAmount, total)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure. Across
        tenants or regions figures in different currencies are never summed into one total; group by currency, or
        label the converted figure with its rate and time.
      source: ADR-0008; ADR-0011; DI-306
    actions:
    - action: Generate invoice
      result: Period start and end, with a dry run first that shows the lines; issuing is a separate confirm.
      source: contracts/satellite/subscription.yaml#generateInvoice
    edgeCases:
    - case: >-
        Can read but not change (holds PARTNER_MANAGE, PLATFORM_BILLING_VIEW, PLATFORM_CELL_VIEW, PLATFORM_TENANT_VIEW,
        USER_MANAGE only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PLATFORM_TENANT_MANAGE
        for Save subscription; PLATFORM_PLAN_MANAGE for Create plan, Create plan version; PLATFORM_BILLING_MANAGE
        for Generate invoice. Where the person would reasonably expect the action, it shows disabled with the permission
        named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/subscription.yaml#setSubscription
    - case: setSubscription answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Downgrade conflicts with current usage. The response
        names every module and limit that would be violated. Or the subscription is `expired` and cannot be reactivated
        (`subscription-expired`, audit STATE-SUBSCRIPTION); start a new one.
      source: contracts/satellite/subscription.yaml#setSubscription
    - case: setSubscription answers 422
      expected: >-
        Show it as something the person can act on, not a failure: `effectiveFrom` was sent and is not the date
        the change must take effect: today for an upgrade, the next renewal for a downgrade (`effective-date-not-allowed`,
        audit R214 (1)). Or the plan is a custom package private to another tenant (`plan-not-offered`, decided
        29 September).
      source: contracts/satellite/subscription.yaml#setSubscription
    - case: createPlan answers 422
      expected: >-
        Show it as something the person can act on, not a failure: `offeredToTenantId` on a standard package, or
        a tenant that does not exist
      source: contracts/satellite/subscription.yaml#createPlan
    - case: createPlanVersion answers 422
      expected: >-
        Show it as something the person can act on, not a failure: `offeredToTenantId` on a standard package, or
        a tenant that does not exist
      source: contracts/satellite/subscription.yaml#createPlanVersion
    consistency:
    - with: ADM-005
      note: Opened from a tenant row with that tenant selected.
