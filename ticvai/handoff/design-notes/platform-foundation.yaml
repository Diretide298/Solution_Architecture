  BO-367:
    block: B
    summary: The single approval request page from the board; the same page as BO-085.
    actions:
    - action: Decide (Approve / Reject / Return / Request information)
      result: >-
        Four outcomes, not two: reject needs a reason the requester reads; return sends it back to amend; request
        information pauses the SLA clock. Approving records an authorisation and does not perform the action; on
        a multi-level chain the request moves to the next level. Where the rule demands MFA the decision carries
        a stepUpToken from the in-place challenge; where it demands a signature, the signature step comes first.
      source: contracts/spine/approvals.yaml#decideApprovalRequest; F14 step 4
    edgeCases:
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    - case: Can read but not change (holds APPROVAL_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: APPROVAL_DECIDE
        for decideApprovalRequest. Where the person would reasonably expect the action, it shows disabled with the
        permission named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: decideApprovalRequest answers 403
      expected: >-
        Show it as something the person can act on, not a failure: The approver may not decide this request. **Always
        carries `refusedReason`**, one value per cause — the approver is the requester (`approverIsRequester`),
        is not in the resolved chain (`notInApproverChain`), lacks the permission the rule demands (`insufficientPermission`),
        gave no step-up token where the rule requires MFA (`mfaR...
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: decideApprovalRequest answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The request is no longer open for a decision.
        `refusedReason` says which: `alreadyDecided` (approved or rejected), `withdrawn`, `expired` or `cancelled`,
