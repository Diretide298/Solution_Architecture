    - field: Username and password
      rule: Minimum 8; a temporary password from the approval email is changed at first sign-in.
      source: DI-166; contracts/spine/identity.yaml#changeOwnCredential
    outputs:
    - element: Landing
      rule: >-
        The partner home showing what they may sell and what they owe; credit details live on the credit screen.
      source: F10 step 1
    - element: Money columns (available, creditLimit, used)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure. Across
        tenants or regions figures in different currencies are never summed into one total; group by currency, or
        label the converted figure with its rate and time.
      source: ADR-0008; ADR-0011; DI-306
    consistency:
    - with: ADM-001
      note: Same form and second-factor step (F104 step 4).
