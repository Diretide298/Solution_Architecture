        modules:
        - ticketing
        - fnb
        - retail
        - marketing
        basePrice: AED 18,000.00 / month
        cellTier: shared
        includedAiTokens: 2,000,000
      - code: ENTERPRISE
        name: Enterprise
        modules: all
        basePrice: AED 55,000.00 / month
        cellTier: dedicated
        includesBrandedApp: true
      preview:
        from: Growth v3
        to: Enterprise v1
        effective: 01/10/2026
        prorated: AED 23,870.97
        renewsAt: 01/01/2027
    corrections:
    - what: Partner agreements (list, create, update) and the tenant SSO config are on plan management.
      why: >-
        Partner commercial terms are the tenant's B2B business (PARTNER_MANAGE, a tenant permission) and SSO is
        tenant identity; neither belongs to TICVAI's plan catalogue, and both would need an R098 grant here.
      source: R098; contracts/satellite/subscription.yaml#createPartnerAgreement
      status: fixed
      by: CHG-WIR-021
    - what: Purpose reads "Find subscription & plan management for this venue".
      why: Subscriptions are per tenant, not per venue.
      source: screens/P09-platform-admin-console.yaml#ADM-008
      status: fixed
      by: CHG-WIR-023
    - what: requiresModule is 'membership'.
      why: Guest membership module, unrelated to TICVAI's subscription.
      source: screens/P09-platform-admin-console.yaml#ADM-008
      status: fixed
      by: CHG-SBO-003
    - what: >-
        Calls tenant-permission operations with no tenant picker and no platform-staff grant: getSsoConfig (USER_MANAGE),
        listPartnerAgreements (PARTNER_MANAGE), createPartnerAgreement (PARTNER_MANAGE), updatePartnerAgreement
        (PARTNER_MANAGE).
      why: >-
        The Console runs outside every cell; a platform token carries no tenant permission until a time-boxed grant
        is open, so these calls are refused 403 as drawn. Either add the R098 pattern (tenant picker, Open access
        grant with step-up, grant panel, grantRequired state, as on ADM-412) or the screen belongs in Venue Management
        (P08), where the tenant's own staff use it.
      source: >-
        R098; contracts/spine/identity.yaml#openPlatformStaffGrant; screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-WIR-021
    - what: >-
        Tables show every schema field, plumbing included: 'Every plan' drop id; 'Every subscription invoice' drop
