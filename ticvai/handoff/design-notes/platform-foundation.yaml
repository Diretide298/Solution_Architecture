      - title: Wave pool promo (Arabic)
        kind: video
        size: 48 MB
        status: processing
        usedIn: 0
      - title: Logo AquaCove horizontal
        kind: image
        size: 86 KB
        status: ready
        usedIn: 12
    corrections:
    - what: >-
        getMediaEntitlements and appendEntitlementToMedia (orders) are on the media library, and emptyNoAccess names
        ORDER_VIEW.
      why: >-
        Those operate on ticket media (a wristband or card carrying entitlements), not on digital assets; the word
        "media" collided. Remove them.
      source: contracts/spine/orders.yaml#appendEntitlementToMedia; screens/P13-white-label-cms.yaml#CMS-010
      status: fixed
      by: CHG-WIR-021
    - what: requiresModule is 'ticketing'.
      why: The asset library serves every guest surface; core.
      source: screens/P13-white-label-cms.yaml#CMS-010
    - what: Filters are free-text fields for kind, tag, collection id and venue id.
      why: Kind is an enumeration; tags, collections and venues are pickers.
      source: contracts/satellite/assets.yaml#searchMedia
    - what: formAppendEntitlementToMedia asks the person for id.
      why: >-
        Status and timestamps are the server's; an id is a client UUIDv7 generated silently. A form that asks for
        them invites nonsense values. Keep them out of the form.
      source: screens/P13-white-label-cms.yaml#CMS-010
      status: fixed
      by: CHG-WIR-021
    - what: >-
        Tables show every schema field, plumbing included: 'Every media asset' drop id, customMetadata; 'Every collection'
        drop id, venueId, parentCollectionId, coverAssetId.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P13-white-label-cms.yaml#CMS-010
  CMS-019:
    block: A
    summary: >-
      Who in the tenant may change what in the CMS: the people with CMS roles and the roles' CMS permissions (brand,
