      When a till decides it is offline and when it switches back: probe interval, timeout, failures before offline,
      successes and stable seconds before online, and whether it switches automatically. Values are bounded so a
      venue cannot set a till to flap.
    inputs:
    - field: Thresholds
      rule: >-
        Number fields with units (seconds, milliseconds) and the proposed minimum and maximum shown beside each;
        values outside are refused.
      source: R270; R129
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setConnectivityThresholds: set for
        the venue chosen in the venue filter, showing beside each value the tenant or region value it overrides.
        Nearest ancestor wins; a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/tenancy.yaml#setConnectivityThresholds
    edgeCases:
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    sampleData:
      thresholds:
        probeIntervalSeconds: 10
        probeTimeoutMs: 1500
        failuresBeforeOffline: 3
        successesBeforeOnline: 3
        minimumStableSeconds: 30
        autoSwitch: true
    corrections:
    - what: id and scopePath are form fields.
      why: Not typed by anyone.
      source: screens/P08-venue-back-office.yaml#BO-131
      status: fixed
      by: CHG-SBO-015
    - what: >-
        8 text fields are raw schema property names, not inputs: id, scopePath, failuresBeforeOffline, probeIntervalSeconds,
        probeTimeoutMs, successesBeforeOnline, minimumStableSeconds, autoSwitch.
      why: >-
        They were generated from a response schema; ids, statuses and computed totals are not typed by anybody.
        Replace with the real form the write operation needs (or a read-only summary).
      source: screens/P08-venue-back-office.yaml#BO-131
      status: fixed
      by: CHG-SBO-015
  BO-143:
