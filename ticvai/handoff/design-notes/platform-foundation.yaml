        Everything reads; the actions needing another permission are not offered as live buttons: ACCESS_VALIDATE
        for Consume cross region entitlement. Where the person would reasonably expect the action, it shows disabled
        with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/cross-region.yaml#consumeCrossRegionEntitlement
