      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P09-platform-admin-console.yaml#ADM-008
      status: fixed
      by: CHG-SBO-004
  ADM-342:
    block: A
    summary: >-
      Where a tenant's security policy for staff is set: which permissions require MFA at sign-in (above a floor
      that cannot be dropped) and which actions demand a step-up, at what strength. The policy can raise a control,
      never remove it. It is a tenant policy, so on the Console it is set under a platform-staff grant; guest two-step
      verification is not here.
    inputs:
    - field: Permissions that require MFA
      rule: >-
        The floor (ROLE_MANAGE, LEDGER_APPROVE, every PLATFORM_* permission) shown locked; the tenant may add others,
        never remove the floor. Adding one warns how many staff hold it and how many have no method enrolled.
      source: R135; contracts/spine/identity.yaml#setPasswordPolicy; contracts/spine/identity.yaml#listMfaMethods
    - field: Step-up per action
      rule: >-
        Each guarded action with its contract floor (none, pin or mfa) and the strength in force; the selector offers
        only equal or stronger values (raise only).
      source: contracts/spine/approvals.yaml#setStepUpPolicy; contracts/spine/approvals.yaml#listStepUpPolicies
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setStepUpPolicy, setPasswordPolicy,
        setGuestVerificationPolicy: tenant-wide only, no region or venue override is offered. Nearest ancestor wins;
        a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/approvals.yaml#setStepUpPolicy
    outputs:
    - element: Current policy
      rule: Read from getPasswordPolicy before editing, because setPasswordPolicy replaces the whole policy.
      source: contracts/spine/identity.yaml#getPasswordPolicy
    edgeCases:
    - case: A policy demands a factor nobody in the approver role holds
      expected: Warn before saving that the action will be locked for those approvers until they enrol.
      source: contracts/spine/identity.yaml#listMfaMethods
    - case: setStepUpPolicy answers 409
      expected: >-
        Show it as something the person can act on, not a failure: `required` is below the floor the operation's
        own `x-ticvai-step-up` sets. `refusedReason` is `belowContractFloor`, and `contractFloor` carries the lowest
        strength this operation accepts. Nothing is stored.
      source: contracts/spine/approvals.yaml#setStepUpPolicy
    consistency:
    - with: BO-065
      note: Guest two-step verification is a per-venue setting there, not here.
    - with: ADM-001
      note: The list decides who meets the second-factor step at sign-in.
    sampleData:
      mfaPermissions:
        floor:
        - ROLE_MANAGE
        - LEDGER_APPROVE
        - PLATFORM_*
        added:
        - REFUND_APPROVE
      stepUp:
      - action: approveRefund
        floor: mfa
        inForce: mfa
      - action: reopenShift
        floor: pin
        inForce: mfa
    corrections:
    - what: The gaps entry says nothing reads the password policy.
      why: getPasswordPolicy now exists; the screen should declare it and drop the stale gap.
      source: contracts/spine/identity.yaml#getPasswordPolicy; screens/P09-platform-admin-console.yaml#ADM-342
      status: fixed
      by: CHG-WIR-021
    - what: Tenant-config operations with no tenant picker or platform-staff grant.
      why: >-
        On the Console every tenant write needs the R098 pattern; otherwise the screen is the tenant's own and belongs
        in Venue Management.
      source: R098
      status: fixed
      by: CHG-SBO-001
    - what: >-
        getGuestVerificationPolicy and setGuestVerificationPolicy (guest identity-document checks) on a staff MFA
        screen.
      why: >-
        A guest verification workflow is a separate policy; it confuses the "staff factors only" rule the screen
        states.
      source: contracts/spine/identity.yaml#setGuestVerificationPolicy
      status: fixed
      by: CHG-SBO-011
    - what: >-
        Calls tenant-permission operations with no tenant picker and no platform-staff grant: listStepUpPolicies
        (APPROVAL_CONFIGURE), setStepUpPolicy (APPROVAL_CONFIGURE), setPasswordPolicy (TENANT_CONFIGURE), getGuestVerificationPolicy
        (TENANT_CONFIGURE), setGuestVerificationPolicy (TENANT_CONFIGURE).
      why: >-
        The Console runs outside every cell; a platform token carries no tenant permission until a time-boxed grant
        is open, so these calls are refused 403 as drawn. Either add the R098 pattern (tenant picker, Open access
        grant with step-up, grant panel, grantRequired state, as on ADM-412) or the screen belongs in Venue Management
        (P08), where the tenant's own staff use it.
      source: >-
        R098; contracts/spine/identity.yaml#openPlatformStaffGrant; screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-SBO-001
    decisions:
    - question: DI-729 says MFA for sensitive approvals is a business option (on/off); the contract makes it a floor the tenant
        can only raise. Which holds?
      decision: 'Drawn default accepted: The contract floor holds (step-up cannot be configured away); draw the floor locked.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-095 | CHG-NOTE-005
      questionSource: DI-729; contracts/spine/approvals.yaml#setStepUpPolicy
