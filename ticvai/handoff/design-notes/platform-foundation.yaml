        Same tenant picker, grant panel and grantRequired state on every P09 screen that acts in a tenant (R098).
    sampleData:
      tenant: Marina Leisure Group
      grant:
        permissions:
        - TENANT_CONFIGURE
        reason: Set up Network International for AquaCove Muscat
        ticketRef: SUP-8812
        expiresIn: 3 h 12 min
      provider:
        name: Network International
        supportedMethods:
        - card
        - applePay
        - googlePay
    corrections:
    - what: >-
        Purpose is "Configure how TICVAI collects its fees", and the only write is the tenant's setPaymentProvider
        (venue scope).
      why: >-
        setPaymentProvider configures how the tenant's venue collects from guests. TICVAI's own fee collection is
        subscription billing; the purpose or the operation is wrong.
      source: contracts/spine/orders.yaml#setPaymentProvider; screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-SBO-011
    - what: The gaps entry says the screen declares no write.
      why: Stale; setPaymentProvider is declared.
      source: screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-SBO-011
    - what: setPaymentProvider is configured per venue, but the picker chooses only a tenant.
      why: After the tenant, a venue must be picked (the config scope is venue).
      source: contracts/spine/orders.yaml#setPaymentProvider; ADR-0018
      status: fixed
      by: CHG-SBO-011
  DEV-002:
    block: A
    summary: >-
      An integrator registers their organisation (not a personal account) and its owner manages who in it may do
      what: owner, admin, developer, read-only. Registration is pending until TICVAI verifies it; nothing is provisioned
      before that, because an unverified account with live credentials is an open door.
    inputs:
    - field: Organisation
      rule: >-
        Organisation name, contact email (verified by email), website, country; the person registering becomes owner.
      source: contracts/satellite/public-api.yaml#registerDeveloper; F27 step 2
    - field: Members
      rule: Invite by email with a role (owner, admin, developer, read-only); at least one owner always remains.
      source: contracts/satellite/public-api.yaml#setDeveloperMembers
    outputs:
    - element: Verification status
      rule: >-
        Pending, verified (with date), suspended or closed, and what pending means ("we review within 2 working
        days; you can explore the docs and sandbox meanwhile").
      source: contracts/satellite/public-api.yaml#/components/schemas/DeveloperAccount
    consistency:
    - with: DEV-003
      note: Clients are created after verification.
    sampleData:
      organisation:
        name: Gulf Kiosk Systems FZ-LLC
        contactEmail: dev@gulfkiosk.ae
        country: AE
        status: pending
      members:
      - name: Nadia Farouk
        email: nadia@gulfkiosk.ae
        role: owner
      - name: Karim Youssef
        email: karim@gulfkiosk.ae
        role: developer
    corrections:
    - what: Text fields for id, status, verifiedAt and partnerId.
      why: Server-set; registration asks name, email, website and country.
      source: contracts/satellite/public-api.yaml#registerDeveloper
      status: fixed
      by: CHG-SOT-014
    - what: registerDeveloper requires DEVELOPER_VIEW with audience public.
      why: A person registering holds no permission yet; the operation must be callable without one.
      source: contracts/satellite/public-api.yaml#registerDeveloper
      status: logged
      by: CHG-SOT-016
    - what: >-
        8 text fields are raw schema property names, not inputs: id, organisationName, contactEmail, websiteUrl,
        countryCode, partnerId, status, verifiedAt.
      why: >-
        They were generated from a response schema; ids, statuses and computed totals are not typed by anybody.
        Replace with the real form the write operation needs (or a read-only summary).
      source: screens/P14-developer-portal.yaml#DEV-002
      status: fixed
      by: CHG-SOT-014
    decisions:
    - question: Which door does a developer sign in through? P14 belongs to TICVAI Control, whose doors are ADM-001 (platform
        staff) and PTR-001 (partners).
      decision: 'Drawn default accepted: Developers sign in through the partner door with a developer account; draw a "Sign
        in to the Developer Portal" variant of PTR-001.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-096 | CHG-NOTE-005
      questionSource: screens/P14-developer-portal.yaml#DEV-002; screens/P10-partner-reseller-portal.yaml#PTR-001
  DEV-003:
    block: A
    summary: >-
      A developer creates sandbox clients, picks scopes by module, takes the secret once, rotates with an overlap
      window or revokes at once, and requests production access for a certified integration. Production clients
      are never created here; TICVAI issues them on an approved request.
    inputs:
    - field: Create client
      rule: >-
        Name and scopes only; environment fixed to sandbox and shown as such; the client id and status are the server's.
      source: contracts/satellite/public-api.yaml#createApiClient; DI-927
    - field: Scopes
      rule: >-
        Grouped by module, {module}.read and {module}.write; unlicensed modules shown disabled with "not licensed
        by any tenant you work for", not hidden.
      source: DI-926; contracts/satellite/public-api.yaml#listApiScopes
    - field: Rotate
      rule: Overlap hours for the old secret (hygiene); Revoke has no overlap (a leak).
      source: contracts/satellite/public-api.yaml#rotateApiCredential
    - field: Request production access
      rule: >-
        The certified listing, tenants, scopes and at least one IP allow-list address; the form says a new production
        key will be issued and the sandbox key stays sandbox.
      source: DI-927; DI-928; F36 step 4
    outputs:
    - element: Environment
      rule: >-
        A column in words (Sandbox / Production) with distinct styling; a sandbox and a production key must not
        look alike.
      source: screens/P14-developer-portal.yaml#DEV-003
    - element: Secret
      rule: Shown once at creation or rotation, with copy; the banner says so before it is generated.
      source: F27 step 3
    - element: Production access status
      rule: Sandbox only, requested (pending), approved, or rejected with the reason.
      source: DI-927
    edgeCases:
    - case: Can read but not change (holds DEVELOPER_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: DEVELOPER_MANAGE
        for Create API client, Rotate API credential, Revoke API credential. Where the person would reasonably expect
        the action, it shows disabled with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/public-api.yaml#createApiClient
    - case: createApiClient answers 409
      expected: >-
        Show it as something the person can act on, not a failure: A `production` client without a current certification,
        or asked for by a developer rather than issued by TICVAI (`certification-required`, M17-06). Use `requestProductionAccess`.
      source: contracts/satellite/public-api.yaml#createApiClient
    - case: createApiClient answers 422
      expected: >-
        Show it as something the person can act on, not a failure: A `production` client with an empty `ipAllowList`
        (`ip-allow-list-required`, M17-07), or a scope that is not in the scope catalogue (`unknown-scope`, M17-05).
      source: contracts/satellite/public-api.yaml#createApiClient
    - case: requestProductionAccess answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The listing is not certified, or its certification
        has lapsed (`certification-required`); or the client is not a sandbox client, or a request for it is already
        pending (`production-access-pending`).
      source: contracts/satellite/public-api.yaml#requestProductionAccess
    - case: requestProductionAccess answers 422
      expected: >-
        Show it as something the person can act on, not a failure: An empty `ipAllowList` (`ip-allow-list-required`)
        or an unknown scope (`unknown-scope`).
      source: contracts/satellite/public-api.yaml#requestProductionAccess
    sampleData:
      clients:
      - name: Kiosk connector (test)
        environment: Sandbox
        scopes:
        - ticketing.read
        - orders.write
        status: active
        lastUsed: 01/10/2026 08:40
        expires: 30/12/2026
      - name: Kiosk connector
        environment: Production
        issuedBy: TICVAI
        tenants:
        - Marina Leisure Group
        ipAllowList:
        - 185.53.2.10
        expires: 30/09/2027
    corrections:
    - what: formCreateApiClient requires id, status and environment and offers lastUsedAt.
      why: Server values, and environment must be sandbox here (production is issued by TICVAI).
      source: contracts/satellite/public-api.yaml#createApiClient; DI-927
      status: fixed
      by: CHG-SOT-014
    - what: >-
        Tables show every schema field, plumbing included: 'Every API client' drop id, developerId, clientId, allowedTenantIds.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P14-developer-portal.yaml#DEV-003
      status: fixed
      by: CHG-SOT-014
  DEV-008:
    block: A
    summary: >-
      TICVAI's programme administration behind the developer portal: per-client quotas, certification of integrations
      (with an end date), the production-access queue, anomaly rules, API licensing per tenant and version deprecation.
      Never shown to a developer; a developer reaching it is told plainly it is a TICVAI screen.
    inputs:
    - field: Quota
      rule: >-
        Sustained per minute, burst per second, daily cap, per-operation overrides and the action on breach; within
        the tenant's request budget.
      source: contracts/satellite/public-api.yaml#setApiQuota; ADR-0064
    - field: Decide production access
      rule: >-
        Approve issues a new production client bound to the certified listing with its own expiry (default 365 days,
        1 to 730); scopes may only be narrowed; reject needs a reason the developer can act on.
      source: contracts/satellite/public-api.yaml#decideProductionAccess; F36 step 5
    - field: Deprecate version
      rule: >-
        Sunset date, reason and migration guide; the banner names how many clients call it and which operations
        they use.
      source: contracts/satellite/public-api.yaml#deprecateApiVersion; ADR-0026
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setApiQuota, setApiLicensing, setApiAnomalyRule:
        tenant-wide only, no region or venue override is offered. Nearest ancestor wins; a workstation is assigned
        a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/satellite/public-api.yaml#setApiQuota
    edgeCases:
    - case: Can read but not change (holds DEVELOPER_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: DEVELOPER_ADMIN
        for Save API quota, Certify integration, Save API licensing. Where the person would reasonably expect the
        action, it shows disabled with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/public-api.yaml#setApiQuota
    - case: setApiLicensing answers 403
      expected: >-
        Show it as something the person can act on, not a failure: `catalogueWriteException` was sent by a principal
        that is not TICVAI platform staff (`platform-staff-only`, M17-04).
      source: contracts/satellite/public-api.yaml#setApiLicensing
    - case: decideProductionAccess answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Already decided (`already-decided`), or the listing's
        certification lapsed since the request (`certification-required`).
      source: contracts/satellite/public-api.yaml#decideProductionAccess
    - case: decideProductionAccess answers 422
      expected: 'Show it as something the person can act on, not a failure: `reject` without a `reason`.'
      source: contracts/satellite/public-api.yaml#decideProductionAccess
    consistency:
    - with: DEV-003
      note: The developer's request and status shown there are decided here.
    sampleData:
      queue:
      - developer: Gulf Kiosk Systems FZ-LLC
        listing: AquaCove Kiosk Connector v1.2
        tenants:
        - Marina Leisure Group
        scopes:
        - ticketing.read
        - orders.write
        ip: 185.53.2.10
        requested: 30/09/2026
      quota:
        client: Kiosk connector
        sustainedPerMinute: 600
        burstPerSecond: 20
        dailyCap: 200000
        onBreach: throttle
    corrections:
    - what: >-
        Text fields named id, clientId, sustainedPerMinute, burstPerSecond, dailyCap, perOperationOverrides, onBreach.
      why: Raw schema names as labels; the quota form needs labelled number fields and a client picker.
      source: screens/P14-developer-portal.yaml#DEV-008
      status: fixed
      by: CHG-SOT-014
    - what: listProductionAccessRequests allows the partner audience with DEVELOPER_VIEW.
      why: The queue is TICVAI's; a developer should see only their own requests (on DEV-003).
      source: contracts/satellite/public-api.yaml#listProductionAccessRequests
      status: logged
      by: CHG-SOT-016
