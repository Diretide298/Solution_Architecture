  PTR-035:
    block: B
    summary: How partner commissions and incentives are calculated; saving rules requires a second factor.
    inputs:
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setPartnerCommissionRules: tenant-wide
        only, no region or venue override is offered. Nearest ancestor wins; a workstation is assigned a profile,
        never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/satellite/subscription.yaml#setPartnerCommissionRules
    actions:
    - action: Save partner commission rules
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends setPartnerCommissionRules with its single-use
        stepUpToken. Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the
        policy's lockout minutes and the screen says when it lifts. Why the control exists: Sets what the venue
        pays a partner.
      source: >-
        contracts/satellite/subscription.yaml#setPartnerCommissionRules; R126; contracts/spine/identity.yaml#createMfaChallenge
    edgeCases:
    - case: Can read but not change (holds PLATFORM_TENANT_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PARTNER_MANAGE
        for Save partner commission rules. Where the person would reasonably expect the action, it shows disabled
        with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/subscription.yaml#setPartnerCommissionRules
    - case: setPartnerCommissionRules answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Two rules overlap, or commission on a net-rate
        agreement
      source: contracts/satellite/subscription.yaml#setPartnerCommissionRules
    - case: setPartnerCommissionRules answers 422
      expected: >-
        Show it as something the person can act on, not a failure: A rule is missing the fields its model needs,
        or tiers out of order
      source: contracts/satellite/subscription.yaml#setPartnerCommissionRules
    sampleData:
      listCommissionMarginIncentive (CommissionMarginIncentiveManagementView):
      - commissionModel: fixedPercentage
        commissionPercent: 12.5
        commissionAmount: AED 1,250.00
        volumeWindow: calendarMonth
      - commissionModel: fixedAmount
        commissionPercent: 8.0
        commissionAmount: AED 48,000.00
        volumeWindow: calendarQuarter
    corrections:
    - what: Reaches setPartnerCommissionRules (step-up mfa) and declares no way to raise the challenge.
      why: >-
        The operation refuses without a fresh stepUpToken, so the action can never succeed from this screen. Add
        createMfaChallenge/verifyMfaChallenge (or the supervisor-PIN overlay for pin) in the action's confirmation.
      source: contracts/satellite/subscription.yaml#setPartnerCommissionRules
      status: fixed
      by: CHG-SOT-015
    - what: 'Partner portal screen calls staff-only operations: setPartnerCommissionRules (staff).'
      why: >-
        A partner user is refused these (audience excludes partner). Either the screen is a tenant/TICVAI staff
        screen managing partners (then it belongs in Venue Management or the Console and is gated as staff), or
        the operation needs the partner audience and a partner-scoped filter.
      source: ADR-0025; contracts/satellite/subscription.yaml#setPartnerCommissionRules
      status: logged
      by: CHG-SOT-016
