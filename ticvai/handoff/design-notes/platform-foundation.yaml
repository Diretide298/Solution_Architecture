  ADM-534:
    block: B
    summary: >-
      AI-proposed actions waiting for approval: SLA, escalation and delegation so they never wait forever. An expired
      AI proposal lapses; it is never applied by default.
    inputs:
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setApprovalSlaPolicy: tenant-wide
        only, no region or venue override is offered. Nearest ancestor wins; a workstation is assigned a profile,
        never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/approvals.yaml#setApprovalSlaPolicy
    - field: Delegation window and limits
      rule: >-
        Always time-bounded: 'to' must follow 'from' (refused invalidWindow); the delegate cannot exceed the delegator's
        kinds or maxAmount and must hold the permission (exceedsDelegatorAuthority, delegateLacksPermission); a
        delegate never approves a request the delegator raised.
      source: contracts/spine/approvals.yaml#createApprovalDelegation
    edgeCases:
    - case: Can read but not change (holds AI_USE, APPROVAL_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: APPROVAL_REQUEST
        for Escalate; APPROVAL_DECIDE for Delegate; APPROVAL_CONFIGURE for Save approval SLA. Where the person would
        reasonably expect the action, it shows disabled with the permission named. The server refuses with 403 forbidden
        regardless.
      source: contracts/spine/approvals.yaml#escalateApprovalRequest
    - case: createApprovalDelegation answers 403
      expected: >-
        Show it as something the person can act on, not a failure: The delegation would hand over authority that
        is not there. `refusedReason` is `delegateLacksPermission` where the delegate does not hold the permission
        being delegated, or `exceedsDelegatorAuthority` where `kinds` or `maxAmount` go beyond what the delegator
        may approve. The shared `Forbidden`, with no `refusedReason`, is the ca...
      source: contracts/spine/approvals.yaml#createApprovalDelegation
    consistency:
    - with: BO-087
      note: Delegations are the same objects.
    sampleData:
      listProposedActions (ProposedAction):
      - kind: standard
        summary: Guest charged twice at Main Gate Till 3
        status: active
        expiresAt: 31/12/2026 23:59
        approvalLevel: 12
      - kind: standard
        summary: Group of 40 from Desert Gate Tours
        status: pending
        expiresAt: 15/10/2026 00:00
        approvalLevel: 3
    corrections:
    - what: >-
        Calls tenant-permission operations with no tenant picker and no platform-staff grant: getActionPlan (AI_USE),
        listProposedActions (AI_USE), listApprovalDelegations (APPROVAL_VIEW), escalateApprovalRequest (APPROVAL_REQUEST),
        createApprovalDelegation (APPROVAL_DECIDE), setApprovalSlaPolicy (APPROVAL_CONFIGURE).
      why: >-
        The Console runs outside every cell; a platform token carries no tenant permission until a time-boxed grant
        is open, so these calls are refused 403 as drawn. Either add the R098 pattern (tenant picker, Open access
        grant with step-up, grant panel, grantRequired state, as on ADM-412) or the screen belongs in Venue Management
        (P08), where the tenant's own staff use it.
      source: >-
        R098; contracts/spine/identity.yaml#openPlatformStaffGrant; screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-SBO-001
    - what: requiresModule is 'ai' on a TICVAI Console screen.
      why: >-
        requiresModule ties a screen to what a tenant licensed; a platform operator's console does not depend on
        any tenant's modules (and 'membership' is the guest annual-pass module, not TICVAI's subscription). Should
        be core.
      source: screens/_schema.yaml#requiresModule; screens/P09-platform-admin-console.yaml#ADM-534
      status: fixed
      by: CHG-SBO-003
