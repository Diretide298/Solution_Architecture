  CMS-010:
    block: A
    summary: >-
      The tenant's library of images, video and documents used by the guest apps and websites: upload, describe
      (title, alt text in Arabic and English, tags, collections), record usage rights and their expiry, and see
      where each asset is used before replacing or deleting it. The rule: deleting is the only end of an asset's
      life and is refused or warned while it is in use.
    inputs:
    - field: Upload
      rule: >-
        Brand assets PNG or SVG up to 2 MB; library images and video within the size and pixel limits shown before
        the upload (e.g. banner image at most 1024 px wide), validated on upload with the reason stated. The signed
        upload is requested, the file sent, then completed with title, alt text, tags, collections and rights.
      source: >-
        R270; DI-188; contracts/satellite/assets.yaml#createUpload; contracts/satellite/assets.yaml#completeUpload
    - field: Alt text
      rule: Required for images used on guest surfaces, in each of the tenant's languages.
      source: designer default
    outputs:
    - element: Asset grid
      rule: >-
        Thumbnail, title, kind, size, dimensions, status chip (ready, processing, quarantined, archived), usage
        count and rights expiry; unused and expiring filters.
      source: contracts/satellite/assets.yaml#searchMedia; contracts/satellite/assets.yaml#getExpiringRights
    actions:
    - action: Restore / Release from quarantine
      result: >-
        Restore returns an archived asset to ready; Release is for a reviewer after the scan finding is cleared
        and records the reviewer.
      source: contracts/satellite/assets.yaml#updateMediaAsset
    - action: Replace
      result: New file behind the same asset; every usage updates. The confirmation lists where it is used.
      source: contracts/satellite/assets.yaml#replaceMediaAsset
    - action: Delete
      result: Cannot be undone; the confirmation names live usages and refuses or warns while it is used.
      source: contracts/satellite/assets.yaml#deleteMediaAsset
    edgeCases:
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    - case: Can read but not change (holds ASSET_LIBRARY_VIEW, ORDER_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: ORDER_CREATE for
        Append entitlement to media; ASSET_LIBRARY_MANAGE for Complete upload, Create collection, Create upload;
        AI_USE for semanticSearch. Where the person would reasonably expect the action, it shows disabled with the
        permission named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/orders.yaml#appendEntitlementToMedia
    - case: appendEntitlementToMedia answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Media expired (`mediaExpired`), blocked (`mediaBlocked`),
        already surrendered at exit (`mediaSurrendered`), or the entitlement cannot share media (`entitlementCannotShareMedia`)
        — a single-entry ticket surrendered at the gate is not a claim token for anything bought afterwards. Also
        refused where the media was issued for another...
      source: contracts/spine/orders.yaml#appendEntitlementToMedia
    - case: completeUpload answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The transfer never finished (`transferIncomplete`),
        the upload ticket expired (`uploadExpired`), or the stored file is larger than the ticket allowed (`sizeExceeded`).
        A file that fails scanning is not refused here — see above
      source: contracts/satellite/assets.yaml#completeUpload
    - case: deleteMediaAsset answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Asset is in use. Every reference is listed
      source: contracts/satellite/assets.yaml#deleteMediaAsset
    - case: replaceMediaAsset answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The upload cannot be used: it is a different
        kind — an image cannot replace a document (`kindMismatch`) — or the transfer never finished (`transferIncomplete`),
        the upload ticket expired (`uploadExpired`), or the stored file is larger than the ticket allowed (`sizeExceeded`)
      source: contracts/satellite/assets.yaml#replaceMediaAsset
