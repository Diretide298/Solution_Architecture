  BO-284:
    block: B
    summary: >-
      The guest membership and annual-pass board's hub for the tenant's membership team: products by type and tier,
      members, expiring and renewal-enabled products, configuration issues. "Membership" here is the guest's pass,
      not the tenant's TICVAI subscription.
    actions:
    - action: Suspend / Reinstate membership product
      result: >-
        Suspending stops new sales; existing members keep their entitlement until expiry; the confirmation states
        the number of current members.
      source: contracts/satellite/subscription.yaml#approveMembershipProductValidation
    - action: Suspend membership product
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends approveMembershipProductValidation with its single-use
        stepUpToken. Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the
        policy's lockout minutes and the screen says when it lifts. Why the control exists: Platform-level product
        state, across tenants.
      source: >-
        contracts/satellite/subscription.yaml#approveMembershipProductValidation; R126; contracts/spine/identity.yaml#createMfaChallenge
    edgeCases:
    - case: Can read but not change (holds PLATFORM_TENANT_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PLATFORM_CELL_MANAGE
        for Suspend membership product. Where the person would reasonably expect the action, it shows disabled with
        the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/subscription.yaml#approveMembershipProductValidation
    - case: approveMembershipProductValidation answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The action is not allowed from the version's
        current status (`invalid-product-transition`, states/membership-product.yaml) (decided 29 September, writers
        pass; DM4)
      source: contracts/satellite/subscription.yaml#approveMembershipProductValidation
    - case: approveMembershipProductValidation answers 422
      expected: >-
        Show it as something the person can act on, not a failure: A suspend sent without a reason (`reason-required`)
        (decided 29 September, writers pass; DM4)
      source: contracts/satellite/subscription.yaml#approveMembershipProductValidation
    sampleData:
      products:
      - name: AquaCove Annual Pass Gold
        type: annualPass
        tier: Gold
        members: 4210
        renewal: auto
      - name: AquaCove Family Pass
        type: familyMembership
        tier: Silver
        members: 1385
        renewal: manual
    corrections:
    - what: Membership types (Monthly, Fixed-Term, Corporate...) are drawn as buttons.
      why: They are a filter or a create-choice.
      source: screens/P08-venue-back-office.yaml#BO-284
      status: fixed
      by: CHG-SBO-015
    - what: Reaches approveMembershipProductValidation (step-up mfa) and declares no way to raise the challenge.
      why: >-
        The operation refuses without a fresh stepUpToken, so the action can never succeed from this screen. Add
        createMfaChallenge/verifyMfaChallenge (or the supervisor-PIN overlay for pin) in the action's confirmation.
      source: contracts/satellite/subscription.yaml#approveMembershipProductValidation
      status: fixed
      by: CHG-SBO-015
    - what: >-
        A Venue Management screen calls operations gated by TICVAI-only permissions: listMembershipAnnualPass (PLATFORM_TENANT_VIEW),
        approveMembershipProductValidation (PLATFORM_CELL_MANAGE).
      why: >-
        No tenant role holds a PLATFORM_* permission or DEVELOPER_ADMIN (seed role proposal); the tenant's staff
        would be refused 403 on every call. Either the permission is wrong (a tenant permission such as TENANT_CONFIGURE
        or the module's own) or the screen belongs in the TICVAI Console.
      source: R229; contracts/satellite/subscription.yaml#listMembershipAnnualPass
      status: logged
      by: CHG-SBO-005
    - what: >-
        emptyFirstRun says it 'carries the create action', and the screen declares no operation that creates anything.
      why: >-
        A copy of the pattern's default text. The empty state must say what empty means here (for a queue or monitor:
        nothing waiting, which is good news) and offer the action that exists, or none.
      source: screens/P08-venue-back-office.yaml#BO-284; screens/_components.yaml#contentSpec.emptyStates
      status: fixed
      by: CHG-SBO-002
