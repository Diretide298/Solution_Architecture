    block: B
    summary: >-
      Approval volumes, decision times and where requests get stuck, by kind, venue and approver: raised, approved,
      rejected, withdrawn (not a rejection), expired, escalated, SLA breached, median and p95 minutes.
    outputs:
    - element: Withdrawn
      rule: Shown separately and never counted as a rejection in an approver's rate.
