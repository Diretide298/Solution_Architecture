  BO-054:
    block: A
    summary: >-
      Define what each role may do, per module, and see who holds it: roles are fully configurable (nothing predefined;
      the five seeded roles are editable starting points). Admins compare two roles side by side, see unused and
      missing permissions, and run access reviews. The rule to get right: granting a role is per scope, and the
      screen must show at which level a grant applies.
    inputs:
    - field: Role permissions
      rule: >-
        Grouped by module with three levels per module (edit and view, view only, hidden) and sub-permissions inside
        a module; TICVAI-only permissions (PLATFORM_*, DEVELOPER_ADMIN) never offered to a tenant role. Granting
        ROLE_MANAGE or LEDGER_APPROVE warns that holders will need MFA at sign-in.
      source: DI-387; R229; R135
    - field: Role code
      rule: Unique per tenant, compared case-insensitively; a clash is the duplicate-code refusal.
      source: R108
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setCapabilityTemplate: tenant-wide
        only, no region or venue override is offered. Nearest ancestor wins; a workstation is assigned a profile,
        never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/identity.yaml#setCapabilityTemplate
    outputs:
    - element: Roles comparison
      rule: >-
        Two roles side by side, differences highlighted (e.g. cashier lacks refund and void that supervisor has).
      source: DI-153
    - element: Holders
      rule: >-
        Principal count and grant count per role, linking to the people; system (seeded) roles marked editable but
        not deletable.
      source: contracts/spine/identity.yaml#listRoles
    edgeCases:
    - case: Editing a role held by people who are signed in
      expected: >-
        Permission changes revoke the holders' sessions at once; the save confirmation says how many people will
        be signed out.
      source: R126
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    consistency:
    - with: BO-1066
      note: >-
        Roles, Permissions & Masking is the same role model with data masking; it must not be a second role editor.
    - with: ADM-342
      note: The MFA permission list there decides the warning shown here.
    sampleData:
      roles:
      - code: CASHIER
        name: Cashier
        holders: 46
        system: true
      - code: SUPERVISOR
        name: Supervisor
        holders: 9
        system: true
      - code: FNB_OUTLET_MGR
        name: F&B Outlet Manager
        holders: 3
        system: false
    corrections:
    - what: >-
        The screen declares only listRoles and createRole for roles; no operation sets a role's permissions or grants
        a role to a person.
      why: >-
        The purpose is "Give somebody the permissions their job needs"; setRolePermissions exists (used on BO-116)
        and is missing here, and no grant operation is declared.
      source: screens/P08-venue-back-office.yaml#BO-054; contracts/spine/tenancy.yaml#setRolePermissions
      status: fixed
      by: CHG-WIR-021
    - what: entryState reads campaignId.
      why: That belongs to the access-review items call, not to the screen's entry.
      source: screens/P08-venue-back-office.yaml#BO-054
      status: fixed
      by: CHG-SBO-011
    - what: >-
        setRolePermissions lives in tenancy.yaml with a tenant scope level while roles live in identity.yaml at
        venue.
      why: >-
        Where a role is defined and where it is granted must be stated once; a venue-level role list with tenant-level
        permissions is ambiguous for a venue manager.
      source: contracts/spine/tenancy.yaml#setRolePermissions; contracts/spine/identity.yaml#listRoles
      status: fixed
      by: CHG-WIR-021
    - what: 'Tables show every schema field, plumbing included: ''Every role'' drop id, inheritsFromRoleId.'
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P08-venue-back-office.yaml#BO-054
