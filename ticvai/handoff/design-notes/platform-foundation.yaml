      source: contracts/satellite/platform-ops.yaml#rejectRelease
    - case: withdrawRelease answers 409
      expected: 'Show it as something the person can act on, not a failure: Not in a state that permits this'
      source: contracts/satellite/platform-ops.yaml#withdrawRelease
