  ADM-145:
    block: B
    summary: >-
      Approvals for promotional changes (new promotion, discount depth, activation): the request with its discount
      exposure, revenue and margin impact, decided in place with approve, reject, return or request information.
    outputs:
    - element: Impact columns
      rule: >-
        Discount exposure and revenue impact as money with currency; margin impact as percentage points; requested
        activation date in the venue's dates.
      source: contracts/spine/approvals.yaml#listApprovalRequests; ADR-0008
    - element: Money columns (Discount exposure)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure. Across
        tenants or regions figures in different currencies are never summed into one total; group by currency, or
        label the converted figure with its rate and time.
      source: ADR-0008; ADR-0011; DI-306
    actions:
    - action: Decide (Approve / Reject / Return / Request information)
      result: >-
        Four outcomes, not two: reject needs a reason the requester reads; return sends it back to amend; request
        information pauses the SLA clock. Approving records an authorisation and does not perform the action; on
        a multi-level chain the request moves to the next level. Where the rule demands MFA the decision carries
        a stepUpToken from the in-place challenge; where it demands a signature, the signature step comes first.
      source: contracts/spine/approvals.yaml#decideApprovalRequest; F14 step 4
    edgeCases:
    - case: Can read but not change (holds APPROVAL_VIEW, PRICE_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: APPROVAL_DECIDE
        for decideApprovalRequest. Where the person would reasonably expect the action, it shows disabled with the
        permission named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: decideApprovalRequest answers 403
      expected: >-
        Show it as something the person can act on, not a failure: The approver may not decide this request. **Always
        carries `refusedReason`**, one value per cause — the approver is the requester (`approverIsRequester`),
        is not in the resolved chain (`notInApproverChain`), lacks the permission the rule demands (`insufficientPermission`),
        gave no step-up token where the rule requires MFA (`mfaR...
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: decideApprovalRequest answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The request is no longer open for a decision.
        `refusedReason` says which: `alreadyDecided` (approved or rejected), `withdrawn`, `expired` or `cancelled`,
        and `currentStatus` carries the status it is in.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: The approver raised the request, or sits outside the resolved chain
      expected: >-
        Decide is refused 403 with refusedReason (approverIsRequester, notInApproverChain, missing permission or
        step-up); show the reason in words and who can decide instead. Segregation of duties survives delegation.
      source: >-
        contracts/spine/approvals.yaml#decideApprovalRequest; contracts/spine/approvals.yaml#createApprovalDelegation
    consistency:
    - with: BO-084
      note: Same decision dialog as every approval.
    sampleData:
      Waiting for a decision:
      - Promotion: 46
        Request type: Refund above threshold
        Requested by: Rahul Menon
        Requested date: 57
        Discount exposure: AED 12,400.00
        Revenue impact estimate: AED 12,400.00
        Margin impact: 233
        Campaign budget: 11
      - Promotion: 312
        Request type: Price change
        Requested by: Fatima Al Mansoori
        Requested date: 11
        Discount exposure: AED 482,300.00
        Revenue impact estimate: AED 482,300.00
        Margin impact: 57
        Campaign budget: 128
      - Promotion: 74
        Request type: Discount override
        Requested by: Omar Haddad
        Requested date: 128
        Discount exposure: AED 96,750.00
        Revenue impact estimate: AED 96,750.00
        Margin impact: 11
        Campaign budget: 46
    corrections:
    - what: '"Delegate" is a decision button.'
      why: >-
        Delegation is set ahead of time (BO-087); decideApprovalRequest has approve, reject, return and requestInformation
        only.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
      status: fixed
      by: CHG-MOV-005
    - what: >-
        Calls tenant-permission operations with no tenant picker and no platform-staff grant: listPromotions (PRICE_VIEW),
        listApprovalRequests (APPROVAL_VIEW), decideApprovalRequest (APPROVAL_DECIDE).
      why: >-
        The Console runs outside every cell; a platform token carries no tenant permission until a time-boxed grant
        is open, so these calls are refused 403 as drawn. Either add the R098 pattern (tenant picker, Open access
        grant with step-up, grant panel, grantRequired state, as on ADM-412) or the screen belongs in Venue Management
        (P08), where the tenant's own staff use it.
      source: >-
        R098; contracts/spine/identity.yaml#openPlatformStaffGrant; screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-MOV-001
    - what: requiresModule is 'marketing' on a TICVAI Console screen.
