  POS-000:
    block: A
    summary: >-
      The till's door. A cashier taps their face in a row of recent operators (or types employee number) and enters
      a PIN; a supervisor or manager holding a permission in the MFA list also gives the authentication code. One
      person per till: a sign-in while someone else holds it is refused and only a supervisor ends the other session.
      The role decides the surface (cashier to the till, kitchen staff to the kitchen display), the workstation
      decides the Sale Board.
    inputs:
    - field: Employee number and PIN
      rule: >-
        Employee number goes in username, PIN in credential with method pin; the keypad is on screen, large targets.
        A PIN is acceptable only because the request carries this workstation, which is on a venue network.
      source: contracts/spine/identity.yaml#/components/schemas/LoginRequest; R126
    - field: Recent operators row
      rule: >-
        Device-local, never from an endpoint: the last operators of this till as photo tiles, about four visible
        and swipe for more; tapping one fills the employee number, the PIN is still required. A manual employee
        number + PIN option is always there.
      source: DI-774; screens/P04-point-of-sale.yaml#POS-000
    - field: New PIN after a reset
      rule: >-
        When the credential was reset (temporary PIN), the next sign-in asks for a new PIN twice before anything
        else; the last 5 cannot be reused.
      source: contracts/spine/identity.yaml#changeOwnCredential; R132
    outputs:
    - element: Signed in on this till now
      rule: >-
        When the sign-in is refused because the till is held: who holds it (name and photo), since when, and whether
        their shift is open; shown only to a person who could end it, otherwise "Ask a supervisor to end Rahul Menon's
        session".
      source: contracts/spine/identity.yaml#listActiveSessions; ADR-0004; R184
    - element: Role choice
      rule: >-
        Only when the person holds several roles: large role buttons; one role goes straight in. Cashier lands on
        POS-001 (begin shift) or POS-025 if a shift is already open; kitchen roles on KIT-002.
      source: ADR-0003; DI-249; contracts/spine/identity.yaml#selectRole
    actions:
    - action: Sign in
      result: >-
        Success with an open shift goes to Till Home; without, to Begin Shift (the denomination step is only at
        shift start, never on every sign-in or return from a break). Wrong PIN names attempts left before lock.
      source: DI-777; screens/P04-point-of-sale.yaml#POS-000
    - action: Take the till over
      result: >-
        Supervisor only (SESSION_FORCE_LOGOUT): confirmation "End Rahul Menon's session on Main Gate Till 3? His
        shift stays open and his float does not move." with a reason; then the new sign-in proceeds. Signing in
        never ends the other session by itself.
      source: contracts/spine/identity.yaml#forceLogout; R184; ADR-0004
    - action: Verify (authentication code)
      result: >-
        Only for a principal holding ROLE_MANAGE, LEDGER_APPROVE or a tenant-added permission; a cashier never sees
        it. Email me a code instead is the fallback; five wrong codes lock for the lockout minutes.
      source: R135; R126; contracts/spine/identity.yaml#verifyMfaChallenge
    edgeCases:
    - case: Network down
      expected: >-
        Signs in against the cached operator list; the status strip says offline. A till that cannot open because
        the network is down does not sell.
      source: screens/P04-point-of-sale.yaml#POS-000; ADR-0013
    - case: Authenticated but no role on this workstation
      expected: '"You are signed in but hold no role at this till" with who to ask; distinct from a wrong PIN.'
      source: screens/P04-point-of-sale.yaml#POS-000
    - case: The operator is force-logged out elsewhere
      expected: >-
        The till returns to this screen with "Your session was ended by Omar Haddad"; it is a new sign-in, not a
        refresh.
      source: contracts/shared/common.yaml#/components/schemas/Problem; ADR-0004
    - case: First morning, nobody has signed in on this till
      expected: No recent-operators row; the keypad is the whole screen. Not a fault.
      source: screens/P04-point-of-sale.yaml#POS-000
    consistency:
    - with: EMP-001
      note: Same PIN keypad, refusal wording and role choice on the staff handheld.
    - with: SCN-001
      note: Same door on the scanner, PIN or badge.
    - with: KIT-002
      note: >-
        A kitchen role lands on the kitchen display from this same door (P15 is the till signed into differently).
    sampleData:
      workstation: Main Gate Till 3 (AUH-TKT-03), AquaCove Abu Dhabi
      recentOperators:
      - Rahul Menon · 10482
      - Mariam Saeed · 10517
      - Joseph D'Souza · 10233
      - Layla Hassan · 10611
      heldBy:
        name: Rahul Menon
        since: 09:02
        shiftOpen: true
      roles:
      - Cashier
      - Supervisor
  POS-016:
    block: A
    summary: >-
      A manager configures this till in place: its name, Sale Board, input mode, guest display, department and access
      point, the peripherals bound to it, and the deposit box allocated to a cashier. The workstation is assigned
      a profile the venue defined, so most settings here are a pick from venue-defined options, not free configuration.
      The one thing to get right: a cashier must never reach the settings; this is behind the manager permission.
    inputs:
    - field: Sale Board
      rule: >-
        Required; picked from the venue's sale boards (ticketing, F&B or retail). Changing it changes what the next
        cashier lands on, not the permissions anyone has.
      source: contracts/spine/tenancy.yaml#configureWorkstation; ADR-0002; DI-247
    - field: Cashier input mode
      rule: >-
        Keyboard, touch, scanner or hybrid; default hybrid; per workstation because the device, not the operator,
        decides.
      source: contracts/spine/tenancy.yaml#/components/schemas/ConfigureWorkstationRequest
    - field: Guest-facing display
      rule: >-
        Line items always shown; the venue chooses the rest (totals, promotions, language). Toggle per terminal
        setting.
      source: contracts/spine/tenancy.yaml#/components/schemas/ConfigureWorkstationRequest; DI-800
    - field: Opening float (deposit box)
      rule: >-
        Either a total or by denomination, per the venue's choice; amounts in the region's scale (AED 2 decimals,
        BHD/KWD 3, third decimal never rounded). Foreign currencies counted separately.
      source: contracts/spine/shift.yaml#allocateDepositBox; DI-307; DI-306
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: configureWorkstation: set for the
        venue chosen in the venue filter, showing beside each value the tenant or region value it overrides. Nearest
        ancestor wins; a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/tenancy.yaml#configureWorkstation
    outputs:
    - element: Peripherals
      rule: >-
        Each device bound to this till: kind, model, firmware, required or optional, and live status from its last
        heartbeat (answering / not answering since 10:42). Drivers are built into the app; nothing to install.
      source: contracts/spine/tenancy.yaml#listDevices; DI-897; DI-778
    - element: Deployment info
      rule: Terminal app version, installed build, sync status and pending sync count, read-only.
      source: DI-801
    actions:
    - action: Test device
      result: >-
        Prints a test receipt or reads a test scan from inside the app and shows pass or fail per peripheral.
      source: DI-897; DI-778
    - action: Assign peripheral to this till
      result: >-
        Binds a registered device to this workstation (assignedWorkstationId) with its custodian; a device already
        bound elsewhere names that till before moving it.
      source: contracts/spine/tenancy.yaml#setDeviceAssignment
    edgeCases:
    - case: Offline
      expected: >-
        The deposit box allocation works offline (journaled); configuration changes and device assignment need the
        server and say so.
      source: contracts/spine/shift.yaml#allocateDepositBox; contracts/spine/tenancy.yaml#configureWorkstation
    - case: Can read but not change (holds DEVICE_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: SHIFT_OPEN for
        Allocate deposit box; WORKSTATION_CONFIGURE for Configure workstation; DEVICE_MANAGE for Assign peripheral
        to this till. Where the person would reasonably expect the action, it shows disabled with the permission
        named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/shift.yaml#allocateDepositBox
    - case: configureWorkstation answers 409
      expected: >-
        Show it as something the person can act on, not a failure: **A shift is open on this workstation.** The
        change is not applied; it can be made once the shift has closed. Names the open shift.
      source: contracts/spine/tenancy.yaml#configureWorkstation
    consistency:
    - with: BO-036
      note: >-
        The device registry in Venue Management is where devices are registered; this screen only binds and tests
        them.
    - with: POS-001
      note: Boot-up hardware checks at shift start use the same per-peripheral status.
    sampleData:
      workstation:
        name: Main Gate Till 3
        code: AUH-TKT-03
        saleBoard: Ticketing - Main Gate
        inputMode: hybrid
      devices:
      - kind: receiptPrinter
        model: Epson TM-m30III
        status: answering
        required: true
      - kind: barcodeScanner
        model: Zebra DS2208
        status: answering
        required: true
      - kind: cashDrawer
        model: APG Vasario
        status: not answering since 10:42
        required: true
      float:
        mode: byDenomination
        total: AED 1,000.00
        notes:
          AED 100: 5
          AED 50: 6
          AED 20: 10
    corrections:
    - what: >-
        Seventeen text fields are the DepositBox response properties (id, variance, expectedTotal, closedByPrincipalId,
        allocatedAt...).
      why: >-
        Allocation needs a cashier, the float (total or denominations) and the workstation; the rest is computed
        or closing data. Replace with the allocation form.
      source: screens/P04-point-of-sale.yaml#POS-016; contracts/spine/shift.yaml#allocateDepositBox
    - what: '"Record device heartbeat" is a button with a form (status, recordedAt).'
      why: >-
        recordDeviceHeartbeat's audience is device only; the peripheral reports it. Show the last heartbeat read-only.
      source: contracts/spine/tenancy.yaml#recordDeviceHeartbeat
      status: fixed
      by: CHG-WIR-021
    - what: Purpose is "Till Configuration — from the client design board, 20 August".
      why: A placeholder; the purpose is configuring this workstation in place (F73 step 1).
      source: screens/P04-point-of-sale.yaml#POS-016; F73 step 1
      status: fixed
      by: CHG-WIR-023
    - what: >-
        16 text fields are raw schema property names, not inputs: id, cashierPrincipalId, cashierName, venueId,
        workstationId, shiftId, status, openingFloat, openingDenominations, withdrawnTotal ....
      why: >-
        They were generated from a response schema; ids, statuses and computed totals are not typed by anybody.
        Replace with the real form the write operation needs (or a read-only summary).
      source: screens/P04-point-of-sale.yaml#POS-016
    - what: formRecordDeviceHeartbeat asks the person for status.
      why: >-
        Status and timestamps are the server's; an id is a client UUIDv7 generated silently. A form that asks for
        them invites nonsense values. Keep them out of the form.
      source: screens/P04-point-of-sale.yaml#POS-016
      status: fixed
      by: CHG-WIR-021
    - what: >-
        Tables show every schema field, plumbing included: 'Every registered device' drop id, driver, workstationId,
        pushToken, pushPlatform, pushFailureCount.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P04-point-of-sale.yaml#POS-016
    decisions:
    - question: Which terminal toggles (printer, offline continuity, screen prompts, key sounds, training mode) are workstation
        settings, and which are venue policy that the till only reads?
      decision: 'Drawn default accepted: Draw them as read-only values inherited from the venue profile with the profile name,
        editable only on BO-123.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-097 | CHG-NOTE-005
      questionSource: DI-800; ADR-0018
  POS-019:
    block: A
    summary: >-
      Meant to set the rules every till in the venue closes to (shift templates and policies), from the till by
      a manager. As wired it lists shifts and edits the venue's general settings (support hours, quiet hours, biometrics,
      alerting), which is not the job. The rule to keep: shift policy is venue scope, never per workstation, or
      the variance report compares nothing.
    inputs:
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setVenueSettings: set for the venue
        chosen in the venue filter, showing beside each value the tenant or region value it overrides. Nearest ancestor
        wins; a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/tenancy.yaml#setVenueSettings
    outputs:
    - element: Shifts list
      rule: >-
        This till's shifts by default, newest first: cashier name, opened/closed times in the venue's time zone,
        status and box code. No expected or counted totals: the close is blind.
      source: contracts/spine/shift.yaml#listShifts; POSV2-3
    - element: Money columns (liftsTotal, refundsTotal, salesTotal)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure.
      source: ADR-0008; ADR-0011; DI-306
    edgeCases:
    - case: A manager tries to change a policy for this till only
      expected: Not possible; the screen says the policy applies to every till at AquaCove Abu Dhabi.
      source: F73 step 2; ADR-0018
    - case: Can read but not change (holds REPORT_VIEW_WORKSTATION, TENANT_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: TENANT_CONFIGURE
        for Save venue settings. Where the person would reasonably expect the action, it shows disabled with the
        permission named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/tenancy.yaml#setVenueSettings
    - case: setVenueSettings answers 422
      expected: >-
        Show it as something the person can act on, not a failure: **An enable the venue cannot evidence.** Biometrics
        switched on without a DPIA reference and a consent-notice acknowledgement, or device-assisted gender verification
        where no device in the venue reports `genderClassification`. `errors[]` names each missing field or the
        missing capability.
      source: contracts/spine/tenancy.yaml#setVenueSettings
    consistency:
    - with: POS-007
      note: The close rules set here are what POS-007's blind close enforces.
    sampleData:
      shifts:
      - cashier: Rahul Menon
        opened: 01/10/2026 08:55
        status: open
        box: BOX-AUH-07
      - cashier: Mariam Saeed
        opened: 30/09/2026 14:01
        closed: 30/09/2026 22:12
        status: closed
        box: BOX-AUH-03
    corrections:
    - what: >-
        The screen's only write is setVenueSettings (support hours, quiet hours, biometrics, segregated access,
        alerting); nothing reads or writes a shift template or close policy.
      why: >-
        The name and DI-309 promise templates and policies (opening/closing rules, exceptions and alerts); the contract
        offers no such operation. Either add the shift-policy operations or rename the screen to a shift list.
      source: screens/P04-point-of-sale.yaml#POS-019; contracts/spine/tenancy.yaml#setVenueSettings; DI-309
      status: fixed
      by: CHG-WIR-021
    - what: Venue settings are edited from a till.
      why: >-
        Venue-wide configuration (TENANT_CONFIGURE) belongs in Venue Management (BO-1063); a till is a device the
        venue configures, not a place to configure the venue.
      source: ADR-0018; contracts/spine/tenancy.yaml#setVenueSettings
      status: fixed
      by: CHG-WIR-021
    - what: >-
        Tables show every schema field, plumbing included: 'Every shift' drop id, workstationId, venueId, scopePath,
        principalId.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P04-point-of-sale.yaml#POS-019
    decisions:
    - question: Should the cashier ever see expected sales during or at close?
      decision: The cashier never sees expected sales during or at close (blind close).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-098 | CHG-FIN-003 | CHG-NOTE-005
      questionSource: DI-806; POSV2-3
  POS-025:
    block: A
    summary: >-
      Where a cashier lands after opening a shift and returns between sales: who is signed in at which till, shift
      start, the Sale Boards this workstation may open, peripheral health, alerts and quick actions (scan a ticket,
      recall a held sale, open drawer, reprint, void). It must be readable at arm's length and never show figures
      the cashier's role may not see.
    outputs:
    - element: Header identity
      rule: >-
        Till name and code, venue, signed-in cashier and role, shift start time, connection state and pending-sync
        count in the status strip.
      source: DI-779; screens/_components.yaml#statusStrip
    - element: Shift takings tile
      rule: >-
        Shown only when the role is allowed to see figures (a per-role setting); otherwise counts only (tickets
        sold). Never "expected in drawer".
      source: DI-802; POSV2-3
    - element: Sale Board tiles
      rule: >-
        Only the boards this workstation may open; the workstation's own board is first and selected. A board is
        a presentation, so switching it never changes permissions.
      source: contracts/spine/tenancy.yaml#listSaleBoards; DI-247; ADR-0002
    - element: Peripheral health
      rule: >-
        One chip per device (printer, scanner, drawer, card terminal) with a plain state; a failed required device
        turns the chip red and names it.
      source: contracts/spine/tenancy.yaml#getWorkstationHealth
    actions:
    - action: Sales journal
      result: Opens POS-030 filtered to this till and today.
      source: POSV2-1
    edgeCases:
    - case: Offline
      expected: >-
        Tiles show what this workstation knows; queue and alerts are last-known and say "as of 10:42"; only local
        transactions are listed while offline; sync is automatic.
      source: DI-798; screens/P04-point-of-sale.yaml#POS-025
    - case: Quick action the role lacks (void sale)
      expected: Shown with a lock; pressing it offers supervisor approval in place (PIN) rather than a dead button.
      source: screens/P04-point-of-sale.yaml#POS-025; R197
    consistency:
    - with: POS-030
      note: The journal entry point and its default filter.
    - with: POS-001
      note: Shift start time and denomination summary come from the shift opened there.
    sampleData:
      header:
        till: Main Gate Till 3 · AUH-TKT-03
        cashier: Rahul Menon (Cashier)
        shiftStart: 08:55
        status: Online · 0 pending
      tiles:
        ticketsSold: 214
        openHolds: 3
        queueWaiting: 6
      saleBoards:
      - Ticketing - Main Gate
      - Retail - Wave Shop
      alerts:
      - Receipt paper low on Main Gate Till 3
      - Wave pool closes at 17:30 today
    corrections:
    - what: emptyFirstRun says "No till home yet. Carries the create action".
      why: >-
        A home dashboard has nothing to create; the empty case is a till with no boards assigned, which should say
        who configures it.
      source: screens/P04-point-of-sale.yaml#POS-025
    - what: >-
        getCurrentShift requires SHIFT_OPEN; a supervisor covering the till without a shift of their own cannot
        load the home.
      why: >-
        Reading the current shift on a workstation should need the shift-view permission, not the right to open
        one.
      source: contracts/spine/shift.yaml#getCurrentShift
      status: fixed
      by: CHG-DOOR-005
  BO-053:
    block: A
    summary: >-
      Find anyone who works at the venues in scope, see their roles and validity, create a staff member, change
      their validity or primary role, and reset a forgotten password or PIN under a second factor. It is a directory
      first: search by name or employee number, then act on one person.
    inputs:
    - field: Create staff member
      rule: >-
        Username (unique within the tenant's cell) and display name required; an initial credential is optional
        and, when given, must be changed at first sign-in (default on); validity end date optional; roles picked
        from the tenant's roles. The job title and posting can be set here (workforce), and suggested roles appear
        from peers with the same title.
      source: >-
        contracts/spine/identity.yaml#createPrincipal; contracts/satellite/workforce.yaml#setWorkAssignment; contracts/spine/identity.yaml#suggestRoleAssignment
    - field: Reset credential
      rule: >-
        Password or PIN; a temporary value issued out of band, changed at next sign-in; a reason of at least 3 characters.
        The person resetting cannot reset their own.
      source: contracts/spine/identity.yaml#resetPrincipalCredential
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setJobTitle: set for the venue chosen
        in the venue filter, showing beside each value the tenant or region value it overrides. Nearest ancestor
        wins; a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/satellite/workforce.yaml#setJobTitle
    outputs:
    - element: Directory rows
      rule: >-
        Name, username or employee number, primary role and other roles, job title and venue posting, active/inactive,
        valid until, last sign-in. Inactive and expired people are filtered out by default.
      source: contracts/spine/identity.yaml#listPrincipals
    actions:
    - action: Deactivate
      result: >-
        Ends the person's sessions immediately (end date, primary role and permission changes revoke sessions at
        once); the confirmation says so.
      source: R126; contracts/spine/identity.yaml#updatePrincipal
    - action: Reset principal credential
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends resetPrincipalCredential with its single-use
        stepUpToken. Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the
        policy's lockout minutes and the screen says when it lifts. Why the control exists: Replaces somebody else's
        secret, which is the whole of an account takeover.
      source: >-
        contracts/spine/identity.yaml#resetPrincipalCredential; R126; contracts/spine/identity.yaml#createMfaChallenge
    edgeCases:
    - case: Username already used
      expected: Refused 409; says the username exists in this cell and suggests a variant.
      source: contracts/spine/identity.yaml#createPrincipal
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    - case: Can read but not change (holds PERMISSION_VIEW, USER_MANAGE, WORKFORCE_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: WORKFORCE_MANAGE
        for setJobTitle, setWorkAssignment. Where the person would reasonably expect the action, it shows disabled
        with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/workforce.yaml#setJobTitle
    - case: createPrincipal answers 409
      expected: 'Show it as something the person can act on, not a failure: Username already in use within this
        cell'
      source: contracts/spine/identity.yaml#createPrincipal
    - case: setWorkAssignment answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Overlaps an existing primary posting, or the
        employee is terminated externally
      source: contracts/satellite/workforce.yaml#setWorkAssignment
    consistency:
    - with: BO-054
      note: Roles assigned here are the ones defined there.
    - with: CMS-019
      note: The CMS User Access list must be this directory filtered, not a copy.
    - with: BO-873
      note: The Staff Resource Directory is the workforce view of the same people.
    sampleData:
      staff:
      - name: Rahul Menon
        username: '10482'
