  ADM-001:
    block: B
    summary: >-
      The TICVAI Console's door for platform operators: username and password, then always the authentication code,
      because every platform operator holds a PLATFORM_* permission. First sign-in enrols the authenticator app
      (email as fallback) and shows recovery codes once. After sign-in the operator lands on the Platform Dashboard;
      their own and others' active sessions are managed elsewhere.
    inputs:
    - field: Username and password
      rule: >-
        Password minimum 8; no workstation, no PIN, no role picker unless the operator holds several platform roles.
      source: R126; ADR-0003
    - field: Authentication code
      rule: >-
        Six digits from the authenticator app; Email me a code instead as fallback; five wrong codes lock for the
        lockout minutes, never permanently.
      source: R135; R126; F104 step 2
    - field: Enrol first method
      rule: >-
        Only authenticator app or email; the secret as QR and text; confirmed by the first code; recovery codes
        shown once with copy and download.
      source: >-
        contracts/spine/identity.yaml#enrolMfaMethod; contracts/spine/identity.yaml#verifyMfaEnrolment; F104 step
        2
    actions:
    - action: Sign in with SSO (where TICVAI uses one)
      result: Redirects to the identity provider and back; an unmapped group grants nothing.
      source: >-
        contracts/spine/identity.yaml#startSsoAuthorization; contracts/spine/identity.yaml#completeSsoAuthorization
    edgeCases:
    - case: Locked after five wrong codes
      expected: '"Too many attempts. Try again at 10:42." The session is not ended; nothing else is offered.'
      source: F104 step 2; contracts/spine/identity.yaml#createMfaChallenge
    - case: The operator is already signed in elsewhere
      expected: Refused with where (device, time); only another holder of SESSION_FORCE_LOGOUT can end it.
      source: ADR-0004
    consistency:
    - with: PTR-001
      note: Same form, same second-factor step and wording (F104 step 4).
    - with: SUP-001
      note: Same door for venue management (F104 step 5).
    sampleData:
      operator:
        name: Sara Khalil
        username: sara.khalil
        method: authenticator app
        codeExample: 193 027
      recoveryCodes:
      - 7KQ2-MX9P
      - R4TD-81WN
      - …8 more
    corrections:
    - what: >-
        Pattern listDetail with tables of every active session, every MFA method and every SSO provider, and Force
        logout / Revoke all sessions on the sign-in screen.
      why: >-
        A person signing in has no session yet and must see none of that; session management is a separate signed-in
        screen. Rebuild as a form (as WEB-016 and POS-000 were).
      source: screens/P09-platform-admin-console.yaml#ADM-001; F104 step 1
      status: fixed
      by: CHG-WIR-021
    - what: The login form requires workstationId.
      why: >-
        A browser at the Console has no workstation; LoginRequest makes it required for every login. Make it optional
        for web surfaces or define what a web door sends.
      source: contracts/spine/identity.yaml#/components/schemas/LoginRequest
      status: fixed
      by: CHG-WIR-021
    - what: startSsoAuthorization and completeSsoAuthorization exist but are not declared on any staff door.
      why: listSsoProviders is declared and nothing uses the provider to sign in.
      source: contracts/spine/identity.yaml#startSsoAuthorization
      status: fixed
      by: CHG-WIR-021
    - what: emptyNoAccess names SESSION_FORCE_LOGOUT.
      why: A door has no no-access state; the person is not signed in.
      source: screens/P09-platform-admin-console.yaml#ADM-001
      status: fixed
      by: CHG-DOOR-003
    - what: >-
        Calls tenant-permission operations with no tenant picker and no platform-staff grant: forceLogout (SESSION_FORCE_LOGOUT),
        listActiveSessions (SESSION_FORCE_LOGOUT), revokeAllSessions (SESSION_FORCE_LOGOUT).
      why: >-
        The Console runs outside every cell; a platform token carries no tenant permission until a time-boxed grant
        is open, so these calls are refused 403 as drawn. Either add the R098 pattern (tenant picker, Open access
        grant with step-up, grant panel, grantRequired state, as on ADM-412) or the screen belongs in Venue Management
        (P08), where the tenant's own staff use it.
      source: >-
        R098; contracts/spine/identity.yaml#openPlatformStaffGrant; screens/P09-platform-admin-console.yaml#ADM-412
      status: fixed
      by: CHG-WIR-021
    - what: >-
        Tables show every schema field, plumbing included: 'Every active session' drop sessionId, principalId, roleId,
        workstationId, venueId; 'Every MFA method' drop id; 'Every SSO provider' drop id, scopePath.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P09-platform-admin-console.yaml#ADM-001
      status: fixed
      by: CHG-WIR-021
