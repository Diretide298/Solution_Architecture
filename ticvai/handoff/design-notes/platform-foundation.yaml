# Design notes for the platform-foundation process: identity, roles and security; tenancy, venues and devices;
# platform operations; subscription and licensing; approval workflows; developer portal and public API; digital
# asset management. AUTHORED from the screens, contracts, flows, meeting inputs, matrix rows, audit decisions and
# trackers, 1-2 October 2026. Read with each screen's generated block in its batch BUNDLE.md. Schema:
# handoff/design-notes/README.md.
process: platform-foundation
title: >-
  Platform Foundation (identity, roles and security; tenancy, venues and devices; platform operations; subscription
  and licensing; approval workflows; developer portal and public API; digital asset management)
owner: platform-foundation process agent (Claude), 1-2 October 2026
coverage: >-
  All 425 screens of the process TSV have a block. The 25 Block A screens (15 A, 10 A and B) and the five doors
  of the other apps (ADM-001, SUP-001, PTR-001, EMP-001, SCN-001) are written in full by hand. The 400 Block B screens
  each have a hand-written summary and hand-written corrections and rules where the screen needed them, plus entries
  derived by cross-checking every screen against its contracts (step-up, configuration scope, permission splits,
  refusal reasons, platform-staff grants, audience, money format, venue scoping) with the source named; every screen
  has sample data in the shared sample world (Marina Leisure Group, AquaCove venues in Abu Dhabi, Dubai and Muscat).
  No screen in the TSV is later than Block B in the 1 October plan.
processSummary:
  text: >-
    Platform Foundation is everything the apps stand on. Five apps each have one door: the guest app and website
    (WEB-016, GST-042: a six-digit code to email or mobile, a password, Apple or Google, UAE Pass; never enterprise
    SSO), the till (POS-000: employee number and PIN, recent operators as tiles; the kitchen display is the same
    app), the staff handheld and scanner (EMP-001, SCN-001), Venue Management (SUP-001, the single door for the
    back office P08, the CMS P13, analytics P16 and the support desk P12) and TICVAI Control (ADM-001 for TICVAI's
    own platform operators, PTR-001 for partner users; the developer portal P14 and the sign-up P17 belong to this
    app too). A second factor is required by permission, not by role or device: ROLE_MANAGE, LEDGER_APPROVE and
    every PLATFORM_* permission, plus any the tenant adds; so a cashier never sees it and a platform operator always
    does. The factor is an authenticator app with an emailed code as fallback; five wrong codes lock step-up for
    the lockout minutes, never permanently. Guests get two-step verification only at a venue that switched it on.
    One person holds one session per workstation: a second sign-in is refused and only a supervisor ends the other
    session. Several roles mean a role prompt; one role goes straight in. The workstation decides the Sale Board,
    hardware and till identity, never what a person may do. Sensitive actions (refund approval, journal approval,
    credential reset, partner credit, commission rules, opening a platform-staff grant and 17 more) demand a fresh
    step-up on the operation itself, asked in place in the action's confirmation; the tenant may raise the strength,
    never remove it. Permission outcomes are three, never one word: self-authorised (proceeds, audited), escalated
    (a supervisor PIN in place), refused (the denied state, naming the permission); a missing permission is never
    an empty table, and a record outside the person's venues is "not found", indistinguishable from absent. The
    hierarchy is binding (tenant, brand, region, venue, department, sub-department, workstation; outlet beside department
    for F&B and retail); region owns currency, decimals, time zone, date format and fiscal year; configuration resolves
    nearest-ancestor across tenant, region and venue (outlet for F&B and retail), venue is the floor and a workstation
    is assigned a profile, never configured; every configuration screen says which level it writes and what it inherits.
    Venue Management is one tenant-level surface filtering across the venues in the session's scope. TICVAI's Console
    runs outside every cell: a platform operator picks a tenant and opens a time-boxed, audited platform-staff grant
    (with step-up) before any tenant action, and the tenant sees every action in its audit log (ADM-412 is the reference
    implementation). Approval workflows record authorisations and never perform the action; the requester cannot
    approve their own request; a venue may tighten and never loosen a rule from above; in-flight requests keep the
    matrix version they were raised under; decisions are approve, reject (with a reason), return and request information.
    Subscription and licensing is TICVAI's own commercial business (plans, modules, limits, usage, invoices): upgrades
    take effect now with proration, downgrades at renewal, a first plan is active and renews one term from start,
    a suspended tenant may be amended and a terminated one may not; licence enforcement warns, requires an overage
    pack or refuses, and hard stop is off by default. Beware a vocabulary collision the TSV inherits: the P08 "Subscription
    & Licensing" screens BO-284 to BO-303 are the guest's membership and annual pass, and BO-594 to BO-614 are the
    tenant's go-live validation, not TICVAI subscription. The developer portal issues sandbox clients to verified
    developer organisations, production clients only from TICVAI after certification and an approved request with
    an IP allow-list; secrets are shown once. Partners never create products, prices or performances. The DAM is
    the tenant's asset library (brand assets PNG or SVG up to 2 MB); deleting is the only end of an asset's life,
    and archived or quarantined assets can be restored after review. Three systemic defects run through the package
    and are raised once per affected screen below: 234 screens' empty states promise a create action they do not
    have; 92 Console screens call tenant-permission operations without the tenant picker and grant; 32 Venue Management
    screens call operations gated by TICVAI-only permissions (PLATFORM_*, DEVELOPER_ADMIN); and 18 sign-up and 8
    partner-portal screens call operations their users can never call.
  source:
  - screens/P12-support-agent-console.yaml#SUP-001
  - R135
  - R126
  - R167
  - DI-1072
  - ADR-0002
  - ADR-0003
  - ADR-0004
  - R184
  - contracts/spine/identity.yaml#createMfaChallenge
  - contracts/spine/approvals.yaml#setStepUpPolicy
  - ADR-0011
  - ADR-0018
  - ADR-0029
  - R098
  - contracts/spine/approvals.yaml#decideApprovalRequest
  - contracts/spine/approvals.yaml#setApprovalMatrix
  - R129
  - R214
  - contracts/satellite/subscription.yaml#getLicenceEnforcement
  - DI-927
  - DI-930
  - R270
  - F104 step 1
  - F96 step 1
  - F36 step 5
vocabulary:
- term: Sign in / Sign out
  meaning: Entering and leaving any app, staff or guest.
  avoid:
  - Login
  - Log in
  - Logon
  - Logout
  source: screens/P04-point-of-sale.yaml#POS-000; screens/P12-support-agent-console.yaml#SUP-001
- term: Authentication code
  meaning: The staff second factor from the authenticator app (or the emailed fallback).
  avoid:
  - OTP
  - 2FA code
  - token
  source: screens/P09-platform-admin-console.yaml#ADM-001
- term: One-time code
  meaning: The six-digit code a guest receives to sign in or prove a contact.
  avoid:
  - OTP
  - PIN
  - password
  source: DI-1034; R167
- term: Two-step verification
  meaning: The guest's optional second factor, asked only at venues that switched it on.
  avoid:
  - MFA
  - 2FA
  source: DI-1072
- term: Tenant / Brand / Region / Venue / Department / Outlet
  meaning: >-
    The binding hierarchy levels; region owns currency and dates; outlet is F&B or retail inside a venue.
  avoid:
  - Client
  - Customer
  - Org (for tenant)
  - Site
  - Park
  - Property (for venue)
  - Area
  - Territory (for region)
  source: ADR-0011; ADR-0018
- term: Workstation (back office) / till (operator copy)
  meaning: A configured device; decides Sale Board, hardware and till identity, never authorisation.
  avoid:
  - Terminal
  - Station
  - POS (for the device)
  - till (for the Deposit Box)
  source: ADR-0002; R156
- term: Sale Board
  meaning: The configured front end a workstation loads (ticketing, F&B or retail).
  avoid:
  - Screen
  - Layout
  - Menu
  source: ADR-0003
- term: Role
  meaning: A named, fully configurable grouping of permissions; the seeded five are editable starting points.
  avoid:
  - Group
  - Profile
  source: R229
- term: Staff member / Partner user / Platform operator
  meaning: A tenant's staff principal; a partner's user; a TICVAI employee in the Console.
  avoid:
  - User (alone)
  - Account
  - Agent (for venue staff)
  source: F104 step 1; F104 step 4; F104 step 5
- term: Platform-staff grant
  meaning: The time-boxed, audited access a platform operator opens into one tenant before acting in it.
  avoid:
  - Impersonation
  - Support login
  source: R098
- term: Escalate / Refused
  meaning: >-
    Escalate is supervisor approval captured in place; Refused is the denied state that names the permission.
  avoid:
  - Denied (for an action that can be escalated)
  source: R197
- term: Approve / Reject / Return / Request information
  meaning: >-
    The four decisions on an approval request; Withdraw is the requester's own act and never a rejection.
  avoid:
  - Accept
  - Decline
  - Cancel (for withdraw)
  source: >-
    contracts/spine/approvals.yaml#decideApprovalRequest; contracts/spine/approvals.yaml#withdrawApprovalRequest
- term: Subscription / Plan / Module / Licence
  meaning: TICVAI's commercial relationship with a tenant, its plan, the modules it licenses and the limits.
  avoid:
  - Membership (that is the guest's pass)
  source: R214
- term: Membership / Annual pass
  meaning: A guest's pass product and its holder (BO-284 to BO-303).
  avoid:
  - Subscription (that is the tenant's TICVAI plan)
  source: screens/P08-venue-back-office.yaml#BO-284
- term: Sandbox client / Production client
  meaning: A developer's own test credential; a TICVAI-issued live credential after certification.
  avoid:
  - Test key
  - Live key
  - API key (without environment)
  source: DI-927
- term: Asset (DAM) / Media (ticket)
  meaning: >-
    A digital file in the library; ticket media is a wristband or card carrying entitlements. Never mix them.
  avoid:
  - Media (for a library asset)
  source: contracts/satellite/assets.yaml#searchMedia; contracts/spine/orders.yaml#appendEntitlementToMedia
screens:
  WEB-016:
    block: A
    summary: >-
      The guest website's only door: one screen behind the header's profile icon with Sign in and Create account
      tabs, offering a six-digit code to email or mobile, a password, Apple or Google, and UAE Pass. It is reached
      from the header and from checkout (after Add-ons by default, or at payment), and must return the guest to
      exactly where they were with the basket intact. The one thing to get right: nothing on it may reveal whether
      an account exists, and nothing staff-side (SSO, roles, workstation) appears.
    inputs:
    - field: Email or mobile number
      rule: >-
        One field accepts either; a value starting with + or a digit is a mobile in E.164 (the UAE prefix +971 prefilled
        for a local number), anything with @ is an email. The channel is derived, not asked: email for an address;
        for a mobile, WhatsApp or SMS as the tenant configured, with a "Send by SMS instead" link when both are
        on. At least one of email or mobile is mandatory, never both.
      source: contracts/spine/identity.yaml#requestGuestOtp; DI-209; DI-372
    - field: Code
      rule: >-
        Exactly six digits, numeric keypad, paste and SMS autofill accepted; the copy says six. The verify button
        enables at six digits. Wrong or expired code: one message, the attempts left, and Send a new code (the limit
        is VenueSettings.identity.guestOtpMaxAttempts).
      source: DI-1034; contracts/spine/identity.yaml#verifyGuestOtp
    - field: Password
      rule: >-
        Minimum 8 characters with show/hide. Offered as an alternative to the code, never required: accounts are
        code-only by default and a password is optional at registration.
      source: contracts/spine/identity.yaml#guestPasswordLogin; contracts/spine/identity.yaml#registerGuest; R126
    - field: Create account
      rule: >-
        Asks only the identifier (email or mobile), an optional display name and optional password, the language
        (Arabic or English, preselected from the site) and the consent purposes with their notice version. After
        the code no further profile fields are asked: the profile is completed later.
      source: contracts/spine/identity.yaml#registerGuest; DI-1002; DI-588
    - field: venueId (sent, not shown)
      rule: >-
        The venue of the site or the booking in progress is sent with every sign-in call so identity can decide
        whether that venue's two-step verification applies. The guest never picks it here.
      source: contracts/spine/identity.yaml#verifyGuestOtp; R267; DI-1072
    outputs:
    - element: Header entry point
      rule: >-
        A single profile icon opens this screen on the Sign in tab; signed-in guests get their account menu from
        the same icon. Tabs read Sign in and Create account.
      source: DI-974
    - element: Checkout gate copy
      rule: >-
        Arriving from checkout with guest checkout off, the screen opens with "This venue requires an account for
        checkout. Your basket is kept." and no guest button. With guest checkout on, "Continue as guest" sits under
        the code option.
      source: DI-1034; DI-1043; REV3-3
    - element: Who is signed in on this device
      rule: >-
        Shown only when a guest session already exists on this browser: display name and masked contact, with Sign
        out so a shared device is handed over clean. Never shows the subject id or token expiry.
      source: screens/P01-guest-web-storefront.yaml#WEB-016
    actions:
    - action: Send me a code
      result: >-
        Always "We sent a code to f•••@gmail.com if an account can use it" style success, the same whether the identifier
        exists or not; resend is offered after 30 seconds; 429 says when to try again.
      source: contracts/spine/identity.yaml#requestGuestOtp
    - action: Sign in with the code / with password
      result: >-
        Success returns to the screen the guest came from with the cart claimed to the account (claimCart) and the
        browser's cookie decision attached (claimDeviceConsent). A password refusal is one message for wrong password,
        unknown account, no password and locked; locked or 429 adds "use a one-time code instead".
      source: >-
        contracts/spine/identity.yaml#guestPasswordLogin; contracts/spine/orders.yaml#claimCart; contracts/satellite/marketing-crm.yaml#claimDeviceConsent
    - action: Continue with Apple or Google / UAE Pass
      result: >-
        Hands off to the provider's own sheet or the UAE Pass redirect (mobile number, push approval, biometrics)
        and returns here to finish; UAE Pass arrives verified and pre-fills the guest's verified name. A provider
        email matching an existing account links to it rather than creating a duplicate.
      source: >-
        contracts/spine/identity.yaml#guestUaePassLogin; contracts/spine/identity.yaml#guestSocialLogin; DI-123
    - action: Verification code (two-step)
      result: >-
        Only when the returned session has requiresMfa: at a venue that switched guest two-step verification on,
        for a guest who enrolled. A guest who signed in with an emailed code is never offered email as the second
        factor. Never for UAE Pass.
      source: contracts/spine/identity.yaml#createMfaChallenge; DI-1072
    - action: Link an order I placed as a guest
      result: >-
        Asks the booking reference and the code from its confirmation; attaches it and every other guest-checkout
        order with the same verified contact, and says how many were attached. A contact mismatch is refused 403
        and worded as "this booking was made with a different email or mobile".
      source: contracts/spine/identity.yaml#linkGuestCheckout; F56 step 3
    edgeCases:
    - case: Session expired mid-booking
      expected: >-
        The guest lands here with the screen they came from kept and returns to it after signing in, basket intact.
      source: screens/P01-guest-web-storefront.yaml#WEB-016; ADR-0030
    - case: Registering an identifier that already has an account
      expected: >-
        The same "check your email/phone for a code" outcome as a new registration; the code then signs the guest
        into the existing account. Never "this email is already registered".
      source: contracts/spine/identity.yaml#registerGuest
    - case: Identity service unreachable
      expected: >-
        Says the service could not be reached and keeps what was typed; never says the code or password is wrong.
      source: screens/P01-guest-web-storefront.yaml#WEB-016
    - case: Offline
      expected: Not available; the offline banner says signing in needs a connection.
      source: screens/P01-guest-web-storefront.yaml#WEB-016
    consistency:
    - with: GST-042
      note: >-
        Same methods, same order, same wording and the same six-digit rule; the app is the same door in a different
        shell.
    - with: WEB-012
      note: >-
        The checkout gate and the guest-checkout code use this screen's code step, not a second implementation.
    sampleData:
      identifier: fatima.mansoori@gmail.com
      mobile: +971 50 412 7789
      maskedTarget: f•••@gmail.com
      code: '482913'
      displayName: Fatima Al Mansoori / فاطمة المنصوري
      linkOrder:
        orderReference: AQC-AUH-260930-0412
        verificationCode: 7Q4K2M
        attachedOrderCount: 3
    corrections:
    - what: >-
        requiresModule is 'ticketing' on the guest website's sign-in, while GST-042 (the same door) is 'core'.
      why: A tenant licensing F&B or retail without ticketing would lose web sign-in. The door is core.
      source: screens/P01-guest-web-storefront.yaml#WEB-016; screens/P02-guest-mobile-app.yaml#GST-042
    - what: >-
        Overlays formGuestSocialLogin, formGuestUaePassLogin and formRefreshToken collect idToken, code/redirectUri
        and refreshToken as if typed.
      why: >-
        Those come from the provider SDK, the UAE Pass redirect and the client's token store; no guest types them.
        The overlays should not exist (refreshToken is already noted as "not a button").
      source: screens/P01-guest-web-storefront.yaml#WEB-016; contracts/spine/identity.yaml#guestUaePassLogin
      status: fixed
      by: CHG-DOOR-006
    - what: verifyGuestOtp accepts a code of 4 to 10 characters while the agreed rule is exactly six digits.
      why: >-
        The screen copy says six; a contract that accepts 4 lets a shorter code through and the copy becomes wrong.
        Align the contract (minLength/maxLength 6, digits) or the decision.
      source: contracts/spine/identity.yaml#verifyGuestOtp; DI-1034
    - what: formRequestGuestOtp asks for `channel` as a field.
      why: >-
        The channel follows from the identifier and the tenant's configured delivery (WhatsApp/SMS/email); asking
        a guest to pick a channel is a question they cannot answer.
      source: contracts/spine/identity.yaml#requestGuestOtp; DI-209
    decisions:
    - question: DI-974 names the tabs "Log in" and "Register"; every other door in the package says Sign in. Which wording?
      decision: 'Drawn default accepted: Draw "Sign in" and "Create account" for consistency with every staff and guest door.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-099 | CHG-NOTE-005
      questionSource: DI-974; screens/P04-point-of-sale.yaml#POS-000
  GST-042:
    block: A
    summary: >-
      The guest app's door: the same four ways in as the website (six-digit code, password, Apple or Google, UAE
      Pass) and Create account, in a mobile shell. Reached at first launch, from checkout and when a session expires;
      it must put the guest back exactly where they were. Biometric unlock of an existing session is a device convenience,
      not a sign-in method, and enterprise SSO never appears.
    inputs:
    - field: Email or mobile number
      rule: >-
        Same rule as the web: one field, the channel derived from what was typed, WhatsApp or SMS for a mobile as
        the tenant configured; only the fields the venue configured for guest checkout are asked.
      source: contracts/spine/identity.yaml#requestGuestOtp; DI-1002; DI-209
    - field: Code
      rule: >-
        Exactly six digits; one-time-code autofill from SMS on both platforms; the button enables at six digits.
      source: DI-1034
    - field: deviceId (sent, not shown)
      rule: >-
        The app's install id is sent with every sign-in; a new sign-in on this device ends the previous session
        on it (one session per device, 30 days sliding).
      source: contracts/spine/identity.yaml#guestPasswordLogin; R126
    outputs:
    - element: Signed-in confirmation
      rule: >-
        After sign-in from checkout, return straight to the checkout step with the basket; after first launch, to
        Home. No "Welcome back" interstitial.
      source: DI-1043; designer default
    actions:
    - action: Continue with UAE Pass
      result: >-
        Opens the UAE Pass app (or its web flow when the app is absent) and returns via the redirect; the account
        arrives verified.
      source: contracts/spine/identity.yaml#guestUaePassLogin; DI-123
    - action: Sign out (shared device)
      result: Ends this device's session only; other devices stay signed in (they are managed on GST-073).
      source: contracts/spine/identity.yaml#guestLogout; screens/P02-guest-mobile-app.yaml#GST-073
    edgeCases:
    - case: The app opens at a venue that has guest two-step verification on, for an enrolled guest
      expected: After the first factor the verification-code step appears; at any other venue nothing is asked.
      source: DI-1072; contracts/spine/identity.yaml#createMfaChallenge
    - case: Too many password attempts
      expected: >-
        One message: try again later or use a one-time code instead; never says the account is locked by name.
      source: contracts/spine/identity.yaml#guestPasswordLogin
    consistency:
    - with: WEB-016
      note: Same methods, order, wording and refusal messages.
    - with: GST-073
      note: The methods linked here are the ones GST-073 lists under How you sign in.
    sampleData:
      identifier: +971 55 908 1123
      code: '730264'
      displayName: Omar Haddad / عمر حداد
      linkedProviders:
      - otp
      - apple
      - uaePass
    corrections:
    - what: >-
        The overlays formGuestSocialLogin, formGuestUaePassLogin and formRefreshToken ask for idToken, code, redirectUri
        and refreshToken.
      why: SDK and redirect values, not guest input; remove the overlays.
      source: screens/P02-guest-mobile-app.yaml#GST-042
      status: fixed
      by: CHG-DOOR-006
    - what: Contract accepts a 4 to 10 character code; agreed rule is six digits.
      why: Same misalignment as WEB-016.
      source: contracts/spine/identity.yaml#verifyGuestOtp; DI-1034
  GST-073:
    block: A
    summary: >-
      The guest's own security page in the app: how they sign in (linked methods and whether the contact is verified),
      the devices signed into the account with "sign a lost phone out", and two-step verification only when at least
      one venue of the tenant switched it on. It is the screen a guest reaches after losing a phone, so the lost-device
      action must be obvious and work from another device.
    inputs:
    - field: Set up two-step verification
      rule: >-
        Offered only when a venue of the tenant has guest two-step verification on. Kinds: an authenticator app,
        with an emailed code as fallback; the first code confirms it. The copy says the code will be asked only
        at venues that turned it on. A guest who signs in by email code is not offered email as the second factor.
      source: >-
        DI-1072; contracts/spine/identity.yaml#enrolMfaMethod; contracts/spine/identity.yaml#createMfaChallenge
    - field: Verify email
      rule: >-
        The recovery email must be verified before it can recover the account; the link lasts 24 hours and is sent
        by email.
      source: contracts/spine/identity.yaml#verifyGuestEmail; R126
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: registerGuestDevice, revokeGuestDevice:
        the guest's own setting, no scope selector. Nearest ancestor wins; a workstation is assigned a profile,
        never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/satellite/marketing-crm.yaml#registerGuestDevice
    outputs:
    - element: Devices signed in
      rule: >-
        One row per device: model, platform, app version, last active and "This device" on the current one. No token
        fingerprints, token refs or failure counts. Sorted with this device first, then by last active.
      source: contracts/satellite/marketing-crm.yaml#listGuestDevices; DI-1077
    - element: How you sign in
      rule: >-
        The linked methods as readable names (One-time code, Password, Apple, Google, UAE Pass) and a Verified badge
        on the contact; UAE Pass shows "verified identity".
      source: contracts/spine/identity.yaml#getGuestSession
    actions:
    - action: Sign out this device (lost device)
      result: >-
        Confirmation names the device ("Sign out iPhone 15 last used 28/09 in Abu Dhabi?"); the device's session
        and push token are revoked at once; tickets stay on the account.
      source: contracts/satellite/marketing-crm.yaml#revokeGuestDevice
    - action: Remove a two-step method
      result: >-
        Removing the last method turns two-step off for this guest; the confirmation says the venues that ask for
        it will then refuse step-up actions until a method is enrolled.
      source: contracts/spine/identity.yaml#removeMfaMethod; DI-1072
    edgeCases:
    - case: Offline
      expected: >-
        Nothing is offered offline and the banner says so; a device sign-out queued offline would leave the lost
        phone signed in.
      source: screens/P02-guest-mobile-app.yaml#GST-073
    - case: No venue of the tenant has two-step on
      expected: The two-step card is absent, not disabled.
      source: DI-1072
    - case: verifyGuestEmail answers 410
      expected: >-
        Show it as something the person can act on, not a failure: **The token expired or was already used.** Distinct
        from an invalid one — a guest who clicked an old link should be offered a new one rather than told they
        are wrong.
      source: contracts/spine/identity.yaml#verifyGuestEmail
    - case: enrolMfaMethod answers 403
      expected: >-
        Show it as something the person can act on, not a failure: A guest caller while no venue of the tenant has
        guest two-step verification on (rev 3 GAP-B1, per venue).
      source: contracts/spine/identity.yaml#enrolMfaMethod
    - case: enrolMfaMethod answers 422
      expected: >-
        Show it as something the person can act on, not a failure: A kind the caller may not enrol. Staff use `totp`,
        with `emailOtp` as the fallback (audit R126); a guest the same (rev 3 GAP-B1).
      source: contracts/spine/identity.yaml#enrolMfaMethod
    - case: removeMfaMethod answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Last remaining method of a principal who holds
        a permission that requires MFA (audit R135)
      source: contracts/spine/identity.yaml#removeMfaMethod
    consistency:
    - with: WEB-024
      note: The web account carries the same device list and sign-out-lost-device function (GAP-D1).
    - with: GST-042
      note: Methods listed here are the ones offered at sign-in.
    sampleData:
      devices:
      - model: iPhone 15
