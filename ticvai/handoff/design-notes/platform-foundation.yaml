  PTR-029:
    block: B
    summary: >-
      What a partner organisation may do (search, hold, book, cancel, view net rates, use credit), above individual
      user permissions. Saving requires a second factor.
    actions:
    - action: Save partner capability grants
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends setPartnerCapabilityGrants with its single-use
        stepUpToken. Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the
        policy's lockout minutes and the screen says when it lifts. Why the control exists: Sets what a partner
        organisation may do, including refunds and price overrides.
      source: >-
        contracts/satellite/subscription.yaml#setPartnerCapabilityGrants; R126; contracts/spine/identity.yaml#createMfaChallenge
    edgeCases:
    - case: Can read but not change (holds PLATFORM_TENANT_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PARTNER_MANAGE
        for Save partner capability grants. Where the person would reasonably expect the action, it shows disabled
        with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/subscription.yaml#setPartnerCapabilityGrants
    - case: setPartnerCapabilityGrants answers 409
      expected: >-
        Show it as something the person can act on, not a failure: useCredit granted while the partner's credit
        is not enabled
      source: contracts/satellite/subscription.yaml#setPartnerCapabilityGrants
    - case: setPartnerCapabilityGrants answers 422
      expected: >-
        Show it as something the person can act on, not a failure: A time-limited grant with no end date, or an
        eventSpecific grant with no event
      source: contracts/satellite/subscription.yaml#setPartnerCapabilityGrants
    sampleData:
