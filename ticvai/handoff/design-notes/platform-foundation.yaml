    - what: >-
        Credit operations (getB2bCredit, setB2bCreditLimit, overrideCreditLimit) and partner agreements are on the
        sign-in screen, and emptyNoAccess names ORDER_VIEW.
      why: >-
        A door shows none of that; credit belongs to the partner's credit screen (and setting or overriding a limit
        is the tenant's act, not the partner's).
