    summary: >-
      Onboarding: create the customer's tenant and its top organisation units (brand, region). Region choice decides
      currency and cell placement.
    sampleData:
      tenant: Marina Leisure Group
      brand: AquaCove Waterparks
      regions:
      - UAE (AED)
      - Oman (OMR)
    corrections:
    - what: Only createOrgUnit; the tenant itself is created by createTenant.
      why: The purpose is tenant provisioning.
      source: contracts/satellite/subscription.yaml#createTenant
      status: fixed
      by: CHG-WIR-021
  ADM-421:
    block: B
    summary: >-
      Onboarding: create the first venues of a tenant from the onboarding answers, under a platform-staff grant.
    inputs:
    - field: Open access grant (permissions, reason, expiry)
      rule: >-
        Permissions preselected to exactly what this screen's tenant calls need (TENANT_CONFIGURE, USER_MANAGE),
        never PLATFORM_* (those ride on the platform token); reason required and shown to the tenant; expiry at
        most 8 hours ahead (proposed). The tenant must be picked first.
      source: R098; contracts/spine/identity.yaml#openPlatformStaffGrant
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setPasswordPolicy: tenant-wide only,
        no region or venue override is offered. Nearest ancestor wins; a workstation is assigned a profile, never
        configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/identity.yaml#setPasswordPolicy
    actions:
    - action: Open access grant
      result: >-
        Confirmation names the consequence first, then asks for the authentication code (authenticator app, or an
        emailed code as fallback); only a verified challenge sends openPlatformStaffGrant with its single-use stepUpToken.
        Wrong code: the action is not sent and nothing changes; five wrong codes lock step-up for the policy's lockout
        minutes and the screen says when it lifts. Why the control exists: Opens a platform operator's access into
        a tenant's data.
      source: >-
        contracts/spine/identity.yaml#openPlatformStaffGrant; R126; contracts/spine/identity.yaml#createMfaChallenge
    edgeCases:
    - case: The platform-staff grant expires while the operator is mid-edit
      expected: >-
        Every tenant action disables at once, the grantRequired state returns with Open access grant, and anything
        typed is kept so it can be sent after a new grant; the countdown in the grant panel warns before expiry.
      source: R098; screens/P09-platform-admin-console.yaml#ADM-412
    - case: Can read but not change (holds PLATFORM_TENANT_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PLATFORM_TENANT_ACCESS
        for Open access grant; USER_MANAGE for createPrincipal; TENANT_CONFIGURE for setPasswordPolicy. Where the
        person would reasonably expect the action, it shows disabled with the permission named. The server refuses
        with 403 forbidden regardless.
      source: contracts/spine/identity.yaml#openPlatformStaffGrant
    - case: createPrincipal answers 409
      expected: 'Show it as something the person can act on, not a failure: Username already in use within this
        cell'
      source: contracts/spine/identity.yaml#createPrincipal
    consistency:
    - with: ADM-412
      note: >-
        Same tenant picker, grant panel and grantRequired state on every P09 screen that acts in a tenant (R098).
    sampleData:
      venue:
        name: AquaCove Muscat
        type: Waterpark
        timeZone: Asia/Muscat
