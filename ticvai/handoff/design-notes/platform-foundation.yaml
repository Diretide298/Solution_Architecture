  ADM-022:
    block: B
    summary: >-
      Releases of the platform: their components, migrations, breaking changes and readiness; create, promote to
      staging and production, reject or withdraw. Promotion shows readiness first.
    inputs:
    - field: stepUpToken
      rule: >-
        Never a visible field. It is what verifyMfaChallenge returns after the in-place challenge, short-lived and
        single-purpose; the form shows the challenge step, not a token box.
      source: contracts/spine/identity.yaml#verifyMfaChallenge
    outputs:
    - element: Money columns (cellsTotal)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure. Across
        tenants or regions figures in different currencies are never summed into one total; group by currency, or
        label the converted figure with its rate and time.
      source: ADR-0008; ADR-0011; DI-306
    actions:
    - action: Promote release
      result: Shows readiness checks; blocked names what fails; production promotion needs the promote permission.
      source: contracts/satellite/platform-ops.yaml#promoteRelease
    - action: Promote release
      result: >-
        Separate from Save. The publish gate names what goes live, where and from when before it happens; blocked
        names what is wrong and how to fix it; an override past a warning is recorded with who authorised it.
      source: screens/_components.yaml#publishGate; contracts/satellite/platform-ops.yaml#promoteRelease
    edgeCases:
    - case: Can read but not change (holds PLATFORM_RELEASE_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PLATFORM_RELEASE_MANAGE
        for Create release, Withdraw release; PLATFORM_RELEASE_PROMOTE for Promote release, Reject release. Where
        the person would reasonably expect the action, it shows disabled with the permission named. The server refuses
        with 403 forbidden regardless.
      source: contracts/satellite/platform-ops.yaml#createRelease
    - case: promoteRelease answers 403
      expected: >-
        Show it as something the person can act on, not a failure: Approver is the requester, or the step-up token
        is absent or expired
      source: contracts/satellite/platform-ops.yaml#promoteRelease
    - case: promoteRelease answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Environment skipped, prior environment unhealthy,
        or the release has unapplied migrations in the target.
      source: contracts/satellite/platform-ops.yaml#promoteRelease
    - case: rejectRelease answers 409
