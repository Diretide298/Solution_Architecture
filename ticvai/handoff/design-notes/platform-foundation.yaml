        Nearest ancestor wins; a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/tenancy.yaml#setVenueSettings
    outputs:
    - element: Merchandise list
      rule: >-
        SKU, name, price with currency, on hand, returnable and return window; filter by outlet and category; in-stock-only
        toggle.
      source: contracts/satellite/retail.yaml#listMerchandise
    - element: Money columns (price)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure.
      source: ADR-0008; ADR-0011; DI-306
    edgeCases:
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    - case: Can read but not change (holds PRODUCT_VIEW, SCOPE_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: PRODUCT_CONFIGURE
        for Save merchandise; ROLE_MANAGE for Save role permissions; TENANT_CONFIGURE for Save venue settings; WORKSTATION_CONFIGURE
        for Save sale board. Where the person would reasonably expect the action, it shows disabled with the permission
        named. The server refuses with 403 forbidden regardless.
      source: contracts/satellite/retail.yaml#updateMerchandise
    - case: updateMerchandise answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The new barcode is already in use in this venue.
        `refusedReason` is `barcodeInUse`.
      source: contracts/satellite/retail.yaml#updateMerchandise
    - case: setRolePermissions answers 409
      expected: >-
        Show it as something the person can act on, not a failure: **Breaches a segregation rule.** Names the rule
        and both permissions.
      source: contracts/spine/tenancy.yaml#setRolePermissions
    - case: setVenueSettings answers 422
      expected: >-
        Show it as something the person can act on, not a failure: **An enable the venue cannot evidence.** Biometrics
        switched on without a DPIA reference and a consent-notice acknowledgement, or device-assisted gender verification
        where no device in the venue reports `genderClassification`. `errors[]` names each missing field or the
        missing capability.
      source: contracts/spine/tenancy.yaml#setVenueSettings
    consistency:
    - with: BO-125
      note: Product & Category Button Configuration places the same items on the board; one board editor.
    - with: BO-124
      note: The sale board itself is defined there.
    sampleData:
      merchandise:
      - sku: WS-TOWEL-01
        name: AquaCove beach towel
        price: AED 89.00
        onHand: 140
        returnable: true
        returnWindowDays: 14
      - sku: WS-GOGG-02
        name: Kids swim goggles
        price: AED 35.00
        onHand: 12
        returnable: false
    corrections:
    - what: >-
        Save role permissions (setRolePermissions) and Save venue settings (setVenueSettings) are actions on a merchandising
        screen.
      why: Unrelated configuration attached by board position; remove both.
      source: screens/P08-venue-back-office.yaml#BO-116
      status: fixed
      by: CHG-WIR-021
    - what: Pattern commandCentre with tiles counting merchandise, sale boards and workstations.
      why: The job is arranging products on a board; a count of workstations says nothing here.
      source: screens/P08-venue-back-office.yaml#BO-116
      status: fixed
      by: CHG-WIR-023
    - what: formUpdateSaleBoard asks the person for id.
      why: >-
        Status and timestamps are the server's; an id is a client UUIDv7 generated silently. A form that asks for
        them invites nonsense values. Keep them out of the form.
      source: screens/P08-venue-back-office.yaml#BO-116
      status: fixed
      by: CHG-SBO-004
    - what: >-
        Tables show every schema field, plumbing included: 'Every merchandise' drop id, outletId, categoryId, variantId,
        inventoryItemId.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P08-venue-back-office.yaml#BO-116
      status: fixed
      by: CHG-SBO-004
