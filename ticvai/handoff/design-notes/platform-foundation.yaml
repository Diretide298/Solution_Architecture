  BO-084:
    block: A
    summary: >-
      The approver's queue in Venue Management: everything waiting on this person (and, toggled, what they raised),
      sorted by what breaches its SLA soonest, with the decision taken in place. Empty is the good outcome. The
      one thing to get right: a decision that needs a second factor or a signature asks for it in the decision dialog,
      and the screen never implies the approval performs the action.
    inputs:
    - field: Filters
      rule: >-
        Assigned to me on by default; Raised by me as the other tab. Kind and status are pick-lists of the approval
        kinds and statuses, never free text; Breaching within (minutes) as quick chips 15 / 60 / today.
      source: contracts/spine/approvals.yaml#listApprovalRequests
    - field: Decision comment and reason
      rule: >-
        Reason required on reject (500 characters), comment optional on approve (1000) and encouraged: six months
        later it is the only record of why the exception was allowed.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - field: stepUpToken
      rule: >-
        Never a visible field. It is what verifyMfaChallenge returns after the in-place challenge, short-lived and
        single-purpose; the form shows the challenge step, not a token box.
      source: contracts/spine/identity.yaml#verifyMfaChallenge
    outputs:
    - element: Queue rows
      rule: >-
        Kind as words (Refund above threshold), the subject summary, amount with currency, requester name, venue,
        raised time and SLA remaining; overdue rows red and on top. AI risk band and priority shown as context only,
        never as an approve/reject suggestion.
      source: >-
        contracts/spine/approvals.yaml#listApprovalRequests; contracts/satellite/ai.yaml#getApprovalRequestScore
    - element: Money columns (amount)
      rule: >-
        Money in the region's currency and scale, never a bare number: AED to 2 decimals, OMR/BHD/KWD to 3, the
        third decimal never rounded away (2.013 stays 2.013); the currency code is shown with the figure.
      source: ADR-0008; ADR-0011; DI-306
    actions:
    - action: Escalate
      result: Adds an approver above; the original stays in the chain. Requires a reason.
      source: contracts/spine/approvals.yaml#escalateApprovalRequest
    - action: Decide (Approve / Reject / Return / Request information)
      result: >-
        Four outcomes, not two: reject needs a reason the requester reads; return sends it back to amend; request
        information pauses the SLA clock. Approving records an authorisation and does not perform the action; on
        a multi-level chain the request moves to the next level. Where the rule demands MFA the decision carries
        a stepUpToken from the in-place challenge; where it demands a signature, the signature step comes first.
      source: contracts/spine/approvals.yaml#decideApprovalRequest; F14 step 4
    edgeCases:
    - case: The request was decided by someone else while open on screen
      expected: The decision is refused 409 alreadyDecided; the row updates to who decided and how, nothing is lost.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    - case: Can read but not change (holds APPROVAL_VIEW only)
      expected: >-
        Everything reads; the actions needing another permission are not offered as live buttons: APPROVAL_DECIDE
        for Decide approval request; APPROVAL_REQUEST for Escalate approval request. Where the person would reasonably
        expect the action, it shows disabled with the permission named. The server refuses with 403 forbidden regardless.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: decideApprovalRequest answers 403
      expected: >-
        Show it as something the person can act on, not a failure: The approver may not decide this request. **Always
        carries `refusedReason`**, one value per cause — the approver is the requester (`approverIsRequester`),
        is not in the resolved chain (`notInApproverChain`), lacks the permission the rule demands (`insufficientPermission`),
        gave no step-up token where the rule requires MFA (`mfaR...
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: decideApprovalRequest answers 409
      expected: >-
        Show it as something the person can act on, not a failure: The request is no longer open for a decision.
        `refusedReason` says which: `alreadyDecided` (approved or rejected), `withdrawn`, `expired` or `cancelled`,
        and `currentStatus` carries the status it is in.
      source: contracts/spine/approvals.yaml#decideApprovalRequest
    - case: The approver raised the request, or sits outside the resolved chain
      expected: >-
        Decide is refused 403 with refusedReason (approverIsRequester, notInApproverChain, missing permission or
        step-up); show the reason in words and who can decide instead. Segregation of duties survives delegation.
      source: >-
        contracts/spine/approvals.yaml#decideApprovalRequest; contracts/spine/approvals.yaml#createApprovalDelegation
    consistency:
    - with: BO-085
      note: Same decision dialog; BO-085 is the single request opened from a row or a deep link.
    - with: BO-365
      note: The workshop board's My Approval Inbox is the same queue; it must not be a second implementation.
    - with: POS-005
      note: >-
        A discount raised at the till appears here with the guest waiting (F14 step 3); the till learns the outcome
        on its own device.
    sampleData:
      rows:
      - kind: Refund above threshold
        summary: Refund 4 tickets, order AQC-AUH-260930-0412
        amount: AED 1,180.00
        requester: Rahul Menon
        venue: AquaCove Abu Dhabi
        slaRemaining: 12 min
      - kind: Discount override
        summary: 25% group discount, Desert Gate Tours
        amount: AED 3,400.00
        requester: Mariam Saeed
        venue: AquaCove Dubai
        slaRemaining: 2 h 40 min
      - kind: Purchase order
        summary: Compressor for wave machine 2
        amount: AED 18,200.00
        requester: Joseph D'Souza
        venue: AquaCove Abu Dhabi
        slaRemaining: Breached 25 min ago
    corrections:
    - what: >-
        Table columns include rerouteOnNoApprover, outOfOfficeDelegateId, allowEmailApproval, reopenedFrom, subjectContract,
        subjectType, scopePath.
      why: >-
        Routing configuration and plumbing; the approver needs what, how much, who, where and how long is left.
      source: screens/P08-venue-back-office.yaml#BO-084
      status: fixed
      by: CHG-SBO-011
    - what: Status and kind filters are free text fields.
      why: Both are enumerations; free text produces filters that match nothing.
      source: contracts/spine/approvals.yaml#listApprovalRequests
      status: fixed
      by: CHG-SBO-011
    - what: >-
        Tables show every schema field, plumbing included: 'Waiting for a decision' drop id, outOfOfficeDelegateId,
        reopenedFrom, subjectContract, subjectType, subjectId, scopePath.
      why: >-
        Identifiers and partition keys mean nothing to the reader; show the name each id points at (principal name,
        venue name, role name) and keep raw ids for the detail panel's copy action. The package itself says narrowing
        the columns is still owed.
      source: screens/P08-venue-back-office.yaml#BO-084
      status: fixed
      by: CHG-SBO-004
    - what: >-
        emptyFirstRun says it 'carries the create action', and the screen declares no operation that creates anything.
      why: >-
        A copy of the pattern's default text. The empty state must say what empty means here (for a queue or monitor:
        nothing waiting, which is good news) and offer the action that exists, or none.
      source: screens/P08-venue-back-office.yaml#BO-084; screens/_components.yaml#contentSpec.emptyStates
      status: fixed
      by: CHG-SBO-002
