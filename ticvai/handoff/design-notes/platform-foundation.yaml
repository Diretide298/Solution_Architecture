  BO-639:
    block: B
    summary: Who reviews accreditation applications, by category and level, with delegation.
    inputs:
    - field: Scope this applies at
      rule: >-
        Not a free choice; each write has one level and the selector says it: setApprovalMatrix: set for the venue
        chosen in the venue filter, showing beside each value the tenant or region value it overrides. Nearest ancestor
        wins; a workstation is assigned a profile, never configured.
      source: >-
        ADR-0018; ADR-0029; screens/_patterns.yaml#configEditor; contracts/spine/approvals.yaml#setApprovalMatrix
    - field: Approval matrix rules
      rule: >-
        Ordered; the first matching rule wins. A venue may tighten and never loosen a rule from above: a higher
        threshold, fewer approvers or a different approver role are each loosening and refused 409 loosensParentRule.
        Saving creates a new version; requests in flight keep the version they were raised under.
      source: contracts/spine/approvals.yaml#setApprovalMatrix; R129; R183
    edgeCases:
    - case: A person whose grants cover only some venues, or a link to a record in another venue
      expected: >-
        The venue filter lists only venues in the session's scope (Session.scope, resolved at sign-in); a record
        outside it renders Not found, deliberately indistinguishable from absent, never a 'you may not see venue
        X' message.
      source: >-
        ADR-0011; contracts/shared/common.yaml#/components/schemas/Problem; contracts/spine/identity.yaml#getCurrentSession
    - case: setApprovalMatrix answers 409
      expected: >-
        Show it as something the person can act on, not a failure: Refused, and nothing is stored. `refusedReason`
        says which: `loosensParentRule` — the matrix would loosen a rule set at a higher scope (a higher threshold,
        fewer approvers or a different approver role; audit R129); or `unreachableRule` — a rule can never match
        because an earlier one always does. `ruleOrder` names the offending r...
      source: contracts/spine/approvals.yaml#setApprovalMatrix
    sampleData:
      category: Media
      level1: Accreditation officer
      level2: Head of security
      delegate: Omar Haddad until 15/10/2026
