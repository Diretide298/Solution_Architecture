process: customer-marketing
title: Customer & Marketing (CRM, guest profiles, consent, segments, campaigns, journeys, loyalty, gamification, cases, voice of customer, waivers)
owner: customer-marketing process agent, 1 October 2026
processSummary: >-
  Customer & marketing is how a venue knows its guests and talks to them. There is ONE guest profile per
  person across ticketing, F&B and retail, so a guest who books online and later dines is the same profile
  (DI-339). A profile needs at least an email or a mobile, never neither (DI-372). Profiles are created by
  registration, by guest checkout, or by staff at a till or desk. Repeat guest checkouts with the same
  verified email or phone attach to the same profile automatically (DI-941, R120 default). Two records that
  might be the same person are NEVER merged automatically: the guest is asked to confirm, and an admin review
  queue runs alongside (DI-377). Each candidate shows why it matched; the record that loses is superseded,
  not deleted; consent takes the narrower of the two positions (DI-808).
  Around the profile sit three things that must never be confused. CONSENT is what the law allows: per
  purpose and per channel, append-only, with the notice version and the source (recordConsent). It is
  Given, Withdrawn or Not asked. A SUBSCRIPTION is what the guest asked to receive, e.g. a newsletter list
  (MarketingSubscription). A PREFERENCE is what they like: table, dietary, accessibility
  (updateGuestPreferences). An anonymous visitor's cookie decision is recorded against a device key
  (recordDeviceConsent) and attaches to the guest when they sign in (claimDeviceConsent). Marketing consent
  at GUEST CHECKOUT is an open client question, and the design follows its default: an unticked opt-in
  beside the terms, one per channel and purpose. It is recorded with source "checkout" against the order
  and the verified contact, and nothing is sent without it. Whether that is sufficient consent under PDPL
  is the client DPO's call (M18-15 (audit R-M18-15), DI-954, DI-940).
  Marketing reads profiles through SEGMENTS (rules, evaluated when used) and static LISTS (imported).
  It reaches guests by CAMPAIGNS (one send to an audience) and JOURNEYS (automations started by an event,
  with waits and branches). Journeys may offer only pre-configured offers, never a free-typed discount
  (MoM 2026-08-20 4.6). Everything goes through ONE communications module that every other module uses
  (MoM 2026-08-31 4.6). Consent and suppression are applied at send time, and the number excluded, with
  the reasons, is reported before anything goes out (launchCampaign). Transactional messages (tickets,
  receipts, queue calls, case replies) do not need marketing consent and must never carry marketing.
  LOYALTY pays for spend: points, tiers, rewards and expiry. GAMIFICATION pays for behaviour: challenges,
  badges, streaks, referrals and leaderboards (createChallenge). A guest reads their own loyalty position
  (getLoyaltyPosition). A till, the back office or support reads a named guest's (getGuestLoyalty, or
  identifyGuest at a till). SERVICE: one Case object covers lost property, complaints, questions,
  accessibility and refund requests (CaseKind). A guest raises one with raiseMyCase, which needs the
  connection (R148). Staff work cases with an SLA in the Support Console (P12) and the back office; the
  SLA clock pauses only while the case is awaiting the guest (F05). Chat CONVERSATIONS start with the AI
  assistant and hand over to a person (DI-256). VOICE OF CUSTOMER: reviews and surveys trigger at
  configured events, and a low rating can open a case (submitReview). PRIVACY: data requests (access,
  export, correction, erasure) run on a legal clock (exportSubjectData, deleteGuestAccount). Retention is
  configurable per tenant and venue, with defaults (DI-380). WAIVERS are versioned signed forms, and a
  missing waiver can block download, activation, check-in or entry (DI-574).
  Apps taking part: Guest Web P01 and Guest App P02 (self-service: profile, consent, newsletters,
  wishlist, loyalty, cases, feedback, notifications, privacy). POS P04 (Guest Lookup at the till). Kiosk
  P05 and Staff App P06 (assist, lost & found, guest profile at the table). Venue Management P08 (CRM,
  segments, campaigns, journeys, communications, omnichannel inbox, cases, VOC, gamification, waivers).
  Platform Console P09 (the communication service: providers, sender domains, system templates,
  enforcement). Partner Portal P10 (support, notifications). Support Console P12 (agents and
  supervisors). CMS P13 (privacy and consent configuration, cookie registry and banner, policies, SEO,
  waivers). Arabic with right-to-left layout is core everywhere, including emails, SMS, WhatsApp and
  notifications (DI-019). RBAC is edit/view, view-only or hidden, per role and per module, with
  sub-permissions (DI-387).
  Sources: DI-339, DI-372, DI-941, R120, DI-377, DI-808, M18-15 (audit R-M18-15), DI-954, DI-940, DI-378, MoM 2026-08-20 4.1-4.10, MoM 2026-08-31 4.1-4.2, 4.6, 4.9, MoM 2026-09-18 4.8, R148, R149, F05, DI-256, DI-380, DI-574, DI-019, DI-387, contracts/satellite/marketing-crm.yaml#recordConsent, contracts/satellite/marketing-crm.yaml#launchCampaign, contracts/satellite/marketing-crm.yaml#/components/schemas/MarketingSubscription
vocabulary:
  - term: Guest
    meaning: The person the venue serves, signed in or not. In body copy on every surface.
    avoid: [Customer, User, Subject, Contact, Patron]
    note: Client board titles that already say "Customer" (Customer 360, Customer Service Command Center) keep their titles; the copy inside says guest.
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/GuestProfile
  - term: Guest profile
    meaning: The CRM record of one person (details, consent, preferences, history). Distinct from the Account, which is how a guest signs in.
    avoid: [Customer record, Contact, Subject]
    source: contracts/satellite/marketing-crm.yaml#getGuestProfile
  - term: Consent - Given / Withdrawn / Not asked
    meaning: What the law allows, per purpose (marketing, personalisation, profiling, third-party sharing, AI processing, transactional) and per channel. "Not asked" is not "Withdrawn" and must look different.
    avoid: [Opted in/out as a status, Accepted, Declined, Revoked, Unsubscribed (that is a subscription)]
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentDecision
  - term: Subscription
    meaning: A list the guest asked to receive (a newsletter, event news), per channel. Unsubscribing from a list is not withdrawing consent.
    avoid: [Consent, Opt-in]
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/MarketingSubscription
  - term: Preferences
    meaning: What the guest likes or needs (seating, drinks, dietary, accessibility, contact channel). Never grants permission.
    avoid: [Consents, Settings]
    source: contracts/satellite/marketing-crm.yaml#updateGuestPreferences
  - term: Send me offers and news
    meaning: The marketing opt-in label beside the terms at checkout, unticked, one per channel and purpose.
    avoid: [I agree to marketing, Pre-ticked boxes, Keep me updated ticked by default]
    source: DI-954
  - term: Points / Tier / Points to next tier / Expiring points
    meaning: The loyalty position. Points are a liability earned per programme; tiers are ranked (Bronze, Silver, Gold, Platinum in the meetings).
    avoid: [Credits, Coins, Balance alone (wallet money is "credit"), Level]
    source: DI-382
  - term: Pending points
    meaning: Points earned on a purchase still inside its refund window; shown apart from spendable points.
    avoid: [Available points for pending ones]
    source: contracts/satellite/marketing-crm.yaml#getLoyaltyPosition
  - term: Reward
    meaning: What points can be turned into (rewards catalogue).
    avoid: [Prize (games redemption uses prize), Voucher unless it is one]
    source: contracts/satellite/marketing-crm.yaml#listRewards
  - term: Challenge / Badge / Streak / Referral
    meaning: Gamification - rewards for behaviour, not spend. Status badges such as Explorer, Adventurer, Legend.
    avoid: [Mission and Quest used interchangeably on one screen, Loyalty tier for a badge]
    source: DI-392
  - term: Case
    meaning: One service record - lost property, complaint, question, accessibility, refund request or other - with a number (venue prefix plus sequence), a status and an SLA.
    avoid: [Ticket (a ticket is an admission product), Issue, Incident (that is maintenance and safety)]
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/CaseKind
  - term: Reply to guest / Internal note
    meaning: The two kinds of case message. The agent always chooses one explicitly; there is no default.
    avoid: [Comment, Message (ambiguous)]
    source: F05 step 2
  - term: Conversation
    meaning: A live chat session (web chat, in-app, WhatsApp, SMS, email, kiosk, voice). With the assistant, then queued, then with an agent. It is not a case.
    avoid: [Ticket, Case (until one is raised from it)]
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/ConversationState
  - term: Segment / List / Audience
    meaning: A segment is rules evaluated when used. A list is static, imported or hand-picked. The audience is what a campaign or journey targets.
    avoid: [Group, Cohort, Target list for a segment]
    source: DI-381
  - term: Campaign / Journey
    meaning: A campaign is one send (one-off, scheduled, triggered or recurring) to an audience. A journey is an automation started by an event, with steps, waits and branches.
    avoid: [Flow (booking flows use it), Automation for a one-off send, Blast]
    source: R146
  - term: Offer
    meaning: A pre-configured, system-validated discount or benefit that a campaign or journey references. It is never typed into the builder.
    avoid: [Discount field, Coupon (unless the offer is a coupon code)]
    source: MoM 2026-08-20 4.6
  - term: Reachable
    meaning: How many guests in an audience can actually be sent to on a channel after consent and suppression. Always shown beside the matching count.
    avoid: [Audience size alone]
    source: contracts/satellite/marketing-crm.yaml#previewSegment
  - term: Possible duplicate / Merge
    meaning: Two profiles that may be one person. Never called "Duplicate" as a verdict. Merging needs confirmation and stays reversible for 30 days.
    avoid: [Duplicate (as a status), Combine, Auto-merge]
    source: DI-808
  - term: Data request
    meaning: A guest's privacy request - a copy of my data, a correction, erasure, a restriction - with a legal clock. Statuses submitted, in progress, completed.
    avoid: [DSAR on guest screens, Subject data, Ticket]
    source: DI-379
  - term: Waiver / Consent question
    meaning: A waiver is a signed, versioned form. A consent question ("Are you able to swim?", "I accept the risk") is a single question asked per person or per booking and recorded as consent.
    avoid: [Contract, Disclaimer, Form for a waiver in guest copy]
    source: DI-1062
  - term: Lost item / Found item / Possible match
    meaning: The two directions of lost property and the suggested pairing between them.
    avoid: [Lost case, Claim before it is claimed]
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem
  - term: Wishlist
    meaning: Products and dates a guest saved to buy later, including F&B and retail to buy on site.
    avoid: [Favourites (used for transport routes), Saved for later on one surface and Wishlist on another]
    source: DI-202
  - term: Notification / Message
    meaning: A notification is an item in the guest's in-app feed. A message is one send on a channel (email, SMS, WhatsApp, push, in-app).
    avoid: [Alert for marketing content, Inbox for the guest feed]
    source: contracts/satellite/marketing-crm.yaml#/components/schemas/GuestNotification
  - term: Template
    meaning: A reusable message body per channel and language with merge fields. Transactional and marketing templates are separate kinds.
    avoid: [Layout, Design]
    source: contracts/satellite/marketing-crm.yaml#createMessageTemplate
screens:

  WEB-009:
    summary: >-
      The guest's wishlist on the web: products, and specific dates, saved to book later, including F&B and
      retail items to buy on site. It is built as one implementation with WEB-024 (account) and keeps both ids.
      The one thing to get right: nothing silently disappears. A withdrawn product stays on the list marked
      as no longer available, because a guest who finds a saved item gone assumes the feature is broken.
    inputs:
      - field: Saving an item (heart on a product or date card)
        rule: >-
          Saving happens on the product and date screens (WEB-005, WEB-006), not by typing on this screen.
          The entry key is the variant plus the performance. The same product for two different dates is two
          entries; a save with no date is a third, date-less entry for the product generally. Saving twice is
          one entry, so a double tap never inflates the count.
        source: contracts/satellite/marketing-crm.yaml#addToWishlist; R149
      - field: Note
        rule: >-
          Optional free text the guest keeps for themselves ("for Omar's birthday"). Shown under the item,
          editable only by removing and saving again (there is no update operation).
        source: contracts/satellite/marketing-crm.yaml#addToWishlist
    outputs:
      - element: Each saved item
        rule: >-
          Photo, product name, ticket type, the saved date and time or "Any date", and the current price
          from the catalogue in AED. Items whose product was withdrawn come back with isAvailable false: show
          them greyed with "No longer available" and offer only Remove, never Book.
        source: contracts/satellite/marketing-crm.yaml#getWishlist
      - element: Order of the list
        rule: >-
          Dated items soonest first, then "Any date" items, then unavailable items last. Group F&B and retail
          items to buy on site under their own heading, because they are bought at the venue, not online.
        source: designer default; DI-202
      - element: Header count
        rule: The count of saved items in the account menu equals the list length. Idempotent saves keep it honest.
        source: contracts/satellite/marketing-crm.yaml#addToWishlist
    actions:
      - action: Book
        result: >-
          Opens ticket selection (WEB-005) or the date step (WEB-006) with the product, and the date where one was
          saved, pre-selected. If that date has sold out, the date step opens with the date shown as sold out
          rather than silently moving to another date.
        source: screens/P01-guest-web-storefront.yaml#WEB-009
      - action: Remove
        result: >-
          Removes the one entry (removeFromWishlist). No confirmation dialog for a single item. Show an Undo toast
          for 5 seconds; Undo re-saves the same variant and date, which is idempotent.
        source: contracts/satellite/marketing-crm.yaml#removeFromWishlist; designer default
    edgeCases:
      - case: The saved date is in the past
        expected: >-
          Shown under "Past dates" with "This date has passed" and a Book another date action that opens the
          date step for the product. The contract only flags withdrawn products, so this state is read from the
          performance date on the client.
        source: contracts/satellite/marketing-crm.yaml#getWishlist
      - case: Guest not signed in
        expected: Sign in and come back here. The wishlist is the guest's own and has no anonymous version.
        source: screens/P01-guest-web-storefront.yaml#WEB-009
      - case: Offline or the connection drops
        expected: The list already loaded stays, marked with its age. Remove and Book wait for the connection and say so.
        source: screens/P01-guest-web-storefront.yaml#WEB-009
    consistency:
      - with: GST-020
        note: Same list, same item card, same "No longer available" treatment, same wording "Wishlist".
      - with: WEB-024
        note: One implementation with two ids (GAP-D3); the account's wishlist pane is this screen.
      - with: BO-757
        note: A saved item is a behavioural signal segments read (wishlist-based audiences); the guest never sees that wording.
    sampleData:
      items:
        - Coastal Aqua Day Pass - Adult, Sat 17 Oct 2026, AED 295.00
        - Kids Club Explorer Pass - Child (any date), AED 120.00
        - Tidewater Museum Pearl Diving Heritage Tour, Fri 23 Oct 2026 14:30, AED 85.00 (No longer available)
        - On site - Karak chai and luqaimat, AED 18.00
      noteExample: For Omar's birthday
    corrections:
      - what: The "Add to wishlist" modal on this screen asks the guest to supply a variantId (and optionally a performanceId).
        why: >-
          A guest cannot know a variant id. Saving belongs on the product and date cards (WEB-005/WEB-006/GST-004).
          Here the screen only lists, books and removes. Replace the modal with a "Browse" link when the list is empty.
        source: screens/P01-guest-web-storefront.yaml#WEB-009
    decisions:
    - question: Does a wishlist entry for a performance that has passed stay, or should the platform drop it, and should a
        guest be told when a saved date is about to sell out?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Keep it under "Past dates" (no deletion);
        no sell-out alert until a journey for it is configured.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-022 | CHG-NOTE-002
      questionSource: contracts/satellite/marketing-crm.yaml#getWishlist

  GST-020:
    summary: >-
      The app's wishlist, the same list as WEB-009, reached from the account and from the ticket wallet. The
      guest saves tickets, dates, and F&B or retail items to buy later on site. Withdrawn products stay marked
      unavailable rather than vanishing.
    inputs:
      - field: Save (heart)
        rule: >-
          Saved from the product, date and menu cards elsewhere in the app; idempotent on variant plus date.
          The same product on two dates is two entries.
        source: contracts/satellite/marketing-crm.yaml#addToWishlist; R149
    outputs:
      - element: Saved item card
        rule: >-
          Same card as WEB-009 (photo, name, date or "Any date", price, availability). Swipe to remove, with
          an Undo snackbar.
        source: contracts/satellite/marketing-crm.yaml#getWishlist; designer default
    actions:
      - action: Book
        result: Opens the product (GST-002 route) with the saved date pre-selected.
        source: screens/P02-guest-mobile-app.yaml#GST-020
    edgeCases:
      - case: Offline in the venue
        expected: The cached list shows with its age. Book and Remove are disabled with "Needs a connection". On-site F&B items still show where to buy them.
        source: screens/P02-guest-mobile-app.yaml#GST-020
    consistency:
      - with: WEB-009
        note: Same data, same card, same order, same empty state ("Nothing saved yet - tap the heart on anything you would like to come back to").
    sampleData:
      items:
        - Coastal Aqua Wave Pool Cabana, Fri 30 Oct 2026, AED 450.00
        - Kids Club Birthday Package (any date), AED 1,250.00
        - On site - Coastal Aqua beach towel, AED 65.00
    corrections:
      - what: The "Add to wishlist" modal asks for variantId, performanceId and note.
        why: Same as WEB-009; adding belongs on the product cards, and a guest cannot type a variant id.
        source: screens/P02-guest-mobile-app.yaml#GST-020

  WEB-011:
    summary: >-
      The details step of the web checkout. It collects the buyer's contact once, the per-ticket holder
      details only where a ticket is name-bound, the booking consent questions the cart still needs, and the
      marketing opt-in. The step is skipped when the cart needs none of these (F01 step 6). From the
      customer-marketing angle there are two things to get right. Marketing consent is opt-in and unticked,
      per channel and purpose, beside the terms. And a buyer cannot consent on behalf of the friends they
      are buying for: consent is per attendee (F55 step 2).
    inputs:
      - field: Email and Mobile (the buyer)
        rule: >-
          At least one of the two is required, never both forced (either/or rule). Prefilled from the signed-in
          profile or UAE Pass. After the guest-checkout code is verified they are shown read-only and never asked
          again. Only the fields the back office configured are collected.
        source: DI-372; DI-123; DI-1002
      - field: Full name
        rule: >-
          Asked only if the venue's configuration requires it and it was not already captured; for a profile
          created by guest checkout the rest is completed later from the account, never here.
        source: DI-1002; DI-399
      - field: Ticket holder details (per attendee)
        rule: >-
          Shown only for tickets whose entitlement is name-bound; one block per holder, titled "Ticket 2 of 4 -
          Child". Season-pass and family products capture first and last name per holder. Ticket-type rules
          such as minimum age or Emirates ID for resident tickets are checked per holder. The holder is separate
          from the buyer, who receives the tickets.
        source: screens/P01-guest-web-storefront.yaml#WEB-011; DI-122; DI-178; DI-429; DI-443; DI-463
      - field: Booking consent questions
        rule: >-
          Only the questions still unanswered in the cart (a product added after the date step, a flow with no
          date step). Each is asked per person or once per booking, as the question says. A required question
          blocks Continue until answered. A blocking answer (No to "Are you able to swim?" on a deep-water
          product) stops that line: say why and offer "Remove this guest" or "Choose another activity".
          Answers are recorded append-only with the question's version.
        source: contracts/satellite/marketing-crm.yaml#recordConsentAnswers; contracts/satellite/marketing-crm.yaml#createConsentQuestion; DG-3; DI-1062
      - field: Send me offers and news (marketing opt-in)
        rule: >-
          One unticked checkbox per configured marketing channel and purpose (e.g. "by email", "by WhatsApp"),
          beside the terms, never pre-ticked and never inferred. It travels with checkout as marketingConsents[]
          and is recorded with source "checkout", bound to the order and the verified contact. Transactional
          messages (tickets, receipts) are required for service and are stated as a sentence, not drawn as a
          checkbox.
        source: DI-954; M18-15 (audit R-M18-15); screens/P01-guest-web-storefront.yaml#WEB-011; F01 step 6
      - field: Preferred contact method
        rule: Email or phone, asked beside the opt-in where the venue configured it.
        source: DI-616
      - field: Identity document upload (where a ticket requires it)
        rule: >-
          Only when the ticket's eligibility rule needs an Emirates ID or passport. Show what it is for and how
          long it is kept (retainUntil is required on every guest document).
        source: contracts/satellite/marketing-crm.yaml#uploadGuestDocument; DI-443; R149
    outputs:
      - element: Step indicator
        rule: >-
          The steps of the published booking flow in their order, with this step highlighted. Steps the flow
          turned off are not shown and are skipped by Continue and Back.
        source: contracts/satellite/white-label.yaml#getPublishedBookingFlow; DI-426
      - element: Hold countdown
        rule: For seated or capacity-held lines the hold timer stays visible through this step.
        source: F02 step 4
      - element: Terms line
        rule: >-
          "By continuing you accept the Terms and Privacy Policy" with links to the current published versions.
          Acceptance is by proceeding; the marketing opt-in sits next to it and is separate.
        source: DI-588; DI-954
    actions:
      - action: Continue to payment
        result: >-
          Enabled when every required field and required consent question is answered. Goes to WEB-012 with the
          opt-ins carried for checkout. A failed save keeps everything typed.
        source: screens/P01-guest-web-storefront.yaml#WEB-011; contracts/satellite/marketing-crm.yaml#recordConsentAnswers
      - action: Back to cart
        result: Returns to WEB-010 with answers kept on the cart (they are recorded against the cart).
        source: contracts/satellite/marketing-crm.yaml#recordConsentAnswers
    edgeCases:
      - case: A ticket holder has no date of birth and the product has an age rule
        expected: Treat the holder as a minor until a date of birth is given (missing DOB counts as a minor) and ask for it inline.
        source: R205
      - case: A consent question was reworded while the guest was on this step
        expected: The cart asks the new version on its next read; show the new wording and clear the old answer for that question only.
        source: contracts/satellite/marketing-crm.yaml#updateConsentQuestion
      - case: The guest's verified contact matches an existing profile
        expected: >-
          Nothing about the other profile is shown here. The match prompt belongs to sign-in and guest checkout
          (WEB-016/WEB-012) and never shows the other profile's name.
        source: DI-1035
      - case: The hold expires during the step
        expected: Return to the cart with the lines marked "Hold expired - check availability again". Answers are kept.
        source: F02 step 4
    consistency:
      - with: GST-009
        note: The app's checkout uses the same opt-in wording, the same unticked default and the same per-channel checkboxes.
      - with: WEB-012
        note: The opt-in is carried into checkout (marketingConsents[]); WEB-012 must not ask for it a second time.
      - with: CMS-027
        note: CMS-027 configures which consent purposes and channels appear at the checkout capture point.
    sampleData:
      buyer: {name: Fatima Al Mansoori, email: fatima.almansoori@example.ae, mobile: +971 50 123 4567}
      holders:
        - Ticket 1 of 3 - Adult - Fatima Al Mansoori
        - Ticket 2 of 3 - Child - Omar Haddad, born 14 Mar 2017
        - Ticket 3 of 3 - Child - Layla Haddad, date of birth missing (asked inline)
      consentQuestion: Are you able to swim? (asked for each person; No blocks the Deep Dive session)
      optIns: ["Send me offers and news by email", "Send me offers and news by WhatsApp"]
    corrections:
      - what: >-
          WEB-011 declares the wishlist and push-device operations (getWishlist, addToWishlist, removeFromWishlist,
          listGuestDevices, registerGuestDevice, revokeGuestDevice), with their buttons and tables.
        why: >-
          They have nothing to do with a checkout details step. The 20 August review removed the same bulk attach
          from WEB-009/GST-020 and the prototype has no counterpart. Remove them from WEB-011.
        source: screens/P01-guest-web-storefront.yaml#WEB-011; screens/P02-guest-mobile-app.yaml#GST-020
      - what: The marketing opt-in is written with recordConsent from this screen.
        why: >-
          M18-15 (audit R-M18-15) records checkout opt-ins through checkoutCart marketingConsents[] and recordCheckoutConsents,
          bound to the order and the verified contact. recordConsent needs a signed-in subject (a guest-checkout
          buyer has none) and would record consent for an order that may never be paid. Keep recordConsent off
          this step and pass the ticks to checkout.
        source: M18-15 (audit R-M18-15); contracts/satellite/marketing-crm.yaml#recordCheckoutConsents
      - what: The "Upload guest document" control is offered, but uploadGuestDocument needs a storageRef that no operation issues yet.
        why: The upload cannot work end to end. Either name the document-store upload operation or hide the control until it exists.
        source: contracts/satellite/marketing-crm.yaml#uploadGuestDocument
      - what: The emptyFirstRun state offers "Add to wishlist" on a checkout step.
        why: Derived from the bulk-attached operations. The empty state of this step is "Nothing to fill in - continue to payment", and the step is normally skipped.
        source: F01 step 6
    decisions:
    - question: May a guest who checks out without an account be marketed to on the strength of the checkout opt-in (is it
        sufficient consent under PDPL)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw the unticked opt-in beside the terms.
        Record it with source "checkout". Send nothing promotional to a guest-checkout buyer unless they ticked it.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-023 | CHG-NOTE-002
      questionSource: M18-15 (audit R-M18-15); DI-940; DI-954

  WEB-017:
    summary: >-
      The signed-in guest's account home on the web. Tiles show upcoming bookings, wallet, loyalty position,
      active challenges, invitations, and shortcuts to profile, privacy, newsletters, cases and wishlist. Each
      tile loads and fails on its own. The prototype makes the account one page with section panes, and the
      other account screens are panes of it.
    inputs:
      - field: Invitation response
        rule: >-
          Accept or decline, with plus-ones only if the invitation allows them. The link token is single-use, so
          a second click shows the response already given. Accepting issues the entitlement, which then
          appears under bookings.
        source: contracts/satellite/marketing-crm.yaml#respondToInvitation
    outputs:
      - element: Loyalty tile
        rule: Tier, points, and points to the next tier as a progress bar; expiring points with their date if any expire within 30 days. Links to WEB-043.
        source: F53 step 1; contracts/satellite/marketing-crm.yaml#getLoyaltyPosition
      - element: Challenges tile
        rule: Each active challenge with its progress (2 of 3 visits), not just the outcome, because progress is what changes behaviour.
        source: contracts/satellite/marketing-crm.yaml#getMyChallenges
      - element: Complete your details banner
        rule: For a profile created by guest checkout, a dismissible prompt to add what the checkout pop-up did not ask. It never blocks anything.
        source: DI-1002; screens/P01-guest-web-storefront.yaml#WEB-020
      - element: Consent reminder
        rule: >-
          If getGuestConsents reports a consent given against a superseded notice, show "Our privacy notice
          changed - review your choices" linking to the profile's consent section.
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents
    actions:
      - action: Open a tile
        result: Goes to the owning screen (WEB-018 bookings, WEB-019 orders, WEB-043 loyalty, WEB-020 profile, WEB-024 devices and privacy).
        source: screens/P01-guest-web-storefront.yaml#WEB-017
    edgeCases:
      - case: One tile's read fails
        expected: That tile shows "Could not load - retry"; the rest of the page works.
        source: screens/P01-guest-web-storefront.yaml#WEB-017
      - case: Brand-new account with no orders
        expected: Offers what to do next (Browse tickets, Complete your details), not empty tiles.
        source: screens/P01-guest-web-storefront.yaml#WEB-017
    consistency:
      - with: GST-039
        note: The app's account home holds the same tiles in the same order and with the same labels.
      - with: WEB-043
        note: The loyalty tile and the loyalty page use the same tier badge and progress bar.
    sampleData:
      guest: Rahul Menon
      loyalty: {tier: Silver, points: 2340, toNext: 660 to Gold, expiring: 150 points on 31 Oct 2026}
      challenge: Visit 3 times this autumn - 2 of 3
      invitation: Coastal Aqua Members' Night, Thu 5 Nov 2026 19:00, plus one allowed
    corrections:
      - what: >-
          WEB-017 declares the wishlist and device operations and recordConsent as action-bar buttons (Add to
          wishlist, Register guest device, Revoke guest device, Record consent).
        why: >-
          A dashboard links to those panes (WEB-009, WEB-024, WEB-020); it does not perform them. "Register guest
          device" is something the app does on install, never a button. Keep the reads the tiles need and drop
          the writes.
        source: screens/P01-guest-web-storefront.yaml#WEB-017; contracts/satellite/marketing-crm.yaml#registerGuestDevice
      - what: getMyChallenges has no response schema.
        why: The challenges tile has nothing to bind to; the contract needs the ChallengeProgress shape.
        source: contracts/satellite/marketing-crm.yaml#getMyChallenges
      - what: Upcoming bookings, wallet and orders tiles have no operation on this screen.
        why: The prototype draws them, and the screen's own empty state talks about orders. Add the read operations (or state that the tiles link without figures).
        source: screens/P01-guest-web-storefront.yaml#WEB-017

  WEB-020:
    summary: >-
      The web page where a guest corrects their own details, sets preferences, and gives or withdraws consent.
      Withdrawing must be exactly as easy as giving: same screen, same number of clicks. A profile created by
      guest checkout shows "Complete your details" and is never blocked. Preferences (what they like) and
      consent (what they permit) are visibly separate sections, because a preference update must never quietly
      grant marketing permission.
    inputs:
      - field: Name, email, phone, language, preferred channel
        rule: >-
          A guest may correct only these (plus dietary and accessibility), never their tags, lifetime value or
          tier. At least one of email or mobile must remain. A changed email is unverified until the link is
          confirmed, and an unverified account cannot buy, so show "Verify your new email" immediately.
          Preferred channel is email, SMS, WhatsApp, push or none; "none" stops marketing channels only, and
          transactional messages still arrive.
        source: contracts/satellite/marketing-crm.yaml#updateMyProfile; DI-372; contracts/spine/identity.yaml#verifyGuestEmail
      - field: Dietary and accessibility needs
        rule: >-
          Structured choices, not free tags. They are health-adjacent personal data, so explain they are used to
          serve the guest and are not marketing. Saved by updateMyProfile or updateGuestPreferences; both write
          the same fields.
        source: contracts/satellite/marketing-crm.yaml#updateMyProfile; contracts/satellite/marketing-crm.yaml#updateGuestPreferences
      - field: Consent toggles
        rule: >-
          One row per configured purpose (from the venue's consent purposes), each with the channels it covers as
          toggles, the purpose's plain-language description, and a link to the notice version in force. Each change
          is recorded at once as a new, append-only consent record with source "website" and the notice version.
          No Save button is needed for consent, and a failed write reverts the toggle with an error.
        source: contracts/satellite/marketing-crm.yaml#recordConsent; contracts/satellite/marketing-crm.yaml#listConsentPurposes; screens/P01-guest-web-storefront.yaml#WEB-020
      - field: Identity verification (only where the venue's policy asks)
        rule: >-
          Document kind (passport, Emirates ID, national ID, driving licence, residence permit), number, expiry,
          and a photo of the document. The number is hashed and only the last four characters are ever shown back.
        source: contracts/spine/identity.yaml#submitGuestIdentityDocument
    outputs:
      - element: Consent state per purpose
        rule: >-
          Given (with date), Withdrawn (with date) or Not asked. A consent given against a superseded notice shows
          "Needs renewing" with the new notice to read.
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents; contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentDecision
      - element: Verification status
        rule: Pending, verified, rejected or resubmit; for a rejection, the reason the guest is shown.
        source: contracts/spine/identity.yaml#getMyIdentityVerification
    actions:
      - action: Save my details
        result: Saves the profile fields; on failure the form keeps what was typed and says what failed.
        source: screens/P01-guest-web-storefront.yaml#WEB-020
      - action: Withdraw all marketing
        result: >-
          One action that records "withdrawn" for the marketing purpose on every channel (channels omitted
          applies to all). Confirmation names what stops (offers and news) and what continues (tickets, receipts).
        source: contracts/satellite/marketing-crm.yaml#recordConsent
    edgeCases:
      - case: The guest removes their email and has no mobile
        expected: Refused inline - "Keep at least an email or a mobile so we can send your tickets".
        source: DI-372
      - case: A consent change fails to save
        expected: The toggle returns to its previous position and the page says the change did not save. Never show success for an unsaved consent.
        source: screens/P01-guest-web-storefront.yaml#WEB-020
    consistency:
      - with: GST-039
        note: Same fields, same consent rows, same "Withdraw all marketing" wording.
      - with: WEB-027
        note: Newsletters (subscriptions) live on WEB-027; this page links to it and does not duplicate the list toggles.
      - with: WEB-024
        note: The data request and delete-account actions live on WEB-024; this page links there.
    sampleData:
      profile: {name: Sarah Thompson, email: sarah.t@example.ae, mobile: +971 55 987 2210, language: English, channel: WhatsApp}
      consents:
        - Offers and news - Email Given 12 Sep 2026, WhatsApp Not asked, SMS Withdrawn 2 Oct 2026
        - Personalised recommendations - Given 12 Sep 2026
        - Sharing with partner venues - Not asked
      dietary: ["Vegetarian", "Nut allergy"]
      accessibility: ["Step-free access"]
    corrections:
      - what: The profile is read with getGuestProfile (staff-and-guest, by subjectId) while getMyProfile, the guest's own read, is consumed by no screen.
        why: A guest screen should read its own record by session (getMyProfile), matching updateMyProfile. That way the read cannot be pointed at another subject.
        source: contracts/satellite/marketing-crm.yaml#getMyProfile; contracts/satellite/marketing-crm.yaml#updateMyProfile
      - what: The screen writes consent but has no getGuestConsents, so it cannot show the current position it is changing.
        why: The toggles need the current state, including "needs renewing". Add getGuestConsents (already used by WEB-024/GST-066).
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents
      - what: Purpose text reads "Change how profile behaves here, and see which level the current value came from".
        why: This is a configuration-screen template that does not describe a guest profile page (the prototype noted it has no "level"). Reword it to "Correct your details, choose what we may send you, and record your needs".
        source: screens/P01-guest-web-storefront.yaml#WEB-020

  GST-039:
    summary: >-
      The app's profile: what the venue holds about the guest and what they can change. It covers name and
      contact, language, needs and consent, with links to newsletters (GST-065), privacy and data (GST-066), Face
      Pass (GST-069), family and wallet, and devices (GST-073). A profile created by guest checkout shows
      "Complete your details" and never blocks anything.
    inputs:
      - field: Details (name, email, mobile, language, channel, dietary, accessibility)
        rule: Same rules as WEB-020. The guest edits only their own narrower field set, and at least one of email or mobile remains.
        source: contracts/satellite/marketing-crm.yaml#updateMyProfile; DI-372
      - field: Consent rows
        rule: >-
          Toggles per purpose and channel, recorded on change with source "guestApp" and the notice version.
          The guest never types a purpose, decision, source, notice version or timestamp.
        source: contracts/satellite/marketing-crm.yaml#recordConsent
    outputs:
      - element: Family members
        rule: >-
          Linked family members the guest created (with their spending limits), shown as a row linking to the
          family and wallet screen. Guests may add family members themselves.
        source: DI-530
    actions:
      - action: Save my profile
        result: Saves details; offline the button reads "Needs a connection" and nothing is queued.
        source: screens/P02-guest-mobile-app.yaml#GST-039
    edgeCases:
      - case: Opened offline
        expected: Shows the last loaded profile with its age. Every change waits for the connection, because a consent change must reach the server to mean anything.
        source: screens/P02-guest-mobile-app.yaml#GST-065
    consistency:
      - with: WEB-020
        note: Same fields, consent rows and wording.
      - with: GST-066
        note: Data requests and account deletion are on GST-066, reached from here.
    sampleData:
      profile: {name: Khalid Al Suwaidi, nameAr: خالد السويدي, mobile: +971 52 440 1188, language: العربية, channel: WhatsApp}
      family: ["Mariam Al Suwaidi (daughter, limit AED 100 a day)", "Saeed Al Suwaidi (son, limit AED 50 a day)"]
    corrections:
      - what: >-
          The content body is six text fields bound to RecordConsentRequest (purpose, decision, channels,
          noticeVersion, source, recordedAt), with "Record consent" as the primary action.
        why: >-
          A guest never types these; source, notice version and time are system-set. The primary act of a
          profile screen is saving the profile. Replace them with the consent rows described above.
        source: screens/P02-guest-mobile-app.yaml#GST-039; contracts/satellite/marketing-crm.yaml#recordConsent
      - what: GST-039 declares no read operation; it cannot show the profile it edits or the current consents.
        why: Add getMyProfile and getGuestConsents.
        source: contracts/satellite/marketing-crm.yaml#getMyProfile; contracts/satellite/marketing-crm.yaml#getGuestConsents
      - what: The emptyNoAccess state names GUEST_VIEW, and emptyFirstRun says the first consent "saves the first profile".
        why: A guest holds no staff permission (ADR-0025), and a profile always exists for a signed-in guest. These states come from the configEditor pattern and do not apply.
        source: screens/P01-guest-web-storefront.yaml#WEB-020
        status: fixed
        by: CHG-GST-004

  GST-065:
    summary: >-
      What the venue may send the guest, and how. The screen shows two separate things. Marketing consent per
      channel is what the law allows. Newsletter and list subscriptions are what the guest wants to receive.
      Unsubscribing from a list does not withdraw consent, and withdrawing consent stops every list on that
      channel. Without a marketing opt-in nothing promotional is sent.
    inputs:
      - field: Marketing consent per channel
        rule: >-
          Email, SMS, WhatsApp and push toggles for the marketing purpose, recorded on change with source
          "guestApp". Turning a channel off is immediate, with no confirmation.
        source: contracts/satellite/marketing-crm.yaml#recordConsent; DI-378
      - field: List subscriptions
        rule: >-
          One row per list (e.g. "Coastal Aqua news", "Kids Club events") with the channels it is sent on.
          A list's channel can be switched on only where marketing consent for that channel is given. Otherwise
          the toggle asks "Allow offers by email?" first and records the consent in the same act.
        source: contracts/satellite/marketing-crm.yaml#setMarketingSubscription; contracts/satellite/marketing-crm.yaml#/components/schemas/MarketingSubscription
    outputs:
      - element: Where each opt-in came from
        rule: Each given consent shows when and where it was given (in the app, at checkout, at the till), because a guest asking "when did I agree to this?" deserves the answer.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentSource
    actions:
      - action: Stop all marketing
        result: Records withdrawn for the marketing purpose on every channel and shows every list as paused. Tickets and receipts still arrive (transactional).
        source: contracts/satellite/marketing-crm.yaml#recordConsent
    edgeCases:
      - case: Offline
        expected: Not available, and the banner says why - a consent change must reach the server to mean anything.
        source: screens/P02-guest-mobile-app.yaml#GST-065
    consistency:
      - with: WEB-027
        note: Same two sections, same order (consent first, then lists), same labels.
      - with: BO-788
        note: The back office shows the same split; staff never edit a guest's subscription for them except by a recorded request.
    sampleData:
      consent: {email: Given 3 Sep 2026 (at checkout), whatsapp: Given 20 Sep 2026 (in the app), sms: Not asked, push: Withdrawn 1 Oct 2026}
      lists:
        - Coastal Aqua news - email, WhatsApp - subscribed
        - Kids Club events - email - not subscribed
        - Member offers - email - subscribed
    corrections:
      - what: setMarketingSubscription's channel enum is [email, sms, push]; WhatsApp is missing.
        why: >-
          WhatsApp is a MessageChannel, a preferred-channel value on the profile, and the client's main
          channel (MoM 2026-08-31 4.6). A WhatsApp newsletter cannot be subscribed to or unsubscribed from.
        source: contracts/satellite/marketing-crm.yaml#setMarketingSubscription; contracts/satellite/marketing-crm.yaml#/components/schemas/MessageChannel
      - what: getMarketingSubscription has no response schema, and setMarketingSubscription is marked "a proposal ... wants confirming".
        why: The screen's subscription section cannot be built against an empty response. Confirm the shape (one row per list and channel).
        source: contracts/satellite/marketing-crm.yaml#getMarketingSubscription
      - what: No getGuestConsents on GST-065, and the emptyNoAccess state names GUEST_VIEW.
        why: The consent toggles need the current state. A guest holds no staff permission (ADR-0025).
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents
        status: fixed
        by: CHG-GST-004
      - what: The "Save marketing subscription" modal asks the guest for id, subjectId, channel, listName, isSubscribed and unsubscribeToken.
        why: These are system and row fields; the guest flips a toggle per list and channel.
        source: screens/P02-guest-mobile-app.yaml#GST-065

  WEB-027:
    summary: >-
      Newsletters on the web, the same two-part page as GST-065: marketing consent per channel, then list
      subscriptions. The page must also open from the unsubscribe link in any email without signing in, show
      the result in one tap, and offer "Manage all preferences" behind sign-in.
    inputs:
      - field: Unsubscribe link (arriving without a session)
        rule: >-
          The link carries an unsubscribe token. The page unsubscribes that list on that channel at once and
          shows "You will no longer receive Coastal Aqua news by email". No sign-in, no confirmation step.
        source: contracts/satellite/marketing-crm.yaml#setMarketingSubscription
      - field: Consent and list toggles (signed in)
        rule: Same rules as GST-065.
        source: contracts/satellite/marketing-crm.yaml#recordConsent; contracts/satellite/marketing-crm.yaml#setMarketingSubscription
    outputs:
      - element: Failure
        rule: If the subscription or consent write fails, say so and leave the toggle as it was. Consent is not recorded on a failed request.
        source: screens/P01-guest-web-storefront.yaml#WEB-027
    actions:
      - action: Resubscribe (after a link unsubscribe)
        result: Offered once on the result page, and it needs the guest to sign in, because re-adding consent from a forwarded link is not consent.
        source: contracts/satellite/marketing-crm.yaml#setMarketingSubscription; M18-15 (audit R-M18-15)
    consistency:
      - with: GST-065
        note: Same sections, order and wording.
      - with: BO-785
        note: Every marketing email template carries the unsubscribe link that lands here.
    sampleData:
      linkResult: You will no longer receive Coastal Aqua news by email. Tickets and receipts are not affected.
      lists: ["Coastal Aqua news", "Tidewater Museum exhibitions", "Member offers"]
    corrections:
      - what: >-
          WEB-027 declares the wishlist and device operations (getWishlist, addToWishlist, removeFromWishlist,
          listGuestDevices, registerGuestDevice, revokeGuestDevice), with tables and buttons, and its entry
          parameters are deviceId and itemId.
        why: >-
          The contract itself says the screen "sat on the wishlist and consent operations, which is why it read
          as a duplicate". Remove them. The entry parameter that matters is the unsubscribe token from an email link.
        source: contracts/satellite/marketing-crm.yaml#getMarketingSubscription; screens/P01-guest-web-storefront.yaml#WEB-027
      - what: Purpose is "Record newsletter subscription for this venue"; there is no listConsentPurposes or getGuestConsents.
        why: The page needs the current consent per channel to show the two-part layout.
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents
    decisions:
    - question: Should a signed-out visitor be able to sign up for a newsletter with just an email (footer sign-up)? No operation
        accepts an email without a guest subject.
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Not drawn. The footer link says "Get our
        news - sign in or create an account".'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-025 | CHG-NOTE-002
      questionSource: screens/P01-guest-web-storefront.yaml#WEB-027; contracts/satellite/marketing-crm.yaml#setMarketingSubscription

  WEB-024:
    summary: >-
      The web account's devices, security, Face Pass status, cookie choices, consent and data rights, built as
      one implementation with WEB-009 (GAP-D3). From this process's angle it is where a signed-in guest reviews
      consent and cookie decisions, downloads their data and asks for erasure, all with the same honesty as
      GST-066. Withdrawing must be one step, and erasure must be explained before it is offered.
    inputs:
      - field: Cookie preferences
        rule: >-
          Categories strictly necessary (always on, not a toggle, with its description), functional, analytics,
          personalisation and marketing (all off until chosen). "Reject non-essential" is always one click. A
          change is a new decision row, never an edit.
        source: contracts/satellite/marketing-crm.yaml#recordDeviceConsent; contracts/satellite/marketing-crm.yaml#/components/schemas/CookieCategory; contracts/satellite/marketing-crm.yaml#listCookieBannerPreference
      - field: Whose Face Pass
        rule: The signed-in guest and each linked child they hold as guardian; a parent sees and withdraws a child's enrolment. Enrolment itself stays mobile-only (GST-069).
        source: R205; DI-1077
      - field: Data copy format
        rule: JSON, CSV or PDF; PDF is the default for a person, the others for portability.
        source: contracts/spine/identity.yaml#exportSubjectData
    outputs:
      - element: Cookie technologies
        rule: >-
          Per category, the approved technologies with name, provider, purpose, expiry in days, and first or
          third party. Detected, blocked and retired entries never appear.
        source: contracts/satellite/marketing-crm.yaml#listPublishedTrackingTechnologies
      - element: Consent state
        rule: Same rows and states as WEB-020 (Given, Withdrawn, Not asked, Needs renewing).
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents
      - element: Waiver status
        rule: Whether the guest's tickets need a waiver still unsigned, which one, and those expiring soon, with Sign now.
        source: contracts/satellite/marketing-crm.yaml#getWaiverStatus
    actions:
      - action: Withdraw Face Pass
        result: >-
          The confirmation says the face template is destroyed, not flagged, and that the pass survives so the
          guest enters another way. After confirming it cannot be undone except by enrolling again in the app.
        source: contracts/spine/access.yaml#revokeFacePass
      - action: Get a copy of my data
        result: Raises a data request and shows its reference and estimated completion date; the file arrives by the notification the venue configured.
        source: contracts/spine/identity.yaml#exportSubjectData
      - action: Delete my account
        result: >-
          Explains first: personal details are erased; bookings and payments stay in the venue's financial records
          under an anonymous reference; the request is completed by an estimated date. Then a typed confirmation.
          Raises an erasure request; it is not an instant delete.
        source: contracts/spine/identity.yaml#deleteGuestAccount; DI-379
    edgeCases:
      - case: The guest signed in on a shared browser
        expected: Cookie history from before sign-in now belongs to the guest (claimed); the device history read answers 404 for a claimed key, so show the guest's own consents instead.
        source: contracts/satellite/marketing-crm.yaml#getDeviceConsentHistory
    consistency:
      - with: GST-066
        note: Same data-request wording, same erasure explanation, same statuses.
      - with: GST-073
        note: The app's devices and security screen uses the same device rows and the same "Sign out this device" wording.
    sampleData:
      devices: ["iPhone 15 - Coastal Aqua app - last active today 09:12", "Chrome on Windows - last active 28 Sep 2026"]
      dataRequest: {reference: DR-2026-00412, kind: Copy of my data, raised: 1 Oct 2026, due: 31 Oct 2026, status: In progress}
      cookies: {analytics: Off, marketing: Off, functional: On}
    corrections:
      - what: Purpose still reads "See loyalty & rewards for this venue".
        why: Stale since the 31 August rename; the prototype review noted it. Reword it to "Your devices, security, cookie choices and data rights".
        source: screens/P01-guest-web-storefront.yaml#WEB-024
      - what: >-
          "Signed-in devices" with "Sign out this device" is bound to listGuestDevices / revokeGuestDevice, which are
          push-notification registrations.
        why: >-
          Revoking a push registration stops notifications; it does not end a session on a lost device. No guest
          operation lists or ends other sessions (guestLogout ends only the current one). Either add a guest
          session list/revoke operation or relabel the control "Stop notifications on this device".
        source: contracts/satellite/marketing-crm.yaml#revokeGuestDevice; contracts/spine/identity.yaml#guestLogout; DI-1077
      - what: >-
          Action-bar buttons "Add to wishlist", "Register guest device", "Record consent" and "Grant delegation" sit
          on the security and privacy pane.
        why: Adding to the wishlist and registering a device are not acts a guest performs here, and consent changes belong on the consent rows. Granting delegation belongs to the family screen.
        source: screens/P01-guest-web-storefront.yaml#WEB-024
      - what: getWaiverStatus returns an inline response with no named schema.
        why: The waiver panel cannot bind until the contract names it (the screen's own component note says so).
        source: contracts/satellite/marketing-crm.yaml#getWaiverStatus

  GST-066:
    summary: >-
      The app's privacy and data page. The guest exercises their legal rights here: a copy of their data,
      erasure of the account, a review of consents and cookie choices. Erasure is not a button. It starts a
      request with a legal clock, and the page must show where every request has got to, because a request
      that silently fails is a regulatory failure with a timestamp on it (ADR-0033).
    inputs:
      - field: Request a copy of my data
        rule: Format choice (PDF default, CSV, JSON). One open copy request at a time; a second shows the open one.
        source: contracts/spine/identity.yaml#exportSubjectData
      - field: Delete my account
        rule: >-
          Before the button, explain in the guest's language what is erased (name, contact, preferences, documents,
          Face Pass), what is kept anonymised (bookings and payments in the venue's financial records), and when
          it completes. Confirm with a typed word or a second deliberate tap.
        source: contracts/spine/identity.yaml#deleteGuestAccount; screens/P02-guest-mobile-app.yaml#GST-066
      - field: Consent and cookie choices
        rule: Same rows as GST-039 and WEB-024; withdrawing is one tap.
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents; contracts/satellite/marketing-crm.yaml#recordDeviceConsent
    outputs:
      - element: My requests
        rule: >-
          Each request with its kind (copy, erasure), reference, date raised, estimated completion, and status
          (submitted, in progress, completed). A completed copy carries its download link and expiry.
        source: DI-379; contracts/spine/identity.yaml#exportSubjectData
    actions:
      - action: Request a copy
        result: Shows the reference and estimated date at once. The legal clock starts when the platform receives it, so this is not offered offline.
        source: screens/P02-guest-mobile-app.yaml#GST-066
      - action: Delete my account
        result: >-
          Shows the reference and expected completion. The guest is signed out on this device. A notification
          confirms when erasure completes.
        source: contracts/spine/identity.yaml#deleteGuestAccount
    edgeCases:
      - case: Offline
        expected: Nothing is offered; the banner says requests need a connection because the legal clock starts on receipt.
        source: screens/P02-guest-mobile-app.yaml#GST-066
      - case: The guest holds an active annual pass or wallet balance when asking for erasure
        expected: >-
          Say what happens to it before confirming (the pass and the remaining credit are lost or must be
          refunded first), and link to the wallet. Exact treatment follows the venue's policy.
        source: contracts/spine/identity.yaml#deleteGuestAccount
    consistency:
      - with: WEB-024
        note: Same wording for both requests, same statuses, same erasure explanation.
      - with: CMS-034
        note: Staff see these same requests in the privacy request queue; statuses use the same three words.
    sampleData:
      requests:
        - {reference: DR-2026-00398, kind: Copy of my data (PDF), raised: 22 Sep 2026, status: Completed - download until 22 Oct 2026}
        - {reference: DR-2026-00431, kind: Delete my account, raised: 1 Oct 2026, due: 31 Oct 2026, status: Submitted}
    corrections:
      - what: The screen is a statusTracker, but no guest-callable operation reads a guest's own data requests (getDsarRequest is service-only).
        why: The page cannot show "where it has got to", which is its stated purpose. Add a guest read of their own requests (scoped to the caller, like listMyCases).
        source: contracts/spine/cross-region.yaml#getDsarRequest; screens/P02-guest-mobile-app.yaml#GST-066
      - what: The screen reads consents (getGuestConsents) but cannot change them; recordConsent is not declared.
        why: A privacy page that shows consents without letting the guest withdraw them breaks "withdrawal as easy as granting". Add recordConsent.
        source: contracts/satellite/marketing-crm.yaml#recordConsent
      - what: '"Upload guest document" and "Save guest preferences" are action-bar buttons on the privacy page.'
        why: Documents belong where they are needed (attendee forms, waivers) and need a storageRef no operation issues. Preferences belong on GST-039. Neither is a data right.
        source: contracts/satellite/marketing-crm.yaml#uploadGuestDocument
      - what: '"Export subject data" and "Delete guest account" are the button labels, and emptyNoAccess names GUEST_VIEW_PII.'
        why: Spec wording on a guest surface. Use "Get a copy of my data" and "Delete my account". A guest holds no staff permission (ADR-0025).
        source: screens/P02-guest-mobile-app.yaml#GST-066

  WEB-025:
    summary: >-
      The web Help view, built as one implementation with WEB-045 (GAP-D3). It holds the FAQ, the guest's own
      cases, policies, the accessibility statement, app status and a localised "What's new". It should answer
      the question without a person. When it cannot, the guest raises a case or reaches a live agent through
      the concierge handover.
    inputs:
      - field: Raise a case
        rule: >-
          Topic chips from the case kinds (Lost property, Complaint, Question, Accessibility, Refund request,
          Other), a one-line summary, and details (required when the topic is Other). Optionally attach the
          booking it is about. Needs the connection.
        source: contracts/satellite/marketing-crm.yaml#raiseMyCase; contracts/satellite/marketing-crm.yaml#/components/schemas/CaseKind; R148
      - field: FAQ search
        rule: Searches the venue's FAQ categories and entries in the guest's language. It is the same content the AI concierge grounds on.
        source: contracts/satellite/white-label.yaml#listFaqs; screens/P01-guest-web-storefront.yaml#WEB-025
    outputs:
      - element: My cases
        rule: >-
          Case number (venue prefix plus sequence), summary, topic, status, last update. "Waiting for you" is
          emphasised and opens the thread with a reply box.
        source: contracts/satellite/marketing-crm.yaml#listMyCases; R152; contracts/satellite/marketing-crm.yaml#/components/schemas/CaseStatus
      - element: What's new
        rule: At most 10 entries, newest first; version, date, localised notes. Staff-only change fields never appear.
        source: contracts/satellite/white-label.yaml#getTenantAppStatus; DI-1073
    actions:
      - action: Talk to a person
        result: Opens the concierge (WEB-044) and hands the conversation over to an agent; queue position and wait come from the live agent queue.
        source: screens/P01-guest-web-storefront.yaml#WEB-025; R149
      - action: Request a refund
        result: >-
          Raises a case of kind refund request linked to the order; operations approve, reject or ask for more
          information. It is never an instant refund.
        source: DI-254; F05 step 3
    edgeCases:
      - case: Offline or connection lost
        expected: Cases already loaded stay read-only with their age. Raising and replying are disabled, and the page says how to reach staff in person.
        source: R148
    consistency:
      - with: GST-068
        note: Same case list, case form, topics and statuses.
      - with: WEB-034
        note: Lost property raised here and on WEB-034 is the same case object and appears in both lists.
    sampleData:
      cases:
        - {number: CA-1042, topic: Lost property, summary: Black backpack near the wave pool, status: Waiting for you}
        - {number: CA-1019, topic: Refund request, summary: Rain closed the slides on Sat 26 Sep, status: Being handled}
      faq: ["What can I bring into Coastal Aqua?", "Can I change the date of my ticket?", "Is there step-free access?"]
    corrections:
      - what: WEB-025 raises and lists cases with createCase and listCases.
        why: >-
          Both carry staff permissions (CASE_MANAGE / CASE_VIEW), and the contract states no case operation was
          guest-callable until raiseMyCase, listMyCases and replyToMyCase were added. Use the /my operations,
          as WEB-034 and GST-034 do (R148 names WEB-025 among the guest case screens).
        source: contracts/satellite/marketing-crm.yaml#listMyCases; R148
      - what: The FAQ (the screen's first purpose) has no operation; listFaqs is declared on WEB-045 only.
        why: The two screens are one implementation (GAP-D3). Declare listFaqs here too, or record that WEB-045 supplies it.
        source: contracts/satellite/white-label.yaml#listFaqs; rev 3 GAP-D3

  GST-068:
    summary: >-
      The app's Help and My Cases: the guest's cases and AI concierge conversations in one place. A
      conversation the assistant could not answer becomes a case rather than a dead end. Most questions never
      become a case, and that is the intent.
    inputs:
      - field: Raise a case
        rule: Same form and rules as WEB-025; the case id is created on the device, so a retry after a dropped connection is the same case.
        source: contracts/satellite/marketing-crm.yaml#raiseMyCase
      - field: Reply
        rule: Plain text reply on the guest's own case; the guest sees only messages addressed to them, never internal notes.
        source: contracts/satellite/marketing-crm.yaml#replyToMyCase
    outputs:
      - element: Cases and conversations
        rule: >-
          Two tabs: Cases (number, topic, status, last update) and Chats (past concierge conversations, newest
          first). A chat that became a case links to it.
        source: contracts/satellite/marketing-crm.yaml#listMyCases; contracts/satellite/ai.yaml#listAiConversations
    edgeCases:
      - case: Offline
        expected: Loaded cases stay read-only with their age; raising and replying are disabled; directions to the guest services desk are shown.
        source: R148
      - case: A group asks for an upgrade
        expected: Group upgrades are raised as a request here (kind Question or Other with the booking attached), not self-served.
        source: DI-607
    consistency:
      - with: WEB-025
        note: Same topics, statuses and wording.
      - with: SUP-005
        note: What the guest writes here arrives in the agent's case thread as a guest message.
    sampleData:
      cases:
        - {number: CA-1051, topic: Accessibility, summary: Wheelchair at the main gate on Fri, status: Resolved}
      chats: ["Opening hours on public holidays - answered by the assistant", "28 Sep 2026"]
    corrections:
      - what: GST-068 uses createCase and listCases, with staff filters as fields (Assigned to principal id, Breached SLA, Priority).
        why: Staff-permissioned operations and staff filters on a guest screen. Use raiseMyCase, listMyCases and replyToMyCase (R148 lists GST-068), and remove the filter fields.
        source: contracts/satellite/marketing-crm.yaml#listMyCases; R148
      - what: emptyNoAccess names CASE_VIEW.
        why: A guest holds no staff permission (ADR-0025).
        source: screens/P02-guest-mobile-app.yaml#GST-068
        status: fixed
        by: CHG-GST-004

  WEB-026:
    summary: >-
      Where a guest rates a visit and leaves feedback on the web. The prototype draws a list of recent visits to
      rate. A low rating may open a service case automatically where the venue configured it, and the guest
      must be told when that happens: feedback that goes nowhere is worse than none.
    inputs:
      - field: Rating
        rule: A whole-number rating; drawn as 1 to 5 stars (the matrix allows stars or smiley faces). Required.
        source: contracts/satellite/marketing-crm.yaml#submitReview; MATRIX 6.1.46
      - field: What stood out (aspects)
        rule: Chips from the venue's closed aspect set (e.g. Cleanliness, Staff, Food, Queues); multi-select, optional.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SubmitReviewRequest
      - field: Your comments
        rule: Optional free text in any language.
        source: contracts/satellite/marketing-crm.yaml#submitReview
      - field: Which visit
        rule: Chosen from the guest's recent orders (relatedOrderId), shown as "Coastal Aqua - Sat 26 Sep 2026"; never typed.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SubmitReviewRequest
    outputs:
      - element: After submitting
        rule: >-
          "Thank you - your review will appear once checked" (status pending moderation). If a case was opened,
          show "We have opened case CA-1063 so our team can follow up", linking to the case.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/Review
      - element: Venue's reply
        rule: When the venue responds, the response shows under the guest's review, marked public or private as set.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/Review
    edgeCases:
      - case: Submit fails
        expected: The answers stay on the form; pressing Submit again reuses the same idempotency key, so a submit that did arrive is not recorded twice.
        source: screens/P01-guest-web-storefront.yaml#WEB-026
    consistency:
      - with: GST-035
        note: Same stars, chips and wording; the app also offers "Report a problem" (raiseMyCase) and the web should too.
      - with: BO-820
        note: Reviews land in moderation; statuses pending moderation, published, hidden, rejected.
    sampleData:
      visit: Coastal Aqua - Sat 26 Sep 2026 - 2 adults, 1 child
      rating: 2
      aspects: ["Queues", "Food"]
      comment: The lazy river queue was over 40 minutes and the burger stand ran out of food at 3pm.
      autoCase: CA-1063
    corrections:
      - what: The form is eight text fields bound to SubmitReviewRequest (id, subjectId, venueId, relatedOrderId, rating, body, aspects, recordedAt).
        why: id, subjectId, venueId and recordedAt are system-set, relatedOrderId is picked from a visit, rating is stars, and aspects are chips. Rebuild as above.
        source: screens/P01-guest-web-storefront.yaml#WEB-026
      - what: Surveys (the screen's name and DI-391) have no operation; getForm and submitForm (kind survey, guest audience) are consumed by no screen.
        why: A triggered survey link (post-visit, post-scan, case closure) has nowhere to open. Wire getForm and submitForm here (and on GST-035).
        source: contracts/satellite/marketing-crm.yaml#submitForm; DI-391
      - what: WEB-026 lacks raiseMyCase, which GST-035 has.
        why: Cross-surface parity. A guest reporting a problem on the web has the same need.
        source: screens/P02-guest-mobile-app.yaml#GST-035
    decisions:
    - question: Should the government satisfaction service (the "happiness meter" seen on a reference site) be integrated,
        and does it replace or sit beside the venue's own rating?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Own rating only; no government widget drawn.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-024 | CHG-NOTE-002
      questionSource: DI-112

  GST-035:
    summary: >-
      The app's feedback and ratings, the same as WEB-026, plus "Report a problem", which raises a case. A
      survey link from a post-visit or post-scan message opens here.
    inputs:
      - field: Rating, aspects, comments, visit
        rule: Same rules as WEB-026.
        source: contracts/satellite/marketing-crm.yaml#submitReview
      - field: Report a problem
        rule: Opens the case form with the topic preset to Complaint and the visit attached; the guest can change the topic.
        source: contracts/satellite/marketing-crm.yaml#raiseMyCase
    edgeCases:
      - case: Offline
        expected: The rating waits for the connection and the button says so. A rating is not queued silently.
        source: screens/P02-guest-mobile-app.yaml#GST-035
    consistency:
      - with: WEB-026
        note: Same form and confirmation wording.
    sampleData:
      visit: Tidewater Museum - Fri 25 Sep 2026
      rating: 5
      aspects: ["Staff", "Exhibits"]
      comment: Our guide Aisha was wonderful with the children.
    corrections:
      - what: The form is raw SubmitReviewRequest text fields, as on WEB-026.
        why: Same fix as WEB-026.
        source: screens/P02-guest-mobile-app.yaml#GST-035
      - what: No survey operation, as on WEB-026.
        why: Wire getForm and submitForm so triggered surveys open here.
        source: contracts/satellite/marketing-crm.yaml#getForm; DI-391

  WEB-034:
    summary: >-
      The guest reports something they lost and follows it until it is found or closed. Lost and found is a
      case. The guest who lost it and the steward who found it are in one conversation, and the guest can see
      the state without asking again. The form must capture what the lost-property desk needs to match
      (what, colour, brand, where, when, a photo), not just a sentence.
    inputs:
      - field: What did you lose
        rule: Chips from the item kinds (Bag, Phone, Wallet, Keys, Clothing, Jewellery, Documents, Toy, Buggy, Other), plus colour and brand.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem
      - field: Where and when
        rule: The area last seen (a list of the venue's points, e.g. Wave Pool, Lockers B) and the approximate time on the visit date.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem
      - field: Photo
        rule: Optional, up to a few photos; useful for matching.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem
      - field: Contact
        rule: Taken from the signed-in profile; the case number is the reference.
        source: contracts/satellite/marketing-crm.yaml#raiseMyCase
    outputs:
      - element: Report status
        rule: >-
          Case number and status. When staff tie a found item to the report, show "Possible match - is this
          yours?" with the found item's photo. Once confirmed, show where to collect it and until when it is kept.
        source: contracts/satellite/marketing-crm.yaml#matchLostItem; contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem
    actions:
      - action: Reply
        result: Adds a guest message to the case thread (never an internal note).
        source: contracts/satellite/marketing-crm.yaml#replyToMyCase
    edgeCases:
      - case: Offline
        expected: Reporting and replying are disabled and the page shows the lost-property point and how to reach staff in person.
        source: R148
      - case: The item is not found before the disposal date
        expected: The report closes with "Not found by 30 Nov 2026"; the guest can reply to reopen within the venue's window.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem; contracts/satellite/marketing-crm.yaml#reopenCase
    consistency:
      - with: GST-034
        note: Same form, same statuses, same "Possible match" wording.
      - with: BO-073
        note: The guest's report must appear in the register as a lost item so staff can match it to found items.
      - with: EMP-028
        note: A steward handing in an item creates the found side of the match.
    sampleData:
      report: {number: CA-1042, item: Bag, colour: Black, brand: Herschel, where: Wave Pool loungers, when: Sat 26 Sep 2026 about 15:00}
      match: Black backpack handed in at Lockers B, Sat 26 Sep 2026 16:40 - collect from Guest Services, kept until 26 Oct 2026
    corrections:
      - what: The guest report uses raiseMyCase (kind, summary, detail, venueId, orderRef), which has no item kind, colour, brand, location, time or photo; recordLostItem (guest audience) is consumed only by BO-073.
        why: >-
          The register (BO-073) matches LostItem records, so a guest report filed only as a case never meets the
          found item, which is "the whole capability". Either have the guest report also create a LostItem
          (recordLostItem with foundOrLost lost and caseId), or extend raiseMyCase with the item fields.
        source: contracts/satellite/marketing-crm.yaml#recordLostItem; contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem; DI-208
      - what: The prototype has no lost-item form; it uses the generic case form.
        why: Record this as a prototype gap so the build does not copy it.
        source: screens/P01-guest-web-storefront.yaml#WEB-034
    decisions:
    - question: Which operation records a guest's lost-item report so it is matchable - recordLostItem alongside the case,
        or an extended raiseMyCase?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw the item fields; send them as the case
        detail until the operation is chosen.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-026 | CHG-NOTE-002
      questionSource: contracts/satellite/marketing-crm.yaml#recordLostItem

  GST-034:
    summary: >-
      The app's lost and found, the same capability as WEB-034. The guest is often still in the venue, so the
      offline state matters: reporting needs the connection, and the screen must say where the lost-property
      point is.
    inputs:
      - field: Item, colour, brand, where, when, photo
        rule: Same as WEB-034; the camera is offered for the photo.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/LostItem
    edgeCases:
      - case: Offline in the venue
        expected: Reports already loaded stay read-only; reporting and replying are disabled with "Visit Guest Services near the main gate or ask any member of staff".
        source: R148; screens/P02-guest-mobile-app.yaml#GST-034
    consistency:
      - with: WEB-034
        note: Same form and statuses.
    sampleData:
      report: {number: CA-1077, item: Phone, colour: Blue, brand: Samsung, where: Kids Club soft play, when: today about 11:30}
    corrections:
      - what: Entry parameter orderId is left from when the screen called getGuestOrderStatus (order tracking on a lost-property screen).
        why: The only entry the screen needs is an optional caseId; an order link is the optional orderRef inside the form.
        source: contracts/satellite/marketing-crm.yaml#listMyCases
      - what: Same LostItem gap as WEB-034.
        why: A report filed only as a case cannot be matched in BO-073.
        source: contracts/satellite/marketing-crm.yaml#recordLostItem

  WEB-046:
    summary: >-
      The guest's in-venue notifications feed on the web: queue calls, order ready, booking changes and venue
      notices, newest first. It is back in the first release (GAP-C1). Web push is weaker than native but not
      absent: a guest with the tab open gets their queue call.
    inputs:
      - field: Unread only
        rule: A filter, not a tab; when it empties the list, say so and offer Show all.
        source: contracts/satellite/marketing-crm.yaml#listMyNotifications
      - field: Venue (multi-venue tenants)
        rule: Defaults to the venue of the site; a guest with bookings at several venues can switch.
        source: contracts/satellite/marketing-crm.yaml#listMyNotifications
    outputs:
      - element: Notification card
        rule: Kind icon, title, one-line body, relative time ("2m ago"), unread dot. Tapping opens its link (an order, a queue ticket, a booking) and marks it read.
        source: DI-042; contracts/satellite/marketing-crm.yaml#/components/schemas/GuestNotification
      - element: Unread count
        rule: Badge on the header bell, from the feed's unread count; Mark all read sets it to 0.
        source: contracts/satellite/marketing-crm.yaml#markMyNotificationsRead
    edgeCases:
      - case: Connection drops
        expected: Notices already received stay; a banner warns that new queue calls may be late. Queue and order screens still poll on their own.
        source: screens/P01-guest-web-storefront.yaml#WEB-046
      - case: A promotional suggestion (a shorter queue nearby, an express pass offer)
        expected: Appears only for a guest with marketing consent for in-app messages; operational calls (your turn, order ready) need no marketing consent.
        source: DI-682; DI-683; DI-378; contracts/satellite/marketing-crm.yaml#/components/schemas/MessageChannel
    consistency:
      - with: GST-030
        note: Same card, same kinds, same wording.
      - with: GST-023
        note: A virtual queue position also shows as a persistent status ("In queue - 25 minutes"); the feed's queue call links to it.
    sampleData:
      notifications:
        - {kind: Queue, title: "Your turn: Tornado Slide", body: Please go to the ride entrance within 10 minutes, time: 2m ago, unread: true}
        - {kind: Order, title: Order 2214 is ready, body: Collect at Beach Grill counter 3, time: 14m ago, unread: true}
        - {kind: Venue, title: Wave pool closed until 16:00, body: Maintenance - lazy river is open, time: 1h ago, unread: false}
    corrections:
      - what: The primary action is "Claim location session" (claimLocationSession, F&B delivery location) with Location code, Seat reference and Party size fields.
        why: That is the F&B ordering step (WEB-036 / GST-024) and has no place on a notifications feed. Remove it.
        source: contracts/satellite/fnb.yaml#claimLocationSession; screens/P01-guest-web-storefront.yaml#WEB-036
      - what: The prototype note still says the screen is deferred (R242).
        why: Superseded by GAP-C1 on 29 September; the note should say it is in the first release.
        source: rev 3 GAP-C1; DI-1075

  GST-030:
    summary: >-
      The app's in-venue notifications feed, the same as WEB-046 and better delivered (native push). It is also
      the place a guest finds a call they missed while the app was closed.
    outputs:
      - element: Feed
        rule: Same cards and rules as WEB-046; the tab bar shows the unread count.
        source: contracts/satellite/marketing-crm.yaml#listMyNotifications
    edgeCases:
      - case: Push permission denied on the device
        expected: A one-line banner explains that queue calls will only show when the app is open, with Open settings.
        source: contracts/satellite/marketing-crm.yaml#registerGuestDevice
      - case: Offline
        expected: Notices already received stay listed; new ones arrive when the connection returns, and the banner warns they may be late.
        source: screens/P02-guest-mobile-app.yaml#GST-030
    consistency:
      - with: WEB-046
        note: Same feed.
    sampleData:
      notifications:
        - {kind: Queue, title: "Your turn: Pearl Diver ride", time: just now}
        - {kind: Booking, title: Your cabana moved to Cabana 12, time: 3h ago}
    corrections:
      - what: Same claimLocationSession attach as WEB-046.
        why: Remove; it belongs to GST-024.
        source: contracts/satellite/fnb.yaml#claimLocationSession
      - what: The prototype note still says deferred (R242).
        why: Superseded by GAP-C1.
        source: rev 3 GAP-C1

  GST-036:
    summary: >-
      The guest's loyalty in the app: tier, points, and what is within reach. It shows a position, not a balance:
      tier, points, pending points, how far to the next tier, and what expires when. A number alone tells a guest
      nothing about whether to come back. Rewards to spend points on, status badges and the referral code belong
      here too.
    inputs:
      - field: Programme (if the guest holds more than one)
        rule: A switcher at the top; one position per programme. A guest may hold positions in several programmes.
        source: contracts/satellite/marketing-crm.yaml#getLoyaltyPosition
      - field: Redeem a reward
        rule: Choose from the rewards catalogue; the cost in points and any tier gate are shown before confirming. Needs the connection.
        source: contracts/satellite/marketing-crm.yaml#redeemLoyaltyPoints; contracts/satellite/marketing-crm.yaml#listRewards
    outputs:
      - element: Position card
        rule: >-
          Tier badge, points balance (spendable), pending points shown separately ("150 pending until your
          refund window ends"), progress bar to the next tier with "660 points to Gold", and expiring points with
          the date. Nothing at the top tier means no progress bar, and that state reads "Top tier".
        source: contracts/satellite/marketing-crm.yaml#getLoyaltyPosition; F53 step 1
      - element: Status badges
        rule: Earned gamification statuses (Explorer, Adventurer, Legend) beside the tier, never confused with it.
        source: DI-392
      - element: Member offers
        rule: Promotions the guest's tier unlocks (e.g. Platinum discount on F&B), from the promotions list; recommendations fill a "For you" slot that stays empty if the engine does not answer in time.
        source: DI-382; contracts/satellite/ai.yaml#decideRecommendations
    actions:
      - action: Get my referral code
        result: >-
          Issues the guest's code and shows it with Share. The reward fires on the friend's qualifying act (first
          purchase, first visit or membership purchase), not on sign-up, and may be points or wallet credit as
          the venue configured.
        source: contracts/satellite/marketing-crm.yaml#createReferral; DI-460
    edgeCases:
      - case: Offline
        expected: The last known balance stays with its age; points earned since are not shown and that is said; redeeming and referring need the connection.
        source: screens/P02-guest-mobile-app.yaml#GST-036
      - case: Points expiring within 30 days
        expected: A warning line on the card with the amount and date; points that lapse unannounced are a complaint.
        source: contracts/satellite/marketing-crm.yaml#getLoyaltyPosition
    consistency:
      - with: WEB-043
        note: Same card, same words, same operations; today the web can redeem and refer and the app cannot (see corrections).
      - with: POS-027
        note: The till shows the same tier and points for this guest, read by staff with getGuestLoyalty / identifyGuest.
      - with: BO-831
        note: Leaderboards show the guest's chosen nickname, never their name.
    sampleData:
      programme: Coastal Aqua Rewards
      position: {tier: Silver, points: 2340, pending: 150, toNext: 660 to Gold, expiring: 150 on 31 Oct 2026}
      badges: ["Explorer"]
      rewards: ["Free locker for a day - 300 points", "Cabana upgrade - 2,500 points (Gold and above)", "20% off at Beach Grill - 800 points"]
      referral: {code: RAHUL-7Q2K, reward: 500 points when your friend makes their first purchase}
    corrections:
      - what: GST-036 lacks redeemLoyaltyPoints and createReferral, which WEB-043 has.
        why: Cross-surface parity; the offline state already says "redeeming and referring need the connection", so the screen expects them.
        source: screens/P01-guest-web-storefront.yaml#WEB-043; screens/P02-guest-mobile-app.yaml#GST-036
      - what: listRewards, listCustomerBadges, listLeaderboard and setLeaderboardNickname are guest-audience operations consumed by no screen.
        why: The rewards catalogue and status badges (DI-392) belong on this screen; the leaderboard nickname belongs here or on BO-831's guest hub.
        source: contracts/satellite/marketing-crm.yaml#listRewards; contracts/satellite/marketing-crm.yaml#listCustomerBadges; contracts/satellite/marketing-crm.yaml#setLeaderboardNickname
      - what: >-
