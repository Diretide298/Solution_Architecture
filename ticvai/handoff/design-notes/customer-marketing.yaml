  POS-027:
    summary: >-
      The cashier finds the guest in front of them and attaches them to the sale, so the sale carries their
      entitlements, wallet and loyalty. The mobile number is the primary key, because a name alone is
      impractical with many guests called Mohammed. A wristband, card or QR resolves in one scan. The one
      thing to get right: when an identifier matches more than one person (a household sharing a phone),
      show every match and let the cashier choose. Never pick one silently, because that is how a sale lands
      on the wrong account.
    inputs:
      - field: Search box (mobile, email, name, booking reference, membership number)
        rule: >-
          Mobile first: the placeholder and the keypad open on digits with +971 prefilled. Name search is offered
          but needs at least 3 characters plus a second criterion (mobile last 4 or date of birth) before results
          show. Matching on personal data needs GUEST_VIEW_PII; a cashier without it can only scan.
        source: DI-784; DI-097; contracts/satellite/marketing-crm.yaml#searchGuests
      - field: Scan (QR, RFID, NFC wristband, membership card, wallet pass)
        rule: >-
          A scan resolves directly without choosing a type; the token kind is inferred from its shape. The result
          says which identifier matched (wristband, phone, email), because a phone match is weaker than a wristband.
        source: contracts/satellite/marketing-crm.yaml#identifyGuest; MATRIX 2.1.24
    outputs:
      - element: Match list
        rule: >-
          Each row shows the name, masked mobile (+971 50 *** 4567), tier badge and last visit. A "probable"
          match on a shared identifier is labelled "Shared phone - check the name" and is never pre-selected.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/GuestIdentification
      - element: Guest panel
        rule: >-
          Wallet balance (cash credit and bonus credit shown apart; bonus is spent first), loyalty tier and
          points, linked family members, RFID or barcode reference, live passes and entitlements, and open
          reservations for today. A barred guest shows a red "Barred from the venue" banner at the top before
          anything else.
        source: DI-097; DI-524; contracts/satellite/marketing-crm.yaml#identifyGuest
      - element: Loyalty for a guest found by search
        rule: >-
          A scan returns loyalty in the same call. A guest picked from a name or phone search is read with
          getGuestLoyalty (the named-guest, staff read). Never use getLoyaltyPosition at a till: that returns the
          caller's own position, and the caller is the cashier.
        source: contracts/satellite/marketing-crm.yaml#getGuestLoyalty; contracts/satellite/marketing-crm.yaml#getLoyaltyPosition
    actions:
      - action: Attach to sale
        result: >-
          Returns to the cart (POS-002) with the guest shown on the cart header. The guest's tier discounts and
          entitlements now apply. The buyer is the person attached; a ticket for someone else (a parent buying a
          child's lesson) carries that person's details on the ticket line.
        source: screens/P04-point-of-sale.yaml#POS-027; DI-787; DI-004
      - action: Create and attach (new guest)
        result: >-
          Inline form with first name, last name, and mobile or email (at least one), plus the venue's configured
          extra fields. Ask "Would you like offers and news?" as an explicit question, unticked; only a spoken yes
          is recorded, with source "pos".
        source: DI-177; DI-372; DI-783; contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentSource
    edgeCases:
      - case: Offline
        expected: >-
          A scanned wristband still resolves against the local entitlement cache. Name and phone search need the
          network and the field says so. Do not show a stale loyalty figure as live.
        source: screens/P04-point-of-sale.yaml#POS-027
      - case: Two guests share the phone number
        expected: Both are listed as probable matches; the cashier asks the name and picks. Nothing is auto-attached.
        source: contracts/satellite/marketing-crm.yaml#identifyGuest
      - case: The guest lost their wristband
        expected: Find the guest by mobile or ID, then move the balance to a new wristband from the wallet screen. Lookup only identifies; it does not move money.
        source: DI-538
      - case: The new guest's mobile already exists on a profile
        expected: The match is offered ("This mobile belongs to Fatima A. - use this profile?") instead of creating a second profile.
        source: DI-784; DI-941
    consistency:
      - with: POS-002
        note: The cart's "Link to sale" field (DI-783) is this same search inline; same result rows and same probable-match label.
      - with: GST-036
        note: Tier name and points must read the same at the till as in the guest's app.
      - with: BO-737
        note: The till panel is a small slice of the Customer 360; same tier badge and wallet split.
    sampleData:
      search: +971 50 123 4567
      matches:
        - {name: Mohammed Al Hammadi, mobile: +971 50 *** 4567, tier: Gold, matchedOn: phone, confidence: probable}
        - {name: Mohammed Al Hammadi (son), mobile: +971 50 *** 4567, tier: none, matchedOn: phone, confidence: probable}
      panel: {wallet: AED 180.00 cash + AED 20.00 bonus (expires 15 Oct 2026), loyalty: Gold - 6,120 points, family: [Noura Al Hammadi, Saif Al Hammadi], wristband: RFID 04A2-91F3, passes: [Annual Pass valid to 31 Mar 2027]}
    corrections:
      - what: >-
          The prototype's "Create and link to sale" (guest enrolment) and wallet top-up (AED 50 to 1,000) have no
          operation on POS-027; no staff operation creates a guest profile, and topUpWallet is declared only on BO-488.
        why: Both are client-verified in the prototype (DI-097 asks for top-up). Declare a staff profile-create operation and topUpWallet here, or move top-up to the till's wallet screen and say so.
        source: screens/P04-point-of-sale.yaml#POS-027; contracts/satellite/wallet.yaml#topUpWallet; DI-097
        status: fixed
        by: CHG-WIR-005
      - what: getLoyaltyPosition lists "POS-002 Sell - Ticket Catalogue" among its consumers.
        why: >-
          At a till the caller is the cashier, so getLoyaltyPosition would return the cashier's own points.
          A named guest's position at the till comes from identifyGuest (loyalty) or getGuestLoyalty. POS-002 (and
          POS-027 for search results) should declare getGuestLoyalty instead (screen change, as decided 1 October).
        source: contracts/satellite/marketing-crm.yaml#getLoyaltyPosition; contracts/satellite/marketing-crm.yaml#getGuestLoyalty
        status: fixed
        by: CHG-WIR-005
      - what: recordConsent is declared guest-audience only, although its description says an agent may record consent on a guest's behalf with GUEST_MANAGE.
        why: A till (and BO-748) cannot record the consent a guest gives in person. Add the staff audience to recordConsent with the agent-recorded rule.
        source: contracts/satellite/marketing-crm.yaml#recordConsent
      - what: Open reservations are not shown on the prototype's guest card.
        why: The panel's purpose names them (visible before the sale, not after); add them to the build.
        source: screens/P04-point-of-sale.yaml#POS-027
    decisions:
    - question: What does the till do with a barred guest (refuse the sale, require a supervisor, or only warn)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Show the red banner and disable "Attach
        to sale" until a supervisor overrides.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-021 | CHG-NOTE-002
      questionSource: contracts/satellite/marketing-crm.yaml#/components/schemas/GuestIdentification

  BO-005:
    summary: >-
      The supervisor watches queues during operation and calls parties forward. From this process's angle, the
      guest messages a queue sends (called, paused, closed) are operational and transactional, not marketing.
      Closing a queue always notifies every waiting guest, and that is not a campaign. The screen's campaign
      controls do not belong here.
    outputs:
      - element: Notified guests after a close or pause
        rule: Show how many waiting guests were released and notified, with the message they received, from the queue status result.
        source: contracts/satellite/queue.yaml#setQueueStatus; F09 step 5
      - element: Called parties
        rule: After Call next, show which parties were called and how many remain; each called party is notified in their app (and signage where configured).
        source: contracts/satellite/queue.yaml#callNextParties
    actions:
      - action: Close queue
        result: >-
          Requires a reason and offers a guest message in English and Arabic (prefilled). Closing without notifying
          is not offered. The guests receive it as an operational notification, with no consent check.
        source: contracts/satellite/queue.yaml#setQueueStatus; DI-019
    consistency:
      - with: GST-030
        note: The call and closure messages arrive in the guest's notification feed with kind Queue.
    sampleData:
      queue: Tornado Slide - standby - 38 waiting - average wait 42 min (sensor)
      closeMessage: Tornado Slide is closed for the rest of today. Your place has been released - try the Lazy River, wait 10 min.
    corrections:
      - what: >-
          BO-005 declares nine campaign operations (createCampaign, launchCampaign, pauseCampaign, stopCampaign,
          testSendCampaign, unscheduleCampaign, updateCampaign, getCampaign, getCampaignPerformance), with
          "Create campaign" as the empty-state action.
        why: >-
          A queue monitor does not run marketing campaigns. The queue's guest notifications come from
          setQueueStatus and callNextParties, and are transactional. F09 step 5 ("confirms guests were notified")
          should read the queue status result or the message dispatches, not listCampaigns. Remove the campaign
          operations from BO-005.
        source: contracts/satellite/queue.yaml#setQueueStatus; F09 step 5; R254
        status: fixed
        by: CHG-WIR-001
      - what: Two primary buttons, "Call next parties" (callNextParties) and "Call next" (no operation).
        why: The same act appears twice; keep one.
        source: screens/P08-venue-back-office.yaml#BO-005

  BO-618:
    summary: >-
      The back office builds the registration form an accreditation applicant fills in (media, corporate,
      individual), without development. The form is a marketing-crm form of kind registration, linked to the
      programme. The customer-marketing rule that matters: a published form version is immutable once anyone has
      submitted against it. A change makes a new version, and the old one stays readable forever.
    inputs:
      - field: Field visibility
        rule: >-
          Each field is Mandatory, Optional, Conditional (shown when another answer matches) or Hidden. This is a
          segmented control per field, not a text box.
        source: screens/P08-venue-back-office.yaml#BO-618; contracts/satellite/marketing-crm.yaml#createForm
      - field: Category
        rule: Each applicant category (media, corporate, individual guest) has its own form; the programme links a category to an event, venue or season.
        source: DI-656
      - field: Signature
        rule: Requiring a signature turns the form into a waiver-like declaration; say so beside the toggle.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/FormDefinition
    outputs:
      - element: Version badge
        rule: "\"Version 3 - published 12 Oct 2026 - 41 submissions\" with \"Editing creates version 4\"."
        source: contracts/satellite/marketing-crm.yaml#createForm
    actions:
      - action: Link to programme
        result: Sets the programme's form; the programme's requirements matrix (not the form) decides what blocks submission and approval.
        source: contracts/satellite/accreditation.yaml#updateAccreditationProgramme
    consistency:
      - with: CMS-043
        note: The waiver and form builder uses the same field palette and the same version behaviour.
    sampleData:
      form: Media accreditation - Coastal Aqua Summer Festival 2026
      fields: ["Full name (mandatory)", "Outlet (mandatory)", "Press card photo (mandatory)", "Camera equipment (conditional - if Photographer)", "Emirates ID (optional)"]
    corrections:
      - what: The screen has createForm but no listForms or getForm, so existing forms cannot be opened or versioned.
        why: listForms ("the builder's list") is consumed by no screen. Add listForms and getForm.
        source: contracts/satellite/marketing-crm.yaml#listForms
        status: fixed
        by: CHG-WIR-005
      - what: Components are a text field labelled "Mandatory / Optional / Conditional / Hidden" and a select labelled "Key requirement - 12.1.2".
        why: The first is a per-field control; the second leaks a matrix reference into the UI (the bundle rule forbids it).
        source: screens/P08-venue-back-office.yaml#BO-618

  BO-755:
    summary: >-
      The marketer builds a rule-based segment that refreshes itself. It shows a live matching count and,
      separately, the REACHABLE count per channel after consent and suppression. A segment of 50,000 with 3,000
      email consents is a 3,000-person campaign, and the builder must say so before anyone plans a send.
    inputs:
      - field: Rules
        rule: >-
          Attribute, operator, value rows (equals, not equals, greater than, less than, between, in, not in,
          exists, not exists, within days). Attributes cover profile, visits, spend, products bought, membership,
          tier, wallet, language, wishlist and behaviour. Match all or any. The purpose asks for nested AND/OR/NOT
          groups (see corrections).
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SegmentCriterion; contracts/satellite/marketing-crm.yaml#createSegment; DI-381
      - field: Wallet balance attribute
        rule: Segments on cash credit only. A separate "credit expiring within N days" rule targets promotional credit about to lapse.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SegmentCriterion
      - field: Household attributes
        rule: A household total must never be messaged to every member. Warn when a portfolio attribute is used in a segment meant for sends.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SegmentCriterion
      - field: Exclude segments
        rule: Pick segments to exclude (e.g. "Complained in the last 30 days"); the exclusions count shows how many each removes.
        source: contracts/satellite/marketing-crm.yaml#createSegment
    outputs:
      - element: Counts
        rule: >-
          Matching count, then reachable per channel (email, SMS, WhatsApp, push) after consent and suppression,
          with "evaluated at 10:42". Reachable is always shown beside matching, never instead of it.
        source: contracts/satellite/marketing-crm.yaml#previewSegment
      - element: Sample guests
        rule: Up to 10 representative guests (masked contact) to sanity-check the rules.
        source: screens/P08-venue-back-office.yaml#BO-755
    actions:
      - action: Save segment
        result: Saves the definition, not a list. It is evaluated whenever it is used, so it cannot go stale.
        source: contracts/satellite/marketing-crm.yaml#createSegment
    edgeCases:
      - case: The rules match nobody
        expected: Show 0 with the rule that removed the most guests highlighted, rather than an empty preview.
        source: designer default
      - case: A restricted attribute (health-adjacent, minors)
        expected: Dietary and accessibility needs and minors' data are refused for marketing segments, with the reason shown.
        source: contracts/satellite/marketing-crm.yaml#updateMyProfile; R205
    consistency:
      - with: BO-754
        note: Segment list and audience intelligence use the same matching and reachable counts.
      - with: BO-767
        note: The campaign's audience step reuses this preview (matching and reachable per channel).
    sampleData:
      name: Lapsed annual pass holders - no visit in 90 days
      rules: ["Membership = Annual Pass (active)", "Last visit not within 90 days", "Language in (Arabic, English)"]
      exclude: ["Complained in the last 30 days"]
      counts: {matching: 4812, email: 2930, whatsapp: 3410, sms: 1206, push: 1880}
    corrections:
      - what: previewSegment works only on a saved segment (POST /segments/{segmentId}/preview).
        why: The purpose asks for a live count while rules are edited. Add a preview that takes unsaved criteria, or save drafts automatically.
        source: contracts/satellite/marketing-crm.yaml#previewSegment
      - what: CreateSegmentRequest supports a flat list of criteria with match all or any; the purpose requires nested AND/OR/NOT groups, effective dates, refresh frequency, ownership, tags and approval.
        why: The contract cannot hold what the builder is specified to build. Either extend the request (rule groups, effective dates, owner, approval) or reduce the purpose.
        source: contracts/satellite/marketing-crm.yaml#createSegment; screens/P08-venue-back-office.yaml#BO-755
      - what: The screen has list states but no list operation (listSegments is not declared here).
        why: Opening an existing segment to edit needs a read. Add listSegments (and a get).
        source: contracts/satellite/marketing-crm.yaml#listSegments
        status: fixed
        by: CHG-WIR-005

  BO-766:
    summary: >-
      The marketer creates a campaign in stages: objective, audience, offer, channels and content, schedule,
      review, activation. Each stage validates before the next. The review stage shows how many guests will
      actually receive it after consent and suppression. Offers come only from the pre-configured offers
      list; nobody types a discount here.
    inputs:
      - field: Objective and success criteria
        rule: Objective (ticket sales, membership, loyalty, wallet, seasonal, retention, capacity, last-minute) and a measurable target, e.g. 80% conversion.
        source: DI-383; screens/P08-venue-back-office.yaml#BO-766
      - field: Kind
        rule: One-off, scheduled, triggered (by an event such as a booking, a visit or a birthday) or recurring.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CampaignKind
      - field: Audience
        rule: One segment (required); the matching and reachable counts from the segment preview are shown on the stage.
        source: contracts/satellite/marketing-crm.yaml#createCampaign; contracts/satellite/marketing-crm.yaml#previewSegment
      - field: Offer
        rule: Picked from pre-configured, system-validated offers (coupon code, dynamic discount or auto-discount link), product-scoped; no free-text discount field exists.
        source: MoM 2026-08-20 4.6
      - field: Consent purpose
        rule: Defaults to marketing; only the purposes the venue configured are offered.
        source: contracts/satellite/marketing-crm.yaml#createCampaign
      - field: Send window
        rule: Start and end hours and time zone (Gulf Standard Time default); nothing promotional sends outside it.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CreateCampaignRequest
      - field: Send time
        rule: Fixed, or optimised per guest inside the window; with optimised, the channel may also be chosen per guest among the channels they consented to.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CreateCampaignRequest
      - field: Variants (A/B)
        rule: Up to 5 variants; with two or more, a test share of 5 to 100% (default 20%) and a success metric. A variant may come from an AI draft that a person edited.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CreateCampaignRequest; contracts/satellite/ai.yaml#proposeMarketingContent
    outputs:
      - element: Review stage
        rule: >-
          Audience matching count, reachable per channel, the exclusions by reason (no consent, suppressed,
          withdrawn since the segment was built), the offer, schedule, variants, and the approval state.
        source: contracts/satellite/marketing-crm.yaml#launchCampaign
    actions:
      - action: Send test
        result: Sends to named staff recipients only, personalised with a sample guest, marked as a test and never counted in performance.
        source: contracts/satellite/marketing-crm.yaml#testSendCampaign
      - action: Launch or schedule
        result: >-
          Consent is checked again at send time. The launch carries the audience size the marketer saw and is
          refused if the segment has grown unexpectedly, so "Audience changed - review again" is a state.
        source: contracts/satellite/marketing-crm.yaml#launchCampaign
      - action: Draft with AI
        result: The AI writes drafts of the subject, body and variants for the channel's length limits; a person edits and applies. Nothing is published by AI.
        source: contracts/satellite/ai.yaml#proposeMarketingContent
    edgeCases:
      - case: The guest's language has no template body
        expected: Flagged at review ("No Arabic version - 1,204 Arabic-speaking guests"); never silently sent in English.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate; DI-019
      - case: Reachable is zero on the chosen channel
        expected: The schedule stage cannot continue; suggest the channels with reach.
        source: contracts/satellite/marketing-crm.yaml#previewSegment
    consistency:
      - with: BO-767
        note: The audience and offer stage is the same component as BO-767.
      - with: BO-768
        note: The channel and content stage is the multichannel composer.
      - with: BO-764
        note: Campaign statuses (draft, scheduled, sending, paused, completed, stopped, failed) read the same in the command centre.
    sampleData:
      campaign: Autumn comeback - annual pass holders
      objective: Retention - 15% of lapsed pass holders visit by 30 Nov 2026
      segment: Lapsed annual pass holders - no visit in 90 days (matching 4,812; email 2,930; WhatsApp 3,410)
      offer: COMEBACK20 - 20% off F&B on next visit (pre-configured)
      schedule: Thu 15 Oct 2026, window 10:00-20:00 GST, optimised send time
      variants: ["A - \"We miss you at Coastal Aqua\"", "B - \"Your pass misses you too\""]
    corrections:
      - what: The screen's create action is createInvitationCampaign ("Create invitation campaign").
        why: >-
          An invitation campaign is a special addressed, quota-bounded invitation (press night). The Campaign
          Builder's purpose is the general campaign, which is createCampaign (CreateCampaignRequest), plus
          launchCampaign and testSendCampaign. Wire those; keep invitations on their own screen.
        source: contracts/satellite/marketing-crm.yaml#createInvitationCampaign; contracts/satellite/marketing-crm.yaml#createCampaign
        status: fixed
        by: CHG-WIR-005
      - what: CreateCampaignRequest has no objective, success target, owner, brand, products or budget fields, and no offer reference.
        why: The purpose and DI-383 require them, and the offer must be a reference to a pre-configured offer. Add them or reduce the purpose.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CreateCampaignRequest; DI-383; MoM 2026-08-20 4.6

  BO-785:
    summary: >-
      The library of reusable message templates per channel and purpose (marketing, ticketing, reservation,
      membership, loyalty, wallet, operational). Every template has a body per enabled language. A missing
      Arabic body is flagged, never silently replaced by English, because a guest who chose Arabic and gets
      English has met a defect.
    inputs:
      - field: Channel and kind
        rule: Email, SMS, WhatsApp, push, in-app; transactional vs marketing is a property of the template, and a transactional template cannot hold promotional blocks.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate; contracts/satellite/marketing-crm.yaml#/components/schemas/MessageChannel
      - field: Bodies per language
        rule: English and Arabic side by side; the Arabic editor is right-to-left; email subjects per language. Merge fields from a picker, never typed.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate; DI-019
      - field: Provider template id
        rule: Required where the provider needs a pre-approved template (WhatsApp); shown only for that channel.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/MessageTemplate
      - field: Header, logo and footer
        rule: Configurable per channel and brand, with the sender identity (from and reply-to) shown read-only from the brand settings.
        source: DI-560
    outputs:
      - element: Missing languages
        rule: Each template row shows a warning chip listing enabled languages with no body.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/MessageTemplate
      - element: Preview
        rule: Rendered with test data in both directions (EN left-to-right, AR right-to-left), with SMS segment count and WhatsApp limits.
        source: screens/P08-venue-back-office.yaml#BO-785; DI-019
    actions:
      - action: Translate with AI
        result: Fills missing languages as drafts on the template; protected terms (ride names, brand, tier names) come from the glossary and are not translated. A person reviews before use.
        source: contracts/satellite/ai.yaml#proposeTranslations
    consistency:
      - with: BO-677
        note: The communication template library appears to be the same library; see corrections.
      - with: ADM-041
        note: System transactional templates owned by the platform are listed read-only beside the venue's own.
    sampleData:
      templates:
        - {code: TKT-CONFIRM, channel: Email, kind: Transactional, languages: EN AR, status: Active}
        - {code: MKT-AUTUMN, channel: WhatsApp, kind: Marketing, languages: EN (AR missing), status: Draft}
      mergeFields: ['{{guest.firstName}}', '{{order.number}}', '{{venue.name}}']
    corrections:
      - what: Only listMessageTemplates and createMessageTemplate are wired; the purpose requires edit, version, approval, clone, archive, compare and change history.
        why: No update, version or archive operation for message templates exists in the contract. Add them, or reduce the purpose to list and create.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate; screens/P08-venue-back-office.yaml#BO-785
      - what: BO-785 Template Library and BO-677 Communication Template Library both list message templates.
        why: They look like one screen in two places; decide whether BO-677 is the platform-wide view or merge them.
        source: contracts/satellite/marketing-crm.yaml#listMessageTemplates

  BO-825:
    summary: >-
      The marketer defines a challenge, mission or streak: what a guest must do (visit, spend, ride, collect,
      streak, refer, survey, social, milestone, scan, activity, purchase), for whom, by when, and for what reward.
      Gamification is not loyalty. A challenge pays for behaviour spend does not produce, such as a second
      visit, a quiet Tuesday, or a ride nobody rides.
    inputs:
      - field: Action
        rule: One of the challenge kinds; scan, activity and purchase are kept from the client pack beside the contract's kinds.
        source: contracts/satellite/marketing-crm.yaml#createChallenge; screens/P08-venue-back-office.yaml#BO-825
      - field: Scope
        rule: Individual, family, group or team; a family challenge counts the linked family's progress together.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/Challenge
      - field: Reward
        rule: A reward from the rewards catalogue, points, or a badge; a reward budget cap is validated before activation.
        source: screens/P08-venue-back-office.yaml#BO-825
      - field: Guest-facing text and image
        rule: Name and terms in English and Arabic; image from the asset library.
        source: DI-019; screens/P08-venue-back-office.yaml#BO-825
    outputs:
      - element: Validation
        rule: Overlapping rules with another live challenge, the reward budget, and legal terms are checked before activation; each problem names the other challenge.
        source: screens/P08-venue-back-office.yaml#BO-825
    consistency:
      - with: BO-829
        note: Family, team and event challenges are this builder with scope preset.
      - with: GST-036
        note: Guests see progress as "2 of 3 visits", never just the outcome.
    sampleData:
      challenge: Autumn Explorer - visit 3 times between 1 Oct and 30 Nov 2026
      scope: Individual
      reward: Explorer badge + 500 points
      terms: One reward per guest; visits on the same day count once.
    corrections:
      - what: No list or read operation for challenges exists (only createChallenge and the guest's getMyChallenges), but the screen has list states.
        why: A builder that cannot reopen a draft cannot govern "from objective through publication". Add listChallenges and getChallenge, and an activate step.
        source: contracts/satellite/marketing-crm.yaml#createChallenge

  BO-827:
    summary: >-
      The loyalty administrator sets how guest actions earn points: base points, multipliers, daily and monthly
      caps, validity, rounding and when points post. The rules are edited and saved as ONE set, so a live
      programme is never half-changed. The ratio between earning and redemption is what the administrator is
      reasoning about, so both are on screen together.
    inputs:
      - field: Earn rules
        rule: Per action (visit, purchase, scan, activity, referral, survey) with base points, multiplier, caps per day and month, rounding, and posting timing.
        source: screens/P08-venue-back-office.yaml#BO-827
      - field: Campaign rules
        rule: Bonus and multiplier rules scoped to a dated campaign window (e.g. double points in Ramadan).
        source: contracts/satellite/marketing-crm.yaml#setLoyaltyRules; contracts/satellite/marketing-crm.yaml#setLoyaltyCampaign
      - field: Tiers and redemption rules
        rule: Shown with the earn rules, because a tier-gated redemption is meaningless without the tiers (500 points off for Gold).
        source: contracts/satellite/marketing-crm.yaml#setLoyaltyRules
    outputs:
      - element: Ratio hint
        rule: For each redemption, show how many qualifying actions it takes ("2,500 points = 50 visits").
        source: contracts/satellite/marketing-crm.yaml#getLoyaltyRules
    actions:
      - action: Save rules
        result: Replaces the programme's rule set as a whole, or not at all; the response is the new set.
        source: contracts/satellite/marketing-crm.yaml#setLoyaltyRules
    edgeCases:
      - case: Points are a liability
        expected: Show that points post to the ledger when earned, not when redeemed, so raising earn rates raises the liability immediately.
        source: contracts/satellite/marketing-crm.yaml#createLoyaltyProgramme
    consistency:
      - with: BO-828
        note: Rewards and milestones are configured on BO-828; their points costs appear here read-only for the ratio.
    sampleData:
      programme: Coastal Aqua Rewards
      earn: ["Visit - 50 points (max 1 a day)", "Purchase - 1 point per AED 10 (rounded down)", "Survey completed - 20 points"]
      campaign: Ramadan double points - 1 Mar to 30 Mar 2027 - x2 on F&B
    corrections:
      - what: getLoyaltyRules ("every rule a loyalty programme runs on") is consumed by no screen; BO-827 can replace the set but cannot read it.
        why: A whole-set replace without reading the current set erases rules. Add getLoyaltyRules.
        source: contracts/satellite/marketing-crm.yaml#getLoyaltyRules
        status: fixed
        by: CHG-WIR-005
      - what: The primary action is "Create loyalty programme" (createLoyaltyProgramme) on a rules screen that enters with a programmeId.
        why: The screen's act is editing that programme's rules. Programme creation belongs on the programme list.
        source: screens/P08-venue-back-office.yaml#BO-827
        status: fixed
        by: CHG-WIR-005
    decisions:
    - question: Full loyalty configuration (tiers, earn and redemption rules, expiry) is pending a dedicated workshop.
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Sample rules above; points expire 12 months
        after being earned.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-018 | CHG-NOTE-002
      questionSource: DI-382

  SUP-002:
    summary: >-
      The support agent's home: their cases and live conversations, what is due, and their own availability.
      Cases are governed by an SLA by case type, so due and breached work is first. Conversations (people
      waiting now, measured in seconds) and cases (work measured in hours) are separate lists.
    inputs:
      - field: My availability
        rule: Available, busy, away or offline, and how many conversations at once. It expires on its own, so an agent who forgets to go offline is not routed work overnight.
        source: contracts/satellite/marketing-crm.yaml#setAgentAvailability
      - field: Case filters
        rule: Mine, unassigned, my team; status; SLA breached; priority. Assignee is a choice (me, unassigned, a person), never a typed id.
        source: contracts/satellite/marketing-crm.yaml#listCases
    outputs:
      - element: Case list
        rule: >-
          Breached first, then due soonest. Each row shows case number (venue prefix plus sequence), guest, topic,
          status, priority, and SLA due as a countdown. SLA time paused while awaiting the guest is shown as paused.
        source: DI-539; contracts/satellite/marketing-crm.yaml#/components/schemas/Case; F05 step 1
      - element: Conversations waiting
        rule: Queued conversations (a person waiting) are separate from those with the assistant; wait time in seconds.
        source: contracts/satellite/marketing-crm.yaml#listConversations; contracts/satellite/marketing-crm.yaml#/components/schemas/ConversationState
      - element: Counts
        rule: Total cases, due today, breached, and my load against my maximum.
        source: DI-539
    actions:
      - action: Reply or add a note
        result: The composer requires choosing "Reply to guest" or "Internal note" each time and shows who will see it.
        source: contracts/satellite/marketing-crm.yaml#addCaseMessage; F05 step 2
      - action: Escalate
        result: Needs a reason; may reassign and raise priority.
        source: contracts/satellite/marketing-crm.yaml#escalateCase
    consistency:
      - with: SUP-004
        note: Same queue rows and SLA countdown.
      - with: SUP-005
        note: The composer's reply/note choice is the same component.
      - with: BO-804
        note: The back office's case command centre shows the same counts.
    sampleData:
      agent: {name: Aisha Rahman, state: Available, max: 3}
      cases:
        - {number: CA-1042, guest: Fatima Al Mansoori, topic: Lost property, status: Open, priority: Normal, due: 1h 20m}
        - {number: CA-1019, guest: Rahul Menon, topic: Refund request, status: Awaiting guest, priority: High, due: paused}
        - {number: CA-0998, guest: Omar Haddad, topic: Complaint, status: Escalated, priority: Urgent, due: breached 25m ago}
      conversations: ["{channel: WhatsApp, guest: Priya Nair, waiting: 0m 48s}"]
    corrections:
      - what: The case filters are text fields ("Assigned to principal id", "Status", "Priority").
        why: An agent cannot type a principal id; these are choices.
        source: screens/P12-support-agent-console.yaml#SUP-002
      - what: emptyFirstRun reads "No agent yet. Offers Add case message".
        why: Pattern-derived nonsense; the empty state is "No cases assigned to you - you are available for new work".
        source: screens/P12-support-agent-console.yaml#SUP-002

  CMS-013:
    summary: >-
      Control how a page, product, event or venue appears in search and when shared: title, description,
      canonical, slug, hreflang, Open Graph, schema type and noindex. Metadata is generated by default and
      overridable, because a venue with 400 products will not write 400 descriptions. Changing a slug is a
      redirect, not an edit.
    inputs:
      - field: Page (entity)
        rule: Pick the page (content page, product, event, performance, membership, promotion, venue) from a search, never by id.
        source: contracts/satellite/marketing-crm.yaml#setSeoMetadata
      - field: Language
        rule: One tab per enabled locale (English, Arabic); hreflang pairs are generated from the tabs.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SeoMetadata; DI-019
      - field: Title and description
        rule: Counters at about 60 and 160 characters; a "Generated" badge until edited, with Revert to generated.
        source: contracts/satellite/marketing-crm.yaml#setSeoMetadata
      - field: Slug
        rule: Human-readable. Editing a live slug warns that a 301 redirect from the old address will be created.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SeoMetadata; contracts/satellite/marketing-crm.yaml#createUrlRedirect
      - field: Hide from search
        rule: A toggle (noindex) with the consequence stated.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SeoMetadata
    outputs:
      - element: Previews
        rule: A search-result snippet and a social share card, in both languages.
        source: designer default
    consistency:
      - with: BO-842
        note: Same fields and the redirect behaviour; BO-842 owns the redirect list.
    sampleData:
      entity: Product - Coastal Aqua Day Pass
      en: {title: Coastal Aqua Day Pass - Dubai Water Park Tickets, slug: day-pass}
      ar: {title: تذكرة يوم كوستال أكوا - حديقة مائية في دبي, slug: day-pass-ar}
    corrections:
      - what: The form is raw SeoMetadata fields, including id, entityKind, entityId, scopePath, isAutoGenerated and openGraph as text fields.
        why: Ids and scope are system fields, the entity is picked, and Open Graph is a small group of fields (title, description, image). Rebuild as above.
        source: screens/P13-white-label-cms.yaml#CMS-013
      - what: getSeoMetadata (the metadata in force for one page) is consumed by no screen.
        why: The editor must load what is in force before saving. Add getSeoMetadata.
        source: contracts/satellite/marketing-crm.yaml#getSeoMetadata
        status: fixed
        by: CHG-WIR-005
      - what: A slug change needs createUrlRedirect, declared only on BO-842.
        why: The redirect must be created when the slug is changed here.
        source: contracts/satellite/marketing-crm.yaml#createUrlRedirect
        status: fixed
        by: CHG-WIR-005

  CMS-018:
    summary: >-
      The venue manages the legal texts every consent is captured against (terms, privacy, cookie, refund
      policies), the consent purposes and their channels, and the booking consent questions ("Are you able to
      swim?", "I accept the risk"). It also holds a read-only record of every answer. Every change is a new
      version, never an edit, because a guest who consented to version 3 consented to version 3.
    inputs:
      - field: Policy text
        rule: >-
          Rich text in English AND Arabic (both required before publishing). "Ask guests to agree again" is
          required for material changes. The effective date can be in the future.
        source: contracts/satellite/white-label.yaml#setPolicy; R096
      - field: Consent purposes
        rule: >-
          Per purpose, the channels it covers, whether it is required for service (transactional only), and the
          notice version in force. Adding a purpose does not grant it to existing guests; they are asked.
        source: contracts/satellite/marketing-crm.yaml#setConsentPurposes
      - field: Consent question
        rule: >-
          Kind (swim, scuba, risk, custom), text and help text per language, asked per person or once per
          booking, required or not, and which answer blocks the booking.
        source: contracts/satellite/marketing-crm.yaml#createConsentQuestion; DI-1062
      - field: Refund policy display
        rule: The tiered refund text guests see (e.g. no refund under 24h, 50% at 24-48h, 100% over 48h) comes from back-office rules and is shown, not retyped.
        source: DI-192
    outputs:
      - element: Version history
        rule: Every published version of each policy, newest first, with publisher and date; any old version can be opened.
        source: contracts/satellite/white-label.yaml#listPolicies; R163
      - element: Consent records
        rule: What was asked (and at which version), the answer, for whom, by whom and when. Superseded answers carry their superseded date. Read-only.
        source: contracts/satellite/marketing-crm.yaml#listConsentAnswers
    actions:
      - action: Save as new version (consent question)
        result: Changing text, scope, required or blocking answer raises the version; answers already given keep theirs. Carts ask the new version on their next read.
        source: contracts/satellite/marketing-crm.yaml#updateConsentQuestion
      - action: Retire question
        result: Stops it being asked on every product and flow it is attached to; answers stay on record.
        source: contracts/satellite/marketing-crm.yaml#updateConsentQuestion
    edgeCases:
      - case: A privacy notice is republished with "ask again"
        expected: Guests whose consent was given against the old version see "needs renewing" on their profile and are asked on next launch.
        source: contracts/satellite/white-label.yaml#setPolicy; contracts/satellite/marketing-crm.yaml#getGuestConsents
    consistency:
      - with: CMS-028
        note: Privacy notice and terms versions are also managed on CMS-028; the two screens must share one version history.
      - with: WEB-011
        note: The questions defined here are the ones asked at the details step.
    sampleData:
      policies: ["Terms of sale v7 (12 Sep 2026)", "Privacy notice v4 (1 Oct 2026, ask again)", "Cookie policy v2", "Refund policy v3"]
      question: "{kind: Swim, text: Are you able to swim?, textAr: هل تستطيع السباحة؟, scope: per person, required: yes, blocking: No}"
    corrections:
      - what: emptyFirstRun says the screen "offers no create action - this screen declares no operation that makes one".
        why: The screen declares setPolicy, setConsentPurposes and createConsentQuestion. The empty state should offer them.
        source: screens/P13-white-label-cms.yaml#CMS-018
      - what: Two permission families on one screen (policies need TENANT_CONFIGURE; purposes and questions need GUEST_MANAGE).
        why: A role with one and not the other must see the other section hidden or read-only (DI-387), not a broken page.
        source: DI-387; contracts/satellite/white-label.yaml#listPolicies

  CMS-025:
    summary: >-
      The registry of every cookie, SDK, pixel and storage key on the venue's channels, including the mobile app
      and embedded checkout. It runs on the strictest posture: anything not strictly necessary needs consent
      before it loads, and a technology a scan detects is blocked until an administrator classifies and approves it.
    inputs:
      - field: Technology
        rule: Name, provider, domain or app and version, type (first-party cookie, third-party cookie, mobile SDK, analytics tracker, advertising pixel, session technology, etc.), category, purpose, expiry.
        source: contracts/satellite/marketing-crm.yaml#setTrackingTechnology
      - field: Consent required
        rule: Can be off only for strictly necessary; otherwise the save is refused with the reason.
        source: contracts/satellite/marketing-crm.yaml#setTrackingTechnology
      - field: Scan schedule
        rule: Per channel and domain or app, daily, weekly, monthly or off, and who is alerted on a new finding.
        source: contracts/satellite/marketing-crm.yaml#setCookieScanPolicy
    outputs:
      - element: Status
        rule: Detected (blocked, needs review) first, then approved, blocked and retired. Retired rather than deleted, because the registry is evidence of what a site did on a date.
        source: contracts/satellite/marketing-crm.yaml#listCookieTrackingDigital
      - element: Scan runs
        rule: Each run with source, channel, findings, newly detected and missing counts.
        source: contracts/satellite/marketing-crm.yaml#listCookieScans
      - element: Where a scan comes from
        rule: A bought scanner API (hybrid) runs the scheduled scans and feeds recordCookieScan; the manual "Upload scan report"
          path stays for a venue that scans elsewhere. The source column says Scanner or Upload per run. The banner, its runtime,
          the registry and the consent logs stay TICVAI's own.
        source: decided 2 October 2026 by Chinmay (CHG-NOTE-002)
    consistency:
      - with: CMS-026
        note: Approved technologies appear in the banner's preference centre per category.
      - with: WEB-024
        note: Guests see only approved technologies, with name, provider, purpose, expiry and party.
    sampleData:
      technologies:
        - {name: _ga, provider: Google, type: Analytics tracker, category: Analytics, status: Approved, expiry: 400 days}
        - {name: fbp, provider: Meta, type: Advertising pixel, category: Marketing, status: Detected - blocked}
        - {name: ticvai_consent_key, provider: TICVAI, type: First-party cookie, category: Strictly necessary, status: Approved}
    corrections:
      - what: The action bar holds "Analytics Tracker", "Embedded Service" and "Other tracking technology" as buttons.
        why: These are technology types (a filter or the type field), not actions. The action is Add technology (setTrackingTechnology).
        source: screens/P13-white-label-cms.yaml#CMS-025
    decisions:
    - question: Is the scanner bought or built (CF-127)?
      decision: 'Cookie scanner: buy a scanner API (hybrid). Our banner, runtime, registry and consent logs stay; a bought
        scanner API feeds recordCookieScan; the manual ''Upload scan report'' path stays.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-019 | CHG-NOTE-002
      questionSource: contracts/satellite/marketing-crm.yaml#recordCookieScan

  CMS-026:
    summary: >-
      A no-code designer for the cookie banner and preference centre, one design per brand and channel, each
      saved as a new version and published through privacy testing and approval. The posture is fixed:
      "Reject non-essential" is always offered and one click, every non-essential category starts off, and
      strictly necessary is always on with a description.
    inputs:
      - field: Channel and brand
        rule: B2C website, customer portal, mobile app, embedded checkout, white-label site, partner microsite. A brand inherits the corporate design and overrides only approved elements.
        source: contracts/satellite/marketing-crm.yaml#setCookieBannerDesign
      - field: Title and body
        rule: Text per language (English, Arabic required); text fields, not selects.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CookieBannerPreferenceCenterDesignerView; DI-019
      - field: Position and theme
        rule: Top, bottom, pop-up or modal; theme from the brand.
        source: contracts/satellite/marketing-crm.yaml#setCookieBannerDesign
      - field: Regulatory regimes
        rule: Where CCPA/CPRA is selected, the "Do not sell or share" link is shown.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/DeviceConsentAction
    outputs:
      - element: Live preview
        rule: Desktop and mobile, English and Arabic (right-to-left), banner and preference centre.
        source: MATRIX 2.6.52; DI-019
    actions:
      - action: Save version
        result: Saved as a draft. A design with one-click reject off, a non-essential category on by default, or a missing strictly-necessary description is refused, with the reason shown.
        source: contracts/satellite/marketing-crm.yaml#setCookieBannerDesign
      - action: Send for approval
        result: Opens privacy testing and approval (CMS-030); publishing happens there.
        source: contracts/satellite/marketing-crm.yaml#approvePrivacyTesting
    consistency:
      - with: CMS-025
        note: Category descriptions list the approved technologies from the registry.
    sampleData:
      design: Coastal Aqua - B2C website - v3 draft
      title: We use cookies
      titleAr: نحن نستخدم ملفات تعريف الارتباط
      buttons: ["Accept all", "Reject non-essential", "Choose"]
    corrections:
      - what: Title, Description, Buttons, Links and Category descriptions are select fields.
        why: They are localised texts and lists; the "Buttons" are fixed by the posture (Accept all, Reject non-essential, Choose), not chosen.
        source: screens/P13-white-label-cms.yaml#CMS-026
      - what: The primary action is "Additional configured languages".
        why: The act is Save version; languages are tabs.
        source: screens/P13-white-label-cms.yaml#CMS-026

  BO-073:
    summary: >-
      Staff match what was lost to what was handed in, and hand it back. The match is the capability: a guest
      reports a lost phone, a cleaner hands one in, and without both sides in one register somebody searches by
      hand. Lost and found items are one entity in two directions (lost, found).
    inputs:
      - field: Record found item
        rule: Kind, colour, brand, description, where found, when, photos, storage location; the "dispose after" date defaults from the venue's retention setting.
        source: contracts/satellite/marketing-crm.yaml#recordLostItem; DI-380
      - field: Filters
        rule: Lost or found, status, kind, date range, area.
        source: designer default
    outputs:
      - element: Register
        rule: Two columns of the same list (Lost reports, Found items), with possible matches linked between them and a match score with its reasons (kind, colour, place, time).
        source: contracts/satellite/marketing-crm.yaml#listLostItems; contracts/satellite/marketing-crm.yaml#getLostItemMatches
    actions:
      - action: Match
        result: Ties a report to a found item; the guest's case shows "Possible match" and asks them to confirm.
        source: contracts/satellite/marketing-crm.yaml#matchLostItem
      - action: Claim and return
        result: Records the claimant (verified against the report) and the hand-back; the case is resolved.
        source: contracts/satellite/marketing-crm.yaml#matchLostItem
      - action: Dispose
        result: After the dispose-after date only; needs a note.
        source: contracts/satellite/marketing-crm.yaml#matchLostItem
    consistency:
      - with: WEB-034
        note: The guest's report and status words match the register.
      - with: EMP-028
        note: Stewards hand items in from the staff app; they appear here as found.
    sampleData:
      lost: {ref: L-2026-0311, kind: Bag, colour: Black, brand: Herschel, where: Wave Pool loungers, when: 26 Sep 15:00, case: CA-1042}
      found: {ref: F-2026-0587, kind: Bag, colour: Black, where: Lockers B, when: 26 Sep 16:40, storage: Guest Services shelf 3, disposeAfter: 26 Oct 2026}
      matchReason: Same kind and colour, 200 m apart, 1h 40m later
    corrections:
      - what: getLostItemMatches ("candidate matches, scored") is consumed by no screen; the "Find matches" button is wired to matchLostItem, which ties, claims, returns or disposes.
        why: The register cannot suggest matches. Wire getLostItemMatches to the find action and keep matchLostItem for the decisions.
        source: contracts/satellite/marketing-crm.yaml#getLostItemMatches; contracts/satellite/marketing-crm.yaml#matchLostItem
        status: fixed
        by: CHG-WIR-005
      - what: recordLostItem is not on BO-073, so staff cannot hand in a found item here.
        why: The register needs its "found" side. Add recordLostItem.
        source: contracts/satellite/marketing-crm.yaml#recordLostItem
      - what: Guest reports are cases (raiseMyCase) and never become LostItem rows.
        why: See WEB-034; without it the register's "lost" side is empty.
        source: contracts/satellite/marketing-crm.yaml#raiseMyCase
      - what: emptyNoResults says "listLostItems takes no filter".
        why: A register with hundreds of items needs filters (lost or found, status, kind, date). Add filter parameters.
        source: contracts/satellite/marketing-crm.yaml#listLostItems

  BO-107:
    summary: >-
      The section landing for Guests & Marketing in the back office. It should route a CRM officer or marketer to
      the guest directory, segments, campaigns, journeys, communications, cases, VOC and loyalty, and show what
      needs attention. RBAC decides which tiles are visible: a role without Journeys does not see the tile at all.
    outputs:
      - element: Tiles
        rule: One per sub-area the role can see (hidden areas disappear; view-only areas open read-only). Counts appear only when a summary operation supplies them.
        source: DI-387; R283
      - element: Campaigns
        rule: Recent campaigns with status and sent count; a status filter.
        source: contracts/satellite/marketing-crm.yaml#listCampaigns
    actions:
      - action: Create campaign
        result: Opens the Campaign Builder (BO-766) rather than a one-shot modal, because a campaign needs audience, offer, consent and schedule stages.
        source: screens/P08-venue-back-office.yaml#BO-766
    consistency:
      - with: BO-734
        note: The CRM command centre is the CRM half of this landing; avoid two landings with different counts.
    sampleData:
      tiles: ["Guests 48,210", "Segments 37", "Campaigns 4 live", "Journeys 6 active", "Open cases 23", "Reviews to moderate 9"]
    corrections:
      - what: The landing's navigation exits only to BO-068 Audit Log, BO-073 Lost & Found and BO-091 AI Policy & Spend.
        why: None of the CRM and marketing screens (BO-734 onwards, BO-754, BO-764, BO-774, BO-784, BO-804, BO-814, BO-824) is reachable from the section landing.
        source: screens/P08-venue-back-office.yaml#BO-107
      - what: The "Create campaign" modal collects the whole CreateCampaignRequest in one form.
        why: Campaign creation is staged (BO-766); a single modal skips the consent and reach review.
        source: screens/P08-venue-back-office.yaml#BO-766

  BO-118:
    summary: >-
      Campaign and audience management from the client's POS board (POS-4D): the list of campaigns and segments
      with headline counts, and creation. From this process's angle it is a lighter command centre than BO-764
      and must show the same statuses and reach.
    outputs:
      - element: Headline tiles
        rule: Campaigns by status, segments count, and reach (reachable guests) for the selected segment.
        source: contracts/satellite/marketing-crm.yaml#listCampaigns; contracts/satellite/marketing-crm.yaml#listSegments
    consistency:
      - with: BO-764
        note: Same campaign list and statuses; consider one screen.
    sampleData:
      campaigns: ["Autumn comeback (scheduled 15 Oct)", "Kids Club half-term (sending, 61% delivered)", "Members' Night (completed)"]
    corrections:
      - what: Sale boards (listSaleBoards, updateSaleBoard) - POS layouts - sit on a campaign screen.
        why: A sale board is a workstation layout (WORKSTATION_CONFIGURE); it has nothing to do with campaign and audience management. Remove them.
        source: contracts/spine/tenancy.yaml#updateSaleBoard
        status: fixed
        by: CHG-WIR-005
      - what: BO-118 and BO-764 overlap (campaign list plus create).
        why: Two campaign command centres will drift. Merge them or define BO-118 as the POS-context view.
        source: screens/P08-venue-back-office.yaml#BO-764

  BO-120:
    summary: >-
      Configuration of automated guest journeys and recommendation touchpoints across channels (from the retail
      board, frame ret-5g). It lists journeys and starts new ones. A journey is created as a draft and activation
      is a separate act, because a half-drawn journey that starts sending is worse than one that never starts.
    outputs:
      - element: Journey list
        rule: Name, template (abandoned cart, membership, loyalty, wallet, birthday, onboarding, win-back, custom), entry event, status (draft, active, paused, archived), entrants this week.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/Journey
    actions:
      - action: Create journey
        result: Opens the visual builder (BO-775) with the template's steps; nothing sends until activated.
        source: contracts/satellite/marketing-crm.yaml#createJourney
    consistency:
      - with: BO-774
        note: Journey automation centre shows the same list; one of them is redundant.
    sampleData:
      journeys: ["Abandoned cart - membership only (active)", "Birthday reward (active)", "Win-back 120 days (draft)"]
    corrections:
      - what: The "Create journey" modal asks for id, status and scopePath.
        why: System fields; a journey is created in draft from a template in the builder.
        source: screens/P08-venue-back-office.yaml#BO-120
      - what: The client design input for this board is recommendation touchpoints (cart, checkout, post-purchase per channel) with a guest-view preview, which are recommendation strategy operations, not marketing journeys.
        why: The screen is wired to journeys only; recommendation strategies live on the ADM recommendation screens.
        source: DI-961; contracts/satellite/promotions.yaml#updateRecommendationStrategy
    decisions:
    - question: Is BO-120 a marketing-journey screen or the recommendation touchpoint configuration from the 21 September
        board?
      decision: 'Drawn default accepted: Marketing journeys list; recommendation touchpoints stay on the ADM recommendation
        screens.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-277 | CHG-NOTE-002
      reviewable: true
      questionSource: DI-961

  BO-121:
    summary: >-
      Personalised offers and guest engagement: pick a segment and reach it with an offer. From this process's
      angle the two rules are these. Never re-offer what a guest declined, whether on the same channel or
      another. And show response, conversion and drop-off by strategy (AI versus rule-based).
    outputs:
      - element: Segments with reach
        rule: Each segment with matching and reachable counts.
        source: contracts/satellite/marketing-crm.yaml#listSegments; contracts/satellite/marketing-crm.yaml#previewSegment
      - element: Offer performance
        rule: Response rate, drop-off, purchases and conversion per offer, split by AI-based and rule-based.
        source: DI-963
    edgeCases:
      - case: A guest declined the same offer three times or bought it elsewhere
        expected: The guest is excluded from the offer on every channel; the exclusion count shows "declined before".
        source: DI-962; contracts/satellite/ai.yaml#recordRecommendationEvents
    consistency:
      - with: BO-766
        note: Create campaign opens the builder with the segment preselected.
    sampleData:
      segment: Gold members with no F&B spend in 60 days (matching 1,240; WhatsApp 980)
      offer: Free karak with any meal (pre-configured)
    corrections:
      - what: The screen's purpose is personalised offers, but it is wired only to listSegments and createCampaign.
        why: Offer performance (DI-963) and decline suppression (DI-962) need the recommendation analytics and decline store; add those reads or narrow the purpose.
        source: DI-963; DI-962

  BO-734:
    summary: >-
      The CRM command centre: the health of the guest base at a glance, with every number drilling down to the
      guests behind it. Totals (all, new, active, inactive, registered vs guest-checkout), indicator counts
      (VIP, high value, family, corporate, churn risk, possible duplicates, incomplete profiles), lifetime value,
      and consent health. Segmentation by source (individual, corporate, group, travel agent, OTA) is the
      client's own example.
    outputs:
      - element: Base totals
        rule: Total, new this period, active, inactive, registered and guest-checkout profiles, with period comparison; each tile opens the directory filtered to it.
        source: DI-370; screens/P08-venue-back-office.yaml#BO-734
      - element: Consent health
        rule: Share of guests reachable for marketing per channel (consent given), and consents needing renewal after a notice change. Never a single "opted in" figure.
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents; DI-378
      - element: Possible duplicates
        rule: Count awaiting review, linking to BO-746; labelled "possible duplicates", not "duplicates".
        source: DI-377; contracts/satellite/marketing-crm.yaml#listDuplicateCandidates
      - element: By source
        rule: Individual, corporate, group, travel agent, OTA.
        source: DI-370
    consistency:
      - with: BO-735
        note: Every tile drills into the directory with the matching filter applied and named.
      - with: BO-107
        note: The section landing's guest counts must equal these.
    sampleData:
      totals: {all: 48210, new30d: 1932, active: 21480, inactive: 26730, guestCheckout: 9120}
      indicators: {vip: 412, churnRisk: 3105, possibleDuplicates: 512, incomplete: 7880}
      consent: {email: 61%, whatsapp: 54%, sms: 22%, needsRenewal: 1204}
      ltv: AED 1,240.00 average lifetime value
    corrections:
      - what: The screen declares only searchGuests and listSegments; no operation returns the counts, trends or indicators the purpose lists.
        why: A command centre needs a summary read. Add a CRM summary operation, or the tiles cannot be built (R283 already bars counts without a summary operation).
        source: screens/P08-venue-back-office.yaml#BO-734; R283

  BO-735:
    summary: >-
      The guest directory: find any guest by name, email, mobile, guest id, external id, ticket, booking,
      membership or loyalty number, filter the population, and act on one record (amend, adjust points, merge)
      or open the Customer 360. Personal fields are returned only to staff holding GUEST_VIEW_PII; everyone
      else sees an opaque reference and behaviour, and the table must render that honestly.
    inputs:
      - field: Search
        rule: One box for all identifiers; matching on personal data needs GUEST_VIEW_PII, so without it the box accepts only ids and membership or loyalty numbers and says so.
        source: contracts/satellite/marketing-crm.yaml#searchGuests
      - field: Filters
        rule: Status, segment, consent for a purpose (hasConsentFor), language, tier, LTV band, churn risk; saved views; filters always named and clearable.
        source: contracts/satellite/marketing-crm.yaml#searchGuests; screens/P08-venue-back-office.yaml#BO-735
      - field: Adjust points
        rule: Type goodwill, correction or expiry reversal; amount; reason required. It changes the balance only, never tier or lifetime points, and appears in the loyalty ledger report.
        source: contracts/satellite/marketing-crm.yaml#adjustLoyaltyPoints; R149
      - field: Amend profile
        rule: Staff field set (wider than the guest's); at least one of email or mobile remains; the change is audited.
        source: contracts/satellite/marketing-crm.yaml#updateGuestProfile; DI-372
    outputs:
      - element: Guest row
        rule: Name (or masked reference without PII permission), masked contact, tier, last visit, LTV, flags (VIP, possible duplicate, incomplete).
        source: contracts/satellite/marketing-crm.yaml#searchGuests
      - element: Loyalty panel
        rule: Read with getGuestLoyalty (the staff read of a named guest), per programme.
        source: contracts/satellite/marketing-crm.yaml#getGuestLoyalty
      - element: Consent history
        rule: Every decision oldest first, with purpose, channel, decision, source, notice version and time; read-only evidence.
        source: contracts/satellite/marketing-crm.yaml#getConsentHistory
    actions:
      - action: Merge into this profile
        result: >-
          Confirmation shows both records with what transfers (orders, cases, loyalty per programme added and higher
          tier kept, consent taking the more restrictive position) and that the other record is superseded, not
          deleted. It never runs from a bulk selection.
        source: contracts/satellite/marketing-crm.yaml#mergeGuestProfiles; R149; DI-808
      - action: Export
        result: Controlled export; needs PII permission and is audited.
        source: screens/P08-venue-back-office.yaml#BO-735
    consistency:
      - with: BO-746
        note: Merging is the same decision as on Duplicate Review and must use the same confirmation and the same operation.
      - with: BO-737
        note: Opening a row goes to the Customer 360.
    sampleData:
      rows:
        - {name: Fatima Al Mansoori, contact: +971 50 *** 4567, tier: Gold, lastVisit: 26 Sep 2026, ltv: AED 4,860.00, flags: [VIP]}
        - {name: Priya Nair, contact: priya.n@ex***.ae, tier: Bronze, lastVisit: 2 Jun 2026, ltv: AED 310.00, flags: [Churn risk]}
      adjustment: Goodwill +500 points - slide closed during visit, case CA-1019
    corrections:
      - what: Two merge operations exist - mergeGuestProfiles (BO-735) and mergeGuests (BO-746, EMP-057).
        why: One decision, two operations; their rules on consent and loyalty may drift. Keep one merge operation.
        source: contracts/satellite/marketing-crm.yaml#mergeGuestProfiles; contracts/satellite/marketing-crm.yaml#mergeGuests
      - what: adjustLoyaltyPoints requires LEDGER_POST, a finance permission.
        why: A CRM officer granting goodwill points would need ledger posting rights. Confirm the permission (points are a liability, so finance may be intended).
        source: contracts/satellite/marketing-crm.yaml#adjustLoyaltyPoints

  BO-736:
    summary: >-
      Configure the guest data model without development: standard and custom attributes, field groups, types,
      defaults, required and unique flags, either/or rules, identifiers, survivorship and completeness scoring,
      and visibility by role. Every change is a version, because a field whose meaning changed in March makes
      every earlier value ambiguous.
    inputs:
      - field: Required rules
        rule: Per field required, optional or either/or. Email and mobile are an either/or pair by default and cannot both be made optional.
        source: DI-372; DI-371
      - field: Custom field
        rule: Label in English and Arabic, type, options, unique flag; nationality and country of residence are separate fields.
        source: DI-371; contracts/satellite/marketing-crm.yaml#setGuestExtraFields
      - field: Remove an option
        rule: Options are set as a whole list; removing one still held by guests shows how many hold it before saving.
        source: contracts/satellite/marketing-crm.yaml#setGuestExtraFields
      - field: Group profile fields
        rule: Group profiles (group name, description, contact person) are configured separately from individuals.
        source: DI-371
    outputs:
      - element: Version history
        rule: Each saved model version with author, date and changed fields.
        source: contracts/satellite/marketing-crm.yaml#setGuestAttributeModel
    sampleData:
      fields: ["First name (required)", "Last name (required)", "Email or Mobile (either/or)", "Nationality (optional, list)", "Country of residence (optional)", "Emirates ID (unique, optional)"]
      version: Model v6 - 30 Sep 2026 - added "Preferred park area"

  BO-737:
    summary: >-
      One guest on one page: identity, contacts, preferences, household, organisation, memberships, loyalty,
      wallet, tickets, bookings, visits, LTV, churn risk, whether they can be contacted (per channel and
      purpose), open cases, pending waivers and recent activity, with quick actions. Communication eligibility
      is shown before any "send" action is offered.
    outputs:
      - element: Header
        rule: Name, tier badge, flags (VIP, minor, possible duplicate), preferred language and channel, and a contactability strip (Email Given, WhatsApp Not asked, SMS Withdrawn).
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents; screens/P08-venue-back-office.yaml#BO-737
      - element: Value and risk
        rule: LTV, engagement tier (new, active, occasional, lapsing, lapsed, dormant) and churn risk, each with its reasons; AI-derived values labelled as such.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/GuestProfile; contracts/satellite/marketing-crm.yaml#getGuestIntelligence
      - element: Portfolio
        rule: Entitlements, wallet balance and restrictions in one list, the same view the guest app shows.
        source: DI-667
    actions:
      - action: Send a message
        result: Offered only on channels where the purpose is permitted; transactional resends are always allowed.
        source: DI-378
      - action: Create case
        result: Opens case creation with the guest attached.
        source: contracts/satellite/marketing-crm.yaml#createCase
    consistency:
      - with: SUP-010
        note: The service 360 in the Support Console is the same guest view; same header and contactability strip.
      - with: POS-027
        note: Same tier badge and wallet split.
    sampleData:
      guest: {name: Omar Haddad, tier: Silver, language: Arabic, channel: WhatsApp, ltv: AED 2,145.00, engagement: lapsing, churnRisk: High - no visit in 140 days, last visit spend down 40%}
      openCases: ["CA-0998 Complaint - escalated"]
      waivers: ["Deep Dive waiver v3 - not signed"]
    corrections:
      - what: The 360 is wired to listCustomerServiceProfile (the support service view) and listCustomerSegmentProfile (catalogue pricing eligibility rules).
        why: Segment pricing rules are not a guest view. The CRM 360 needs getGuestProfile, getGuestLoyalty, getGuestTimeline, getGuestConsents and getGuestIntelligence; reuse the service view only for the support panel.
        source: contracts/spine/catalogue.yaml#listCustomerSegmentProfile; contracts/satellite/marketing-crm.yaml#getGuestTimeline
        status: fixed
        by: CHG-WIR-005

  BO-738:
    summary: >-
      Everything one guest did, in order, across the platform: purchases, scans, reservations, visits,
      membership changes, loyalty, wallet, campaigns, messages, cases, surveys and waivers. Operational facts,
      staff notes and AI-derived events are visibly different kinds of entry.
    inputs:
      - field: Filters
        rule: Date range, channel, venue, event type, source system, outcome.
        source: screens/P08-venue-back-office.yaml#BO-738
    outputs:
      - element: Timeline entry
        rule: Time (venue time zone), icon by kind, one-line description, source and a link to the source record; AI-derived entries carry an "AI" tag and model version; notes show their author.
        source: contracts/satellite/marketing-crm.yaml#getGuestTimeline; screens/P08-venue-back-office.yaml#BO-738
    sampleData:
      entries:
        - 26 Sep 2026 15:02 - Scan - Coastal Aqua main gate - admitted
        - 26 Sep 2026 13:40 - Purchase - Beach Grill - AED 86.00 - 86 points
        - 20 Sep 2026 09:00 - Message - Autumn comeback (WhatsApp) - read
        - 21 Sep 2026 - AI - Churn risk raised to High (model churn-v2)
    corrections:
      - what: The timeline screen declares getGuestIntelligence (scores) and not getGuestTimeline, while BO-743 AI Guest Intelligence declares getGuestTimeline and not getGuestIntelligence.
        why: The two reads are swapped between the screens. Put getGuestTimeline on BO-738 and getGuestIntelligence on BO-743.
        source: contracts/satellite/marketing-crm.yaml#getGuestTimeline; contracts/satellite/marketing-crm.yaml#getGuestIntelligence
        status: fixed
        by: CHG-WIR-005

  BO-740:
    summary: >-
      Households, dependants and guardians, linked without merging anyone. Each person keeps their own profile;
      the link carries authority (who may buy, book, manage the profile or sign waivers for a minor), effective
      dates, and whether benefits and communications are shared. Wallet balances can be shared across a linked
      family, so a parent's top-up is spent from a child's wristband.
    inputs:
      - field: Relationship
        rule: Parent, guardian, spouse, dependant, with effective from and to dates.
        source: contracts/satellite/marketing-crm.yaml#setGuestRelationships; DI-373
      - field: Authority for a minor
        rule: Purchasing, booking, profile management, waiver signing, each a separate permission; a guest with no date of birth counts as a minor.
        source: screens/P08-venue-back-office.yaml#BO-740; R205
      - field: Shared wallet and spending limit
        rule: Whether the family shares the wallet, and a daily limit per dependant (guests can also set this themselves).
        source: MoM 2026-08-20 4.1; DI-530
    outputs:
      - element: Household card
        rule: Each member as their own profile chip, with relationship, authority icons, and "shared wallet" when on. Messages to one member are never addressed to the household.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SegmentCriterion
    sampleData:
      household: Al Suwaidi family
      members: ["Khalid (guardian - booking, waiver signing)", "Mariam (daughter, 9 - AED 100 a day)", "Saeed (son, 6 - AED 50 a day)"]
    corrections:
      - what: The screen's only write is updateGuestPreferences ("Save guest preferences").
        why: Family linking is getGuestRelationships and setGuestRelationships (declared on BO-741). Wire them here.
        source: contracts/satellite/marketing-crm.yaml#setGuestRelationships
        status: fixed
        by: CHG-WIR-005

  BO-741:
    summary: >-
      Link guests to organisations: corporate accounts, schools, tour operators, travel agencies, resellers,
      clubs, teams, event groups. Each link has a role, billing relationship, booking authority and validity
      period. Linking never merges people.
    inputs:
      - field: Organisation link
        rule: Organisation, participant role (contact, booker, member, teacher), billing relationship, booking authority, valid from and to.
        source: contracts/satellite/marketing-crm.yaml#setGuestRelationships
      - field: Corporate onboarding status
        rule: Company profile (name, address, trade licence, VAT certificate), then admin approval or rejection, then rates and credentials.
        source: DI-375
    outputs:
      - element: Organisation view
        rule: Members, their bookings and memberships, agreements; respecting the organisation's access boundary.
        source: screens/P08-venue-back-office.yaml#BO-741
    consistency:
      - with: BO-740
        note: Same relationship component, different kinds.
    sampleData:
      organisation: Al Noor International School (school)
      links: ["Ms Hana Yousef - teacher", "booking authority", "Ahmed Saleh - finance contact", "invoice"]

  BO-742:
    summary: >-
      The guest's commercial, service and document history in tabs: tickets, reservations, memberships, loyalty,
      wallet, refunds, exchanges, transfers, upgrades, attendance, communications, cases, surveys, reviews,
      waivers, ID documents and signed agreements. Each row links to its source with status, value, channel and
      time.
    outputs:
      - element: Documents tab
        rule: Kind, uploaded by, date, retain-until date (always present), and access is PII-permissioned; signed waivers open at the exact version signed.
        source: contracts/satellite/marketing-crm.yaml#uploadGuestDocument; contracts/satellite/marketing-crm.yaml#createForm
    sampleData:
      tickets: ["Coastal Aqua Day Pass x3 - 26 Sep 2026 - used"]
      documents: ["Emirates ID - retain until 31 Dec 2027", "Deep Dive waiver v3 - signed 26 Sep 2026"]
    corrections:
      - what: The screen's only operation is setGuestRelationships ("Save guest relationships").
        why: A history screen needs reads (orders, entitlements, wallet, cases, documents); relationship editing belongs on BO-740/BO-741.
        source: contracts/satellite/marketing-crm.yaml#setGuestRelationships; screens/P08-venue-back-office.yaml#BO-742
        status: fixed
        by: CHG-WIR-005

  BO-743:
    summary: >-
      Explainable insight for one guest and for audiences: historical and predicted LTV, engagement, churn,
      cancellation, affinity, upgrade propensity, and the recommended next action. Every score shows its
      contributing factors, confidence, model and version, and the recommendation respects consent and
      eligibility before it is offered.
    outputs:
      - element: Score card
        rule: Score, band, top contributing factors in plain words, confidence, model name and version, last computed.
        source: contracts/satellite/marketing-crm.yaml#getGuestIntelligence
      - element: Next best action
        rule: A proposal with expected impact and why; actions a human accepts. A recommendation on a channel without consent is not shown.
        source: screens/P08-venue-back-office.yaml#BO-743; DI-378
    sampleData:
      guest: Omar Haddad
      churn: {score: 0.78, band: High, factors: [No visit in 140 days, Annual pass expires 30 Nov 2026, Complaint unresolved], model: churn-v2}
      nextAction: Offer pass renewal with 10% member discount on WhatsApp (consent given)
    corrections:
      - what: Declares getGuestTimeline and uploadGuestDocument but not getGuestIntelligence.
        why: See BO-738; and uploading documents has nothing to do with AI insight.
        source: contracts/satellite/marketing-crm.yaml#getGuestIntelligence; contracts/satellite/marketing-crm.yaml#uploadGuestDocument
        status: fixed
        by: CHG-WIR-005

  BO-744:
    summary: >-
      The data-governance overview: data quality, possible duplicates, pending merges, consent coverage and
      expiring consent, data requests with their legal deadlines, retention actions and privacy incidents.
      Overdue and high-risk items come first, each drilling into its governing record.
    outputs:
      - element: Deadlines
        rule: Data requests by days left on the statutory clock; privacy incidents by hours left (72 hours from discovery under UAE PDPL).
        source: contracts/satellite/marketing-crm.yaml#recordPrivacyIncident; DI-379
      - element: Duplicates
        rule: Candidates awaiting a decision, oldest first.
        source: contracts/satellite/marketing-crm.yaml#listDuplicateCandidates
    consistency:
      - with: CMS-031
        note: The CMS privacy operations centre covers the same queue; numbers must match.
    sampleData:
      tiles: {possibleDuplicates: 512, consentExpiring30d: 860, openRequests: 7, overdueRequests: 1, incidents: 0}

  BO-745:
    summary: >-
      How possible duplicates are detected and which values survive a merge: weighted exact, normalised and fuzzy
      rules on email, phone, name (with Arabic and English transliteration variants), date of birth, membership,
      loyalty, passport and external ids. Three thresholds - match, possible match, no match - and a simulation
      before activation.
    inputs:
      - field: Rule rows
        rule: Attribute, method (exact, normalised, fuzzy), weight.
        source: contracts/satellite/marketing-crm.yaml#setIdentityResolutionRules; DI-376
      - field: Thresholds
        rule: Match, possible match, no match. Even a "match" goes to a person; nothing merges automatically except repeat guest checkouts on the same verified email or phone.
        source: contracts/satellite/marketing-crm.yaml#setIdentityResolutionRules; DI-377; DI-941
    outputs:
      - element: Simulation
        rule: How many pairs each threshold would flag on current data (e.g. 500 profiles, about 100 matched by mobile).
        source: DI-376
    sampleData:
      rules: ["Mobile exact (normalised to +971) - weight 40", "Email exact - 40", "Name fuzzy incl. transliteration (Mohammed/Muhammad) - 15", "Date of birth exact - 5"]
      thresholds: {match: 85, possible: 60}

  BO-746:
    summary: >-
      Trained staff review possible duplicates side by side and merge, reject or split them. Profiles are never
      merged automatically. The guest is notified of a likely duplicate and confirms; this admin queue runs
      alongside. Rejection is as valuable as merging, because a rejected pair is not proposed again.
    outputs:
      - element: Side-by-side comparison
        rule: Both records with conflicting values highlighted, the recommended master value with its confidence and provenance, and what is linked to each (tickets, bookings, memberships, loyalty, wallet, cases, consents, documents).
        source: contracts/satellite/marketing-crm.yaml#listDuplicateCandidates
      - element: Match reason
        rule: Each candidate shows why it matched (same mobile, similar name), never a bare score.
        source: DI-808
      - element: Guest confirmation status
        rule: Whether the guest was notified and confirmed, declined or has not answered.
        source: DI-377
    actions:
      - action: Merge
        result: The losing record is superseded, not deleted, and is reversible for 30 days; consent takes the narrower position; loyalty per programme points added and higher tier kept.
        source: DI-808; R149; contracts/satellite/marketing-crm.yaml#mergeGuests
      - action: Not the same person
        result: Records the rejection so the pair is not proposed again.
        source: contracts/satellite/marketing-crm.yaml#decideDuplicateCandidate
      - action: Split
        result: Separates a record that wrongly holds two people's history.
        source: contracts/satellite/marketing-crm.yaml#decideDuplicateCandidate
    consistency:
      - with: EMP-057
        note: The floor's merge prompt uses the same reasons and confirmation.
      - with: BO-735
        note: Same merge confirmation.
    sampleData:
      pair: ["Mohammed Al Hammadi - +971 50 123 4567 - mo.hammadi@example.ae", "Muhammad Alhammadi - +971 50 123 4567 - no email"]
      reason: Same mobile; name transliteration variant
      guestResponse: Notified by WhatsApp 28 Sep 2026 - not answered
    corrections:
      - what: getGuestMatchPolicy and setGuestMatchPolicy (how returning guests are recognised at checkout) sit on this review screen.
        why: They configure checkout matching, a policy setting that belongs with identity resolution (BO-745) or checkout configuration.
        source: contracts/satellite/marketing-crm.yaml#setGuestMatchPolicy
        status: fixed
        by: CHG-WIR-005
    decisions:
    - question: How is the guest notified of a likely duplicate and asked to confirm (push or email), and which operation
        records their answer?
      decision: 'Drawn default accepted: Show the guest response column as "Not available" until an operation exists.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-278 | CHG-NOTE-002
      reviewable: true
      questionSource: DI-377

  BO-747:
    summary: >-
      The legal and operational rules of consent: purposes, marketing categories, channels (email, SMS, WhatsApp,
      push, post), lawful basis, age and guardian requirements, capture channels, expiry, renewal and
      enforcement. Guests who have not opted in must not receive promotional communications.
    inputs:
      - field: Purpose
        rule: One of marketing, personalisation, profiling, third-party sharing, AI processing, transactional; channels covered; whether required for service; notice version.
        source: contracts/satellite/marketing-crm.yaml#setConsentPurposes; contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentPurpose
      - field: Adding a purpose
        rule: Existing guests are asked; the new purpose is "Not asked" for everyone until they answer.
        source: contracts/satellite/marketing-crm.yaml#setConsentPurposes
    consistency:
      - with: CMS-023
        note: The CMS consent purpose builder edits the same purposes; one of the two must own them.
    sampleData:
      purposes: ["Marketing - email", "SMS", "WhatsApp", "push - optional", "Transactional - email", "SMS", "WhatsApp - required for service", "Third-party sharing - email - optional"]
    corrections:
      - what: BO-747 and CMS-022/CMS-023/CMS-024 configure consent purposes and permissions.
        why: The same configuration on two platforms will diverge. Name one owner (proposal - CMS, as the privacy configuration home) and make the other read-only.
        source: contracts/satellite/marketing-crm.yaml#setConsentPurposes

  BO-748:
    summary: >-
      The consent statements guests see and the evidence of what each guest agreed to: multilingual text, links,
      effective dates, channels; and who consented, what they saw, when, where, by which channel and against which
      version. Withdrawal, expiry, re-consent and guardian authorisation never overwrite earlier evidence.
    outputs:
      - element: Evidence row
        rule: Guest, purpose, channel, decision, source (app, website, checkout, POS, call centre, import, agent-recorded, cookie banner), notice version, time; append-only.
        source: contracts/satellite/marketing-crm.yaml#getConsentHistory; contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentSource
    actions:
      - action: Record consent for a guest (agent)
        result: Staff record a consent a guest gave in person or by phone; recorded as agent-recorded with the agent's name.
        source: contracts/satellite/marketing-crm.yaml#recordConsent
    sampleData:
      statement: Offers and news v4 (EN/AR) - effective 1 Oct 2026
      evidence: ["Sarah Thompson - Marketing - WhatsApp - Given - checkout - v4 - 1 Oct 2026 18:22"]
    corrections:
      - what: recordConsent is guest-audience only, but this staff screen calls it.
        why: Add the staff audience with the agent-recorded rule (see POS-027).
        source: contracts/satellite/marketing-crm.yaml#recordConsent
        status: logged
        by: CHG-WIR-007
      - what: listVersioningEffectiveDate (waiver form versions) is wired as the consent version list.
        why: Waiver versions are not consent statement versions; the consent statement versions are policy versions (listPolicies) and purpose notice versions.
        source: contracts/satellite/marketing-crm.yaml#listVersioningEffectiveDate; contracts/satellite/white-label.yaml#listPolicies
        status: fixed
        by: CHG-WIR-005

  BO-749:
    summary: >-
      Configure the guest-facing preference centre: subscription categories, topics, channels, contact frequency,
      quiet hours, brand-level and global opt-outs. Transactional messages are visibly distinct from optional
      marketing. Changes reach campaigns, journeys, chatbot, newsletters and notifications in real time, and
      every change has an auditable receipt.
    inputs:
      - field: Preference category
        rule: Code, name (EN/AR), channel, brand, default (always off for marketing).
        source: contracts/satellite/marketing-crm.yaml#setCommunicationPreferenceMarketing; DI-954
      - field: Quiet hours and frequency cap
        rule: Hours no promotional message is sent, and a maximum per week.
        source: screens/P08-venue-back-office.yaml#BO-749
    consistency:
      - with: GST-065
        note: The categories configured here are the lists guests see on GST-065 and WEB-027.
      - with: CMS-024
        note: Same configuration as CMS-024; one owner.
    sampleData:
      categories: ["Coastal Aqua news - email", "WhatsApp", "Member offers - email", "Kids Club events - email"]
      quietHours: 21:00-09:00 GST
      cap: 2 marketing messages a week

  BO-750:
    summary: >-
      The privacy request queue from intake to verified completion: access, rectification, portability, erasure,
      restriction, objection. Identity verified, statutory deadline calculated, owner assigned, systems searched,
      the package assembled with exclusions documented, and the requester informed.
    outputs:
      - element: Queue row
        rule: Reference, type, requester (guest, guardian or representative), received date, deadline with days left, status (submitted, in progress, completed), owner.
        source: contracts/satellite/marketing-crm.yaml#listDataSubjectCustomer; DI-379
    actions:
      - action: Assemble export
        result: Discovery across systems, export package, corrections routed; another guest's data sharing a booking is excluded.
        source: contracts/satellite/marketing-crm.yaml#setDataDiscoveryAccess; contracts/spine/identity.yaml#exportSubjectData
    consistency:
      - with: CMS-034
        note: The CMS privacy request screen is the same queue (listDataSubjectCustomer); one owner.
      - with: GST-066
        note: The guest sees the same reference and status.
    sampleData:
      requests: ["DR-2026-00431 - Erasure - Rahul Menon - due 31 Oct 2026 - Submitted", "DR-2026-00412 - Access - Sarah Thompson - due 31 Oct 2026 - In progress"]
    corrections:
      - what: BO-750 and CMS-034 both read listDataSubjectCustomer; setPrivacyRequest ("raise or progress a privacy request") is consumed by no screen.
        why: The queue cannot move a request through its statuses. Wire setPrivacyRequest and pick one owning screen.
        source: contracts/satellite/marketing-crm.yaml#setPrivacyRequest
        status: fixed
        by: CHG-WIR-005

  BO-751:
    summary: >-
      How long guest data is kept and what happens at expiry (archive, anonymise, pseudonymise, delete), by data
      class, with legal holds and exceptions. Retention is a tenant setting per data class, with platform defaults
      shown as defaults. A pass is previewed before it runs, and it produces completion evidence.
    inputs:
      - field: Period per data class
        rule: Each class always listed; unset classes show the platform default marked "default". Conversation history default one month, extendable; live data 3-5 years before archival as the example.
        source: contracts/spine/tenancy.yaml#listDataRetentionSettings; DI-380
    actions:
      - action: Preview pass
        result: Counts affected per class and dependencies before anything changes.
        source: contracts/satellite/marketing-crm.yaml#runDataRetention
      - action: Execute pass
        result: Runs and stores completion evidence; legal holds are skipped and listed.
        source: contracts/satellite/marketing-crm.yaml#runDataRetention
    sampleData:
      classes: ["Guest profile (inactive) - 5 years - anonymise", "Chat history - 1 month (default) - delete", "Guest documents - end of purpose - delete"]
    corrections:
      - what: Retention is set in two places - setDataRetentionPolicy (marketing-crm) and setDataRetentionSetting (tenancy), both on this screen.
        why: Decided 29 September that retention is a tenant setting per data class; the marketing-crm policy should derive from it or be removed.
        source: contracts/spine/tenancy.yaml#setDataRetentionSetting; contracts/satellite/marketing-crm.yaml#setDataRetentionPolicy
        status: fixed
        by: CHG-WIR-005

  BO-752:
    summary: >-
      Privacy incidents and approved AI uses of guest data. An incident records type, severity, affected data,
      containment, notification obligations and closure; the 72-hour PDPL clock starts at discovery, not
      occurrence. AI governance lists approved models and use cases, prohibited data, purpose limits and when a
      human must review.
    inputs:
      - field: Discovered at
        rule: Required; starts the 72-hour notification clock.
        source: contracts/satellite/marketing-crm.yaml#recordPrivacyIncident
    outputs:
      - element: Incident clock
        rule: Hours left to notify, red under 12.
        source: contracts/satellite/marketing-crm.yaml#recordPrivacyIncident
    sampleData:
      incident: {type: Email sent to wrong recipient list, discovered: 1 Oct 2026 10:15, affected: 214 guests (names, emails), deadline: 4 Oct 2026 10:15}
      aiUse: Churn scoring - approved - no health data - human review for any offer above AED 500

  BO-753:
    summary: >-
      Evidence that consent and privacy are complied with: consent coverage and expiry, request volumes and SLA,
      retention completion, anonymisation and deletion, incident trends. Drill-down by jurisdiction, channel,
      policy and owner, with controlled evidence packages for auditors.
    outputs:
      - element: Audit trail
        rule: Immutable list of privacy events (consent given or withdrawn, preference changed, policy accepted, request handled) with source references and timestamps.
        source: contracts/satellite/marketing-crm.yaml#listPrivacyEvidenceCompliance
    consistency:
      - with: CMS-039
        note: Same audit trail; one owner.
    sampleData:
      kpis: {requestsOnTime: 96%, consentCoverageEmail: 61%, retentionPassesCompleted: 12 of 12}

  EMP-057:
    summary: >-
      A server sees who is at the table: profile, allergies and notes, dining history, and possible duplicates.
      A restaurant creates a duplicate every time someone books by phone with a different number, so the floor is
      where the match is proposed. The merge is always the server's confirmed decision, never automatic.
    inputs:
      - field: Note
        rule: Allergy (flagged prominently), seating preference, last-visit complaint, the regular's usual.
        source: contracts/satellite/marketing-crm.yaml#addGuestNote
    outputs:
      - element: Possible duplicates
        rule: Each candidate with its match reason (same mobile, similar name), never a bare score.
        source: DI-808; contracts/satellite/marketing-crm.yaml#matchGuest
      - element: Dining history
        rule: This guest's orders, newest first (this guest's orders only; never a staff filter screen).
        source: contracts/spine/orders.yaml#listOrders
    actions:
      - action: Merge these two records
        result: Confirmation states the losing record is superseded not deleted, reversible for 30 days, and consent takes the narrower position.
        source: DI-808; contracts/satellite/marketing-crm.yaml#mergeGuests
    consistency:
      - with: BO-746
        note: Same match reasons and merge confirmation.
    sampleData:
      guest: {name: Priya Nair, notes: [ALLERGY - shellfish, Prefers terrace, Complained about slow service 12 Sep]}
      duplicate: Priya N. - +971 55 210 9981 - same email
    corrections:
      - what: The order list exposes staff filters (Venue id, Principal id, Shift id, Status) as text fields.
        why: On a guest profile the list is this guest's orders; those filters belong to the order screens.
        source: screens/P06-staff-app.yaml#EMP-057

  KSK-013:
    summary: >-
      The kiosk guest presses one always-visible button to get a person, without leaving the kiosk. The kiosk
      (not the guest) opens and closes the assist session, and the guest can always end it.
    outputs:
      - element: Waiting state
        rule: "\"Help is on the way\" with the kiosk number, and an option to keep using the kiosk."
        source: F57 step 4; F75 step 7
    actions:
      - action: End assistance
        result: Ended by staff, guest or timeout; the record says who.
        source: contracts/satellite/marketing-crm.yaml#endKioskAssist
    sampleData:
      kiosk: Kiosk 4 - Main gate
    corrections:
      - what: Only endKioskAssist is declared; nothing starts the assist session or notifies staff.
        why: The screen's purpose is to call a person; add the operation that opens the assist session (KioskAssistSession).
        source: contracts/satellite/marketing-crm.yaml#endKioskAssist; contracts/satellite/marketing-crm.yaml#/components/schemas/KioskAssistSession

  EMP-028:
    summary: >-
      A steward logs something handed in, on the floor, so it can be matched to a guest's report and returned. The
      guest who lost it and the steward who found it end up in one conversation, and the case is closed with the
      guest told, not silently.
    inputs:
      - field: Found item
        rule: Kind, colour, brand, where found, photo (camera), where it is stored.
        source: contracts/satellite/marketing-crm.yaml#recordLostItem
    actions:
      - action: Hand in
        result: Works offline (the found record is offline-capable) and syncs; shows the reference to write on the tag.
        source: contracts/satellite/marketing-crm.yaml#recordLostItem
    consistency:
      - with: BO-073
        note: Items logged here appear in the register as found.
    sampleData:
      item: {kind: Phone, colour: Blue, brand: Samsung, where: Kids Club soft play, stored: Guest Services drawer 2, ref: F-2026-0612}
    corrections:
      - what: EMP-028 is wired to the case operations (createCase, listCases with staff filters), while LostItem and recordLostItem exist for exactly this.
        why: F70 step 3 says "lost and found is a case, not a separate register", contradicting LostItem ("one entity, two directions") and BO-073. Decide which model holds; the matching only works with LostItem.
        source: F70 step 3; contracts/satellite/marketing-crm.yaml#recordLostItem

  EMP-029:
    summary: >-
      A floor employee helps a guest without leaving the floor: checks for an existing case first, raises or
      updates one, or reports an incident when someone is hurt or something is unsafe. A guest asking twice about
      the same thing is not asked to explain it twice.
    outputs:
      - element: Existing cases
        rule: The guest's open cases appear first when the guest is identified.
        source: F70 step 1
    actions:
      - action: Report incident
        result: For harm or safety (regulatory weight), separate from a service case.
        source: contracts/satellite/maintenance.yaml#reportIncident
      - action: Reply or note
        result: Explicit choice between reply to guest and internal note.
        source: contracts/satellite/marketing-crm.yaml#addCaseMessage; F05 step 2
    sampleData:
      case: CA-1088 - Question - Is the wave pool open? - resolved on the spot
    corrections:
      - what: The case list exposes staff text filters (Assigned to principal id, Priority).
        why: On a phone the filters are Mine and Near me; ids are never typed.
        source: screens/P06-staff-app.yaml#EMP-029

  PTR-004:
    summary: >-
      The partner's notifications: messages about the partner's own bookings and their delivery status.
      Transactional messages are not marketing and are sent under contract performance, so no marketing consent
      applies, but the partner can never send marketing through this path.
    outputs:
      - element: Delivery status
        rule: Queued, sent, delivered, read, failed (with reason and the fallback channel used).
        source: contracts/satellite/marketing-crm.yaml#getMessageStatus
    sampleData:
      message: Booking confirmation - Desert Tours LLC group of 24 - WhatsApp - delivered 1 Oct 2026 11:05
    corrections:
      - what: The purpose ("Work with notifications for this venue") is a template, and the primary action sends a transactional message.
        why: A partner portal's notifications page is a feed of messages to the partner; sending to guests from it needs a stated use case. Reword the purpose and confirm the send action.
        source: screens/P10-partner-reseller-portal.yaml#PTR-004
        status: fixed
        by: CHG-WIR-006

  PTR-021:
    summary: >-
      The partner raises and follows support cases with the venue (booking issues, settlement questions). The
      partner sees only its own cases and only replies addressed to it, never internal notes.
    outputs:
      - element: Case list
        rule: Number, subject, status, last update; awaiting the partner emphasised.
        source: contracts/satellite/marketing-crm.yaml#listCases
    sampleData:
      cases: ["CA-1102 - Settlement for September not received - In progress"]
    corrections:
      - what: The partner screen exposes staff controls (Assigned to principal id filter, Escalate, Save case with status and assignee).
        why: A partner should raise, read and reply; assignment and status are venue-side.
        source: screens/P10-partner-reseller-portal.yaml#PTR-021
        status: fixed
        by: CHG-WIR-005

  BO-938:
    summary: >-
      Frontline employees request resource help from the employee app (replacement, extra equipment, issue,
      maintenance, assignment or venue change, schedule clarification). It is an internal request, not a guest case.
    sampleData:
      request: Replacement resource - Life jackets x10 for Station B - urgent
    corrections:
      - what: raiseMyCase (a guest-only operation for guest cases) is declared beside raiseResourceRequest.
        why: An employee request is not a guest case; remove raiseMyCase.
        source: contracts/satellite/marketing-crm.yaml#raiseMyCase; contracts/satellite/resources.yaml#raiseResourceRequest
        status: fixed
        by: CHG-WIR-005

  BO-754:
    summary: >-
      The health of the addressable audience: total guests against reachable guests, active segments,
      consent-eligible audience, high-value and churn-risk populations, and how audiences overlap. Reachable is
      the number that matters and it is always smaller than the total; the screen leads with it.
    outputs:
      - element: Reachable by channel
        rule: Per channel, guests with consent, a valid address and no suppression; shown beside the total, never alone.
        source: contracts/satellite/marketing-crm.yaml#getAudienceOverlap; contracts/satellite/marketing-crm.yaml#previewSegment
      - element: Overlap
        rule: A matrix of selected segments with the shared count, so two campaigns do not hit the same guests unknowingly.
        source: contracts/satellite/marketing-crm.yaml#getAudienceOverlap
      - element: Segment health
        rule: Stale (not used in 90 days), shrinking, high-performing, each linking to its definition.
        source: screens/P08-venue-back-office.yaml#BO-754
    consistency:
      - with: BO-755
        note: Same matching and reachable figures.
    sampleData:
      totals: {guests: 48210, reachableEmail: 29410, reachableWhatsApp: 26030, reachableSms: 10606}
      overlap: Lapsed pass holders x Kids Club parents - 1,120 shared

  BO-756:
    summary: >-
      Fixed audiences and supplied lists: created by hand or imported (CSV or Excel) with field mapping,
      validation, de-duplication and error handling. Imported rows are matched to the guest master, and the
      rows that do not match either create a lead or stay quarantined - the two honest answers. Every list
      records its source, owner, purpose, consent basis and expiry.
    inputs:
      - field: File and mapping
        rule: Upload, map columns to guest fields, preview the first 20 rows, see validation errors per row before importing.
        source: contracts/satellite/marketing-crm.yaml#importAudienceList
      - field: Unmatched rows
        rule: Create leads or quarantine; there is no third option.
        source: contracts/satellite/marketing-crm.yaml#importAudienceList
      - field: Consent basis
        rule: Required. An imported list does not grant marketing consent; imported guests without consent are listed but not reachable.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentSource; DI-378
    outputs:
      - element: Import result
        rule: Rows read, matched, new leads, quarantined, rejected (with a downloadable error file).
        source: contracts/satellite/marketing-crm.yaml#importAudienceList
    sampleData:
      list: Corporate partners 2026 - imported 28 Sep 2026 - 1,450 rows - 1,212 matched - 180 leads - 58 quarantined
      consentBasis: Existing customers, email consent recorded at source (import)
    decisions:
    - question: Import formats and validation rules for customer and segment migration are pending a dedicated data-migration
        workshop.
      decision: 'Drawn default accepted: CSV and XLSX with a downloadable template (first name, last name, email, mobile,
        language, external id).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-279 | CHG-NOTE-002
      reviewable: true
      questionSource: MoM 2026-08-20 4.4; DI-381

  BO-757:
    summary: >-
      Segments from what guests did: purchases, visits, scans, reservations, carts, app and web sessions,
      campaign opens, chatbot, surveys, reviews. Conditions on recency, frequency, value, sequence, and the
      absence of an event in a window. Bots, employees and test or fraudulent activity are excluded.
    inputs:
      - field: Event condition
        rule: Event, count or value, within a time window, or "did not happen within N days"; behavioural examples from the meeting are cart abandoned, app session, campaign opened, survey completed.
        source: DI-381; contracts/satellite/marketing-crm.yaml#/components/schemas/SegmentCriterion
      - field: Event-state precision
        rule: "\"Visited\" means a scanned ticket, not a purchase; the picker shows the precise state."
        source: DI-561
    consistency:
      - with: BO-755
        note: Same rule builder and preview; this screen pre-selects the behavioural attributes.
    sampleData:
      segment: Cart abandoned (membership only) in last 3 days, cart over AED 500, no purchase since
      counts: {matching: 214, whatsapp: 160}
    corrections:
      - what: Only createSegment is declared; no preview, no list.
        why: The purpose asks for a preview of top behaviours and freshness; add previewSegment and listSegments.
        source: contracts/satellite/marketing-crm.yaml#previewSegment
        status: fixed
        by: CHG-WIR-005

  BO-758:
    summary: >-
      Segments on membership, loyalty and wallet state: membership type, status, expiry, renewal, freeze,
      benefit use; tier, points, earn and redemption history, milestones, tier movement; wallet balance,
      top-ups, spend, low balance, dormancy. Financial data is protected: wallet balance segments on cash credit
      only, and expiring promotional credit is its own condition.
    inputs:
      - field: Wallet conditions
        rule: Cash balance bands, low balance, dormancy, "credit expiring within N days"; never a household total messaged to each member.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/SegmentCriterion
      - field: Loyalty conditions
        rule: Tier, points band, points expiring within N days, tier moved up or down in a period.
        source: screens/P08-venue-back-office.yaml#BO-758; DI-382
    sampleData:
      segment: Silver members within 500 points of Gold
      counts: {matching: 640, email: 410}
    corrections:
      - what: Only createSegment is declared.
        why: Same as BO-757 - add previewSegment (reachable by channel is in the purpose).
        source: contracts/satellite/marketing-crm.yaml#previewSegment
        status: fixed
        by: CHG-WIR-005

  BO-759:
    summary: >-
      Demographic and location audiences, used responsibly: age band, household, language, country, city,
      nationality where lawful, resident or tourist, radius from a venue, travel market. Restricted attributes
      and minimum audience sizes are warned before use, and prohibited combinations are blocked.
    inputs:
      - field: Restricted attributes
        rule: Nationality and age show a warning and require a stated purpose; minors (no date of birth counts as minor) are excluded from marketing segments.
        source: screens/P08-venue-back-office.yaml#BO-759; R205
      - field: Minimum audience size
        rule: A segment under the minimum cannot be used for sends, to protect individuals.
        source: screens/P08-venue-back-office.yaml#BO-759
    sampleData:
      segment: UAE residents in Dubai and Sharjah, Arabic-speaking, families with children 4-12
      counts: {matching: 6120, whatsapp: 4380}

  BO-760:
    summary: >-
      Value and engagement segments: revenue, LTV, average order value, frequency, category spend, refund
      behaviour, engagement score, campaign interaction, inactivity and affinity, as bands or percentiles over a
      stated scoring period. The distribution is previewed before the segment is published.
    outputs:
      - element: Distribution preview
        rule: Histogram of the chosen measure with the band boundaries, scoring period and source stated.
        source: screens/P08-venue-back-office.yaml#BO-760
    sampleData:
      segment: Top 10% by 12-month spend (over AED 3,800)
      engagementTiers: ["new", "active", "occasional", "lapsing", "lapsed", "dormant"]
    corrections:
      - what: Only createSegment is declared.
        why: The distribution preview needs a read; add previewSegment.
        source: contracts/satellite/marketing-crm.yaml#previewSegment
        status: fixed
        by: CHG-WIR-005

  BO-762:
    summary: >-
      Model-based audiences: lookalike, churn, reactivation, upgrade, next purchase, high-value propensity. Each
      shows the prediction window, threshold, size, confidence, lift and main factors. A predicted status never
      overrides consent, eligibility or pricing rules. Lookalikes expand only within the tenant's own guests.
    inputs:
      - field: Threshold
        rule: A slider with the audience size and expected lift updating; exclusions apply.
        source: screens/P08-venue-back-office.yaml#BO-762
      - field: Lookalike seed
        rule: A segment or list; expansion stays inside the tenant's guests, no pooled or third-party data.
        source: contracts/satellite/ai.yaml#proposeLookalikeSegment
    actions:
      - action: Accept AI proposal
        result: A person approves; saving the segment happens under their own permission.
        source: contracts/satellite/ai.yaml#decideProposedAction
    sampleData:
      audience: Likely to renew annual pass in 30 days - threshold 0.7 - 1,880 guests - lift 2.4x - model renew-v1

  BO-763:
    summary: >-
      Where audiences are used and whether they stay compliant: activation to campaigns, journeys, website, app
      and approved external platforms. Sending an audience to an external advertising platform is a data export,
      so it needs approval and carries suppression and consent enforcement.
    inputs:
      - field: Destination
        rule: Campaign, journey, website, app, or an approved external connector; external needs approval and the third-party-sharing consent.
        source: contracts/satellite/marketing-crm.yaml#activateAudience; contracts/satellite/marketing-crm.yaml#/components/schemas/ConsentPurpose
    outputs:
      - element: Pre-flight summary
        rule: Who will be sent, who is excluded and why, refresh schedule and expiry.
        source: contracts/satellite/marketing-crm.yaml#activateAudience
      - element: Sync status
        rule: Each activation with last sync and drift.
        source: contracts/satellite/marketing-crm.yaml#listAudienceActivations
    sampleData:
      activation: Lapsed pass holders -> Meta custom audience - pending approval - 2,104 with third-party sharing consent of 4,812

  BO-764:
    summary: >-
      The campaign operations overview: active, scheduled, paused and completed campaigns with sends, reach,
      conversions, revenue and budget pacing; channel comparison; upcoming launches, approvals waiting, errors and
      under-performers; AI recommendations to change segment, channel, timing or offer that a person accepts.
    outputs:
      - element: Campaign row
        rule: Name, status (draft, scheduled, sending, paused, completed, stopped, failed), channel, sent, delivered, conversion against its target (e.g. 80%), attributed revenue in AED.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CampaignStatus; DI-383
      - element: Recommendations
        rule: Each with its reason and expected effect; never applied automatically.
        source: contracts/satellite/ai.yaml#listMarketingRecommendations
    consistency:
      - with: BO-118
        note: Same list and statuses (see BO-118 correction).
    sampleData:
      campaigns:
        - {name: Kids Club half-term, status: sending, channel: Email, sent: 8240, conversion: 3.1% (target 4%), revenue: AED 42,600.00}
        - {name: Autumn comeback, status: scheduled 15 Oct, channel: WhatsApp, reach: 3410}

  BO-767:
    summary: >-
      Connect the audience to an eligible offer: segments, exclusions and suppression lists with reachable
      counts by channel, then an offer from the promotion engine (discount, voucher, promo code, bundle, loyalty
      reward, wallet bonus, membership benefit). Offers are only pre-configured, validated offers; no ad-hoc
      discount values.
    inputs:
      - field: Offer
        rule: Picked from the Offers module (coupon code, dynamic discount, auto-discount link), scoped to products or ticket types; eligibility, stackability, redemption limits, dates and inventory validated on selection.
        source: DI-385; MoM 2026-08-20 4.6
    outputs:
      - element: Exposure estimate
        rule: Reachable guests times expected redemption, with the offer's limits.
        source: screens/P08-venue-back-office.yaml#BO-767
    consistency:
      - with: BO-766
        note: This is the builder's audience-and-offer stage.
    sampleData:
      audience: Gold members (1,240) minus Complained in last 30 days (32)
      offer: GOLD-FNB15 - 15% off F&B - max 1 per guest - valid to 31 Dec 2026
    corrections:
      - what: CreateCampaignRequest has no offer reference.
        why: The stage selects an offer that the campaign cannot store (see BO-766).
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CreateCampaignRequest

  BO-768:
    summary: >-
      Content for every selected channel: email, SMS, WhatsApp, push, in-app, web banner, each with its own editor
      and preview, approved personalisation tokens, and language variants (English and Arabic right-to-left).
      The campaign intent stays common while each channel respects its limits.
    inputs:
      - field: Channel editors
        rule: SMS shows segment count; WhatsApp needs the approved provider template; push shows the truncation; email has subject per language.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/MessageTemplate; DI-019
      - field: Tokens
        rule: From a picker (guest first name, booking, voucher code, payment link); a missing value has a fallback.
        source: screens/P08-venue-back-office.yaml#BO-768
    outputs:
      - element: Unsubscribe and identity
        rule: Every marketing message carries the unsubscribe link and the brand's sender identity; a transactional template cannot be chosen for a marketing campaign.
        source: contracts/satellite/marketing-crm.yaml#setMarketingSubscription; DI-560
    sampleData:
      email: {subjectEn: Your pass misses you too, subjectAr: تذكرتك تشتاق إليك}
      sms: Coastal Aqua - 20% off food on your next visit with COMEBACK20. Stop? Reply STOP
    corrections:
      - what: listSegments is declared on the composer, but no template read (listMessageTemplates) is.
        why: The composer starts from a template and does not choose audiences.
        source: contracts/satellite/marketing-crm.yaml#listMessageTemplates
        status: fixed
        by: CHG-WIR-005

  BO-769:
    summary: >-
      When and under what conditions a campaign runs: immediately, scheduled, recurring, event-triggered or by
      webhook; time zone, send window, blackout dates, frequency caps, re-entry, expiry, audience refresh timing.
      Events such as purchase, expiry, birthday, milestone, top-up, first visit and abandoned cart.
    inputs:
      - field: Trigger event
        rule: From the event catalogue with its precise state (ticket scanned, not just sold).
        source: DI-561; contracts/satellite/marketing-crm.yaml#/components/schemas/CampaignTrigger
      - field: Send window and blackout
        rule: Hours and dates nothing promotional sends (e.g. national days set by the venue).
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/CreateCampaignRequest
    outputs:
      - element: Schedule summary
        rule: Plain-language summary ("Every Thursday 10:00 GST to Gold members, max 1 a week") with conflicts listed.
        source: screens/P08-venue-back-office.yaml#BO-769
    sampleData:
      trigger: Birthday - 7 days before - 10:00 GST - once a year
    corrections:
      - what: updateCampaign accepts only name, isPaused, scheduledFor and content.
        why: Trigger, send window, caps and blackout cannot be edited after creation; the scheduling screen has no write for most of its fields.
        source: contracts/satellite/marketing-crm.yaml#updateCampaign

  BO-773:
    summary: >-
      What campaigns influenced and the full record of each campaign. Attribution across channels with defined
      windows; the venue's attribution window is a venue setting (proposed 7 days). Delivery funnel, conversion,
      revenue, unattributed outcomes, and an audit of every creation, edit, approval and send.
    outputs:
      - element: Funnel
        rule: Sent, delivered, opened, clicked, bounced, complained, unsubscribed, attributed orders and revenue, with the window shown ("attributed over 7 days").
        source: contracts/satellite/marketing-crm.yaml#getCampaignPerformance; R094
      - element: Model choice
        rule: First, last, linear or position-based is a view over recorded touches; the platform records touches and does not pick a model.
        source: contracts/satellite/marketing-crm.yaml#recordTouchPoint
    sampleData:
      performance: {sent: 8240, delivered: 8102, opened: 4410, clicked: 1210, orders: 255, revenue: AED 42,600.00, window: 7 days}
    corrections:
      - what: recordTouchPoint (service audience) is declared on this staff screen.
        why: Touches are recorded by services; the screen needs a read of touches for multi-touch views.
        source: contracts/satellite/marketing-crm.yaml#recordTouchPoint
        status: fixed
        by: CHG-WIR-005
    decisions:
    - question: What attribution window does the client want (default proposed 7 days)?
      decision: 'Drawn default accepted: 7 days, shown on every revenue figure.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-280 | CHG-NOTE-002
      reviewable: true
      questionSource: R094

  BO-774:
    summary: >-
      Health and value of automated journeys: active journeys, guests enrolled, conversions, recovered revenue,
      exits, errors, upcoming actions, and nodes paused by data or consent problems. Optimisation suggestions are
      shown, not applied.
    outputs:
      - element: Journey row
        rule: Name, template, status, entrants, goal rate (the number that matters, not open rate), errors.
        source: contracts/satellite/marketing-crm.yaml#getJourneyPerformance
    consistency:
      - with: BO-120
        note: Same journey list.
    sampleData:
      journeys: ["{name: Abandoned cart - membership, entrants7d: 214, goalRate: 11%, recovered: AED 18,900.00}"]
    corrections:
      - what: Only listJourneys is declared.
        why: Goal rate and errors need getJourneyPerformance.
        source: contracts/satellite/marketing-crm.yaml#getJourneyPerformance
        status: fixed
        by: CHG-WIR-005

  BO-775:
    summary: >-
      The visual canvas for multi-step journeys: trigger, audience, decision, wait, message, offer, case, task,
      webhook and goal nodes, with branches and validation. The canvas renders the journey graph the contract
      holds. A journey is a draft until activated, and pausing keeps guests where they are.
    inputs:
      - field: Wait node
        rule: Same day, a week, a month, or a custom period.
        source: DI-384
      - field: Offer node
        rule: Picks only a pre-configured, system-validated offer; no free discount value.
        source: DI-385
      - field: Message node
        rule: Channel and template; checks the guest's consent for the purpose at the moment of sending.
        source: DI-386; contracts/satellite/marketing-crm.yaml#launchCampaign
      - field: Re-entry
        rule: Never, after completion, or always.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/Journey
    actions:
      - action: Activate or pause
        result: Activation needs MARKETING_SEND; pausing does not evict guests already in the journey.
        source: contracts/satellite/marketing-crm.yaml#activateJourney
    sampleData:
      journey: Abandoned cart - membership only
      nodes: ["Trigger cart abandoned (membership, over AED 500)", "Wait 2 hours", "WhatsApp reminder", "Wait 1 day", "Decision purchased?", "Email with offer MEMBER10", "Goal membership purchased"]

  BO-776:
    summary: >-
      The catalogue of events that can start, update or stop a journey or fire a message: purchase, cart
      abandonment, first visit, membership expiry, loyalty milestone, top-up, birthday, reservation, case events.
      Triggers key off precise event states (a post-visit survey only when the ticket was scanned).
    inputs:
      - field: Event and state
        rule: Event, required state (e.g. ticket used), delay, and whether it fires transactional or marketing messages; marketing triggers check consent.
        source: contracts/satellite/marketing-crm.yaml#setMessageTrigger; DI-561
    sampleData:
      triggers: ["Ticket scanned -> post-visit survey after 3 hours", "Order completed -> confirmation (transactional)"]
    consistency:
      - with: ADM-042
        note: Platform-level event-to-notification mapping; venue triggers sit on top.

  BO-777:
    summary: >-
      Journey branching, timing and re-entry: conditions, waits, dates, time zones, send windows, blackouts,
      frequency limits, expiry, exit and goal conditions, and what happens when data is missing. A branch with no
      safe outcome blocks publication.
    outputs:
      - element: Path simulation
        rule: Pick representative guests and see which path each takes and why.
        source: screens/P08-venue-back-office.yaml#BO-777
    sampleData:
      rule: If no purchase within 24 hours and consent for WhatsApp, send reminder; else exit
    corrections:
      - what: The screen's only operation is createJourney.
        why: Branching and simulation need the journey read and a simulation; nothing in the contract simulates a marketing journey.
        source: contracts/satellite/marketing-crm.yaml#createJourney
        status: fixed
        by: CHG-WIR-005

  BO-779:
    summary: >-
      Reusable lifecycle journeys for membership (onboarding, renewal, expiry, lapse, upgrade), loyalty
      (enrolment, tier movement, milestone, points expiry) and wallet (top-up, low balance, dormancy, bonus credit
      expiry). Each has eligibility, channels, goals and stop conditions.
    sampleData:
      library: ["Membership renewal - 30/7/1 days before expiry", "Points expiring - 14 days before", "Wallet bonus credit expiring - 7 days before"]
    consistency:
      - with: BO-775
        note: Templates open in the builder.

  BO-780:
    summary: >-
      Relationship journeys: birthdays, anniversaries, welcome, first-visit follow-up, inactivity and
      re-engagement, personalised by language, interests and preferred channel. Quiet hours, consent, frequency
      and household and minor rules apply before every message.
    edgeCases:
      - case: Birthday of a minor
        expected: The message goes to the guardian, never to the child; no marketing to minors.
        source: R205; screens/P08-venue-back-office.yaml#BO-780
    sampleData:
      journey: Birthday reward - 7 days before - free entry for the birthday guest - WhatsApp

  BO-781:
    summary: >-
      Cross-sell and service recovery after guest events: eligible upsell after purchase or visit; reservation
      follow-up, survey request, complaint recovery and post-case journeys. Compensation (voucher, points,
      credit, refund) stays within approval limits, and a journey stops when sentiment, case status, refund or
      opt-out changes.
    outputs:
      - element: Recovery performance
        rule: Entrants, completions, goals reached (return visit after recovery).
        source: contracts/satellite/marketing-crm.yaml#getJourneyPerformance
    edgeCases:
      - case: The guest opted out or a case is still open
        expected: Upsell steps stop; recovery steps continue only as transactional case messages.
        source: screens/P08-venue-back-office.yaml#BO-781
    sampleData:
      journey: Complaint recovery - case resolved -> apology with 500 points -> survey after 2 days

  BO-783:
    summary: >-
      Journey behaviour at node and goal level: triggered, eligible, enrolled, reached, clicked, converted, exited
      and failed, with drop-off per node, suppression reasons and an audit of edits, approvals and pauses.
    outputs:
      - element: Suppression reasons
        rule: Counts by reason (no consent, quiet hours, frequency cap, minor, already converted).
        source: screens/P08-venue-back-office.yaml#BO-783
    sampleData:
      funnel: {triggered: 1200, eligible: 860, enrolled: 860, reached: 790, converted: 95}
    corrections:
      - what: Only listJourneys is declared.
        why: Node analytics need getJourneyPerformance.
        source: contracts/satellite/marketing-crm.yaml#getJourneyPerformance
        status: fixed
        by: CHG-WIR-005

  BO-223:
    summary: >-
      Test a whole guest access journey (a sequence of scans with anti-passback rules) before deploying it.
      Nothing is admitted and no entitlement is consumed during a simulation.
    sampleData:
      simulation: Free View Day - main gate -> wave pool -> re-entry main gate - result admitted, admitted, denied (anti-passback 30 min)
    corrections:
      - what: The list is listJourneys (marketing automation journeys) beside simulateGuestJourney (access).
        why: "\"Journey\" means two things here; this screen simulates access journeys (listGuestJourney / journey profiles), not marketing journeys. Replace listJourneys."
        source: contracts/spine/access.yaml#simulateGuestJourney; contracts/spine/access.yaml#listGuestJourney
        status: fixed
        by: CHG-WIR-005

  BO-677:
    summary: >-
      The accreditation team's message templates (application received, documents missing, approved, rejected,
      credential ready). They are transactional messages to applicants, so they need no marketing consent and
      must carry no promotion.
    outputs:
      - element: Template row
        rule: Code, channel, kind (transactional), languages with missing ones flagged, status.
        source: contracts/satellite/marketing-crm.yaml#listMessageTemplates
    consistency:
      - with: BO-785
        note: Same template component and rules; this is the accreditation-filtered view of the one library.
    sampleData:
      templates: ["ACC-RECEIVED (email, EN AR)", "ACC-DOCS-MISSING (email, WhatsApp, EN)", "ACC-APPROVED (email, EN AR)"]
    corrections:
      - what: Only listMessageTemplates is declared; templates cannot be created or edited here, and there is no filter for accreditation templates.
        why: Either link to BO-785 for editing, or add the create and update operations and a purpose/module filter.
        source: contracts/satellite/marketing-crm.yaml#listMessageTemplates

  BO-678:
    summary: >-
      How accreditation communications are delivered and branded: sender identity, reply-to, default and
      alternative languages, tenant, event and venue branding, header and footer, contact information.
    inputs:
      - field: Sender identity and reply-to
        rule: Chosen from the brand's verified sender identities (platform-level), not typed.
        source: contracts/satellite/marketing-crm.yaml#setSenderIdentityDomain; DI-560
      - field: Languages
        rule: Default language and alternatives; English and Arabic as a pair by default.
        source: DI-019
    sampleData:
      sender: accreditation@coastalaqua.ae (reply-to media@coastalaqua.ae)
      languages: ["English (default)", "Arabic"]
    corrections:
      - what: The only operation is setLocalizationBrandingCustomer, which sets a WAIVER version's languages, branding and channels.
        why: Accreditation communication branding is not a waiver version; the screen needs the communication branding and sender identity configuration instead.
        source: contracts/satellite/marketing-crm.yaml#setLocalizationBrandingCustomer
        status: fixed
        by: CHG-WIR-005
      - what: A select labelled "Key requirement - 12.1.57".
        why: A matrix reference leaks into the UI.
        source: screens/P08-venue-back-office.yaml#BO-678

  BO-679:
    summary: >-
      Authorised operators message a selected accreditation population (all approved media for an event, all
      applicants missing a document). These are operational messages about their accreditation; no marketing may
      ride on them.
    inputs:
      - field: Population
        rule: Chosen by programme, category and status, with the recipient count before sending.
        source: screens/P08-venue-back-office.yaml#BO-679
    outputs:
      - element: Send result
        rule: Queued, delivered and failed counts, with failures retried or sent on the fallback channel.
        source: DI-559
    sampleData:
      population: Approved media - Coastal Aqua Summer Festival - 86 recipients
      message: Your media credential is ready for collection at Gate 2 from 10:00 on 14 Oct 2026.
    corrections:
      - what: sendTransactionalMessage is service and partner audience only, but is the staff screen's only action.
        why: A staff bulk send needs a staff-audience operation (and a population selector); the transactional send is per message.
        source: contracts/satellite/marketing-crm.yaml#sendTransactionalMessage
        status: fixed
        by: CHG-WIR-005

  BO-784:
    summary: >-
      Outbound communication at a glance for the venue: sent, delivered, failed, opened, clicked, converted,
      unsubscribed and attributed revenue, by channel and provider, with alerts for outage, high bounce, consent
      errors, queue delay or retries exhausted.
    outputs:
      - element: Channel tiles
        rule: Email, WhatsApp, SMS, push, in-app - delivered, pending, failed; failures link to the delivery queue.
        source: DI-559; contracts/satellite/marketing-crm.yaml#listCommunicationService
      - element: Consent errors
        rule: Messages blocked at send time because consent was missing, shown as a count, not an error to fix by sending anyway.
        source: contracts/satellite/marketing-crm.yaml#listConsentPreferenceCommunication
    consistency:
      - with: ADM-038
        note: Same object; ADM-038 is the platform view across tenants, this is the venue's.
    sampleData:
      today: {sent: 14210, delivered: 13980, failed: 96, opened: 6120, unsubscribed: 18}
      alert: WhatsApp provider latency high since 11:20

  BO-786:
    summary: >-
      Branded, responsive newsletters without code: drag-and-drop header, text, image, event, ticket, membership,
      loyalty, call-to-action, divider and footer blocks; personalisation, language variants, desktop and mobile
      preview; checks for accessibility, links, unsubscribe and sender before test or approval.
    inputs:
      - field: Blocks
        rule: From approved content blocks; product blocks pull live price and availability.
        source: screens/P08-venue-back-office.yaml#BO-786
      - field: Language variants
        rule: English and Arabic; the Arabic preview is right-to-left; a missing language is flagged.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate; DI-019
      - field: AI draft
        rule: Drafts copy for a person to edit; never publishes.
        source: contracts/satellite/ai.yaml#proposeMarketingContent
    outputs:
      - element: Pre-send checks
        rule: Unsubscribe link present, sender identity verified, images have alt text, links resolve.
        source: screens/P08-venue-back-office.yaml#BO-786
    sampleData:
      newsletter: Coastal Aqua October news - hero Halloween Splash Nights, 3 event blocks, member offer block, footer with unsubscribe
    corrections:
      - what: The only write is createMessageTemplate; no save-draft, version, test-send or approval operation for a newsletter.
        why: The draft/test/approve lifecycle in the purpose has no operations.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate

  BO-787:
    summary: >-
      Reusable content blocks and live product feeds for messages: banners, copy, events, tickets, memberships,
      promotions, CTAs, footers; feeds from events, products, inventory, pricing and recommendations with
      filters, fallback when inventory is gone, refresh interval and expiry.
    inputs:
      - field: Feed fallback
        rule: What shows when a product sells out or is withdrawn (hide block, show alternative, show "sold out").
        source: screens/P08-venue-back-office.yaml#BO-787
    sampleData:
      block: Upcoming events feed - next 3 events with seats left, refresh hourly, fallback Explore all events
    corrections:
      - what: Wired to createMessageTemplate; no content block or feed operation exists.
        why: Blocks and feeds are their own objects; add them or reduce the purpose.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate

  BO-788:
    summary: >-
      Newsletter subscriptions and messaging eligibility for the venue: categories, topics, channels, frequency,
      consent mapping, suppression and do-not-contact. Staff search a subscriber and see channel, verification,
      consent source, status and last change. Forced marketing opt-in is prevented: staff cannot subscribe a
      guest without a recorded consent.
    outputs:
      - element: Subscriber view
        rule: Lists and channels subscribed, beside the consent per channel (Given, Withdrawn, Not asked) and source.
        source: contracts/satellite/marketing-crm.yaml#getGuestConsents; DI-562
    actions:
      - action: Suppress
        result: Adds an address to the suppression list (bounce, complaint, do-not-contact); suppressed guests are excluded at send time.
        source: contracts/satellite/marketing-crm.yaml#addSuppression
    consistency:
      - with: GST-065
        note: Same consent-then-lists model.
    sampleData:
      subscriber: {guest: Sarah Thompson, lists: [Coastal Aqua news (email), Member offers (WhatsApp)], consent: Email Given at checkout 1 Oct 2026}
    corrections:
      - what: getMarketingSubscription and setMarketingSubscription are guest-only operations on this staff screen.
        why: Staff need a staff read of a guest's subscriptions and a list of subscribers; staff should not write a guest's subscription.
        source: contracts/satellite/marketing-crm.yaml#getMarketingSubscription
        status: fixed
        by: CHG-WIR-005

  BO-789:
    summary: >-
      Map operational events (purchase, reservation, check-in, membership, loyalty, wallet, refund, cancellation,
      waitlist) to the notification they send: template, channel, recipients, timing, priority, attachments.
      Mandatory transactional notices are visibly separate from optional marketing, and each applies its own
      consent policy.
    inputs:
      - field: Event state
        rule: Precise state (ticket scanned, not just sold) where the business intent needs it.
        source: DI-561
      - field: Class
        rule: Transactional (no marketing consent, no promotion) or marketing (consent checked at send).
        source: contracts/satellite/marketing-crm.yaml#sendTransactionalMessage
    sampleData:
      rules: ["Order confirmed -> TKT-CONFIRM email + WhatsApp immediately", "Day before visit -> reminder WhatsApp 18:00", "Waiver incomplete -> waiver reminder email 48h before"]
    consistency:
      - with: ADM-042
        note: Platform event mapping is the base; venue rules override per venue.

  BO-790:
    summary: >-
      Message timing, urgency and governance: immediate, scheduled, recurring and event-relative delivery with
      windows and blackouts; Critical, High, Medium and Low priority; reviewer and approver stages for selected
      templates; a final pre-flight of audience, content, channel, cost and policy.
    outputs:
      - element: Priority
        rule: Critical messages (safety, closure) bypass quiet hours and frequency caps; marketing never does.
        source: screens/P08-venue-back-office.yaml#BO-790
    sampleData:
      rule: Weather closure notice - Critical - all channels - no quiet hours
    corrections:
      - what: Only listRoutingPriorityThrottling (read) is declared; no write and no approval operation.
        why: The screen configures and approves; it needs the routing rule write and an approval workflow link.
        source: contracts/satellite/marketing-crm.yaml#listRoutingPriorityThrottling

  BO-791:
    summary: >-
      Reliable delivery: providers per channel, retry counts and backoff, failover order between channels with
      consent rechecked on the new channel, message trace, provider responses and manual replay.
    actions:
      - action: Retry or send by another channel
        result: Consent for the new channel is checked again; a marketing message never falls back to a channel without consent.
        source: contracts/satellite/marketing-crm.yaml#retryMessageDispatch; DI-559
    outputs:
      - element: Message trace
        rule: Each attempt with provider, response and failure reason.
        source: contracts/satellite/marketing-crm.yaml#listDeliveryQueueFailure
    sampleData:
      dispatch: TKT-CONFIRM to +971 50 *** 4567 - WhatsApp failed (number not on WhatsApp) - fallback SMS delivered 11:02

  BO-792:
    summary: >-
      Technical delivery quality and outcomes: sender reputation, inbox placement, bounces, complaints, blocks,
      opens, clicks, conversions by provider, domain, channel, template, language and brand, with message tracing
      and threshold alerts.
    outputs:
      - element: Bounce and complaint rates
        rule: With thresholds; crossing one raises an alert.
        source: contracts/satellite/marketing-crm.yaml#listProviderHealthUsage
    sampleData:
      email: {hardBounce: 0.8%, complaints: 0.05%, inboxPlacement: 94%}

  ADM-038:
    summary: >-
      For TICVAI administrators and operations: the health and activity of the communication infrastructure
      across tenants. It is not a marketing dashboard - it shows throughput, queues, failures and provider state,
      not campaign performance.
    outputs:
      - element: Platform KPIs
        rule: Volume by channel and provider, queue depth, failure rate, providers degraded.
        source: contracts/satellite/marketing-crm.yaml#listCommunicationService
    consistency:
      - with: BO-784
        note: Same object scoped to one venue there.
    sampleData:
      kpis: {messagesToday: 1240000, queueDepth: 3420, failureRate: 0.6%, degradedProviders: [SMS gateway KSA]}

  ADM-039:
    summary: >-
      Configure the providers TICVAI uses to deliver each channel: SMTP or email service, SMS gateway, WhatsApp
      provider, push service, in-app. Credentials are stored in the vault and never shown again; connections,
      webhooks and delivery receipts can be tested.
    inputs:
      - field: Provider credentials
        rule: Write-only; after saving, only a masked reference is shown.
        source: contracts/satellite/marketing-crm.yaml#setChannelProvider
    actions:
      - action: Test connection / Send test message / Test webhook
        result: Each shows pass or fail with the provider's response.
        source: screens/P09-platform-admin-console.yaml#ADM-039
    sampleData:
      providers: ["Email - SendGrid - primary", "SMS - Etisalat gateway - primary", "WhatsApp - Meta Cloud API - primary"]
    corrections:
      - what: '"Legal Entity" is the primary button and the channel fields are selects.'
        why: The act is Save provider; legal entity is a field.
        source: screens/P09-platform-admin-console.yaml#ADM-039

  ADM-040:
    summary: >-
      The identities messages are sent from: email sending domains with from and reply-to per brand
      (no-reply@venue.com, customerservice@venue.com), SMS sender ids per country, WhatsApp business accounts and
      numbers with approved templates, and verification status.
    inputs:
      - field: From name and address
        rule: Text fields; the domain must be verified (SPF, DKIM) before use.
        source: contracts/satellite/marketing-crm.yaml#setSenderIdentityDomain; DI-560
    sampleData:
      identities: ["Coastal Aqua <no-reply@coastalaqua.ae> reply-to customerservice@coastalaqua.ae - verified", "SMS sender CoastalAqua (UAE) - approved"]
    corrections:
      - what: Every field (From name, From address, Reply-To, Phone number) is a select.
        why: Names and addresses are typed; only brand, provider and country are selects.
        source: screens/P09-platform-admin-console.yaml#ADM-040

  ADM-041:
    summary: >-
      The registry of system transactional templates the operational modules send (ticket confirmation, payment
      failed, waiver reminder, deposit due), per business event, channel, brand and language, with versions. It
      must not replace the CRM marketing template builder.
    outputs:
      - element: Template row
        rule: Template, business event, source module, channel, languages (missing flagged), version, status.
        source: contracts/satellite/marketing-crm.yaml#listSystemTransactionalTemplate
    sampleData:
      templates: ["TICKET_ISSUED - ticketing - email/WhatsApp - EN AR - v5", "PAYMENT_FAILED - orders - email - EN AR - v2", "WAIVER_INCOMPLETE - waiver - email/SMS - EN - v1 (AR missing)"]
    corrections:
      - what: Only a list read is declared, and the fields are selects (Template ID, Template Name, Version).
        why: A registry that maintains templates needs a write; ids and names are not chosen from a list.
        source: contracts/satellite/marketing-crm.yaml#listSystemTransactionalTemplate

  ADM-042:
    summary: >-
      Map business events (OrderConfirmed, TicketIssued, TicketScanned, PaymentFailed, WaiverIncomplete) to the
      operational communications each generates. Triggers key off precise event states.
    outputs:
      - element: Mapping row
        rule: Event, state, conditions (product, venue, channel, booking type), template, timing.
        source: contracts/satellite/marketing-crm.yaml#listBusinessEventNotification; DI-561
    sampleData:
      mapping: TicketScanned (first entry of the day) -> post-visit survey after 3 hours
    corrections:
      - what: The action bar is buttons named Product, Event, Venue, Customer, Channel, Transaction Status, Membership, Booking Type.
        why: These are condition dimensions (filters or condition fields), not actions; and no write operation is declared.
        source: screens/P09-platform-admin-console.yaml#ADM-042

  ADM-043:
    summary: >-
      How a message is delivered once required: ordered providers per channel, country, brand, message class,
      priority and recipient type; throttles (per second, per minute, provider, brand, event); fallback channel.
    sampleData:
      rule: WhatsApp, UAE, transactional, Critical -> Meta primary, fallback SMS after 2 minutes, 200 msg/s
    corrections:
      - what: Only a list read; throttle values are selects.
        why: Rates are numbers and the screen needs a write.
        source: contracts/satellite/marketing-crm.yaml#listRoutingPriorityThrottling

  ADM-044:
    summary: >-
      The central enforcement layer: for each communication, its class, channel, the consent and preference read
      from CRM at that moment, and whether it was allowed or blocked and why. Transactional messages pass without
      marketing consent; marketing is blocked without it; suppression always wins.
    outputs:
      - element: Decision row
        rule: Time, message class, channel, consent read (Given, Withdrawn, Not asked), preference, decision and reason.
        source: contracts/satellite/marketing-crm.yaml#listConsentPreferenceCommunication; DI-562
    sampleData:
      decisions: ["MKT-AUTUMN to Rahul Menon - WhatsApp - consent Withdrawn - blocked", "TKT-CONFIRM to Rahul Menon - WhatsApp - transactional - allowed"]
    decisions:
    - question: Is a guest-checkout opt-in sufficient marketing consent?
      decision: 'Drawn default stands (answer: "From WEB-011: the checkout opt-in, unticked by default, recorded with source
        checkout"): Treated as consent with source checkout; shown as such in the decision row.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-276 | CHG-NOTE-002
      questionSource: M18-15 (audit R-M18-15); DI-940

  ADM-045:
    summary: >-
      Communications being processed or failing across the platform: queue state, attempts, last failure, counts
      per state, with retry and channel fallback.
    sampleData:
      queue: {queued: 3420, retrying: 210, failed: 96, deadLetter: 4}
    consistency:
      - with: BO-791
        note: Same queue scoped to one venue.

  ADM-046:
    summary: >-
      Provider performance and cost: KPIs per provider, usage and cost by channel, tenant or country, threshold
      breaches. Cost is shown in the currency billed.
    sampleData:
      providers: ["Meta WhatsApp - 412,000 messages - USD 3,296.00", "Etisalat SMS - 98,000 - AED 2,940.00"]

  ADM-047:
    summary: >-
      AI diagnostics for the communication infrastructure (not marketing strategy): health summary, detected
      provider incidents with probable cause, recommendations a person accepts.
    sampleData:
      finding: Bounce rate on coastalaqua.ae rose to 4% after DKIM key rotation - recommend re-verifying domain

  ADM-328:
    summary: >-
      Versions and change history of approval workflows, which the matrix requires (approval workflow
      versioning): who changed what, when, effective dates, and rollback.
    sampleData:
      version: Refund approval workflow v4 - threshold raised to AED 1,000 - effective 1 Nov 2026 - by Hana Yousef
    corrections:
      - what: listVersioningEffectiveDate (waiver form versions) is declared.
        why: Workflow versions are not waiver versions; use the approvals contract's workflow version history.
        source: contracts/satellite/marketing-crm.yaml#listVersioningEffectiveDate; contracts/spine/approvals.yaml#listRuleWorkflow
        status: fixed
        by: CHG-WIR-005

  BO-794:
    summary: >-
      Conversation demand and service level across channels: open, waiting, at SLA risk and escalated
      conversations; bot containment and handover; response and resolution time; CSAT, conversions and revenue;
      outages, knowledge gaps, negative sentiment spikes and overloaded queues. A conversation (seconds) is not a
      case (hours), and the screen measures them separately.
    outputs:
      - element: Waiting now
        rule: Conversations queued for a person with the longest wait first; with-assistant conversations counted apart, because time with a bot is not time in a queue.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/ConversationState; contracts/satellite/marketing-crm.yaml#listConversations
      - element: Containment
        rule: Share answered by the assistant without handover, per channel (WhatsApp, web, Instagram, Facebook as the client listed).
        source: DI-388; DI-256
    sampleData:
      now: {withAssistant: 42, queued: 7, withAgent: 18, longestWait: 3m 10s}
      containment: 64% (WhatsApp 58%, web chat 71%)

  BO-795:
    summary: >-
      One inbox for every guest conversation (email, SMS, WhatsApp, social, web chat, app chat, voice), with
      assignment, priority, unread state, SLA clock, search and saved views. Claiming a conversation is what stops
      two agents answering the same guest.
    actions:
      - action: Claim
        result: The conversation is assigned to the agent; another agent claiming it sees who has it.
        source: contracts/satellite/marketing-crm.yaml#claimConversation
    outputs:
      - element: Conversation row
        rule: Channel icon, guest (identified or not), last message, state, wait time, owner.
        source: contracts/satellite/marketing-crm.yaml#listConversations
    consistency:
      - with: SUP-004
        note: The Support Console's conversation queue is the same inbox; same rows and claim behaviour.
    sampleData:
      rows: ["{channel: WhatsApp, guest: Priya Nair, last: Can I change my visit to Sunday?, state: queued, wait: 0m 48s}"]

  BO-796:
    summary: >-
      The conversation with the guest's CRM context beside it: profile, value, tickets, reservations, membership,
      loyalty, wallet, open cases, and every earlier conversation across channels in order, with intent, outcome
      and who handled it (bot or agent). Sensitive data is masked by permission.
    outputs:
      - element: History
        rule: All prior conversations across channels and sessions as one thread for one person.
        source: contracts/satellite/marketing-crm.yaml#getConversation; DI-388
      - element: Context
        rule: Guest timeline and loyalty (staff read getGuestLoyalty), opened without losing the conversation.
        source: contracts/satellite/marketing-crm.yaml#getGuestTimeline; contracts/satellite/marketing-crm.yaml#getGuestLoyalty
    sampleData:
      guest: Priya Nair - Bronze - last visit 2 Jun 2026 - open case CA-1110

  BO-797:
    summary: >-
      Configure the guest-facing AI assistant: name, tone, languages, channels, hours, confidence thresholds,
      fallback, authentication, guest-data access, permitted actions, prohibited topics, and when it hands over to
      a person. It answers first and escalates to a human representative.
    inputs:
      - field: Handover conditions
        rule: Low confidence, guest asks for a person, negative sentiment, payment or refund topics.
        source: DI-256; screens/P08-venue-back-office.yaml#BO-797
    sampleData:
      assistant: Coral - friendly, EN/AR, WhatsApp and web chat, 24/7, hand over below 0.6 confidence
    corrections:
      - what: The screen writes setCustomerServiceCopilot (the agent-side copilot), the same operation as BO-798.
        why: The guest-facing chatbot and the agent copilot are different things; the chatbot needs its own configuration (identity, channels, hours, handover).
        source: contracts/satellite/marketing-crm.yaml#setCustomerServiceCopilot
        status: fixed
        by: CHG-WIR-005

  BO-798:
    summary: >-
      What the assistant understands and may use: intents, example phrases, entities, synonyms, approved FAQs,
      product data and policies with freshness and ownership, a test console with citations, and the queue of
      questions it could not answer.
    outputs:
      - element: Knowledge gaps
        rule: Unanswered questions grouped and counted, newest first, each becoming a task for the content owner.
        source: contracts/satellite/ai.yaml#listKnowledgeGaps
    sampleData:
      gaps: ["Can I bring a drone? (14 times this week)", "Is the lazy river heated? (9)"]
    corrections:
      - what: Intents and knowledge sources have no operation; setCustomerServiceCopilot is the only write.
        why: Knowledge collections (listKnowledgeCollections, ingestKnowledgeDocument) exist in the AI contract and are not wired here.
        source: contracts/satellite/ai.yaml#ingestKnowledgeDocument
        status: fixed
        by: CHG-WIR-005

  BO-799:
    summary: >-
      The live agent's workspace: transcript, guest context, AI reply suggestion, canned responses, translation,
      rich messages (images, PDFs, QR codes, tickets), internal notes, transfer, and authorised booking and
      wallet actions without switching applications. Closing records why the conversation ended and any callback
      promised.
    actions:
      - action: Send
        result: Sent as the agent (the sender is resolved from the session). Internal notes are visibly different and never reach the guest.
        source: contracts/satellite/marketing-crm.yaml#sendConversationMessage; F05 step 2
      - action: End conversation
        result: Requires a disposition and records a callback if one was promised.
        source: contracts/satellite/marketing-crm.yaml#setCallDisposition
      - action: Assist at kiosk
        result: Starts a remote assist session on a kiosk the guest is using.
        source: contracts/satellite/marketing-crm.yaml#startKioskAssist
    sampleData:
      suggestion: AI - "You can move your Day Pass to Sunday 4 Oct at no charge. Shall I do that?"
    corrections:
      - what: handoverToAgent (guest audience) is declared on the agent workspace.
        why: The guest's side hands over; the agent claims (claimConversation). Replace it.
        source: contracts/satellite/marketing-crm.yaml#handoverToAgent; contracts/satellite/marketing-crm.yaml#claimConversation
        status: fixed
        by: CHG-WIR-005

  BO-800:
    summary: >-
      Route work to the right team: rules by intent, skill, department, venue, language, guest tier, priority
      and SLA risk; queues with capacity, hours, overflow and assignment method. The meetings name the queues:
      reservation, general, membership and billing, technical support.
    inputs:
      - field: Queue
        rule: Code (never changes once created), name, hours, capacity, overflow wait in seconds and the overflow queue.
        source: contracts/satellite/marketing-crm.yaml#setServiceQueueDefinition; DI-389
      - field: Routing rule
        rule: Matches (category, channel, language, tier, venue, priority) and target queue or skill.
        source: contracts/satellite/marketing-crm.yaml#setIntelligentRoutingSkill
      - field: Conversation retention
        rule: Default one month, extendable, per tenant or venue.
        source: DI-380
    sampleData:
      queues: ["Reservations (EN/AR, 08:00-22:00)", "General", "Membership & billing", "Technical support"]
    consistency:
      - with: SUP-020
        note: Same queues and rules in the Support Console.
    corrections:
      - what: Case category list filters are exposed as fields (Parent category id, Top level only, Is active).
        why: Category management belongs to BO-807; ids are never typed.
        source: screens/P08-venue-back-office.yaml#BO-800

  BO-801:
    summary: >-
      Agents (and AI with approval) perform governed actions from a case or conversation: change tickets and
      reservations with capacity, price and policy shown first; loyalty and wallet actions within authority;
      payment links, vouchers and QR tickets. It is a front door to the order operations, never a second copy of
      their rules.
    actions:
      - action: Evaluate, then perform
        result: Evaluate shows what is allowed and the price difference; perform needs the agent's authority or an approval.
        source: contracts/satellite/marketing-crm.yaml#setOrderBookingTicket
    sampleData:
      action: Reschedule 2 Day Passes from Sat 3 Oct to Sun 4 Oct - no fee - allowed

  BO-802:
    summary: >-
      Conversation risk and quality: sentiment, urgency, intent confidence and quality score in near real time,
      with thresholds that alert a supervisor, change priority, transfer, create a case or take over from the bot.
      AI rationale is shown and can be overridden.
    outputs:
      - element: Quality evaluation
        rule: Scores per interaction with the checklist and coaching notes; AI-derived scores labelled with model and version.
        source: contracts/satellite/marketing-crm.yaml#listQualityAgentEvaluation
    sampleData:
      alert: Negative sentiment (0.82) on WhatsApp with Omar Haddad - escalated to supervisor

  BO-803:
    summary: >-
      Channel, bot and agent performance with evidence: volume, response, resolution, abandonment, containment,
      handover, transfer, conversion, revenue and CSAT, with drill-down to the conversation and its action trace.
    outputs:
      - element: Interaction timeline
        rule: Case messages, conversation messages, notes, calls and automated notifications in one order; who acted (AI or human).
        source: contracts/satellite/marketing-crm.yaml#listUnifiedInteractionCommunication
    sampleData:
      kpis: {firstResponse: 42s, resolution: 11m, abandonment: 6%, csat: 4.4}

  BO-804:
    summary: >-
      Service operations at a glance: new, open, pending, resolved, overdue and SLA-risk cases, escalations,
      response and resolution times, CSAT; volume by category (general support, refund, ticketing, membership),
      channel and venue; repeated issues and high-value guests needing attention.
    outputs:
      - element: Case counts
        rule: By status and SLA state; breached first.
        source: contracts/satellite/marketing-crm.yaml#listCases; DI-544
    consistency:
      - with: SUP-009
        note: The Support Console command centre shows the same counts.
    sampleData:
      counts: {open: 23, dueToday: 9, breached: 2, escalated: 3, csat: 4.3}
    corrections:
      - what: listMyCases (guest audience) is declared.
        why: A staff command centre reads listCases; remove listMyCases.
        source: contracts/satellite/marketing-crm.yaml#listMyCases
        status: fixed
        by: CHG-WIR-005

  BO-805:
    summary: >-
      The searchable case queue: search by case, guest, contact, transaction, ticket, booking or keyword; filter
      by category, subcategory, priority, channel, venue, status, owner, SLA and tier; saved views; bulk
      assignment; live SLA clocks.
    outputs:
      - element: SLA clock
        rule: Counts down to due; paused while awaiting the guest, never while awaiting an internal team.
        source: F05 step 3; contracts/satellite/marketing-crm.yaml#createCase
    consistency:
      - with: SUP-004
        note: Same queue rows.
    sampleData:
      row: CA-1042 - Lost property - Fatima Al Mansoori - Normal - due in 1h 20m

  BO-806:
    summary: >-
      Create a complete case from any touchpoint (manual, chatbot, conversation, survey, review, transaction,
      incident): guest, category and subcategory, priority, channel, venue, subject, details, screenshots and
      linked records, with duplicate detection, suggested classification and an SLA preview.
    inputs:
      - field: Category and subcategory
        rule: Two-level taxonomy (e.g. Ticket issue > Reschedule).
        source: DI-541; contracts/satellite/marketing-crm.yaml#listCaseCategories
      - field: Channel
        rule: How the guest reached the venue (one of the message channels).
        source: contracts/satellite/marketing-crm.yaml#createCase
      - field: Attachments
        rule: Screenshots and files become part of the opening message.
        source: contracts/satellite/marketing-crm.yaml#createCase; DI-541
    outputs:
      - element: SLA preview
        rule: First response and resolution targets from the policy for this type and priority.
        source: contracts/satellite/marketing-crm.yaml#setSlaPolicy
    sampleData:
      case: {guest: Rahul Menon, category: Ticket issue > Reschedule, channel: Phone, priority: Normal, subject: Move Day Pass to next weekend}

  BO-807:
    summary: >-
      Case taxonomy and lifecycle: categories and subcategories, reason codes, outcomes, severity, priorities,
      status model and transitions, mandatory fields, and the visual workflow (assignment, work, approval,
      escalation, resolution, closure). Changes are versioned and show affected open cases.
    inputs:
      - field: Category code
        rule: Unique per venue and never changes once created; subcategories one level below.
        source: contracts/satellite/marketing-crm.yaml#setCaseCategoryDefinition
    sampleData:
      taxonomy: ["General support", "Refund > Weather closure", "Ticketing > Reschedule", "Membership > Renewal"]
    corrections:
      - what: setCaseInvestigationResolution (link a record to a case) is declared on the taxonomy screen.
        why: Linking a record is a case-workspace act; remove it.
        source: contracts/satellite/marketing-crm.yaml#setCaseInvestigationResolution
        status: fixed
        by: CHG-WIR-005

  BO-808:
    summary: >-
      Assign cases to the best available team or agent by skill, department, venue, language, category, tier,
      priority and hours; round robin, least load, ownership continuity, named team or manual; capacity and
      absence shown; restricted reassignment needs approval.
    outputs:
      - element: Agent load
        rule: Each agent's status, skills, languages and open cases against their maximum.
        source: contracts/satellite/marketing-crm.yaml#listAgentWorkloadAvailability
    sampleData:
      agents: ["Aisha Rahman - EN/AR - 3 of 5", "Joseph Mathew - EN/ML - 5 of 5 (full)"]
    corrections:
      - what: Read-only; no operation assigns or reassigns cases here.
        why: Reassignment needs updateCase (assignee) on this screen.
        source: contracts/satellite/marketing-crm.yaml#updateCase
        status: fixed
        by: CHG-WIR-005

  BO-809:
    summary: >-
      Service commitments: first-response and resolution targets by case type, priority, venue, channel and
      tier, business hours and holidays, pause rules (only while awaiting the guest), warnings, precedence when
      several apply, and simulation before activation.
    inputs:
      - field: Business hours only
        rule: The field that makes targets meaningful (four hours on a Sunday night differs).
        source: contracts/satellite/marketing-crm.yaml#setSlaPolicy
    sampleData:
      policy: Complaint - High - first response 1h - resolution 24h - business hours 08:00-22:00
    corrections:
      - what: setApprovalSlaPolicy (approval workflow SLA, approvals contract) is declared beside setSlaPolicy.
        why: Approval SLAs are a different object; remove it from the case SLA screen.
        source: contracts/spine/approvals.yaml#setApprovalSlaPolicy
        status: fixed
        by: CHG-WIR-005

  BO-810:
    summary: >-
      Tiered escalation: time- and condition-based triggers (response, resolution, priority, sentiment, repeat
      contact, compliance risk), escalation levels, recipients, channel, acknowledgement deadline, compensation
      limits, loop prevention.
    outputs:
      - element: Open escalations
        rule: One row per escalated case with level, reason and suspected major incidents.
        source: contracts/satellite/marketing-crm.yaml#listEscalationCriticalCase
    sampleData:
      rule: Unresolved complaint after 12h -> supervisor; after 24h -> guest services manager
    corrections:
      - what: Only the escalation monitor read is declared; no escalation rule write exists.
        why: The screen configures rules it cannot save.
        source: contracts/satellite/marketing-crm.yaml#listEscalationCriticalCase

  BO-811:
    summary: >-
      One place to investigate, communicate and resolve a case: guest 360, details, SLA, timeline, messages,
      notes, tasks, attachments and linked transactions; replies by email, SMS, WhatsApp or chat from approved
      templates. Resolution requires a note.
    actions:
      - action: Message
        result: The composer requires choosing Reply to guest or Internal note and shows the recipient.
        source: contracts/satellite/marketing-crm.yaml#addCaseMessage; F05 step 2
      - action: Resolve
        result: Requires a resolution note; a case closed with no findings is a lesson nobody learned.
        source: F05 step 3; contracts/satellite/marketing-crm.yaml#updateCase
      - action: Refund
        result: Raises a refund request into approval; never refunds directly.
        source: F05 step 2
    consistency:
      - with: SUP-013
        note: Same workspace in the Support Console.
    sampleData:
      case: CA-0998 - Complaint - Omar Haddad - escalated - SLA breached 25m - linked order ORD-55821

  BO-812:
    summary: >-
      Fair, consistent recovery: compensation matrices by issue, severity, tier and value; refund, voucher,
      points, wallet credit, upgrade, replacement; auto-approval and manager thresholds, budget limits, fraud
      checks. Requests are routed for approval; money never moves on this screen.
    sampleData:
      matrix: Ride closed during visit - Gold - up to 1,000 points auto-approved; over AED 200 credit needs manager
    corrections:
      - what: setRefundCompensationService raises one request; nothing configures the compensation matrix or thresholds.
        why: The configuration in the purpose has no operation.
        source: contracts/satellite/marketing-crm.yaml#setRefundCompensationService
        status: fixed
        by: CHG-WIR-005

  BO-813:
    summary: >-
      Service quality, root causes and accountability: volume, SLA achievement, aging, backlog, escalations,
      CSAT, recovery cost, repeat cases, by category, channel, venue, product, team and agent.
    sampleData:
      kpis: {slaAchieved: 92%, repeatCases: 7%, recoveryCost: AED 4,820.00}
    corrections:
      - what: listMyCases (guest audience) is declared.
        why: Remove it; staff analytics read listCases or a reporting read.
        source: contracts/satellite/marketing-crm.yaml#listMyCases
        status: fixed
        by: CHG-WIR-005

  BO-814:
    summary: >-
      Guest feedback and recovery at a glance: surveys sent, response rate, NPS, CSAT, CES, review count, average
      rating, negative feedback; trends by venue, product, event and channel; urgent detractors and moderation
      backlog; AI summaries linked to the responses behind them.
    outputs:
      - element: AI themes
        rule: Labelled as AI with model version, each linking to example responses.
        source: contracts/satellite/marketing-crm.yaml#listCustomerSatisfactionFeedback; contracts/satellite/marketing-crm.yaml#/components/schemas/FeedbackClassification
    sampleData:
      kpis: {nps: 41, csat: 4.3, responseRate: 18%, reviewsToModerate: 9}
      theme: Queues at Tornado Slide (negative, 63 mentions)

  BO-815:
    summary: >-
      Multilingual, accessible surveys without development: rating, NPS, choices, text, matrix, date, media;
      question library, branching, identified or anonymous responses, consent statement and incentive. A survey
      is a form version, immutable once answered.
    inputs:
      - field: Anonymous or identified
        rule: Anonymous surveys never link to a guest profile, and say so to the respondent.
        source: screens/P08-venue-back-office.yaml#BO-815
    sampleData:
      survey: Post-visit Coastal Aqua - NPS + 3 questions - EN/AR - version 2
    consistency:
      - with: WEB-026
        note: Guests answer surveys on WEB-026 and GST-035 (see their corrections).

  BO-816:
    summary: >-
      When and to whom a survey goes: after purchase, visit (only when the ticket was scanned), event,
      reservation, membership interaction, case closure or inactivity; by email, SMS, WhatsApp, push, app, web,
      kiosk or QR; with delay, expiry, reminder, sampling, frequency cap and exclusions.
    inputs:
      - field: Trigger
        rule: Post-visit means post-scan; a "how was your purchase" survey can trigger off the sale.
        source: DI-561; DI-391
    sampleData:
      trigger: Ticket scanned -> 3 hours later -> WhatsApp survey link -> reminder after 2 days -> expires after 7 days

  BO-817:
    summary: >-
      Standard experience metrics: NPS, CSAT and CES definitions, scales, score bands, targets, benchmarks, and the
      follow-up when a guest is a detractor, low CSAT or high effort. Rules are versioned so past results are never
      silently recalculated.
    sampleData:
      nps: Detractor 0-6 -> case priority High; target +40
    corrections:
      - what: The only operation is createForm.
        why: Metric definitions and follow-up thresholds are not forms; they need their own configuration.
        source: contracts/satellite/marketing-crm.yaml#createForm
        status: fixed
        by: CHG-WIR-005

  BO-818:
    summary: >-
      Individual responses with their insight: respondent or anonymous, survey version, answers, channel, scores,
      sentiment and topics, linked guest and transaction where permitted; follow-up and recovery cases. The
      submitted response is never changed.
    sampleData:
      response: Anonymous - Post-visit v2 - NPS 3 - "Too crowded at the wave pool" - topic Crowding (AI)

  BO-819:
    summary: >-
      Verified review capture: what can be reviewed (attraction, event, product, membership, venue, dining,
      service), scales, required comments, media, verified visit or purchase, submission window, duplicate and
      spam checks, and which reviews need moderation.
    sampleData:
      rule: Attractions - 1-5 stars - verified scan required - within 14 days - comments optional
    corrections:
      - what: Only listReviews is declared; nothing configures review rules.
        why: The purpose is configuration; add the rule operations.
        source: contracts/satellite/marketing-crm.yaml#listReviews

  BO-820:
    summary: >-
      The moderation queue: approve, reject, redact or escalate guest reviews with reason codes, profanity and
      personal-data checks, and public response templates. Statuses pending moderation, published, hidden,
      rejected. The original text is retained.
    actions:
      - action: Respond
        result: Public or private response shown under the guest's review.
        source: contracts/satellite/marketing-crm.yaml#respondToReview
    sampleData:
      review: 2 stars - "Lazy river queue 40 minutes" - pending moderation
    corrections:
      - what: Only respondToReview is declared; approve, reject, redact and publish have no operation.
        why: Moderation itself cannot be performed.
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/Review

  BO-821:
    summary: >-
      Explainable AI analysis of feedback text: sentiment, emotion, urgency, topics, clusters of recurring issues,
      with confidence, supporting excerpts, model and version, and reviewer corrections.
    sampleData:
      cluster: Food ran out late afternoon - 38 responses - negative 0.79 - model feedback-v3

  BO-822:
    summary: >-
      Turn negative feedback into governed action: rules for detractors, low CSAT, high effort, negative reviews,
      urgent topics; create and route a case, recommend an approved recovery offer, approval by amount, tier and
      risk; follow up and measure the change.
    sampleData:
      rule: NPS 0-6 with topic Staff -> case High to Guest Services -> recommend 500 points (auto-approved)
    corrections:
      - what: Only setRefundCompensationService (one request) is declared; nothing defines the automation rules.
        why: Rules need their own configuration operation.
        source: contracts/satellite/marketing-crm.yaml#setRefundCompensationService
        status: fixed
        by: CHG-WIR-005

  BO-823:
    summary: >-
      Cross-source VOC reporting without double-counting guests: NPS, CSAT, CES, ratings, sentiment and topics
      benchmarked by venue, product and period, root-cause drivers, moderation SLA and recovery effectiveness.
    sampleData:
      driver: Queue length explains 34% of detractors in September

  SUP-003:
    summary: >-
      The agent sets their own availability (available, busy, away, offline), how many conversations they take
      at once, and which queues they serve. Routing depends on it, and availability expires on its own so an agent
      who forgets to go offline is not routed work.
    inputs:
      - field: State
        rule: Available, busy, away, offline; shown in the top bar of every Support Console screen.
        source: contracts/satellite/marketing-crm.yaml#setAgentAvailability
      - field: Max concurrent
        rule: 1 to the venue's maximum; three is not three times one, so a hint shows the agent's average handling time.
        source: contracts/satellite/marketing-crm.yaml#setAgentAvailability
      - field: Queues
        rule: Only queues the agent's skills allow.
        source: contracts/satellite/marketing-crm.yaml#listServiceQueues
    outputs:
      - element: Expiry
        rule: "\"Available until 18:00 (end of shift)\" from the state's expiry."
        source: contracts/satellite/marketing-crm.yaml#/components/schemas/AgentAvailability
    sampleData:
      agent: {name: Aisha Rahman, state: Available, max: 3, queues: [Reservations, General], until: 18:00}
    corrections:
      - what: Purpose reads "Change how availability behaves here, and see which level the current value came from".
        why: Configuration-screen template; the screen sets the agent's own availability.
        source: screens/P12-support-agent-console.yaml#SUP-003
        status: fixed
        by: CHG-WIR-006

  SUP-004:
    summary: >-
      The conversation queue: people waiting now, oldest first, each with the assistant's summary so the agent
      opens with context and the guest does not repeat themselves. Claim takes it, Transfer passes it with its
      context.
    outputs:
      - element: Conversation row
        rule: Channel, guest, state (queued vs with assistant vs with agent), wait in seconds, the assistant's one-line summary, language.
        source: F24 step 3; contracts/satellite/marketing-crm.yaml#listConversations
    actions:
      - action: Claim
        result: Opens the live chat (SUP-005); stops a second agent answering.
        source: contracts/satellite/marketing-crm.yaml#claimConversation
      - action: Transfer
        result: To an agent or queue; context travels.
        source: contracts/satellite/marketing-crm.yaml#transferConversation
    consistency:
      - with: BO-795
        note: Same inbox.
    sampleData:
      rows: ["{channel: WhatsApp, guest: Priya Nair, state: queued, wait: 48s, summary: Wants to move Day Pass to Sunday}", "{channel: Web chat, guest: Unknown visitor, state: with assistant, summary: Asking about prayer rooms}"]
    corrections:
      - what: The queue screen carries the full case toolset (case filters as text fields, Create case, Escalate, Reopen, Save case, Add case message).
        why: The conversation queue is about conversations; case work happens in SUP-013 / SUP-005. Keep listConversations, claim and transfer.
        source: screens/P12-support-agent-console.yaml#SUP-004
        status: fixed
        by: CHG-WIR-005

  SUP-005:
    summary: >-
      The live chat with a guest: the whole thread (it came with the handover), guest context, composer with
      rich messages, and the case beside it. Internal notes and guest replies are distinct and the choice is
      required. Closing records an outcome that tells resolved from abandoned from a case raised.
    actions:
      - action: Send
        result: As the agent; a note is visibly internal.
        source: contracts/satellite/marketing-crm.yaml#sendConversationMessage; F05 step 2
      - action: Close
        result: Resolved, abandoned by the guest, or timed out, never merged into one number; or Raise case, which names the case.
        source: contracts/satellite/marketing-crm.yaml#closeConversation; F24 step 5
      - action: Resolve case
        result: Requires a resolution note.
        source: F05 step 3
    edgeCases:
      - case: The guest asks for a refund
        expected: The agent raises a refund request; above the venue threshold it goes to approval. Never a direct refund.
        source: F05 step 2
    sampleData:
      thread: ["Guest (WhatsApp, 10:41): Can I move my Day Pass to Sunday?", "Assistant (10:41): Let me get a colleague.", "\"Aisha (10:42): Hi Priya", "yes - Sunday 4 Oct is available at no charge.\""]
    corrections:
      - what: Purpose is "Work with live chat workspace for this venue" and the case filters appear as text fields.
        why: Template purpose; the workspace serves one conversation.
        source: screens/P12-support-agent-console.yaml#SUP-005
        status: fixed
        by: CHG-WIR-006

  SUP-007:
    summary: >-
      Canned responses agents insert into chats and case replies, per language and channel, with merge fields.
      They are agent shortcuts, not marketing templates.
    inputs:
      - field: Response
        rule: Title, shortcut, body in English and Arabic, channel limits.
        source: DI-019
    sampleData:
      responses: ["/reschedule - You can change the date of your ticket up to 24 hours before your visit from My Bookings.", "/lost - We are sorry you lost something. Please tell us what it looks like and where you last had it."]
    corrections:
      - what: Canned responses are stored as message templates (createMessageTemplate needs MARKETING_MANAGE).
        why: An agent permission should manage canned responses, and they should not appear in the marketing template library; give them their own kind or object.
        source: contracts/satellite/marketing-crm.yaml#createMessageTemplate

  SUP-009:
    summary: >-
      The agent's personal workspace: their cases, tasks, SLAs, alerts and workload, with quick finds (customer,
      order, ticket, booking) and New Case.
    outputs:
      - element: My KPIs
        rule: Assigned, due today, breached, awaiting guest (SLA paused), resolved today.
        source: contracts/satellite/marketing-crm.yaml#listCustomerService; DI-539
    consistency:
      - with: SUP-002
        note: Overlaps the Agent Dashboard; both show the agent's own work.
    sampleData:
      kpis: {assigned: 11, dueToday: 4, breached: 1, awaitingGuest: 3, resolvedToday: 6}
    corrections:
      - what: SUP-002 Agent Dashboard and SUP-009 Customer Service Command Center are both "the agent's own workload" home.
        why: Two homes for one agent; merge or define SUP-009 as the board hub.
        source: screens/P12-support-agent-console.yaml#SUP-002

  SUP-010:
    summary: >-
      The agent's complete service view of one guest: details, open cases and history, current products and
      entitlements with status (active, reserved, consumed, transferred, expired, refunded or cancelled), family
      composition, service alerts, permitted preferences and an AI summary.
    outputs:
      - element: Entitlements portfolio
        rule: One list across the visit with restrictions and wallet balance, the same view the guest app shows.
        source: DI-667; DI-670
      - element: Family
        rule: A family ticket's composition with each dependant's entitlements.
        source: DI-668
      - element: Contactability
        rule: Consent per channel and purpose before any outbound action.
        source: DI-378
    consistency:
      - with: BO-737
        note: Same guest header.
    sampleData:
      guest: Khalid Al Suwaidi - Gold - 3 open entitlements (2 adult, 1 child Day Pass, Sat 3 Oct) - wallet AED 240.00 - open case CA-1120
    corrections:
      - what: The 360 is drawn as a data table of "every customer 360" with listCustomerService.
        why: It is one guest's view; open from a search or a case with the guest id.
        source: screens/P12-support-agent-console.yaml#SUP-010

  SUP-011:
    summary: >-
      One chronological timeline of a guest's interactions across service channels: case messages, chat
      messages, internal notes, calls and automated notifications, with direction, agent or system, and links to
      the related case, order or ticket.
    outputs:
      - element: Timeline item
        rule: Date and time, channel, direction, who (agent, system, AI), subject, related records, sentiment where enabled; internal notes marked.
        source: contracts/satellite/marketing-crm.yaml#listUnifiedInteractionCommunication; DI-540
    sampleData:
      items: ["1 Oct 10:42 - WhatsApp - outbound - Aisha - reply on CA-1120", "1 Oct 10:41 - WhatsApp - inbound - guest", "30 Sep 18:00 - email - system - visit reminder"]
    corrections:
      - what: The screen is a configEditor whose fields (Date/Time, Channel, Customer, Direction, Subject) are selects.
        why: These are timeline columns and filters; the screen is a read-only list.
        source: screens/P12-support-agent-console.yaml#SUP-011

  SUP-012:
    summary: >-
      Create a structured case and get it to the right team: customer, subject, description, source, category and
      subcategory, priority, venue, event, related records, attachments. The routing preview shows the recommended
      queue and agent (by skill, language, availability, workload, priority), which the agent can override before
      confirming.
    inputs:
      - field: Subject and description
        rule: Text fields, not selects.
        source: contracts/satellite/marketing-crm.yaml#createCase
      - field: Category and subcategory
        rule: From the two-level taxonomy; AI may suggest, the agent confirms.
        source: DI-541; contracts/satellite/marketing-crm.yaml#createCaseClassificationIntelligent
    outputs:
      - element: Routing preview
        rule: Recommended category, queue and agent with reasons; override is recorded.
        source: DI-545
    sampleData:
      case: {customer: Fatima Al Mansoori, subject: Charged twice for parking, source: Phone, category: Payments > Duplicate charge, priority: High}
      preview: Membership & billing queue - Joseph Mathew (Arabic/English, 2 of 5 load)
    corrections:
      - what: createCaseClassificationIntelligent "stores nothing", and createCase is not declared.
        why: The screen classifies and previews but cannot raise the case. Add createCase.
        source: contracts/satellite/marketing-crm.yaml#createCaseClassificationIntelligent; contracts/satellite/marketing-crm.yaml#createCase
        status: fixed
        by: CHG-WIR-005
      - what: Every field is a select field (Customer, Subject, Description, Attachments).
        why: Subject and description are text; customer is a search; attachments an upload.
        source: screens/P12-support-agent-console.yaml#SUP-012

  SUP-013:
    summary: >-
      Where the agent investigates and resolves a case: thread, activity, linked records (order, ticket, payment,
      refund, membership, wallet transaction), actions taken, and the AI summary of everything done.
    actions:
      - action: Link record
        result: Links an order, ticket or payment to the case.
        source: contracts/satellite/marketing-crm.yaml#setCaseInvestigationResolution
      - action: Reply or note
        result: Explicit choice, recipient shown.
        source: F05 step 2
    consistency:
      - with: BO-811
        note: Same workspace in the back office.
    sampleData:
      case: CA-1120 - Charged twice for parking - linked payment PAY-77812 and PAY-77813 (AED 40.00 each)
    corrections:
      - what: The table is bound to setCaseInvestigationResolution (a write), and getCase, addCaseMessage and updateCase are not declared.
        why: The workspace cannot read the case, reply or resolve.
        source: contracts/satellite/marketing-crm.yaml#getCase; contracts/satellite/marketing-crm.yaml#addCaseMessage
        status: fixed
        by: CHG-WIR-005

  SUP-014:
    summary: >-
      Agents service tickets and orders without entering the technical modules: change date, reschedule, resend
      tickets, upgrade (group upgrades only where configured, as a request). Every action is first evaluated (what
      is allowed, the price difference), then performed under the agent's authority.
    sampleData:
      action: Resend tickets for ORD-55821 by WhatsApp - allowed
    edgeCases:
      - case: A group asks to upgrade
        expected: Off by default; where allowed it is a request, not a self-served change.
        source: DI-607
    corrections:
      - what: The list is bound to setOrderBookingTicket (a write) and there is no order search read.
        why: The agent must find the order first; add the order read.
        source: contracts/satellite/marketing-crm.yaml#setOrderBookingTicket
        status: fixed
        by: CHG-WIR-005

  SUP-015:
    summary: >-
      Cases involving money, compensation or exceptions: full or partial refund, service or wallet credit,
      voucher, complimentary ticket, fee waiver, policy exception. Each is a request routed for approval; no money
      moves here. Approved refunds go to the original payment method or the guest's wallet.
    outputs:
      - element: Request status
        rule: Draft, submitted, approved, rejected, paid; editable only in draft.
        source: contracts/satellite/marketing-crm.yaml#setRefundCompensationService; DI-673
    sampleData:
      request: Partial refund AED 40.00 - duplicate parking charge - submitted 1 Oct 2026 - awaiting Finance
    corrections:
      - what: The list is bound to setRefundCompensationService (a write); no list read.
        why: Add a read of the requests.
        source: contracts/satellite/marketing-crm.yaml#setRefundCompensationService

  SUP-016:
    summary: >-
      Customer service asks another department for work (Finance confirm a refund, Operations check a ride
      incident) while staying the guest-facing owner. The other department sees the request on its own app.
    inputs:
      - field: Request
        rule: Department, assignee, what is needed, priority, due date, related case and transaction.
        source: contracts/satellite/marketing-crm.yaml#listEscalationCollaborationInternal; DI-542
    sampleData:
      request: Finance - confirm refund of duplicate charge PAY-77813 - due 2 Oct 2026 12:00
    corrections:
      - what: Only a read is declared; no operation raises an internal request.
        why: The collaboration cannot be started.
        source: contracts/satellite/marketing-crm.yaml#listEscalationCollaborationInternal

  SUP-017:
    summary: >-
      Resolution and formal closure: resolution category, summary, action taken, financial impact, compensation,
      root cause, customer notification and the CSAT survey. The AI summariser compiles every action for review.
    outputs:
      - element: Closure checks
        rule: Customer notified, resolution note present, compensation settled; closure blocked until they pass.
        source: contracts/satellite/marketing-crm.yaml#listCaseResolutionClosure; F70 step 4
    sampleData:
      resolution: Root cause Payment - duplicate charge refunded AED 40.00 - customer notified by WhatsApp - CSAT sent
    corrections:
      - what: Read-only; closing a case (updateCase with a resolution note) is not declared.
        why: The screen governs closure but cannot close.
        source: contracts/satellite/marketing-crm.yaml#updateCase
        status: fixed
        by: CHG-WIR-005

  SUP-019:
    summary: >-
      Supervisors' real-time view of the contact centre: cases today, open, unassigned, customers waiting,
      critical, SLA at risk and breached, resolved, response and resolution times, first-contact resolution, CSAT,
      active agents and utilisation; volume by category (general support, refund, ticketing, membership).
    outputs:
      - element: Tiles
        rule: Each tile drills into its filtered list; "customers waiting" counts queued conversations, not assistant ones.
        source: contracts/satellite/marketing-crm.yaml#listContact; DI-544
    sampleData:
      tiles: {casesToday: 64, open: 23, unassigned: 4, waiting: 7, slaAtRisk: 5, breached: 2, csat: 4.4, utilisation: 78%}

  SUP-020:
    summary: >-
      Configure the customer-service queues: name, code (never changes), department, brand, venue, languages,
      channels, hours, priority, SLA profile, supervisor, backup queue, maximum workload, overflow, after-hours
      and VIP handling.
    sampleData:
      queue: {name: Reservations, code: RES, languages: [EN, AR], hours: 08:00-22:00, overflow: 180 s to General}
    consistency:
      - with: BO-800
        note: Same queues.
    corrections:
