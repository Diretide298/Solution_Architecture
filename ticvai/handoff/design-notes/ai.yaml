    - action: Dismiss / Monitor / False positive / Escalate
      result: False positive feeds the detector's precision; escalate opens or joins a case.
      source: contracts/satellite/ai.yaml#decideRiskAlert
    - action: Propose restrictive action
      result: Goes for approval; never executed by AI (L1).
      source: contracts/satellite/ai.yaml#proposeRiskAction | ADR-0050
    - action: Close case
      result: >-
        Outcome confirmed fraud / not fraud / inconclusive with a note; confirmed cases are the training labels for the future
        classifier.
      source: contracts/satellite/ai.yaml#closeRiskCase | ADR-0051
    sampleData:
      alert:
        customer: omar.h@example.com
        signals:
        - 10 attempts, 3 succeeded
        - 4 cards on one identity
        - 2 refund requests AED 1,800
        score: 0.86 (high)
        action: Payment held for review
    corrections:
    - what: Name contains "\t170" and module is Commercial with requiresModule core.
      why: Clean the name; fraud intelligence is an AI capability (riskIntelligence).
      source: screens/P08-venue-back-office.yaml#ADM-633
  ADM-637:
    block: later
    summary: >-
      Fraud, anomaly and payment intelligence: the risk strategy (monitor or enforce, weights, thresholds, what each score
      band does, fail mode), payment performance and chargebacks, and the risk picture. Day one runs on the venue-type fraud-rule
      template; behaviour baselines from about week 4; a classifier only after analysts confirm enough cases and an admin
      promotes it. The one thing to get right: fail mode "hold for review", never decline, and the strategy shows its stage.
    inputs:
    - field: risk strategy
      rule: >-
        Mode monitor (default for a new tenant) or enforce; thresholds per band; outcome map score → hold for review / step-up
        / allow; fail mode open or hold; "decline" not offered unless governed.
      source: contracts/satellite/ai.yaml#configureRiskStrategy | ADR-0053 | DI-537
    outputs:
    - element: stage
      rule: >-
        "Starting - venue-type fraud rules" / "Learning normal behaviour (5 weeks)"; promotion of a classifier only via Ready
        to promote.
      source: ADR-0051 | ADR-0051 (AI functions review 30 Sep §4 Fraud and risk)
    sampleData:
      strategy:
        mode: monitor
        thresholds:
          high: 0.8
          medium: 0.5
        outcomeMap:
          high: Hold for review
          medium: Step-up check
        failMode: open
        stage: Starting
    corrections:
    - what: getChargebackAnalytics is declared twice; name contains "\t175".
      why: Duplicate and stray tab.
      source: screens/P08-venue-back-office.yaml#ADM-637
      status: fixed
      by: CHG-WIR-012
  ADM-680:
    block: later
    summary: >-
      What the recommendation engine knows about one customer - only the attributes relevant to recommendations (owned products,
      segment, recent activity window, declines, consent) - not another CRM profile. The one thing to get right: it shows
      which data the engine may use under consent, and the declines it is honouring.
    outputs:
    - element: profile
      rule: >-
        Owned entitlements, segment, history window used (e.g. 12 months), active declines with channel and date, consent
        state; link to the CRM profile for everything else.
      source: contracts/satellite/ai.yaml#getCustomerRecommendationProfile | MoM 21 Sep 4.4 | ADR-0052 (AI-D07)
    sampleData:
      profile:
        customer: Fatima Al Mansoori
        owns:
        - Annual Pass (expires 12 Nov)
        segment: Returning family
        declines:
        - Wave Rider Fast Pass - website, 3 Sep
        next: Renewal offer, not a new membership
  ADM-686:
    block: later
    summary: >-
      Recommendations for anonymous, known and newly identified guests: context-only for an anonymous session (cart, party,
      time, weather), personal once known, and what carries over when a guest signs in mid-session. The one thing to get right:
      a guest becoming known never exposes another person's purchases, and a decline made anonymously carries over to the
      signed-in guest.
    outputs:
    - element: modes
      rule: The mode the engine used per decision (personalised, contextual, rules only, fallback) with counts.
      source: contracts/satellite/ai.yaml#/components/schemas/AiRecommendationResult (mode)
    sampleData:
      session:
        before: anonymous - contextual (2 adults + 2 children in cart)
        after: signed in - personalised (owns Annual Pass)
    corrections:
    - what: Name ends ".123".
      why: Stray characters.
      source: screens/P08-venue-back-office.yaml#ADM-686
  ADM-687:
    block: later
    summary: >-
      Explainability and model governance for personalised decisions: which producer (rules, statistics, model) runs each
      recommendation type, its version and owner, the low-confidence fallback, and the explanation of individual decisions.
      The one thing to get right: a configured business rule overrides a low-confidence AI recommendation, and confidence
      is a band, never a bare number.
    outputs:
    - element: producer rows
      rule: >-
        Recommendation type, producer and version, status (rules / shadow / canary / production), fallback policy, confidence
        band threshold.
      source: contracts/satellite/ai.yaml#/components/schemas/AiRelease | MoM 21 Sep 4.5
    sampleData:
      row:
        type: Checkout upsell
        producer: rules (relationship map v12)
        candidate: ltr-v0.3 in shadow 3 weeks
        fallback: rules answer
        threshold: below medium → rules
  ADM-696:
    block: later
    summary: >-
      Risk, fairness and safety for recommendations: how decisions behave across customer groups and contexts, and the controls
      to disable a model, a recommendation type or a relationship, raise the confidence threshold or suspend. The one thing
      to get right: each control states its effect (e.g. "Disable model - the rules answer takes over"), and emergency suspend
      is the same kill switch as elsewhere.
    actions:
    - action: Emergency suspend / Disable model
      result: Pauses the recommendation capability (slot left empty) or rolls back the model release to the rules answer.
      source: contracts/satellite/ai.yaml#pauseAiCapability | contracts/satellite/ai.yaml#rollbackAiRelease
    sampleData:
      check: Offer rate by nationality group within ±5% of overall; no group excluded from membership offers
    corrections:
    - what: Disable / raise threshold / suspend buttons bind no operation; only explainRecommendationDecision is declared.
      why: Declare pauseAiCapability, rollbackAiRelease and the strategy write for thresholds.
      source: contracts/satellite/ai.yaml#pauseAiCapability
      status: fixed
      by: CHG-WIR-012
  ADM-697:
    block: later
    summary: >-
      Transaction-level investigation of a recommendation for support, commercial and audit: find it by recommendation id,
      transaction, customer or session (where permitted), product, channel, model or strategy, and see the full explanation.
      The one thing to get right: customer search is permission-gated and the explanation shows each candidate removal with
      its rule.
    outputs:
    - element: explanation
      rule: >-
        Candidates, removals with reasons, ranking, the template reason shown to the guest, and what the guest did (shown,
