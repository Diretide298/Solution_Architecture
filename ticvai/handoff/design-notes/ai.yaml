        request: Create a water park setup
        interpretation: Create venue Coastal Aqua, 12 products
        approval: Priya Nair 2 Oct 11:05
        trace: tr-7f3a9c
    corrections:
    - what: >-
        The trace chain's step names are drawn as metric tiles ("User Request", "↓", "AI Interpretation", "Timestamp", "Actor").
      why: They are the stages of one record's trace, drawn as a chain.
      source: screens/P09-platform-admin-console.yaml#ADM-498
  BO-597:
    block: later
    summary: >-
      The customer's own AI configuration workspace in Venue Management (moved from the console on 11 September): describe
      what you want - a product, membership, pass, promotion, discount rule, pricing calendar, seating zone, opening hours,
      campaign - and get a draft to review. The one thing to get right: it is drafting, not doing - "Nothing is applied until
      you approve it" sits on the page.
    inputs:
    - field: kind + description
      rule: >-
        Kind as a picker (product, membership, pass, promotion, discount rule, pricing calendar, seating zone, opening hours,
        campaign) and a free description; follow-up questions come back in the conversation when something required is missing.
      source: contracts/satellite/ai.yaml#generateConfiguration | DI-279 | MoM 18 Sep 4.5
    outputs:
    - element: draft
      rule: The draft as the owning module's fields with provenance; "Review and approve" opens BO-598.
