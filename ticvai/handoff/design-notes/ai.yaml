    sampleData:
      draft:
        product: Sunset Session (Fri)
        fields:
          adult: AED 99.00
          child: AED 69.00
          capacity: 800
          time: 18:00-22:00
        approval: Tier 1 - Venue manager
    corrections:
    - what: Only generateConfiguration and getActionPlan are declared - no decide or execute operation.
      why: Approval needs decideProposedAction (or the plan approval path) and execution monitoring; declare them.
      source: contracts/satellite/ai.yaml#decideProposedAction
      status: fixed
      by: CHG-WIR-012
  ADM-519:
    block: later
    summary: >-
      The AI governance command centre: capabilities registered, policies in force, governed actions today, actions needing
      approval or blocked, exceptions, high-risk capabilities, violations, and each capability's maturity - with the "Ready
      to promote" alerts and the kill switch at hand. The one thing to get right: it is a saved dashboard over the same registry,
      alerts and maturity data as the detail screens (a command centre is a saved dashboard), and the open question of central
      vs per-module placement is answered by also offering each tile as a widget for the module dashboards.
    outputs:
    - element: tiles
      rule: >-
        Counts that link to their screens; "Ready to promote" as its own tile from promotionReady alerts; blocked actions
        shown as refused decisions, not errors.
      source: >-
        contracts/satellite/ai.yaml#listAiGovernanceAlerts | contracts/satellite/ai.yaml#/components/schemas/AiGovernanceOutcome
        | ADR-0041
    - element: maturity by question
      rule: Stage badge per capability question with "since"; the same component as ANL-071.
      source: contracts/satellite/ai.yaml#listAiCapabilityMaturity | ADR-0051
    - element: autonomy coverage
      rule: Capabilities per level L0-L4 against ceilings, as a stacked bar.
      source: ADR-0050 | contracts/satellite/ai.yaml#listAiCapabilities
    actions:
    - action: Pause capability
      result: Kill switch with the degradation mode stated (as ADM-536).
      source: contracts/satellite/ai.yaml#pauseAiCapability
    sampleData:
      tiles:
        registered: 14
        policies: 9
        governedToday: 12480
        approvalRequired: 37
        blocked: 6
        exceptions: 1
        highRisk: 3
        violations: 0
        readyToPromote: 0
    decisions:
    - question: One central AI governance dashboard, or widgets in each module's dashboard?
      decision: 'Drawn default accepted: Both - this centre for the governance lead, and the same tiles available as widgets
        on module command centres (a command centre is a saved dashboard).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-274 | CHG-NOTE-001
      reviewable: true
      questionSource: MoM 18 Sep 4.4 | TRACKER Actions row 316 | ADR-0041
  ADM-521:
    block: later
    summary: >-
      Risk classification of capabilities and action types by business, customer, financial, operational, security and compliance
      impact - not by which model is used. The one thing to get right: the client's examples anchor the scale - explaining
      a sales report is low risk and needs no approval; an AI-suggested price change is high risk and needs a person.
    inputs:
    - field: riskClass per capability / action type
      rule: >-
        Low, medium, high, critical with the impact dimensions as checkboxes and the consequence shown ("High - approval required
        before publishing").
      source: contracts/satellite/ai.yaml#configureAiCapability | MoM 18 Sep 4.1 | MoM 18 Sep §5
    sampleData:
      rows:
      - capability: Report explanation
        risk: Low
        approval: None
      - capability: Price change suggestion
        risk: High
        approval: Commercial manager
      - capability: Fraud hold
        risk: Critical
        autonomy: L1 Advisory
    corrections:
    - what: >-
        Risk is on the capability only; action types (price change vs explanation within one capability) have no risk field.
      why: >-
        The purpose asks for action-type risk; it lives in governance rules (effect per action) - say so on the screen or
        add a per-tool risk (AiTool.riskClass exists).
      source: contracts/satellite/ai.yaml#setAiTool (riskClass)
  ADM-522:
    block: later
    summary: >-
      Autonomy levels per capability on the one L0-L4 scale with the first-release ceilings, tightened per venue, environment
      or role but never raised. The one thing to get right: the board's own scale ("four controlled levels plus disabled")
      must be relabelled to L0 Disabled, L1 Advisory, L2 Prepare, L3 Execute with approval, L4 Controlled auto - and autonomy
      is separate from the user's permission.
    inputs:
    - field: autonomy level
      rule: >-
        Selector with the ceiling marked and higher levels disabled with the reason; venue and environment overrides tighten
        only.
      source: ADR-0050 | contracts/satellite/ai.yaml#/components/schemas/AiPolicy (autonomyOverrides)
    outputs:
    - element: ceiling table
      rule: >-
        First-release ceilings - L1 fraud restrictive actions, access-security changes, finance actions; L2 operational requirements,
        pricing inputs, campaigns, Help me choose; L3 configuration assistant, forecast publication; L4 only forecast auto-publish,
        ranking inside a published strategy, fraud hold mapping if turned on.
      source: ADR-0050
    - element: note
      rule: '"A manager who may change a price by hand still gets an AI-prepared change routed for approval."'
      source: ADR-0050
    sampleData:
      rows:
      - capability: Configuration assistant
        level: L3 Execute with approval
        ceiling: L3
      - capability: Help me choose
        level: L2 Prepare
        ceiling: L2
      - capability: Fraud hold
        level: L1 Advisory
        ceiling: L1 (L4 hold mapping off)
    corrections:
    - what: Filters Tenant, Module, Action Type, User Role, Business Unit as selectFields with no operation.
      why: >-
        Autonomy is per capability (configureAiCapability) with tighten-only overrides per scope (setAiPolicy.autonomyOverrides);
        there is no per-role autonomy - autonomy is separate from permission.
      source: ADR-0050 | contracts/satellite/ai.yaml#configureAiCapability
    - what: purpose carries the board's own level descriptions.
      why: Relabel to ADR-0050's scale.
      source: ADR-0050
  ADM-524:
    block: later
    summary: >-
      What data each AI capability may read, for what purpose, and what may be shared with an external provider - e.g. the
      staff assistant may read a guest's purchase history but never card details. It complements, not replaces, privacy governance;
      retention of AI data per class is set here too. The one thing to get right: masked fields fail closed, and prompts are
      the only thing that leaves the platform.
    inputs:
    - field: data rule
      rule: Capability × data category × purpose → allow / block, drafted as a data policy (kind data).
      source: contracts/satellite/ai.yaml#createAiGovernancePolicyDraft | MoM 18 Sep 4.1
    - field: AI retention
      rule: >-
        Per data class (prompts and responses, conversations, decision records, approvals) - prompts 90 days by default; decision
        records follow the audit period; legal floors cannot be undercut.
      source: contracts/spine/tenancy.yaml#setDataRetentionSetting | ADR-0020 (AI-D05 retention per tenant)
    sampleData:
      rules:
      - capability: Staff assistant
        data: Purchase history
        purpose: Answer staff questions
        effect: allow
      - capability: Staff assistant
        data: Card details
        effect: block
      retention:
      - dataClass: AI prompts and responses
        keep: 90 days
        onExpiry: delete
      - dataClass: AI decision records
        follows: Audit records
  ADM-525:
    block: later
    summary: >-
