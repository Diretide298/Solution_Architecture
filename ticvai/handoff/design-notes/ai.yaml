vocabulary:
- term: Sahli
  meaning: >-
    The guest concierge's name; the entry reads "Ask Sahli" and shows as mascot art when the venue's Concierge mascot setting
    is on (default), otherwise a plain button.
  avoid:
  - Chatbot
  - Bot
  - AI Concierge (as a visible label)
  - Virtual agent
  source: DI-1069 | screens/P01-guest-web-storefront.yaml#WEB-044
- term: Based on
  meaning: >-
    The line on every AI answer that says what it was computed from, e.g. "Based on: your venue profile, UAE calendar, weather,
    23 days of your sales". Always present.
  avoid:
  - Data sources
  - Model inputs
  - Powered by AI
  source: ADR-0051 Maturity | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
- term: Starting / Learning / Established / Trained on your data
  meaning: >-
    The four maturity stages (enum starting, learning, established, learned), shown as one badge. Moves by itself from Starting
    to Established as own data arrives; Trained on your data only after an admin promotion.
  avoid:
  - Beta
  - Experimental
  - Low confidence
  - Cold start (in UI)
  - Not enough data
  source: ADR-0051 | ADR-0051 (AI functions review 30 Sep §2)
- term: Limited historical data
  meaning: >-
    Shown while own data carries less than half the weight (AiMaturity.limitedHistory, ownDataShare < 0.5). An honest qualifier,
    never a refusal.
  avoid:
  - Insufficient data
  - Not available until
  - Comes later
  source: ADR-0051 | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
- term: Range
  meaning: >-
    The 10th-90th percentile band a forecast or estimate is shown with (e.g. "1,850-3,400 guests, most likely 2,600"). Never
    a bare accuracy percentage on an answer; measured accuracy (WAPE, bias, coverage) appears only on accuracy screens, labelled
    measured.
  avoid:
  - Accuracy 92%
  - Confidence 0.87 (on a heuristic)
  - Exact
  source: ADR-0051 | contracts/satellite/ai.yaml#getForecast | contracts/satellite/ai.yaml#getForecastAccuracy
- term: Running in the background
  meaning: A trained model in shadow next to the live answer (AiRelease.stage shadow); it changes nothing a person sees.
  avoid:
  - Live
  - Active model
  - Testing in production
  source: ADR-0051 Promotion | ADR-0051 (AI functions review 30 Sep §2)
- term: Ready to promote / Promote
  meaning: >-
    A shadow model passed its gate (governance alert promotionReady); an admin promotes it one stage at a time (canary, then
    production). The only way a model replaces the baseline.
  avoid:
  - Deploy
  - Go live
  - Auto-switch
  - Activate model
  - Upgrade AI
  source: ADR-0051 (AI-D16) | contracts/satellite/ai.yaml#promoteAiRelease
- term: L0 Disabled / L1 Advisory / L2 Prepare / L3 Execute with approval / L4 Controlled auto
  meaning: >-
    The one autonomy scale for every AI capability, shown as "L2 Prepare" etc. with the capability's ceiling beside it. Lower
    scopes tighten, never raise.
  avoid:
  - Autopilot
  - Copilot mode
  - Level 0-3 (CFG book)
  - Approval level (for autonomy)
  - Manual/Semi/Auto
  source: ADR-0050 | ADR-0050 (AI-D04) | contracts/satellite/ai.yaml#/components/schemas/AiAutonomyLevel
- term: Approval tier
  meaning: How many people must approve a proposed action (ProposedAction.approvalLevel, 1 or 2). Not an autonomy level.
  avoid:
  - Autonomy level
  - Approval level (ambiguous)
  source: ADR-0050
- term: Suggestion / Draft
  meaning: >-
    What AI produces. A suggestion advises; a draft is a ready-to-review change that a person applies in the owning screen.
    Copy says "Nothing is applied until you approve it."
  avoid:
  - AI changed
  - Auto-applied
  - AI updated your prices
  source: >-
    ADR-0020 | ADR-0051 (AI functions review 30 Sep §4 Configuration assistant) | contracts/satellite/ai.yaml#/components/schemas/ProposedAction
- term: Why this?
  meaning: >-
    The link or expander that opens an answer's explanation (Suggestion.explanation, recommendation template reason, decision
    trace). Plain words; for guests a template reason.
  avoid:
  - Explainability
  - SHAP
  - Feature importance (in operator copy)
  source: ADR-0052 (AI-D09) | contracts/satellite/ai.yaml#/components/schemas/Suggestion
- term: No thanks
  meaning: >-
    The explicit decline on an offer. Only this counts as a decline and it is remembered across channels; scrolling past or
    closing the step is not a decline.
  avoid:
  - Dismiss (as a decline)
  - Skip (as a decline)
  - X (as a decline)
  source: ADR-0052 (AI-D07) | DI-962 | contracts/satellite/ai.yaml#recordRecommendationEvents
- term: Hold for review
  meaning: >-
    What a high fraud or risk score does to a payment or order. The transaction goes through; it is held for a person.
  avoid:
  - Decline
  - Block
  - Reject (for a risk score)
  - Fraud detected
  source: ADR-0053 | ADR-0053 (AI-D06)
- term: Hand over to a person
  meaning: >-
    The concierge passes the whole conversation and its own summary to a live agent; the guest does not repeat themselves.
  avoid:
  - Escalate
  - Transfer
  - Contact bot
  source: contracts/satellite/marketing-crm.yaml#handoverToAgent
- term: Not available yet
  meaning: >-
    The analytics assistant's answer to a question outside the semantic model; it records a knowledge gap and never improvises
    a number.
  avoid:
  - I cannot answer
  - Error
  - Unknown
  source: ADR-0054
screens:
  WEB-044:
    block: A
    summary: >-
      Sahli, the guest concierge on the web. The client's prototype draws it as a floating "Ask Sahli" button on every page
      that opens a chat panel, not as a page of its own; the route /ai-concierge is the full-height version of that panel
      (deep links, small screens). It answers natural-language questions about tickets, F&B, retail, timings and venue information
      from the venue's own configured data and documents, shows where each answer came from, and hands the whole conversation
      to a person when it cannot help. The one thing to get right: it must read as a clearly labelled assistant that is grounded
      and bounded - it says what it does not know and offers a person, it never invents a price or an opening time.
    inputs:
    - field: content (the question)
      rule: >-
        A single growing text box (up to 8,000 characters; counter only past 7,500). Typing in Arabic flips the bubble and
        box to RTL on its own; the reply comes in the conversation locale. Enter sends, Shift+Enter breaks a line. Suggested
        starter chips under an empty conversation, drawn from guestCapabilityScope (e.g. "What time do you close today?",
        "Is there parking?", "Which rides suit a 6-year-old?", "How long is the wait for Wave Rider?").
      source: >-
        contracts/satellite/ai.yaml#sendAiMessage | contracts/satellite/ai.yaml#/components/schemas/AiPolicy (guestCapabilityScope)
        | DI-207
    - field: module, locale (createAiConversation)
      rule: >-
        Never asked of the guest. The conversation is opened silently on the first question with the guest-concierge module
        and the session locale; scope and role come from the session, never from the request.
      source: contracts/satellite/ai.yaml#createAiConversation
    - field: collectionIds
      rule: Not shown to guests. Retrieval runs as the guest and reaches only the venue's guest-readable collections.
      source: contracts/satellite/ai.yaml#sendAiMessage
    - field: feedback (helpful / not helpful)
      rule: >-
        Thumbs up / down under each assistant answer, once per answer. Thumbs down opens an optional reason chip row (Wrong,
        Out of date, Incomplete, Not about this venue, Unsafe, Other) and an optional comment (1,000 characters).
      source: contracts/satellite/ai.yaml#recordAnswerFeedback
    outputs:
    - element: assistant answer
      rule: >-
        Every assistant bubble is labelled as Sahli (avatar or mascot), never styled as a staff member. Sources show as small
        tappable citations under the answer (document or page title, e.g. "Opening hours - Coastal Aqua", "Refund policy").
        An answer with no source must not carry a citation row.
      source: >-
        contracts/satellite/marketing-crm.yaml#/components/schemas/ConversationMessage (sender) | contracts/satellite/ai.yaml#/components/schemas/AiMessage
        (sources)
    - element: confidence, model, tokens, trace id
      rule: >-
        Not shown to guests. confidence is nullable on purpose; where it is null nothing is drawn, and a guest UI never shows
        a number. traceId may be kept in the page for a support handover but is invisible.
      source: contracts/satellite/ai.yaml#/components/schemas/AiMessage
    - element: wait-time answers
      rule: >-
        A wait-time reply (requestSuggestion kind waitTime) shows the minutes as a range or "about 25 min" with its "Based
        on" line (e.g. "Based on: Wave Rider's capacity and the queue now"); early in the day it is based on the configured
        ride capacity until 30 minutes of throughput are measured.
      source: >-
        contracts/satellite/ai.yaml#requestSuggestion | ADR-0051 (AI functions review 30 Sep §4 Queue and wait time) | ADR-0051
    - element: earlier conversations
      rule: >-
        A signed-in guest sees their own past conversations as a short list (first question as the title, date), newest first;
        not a data table, and no principal, scope or module columns.
      source: contracts/satellite/ai.yaml#listAiConversations
    - element: offers inside the chat
      rule: >-
        When Sahli recommends something to buy, it shows a product card with the price from Pricing and a template reason;
        adding it goes through the normal cart, and Sahli never completes a checkout.
      source: ADR-0052 (AI-D09) | ADR-0052 | contracts/satellite/ai.yaml#decideRecommendations
    actions:
    - action: Send (Ask)
      result: >-
        The question appears at once; a typing indicator shows while the answer streams. On success the answer with citations;
        on 503 (every provider failed) "Sahli can't answer right now" with Hand over to a person and Try again.
      source: contracts/satellite/ai.yaml#sendAiMessage
    - action: Hand over to a person
      result: >-
        Always visible in the panel header, not only after a failure. Sends reason guestRequested with Sahli's own summary;
        the panel turns into the agent chat with queue position and estimated wait, and the transcript stays above. 409 (no
        agent available) shows the reason and offers to raise a case instead of queueing the guest.
      source: contracts/satellite/marketing-crm.yaml#handoverToAgent | MATRIX 22.8.5
    - action: Helpful / Not helpful
      result: >-
        Records feedback silently with a small "Thanks" acknowledgement; nothing changes in the answer (nothing is learned
        online).
      source: contracts/satellite/ai.yaml#recordAnswerFeedback
    edgeCases:
    - case: Question outside the venue's guest scope (e.g. asking the venue's margin, another guest's booking)
      expected: >-
        A polite refusal that says what Sahli can help with, plus Hand over to a person (reason outOfScope). Never a made-up
        answer.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiPolicy (guestCapabilityScope) | contracts/satellite/marketing-crm.yaml#handoverToAgent
    - case: Venue's AI budget ceiling reached
      expected: >-
        With the default ceiling behaviour (warn) the guest notices nothing - Sahli keeps answering and the venue manager
        is warned. Only where the venue chose warnThenDisable or block does a 429 arrive; then the panel says Sahli is not
        available and offers a person. The guest is never told about budgets.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiPolicy (ceilingBehaviour) | contracts/satellite/ai.yaml#sendAiMessage
        (429)
    - case: Capability paused by an administrator (kill switch)
      expected: The concierge's degradation mode is to offer a person; the panel opens straight on Hand over to a person.
      source: contracts/satellite/ai.yaml#pauseAiCapability
    - case: AI not licensed for the venue, or the guest-concierge capability is L0 Disabled
      expected: >-
        No Ask Sahli button anywhere; a deep link to /ai-concierge lands on the venue's contact/help page, not an error.
      source: screens/P01-guest-web-storefront.yaml#WEB-044 (requiresModule ai) | ADR-0050
    - case: Concierge mascot setting off
      expected: The same entry as a plain round button with a chat icon and the label "Ask Sahli"; nothing else changes.
      source: DI-1069
    - case: Offline
      expected: The panel opens read-only with what was already loaded; the input is disabled with "You're offline".
      source: screens/P01-guest-web-storefront.yaml#WEB-044 (states.offline)
    - case: Guest is not signed in
      expected: >-
        The guest can still ask (anonymous concierge); history is not kept across visits and the earlier-conversations list
        is replaced by a "Sign in to keep your conversations" link. Asking never forces sign-in.
      source: screens/P01-guest-web-storefront.yaml#WEB-044 (states.emptyNoAccess) | designer default
    consistency:
    - with: GST-031
      note: >-
        Same answer bubble, citation row, feedback, handover and mascot setting; web and app are one product (cross-surface
        parity, 31 August).
    - with: GST-032
      note: >-
        The chat screen of the app (ticketing-guest process); its bubbles and handover must be the same component as this
        panel.
    - with: SUP-018
      note: >-
        The agent who receives a handover sees Sahli's summary first; the summary written here is what that screen shows.
    sampleData:
      venue: Coastal Aqua (water park, Dubai)
      conversation:
      - guest: What time does the park close today?
      - sahli: Coastal Aqua is open until 6:00 pm today (Saturday). The lazy river closes at 5:30 pm.
        sources:
        - Opening hours - Coastal Aqua
        - Attraction hours
      - guest: هل يوجد مواقف سيارات مجانية؟
      - sahli: نعم، مواقف السيارات مجانية لزوار الحديقة في الموقف P2 بجانب المدخل الرئيسي.
        sources:
        - Getting here / الوصول إلينا
      - guest: How long is the wait for Wave Rider?
      - sahli: About 25 minutes right now.
        basedOn: 'Based on: Wave Rider''s capacity and the queue now'
      handover:
        queuePosition: 2
        estimatedWait: about 3 min
        reason: guestRequested
    corrections:
    - what: >-
        The layout's primary content is a detailPanel bound to getGuestMenu ("The guest menu"), with pattern statusTracker.
      why: >-
        The concierge is a conversation panel; the menu is at most something Sahli links to. The prototype (rev 3, verified
        28 September) is a floating chat panel. Pattern should be a conversation (assistantPanel) and getGuestMenu demoted
        to an optional "Order food" shortcut, or removed.
      source: screens/P01-guest-web-storefront.yaml#WEB-044 (wireframe.prototype.differences) | DI-207
    - what: dataTable "Every AI conversation" with id, principalId, scopePath, module columns on a guest screen.
      why: A guest sees only their own conversations as a simple list; the columns are staff plumbing.
      source: contracts/satellite/ai.yaml#listAiConversations
    - what: Overlay formCreateAiConversation asks the guest for a required `module`.
      why: >-
        The guest never chooses a module; the scope comes from the session. Open the conversation silently on first send.
      source: contracts/satellite/ai.yaml#createAiConversation
    - what: Overlay formRequestSuggestion offers any `kind`, and "Request suggestion" is a visible button.
      why: >-
        A guest may only ask for prepPlan, upsell, waitTime and itinerary (the contract refuses the rest), and GST-031 already
        limits it to prepPlan, upsell, waitTime. Suggestions should be produced from the conversation (e.g. a wait-time question),
        not from a form where a guest picks an enum. Same limit as GST-031.
      source: >-
        contracts/satellite/ai.yaml#requestSuggestion | screens/P02-guest-mobile-app.yaml#GST-031 (overlays.formRequestSuggestion)
    - what: sendConversationMessage (CASE_MANAGE) and recordAnswerFeedback are on WEB-044 but not on GST-031.
      why: >-
        Web and app must call the same guest operations. After a handover the guest talks to the agent through sendConversationMessage
        on both; feedback belongs on both.
      source: >-
        screens/P01-guest-web-storefront.yaml#WEB-044 (notes, cross-surface parity) | screens/P02-guest-mobile-app.yaml#GST-031
    - what: The handover overlay requires the guest to pick a `reason` and type a summary.
      why: >-
        The reason is set by what happened (guestRequested when the guest presses the button; assistantFailed, outOfScope,
        negativeSentiment by the platform) and the summary is Sahli's own. The guest presses one button.
      source: contracts/satellite/marketing-crm.yaml#handoverToAgent
    decisions:
    - question: DI-195 deferred the concierge chat design to "a dedicated AI workshop" (third-party LLM with PII masking,
        token billing). The AI sessions of 18 and 21 September settled masking and providers; billing for a client-chosen
        provider is still deferred (AI-D20). Can DI-195 be closed?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Draw the concierge as above; billing has
        no guest-visible effect.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-016 | CHG-NOTE-001
      questionSource: DI-195 | MoM 30 Sep 4.1 (AI-D20) | MoM 30 Sep 4.1
    - question: Does Sahli remember earlier conversations for a signed-in guest across web and app, or only within a visit?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Signed-in guests see their own history on
        both surfaces (listAiConversations); anonymous visitors see only the current conversation.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-017 | CHG-NOTE-001
      questionSource: contracts/satellite/ai.yaml#listAiConversations
  GST-031:
    block: A
    summary: >-
      Sahli's home in the guest app: where a guest starts a conversation, sees earlier ones and finds quick help. It is the
      app rendering of WEB-044 and must behave identically. It is entered from the app home (GST-001) and opens the chat (GST-032).
      The one thing to get right: it is a concierge, not an F&B screen - the menu read it currently declares is a shortcut
      at most.
    inputs:
    - field: question / starter chips
      rule: >-
        A prominent "Ask Sahli" input and 4-6 starter chips from guestCapabilityScope (opening hours, wait times, what suits
        my kids, parking, food near me). Tapping a chip opens GST-032 with the question sent. Voice input is not specified;
        do not draw it.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (guestCapabilityScope) | DI-207
    - field: module, locale
      rule: Never asked. The conversation opens silently on the first question with the guest module and the app locale.
      source: contracts/satellite/ai.yaml#createAiConversation
    outputs:
    - element: earlier conversations
      rule: >-
        The guest's own conversations, newest first (first question as title, relative date); empty state "Ask Sahli anything
        about your visit".
      source: >-
        contracts/satellite/ai.yaml#listAiConversations | screens/P02-guest-mobile-app.yaml#GST-031 (guest app return FINDINGS.md)
    - element: wait-time and upsell suggestions
      rule: >-
        Where the home shows a suggestion (a short wait now, an add-on), it carries the "Based on" line and, where the estimate
        is a range, the range. A guest never sees a confidence number.
      source: contracts/satellite/ai.yaml#requestSuggestion | ADR-0051
    actions:
    - action: Ask / tap a starter chip
      result: Opens GST-032 with the question sent and the answer streaming.
      source: screens/P02-guest-mobile-app.yaml#GST-031 (navigation.transitions)
    - action: Hand over to a person
      result: >-
        Same as WEB-044 - one tap, reason guestRequested, Sahli's summary, queue position and wait shown; 409 offers a case.
      source: contracts/satellite/marketing-crm.yaml#handoverToAgent
    - action: Order food (optional shortcut)
      result: Opens the outlet's menu in force (getGuestMenu); shows "Menu until 11:00" from inForceUntil.
      source: contracts/satellite/fnb.yaml#getGuestMenu
    edgeCases:
    - case: AI unavailable, paused or not licensed
      expected: >-
        The screen never shows an error page: it offers Hand over to a person and the venue's help topics. With AI not licensed
        the Sahli entry is hidden from the tab bar and home.
      source: contracts/satellite/ai.yaml#pauseAiCapability | screens/P02-guest-mobile-app.yaml#GST-031 (notes)
    - case: Cold entry from a notification link to a closed conversation
      expected: Opens the transcript read-only with "This conversation was closed" and a button to start a new one.
      source: screens/P02-guest-mobile-app.yaml#GST-031 (entryState.coldEntry)
    - case: Offline
      expected: Earlier conversations stay readable; Ask is disabled with "You're offline".
      source: screens/P02-guest-mobile-app.yaml#GST-031 (states.offline)
    consistency:
    - with: WEB-044
      note: Same component set, same mascot setting (Concierge mascot, default on), same handover and feedback.
    - with: GST-032
      note: The chat itself; GST-031 only starts and lists conversations.
    - with: GST-033
      note: >-
        Contextual help opens the same conversation component pre-filled with the context of the screen it was opened from.
    sampleData:
      venue: Coastal Aqua
      starterChips:
      - What time do you close today?
      - Shortest wait right now?
      - Rides for a 6-year-old
      - Where can we eat near the wave pool?
      - Parking
      earlierConversations:
      - title: Is the lazy river open in the evening?
        when: Yesterday
      - title: هل يمكنني استرداد التذكرة؟
        when: 12 Sep
    corrections:
    - what: requiresModule is fnb.
      why: The concierge is gated by the AI module, as WEB-044 is (requiresModule ai).
      source: screens/P01-guest-web-storefront.yaml#WEB-044 | screens/P02-guest-mobile-app.yaml#GST-031
    - what: purpose reads "The screen this app sits on. Everything else is entered from here and returns to it."
      why: >-
        That is the app home (GST-001). GST-031 is the concierge home - "Ask, and be answered or handed to a person" as on
        WEB-044.
      source: screens/P02-guest-mobile-app.yaml#GST-031 | screens/P01-guest-web-storefront.yaml#WEB-044 (purpose)
    - what: The only read is getGuestMenu, drawn as the screen's record; no list of the guest's conversations.
      why: The guest app return already flagged this (drawn greyed). Declare listAiConversations, as WEB-044 does.
      source: >-
        screens/P02-guest-mobile-app.yaml#GST-031 (guest app return FINDINGS.md) | contracts/satellite/ai.yaml#listAiConversations
    - what: requestSuggestion is offered to the guest with kind prepPlan.
      why: >-
        prepPlan is the kitchen's production plan (forecast covers x menu mix); it means nothing to a guest. The concierge
        should request waitTime and upsell only, from the conversation, not from a kind picker.
      source: >-
        ADR-0051 (AI functions review 30 Sep §4 Operational suggestions) | contracts/satellite/ai.yaml#requestSuggestion
    - what: recordAnswerFeedback and sendConversationMessage missing (both on WEB-044).
      why: Cross-surface parity; feedback and the post-handover agent chat apply to the app too.
      source: screens/P01-guest-web-storefront.yaml#WEB-044
    - what: entryState.coldEntry says "A conversation link an agent opens from a notification".
      why: >-
        GST-031 is the guest app; the cold entry is a guest opening a notification about their own conversation (e.g. an agent
        replied).
      source: screens/P02-guest-mobile-app.yaml#GST-031
    decisions:
    - question: Is Sahli a tab of the app's bottom bar, or reached from home and the floating button only?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Floating button on every screen plus an
        entry on home, as the web prototype; no dedicated tab.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-011 | CHG-NOTE-001
      questionSource: DI-1069 | screens/P01-guest-web-storefront.yaml#WEB-044 (wireframe.prototype.view)
  GST-033:
    block: A
    summary: >-
      Contextual help: Sahli opened from inside another screen (a product, the cart, a booking) with that screen's context,
      so the guest can ask "can I cancel this?" or "is this suitable for my 4-year-old?" without retyping what they are looking
      at. It is a bottom sheet over the current screen, not a form. The one thing to get right: the guest must never lose
      the screen they came from; closing the sheet returns them exactly where they were.
    inputs:
    - field: question
      rule: >-
        Opens with 2-3 context chips written for the source screen (on a ticket: "Can I change the date?", "What's included?";
        in the cart: "Can I get a refund?"), then a free-text box. Up to 8,000 characters.
      source: contracts/satellite/ai.yaml#sendAiMessage | DI-207
    outputs:
    - element: answer
      rule: >-
        Same bubble, citations and feedback as WEB-044/GST-031. An answer about a policy cites the policy document (e.g. "Cancellation
        policy - Family Day Pass").
      source: contracts/satellite/ai.yaml#/components/schemas/AiMessage
    actions:
    - action: Ask
      result: >-
        Opens a conversation on first send (silently) and answers in the sheet; "Continue in chat" moves it to GST-032.
      source: contracts/satellite/ai.yaml#createAiConversation | contracts/satellite/ai.yaml#sendAiMessage
    - action: Hand over to a person
      result: As WEB-044; the handover summary includes what the guest was looking at.
      source: contracts/satellite/marketing-crm.yaml#handoverToAgent
    edgeCases:
    - case: The question needs a change Sahli cannot make (e.g. refund this order)
      expected: >-
        Sahli explains the policy and links to the screen that does it (manage booking) or hands over; it never performs the
        change (AI is read-only on the transactional core).
      source: ADR-0020 | screens/P01-guest-web-storefront.yaml#WEB-044 (notes)
    - case: AI unavailable
      expected: The sheet shows the venue's help topics for that screen and Hand over to a person; never an error page.
      source: screens/P02-guest-mobile-app.yaml#GST-033 (notes - degrades rather than errors)
    consistency:
    - with: GST-031
      note: Same conversation component; the conversation started here appears in the guest's earlier conversations.
    - with: WEB-044
      note: The web equivalent is the Ask Sahli panel opened from a page; same context chips.
    sampleData:
      openedFrom: Family Day Pass / تذكرة اليوم العائلي - Coastal Aqua, Sat 10 Oct
      chips:
      - Can I change the date?
      - Is it suitable for under-3s?
      - What's included?
      answer: >-
        You can change the date once, up to 24 hours before your visit, from My bookings. Children under 3 enter free and
        don't need a ticket.
      sources:
      - Date change policy
      - Child admission
    corrections:
    - what: >-
        pattern configEditor / template form, states "The saved concierge contextual help", emptyFirstRun "No concierge contextual
        help configured... sendAiMessage saves the first one".
      why: >-
        Nothing is configured or saved here; it is a conversation sheet over another screen. The states should be the conversation's
        (thinking, answered, failed, offline).
      source: screens/P02-guest-mobile-app.yaml#GST-033
    - what: Only sendAiMessage is declared.
      why: >-
        sendAiMessage needs a conversationId, so createAiConversation must be declared; handoverToAgent and recordAnswerFeedback
        belong here as on GST-031/WEB-044.
      source: contracts/satellite/ai.yaml#sendAiMessage | contracts/satellite/ai.yaml#createAiConversation
    - what: No way to pass the screen context (product, booking, cart) to the assistant.
      why: >-
        createAiConversation takes module and locale only and sendAiMessage content and collectionIds only; "contextual" help
        has no contextual field. Either add a context reference (subjectRef/route) to createAiConversation, or the client
        prefixes the question - the first is the honest one.
      source: contracts/satellite/ai.yaml#createAiConversation | contracts/satellite/ai.yaml#sendAiMessage
    - what: '"Collection ids" multiSelect on the guest form.'
      why: Guests do not choose knowledge collections.
      source: contracts/satellite/ai.yaml#sendAiMessage
    - what: >-
        The prototype match is to "Account → All screens → Wave 2 → AI concierge – contextual help" (a catalogue view, not
        a drawn screen), marked client-verified.
      why: There is no client-drawn layout for this screen; it should be treated as designed, not verified.
      source: screens/P02-guest-mobile-app.yaml#GST-033 (wireframe)
    decisions:
    - question: On which screens does contextual help appear (product detail, cart, booking detail, ride detail)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Product/attraction detail, cart and booking
        detail, as a small "Ask Sahli about this" link.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-012 | CHG-NOTE-001
      questionSource: designer default
  GST-048:
    block: A
    summary: >-
      The Extras step of the app booking flow: after the main tickets are chosen, the guest sees at most three relevant upgrades,
      add-ons or bundles (a family pass when 2 adults and 2 children are in the cart, a fast pass, a meal deal) and adds them
      or moves on. In Block A the offers come from the Promotions relationship map (rules); the recommendation engine replaces
      the producer in Block B with no screen change. The one thing to get right: the step must be skippable without friction,
      and "No thanks" is a deliberate decline that is remembered.
    inputs:
    - field: add (per offer)
      rule: >-
        Add puts the item in the cart with recommendationId = the offer's trackingId, so the sale is attributed. Where the
        add-on is quantity-based (lockers, meals), a -/+ stepper with the price multiplying, per the "Quantities on add-ons"
        setting.
      source: contracts/spine/orders.yaml#addCartLine (recommendationId) | DI-1070
    - field: No thanks (per offer)
      rule: >-
        An explicit "No thanks" on each card records a decline, which the engine remembers across channels; scrolling past,
        Continue or Back records nothing more than impressions. Do not draw a close X that looks like a decline.
      source: contracts/satellite/ai.yaml#recordRecommendationEvents | ADR-0052 (AI-D07) | DI-962
    outputs:
    - element: offer cards
      rule: >-
        At most three cards on the step, ranked; each shows image, name, price from Pricing (a struck-through original where
        a bundle saves), and a one-line template reason in the guest's language, e.g. "Saves AED 60 for 2 adults + 2 children".
        Never a confidence number or score; never something the guest already owns or that contradicts the cart (no general
        admission after VIP).
      source: DI-959 | DI-960 | ADR-0052 (AI-D09) | contracts/satellite/ai.yaml#/components/schemas/AiRecommendationItem
    - element: upgrades
      rule: >-
        "Upgrade your day" upgrades appear only once a main ticket is in the cart, and add-ons only on this step - each once.
      source: DI-978 | DI-979
    actions:
    - action: Continue
      result: >-
        Goes to the next booking step (sign-in or cart, per the venue's booking flow); with no offers, the step is skipped
        entirely.
      source: DI-428 | DI-1043
    - action: Add
      result: >-
        Card shows "Added" with an undo; the cart badge updates. A capacity-bound add-on that is sold out returns 409 and
        the card says "Sold out for your date".
      source: contracts/spine/orders.yaml#addCartLine
    - action: No thanks
      result: The card collapses with "We won't show this again"; recorded as decline.
      source: contracts/satellite/ai.yaml#recordRecommendationEvents
    edgeCases:
    - case: The recommendation call is slow or fails
      expected: >-
        The step never waits more than the 200 ms budget: it renders the rules answer or, with none, skips the step. No spinner
        blocks Continue.
      source: ADR-0052 | contracts/satellite/ai.yaml#decideRecommendations
    - case: Recommendations paused by an administrator
      expected: The slot is left empty and the Extras step is skipped (degradation mode of recommendations).
      source: contracts/satellite/ai.yaml#pauseAiCapability
    - case: An offer declined online earlier, or bought at POS
      expected: Not shown again.
      source: DI-962 | ADR-0052 (AI-D07)
    - case: Offline
      expected: Loaded cards stay with their age; Add waits for the connection and says so.
      source: screens/P02-guest-mobile-app.yaml#GST-048 (states.offline)
    consistency:
    - with: WEB-008
      note: >-
        The same step on the web; same three-card limit, same No thanks, same template reasons. The mobile booking flow is
        functionally identical to the web (DI-1092).
    - with: POS-002
      note: >-
        The till's upsell prompt reads the same engine and the same decline store; a decline here suppresses the offer at
        the till.
    sampleData:
      cart: 2 x Adult Day Pass, 2 x Child Day Pass - Coastal Aqua, Sat 10 Oct
      offers:
      - name: Family Day Pass (2+2) / تذكرة اليوم العائلي
        price: AED 540.00
        was: AED 600.00
        reason: Saves AED 60 for your family of four
        kind: bundle
      - name: Wave Rider Fast Pass
        price: AED 75.00 each
        reason: Skip the queue on our most popular ride
        kind: upgrade
      - name: Large locker
        price: AED 40.00
        reason: Popular with families
        kind: addOn
        stepper: true
    corrections:
    - what: >-
        The detail panel binds getUpsellSuggestions, which the screen does not declare; it declares decideRecommendations.
      why: >-
        Pick one. Per ADR-0052 the engine's decideRecommendations is the guest surface (placement checkout or cart, Block
        A answering from the Promotions relationship map); bind the cards to its items and drop getUpsellSuggestions.
      source: screens/P02-guest-mobile-app.yaml#GST-031 (guest app return FINDINGS.md) | ADR-0052
    - what: emptyNoAccess names PRODUCT_VIEW.
      why: >-
        A guest holds no permission (ADR-0025); WEB-008 already says so. With nothing to offer, the step is skipped, not shown
        empty.
      source: screens/P01-guest-web-storefront.yaml#WEB-008 (states.emptyNoAccess) | DI-428
      status: fixed
      by: CHG-GST-004
    - what: emptyFirstRun "No upsell cross-sell yet. Offers Add cart line".
      why: There is nothing to add when there are no offers; the step is skipped.
      source: DI-428
    - what: decideRecommendations maxItems defaults to 4.
      why: >-
        The client set at most three recommendations at checkout; the Extras placements should request maxItems 3 (or the
        default follow the placement strategy's limit of 3).
      source: DI-959 | contracts/satellite/ai.yaml#decideRecommendations
    decisions:
    - question: Does the Extras step show only add-ons and upgrades, or also cross-venue offers (another park in the tenant)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): Only offers for the venue and date in the
        cart; no partner or OTA offers in release 1 (AI-D08).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-013 | CHG-NOTE-001
      questionSource: ADR-0052 (AI-D08) | ADR-0051 (AI functions review 30 Sep §7)
  WEB-008:
    block: A
    summary: >-
      The web Extras step ("Add-ons & Upsell"): the distinct step after ticket selection where up to three upgrades, add-ons
      and bundles are offered, before sign-in (with "Ask to sign in: After add-ons", the default) and the cart. Block A offers
      come from the Promotions relationship map through the recommendation slot; Block B swaps in the engine. The one thing
      to get right: offers must look like helpful extras the guest can ignore, never like a required step, and the add-ons
      live only here.
    inputs:
    - field: add-on quantity
      rule: >-
        -/+ stepper, minimum 0, price multiplies (setting "Quantities on add-ons"); mandatory add-ons attached to a product
        are pre-selected and cannot be removed here.
      source: DI-1070 | DI-470
    - field: No thanks
      rule: As GST-048 - an explicit decline per card; ignoring is not a decline.
      source: ADR-0052 (AI-D07) | contracts/satellite/ai.yaml#recordRecommendationEvents
    outputs:
    - element: offer cards
      rule: >-
        Max three, ranked, image + name + price + template reason; bundles show savings with the original struck through (savingsAmount
        / savingsPercentage from the bundle). Reasons from templates only, in the page language.
      source: DI-959 | DI-586 | contracts/satellite/promotions.yaml#getBundle | ADR-0052 (AI-D09)
    - element: booking step indicator
      rule: >-
        The Extras step is one step of the venue's published booking flow; when the flow has no Extras step or nothing qualifies,
        the step disappears from the indicator.
      source: contracts/satellite/white-label.yaml#getPublishedBookingFlow | DI-428
    actions:
    - action: Continue
      result: >-
        With signInAt afterAddOns (default) opens sign-in (WEB-016), or the guest code when guest checkout is on; the basket
        is kept. With atPayment goes straight to the cart.
      source: DI-1043 | screens/P01-guest-web-storefront.yaml#WEB-008 (notes, REV3-3)
    - action: Add / No thanks
      result: As GST-048.
      source: contracts/spine/orders.yaml#addCartLine | contracts/satellite/ai.yaml#recordRecommendationEvents
    edgeCases:
    - case: Recommendation slot times out (200 ms) or recommendations are paused
      expected: >-
        Rules answer or no offers; the step renders the venue's configured add-ons for the product and never blocks Continue.
      source: ADR-0052 | contracts/satellite/ai.yaml#pauseAiCapability
    - case: Guest is a member
      expected: No membership offer; F&B or retail add-ons instead. An expiring membership shows a renewal.
      source: DI-960
    - case: Arabic
      expected: Cards mirror; the cart stays on the right by default ("Cart side in Arabic").
      source: DI-1051
    consistency:
    - with: GST-048
      note: Same step, same limits and wording.
    - with: GST-056
      note: >-
        The app's add-ons screen shares the catalogue-bundle binding that must be removed (R269); change both together.
    sampleData:
      venue: Coastal Aqua
      cart: 2 Adult + 2 Child Day Pass, Sat 10 Oct
      offers:
      - name: Family Day Pass (2+2)
        price: AED 540.00
        was: AED 600.00
        reason: Saves AED 60 for your family
      - name: Cabana - Family
        price: AED 350.00
        reason: Shade and seating for up to 6
      - name: Lunch combo
        price: AED 45.00 each
        reason: Burger, fries and a drink
        stepper: true
    corrections:
    - what: >-
        dataTable "Every bundle" bound to listCatalogueBundles (signed terminal snapshots, with publishedBy, contentHash,
        signatureKeyId columns).
      why: >-
        Those are the catalogue snapshots tills pull (ADR-0013), not sellable bundles; R269 says unbinding is still owed.
        Remove it; bundles on this step come from the recommendation slot and getBundle.
      source: screens/P01-guest-web-storefront.yaml#WEB-008 (notes, R269)
    - what: The suggestion panel binds getUpsellSuggestions, which is not in the screen's apis (decideRecommendations is).
      why: >-
        Same as GST-048 - bind the engine's decideRecommendations items; getUpsellSuggestions is not in the Block A slice.
      source: 'ADR-0052 | ADR-0059 (Block A slice: handoff/delivery-slice.json)'
    - what: The WEB-008 to WEB-016 transition (sign-in after add-ons) is missing from navigation.
      why: The prototype and REV3-3 put sign-in on leaving this step.
      source: screens/P01-guest-web-storefront.yaml#WEB-008 (wireframe.prototype.differences) | DI-1043
    decisions:
    - question: Is the swim-vest add-on offered here for non-swimmers (Help me choose answer), and is the splash-and-river
        pass a separate product?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): The vest is an add-on on this step; the
        splash-and-river pass is its own product (as built).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-015 | CHG-NOTE-001
      questionSource: DI-1118
  GST-054:
    block: A
    summary: >-
      The AI planner: on the Plan tab, the guest asks in their own words to change the rules-built day plan ("less walking",
      "lunch near the wave pool", "add a show after 4") and the planner agent proposes a change the guest applies as a new
      plan version. The rules plan always stands on its own - with AI off, failing or unlicensed the guest keeps the plan
      and edits it by hand. The one thing to get right: the agent proposes, the guest applies; every applied change can be
      undone, and nothing is booked or paid from here.
    inputs:
    - field: request (chat)
      rule: >-
        A chat input with example requests on first open ("Fewer queues", "We have a 4-year-old", "Indian food for lunch",
        "Finish by 5 pm"). The party, dates and pace from GST-053 are context, not re-asked.
      source: screens/P02-guest-mobile-app.yaml#GST-054 (states.emptyFirstRun) | DI-1021
    outputs:
    - element: proposed change
      rule: >-
        Shown as a before/after on the day timeline (items swapped, moved, removed or added highlighted), with one line why
        and the new wait-time estimates; "Apply this change" commits it, "Not this" leaves the plan untouched.
      source: >-
        contracts/satellite/venue-map.yaml#updateVisitPlan | contracts/satellite/ai.yaml#requestSuggestion (kind itinerary)
    - element: '"Not at this park" banner'
      rule: >-
        A preference the day's park cannot meet is said, not filled: e.g. "No Indian restaurant at Summit Peaks. Indian food
        is at Aqua Park (day 2)." Every suggested ride, dining or retail point (shops and kiosks included) comes from that
        day's park only.
      source: DI-1112 | DI-1113 | DI-1099 | MoM 30 Sep 4.7
    - element: wait times on the plan
      rule: Each ride shows "about 20 min" with its basis on tap; estimates are labelled estimates.
      source: contracts/satellite/queue.yaml#getWaitTimes
    actions:
    - action: Apply this change
      result: >-
        Writes a new plan version (updateVisitPlan with baseVersion); the timeline re-lays and an Undo appears. 409 (the plan
        changed elsewhere) reloads and re-proposes; 422 point-not-at-day-venue is never shown to the guest - the agent simply
        does not propose it.
      source: >-
        contracts/satellite/venue-map.yaml#updateVisitPlan | screens/P02-guest-mobile-app.yaml#GST-054 (notes, grounding)
    - action: Back to your plan
      result: Returns to GST-053 with the current version.
      source: screens/P02-guest-mobile-app.yaml#GST-054
    edgeCases:
    - case: AI unavailable, paused, over budget or not licensed
      expected: >-
        The plan stays on screen with a short note "The planner can't chat right now - you can still edit your plan" and the
        manual edit controls; never an error page.
      source: screens/P02-guest-mobile-app.yaml#GST-054 (states.aiUnavailable) | ADR-0059
    - case: Nothing suits the whole party (e.g. every ride over a child's height)
      expected: Says so and offers to change the answers.
      source: screens/P02-guest-mobile-app.yaml#GST-054 (states.emptyNoResults)
    - case: The guest asks the planner to book or pay
      expected: The agent may prepare the booking but the guest must press Book in the app; it never checks out.
      source: >-
        screens/P02-guest-mobile-app.yaml#GST-054 (planner tool notes in ai.yaml: bookVisitPlan requiresGuestConfirmation)
    - case: Signed-out guest
      expected: Can chat and build a plan; asked to sign in only to save or book.
      source: screens/P02-guest-mobile-app.yaml#GST-054 (states.emptyNoAccess)
    consistency:
    - with: GST-053
      note: The rules plan screen (ticketing-guest process); same timeline component, same Undo and version history.
    - with: GST-031
      note: Same assistant bubbles and Sahli identity; the planner is Sahli in planning mode, not a second persona.
    sampleData:
      venue: Summit Peaks (day 1), Aqua Park (day 2)
      party: 2 adults, 2 children (6 and 4, 105 cm)
      request: We want lunch near the wave pool and fewer queues after 2 pm
      proposal:
      - Move Wave Rider to 10:15 (about 10 min wait, was 35)
      - Lunch at Lagoon Grill 12:30, next to the wave pool
      - Swap Twister Tubes (min 120 cm) for Lazy River at 14:30
      banner: No Indian restaurant at Summit Peaks. Indian food is at Aqua Park (day 2).
    corrections:
    - what: createAiConversation is triggered onLoad.
      why: >-
        Opening the Plan tab would open a billed conversation every time. Open it on the first message (as on the concierge);
        the plan loads without it.
      source: screens/P02-guest-mobile-app.yaml#GST-054 (apis) | contracts/satellite/ai.yaml#createAiConversation
    - what: The AI review (30 Sep §8) says ai.yaml has no planner operation and GST-054 is deferred.
      why: >-
        Superseded the same day: the screen is wave 1, Block A, and the planner works through the planner.guest profile and
        five venue-map tool operations plus requestSuggestion kind itinerary. The review's finding 3 should be closed.
      source: >-
        ADR-0051 (AI functions review 30 Sep §8) | screens/P02-guest-mobile-app.yaml#GST-054 (notes) | contracts/satellite/ai.yaml#requestSuggestion
        (kind itinerary)
    - what: The 30 September tracker says retail and kiosks are to be added to the planner.
      why: >-
        Make sure the plan operations return shops and kiosks as points; the screen draws them as plan items with their own
        icon.
      source: TRACKER Tracker row 13 | MoM 30 Sep 4.7
    decisions:
    - question: Does each applied AI change show what it cost or saves (e.g. a fast pass it added)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): An item that costs money shows its price
        on the proposal and is added to the cart only when the guest books the plan.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-014 | CHG-NOTE-001
      questionSource: DI-1021 | screens/P02-guest-mobile-app.yaml#GST-054 (bookVisitPlan requiresGuestConfirmation)
  BO-091:
    block: A
    summary: >-
      The venue manager's AI control panel: what the assistants may do at this venue, what AI has cost this month and will
      cost by month end, and what happens at the budget ceiling. It answers two questions at a glance - is the AI working,
      and what is it costing - with staff and guest spend shown apart, because a venue can manage the first and cannot stop
      guests asking. The one thing to get right: a venue can only narrow what the tenant set, never widen it, and the screen
      must show which values are inherited.
    inputs:
    - field: monthlyTokenCeiling / ceilingBehaviour / ceilingWarningPercent
      rule: >-
        Ceiling as a monthly amount with the behaviour as three explained choices - Warn (default: "Sahli keeps answering;
        you are told at 80% and at the ceiling"), Warn then switch off, Block. Warning percent defaults to 80. Empty ceiling
        means no ceiling, said in words.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiPolicy | screens/P08-venue-back-office.yaml#BO-091 (notes, CF-14)
    - field: ceilingBehaviourByCapability
      rule: >-
        Per-capability override list; fraud and risk scoring default to "Never restrict" (it spends no tokens) and the guest
        concierge to Warn. A capability not listed follows the general behaviour - say so in the row.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (ceilingBehaviourByCapability)
    - field: maskedFields
      rule: >-
        Shown as the list of personal-data fields that never leave the platform, all ticked by default. Clearing the list
        does not send everything - the default (every pii field) applies; the UI must say "An empty list masks every personal
        field" and never offer "send all".
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (maskedFields) | ADR-0020
    - field: enabledCapabilities / guestCapabilityScope / autonomyOverrides / requiresApprovalFor
      rule: >-
        Toggles and selects showing the tenant's value beside each venue value ("From tenant: on"). A venue can switch off
        or lower, never switch on what the tenant switched off or raise autonomy above the capability ceiling; values above
        are drawn disabled with the reason. governance, decisionRecords and residencyPrivacy are always on and not drawn as
        toggles.
      source: contracts/satellite/ai.yaml#setAiPolicy | ADR-0050 | ADR-0018
    - field: assistant profiles
      rule: >-
        One row per profile (guest concierge, support chatbot, staff by role, planner): audience, roles, knowledge collections,
        languages, hand-over target, active. A guest profile's scope can only be a subset of the policy's guest scope.
      source: contracts/satellite/ai.yaml#configureAssistantProfile
    outputs:
    - element: spend
      rule: >-
        Month to date in AED against the ceiling with the 80% line; the month-end projection drawn dashed and labelled "Forecast"
        with its basis (e.g. "run rate of the last 7 days"); never added into the month-to-date figure. Split by staff and
        guest, then by agent/capability. Interactions, p95 latency and refusal rate per row.
      source: contracts/satellite/ai.yaml#getAiUsage (AiUsageReport.forecast) | DI-968
    - element: rejection rate
      rule: Shown per capability as "proposals your team refused" - the measure of whether an assistant is worth having.
      source: contracts/satellite/ai.yaml#getAiUsage (rows.rejectionRate)
    - element: knowledge indexing health
      rule: >-
        A small secondary panel: failures by stage. parse failures are the venue's document to fix (link to it); embed/upsert
        failures are the platform's. Not the screen's main table.
      source: contracts/satellite/ai.yaml#listIndexFailures | screens/P08-venue-back-office.yaml#BO-091 (notes)
    - element: bring your own key
      rule: Read-only line saying whether this tenant may use its own provider key (decided by TICVAI per tenant).
      source: contracts/satellite/ai.yaml#getAiByokEnablement | MoM 21 Sep 4.10 (AI-D14)
    - element: Ceiling currency
      rule: The ceiling is shown and set in the tenant's selected currency (USD unless the tenant picks another, e.g. AED),
        with the token count beside it as the second figure.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-001)
    actions:
    - action: Save AI policy
      result: >-
        Saves the venue row (scopeLevel venue). A change that would widen the tenant's policy is refused and the field says
        why. Saving a lower ceiling than spend so far warns before saving.
      source: contracts/satellite/ai.yaml#setAiPolicy
    - action: Save assistant profile
      result: Replaces (200) or creates (201) the profile; a guest scope wider than the policy is refused on the field.
      source: contracts/satellite/ai.yaml#configureAssistantProfile
    edgeCases:
    - case: Ceiling reached with Warn
      expected: >-
        Banner "You've reached this month's AI budget. Assistants keep working until you change it." with Change ceiling /
        Switch off guest concierge.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (ceilingBehaviour "decided 17 August")
    - case: No venue row yet
      expected: >-
        The tenant's policy is shown as in force ("Using your organisation's AI settings") with Customise for this venue;
        never an empty state.
      source: contracts/satellite/ai.yaml#getAiPolicy ("nearest ancestor wins")
    - case: Caller lacks AI_AUDIT_VIEW but has AI_CONFIGURE
      expected: Policy is editable; the spend panel says which permission shows spend.
      source: contracts/satellite/ai.yaml#getAiUsage | contracts/satellite/ai.yaml#getAiPolicy
    consistency:
    - with: ADM-037
      note: >-
        The provider and key are set by TICVAI on the console; this screen only shows which provider serves the venue and
        whether BYOK is allowed.
    - with: ADM-522
      note: The same L0-L4 labels and ceilings as the console's autonomy screen.
    sampleData:
      venue: Coastal Aqua
      policy:
        ceiling: AED 3,000.00 / month
        behaviour: Warn
        warnAt: 80%
        guestScope:
        - ticketSelection
        - faq
        - waitTimes
        - wayfinding
        - recommendations
      spend:
        monthToDate: AED 1,742.50
        forecast: AED 2,610.00 by 31 Oct (run rate of the last 7 days)
        rows:
        - agent: Guest concierge (Sahli)
          audience: guest
          interactions: 18420
          cost: AED 1,206.30
          refusalRate: 3%
        - agent: Staff assistant
          audience: staff
          interactions: 2310
          cost: AED 391.10
          rejectionRate: '-'
        - agent: Configuration assistant
          audience: staff
          interactions: 96
          cost: AED 145.10
          rejectionRate: 12%
      indexFailures:
      - document: Refund policy v3.pdf
        stage: parse
        error: Scanned PDF with no text layer
        attempts: 3
    corrections:
    - what: The main dataTable is "Every index failure" (listIndexFailures) with job id and stage filters.
      why: >-
        The screen's purpose is policy and spend; index failures are a secondary health panel (the notes say they sit beside
        spend).
      source: screens/P08-venue-back-office.yaml#BO-091 (purpose, notes)
    - what: Staff and guest spend shown separately (notes, CF-14), but getAiUsage groupBy has no audience.
      why: >-
        Add groupBy audience (staff, guest) to getAiUsage, or define the split as the guest-concierge and planner agents against
        the rest.
      source: contracts/satellite/ai.yaml#getAiUsage | screens/P08-venue-back-office.yaml#BO-091 (notes)
    - what: The policy form carries retainInteractionsDays.
      why: >-
        Deprecated on 29 September (AI-D05); retention is a tenant setting per data class in tenancy, not here. Do not draw
        it.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (retainInteractionsDays) | ADR-0020 (AI-D05)
    - what: getAiByokEnablement is not declared, though its description says BO-091 reads it.
      why: Declare it so the screen can say whether the venue may bring its own key.
      source: contracts/satellite/ai.yaml#getAiByokEnablement
      status: fixed
      by: CHG-WIR-012
    - what: >-
        The form exposes engine tuning (retrieveTopK, rerankTopK, semanticCacheThreshold, negativeCacheTtlSeconds, chunking,
        quantisation, hnsw, cascade).
      why: >-
        These are platform tuning, not venue manager decisions; hide them behind an Advanced section visible to TICVAI staff
        only, or leave them to the console.
      source: contracts/satellite/ai.yaml#setAiPolicy | designer default
    decisions:
    - question: Is the ceiling expressed to the venue in AED or in tokens?
      decision: The AI spend ceiling is shown and set in the tenant's selected currency (default USD), with tokens shown alongside.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-008 | CHG-NOTE-001
      questionSource: contracts/satellite/ai.yaml#getAiUsage (rows.cost) | ADR-0020 (AI-D02)
  BO-919:
    block: A
    summary: >-
      Event resource forecast: before resources are finally allocated for an event or a busy day, the manager sees, per resource
      type, what is configured against what the forecast says will be needed, with the busy-case figure, and can test a what-if
      (a bigger crowd, an extra show, rain). The forecast exists from day one on the venue's starting pattern and says so.
      The one thing to get right: "AI recommended" is a range from a published forecast version, shown next to the configured
      figure - never a silent overwrite of the allocation.
    inputs:
    - field: what-if changes (createForecastScenario)
      rule: >-
        A scenario is built on a published forecast version (baseVersionId, chosen from the event's date) with typed changes:
        expected attendance, opening hours, an added performance, weather, a closure, staffing. Name optional; default "What-if:
        <event> <date>". It never changes production.
      source: contracts/satellite/ai.yaml#createForecastScenario | MoM 18 Sep 4.10
    outputs:
    - element: Configured vs AI recommended
      rule: >-
        Two columns per resource (lifeguards, cashiers, gate lanes, golf carts, cabanas): configured quantity, and the recommended
        quantity at the most-likely forecast with the busy case (P90) beside it, e.g. "14 (busy case 17)". A difference is
        highlighted, not corrected.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiOperationalRequirement (quantity, quantityP90) | screens/P08-venue-back-office.yaml#BO-919
    - element: basis and maturity
      rule: >-
        The forecast's "Based on" line and stage badge above the table, e.g. "Starting - Based on: your venue profile, water-park
        pattern, UAE calendar, weather. Limited historical data." The forecast range is shown, not a single number.
      source: ADR-0051 | contracts/satellite/ai.yaml#/components/schemas/AiForecastVersion (maturity)
    - element: scenario result
      rule: The scenario's figures beside the base version's, clearly labelled "What-if", with the changes listed.
      source: contracts/satellite/ai.yaml#createForecastScenario
    - element: Requirement kinds covered
      rule: Every requirement kind (staff, pos, kiosk, gates, fnb, retail, stock, resource, equipment, facility), filtered
        to what the venue has configured. The model behind each task comes from TICVAI's curated range (the best-suited model
        plus 3-4 alternatives).
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-001)
    actions:
    - action: Run what-if
      result: Creates the scenario and shows its requirements next to the base; nothing is allocated.
      source: contracts/satellite/ai.yaml#createForecastScenario
    - action: Open in staffing requirements
      result: Opens BO-927 for the staff rows, where a requirement is accepted, modified or rejected.
      source: screens/P08-venue-back-office.yaml#BO-927
    edgeCases:
    - case: No published forecast for the date yet
      expected: >-
        Says so and offers to run one (or that the nightly run will publish it); never shows a blank recommended column. The
        day-one forecast exists from the starting pattern, so this happens only before the first run.
      source: ADR-0051 | contracts/satellite/ai.yaml#getForecast
    - case: Forecast stale (more than 36 hours since the last publication)
      expected: A "Forecast is out of date" marker on the recommended column with the publication time.
      source: contracts/satellite/ai.yaml#getForecast (stale)
    - case: Venue profile missing a setting the requirement needs (e.g. no productivity standard for a role)
      expected: The row says which setting is missing and links to the AI venue profile; other rows still show.
      source: >-
        ADR-0051 (Contract change) | contracts/satellite/ai.yaml#/components/schemas/AiVenueSettings (staffProductivity)
    consistency:
    - with: BO-927
      note: Same requirement rows for staff; the decision is taken there.
    - with: ADM-507
      note: Same what-if model as the console simulator; same labels for changes.
    sampleData:
      event: Ladies' Night, Coastal Aqua, Thu 15 Oct 2026, 18:00-23:00
      forecast:
        mostLikely: 2600
        range: 1,850-3,400 guests
        stage: Starting
        basedOn: your venue profile, water-park pattern, UAE calendar, weather (31°C, clear)
      rows:
      - resource: Lifeguards
        configured: 12
        recommended: 14 (busy case 17)
      - resource: F&B cashiers
        configured: 6
        recommended: 6 (busy case 8)
      - resource: Gate lanes
        configured: 4
        recommended: 3 (busy case 4)
      whatIf: +600 guests (DJ announced)
    corrections:
    - what: >-
        The dataTable and detail panel bind no operation (columns "Configured", "AI Recommended" with op None), and in Block
        A only createForecastScenario is in the slice.
      why: >-
        The screen needs getForecast and listOperationalRequirements (both declared, neither in the slice) to show anything,
        and a scenario needs a published baseVersionId to start from. Either add the two reads to the Block A slice or the
        Block A screen is a form with nothing to stand on.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-BO-919)) | ADR-0059 (Block A slice: handoff/delivery-slice.json) | contracts/satellite/ai.yaml#createForecastScenario
    - what: DI-280 (14 August) says data-dependent forecasting cannot be delivered in phase one for lack of history.
      why: >-
        Superseded by plan decision 10 and ADR-0051 (baseline first, from day one). Mark DI-280 superseded so it stops reaching
        the bundle.
      source: DI-280 | ADR-0051 | ADR-0051 (AI-D17)
    decisions:
    - question: Which resource types does the event forecast cover in release 1 (staff, gates, F&B tills, rentable equipment)?
      decision: 'The event forecast covers every requirement kind (staff, pos, kiosk, gates, fnb, retail, stock, resource,
        equipment, facility), filtered to what the venue configured. Action: a curated model per AI/ML task with 3-4 alternatives
        (done as research; see the curated-range decision).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-009 | CHG-NOTE-001
      questionSource: contracts/satellite/ai.yaml#/components/schemas/AiOperationalRequirement
  BO-927:
    block: A
    summary: >-
      Staffing requirements from the forecast: per role and period, how many people the forecast says are needed (with the
      busy case), how that was worked out (forecast divided by a productivity standard), and where the rota is short. The
      manager accepts, modifies or rejects each requirement; accepting hands it to Workforce as a recommendation - nothing
      is rostered here (autonomy L2 Prepare). The one thing to get right: the standard used is visible and editable in the
      venue profile, because day-one standards are defaults from the venue-type pattern.
    inputs:
    - field: decision (accept / modify / reject)
      rule: >-
        Per row. Modify needs a quantity (whole people, ≥ 0) and offers a note; reject offers a reason note. Bulk accept for
        a day is allowed; bulk reject is not.
      source: contracts/satellite/ai.yaml#decideOperationalRequirement | designer default
    - field: productivity standard (e.g. "1 lifeguard per 250 guests", "40 transactions per cashier hour")
      rule: >-
        Shown per role with where it came from (venue-type default, your edit, or measured from your shifts after about 4
        weeks). Editing it opens the AI venue profile; it is not edited inline on each requirement.
      source: >-
        ADR-0051 (AI functions review 30 Sep §4 Operational requirements) | contracts/satellite/ai.yaml#/components/schemas/AiVenueSettings
        (staffProductivity)
    outputs:
    - element: requirement rows
      rule: >-
        Role, period (e.g. Sat 17 Oct 10:00-14:00), required quantity and busy case (quantityP90), rota coverage from Workforce
        and the gap ("2 short"), status (issued, accepted, modified, rejected, handed over, expired).
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiOperationalRequirement | contracts/satellite/workforce.yaml#getStaffingCoverage
    - element: how it was worked out
      rule: >-
        Expandable: "Forecast 2,600 guests (range 1,850-3,400) ÷ 1 lifeguard per 250 guests in the water = 11; busy case 14",
        with the forecast version, its stage and "Based on" line.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiOperationalRequirement (productivityStandard, versionId) | ADR-0051
    actions:
    - action: Accept
      result: >-
        Status accepted then handed over; Workforce receives a recommendation bound to the forecast version; a link opens
        the rota there.
      source: contracts/satellite/ai.yaml#decideOperationalRequirement
    - action: Modify / Reject
      result: >-
        Records the person's figure or rejection with the note; 409 if the requirement already expired or was superseded by
        a newer forecast.
      source: contracts/satellite/ai.yaml#decideOperationalRequirement
    edgeCases:
    - case: A newer forecast version is published after the requirement was issued
      expected: The old requirement shows "Superseded by the forecast of <time>" and cannot be accepted; the new one appears.
      source: contracts/satellite/ai.yaml#publishForecastVersion ("operational requirements are derived from the new one")
    - case: No productivity standard for a role
      expected: The row names the missing standard and links to the venue profile instead of a number.
      source: ADR-0051 (422 only for a missing setting)
    consistency:
    - with: BO-919
      note: Same requirement rows and forecast basis.
    - with: ADM-513
      note: The console's workforce forecast uses the same rows and labels.
    sampleData:
      venue: Coastal Aqua
      rows:
      - role: Lifeguard
        period: Sat 17 Oct 10:00-14:00
        required: 11
        busyCase: 14
        rota: 9
        gap: 2 short
        status: issued
      - role: Cashier (F&B)
        period: Sat 17 Oct 12:00-15:00
        required: 5
        busyCase: 6
        rota: 5
        gap: '0'
        status: issued
      standard:
        role: Lifeguard
        value: 1 per 250 guests in the water
        from: Water-park default (edit in venue profile)
      forecast:
        stage: Learning
        basedOn: your venue profile, UAE calendar, weather, 5 weeks of your sales
    corrections:
    - what: >-
        In Block A only decideOperationalRequirement is in the slice; listOperationalRequirements and getForecast are not.
      why: >-
        A requirement cannot be decided if it cannot be listed. Add listOperationalRequirements (and getForecast for the basis)
        to the Block A slice.
      source: 'ADR-0059 (Block A slice: tasks.csv (APP-SETUP-BO-927)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)'
    - what: >-
        The form's example field "1 Lifeguard / 250 guests" is a concurrent ratio, while AiVenueSettings.staffProductivity
        is "units per staff hour".
      why: >-
        Lifeguard and supervision ratios are guests present per staff member, not throughput per hour. The productivity standard
        needs a ratio kind (per hour vs present at once), or lifeguard cover is wrong by the length of a visit.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiVenueSettings (staffProductivity) | screens/P08-venue-back-office.yaml#BO-927
    - what: >-
        The layout has an unbound dataTable, a primaryButton with no label and an inline productivity textField; no operation
        sets a standard here.
      why: >-
        Bind the table to listOperationalRequirements, the buttons to decideOperationalRequirement, and move standards to
        the venue AI profile (setAiVenueSettings).
      source: screens/P08-venue-back-office.yaml#BO-927 | contracts/satellite/ai.yaml#setAiVenueSettings
    decisions:
    - question: Does an accepted requirement create draft shifts in Workforce, or only a coverage target the rota manager
        works to?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): A coverage target (recommendation) shown
        on the rota; shifts are created by a person in Workforce.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-010 | CHG-NOTE-001
      questionSource: contracts/satellite/ai.yaml#decideOperationalRequirement ("a person applies it there")
  ADM-037:
    block: A
    summary: >-
      TICVAI platform staff set a tenant's AI provider here: which provider and model serve which agent tasks, within what
      the tenant's region allows, with the key held in the vault and proven to work before anyone relies on it. Model choice
      is system-managed by default; a tenant may override per agent with its own key only where TICVAI has enabled bring-your-own-key.
      The one thing to get right: no secret is ever displayed, every change is tied to an open, time-boxed grant into the
      tenant, and a fitness warning informs but never blocks.
    inputs:
    - field: tenant + access grant
      rule: >-
        Pick a tenant first; until a platform-staff grant into it is open the provider list and every action are disabled
        with "Open access to <tenant> to continue". The grant asks reason, ticket reference and expiry; AI_CONFIGURE and SCOPE_VIEW
        preselected.
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-037 (notes, R098) | contracts/spine/identity.yaml#openPlatformStaffGrant
    - field: kind / model / endpoint / residency
      rule: >-
        Provider kind (Azure OpenAI, OpenAI, Gemini, Anthropic, local LLM, OpenAI-compatible). A client-hosted model is the
        same form: key plus endpoint address. The region's allowed residencies are shown above the form; a provider outside
        them is refused 409 residency-refused and the error sits on the residency field.
      source: contracts/satellite/ai.yaml#setAiProvider | DI-966 | MoM 21 Sep 4.10
    - field: secret (setAiCredential)
      rule: >-
        Write-only password field, entered once; after saving only the reference, rotation date, expiry and last-verified
        date show. Rotation offers a grace period in minutes so the old key keeps working while traffic moves.
      source: contracts/satellite/ai.yaml#setAiCredential | screens/P09-platform-admin-console.yaml#ADM-037 (notes)
    - field: taskKeys / priority / failover / degradeGracefully
      rule: >-
        Bind the provider to named agent tasks (concierge, configuration assistant, analytics, embeddings...); order is configuration
        - a priority number and a failover provider; degrade gracefully explained as "answer from rules or offer a person
        instead of failing".
      source: contracts/satellite/ai.yaml#setAiProvider | DI-971
    - field: BYOK enablement
      rule: 'Platform-only switch (PLATFORM_AI_MANAGE and an open grant): enabled, per task or all tasks, allowed tasks, reason.
        Shows managedBy (TICVAI / tenant) on each provider row. With BYOK the engine maps each AI task to that provider''s
        equivalent model from TICVAI''s curated range (tiers per task, not model names), and the usage is billed to the client''s
        own key; there is no billing choice on this screen.'
      source: contracts/satellite/ai.yaml#setAiByokEnablement | MoM 21 Sep 4.10 (AI-D14) | decided 2 October 2026 by Chinmay
        (CHG-NOTE-001)
    outputs:
    - element: providers table
      rule: >-
        Kind, model, tasks, priority, failover, scope, credential reference (never the key), rotated, expires (amber within
        14 days; the 14-day threshold is a designer default), last verified, managed by. Expired or never-verified rows flagged.
      source: contracts/satellite/ai.yaml#listAiProviders | designer default
    - element: model fit
      rule: 'Per task the model is TICVAI''s curated choice. A client cannot change the model per agent: a model outside the
        curated map for that task is refused (modelNotCurated) with the error on the model field, so no "warns, never blocks"
        notes are drawn. The fitness band stays as information beside the curated choice.'
      source: MoM 21 Sep 4.10 (AI-D18) | DI-967 | DI-971 | contracts/satellite/ai.yaml#setAiProvider | decided 2 October 2026
        by Chinmay (CHG-NOTE-001)
    actions:
    - action: Test AI provider
      result: >-
        Runs a minimal call with the stored key and shows pass/fail with latency; the button says it costs a few tokens billed
        to the tenant. Activation is offered only after a passing test since the last credential change.
      source: >-
        contracts/satellite/ai.yaml#testAiProvider | screens/P09-platform-admin-console.yaml#ADM-037 (notes, test before activate)
    - action: Save AI provider / Save credential
      result: >-
        Saved and logged against the open grant; 403 platform-grant-required if the grant lapsed mid-edit, with Reopen access.
      source: contracts/satellite/ai.yaml#setAiProvider | contracts/satellite/ai.yaml#setAiByokEnablement
    - action: Publish prompt template version
      result: >-
        Creates the next immutable version (AI_APPROVE for a tenant variant, PLATFORM_AI_MANAGE for platform); it reaches
        production through release stages.
      source: contracts/satellite/ai.yaml#publishPromptTemplate
    edgeCases:
    - case: Region with no adequacy finding
      expected: Only a locally hosted model or none is offered; the banner says so.
      source: ADR-0020 (setAiProvider region restriction)
    - case: Every provider fails at runtime
      expected: Not this screen's state, but the provider rows show the last failed verification so the cause is findable.
      source: contracts/satellite/ai.yaml#sendAiMessage (503)
    - case: A model outside the curated map for the task
      expected: Refused (modelNotCurated); the model field lists the curated choices for that task. AI-D18's "warns, never
        blocks" no longer applies.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-001)
    consistency:
    - with: BO-091
      note: The venue sees the provider serving it and whether BYOK is allowed, read-only.
    - with: ADM-544
      note: Model and provider names here are the ones the runtime trace shows.
    sampleData:
      tenant: Coastal Leisure Group (UAE North)
      grant:
        reason: Configure AI provider for go-live
        ticket: OP-2816
        expires: Today 18:00
      providers:
      - kind: Azure OpenAI
        model: gpt-4o-mini
        tasks:
        - concierge
        - faq
        priority: 1
        credentialRef: kv://ticvai-uaen/coastal/aoai-1
        rotated: 01 Sep 2026
        expires: 01 Mar 2027
        lastVerified: Today 09:14
        managedBy: TICVAI
      - kind: Azure OpenAI
        model: gpt-4o
        tasks:
        - configuration assistant
        - analytics
        priority: 1
        managedBy: TICVAI
        fitness: OK
      - kind: Azure OpenAI
        model: text-embedding-3-large
        tasks:
        - embeddings
        priority: 1
        managedBy: TICVAI
      warning: gpt-4o-mini is underpowered for the configuration assistant (fitness 0.52, floor 0.70). You can still save.
    corrections:
    - what: >-
        In Block A only the writes are in the slice (setAiProvider, setAiCredential, setAiModel, setAiByokEnablement, publishPromptTemplate);
        listAiProviders, testAiProvider, listOwnPlatformStaffGrants, getRegionSettings and getAiByokEnablement are not.
      why: >-
        The Block A screen cannot list what it set, cannot find an open grant after a reload, cannot show the residency restriction
        and cannot honour "test before activate". Add those five reads/tests to the Block A slice.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-037)) | ADR-0059 (Block A slice: handoff/delivery-slice.json) |
        screens/P09-platform-admin-console.yaml#ADM-037 (notes)
    - what: emptyFirstRun says "Offers no create action - this screen declares no operation that makes one".
      why: setAiProvider creates a provider (id optional); the first-run state should offer Add provider.
      source: contracts/satellite/ai.yaml#setAiProvider
    decisions:
    - question: Who pays when a client picks its own provider or a costlier model?
      decision: 'With BYOK, the AI engine maps each AI task to the client provider''s equivalent model from TICVAI''s curated
        range (tiers, not model names: research section 2.3); usage is billed to the client''s own key. Closes AI-D20 (deferred
        to the AI workshop).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-001 | CHG-NOTE-001
      questionSource: MoM 30 Sep 4.1 (AI-D20) | ADR-0020 (AI-D02) | ADR-0020 (AI-D03) | MoM 30 Sep 4.1
    - question: How much may a client change the pre-selected model per agent itself?
      decision: A client cannot change the model per agent. TICVAI curates the model for each task; setAiProvider/setAiModel
        refuse a model outside the curated map for that task (new problem type, e.g. modelNotCurated). Overturns AI-D18's
        'warns, never blocks'.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-002 | CHG-NOTE-001
      questionSource: DI-967 | MoM 21 Sep §6
  ADM-508:
    block: A
    summary: >-
      Forecast accuracy, review and publication: how accurate the forecasts have actually been (measured against actuals,
      by horizon, against the baseline rule), and the place where a forecast version that does not auto-publish is reviewed
      and published for the rest of TICVAI to use. The one thing to get right: accuracy is a measured history, shown as WAPE,
      bias and range coverage with the period it was measured over - never a promise on a future forecast - and publishing
      is a person's decision with the quality gates in view.
    inputs:
    - field: Run forecast now
      rule: >-
        Choose a forecast definition; the run starts outside the nightly schedule and returns a version in Running. 409 if
        a run of that definition is already running.
      source: contracts/satellite/ai.yaml#runForecast
    - field: publication note
      rule: Optional note (shown in the version history) on Publish.
      source: contracts/satellite/ai.yaml#publishForecastVersion
    outputs:
    - element: versions list
      rule: >-
        Immutable versions newest first: number, definition, status (Running, Draft, Awaiting approval, Published, Superseded,
        Rejected, Failed), producer and basis, stage badge, data cut-off, quality checks (completeness, blocking signals,
        accuracy regression) as pass/fail chips. The published one is pinned.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiForecastVersion | contracts/satellite/ai.yaml#listForecastVersions
    - element: accuracy
      rule: >-
        Per horizon (1, 7, 28 days): WAPE, bias and interval coverage, each labelled "measured over <dates>", with the baseline
        rule's figures beside the current producer's. Under 4 weeks of actuals the panel says "Measuring - accuracy appears
        once 4 weeks of actuals exist" rather than showing a figure.
      source: >-
        contracts/satellite/ai.yaml#getForecastAccuracy | ADR-0051 (AI functions review 30 Sep §4 Forecasting) | ADR-0051
    - element: forecast vs actual
      rule: >-
        A line of actuals over the published forecast's range band (P10-P90) and most-likely line, so misses are visible as
        points outside the band.
      source: contracts/satellite/ai.yaml#getForecast | designer default
    - element: Who may approve publication
      rule: Whoever holds that module's AI publish permission (the per-module "Publish AI model" check in the role builder;
        roles are preset permission configurations, never fixed default roles). TICVAI staff only through a grant.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-001)
    actions:
    - action: Publish
      result: >-
        Allowed only when the quality gates pass; the previous published version becomes Superseded and operational requirements
        are re-derived from the new one (a toast says so). 409 names the failing gate.
      source: contracts/satellite/ai.yaml#publishForecastVersion
    - action: Export
      result: >-
        CSV, Excel or JSON with a header naming definition, version, producer, basis and data cut-off; built asynchronously,
        the file arrives in downloads.
      source: contracts/satellite/ai.yaml#exportForecastVersion
    edgeCases:
    - case: Definition auto-publishes (L4)
      expected: >-
        Its versions show "Published automatically - gates passed" and no Publish button; a failed gate leaves it in Draft
        for a person with a forecastNotPublished alert.
      source: >-
        ADR-0050 | contracts/satellite/ai.yaml#runForecast | contracts/satellite/ai.yaml#/components/schemas/AiGovernanceAlert
        (forecastNotPublished)
    - case: Learned producer passes its gate in shadow
      expected: A link "Ready to promote - review on drift and releases" (ADM-554); this screen never promotes a model.
      source: ADR-0051 (AI-D16) | contracts/satellite/ai.yaml#promoteAiRelease
    consistency:
    - with: ADM-506
      note: Same accuracy figures and labels; ADM-506 explains drivers, ADM-508 measures and publishes.
    - with: ADM-554
      note: Promotion of a learned producer happens there, from the same accuracy figures (the gate reads them).
    sampleData:
      definition: Daily attendance - Coastal Aqua
      versions:
      - version: 42
        status: Awaiting approval
        producer: statistical v3 (blend k=4)
        stage: Learning
        basedOn: venue profile, UAE calendar, weather, 6 weeks of your sales
        cutoff: 30 Sep 2026 23:00
        gates: completeness ✓, signals ✓, regression ✓
      - version: 41
        status: Published
        stage: Learning
      accuracy:
        horizon: 7 days
        WAPE: 16.8% (baseline rule 21.5%)
        bias: +2.1%
        coverage: 81% of actuals inside the range
        measured: 18 Aug-27 Sep 2026
    corrections:
    - what: >-
        The table and detail columns are lifted from a board image ("Saturday Walk-In", "4%", "MODEL REVIEW RECOMMENDED"),
        bound to no operation.
      why: >-
        Bind the versions list to listForecastVersions and accuracy to getForecastAccuracy; the board's example values belong
        in sample data, not as columns.
      source: screens/P09-platform-admin-console.yaml#ADM-508
    - what: purpose ends mid-sentence ("Forecast vs Actual Example:").
      why: Truncated from the board.
      source: screens/P09-platform-admin-console.yaml#ADM-508
      status: fixed
      by: CHG-WIR-013
    - what: In Block A only runForecast and publishForecastVersion are in the slice.
      why: >-
        A version cannot be published from a screen that cannot list versions or show their gates; add listForecastVersions
        (and getForecastAccuracy when accuracy exists) to the slice.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-508)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)
    - what: module is Analytics and requiresModule analytics.
      why: >-
        Forecasting is an AI capability (requiresModule ai, family forecasting); a tenant with analytics but no AI would see
        a screen with nothing behind it.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (enabledCapabilities forecasting)
    decisions:
    - question: Who approves forecast publication at a tenant - the console operator or the venue's own analyst?
      decision: Forecast publication is approved by whoever holds that module's AI publish permission; no default role. Uses
        the per-module permission checklist with presets (see the ADM-554 decision).
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-003 | CHG-NOTE-001
      questionSource: contracts/satellite/ai.yaml#publishForecastVersion
  ADM-520:
    block: A
    summary: >-
      The AI capability registry: every AI capability operating in a tenant, with its accountable owner, risk class, the autonomy
      level in force against its first-release ceiling, the data it reads, its lifecycle per environment and what it does
      when it is unavailable. Nothing becomes an operational AI capability without an entry here. The one thing to get right:
      autonomy is chosen on the one L0-L4 scale and can never exceed the ceiling.
    inputs:
    - field: autonomyLevel
      rule: >-
        A five-step selector "L0 Disabled ... L4 Controlled auto" with the capability's ceiling marked; levels above the ceiling
        are drawn disabled with the reason (e.g. "Fraud restrictive actions: ceiling L1 Advisory in the first release"). 409
        autonomy-above-ceiling if the platform ceiling changed meanwhile.
      source: ADR-0050 | contracts/satellite/ai.yaml#configureAiCapability
    - field: ownerPrincipalId
      rule: Required in practice - an unowned capability shows as a warning in the list. Picker of tenant users.
      source: >-
        MoM 18 Sep 4.1 (capability registration and ownership) | contracts/satellite/ai.yaml#/components/schemas/AiCapabilityRegistration
    - field: riskClass
      rule: >-
        Low / Medium / High / Critical with the client's examples inline (explaining a sales report - low; suggesting a price
        change - high).
      source: MoM 18 Sep 4.1 | MoM 18 Sep §5
    - field: degradationMode
      rule: >-
        Explained choices: rules only, search only, hand over to a person, hidden, fail open, last published. Defaults per
        family (recommendations leave the slot empty, fraud falls back to owners' rules, concierge offers a person).
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiCapabilityRegistration | contracts/satellite/ai.yaml#pauseAiCapability
    outputs:
    - element: registry rows
      rule: >-
        Key (e.g. assistant.guest, forecast.attendance, risk.transaction, config.assistant, recommend.checkout), name, family,
        owner, risk class, "L2 Prepare - ceiling L3", status (Active / Paused with reason and time), lifecycle per environment
        (e.g. Production: live, Staging: live). The capability's maturity stage is shown beside it where it is data-driven.
      source: contracts/satellite/ai.yaml#listAiCapabilities | contracts/satellite/ai.yaml#listAiCapabilityMaturity
    actions:
    - action: Register / change capability
      result: >-
        Writes one entry; the list updates. A venue-scope change that would raise the tenant's level is refused on the field.
      source: contracts/satellite/ai.yaml#configureAiCapability
    edgeCases:
    - case: Capability paused
      expected: >-
        Row shows Paused, the reason, who and when, and what it does meanwhile (its degradation mode); Resume links to ADM-536.
      source: contracts/satellite/ai.yaml#/components/schemas/AiCapabilityRegistration (status, pausedReason)
    consistency:
    - with: ADM-522
      note: The autonomy screen edits the same field with the same selector.
    - with: ANL-060
      note: Reads this registry first; same labels.
    sampleData:
      rows:
      - key: assistant.guest
        name: Guest concierge (Sahli)
        family: assistants
        owner: Fatima Al Mansoori (Guest Experience)
        risk: Low
        autonomy: L1 Advisory - ceiling L2
        status: Active
      - key: config.assistant
        name: Configuration assistant
        family: configurationAssistant
        owner: Omar Haddad (Operations)
        risk: High
        autonomy: L3 Execute with approval - ceiling L3
        status: Active
      - key: risk.transaction
        name: Transaction risk scoring
        family: riskIntelligence
        owner: Priya Nair (Finance)
        risk: Critical
        autonomy: L1 Advisory - ceiling L1
        status: Active
      - key: forecast.attendance
        name: Attendance forecast
        family: forecasting
        owner: Omar Haddad
        risk: Medium
        autonomy: L4 Controlled auto (auto-publish) - ceiling L4
        status: Active
        stage: Learning
    corrections:
    - what: >-
        The layout is an unbound dataTable with unlabelled buttons; in Block A only configureAiCapability is in the slice.
      why: >-
        A registry that cannot be listed is not a registry; listAiCapabilities belongs in the Block A slice with the write.
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-520 | ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-520)) | ADR-0059
        (Block A slice: handoff/delivery-slice.json)
    - what: >-
        The P09 governance screens (ADM-519..558) act on one tenant's registry and policies but, unlike ADM-037, declare no
        tenant picker and no platform-staff grant.
      why: >-
        The console runs outside the cells; acting in a tenant needs a picked tenant and an open grant (R098). Either add
        the ADM-037 pattern (listTenants, openPlatformStaffGrant, listOwnPlatformStaffGrants) to every tenant-scoped governance
        screen, or these screens belong to the tenant's own administrators.
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-037 (notes, R098) | contracts/satellite/ai.yaml#listAiCapabilities (scopePath)
    decisions:
    - question: Who runs the governance boards day to day - TICVAI staff on the console, or the tenant's own AI governance
        lead?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): TICVAI staff through a grant for the first
        release; the open item on central versus per-module placement (MoM 18 Sep §6) stays with Chinmay''s team.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-004 | CHG-NOTE-001
      questionSource: MoM 18 Sep 4.4 and §6 | TRACKER Actions row 316
  ADM-523:
    block: A
    summary: >-
      The action and permission policy builder: rules that say which AI capabilities may read, analyse, recommend, generate,
      prepare, create, modify, publish, execute or delete - on which data, in which environment, for which roles and up to
      what amount - and with what outcome (allow, allow with conditions, prepare only, approval required, escalate, block).
      It works alongside RBAC, not instead of it: autonomy is separate from a person's permission. Rules are saved as a draft;
      testing and publication happen on ADM-527 and ADM-528. The one thing to get right: the verbs are a matrix in each rule,
      not buttons on the screen.
    inputs:
    - field: rule.actions
      rule: >-
        Multi-select chips read, analyse, recommend, generate, prepare, create, modify, publish, execute, delete; grouped
        visually as read-only (read, analyse), advisory (recommend, generate), and changing (prepare ... delete).
      source: contracts/satellite/ai.yaml#/components/schemas/AiGovernanceRule | MoM 18 Sep 4.1
    - field: rule.effect
      rule: >-
        One of allow, allow with conditions, prepare only, approval required, escalate, block, each with a one-line meaning.
        Block is an answer, logged as refused, not an error.
      source: contracts/satellite/ai.yaml#/components/schemas/AiGovernanceOutcome
    - field: rule.environments / dataCategories / roleIds / maxAmount / conditions
      rule: >-
        Environments as chips (development, sandbox, staging, production) - e.g. "price testing allowed in sandbox, not production";
        maxAmount in AED for money-moving actions; conditions as readable sentences, not JSON.
      source: contracts/satellite/ai.yaml#/components/schemas/AiGovernanceRule | MoM 18 Sep 4.1
    - field: kind / name / changeNote
      rule: >-
        Kind action for this screen (data, scope, autonomy, approval, environment have their own boards); a change note is
        required for a new version.
      source: contracts/satellite/ai.yaml#createAiGovernancePolicyDraft
    outputs:
    - element: tool registry (read-only)
      rule: >-
        What the executor may call - target operation, effect (read/write/destructive), risk, permission, reversible, compensation
        - as reference beside the rules; tenants do not edit it.
      source: contracts/satellite/ai.yaml#listAiTools | contracts/satellite/ai.yaml#setAiTool ("platform layer only")
    - element: draft state
      rule: After save the version shows Draft with "Test before publishing" linking to ADM-527; a draft decides nothing.
      source: contracts/satellite/ai.yaml#createAiGovernancePolicyDraft
    actions:
    - action: Save draft
      result: Writes a draft version (new policy at version 1, or the next version of an existing one).
      source: contracts/satellite/ai.yaml#createAiGovernancePolicyDraft
    edgeCases:
    - case: A rule would let AI do something its capability's autonomy ceiling forbids (e.g. execute a fraud restriction)
      expected: >-
        The rule saves (it is a draft) but carries a warning that the ceiling wins; simulation shows the effective, more restrictive
        result.
      source: ADR-0050 | contracts/satellite/ai.yaml#getEffectiveAiPolicy
    consistency:
    - with: ADM-527
      note: Simulation reads exactly these rules; labels must match.
    - with: ADM-530
      note: Approval-routing rules are drafted with the same component (kind approval).
    sampleData:
      policy: Pricing actions - Coastal Leisure Group
      rules:
      - capability: config.assistant
        actions:
        - prepare
        data:
        - catalogue
        - pricing
        environments:
        - production
        effect: approval required
        maxAmount: AED 50.00 per ticket change
      - capability: config.assistant
        actions:
        - create
        - modify
        - publish
        environments:
        - sandbox
        - staging
        effect: allow
      - capability: assistant.staff
        actions:
        - read
        data:
        - purchase history
        effect: allow
      - capability: assistant.staff
        actions:
        - read
        data:
        - card details
        effect: block
    corrections:
    - what: The actionBar has buttons Analyze, Recommend, Generate, Prepare, Create, Modify, Delete, Publish, all unbound.
      why: >-
        These are the rule's action verbs (AiGovernanceRule.actions), not screen actions; draw them as a multi-select inside
        each rule.
      source: contracts/satellite/ai.yaml#/components/schemas/AiGovernanceRule
    - what: setAiTool (PLATFORM_AI_MANAGE) is declared on a tenant policy screen.
      why: >-
        Tools are platform facts replicated read-only into tenants; the tenant board should only read them (listAiTools).
      source: contracts/satellite/ai.yaml#setAiTool
      status: fixed
      by: CHG-WIR-012
    - what: In Block A only createAiGovernancePolicyDraft is in the slice.
      why: A saved draft cannot be found again without listAiGovernancePolicyVersions; add it to the slice.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-523)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)
    decisions:
    - question: Are the action verbs the client's ten, or the five the minutes name (read, recommend, prepare, modify, execute)?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): The contract''s ten, grouped into the minutes''
        five headings.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-005 | CHG-NOTE-001
      questionSource: MoM 18 Sep 4.1 | contracts/satellite/ai.yaml#/components/schemas/AiGovernanceRule
  ADM-526:
    block: A
    summary: >-
      Policy conflicts and exceptions: where governance rules contradict each other (shown with the more restrictive result
      they resolved to), and the legitimate, time-boxed exceptions that let a capability do something a policy otherwise forbids
      - recorded with a reason, compensating controls, an expiry and the approver, never a silent bypass. The one thing to
      get right: every exception ends - an expiry is required - and revoking one makes the stricter policy apply at once.
    inputs:
    - field: exception (createAiPolicyException)
      rule: >-
        Policy and capability, reason (required), compensating controls (list of short sentences), starts at (default now),
        expires at (required; no open-ended option). The approver is the person granting it (AI_APPROVE), shown, not chosen.
      source: contracts/satellite/ai.yaml#createAiPolicyException | MoM 18 Sep 4.1
    - field: revoke reason
      rule: Required; the confirmation names the exception and what the capability falls back to.
      source: >-
        contracts/satellite/ai.yaml#revokeAiPolicyException | screens/P09-platform-admin-console.yaml#ADM-526 (overlays.confirmRevokeAiPolicyException)
    outputs:
    - element: conflicts
      rule: >-
        Each conflict as "Rule A says X; Rule B says Y; in force: Y (more restrictive)", with the capability and scope, e.g.
        an AI price increase above the configured maximum shown as blocked, never applied. A plan step failing a module limit
        is shown as governance-blocked.
      source: DI-955 | DI-935 | contracts/satellite/ai.yaml#getEffectiveAiPolicy
    - element: exceptions
      rule: >-
        Active first with time left ("expires in 3 days"), then expired and revoked; each with approver, reason and controls.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicyException
    actions:
    - action: Grant exception
      result: Active immediately (or at startsAt); the effective policy shows it while active.
      source: contracts/satellite/ai.yaml#createAiPolicyException
    - action: Revoke
      result: Status revoked; the stricter policy applies at once to every scope the exception covered.
      source: contracts/satellite/ai.yaml#revokeAiPolicyException
    edgeCases:
    - case: Exception reaches its expiry
      expected: Moves to Expired by itself; the list and the effective map update; the owner is notified (designer default).
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicyException (status expired)
    consistency:
    - with: ADM-528
      note: The effective policy map shows the same exceptions and conflicts.
    sampleData:
      conflict:
        capability: config.assistant
        ruleA: 'Pricing v3: prepare price changes up to +15%'
        ruleB: 'Venue Coastal Aqua: max price change +10%'
        inForce: +10% (more restrictive)
      exception:
        policy: Pricing v3
        capability: config.assistant
        reason: Eid Al Adha bulk price load for 46 products
        controls:
        - Second approver on every change
        - Changes limited to Eid dates
        expires: Sun 18 Oct 2026 23:59
        approver: Priya Nair
    corrections:
    - what: >-
        In Block A only createAiPolicyException is in the slice; getEffectiveAiPolicy, listAiGovernancePolicyVersions and
        revokeAiPolicyException are not.
      why: >-
        An exception that can be granted but not seen or revoked is the silent bypass this board exists to prevent. Add revokeAiPolicyException
        and getEffectiveAiPolicy to Block A.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-526)) | ADR-0059 (Block A slice: handoff/delivery-slice.json) |
        MoM 18 Sep 4.1
    - what: >-
        Two dataTables, one unlabelled, both bound to getEffectiveAiPolicy with no columns; no exceptions list operation.
      why: >-
        Exceptions are only reachable inside the effective policy; either add a listAiPolicyExceptions read or draw the exceptions
        from getEffectiveAiPolicy.exceptions per capability.
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-526 | contracts/satellite/ai.yaml#/components/schemas/AiEffectivePolicy
    decisions:
    - question: Maximum length of an exception?
      decision: 'Drawn default stands (answer: "Default / recommended accepted"): No cap in the contract; the form suggests
        30 days and warns beyond 90.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-006 | CHG-NOTE-001
      questionSource: designer default
  ADM-527:
    block: A
    summary: >-
      Test a draft governance policy before publishing it: replay it over recorded decisions in a time window and over the
      capability's test cases, and see what would be allowed, prepared, routed for approval or blocked - and what would change
      against today. A policy mistake either gives AI too much authority or stops legitimate work, so a version cannot be
      published until it has been simulated. Nothing runs. The one thing to get right: show the step-by-step evaluation for
      an example, the way the client's board does.
    inputs:
    - field: version / window / capabilities
      rule: >-
        A draft version (from the list), a from-to window (default last 30 days), and optionally a subset of capabilities.
      source: contracts/satellite/ai.yaml#simulateAiGovernancePolicy
    outputs:
    - element: summary
      rule: >-
        Decisions evaluated, how many would change, counts by outcome (allow, allow with conditions, prepare only, approval
        required, escalate, block) today vs with the draft.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicySimulation (evaluated, wouldChange, byOutcome)
    - element: example trace
      rule: >-
        For each example: user permission, AI capability permission, autonomy level, environment policy, risk policy, final
        decision and execution - as a vertical step list with ticks and a final verdict, e.g. "ALLOW PREPARATION - execution
        blocked until approval".
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-527 (purpose, board example) | contracts/satellite/ai.yaml#/components/schemas/AiPolicySimulation
        (examples)
    actions:
    - action: Run simulation
      result: >-
        Version moves to Simulated (required for publication); results shown; "Publish" links to ADM-528. 409 if the version
        is not a draft.
      source: contracts/satellite/ai.yaml#simulateAiGovernancePolicy
    edgeCases:
    - case: No recorded decisions in the window (new tenant)
      expected: Runs on the capability's test cases only and says so.
      source: contracts/satellite/ai.yaml#simulateAiGovernancePolicy
    - case: The draft would block something that is allowed today
      expected: Listed first, in red, as "Would now be blocked".
      source: MoM 18 Sep 4.1 (block legitimate operations) | designer default
    consistency:
    - with: ADM-538
      note: The oversight workflow simulator uses the same step-list component.
    sampleData:
      example:
        user: Venue Administrator, Coastal Aqua
        capability: AI Configuration Assistant
        request: Increase Adult Ticket Price
        module: Pricing
        environment: Production
        risk: High
        steps:
        - User permission ✓ can modify pricing
        - AI capability ✓ can prepare pricing change
        - Autonomy L2 Prepare
        - 'Production policy: approval required'
        - 'Risk policy: commercial owner approval'
        decision: ALLOW PREPARATION
        execution: BLOCKED UNTIL APPROVAL
      summary:
        evaluated: 1284
        wouldChange: 37
        nowBlocked: 4
    corrections:
    - what: >-
        The board's example (user, capability, request, steps, final decision) is pasted into purpose; layout is an unbound
        table and buttons.
      why: >-
        Move the example to sample data; bind the results to the simulation response and the version picker to listAiGovernancePolicyVersions.
      source: screens/P09-platform-admin-console.yaml#ADM-527
      status: fixed
      by: CHG-WIR-013
    - what: In Block A only simulateAiGovernancePolicy is in the slice.
      why: A draft has to be chosen from a list; add listAiGovernancePolicyVersions to the Block A slice.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-527)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)
  ADM-528:
    block: A
    summary: >-
      Publication and the effective policy map: the final review where a simulated policy version is published by someone
      other than its author, and a map of what is actually in force for each capability at each scope - autonomy against ceiling,
      rules, active exceptions and resolved conflicts. The one thing to get right: the map answers "what would the decision
      point do here, and why", with the more restrictive rule winning visibly.
    inputs:
    - field: version to publish
      rule: >-
        Only simulated versions are publishable; the publisher must not be the drafter (the button is disabled for the author,
        with the reason).
      source: contracts/satellite/ai.yaml#publishAiGovernancePolicy
    - field: map filters
      rule: Capability, scope (tenant, venue), environment.
      source: contracts/satellite/ai.yaml#getEffectiveAiPolicy
    outputs:
    - element: diff before publishing
      rule: >-
        Rules added, removed and changed against the published version, plus the simulation summary (would change N decisions).
      source: contracts/satellite/ai.yaml#/components/schemas/AiGovernancePolicyVersion (simulationSummary)
    - element: effective policy map
      rule: >-
        Per capability and scope - autonomy "L2 Prepare (ceiling L3)", the rules in force with their source policy and version,
        active exceptions with expiry, conflicts with the result.
      source: contracts/satellite/ai.yaml#/components/schemas/AiEffectivePolicy
    - element: history
      rule: Every version newest first with drafted by, published by, published at, superseded at.
      source: contracts/satellite/ai.yaml#listAiGovernancePolicyVersions
    actions:
    - action: Publish AI governance policy
      result: >-
        The version becomes Published and the previous one Superseded in the same step; cached decisions are invalidated.
        409 policy-not-simulated or approver-is-requester shown as a sentence.
      source: contracts/satellite/ai.yaml#publishAiGovernancePolicy
    edgeCases:
    - case: Two people edit and simulate the same policy
      expected: Only the newest simulated version is publishable; older drafts show "Superseded by draft v5".
      source: designer default
    consistency:
    - with: ADM-526
      note: Same conflict and exception rendering.
    - with: ADM-525
      note: Environment and scope governance feeds the same map.
    sampleData:
      publish:
        policy: Pricing actions
        version: 4
        draftedBy: Omar Haddad
        publisher: Priya Nair
        simulation: 1,284 evaluated, 37 would change
      map:
      - capability: config.assistant
        scope: Coastal Aqua
        autonomy: L3 Execute with approval (ceiling L3)
        rules: Pricing actions v4; Venue max price change +10%
        exceptions: Eid bulk load until 18 Oct
    corrections:
    - what: In Block A only publishAiGovernancePolicy is in the slice.
      why: >-
        Publishing needs the version list and the effective map (listAiGovernancePolicyVersions, getEffectiveAiPolicy) to
        review what is being published.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-528)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)
    - what: >-
        The "Publish AI governance policy" button is bound to no operation (op None) though publishAiGovernancePolicy is declared.
      why: Bind it.
      source: screens/P09-platform-admin-console.yaml#ADM-528
  ADM-536:
    block: A
    summary: >-
      Human override and manual control: the kill switch for an AI capability, the pause on an executing plan, and the override
      of a single AI decision - always possible where governance requires it. Stopping is always safe and needs less authority
      than starting again. The one thing to get right: before pausing, the person sees exactly what the capability will do
      instead (its degradation mode); after an override, the original and the human decision stay side by side.
    inputs:
    - field: pause reason / incident
      rule: Reason required; optionally link an open AI incident.
      source: contracts/satellite/ai.yaml#pauseAiCapability
    - field: override (humanDecision, reason)
      rule: >-
        The human decision is the replacement answer (e.g. "keep price at AED 199"), reason required; it changes what AI does
        next and does not reach into the owning module.
      source: contracts/satellite/ai.yaml#overrideAiDecision
    outputs:
    - element: capability status
      rule: >-
        Active or Paused (by whom, when, why), with the degradation mode in words, e.g. "Recommendations paused - checkout
        shows no offers", "Fraud scoring paused - owners' rules still apply", "Concierge paused - guests are offered a person".
      source: contracts/satellite/ai.yaml#pauseAiCapability
    - element: decision side by side
      rule: >-
        Original AI decision and human decision as two columns with the reason and the person; marked as an intervention on
        the decision record.
      source: contracts/satellite/ai.yaml#overrideAiDecision
    actions:
    - action: Pause capability (kill switch)
      result: >-
        Immediate; in-flight plans pause at their next checkpoint; confirmation states the degradation mode. AI_CONFIGURE.
      source: contracts/satellite/ai.yaml#pauseAiCapability
    - action: Resume capability
      result: >-
        Needs AI_APPROVE (more than pausing). Plans paused by the pause stay paused and are resumed one by one after revalidation
        - say so in the confirmation.
      source: contracts/satellite/ai.yaml#resumeAiCapability
    - action: Pause plan
      result: The executor stops at the next step boundary; nothing half-applies; recorded as an intervention.
      source: contracts/satellite/ai.yaml#pauseActionPlan
    - action: Override decision
      result: Recorded side by side; a link to the owning module where the person must make the actual correction.
      source: contracts/satellite/ai.yaml#overrideAiDecision
    edgeCases:
    - case: Person with AI_CONFIGURE but not AI_APPROVE after pausing
      expected: Resume is visible but disabled with "Resuming needs AI approval rights".
      source: contracts/satellite/ai.yaml#resumeAiCapability
    consistency:
    - with: ADM-535
      note: Live execution oversight shows the same plan states and the same pause.
    - with: ADM-556
      note: Containment of an incident pauses capabilities through the same operation.
    sampleData:
      capability:
        key: recommend.checkout
        status: Paused
        by: Priya Nair
        at: Thu 1 Oct 14:22
        reason: Offers showing sold-out cabanas
        degradation: Checkout shows no offers
      override:
        decision: Suggested Adult Day Pass +12% for Sat 3 Oct
        human: Keep AED 199.00
        reason: Price ceiling agreed with the group commercial director
    corrections:
    - what: In Block A only resumeAiCapability is in the slice; pauseAiCapability is not.
      why: >-
        A resume without a kill switch is backwards; the kill switch is the operation that must exist first. Put pauseAiCapability
        (and overrideAiDecision) in Block A.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-536)) | ADR-0059 (Block A slice: handoff/delivery-slice.json) |
        MoM 18 Sep 4.2
    - what: The layout has only an unlabelled primary button and Cancel.
      why: Needs the capability list with status, the plan list and the decision lookup the operations act on.
      source: screens/P09-platform-admin-console.yaml#ADM-536
  ADM-554:
    block: A
    summary: >-
      Behaviour drift, training runs and model promotion: where a governance lead sees whether AI behaviour has shifted in
      a way that matters, how each per-tenant training and backtest run did, and where a model that has passed its gate in
      the background is promoted - by a person, one stage at a time - or rolled back. The one thing to get right: "Ready to
      promote" is a recommendation with its evidence (the gate figures against the baseline); nothing switches by itself,
      and the empty state is normal for months.
    inputs:
    - field: promote (toStage, canaryScope, note)
      rule: >-
        Next stage only (shadow → canary → production); canary scope e.g. one venue or a share of traffic; note optional.
      source: contracts/satellite/ai.yaml#promoteAiRelease
    - field: rollback reason
      rule: Required; the confirmation says what production returns to (the previous artefact or the rule).
      source: contracts/satellite/ai.yaml#rollbackAiRelease
    - field: run evaluation
      rule: Suite, candidate, baseline, kind (offline golden set, backtest, shadow comparison).
      source: contracts/satellite/ai.yaml#runAiEvaluation
    outputs:
    - element: release pipeline per capability
      rule: >-
        Stage track draft → offline eval → background (shadow) → canary → production → monitored, with the current stage highlighted
        and the live producer named (rule or model version).
      source: contracts/satellite/ai.yaml#/components/schemas/AiRelease (stage)
    - element: gate evidence
      rule: >-
        Against the baseline: forecasts - WAPE at 7 days (needs 10% better), bias (within ±3%), range coverage (70-90%); fraud
        - recall (at least equal) and precision (20% better at the same review rate); recommendations - the controlled experiment
        result. Each figure with its pass/fail and the shadow period (at least 6 weeks).
      source: ADR-0051 Promotion | ADR-0051 (AI functions review 30 Sep §2)
    - element: drift alerts
      rule: >-
        Behaviour drift, input drift, bias, override-rate shift and evaluation regression alerts with severity; isolation
        and permission cases must pass 100% - one failure fails the run.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiGovernanceAlert | contracts/satellite/ai.yaml#runAiEvaluation
    - element: training runs
      rule: Capability, window, whether imported history was included, status, metrics, release.
      source: contracts/satellite/ai.yaml#listAiTrainingRuns
    actions:
    - action: Promote
      result: Moves one stage and resolves the promotionReady alert; the holder of that module's "Publish AI model" permission
        for a tenant release (chosen on the per-module checklist; roles are preset, editable permission configurations) or
        PLATFORM_AI_MANAGE for a platform release; refused to service callers.
      source: contracts/satellite/ai.yaml#promoteAiRelease | ADR-0051 (AI-D16) | decided 2 October 2026 by Chinmay (CHG-NOTE-001)
    - action: Roll back
      result: Pointer switch back; immediate; recorded.
      source: contracts/satellite/ai.yaml#rollbackAiRelease
    edgeCases:
    - case: No model ready (the normal case before a season of data)
      expected: >-
        "No model is ready to promote. Your AI answers from <stage> and is learning your venue." with each capability's stage
        and what the next stage needs; not an empty table.
      source: ADR-0051 Consequences | ADR-0051 (AI functions review 30 Sep §7)
    - case: Promotion attempted out of order
      expected: 409 stage-out-of-order shown as "Promote to canary first".
      source: contracts/satellite/ai.yaml#promoteAiRelease
    consistency:
    - with: ANL-071
      note: >-
        The venue-facing maturity page shows the same stage and the same "Ready to promote" state, without the controls.
    - with: ADM-508
      note: Forecast accuracy figures are the same numbers the gate reads.
    sampleData:
      release:
        capability: forecast.attendance
        candidate: gbm-attendance v1.3 (trained on 14 months incl. imported history)
        stage: shadow
        shadowFor: 7 weeks
      gate:
        WAPE7d: 12.4% vs rule 15.9% (22% better ✓)
        bias: -1.2% ✓
        coverage: 84% ✓
      alert: Ready to promote - Attendance forecast (Coastal Aqua)
    corrections:
    - what: >-
        In Block A only promoteAiRelease, rollbackAiRelease and runAiEvaluation are in the slice; listAiGovernanceAlerts,
        listAiEvaluations and listAiTrainingRuns are not.
      why: >-
        A promotion button with no promotionReady alert and no evaluation evidence invites promoting blind. Add the three
        reads, or hide Promote until Block B.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-554)) | ADR-0059 (Block A slice: handoff/delivery-slice.json) |
        ADR-0051 (AI-D16)
    - what: Layout has an unbound table, an unlabelled primary button and a publishGate with no operation.
      why: Bind the table to releases/evaluations and the buttons to promote and roll back.
      source: screens/P09-platform-admin-console.yaml#ADM-554
    decisions:
    - question: Is promotion a tenant decision (tenant admin with AI_APPROVE) or TICVAI's?
      decision: 'Role builder: roles are preset permission configurations (All, Viewer, Mid-level and the like), not fixed
        default roles. Picking a preset fills the per-module permission checklist, which stays editable, and the role can
        be renamed. Each module carries its own "Publish AI model" permission; AI release promotion goes to whoever holds
        it (Pre-apply round, 2 October).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-007 | CHG-NOTE-001
      questionSource: contracts/satellite/ai.yaml#promoteAiRelease | ADR-0051 (AI-D16)
  ADM-556:
    block: A
    summary: >-
      AI incidents from detection to closure: open an incident from governance alerts or by hand, contain it (pause a capability,
      roll back a release, revoke an exception, disable a tool), investigate, remediate and close with a root cause. The one
      thing to get right: containment actions are the real operations, recorded on the incident - the screen must show what
      was done, by whom, and what the AI is doing meanwhile.
    inputs:
    - field: open (title, kind, severity, capabilities, alerts, owner)
      rule: >-
        From selected alerts the fields pre-fill; kind governance, operational or both (with the operational incident reference).
      source: contracts/satellite/ai.yaml#openAiIncident
    - field: containment actions
      rule: >-
        Checklist of pause capability / roll back release / revoke exception / disable tool, each naming its target; a note.
      source: contracts/satellite/ai.yaml#containAiIncident
    - field: close (rootCause, remediation)
      rule: Both required.
      source: contracts/satellite/ai.yaml#closeAiIncident
    - field: >-
        post-incident review (impact, customers/transactions affected, control failure, corrective and preventive actions,
        lessons)
      rule: Free text and lists on the incident; corrective actions as rows with owner team, due date and status.
      source: screens/P09-platform-admin-console.yaml#ADM-556 (board fields)
    outputs:
    - element: incident timeline
      rule: >-
        Opened → contained → investigating → remediating → closed, each step with person and time; containment actions listed
        with their effect.
      source: contracts/satellite/ai.yaml#/components/schemas/AiIncident (status, containment)
    actions:
    - action: Contain
      result: Performs each action (same as its own operation) and records it; AI_APPROVE.
      source: contracts/satellite/ai.yaml#containAiIncident
    - action: Close
      result: Needs root cause and remediation; 409 if containment is still open.
      source: contracts/satellite/ai.yaml#closeAiIncident
    edgeCases:
    - case: The incident touches guests (e.g. wrong prices offered at checkout)
      expected: >-
        Kind both, linked to the operational incident; the guest-facing capability's degradation mode is stated after containment.
      source: contracts/satellite/ai.yaml#openAiIncident
    consistency:
    - with: ADM-536
      note: Pausing from here and from the override centre is the same action with the same confirmation.
    - with: ADM-555
      note: Alerts selected there open an incident here.
    sampleData:
      incident:
        ref: AI-INC-0007
        title: Fraud holds on 112 legitimate wallet top-ups
        kind: both
        severity: high
        capability: risk.transaction
        status: contained
      containment:
      - Rolled back risk rule set v8 → v7 (Priya Nair, 1 Oct 15:10)
      correctiveActions:
      - action: Revalidate thresholds
        owner: Fraud team
        due: 15 Oct
        status: Pending
      - action: Run control test
        owner: Governance
        due: 15 Oct
        status: Pending
    corrections:
    - what: >-
        Buttons labelled "Revalidate thresholds Fraud Team 15 Sep Pending" and "Run control test Governance 15 Sep Pending".
      why: These are corrective-action rows (action, owner, due, status) read off the board, not buttons.
      source: screens/P09-platform-admin-console.yaml#ADM-556
    - what: >-
        In Block A only containAiIncident is in the slice; openAiIncident, listAiIncidents and closeAiIncident are not.
      why: >-
        An incident must be opened and found before it can be contained; add openAiIncident and listAiIncidents to Block A.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ADM-556)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)
    - what: >-
        The post-incident fields (impact, control failure, lessons learned) are selectFields bound to nothing, and closeAiIncident
        takes only rootCause and remediation.
      why: Either extend closeAiIncident/AiIncident with these fields or drop them from the form.
      source: contracts/satellite/ai.yaml#closeAiIncident | screens/P09-platform-admin-console.yaml#ADM-556
      status: logged
      by: CHG-WIR-014
  ANL-019:
    block: A
    summary: >-
      AI management insights: proactive findings for managers - a drop, a spike, a forecast miss, an opportunity - each with
      why it happened, broken down by channel, product and time, and what to do about it. Every number comes from a query
      the platform ran, never from the model; the model only words the result. The one thing to get right: an insight is a
      reviewable item with a lifecycle (new, reviewed, accepted or rejected, actioned, measured), and rejecting one with a
      reason is how the detector learns what is a false alarm.
    inputs:
    - field: decision (review / accept / reject / actioned)
      rule: >-
        Reject asks a reason (the false-alarm signal); Actioned asks what was done (link to the action, e.g. a promotion or
        a rota change).
      source: contracts/satellite/ai.yaml#decideAiInsight
    - field: explain a metric (metric, period, comparison)
      rule: >-
        Comparison previous period (default), same period last year, or forecast; year-on-year is offered only when history
        (own or imported) covers it.
      source: contracts/satellite/ai.yaml#explainMetricChange | ADR-0051 (AI functions review 30 Sep §4 Analytics assistant)
    - field: Ask (askReportingQuestion)
      rule: >-
        The free-text question box is behind a flag until Sprint 7 (8-26 February 2027); in Block A the screen shows saved
        insights and KPI explanations only.
      source: ADR-0054 | ADR-0059
    outputs:
    - element: insight card
      rule: >-
        Title, kind (anomaly, forecast deviation, trend, opportunity, executive summary), priority, expected impact as a range
        on a named metric (never a single number), status, detected at. Evidence items labelled "From your data", "Calculated"
        or "AI inferred".
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiInsight | contracts/satellite/ai.yaml#/components/schemas/AiEvidenceItem
    - element: why it changed
      rule: >-
        The change and % for the period, drivers as a ranked contribution bar (e.g. Online -AED 18,400, POS +AED 2,100), the
        narrative, a reliability label (grounded, partial, conflicting sources, insufficient evidence) and "Data as of". No
        confidence percentage.
      source: contracts/satellite/ai.yaml#explainMetricChange | ADR-0054 | DI-719
    - element: basis
      rule: >-
        For anomalies, the baseline's stage, e.g. "Learning - compared with the same weekday over 5 weeks"; in the first weeks
        against default thresholds and the forecast's low end.
      source: ADR-0051 (AI functions review 30 Sep §4 Anomaly detection) | ADR-0051
    actions:
    - action: Explain
      result: Runs the decomposition and shows drivers; "Keep" saves it as an insight.
      source: contracts/satellite/ai.yaml#explainMetricChange
    - action: Accept / Reject / Mark actioned
      result: Moves the insight along its lifecycle; measured is set later by the job that measures the effect.
      source: contracts/satellite/ai.yaml#decideAiInsight
    edgeCases:
    - case: Question or metric outside the semantic model
      expected: '"Not available yet" naming what is not modelled; a knowledge gap is recorded; no improvised number.'
      source: ADR-0054
    - case: Only a few weeks of data
      expected: >-
        Comparison against the last 7 days, said explicitly; year-on-year appears once imported or own history covers it.
      source: ADR-0051 (AI functions review 30 Sep §4 Analytics assistant)
    - case: The same situation detected by two detectors
      expected: One insight (one correlation key), not two cards.
      source: contracts/satellite/ai.yaml#listAiInsights
    consistency:
    - with: ANL-059
      note: History, evidence and explainability of the same insights.
    - with: ANL-055
      note: Anomalies appear here as insights of kind anomaly; same card.
    - with: ADM-506
      note: Same driver decomposition component.
    sampleData:
      insight:
        title: Online revenue down 14% last weekend at Coastal Aqua
        kind: anomaly
        priority: high
        expectedImpact: AED 15,000-22,000 below forecast for the next weekend
        drivers:
        - Online -AED 18,400 (Family Day Pass)
        - POS +AED 2,100
        - 'Weather: 41°C Saturday (outdoor venue)'
        reliability: grounded
        dataAsOf: Mon 28 Sep 06:00
        basis: Learning - compared with the same weekday over 6 weeks
    corrections:
    - what: In Block A only decideAiInsight and explainMetricChange are in the slice; listAiInsights is not.
      why: An insight cannot be reviewed if the list of insights is not built; add listAiInsights to the Block A slice.
      source: >-
        ADR-0059 (Block A slice: tasks.csv (APP-SETUP-ANL-019)) | ADR-0059 (Block A slice: handoff/delivery-slice.json)
      status: logged
      by: CHG-SOT-016
    - what: The screen declares both reporting.listAnalyticsAnomalies and ai.listAiInsights.
      why: >-
        Two sources of anomalies on one card list will show the same situation twice; ADR-0053 and the insight layer make
        ai.listAiInsights (kind anomaly) the one list. Drop listAnalyticsAnomalies here or define which wins.
      source: >-
        contracts/satellite/ai.yaml#listAiInsights | contracts/satellite/reporting.yaml#listAnalyticsAnomalies | ADR-0053
      status: fixed
      by: CHG-WIR-012
    - what: AiMetricChangeExplanation carries no query or semantic spec.
      why: >-
        ADR-0054 says the answer shows the query it ran; NaturalLanguageAnswer has semanticSpec and generatedQuery, explainMetricChange
        has only evidence. Add the spec so the "Show query" link works.
      source: >-
        ADR-0054 | contracts/satellite/ai.yaml#explainMetricChange | contracts/satellite/reporting.yaml#askReportingQuestion
      status: logged
      by: CHG-SOT-016
    - what: Layout is an unbound primary button, table and Cancel.
      why: Bind the list to listAiInsights and the card actions to decideAiInsight / explainMetricChange.
      source: screens/P16-venue-analytics.yaml#ANL-019
      status: fixed
      by: CHG-SOT-011
  KSK-015:
    block: later
    summary: >-
      Sahli at the kiosk: helps a guest choose tickets and pay, and nothing else. There is no keyboard, so it is a constrained
      touch conversation - tap-to-answer chips ("How many adults?", "Today or another day?") leading to product cards and
      checkout - not a chat box. The one thing to get right: every path ends in a product the guest can add, or in calling
      a member of staff; the guest is never stuck in a conversation at a kiosk.
    inputs:
    - field: guest choices
      rule: >-
        Large tap targets only (party size steppers, date chips, interest chips); free text only through an on-screen keyboard
        behind "Type a question", never first. Arabic and English toggle stays visible.
      source: >-
        screens/P05-guest-kiosk.yaml#KSK-015 (notes - no keyboard) | contracts/satellite/ai.yaml#/components/schemas/AiPolicy
        (guestCapabilityScope)
    outputs:
    - element: answer
      rule: >-
        Short answers with product cards (name, price, availability for the chosen time) the guest adds with one tap; no citation
        row on a kiosk, but a policy answer names its policy ("Refund policy").
      source: contracts/satellite/ai.yaml#sendAiMessage | contracts/spine/catalogue.yaml#getAvailability
    - element: availability
      rule: Remaining capacity is display only and may be stale; the sale is decided at checkout.
      source: contracts/spine/catalogue.yaml#getAvailability
    actions:
    - action: Call staff (hand over)
      result: >-
        One big button always visible; hands over with reason guestRequested and Sahli's summary, and shows "A team member
        is on the way" or, with 409, "Please visit the ticket desk".
      source: contracts/satellite/marketing-crm.yaml#handoverToAgent | F24 step 2
    edgeCases:
    - case: Question outside ticket selection, promotions, FAQs, recommendations and checkout
      expected: Polite refusal and Call staff (reason outOfScope).
      source: F24 step 2 | screens/P05-guest-kiosk.yaml#KSK-015 (notes)
    - case: Guest walks away mid-conversation
      expected: The kiosk's idle timeout clears the conversation and the cart; nothing of the previous guest stays on screen.
      source: designer default
    consistency:
    - with: GST-031
      note: Same Sahli identity and wording; different input model (touch chips).
    sampleData:
      flow:
      - Who is visiting? 2 adults, 1 child
      - When? Today
      - >-
        Sahli: The Family Day Pass is AED 540.00 for 2 adults and 2 children - for 2 adults and 1 child the Day Pass totals
        AED 450.00
      - Add to basket
    corrections:
    - what: >-
        The layout is a staff product table (listProducts with id, scopePath, createdByPrincipalId, approvedByPrincipalId
        columns) and filter fields Venue id / Kind / Is sellable.
      why: >-
        A guest at a kiosk never sees a product table or filters by venue id; products appear as cards inside the conversation.
      source: screens/P05-guest-kiosk.yaml#KSK-015
    - what: emptyNoAccess names PRODUCT_VIEW; emptyFirstRun says "Offers no create action".
      why: A guest holds no permission; the first-run state of a kiosk assistant is its greeting with starter chips.
      source: ADR-0025
      status: fixed
      by: CHG-GST-004
    - what: createAiConversation is not declared though sendAiMessage needs a conversation.
      why: Declare it (opened silently on the first tap).
      source: contracts/satellite/ai.yaml#createAiConversation
    - what: requiresModule is ticketing and the coldEntry speaks of "an agent opening a link from a notification".
      why: The assistant needs the AI module; a kiosk has no notification cold entry.
      source: screens/P05-guest-kiosk.yaml#KSK-015
  EMP-019:
    block: later
    summary: >-
      The AI tab of the Staff App (a primary tab, CF-41): a staff member asks in their own words - "what was yesterday's ticketing
      revenue?", "what is today's promo code?", "how do I process a refund?" - and gets an answer within their role, with
      its source. The home lists their recent conversations and suggested questions for their role. The one thing to get right:
      the assistant answers as that person - a cashier cannot get the CEO's revenue by asking nicely - and says so plainly
      when something is outside their access.
    inputs:
    - field: question
      rule: >-
        Text and starter chips per role (cashier, supervisor, manager). module and locale are not asked; they come from the
        session and app.
      source: contracts/satellite/ai.yaml#createAiConversation | DI-964
    outputs:
    - element: recent conversations
      rule: The person's own, newest first, first question as title; not a table with principal and scope columns.
      source: contracts/satellite/ai.yaml#listAiConversations
    actions:
    - action: Ask
      result: Opens EMP-020 with the answer streaming.
      source: F101 step 1
    edgeCases:
    - case: Offline
      expected: The tab says the assistant needs the connection; recent conversations stay readable.
      source: screens/P06-staff-app.yaml#EMP-019 (states.offline)
    - case: Assistant paused or the staff profile inactive
      expected: The tab shows the knowledge base search (EMP-040) instead, with a note.
      source: contracts/satellite/ai.yaml#pauseAiCapability (degradationMode searchOnly)
    consistency:
    - with: EMP-020
      note: Question and answer are one screen pair.
    - with: POS-008
      note: The till's embedded assistant uses the same staff assistant and answer component.
    sampleData:
      role: Supervisor, Coastal Aqua
      chips:
      - What was yesterday's ticketing revenue?
      - Today's promo codes
      - How do I refund a cabana?
      - Who is on shift at Gate 2?
    corrections:
    - what: >-
        Layout is a dataTable "Every AI conversation" with id, principalId, scopePath, module columns and a Create AI conversation
        modal asking for module.
      why: A staff phone tab needs an ask box and the person's recent conversations; module comes from the session.
      source: screens/P06-staff-app.yaml#EMP-019 | contracts/satellite/ai.yaml#createAiConversation
    - what: purpose "The tab that is already in the shell."
      why: Not a purpose; it is "Ask and be answered within your role, with the source".
      source: DI-964
      status: fixed
      by: CHG-WIR-013
  EMP-020:
    block: later
    summary: >-
      The answer: what the assistant said, what it is based on (the policy, document or report it came from) and, for numbers,
      the query that produced them. Follow-ups keep context ("compare that to this week"). The one thing to get right: a figure
      is only ever shown from a query result with its "Data as of" time; a policy answer cites the policy; nothing is invented.
    outputs:
    - element: answer and sources
      rule: >-
        Answer text, then citations (document title and section); confidence shown only when the provider reports one, as
        a band, never a number with decimals.
      source: contracts/satellite/ai.yaml#/components/schemas/AiMessage | DI-964
    - element: numbers
      rule: >-
        A numeric answer shows "Data as of <time>" and a "Show query" link (metric, filters, period). Outside the semantic
        model the answer is "Not available yet" and the gap is recorded.
      source: ADR-0054 | contracts/satellite/reporting.yaml#askReportingQuestion
    - element: proposed action
      rule: >-
        When the answer suggests a change (e.g. a refund), it shows as a draft card with "Open in <screen>"; it is never applied
        from here.
      source: contracts/satellite/ai.yaml#/components/schemas/AiMessage (proposedAction)
    actions:
    - action: Helpful / Not helpful
      result: Once per answer, optional reason; feeds the golden set and knowledge gaps.
      source: contracts/satellite/ai.yaml#recordAnswerFeedback
    - action: Follow-up
      result: Same conversation; the answer uses the earlier context.
      source: DI-964 | MoM 21 Sep 4.8
    edgeCases:
    - case: The question needs data the person may not see
      expected: '"You don''t have access to finance figures" - not an empty or zero answer.'
      source: contracts/satellite/ai.yaml#sendAiMessage ("retrieval runs as the calling principal") | MoM 21 Sep 4.8
    - case: Usage limit reached (429)
      expected: Says which limit and that the manager has been told.
      source: contracts/satellite/ai.yaml#sendAiMessage (429)
    sampleData:
      question: What was yesterday's ticketing revenue?
      answer: AED 84,320.00 from 1,912 tickets on Wed 30 Sep (online AED 51,200.00, POS AED 33,120.00).
      dataAsOf: Thu 1 Oct 06:00
      followUp: Compare that to the same day last week
    corrections:
    - what: Layout repeats EMP-019's conversation table.
      why: This is the answer view - message thread, citations, query link, feedback.
      source: screens/P06-staff-app.yaml#EMP-020 (purpose "Answer with the operation behind it visible")
    - what: Staff numeric questions go through sendAiMessage only; askReportingQuestion is not declared.
      why: >-
        AI-D13 - knowledge from the vector store, numbers from the semantic layer. Declare askReportingQuestion for numeric
        questions, or say how sendAiMessage routes to it.
      source: ADR-0054 | contracts/satellite/reporting.yaml#askReportingQuestion
      status: fixed
      by: CHG-WIR-012
  EMP-040:
    block: later
    summary: >-
      Knowledge base on the staff phone: search the venue's procedures and policies by meaning ("what do I do if a child is
      lost?") and get a list of matching articles, not a paragraph. The one thing to get right: results are only what this
      person may read, each with its collection and last-updated date, and offline it shows cached articles with a note that
      newer ones may exist.
    inputs:
    - field: query
      rule: >-
        One search box; kinds as filter chips (procedures, policies, products, FAQs); limit is not shown (default page).
      source: contracts/satellite/ai.yaml#semanticSearch
    outputs:
    - element: results
      rule: >-
        Title, snippet with the matching passage highlighted, collection, updated date; sorted by relevance; tap opens the
        article.
      source: contracts/satellite/ai.yaml#semanticSearch
    edgeCases:
    - case: No match
      expected: '"Nothing found" with Ask the assistant; the unanswered query becomes a knowledge gap for the content owner.'
      source: contracts/satellite/ai.yaml#listKnowledgeGaps
    - case: Offline
      expected: Cached articles only, with a note.
      source: screens/P06-staff-app.yaml#EMP-040 (states.offline)
    sampleData:
      query: lost child
      results:
      - Lost child procedure - Guest Safety (updated 12 Sep)
      - Wristband colour codes - Operations
      - Code Adam announcement script - Security
    corrections:
    - what: >-
        pattern configEditor/form with states "The saved knowledge base", "semanticSearch saves the first one", and a Limit
        number field.
      why: It is a search screen; nothing is saved; limit is not a staff decision.
      source: screens/P06-staff-app.yaml#EMP-040
  EMP-041:
    block: later
    summary: >-
      Training on the staff phone: the courses the person must complete for their role, what is expiring, and the material
      to study. The AI part is only search over training content. The one thing to get right: a role a person cannot work
      until a course is done is shown first, with the expiry date.
    outputs:
    - element: training list
      rule: Required courses first, then expiring within 30 days (a designer default window), then completed; each with state and expiry.
      source: contracts/satellite/workforce.yaml#listTrainingRecords | designer default
    edgeCases:
    - case: Offline
      expected: Cached progress; completions queue and sync later.
      source: screens/P06-staff-app.yaml#EMP-041 (states.offline)
    sampleData:
      courses:
      - course: Lifeguard requalification
        required: true
        expires: 31 Oct 2026
        state: expiring
      - course: Cash handling
        required: true
        state: completed
    corrections:
    - what: The table shows principalId and evidenceRef columns and the primary action is "Semantic search".
      why: The person sees their own courses; the primary action is Open course. Search is secondary.
      source: screens/P06-staff-app.yaml#EMP-041
    - what: module AI / requiresModule ai.
      why: Training is a Workforce function; gating it on the AI module hides mandatory training from venues without AI.
      source: contracts/satellite/workforce.yaml#listTrainingRecords
  SUP-006:
    block: later
    summary: >-
      Knowledge base search for support agents: find the policy or FAQ when the guest does not know what it is called, and
      see which questions the assistant could not answer. The one thing to get right: it is a search for agents, not an admin
      list of collections with embedding settings.
    outputs:
    - element: results
      rule: >-
        Semantic results from FAQs and the venue's knowledge collections, each with source and updated date; one-tap "Insert
        into reply".
      source: contracts/satellite/ai.yaml#semanticSearch | contracts/satellite/white-label.yaml#listFaqs
    - element: knowledge gaps
      rule: Unanswered questions grouped and counted, newest first, for the content owner (analytics gaps marked as such).
      source: contracts/satellite/ai.yaml#listKnowledgeGaps
    sampleData:
      search: reschedule cabana
      gaps:
      - question: Can I move my cabana to another day?
        count: 23
        audience: guest
    corrections:
    - what: >-
        Main table lists knowledge collections with shardKey, sparseModel, idfScope, embeddingModel columns (AI_CONFIGURE).
      why: >-
        Agents search content; collection engineering belongs to knowledge administration. Declare semanticSearch for the
        agent's search.
      source: contracts/satellite/ai.yaml#listKnowledgeCollections | contracts/satellite/ai.yaml#semanticSearch
      status: fixed
      by: CHG-WIR-012
    - what: entry params bannerId, pageId, policyKind, version.
      why: Left over from the white-label bulk attach; a knowledge search takes a query.
      source: screens/P12-support-agent-console.yaml#SUP-006 (notes)
  SUP-018:
    block: later
    summary: >-
      Configuration of the customer-service copilot that works beside agents: which authorised data it may read (customer,
      orders, cases), which knowledge collections, which channels it may draft replies for, the brand tone, whether to reply
      in the customer's language, and whether anything may be sent without an agent (off by default). A venue can narrow the
      tenant's settings, never widen them. The one thing to get right: the copilot drafts and summarises (the case summariser
      compiles every action taken on the case); an agent sends.
    inputs:
    - field: autoSend
      rule: Off by default and visibly risky; turning it on needs a confirmation naming the channels.
      source: contracts/satellite/marketing-crm.yaml#setCustomerServiceCopilot | ADR-0050
    - field: dataSources / draftChannels / knowledgeCollectionIds
      rule: Checklists showing the tenant's allowed values; a venue cannot add one the tenant does not allow (422).
      source: contracts/satellite/marketing-crm.yaml#setCustomerServiceCopilot
    outputs:
    - element: preview
      rule: A sample case with the copilot's draft reply and case summary, labelled as AI-drafted.
      source: DI-543 | designer default
    sampleData:
      copilot:
        dataSources:
        - customer profile
        - orders
        - cases
        channels:
        - email
        - whatsapp
        tone: Warm, concise
        replyInCustomerLanguage: true
        autoSend: false
      summary: >-
        Guest Omar Haddad asked to move a cabana booking (BK-48213) from Sat to Sun; agent moved it, fee waived as goodwill,
        confirmation sent.
    corrections:
    - what: purpose is a pasted board description; layout is a "Review → Execute" button and Cancel.
      why: Bind the form to setCustomerServiceCopilot and the profile list to listAssistantProfiles.
      source: screens/P12-support-agent-console.yaml#SUP-018
      status: fixed
      by: CHG-WIR-013
    - what: requiresModule marketing.
      why: The copilot is an AI capability; it needs the AI module as well.
      source: contracts/satellite/ai.yaml#configureAssistantProfile
  ANL-010:
    block: later
    summary: >-
      Every open operational suggestion at the venue - replenishment, prep plan, menu engineering, staffing, send time, waste
      risk, price and the rest - what each is based on, and whether the venue took it. Every kind answers from day one on
      the venue profile and the venue-type starting pattern and says so. The one thing to get right: each card shows its stage
      and "Based on", a range or plain value, confidence only where a model has one, and the decision buttons record what
      the venue actually did.
    inputs:
    - field: decision (Take it / Do something else)
      rule: >-
        Take it records accepted; Do something else asks what was done instead (actual value) and records modified or rejected
        with a note. Ignored and expired are recorded by the platform, not chosen.
      source: contracts/satellite/ai.yaml#recordSuggestionOutcome
    - field: ask for a suggestion
      rule: >-
        Kind as a labelled picker (not a text field), subject (product, outlet, item), horizon (next service, 7 days, 28 days).
      source: contracts/satellite/ai.yaml#requestSuggestion
    outputs:
    - element: suggestion card
      rule: >-
        Kind, subject, the value (e.g. "Order 18 cases of bottled water"), explanation in plain words, stage badge and Based
        on, "Limited historical data" where it applies, producer (rule or model version), expires at; confidence hidden when
        null.
      source: contracts/satellite/ai.yaml#/components/schemas/Suggestion | ADR-0051
    - element: missing setting
      rule: >-
        A 422 shows as a banner naming the setting (e.g. "No par level for Bottled water 500 ml") with a link to set it; never
        "not enough data".
      source: contracts/satellite/ai.yaml#requestSuggestion (422)
    edgeCases:
    - case: Suggestion expired
      expected: Hidden from the open list; visible under history as expired.
      source: contracts/satellite/ai.yaml#/components/schemas/Suggestion (expiresAt)
    consistency:
    - with: ANL-071
      note: Stage badge and Based on line are the same component.
    sampleData:
      cards:
      - kind: replenishment
        subject: Bottled water 500 ml - Lagoon Grill
        value: Order 18 cases by Thu
        explanation: Par 30, on hand 9, forecast use 21 over the 2-day lead time
        stage: Starting
        basedOn: your par levels, water-park pattern, weather (38°C)
        confidence: null
      - kind: prepPlan
        subject: Lagoon Grill, Sat lunch
        value: Burgers 240, wraps 110, salads 60
        stage: Learning
        basedOn: forecast 2,600 guests × your menu mix over 5 weeks
    corrections:
    - what: Kind, Subject ref, Horizon and Context are free textFields.
      why: kind is a closed enum, subject is a picker and context is the numbers the screen shows; never typed JSON.
      source: contracts/satellite/ai.yaml#/components/schemas/SuggestionKind
    - what: recordSuggestionOutcome asks the user for id, decidedByPrincipalId and decidedAt.
      why: Those come from the session and the server; the user gives the decision, actual value and note.
      source: contracts/satellite/ai.yaml#recordSuggestionOutcome
    - what: There is no list operation for open suggestions; the screen can only request one.
      why: '"Every open suggestion" needs a listSuggestions read.'
      source: screens/P16-venue-analytics.yaml#ANL-010 (purpose)
  ANL-055:
    block: later
    summary: >-
      Anomaly detection centre: unusual movements across KPIs, flagged from the first week against limits the venue sets and
      against the forecast, then against its own normal as history builds. Configure detectors per KPI. The one thing to get
      right: each anomaly shows its expected range and what it was compared with (stage), and aggregate deviations live here
      while one cashier's or one till's pattern is a risk case, not an anomaly.
    inputs:
    - field: detector (metric, method, thresholds, sensitivity, dimensions, cadence)
      rule: >-
        Day one method threshold with defaults the venue edits (refund rate, void rate, cash variance) plus "attendance below
        the forecast's low end"; seasonal and peer methods offered once history allows, marked with the stage they need.
      source: >-
        contracts/satellite/ai.yaml#configureAnomalyDetector | ADR-0051 (AI functions review 30 Sep §4 Anomaly detection)
    outputs:
    - element: anomaly rows
      rule: >-
        KPI, expected range (not a single expected value), actual, variance, severity, start and duration, site, domain; no
        "confidence" column - the basis label instead (threshold you set, same weekday over N weeks, peer venues).
      source: contracts/satellite/ai.yaml#listAiInsights | ADR-0051
    - element: detector health
      rule: Each detector's measured false-alarm rate (from rejected insights).
      source: contracts/satellite/ai.yaml#listAnomalyDetectors
    edgeCases:
    - case: The anomaly is one actor (a cashier's refunds)
      expected: Not shown here; routed as a risk alert (link to the fraud and risk case screen).
      source: ADR-0053
    consistency:
    - with: ANL-019
      note: Anomalies are insights of kind anomaly; same card and lifecycle.
    sampleData:
      rows:
      - kpi: Refund rate
        expected: 0.8-1.6%
        actual: 4.2%
        severity: high
        site: Coastal Aqua
        started: Sat 26 Sep 14:00
        basis: Threshold you set (2%)
      - kpi: Attendance
        expected: 2,100-3,300
        actual: 1,640
        severity: medium
        basis: Below forecast low end
    corrections:
    - what: Columns are board labels bound to no operation, including "Confidence".
      why: Bind to listAiInsights (kind anomaly); replace Confidence with the basis (ranges, never a bare percentage).
      source: screens/P16-venue-analytics.yaml#ANL-055 | ADR-0051
    - what: requiresModule analytics.
      why: Anomaly detection is an AI capability (family anomalyDetection).
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (enabledCapabilities)
    - what: Declares listAnalyticsAnomalies and listAiInsights.
      why: Same duplication as ANL-019; one list.
      source: contracts/satellite/ai.yaml#listAiInsights
      status: fixed
      by: CHG-WIR-012
  ANL-059:
    block: later
    summary: >-
      The governance trail of AI analytics: for each insight or answer - who asked, what data was accessed, what was generated,
      whether it was exported or shared and whether the recommendation was accepted - with its evidence. The one thing to
      get right: it is a read-only history with evidence labelled source, calculated or AI-inferred, not a form to fill in.
    outputs:
    - element: history row
      rule: >-
        Time, person, question or insight, data accessed (metrics and venues), answer, exported/shared, decision and measured
        impact; filters by person, venue and kind.
      source: contracts/satellite/ai.yaml#listAiInsights | MoM 18 Sep 4.3
    - element: evidence
      rule: Each evidence item labelled From your data / Calculated / AI inferred, with when it was observed.
      source: contracts/satellite/ai.yaml#/components/schemas/AiEvidenceItem
    sampleData:
      row:
        when: Mon 28 Sep 09:12
        who: Fatima Al Mansoori
        insight: Online revenue down 14% last weekend
        data: Revenue by channel, Coastal Aqua, 19-27 Sep
        exported: PDF to Omar Haddad
        decision: accepted
    corrections:
    - what: pattern configEditor with text fields "Who asked", "What data was accessed", "What answer was generated".
      why: These are columns of a history, read-only; nothing is entered.
      source: screens/P16-venue-analytics.yaml#ANL-059
    - what: No operation returns who asked, what was accessed or whether it was exported.
      why: Those live in decision records and interactions (searchAiDecisions, listAiInteractions); declare them.
      source: contracts/satellite/ai.yaml#searchAiDecisions | contracts/satellite/ai.yaml#listAiInteractions
      status: fixed
      by: CHG-WIR-012
  ANL-060:
    block: later
    summary: >-
      How AI may use analytics: which AI capabilities touch analytics, their model, autonomy and status, usage and cost, the
      prompt templates in use and their evaluations - so no LLM has unrestricted access to the database. The one thing to
      get right: the screen states the rule (the model writes a query spec, Reporting runs it; numbers only from query results)
      and shows each analytics capability against it.
    outputs:
    - element: capability rows
      rule: >-
        Capability, model, use case, status, autonomy vs ceiling, usage (queries, tokens, cost), p95 response time, error
        rate.
      source: contracts/satellite/ai.yaml#listAiCapabilities | contracts/satellite/ai.yaml#getAiUsage
    - element: rule banner
      rule: >-
        "AI never reads your database directly. It writes a query the platform runs with your permissions; every number comes
        from that query."
      source: ADR-0054
    - element: evaluations
      rule: >-
        Per prompt template version, the evaluation runs and gate results; isolation and permission cases must pass 100%.
      source: contracts/satellite/ai.yaml#listAiEvaluations | contracts/satellite/ai.yaml#runAiEvaluation
    sampleData:
      rows:
      - capability: analytics.ask
        model: gpt-4o (Azure OpenAI, UAE North)
        status: Flagged off until Feb 2027
        autonomy: L1 Advisory
      - capability: insights.explain
        model: gpt-4o-mini
        autonomy: L1 Advisory
        queries: 412
        cost: AED 38.40
    corrections:
    - what: Columns are board labels bound to nothing (User, Tenant columns on a venue analytics screen).
      why: Bind to listAiCapabilities filtered to analyticsInsights and getAiUsage grouped by capability.
      source: screens/P16-venue-analytics.yaml#ANL-060
    - what: publishPromptTemplate (AI_APPROVE) on a venue analytics screen.
      why: Prompt publication is model governance (ADM-037 / console); here read-only.
      source: contracts/satellite/ai.yaml#publishPromptTemplate
      status: fixed
      by: CHG-WIR-012
  ANL-071:
    block: later
    summary: >-
      The AI maturity page: for every question the venue's AI answers, where it stands (Starting, Learning, Established, Trained
      on your data), what it is based on, how much is the venue's own data and what the next stage needs; the venue AI profile
      the baselines stand on; and the import of the venue's own history from before TICVAI. The one thing to get right: this
      is where the customer sees "Learning your venue" instead of "comes later" - each row is honest about its basis, and
      nothing here changes an answer already given.
    inputs:
    - field: venue AI profile
      rule: >-
        Venue type (water park, theme park, family entertainment centre, museum, arena, zoo or aquarium, other), outdoor,
        capacity, opening hours, typical weekday and weekend attendance, peak months, average spend, F&B attach rate, staff
        productivity per role. Each empty field shows the starting pattern's default in grey ("Water-park default: 35%").
        Saving takes effect at the next nightly re-estimate.
      source: contracts/satellite/ai.yaml#setAiVenueSettings | ADR-0051
    - field: history import
      rule: >-
        Data kind (attendance, admissions, ticket sales, F&B sales, retail sales, queue readings, staff shifts), the uploaded
        export, source system, column mapping (date, measure, dimensions) with a preview of the first rows, and Dry run first
        (default on). States "Used for AI only - never posted to your ledger".
      source: contracts/satellite/ai.yaml#importVenueHistory | ADR-0051
    outputs:
    - element: maturity rows
      rule: >-
        Question (e.g. "Attendance forecast", "Replenishment suggestions", "Checkout recommendations", "Fraud scoring"), stage
        badge, Based on, own-data share as a bar, next stage needs ("8 more Saturdays of sales", "an admin promotion"), since.
      source: >-
        contracts/satellite/ai.yaml#listAiCapabilityMaturity | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    - element: import result
      rule: >-
        Rows read, loaded, rejected, months covered; findings with their row (bad date, negative quantity, duplicate day).
        12 months or more says "Answers covered by this import move to Established".
      source: contracts/satellite/ai.yaml#getVenueHistoryImport | ADR-0051
    edgeCases:
    - case: A learned model is ready to promote
      expected: Row shows "Ready to promote - your administrator decides"; no promote button here.
      source: ADR-0051 | contracts/satellite/ai.yaml#promoteAiRelease
    - case: Second import of an overlapping period
      expected: 409 explained as overlapping months, with the earlier import named.
      source: contracts/satellite/ai.yaml#importVenueHistory (409)
    consistency:
    - with: ADM-554
      note: Same stages; promotion controls live there.
    - with: ADM-471
      note: The configuration assistant collects the same venue profile during onboarding.
    sampleData:
      profile:
        venueType: waterPark
        outdoor: true
        capacity: 6000
        weekday: 1800
        weekend: 3200
        peakMonths:
        - 11
        - 12
        - 1
        - 2
        - 3
        - 4
        averageSpend: AED 145.00
        fnbAttach: 62%
        productivity:
          cashier: 40 transactions/h
          gate: 300 scans/h
      rows:
      - question: Daily attendance forecast
        stage: Learning
        basedOn: venue profile, UAE calendar, weather, 6 weeks of your sales
        ownData: 41%
        next: about 6 more weeks for Established
        limited: true
      - question: Checkout recommendations
        stage: Starting
        basedOn: your product relationships and business priorities
        next: take-up rates from 4 weeks of offers
      import:
        kind: ticketSales
        sourceSystem: Previous ticketing system export
        months: 18
        loaded: 41230
        rejected: 37
    corrections:
    - what: >-
        The maturity block is on Suggestion and AiForecastVersion, but AiOperationalRequirement, AiRecommendationResult and
        transaction risk answers do not carry it.
      why: >-
        ADR-0051 says every answer carries maturity; requirements, recommendations and risk scores need it (or a reference
        to the row here) for the shared component.
      source: >-
        ADR-0051 | contracts/satellite/ai.yaml#/components/schemas/AiOperationalRequirement | contracts/satellite/ai.yaml#/components/schemas/AiRecommendationResult
  ADM-499:
    block: later
    summary: >-
      Forecasting command centre: one view of expected attendance, demand and revenue across venues and the coming days, with
      how far each forecast has matured and which forecast alerts are open. Forecasts exist from day one on the venue profile,
      the venue-type pattern, the UAE calendar and the weather, so the tiles are never empty. The one thing to get right:
      every tile is a range with a most-likely figure and a stage badge, never a bare number and never a "confidence %".
    outputs:
    - element: attendance and revenue tiles
      rule: >-
        "2,600 guests (1,850-3,400)" for today, tomorrow and next 7 days; revenue likewise in AED. A small stage badge and
        "Based on" on hover; "Forecast is out of date" when stale (36 hours).
      source: contracts/satellite/ai.yaml#getForecast | ADR-0051 | ADR-0051 (AI functions review 30 Sep §4 Forecasting)
    - element: current bookings vs forecast
      rule: >-
        Bookings on hand shown as the floor of the forecast range (a forecast never shows fewer guests than are already booked).
      source: ADR-0051 (AI functions review 30 Sep §4 Forecasting)
    - element: Forecast vs Actual / Revenue Forecast Accuracy tiles
      rule: Labelled "measured over <period>"; until 4 weeks of actuals exist the tile reads "Measuring".
      source: contracts/satellite/ai.yaml#getForecastAccuracy | ADR-0051
    - element: active forecast alerts
      rule: Count of open alerts (forecast not published, deviation beyond range) linking to their screens.
      source: >-
        contracts/satellite/ai.yaml#/components/schemas/AiGovernanceAlert (forecastNotPublished) | contracts/satellite/ai.yaml#listAiInsights
    edgeCases:
    - case: A venue with less than 4 weeks of trading
      expected: All tiles still show ranges, wider, with "Starting - Limited historical data".
      source: ADR-0051
    consistency:
    - with: ANL-057
      note: Same tiles on the venue analytics studio; one component.
    sampleData:
      today:
        venue: Coastal Aqua
        attendance: 2,600 (1,850-3,400)
        stage: Starting
        basedOn: venue profile, water-park pattern, UAE calendar, weather 34°C
      next7: 15,900 guests (12,300-19,600)
      revenue7: AED 2.31m (AED 1.78m-2.84m)
      bookingsOnHand: 6420
    corrections:
    - what: Tiles "Forecast Confidence" and "Demand Index" bound to nothing.
      why: >-
        Confidence is shown as a range and a stage, never a single figure (ADR-0051); no operation defines a demand index
        - drop it or define it.
      source: ADR-0051 | screens/P09-platform-admin-console.yaml#ADM-499
    - what: >-
        The P09 console shows a tenant's venues' forecasts with requiresModule analytics and no tenant picker or grant.
      why: Forecasting is an AI capability; and see the ADM-520 correction on tenant scope.
      source: screens/P09-platform-admin-console.yaml#ADM-037 (notes, R098)
  ADM-500:
    block: later
    summary: >-
      Define what is forecast: subject (attendance, timeslot demand, channel pace, revenue, occupancy, queue, staffing and
      others), grain, breakdowns, horizon, refresh cadence, which producer is live, how much own history to read, what the
      forecast stands on before history exists (cold start), whether it auto-publishes and its quality gates. The one thing
      to get right: the producer choice offers rule, statistical or ensemble - a trained model is never chosen here, it arrives
      only through promotion.
    inputs:
    - field: producer
      rule: >-
        Rule, Statistical or Ensemble (a weighted blend); "Model" is shown disabled with "A trained model goes live only when
        your admin promotes it".
      source: DI-958 | contracts/satellite/ai.yaml#setForecastDefinition (producer)
    - field: historyWindowMonths
      rule: Default 36 months (1-60); imported history counts; less history than the window is fine and said.
      source: DI-958 | contracts/satellite/ai.yaml#setForecastDefinition
    - field: coldStart
      rule: >-
        Strategy (venue settings with the venue-type pattern - default; sister venue of the same tenant; category baseline;
        imported history), prior weight k (default 4 same weekdays) and starting band (default ±40%). A sister venue must
        be the same tenant; no data is pooled across tenants.
      source: contracts/satellite/ai.yaml#setForecastDefinition (coldStart) | ADR-0051
    - field: autoPublish
      rule: >-
        Off by default; on means L4 Controlled auto - publishes without approval only when the gates pass; the switch states
        that.
      source: ADR-0050 | contracts/satellite/ai.yaml#setForecastDefinition
    - field: horizon / grain / refresh
      rule: >-
        Horizon in days (1-730) offered as presets (intraday, next day, 7, 14, 30, 90); hourly grain only with hourly refresh.
      source: contracts/satellite/ai.yaml#setForecastDefinition | designer default
    sampleData:
      definition:
        key: attendance.daily.coastal-aqua
        subject: attendance
        grain: day
        horizonDays: 90
        refresh: daily
        producer: statistical
        historyWindowMonths: 36
        coldStart:
          strategy: venueSettings
          k: 4
          band: ±40%
        autoPublish: true
        dimensions:
        - channel
        - product
    corrections:
    - what: >-
        30 selectFields lifted from the board (each forecast type and each horizon as its own select, plus Tenant, Status,
        Effective Dates).
      why: >-
        Subject is one enum, horizon one number, grain one enum; Tenant comes from the scope. Use the contract's fields.
      source: contracts/satellite/ai.yaml#setForecastDefinition | screens/P09-platform-admin-console.yaml#ADM-500
    - what: '"Confidence Policy" select.'
      why: The contract has the starting band and quality gates, not a confidence policy; map it or drop it.
      source: contracts/satellite/ai.yaml#setForecastDefinition (coldStart.startingBandPercent, qualityGates)
  ADM-501:
    block: later
    summary: >-
      Signals a forecast may use: weather, public holidays, the school calendar, the religious calendar (Ramadan and Eid by
      Hijri date), events, marketing and internal series - each with its provider, refresh cadence and freshness. The one
      thing to get right: a stale or failing signal is visible per forecast, because a missing blocking signal stops publication.
    inputs:
    - field: signal source
      rule: >-
        Kind, provider, credential reference (never a secret), refresh cadence (hourly, daily, weekly, manual), active. The
        weather provider carries a cost (agreed).
      source: contracts/satellite/ai.yaml#configureForecastSignalSource | ADR-0051 (AI-D10 weather API with its cost)
    - field: signals per definition
      rule: Which signal keys each forecast definition may use, as checkboxes per definition.
      source: contracts/satellite/ai.yaml#setForecastDefinition (signalKeys)
    outputs:
    - element: freshness
      rule: Last refreshed and next due per signal; amber when late, red when a blocking signal is missing.
      source: contracts/satellite/ai.yaml#listForecastSignals | contracts/satellite/ai.yaml#publishForecastVersion
    sampleData:
      signals:
      - key: weather.dubai
        kind: weather
        provider: Weather API
        cadence: hourly
        last: '10:00'
      - key: uae.holidays
        kind: publicHoliday
        cadence: manual
      - key: hijri.calendar
        kind: religiousCalendar
        cadence: weekly
      - key: uae.school
        kind: schoolCalendar
        cadence: weekly
    corrections:
    - what: Buttons "Save forecast definition" and an unbound table.
      why: Bind the table to listForecastSignals and the editor to configureForecastSignalSource.
      source: screens/P09-platform-admin-console.yaml#ADM-501
  ADM-502:
    block: later
    summary: >-
      Attendance forecast in detail: by day and hour, venue and breakdown, with range, drivers and how it compares with actuals
      so far. The one thing to get right: the chart shows the P10-P90 band and the most-likely line, actuals as points, and
      the stage of the forecast (Starting with a wide band on day one, tightening as own data builds).
    outputs:
    - element: attendance chart
      rule: Band (P10-P90), P50 line, actuals; bookings on hand as a floor line; weekends (Sat-Sun) and holidays marked.
      source: contracts/satellite/ai.yaml#getForecast | ADR-0051
    - element: alerts
      rule: >-
        Attendance below the forecast's low end raises an insight; the detector on the forecast can be set up from here.
      source: >-
        contracts/satellite/ai.yaml#configureAnomalyDetector (source forecast) | ADR-0051 (AI functions review 30 Sep §4 Anomaly
        detection)
    sampleData:
      days:
      - date: Sat 17 Oct
        p10: 2100
        p50: 2900
        p90: 3600
        booked: 1980
      - date: Sun 18 Oct
        p10: 1900
        p50: 2600
        p90: 3300
      stage: Learning
    corrections:
    - what: Layout is an unbound table with unlabelled buttons.
      why: Bind the chart and table to getForecast for the attendance definition.
      source: screens/P09-platform-admin-console.yaml#ADM-502
  ADM-503:
    block: later
    summary: >-
      Demand by ticket, product and timeslot: the booking curve so far, the expected final demand and the remaining opportunity
      per slot, so slots can be added, merged or repriced. The one thing to get right: a suggested slot or price change is
      a suggestion with a person's approval, never applied from the forecast.
    outputs:
    - element: booking curve
      rule: >-
        Days before visit on the x-axis, cumulative sales, the historical average curve (or the starting pattern's while history
        is short) and the forecast final demand as a range.
      source: contracts/satellite/ai.yaml#getForecast | screens/P09-platform-admin-console.yaml#ADM-503
    - element: slot suggestions
      rule: >-
        Add, remove or merge an under-sold slot (with guest notification of the time change), raise price above about 80%
        sold, lower below about 20-30% - each shown as a suggestion that opens the owning screen; approval by a person.
      source: DI-454 | ADR-0050 (pricing inputs L2)
    sampleData:
      slot:
        product: Dolphin Show 16:00
        capacity: 400
        sold: 312
        daysBefore: 3
        forecastFinal: 380-420
        suggestion: Raise to AED 95 (sold 78%)
    corrections:
    - what: Column "Product Relationships" in a demand table.
      why: Relationships belong to recommendations configuration; drop it here.
      source: screens/P09-platform-admin-console.yaml#ADM-503
  ADM-504:
    block: later
    summary: >-
      Where and when the remaining sales will come from: per channel (website, app, POS, flying POS, kiosk, B2B, reseller,
      OTA/API, call centre, walk-in) the bookings so far, the expected additional and the expected final. The one thing to
      get right: current + expected additional = forecast final, shown per channel, with walk-in as its own line.
    outputs:
    - element: channel table
      rule: 'Channel rows (not columns): current, expected additional (range), forecast final (range), pace vs usual.'
      source: contracts/satellite/ai.yaml#getForecast (dimensionKey "channel=web") | screens/P09-platform-admin-console.yaml#ADM-504
    sampleData:
      rows:
      - channel: Website
        current: 3120
        additional: 600-950
        final: 3,720-4,070
      - channel: Walk-in
        current: 0
        additional: 700-1,300
    corrections:
    - what: Channels are drawn as columns, with a mangled column "Channel Current Expected Additional Final Forecast".
      why: Channels are rows; current, additional and final are the columns.
      source: screens/P09-platform-admin-console.yaml#ADM-504
  ADM-505:
    block: later
    summary: >-
      Revenue forecast: ticket, membership, add-on, F&B and retail revenue, revenue per visitor and against budget, each as
      a range. The one thing to get right: revenue is forecast from forecast volume and current published prices; it never
      invents prices and always shows the range.
    outputs:
    - element: revenue tiles
      rule: >-
        "AED 412,000 (AED 318,000-503,000)" per line; F&B and retail only where those modules are licensed; vs budget only
        where a budget exists.
      source: contracts/satellite/ai.yaml#getForecast | ADR-0051
    sampleData:
      next7:
        tickets: AED 1.62m (1.25m-1.98m)
        fnb: AED 0.41m (0.31m-0.50m)
        perVisitor: AED 145 (AED 132-158)
    corrections:
    - what: Tile "Revenue Confidence Range" as a separate metric.
      why: The range belongs on each figure, not on its own tile.
      source: ADR-0051
  ADM-506:
    block: later
    summary: >-
      Why the forecast is what it is and why it changed: the drivers (booking pace, weekday pattern, events, weather, price,
      cancellations) with direction and strength, the change from the previous version, the uncertainty by horizon and what
      limits it (limited history, a new product, a missing signal). The one thing to get right: uncertainty is shown as ranges
      by horizon and measured accuracy, not as "92% / High".
    outputs:
    - element: change explanation
      rule: >-
        Previous vs current most-likely and range, with the drivers that moved it; the decomposition is plain arithmetic and
        the model only words it.
      source: contracts/satellite/ai.yaml#explainMetricChange | ADR-0054
    - element: uncertainty by horizon
      rule: >-
        Range width at 1, 7, 28 days and measured WAPE/coverage where it exists; flags such as "Limited historical data",
        "New product", "Missing weather" as chips.
      source: contracts/satellite/ai.yaml#getForecastAccuracy | contracts/satellite/ai.yaml#/components/schemas/AiMaturity
    sampleData:
      forecast:
        value: 16120
        range: 15,300-17,050
        previous: 15640
        change: '+480'
      drivers:
      - driver: Booking pace
        effect: + strong
      - driver: Saturday pattern
        effect: + strong
      - driver: Special event
        effect: + medium
      - driver: Weather
        effect: + medium
      - driver: Price
        effect: neutral
      - driver: Cancellation rate
        effect: '- medium'
      narrative: Booking pace is above the usual Saturday pattern and the weather forecast improved, so the forecast moved
        up.
    corrections:
    - what: >-
        Columns "92% / High", "84% / High", "71% / Medium", "58% / Lower" (confidence by horizon) and "Confidence Status High"
        in purpose.
      why: Never a bare percentage (ADR-0051, design 5.6); show the range by horizon and measured accuracy instead.
      source: ADR-0051 | screens/P09-platform-admin-console.yaml#ADM-506
      status: fixed
      by: CHG-WIR-013
    - what: The board example is pasted into purpose.
      why: Move it to sample data.
      source: screens/P09-platform-admin-console.yaml#ADM-506
      status: fixed
      by: CHG-WIR-013
  ADM-507:
    block: later
    summary: >-
      What-if simulator: test a change - a 10% price decrease, shorter opening hours, rain, an event, a marketing push, more
      or fewer staff, a closure - against a published forecast, and compare scenarios side by side, without changing anything
      live. The one thing to get right: scenario results are deltas against the base version, as ranges, clearly labelled
      "What-if".
    inputs:
    - field: changes
      rule: >-
        One row per lever (price, capacity, opening hours, weather, event, marketing, staffing, closure) with its target and
        value; the base is a published version picked by date.
      source: contracts/satellite/ai.yaml#createForecastScenario | MoM 18 Sep 4.10
    outputs:
    - element: result
      rule: >-
        Attendance, revenue, product demand, peak time, capacity pressure as base vs what-if with the delta range; computing
        state while it runs (202).
      source: contracts/satellite/ai.yaml#createForecastScenario | contracts/satellite/ai.yaml#compareForecastScenarios
    sampleData:
      scenario:
        name: Price -10% weekdays in Nov
        base: Attendance v42
        result: Attendance +6% (+2% to +11%), revenue -4% (-8% to +1%)
    corrections:
    - what: Column "Confidence" in the results.
      why: Show the delta as a range; no confidence figure.
      source: ADR-0051
  ANL-057:
    block: later
    summary: >-
      The venue analytics forecasting studio: pick a subject (revenue, ticket sales, attendance, capacity, queue demand, cash
      collection, membership renewals, churn) and a horizon (next hour to quarter), see the forecast with its range and basis
      against current KPIs, run a what-if and export. The one thing to get right: it reuses the console's forecast components
      and wording; on a new venue it shows Starting forecasts, not "comes later".
    outputs:
    - element: forecast with KPI
      rule: Current KPI value against target beside the forecast range for the chosen horizon; stage badge and Based on.
      source: contracts/satellite/reporting.yaml#getKpiValues | contracts/satellite/ai.yaml#getForecast | ADR-0051
    sampleData:
      subject: Membership renewals, next 30 days
      forecast: 410 renewals (330-490)
      stage: Learning
    corrections:
    - what: Subjects and horizons drawn as buttons and selectFields bound to nothing.
      why: Subject and horizon are two pickers over listForecastDefinitions; only definitions that exist are offered.
      source: contracts/satellite/ai.yaml#listForecastDefinitions
    - what: DI-280 is attached ("cannot be delivered in phase one").
      why: Superseded by ADR-0051; see BO-919.
      source: DI-280 | ADR-0051
  BO-926:
    block: later
    summary: >-
      Resource demand forecast for the resources team: how many of each resource (carts, lockers, cabanas, equipment, staff
      roles) will be needed per period, from the published forecast, against what exists - before a shortage happens. The
      one thing to get right: historical, forecast and actual are three distinct series, and the forecast is a range from
      a named version with its stage.
    outputs:
    - element: resource rows
      rule: >-
        Resource, period, forecast need (with busy case), available, shortfall highlighted; actuals once the period has passed.
      source: contracts/satellite/ai.yaml#listOperationalRequirements | contracts/satellite/ai.yaml#getForecast
    sampleData:
      rows:
      - resource: Family cabanas
        period: Sat 17 Oct
        need: 38 (busy case 44)
        available: 40
        shortfall: up to 4
    corrections:
    - what: DI-280 is attached.
      why: Superseded by ADR-0051.
      source: DI-280 | ADR-0051
  BO-931:
    block: later
    summary: >-
      Operational scenario simulator for the resources team: test "what if 20% more guests", "close the north gate", "two
      lifeguards off sick" before changing the live resource plan, and compare scenarios. The one thing to get right: a scenario
      never changes the plan; any change goes through the owning screen.
    inputs:
    - field: changes
      rule: Levers as on ADM-507 (capacity, opening hours, staffing, closure, event, weather) with plain-language labels.
      source: contracts/satellite/ai.yaml#createForecastScenario
    outputs:
    - element: comparison
      rule: Requirement deltas per resource for each scenario side by side.
      source: contracts/satellite/ai.yaml#compareForecastScenarios
    consistency:
    - with: ADM-507
      note: Same simulator component and lever labels.
    - with: ADM-517
      note: Operational readiness simulator on the console.
    sampleData:
      scenarios:
      - 'Eid Day 1: +25% guests'
      - North gate closed 10:00-12:00
    corrections:
    - what: '"Digital twin" in the name; only forecast scenarios exist.'
      why: No twin model exists in the contracts; label it "Scenario simulator" to avoid promising one.
      source: contracts/satellite/ai.yaml#createForecastScenario
  ADM-509:
    block: later
    summary: >-
      Operational forecasting command centre: the operational pressure ahead - peak in-venue population, occupancy, high-pressure
      periods, attractions and queues at risk, required staff and the gap against the rota, required POS capacity, F&B and
      inventory risk. Everything is derived from the published forecast with the venue's productivity standards. The one thing
      to get right: each requirement is a range from a named forecast version, and the workforce gap is computed against the
      real rota, not invented.
    outputs:
    - element: tiles
      rule: >-
        Requirements as "required 46 (busy case 54)"; workforce gap from Workforce coverage ("6 short at 14:00 Sat"); each
        tile links to its detail screen.
      source: >-
        contracts/satellite/ai.yaml#listOperationalRequirements | contracts/satellite/workforce.yaml#getStaffingCoverage
    - element: basis
      rule: One line under the header naming the forecast version, its stage and Based on.
      source: ADR-0051
    sampleData:
      tiles:
        peakInVenue: 4,100 at 13:00 (3,200-4,900)
        workforceGap: 6 short (Sat 12:00-16:00)
        requiredPos: 11 tills (busy case 13)
        attractionsAtRisk: Wave Rider, Twister Tubes
    corrections:
    - what: Tiles "F&B Demand Index" and "Operational Readiness Score" have no operation or definition.
      why: Define them or drop them; a score nobody can explain fails the explanation rule.
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-509 | contracts/satellite/ai.yaml#/components/schemas/Suggestion (explanation)
    - what: Filter "Tenant" on a tenant-scoped screen.
      why: Tenant is the grant's scope (see ADM-520).
      source: screens/P09-platform-admin-console.yaml#ADM-037 (notes, R098)
  ADM-510:
    block: later
    summary: >-
      Capacity and occupancy forecast: forecast attendance turned into in-venue population by hour and zone against capacity,
      so pressure periods are seen in advance. The one thing to get right: occupancy is drawn against the configured capacity
      line with the busy case shaded, and a predicted breach raises an insight.
    outputs:
    - element: occupancy by hour and zone
      rule: >-
        Heat strip per zone by hour; above 85% of capacity amber, above capacity red (designer default thresholds, configurable
        as a detector).
      source: contracts/satellite/ai.yaml#getForecast | contracts/satellite/ai.yaml#configureAnomalyDetector
    sampleData:
      zone:
        name: Wave pool deck
        capacity: 900
        forecast13h: 780 (640-910)
    corrections:
    - what: Unbound table and unlabelled buttons.
      why: Bind to getForecast (subject occupancy, dimension zone).
      source: screens/P09-platform-admin-console.yaml#ADM-510
  ADM-511:
    block: later
    summary: >-
      Attraction utilisation and queue forecast: expected riders and queue minutes per attraction by hour, and queue-balancing
      suggestions. Wait = people ahead ÷ throughput; until 30 minutes of throughput are measured it uses the configured ride
      capacity. The one thing to get right: each queue figure says where it came from (configured capacity, measured throughput,
      sensor).
    outputs:
    - element: queue forecast
      rule: >-
        Minutes as ranges by hour; source tag (configured capacity / measured / sensor); attractions over a threshold flagged.
      source: >-
        contracts/satellite/ai.yaml#getForecast | ADR-0051 (AI functions review 30 Sep §4 Queue and wait time) | contracts/satellite/queue.yaml#getWaitTimes
    - element: queue balancing
      rule: >-
        Suggestion (kind queueBalancing) e.g. "Open lane 2 at Wave Rider 13:00-15:00", with Based on; a person acts in operations.
      source: contracts/satellite/ai.yaml#requestSuggestion
    sampleData:
      attraction:
        name: Wave Rider
        capacityPerHour: 480
        forecastQueue14h: 35-50 min
        basis: measured throughput, 6 weeks
    corrections:
    - what: Unbound table.
      why: Bind to getForecast (subject attractionUtilisation / queue).
      source: screens/P09-platform-admin-console.yaml#ADM-511
  ADM-512:
    block: later
    summary: >-
      Entry and guest-flow forecast: arrivals by 15 minutes per gate, exits, and the lanes needed to keep the gate queue short.
      The one thing to get right: arrival curves show the morning peak with group arrivals and the share of credentials needing
      manual validation, which drive lane needs.
    outputs:
    - element: arrivals per gate
      rule: Arrivals per 15 min as a band per gate; lanes required (scans per lane per hour standard) vs lanes planned.
      source: contracts/satellite/ai.yaml#getForecast | contracts/satellite/ai.yaml#listOperationalRequirements (kind gates)
    sampleData:
      gate:
        name: Main gate
        peak: 09:45-10:15, 620-840 arrivals
        lanesRequired: 5 (busy case 6)
        lanesPlanned: 4
    corrections:
    - what: Single unbound table.
      why: Bind to getForecast (subject entryFlow, dimension gate) and gates requirements.
      source: screens/P09-platform-admin-console.yaml#ADM-512
  ADM-513:
    block: later
    summary: >-
      Workforce demand and staffing forecast: required staff by role and period against what is scheduled, with the drivers
      (arrival volume, gate throughput, group arrivals, credential mix, manual validation rate). The one thing to get right:
      it is the console view of the same requirement rows as BO-927, including how each number was worked out and the productivity
      standard used.
    outputs:
    - element: rows
      rule: >-
        Role, period, required (busy case), scheduled, gap; drivers listed per row; standard shown with its source (default,
        edited, measured).
      source: >-
        contracts/satellite/ai.yaml#listOperationalRequirements | contracts/satellite/workforce.yaml#getStaffingCoverage |
        ADR-0051 (AI functions review 30 Sep §4 Operational requirements)
    consistency:
    - with: BO-927
      note: Same rows, labels and decision states.
    sampleData:
      row:
        role: Gate staff
        period: Sat 09:00-11:00
        required: 8 (busy case 10)
        scheduled: 6
        drivers: arrivals 2,100, 300 scans/lane/h, 18% manual validation
  ADM-514:
    block: later
    summary: >-
      Frontline service forecast: how many POS counters, flying POS, ticket windows, kiosks, service desks, membership counters
      and F&B and retail tills need to be open to keep waits acceptable. The one thing to get right: points are rows with
      required (busy case) vs planned, and the service-level target used is visible.
    outputs:
    - element: rows
      rule: 'Point type as rows (not columns): required, busy case, planned, expected wait at planned.'
      source: contracts/satellite/ai.yaml#listOperationalRequirements (kind pos, kiosk)
    sampleData:
      rows:
      - point: F&B POS - Lagoon Grill
        required: 4 (busy case 5)
        planned: 3
        wait: about 9 min
    corrections:
    - what: Point types drawn as columns.
      why: They are rows.
      source: screens/P09-platform-admin-console.yaml#ADM-514
  ADM-515:
    block: later
    summary: >-
      F&B, retail and stock demand from the visitor forecast: expected covers, items and stock use per outlet - as requirements
      handed to the F&B, retail and inventory modules, not a replacement for them. The one thing to get right: replenishment
      and prep figures are suggestions applied in the owning module.
    outputs:
    - element: outlet demand
      rule: >-
        Covers and top items per outlet as ranges; stock lines at risk (forecast use vs on hand over lead time); target vs
        actual where a target exists.
      source: >-
        contracts/satellite/ai.yaml#listOperationalRequirements (kind fnb, retail, stock) | DI-368 | ADR-0051 (AI functions
        review 30 Sep §4 Operational suggestions)
    sampleData:
      outlet:
        name: Lagoon Grill
        covers: 1,150 (900-1,400)
        atRisk: 'Burger buns: forecast use 1,300, on hand 800, lead time 1 day'
  ADM-516:
    block: later
    summary: >-
      Non-workforce resources: carts, lockers, cabanas, towels, buggies, first-aid points, cleaning cycles - what the forecast
      says will be needed against what exists. The one thing to get right: same requirement rows and labels as the resource
      screens in Venue Management.
    outputs:
    - element: rows
      rule: Resource type, period, need (busy case), available, shortfall.
      source: contracts/satellite/ai.yaml#listOperationalRequirements (kind resource, equipment, facility)
    consistency:
    - with: BO-926
      note: Same rows.
    sampleData:
      rows:
      - resource: Large lockers
        need: 520 (busy case 610)
        available: 560
  ADM-517:
    block: later
    summary: >-
      Operational readiness simulator: compare operational alternatives (more staff, an extra lane, a closed gate, different
      hours) on readiness measures - workforce gap, average queue, POS wait - before changing anything. The one thing to get
      right: scenarios are columns side by side against the base, as ranges, labelled What-if.
    outputs:
    - element: comparison
      rule: Measures as rows, base and each scenario as columns; better/worse coloured against the base.
      source: contracts/satellite/ai.yaml#compareForecastScenarios | DI-943
    sampleData:
      columns:
      - Base
      - +4 staff
      - Open lane 5
      - Hours 10-19
      rows:
        workforceGap:
        - 18
        - 0
        - 18
        - 18
        avgQueue:
        - 26 min
        - 24 min
        - 25 min
        - 19 min
        posWait:
        - 17 min
        - 16 min
        - 7 min
        - 16 min
    corrections:
    - what: Metric tiles labelled with the board's numbers ("Readiness 87% 93% 90% 91%").
      why: >-
        Those are comparison values; draw a comparison table and move them to sample data. "Readiness %" has no definition
        in the contracts.
      source: screens/P09-platform-admin-console.yaml#ADM-517
  ADM-518:
    block: later
    summary: >-
      Review and hand-over: the forecast findings consolidated into an operational readiness plan, and each requirement accepted,
      modified or rejected and handed to its owning module (Workforce, F&B, Inventory, Resources, Access). The one thing to
      get right: autonomy L2 Prepare - accepting sends a recommendation; a person applies it in the owning module, and the
      hand-over status is visible.
    actions:
    - action: Accept / Modify / Reject (per requirement or bulk accept per module)
      result: Status moves to handed over with the owning module's reference once applied there.
      source: contracts/satellite/ai.yaml#decideOperationalRequirement | ADR-0050
    outputs:
    - element: plan
      rule: Grouped by owning module, each with requirement count, accepted, handed over, applied.
      source: contracts/satellite/ai.yaml#/components/schemas/AiOperationalRequirement (targetContract, status, handoverRef)
    sampleData:
      plan:
      - module: Workforce
        requirements: 14
        accepted: 12
        handedOver: 12
      - module: Inventory
        requirements: 6
        accepted: 4
    corrections:
    - what: >-
        The actionBar holds the board's architecture outline as buttons ("BOARD 1", "├── Attendance", "Critical Board 1 →
        Board 2 Architecture").
      why: Board text, not actions; remove it.
      source: screens/P09-platform-admin-console.yaml#ADM-518
  BO-925:
    block: later
    summary: >-
      Staff recommendation and matching: for a requirement or an open shift, the suggested people ranked by qualification,
      availability, cost and fairness rules from the resource boards. The one thing to get right: the client confirmed matching
      is keyword and rule matching on attributes and qualifications, not full AI - show the rules that matched, and a person
      assigns.
    outputs:
    - element: candidate list
      rule: >-
        Each candidate with the qualifications matched, availability, hours this week and why ranked here; unqualified people
        never appear (a filled position by an unqualified person is still a gap).
      source: TRACKER Actions row 156 | contracts/satellite/workforce.yaml#getStaffingCoverage
    actions:
    - action: Assign
      result: Opens the assignment in Workforce; nothing is assigned here.
      source: ADR-0050 (L2 Prepare)
    sampleData:
      requirement: Lifeguard, Sat 17 Oct 10:00-14:00
      candidates:
      - name: Ahmed Al Zaabi
        matched:
        - Lifeguard L2
        - Wave pool
        hoursThisWeek: 32
      - name: Priya Nair
        matched:
        - Lifeguard L2
        hoursThisWeek: 24
    corrections:
    - what: Declares requestSuggestion, whose kinds have no staff-matching kind (staffing is a headcount).
      why: Matching needs a workforce candidate operation; the suggestion kind staffing returns numbers, not people.
      source: contracts/satellite/ai.yaml#/components/schemas/SuggestionKind | TRACKER Actions row 156
  BO-928:
    block: later
    summary: >-
      Resource conflict assistant: double bookings, expired certifications, equipment in maintenance, venue, capacity, dependency,
      travel-time and setup conflicts - each with the assistant's proposed resolution as a draft a person approves. The one
      thing to get right: proposals are listed with what they would change and expire if not decided; approving still applies
      through the owning module.
    outputs:
    - element: conflicts and proposals
      rule: >-
        Conflict type as a filter chip; each proposal with summary, what changes (before/after), target module, status and
        expiry (proposed expires after 7 days).
      source: >-
        contracts/satellite/ai.yaml#listProposedActions | contracts/satellite/ai.yaml#/components/schemas/ProposedAction (expiresAt)
        | R213
    actions:
    - action: Approve / Reject
      result: >-
        Reject needs a reason; approve records the decision and, for an operational action, routes to the owner to apply within
        24 hours or it expires.
      source: >-
        contracts/satellite/ai.yaml#decideProposedAction | contracts/satellite/ai.yaml#/components/schemas/ProposedAction
    sampleData:
      conflict:
        type: Certification expiry
        detail: Omar Haddad assigned to lifeguard shift Sat; certificate expired 30 Sep
        proposal: Swap with Ahmed Al Zaabi (qualified, available)
    corrections:
    - what: Conflict types are action buttons.
      why: They are filter chips.
      source: screens/P08-venue-back-office.yaml#BO-928
  BO-929:
    block: later
    summary: >-
      Schedule optimisation: the assistant proposes a re-arranged schedule across assignments that respects constraints (qualifications,
      hours, breaks, travel time), shown as a diff a manager approves or rejects. The one thing to get right: the proposal
      shows what moves for whom and why it is better (gaps closed, overtime avoided), and nothing changes until approved.
    outputs:
    - element: proposal diff
      rule: Before/after per person with the improvement in plain numbers (gaps 6 → 1, overtime 14 h → 4 h).
      source: contracts/satellite/ai.yaml#listProposedActions | ADR-0050
    sampleData:
      proposal: Move 3 lifeguards from Sun AM to Sat PM; gaps 6 → 1, overtime 14 h → 4 h
    corrections:
    - what: '"Automatic" in the name, while the operations only propose.'
      why: Autonomy for operational requirements is L2 Prepare; label it "Schedule optimisation (proposal)".
      source: ADR-0050
  BO-932:
    block: later
    summary: >-
      Conversational resource copilot: managers ask about and command the resource module in natural language ("who is free
      to cover gate 2 at 14:00?", "move the cabana cleaning to 18:00"); answers come from the resource services within the
      person's rights, and commands become drafts to approve. The one thing to get right: a command is never executed from
      the chat - it returns a proposal card.
    outputs:
    - element: answer / proposal
      rule: >-
        Answers cite the record they came from; command results show as a proposal card (approve in place or open the owning
        screen).
      source: contracts/satellite/ai.yaml#sendAiMessage (proposedAction) | ADR-0020
    sampleData:
      exchange:
      - Who is free to cover Gate 2 at 14:00 today?
      - Ahmed Al Zaabi and Sara Khan are free and qualified for gates.
    corrections:
    - what: purpose is a pasted board text describing the Employee App workspace.
      why: The mobile part belongs to the Staff App; this screen is the back-office copilot.
      source: screens/P08-venue-back-office.yaml#BO-932
      status: fixed
      by: CHG-WIR-013
    - what: Conversation history shown as a table.
      why: Own conversations as a list, as on the other assistants.
      source: contracts/satellite/ai.yaml#listAiConversations
  ADM-469:
    block: later
    summary: >-
      The configuration assistant's start: create, modify, extend or clone a setup by describing it, optionally seeded from
      documents (a brief, brochure, price list, spreadsheet), and resume earlier sessions. It needs no history and works fully
      from day one; it was the client's first AI priority. The one thing to get right: the promise on the page - "Describe
      what you want; the assistant asks what is missing and nothing is applied until you approve it."
    inputs:
    - field: intent / venue type / description
      rule: >-
        Four intent cards (Create new, Modify, Extend, Clone and adapt); venue type tiles (museum, theme park, water park,
        zoo, aquarium, theatre, stadium, indoor attraction, family entertainment centre, festival, conference, temporary event,
        start from scratch); a free description box. Clone and extend ask for the source setup.
      source: contracts/satellite/ai.yaml#startConfigurationSession | DI-279
    - field: documents
      rule: >-
        Upload a brief, brochure, catalogue, price list, spreadsheet or brand asset; values extracted later cite the page
        or cell.
      source: contracts/satellite/ai.yaml#attachConfigurationSource | TRACKER Actions row 125
    outputs:
    - element: sessions
      rule: >-
        Earlier sessions with intent, venue type, progress %, status (discovering, blueprint ready, planned, executing, completed,
        abandoned), last activity; resume opens where it stopped.
      source: contracts/satellite/ai.yaml#listConfigurationSessions
    sampleData:
      session:
        intent: create
        venueType: Water park
        description: New water park in Dubai, day passes and cabanas, family bundles, open 10-18, closed Mondays in summer
        progress: 35%
        status: discovering
    corrections:
    - what: Venue types are table columns and the four intents are unbound buttons.
      why: >-
        Venue types are choices for startConfigurationSession.venueType; the intents map to intent create/modify/extend/clone.
      source: contracts/satellite/ai.yaml#startConfigurationSession | screens/P09-platform-admin-console.yaml#ADM-469
    - what: >-
        The configuration assistant screens sit on P09 (TICVAI console) though the client wants venue admins and newly onboarded
        clients to use it.
      why: >-
        Either the tenant's administrators use them through the console with a grant, or BO-597/BO-598 are the tenant's entry;
        say which (see ADM-520).
      source: MoM 18 Sep 4.5 | screens/P08-venue-back-office.yaml#BO-597
  ADM-470:
    block: later
    summary: >-
      The first interview step: what is the administrator actually trying to do - create a venue, add products, change prices
      - for which organisation and location, and which configuration areas it will touch. The assistant restates its understanding
      for confirmation before asking details. The one thing to get right: the understanding is shown as editable chips (action,
      object, venue type, organisation, location, operation type, areas), each marked as said by the user or inferred - not
      as a confidence percentage.
    outputs:
    - element: understanding
      rule: >-
        Chips like "Create · Venue · Museum · Existing organisation · Dubai · Permanent"; inferred ones dashed with "Confirm";
        areas to configure as a checklist (venue, products, schedule, capacity, pricing, channels, ticket media, access).
      source: >-
        contracts/satellite/ai.yaml#answerConfigurationQuestion (extracted.provenance) | contracts/satellite/ai.yaml#/components/schemas/AiProvenance
    sampleData:
      understanding:
        action: Create
        object: Venue
        venueType: Museum
        organisation: Existing - Tidewater Heritage
        location: Dubai
        operation: Permanent
        areas:
        - Venue
        - Products
        - Schedule
        - Capacity
        - Pricing
        - Sales channels
        - Ticket media
        - Access
    corrections:
    - what: '"Confidence: 96%" field.'
      why: >-
        The assistant's understanding carries provenance (confirmed, AI recommended, inferred), not a percentage (ranges or
        bands, never a bare percentage).
      source: contracts/satellite/ai.yaml#/components/schemas/AiProvenance | ADR-0051
    - what: 'Understanding values drawn as selectFields with the value in the label ("Action: Create").'
      why: Label and value separate; values come from the extracted answers.
      source: screens/P09-platform-admin-console.yaml#ADM-470
  ADM-471:
    block: later
    summary: >-
      Venue and business model discovery: name, type, location, time zone, currency, permanent/seasonal/temporary, indoor/outdoor,
      locations and attractions, and which admission models apply (general, dated, open-dated, timeslot, assigned seating,
      multi-day, membership, pass, ride-based). Conditional branches follow (a theatre brings performances, seat map, sections,
      price categories). This is also where the venue AI profile is collected for the baselines. The one thing to get right:
      only the branches the answers make relevant are shown.
    inputs:
    - field: admission models
      rule: >-
        Multi-select with one-line examples; each selected model opens its branch of questions; unselected branches are not
        asked.
      source: contracts/satellite/ai.yaml#answerConfigurationQuestion | MoM 18 Sep 4.5
    - field: venue AI profile
      rule: >-
        Capacity, typical weekday/weekend attendance, peak months, average spend, F&B attach rate - asked in conversation,
        saved to the venue AI settings so every forecast and suggestion starts from them.
      source: contracts/satellite/ai.yaml#setAiVenueSettings | ADR-0051 (venue AI profile captured at onboarding)
    sampleData:
      venue:
        name: Coastal Aqua / كوستال أكوا
        type: Water park
        city: Dubai
        timeZone: Asia/Dubai
        currency: AED
        operation: Seasonal
        setting: Outdoor
        attractions: 18
        models:
        - Dated admission
        - Membership
        - Timeslot (cabanas)
    corrections:
    - what: >-
        Admission models and the theatre branch are separate selectFields; the branch logic is drawn as fields ("Conditional
        Logic", "Venue = Theatre").
      why: Branches are questions the assistant asks; the screen shows only relevant ones.
      source: screens/P09-platform-admin-console.yaml#ADM-471
    - what: setAiVenueSettings is not declared though this is where the profile is collected.
      why: The AI review names the configuration assistant as the place to collect the venue AI profile; declare it.
      source: contracts/satellite/ai.yaml#getAiVenueSettings ("or by the configuration assistant in conversation")
      status: fixed
      by: CHG-WIR-012
  ADM-472:
    block: later
    summary: >-
      The core interview workspace: one question at a time on the left, the growing blueprint on the right. Answers can be
      typed in words or picked; each extracted value appears in the blueprint with where it came from. The one thing to get
      right: conversational but controlled - the assistant asks for anything required that is missing (e.g. capacity) rather
      than proceeding, and every value is visibly confirmed, recommended or inferred.
    inputs:
    - field: answer
      rule: >-
        Free text (up to 4,000 characters) or the structured control the question offers (date, number, choice); not streamed
        - a 10-second wait shows "Thinking" with the question kept on screen.
      source: contracts/satellite/ai.yaml#answerConfigurationQuestion
    outputs:
    - element: blueprint side panel
      rule: >-
        Values grouped by module, each with a provenance chip (You said / AI recommended / Inferred - confirm) and, where
        extracted from a document, its citation ("Price list p.4").
      source: >-
        contracts/satellite/ai.yaml#getConfigurationBlueprint | contracts/satellite/ai.yaml#/components/schemas/AiProvenance
    - element: progress
      rule: Progress % and required items still open.
      source: contracts/satellite/ai.yaml#/components/schemas/AiConfigurationSession (progressPercent)
    edgeCases:
    - case: Required information missing
      expected: The assistant asks for it; the blueprint cannot reach Ready while a required decision is open.
      source: >-
        MoM 18 Sep 4.5 | MoM 18 Sep §5 | contracts/satellite/ai.yaml#/components/schemas/AiConfigurationBlueprint (requiredOpen)
    sampleData:
      turn:
        question: What is the maximum number of guests in the park at once?
        answer: About 6,000, but 4,500 in summer
        extracted:
        - key: capacity
          value: 6000
          provenance: confirmed
        - key: summerCapacity
          value: 4500
          provenance: confirmed
    corrections:
    - what: Layout is an unlabelled button, a detail panel and Cancel.
      why: Two-pane conversation + blueprint, bound to answerConfigurationQuestion and getConfigurationBlueprint.
      source: screens/P09-platform-admin-console.yaml#ADM-472
  ADM-473:
    block: later
    summary: >-
      Product and admission discovery: what the venue sells and how each product grants entry or an entitlement (ticket types,
      validity, date/time rules, guest categories, bundles, add-ons, memberships). The one thing to get right: products are
      proposed in the existing ticketing model's terms, not a separate AI product model.
    outputs:
    - element: proposed product list
      rule: Product, type, validity, guest categories, date/time rule, entitlement - each with provenance.
      source: contracts/satellite/ai.yaml#getConfigurationBlueprint | MoM 18 Sep 4.5
    sampleData:
      products:
      - name: Day Pass Adult
        type: dated
        validity: Selected date
        categories:
        - Adult
      - name: Family Day Pass (2+2)
        type: bundle
      - name: Annual Pass
        type: membership
        validity: 12 months
    corrections:
    - what: Unbound button/panel layout.
      why: Same conversation + blueprint pattern as ADM-472, filtered to products.
      source: screens/P09-platform-admin-console.yaml#ADM-473
  ADM-474:
    block: later
    summary: >-
      Operational requirement discovery: opening hours, closures, capacity by area, timeslot lengths, access rules, staffing
      assumptions - the rules needed to deliver the products. The one thing to get right: operational answers that also feed
      the venue AI profile (hours, capacity, productivity) are marked as such.
    outputs:
    - element: operations summary
      rule: >-
        Hours, closures, capacities, slot rules as confirmable rows; "Add requirement" for anything the assistant did not
        ask.
      source: contracts/satellite/ai.yaml#getConfigurationBlueprint
    sampleData:
      operations:
        hours: 10:00-18:00, Fri 10:00-20:00
        closures: Mondays Jun-Aug
        cabanaSlots: Full day only
    corrections:
    - what: '"Confirm Operations | Add Requirement | Continue" is one button label.'
      why: Three actions.
      source: screens/P09-platform-admin-console.yaml#ADM-474
  ADM-475:
    block: later
    summary: >-
      Commercial requirement discovery: how the venue intends to sell (channels, B2B and resellers, promotions, memberships,
      dynamic pricing appetite) without configuring prices yet. The one thing to get right: it records intent; prices and
      rules are proposed later and approved by a person.
    outputs:
    - element: commercial intent
      rule: >-
        Channels, partner selling, promotion types, pricing approach (fixed, seasonal, dynamic within bands) as confirmable
        rows with provenance.
      source: contracts/satellite/ai.yaml#getConfigurationBlueprint
    sampleData:
      intent:
        channels:
        - Website
        - App
        - POS
        - Kiosk
        - Resellers
        pricing: Seasonal with weekend uplift; dynamic within ±15% later
        promotions:
        - Family bundle
        - Early bird
  ADM-476:
    block: later
    summary: >-
      Required, recommended and optional decisions: what must be decided now, what the assistant recommends with a default
      policy, and what can wait - so nothing important is forgotten and nothing unnecessary blocks setup. The one thing to
      get right: required decisions cannot be deferred; recommended ones can be accepted with the assistant's value in one
      click; optional ones can be decided later.
    inputs:
    - field: decision per item
      rule: >-
        Required - accept or modify (no defer); Recommended - accept, modify, reject; Optional - accept, modify, reject, decide
        later. Modify takes a value; a note is optional.
      source: >-
        contracts/satellite/ai.yaml#decideBlueprintRecommendation | contracts/satellite/ai.yaml#/components/schemas/AiBlueprintDecision
        (decisionClass)
    outputs:
    - element: three columns
      rule: >-
        Required / Recommended / Optional with counts; each item shows the question, the proposed value, why (recommendation),
        and provenance.
      source: contracts/satellite/ai.yaml#getConfigurationBlueprint (decisionClass)
    sampleData:
      required:
      - Refund policy for day passes
      recommended:
      - item: Child age limit
        value: 3-11 years
        why: Most UAE water parks use 3-11
      optional:
      - Birthday party packages
    corrections:
    - what: >-
        Decision choices drawn as selectFields ("Configure Now", "Use Recommended Policy", "Decide Later", "Required Rule").
      why: They are the decision buttons on each item, mapped to accept/modify/reject/defer.
      source: contracts/satellite/ai.yaml#decideBlueprintRecommendation
  ADM-477:
    block: later
    summary: >-
      Missing information and clarification centre: everything incomplete, contradictory, ambiguous or inconsistent before
      the blueprint is final - required missing, clarifications, conflicts, warnings - each with the question that resolves
      it. The one thing to get right: each item can be answered in place, and a conflict names both contradicting values and
      where each came from.
    outputs:
    - element: issue list
      rule: >-
        Type (required missing, clarification, conflict, warning, recommendation), the question, the values involved with
        their sources (a document page, the user's answer).
      source: >-
        contracts/satellite/ai.yaml#getConfigurationBlueprint (issues) | contracts/satellite/ai.yaml#/components/schemas/AiBlueprintDecision
        (sourceCitation)
    actions:
    - action: Answer
      result: Resolves the item via the next question; counts update.
      source: contracts/satellite/ai.yaml#answerConfigurationQuestion
    sampleData:
      conflict: 'Capacity: you said 6,000; the brochure (p.2) says 5,500. Which is right?'
      missing: No refund policy given for cabanas
  ADM-478:
    block: later
    summary: >-
      The blueprint and dependency map: the whole conversation turned into a structured configuration blueprint - objects
      by module and the order they depend on each other - reviewed before anything is built. Nothing is created in production
      here. The one thing to get right: readiness (not ready, ready with warnings, ready) is explicit, and compiling the plan
      is disabled while required decisions are open.
    outputs:
    - element: dependency map
      rule: >-
        Module lanes (venue, products, schedule, pricing, channels, access) with objects as nodes and arrows for dependencies
        (e.g. pricing for a channel before publishing a product to it).
      source: contracts/satellite/ai.yaml#/components/schemas/AiConfigurationBlueprint (dependencyMap) | MoM 18 Sep 4.6
    - element: readiness
      rule: Badge with required-open count and issues; version number.
      source: contracts/satellite/ai.yaml#/components/schemas/AiConfigurationBlueprint (readiness, requiredOpen)
    actions:
    - action: Build plan
      result: Compiles the blueprint into an action plan (draft) and moves to the build command centre; nothing executes.
      source: contracts/satellite/ai.yaml#buildConfigurationPlan
    sampleData:
      blueprint:
        version: 3
        readiness: readyWithWarnings
        requiredOpen: 0
        objects: 46
        warnings:
        - No B2B rate for resellers yet
  ADM-479:
    block: later
    summary: >-
      Build command centre: how the blueprint is being turned into real configuration objects - areas, objects proposed, ready,
      warnings, conflicts, missing configuration, recommendations and what needs approval. The one thing to get right: it
      shows the plan's status on the action-plan lifecycle (draft → validated → simulated → awaiting approval → approved →
      executing), not a free-form progress bar.
    outputs:
    - element: plan status
      rule: Stage track of AiActionPlan.status with counts per module; "Approval required" links to the approval workflow.
      source: contracts/satellite/ai.yaml#getActionPlan | contracts/satellite/ai.yaml#/components/schemas/AiActionPlan
    sampleData:
      tiles:
        areas: 6
        objectsProposed: 46
        ready: 41
        warnings: 3
        conflicts: 1
        approvalRequired: 12
  ADM-480:
    block: later
    summary: >-
      Venue and organisation configuration proposed from the blueprint: organisation, venues, zones, opening calendar - as
      draft objects to review per field, with what the assistant inferred marked. The one thing to get right: each proposed
      object shows the owning module's fields, and accepting here only accepts the proposal.
    outputs:
    - element: proposed objects
      rule: Field, proposed value, provenance, status; accept / modify / reject per field or object.
      source: contracts/satellite/ai.yaml#decideBlueprintRecommendation | contracts/satellite/ai.yaml#getActionPlan
    sampleData:
      venue:
        name: Coastal Aqua
        zones:
        - Wave pool
        - Kids splash
        - Lazy river
        - Cabanas
        calendar: Closed Mondays Jun-Aug
  ADM-481:
    block: later
    summary: >-
      Products proposed by the assistant, in the existing ticketing model: product, variants, guest categories, validity,
      entitlement, add-ons. The one thing to get right: the assistant asks for any missing required field (e.g. capacity)
      before drafting, and unstructured input (a brochure, a photo of a price board) can seed it.
    outputs:
    - element: product drafts
      rule: >-
        One card per product with its fields, provenance and citation; required fields missing shown as questions, not blanks.
      source: DI-937 | TRACKER Actions row 125 | contracts/satellite/ai.yaml#getConfigurationBlueprint
    sampleData:
      product:
        name: Family Day Pass (2+2) / تذكرة اليوم العائلي
        price: AED 540.00 (from price list p.4)
        validity: Selected date
        capacityLink: Day capacity
  ADM-482:
    block: later
    summary: >-
      Schedules, timeslots, reservation windows and capacity structures proposed from the operating answers. The one thing
      to get right: capacity per slot and per area is explicit and consistent with the venue's total capacity; a mismatch
      is a conflict, not silently adjusted.
    outputs:
    - element: schedule proposal
      rule: Calendar view of opening days and slots with capacity; conflicts flagged against venue capacity.
      source: contracts/satellite/ai.yaml#getConfigurationBlueprint | MoM 18 Sep 4.6
    sampleData:
      slots: 'Cabanas: full day, 40 per day; Dolphin show: 12:00 and 16:00, 400 seats each'
  ADM-483:
    block: later
    summary: >-
      Prices, taxes, fees and commercial rules proposed from the commercial answers, using the existing pricing model, with
      a price simulation. The one thing to get right: pricing is high risk - every proposed price is a draft that routes for
