  BO-1048:
    block: later
    summary: >-
      Seat upsell rules: offer better seats (view, distance, amenities) for a price difference, within channels, offer window,
      frequency, minimum improvement, margin, membership benefits and exclusions. Seat selection itself stays deterministic
      in Seating; upgrades are upsell placements of the one engine. The one thing to get right: an upgrade is only offered
      if it is genuinely better by the configured minimum and available at offer time.
