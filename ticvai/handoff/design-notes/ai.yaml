    sampleData:
      grid:
      - product: Day Pass
        category: Adult
        day: Saturday
        channel: B2C
        price: AED 140.00
        vat: incl. 5%
    corrections:
    - what: The screen calls setChannelPricingCommercial (PRODUCT_CONFIGURE) directly.
      why: >-
        The assistant only drafts (ADR-0020); pricing is written by the plan's executor after approval, through the owning
        API. Remove the direct write from this screen.
      source: ADR-0020 | contracts/satellite/ai.yaml#/components/schemas/AiActionPlan
      status: fixed
      by: CHG-WIR-012
    - what: Table columns are board values ("AED 120", "AED 20", "Adult / Saturday / B2C").
      why: Sample values, not columns.
      source: screens/P09-platform-admin-console.yaml#ADM-483
  ADM-484:
    block: later
    summary: >-
      Promotions, bundles, upsell and cross-sell proposed from the commercial answers - shown only when the answers made them
      relevant. The one thing to get right: proposals reuse the Promotions model (relationship map, bundles, business priority),
      which is also what Block A upsell answers from.
    outputs:
    - element: proposals
      rule: >-
        Bundle, upsell path or cross-sell relationship with the products involved, price effect and why recommended; provenance
        per item.
      source: contracts/satellite/ai.yaml#getConfigurationBlueprint | ADR-0052
    sampleData:
      proposals:
      - kind: bundle
        name: Family Day Pass (2+2)
        effect: AED 540 vs AED 600 separately
