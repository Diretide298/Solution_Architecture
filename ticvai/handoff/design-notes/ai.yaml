        guest: added Family Day Pass
  BO-1160:
    block: later
    summary: >-
      The venue's fraud and risk investigation workspace: an alert queue (wallet, payments, credentials), triage, and cases
      with evidence and outcome. Flagged transactions are never auto-approved or auto-declined; they wait for a person. The
      one thing to get right: risk score and AI score are distinguished - the deterministic rules triggered and the AI's composite
      score - and both are explained.
    outputs:
    - element: alert queue
