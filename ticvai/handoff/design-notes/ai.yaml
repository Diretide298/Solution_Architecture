      source: screens/P09-platform-admin-console.yaml#ADM-530
  ADM-531:
    block: later
    summary: >-
      The approver's workspace: everything needed to decide without visiting other modules - current vs proposed, effective
      date, impact (channels it publishes to, whether future bookings are affected), risk, affected objects, the AI's explanation
      and evidence, and the simulation. The one thing to get right: current and proposed side by side with the difference
      highlighted, and the approver's own limit shown.
    outputs:
    - element: current vs proposed
      rule: >-
        Two columns with change and % ("Adult weekend price AED 140 → AED 150, +7.1%; effective 1 Oct 2026"); affected channels
        and bookings below.
      source: DI-931 | contracts/satellite/ai.yaml#simulateActionPlan
    actions:
    - action: Approve / Reject
      result: Reason required on reject; approve within the approver's limit, otherwise "Escalate" replaces Approve.
      source: contracts/satellite/ai.yaml#decideProposedAction | DI-932 | DI-956
    sampleData:
      proposal:
        item: Adult Weekend Price
        current: AED 140.00
        proposed: AED 150.00
        effective: 1 Nov 2026
        channels:
        - Website
        - App
        - POS
        futureBookings: 1,204 unaffected (already purchased)
    corrections:
    - what: Values pasted into field labels ("Adult Weekend Price AED 140 AED 150").
      why: Sample data.
      source: screens/P09-platform-admin-console.yaml#ADM-531
  ADM-532:
    block: later
    summary: >-
      Approve with conditions instead of yes/no: e.g. approve the price increase only up to a ceiling, only for given dates,
      only on some channels; anything beyond escalates. The one thing to get right: each condition is explicit and enforced
      at execution, and the approver's threshold range from the matrix is shown.
    inputs:
    - field: conditions
      rule: Typed conditions (maximum value or %, date range, channels, venues) added to the approval.
      source: DI-932 | MoM 18 Sep 4.2
    sampleData:
      condition: Approve up to +5% (AED 147.00); above that escalates to the General manager
    corrections:
    - what: decideProposedAction takes only approve/reject and a reason; there is no place for conditions.
      why: >-
        Conditional approval (DI-932, DI-956) needs approveWithConditions and a conditions object, or the governance outcome
        allowWithConditions surfaced to approvers.
      source: >-
        contracts/satellite/ai.yaml#decideProposedAction | contracts/satellite/ai.yaml#/components/schemas/AiGovernanceOutcome
  ADM-533:
    block: later
    summary: >-
      Challenge the AI before deciding: ask why, request evidence or alternatives, see the decision trace, and override with
      a human decision. The one thing to get right: the challenge conversation is attached to the proposal, and the AI's answers
      cite the evidence in the trace - it cannot invent new numbers.
    outputs:
    - element: proposal context
      rule: >-
        Proposed action, business context, risk, impact, the AI's recommendation and validation, alternatives considered.
      source: contracts/satellite/ai.yaml#getAiDecisionTrace | MoM 18 Sep 4.2
    actions:
    - action: Ask AI
      result: Conversation scoped to this proposal; answers cite trace evidence.
      source: contracts/satellite/ai.yaml#sendAiMessage | ADR-0054
    - action: Override
      result: Records the human decision beside the AI's.
      source: contracts/satellite/ai.yaml#overrideAiDecision
    sampleData:
      challenge:
      - Why +12% and not +8%?
      - Saturday bookings are 31% above forecast high end for 3 weeks; +12% keeps the forecast inside capacity.
    corrections:
    - what: '"Ask AI" is a table column.'
      why: An action.
      source: screens/P09-platform-admin-console.yaml#ADM-533
    - what: No "request changes" decision; decideProposedAction has approve/reject only.
      why: >-
        The minutes ask for challenge and request more information (also the approval engine's Return / Request more information).
      source: TRACKER Actions row 76 | contracts/satellite/ai.yaml#decideProposedAction
  ADM-535:
    block: later
    summary: >-
      Live oversight after approval: watch an AI-driven process step by step (the configuration assistant creating a venue,
      then products, then performances) and intervene - pause, resume, cancel, roll back. The one thing to get right: before
      each intervention the impact is stated - "completed objects remain; 4 actions will remain pending; no active transaction
      affected".
    actions:
    - action: Pause / Resume / Cancel / Roll back
      result: >-
        Each with a confirmation stating its impact; rollback plans compensating steps in reverse dependency order and is
        approved like any plan.
      source: contracts/satellite/ai.yaml#pauseActionPlan | contracts/satellite/ai.yaml#rollbackActionPlan | DI-972
    sampleData:
      impactOfPausing:
      - Completed objects remain
      - 4 actions will remain pending
      - No active transaction affected
    corrections:
    - what: The pause impact sentences are table columns.
      why: They are the content of the pause confirmation.
      source: screens/P09-platform-admin-console.yaml#ADM-535
    - what: cancelActionPlan needs only AI_USE while pause needs AI_APPROVE.
      why: Cancelling an executing plan is at least as consequential as pausing it; align the permission.
      source: contracts/satellite/ai.yaml#cancelActionPlan | contracts/satellite/ai.yaml#pauseActionPlan
  ADM-537:
    block: later
