    sampleData:
      request:
        kind: product
        description: A sunset session ticket for Fridays 18:00-22:00, adults AED 99, kids AED 69, max 800
    corrections:
    - what: requiresModule core.
      why: The workspace needs the AI module.
      source: contracts/satellite/ai.yaml#/components/schemas/AiPolicy (enabledCapabilities configurationAssistant)
  BO-598:
    block: later
    summary: >-
      Review and approve AI-generated configuration before it is committed: the draft field by field, what it will create
      and change, validation results, then approve (or send for approval) or reject. Execution is shown step by step and a
      partial failure rolls back. The one thing to get right: approval is per draft with the before/after visible, and the
      approver cannot be the requester where the approval tier needs a second person.
    outputs:
    - element: draft review
      rule: Field, proposed value, provenance; affected objects; validation; approval tier.
      source: contracts/satellite/ai.yaml#getActionPlan | contracts/satellite/ai.yaml#/components/schemas/ProposedAction
    - element: execution
      rule: Steps with status; on partial completion, "Rolled back - nothing was left half-configured" with the reason.
