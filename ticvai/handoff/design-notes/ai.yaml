# Design notes for the AI & Intelligence process. AUTHORED: refine by hand; nothing regenerates it.
# Rendered by tools/export-design-batch.py into each screen's block. Schema: handoff/design-notes/README.md.
process: ai
title: AI & Intelligence
owner: ai process agent (Claude), 1 October 2026
coverage: >-
  All 137 screens of the ai TSV. Block A (20 screens: WEB-008, WEB-044, GST-031, GST-033, GST-048, GST-054, BO-091, BO-919,
  BO-927, ADM-037, ADM-508, ADM-520, ADM-523, ADM-526, ADM-527, ADM-528, ADM-536, ADM-554, ADM-556, ANL-019) in full: summary,
  inputs, outputs, actions, edge cases, consistency, sample data, corrections, open questions. BO-102 (Venue Management wave
  1, ticketed after Block A) from the AI angle. The other 116 screens (later blocks) in brief: summary, the input/output rules
  where the contract is thin, sample data, and corrections where the package is wrong.
processSummary: >-
  AI in TICVAI is one governed engine behind many screens. The guest meets it as Sahli, the concierge (WEB-044, GST-031, GST-033),
  as the planner agent that refines a rules-built day plan by chat (GST-054), and as upsell and cross-sell offers on a separate
  Extras step (WEB-008, GST-048). Staff meet it as the Staff App's AI tab (EMP-019/020, knowledge EMP-040/041), the kiosk
  assistant (KSK-015) and the support copilot (SUP-006, SUP-018). Venue managers meet it in Venue Management (BO-091 policy
  and spend, BO-919/BO-925..932 resource and staffing forecasts, BO-597/598 configuration drafts, BO-772/782 marketing optimisation,
  BO-793 translations, BO-970/975 seat-map generation, BO-1048 seat upsell, BO-1160 fraud cases) and in Analytics (ANL-010
  suggestions, ANL-019 management insights, ANL-055 anomalies, ANL-057 forecasting studio, ANL-059 insight history, ANL-060
  governance, ANL-071 AI maturity). The governance, configuration-assistant, forecasting, oversight, audit and monitoring
  boards sit on the TICVAI Console (P09: ADM-037 providers, ADM-469..498 configuration assistant, ADM-499..518 forecasting,
  ADM-519..558 governance, ADM-633/637 fraud, ADM-680..697 recommendation governance). Five rules hold on every one of these
  screens. (1) Baseline first, then it learns per tenant: every data-driven answer (forecast, suggestion, risk score, recommendation)
  exists from day one, from the venue AI profile, a starting pattern for the venue type, the UAE calendar and the weather,
  and shifts to the venue's own data as it trades; nothing says "comes later" or refuses for lack of history - a refusal only
  names a missing setting. (2) Every answer shows its basis and maturity: a "Based on" line, a stage badge (Starting, Learning,
  Established, Trained on your data), "Limited historical data" while the starting pattern carries more than half the weight,
  ranges or bands rather than a bare percentage, a confidence only where the producer really has one, a plain-words explanation
  always. (3) A trained model replaces the baseline only when it beats it in a shadow run of at least six weeks and an admin
  promotes it; the platform raises "Ready to promote" and never switches by itself. (4) The LLM never reads raw data: numbers
  come only from query results the platform runs (the answer shows the query), only the masked prompt and retrieved context
  leave the platform, and AI only drafts - the owning screen applies. (5) One autonomy scale, L0 Disabled to L4 Controlled
  auto, with first-release ceilings, separate from user permission and from the approval tier; impactful actions route to
  a person, who sees current against proposed, impact, risk and what is affected, and can approve within a limit, challenge,
  override or roll back; every decision is traceable (data, model, approver, time) and searchable by customer, venue and capability.
  In Block A (5 October to 20 November 2026) the guest concierge with retrieval, Help me choose, translations, the planner
  agent, the gateway and decision point, decision records and starting answers for queue balancing, prep plan and upsell are
  built; Block A upsell comes from the Promotions relationship map (rules), fraud from the owners' own rules, and the P09
  governance screens are built only as far as their setup operations. Everything else is Block B (23 November to 2 April 2027),
  and no trained model can be live for a tenant before 2 April unless it imported twelve months of history.
source:
- ADR-0051
- ADR-0050
- ADR-0020
- ADR-0052
- ADR-0053
- ADR-0054
- ADR-0059
- ADR-0051 (AI-D01..AI-D20)
