  ADM-487:
    block: later
    summary: >-
      Cross-module validation before approval: every proposed object checked against every module's rules - passed, warnings,
      conflicts, missing dependencies, approval requirements - by simulating the plan without changing anything. The one thing
      to get right: each issue names the object, the rule it fails and the module that owns the rule, with a resolution (link
      an existing object, configure later, ask the assistant).
    outputs:
    - element: validation results
      rule: >-
        Per object and step - pass, warning, conflict, missing dependency, governance-blocked (a step failing a module limit
