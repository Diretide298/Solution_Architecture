        prod: Governed
    corrections:
    - what: Matrix rows drawn as buttons ("Generate Configuration Allow Allow Allow Allow").
      why: Table rows.
      source: screens/P09-platform-admin-console.yaml#ADM-525
  ADM-529:
    block: later
    summary: >-
      The human-oversight control room: every AI action waiting for or under human oversight - pending approvals by risk,
      items awaiting a second approver, conditional approvals, requested changes, escalations, overdue reviews, executions
      in progress and today's interventions. The one thing to get right: SLA is visible on every pending item and overdue
      items sort first.
    outputs:
    - element: queue
      rule: >-
        Proposal, capability, risk, approval tier, approver, waiting time vs SLA, expiry; filters by venue, capability, risk,
