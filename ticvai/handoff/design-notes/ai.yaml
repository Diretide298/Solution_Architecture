    - element: adaptive sections
      rule: >-
        Only seating (seated venues), access gates and validation rules, re-entry, ID checks as the blueprint requires.
      source: >-
        screens/P09-platform-admin-console.yaml#ADM-485 (purpose) | contracts/satellite/ai.yaml#getConfigurationBlueprint
    sampleData:
      access:
        gates:
        - Main gate
        - Cabana entrance
        reEntry: Allowed same day with wristband
        validation: QR on ticket or wristband RFID
  ADM-486:
    block: later
    summary: >-
      Channels, ticket media and fulfilment: which products sell on which channels, delivered how (e-ticket, wallet pass,
      wristband, printed), and the dependency that a channel needs a price before a product is published to it. The one thing
      to get right: a product proposed for a channel with no price shows as a blocking dependency.
