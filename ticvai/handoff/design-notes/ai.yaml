    actions:
    - action: Validate (simulate)
      result: Plan moves to validated/simulated; nothing changes in any module.
      source: contracts/satellite/ai.yaml#simulateActionPlan
    - action: Link existing / Configure later / Ask AI
      result: Per-issue resolutions; Ask AI opens the interview with the issue as the question.
      source: screens/P09-platform-admin-console.yaml#ADM-487
    sampleData:
      issue:
        object: Product Day Pass on channel Reseller
        rule: A product needs a channel price before publishing
        owner: Catalogue
        resolution: Configure later
  ADM-488:
    block: later
    summary: >-
      The full preview and impact before approval: the proposed configuration in business terms (what guests will be able
      to buy, when, at what price) and technical terms (objects per module), what it affects (existing bookings, channels)
      and where each value came from. The one thing to get right: impact on existing bookings is explicit - purchased tickets
      never change retroactively.
    outputs:
    - element: business view
      rule: >-
        Plain-language summary per product line; values marked User provided / AI recommended / System derived / Existing
        configuration.
      source: contracts/satellite/ai.yaml#/components/schemas/AiProvenance | screens/P09-platform-admin-console.yaml#ADM-498
    - element: impact
      rule: Affected channels and future bookings counted; higher-risk changes can take effect from a chosen future date.
      source: TRACKER Actions row 194 | MoM 18 Sep 4.2
    sampleData:
      summary: >-
        Guests can buy Day Passes (AED 120 weekdays, AED 140 weekends) and the Family Day Pass online, at the gate and through
        3 resellers from 1 Nov.
    corrections:
    - what: >-
        The layout is the board's navigation outline as text fields ("1. AI Configuration Build Command Center" ... "Board:
        3 of 3").
      why: Board text, not fields; draw the preview.
      source: screens/P09-platform-admin-console.yaml#ADM-488
  ADM-489:
    block: later
    summary: >-
      The first governance gate: is the plan ready to enter approval or execution - objects ready, warnings, blocking issues,
      approvals needed, modules affected, production impact - plus the venue AI profile captured during setup. The one thing
      to get right: a blocking issue disables "Send for approval", and the effective governance policy for the configuration
      assistant (autonomy L3, approval required) is stated.
    outputs:
    - element: readiness
      rule: Tiles with counts; blocking issues list first.
      source: contracts/satellite/ai.yaml#getActionPlan
    - element: governance line
      rule: >-
        "Configuration assistant: L3 Execute with approval. This plan needs approval from: Commercial manager (pricing), Venue
        manager."
      source: contracts/satellite/ai.yaml#getEffectiveAiPolicy | ADR-0050
    - element: venue AI profile
      rule: The baseline figures with pattern defaults greyed; saving here is the same as on ANL-071.
      source: contracts/satellite/ai.yaml#setAiVenueSettings | ADR-0051
    consistency:
    - with: ANL-071
      note: Same venue AI profile form.
    sampleData:
      tiles:
        objects: 46
        ready: 44
        warnings: 2
        blocking: 0
        approvals: 2
        modules: 6
  ADM-490:
    block: later
    summary: >-
      Validation evidence: for each validation layer (schema, module rules, dependencies, governance, simulation) what was
      checked and the result, per object. The one thing to get right: it is evidence for an approver - each pass is as visible
      as each failure, with the rule named.
    outputs:
    - element: evidence table
      rule: Layer, object, rule, result, detail; filter to failures.
      source: contracts/satellite/ai.yaml#simulateActionPlan | contracts/satellite/ai.yaml#getActionPlan
    sampleData:
      rows:
      - layer: Governance
        object: Price Day Pass Sat
        rule: Price change approval tier 1
        result: Approval required
  ADM-491:
    block: later
    summary: >-
      AI recommendations and best practice kept apart from mandatory configuration, so the administrator knows what is required
      and what is the assistant's advice - with each recommendation's decision recorded (accepted, modified, rejected by whom
      and why). The one thing to get right: rejecting a recommendation is a normal outcome, recorded with a reason, never
      nagged again in the same session.
    outputs:
    - element: recommendation list
      rule: Recommendation, why, decision, by, reason; mandatory items in a separate section.
      source: contracts/satellite/ai.yaml#/components/schemas/AiBlueprintDecision (recommendation, decisionClass)
    sampleData:
      row:
        recommendation: Add a Family Package
        decision: Rejected
        by: Administrator (Omar Haddad)
        reason: Family pricing handled by promotions
    corrections:
    - what: Columns are a board row ("Family Package", "Rejected", "Administrator").
      why: Values, not columns; and purpose is cut mid-sentence ("so the administrator understands what").
      source: screens/P09-platform-admin-console.yaml#ADM-491
      status: fixed
      by: CHG-WIR-013
  ADM-492:
    block: later
    summary: >-
      Approval of the configuration plan through TICVAI's central approval engine and RBAC - not a separate AI approval system.
      Approvers see each proposed action with current vs proposed, impact and risk, and approve or reject with a reason. The
      one thing to get right: an AI-prepared change goes to approval even when the requester could make it by hand (autonomy
      is separate from permission), and proposals expire.
    outputs:
    - element: proposals
      rule: >-
        Summary, target module and operation, current → proposed, risk, approval tier, status, expires at (proposed: 7 days;
        approved but not applied: 24 hours).
      source: >-
        contracts/satellite/ai.yaml#listProposedActions | contracts/satellite/ai.yaml#/components/schemas/ProposedAction |
        ADR-0050
    actions:
    - action: Approve / Reject
      result: Reject needs a reason; the requester cannot approve their own plan.
      source: contracts/satellite/ai.yaml#decideProposedAction
    sampleData:
      proposal:
        summary: Create 12 products, 48 prices, 3 bundles for Coastal Aqua
        tier: 2
        approvers:
        - Commercial manager
        - Venue GM
        expires: Thu 8 Oct
    corrections:
    - what: >-
        "Approve workflow" button bound to catalogue approveWorkflow (PRODUCT_CONFIGURE), which designs approval workflows.
      why: >-
        Designing a workflow is not approving this plan; approval is decideProposedAction (or the central approval engine).
        Remove approveWorkflow here.
      source: contracts/spine/catalogue.yaml#approveWorkflow | contracts/satellite/ai.yaml#decideProposedAction
      status: fixed
      by: CHG-WIR-012
    - what: No AI-generated summary for the approver.
      why: The approval engine requirement asks for an AI-generated summary on approval screens.
      source: TRACKER Actions row 76
  ADM-493:
    block: later
    summary: >-
      Execution of the approved plan against the owning modules in dependency order, traceably. The one thing to get right:
      a person can pause at any step boundary (nothing half-applies) or cancel; on a partial failure the plan rolls back rather
      than leaving a product half-configured.
    actions:
    - action: Pause
      result: Executor stops at the next step boundary; recorded as an intervention (AI_APPROVE).
      source: contracts/satellite/ai.yaml#pauseActionPlan
    - action: Cancel action plan
      result: Destructive confirmation naming what has already been applied and what will not run; reason required.
      source: contracts/satellite/ai.yaml#cancelActionPlan
    outputs:
    - element: steps
      rule: >-
        Ordered steps with tool, target, status; executing step animated; each step's idempotency means a retry never duplicates.
      source: contracts/satellite/ai.yaml#getActionPlan | MoM 21 Sep 4.9
    sampleData:
      plan:
        status: executing
        steps:
        - Venue ✓
        - Operating calendar ✓
        - Products ✓
        - Timeslots ✓
        - Capacity …
        - Pricing ○
        - Channels ○
  ADM-494:
    block: later
    summary: >-
      Live execution and dependency monitor: each step's status (waiting, executing, success, failed), what it waits on, retries
      and downstream status. The one thing to get right: a failed step shows the owning module's error and the choices - retry
      the step, pause, or roll back - with what each does.
    outputs:
    - element: dependency chain
      rule: Steps as a chain with status icons and the blocking dependency highlighted.
      source: contracts/satellite/ai.yaml#getActionPlan
    actions:
    - action: Retry step / Resume
      result: Retries the failed step (idempotent); resume revalidates before continuing.
      source: contracts/satellite/ai.yaml#retryActionStep | contracts/satellite/ai.yaml#resumeActionPlan
    sampleData:
      failed:
        step: Pricing
        error: 'Catalogue: channel price list ''Resellers'' does not exist'
        attempts: 1
    corrections:
    - what: Statuses and step names are table columns ("Venue ✓", "Capacity ●", "Waiting").
      why: Steps are rows; status is a column.
      source: screens/P09-platform-admin-console.yaml#ADM-494
  ADM-495:
    block: later
    summary: >-
      What was actually created or changed: each TICVAI object with its id, module, before and after, linked to the plan step
      that made it. The one thing to get right: object ids link into the owning screens, and rollback is offered as a planned
      rollback (with forward-fix preferred where reversing is unsafe).
    outputs:
    - element: object mapping
      rule: Plan step → object id (e.g. VEN-1028, TKT-4012, SCH-0291, PRC-3002) → module → change; each id a link.
      source: contracts/satellite/ai.yaml#getActionPlan
    actions:
    - action: Plan a rollback
      result: >-
        Creates a rollback plan (origin rollback) that goes through approval like any plan; reason required; prefer forward
        fix option.
      source: contracts/satellite/ai.yaml#rollbackActionPlan
    sampleData:
      objects:
      - VEN-1028
      - TKT-4012
      - SCH-0291
      - CAP-0218
      - PRC-3002
      - MED-0082
      - ACC-0142
    corrections:
    - what: Object ids are table columns.
      why: Rows.
      source: screens/P09-platform-admin-console.yaml#ADM-495
  ADM-496:
    block: later
    summary: >-
      Change existing configuration in natural language ("raise weekend adult prices by AED 10 from November", "add a sunset
      session on Fridays"): the assistant asks what it needs, prepares the change as a plan, and it goes through the same
      validation and approval. The one thing to get right: it shows the before/after and the affected bookings before "Prepare
      change"; purchased tickets never change retroactively.
    actions:
    - action: Prepare change
      result: Builds a plan from the session (intent modify) and opens validation.
      source: contracts/satellite/ai.yaml#buildConfigurationPlan | contracts/satellite/ai.yaml#startConfigurationSession
    sampleData:
      request: Raise weekend adult Day Pass by AED 10 from 1 Nov
      preview: 'Day Pass Adult Sat/Sun: AED 140 → AED 150 from 1 Nov; 1,204 existing bookings unaffected'
    corrections:
    - what: '"Prepare Change | Ask More | Cancel" as one button.'
      why: Three actions.
      source: screens/P09-platform-admin-console.yaml#ADM-496
  ADM-497:
    block: later
    summary: >-
      History of AI-created and AI-modified configuration: sessions, plans and their versions, with governed rollback where
      technically possible. The one thing to get right: each entry shows who asked, what the AI proposed, who approved and
      when it was published - the client's example is every price change.
    outputs:
    - element: history
      rule: Session → plan → executed changes, newest first; who suggested, who approved, when published.
      source: DI-938 | contracts/satellite/ai.yaml#listConfigurationSessions | contracts/satellite/ai.yaml#getActionPlan
    sampleData:
      entry:
        change: Day Pass Adult weekend AED 140 → 150
        suggested: Configuration assistant (requested by Omar Haddad)
        approved: Priya Nair, 2 Oct 11:05
        published: 2 Oct 11:20
  ADM-498:
    block: later
    summary: >-
      The immutable audit of AI's part in configuration: from user request to AI interpretation, blueprint decision, object,
      validation, approval and execution, each with actor, time and trace id, searchable by venue, user, session, plan, object
      and module. The one thing to get right: every value's source is visible - user provided, AI recommended, system derived,
      existing configuration.
    outputs:
    - element: decision chain
      rule: >-
        Request → interpretation → decision → object → validation → approval → execution as a vertical chain with timestamps
        and actors; before/after; failure/retry; rollback.
      source: contracts/satellite/ai.yaml#getAiDecisionTrace | MoM 18 Sep 4.7
    - element: counts
