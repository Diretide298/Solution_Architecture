        overdue: 1
        executing: 1
        interventionsToday: 4
  ADM-530:
    block: later
    summary: >-
      Who approves which AI action, in what order and within what time, based on risk and amount - through the shared approval
      matrix, not a separate AI approval system (kind aiRecommendation). The client's example: a pricing change routes commercial
      manager → venue GM → commercial director. The one thing to get right: test a routing before saving - "an AI price increase
