  BO-130:
    block: A
    summary: >-
      What a till, kiosk or device may do with no network, and for how long: allowed actions by data class, ceilings
      on value and on count, and what happens at the ceiling. It also lists the offline transactions the server
      refused, which a supervisor resolves remotely. Offline switching is automatic; the policy sets the limits.
    inputs:
    - field: allowedOffline
      rule: >-
        A checklist grouped Safe offline (sale, entitlement validate, no sale) and Risky offline (refund, exchange,
