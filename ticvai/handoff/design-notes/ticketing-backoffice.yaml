  ADM-055:
    block: A
    summary: >-
      Where a price comes from when several layers could supply it (global, market, venue, event, product, channel,
      segment): an ordered list of levels saved as a whole, so two sources can never sit at equal priority. The
      client decided the hierarchy decides; there is no lowest-price default.
    inputs:
    - field: levels
      rule: >-
        Drag-to-order list with a "falls back to" arrow between levels; saving sends the whole order.
      source: contracts/spine/catalogue.yaml#setPriceHierarchyInheritance | DI-592 | DI-595
    outputs:
    - element: worked example
      rule: >-
        Pick a product and channel and see which level supplied its price today ("Dune Park venue list, because
        no event price exists").
      source: designer default
    consistency:
    - with: BO-441
      note: >-
        Rule priority (which adjustment wins) is a separate screen; name both clearly so they are not confused.
    sampleData:
      hierarchy:
        name: UAE default
        levels:
        - Contract / corporate rate
        - Event price
        - Venue price list
        - Market price list
        - Global base
    corrections:
    - what: >-
