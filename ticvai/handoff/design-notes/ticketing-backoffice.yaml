      The kinds of event and how each behaves: whether it has performances at all, capacity per performance, per
      day or unlimited, whether a ticket names a date, multi-day, registration or accreditation required, seating
      modes allowed. The type decides behaviour, not just a label.
    inputs:
    - field: behaviour switches
      rule: >-
        Each switch with its consequence ("Has performances off: an open-run exhibition sells by day").
      source: contracts/spine/catalogue.yaml#setEventType
    sampleData:
      types:
      - code: TIMED-SHOW
        name: Timed show
        hasPerformances: true
        capacityBasis: perPerformance
      - code: EXHIBITION
        name: Open-run exhibition
        hasPerformances: false
        capacityBasis: perDay
    corrections:
    - what: >-
        setEventType writes at tenant scope while listEventTypes reads at venue scope, on a venue screen.
      why: A venue user may not be able to save; show "applies to the whole tenant" or align scopes.
      source: contracts/spine/catalogue.yaml#setEventType
      status: fixed
