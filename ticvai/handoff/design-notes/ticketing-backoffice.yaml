        direction: import
        from: uat
        to: production
        products: 18
        missingReferences:
        - tax profile AE-VAT-5
    decisions:
    - question: After go-live, is configuration promoted from pre-production to production only as configuration?
      decision: 'Industry standard for production change: never merge or reverse-migrate production databases. Schema goes
        forward-only through versioned migrations (expand then contract). Configuration moves as a versioned package exported
        with stable keys, diffed against production, approved, applied as an idempotent upsert by key, and audited; rollback
        re-applies the previous package. Secrets and environment settings never travel in it.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-168 | CHG-NOTE-006
      questionSource: TRACKER Actions row 284
