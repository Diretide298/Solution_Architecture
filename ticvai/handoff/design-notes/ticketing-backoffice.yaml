      source: contracts/satellite/transport.yaml#getTransportNetworkImport
    actions:
    - action: Apply
      result: >-
        One transaction; the confirmation repeats that nothing goes on sale until each route is activated with a
        fare table and a published timetable.
      source: contracts/satellite/transport.yaml#applyTransportNetworkImport
    edgeCases:
    - case: Import link opened later
      expected: >-
        Shows where it stands (validating, ready for review, failed, applied, expired needing a new upload).
