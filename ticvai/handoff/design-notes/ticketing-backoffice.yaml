    sampleData:
      import:
        file: dune-shuttle-network.zip
        format: csvBundle
        status: previewReady
        create:
          stations: 6
          routes: 4
          timetables: 4
        update:
          stations: 1
        findings:
          errors: 0
          warnings: 2
