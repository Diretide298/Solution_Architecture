        so the list is a to-do, not a log.
      source: contracts/spine/orders.yaml#listSyncRejections | F33 step 7
    actions:
    - action: Resolve rejection
      result: >-
        Posts the sale against the retired product at the price the guest paid (the catalogue moved, the transaction
        did not) and removes it from the unresolved view.
      source: F33 step 8
