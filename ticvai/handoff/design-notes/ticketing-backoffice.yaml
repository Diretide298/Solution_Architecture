      by: CHG-WIR-027
  BO-022:
    block: C
    summary: >-
      Everything about one order in one place: lines, guest, payments, refunds, statement, tax invoice and credit
      memos, with the after-sales actions of BO-023 available from it.
    outputs:
    - element: order header and statement
      rule: >-
        Order number, channel, status badge, guest, totals; the statement with a running balance; card masked to
        the last four.
      source: contracts/spine/orders.yaml#getOrderStatement | DI-069
    - element: tax documents
      rule: >-
        Tax invoices and credit memos with PDF in English or Arabic; "Issue tax invoice" for a paid order that has
        none (simplified, full or consolidated).
      source: >-
        contracts/spine/finance.yaml#issueTaxInvoice | contracts/spine/finance.yaml#getTaxDocumentRendition
    consistency:
    - with: BO-023
      note: Same order header and the same after-sales dialogs.
    sampleData:
      order:
        number: DP-2026-104882
        channel: Website
        status: Paid
        guest: Mariam Al Suwaidi
        total: AED 1,180.00
        taxInvoice: TI-AE-2026-008812
  BO-023:
    block: A
    summary: >-
      The staff desk for after-sales on one order: refund (whole or some lines), void, exchange, reschedule, modify,
      manual discount, reprint, credit memo, all against the order's statement. Used by box office supervisors and
      the call centre, and at step 3 of an event cancellation to review refund exposure. The thing to get right
      is choosing the right act: void only before settlement in the same shift, otherwise refund; date change is
      reschedule, not refund and resell.
    inputs:
    - field: refund amount and lines
      rule: >-
        Pick lines (or the whole order); the amount is proposed from the venue's refund policy time bands ("72 hours
        or more before: 100%; 24 to 72 hours: 50%; under 24 hours: none") and can be overridden only by an authorised
        approver with a custom percentage. The policy band that applied is shown beside the amount.
      source: contracts/spine/orders.yaml#getRefundPolicy | DI-252 | TRACKER Actions row 79
    - field: secondaryAuthorisation
      rule: >-
        Appears only when the amount is above the venue's "second user above" threshold: a second user (cashier
        or supervisor) signs in inline and is named on the refund. Above the approval threshold the refund is submitted
        for approval instead (pendingApproval).
      source: contracts/spine/orders.yaml#createRefund | MATRIX 2.12.3
    - field: refund destination
      rule: >-
        Original tender by default; another tender (TICVAI wallet, store credit, bank transfer) only where the refund-to-wallet
        policy allows, named in the venue's words.
      source: >-
        contracts/spine/orders.yaml#createRefund | screens/P08-venue-back-office.yaml#BO-1146 | DI-673
    - field: void reason
      rule: >-
        Picked from the void list (Guest changed mind, Entered in error, Item unavailable, Quality issue, Duplicate,
        Other); Other requires a note (PR-6).
      source: contracts/spine/orders.yaml#/components/schemas/VoidReason | R125 | R222
    - field: manual discount
      rule: >-
        Amount or percentage, a free-text reason (at least 3 characters) and, above the venue threshold, an approver
        who is not the requester.
      source: contracts/spine/orders.yaml#applyManualDiscount | MATRIX 4.2.3
    outputs:
    - element: order statement
      rule: >-
        Every payment, refund, void, modification and exchange in time order with a running balance; card shown
        masked to the last four digits only.
      source: contracts/spine/orders.yaml#getOrderStatement | DI-069
    - element: exchange or reschedule result
      rule: >-
        Outgoing value, incoming value, fee (waivable with permission) and the difference to pay or refund, before
        confirming.
      source: >-
        contracts/spine/orders.yaml#exchangeOrderLines | contracts/spine/orders.yaml#rescheduleOrder
    - element: credit memos
      rule: >-
        Where a tax invoice was issued, the refund produces a credit memo; list them with a PDF link in English
        or Arabic.
      source: >-
        contracts/spine/finance.yaml#issueCreditMemo | contracts/spine/finance.yaml#getTaxDocumentRendition
    actions:
    - action: Refund
      result: >-
        Ledger first, then gateway; status shows Pending gateway until the provider confirms, and the ticket moves
        to Refunded with the refund linked to it.
      source: contracts/spine/orders.yaml#createRefund | MATRIX 2.12.13
    - action: Void
      result: >-
        Whole order only; refused after settlement or outside the shift with "use Refund"; the dialog names the
        tickets it revokes.
      source: contracts/spine/orders.yaml#voidOrder
    - action: Reschedule
      result: >-
        The new performance is held before the original is released; if the new date is full nothing changes.
      source: contracts/spine/orders.yaml#exchangeOrderLines
    edgeCases:
    - case: A line whose ticket has already been scanned
      expected: It cannot be removed or refunded through modify; the row says "Used 14 Oct 10:42".
      source: contracts/spine/orders.yaml#modifyOrder
    - case: Bulk refund after an event cancellation
      expected: >-
        Refunds for a whole event are authorised on the bulk refund screen (F09 step 4); this screen shows the exposure
        and links there.
      source: F09 step 3 | DI-269
    - case: Refund window passed or performance in the past
      expected: >-
        The refund action explains the policy that blocks it and offers the approver override path where permitted.
      source: contracts/spine/orders.yaml#getRefundPolicy
    consistency:
    - with: BO-1146
      note: The destinations offered must match the refund-to-wallet policy configured there.
    - with: ADM-611
      note: Refund policy rules on the TICVAI Console use the same time-band vocabulary.
    sampleData:
      order:
        number: DP-2026-104882
        channel: Website
        guest: Mariam Al Suwaidi / مريم السويدي
        total: AED 1,180.00
        status: Paid
        card: Visa •••• 4417
      lines:
      - t: Day Pass Adult x2, 14 Nov 2026
        a: AED 590.00
      - t: Day Pass Child x2
        a: AED 490.00
      - t: Fast Track Express x2
        a: AED 100.00
      refundPolicy:
        selfAuthoriseLimit: AED 500.00
        secondUserAbove: AED 500.00
        approvalAbove: AED 2,000.00
        bands:
        - 72 h+ 100%
        - 24-72 h 50%
        - under 24 h 0%
    corrections:
    - what: >-
        createOrder and holdOrder/resumeOrder (till operations, workstation scope) are on this back-office screen.
      why: >-
        A refunds desk does not park sales or create orders at a workstation; they belong to the POS (venue-operations
        / fnb-retail processes).
      source: contracts/spine/orders.yaml#holdOrder | contracts/spine/orders.yaml#createOrder
      status: fixed
      by: CHG-WIR-025
  BO-024:
    block: A
    summary: >-
      Payments that never resolved themselves: a card charged with no response, an authorisation never captured,
      a deposit not settled, deposit boxes left open at close. A supervisor finds them and resolves each by asking
      the provider what actually happened, never by assuming failure. The rate shown on a foreign-currency payment
      is the one stored on it, not today's.
    outputs:
    - element: exception list
      rule: >-
        Grouped by kind (Pending confirmation, Authorised not captured, Deposit to settle, Box not closed), oldest
        first, with age, amount, tender, terminal and provider reference; a payment past the background reconciler's
        threshold is flagged.
      source: contracts/spine/orders.yaml#inquirePaymentStatus | F99 step 2
    - element: foreign tender
      rule: >-
        Shows tender currency and amount, the stored rate and its source (manual, feed, card scheme), and the venue-currency
        amount.
      source: contracts/spine/orders.yaml#createPayment | screens/P08-venue-back-office.yaml#BO-024
    actions:
    - action: Ask the provider
      result: >-
        Queries the provider and reconciles; the row updates to Captured, Declined or Failed with the provider's
        answer and time.
      source: contracts/spine/orders.yaml#inquirePaymentStatus
    - action: Settle deposit
      result: >-
        Four outcomes, convert to revenue, return, forfeit, partly forfeit, none of them a refund; partial forfeit
        asks the amount kept and a reason.
      source: contracts/spine/finance.yaml#settleDeposit
    - action: Close deposit boxes
      result: >-
        One box or all open at the venue; a box closed without its holder is flagged with who counted it, not blocked.
      source: contracts/spine/shift.yaml#closeDepositBoxes | F32 step 8
    edgeCases:
    - case: Provider still has no answer
      expected: Stays Pending confirmation with "last asked 14:02"; never shown as failed.
      source: contracts/spine/orders.yaml#createPayment
    sampleData:
      exceptions:
      - kind: Pending confirmation
        order: DP-2026-104901
        amount: AED 590.00
        tender: Card •••• 0921
        terminal: Gate 2 POS-04
        age: 38 min
      - kind: Deposit to settle
        booking: Cabana B09
        amount: AED 300.00
        reason: rental
      - kind: Box not closed
        box: Till 07 drawer
        holder: Ahmed Khan
        age: 1 h 12 min
    corrections:
    - what: createPayment and addTip are offered as forms on an exceptions screen.
      why: >-
        Taking a new payment or adding a tip is a till act (workstation scope); the exceptions screen resolves existing
        payments.
      source: contracts/spine/orders.yaml#addTip | contracts/spine/orders.yaml#createPayment
      status: fixed
      by: CHG-WIR-025
    - what: >-
        No read operation: the screen declares only createPayment, addTip, capturePayment, inquirePaymentStatus,
        closeDepositBoxes, settleDeposit and nothing that returns the current configuration.
      why: >-
        It opens as an empty form even where a configuration exists; it needs a get or list for the same record
        (PR-9).
      source: >-
        contracts/spine/orders.yaml#createPayment | contracts/spine/orders.yaml#addTip | contracts/spine/orders.yaml#capturePayment
        | contracts/spine/orders.yaml#inquirePaymentStatus | contracts/spine/shift.yaml#closeDepositBoxes | contracts/spine/finance.yaml#settleDeposit
        | screens/P08-venue-back-office.yaml#BO-024
      status: fixed
      by: CHG-WIR-025
