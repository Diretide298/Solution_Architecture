# Design notes for the ticketing-backoffice process (Ticketing & Guest Commerce on Venue Management P08 and the TICVAI Console P09).
# AUTHORED (see README.md in this folder). 728 screens: Block A 53 and Block B 205 in full, the 470 later screens at minimum depth.
# Process-wide rules are PR-1 to PR-10 in processSummary; screen entries refer to them instead of repeating them.
# Corrections are change requests for the lead; several are systemic (write-only screens, bare-array lists, pack page numbers in names).
process: ticketing-backoffice
title: Ticketing & Guest Commerce, as the venue and TICVAI configure and run it
owner: ticketing-backoffice process agent, 1 October 2026
processSummary:
  text: >-
    WHAT THE PROCESS IS. Everything a guest can buy is set up, priced, promoted and serviced here, on Venue Management
    (P08, the venue's own back office, served inside the venue's cell) and on the TICVAI Console (P09, TICVAI's
    control plane, outside every cell). End to end: (1) CATALOGUE. A product has one of twelve kinds (admission,
    timedAdmission, datedAdmission, openDated, seated, membership, bundle, fnb, retail, rental, addOn, giftCard).
    Its ticket types (adult, child, senior, resident...) are not typed one by one: they are generated from the product's
    attributes (components) and each value combination becomes a sellable ticket type with no extra setup (DI-164).
    What a ticket grants (validity, entries, re-entry, days of week, blackout dates, expiry anchor, fast track,
    transfer) lives on a reusable entitlement template, not on the product. Who may take part (age, height, supervision,
    certification) is the eligibility rule; what the guest must answer is the data mask and the consent questions;
    how the guest sees it is guestListing (bookable, infoOnly, hidden), display tags (at most six), media and the
    booking flow. Group, family and corporate products and every after-sales policy (reschedule, exchange, refund,
    cancellation, upgrade, transfer) are configured inside the one product configuration, never on separate screens
    (DI-465, DI-466). (2) LIFECYCLE AND PUBLICATION. A product moves draft, inReview, approved, live, withdrawn,
    archived. Approval and publication are two acts with two permissions (PRODUCT_APPROVE, PRODUCT_PUBLISH, R091);
    every product is authorised before it sells online or on site (DI-438). Approved is still not on a till: a till
    sells only what is in the signed catalogue release it pulled (publishBundle, ADR-0013), so a saved price is
    a back-office fact until the venue publishes to tills. Changing something that has sold is preceded by an impact
    check (assessProductChange: orders affected, entitlements issued, future performances, open carts); restoring
    a version creates a new version, and sold tickets keep the price and terms they were sold under (restoreProductVersion,
    DI-938, TRACKER Actions row 145). (3) PRICE. Prices live in price lists: per venue, per channel set, with validity
    dates and a priority, copied for the next season with an uplift (copyPriceList) and repriced in bulk only after
    a dry run (bulkChangePrices). Currency and decimal scale are never chosen on a form: they resolve from the venue's
    region (ADR-0008, ADR-0018; AED 2 places, OMR and BHD 3). When several rules apply, the configured hierarchy
    decides; there is no "lowest price wins" default (DI-595). Tax on the pre-discount price and three-decimal rounding
    are regional settings (DI-598). Dynamic rules always show their minimum and maximum price guardrails beside
    the trigger (getDynamicPriceRule). (4) PROMOTE AND BUNDLE. A promotion is a rule (automatic, or gated by a code)
    created in draft, made live only by Publish, which first analyses stacking; a combination leaving a line at
    zero or below is refused (R101) and a budget cap is enforced at checkout, not just reported. A coupon campaign
    issues one shared code or a batch of single-use codes (up to 50,000, generated asynchronously as a file). A
    voucher carries money and is a liability; a coupon only changes the price of something else. A bundle (package)
    is a product whose price differs from the sum of its parts: its revenue allocation is mandatory and its components
    are frozen once one has sold; a dynamic bundle keeps a fixed price and only the allocation moves (ADR-0019).
    (5) MAPS. Seat maps (seating) and venue maps (wayfinding: points, paths, bookable places) are edited as drafts
    and published as versions; publishing validates the path graph and a guest mid-route keeps the version they
    started on. (6) SELL AND SERVICE. Orders arrive from every channel; staff service them here: refund (after settlement,
    policy time bands, a second named user above the venue threshold), void (whole order, before settlement, same
    shift, reason from the void list), exchange and reschedule (settle only the difference; the replacement is held
    before the original is released), manual discount (reason always, approver above threshold), reprint, credit
    memo where a tax invoice was issued. (7) PAY. Payments that never confirmed are recovered by asking the provider
    (inquirePaymentStatus), never by assuming failure; deposits are held, not taken. P09 holds the payment-provider
    estate. (8) WALLET. Stored value: wallet types, funding methods and limits, credit lots consumed nearest expiry
    first, expiry and extension, refund to wallet, risk rules and their governed publication. (9) TRANSPORT. The
    venue builds its own network (REV3-21): stations, then routes (ordered stops), then a fare table, then timetables;
    nothing is on sale until a route is active with a fare table and a published timetable; passes become catalogue
    products. PROCESS-WIDE RULES (each screen below refers to them as PR-n instead of repeating them). PR-1 Scope.
    P08 resolves the venue from the session through the shell's venue switcher (ADR-0030); a "Venue id" text box
    is never drawn, and every id filter (product, price list, route) is a picker showing names. P09 acts inside
    a tenant only after the operator picks the tenant (and venue), under a time-boxed platform-staff grant that
    is audited and visible to the tenant (R098): every P09 screen of this process shows that context and its expiry
    in a persistent banner. PR-2 Money. Amounts show the region's currency code and scale ("AED 1,250.00", "OMR
    12.500"); a price form has no currency picker (updatePriceList: currency and scale cannot be changed). Percentages
    and money are never mixed in one unlabelled field (Discount.kind decides which input shows). PR-3 Save, approve,
    publish. Save writes a draft; Approve and Publish are separate, permission-gated primary actions with a confirmation
    that names what goes live, on which channels and from when. A configuration record (price list, rate, fee, tax
    profile, package pricing) is draft, active, inactive or retired (CatalogueConfigStatus), and a record already
    used by a live price becomes active only through a published change request. Anything a till must see shows
    a "Not yet on tills" badge until the next catalogue release. PR-4 Inheritance. Configuration resolves up tenant,
    region, venue, outlet, nearest wins (ADR-0018): a configuration form shows, per setting, whether it is inherited
    (and from where) or set here, with "Reset to inherited". PR-5 Change impact. Before saving a change to anything
    that has sold, show what it affects in numbers (orders, tickets issued, future performances, open carts) and
    that sold items keep their terms; higher-risk changes take an "applies from" date (TRACKER Actions row 194).
    PR-6 Reasons. Every money-moving or destructive act collects a reason; choosing Other makes a note required
    and the server refuses without it (R222). Actions the user may not take are not offered (the transition picker
    lists only permitted transitions, R091); a module or sub-permission the role lacks is hidden, not disabled (DI-387).
    PR-7 Lists. Tables follow DI-039 (titled card, status badges, pagination) but every list operation pages by
    cursor (nextCursor, hasMore) and returns no total: draw "Showing 1-25" with Next and Previous, not "of 245",
    until a count exists (see the corrections). Empty states follow DI-044: first run (offer Create), filter matched
    nothing (name the filter, offer Clear), no permission (name the permission). PR-8 Languages. Every guest-facing
    text (names, descriptions, labels, display tags, notBookableLabel) is LocalisedText: English and Arabic side
    by side as a minimum (DI-019, DI-080), the Arabic field right-to-left, with the other tenant languages behind
    "More languages"; a missing Arabic value is a warning at publish, not a silent fallback. PR-9 Pack screens.
    Many wave-3 screens were generated from the client's workshop packs and declare a single write operation (setX)
    and no read. Draw them as a form that loads the current value, but treat the missing read as a correction (listed
    per screen), not as licence to invent data; their tables bind only to fields the contract declares. PR-10 One
    product configuration. The client asked for fewer, consolidated configuration screens (DI-474, DI-671, DI-987):
    where several screens of this process edit the same record (product, promotion, price list, wallet type), they
    must look like tabs or sections of one record, with the same header (name, code, status, venue, last change),
    not like separate applications. SAMPLE WORLD. Fictional venues only (handoff/design-batches/DEMO-SITE/BRIEF.md):
    Dune Park (theme park, Dubai, AED, venue code DUNE), Coastal Aqua (water park, Abu Dhabi, AED), the Pearl Museum
    (Sharjah), Harbour Kitchen (food court). Never a real client, venue or logo. P08 OR P09. The same commercial
    configuration appears twice: venue screens on P08 (BO-) and pack-derived screens on P09 (ADM-, module Commercial)
    that call the same venue-scoped operations. Until decided (see the open questions), P08 is the venue's working
    surface and P09 is TICVAI staff acting for a tenant under PR-1; both must use the same vocabulary, components
    and states.
