  BO-018:
    block: B
    summary: >-
      Who is holding capacity right now (tills, kiosks, guest baskets) and for how long, with the supervisor's ability
      to reclaim a hold stranded by a dead terminal. Holds are not reservations; they expire.
    outputs:
    - element: hold list
      rule: >-
        Holder (workstation name or "Guest basket"), envelope, units granted and consumed, expires in (countdown),
        status (Active, Expired, Released, Force released, Converted).
      source: contracts/spine/catalogue.yaml#acquireInventoryHold
    actions:
    - action: Force release
      result: >-
        Reason required; reported consumption is honoured and the remainder returns immediately; the dialog names
        the holder.
      source: contracts/spine/catalogue.yaml#forceReleaseInventoryHold
    sampleData:
      holds:
      - holder: Till 07, Main Gate
        envelope: Day Pass 15 Nov
        granted: 20
        consumed: 14
        expiresIn: 6 min
      - holder: Guest basket
        granted: 4
        consumed: 0
        expiresIn: 13 min
    corrections:
    - what: The screen offers Acquire, Renew and Release hold forms.
      why: >-
        Those are terminal and order-service calls (workstation scope, guests never call them); a supervisor's act
        here is force release.
      source: >-
        contracts/spine/catalogue.yaml#acquireInventoryHold | contracts/spine/catalogue.yaml#relinquishInventoryHold
      status: fixed
      by: CHG-WIR-025
  BO-019:
    block: B
    summary: >-
      Stop selling something for a reason: cancel or suspend performances, close the venue or an attraction on dates,
      close a path on the map. Blackout dates for products such as memberships on public holidays are part of this.
    inputs:
    - field: closure
      rule: >-
        What (performance, product, path), when, reason and the guest message; for sold performances the cancellation
        path (dry run, refund percentage, alternative) applies.
      source: >-
        contracts/spine/catalogue.yaml#cancelPerformance | contracts/satellite/venue-map.yaml#setPathClosure | DI-452
    edgeCases:
